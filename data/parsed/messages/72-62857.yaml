  html: '<font class="dontLookLikeCrap">------------------------------------------------------ <BR> <BR>T H I R D  T U E S D A Y <BR> <BR>18 January 2005 <BR> <BR>------------------------------------------------------ <BR> <BR>The Friends of St Bride Library have joined forces with TypoCircle to form the Third Tuesday Club. The club will meet at 1830 on the third Tuesday of each month in the back room of the Punch Tavern, Fleet Street. The purpose of the club is purely social: there will be no lectures, no exhibitions, it is simply an occasion for like minded people with a passion for typography to gather for a convivial evening of conversation. There will be a FREE bar courtesy of the Friends and TypoCircle. The first meeting will be held on Tuesday 18 January 2005 when a warm welcome will be extended to all Friends of St Bride Library. <BR> <BR>For further details please visit: <BR><a href="http://www.stbride.org" target="_blank">www.stbride.org</a>  or  <a href="http://www.typocircle.co.uk" target="_blank">www.typocircle.co.uk</a> <BR> <BR>or email: <BR>bruno[at]daltonmaag[dot]com  or  friends[at]stbride[dot]org <BR> <BR> <BR>NB. the Punch Tavern is at Ludgate Circus, in the block between the Fleet Street entrance to Bride Lane and New Bridge Street.</font>'
