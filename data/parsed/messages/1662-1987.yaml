    date_raw: Friday, August 09, 2002 - 05:08 pm
    votes: null
    html: Seeing as you can choose which characters to embed, the information in the flash file will likely be redundant to anyone ripping the font. And seeing as Flash uses its own renderer for embedded fonts, I highly doubt that the information in the flash file, even if all characters were encoded, was useful. As for Designers using the zoom function to get high res copies, that&#39;s possible, but Flash doesn&#39;t kern the fonts as a professional program would. So any sentences in a really nice font would doubtless look ugly. <BR> <BR>Hmm... getting my submission ready. Viewers comments helped shaped my tee. There seems to be a surprising &#34;I wouldn&#39;t wear &#42;that&#42; because it is too girly&#34;. To me, that runs contrary to the aim of this competition - to highlight good design, and to encourage others to showcase that designers work. I am comfortable enough in my sexuality that I could wear pretty much anything besides a dress, if I thought it made a positive impact &#40;I realize here I may be slightly eccentric, as I have never shied away from brightly coloured shirts etc.&#41; <BR> <BR>Matthew
