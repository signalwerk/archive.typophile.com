    html: Wow!! <BR>I had know idea how making a comment toward the colours of somones design would have sparked so many comments. I was only stating a personal opinion. I am a graphic artist for a screen printer and I recently took several classes that focused on the versitility of design whether in print or web and how a good design is designed with the largest targeted audience as a priority and still makes the statement that was intended. Many of the clients I have worked with worry about colour combinations and that the&#39;re not gender specific. I liked the design Typop but intended to suggest more neutral colors. I like yellow and would wear it and I liked the design.  <BR>I also agree with Alex&#39;s statement that a shirt design needs to grabs someones attention within a few seconds to be affective.  <BR> <BR>Diane
