  html: '<font class="dontLookLikeCrap">&#34;IN YOUR FACE&#34; - the MyFonts.com Newsletter - February 2004 <BR> <BR> <BR>======================================= <BR> <BR>THIS MONTH AT MYFONTS.COM - INTRODUCTION <BR> <BR>Four major debuts this month, two from Russia and two from the United States. But before that, let me give you a taste of our plans for displaying your design work. We&#39;ll display the work of all MyFonts users who&#39;d like to show others what happens when you &#34;beat the system fonts&#34; and choose something original! Read more below, and watch this space. <BR> <BR>There has been much healthy Russian activity in the digital font scene since the fall of the Soviet Union, and our two new Russian companies have an interconnected history. Early in the 1990s, Yuri Yarmola of St. Petersburg started programming &#34;FontLab&#34;, a program that would become the definitive font creation software before the decade was out. It gives me great pleasure to introduce this cornerstone of modern typeface design to MyFonts.com. Before they spun off as a separate company - the Fontlab Ltd. marketing operation is now based in North America - the early development work was requested by ParaGraph, a Moscow company that inherited the designs and staff of the old Soviet type design agencies, but wished to move to the digital era. Now known as ParaType, the collection of digital fonts that resulted &#40;and continues to grow&#41; stands comparison with the best of European and American design houses, with highly tuned technical skills and historical sensitivities. Read more about Fontlab and ParaType below. <BR> <BR>Thirstype&#39;s designs have long been sought after by discerning corporations willing to take the risk. &#40;They&#39;re always well rewarded as a result!&#41; Having produced, for strictly design/scientific research purposes, probably the world&#39;s ugliest typeface &#40;we can&#39;t repeat its name in a family publication...&#41;, Thirstype founder, Rick Valicenti went on to enlist some rising typographic stars, and the Thirstype library became known alongside Emigre, House, and Font Bureau as one to watch. Check out the fuller introduction below. <BR> <BR>Finally, those of you, perhaps as penniless teenagers &#40;or students&#41; before the days of desktop publishing, who became addicted to wonderful letterforms will rejoice in the news that we&#39;ve signed up Dan X. Solo to MyFonts.com. He&#39;s the guy behind that classic, affordable series of books from Dover Publications displaying fonts from Dan&#39;s &#34;Solotype collection&#34;. Since the age of 14 &#40;during World War II&#41;, Dan has been on the look-out for unusual fonts - in film, wood and metal - and his collection is in the thousands. We&#39;re proud to make new digital versions available here. Oh, and don&#39;t miss Dan&#39;s wonderful autobiography, published right here at MyFonts.com! <BR> <BR>Happy font finding in 2004! <BR> <BR>-- Laurence Penney, Editor, &#34;In Your Face&#34; <BR> <BR>P.S. Remember to use the &#39;love&#39; keyword for Valentine&#39;s Day fonts! <BR> <BR> <BR>======================================= <BR> <BR>IN THIS ISSUE: <BR> <BR>1. NEW FOUNDRIES AT MYFONTS.COM: <BR>   ParaType - Thirstype - Solotype - Fontlab <BR>   MADType - David Thometz - Churchward <BR> <BR>2. THE MYFONTS GALLERY - coming soon <BR> <BR>3. MORE FONTS FROM OUR EXISTING FOUNDRIES <BR>   Storm - Bitstream - IHOF - Misprinted Type <BR>   Mark Simonson - Tail Spin Studio - Letraset <BR> <BR>4. REGULARS <BR> <BR>&#40;Please see end of message for how to unsubscribe.&#41; <BR> <BR> <BR>====================================================== <BR> <BR>NEW FOUNDRIES #1: PARATYPE <BR> <BR>&#42; The ParaType library is our major addition from Russia, consisting of more than 370 typefaces. In the spirit of the perestroika changes and following the collapse of the Soviet Union, a group of type designers quit the state-owned Polygraphmash foundry to establish ParaType, the first, and now largest Russian digital type foundry. The ParaType team under the supervision of Art Director Vladimir Yefimov creates new typefaces and explores the Russian typographic heritage by making digital versions of existing Russian designs including hits of Soviet typography such as Literaturnaya or Journal Sans. Most ParaType fonts are available in Western/Roman, Central European, Turkish and Cyrillic encodings.  <BR> <BR>The Russian constructivist and avant garde movements of the early 20th century inspired many ParaType typefaces, including Rodchenko, Quadrat Grotesk, Ariergard, Unovis, Tauern, Dublon and Stroganov. The ParaType library also includes many excellent book and newspaper typefaces such as Octava, Lazurski, Bannikova, Neva or Petersburg. On the other hand, if you need a pretty face to knock your clients dead, meet the ParaType girls: Tatiana, Betina, Hortensia, Irina, Liana, Nataliscript, Nina, Olga and Vesna &#40;also check Zhikharev who is not a girl but still very pretty&#41;. <BR> <BR>ParaType also excels in adding Cyrillic characters to existing Latin typefaces -- if your company is ever going to do business with Eastern Europe, you should make them part of your corporate identity! ParaType created CE and Cyrillic versions of popular typefaces licensed from other foundries, including Bell Gothic, Caslon, English 157, Futura, Original Garamond, Gothic 725, Humanist 531, Kis, Raleigh, and Zapf Elliptical 711.  <BR> <BR> <BR>======================================= <BR> <BR>NEW FOUNDRIES #2: THIRSTYPE <BR> <BR>&#42; Thirst &#40;call them &#34;3st&#34; - first, second, thirst&#41;, of Barrington outside of Chicago, is the studio of designer and cultural commentator, Rick Valicenti, rickvalicenti.com. In 1993 Thirstype was formed to make available the typographic research and design experiments from within the Thirst Universe. <BR> <BR>In the early days, Rick was one of a generation of artistically and technically talented designer-geeks &#40;several of whom Rick signed up as Thirstype designers&#41; who explored the limits of what could be done with the new digital font technology. Up for grabs were questions such as: What cool behavior can we program into this font? How much legibility is desirable? Should digital fonts look like a computer made them? Out of this time of experimentation came a more sober period, resulting in modern classics from those same foundries who&#39;d taken part in the early-1990s experimentation. <BR> <BR>In 1995 Rick was joined by chester &#40;yes, that&#39;s a lower-case &#39;c&#39;&#41;, a young type designer from Montreal. Since then they have collaborated to design many important fonts. Two that stand out, &#34;Apex Sans&#34; and &#34;Infinity&#34;, are both highly adaptable for corporate identity &amp; logo use. <BR> <BR>In fact, a remarkable proportion of Thirst designs come in a great range of weights. &#34;Punch&#34; is a definitive decorative bitmap offering of Rick and Gregg Brokaw: check out the amazing potential of bitmap fonts with the R1-4 and S1-4 variants. &#34;Pixella&#34; is chester&#39;s bitmap font: we admire him for grappling with bitmap italics! Finally - remember dot-matrix printers? Well, as the &#34;Rheostat&#34; system &#40;in Fahrenheit and Celsius flavors&#41; demonstrates, the medium&#39;s not without its charm! <BR> <BR>- <a href="http://www.myfonts.com/foundry/thirstype/" target="_blank">http://www.myfonts.com/foundry/thirstype/</a> <BR> <BR> <BR>======================================= <BR> <BR>NEW FOUNDRIES #3: SOLOTYPE <BR> <BR>&#42; The Solotype Collection &#40;Alameda, California&#41; is the set of digital fonts made from the vast archives of Dan X. Solo. When he had time off from his career as a radio actor and a magician &#40;still performing at the age of 75!&#41;, he was likely to be preparing another book for Dover Publications, one of those which introduced so many of us to the delights of unusual typefaces from the past. <BR> <BR>Our favorites are &#34;Excelsis&#34;, a spooky, narrow, squarish design with dangerous serifs; &#34;Bindweed&#34;, a bobbly design based on old American wood type; and &#34;Moulin Rouge&#34;, an Art Nouveau design from the early 20th century. Wood type fans will also be happy to find &#34;Assay&#34; and &#34;Minnesota&#34;, both suitable for poster work with a flavor of the US west. <BR> <BR>- <a href="http://www.myfonts.com/foundry/solotype/" target="_blank">http://www.myfonts.com/foundry/solotype/</a> <BR> <BR> <BR>======================================= <BR> <BR>NEW FOUNDRIES #4: FONTLAB <BR> <BR>&#42; Fontlab Ltd. makes software applications for those who want to do more with fonts than just use them. With the management and the sales division in the USA, and a group of programmers in St. Petersburg, Russia, this truly multinational company is best known for their flagship product &#34;FontLab 4.6&#34;. The features and continuous improvements of this high-end font editor make it the first choice for most professional type designers. In addition, the company offers several other applications at the affordable, semi-pro level. <BR> <BR>We&#39;re selling two products: &#34;TransType&#34; and &#34;TypeTool&#34;. TransType turns a Windows font into a Mac font, or TrueType into PostScript &#40;and vice-versa&#41;. Very useful if you use fonts on multiple platforms, especially if your application just doesn&#39;t support the other type. TypeTool is the &#39;lite&#39; edition of FontLab, and has all the essentials for the type designer. In fact, some of the fonts at MyFonts.com are created with TypeTool. TypeTool also allows you to fiddle with existing fonts &#40;for your own personal use only, please mind the user license!&#41; by adding special characters or changing some letters. The programs are a whisker under $100 each and are available in both Mac OS and Windows editions. <BR> <BR>- <a href="http://www.myfonts.com/info/fontlab-transtype/" target="_blank">http://www.myfonts.com/info/fontlab-transtype/</a> <BR>- <a href="http://www.myfonts.com/info/fontlab-typetool/" target="_blank">http://www.myfonts.com/info/fontlab-typetool/</a> <BR> <BR> <BR>======================================= <BR> <BR>SHOW US WHAT YOU&#39;RE DOING WITH OUR FONTS! <BR> <BR>Do you have design in your blood? Well, we think you do, since you use MyFonts.com to find, try, and buy fonts online. But we&#39;d like you to prove it by sending us designs you&#39;ve made using fonts from MyFonts.com. Posters, images, web pages, newsletters, ads, t-shirts, photos, collages, book covers, even tattoos - we&#39;d like to see them all. Any place you used a font counts as a design! We&#39;ll feature your designs at MyFonts.com, where you can see and take inspiration from each other&#39;s work. And - we&#39;ll award prizes for the best! <BR> <BR>Submission details and more will be explained in our next newsletter. Don&#39;t send the images yet, but if you have a question in the meantime, e-mail us at: <BR> <BR><a href="mailto:mydesigns@myfonts.com">mydesigns@myfonts.com</a> <BR> <BR>We want to hear from you! <BR> <BR> <BR>======================================= <BR> <BR>MORE NEW FOUNDRIES <BR> <BR>&#42; DAVID THOMETZ DESIGN &#40;South Jordan, Utah&#41; is the home of the fonts of David Thometz, a freelance graphic designer, typographer, type designer, writer, and illustrator. We loved &#34;Hefeweizen&#34;, a jaunty Germanic blackletter design. No &#40;before you ask&#41;, it wasn&#39;t just because it&#39;s named after one of our favorite beers! Its accompanying ligature and alternate sets really are unusual: we see a most versatile future for this typeface family. Decorate your designs with the splendid collection of typographic ornaments and symbols contained in &#34;Seriatim Ornaments&#34;. Suns, moons, cats, hearts, knotwork, arrows, shells, pentagrams, fists, even the Eye of Horus from ancient Egypt - all are squeezed in. With no dead weight, David seems to have packed in the best symbols from many symbol fonts. Best of all, the complete Seriatim typeface family &#40;coming soon&#41; comprises a genuinely new take on the geometric sans theme. <BR>- <a href="http://www.myfonts.com/foundry/thometz/" target="_blank">http://www.myfonts.com/foundry/thometz/</a> <BR> <BR>&#42; CHURCHWARD TYPE is the foundry of Joseph Churchward, originally of Samoa, now working in Wellington, New Zealand. This experienced designer first offered his lettering skills as a freelancer in 1962, and went on to form one of New Zealand&#39;s largest typesetting companies. His designs have been published by D. Stempel, Linotype, Mecanorma, and others. With the help of David Buck of SparkyType &#40;whose fonts are already on sale at MyFonts.com&#41; many of Joseph&#39;s fonts have been turned into digital fonts: our favorites are the Pacific-drenched &#34;Maori&#34; and &#34;Ta Tiki&#34;, the friendly multi-weight sans &#34;Samoa&#34;, and also &#34;Design Lines&#34;, a stripy design straight out of the 1970s. <BR>- <a href="http://www.myfonts.com/foundry/churchward/" target="_blank">http://www.myfonts.com/foundry/churchward/</a> <BR> <BR>&#42; MADTYPE &#40;Atlanta, Georgia&#41; is Matt Desmond&#39;s one-man type foundry. Matt is well-known as one of the founders of Test Pilot Collective. &#34;Mang&#34; is Matt&#39;s bold bitmap design, with matching light version set on equal character widths. &#34;Rubba&#34;, a Frankenstein of a font according to Matt, works strangely well on a theme of mixing pieces of unrelated letters to form this alphabet. With &#34;Serifity&#34;, those &#39;little feet&#39; that define any normal serif typeface get somewhat out of hand, attaching themselves to anything they feel like! SALE: 25% off all fonts until Feb 28. See all 17 MADType styles at: <BR>- <a href="http://www.myfonts.com/foundry/madtype/" target="_blank">http://www.myfonts.com/foundry/madtype/</a> <BR> <BR>&#42; PREUSSTYPE is the foundry of Ingo Preuss from Dossenheim, Germany. He&#39;s a freelance graphic/type/web designer &amp; illustrator; preussType was formed just last year to release his fonts. With fonts already in Linotype&#39;s collection, Ingo knows what it takes to make professional fonts. His narrow geometric &#34;Spitting Image&#34;, the handwriting fonts &#34;Picnic&#34;, &#34;Bad Girls&#34;, and &#34;Gekko&#34;, the cut-up font &#34;Scooter&#34; - these are OpenType fonts &#40;that&#39;s the new font format in which Microsoft and Adobe now release fonts&#41;, all including the special characters needed for central European languages. 21 styles altogether. <BR>- <a href="http://www.myfonts.com/foundry/preusstype/" target="_blank">http://www.myfonts.com/foundry/preusstype/</a> <BR> <BR> <BR>======================================= <BR> <BR>MORE FONTS FROM OUR EXISTING FOUNDRIES <BR> <BR>&#42; The famous Czech STORM TYPE FOUNDRY releases several new font families. &#34;Serapion II&#34; is a revision of their popular typeface, with new true small caps and ligatures, and many features streamlined and harmonized. Serapion II blends the spirits of Renaissance and Baroque, making an elegant typfeace with delicate ornaments and a most vivacious italic. &#34;Sebastian&#34; is Storm&#39;s brand-new beautiful sans. Rather than geometric and constructed, Sebastian is truly humanistic. The artist Frantisek Storm gave the letterstrokes a softening modulation that helps the typeface &#34;compensate for their basic handicap - an absence of serifs&#34;. Another sans newly released by Storm is &#34;Juvenis&#34;, a typeface originally drawn 1979 by the Czech master Josef Tyfa, now finalized in digital form. <BR>- <a href="http://www.myfonts.com/fonts/storm/serapion-ii/" target="_blank">http://www.myfonts.com/fonts/storm/serapion-ii/</a> <BR>- <a href="http://www.myfonts.com/fonts/storm/sebastian/" target="_blank">http://www.myfonts.com/fonts/storm/sebastian/</a> <BR>- <a href="http://www.myfonts.com/fonts/storm/juvenis/" target="_blank">http://www.myfonts.com/fonts/storm/juvenis/</a> <BR> <BR>&#42; ROB LEUSCHKE is a calligrapher living in St. Charles, Missouri, USA. Both Bitstream and IHOF are releasing new fonts by him. A lettering artist for Hallmark Cards in the 1980s, Rob has created hundreds of fonts. He specializes in calligraphic scripts, perfect for personal touches in a greetings cards and invitations. Rob releases his fonts under his own brand name Alphabytes, and with other foundries such as Bitstream, ITC and IHOF/P22. The newest additions at MyFonts.com include the free-flowing charming &#34;P22 Corinthia&#34;, the elegant, traditional &#34;P22 Imperial Script&#34;, the swirled and funny &#34;P22 Oh Ley&#34;, the hand-styled contemporary &#34;P22 Petemoss&#34;, the elaborate and very original &#34;P22 Ruthie&#34; &#40;all from IHOF&#41;, and the informal &#34;Ambiance BT&#34;, notable for being Bitstream&#39;s very first OpenType font. In applications that support OpenType Layout features, Ambiance BT creates a lively appearance of handwritten text, making use of contextual alternates and two sets of capitals to choose from. IHOF&#39;s offering 50% off for their Leuschke set until Feb 28. <BR>- <a href="http://www.myfonts.com/person/leuschke/rob/" target="_blank">http://www.myfonts.com/person/leuschke/rob/</a> <BR> <BR>&#42; BITSTREAM&#39;s new release program shows no signs of stopping. We love Lorenzo Lalatta&#39;s &#34;Orchestra BT&#34;, a joyful alphabet of people and instruments declaring a love of music and calligraphy loudly and proudly. &#34;Indoo BT&#34; explores what Indian scripts, where all letters attach to a line, can offer western alphabet shapes; and &#34;Ambiance BT&#34;, as we&#39;ve mentioned in the Rob Leuschke story, is Bitstream&#39;s significant new OpenType script family. &#34;Lindisfarne Nova&#34; has some new members: an Incised and a wonderful Runes version inspired by the illustrated initial capitals found in the Lindisfarne Gospels. <BR>- <a href="http://www.myfonts.com/fonts/bitstream/orchestra-bt/" target="_blank">http://www.myfonts.com/fonts/bitstream/orchestra-bt/</a> <BR>- <a href="http://www.myfonts.com/fonts/bitstream/indoo-bt/" target="_blank">http://www.myfonts.com/fonts/bitstream/indoo-bt/</a> <BR>- <a href="http://www.myfonts.com/fonts/bitstream/ambiance-bt/" target="_blank">http://www.myfonts.com/fonts/bitstream/ambiance-bt/</a> <BR>- <a href="http://www.myfonts.com/fonts/bitstream/lindisfarne-nova/" target="_blank">http://www.myfonts.com/fonts/bitstream/lindisfarne-nova/</a> <BR> <BR>&#42; MISPRINTED TYPE got onto our best-seller lists last year with the semi-destructed script font &#34;Nars&#34;. And stayed there. Quite a feat, considering the competition for the top spots in the &#39;script&#39; category. Now Eduardo Recife comes along with another that could do as well or better: &#34;Great Circus&#34; comes in 5 versions for $30. Buy it and use it big, use it real big, to get that same buzz that comes when you buy a giant old wooden horse with paint flaking off it - before asking your partner. <BR>- <a href="http://www.myfonts.com/fonts/misprinted/great-circus/" target="_blank">http://www.myfonts.com/fonts/misprinted/great-circus/</a> <BR> <BR>&#42; IHOF brings a font that any lover of antiquarian books will fall in love with. &#34;P22 Operina&#34; by James Grieshaber is a faithful recreation of the 16th-century lettering model of the scribe Ludovico degli Arrighi used in his 1522 instructional lettering book &#40;considered to be the earliest printed example of Chancery Cursive&#41;. With its rough edges, the font captures a look that mimics the endearing artifacts of quill and ink lettering on parchment. The font comes in three styles, from Romano that includes regular lowercase and uppercase letters to Fiore that is full of vivid swash forms. <BR>- <a href="http://www.myfonts.com/fonts/ihof/p22-operina/" target="_blank">http://www.myfonts.com/fonts/ihof/p22-operina/</a> <BR> <BR>&#42; LETRASET adds several fonts, among them &#34;Avalanche Script&#34;, a lively calligraphic font by Michael Gills, inspired by Hermann Zapf&#39;s lettering. <BR>- <a href="http://www.myfonts.com/fonts/letraset/avalanche-script/" target="_blank">http://www.myfonts.com/fonts/letraset/avalanche-script/</a> <BR> <BR>&#42; TAIL SPIN STUDIO brings out the update that everybody was waiting for! The eccentric &#34;Softie&#34; font, used in our site headlines, just got a big brother, named Bloated by the designer Steve Zafarana. <BR>- <a href="http://www.myfonts.com/fonts/tailspinstudio/softie/" target="_blank">http://www.myfonts.com/fonts/tailspinstudio/softie/</a> <BR> <BR>&#42; MARK SIMONSON adds a series of families that include &#34;Kandal&#34;, a legible wedge-serif face that looks highly suitable for newspaper use; and &#34;Proxima Sans&#34;, a geometric sanserif with unusually large x-height, and whose italic is particularly at ease with itself. So much so that Rolling Stone magazine chose it for their house sans typeface last time they had a redesign. <BR>- <a href="http://www.myfonts.com/fonts/marksimonson/kandal/" target="_blank">http://www.myfonts.com/fonts/marksimonson/kandal/</a> <BR>- <a href="http://www.myfonts.com/fonts/marksimonson/proxima-sans/" target="_blank">http://www.myfonts.com/fonts/marksimonson/proxima-sans/</a> <BR> <BR>&#42; E-PHEMERA brings us &#34;Lanier&#34;, based on the intriguing handwriting of American poet and novelist Sidney Lanier; and &#34;Impersonal&#34; - remarkably, this most unromantic monospace font is a detailed replica of lettering in a 1950s personal ads magazine! <BR>- <a href="http://www.myfonts.com/fonts/ephemera/lanier/" target="_blank">http://www.myfonts.com/fonts/ephemera/lanier/</a> <BR>- <a href="http://www.myfonts.com/fonts/ephemera/impersonal/" target="_blank">http://www.myfonts.com/fonts/ephemera/impersonal/</a> <BR> <BR>&#42; PROCESS TYPE introduces Eric Olson&#39;s &#34;Lingua&#34;, two weights of a geometric font with OpenType layout features - nearly 200 ligatures! The normally reductive geometric forms of Lingua without ligatures can be turned into a nearly upright script with the ligatures turned on. <BR>- <a href="http://www.myfonts.com/fonts/processtype/lingua/" target="_blank">http://www.myfonts.com/fonts/processtype/lingua/</a> <BR> <BR>&#42; PRESENCE TYPO revives a pair of fonts originally created by Typofonderie Olive in 1956 by masterful French letterer Roger Excoffon. Their &#34;Diane&#34; featured two sets of capitals: the first, revived as &#34;Diana&#34;, is drawn with a vigorous style and a fanciful distribution of thick and thin strokes; the second, revived as &#34;Princess&#34;, is much more traditional and comes from Olive studio staff. <BR>- <a href="http://www.myfonts.com/fonts/presencetypo/diana/" target="_blank">http://www.myfonts.com/fonts/presencetypo/diana/</a> <BR> <BR>&#42; MORE NEW FONTS from Ingrimayne, Pizzadude, Typodermic, FontCity, Blambot, Joe VanDerBos, PosiType, DrewFonts, DingbatCave, URW&#43;&#43;, astype, Baseline Fonts, Sentinel Type, SparkyType, Zang-O-Fonts, Cape-Arcona, SelfBuildtype, Presence Typo, BA Graphics. <BR> <BR> <BR>======================================= <BR> <BR>REGULARS <BR> <BR>Remember our WhatsNew and Special Offers pages are constantly updated. Check them often to see new fonts, and other MyFonts.com news including great offers! <BR>- <a href="http://www.myfonts.com/WhatsNew" target="_blank">http://www.myfonts.com/WhatsNew</a> <BR>- <a href="http://www.myfonts.com/Promotion" target="_blank">http://www.myfonts.com/Promotion</a> <BR> <BR>We always like to hear of good and bad experiences you have at MyFonts.com. Just e-mail &#60;<a href="mailto:comments@myfonts.com">comments@myfonts.com</a>&#62; and we&#39;ll get back to you! <BR> <BR>-- The MyFonts.com Team <BR> <BR> <BR>======================================= <BR> <BR>MyFonts.com, Inc. <BR>245 First Street <BR>17th floor <BR>Cambridge, MA <BR>02142 <BR>USA</font>'
