    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">At least, one could have started with g.2 if so many type designers were not apparently incapable of following the simple number system. <IMG SRC="http://www.typophile.com/forums/clipart/sad.gif" ALT=":-&#40;" BORDER=0></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 27715
    user: 1014
    date: 2003-08-28T20:06:00
    date_raw: Thursday, August 28, 2003 - 8:06 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">By all means, let&#39;s continue to make letters, but for several  <BR>reasons, this genealogy matrix seems ill-suited for this  <BR>collaborative style of type design. <BR> <BR> <BR>1. The scope just doesn&#39;t make sense, as Eduardo pointed out. <BR>That&#39;s not 325 zs, that&#39;s 3 to the 25th power. <BR> <BR>2. We have been making attempts to make letters that &#34;fit&#34; with <BR>the other letters, one of the fundamentals of a good alphabet.  <BR>So if we make a letter that diverges, b.2 and b.3 for example, <BR>then the letters don&#39;t have matching precedent letters and we <BR>have mishmash. <BR> <BR> <BR>Also, b.2 and b.3 were made to be different from b.1, because <BR>of the redundancy issue: Why try to draw the same letter again? <BR> <BR>Few have succeeded in making one collaborative alphabet  <BR>that wasn&#39;t a grunge effort, so if we can make 52 letters and 10 <BR>numerals, that&#39;d be a great start. <BR> <BR>Perhaps we should roll forward in a straight line, <BR>actually, three straight lines, broken down as such: <BR> <BR>Alphabet 1&#41; a.1/b.1/c.1 <BR>Alpabet 2&#41; b.2 new bowl structure, Grant remakes an a, etc. <BR>Alphabet 3&#41; b.3 adding serifs. <BR> <BR>Then, the type designers can say, Hey, I&#39;m going to do a letter <BR>s for Alphabet 1 &#40;s.1&#41;, and an x for Alphabet 2 &#40;x.2&#41;. People work at <BR>their own pace, on letters they&#39;d like to try, while others can come <BR>in and fill in gaps. <BR> <BR>Then, when A-Z, a-z, 0-9 is completed for three alphabets  <BR>62 X 3 = 186, :: maybe :: those involved pick the best one and begin work <BR>on the rest of the character set. <BR> <BR>Or maybe this post can be a catalyst for thoughts about another path. <BR> <BR>::  just some ideas, taking back the quote from Mr. Confucius. :: <BR> <BR> <BR> <BR>bj <BR> <BR><b>&#34;We read worst, what we don�t read&#34;</b>  <BR> <BR><img src="http://www.typophile.com/forums/messages/14800/14999.jpg" alt=""> <BR>  <BR> <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
