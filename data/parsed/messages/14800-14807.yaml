  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><b>Typogenealogy</b> <BR> <BR>We&#39;ve all heard of collaborative font projects where you only get one or two letters as a reference, then you design the next letter. &#40;ie. I get the letter &#39;b&#39;, and I design &#39;c&#39;&#41;  <BR> <BR>Of course, this is a bit counterintuitive to how alphabets are really designed- most designers start in the middle of an alphabet, and work their way outward. Despite this fact, I&#39;ve been brewing on an idea, and it goes a little like this: <BR> <BR>1. Designer #1 designs a letter &#39;a&#39; and posts it to the site as EPS, so that anyone can download it. He calls this file &#34;a1&#34;. <BR> <BR>2. Designers #2, 3, and 4 download the EPS, design the next letter in sequence &#40;in this case, &#39;b&#39;&#41; and then upload their addition, as &#34;b1.1&#34;, &#34;b1.2&#34; and &#34;b1.3&#34; respectively. &#40;Each starts with 1 to show it has been derived from &#34;a1&#34;&#41; Each &#39;b&#39; has specific uniquenesses that each designer has added.  <BR> <BR>3. Designers #5, 6 download the file for &#34;b1.1&#34;, create letter &#39;c&#39; and upload them back to the site as &#34;c1.1.1&#34; and &#34;c1.1.2&#34; &#40;Again, the numbers show that these &#39;c&#39;s have been derived from &#34;b1.1&#34;, a child of &#34;a1&#34;.&#41; <BR> <BR>4. and so forth... <BR> <BR>5. Meanwhile, another designer wants to start a new tree, so uploads an &#39;a&#39; as file &#34;a2&#34; and the pattern repeats in parallel to tree &#34;a1&#34;. <BR> <BR>Does this make any sense? Here&#39;s a simple diagram: <BR><img src="http://www.typophile.com/forums/messages/14800/14808.gif" alt="typogenealogy diagram"> <BR> <BR>I think it will be interesting to see as each branch of the tree evolves, and how later letters &#40;say, &#39;z&#39;&#41; differ from one another, while they all came from the same parent &#39;a&#39;. <BR> <BR>Will the project work? Any takers? If so, design an &#39;a&#39; and upload it, or download from a tree already in progress to jump in and get involved. <BR> <BR>Of course, I&#39;d also welcome any input that would make the experiment better.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
