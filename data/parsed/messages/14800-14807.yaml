    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">i completely agree with the tree structure for this project. i think a nice visual status of progress is much needed. it reinforces the idea of a central goal while teasing the idea of offshoots or experiments that may become dominant...it sort of seems from an outside perspective like survival of fittest...what the group deems worthy of continuing, will carry on...i think the underlying ideas of collaborative style, group acceptance and perserverance are just as interesting as what is coming out of this. i&#39;ve been watching this for a short time and it&#39;s pretty sad to see the weeks and months between posts. again, i just think a visual status of progress is needed. it would be nice to see this rekindled....i don&#39;t think completion of this project is defined by a to z....i dont think this is something you CAN complete...call it the simcity of type design....but maybe there&#39;s a point where you can take a strain of the system and turn it into a workable and usable font, but i really dont think that is where it ends. that&#39;s just a small cross section of the process. it&#39;s such a great idea...</font></font>
