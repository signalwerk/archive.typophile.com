  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hello dear fellows, <BR>This poster is about a theatrical play  <BR>&#40;I know I tired you with all those theatrical posters&#41;. <BR> <BR>The customers already chose this solution; sorry,  <BR>there was no time to show you the roughs  <BR>&#40;I had only two days&#41;. But, even now, just before  <BR>I send it to the printer, I would like to hear your comments. <BR> <BR>The play �&#34;Vatrachi&#34;� is from Aristophanes, the ancient  <BR>Greek theatrical writer best known for his satirical comedies.  <BR>The play of the Frogs turns upon the decline of tragic art.  <BR>Euripides was dead; so were Sophocles and Agathon;  <BR>there remained none but second-rate tragedians.  <BR>Bacchus misses Euripides, and wishes to bring him back  <BR>from the infernal world &#40;Adis&#41;. Bacchus rows himself over  <BR>the Acherusian lake &#40;the gate to Adis&#41;, where the frogs  <BR>&#40;&#34;vatrachi&#34; is the greek word for frogs&#41; pleasantly greet him  <BR>with their croaking.  <BR> <BR>There is more to tell about the play but at this point won&#39;t help you   <BR>to be critical about the poster, since the poster tries to show not  <BR>just the play &#40;which is known anyway&#41;, but the view of the director  <BR>and the scene designer. There will be a big tree on the scene  <BR>that shows the connection between the upper and the lower world.  <BR>It is important to show that the upper world needs the teaching  <BR>and the talents they now moved to Adis and still can be claimed. <BR> <BR>Unfortunatelly I had to put all those names on the poster, but I tried  <BR>to keep the design  the clearest I could. The play is a  comedy  <BR>and so I chosed to use cheerfull colors. <BR> <BR>The rest writings are yours. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/12080.gif" alt="vatrachi"></font></font></font></font>
