    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">as always Hrant you are one of the first  <BR>to replay...how do you make it? You are  <BR>everywhere and always have something  <BR>substantial to write. <BR> <BR>I am flatered of your comments, but when  <BR>you write &#34;Aristophanes was the man.&#34;,  <BR>what do you mean?  <BR>And the last question: do you recognize  <BR>the frog&#39;s legs in the tree roots?</font></font></font></font>'
  - id: 21104
    user: 1250
    date: 2003-06-23T10:41:00
    date_raw: Monday, June 23, 2003 - 10:41 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; how do you make it? <BR> <BR>It comes and goes. Soon I&#39;ll need to recede a bit. <BR> <BR>Everybody should read the Aristophanes comedies. They reveal how little has changed. They reveal for example that there can be no New World Order imposed from one end of the globe onto the other. The Greeks struck a great balance, they were actually as much easterners as westerners &#40;unlike the Romans who were essentially the first true westerners&#41;, and Aristpophanes embodies that so well, and in such an entertaining manner! He was a unique genius. I remember how almost 8 years ago I arrived at the Epidaurus theater in the Peloponnese a day late to catch an Aristophanes play - I&#39;m still kicking myself. <BR> <BR>&#62; do you recognize the frog&#39;s legs in the tree roots? <BR> <BR>The problem is you told me/us what they were, so I couldn&#39;t have missed that! :-/ Looking back, I can only guess, but I think they&#39;re OK. Plus you don&#39;t need to be too literal. <BR> <BR>hhp <BR></font></font></font></font>
