  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi i&#39;m working on a typography assignment for a university paper in New Zealand. The Assignment is &#34;Use the type from a non-alcoholic beverage and container to design your own perception. The inherent challenge being not to design an endorsement of the beverage, but to express  ametaphor or interpretation of it&#34;. <BR> <BR>The beverage i have choosen is a fruit juice beverage called Simply Squeezed. Since starting this project i have been  made aware of the turth, Simple Squeezed Juice has had preservatives, water, sugar added and the juices is made from concentrate.  <BR> <BR>I was trying to create the feeling that the type is under pressure, being crushed. The reasn i have made the type so hard to read is because the name &#34;Simply Squeezed&#34; is misleading when additives are used to make the juice. <BR> <BR>I have a question to ask: <BR>How would i make the type look under pressure compressed? <BR> <BR>Any feed back is much appreciated. <BR>thanks for your time <BR><!--attachment: Typography_assignment-34833.unk*attachment_icon.gif*image/tiff*456.8*Typography+Assignment+development*Typography+assignment%2etif --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/attachment_icon.gif" align=left alt="image/tiff">Typography Assignment development<br><a href="http://www.typophile.com/forums/messages/29/Typography_assignment-34833.unk" target="_blank"><b>Typography assignment.tif</b></a> (456.8 k)</td></tr></table></center><!--/attachment--></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
