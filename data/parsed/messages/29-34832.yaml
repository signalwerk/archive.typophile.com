    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Kia Ora Nathan. Is this from Andr�s? If so, ask to have  <BR>a look at Jaye Hopcroft&#39;s type poster. If I remember  <BR>correctly, she also did Simply Squeezed Spirilina. Except  <BR>she made potato stamps and pressed ink onto paper <BR>then scanned etc. Very organic and appropriate. I would  <BR>get right away from the screen and think about what  <BR>you would have to do to pulp type into a juice. I agree <BR>with Chase, it looks under dense, not particulary squeezed. <BR>Have fun!  <BR> <BR>kris.</font></font>
