    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; On a side note: Has anyone here ever named and released a font only to discover that name in use by another font? <BR> <BR>yeah, me. one of my fonts is called Hybrid. after it&#39;s release i&#39;ve seen at least 2 other fonts that carry the same name. <BR>none of them were licensed by a big foundry though, so i didn&#39;t get into any legal bull ... yet. <BR> <BR>simon</font></font></font></font></font>'
