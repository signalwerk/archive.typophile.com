    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I would have to agree. <BR> <BR>Its still safer than a &#34;c3po&#34; font might be. <BR>Lucas is NOTORIOUS for pursuing copyright offenders. <BR> <BR>I remember in highschool I had a friend who registered <a href="http://www.ilovestarwars.com" target="_blank">www.ilovestarwars.com</a>, not long after getting the site up and running -- which in that time era a website was pratically foriegn to most -- they slapped him with a cease and desist. <BR> <BR><IMG SRC="http://www.typophile.com/forums/clipart/sad.gif" ALT=":-&#40;" BORDER=0> <BR> <BR>hildebrant. <BR> <BR></font></font></font></font></font>
  - id: 26776
    user: 1014
    date: 2003-08-22T12:53:00
    date_raw: Friday, August 22, 2003 - 12:53 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;d disagree. You <i>can</i> use the names for fonts  <BR>&#40;Drysdale, etc.&#41; provided no existing trademark  <BR>exists in a similar trade channel. However, you can&#39;t <BR>use &#34;Beverly Hillbillies&#34; Font Pak or something because  <BR>BH is a registered trademark in various classes <BR>and they&#39;d get you for diluting the mark. <BR> <BR> <BR> <BR>bj</font></font></font></font></font>
  - id: 26778
    user: 1014
    date: 2003-08-22T12:55:00
    date_raw: Friday, August 22, 2003 - 12:55 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Tom, btw, curious to see the typefaces.</font></font></font></font></font>
  - id: 26811
    user: 1258
    date: 2003-08-22T15:01:00
    date_raw: Friday, August 22, 2003 - 3:01 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I second what BJ said. &#34;Beverly Hillbillies&#34; is a trademark, so using that might be a problem. But the names of characters on the show are not trademarked; additionally, they are generic, common surnames. <BR> <BR>Besides, look how many unrelated movies and TV shows have the same titles. <BR> <BR>Paul</font></font></font></font></font>
