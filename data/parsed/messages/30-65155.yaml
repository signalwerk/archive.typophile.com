    html: <font class="dontLookLikeCrap">And the ParaType version has Cyrillic support added. Note that all weights are available on the <a href="http://www.paratype.com/pstore/default.asp?search=Swift+2%2E0&amp;fcode=PT_SWF">ParaType</a> site, not just light. The Latin version of Swift 2.0 is available at <a href="http://www.gerardunger.com/fontstore/store-swift.html">Gerard Unger</a>&#39;s site.</font>
