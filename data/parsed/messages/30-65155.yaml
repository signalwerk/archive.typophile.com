  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Looking to purchase some fonts I noticed that they can have a whole range of prices. <BR> <BR>On MyFonts.com there is a whole range of prices for both Swift and Clarendon ranging from about $17.50 &#40; Scangraphic Digital&#41; to $100.00 &#40;Swift 2.0 [light only] from ParaType. <BR> <BR>Elsner &#43; Flake offers both faces for $34.95 each font. I seem to recall this foundries version being recommended by Robert Bringhurst in his book. <BR> <BR>Any thoughts/advice?</font></font></font>
