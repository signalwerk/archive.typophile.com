    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> 1. Are you guys planning another poll &#40;probably after all the entries are up&#41;? <BR>2. I know that there&#39;s judges, and they&#39;re the ones who are going to pick the winner&#40;s&#41;, but since the main point is in fact to sell as many shirts as possible, shouldn&#39;t there be a somewhat formal voting procedure, so at least the judges know which shirts might be the most profitable before they decide? I know judges don&#39;t like such &#34;infrigements&#34;, but if the motivation is to help Typophile... <BR> <BR>BTW, more likely than not my own entry/entries might &#42;suffer&#42; if you do #2, so I&#39;m not trying to skew the results or anything. I guess I just want Typophile to survive, and from what I understand shirt sales mught turn the tide? Or maybe I&#39;m worrying too much. <BR> <BR>hhp </font></font></font></font>'
  - id: 6497
    user: 1039
    date: 2002-08-29T20:59:00
    date_raw: Thursday, August 29, 2002 - 8:59 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> You do have something of a &#34;captive audience,&#34; or more to the point &#34;captive consumer space&#34; in the forums. You can easily poll to get a rough sense of how many shirts you should print, at the very least. <BR> <BR>Also it would be interesting to see what popular favorites are, even if it doesn&#39;t change what &#34;wins&#34; or gets printed. <BR> <BR>This poll space has been so empty since its inception: probably because at that point there were not even five strong candidates, but the quality seems to have gotten much better in the last week, with presumably more goodies to come. &#91;apologies to those I may have just slighted with this remark.&#93; <BR> <BR>And hey, as judgement day looms, I&#39;m wondering how the judging is going to work. Is it ID Design Annual style, where there is some sort of dialogue from which we are treated to salient gems? Do they rate the shirts, make a list of five, narrow to a &#34;semifinalists&#34; stage, or is it all too arcane for us to know? </font></font></font></font>'
