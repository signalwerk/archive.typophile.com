    date: 2002-08-31T19:30:00
    date_raw: Saturday, August 31, 2002 - 7:30 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Disclaimer: color is not my strong point. In fact, I don&#39;t even like half-tones. I like line art, engraving, and type. So I&#39;m really only considering the qualities outside of color. Except  for green and purple, which I like. <BR> <BR>In decreasing order of preference: <BR> <BR>43.002 <BR> <BR>Linotype Sangue in a goth-looking design. This is my favorite by far! Sangue is a great secret weapon. <BR> <BR>44.001 <BR> <BR>Green on green. Bickham script &#40;or is it Sloop?&#41; Knockout on the sleeve. VERY nice. <BR> <BR>11.001 <BR> <BR>What can I say, I have a pathological craving for ornament. <BR> <BR>38.021 <BR> <BR>More ornament. There is something wrong with me. I want to wear a chandelier on my torso. <BR> <BR>45.002 <BR> <BR>Flamin&#39; awesome. And if that&#39;s hand-lettering, that&#39;s what hand-lettering should do. And if it&#39;s not hand-lettering, it&#39;s certainly on the same level.  <BR> <BR>And one more for curiosity&#39;s sake: 15.001 <BR> <BR>OK I get the orange part now. It&#39;s an inside joke. I&#39;ll assume the creator wants to deliver the punchline personally, so I&#39;ll withhold. VERY subtle and VERY clever. Likely outside the scope of the contest, though. </font></font></font></font>'
