  - id: 6563
    user: 577
    date: 2002-08-31T08:30:00
    date_raw: Saturday, August 31, 2002 - 8:30 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> 10.004 / pseudo-backwards typophile  <BR>Surprisingly readable, but skewed enought to make you stop and look. I would actually wear this one &#40;though I still would rather it be black with white type&#41; <BR> <BR>10.006 / ligatures  <BR>Because I&#39;m a ligature man, and I love Mrs. Eaves  <BR> <BR>38.017 / Gas Food and Type <BR>All I need. I love the simplicity, design and message of this submission. <BR> <BR>39.006 / Found T-Shirts <BR>This is a wicked-cool idea. I have a friend who makes her business cards the same way � just wrapping stickers around trimmed-down press sheets that she picks up on press checks.  <BR> <BR>38.018 / TYP <BR>This reminds me of those stickers you see on cars for different countries &#40;USA, GB, CAN, etc.&#41;. So I like this one for its use of letterforms as icons as well as the message that the wearer is, in a way, declaring allegiance to typophile-nation. <BR> <BR>Runners-up: <BR> <BR>28.004 / Flaming Typophile  <BR>What can I say, I like flame jobs... <BR> <BR>18.007 / I &#40;dingbat&#41; type  <BR>Milton Glaser meets Oswald Cooper. Hell ya! </font></font></font></font>'
  - id: 6573
    user: 1019
    date: 2002-08-31T12:01:00
    date_raw: Saturday, August 31, 2002 - 12:01 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> 15.004 actually looks like a t-shirt design. and the picture is fun. besides Cooper does need some respect. In turn I think it would spark alot of conversations...people would ask about cooper, you could have a real conversation without sounding dotcommy and have your opportunity to plug the site. <BR> <BR>38.021 I&#39;ve never seen anything before that combines futuristics, scripts, displays and blackletters, sans serifs all together into a pleasing design that means something. I think the designer was trying to cover all bases. and then there&#39;s the whole look and feel and concept thing. <BR> <BR>28.001 yay dingbats, I&#39;ve tried for a few years now to convince companies that dingbatting their name could be excellent for branding. no ones taken to it, and here&#39;s my opportunity! I&#39;ll wear it to meetings...symbols rule. and whats a letterform but a symbol anyway? Dingbats being so recognizable now I think they should be given the same uses...like braille for seeing people or soemthing. <BR> <BR>29.008 I like the relationship between font choice and the word. and then the justaposition or it all together too. its very clean. not much of an advertisement for typophile but is that needed anyway? is a t-shirt going to drive visitors..no. <BR> <BR>43.016 but with that black screen on. Its nice to fit words into squares, dosen&#39;t say much about what typophile is or does...but sticks to the point somewhat without being altruistic, or illustrative.  <BR> <BR>I would not wear flaming anything...in this city there&#39;s too many flaming identities, and I think its on its way to be the next trend, y&#39;no right after orbits and &#34;e&#34;-wotevers die off. </font></font></font></font>
