  html: '<font class="dontLookLikeCrap">Fontlab Ltd. <BR>136 E 8th St. <BR>Port Angeles WA 98362 <BR>USA <BR> <BR>Fontlab Ltd. Announces the Release of TransType Pro: Universal Font Converter with OpenType Support <BR> <BR>For Immediate Release <BR>Tuesday, February 15, 2005 <BR> <BR>Contact: Ted Harrison <BR>Fontlab Ltd. <BR>Tel: &#43;1 &#40;509&#41; 272-3260 <BR><a href="mailto:info@fontlab.com">info@fontlab.com</a> <BR> <BR>Port Angeles, WA , USA - February 15, 2005 - Fontlab Ltd., the leading developer of digital typography tools, announced today the release of TransType Pro for Mac OS and for Microsoft Windows. This new product in the TransType family of font converters delivers professional high-quality font conversion to the user&#39;s desktop and is the first consumer product on the market that allows seamless conversion to and from the OpenType format. <BR> <BR>Both the Mac OS and the Windows version of TransType Pro can convert fonts between the Mac and the Windows platform, and between all major font formats: PostScript, TrueType and OpenType. <BR> <BR>TransType Pro supports batch conversion so users can convert their font libraries from legacy font formats such as PostScript Type 1 into the new cross-platform OpenType format. TransType allows the user to convert their legacy-encoded Cyrillic, Greek, Central European, phonetic and other specialty fonts into the new universal Unicode encoding to make them compatible with the newest versions of Adobe Creative Suite, Microsoft Office and Apple iWork. If the user converts standard Type 1 fonts or TrueType GX/AAT fonts into OpenType, TransType Pro 3 will automatically add some OpenType typographic features such as ligatures or fractions. <BR> <BR>TransType Pro addresses common font problems. Font conversion may help repair corrupt fonts that are rejected by the system or cause problems in printing. Users of older applications and systems can convert their OpenType fonts into Type 1 or TrueType. Owners of Multiple Master fonts can use TransType Pro to convert them into normal OpenType, Type 1 or TrueType fonts and use them in any application. <BR> <BR>TransType Pro simplifies the conversion of font families from Macintosh to Windows as it supports conversion of entire Stuffit &#40;.sit&#41; archives and allows the user to manually rearrange and rename font styles and families. <BR> <BR>Font designers who use TypeTool, ScanFont or other font editors can now use TransType Pro to create professional-quality OpenType fonts. TransType Pro includes Python scripting language support so users and 3rd party vendors can create macros that apply additional effects to the converted fonts and extend the application&#39;s functionality. <BR> <BR>TransType Pro supports a multitude of font formats: Mac PostScript Type 1 and Mac TrueType fonts &#40;suitcases and dfont&#41;, OpenType fonts with PostScript outlines &#40;.otf&#41; and with TrueType outlines &#40;.ttf&#41;, Windows PostScript Type 1 fonts &#40;.pfb&#41; and Windows TrueType fonts &#40;.ttf&#41;, Mac and Windows Multiple Master fonts as well as the VFB format used by FontLab, TypeTool and AsiaFont Studio. <BR> <BR>TransType Pro retails for US$179.00. Users of any previous versions of TransType can upgrade for US$87.00. The Windows version of TransType Pro runs on Microsoft Windows 98, ME, 2000 and XP. The Macintosh version of TransType Pro is a Carbon application and runs natively on Mac OS 9 and Mac OS X. Demo versions with limited functionality are available at <a href="http://www.fontlab.com" target="_blank">www.fontlab.com</a>. All products from Fontlab Ltd. carry a 60-day satisfaction guarantee. <BR> <BR>About Fontlab Ltd. <BR> <BR>Fontlab Ltd. has stayed at the forefront of digital font management by remaining devoted to developing font editors and typography products. Their full line of products is dedicated to solving the most complex typography issues. These products include: AsiaFont Studio�, BitFonter�, FontLab�, ScanFont�, TypeTool�, TransType�, FontFlasher�, FONmaker�, SigMaker� and CompoCompiler�. More information on all Fontlab products can be seen at <a href="http://www.fontlab.com" target="_blank">www.fontlab.com</a>. <BR> <BR>Trademark Information <BR> <BR>AsiaFont Studio, FontLab, BitFonter, ScanFont, TypeTool, TransType, FontFlasher, FONmaker, SigMaker and CompoCompiler are trademarks or registered trademarks of FontLab Ltd. Windows and OpenType are registered trademarks of Microsoft Corporation. iWork is a trademark, TrueType and Mac OS are registered trademarks of Apple Computer, Inc. Adobe and PostScript are registered trademarks of Adobe Systems, Inc. Other brand or product names are the trademarks or registered trademarks of their respective holders. <BR> <BR>###</font>'
