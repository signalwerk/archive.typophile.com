    date: 2004-08-31T16:43:00
    date_raw: Tuesday, August 31, 2004 - 4:43 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Step away from it and let the incubation process do its work. I like what I think of when I&#39;m not thinking� <BR>peace</font></font></font></font></font></font></font></font></font></font></font>
  - id: 73833
    user: 3264
    date: 2004-09-01T12:14:00
    date_raw: Wednesday, September 01, 2004 - 12:14 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Tim -- Your intuitions are correct. It&#39;s very difficult to do your own logo. Your idea to just use type may be the best solution. After all, you&#39;re not American Airlines. They need a logo but do you? Paul Cutler has an idea -- let your subconscious do the work. Who knows? Just don&#39;t sweat it. <BR> <BR>PG <BR> <BR><a href="http://giambarba.com/bizimage.html" target="_blank">http://giambarba.com/bizimage.html</a></font></font></font></font></font></font></font></font></font></font>
  - id: 73935
    user: 2172
    date: 2004-09-02T13:04:00
    date_raw: Thursday, September 02, 2004 - 1:04 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Yeah, it&#39;s the designer/typographer equivalent of the self-portrait. <BR> <BR>I say pick a font that you unabashedly love, if you can&#39;t find one that seems &#39;you&#39;. <BR> <BR>This may make it more enjoyable and lead you in a direction you were unable to think of before. I feel for you. I&#39;ve hit some walls recently too, but now I&#39;m over them and the view is great.</font></font></font></font></font></font></font></font></font>
  - id: 74683
    user: mboey-users
    date: 2004-09-09T08:19:00
    date_raw: Thursday, September 09, 2004 - 8:19 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;ve personally found that its harder to design stuff for yourself, then design it for the client. <BR>maybe because, I&#39;m too fussy, or don&#39;t know what i want.</font></font></font></font></font></font></font></font>
