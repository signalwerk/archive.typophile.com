post:
  id: 73704
  user: mothy5000-users
  date: 2004-08-31T13:16:00
  date_raw: Tuesday, August 31, 2004 - 1:16 pm
  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;m starting my freelance business in graphic designing and am having trouble finding fonts for my logo.  For now the logo will just be my name, J.A. Hull &#40;letters moved around to protect the innocent.&#41;  I was thinking that under the name, in a different font, I would place the word &#34;Advertising&#34; formated to stretch from the &#34;J&#34; to the &#34;l&#34;. <BR> <BR>I&#39;m sure everyone can relate, I&#39;ve created many, many printed pieces for others making fearless decisions.  As soon as I have to make a decision for myself...Brick Wall! <BR> <BR>Any advice?</font></font></font></font></font></font></font></font></font></font></font></font>
