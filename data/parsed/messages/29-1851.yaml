  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Had a neat opportunity to design the identity for the reverend who was officiant at my wedding. &#40;Somewhat precipitously, as the judge didn&#39;t show -- but that&#39;s another story.&#41; <BR> <BR>The logotype is in Adobe Caslon Semibold, with italic swashes. I like how the R and T look, but something&#39;s funny with the C... any suggestions? Also, can anything think of an elegant serif typeface with swashes and ligatures that might look better? <BR> <BR>The feeling I&#39;m gunning for is &#34;elegant and dignified&#34;. <BR> <BR><IMG SRC="http://www.typophile.com/forums/messages/29/1852.jpg" ALT="coleman"></font></font></font></font>
comments:
  - id: 5432
    user: 1215
    date: 2002-07-28T08:40:00
    date_raw: Sunday, July 28, 2002 - 8:40 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">You might also consider Jonathan&#39;s eponymous <A HREF="http://www.typography.com/catalog/hoeflertext/" TARGET="_blank"> Hoefler Text</A>. All weights have a complete set of swashes, and you have the option of italic small caps with some great alternates as well.  <BR> <BR>The swash &#39;C&#39; is the same basic style as your Caslon example. You might try using a non-swash one instead, if you don&#39;t like the open, swoopy quality of the swash form. I personally prefer a lighter weight for &#34;elegant and dignified.&#34; <BR> <BR>-- Kent.</font></font></font></font>
  - id: 5456
    user: 108
    date: 2002-07-29T09:34:00
    date_raw: Monday, July 29, 2002 - 9:34 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> :: Personal Opinion from a History Geek :: <BR> <BR>I think swashes work more elegantly &#40;appropriately?&#41; with lowercase characters.  <BR> <BR>Hoefler Text good idea. Perhaps Poetica? </font></font></font></font>'
