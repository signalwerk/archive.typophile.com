    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> ;&#41; Glad you caught the mood in which that was sent. I think with anything that smacks of decoration it is all about find the perfect balance. <BR>--- <BR>Perhaps the capitalizing of W, M and O in Wedding Minister et Officiant?  <BR>--- <BR>This will sound arrogant to everyone probably, but when the design is elegant and sophisticated I think it looks sloppy to use all lowercase. Is that too hardcore? Maybe this will start a new debate. &#40; playing devils advocate :&#91; &#41; <BR>--- <BR>What about the third line of type being the same length as the other two? <BR>--- <BR>I do however like how the top two lines are resolved. It feels more calligraphic. And I love the way the R nestles itself in between the nC </font></font></font></font>
