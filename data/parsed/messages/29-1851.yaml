    date_raw: Friday, February 28, 2003 - 1:34 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I like Tiffany&#39;s blend...  No offense, but especially for a guy who&#39;s not exactly straight out of the seminary... adding a bit of the straight and narrow, elegant, staid serifs to balance swash excess... should send those wedding planners swooning. <BR> <BR>At least none of these examples have crossed the line from appropriately ornate to New Jersey living room, gold-leafed girly. I&#39;ve helped some friends with wedding stuff and the taste in type for invites and whatnot is scary. <BR> <BR>&#40;and hey... I know a guy who became an ordained minister via the back of a magazine; he may be a bit of an alcoholic but he&#39;s quite serious about his work!&#41;</font></font></font></font>
