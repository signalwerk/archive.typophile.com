    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I like the possibility of taking pixel fonts in this unexplored direction &#40;to my knowledge&#41;. Naturally, they are niche typefaces at best, but they do have an entirely different feel to them than their parent typefaces. I like the raw feeling they have, and don&#39;t mind the knobby look that comes as a result of this technique. <BR> <BR>Any thoughts? <BR> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/40629.gif" alt=""></font></font></font>
