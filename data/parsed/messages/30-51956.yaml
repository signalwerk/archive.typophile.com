post:
  id: 79812
  user: favek-users
  date: 2004-10-24T22:38:00
  date_raw: Sunday, October 24, 2004 - 10:38 pm
  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi all new to the forums here looks like a great resource!  I will tell you all a little about myself. <BR> <BR>I just got started doing layout for a small town newspaper.  Its tabloid size paper and it runs 20 pages.  I am fairly new to newspaper layout and I am into my fifth issue now but I am loving the learning process.   <BR> <BR>So now I have a contract with a non-profit organization to do a monthly senior paper. &#34;Supposedly&#34; I am working with a man that will deliver all of the copy and pictures to me at or near the end of the month and then all I do is the layout.  Seeing the will be the first issue that remains to be seen. <BR> <BR>So when we had a meeting he mentioned that he would like to see a 3 column format.  Instead of a 4.  I also suggested arial font because old people will need to easily read it. I was thinking something larger like 12 point. He also said he would like to run at least 26 pages. <BR> <BR>So I guess I am looking for some work flow tips, maybe some suggestions on paper layout anything really. <BR> <BR>This is my first post here so if I left anything out please dont hestiate to respond. <BR> <BR>Oh ya I use InDesign CS for my layout program.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
comments:
  - id: 79813
    user: 909
    date: 2004-10-24T22:47:00
    date_raw: Sunday, October 24, 2004 - 10:47 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">If this person wants it to be readable, and suggested Arial, they don&#39;t know much about text and readability. With its relatively closed counterforms, Arial tends to be harder to read by those with poor eyesight than, well, lots of things. If you and he are convinced that a sans serif is the way to go, use a more humanist sans with more open counterforms. Frutiger and Myriad come to mind, but there are many other choices. <BR> <BR>Regards, <BR> <BR>T</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 79818
    user: 1062
    date: 2004-10-24T23:23:00
    date_raw: Sunday, October 24, 2004 - 11:23 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">A couple of things came to mind as I read your post: <BR> <BR>- Arial is not a great choice for body copy. For the kind of longish stories that a newspaper typically carries, a serif typeface is generally considered a better &#40;more readable&#41; choice. Times New Roman started life as a newspaper &#34;font&#34; -- if your type options are limited, pick Times over Arial. <BR> <BR>- If the senior paper is also a tabloid, then a 3-column layout may yield columns that are too wide for comfortable, quick reading. Even with the larger type size you&#39;re proposing, a 4-, 5- or even 6-column approach might work better. <BR> <BR>- Are you familiar with the Society of Newspaper Designers? Among other things, they publish a design annual that might be a good source for inspiration. <BR><a href="http://www.snd.org" target="_blank">http://www.snd.org</a> <BR> <BR>- Mario Garcia is a well-known newspaper designer who recently published a book on the topic called &#34;Pure Design.&#34; Lots of basic, useful information. <BR><a href="http://www.amazon.com/exec/obidos/tg/detail/-/0972469605/qid=1098684488/sr=1-1/ref=sr_1_1/104-0823421-5853518?v=glance&amp;s=books" target="_blank">http://www.amazon.com/exec/obidos/tg/detail/-/0972469605/qid=1098684488/sr=1-1/ref=sr_1_1/104-0823421-5853518?v=glance&amp;s=books</a> <BR> <BR>- Workflow tips: Before you start production on the first issue set up style sheets and master pages for the publication. Consider having all of your text &#40;heads, decks, etc.&#41; use leading that is a multiple of the body copy&#39;s leading, and have everything snap to the baseline grid. &#40;This can be set up as part of the style sheet.&#41; <BR> <BR>Hopefully some of the other publication designers that frequent these parts will chime in with more suggestions. Good luck!</font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 79862
    user: 1042
    date: 2004-10-25T05:36:00
    date_raw: Monday, October 25, 2004 - 5:36 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>he would like to run at least 26 pages</i> <BR> <BR>How would you do that? Unless you can print single, 2-sided sheets, newspapers, especially tabloids, are made up of spreads printed front and back and folded in the middle. The total page number does therefore have to be a multiple of 4. If the printing press can print 2 of those signatures at the same time, they would be folded in the middle and trimmed in the press &#40;it you�re printing web rather than sheet offset&#41;, making 8 pages the minimum book. 3 of those books would make 24 pages, etc.</font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 79888
    user: favek-users
    date: 2004-10-25T09:31:00
    date_raw: Monday, October 25, 2004 - 9:31 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Ok so Arial is out and I will look into something else. <BR> <BR>So it seems if I want to go with a biger font size I should definatly go with more than 3 columns.  I think going with a biger font size is a good idea because a lot of elderly have bad eyes. <BR> <BR>With the 26 pages I am not sure what thats all about.  I will call the printing press and see what the deal is. <BR> <BR>Thanks for all the feedback please send more my way!</font></font></font></font></font></font></font></font></font></font></font>
  - id: 79927
    user: 1530
    date: 2004-10-25T12:43:00
    date_raw: Monday, October 25, 2004 - 12:43 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">12 points is big enough &#40;too much I would say&#41; for most types and certainly for a newspaper. If you find that it still looks small for you, maybe you should try a widest font.</font></font></font></font></font></font></font></font></font></font>
  - id: 80022
    user: 2289
    date: 2004-10-26T06:04:00
    date_raw: Tuesday, October 26, 2004 - 6:04 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><a href="http://www.tiresias.org/fonts/" target="_blank">http://www.tiresias.org/fonts/</a> this is a font designed for blind/partially sighted readers. <BR>Surprisingly, the RNIB recommends Arial at 14/21-28 pt as a font to use for people with sight problems, I agree with the comments above that it is not the first &#40;or even fourth&#41; choice. <BR>Tim</font></font></font></font></font></font></font></font></font>
  - id: 80032
    user: 1042
    date: 2004-10-26T07:08:00
    date_raw: Tuesday, October 26, 2004 - 7:08 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>surprisingly, the RNIB recommends Arial</i> <BR> <BR>Not surprisingly. That is all they know, just like most of the recent testers. As long as legibility tests keep comparing Arial to Times, the poor readers won�t be any better off. Don�t forget: you are comparing shite against shite. Times was good for newspaper printed letterpress, 70 years ago. Arial has the birth defect of being Helvetica�s illegitimate twin &#40;same widths, different face&#41;. The last decade or so has brought many amazing new typefaces which have all benefited from both better technology and improved understanding of legibility on our side &#40;the type designers, that is&#41;. If the Royal National Institute for the Blind &#40;not everybody may know the abbreviation&#41; would do their work properly, they would ask experts from outside the narrow world of Window-nerds.</font></font></font></font></font></font></font></font>'
