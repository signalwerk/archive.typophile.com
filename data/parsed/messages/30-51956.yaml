  - id: 80044
    user: 1250
    date: 2004-10-26T08:18:00
    date_raw: Tuesday, October 26, 2004 - 8:18 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The &#34;official&#34; Arial recommendations are indeed not surprising, and it&#39;s due to the confounding of legibility/deliberative_reading versus readability/immersive_reading. And although typographic practioners don&#39;t [seem to] have enough answers either, one thing they can certainly do is alert the field scientists that something is very wrong. These two worlds are what some of us have been trying to reconcile, to fuse together what they know best; the best attempt so far was this year&#39;s Thessaloniki conference. <BR> <BR>hhp</font></font></font></font></font></font>
  - id: 80058
    user: 1042
    date: 2004-10-26T09:45:00
    date_raw: Tuesday, October 26, 2004 - 9:45 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>and it&#39;s due to the confounding of legibility/deliberative_reading versus readability/immersive_reading.</i> <BR> <BR>No, Hrant, it�s not. Arial is simply not a very legible typeface, whatever conditions you test it under. Even with familarity &#40;because it�s on everybody�s computer&#41; on its side, it would test badly against a lot of other faces, given the same conditions. It is obvious that it�ll look better at 9pt on screen than Times. But that doesn�t mean Times is a bad typeface, nor does it mean that Arial is a good one. If you compared Arial on screen to Lucida or Verdana or a few other, well-hinted Sans faces, they would come out miles ahead. And then you see some of the test pages, and they�re testing white-out-of-blue lines of 140 characters! In the end they tell us that users prefer reading wider lines to narrow columns. Of course they would, if the choice is straining your eyes along a long line or scrolling down to the floor. If these people had only the slightest idea that typography is an integrated application, and that you cannot separate type from space from contrast from colour, they would find out that things people find easy to read haven�t changed very much since the 1400s.</font></font></font></font></font>
