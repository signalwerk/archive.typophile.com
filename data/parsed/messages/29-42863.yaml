  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Dear friends, <BR> <BR>can you please critique this logo for me? <BR> <BR><img src="http://www.typophile.com/forums/messages/29/42864.gif" alt="World Wide Art Logo"> <BR> <BR>It is for an art gallery. The shape is meant to reflect the three characteristics of the gallery: art &#40;brush stroke&#41;, global outreach &#40;globe&#41;, modernity &#40;@ sign&#41;; also, the letters WWA are somehow meant to be in there! <BR>comments welcome! <BR> <BR>Greetings, <BR>s</font></font></font></font></font>'
