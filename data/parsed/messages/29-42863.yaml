    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Saman, first reaction to the mark I thought It was a womans womb with child. Tell us more about WWA do you show art of the world or sell local artists world wide. My only other thought is art is free flowing and creative not static and justified like your type. Start again but this time use a pencil to paper and let your creativity flow. The computer has your thinking to rigidly.</font></font></font></font>
