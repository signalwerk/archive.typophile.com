    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Paul, my suggestion would be to include every possible numeric format in the OpenType font. Then, the user has everything to choose from. If that means ten different numeric styles, then so be it &#40;as long as you can program that&#41;! <BR> <BR>And I, for one, enjoy seeing all of your questions. Keep &#39;em coming! <BR> <BR><i>&#62;BTW, Paul, dude, are you guys gonna give Typophile.com credit when the Lanston stuff is [re-]released? You&#39;ve been mining our heads like there&#39;s no tomorrow! ;-&#41;</i> <BR> <BR>This wouldn&#39;t really be necessary, IMO. We all use Typophile to get our questions answered.</font></font>
