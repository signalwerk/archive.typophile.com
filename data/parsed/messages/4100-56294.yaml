    html: <font class="dontLookLikeCrap">I don�t think too many font designers re-draw their figures for tabular use � The �oldstyle� &#40;I really prefer the term �lowercase�&#41; figures in Carter�s Galliard seem strongly influenced by Van Krimpen�s work. The figures were far from robust, &amp; I confess I never liked them � we modified the tabular figures for a proportion set for Galliard in PostScript Type 1. Back in the days of the Linotron 202 when you couldn�t modify fonts, but could select what supplemental font set you used in a job, we used Sabon figures with Galliard. For American audiences anyway, that worked quite well. <BR> <BR>If the figures in the font you are designing are more robust than Galliard, you probably don�t need to redraw them � at least not much � for tabular use. Of greater importance I think are the period and comma. In text, when a period or comma is used, a word space will usually follow, so their position in the set of the character usually assumes that space. In a table, no space will follow the period or comma. Moreover, you don�t kern characters in a table; to do so would lose the alignment. <BR> <BR>The trick is to open the Metrics Window in FontLab or the Kerning routine in Fontographer, and key in something like 7,000 and 7.012 using your tabular figfures � Actually, all numbers with periods &amp; commas before &amp; after them. Usually, you�ll discover that you will want a wider set for the comma and period, and the left sidebearing will be smaller. <BR> <BR>FWIW <BR> <BR>Charles</font>
