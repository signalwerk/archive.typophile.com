    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">how common are tabular oldstyle numerals? are they worth messing with?</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 86954
    user: 108
    date: 2004-12-20T11:28:00
    date_raw: Monday, December 20, 2004 - 11:28 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">From a user&#39;s pov, I really appreciate when typefaces include both. Not all of us like to set business cards with oldstyle numbers, too much dancing. Of course, that is only one instance and I&#39;m probably in the minority.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 86962
    user: 5094
    date: 2004-12-20T12:41:00
    date_raw: Monday, December 20, 2004 - 12:41 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Alvin Eisenman wrote a piece for Font &amp; Function some years ago entitled REINTRODUCING LOWERCASE FIGURES &amp; SMALL CAPITALS, which is well worth reading if you can find it. &#40;Sorry, I don�t have the volume &amp; issue&#41;. BTW, I believe it was Paul Rand who first used the term �lowercase figures.� <BR> <BR>�Modern� can be a deceptive term -- I once had a book about Thomas Pynchon to design; the editor remarked �this is a modern book, it should have modern figures.� I pointed out to her that people are apt to use the term �modern� to describe their own time, and �modern� figures became common in Victorian times, so they are �modern� just like hoop skirts. The image of Pynchon in a hoop skirt won out; we used �oldstyle� figures. <BR> <BR>Old-style figures have ascenders &amp; descenders, just like lowercase letters. �Lining� figures are like capitals, &amp; should always be used with them. But a text peppered with lining figures visually calls attention to the figures, giving them a greater visual weight, which is usually not appropriate. Even with mathematical expressions, �old-style� figures were common in the 19th and early 20th centuries. Having said that, I�d guess most scientists today are more comfortable with lining figures, so I�d use them for certain kinds of books. Ideally, I�d mix them, using �oldstyle� for dates &amp; common numbers, with lining for technical constructions. But you always get into odd situations, and it is far easier to use just one style of figures. <BR> <BR>As to tabular old-style figures, how common they are depends on the typesetting system. Most Monotype metal fonts, and certainly most Linotype linecaster fonts, did not use a common body for oldstyle figures. With the introduction of the Linotron 202, almost all the supplemental fonts that had os-figs had them on a common body � i.e., no �proportional� figures. You did a lot of kerning. Most PostScript Type 1 fonts seem to have reverted to the hot-metal days, and the os-figs were not on a common body. For many fonts, it was easy enough to construct them. Matthew Carter constructed a special set for Galliard; you can get them from Carter &amp; Cone if you ask � they are drawn differently than the proportional figures; he didn�t just put the proportional os-figs on a common body. <BR> <BR>As for using oldstyle figures in tables, I use them when the tables are straightforward data, and when the book isn�t one I think the audience would be more comfortable with lining figures. <BR> <BR>And I�d note that it is sometimes necessary to make a tabular comma and period, for either os or lining tabular figs. <BR> <BR>FWFW <BR> <BR>Charles</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 86964
    user: 5094
