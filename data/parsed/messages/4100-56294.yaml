    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Bloody thing gave me an error message so I re-posted it. So it turned out the first one did go through. We don&#39;t need it twice, that&#39;s for sure. <BR> <BR>I can edit the second posting, but not delete it. You just can&#39;t find a teenager when you need one. <BR> <BR>Sorry, <BR> <BR>Charles</font></font></font></font></font></font></font></font></font></font></font></font></font>
