    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">thanks for the info, Charles. that was rather insightful, especially the part about actually redrawing figures for tabular settings. &#40;it was too much common sense for me think of that!&#41; do you know of anyone else who follows this practice? <BR> <BR>oh and you can usually just ignore those error messages. just make sure you copy your posting, back out of the message and then go back in to double check that it actually posted.</font></font></font></font></font></font></font></font></font></font></font>
  - id: 86968
    user: 3135
    date: 2004-12-20T13:14:00
    date_raw: Monday, December 20, 2004 - 1:14 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Paul, <BR>It is hard to read your user&#39;s intentions when designing a typeface.  If your intent is to make your font more marketable to everyone, I would suggest including both lining and oldstyle figures.  If you must choose one, I would make it lining but at a height somewhere between cap height and x-height.  This makes the numbers less obtrusive in the text but still allows for the tables found in annual reports and price catalogues. Like Tiffany, I think business cards set in oldstyle can be disruptive when you have so many phone numbers and addresses and zip codes all packed into such a small size card.  This again is the users choice and why having both sets is always the best solution. <BR> <BR>ChrisL</font></font></font></font></font></font></font></font></font></font>
  - id: 86970
    user: 1353
    date: 2004-12-20T13:37:00
    date_raw: Monday, December 20, 2004 - 1:37 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">IIRC the new FF Unit does have special tabular figures, plus lining figures and oldstyle figures. And Adobe OT fonts usually have the 4 styles of figures: tabular lining, tabular oldstyle, proportional lining and proportional oldstyle. <BR> <BR>[update: see Mr. Spiekermann&#39;s post regarding FF Unit&#39;s figures <a href="http://www.typophile.com/forums/messages/83/55574.html?1102932004#POST85950"> here</a>.]</font></font></font></font></font></font></font></font>'
