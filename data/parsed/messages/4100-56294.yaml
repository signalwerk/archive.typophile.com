  - id: 86973
    user: 1250
    date: 2004-12-20T13:56:00
    date_raw: Monday, December 20, 2004 - 1:56 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">It depends on the style/usage of the font. <BR>In general, for a text face I would make one or both of two main styles: hybrid proportional, and 3/4-lining fixed-width. And unless the caps are very short I wouldn&#39;t align the latter with them &#40;in general&#41;. This will cover you 90%. BTW, see de Groot&#39;s numerals for the best in the west. <BR> <BR>As for non-numeric characters that might benefit from having a relationship with a fixed-width numeral width, certainly the currencies should be that width - and here&#39;s a trick I learned from JF: make stuff like commas and periods &#40;and the en dash&#41; exactly <i>half</i> that width, and make the blank space character that width too. That way you can easily pad the widths as necessary. <BR> <BR>&#42; Actually, you would of course determine the space first and then double it to get the fixed-width for the numerals. <BR> <BR>BTW, Paul, dude, are you guys gonna give Typophile.com credit when the Lanston stuff is [re-]released? You&#39;ve been mining our heads like there&#39;s no tomorrow!  ;-&#41; <BR> <BR>hhp</font></font></font></font></font></font>'
