    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> One of the major clients lately &#34;captured&#34; is a big retail chain selling over 15000 items ranging from furniture to pipes, from cement to steel and glass, basicly everything that has to do with constructions and space refurbishing, both for home and for office. <BR>Their existing identity -that&#39;s been in use for10 years now- is designed by the company&#39;s president and has something of an emotional appeal to him, still he was the one coming forward in search of a new visual expresion for the brand, following contacts with identity systems and corporate identity manuals from western partners. The identity consists of the name typeset in a heavy version of Helvetica, but there is no rule whatsoever, so it sometimes ends up typeset in Tahoma or Arial. <BR> <BR>They wanted only a slight finetuning to the identity and a comprehensive set of brand usage standards. So we decided to preserve the equity by keeping the all-caps logotype. So I drew the two versions of the custom lettering and they chose to go with the second one put it in the previous soft corners triangle. I am not sure, however, if the overall lettering looks decent, to say the least... I am particullary worried about M and E... also, does this look similar to any font you know? <BR> <BR>thank you a lot, <BR>george // cellsius design </font></font></font></font>
