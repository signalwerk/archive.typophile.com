  html: <font class="dontLookLikeCrap"><a href="http://windowseat.ca/collective/" target="_blank">http://windowseat.ca/collective/</a> <BR> <BR>The Collective Type Project is an emergent online art project that gets people to write the same letter of the alphabet in the same place. The average of each letter is taken until there are 255 entries, at which point the letter is full and can no longer be added to. <BR> <BR>Once every letter of the alphabet is filled in, the collection will be turned into a font that can be downloaded for free. <BR> <BR>Anyone can add to the project as many times as they want. <BR> <BR>I think this is similar to the Smaller Picture project, although I had just found out about it today. <BR> <BR>Cheers, <BR>Jeff.</font>
