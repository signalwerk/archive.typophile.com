    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;m no expert on pixel fonts, but I&#39;d say that in your original concept, either your e&#39;s are top-heavy, your  <BR>s&#39;s are bottom-heavy, or both. &#40;The middle of the word &#34;hopelessly&#34; emphasizes the disparity.&#41; <BR> <BR>Just looking at the set, it looks like the font wants to be a bit top-heavy - you didn&#39;t rethink the o, and  <BR>most of the other letters seem to be ambivalent. The word &#34;six&#34; makes it look like your s is upside- <BR>down, too. I&#39;d keep the old c for a bit, switch to the middle e, and try to redesign the s to match them  <BR>as much as possible. Then let&#39;s see another sample. It&#39;s always hard to judge a letter in isolation. <BR> <BR>As for your second font, maybe a second thread, just so things don&#39;t get confused?</font></font></font></font></font></font>
