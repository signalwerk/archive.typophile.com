  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">So I&#39;ve been working on a website for an industrial consultant, and settled on this logo: <BR> <BR><img src="http://www.typophile.com/forums/messages/29/4279.jpg" alt="rohr"> <BR> <BR>Now, I realize that the &#34;R&#34; in the circle-r device is Arial Black and the logotype is in Frutiger. I have yet to resolve the issue since I don&#39;t particularly like the rounded tail on the Frutiger &#34;R&#34;. <BR> <BR>What I&#39;m more interested in is a critique of the basic idea itself. Are there existing logos out there that are very similar? Is it just plain a bad idea or iffy execution? <BR> <BR>And if you&#39;d care to peep the site itself, you may find it at <a href="http://www.famished.org/rohr" target="_blank">www.famished.org/rohr</a> until the client gets his domain name. <BR> <BR>Thanks.</font></font></font></font>'
