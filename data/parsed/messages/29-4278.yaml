    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks gang... <BR> <BR>Tanya: Yeah, I wrestled with the circle-r circle-r quandry. I suppose I could keep the logo pretty big &#40;1&#34;?&#41; and make the registration mark as small as legally possible. <BR> <BR>Yves: I might be smoking crack on the Arial-Frutiger thing... either way, they should probably be the same typeface. I definitely want a straight tail. I don&#39;t really want to use Helvetica, but I am not terribly happy with how other faces look.  <BR> <BR>My all-time favorite sans is Interstate but the LC looks like poo. Maybe Champion?</font></font></font></font>'
