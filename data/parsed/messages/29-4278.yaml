    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Is it just me, or does this logo look like it&#39;s set in Helvetica? And the R in the circle is more like Akzidenz Grotesk. I&#39;m a bit confused here. <BR> <BR>Another way of going at it would be to center name, circle and &#34;R&#34;. And by centering, I mean center mathematically along the horizontal axis and then adjust optically. <BR>Then you might wanna print out both versions &#40;Stephen&#39;s suggestion and mine&#41; at the same size and look at them from a distance. You&#39;ll notice that in Stephen&#39;s version the circle will be higher up, but the common baseline will give it a sense of stability and sturdiness, whereas mine will have a more  horizontal dynamic. It&#39;s your personal preference which will make you go for one version or another, as I think both are valid solutions. <BR> <BR>P.S. When you decide to opt for Helvetica for the logo, bear in mind that half the world and their sister&#39;s logo is set in Helvetica. Ask Erik Spiekermann &#40;<i>Rhyme &amp; Reason: A Typographic Novel</i>, pages 100-101&#41;. I&#39;ve got a hunch he might be right.</font></font></font></font>'
