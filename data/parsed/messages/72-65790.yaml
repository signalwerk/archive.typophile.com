  html: '<font class="dontLookLikeCrap">Buffalo, NY  - February 16, 2005 <BR> <BR>The &#34;Clifford Family&#34; of Script fonts. <BR>- New additions to the Sherwood Collection from P22 type foundry. <BR> <BR> <BR>The Clifford Bible, an historical novel by typographer Ted Staunton, traces seven generations of the Clifford family from entries on the flyleaves of an old family Bible. This collection of fonts, generated to augment the text, reflects some of the stylistic transitions that evolved over that period. <BR> <BR>The development of the Clifford Family paralleled typographer Ted Staunton�s authorship of a historical novel, The Clifford Bible. In the period between the English Civil War &#40;1640s&#41; and the Victorian Era &#40;1839-1901&#41;, seven generations of the Clifford family recorded significant aspects of their lives on the flyleaves of their family Bible. Over that time, their handwriting made stylistic transitions from gothic to copperplate, reflecting cultural influences and the characteristics imparted by the writing instrument- from the quill to the steel nib. The personalities of the family members are glimpsed through their handwriting, providing graphological researchers with clues for the last survivor of the Clifford line to interpret an ancient prophecy and claim his rightful inheritance. <BR> <BR>Each distinctive writing style was reconstructed as a font for Mr. Staunton&#39;s Book Project, but the availability to the public is a welcome addition to designers in search of authentic historical handwriting fonts. The fonts will be available for sale on March 1, 2005 exclusively through P22 type foundry&#39;s Sherwood Type Collection division. Each font can be downloaded separately or in one set, prices start at $19.95.  <BR> <BR>Samples of each font can be found at:  <BR><a href="http://www.p22.com/sherwoodtype/files/Virginian.pdf" target="_blank">http://www.p22.com/sherwoodtype/files/Virginian.pdf</a> <BR><a href="http://www.p22.com/sherwoodtype/files/Royalist.pdf" target="_blank">http://www.p22.com/sherwoodtype/files/Royalist.pdf</a> <BR><a href="http://www.p22.com/sherwoodtype/files/Grosvenor.pdf" target="_blank">http://www.p22.com/sherwoodtype/files/Grosvenor.pdf</a> <BR><a href="http://www.p22.com/sherwoodtype/files/Grenville.pdf" target="_blank">http://www.p22.com/sherwoodtype/files/Grenville.pdf</a> <BR><a href="http://www.p22.com/sherwoodtype/files/Elizabethan.pdf" target="_blank">http://www.p22.com/sherwoodtype/files/Elizabethan.pdf</a> <BR><a href="http://www.p22.com/sherwoodtype/files/Broadwindsor.pdf" target="_blank">http://www.p22.com/sherwoodtype/files/Broadwindsor.pdf</a> <BR><a href="http://www.p22.com/sherwoodtype/files/Chatham.pdf" target="_blank">http://www.p22.com/sherwoodtype/files/Chatham.pdf</a> <BR> <BR><img src="http://www.typophile.com/forums/messages/72/65506.gif" alt="Clifford Family"> <BR> <BR> <BR>----------------------------- <BR>P22 type foundry, Inc. <BR>  International House of Fonts <BR>  Lanston-P22 <BR>  Sherwood Type <BR>PO Box 770 <BR>Buffalo, NY 14213 <BR><a href="http://www.p22.com" target="_blank">http://www.p22.com</a> <BR>Phone: 716-885-4490 <BR>Fax: 716-885-4482 <BR>-----------------------------</font>'
