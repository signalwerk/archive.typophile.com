    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks Hrant. <BR> <BR>That&#39;s what I had suspected. Also saves a lot of space in this document. <BR> <BR>Cheers</font></font></font></font></font></font></font></font>
  - id: 71247
    user: 1250
    date: 2004-08-11T18:50:00
    date_raw: Wednesday, August 11, 2004 - 6:50 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hmmm. Hold everything, then. <BR>Are you using a small point size? If so, are you using the correct optical master? Because if you&#39;re setting a small size with an optical master for larger sizes&#42; that would explain InDesign&#39;s optical spacing using up a lot more room than the Metric setting, but that would also mean it&#39;s preferable. <BR> <BR>&#42; Does the setting look cramped and anemic? <BR> <BR>hhp <BR></font></font></font></font></font></font></font>
