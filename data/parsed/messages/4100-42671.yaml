  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Help! <BR> <BR>Using InDesign CS on a G5 running MacOS X.3.4 I&#39;m having problems with the opentype features of Minion Pro. See attached file. <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/42672.gif" alt="Ordinal problem in Minion Pro"> <BR> <BR>It seems to have something to do with the incorrect substitution of ordinals. Any help would be appreciated.</font></font></font></font></font></font></font></font></font></font></font>
