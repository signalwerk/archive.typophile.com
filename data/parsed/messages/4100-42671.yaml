    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">You&#39;re applying ordinals globally, which you shouldn&#39;t be. Only format as ordinals the specific bits of text you want to have ordinals. &#40;Same holds true for fractions, btw.&#41; <BR> <BR>T</font></font></font></font>
  - id: 71258
    user: 711
    date: 2004-08-11T21:21:00
    date_raw: Wednesday, August 11, 2004 - 9:21 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Don&#39;t apply discretionary ligatures to ordinals... that&#39;s the problem with 1st. I&#39;m not sure if Adobe could have built the fonts features in such a way as to avoid this, but it&#39;s easy to work around it. <BR> <BR>As to &#34;Notification&#34;, I&#39;m not sure how that&#39;s happening. Check what Opentype features you have active, and deselect them until it&#39;s ok.</font></font></font>
  - id: 71262
