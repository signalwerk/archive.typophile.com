    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks John and Thomas. <BR> <BR>Ordinals are definitely the problem. <BR> <BR>It&#39;s going to take a while finding all the ordinals to apply on a case by case basis with about 160pp. Any ideas on doing this? Is find and replace a good way to find the characters I&#39;ll need to change? <BR> <BR>Thomas - If I took off discretionary ligatures would it be possible to apply the ordinals globally? <BR> <BR>Thanks again everyone.</font></font>
  - id: 71263
    user: 909
    date: 2004-08-11T23:20:00
    date_raw: Wednesday, August 11, 2004 - 11:20 pm
    votes: null
    html: <font class="dontLookLikeCrap">Nope. You&#39;d still have the problem with &#34;Notification.&#34; That&#39;s the &#34;numero&#34; kicking in. <BR> <BR>By the way, the problem with the discretionary ligatures overriding the ordinals is a font bug, and could have been avoided by better feature construction. I filed the bug against the font, and hope to get it fixed in some future revision. Sorry about that. <BR> <BR>Regards, <BR> <BR>T</font>
