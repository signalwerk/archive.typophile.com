    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hrant <BR> <BR>I&#39;m using Minion Pro Regular 9/12. <BR>Section Heads � Frutiger bold 15/12 <BR>Subhead 1 - Frutiger bold 12/12 <BR>Subhead 2 � Frutiger bold 9/12 <BR>Subhead 3 � Minion Pro Bold italic 9/12 <BR>Footnotes � Minion Pro Caption 6/9 <BR> <BR>&#40;All space befores are multiples of 3pts&#41; <BR> <BR>This is an extremely complicated document that I have inherited. The previous version has 7 levels of headings plus some inline headings. It also had 5 different bullet styles even though there were only two levels of bullets. <BR> <BR></font></font></font></font></font></font>
  - id: 71254
