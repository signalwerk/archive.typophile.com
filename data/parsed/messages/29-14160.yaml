  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Some first raw sketches of a font to be used for logotypes. It is inspired by the wide capital letters in the corporate logotypes from companies like SHARP, BNP PARIBAS, INTERSHOP. <BR> <BR><a href="http://www.typografie.info/logotypia.gif" target="_blank"> http://www.typografie.info/logotypia.gif</a> <BR> <BR> <BR>I also think of a version with overlapping letters, and lots of ampersands and ligatures. <BR> <BR>What do you think? <BR> <BR>Ralf <BR> <BR></font></font></font></font></font></font></font></font></font>
