  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">hello <BR> <BR>here&#39;s OBAN my first font. <BR> <BR>based in the 60&#39;s tv screen, i tried to look for a great legibility in small sizes, so the counter is big enough to be printed at 4pt. <BR> <BR>i tried to look for the better readability without lose from sight the base point. &#40;the letter  &#39;o&#39;&#41; <BR> <BR><IMG SRC="http://www.typophile.com/forums/messages/29/963.gif" ALT="01"> <BR><IMG SRC="http://www.typophile.com/forums/messages/29/964.gif" ALT="02"> <BR><IMG SRC="http://www.typophile.com/forums/messages/29/965.gif" ALT="03"> <BR><IMG SRC="http://www.typophile.com/forums/messages/29/966.gif" ALT="04"></font></font></font></font></font></font></font></font></font></font></font>
