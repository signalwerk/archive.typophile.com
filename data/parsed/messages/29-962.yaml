  - id: 2708
    user: 1203
    date: 2002-03-14T16:53:00
    date_raw: Thursday, March 14, 2002 - 4:53 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> thanks a lot, for each comment, I&#39;ll take in consideration each of them, for soure. <BR> <BR>i&#39;m finishing some other works these next days, but as soon as i can i will post some corrections and also a text preview. by the  way i tried to use the font in flash to post it here but the same curves that work perfectly in freehand sometimes doesn&#39;t look good on flash  but other times do. i dont understand wy, but i don&#39;t really use flash usualy so maybe i&#39;m doing something wrong. <BR> <BR>by the way, it realy is my first font but i&#39;m working on it for some time ago, and in the last few years i had read a lot about type design, even before i started to draw these one and i had talked with some friens and done some research. <BR>so maybe that&#39;s the reasons, <BR>thanks a lot for the compliments, <BR>i gave my best to it. <BR> <BR>thanks, again, and see you as soon as i can, bring you more news. </font></font></font></font></font></font></font></font></font></font></font>
  - id: 2709
