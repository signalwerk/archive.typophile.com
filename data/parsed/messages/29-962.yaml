  - id: 2676
    user: 1250
    date: 2002-03-13T10:40:00
    date_raw: Wednesday, March 13, 2002 - 10:40 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Ruben, I agree with Stephen: I think you&#39;re lying.  ;-&#41; <BR> <BR>Seriously, pardon my language, but this is one goddam good design. I do happen to have a fetish for designs that combine the mechanical and the organic, but Oban &#40;great name, btw&#41; really is class. <BR> <BR>Stephen&#39;s suggestion for the numeral &#34;4&#34; is right on, but for the UC &#34;M&#34; I think it needs more than just a lower middle: it needs a curvier middle. Also: the &#34;K&#34; is imbalanced, the &#34;Q&#34; is amazing, the &#34;X&#34; too wide. <BR> <BR>In the lc, &#34;k&#34; and &#34;x&#34; have the same problems as above, but overall I&#39;m salivating to see some text. <BR> <BR>Non-alphanumerics: The exclamation/question color needs help, the dollar sign is the only one with a double bar that I&#39;ve ever liked, the ampersand rocks, the BP is too stiff, the Pilcrow is great, the Euro looks forced. <BR> <BR>More, please!! <BR> <BR>hhp </font></font></font></font></font></font></font></font></font></font></font>'
