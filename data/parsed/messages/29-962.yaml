    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Let me add my praise for this specimen. I love the squarish forms and gentle tapers. The whole alphabet is very exciting and has enormous potential. <BR> <BR>The lower leg of the K seems a bit thin, and the round corners of the Z seem inconsistent with the way you&#39;ve handled similar junctions.  <BR> <BR>As for the punctuation, the letterforms seem close - I think I&#39;d need to see the punctuation in context to judge their compatibility. </font></font></font></font></font></font></font></font></font></font></font>
