  - id: 2673
    user: 103
    date: 2002-03-13T10:11:00
    date_raw: Wednesday, March 13, 2002 - 10:11 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">ruben!  <BR>  <BR>First font, my foot! It&#39;s hard to believe you&#39;re  <BR>just starting out in type design when you have  <BR>such a great grasp of form and consistency.  <BR>  <BR>I like the base shape, the rounded corners and   <BR>the angled terminals. I&#39;m sure this face will   <BR>lend itself well to a bold weight too.  <BR>  <BR>Two small concerns:  <BR>  <BR>- The &#39;M&#39; distracted me immediately. I&#39;d like to  <BR>see the middle come down a bit to match the   <BR>other caps.  <BR>  <BR>- The &#39;4&#39;s counter is much smaller than any other  <BR>glyph. Maybe an open topped &#39;4&#39; is in order.  <BR>  <BR>It&#39;s very cool overall and there is certainly  <BR>a market for this look. Peter Bruhn of Fountain   <BR>might be watching this critique closely. See his  <BR><a href="http://www.fountain.nu/catalogue/mayo.asp" target="_blank">latest</a>.  <BR>  <BR>Stephen</font></font></font></font></font></font></font></font></font></font></font>'
