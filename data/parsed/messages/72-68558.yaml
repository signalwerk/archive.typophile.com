  html: '<font class="dontLookLikeCrap">April 1, 2005 -- Chicago IL, and Hollywood, CA -- Ascender Corporation today announced it has received venture capital funding to launch an entertainment division to be based in Hollywood for its new TV show: &#34;Pimp My Font&#34;. Last year Ascender self-funded a cable television series &#34;More Bling For Your Ring&#34; - a fascinating look at the mobile phone industry. To help promote the new show, Ascender today launched the <a href="http://www.pimpmyfont.com" target="_blank">http://www.pimpmyfont.com</a> website. <BR> <BR>�Based on the popularity of reality-based television programming featuring customized vehicles combined with the titillating culture of the font industry this is a project we couldn�t pass up�, said a network spokesperson who asked to remain anonymous. <BR> <BR>The show will be based in Chicago and all fonts will be pimped by Mid Coast Custom Characters, a wholly-owned subsidiary of Ascender Corporation. The MCCC crew has been pimping fonts for over 15 years for only the most kickin� companies. <BR> <BR>Xheight, the hip-hop typographic sensation, will play the part of Pimp Multiple Master of Ceremonies. In the show, Xheight and his font posse will be transforming fonts and lives. Xheight will be roaming the hood to help those guilty of committing heinous typographic style crimes and giving their fonts the ultimate pimp-over. <BR> <BR>Viewers shouldn�t be alarmed if Xheight tells someone he�s going to �put a cap in you�. He�s not talking about shooting them. He just wants to show them a new uppercase letter he�s pimped! <BR> <BR>Xheight and his homies will customize the coolest set of fonts on the planet for font users chosen at random from the Chicago area. The excitement mounts as a �phont� is chosen. Then the fun begins as typographic features such as supercharged terminals, neon wings, stem spoilers, chrome counters and old school figures are added. One of the goals of the show is to debunk the myth that customized fonts are expensive. Xheight says, �Customizing a font doesn�t have to cost a lot of snaps. The MCCC crew can bust a bezier likes no one�s business.� <BR> <BR>One of the features in each show will be called �Pimped or Wimped�. In this segment, font front-man, Em-Space, asks viewers to judge whether a font is phat or po. Hilarity ensues. <BR> <BR>Advance previews have been met with critical acclaim: <BR> <BR>- Urban Typographer exclaims, �Let�s get jaggy� <BR> <BR> - The London Times New Roman says, �True...Type� <BR> <BR> - Better Fonts and Handguns says, �Hint on playa, hint on...� <BR> <BR>For more information contact Ms. April Foo, the executive producer of Pimp My Font, or visit the website: <a href="http://www.pimpmyfont.com" target="_blank">http://www.pimpmyfont.com</a></font>'
