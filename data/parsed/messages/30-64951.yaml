    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Kris - <BR> <BR>Tufte answers the Bembo question: <BR><a href="http://www.edwardtufte.com/bboard/q-and-a-fetch-msg?msg_id=0000bm&amp;topic_id=1&amp;topic=Ask%20E%2eT%2e" target="_blank">http://www.edwardtufte.com/bboard/q-and-a-fetch-msg?msg_id=0000bm&amp;topic_id=1&amp;topic=Ask%20E%2eT%2e</a></font></font></font></font></font>'
  - id: 93292
    user: 571
    date: 2005-02-14T22:35:00
    date_raw: Monday, February 14, 2005 - 10:35 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I wonder if Monotype Imaging knows about ETBembo? While licensing contracts often don&#39;t condone altering a font, it certainly is a violation of contract to alter a font AND claim it for yourself. <BR> <BR>The earlier Tufte books were set by Michael Bixler in metal Monotype Bembo. They were printed photo offset from the composition proofs. <BR> <BR>Gerald</font></font></font></font>
  - id: 93295
    user: 909
    date: 2005-02-14T23:16:00
    date_raw: Monday, February 14, 2005 - 11:16 pm
    votes: 2
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I note that Tufte does not say that he altered the Monotype version of Bembo, but rather that it was a Bembo-like font designed by him and a couple of other folks. Whether he started with the Monotype font or not is unclear, but it seems to be implied that he didn&#39;t. <BR> <BR>Not that I&#39;m making any statement about whether it&#39;s legally or ethically okay, in either case. <BR> <BR>Cheers, <BR> <BR>T</font></font></font>
  - id: 93327
    user: 2021
    date: 2005-02-15T05:53:00
    date_raw: Tuesday, February 15, 2005 - 5:53 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;the computer people ignored &#34;squeeze,&#34; the slight spreading of ink when the lead type hits the paper <BR> <BR>Like many people who don&#39;t experiment much with typesetting &#40;especially book designers&#41;, Mr Tufte expects digital versions of the well known faces to duplicate the effect of letterpress. <BR> <BR>In the first place, this is not necessarily what the digital foundries set out to do. Secondly, it&#39;s not easy, and reviving a classic in such a manner may not be as good an idea as making a new face, eg Scala or Charter, to tackle the problem of &#34;digital to offset&#34;. <BR> <BR>Thirdly, if the complainants took a little more time to research the topic &#40;or employ someone to do same, or post on Typophile&#41; they would discover that there are many less-known versions of the classics which address the &#34;good as letterpress&#34; problem, eg Founders Caslon, MvB Verdigris, and several Shinn typefaces to boot. &#34;Jenson&#34; has been revised at least a dozen times: surely book publishers can find one of the digital versions that is compatible with their needs. Sorry, no quick answers, this IS rocket science, after all. <BR> <BR>BTW, the magnificent Monotype Bembo was their second attempt at the Griffo font, Poliphilus was the first, and they were pretty happy with it for a while.</font></font>'
