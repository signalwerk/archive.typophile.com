  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">After looking at one of the books by Mr Tufte with a colleague, we couldn&#39;t figure out how the thing was printed. It was set in Monotype Bembo and I have heard that it isn&#39;t digital. Does anyone know any details on the production/printing of his books?</font></font></font></font></font></font>
