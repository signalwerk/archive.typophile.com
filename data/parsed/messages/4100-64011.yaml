    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The phrase <a href="http://www.lyrics007.com/Vanilla%20Ice%20Lyrics/Ice%20Ice%20Baby%20Lyrics.html">&#34;rockman lover&#34;</a> comes &#40;at least as far as I know&#41; from the mind of superstar rapper Vanilla Ice. <BR> <BR>The idea is indeed to achieve &#39;cool&#39; through cheese, although it really only exists because the idea made me laugh. Now a friend wants to put it on shirts for his website. <BR> <BR>I think it will work eventually, although I am admittedly an amateur. Not to mention that his face needs a LOT of work. The mullet must be made longer.... <BR> <BR>The type is disgusting, which is what I think it needs. The question is, though, too disgusting? Too Pacman? Here&#39;s a slightly tweaked version... <BR> <BR>And thanks to all who comment on this awful thing. <BR><img src="http://www.typophile.com/forums/messages/4100/64051.jpg" alt=""></font></font></font></font></font></font>
