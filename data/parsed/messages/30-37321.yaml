  votes: null
  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Calling all Typophiles, I need your help. <BR> <BR>The company I work for is currently examining its style guide &#40;or lack thereof&#41;, which is opening up possibilities for changes. <BR> <BR>Currently we use ::shudder:: Condensed Helveticas for titling/ display and Times/ TNR for text. The Helveticas aren&#39;t up for debate, but the text face is. <BR> <BR>We&#39;re a Dutch company, so I&#39;m thinking that along with all of the obvious arguments against Times, I&#39;d use the origin of the type/ designer as secondary leverage and a way to narrow the field a bit. <BR> <BR>So, I know some of the foundries, such as DTL and TEFF, and some designers such as Majoor and Smeihjers, but I don&#39;t have a voluminous knowledge of Dutch Foundries, designers, and serif faces. What I need is a list to start examining examples from so I can hit them with a list of options that I&#39;ve culled from a greater one. Any help is very, very much appreciated! <BR> <BR>Thanks for any suggestions. <BR> <BR>PS: Wim Crouwel might be a bit too avante garde for our needs.  <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0></font></font></font></font></font></font></font></font></font>'
