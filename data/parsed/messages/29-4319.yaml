    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Maybe I don&#39;t know enough about &#39;bedrock&#39;  <BR>landscaping but I think the tension you&#39;ve got here  <BR>creates a negative connotation. <BR> <BR>Perhaps you could give more background on the type  <BR>of company, etc. </font></font></font></font>
