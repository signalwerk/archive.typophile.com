    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I agree,  <BR> <BR>to make the word rock fall down it has a negative connotation, the same as the tool you are using&#40;don&#39;t know the name in english&#41;, is too agressive. <BR> <BR>CG</font></font></font></font>
  - id: 9602
    user: 596
    date: 2003-01-13T13:02:00
    date_raw: Monday, January 13, 2003 - 1:02 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">To me before I &#42;read&#42; the logo it felt like a rock climbing logo. I think it was the color, the tool and feeling of gravity that it is expressing. There is a certain amount of adrenalin in this logo for me, something I usually don�t associate with landscaping. <BR> <BR>Regarding the tool, I don�t know what kind it is. If it is a tool that is used to extract bedrock than I think that the focus of the logo should be less about it�s origins and more about the results of the services offered. <BR> <BR>Or something like that. <BR> <BR>smc</font></font></font></font>
  - id: 9607
    user: 1328
    date: 2003-01-13T13:09:00
    date_raw: Monday, January 13, 2003 - 1:09 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Ok. My apologies for the lack of background. Bedrock Landscapes does high end custom rock work for cottages and homes. Decks, stairways, patios, beaches...etc.  They actually work with rock - meaning they carve, crack and shape the rocks into form. The client wanted to communicate the artistry and hand made approach that they take in their work. Hence the pick axe and breaking rock. They only work with rock which involves a lot of heavy lifting - which is why I went with the &#34;aggressive heavy&#34; feel.  Most landscaping companies are associated with grass, flowers and gardens. They don&#39;t do this kind of work. The want to be identified as people who work with rock.</font></font></font></font>
  - id: 9613
    user: 1258
    date: 2003-01-13T13:21:00
    date_raw: Monday, January 13, 2003 - 1:21 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I like it.  The aggressive edge works for me, assuming it&#39;s what the company wants to say about itself.  I like the colours too.  It&#39;ll look nice on the side of a white van. <BR> <BR>If you want to tinker and keep the text &#34;straight&#34;, you could take the pick-axe and cross it with a shovel in an X shape, like two swords or halberds would be crossed on a heraldric seal.  I think the tool has a strong shape, and it would be a shame to lose it. <BR> <BR>Paul</font></font></font></font>
