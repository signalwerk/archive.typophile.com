    html: <font class="dontLookLikeCrap">OK - so just dive into the deep end, I guess. That is what I was thinking in the first place, but thought it was worth the &#39;ask&#39;. <BR> <BR>I am really interested in the technical aspects of design. So, I am tempted to work on a text face, but I know the complexity of a text face would be overwhelming. <BR> <BR>Maybe I will not make any other commitment other than to start scribbling ides on paper? <BR> <BR>Thanks Dan, Hrant and Forrest for the replies and encouragement. <BR> <BR>Mike</font>
