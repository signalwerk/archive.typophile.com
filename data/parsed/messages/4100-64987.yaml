    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; advice from the pros. <BR> <BR>Pros? Where?!  :-/ <BR> <BR>If you don&#39;t have a &#34;Big Idea&#34; to work from, I&#39;d say you need some severe design constraints. Like take a shot at making a font for pharmaceutical packaging. Or a font that&#39;s as Art Nouveau as possible &#40;whatever you end up thinking that means&#41;. BTW, soon after gettting started in type design for real you might actually end up finding yourself <i>overwhelmed</i> with ideas, and be faced with Puijilittatuq. &#40;Look it up, dude, it&#39;s cool - cold even. :-&#41; <BR> <BR>And whatever you do, don&#39;t let arbitrary circumstances &#40;like a particular marking tool&#41; determine the outcome. &#34;Think with your brain.&#34;� <BR> <BR>hhp</font></font>
