    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>&#62;do whatever seems most interesting to you. In my case, that means a blackletter face, with some novel features &#40;I hope&#41;. </i> <BR> <BR>Hey Forrest, that was exactly what I thought when I started designing type a year and a half ago, too. You can see my results at <a href="http://www.typeoff.com" target="_blank">http://www.typeoff.com</a> &#40;look at the &#34;Ignaz&#34; fonts&#41;. Good luck! <BR> <BR>&#60;pep_talk&#62;Mike, I&#39;m a big theory-nerd myself, but when it come do designing, I like to sit down and just do it &#40;and keep doing, and so on&#41;. Your hands and your eyes will surprise you. After you&#39;ve gotten some results, you can step back from it and begin examining things, and getting advice from others. But in the beginning�just do! And don&#39;t give up or stop doing it�! &#60;/pep_talk&#62;</font></font></font>
