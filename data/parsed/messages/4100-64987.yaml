  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">OK - my big New Year resolution to myself was to design my first type face in 2005. <BR> <BR>I have been giving this a great deal of thought and would like a little advice from the pros. <BR> <BR>My basic question being, what is the best type of face to start with? Display? Text? Serif or sans serif? <BR> <BR>I ask because unlike the great American novelist, I am not bursting with a type face that burns in my soul, demanding to be put to paper. I do not have any great philosophy that I desire to translate into a face. <BR> <BR>I am just a type geek who wants to learn about the process of creating a face. I am viewing the project as simply a learning experience. <BR> <BR>My nature is to tackle more than I can handle. I do it all the time in life. You know, design the next great face and all that. But, the truth is I could not do it out of the starting gate if I wanted to. I just need to learn to walk before I can even think about running. <BR> <BR>So, what say you? Any suggestions for a guy who wants to work on a face as a recreational and learning endeavor?</font></font></font></font></font></font>
comments:
  - id: 92801
    user: 5605
    date: 2005-02-08T22:37:00
    date_raw: Tuesday, February 08, 2005 - 10:37 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This is a question I was asking myself, as I&#39;m doing the same thing &#40;have a copy of &#34;Learn Fontlab Fast&#34; in the mail, will probably buy Fontlab shortly thereafter, etc&#41;. I think the smartest thing to do is realize that, as with most creative pursuits, your first effort will most likely be a throwaway, and do whatever seems most interesting to you. In my case, that means a blackletter face, with some novel features &#40;I hope&#41;. <BR> <BR>I guess it also depends on what you&#39;re most interested in learning. How to make a &#34;useful&#34; typeface? Something flashier? How to master the tools for type creation? A yen to play around with OpenType&#39;s more gratuitous features? A desire to play with ideas of readability and legibility? A need to revive some neglected old style of type? Figuring that out should answer a lot of questions. <BR> <BR>I personally feel like starting with a serif body font would be the hardest thing imaginable; there are so many already and there&#39;s a lot of work involved in getting one to look good. And I&#39;m still wrapping my head around the subtleties of the 10,000 available modernist sans; there&#39;s no way I feel qualified to start with one of those. By contrast, I have a lot of opinions about blackletter type and it&#39;s not a field that&#39;s exactly bursting with activity at the moment, which gives me some freedom. <BR> <BR>Also, this site has a ton of useful advice for beginners: <BR> <BR><a href="http://briem.ismennt.is/" target="_blank">http://briem.ismennt.is/</a> <BR> <BR>His advice on workflow is particularly helpful.</font></font></font></font></font>'
