  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Dear typophyles: <BR>I&#39;m working in a proyect that includes a font design compatible with Laudatio, thanks to Nadine Chahine I could make some corrections. This is the book cover layout. <BR>Can you send me your comments? <BR>Thanks.<img src="http://www.typophile.com/forums/messages/4100/57338.gif" alt="Book cover layout"></font></font></font></font></font></font>'
