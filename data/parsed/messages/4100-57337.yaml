    html: <font class="dontLookLikeCrap">The book format is 22x22 cm. and the text box is 15 cm width. I have used 14,5 pt in arabic text and 11 pt in latin text size, wiht this meassures I can obtain the same number of pages and similar distribution of the text... <BR>This is a comfortable read in both languages.</font>
