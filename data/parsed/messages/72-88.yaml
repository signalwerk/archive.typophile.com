  html: the Susan Garretson Swartzburg �60 <BR>Memorial Book Arts Series <BR>presents <BR> <BR>O N E   W O M A N &#39; S   W O R K <BR> <BR>a lecture by the internationally renowned typographic designer <BR>Carol J. Blinn, May 2-3, 2001 on the Wells College Campus <BR> <BR> <BR>&#40;AURORA, NY&#41; Proprietor of the Warwick Press in Easthampton, Massachusetts <BR>since 1973, Carol J. Blinn will discuss her life�s work as a typographic <BR>designer, book artist, commercial letterpress printer, paper decorator, hand <BR>bookbinder, and private press publisher during an exclusive engagement at <BR>Wells College on May 2, 2001 at 8:00 p.m. in Cleveland Hall Auditorium. This <BR>lecture, &#34;One Woman�s Work,&#34; is part of the Susan Garretson Swartzburg �60 <BR>Memorial Book Arts Series. A reception in Morgan Hall will follow Ms. <BR>Blinn�s talk. Both events are free and open to the public. <BR> <BR>On the following day, May 3, the Book Arts Center will host a workshop <BR>entitled, &#34;How to Stencil a Duck &amp; Other Good Things.&#34; The workshop, led by <BR>Ms. Blinn, will be held from 10:30 a.m.-12:30 p.m., and it will be held at <BR>the Wells College Book Arts Center, Morgan Hall in Aurora, NY. The workshop <BR>is limited to 8 participants. Advance registration and payment are required
