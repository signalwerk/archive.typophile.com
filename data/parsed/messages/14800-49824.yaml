  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hello all, <BR> <BR>Was wondering if anyone could come up with a decent logo for a research group - High-Speed Systems Engineering &#40;HSSE&#41;. Think along the lines of high-speed wireless, fiber optics, fast chips, that kind of thing. <BR> <BR>I&#39;m stumped for ideas right now, and would greatly appreciate your suggestions / works. <BR> <BR>Many thanks in advance!</font></font></font></font>
