    html: '<font class="dontLookLikeCrap">What is the target audience?  Like who are you doing research for - a company, an academic instituion, for fun?  I think a part of the problem is that the name is too generic.  All of the words are sort of logical and unbrandable, so it&#39;s hard to really get something unique for it.   <BR> <BR>You can advocate motion in the type and logo to advocate &#34;high-speed&#34; and try to use edgy shapes and sans fonts as opposed to rounded shapes and bubbly or serif fonts. <BR> <BR>I think you&#39;ll need a bit more than just high-speed as a concept though.  Try and pick a niche that your research group does; like something you guys spend a lot of time on and advocate that in your logo.  Besure that it&#39;s not a fad rearch topic, but something specific yet broad that will make sense for years to come. <BR> <BR>Since my company called Upfactor is also a technology company that is highly focused on an engineering process &#40;however, this is software engineering and not hardware/networking&#41;, I can sort of understand what you probably want. <BR> <BR>One logo that comes to mind is Quest&#39;s, which is simple and effective: <a href="http://www.qwestwireless.com/" target="_blank">http://www.qwestwireless.com/</a>.  They showed motion in the line that looks like light moving to make a blue Q.  Since your organization starts with an H and ends with an E, I wouldn&#39;t recommend the circular motion so much but that&#39;s something you might want to think about but try to express it more logically &#40;as opposed to designish&#41; and creatively &#40;since you are a research group&#41;.  Actually, if your work is more evolutionary rather than revolutionary, then you might want to advocate that as well.  If it&#39;s revolutionary, pick something that is very different than the status quo.  If it&#39;s evolutionary, then maybe express incremental designs and so on in some way. <BR> <BR>Ken&#60;/font&#62;</font>'
