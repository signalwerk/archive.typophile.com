    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">What kind of student project is this? Seems like a fairly lazy instructor.</font></font></font></font></font>
  - id: 89601
    user: 1477
    date: 2005-01-18T08:27:00
    date_raw: Tuesday, January 18, 2005 - 8:27 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Well, yes, my tutor is lazy. We are given progressively harder briefs, and taught nothing! <BR>Which is exactly why I posted for help here.</font></font></font></font>
  - id: 90249
    user: 3162
    date: 2005-01-23T09:04:00
    date_raw: Sunday, January 23, 2005 - 9:04 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Sounds just like my course. I&#39;d say research a lot into the history of the product &#40;launched as an alternative to all the conventional fizzy drinks?&#41;, who came up with it initially, and try to recapture the intial ethos of the brand &#40;and represent it in graphic form&#41;. <BR> <BR>You could base the logotype on an existing typeface, and then draw out rougher versions/variations in pencil for a more organic look maybe...</font></font></font>
  - id: 90367
    user: 1461
    date: 2005-01-24T08:20:00
    date_raw: Monday, January 24, 2005 - 8:20 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Push back on the professor. This is a brief without any context.  <BR> <BR>&#34;reclaim the quirkiness of the Snapple attitude&#34; <BR> <BR>What does that mean? You need to force your professor to more clearly define the project. What is the current market? What&#39;s the new target market? What&#39;s wrong with the current brand system? What is the primary competition? Secondary? Regional markets? etc, etc.</font></font>
  - id: 90405
    user: 108
    date: 2005-01-24T10:37:00
    date_raw: Monday, January 24, 2005 - 10:37 am
    votes: null
    html: <font class="dontLookLikeCrap">I don&#39;t want to stand-up for the teacher, but sometimes, in the real world, your clients won&#39;t give you much more to go on. You could take such a short brief as allowing you more freedom.  <BR> <BR>What do you see as quirky? Who do you think the target market it? Could it be you? What do you think is quirky? Make some lists. Write down all of your thoughts and then start doodling/sketching based on those thoughts.</font>
