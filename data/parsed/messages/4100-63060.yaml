post:
  id: 89423
  user: 1477
  date: 2005-01-16T07:49:00
  date_raw: Sunday, January 16, 2005 - 7:49 am
  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi I have an assignment to redesign the logo of Snapple &#40;drink&#41;.  The brief is to reclaim the quirkiness of the Snapple attitude - it is a drink that doesn&#39;t overpromise &#34;unthink it&#39;s just a drink&#34;. - it is the antithesis of drinks that promise life-changing experiences. But it is laid back but fun, unusual, natural. <BR> <BR>I have not designed logo&#39;s before. Are there any typefaces/advice anyone can recommend? Also, what do you think is the best software for logo design. <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/63061.gif" alt="logo"> <BR>please ignore that landscape above the logo ! :D</font></font></font></font></font></font></font></font>
comments:
  - id: 89480
    user: 2289
    date: 2005-01-17T06:53:00
    date_raw: Monday, January 17, 2005 - 6:53 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Adobe Illustrator &#40;or vector based drawing programme&#41; is the best software to use. While designing you have to think of all the media it might be applied to and you may need to change to suit your medium &#40;for example web, large and small printing, paper type, embossing &amp;c &amp;c&#41;. There are many things to consider, choice/number of colours that can be faithfully reproduced in different media � this reduces your pallette, some purples and oranges will not always reproduce well in four colour printing, web gamut is different to cmyk, choice of typeface to base it on &#40;it is probably best to develop a logo from a typeface&#41; will tiny serifs print small, will they look good on the side of a van. <BR>On the sample you have shown you have a drop shadow which is not always possible to use due to resolution problems, laying it over a spot/metallic colour. You may have to develop reverse/mono versions.  <BR>That said this should be very fun project. <BR>Tim</font></font></font></font></font></font></font>
  - id: 89560
    user: nick-s-users
    date: 2005-01-17T20:11:00
    date_raw: Monday, January 17, 2005 - 8:11 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Make sure your logo does three things. <BR>1. Is relevant to what the company stands for. <BR>2. Is original. Make sure it stand out from the company&#39;s competitors. <BR>3. Is impactful. People should take notice of the logo when they see it.  <BR> <BR>A great site to check out is <a href="http://www.identityworks.com" target="_blank">www.identityworks.com</a>. The theories that are presented here are quite sound. <BR> <BR>Good luck!</font></font></font></font></font></font>
  - id: 89591
    user: 1461
    date: 2005-01-18T06:55:00
    date_raw: Tuesday, January 18, 2005 - 6:55 am
