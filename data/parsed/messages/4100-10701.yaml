  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Does anyone have any preference between or thoughts about Glypha versus Serifa? &#40;I have both families.&#41; <BR> <BR>Obviously there are similarities. Adrian Frutiger designed them both, and I read something that said Glypha is &#34;based on&#34; Serifa. <BR> <BR>Glypha has an extra black weight, which is an advantage for my purposes, and Serifa seems to have a smaller x-height. Serifa seems a little hipper or cooler and Glypha seems a little cheesy to me... I think it has a kind of 1970s vibe. <BR> <BR>But these are just my opinions. I&#39;d really like to know what other people think. <BR> <BR>Thanks.</font></font></font></font></font>
