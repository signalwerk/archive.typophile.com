  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The  Cary Library - <A HREF="http://wally.rit.edu/cary/" TARGET="_top">http://wally.rit.edu/cary/</A> - is a bastion of type and printing history. Examples from all the masters as well as old printing presses. This resource is part of the School of Printing. Printing and Type history classes are held in this archive library. <BR> <BR>The Goudy Center - <A HREF="http://www.rit.edu/~goudyctr/" TARGET="_top">http://www.rit.edu/~goudyctr/</A> - is also sponsired by RIT.</font></font></font></font></font>
