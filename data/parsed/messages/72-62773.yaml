  html: '<font class="dontLookLikeCrap">Pardon the cross-posting with some mailing lists, but.... <BR> <BR>Adobe has an IMMEDIATE opening for a font rasterizer tester. This is a middle-term contract position, preferably located in Seattle but San Jose is also possible. We want somebody with some real programming skills who also knows something about fonts, on both a technical and a visual level. <BR> <BR>Position Summary: White-box Quality Engineer in the Adobe CoreTechnology group developing test code for type rasterization technology implemented in C and C#. Design, develop, and deploy white box tests covering API usage, font rendering, and interaction within a larger test framework implemented in Microsoft .NET Framework, running under Windows XP. Review and report on test progress and test coverage, work closely with a small team of senior developers. Learn and deploy Core Technology QE tools and practices. Knowledge &amp; Skills Requires a BS in CS or related field and at least 3-5 years of industry experience with excellent coding skills and a passion for software quality. Strong software design skills. Ability to create and follow development plans and schedules. Good problem-solving abilities to quickly determine issues and provide solutions. Proven skills in working independently and collaboratively with software development and quality teams. Excellent written and verbal skills. Focused platform experience with Windows XP, .NET. Knowledge of font technology highly desirable, including Type1, CFF, TrueType, OpenType. Scripting skills: Perl, Python, JavaScript, or Visual Basic a plus. C/C&#43;&#43; experience a plus. <BR> <BR>If you&#39;re interested and available, I&#39;ll be doing some light screening, and passing your resume along to the hiring manager. <BR> <BR>T <BR> <BR>Thomas W. Phinney <BR>Program Manager <BR>Fonts &amp; Core Technologies <BR>Adobe Systems</font>'
