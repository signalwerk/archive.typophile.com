    date_raw: Saturday, February 08, 2003 - 6:12 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>I don&#39;t have a lot of references on hand re. the use of   <BR>colour in Ethiopic </i>[...]<i> these bi-chromatic glyphs are   <BR>normative for the Ethiopic script.</i>  <BR>  <BR>Thanks. In fact, my interest is not so much in the Ethiopic   <BR>and Ge&#39;ez scripts per se, but rather in the use of color as  <BR>a semantic element in writing systems in general.  <BR>  <BR><i>By the way, Ethiopic is not an alphabetic script. It derives   <BR>from the Sabean abjad &#40;consonant alphabet, e.g. Arabic   <BR>and Hebrew&#41; of Yemen, but developed into a syllabic writing   <BR>system in which most signs represent a consonant&#43;vowel  <BR>combination.</i>  <BR>  <BR>Interesting evolution. There are authors, BTW, that argue that  <BR>these vowelless semitic alphabets are in fact an intermediary  <BR>state between a sillabary and a true alphabet.</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
