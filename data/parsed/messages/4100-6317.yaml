  votes: null
  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Im looking for &#34;quotes&#34; and written information, to back up the ideas of these three colors being the &#34;ultimate combination&#34; of colors... ie: roger blacks ideas and such... I have a presentation to make to a group, and Im looking for information to backup my ideas...</font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
comments:
  - id: 12005
    user: 916
    date: 2003-02-06T05:45:00
    date_raw: Thursday, February 06, 2003 - 5:45 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Well, a quote for you:    <BR>    <BR>�Most early printers confined their efforts to black     <BR>and red, or some variant of red.�    <BR>[...]    <BR>�Red is the most satisfactory secondary color with black,     <BR>and you will often find that it is better to use just one     <BR>spot of color on the page. In using red for an occasional     <BR>display line, blue-red or purple-red or orange-red should     <BR>be avoided. A red such as the early printers had, a     <BR>full-bodied, rather dull vermillion, which will hold up well     <BR>with the black, is the most successful.�    <BR>� Bruce Rogers, <i>Paragraphs on printing</i>.    <BR>  <BR>A contemporary  master of the use of red &#40;<i>zinnober</i>, as   <BR>he prefers&#41; as the second color is Jost Hochuli. See for  <BR>instance his <i>Gutenberg-Galaxie 1</i>.</font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 12042
    user: 108
    date: 2003-02-06T09:59:00
    date_raw: Thursday, February 06, 2003 - 9:59 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I could be wrong on this one, but I also believe that red was the least expensive color to produce. During the period of the Incunabula that is.  <BR> <BR>For today, Red is a great color because, IMO, it can hold its own against black.  <BR> <BR>Seems we have a bunch of Massimo Vignelli haters here, which I am not one of, but he as well at Kit Hinrichs &#40;Pentagram et al&#41; use red a lot as well. I&#39;ll bet they have some quotes. And Olgilvy.</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 12161
    user: 1026
    date: 2003-02-06T19:08:00
    date_raw: Thursday, February 06, 2003 - 7:08 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I believe it&#39;s Brent Berlin and Paul Kay, in <i>Basic Color Terms</i>, who say that the third color term in the development of natural languages is the one for red. And I think R L Gregory says in <i>Eye and Brain</i> that red is the third color that the eye perceives &#40;after black and white, of course&#41;. That could have something to do with it. That&#39;s a lot of guessing and hedging though - I&#39;ll try to look those up when I get home tonight.</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 12165
    user: 1258
    date: 2003-02-06T20:23:00
    date_raw: Thursday, February 06, 2003 - 8:23 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>I believe it&#39;s Brent Berlin and Paul Kay, in Basic Color Terms, who say that the third color term in the development of natural languages is the one for red.</i> <BR> <BR>I&#39;ve heard something of the kind from other sources.  And I believe &#40;going from memory here&#41;, red is followed by blue, and then yellow, and then green in language development.  &#40;and then colours like orange, brown, purple, and so on&#41; <BR> <BR>That&#39;s responsible for part of the in-born misconception that yellow is a primary colour. <BR> <BR>Not only &#34;primitive&#34; languages show this phenomenon.  Japanese people still call many green things blue &#40;<i>aoi</i>, and in fact they had no common word for green until Crayola needed one for their green &#40;<i>midori</i>&#41; crayon. <BR> <BR>And in English, we say people have red hair, even when it&#39;s clearly a shade of orange or amber. <BR> <BR>What this has to do with typography, I have no idea. <BR> <BR>Paul</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 12170
    user: 1262
    date: 2003-02-06T23:57:00
    date_raw: Thursday, February 06, 2003 - 11:57 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Mary Kay Duggan has written some interesting articles related to the use of the colour red in European manuscripts and early printing. See, for example, her essay on early printed Missals in the journal of the Printing Historical Society No.22 &#40;1993&#41;. She has some beautiful <a href="http://sheetmusic.berkeley.edu/205list.html">images</a> online. <BR> <BR>Of course, the use of red for instructions in the Missale Romanum has given us the word <i>rubric</i>, which in one meaning is a law or unbreakable rule. <BR> <BR>The use of black and red in Ethiopic manuscripts is <i>extremely</i> important. Although an exact parallel cannot be made, one can think of red being used in Ethiopic texts in the same way that italics or smallcaps are used in European typography: as an articulating, semi-semantic element. Arguably, religious texts in the ancient Ge&#39;ez language cannot be correctly written without both red and black.</font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 12194
    user: 916
    date: 2003-02-07T04:25:00
    date_raw: Friday, February 07, 2003 - 4:25 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>one can think of red being used in Ethiopic texts in the   <BR>same way that italics or smallcaps are used in European   <BR>typography: as an articulating, semi-semantic element.   <BR>Arguably, religious texts in the ancient Ge&#39;ez language   <BR>cannot be correctly written without both red and black.</i>  <BR>  <BR>Hmmm, this is interesting. Do you have references for these?  <BR>Another case of semantic color is in certain precolumbian   <BR>Mexican scripts where the same pictogram can mean &#39;water&#39; <BR>or &#39;blood&#39; depending on its color. But I wasn&#39;t aware of these   <BR>cases of semantic color in alphabetic scripts you mention.</font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 12202
