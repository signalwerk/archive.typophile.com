  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Earlier this year, there was a thread about use of text figures in mathematics: <a href="http://www.typophile.com/cgibin/discus.pl?pg=next&amp;topic=4100&amp;page=34733" target="_blank">http://www.typophile.com/cgibin/discus.pl?pg=next&amp;topic=4100&amp;page=34733</a> This made me wonder, have typographers also used small caps for mathematics? I was thinking this could make uppercase variables stand out less from the surrounding text when they are discussed. Does anyone have thoughts about wether or not this is a good idea, or perhaps links to some resources about the subject? <BR> <BR>Torgeir</font></font>'
comments:
  - id: 84358
    user: 3169
    date: 2004-11-29T15:05:00
    date_raw: Monday, November 29, 2004 - 3:05 pm
    votes: null
    html: '<font class="dontLookLikeCrap">Not a good idea. Mathematics is a language in which typographical features -- upper case, italic, bold, script, fraktur, &#34;blackboard bold&#34;, etc. -- have established conventional associations. And, perhaps more important that their specific associations, they are used to make distinctions: <i>s</i> and <i>S</i> are different things, and setting the latter as a small cap would render a piece practically unreadable.</font>'
