    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The .swf you linked to in your first  <BR>post is coming to me as <BR>/__Gonk_brian_My_Documents_fonts_Ironweaver_002-4333.unk <BR> <BR>.unk stands for <i>unknown</i>, of course? <BR>It seems there&#39;s something to fix here. <BR></font></font></font></font></font></font>
  - id: 9658
