    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks for the GIFs. <BR> <BR>Very elegant, ethereal. I can see certain magazines and such wanting to use it. <BR> <BR>I think the UC &#34;C&#34; needs more flourish, the 1st UC &#34;G&#34; doesn&#39;t work, and the simpler UC &#34;I&#34; is better, except its symmetry is ungainly: try just moving one of the small horizontal joins down. <BR> <BR>The lc : I think it should stay without flourishes, and you might check out the work of Gudrun von Hesse for possible guidance: <a href="http://www.myfonts.com/person/zapf-von-hesse/gudrun/" target="_blank">http://www.myfonts.com/person/zapf-von-hesse/gudrun/</a> <BR> <BR>hhp <BR></font></font></font></font></font></font>'
