  - id: 10668
    user: 1316
    date: 2003-01-25T02:01:00
    date_raw: Saturday, January 25, 2003 - 2:01 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I love it. But why in blackletter/uncial? It&#39;s pretty epigraphic, apart from the decorated caps. <BR>To download the flash file, just option-click and change the name to Ironweaver002.swf <BR>It has worked for me.</font></font></font></font></font></font>
  - id: 10862
    user: 851
    date: 2003-01-27T22:17:00
    date_raw: Monday, January 27, 2003 - 10:17 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey! You could poke someone&#39;s eye out with that! <BR> <BR>I see where the blackletter influences fit in. The undecorated letters remind me of Diotima, Koch Antiqua, and Nicholas Cochin.  <BR> <BR>The letters are very thin, though. Have you started bumping up against the limitations of em-square granularity? Speaking of which, also be careful of sharp, acute angles in your contours. They&#39;re usually not a problem, but can sometimes cause strange rendering artifacts on certain output devices. <BR> <BR>Some of the decorated caps can be confusing, <BR>since the stem widths are so close to the hairline strokes. I&#39;ll have to look at it some more before I can offer more useful advice. But you should definitely continue with it... you&#39;ve got something there.</font></font></font></font></font></font>
