  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">My freelance identity needs to be updated. I&#39;ve been wondering if I should continue using my name or should I create a business name &#40;would it seem more professional/substantial or just gimicky&#41;? For now, I have decided I would prefer to go with my name. I know it&#39;s a very personal decision, but I&#39;m curious as to the process others have used to come up with their name, is it ok to use a private joke? Does it have to be something the client &#34;gets&#34;? Many of the other posts have debated over whether or not an individual should have a personal logo. I feel that as a graphic designer the answer is yes. Attached are 2 business card designs, please let me know what you think, if you have a preference, and how you think they can be improved upon. Thanks in advance, I value all of your input.  <BR> <BR><img src="http://www.typophile.com/forums/messages/29/40865.jpg" alt="kncard_A"> <BR> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/40866.jpg" alt="kncard_B"></font></font></font>
