    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">In Norwegian and Danish, &amp;ldquo;&amp;aelig;&amp;rdquo; is not a ligature of &amp;ldquo;a&amp;rdquo; and &amp;ldquo;e&amp;rdquo;, but an independent letter, representing the vowel sound in English &amp;ldquo;hat&amp;rdquo;. Using &amp;ldquo;ae&amp;rdquo; as a substitute for &amp;ldquo;aelig;&amp;rdquo; in Norwegian and Danish would be akin to using &amp;ldquo;vv&amp;rdquo; as a substitute for &amp;ldquo;w&amp;rdquo; in English&amp;mdash;comprehensible, but jarring. <BR> <BR>Regarding &amp;ldquo;et cetera&amp;rdquo; vs &amp;ldquo;et caetera&amp;rdquo;: either is acceptable, but the former is found more frequently than the latter, at least in English language contexts. <BR> <BR>I believe that &amp;ldquo;&amp;aelig;&amp;rdquo; and &amp;ldquo;&amp;oelig;&amp;rdquo; usage in &#40;post-Anglo-Saxon&#41; English had been preferred for words ultimately of Greek origin that were spelled with alpha-iota and omicron-iota respectively. As the Latin word &amp;ldquo;c&#40;a&#41;eterus&amp;rdquo; [for which &amp;ldquo;c&#40;a&#41;etera&amp;rdquo; is likely the feminine ablative] is not of Greek origin, it probably shouldn&amp;lsquo;t be spelled with &amp;aelig;.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
