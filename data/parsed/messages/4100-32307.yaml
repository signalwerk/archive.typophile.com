    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">In Old &#40;and Middle&#41; English, the character � represents the vowel now called the &#34;short-A&#34; sound:  i.e. <b>c�t</b> &#40;Cat&#41; or the letter&#39;s name, which is <b>�sc</b> or <b>�sh</b> and pronounced &#34;ash&#34;.  The � ligature, I am told, represents &#40;in archaic English usage, anyway&#41; the sound of the German � or oe.  &#40;On a side note, inspection of fa�imil�s of Martin Luther&#39;s Bible frontspiece and Genesis 1 page reveals that the origin of the German umlaut comes from writing an actual, superscripted &#34;e&#34; above the vowel in question.&#41;  The one letter <i>I</i> want added to the ASCII 256 is that thing called &#34;yogh&#34;.  It is usually printed to look like the numeral 3, and carries a gutteral &#34;gh&#34; sound no longer used in English.  Any more, it had been replaced by g, gh, or consonantal y.  Darn Unicode!</font></font></font></font>'
