    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">On 39 alt. It does say the most about typofile, and is in that sense most complete, as Christos has pointed out.  <BR> <BR>But completeness is not always an aesthetic virtue. In drama one of the ways that dialogue fails is being &#34;on the nose&#34;:  <BR>it says exactly what the character is thinking, which people rarely do in life.  <BR> <BR>I think 39 is too &#39;on the nose&#39;. Also the multiple perspective &#39;T&#39; is awkward looking. <BR> <BR>In the context of a &#39;T&#39; it seems to me that being visually exciting and causing the viewer to ask &#39;What&#39;s that about?&#39; is preferable.    </font></font></font></font>'
