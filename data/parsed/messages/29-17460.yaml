    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">29.016 &amp; 17 <BR>Very pretty shirts that I&#39;d wear but not vote for becuse they are short on concept. <BR> <BR>29.013 <BR>Is a gem of an concept. Just short on execution � the type y&#39;all! <BR> <BR>Waxing Introspective/Philosophic: <BR>Maybe it&#39;s time in advertising that made me so concept focused. The best graphic design is also. It seems often we designers are often satisfied with making the job look nice rather than handling the soul of the poject... But in the end, what comes first? Execution? or Concept? For a shirt, I&#39;d say, exectution. But both is better in my book.   <BR> <BR>BTW, it&#39;s a little odd criticizing anonymous work in front of the workers. No offense folks! I bet if you knew which was mine you&#39;d say: Concept? Execution? What was he raving on about? So many tastes, so many opinions. <BR> <BR>Cheers, <BR>Randy</font></font></font></font>'
