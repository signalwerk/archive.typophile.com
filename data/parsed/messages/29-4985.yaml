    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">On a general note: I quite like it. <BR> <BR>Haven&#39;t got much time right now, but please do check the setting of your body copy: there&#39;s some nasty gaps in the lines of text. I&#39;m posting an image to show you what I mean. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/4989.gif" alt="This is what I mean"> <BR> <BR>The easiest way would be to ditch QuarkXPress and lay-out the piece in InDesign. ;&#41; <BR> <BR>The choice of type is sound, but I&#39;m wondering if the illustration doesn&#39;t refer to Japanese manga a bit too much. I don&#39;t know what the Brits think of this? Anyone?</font></font></font></font>'
