  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">this is my first attempt in using illustrator and i have to create an identity for a non-profitable organisation &#34;Acres For Elephants&#34;. this is what i&#39;ve come up with and the &#34;a&#34; seems so out of place. i&#39;m not a graphic-background student but i&#39;m trying my best in my new multimedia course. any suggestions to improve the logo or a new typeface is greatly appreciated. thanks in advance! <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/53686.jpg" alt="afe logos"></font></font></font></font></font></font></font></font></font></font>
