    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Gloria two more thoughts. When you post here you will get an error message. Just go back one page and then scroll to the topics section at the top of the page hit it and you will see your name as the most recent post in the category you posted.  <BR>I did a recent Elephant Illustration in Painter check it out in my Illustration page. Just look up my info to get the url</font></font></font></font></font></font></font>
  - id: 82869
    user: 2933
    date: 2004-11-16T08:33:00
    date_raw: Tuesday, November 16, 2004 - 8:33 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I love the idea of making portions of the elephant out of the acronym. I respectfully disagree with Mr. Weaver, however, and I think that the &#34;a&#34; and &#34;e&#34; are necessary, and with a more effective integration would make this mark wonderfully unique. I do believe in KISS, but I think it can be applied here to the silhouette instead of removing a great layer of meaning.  <BR> <BR>I see the &#34;e&#34; in 1,2,3,5,6 as an ear, and see that with a different perspective, like a 3/4 view, that there may be potential to work the &#34;a&#34; in a similar way, on the other side of the elephant&#39;s head.  <BR> <BR>For that matter the logo could be a lot more about the head and less about the whole body, I would consider further exploration within this main concept area. <BR> <BR>I do like #4 for it&#39;s blend of contemporary and muted colors.  <BR> <BR>Aaron</font></font></font></font></font></font>'
