    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;I think my prof wanted me to stay with the more traditional ampersand though <BR> <BR>It took me a while to figure this out, but in design school I realised that I was the one who was more or less in charge of what I did, so long as it wasn&#39;t stupid. I reckon that teachers, tutors, professors whatever love seeing something else, they sometimes like to see things that aren&#39;t completely within the regime of the brief. Tutors can never be clients, and even clients can be persuaded otherwise.  <BR> <BR>Nice logotype, given the constrraints. Have you considered making the main strokes 2 squares thick and the thins 1 square thick? or even 3:2? I say this because the serifs on the n,m,r,s and c are too chunky, out of proportion. I wouldn&#39;t trash the Et idea, I have seen some pretty &#34;traditional&#34; ampersands that are created in such a manner. <BR> <BR>kris.</font></font></font>
  - id: 51899
    user: 1286
    date: 2004-03-15T19:18:00
    date_raw: Monday, March 15, 2004 - 7:18 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#34;think my prof wanted me to stay with the more traditional ampersand though&#34; <BR> <BR>The more &#39;obvious&#39; Et ampersand, is really more more &#39;traditional&#39;. <BR> <BR>Maybe what you are saying is the exact opposite, you professor may want you to go with a more &#39;modern&#39;, or stylized ampersand. <BR> <BR>In case you did not know Et is latin for &#39;and&#39;, this is how the ampersand came about, was a latin &#39;and&#39; ligature. <BR> <BR>Hildebrant.</font></font>
