    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;m in no way a fan of gridnik type design, but one thing you can do is use the &#34;Et&#34; structure of the ampersand instead of the conventional one - it&#39;s more grid friendly. <BR> <BR>Like in Rotis: <BR><a href="http://www.myfonts.com/fonts/linotype/agfa-rotis-sans-serif/agfa-rotis-sans-serif/win-t1/191190/character/0026/CP2/1/" target="_blank">http://www.myfonts.com/fonts/linotype/agfa-rotis-sans-serif/agfa-rotis-sans-serif/win-t1/191190/character/0026/CP2/1/</a> <BR> <BR>hhp <BR></font></font></font></font></font></font>'
