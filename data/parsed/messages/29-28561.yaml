  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">For my second year form and concept class we have been working with grid based lettering. In order to learn the rules before breaking them.  We are limited to perfectly circular forms and 45� angles, but we are allowed to stray from the rules slightly as long as we stick to the grid. <BR> <BR>Our current assignment is to create a wordmark for Precision Tools &amp; Instruments. a ficticious company.  I have designed the letters needed as simply as possible, roughly based off a sample from a type specimen book.  <BR>The problem is the ampersand. It&#39;s becoming to weird looking and inconsistent.  I think I have an understanding of what should be happening , but am having problems getting there....   any help, maybe outlines of similar fonts to look at would be greatly appreciated, thanks guys..... <BR> <BR>Mike<!--attachment: precision-28562.pdf*mime_pdf.gif*application/pdf*243.3*Precision%2epdf*precision%2epdf --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align=left alt="application/pdf">Precision.pdf<br><a href="http://www.typophile.com/forums/messages/29/precision-28562.pdf" target="_blank"><b>precision.pdf</b></a> (243.3 k)</td></tr></table></center><!--/attachment--></font></font></font></font></font></font></font>'
