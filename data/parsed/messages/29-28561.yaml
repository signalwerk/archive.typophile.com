    html: <font class="dontLookLikeCrap">hmmm,  I see what you mean.  I&#39;m going to try those suggestions tonight.  <BR>I think I was just more hesitant to use something that was closer to latin in something really modern. <BR> <BR>Kris, thanks for the sugestions,  I originially saw this as more of a unistroke, but adding thicks and thins might really make this sing....   <BR>I&#39;ll add some updates tonight.</font>
