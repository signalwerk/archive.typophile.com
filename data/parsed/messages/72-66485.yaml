  html: '<font class="dontLookLikeCrap">============================================================ <BR>LinoLetter 03/05 - Designs Determined to Inspire <BR>============================================================ <BR>An online version, illustrated with images of this month�s  <BR>featured typefaces, is available on the Linotype website via  <BR>the following link: <BR>- <a href="http://www.linotype.com/8-38-8-18144/issue2005-03.html" target="_blank">http://www.linotype.com/8-38-8-18144/issue2005-03.html</a> <BR> <BR>! Welcome to the March issue of LinoLetter ! <BR> <BR>INTRODUCTION: <BR>Breaking News: Elementis and Pirouette, two fresh new fonts  <BR>from Linotype, were awarded &#34;Certificates of Typographic  <BR>Excellence in Type Design&#34; at the Type Directors Club�s  <BR>2005 TDC2 Type Design Contest! <BR> <BR>Looking for a popular sans serif? For a limited time only,  <BR>our complete Basic Commercial family is on sale for one  <BR>low-price. Additionally this month, we�d like to direct  <BR>your attention to another font that lies close to our  <BR>industrial-styled hearts: Quartan. Rounding out this issue  <BR>of the LinoLetter is a recap of our recent TypoTechnica 2005  <BR>conference and the typographic developments announced there. <BR> <BR>Have fonts of fun! <BR> <BR> <BR>------------------------------------------------------------ <BR> <BR>IN THIS ISSUE:  <BR> <BR>1.  Eccentrically Harmonious - The Elementis Font Family <BR> <BR>2.  The Typeface in the New York Subway System - Basic <BR>    Commercial <BR> <BR>3.  Unicase Meets Industrial - Quartan by Maria Martina <BR>    Schmitt <BR> <BR>4.  Impressions from TypoTechnica 2005 <BR> <BR> <BR> <BR>____________________________________________________________ <BR> <BR>1.  Eccentrically Harmonious - The Elementis Font Family <BR>____________________________________________________________  <BR> <BR>Hans-J&uuml;rgen Ellenberger began his work on Elementis in 1975  <BR>with the goal of transforming the rounded forms of an  <BR>alphabet so that all letters would have the same gray value.  <BR>However, as was typical of the time, his design required a  <BR>number of complicated and cumbersome development steps and  <BR>had to be postponed. He would not resume work on the the  <BR>project until over 20 years later, when the desktop  <BR>publishing revolution made it possible to digitize his  <BR>designs for further processing. In one sense, the completed  <BR>font family might be considered a tribute to the  <BR>difficulties that all type designers faced in the  <BR>pre-digital age. <BR> <BR>Elementis� letters display a delightfully quirky character  <BR>sure to liven up any document. The five-member type family  <BR>has received substantial critical acclaim. Aside from  <BR>winning an honorable mention in Linotype�s 2003 International  <BR>Type Design Conference, Elementis received a &#34;Certificate of  <BR>Excellence in Type Design&#34; from the Type Directors Club�s  <BR>2005 TDC2 Type Design Contest, where it was even selected as  <BR>one of the &#34;Judges� Choices&#34;! Considered to be the most  <BR>important annual competition among type designers,  <BR>Ellenberger could be considered a perennial favorite at the  <BR>TDC2: his Carlin Script family was a winner there in 2003. <BR> <BR>Take a closer look at Elementis and Carlin Script: <BR>- <a href="http://www.linotype.com/6-23-6-17055/elementis.html" target="_blank">http://www.linotype.com/6-23-6-17055/elementis.html</a> <BR>- <a href="http://www.linotype.com/60370/carlinscript-family.html" target="_blank">http://www.linotype.com/60370/carlinscript-family.html</a> <BR> <BR> <BR>A second Linotype typeface was awarded a &#34;Certificate of  <BR>Excellence in Type Design&#34; at the 2005 TDC2 as well:  <BR>Pirouette. Japanese designer Ryuichi Tanteno developed  <BR>this formal engravers� hand from 1999�2003, and was  <BR>heavily influenced by master calligrapher/type designer  <BR>Hermann Zapf�s Zapfino in the process.  <BR>- <a href="http://www.linotype.com/6-23-6-17051/pirouette.html" target="_blank">http://www.linotype.com/6-23-6-17051/pirouette.html</a> <BR> <BR> <BR>____________________________________________________________ <BR> <BR>2.  The Typeface in the New York Subway System - Basic <BR>    Commercial <BR>____________________________________________________________ <BR> <BR>As far as sans serif text faces go, you�ll always be on the  <BR>safe side with this old favorite: the Basic Commercial font  <BR>family epitomizes clear and objective design. These classic  <BR>forms have very few unusual qualities, and remain both  <BR>lively and legible in all weights. Perhaps this anonymity is  <BR>the reason that Basic Commercial�s style has been popular  <BR>with graphic designers for decades! <BR> <BR>Basic Commercial�s design has a century�s worth of history  <BR>behind it. The typeface was distributed for many years in  <BR>the United States under the name Standard Series, where it  <BR>worked its way into many aspects of daily life and culture:  <BR>for instance, it was the face chosen for use in the New  <BR>York City subway system�s signage. <BR> <BR>Grab all eight Basic Commercial font styles together in one  <BR>low-price value pack: <BR>- <a href="http://www.linotype.com/6-2387-6/basiccommercialvp.html" target="_blank">http://www.linotype.com/6-2387-6/basiccommercialvp.html</a> <BR> <BR> <BR>____________________________________________________________ <BR> <BR>3.  Unicase Meets Industrial - Quartan by Maria Martina <BR>    Schmitt <BR>____________________________________________________________ <BR> <BR>The Austrian designer Maria Martina Schmitt developed this  <BR>series of fonts for designers to use when setting chunks of  <BR>text en masse. Being a unicase design, Quartan�s letterforms  <BR>have no ascenders or descenders; lines of text may be  <BR>stacked virtually on top of one other. This offers a  <BR>multitude of possibilities for headline, logo, or corporate  <BR>identity design. Quartan�s three styles exude a curious  <BR>industrial quality, which enhances their unicase, building  <BR>block nature. <BR> <BR>Check out and enjoy Quartan�s unique unicase features:  <BR>- <a href="http://www.linotype.com/7-2397-7/quartan.html" target="_blank">http://www.linotype.com/7-2397-7/quartan.html</a> <BR> <BR> <BR>____________________________________________________________ <BR> <BR>4.  Impressions from TypoTechnica 2005 <BR>____________________________________________________________ <BR> <BR>Linotype�s TypoTechnica 2005 conference at London�s St.  <BR>Bride Printing Library was an intimate gathering of renowned  <BR>type designers, industry-leading font technicians, small  <BR>Internet font foundry owners, and students. All came to  <BR>garner the latest updates from the world of font technology,  <BR>and the program did not disappoint. At the top of the list  <BR>of announcements was Quark, Inc., who gave their first  <BR>public preview of QuarkXPress 7.0�s new typographic  <BR>features. <BR> <BR>Other conference highlights included lectures from  <BR>Microsoft�s Paul Nelson and Adobe�s David Lemon concerning  <BR>the future development of the now established OpenType  <BR>format, as well as a visually inspiring keynote address by  <BR>the legendary type designer Matthew Carter. <BR> <BR>A detailed summary of the conference can be found here: <BR>- <a href="http://www.linotype.com/18142/alookback-doc.html" target="_blank">http://www.linotype.com/18142/alookback-doc.html</a>  <BR> <BR> <BR> <BR>------------------------------------------------------------ <BR> <BR>Don�t Forget! <BR> <BR>Linotype.com offers a wide variety of possibilities that may  <BR>help you find the right typeface or font package, as well as  <BR>the chance to try the fonts out and make purchases. This  <BR>month, check out our OpenType info pages, and our Movie  <BR>Fonts section. <BR> <BR>OpenType <BR>OpenType is a new cross-platform font format,  <BR>collaboratively developed by Adobe and Microsoft. OpenType  <BR>fonts offer many advanced typographic features to their  <BR>users, including the capability to switch between alternate  <BR>glyphs, and to set multiple languages and writing systems  <BR>harmoniously. The Linotype OpenType collection is  <BR>constantly growing, and currently includes over 3,300 fonts.  <BR>Learn more: <BR>- <a href="http://www.linotype.com/7-1475-7/liste.html" target="_blank">http://www.linotype.com/7-1475-7/liste.html</a> <BR> <BR>Movie Fonts <BR>What fonts are used in films? We constantly notice  <BR>exceptional, humorous, and romantic typefaces on movie  <BR>posters or announcements and wonder which fonts were used  <BR>in them. Linotype�s up-to-date Movie Fonts page is worth a  <BR>second look. See this month�s hottest selections at: <BR>- <a href="http://www.linotype.com/7-2255-7/moviefonts.html" target="_blank">http://www.linotype.com/7-2255-7/moviefonts.html</a> <BR> <BR> <BR>&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42; <BR> <BR>We hope you found this issue of LinoLetter informative and  <BR>useful. We would highly appreciate your feedback at  <BR><a href="mailto:info@linotype.com">info@linotype.com</a> <BR> <BR>The next issue of this newsletter will be published and  <BR>dropped in your mailbox at the beginning of April. <BR> <BR>Your Linotype Library Online Team <BR> <BR> <BR>------------------------------------------------------------ <BR>Publisher: <BR>Linotype Library GmbH <BR>Du-Pont-Stra�e 1 <BR>61352 Bad Homburg / Germany <BR> <BR>Website: <a href="http://www.linotype.com" target="_blank">www.linotype.com</a> <BR>Contact: <a href="mailto:info@linotype.com">info@linotype.com</a> <BR>Phone &#43;49 6172 484-418 <BR>Fax   &#43;49 6172 484-429   <BR>------------------------------------------------------------ <BR>&#40;c&#41; 2005, Linotype Library GmbH, All rights reserved.</font>'
