  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">While I was compiling the linguistic kerning pair data, I realized that it might also be useful &#40;in fact probably more so, when you think about it&#41; to have <i>adjacency</i> data - to see what letters are likely to be on the left and right of a given letter. This can help not only in optimizing spacing &#40;and kerning&#41;, but also in designing the letterforms themselves, for example by allowing fine-tuning of the whitespace relationships between/within the glyph bodies. As in the kerning data, this is based on an English corpus, so it&#39;s largely &#40;but not entirely&#41; limited to optimizing English setting. <BR> <BR>&#40;109K&#41; <a href="http://www.themicrofoundry.com/other/kf_adj.pdf" target="_blank">http://www.themicrofoundry.com/other/kf_adj.pdf</a> <BR> <BR>Notes: <BR>1&#41; For each letter &#40;center column&#41;, on each side are the letters most likely to occur in decreasing frequency away from the center. The spaces separate frequency groups, while beyond the dash it&#39;s pretty slim pickings in terms of frequency. The asterisk on a side of a letter indicates that that row is 1/10 less frequent than the overall table norm&#42;. As a reference, the most two frequent adjacencies are &#34;th&#34; and &#34;he&#34;, both at above 100K instances&#42;&#42;, then it drops to about 50K &#40;for &#34;an&#34; and &#34;in&#34;&#41;, and the rest is mostly bunched up. <BR>2&#41; I used UC letters ro avoid apparent-leading issues - obviously lc is the real name of the game. <BR>3&#41; Sorry it&#39;s so ugly... <BR> <BR>&#42; So for example you can tell that b, p and v occur mostly as initial letters. <BR> <BR>&#42;&#42; The corpus has about 4.5 million pairs. <BR> <BR>hhp <BR></font></font></font>'
