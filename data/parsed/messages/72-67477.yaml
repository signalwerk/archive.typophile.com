  html: '<font class="dontLookLikeCrap">WOBURN, Mass. &amp; SALFORDS, Surrey, England, March 16, 2005 � Monotype Imaging Inc. has enhanced Fonts.com with several features, including the ability to purchase multi-user licenses, establish user accounts and find fonts through added search capabilities. Fonts.com has also debuted typefaces from the Font Bureau and FontFabrik foundries, adding more than 1,200 products which can be viewed, purchased and downloaded from <a href="http://www.fonts.com" target="_blank">www.fonts.com</a>.  <BR> <BR>�For years, we�ve prided ourselves on our superior selection of quality fonts and unrivaled service and support,� said David DeWitt, general manager of Monotype Imaging�s consumer division. �Our new Web enhancements, along with our ability to continually add high-quality typefaces, allow us to boast Fonts.com as offering the Internet�s best font service, font selection and font site.� <BR> <BR>Standard licenses purchased through Fonts.com for most font products automatically protect up to five users. Customers seeking additional users on a single license can simply increase the number of users displayed in the shopping cart. A multi-user license is then created on a per-user basis at a discounted rate, instead of having to purchase the product multiple times to cover more than five users. <BR> <BR>New user accounts allow customers to store contact information for faster check-out procedures. Customers can also manage subscription preferences for Fonts.com�s electronic and hard copy newsletters, �Clicks� and �National Typographic.� <BR> <BR>Search options have been enhanced to include product searches by name, keyword, typeface classification, font foundry and typeface designer. The ability to display sample font images automatically while searching can be turned on or off. Visitors can also filter searches to limit results according to a specific computer platform or font format. <BR> <BR>Additional detail is included on product pages when available, such as the typeface designer, font classification and whether the product contains the euro currency symbol. Product pages display all fonts included in the product and list other packages that contain any of the displayed fonts. <BR> <BR>Also added are more than 1,200 products from two font foundries new to Fonts.com � Font Bureau and FontFabrik. Based in Boston, Font Bureau specializes in creating typographic identities for newspaper publishers. Font Bureau�s Interstate� family is based on the signage alphabets of the U.S. Federal Highway Administration. FontFabrik of Berlin, Germany, is home to the LucasFonts� collection. FontFabrik�s Thesis� family contains more than 300 fonts, including the Serif� and The Sans� typefaces.  <BR> <BR>About Fonts.com <BR>As the Internet�s most comprehensive and convenient place to preview, purchase and download fonts, Fonts.com offers single fonts, packages, family volumes and type libraries, including both the Monotype� and ITC� libraries. Visitors are greeted with clear navigation and multiple search options in addition to articles, tips and techniques. Live customer care representatives are available to assist in identifying and selecting typefaces and to resolve technical issues. Fonts.com also provides information about Monotype Imaging�s custom font services. <BR> <BR>About Monotype Imaging <BR>Based in Woburn, Mass. with regional offices in the U.K., Chicago, Redwood City, Calif., Japan and China, Monotype Imaging provides fonts and font technologies to graphic professionals, software developers and manufacturers of printers and display devices. Formerly Agfa Monotype Corp., the company also provides print drivers and color imaging technologies to OEMs &#40;original equipment manufacturers&#41;. Monotype Imaging is home to the Monotype� typeface library, a collection that includes widely used designs such as the Arial�, Times New Roman� and Gill Sans� typeface families. Monotype Imaging offers fonts and industry-standard solutions for most of the world�s written languages. Information about Monotype Imaging and its products can be found on the company�s Web sites at <a href="http://www.monotypeimaging.com" target="_blank">www.monotypeimaging.com</a>, <a href="http://www.fonts.com" target="_blank">www.fonts.com</a>, <a href="http://www.monotypefonts.com" target="_blank">www.monotypefonts.com</a>, <a href="http://www.customfonts.com" target="_blank">www.customfonts.com</a>, <a href="http://www.fontwise.com" target="_blank">www.fontwise.com</a>, <a href="http://www.itcfonts.com" target="_blank">www.itcfonts.com</a> and <a href="http://www.faces.co.uk" target="_blank">www.faces.co.uk</a>. <BR> <BR>Monotype is a trademark of Monotype Imaging Inc. registered in the United States Patent and Trademark Office and may be registered in certain jurisdictions The Monotype Imaging logo is a trademark of Monotype Imaging Inc. and may be registered in certain jurisdictions. Arial, Times New Roman and Gill Sans are trademarks of The Monotype Corporation registered in the United States Patent and Trademark Office and may be registered in certain jurisdictions. All trademarks are the property of their respective owners. � 2005 Monotype Imaging Inc. All rights reserved. <BR> <BR># # # #</font>'
