  - id: 102293
    user: 909
    date: 2005-04-29T12:46:00
    date_raw: Friday, April 29, 2005 - 12:46 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">So, broadly speaking, the scoop is this: <BR> <BR>OS X 10.4 &#40;&#34;Tiger&#34;&#41; dynamically maps OpenType features to AAT features. So in theory, existing applications that support AAT will also see OpenType fonts working much the same way. You should be able to get OpenType small caps, ligatures, oldstyle figures, etcetera in Keynote and TextEdit. Apple has not yet implemented OpenType support for features needed to handle &#34;complex script&#34; languages such as Arabic and Indic, however. <BR> <BR>I can&#39;t say we&#39;ve tested Tiger&#39;s OpenType support here at Adobe - unfortunately, we&#39;ve just been too swamped with other big projects that had similar schedules to Tiger &#40;CS2, Garamond Premier, etc.&#41;. However, we are pleased to see Apple offering such support at the system level, broadening the base of OpenType support. Having Apple as an increasingly involved partner in the OpenType effort can only be good for third party developers and end users. <BR> <BR>Regards, <BR> <BR>T <BR> <BR>Thomas Phinney <BR>Program Manager <BR>Fonts &amp; Core Technologies <BR>Adobe Systems</font></font></font></font></font></font></font></font></font></font></font>'
