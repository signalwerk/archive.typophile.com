    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">No need, Thomas. I&#39;ll go ahead and announce it now: <BR> <BR>All Adobe CS apps are now part of the Tiger desktop in the form  of <a href="http://www.apple.com/macosx/features/dashboard/" target="_blank">Dashboard Widgets</a>.  <BR>Yep, that&#39;s right.  <BR>Drag a file to the PhotoWidget and run a gaussian blur.  <BR>Draw beziers directly in the IllyWidget and save as EPS.  <BR>Drag a text file to the InDyWidget, select the font and number of columns,  <BR>and out comes a beautiful PDF newsletter! <BR> <BR>Never launch an Adobe CS app again!</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
