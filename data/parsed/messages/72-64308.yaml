  html: '<font class="dontLookLikeCrap">============================================================ <BR>Linotype Press Release - Compatil meets M�venpick <BR>============================================================ <BR> <BR>The Linotype Compatil type system � a core element in the  <BR>revitalized M�venpick brand <BR> <BR>Bad Homburg, January 31, 2005. The type system Compatil from  <BR>Linotype Library now serves as a central design element for  <BR>communicating the new brand values of the multinational  <BR>corporation M�venpick. �Offering enjoyment � indulging in  <BR>special treats � nurturing the genuine,� these are the  <BR>brand values which M�venpick�s new image aims to express.  <BR>Carolin Versteeg, Head of Brand Consulting at the  <BR>responsible communication agency �k&uuml;lling partner identity�  <BR>in Zurich, comments on her company�s strategy: �The brand  <BR>should appear elegant but not luxurious; classic,  <BR>straightforward, sensuous and international, with Swiss  <BR>style. The myriad possibilities offered by the Compatil font  <BR>family are very convincing, especially for a complex  <BR>Corporate Design program.� As a result, the various  <BR>emotional accents of the font styles Fact, Text and Exquisit  <BR>can all be implemented as integrated components in the new  <BR>Corporate Design. Although the M�venpick brand has a clear  <BR>and unified parent company strategy, specific brand worlds  <BR>had to be established which fulfilled the needs of each  <BR>corporate division � in essence, four operatively  <BR>independent entities &#40;Hotels &amp; Resorts, Service Gastronomy,  <BR>Travel Gastronomy and Wine&#41;. The differences between the  <BR>divisions can best be noticed in the choice of color climate  <BR>and typography. Consequently, two strategic goals could be  <BR>attained: revitalizing the parent company brand as a whole  <BR>as well as defining communication measures tailored to the  <BR>specific target groups of each division. Florence Mayor,  <BR>Head of Corporate Communications for the M�venpick Group  <BR>explains it like this: �As a new CI standard, the Compatil  <BR>type system is convincing not only because of its high  <BR>quality design but also because of its impressive systems  <BR>concept � which corresponds well with our corporate  <BR>structure, integrating various divisions within one parent  <BR>company.� After the successful restart of the brand�s image  <BR>in 2003, the rebranding will subsequently continue in all  <BR>corporate divisions of the M�venpick Group to be completed  <BR>by the end of 2005. <BR> <BR>For further references on the new M�venpick brand image  <BR>please visit: <BR>- <a href="http://www.moevenpick-group.com" target="_blank">http://www.moevenpick-group.com</a>  <BR> <BR>Further information on the Compatil type system can be  <BR>found at: <BR>- <a href="http://www.linotype.com/6-1806-6/compatil.html" target="_blank">http://www.linotype.com/6-1806-6/compatil.html</a> <BR> <BR> <BR>If you would like further information, please contact: <BR> <BR>Linotype Library GmbH <BR>Du-Pont-Stra�e 1 <BR>D-61352 Bad Homburg <BR>Tel.: &#43;49 &#40;0&#41; 61 72 - 484 - 24 60 <BR>Fax: &#43;49 &#40;0&#41; 61 72 - 484 � 5 24 60 <BR>E-Mail: <a href="mailto:info@linotype.com">info@linotype.com</a> <BR>Website: <a href="http://www.linotype.com" target="_blank">http://www.linotype.com</a> <BR> <BR>------------------------------------------------------------ <BR>Linotype Library GmbH, based in Bad Homburg, Germany and a  <BR>member of the Heidelberg Group, looks back onto a history of  <BR>118 years . Building on its strong heritage, Linotype  <BR>Library develops state-of-the-art font technology and offers  <BR>more than 6,000 original fonts, covering the whole  <BR>typographic spectrum from antique to modern, from east to  <BR>west, and from classical to experimental. All typefaces &#40;in  <BR>PostScript� and TrueType� format as well as more than 1,400  <BR>fonts in OpenType�&#41; are now also available for instant  <BR>download at <a href="http://www.linotype.com" target="_blank">www.linotype.com</a>. In addition to supplying  <BR>digital fonts, Linotype Library also offers comprehensive  <BR>and individual consultation and support services for font  <BR>applications in worldwide &#40;corporate&#41; communication. <BR>------------------------------------------------------------</font>'
