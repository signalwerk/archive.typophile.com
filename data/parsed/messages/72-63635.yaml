  html: '<font class="dontLookLikeCrap">============================================================ <BR>Linotype Press Release - Get on top of what�s hot in <BR>                         typography! <BR>============================================================ <BR>Let loose with Linotype in London at TypoTechnica 2005 <BR> <BR>Bad Homburg, January 21 2005. This February, Linotype  <BR>Library is inviting typography professionals from around the  <BR>world to convene for two days &#40;and nights&#41; of discussions on  <BR>the trade�s top technological developments. To be held this  <BR>year at the St Bride Printing Library in London, this third  <BR>official TypoTechnica Conference promises participants more  <BR>than simply an inspiring setting. From speakers like Matthew  <BR>Carter, John Hudson and Rich Roat to topics like upcoming  <BR>features in QuarkXPress 7, latest font related technology  <BR>issues in Avalon�, the new Microsoft� graphic device interface,  <BR>and how to maximize use of OpenType and Unicode. The two days  <BR>are guaranteed to fly by with more highlights than we could  <BR>fit on a single page. Whether you want to just listen, get  <BR>hands on experience or actively participate in discussions,  <BR>the modular set up the conference offers something for  <BR>everyone and lets you make the most of each day according to  <BR>your interests. And to wind down, as a special extra on  <BR>Saturday, Linotype will offer a stimulating tour through the  <BR>St Bride Printing Library. <BR> <BR>There is only space for a limited number of participants.  <BR>So don�t wait. Register now! And see you in London from  <BR>the 17th-19th of February, 2005. For anyone already in town  <BR>on Wednesday the 16th, a nearby tavern is especially reserved  <BR>for all typography friends who want to get started with a  <BR>splash. <BR> <BR>Click here to see the conference schedule and registration  <BR>info: <BR>- <a href="http://www.linotype.com/8-2358-8/typotechnica2005.html" target="_blank">http://www.linotype.com/8-2358-8/typotechnica2005.html</a> <BR> <BR>or e-mail <a href="mailto:typotechnica2005@linotype.com">typotechnica2005@linotype.com</a>. <BR> <BR> <BR>If you would like further information, please contact: <BR> <BR>Linotype Library GmbH <BR>Du-Pont-Stra�e 1 <BR>D-61352 Bad Homburg <BR>Tel.: &#43;49 &#40;0&#41; 61 72 - 484 - 24 60 <BR>Fax: &#43;49 &#40;0&#41; 61 72 - 484 � 5 24 60 <BR>E-Mail: <a href="mailto:info@linotype.com">info@linotype.com</a> <BR>Website: <a href="http://www.linotype.com" target="_blank">http://www.linotype.com</a> <BR> <BR>------------------------------------------------------------ <BR>Linotype Library GmbH, based in Bad Homburg, Germany and a  <BR>member of the Heidelberg Group, looks back onto a history of  <BR>118 years . Building on its strong heritage, Linotype  <BR>Library develops state-of-the-art font technology and offers  <BR>more than 6,000 original fonts, covering the whole  <BR>typographic spectrum from antique to modern, from east to  <BR>west, and from classical to experimental. All typefaces &#40;in  <BR>PostScript� and TrueType� format as well as more than 1,400  <BR>fonts in OpenType�&#41; are now also available for instant  <BR>download at <a href="http://www.linotype.com" target="_blank">www.linotype.com</a>. In addition to supplying  <BR>digital fonts, Linotype Library also offers comprehensive  <BR>and individual consultation and support services for font  <BR>applications in worldwide &#40;corporate&#41; communication. <BR>------------------------------------------------------------</font>'
