    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hrant, <BR> <BR>Thanks for the suggestion. I don&#39;t believe Print was on my radar screen at all, and it&#39;s rather admirable &#40;I&#39;m going on the PDFs; I should check out Print itself--presumably St Bride&#39;s, which I work very close to but have never visited, would have it&#41;. To my eye it teeters on the edge of being too condensed &#40;I suppose I mean, it is on the edge of actually appearing condensed&#41;. But I suppose &#34;teetering on the brink&#34; successfully is a fair hallmark of good design, and it certainly looks promising. <BR> <BR>BTW, I do wish it was easier to find raw data about things like cap-height, copyfitting etc -- the sort of thing you get in older books on book design. I know the figures don&#39;t tell the whole story, but they do tell quite an interesting story, and it would be very useful when looking at a sample to be given them.</font></font></font>
