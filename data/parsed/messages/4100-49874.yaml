  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">We have a significant service coming up at the &#40;Church of England&#41; church I go to in London--the Bishop is coming to dedicate a newly painted icon. It is a black madonna, given in memory of a 16 year old victim of a shooting. I think it warrants special thought about the design of the service book, and I am considering getting a new typeface specifically for it. <BR> <BR>The core requirements are: <BR> <BR>&#40;1&#41; Economical, especially in horizontal space consumption. Because prayers are set like verse, one wants to avoid turnover lines, and a slightly condensed type does that. <BR> <BR>&#40;2&#41; A good legible bold because prayers the congregation says are set in bold. It needs to be easily distinguishable from the normal weight, but also easy to read. <BR> <BR>&#40;3&#41; A self-effacing italic, because italic is used for rubrics which are not particularly important. <BR> <BR>&#40;4&#41; A low cap-height because prayers are full of capital letters scattered mid-sentence &#40;God, Jesus Christ, Holy Spirit, Father, Son, Lord etc ...&#41; and one wants to minimize the ugliness. <BR> <BR>&#40;5&#41; A good plain text face -- nothing sentimental or churchy in either the Victorian &#40;Ye Gothicke&#41; or modern &#40;sentimental calligraphic&#41; veins. <BR> <BR>I saw Arnhem in Kinross&#39;s Unjustified Texts, and thought that it might work. But it&#39;s expensive enough that I don&#39;t want to make a mistake. Does anyone have any experience of using it? Would it fit the bill. <BR> <BR>&#40;PS: The CofE itself used to use Palatino, and currently uses Gill Sans. I have used both Ehrhardt and Galliard in the past. Orthodoxy for home-produced services is either Arial &#40;they think it&#39;s Gill&#41; or Comic Sans &#40;cos it&#39;s &#34;friendly&#34;, of course&#41;, but I&#39;m a heretic.&#41;</font></font></font></font></font></font></font></font>'
