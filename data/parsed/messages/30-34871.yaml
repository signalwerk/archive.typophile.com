    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;the Caslon sans of the 1820s, so praised for its early appearance, has no real relevance. <BR> <BR>Huh? The guy invents a major genre and it&#39;s irrelevant?! The sans is present in the specimen books of UK typefounders &#40;I&#39;m not familiar with other countries, but I would imagine the same situation&#41; from the 1830s, and in steady use, especially advertising, subsequently. <BR> <BR>Caslon&#39;s sans had a very geometric quality -- circular Os and straight-legged R etc. Figgins sans&#39;s of the 1830s show an indecision between geometric and grotesque qualities, with versions at different sizes leaning one way or the other. <BR> <BR>Those earliest sans were Bold and Caps only, and appear to have been used mainly for contrast, in text work. The most popular early sans was probably the Bold Condensed style, used in a range of sizes, particularly in commercial jobbing. Regular weight sans faces were used in the 1840s. <BR> <BR>I suspect that the introduction of lower case to the sans genre pushed it in a grotesque direction, as the world was not ready for a geometric lower case at that time &#40;the 3rd quarter of the 19thC&#41;, when the radical tone of the early century had become more conservative. <BR> <BR>AG is well-known for the logic of its systematic family, and it is tempting to equate this modernist idea with the sans genre -- however, almost no-one used sans faces for text in 1900. In fact it was the massively popular Cheltenham that lead the way in being a face with a large family that you could set an entire job in: heads, decks, subheads, and text.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
