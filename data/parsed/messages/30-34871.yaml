    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I see, you still freelance for Finnish companies? <BR> <BR>Back to topic... I wonder if the Neue Haas grotesk was simply Haas grotesk with lower case, and maybe some changes in weight and height. <BR> <BR>I like the weight of the sample although it�s kind of blurred. Something like semibold.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 60969
    user: 3135
    date: 2004-05-19T13:18:00
    date_raw: Wednesday, May 19, 2004 - 1:18 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;In �Grid Systems� M�ller-Brockmann writes about a face called Berthold, that isn�t exactly AG as I know it...&#60; <BR> <BR>A friend of mine from Bern named Peter Megert, who used to work for M�ller-Brockmann years ago, always refered to AG as &#34;the Berthold&#34; and said this was a common usage among Swiss designers. I had always called it &#34;Standard&#34; but this was the 60s when I worked with Peter at Westinghouse Corporate Design Center. <BR> <BR>ChrisL</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 61024
    user: 1373
    date: 2004-05-20T03:27:00
    date_raw: Thursday, May 20, 2004 - 3:27 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">That explains it, thanks. <BR> <BR>The film version is just alot more geometric then... <BR> <BR>Standard was the official name in the States, but Berthold was just a short for Berthold Akz... I guess. There was Linotype AG too, not long ago. Now Basic Commercial. <BR> <BR>The AG old face seems to bear closest resemblance to the metal versions I�ve seen and enjoyed. Berthold�s site doesn�t give much info.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 61051
    user: 3135
    date: 2004-05-20T07:38:00
    date_raw: Thursday, May 20, 2004 - 7:38 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I had the pleasure of meeting and studying with Wolfgang Weingart in the mid 80s. He told me about discovering a few old, dusty, forgotten job cases of AG in the bowels of the type shop in Basel. He described how he had &#34;awakened them from sleep&#34; and began a long partnership with the fonts. You can see examples of his work with the quite extraordinary &#40;and to my mind best&#41; version of AG in his book &#34;Weingart: Typgraphy�My Way to Typography&#34; and &#34;Design Quarterlly 130&#34; among others. <BR> <BR>ChrisL </font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 61130
    user: 1042
    date: 2004-05-20T16:25:00
    date_raw: Thursday, May 20, 2004 - 4:25 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; but Berthold was just a short for Berthold Akz... I guess. There was Linotype AG too, not long ago. Now Basic Commercial. &#60; <BR> <BR>There is also a Berthold Grotesk which had nothing to do with AG. And that is the proper nickname. <BR> <BR>&#62; The AG old face seems to bear closest resemblance to the metal versions I�ve seen and enjoyed. &#60; <BR> <BR>Yes, it was released after the other versions for photosetting hadn&#39;t really caught the essence of the hot metal types. <BR> <BR>There have been a lot of guesses in this thread which i could put right if i a&#41; had the time and b&#41; had access to my books. Right now, they&#39;re all in boxes in my freshly painted apartment in berlin, while i am in london. From memory, however, let me just say that Karl Gerstner never had anything to do with Akzidenz Series 57 or 58. Those were designed by G&uuml;nter Gerd Lange to be identical for Intertype composition machines &#40;a slug-casting competitor of Linotype&#41; and hot metal founder&#39;s type and were only cut in a few sizes. Gerstner designed his own version of AG for Diatype composition which was used &#40;for the first and only time?&#41; to set his book &#34;compendium for alphabetes&#34;. It was a slightly homogenized version and not necessarily an improvement. Can&#39;t remember the name of it, but it had Gerstner&#39;s name in it. I&#39;ll post a scan when i find the book. I&#39;ll also post Schelter specimens and shed some light on the story of AG. I think i have pretty much all the relevant specimens somewhere. Christian Schwartz designed FF Bau, based on Scheltersche Grotesk, which was the predominant font in the Bauhaus&#39; composing room. <BR> <BR>One thing to remember about all these old faces is that they were released over time in different sizes and often one size didn&#39;t resemble another very much at all. And foundries like Berthold kept buying other foundries, took their typefaces and fitted them into the library. They often called them new names or named them for one of the existing families which may have been missing a weight or a size. Nick is very wrong in saying that AG was a systematic family. Nothing could be further from the truth. Even today, there are weights missing and the existing ones bear no relationship to each other. Which is part of the attraction- <BR> <BR>e</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 61172
    user: 1373
    date: 2004-05-21T05:48:00
    date_raw: Friday, May 21, 2004 - 5:48 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks for the correction Erik. Looking forward to hear more on Akzidenz. <BR> <BR>Very confusing with the nicknames and real names. Yes there is a face called Berthold grotesk also, it�s more like humanist or geometric... from 1920-30... Although what M&uuml;ller-Brockmann presents as Berthold is filmset Akzidenz-Grotesk. <BR> <BR>Gerstner program was released by Berthold for Diatype, I guess in 1957 after Univers, Before Helvetica... Here is a sample: <BR> <BR><img src="http://www.typophile.com/forums/messages/30/36487.jpg" alt=""> <BR> <BR>I Have to check out the Weingart prints when I reach my book shelf.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
