    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thank you all for your substantial information <BR> <BR>Timo, I�d like to know what do they mean the numbers on the right of the release years list you posted &#40;very useful - could you post the &#34;100 Jahre Berthold&#34; book data?&#41;  <BR> <BR>Perhaps that list solves the 1896-1898 doubt. The first weight to be released, in 1896, was a condensed. The regular weight, more idiosyncratic and relevant for the future, was released in 1898, so maybe that�s why this year is frequently referenced. <BR> <BR><i>I wonder if the Neue Haas grotesk was simply Haas grotesk with lower case</i> <BR>Did Haas Grotesk not have a lower case? Any information about the design of this typeface? <BR> <BR>Thanks again </font></font></font></font></font></font></font>
