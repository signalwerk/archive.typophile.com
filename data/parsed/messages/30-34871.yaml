    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">In my opinion, we could talk about two different approaches to the grotesque, one developed mainly in the UK and USA, and the other in Germany, that follow different lines. <BR> <BR>As I see it, the first develops in the UK from the Caslon breakthrough, and represents the modulated, less geometrical approach, that has in Franklin Gothic its paradigm. The tipology of this line remains fixed through time. Thus Trade Gothic &#40;1948&#41; and News Gothic &#40;1908&#41; belong to the same formal category.  <BR> <BR>The German grotesques of the XIX century, like Akzidenz Grotesk, tend to geometry and monoline anatomy, and a more systematic development of the range of weights. I think this ascetic approach fitted more the rationalist modern spirit of the XX century typographic avant-gardes. Thus, this grotesque tipology evolved  in time into neogrotesque &#40;Helvetica, 1957&#41;, by absorbing the influences of the technical and aesthetical  proposals of those avant-gardes. <BR> <BR>Of course, this comparison has nothing to do with a value judgement, in terms of one being &#34;better&#34; than the other in any way.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
