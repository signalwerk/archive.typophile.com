    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The numbers show the range of sizes that were available. I don�t know why 4 and 5 are shown separate, i guess it�s because they are specialities, and the �normal� range always starts at 6 point. <BR> <BR>Unfortunately, I don�t have the book, it was from the library. It�s not a thick one, but it had something on akzidenz also. It�s in german only so I guess I could have missed something. I see if I can find it. <BR> <BR>&#62;Did Haas Grotesk not have a lower case? <BR>I was just guessing, but many early sans were only uppercase and used for titling.</font></font></font></font></font></font>
