  - id: 61187
    user: 2021
    date: 2004-05-21T08:14:00
    date_raw: Friday, May 21, 2004 - 8:14 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;Nick is very wrong in saying that AG was a systematic family. <BR> <BR>Sorry, Erik, that was sloppy of me. <BR> <BR>Meggs &#40;A History of Graphic Design&#41; calls it &#34;graphically unified&#34;, which is close to what I meant, as I was trying to identify the affinity between AG and Modernism. <BR> <BR>For instance, &#34;graphically unified&#34; is the modernist way Tschicold used the type face to set the prospectus for &#34;Die neue typographie&#34; &#40;1928&#41; in bold and regular weights of the same face, nothing else.</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
