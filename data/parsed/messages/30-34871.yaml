    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#40;Sorry for the repetition of posts, I sent then while waiting for the server&#41;</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 60742
    user: redrik-users
    date: 2004-05-18T12:59:00
    date_raw: Tuesday, May 18, 2004 - 12:59 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">From what I&#39;ve read &#40;mainly Carl-Fredrik Hultenheims essay in Biblis, 1986&#41; the work to &#39;modernize&#39; the sans serif started at Hermann Berthold AG in Berlin 1896; it became Akzidenz Grotesk/Standard, and was followed by 13 different weights/versions. However, it lacked the systematic approach its american counterparts. <BR>The background story really seems to be vague, but one story goes it was influenced by the poster letters designed by architect Josef Hoffmann at Wiener Werkst�tte in Vienna, where Berthold had an office. I haven&#39;t seen any hard evidence, so file this under &#39;unconfirmed&#39;. <BR>In 1957, <a href="http://www.karl-gerstner.de/" target="_blank">Karl Gerstner</a> was in charge for a redrawing of the typeface, it became &#39;Akzidenz �57�&#39;. It was made for a number of reasons, uniformity and, seeing Helvetica boom, strict commercialism. There was a buck to be made. It was however considered a relative failure, mainly because it adapted some of Helveticas less popular features; closed letterforms for instance. <BR> <BR>� <BR> <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
