    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> i like that you have used sign language to visualize your logo... but isn&#39;t there any sign for the word &#34;unity&#34; itself?.. i&#39;m asking this, because for me a logotype should be something simple with a symbolic content to that thing it stands for... to me it&#39;s a little bit complicated... has it anything to do with people who are deaf?.. or is it just for the sake of &#34;wandering on new paths&#34;?.. </font></font></font></font>
  - id: 8766
    user: 1219
    date: 2002-12-07T04:14:00
    date_raw: Saturday, December 07, 2002 - 4:14 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> I can appreciate the individual hands and spelling out the letters in sign language...but this doesn&#39;t hold together as a logo. I would suggest that &#34;unity&#34; implies the combination of site and sound and there are enough interesting charicatures to use them graphically. an example the dot over the eye could be and eye, the u or the y could be changed into sound type shapes. <BR>but over all you want to have unity with site and sound. it goes hand in hand, eye to eye, and mouth to mouth. these are all important issues in comunication </font></font></font></font>
