    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Ole &amp; Kent -- Let&#39;s just say that I remember having to show my spot color with rubylith &#40;and amberlith&#41;. I grew up around the business and so it is a very nostalgic thing. But, seriously, you really had to have, still have to have, total control over your knife when using rubylith, especially if you don&#39;t want to cut the shapes off the backing material. -- Dave Farey&#39;s demo would be a nice thing to see, similar I would imagine, to seeing someone doing the one-two jerk of throwing metal type. Let&#39;s here for the craftsmen! </font></font></font></font>
