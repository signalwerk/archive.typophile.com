    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Tiffany, if you have fond memories of rubylith, you would probably enjoy listening to Dave Farey tell stories of cutting rubys for Letraset. That&#39;s how he cut his teeth, so to speak, in type. I think he used to give demonstrations at ATypI conferences. If I&#39;m not mistaken, there was a plan to have him do a rubylith-cutting demo at this summer&#39;s TypeCon in Toronto, but at the last minute they couldn&#39;t get his scalpels  through airport security. &#40;We use off-the-rack X-actos here in the States, but Dave uses his own custom, hand-crafted blades.&#41; <BR> <BR>-- K. </font></font></font></font>
