    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Tiffany. You must be old school since you are familiar with rubylith.  What type of work do you do and for how long have you beed doing it. Since you like the rubylith part you could properly appreciate that I did the who sign language in ruby. I was going to make digitize it for a full font out of it but never got it finished. </font></font></font></font>
