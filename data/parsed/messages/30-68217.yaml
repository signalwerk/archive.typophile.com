  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;ve stumbled across Batang, something distributed with some Microsoft Office products &#40;I&#39;m told&#41;. I&#39;ve quite grown on the Latin &#40;that is to say, not the Korean chars&#41; part of Batang, but only the regular variant is included. <BR> <BR>Does someone know the font shown? Is there an italics? <BR> <BR>I&#39;ve noticed that several of the UNICODE languages seem to have interesting Latin charsets, but no further identification. I presume these are some other typeface that&#39;s being included in these Asia-targeted packages.</font></font>
