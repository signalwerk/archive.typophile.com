    html: <font class="dontLookLikeCrap">Hi Mickey, <BR> <BR><i> Is there an italics? </i> <BR> <BR>No italics. The current version of Korean font character standards requires to include the Korean ASCII character set called KS-Roman for the <i>Romaja</i> part which consists of 94 letters only.</font>
