  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">eKnowledge is a client of mine that is undergoing a major identity crisis, both visually and functionally. I am consulting them in all areas of marketing and communication, beginning with their visual identity. Their products and services &#40;which are too broad&#41; currently include everything from video production to website development to office infrastructure set up and maintenance to information management, and the list goes on. Like I said�identity crisis. <BR> <BR>I have narrowed my logotype selections to the following three. They are all very distinct from one another, which may seem odd, but the nature of this whole project is very odd due to the broad range of offerings from this company. I am in hopes that some of the initial feedback here can help me pick a direction to take� <BR> <BR><img src="http://www.typophile.com/forums/messages/29/24933.jpg" alt="eKnowledge Logotype"> <BR> <BR>I guess I should also include their current logo, which consists of this mark accompanied by &#34;eKnowledge&#34; in Garamond positioned randomly in the same general vacinity. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/24934.jpg" alt="eLogo"> <BR> <BR>Mahalo! <BR>Scott</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
comments:
  - id: 45741
    user: 2915
    date: 2004-01-26T14:34:00
    date_raw: Monday, January 26, 2004 - 2:34 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">My opion Scott loose the techno look. The name is intimitating enough. I like the middle one because it feels accessable and you need as much warm and fuzzy as you can generate.  <BR>It sounds like they need to focus their business. At one point in my career I worked for a marketing agency that did direct mail for the banking industry. A very focused niche, so business wasn&#39;t hard to find. Do they do dishes too </font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 45760
    user: 2236
    date: 2004-01-26T16:05:00
    date_raw: Monday, January 26, 2004 - 4:05 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Tell me about it. The CEO is having difficulty letting go of products and services that he knows the company is capable of providing. Myself, and many others from what I&#39;ve heard, have encouraged him to focus on one or two of their primary services &#40;preferrably ones that offer the highest ROI&#41; and dedicate all resources to them. Due to his stubborness to let go, I am taking a compromised approach by catagorizing his various products and services into comprehensive divisions. In the future eKnowledge will be marketed as: &#40;1&#41; eKnowledge - systems &#43; information management, &#40;2&#41; eKnowledge - training &#43; education, &#40;3&#41; eKnowledge - rich media marketing &#43; PR, or some similar catagorical divisions. At least that way, their will be added clarity to the customers. I&#39;m working on the proposal now, so hopefully, he&#39;ll buy into it. <BR> <BR>Oh yah, back to the critique. I am favoring the altered Georgia logotype also. I didn&#39;t want to say anything until I had heard from someone. Considering the broad customer base, I think it is the most universal of the options. The reason I included the Futana type was because I think it lends well to using a byline &#40;reason for including all that gibberish above&#41;, which will be a necessity if I am successful in my pitch. <BR> <BR>Thank you for the critique.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 45783
    user: 1739
    date: 2004-01-26T18:17:00
    date_raw: Monday, January 26, 2004 - 6:17 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Scott, <BR> <BR>I too like the georgia italic. It will look even better once color is added and you fuse the &#34;e&#34; and &#34;k&#34; more. </font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 45785
    user: 1235
    date: 2004-01-26T18:35:00
    date_raw: Monday, January 26, 2004 - 6:35 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Scott, <BR> <BR>From what you&#39;ve offered, I tend to agree about the modified Georgia. Based on what you&#39;ve told us about the multi-faceted nature of the services, maybe <a href="http://www.emigre.com/EF.php?fid=129">this</a> would be more appropriate... <BR> <BR>just kidding. <BR> <BR> -t </font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 45835
    user: 659
    date: 2004-01-27T04:33:00
    date_raw: Tuesday, January 27, 2004 - 4:33 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">hi scott <BR> <BR>i add my vote to georgia. i do think that you should elaborate a better ligature between &#34;e&#34; and &#34;K&#34;, and i also think that the &#34;o&#34; is asking for another ligature with the &#34;w&#34;, a script one. <BR> <BR>i think the horizontal on top of your &#34;e&#34; should be thicker, in the actual weight you will have problems in small prints. <BR> <BR>keep us updated <BR> <BR>CG</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 45854
    user: 2915
    date: 2004-01-27T07:44:00
    date_raw: Tuesday, January 27, 2004 - 7:44 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Scott brilliant idea making divisions of his business and marketing them separately. Do you have a variation of the logo with a division attached to it? It seems you could develope one based on the Georgia logo that every post seems to like.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 45864
    user: 2289
    date: 2004-01-27T08:25:00
    date_raw: Tuesday, January 27, 2004 - 8:25 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The Georgia is a good choice I think you should consider a ge ligature and work on the eK, there is an area of darkness at the join which disturbs the effect. The teardrop terminal of the g is not as elegant as that of the w. The horizontal bar and the divisions could be colour coordinated?  <BR>T</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 46466
    user: 2172
    date: 2004-02-01T09:32:00
    date_raw: Sunday, February 01, 2004 - 9:32 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I definitely agree that the Georgia version is the best choice.  It&#39;s strong, but not cold. It&#39;s also got a nice unique flavor. <BR> <BR>There&#39;s something about it that makes my eyes/brain try to see Greek or Cyrillic characters in the word &#40;I speak/ write neither, by the way&#41;. I don&#39;t know if this matters, or is something others see, but I can&#39;t seem to shake it from my head. I think it has to do with the terminals, the curve-terminal combinations that the italic makes and the custom ligatures. Again, this is really here nor there. <BR> <BR>I also agree with Cristian and Tim about the eK ligature needing tweaking to make it lighter, and Tim about the g&#39;s descender and trying a ge ligature. It didn&#39;t bother me, but once I caught the connections running through the whole word, the end e seemed left out.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 46498
    user: 1250
    date: 2004-02-01T20:56:00
    date_raw: Sunday, February 01, 2004 - 8:56 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Of those three I like the Georgia the most, but I think it&#39;s still off-track. I think you need something squat, geometric and somewhat bland. But how can you make it <i>variable</i> too?... I got it! Wachowiak&#39;s Generation &#40;which I&#39;ve recommended before&#41;. Available through <a href="http://www.fontshop.de" target="_blank">http://www.fontshop.de</a> , but not cheap. <BR> <BR>BTW, is there a way you can make the logo modular? Like consisting of two parts - one that&#39;s fixed and another that changes depending on the &#34;department&#34;. <BR> <BR>hhp <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 46504
    user: 2236
    date: 2004-02-01T23:16:00
    date_raw: Sunday, February 01, 2004 - 11:16 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thank you all for the great feedback. I apologize for not responding with anything of interest yet, but I wanted to acknowledge the helpful critique I&#39;ve received and provide a brief update. <BR> <BR>Last Tuesday &#40;1/27&#41; I submitted a proposal to my client using the Georgia concept. The existing logo &#40;as shown in my original post&#41; was proposed as a universal eKnowledge logo to be communicated to investors. Three market specific logos were also submitted, which included the eKnowledge logo, as shown, accompanied by the above mentioned descriptors &#40;from my second post&#41;. I believe this is the kind of approach Hrant was alluding to: eKnowledge &#40;static/fixed&#41; and descriptor &#40;dynamic/changing&#41;. In addition to having dynamic descriptors, these market specific logos are each assigned a unique color as well. I expect to discuss the project with my client tomorrow &#40;Mon 2/2&#41;, at which time I should have an idea of where I&#39;ll be taking this. <BR> <BR>You have all identified some flaws in the current typeforms, namely, the &#34;e-K&#34; ligature and the &#34;g-e&#34; relationship that is void of a ligature. Originally, I simply thinned out the stem of the &#34;K&#34; to offset its heavy base which is a derivitive of the &#34;e-K&#34; lig. Obviously, from the remarks that have been made I didn&#39;t quite pull it off. The horizontal line over the &#34;e&#34;, which I added after creating the logotype contributes to the heaviness also. I&#39;m still uncertain about whether or not to connect the &#34;g-e&#34; via ligature. Since my initial sketches, I haven&#39;t come up with a way to make it look natural, or rather, indiginous to the original typeface. <BR> <BR>I don&#39;t know how many of you were on board my personal logo critique for <a href="http://www.creativesqueeze.com" target="_blank">http://www.creativesqueeze.com</a>, but I shared my personal philosophy or practice of trying my best to maintain the integrity of typeforms when using what I consider to be classics. You might say that I will pursuade an existing typeface to conform to my logotype, but I will not ask it to give up its true identity. Georgia must remain Georgia, even if it is eKnowledge Georgia. There are fonts that I don&#39;t have as much respect for and I will treat them more liberally, but Georgia is not one of them. If my client allows me to continue in this direction, I will try my best to work some of your insightful recommendations into the logotype. <BR> <BR>Aloha! <BR>Scott</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 46558
    user: 2289
    date: 2004-02-02T09:02:00
    date_raw: Monday, February 02, 2004 - 9:02 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Scott, <BR>I was thinking something like this for the g-e lig, which I know is not the same kind of ligature as the others, but is not too outlandish and I butchered the e-K lig, just to see how it looked. <BR>Tim <BR><img src="http://www.typophile.com/forums/messages/29/25345.jpg" alt=""></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 46561
    user: 1250
    date: 2004-02-02T09:56:00
    date_raw: Monday, February 02, 2004 - 9:56 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think the &#34;eK&#34; is crying out for the upstroke of the &#34;e&#34; to become the upper arm of the &#34;K&#34;. <BR>I might even raise the &#34;e&#34; a bit to make it stand out. <BR> <BR>For the &#34;ge&#34; I might try using a binocular &#34;g&#34;&#42; and curling the tip of the bottom all the way around to become the middle stroke of the &#34;e&#34;, but that might require the &#34;e&#34; to be lower than the rest - plus I think one fancy ligature is plenty. <BR> <BR>&#42; Try skewing Georgia&#39;s Roman &#34;g&#34; to get a basis. <BR> <BR>hhp <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 46709
    user: 2838
    date: 2004-02-03T07:10:00
    date_raw: Tuesday, February 03, 2004 - 7:10 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The logotype doesn&#39;t read as E-knowledge enough. The &#34;e&#34; should have some feature that separates it from knowledge. This, and the space between the w and l makes the &#34;now&#34; stand out.</font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 48331
    user: 2236
    date: 2004-02-13T16:55:00
    date_raw: Friday, February 13, 2004 - 4:55 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thank you for all of the great input. This logo design finally became a priority today, so I&#39;m posting the current design &#40;3 top logos&#41; and the original version &#40;at bottom in black&#41; for comparison. I have applied some of the suggested alterations, while some of the others haven&#39;t seemed to work for me &#40;i.e. connecting the last &#34;e&#34;&#41;. I smoothed out a few curves, lightened the weight of the &#34;e-K&#34; lig and tightened the last &#34;e&#34; to help remedy the disconnect. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/26495.jpg" alt="eKnowledge logo"> <BR> <BR>As you can see, my client gave me the green light to segment his business. The colors are dark blue, dark green, and dark purple. <BR> <BR>�Have at it�</font></font></font></font></font></font></font></font></font></font></font>
  - id: 48344
    user: 1739
    date: 2004-02-13T18:28:00
    date_raw: Friday, February 13, 2004 - 6:28 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Scott, <BR> <BR>Looks good. What font are you using for the subtext? The e-k bothers me still. Maybe try and separate the e&amp;k? I would also like to see burgundy as one of the logos.</font></font></font></font></font></font></font></font></font></font>
  - id: 48371
    user: 2915
    date: 2004-02-14T04:54:00
    date_raw: Saturday, February 14, 2004 - 4:54 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Scott, spell out Public Relations the average person probably won&#39;t know PR. Plus its not consistant with your other divisions. A suggestion is to dump the word Rich, so it reads Media Marketing &#43; Public Relations. Other than that I think you have a winner.</font></font></font></font></font></font></font></font></font>
