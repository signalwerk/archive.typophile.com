    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Tom: <BR> <BR>I used &#34;Mayo&#34; for the business descriptor type. The &#34;e-K&#34; and &#34;g-e&#34; have been my nemisis on this logotype. I have sketched out every connection/disconnection I could think of and come full circle. My current resolve &#40;unless someone here inspires something I haven&#39;t tried yet&#41; is to leave them as is, but with the applied tweaks: &#40;1&#41; slightly nudged the ending &#34;e&#34; to the left, &#40;2&#41; slightly nudged the beginning &#34;e&#34; to the left, decreased the base of the &#34;K&#34;, and slightly nudged the phonetic symbol over the &#34;e&#34; to the left, all to lighten the &#34;e-K&#34; connection a bit. As for color selections: &#40;1&#41; blue is appropriate for the targeted conservative corporate clients, &#40;2&#41; green is appropriate for conveying education, and &#40;3&#41; the third segment is where I thought I would implement a red, which would be appropriate for eye-catching marketing, but it seemed too hard for PR, so I toned it down to a red/blue &#40;a.k.a. purple&#41;. Also, I think purple is a rich &#40;Rich Media Marketing&#41; color. <BR> <BR>Daniel: <BR> <BR>&#34;Rich&#34; Media Marketing is mouthful in itself, but my client ate it up, as a perfect description for the specific marketing services/products offered�&#34;media marketing&#34; isn&#39;t specific enough. I abbreviated public relations because of the potential length of the title seemed too long &#40;mouthful&#41;. It is a good point you make, but having the advantage of knowing the client and business, I&#39;ll say that although PR needs to be included in the title, it is very insignificant compared to the rich media marketing services offered. The targeted clients that might want to take advantage of eKnowledge PR services will definitely know what &#34;PR&#34; is an acronym for. Thank you for challenging it though, it helped me confirm why I was doing it. <BR> <BR>Thanks for the help guys. <BR> <BR>Mahalo! <BR>Scott</font></font></font></font></font></font></font></font>'
