  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><a href="http://graphite.sil.org" target="_blank">http://graphite.sil.org</a> <BR> <BR>Graphite is a smart font technology like AAT or OpenType &#40;actually closer to AAT&#41; developed under an open source paradigm specifically for &#40;though not limited to&#41; non-Roman scripts, especially those not currently supported by shipping OS shaping engines &#40;for example, Burmese and arbitrary stacking diacritics.&#41; SIL supplies both the tools to build and render these fonts.</font></font></font></font>
