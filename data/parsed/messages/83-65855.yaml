    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">if you dont need an exact match for #2 i would recommend  <BR>tankard&#39;s bliss,  johnston&#39;s underground or gill. <BR> <BR><a href="http://www.identifont.com/show?4JN" target="_blank">http://www.identifont.com/show?4JN</a> <BR><a href="http://www.myfonts.com/fonts/p22/underground/p22-underground/testdrive.html?s=LITTER&amp;p=48" target="_blank">http://www.myfonts.com/fonts/p22/underground/p22-underground/testdrive.html?s=LITTER&amp;p=48</a> <BR><a href="http://www.myfonts.com/fonts/linotype/gill-sans/gill-sans/testdrive.html?s=LITTER&amp;p=48" target="_blank">http://www.myfonts.com/fonts/linotype/gill-sans/gill-sans/testdrive.html?s=LITTER&amp;p=48</a></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 94035
    user: 2088
    date: 2005-02-23T08:19:00
    date_raw: Wednesday, February 23, 2005 - 8:19 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">It&#39;s a bit ridiculous to talk about &#39;fonts&#39; when you are looking at some sort of metal castings.  The point is that not EVERYTHING is from a computer font. There was lettering for hundreds of years without digital fonts, and obviously every form of lettering has not been digitized. So much lettering was done by hand, and will never be re-created. <BR> <BR>Chris, it would be nice if you would give us a break, and post one image at a time per thread, and try to consider whether asking about a &#39;font&#39; for manufactured lettering is a reasonable request. <BR> <BR>Can I ask what your reason is for these shotgun style ID requests?</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 94057
    user: christof8-users
    date: 2005-02-23T10:33:00
    date_raw: Wednesday, February 23, 2005 - 10:33 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Well first I would like to say thanks for everyone�s input in trying to identify these various typefaces.  <BR> <BR>As mentioned in a previous thread I am trying to identify these letterforms for part of my university course.  <BR> <BR>The point of it is not necessarily to identify the exact typeface contained within the image but instead just to make an attempt. I realise that for some of these images this may be extremely difficult, as the lack of letterforms within each picture would make a narrowing down of the typeface a difficult task.  <BR> <BR>I never assumed that the metal cast typographical form was of the digital kind but assumed someone might have had an idea what it could have been based on and therefore I don�t see this question as a ridiculous one. I believed that the point of this forum was to stimulate debate about letterforms and typography.  <BR> <BR>Am I in the wrong place?</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 94061
    user: 815
    date: 2005-02-23T10:50:00
    date_raw: Wednesday, February 23, 2005 - 10:50 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Whatever happened to looking through books of typeface samples, hour after hour? You&#39;d learn a lot more about type and lettering that way. <BR>Asking a forum on the web is faster, true, but the time you save is the difference between real knowledge and trivia.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 94065
    user: christof8-users
    date: 2005-02-23T11:29:00
    date_raw: Wednesday, February 23, 2005 - 11:29 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I have been looking through typeface sample books and have identified around 30 typefaces using this method. The reason for the use of the forum is that there is a greater wealth of knowledge than a few books can provide.  <BR> <BR>People bring their own experiences, influences etc in the identification of a specific typeface which then leads me back to typeface specimen books. I am not loosing out on using a forum I am infact learning more.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 94083
    user: 2088
    date: 2005-02-23T13:57:00
    date_raw: Wednesday, February 23, 2005 - 1:57 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>&#34;I never assumed that the metal cast typographical form was of the digital kind but assumed someone might have had an idea what it could have been based on and therefore I don�t see this question as a ridiculous one. I believed that the point of this forum was to stimulate debate about letterforms and typography.  <BR> <BR>Am I in the wrong place?&#34;</i> <BR> <BR>Ok, Chris, I realize &#39;ridiculous&#39; might be a bit strong in your context, but if you had asked us &#39;what typefaces or fonts might most resemble these examples of type?&#39; maybe I would have reacted differently. Then at least I would know you weren&#39;t trying to find fonts for some lettering that clearly has nothing to do with fonts &#40;digital kind that is&#41;. <BR> <BR>The other thing that sort of annoyed me about your post was that you posted multiple images again.  You saw how much grief that caused the last time &#40;I think it was you&#41;, and yet you posted mutiple images again. <BR> <BR>This pattern made me think we were dealing with someone who wanted us to do all the work. Therefore, I was a bit annoyed by the question, and failed to give you credit for &#40;possibly&#41; understanding that not all lettering is connected to fonts and computers. <BR> <BR>If you were not the person who posted 10 samples in one thread last time, then I deeply apologize. If you are that person, then I think you can see where I was coming from. <BR> <BR>And finally, you are not in the wrong place. As you see most of the folks were happy to try to ID your samples. If I didn&#39;t want to answer your question, I should have just looked for another one I did want to answer. So again I am sorry for hassling you. I know college work can be a drag.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 94086
    user: 2088
    date: 2005-02-23T14:05:00
    date_raw: Wednesday, February 23, 2005 - 2:05 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I just checked and you had only three images in your last post. Someboday named Nathan gave us 10 at once. <BR> <BR>So my apologies are deeper than before, but not <i>real</i> deep.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 94141
    user: 110
    date: 2005-02-24T02:32:00
    date_raw: Thursday, February 24, 2005 - 2:32 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Chris, sorry about the tenseness of some replies. We&#39;ve  <BR>experienced an exponential growth since 2003, and since  <BR>the MyFonts forums closed down a couple of months ago  <BR>traffic increased even more. Add to this the Board software  <BR>which behaves erratically and which ate two year&#39;s worth of  <BR>archives we used to rely on as reference material plus recent  <BR>postings with multiple IDs per thread... it tends to get a bit much. <BR> <BR>Also, your identification request might annoyed some of us  <BR>as obviously it&#39;s quite unrealistic to expect them to be matched  <BR>with typefaces. Lettering on metal pipes, stone engraving,  <BR>traffic signs and so on all use custom made character sets  <BR>that are specifically produced for the medium they&#39;re intended  <BR>for. The medium and technical restrictions determine the shapes, <BR>so it&#39;s very hard to come up with equivalents in type. <BR> <BR>I&#39;m not saying this to justify some of the above &#40;over&#41;reactions;  <BR>I only want to put them into context.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 94143
    user: 110
    date: 2005-02-24T02:47:00
    date_raw: Thursday, February 24, 2005 - 2:47 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This being said, regarding your samples: <BR> <BR>1. is very hard to match due to the heavy corrosion of the  <BR>charactershapes; in fact any Grotesque might do, so Ryan&#39;s  <BR>Univers Condensed is just as good a suggestion as Helvetica  <BR>Condensed or Trade Gothic Bold. <BR> <BR>2. is obviously &#34;hand drawn&#34; as the R shape is quite clumsy. <BR>In order to approximate these characters any of Romesh&#39;s  <BR>proposals will do: Bliss, Gill Sans or Underground. <BR> <BR>3. looks very much like Romesh&#39;s suggestion Trajan indeed. <BR> <BR>I don&#39;t agree about 4. tho, which to me looks more like Berthold&#39;s  <BR><a href="http://www.philsfonts.com/detail.html?sku=BQ90030010P1" target="_blank"> Akzidenz-Grotesk Bold</a>.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
