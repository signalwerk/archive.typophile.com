  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><b>FRISCO_REMIX. 34 DESIGNERS IN 1 FONT.  <BR>AIGA SAN FRANCISCO PRESENTS &#34;SPACED OUT. BLACK HOLES IN TYPOGRAPHY.&#34; <BR>HOLLAND FONTS/TRIBE03 ON-LINE.  <BR> <BR></b> <BR>-------------------- <BR> <BR><b><a href="http://www.hollandfonts.com/tribe/tribe03/repub/index.html">HOLLAND FONTS/TRIBE presents FRISCO_REMIX,</a></b> 34 typeface designers, letter artists, illustrators and graphic designers in ONE font. Free until December 31, 2003 at <a href="http://www.hollandfonts.com">Holland Fonts.</a> <BR> <BR><a href="http://www.hollandfonts.com/FRE03.html">FRISCO_REMIX,</a> produced by Max Kisman for Holland Fonts on the occasion of the AIGA event �Spaced Out. Black Holes In Typography� with contributions by Michael Abbink, Erik Adigard, Bob Aufuldish, Mike Bartalos, John Bielenberg, Adam Brodsley, Rodrigo Cavazos, Richard Chang, G. Dan Covert, Claudia Dallend�rfer, Joshua Distler, Edward Fella, Mark Fox, David Lance Goines, Eric Heiman, Jim Parkinson, Rudy Vanderlans, Stefan Hattenbach, John Hersey, Allistair Johnston, Mr. Keedy, Max Kisman, Mike Kohnke, Joe Kral, Jean-Benoit L�vy, Zuzana Licko, Peter Lofting, Joachim M&uuml;ller-Lanc�, Dennis Pasco, Doug Rafael, Erik Spiekermann, Sumner Stone, Joe VanDerBos, Mark Winn, Delve Withrington. <BR> <BR><b><a href="http://www.hollandfonts.com/tribe/tribe03">HOLLAND FONTS/TRIBE03</a></b> <BR>Tribe 03 &#34;SPACE&#34; local contributions from London, Tokyo, Tapei, New York and San Francisco in <a href="http://www.hollandfonts.com/tribe/tribe03/local">&#34;Local&#34;</a> and global contributions from Ireland, England, The Netherlands, Poland, Hungary, USA, New Zealand and Spain in <a href="http://www.hollandfonts.com/tribe/tribe03/timez/index.html">&#34;Timezone.&#34;</a> <BR>In  <a href="http://www.hollandfonts.com/tribe/tribe03/msquare/index.html">&#34;M SQUARE&#34;,</a> eleven students investigate graphic symbols and create a font expressing their personal visual language in �A letter can be anything, anything can be a letter.� <BR> <BR>-------------------- <BR><img src="http://www.typophile.com/forums/messages/14800/16760.gif" alt="Spaced Out"> <BR> <BR> <BR><b> SPACED OUT. BLACK HOLES IN TYPOGRAPHY. </b> <BR>An evening with <b> KAREN FISS, MICHAEL BARTALOS, MAX KISMAN </b> and <b> JIM PARKINSON. </b> <BR> <BR><b> WEDNESDAY, OCTOBER 1, 2003, 7 p.m. </b> at the Academy of Art College�s MORGAN AUDITORIUM, 491 Post Street, San Francisco.  <BR> <BR>Tickets are $10 for AIGA members, $15 for non-members.  <BR><b>STUDENTS RECEIVE FREE ADMISSION WITH VALID ID!</b>  <BR> <BR>We also present FRISCO_REMIX, a sample font with contributions by 34 Bay Area typeface designers. FREE at <a href="http://www.hollandfonts.com" target="_blank">www.hollandfonts.com</a> until December 31, 2003.  <BR> <BR>Receive a FREE copy of the limited edition FRISCO_REMIX POSTER at the event and get the new type compendium INDIE FONTS 2 for the amazing and one-time offer of $20 ONLY!  <BR> <BR>To reserve your space with a credit card call the AIGA SF office at 415-626-6008 or send your check &#40;made payable to AIGA SF&#41; to AIGA SF, 1111 Eighth Street, San Francisco, CA 94107. Your name will be held at the door. Admission will also be available at the door, space permitting. <BR> <BR>More about Spaced Out in <a href="http://www.hollandfonts.com/tribe/tribe03/msquare/M02.html"> Holland Fonts/Tribe03</a> or <a href="http://www.aigasf.org/events/event_type.html">AIGA SF</a> <BR> <BR>-------------------- <BR></font></font></font></font>
