    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">GOOD &amp; NICE Idea Jared. <BR>I don�t know if it is the best way to beguin a collaborative project but I am going to throw some thoghts: <BR>The name DEAFHOPE is very significant itself, it means something. Should it be very present in the logo? <BR>Mother and Kid: I think it is important to express that idea, but could it be possible to comunicate it without the usual figures, a more subtle way? For example: two hands in differents sizes &#40;no hand in hand, it is very used and is hard to see the different sizes&#41;. It is just an example, I believe there has to be more ways to do it, it is just that I am seeing the clear connections between deaf and hands. <BR>&#42; Sign: I am sorry but I can�t tell you much about it, maybe becouse it is hard for me being objective, in Spain it means the opposite  &#40;for no deaf persons I mean&#41;, I know it doesn&#39;t sound very pro but I can&#39;t help it. <BR> <BR>I hope it helps.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
