    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">bj, Yes. the black sample. <BR> <BR> <BR> <BR>David Hamuel <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 71076
    user: ahodson-users
    date: 2004-08-10T19:20:00
    date_raw: Tuesday, August 10, 2004 - 7:20 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hello!  My name is Amber and I am on the Board of Directors for DeafHope.  We recently got a chance to check out your ideas for a logo.  I am so amazed and excited by the range of perspectives and talent you all have!  We had a lot of thoughts about what you came up with.  We have a logo currently that was developed by a Deaf woman, which was great for us to start out with &#40;check it out at <a href="http://www.deaf-hope.org" target="_blank">www.deaf-hope.org</a>&#41;.  We are interested in looking at other options for a logo, as the organization has evolved so much since then, and the current logo doesn&#39;t have the impact that we are looking for.  I thought I would try to rekindle this discussion and see where it goes.  Thanks for the time you put into coming up with these ideas...</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 71100
    user: 604
    date: 2004-08-10T22:54:00
    date_raw: Tuesday, August 10, 2004 - 10:54 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Amber.. <BR> <BR>I&#39;d like to hear your thoughts on what everyone has posted so far...I liked the direction it was moving, but it seemed like the discussion lost steam. <BR> <BR>Another good place to start would be for you to share your thoughts on how your organization has changed; how you see it growing; how you feel the current logo doesn&#39;t represent your goals, etc.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 71165
    user: ahodson-users
    date: 2004-08-11T10:37:00
    date_raw: Wednesday, August 11, 2004 - 10:37 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">We had a lot of responses to what everyone came up with so far.  People really liked the flower design that you developed.  We also liked the DH figures that BJ Harvey did.   <BR> <BR>It is difficult to organize our goals for the logo, so I will start by throwing out some general thoughts:   <BR> <BR>We want something that is memorable, professional and yet not &#34;hard&#34;.  Our dream is to come up with a logo that has the perfect combination of professional &#40;&#34;masculine&#34;&#41; and welcoming &#40;&#34;feminine&#34;&#41; connotations.  That is one way the current logo isnt working - it is too bubble gum, as someone else said here.   <BR> <BR>I liked Daniel&#39;s comment about focusing on empowerment and not gender. We are often torn between our emphasis on women and children and the need to be clear that we are accessible to everyone, that domestic violence happens to anyone. We also want to be careful about how we portray love and relationships in the logo - since we deal with violence in intimate relationships.  <BR> <BR>I am not sure if we want the name to be part of the logo.  Certainly the logo has to be easy on the eyes, as the Deaf community is such a visual one.  &#40;For example, I loved what John and Tim came up with, but they made all my Deaf colleagues cringe.   <BR> <BR>Wow, I said a lot...Does this help?</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 71869
    user: 604
    date: 2004-08-16T21:34:00
    date_raw: Monday, August 16, 2004 - 9:34 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Amber, your comments definitely help. <BR> <BR>I&#39;m going to throw out more thoughts and questions... <BR> <BR>Something you referenced that grabbed my attention; the desire to focus on empowerment and not gender. Do you think incorporating a flower in the logo is too feminine? My thought in using a flower was to represent new life/spring/growth/etc.  <BR> <BR>What do you see when you picture the adjectives you use? &#40;&#39;professional&#39;, &#39;welcoming&#39;, &#39;empowerment&#39;; others to consider: &#39;hope&#39;, &#39;help&#39;, &#39;safety&#39;, &#39;community&#39;, �&#41; <BR> <BR>Another random thought/question: Are you comfortable moving away from the mother &amp; child representation? The reason I ask is a matter of recognition; is your organization well known within your community or are you wanting to grow and gain more exposure?</font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 71887
    user: 4363
    date: 2004-08-17T00:35:00
    date_raw: Tuesday, August 17, 2004 - 12:35 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">...are you wanting to grow and gain more exposure? <BR> <BR> What do you mean by &#34;grow&#34;?  &#34;Grow&#34; - where? I don&#39;t think she wants to grow. I&#39;m sure that her great wish is not to &#34;grow&#34;. That is to say - no more abused women. <BR> <BR>&#34;exposure&#34; - that is a new story. And not logo design.  That is to say - Marketing.  <BR> <BR>So, can you hear me? can you hear me now?.....&#40;oh, that is Verizon Wireless. You can&#39;t use that&#41; <BR> <BR><IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> <BR> <BR>The Lord of The Ring   <BR></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 72005
    user: ahodson-users
    date: 2004-08-18T19:50:00
    date_raw: Wednesday, August 18, 2004 - 7:50 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Kyle,   <BR> <BR>I don&#39;t think that incorporating a flower in the logo would be too feminine, depending on how its done.  I definitely like the new life/growth aspect that you mention.  That is the closest we have gotten to the empowerment concept so far.  &#40;The third image by BJ Harvey also comes close to what I have pictured for empowerment and hope, although I agree with the comments that it looks like the handicapped symbol.&#41;   <BR> <BR>Although we really like the mother/child representation, moving away from it is always an option &#40;as I said, the current logo isnt particularly recognizable as ours, and we also want to focus on empowerment&#41;.  Gaining more exposure and being recognized is definitely what we are looking for, and feel we aren&#39;t quite getting with the current logo.  It is hard to put my finger on it, but its almost as if our current logo goes too far on the &#34;soft&#34; side and is lacking a professional element.  Maybe I am too close to it though.   <BR></font></font></font></font></font></font></font></font></font></font></font></font>
