  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;ve been approached by a shelter/advocacy center for deaf women and their children who have been victims of domestic violence &#40;&#34;DV&#34;&#41; or sexual assault. They are just starting up, and need a logo. Rather than try to do it myself &#40;I have limited time available, as I&#39;m sure you do too&#41; I&#39;d prefer to turn it over to the collective talent of Typophile. <BR> <BR><a href="http://www.deaf-hope.org" target="_blank">http://www.deaf-hope.org</a> <BR> <BR>Other similar agencies include ADWAS &#40;<a href="http://www.adwas.org" target="_blank">http://www.adwas.org</a>&#41;, DWAV &#40;<a href="http://www.dwav.org" target="_blank">http://www.dwav.org</a>&#41; or Domestic Violence Project/Safe House &#40;<a href="http://www.dvpsh.org" target="_blank">http://www.dvpsh.org</a>&#41; <BR> <BR>Previous iterations of their logo have attempted to place mother and child together, and/or possibly incorporate the <a href="http://www.aslstamp.com/images/2935b.gif">sign</a> for &#34;I love you&#34;  <BR> <BR>If you have any free time to generate ideas for this logo, post them here and we&#39;ll workshop them together before showing this thread to the center for their feedback.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
