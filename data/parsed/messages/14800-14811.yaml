  - id: 27791
    user: 604
    date: 2003-08-29T13:03:00
    date_raw: Friday, August 29, 2003 - 1:03 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">As I looked at my ligature a little more I began to see that it could be made to look like an ear... <BR> <BR>Every time I see the sign language &#34;I love You&#34; it makes me think I&#39;m at a rock concert...does anyone else get that? <BR> <BR>David--I like the left version of your hand sketches. If you wanted to incorporate letters, the &#34;h&#34; could be formed somehow from the index &#43; middle finger...maybe the &#34;D&#34; resting on the thumb?</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 27792
    user: 604
    date: 2003-08-29T13:06:00
    date_raw: Friday, August 29, 2003 - 1:06 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">As I looked at my ligatures, I began to see how they could be combined somehow so they would resemble an ear.... <BR> <BR>David--I like the left version of your hand sign. If you wanted to incorporate type, I see an &#34;h&#34; being formed by the index &#43; middle finger. Maybe the &#34;D&#34; resting on the thumb? <BR> <BR>The double &#34;I love you&#34; makes me think of rock concerts...maybe it&#39;s just me.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 27794
    user: 1353
    date: 2003-08-29T13:32:00
    date_raw: Friday, August 29, 2003 - 1:32 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;it could be made to look like an ear... <BR> <BR>Yes. I was thinking about that. My concern is to know how deaf people deal with the graphic representation of an ear. I mean, maybe they don&#39;t like it. <BR> <BR>&#62;it makes me think I&#39;m at a rock concert... <BR>&#62;does anyone else get that? <BR> <BR>Yes. Bad coincidence, I guess.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 27797
    user: 1026
    date: 2003-08-29T14:01:00
    date_raw: Friday, August 29, 2003 - 2:01 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Here&#39;s my two cents. Just playing with the ASL handsigns for &#34;d&#34; and &#34;h&#34;. <BR><img src="http://www.typophile.com/forums/messages/14800/15060.gif" alt=""><img src="http://www.typophile.com/forums/messages/14800/15061.gif" alt=""> <BR> <BR>And that &#34;i love you&#34; definitely has me singing The Trooper in my head. I wonder if deaf people would get the same reference though - like Americans typically don&#39;t understand the two raised fingers of the English as being offensive.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 27836
    user: 1895
    date: 2003-08-29T17:13:00
    date_raw: Friday, August 29, 2003 - 5:13 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Kyle, <BR> <BR>i don&#39;t have an answer about the type/lettering. since: <BR> <BR>1. i work with client questionnaire. <BR> <BR>2. then there&#39;s a research. <BR> <BR>3. then there&#39;s a decision about the 3 Ls : &#42; name -only logo    <BR>    &#42; monograms or acronyms <BR>    &#42; symbol-visual/name. <BR> <BR>4. then i&#39;m going to draw 30-40 small rough idea sketches. and select 5-12 to work with in a tighter fashion. <BR> <BR> <BR>so i don&#39;t have the info. however, i&#39;m doing that  since we need to give.....sometimes. <BR> <BR> <BR><IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> <BR> <BR> <BR>David Hamuel</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 28175
    user: 1160
    date: 2003-09-03T12:44:00
    date_raw: Wednesday, September 03, 2003 - 12:44 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The ASL sign for &#34;I love you&#34; is three fingers extended;  <BR>thumb, index and pinky. <BR> <BR>The heaveymetalrockstar sign &#40;sometimes called the &#39;sign  <BR>of the devil&#39;&#41; that often accompanies the shouting of the  <BR>word &#39;duuuude!&#39; &#40;sometimes pronounced &#34;deeeeed!&#34;&#41; is  <BR>just two fingers; index and pinky. So, tuck in that thumb  <BR>there, dirthead, unless you are, afterall telling that hair- <BR>monger on stage that you love him. <BR> <BR>&#40;ASL speakers hate when onlookers think they&#39;re giving the  <BR>&#39;sign of the devil&#39; to their loved ones.&#41; <BR> <BR>=&#41;</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
