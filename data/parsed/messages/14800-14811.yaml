  - id: 28981
    user: 1019
    date: 2003-09-08T16:30:00
    date_raw: Monday, September 08, 2003 - 4:30 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Jared this is a great idea - however I&#39;m a bit concerned that running the project in this fashion could scream speculative - of which perhaps you should make clear to everyone the rules before we engage in spec so that it is not poorly promoted. I myself have to abide by my association by-laws &#40;I&#39;m sure yours are similar too&#41; and don&#39;t think I would be allowed to participate at this moment unless you could put in writting some rules or a breif for me have on file in case I&#39;m ever charged: &#40;I&#39;m making this sound like a lot of work - but its not, I&#39;m sure you know...simply a quick PDF template that you could plunk in the specific criteria in for various pro-bonos, ect ect.&#41; <BR> <BR>aside: the t-shirt competition is a difference grey area for us as it in itself promotes the industry and is not inherently speculative <BR> <BR>some rules from our association that you may want to see:  <BR> <BR>Competitions and Fees <BR> <BR>36. A Member, when consulted, shall encourage procedures that support fair and open competition based upon professional merit and thereby promote and achieve the protection of the public. <BR> <BR>37. Except as otherwise provided for herein, a Member shall not take part in or conduct open competitions for commercial purposes on speculation. <BR> <BR>38. A Member may compete in any design competition for projects of general, community or public interest if they are of a non-profit nature and if the rules of competition have been approved by the Board or conform to general competition rules approved by the Board. Furthermore, a Member may take part in any open or limited competition for work whose terms are specifically approved by the Board. <BR> <BR>39. Except as otherwise provided for herein, a Member shall not take part in a limited competition for work unless each participant in the competition is paid an equivalent compensation in accordance with the work involved, and in which the names of all those invited to participate are made known to all participants upon invitation. <BR> <BR>40. A Member shall not work for a client or employer without compensation, with the exception of the occasional pro bono work for charitable purposes and objects or for work performed for family members. <BR> <BR>41. Except as otherwise provided for herein, a Member shall not undertake any speculative project or schematic proposals for a project either alone or in competition with others for which compensation will only be received if the design is accepted or used. <BR> <BR>42. The provisions of paragraphs 37, 39 and 41 shall not apply to a Member where: <BR> <BR>a. it is the convention of the trade primarily responsible for the project to obtain contracts for work through participation in competitions on speculation; and <BR> <BR>b. the graphic design work only forms part of the project involved in such competition. <BR> <BR>43. A Member who is asked to advise on the selection of designers or other consultants shall not accept a payment in any form from the designer or other consultant so recommended. <BR> <BR>Intellectual Property and Authorship <BR> <BR>44. A Member shall not knowingly copy the design or work of another person without the consent or agreement of the person who owns the copyright or their agents and in accordance with the copyright laws of Canada. <BR> <BR>45. A Member shall not represent, pass off or claim authorship of the design of another person without the consent or agreement of the author or creator. <BR> <BR>46. A Member shall not claim sole credit for a design on which other designers have collaborated. <BR> <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
