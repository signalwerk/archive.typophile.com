  - id: 77062
    user: 604
    date: 2004-09-28T15:36:00
    date_raw: Tuesday, September 28, 2004 - 3:36 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Christos.. I really like what you&#39;ve done! My favorite is C. <BR> <BR>I like A3 as well, but the dove &#39;breaking out&#39; of the D makes C a little stronger. I don&#39;t care as much for the options with the black dove, those make me think of a crow, death, etc. <BR> <BR>I would only recommend one change on C; move &#39;hope&#39; up so it is even with &#39;Deaf&#39;. To me, having it lower expresses some kind of negative association. Like hope is sinking or failing. Does that make sense? <BR> <BR>Great work! <BR> <BR>.[.k.].</font></font></font></font></font></font></font></font></font>
