    date_raw: Saturday, September 20, 2003 - 3:36 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Kyle, this is nicely executed, and very beautiful. <BR>Seeing the petals of the flower in the dh, nice eye <BR>for details and lateral thinking! <BR> <BR>a few things: <BR> <BR>&#42; can the flower be another &#42;kind&#42; of flower perhaps. <BR>Something as simple as a daisy. I don&#39;t know what <BR>kind of flower this is, but I&#39;m getting a Bubble Yum, <BR>Mr. Bubble vibe. <BR> <BR>&#42; the rough quality of the dh and the deaf hope is <BR>nice, but the flower has the opposite feel, shiny and <BR>machined. Also, don&#39;t know how the gradient mesh  <BR>translates to B &amp; W. <BR> <BR>&#42; this could be a nice one to try rendering with <BR>a Speedball. <BR> <BR>&#42; with handwritten type, you can make slight changes <BR>to the repeated letters, in this case the e. <BR> <BR>Overall, I think this is the strongest direction so far <BR>&#40;hope springs eternal&#41;, and seeing some <BR>colors is nice, after all that black/red upthread! <BR> <BR>Try some more flowers! <BR> <BR>bj</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
