    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">since you don&#39;t draw a real flower  - only representation &#40;like - &#34;dh&#34; stem/leaves&#41;  - don&#39;t  worry too much about real flowers/names.  <BR> <BR> <BR>============ <BR> bj wrote something about feminine -  <BR> feminine logo is not just the subject - e.g. flower, heart etc - but the way you are going to represent it.  <BR> <BR> <BR>that is to say - less bold shapes. less sharp shapes.  e.g. the silhouetted women, ADWAS logo &#40;right, black&#41;. in my opinion - bad thing &#40;for adwas logo. maybe good for something else&#41;. <BR> <BR> <BR> <BR> <BR>David Hamuel <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 31460
    user: 1014
    date: 2003-09-26T10:51:00
    date_raw: Friday, September 26, 2003 - 10:51 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Kyle - These flowers seem a little big, and don&#39;t seem <BR>to complement what you had, imo. <BR> <BR>That said, David has shown an interest here and maybe you <BR>and David could really collaborate -- a true collaboration <BR>between two typophiles would be great. <BR> <BR>He has shown himself to be a great artist. The concept <BR>is there, just needs to be finished. <BR> <BR>Just an idea. <BR> <BR>the ADWAS logo, i still think it&#39;s perfect...this is a service, presumably,  <BR>where abused women, who happen to be deaf,  <BR>can get find help. <BR> <BR>Standing together, the sharp angles and the poses say, We&#39;ve <BR>had it, we&#39;re banding together, we&#39;re not going to take it anymore. <BR> <BR>I don&#39;t see bold shapes. I see soft colors with softer shading. <BR> <BR>Strikingly effective. <BR> <BR>just my opinion. <BR> <BR>bj</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 31480
    user: 2085
