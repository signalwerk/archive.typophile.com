  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><a href="http://www.linotype.com/6-2162-6/oldenglishvaluepack.html" target="_blank">http://www.linotype.com/6-2162-6/oldenglishvaluepack.html</a> <BR> <BR>What do you guys think of Linotype&#39;s latest value pack? Six representative &#34;Old English&#34; fonts at such a low package price. I was even more impressed after I compared it with an older value pack on Fonts.com &#40;<a href="http://www.fonts.com/findfonts/detail.asp?nCo=AFMT&amp;pid=371688" target="_blank">http://www.fonts.com/findfonts/detail.asp?nCo=AFMT&amp;pid=371688</a>&#41;</font></font></font></font></font>
