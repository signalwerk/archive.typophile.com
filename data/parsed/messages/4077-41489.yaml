    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;m wondering, is there a difference between Old English and Blackletter? Is the former a way of not appearing to be a neo-fascist? Wilhelm Klingspor Gotisch - puhleeze. <BR> <BR>&#40;BTW, Dan, although I don&#39;t think your enthusiasm is contrived, it would be useful to note that you work for Linotype!  :-&#41; <BR> <BR>hhp <BR></font></font></font></font>
  - id: 69148
    user: 1085
    date: 2004-07-27T07:52:00
    date_raw: Tuesday, July 27, 2004 - 7:52 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Well, I try to hold myself back from working in &#34;I work for Linotype&#34; into every posting. They certainly do not pay me to post things on the net, nor to do below-the-line advertising such as this. And I&#39;m not typing this up at work either. <BR> <BR>Plus, I will only be a Linotype employee for three more days! After that, I be in limbo for a few weeks, while the German government decides whether to renew my work permit or not <IMG SRC="http://www.typophile.com/forums/clipart/sad.gif" ALT=":-&#40;" BORDER=0> . I&#39;ve already exceeded the amount that I&#39;m &#34;supposed&#34; to work in one year. <BR> <BR>--- <BR>That being said, let&#39;s talk about &#34;Old English Type.&#34; &#40;one last disclosure,  I did do some writing about the old englishness of old english types that will be released in later marketing materials from LL. But this is not a marketing ploy&#41;. Until last week, I thought that Old English was a total misnomer, something that ignorant font-buyers used when searching on the internet. Well, I was wrong! <BR> <BR>Old English referes primarially to historized texturas design in England during the victorian era. Texturas were introduced into England during the 1400s. And, as everyone here probably knows, I LOVE TEXTURAS! The victorians loved them too, but thought them out of date and illegibile, it seems. So they &#34;modernized&#34; them. This is classicism. Mariage &#40;in the Old English Pack&#41; is a revival of Morris Fuller Benton&#39;s Wedding, originally from 1901 and thoroughly Old English. <BR> <BR>So almost anything &#34;historicized&#34;  and &#34;textura-inspired&#34; can be vaguely Old English, whether it was designed by an Englishman in England or not. Blackmoor is from Quay, and supposedly based on something old and english. Notre Dame and WK Gotisch are not english at all but are texturas, and WKG is very historicized, just in a beautiful germanic manner by Koch instead of Benton&#39;s or the Victorian-style. <BR> <BR>Notre Dame is not as historicized, but it is an interesting revival of pre-printing texturas. So I think that it is vaguely appropriate, too. <BR> <BR>Monotype&#39;s packet has more pure old englishes in it, maybe, but it also has a Fraktur, which I can&#39;t see as being Old English at all. Way farther off than ND or WKG &#40;oh heavenly diety, please lighten the typophile&#39;s hearts so that they don&#39;t think that I am trying to dis AGFA Monotype� aren&#39;t interns allowed opinions too?&#41; <BR> <BR>I&#39;d buy the pack myself, but I already own four out of the five fonts� it would probably be cheaper just to but the missing ND on its own.</font></font></font>
