    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Natty use of Flash and good layout. One of few things that got my attention in a bad way were those dotted buttons between content and menu. Otherwise it&#39;s that good that found it&#39;s way to my bookmarks. <BR> <BR>This framed content area with curved corners doesn&#39;t take much space and shadow gives just the attention it needs. <BR> <BR>And when it comes to the content itself I like the possibility to click them quickly by and when something get&#39;s my attention there&#39;s a lot extra material. Must admit that much of the works got that attention.</font></font>
  - id: 78599
    user: 1946
    date: 2004-10-14T01:49:00
    date_raw: Thursday, October 14, 2004 - 1:49 am
    votes: null
    html: <font class="dontLookLikeCrap">Hi Hendrik, <BR> <BR>Your reaction is one we get more often. For most people the little dots are to tiny, or the text is to small. Other than that the reactions are very positive.  <BR> <BR>We wanted to make a portfolio website where it&#39;s about seeing and not about reading. Therefor the text is kinda in the background and we put a lot of work in the photography.  <BR>We realised that visitors don&#39;t really make the connection between a client-type and the work we made for that particular client. Meaning, that if we would make a technodesign for a backery, they would still like it because they might like the work. They &#40;mostly&#41; don&#39;t say; &#34;hmm, that&#39;s very strange for a backery&#34;. But they say; &#34;Wauw, very trendy for a backery&#34;. <BR>Therefor we put the connection between the clientname and the photo&#39;s a little more in the background. Just click on the dots and see the photo&#39;s is what people want.  <BR>If they than want a little more information, they&#39;ll find it under the &#39;I&#39; &#40;Info&#41;. <BR> <BR>We used the philosophy &#39;If you don&#39;t like our website, you&#39;re not the kind of client we want&#39;. That sounds hard, but actually it&#39;s not. <BR>Until now we worked for almost all the clients that contacted us. Now we would like to actively scout for clients that fit our expectations too. Therefor we set boundries with our website and make a natural selection, without the client realising it and feeling rejected.  <BR>Until now it works. We have already one potential client, a big supermarket concern called &#39;Albert Heijn&#39;. A local outlet asked us to design some posters for them. And a museum asked us to design an exibition for them.  <BR>This kind of clients we never reached with our old website.  <BR> <BR>Regards, <BR>Ren�</font>
