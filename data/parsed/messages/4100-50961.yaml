  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi guys, <BR> <BR>We&#39;ve been working very hard the last months to get our website ready. I restyled our &#40;almost&#41; 10 year old logo, created a corporate font and designed most of the website &#40;incl. the navigation&#41;. My collegue made the music and did the photography.  <BR>What do you think about it? <BR> <BR>My typefaces have suffered under the website in the last months. I want to pick that up again and will be posting some new updates on my Nordic in the upcoming weeks. <BR> <BR>Regards, <BR>Ren�</font></font></font></font>
