  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap">We are questioning our boss about the id of his 30 years old company. It�s a well known design/marketing company in Rio de Janeiro &#40;Brazil&#41;, with big clients such as Coca-Cola, Wella, BankBoston... <BR> <BR>The question is: what do you think about this logo? Which profile do you think our company has looking at this logo. <BR> <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/41503.gif" alt="logo"> <BR> <BR> <BR>the word DIA has 2 meanings in portuguese: the first is DAY &#40;opposite of night&#41; and the other is an abbreviation of Associated Designers. <BR> <BR>Suggestions would be very wellcome, as well as your oppinion about the present logo. <BR> <BR>If you want, have a look at our website <BR><a href="http://www.diacm.com.br" target="_blank">www.diacm.com.br</a> <BR> <BR></font></font>'
