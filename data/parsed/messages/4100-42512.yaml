post:
  id: 70911
  user: 2193
  date: 2004-08-10T05:29:00
  date_raw: Tuesday, August 10, 2004 - 5:29 am
  votes: null
  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">hello all <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> <BR> <BR>I am setting a brochure where both of the two text columns of an A4 page are almost filled with bullet points. My dilemma is this: do I hang the bullets outside the margin or not? Opinions on this matter are appreciated! <BR> <BR><a href="http://www.stereotypography.com/bullets.jpg" target="_blank">http://www.stereotypography.com/bullets.jpg</a></font></font></font></font></font></font></font></font></font></font></font></font></font>'
comments:
  - id: 70913
    user: 1551
    date: 2004-08-10T05:49:00
    date_raw: Tuesday, August 10, 2004 - 5:49 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think the problem here is that the writer is misusing bullet points. These should highlight &#42;short&#42; lists. It is absurd have a page full of bullets, as they no longer highlight anything. I think they will look bad wherever you put them.  <BR> <BR>I think the bullets need to go. Then you can try a variety of solutions, such as having the titles bigger or bolder and the list as is, indented without the bullets, with items separated by extra leading. Or have the lists with hanging indents, no bullet, etc.    </font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 70924
    user: 2828
    date: 2004-08-10T06:29:00
    date_raw: Tuesday, August 10, 2004 - 6:29 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I would try hanging the bullets outside and making them a stipple maybe 40 or 50% black? This way they are there � and I&#39;m assuming the client wants them � but they will not distract as much from the page or ruin the strong lines of the text blocks.</font></font></font></font></font></font></font></font></font></font></font>
  - id: 70925
    user: 2828
    date: 2004-08-10T06:34:00
    date_raw: Tuesday, August 10, 2004 - 6:34 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">BTW I agree with William. It is absurd to have this many bullets on the page. It can show a lack of ability to write short concise copy using proper English. <BR> <BR>You could mockup a page with bullet points turned into paragraphs to show that you will have a greater economy of space � possibly saving $ on printing!</font></font></font></font></font></font></font></font></font></font>
  - id: 70929
    user: 1551
    date: 2004-08-10T06:45:00
    date_raw: Tuesday, August 10, 2004 - 6:45 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;assuming the client wants them  <BR> <BR>Hopefully, if you show the client samples with and without them, the client will &#34;get the point&#34;!</font></font></font></font></font></font></font></font>
  - id: 70968
    user: 4214
    date: 2004-08-10T10:41:00
    date_raw: Tuesday, August 10, 2004 - 10:41 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> <BR> <BR> Hello all: <BR> <BR>While I agree with most of you on the use and overuse of the bullet point, the question was &#34;to hang or not?&#34; In my experience, bullet points hang outside of the margin. I hang to the left, but that&#39;s another matter. <BR> <BR></font></font></font></font></font></font></font>'
  - id: 70970
    user: 1461
    date: 2004-08-10T10:52:00
    date_raw: Tuesday, August 10, 2004 - 10:52 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;d suggest no bullets and more spacing between each paragraph instead. Bullets used like this typically distract from the content. <BR> <BR>All that said, when I use bullets, they don&#39;t hang outside of the main body margins. I consider them &#39;sub-points&#39; to the main text, and, like in an outline, need to be indented to show hierarchy.</font></font></font></font></font></font>
  - id: 71091
    user: 3089
    date: 2004-08-10T20:39:00
    date_raw: Tuesday, August 10, 2004 - 8:39 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I agree with darrel. As subordinant points they shouldn&#39;t hang. But do try to get rid of them altogether.</font></font></font></font></font>
  - id: 71129
    user: 2828
    date: 2004-08-11T05:19:00
    date_raw: Wednesday, August 11, 2004 - 5:19 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">tom and darrel <BR> <BR>I agree with you that subordinant points shouldn&#39;t hang &#40;unless you use a small font&#41;. <BR> <BR>However, in this case the points are virtually the entire text and are in fact the reason why people would choose to attend the particular session at the conference. <BR> <BR>In this instance it is much cleaner to have the strong left alignment. <BR> <BR></font></font></font></font>
  - id: 71309
    user: 1461
    date: 2004-08-12T08:39:00
    date_raw: Thursday, August 12, 2004 - 8:39 am
    votes: null
    html: <font class="dontLookLikeCrap">Maybe we&#39;re talking about two different things. <BR> <BR>I think the bullet needs to hang from the text it is referring to, but shouldn&#39;t hange outside the &#39;parent text&#39; margin. <BR></font>
