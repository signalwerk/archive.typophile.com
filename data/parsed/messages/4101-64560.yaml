  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;m working on a webpage for a friend of mine, and she really wants to use the Papyrus font on the page. I know how to accomplish this using a css sheet, however, I can&#39;t find a way to convert the font to TrueDoc format &#40;.pfr&#41; so that it will display in all browsers. <BR> <BR>If anyone on this board can help me with this, I would be eternally greatful! <BR> <BR>Thanks!</font></font></font></font></font></font></font></font></font></font></font>
