    date: 2005-02-04T14:12:00
    date_raw: Friday, February 04, 2005 - 2:12 pm
    votes: null
    html: <font class="dontLookLikeCrap">sIFR is a way to get arbitrary fonts into web pages. It doesn&#39;t do anything typographically that can&#39;t already be done in Flash. Basically, using a bit of Javascript and CSS, it replaces, say, &#60;h1&#62; headings with a small Flash swf containing the same text but in your chosen font. <BR> <BR>More information <a href="http://usabletype.com/articles/2004/how-and-when-to-use-sifr/">here</a>.</font>
