    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Depending on just how much text you need to set in Papyrus and how your programming skills are, you can also use code &#40;PHP, .NET and others&#41; to dynamically change the text into GIF images. There are obvious drawbacks to this approach, but it might be worth considering.</font></font></font></font></font></font>
