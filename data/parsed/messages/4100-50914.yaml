  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Classic Typo Assignment &#40;Typography&#41; : You are required to design a typeface based on three classical typefaces, one sans serif, one serif and one script.  <BR> <BR>I have chosen : Sans serif = Gill Sans ITC Bold Serif = Garamond ITC Bold | Script = Snell ITC <BR> <BR>Using Gill as my base font, and inverting the serif to incorporate Garamond &#40;see attachment&#41;. <BR>I have yet to use Snell &#40;or any other script face to enhance or ad to my developments&#41;. <BR> <BR>As research and development I would be grateful for users advice and guidance on this. <BR> <BR>I look forward to your comments.<img src="http://www.typophile.com/forums/messages/4100/50915.jpg" alt="My Classic Typo Development"></font></font></font></font></font></font></font></font></font></font></font>'
