  - id: 3878
    user: 984
    date: 2002-05-03T01:34:00
    date_raw: Friday, May 03, 2002 - 1:34 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Nice. I really like your ampersand, comma, &#39;K&#39;, &#39;k&#39;, &#39;f&#39; and &#39;m&#39;! <BR> <BR>That &#39;q&#39; is a killer! The &#39;Q&#39; however seems too much like your &#39;q&#39;. I&#39;d round off the top like on the &#39;O&#39;. <BR> <BR>Also I think the &#39;g&#39; is too closed. Maybe open up the lower counter. </font></font></font></font>
  - id: 3927
    user: 1025
    date: 2002-05-06T14:41:00
    date_raw: Monday, May 06, 2002 - 2:41 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Richard Wikstrom: <BR>&#62;Only thing I would suggest is &#34;humanizing&#34; the typeface a bit. Softening it up a bit...  <BR> <BR>I hear you. It definetly needs &#34;humanizing&#34;! <BR>Still, doing that would probably make it necessary to change a whole lot &#40;if not everything&#41;, which I&#39;m not really up to... <BR>The &#34;dead&#34; nature of this font might be because I was very &#40;perhaps too&#41; systematic about it. Building the letters out of small bricks. Next time I&#39;ll try a different approach. <BR> <BR>&#62;The K&#39;s does seem a bit odd though.  <BR> <BR>Joe Pemberton: <BR>&#62;I think the K is nice. Perhaps an alternate is in order.  <BR> <BR>Odd? Nice? In what way? <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":&#41;"> I thought they were pretty straight-forward.. <BR> <BR><IMG SRC="http://www.typophile.com/forums/messages/29/1288.gif" ALT="anton_kk.gif">  <BR> <BR>Here&#39;s a pic of the old k&#39;s - but I don&#39;t really like them. I think this K resembles the X too much. Also, I was thinking the new k&#39;s would probably be more readable in context with the other letters, because they are more unique? But perhaps they&#39;re too unique? <BR> <BR>&#62;I think that q could, out of context be mistaken for a g...  <BR> <BR>I&#39;ve heard that before, so it&#39;s probably true. But I must admit I&#39;m quite fond of it as it is, so I think I&#39;ll take my chances <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":&#41;"> <BR> <BR>Jonathan Hise Kaldma: <BR>&#62;The &#39;Q&#39; however seems too much like your &#39;q&#39;. I&#39;d round off the top like on the &#39;O&#39;.  <BR> <BR>Good point. I will try that. <BR> <BR>&#62;Also I think the &#39;g&#39; is too closed. Maybe open up the lower counter.  <BR> <BR>I was hoping nobody would notice that! I have earlier tried to do something about it, but I thought the results didn&#39;t work out that well. I just made two new versions though, which aren&#39;t just as bad. Or, one of them isn&#39;t. I think. Here they are: <BR> <BR><IMG SRC="http://www.typophile.com/forums/messages/29/1289.gif" ALT="anton_gg.gif">  <BR> <BR>I sort of like the black one. But maybe the space in the middle &#40;excuse my complete lack of english typographic words!&#41; is still too small? <BR> <BR>Thank you all &#40;including you Hrant&#41; for the nice words - it went smoother than I expected... <BR> <BR>-Mads Rahbek Hougaard</font></font></font></font>'
