  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><IMG SRC="http://www.typophile.com/forums/clipart/your_image.gif" ALT="mrh_anton.gif">  <BR> <BR>First of all: what a great initiative! Your comments and work is a great inspiration to me.  <BR>This here is my first font. I mainly made it to to get experienced with the software, thus the utter simplicity of it.. it&#39;s been lurking around my hard drive for quite some time now, so I think it&#39;s about time I finish it <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":&#41;"> <BR>Any comments as to what I should do better? <BR> <BR>Thank you, <BR>Mads Rahbek Hougaard</font></font></font></font>'
