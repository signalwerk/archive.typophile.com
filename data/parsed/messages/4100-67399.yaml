    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Ok guys what do you think?? Is this better?? <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/67626.jpg" alt="Xtreme4"></font></font></font></font></font></font>
  - id: 96820
    user: 2289
    date: 2005-03-18T04:31:00
    date_raw: Friday, March 18, 2005 - 4:31 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">To be brutal � No. <BR>In the logos you have posted the font used does not serve well, as Daniel noted the r is particularly weak, the t is over-balancing, the original x had a very thin stroke &#40;as a result of skewing&#41;. The red outline is slavishly following the contours of the type and those nicks and bumps will not reproduce well and are distracting if you want to keep them I would make the lines straight. <BR>If you want a logo that is memorable you have to compete with other logos like those I linked to in my first post and they have taken a similar tack � featured X, outlines etc.  <BR>I have attached a jpeg to illustrate another approach which has the benefit of being different, forgive me for including it but it describes my point better, it is just something that I knocked together in a few minutes and could do with refinement. <BR>Tim <BR><img src="http://www.typophile.com/forums/messages/4100/67638.jpg" alt=""></font></font></font></font>
  - id: 96833
    user: 1869
    date: 2005-03-18T07:30:00
    date_raw: Friday, March 18, 2005 - 7:30 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">In addition to what others have said about the font, the latest version does not read as xtreme to me at all.  I see a graphic, that will not produce well in small applications, and then the word &#34;treme.&#34;  You may also need to use the design in one color applications and this concept will not necessarily work well.  A logo should be able to successfully convey what you desire in multiple applications &#40;web, print, signage, wearables, etc.&#41; and I don&#39;t think this will do so as currently presented. <BR> <BR>- J.</font></font></font>
  - id: 97231
    user: 2172
    date: 2005-03-22T07:31:00
    date_raw: Tuesday, March 22, 2005 - 7:31 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The logo in post #3 is, in my opinion, aiming squarely at the middle of the market and I think it hits the mark. While I agree that the design needs a lot of adjustment &#40;the outline around the type is too slavish, making it bumpy and chipped, and the &#39;r&#39; is a bit odd&#41; the logo immediately communicates the X-treme Sprots feel you&#39;re shooting for. It does it in a very generic and expected way, but it does it. Though it doesn&#39;t say trucks to me, it&#39;s more biking and motocross. <BR> <BR>If you want to sit squarely in the middle of the crowd, then I think this direction works, if you want to be memorable, I&#39;d try again. <BR> <BR>I think the most interesting part is the tire tracks, but their current design will be a mess at small sizes. The tire tracks are probably a good element to work with and create some unique and interesting visuals. The tread pattern alone could make some really bold and interesting opportunities for a designer.</font></font>'
  - id: 97635
    user: kernhole-users
    date: 2005-03-24T16:04:00
    date_raw: Thursday, March 24, 2005 - 4:04 pm
    votes: null
    html: <font class="dontLookLikeCrap">The logo looks more like a logo used by tuners &#40;the kind of guys that put coffee cans on the exhausts of civics&#41; than an off road company. <BR> <BR>Maybe looking a bit dirty and mudcovered might help a bit. Regarding the tire tracks - they look like street tracks not offroad trenches. <BR> <BR>The logo doesn&#39;t seem suited to the respective market.  As other posters have mentioned, that syllable done in that type face is in need of a typographic intervention. :-&#41;</font>
