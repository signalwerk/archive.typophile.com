post:
  id: 96350
  user: xtremeoffroad-users
  date: 2005-03-14T21:59:00
  date_raw: Monday, March 14, 2005 - 9:59 pm
  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hello everyone, could I please take a moment of your time and ask you to take a look at some logos we had designed for us.  I am not an artist and could really use some constructive feedback.  Thank you everyone!! <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/67400.jpg" alt="Logo Comp 1"> <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/67401.jpg" alt="Logo Comp 2"></font></font></font></font></font></font></font></font></font></font></font>
comments:
  - id: 96365
    user: 2915
    date: 2005-03-15T03:48:00
    date_raw: Tuesday, March 15, 2005 - 3:48 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The tire tracks will work on-screen but when you go to print them they will fill-in in smaller sizes and become a blob. You obviously recognize the problem with the lowercase r. It creates a terrible negative space gap. Have you looked at other typefaces? I think you need to.  <BR>Basicly loose the Photoshop and Illustrator gimics&#40;the tints the reflection the outlines&#41;. Make a logo that works in black and white and is strong. Most logos don&#39;t exist by themselves they are surrounded by images and words that reinforce the subject. The word here is KISS: Keep It Simple</font></font></font></font></font></font></font></font></font></font>'
  - id: 96395
    user: 2289
    date: 2005-03-15T07:44:00
    date_raw: Tuesday, March 15, 2005 - 7:44 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">It was only by looking at your website that I realised you were not involved in bicycles, which is what the tyre tracks had led me to assume. The letterforms need to be developed if you are going to stick with that sloped face, but it isn&#39;t working for the off-road &amp; performance line something simpler and easier to read is called for. Specifically the x t and r in your samples need work. The outlining is too much, especially where it encloses the whole logo, straighter lines without the indentations would be better. However, as a more important consideration, I did this search <a href="http://images.google.co.uk/images?hl=en&amp;lr=&amp;ie=ISO-8859-1&amp;imgsz=xxlarge&amp;q=xtreme+logo" target="_blank">http://images.google.co.uk/images?hl=en&amp;lr=&amp;ie=ISO-8859-1&amp;imgsz=xxlarge&amp;q=xtreme&#43;logo</a> which reveals more xtremes than you would want to shake a stick at and none of them particularly noteworthy.  I would look at an image/shape &#40;not an X&#41; and treat the type simply. <BR>Tim</font></font></font></font></font></font></font></font></font>
  - id: 96402
    user: xtremeoffroad-users
    date: 2005-03-15T08:14:00
    date_raw: Tuesday, March 15, 2005 - 8:14 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thank you for taking a look...I guess what I was attempting to achieve was an eye catching logo that people could remember.  If you have any other suggestions that I could pass on to the developers it would be greatly appreciated. <BR> <BR>Thanks again everyone! <BR> <BR>Mike</font></font></font></font></font></font></font></font>
  - id: 96794
    user: xtremeoffroad-users
