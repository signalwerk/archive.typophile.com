  user: wohnesorg-users
  date: 2005-03-04T12:50:00
  date_raw: Friday, March 04, 2005 - 12:50 pm
  votes: null
  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Regarding LinoLetter 03/05 - &#34;Designs Determined to Inspire&#34; uploaded by Mr. Thorsten Weil on 3rd March 2005 to this Typophile forum, I would like to add the following remarks to Section 2 on &#34;Basic Commercial&#34;: <BR> <BR>     2. The Typeface in the New York Subway System - Basic Commercial <BR> <BR>     As far as sans serif text faces go, you&#39;ll always be on the <BR>     safe side with this old favorite: the Basic Commercial font <BR>     family epitomizes clear and objective design. These classic <BR>     forms have very few unusual qualities, and remain both <BR>     lively and legible in all weights. Perhaps this anonymity is <BR>     the reason that Basic Commercial&#39;s style has been popular <BR>     with graphic designers for decades! <BR> <BR>     Basic Commercial&#39;s design has a century&#39;s worth of history <BR>     behind it. The typeface was distributed for many years in <BR>     the United States under the name Standard Series, where it <BR>     worked its way into many aspects of daily life and culture: <BR>     for instance, it was the face chosen for use in the New <BR>     York City subway system&#39;s signage.  <BR> <BR>     Grab all eight Basic Commercial font styles together in one <BR>     low-price value pack:  <BR>     <a href="http://www.linotype.com/6-2387-6/basiccommercialvp.html" target="_blank">http://www.linotype.com/6-2387-6/basiccommercialvp.html</a> <BR> <BR> <BR>1&#41; &#34;Akzidenz Grotesk&#34; by Adobe <BR> <BR>More than 15 years ago, in 1989, Adobo published the font &#34;Akzidenz Grotesk&#34; with the following copyright notice: <BR> <BR>&#34;Copyright &#40;c&#41; 1989 Adobe Systems Incorporated. All Rights Reserved. The digitally encoded machine readable software for producing the Typefaces licensed to you is copyrighted &#40;c&#41; 1989 Adobe Systems. This software is the property of Adobe Systems Incorporated and its licensors, and may not be reproduced, used, displayed, modified, disclosed or transferred without the express written approval of Adobe.&#34; <BR> <BR>Mr. Thomas Phinney of Adobe Inc. contends with reference to this Adobe copyright notice that it was Adobe that created in the year 1989 this &#34;font software program&#34; as &#34;original work of authorship&#34;. <BR> <BR> <BR>2&#41; &#34;Basic Commercial&#34; by Linotype <BR> <BR>About 5 years ago, in 2000, Linotype published exactly the same font. &#34;Exactly the same&#34; means that both fonts &#40;Adobe&#39;s &#34;Akzidenz Grotesk&#34; and Linotype&#39;s &#34;Basic Commercial&#34;&#41; have completely identical glyphs and that both fonts are completely identical &#34;font software programs&#34;. <BR> <BR>However, in the &#34;Basic Commercial&#34;, Adobe&#39;s copyright notice was removed and replaced by this notice: <BR> <BR>&#34;Copyright &#40;c&#41; 2000, 2002, 2003 Linotype Library GmbH, <a href="http://www.linotype.com" target="_blank">www.linotype.com</a>. All rights reserved. This software may not be reproduced, used, displayed, modified, disclosed or transferred without the express written approval of Linotype Library GmbH. Basic Commercial is a trademark of Heidelberger Druckmaschinen AG which may be registered in certain jurisdictions, exclusively licensed through Linotype Library GmbH, a wholly owned subsidiary of Heidelberger Druckmaschinen AG. This typeface is original artwork of Morris Fuller Benton. The design may be protected in certain jurisdictions.&#34; <BR> <BR>Mr. Bruno Steinert of Linotype GmbH contends with reference to this Linotype copyright notice that it was Linotype that created in the year 2000, i.e. 11 years later, this &#34;font software program&#34; as &#34;original work of authorship&#34;. <BR> <BR>Is it possible that Linotype, more than 10 years later and completely independently created a &#34;font software program&#34; that is hundred percent identical with a &#34;font software program&#34; created by Adobe more than 10 years ago ??? <BR> <BR> <BR>3&#41; Morris Fuller Benton <BR> <BR>Bruno Steinert of Linotype contends with reference to &#34;Basic Commercial&#34;: <BR> <BR>    &#34;This typeface is original artwork of Morris Fuller Benton.&#34; <BR> <BR>For instance at the website <BR> <BR>   <a href="http://www.myfonts.com/fonts/linotype/basic-commercial-lt/" target="_blank">http://www.myfonts.com/fonts/linotype/basic-commercial-lt/</a> <BR> <BR>we read about &#34;Basic Commercial&#34;: <BR> <BR>    Design Credits <BR>    First seen on MyFonts: April 10th, 2002 <BR>    Designed by: Morris Fuller Benton <BR>    Designed when: 1990 <BR>    Design owned by: Linotype <BR> <BR>And if you enter the following keywords at <a href="http://www.google.com" target="_blank">www.google.com</a> <BR> <BR>    Basic Commercial Morris Fuller Benton Akzidenz Grotesk <BR> <BR>Google displays a link to a Linotype website, whose contents has been modified, but if you click on the &#34;cache&#34;, Google displays the old contents of website on 8. Apr. 2004 23:28:15 GMT. Here we read the cached contents of the Linotype website of 8th April 2004: <BR> <BR>   &#34;Basic Commercial <BR>   Designer Morris Fuller Benton, 1900  <BR>   About Basic Commercial&#40;tm&#41; <BR>   Basic Commercial font is based on the design for Akzidenz Grotesk, <BR>   which appeared with Berthold in 1900, designed by type setters whose <BR>   names have not been recorded, but whose skill cannot be overlooked.&#34; <BR> <BR>This means that Bruno Steinert contended that &#34;Basic Commercial&#34; was designed by the Berthold designer Morris Fuller Benton in the year 1900. <BR> <BR>However, Morris Fuller Benton never designed the &#34;Akzidenz Grotesk&#34;, nor did he design Linotype&#39;s &#34;Basic Commercial&#34; which is 100% identical with Adobe&#39;s &#34;Akzidenz Grotesk&#34;. <BR> <BR>In &#34;LinoLetter&#34; of March 2005 &#34;Designs Determined to Inspire&#34;, Bruno Steinert now tells a new story. Now, he does not mention &#34;Akzidenz Grotesk&#34;, &#34;Berthold&#34; and &#34;Morris Fuller Benton&#34;. These names are now discarded by him. Instead, now in 2005, Bruno Steinert contends that the &#34;Basic Commercial&#34; is identical with the font &#34;Standard Series&#34;. He declares: &#34;The typeface was distributed for many years in the United States under the name Standard Series&#34;. <BR> <BR>Let&#39;s summarize: According to Bruno Steinert, the font &#34;Basic Commercial&#34; by Linotype, which is identical with the font &#34;Akzidenz Grotesk&#34; by Adobe, was created by Morris Fuller Benton in 1900 as &#34;Akzidenz Grotesk&#34; for Berthold, and Bruno Steinert distributed this font for many years in the United States under the name &#34;Standard Series&#34; and Bruno Steinert created the &#34;font software program&#34; for this typeface in the year 2000. Correct? <BR> <BR> <BR>4&#41; The Funny Font Forging Industry <BR> <BR>Professor Devroye at his website <BR> <BR>    <a href="http://jeff.cs.mcgill.ca/~luc/legal.html" target="_blank">http://jeff.cs.mcgill.ca/~luc/legal.html</a> <BR> <BR>draws the attention to the report &#34;The Funny Font Forging Industry&#34;, which is downloadable as forgers.pdf from the website <BR> <BR>    <a href="http://www.sanskritweb.de/fontdocs" target="_blank">http://www.sanskritweb.de/fontdocs</a> <BR> <BR>In this report, Linotype&#39;s &#34;Basic Commercial&#34; alias Adobe&#39;s &#34;Akzidenz Grotesk&#34; alias Berthold&#39;s &#34;Akzidenz Grotesk&#34; is seen from the point of view of public prosecutors and criminal court judges. In this report, Bruno Steinert is described as a font forger who forged the &#34;Akzidenz Grotesk&#34; by the &#34;Linotype Method&#34;. <BR> <BR> <BR>5&#41; <font color="808080">name removed by moderator</font> <BR> <BR>Those who want to have a look at the &#34;Basic Commercial&#34;, but who do not want to waste money on this font forgery by Bruno Steinert, may visit <font color="808080">name removed by moderator</font> <BR> <BR><font color="808080">url removed by moderator</font> <BR> <BR>These fonts do not contain the copyright notices so that criminal investigators cannot decide whether the fonts at the <font color="808080">name removed by moderator</font> are Adobe&#39;s &#34;Akzidenz Grotesk&#34; or Linotype&#39;s &#34;Basic Commercial&#34; or Berthold&#39;s original &#34;Akzidenz Grotesk&#34;. This is no surprise, since all these fonts are identical with the exception of the copyright notices. <BR> <BR>If you open Berthold&#39;s &#34;Akzidenz Grotesk&#34; with a font editor and replace the Berthold copyright notice by the Adobe copyright notice, you create Adobe&#39;s &#34;Akzidenz Grotesk&#34;. <BR> <BR>If you open Adobe&#39;s &#34;Akzidenz Grotesk&#34; and replace the Adobe copyright notice by the Linotype copyright notice and additionally replace the name &#34;Akzidenz Grotesk&#34; by &#34;Basic Commercial&#34;, you create Linotype&#39;s &#34;Basic Commercial&#34;. <BR> <BR>If you open the <font color="808080">name removed by moderator</font> fonts and replace the name &#34;Basic Commercial&#34; by &#34;Basic Crimes&#34; and if you insert the notice &#34;Copyright by Criminals&#34;, you create a general-purpose version for the criminals in the font forging industry. <BR> <BR>Any lawsuits instituted against the <font color="808080">name removed by moderator</font> would be most interesting from the legal point of view, since all three fonts are identical: <BR> <BR>Mr. Harvey Hunt of Berthold would contend at court that it was he, who wrote the &#34;font software program&#34; of &#34;Akzidenz Grotesk&#34; &#40;&#34;Copyright by Berthold...&#34;&#41;. <BR> <BR>Mr. Thomas Phinney of Adobe would contend at court that it was he, who wrote the same &#34;font software program&#34; of the same &#34;Akzidenz Grotesk&#34; &#40;&#34;Copyright by Adobe...&#34;&#41; <BR> <BR>Mr. Bruno Steinert of Linotype would contend that it was he, who wrote the same &#34;font software program&#34; of the &#34;Basic Commercial&#34; &#40;&#34;Copyright by Linotype...&#34;&#41;. <BR> <BR>Wilhelm Ohnesorg, Germany</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
