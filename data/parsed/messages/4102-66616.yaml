    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This is what David Lemon of Adobe wrote about the quality, or rather lack thereof, of Linotype&#39;s digitization of what was then Akzidenz-Grotesk and they now call Basic Commercial. <BR> <BR>&#34;When Adobe licenses a typeface, the licensing company supplies what they consider the definitive design; Adobe is not free to reinterpret it. As an example of the difference that sources make, I suggest comparing the Akzidenz Grotesk, Berthold Walbaum or Post-Antiqua which Adobe produced from Berthold&#39;s digitizations to the versions that Linotype sells.&#34;</font></font></font></font>
