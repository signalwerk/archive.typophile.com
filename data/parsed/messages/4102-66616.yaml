    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; One of the fundamentals of most democracies ... &#40;Malcolm Wooden&#41; <BR> <BR>I said &#34;IF&#34; &#40;&#34;IF an art seller...&#34;, &#34;IF the font seller Mr. Bruno Steinert ...&#34;&#41;. IF means &#34;on condition that&#34;, &#34;in case that&#34;. <BR> <BR>Moreover, in this highly special typeface matter, global references to constitutional rights are too far-fetched. <BR> <BR>I could retort by saying that George Bush called Saddam Hussein a &#34;criminal&#34;, who has amassed &#34;mass destruction  weapons&#34;, although no court of law has ever made a decision to this effect. But I consider such global constitutional arguments as too far-fetched in this extremely special matter dealing with typefaces. <BR> <BR>W.O.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
