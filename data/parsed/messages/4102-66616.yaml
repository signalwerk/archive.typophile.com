    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;You thought it was clear but it is not clear &#40;Sergej Malinovsky&#41; <BR> <BR>It seems that nobody of the 8,000 odd members of this forum knows anything about Morris Fuller Benton. <BR> <BR>So, I had better ask professionals instead of the laymen of this Typophile forum. <BR> <BR>W.O.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 95389
    user: 2630
    date: 2005-03-06T14:49:00
    date_raw: Sunday, March 06, 2005 - 2:49 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thank you for being so polite! <BR>Perhaps this helps to understand Morris Fuller Benton and Akzidenz Grotesk better. <BR>From: �Revival of the fittest� <BR>Published by Print Magazine Publications <BR>England ISBN 1-883915-08-2 <BR>Franklin Gothic chapter by Ansel M. Olson <BR>Quote 1 on page 106::  <BR>�Designed and released in the period 1902-1912, Franklin Gothic was one of over 200 typefaces designed by Morris Fuller Benton and produced by ATF. The creation of this new sans serif, intended to compete with the 19th-century European sans serifs &#40;e.g., Akzidenz Grotesk&#41; was one of Morrris Benton�s first tasks at ATF. The result was a dramatic success. Franklin Gothic sold well immediately following its release, and continues to be popular today.� <BR>Quote 2 on page 107: <BR>�Franklin Gothics success was so great that ATF quickly licensed it to the major manufacturers of mechanical typesetting machines &#40;Monotype and Linotype&#41; to prevent it from being copied.�  <BR> <BR>Info via one of the laymen! <BR>Henk</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 95420
    user: wohnesorg-users
    date: 2005-03-07T01:03:00
    date_raw: Monday, March 07, 2005 - 1:03 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Dear Mr. Gianotten, <BR> <BR>Thanks for your interesting reply. <BR> <BR>Morris Fuller Benton made a lot of Gothic typefaces, e.g. Alternate Gothic, Bank Gothic, Clearface Gothic, Franklin Gothic, News Gothic, Raleigh Gothic and others. I examined all these fonts, but none of these Benton fonts is identical with Linotype&#39;s &#34;Basic Commercial&#34;. <BR> <BR>As regards the Franklin Gothic by Morris Fuller Benton, to which you refer by quoting Ansel M. Olson&#39;s chapter on &#34;Franklin Gothic&#34; from the book &#34;Revival of the fittest&#34;, we see that Olson writes &#34;... intended to COMPETE with ... e.g. Akzidenz Grotesk&#34;. But a font that COMPETES with another font is NOT IDENTICAL with another font, UNLESS it is a pirated copy or a knock-off imitation of the other font.  <BR> <BR>Furthermore Ansel M. Olson does not mention &#34;Basic Commercial&#34; at all in connection with Morris Fuller Benton and therefore he does not answer the question whether Mr. Bruno Steinert&#39;s legally binding copyright notice declaration &#34;This Basic Commercial typeface is original artwork of Morris Fuller Benton&#34; is a false fraudulent copyright notice or not. <BR> <BR>If a judge at a criminal court looks at the comparison picture attached below, he will easily recognize that &#34;Akzidenz Grotesk&#34; and &#34;Basic Commercial&#34; are completely identical, whereas &#34;Basic Commercial&#34; and &#34;Franklin Gothic&#34; are completely different, and hence the criminal court judge will easily recognize that Mr. Bruno Steinert&#39;s declaration that &#34;Basic Commercial&#34; is &#34;original artwork of Morris Fuller Benton&#34; is a false fraudulent copyright notice intended to make gullible font buyers believe that &#34;This typeface is original artwork of Morris Fuller Benton&#34;. <BR> <BR>If an art seller declares: &#34;This painting is original artwork of Vincent van Gogh&#34;, although this artwork was not made by Vincent van Gogh, then this art seller is a criminal. And if the font seller Bruno Steinert declares &#34;This typeface is original artwork of Morris Fuller Benton&#34;, although this artwork was not made by Morris Fuller Benton, then Bruno Steinert is a criminal. <BR> <BR>Cheers, <BR> <BR>W.O. <BR> <BR><img src="http://www.typophile.com/forums/messages/4102/66730.gif" alt="Comparison of Basic Commercial with Franklin Gothic"></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 95423
    user: malcolm-users
    date: 2005-03-07T01:53:00
    date_raw: Monday, March 07, 2005 - 1:53 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">One of the fundamentals of most democracies in the world is that a <BR>&#39;criminal&#39; is only a criminal when it has been decided so by a court of law, <BR>not by individuals or other groups, no matter what views or interests they <BR>may hold.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
