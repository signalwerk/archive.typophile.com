    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Spiekermann complains that Linotype&#39;s Tetra is a rework of Meta.  <BR> <BR><a href="http://www.spiekermann.com/iblog/C61720386/E477041415/index.html" target="_blank">http://www.spiekermann.com/iblog/C61720386/E477041415/index.html</a> <BR> <BR>&#34;FF Meta, designed almost 20 years ago by myself. I’ve been accused of having put too many silly details into it, like an oblique top terminal on some of the caps, like the E. Now look at Textra’s E.&#34; <BR> <BR>Gustav Jaegers Delta Jaeger which predates Meta has oblique terminals on the bottom caps. <BR> <BR>Spiekermann&#39;s VW and Bosch corporate typefaces are reworks of Futura and Akzidenz-Grotesk. <BR> <BR>TB</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
