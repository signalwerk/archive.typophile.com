    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; Wilhelm, what is your God-damned point? &#40;Sergej Malinovski &#41; <BR> <BR>I thought, this was clear, since the thread header is &#34;Basic Commercial and Morris Fuller Benton&#34;. <BR> <BR>BTW, I have just read a book review of the title &#34;American Type: Design and Designers&#34; by David Consuegra, which was published as a paperback in 2004. <BR>  <BR>According to the reviewer, Cosuegra&#39;s book describes the typefaces made by Morris Fuller Benton. If there exists a typophile member who has read this book, it would be fine, if it were mentioned here, whether the &#34;Basic Commercial&#34; was designed by Morris Fuller Benton. <BR> <BR>W.O. <BR><img src="http://www.typophile.com/forums/messages/4102/66697.jpg" alt="David Consuegra: &#34;American Type&#34;"></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
