    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Your point in earlier mails seems to be that fonts can&#39;t be copyrighted, despite the fact that courts have supported font copyright.  <BR> <BR>But the above case, even if true, seems to relate purely to trademarks. The fact that font vendors go to extreme measures to avoid using or referencing other people&#39;s trademarks is understandable. Trademarks add more protectability to 100 year old designs than copyright, design patent, EULAs and big sticks combined. <BR> <BR>Even if it turns out that copyright strings in fonts are worthless, I think including them sends a good message to the uninformed that the font isn&#39;t public-domain and was probably provided under some kind of license.  <BR> <BR>Cheers, Si</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 95308
    user: wohnesorg-users
    date: 2005-03-05T05:51:00
    date_raw: Saturday, March 05, 2005 - 5:51 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Dear Mr. Daniel, <BR> <BR>I am very surprised about your message, and I am astonished that the moderator removed the name of the website which offers the &#34;Basic Commercial&#34; font WITHOUT THE FALSE copyright notice. <BR>  <BR> <BR>1&#41; Copyrightability of Computer Programs in US <BR> <BR>&#62; Your point in earlier mails seems to be that fonts can&#39;t be copyrighted, despite the fact that courts have supported font copyright. <BR> <BR>I did not say so! On the contrary: In the US, computer programs &#40;which, by the way, are defined by US courts as &#34;literary works&#34;&#41; are copyrightable since 25 years &#40;since the enactment of a certain amendment in the year of 1980&#41; PROVIDED THAT certain requirements, which I have described, are fullfilled, namely &#40;1&#41; firstly that a computer program is only protected by copyright if it is a creative work, and &#40;2&#41; secondly if the author of this creative work is a human being that has written the source code of this computer program. <BR> <BR>Regarding the SOURCE CODE requirement which was rejected by other members of this forum as &#34;so scurrilous and wrong&#34;  &#40;William Berkson&#41;, I give a short example: <BR> <BR>My grandmother does not know the PostScript programming language and she cannot write the source code of a PostScript program. Therefore she can never be the programmer &#40;=author = copyright owner&#41; of a PostScript program. <BR> <BR>The same is true for PostScript Type 1 fonts: My grandmother cannot write the source code of PostScript Type 1 fonts, and therefore she can never be the programmer &#40;= author = copyright owner&#41; of a PostScript Type 1 font. <BR> <BR>A computer programmer, who reads this &#34;grandma example&#34;, will be most astonished to learn that the other members of this Typophile forum are of the opinion that persons who are NOT computer programmers and who do NOT know the PostScript programming language and who are NOT able to write the source code of PostScript Type 1 font software programs, claim to be the programmers &#40;= authors = copyright owners&#41; of PostScript Type 1 font software programs. This is very, very strange indeed! <BR> <BR> <BR>2&#41; Trademark Notice <BR> <BR>&#62; But the above case, even if true, seems to relate purely to trademarks. <BR> <BR>No, no! Copyright law and trademark law are two completely different laws. By stating <BR> <BR> &#34;Basic Commercial is a trademark of Heidelberger Druckmaschinen AG&#34; <BR> <BR>Mr. Bruno Steinert made it clear that &#34;Basic Commercial&#34; is a trademark. This statement is correct and it is legally sufficient, but this trademark notice refers to the trademark law, not to the copyright law. <BR> <BR> <BR>3&#41; Copyright Notice <BR> <BR>&#62; Even if it turns out that copyright strings in fonts are worthless <BR> <BR>Here begins the crucial part of the case. The copyright notice is not a declaration that you can add to a font just for fun. This would be highly dangerous: The copyright notice is a fully binding legal declaration which must contain the whole truth and nothing but the truth, since the copyright notice is similar to making a declaration in lieu of an oath. <BR> <BR>In the &#34;Copyright Law of the United States of America&#34; downloadable as Circular 92 at the website of the Copyright Office &#40;I do not mention the link for fear that the moderator removes the link&#41;, you will find the regulations concerning the copyright notice in sections � 404 seq. <BR> <BR>Since the Berthold and Linotype websites distribute fonts worldwide, theoretically to buyers of all nations, the &#34;Universal Copyright Convention&#34; &#40;UCC&#41;, Article III, and, in addition, the respective national copyright acts of the countries to which Berthold and Linotype sell their &#34;Akzidenz Grotesk&#34; or &#34;Basic Commercial&#34; fonts, are applicable, but for reasons of simplicity, I refer to the US Copyright Law only. <BR> <BR>In � 404 of this US Copyright Law &#40;and likewise in Article III of UCC&#41; it is stated that the &#34;year of FIRST publication&#34; must be truthfully declared in the copyright notice. <BR> <BR> <BR>A&#41; Mr. Bruno Steinert declared for the &#34;Basic Commercial&#34; font: <BR> <BR>&#34;Copyright &#40;c&#41; 2000, 2002, 2003 Linotype Library GmbH&#34; <BR> <BR>If Mr. Bruno Steinert, manager of the Linotype GmbH, cannot prove that Linotype&#39;s &#34;Basic Commercial&#34; was published FOR THE FIRST TIME in the year 2000, then he is a copyright criminal according to section &#34;� 506 Criminal Offenses&#34; of the US Copyright Law: <BR> <BR>&#34;� 506 &#40;c&#41; Fraudulent Copyright Notice: � Any person who, with fraudulent intent, places on any article a notice of copyright or words of the same purport that such person knows to be false, or who, with fraudulent intent, publicly distributes or imports for public distribution any article bearing such notice or words that such person knows to be false, shall be fined not more than $2,500.&#34; <BR> <BR>It is evident that Mr. Bruno Steinert cannot prove that the year of FIRST publication is the year 2000, because the identical font &#40;with Adobe&#39;s copyright notice&#41; was published more than 10 years earlier. <BR> <BR> <BR>B&#41; Furthermore, since Mr. Bruno Steinert removed the Adobe copyright notice and replaced it by the Linotype copyright notice, the following section � 505 &#40;d&#41; is also applicable to Mr. Steinert: <BR> <BR>&#34;&#40;d&#41; Fraudulent Removal of Copyright Notice: � Any person who, with fraudulent intent, removes or alters any notice of copyright appearing on a copy of a copyrighted work shall be fined not more than $2,500.&#34; <BR> <BR> <BR>C&#41; Furthermore, Mr. Bruno Steinert declared in the copyright notice: <BR> <BR>&#34;This typeface is original artwork of Morris Fuller Benton&#34; <BR> <BR>If Mr. Bruno Steinert cannot prove that this typeface is original artwork of Morris Fuller Benton, then again � 506 &#40;c&#41; of the US Copyright Law is applicable. <BR> <BR>It is evident that Mr. Bruno Steinert cannot prove that Morris Fuller Benton, who died 50 years ago, designed the &#34;Basic Commercial&#34;, because there does not exist any legal writ by Benton, whereby he declares to be the designer of the &#34;Basic Commercial&#34;, which - according to Mr. Bruno Steinert - was published for the FIRST time 50 years post mortem auctoris, i.e. 50 years after the death of Benton. <BR> <BR>If Mr. Steinert&#39;s declaration were true, then he would know more about Benton than the deceased Benton knew about himself, and Mr. Steinert would know more than the heirs of Morris Fuller Benton. But it is Mr. Steinert, who has to PROVE that his declaration about Morris Fuller Benton is not a false declaration. Mr. Steinert cannot expect that Morris Fuller Benton lifts the lid of his grave and declares: &#34;It was not me!&#34; <BR> <BR> <BR>A fine of $2,500 for an &#34;article&#34; &#40;= for a copy&#41; of a font with a false copyright notice is not much, but Mr. Bruno Steinert is expected to have sold hundreds or thousands of copies of the &#34;Basic Commercial&#34; font with his false copyright notice. <BR> <BR>It should be mentioned that a font with a false copyright notice is like a work of art with a false certificate: You are entitled to claim damages. <BR> <BR>Cheers, <BR> <BR>W.O.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
