    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">On march 6th, Mr. Henk Gianotten pretending to be &#34;one of the laymen&#34; wrote a misleading story in order to lead astray the readers of this forum thread. <BR> <BR>Those who are able to read Dutch will be surprised to read a completely different story by Mr. Henk Gianotten written by him on 7th July 2004: <BR> <BR>Wat zijn de �Basic Commercial� fonts? <BR> <BR>De Akzidenz Grotesk werd in 1900 uitgebracht en door enige Duitse gieterijen geproduceerd. <BR>Ook van de Akzidenz Grotesk is nu een versie in de Linotype Library opgenomen onder de <BR>naam �Basic Commercial�. Ze komt overeen met de destijds als Adobe font in de Linotype <BR>Library opgenomen Akzidenz Grotesk. Door juridische verwikkelingen tussen Adobe en <BR>Linotype aan de ene zijde en Berthold aan de andere komen de meeste Berthold fonts niet <BR>meer in de collecties van Adobe en Linotype voor. <BR> <BR>De oorspronkelijk door Adobe uitgebrachte PostScrift fontcollectie met veel Berthold fonts <BR>wordt nu nog uitsluitend via Berthold Types uit de VS gedistribueerd. De destijds door <BR>Linotype gevoerde �Berthold Exclusive� fontcollectie mag Linotype echter niet meer voeren. <BR>Enige Berthold letters vallen echter onder een destijds overeengekomen regeling waarbij <BR>Linotype het recht heeft de fonts te distribueren terwijl het �oude� Berthold de rechten op de <BR>naam aan een andere partij &#40;in dit geval het Amerikaanse Berthold Types&#41; heeft overgedragen. <BR>Volgens Amerikaans recht &#40;Berthold Types houdt kantoor in Chicago&#41; mag degene die de <BR>rechter op de naam heeft overgenomen de naam exclusief gebruiken. De oude contracten voor <BR>de distributiemogelijkheid blijven echter van kracht. Vandaar dat Linotype de letters die onder <BR>die bewuste overeenkomst vallen ook verder voert. Dat moet echter onder een andere naam. <BR>Deze 8 Basic Commercial fonts zijn er in de versies light, roman, bold en black en zijn <BR>voorzien van ook 4 italic uitvoeringen. Ze zijn.destijds door Linotype geschikt gemaakt voor <BR>haar eigen fotozetsystemen en PostScript toepassingen. <BR> <BR>Dat was nodig omdat Berthold het systeem van kapitaalhoogtemaatvoering hanteerde terwijl <BR>Linotype en Adobe de corpsgroottes in PS-picawaarden aangaven. Van de Basic Commercial <BR>zijn er PS-uitvoeringen voor Mac en PC maar ook TT-uitvoeringen voor Mac en PC. <BR>Dezelfde 8 Basic Commercial fonts zijn ook leverbaar als OT-fonts in de LT Com uitvoering <BR>met de zeer omvangrijke fontinhoud van 387 tekens per font. Bedrijven en organisaties die de <BR>Akzidenz Grotesk als huisstijlfont voeren en problemen ondervinden bij de toepassing van <BR>beeldschermfonts zouden kunnen overwegen de Basic Commercial in te zetten.</font></font></font></font></font>'
