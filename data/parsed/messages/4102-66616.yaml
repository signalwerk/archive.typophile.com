    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Mr. Ohnesorg. My phrase &#39;scurrilous and wrong&#39; referred to your accusations against Mr. Phinney, not to your claim of a &#34;SOURCE CODE requirement&#34; for  fonts.  <BR> <BR>Your &#39;source requirement&#39; seems to me just wrong as far as the current state of the law. I confess I know little about this whole matter, but I do know that the law is determined not by any person&#39;s theories about it, but rather by what legislators enact and judges rule in interpretation of the law. You do not seem to grasp that whatever the logic or illogic of your argument, it is not the law unless a court agrees with it.  <BR> <BR>Currently Judge Whyte seems to have the last word, and he doesn&#39;t agree with you. So for your argument to become law in the US you would have to convince another court in the US that you are right, and Judge Whyte wrong.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
