    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">On Sunday, March 06, 2005 6:59 am Wilhelm Ohnesorg posted the following sentence: <BR>�It seems that nobody of the 8,000 odd members of this forum knows anything about Morris Fuller Benton.  <BR>So, I had better ask professionals instead of the laymen of this Typophile forum�.  <BR>Wilhelm Ohnesorg.  <BR> <BR>I did conclude that you had the impression that the 8000 members of this Typophile forum were laymen. <BR>I replied on Sunday, March 06, 2005 - 2:49 pm    <BR>�Thank you for being polite!  <BR>Perhaps this helps to understand Morris Fuller Benton and Akzidenz Grotesk better. <BR>From: �Revival of the fittest�  <BR>Published by Print Magazine Publications England ISBN 1-883915-08-2  <BR>Franklin Gothic chapter by Ansel M. Olson  Quote 1 on page 106::  <BR>�Designed and released in the period 1902-1912, Franklin Gothic was one of over 200 typefaces designed by Morris Fuller Benton and produced by ATF. The creation of this new sans serif, intended to compete with the 19th-century European sans serifs &#40;e.g., Akzidenz Grotesk&#41; was one of Morrris Benton�s first tasks at ATF. The result was a dramatic success. Franklin Gothic sold well immediately following its release, and continues to be popular today.�  <BR>Quote 2 on page 107:  <BR>�Franklin Gothics success was so great that ATF quickly licensed it to the major manufacturers of mechanical typesetting machines &#40;Monotype and Linotype&#41; to prevent it from being copied.�  <BR> <BR>Info via one of the laymen!  <BR>Henk <BR> <BR>So my reply was mainly a long quote from a well known typographic book. <BR>My own contributions were just 3 lines of text  <BR>�Thank you for being polite� <BR>�Perhaps this helps to understand Morris Fuller Benton and Akzidenz Grotesk better�. <BR>and <BR>�Info via one of the laymen�. <BR> <BR>Wilhelm Ohnesorg writes: Saturday, March 12, 2005 - 12:00 am: <BR>�On march 6th, Mr. Henk Gianotten pretending to be &#34;one of the laymen&#34; wrote a misleading story in order to lead astray the readers of this forum thread. <BR> <BR>Can you explain what I pretended in the March 6 contribution? <BR>Can you describe what part of that �three line story� on March 6 is misleading? <BR>The first link between the 8000 Typophile forum members and laymen was made by you, <BR>I think.  <BR>Was that misleading or perhaps an attempt to be funny? <BR>Henk</font></font></font>'
