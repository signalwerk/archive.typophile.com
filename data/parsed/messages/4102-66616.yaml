    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">It seems to me that you have some difficulties in reading. Or in believing what Bruno Steinert wrote. <BR>The introduction of the name was an editing mistake. <BR>In my earlier contribution I tried to explain that this link must have been a mistake. Morris Fuller Benton wanted to compete with &#34;German Grotesks&#34; such as Akzidenz Grotesk. <BR>That editing mistake was fixed by Linotype immediately. It just took some days instead of the 5 years you mention. There are 5 years between the introduction of the Basic Commercial &#40;since 2000 also part of the LT Gold Edition; so many users have these faces on their computer!&#41; and this incorrect reference to Morris Fuller Benton. <BR>That&#39;s all. <BR>Henk <BR>&#40;before you start to question: Yes I am proud to co-operate with font foundries such as Linotype. And I am proud that Linotype introduced the Gianotten!&#41;</font></font></font></font></font></font></font></font></font></font>'
