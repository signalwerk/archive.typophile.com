    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Wilhelm, <BR> <BR>Not sure if it&#39;s your gif rendering of the fonts, but when I compare the two fonts in Photoshop there&#39;s minute differences.  So they&#39;re not exactly the same, but like I said, it might be due to the gif image.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 95477
    user: bruno-steinert-users
    date: 2005-03-07T12:39:00
    date_raw: Monday, March 07, 2005 - 12:39 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">If you intend to obfuscate the legal situation on fonts, simply mingle trademark rights, design copyrights and data copyrights. <BR> <BR>Statement: <BR> <BR> Linotype formerly offered typeface fonts under the name &#34;Akzidenz-Grotesk&#34; under license from H. Berthold AG.  Linotype discontinued sale of those typeface fonts in approximately 2000. &#34;Akzidenz-Grotesk&#34; is offered by Berthold Types Limited of Chicago, Illinois.  &#34;Akzidenz-Grotesk&#34; is a registered trademark of Berthold Types Limited. <BR> <BR>&#34;Basic Commercial&#34; is in the style of H. Berthold A.G.�s &#34;Akzidenz-Grotesk&#34; typeface fonts. &#34;Akzidenz-Grotesk&#34; is a registered trademark of Berthold Types Limited. <BR> <BR>Linotype offers &#34;Basic Commercial&#34; typeface fonts. <BR> <BR>Facts: <BR> <BR>Since the 1950ies, Linotype sold its own design adaptions of some weights of &#34;Akzidenz Grotesk� as matrices for Linotype typesetting machines. &#34;Akzidenz-Grotesk&#34; is a registered trademark of Berthold Types Limited. <BR> <BR>Over the years, Linotype created phototypesetting versions and digital fonts of these typefaces. <BR> <BR>In 1989, Adobe licensed Linotype�s version of �Akzidenz Grotesk� from Linotype as Type 1 fonts. <BR> <BR>In 1990, Adobe licensed, together with more H. Berthold AG fonts, �Berthold Akzidenz Grotesk�, from H. Berthold AG. <BR> <BR>H. Berthold AG went bankrupt in 1993 and ceased to exist forever. <BR> <BR>In 2000, Berthold Types Ltd. obtained trademark registration for �Akzidenz Grotesk�.  <BR>The same year, Linotype started to sell �Basic Commercial�. <BR> <BR>�Berthold Akzidenz Grotesk� is not identical to �Basic Commercial�. But if one compares older Linotype outline data with newer Linotype outline data, there might be very close similarities. <BR> <BR>Morris Fuller Benton has nothing to do with �Basic Commercial� or �Akzidenz Grotesk�. Akzidenz-Grotesk is a registered trademark of Berthold Types Limited. <BR> <BR>His name was introduced by an editing mistake. This is embarrassing but it happened and it was fixed immediately. <BR> <BR>About me: <BR> <BR>I am the managing director of Linotype Library GmbH, responsible for this company and the team behind it. <BR> <BR>I am not personally editing copyright notices in fonts. <BR>I am not personally copy writing for LinoLetter. <BR>I am not forging fonts. <BR>I am not a criminal, nor is anyone criminal in my team. <BR> <BR>Linotype has never done anything criminal. I am proud of this company. <BR> <BR>In most jurisdictions, personal defamation is a crime. Especially if it is done under a bogus identity. <BR> <BR>I could not find the name Ohnesorg at the Leipzig telephone directory. Wilhelm Ohnesorg was &#34;Reichspostminister&#34; in Germany until 1945.  <BR> <BR>My question is: Who benefits from this discussion? <BR> <BR>This was my first and last contribution to this thread, I go back to work. <BR> <BR>Bruno Steinert</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
