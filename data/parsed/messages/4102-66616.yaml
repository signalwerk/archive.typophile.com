    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">My Dear Brethren, <BR> <BR>Don&#39;t worry! Blessed are the eyes which see the things that ye see! <BR> <BR>Have faith in the &#34;truth&#34; told by your master who graciously sponsors this peaceful site &#40;&#34;Hosting graciously paid for by Linotype&#34;&#41;. <BR> <BR>Today, my dear brethren, I have to tell you a sad story: Your master has been recently sued by this evil hunter Harvey Hunt, who runs this bad bad Berthold company. <BR> <BR>That&#39;s why your master had to repeat the evil sentence <BR> <BR>&#34;Akzidenz-Grotesk&#34; is a registered trademark of Berthold Types Limited. <BR> <BR>FOUR TIMES in his &#34;confession&#34;. <BR> <BR>Now, my dear brethren, have a look at this lovely picture &#34;2004 vs. 2005&#34; attached below. <BR> <BR>This comparison shows that your master has concocted a new &#34;truth&#34; for his fairy-tale recently. <BR>The &#34;Morris Fuller Benton&#34; yarn is part of this tale invented to take gullible suckers for a ride. <BR> <BR>Your master told you: &#34;It was fixed immediately&#34;. <BR> <BR>This innocent word &#34;immediately&#34; means &#34;fives year later&#34; for your storyteller and master. <BR> <BR>But don&#39;t worry! Blessed are the eyes which see the things that ye see! <BR> <BR>Cheers, <BR> <BR>Your &#34;Don&#39;t worry&#34; <BR>Euer &#34;Ohne Sorg&#34; <BR><img src="http://www.typophile.com/forums/messages/4102/66826.gif" alt="2004 vs. 2005"></font></font></font></font></font></font></font></font></font></font></font>'
