    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">It looks like I&#39;m in the minority but I&#39;m not wild for the rubik&#39;s cube/electric plugs logo mark. As others mentioned it seems to convey pre-fab more than quality construction. And the QC connection in the mark is strongest where the leters interlock which also looks confusing because then one of the letters is on it&#39;s side. Not until I started typing this did I see the right reading QC relationship. But because one&#39;s eye is drawn to the tension of the interlock, it&#39;s harder to see the QC next to each other. &#40;I hope I explained that clearly.&#41; <BR> <BR>Since you are planning on showing three concepts to your client, I suggest re-visiting your first logo. I liked the simplicity of the form &#40;but not the rounded font you selected&#41; and the centers made me think of screwdrivers. Which in turn makes me think of fine hand craftsmanship. In reality hand tools are probably so infrequently used in construction these days but I think the symbolism is timeless. <BR> <BR>I&#39;m attaching a down and dirty sketch. My thoughts were that the mark should look built and organic at the same time. My version may have too much of a ying/yang feel to convey German Craftsmanship. I just wanted to illustrate that your initial sketch has other possibilities. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/55112.jpg" alt="QC logo test"> <BR> <BR>I also like the basketweave line that you incorporated onto the business card, but I don&#39;t like it with the cube logo. Perhaps it should be used on it&#39;s own with a clean type treatment. <BR> <BR>Keep posting.</font></font></font></font></font></font>
