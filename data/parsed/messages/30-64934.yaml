  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">firstly pardon my english... <BR> <BR>I have been making fonts for 5 years. Two years ago I thought I was ready to sell them... two years later after endless kerning pairs and tweaks I am almost ready. So as I&#39;m building the site to sell them I&#39;ve come across a few questions...  <BR> <BR>As much we love type, even make them ourselves, and love to look at them... <BR> <BR>1.Does anyone regularly buy fonts?  <BR> <BR>2.How does anyone feel about the font prices? <BR> <BR>3.How many times did you need accent characters/special and they where not there? or made due <BR> <BR>4.How interested are you in non traditional but nice looking font design? ie the font &#34;enabler&#34; <BR> <BR>5.Anyone have experience selling fonts through a font house or sell them yourself? if so how was it <BR> <BR>Also any advise you can give would hugely appreciated? <BR>modestly thanx</font></font></font>
comments:
  - id: 92716
    user: 108
