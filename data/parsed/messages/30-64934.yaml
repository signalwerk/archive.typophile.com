    date_raw: Tuesday, February 08, 2005 - 1:36 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; 1.Does anyone regularly buy fonts? <BR> <BR>I have a nasty font licensing habit that I&#39;m doing my best to curb right now. <BR> <BR>&#62; 2.How does anyone feel about the font prices? <BR> <BR>The foundries from which I have licensed have fair pricing: Emigre, Font Bureau, FontShop, Hoefler&amp;Frere-Jones, Underware, House Industries .. all reasonable for the quality and customer service offered. I also use MyFonts which has again, I think, fair pricing for those foundries whom they represent. <BR> <BR>&#62; 3.How many times did you need accent characters/special and they where &#62; not there? or made due <BR> <BR>I&#39;ve become spoiled by full character sets. I really think you limit yourself by not including as many as you can. <BR> <BR>&#62; 4.How interested are you in non traditional but nice looking font &#62; design? ie the font &#34;enabler&#34; <BR> <BR>I&#39;m not sure I follow this question. <BR> <BR>&#62; 5.Anyone have experience selling fonts through a font house or sell &#62; them yourself? if so how was it <BR> <BR>I don&#39;t, but I think it will come down to how much time do you have to do your own marketing?</font></font>'
