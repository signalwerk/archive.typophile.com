  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi, <BR> <BR>I am new to this forum, and have simple question for start. <BR> <BR>How can I instruct indesign to use locl feature to select serbian cirilic glyphs from open type font. Is it possible at all, and is there any software which I can use to get alternative serbian cyrilic glyphs directly typed from keyboard.  <BR> <BR>So far I have selected serbian cyrilic keyboard, but indesign seems not to understand that it is serbian cirilic, so I have to manualy insert alternate glyphs. <BR> <BR>thanks in advance <BR>robby</font></font></font></font></font></font></font></font>
