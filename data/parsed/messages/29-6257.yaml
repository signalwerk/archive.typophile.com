    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks for the crit, sorry I&#39;ve taken so long to reply, I&#39;ve been swamped with other work lately and Neu is just starting up. <BR> <BR>I&#39;ve attached a swf showing some of the variations we had been looking at. Most of them include rounded ends on the e. <BR><!--attachment: neu-7376.swf*attachment_icon.gif*application/x-shockwave-flash*4.1*neu+variants*neu%2eswf --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/attachment_icon.gif" align=left alt="application/x-shockwave-flash">neu variants<br><a href="http://www.typophile.com/forums/messages/29/neu-7376.swf" target="_blank"><b>neu.swf</b></a> (4.1 k)</td></tr></table></center><!--/attachment--> <BR> <BR>ole, I agree that most hosting companies logos are terrible, so I didn&#39;t feel like there has been to much of a precedent set for the industry. Also the company will be offering design services that are far superior to most hosting companies that just kind of throw that in. But perhaps this couldn&#39;t hurt to look more techy. <BR> <BR>The font is just good ol&#39; Gill, which I chose for its circular �o�. Any suggestions on a better typeface? <BR> <BR>oh, and here&#39;s a larger view of the pattern, which is part of the branding. <BR><img src="http://www.typophile.com/forums/messages/29/7377.gif" alt="neu tile"> <BR> <BR> <BR></font></font></font></font>'
