    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">here are some more excerpts to study.  <BR>hobo appears to be the unifying element,  <BR>although used somewhat inconsistantly.  <BR>it&#39;s used for every tab, some subheads,  <BR>some headlines, etc.  <BR><img src="http://www.typophile.com/forums/messages/29/4782.gif" alt="hobo2"> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/4783.gif" alt="hobo3"> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/4784.gif" alt="hobo4"></font></font></font></font>
  - id: 10934
    user: 1160
    date: 2003-01-28T14:50:00
    date_raw: Tuesday, January 28, 2003 - 2:50 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Stop! My eyes! My eyes! <BR> <BR>Bitstream needs to do the world a favor and stop  <BR>disctributing this for about a decade. Then when they  <BR>re-release it it will be the hottest thing since, well, since  <BR>Beesknees!</font></font></font></font>
  - id: 10935
    user: 1112
    date: 2003-01-28T14:56:00
    date_raw: Tuesday, January 28, 2003 - 2:56 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">When I was gearing up to do &#34;Behind the Typeface,&#34; Hobo was originally the star, before Cooper Black stole the show. I was surprised to learn how old a typeface Hobo was. It&#39;s been completely disconnected from its Nouveau roots. It could be such a worthwhile face, if used better.</font></font></font></font>
  - id: 10953
    user: 540
    date: 2003-01-28T17:43:00
    date_raw: Tuesday, January 28, 2003 - 5:43 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">i was surprised too. 1910. whoa. i was just a kid then. <BR>but aside from this being an obnoxious use of hobo <BR>&#40;redundant maybe, but...&#41;, i was curious about why <BR>the designer used it.  <BR> <BR>john hudson said: That word community is surely the <BR>key to the choice of typeface. This is a perfect use of Hobo <BR> <BR>but why? what kind of community can this be? <BR>not a pressing issue, i know, but it&#39;s something i&#39;m curious about. <BR>a &#34;psychology of type&#34; kind of thing.</font></font></font></font>'
  - id: 11074
    user: 1262
    date: 2003-01-29T00:11:00
    date_raw: Wednesday, January 29, 2003 - 12:11 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>but why? what kind of community can this be? </i> <BR> <BR>I think it is the idea that &#39;community&#39; is something made <i>by</i> people, not for people by, say, government agencies. You want people to think that &#39;Parks and Recreation&#39; are something that belongs to them, rather than something that has been planned for them by a Park&#39;s Board and a civic bureaucracy. So you use a typeface that looks vernacular, like something someone might have written by hand on the side of a lemonade stand. So you think &#39;Ah, old fashioned lemonade&#39; not &#39;I wonder if those kids have a license to sell lemonade, and are they collecting sales tax?&#39;</font></font></font></font>
  - id: 11083
    user: 923
    date: 2003-01-29T06:02:00
    date_raw: Wednesday, January 29, 2003 - 6:02 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Behind the Typeface! I would be so excited... <BR> <BR>It&#39;s growing on me... at first I was thinking &#40;especially after the &#34;what kind of community can this be&#34; question&#41;, that maybe Hobo felt kind of patronizing...you know, too &#34;just folks...&#34; <BR> <BR>after all, the idea here isn&#39;t to sell something but to serve another function... but I must ask myself, even if that&#39;s so, does it have to be straight-laced and sans-serify boring? <BR> <BR>but, god help me, it&#39;s kind of growing on me... must-stop-looking-at-it... must... resist... don&#39;t want to go to work and scream  &#34;Hobo! Hobo for everything!&#34;</font></font></font></font>
