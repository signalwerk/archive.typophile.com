  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">just thought i&#39;d share the little nugget i saw today in the phone book. and rainbow colors even!  <BR>  <BR><img src="http://www.typophile.com/forums/messages/29/4777.gif" alt="phone hobo"></font></font></font></font>
