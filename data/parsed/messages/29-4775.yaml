    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Aaaaaah! <BR> <BR>And here I thought it was only the local shoppers / classified papers still actively using Hobo these days... and those ad placemats, too.... Little League t-shirts... <BR> <BR>If it&#39;s good enough for the phone company, tho, well then by God...</font></font></font></font>
  - id: 10749
    user: 1262
    date: 2003-01-26T15:15:00
    date_raw: Sunday, January 26, 2003 - 3:15 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Note that this is the content listing for the <i>community</i> pages. That word community is surely the key to the choice of typeface. This is a perfect use of Hobo, a typeface that in my idiosyncratic classification scheme is categorised as <i>ersatz vernacular.</i></font></font></font></font>
  - id: 10751
    user: 540
    date: 2003-01-26T15:24:00
    date_raw: Sunday, January 26, 2003 - 3:24 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">i also thought it was interesting that it <BR>was the community section. is hobo really <BR>the perfect font to bridge the gap between <BR>&#34;zip codes&#34; and &#34;elected officials&#34;? &#40;perhaps <BR>the name fits for elected officials. i&#39;ve <BR>never heard of a font called dirty crook, <BR>so...&#41; i&#39;m very curious about your reasoning.</font></font></font></font>
