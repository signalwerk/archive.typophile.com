  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Are you legally entitled to use fonts that came with either your computer or purchased programs in a poster or book? <BR> <BR>For a book, who must own these? The designer or the publisher?</font></font>
comments:
  - id: 93072
    user: 1262
    date: 2005-02-10T18:40:00
    date_raw: Thursday, February 10, 2005 - 6:40 pm
    votes: null
    html: <font class="dontLookLikeCrap">Generally, the person typesetting the book and sending it to press must own a license for fonts used. Most font licenses -- including those that come bundled with software -- allow any use of the font that does not involve distribution. Some may allow embedding of the font, e.g. in a PDF going to pre-press, but may not allow embedding in an electronic book that will be distributed. If in doubt, read the font software license. If still in doubt, contact the font vendor.</font>
