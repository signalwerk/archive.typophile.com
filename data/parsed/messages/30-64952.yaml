    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Here are my Gates photos &#40;as promised&#41;. There are 10 of them, so if the Typophile Mods decide that&#39;s too many, it&#39;s cool. I haven&#39;t gotten them organized to put on my own server yet. <BR> <BR>We got out to the park later in the day, and missed the sunshine in the morning. The grey skies did help the orange, though. <BR> <BR><img src="http://www.typophile.com/forums/messages/30/65289.jpg" alt="Gates 1"> <BR><img src="http://www.typophile.com/forums/messages/30/65290.jpg" alt="Gates 2"> <BR><img src="http://www.typophile.com/forums/messages/30/65291.jpg" alt="Gates 3"> <BR><img src="http://www.typophile.com/forums/messages/30/65292.jpg" alt="Gates 4"> <BR><img src="http://www.typophile.com/forums/messages/30/65293.jpg" alt="Gates 5"> <BR><img src="http://www.typophile.com/forums/messages/30/65294.jpg" alt="Gates 6"> <BR><img src="http://www.typophile.com/forums/messages/30/65295.jpg" alt="Gates 7"> <BR><img src="http://www.typophile.com/forums/messages/30/65296.jpg" alt="Gates 8"> <BR><img src="http://www.typophile.com/forums/messages/30/65297.jpg" alt="Gates 9"> <BR><img src="http://www.typophile.com/forums/messages/30/65298.jpg" alt="Gates 10"></font></font></font></font></font></font></font></font></font></font>
