  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hello again <BR> <BR>Just came back from holidays and a lot of work is waiting.  <BR>One of them it is about a freelancer whose subject is &#34;space sculpting&#34;.  <BR>Actually she is making the work of an interior designer but she also  <BR>works for public places as squares and monuments.  <BR>So she is arranging the space in an artistic and functional way, let&#39;s say.  <BR> <BR>As you see I have two solutions.  <BR>In Aii the idea is to use the 5 colours you see and each time to apply one of them as a background colour of the media.  <BR>The sequence of the colours remains the same but the &#34;colour-bar&#34; moves as one of the colours becomes the same with background. <BR> <BR>I am looking forward to read your comments. <BR> <BR>christos <BR> <BR><img src="http://www.typophile.com/forums/messages/29/47305.gif" alt="space 1"> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/47306.gif" alt="space 2"></font></font></font></font>
