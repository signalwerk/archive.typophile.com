    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Dan. I think you are right about the choice of types. Gills work better, and sure the most conveying solution to the subject is the top left one.  <BR> <BR>Furthermore i see now that i should add this information to my introduction: The customer has a special system to approach the customer&#39;s needs. She is letting them making a wide variety of generic choices such as favorite colour, book, place etc. so then she can accustom her work depending on the character of the customer. The 2nd solution is inspired from this process &#40;maybe in a complicated way -so not suxessfuly&#41;. <BR> <BR>christos</font></font>'
