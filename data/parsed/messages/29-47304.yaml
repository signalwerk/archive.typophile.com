    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Your solutions on the top left convery the idea of space better than the other two. Top right looks like a graphic designer or web designer&#39;s identity. The bottom solutions talk more about architecture, engineering, or drafting &#40;but not so successfully, in my opinion&#41; <BR> <BR>In your top right designs, you use Gill Sans &#40;?&#41;. I think that this is a much better type treatment than the Helvetica in the top left. <BR> <BR>So, I&#39;d like to see the top left with Gill Sans, and more airyness or space somehow� that might take you in the best direction.</font></font></font>
