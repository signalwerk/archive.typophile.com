    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">What if you showed a steak instead of the live bull? Also, I&#39;m seeing more of a bull rather than a steer or heifer. Not sure if either of that matters.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 68999
    user: 4035
    date: 2004-07-26T08:06:00
    date_raw: Monday, July 26, 2004 - 8:06 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The logo will be applied to business cards, letterhead, magazine advertisements, and possibly a sign. <BR> <BR>darrel -- thank you for the suggestion -- i went with an image of the &#34;live bull&#34; because the cows are not always sold for the sole purpose of butchering &#40;in fact, most of the time they are not.&#41; <BR> <BR>do you think these logos are hitting the mark, or should i revisit more concepting? <BR> <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 69008
    user: 2236
    date: 2004-07-26T09:05:00
    date_raw: Monday, July 26, 2004 - 9:05 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think #2 and #4 have the most potential, but I agree that simplifying/clarifying the angus would make it much stronger. It looks like you&#39;re using a software effect�Are you? If so, try tracing a photo in illustrator and taking more control over the shapes to create more clarity. <BR> <BR>Personally, I would prefer to see the &#34;red angus&#34; type in #2 flipped to read right. <BR> <BR>Overall, I like these two concepts. The circular shape feels kind of like a cattle brand. Considering the applications, I think I like #4 best, with a few adjustments to color. <BR> <BR>Aloha! <BR>Scott</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 69009
    user: 4035
    date: 2004-07-26T09:14:00
    date_raw: Monday, July 26, 2004 - 9:14 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">the angus image is a rough illustration in illustrator -- since i am more in the concepting stage, it is pretty rough. although i do want to go with a more abstract, &#34;sketchy&#34; illustration similar to what i&#39;ve used, i agree it needs some work &amp; clarification. <BR> <BR>What do you mean, Scott, about the type in #2 flipped to read right? &#40;do you mean with the &#34;KAUTZ RED ANGUS&#34; to the right of the circle?&#41; <BR> <BR>Thanks again everyone for the input. <BR> <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
