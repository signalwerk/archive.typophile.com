    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Sally, <BR>The logos you have designed look nice, but they do have a food design feel to them and after reading other posts it seems like many of the people think the company sells steaks not livestock. Perhaps you should think more &#34;ranch&#34; than individual &#34;cow&#34;. Your design could show a few cows in a field, indicating breeding cow &#40;without going completely graphic&#41; rather than hamburger. Or not even show a cow, a branding iron, rope or fence sign are quick imagery that comes to mind when thinking ranch. Maybe it&#39;s something as simple as showing a whole cow to get rid of the food association, the severed head sort of leads one to think of butchery.</font></font></font>
