    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I like your first designs better.  <BR> <BR>The circle with K and bull on top of each other is far too complicated. It&#39;s like your telling two jokes at the same time. Which is better: a drawing of a bull, or a drawing of K defined by the negative spaces? I think the bull. But certainly not both on top of each other. <BR> <BR>The circle as it is now is not likely to be reproduced in small sizes, let alone in one colour &#40;where the rightmost part of the K would grow out of the shoulder&#41;. <BR> <BR>If you were to balance a circle next to KAUT and the subline, I would place the circle higher, sharing a horizontal axis with only KAUTZ, not with both lines, thus letting the subline &#39;hang&#39; underneath.  <BR> <BR>-- <BR>Soren O</font></font></font></font></font>'
