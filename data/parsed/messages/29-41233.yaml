    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">i know what you are saying about #2 and #4 -- it resembles a packaging seal, which is why the consumer-end comes to mind.  <BR> <BR>This is a logo more for a Ranch, a Red Angus breeder, than anything to do with the consumer-end. Although the cows bought may be butchered it is much different than buying beef in a grocery store. Does that make sense? <BR> <BR>Here is another idea . . . I took #1 and modified it a bit . . . should i explore this option more than the seal/stamp look? <BR> <BR>Thank you for the input! <BR> <BR><img src="http://www.typophile.com/forums/messages/29/41612.gif" alt=""></font></font></font></font></font></font>'
