    date_raw: Wednesday, July 21, 2004 - 12:00 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I don&#39;t think I like the &#34;K&#34; serif poking the angus in the eye, and I&#39;m not crazy about the angus hugging the &#34;K&#34; either�so I guess that leaves us with the No. 2 design. I don&#39;t like the italic type. What is the gray? Is it a tree? I&#39;d lose it. <BR> <BR>I think there is still some exploration to do here. I did some conceptualization for an identity that incorporated a rhino a while back. I lost the digital files due to a HD failure, but I might be able to dig up some sketches in the morning. They might spark something, or not. <BR> <BR>Aloha! <BR>Scott</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 68680
    user: 4004
    date: 2004-07-21T00:37:00
    date_raw: Wednesday, July 21, 2004 - 12:37 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The angus is one element. And the word Kautz is another. If they are side-by-side as in version 1 and 2, they shouldn&#39;t touch ... because the eye wants to see them as &#34;one thing and another thing&#34;, not &#34;one thingand another thing&#34; &#40;pardon my English&#41;. <BR> <BR>If they on the other hand are intertwined, it&#39;s okay ... but watch out for production difficulties. <BR> <BR>I think the &#39;tree&#39; must have to go. <BR> <BR>Beware that in version 1 and 2 there is too much space around A. <BR> <BR>In version 3, could you avoid &#34;cropping the angus with a scalpel&#34;? You may have to put the angus in a frame ... I haven&#39;t got any solution to this right now ... Maybe version 2 could be realized ... <BR> <BR>-- <BR>Soren O</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
