    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Sally: <BR> <BR>Completely ignore my previous comments. I was thinking &#39;beef&#39; sales the whole time. I just realized that your client sells breeding stock. I think you&#39;re on-target with the Bull. <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 69159
    user: 2915
    date: 2004-07-27T08:12:00
    date_raw: Tuesday, July 27, 2004 - 8:12 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Sally what I like about 2 and 4 is if you used metalic stamp for the gold color it would look very upscale and classy. I&#39;m guessing that this product is expensive, like Kobi beef in Japan</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 69172
    user: 2923
    date: 2004-07-27T09:02:00
    date_raw: Tuesday, July 27, 2004 - 9:02 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Sally - I like where you are going - the illustration is better in these second rounds - but I think you may also try something a little more removed from such a literal illustration  you run the risk of it looking clip arty. <BR> <BR>Something with clean lines that would work well in single color - &#40;the merril lynch logo comes to mind for obvious reasons&#41; but what about a hoofprint or something with just the horns cradling the type?  <BR> <BR>I can totally empathize with you - I do design work for a supplier to the dairy industry. Udder dip, mating supplies and bull um... well lets just say essence... and there is so much cow imagry in marketing pieces and ads and so forth that a mark that is distilled down to a quicky symbol may play stronger than a more illustrative approach. Just a thought -  <BR> <BR>having said that so far I like #2, but agree with Scott about flipping the type right side up at the bottom - perhaps also think of using that seal without an enclosure around the type.</font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
