  html: <font class="dontLookLikeCrap">Dalton Maag launches a new website. As before the exclusive Dalton Maag fonts can be bought on-line but now many of them can be purchased as individual weights. In addition, fonts from the Linotype Library can be purchased from the Dalton Maag website. <BR> <BR>At the same time Dalton Maag launches a unique new service, Synopsis. <BR>Synopsis is for every type user; to completely simplify the selection of the right type for a project, a godsend when time is precious; to help with all licensing issues and to typographically enhance fonts for print and screen display. <BR> <BR>With over 10 years of experience working with corporate clients, Dalton Maag understands the needs and requirements of these environments. <BR> <BR><a href="http://www.daltonmaag.com/" target="_blank">http://www.daltonmaag.com/</a> <BR> <BR>Dalton Maag Ltd <BR>London, March 2005</font>
