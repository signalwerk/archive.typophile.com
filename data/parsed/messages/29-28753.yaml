  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This is my first post, and first typeface.  <BR> <BR>I&#39;m still mid-process, but see the design fracturing into a few different directions and was hoping I could get some feedback about which characters are the most successful at this point, so I can use those as models to finish out the face. <BR> <BR>Thanks in advance for your advice. <BR> <BR><a href="http://www.iixii.net/type/">Sample here</a></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
