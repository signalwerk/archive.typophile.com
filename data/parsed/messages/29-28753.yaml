    html: <font class="dontLookLikeCrap">Thanks for the praise, after a week away from it I&#39;m starting to see a clearer conclusion to this one. <BR> <BR>Anyway, assuming that I am able to successfully finish it as a PSD, do you know of any foundries that work with pixel fonts that are semi-anti-aliased such as this one? </font>
