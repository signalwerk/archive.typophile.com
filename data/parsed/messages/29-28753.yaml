    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Sure, does this work? <BR> <BR>Thanks for taking a look. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/28812.gif" alt="type sample"></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 52375
