    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I prefer the first version, it&#39;s not so wishy-washy � sorry for the technical term! <BR> <BR>However, I&#39;ve always thought that art from Thailand was characterised by amazing curves and colour. A font with rounded shapes and sharp corners may be more sensitive to the subject matter. <BR> <BR>The navy blue could be replaced with one of the brighter colours from the image &#40;eg. a yellow or pink&#41;. <BR> <BR>Cheers <BR> <BR>Dan</font></font></font></font></font></font>
  - id: 71579
    user: 3089
    date: 2004-08-14T09:14:00
    date_raw: Saturday, August 14, 2004 - 9:14 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks, Daniel <BR> <BR>I was thinking about this last night, and I finally came up with some ideas to improve it, I think &#40;starting from the first version but insetting the art and adding some rules&#41;.  <BR> <BR>Regarding the rounded fonts, I wanted to avoid the curvy look you see at Thai restaurants, which I think is kind of a cliche. My feedback at the museum is that this font does -- strangely -- evoke a bit of Thai quality. <BR> <BR>Tom</font></font></font></font></font>
  - id: 71581
    user: 2915
    date: 2004-08-14T09:32:00
    date_raw: Saturday, August 14, 2004 - 9:32 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Tom a couple of ideas: 1. Try making the color image smaller and offset it a bit asemtrical. Create some tension don&#39;t justify everything it looks like a text book. 2. Think matt/gloss use an aquious coating and then print a matt varnish leaving only the color image glossy. 3. Make the image smaller and instead of a solid background use a ghosted version of the color image full bleed in one color. 4. If you have it in your budjet, think in terms of embossing or stamping.</font></font></font></font>'
