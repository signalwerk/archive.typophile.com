  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Our type tutor said that the traps used on bell centennial were modelled after the shape of the crimping of the glass on cathode ray tubes. I thought the shapes were arbitrary. Were they, to anyone&#39;s knowledge, modelled after anything or nothing? thanky sai.</font></font></font></font></font></font></font>
comments:
  - id: 22921
    user: 1215
    date: 2003-07-16T04:32:00
    date_raw: Wednesday, July 16, 2003 - 4:32 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Kris -- <BR> <BR>I&#39;ve never heard this explanation. It sounds suspicious to me. <BR> <BR>The creation of Bell Centennial was made necessary because of the switch from hot-metal Linotype to Cathode Ray Tube technology. The traps were introduced to compensate for effects of CRT exposure and ink spread on cheap paper. The early CRT technology was basically like bitmaps; there was no such thing as smooth, device-independent outlines. Matthew drew the letterforms for Bell Centennial, laboriously, on quadrille &#40;graph&#41; paper. Any given notch might be comprised of maybe 8 or 10 &#34;pixels&#34; -- not really enough resolution to model them after much of anything. <BR> <BR>I can&#39;t say definitively that they weren&#39;t modelled after glass crimps, but I find it doubtful. <BR> <BR>-- K.</font></font></font></font></font></font></font>
  - id: 22936
    user: 1250
