  html: '<font class="dontLookLikeCrap"><!--attachment: KUB-39037.swf*attachment_icon.gif*application/x-shockwave-flash*30.1**KUB%2eswf --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/attachment_icon.gif" align=left alt="application/x-shockwave-flash"><br><a href="http://www.typophile.com/forums/messages/29/KUB-39037.swf" target="_blank"><b>KUB.swf</b></a> (30.1 k)</td></tr></table></center><!--/attachment--> <BR>Kub was initially design to be a 3D typeface &#40;as a sculpture&#41;. <BR> <BR>Now a font, the actual suitcase contains a Regular, light, midtone and shadow version, the best result is achieved when the fonts are layered on each other in varied tonal value to create a single 3D typeface.  <BR> <BR>AF Kub is part of the ACME font library <a href="http://www.acmefonts.net/" target="_blank">www.acmefonts.net/</a> and is available to buy at Fontworks <a href="http://www.type.co.uk" target="_blank">www.type.co.uk</a> <BR> <BR>&#40;Right click and zoom in&#41; <BR></font>'
