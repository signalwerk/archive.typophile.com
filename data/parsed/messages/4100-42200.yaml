    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I am looking for a list like this: <BR> <BR>Helvetica CE &#40;Linotype&#41; - correct diacritics for Czech, Slovak and Croatian languages <BR>Adobe Garamond Pro - correct diacritics for Czech, Slovak, Hunagarian and Slovenian languages <BR>Meta Plus CE &#40;FF&#41; - correct diacritics for Polish and Lithuanian languages</font></font></font></font>'
