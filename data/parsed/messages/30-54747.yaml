    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hopefully I can answer some of the points raised in this discussion and give Alison some information for her project. <BR>	Q. Why design it in the first place?  <BR>A. In the days of metal typesetting many desirable designs were from foreign foundries, cost of importing was considerable, and in some cases type founts had to be planed down from European height of .928 inch to our .918 inch.and although adsetters could afford to pay the much higher prices, the average British printer could not.  <BR>Hence the need for a home-grown product. Efforts were made to get �as much ink on paper as possible� in a given size with the maximum possible x-height.  <BR>If Alison would let me know her e-mail address I can send her pdfs of one of Ken Dickinson�s early advertising leaflets which will explain a lot. It includes comparison with nine similar typefaces including Helvetica Inserat. <BR> <BR>Dan Reynolds. <BR>See above re comparisons. <BR>I do have four of my own faces on MyFonts.com, Camden and italic, and Impact Wide and italic, they carry little explanatory notes. When I designed the latter two I took the opportunity to restore some features of the original metal, such as alternative characters and bevelled i and j dots. <BR>The question of what happened to Stephenson Blake copyright is mentioned later. <BR> <BR>Geraintf. <BR>You have provided some very useful site addresses, the McGill University website matter is mentioned later in this comment. <BR> <BR>Eriks. <BR>Absolutely delighted that my friend Erik remembered those details. The company name was GL Typographics Limited, this was after Pembertons. The business progressed steadily and after six years I sold the business to Diagraphic Typesetters and moved in with them as Technical Director. A job that was very satisfying until I retired in 1991.  <BR>I was very active in the Society of Typographic Designers, but the Typographic Circle is unlikely to have any info as I never got round to joining, although I admired its work. <BR> <BR> <BR>Michael zeetree. <BR>I look in my eighties and feel in my nineties, but am <BR>really only 75! I wonder how you found my e-mail address. <BR> <BR>Copyright and Trade marks. <BR>A very complex issue and I can only give my layman�s view. <BR>In 1965, having finished the type patterns etc I transferred the copyright of Impact to Stephenson Blake Ltd for a few pounds. This covered metal type, photosetting &#40;analogue&#41; and transfer lettering. <BR>	Subsequently SB licensed the design to the Amsterdam Foundry for metal and <BR>obviously to Monotype and others for film composition.  <BR>In 1996 The Type Museum London bought SB�s matrices, copyrights and other <BR>material. &#40;Letter to me from T J Blake&#41;. In the same way that the material of Monotype�s splendid history was transferred. I imagine that Monotype�s rights are now subsumed within the Type Museum�s. <BR>The fact that URW claims 1965 copyright I simply do not understand. <BR> <BR> <BR>Steve Jackman &#40;International Typefounders&#41; and Stephen Zapf-von Hesse. <BR>In this apparent dispute listed by Geraint, they are both correct. <BR>Stephen is correct about the Type Museum�s rights, however some SB faces <BR>have been licensed to ITF collections, as sufficiently high quality source material <BR>can be sorted. In discussions in I had in 2003 with Sir Piers Rodgers of the Type  <BR>Museum and Steve Jackaman it was agreed that the next package to be licensed would <BR>include the original Impact, and that I should license Impact Wide and Impact <BR>Wide italic to ITF in parallel. <BR>	In practice the Impact Wide business became rather complex and <BR>unfortunately coincided with my illness becoming rather serious. <BR>&#40;I am now connected to an Oxygen machine 24 hours a day&#41;. I therefore <BR>opted out of this deal and also negotiations elsewhere to produce my <BR>typefaces in Mac format. <BR> <BR>Sorry this contribution is so long, but lots to comment on.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
