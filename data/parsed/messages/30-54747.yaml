    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">You can now see for yourself why Stephenson Blake cut Impact. It is quite different and so good.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 85835
    user: 1250
    date: 2004-12-10T10:10:00
    date_raw: Friday, December 10, 2004 - 10:10 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Cool stuff, thanks! <BR> <BR>BTW, it&#39;s really nice how the hyphen can be flipped depending on if it&#39;s for lc or UC use. And the colon can be filed to become a bullet/midpoint! And the alternate &#34;r&#34;&#42; and &#34;J&#34; are just brilliant. BTW, did you notice the slight flaring at the ends of strokes? Most notable in the &#34;t&#34;. Lost in the digital version. :-&#40;  Time for a full revival? Somebody should do with Geoffrey what House does with Benguiat. <BR> <BR>&#42; And from now on if somebody complains about the &#34;r&#34; in Mana I&#39;ll tell them S&amp;B thought that shape has &#34;warmth and character&#34;.  :-&#41; <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 85863
    user: 5318
    date: 2004-12-10T13:14:00
    date_raw: Friday, December 10, 2004 - 1:14 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">A question: What does mean the words under the sample text, e.g. 32 A, 65 a, etc.?</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 85865
    user: 1042
    date: 2004-12-10T13:31:00
    date_raw: Friday, December 10, 2004 - 1:31 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>What does mean the words under the sample text, e.g. 32 A, 65 a</i> <BR> <BR>That is the amount of characters per set of one minimum, the smallest amount of type you could buy. The foundries had a list against which you could check how many of each letters would be contained. If there were 7 l/c a, there would have been 10 or so e, 5 s, etc. For international sales, these combinations were different, as languages have different frequencies for each character. <BR> <BR>I must admit that I cannot remember the name of that font listing; in German it was called a <i>Gie�zettel</i>, or founding note.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 86024
    user: gyl-users
    date: 2004-12-12T07:41:00
    date_raw: Sunday, December 12, 2004 - 7:41 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Eric. <BR>Rudolf Hostettler�s book translates Gie�zettel as fount-list, I also remember it as fount synopsis. <BR>Legros and Grant say Bill of fount or Fount scheme and show 16 character tables!. <BR> <BR>hrant. <BR>Sorry for delay in answering Post 7524. The final weight and shape of the Impact alphabet was <BR>crystallised by Autumn 1963. The popular paste-up use of Haettenschweiler caps was from  <BR>the mid-sixties, but the face could have been in existence for decades for all I know. <BR> <BR>Geraintf. <BR>Your �handglove� examples and the leaflet PDFs are much appreciated. I hope the following attempt at illustration works as well. <BR> <BR>General notes. <BR> Today it may appear that from Summer 1963 to Spxxxxxx is a long gestation for a simple typeface <BR>and some process detail may explain. The Letraset sheet below was from black ink drawings  <BR>about 40mm deep finalised after many trials as shown with my comments. These drawings were not  <BR>of use to the Foundry, so the next stage was to project each character up to 7 inches deep on the flat-topped letters. The projections were traced down on to card &#40;see the incomplete � sign&#41; and for the first few batches these patterns were cut out and sent to Stephenson Blake. Later on the cutting was done by the foundry from my drawings in 6H pencil.  <BR> <BR>These card patterns were then pantographed to produce a master metal pattern which in turn produced master type in each size. Although Impact size range was not large, this still required the growing, justifying, and preparing for the casting box of 616 separate matrices. The final stage was <BR>the casting, dressing and sorting into founts for sale and preparing sales literature. For a foundry <BR>busy with everyday business the production time was very good. Incidentally the price in 1965 of <BR>a 60 point 3A 6a fount was �11.16s and 11d. <BR> <BR>So I have had the luxury of metal type production by drawing, photography, and pantograph, <BR>and digital typefaces through the computer. It leaves me with intense respect and admiration <BR>for earlier generations of type-makers� skill and dedication. Hopefully many of today�s type designers are aware that many of their their predecessors had to carve, in steel, a punch for every character in every size of type. Subsequently these punches were struck into brass blocks to make the matrix. <BR> <BR>Congratulations if you are still awake. <BR> <BR> <BR><img src="http://www.typophile.com/forums/messages/30/55787.jpg" alt="Letraset Impact"> <BR> <BR><img src="http://www.typophile.com/forums/messages/30/55788.jpg" alt="Pasteup"> <BR> <BR><img src="http://www.typophile.com/forums/messages/30/55789.jpg" alt="� pattern"></font></font></font></font></font></font></font></font></font></font>
  - id: 86028
    user: gyl-users
    date: 2004-12-12T07:48:00
    date_raw: Sunday, December 12, 2004 - 7:48 am
