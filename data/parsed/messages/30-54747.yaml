    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I don&#39;t have any info, but I&#39;m curious as to why you chose &#34;Impact.&#34; Do you have a special attatchment to the design? It isn&#39;t exactly the &#34;favorite&#34; of many posters here. <BR> <BR>Here is what little I know about the font &amp; it&#39;s design. <BR>Both the Linotype and Veer website say that the design is very similar to Helvetica Inserat. <BR> <BR>MyFonts said that he designed another font recently, named Camden &#40;<a href="http://www.myfonts.com/fonts/geoffreylee/camden/familytree.html" target="_blank">http://www.myfonts.com/fonts/geoffreylee/camden/familytree.html</a>&#41;, and that he is now retired. <BR> <BR>He used to work in advertising &#40;also from MyFonts, <a href="http://www.myfonts.com/person/lee/geoffrey/y/" target="_blank">http://www.myfonts.com/person/lee/geoffrey/y/</a>&#41;, and Impact was released by Stephenson Blake. <BR> <BR>I don&#39;t know what has happend to Stephenson Blake. Did anyone buy it? &#40;Monotype Imaging has the rights to all of the old typefaces, I think&#41;</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
