nts/stephensonblake/impact/familytree.html" target="_blank">http://www.myfonts.com/fonts/stephensonblake/impact/familytree.html</a> <BR><a href="http://www.microsoft.com/typography/fonts/font.aspx?FID=7&amp;FNAME=Impact" target="_blank">http://www.microsoft.com/typography/fonts/font.aspx?FID=7&amp;FNAME=Impact</a> <BR> <BR>Stephenson Blake context: <a href="http://cgm.cs.mcgill.ca/~luc/stephensonblake.txt" target="_blank">http://cgm.cs.mcgill.ca/~luc/stephensonblake.txt</a> <BR> <BR>good luck</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
