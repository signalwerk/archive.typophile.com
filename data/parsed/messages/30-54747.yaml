    date_raw: Friday, December 31, 2004 - 11:59 am
    votes: null
    html: <font class="dontLookLikeCrap"><i>To what am I supposed to have paid attention?</i> <BR> <BR>Actually, I was saying that you <i>did</i> pay attention in the way you were quoting. It was Hrant who wasn&#39;t.</font>
