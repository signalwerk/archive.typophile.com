    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">General. <BR>Sorry for delayed response, due to illness. Because of it the following item is of  <BR>academic interest only. <BR> <BR>Hrant 7563 and Geraintf 192. <BR>Your <i>�House�</i> suggestion is flattering but am not in the same league as Ed Benguiat. <BR>I have only the four existing Truetype faces on offer and am happy with Myfonts.com. <BR> <BR>Impact �revival�. <BR>The interest of real typophiles such as yourselves in the subtlety of type design <BR>is much appreciated but you are a minority in the marketplace. <BR> <BR>It seems to me that Impact is hardly a face of distinction justifying a revamp  <BR>say <i>� la Palatino</i>. <BR> <BR>Microsoft Impact Open font is so widely available within their programs that it would be hard to <BR>compete, although I would like to change their Euro symbol! <BR> <BR>There might be problems with the name trademark, an updated version would <BR>be difficult to sell with a different name. <BR> <BR>Speter 174. <BR>Find this slightly patronising and puzzling.  <BR>To what am I supposed to have paid attention?</font></font>
  - id: 87950
    user: 2663
