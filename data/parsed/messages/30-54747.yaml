    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">many thanks for your reply, mr lee. it&#39;s great to have you here. <BR> <BR>you mention  the need for a &#39;home grown product&#39;. but surely, even in the 60s, stephenson blake&#39;s catalogue would have been full of british, late C19 / early C20 condensed grots, some of them highly condensed. <BR> <BR>were these old grots still manufactured by then? or was there a feeling that these faces were too out-dated/irregular/inconsistant/&#39;pre-modern&#39; for display/advertising, and needed updating? &#40;perhaps, after looking at akzidenz grotesk, haas produced helvetica for the same reasons..&#41;  <BR> <BR>how aware, do you think, british foundries / type designers in the 60s were of recent continental sans &#40;helvetica, univers, folio, eurostyle et al&#41;... i would be very interested to hear your perspective on this. i suppose the context eludes me...please forgive the questions. <BR> <BR>by the way, please feel free to post your pdf on this forum. &#40;this can be done by clicking on &#39;upload attachment&#39;, and following the instructions&#41;. otherwise, i&#39;d be grateful if you could cc me a copy at geraintfranklin_at_yahoo_dot_co_dot_uk <BR> <BR> <BR>best regards <BR> <BR>geraint</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 85380
    user: gyl-users
    date: 2004-12-07T09:48:00
    date_raw: Tuesday, December 07, 2004 - 9:48 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">hrant. <BR>Thanks for your comment. <BR>Haettenschweiler � presumably you are referring to the Microsoft site listed by Geraintf. <BR>      I remember that period well, when many of us admired the vitality and colour of what we knew only as Schmalfette, and used it by old-fashioned cut and paste. Use was limited as it was never made in metal as far as I know, and existed then in capitals and numerals only. <BR>      Later someone added &#40;or found&#41; a lowercase for its new existence. I personally find the style lacks the attractive feel of the caps. <BR> <BR>Geraintf. <BR>Firstly will you confirm your e-mail address, as the leaflet stuff has been sent twice and rejected. <BR>      Availability. Yes, other condensed sans were available. They included Grotesque 9, Condensed Sans 6 and 7 from SB, and Grotesque 33, Grotesque Bold Condensed 166 and the excellent Placard 515 from Monotype. Most adsetters offered ranges such as ATF�s superb Franklin Gothic family. However the Victorian Grots were looking dated and people do like a change. <BR> <BR>      Awareness. British foundries were aware of continental designs, but the great qualities and availability of Monotype had probably reduced the economic strength of the two remaining �cold metal� firms. Type designers as such were few and far between in1965. Apart from Monotype�s staff designers, they and SB commissioned outside people as they saw a need. I myself have never been more than an amateur part-timer.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
