    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The only thing that looks off to me is the ear on the top of the lowercase &#34;w&#34;. :-&#41; <BR>From the original, it looks like the ear hits the vertical at an angle instead of curved like how you have it.  <BR> <BR>I can&#39;t tell from the original if it&#39;s like this, but you may want to round the ends of all of the skinny strokes.</font></font></font></font></font>
