  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">hey folks! mass upheavals in the workplace yesterday but fortunately i still have a job. anyhow we&#39;re trying to redefine our image, if you want more history check out my thead here <BR><a href="http://www.typophile.com/forums/messages/4100/25479.html?1076707538" target="_blank">http://www.typophile.com/forums/messages/4100/25479.html?1076707538</a> <BR>Long story short, we&#39;re taking our nameplate back to the original it was in 1897, i digitized it and here&#39;s a comparison. <BR><!--attachment: Comparison-26544.pdf*mime_pdf.gif*application/pdf*117.2**Comparison%2ePDF --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align=left alt="application/pdf"><br><a href="http://www.typophile.com/forums/messages/29/Comparison-26544.pdf" target="_blank"><b>Comparison.PDF</b></a> (117.2 k)</td></tr></table></center><!--/attachment--> <BR>I hafta get the final version on our paper to go out on Monday, in the meantime i&#39;d appreciate any criticism, written, visual or otherwise. I know i&#39;m having issues with my spacing that I&#39;m not quite sure how to resolve, if you see anything else, lemme know, BTW i like the lc w, so don&#39;t knock it! </font></font></font></font></font></font></font></font>'
