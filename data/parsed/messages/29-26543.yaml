    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">hey guys, thanks for your help <BR>here&#39;s a revised version, did i fix the problems adequately? <BR><!--attachment: WinslowMailHead2-26548.pdf*mime_pdf.gif*application/pdf*81.4**WinslowMailHead2%2ePDF --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align=left alt="application/pdf"><br><a href="http://www.typophile.com/forums/messages/29/WinslowMailHead2-26548.pdf" target="_blank"><b>WinslowMailHead2.PDF</b></a> (81.4 k)</td></tr></table></center><!--/attachment--> <BR>besides making those changes, i tamed the top of the verticals on the lc h and the 2 lc l&#39;s. <BR>matt, do you think the skinny strokes need rounding at the end? i probably won&#39;t have time to do that for this week, but i may do that in the future. <BR>Any other feedback? is the revival too bland? too strict? too dated? too anything? would love to hear back from you on this, soon if possible. thnx again for your help.</font></font></font>'
