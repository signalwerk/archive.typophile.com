    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Leipzig is a city rich in the traditions of books and publishing. Now, another gem has been added to that tradition in the form of the Workshops and Museum for the Arts of Printing at Nonnenstrasse 38 in the district of Plagwitz. The museum is unique for the scope and diversity of its stock, which includes a multitude of lead and wood types for hand composition, type matrices, composing and casting machines, hand, platen and cylinder presses of many kinds - in short, all the resources with which the graphic arts and trades have met the needs of book and printed matter production during its long history. <BR> <BR>Werkst&auml;tten und Museum <BR>f&uuml;r Druckkunst Leipzig g.GmbH <BR> <BR>Nonnenstra&szlig;e 38 <BR>04229 Leipzig <BR>Germany <BR><A HREF="http://www.druckkunst-museum.de" TARGET="_top">http://www.druckkunst-museum.de</A></font></font></font></font></font>
