    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The Museum of Printing is dedicated to preserving the history of the graphic arts, printing equipment and printing craftsmanship. The museum�s official Grand Opening was July 29, 2000. <BR> <BR>In addition to many special collections and small exhibits, the museum contains hundreds of antique printing, typesetting and bindery machines, as well as a library of books and printing related documents. A tour guide is always provided, and hands-on demonstrations are part of every visit. <BR> <BR>Of particular interest to Type Designers are the font manufacturing drawings created at Merganthaler/Linotype &#40;two trailer-loads/37 skids&#41;, donated by Hiedelberg International &#40;Linotype-Hell&#41; and The Smithsonian. <BR> <BR>The Museum of Printing <BR>800 Massachusetts Avenue <BR>North Andover, Massachusetts 01845 <BR>&#40;978&#41; 686-0450 <BR><A HREF="http://www.museumofprinting.org/" TARGET="_top">http://www.museumofprinting.org/</A></font></font></font></font></font>
