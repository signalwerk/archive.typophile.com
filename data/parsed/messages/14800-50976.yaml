  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi, <BR> <BR>I was just asked to be on the board of the Capital Region Chapter of the Autism Society of America. And, of course, I have to do something with their identity. And it has to tie into the national logo, a ribbon with puzzle pieces. This is the national web site: <a href="http://www.autism-society.org/" target="_blank">http://www.autism-society.org/</a>. I am not crazy about the ribbon or the national web site, but ... <BR> <BR>Got any ideas? I have posted my first thoughts. <BR> <BR>Thanks! <BR>Cindy<!--attachment: logoideas-50977.pdf*mime_pdf.gif*application/pdf*509.5*First+round+of+logo+ideas*logoideas%2epdf --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align=left alt="application/pdf">First round of logo ideas<br><a href="http://www.typophile.com/forums/messages/14800/logoideas-50977.pdf" target="_blank"><b>logoideas.pdf</b></a> (509.5 k)</td></tr></table></center><!--/attachment--><img src="http://www.typophile.com/forums/messages/14800/50978.gif" alt="First round of logo ideas"></font></font></font>'
