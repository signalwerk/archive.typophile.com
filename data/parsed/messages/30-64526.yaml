    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Another helpful book is <a href="http://www.amazon.com/exec/obidos/tg/detail/-/1581804369/qid=1107448724/sr=1-1/ref=sr_1_1/102-5511625-2570557?v=glance&amp;s=books">  The Logo, Font, and Lettering Guide</a> by Leslie Cabarga. <BR><font face="symbol">&#182;</font>Adam Young</font></font></font></font></font></font></font></font></font></font>
  - id: 92040
    user: 1043
    date: 2005-02-03T09:40:00
    date_raw: Thursday, February 03, 2005 - 9:40 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Some books on drawing comics have chapters covering lettering, such as <a href="http://www.amazon.com/exec/obidos/tg/detail/-/0891349111/qid=1107452148/sr=8-8/ref=sr_8_xs_ap_i8_xgl14/104-6038158-8370335?v=glance&amp;s=books&amp;n=507846" target="_blank">How to Draw and Sell Comic Strips</a>, by Alan McKenzie. <BR> <BR>There&#39;s also the old Walter Foster book, ABC of Lettering, by Carl Holmes. As it was written around 1940, it&#39;s more fun to look at than useful, and it&#39;s out of print.</font></font></font></font></font></font></font></font></font>
