    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey, thanks for mentioning that Tommy Thompson book Hrant! I really ought to have a copy of it in my library. My current avatar is from another of his books, Script Lettering for Artists &#40;Dover reprint of the 1955 edtion revised from the original 1939 edition&#41;. Yes, that&#39;s Tommy&#39;s thumb and index finger. Man, could that guy draw letters. A lot of his stuff in the Photo-Lettering books. <BR> <BR>Another book possibly worth mentioning is Lettering Design: Form &amp; Skill in the Design &amp; Use of Letters, by Michael Harvey. Probably not real useful for comic book lettering, though.</font></font></font></font></font></font>'
