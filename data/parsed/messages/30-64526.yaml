post:
  id: 91988
  user: nemoomen-users
  date: 2005-02-02T22:28:00
  date_raw: Wednesday, February 02, 2005 - 10:28 pm
  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This seems like the right place to ask. <BR> <BR>I&#39;m looking for a book &#40;or any sort of instruction for that matter&#41; which explains the tools and techniques for drawing typefaces by hand. I draw my own comics and don&#39;t want to do lettering with a computer. Unfortunately the only new book I have been able to find that even touches on the subject just made fun of the old tools that were once used for designing and drawing type. <BR> <BR>Anyone?</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
comments:
  - id: 91990
    user: 1014
    date: 2005-02-02T23:16:00
    date_raw: Wednesday, February 02, 2005 - 11:16 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Jeffrey, welcome to Typophile. <BR> <BR>You might take a look at <a href="http://www.comicrazy.com/e/env/0001d1p9R56bCLwpYI7n4u3/comicraft/catalog.html?link=/comicraft/catalog.html&amp;item=comicrazy:cbl1" target="_blank"> Comic Book Lettering the Comicraft Way</a>.</font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 92019
    user: 1043
    date: 2005-02-03T06:57:00
    date_raw: Thursday, February 03, 2005 - 6:57 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think you mean <b>lettering</b> as opposed to drawing <b>type.</b> The process of drawing letters for type in the old days was more like making a blueprint for someone else to follow. If it was for direct reproduction, like for phototype headline fonts, the technical process was essentially the same as lettering except that the design of the letters was more rigorous owing to the fact that they had to be able to be assembled in any arbitrary order. <BR> <BR>Anyway, bj&#39;s suggestion looks like a good one in your case, but here are some other books you might want to look at &#40;some are probably out of print, though&#41;: <BR> <BR>Speedball Textbook &#40;used to be found at art supply stores--not sure if it still is&#41; <BR> <BR>Lettering and Alphabets, by J. Albert Cavanagh &#40;Dover Publications&#41; <BR> <BR>Lettering for Advertising, by Mortimer Leach &#40;Van Nostrand Reinhold&#41; <BR> <BR>The Modification of Letterforms, by Stanley Hess &#40;Art Direction Books&#41; <BR> <BR>Lettering for Reproduction, by David Gates &#40;Watson-Guptill Publications&#41;</font></font></font></font></font></font></font></font></font></font></font></font>'
