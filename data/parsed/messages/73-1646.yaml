    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Content: <BR>Eye is by far the best design magazine out there, in a class of it&#39;s own. It is not just the most trendy, it is also the most historic. What other publication would have on full article on the illustrations and writings of Sue Coe, film maker Peter Greenaway, designer Rick Vermeulen, and multi-media gurus Me Company, and the best &#40;unreleasedl&#41; type design all in the same issue?    <BR> <BR>Value: <BR>at around $30 &#40;w/tax&#41; an issue it is a bit expensive but usually worth it. I have about 13 issues in my collection some which can now be back-ordered at $400 an issue so I guess it was a worthwhile investment even if I had never read it. </font></font></font></font>'
