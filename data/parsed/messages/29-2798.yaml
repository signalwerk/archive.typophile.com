    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> kris <BR> <BR>this is really great! Go on! Send some Textphrases. Both 1 and 2 Pixel stem. Really like it! <BR> <BR>Greats Jens </font></font></font></font></font></font></font></font></font></font></font>
  - id: 7329
    user: 830
    date: 2002-09-30T10:01:00
    date_raw: Monday, September 30, 2002 - 10:01 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I agree with you kris, there is something overtly delicate about the 1 pixel stems.  I would definitely keep going with both weights. <BR> <BR>my suggestion would be to keep the width between left and right stems a little more consistent - at 2 px instead of 1 - especially with e,n,u,v,y... they seem too thin when it&#39;s looked at as a whole <BR> <BR>also specifically I would work on the &#34;c&#34; more... I like the last variation you have, just in terms of legibility.  I would also work on the &#34;s&#34; more as it seems to sit uncomfortably above the baseline. <BR> <BR>but many of the letters I find to be exquisite... the &#34;i&#34;, the 5th and 6th &#34;g&#34; sketches, the first four &#34;h&#34; sketches on the second row.  in all very fine work you are doing, can&#39;t wait to see more</font></font></font></font></font></font></font></font></font></font></font>
