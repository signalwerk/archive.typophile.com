  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">to satisfy my current pixel fetish, i have banged <BR>up a blackletter pixel face. i have just reached <BR>the point where one questions the validity of such <BR>a venture - apart from type for type&#39;s sake! <BR> <BR>&#40;a vision of goths &#39;txt&#39;ing each other just made  <BR>me giggle...&#41; <BR> <BR><IMG SRC="http://www.typophile.com/forums/messages/29/2799.gif" ALT="fraktur_pix.gif"></font></font></font></font></font></font></font></font></font></font></font>
