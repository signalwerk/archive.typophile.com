  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi everyone, I&#39;ve got a research question, and I could use your help. <BR> <BR>Many students the world over are interested in typography and type design. Some of them go on to attend fine graduate schools like Reading or KABK. Some are lucky enough to have great teachers at any number of other schools they might attend. Some of them learn entirely through self-teaching. <BR> <BR>In the current state of the graphic design industry, and the global economy in general, it can be quite difficult for a student to get a job after graduation. Traditionally, students have done a number of things to improve their chances and their r�sum�s, like networking through professors and professional organizations, getting good internships, and all and all working hard and making quality projects. <BR> <BR>Do some students do more? I&#39;m looking for examples of student groups, specifically those dealing with the type-minded, who have organized themselves extra-curricularlly. <BR> <BR>I have two examples to get your thinking going &#40;although one of them isn&#39;t really a group, but an individual; we&#39;ll start  with him&#41;. Ralf Hermann studies at the Bauhaus University in Weimar. In his &#34;spare time,&#34; he seems to have founded an ad agency, published a book about typography, made one of the two largest German-speaking web forums for typography &#40;<a href="http://www.typografie.info" target="_blank">http://www.typografie.info</a>&#41;, and opened his own reseller foundry &#40;<a href="http://www.fonts.info" target="_blank">http://www.fonts.info</a>&#41;. <BR> <BR>Recently in Offenbach, also in Germany, four other students and I formed the TypeOff collective. Over the summer, we built our website &#40;<a href="http://www.typeoff.com" target="_blank">http://www.typeoff.com</a>&#41;. Currently, we sponsor a monthly meeting of typographers in a bar in Frankfurt, which while fun, has not had as high of a non-Student turn out as we may have liked.  <BR> <BR>I&#39;m curious to know what other students have done that might be similar. Especially if they did in it groups, and independantly from their schools or other organizations. And their motivations &#40;other than fame and fourtune&#41; would be fun to learn, too. <BR> <BR>Sadly, groups and businesses formed just after graduation are out!</font></font></font></font></font>
