  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I am redesigning the identity for Microtek. They are a company that specializes in scanners, but also are involved in other digital imaging including digital cameras, monitors, and projectors etc. I have narrowed down to 2 different directions and am having an extremely hard time chosing one.  <BR> <BR>��� <BR> <BR>The top logo incorporates the pixels that are the core root of these products, an &#34;M&#34; with the line up of pixels, and also hinting at some sort of cable connector used to hook these products up. <BR> <BR>The second also deals with pixels, in &#40;an attempt at&#41; a more modern way. The pixels still form an &#34;M&#34; but are now rounded, and thrown into a perspective to hint at the idea of scaning.  <BR> <BR>My dilemma here is first off that I like them both, and am having a hard time stepping back from them. I like the idea of the 1st a bit more, but like the asthetics of the second. Any opinions on which direction to go would be GREATLY appreciated! Thanks everyone. <BR> <BR> <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/52387.gif" alt=""></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
