  html: '<font class="dontLookLikeCrap">Sometimes readability just isn&#39;t the point! <BR> <BR>I&#39;ve been bingeing on pixel fonts for three days now, and am getting a bit punchy. <BR> <BR>Interesting to me sometimes, how one font will jump out of a single letter from another font: <BR> <BR>A. Trixie. I&#39;ve been tinkering with this idea for months. Different sized pixels within a letter form. <BR> <BR>B. I wanted to spread out the letters with a better balance of little pixels to big pixels. The S and Z led the way, and ended up leading me to an interesting P and R. <BR> <BR>C. I decided to follow the P and R and see where it would take me. I thought it might make for an interesting unicase. the p and q looked okay. the b and d looked terrible. but they led me to consider a five pixel wide grid instead of a seven-wide. <BR> <BR>D. The lower case set just jumped right out of my mouse. The upper case isn&#39;t as good, but I felt good about getting an UC regardless. <BR> <BR>E. Woo-hoo! A bold works too! &#40;three days and counting, remember?&#41; <BR> <BR>F. WOW! Italics works too! <BR> <BR> <BR>Ah, well, it&#39;s fun pushing pixels anyway. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/53571.gif" alt=""></font>'
