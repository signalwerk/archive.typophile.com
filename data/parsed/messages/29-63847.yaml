  - id: 91056
    user: 2915
    date: 2005-01-27T08:34:00
    date_raw: Thursday, January 27, 2005 - 8:34 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">William if trends continue look to have to make a design for either no carb or low carb chocolate. I  agree with Scott, no brandmark on Sherl&#39;s? Try making Sheryl&#39;s a logo mark, TM or �. My last thought is have you tested the designs within the environment they will be sold in? You can have a good design and it can totally be lost in the clutter of the retail environment.</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 91185
    user: 3972
    date: 2005-01-27T17:19:00
    date_raw: Thursday, January 27, 2005 - 5:19 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;d ditch the &#34;Austin Powers&#34; type &#40;way overused&#41; and go for something more contemporary and exclusive, like Sauna or Bello from Underware: <BR> <BR><a href="http://www.underware.nl/site2/index.php3?id1=fonts" target="_blank">http://www.underware.nl/site2/index.php3?id1=fonts</a></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 91205
    user: 5771
    date: 2005-01-27T19:38:00
    date_raw: Thursday, January 27, 2005 - 7:38 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Bert, <BR> <BR>Gotta disagree with you there.  Those fonts you suggested look like they belong on the front of a kids little league shirt &#40;haha&#41; <BR> <BR>They don&#39;t convey any &#34;edginess&#34; and there is little potential for intertwining them, or adding the little devil tail.  These were specific requirements from the client, which we had to keep in mind when selecting a font. <BR> <BR>I don&#39;t see any problem with using common typefaces in logo design, as long as they are personalized to the job at hand.  Many well known logos use popular typefaces which are just modified.  Look at the letters in logos like Pepsi, Jurassic Park, The Crocodlie Hunter, Honda, or Playboy magazine, just to name a few.   <BR> <BR>From a psychological marketing viewpoint, I think there are advantages to using familiar letterforms, particularly in logo design, as the public sees something different, yet familiar.  Going for the obscure or radical isn&#39;t always best.</font></font></font></font></font></font></font></font></font>
  - id: 91260
    user: 108
    date: 2005-01-28T08:02:00
    date_raw: Friday, January 28, 2005 - 8:02 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">William, just as you disagree with Bert so I must disagree with you. Any of Underware&#39;s type could be a perfect combination for a chocolate package especially Sauna, Bello and Auto. Their type is well crafted and could help, IMO, create a sense of well-made chocolate.</font></font></font></font></font></font></font>
  - id: 91319
    user: 5771
    date: 2005-01-28T12:39:00
    date_raw: Friday, January 28, 2005 - 12:39 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Tiffany, <BR> <BR>There are hundreds of typefaces that could convey a sense of well-made chocolate, but this client specifically asked for something &#34;edgy&#34;, that brought together, mischeiviously, the concepts of good &amp; evil. <BR> <BR>I like bouncing ideas around.  This was a quick throw together, and really doesn&#39;t do your suggestion justice, but wouldn&#39;t you agree the general feel, on first glance, is not &#34;edgy&#34;? <BR> <BR><img src="http://www.typophile.com/forums/messages/29/64163.gif" alt="Comparison"> <BR> <BR>That was an important design criteria. <BR> <BR>While well crafted, I don&#39;t find any of Underware&#39;s type to be edgy, so I wouldn&#39;t consider it a good choice for this job.</font></font></font></font></font>
  - id: 91320
    user: 108
    date: 2005-01-28T12:53:00
    date_raw: Friday, January 28, 2005 - 12:53 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The two you&#39;ve just posted? I don&#39;t find them to be edgy. I suppose edgy is the eye of the beholder. Are you thinking you need to go more along the lines of what <a href="http://www.margochase.com/" target="_blank">Margo Chase</a> did for the Kama Sutra line? Or any of her work for that matter.  <BR> <BR>I think you could imply &#34;naughty and nice&#34; without actually having to show a devil&#39;s tail and an angel&#39;s halo.</font></font></font></font>
  - id: 91518
    user: 5771
    date: 2005-01-30T14:01:00
    date_raw: Sunday, January 30, 2005 - 2:01 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Tiffany, <BR> <BR>Margo Chase&#39;s clients have budgets in the thousands &#40;if not tens of thousands&#41; of dollars.  My guess is, they can afford whatever they want. <BR> <BR>In this case, we weren&#39;t hired to create a marketing campaign, or educate our client about the impact of a logo design on sales.  They had a trade show.  We had a week to work, and a few hundred dollars to spend.  That precluded going through numerous incarnations. <BR> <BR>There are many directions you can go in when creating a design.  In this case, we showed our client three ideas.  The halo/devil tail turned out to be their favorite.  It was an easy solution, given the limited budget.  I was happy, they were happy.  I hate defering artistic spirit to job constraints, but the reality is, it happens more then it doesn&#39;t.  Will it win a Clio?  No.  Did it solve their problem?  Yes.  Such is the world of production artwork. <BR> <BR>I sincerely appreciate your feedback though.  Thanks.</font></font></font>
