    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">William I wouldn&#39;t change anything but I would do testing to make sure it worked on a variety of sizes. Does it work tiny? If not you might need a variation that is simplier. I&#39;d also research the name. Another big nasty corporate giant might have a TM on Sweet Revenge. Just some thoughts</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 90825
    user: 2236
    date: 2005-01-26T08:37:00
    date_raw: Wednesday, January 26, 2005 - 8:37 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Dragan is right, that &#34;dolphins&#34; type is used a lot, but I think in this case, it&#39;s just too darn perfect for the application to lose it in lieu of popular overuse. <BR> <BR>In regard to the &#34;e&#34;: I feel for you on the quick turnaround, but I think even a tweak as subtle as slight rotation might help a little, or even chopping just a little bit off the curly end of a couple of the &#34;e&#39;s&#34;; otherwise, I love it! <BR> <BR>I&#39;m still craving chocolate. My wife is pregnant, and chocolate is one of my cravings. <BR> <BR>Aloha! <BR>Scott</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
