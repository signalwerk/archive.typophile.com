  html: '<font class="dontLookLikeCrap"><b>Veer Announces: 30 Exclusive New Typefaces From Device</b> <BR> <BR>Veer is pleased to announce the exclusive debut of <a href="http://www.veer.com/products/gallery.aspx?gallery=265&amp;vendor=det&amp;resultsperpage=36">30 new typeface families</a> from Device - a.k.a. designer-typographer Rian Hughes. In celebration of the tenth anniversary of the Device foundry, this collection of versatile fonts has been expanded in an explosion of new display types. <BR> <BR>Rian Hughes studied at the LCP in London before working for an advertising agency, i-D magazine, and a series of record sleeve design companies. Under the name Device, he provides design and illustration for the advertising, entertainment, publishing, and media industries. In between assignments, he adds to his phenomenal stable of typeface designs. He has an extensive collection of Thunderbirds memorabilia, a fridge full of vodka, and a stack of easy listening albums which he plays very quietly. <BR> <BR>The <a href="http://www.veer.com/products/gallery.aspx?gallery=265&amp;vendor=det&amp;resultsperpage=36">30 new Device typeface families</a> are currently available exclusively through Veer. <BR> <BR>The following examples offer a glimpse into the range of these new typefaces. <BR> <BR>............................................................................................................................................ <BR> <BR><img src="http://www.typophile.com/forums/messages/72/63189.gif" alt="Sparrowhawk"> <BR> <BR><a href="http://www.veer.com/products/typedetail.aspx?image=DET0000237">Sparrowhawk</a> by Rian Hughes <b><font color="808080">&#123; Device </font></b>} <BR> <BR>A capitals only titling face, evoking a suburban English gentility. <BR> <BR>............................................................................................................................................ <BR> <BR><img src="http://www.typophile.com/forums/messages/72/63190.gif" alt="Monitor"> <BR> <BR><a href="http://www.veer.com/products/typedetail.aspx?image=DET0000223">Monitor</a> by Rian Hughes <b><font color="808080">&#123; Device </font></b>} <BR> <BR>An early experiment in TV-wall pixeldom, and has the unique property <BR>of becoming easier to read the further away one gets. <BR> <BR>............................................................................................................................................ <BR> <BR><img src="http://www.typophile.com/forums/messages/72/63191.gif" alt="Miserichordia"> <BR> <BR><a href="http://www.veer.com/products/typedetail.aspx?image=DET0000222">Miserichordia</a> by Rian Hughes <b><font color="808080">&#123; Device </font></b>} <BR> <BR>Evolved from photographs taken on a trip to Venice. It instigated a <BR>sharp turn left into more idiosyncratic and decorative serif fonts,  <BR>something of a new direction for Device. <BR> <BR>............................................................................................................................................ <BR> <BR><img src="http://www.typophile.com/forums/messages/72/63192.gif" alt="Yolanda"> <BR> <BR><a href="http://www.veer.com/products/typedetail.aspx?image=DET0000241">Yolanda</a> by Rian Hughes <b><font color="808080">&#123; Device </font></b>} <BR> <BR>An elegant family of three weights each more florid than the last. <BR> <BR>............................................................................................................................................ <BR> <BR><img src="http://www.typophile.com/forums/messages/72/63193.gif" alt="Gusto"> <BR> <BR><a href="http://www.veer.com/products/typedetail.aspx?image=DET0000220">Gusto</a> by Rian Hughes <b><font color="808080">&#123; Device </font></b>} <BR> <BR>Three related variants that go from hot-dog to melted chocolate, <BR>a gastronomic combination not to be passed up &#40;or thrown up&#41;. <BR> <BR>............................................................................................................................................ <BR> <BR><img src="http://www.typophile.com/forums/messages/72/63194.gif" alt="Dauphine"> <BR> <BR><a href="http://www.veer.com/products/typedetail.aspx?image=DET0000211">Dauphine</a> by Rian Hughes <b><font color="808080">&#123; Device </font></b>} <BR> <BR>An elegant caps and small-caps typeface that manages to be modern  <BR>while still displaying perfumed good breeding, and comes with a <BR>leafy decorative variant. <BR> <BR>............................................................................................................................................ <BR> <BR><img src="http://www.typophile.com/forums/messages/72/63195.gif" alt="Moonstone"> <BR> <BR><a href="http://www.veer.com/products/typedetail.aspx?image=DET0000224">Moonstone</a> by Rian Hughes <b><font color="808080">&#123; Device </font></b>} <BR> <BR>For all those misunderstood goth Buffy fans. Really. <BR> <BR>............................................................................................................................................ <BR> <BR><img src="http://www.typophile.com/forums/messages/72/63196.gif" alt="Chantal"> <BR> <BR><a href="http://www.veer.com/products/typedetail.aspx?image=DET0000210">Chantal</a> by Rian Hughes <b><font color="808080">&#123; Device </font></b>} <BR> <BR>Originally designed to letter the RoboHunter series that Peter Hogan <BR>and I produced for 2000AD in 1993. At the time it famously elicited <BR>letters from readers who found it hard to read, but looks surprisingly <BR>friendly in its old age. <BR> <BR>............................................................................................................................................ <BR> <BR>For more information regarding these new type products, contact: <BR> <BR>Jacqueline Wallace <BR>403 313 4942 <BR><a href="mailto:media@veer.com">media@veer.com</a></font>'
