    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap">It doesn&#39;t sound like you have a lot of time for edits, but here&#39;s some comments�since you asked: <BR> <BR>I don&#39;t like the ampersand in 1a and 1b. It&#39;s too narrow�to the point where it looks smashed/sandwiched. The 1c ampersand is beginning to work because it looks like a growing vine. That vine concept works well, but the existing ampersand seems a little light, relative to the logotype. Also, 1c has some tension between the ampersand and the house graphic. In this version, you might need to lower the home graphic a bit. <BR> <BR>You have a lot to say, so this is a very busy logo. For that reason, I&#39;d lose the sunny &#34;O&#34; in EXPO. In addition, the sun appearing below the house defies logic. If it&#39;s not required, I&#39;d lose the chisel in the &#34;X&#34; also. <BR> <BR>If you&#39;re interested in my take, read on: <BR> <BR>1 Add some weight to the ampersand <BR>2 Lower the house graphic or nudge it to the right, or both. Whatever makes the space feel right. <BR>3 Move EXPO a little to the right &#40;maybe even allowing the bottom point of the house graphic to replace the chisel in the &#34;X&#34;&#41;. <BR>4 Reposition &#34;Northwest Valley Better Living&#34; as a single line to pull the eye back to the left, so the logo isn&#39;t completely going downhill. If the logo is always positioned on the top left of layouts, then the downhill is fine, but if it is bottom right, it leads you right off the page. <BR> <BR>Good luck with the quick turnaround! <BR> <BR>Aloha! <BR>Scott</font></font>'
