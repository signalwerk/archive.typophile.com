  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">By the end of the day, I have to submit a logo for the 2004 Northwest Valley Better Living Home &amp; Garen Expo. Here&#39;s what I have so far--any advice/criticism would be appreciated. <BR> <BR>-SeH<img src="http://www.typophile.com/forums/messages/29/26898.gif" alt="black logos"></font></font></font>
