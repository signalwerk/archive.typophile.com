  html: '<font class="dontLookLikeCrap">F O R   I M M E D I A T E   R E L E A S E <BR> <BR>Typeco extends Super Duty � now a 25 font superfamily. <BR> <BR>SUPER DUTY, first released in 2004 as 6 fonts, has now been extended to a robust and versatile stencil font family of 25 fonts � sharp and round variations with closed versions in 2 weights each. These are provided in 3 widths � regular, narrow and condensed. Super Duty includes a text version that has more regular proportions and letterforms for a well rounded display font system. <BR> <BR>Stencil fonts often evoke rigid and sterile images such as packing crates or military vehicles, but Super Duty is somewhere between serious and fun. Super Duty is designed with sharp mechanical angles which give the letterforms a square-jawed and ready-for-action feel. A rounder companion version is included that has the sharp edges smoothed out. <BR> <BR>Unlike most stencil fonts this one has a lowercase that matches the strength of the uppercase. The lowercase has been designed with an x-height equivalent to the cap height and barely protruding ascenders so that the user can interchange the upper and lower letterforms for a funky graphic effect. <BR> <BR> <BR>TYPECO is an electronic type foundry for the designs of principal, James Grieshaber, as well as a provider of typographic services and solutions. Services offered by Typeco include font identification, signature fonts, logo fonts and handwriting fonts. Solutions include custom designed typefaces, logos and trademarks, branding and graphic design. <BR> <BR>JAMES GRIESHABER has been active in the typographic community for several years now. Grieshaber most recently was on staff of P22 Type Foundry and helped establish International House of Fonts. He has been honored with an award of Excellence in Type Design from Association Typographique International &#40;ATypI&#41; for his Gothic Gothic type design. He has now struck out on his own to offer his services to those in typographic need and showcase his typographic vision. <BR> <BR>Typeco <BR>PO Box 10661 <BR>Rochester, NY 14610 <BR>Phone: 585.230.1674 <BR>Email: <a href="mailto:contact@typeco.com">contact@typeco.com</a> <BR>Web: <a href="http://www.typeco.com" target="_blank">http://www.typeco.com</a></font>'
