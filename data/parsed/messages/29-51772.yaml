  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hello everybody <BR> <BR>this is about a poster for a small theater in town and is the poster i mention to the General Discussions board at the &#34;S/M Typeface Wanted&#34; string.  <BR> <BR>The story: the tragic documentation of  a stong and deadly passion among 3 persons: a couple and the best girl-frient of the woman. Love and hate is total and exist at the same time. Violence is both physical and phsycological. There is no logic and ethics, only the power of passion which in the end leads to the death. <BR> <BR>There is no real story that i can describe, since the play is based more on the emotions of the scenes than their plot. <BR> <BR>The poster: A and B are the first approaches. They chose B and so we moved to F1,2,3 expecting to select the final. I am sorry that i posted the work so late, but everything happened very fast. Actually i posted the work because one week ago i asked for appropriate font to the theme &#40;&#34;S/M Typeface Wanted&#34; in General Discussions board&#41;. <BR> <BR>Eventually being ispired from what everybody kindly send i designed the lettering for the title &#40;as you see it needs hell a lot of work&#41; but i couldn&#39;t make it work with the poster. <BR> <BR>Have a nice day, christos <BR> <BR><img src="http://www.typophile.com/forums/messages/29/51773.jpg" alt=""></font></font></font></font></font></font></font></font></font>'
