    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Sweet, I think the font is ideal and the directions are accurate to your description! <BR>I am partial to F1, however, I feel like the incorporation of the man/woman bathroom icons isn&#39;t successful from the cardboard concept. Their basic rounded forms feel foreign to the harsh angles and intense imagery, and the font, too. My suggestion would be to try redrawing these characters, make fit. &#40;though this message may just be too late!&#41; <BR> <BR>Good luck! <BR>aaron</font></font></font></font></font></font></font></font>
  - id: 79604
