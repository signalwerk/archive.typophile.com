    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hello Aaron  <BR> <BR>i understand your objection but i disagree. I like the differentiation between the elements and i believe it works in this sceptic: this process of destruction leaded by the passion can take any &#34;ordinary&#34; person and make him/her go to the edges. Also the story starts very &#34;normal&#34; to end up in &#34;flames&#34; of sensuality and death.  <BR> <BR>I don&#39;t agree to make the figures &#34;more fit&#34; because i think then their presence would be useless. <BR> <BR>Thank you for the feedback <BR> <BR>christos</font></font></font></font></font></font></font>'
