  html: 'P22 type foundry is proud to present its newest division: <BR>International House of Fonts. IHOF is a download only type boutique which <BR>showcases distinctive type designs and designers from around the world. <BR><A HREF="http://www.internationalhouseoffonts.com/" TARGET="_top">http://www.internationalhouseoffonts.com/</A> <BR> <BR>NEW FONTS <BR>The initial selection of 16 diverse fonts features new designs from the <BR>three principal P22 designers, James Grieshaber, Richard Kegler and <BR>Christina Torre as well as designs from G&aacute;bor K&oacute;thay of Hungary and Hajime <BR>Kawakami of Japan. Next month will bring even more exciting font designs. <BR> <BR>DISCOUNTS <BR>P22/IHOF now offers an automatic volume discount for all downloaded. For <BR>information about this in greater detail, click here <BR><A HREF="http://www.p22.com/news.html" TARGET="_top">http://www.p22.com/news.html</A> <BR> <BR>We hope you like our new fonts. <BR> <BR>Best regards, <BR>P22 <BR> <BR> <BR>----------------------------- <BR>P22 type foundry, Inc. <BR>Not your typical type� <BR>PO Box 770 <BR>Buffalo, NY 14213 <BR><A HREF="http://www.p22.com" TARGET="_top">http://www.p22.com</A> <BR>Phone: 716-885-4490 <BR>Fax: 716-885-4482 <BR>-----------------------------'
