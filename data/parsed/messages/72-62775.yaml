  html: '<font class="dontLookLikeCrap">============================================================ <BR>LinoLetter 01/05 - Two contest-winning fonts and one retro  <BR>                   classic       <BR>============================================================ <BR>An online version, illustrated with images of this month�s  <BR>featured typefaces, is available on the Linotype website via  <BR>the following link: <BR>- <a href="http://www.linotype.com/8-38-8-18005/issue2005-01.html" target="_blank">http://www.linotype.com/8-38-8-18005/issue2005-01.html</a> <BR> <BR>! Linotype wishes all readers a Happy New Year ! <BR> <BR>INTRODUCTION: <BR>News Alert! We have a new program highlight for the upcoming  <BR>TypoTechnica conference to bring to your attention: Quark  <BR>will present the first public demo of the unreleased  <BR>QuarkXPress 7! Come to TypoTechnica and experience this  <BR>veteran application&#39;s new typographic features live. More  <BR>information below ...  <BR> <BR>In order to ease your plunge into a new creative year, we  <BR>rummaged through our library for a pair of great fonts to  <BR>recommend, and pulled out two of the winners from our last  <BR>International Type Design Contest: Hildegard and Samba.  <BR>Hildegard is a contemporary sans serif text face in the  <BR>Dutch style. Its cool assuredness in text stands in stark  <BR>contrast to the liveliness of its fellow contest-winner  <BR>Samba. A new interpretation of Brazilian Art Deco graphics  <BR>and lettering, Samba offers a warm, loud feeling  <BR>unobtainable in most other typeface designs. Aside from  <BR>newer designs like these, we enjoy reintroducing you each  <BR>month to our old favorites as well. You may recall that we  <BR>featured the types of Lucien Bernhard in our August issue;  <BR>this month, we are pleased to present another classic face  <BR>from our type archives: Serpentine, a forward-thinking  <BR>design from 1972. This retro design has become one of our  <BR>decade�s most popular display fonts. To close out this  <BR>month�s LinoLetter, we�d like to bring your attention to a  <BR>new design guide that we�ve published on our site, an article  <BR>entitled &#34;Pleasures of Design.&#34; <BR> <BR>Have fonts of fun! <BR> <BR> <BR>------------------------------------------------------------ <BR> <BR>IN THIS ISSUE:  <BR> <BR>1.  Hildegard: Dutch design direct to your desktop <BR> <BR>2.  TypoTechnica 2005: Experience a live demo of  <BR>    QuarkXPress 7&#39;s planned typographic features <BR>  <BR>3.  Samba: Brazilian type with an Art Deco spirit <BR> <BR>4.  Serpentine: A retro classic and contemporary favorite <BR> <BR>5.  Learn about type: Our &#34;Pleasures of Design&#34; feature  <BR>    article <BR> <BR>____________________________________________________________ <BR> <BR>1.  Hildegard: Dutch design direct to your desktop <BR>____________________________________________________________  <BR> <BR>Hildegard is a new sans serif text face in the Dutch style.  <BR>Upon close inspection, one will discover a world of subtle  <BR>angle variation within the letters� structure, loosely  <BR>inspired the stroke movements used in calligraphy. The  <BR>spaces between these built-up strokes create visible ink  <BR>traps at many joints, which play a functional role in aiding  <BR>legibility in smaller text sizes, in addition to their  <BR>aesthetic role. <BR> <BR>The Hildegard family of typefaces may be used in sizes  <BR>ranging from small text through large displays. Designed by  <BR>Jan Sonntag, a German student in the Netherlands, Hildegard  <BR>finished second place in the text face category of the 2003  <BR>International Type Design Contest, which was sponsored by  <BR>Linotype. The Hildegard family includes the following four  <BR>font styles: Regular, Italic, Bold, and Bold Italic. <BR> <BR>Check out Hildegard here: <BR>- <a href="http://www.linotype.com/6-23-6-17049/hildegard.html" target="_blank">http://www.linotype.com/6-23-6-17049/hildegard.html</a> <BR> <BR> <BR>____________________________________________________________ <BR> <BR>2.  TypoTechnica 2005: Experience a live demo of  <BR>    QuarkXPress 7&#39;s planned typographic features <BR>____________________________________________________________ <BR> <BR>Reserve your chance to experience all the latest in font  <BR>technology development, including the first public demo of  <BR>the planned typographic features for QuarkXPress 7 at the  <BR>TypoTechnica 2005 in London &#40;UK&#41;. <BR> <BR>From February 17-19, type designers and font developers from  <BR>around the world will be making their way to London &#40;UK&#41; for  <BR>the wide variety of forums, sessions, and workshops. The  <BR>conference is also an excellent opportunity to visit the  <BR>renowned St Bride Printing Library, and to meet with other  <BR>type-minded people. Register today! <BR> <BR>Click here to see the conference schedule and registration  <BR>info: <BR>- <a href="http://www.linotype.com/8-2358-8/typotechnica2005.html" target="_blank">http://www.linotype.com/8-2358-8/typotechnica2005.html</a> <BR> <BR> <BR>____________________________________________________________ <BR> <BR>3.  Samba: Brazilian type with an Art Deco spirit <BR>____________________________________________________________ <BR> <BR>The Samba type was inspired by the lettering art of  <BR>J. Carlos, a Brazilian illustrator active during the early  <BR>20th century. The sibling duo of the brothers Tony and  <BR>Caio de Marco, two contemporary Brazilian graphic designers,  <BR>transformed Carlos� work into a series of fonts. They  <BR>especially recommend that you try Samba for use in logos,  <BR>flyers, posters, and even tattoos! <BR> <BR>Their family, which includes three separate fonts, offers  <BR>the user a chance to mix three complementary styles of  <BR>lettering into one coherent design. While Samba Regular�s  <BR>characters are made up of mono-line letters, Samba Bold  <BR>offers much more thick/thin contrast. Samba Expert�s lavish  <BR>swash endings were inspired by Brazilian metal work. Samba  <BR>finished third place in the display face category of the  <BR>2003 International Type Design Contest, which was sponsored  <BR>by Linotype. <BR> <BR>Take a deeper look into the Samba family: <BR>- <a href="http://www.linotype.com/7-2244-7/samba.html" target="_blank">http://www.linotype.com/7-2244-7/samba.html</a> <BR> <BR> <BR>____________________________________________________________ <BR> <BR>4.  Serpentine: A retro classic and contemporary favorite <BR>____________________________________________________________ <BR> <BR>Dick Jensen &#40;USA&#41; designed Serpentine for the Visual  <BR>Graphics Corporation in 1972. Its dynamic and wide  <BR>design�identifiable via the letters� small, pointy serifs - <BR>is available in six different font styles. Although the  <BR>underlying strokes of the three weights are similar, each  <BR>member of the Serpentine family has its own individual  <BR>personalities. Serpentine Light lends itself well to text  <BR>for onscreen displays, for instance, while the numbers from  <BR>typeface�s heavier weights are seen around the world on  <BR>athletic jerseys. Additionally, the oblique styles convey a  <BR>streamlined sense of speed, furthermore lending Serpentine  <BR>well to sports applications &#40;especially the faster  <BR>varieties&#41;.  <BR> <BR>Because of its retro pedigree, Serpentine has become more  <BR>popular than ever during the last few years. The typeface may  <BR>be found all over the world in display usage applications  <BR>such as logo design, magazine headlines, and party flyers. <BR> <BR>Sample images of the fonts, as well as more information, are  <BR>available here: <BR>- <a href="http://www.linotype.com/7-2352-7/serpentine.html" target="_blank">http://www.linotype.com/7-2352-7/serpentine.html</a> <BR> <BR> <BR> <BR>____________________________________________________________ <BR> <BR>5.  Learn about type: Our &#34;Pleasures of Design&#34; feature  <BR>    article <BR>____________________________________________________________ <BR> <BR>In the Linotype Font Lounge, typographic themes are  <BR>highlighted and explained in depth. This feature article  <BR>asks what is necessary for creating good print design, and  <BR>offers some helpful guidelines along the way. <BR> <BR>&#34;Whenever you make or arrange a physical object in a  <BR>particular way, you are &#39;designing&#39; it; whether you are  <BR>deciding the length of a bracket to support a bookshelf, or  <BR>arranging a vase of flowers, you are practicing design. If  <BR>the shelf falls down, or the flowers look a mess, you  <BR>clearly haven�t been designing very well - you need to refer  <BR>to some established principles to help you get it right.&#34; <BR> <BR>Why does design matter? Learn more: <BR>- <a href="http://www.linotype.com/7-2331-7-17704/whydesignmatters.html" target="_blank">http://www.linotype.com/7-2331-7-17704/whydesignmatters.html</a> <BR>  <BR> <BR> <BR>------------------------------------------------------------ <BR> <BR>Don�t Forget! <BR> <BR>Linotype.com offers a wide variety of possibilities that may  <BR>help you find the right typeface or font package, as well as  <BR>the chance to try the fonts out and make a purchase. Our two  <BR>hints for this month: fist, try using our FontIdentifier to  <BR>identify typefaces whose name you don�t know. Second, pay a  <BR>visit to our Font-Packs page, and view all Linotype Font  <BR>Compilations at once!  <BR> <BR>Font Identifier <BR>Answer a few simple questions and the artificial  <BR>intelligence of the FontIdentifier will help you find your  <BR>font. <BR>- <a href="http://www.linotype.com/fontidentifier.html" target="_blank">http://www.linotype.com/fontidentifier.html</a> <BR> <BR>Font Packs <BR>All the fonts you need: Libraries, Compilations, Platinum  <BR>Fonts and Font Families as CDs or Download Packs. Save  <BR>yourself time and money!  <BR>- <a href="http://www.linotype.com/5-2164-5/fontpacks.html" target="_blank">http://www.linotype.com/5-2164-5/fontpacks.html</a> <BR> <BR> <BR>&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42; <BR> <BR>We hope you found this issue of LinoLetter informative and  <BR>useful. We would highly appreciate your feedback at  <BR><a href="mailto:info@linotype.com">info@linotype.com</a> <BR> <BR>The next issue of this newsletter will be published and  <BR>dropped in your mailbox at the beginning of February. <BR> <BR>Your Linotype Library Online Team <BR> <BR> <BR>------------------------------------------------------------ <BR>Publisher: <BR>Linotype Library GmbH <BR>Du-Pont-Stra�e 1 <BR>61352 Bad Homburg / Germany <BR> <BR>Website: <a href="http://www.linotype.com" target="_blank">www.linotype.com</a> <BR>Contact: <a href="mailto:info@linotype.com">info@linotype.com</a> <BR>Phone &#43;49 6172 484-418 <BR>Fax   &#43;49 6172 484-429   <BR>------------------------------------------------------------ <BR>&#40;c&#41; 2005  Linotype Library GmbH</font>'
