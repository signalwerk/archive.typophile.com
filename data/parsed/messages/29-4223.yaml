    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">C isn&#39;t bad, given the acronym you&#39;re trying to emphasize. <BR> <BR>In my &#40;very&#41; humble opinion, the negative space of the e is a little cramped.  You might shorten the tail of the e to compensate, or else make the u a touch narrower to &#34;match&#34; it.  The latter has the additional advantage of making the L&#39;s base a little shorter. <BR> <BR>Keep in mind that logos are my specialty; typography is still somewhat new to me. <BR> <BR>Paul</font></font></font></font>
