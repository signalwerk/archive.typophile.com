  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This is a nearly pro bono project for a non-profit.  <BR> <BR>The property is called &#34;Voices of Lower Manhattan&#34; and should have pretty broad appeal for people who live, work and recreate in Lower Manhattan. <BR> <BR>There&#39;s neither time nor budget to fully develop a logotype so I&#39;m posting the thing I&#39;ve been literally throwing together. &#40;Yeah, yeah, sob story. I know we&#39;ve all been there.&#41; <BR> <BR><img src="http://www.typophile.com/forums/messages/29/4224.gif" alt="volume type"> <BR> <BR>What do you think? <BR></font></font></font></font>
