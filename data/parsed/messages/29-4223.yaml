    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Well, my last idea was a smart as a le[a]d zeppelin. So I figure I can&#39;t get much worse. <BR> <BR><IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> <BR> <BR>My new idea might be worse. ROFL <BR> <BR>What if you stacked the letters somehow? I noticed that stacking them 2-by-3 the letters VLM are lead-ins. Also, if you stack them 3-by-2 you get a nice assymetry thing happening &#40;or hyper symmetry&#41;.  <BR> <BR>Lastly, how about playing with scale? As in turn up the volume?? I know this isn&#39;t really what you are going for, but it is an idea. </font></font></font></font>
