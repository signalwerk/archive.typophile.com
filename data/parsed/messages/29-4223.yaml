    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">well, obviously A looks better but the um ligature shows better the m than the u. Maybe you should work a little more on it to make the client happy. <BR>Anyway opcion c has a question for me, why you choose 2 of the 3 vocals to play? Man, just make the gag in 1 &#40;u, maybe with lu ligature&#41; or make it in the o too. 0, 1 or 3 but never 2. It is not much justified. Sorry about the bad english.</font></font></font></font>
