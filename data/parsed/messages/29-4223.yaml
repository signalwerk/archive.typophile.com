    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Alejandro, I understand the sentiment and I agree.  <BR>Perhaps I should&#39;ve been more clear. <BR> <BR>The full name is &#34;Voices of Lower Manhattan.&#34; They  <BR>want  the V, O, L and M to stand out -- as in SOHO  <BR>&#40;South of Houston&#41; or TriBeCa &#40;TRIangle BElow CAnal&#41;  <BR>or DUMBO &#40;Down Under Manhattan Bridge Overpass&#41;.  <BR>So, yes, it is gimmicky. Their concern is that the  <BR>connection should be obvious. </font></font></font></font>
