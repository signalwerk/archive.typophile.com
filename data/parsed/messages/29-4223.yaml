    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Well. This may be strange, or rather seem strange, but I like &#39;c&#39; without the altered &#39;e&#39;. The &#39;Lu&#34; lig is reading as a window to a home for me. But, it could be the Dr. Pepper talking too.  <BR> <BR><IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0></font></font></font></font>
