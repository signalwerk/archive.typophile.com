    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#34;They want the V, O, L and M to stand out&#34; <BR>It actually seems like the U and E stand out more than the other letters.  What about playing with weight and color instead of case. <BR><img src="http://www.typophile.com/forums/messages/29/4309.gif" alt="Volume"> <BR>Also, the ligature, the extra wide characters and the magenta make it look a little more like a fashion company logo than one for a non-profit.</font></font></font></font>
  - id: 9592
    user: 1160
    date: 2003-01-13T12:00:00
    date_raw: Monday, January 13, 2003 - 12:00 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Yeah, it&#39;s interesting. It&#39;s a basic gestalt issue. Because   <BR>two of six characters are treated differently, the two are   <BR>going to stand out more than the ones I&#39;m trying to   <BR>emphasize.  <BR>  <BR>I tried some of what you&#39;re &#40;Graham&#41; showing. By   <BR>introducing the bars under the u and e I was trying to   <BR>make the overall color more even.  I supposed it&#39;s a   <BR>toss-up as to which are more successful &#40;underlines vs.  <BR>color vs. weight change&#41;. All the approaches seem a   <BR>tad awkward. A good sign that the idea itself is flawed?  <BR>  <BR>Also, I&#39;m glad you see this as more of a fashion thing   <BR>than a non-profit thing. It&#39;s intentional. Volume isn&#39;t the   <BR>non-profit itself, that&#39;s just the name of the &#34;program&#34;   <BR>they&#39;re developing. It&#39;s aim is to promote and preserve   <BR>lower Manhattan lifestyle to the general public, not to   <BR>other organizations or businesses.  <BR></font></font></font></font>
  - id: 9597
    user: 108
