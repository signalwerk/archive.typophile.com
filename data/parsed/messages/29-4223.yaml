    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Miguel, I like the <i>idea</i> of scripts, but scripts AND ligatures dont help readability in my humble opinion. Perhaps its my tired jaded eyes, but I am reading the above examples as: <BR> <BR>1: volure <BR>2: voure <BR>3: vokre <BR>4: volure <BR> <BR>As for meneer pemberton, it has to be option A, surely? <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0></font></font></font></font>'
