    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Such an Ari Fleischer. <BR> <BR>Anyway, I would need a year &#40;and for you to be able to travel to places I&#39;d need to show you - no longer an option for you - just stick to Disneyland&#41; to undo the decades of US media you&#39;ve suffered. You&#39;ll have to fix your own head, sorry. <BR> <BR>-- <BR> <BR>David, I think the font has a problem with spotty color. Some glyphs are clotting a lot - like with the &#34;b&#34;, &#34;k&#34; and &#34;r&#34; you could leave the left end of the h-bar disconnected. Also, the &#34;y&#34; seems too big. Lastly, I think those bars on &#34;H&#34; and &#34;K&#34; are too strong. <BR> <BR>hhp <BR></font></font></font></font>
