    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I love it, although if I had a copy I&#39;d be using the lowercase by itself. <BR> <BR>The &#34;b&#34; seems a little too weird for commercial use. <BR> <BR>Paul</font></font></font></font>
  - id: 15913
    user: 533
    date: 2003-03-30T10:41:00
    date_raw: Sunday, March 30, 2003 - 10:41 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Here are some of the initial changes, notably a new upper case &#34;H&#34; and two variants on upper case &#34;Y&#34;. <BR> <BR>I haven&#39;t yet decided what to do about upper case &#34;W&#34; as yet. See what you think about the glyph in the text setting below. <BR> <BR>It&#39;s worth noting that the Seriatim family is a geometric sans serif, and Seriatim Uncial is an uncial variation, still within the constraints of geometric sans serif form. To that end, What may seem wide or otherwise out of sorts for a standard uncial font might seem to fit in the context of the geometry of the rest of the Seriatim family &#40;showing in the Sans Serif and Experimental Forums&#41;. <BR> <BR>Numerals, full punctuation, full standard ligatures, etc. are forthcoming, and will be posted as soon as possible. <BR> <BR>Criticisms are still always welcome, even of my poor maligned upper case &#34;W&#34;. <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> <BR> <BR>David <BR> <BR><img src="http://www.typophile.com/forums/messages/29/8160.jpg" alt="SeriatimUncial2"> <BR><img src="http://www.typophile.com/forums/messages/29/8161.jpg" alt="SeriatimUncialGaelic"> <BR><img src="http://www.typophile.com/forums/messages/29/8162.jpg" alt="SeriatimUncialText1"></font></font></font></font>
  - id: 15916
    user: 1352
    date: 2003-03-30T11:30:00
