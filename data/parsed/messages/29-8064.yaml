  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Apologies for my long absence from the critique forums. Things got very crazy in my world over the last year, but I&#39;m back in the swing of things typographic now. <BR> <BR>Here&#39;s the very first draft of the latest member of the huge-and-growing Seriatim geometric sans family. Meet &#34;Seriatim Uncial.&#34; <BR> <BR>More members of the Seriatim family will be posted to the appropriate forums in the coming days. <BR> <BR>As always, criticisms are welcome and highly prized.<img src="http://www.typophile.com/forums/messages/29/8065.jpg" alt="Seriatim Uncial"></font></font></font></font>
comments:
  - id: 15805
    user: 522
    date: 2003-03-28T11:40:00
    date_raw: Friday, March 28, 2003 - 11:40 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">love the genre and the overall feel that you&#39;ve established. more fresh and modern to me than the uncial sometimes allows. <BR> <BR>�i don&#39;t know that the W would be recognizable standing alone. kind of problematic to me. have to get back to you with any suggestions though. <BR> <BR>�the S feels kind of squashed, but at the same time i don&#39;t know how you could preserve that roundness that you have established elsewhere. <BR> <BR>�i&#39;m digging the z,K,a, and the diamond on the i and j. <BR> <BR>�the Y feels kind of stretch-pulled, less unified to the overall whole than the other glyphs.  <BR> <BR>must run, but i&#39;ll be back to see/say more. <BR>beautiful work</font></font></font></font>
  - id: 15848
    user: 1352
    date: 2003-03-28T16:55:00
    date_raw: Friday, March 28, 2003 - 4:55 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Bravo David. <BR> <BR>I see you&#39;ve been paying attention to the purists and included a dotless &#39;i&#39;. Good man. <BR> <BR>This has a lot going for it but in my opinion there are a few problems. <BR> <BR>For the uppercase W, I agree with John: it&#39;s pretty illegible. <BR> <BR>The H and K could probably do with ascenders  <BR> <BR>The M and N are too wide. <BR> <BR>For the lowercase, the f,h, m, and w are also a little wide. <BR> <BR>The ascender on the b is confusing. <BR> <BR>The descender on the z makes it look like a g. <BR> <BR>  <BR>If you wouldn&#39;t mind humouring me a little and setting a bit of Gaelic, I&#39;ll critique it all night. Try this: <BR> <BR><i>Bh� Patsy ina su� ag an roth potaireachta, a l�mh ar phota m�r a bh� leathchasta aici. Bh� s� gl�asta ina geansa� dubh agus scaif or�iste timpeall ar a muine�l aici.</i> <BR> <BR>Don&#39;t mind the accents. <BR> <BR>matha</font></font></font></font>'
