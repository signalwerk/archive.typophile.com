    date_raw: Monday, April 07, 2003 - 10:23 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks for all of the comments! <BR> <BR>I finally included an alternate upper-case &#34;W&#34;. <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> <BR> <BR>Here are the latest versions of Seriatim Uncial and Seriatim Uncial Alternate. The Alternate set has Gaelic characters and accenting as well as alternates from the regular set. <BR> <BR>Matha: Thanks, and I will! <BR>Please let me know if I&#39;ve gotten any of the Gaelic forms incorrect, or if there are any obvious omissions. <BR> <BR>&#40;Not all of the characters are displayed in these samples, of course. The regular set has full standard accents, and the alternate set has equivalent characters to those found in the Bunchlo Na Nod font, as well as several alternate characters to the regular set.&#41; <BR> <BR>David <BR> <BR><img src="http://www.typophile.com/forums/messages/29/8482.jpg" alt="SeriatimUncial4"> <BR><img src="http://www.typophile.com/forums/messages/29/8483.jpg" alt="SeriatimUncialAlt4"></font></font></font></font>'
  - id: 16419
    user: 1160
    date: 2003-04-07T11:35:00
    date_raw: Monday, April 07, 2003 - 11:35 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This is great work David, and is a testament to the solidity   <BR>of your previous work on this face. What some of you may <BR>not know is David has hidden various versions of Seriatim  <BR>throughout the critique boards. <BR> <BR>Seriatim Sans: <a href="http://www.typophile.com/forums/messages/29/989.html" target="_blank">http://www.typophile.com/forums/messages/29/989.html</a> <BR> <BR>Seriatim Alternates: <a href="http://www.typophile.com/forums/messages/29/1408.html" target="_blank">http://www.typophile.com/forums/messages/29/1408.html</a> <BR> <BR>Seriatim Gestalt: <a href="http://www.typophile.com/forums/messages/29/1371.html" target="_blank">http://www.typophile.com/forums/messages/29/1371.html</a></font></font></font></font>'
  - id: 16425
    user: 1352
    date: 2003-04-07T12:46:00
    date_raw: Monday, April 07, 2003 - 12:46 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hold on a second, I&#39;ve died and gone to heaven !! <BR>This really is incredible stuff, David.  <BR>I don&#39;t think anyone could fault your Gaelic forms either. Bravo. <BR> <BR>There is something you might think about, though, maybe for the alternate set, in relation to the long &#39;r&#39; and &#39;s&#39;. Nowadays, a lot of people often get the &#39;s&#39; and the &#39;r&#39; mixed up. I&#39;m working on a font with a colleague at the moment and we&#39;re trying to distinguish our long &#39;s&#39; and &#39;r&#39; from each other as much as possible. Giving a curve to the descender on the &#39;s&#39; is one possibility we&#39;ve come up with. <BR> <BR>BTW apart from Vincent Morely&#39;s work, what are you using for sources?  <BR> <BR>Matha</font></font></font></font>
  - id: 16940
    user: 533
    date: 2003-04-15T11:53:00
    date_raw: Tuesday, April 15, 2003 - 11:53 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I apologize for my delay in replying. Between Typophile.com&#39;s connection problems and my own connection problems, coupled with client work, it has been difficult to properly reply. <BR> <BR>First, thank you all very much for your encouragement and helpful critiques. <BR> <BR>To answer your questions: <BR> <BR>I referred to Victor Hammer&#39;s fonts &#40;American Uncial, Neue Hammer Unziale, etc.&#41;. Karlgeorg Hoefer&#39;s Omnia provided the inspiration for my controversial upper-case &#34;W&#34;. <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0>  <BR> <BR>The primary reference for my Gaelic glyphs has indeed been Vincent Morely&#39;s work. I also made use of the work of Luc Devroye and his complilation of Celtic/Gaelic font web references &#40;<a href="http://cgm.cs.mcgill.ca/~luc/celtic.html" target="_blank">http://cgm.cs.mcgill.ca/~luc/celtic.html</a>&#41;. <BR> <BR>As I have worked on Seriatim Uncial, I have begun to see the usefulness of a Gaelic-only version. Such a font would likely consist of the &#34;purist&#34; uncial forms, and a full Gaelic character set. Are there generally accepted character/keyboard assignments for specific characters in a Gaelic font, such as the long &#34;r&#34; and long &#34;s&#34;, et al? <BR> <BR>Thanks for all the replies! <BR> <BR>David</font></font></font></font>'
  - id: 16948
    user: 1352
    date: 2003-04-15T12:50:00
    date_raw: Tuesday, April 15, 2003 - 12:50 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">David, <BR> <BR>I couldn&#39;t agree more that a Gaelic-only version would be very useful. Apart from what Vincent Morely is doing, Gaelic typography is very much focused on the past. There is an enormous need for display fonts, screen fonts, fonts for signage, as well as italics, small caps and bold...but everyone seems to be busy digitising old book fonts. Things have gotten so bad that they&#39;re using book fonts on street signs.  <BR> <BR><img src="http://www.typophile.com/forums/messages/29/8738.gif" alt="quay"> <BR> <BR>There&#39;s nothing particulary wrong with the font in itself but why not design something specifically for signage? The same is true of anything used on TG4, the Gaelic television channel, websites, brochures etc. Ironically, you&#39;ll find more book fonts used for display purposes than in books. <BR> <BR>Seriatim Gaelic would be a breath of fresh air. <BR> <BR>For any info on character/keyboard assignments, Michael Everson is the man: <BR><a href="http://www.evertype.com/celtscript/celtcode.html" target="_blank">http://www.evertype.com/celtscript/celtcode.html</a> <BR>I disagree with him on several &#40;mostly philosophical&#41; points but when it comes to encoding, he can&#39;t be faulted. <BR> <BR>Matha. <BR></font></font></font></font>'
