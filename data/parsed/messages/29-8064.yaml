    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">David, <BR> <BR>I have to say that in both the Gaelic and English settings, it looks great. I think it reads especially well in Gaelic and the only thing that&#39;s really jumping out at me is the lowercase &#39;b&#39;. In this context, the wide &#39;m&#39; looks just fine and I love the &#39;a&#39;. <BR>The new Uppercase &#39;H&#39; and &#39;Y&#39; are better but I still think an ascender would work better both on the &#39;H&#39; and &#39;K&#39;. I won&#39;t say anything about the &#39;W&#39;. <BR> <BR>Bravo. <BR> <BR></font></font></font></font>
