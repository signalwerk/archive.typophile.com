  - id: 16279
    user: 533
    date: 2003-04-03T12:37:00
    date_raw: Thursday, April 03, 2003 - 12:37 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; It&#39;s gone all quiet in here all of a sudden.   <BR>&#62; Any developments on that &#39;W&#39; David?   <BR>&#62;   <BR>&#62; Matha.  <BR>  <BR>Some, yes. <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> I like the &#34;W&#34; as is it, but I agree  <BR>that it might be too unconventional to modern  <BR>eyes to be useful in all cases. So, as happens  <BR>with so many of my fonts, I&#39;m creating an <BR>alternates set. <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> I&#39;ll have an update showing  <BR>new additions, like numerals, punctuation  <BR>and ligatures, as well as many of the  <BR>alternates that have suggested themselves  <BR>so far, posted soon.  <BR>  <BR>I also took John Baichtal&#39;s comments to mean <BR>that the bowl of the upper-case &#34;P&#34; closes too  <BR>close to the stem, so I opened that up slightly.  <BR>I&#39;ve also taken Hrant&#39;s advice concerning the  <BR>lower-case &#34;b&#34;, &#34;k&#39; and &#34;r&#34;, and opened up the  <BR>middle crossbar.  <BR>  <BR>As for the upper-case &#34;H&#34; and &#34;K&#34;, I&#39;m going to  <BR>place the current designs in the alternates set  <BR>and try Matha&#39;s advice to use extenders  <BR>instead of the top bars in the main set.  <BR>  <BR>John Butler&#39;s advice on the lower-case &#34;g&#34;  <BR>was also taken to heart, although the bowl  <BR>problem is largely caused by an optical  <BR>illusion due to the lower-case &#34;f&#34;. I&#39;m  <BR>re-examining the &#34;f&#34;, and I may raise its <BR>crossbar off of the baseline.  <BR>  <BR>Paul: See what you think of the new lower-  <BR>case &#34;b&#34;. Does it need a spur on the lower-  <BR>left? I&#39;ve been trying to avoid that, but I may  <BR>have to relent and include it.  <BR>  <BR>Watch for an image in the next few hours.  <BR>  <BR>David</font></font></font></font>'
  - id: 16300
    user: 533
    date: 2003-04-03T20:50:00
    date_raw: Thursday, April 03, 2003 - 8:50 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I didn&#39;t get as much done on this today as I&#39;d hoped, but there&#39;s enough to show most of the changes and additions. I still have some of the punctuation and reference characters &#40;such as the section symbol and the pilcrow, et al&#41; to complete, and that pesky alternate upper-case &#34;W&#34; &#40;which will probably be a ligature of two &#34;V&#34;s&#41;. <BR> <BR>Another change is the upper-case &#34;S&#34; and lower-case &#34;s&#34;, which are both no longer as squished-looking as they were. They are both based on a circle now, and have essentially been lifted directly out of a yin-yang symbol that has been rotated 45 degrees. <BR> <BR>More to come. <BR> <BR>David <BR> <BR><img src="http://www.typophile.com/forums/messages/29/8389.jpg" alt="SeriatimUncial3"></font></font></font></font>
