  - id: 31875
    user: 530
    date: 2003-09-30T09:09:00
    date_raw: Tuesday, September 30, 2003 - 9:09 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Jim. You are so right about the red wine. Apologies to everyone I offended that night.  <BR> <BR>2. No mounties. <BR>3. Gary Munch.  <BR>4. Gerard Unger&#39;s purple sweater. <BR>5. I second the Powerpoint presentations. The kerning! Or lack thereof. My eyes!</font></font></font></font></font>
  - id: 31887
    user: 108
    date: 2003-09-30T11:05:00
    date_raw: Tuesday, September 30, 2003 - 11:05 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">1. best talk&#40;s&#41; -- Anthony Cahalan&#39;s, because I now know what I want to do for my PhD. <BR>2. worst thing -- No card games. <BR>3. best dancer -- Dyana. <BR>4. best dresser -- Prof. Erik Spiekermann. I loved his boots.   <BR>5. most ironic -- I&#39;d agree with the Powerpoint problems. <BR> <BR>What about: <BR> <BR>6. Best blurb or quote from someone? <BR> </font></font></font></font></font>'
  - id: 31892
    user: 956
    date: 2003-09-30T11:53:00
    date_raw: Tuesday, September 30, 2003 - 11:53 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I hate to start w/ a negative, but the worst thing for me at the conference were the name tags! I found them difficult to read further than 2-3 feet away. I&#39;m naturally shy and intimidated by crowds, and I find it very difficult to walk up to people and say: &#34;Hi! Who are you?&#34; I would have liked to have met more people from the on-line forums ... oh, well. Next time. <BR> <BR>For me, the best talk was the Kevin Larson/Gerald Unger combination re: Word Recognition &amp; Legibility. Lots of good information, I&#39;m just sorry hhp wasn&#39;t there to cross swords w/ Kevin :o&#41; I also thought the font business series was good. <BR> <BR>Vancouver is beautiful, and the weather was fantastic. It was very difficult to stay indoors; more than once I was tempted to steal a sailboat, head West &amp; keep on going. <BR> <BR> <BR> <BR></font></font></font></font></font>'
  - id: 31893
    user: scoffer-users
    date: 2003-09-30T12:02:00
    date_raw: Tuesday, September 30, 2003 - 12:02 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">1. best talk ? Unger on reading. <BR>2. worst thing ? Deciding not to go for broke on the volume of French Revolution newspapers in the auction. <BR>3. best dancer ? Ms Weissman, of course.  <BR>4. best dresser ? Nothing of note.  <BR>5. most ironic ? Well, more of a coincidence, actually. Over sushi with Cyrus, I was complaining &#40;as is my wont&#41; of the stale state of typography in mass market magazines available at airports, but mentioned that there was one exception, but I couldn&#39;t remember the magazine name or identify the headline font, so I drew him a couple of characters. &#34;Oh, was that Natural Health?&#34; says Cyrus, &#34;That&#39;s the first issue and a new face I just designed.&#34; <BR> <BR>6. Best quote? &#34;The choice of type is based on reputation and trends, rather than any kind of logic.&#34; - Roger Black</font></font></font></font></font>
  - id: 31910
    user: 1250
    date: 2003-09-30T13:07:00
    date_raw: Tuesday, September 30, 2003 - 1:07 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; I now know what I want to do for my PhD. <BR> <BR>What? <BR> <BR>hhp <BR></font></font></font></font></font>
  - id: 31970
    user: eric-nowina-users
    date: 2003-09-30T22:06:00
    date_raw: Tuesday, September 30, 2003 - 10:06 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I had a fantastic time, save missing my return flight by 24 hours &#40;long story&#41;. <BR> <BR>1. best talk: Erik Spiekermann&#39;s talk on friday as it shed the most light on some pressing issues for me at school. Thanks! <BR>2. worst thing: The internet connection in the lab. <BR>3. best dancer: Definitely not myself! <BR>4. best dresser: Tony &#34;Badoni&#34;�awesome shirts. <BR>5. most ironic: Like previous posts, the powerpoint presentations.</font></font></font></font></font>'
  - id: 32010
    user: 1817
    date: 2003-10-01T07:10:00
    date_raw: Wednesday, October 01, 2003 - 7:10 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">2. worst: the red wine was disgusting at the &#39;welcome&#39; keynote and I stayed away from it at the &#39;gala&#39; went with &#39;white&#39; wine.. The red was so sickening I left the first full glass at the &#39;welcome&#39;. I&#39;m use to Spanish Rioja Reserve which is great.  <BR> <BR>6: best quote: Nadine Chahine: &#39;this is the Arab equivalent of Comic Sans... but worse&#39;.  <BR> <BR>or &#39;you know who you are&#39;s wife&#39;: &#39;next year I&#39;ll give a higher bid for him to keep his clothes on&#39;. overheard at the Auction where John Downer wore a robe to promote the Underware sauna book.</font></font></font></font></font>'
