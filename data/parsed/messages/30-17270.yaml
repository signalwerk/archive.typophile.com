  - id: 33319
    user: frank-jonen
    date: 2003-10-12T16:30:00
    date_raw: Sunday, October 12, 2003 - 4:30 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I do use Keynote for all my presentations, client and public. <BR>The great thing is, you can prepare your stuff in Illustrator or InDesign, it reads PDFs and EPS files without choking! Normally I&#39;d do all the stuff directly in Keynote which works well. And to the Kern Monkey: The text looks good! Open your eyes again this ain&#39;t no Microsoft! <BR> <BR>If I run around during a presentation it&#39;ll either be my mobile phone or a rc-remote. <BR> <BR>Did this help anyone? I still have to figure out how to join this... Hey guys, what money? Help me to join!</font></font></font></font></font>'
