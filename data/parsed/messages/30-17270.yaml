    date_raw: Monday, September 29, 2003 - 3:40 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#34;2. worst thing . . . the red wine&#34; <BR> <BR>Most people think that red wine becomes better the older it gets, when, actually it tastes better the more you drink. <BR> <BR>Jim Rimmer </font></font></font></font></font>
  - id: 31804
    user: 851
    date: 2003-09-29T15:47:00
    date_raw: Monday, September 29, 2003 - 3:47 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I rather enjoyed Gerry Leonidas&#39; talk, John Hudson&#39;s new Hebrew face, Gerald Cinamon&#39;s Koch slides &#40;lots of stuff not in the book&#41;, the House of Downer demo, everything really. I only regret not being able to be in three places at once for some of those presentations. I really wanted to see more. That&#39;s probably the best complaint they can get. <BR> <BR>The food, well... I guess I understand now why I&#39;ve never heard of one going out to a Canadian restaurant. I preferred Leipzig. If I weren&#39;t allergic to seafood, I might have enjoyed the food more. <BR> <BR>So now that it&#39;s Monday, check out the announcement from <a href="http://www.adobe.com/">Adobe</a>.</font></font></font></font></font>
  - id: 31817
    user: mhill-users
    date: 2003-09-29T17:39:00
    date_raw: Monday, September 29, 2003 - 5:39 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">1. best talk ? Shelley&#39;s talk on Beatrice Warde <BR>2. worst thing ? spicy sushi, I can still taste it! <BR>3. best dancer ? Dyana, of course <BR>4. best dresser ? Jean-Claude, I loved the orange jacket <BR>5. most ironic ? Powerpoint presentations with terrible typography</font></font></font></font></font>
