  - id: 32256
    user: 851
    date: 2003-10-02T13:58:00
    date_raw: Thursday, October 02, 2003 - 1:58 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Actually, I totally forgot Thomas Milo&#39;s presentation on Arabic shaping. Definitely the best talk of the weekend. His slideshow was good quality too. I hope I can find more info about his work online somewhere. I can&#39;t seem to find a site for Decotype.</font></font></font></font></font>
  - id: 32266
    user: 1049
    date: 2003-10-02T15:58:00
    date_raw: Thursday, October 02, 2003 - 3:58 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I don&#39;t think Tom&#39;s site is up yet. Here&#39;s his contact info... <BR> <a href="http://www.microsoft.com/typography/links/vendor.asp?VID=DT" target="_blank">http://www.microsoft.com/typography/links/vendor.asp?VID=DT</a></font></font></font></font></font>
  - id: 32291
    user: 1275
    date: 2003-10-03T01:38:00
    date_raw: Friday, October 03, 2003 - 1:38 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The best experience was to rent the Scully X-Files flat with a bunch of friends! We&#39;ve learned that when we arrived only. <BR> <BR><a href="http://www.x-tour.com/agentscullysum.html" target="_blank">http://www.x-tour.com/agentscullysum.html</a> <BR> <BR>So, the party we&#39;ve organized out there was called the T-Files party.</font></font></font></font></font>
  - id: 32464
    user: 1203
    date: 2003-10-05T10:37:00
    date_raw: Sunday, October 05, 2003 - 10:37 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The highest point in the ATypI conference in Vancouver was in having all those type luminaries in my home town. <BR> <BR>Taking Dan Carr and paul Razell to the Ho Sun Hing Printing Co, type foundry for a tour and demo of Chinese type casting was also a pleasure. <BR> <BR>It was not easy to get Fontlab information from the young men doing the digital work on the typeface during John Downer&#39;s Font Sprint, but I realize they were busy trying to drain the swamp. &#40;Fontlab does look like a hell of a program&#41; <BR> <BR>John Downer&#39;s signwriting ability just floored me. Such a talent! And  very nice guy as well. <BR> <BR>And to top it off, I always enjoy hanging around the False Creek waterway. <BR> <BR>The disappointing part is that I managed to meet very few type designers, and would have liked to have had the time to get peole to visit my own metal foundry. <BR> <BR>All in all, I had a nice time, and wasn&#39;t completely put off the conference on by the doubtful quality of the red wine. <BR> <BR>Jim Rimmer <BR> <BR></font></font></font></font></font>
  - id: 32478
    user: 909
    date: 2003-10-05T17:14:00
    date_raw: Sunday, October 05, 2003 - 5:14 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">1. best talk: Shelley Gruendler on Warde, and Larson on reading <BR> <BR>2. worst thing: the lack of a pocket-size version of the program <BR> <BR>3. best dancer: Dyana Weissman <BR> <BR>5. most ironic: I hereby apologize for using PowerPoint. The lack of kerning is the thing that drives me nuts. Next year, InDesign all the way! <BR> <BR>I wasn&#39;t aware that I used &#34;wonky&#34; very often. Hmmm. Must have snuck up on me somehow. Maybe it&#39;s a secret west coast thing? <BR> <BR>Cheers, <BR> <BR>T</font></font></font></font></font>'
  - id: 32517
    user: 1832
    date: 2003-10-06T08:15:00
    date_raw: Monday, October 06, 2003 - 8:15 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Has anyone tried Keynote &#40;Apple&#39;s answer to PowerPoint&#41;? Are the typography controls any better? </font></font></font></font></font>
  - id: 32554
    user: 1160
    date: 2003-10-06T13:11:00
    date_raw: Monday, October 06, 2003 - 1:11 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Re: ATypI <BR>I&#39;m sorry I missed it. My trip to Mexico was definitely  <BR>worthwhile though. &#40;I&#39;ll post some <a href="http://www.typophile.com/forums/messages/14800/16255.html">found type</a> later.&#41; <BR> <BR>Re: Powerpoint <BR>Acrobat Reader has a &#34;presentation mode.&#34; The  <BR>PDF goes full screen and you use arrow keys to go forward  <BR>and back through the pages. It&#39;s gotta be Adobe&#39;s best kept  <BR>secret. Nothing like going from InDesign to presentation  <BR>sans PowerPoint.</font></font></font></font></font>'
  - id: 32558
    user: 909
    date: 2003-10-06T13:34:00
    date_raw: Monday, October 06, 2003 - 1:34 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Keynote: I don&#39;t know all the capabilities, but at least it supports kerning. <BR> <BR>PowerPoint vs. Acrobat: Even when I create presentations in PowerPoint, I still show them from Acrobat. I like the text spacing and rendering better that way. But that still doesn&#39;t get me kerning. <BR> <BR>T</font></font></font></font></font>'
  - id: 32569
    user: 1262
    date: 2003-10-06T14:50:00
    date_raw: Monday, October 06, 2003 - 2:50 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Can you make individual PDF pages and import them into Powerpoint as graphics? I usually do my presentations in Acrobat, as described by Joseph, but there are a number of functions in Powerpoint that I prefer, such as the nice fade between slides, the ability to animate elements, etc.</font></font></font></font></font>
  - id: 32588
    user: 1202
    date: 2003-10-06T15:48:00
    date_raw: Monday, October 06, 2003 - 3:48 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">PowerPoint is actually a great program to write and put together a presentation as a structured document. It&#39;s how people use it that makes it a bad thing. The slide sorter view is really good, as well as the outline mode. InDesign doesn&#39;t compare when it comes to this. Try organizing your pages in the pages palette. It&#39;s a nightmere. <BR> <BR>Though I still do my presentations in InDesign and present in Acrobat. That&#39;s what I did for mine at ATypI. Can&#39;t do without the typographic sophistication. No kerning? Forget it! I&#39;m tempted to try Keynote. Would any of you recomment it? I&#39;ve noticed a few presenters used Keynote. I love the cinematic cross-dissolve!</font></font></font></font></font>
  - id: 32595
    user: 909
    date: 2003-10-06T16:13:00
    date_raw: Monday, October 06, 2003 - 4:13 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">John: <BR>I don&#39;t think PowerPoint can take PDF as an import format. However, if you have Acrobat 6 Pro, you can export PDF from PowerPoint and have it even map transitions to their closest PDF equivalents. I haven&#39;t played with this much, since I think fancy transitions are often a distraction, so I can&#39;t say how well it works. <BR> <BR>Keith: <BR>I agree wholeheartedly that PowerPoint is great for managing structured presentations. That&#39;s why I still use it even though the typography sucks so badly. However, when time allows I do the initial version in PowerPoint and then redo it all in InDesign when I&#39;m done.... <BR> <BR>T</font></font></font></font></font>'
  - id: 32668
    user: 1275
    date: 2003-10-07T08:18:00
    date_raw: Tuesday, October 07, 2003 - 8:18 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I do my presentation in Acrobat too for couple of year and very happy with result, and more fun when you move to the next page via a BlueTooth phone, hehe. <BR> <BR>But yes, a template sometime can be good.</font></font></font></font></font>
