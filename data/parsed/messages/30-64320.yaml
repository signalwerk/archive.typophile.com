    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Guitar logos are either decals or inlaid. They are never stencilled to my knowledge. except on very cheap guitars.</font></font></font></font>
  - id: 91709
    user: 2851
    date: 2005-01-31T19:03:00
    date_raw: Monday, January 31, 2005 - 7:03 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;ve custom painted guitars and I&#39;ve used a clear decal on the head and then a few coats of varnish over it. Unless you&#39;re really looking at it closely, you won&#39;t see the edge of the decal.</font></font></font>
  - id: 91732
    user: 2127
    date: 2005-01-31T23:46:00
    date_raw: Monday, January 31, 2005 - 11:46 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">We use a water release inkjet printable decal to transfer designs onto shell as a template for cutting inlays. I&#39;ve never used it as a decorative component, but it might be worth experimenting. You can buy small quanties from <a href="http://www.ceramicdecals.cc/" target="_blank"> Bel</a>. <BR> <BR>I did once experiment with an ALPS printer and a gold transfer foil on water release, that looked nice, but the printer finally died and it was discontinued many moons ago.  <BR> <BR>As far as thermography, if the design is done right, I&#39;ve seen amzing things done with rubber stamps and embossing powders.  <BR> <BR>Make sure you check any method for interactions with the particular finish on a test.</font></font>
