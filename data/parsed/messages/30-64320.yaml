  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi, <BR>I need to place a logo on the head of a guitar. Has anyone done this before? The person I&#39;m doing the logo for makes his guitars by hand, so I would love to know of a way to do this by hand. But any way of doing this would be nice to know, if just for reference. The woods he uses are typically dark, so I&#39;m thinking a white ink, but I also want to consider using a metallic ink, if possible, such as on a martin. <BR> <BR><a href="http://www.musiciansbuy.com/mmMBCOM/images/martin/martin_lx1e_headstock.jpg" target="_blank">http://www.musiciansbuy.com/mmMBCOM/images/martin/martin_lx1e_headstock.jpg</a> <BR> <BR>If I can&#39;t find a way to do it by hand, using a printer &#40;thermography?&#41; would be fine too. <BR> <BR>Thanks! <BR>- Brian -</font></font></font></font></font></font></font></font></font></font></font></font>
