    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">For more than thirty years, the Department of Typography &amp; Graphic Communication has been the only one of its kind in a British university. <BR>We have developed a unique approach to the subject through a combination of practice, theory and history. Our special strengths lie in editorial and information design, in electronic publishing, in the history of printing, and typeforms and letterforms. Each of these is represented in our undergraduate and postgraduate programmes, in the research interests of our members of staff and in works published by the Department, such as Typography papers.</font></font></font></font>
