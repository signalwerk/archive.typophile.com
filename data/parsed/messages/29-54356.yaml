    date_raw: Saturday, November 27, 2004 - 1:14 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Shake your creative juices <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 84070
    user: 2236
    date: 2004-11-27T12:06:00
    date_raw: Saturday, November 27, 2004 - 12:06 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Santa says it all. Can you eliminate the other elements, except for the type which I think would seem even more clever if it were more subtle &#40;smaller&#41;? <BR> <BR>Aloha! <BR>Scott</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 84137
    user: 5011
    date: 2004-11-28T06:07:00
    date_raw: Sunday, November 28, 2004 - 6:07 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Good advice, Scott. I have made some slight revisions based on the your suggestion for smaller font size usage. <BR><img src="http://www.typophile.com/forums/messages/29/54566.jpg" alt="1"> <BR>The more I see my typo-santa the less original it looks. Please tell me your opinion about it. <BR>The purpose of this assignment was to depict and capture the chrismas spirit without using the triteness of the x-mas designs. I would love to receive any suggestions for other ways of doing this. <BR> <BR>Sincerely, <BR>Galin Krasimirov <BR> <BR>p.s  <BR>I hope that more people will get involved in that thread.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 84149
    user: 2663
    date: 2004-11-28T08:49:00
    date_raw: Sunday, November 28, 2004 - 8:49 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Galin, I love the typographic Santa. It&#39;s beautifully done.  <BR> <BR>The tagline, however, I don&#39;t like. In English, &#34;merry&#34; isn&#39;t a transitive verb, so &#34;merry it&#34; doesn&#39;t strictly speaking work. I could see it as a playful semi-pun on &#34;marry it&#34;, but for that to work, you have to use the contraction &#34;It&#39;s...&#34; instead of &#34;It is&#34;, which sounds somewhat formal. Overall, though, I&#39;d drop it.  <BR> <BR>I think the Santa is strong enough to stand on his own. If you want words, I&#39;d go with Merry Christmas &#40;possibly also in Bulgarian or other languages&#41;. &#40;By the way, what&#39;s Santa called in Bulgarian? Ded Moroz, Ded Nicolas?&#41; <BR> <BR>One odd idea, which may make the whole thing too cheap &#40;or not&#41; is that Santa&#39;s expression and pose make it look as if he&#39;s riding a surfboard. Of course, Santa is supposed to ride a sleigh, so how about putting him on a surfboard made from a sleigh?</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 84200
    user: 2236
    date: 2004-11-28T16:04:00
    date_raw: Sunday, November 28, 2004 - 4:04 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">These are beginning to work much better, but I am still struggling a little with the type at the bottom. The words don&#39;t bother me so much, as they do Galin, but there still seems to be a style issue. You have two distinct type styles and neither of them seem to be associated in any way with the typoSanta. <BR> <BR>The following are some suggestions: <BR> <BR>1 Try creating a typographic horizon line. With this addition the all white background works better than the design with the red swash at the bottom. <BR> <BR>2 Try simplifying the type to involve only one face. Use a face that is as freeform as your Santa. Between the two you have already, the type used for &#34;merry it&#34; would be better suited. <BR> <BR>3 Galin is right about the copy being improper English, but I&#39;m not sure that it is wrong in this application. I realize that you are saying &#34;merry it&#34; while meaning &#34;make it merry&#34;. I think most others will get it also. In order to emphasize this slang terminology enough to make it obvious, you probably should change &#34;It is�&#34; to the contraction &#34;It&#39;s&#34; as Galin suggested; otherwise, the line will start off too formal. <BR> <BR>Aloha! <BR>Scott</font></font></font></font></font></font></font></font></font></font></font></font></font>'
