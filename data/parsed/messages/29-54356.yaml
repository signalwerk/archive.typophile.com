    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Steve: <BR> <BR>&#40;By the way, what&#39;s Santa called in Bulgarian? Ded Moroz, Ded Nicolas?&#41; <BR> <BR>it&#39;s &#34;Dyado Koleda&#34;, if I&#39;m spelling it correctly</font></font></font></font>'
  - id: 84957
    user: 2172
    date: 2004-12-03T13:47:00
    date_raw: Friday, December 03, 2004 - 1:47 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Galin, I&#39;ve been watching this critique for a while now. I think the direction you&#39;re going in is good, and your type Santa&#39;s great. <BR> <BR>My comments: <BR> <BR>1. Get rid of the red curved area at the bottom and either just have Santa on a white background, or do what Scott recommended: a typographic horizon line &#40;possibly in a light grey&#41;. <BR> <BR>2. If you want to use a script I recommend you either use just the handwritten type with no effects, or use a more scripted and less handwritten one &#40;like <a href="http://www.myfonts.com/fonts/linotype/linoscript/">Linoscript</a>, for example&#41;. The glowing and shadowing remove any sense of a &#39;true&#39; handwritten feel. <BR> <BR>By simplifying everything, you also put the emphasis on your Santa, which really deserves most of the viewer&#39;s attention.</font></font></font>'
