  votes: null
  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Greetings typophilers, <BR> <BR>Project : To design an original christmas card. <BR>Aim : Uniqueness. <BR>Method : Typography. <BR> <BR>I have already send this card, but a door was left open for corrections. So, if I find something that is missing or sth. that would strenghten the design --- it would be send in a second additional letter. <BR> <BR>Your advices would be appreciated. <BR><img src="http://www.typophile.com/forums/messages/29/54357.jpg" alt="card"> <BR>Salute</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
