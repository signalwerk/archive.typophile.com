  - id: 91091
    user: pablohoney77-users
    date: 2005-01-27T10:46:00
    date_raw: Thursday, January 27, 2005 - 10:46 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">thanks for such a quick response, tiff! actually, i&#39;m trying to figure out how to calculate the en space to set my diacritics on. according to <a href="http://www.microsoft.com/typography/developers/fdsspec/spaces.htm" target="_blank">Microsoft</a>, the en space should be half of the em. I guess that if the UPM is 1000, that should be 500, right? is that all there is to it? or is there more to it than that? i guess i should have been more specific...</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
