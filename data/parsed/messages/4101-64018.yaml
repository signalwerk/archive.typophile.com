    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#42;&#42;blushing&#42;&#42; i didn&#39;t notice that this was in the BUILD area. i wondered why you need to know. &#42;&#42;laughing&#42;&#42; sorry. as you were.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 91100
    user: 1133
    date: 2005-01-27T11:24:00
    date_raw: Thursday, January 27, 2005 - 11:24 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Em is a unit to measure type. It is not really related to the letter &#34;M&#34; in any manner.  <BR> <BR>In digital type design, em is the size of the em square. The emsquare is a hypothetical square that your type design relates to. The always corresponds to the point type size in the design application. This means, whenever you set 10 point type, it will be the em that actually will be 10 points. In a digital font, the em is divided into units -- typically 1000 units per em. If you set 10 point type, the 1000 units will correspond to 10 point. If your caps are 700 units high, this means that in 10 point type, the caps will be 7 point high. If your descenders are 200 units, they will be 2 point long in 10 point type &#40;and 3 units in 15 point type, obviously&#41;.  <BR> <BR>An en space should be 1/2 em, i.e. &#40;typically&#41; 500 units wide.  <BR> <BR>It is advisable that the distance between the ascender line and the descender line in your font equals the em size, i.e. typically 1000 units. For example, if your ascender is 750 units, the descender should be 250 units. By doing so, the user will have better chances to accurately measure the type size of printed text set in your font.  <BR> <BR>Adam</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 91101
    user: pablohoney77-users
    date: 2005-01-27T11:29:00
