    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thank you for that clean, consice explanation, Adam.  And thank you Tiff for being so willing to help and quick to respond. I appreciate all your help.</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 91110
    user: 5094
    date: 2005-01-27T11:58:00
    date_raw: Thursday, January 27, 2005 - 11:58 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Yes. In most PostScript applications, an em is 1,000 units, and an en, being 1/2 an em, is 500 units. <BR> <BR>If you want more, in current usage, the &#42;EM&#42; is a unit of measurement that equals the point size of the type. Note that in the past there have been other defintions of an em &#40;space&#41;. <BR> <BR>When you express this in units, the width of the em &#40;&amp; maybe the height&#41; becomes whatever the &#34;unit basis&#34; is for a font or composition system. The old Monotype metal systems used an 18-unit em. Linotype linceasters didn�t use a unit system, but the Linotype VIP used an 18-unit em and the newer Linotron 202 used a 54 unit em. I believe there was a Monotype Digital machine &#40;Lasercomp?&#41; that used a 96-unit em.  <BR> <BR>PostScript uses a 1,000 unit em. I&#39;ve seen fonts &#40;always Trutype?&#41; with a 2,000 unit em. <BR> <BR>Quark Express is the only current composition system I know of that deviates form this, allowing an &#42;em&#42; to be set as twice the space of a numeral &#40;figure&#41;. Obviously, this kind of measurement wouldn&#39;t work with proportional numbers. I believe Quark also allowed a different setting for an em, certainly its kerning values are 1/8th of the 1,000 unit system.  <BR> <BR>Why accents should center within an en space is unclear to me. The use of floating accents depends on the composition system. If a composition system doesn�t have floating accents, then hand-kerning them to use with a character would seem to dictate as small a sidebearing as possible; less kerning involved that way. If I may be a little unkind to MS Word, I don�t believe Microsoft makes composition software. <BR> <BR>BTW, Most of us compositors would like if, in OT format, you also specified the &#42;thin&#42; and &#42;hair&#42; spaces. If you want to be traditional, a &#42;thin&#42; is a five-to-the-em space, but that�s too big. Depending on the general sidebearings you use with your letters, I�d make a thin either 150 units, or, if they are tight sidebearings, 100 units. A Hair Space has no real historical value spedified, I like a 55 unit value. <BR> <BR>You could also set the X-to-the-em spaces which are in Unicode, but I don�t believe InDesing &#40;the only current program making used of OT fonts&#41; � has made provision for their use. <BR> <BR>As to what to read about spacing generally -- we tried to cover much of this in in the <i>Glossary of Typesetting Terms</i>, published by the University of Chicago Press, &amp; now remaindered &#34;real cheap&#34; from several places. <BR> <BR>Charles</font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 91114
    user: 1133
    date: 2005-01-27T12:11:00
    date_raw: Thursday, January 27, 2005 - 12:11 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; PostScript uses a 1,000 unit em.  <BR>&#62; I&#39;ve seen fonts &#40;always Trutype?&#41;  <BR>&#62; with a 2,000 unit em.  <BR> <BR>In Type 1 and OpenType PS fonts, an em square of 1000 units is recommended, but other sizes are possible. In OpenType TT / TrueType fonts any number of units per em square up to 16384 is allowed. Typically you will see OpenType TT / TrueType fonts with 1000, 2000 or 2048 UPM &#40;units per em&#41;.  <BR> <BR>&#62; Why accents should center within an en space  <BR>&#62; is unclear to me. The use of floating accents  <BR>&#62; depends on the composition system.  <BR> <BR>In font formats that use Unicode &#40;TrueType and OpenType&#41;, you generally include two sets of &#34;stand-alone&#34; accents: spacing and non-spacing. It is recommended that the spacing accents have the advance width equal 1/2 em, while the non-spacing accents should obviously have the advance width of 0. For example, the spacing acute &#40;U&#43;00B4, glyphname &#34;acute&#34;&#41; in an OpenType PS font with 1000 UPM should have the advance width of 500, while the non-spacing acute &#40;U&#43;0301, &#34;acutecomb&#34;&#41; should have the advance width of 0. Both diacritics should be centered on their respective advance widths.  <BR> <BR>&#62; If I may be a little unkind to MS Word,  <BR>&#62; I don�t believe Microsoft makes composition  <BR>&#62; software.  <BR> <BR>Except Microsoft Publisher, of course, which is a quite decent composition software.  <BR> <BR>Adam</font></font></font></font></font></font></font></font></font></font></font>'
  - id: 91139
    user: 5094
    date: 2005-01-27T13:59:00
    date_raw: Thursday, January 27, 2005 - 1:59 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Interesting. <BR> <BR>When I went &amp; opened up Adobe Minion Pro in FontLab, the COMBINING DIACRITICAL MARKS section was empty; most of the �accents� were in the SPACING MODIFIER LETTERS &#40;02B0 through 02FF&#41;; with, as you say, the acute in the U&#43;00B4, &amp; I�m sure a few others elsewhere. <BR> <BR>I�m not sure how much this matters, even with a zero setwidth, an accent will not center over a letter it follows. Software will be needed to position the accent. I suppose it helps if the software can make certain assumptions? <BR> <BR>It seems that what Unicode has tried to provide for is single glyphs that may be used to represent several characters � for example, the &#42;acute accent&#42; along with the &#42;breve&#42; and &#42;macron&#42; may be used as scansion marks as well as accents. Depending on how classical your prosody, you may also use the &#42;grave&#42; as a scansion mark. Actually, to function well as scansion marks, I think they should be separate glyphs; drawn a little differently. One of the peculiarities of print &#40;at least with Latin-based languages&#41;, is that over time we have used whatever is available in the type case for a host of functions. As our type case gets bigger, a more specialized rendering of the marks becomes possible. <BR> <BR>Finally &amp; trivially, I�d forgotten that with most older composition systems which were unit-based, one unit was the smallest increment that could be specified &amp; set. With TeX, the smallest &#42;specifiable&#42; increment is a scaled point. There are 65,536 scaled points to a traditional point, or, as Knuth points out, a wavelength of visible light is about 100 scaled points&#41;. I said it was specifiable, not always usable . . .</font></font></font></font></font></font></font></font></font></font>
  - id: 91155
    user: 1262
    date: 2005-01-27T14:52:00
    date_raw: Thursday, January 27, 2005 - 2:52 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Adobe, to date, has not made much use of combining diacritical marks, because the languages they are addressing have not required them for encoding purposes. All the fonts I&#39;ve made for Microsoft, on the other hand, contain combining marks, and some contain OTL anchor attachment positioning for these.</font></font></font></font></font></font></font></font></font>
  - id: 91156
    user: 1133
    date: 2005-01-27T14:56:00
    date_raw: Thursday, January 27, 2005 - 2:56 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; an accent will not center over a letter it  <BR>&#62; follows. Software will be needed to position  <BR>&#62; the accent. I suppose it helps if the  <BR>&#62; software can make certain assumptions?  <BR> <BR>There are two possible scenarios. First, it is possible to specify precise coordinates by implementing anchor positions and an OpenType Layout &#34;mark&#34; feature. Applications such as Microsoft Word 2003 for Windows that support the &#34;mark&#34; feature will position the accents precisely as specified. If the &#34;mark&#34; feature is not included in the font, a layout engine such as that in Microsoft Word XP &#40;or Publisher XP, for that matter&#41;, the accents will be centered. Of course, there still will be layout engines that will not do anything reasonable and just put the accent right after the preceding glyph.  <BR> <BR>Note that OpenType Layout also allows for different glyphs to be substituted in certain contexts. Different stylistic variants of a glyph &#40;also accent&#41; can be substituted automatically if the glyph follows or precedes a certain glyph, or when the user activates a certain feature.  <BR> <BR>Adam</font></font></font></font></font></font></font></font>
  - id: 91157
    user: 1262
    date: 2005-01-27T14:57:00
    date_raw: Thursday, January 27, 2005 - 2:57 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">By the way, I never follow the recommendation to put spacing marks on an en space. I usually put them on the width of the lowercase o, positioned so that they would be in correct relationship to the o if superimposed. Then I can make the combining versions as composites and simply shift the left sidebearing onto the right sidebearing. This gives me reasonable rough positioning for the combining mark over a preceding a e or u, and perfect positioning over o, in applications that do not support GPOS mark positioning.</font></font></font></font></font></font></font>
  - id: 91159
    user: 1133
    date: 2005-01-27T15:03:00
    date_raw: Thursday, January 27, 2005 - 3:03 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">John,  <BR> <BR>so your combining accents have a zero advance width but they are centered at -50% of the &#34;o&#34; width? &#40;I.e. if &#34;o&#34; has a width of 400, then the centre of the combining accent is at -200?&#41; <BR> <BR>Adam</font></font></font></font></font></font>
  - id: 91188
    user: 5094
    date: 2005-01-27T17:40:00
    date_raw: Thursday, January 27, 2005 - 5:40 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Not to break an interesting discussion, but in passing, could you talk about how would one handle the scansion marks &#42;ictus&#42; &#40;a sort of large &#42;acute&#42;&#41; or the &#42;longum&#42; &#40;a sort of &#42;macron&#42;&#41;? With scansion marks, the mark is usually positioned in the middle of the syllable, so the longum and breve are much wider than the diacritics which go over a single letter. -- when we had to set a scansion breve, I&#39;d use one of the phonetic symbols -- a tie, I believe --then draw up a macron to match it. In classical prosody, you use the longum &amp; breve with Greek &amp; Latin; the ictus only is used in English. But as with most things, modern writers on prosody have adopted more symbols to show more things, so the ictus &amp; &#34;reverse ictus&#34; &#40;&#42;grave&#42;&#41; are now used with the longum &amp; breve. <BR> <BR>This becomes more of an issue as the &#42;file&#42; rather than the printed book becomes the end product of publishing. <BR> <BR>C</font></font></font></font></font>
