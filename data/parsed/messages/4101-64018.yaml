    html: '<font class="dontLookLikeCrap">Charles, the syllable-level scansion marks seem to be similar to the challenges of Hebrew masoretic mark positioning. This is a circle above the text that is properly placed as close as possible to the centre of a word &#40;taking into account that there may be other above-letter marks that will displace it slightly&#41;. Unicode has no mechanism for encoding marks relative to words, and smart font formats like OpenType have no mechanism for positioning marks relative to words. In both Unicode and OpenType, a combining mark belongs to the immediately preceding base character. So this means that a manual mechanism is required to allow the user to encode and position the masoretic mark as close as possible to the desired position. In effect, this means that the mark has to be positioned either above a base character or between two base characters. A greater level of refinement than that it difficult to obtain without user-controlled adjustment of mark positioning &#40;such as provided in the Middle East version of InDesign&#41;. <BR> <BR>This is the mechanism I worked out for the Hebrew masoretic mark, which perhaps will help you with your scansion marks. <BR> <BR>The mark is centered on a zero width &#40;this is actually common for Hebrew marks, due to the method of mark positioning used by some older Hebrew layout engines, and so differs from the typical left-offset of Latin marks or right-offset of Arabic marks&#41;. This means that when the mark is not positioned relative to a base using GPOS mark positioning, it will naturally rest between two base characters &#40;blind positioning&#41;. GPOS anchor attachment information is provided to position the mark above a preceding base character. This anchor attachment positioning becomes the default positioning. This positioning can then be inhibited by insertion of the zero-width non-joiner character between the preceding base and the mark, restoring the blind positioning between the two base characters. <BR><img src="http://www.typophile.com/forums/messages/4101/64086.gif" alt="Masoretic mark positioning"> <BR>[By the way, I&#39;m familiar with the term ictus in a different context: in Gregorian chant notation, it is the small vertical line below a note &#40;or in some note arrangements above&#41; indicating the first beat of the rhythm in that part of the melody.]</font>'
