    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks. I&#39;ve been dealing with a particularly challenging project. I needed a virtual pat on the back. <BR> <BR>The short answer is yes, I guess. Coming up with ideas is the real task, presenting them is the easy part. It&#39;s harder to present something that you only half-way believe in. <BR> <BR>Big versus small clients? I don&#39;t think there&#39;s a formula. The JetBlue stuff came to us because we were a smallish shop inside a big ad agency. They used our design services because we were all they could afford at the time &#40;they were a startup airline and we were certainly not Landor &#42;gasp&#42;&#41;. So, I had the fortune of having a dream client with big vision and big ideas yet with little cash for design. The results are simple in their execution--no spot varnishes or tricky printing--but the result is an ultra-clean design that I&#39;m quite pleased with. <BR> <BR> <BR>Cheers, <BR> <BR>//joe</font></font></font></font>
