p logo is awkward with the W and E.  <BR> <BR>Try working in another font for WEB maybe? <BR> <BR>The frst thing I thought of was a Golf ball getting stuck in a spiders web when I read the aims of the business.  <BR> <BR>But I know you want to avoid this. Yet it could herald an interesting identity. <BR> <BR>take care! <BR>k <BR> <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
