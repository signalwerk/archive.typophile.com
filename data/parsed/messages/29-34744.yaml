    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Geoff: <BR> <BR>That&#39;s definitely not the answer. You&#39;ve got a strong mark and I agree with Darrel, that this new element is detracting from it. <BR> <BR>A couple of random thoughts if you do want to try to make it work: <BR> <BR>1 Your idea might work OK on the bizcard if you completed the silhouette of the tee to bleed off of the bottom of the card. This gives it some purpose &#40;clarifying the tee of the mark&#41; vs. just repeating the existing mark in a weaker fashion. If you did this, you might also try typing golfweb really small and repeating it across the bottom edge of the card so that it is like grass. Also, centering it isn&#39;t very interesting. <BR> <BR>2 Maybe you can type golfweb really small and repeat it so that it floods the card &#40;grass&#41;, except for a round circle that represents a golf ball. You can even make the type get a little larger from top to bottom representing perspective. <BR> <BR>...just brainstorming thoughts. <BR> <BR>Aloha!</font></font></font></font></font></font></font></font></font></font></font>'
