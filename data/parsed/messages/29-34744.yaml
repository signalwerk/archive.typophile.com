  - id: 58943
    user: 3472
    date: 2004-05-05T06:08:00
    date_raw: Wednesday, May 05, 2004 - 6:08 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Golf balls are small and precious. The logo shown in #4 depicts the ball as being large, due to the large negative counterspace. As a suggestion, try making the green &#34;O&#34; extra bold. The tee would then come down at a sharper angle and therefore look more like a tee. The ball would also appear smaller, like a real golf ball.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 59609
    user: 3205
    date: 2004-05-10T05:47:00
    date_raw: Monday, May 10, 2004 - 5:47 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">G&#39;day. <BR> <BR>It has been awhile. I am up to my ears in design briefs at the moment. During the weekend I managed to find some time to do a few layout sketches. This is a first crack at a sketch I liked. Well, I like to do things simple, but in an original manner. I dont want to copy an over-used sucessful layout or anything. So one of my aims here is to create an unique and creative layout with functionality and &#40;this is going to be difficult!&#41; legibility. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/35551.gif" alt=""> <BR> <BR>The letter body text is 10point on I believe 13point Avant Garde Book. The rest of the type is 9pt &#40;I think it is readable, everything I get in the post is just under 9pt&#41; Avant Garde again in varying weights &#40;Bold, Medium and Book&#41;. I wanted to enclose the address and contact details into goftball shape, I think this could work. <BR> <BR>Honest crituque would be fantanstic. Thank you.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
