r, but not working here. I agree with Florian that the registred mark shouldn&#39;t be the center of the logo. </font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 58148
    user: 2236
    date: 2004-04-30T08:36:00
    date_raw: Friday, April 30, 2004 - 8:36 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Geoff: <BR> <BR>This is the first time in a while that I think Avant Garde is an appropriate choice for logotype. As you indicated in your original post, this is a work-in-progress, and as the rest of the posts indicate, you still have a lot of work to do. <BR> <BR>I like Avant Garde because it is a clean typeface which is appropriate for the golfing community. I also like the implications of balls &#40;we all know what I mean here&#41; created by the circular letterforms. I would suggest exploring more subtle approaches to manipulating the type than what you have done, thus far. <BR> <BR>The &#34;W&#34; with the &#34;R-ball&#34; implies a bouncing ball, which I don&#39;t think is the most beautiful shot to highlight. If I was showcasing a shot I think it would either be a long drive, or a perfect putt. The drive would require an arc and the putt would require a hole. I don&#39;t know if either of these would work into this logo, but you might sketch out a few ideas. <BR> <BR>The &#34;L-club&#34; looks much more like a hockey stick to me. That starts alluding to Happy Gilmore, which albeit is a classic in my eyes, but I don&#39;t know how the more serious golfing community views that one. <BR> <BR>Probably the most simple solution is to put some dimples in the &#34;O&#34; and call it good, but my guess is that the &#34;O&#34; in golf has been used as a golf ball hundreds of times over &#40;but I can&#39;t support that with any research at this time&#41;. As I mentioned above, I like the concept of implied balls and subtle letterform manipulation. <BR> <BR>Good luck! I&#39;m anxious to see what you come up with. <BR> <BR>Aloha! <BR>Scott</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
