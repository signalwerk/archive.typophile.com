ass="dontLookLikeCrap">G&#39;day <BR> <BR>I am working on a corporate identity for a business that creates websites for golf clubs. <BR> <BR>I am trying to avoid illustrating boring symbols ie. golfers, golfballs, putters, or the world wide web. Instead I decided to opt for a typographic solution. <BR> <BR>I played around with Avant Garde and came up with the idea of using the registered trademark symbol to symbolise a golf ball. <BR> <BR>It is a work in progress, it is in black and white for the moment. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/34745.gif" alt="First Idea"> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/34746.gif" alt="Second Idea"> <BR> <BR> <BR>What do you think?? Some feedback would be excellent. <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
