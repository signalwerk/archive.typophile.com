    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Ole, Digna sure does look nice. Unforunately, I don&#39;t have it, I&#39;m a sutdent desiging for a real client through the University.  <BR> <BR>So is there by any chance any clones of Digna that I can use? &#40;I noticed that Chase was able to recommend a clone of Univers Extra Condensed&#41; This way I can produce a mockup. <BR> <BR>Cheers.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 58523
    user: 2236
    date: 2004-05-03T10:27:00
    date_raw: Monday, May 03, 2004 - 10:27 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Geoff: <BR> <BR>You&#39;ve taken a good direction on this design. The icon is strong. A few suggestions� <BR> <BR>1 Do not use the icon and logotype together &#40;you may have alluded to this already&#41;. If you do, keep the logotype monochromatic, rather than changing the color on the &#34;o&#34;�only change the color in the logotype when the elements are used separately. <BR> <BR>2 Either use a darker/richer green for the icon or replace the black with a lighter color &#40;dark gray or dark neutral color&#41;. <BR> <BR>3 Potential logotype alternatives to your selected Avant Garde &#40;which I think works just fine&#41;�Akzidenz Grotesk or Berthold Imago. <BR> <BR>Great work. Aloha! <BR>Scott</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 58526
