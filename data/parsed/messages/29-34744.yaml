    date_raw: Monday, May 03, 2004 - 3:58 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Wow, impressive group work here. A lot of progress from the start! Since there&#39;s not much left to do here, I only have a quick question: <BR> <BR>Geoff, is the type used in numbers one and two above a font? I&#39;m referring to the very circular bauhaus/tech one. If so, i&#39;d love to know the name and where you got it. <BR> <BR>Thanks, and great work! <BR> <BR>Jeff Croft</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 58631
    user: 3205
    date: 2004-05-03T16:17:00
    date_raw: Monday, May 03, 2004 - 4:17 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Scott, you&#39;re right, I intended to do it that way, Ive already done some sketches for the stationary. I will not be using the logo and type together, that was the reason for me putting the logo in the &#34;o&#34; in &#34;golfweb&#34; so I could justify not using them together.  <BR> <BR>I agree with your comment about keeping the colours monochromatic, ta. <BR> <BR>Daniel, I think the website for my client is <a href="http://www.golfweb.com.au" target="_blank">www.golfweb.com.au</a>. It is nothing at the moment, I have to design a website for them, that may be the reason. <BR> <BR>Jeff, the type in numbers 1 and 2, I designed myself from scratch. I like it heh, maybe one day it&#39;ll be my first type project. <BR> <BR>Finally, I would like to thank everyone here for all the useful comments and critque. It has been incredible. Alot of my great progress goes to your credit, Thanks. <BR> <BR>I will post the final logo and subsequent works shortly. <BR> <BR>Cheers.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 58649
    user: 2619
    date: 2004-05-03T20:37:00
    date_raw: Monday, May 03, 2004 - 8:37 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think this has definitely gone a good direction, but I would like to point out that at smaller sizes, the notch in the &#34;o&#34; begins to resemble some sort of stencil, and my eye automatically begins looking for the same pattern in other letters. <BR> <BR>I tend to think that at small sizes, you lose the visual effect, and are left with &#34;golfweb&#34; with a green &#34;o&#34;.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
