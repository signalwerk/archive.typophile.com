    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">G&#39;day,  <BR> <BR><img src="http://www.typophile.com/forums/messages/29/34970.jpg" alt=""> <BR> <BR>Here is what Ive come up with so far... I like the idea of using the ball marque as the &#34;o&#34; in the &#34;golfweb&#34; logotype. This way I dont necessarily have to include the marque every time the logotype is displayed. This is crucial for the designs I have in mind for the business card, letterhead and envelope. <BR> <BR>Personally, I like number 4 with the avant garde typeface I think I prefer a circluar typeface as it complements the marque. I still like number 1 &#40;despite not using the  marque as &#34;o&#34; in &#34;golfweb&#34; it will be way too busy!&#41; <BR> <BR>Any comments or critques would be appreciated! <BR> <BR>Thanks in advance.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
