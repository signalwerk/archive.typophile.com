g here is to design something modern and upscale but friendly. <BR> <BR>I know I am posting ideas that are radically different to one other. The one I like at the moment is the circular/geometric &#34;golfweb&#34; logotype &#40;3rd on the top right&#41;. I feel the geometric circluar shape reminds me of golfballs. What do you think? <BR> <BR>Keywords for this project for me are golf, web design and cocnnection/interation. As Golfweb is essentially a web design company for golf clubs. <BR> <BR>Thank you for the honest critque. <BR> <BR>Cheers. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/34920.jpg" alt=""></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
