  html: '<font class="dontLookLikeCrap">---------------------------------- <BR><a href="http://www.typofonderie.com/gazette/hot_news/?id=214" target="_blank">http://www.typofonderie.com/gazette/hot_news/?id=214</a> <BR><a href="http://www.typofonderie.com/profile/profiletg" target="_blank">http://www.typofonderie.com/profile/profiletg</a> <BR> <BR>We are happy to announce that Tom Grace has joined <BR>Porchez Typofonderie to work as type designer. Tom will <BR>work on current custom fonts projects, his notable first job <BR>is the completion the House of Dereon typeface family. <BR>In addition, we will finally be able to finish some conversion <BR>of our library to OpenType this year. <BR> <BR> <BR>---------------------------------- <BR>Porchez Typofonderie: <BR>Founded in 1994, Porchez Typofonderie is an independent <BR> digital type foundry in France, designing, manufacturing <BR>and selling high quality typefaces for adventurous digital <BR>typographers. This is the only place in the world to buy our <BR>typefaces. <a href="http://www.typofonderie.com/profile/" target="_blank">http://www.typofonderie.com/profile/</a> <BR> <BR>Porchez Typofonderie <BR><a href="http://www.typofonderie.com/" target="_blank">http://www.typofonderie.com/</a> <BR>Buy and download your PTF fonts safely. <BR> <BR>14 rue Paul Bert <BR>92240 Malakoff, France <BR>33 &#40;0&#41; 146 542 692 Telephone <BR>33 &#40;0&#41; 146 540 464 Fax</font>'
