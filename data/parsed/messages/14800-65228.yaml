  html: '<font class="dontLookLikeCrap">I was so excited to see all the great ideas people had for the post on the &#39;deaf&#39; logo. It would be exceedingly helpful to me if you talented people wouldn&#39;t mind taking a crack at another.  <BR> <BR>For two years this non-profit organization has attempted to get something together but they barely speak English and have no contacts whatsoever. The organization is based in California. I do know that they would like their logo to include: <BR> <BR>A hand on a plow <BR>The incorporation of either the full name of the organization &#39;Kongor Development Association&#39; <BR>OR the abbreviation, &#39;KDA&#39;  <BR> <BR>You guys rock!</font>'
