  html: '<font class="dontLookLikeCrap">Gigantacorp has three job openings coming up. Two for typographers, one for an electronic production person, both in advertising. These are NOT design positions, but production positions. Basically you are taking designs from art directors and creating electronic documents that are beautiful and printable. <BR> <BR>Feel free to e-mail me for more information: <BR> <BR><a href="mailto:kristin.dooley@target.com">kristin.dooley@target.com</a></font>'
