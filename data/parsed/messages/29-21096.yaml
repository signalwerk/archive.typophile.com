    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Peter: <BR> <BR>I am sorry I dont&#39; have much time right now to illustrate more appropriately what I will reference, but hopefully this will do. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/21151.jpg" alt="Suede Logo"> <BR> <BR>I like where you are headed overall, and I like the hard corners on the &#34;U&#34;. Rather than morphing the &#34;U&#34; into the other letters I would go the opposite direction. The &#34;U&#34; has the most character of all the letters, so why not let it set the trend. Do as JT suggested and as I have so poorly illustrated�mold the &#34;D&#34; to follow suit. <BR> <BR>I am seeng the same spacing in the crossbars as Randy, so I flipped the &#34;E&#34;s and rotated the &#34;S&#34; 180 degrees. I&#39;m not sure how you&#39;re measuring them, but there seems to be a pretty clear distinction between the flipped/rotated letter forms and the originals. Also, I wonder if the crossbar on the &#34;E&#34;s is long enough. Like I said, I have limited time, so I couldn&#39;t try that one. <BR> <BR>I started to mess with the kerning also, but it still needs a little more caressing. I hope this helps with some further exploration. <BR> <BR>Aloha! <BR>Scott</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
