    date: 2003-11-25T09:54:00
    date_raw: Tuesday, November 25, 2003 - 9:54 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Stephen, <BR>I totally hear you, and I know exactly what you are talking about.  But let&#39;s have a look at the U with terminals.  I think that top horizontal loses something.  But I will say, now that I have done that the terminals on the U before do look somewhat anemic. <BR> <BR>So I think I will now try this:  <BR>Keeping the outside of the terminal round, and having flat on the inside.  Make sense?  What do you guys think? <BR> <BR>re:liquid in the glass.  I tried that, but it looked cheesy to me.  This space will evolve into a restaurant at some point as well, so it needs to be a &#39;scalable&#39; logo--don&#39;t want it to be strictly a drink spot.  <BR> <BR>Thanks for all your help.  I knew this would get better by showing it here, and it is.<img src="http://www.typophile.com/forums/messages/29/21225.gif" alt=""></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
