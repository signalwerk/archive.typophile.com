    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Stephen, <BR>I was aiming to keep the horizontals as flat as possible.  The only curves are on the vertical part of the letterforms.   <BR> <BR>Randy, <BR>It is center.  What do you think, should the top whitespace of the s be like 60% and the bottom whitespace of the s be like %40?  Or is more of a 55/45 ratio? <BR> <BR>JT, <BR>I styled the S after the U and thought I had the D close enough to make it relavent to the other letters, but perhaps the D should not flatten out like it is....I will look into what you are suggesting. <BR> <BR>The U is styled after a glass, a thick bottem tumblers glass that the club will incoorporate into it&#39;s glassware.  The U will also be used as part of an icon set.  But the U will have an olive or a straw or some icecubes in it. <BR> <BR>I had the same feeling about the counterform of the U as well, but I think if I straighten up those curves this logotype will loose much of it&#39;s character. <BR> <BR>Thanks for your thoughts, fellas.  Would like to hear back from you now that you have some more info. <BR> <BR>Here&#39;s a bigger version: <BR> <BR><img src="http://www.typophile.com/forums/messages/29/21137.gif" alt=""></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
