    html: '<font class="dontLookLikeCrap">&#62;There are a fair number of faces from one big foundry &#40;Lino? Mono?&#41; that have tabular OsF, as I recall. <BR> <BR>I always put tabular OSF in my typefaces: if you&#39;re designing a new typeface, why not? It reduces unnecessary fonts. No need to follow the serif model. <BR> <BR>The &#34;one&#34; in most proportional sans OSF is slight; a wider form of the glyph, with pronounced serif&#40;s&#41;, is more distinctive. However, I will admit that proportional OSF may integrate better into U&amp;lc text, in some weights of certain sans faces &#40;the lc being proportional&#41;, but the little &#34;one&#34; is still problematic. <BR> <BR>Also helpful in achieving even color in a sans OSF: an extra &#34;serif&#34; at the top left of the &#34;7&#34; improves fit. <BR> <BR>These features are both in Fontesque Sans, and Preface.  <BR><img src="http://www.typophile.com/forums/messages/30/64629.jpg" alt="Sans OSF"></font>'
