    html: '<font class="dontLookLikeCrap">thnx for the comments guys.... yea the green one i had only a weekend to think out and complete. the bottom one had a lot more thought into it.. about a week or so. <BR> <BR>ole .... the script font is called ito regular E. Its a free font you can get <a href="http://www.dafont.com/en">here</a>. Designer I think is: <a href="http://www.kinemamoon.com/" target="_blank">http://www.kinemamoon.com/</a> <BR> <BR>The Funktion typeface is a new release from Fountain called <a href="http://www.fountain.nu/catalogue/ftn_farao.asp">Farao</a> <BR> <BR>Cheers <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0></font>'
