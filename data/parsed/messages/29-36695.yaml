  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi... new to the boards here. I follow a lot of threads but this is my 1st post.  <BR> <BR>Ive always found it a bit of challange to design club flyers... it always seems as if the promoter wants to add these massive bios and jam as much information u can possibly image onto a 4x4 hand out. I was wondering if anyone here does these quickturnaround type designs for fun or for clients. Here are 2 flyers ive recently done for a night here in chicago...  <BR> <BR><img src="http://www.typophile.com/forums/messages/29/36696.jpg" alt="june flyer"> <BR><img src="http://www.typophile.com/forums/messages/29/36697.jpg" alt="april flyer"></font></font></font></font>
