  - id: 40466
    user: 1932
    date: 2003-12-08T04:14:00
    date_raw: Monday, December 08, 2003 - 4:14 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I like the idea of cooking/serving good &#40;tasty&#41; design, Troy. But I am not sure if those quite rigid letters correspond to the very dinamic figure of a cook/waiter. <BR> <BR>Maybe you should try to keep this 30s-like composition, but combine it with a more contemporary font. It could communicate meaning like &#34;contemporary design served in a 30s manner&#34;.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
