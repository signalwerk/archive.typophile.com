    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">pig?  haha...it&#39;s a chef, right?  and that&#39;s his apron tied in the back, right?  &#40;not a curly pig tail&#41;  i think his raised leg needs to be a little longer and maybe not curving up so much. <BR> <BR>i agree with tiffany wardle though, that the big circle takes away focus on the wonderful little guy.  maybe avoid the circle and have &#39;design&#39; going horizontal. <BR> <BR>also, i think TASTY looks mis-scaled.  try evening out the curve over the tops of the letters.  make the second T smaller i think, and maybe move the Y left a bit....or do completely different tries with other fonts.  you gotta do 20 to get 1.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
