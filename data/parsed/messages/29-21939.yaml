    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I knew I saw that waiter before, Deco Dingbats 1, Capital G<img src="http://www.typophile.com/forums/messages/29/22043.gif" alt="Running Waiter"></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 40750
    user: 108
    date: 2003-12-10T08:28:00
    date_raw: Wednesday, December 10, 2003 - 8:28 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Troy ... as Daniel has discovered your use of a dingbat, I would highly suggest even more modification than you have already done. What if the apron was blowing behing him a bit? And you might also want to change the chef&#39;s hat to the more traditional one, or rather the one that most people identify with chefs. Perhaps more of a round nose and less of a carrot stick. Just suggestions.</font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 40918
    user: 1210
    date: 2003-12-11T12:14:00
    date_raw: Thursday, December 11, 2003 - 12:14 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks for the comments and suggestions. I will post another few possibilities soon. <BR> <BR>My illustration was based on a piece of clip art I found in one of Dover&#39;s books -- which apparently was also the basis for the dingbat. I am curious about the issue of incorporating illustration work done by someone else -- do you think there&#39;s something wrong with that? Obviously it&#39;s in the public domain so I&#39;m not stealing anything from anyone. Is there any difference between that and using another person&#39;s typeface design &#40;which this is&#41;? <BR>Is it just because it&#39;s a logo? I see designs &#40;including logos&#41; all the time that obviously incorporate old artwork. &#40;Art Chantry&#39;s work comes to mind.&#41; <BR> <BR>I don&#39;t mean to argue with you, I sincerely am interested in what you think. <BR> <BR>Maybe it&#39;s better for me to explore type-only solutions &#40;especially if the chef looks like a pig --ha!&#41; <BR> <BR>Thanks, <BR> <BR>Troy</font></font></font></font></font></font></font></font></font></font></font>
  - id: 40986
    user: 1932
    date: 2003-12-12T00:13:00
    date_raw: Friday, December 12, 2003 - 12:13 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Troy, it is probably legal to use a &#34;prefabricated&#34; ilustration. The problem is that you do not have exclusive rights to use it., so your neighbour may use the very same ilustration in his logo some day. In such a case you could have a tough time telling your clients that you &#34;serve&#34; original design done exclusively for them... </font></font></font></font></font></font></font></font></font></font>
  - id: 40989
    user: 1014
    date: 2003-12-12T00:55:00
    date_raw: Friday, December 12, 2003 - 12:55 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think there was a miscommunication ... but Matjaz makes <BR>the point that Tiffany meant to make, I think, about the <BR>distinctiveness factor. <BR> <BR>Just taking that a step further. It isn&#39;t &#42;probably&#42; legal, <BR>it&#39;s legal legal legal. <BR> <BR>I think the word &#34;discovered&#34; made it sound like you had <BR>done something wrong, which clearly, you didn&#39;t and <BR>clearly that wasn&#39;t Tiffany&#39;s intention. <BR> <BR>All that said ... <BR> <BR>I looked at your original intentions &#40;non-corporate, entertainment focus&#41; <BR>and the Retro 30s look, imo, is not your strongest direction. <BR> <BR>The Tasty type treatment is problematic because the <BR>T and Y are rendered so small in comparison to the  <BR>other letters. I do enjoy the letterforms themselves. <BR> <BR>And the logo could just as well be for a caterer or cake designer. <BR> <BR>The word &#34;Tasty&#34; is not the easiest thing to illustrate ... <BR> <BR>Sometimes the solution just comes from sketching or <BR>fiddling in Illustrator. When it doesn&#39;t come right away, <BR>one thing that I&#39;ve found works is to try to pour out <BR>26 solutions or 26 ideas in 26 minutes.  <BR>The 26 can be thought of as arbitrary guide, but if you <BR>get stuck, the specific letter can be an ideation catalyst. <BR> <BR>These can be quick sketches or just words: waiter with serving tray. <BR> <BR>From those ideas, take a handful of your best and render <BR>them in pencil and go from there in illustrator. <BR> <BR>Just one approach, and of course, my opinions are just that. <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> <BR> <BR>PS, as far as use of images by Chantry, etc., Daniel previously <BR>linked this article from CreativePro. <BR> <BR><a href="http://www.creativepro.com/story/feature/20305.html" target="_blank">http://www.creativepro.com/story/feature/20305.html</a> <BR> <BR> <BR> <BR>bj <BR> <BR></font></font></font></font></font></font></font></font></font>'
  - id: 41090
    user: 2203
    date: 2003-12-12T12:30:00
    date_raw: Friday, December 12, 2003 - 12:30 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Troy, I think you have two separate ideas that you are trying to force together. A 30&#39;s retro theme and illustrating tasty design. If its the 30&#39;s feel you are after maybe the word you are looking for isn&#39;t tasty, but Elegant might fit better. In either case follow PJ&#39;s advice, I once had a mortgage refi project and I presented 15 concepts, marker on paper, 75 concepts later I got the 3 that left the agency and i can tell you I&#39;d still be working on them if I did it on a computer.</font></font></font></font></font></font></font></font>
