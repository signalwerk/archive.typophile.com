    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">One thought that may or may not apply here. In a time where everyone uses email, recieving a nice printed piece of paper with the company identity in offset or even letterpress with some communication on it can stand out quite nicely. <BR> <BR>So, from a marketing standpoint printed letterhead could serve a purpose. <BR> <BR>Sorry, I do not have an answer to your question, but I thought I would at least share a little. <BR> <BR>Good luck with your project. <BR> <BR>Mike</font></font></font>
  - id: 92155
    user: 2021
    date: 2005-02-04T05:17:00
    date_raw: Friday, February 04, 2005 - 5:17 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Would this work? -- <BR> <BR>Make the typesetting and the logo one single file created in Illustrator, with &#34;convert to outlines&#34; applied to the type. Then place it in your letterhead document. <BR> <BR>If you&#39;re working in Word, this will also give you nicely fitted type, which you wouldn&#39;t otherwise get, as Word doesn&#39;t support the kerning in a font.</font></font>
  - id: 92162
    user: 1788
    date: 2005-02-04T06:02:00
    date_raw: Friday, February 04, 2005 - 6:02 am
    votes: null
    html: <font class="dontLookLikeCrap">Mike, <BR>I agree with you and that was also my point &#40;or rather, I would consider it as being a good point, as I was trying to persuade the then-client with traditional arguments&#41;, but as I see what kind of correspondence comes and goes here, there is no need for perinted matter, and the guys want to have everything done in 2 minutes. Sending a letter with a snail-mail would cost them time and money &#40;time would be the 1st reason at all&#41;. :/ <BR> <BR>Nick, <BR>I&#39;ve made them a letterhead a year or so before, embedded it into Word file and they were using it as a template for all their writing. Now, as I am working with them, I try to set things nice and clear. Franklin Gothic was used as a corporate font and they even succeded in using it consequently throughout the correspondence &#40;which made me glad and proud of them&#41;. One could even embed it, if he wanted. Now I am trying out a new font, FF Kievit, which I have only as a Type1. Word still seems a good - or rather the only possible - way to go, but I cannot embed the font into the document. :/ <BR> <BR>Ah, courier has just brought me the Adobe CS! Nice...</font>
