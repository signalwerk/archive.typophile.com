  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hello Typophiles, <BR> <BR>I am working on an identity for my old client, now the employer. Actually, it is a very little bit of re-design, and mostly working out a set of routines and documents for office use - with renewed CI. <BR> <BR>&#40;Set up&#41; <BR>As the correspondence is mostly being sent per email, there is no real need for the letterhead being offset-printed &#40;First, I was against it, totally. But then, if you think about it, it makes sense - why have a stock of 1000 sheets of paper without any good use?&#41;. <BR> <BR>&#40;Issue&#41; <BR>Anyway, I am now trying to make &#34;a form&#34;, be it a Word or a Acrobat document or anything other format, with letter-head embedded, where a colleague of mine could type his or her letter. So now I am struggling with the following problem: <BR>- I cannot embed Type1 fonts into Word-documents and I don&#39;t have and cannot make Windows convert my Type1 font to TrueType, which is what Word could have possibly embedded; <BR>- if I use Acrobat and make a form there, it wouldn&#39;t add a page automatically, so it&#39;S always a one-pager &#40;plus, it has printed the footer as if it was a blurred image, though it was just a font&#41;. <BR> <BR>&#40;Additional&#41; <BR>I have Adobe CS coming my way, with Acrobat 6 &#40;I think&#41; packed inside. For a 5 people office it should be ok to install it, if we need it &#40;I asked the shop, they said - oh, sure&#41;. <BR>We have MS Office. <BR>The fonts are all Type1 &#40;ttf versions would cost us the same price again - thank you FontFont&#41;. WinXP says it cannot convert Type 1 font as the copyright forbids to do so &#40;thank you FontFont again&#41;. <BR>I have ATM DeLuxe installed. <BR>I have no font editor installed and am not going to have one. :/ <BR> <BR>What would you recommend? <BR> <BR>I know, this sounds like, &#34;oh, I am so dumb and poor and lazy&#34;, but I am trying out everything, what I can - and stuck pretty much on the same place... :/</font></font></font></font>'
