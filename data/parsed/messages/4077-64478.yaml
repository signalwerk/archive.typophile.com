  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;m just researching a uni project and i&#39;m thinking of exploring this area, anyone know of any modern examples of the use of ligatures etc? <BR> <BR>I&#39;ve just had a look at tomato&#39;s In the belly of St. Pauls, set in Mrs. Eaves, which i found interesting.  Any general inspiration would be nice! <BR> <BR>Also do you think these traditionally cursive letterforms can be a constituent part of graphic design?</font></font></font>
