    html: <font class="dontLookLikeCrap">This doesn&#39;t really address your question, but <a href="http://www.presencetypo.com/pdf/Prestige.pdf">Prestige</a> has a truly marvellous selection of ligatures. Sadly I haven&#39;t seen it in use, that I&#39;ve noticed. <BR> <BR>I expect other people will be able to come up with some good recent examples of ligs actually being used.</font>
