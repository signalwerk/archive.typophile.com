    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">You need to look at the offerings of the French foundries around that time, like at Deberny. Look to the articles by Ovink in Quaerendo, as well as the works by Audin and Thibaudeau. <BR> <BR>But actually, Baskerville became very fashionable in France shortly after Voltaire &#40;and continues to hold a special place in French publishing&#41; so it might be the best choice. On the other hand, its design goes against the &#34;antique&#34; look. <BR> <BR>hhp</font></font></font></font></font></font>
