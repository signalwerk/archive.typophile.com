    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Well, Baskerville&#39;s fonts were used to print the works of Voltaire, but that was towards the end of the 18th century, not around the middle as the date there says. Plus the &#34;E&#34; is not Baskerville. <BR> <BR>Serge, do you have a better scan, or maybe some publication info? <BR> <BR>Also, I have to ask: how close do you need to come, and would that include the &#34;weathered&#34; look? <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font></font></font></font>'
