    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thank you all! <BR> <BR>This is the title of the very first edition of Candide. <BR>I got this image from the web.  <BR>I think I can create the &#34;weathered&#34; look myself but I would like to know what font would be used at the time when Voltaires&#39; works were published.</font></font></font></font></font></font></font></font></font></font></font>
