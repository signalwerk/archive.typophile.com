    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Ive been looking for something like this for a long time! <BR> <BR>Seems like this is the only reference book available for Fontographer. Why is this? Is anyone else supicious? Why are there so conspicously few typrographic software programs? And why is it that the main one &#40;Fontographer&#41; hasnt been updated for the best part of a decade and is no longer distibuted by Macromedia? Why is there only one&#40;?&#41; reference manual available for it and why has its publisher stoppped publishing it and mysteriously refuses to pass on the rights etc? Is there some kind of conspiracy going on? The truth must be out there...? </font></font></font>
