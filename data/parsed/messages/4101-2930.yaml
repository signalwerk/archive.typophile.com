    date: 2003-10-12T18:17:00
    date_raw: Sunday, October 12, 2003 - 6:17 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">A couple of points: <BR> <BR>Copyright law varies from country to country, and in many jurisdictions, notably in most of Europe, it is considered fair use to make a copy of a work for your own personal use. This means that it would be legal in some jurisdictions for you to go to a library and photocopy the entirety of <i>Fontographer: type by design</i>. <BR> <BR>However, I&#39;m not aware of any jurisdiction in which it is legal to <i>publish</i>, i.e. to make public, a work without obtaining rights from the copyright holder. Making a PDF version of a book available on the Internet for other people to view and download is not the same thing as making a copy of the book for your own personal use: it is publishing. The fact that a book is out of print does not mean that it is out of copyright, and it is neither legal nor ethical to <i>publish</i> someone else&#39;s work without permission. <BR> <BR>Yes, Moye&#39;s book is out of print, but that doesn&#39;t mean it is not available. Copies show up in second hand bookshops, on Ebay, etc.</font></font></font>'
