    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Big news for a lot of anxious people. <BR> <BR>Is this legal? Anyway, if the publisher of the print version didn&#39;t think they could make money on a reprint, then they probably don&#39;t care. On the other hand, they could have gained some positive exposure by releasing the PDFs themselves, maybe even selling the book in PDF form - FontLab does that with their manuals. So a small lesson for MIS Press. <BR> <BR>BTW, it&#39;s interesting that the text is text, not image. That might mean OCR was done, which would make it more work. Or maybe somebody provided the original digital files? One clue would be the body font: from what I remember Moye had modified Goudy&#39;s Italian Old-Style &#40;giving the &#34;y&#34; a longer tail&#41;, and an OCR scheme wouldn&#39;t have that &#40;unless the person had that special font&#41;... And the PDFs seem to be using the non-Moye short tailed version. <BR> <BR>hhp </font></font></font>'
