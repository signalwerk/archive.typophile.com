    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">There is an entire saga surrounding Mr. Moyes book of which I believe the story goes something like this, anybody who has first hand information, please contribute . . . <BR> <BR>I believe all of the publishing rights to the book are still owned by MIS Press. Since the time of its publication MIS Press was absorbed by Hungry Minds and now Wiley Publishing and Wiley has no intention of selling them back or reprinting the book. <BR> <BR>This puts Mr. Moye in a bad situation since he doesn&#39;t legally own the content and cannot buy the rights to the book back. <BR> <BR>I had tried many times to contact Mr. Moye and he blacklisted me from his e-mail list apparently not interested in discussing the matter at all. <BR> <BR>I would genuinely like to see a follow up to this book and even a re-release since the information the book contains is as useful now as it was when it was originally published. <BR> <BR>Stuart :D</font></font></font>
