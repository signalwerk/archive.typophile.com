    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> No conspiracy that I can see, just that fonts are worth close to nothing these days. Why? Partly &#42;because&#42; of Fontographer &#40;the so-called &#34;democratization&#34; of type design&#41;, but maybe also because their file-size is so small. Some people also blame a certain low perceived value among the public &#40;the alphabet is free, blahblahblah&#41;, but I&#39;ve started to think that such &#34;high-level&#34; cultural stuff is a side-effect, not a cause. <BR> <BR>hhp </font></font></font>
