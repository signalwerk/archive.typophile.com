    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">News of a possible new edition of <i>Fontographer: Type by Design</i> and how the rights to the book reverted to its author can be found here: <BR> <BR><a href="http://typographi.ca/000600.php#000600" target="_blank">http://typographi.ca/000600.php#000600</a> <BR> <BR>Thomas, Dan, John: it wasn&#39;t my intention to promote book piracy. But I, too, searched for this book and ended up finding a copy in the library, and resorted to photocopying the first three chapters. As far as I know, the website where the PDF version is posted isn&#39;t charging any money for viewing the PDFs -- how different from the library is that? And it&#39;s not even a good PDF, as parts of the book seem to have been scanned with OCR software, so that there are typos -- and those sections don&#39;t use the same font as the book, so the text doesn&#39;t justify properly, etc. If the book was available somewhere, at a reasonable price &#40;not the 200&#43; dollars they are asking for on some websites, which I can&#39;t afford!&#41;, I&#39;d buy it in a second.</font></font></font>'
