    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;m with HD. There doesn&#39;t seem to be any problem-solving with your &#34;directions.&#34; You&#39;re just making the &#34;thread&#34; in the green square thicker and changing the typeface. Have you come up with any new ideas? <BR> <BR>I also don&#39;t see the necessity of a redesign. Maybe you could add a more natural typeface to it and create a more elegant whitespace flow inside the box...I&#39;d think about how the white-space &#34;thread&#34; flows inside the green box. It&#39;s too mechanical in yours, which is the problem I see with the original. That &#34;thread&#34; &#40;white space in the box, whatever it&#39;s supposed to be, I think of a piece of thread for sewing&#41; could flow into and out from the box better. If it&#39;s supposed to be a &#34;V&#34; then you can make it better. <BR> <BR>The type you have makes me think I&#39;m about to walk into a state-of-the-art Oxygen bar or something. I don&#39;t know much about textile companies &#40;feel free to give some more info&#41;, but this doesn&#39;t have the feel to me. <BR> <BR>What are you trying to say with this identity?</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
