    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Perhaps the original mark was meant to evoke curtain <i>manufacture</i> rather than curtains. Or maybe not. <BR> <BR>What if you took the the more perspective-ish style of Tom&#39;s idea and made it more regular and folded looking, like a curtain being pulled back &#40;and more like a V&#41;? Like this: <BR> <BR><img src="http://www.typophile.com/forums/messages/29/24732.gif" alt="Velana suggestion"> <BR> <BR>Please forgive the rushed look. The curves would need to be repositioned, but the basic idea is there. I threw Lucida Sans under there just on a whim to see how it&#39;d look. There are better type suggestions in this thread.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
