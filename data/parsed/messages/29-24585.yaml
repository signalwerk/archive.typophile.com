  - id: 45373
    user: 1864
    date: 2004-01-22T16:58:00
    date_raw: Thursday, January 22, 2004 - 4:58 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Tom, <BR> <BR>Your design feels like cosmetics to me, particularly lipstick. <BR> <BR><i>The reason I picture it more fluid is because textiles are used for clothes and curtains and when I think of those things I picture flowing fabrics. I am not an expert so I may be way off. I realize technically the fabric is not fluid and it is straight up and down. I am thinking of the end products after it is made. Just a different way to approach it.</i> <BR> <BR> Your logic seems on par for home decorating companies or commercial curtain retail in general, but Velana manufactures curtains. <BR>Smooth and flowing seems inapropriate. <BR> <BR>One man&#39;s opinion... <BR> <BR>  <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 45376
    user: 2236
    date: 2004-01-22T17:49:00
    date_raw: Thursday, January 22, 2004 - 5:49 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">To Tiffany&#39;s point, the identies found in the interior design world &#40;and much of what is associated with it&#41; often uses extremely clean and simple geometry. Personally, I love that look as opposed to the alternative gaudy designs that I also find common in the industry, but it is also very refreshing when that norm is broken. <BR> <BR>I&#39;m not sure that the resemblance of Tom&#39;s concept to cosmetics is such a bad thing. This indicates that it has a feminine appeal, which is very appropriate to the fashion and textiles industry. <BR> <BR>IMO, go with the &#34;flow&#34;. <BR> <BR>Matjaz, I like the mark on your last posting better than the other ones, but I&#39;m still not feelin&#39; the type in combination with the mark. I know there&#39;s an awesome solution buried somewhere here�hopefully not too incredibly deep. <BR> <BR>Aloha! <BR>Scott</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 45380
    user: 2172
