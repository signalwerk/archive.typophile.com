    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The logo makes me think of plumbing. Assuming they won&#39;t allow you to just dump the old metaphor, if you could throw some angles in there &#40;like in the letterforms of the [new] type&#41; that would help. And try using texture, like maybe letters made up of bands or something. <BR> <BR>hhp <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 45184
    user: 2664
    date: 2004-01-21T10:22:00
    date_raw: Wednesday, January 21, 2004 - 10:22 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The &#34;v&#34; in the &#34;Current logo &#40;to be redesigned&#41;&#34; looks kind of like the folds in fabric or curtains.  Do you know if this was intentional?  Either way, perhaps you could make this more obvious through a reworking of the mark.  I agree with some of the other posts about the type--the &#34;Current logo &#40;to be redesigned&#41;&#34;.  I like it how it is.  It will likely endure for another twenty years.  However, it does look somewhat like Parmalat, which is not a good association in Europe right now.  <BR><img src="http://www.typophile.com/forums/messages/29/24613.jpg" alt=""> <BR><a href="http://news.bbc.co.uk/1/hi/business/3401785.stm" target="_blank">http://news.bbc.co.uk/1/hi/business/3401785.stm</a> <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 45187
    user: 2236
    date: 2004-01-21T10:36:00
    date_raw: Wednesday, January 21, 2004 - 10:36 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The original mark is too straight, like plumbing pipes as Hrant identified. Even straight patterns in textiles have curves once you look up close. <BR> <BR>I would suggest that you do something to make this feel more human or fabric like. Not so vertical, horizontal, or straight. Make it flow. Push a more freeform, flowing direction, then if necessary, bring in some more gridded design to control the potential chaos. Am I making any sense? Some of the illustrations in the link below might help loosen you up a bit, but notice how alot of them maintain a controlled grid combined with free flowing forms. <BR> <BR><a href="http://www.chapter3.net/" target="_blank">http://www.chapter3.net/</a> <BR> <BR>Aloha! <BR>Scott</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 45201
    user: 2739
    date: 2004-01-21T11:56:00
    date_raw: Wednesday, January 21, 2004 - 11:56 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Ah. I see the whitespace looking like folds of a curtain now. I would have never seen that w/o Ty&#39;s estimation. This could be very cool. <BR> <BR>How &#39;bout something like this: <BR> <BR><img src="http://www.typophile.com/forums/messages/29/24624.gif" alt="velana"></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 45250
    user: 1932
    date: 2004-01-22T02:41:00
    date_raw: Thursday, January 22, 2004 - 2:41 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; It&#39;s too mechanical in yours, which is the problem I see with the original.  <BR> <BR>Thanks Daniel and others who suggested this! It is kind of strange that I haven&#39;t seen such an obvious solution. Velana&#39;s brand is quite known here in Slovenia, so I think I wasn&#39;t able to look at it from the proper distance.  <BR> <BR>So this is a solution with a more organic flow of the &#34;curtain&#34;. I also tried Jacques&#39;s suggestion of rounded corners &#40;despite I was first sceptical about this solution&#41;. <BR> <BR> <BR>&#62; Damn, I like the old one just fine. <BR> <BR>Maybe it sounds strange HD, but actually I like the current logo, too. But redesign &#40;into more trendy ID&#41; was the brief so I am trying to do my best. I am trying &#40;hard&#41; to balance between a very trendy ID and something that would not become a bad design tommorow. <BR> <BR>Thanks again. <BR> <BR> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/24673.gif" alt="velana_b1"></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 45252
    user: 618
    date: 2004-01-22T05:06:00
    date_raw: Thursday, January 22, 2004 - 5:06 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Matjaz, <BR> <BR><i>I am trying &#40;hard&#41; to balance between a very trendy ID and something that would not become a bad design tommorow.</i> <BR> <BR>The problem here IMHO, is the type. I think this kind of lettering reaks of present trends: a monoline where the v=n e=a etc. It does so in the same way that photolettering smells of the 1970s and now looks dated. So be careful with this approach. <BR> <BR>One way to distance yourself from this problem might be to use more traditional forms, but keeping the monoline &#40;eg Foundry Monoline&#41;. Or you could try a fresh take on an established genre &#40;a neo grotesque, or humanist sans, or a semiserif&#41;. How about some of Storm&#39;s offerings: Teuton, Sebastian, John Sans, or Dyna Grotesque? Maybe contact Christain Robertson about using Pill Gothic! There&#39;s an idea. Good luck! <BR> <BR>Randy</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 45270
    user: 2172
    date: 2004-01-22T08:22:00
    date_raw: Thursday, January 22, 2004 - 8:22 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;m going to echo most of the other posts here, and say that the old logo isn&#39;t bad, just old. I think that Daniel&#39;s suggestions tap into a good new direction. There&#39;s still a lot there in the old Velana logo. It just looks a bit stuffy, IMO. <BR> <BR>I think the type should stay close to its original &#40;in terms of the typeface&#41;, and maybe even a similar orientation of mark to type, particularly because it&#39;s quite known in Slovenia. Plus, if you keep the same rough proportions, it can be used in ways similar to the old logo. Don&#39;t be too eager to violate the brand equity. I do like your tweaking of the logo in the A examples. The B example looks nice, but starts to lose the &#39;V&#39; quality of the old mark. The dip seems too shallow to me, if you&#39;re going to make the curves more exaggerated. <BR> <BR>Be sure to emphasize to your clients the difference between &#39;new and fresh&#39;, and &#39;disposable&#39;.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 45288
    user: 1864
    date: 2004-01-22T09:48:00
    date_raw: Thursday, January 22, 2004 - 9:48 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Just some of my thoughts: <BR> <BR>I like the scale and cropping of the A series. <BR>It keeps the interesting ripple shape of the former logo, while creating a more pleasing negative positive relationship.  <BR> <BR>The candy apple green is more appealing than the pea green. <BR> <BR>Like Jacques, I would be interested in seeing the letters of the name interconnected. <BR> <BR>The B mark destroys the previous identity with no added benefits. <BR> <BR>Andrew</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
