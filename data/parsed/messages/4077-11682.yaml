    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Sorry everyone, I hit the &#34;send&#34; button too quickly here� please read my next message below!</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 82745
    user: 1085
    date: 2004-11-14T13:44:00
    date_raw: Sunday, November 14, 2004 - 1:44 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>&#62;Using it for something such as a history of Yiddish would, I think, only serve to strengthen the box <BR>that Blackletter has been placed in.</i> <BR> <BR>This sort of book has probably been printed in blackletter several times, albeit most of them pre-1941. <BR> <BR><i>&#62;How about a children&#39;s book set in Blackletter? Or a cookery book? And if not, why not? I am not sure what I think of these yet, but I would like to see how others react... :-&#41;</i> <BR> <BR>No one would buy it <IMG SRC="http://www.typophile.com/forums/clipart/sad.gif" ALT=":-&#40;" BORDER=0> <BR> <BR>Another thing to remember: there are several types of blackletter &#40;as has been mentioned over and over again above&#41;. Some of them are optimized for the setting of the German language, and some of the�like rotundas and some bastardas�look terrible in German! These might be the best way to start� ease people in with the &#34;kinder, gentler&#34; styles of blackletter. Fraktur might have to wait a bit longer. <BR> <BR>Welcome to the discussion, Cassie!!! Can you per chance read German? If you can&#39;t the best book out there in English is the slim &#40;out-of-print&#41; <i>Blackletter: Type and National Identity,</i> a catalogue of a 1998 exhibition that was organized by Peter Bain and Paul Shaw. I&#39;ll bet that you can find a used copy through Amazon, or another book service. <BR> <BR>If you &#42;can&#42; read German, let me know, and I can point you in a few other directions. <BR> <BR>Good luck with your research! <BR> <BR>P.S.: There are way more threads dealing with blackletter and fraktur here on typophile, do a little searching. Here is a link to my favorite recent thread: <a href="http://www.typophile.com/forums/messages/30/51672.html" target="_blank">http://www.typophile.com/forums/messages/30/51672.html</a> &#40;scroll down to October 22, 2004 and following&#41;. This thread tells the story of the Nazi&#39;s about face, and the banning of blackletter type in Germany in 1941 &#40;this story is probably on this site elsewhere, too� but it is a largely unknown chapter of type history&#41;. <BR> <BR>Also, I wrote a brief history of &#34;Old English&#34; fonts for the Linotype website. Someday, when I have more time, I&#39;ll be expanding this into an entire history of all blackletter styles: <a href="http://www.linotype.com/7-2195-7/oldenglishfonts.html" target="_blank">http://www.linotype.com/7-2195-7/oldenglishfonts.html</a></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 82748
    user: serin-users
    date: 2004-11-14T14:12:00
    date_raw: Sunday, November 14, 2004 - 2:12 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Dan <BR> <BR>Thanks so much for your advice. I am indeed reading Blackletter:Type and National Identity right now and finding it fascinating reading! As for my German - more than a little rusty! If only Blackletter was popular in France.... <BR> <BR>I have done a fair bit of reading already and I have been surprised by the lack of information &#40;in English&#41; that there is out there. I have already read every book in my library that says anything about Blackletter and it didn&#39;t take too long!  <BR> <BR>As for the children&#39;s book and cookery book idea - of course you are right. But the Yiddish book - I meant that using Blackletter in a modern day context for something such as a history of Yiddish would be detrimental. If Blackletter is to be accepted into modern culture as anything but a decorative font, it needs to be used with something other than a historical topic.  <BR> <BR>I hope I can make some interesting points along the way, anyhow! I will be using this place as a sounding board for ideas for my dissertation, so I really appreciate you taking the time to reply. <BR> <BR>Cass</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 82749
    user: 1085
    date: 2004-11-14T14:30:00
    date_raw: Sunday, November 14, 2004 - 2:30 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Well, even if your German is really &#34;rusty,&#34; try reading everything you can find by Albert Kapr. He is dead now, but he taught in Leipzig for most of the GDR-era. My favorite book it his <i>Franktur: Form und Geschichte der gebrochenen Schriften.</i> Even the pictures would tell you a lot. <BR> <BR>Also, blackletter WAS very popular in France. The broken-style of handwriting &#40;which Gutenberg used as the model for his textura typefaces�the first metal typefaces cast in the west&#41; most likely originated in the Ille de France concurrent with the birth of Gothic Architecture. In the late 1400s, many different rotunda and bastarde styles were cast and used in France &#40;see pages 44-47 of the exhibition catalogue you are reading, as well as the following digital type revivals <a href="http://www.linotype.com/1279/notredame-family.html" target="_blank">http://www.linotype.com/1279/notredame-family.html</a> and <a href="http://www.linotype.com/345/ducdeberry-family.html" target="_blank">http://www.linotype.com/345/ducdeberry-family.html</a> and <a href="http://www.linotype.com/260/clairvaux-family.html" target="_blank">http://www.linotype.com/260/clairvaux-family.html</a>&#41; <BR> <BR>Please do post more about your paper here, and bounce your ideas off of us! Also, consider coming to London in February for Linotype&#39;s TypoTechnica conference &#40;<a href="https://www.linotype.com/forms/typotechnicaform.html" target="_blank">https://www.linotype.com/forms/typotechnicaform.html</a>&#41;, there you can meet even more blackletter scholars in person. <BR> <BR>P.S. again: The most blackletter material is available in German, because well� for centuries, the Germans saw blackletter as &#34;theirs,&#34; and the rest of the west was probably glad to just let them have it &#40;good riddance and such&#41;.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 82896
    user: 1250
    date: 2004-11-16T10:15:00
    date_raw: Tuesday, November 16, 2004 - 10:15 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Cassie, great to see such budding interest in blackletter, and great to have you on Typophile too! <BR> <BR>Although time heals all, the reason I think something like a book about Yiddish would be &#34;optimal&#34; is that currently -as you say- the negative associations of blackletter are too strong for it to be used neutrally; for example if you use it for a children&#39;s book you&#39;ll surely be accused of trying to raise the next generation of Neo-Nazis; not to mention the compounding of the legibility issue for youngsters. Because blackletter&#39;s main liability is that it&#39;s perceived as being anti-Semitic, using it in the <i>opposite</i> light seems like the key &#40;along with an expansive colophon about the &#34;situation&#34;&#41;. On the other hand, I agree that it doesn&#39;t have to be -and yes, quite probably <i>shouldn&#39;t</i> be- historical. <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 83324
    user: serin-users
    date: 2004-11-20T14:50:00
    date_raw: Saturday, November 20, 2004 - 2:50 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi again all, <BR>I have a few questions which I am asking people for my dissertation &#40;big thanks to Dan already for answering them x&#41;. Would anyone who would not mind being quoted in my dissertation please send me an email regarding these questions? I am looking specifically for those with typographic qualifications or those who now work in typography, but anyone with an opinion to share or a particular insight is more than welcome to reply. <BR> <BR>Here are the questions: <BR> <BR>1. Firstly, could you please describe your occupation and explain your connection to typography and specifically Blackletter type. <BR> <BR>2. What is your opinion of Blackletter/Roman hybrid fonts. Are there any that you believe have been successful? <BR> <BR>3. Do you believe Blackletter type has a place in contemporary typography, or will it always be regarded as a relic from the past? <BR> <BR>4. What are your suggestions for “saving” Blackletter and having it used as a body text once more? <BR> <BR>5. Is Blackletter worth saving? If so, why? <BR> <BR>6. Why are you personally fascinated by Blackletter &#40;I am assuming you  are from your involvement on the type forums!&#41;? <BR> <BR>Any answers will be most appreciated. <BR> <BR>Please email responses to <a href="mailto:cassie_v_leedham@yahoo.co.uk">cassie_v_leedham@yahoo.co.uk</a> - i would prefer private responses to posts. <BR> <BR>Thanks everyone! <BR> <BR>Cass x</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 83387
    user: 851
    date: 2004-11-21T11:15:00
    date_raw: Sunday, November 21, 2004 - 11:15 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Greetings Cassie, <BR> <BR>Sorry I haven&#39;t responded earlier. I hope to send you some answers to your questionnaire shortly. <BR> <BR>But I would like to mention one book I picked up at the recent Prague conference. It&#39;s a doctoral dissertation by Silvia Hartmann entitled <i>Fraktur oder Antiqua: die Schriftstreit von 1881 bis 1941.</i> Published in 1998, second edition in 1999, by Peter Lang GmbH in Frankfurt.  <BR> <BR>It exhaustively analyzes minutes and correspondence among the governments, proponents of Antiqua and defenders of Fraktur up until &#40;and slightly past&#41; the Verbot in March 1941. It includes monotone facsimiles of typewritten letters, escalating in desperation and absurdity near the end. Some of the letters are in a Fraktur typewriter font! The quality of reproduction is poor, but I&#39;ll try to post some scans. I always knew such typewriters existed but couldn&#39;t find samples after years of searching. <BR> <BR>I&#39;m about 50 pages into this 450-page book after two months of on-and-off reading &#40;on my best days I can finish two pages&#41; and it combines the dryest of academic and bureacratic German. Not rip-rooaring so far... a lot of he-said-she-said... but it paints a clearer picture than anything that came before, and for that I am grateful to Dr. Hartmann. I expect it to become more interesting further into the book, especially when the Schaftstiefels start waddling in. <BR> <BR>It is important to remember that the German language as we foreigners are taught is a gross oversimplification of what it used to be, which is more than one dialect of arguably more than one language. The greatest solidifying forces of the modern written German language are Goethe&#39;s literature and Luther&#39;s Bible translation. In the 1800s, German nationalization--for better or worse--was as much about consolidating a common laguage and identity as anything else. You can&#39;t so easily amass power when the people you want working for you can&#39;t understand you. I see the assertion of some common &#34;Germanness&#34; as a sign of desperation more than anything else. My knowledge of 17th-to-19th-century European history is too spotty to speculate accurately, but I think this desperation may have arose in the wake of what other adjacent empires were doing or had recently finished doing on Prussian and Saxon soil. There were regional differences within Germany just as in any other nation that had to be overcome. More complex than the puerile extrapolation of cultural meaning from the purely mathematical classification of &#34;red states&#34; and &#34;blue states.&#34; <BR> <BR>As an aside, I was born into a military family that moved around a lot, but by age seven we settled into a relatively isolated part of the United States &#40;the rural South&#41; and I spent the rest of my childhood there surrounded by strange dialect, strange customs and patently offensive ideas about &#34;race&#34; and &#34;revival&#34; and a few other chestnuts. Our schools were effectively segregated ad hoc. I was lucky to have parents who knew what to look out for and keep me from falling in with friends who susbscribed to these things &#40;the military culture had long since developed a very simple and effective means of dealing with ignorance&#41; and I never quite assimilated. I had escape fantasies from the beginning, in fact. But what I observed coming back after a few years in college is that the Southern accent has completely left younger children. Their televisions teach them how to talk, think and feel. They all still know rednecks, they make fun of them now, and being one is now more a sign of rebellion and is often as artificial as being, say, a &#34;goth.&#34; &#40;Heh.&#41; Mullets are even cultivated out of conscious irony rather than plain ignorance. But I don&#39;t know if this is any sign of advancement. From where I look, they&#39;re merely exchanging one mass culture for another one. <BR> <BR>To be sure, I don&#39;t feel any sense of elitism for observing this. On the contrary, I think it happens everywhere, and there is an impulse in many &#40;most?&#41; people to see the others surrounding them as not clued in on what they know. In my own more discouraged moments, I see my fascination with Blackletter and automated fine typography as my own not being clued in on what everyone else already knows. But I say fück it, it gives me great pleasure, so why not plow ahead. &#40;Thanks to the typophile censor engine for necessitating the umlaut.&#41; I&#39;ll let others experience and preserve the fascination of professional football, prime-time home renovation documentaries, and Univers on a damn Swiss Grid. <BR> <BR>There has been a lot written about Blackletter for German, cos that&#39;s where it last had massive use, especially in text sizes. What I would like to see is an analysis of what happened to Blackletter outside of Germany, and I suspect that you will find that it wasn&#39;t discarded for its own faults, but because Antiqua designs of particularly high quality appeared here or there at this or that time, became quickly fashionable and successful enough as to set a standard. And I think this happened long before there was anything close to an actual &#34;Germany.&#34; Before there were nation-states at all as we know them. We should probably turn this around and ask not why Fraktur failed, but why Antiqua succeeded. And I suspect it has less to do with how the letters looked and more to do with the parts you can&#39;t see, for example what mechanical innovations and economic demand  coincided with Antiqua types&#39; introduction... did printers simply happen to be able to print more as a result of faster presses, more paper, growing literacy--did the letter shapes themselves ever play much of a part in their own success? <BR> <BR>The main problem I have about the Fraktur v Antiqua argument is the &#34;versus.&#34; The idea that you must discard the other when choosing the one makes no sense to me. And if people find it hard to read, well boo farking hoo. Oh no, we wouldn&#39;t want to learn something new, now would we?! <BR> <BR>[panting exhaustedly] <BR> <BR>Welcome to the show!</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 83389
    user: 1085
    date: 2004-11-21T11:57:00
    date_raw: Sunday, November 21, 2004 - 11:57 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">John, I haven&#39;t even heard abouth this book. It sounds fascinating! Unfortunately, Amazon.de reports that it is sold out, and no used copies are available. ZVAB doesn&#39;t even list it in its database, and it goes without saying that our college library doesn&#39;t have it&#42; :-/ <BR> <BR>I would like to see this. I&#39;ll keep looking around for it. If any of the Germans reading this have a copy, or know where I could get one, please let me know. <BR> <BR>The history of German unification is fascinating. In AP European History, we had to memorize both it, and the unification of iItaly. I found the unification of Italy rather dull, and have forgotten it entirely. <BR> <BR>While Napoleon&#39;s ravaging Central Europe certainly raised the level of &#34;German&#34; consciousness &#40;just see Goethe&#39;s letters from his mother!&#41;, and Napoleon&#39;s political tinkering allowed German unification to happen sooner, I&#39;m not too sure that those wars had a direct role in German unification. <BR> <BR>In my vague opinion, I think that the sheer force of the Hollenzollern family&#39;s will led to Germany&#39;s unification &#40;plus late breaks by a cunning Bismark and a stupid Napoleon III&#41;. The ravaging wars of the 1600s &#40;mainly the 30 years war&#41; more or less &#34;created&#34; the House of Brandenburg. But for the next two centuries, many other Germans saw the Hollenzollern Prussians as bullies. However, like the French monarchs of the 1000s�1200s, they seem to have been a family who came into the right place at the right time, and had only one goal. <BR> <BR>In 1848, when all of &#34;Germany&#34; &#40;this included Austria, but NOT the Czech lands�&#41; met in Frankfurt, the voice on the street wanted Germany to unify immediately, under the lead of the Austrian Habsburg Emperor. The King of Prussia did not like this one bit, and did some scheming which somehow prevented the Austrian delegation from fully participating in this unification congress &#40;which was sort of like the US constitutional convention in 1787, in the most broad of senses&#41;. The Frankfurt student mob got tied in with the conference too much. Eventually, toward its end, they &#40;the mob&#41; offered the King of Prussia the crown of a unified &#40;more or less&#41; Germany, sans Austria. He demured, refusing to take a crown from &#34;the gutter.&#34; Instead, he created an econmic union, sort of a proto-EU, which bound the non-Austrian German states together in a solely economic sense. <BR> <BR>Having won this strategic victory over Austria, they then orchestrated military conflicts with them, leading to a short bloody war in 1866, which Prussia won. Bismark then began playing diplomatic games with Napoleon III, who in 1870 declared war on Prussia. Prussia inflicted a crushing defeat on the French, and even captured Napoleon III at Sedan. The King of Prussia was now the superstar of &#34;germany&#34;, even though there wasn&#39;t any such place yet. His armies declared him emperor of this new country, from French soil. However, the Austrians were not invited to this party. For centuries, they had tried unsuccessfully to unify Germany themselves. It wasn&#39;t until 1938 that Austria became part of Germany�Greater Germany was a long-time &#34;Austrian&#34; goal, which in one of histories worst ironies was actaully put into place by one of their landsmen. <BR> <BR>&#34;Germany&#34; was never able to unify all of the various german bands. Except for six years of infamy, the Austrians were never part of Germany, and kept developing separate cultural traditions. The Swiss Germans, too, have always been independent. Germany itself is still awash in dialects. Even all German speakers still can&#39;t agree on the exact, proper written form of the language. Although new writting rules have been effect for the language since 1998, over 60% of all German publishing houses and media companies ignore them. <BR> <BR>Interestingly, one could say that more Germans seem to agree on Fraktur than on any other aspect of their language or culture &#40;most of them don&#39;t like it&#41;. <BR> <BR> <BR> <BR>&#42;Our college library actually has quite an extensive collection of type books. However, aside from some pre-war things, and a few private press printing specimens, it is blackletter free.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 83392
    user: 1250
    date: 2004-11-21T12:22:00
    date_raw: Sunday, November 21, 2004 - 12:22 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The opinion of Germans concerning blackletter is paradoxical: on the one hand they know -and feel- the most about it, but on the other they&#39;re more concerned with feeling less guilty about the Nazis than typographic richness and integrity. I think a revival might have to come from outside. <BR> <BR>There has however been some great news lately showing that Germans are perhaps finally getting over WWII&#42;, and this is good news for Fraktur. I won&#39;t go into why I think this is happening, lest I trigger another war of words about the Middle East. <BR> <BR>&#42; Some pertinent BBC.com stories: <BR><a href="http://news.bbc.co.uk/2/hi/europe/3897885.stm" target="_blank">http://news.bbc.co.uk/2/hi/europe/3897885.stm</a> <BR><a href="http://news.bbc.co.uk/2/hi/uk_news/magazine/3104469.stm" target="_blank">http://news.bbc.co.uk/2/hi/uk_news/magazine/3104469.stm</a> <BR><a href="http://news.bbc.co.uk/2/hi/europe/3055264.stm" target="_blank">http://news.bbc.co.uk/2/hi/europe/3055264.stm</a> <BR><a href="http://news.bbc.co.uk/2/hi/uk_news/3909635.stm" target="_blank">http://news.bbc.co.uk/2/hi/uk_news/3909635.stm</a> <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 83396
    user: 1085
    date: 2004-11-21T12:54:00
    date_raw: Sunday, November 21, 2004 - 12:54 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I don&#39;t think that WWII is anything that the Germans &#40;or anyone else&#41;can, or should get over. However, one also has to realize one&#39;s place v�s-a-v�s it. For instance, neither a German born in 1979 &#40;like my girlfriend&#41; or her mother &#40;born in 1947&#41; have anything to do with nazi Germany or its war. In fact, my girlfriend&#39;s Grandmother was a German living in what was then Poland when the war started. She first became a German citizen&#42; after the invasion in 1939. She and her husband didn&#39;t have anything to do with the build up to war, yet he ending up fighting in it. Of course, some people in our generation should do a little more reflecting on the war than others. My first exchange student in Germany&#39;s grandfather was an SS officer, for instance. While that had nothing to do with her, it is something that she should rightly be aware of. <BR> <BR>This is tricky, and needs to be handled with respect. When a people say &#34;this wasn&#39;t our fault,&#34; &#40;even if it wasn&#39;t&#41;, the next step of reasoning is often &#34;this wasn&#39;t even really that important.&#34; <BR> <BR>Germany has more than just this historical problem to deal with. In recent surveys, most west German schoolchildren couldn&#39;t even answer simple questions about the GDR, which existed in their lifetimes &#40;sort of&#41;. <BR> <BR>I would really, really like to keep discussions of Fraktur&#39;s pluses and minuses separate from questions of its relationship to Nazism, or to how Germany feels about the war. That places Fraktur�which has such an enormous wealth of history�into a tiny little box. Exactly the kind of box it is in now <IMG SRC="http://www.typophile.com/forums/clipart/sad.gif" ALT=":-&#40;" BORDER=0> <BR> <BR>And Hrant, you and I both know that I agree with you about Fraktur &#40;hell, I probably even agree with your position of Germany&#39;s feelings about the war&#41;, but I don&#39;t agree with your opinions about Judaism. Let&#39;s just leave it at that. <BR> <BR> <BR>&#42;She was a German citizen from her birth in 1910 until around 1919, too. After WWI, the part of Silesia that she was living in voted to become part of the new Polish state. When the Germans conquered Poland in 1930s, these people were &#34;repatriated.&#34; Then after 1945, they were forced out of Poland by the Poles/Russians. She, for instance, was given less than 24 hours to leave town, with her family and all that they could carry. They moved to the Ruhr valley, and are still bitter about it. Her sister married a Pole and stayed behind. The two families lost contact then. 24 hours to leave sounds harsh, but it is better thems than the invading German army gave to the the non-Germans when they marched through the area in conquest :-/</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 83400
    user: 1250
    date: 2004-11-21T13:45:00
    date_raw: Sunday, November 21, 2004 - 1:45 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; I would really, really like to keep discussions of Fraktur&#39;s pluses and minuses separate <BR>&#62; from questions of its relationship to Nazism, or to how Germany feels about the war. <BR> <BR>That makes no sense to me. <BR> <BR>I&#39;m not advocating discussion about Nazis to any great detail in this thread, but the biggest hang-up with Fraktur is in fact that it&#39;s very much <i>seen</i> &#40;by too many people&#41; as fascist. Heller is one extreme, but simply ignoring the issue is the other. We need to be straight about this if we&#39;re sincere about reviving Fraktur - no more manipulation or feel-good tactics, please. <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
