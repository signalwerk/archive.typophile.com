    date_raw: Friday, March 25, 2005 - 9:00 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I had a feeling: don&#39;t know if it could be useful, but I see that most forum discussions become misdirected because of it: the word used to identify a thing and its perception. <BR> <BR>In this case: &#34;Blackletter&#34;. It occurred to me when Josh Griffing mistook the cathegory name/subgenre &#40;Fraktur&#41; with the whole category &#40;Blackletter&#41;. <BR> <BR>My idea to help discussions &#40;in general as well&#41; would be this: considered we are each one from a different country it&#39;s great we can use English, but wouldn&#39;t it be useful to see which terms are used in our own languages? <BR>I think it would be enormously helpful to see the whole picture in a clearer light. <BR> <BR>I start with my beloved Italian. We do not have more technical terms like &#34;Blackletter&#34; or &#34;Gebrockene Schriften&#34;. We call it &#34;Gotico&#34;, which, in all senses and with all that the word can evoke is &#34;Gothic&#34;. <BR> <BR>But here, the way people superficially use it, is very precise in its loose definition. And as you use it, they tell you it&#39;s &#34;something Nazi&#34; &#40;the Fraktur&#41; or something generically &#34;old-style&#34;. <BR>While many people &#40;even the most ignorant&#41; are responsive when you talk them of &#34;Lineare&#34; or &#34;Senza Grazie&#34; &#40;Sans-Serif&#41; or &#34;Graziato&#34; &#40;Serif&#41;, or &#34;Calligrafico&#34; &#40;Script&#41; they are often very quick to refuse your &#34;Gotico&#34;, since it&#39;s &#34;outdated&#34; and &#34;evokes Nazism&#34;. <BR> <BR>Picking up once again Hrant&#39;s interest &#40;which is mine as well&#41; we may consider Italian culture &#34;needed&#34; to keep its distance from Nazism for decades after WW2, since we&#39;d been allies with it. How do you think is &#34;Blackletter&#34; perceived in Japan, for example, considered they were Germany&#39;s allies as well? <BR> <BR>You should see how the political debate here in Italy still spins around this issue, in an era where it does not make actual sense to still speak of &#34;Fascism&#34; or &#34;Communism&#34; except as referring to History. Politics seems such a farce today I can&#39;t really see why people keep clung to the use of these &#34;labels&#34;. <BR> <BR>I find difficult to grasp any actual connection between our post-structural politic parties and their previous historically-soaked counterparts. We live in a sort of &#34;non-historical&#34; time, where History&#39;s faults has become good mostly used as a childish offense. Ignorance &#40;in any field&#41; seems inevitably interlocked with Pride, and they both prosper. <BR>Or is this vision biased by the fact I, myself I&#39;m ignorant about what actually &#34;Politics&#34; should be, and that I was born in 1969, already so distant from the War? <BR>Is this too off-topic?</font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 98625
    user: 5156
    date: 2005-04-02T03:48:00
    date_raw: Saturday, April 02, 2005 - 3:48 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Great subject for a dissertation Cassie! <BR> <BR>I guess that you are aware of a trend in the U.K for Blackletter particularly in design work for fashionable/trendy clothing companies; even Liberties on Regent street has used it in their point of sale. But I have a theory that there is a lot more to this interest. <BR> <BR>Partly it has a lot to do with the recycling of symbols; in the sense that Blackletter has become associated in a contemporary sense with alternative, and even pop culture in the West thanks to its use in the identities of contemporary Rock and R&amp;B acts, and has therefore once again become familiar to our eyes from the point of readability. Blackletter now stands for an acceptable form of rebellion, and has become less associated with Nazi Germany particularly with the younger generations. This association with rebellion has been passed down to us from the 60&#39;s and the use of what we would call Second World War memorabilia by American motorcycle gangs as &#39;cheap riding gear&#39;&#40; Check out page 38,&#39;Hell&#39;s Angel, the Life and Times of Sonny Barger and The Hell&#39;s Angels Motorcycle Club&#39; published by Fourth Estate&#41;. This side of the theory relies on what Claudio called a &#34;non historical time&#34;, in that a symbols association can alter with the passage of time. <BR> <BR>The other part to my theory relates to what is going on throughout Europe at different levels, but particularly on a subcultural basis, and with relevance to countries with a Celtic and Germanic heritage of which the UK is part. <BR> <BR>There is a growing interest in our individual cultural heritage in relation to a growing belief that globalization is leading to the Americanisation of European identities. Sub culturally this can be seen in the Black Metal scene in Norway &#40;read &#39;Lords of Chaos&#39; by Michael Moynihan and Didrick Soderlind&#41; where this belief has played a part in the development of a scene that is now international. The same mass interest has been seen in the rise of popularity in History and and European Mythology &#40;see &#39;Lord of the Rings&#39;, the forthcoming &#39;Beowulf&#39; film, and the forthcoming Ridley Scott film about the Crusades&#41;. <BR> <BR>From the English point of view I think we look at the languages and culture of Europe and see a sense of identity we crave when we consider that our cultural invaders from America use the same language as ourselves, and with the dominance of American media over here, it seems that there is very little we can do to stop our assimilation. <BR>For this reason we look for our identity in our nearest cultural neighbors which I believe are those in Northern Europe, and the Celtic countries Scotland, Ireland and Wales; and in this sense I believe that the use of Blackletter as well as Uncials, Semi-Uncials and other decorative Medieval lettering is being used to give a sense of identity that is not Americanised. <BR> <BR>I know many of these issues are not strictly type related, but they are to do with culture of which language is a part.  <BR> <BR>By the way I do have good friends who are American, no offence intended.</font></font></font></font></font></font></font></font></font></font></font>
