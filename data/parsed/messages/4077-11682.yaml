nation of a sans serif design and try to made some fusions witch black letters for text faces. It could be interesting. <BR> <BR>One funny thing to the Castle Wolfenstein game. All posters are fakes. Mostly the spelling was false too. &#40;like Japanese using fake English looking words - &#34;Dinglish&#34; to style trendy things&#41; They should buy some German stamps or postcards from this time to get a real feeling, but who cares.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
