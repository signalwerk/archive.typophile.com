    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks Dan, that was an enlightenment :-&#41;</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 82743
    user: serin-users
    date: 2004-11-14T13:17:00
    date_raw: Sunday, November 14, 2004 - 1:17 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi everyone, <BR> <BR>Just a thought - about the &#34;saving&#34; of Blackletter by using it in publication again. In my eyes, Blackletter suffers now because of its past  involvement with &#34;historical situations&#34; which has politisized Blackletter beyond repair. I think what needs to be done is not use it for something which one could directly relate to Germany, history, or indeed any modern subculture. I think it needs to be used for something totally unexpected if it is ever going to be accepted again as a viable type for every day use. Using it for something such as a history of Yiddish would, I think, only serve to strengthen the box that Blackletter has been placed in.  <BR> <BR>How about a children&#39;s book set in Blackletter? Or a cookery book? And if not, why not? I am not sure what I think of these yet, but I would like to see how others react... :-&#41;  <BR> <BR>Blackletter is so laden with meaning, whatever you believe that meaning to be, that to really bring it back into the realms of an everyday typeface, it needs to become meaningess once more, as it began - as a vernacular, common font of the people. To rid it of its meaning, it needs to be thrust into totally unusual circumstances. Then, I reckon, it&#39;s sink or swim. If it works, then we can rejoice! If it doesn&#39;t then we will know for certain that Blackletter belongs in the realm of the decorative and unusual. Not that that&#39;s a bad thing.... <BR> <BR>By the way, I am new to all this - both Blackletter and this forum. I am a Graphic Design student with a fascination for Blackletter and am currently writing a dissertation about it. Until now, my knowledge has been very patchy, but it&#39;s slowly improving! Let&#39;s just hope it improves quickly enough to write a first class dissertation! <BR> <BR>cass</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
