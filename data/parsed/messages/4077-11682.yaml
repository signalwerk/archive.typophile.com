  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">{Over in the Design area, there&#39;s a thread called &#34;Overused Typefaces&#34;&#42; which has sprouted an interesting discussion about blackletter. I&#39;m trying to redirect it over here. I was going to call this new thread &#34;OK to Hate&#34;, considering my post below, but I realized it needed to be broader. <BR> <BR>&#42; <a href="http://www.typophile.com/cgibin/show.pl?4100/7580" target="_blank">http://www.typophile.com/cgibin/show.pl?4100/7580</a> <BR>Starting: Tuesday, June 10, 2003 - 10:41 am} <BR> <BR> <BR>&#62; a revival of blackletter may be helped along by its role in an interesting historical situation. <BR> <BR>I have a short-story-length expose boiling over in my head about this at the moment, but for now let me ask this &#34;set-up&#34; question: <BR> <BR>Why is hating blackletter -by associating it with the Nazis- seemingly encouraged by most people? Especially when you consider that the Nazis disowned it! Is it perhaps because it also seems to be OK to hate Germans in general &#40;at least in the US&#41;? It can&#39;t be anti-Semitism, since very few people know/believe the &#40;false&#41; story that blackletter was Jewish. Is it because people need something to hate? Is it due to brainwashing? Or what? <BR> <BR>&#62; why did the nazis feel they had to pretend that this wasn&#39;t a simple practical measure. <BR> <BR>Maybe because they could get more milage out of it by pretending it was part of fighting Jews. <BR> <BR>hhp <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
