    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I retain just a reflection from my tirade: <BR>I&#39;m still curious to know if there&#39;s been some interesting use of Blackletter in Japanese design. <BR>From what I get, Japanese get interested in Latin since its forms are bendable and easy to play with, coming up with variations. <BR>A friend told me most designers tend to look at the Latin typefaces as fun and exciting for their variety, and for the immediate generic feeling they convey. <BR> <BR>But what kind of typography did we have in Japan while Europe was the cradle of printing history? And during World War 2? I&#39;d love to hear a Japanese designer on this.</font></font></font></font></font></font></font></font>'
