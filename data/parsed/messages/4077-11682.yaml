    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; why did the nazis feel they had to pretend that this wasn&#39;t a simple practical measure.  <BR> <BR>Because they were commited to an idea of German national culture that required the preservation and celebration of anything distinctively German. The only way to get rid of something so obviously German as blackletter, was to deny its Germanity. <BR> <BR>I also think it was a characteristic of Nazism to require an <i>ideological</i> reason for everything, so &#39;simple practical measures&#39; were unlikely to be acknowledged as such. If it is possible to relate your ideology to absolutely every aspect of life, you can present this as evidence of the universal truth of your ideology.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 20264
    user: 1262
    date: 2003-06-12T15:32:00
    date_raw: Thursday, June 12, 2003 - 3:32 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>Why is hating blackletter -by associating it with the Nazis- seemingly encouraged by most people? Especially when you consider that the Nazis disowned it!</i> <BR> <BR>I don&#39;t think it is actively encouraged; it just isn&#39;t discouraged and most people don&#39;t know any better. The vast majority of people have no idea about the Bormann memo or the official rejection of blackletter by the Nazi regime. All they know is that in every WWII film they have ever seen blackletter is used for Nazi documents, signage, etc. And when game developers produce the latest version of Castle Wolfenstein or Day of Defeat, what do they use to evoke the WWII period? Blackletter.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 20269
    user: 851
    date: 2003-06-12T15:51:00
    date_raw: Thursday, June 12, 2003 - 3:51 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">First of all, most of the anti-blackletter sentiment and false association with NS is among modern Germans, not Americans. It stems from the postwar sentiment to reject anything and everything that could even remotely be connected with NS, a great example of the classic leftist bad habit of not bothering to match sentiment with commitment or diligence. In other words, the Rule of Thumb wins out over knowing where to stop. <BR> <BR>Second, I wouldn&#39;t say that most Americans consider it &#34;OK to hate Germans in general&#34; and don&#39;t understand where you get this crazy notion. It may have been true after the war, but most Americans today have a rather neutral or favorable opinion of Germany and Germans, notwitstanding the usual bickering over the recent Iraq war. Personally I wouldn&#39;t trade my Audi for any American car on the market, and I love traveling in Germany. <BR> <BR>If you read the rest of Bain &amp; Shaw&#39;s book, you will see that today blackletter is mostly associated with <i>Heimatkitsch</i>, goth music, and certain subcultures in Germany. Certain styles &#40;Schaftstiefelgrotesks like Element, Tannenberg and Deutschland&#41; are definitely and perhaps correctly associated with NS. And blackletters of all types are routinely commandeered by lunatic fringe designers.  <BR> <BR>But the mistake of permitting that fringe to get away with &#34;making those types their own&#34; is what grates on me the most. Of course, others make this same argument about the swastika, but I can&#39;t go that far. The swastika was relatively obscure before its adoption by NS, whereas blackletter was a centuries-old institution with origins and roots both inside and outside what is now Germany. <BR> <BR>The only way to counter this is to start using blackletters again for general purposes--even body text! &#40;Yeah, I know, good luck selling a client on that. :-&#41; So far I only see them in reprints. <BR> <BR>There&#39;s also the readability issue, which is already discussed in another thread.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
