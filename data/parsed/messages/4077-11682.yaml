    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><a href="http://news.bbc.co.uk/2/hi/uk_news/magazine/4183467.stm" target="_blank">http://news.bbc.co.uk/2/hi/uk_news/magazine/4183467.stm</a> <BR>Now if we could just get the BBC to cover blackletter in the same way... Hey, I know! Paint a swastika and some fraktur on the back of an unsuspecting celebrity &#40;like maybe Mel Gibson :-&#41; and let the idiotic media do its thing! <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 92299
    user: cassie
    date: 2005-02-05T04:40:00
    date_raw: Saturday, February 05, 2005 - 4:40 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey everybody <BR> <BR>Well, I have been hiding out in my dark little studio writing my dissertation and it is coming along nicely. It has changed a little bit in that it is now more focused - it is an examination of the relationship between Blackletter and alternative culture and why they are drawn to it. Specifically, I am looking at Heavy metal and rock music fans &#40;think motorhead logo etc&#41;, hip hop and rap fans &#40;eg. Cypress Hill logo&#41; and members of Black and Hispanic gangs in America who often use Blackletter for their identifying gang tattoos. <BR> <BR>It is getting really interesting. I am looking at cognitive and contextual reasons for them choosing Blackletter and I have a few new theories of my own which I will share with you when I get some evidence to back them up! But in the meantime, any opinions relating to this subject would be most welcome. <BR> <BR>Hope you are all good and happy! <BR> <BR>Cass x</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
