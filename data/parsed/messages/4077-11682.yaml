    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The Japanese fashion industry is obsessed with blackletter. Check out <a href="http://www.s-inc.com/hnaoto/">h.Naoto Blood</a>, where blackletter type becomes a design element on the distressed fabrics of their most out-there designs. Blackletter is used as a signifier of Western exoticism, Victorian-era fetishization of childhood &#40;cf. ref. Japanese &#34;elegant lolita&#34; culture&#41;, and spoOoOoky Gothicness. There was a good article about the Gothic Lolita scene, which has been a dominant trend in Tokyo&#39;s Harajuku fashion district for a good five years now, in the <a href="http://www.nytimes.com/2005/03/13/fashion/13GOTH.html?pagewanted=all&amp;position=&amp;pagewanted=all">New York Times</a> &#40;unfortunately, it&#39;s disappeared into the archives&#41;. Anyone with access to a good Japanese bookstore is encouraged to pick up a copy of Gothic &amp; Lolita Bible to see how this works out in practice. <BR> <BR>What interests me about this phenomenon is how closely it mirrors the American goth / industrial subculture&#39;s fascination with incorporating Japanese language text into their own designs. The Japanese have created this weird steampunk vision of morbid Victoriana, where Japanese evokes postapocalyptic futurism to the goths. I guess we all yearn for the exotic. <BR> <BR>Hrant, Japanese is reasonably plastic, but when you&#39;re dealing with ideograms composed of graphemes or radicals, you have to be careful about how you distort the strokes if you want the result to be readable. You have to be pretty sensitive to how Japanese is read before you can start making alterations to forms for aesthetic purposes. I think you&#39;re right that outsiders can have more fun with this than native readers and writers, but they still have to be pretty conversant with the language first. <BR> <BR>It would be interesting to see what people could do with the archaeographic forms or Japanese / Chinese calligraphy, which use forms that are considerably freer in their rendering. <BR> <BR>Re: black metal, tastes vary. Some of my favorite music is black metal, although John is right in saying that black metal reflects deep-seated unease to the point of atavism in its outlook. The original black metal scene was full of neo-Nazis, xenophobes, homophobes, and pretty much every other form of violent European white male thuggery. It&#39;s somewhat hypocritical to admire the music and deplore the ideology, but hey, people still go see Wagner&#39;s operas all the time. And yes, black metal bands love not only blackletter but the extreme plasticity of letterform that blackletter reflects: just look at a few black metal band logos, and you&#39;ll see what I mean. It&#39;s strange to me that blackletter doesn&#39;t get used more than it does. Typically it&#39;s used by the bands that are trying to sound more medieval and primitive and less extreme or thrashy, much like you&#39;d expect.</font></font></font></font></font></font>'
