    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Cassie, I doubt there&#39;s a transcript of what Gabriel said &#40;you&#39;ll have to rely on our typographic &#34;oral tradition&#34; I guess :-&#41;, since he said that during the Q&amp;A session after the blackletter panel discussion at ATypI&#39;s Leipzig conference in 2000. The other insightful audience observation then was from John Butler. And I remember pointing out during my &#34;reply&#34; &#40;I was a member -if an outclassed one- of that panel&#41; that the New World outlook seemed to be quite different than the Continental one... Unfortuntely, that productive innocence is increasingly being eroded and manipulated for nefarious political ends. <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
