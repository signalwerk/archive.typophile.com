  - id: 92344
    user: 1250
    date: 2005-02-05T15:55:00
    date_raw: Saturday, February 05, 2005 - 3:55 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Cassie, I myself would guess that one motivation is the &#34;anti&#34; nature of blackletter: anti-decent &#40;via the Nazis&#41;, and anti-function &#40;poor legibility&#42;&#41;. On the other hand, Gabriel Martinez Meave has pointed out that many Mexicans like blackletter simply because of its forms, and are in fact oblivious to the politico-cultural baggage. <BR> <BR>&#42; For a necessary elaboration on this, see <a href="http://www.typophile.com/forums/messages/4077/5005.html" target="_blank">http://www.typophile.com/forums/messages/4077/5005.html</a> <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
