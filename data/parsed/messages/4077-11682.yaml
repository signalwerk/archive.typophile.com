    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I don&#39;t chase pro-shop fonts, but I do collect Blackletters from free-font sites.  I suppose half of my &#34;Fraktur&#34; are in fact &#34;Schwabacher&#34;, but I wouldn&#39;t know.  I&#39;m guessing that most things folk call &#34;Old English&#34; are variants on the Rotunda or Textura typefaces, or just a bad excuse for a fancified half-bake.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 63379
    user: 1085
    date: 2004-06-08T03:26:00
    date_raw: Tuesday, June 08, 2004 - 3:26 am
    votes: 10
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Josh, allow me to &#34;drool all over the keyboard&#34;� <BR> <BR>Hrant is correct. <i>Blackletter</i> is a descriptive, umbrella term, for typefaces which are either texturas, frakturs, rotundas, or schwabachers. Therefore, all frakturs are blackletters, but not all blackletters are frakturs. <BR> <BR>&#34;Gothic&#34; usually in the blackletter sense &#40;as opposed to sans serifs or grotesk&#41;, refers to texturas. Many german texturas were refered to as Gothics by their original foundries. Of course, some German foundries have also made frakturs in the past that were called <i>Gotisch</i>� <BR> <BR> <BR>I think that latinate Rotundas &#40;or Schwabachers&#41; are often referred to as Bastardas as well. So, there is some inconsistancy in font naming going on, and some of your frakturs may not be frakturs, but they are still blackletters.  <BR> <BR>Blackletters are called black letters becaused they &#40;texturas especially&#41; look so <i>black</i> on the page. The german umbrella word for this category of type is not blackletter but <i>gebrochene Schriften</i>, which means &#34;broken type&#34;.  I think that this is good, too, as most black letters have at least one broken joint in them. <BR> <BR>Free-Font sites, and the names assigned to their fonts, are not necessarially the best resource for learning about typeface classification.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 68369
    user: lhoon
    date: 2004-07-18T17:08:00
    date_raw: Sunday, July 18, 2004 - 5:08 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The demise of blackletter in post-WWII &#40;West&#41; Germany is a sad thing. Now in Germany the typographic landscape &#40;apart from a few very talented type designers around&#41; is quite bland, with Helvetica present anywhere.... <BR> <BR><a href="http://www.lhoon.com/VDB/fonthate.html" target="_blank">http://www.lhoon.com/VDB/fonthate.html</a></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 68438
    user: 1085
    date: 2004-07-19T09:38:00
    date_raw: Monday, July 19, 2004 - 9:38 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I took a look at your website, LHOON, and I must say that I disagree with you about Helvetica. <BR> <BR>While I am saddend by the supression of blackletter, amoung other things, in late 20th C design, I think that responding to this by turning around and trying to &#34;eliminate&#34; Helvetica is silly. How different is this from designers who tried, and are trying to elimiate blackletter from the typographic pallette? There was a time when blackletter was comparatively as ubiquitous as Helvetica is today &#40;esp. in Germany&#41;. <BR> <BR>Just as Tschichold, later in life, looked back at his <i>New Typography,</i> and saw parallels between its polemic and fascism, current &#34;blacklashing&#34; against Helvetica by a tiny minority of designers is just as bad. <BR> <BR>Helvetica became one of the most used computer fonts in the world because it had alrady been used successfully for two and a half decades in metal and film form! It wasn&#39;t the Mac &#40;or the PC&#41; that made Helvetica so ubiquitous, it was swiss designers themselves. Already in the 1970s, American designers were writing articles in design journals decrying how Helvetica had taken over the world. <BR> <BR>And lastly, regarding a comment on your site, I find it unlikely that &#34;Hitler&#34; would rejoice at the triumph of Helvetica in the world. While Helvetica is a descendent of German sans serif typefaces, these were NOT the sorts typefaces that the NS supported the usage of. They disapproved of modernism in virtually all of its manifestations. <BR> <BR>&#34;Hate&#34; is just too string for anything, especially something like typefaces or type choices &#40;and I&#39;m a TYPE designer!&#41;. Aren&#39;t there better things in the world to fight against, and collect petitions for the abolition of, than Helvetica?</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 68443
    user: 1250
    date: 2004-07-19T10:27:00
    date_raw: Monday, July 19, 2004 - 10:27 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Although I think <i>banning</i> Helvetica &#40;or any font, even Comic Sans :-&#41; is counterproductive, in the blackletter/Helvetica comparison, reducing usage of the latter certainly has more merit, because: many people who want to ban blackletter are motivated by policital manipulation; blackletter has functional merit, which has yet to be really explored; and Helvetica is a poor type design. <BR> <BR>Hate is indeed too strong an emotion to feel for a font, but it&#39;s not too strong an emotion to feel for the motivations behind the contemporary denigration of blackletter. <BR> <BR>BTW, some good news: <BR><a href="http://news.bbc.co.uk/2/hi/europe/3897885.stm" target="_blank">http://news.bbc.co.uk/2/hi/europe/3897885.stm</a> <BR>So maybe a blackletter revival will first come from within Germany after all. <BR> <BR>hhp <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 70759
    user: 3135
    date: 2004-08-08T17:32:00
    date_raw: Sunday, August 08, 2004 - 5:32 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">What of the numerous Christian books and Bibles in Blackletter caligraphy? This certainly has nothing to do with Nazis. <BR>I don&#39;t even think Nazi when I see most blackleter fonts.  Fette Fractur and those like it do however create the image in my mind.  I don&#39;t think Fracturs or any font or style of font should be banned. Mass murders and ill treatment of people should be banned, not the type that just happened to be in use at the time. <BR> <BR>ChrisL</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 70778
    user: 1085
    date: 2004-08-09T01:58:00
    date_raw: Monday, August 09, 2004 - 1:58 am
    votes: 5
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Chris, <BR> <BR>blackletter type relates to Bibles in two distinct ways, both of which are often misunderstood. As you alluded, medieval manuscripts were normally written with calligraphic hands that acted as the influence for the the first typefaces. <BR> <BR>The &#34;gothic&#34; style of lettering &#40;i.e., texturas&#41; probably developed in the Ille de France concurrently with the advent of Gothic Architecture. As French art and culture &#40;including gothic architecture&#41; spread across Europe by storm, these scripts were passed along as well, although every one &#40;country&#41; wrote them a little differently. Interesting to note that neither Gothic architecture nor gothic scripts ever took a firm hold in Italy &#40;where the <i>italic</i> types that we use today were formuated&#41;. <BR> <BR>Gutenberg copied the format of the medieval manuscript &#40;very quickly and <i>very</i> well&#41; for his first Bibles. The catholic church in Germany continued to set Latin text in Gutenberg-like texturas for generations &#40;this might be a bit of a generalization&#41;. <BR> <BR>What really made <i>Fraktur</i> <b>the</b> German typeface was the printing of the complete Luther translation of the Bible in it, during the 1530s. The Lutheran Bible &#40;in German&#41; remained set in the Fraktur variety of blackletter until the 1960s! <BR> <BR>The Luther Bible is oftenregarded as the definitive book of the German language. In fact, Luther practically invented <i>hochdeutsch</i> when he wrote it, because he needed to find a langauge that would universally be understood. Even today, German-speaking countries have a range of perlexing dialects. And, it was <b>the Bible</b> after all... talk about a good seller. <BR> <BR>So, the Luther Bible was the first book printed in the modern German language, and it was printed in Fraktur. This is hard to fight against. It was the standard setter. How could one set German in anything else? <BR> <BR><b>Well</b>, after the 1800s, a lot of Germans started setting a lot of German books in serif type, because a lot of serif typefaces are easier too read than a lot of Frakturs &#40;I like Hrant&#39;s theory that Fraktur Boumas are inherently more legible, but <i>design</i> plays a large role in the translation of this theory... some Frakturs, like some latinate Serif faces, are just <b>bad</b> for use in text&#41;. Books that were originally written in other languages, and books that were aimed at the scholarly, upper class &#40;think a special edition of Goethe&#39;s <i>Faust,</i> for instance&#41; were now being printed in latinate serif type &#40;called <i>Antiqua</i> in German&#41;. Books for the masses, and newspapers, remained in Fraktur until the very end... which was Hitler&#39;s banning of Fraktur in 1941, and West Germany&#39;s quick, unfounded, association of Fraktur type with Nazism immediately after the war&#39;s close. <BR> <BR>So, Bibles and Blackletters go hand-in-hand, <i>in more ways than one.</i></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
