    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><img src="http://www.typophile.com/forums/messages/4077/65039.jpg" alt="Snoop Dogg poster"> <BR> <BR><img src="http://www.typophile.com/forums/messages/4077/65040.jpg" alt="Snoop Dogg top detail"> <BR> <BR><img src="http://www.typophile.com/forums/messages/4077/65041.jpg" alt="Snoop Dogg bottom detail"></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 93473
    user: serin-users
    date: 2005-02-16T01:46:00
    date_raw: Wednesday, February 16, 2005 - 1:46 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey everyone <BR> <BR>Dan, you rock! Thanks so much for the picture. Hrant - could you tell me where I might be able to find the quote by Gabriel Martinez Meave, from a source that I could quote? And does anyone know of any research into the psychology of Blackletter or similar research? Having trouble finding what I need. Maybe because it doesn&#39;t exist! Haha. I am also wanting to read anything about the physical aspects of Blackletter and the connotations therein and not so much about the historical factors. Lemmy from Motorhead still hasn&#39;t got back to me....sigh.... <BR> <BR>Cass x</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 93505
