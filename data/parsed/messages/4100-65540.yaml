  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I have been racking my brain trying to find a face that would be suitable &#40;and look go with the characters at hand&#41; for a new pop artist. <BR> <BR>I need only the word: Nichole Deborah OR nichole deborah <BR> <BR>I&#39;m thinking something either thin geometric or humanist, or possibly a script. <BR> <BR>I have found a lot of great things, but nothing that looks appropriate with her actual name set in it. <BR> <BR>This will be the masthead for an upcoming album release. <BR> <BR>It needs to be graceful, stylish, mature, and slightly feminine. <BR> <BR>I&#39;m attaching a promoshot of the artist for reference. <BR> <BR>Any thoughts you have would be ver helpful. <BR> <BR>We have around a $150 budget for the font. <BR> <BR>Kyle.<img src="http://www.typophile.com/forums/messages/4100/65541.jpg" alt="Nichole Deborah Promo Shot"></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
