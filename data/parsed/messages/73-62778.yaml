  html: <font class="dontLookLikeCrap"><a href="http://www.typeculture.com/foundry/" target="_blank">http://www.typeculture.com/foundry/</a> <BR> <BR><blockquote><hr size=0><!-quote-!><font size=1><b>quote:</b></font><p>This is a collection of high-performance typeface families that have been produced to go the distance in a broad range of typographic applications. They have been scrutinized and tested in professional practice by our Advisory Board. Through the years, Mark Jamra has created all kinds of typefaces to a high standard of quality; from all-purpose workhorses with distinct personalities to innovative display fonts. This collection contains his newest designs in CFF OpenType format.<!-/quote-!><hr size=0></blockquote></font>
