  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This is my first post to this forum. I have designed a logo for a local wellness center and I am not quite happy with it. <BR> <BR>I am pleased with the overall design but I think I need to tweak it just a bit more. The company has an existing logo of a heart with an olympic flame over it. I decided to update their image with a new design. <BR> <BR>They did&#39;nt really ask for a redesign but I took the initiative to put something together for them. They have actually used the logo on a drink bottle but nowhere else. I think they are afraid to change their identity because they might look too &#34;successful&#34;. <BR> <BR>The logo would eventually be applied to stationary, bus. cards, etc. Any critiques would be great at this point. I&#39;m very happy with the concept but it still needs a little something. <BR> <BR>Thanks for the help <BR><img src="http://www.typophile.com/forums/messages/29/56490.jpg" alt=""></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
comments:
  - id: 87331
    user: 5514
    date: 2004-12-23T04:07:00
    date_raw: Thursday, December 23, 2004 - 4:07 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The concept is okay, in my opinion. But the overall feeling lacks finesse, subtlety. The capitals are rather insipid in contrast with the flowing forms of the central heart-piece.  <BR>The way the H sits against the heart leaves this little angle in the top-right corner. This needs to be corrected. Also, to my eye, the W sits to cramped in the heart. Due to all the diagonal lines of that letter, you need to orchestrate a fine balance between form and counterform here. <BR>Have you experimented with other fonts, or a narrower heart, smaller letters? Might be usefull.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 87332
    user: 2915
    date: 2004-12-23T04:10:00
    date_raw: Thursday, December 23, 2004 - 4:10 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Jay what is a wellness center? Is it a spa? Is it commercial business? My first impression is the mark is powerful but not warm and friendly. It might make a good emblem for a car.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
