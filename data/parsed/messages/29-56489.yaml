    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I get the &#34;I heart NY&#34; feel to this latest version. I don&#39;t read the flame as a flame and I don&#39;t know why you have it at all. At this point I would work on the type. This face is kind of dull.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 87388
    user: polk-designs-users
    date: 2004-12-23T12:01:00
    date_raw: Thursday, December 23, 2004 - 12:01 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Okay so the flame is the heart does not work. Here is another version. I put the original flame over heart in the middle of the type. I also changed the type to Adobe Jensen. I really like the feel of this type better. Thanks for the advice. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/56568.jpg" alt=""></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 87395
    user: 2915
    date: 2004-12-23T13:09:00
    date_raw: Thursday, December 23, 2004 - 1:09 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Jay, much better. I like it reads Houston Wellness. Center. I like the type alot better now too. Now work on the relationship between the type and the mark. I think the mark is to large.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 87396
    user: 2915
    date: 2004-12-23T13:14:00
    date_raw: Thursday, December 23, 2004 - 1:14 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">One last thought they need a tagline. Explain the business in 6 words or less. Houston Wellness Center means nothing to the average person. Its not necessarly your job, but make it your suggestion.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 87561
    user: polk-designs-users
    date: 2004-12-27T14:52:00
    date_raw: Monday, December 27, 2004 - 2:52 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I had already thought up a couple of taglines. One was Houston Wellness Center. Wellness is our middle name. One of the owners thought it was great. <BR> <BR>I was able to talk with the other owner last week and he liked the new direction I was going in. I will follow up with him soon and see what he thinks of this new direction. I got the feeling talking to him that he is ready for a new design; it just has to be something that he is comfortable with.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 87809
    user: 2923
    date: 2004-12-30T09:16:00
    date_raw: Thursday, December 30, 2004 - 9:16 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I like the direction your logo is taking, but you might want to look at the flame shape and maybe make a small adjustment. As it is now, it is very similar to the shape of a descending dove, in that case it almost certainly gives a quasi religious feel to it - especially in some evangelical circles in the south. Perhaps another toungue on the flame would help or rounding the bottom a bit more. Unless of course it is associated with a church group or religious movement - in which case it would be very appropriate - right now it kinda seems to say Mercy Hospital of the Sacred Heart to me. As far as any ambiguity of the word wellness center - in Louisville almost ALL of the new health clubs are called &#34;Wellness Centers&#34; so I think that aspect is clear - is that a regional thing maybe? I do like the tagling though - very snappy. Is it possible to shift them to a deeper red - less bloody and more soothing? I think that will cut down on the medical feel - also maybe incorporate a softer color into the text to help even it all out.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 87814
    user: 2236
    date: 2004-12-30T09:40:00
    date_raw: Thursday, December 30, 2004 - 9:40 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I don&#39;t think I would go with a &#34;deeper red&#34;. To me, that is even more bloody. If anything, I would lean more in an orange direction, which has no relationship to blood or medical institutional imagery. Also, I don&#39;t mean to be intentionally contradicting Hugh on all accounts, but the dove thing seems to be a pretty far stretch. Anytime a heart is used as imagery, my first concern is avoiding the image of breasts or a butt. In this case, the only alternative image I can see beside the intended one is a flaming fart exiting a butt. <BR> <BR>I can&#39;t say I like the tagline at all. &#34;Houston Wellness Center: Wellness is our middle name.&#34; It is redundant and doesn&#39;t add any explanation or description. Something like &#34;Houston Wellness Center: Live a longer, healthier life&#34; or &#34;...Be stronger, live longer&#34; makes a suggestion about what the wellness center is about. &#34;...is our middle name&#34; is an old school clich� that refers to the speaker instead of the reader. Today&#39;s customer/client wants to be communicated with in terms of theirself. <BR> <BR>Good luck Jay.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 87824
    user: 2923
    date: 2004-12-30T10:16:00
    date_raw: Thursday, December 30, 2004 - 10:16 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">yikes - forgot about the whole error thing - been three months since I posted &#40;ugh&#41; if a mod could just delete one of those.  <BR> <BR>LOL - Scott - boy oh boy I must be way out of practice at critique &#40;heheheh&#41; - Instead of deeper I should have said cooler reds- not quite as far as a rubine, but something of that more calm feel - but orange is an energy color so if you can get them to make enough of a shift to be an actual orangey &#40;is that a word&#41; red then you cold inject a ton of energy into the logo.  <BR> <BR>Scott you are probably right - it is a bit cliche, but I think that is what appeals to me - it seems like it is coming full circle. There are a lot of taglines for hospitals around here that are those kinds of statements. Norton - Experience. Better Care.; Baptist East - Feel Better. Maybe it was just the whole going for the cute punch line that got the nostalgic side of me. <BR> <BR>As far as the dove - I swear I see it, but that may be the fact that I am from the south and you can&#39;t swing a dead cat without hitting a church down here. And I know of a couple that are actually called Hearts of Fire Church &#40;one was located in an old firehouse so it was always a bit corny&#41;. All I am saying is I have seen logos for churches that maximize the similarity between a flame shape and a downward dove - &#40;i&#39;ve even designed one or two&#41;. If I am the only one who sees it - then you are probably safe. - Just thought to mention it.</font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 87864
    user: polk-designs-users
    date: 2004-12-30T15:40:00
    date_raw: Thursday, December 30, 2004 - 3:40 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The flame is really up to debate right now. I only put it in my logo because it was in their former logo. I don&#39;t see how I can avoid a &#34;negative&#34; feel of having a flame over a heart. So the flame will probably be gone soon. <BR> <BR>I think just a heart would work fine and I like the suggestion of a differant red. When I first did the logo I was thinking really modern and progressive but now I think they need more of a sedate and passive feel.</font></font></font></font></font></font></font></font></font></font></font></font>
