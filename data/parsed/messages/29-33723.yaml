  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I enjoy writing in calligraphy, and I want to make a font that looks renaissance in style, with a stress on the pen and a humanist angle. I am showing an early sketch below. I don&#39;t have anyone to show it to, or ask my questions to, so hopefully you can help me make it decent. Parts of it look very chancery cursive-like, while the capitals, which I haven&#39;t started yet, will probably have more renaissance &#39;flair&#39;..possibly.  But please let me know what you think! <BR> <BR>So here&#39;s the first JPG. I&#39;ll put down a few of my initial questions/concerns following.. <BR> <BR><img src="http://www.typophile.com/forums/clipart/your_image.gif" alt="scan01.jpg"> <BR> <BR>Is this looking like a renaissance typeface? <BR>I like the tall ascenders, but how badly will this hurt it if I try to use it in text? <BR>Some of the letters are kinda tipsy, like the b and d, but if the uprightness seems okay, they&#39;ll be more like the third h, the l and the k. <BR>I have specific questions for several letters, but I&#39;ll see if it&#39;s worth continuing first. The only g that I like is the one marked down at the bottom. The marks on the w, b, and e just mean that I like those versions better than the previous versions on the page. <BR> <BR>All comments welcome. It&#39;s my first attempt at a typeface, but I&#39;m very determined to make it work. Thanks in advance! I have sketches prior to these, so let me know if you want to see previous versions or process of any of the letters. <BR> <BR>�Brian</font></font></font></font></font></font></font></font></font>
