    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">i am by no means an expert on calligraphy, but a friend of mine has made several calligraphic fonts that you can view and download from <a href="http://mysite.freeserve.com/Kingthings/fonts/fonts.htm" target="_blank"> his website</a>. Kevin&#39;s a good guy and perhaps he could be some help at giving you a crit on calligraphic letter forms. In any case his fonts are great to look at for inspiration, I think you may want to take a look at his Petrock for this one, as i think &#40;i could be very wrong&#41; that it is of a similar style as what you are trying to do. Hope this helps!</font></font>
  - id: 56294
    user: rian-users
    date: 2004-04-18T11:48:00
    date_raw: Sunday, April 18, 2004 - 11:48 am
    votes: null
    html: <font class="dontLookLikeCrap">Thanks for the link. I like the &#34;shape&#34; of calligraphic letters.. the angles mixed in with the round forms; something the petrock light really does well. <BR>I&#39;ve been doing some more reading, and I&#39;m redoing all of my letters..they&#39;re too handwritten/calligraphic. Hopefully it will turn out as something of a cross between jenson/bembo and calligraphy.. leaning more towards calligraphy. &#40;the cradle!&#41; &#42;&#42; Not to say it will look as good as jenson or bembo.. but that&#39;s the direction i&#39;m re-aiming. ;&#41;   </font>
