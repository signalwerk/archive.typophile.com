    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#34;this logo just 4 our school assignments&#34; is a bullshit excuse. <BR> <BR>School work can be your best work. Take this seriously. <BR> <BR>In real life you will have clients that have no consistant <BR>views regarding branding and identity, It will be your task to educate them and explain why some things will work and others <BR>will not. You will have to consider everything, and bill them for your expertise. <BR> <BR>Example- I am billing a client $2600 tomorrow to do pre-liminary scope of their branding needs. No actual design work just consulting and planning. With better planning better work will be done in the end that is target orinented and a real business tool with actual worth &#40;intellectual property&#41;, not just something to physically differentiate a restaurant from it&#39;s neighbor the corner grocery store.  <BR> <BR>Take this chance to created an original, logical, and aesthetic <BR>identity for a client &#40;even if it imaginary or a professor&#41;  <BR> <BR>In the real world you will have to fight for your ideas, or become  <BR>someone who just does as clients suggest and make a few bucks but never feels proud of the work. Later you may find clients that want you to think harder and develop better concepts but  <BR>because your portfolio does not reflect great concepts and deployment of concepts no one will listen. You are smart to ask good question at this stage in you education, and to spend the time to deliver a viable solution. This work can get you hired. <BR> <BR>This process will obviously take more time, so have another cup of coffee and stay up all night to deliver something exceptional.</font></font></font></font></font></font></font></font></font></font></font></font></font>
