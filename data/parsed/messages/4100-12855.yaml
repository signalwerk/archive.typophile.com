    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Kent, <BR>I believe this is what you a looking for... <BR>ShiftOptionApple &#39;   <BR>Once you&#39;ve hit this key command nothing appears to happen...what you don&#39;t see is that it has made the switch to primes/or glyphs depending on what your default is set at. Now hit &#39; and you&#39;ll see the change. <BR> <BR>Let me know if you have any problems. <BR> <BR>Chris  <BR></font></font></font></font></font></font>
