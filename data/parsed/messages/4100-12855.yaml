    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">...but it&#39;s more elegant if the primes given using Cmd-Shft-&#39; were actually &#34;dumb quotes&#34; and not the primes designed with the font.  <BR> <BR>I&#39;ve never noticed this to be the case, nor do I know much about whether designed primes are standard in a font or not. <BR> <BR>&#62; better than mousing through the Insert Glyphs <BR> <BR>Maybe somebody could write a script to do this with a keystroke.  :^&#41;</font></font></font></font></font></font>
