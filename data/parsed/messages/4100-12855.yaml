  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Okay all you InDesign experts: is there a way to override the typographic quote marks on a temporary basis from the keyboard in order to insert inch and foot marks?  <BR> <BR>I realize that I can just insert them from the Type &#62; Insert Glyphs... palette. But how tedious and clumsy is that?! In Quark &#40;Mac&#41; I could just use the control modifier key and type either control-&#39; for a foot prime or shift-control-&#39; for an inch double prime. <BR> <BR>Anything like this in InDD? <BR> <BR>-- K. <BR></font></font></font></font></font></font>'
