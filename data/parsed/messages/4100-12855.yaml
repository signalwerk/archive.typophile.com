    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks, John. I&#39;ll give it a try next time. Still not as elegant as the option in Quark, but better than mousing through the Insert Glyphs.  <BR> <BR>-- K. <BR></font></font></font></font></font></font>
