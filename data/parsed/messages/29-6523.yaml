    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">here&#39;s the file I threw at them.   <BR>  <BR>I tweaked the D, and finishes, and made the f look more capital.  ODF stands for the Ottawa Dressage Festival &#40;horses and owners in fancy dress doin fancy footwork stuff&#41; <BR><img src="http://www.typophile.com/forums/messages/29/6638.gif" alt=""></font></font></font></font>
  - id: 12740
    user: 596
    date: 2003-02-16T12:42:00
    date_raw: Sunday, February 16, 2003 - 12:42 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think that is funny that people think that 3-D is more &#34;professional&#34; or  finished&#34;. Every client should have access to Kai&#39;s Power Tools. Just Kidding. That would be lame. <BR> <BR>Perhaps it is too late, or your just plain done with it, but I think that the black type on the red could be lacking contrast. I don&#39;t have my Pantone book here so I could be wrong. But I have used black and this color before. <BR> <BR>I think knocking the &#34;ODF&#34; out, like the bottom one, might have a bit more punch. And I was wondering how it might look without the black frame. I guess what I am describing would be the bottom one- but red. <BR> <BR>Anyway, guess we  can&#39;t expect every client to see with the same set of eyes that we see with. Over all, designing and getting paid for it keeps me happy and I hope it does you. If you think about it, we get paid to draw. What more could you ask? <BR> <BR>-smc</font></font></font></font>
