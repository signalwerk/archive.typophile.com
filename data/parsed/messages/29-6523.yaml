    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Without seeing the design in context it is hard to make a judgement.     <BR>    <BR>Out of the three I like the one to the far right.    <BR>    <BR>From what you have given thus far I would say that you may be trying to force the symmetry to much. Mainly I see a problem with the &#34;F&#34;. It looks like an &#34;S&#34; to me. If indeed it is an &#34;F&#34; it looks too much like a lower case &#34;f&#34;.  It should be as important as the &#34;O&#34; and the &#34;D&#34;.   <BR>    <BR>The second one looks arabic, the dots are too much for me and the first, I think reaches &#40;sorry&#41; illegibility.    <BR>    <BR>Clients can be &#40;are&#41; a bitch.    <BR>    <BR>-smc</font></font></font></font>
  - id: 12593
