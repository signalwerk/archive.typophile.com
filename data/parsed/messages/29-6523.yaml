    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">no way, #1 rocks. ledgibility be darned, <BR>especially if the name will go right with <BR>it. but i do agree that the f needs some <BR>work. mainly to make it look like an <BR>uppercase rather than lower. <BR> <BR>if you&#39;re feeling daring, ask them why they <BR>felt the need to hire you if they could do <BR>it themselves in the first place. they just <BR>might agree that they don&#39;t need you, but <BR>you can always just bill them for the work <BR>so far. and please give them a message from me: <BR>any of the first samples are better than the <BR>second one you posted. good luck.</font></font></font></font>'
