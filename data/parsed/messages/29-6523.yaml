    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">After all that time I spent worrying about the typography for them...I put my foot down and threw them the files and said to be done with it.  <BR> <BR>check out what the had the nerve to suggest to me when one of their team had found photoshop. &#34;the said they wanted more &#34;dimension&#34; and for it to look more &#34;professional&#34; I absolutely freaked when they suggested that it didn&#39;t a&#41; look professional and b&#41; thought this was: <BR><img src="http://www.typophile.com/forums/messages/29/6633.gif" alt=""></font></font></font></font>'
  - id: 12736
