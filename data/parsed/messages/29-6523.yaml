  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> <img src="http://www.typophile.com/forums/messages/29/6524.gif" alt="ODF characters"> <BR> <BR>been on this for too long once again. the initials actually go inside a crest. but I&#39;m having problems &#40;more-so with the client&#41;  <BR> <BR>so its O.D.F eh. they want script fonts or cursive something or other. I started with Legacy. - they said it wasn&#39;t ledgible. &#40;Its an abbrev. inside a crest where the entire organization name is going to be printed underneath on their forms...for crying out loud.&#41; but its not ledgible they say...and some member got a creative hat on and found Shelley on his PC, passed it around and now their set on it. I refused - especially with their layout of it &#40;diagonal decending scale of character overlaped and everything - I refrained from a freak out where I would have screamed about ledgibility. t h e y are telling m e this is more ledgible!? but I see its that old problem. whatever is on the PC operating system is ledgible. So, in a panic moment realizing they were about to reck my crest, I said I&#39;d try something more &#34;Shelley&#34; to go in the crest - but after my merge of Legacy and Shelley-esque features its all gone wrong. <BR> <BR>can it be salvaged? do you see any potential? there&#39;s something about the finishes that&#39;s just not consistant. suggestions would be helpful. thanks <BR></font></font></font></font>
