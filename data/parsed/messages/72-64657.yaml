  html: '<font class="dontLookLikeCrap">P22 and The International House of Fonts announce the release of two new typefaces: Mantra and Bramble.   <BR> <BR>Mantra, designed by Fontana Type Foundry co-founder Amondo Szegi &#40;Hungary&#41;, blends the Roman alphabet with Tibetan calligraphy and Hungarian folk influences to create a true hybrid of world cultures in this striking display font. Also available is &#34;Mantra Xperts&#34; which includes several alternate letters and ligatures along with three dozen ornamental mandalas.  <BR> <BR><a href="http://www.p22.com/ihof/mantra.html" target="_blank">http://www.p22.com/ihof/mantra.html</a> <BR> <BR>Bramble, designed by American Greetings lettering team member Steven Rapp, is  a lively organic font that draws reference from Roman characters rather than Italic forms. It is also available as a two font set- Normal and Wild. Use Normal for small point-size settings to retain legibility. Combine both for invigorating display settings. <BR> <BR><a href="http://www.p22.com/ihof/bramble.html" target="_blank">http://www.p22.com/ihof/bramble.html</a> <BR> <BR>----------------------------- <BR>P22 type foundry, Inc. <BR>  International House of Fonts <BR>  Lanston-P22 <BR>  Sherwood Type <BR>PO Box 770 <BR>Buffalo, NY 14213 <BR><a href="http://www.p22.com" target="_blank">http://www.p22.com</a> <BR>Phone: 716-885-4490 <BR>Fax: 716-885-4482 <BR>-----------------------------</font>'
