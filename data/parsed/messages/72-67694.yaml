  html: <font class="dontLookLikeCrap">The deadline for submissions for presentation, workshop or  <BR>demonstration proposals for this year&#39;s ATypI conference in  <BR>Helsinki, Finland, is March 31, 2005. Proposals should be <BR>e-mailed to &#60;<a href="mailto:helsinkiprogram@atypi.org">helsinkiprogram@atypi.org</a>&#62;, and must include <BR>a c.100-word description and 50-word speaker bio. Please <BR>be sure to provide full contact information, including preferred <BR>e-mail address and telephone number. <BR> <BR>The original call for papers, with more extensive information, <BR>is posted <a href="http://www.typophile.com/forums/messages/72/63746.html?1106630602">here</a>.</font>
