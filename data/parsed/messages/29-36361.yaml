    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This idea is strong, loads of potential, very nice. The great thing <BR>about olive oil &#40;besides the obvious&#41; is the range of colors you  <BR>have at your finger tips. I wouldn&#39;t forget that, this could add  <BR>another dimension to the entire project. <BR> <BR>I agree that what is good for the &#39;o&#39; becomes too much for the  <BR>name. I also agree with adding a little more contrast. Although I  <BR>disagree with Hrant&#39;s typeface suggestion. Hrant, you shouldn&#39;t  <BR>mix type and drink. ;^&#41; joke, just a joke. <BR> <BR>I&#39;m not sure about adding pesto. Although it is really good &#40;yum&#41;  <BR>as a visual texture it might look more like, hmm, not good.</font></font></font></font>
