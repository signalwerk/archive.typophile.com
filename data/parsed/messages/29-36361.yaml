    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think if you take the nipple squirting milk off the A, it&#39;ll be fine. The other inperfections are less distracting. <BR> <BR>Hey Jill.... It seems your classes logo&#39;s are being spaced out over this month. Is this a long term project, and if so, when is it due.  <BR> <BR>I remember my restaurant identity in design school. I guess I had about two weeks before crit on the restaurant logo. The final crit encompassed the logo, restaurant layout, and menu. I had much longer on that. Will you be preparing multiple peices for the identity? <BR> <BR>Just curious, <BR> <BR>Andrew</font></font>
