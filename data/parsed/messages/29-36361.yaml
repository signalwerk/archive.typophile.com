    html: <font class="dontLookLikeCrap">Hey Jill <BR> <BR>I know its a pretty old post but I can&#39;t hold on to these beans and I&#39;m gonna spill&#39;em... <BR> <BR>I on the other hand quite like the typeface used for this logo. It gives me a sense of old Italy and I can almost see those olive tree&#39;s in the sun, while a group of roman soldiers are resting in the shadows... or something like that...kinda....almost. Anyhow I agree about the contrast of the logo and the colouring. I would have it a bit more greenish - but I&#39;m a sucker for green so don&#39;t mind me. hey talking about green - how about a few leaves? No? Nahhh your right...to used. <BR> <BR>And I like the squirting but keep it simple and not to much. Oh one thing that strikes me a bit &#34;easy&#34; The big &#34;a&#34; is exactly the same as the little &#34;a&#34; in the name with squirts and everything. Its seems a little &#34;copy/paste&#34; or is it just me?  <BR> <BR>Thats all from me - but I like the work... real nice <BR> <BR>Mark</font>
