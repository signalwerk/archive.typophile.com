    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Pretty cool! <BR>The oily &#34;a&#34; is really great &#40;although I think you need a lot more light/dark contrast - as you have it it&#39;s too flat&#41;. <BR> <BR>But I wouldn&#39;t make the logotype/name the same way. And I don&#39;t think Democratica is working. Try a script maybe, like Linoscript? Something upright, narrow and mannered. <BR>Maybe Bernhard Modern: <BR><a href="http://www.myfonts.com/fonts/bitstream/bernhard-modern/bold/testdrive.html?s=Apulia&amp;p=72" target="_blank">http://www.myfonts.com/fonts/bitstream/bernhard-modern/bold/testdrive.html?s=Apulia&amp;p=72</a> <BR>A little bit cliche, though, I guess. <BR> <BR> <BR>hhp <BR></font></font></font></font></font></font></font>'
