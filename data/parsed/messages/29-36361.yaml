  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This is a logo for an upmarket olive oil restaurant, where imported oil is sold &amp; quality oil is used in the cooking. I want the logo to reflect this oil theme &amp; would like the restaurant to appear fresh, clean &amp; classy.  Apulia is a region in Italy where 1/3 of the olives are grown, &amp; I have written this in olive oil. Your constructive criticism will be appreciated. Thankyou - Jilly<img src="http://www.typophile.com/forums/messages/29/36362.gif" alt="Apulia restaurant logo"></font></font></font></font></font></font></font></font>
