    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Zapf Humanist is Bitstream&#39;s version of Optima.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 36562
    user: 1014
    date: 2003-11-05T10:23:00
    date_raw: Wednesday, November 05, 2003 - 10:23 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">John, I like the radiating lines and the color seems to be a nice approach. Is the client <BR>really in Tucson? I did some hard time there. <BR> <BR>I don&#39;t care for the name, title, address <BR>etc. all in the same text block with no distinction. <BR> <BR>And Optima, while a great typeface for its time, <BR>imo, radiates a yucky aura -- 80s, banking, real estate. <BR> <BR> <BR>bj <BR>&#60;font &#62;</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 36565
    user: 1250
    date: 2003-11-05T10:27:00
    date_raw: Wednesday, November 05, 2003 - 10:27 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; real estate <BR> <BR>The first time you said that I didn&#39;t say anything, but now I gotta ask: <BR>Where did you get this Optima/Real-Estate angle? I&#39;ve seen them use Optima Bold in all caps, but really, the main thing Optima is associated with is cosmetics. Which makes it a great choice for masseuse: not too predictable, but a fruitful association. <BR> <BR>hhp <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 36568
    user: 1014
    date: 2003-11-05T10:45:00
    date_raw: Wednesday, November 05, 2003 - 10:45 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Take a second look at the Real Estate Magazines, <BR>Realtor Ads, Realty Companies in any <BR>specific geographic region. <BR> <BR>Lots of optima. <BR> <BR>If you were to put together a logobook for the <BR>banking industry, I bet you&#39;d see Optima quite <BR>a bit. <BR> <BR>The face, to me, is one of those stale typefaces.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 36569
    user: 1250
    date: 2003-11-05T10:48:00
    date_raw: Wednesday, November 05, 2003 - 10:48 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Well, I certainly I agree that it&#39;s generally stale. <BR>And it even has some inherent problems too, like being too gray. <BR> <BR>The really good news is that Optima has had an idiosyncratic revival: <BR><a href="http://www.creativepro.com/story/feature/20399.html" target="_blank">http://www.creativepro.com/story/feature/20399.html</a> <BR>Really a breath of fresh air. <BR> <BR>hhp <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
