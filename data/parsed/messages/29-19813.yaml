    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Linotype had some Optima Nova stuff in the <BR>TypeCon goodie bag. <BR> <BR>I&#39;ll check it out again.  <BR> <BR>I recently had a discussion with someone who <BR>insisted on using Andale Mono for something. <BR>I told him that was a face to avoid. <BR> <BR> <BR>In the bag of typefaces to avoid in general, I&#39;d toss in Optima,  <BR>the Apple System Fonts, the <BR>early 90s overused Emigre stuff,  <BR>and the &#39;tawdry&#39;&#42; stuff that sometimes comes in a big free bundle. <BR> <BR>Of course, there are appropriate uses for these, but not as a general logo workhorse, imo. <BR> <BR>bj <BR> <BR>&#42; tawdry is a stolen description from another thread <BR> <BR> <BR></font></font></font></font></font></font></font></font></font></font></font></font></font>
