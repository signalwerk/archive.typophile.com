  date: 2003-11-05T05:13:00
  date_raw: Wednesday, November 05, 2003 - 5:13 am
  votes: null
  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Any suggestions on color, format or type? It&#39;s a two-color job, for starters. <BR> <BR>As far as type goes, I went with Zapf Humanist. I was leaning toward any of the less &#34;mechanical&#34; Adobe sans faces like Eurostyle, Geometric231, Officina Sans, or Rotis. Any thoughts on the all lower case thing? <BR> <BR>The card: <BR> <BR><img src="http://www.typophile.com/forums/messages/29/19814.jpg" alt="anne1"> <BR> <BR>Close-up of text area: <BR> <BR><img src="http://www.typophile.com/forums/messages/29/19815.jpg" alt="anne2"></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
comments:
  - id: 36548
    user: 1250
    date: 2003-11-05T09:36:00
    date_raw: Wednesday, November 05, 2003 - 9:36 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think Optima is working great here. <BR>Just the full-height numerals look too big on the 3rd line. And I&#39;d superscript the &#34;th&#34;. And use small mid-dots instead of periods in the phone number. And maybe replace the comma with a mid-dot. And move the box slightly to the right. <BR> <BR>hhp <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 36554
    user: 1204
    date: 2003-11-05T09:58:00
    date_raw: Wednesday, November 05, 2003 - 9:58 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Hrant, <BR> <BR>Thanks for taking a look-see. Did I use Optima? I thought for sure I&#39;d used Z.H.. <BR> <BR>Yeah, that&#39;s a good point on the numerals. That&#39;s a made-up address so it may not be an issue -- I&#39;ll wait and see what the real address is before I decide what to do.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
