    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">For a religious book, but not a sacred text, and for an American audience, I would consider some of Goudy&#39;s faces, such as <a href="http://www.myfonts.com/fonts/linotype/itc-berkeley-old-style/" target="_blank">Berkeley</a> and <a href="http://www.myfonts.com/fonts/linotype/goudy/" target="_blank">Goudy</a> Old Style. These bring a warmth and personal touch you may want, depending on the nature of the text. If you decide on Goudy Old Style, I think P22 will probably soon reissue Lanston&#39;s version with the full descenders, which will probably be nicer.</font></font></font></font></font>
