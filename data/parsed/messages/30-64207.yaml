post:
  id: 91416
  user: favek-users
  date: 2005-01-29T13:12:00
  date_raw: Saturday, January 29, 2005 - 1:12 pm
  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey all.  Its me again Mr. Newb Layout. <BR> <BR>I work for a small town newspaper and my bosses and editor want to change our printing press to one closer in town.   The problem is now we have to resize or paper. <BR> <BR>So instead of running 11 inches tall and 14 inches high.  We are not supposedly running 10 inches high and 11.5 inches wide.  This is per page mind you. Also its a 4 column paper. <BR> <BR>I have been asked to find out how much smaller our ads are going to be and come up with the new dimensions.  I thought this was going to be easy but now I am finding that its not, well at least not me. <BR> <BR>I will create an action to re-size all the ad sizes once I find out all the new dimensions for our ads.  <BR> <BR>But does anyone have any suggestions on how to do this quickly?  It probably obvisous but just not seeing it. <BR> <BR>Thanks all for reading and making me look good <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0></font></font></font></font></font></font></font></font></font>
comments:
  - id: 91478
    user: 2289
    date: 2005-01-30T04:13:00
    date_raw: Sunday, January 30, 2005 - 4:13 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">If I understand you properly, these pages are not proportionate, so a full page ad would reduce approximately 91% horizontally and 82% vertically, obviously not an ideal situation. However, you don&#39;t mention the grid which is more critical than actual paper size, if you adjust margins and gutters you might be able to make a proportionate reduction. <BR>Tim</font></font></font></font></font></font></font></font>
  - id: 91587
    user: 5447
    date: 2005-01-31T06:50:00
    date_raw: Monday, January 31, 2005 - 6:50 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The question is how you bill out your advertising.  Per column inch or is it modular? <BR> <BR>If it&#39;s modular, I&#39;d just figure out the new sizes by doing the whole &#34;1/2 page is this on the old stuff, now it&#39;s this.&#34; by just figuring out what a half page is. <BR> <BR>OR, if your paper wants to keep the same number of column inches is per ad, then I guess it means redesigning all the ad sizes and just phasing out the old stuff. <BR> <BR>Example... <BR>The newspaper I ran we had our first issue as a tabloid, but every subsequent issue was a broadsheet &#40;50 inch web I believe&#41;.  I kept everything as &#34;3 col x 10 in&#34; or so, that way, when the ads that transferred to the next issue, all I had to do was go by my columns by inches. <BR> <BR>Maybe that helps, it might just sound confusing... It is 9 am for me, and I don&#39;t think the brain is functioning yet.</font></font></font></font></font></font></font>
  - id: 91616
    user: 1461
    date: 2005-01-31T09:47:00
    date_raw: Monday, January 31, 2005 - 9:47 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I don&#39;t think you can do any sort of formulaic resizing when the aspect ratio also changes. It sounds like you&#39;ll be creating a new grid layout for the new page size, right? As such, the ad sizes will change in relation to that.</font></font></font></font></font></font>
  - id: 91633
    user: favek-users
    date: 2005-01-31T10:37:00
    date_raw: Monday, January 31, 2005 - 10:37 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey all thanks for the responses.  Its a dreary monday morning and I am sick on top of it all!   <BR> <BR>We charge by the column &#40;i think&#41;. <BR> <BR>I havent messed with the grid yet I will check on it later this week when I have some more down time and I hopefully feeling better.</font></font></font></font></font>
  - id: 92060
    user: favek-users
    date: 2005-02-03T14:15:00
    date_raw: Thursday, February 03, 2005 - 2:15 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey all I am feeling better now.  I am spending this day try to figure out the re-sizing issue. <BR> <BR>Tim, you said mess with the grid and gutters and maybe I can figure out a porportionate reduction in all my ad sizes?  How would chaning the grid really effect anything?</font></font></font></font>
  - id: 92065
    user: favek-users
    date: 2005-02-03T14:35:00
    date_raw: Thursday, February 03, 2005 - 2:35 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey I think I did it.  I kept it 4 columns and made the gutter .125 brought in the left and right margins a few smidges and now the ad sizes proportionally scale down to the their correct size &#40;i.e. a quarter page is now a &#34;quarter page&#34;&#41; <BR> <BR>I think.  Now I only got to figure out an easy way of figuring out the new add dimenions sizes somehow.</font></font></font>
  - id: 92066
    user: favek-users
    date: 2005-02-03T14:39:00
    date_raw: Thursday, February 03, 2005 - 2:39 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Bah I spoke to soon.  Quarter pages fit fine by now 1/2 columns dont.  WTF?  Should I tell my superiors its not worth my time?  I guess I could go back and re-design every ad but I dont think they really want me to do that. <BR> <BR>This blows.</font></font>
  - id: 92167
    user: 2289
    date: 2005-02-04T06:50:00
    date_raw: Friday, February 04, 2005 - 6:50 am
    votes: null
    html: <font class="dontLookLikeCrap">Luis, <BR>Try reducing your original grid by 87% &#40;split between the two percentage reductions of the page size&#41;. This will change your margins and gutters in both directions. See how this affects the look of the page the side margins will be larger and the footer and header will be smaller &#40;proportionately&#41;. <BR>Tim</font>
