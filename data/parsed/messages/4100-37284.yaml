    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I apologie for not providing any explanation. The file is rar compressed, and it can be uncompressed with Winrar, Winzip, WinAce, Total Commander &#40;Alt&#43;F9, this is ex Windows Commander thnxs to M$&#41;.  <BR>Here are some links: <BR><a href="http://www.rarlab.com" target="_blank">http://www.rarlab.com</a> <BR><a href="http://www.winzip.com" target="_blank">http://www.winzip.com</a> <BR><a href="http://www.winace.com" target="_blank">http://www.winace.com</a> <BR><a href="http://www.ghisler.com" target="_blank">http://www.ghisler.com</a> &#40;generally this is a musthave&#41; <BR> <BR>The app needs no FL, and I believe it will work fine with any Python 2.x version, but be shure to have the adequate version of wxPython and PythonCard &#40;must have both&#41;. Theese are free for use and download: <BR><a href="http://www.wxpython.org/download.php#binaries" target="_blank">http://www.wxpython.org/download.php#binaries</a>  <BR>&#40;Windows, Mac OS X, Linux...&#41; <BR><a href="http://pythoncard.sourceforge.net/installation.html" target="_blank">http://pythoncard.sourceforge.net/installation.html</a> <BR>&#40;Windows, Mac OS X, Linux&#41; <BR> <BR>Finally there are two files in the rar archive: obid_06.py and obid_06.rsc.py. Double click on <b>obid_06.py</b> and after a few seconds &#40;or minutes :^&#41; the app will launch a window that imitates Brendans calculator, with lot of not-working-at-the-moment text-fields, radiobuttons and checkboxes, except the really important one - the big input text-field. Actually i blindly copied his calculator, but didn&#39;t figured all the meanings of his parameters &#40;ie frequency&#41;, and added a codepage selection list wich is probably unnecessary. <BR> <BR>Now grab some text and paste it in, click the �Calculate� button at the bottom of the window. A new window will pop up with the frequency of each char in our text.  <BR> <BR>The stats are shown in alphabetical order, for now, i didn&#39;t figured out some smart way to sort them by freq. A lot more computation is done, but it&#39;s simply not shown. I don&#39;t think i&#39;ll be able to work much more on this before my electromagnetism exam, but there will be a final version for sure. <BR> <BR>If you still have problems with the rar archive i&#39;ll post the uncompressed files. <BR> <BR>phew, this was a long one... <BR>g</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
