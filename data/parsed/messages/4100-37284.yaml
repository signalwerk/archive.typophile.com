    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Maybe this should have it&#39;s own tread. <BR> <BR>Hrant i&#39;m sorry, i&#39;ll never &#40;close future&#41; post here a rar file again. About the unicode, the script doesen&#39;t care what is it working with, and so far i haven&#39;t done anything to mess that up :^&#41; it works fine with cyrillic, see the picture below.  <BR>I&#39;m thinking to make an outside unicode txt file that will contain all the characters that we dont want to be treated as letters &#40;numbers, punctuation...&#41; so every user can define what he/she wants to be counted and what not. <BR> <BR>Here are two screenshots  <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/38070.gif" alt="screenshot 1"> <BR><img src="http://www.typophile.com/forums/messages/4100/38071.gif" alt="screenshot 2"> <BR> <BR>Here&#39;s the source.  <BR><!--attachment: obid_08-38072.txt*mime_txt.gif*text/plain*6.8*source*obid_08%2epy --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_txt.gif" align=left alt="text/plain">source<br><a href="http://www.typophile.com/forums/messages/4100/obid_08-38072.txt" target="_blank"><b>obid_08.py</b></a> (6.8 k)</td></tr></table></center><!--/attachment--> <BR><!--attachment: obid_08_rsrc-38073.txt*mime_txt.gif*text/plain*6.1*window+sheme*obid_08%2ersrc%2epy --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_txt.gif" align=left alt="text/plain">window sheme<br><a href="http://www.typophile.com/forums/messages/4100/obid_08_rsrc-38073.txt" target="_blank"><b>obid_08.rsrc.py</b></a> (6.1 k)</td></tr></table></center><!--/attachment--> <BR>If you already have installed Python, wxPython and PythonCard, download obid_08.py and obid_08.rsrc.py in one same folder, and then just doubleclick obid_08.py <BR> <BR>As i&#39;m aware there is no windows specific coding here, so the script should work on Mac and Linux too. <BR> <BR>Hope you&#39;ll have no problems this time, and please send your opinions.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
