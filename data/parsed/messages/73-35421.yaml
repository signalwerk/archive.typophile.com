  html: <font class="dontLookLikeCrap">this is something i concepted and began building a year ago or so but it was met with general disinterest when word was posted on LETpress. consequently, i have stopped applying myself to its development and am busy with other more satisfying pursuits. <BR> <BR>meant to function as an umbrella organization for those interested in slugcasting, but uninterested in, &#40;and unable to&#41; build or maintain a web portal for sales. a fine idea whose time has not yet come? <BR> <BR><a href="http://www.linotypesetting.com" target="_blank">http://www.linotypesetting.com</a> <BR> <BR>perhaps i&#39;ll just need to get a Lino myself. <BR> <BR>ah if i only had the space...</font>
