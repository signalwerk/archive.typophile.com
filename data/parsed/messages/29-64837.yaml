    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#60;font class=&#34;dontLookLikeCrap&#34;&#62;OK, thanks for the crit Scott.  <BR> <BR>Just went through some whirlwind revisions and here&#39;s the result: <BR> <BR>Second Iteration <BR><img src="http://www.typophile.com/forums/messages/29/65022.jpg" alt="Second iteration"> <BR> <BR>Third Iteration <BR><img src="http://www.typophile.com/forums/messages/29/65023.jpg" alt="Third iteration"> <BR> <BR>Final Logo <BR><img src="http://www.typophile.com/forums/messages/29/65024.jpg" alt="Final logo"> <BR> <BR>Any thoughts?&#60;/font&#62;</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
