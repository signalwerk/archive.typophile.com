    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">a butterfly over the strong box... <BR>i dont know... <BR>i think you ar looking for the esay and fast answer. <BR>try better of work with your butterfly, redraw it. <BR>I think is still a litle taked of a clipart. <BR> <BR>creo que le falta vida, �chala a volar. <BR> <BR>Suerte <BR>JP</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 92826
    user: 2701
    date: 2005-02-09T04:53:00
    date_raw: Wednesday, February 09, 2005 - 4:53 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I don&#39;t know about it being the easy or fast answer. The butterfly idea was chosen over several concepts that weren&#39;t shown here. The client liked the idea of the butterfly because it is like a gift, emerging from the cocoon, etc... It sounds like you are critiquing the second layout with the more &#34;realistic&#34; butterfly--I did redraw the butterfly in the last item in my post--I agree that the more realistic butterfly was too easy and much too complicated for a logo, but I think the colour version simplifies and enhances the concept. The wings of the butterfly become bows on the box. <BR> <BR>I&#39;m open to criticism on this, but I&#39;m not sure I understand where you are coming from. Thanks.</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 92828
    user: 2915
    date: 2005-02-09T05:23:00
    date_raw: Wednesday, February 09, 2005 - 5:23 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Jeff I like the treatment of the last butterflies but I hate the type. I hate letterspacing for no reason. Also ask yourself will it work at the smallest size you will use it. I bet ON THE RUN will fall apart. Remember type doesn&#39;t have to justify to be a logo.</font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 92832
    user: 2701
    date: 2005-02-09T05:39:00
    date_raw: Wednesday, February 09, 2005 - 5:39 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Good point Daniel. I&#39;ll have another look at that.  <BR> <BR>I do think that stylistically &#40;is that a word?&#41; that tracking the letters in all caps does help with legibility and it also feels a bit more elegant. It may be possible to make &#39;on the run&#39; more solid by not letterspacing it. I&#39;ll play around with it.</font></font></font></font></font></font></font></font></font></font></font>
  - id: 92846
    user: 2172
    date: 2005-02-09T07:26:00
    date_raw: Wednesday, February 09, 2005 - 7:26 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I like the &#39;butterfly as bow&#39; idea, but the &#39;on the run&#39; concept is diminished in your newer versions. What if the butterfly was alighting on the upper-left plane of the diamond &#40;box&#41;? So you&#39;d see the &#39;bow&#39; from the side rather than from above? It would add some action/dynamics to the logo which would conceptually compliment &#39;on the run&#39; while maintaining the bow thing. You could also add the ribbon cross back on the box. The top-down view reminds me of pinned insects in a museum.</font></font></font></font></font></font></font></font></font></font>
  - id: 92852
    user: 2701
    date: 2005-02-09T07:41:00
    date_raw: Wednesday, February 09, 2005 - 7:41 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Good idea, Chris. Thanks. <BR> <BR>I have played down the &#39;on the run&#39; part of the identity a bit because it sort of cheapens the feel that we are trying to create for the company. However, it is there in the name, so I should likely do a better job pulling it out.  <BR> <BR>The clientele they are going after is corporate and relatively high end. The on the run part is that they are the only ones in this market to provide a complete online solution for this service.</font></font></font></font></font></font></font></font></font>
