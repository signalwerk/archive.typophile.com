  - id: 93001
    user: 1461
    date: 2005-02-10T09:18:00
    date_raw: Thursday, February 10, 2005 - 9:18 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#34;Also, &#39;on the run&#39; is not a tagline, it&#39;s actually the name of the company.&#34; <BR> <BR>Uh...yea, I kind of messed that up.  <BR> <BR>So, it sounds like this is a company that delivers gifts quickly via orders placed online.  <BR> <BR>It also sounds like you are being asked to use the name &#39;gifts on the run&#39; and an image of a &#39;butterfly&#39;. If that&#39;s the case, I think you&#39;ve done a good job.  <BR> <BR>However, you may have troubles with the image/type size relationship if this is for online use. I&#39;d probably make the type the main visual and much larger in relation to the mark.</font></font></font></font>
  - id: 93002
    user: 108
    date: 2005-02-10T09:28:00
    date_raw: Thursday, February 10, 2005 - 9:28 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Could the type connote &#34;on the go&#34; more explicitly and then the butterfly be used as an accent? As if the butterfly happened to land on the type as it is on the go? Am I up in the night?</font></font></font>
  - id: 93010
    user: 2701
    date: 2005-02-10T10:10:00
    date_raw: Thursday, February 10, 2005 - 10:10 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks for the comments Darrel and Tiffany. <BR> <BR>Darrel, I also have a horizontal version for online use which makes the type much larger and more legible. <BR> <BR>Tiffany, we had done several versions before the ones I&#39;ve posted here that were like that, and the client decided she liked the more stationery bow version. I am going to look at &#34;speeding up&#34; the typography a bit for the final version though to get that across. <BR> <BR>Thank you all for your comments. Much appreciated.</font></font>
  - id: 93200
    user: 3768
    date: 2005-02-11T13:58:00
    date_raw: Friday, February 11, 2005 - 1:58 pm
    votes: null
    html: <font class="dontLookLikeCrap">It might just be me, but I don&#39;t think your latest designs say high-end gifts. Overall I get the sense of a quickie-mart. Perhaps because there&#39;s a local gas station chain called &#34;on the run&#34; and the rounded corner diamond box reminds me more of a traffic sign than a gift. I think Chris had some very interesting suggestions in his Feb 9th critique. The new placement of the butterfly could help emphasize the &#34;gift emerging&#34; concept that brought in the butterfly symbol in the first place. And I would also suggest looking at different type solutions. The type in your initial posting had a little more of a sophicated feel to it. The sans, although easy and clear to read, in it&#39;s current layout &#40;justified, and loosely kerned&#41; just seems stuck on. Would it be possible to intergrate the type and the mark?</font>
