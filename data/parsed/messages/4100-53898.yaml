  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">i&#39;m wrestling with two things here: inexperience, and, inexperience. <BR> <BR>i have two designs for an upcoming version of MT that aim to make the store more user-friendly and more showcase-efficient. no more flash, just html. <BR> <BR>the whole idea is to make the site function better as a store. so, the graphic design is quite basic. <BR> <BR>here&#39;s my problem: one design is sort of aggressive, supporting the logo/namesake, but may be a bit confusing to some users navigation-wise. however, this same design may be more appealing to designers as a group, which is my target market. the other design is quite feminine by comparison, and while it is about as intuitive navigation-wise as it gets, i&#39;m not sure the design sends the right image for MT. <BR> <BR>here&#39;s my question: should i cast as wide a net as possible, and go for &#34;no brainer&#34; usability? many designers may think this approach a bit cheesy, but i won&#39;t lose the segment of designers who could care less about MT&#39;s aesthetics and just want concise functionality &#40;in either case, myfonts.com comes to mind&#41;. <BR> <BR>aggressive: <BR><a href="http://www.meantangerine.com/beta/store03/home07b.png" target="_blank">latest pixel font page</a> <BR><a href="http://www.meantangerine.com/beta/store03/home07a.png" target="_blank">latest photo page</a> <BR> <BR>playful: <BR><a href="http://www.meantangerine.com/beta/store03/home09b.png" target="_blank">latest pixel font page</a> <BR><a href="http://www.meantangerine.com/beta/store03/home09a.png" target="_blank">latest photo page</a> <BR> <BR>please weigh in on this for me, even if you just send one word denoting which design you like better; aggressive or playful. <BR> <BR>i really need some help on this.</font></font></font></font>'
