    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Ole <BR> <BR>thank you for the input, but i am really  <BR>stuck here. Do you suggest a way that there could  <BR>be more harmony between C/o/b? <BR> <BR>The form i&#39;d like to keep is b. For the C and o  <BR>am not sure. <BR> <BR>If you wish i could sent you the file to make  <BR>your proposals. <BR> <BR>Here are some more efforts... <BR> <BR><img src="http://www.typophile.com/forums/messages/29/66048.gif" alt=""> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/66049.gif" alt=""> <BR> <BR>christos</font></font>
