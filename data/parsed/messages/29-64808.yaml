    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hello again  <BR> <BR>The project doesn&#39;t move too fast as you see. <BR>We abadoned the first idea and i started  <BR>designing a &#34;font&#34; for the logo.  <BR> <BR>I had great problems with C and i am not sure  <BR>if i solved them.  <BR> <BR>The pseudofraktur is a quick modification  <BR>of the original letters...i think my colleagues  <BR>won&#39;t like them, but i am a kind of obssesed  <BR>with the gothic types, so i had to give a try. <BR> <BR>I am looking forward for comments... <BR> <BR>christos <BR> <BR><img src="http://www.typophile.com/forums/messages/29/65901.gif" alt="sample"> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/65902.gif" alt="detail"></font></font></font></font></font></font>
