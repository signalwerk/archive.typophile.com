    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hugh, although its been used a million times i like the chefs hat versions, the reason being it implies quality food. You don&#39;t want this to come across as fast food, but convenience food thats quality. What I think you could work on is the type and the colors. The one everyone is responding to comes across as to corporate looking &#40;for my taste&#41;</font></font></font>
  - id: 70546
    user: 2236
    date: 2004-08-06T08:41:00
    date_raw: Friday, August 06, 2004 - 8:41 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap">RE: Colors - I would&#39;ve agreed with Daniel on this pre-Martha, but now I think it is very appropriate for DIYers. <BR> <BR>RE: Type - The current type doesn&#39;t really bother me. I guess Chalet 1960 &#40;<a href="http://www.houseindustries.com/house.php?kit=CHALET-FO" target="_blank">http://www.houseindustries.com/house.php?kit=CHALET-FO</a>&#41; might work well, but I don&#39;t know that it would be any better�just different. <BR> <BR>RE: Angles - Hugh, the angle effect I had mentioned earlier was not meant for the boxes, but rather the elements within the boxes. The boxes would remain the same as they are currently. Anyway, it might defeat the simplicity that you have now. <BR> <BR>RE: Alternatives - I already voiced my opinion of #3, but #4 has potential. I think the thing that bothered me about it in the first place was the inconsistency of line quality�the border and hat have very smooth lines, but the type has rough lines. Sometimes this works for contrast, but I&#39;m not lovin&#39; it here. The color scheme is not working for me either. I like the purple, but not the green, or maybe go with the #2 color scheme. <BR> <BR>Aloha! <BR>Scott</font></font>'
  - id: 70577
    user: 2923
    date: 2004-08-06T13:04:00
    date_raw: Friday, August 06, 2004 - 1:04 pm
    votes: null
    html: '<font class="dontLookLikeCrap">The client has it all narrowed down to two which I will be tweaking and posting tonight or over the weekend. It is the 3 icon idea and the box concept &#40;the one that looks like a jar label&#41;  <BR> <BR>Customer requests were to pump up the color a little on the 3 icon and she needs to see the tweaked oven dial - she&#39;s not sure she&#39;s sold on that being the middle one - she thought like I did and one other poster here that the plate could be in the middle and some sort of food at the end - I told her it felt a little redundant and she kinda understood that, but I may still need to show here a proof. <BR>She liked the typeface &#40;futura&#41; but wasn&#39;t sure about all lower case - I told here it made it feel infinitely less formal and accentuated the circular shapes that are echoed in the icons. I may still have to show her - I may also play with a similar font, but I really want absolute circulars to keep it open as well as echo the circles in the logo. Scott: the Chalet was an excellent suggestion I love that font as well! Might add a little more flavor while keeping it in the same feel or possibly kabel or avant garde I just need to look at them <BR> <BR>After seeing the concepts - her partner recalled seeing another logo similar to this on another sight &#40;untrademarked&#41; - it had been pretty poorly done, they felt, so they hadn&#39;t listed it with their competitors that I should look up - therefore - how suprised was I to find something similar to his already out there. The other logo is not focused on the process as this one is and is rather more &#34;homemade&#34; looking. They aren&#39;t sure if the logo will be franchised or not, but from the look of the site - it is probably a regional only company. The owners of teh company didn&#39;t seem too uncomfortable with the situation - they weren&#39;t sure it would be a problem, but I don&#39;t know if that is just because they want to be done with the process or if they really don&#39;t feel competitive with this other group. Our account rep for them feels like ours is different enough that we should go with it - and I do feel that with branding and style we will be differentiated enough that there won&#39;t be confusion which is the goal - but there is that &#34;pride and plagerism&#34; and honor among theives thing that I don&#39;t want to be ripping off someone else&#39;s logo. What are everyones thoughts about that? <BR> <BR>On the second one  they like it because of its similarity to their old logo and that it is different than any other one.  <BR>I am going to also play with fonts. Scott - I hear what you are saying about the smooth rough contrast, but a really want a fun feel to this one with type that almost feels like its part of a salad being tossed or ingredients being mixed - think Muppets&#39; sweedish chef - but I may be off base there - gonna try spumoni and maybe a few others - I may hate them - any suggestions for something that will have a similar fun feel but may be a little more streamlined?  also the colors will definitely change on this she felt it was a little too old feeling for her so we will try it in some brighter colors. Their colors historically have been blue and orange and they really would like to stay there - already have the floor and walls done in those colors and are building a second one with those specs - we had the conversation about a fesh coat of paint being a heck of a lot easier than trying to force colors that may not work for your branding down people&#39;s throats and she relented, but wants to at least give it a try. <BR> <BR>So - there we are - going to work on those two concepts tonight and over the weekend. Thanks for all the help so far.</font>'
