    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">i can kinda agree with daniel on this one.  <BR> <BR>Since i can consider myself  part of the &#34;pager, cellphone generation&#34;. the logo with the timer is not really recognizable and if i saw that logo i probably would know what it meant unless i read this thread. dont get me wrong these ideas are great but maybe something more cliche since the people who are going to use this are not going to have the time to read into the logo or know what the company does for that matter.   <BR> <BR></font></font></font></font></font></font></font></font></font>
