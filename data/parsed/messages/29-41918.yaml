  date_raw: Monday, August 02, 2004 - 8:37 pm
  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I am currently workingon an identity for a company called Ready... Set... Dinner! &#40;exclamation theirs - I&#39;m not quite THAT excited&#41;. They recently changed their name from Ready For Dinner - &#40;what a stretch&#41;. Anyway - for background - they are one of those places where you go and prepare like 12 entrees at a time &#40;they do all the shopping, prep work and clean up&#41; and you take home the 12 entrees to freeze and then pop in the oven - Since you made it yourself you know its fresh, &#34;homemade&#34;, and adjusdted to your personal tastes &#40;for an additional fee you can pay them to assemble the meal&#41;. Anyway - it is a new concept  to our area &#40;Louisvilla&#41; and the owners already are ready to franchise into Chicago and a couple of other cities around here. I have attached their original logo and my first few drafts - let me know what you think. A couple of the elements &#40;such as the chef hat in 2 or 3 of them&#41; were requested regardless of cliche &#40;but oddly enough among their competitors its about the only &#34;food&#34; symbol that hasn&#39;t been used. <BR> <BR>The logos should be upbeat - the branding style will be coming along - already a couple of her competitors have latched onto A&#41; the Williams Sonoma look or B&#41; the kitchy 1950&#39;s I Love Lucy look - we will probably be avoiding those just for differentiation - so we are going for a more laid back look. They asked that I not focus on Ready...Set...Go as rushing or hurrying so clocks and speed were not part of the concepting <BR> <BR>Let me know what you think - A couple of them I am not sure about type arrangement in relation to logo and I am not sold on all of these fonts, but Its been in our office - but not in my worklog - &#40;hmmm how nice is that&#41; for a pretty long time &#40;about 3 weeks&#41; and the customer is aching to see proofs - so I will probably go with these for now, but would like some objective eyes on ways to tweak them in the next month or so... <BR> <BR> <BR>1&#41; Here is the original logo &#40;only about 2 years old - I&#39;m not sure who did this one&#41; <BR> <BR>2&#41; Trying for a kind of swooshy &#34;Panera Bread&#34; kinda thing - not really sure I like it <BR> <BR>3&#41; This one would go with the tag line &#34;Meals like Magic&#34; It really is a leftover idea I had when we were batting around the name Abracadinner! But we liked the concept so here it is... <BR> <BR>4&#41; This one is really a take on their original logo - keeping the chef hat, but bringing it a little more current in style. This one reminds me of a mayonase label... <BR> <BR>5&#41; I think I like this one best - clean and elegant more my style, but maybe too WilliamsSonoma. However - the client did tell me her favorite magazine is Real Simple - so... It my fly... Any ideas on how to make the icon in the middle more obviously a switch to set an oven without going overboard? <BR> <BR>6&#41; The customer asked for one that says Ta-Daa! I&#39;m not really big on that concept but this is pretty close to what I sketched in my book - didn&#39;t flesh it out cause I think it won&#39;t make it past round one &#40;shame on me&#41; <BR> <BR> <BR>Thanks guys for any input.... <BR> <BR><img src="http://www.typophile.com/forums/messages/29/41919.jpg" alt=""> <BR><img src="http://www.typophile.com/forums/messages/29/41920.jpg" alt="RSD2"> <BR><img src="http://www.typophile.com/forums/messages/29/41921.jpg" alt="RSD3"> <BR><img src="http://www.typophile.com/forums/messages/29/41922.jpg" alt="RSD4"> <BR><img src="http://www.typophile.com/forums/messages/29/41923.jpg" alt="RSD5"> <BR><img src="http://www.typophile.com/forums/messages/29/41924.jpg" alt="RSD1"></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
