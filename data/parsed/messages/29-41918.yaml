    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Oh btw - got a call from them earlier on today - it will be #3,4,or 5 - And unless we try to bring in another one of the concepts that we just had in sketch version we should just be tweaking these three for a couple of days. <BR> <BR>I think though I like 5 the most any of those three won&#39;t kill me because I have some cool visual and layout ideas for each of them when we get to collateral. <BR> <BR>But I&#39;m rooting for #5</font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
