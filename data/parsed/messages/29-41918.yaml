    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I like #5 also. It would look great on the side of a vehicle. <BR> <BR>Before I read your explanation, I thought the icon was a timer &#40;the word set could go either way, timer or oven knob&#41;. Maybe you could try using the negative space to create a slim white vertical line above the knob &#40;showing the off position&#41;, then the knob &#40;which I think usually turns to the left&#41; would look like it was rotated from a set position, rather than a ticking timer. <BR> <BR>Have you tried a version where the icons are at angles. I realize it isn&#39;t as &#34;Real Simple&#34;, but it might be worth exploring. Right now they look a little rigid, but the curves of the colored boxes is a good contrast. <BR> <BR>Good work. Aloha! <BR>Scott</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
