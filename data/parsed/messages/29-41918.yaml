    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">i guess what iam trying to say is that the timer is hard to see, and if you look at it it actually looks like a cup of coffee viewed from the top. since its next to a bowl of soup and diner plate <BR> <BR>its goes from soup, timer, to diner. doesnt really make sense. <BR> <BR>what do i know!  <BR> <BR>just a student <BR> <BR>-greg <BR> <BR></font></font></font></font></font></font></font></font>
  - id: 70295
    user: pablohoney77-users
    date: 2004-08-04T15:06:00
    date_raw: Wednesday, August 04, 2004 - 3:06 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">maybe the order of the icons should follow the order of the words in the name with something like groceries in the first box, a timer or oven knob in the middle and the steaming meal in the last block. just an idea. as one who actually does cook &#40;and i&#39;m assuming this company is catering to an audience that has some knowledge of how to use an oven&#41; i get the knob, esp mark&#39;s version with the ticks. but maybe it&#39;s cuz i&#39;ve been exposed to this thread and i like the icon, makes it hard for me to have a totally objective eye. <BR>&#40;or maybe even the empty place setting could go in the middle box... like set the table&#41; okay i&#39;ll stop, i&#39;m rambling.</font></font></font></font></font></font></font>
  - id: 70330
    user: 4035
    date: 2004-08-04T23:39:00
    date_raw: Wednesday, August 04, 2004 - 11:39 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">In a nutshell, Hugh, what do you want this logo to communicate? You mentioned in your original description that you want an upbeat logo but also that you are going for &#34;a laid back look.&#34;  <BR> <BR>Who is your target market? <BR> <BR>Anyway, just wanted a couple of clarifications to give a more informed critique . . . </font></font></font></font></font></font>
  - id: 70371
    user: 2923
    date: 2004-08-05T07:53:00
    date_raw: Thursday, August 05, 2004 - 7:53 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The real target market is soccer moms and the icons in number five are following the process. Mix it up &#40;used the blue for that one because it is the stage where it is frozen&#41;, then cooking with the oven dial &#40;warm orangy color for cooking&#41; and then dinner - plate and fork - they want to really focus on getting the family back to the table - hence the place setting versus a steaming covered platter. <BR> <BR>They want to show that the experience is hassle free - you don&#39;t have to shop, you don&#39;t have to prep, you don&#39;t have to clean - you just show up, mix the stuff up to your taste, take it home &#40;frozen of course&#41;, bake it and serve. We found that showing any kind of representation of the taking the food home connotated delivery so we&#39;ve kept the cars, wheels, bags, etc. out we also found that indicating anything about freezing visually made people think more of tv dinners which this is trying to get away from.. <BR> <BR>There also needs to be a sense of levity that cooking dinner doens&#39;t have to be a chore, but can be a rewarding experience one with a good deal of satisfaction. <BR> <BR>paul - originally I did have the plate in the middle with a table in the far right  &#40;or a smile with a yum-yum tongue&#41; for that exact reason &#34;set the table&#34;, but the two became redundant and nothing was showing the rest of the steps well. So set the table became set the temperature or set the oven and voila thats what we have. So the icons are Ready - get the dish ready by mixing the ingredients, Set - Set your oven at home and put it in, Dinner - enjoy the meal. And the concern over the oven knob is one that I already have - even with the tic marks does it still not get across the idea of setting an oven? Not necessarily a literal translation, but just the idea. <BR> <BR>Dan - Sorry - I was asking about the retro type - were you just referring to the type in #2 &amp; 3? What I call the  I Love Lucy look? I&#39;m not altogether sure about that font myself - especially with two big competitors doing the 50&#39;s kitch thing. <BR> <BR>Now the owners of the place that I work are both soccer moms - they are &#34;everyone&#39;s demographic&#34; - young, upper midclass, drive SUV&#39;s, very attractive, stylish, career oriented , the whole nine yards - and they &#34;got it&#34; &#40;they weren&#39;t in on the concepting, but they do know what the company does&#41;. <BR> <BR>There is also the question of differentation - since these ladies will be franchising this across multiple cities &#40;louisville, chicago, maybe stlouis&#41; in the midwest - it needs to be differentated well from the competition which have used things such as, steaming dishes of food, dinner bells, a single plate, 1950&#39;s kitch, etc. Oddly enough - the chef&#39;s hat is the only clic� that isn&#39;t used.  <BR> <BR>Everyone is only commenting on number five - the owners might choose one of the others since this style may be too similar to others out there. Are the other two that up for consideration &#40;magic spoon &#40;3&#41; and chef&#39;s hat with spoon&#40;4&#41;&#41; just not worth sticking with - should I go back to the drawing board for those concepts? I personally like 5 the best because it is cleaner and I think conveys a more total message, but there is only so much you can really show in a mark. <BR> <BR>A lot of this company&#39;s story will have to be told through the branding process that just can&#39;t be summed up in a mark that is clean and simple - but I think that is the case with many companies the logo itself is the key to the personality and function of the brand but rarely can show the entire process...</font></font></font></font></font>'
  - id: 70384
    user: 4035
    date: 2004-08-05T08:31:00
    date_raw: Thursday, August 05, 2004 - 8:31 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hugh -  <BR> <BR>Thanks for the detailed explanation about the co. . . <BR> <BR>I think everyone might be commenting on #5 because it is by far the most successful logo. Although the timer may not be instantly recognizable, IMO all of the images you are using in the &#34;boxes&#34; work well. I am not sure about the font, I would like to see you try some other choices; you also might want to think more about the color . . . I &#34;like&#34; the colors and I like the concept behind them but something to keep in mind is that blue is the &#34;least appetizing color&#34; &#40;it seems that might be a bit magnified when used in combination with that shade of green&#41; --  i would say the overall feel of the colors do not represent food/dinner/appetizing. They do, however, communicate the aspect you mentioned about dinner not being a chore . . . <BR> <BR>About #3: <BR>I am just not sure about this one . . . reminds me of the television show Bewitched. Perhaps with a different font the overall logo would work better, i am not sure. I agree with Scott, just the spoon makes me think of soup. <BR> <BR>#4: <BR>This one is the weakest of the three IMO -- it looks very generic. Not crazy about the font . . . overall, this one just looks cartoonish, childlike. <BR> <BR>I personally thought the icon of #2 worked well &#40;the next best after #5&#41;, perhaps you could try combining the feel of the icon of #2 with the concept of #4.</font></font></font></font>'
