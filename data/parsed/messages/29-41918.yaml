    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Stylized temp marks on the dial might help, in line with the details on the other two icons. <BR> <BR>Does the space afte the elipse seem a bit tight on 5?</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 70085
    user: 2923
    date: 2004-08-03T11:20:00
    date_raw: Tuesday, August 03, 2004 - 11:20 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks for the ideas so far! <BR> <BR>I tried to put tic marks on the dial and it seems a little &#34;up periscope&#34; for me or too much like a target mark for printing - is this what you guys were referring to? I also felt like it might help if it was pointing at a temperature that was a little closer to where one would bake - in the other version it would be barely defrosting. Is that important or do you think the directional aspect of having the arrow help guide the eye through the logo outweighs that? Also - I didn&#39;t put a space after the elipse which though its wrong gramatically they felt it kept it together as one company name better so we&#39;re trying it on both ways, not sure where we&#39;ll land there... Scott I&#39;ll have to give the idea of tilting the blocks a shot a littel later - too crammed for time right now... <BR> <BR><img src="http://www.typophile.com/forums/messages/29/41978.jpg" alt="RSD6"> <BR> <BR>What about type on the other ones especially #2 I am not sure I like that font or placement in realation to the logo. Is the font too I Love Lucy retro? I am also posting a &#34;simplified&#34; version of the magic spoon that may feel less cluttered... <BR> <BR>Also - the tag line will not be part of the logos I just included it for reference - thats why they were so far away they would be a seperate entity altogether. <BR> <BR>The tag line for the &#34;magic spoon&#34; is Meals like Magic... <BR> <BR><img src="http://www.typophile.com/forums/messages/29/41979.jpg" alt="Simplified #2"> <BR> <BR>Opinions please....</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 70099
    user: 2236
    date: 2004-08-03T12:13:00
    date_raw: Tuesday, August 03, 2004 - 12:13 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I was thinking something a little more like this for the dial/knob &#40;see below&#41;, which indicates that there is a rotation &#40;not a scope&#41;. This also brings it to the same level of complexity/detail as the other two icons. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/41986.jpg" alt="Dinner logo"> <BR> <BR>Also, I thought the words were spread out a little too much. <BR> <BR>I&#39;m not crazy about the abracadinner concept, although, that is a great spoon. It just doesn&#39;t say enough�My first reaction to a spoon is soup related. <BR> <BR>Aloha! <BR>Scott</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
