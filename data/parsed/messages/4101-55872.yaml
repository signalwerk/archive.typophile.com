    html: '<font class="dontLookLikeCrap">One extra suggestion: <BR> <BR>Avoid to start the family name with multiple capital letters in FontLab 4.x/Mac &#40;like &#34;XYZFontname&#34;&#41; . This may result in improper ps file names. And surely the safer way to prepare all names is to click on the &#34;Build Names&#34; button. <BR> <BR>Johnych</font>'
