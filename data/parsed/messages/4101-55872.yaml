    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">It&#39;s hard to say without having a look, but don&#39;t forget to <BR>run Font Cache Cleaner when you&#39;re testing font names. <BR>OSX caches the names and then tortures you with them later. <BR>That is, if you&#39;re using said OS. <BR><a href="http://homepage.mac.com/mdouma46/fcache/fcache.html" target="_blank">http://homepage.mac.com/mdouma46/fcache/fcache.html</a></font></font>
