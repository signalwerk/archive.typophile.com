    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Here are the logos. Top is primary logo and the rest are project specific...promotionals, banners, collateral.  <BR>Adding the TM was clients request as an afterthought. We had it without but he was given legal advise to include it. We are actually re-printing several business cards because if this.  <BR> <img src="http://www.typophile.com/forums/messages/29/13050.jpg" alt="fizx logos"></font></font></font></font>
