    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Business cards... <BR>We did a test printi run to see response. Orange design appealed to younger audience, top right with clouds worked best with older folks and business people. Design is being re-designed  to look like top Banner. Client also acquired FIZX.com domain so Fizxwireless.com will be utilized for traffic.   <BR>New Re-Design will be printed on 144 Lb Yupo synthetic paper to be run with brochure &#40;almost completed-will upload comps soon&#41;. <BR>Thanks for the critiques.  <BR><img src="http://www.typophile.com/forums/messages/29/13056.jpg" alt="business cards"></font></font></font></font>
