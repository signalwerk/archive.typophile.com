    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">bj, i have no real knowledge on the subject, i am saying however that  <BR>a&#41; the tm thingy puts me off, you see it on every damn sign, signature, lame logo, everywhere for no reason <BR>b&#41; somebody suggested that it had no use, even as far as the law is concerned. that was a few days back, in another thread &#40;discussion about TM and R symbols&#41; <BR>c&#41; logically thinking, having the tm sign acts more as a warning. not displaying it doesnt mean you havent paid for the copyright. i dont see how it can stop potential dillutions from people who really mean to achieve their goals. <BR> <BR>i have heard about the ASI policy you are mentioning <BR> <BR>after examining a few big brands&#39; logos, i must say many of them carry the R sign, but it&#39;s size compared to the logo&#39;s size is minimum, so it doesnt get in the way or visually distract you, which is the case for fizx </font></font></font></font>
