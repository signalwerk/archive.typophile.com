    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Using the Fizx logotype in the bumper sticker is fine, but I think the logotype itself could use some reworking. The proportions of the letters seem awkward, and there&#39;s some conflict between the use of rounded and squared corners. Just MHO. <BR> <BR>Paul</font></font></font></font>
  - id: 23035
    user: 1014
    date: 2003-07-17T15:54:00
    date_raw: Thursday, July 17, 2003 - 3:54 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey Ole...long time no talk.  <BR> <BR>I&#39;d take a look at the Z and the X. <BR> <BR>The Z seems a tad bit leaning back <BR>and the X seems a tad bit leaning forward. <BR> <BR>The legs of the X seem to splay a little wide. <BR> <BR>And like Paul said, the F has some rounding <BR>that seems to not show up elsewhere. <BR> <BR> <BR> <BR>Is the typeface Unicratica... <BR> <BR> <BR>--- <BR> <BR> <BR>                                        On a tangent: The discussion of TM is way off.  <BR>                                        At least I &#42;think&#42; so.  <BR> <BR>                                        &#62;&#62;a dding the &#34;tm&#34; sign is lame, if not useless.  <BR> <BR>                                        This will be passed around as myth, along with  <BR>                                        myths like: &#34;I can use someone else&#39;s copyrighted  <BR>                                        material if I change it 30%.&#34;  <BR> <BR> <BR>                                        There are many strong reasons to use a TM  <BR>                                        symbol and when you have an official  <BR>                                        trademark, the � symbol.  <BR> <BR>                                        The strongest reasons:  <BR> <BR>                                        _ it establishes the fact that your company  <BR>                                        has trademark &#34;intentions&#34; and  <BR>                                        puts competitors on notice that you consider  <BR>                                        the mark &#42;your&#42; intellectual property.  <BR> <BR>                                        _ if gives you a &#34;date of first use&#34;, which is  <BR>                                        valuable should someone else also use a similar  <BR>                                        mark and is necessary when you file a trademark app.  <BR> <BR>                                        _ showing a pattern of &#34;protecting the mark&#34; and <BR>keeping records of such protection  <BR>helps keep the  <BR>                                        mark from being diluted &#40;Kleenex, Xerox, etc.&#41;  <BR>                                        and helps you if someone infringes on the mark.  <BR> <BR>                                        _ choosing not to use a TM is fine if you have  <BR>                                        no intellectual property intentions. In this  <BR>                                        case, FIZX has a clever name that deserves protection.  <BR>     <BR>                                        Filing a formal trademark is $335 per class.  <BR> <BR>                                        The &#34;lame&#34; issue is valid. Many companies in the  <BR>                                        Action Sport Industry &#40;surf,skate,snow,moto,etc.&#41;  <BR>                                        do not use TM on actual goods, against  <BR>                                        the advice of counsel, because it&#39;s seen as  <BR>                                        corporate and lame.  <BR> <BR>                                        There are probably other reasons to use a TM,  <BR>                                        but I can&#39;t really think anymore.  <BR> <BR>                                        bj  <BR></font></font></font></font>'
