    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Alex, I agree the logo is a bit shallow in the bumper sticker, the sacrifice was consistency vs. aesthetics. <BR>Client choose consistency. Here is the authentic Din  <BR>style Sticker that was rejected. Could perhaps use a tiny bit of kerning but idea was killed before that stage.   <BR><img src="http://www.typophile.com/forums/messages/29/13053.jpg" alt="euro din sticker"></font></font></font></font>
