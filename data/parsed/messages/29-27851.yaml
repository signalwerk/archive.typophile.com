  - id: 50775
    user: 2942
    date: 2004-03-05T18:17:00
    date_raw: Friday, March 05, 2004 - 6:17 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I really like this idea. It looks promising. <BR> <BR>Here is my crit- The base of your font&#39;s shape &amp; our clue as to the identioty of a glyph is alluded to with the curves &amp; then knot or celticness goes over that often ending in very modern square edges.&#40; why monospaced?, why modern shapes as a base?&#41; This technique adds a consistancy &amp; tension to the font which is fun - but in some characters not enough consideration is given to the form to be evoked &amp; the glyph gets bogged down by an extreme regularity. The K is like that. VW &amp; X are not. The zero,Q and the &#39;&amp;&#39; are like that. The H is not. Q is a great glyph to venture beyond basic rules. Really it&#39;s the charcters where you venture from your base idea &amp; do something beyond it which work best to me.  <BR> <BR>One other idea - what about making the thread vary in width here &amp; there to give emphasis? I have seen celtic art that used that to great effect.</font></font></font></font></font></font>
