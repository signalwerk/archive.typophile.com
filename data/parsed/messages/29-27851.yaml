    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; This technique adds a consistancy &amp; tension to the font which is fun <BR> <BR>Like Newlyn&#39;s Missionary. Did you guys know it&#39;s based on OCR-A? Amazing. <BR> <BR>BTW, I just remembered this, from the RIDT&#39;98 conference: <BR><a href="http://diwww.epfl.ch/w3lsp/conferences/ridt98/browne/" target="_blank">http://diwww.epfl.ch/w3lsp/conferences/ridt98/browne/</a> <BR><a href="http://members.optusnet.com.au/cameronb/fonts-1.htm" target="_blank">http://members.optusnet.com.au/cameronb/fonts-1.htm</a> <BR>And it&#39;s all automatic! <BR> <BR>hhp <BR></font></font></font></font></font>'
  - id: 52293
    user: lschickert-users
    date: 2004-03-17T20:47:00
    date_raw: Wednesday, March 17, 2004 - 8:47 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I created the monospaced letters because when I was creating it and putting the letters into sentences, I enjoyed the interweavings that were created not only in the letters, but also within the words. See the example below. <BR> <BR>I tried to keep the knotwork relatively true to traditional forms, specifically in the sharp edged corners where it applied to. This is also why the cord width in the letters is regular. I also wanted to create the letters forms out of the cord instead of using the cord to fill in the letter forms, although  I do like the effect that it gives to letters when it is used. <BR> <BR>I am looking for new ways to try to do the &amp;, with the letter having the over and under pattern to begin with, it is hard to work the over and under pattern of the celtic knotwork into the &amp;.  I am also looking into creating different forms for some of the other letters that are not as successful as others.  <BR> <BR>Thank you for the input, and keep it coming! <BR><img src="http://www.typophile.com/forums/messages/29/28821.jpg" alt=""></font></font></font>
