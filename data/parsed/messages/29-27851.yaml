  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><img src="http://www.typophile.com/forums/messages/29/27853.jpg" alt=""> <BR>This font is based off of the continuity and connectedness of Celtic knotwork.   This is a rough draft, still in the works.  I would like to recieve some feedback.  I am trying to think up a name.  Maybe interlacing? Any ideas?  </font></font></font></font></font></font></font></font></font></font></font></font></font>
