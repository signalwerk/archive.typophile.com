    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Looks like a great opportunity for some decorate dropcaps and crazy ligatures! I&#39;d like to see more complex and tightly-woven forms.</font></font>
  - id: 52498
    user: 2022
    date: 2004-03-19T10:21:00
    date_raw: Friday, March 19, 2004 - 10:21 am
    votes: null
    html: '<font class="dontLookLikeCrap">This is a very interesting concept, Lisa!  <BR> <BR>One thing I have trouble with is differentiating &#34;B&#34; and &#34;8&#34;... And also, I think that perhaps the crossbars in those two characters would benefit from intertwining on both ends instead of just one...  <BR> <BR>I have a similar issue with the zero figure: perhaps the diagonal bar should be one long cord rather than two short ones that almost touch in the middle..., or, as an alternative, keep the two cords, but have them tightly intertwined, like in your &#34;H&#34; character&#39;s crossbar. <BR> <BR>Looking forward to seeing more of this, <BR>Ricardo</font>'
