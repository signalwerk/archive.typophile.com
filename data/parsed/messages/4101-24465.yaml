    date: 2004-01-20T11:24:00
    date_raw: Tuesday, January 20, 2004 - 11:24 am
    votes: null
    html: '<font class="dontLookLikeCrap">Regarding Romanian: <BR> <BR>There is a fiddle with Romanian diacritics. Earlier versions of Unicode unified the Romanian S/s with &#39;comma&#39; accent below to the Turkish S/s with cedilla &#40;U&#43;015E/U&#43;015F&#41;. Later, Unicode disunified these, and separately encoded the S/s with &#39;comma&#39; accent &#40;U&#43;0218/U&#43;0219&#41;. However, the old Windows 8-bit codepage 1255 that covers Romanian, uses the older Unicode encoding. This means that in such fonts you should use the S/s with &#39;comma&#39; accent glyph in the S/s with cedilla codepoints. <BR> <BR>If you are making a multilingual OT font that needs to support both Turkish and Romanian, and also provide backwards compatibility support with the old 8-bit codepage, you need to include a Localised Forms &#60;locl&#62; OT layout feature for the Romanian &#60;rom&#62; language system tag that maps the S/s with cedilla glyphs to the S/s with &#39;comma&#39; accent glyphs. Note that this substitution is not supported in currently shipping apps, but will be supported in future versions of Windows, so it is a good idea to get it in your fonts now. <BR> <BR>Unicode also previously unified T/t with &#39;comma&#39; accent and T/t with cedilla &#40;U&#43;0162/U&#43;0163&#41;, but later disunified these and separately encoded T/e with &#39;comma&#39; accent &#40;U&#43;021A/U&#43;021B&#41;. However, I have yet to locate a single language that actually uses T/t with cedilla, so the best thing to do is to include only glyphs for T/t with &#39;comma&#39; accent, and <i>double encode</i> them to both the T/t with &#39;comma&#39; accent codepoints and the T/t with cedilla codepoints &#40;the latter are used in the old 8-bit codepage&#41;. <BR> <BR>Hope all this makes sense <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0></font>'
