    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Marius,  <BR> <BR>as for the design of Polish glyphs, I can recommend my article published in the ATypI/Graphis book &#34;Language Culture Type&#34;: <a href="http://www.amazon.com/exec/obidos/ASIN/1932026010/twardoch-20/" target="_blank">http://www.amazon.com/exec/obidos/ASIN/1932026010/twardoch-20/</a>  <BR> <BR>Also refer to the Microsoft &#34;Diacritics Design Standards&#34; document: <a href="http://www.microsoft.com/typography/developers/fdsspec/diacritics.htm" target="_blank">http://www.microsoft.com/typography/developers/fdsspec/diacritics.htm</a>  <BR> <BR>I recommend looking at the design of &#34;Helvetica Linotype&#34;, the &#42;new&#42; OpenType version of Helvetica &#40;look at <a href="http://www.linotype.com/" target="_blank">http://www.linotype.com/</a> &#41;. The diacritics are quite good.  <BR> <BR>Finally, consult people who know about such things <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0>  <BR> <BR>Regards,  <BR>Adam Twardoch <BR></font></font></font></font></font></font></font>'
