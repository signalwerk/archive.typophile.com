    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks everyone for the feedback. Some more details on what I am looking into: <BR> <BR>I need to add Romanian diacritics to some fonts with western encoding. I am using FontLab, and would be interested in the whole process: adding composites &#40;I know how to add composites, but I want to get &#34;professional skills&#34;&#41;, codepages, conversion mapping, hinting etc.</font></font>'
  - id: 45004
