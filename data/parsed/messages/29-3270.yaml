  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This is a Logo/Mark design that i am planning on using for a t-shirt/graphic art company. as you can see the name of the company is quiiver. the company will be mostly urban influenced. but not limited to that. <BR> <BR>this is the logo. i used east bloc ICG as a base and expanded it from there. obviously going for that russian look.  <BR><IMG SRC="http://www.typophile.com/forums/messages/29/3271.gif" ALT="quiiver"> <BR> <BR>and this is the mark.  <BR><IMG SRC="http://www.typophile.com/forums/messages/29/3272.gif" ALT="quiiver mark"> <BR> <BR>any comments would be helpful as im about to start using this. <BR> <BR>thanks abunch. wil.</font></font></font></font>
