    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#34;classical guitar music, like maybe something you&#39;d hear from eric clapton&#34; <BR> <BR>The blues?</font></font></font></font></font></font>
  - id: 92620
    user: 2278
    date: 2005-02-08T03:59:00
    date_raw: Tuesday, February 08, 2005 - 3:59 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The last concept feels very &#39;Fender&#39; -- I know that technically it&#39;s not very much like the Fender logo at all, but it does have that feeling about it. <BR> <BR>If it&#39;s blues they&#39;re playing, maybe you could go back to some classic blue-style inspiration. Think dirty, rough, customised, worn; the blues to me &#40;I&#39;m a big fan&#41; is all about feeling, emotion, empathy; try and get some blood, sweat and tears into the logo. I know that&#39;s all a bit clich�d and abstract, sorry <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> <BR> <BR>On the other hand, as Tiffany says, you should probably not try and put too much character &#40;of the music&#41; into the logo, as it&#39;ll pigeonhole it too much. <BR> <BR>I do actually like the scripty logo -- maybe you could echo a fretboard somewhere in all the vertical strokes &#40;particularly the &#39;H&#39;&#41;. Just watch you don&#39;t go too &#39;Rock Caf�&#39; ;&#41;</font></font></font></font></font>
  - id: 92684
    user: rian-users
    date: 2005-02-08T11:10:00
    date_raw: Tuesday, February 08, 2005 - 11:10 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I almost didn&#39;t mention any names because I don&#39;t want to have too specific of a feel. The main thing is that it will go on acoustic guitars that don&#39;t need amplification. Some other ideas I&#39;m trying to go for are: natural, man-made, and quality. <BR> <BR>This version is an angled script like D&#39;Aquisto, Fender, and Gibson. I think the logo should look like a guitar logo, but hopefully it can still be unique.  <BR> <BR>I&#39;m also concerned about the loop in the H and the loop in the y balancing. Also the n is not at exactly the same slant as everything else &#40;it&#39;s baroque! -er, not really&#41; so that the left stem of the n didn&#39;t get too clogged up where it meets the e and the stroke at the top of the n. I took out a small wedge at the top of the n to help. I&#39;m not sure how much this will come into play if we need to screen it. But maybe this non-perfect angle makes it seem less mechanical. <BR> <BR>I do still want the final logo to feel personal and have some character even though I might not be going directly for &#39;blues&#39;. So I just might end up giving it some texture, as long as it doesn&#39;t take too much away from any quality aspect.</font></font></font></font>'
  - id: 92820
    user: 2278
    date: 2005-02-09T02:45:00
    date_raw: Wednesday, February 09, 2005 - 2:45 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think all of the slightly irregular things in the logo &#40;the loops&#39; balance, the n slant&#41; actually contribute to it&#39;s &#39;authenticity&#39;, it&#39;d look too mechanical if everything slotted together too well IMO. <BR> <BR>That said, I would maybe bring the H loop down a little, so that the left stem of the H has a bit more length to it -- this may help the balance a little too without looking deliberate! <BR> <BR>Jordan</font></font></font>
