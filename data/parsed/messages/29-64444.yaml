post:
  id: 91842
  user: rian-users
  date: 2005-02-01T20:13:00
  date_raw: Tuesday, February 01, 2005 - 8:13 pm
  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi, <BR>The logo will go on the heads of the guitars, and is the first name of the guitar maker. The woods are generally dark so I&#39;m picturing this in white or cream, although if I can figure out how to get it to look good in metallic gold, I might go that route. Anyhow, after some sketching, I&#39;ve cleaned up my favorites a little and here they are. Please let me know what you think, and I&#39;ll rework the best ones some &#40;well, a lot&#41; more. <BR>Thanks, <BR>Brian <BR> <BR><img src="http://www.typophile.com/forums/messages/29/64445.jpg" alt="guitar logo roughs"></font></font></font></font></font></font></font></font></font></font></font></font></font>
comments:
  - id: 91849
    user: 2482
    date: 2005-02-01T23:02:00
    date_raw: Tuesday, February 01, 2005 - 11:02 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">What kind of guitars is he making &#40;acoustic/electric&#41; and what kind of music would he like the guitars to be associated with? <BR> <BR>I like the first one most, even if it looks like something else that I have seen before on some guitars &#40;can&#39;t remember which brand&#41; <BR> <BR>Left/bottom has a certain quirkiness &#40;caused by the &#39;y&#39;&#41; that I like, but it has to be worked on more. How about an &#39;E&#39; drawn with a single stroke? <BR> <BR>Right/top is the one I find weakest.</font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 91915
    user: 2236
    date: 2005-02-02T09:15:00
    date_raw: Wednesday, February 02, 2005 - 9:15 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Yah, I agree�right top and middle left are weakest. They seem to say lasso, which is too narrow of a market�unless country western artists are the only folks your client wants to sell to. <BR> <BR>So that narrows it down to the other three, all of which are strong enough foundations for a refined logo design. I like Jan&#39;s suggestion for the single stroke &#34;E&#34; in the bottom left concept. <BR> <BR>Aloha! <BR>Scott</font></font></font></font></font></font></font></font></font></font></font>
  - id: 91919
    user: 108
    date: 2005-02-02T09:39:00
    date_raw: Wednesday, February 02, 2005 - 9:39 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I don&#39;t know that I would necessarily worry about what kind of music these guitars will be associated with. If they are good guitars you won&#39;t want to limit the market and the market will in turn not want to be limited. By that I just mean most guitarists who are in it for the long haul don&#39;t only own one guitar because they can&#39;t create all the sounds they want to with one guitar. Their &#34;vocal&#34; range is dependant upon several different instruments. <BR> <BR>When I saw these first sketches, the three on the left were more interesting to me, the bottom two being stronger than the top. The bottom being expected, not necessarily a bad thing, and the middle being the most interesting. The bottom could have a little bit more of warmth by adding more of that wedge serif you&#39;ve used on the R. The monolinear nature of the middle though needs to be pushed and explored. I&#39;d say play with contrast.</font></font></font></font></font></font></font></font></font></font>
  - id: 91930
    user: 2127
    date: 2005-02-02T11:04:00
    date_raw: Wednesday, February 02, 2005 - 11:04 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">You may want to consider the shape of the peghead and its interaction with the design of the logo &#40;mind the washers that hold the tuning keys in place&#41;.  <BR> <BR>Also, see if the maker uses the same color tuning keys all the time &#40;gold, chrome, ivory finish etc.&#41;. I&#39;ve found guitarists are sometimes sensitive to everything matching, or at least coordinating on their instruments.</font></font></font></font></font></font></font></font></font>
  - id: 92281
    user: rian-users
    date: 2005-02-04T23:09:00
    date_raw: Friday, February 04, 2005 - 11:09 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I asked a few questions, and he &#40;Henry&#41; doesn&#39;t ever plan on making electric guitars. I haven&#39;t asked about tuning key colors but I will soon. <BR>He and his friends basically just play classical guitar music, like maybe something you&#39;d hear from eric clapton. Some fingerpicking, but also using a pick, or strumming by hand. Nothing heavy, and nothing country. I do think the middle two are off because of this, but I&#39;ll try a few more revisions on just the middle-left one.  <BR>I think the bottom left may end up being the best so I&#39;m saving it for last - I think the single-stroke E would mirror the R really well. <BR> <BR>In the meantime, here&#39;s an update on the first one. Thanks again for all the thoughtful comments! <BR> <BR><img src="http://www.typophile.com/forums/messages/29/64683.gif" alt=""></font></font></font></font></font></font></font>
  - id: 92495
    user: 1461
    date: 2005-02-07T07:46:00
    date_raw: Monday, February 07, 2005 - 7:46 am
