  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I have been thinking of starting a collaborative project to produce &#34;the most neutral&#34; linear sans serif by blending individual submissions together. <BR> <BR>Participants would download an eps template of basic outlines to start neutralizing from, making each character seem most &#34;itself&#34; &#40;in sans context&#41;. Letterfit should not be considered. When enough submissions were recieved the forms would be merged into one &#34;ultimately neutral&#34; font. <BR> <BR>I&#39;d expect it to turn out to be a stylistic hybrid, but perhaps quite readable. It would be interesting to see how forms would evolve over time and so on. <BR> <BR>It could be a problem to get a reasonable amount of participants. In typophile there may be tens of typenuts willing to participate, but to get others, perhaps non-type people involved could be harder, considering the effort...? Character set should be very limited... <BR> <BR>Does it sound like worth trying?</font></font>
