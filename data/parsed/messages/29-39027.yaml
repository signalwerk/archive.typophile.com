    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">just thought of this, it mimics one of their flagship products, the dual LCD fusion cart.  <BR><img src="http://www.typophile.com/forums/messages/29/39100.gif" alt="cart"></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 65448
    user: helv-users
    date: 2004-06-24T01:48:00
    date_raw: Thursday, June 24, 2004 - 1:48 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think you are trying to hard, logo design is about reduction, simplicity, I agree with david_g seek inspiration in the actual product, think of the structure, how it works�etc. <BR> <BR>One example is the logo for the Pompidou Centre designed by Jean Widmer, it is a direct response to the fantastic architecture of the building, it is simple, bold, memorable and has been in use for over thirty years� <BR> <BR><img src="http://www.typophile.com/forums/messages/29/39103.gif" alt="Pompidou Centre Logo"></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 65463
    user: 3793
    date: 2004-06-24T04:59:00
    date_raw: Thursday, June 24, 2004 - 4:59 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I agree go for something more generic, a nice word mark or something like craig mentioned. <BR> <BR>I would also sway away from some of the 3d looking and gradient logos, maybe thats me but I have seen an many identities like that recently, and I think the normal vectors still look the best. Some of the other logos are not very legible either, like the dot matrix thing. I would keep exploring this one.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 65465
    user: 3472
    date: 2004-06-24T05:26:00
    date_raw: Thursday, June 24, 2004 - 5:26 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Mike, you really need to check out the Knoll logo, it really says alot about their furniture by just using simple san serif typography.  <BR> <BR>Think about the reasons people are buying office furniture. 1. They don&#39;t want it to break. 2. They want the style to last forever. 3. They want it to be comfortable. 4. They want it to be versitile. 5. They want it to be cheap.  <BR> <BR>Now your logo should problably be able to describe at least 4 out of 5 of those topics or it will be unsuccesful. Good Luck</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 65496
    user: 3929
    date: 2004-06-24T09:03:00
    date_raw: Thursday, June 24, 2004 - 9:03 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks for your responces everyone. I&#39;m having a hard time with this one.  I understand what you are saying about the Knoll logo David, but I know my client and he wouldd honestly laugh at me if I presented versatables in helvetica, and wanted some money for it.  I think with versatables, style is out of the picture....all that really matters is function and it being a solid product. I&#39;ll keep at at and see what happens.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
