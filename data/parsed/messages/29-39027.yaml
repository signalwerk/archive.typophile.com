  - id: 65526
    user: 1735
    date: 2004-06-24T12:42:00
    date_raw: Thursday, June 24, 2004 - 12:42 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi mike, <BR> <BR>Just look for an easy &amp; memorable shape. You have the T that could be just a leg of the table or even look for a &#34;cool&#34; table surface and yes, keep it simple is the best.  <BR> <BR>I know it&#39;s not an easy task to &#34;sell&#34; your idea to the client, I&#39;ve just had a case where the logo concept was totally subverted &amp; destroyed. &#34;Put some wings&#34; on those letters they said. <BR> <BR>I&#39;ve remembered Psyops ARMCHAIR font that can be a starting point &#40;they have a flash try that I&#39;ve used and print screened 2 variations&#41;, check some examples I&#39;ve made. Hope they can be of any help. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/39152.gif" alt=""></font></font></font></font></font></font></font></font></font></font></font></font></font>
