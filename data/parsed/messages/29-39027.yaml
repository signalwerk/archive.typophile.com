    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Maybe if you showed him why the knoll logo works he might understand that a simple solution could be very powerful.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 65502
    user: 2236
    date: 2004-06-24T09:35:00
    date_raw: Thursday, June 24, 2004 - 9:35 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Mike: <BR> <BR>I don&#39;t think David meant to use Helvetica specifically and I&#39;m not sure that you were being literal either, but a point I&#39;d like to make regarding presentation to clients and positioning yourself with clients is this� <BR> <BR>Position yourself as the expert in regard to design, then back it up. Talk the talk, walk the walk, look the look, do whatever you have to in order to give your client confidence in your abilities, then earn their respect. This is done by doing your homework &#40;research and sketching&#41;. Follow David&#39;s advice and find some successful industry logos &#40;Knoll, Ikea, Design Within Reach, Herman Miller, etc.&#41;, then collect attractive applications of those logos for presentation purposes. After you&#39;ve sought this inspiration, combine it with the knowledge you&#39;ve gained about your client&#39;s products/services, personality and objectives and put your pencil to paper. Once you&#39;ve done this you are very likely to develop some significant logo concepts on the computer. Finally, between the concepts &#40;even if they are just logotype&#41; and the research, an even slightly level-headed client will not laugh at your concepts. <BR> <BR>Take it for whatever it&#39;s worth. I just hate to see a talented designer submit to his client&#39;s limitations so early in the design process. Come up with a great concept which has proven relevance. <BR> <BR>Aloha! <BR>Scott</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
