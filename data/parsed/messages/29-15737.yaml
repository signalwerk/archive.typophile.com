    date_raw: Wednesday, September 10, 2003 - 4:56 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">It&#39;s all well and good for us to sit around and trash the UPS logo, and I agree, as a designer I lament the decision to &#34;update&#34; it in the manner they did. That said, none of us were privy to the dicussions, strategy, planning, research, etc. that supported the identity change. It was a process to be sure, and one which I am very sure everyone involved took very, very seriously.  <BR> <BR>Is it good design? My gut response is no. But let&#39;s take a minute to ask ourselves what really makes design good. Is it being pretty? Stylish? Well crafted? Relevant? Effective? Clear? Maybe, just maybe, UPS&#39;s primary audience is not graphic designers, design historians, and so-called typophiles. Maybe this new logo WORKS for them.  <BR> <BR>That&#39;s it. Just a little injection of perspective. Personally I use FedEx.</font></font></font></font>
