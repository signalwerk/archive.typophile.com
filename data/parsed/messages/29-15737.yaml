    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">yes, graphic design can happen without type - but logo&#40;types&#41; can hardly happen without type. last time I checked TDC annnuals, included many, many logos for awards and review...in the typographical vein.  <BR> <BR>If a logo is pure graphic design, and typography is an element or tool for graphic design you still can�t say a logo has nothing to do with typography.  <BR> <BR>Its like saying Louis Armstrong has nothing to do with the Trumpet , but everything to do with Jazz. <BR> <BR>-dirty</font></font></font></font>
