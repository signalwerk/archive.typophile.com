    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#34;&#34;Logo&#34; is Greek for &#34;word&#34;, though it is widely used to indicate all corporate trademarks. Marks may be symbols &#40;marks without type&#41;, lettermarks &#40;letters form the name&#41;, logos &#40;a word&#41;, or combination marks &#40;symbol and logo together&#41;.&#34;  - Alex White, the elements of graphic design, p.342. <BR> <BR> <BR> <BR> <BR>David Hamuel</font></font></font></font>
