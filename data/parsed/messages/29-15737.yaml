    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Start thinking outside the bouma. <BR> <BR>I think the UPS/RIP one is hilarious, despite the chopped u  <BR>awkwardness. The bow plus the word &#34;remember&#34; is great  <BR>&#40;i.e. tying a string on your finger to remember&#41;. <BR> <BR>Just don&#39;t get offended when graphic designers use type to  <BR>tell a story / create a mark / make someone pause or  <BR>consider something other than glyphs and word-shapes.  <BR>It&#39;s what graphic designers do. In fact, we deliberately  <BR>invited two graphic designers to sit on the judges panel for  <BR>that very reason.</font></font></font></font>
