  html: '<font class="dontLookLikeCrap"><b>Veer Announces: New Jukebox Typefaces for June 2004</b> <BR> <BR>Veer is pleased to announce the addition of two new typefaces to our very own <a href="http://www.veer.com/jukebox/">Jukebox</a> collection. These typefaces can be found in the June edition of the <a href="http://www.veer.com/ideas/catalogs/">Veer Visual Elements Catalog</a> and on our web site. <BR> <BR>............................................................................................................................................ <BR> <BR><img src="http://www.typophile.com/forums/messages/72/38447.gif" alt="Jukebox Martini"> <BR> <BR><a href="http://www.veer.com/products/typedetail.aspx?Image=JBT0000069">Martini</a> by Jason Walcott <b><font color="808080">&#123; Jukebox </font></b>} A swinging and energetic brush-style script - that&#39;s what gets served up with Martini. One weight. Exclusively from Veer. <BR> ............................................................................................................................................ <BR> <BR><img src="http://www.typophile.com/forums/messages/72/38448.gif" alt="Jukebox Geometric Soul"> <BR> <BR><a href="http://www.veer.com/products/typedetail.aspx?Image=JBT0000068">Geometric Soul</a> by Jason Walcott <b><font color="808080">&#123; Jukebox </font></b>} An decorative all-caps face inspired by a hand-lettered cartoon title card. The geometric Art Deco flavor gives Geometric Soul a historical, yet distinct visual punch. One weight. Exclusively from Veer. <BR> <BR>............................................................................................................................................ <BR> <BR>For more information regarding these new type products, contact: <BR> <BR>Jacqueline Wallace <BR>403 313 4942 <BR><a href="media@veer.com">media@veer.com</a></font>'
