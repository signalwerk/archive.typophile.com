  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><b>Veer Announces: New &amp; Exclusive Typefaces for February 2004</b> <BR> <BR>Veer is pleased to announce the availability of several new and exclusive typeface releases this month. All of these typefaces can be found in the February edition of the <a href="http://www.veer.com/ideas/catalogs/">Veer Visual Elements Catalog</a> and on our web site. <BR> <BR>............................................................................................................................................ <BR> <BR><img src="http://www.typophile.com/forums/messages/72/26065.gif" alt="Umbrella Amorinda"> <BR> <BR><a href="http://www.veer.com/results.asp?image=UMT0000021">Amorinda</a> by Alejandro Paul and Angel Koziupa <b><font color="808080">&#123; Umbrella </font></b>} An energetic, yet disciplined face of uplifting beauty. Presenting Amorinda, a new treasure from the Argentine foundry Sudtipos, now available exclusively as part of the Umbrella type collection. The Amorinda family includes two weights: Regular and Alternate. <BR> <BR>............................................................................................................................................ <BR> <BR><img src="http://www.typophile.com/forums/messages/72/26066.gif" alt="Umbrella Downtempo"> <BR> <BR><a href="http://www.veer.com/results.asp?image=UMT0000022">Downtempo</a> by Alejandro Paul <b><font color="808080">&#123; Umbrella </font></b>} A modern sans family with a lilting geometry. It maintains some very unique typographic features not commonly found in a display sans. The italic weights display a special style all their own. The Downtempo family now includes six weights: Light, Medium, Bold, plus italics of each.  <BR> <BR>............................................................................................................................................ <BR> <BR><img src="http://www.typophile.com/forums/messages/72/26067.gif" alt="Letraset Avalanche Script"> <BR> <BR><a href="http://www.veer.com/results.asp?image=LFT2245000">Avalanche Script</a> by Michael Gills <b><font color="808080">&#123; Letraset Fontek </font></b>} Inspired by Hermann Zapf, executed by Michael Gills. Avalanche Script fuses copperplate engraving and calligraphy. To echo Zapf&#39;s own philosophy, Gills used his understanding of historical forms to create a fresh, modern interpretation. This face is now available from Veer along with four other new Letraset releases: <a href="http://www.veer.com/results.asp?image=LFT2244700">Chalkline Bold</a>, <a href="http://www.veer.com/results.asp?image=LFT2245100">Gilgamesh Titling</a>, <a href="http://www.veer.com/results.asp?image=LFT2244900">Goo Goo Gjoob</a>, and <a href="http://www.veer.com/results.asp?image=LFT2244800">Potato Cut</a>. <BR> <BR>............................................................................................................................................ <BR> <BR>For more information regarding these new type products, contact: <BR> <BR>Jacqueline Wallace <BR>403 313 4942 <BR><a href="mailto:media@veer.com">media@veer.com</a></font></font></font>'
