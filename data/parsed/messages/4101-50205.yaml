    html: <font class="dontLookLikeCrap">I tried the solution listed above &#40;creating an alias of the Adobe:Fonts folder&#41;. I copied in a folder of 4 open type fonts, and then opened InDesign CS, but it couldn&#39;t see them. I then rebooted the machine, but it still couldn&#39;t see them. I opened them with Apple&#39;s FontBook, and they worked. I could see the fonts in the Library:Application Support:Adobe:Fonts folder. Is there a step I missed?</font>
