  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I know this isn&#39;t strictly related to type, but I am trying to impart some kind of 19th century flavor to a project I am working on. I&#39;ve been looking for a while, not finding a heck of a lot, and I thought some designers here might know of some good CDs. <BR> <BR>&#60;a href=&#34;<a href="http://www.missmary.com" target="_blank">http://www.missmary.com</a>&#34;&#62;Miss Mary&#60;/a&#62; is sorta close to what I have in mind, so is &#60;a href=&#34;<a href="http://www.oldtimeclipart.com" target="_blank">http://www.oldtimeclipart.com</a>&#34;&#62;Old Time Clip Art&#60;/a&#62;, though they don&#39;t seem to be very high-res. &#40;I&#39;m asking them by email.&#41; Here are some images that may give some idea of what I&#39;m looking for. &#40;I&#39;d use the CD these came from, but they are all pretty lo-res.&#41; <BR> <BR>Older art &#40;of evil spirits from Middle Ages, for example&#41; is okay too. <BR> <BR><!--attachment: Advertisement_077_copy-48903.unk*attachment_icon.gif*image/tiff*72.2*1*Advertisement+077+copy%2etif --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/attachment_icon.gif" align=left alt="image/tiff">1<br><a href="http://www.typophile.com/forums/messages/4100/Advertisement_077_copy-48903.unk" target="_blank"><b>Advertisement 077 copy.tif</b></a> (72.2 k)</td></tr></table></center><!--/attachment--><!--attachment: Angel_with_Lute_3_copy-48904.unk*attachment_icon.gif*image/tiff*81.7*2*Angel+with+Lute+3+copy%2etif --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/attachment_icon.gif" align=left alt="image/tiff">2<br><a href="http://www.typophile.com/forums/messages/4