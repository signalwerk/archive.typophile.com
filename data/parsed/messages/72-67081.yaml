  html: <font class="dontLookLikeCrap">I would like to remind you of a publication We Want You To Love Type published recently by <a href="http://www.typotheque.com" target="_blank">www.typotheque.com</a>. It also serves as a catalog for the exhibition project e-a-t, experiment and typography. The e-a-t exhibition is intended not just for those involved with design professionally, but is also meant to be accessible to abroader general audience. It presents type design projects in large format posters that unite form and function in support of the projects stories. Creative processes are documented by sketches and rough drawings, along with multimedia pieces and printed matter. The exhibition currently shows the work of 44 authors, and over time it will expand to include new projects as they are discovered. More at <a href="http://www.e-a-t.org" target="_blank">www.e-a-t.org</a>.  <BR> <BR><img src="http://www.typophile.com/forums/messages/72/67066.gif" alt="e-a-t"> <BR> <BR><b>e-a-t &#40;experiment and typography&#41;</b> is concerned with documenting the stories, concepts, and processes behind typeface design projects. This publication presents more than 50 projects which were done during the last two decades by 44 Czech and Slovak designers, and focuses on the process of creating innovative typographic solutions that often use experimental processes to venture into unknown territory. We Want You To Love Type includes an essay by Peter Bi�ak &#34;Experimental Typography. Whatever that means&#34;, as well as an overview from the exhibition editors on the development of Czech and Slovak type design and typography. <BR> <BR><img src="http://www.typophile.com/forums/messages/72/67067.jpg" alt="We Want You To Love Type"></font>
