  html: <font class="dontLookLikeCrap">We are looking to do some final testing on a desktop font utility for Mac OS/X. This product will be free to use, no charge will be made for the finished program. If anyone is interested in trying out the program then have a look at the description here <BR><a href="http://www.dtptypes.com/FontAware" target="_blank">http://www.dtptypes.com/FontAware</a> <BR>and drop me an email, I will send you the final beta version.</font>
