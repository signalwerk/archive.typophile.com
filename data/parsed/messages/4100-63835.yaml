  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I�m now doing professional service at my former university and I�m going to start designing the publishing standards.  <BR> <BR>They are currently using Gill Sans for most of the inner publications, but I think everyone is a bit tired of it and also they need a fresher look for a catholic - humanist university. <BR> <BR>I`m considering a humanist sans serif family for text and think that Syntax or Cronos would fit and survive photocopy.  <BR> <BR>I would like to have suggestions about a compatible serif face to use in lengthy works such as books and in some sections of school`s gazettes. <BR> <BR>Also I would like to have your opinion about FB Agenda family as a Gill Sans sucessor or any sans serif face that would do the job. <BR> <BR>Thanks</font></font></font></font></font></font></font></font></font></font></font>
