    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">ITC Legacy sans is simular to Gill Sans, if that is what you are looking for, but if you want something fresh, look at Today Sans, this is humanist font that is not chunky as Gill Sans or ITC Legacy. Today medium is more consistent than Gill Sans <BR><a href="http://www.veer.com/search/results.aspx?keyword=Today+Sans&amp;producttype=TYP" target="_blank">http://www.veer.com/search/results.aspx?keyword=Today&#43;Sans&amp;producttype=TYP</a></font></font></font></font></font></font></font></font>
