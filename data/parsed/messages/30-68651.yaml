  html: <font class="dontLookLikeCrap">I am a doctoral candiate  at Hong-Ik university, Korea. My interest is a certain typographic composition which, assumably, started in the 1920&#39;s. But it is not easy to find some available references and even know of the accurate term for it.  <BR> <BR>Belows are typical samples,which show the certain structure that use the same alphabet among two or more words. <BR> <BR>In fact I am in trouble because I am planning to set it as a thesis theme. My thesis is about some possibilty that this can be adapted to Korean Typography. It has not been considered because the Korean, Hangul structure is quie different from the English&#39;s. <BR> <BR>In the early stage of my thesis, the terminoloy and references about it is absolutely in need. It will be thankful if you give me even a simple comment on it.  <BR> <BR>Bjornz Li</font>
