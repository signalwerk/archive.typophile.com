post:
  id: 92017
  user: 5858
  date: 2005-02-03T06:52:00
  date_raw: Thursday, February 03, 2005 - 6:52 am
  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;ve just recieved an interesting project at Uni, to start we have to define 5 of each, ugly/boring and beautiful/cool typefaces. We then take one forward and produce A2 posters for each, advertising a type exhibition, and then we combine the two typefaces together to create the final poster... <BR> <BR>At the moment my choices for ugly / boring are typefaces I see everyday, books, magazines, newspapers... Garamond for example, I just need to find the correct one with a little intersting history, I&#39;m hoping someone here, with a better understanding of type will know the seedy past of one of these sort of typefaces. Although, any typeface used in the correct fashion can be beautiful, and these typefaces are obviously well crafted... Its just you see them everyday, and they&#39;re made to disapear into the page rather than be &#39;interesting&#39; in there own right. <BR> <BR>For my Beautiful typeface i&#39;m looking at the moment to use woodblock type, I like the personality of it, however, its a method rather than a typeface, so I need to find the classic woodblock face, something along the lines of what &#39;Frost&#39; use in a lot of there designs... Either that or i&#39;ll be looking at a battle between old and new, then using something like Design Shock...  <BR> <BR>Its a hard choice to make. We also have to find typefaces with an interesting history... which cuts a lot out of the equation... <BR> <BR>Any ideas, and what would your top 5&#39;s be?</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
