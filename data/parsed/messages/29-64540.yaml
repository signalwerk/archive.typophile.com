  - id: 92363
    user: 2289
    date: 2005-02-06T04:09:00
    date_raw: Sunday, February 06, 2005 - 4:09 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I cannot find the exact passage that I want, but it was a theory, partly to provoke the William Morris arts and crafts movement&#42;, that he put forward � that the only beauty of a letter was that it perform the duty of being that letter and only that letter. He mentions something similar in &#34;an Essay on Typography&#34;, on the Aness of A and &#34;Autobiography&#34; &#39;No one can say that the O&#39;s roundness appeals to us only because it is like that of an apple or of a girl&#39;s breast or of the full moon. Letters are things not pictures of things&#39; <BR>I will keep looking. <BR>Tim <BR>&#42; If you believe he is a mischievious man, although he was sincere in his belief.</font></font></font></font></font></font></font></font></font></font>
  - id: 92367
    user: 1689
    date: 2005-02-06T05:50:00
    date_raw: Sunday, February 06, 2005 - 5:50 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Rob - did your proff offer a definition of what is ugly and what is beautiful? If not, I would start there. Create a set of criteria for each. I get the feeling that if you have a set rationale as to why you decided each was classified as either ugly or beautiful you will get a better grade. <BR> <BR>For instance, I am willing to wager that many here will see Garamond as beautiful - but for differing reasons. It is all so subjective. <BR> <BR>If you define your criteria - on paper - you will be able to show that you have thought out your choices and can defend them in a rational way. <BR> <BR>You proff will love you for that. Well, maybe. <BR> <BR>;&#41; <BR> <BR>Mike</font></font></font></font></font></font></font></font></font>
  - id: 92393
    user: 5858
    date: 2005-02-06T11:44:00
    date_raw: Sunday, February 06, 2005 - 11:44 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Yes I agree, Garamond on both points about the typface, I think it can be defined as both a beautiful and an ugly typface. <BR> <BR>The brief goes like this : and no the lecturer, suprisingly wants us to make our own decisions... <BR> <BR>Select a typefont that you consider ugly &#40;boring, dull&#41; and another you find beautiful &#40;sexy, cool&#41;. Produce an A2 full colour poster for each font containing the following :  <BR> <BR>it then goes on to explain that we need to include an A - Z or an mnemonic showing the type family in 3 of its design weights. &#40;Out of interst are there any other mnemonics apart from the &#39;Quick brown fox...&#39; &#41; <BR> <BR>So.. at the moment, the words &#39;Boring &amp; Dull&#39; are my main motives for choosing Garamond. But as you say Mike, a clearly defined criteria would help me choose, and get me more browny points. It seems I have a little developing to do. <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> <BR> <BR>Thanks for the info, i&#39;ll report back soon, and any more additional comments are appreciated. <BR> <BR>Rob.</font></font></font></font></font></font></font></font>'
