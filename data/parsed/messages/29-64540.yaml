    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Check out <a href="http://www.myfonts.com/">MyFonts.com</a>. They have a keyword search of thousands of fonts. This should help you narrow down based on your general ideas &#40;like &#34;wood type&#34;&#41;. <BR> <BR>As for boring, check out what the banks are using. 9 times out of 10 &#40;at least here in the states&#41; they are conservative and uninspired choices. Also, any business-to-business materials. You&#39;ll probably find more Rotis and Gill Sans than you can shake a stick at...</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
