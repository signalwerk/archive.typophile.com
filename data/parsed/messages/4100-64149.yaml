  - id: 91288
    user: 4204
    date: 2005-01-28T09:47:00
    date_raw: Friday, January 28, 2005 - 9:47 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">From LinoType. <BR> <BR>About DIN 1451 Font Family <BR> <BR> <BR>DIN stands for Deutsche Industrienorm, German Industrial Standard. In 1936 the German Standard Committee settled upon DIN 1451 as the standard font for the areas of technology, traffic, administration and business. The Committee chose a sans serif font because of its legibility and because its forms are also easy to write. This font was not foreseen for advertisements and other &#39;artistically oriented uses&#39; and there were disagreements about its aesthetic qualities. Nevertheless, DIN font was seen everywhere in Germany, on signs for towns and traffic, and hence made its way into advertisements because of its ease of recognition.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
