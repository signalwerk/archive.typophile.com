    html: <font class="dontLookLikeCrap">Most educational, thank you david for the translation. It&#39;s also a great story, I look forward to more of this kind of thing. <BR> <BR>If I may, I have some questions about the design of DIN, Mr. Pool, if you would be so kind. Can we assume that the decisions made in the design, very unique things like the comma and the at symbol, come from your research? Are the alternate characters, such as the circular period and single story &#39;a&#39; also from varieties of the original?  Or are these things that you brought to the face to make it more versatile?  <BR> <BR>Just curious, thought I&#39;d take the chance to ask, thanks for your time, <BR>Aaron</font>
