... <BR> <BR> <BR> <BR> <BR> <BR> <BR> <BR> <BR>Another, not less known work, type for Company Hein Gaz, designed together with designers DTL: <BR> <BR> <BR> <BR> <BR> <BR>During the cold days - as into the warm. Hein Gaz For the more humane heat- <BR> <BR>To man it is necessary a little heat. Hein Gaz For the more humane heat- <BR> <BR>Then Albert- Jan floor obtains proposal from corporation FontFont &#40;using the case, I congratulate it with the fifteen-year period!&#41; on the development of new type on basis the set of first half of the century &#40;of past&#41; German commercial standard Deutsche Industrie Norm - DIN. <BR>Albert- Jan with happiness agrees, after solving that work is not so complex, as it is interesting. However, after studying serious studies it reveals more than thousand different it is type developed by DIN- institute during the period from the beginning on the middle of century... <BR> <BR> <BR> <BR> <BR> <BR> <BR> <BR> <BR> <BR> <BR> <BR> <BR>including the early... <BR> <BR> <BR> <BR> <BR> <BR>including by the way, and the cyrillic alphabet, developed in 1943... <BR> <BR> <BR> <BR>besides, into these standards entered not only types, but also logotypes... <BR> <BR> <BR> <BR> <BR> <BR> <BR> <BR>But also reveals a large quantity of inscriptions, which were preserved on the old buildings, those sometimes written multilayer, by different types, and on the tables... <BR> <BR> <BR> <BR> <BR> <BR> <BR> <BR>even children&#39;s stencils for study and drawing of letters were described once in DIN... <BR> <BR> <BR> <BR>After processing all this sea of type information, Albert- Jan floor produces to light FF DIN - perfect German type, created, first of all, on base DIN-Mittelschrift of 1451: <BR> <BR> <BR> <BR> <BR> <BR> <BR> <BR> <BR> <BR> <BR> <BR>Now this type became the integral part of Germany and is used for guide sign... <BR> <BR> <BR> <BR>&#40;here, by the way, last development in the region of &#34;road&#34; it is type from James montal&#39;ban by the name ClearView&#41; <BR> <BR>for the advertisement and the periodicals... <BR> <BR> <BR> <BR> <BR> <BR> <BR> <BR>Thus, Albert- Jan was one of the first researchers, who turned upside-down the storages of the old DINovskix it was type. And theme proved to be such interesting that many type offices already solved &#40;but how much still they will solve!&#41; in it to pokopat&#39;sya: <BR> <BR> <BR> <BR>Engschrift DIN 1421 by URW&#43;&#43; <BR> <BR> <BR> <BR> <BR> <BR>DIN Neuzeit By Linotype <BR> <BR> <BR> <BR> <BR> <BR>DIN 1451 By Linotype <BR> <BR>Ilya RUDERMAN <BR>She wrote down from the words of the author Julia bogatko</font></font>'
