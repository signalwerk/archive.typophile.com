  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey Guys, <BR> <BR>I was wondering if anyone knew where I&#39;d find infomation about the development of the DIN typeface. I know Font Shop redid a version of it in the 90&#39;s, but does anyone know anything else about it? Thanks again. <BR> <BR>Best, <BR> <BR>David Fung</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
