    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Quite a few foundries do this, by the way. Emigre posted their top nine sellers in the last issue; FontShop and Jean-Fran&ccedil;ois Porchez do the same on a regular basis. The big yellow FontShop book lists the top sellers for a number of foundries. </font></font></font></font></font>
