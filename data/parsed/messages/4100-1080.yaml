  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I thought to share an interesting graph that I recently stumbled across: <BR><A HREF="http://www.themicrofoundry.com/other/trends.gif" TARGET="_top">http://www.themicrofoundry.com/other/trends.gif</A> <BR> <BR>It&#39;s from page 195 of &#34;The shaping of our alphabet&#34; by Frank Denman &#40;Knopf, 1955&#41;. The chapter home to the graph &#40;#12, &#34;Where do we go from here?&#34;&#41; is actually a riveting read itself, and contains a completely unexpected and very eloquent defense of... alphabet reform! I tell you, the things one finds by mistake. <BR> <BR>Anyway, rather than offer my interpretations of the graph, <BR>I&#39;d like to stay quiet and hear of the things you see in it. <BR> <BR>hhp</font></font></font></font></font>'
