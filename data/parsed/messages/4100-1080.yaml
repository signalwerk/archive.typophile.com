    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> I don&#39;t understand the chart. </font></font></font></font></font>
  - id: 3128
    user: 1250
    date: 2002-04-07T17:28:00
    date_raw: Sunday, April 07, 2002 - 5:28 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> It&#39;s supposed to show the use of various styles of type over the years. For each &#34;row&#34; the first hill is the main movement, the second is a revival. Note that this thing seems to be &#34;pseudo-quantitive&#34;: it&#39;s not based strictly on numbers &#40;as the author admits&#41;, but it does contain views of certain specific things. For example, note the little wobble in the descent of the revival of &#34;Victorian Bizarre&#34;. Also, the hills don&#39;t seem to be to relative scale. For example, the peak of &#34;Modern&#34; should be much higher than that of &#34;Caslon&#34; &#40;considering the greater use of type 200 years later&#41;, but it&#39;s all been normalized instead. <BR> <BR>I&#39;d love to have a graph that extends to today. But I&#39;m not remotely qualified to make it, especially since I have a feeling it starts getting really messy in the past 20 years. <BR> <BR>So, what do you guys think about: <BR>1. The &#91;supposed&#93; regularity of the main trends. <BR>2. The timing of the revival hills. <BR> <BR>hhp </font></font></font></font></font>'
