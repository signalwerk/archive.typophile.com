    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> If foundries would be more willing to release <BR>font sales numbers, we&#39;d wouldn&#39;t be far from <BR>creating that new graph. <BR> <BR>Stephen &#40;says this in all jest&#41; </font></font></font></font></font>
