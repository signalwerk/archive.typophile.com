    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I stand corrected. MyFonts.com too: <BR><A HREF="http://www.myfonts.com/BestSellers" TARGET="_top">http://www.myfonts.com/BestSellers</A> <BR> <BR>I suppose a rough graph could be drawn using <BR>at least those foundries that post results <BR>on a regular basis. <BR> <BR>Stephen</font></font></font></font></font>'
  - id: 3157
    user: 1250
    date: 2002-04-08T14:53:00
    date_raw: Monday, April 08, 2002 - 2:53 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> The thing with the graph is that it doesn&#39;t have to be &#40;and maybe even shouldn&#39;t be&#41; strictly quantitative to be useful. Note how it&#39;s showing classes of fonts, not individual designs - and that&#39;s a good thing. So the hard numbers would undoubtedly help, but it would take the analysis and insight of a real guru to &#34;distill&#34; it into something really useful. <BR> <BR>Maybe we can build a foundation here, with this small seed question: what are the main style categories since the 1950s? I&#39;m thinking of stuff like &#34;American Grotesk&#34; &#40;Franklin Gothic&#41; or &#34;Humanist Sans&#34; &#40;Syntax&#41; or &#34;Aldine Revival&#34; &#40;JY Aetna&#41;, etc. BTW, even just determining the optimal level-of-detail on this thing is an issue of itself... <BR> <BR>Also, maybe we&#39;re getting ahead of ourselves: Is Denman&#39;s graph even a solid foundation to build from? Franklin Gothic, for example, isn&#39;t represented... <BR> <BR>hhp </font></font></font></font></font>'
