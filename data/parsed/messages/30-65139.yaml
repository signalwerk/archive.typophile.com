  - id: 93055
    user: 1262
    date: 2005-02-10T15:25:00
    date_raw: Thursday, February 10, 2005 - 3:25 pm
    votes: null
    html: <font class="dontLookLikeCrap">In Canada, a typeface <i>design,</i> as distinct from the copyrighted font software, falls under the Industrial Design Act, which provides for a shorter period of protection than copyright, and may be considered akin to patent protection in the USA. I&#39;m not sure, however, whether the filing requirements are comparable.</font>
