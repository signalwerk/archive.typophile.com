post:
  id: 82269
  user: 2139
  date: 2004-11-10T17:04:00
  date_raw: Wednesday, November 10, 2004 - 5:04 pm
  votes: null
  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This isn&#39;t a display font strictly speaking. However, I put it together with titling usage in mind. <BR> <BR>I really enjoy playing with grays, but I also enjoy tinkering with notchy designs as well. <BR> <BR>In fact, I&#39;m torn as to the true nature of what a pixel font might strive to be: emulate the fluid nature of outline fonts, or: damn the torpedos and celebrate the stepping visuals of stacked blocks. <BR> <BR>At any rate, Fredman is open for examination. Any feedback is welcome. <BR> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/53356.gif" alt=""></font></font></font></font></font></font></font></font></font></font></font></font></font>'
comments:
  - id: 82278
    user: 1250
    date: 2004-11-10T18:05:00
    date_raw: Wednesday, November 10, 2004 - 6:05 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Looks promising. Reminds of Skia, which to me is good. <BR> <BR>&#62; the true nature of what a pixel font might strive to be <BR> <BR>Don&#39;t necessarily see grays as an emulation of outlines. <BR>&#34;Gray pixels are people too.&#34; <BR> <BR>One way grays can help on their own merit is by balancing color better. For example look at your 2-pixel UC &#34;V&#34;: a touch of gray on the insides would make it: nicely darker; seem less wide. <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 82279
    user: 2139
    date: 2004-11-10T18:10:00
    date_raw: Wednesday, November 10, 2004 - 6:10 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#34;Gray pixels are people too.&#34; <BR> <BR>Point taken. That V does stick out, and like you say, there&#39;s not much I can do with it without the grays.</font></font></font></font></font></font></font></font></font></font></font>
  - id: 82289
    user: 2139
    date: 2004-11-10T19:53:00
    date_raw: Wednesday, November 10, 2004 - 7:53 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Here are a few versions of a serif to go with the sans. One that stays within the boyancy of the sans, and one that moves toward better readability. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/53365.gif" alt=""></font></font></font></font></font></font></font></font></font>
  - id: 82303
    user: 2139
    date: 2004-11-11T00:35:00
    date_raw: Thursday, November 11, 2004 - 12:35 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Well, the italics variants are a fun challenge. They may or may not work ultimately, but I can&#39;t help trying to make them work. Of course, grays would fix this right up, but, this is a 1-bit exercise for now. <BR> <BR>The same two serifs have been tilted, with the top one being cleaned up and the bottom one left raw. Not surprisingly, the bottom graphic is the most faithful to the non-italic members of the family. <BR> <BR>And although I like taking pixel designs towards notchiness sometimes, I only like it if it looks like its been done by design. This is where the bold italics below falters, although it does benefit from the heavy line weight to carry the eye past some of its crags and holes. <BR> <BR>I like the regular italic version better, but it faulters in a different way: in an effort to clean up the letters and give them uniformity across the set, a large portion of the style set forth by the non italics members is lost. In fact, characters stretch the limits of acceptability from bold to regular within the italics. <BR> <BR>Any thoughts or critiques are most welcome! <BR> <BR><img src="http://www.typophile.com/forums/messages/29/53372.gif" alt=""></font></font></font></font></font></font></font>'
  - id: 82376
    user: 1250
    date: 2004-11-11T10:02:00
    date_raw: Thursday, November 11, 2004 - 10:02 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; grays would fix this right up <BR> <BR>Actually even grayscale bitmap fonts have trouble with italics. <BR>To me you have to sacrifice an uncomftable level of crispness to get to a good balance. <BR>Anyway, the silver lining is that it&#39;s a great excuse/reason not to make italics!  :-&#41; <BR> <BR>hhp</font></font></font></font></font></font>
  - id: 82522
    user: 2139
    date: 2004-11-12T00:53:00
    date_raw: Friday, November 12, 2004 - 12:53 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I decided to take the direction the serif italics &#40;above&#41; wanted to go in, emphasizing letterforms that lent themselves to the italics diagonals, and ended up with another font. <BR> <BR>I worked the italics backward graphicallly to reach the non-italic version of the font. It&#39;s not cutting edge, but I do like the congruency between the italic and non italic sets, and of course, the fact that the italics don&#39;t look like an afterthought when compared to the non italics. <BR> <BR> <img src="http://www.typophile.com/forums/messages/29/53468.gif" alt=""> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/53469.gif" alt=""></font></font></font></font>
  - id: 82556
