    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">no, it&#39;s named after a rosy-cheeked blonde boy with glasses and purple tiedye shirts, who was a friend of mine in the fourth grade and who stole the affection of a certain girl in our class. <BR> <BR>what made matters worse was that at the time, the fourth grade was when boys actually admitted to one another that they liked girls at all, which made holding hands and awkward kisses possible, and therefore inevitable. <BR> <BR>which meant that at recess there was repeated, quantifiable proof that this girl only had eyes for him and wasn&#39;t even THINKING about me. <BR> <BR>i was jealous of him after that, but always liked his last name. he coined his own nickname after it, in fact. mag wheels. eric &#34;mag wheels&#34; magnuson. <BR> <BR>that font looked to me like a fast car &#40;well, you know&#41;, and fast cars ought to have cool wheels. so, if this font were to have wheels, they&#39;d be mag wheels.</font></font>
