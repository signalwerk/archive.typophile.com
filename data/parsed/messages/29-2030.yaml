    date: 2002-08-12T08:22:00
    date_raw: Monday, August 12, 2002 - 8:22 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Miles, pretty interesting. I think with the various-sized &#34;thorns&#34; it will print well: the less the size/resolution, the more the small ones will drop out, but you&#39;ll always have some. The only thing that bugs me is the blue: to me it&#39;s saying &#34;ethereal&#34; more than &#34;earthy&#34;. I guess blue is their corporate color... Try putting some green in it &#40;towards the color I&#39;ve heard called &#34;petrol&#34;&#41;. I mean next time.  :-&#41; <BR> <BR>Legibility: if the nature of the company makes it so that its name is already in the user&#39;s mind when seeing the logo, it&#39;s great. But for first-time exposure you might like to make the &#34;s&#34; more curvy, and the &#34;h&#34; with a longer ascender and narrower body. <BR> <BR>BTW, the animated thing on the site is very nice! Seen that way, it definitely looks more animalistic. And a cool three-letter domain? They must be rich...  :-&#41; <BR> <BR>&#62; corpoarte values, namely &#39;alive&#39;, natural&#39; and &#39;wild&#39; <BR> <BR>Does the CEO dress up in bear skins?  ;-&#41; <BR>&#40;Maybe these days that&#39;s his cover...&#41; <BR> <BR>&#62; &#39;white occult&#39; <BR> <BR>Nice. It&#39;s always great to have a cool name for a style. <BR> <BR>hhp </font></font></font></font>'
  - id: 5881
    user: 967
    date: 2002-08-12T09:07:00
    date_raw: Monday, August 12, 2002 - 9:07 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hrant, i knew you&#39;d get here. <BR>there is a small use version <BR><!-Attachment: small_ish.swf-!><CENTER><TABLE BORDER=1><TR><TD><IMG SRC="http://www.typophile.com/forums/icons/mime_gif.gif" ALIGN=LEFT ALT="application/x-shockwave-flash">small_ish.swf<BR><A HREF="http://www.typophile.com/forums/messages/29/small_ish.swf"><B>small_ish.swf</B></A> (1 k)</TD></TR></TABLE></CENTER><!-/Attachment-!> <BR>simplified for printing on pens and other small promotional items. <BR>the blue was intended to be a balance for the wildness of the style, blue would add a little cool conservatism &#40;if at all possible with something like this&#41;.  <BR>Your points about legibility are true, I only hope that people learn to read it, however, the ad campaign is a pun on german words that usually en with &#34;isch&#34;, so it would be &#34;erot&#34; nandthen the logo, hopefully teaching the viewer the pronunciation of the onamatopaic &#40;sp&#41; name.</font></font></font></font>'
