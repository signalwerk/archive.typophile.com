  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">following some corpoarte values, namely &#39;alive&#39;, natural&#39; and &#39;wild&#39;, i came up with this logo, based on anime style. It&#39;s an element of  <BR>a style that i&#39;m working on called &#39;white occult&#39;. <BR>the logo has been launched now, and there&#39;&#91;s also a 3d version and an animated version too, but I&#39;&#39;ve posted it here since I feel i need to &#39;air&#39; it in a critical forum. Logos like these tend to be dffficult to critique since they have to be analysed in the context of competitors logos, the visual culture of the audience, and the internal culture of the company. however, i&#39;m interested in any negative/posative associations you may have, and since it&#39;s part of ongoing research, any typographic directions identifiable within logo design. Oh, in case you can&#39;t read it, we named the company &#39;ish&#39; &#40;www.ish.com&#41;. This work was done while working at an agency called Lucky. <BR><!-Attachment: ish_logo.swf-!><CENTER><TABLE BORDER=1><TR><TD><IMG SRC="http://www.typophile.com/forums/icons/mime_gif.gif" ALIGN=LEFT ALT="application/x-shockwave-flash">ish_logo.swf<BR><A HREF="http://www.typophile.com/forums/messages/29/ish_logo.swf"><B>ish_logo.swf</B></A> (94 k)</TD></TR></TABLE></CENTER><!-/Attachment-!></font></font></font></font>'
