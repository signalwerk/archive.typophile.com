  - id: 4871
    user: 827
    date: 2002-06-20T14:39:00
    date_raw: Thursday, June 20, 2002 - 2:39 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Max <BR>The fonts looks good but yoir site &#40;especially some works&#41; are really nice. <BR>Not sure why do you use 1 side serif in some uppercase and why both side serif in others. </font></font></font></font></font></font></font></font>
  - id: 4875
    user: 1121
    date: 2002-06-20T19:32:00
    date_raw: Thursday, June 20, 2002 - 7:32 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Good question. I think it had less to do with logic and more to do with character and balance. Or maybe both.  <BR> <BR>I started with the lowercase &#39;d&#39;, then the &#39;g&#39;. To me, the beginning and ending character is the most important part of a trademark, so I worked hard on those. The &#39;d&#39; had an upper straight serif too, as well did the rest of the appropriate characters once I completed the first draft. Then I drafted the uppercase with even serifs too.  To make a long story short, the whole thing was F&#42;@&#42;d up. The lobes were too short and the bowls were narrow. the ears and tits were unusually long. I redrafted the whole thing, normalizing and balancing it along the way.   <BR> <BR>I always knew the &#39;hth&#39; in &#34;diphthong&#34; was going to be problematic when put together.. most people don&#39;t pick up &#40;read&#41; the first &#39;h&#39;, they think dip-thong, but I think that has more to do with psychology and the way we read things.  Regardless, I wanted it to blend together so I dropped all the upper straight serifs on the lowercase only so the &#34;D&#34; has standing power.  <BR>For the uppercase, the logic for why some have serifs and some don&#39;t is purely just me. It follows my handwriting.  <BR> <BR>Thanks for the compliments, Alejandro, your work and site is fantastic too. </font></font></font></font></font></font></font></font>
  - id: 5064
    user: 1
    date: 2002-07-05T00:48:00
    date_raw: Friday, July 05, 2002 - 12:48 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Cool face. The organic surprises make this design worth while. <BR> <BR>I really enjoy the contrast of the amorphous bulbous protrustions and the techie geometrics. My first reaction upon seeing it was that the inconsitencies in line widths would make for a bumpy read &#40;the s feels thick compared to the r, for example&#41;, but upon examining your sample copy, I think it works great &#40;from what I could see on screen&#41;. The numerals seem to lack some of the quirky flair of the lower and upper cases. </font></font></font></font></font></font></font></font>
