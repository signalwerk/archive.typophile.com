  - id: 4769
    user: 1121
    date: 2002-06-15T21:32:00
    date_raw: Saturday, June 15, 2002 - 9:32 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Why did I post this inside San Serif?! Anyway, that&#39;s what I get for writing drunk.  <BR> <BR>Maybe we need a slab-Serif section? I do plan on making a Sans-Serif, or Grotesque version some day. Its almost a grotesque face already.. ?  <BR> <BR>Hrant, I know just what you mean. sometimes I wish I could just slap this face into something else. One idea; I thought maybe I could make a stencil version, or something like that in concept. I want to break it apart some and follow the curves of the g. </font></font></font></font></font></font></font></font>
