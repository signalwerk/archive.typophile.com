  html: '<font class="dontLookLikeCrap">============================================================ <BR>LinoLetter 04/05 - The Five Fairest Art Deco Fonts <BR>============================================================ <BR>An online version, illustrated with images of this month�s  <BR>featured typefaces, is available on the Linotype website via  <BR>the following link: <BR>- <a href="http://www.linotype.com/8-38-8-18195/issue2005-04.html" target="_blank">http://www.linotype.com/8-38-8-18195/issue2005-04.html</a> <BR> <BR>! Welcome to the April issue of LinoLetter ! <BR> <BR>INTRODUCTION: <BR>Whether used in posters, catalogs, brochures, scrapbooks or  <BR>websites, Linotype�s original fonts stand out for their  <BR>innovative design and high technical quality. With this  <BR>month�s issue�s choices ranging from our seasonal  <BR>feelings-awakening Art Deco Value Pack to the remarkable  <BR>script face ITC Johann Sparkling, the modernist classic  <BR>Metro series, and the personalized image-creation service  <BR>LetterJames, you are sure to find the perfect product to  <BR>make this April typographically fruitful. <BR> <BR>Note! Take a look at a product that we first published last  <BR>year around this time: the Spring Pack. This bargain package  <BR>includes five joyful script and symbol fonts selected to  <BR>capture the spirit of this part of the year. <BR> <BR>Have fonts of fun! <BR> <BR> <BR>------------------------------------------------------------ <BR> <BR>IN THIS ISSUE:  <BR> <BR>1.  The Five Fairest Art Deco Fonts - Art Deco Value Pack <BR> <BR>2.  Old &amp; Scholarly Handwriting - ITC Johann Sparkling <BR> <BR>3.  Excellent Readability In Small Point Sizes - The Metro  <BR>    Series <BR> <BR>4.  Images With Personalized Text Messages - LetterJames <BR> <BR> <BR> <BR>____________________________________________________________ <BR> <BR>1.  The Five Fairest Art Deco Fonts - Art Deco Value Pack <BR>____________________________________________________________  <BR> <BR>Fascinating fonts in the style of the Art Deco epoch! The  <BR>Art Deco era was a period of rebirth and discovery in the  <BR>world of the arts and design. Just in time for spring, we�ve  <BR>bundled together five Art Deco fonts into one low-priced  <BR>Value Pack. Coming out to just 6 USD/EUR per font, this  <BR>package includes the Arnold Boecklin, ITC Rennie Mackintosh  <BR>and ITC Manhattan � three fonts based on some of the most  <BR>popular type styles used during the Art Deco era. Plus, <BR>Auriol Black and ITC Benguiat � two additional <BR>interpretations of the spirit of this age � are included. <BR> <BR>Got an antique poster to finish? This Value Pack�s bargain  <BR>price is only available through the end of the month!  <BR>Download the Art Deco Value Pack now at: <BR>- <a href="http://www.linotype.com/6-2413-6/artdecovaluepack.html" target="_blank">http://www.linotype.com/6-2413-6/artdecovaluepack.html</a> <BR> <BR> <BR>____________________________________________________________ <BR> <BR>2.  Old &amp; Scholarly Handwriting - ITC Johann Sparkling  <BR>____________________________________________________________ <BR> <BR>What gives a piece of design its personal touch? Certainly  <BR>the typeface plays an important role! The unusual antique  <BR>script ITC Johann Sparkling offers a great injection of  <BR>personality into any piece of text. Created by Austrian  <BR>designer Viktor Solt, this typeface is a perfect imitation  <BR>of the academic handwriting from the 18th century. &#34;ITC  <BR>Johann Sparkling is intended to close the gap between highly  <BR>formal copperplate scripts and the scribbled look of &#39;true&#39;  <BR>handwriting,&#34; says Solt. &#34;I am not very interested in highly  <BR>formal and perfect calligraphy, but rather in quick,  <BR>personal-looking scripts.� <BR> <BR>More samples of ITC Johann Sparkling in use, as well as  <BR>purchase and download information can be found here: <BR>- <a href="http://www.linotype.com/7-2414-7/itcjohannsparkling.html" target="_blank">http://www.linotype.com/7-2414-7/itcjohannsparkling.html</a> <BR> <BR> <BR>____________________________________________________________ <BR> <BR>3.  Excellent Readability At Small Point Sizes - The Metro  <BR>    Series <BR>____________________________________________________________ <BR> <BR>The first of the Metro family typefaces to be released was  <BR>Metroblack, brought to market by Linotype in 1929. Seeking a  <BR>sans serif with more of a humanist quality than the  <BR>geometric styles popular in Europe at the time,  <BR>W.A. Dwiggins drew what he believed to be the ideal sans  <BR>serif for headlines and advertising copy. Later expanded to  <BR>include other weights, the Metro family has a warmer  <BR>character than the European Modernists&#39; typographic  <BR>achievements. Metro fonts are full of mannered curves and  <BR>angled terminals; Metroblack also has an astoundingly  <BR>beautiful Q! <BR> <BR>A popular sans serif family for over three-quarters of a  <BR>century, Metro is spec&#39;d less often than similar bestsellers,  <BR>such as Futura or Kabel. Perhaps because of this niche charm,  <BR>Metro has found many diverse uses: it has appeared throughout  <BR>Europe and the North America for decades in newspapers and <BR>magazines, and can even help create a great brand image when  <BR>used in logos and corporate identities. <BR> <BR>Take a deeper look at the Metro types: <BR>- <a href="http://www.linotype.com/13229/metroseries-doc.html" target="_blank">http://www.linotype.com/13229/metroseries-doc.html</a> <BR> <BR> <BR>____________________________________________________________ <BR> <BR>4.  Images With Personalized Text Messages - LetterJames <BR>____________________________________________________________ <BR> <BR>We are always on the lookout for interesting opportunities  <BR>to make the lives of graphic designers easier, and to bring  <BR>new design aids to the attention of everyday computer users.  <BR>Just recently, we discovered LetterJames. <BR> <BR>James creates individualized postcards, e-cards and posters  <BR>to your specifications! Entering text is easy, and James  <BR>will then insert it into the appropriate place on the  <BR>picture motif. In this way, you can produce unique messages  <BR>to send to friends and acquaintances. <BR> <BR>Try out LetterJames today! Find it here: <BR>- <a href="http://www.letterjames.de/index.html?lang=en" target="_blank">http://www.letterjames.de/index.html?lang=en</a> <BR> <BR> <BR> <BR>------------------------------------------------------------ <BR> <BR>Don�t Forget! <BR> <BR>Outfit yourself and your computer for the new season with  <BR>our Spring Pack: an exquisite selection of script and symbol <BR>fonts that may be used together to create designs that <BR>spring to life!  Introducing a new service: We are pleased  <BR>to offer you the chance to download our FontExplorer tool  <BR>for free. FontExplorer makes searching for fonts directly  <BR>from your desktop easy and comfortable � even without a  <BR>direct connection to the internet. <BR> <BR>Spring Pack: <BR>With these five peppy fonts from the categories of display,  <BR>calligraphy and symbol fonts, your designs are sure to catch  <BR>spring fever! <BR>- <a href="http://www.linotype.com/6-2053-6/springvaluepack.html" target="_blank">http://www.linotype.com/6-2053-6/springvaluepack.html</a> <BR> <BR>FontExplorer Download Version: <BR>The standard reference guide for designing with type: Search  <BR>the entire product offerings from the Linotype Library  <BR>directly from your desktop with this stand-alone application.  <BR>Innovative search criteria make finding the right font as  <BR>easier than ever before. Get it as a free download, or order  <BR>it on CD � along with your own printed catalog! <BR>- <a href="http://www.fontexplorer.com" target="_blank">http://www.fontexplorer.com</a> <BR> <BR> <BR> <BR>&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42; <BR> <BR>We hope you found this issue of LinoLetter informative and  <BR>useful. We would highly appreciate your feedback at  <BR><a href="mailto:info@linotype.com">info@linotype.com</a> <BR> <BR>Your Linotype Library Online Team <BR> <BR> <BR>------------------------------------------------------------ <BR>Publisher: <BR>Linotype Library GmbH <BR>Du-Pont-Stra�e 1 <BR>61352 Bad Homburg / Germany <BR> <BR>Website: <a href="http://www.linotype.com" target="_blank">www.linotype.com</a> <BR>Contact: <a href="mailto:info@linotype.com">info@linotype.com</a> <BR>Phone &#43;49 6172 484-418 <BR>Fax   &#43;49 6172 484-429   <BR>------------------------------------------------------------ <BR>&#40;c&#41; 2005, Linotype Library GmbH, All rights reserved.</font>'
