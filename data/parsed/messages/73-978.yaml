  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><A HREF="http://www.dtl.nl" TARGET="_top">De Dutch Type Library &#40;DTL&#41;</A> is producent en uitgever van digitale lettertypen. Dit -na jarenlange voorbereiding- in 1990 door Frank E. Blokland opgerichte bedrijf was het eerste in zijn soort in Nederland en is uitgegroeid tot de grootste producent van nieuwe fonts aldaar. De Dutch Type Library heeft als doel de productie en uitgave van hoogwaardige digitale lettertypen van Nederlandse en Vlaamse origine. In eerste instantie gaat de aandacht uit naar eigentijdse letterontwerpen maar daarnaast produceert DTL ook revivals van waardevolle historische lettertypen.  <BR>De Dutch Type Library voelt zich verbonden met de rijke typografische traditie van Nederland en de collectie van DTL kan zich inhoudelijk meten met het beste dat de befaamde lettergieterijen in het verleden hebben voortgebracht. De fonts zijn technisch van de hoogste kwaliteit en de Dutch Type Library levert support in de vorm van delta hinting en macro bouw.  <BR> <BR>&#40;sorry no english yet&#41;</font></font></font></font>
