  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;m working on an impressionist interpretation of Nicolas Jenson&#39;s roman from his version of Pliny&#39;s Historia Naturalis. Unfortunately, I don&#39;t have the complete character set. <BR> <BR>So far, two universities &#40;Liverpool &amp; Glasgow&#41; with copies of the Jenson Pliny have let me down regarding requests for high-resolution photographs. Does anyone know of an institution that might be more helpful? I fully expect to pay through the nose. I just don&#39;t want to be fobbed off with excuses.</font></font></font></font></font></font></font></font>
