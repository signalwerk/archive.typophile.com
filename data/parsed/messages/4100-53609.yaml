    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The only good repro I have of Jenson is from Gaskell&#39;s photographic enlargements article. <BR> <BR><a href="http://www.typophile.com/forums/messages/30/48532.html" target="_blank">http://www.typophile.com/forums/messages/30/48532.html</a> <BR> <BR>If you got the dough, maybe buy an actual Jenson!! <BR> <BR>hhp</font></font></font></font>
  - id: 82984
    user: 4825
    date: 2004-11-16T19:52:00
    date_raw: Tuesday, November 16, 2004 - 7:52 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">A woman pressing Chianti with her feet, haha. <BR> <BR>Buy an ACTUAL Jenson?! I&#39;d give my firstborn child &#40;if I had one, which I don&#39;t&#41; for one. I suggested to the University of Liverpool that they should make and market a digital copy of theirs, but they apparently have only one staff photographer, and she is busy with other projects at the moment. <BR> <BR>&#34;there&#39;s an article that might interest you: it&#39;s called &#34;Photographic Enlargements of Type Forms&#34; by Philip Gaskell, in the Journal of the Printing Historical Society, #7, 1971, pp 51-53, with 12 plates. One of the plates is from the De Evangelica of 1470; it shows about 60 letters, at just over 1&#34; em height. Want a scan? &#34; <BR> <BR>Do you have a scan available? I&#39;d love to see that, but I don&#39;t want to put you out.</font></font></font>'
