    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;m having this same problem with Freehand MX and Spectrum Expert. The ligatures within the &#34;regular&#34; font show up fine, but ff, ffl, and ffi don&#39;t show up. InDesign shows them just fine. <BR> <BR>I&#39;m also using Mac OS 10.3.5.</font></font>
