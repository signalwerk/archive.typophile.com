    html: <font class="dontLookLikeCrap">Hi, <BR> <BR>I found out that this was just a Quark 6 problem. Actually, Font book and Suitcase were okay &#40;the ligs just weren&#39;t in the sample text shown&#41;  <BR> <BR>It&#39;s still a problem in Quark 6--but not the OS. Hope that helps!</font>
