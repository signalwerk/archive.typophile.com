    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">A vocation it is indeed, Christos. <img src="http://www.typophile.com/forums/clipart/wink.gif" border=0> <BR> <BR><font color="808080">&#42;Christos I&#39;m certainly not making fun of YOU, but  <BR>this must be one of the best typos ever. <BR> <BR><b>Vocation</b> &#40;Vo&#42;ca&#34;tion&#41;, n. [L. <i>vocatio</i> a bidding, invitation,  <BR>fr. vocare to call, fr. vox, vocis, voice: cf. F. vocation. <BR>See <i>Vocal</i>.] <BR> <BR><b>1.</b> A call; a summons; a citation; especially, a designation <BR>or appointment to a particular state, business, or profession. <BR>   <BR><i>What can be urged for them who not having the <BR>vocation of poverty to scribble, out of mere <BR>wantonness make themselves ridiculous?</i> <BR>--Dryden. <BR>   <BR><b>2.</b> Destined or appropriate employment; calling; occupation; <BR>trade; business; profession. <BR>   <BR><i>He would think his service greatly rewarded, if he <BR>might obtain by that means to live in the sight of <BR>his prince, and yet practice his own chosen vocation.</i> <BR>--Sir. P. Sidney. <BR>   <BR><b>3.</b> &#40;Theol.&#41; A calling by the will of God. Specifically: <BR>&#40;a&#41; The bestowment of God&#39;s distinguishing grace upon  <BR>a person or nation, by which that person or nation is <BR>put in the way of salvation; as, the vocation of the <BR>Jews under the old dispensation, and of the Gentiles <BR>under the gospel. <i>The golden chain of vocation, <BR>election, and justification.&#34;</i> <BR>--Jer. Taylor. <BR>&#40;b&#41; A call to special religious work, as to the ministry. <BR>   <BR><i>Every member of the same [the Church], in his vocation  <BR>and ministry.</i> <BR>--Bk. of Com. Prayer.</font></font></font></font></font></font>'
