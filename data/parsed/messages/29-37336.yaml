    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Greetings everyone! <BR> <BR>Well, this is my first post here... Always liked typography, but just started learning to build fonts this last month... I&#39;m primarily self trained so I&#39;m definitely a rookie here and hope to learn alot. I usually work in CG/Pixel illustration. Anyways, enough with the introduction. Here&#39;s my first work for critique, and my second font ever:  <BR> <BR><img src="http://www.typophile.com/forums/messages/29/37341.gif" alt="Pixie Talon Sample"> <BR> <BR>I hope you&#39;re not all tired of extremely small pixel fonts <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> Critique away, please... </font></font></font></font></font></font></font>'
