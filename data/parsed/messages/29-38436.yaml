  - id: 64737
    user: 804
    date: 2004-06-17T16:01:00
    date_raw: Thursday, June 17, 2004 - 4:01 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I see a great opportunity to implement some metaphors and symbology here.As is, all I see is a type, that is could for a hard rock band or a drag racing team. Does not say anything to me about what TMG is or does. <BR>Since the name has obvious religious connotations, how about the &#34;T&#34; shaped being like a cross. maybe astaggered formation of 3 lines with type/elements interacting. Or perhaps sacred geometry. If this is not your flavor going grunge may be a way to go. Although grunge is dead there may be a use for it once in a while. If this band is punk or very hard rock consider attached image as a starting point. <BR><img src="http://www.typophile.com/forums/messages/29/38583.jpg" alt="tmg"> <BR>btw. formating the size for inten ded usage should be an important consideration. A logo like you had could look great on a wide banner but would lack visibility on standard sized printed materials &#40;4x6, postcard, 2x3.5 business card, posters,etc.</font></font></font>
