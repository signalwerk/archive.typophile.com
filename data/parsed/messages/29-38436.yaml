    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Brandee, this is a lot of fun. Kinda retro <a href="http://www.fender.com/products/show.php?partno=0100800" target="_blank">Fender</a> Have you looked at other type similar to this? Or lettering? Leslie Cabarga&#39;s <a href="http://fontbureau.com/fonts/font_frames.tpl?cart=10875147505189476&amp;fontname=Magneto" target="_blank">Magneto</a> could be good reference. Your shapes are really coming together, I&#39;m not suggesting you mimic, but notice how he varies the connnections. It also seems like some of your angles are off. Maybe you need to choose one angle and have all letters follow that?</font></font>
