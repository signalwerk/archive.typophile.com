    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">i like em larger. a few more suggestions: keep the &#34;serif&#34; on the G flat like on the T, the curve just doesn&#39;t do it for me. maybe angle the head serifs &#40;on n, y &amp; d&#41; downward a bit? maybe along the same angle as the &#34;serif&#34; on the y&#39;s descender. The G also looks like it could benefit from some modulation. i keep hopin you&#39;ll get some criticism from someone with more expertise than me! maybe they&#39;ll start bitin tonite...</font></font></font></font></font></font>'
