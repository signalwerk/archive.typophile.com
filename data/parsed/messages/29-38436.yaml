  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I am having some trouble working on this logotype for a rock band: <BR> <BR><img src="http://www.typophile.com/forums/messages/29/38437.gif" alt=""> <BR> <BR>The original sketch at the top was provided by one of the band members.  I feel like I&#39;m not doing it justice and would like some ideas on how to improve what I have so far. <BR> <BR>Thanks!</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
comments:
  - id: 64529
    user: pablohoney77-users
    date: 2004-06-16T11:57:00
    date_raw: Wednesday, June 16, 2004 - 11:57 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">i like the Top Go ligature better. maybe you could incorporate some of the hand-drawn serifs like on the top bar of the T, the descener of the y, the top of the G and the ascender of the d, and in the z. but maybe you&#39;re going for super streamlined, i dunno. i just think the serifs give it a bit more edge, but maybe this isn&#39;t a real edgy band. maybe you can give us more insight on what they&#39;re all about, what kinda feel they&#39;re going for.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 64531
    user: 3168
    date: 2004-06-16T12:08:00
    date_raw: Wednesday, June 16, 2004 - 12:08 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">You know, I didn&#39;t interpret the subtle lines in the sketch as serifs until you pointed that out!  To me it looks like misaligned connections &#40;like when you&#39;re drawing and the lines don&#39;t quite meet up all the way&#41;, but I think you&#39;re right that it will look better to include some serifs. <BR> <BR>They do want an edgy look.  They are mainly a cover band, with a VERY strong emphasis on rock &#40;70&#39;s to current&#41;.</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 64544
    user: 3472
    date: 2004-06-16T12:59:00
    date_raw: Wednesday, June 16, 2004 - 12:59 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I feel like the angles of each stroke need consistancy. However that could be a good thing or a bad thing. IMPO consistant letterforms and angles tends to make a logotype more concrete.</font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 64545
    user: 3768
    date: 2004-06-16T13:06:00
    date_raw: Wednesday, June 16, 2004 - 1:06 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I agree with Paul about the serifs - it gives the design more character. Also the original has more contrast between the thick and thin strokes &#40;ie: the underline and the top of the s&#41;. The newer versions lose that contrast and feel monotone. The connection between the G and o on the middle sketch causes me to read Too Many Grods. <BR> <BR>Personally, I&#39;m not getting an &#34;edgy&#34; feel from this. Don&#39;t interprut that to mean I don&#39;t like it, because I do. It&#39;s just it makes me think more of the chrome lettering off a 50&#39;s Ford Fairlane or someting rather than a rock-n-roll band. And it may just be a matter of semantics, but when I hear the word &#34;edgy&#34; in relation to music I think more of punk or grunge. From your loose description I sense they cover more of Led Zep and the like. Is that correct? Obviously since one of the band members drew the initial sketch it is something they like and you should continue on that path. However, just as an additional option, you may want to look at the logos of the bands they cover the most it may give you additional inspiration as to how to better relate the music they perform with their logo.</font></font></font></font></font></font></font></font></font></font></font></font>'
