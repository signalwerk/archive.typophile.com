    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Grant: I&#39;ve revised some of the letters because they seemed stiff and lifeless compared to other characters such as the &#34;l&#34; and &#34;g&#34;. There are also some weight issues I need to resolve.  <BR> <BR> <img src="http://www.typophile.com/forums/messages/29/15336.gif" alt=""></font></font></font></font></font></font>'
