  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Greetings Typophiles, <BR> <BR>This is my first font post to typophile.com. It&#39;s a silly little number called Hotcakes. I&#39;ve always wanted to throw a big, fat slab serif on a lower case &#34;o&#34;. The letterforms tilt and bounce on an uneven baseline. This is a work in progress so any thoughts or suggestions are greatly appreciated. <BR> <BR>The uppercase N makes me cringe. Anyone?? <BR> <BR><img src="http://www.typophile.com/forums/messages/29/13570.jpg" alt="Hotcakes illustrated..."> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/13571.jpg" alt="Full set Hotcakes Slim..."> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/13572.jpg" alt="Full set Hotcakes Bulky..."></font></font></font></font></font></font>
comments:
  - id: 24294
    user: 659
    date: 2003-08-01T10:29:00
    date_raw: Friday, August 01, 2003 - 10:29 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Tom <BR> <BR>i like what i see, some few comments though... <BR> <BR>-.i think you should solve you &#34;n&#34; and &#34;m&#34; like you did it with your &#34;h&#34;, and maybe there you have a &#34;u&#34; also. <BR> <BR>-.i like how you close the eye of the &#34;9&#34;, maybe you should close that way your &#34;p&#34; an &#34;q&#34; <BR> <BR>-.your UC &#34;O&#34; and &#34;Q&#34; are too open <BR> <BR>-.your &#34;b&#34; looks like an &#34;h&#34;, maybe you should close it someway <BR> <BR>-.i think your &#34;W&#34; should be solve like your &#34;V&#34; <BR> <BR>good luck and good job <BR> <BR>CG</font></font></font></font></font></font>
  - id: 24296
    user: 1109
    date: 2003-08-01T10:55:00
    date_raw: Friday, August 01, 2003 - 10:55 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">It looks nice, but the serifs are too heavy, and makes the typeface too complex.  <BR> <BR>Resolve it with semi serifs, you need more white spaces.  <BR> <BR>Use more angles like on the A and V on all the upercases, those curves are pure distraction. <BR> <BR>M.</font></font></font></font></font></font>
  - id: 24311
    user: 1011
    date: 2003-08-01T13:28:00
    date_raw: Friday, August 01, 2003 - 1:28 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Just an observation: it reminds me of a cross between Image Club&#39;s <a href="http://www.identifont.com/show?8EH">Improv</a> and <a href="http://www.paratype.com/default.asp?page=/library/newstyles.asp?fontcode=FF_DLR">Dolores</a> by Tobias Frere-Jones, only using a more controlled vocabulary. Well, as controlled a vocabulary you can use for a bouncy display face, anyway. <BR> <BR>Regarding Miguel&#39;s comment, perhaps eliminating some of the serifs altogether in the more complex characters such as the 3, B, H, Q, M, m, W, w</font></font></font></font></font></font>'
  - id: 24324
    user: 2108
    date: 2003-08-01T14:40:00
    date_raw: Friday, August 01, 2003 - 2:40 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Great suggestions all! My initial thought for the font was big honking serifs...but perhaps they honk too loudly. The characters seem to need some breathing room and minimizing the serifs will help. <BR> <BR>Grant: It&#39;s funny, I forgot all about Improv. I thought a serif O was rather unique. Perhaps I should think again? <BR> <BR>Is the font lacking a funk factor? Should I loosen it up a bit like Delores? <BR> <BR>I&#39;m going to upload another work in progress called Boneyard and would like to get your suggestions.</font></font></font></font></font></font>'
  - id: 28056
    user: 2108
    date: 2003-09-02T10:48:00
    date_raw: Tuesday, September 02, 2003 - 10:48 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Well, I sort of started from scratch and no letter was spared. The face is overall more controlled and condensed &#40;and slightly heavier&#41;. The serifs are smaller and many letters were simplified. Most letters still jump and step, but in a less random manner. The Q, E and l each have an alternate. <BR> <BR>I experimented with sharp strokes for the UC, but it became more somber and seemed to lose it&#39;s playfulness. So I went the opposite direction and tried to round strokes where possible. I&#39;m wondering if I should take this approach with the X, x, y, V and v.  <BR> <BR>Any and all suggestions are welcome! <BR> <BR><img src="http://www.typophile.com/forums/messages/29/15217.gif" alt=""></font></font></font></font></font></font>
  - id: 28153
    user: 1011
    date: 2003-09-03T10:15:00
    date_raw: Wednesday, September 03, 2003 - 10:15 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey Tom. <BR> <BR>I&#39;d really like to see a couple headlines or short passages set this version. The new loopy lowercase &#39;l&#39; and the alternate &#39;Q&#39; are nice departures.</font></font></font></font></font></font>
  - id: 28205
