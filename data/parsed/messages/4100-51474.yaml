    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Since the gap between the words and the cursor grows the more you type, this suggests a discrepancy between screen metrics and actual metrics. There are a number of reasons why this might be the case, some of them font bugs and some of them application bugs. To eliminate the latter, can you please let me know what operating system you are used, in what application&#40;s&#41; the problem occurs, and what format the font it?</font></font>
