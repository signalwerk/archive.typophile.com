  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">So I&#39;ve constructed a font and the interior kerning and what not is fine. However, something weird is going on. At the end of characters the cursor is a full em-space away from the words and the weird space grows as you type longer words. <BR> <BR>As soon as you type a letter though the letter appears properly kerned.... I&#39;ve included an image to show you what&#39;s going on. <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/51475.gif" alt="The font problem"> <BR> <BR>Any ideas? Thanks. <BR> <BR>-Mal</font></font></font></font>
