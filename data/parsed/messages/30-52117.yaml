    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">So what you&#39;re saying is that in this pic  <BR> <BR><a href="http://gallery.ipodlounge.com/ipod/displayimage.php?album=15&amp;pos=14" target="_blank">http://gallery.ipodlounge.com/ipod/displayimage.php?album=15&amp;pos=14</a> <BR> <BR>The top line &#40;antialiased&#41; &#39;contact&#39; is the &#39;new&#39; font Myriad. The second line &#39;Sample&#39; is Chicago, and the third line &#39;Accountant&#39; is Espy?  <BR> <BR>If so the claim &#34;its easier to read than ever. That�s thanks in part to the clarity of the display � it offers 220x176-pixel resolution � and in part to the new Myriad typeface.&#34; would seem a bit odd as the reading text isn&#39;t Myriad at all. <BR> <BR>Si</font></font></font></font></font></font></font></font></font></font>
