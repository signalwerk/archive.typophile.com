    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I remember when I got my 2g ipod with <i>real</i> buttons &#40;gosh, is it really now 4g?&#41; being delighted that there was a little bit of typographic history on it&#39;s baby black and white screen. <BR> <BR>Am I alone in lamenting Chicago&#39;s demise? I still think its a great bitmap font.</font></font></font></font></font></font></font></font></font></font></font></font></font>
