    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font color="808080">� The top line &#40;antialiased&#41; &#39;contact&#39; is the &#39;new&#39; font Myriad. The second line &#39;Sample&#39; is Chicago, and the third line &#39;Accountant&#39; is Espy?</font> <BR> <BR>That&#39;s right. It&#39;s worth noting that the 4G iPods also use Espy Sans in the notes &#40;and I believe contacts&#41; sections to be able to fit more text in, so a multiplicity of fonts on the same screen is nothing new. <BR> <BR><font color="808080">� If so the claim &#34;its easier to read than ever...</font> <BR> <BR>I think they&#39;re refering to the text of the navigation screens &#40;list of choices with arrows to drill down, see image on my previous post&#41; which does use Myriad. I&#39;d call this a reasonable claim since most time spent using an iPod is spent on these navigation screens and not in the notes and contacts sections.</font></font></font></font></font></font></font></font></font>
