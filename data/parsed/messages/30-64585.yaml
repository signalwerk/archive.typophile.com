    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><a href="http://www.bitstream.com/font_rendering/industry_solutions/interactive_tv/index.html" target="_blank">http://www.bitstream.com/font_rendering/industry_solutions/interactive_tv/index.html</a>  <BR> <BR>UK DTV service as described by the BBC in 2002; <BR> <BR>Tiresias is the standard font for Digital Terrestrial TV - MHEG-5 and DigiCable, Helvetica is Digital Satalite &#40;DSAT&#41;. <BR> <BR>PDF of the white paper  <BR><a href="http://www.bbc.co.uk/rd/pubs/presentations/pdffiles/ibc01ricrjb-ppt.pdf" target="_blank">http://www.bbc.co.uk/rd/pubs/presentations/pdffiles/ibc01ricrjb-ppt.pdf</a></font></font></font></font></font></font></font></font>
