  html: Hello, <BR>I help my friend-typedesigner to build large family of typefaces in FontLab. Each OpenType font contains about 700 characters incl. all accented letters, small caps and ornaments. He has more than 3000 kerning pairs in one font. Is there any possibility to convert these pairs into classes? I would also like to kern ASCII characters only and let the algorithm create kerning for accented letters automaticly &#40;from TA get T�, T�, etc.&#41;. Thank you for your help.
