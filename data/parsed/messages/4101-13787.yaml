    html: Greetings Filip, <BR> <BR>I sell a tool that does this. It is designed for existing Type 1 fonts being expanded in an OpenType conversion. It takes a class list &#40;in the common FDK format used by FontLab&#41; and an AFM file and generates a clean, well-ordered KERN feature with all redundant pairs absorbed into classes. You can contact me offline if you are interested in licensing the software or simply having me do the conversion.
