    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Eduardo, about your cap comment: <BR>Do you noticed that the good old Times feature vertical axis caps when the lc are quite oblique axis? <BR> <BR>Anyway, I agree with most of your comments: make less strange, but still strange. <BR> <BR>What do you think about the Question mark? Not too soft?</font></font></font></font>'
