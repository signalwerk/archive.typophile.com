    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The year is over, and the students have been very happy to receive all the very fast comments from you all! Thanks on the behalf of all of them! <BR> <BR>On same page as usual, you can download the final nice pdf specimen they created last friday. Follow the images at the end of the page, to understand how to built it! <BR><a href="http://perso.ensad.fr/~ensadtypo/bertrand.html#pliage" target="_blank">http://perso.ensad.fr/~ensadtypo/bertrand.html#pliage</a> <BR> <BR>direct link: <a href="http://perso.ensad.fr/~ensadtypo/imagesbertrand/BertrandSpecimenA3.pdf" target="_blank">http://perso.ensad.fr/~ensadtypo/imagesbertrand/BertrandSpecimenA3.pdf</a> <BR> <BR>Finally, for those who read French, or have fun with Babelfish, you can also read a small contribution on same subject! <BR> <BR><a href="http://www.typographe.com/article/91/" target="_blank">http://www.typographe.com/article/91/</a> <BR>  <BR></font></font></font></font>'
