    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hrant: I understood, and agree. Little light for text, but its how it is at the time, light page generally, at least in France -- despite, in this case, they pretend that is a OldStyle! The spacing is not done, it will help perhaps? <BR> <BR>Same feelings about question mark. Thanks too.</font></font></font></font>'
  - id: 18304
    user: 108
    date: 2003-05-12T14:47:00
    date_raw: Monday, May 12, 2003 - 2:47 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The irregularity of the serifs and the angles aren&#39;t so disparate that they need to be made the same. The only thing that catches my eye from my printout is the odd character widths. And really, they aren&#39;t so odd. For the question mark, I don&#39;t think it is too soft, but what if the front &#40;top&#41; end was trimmed flat and the back &#40;bottom&#41; end was left soft? Maybe this would make it match the somewhat irregular serifs?? I also like the color when it is printed. Maybe a little light for book work at the smallest point-size, I can see that, but maybe only just.  <BR> <BR>I printed this out on a 600dpi laserprinter.</font></font></font></font>
