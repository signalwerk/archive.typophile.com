    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; proportions ... are like that in such late century <BR> <BR>That&#39;s actually where I think the serifs don&#39;t fit in. On the other hand, it&#39;s what makes the face most original... <BR> <BR>Looking at the PDF: I think the color is slightly light for text. It seems to be asking for slightly looser spacing, but that would weaken the overall &#40;more&#41;, so darkening instead should help. <BR> <BR>BTW, The Asterisk is very nice. <BR> <BR>hhp <BR></font></font></font></font>'
