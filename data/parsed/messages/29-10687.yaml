    date_raw: Monday, May 12, 2003 - 8:10 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think you should keep the strange stuff &#40;we have enough &#34;normal&#34; typefaces&#41;, but you might correct optical things: color issues &#40;like in the UC &#34;V&#34;&#41;, the lc &#34;k&#34; join, etc. <BR> <BR>One thing I wonder about is the descender depths: maybe it&#39;s nice to have them different? But if they&#39;re made the same, the &#34;y&#34; is the best one to match. <BR> <BR>The serif structure on the other hand seems to clash too much with the overall style. <BR> <BR>hhp <BR></font></font></font></font>'
  - id: 18272
    user: 1202
    date: 2003-05-12T11:28:00
    date_raw: Monday, May 12, 2003 - 11:28 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Jean-Fran�ois, <BR> <BR>Very nice work. Though I must say the serifs are a bit unexpected, but I have a feeling they might work quite nicely at small sizes � adds warmth, and brings back that letterpress look. I agree with Hrant that the &#39;strange stuff&#39; should be kept � that&#39;s what makes the type unique. <BR> <BR>I really like the numerals � very beautiful. The proportions are strange in the caps... I wonder what the reason was behind it? The lc seem pretty normal and pleasant.</font></font></font></font>
  - id: 18281
    user: 618
    date: 2003-05-12T12:06:00
    date_raw: Monday, May 12, 2003 - 12:06 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This a very hip! <BR> <BR>Color is really hard to judge on screen, particularly in a gif. The color in a -&#62; n looks alot more consistant thatn o -&#62; z . Also the numerals seem slightly dark compared to the a -&#62; n set.  <BR> <BR>Oh, maybe a slightly darker terminal on the a. <BR> <BR>Fun! <BR>Randy</font></font></font></font>
  - id: 18282
    user: 533
    date: 2003-05-12T12:15:00
    date_raw: Monday, May 12, 2003 - 12:15 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Upper-case &#34;B&#34;, &#34;R&#34;, and perhaps &#34;P&#34; all look a bit wide to me. <BR> <BR>The numerals are wonderful, except that &#34;5&#34; seems a bit narrow. Perhaps angling the top a bit could create an illusion of being wider without destroying the graceful curve below. <BR> <BR>Nice work! <BR> <BR>David</font></font></font></font>
  - id: 18291
    user: 1353
    date: 2003-05-12T13:47:00
    date_raw: Monday, May 12, 2003 - 1:47 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Jean Fran�ois, I think you can keep the strange things, but try to make  <BR>them &#34;less strange&#34;. :-&#41; <BR> <BR>Anyway, the uppercase is really disturbing to me. Not only because of the  <BR>strange proportions, but because the whole structure of these characters  <BR>seems to be completely different from lowercase. It seems that the  <BR>lowercase has a slightly left-angled contrast axis, while the uppercase has  <BR>vertical contrast axis. I don&#39;t know, it&#39;s hard to me to get that. <BR> <BR>Otherwise, some characters are a little darker &#40;BGMRVfiktvw&#41;, as other  <BR>people noticed too.</font></font></font></font>
  - id: 18292
    user: 1275
    date: 2003-05-12T13:52:00
    date_raw: Monday, May 12, 2003 - 1:52 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">So fast as usual! My answers go to various points made by all of you. Thanks a lot, the students will appreciate, that the job they done is appreciated elsewhere than in their classroom! <BR> <BR>Use this link for the pdf of the gif posted here. Don&#39;t look to close to the forms, they are done from various methods, softwares, various students! <BR> <BR><a href="http://perso.ensad.fr/~ensadtypo/imagesbertrand/Bertrandtest090503.pdf" target="_blank">http://perso.ensad.fr/~ensadtypo/imagesbertrand/Bertrandtest090503.pdf</a> <BR> <BR>Ok, lets kept the serifs. Not sure to understand what Hrant say in its last sentence? <BR> <BR>Yes, the proportions of the caps are odd, but they are like that in such late century typefaces, very large mono width caps, such we found on earliers Sans too. The S was not on our sample &#40;I think&#41;, and indeed, we&#39;ve done it too narrow! <BR> <BR>But, your comments convince me that the B, P, R are really to large for today eyes. We will make them more narrow a bit enough to kept this strange feature, without to be disturbing too much. <BR> <BR>Yes, Hrant, the k need to be corrected, i don&#39;t asked them to correct it yet!! Some others glyphs need to be corrected too. The ampersand is a pure invention from the student who have done the figures... <BR> <BR>Normally, the figures follow an intermediate weight between caps and lc &#40;its what i say during teaching&#41;. But, its possible that some are to heavy. <BR> <BR>Yes I like quite a lot the numerals! the five in particularly. You right David, we make it little more wider. <BR> <BR>thanks again!  <BR> <BR></font></font></font></font>
  - id: 18294
    user: 1275
    date: 2003-05-12T14:03:00
