  date: 2003-05-12T07:47:00
  date_raw: Monday, May 12, 2003 - 7:47 am
  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><a href="http://perso.ensad.fr/~ensadtypo/bertrand.html" target="_blank">http://perso.ensad.fr/~ensadtypo/bertrand.html</a> <BR> <BR>This page, and image posted here after show a current group project of my type design students, Ensad, Paris &#40;3 hours by week course&#41;. As usual, the end of the year, the students have so much to finish, they don&#39;t seems serious as it need to finish it! Anyway, its where they are. And its seems interesting to see what the world &#40;Typophile IS the world!&#41; say about it? <BR> <BR>Its a revival of a late 19th century french typeface, from a foundry called Fonderie Bertrand, who probably be purchased by Peignot later. Some of the caps proportions are strange, like the B or M. <BR> <BR>My question is do we need to stick to this strange proportions, or need to correct them?  <BR> <BR>The serif structure came from a friendly confrontation between three groups of students &#40;after a close observation of some results of cutting technics&#41;. It seems to work for lc, less in some caps, I think about C, G, S, E at vertical position? What do you think? <BR> <BR>Any others comments welcome, despite, we don&#39;t know what can be done to correct after your comments. Only next friday of work and the typeface need to be achieved. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/10688.gif" alt="Bertrand 3"></font></font></font></font>
comments:
