    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">strictly looking at typography, since this is a typography forum,  i would say that the word slaves on the second cover looks wrong... tracked-out Impact? &#40;or whatever font that is, which i&#39;d never use...&#41;  doesn&#39;t look good to me.  i also think that the author and his last book shouldn&#39;t be full justified. <BR> <BR>also, i don&#39;t think that the photo is soo strong that if there were no typography, i&#39;d be attracted to it and pick it off the shelf.  the type could make it more interesting though.  </font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 38996
    user: 108
    date: 2003-11-24T09:45:00
    date_raw: Monday, November 24, 2003 - 9:45 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">There is also a UV coat ... can&#39;t remember &#40;this early Monday morning&#41; which protects &#40;better?&#41; from finger prints. I&#39;m pretty sure it is UV. In which case you could do a flood UV &#40;it is an art book, right?&#41; and a spot high gloss varnish.  <BR> <BR>One book I have in mind, and the reason I suggest &#34;hiding&#34; the type, is Herb Ritt&#39;s <i>Africa</i> .. incredibly elegant, understated, refined. The meat of the type is on the spine. Where the type really belongs anyway. Well, in my opinion anyway. If it is a high-impact photo, such as the one you have here, the type will  not be necessarily the thing that draws them in. It is the story which the photo is telling. Personally, I think that if the book is lucky enough to be face forward &#40;or up&#41; in the history or art section, or new books piles&#41; you won&#39;t need the type. And, when the book is relegated to the shelf, spine out, that is when the type needs to do its job. If you can, I wouldn&#39;t make the type near so big, or find a way to make it invade less of the image. And that is why I suggested varnishing.  <BR> <BR><IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0></font></font></font></font></font></font></font></font></font></font></font>
