    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I wouldn&#39;t do anything to �spice up� the photo. It would go against the historical, journalistic grain of the picture and add absolutely nothing to the cover except maybe some photoshoppish varnish, at the same time taking away from the impact. What you could consider, just maybe, is opting for a different cropping of the photo that takes away about 1/3 of the girls face, which might &#40;haven&#39;t tried it, so I can just imagine the effect&#41; a bit more peoignancy to the image, making it a bit more oblique in a very underhanded manner.  <BR> <BR>The red SLAVES is okay, giving it a bit of a TIME Magazine look, which suits the overall effect. I could very well do without the clever bit of white/gray with the authors name and the Title of his last book. It&#39;s just the designer being clever and shows a bit of disrespect to the Author. InterCaps is okay as an effect for branding a company, but not for a name of a real person, imo.  <BR> <BR>I don&#39;t know about the wishes of your editor, but I also could imagine a solution with very small text, emphasiszing the photo, als well as a solution emphasiszing the word slaves more, from edge to edge, straight over the smaller kids face, with the rest of the information quite small again. Both COULD be more effectiv, albeit in very different ways. Might be worth trying though. </font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
