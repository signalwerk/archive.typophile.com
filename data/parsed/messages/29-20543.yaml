    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The transparency is the best idea yet. Got me thinking of overprinting SLAVES &#40;condensed sans&#41; in red, the full width of the bottom, ultra tight spacing bleeding off the page in 3 directions. 21st Century mixed case and small, flush to the top-left of SLAVES &#40;or possibly over the top left of it&#41; in white or grey. <BR> <BR>To do the overprint you may need to lighten the image &#40;only behind the letters&#41; since it is dark. Or, create two identical layers of red type in photoshop, one set to 50% opacity, the other to 100% multiply. <BR> <BR>Don&#39;t put anything on the tags or do any photoshop filter trickery, IMHO. <BR> <BR>Randy</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
