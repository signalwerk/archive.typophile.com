    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Grazie Signor Andrew Fall. <BR> <BR>Here is the full text: <BR> <BR>&#34;Rhythm in abstractly endless but if it goes together with a melody, <BR>here that a concrete object pops up in front of your mind. <BR>Funny, how music has an effect... <BR>Drumming is extremely physical, very erotic as well, it awakes your body...  <BR>releases your senses... and even at its strongest it can calm you down,  <BR>awake your spirit... it puts you in contact of your innermost being, and it  <BR>unites people maybe more than any other type of music, it is such a basic  <BR>instinct, as it is the rhythm of body &amp; soul.&#34; <BR> <BR>&#40;c&#41; Tuija Tervo, 5 March 2003 <BR> <BR> <BR>The font project is also &#34;weird&#34; because its upper case initials <BR>are accounted for Italian &#40;but the project is stretchy&#41;: <BR> <BR> <BR>A  di animali &#40;animals&#41; <BR> <BR>B  di balena &#40;whale&#41; <BR> <BR>C  di cane &#40;dog&#41; <BR> <BR>D  di dromedario &#40;dromedary&#41; <BR> <BR>E  di elefante &#40;elephant&#41; <BR> <BR>F  di farfalla &#40;butterfly&#41; <BR> <BR>G  di gatto &#40;cat&#41; <BR> <BR>H  di hemigymnus fasciatus &#40;fish&#41; <BR> <BR>I  di ippopotamo &#40;hippopotamus&#41; <BR> <BR>J  di jack rabbit &#40;rabbit&#41; <BR> <BR>K  di koala &#40;koala&#41; <BR> <BR>L  di lumaca &#40;snail&#41; <BR> <BR>M  di mucca &#40;cow&#41; <BR> <BR>N  di nasica &#40;monkey&#41; <BR> <BR>O  di orso &#40;bear&#41; <BR> <BR>P  di pipistrello &#40;bat&#41; <BR> <BR>Q  di quercino &#40;rodent&#41; <BR> <BR>R  di riccio &#40;hedgehog&#41; <BR> <BR>S  di serpente &#40;snake&#41; <BR> <BR>T  di tarantola &#40;spider&#41; <BR> <BR>U  di upupa &#40;hoopoe&#41; <BR> <BR>V  di volpe &#40;fox&#41; <BR> <BR>W  di wallaby &#40;kangaroo&#41; <BR> <BR>X  di xenopo &#40;frog&#41; <BR> <BR>Y  di yak  &#40;yak&#41; <BR> <BR>Z  di zebra <BR> <BR> <BR>The illustrator who designed the font with me has a link <BR>at <a href="http://www.donadelli.it" target="_blank">http://www.donadelli.it</a>. <BR> <BR>Thanks again, Mr. John Downer for the off-line letter. <BR> <BR>Cheers, <BR>AS</font></font></font>'
