  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">On June, 10. 2004, I submitted a font project to Emigre. <BR>I didn�t get one reply of any sort. I am aware we are busy. <BR>If someone on the forum could tell me how to get hold of <BR>the Emigre dudes, I appreciate. I am jealous of my font. <BR>Thanks. <BR>AS</font></font></font></font></font></font></font></font>
