    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thank you very much for the note Mr. Ole S�rensen. <BR>After I posted to Typophile, Mrs. Zuzana Licko wrote me, <BR>but assured me it was unrelated -- whe changed two mails; <BR>in post scriptum I attach the last one &#40;unreplied&#41;. <BR>The PDF is also attached. Thanks again for having interest. <BR>Best, AS. <BR> <BR> <BR>PS/ <BR> <BR>&#62; I&#39;m sure it&#39;s unrelated, as I haven&#39;t had time to read Typophile <BR>&#62; for about three months. <BR>I see, well, funny anyway. <BR> <BR>&#62; The Emigre type review board meets every 4-6 weeks to review <BR>&#62; submissions, so it can take up to 6 weeks to receive a reply <BR>&#62; to any given submission. <BR>Oh, I didn`t know. <BR> <BR>&#62; No, not the same font, only new designs. <BR>But that is new Zuzana. <BR>It is accounted for Italian but it can be adapted for English <BR>as well, I am sure you didn`t get the idea behind. A type-designer <BR>adviced me to contact you because I`ve been told your style &amp; <BR>philosophy matches my font &#40;AdiAnimali&#41; and viceversa. <BR> <BR>&#62; Please understand that we receive hundreds of submissions, <BR>&#62; so it&#39;s impossible for us to critique declined fonts. <BR>Okay, grazie. I just know the quality I put in my works. <BR> <BR>&#62; At Emigre, we decide to accept or decline designs based on whether <BR>&#62; we feel they would make good additions to our library. <BR>That is why I contacted you -- I mean, mutual. <BR> <BR>&#62; If we decide to decline a submission, as described above, <BR>&#62; then we do not offer specific comments or suggestions <BR>My expectation was a &#34;yes-no&#34; reply to my question, although <BR>a &#34;yes&#34; was obviously wished. You can`t be so stiff with people <BR>who understand what is behind the making of letterforms, <BR>I am sure you are following me. I wonder what is the rational <BR>quality of the submissions you get &#40;I respect your experience&#41;. <BR> <BR>&#62; our policy is to let the artist decide on that direction. <BR>I am stubborn, I know the quality I put in my works, <BR>and I can provide a philosophy behind. Why we need more fonts? <BR> <BR>-- <BR>[<a href="http://www.as8.it" target="_blank">www.as8.it</a>]  Alessandro Segalini <BR>  telephone:  &#43;39 389 2728 831 <BR><!--attachment: AdAnimali_FONT-40623.pdf*mime_pdf.gif*application/pdf*420.3**AdAnimali_FONT%2epdf --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align=left alt="application/pdf"><br><a href="http://www.typophile.com/forums/messages/29/AdAnimali_FONT-40623.pdf" target="_blank"><b>AdAnimali_FONT.pdf</b></a> (420.3 k)</td></tr></table></center><!--/attachment--></font></font></font></font></font>'
