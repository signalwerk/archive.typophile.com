    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Sweeeeeeeeet! What a nice idea of Zara and Laurence! <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 79883
    user: 111
    date: 2004-10-25T09:23:00
    date_raw: Monday, October 25, 2004 - 9:23 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">If it wasn&#39;t for the rain, I could&#39;ve spend an entire evening sending free video emails.  <BR> <BR>John, you are certainly right about Bath, what a lovely place � I was especially drawn to the inscribed street signs. Had a wander into Camden Books and it was a good thing Lorp scooped up all the books before I found them &#40;some wonderful old Motif publications&#41; because I could have done serious damage to my wallet. I did find a nice issue of Fine Print &#40;Vol 15, No 1&#41;, the content is primarily on Newspaper typography and included a very nice specimen for Ionic No.5, Excelsior, Times New Roman, Imperial, Olympian and Swift, plus a few others. And did I mention that it was free? <BR><font color="808080">Thanks for spending so much money L.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 79895
    user: 909
    date: 2004-10-25T09:50:00
    date_raw: Monday, October 25, 2004 - 9:50 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">So many fun people. Zara and Calliope were both great to hang out with. Unfortunately, lack of sleep started to get the better of me, so I wasn&#39;t up to serious partying. <BR> <BR>One unhappy afternote: later the night of my last posting, I got food poisoning, too! Mine was from some dubious Indian take-away by Waterloo station. <BR> <BR>I am mostly better now, and back in Seattle. Food aside, we still give high marks to the Brits for hospitality. Another good example: people would spontaneously offer to help us get the stroller into the Tube station &#40;darn stairs -- most of the underground stations aren&#39;t wheelchair/stroller accesisble&#41;. <BR> <BR>Cheers, <BR> <BR>T</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 79916
    user: 108
    date: 2004-10-25T11:50:00
    date_raw: Monday, October 25, 2004 - 11:50 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Oh Thomas, that isn&#39;t fun. I could have warned you to avoid the Indian in London. When I was there in 2002, after ATypI Rome, Vince and I went for Indian and I made the mistake of having the chicken. Blech! Wasn&#39;t flying home sick just a blast? &#40;sarcasm intended&#41;</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 79947
    user: 1262
    date: 2004-10-25T14:51:00
    date_raw: Monday, October 25, 2004 - 2:51 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I protest: I have had some truly great Indian meals in London. I guess you have to know where to go and where to avoid. I can give a list of my favourites to anyone who is interested. I did have a comical experience at Khan&#39;s in Bayswater a couple of weeks ago: I took some of the recent Reading graduates for dinner, and after we ordered food we turned to the drinks menu and discovered, to our dismay, that the restaurant has gone 100% halal since my last visit, and no longer serves alcohol. <BR> <BR> <BR>I have fond memories of bookshopping with Laurence in Bath. After a day wandering around the shops, I was happy to have one slim volume in hand: Laurence had six bags full of books, and had made arrangements for a gigantic folio volume to be held until he could arrange to collect it. <BR> <BR>Mind you, I&#39;m currently looking at the three shelf-feet of books I brought back from Prague abd London, wondering where I&#39;m going to put them!</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 79948
    user: 1250
    date: 2004-10-25T14:57:00
    date_raw: Monday, October 25, 2004 - 2:57 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; I guess you have to know where to go and where to avoid. <BR> <BR>It also depends on the... &#34;versatility&#34; of the given stomach. I know a tourist who was rushed to the hospital from drinking tap water in Puerto Vallarta, while the locals give it to their toddlers. <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 79951
    user: 909
    date: 2004-10-25T15:47:00
    date_raw: Monday, October 25, 2004 - 3:47 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Actually, I&#39;ve just learned of additional evidence &#40;in the form of more people we met getting sick&#41;, so I am now inclined to think it&#39;s a very sudden-onset stomach flu. Pretty scary, as one goes from no symptoms to violently ill in a couple of hours. <BR> <BR>It wasn&#39;t too bad flying home, as I was over the worst of it. But I&#39;m sure the fellow in between me and the aisle wondered why I had to go to the bathroom so many times. <BR> <BR>The Indian food had tasted pretty good, actually. Nice and spicy, the way I like it. Mmmm. <BR> <BR>Cheers, <BR> <BR>T</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
