    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">My old landlord calls Earl&#39;s Court &#34;The Little Antipodes&#34;. If you want to be kept awake by people saying &#34;mate&#34; and &#34;fair dinkum&#34; thats the place to stay!</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 79527
    user: 909
    date: 2004-10-22T03:24:00
    date_raw: Friday, October 22, 2004 - 3:24 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This was one of my favorite conferences ever. It was really quite wonderful. Little 4 1/2-month-old Miranda was quite the hit, and took most everything in good spirits, though the trip seems to have messed up her body clock so we haven&#39;t had much sleep. 3-5 hours is not enough, I fear. <BR> <BR>It was a pleasure to meet Jim, though somehow we didn&#39;t end up seeing much of each other after our initial meeting. I have a photo of him in a rather amusing pose, however, which I will have to send him. <BR> <BR>It was also interesting to meet one of Typophile&#39;s lurkers, the lovely Lisa Pomeroy. I&#39;m starting to realize that there are quite a lot of people who lurk and don&#39;t post much, meaning the Typophile community is in some respects much larger than is apparent from just reading posts. <BR> <BR>Yesterday we came out to Reading and I did a three-hour seminar on Unicode and OpenType for the MA Type Design students. It was great fun, and they asked very bright questions. Unfortunately, Veronica must have gotten a bad sandwich at lunch, and seems to have come down with food poisoning last night. So we ended up staying overnight in Reading thanks to the generous hospitality of Mark Barratt and Sue Walker, and I&#39;m now sitting in the Text Matters office &#40;the top floor of their house&#41; catching up on email. <BR> <BR>In London, we have been staying at the Mad Hatter, which was the designated conference hotel. Very reasonably priced, nice enough, good pub downstairs. Currently has rather small beds, but reportedly will be upgrading soon. <BR> <BR>Cheers, <BR> <BR>T</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
