  - id: 7469
    user: rsd99
    date: 2002-10-16T07:34:00
    date_raw: Wednesday, October 16, 2002 - 7:34 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The foundry was Mannsman Scangraphics. They are now apparently out of business, and I don&#39;t know what has happened to their &#34;library.&#34; <BR> <BR>Try in &#34;The Pirate&#39;s Den&#34; ... ���.��������.�����</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 7477
    user: 851
    date: 2002-10-16T19:26:00
    date_raw: Wednesday, October 16, 2002 - 7:26 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Scangraphic out of business? Could have fooled me... <BR> <BR><a href="http://www.scangraphic.de/sc-about-fonts.htm" target="_blank">http://www.scangraphic.de/sc-about-fonts.htm</a> <BR> <BR>FontHaus also sells SG fonts: <BR><a href="http://www.fonthaus.com/products/fonts/FontFind.cfm?Function=Supplier&amp;Search=Scangraphic" target="_blank">http://www.fonthaus.com/products/fonts/FontFind.cfm?Function=Supplier&amp;Search=Scangraphic</a> <BR> <BR>But I can&#39;t find Avant Garde in there. :-&#40; FontHaus does, however, have Elsner &amp; Flake&#39;s strange monospaced version. <BR> <BR>The Avant Garde alts were also part of Linotype&#39;s GX Font Collection, released back in the early 90s. It had such other oddities as &#34;schoolbook letters&#34; for Times, Helvetica, and New Century Schoolbook, all the swashes for Bookman, swash caps for Palatino &#40;not the originals, but rather Ariadne, which has often been paired with Palatino&#39;s and others&#39; lowercase italics&#41; and the swash alternates for Zapf Chancery Medium Italic. <BR> <BR>You might be able to call Linotype and see if they have any extras left that they would be willing to sell you. You can only get to the GX features through GX apps like UniQorn and LightningDraw, or one-by-one through the InDesign glyph palette. GX features do not work automatically in InDesign like OpenType features. <BR> <BR>Good luck in your quest, <BR>--John <BR> <BR>P.S.  <BR>RSP99 wrote: <i>Try in &#34;The Pirate&#39;s Den&#34; ... ���.��������.�����</i> <BR> <BR>Please do NOT use alt.binaries.fonts. Type designers are generally nice folks who work unusually hard and don&#39;t deserve to be ripped off. People&#39;s livelihoods are involved.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 59795
    user: ezthrust-users
    date: 2004-05-11T10:46:00
    date_raw: Tuesday, May 11, 2004 - 10:46 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;RE:Please do NOT use alt.binaries.fonts. Type designers <BR>&#62;are generally nice folks who work unusually hard and don&#39;t <BR>&#62;deserve to be ripped off. People&#39;s livelihoods are involved. <BR> <BR>If a font is impossible to find in and of the legal channels then how is going to a.b.fonts going to hurt them?  If something &#40;anything&#41; I had created had fallen out of publishing then I would want people to be able to get it somewhere.  <BR> <BR>I managed to find an old song I had recorded and lost the demos of on an mp3 forum. I was eternally grateful. <BR> <BR>Those forums are as much a way to keep forgotten works alive as they are anything.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 59801
    user: 1202
    date: 2004-05-11T11:09:00
    date_raw: Tuesday, May 11, 2004 - 11:09 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;ve put up a gallery of Avant Garde ligatures and alternates on my site. Go to: <BR> <BR><a href="http://www.keithtam.net" target="_blank">http://www.keithtam.net</a> <BR> <BR>Enjoy! <BR> <BR>K.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 59829
    user: 1262
    date: 2004-05-11T13:50:00
    date_raw: Tuesday, May 11, 2004 - 1:50 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>If something &#40;anything&#41; I had created had fallen out of publishing then I would want people to be able to get it somewhere. <BR> <BR>Those forums are as much a way to keep forgotten works alive as they are anything.</i> <BR> <BR>But what if you preferred that something be forgotten? What if you decided to deliberately withdraw something from circulation because you were dissatisfied with it? Would you still be happy to see people trading it on newsgroup forums? <BR> <BR>This is not a hypothetical question. The early Tiro Typeworks Type 1 retail fonts have all been withdrawn from circulation, a process that took some effort to cancel contracts etc. We did this because some of the types were going to be revised and rereleased in OpenType format, while others we were unhappy with and wanted to retire. The fact that trading those old fonts on newsgroups doesn&#39;t financially harm me is irrelevant: the fonts are my intellectual property and I have the right to say when, how and if they are distributed.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
