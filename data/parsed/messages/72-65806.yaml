  html: <font class="dontLookLikeCrap">This is design-centric, not type-centric, but a friend asked me to help spread the word about <a href="http://www.berkeleyrep.org/HTML/AboutTheRep/jobs.html">a job opening at Berkeley Repertory Theatre</a>, a nonprofit theater in &#40;no surprise&#41; Berkeley, CA. It&#39;s a great company that does very interesting work. If you&#39;re local &#40;or want to move to the Bay Area&#41;, it&#39;s probably one of the most rewarding positions you can get in the arts as a designer around here.</font>
