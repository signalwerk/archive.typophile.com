  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">While I was in Prague, one of the first things that I noticed was this: <BR><img src="http://www.typophile.com/forums/messages/4100/51247.jpg" alt="oskar logo"> <BR>Oskar is the Vodafone subsidiary in the Czech Republic. On first glance, I thought that this was quite a cool logo; I&#39;m not sure if &#34;oskar&#34; is written in a custom typeface, or if it is set in a FontShop variation on Dax, but no matter�it looks good. I also appreciate the use of a glyph from the font as the smile. <BR> <BR>But I was immediately remembered of the Hasbro logo &#40;a company which I worked for a few years ago&#41;. In the mid-90s, they redesigned their logo, which since then has looked like this: <BR><img src="http://www.typophile.com/forums/messages/4100/51248.jpg" alt="hasbro logo"> <BR>For all of my fellow type nerds, I can tell you that the Hasbro logo is definitively set in a custom typeface, aptly called Hasbro Regular. I can&#39;t recall who designed it, but I&#39;ll bet that someone here can. <BR> <BR>But no matter� it isn&#39;t the typeface that irks me, rather the composition. I&#39;m not saying that this logo is plagerized, it clearly is not, but it does seem &#34;similar&#34; <BR> <BR>Do you think that the Oskar logo was &#34;inspired&#34; by the Hasbro logo? Is this too close for comfort? Would you do something like this?  <BR> <BR>I once made a logo for an online Christian bookstore &#40;that was a fun client�&#41; who directed me to create something &#34;as close to Amazon&#39;s logo as my artistic integrity would allow.&#34; That was 1999, and both the bookstore and the company I worked for then are gone &#40;the logo, BTW, was the word &#34;YourKingdom.com&#34; set in Futura regular, with a streamlined vector swoosh underneath� mea culpa, mea culpa�&#41; <BR> <BR>Or are my ghosts just coming back to haunt me? <BR> <BR><font color="808080"><font size="-2">This post is dedicated to P22, who seem to have problems with Czech brands using their fonts without proper licenses.</font></font></font></font></font></font></font></font>'
