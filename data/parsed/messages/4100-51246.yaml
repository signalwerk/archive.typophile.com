    html: <font class="dontLookLikeCrap">With a world population over 6 thousand million I wouldn�t feel surprised if someone had the same idea I did with out any contact. <BR>I wouldn�t worry so much about this, �t�s actually impossible to be original, we only do reinterpretations of what we have seen before, the only concern I would have is to make sure at least your concept is unique enough for the market you are in.</font>
