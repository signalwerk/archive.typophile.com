    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I certainly don&#39;t have a problem with Richard! I put this little P.S. in my post because he told me in Prague about two separate instances of his fonts being used used in the corporate identities of large companies who weren&#39;t registered with P22. And since I saw this logo in Prague, too, I thought that it was an interesting cororally, even though it deals with a different issue. <BR> <BR>I wasn&#39;t suggesting that Barmeno was a P22 font. I was assuming, from its style, that it might be from FSI. I wasn&#39;t too far off, since it is from Berthold &#40;as I just found out&#41;, and therefore German.</font></font></font></font>
  - id: 78693
    user: 618
    date: 2004-10-15T06:14:00
    date_raw: Friday, October 15, 2004 - 6:14 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;&#62; Do you think that the Oskar logo was &#34;inspired&#34; by the Hasbro logo? <BR>No. This idea is everywhere. Off the top of my head: <a href="http://www.designinteract.com/features/hellodesign/" target="_blank">http://www.designinteract.com/features/hellodesign/</a> <BR><a href="http://www.peoplepc.com/" target="_blank">http://www.peoplepc.com/</a> <BR><a href="http://www.3dnews.ru/documents/2750/intelplay_logo.jpg" target="_blank">http://www.3dnews.ru/documents/2750/intelplay_logo.jpg</a>  <BR> <BR>&#62;&#62; Is this too close for comfort? <BR>Again no. Conceptually it&#39;s very close. The execution is not nearly as close as any of the above. <BR> <BR>&#62;&#62; Would you do something like this? <BR>Now that you mention it, no. Not because it&#39;s not a good idea, all of the logos above are well executed IMHO. It&#39;s just one of those ideas that you think to yourself &#42;genius&#42; only to discover you&#39;ve reinvented the wheel. Acutally, I might do something like this. The above happens to me at least once in every project. You don&#39;t always have a large perspective on your own work, especially when you work by yourself!</font></font></font>'
  - id: 78694
    user: 1085
    date: 2004-10-15T06:34:00
    date_raw: Friday, October 15, 2004 - 6:34 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Yeah, I know what you mean� there are only so many ways to design logos, and everyone wants one that looks just like veryone else&#39;s but different. I do think that the Oskar logo is more like the hasbro logo than any of the three you just liked though, because it no only has the smiley-face, but also the rectangle at an angle &#40;which the logos in the links don&#39;t have&#41;. <BR> <BR>A few students and I did a seminar last year with the creative team from Leo Burnett in Frankfurt, and we talked a lot about &#34;ideas that have been done before,&#34; since we were working on a campaign for a car company, and those are really almost all identical at the moment. They told us that they would never, ever consciously borrow an idea from a campaign that had been done before, competitor or not. If they realized that they had done something that was recycled, they would go back to the client and try to convince the client that they would redo it to preserve originality. Interesting idea I thought� really struck me�</font></font>
