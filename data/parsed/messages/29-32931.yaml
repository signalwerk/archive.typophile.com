  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey Guys! <BR> <BR>I am working on a identity and packaging project for one of my design studios and this is my idea so far.  A luxury men&#39;s cosmetic company, salon level products.  I imagine men in their late 20&#39;s to  their 50&#39;s, probably businessmen, live in the city, maybe single. <BR>This is the first time I have ever hand lettered anything like this from sketch to screen.  I am going to post the basic black and white form first...it needs help.  still in the baby stages. <BR><img src="http://www.typophile.com/forums/messages/29/32932.gif" alt="initial"> <BR> <BR>here is the same with a variety of colors and in reverse. <BR><img src="http://www.typophile.com/forums/messages/29/32933.gif" alt="colors"> <BR> <BR>and now a SEPERATE and yet related issue: the tagline type <BR><img src="http://www.typophile.com/forums/messages/29/32934.gif" alt="tagline"> <BR> <BR>critique em!</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
