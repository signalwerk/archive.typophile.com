    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think it would depend upon your middle-aged man. I&#39;m assuming this is for the &#34;metrosexual&#34; market &#40;those who genuinely do want to look model perfect&#41; and maybe those men like Jack Nicholson who we all perceive to be an absolute tiger and babe magnent.  <BR> <BR>Your lettering reminds me of P.Diddy for some reason. It is very urban. If someone wants to feel younger, or is perhaps going through midlife and wants to shake things up, your lettering could be very appealing. However, I think it needs more uniformity. Some of the shapes seem, too thin in spots. &#40;It&#39;s like bed linens, the higher the thread count, the higher the quality.&#41; Maybe you need to get some nice smooth vellum paper and a good new wedge marker and play with the sparking on some paper. Get the feel for what a graffiti artist can do.  <BR> <BR>Well, that&#39;s how I see it.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
