    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think your sketch has lots of energy and the basic form is nicely balanced, particularly with the tagline below. <BR> <BR>My concern is that it look very <i>drawn on a computer</i>. Not a bad thing, just seeing some tortured beziers. I&#39;d suggest taking the basic form that you have &#40;which is nice&#41; and work it out on paper using a veriety of different writing instruments. Try pencil, try charcoal. try a thin and flexible watercolor brush. try fingerpainting, try a stick, use paint, use pastel, use ink. Draw it 100 times in less than an hour. Bang Bang Bang.  <BR> <BR>Then when you digitize it, it will have some vibrancy, but with consistency &#40;which I think is lacking now since you drew it with a digital tool, not a physical one&#41;. You don&#39;t have to be great with your hands to do expressive handcrafted work. Side note: The gi connection is distracting.  <BR> <BR>Good luck! <BR>Randy</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
