    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">ok - <BR> <BR>gild in my mind is the process of getting ready - - taking care of ones self.  Another gild definition could mean to encrust or coat something with gold.  I think it is a short strong word, that could be memorable in a good way. <BR> <BR>I thought maybe a gold foil for the logo on some crisp white stock might be nice for a label. Still working on that end... <BR> <BR>As I did my research it seems that most men&#39;s labels are very much like the example from Andrew Baker&#39;s above post...very minimalist.  I tend to work in that style, and it seems so obvious. So I was trying to get away from that...but maybe the best solution is a simple straightforward type solution like the gild in mrs. eaves.  I have another week to go so I am going to continue to explore the mark and also materials for the labeling and packaging. <BR> <BR>thanks a lot people  <BR> <BR>sx.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 54985
    user: 108
    date: 2004-04-08T14:57:00
    date_raw: Thursday, April 08, 2004 - 2:57 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I do not think you should have the phrase &#34;for men&#34;. The locations at which high quality and high end products are sold it is very clear if it is men or women. Thomas Pink in London ... the brand is called PINK ... but he specializes in men&#39;s &#40;and now women&#39;s&#41; fashion. Very high end.  <BR> <BR>I think using gold might be too obvious, are there other metals or textures that would be better? &#34;Yes, I can afford the Aston Martin Vanquish, but I&#39;m humble enough to stick to a nice Lamborghini Countach.&#34;  <BR> <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 54989
    user: pablohoney77-users
    date: 2004-04-08T15:18:00
    date_raw: Thursday, April 08, 2004 - 3:18 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">i just thought that the choice of the name gild was an unfortunate one. since to gild means literally to coat in gold i&#39;m not sure if using another metal is approprate. maybe avoid the whole metalic vibe altogether and break the anticipated association? i had to chuckle as i was verifying the defintion, that a secondary definition is &#34;to make deceptively attractive&#34; very apropos for cosmetics huh? </font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 55000
    user: 3255
    date: 2004-04-08T17:30:00
    date_raw: Thursday, April 08, 2004 - 5:30 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> // secondary definition is &#34;to make deceptively attractive&#34; // <BR>yes you are right, maybe to close to the true intent of cosmetics.  To be honest though, the assignment is for shampoo, conditioner, and soap.  So, I was being a little broad with my cosmetics bit early on.  Although I don&#39;t think there would ever be a real brand that only did shampoo conditioner and bar soap... <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> <BR> <BR>Other name choices I have pondered:  Modello, robusto, modostile, luxe, modo, bloke, oakwood, churchill...thats most of them. <BR> <BR>So, I believe I will hold gild in reserve and back to the drawing board.  If you have any you all really like from the list above let me know... <BR> <BR>sx.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
