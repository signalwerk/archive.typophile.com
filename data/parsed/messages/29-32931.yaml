    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I like earlier idea using Mrs Eaves- simple , elegant, hits target audience.. New concept does nothing for me. Considering the target audience I doubt it will be very functional. Shapes are clumsy and too playful, GI glyph is too abstract, varied line widths are too extreme, negative space is distractive. Looks like a cross between Cyrillic and Arabic, possibly illegible to someone who does not know what it is suppose to spell out. <BR>My suggestion- go back to original design which works. Remember you are not the client. Someone has to generate money with this, </font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
