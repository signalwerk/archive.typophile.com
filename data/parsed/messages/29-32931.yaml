    html: <font class="dontLookLikeCrap">Shawn, I really like the Mrs Eaves, particularly if you elongated the L and perhaps made the base serifs on the i and l touch. Whether or not the subtitle says &#34;For Men&#34; is debatable, but I definitely think that a short caption completes the form of the marque since the lc binocular g ligature is such an optically large letter compared to the rest. Having &#34;For Men&#34; or &#34;Pour Hommes&#34; or similar floating under the text is a nice feature. <BR> <BR>But Vitus has a certain flair to it that I can&#39;t deny. More on that when we see a new version.</font>
