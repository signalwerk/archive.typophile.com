  html: "------------------------- <BR>FOR IMMEDIATE RELEASE <BR>------------------------- <BR> <BR>Call For Entries Announced For TypeCon2001 TypeGallery <BR> <BR> <BR>ROCHESTER, NY -- MAY 14, 2001 -- Join the evolution! <BR> <BR>The TypeCon2001 TypeGallery is an unjuried showcase of new type designs and typography from around the world. The TypeGallery will be on exhibit continuously during TypeCon2001, July 13-15, 2001, in Rochester, New York, USA. <BR> <BR> <BR>GUIDELINES FOR SUBMISSION <BR>------------------------- <BR> <BR>- Any designer or foundry &#40;commercial or independent&#41; may submit a maximum of three new type designs for inclusion in the TypeGallery. <BR> <BR>- TypeCon2001 attendees may submit up to three entries at no charge. Attendees who wish to submit more than three pieces must include a $10 fee per entry in excess of three. There is a $10 fee per entry for exhibitors not attending TypeCon2001. Entry fees are payable by credit card, check or money orders &#40;checks must be drawn on US banks; international money orders are accepted from outside the United States&#41;. Credit cards are processed through P22; to pay by credit card, please call &#43;1 &#40;716&#41; 885-4482. <BR> <BR>- Fonts may be commercially available, proprietary or not available for distribution. Samples of hand-lettering may also be submitted. <BR> <BR>- Type designs must have been completed and/or released between July 2000-July 2001. <BR> <BR>- Each submission should be printed at 11 x 17 inches or A3 in size, and mounted flush to white foamcore board. Unmounted entries will NOT be exhibited. <BR> <BR>- Entries may be in black-and-white or color. <BR> <BR>- Boards should show one typeface or family in an optimal setting &#40;showing the full character set is recommended&#41;. <BR> <BR>- A typographic piece which is not a type specimen showing may also be exhibited. All fonts used must be noted. <BR> <BR>- Include the name of the font&#40;s&#41;, type designer, graphic designer, foundry, postal address and telephone number, and website URL. <BR> <BR>- Please do not include advertising literature or pricing in specimens or other artwork to be exhibited. <BR> <BR>- All submissions must arrive at the TypeCon offices by July 7, 2001. <BR> <BR>- Submissions will not be returned, but may be picked up in person at the end of the conference. <BR> <BR> <BR>Please send all submissions &#40;well-packaged to prevent damage&#41; to: <BR> <BR>Society of Typographic Aficionados <BR>TypeCon2001 TypeGallery <BR>2604 Elmwood Avenue, #167 <BR>Rochester, NY 14618-2295 <BR>USA <BR> <BR>Questions?  mailto:info@typesociety.org"
