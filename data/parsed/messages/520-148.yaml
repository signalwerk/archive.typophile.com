    html: Hi Barry, <BR> <BR>True, Fontographer hasn&#39;t been upgraded in some time, though I believe it is still the tool of choice for many type designers.  <BR> <BR>You might want to look into Robofog, which is a bionic version of Fontographer- It has the original source code of Fontographer with added scripting abilities in Python.  <BR> <BR>See <A HREF="http://www.robofog.com" TARGET="_top">http://www.robofog.com</A>, <A HREF="http://www.python.org" TARGET="_top">http://www.python.org</A> <BR> <BR>Personally, I design my typefaces in Illustrator and then import them into Fontographer. <BR> <BR>//jared
