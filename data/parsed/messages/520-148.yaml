    html: I still use Illustrator 6.0, so it sounds as if this might just be a glitch with the newer versions of Illustrator. <BR> <BR>A couple of things to try.... <BR>&#40;Chances are you may have tried these already. If these don&#39;t work, I don&#39;t even have a guess as to what is wrong... :/ &#41; <BR> <BR>1. Save your drawing as an EPS. &#40;Downsaving to Illustrator EPS version 5 or lower may improve your chance of success, rather than using the default option of the most current version of Illustrator or Freehand.&#41; Open the Fontographer font file. Select the glyph cell into which you wish to import the EPS drawing. On my version of Fontographer &#40;4.0.4 for Macintosh&#41;, there&#39;s an option under the FILE menu to IMPORT an EPS. Find the EPS file you just saved, and select it. This should work. <BR> <BR>But if it doesn&#39;t, try this instead.... <BR> <BR>2. Open your EPS drawing in Illustrator. Keeping Illustrator open, open the Fontographer font file. Back in Illustrator, select the entire drawing that you wish to copy to Fontographer, and do an old fashioned cut-and-paste COPY &#40;Command-C&#41;. Go back into your Fontographer font file and select the glyph cell that you wish to copy to. PASTE it in using &#40;Command-V&#41;. This should also work. <BR> <BR>Both of these methods should work whether you actually open the glyph cell or whether you just select it. <BR> <BR>Best of luck. Let us know if it&#39;s still not working. :/ If all else fails, perhaps a phone call or e-mail to Adobe would be helpful. <BR> <BR>David
