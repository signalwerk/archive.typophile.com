  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">ALAMEDA, CA, FEBRUARY 25, 2005 -- <a href="http://www.typesociety.org" target="_blank"> The Society of Typographic Aficionados</a> &#40;SOTA&#41; and <a href="http://www.buildingletters.org" target="_blank"> Building Letters</a> announced the release of <a href="http://www.myfonts.com/fonts/fontaid/fleurons-of-hope/" target="_blank"> Fleurons of Hope</a>, a collaborative typeface created to benefit victims of the December 26 Indian Ocean earthquake and tsunamis. Fleurons of Hope was developed for <a href="http://www.fontaid.com" target="_blank"> Font Aid III</a>, a project uniting the international creative community to support relief efforts in the affected region. <BR> <BR>Government agencies and United Nations sources estimate the Boxing Day catastrophe has claimed the lives of over 170,000 people, while more than 125,000 remain missing. According to World Health Organization statistics, at least an additional half million people were injured and five million were displaced or left without adequate access to basic necessities and essential services. <BR> <BR>SOTA, a US-based non-profit organization, and Building Letters, a UK charitable concern, launched Font Aid III in response to one of the worst natural disasters in modern times. Dutch designer Max Kisman, contributor to previous Building Letters and SOTA projects, developed the concept for the font - a collection of fleurons &#40;also known as &#34;printer&#39;s flowers&#34;&#41;. Font Aid&#39;s typographic flowers will serve as a tribute to those who lost their lives; a helping hand extended to survivors; and a reminder of the awesome power of nature. <BR> <BR>An open call for fleuron submissions issued in early January met with tremendous response. More than 220 designers worldwide submitted over 400 glyphs for Fleurons of Hope, including Bob Aufuldish, Phil Baines, Peter Bilak, Matthew Carter, Chank Diesel, John Downer, Ed Fella, Verena Gerlach, Yanek Iontef, Jeffery Keedy, Barbara Klunder, Alessio Leonardi, Miles Newlyn, and Sumner Stone. Jim Lyles of Bitstream produced the complex typeface in OpenType for Windows and Macintosh OS X, with a TrueType version available for Mac OS 9 or earlier. <BR> <BR>Fleurons of Hope is now available for sale at <a href="http://www.myfonts.com/fonts/fontaid/fleurons-of-hope/" target="_blank"> MyFonts</a>, and will also be included in the Building Letters &#34;Tsunami Edition&#34; - a magazine and CD of fonts donated by major foundries and independent designers. Building Letters, an initiative of British designer Jim Richardson, is currently in production in Prague under the direction of Filip Blazek. The Tsunami Edition is scheduled for publication in late March in a limited run of 1,000 copies. <BR> <BR>Earlier this year, the typographic community united in another fundraising effort for Font Aid III initiated by type designer and book artist Richard Kegler. Thirty-five type foundries agreed to donate proceeds from sales of their top-selling fonts through MyFonts from mid-January through February 14. The Font Aid III &#34;umbrella foundry&#34; raised more than $12,600 from font sales during the target period. <BR> <BR>Proceeds from sales of Fleurons of Hope, Building Letters, and the Font Aid III multi-foundry effort will be donated to tsunami relief efforts. SOTA is acting as a non-partisan organizing body to ensure that all funds are distributed appropriately. <BR> <BR><b>Font Aid: a Brief History</b>  <BR> <BR>Swedish type designer Claes K�llarsson conceived of the initial Font Aid project in 1999. More than 25 type designers participated in designing a collaborative font, with proceeds going to UNICEF to help war and disaster refugees. In 2001, SOTA became involved when member Stuart Sandler was inspired by K�llarsson&#39;s efforts and initiated Font Aid II. This second collaborative &#34;charity-ware&#34; typeface was created to benefit the victims of the September 11 attacks in the US. More than 90 designers in over 20 countries contributed question mark glyphs expressing their individual reactions to the tragic events. <BR> <BR>To find out more about Fleurons of Hope and to purchase the font, please visit <a href="http://www.myfonts.com/fonts/fontaid/fleurons-of-hope/" target="_blank"> MyFonts</a>. Updates on the Building Letters Tsunami Edition will be posted on the <a href="http://www.buildingletters.org" target="_blank"> Building Letters website</a>. More information about Font Aid and SOTA is available on the <a href="http://www.fontaid.com" target="_blank"> Font Aid website</a> or by emailing <a href="mailto:info@typesociety.org">info@typesociety.org</a>.</font></font></font>'
