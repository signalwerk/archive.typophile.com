  html: <font class="dontLookLikeCrap">hyphen <BR>a typographic forum <BR> <BR>42 polemi street <BR>542 48 thessaloniki <BR>greece <BR>T &#43;30 2310 322.031 <BR>F &#43;30 2310 322.251 <BR>E <a href="mailto:info@altervision.gr">info@altervision.gr</a>  <BR> <BR> <BR>Call for papers <BR> <BR>Hyphen welcomes papers on typography and graphic communication and contributions at the meeting places between typography and other disciplines. <BR> <BR>Ten issues have been published since 1998 and the journal now appears on a yearly basis. <BR> <BR>The 2005 volume will be printed in July. <BR> <BR>The editor will be accepting contributions till the end of April and endeavours to acknowledge receipt within fifteen days after the contribution has arrived. <BR> <BR>On acceptance, the editor will ask contributors to supply their work as a word-processed file. <BR> <BR>Illustrative matter accompanying the text should be in an acceptable form to allow for the best possible reproduction. <BR> <BR>Proofs are sent to contributors about two months before publication. Contributors receive without charge three copies of the relevant volume.  <BR> <BR> <BR>For more info please contact  <BR> <BR>Klimis Mastoridis <BR>po box 503 66 <BR>540 13 thessaloniki <BR>greece <BR><a href="mailto:klimis@altervision.gr">klimis@altervision.gr</a> <BR><a href="mailto:klimis@uom.gr">klimis@uom.gr</a></font>
