  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi all, <BR>I&#39;m unable to find a explanation, if there is one, about dcroat glyph. Specifically about placement and width of vertical steam. I tried to open some existing CE fonts just for refernce and it looks like most of the time it has the same width as &#34;uni02C9&#34; &#40;macron&#41; glyph. <BR>Is there any general consensus about this. <BR>thanks <BR> <BR> <BR>ps.sorry for bad english</font></font></font></font></font>
