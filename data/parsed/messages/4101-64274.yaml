    user: pablohoney77-users
    date: 2005-01-31T13:54:00
    date_raw: Monday, January 31, 2005 - 1:54 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">According to <a href="http://www.microsoft.com/typography/developers/fdsspec/lowercase.htm" target="_blank">Microsoft</a>: <BR> <BR>Lowercase d with stroke - dyet <BR>Unicode: U&#43;0111 <BR> <BR>Design : This character&#39;s is used in the Croatian, Vietnamese, Macedonian and Serbian languages. Its design is based on the lowercase d with an added bar. The bar should be the same thickness as other lowercase characters with bars. Vertically the bar should be visually centered between the x-height and the ascender. It should horizontally extend to the right of the stem similarly to the serif in serif designs and enough to be visible at small size but not long enough to cause spacing problems for sans serif designs. To the left the bar should extend approximately one half the width of the lower bowl of the d and in italic designs visually one half the bowl.</font></font></font></font>'
