    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey everyone! I&#39;m new to the forums so I&#39;ve uploaded a lot to share with you! I&#39;m a newly graduated graphic designer - so any ideas/suggestions for improving my work would be awesome... <BR> <BR>1&#41; Shot of a old, grody emergency phone booth; taken at Bradley Point, West Haven, CT, USA <BR> <BR><img src="http://www.typophile.com/forums/messages/14800/41684.jpg" alt="Emergency!"> <BR> <BR>2&#41; Potty-humor &#34;pick up after your dog&#34; sign; taken at Bradley Point, West Haven, CT, USA <BR> <BR><img src="http://www.typophile.com/forums/messages/14800/41685.jpg" alt="Slut Mitts"> <BR> <BR>3&#41; Fire/Emergency Type taken off of the aforementioned emergency telephone booth; taken at Bradley Point, West Haven, CT, USA <BR> <BR><img src="http://www.typophile.com/forums/messages/14800/41686.jpg" alt="Fire! Emergency!"> <BR> <BR>4&#41; Warning text attached to the same emergency telephone booth; taken at Bradley Point, West Haven, CT, USA <BR> <BR><img src="http://www.typophile.com/forums/messages/14800/41687.jpg" alt="WARNING!"> <BR> <BR>5&#41; Typography = &#34;OPEN&#34; - also found on emergency telephone booth!; taken at Bradley Point, West Haven, CT, USA <BR> <BR><img src="http://www.typophile.com/forums/messages/14800/41688.jpg" alt="OPEN"> <BR> <BR>6&#41; I love shots like these! &#34;Turn to Clear Vision&#34;; taken at Bradley Point, West Haven, CT, USA <BR> <BR><img src="http://www.typophile.com/forums/messages/14800/41689.jpg" alt="Turn to Clear Vision"> <BR> <BR>7&#41; Budget-Rite Liquors - they care!; taken in Hamden, CT, USA <BR> <BR><img src="http://www.typophile.com/forums/messages/14800/41690.jpg" alt="Budget Rite Liquors"> <BR> <BR>8&#41; Auto-Top sign; taken in Hamden, CT, USA <BR> <BR><img src="http://www.typophile.com/forums/messages/14800/41691.jpg" alt="Auto-Top"> <BR> <BR>9&#41; &#34;Custom&#34;; taken in Hamden, CT, USA <BR> <BR><img src="http://www.typophile.com/forums/messages/14800/41692.jpg" alt="Custom"></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
