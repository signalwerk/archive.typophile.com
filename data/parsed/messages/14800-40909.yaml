    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><img src="http://www.typophile.com/forums/messages/14800/63426.jpg" alt="Cinema"> <BR> <BR>This is the back of a cinema &#40;of course!&#41; in suburban Minneapolis &#40;Brooklyn Park/Brookdale area&#41;. I have more photos of found type in my <a href="http://www.afiler.com/photos/metropia">Metropia</a> gallery. I&#39;ve also photographed &#34;found&#34; type on grocery store products -- all of these can currently be bought in a grocery store, despite their outdated-looking design. It&#39;s called <a href="http://afiler.com/extantdesign/">Extant Design</a> -- I don&#39;t know if you&#39;d consider it found type or not, so I&#39;ll just leave it as a link for anyone who&#39;s interested.</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
