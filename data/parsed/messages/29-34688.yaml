  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Identity for Buddha Jewelry, large guage tribal jewelry hand crafted in Bali. materials- stone, jade, bamboo, coconut shell, mother of pearl, wood and buffalo horn -for the modern primitive. Rush job- 9 days. 8 pages. Identity, in-house photography, print collateral, print management. This client rules- paying fair rates, good communication and creative freedom. Wish there had been more time. Things can be less than perfect doing 18-28hr. work sessions, with 2-4 hour naps <BR>inbetween. Thank Buddha for espresso. Images shown do not have final SKU numbers or titles which just arrived this morning. <BR>+++ jpeg +++ 34681 +++  <BR>Identity-type +++<img src="http://www.typophile.com/forums/messages/29/34689.jpg" alt="type in use"><img src="http://www.typophile.com/forums/messages/29/34690.jpg" alt="catalog cover"><img src="http://www.typophile.com/forums/messages/29/34691.jpg" alt="simplified logo"><img src="http://www.typophile.com/forums/messages/29/34692.jpg" alt="jewelry detail"><img src="http://www.typophile.com/forums/messages/29/34693.jpg" alt="sample catalog page"> <BR>typefaces used. &#34;Buddha&#34; -custom, &#34;Jewelry&#34;- Peter BIlak&#39;s Fedra Normal Small Caps, Body Copy- Mark Von Bronkhorst&#39;s Conduit. <BR>&#40; wanted to use new Suitcase Foundry fonts but was unable to obtain in timeframe&#41;. Custom Tribal text face design was killed due to rush. <BR>Web design with proprietary CMS in works. Initial comp. <BR>Collaborators- my biz partner Michael Greenwood &#40;web/coder/ <BR>co-creative&#41; and Brad Peterson &#40;Layout and production&#41;-thanks bro you saved our <font color="ff0000">&#149;</font><font color="ff0000">&#149;</font><font color="ff0000">&#149;</font> with the endless pre-work and production.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
