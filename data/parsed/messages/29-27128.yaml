  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><img src="http://www.typophile.com/cgibin/board-post.pl?action=posting_upload_form&what=show&img=27126" alt="BITMAP_ZIG.gif">  <BR> <BR> <BR> <BR>I don&#39;t know if this is kosher, but a client asked me to make a bitmap version of a font that they use -- and this is what I came up with. It&#39;s my first stab at this sort of thing! Any thoughts on how I can make it better? <BR> <BR>I&#39;ve done this in photoshop only. What is the best way to turn it into a working macintosh font? <BR> <BR><img src="http://www.typophile.com/cgibin/board-post.pl?action=posting_upload_form&what=show&img=27126" alt="BITMAP_ZIG.gif">  <BR> <BR></font></font></font></font></font></font></font>
