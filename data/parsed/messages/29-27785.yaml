  - id: 50694
    user: 1909
    date: 2004-03-05T10:18:00
    date_raw: Friday, March 05, 2004 - 10:18 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Kyle, a pity indeed, but I don&#39;t have syntax <IMG SRC="http://www.typophile.com/forums/clipart/sad.gif" ALT=":-&#40;" BORDER=0> All in all, I needed a sans family with many variations to use for many purposes &#40;regular, bold, xtrabold, condensed etc&#41; and had to choose basically from helvetica, frutiger, franklin, gill, eurostile, futura and zurich. as the first three are already terribly overused in our local press, and the latter three don&#39;t quite convey feeling of a womens magazine, I went for gill. Purchasing any new typefaces wasn&#39;t considered at all.  <BR> <BR>Hector, I really didn&#39;t want a beak on the r, as it makes it seem more like Manta &#40;which has a completely different meaning in our language :D &#41;.  <BR> <BR>I need a very clear, clean, simple masthead, as the mag is targeted to an average medium-low income woman of 25-55, city AND country &#40;hey, we have only about 1.5 mln women in total here &#40;including newborn babies&#41;, have to grab what we can&#41;, so I can&#39;t use anything any of them would consider &#39;modern&#39; or &#39;extreme&#39; or &#39;repelling&#39; or whatever. But I still want it to be well done. <BR> <BR>Anyway, I tried to follow Hrant&#39;s directions and here is what I came up with. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/27978.jpg" alt=""> <BR> <BR>I liked the serifs of the &#39;a&#39;, as without them the &#39;a&#39; looked too &#39;futura&#39; type geometric, so I decided to leave them. Also the old &#39;r&#39; is back and the &#39;t&#39; is slashed to match the angle of the &#39;r&#39; &#40;mh.. still haven&#39;t learned the names of all those various letter parts <IMG SRC="http://www.typophile.com/forums/clipart/sad.gif" ALT=":-&#40;" BORDER=0> &#41;. <BR> <BR>Thank you all for advice <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0></font></font></font>
  - id: 50702
    user: 1250
    date: 2004-03-05T10:45:00
    date_raw: Friday, March 05, 2004 - 10:45 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I like it. The tail on the &#34;a&#34; is great! Just the outside countour is shaky: bring the top&amp;bottom apexes to the right - flatten out the curves. <BR> <BR>Two more things: <BR>- The &#34;M&#34; is still too dark. <BR>- There&#39;s a huge gap between the &#34;r&#34; and &#34;t&#34;. In a sans there&#39;s not too much you can do, but try: making the &#34;r&#34; narrower; and giving the whole more letterspacing. <BR> <BR>hhp <BR></font></font>'
