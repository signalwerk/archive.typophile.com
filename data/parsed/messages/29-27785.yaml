  - id: 50490
    user: 108
    date: 2004-03-04T10:03:00
    date_raw: Thursday, March 04, 2004 - 10:03 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The change to the _lowercase r_ seems subtle enough, but the changes to the _lowercase t_ aren&#39;t quite right, althought I&#39;ve always wondered about the _lowercase t_ that is part of the font.  Maybe a little wider? Perhaps you could modify the _cap M_ too ... a little narrower?</font></font></font></font></font></font></font></font></font></font>
  - id: 50509
    user: 1530
    date: 2004-03-04T11:39:00
    date_raw: Thursday, March 04, 2004 - 11:39 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Try making the &#34;r&#34; beak and the &#34;t&#34; crossbar a single stroke or maybe slicing the &#34;r&#34; beak with the &#34;t&#34; diagonal that connects the stem with the crossbar on the top.</font></font></font></font></font></font></font></font></font>
  - id: 50523
    user: 618
    date: 2004-03-04T12:26:00
    date_raw: Thursday, March 04, 2004 - 12:26 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I have tried to like Gill. And I just don&#39;t. It is ugly. But it&#39;s what you&#39;ve got. So: <BR> <BR>H�ctor makes a good suggestion, an rt ligature. I dont think you&#39;ll want a beak on the r. It just adds to the HUGE hole. Try the quick and dirty fix = move the ta combo left until the bottom of the terminal hits the stem of the t. I bet it will look decent. <BR> <BR>Generally the tight letterspacing is tough to pull off when you have a really bad combo such as rt. Might work with the above ligature. <BR> <BR>Can you change the name to Mata?  He he. <BR>Oh, you could also try a unicase R. <BR> <BR>Randy</font></font></font></font></font></font></font></font>'
  - id: 50528
    user: 2915
    date: 2004-03-04T12:41:00
    date_raw: Thursday, March 04, 2004 - 12:41 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Maija, since its a one word logo try crashing the letters together and where they overlap knockout the letter forms. This would make it a graphic and not type. It might be more interesting than redesigning the two characters.</font></font></font></font></font></font></font>
  - id: 50544
    user: 1250
    date: 2004-03-04T13:43:00
    date_raw: Thursday, March 04, 2004 - 1:43 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Gill Sans&#39;s ugliness &#40;I agree, Randy&#41; comes in large part from that &#34;a&#34;. Maija, I&#39;d say make a monocular &#34;a&#34; for the logo. Also, I like your new &#34;t&#34;, but the original &#34;r&#34; was better. Lastly, the &#34;M&#34; is too big and heavy - so you could try simply scaling it down a bit. <BR> <BR>hhp <BR></font></font></font></font></font></font>
