  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I am currently doing design for a new womens weekly. As I have used GillSans troughout it &#40;had to choose something from Bitstream basic set of fonts <IMG SRC="http://www.typophile.com/forums/clipart/sad.gif" ALT=":-&#40;" BORDER=0>&#40; &#41; I figured, to keep it simple, I could use it in masthead as well. However, the planned name of the mag is &#39;Marta&#39;, and the rt combination in Gill is as bad as it can get. So I tried to improve it. Does it look convincing? <BR> <BR>Before <BR> <BR><img src="http://www.typophile.com/forums/messages/29/27786.jpg" alt=""> <BR> <BR>After <BR> <BR>And just how one gets access to start a new thread in the Design section?</font></font></font></font></font></font></font></font></font></font></font></font>
