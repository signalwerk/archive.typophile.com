  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi there, <BR>I&#39;ve recently become a member of this wonderful place so therefore I&#39;ve got a little project that needs some attention. <BR> <BR>It&#39;s a logo for my own company YESYES. My main area is naming/corporate ID for newly started companies and Art Direction in general. <BR> <BR>I wanted a plain and stylish logotype and also including symbol in order to make it flexible. <BR> <BR>I&#39;ve been through a dozen designs... and this is what I ended up with. <BR> <BR>Comments are more than welcome! <BR> <BR>Cheers, <BR>/Henriko<img src="http://www.typophile.com/forums/messages/29/4828.gif" alt="YESYES final logo ?"></font></font></font></font>
