    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey Gonzales, <BR> <BR>You really got a point there with the thickness! <BR>I&#39;ll fix that! <BR> <BR>Originally the font has a different angle according to my symbol so I had to alter the angle of the &#34;Y&#34; so they would fit together &#40;have the same angle&#41; <BR> <BR>Therefore I&#39;m a bit concerned about expanding the width of the &#34;Y&#34; - it could end up looking more like a &#34;V&#34; <BR> <BR>Thanks for the critique anyway <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> <BR> <BR>Cheers, <BR>/Henriko <BR></font></font></font></font>
