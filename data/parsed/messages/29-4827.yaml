    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Henrik, <BR> <BR>i really like it, very simple, very clear. <BR> <BR>My onlu comment is that you should compensate the &#34;Y&#34;s, make them a little more wider and, and make the diagonals thiner, they look to thick to me if you compare them with the horizontals of the &#34;E&#34;s. <BR> <BR>BTW, I love the color <BR> <BR>CG</font></font></font></font>
