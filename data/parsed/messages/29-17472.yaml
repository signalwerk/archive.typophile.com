    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Christos -- They are both very nice, but the one on the left has the &#34;romance&#34;. The mountains could create the line at the bottom, as opposed to have a perfect box. One thought. The title and subtitle, could they attach to the left of the grey box instead of the top? You could them move them down and balance a bit in the middle. Just thoughts.</font></font></font></font>
