    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">goodmorning and thank you for the response. <BR> <BR>Dmitry: <BR>&#34;i think you can put forest from the second variant into it.&#34;  <BR>-it will add too much noise i think &#40;and this poster is already too noisy for my taste&#41;. <BR>-as for the &#34;more detailed hand&#34; you are right. <BR> <BR>Randy...thanks for the encouraging words. <BR>I totaly agree with what you write in the 1st paragraph. <BR>As to apply the &#34;left&#34; hand to the 2nd poster <BR>maybe will improve the poster but is a matter  <BR>of policy to show it to the client like  <BR>that and then propose this adjustment. <BR>Also instead of making the background blue  <BR>and the case black i tried to make the case  <BR>grey but the impression was less strong. It was <BR>even less with a dark blue background. <BR> <BR>Tiffany--i am not sure if i understood  <BR>your proposal but i can explain my decision <BR>about the layout: the heavy title keeps the  <BR>horizon line and the left adjustment compined <BR>to the loose kerning of the subtitle and the name  <BR>of the writer, gives a move to the right which  <BR>follows the movement of the hand. <BR> <BR>have a good and shinny day  <BR>&#40;here in greece is still to shiny...lucky me&#41; <BR> <BR>...christos</font></font></font></font>'
