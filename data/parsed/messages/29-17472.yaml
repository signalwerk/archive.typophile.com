    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Christos. <BR> <BR>Your style is fantastic. These theater companies are lucky to have you. At any rate, i think the composition in the first is better &#40;color, balance, movement etc&#41;, but I prefer the concept in the second. It better shows the duality you talked about � all business/all pleasure. The first one  just says pleasure to me. <BR> <BR>In the second version, perhaps use the style of the arm/hand as in the first example? Also, perhaps a blue background and a BLACK case to bring the focus there. The type treatment in the first is better. You&#39;ve got a great eye for these things so I&#39;m sure you&#39;ll work it out. <BR> <BR>I agree with Dmitry, keep the trees... <BR> <BR>Randy</font></font></font></font>
