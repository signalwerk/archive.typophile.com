  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi fellows, <BR>here i have two proposals for a theater play <BR>&#34;Mr. Puntilla and his man Matti&#34; by B. Brecht. <BR> <BR>The story is about the life of a finnish wealthy man  <BR>who makes trips  around Finland for bussines. <BR>His permanent company to those trips is his driver Matti. <BR>Puntilla is a man who has two opposite personas.  <BR>On one hand he is a cold bussinesman,  <BR>but when he drinks, becomes generous,  <BR>open-hearted and hedonist.  <BR> <BR>The elements i should use are:  <BR>-the nature of Finland, <BR>-the feminine element &#40;drunk Puntilla is always  <BR>in love and gives wedding promisses to various women&#41;. <BR>-alcohol <BR> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/17473.gif" alt="puntilla"> <BR> <BR>...any comments?</font></font></font></font>'
