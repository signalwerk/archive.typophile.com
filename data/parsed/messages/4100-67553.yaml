    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks Forrest. I forgot to mention that I&#39;ll only be setting Neutraface in all caps for heads like &#34;Marketing.&#34; For trivia&#39;s sake, I&#39;ll be using</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 96769
    user: 108
    date: 2005-03-17T15:24:00
    date_raw: Thursday, March 17, 2005 - 3:24 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">David I might suggest something like Vendetta or Tribute, even if others laugh. Neutra is so tough to match you are better off finding another serif that is more old style than not. I&#39;d also suggest, if you are going to use all caps, either use small caps instead with some letterspacing or at least all caps with some letterspacing maybe 2 pts less than you think you should.  <BR> <BR>Just suggestions. :^&#41; <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/67615.gif" alt=""></font></font></font></font></font></font></font></font></font></font></font></font>
