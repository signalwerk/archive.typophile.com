    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Agree with Tiff on A. Place cuts where the crossbars join stems, <BR>rather than in the center. Stephan Muller&#39;s <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FF.11126.4.11&amp;attributes.sampleSize=96&amp;sampleText=aRoMW&amp;sampleSize=96" target="_blank">FF Watertower</a> <BR>has some good models to follow.</font></font></font></font></font>
