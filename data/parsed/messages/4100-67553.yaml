    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks Tiffany, <BR> <BR>I found it about a minute after posting my question. <BR> <BR>Okay, another Neutraface related question. The project I&#39;m working on also requires that keywords be die-cut into polyethelene dividers that will be in the binder. So that requires a stencil be created for certain letters. Here is a rough draft of what I have come up with. I&#39;ll fine tune the stencils later. I sure hope Christian Schwartz never sees this <BR><img src="http://www.typophile.com/forums/messages/4100/67618.jpg" alt="neutra diecut"> <BR> <BR>Are the stencils positioned okay? I&#39;m particularly concerened with the R.</font></font></font></font></font></font></font>
  - id: 96780
    user: 108
    date: 2005-03-17T16:20:00
    date_raw: Thursday, March 17, 2005 - 4:20 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think your placements need to be a little more assymetrical. The R seems right to me, but the A and the O seem too centered.</font></font></font></font></font></font>
  - id: 96783
