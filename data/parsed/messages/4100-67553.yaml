  id: 96637
  user: 5455
  date: 2005-03-16T17:25:00
  date_raw: Wednesday, March 16, 2005 - 5:25 pm
  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I am working on a proposal that my company is putting together. It&#39;s a huge binder filled with a lot of financial info as well as photographs and architectural renderings of our stores. <BR> <BR>We are using Neutraface as the display face, but I want to use a serif that complements Neutraface and is legible, hopefully making long financial pages less dull. <BR> <BR>Suggestions?</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
comments:
  - id: 96753
    user: 5605
    date: 2005-03-17T14:53:00
    date_raw: Thursday, March 17, 2005 - 2:53 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Neutraface has those tall, spindly ascenders, which makes it a little hard to match. I&#39;d suggest an antiqua like <a href="http://www.myfonts.com/fonts/linotype/koch-antiqua/">Koch Antiqua</a> or <a href="http://www.myfonts.com/fonts/spiecegraphics/eva-sg/">Eva SG</a>, but those are too overtly calligraphic and achieve much of their effects through low x-height rather than tall ascenders. Also, it&#39;s too spindly for use as a text setting. <BR> <BR><a href="http://www.myfonts.com/fonts/emigre/filosofia/">Filosofia</a> has a similar amount of personality as Neutraface, and is roughly the same age.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 96758
    user: 5455
    date: 2005-03-17T15:00:00
