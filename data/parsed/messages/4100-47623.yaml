    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">People either seem to love or hate Bodoni. I tend to like it &#40;when appropriate&#41;, but I especially get all warm and fuzzy when I see a Kit Hinrichs <a href="http://www.pentagram.com/portfolio-identities-10.htm"> piece</a> that uses Bodoni... &#40;at least it looks like Hinrichs&#41; <BR> <BR>Vignelli and Rand certainly use it well, too.</font></font></font></font>
  - id: 73360
    user: 3135
    date: 2004-08-27T14:08:00
    date_raw: Friday, August 27, 2004 - 2:08 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Tif, <BR>It is a fuzzy no-quote from 35 years ago so don&#39;t assume it is gospel.  <BR>As a young designer in my 20s &#40;1968-69&#41;, I worked for the Westinghouse Corporate Design Center in Pittsburgh.  Paul Rand was on retainer by Westinghouse and on a couple of occasions came down from Connecticut to keep us on the right track making design standards guides.  We were a small group of about 8 people so his talks were at close range.  I can&#39;t say for sure how the topic came up but I think it had to do with a discussion of &#34;approved&#34; typefaces for Westinghouse identity. Since Rand also did the IBM corporate ID, he mentioned the use of Bodoni as an example.  I don&#39;t have an exact quote for you, just the failing memory of a now old geezer.  I wish I did.  Rand was a real character and had a way of getting right to the heart of a matter instantly.  If I were to guess what it might have been it might be something like, &#34;Bauer Bodoni is the only one worth looking at.&#34;   I want to be clear HE did NOT say that. It is just my take on the way he had of being decisive and convincing.  Of course I was just a young pup lowliest-of-the low among the designers there so maybe it was being starstruck. <BR>Surprisongly, he remembered me a few years later when I saw him give a presentation at an AIGA/ADC meeting.  And I thought I was oh-so under the radar. <BR> <BR>ChrisL</font></font></font>
