    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><a href="http://www.myfonts.com/fonts/agfa/atour-bodoni/at-our-bodoni-regular/?PREFS_SET%5BRenderSize%5D=72&amp;PREFS_SET%5BRenderString%5D=design%3A+Vignelli" target="_blank">Vignelli &amp; Associates</a> uses what I believe is a modified Bauer Bodoni called &#34;Our Bodoni&#34;</font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 73240
    user: 3135
    date: 2004-08-26T15:32:00
    date_raw: Thursday, August 26, 2004 - 3:32 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Tiff, <BR>Maybe my geezer memory is clouded but I sure seem to remember Paul Rand singing the praises of Bauer Bodoni.  I kind of thought Massimo was more of a Bodoni Antiqua kind of guy. <BR> <BR>ChrisL</font></font></font></font></font></font></font></font></font></font></font>
  - id: 73242
    user: 3135
    date: 2004-08-26T15:41:00
    date_raw: Thursday, August 26, 2004 - 3:41 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Suddha, <BR>&#62;Do you know any web sites, which uses this font in its heading, sub-headings, captions etc?&#60; <BR> <BR>Bauer Bodoni is gorgeous beyond belief but the thin lines which give it elegance may be tough to see on a web site or in captions.  I like to let it show off at larger sizes.  For smaller sizes, Bodoni Antiqua has a bit more meat to it but still won&#39;t hold up on the web too well. <BR> <BR>ChrisL</font></font></font></font></font></font></font></font></font></font>
  - id: 73248
    user: 3135
    date: 2004-08-26T16:20:00
    date_raw: Thursday, August 26, 2004 - 4:20 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Suddha, <BR>Attached is a PDF file I just put together comparing both Bodonies.  Be very aware that the Antiqua is a Berthold product. <BR> <BR>ChrisL<!--attachment: bodoni_chrisL-47688.pdf*mime_pdf.gif*application/pdf*36.9*Bodoni+2+examples+in+sizes*bodoni_chrisL%2epdf --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align=left alt="application/pdf">Bodoni 2 examples in sizes<br><a href="http://www.typophile.com/forums/messages/4100/bodoni_chrisL-47688.pdf" target="_blank"><b>bodoni_chrisL.pdf</b></a> (36.9 k)</td></tr></table></center><!--/attachment--></font></font></font></font></font></font></font></font>'
  - id: 73340
    user: 108
    date: 2004-08-27T10:27:00
    date_raw: Friday, August 27, 2004 - 10:27 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Chris --&#62; Really? Well gee whiz and a cracker. I&#39;d love to have that quote in my archives. Reference? <BR> <BR>Suddha --&#62; A better version of Bodoni, IMHO, is ITC&#39;s Bodoni. It offers three different optical sizes making it a more utilitarian choice if you need it for the web. You might also swing more toward Didot and check out Hoefler &amp; Frere Jones&#39; version. I have licensed both of them and cannot think of a reason to license any other Didot&#39;s or Bodoni&#39;s. &#40;Although I do have a license for some of Typofonderie&#39;s Ambroise cause I&#39;m a sucker for Didot-like typefaces&#41;</font></font></font></font></font></font></font>
