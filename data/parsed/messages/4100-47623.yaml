  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi,  <BR>I have really started liking this font, Bauer Bodoni. Seems to have a strange timelessness attached to it.  <BR> <BR>Do you know any web sites, which uses this font in its heading, sub-headings, captions etc?  <BR> <BR>Thanks  <BR>S S Ray</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
