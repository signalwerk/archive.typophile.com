  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hello dear fellows, <BR> <BR>as often, i send again roughs for a poster  <BR>about a theatrical play. The title is  <BR>&#34;Working Girls&#34; and is about  <BR>7 women working in a clothing factory. <BR> <BR>Their life is captured in the hard and cold wheels  <BR>of the factory routine. Sometime they decide  <BR>to make a change by going down on strike <BR>...only to realize �after their  <BR>temporary victory� that nothing has changed.  <BR> <BR>As you see it is not the most optimisting  <BR>play you may watch. <BR> <BR>Main visuals &#40;as mentioned from the stage designer&#41;  <BR>are the production chain, clothing symbols,  <BR>pressure of time, dark colour pallete  <BR>and industrial atmospheare. <BR> <BR>Thanx for the attention, looking forward for your comments. <BR> <BR>christos <BR> <BR><img src="http://www.typophile.com/forums/messages/29/21799.jpg" alt="1"> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/21800.jpg" alt="2"> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/21801.jpg" alt="3"></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
