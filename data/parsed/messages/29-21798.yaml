    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Again, great stuff Christos! <BR> <BR>I like the first one, and would suggest replacing the outside circle of the clock with a gear motif. <BR> <BR>hhp <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 40239
    user: 108
    date: 2003-12-05T11:19:00
    date_raw: Friday, December 05, 2003 - 11:19 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Ok. I&#39;ll be Miss Contrary. I like 2ii ... Framing &#40;space&#41;, Color, Basic Concept ... But, what if instead of parts of women&#39;s heads, you do a patter for a female doll? Taking your original idea of dotted lines and multiple colors, but have a head, a hairline, arms, torso, legs, feet ... all as separate pattern parts? Maybe you could somehow show that they are different women? ... All just thoughts. Your poster work is wonderful.</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
