  - id: 40415
    user: 2106
    date: 2003-12-07T10:03:00
    date_raw: Sunday, December 07, 2003 - 10:03 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">i love 2ii but there are only 7 women in the play, not 9. <BR> <BR>the numbers in each box may be confusing though.  is that metaphorical or something actually IN the play?  the colors are awesome in that and it totally embodies the idea of women working in a clothing factory. <BR> <BR>the first one is not unique enough to me... and the third one is too much like a book cover in my opinion.  they are all very very well done though.   <BR> <BR>2ii silkscreened would be great.</font></font></font></font></font></font></font></font></font></font>
  - id: 40463
    user: 1058
    date: 2003-12-08T03:44:00
    date_raw: Monday, December 08, 2003 - 3:44 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">loren, <BR> <BR>after i designed the 1st poster they told me that the number of the women was not important. So, i let the composition to work as it fit me. <BR> <BR>The time-numbers are refering to the pressure of time by being not &#34;round&#34; but precise. For example you will see 04:32 but not 12:00 or 4:30. <BR> <BR>christos </font></font></font></font></font></font></font></font></font>
