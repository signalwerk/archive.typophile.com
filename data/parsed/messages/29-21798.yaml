    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">True. Although I think the &#34;clothing factory&#34; is where these women are trapped. This is what I read into the second concept. I would almost suggest just simplifying number 2i and make it as graphic as possible a la Bradbury Thompson.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 40226
