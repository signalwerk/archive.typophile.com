  - id: 40334
    user: 1058
    date: 2003-12-06T03:08:00
    date_raw: Saturday, December 06, 2003 - 3:08 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thank you all for the feedback... <BR> <BR>I wish i had time to try all the options you mentioned. What Dmitry and Tom wrote &#40;...&#34;nothing has changed&#34;../...the &#34;clothing factory&#34; is where these women are trapped...&#41; is the main idea.  <BR> <BR>It seems that the feminine symbol in #3, isn&#39;t that vivid so i should add something to support more the presence of woman &#40;Dmitry&#39;s idea about hand was good&#41;.  <BR> <BR>Hrant, your suggestion is correct but the gear motif as clock is used in the #3 poster, so is a matter of presentation policy not to use it again, but i will sure suggest it as a compination to the customer when the presentation will be on.  <BR> <BR>Tiffany i kept the same face in every square because i want to show that actually it is the same woman &#40;in different &#34;versions&#34;-colours&#41;, having the same problems, being in captured in the same cages. <BR> <BR>Oh, and i forgot to mention the fonts i used...DIN, Helvetica and Schnell. I would also like to have some comments about the usage of typography. <BR> <BR>Have a nice day, christos <BR> <BR>P.S. maybe it will seem a little &#34;over-patriotic&#34; to some, but i feel a little proud that an epica price given for first time to a greek designer. If you go and check <a href="http://www.epica-awards.com" target="_blank">www.epica-awards.com</a> there are really wonderfull works. The greek studio awarded for the symbols of the Olympic sports. The illustrations are great &#40;inspired by the ancient greek vase painting [melanomorfa=black shaped] &#41;.</font></font></font></font></font></font></font></font></font></font></font></font>'
