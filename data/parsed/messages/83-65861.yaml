  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi, I&#39;m new to this board and this is my first post.. <BR> <BR>I&#39;m working on designing a cover for an upcoming title on Ray Charles and the publisher is insisting that the title &#34;use the same typeface that was used in the Ray movie promos&#34; <BR> <BR><a href="http://www.raymovie.com/index.php" target="_blank">http://www.raymovie.com/index.php</a> <BR> <BR>From what I can tell it looks like &#34;Ray&#34; was hand-drawn, no? Does anyone have any suggestions?</font></font></font></font>
