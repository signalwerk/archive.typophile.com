    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">After looking through your PDF and printing it to my <i>completely</i> undeserving and lowly hp posing as an inkjet. Being extra sensitive to the letter w, I love the fact that yours works. I think this is one character that usually looks frumpy and out of place in other sans types that are trying to maintain constraint. The dot over the i and j, only looked big on my monitor and the remark was supposed to be tongue in cheek, but instead it came across more foot in mouth. Very <i>very</i> nice work. Will there be a condensed version? <BR> <BR></font></font></font></font>
  - id: 11073
    user: 1262
    date: 2003-01-29T00:06:00
    date_raw: Wednesday, January 29, 2003 - 12:06 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Re. Cadmus: I agree that it is generally better than the heavily Latinised old Helvetica Greek, Baskerville, etc., but I still wouldn&#39;t describe it as authentically Greek. It is really a kind of &#39;what if?&#39; historical fantasy, in which Matthew applies the fairly rigid geometry of early Attic inscriptions to a lowercase alphabet that did not exist at the time. It&#39;s interesting and in some respects successful &#40;it doesn&#39;t suffer from the deadness and lack of rhythm of the Helvetica&#41;, but it is no more authentically Greek than the other types of this period. The straight <i>lambda,</i> the symetrical <i>chi</i> and <i>gamma</i>; the lack of descenders on <i>beta</i>, <i>zeta</i> and <i>ksi</i>; the monodirectional ascender on the <i>delta</i>: none of these are any more authentic to Greek than the serifs on the Baskerville. Perhaps Cadmus just seems more Greek because it is less obviously Latin? <BR> <BR>Anyway, sorry for the digression. Back to Arrival...</font></font></font></font>'
