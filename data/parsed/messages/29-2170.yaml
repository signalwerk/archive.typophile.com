    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">M Carter made a slew of Latinized Greeks in the 70s via Linotype, at the sorry-arse request for such culturally degenerative designs by certain Greek news designers. He rightfully had an allergic reaction to this process, and made Cadmus, and unconventional but in a way culturally authentic &#40;at least &#34;lapidarily&#34;&#41; design. About 20 years later he made Skia, which is in effect a Hellenized Latin font: <BR><a href="http://www.themicrofoundry.com/other/cadmuskia.gif" target="_blank">http://www.themicrofoundry.com/other/cadmuskia.gif</a> <BR> <BR>Michail&#39;s email: <a href="mailto:msemoglou@operamail.com">msemoglou@operamail.com</a> <BR>BTW, a few months ago this place was full <BR>of Greeks - maybe they&#39;re still lurking? <BR> <BR>hhp <BR></font></font></font></font>'
