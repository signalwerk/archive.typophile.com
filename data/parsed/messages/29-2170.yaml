    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Hi there Tiffany, it&#39;s nice to see someone from Reading too! No, I haven&#39;t finished yet. I&#39;m in the process of writing my 10,000-word dissertation! You might be interested to know, it&#39;s on the influce of calligraphic writing on the development of sanserif type. Well, only 7,000 more words to go now! Hey, thanks for your comments! Waiting to hear more from you! <BR> <BR>Keith </font></font></font></font>
  - id: 10806
