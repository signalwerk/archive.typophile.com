    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Nice clean site. <BR> <BR>I&#39;ll have to check out the PDF later: I think your server crashed from all the simultaneous downloads!  :-/ <BR> <BR>BTW, the loose spacing seems to be right on &#40;for highway signage&#41;, partly from what I&#39;ve gathered from James Montalbano. BTW, he&#39;ll be giving a talk about the topic at TC2003: you should go and ask him some heavy technical stuff during the Q&amp;A! <BR> <BR>-- <BR> <BR>Hey, you work with Michail Semoglou?! Wow, cool. He showed me his most recent work in Rome - very nice. It&#39;s a very original &#40;and apparently culturally authentic&#41; Greek, and has a subordinate &#34;Hellenized&#34; Latin component - something that hasn&#39;t been done since Carter&#39;s Cadmus in the 70s. Wonderful. <BR> <BR>hhp <BR></font></font></font></font>'
