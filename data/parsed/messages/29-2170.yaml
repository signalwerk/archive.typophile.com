    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I haven&#39;t looked at the PDF yet, but from the Flash views I&#39;d say it&#39;s a nice, solid humanist sans. The problem is we have so many of those now, it&#39;s hard to appreciate! :-/ The good news is that your flares &#40;although I don&#39;t see how they might promote &#34;clarity of reading from a distance&#34;&#41; do give the design some subtle originality. And the Heavy has a nice presence. <BR> <BR>For signage I presume this needs to be conservative, but for the retail market you might consider putting some funkiness in it, somehow. A good example of what I&#39;m talking about is FF Profile. <BR> <BR>hhp <BR></font></font></font></font>
