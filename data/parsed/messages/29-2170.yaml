    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Some quick observations from the PDF: <BR>1. The italic angle seems jittery. <BR>2. I&#39;m liking the Black more and more, especially in all-caps. <BR>3. The spacing seems uneven in places. <BR>4. The roman lc &#34;s&#34; seems malformed to me. <BR>5. Love the [primary] italic lc &#34;a&#34;! <BR>6. Love the Euro. <BR>7. UC accents too high. <BR>8. Cedilla too cramped/dark. <BR> <BR>The &#34;process&#34; part looks very interesting - I&#39;ll be perusing that soon! <BR> <BR>Keep this up, eh?  :-&#41; <BR> <BR>hhp <BR></font></font></font></font>'
