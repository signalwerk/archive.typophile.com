  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi! I&#39;ve just finished my typeface Arrival, designed for signs. It has three variants: Normal, Normal Italic and Extrabold. It was the practical project for my MA Typeface Design course at Reading. Main features of this typeface: <BR> <BR>_ Large x-height <BR>_ Calligraphic flow <BR>_ Subtle stroke modulation <BR>_ Flaring on stems for clarity of reading from a distance <BR>_ Flowing, legible hybrid italic <BR> <BR>Download the pdf of my specimen booklet if you want to know more about it: <BR> <BR>http://home.lynx.net/chtam/arrival_spec_web.pdf.sit <BR> <BR>Here are the images: <BR> <BR><!-Attachment: arr_norm.swf-!><CENTER><TABLE BORDER=1><TR><TD><IMG SRC="http://www.typophile.com/forums/icons/mime_gif.gif" ALIGN=LEFT ALT="application/x-shockwave-flash">Arrival Normal<BR><A HREF="http://www.typophile.com/forums/messages/29/arr_norm.swf"><B>arr_norm.swf</B></A> (27 k)</TD></TR></TABLE></CENTER><!-/Attachment-!> <BR><!-Attachment: arr_ita.swf-!><CENTER><TABLE BORDER=1><TR><TD><IMG SRC="http://www.typophile.com/forums/icons/mime_gif.gif" ALIGN=LEFT ALT="application/x-shockwave-flash">Arrival Normal Italic<BR><A HREF="http://www.typophile.com/forums/messages/29/arr_ita.swf"><B>arr_ita.swf</B></A> (28 k)</TD></TR></TABLE></CENTER><!-/Attachment-!> <BR><!-Attachment: arr_xbold.swf-!><CENTER><TABLE BORDER=1><TR><TD><IMG SRC="http://www.typophile.com/forums/icons/mime_gif.gif" ALIGN=LEFT ALT="application/x-shockwave-flash">Arrival Extrabold<BR><A HREF="http://www.typophile.com/forums/messages/29/arr_xbold.swf"><B>arr_xbold.swf</B></A> (27 k)</TD></TR></TABLE></CENTER><!-/Attachment-!> <BR> <BR>My web site&#39;s here: www.keithtam.com <BR> <BR>Looking forward to your comments. I&#39;m just trying to test the waters on this board... Be honest with your comments, O.K.? <BR> <BR>Cheers! <BR>Keith. <BR>Vancouver BC, Canada</font></font></font></font>'
