    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thank you so much, Hrant! <BR>I loved Skia since my old Mac and its System 7.5 and I&#39;m sorry its advanced features are built in just as a Quickdraw GX face. Do you know if someone translated in in Type1, OpenType or something? <BR>Cadmus is too wide. A bit narrower and it could be the perfect greek counterpart to the recent Skia. Do you know if Cadmus has a digital version or if Carter is intentioned to work again on Skia. Is Skia still a property of Apple? <BR> <BR>What do you mean by &#34;culturally degenerative designs&#34;? Something like bastard and dull roman fonts designed on the wave of advertising urge from the 1960s onwards we have for latin?</font></font></font></font>
