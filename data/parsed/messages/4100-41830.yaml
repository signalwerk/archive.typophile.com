  - id: 70752
    user: 3135
    date: 2004-08-08T12:33:00
    date_raw: Sunday, August 08, 2004 - 12:33 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">AG, started it perhaps unknowingly.  Univers and Helvetica were big parts of the typography of the Swiss/German philosophy of the &#34;neautral&#34; typeface which lends only its clarity to the communication.  The typgraphers USE of the face was the area that brought the NON-detached or purposive/active message building.  If you look at the works of Emil Ruder and his many students, you will see the same neutral face used again and again but the way it is used is as active to the message and playful as could have been for the time. In the USA, where a far greater variety of faces were used, the construction of the typography was much simpler--even boring.  The Face was asked to do much more so it could not be neutral. <BR>One difference is that the neutral faces have to be strong enough to take a beating &#40;see Weingart or April Greiman&#39;s work&#41;. The not-nuetral faces rely on their own forms for expression and cannot handle the abuse of partial oblitteration and superimposition.  Later, the Emigre people put the oblitteration right into the typeface making it less versatile and requiring many more font purchases.  You must remember that the time and cost of creating a new typeface in the 50s was orders of magnitude greater than it has become in recent years. In prior times type setters had only a few faces.  Choice was minimal. Neutral/versatile faces made great sense.  Today, choice is overwhelming.  What you can&#39;t find ready-made, you can have designed by any of the Typophiles here &#40;or other places too&#41;. <BR> <BR>It remains to be seen what we do with all this choice.  We live in an era of a typeface CostCo or Walmarts.  &#40;You can get anything you want at the Typophile resturant--excepting Berthold:-&#41; &#41;. <BR>Hopefully the typographers who use our type will be as innovative as the generation before us. <BR> <BR>ChrisL</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 70785
    user: 3553
    date: 2004-08-09T07:02:00
    date_raw: Monday, August 09, 2004 - 7:02 am
    votes: 5
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Helvetica is neutral as a prostitute can be. <BR>Helvetica is a wonderful typeface to my eyes, <BR>but it is like the ritual of the tobacco-pipe, <BR>I love that ritual but I don&#39;t think it fits <BR>to me now. Maybe one day, on the rocking chair. <BR>Mr. Evert Bloemsma, why the name &#34;Cocon&#34;? <BR>&#34;Cool&#34; in Italian is not a common word: <BR>to mean something &#34;cool&#34; we say &#34;figo&#34; <BR>which is the male of &#34;figa&#34;, from &#34;fico&#34;, <BR>the fig fruit; &#34;figa&#34; means &#34;pussy&#34;, &#34;haar spel&#34;. <BR>Best, <BR>AS</font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 70901
    user: ebloem-users
    date: 2004-08-10T03:41:00
    date_raw: Tuesday, August 10, 2004 - 3:41 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">To Chris Lozos; I don&#39;t understand: &#34;[...] cannot handle the abuse of partial oblitteration and superimposition.&#34; <BR> <BR>To Alessandro Segalini; The name Cocon I choose I believe because shapes like the &#34;a&#34; in FF Cocon are very round en closed. I choose it when I saw a Moulinex coffee machine named &#34;Cocon&#34; in an advertisement. <BR> <BR>regards, Evert</font></font></font></font></font></font></font></font></font></font></font>'
  - id: 72531
    user: 2289
    date: 2004-08-23T01:41:00
    date_raw: Monday, August 23, 2004 - 1:41 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Vodafone actually use Helvetica Narrow&#42; as their main corporate font. <BR>&#42;they keep swapping with Neue Helvetica 57. <BR>Orange Telecom also use Neue Helvetica as their corporate font, although at the uncondensed width, and with 25 or 35 as a display. <BR><a href="http://www.orange.com/english/default.asp?bhcp=1" target="_blank">http://www.orange.com/english/default.asp?bhcp=1</a> <BR>Presumably/hopefully they were chosen not as a reaction to each other, but as a style-statement &#40;excuse the marketingspeak&#41;.  Are they really considered hi-tech/modern looks or even cool by the target market? This is a subjective decision made by designers who are outside the target age range. Apart from the overuse of the font I do not have a particular aversion to well-used Helvetica. <BR>Tim</font></font></font></font></font></font></font></font></font>
  - id: 72658
