o.com</a>, mvbfonts.com, <a href="http://www.typotheque.com" target="_blank">www.typotheque.com</a> these are good starting points. I would stay away from Georgia as it was created as a screen font not for print.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
