    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This is scaring me. <BR> <BR>So some typefaces are an idea and others are not? How do you tell? <BR> <BR>-- <BR> <BR>Riddle: <BR>Which is better, Helvomita or Fartura? <BR>Neither - they&#39;re both just typefeces. <BR> <BR>hhp <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 70610
    user: 3135
    date: 2004-08-06T15:36:00
    date_raw: Friday, August 06, 2004 - 3:36 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Helvetica is no more an idea than Univers or AG.  If anything, Univers qualifies much more as an idea.  It is the first typeface to truly encompass the &#34;idea&#34; of family. Look at Fruiger&#39;s original display from the late 50s where he shows the joined family of weights and widths in a perfect progression with a logical numbering system to boot.   <BR>Frutiger&#39;s &#34;idea&#34; was to create a typeface with the possibility of UNIVERSal use. <BR>Helvetica came out at about the same time but IMHO failed miserably at making a better, more homogenous AG. <BR>Don&#39;t confuse popularity with ideology.  If Univers or Franklin Gothic had been bundled with every computer on the planet instead of Helvetica, there would have been no &#34;Helvidea&#34; <BR> <BR>You might also read Bodoni&#39;s book. If there is a typeface which might be spawned from an idea, Bodoni is more it than any.  Another is Futura or any of the constructivist fonts. <BR> <BR>The truth is, Hrant is right, they are all just typefaces. <BR> <BR>ChrisL</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 70614
    user: 3135
    date: 2004-08-06T15:59:00
    date_raw: Friday, August 06, 2004 - 3:59 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Sorry Hrant &#34;Typefeces&#34; :-&#41; <BR> <BR>It would take me too long to find the original Univers display but here is part of it from Ruder&#39;s book: <BR><img src="http://www.typophile.com/forums/messages/4100/42278.gif" alt="univers"></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 70699
    user: ebloem-users
    date: 2004-08-07T15:57:00
    date_raw: Saturday, August 07, 2004 - 3:57 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi everyone, I am new on this forum. I noticed FF Legato was mentioned so I took a look. The discussion about Helvetica is interesting. Helvetica is not bad and it has some mystery. <BR> <BR>I understand many graphic designers using it and I think I understand why it is having a revival and probably will be used a lot in the future. It has little to do with the fact that it is on every computer. Helvetica embodies the concept of both our alphabet and our &#40;current&#41; culture very well: rational, simple, separate shapes &#40;I mean more than Gill Sans for example&#41;  to express an idea as a whole, with distance&#41;.  <BR> <BR>Helvetica is quite sophisticated but not too much, opposed to Univers being very sophisticated, for many purposes too much. Helvetica is �cool�, That�s how you anglo-saxons say it don�t you? �Cool� has a lot to do with �indifferent�. Univers is not indifferent, it is distinctive. Indifference is an attitude that belongs to our way of live, these days. Helvetica is �untouchable�, �inaccesible�. <BR> <BR>That must be why it is so hard to find a serifed type that fits with it because all serifed typefaces give so much expression to the human touch as the origin/basis of their shapes. <BR> <BR>Why do you anglo-saxons &#40;and now the rest of the world too&#41; use the word �cool� when you like something very much?</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 70703
    user: 1250
    date: 2004-08-07T16:13:00
    date_raw: Saturday, August 07, 2004 - 4:13 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Evert, Hello! A warm welcome to Typophile. Where Type is Loved. <BR> <BR>-- <BR> <BR>I think Helvetica was &#34;indifferent&#34; for a while, but now it looks a little old, like a famous actor in his 50s. And Univers looks like Barbarella. <BR> <BR>&#62; Why do you anglo-saxons &#40;and now the rest of the world too&#41; use the word &#34;cool&#34; <BR> <BR>Maybe it&#39;s a reaction against &#34;hot&#34;, which was popular right before &#34;cool&#34; became popular?  :-&#41; <BR> <BR>BTW, I think the <i>really</i> young people use &#34;ice&#34; now... <BR> <BR>hhp <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 70714
    user: 3135
    date: 2004-08-07T19:32:00
    date_raw: Saturday, August 07, 2004 - 7:32 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;BTW, I think the really young people use &#34;ice&#34; now...&#60; <BR> <BR>and some of us old people have to use ice in a bag to ease the swelling on our knees :-&#41; <BR> <BR>Welcome Evert, pull up a chair and stay a while. <BR> <BR>ChrisL</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 70727
    user: ebloem-users
    date: 2004-08-08T02:06:00
    date_raw: Sunday, August 08, 2004 - 2:06 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">sorry to have posted my message 4 times; I got some error response from the server after having it posted. <BR> <BR>Hrants&#39;s remark that Helvetica is &#39;old&#39; is just not true ottherwise it would never be used the way it is, for example in the Vodaphone&#42;&#40;see attached image&#41; corporate id and campaign &#40;targetted very much at young people&#41;. I do not believe such marketing/advertisement people make mistakes at this level. <BR> <BR>There is something else quite mysterious about Helvetica. It is &#34;neutral&#34; here is the definition I found at the internet dictionary: <BR> <BR>Not engaged on either side; not taking part with or assisting either of two or more contending parties; neuter &#40;=neither the one thing nor the other; on neither side; impartial; neutral&#41; ; indifferent. <BR> <BR>Very good descriptions!  These properties can, in certain circumstances, be &#39;good&#39; for type because although type carries a message, it does not necessarily has to express this message by itself. Invisible typography. Even in a design like Vodaphone this is one of several aspects I think. <BR> <BR>A word that is not mentioned is &#34;detached&#34;. McLuhan uses this term: &#34;Oral cultures act and react simultaneously, whereas the capacity to act without reacting, without involvement, is the special gift of �detached� literate man.&#34; [...] &#34;literate or visual man creates an environment that is strongly fragmented, individualistic, explicit, logical, specialized and detached.&#34; [...] <BR>&#40;You can download the McLuhan interview published in Playboy in the sixties on my website <a href="http://www.evertbloemsma.nl" target="_blank">www.evertbloemsma.nl</a>&#41;</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 70728
    user: ebloem-users
    date: 2004-08-08T02:18:00
    date_raw: Sunday, August 08, 2004 - 2:18 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Is there a limit to the size of messages? This was left out in my previous message: --- About the word &#39;hot&#39;; Ofcourse I thought of this but in the case of Helvetica you can’t say: “Helvetica is hot’. So the word &#39;cool&#39; is not just a matter of trend. ---- And another attempt to upload the image:.<img src="http://www.typophile.com/forums/messages/4100/42358.jpg" alt="vodaphone"></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
