  - id: 58937
    user: 1058
    date: 2004-05-05T05:34:00
    date_raw: Wednesday, May 05, 2004 - 5:34 am
    votes: 5
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">first of all I think you should make clear in your mind how the restaurant want to &#34;sell&#34; itself. It is a taugh task since it is you that will be the client. It is good to be a little Dr. Jeckyl and Mr Hyde here. For the begining think as a businessman. Put restrictions and rules as a client puts and don&#39;t consider in the first place the &#34;design&#34;. It is a good lesson to make the design work for the idea and not the opposite. <BR> <BR>Further, about what you have right now is that you miss the process i described before. You seem not to have a clear concept of the work. If it is about Mediterranean food you have to consider that one of the most strong i.d. characteristics is history/tradition and warm colours. I would recommend to start a small research about &#34;what mediterranian style&#34; is and after you have a clear view about it, then you can go beyond and put your own option of &#34;how I see Mediterranian style&#34;. Then you can step on your research and create your aspect as much &#34;modernist&#34; or retro you want to be. <BR> <BR>For the moment i see no food and no mediterranian style. <BR> <BR>Hope that i was helpfull and not disturbing. Wish a creative and sunny day. <BR> <BR>christos</font></font></font></font></font></font></font></font>
