    html: <font class="dontLookLikeCrap">yea i agree with most people here, it doesn&#39;t fit for the type of restaurant you described. <BR> <BR><b>Christos&#39; post above is exactly right.</b> <BR>define your concept before you even touch the computer.  write down words that come to mind about the restarurant, look for imagery associated with the type of restaurant it is, photos and drawings and such, and draw little pictures of things and letters and anything else.  remember, all this before you touch the computer.  seriously, it&#39;s been tried and proven--it works out better in the end. <BR> <BR>also, give your logo some breathing room &#40;a little bit of white space around it&#41; even if just to show us a draft. presentation is half of it.</font>
