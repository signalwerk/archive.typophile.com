  html: <font class="dontLookLikeCrap">[A friend from the ATypI list asked me to pass this along.] <BR> <BR>The Chase Ganderwilde &amp; Heady Ballantine Center for Cross-Media Disciplinary Arts and Technology, in Amity MA, USA, is seeking a choreographer-type designer who&#39;s familiar with both the composition rules of graphic design and the forms of modern dance for upcoming multimedia performances of Berthold Gosenolde&#39;s &#34;Lead Lake,&#34; Adam Van Damcam&#39;s &#34;Dance of the Happy Florins&#34; and� Amadeus Shriftengr&uuml;ber&#39;s &#34;Der Princess Unt Der Punch.&#34; <BR> <BR>Scheduled for it&#39;s first run from the August 1st to the 31st, 2006 at the prestigious Gussenberg Theater in Amity, shows will feature both living designers and actors portraying, and dancing as might great type designers of the past and present. <BR> <BR>Candidates are required to begin work June 1st, 2005 outside of Amity and will be expect to complete the first run. Those interested are requested to send a resume, a catalog of your type designs, examples of graphic designs, as well as DVDs of your dance performances, those of you students and teachers, to Abel F. O&#39;Houlahan at the Center, or email to <a href="mailto:ABELAFOOZA2U@ALLATIMZA.ORG">ABELAFOOZA2U@ALLATIMZA.ORG</a> <BR> <BR>Thanks in advance for your help!</font>
