    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Per, <BR>Control Click on the red glyph; a contextual menu will pop up onscreen; scroll down to the submenu color section and select &#34;none&#34;.  You can use this menu for multiple glyphs and color code them as desired as an organizing tool. <BR> <BR>ChrisL</font></font>
