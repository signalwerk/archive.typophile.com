  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#60;font class=&#34;dontLookLikeCrap&#34;&#62;Finally, I got myself together and now I&#39;m posting one of my designs for critique. The story so far: The company &#34;Paldin Holiday&#34; wanted a logo design. They operate a significant number of hotels and resorts. The task was described like this - &#34;we want something that would appeal to rich European customers. We like to show that we have hotels &amp; resorts not only on the Bulgarian Black Sea, but also in the Rhodopes Mountains, various ski resorts &amp; hotels&#34;. PALDIN is an old Roman name for my city, Plovdiv - but wanted me to stay away of the Roman element. That was okay for me, so I did something rather expected: <BR> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/53262.gif" alt="Logo 01"> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/53263.gif" alt="Logo 2"> <BR> <BR>Then, after a month of silence, they appeared and said: &#34;you know what - funny, but the real estate business exploded enormously, so now we&#39;re not only build and rent hotels, but also sell appartments. We love what we see so far, but could you incorporate some &#34;real estate&#34; element in the current suggestions. And they look like a travel agency&#34;. I pollitely told them: what do you expect , with HOLIDAY in the company name? Okay I&#39;ll see what I can do <BR> <BR>As you all see, those designs wouldn&#39;t allow me to add some sort of building, house or similiar symbol. So I started all over again: <BR> <BR><img src="http://www.typophile.com/forums/messages/29/53264.gif" alt="Logo BIG"> <BR> <BR>or  <BR> <BR><img src="http://www.typophile.com/forums/messages/29/53265.gif" alt="Logo 4"> <BR> <BR>Now I&#39;m wondering, would they understand the last one, the roof shape that&#39;s being formed by the 3 squares... <BR> <BR>I&#39;m open for suggestions &amp; comments. Thanks in advance&#60;/font&#62;</font></font></font></font></font></font>'
