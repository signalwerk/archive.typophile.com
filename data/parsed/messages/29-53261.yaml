    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#34;Now I&#39;m wondering, would they understand the last one, the roof shape that&#39;s being formed by the 3 squares... &#34; <BR> <BR>You don&#39;t need to understand a logo for it to be an effective mark. The logotype clearly states, in writing &#39;hotels, resorts, real estate&#39; so I think the roof angle, while nice, isn&#39;t really necessary...it&#39;s just a nice &#39;aha!&#39; when you explain it to them.</font></font></font></font>
