    html: '<font class="dontLookLikeCrap">Hello Ivan  <BR> <BR>i have experience from a similar project in which the client  <BR>needed to achive his corporate id in various fields  <BR>and i can say that a succesfull marketing strategy might be  <BR>that you can create a generic id which can be transformed  <BR>easily to &#34;brand-identities&#34;. What you need is a simple,  <BR>flexible and distinctive form that will allow you to maintain  <BR>the charaxter of the company applied in various mannrs. <BR> <BR>For examble you may use two blocks:  <BR>�the right always with a monogram/symbol  <BR>and the main corporate color <BR>�the second accustomed with the schematic/color  <BR>variation you need to describe the current field. <BR> <BR>christos</font>'
