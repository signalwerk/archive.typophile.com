    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think that you are using too many colors on your logotype&#40;4&#43;&#41; and I don&#39;t really like the typeface you are using. You should work on the illustrations. I hardly see the mountains and the house looks more like a doggy shack to me. <BR>  Of the variations you gave the one with the circles have most appeal. <BR>  You can also try to make the symbols a bit smaller. <BR>If I am to compare the disigns : the ones that you made a month ago and the recent designs, I would surely choose the recent ones. <BR> <BR>Salute, Ivan <BR>&#40;i uspeh ;&#41;</font></font></font>'
  - id: 82302
