    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks everybody, for the feedback. My main concern about the second set of designs is that they may look a bit like and information signs, rather than a logo. I would love to design a wordmark only, and lose all the symbols. But hey - the company I&#39;m working for is not Kioken and we can&#39;t afford to &#34;fire clients&#34;, like they did with Sony.  <BR>Galin is right for the colour usage...I should see how all these symbols would look in a single or 2 colour scheme. <BR>  <BR>Now I&#39;m waiting for them to decide.</font></font>
