  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">need some help with lig feature in OT&#40;CFF&#41;. <BR>here is the code: <BR>loookup liga5 { <BR>   sub quotedbl quotedbl by @_typquotes; <BR>} liga5; <BR> <BR>it compiles with errors which Im aware of &#40;prolly because of quotedbl x2&#41;. <BR>Can someone than suggest how to replace two double quotes with two typographic quotes..quotedblleft and quotedblright when there is some text between them expl. &#34; ffff &#34; to &#8220; ffffff &#8221; . <BR>huh..hope I made my self clear <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0></font></font></font></font></font>'
