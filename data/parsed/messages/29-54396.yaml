    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">To me #3 is cute &#40;that &#34;e&#34; is genial!&#41; but #4, especially in that &#34;scuffed&#34; rendering is really quite nice - it would sell&#42; well, I&#39;m sure of it. BTW, it reminds me of Zentra&#42;&#42;, but that was a lot less legible.  :-&#41; <BR> <BR>&#42; If you&#39;re looking for a font house to sell it through, I would recommend PsyOps. <BR> <BR>&#42;&#42; <a href="http://www.tdc.org/news/2001Results/Zentra.html" target="_blank">http://www.tdc.org/news/2001Results/Zentra.html</a> <BR> <BR>hhp</font></font></font></font></font></font>'
  - id: 84049
