    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">From a purely visual standpoint, I really like #4. For whatever reason, #1 feels the most connected to Shakur &#40;probably because most of what I see connected with him now is posthumous&#41;. <BR> <BR>I&#39;d be interested to see some words set in #4. I&#39;m also curious to see if the &#39;c&#39; would read well. My brain turns it into an &#39;r&#39;. <BR> <BR>Cool stuff. What&#39;s the reaction in your class?</font></font></font></font></font>'
  - id: 84090
    user: 3313
    date: 2004-11-27T15:16:00
    date_raw: Saturday, November 27, 2004 - 3:16 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Harant, thanks for the tips. Especially about selling it. I never thought of it. The project includes the design of a poster to sell it, and information panel or booklet and a t-shirt. All my classmates do superb design job, but they still had the time to appreciate. My professor seems to not know about 2-pac, so i gave him &#34;tupac resurection&#34; and &#34;2pac 4ever&#34; dvd&#39;s to know him better. I sitill got to do same for some of the classmates and the rest of the professors who will be in the board. Chris, thanks for the tip on &#34;C&#34;. I&#39;ll try to flip it vertically and see. I&#39;ll keep bringing the latest updates on it. <BR> <BR>Tseggai</font></font></font></font>
  - id: 84287
    user: 1204
    date: 2004-11-29T09:20:00
    date_raw: Monday, November 29, 2004 - 9:20 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I like #1 as well, for the reasons Chris mentioned. However, it seems TOO clean. Looking at his tattoos, they were all amateurish needle-and-india-ink hack jobs. I think that handcrafted look might be &#34;more&#34; authentic. Overall I think the typefaces you&#39;ve posted here are too &#34;techno.&#34; <BR> <BR>But again, I like #1 a lot, except that I think you should make the T more dramatic and oversized, like the S. <BR> <BR>Good luck!</font></font>'
