    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">i added 2 additional weights. regular and bold, taking the original version as the light weight. <BR> <BR><!--attachment: 3_weights-63107.pdf*mime_pdf.gif*application/pdf*34.3**3+weights%2epdf --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align=left alt="application/pdf"><br><a href="http://www.typophile.com/forums/messages/29/3_weights-63107.pdf" target="_blank"><b>3 weights.pdf</b></a> (34.3 k)</td></tr></table></center><!--/attachment--></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 89511
    user: 1551
    date: 2005-01-17T12:38:00
    date_raw: Monday, January 17, 2005 - 12:38 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I like your solution for &#39;stenciling&#39; the 8 better than the o and O. The forward slant of your breaks on the 8 go with the slant of the design, but on the O and o they contradict it. I like the zero also. I think the 4 needs some fixing. It looks narrow and frightened somehow. The g is fabulous.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 89516
    user: 3177
    date: 2005-01-17T13:13:00
    date_raw: Monday, January 17, 2005 - 1:13 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">thank you william, i think you made a good point about the o&#39;s. i also like the g, but perhaps the connection between the two parts is too short. <BR> <BR>there&#39;s definitely more work to do.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 89621
    user: 1551
    date: 2005-01-18T09:57:00
    date_raw: Tuesday, January 18, 2005 - 9:57 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">On the g, yeah, I was going to say that - the linkage between the loops is too tight. In small sizes that would be a problem. On the caps: Normally the cross bar of the E and H would be higher. I think it would look better here also. For me the bent joins in the MN don&#39;t go well with the rest of the caps. Check out the solution in Friz Quadrata, which puts the bent joins only at the bottom; that might give you some ideas.  <BR>The swash T goes well with the face, but I think the right terminal on the cross bar looks out of place. <BR> <BR>I waver on whether this is too much or too little  of the &#39;stencil&#39; effect, or just right. Have you tried it with breaking the branches of the hmnr from their stems, for a more &#39;stencil&#39; look? Or tried just forgetting about a consistent stencil look and having a closed oOQ? Maybe you could have alternative versions in the final. The design effect of the openning of the other letters than  oOQ is so nice that this would be viable as a display face, without being a full stencil.   <BR> <BR>Good luck with this; it has a nice, distinctive look.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 89623
    user: 3177
    date: 2005-01-18T10:09:00
    date_raw: Tuesday, January 18, 2005 - 10:09 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">thank you william, i appreciate your ideas a lot. the consistency of the stencil look is important for me because it was actually designed to become a real stencil, i want to write/paint on walls! <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> therefore, the form has to follow the function. but as i receive good feedback i guess i&#39;ll end up with a digital version as well. and there one could think of various alternates. i&#39;ll keep you informed about developments!</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
