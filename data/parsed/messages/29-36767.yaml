  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">i&#39;d like to present my first, from the scratch on self made font. she&#39;s called wallflower &#40;i think it&#39;s a she&#41; <BR> <BR>i designed her on screen &#40;and on paper of course&#41;, but in the further development i&#39;ll try to cut the letters from wood and make a set of wooden stencils at about 300pts.  <BR>i decided to use the shapes of a sans, based on a renaissance antiqua as an opposite to most stencil fonts i know, which have allways a very hard, brutal and often army look. for the same reason i only drew lowercase.  <BR> <BR>when painted on a wall it should look nice, not like vandalism, to let the message be heard. <BR> <BR>she&#39;s slightly slanted to give her the attitude of spoken word. <BR> <BR>perhaps she is in general to light, but i think at 300pts it could work. a huge problem is the spacing because in wood, there is no kerning. therefore i have to keep it quite loose.  <BR> <BR>well, those are my thoughts, please tell me yours! <BR>and if my english was too bad to explain the idea, just ask.  <BR> <BR> <BR><!--attachment: specimen_26_4-36768.pdf*mime_pdf.gif*application/pdf*503.8*wallflower+specimen*specimen%2e26%2e4%2epdf --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align=left alt="application/pdf">wallflower specimen<br><a href="http://www.typophile.com/forums/messages/29/specimen_26_4-36768.pdf" target="_blank"><b>specimen.26.4.pdf</b></a> (503.8 k)</td></tr></table></center><!--/attachment--></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
