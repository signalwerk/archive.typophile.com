    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">thanks for the detailed comment ole. i rushed the last 30 minutes to make a few modifications before i got to go to work.  <BR>i worked on a,c,b,d,n and s. my study with different o shapes brought no new result. i reworked the basic o a bit, but i think the gap on top or on the left side don&#39;t fit to the other glyphs.  <BR> <BR>numerals will get my attention later! <BR> <BR><!--attachment: o_studie-36950.pdf*mime_pdf.gif*application/pdf*4.3**o+studie%2epdf --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align=left alt="application/pdf"><br><a href="http://www.typophile.com/forums/messages/29/o_studie-36950.pdf" target="_blank"><b>o studie.pdf</b></a> (4.3 k)</td></tr></table></center><!--/attachment--> <BR><!--attachment: wallflower28_5_04-36951.pdf*mime_pdf.gif*application/pdf*32.6**wallflower28%2e5%2e04%2epdf --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align=left alt="application/pdf"><br><a href="http://www.typophile.com/forums/messages/29/wallflower28_5_04-36951.pdf" target="_blank"><b>wallflower28.5.04.pdf</b></a> (32.6 k)</td></tr></table></center><!--/attachment--> <BR> <BR>cheers!</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
