  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey Forum, <BR> <BR>I&#39;m doing an identity-program for a firm specialized in speaks and radio-ads. <BR> <BR>They required a pay-off attached to the logo. <BR> <BR>Some opinions please... <BR> <BR>Thanks, <BR>/Henriko <BR> <BR> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/8189.jpg" alt="ImpactSpeak-mockup"></font></font></font></font>
