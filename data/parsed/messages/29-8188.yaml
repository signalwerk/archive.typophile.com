    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Although I do like the three column look on the card. I&#39;d also have to ask if you intend to ship a magnifying glass with your card? ;^&#41; Teasing you, but you might need to rethink that point size. Unless of course your card is larger than standard size? I agree with everyone else about the dot above the &#39;i&#39;, as well as Joe&#39;s comment about the dots. Perhaps there is anothe way, visually impactful&#40;?&#41;, to break the elements apart and jazz up the card a bit more?</font></font></font></font>
