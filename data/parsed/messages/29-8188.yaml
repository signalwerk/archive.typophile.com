    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I like it.  <BR> <BR>Nitpicks: <BR> <BR>the &#39;i&#39; just doesn&#39;t seem to fit. <BR> <BR>the change in size bothers me a bit too. maybe increase the light face a bit? <BR> <BR>I think the tagline face needs a bit more exploration. As it is now, it doesn&#39;t seem to be either similar enough or contrasting enough from the logotype face.</font></font></font></font>'
