    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Overall, I like it, especially the visual trademark, which looks dynamic and conveys the idea of communication... also the green &#40;at least as it looks via the web&#41; has a nice tint.  <BR>In terms of the typography, the contrast between impact and speak makes sense, of course, but it looks as if you not only changed the weight of the font but also the size, which is just a tad bit confusing. The change is not big enough to really make a satisfying contrast but noteable enough to make you wonder if there was some mistake. I&#39;d go for the same &#40;optical&#41; size.  <BR>The claim Hearing is believing looks as if it has no constructional context with the rest � is it in any proportion with the logo?  <BR>On the businesscard the 3-column-design, while clean and functional, looks a bit bland &#40;and just how small is the typo � it looks very small in proportion to the 55 x 85 standard size of a businesscard... but I might be wrong here.&#41; I think there could be a nicer way to solve that, I also miss a relationship between logo and text. If you HAVE columns, the lovo should correspond with the text &#40;i.e. the Speak-part of the logo might stand in the the second column with the adress and so on&#41;.  <BR>And last not least, the way the logo stands on the card doesn&#39;t look like a nice proportion -- it ifeels as if the logo has the same distance from the top and left hand side. It could perhaps look better if it was just a bit lower.  <BR> <BR>Well, you asked for critique, so I got all nitpicky - but all in all it&#39;s a nifty and functional design, I think. </font></font></font></font>
