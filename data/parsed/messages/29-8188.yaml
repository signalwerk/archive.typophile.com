    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey People, <BR> <BR>First of all thanks for the support here... <BR>Nitpickin&#39; is nice :o&#41; <BR> <BR>Generally I agree on that dot-subject - it&#39;s too noteable. <BR> <BR>HD&#62; The customer wanted a constrast between &#34;Impact&#34; and &#34;speak&#34; &#40;speak is actually the subbrand&#41; and therefore I decided to do the weight-change to seperate the words... I can see now that the effect is too weak. <BR> <BR>The tagline needs also to fit the proportions! <BR>Along with the business-card. <BR> <BR>Cheers, <BR>/Henriko</font></font></font></font>
