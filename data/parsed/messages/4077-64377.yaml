  html: '<font class="dontLookLikeCrap">Attention, New York Typophiles: there will be a TypeCon2005 planning meeting on Thursday, February 3. Be prepared for brainstorming and fun.  <BR> <BR>Meeting details:  <BR> <BR>Thursday, February 3, 2005 / 6-8pm  <BR>Type Directors Club <BR>127 West 25th Street, 8th floor <BR>New York, NY 10001  <BR>Tel 212-633-8943  <BR> <BR>Feel free to invite your friends and colleagues in the NYC metro area who might be interested. Everyone is welcome! Email me if you need more info about TypeCon2005 and to RSVP to the meeting. <BR> <BR><a href="mailto:info@typesociety.org">info@typesociety.org</a> / <a href="http://www.typecon.com" target="_blank">www.typecon.com</a> / <a href="http://www.typesociety.org" target="_blank">www.typesociety.org</a></font>'
