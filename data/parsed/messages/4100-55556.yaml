    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">1&#41; Is it for paragraphs or single lines? <BR>2&#41; How ugly can it be? <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font></font>
  - id: 85759
    user: 804
    date: 2004-12-09T20:18:00
    date_raw: Thursday, December 09, 2004 - 8:18 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I am setting text for a 12 page fiction piece. Back ground is dark blue, text is white. I have been using Gills Sans Book and Book Italic and have done all I can to save space with spacing, etc.. <BR>Here is screenshot of current layout. to answer your question-can it be ugly, well I already think Gill Sans is kind of ugly so I suppose this question is relative.  <BR>I bought a condensed version of Clearview today, thinking it may work but in is even less space saving than Gills Sans. <BR>I have tried to reduce size from 8pt to 7.6 and this only helps a tiny bit.</font></font></font></font></font></font></font></font></font></font>
  - id: 85776
    user: 909
    date: 2004-12-10T00:43:00
    date_raw: Friday, December 10, 2004 - 12:43 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Wow. Is the objective to get rid of all but the most dedicated readers who desperately want to read this? Make it as hard to read as possible? <BR> <BR>This text suffers from two problems for ease of reading extended text. It&#39;s reversed, and the point size is small. Combining those two problems along with making it twelve pages will make it very challenging indeed. It&#39;s not that readers can&#39;t read it, but rather that they won&#39;t want to bother. <BR> <BR>Unless of course the pages are only maybe 3&#34; x 4&#34; or something, and the total word count is only a couple of hundred words. Then it will be challenging and weird, but not totally crazy. <BR> <BR>Regards, <BR> <BR>T</font></font></font></font></font></font></font></font></font>
  - id: 85779
    user: errata-users
    date: 2004-12-10T01:56:00
