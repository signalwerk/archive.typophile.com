    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Ole, set one page, go back to the client and show them the horror of it and get them to spring for another signature or two. Its only paper. I agree with Thomas, don&#39;t KO that much copy, its a real no no for long text.</font></font></font></font></font></font></font>
  - id: 85837
    user: 1250
    date: 2004-12-10T10:31:00
    date_raw: Friday, December 10, 2004 - 10:31 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">How can you guys see any image? I&#39;m on IE on Windows and see nothing. <BR> <BR>Ole, although the white-on-navy scheme doesn&#39;t raise a big red flag in my view, the rest does seem hairy. Gill I actually find ugly too, but Clearview is certainly not space-saving, quite the contrary - it likes it airy. Try looking for a wide&#42; font with a large x-height, a bit dark, and I guess stylish - this last bit will be hard though. I guess you want a sans? I just read &#40;on the ATypI list&#41; that there&#39;s a special version of Fedra for use by Collins dictionaries; that would be both economical and attractive, but only the Serif might have that special cut - and it might be proprietary. <BR> <BR>&#42; This actually helps apparent size while saving line height &#40;by using a smaller point size&#41;. Unless you have very few linebreaks, then narrowness &#40;at a larger point size&#41; might make more sense. <BR> <BR>hhp</font></font></font></font></font></font>
