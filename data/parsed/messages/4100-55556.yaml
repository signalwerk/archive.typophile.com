    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">You could try a multiple master font and change the horizontal axis to suit. Myriad MM perhaps? <BR> <BR>Never used MM&#39;s myself. Anyone out there got anything good to say about them?</font></font></font></font></font></font></font></font>
