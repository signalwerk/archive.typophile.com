    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Ole <BR> <BR>I can&#39;t see any images either? But I&#39;ve followed this thread with rising interest. Seem a bit like &#34;Mission impossible&#34;, but you might find Stalemate suitable for this project? It was made to fit both for the web and in print, It&#39;s slightly condenced and therefor saving some space. Great care have been taken though, to perserve the &#34;white inner spaces&#34; of each letter. Also the big contrast in the weights &#40;light, medium and black&#41; could work nicely together sometimes. <BR> <BR>You&#39;ll find Stalemate here: <a href="http://www.macrhino.com" target="_blank">http://www.macrhino.com</a> <BR> <BR>Good luck anyway, cheers</font></font></font></font></font>'
