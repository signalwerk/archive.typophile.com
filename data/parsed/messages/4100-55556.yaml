  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I need to find a font, that is very space saving &#40;short ascenders and decenders&#41;. I imagine something like a font designed for phone books. Must be a Sans. any suggestions?</font></font></font></font></font></font></font></font></font></font></font></font>
