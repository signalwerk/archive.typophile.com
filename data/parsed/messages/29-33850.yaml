    html: <font class="dontLookLikeCrap">Thanks for the link. I wish I owned one of those books! Some very interesting things in the essay too &#40;hadn&#39;t read it before&#41;. What he says about Jenson is almost exactly what I was trying to do. I&#39;ve always admired the borders and layouts Morris did but have never really taken the time to study him &#40;which I will do while working on the font.&#41; <BR>  <BR>Going to make adjustments, and do a bit of work &#40;and reading&#41; before posting an update. If anyone has other comments on the lowercase, I&#39;m still open. I&#39;ll mostly be working on an uppercase and numbers for awhile, so I can work back and forth. <BR>Thanks again, <BR>Brian  <BR> <BR><a href="http://www.english.umd.edu/englfac/WPeterson/MFP/documents/9.html"> Aims in Founding</a></font>
