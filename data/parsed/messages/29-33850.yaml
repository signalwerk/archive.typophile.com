    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Couldn&#39;t upload.. had to link. <BR> <BR><a href="http://mywebpages.comcast.net/brian912/scan01.jpg"> scan 1</a> <BR> <BR><a href="http://mywebpages.comcast.net/brian912/scan02.jpg"> scan 2</a> <BR> <BR><a href="http://mywebpages.comcast.net/brian912/lowercase.gif"> scan 3</a> <BR> <BR>Some of my concerns include: the width of the m, the s and r &#40;too much?&#41;, the crossbars in the f and t, and the weight overall, but mention anything that you notice. Thanks again. <BR></font></font></font></font>'
