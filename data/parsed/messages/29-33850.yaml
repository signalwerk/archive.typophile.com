  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi, I started this off in the Script section the other day: <BR> <BR>&#40;see image 1 below&#41; <BR> <BR>It was supposed to have a renaissance feel, but I did some more reading, and came to the conclusion that it was too scripty, since a large part of renaissance type/printing was to move away from the handwritten process. The very beginning though, seemed to be an imitation of handwriting. For this font, I want that feeling to remain, but still look like a jump in the direction towards printing. So, I decided to add serifs to my calligraphy based letters. While it may look like Jenson or Centaur, I&#39;m hoping it has an even more calligraphic feel than both &#40;though slight&#41;. <BR> <BR>Earlier in the day I had this: <BR> <BR>&#40;see image 2 below&#41; <BR> <BR>I&#39;ve been comparing the letters to some renaissance pages in my design history books, and at this point, I&#39;ve worked my way up to this: <BR> <BR>&#40;see third image below&#41; <BR> <BR>Only a lowercase so far. My hope is that it will be good enough for short to medium length texts.  Please let me know what you think. <BR> <BR>Thanks!  <BR></font></font></font></font></font></font></font></font></font></font>'
