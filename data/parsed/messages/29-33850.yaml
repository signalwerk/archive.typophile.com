    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Bryan take a look at William Morri�s Golden Type and to his essay &#34;A Note by William Morris on His Aimsin Founding the Kelmscott Press&#34;&#40;just in case you haven�t done so before&#41;. Also you could find some pictures of his prints online&#42;. <BR> <BR>The &#34;m&#34; seems narrow and the &#34;r&#34; may be taking too much white space under the arm. The &#34;s&#34; is stable and well crafted for the style. I�m only bothered by the bar on the &#34;f&#34; it�s too mannered, and the &#34;h&#34; is too wide. I�m liking the taste of this but still needs much work. <BR> <BR>&#42;<a href="http://special.lib.gla.ac.uk/teach/privatepress/kelmscott.html" target="_blank">http://special.lib.gla.ac.uk/teach/privatepress/kelmscott.html</a></font></font></font>
