  html: '<font class="dontLookLikeCrap">NEWS RELEASE <BR> <BR>Ascender Corp to make popular Windows and Microsoft Office Fonts available to Designers &amp; Developers <BR> <BR>Chicago, Illinois -- April 11, 2005 -- Ascender Corp. today announced that they have entered into an agreement with Microsoft which enables Ascender to distribute Microsoft fonts, including the Windows Core Fonts, the Microsoft Web Fonts and the many multilingual fonts currently supplied by Microsoft. <BR> <BR>Under the agreement, Ascender may adapt the Microsoft fonts for software and hardware developers. Ascender also plans to offer the Microsoft Web Fonts in the PostScript and OpenType formats to corporate users, home users and design professionals. The Microsoft Web Fonts have not previously been available in the PostScript format. <BR> <BR>The Ascender Font Store website is being launched today to allow end users to purchase and download Microsoft fonts from <a href="http://www.ascenderfonts.com" target="_blank">http://www.ascenderfonts.com</a>. <BR> <BR>&#34;We have made a tremendous investment in both high quality Latin and multilingual fonts and are proud to be working with other industry leaders to bring the best technology solutions to customers,&#34; said David Kaefer, Microsoft&#39;s Director, Business Development. &#34;This is an example of how companies can collaborate, license their intellectual property and further innovation to support customer needs.&#34; <BR> <BR>&#34;Most of the fonts we are making available today were developed, in part, with Ascender. Microsoft has great faith in Ascender&#39;s ability to expertly satisfy the font needs of developers and end-users in any environment,&#34; said Lori Brownell, Director of Windows International. <BR> <BR>&#34;Microsoft&#39;s fonts are renowned for their quality, display legibility and extensive character sets. The availability of these fonts represents an incredible opportunity for hardware and software developers to enhance their products,&#34; said Ira Mirochnick, President of Ascender Corporation. &#34;By incorporating Microsoft fonts into their products, developers will address Windows compatibility and application issues, and will solve multilingual challenges.&#34; <BR> <BR>About Ascender Corp: <BR>Ascender Corporation is a Chicago-based company specializing in custom font development and multilingual Unicode compliant font solutions. The company&#39;s founders have been involved in the development of many of the most highly regarded fonts presently used in computers, phones and printers. Ascender has the expertise to solve complex font technology issues, the imagination to create font branding solutions, and the initiative to create value for our customers. <BR> <BR>Contact:  <BR>Bill Davis <BR>Ascender Corporation <BR>25 Northwest Point Blvd, Suite 975 <BR>Elk Grove Village, IL 60007 USA <BR>Phone: &#40;847&#41; 357 0730 ext. 10 <BR>Fax: &#40;847&#41; 357 0731 <BR>Email: <a href="mailto:press@ascendercorp.com">press@ascendercorp.com</a></font>'
