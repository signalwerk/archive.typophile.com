  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><a href="http://www.dorpdal.com/magazs.html">Druk</a> is published quarterly &#40;or thereabouts&#41; by <a href="http://www.dorpdal.com/">Dorp &amp; Dal</a> for <a href="http://www.fontshop.be">FontShop Benelux</a> and can be ordered from <a href="http://www.bruilvds.nl">Bruil &amp; van de Staaij</a>. Articles are in Dutch and English. It focuses more on type design than typography and includes reviews and samples of many new fonts from diverse foundries.</font></font></font></font>
