    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Adam, what are the common characters that appear adjacent to the l-slash? -- and are there characters which never do? This effects the design of the glyph, not just its kerning.</font></font></font></font></font></font></font>
  - id: 93121
    user: 1551
    date: 2005-02-11T04:38:00
    date_raw: Friday, February 11, 2005 - 4:38 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Nick, &#39;qi&#39; is used in pin-yin, the system of romanized Chinese. The q is used for the &#39;ch&#39; sound. This is used to input Chinese on computers, and also is the PRC preferred way to transliterate Chinese. FYI, qi &#40;pronounced chee&#41; means air, atmosphere, or spirit, and is also the term for the mysterious energy that is supposed to flow through the body and the landscape. It is a key term in both acupuncture and fung shui, as well as being part of many, many Chinese words.</font></font></font></font></font></font>
