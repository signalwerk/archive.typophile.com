    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I try it out at random on various brochures, magazines, ads, etc., that I&#39;ve worked on and have Quark/InDesign files for. Even Word! Recipes are good.  <BR> <BR>I&#39;ve also written my own text, to include the more infrequently used glyphs and marks. Caesar salad. <BR> <BR>&#34;five truffles offer sufficient flavo&#40;u&#41;r&#34; has all the f and f-ligature glyphs. Can&#39;t remember where I found that. <BR> <BR>Here is something I invented: <BR>537&#43;489=1026 <BR> <BR>...by trial and error. Luc Devroye subsequently calculated it mathematically -- there are over a hundred of these equations.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
