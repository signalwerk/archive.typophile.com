    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; Is there a reason why you guys are using <BR>&#62; texts written in just one language? <BR> <BR>The same reason you wrote that in that language?  :-&#41; <BR>But you already know, I do think we need a lot more. <BR> <BR>-- <BR> <BR>BTW, if you want to find words with a certain digraph, check out R Eckler&#39;s &#34;Making the Alphabet Dance&#34;, pp 65-68. William&#39;s &#34;Iraqi&#34; is better than what Eckler has &#40;&#34;Qiviut&#34;&#41; but generally he lists the most frequent word &#40;or at least a highly frequent word&#41; with that pair - quite useful. <BR> <BR>hhp</font></font>
  - id: 93169
    user: 4406
