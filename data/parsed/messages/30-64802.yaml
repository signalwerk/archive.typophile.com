    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;I take it your mysterious sum is a way of using digits 0-9. <BR> <BR>Right. And like a word pangram, it is not an arbitrary sequence, but has a proper syntax. &#40;Although it really doesn&#39;t &#34;mean&#34; anything, but then neither does &#34;Waltz nymph...&#34;&#41;</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 92621
    user: 5749
    date: 2005-02-08T04:03:00
    date_raw: Tuesday, February 08, 2005 - 4:03 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Ah, that&#39;s why I use &#34;Foxy diva Jennifer Lopez wasn&#39;t baking my quiche&#34; instead. <BR> <BR>All we need now is a text generator that spews out several paragraphs including the 676 odd kerning pairs. Not that&#39;d you&#39;d ever kern such an odd combination of less commonly used letters, such as &#34;Kzquex&#34;. Unless it&#39;s a comic book font and Kzquex is leader of the Yvgionz from the Planet Xizql VII!</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 92627
    user: 2021
    date: 2005-02-08T04:54:00
    date_raw: Tuesday, February 08, 2005 - 4:54 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Nonetheless, I never cease to be amazed at the &#34;unusual&#34; character combinations one comes accross in everday words. <BR> <BR>&#34;savvy&#34; and &#34;keyword&#34; really test the fit of one&#39;s &#34;v&#34; glyphs. <BR> <BR>Yv is a common combo in French, as well as amongst the Yvgionz. <BR> <BR>Don&#39;t forget Steve Yzerman, even though the hockey season is stranded. <BR> <BR>Recently, it&#39;s been interesting to see which newspaper/magazine faces have kerned &#34;Ts&#34;.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
