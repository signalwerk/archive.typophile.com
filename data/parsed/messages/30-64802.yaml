    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Checking all possible combinations&#42; &#40;manually&#41; is one thing, setting up elaborate sample texts to do that is another, and actually putting in kerning for everything yet another. <BR> <BR>&#42; Except things that should be <i>totally</i> handled by the default spacing &#40;in fact during the determination of the base spacing&#41;, like &#34;no&#34;. <BR> <BR>Andreas: Spacing your fonts intelligently to reduce kerning is good practice&#42;, but trying to avoid kerning outright is a bit... quixotic! Unless there&#39;s a peculiar technical -or user- limitation. <BR> <BR>&#42; Except for the rare case where leaning heavily on kerning is required, like for the highest quality Armenian setting. <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
