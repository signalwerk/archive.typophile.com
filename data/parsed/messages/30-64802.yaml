    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I wonder what the word is with qi in it? <BR> <BR>The list could probably be reduced to single figures if you merged and purged with a database of all the words -- including proper names -- that occur in a typical English-language newspaper over the course of a year.</font></font></font></font></font></font></font></font>
