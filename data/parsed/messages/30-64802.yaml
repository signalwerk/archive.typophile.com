    date_raw: Thursday, February 10, 2005 - 9:51 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">In case anyone cares, here are the 118 lowercase digraphs &#40;out of 676 total possible&#41; that do not occur in the English language &#40;or at least /usr/share/dict/words distributed with Red Hat Linux 9.0, which in this day and age is basically the same thing&#41;: <BR> <BR>bq bx bz cf cj cp cv cw cx dx fb fj fp fq fv fx fz gc gq gv gx hj hx hz jb jc jd jf jg jh jj jl jm jn jp jq jr js jt jv jw jx jy jz kq kx kz lx mg mj mx mz pq pv px qa qb qc qd qe qf qg qh qj qk ql qm qn qo qp qq qr qs qt qv qw qx qy qz sx tj tq tx vb vc vf vg vh vj vk vm vn vp vq vt vv vw vx vz wj wq wv ww wx wz xd xj xk xr xs xz yy zf zh zj zn zq zx <BR> <BR>It&#39;s particularly gratifying to see &#39;hz&#39; in the list :<a href="http://and.why.isnt.fjord.in.the.dictionary/"></a>&#41;</font></font></font></font></font></font></font></font></font></font></font>'
  - id: 93097
    user: 909
    date: 2005-02-10T22:17:00
    date_raw: Thursday, February 10, 2005 - 10:17 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hmmm. Is &#34;fjord&#34; &#40;fj&#41; not an English word? I find that rather &#34;offputting&#34; &#40;fp&#41;. I&#39;m not much of a football fan, but &#34;halfback&#34; &#40;fb&#41; is still a word in English. Finally, I work with somebody named &#34;Zhao&#34; &#40;zh&#41;. <BR> <BR>The other key consideration is that very few fonts we make will only have to set English. For most fonts, it&#39;s very anglo-centric to do kerning and such as if that were the case. <BR> <BR>Cheers, <BR> <BR>T</font></font></font></font></font></font></font></font></font></font>
  - id: 93102
    user: 4406
    date: 2005-02-10T23:31:00
    date_raw: Thursday, February 10, 2005 - 11:31 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thomas: yeah, that wordlist certainly has some gaps; fj popped out at me too. Good catch on the fp and fb! <BR> <BR>Zhao wouldn&#39;t have qualified because these are lc kerns only, but there is always Brezhnev. <BR> <BR>Part of my point in posting this is to show that the coverage of kern pairs by English words is in fact quite spotty--even just counting lc pairs, you&#39;re missing almost a fifth of the possible combinations. Once you add in uppercase, you get four times the number of digraphs that need coverage, and the rising popularity of <a href="http://en.wikipedia.org/wiki/CamelCase">CamelCase</a> makes it even more likely to actually run into those. <BR> <BR>So yeah, I&#39;m going to make sure to cover all possible digraphs when I actually get around to releasing my fonts, not just the ones that seem likely in English.</font></font></font></font></font></font></font></font></font>'
  - id: 93118
    user: 2021
