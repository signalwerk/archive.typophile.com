    date_raw: Friday, February 11, 2005 - 10:32 am
    votes: null
    html: <font class="dontLookLikeCrap">The two qi words in /usr/share/dict/words &#40;on my Mac&#41; are Iraqi and qintar. <BR> <BR>I&#39;m interested enough in this to make an all-digraph generator. My gut feeling is that making it look something like normal text will make it easier to see spacing problems than, say, a big table. <BR> <BR>What should be the goals for the resulting text? Obviously, containing all digraphs is the most important, but what other criteria are there? Should it try to hit real English words when possible? Should letter frequencies be totally uniform, or closer to real distributions?</font>
