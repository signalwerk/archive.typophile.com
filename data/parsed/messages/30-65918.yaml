  - id: 94384
    user: 1250
    date: 2005-02-25T15:21:00
    date_raw: Friday, February 25, 2005 - 3:21 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey, Raph, killer. <BR> <BR>1&#41; Arial &#40;which is a Helvetica clone&#41; has an Arabic &#40;at least in my version of Windows, XP-Home&#41;, although looking at it now it doesn&#39;t look very Helvetica at all... Which however does mean it looks more Arabic and more readable.  :-&#41; <BR>2&#41; There&#39;s a font called Arial-Unicode: it covers gobs of codepages &#40;it&#39;s about 30Mb&#41; but some of its parts -like the Armenian- are quite lousy, and I don&#39;t know if it&#39;s even generally available...  :-/ <BR> <BR>Here&#39;s an idea: look into Abbar&#39;s <i>Univers</i> Arabic &#40;featured in an issue of Eye last year&#41; which will probably be sufficiently Helvetica for you. But really, there <i>must</i> be a &#34;decent&#34; Arabic Helvetica somewhere - it&#39;s a face that has infested virtually every script, why not Arabic? <BR> <BR>hhp</font></font></font></font></font></font>'
