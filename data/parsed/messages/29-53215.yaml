  - id: 82641
    user: 1474
    date: 2004-11-12T22:07:00
    date_raw: Friday, November 12, 2004 - 10:07 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thank you for your comments, okty, <BR> <BR>You are absolutely correct about the <i>S</i>, but, for some reason, I feel motivated to incjude a <i>J</i> whose bowl descends below the baseline &#40;similar to some more-traditional faces&#41;. You are also correct in suggesting a few words would be more helpful... certainly a more accurate assessment of a design�s value can be made from such a sample as opposed to the arbitrary collection of glyphs that I posted. However, at this early stage &#40;pencil roughs&#41;, it may be a more productive use of time to proceed to some vector glyphs and display those in some short phrases. <BR> <BR>I hope to prepare  such a sample very soon and hope that you might find time to give them a quick look. <BR> <BR>Thanks again, <BR>Dana</font></font></font></font></font></font></font></font></font>
  - id: 82642
    user: 1250
    date: 2004-11-12T22:13:00
    date_raw: Friday, November 12, 2004 - 10:13 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Dana, apparently you succeeded in posting, but for some reason I for one didn&#39;t get a copy of the original message! <BR> <BR>As you say, this is very rough. Which makes it not <i>impossible</i> to evaluate, but requires some assumptions on our end of what your <i>intent</i> actually is, I mean [even] at the formal level. For example we can only guess whether you intend to make the final result smooth or rough, irregular or consistent, etc. <BR> <BR>One thing I would guess is that you&#39;re going for Modern &#40;uniform&#41; widths on the caps &#40;as opposed to &#34;Classical&#34;&#41;. If this is true, then I would say that the &#34;C&#34;, &#34;H&#34;, &#34;L&#34;, &#34;M&#34;, &#34;T&#34; and &#34;Y&#34; are too narrow, while &#34;S&#34; is too wide. In the lc, compare the &#34;s&#34; and &#34;t&#34;: these are characters that should [generally] be more harmonious in widths. <BR> <BR>Trying to figure out what kind of finish &#40;as opposed to structure - which you seem to mostly have already&#41; would make this design look its best, it seems to me that something with smooth, disciplined, contrasty curves -think of Peignot- would give it a character most likely to end up being used by numerous people. <BR> <BR>hhp</font></font></font></font></font></font></font></font>'
