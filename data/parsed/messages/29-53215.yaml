    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">So here are some vector glyphs that represent one small degree of advancement beyond the pencil roughs. <BR> <BR>The intent is for a design that could possibly be used in packaging or &#40;maybe&#41; in ad work... but I seriously doubt that the rather impractical horizontal scale would be appropriate for editorial uses. <BR> <BR>Thanks, hhp, for your comments... while the �H� is wider now, the �C, L, M, T and Y� remain underfed &#40;and some of them too embarassed to show themselves&#41;. As far as modern/uniform vs. classical goes... <i>I dunno</i>. This effort has been much more gut-prompted and spontaneous than a result of a careful intellectual consideration. <BR> <BR>The working name <i>berusad �lg</i> means &#40;I think&#41; �inebriated moose� in Swedish; and is prompted by a recent news story about mischief caused by some misguided moose eating fermented windfall apples in Sweden. <BR> <BR>thanks again, <BR>Dana <BR><img src="http://www.typophile.com/forums/messages/29/53541.gif" alt="berusad �lg"></font></font></font></font></font>
