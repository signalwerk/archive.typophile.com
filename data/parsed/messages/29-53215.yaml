  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Over the past few weeks I�ve enjoyed and moderators/participants have endured my quite variable luck/skill at posting images with my messages. So... with hopes that this will be a message in which my luck improves &#40;or at least a moderator can delete a potentially embarassing string of image-less messages&#41;, I�d like to try to share some sketches of a face on which I�ve been working for a while. Please note: they are of the lowest possible fidelity that <i>dixon-ticonderoga on cheap copy paper, scanned with cracker-jacks prize scanner</i> can produce. At this early stage, I�m hoping to learn whether it�s too similar to an existing typeface, or if the general style is worth &#40;according to your expert eyes&#41; pursuing. <BR> <BR>with thanks and hopes for a successful upload, <BR>Dana <BR> <BR><img src="http://www.typophile.com/forums/messages/29/53216.gif" alt="dana face"></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
