    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Ok, so this are the first prototypes. I sketched a couple of the non lettered centaur variations and decided to stick with the monogram centaur. <BR> <BR> <BR>This is the centaur. It is a bit darker than the sketch was. There are two suggested variations of it but I think it still works better plain as it is. <BR><img src="http://www.typophile.com/forums/messages/29/28195.gif" alt="centauro"> <BR> <BR> <BR>This is the type, advice on it is the most wellcome. It looks a little odd and I�m not getting a very good integration between the letters. <BR><img src="http://www.typophile.com/forums/messages/29/28196.gif" alt=""> <BR> <BR> <BR>These are a couple of type and logo integrations, I want the centaur to have lots of space to stand out so I�m favouring the vertical setting. <BR><img src="http://www.typophile.com/forums/messages/29/28197.gif" alt=""> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/28198.gif" alt=""> <BR> <BR> <BR>Finally these are my color choices, the red is pantone 193 coated and the gray blue is pantone 5497 coated. Both of these colors are different enough from the main local design competitors, as far as I know no one uses red, which I think makes a great emphasis but maybe the gray blue could bring more convenient connotations. <BR><img src="http://www.typophile.com/forums/messages/29/28199.jpg" alt=""></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
