    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks for all the input. I forgot to post which was the final result of this work, so this is it: <BR> <BR><img src="http://www.typophile.com/forums/messages/29/35050.gif" alt=""> <BR> <BR>For the final logo I took your suggestions and changed the type, after several tests I decided to scan some DTL Nobel glyphs from a magazine and traced them, they worked very well, I like this face very much &#40;hope not to end in jail for doing this&#41;. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/35051.gif" alt=""> <BR> <BR>This is the card which is silkscreened with polycat on front &#40;a very thick ink layer&#41; and something else on the reverse. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/35052.gif" alt=""> <BR> <BR>For the text face I chose Quadraat Sans which fortunately I got just on the last minute before my delivery to the print shop. Quadraat Sans fits very well with Nobel &#40;being both from the same designer&#41; and gives my documents a very nice bussiness class look. <BR> <BR>I made red silkscreened folders with the reversed application of the logo as well as white cover sheets with the folder�s application in red and I�m looking for some cheap cd cards to put my portfolio in. I�ll be building other applications on the fly but I deffinitively discarded doing a shirt and a pin, maybe I�ll make a mug.</font></font></font></font></font></font></font>'
