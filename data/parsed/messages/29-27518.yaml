  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I�m designing the brand for my freelance work and would like to have some comments from the typophle erudite community. <BR> <BR>I�m aiming for the small bussineses of the local market &#40;Celaya and i�ts surrounding towns&#41; with about 600,000 in population with commercial and industrial activity. There are many designers in town working on small studies whose main offer is creativity and price so I intend to sell the &#34;Design by Objectives&#34; positioning. I am willing to do most of the works I get by subcontracting things I�m not good for like illustration and photography, on the future I would like to do more publishing work but there is not much market for it in here.  <BR> <BR>NAME <BR>I decided to avoid symbolic names because I want to be directly related to my work so I�m using &#34;Mu�oz&#34; alone, maybe I�ll have to add a label to describe the &#34;Industry&#34; and positioning I�m at as I found really hard to signify Design. <BR> <BR>LOGO <BR>The first thing I made was the type on which I�m willing to connotate power, graphics and contundence so I chose  geometric, lineal, abstract, bold and angular. After I chose the bow and arrow as symbols to metaphorize the positioning as if  I were an archer with very good aim to hit targets, so I tried different options to integrate this to the name in graphic congruence: <BR> <BR>This is the logotype <BR><img src="http://www.typophile.com/forums/messages/29/27519.gif" alt=""> <BR> <BR>This is the only succesful bow, arrow and type integration I achieved <BR><img src="http://www.typophile.com/forums/messages/29/27520.gif" alt=""> <BR> <BR>This is my monogram on a centaur. &#40;Hector Mu�oz Huerta&#41;Can you see it? <BR><img src="http://www.typophile.com/forums/messages/29/27521.gif" alt=""> <BR> <BR>This is the centaur with out letters. <BR><img src="http://www.typophile.com/forums/messages/29/27522.gif" alt=""> <BR> <BR>This is the most abstract and symbolic I could get. <BR><img src="http://www.typophile.com/forums/messages/29/27523.gif" alt=""></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
