    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi H�ctor, <BR> <BR>This is really fun. I have two suggestions for you: <BR>1. The head/eye. Right now the circle is exactly touching the edge of the eye. This is distracting to me. Try overlapping them a little more. <BR>2. My preference is the type and icon seperate from each other &#40;play with the proportions one to the other&#41;. In this setting I think your spikey capital M is out of place. I think it detracts from the icon, is too tall, and not in keeping with the character of the font. I&#39;d suggest maybe using a slightly taller version of the n and add the extra branch. <BR> <BR>Ok, one other minor thing. Try the tilde as a little lightning strike nestled above the n &#40;more like the z&#41;. <BR> <BR>Very nice indeed. <BR>Well done. <BR> <BR>Randy</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
