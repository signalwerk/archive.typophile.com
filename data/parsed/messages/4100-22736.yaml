    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Kent, thanks for the great insights. Funny how something so subtle can be so striking when your eye is tuned to see it. Also, thanks for the images. &#40;You posted what I couldn&#39;t.&#41; Also, you&#39;ve confirmed my suspicion about News Gothic versus a broader interpretation of Benton&#39;s body of work... &#40;Who among us now will be the subject of future designers&#39; tinkering.&#41; <BR> <BR>Can I trouble you for a posting of the roman/regular weight of each. &#40;Hamburgevons or handgloves or whatever.&#41; &#40;Pretty please with a tilde on top?&#41; <BR> <BR>Oh, and Stephen, of course not. =&#41;</font></font></font></font></font></font>
