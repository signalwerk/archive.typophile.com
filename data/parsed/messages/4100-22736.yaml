    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>The first batch of FB Benton &#40;then Benton Gothic&#41; also had an italic. More of a tuned oblique really, nothing like the image above.</i> <BR> <BR>The Heidelberg Gothic italic is a strange hybrid. Erik Spiekermann was art directing the project as part of his overall design for Heidelberg Drucksmachinen. My initial italic was a bit more &#39;normal&#39; -- e.g. fully cursive e -- but Erik wanted it more idiosyncratic. One of the nice things about this project is that the typeface is <i>always</i> incredibly well printed <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0></font></font></font></font></font>
