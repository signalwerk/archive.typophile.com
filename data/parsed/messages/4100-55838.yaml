    html: <font class="dontLookLikeCrap">Personally I&#39;d darken the column for the amount and drop the title all together. Without seeing it it&#39;s difficult to say, but given the subject of the table &#40;an invoice&#41; provided the emphasis is placed on the column it&#39;s unlikely the reader would misunderstand the figures were the cost. <BR> <BR>If you are worried about that then I&#39;d suggest you seperate the cost into two columns &#40;second one for the decimals&#41; then right align the cost column, left align the decimals next to it, and right align the title against the right edge of the cost column.</font>
