  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;m doing a form with a few columns.. an invoice. The columns include things like Date, a Services description, and Time spent. These look nice left-aligned, but then I get to the Amount column. If I left align everything, the decimals won&#39;t align. Some figures are just 20.00, others are 200.00, so if I align the decimals, I can&#39;t left-align it. Anyone have suggestions? Right now I&#39;m just left aligning &#34;Amount&#34; on the longest figure, with the decimals aligning. But this makes Amount look centered, so I&#39;m wondering what my alternatives are. <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> Thanks!</font></font>
