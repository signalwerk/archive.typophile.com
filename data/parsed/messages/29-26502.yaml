    votes: null
    html: '<font class="dontLookLikeCrap">&#34;Bending the black&#34;: I&#39;ve concluded that -unlike in a &#34;dumb&#34; automatic algorithm- shades of gray don&#39;t ideally work as in a continuum - different shades have qualitatively different functions. A medium gray &#40;like your 153&#41; works in an expected way perhaps &#40;creating the illusion of part of a pixel&#41;, but a dark gray is much more &#34;subvisible&#34; - it creates a hint of the black softening up, usually in &#34;preparation&#34; of an adjacent medium gray. As for light grays, try to avoid them &#40;since they create the most blur&#41;, but sometimes they still become the whole point of the exercise, oddly enough. Hard to explain... <BR> <BR>hhp <BR></font>'
