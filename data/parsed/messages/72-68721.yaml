  html: '<font class="dontLookLikeCrap">For Immediate Release. <BR> <BR>April 3rd, 2005 Buffalo, NY: <BR> <BR>Lanston Type Company &#40;LTC&#41;, P22 type foundry&#39;s newest division, announces the release of 32 remastered classic type faces as Lanston Collection B. <BR> <BR>The new Lanston releases feature re-mastered fonts of preeminent type designer Frederic Goudy including Californian, Village #2, Goudy Oldstyle, Goudy HeavyFace, Deedene Bold, and Goudy Initials. Also included are fonts designed by Sol Hess and Bruce Rogers. <BR> <BR>Frederic Goudy was Art Director of Lanston Monotype Company from 1920-1947. He is credited for over 100 classic faces, 30 of which were designed for Lanston.  Highlights for Lanston Collection B are the striking roman faces, LTC Californian and LTC Village #2. <BR> <BR>LTC Californian was newly digitized using the original patterns from which the metal type was made as direct reference. These artifacts are the last known surviving patterns made by Frederic Goudy. Californian was originally made for the University of California at Berkeley. This digitization remains as true as possible to the original design. <BR> <BR>Lanston�s Village #2 is another authentic digital version of this much loved Goudy typeface. Originally digitized in 1987, the Lanston Type Library�s source for its production were lightly inked proofs of the brass patterns. These are the same master patterns that were used to cut the Lanston Monotype� Machine Companies composition punches on the Benton Pantograph. It exudes warmth and charm of the period and is a must for any book typographer.  Special features in the remastered OpenType versions of Village #2  and Goudy Oldstyle include the option for two different lengths of descenders as originally offered by Lanston in metal in the 1920s. <BR> <BR>Goudy Initials &#40;also known as Cloister initials&#41; were originally offered in digital form by Lanston as single EPS files due to their complex designs. The new version combines all 26 embellished capitals optimized as a single font. <BR> <BR>Other fonts in Collection B include LTC Octic Gothic, a quaint yet contemporary geometric font, LTC Swing Bold, LTC Jefferson Gothic, LTC Fleurons Rogers and 2 other sets of LTC ornaments which evoke the period of the early 20th century. In all, Lanston Collection B contains 12 Titles in 32 styles &#43; 12 OpenType fonts. The fonts can be purchased separately or in one collection &#40;B&#41;. <BR> <BR>For more detailed information: <BR><a href="http://www.p22.com/Lanston" target="_blank">http://www.p22.com/Lanston</a> <BR> <BR>Additional Lanston links: <BR><a href="http://www.p22.com/lanston/products/animalia.html" target="_blank">http://www.p22.com/lanston/products/animalia.html</a> <BR><a href="http://www.p22.com/lanston/products/californian.html" target="_blank">http://www.p22.com/lanston/products/californian.html</a> <BR><a href="http://www.p22.com/lanston/products/heavyface.html" target="_blank">http://www.p22.com/lanston/products/heavyface.html</a> <BR><a href="http://www.p22.com/lanston/products/goudyinitials.html" target="_blank">http://www.p22.com/lanston/products/goudyinitials.html</a> <BR><a href="http://www.p22.com/lanston/products/goudyoldstyle.html" target="_blank">http://www.p22.com/lanston/products/goudyoldstyle.html</a> <BR><a href="http://www.p22.com/lanston/products/swingbold.html" target="_blank">http://www.p22.com/lanston/products/swingbold.html</a> <BR><a href="http://www.p22.com/lanston/products/deepdenebold.html" target="_blank">http://www.p22.com/lanston/products/deepdenebold.html</a> <BR><a href="http://www.p22.com/lanston/products/Rogers.html" target="_blank">http://www.p22.com/lanston/products/Rogers.html</a> <BR><a href="http://www.p22.com/lanston/products/Village2.html" target="_blank">http://www.p22.com/lanston/products/Village2.html</a> <BR><a href="http://www.p22.com/lanston/products/jeffersongothic.html" target="_blank">http://www.p22.com/lanston/products/jeffersongothic.html</a> <BR><a href="http://www.p22.com/lanston/products/octicgothic.html" target="_blank">http://www.p22.com/lanston/products/octicgothic.html</a> <BR><a href="http://www.p22.com/lanston/products/ornaments1.html" target="_blank">http://www.p22.com/lanston/products/ornaments1.html</a> <BR>----------------------------- <BR>P22 type foundry, Inc. <BR>  International House of Fonts <BR>  Lanston-P22 <BR>  Sherwood Type <BR>PO Box 770 <BR>Buffalo, NY 14213 <BR><a href="http://www.p22.com" target="_blank">http://www.p22.com</a> <BR>Phone: 716-885-4490 <BR>Fax: 716-885-4482 <BR>-----------------------------</font>'
