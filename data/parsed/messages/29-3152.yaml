    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Hm, I like the top-right one &#40;without the gradient&#41; and the top one of the bottom pair.  I think that grey colour looks great with the green, but I don&#39;t know if you can work it into those two or not. <BR> <BR>I like both fonts...I don&#39;t know if one is any better than the other, but they do have slightly different feels, and you&#39;ll have to evaluate them along those lines. <BR> <BR>Paul D </font></font></font></font>
