    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> ymmy. I like the horatio. Simply because it gives your mark more of it&#39;s own look, makes it more unique. This grl likes the flat color as opposed to the blends. I like the top left one the best, but with the horatio instead of avant garde. &#40;or&#41; I like the middle one, sans blend, sans white stroke, but &#34;share&#34; in gray. I&#39;d flop the shape so the speak balloon point &#40;thingy, sheesh!&#41; is more of an entry point as opposed to an exit point. &#40;&#40;what a muck of a crit!&#41;&#41; Nice </font></font></font></font>
