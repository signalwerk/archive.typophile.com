    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Thanks for the feedback guys. <BR>The client has gone for the safe choice and picked Avante Garde. They also went for the logo within the large word bubble. <BR> <BR>Unfortunately they weren&#39;t big fans of the color scheme, so I have to do some exploring in that direction. The l/c &#34;s&#34; in Avante Garde is still really bothering me so I think I will play with it a little. Does anyone else agree that the &#34;s&#34; looks a little on the thin side? <BR> <BR>I don&#39;t think the logo will be reproduced at exceedingly small sizes so I&#39;m not too worried about the &#34;e&#34; closing up, but thats a great point Christopher. </font></font></font></font>
