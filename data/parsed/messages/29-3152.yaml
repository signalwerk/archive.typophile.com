  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi All, <BR> <BR>I&#39;m developing a logo for a Marketing Community website called marketshare. The logo will be mainly for website use, but may appear on the back of textbooks. Type is set in Horatio EF, ITC Avante Garde Gothic and the exclamation point is set in Albers-ArchiType. <BR> <BR>I&#39;m worried that the Avante Garde &#40;logos on the left &amp; bottom&#41; is a little too business and not enough fun. I also find the &#34;s&#34; to be a little condenced compared to the rest of the letters. <BR> <BR>I like the logos using Horatio &#40;logos on the right&#41; but I&#39;m wondering if they look a little too mid 70&#39;s retro. <BR> <BR>Any comments would be appreciated. <BR> <BR>Thanks! <BR><IMG SRC="http://www.typophile.com/forums/messages/29/3153.gif" ALT="marketshare logos"></font></font></font></font>
