    date_raw: Monday, February 23, 2004 - 1:55 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Kenny.  A nice and simple design. What would improve it? <BR>I think it is heavy in the top corners and bottom center. As you properly already know verticals and horizontals will not look the same even if the are exactly the same width, so optical adjustments would improve this. If this is to be used in print &#40;which i assume it is&#41; opening up corners for bleed conpensation would be a good idea. See .jpg for improvement suggestions.<img src="http://www.typophile.com/forums/messages/29/27111.jpg" alt="logo improvements"></font></font></font>
