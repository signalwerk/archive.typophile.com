    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Ole&#39;s right. <BR> <BR>BTW, I&#39;m thinking this is <i>screaming</i> for a &#34;d&#34; and &#34;b&#34; to be made into the facing pages. It&#39;s a shame the two letters aren&#39;t flipped - but see what you can do with that - it&#39;s a natural. Maybe the ascenders can be made into the spine of the book. <BR> <BR>The Helvetica/VAG Rounded though is great, especially if it&#39;s supposed to be a publisher of children&#39;s books. <BR> <BR>hhp <BR></font></font>
