    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">For what size is this version designed for? If it gets much smaller <BR>the type will have to be much larger. Remember that logos are <BR>most often printed smaller than one inch. If that logo appears <BR>on the binding of a book no one will see the text. <BR> <BR>I think the symbol is excellent and I actually think most sans <BR>typefaces will work well with it. Those with round terminals do <BR>fit very well with that image. Have a look at Fountain&#39;s <a href="http://www.fountain.nu/catalogue/imbisspackage.asp" target="_blank">Imbiss Package</a>.</font></font></font></font></font>
  - id: 49278
    user: 804
