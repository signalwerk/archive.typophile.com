  html: 'F O R   I M M E D I A T E   R E L E A S E <BR> <BR>Typeco.com goes live. <BR> <BR>What? Another type foundry. Well, not exactly. Typeco is a typographic <BR>services  and solutions company with plans to become an electronic type <BR>foundry for the designs of the principal, James Grieshaber. Services offered <BR>by Typeco include Font Identification, Signature fonts, Logo fonts and <BR>Handwriting fonts. Solutions include Custom designed typefaces, Logos and <BR>Trademarks, Branding and Graphic Design. <BR> <BR>James Grieshaber has been active in the typographic community for several <BR>years now. Grieshaber most recently was on staff of P22 Type Foundry and <BR>helped establish International House of Fonts. He has been honoured with an <BR>award of Excellence in Type Design from Association Typographique <BR>International &#40;ATypI&#41; for his Gothic Gothic type design. He has now struck <BR>out on his own to offer his services to those in typographic need and <BR>showcase his typographic vision. <BR> <BR>Contact info: <BR>Typeco <BR>PO Box 10661 <BR>Rochester, NY 14610 <BR>Phone: 585.230.1674 <BR>Email: <A HREF="mailto:contact@typeco.com">contact@typeco.com</A> <BR>Web: <A HREF="http://www.typeco.com" TARGET="_top">http://www.typeco.com</A>'
