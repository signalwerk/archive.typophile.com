  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Does anybody have any sources for the theory behind exponential or &#40; or interpolation curve&#41; font weight scaling?  <BR> <BR>Does anybody use mathematical formulas for determining a weights up or down? <BR> <BR>Does anybody have anything good to say about linear font scaling?  <BR> <BR>Do you think that theories can&#39;t be trusted &amp; only the eye can tell?  <BR> <BR>What am I talking about? Go to <a href="http://www.lucasfonts.com/" target="_blank">http://www.lucasfonts.com/</a> and follow the links to &#39;font families&#39; &amp; &#39;the sans&#39; &amp; then &#39;info &amp; samples&#39; &amp; then &#39;interpolation curve&#39;. He even offers some formulas for making weights.  <BR> <BR>What do you think is the limits are of the genuinely useful weight range? I got thinking about this because I was reading &#40;in <a href="http://www.daidala.com?" target="_blank">www.daidala.com?</a>&#41; that Jean-Fran�ois Porchez seemed to think the extreme light &amp; black weights of the The Sans series went to far &#40; I am paraphrasing big time &#41; and went beyond the weights that are useful. What do you think? <BR> <BR>Is anybody making new font weights using python scripts for in Font Lab? <BR> <BR>Lastly, what fonts do you think get their mediums, bolds, &amp; extra bolds etc just right for you? <BR> <BR>Thanks!</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
