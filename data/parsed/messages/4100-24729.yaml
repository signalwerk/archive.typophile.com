    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Well, without try change original Luc[as] view about his own theories: I have the feeling that the interpolation theory he published in 1995 &#40;I remember clearly when he gave it to me during ATypI Barcelona&#41; on his Thesis specimen is more a non serious thing and nice illustration than anything else. It need to be in the context of the specimen, nothing more and that case, the theory illustration work. <BR> <BR>Building mathematic methods and systems for typeface design is a really a funny idea! Sound building mathematic theories for Jasper Jones projections &#40;positions in spaces&#41; or Picasso drawings &#40;relationship of the sizes of eyes and mouths&#41;. <BR> <BR></font></font></font></font></font>'
