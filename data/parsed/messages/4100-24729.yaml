    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I share Eric&#39;s observations on creating accurate interpolations between Extra Thin and Black.  <BR> <BR>For that reason, I usually created the Xtra Thin and the Black separately and use less extreme masters for any interpolation. This started by creating heavy weights that were ultimately not heavy enough, and using extrapolation to create the beginnings of a black weight. <BR> <BR>This extrapolation also helped create very light weights. I say helped because extrpolated outlines need a lot of additional labor to look good.</font></font></font>
