    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">JFP&#39;s post with Anisette sums up the reality of this <BR>situation. The Black is usually very different than <BR>the thin. For instance, compare the shared stroke <BR>weights on a black to that of a thin. It&#39;s common to <BR>slightly reduce the stroke weight on letters like e and a  <BR>in the black but not in the thin. These irregularties will <BR>in turn create less than perfect interpolations. This is  <BR>where the labor comes in! I recomend coffee <BR>in the mornings followed by green tea in the afternoons <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> <BR> <BR>Recently I&#39;ve been using MM to create my intermediate <BR>weights. I&#39;ve had much better results than just a Blend. <BR>I&#39;m not actually making MM fonts, just using MM to  <BR>define the weights.</font></font></font></font>
