    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hrant, Where was James&#39; post? The one I referred to earlier? <BR> <BR>Jean Porchez, thanks for looking in!  <BR> <BR>I hope you have time to look closer at my arguement later. If you have anything else to say I would love to hear it - especially anything theoretical in nature, even it turns out that you, like James, reject outright using any sort of theory or math to design fonts. <BR> <BR>Actually, I think I can prove my basic point about curves in general if only because DeGroot clearly used a formula to make some &#42;really&#42; nice fonts &amp; clearly didn&#39;t use some sort of crude global process as James assumed I was inquiring about.  <BR> <BR>Maybe, if I am fortunate, I can find a better curve than De Groot did &amp; show how an improved curve can work to make something really nice &amp; really functional.  <BR> <BR>Actually, I think finding a better curve will probably be easy.  Applying that curve in a sensitive, inteligent &amp; inspired manner will probably be much, much harder. <BR> <BR>Using a formula for a major element such as acenders will probably be straightforeward. A modified set of formulas could probably be developed to handle many other aspects of develping a bold &#40; or light&#41; face. Maybe a different curve can or should be invented for altering each major aspect of a font. I don&#39;t know if I will do it - but that it is possible to do &amp; that some mathematical process&#39; can help a typographer&#39;s initial process&#39; both seem obvious to me now.  <BR> <BR>I still wonder which aspects of DeGroot&#39;s face were subject to his formula. Maybe all of them were -  in some way. Maybe he will enlighten us. Wouldn&#39;t that be excellent?  <BR> <BR>I&#39;ll post to this thread if I find anything in my experiments that seems useful.  <BR> <BR>If anybody owns a license to a thesis series font &amp; can hypothesize about the weights work for different aspects of the fonts that would be fun to hear about!</font></font></font></font></font></font>
