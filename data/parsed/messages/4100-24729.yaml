    date_raw: Saturday, January 24, 2004 - 6:13 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">If the weights look good, they are good.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 45589
    user: 2942
    date: 2004-01-24T23:52:00
    date_raw: Saturday, January 24, 2004 - 11:52 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">James, I agree with you as far as perception is concerned. But thats where it ends. Think of the labour. There is more to this issue than just thinking: &#39;There it is! I have a nice set of weights.&#39;  <BR> <BR>Obviously if you are making two or three faces for a font then you may be able to wing things a bit - but what about 20 weights? <BR> <BR>You might want to try to automate production. Then check results of course. &#40;I am not advocating using blind dogma to replace the evidence of your senses&#41; You might save maybe 100 or even 1000&#43; hours of work! Also you might have more time to critically look at the work - as opposed to slogging away. <BR> <BR>Also, a theory which explains why something looks good &amp; is helpful in general is worthwhile to know about - even if you decide to leave it behind for some reason another. Ever heard of the &#39;golden mean&#39;? I don&#39;t think it&#39;s the be all &amp; end all. But it can be helpful in some cases. <BR> <BR>I will post some experiments I have done over the next few days &amp; explain my current &amp; probably naive thinking a bit more.  <BR> <BR>If only I had more math in highschool! <BR> <BR>Hrant? Surely you have ideas about this? :-&#41;</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 45593
    user: 1262
    date: 2004-01-24T23:59:00
    date_raw: Saturday, January 24, 2004 - 11:59 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>Is anybody making new font weights using python scripts for in Font Lab? </i> <BR> <BR>I&#39;ll sometimes do this to rough out a weight. Generally, I&#39;ll start with a single weight, use Python to extrapolate bold and light versions, and then make these axis extremes for a Multiple Master font. The results are pretty messy, and not useable for final fonts, but the MM font is useful for guaging basic stems and trying different weights.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 45614
    user: 1947
    date: 2004-01-25T05:59:00
    date_raw: Sunday, January 25, 2004 - 5:59 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Eben, <BR> <BR>You asked the question, I gave an answer. And personally &#34;There it is, I have a nice set of weight.&#34; Is the only issue. <BR> <BR>As far as the labor, I have done and continue to do the labor. Have you? Maybe what you are really seeking is a way out of all the labor.  <BR> <BR>If you build a proper font MM database you don&#39;t need an underlying theory, just you eyes, and a problem that needs solving. <BR> <BR>I have never trusted any theory that explains why something looks good. <BR> <BR>Not only am I sure Hrant has an idea about this. He no doubt has his own name for the process.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 45643
    user: 1250
    date: 2004-01-25T13:49:00
    date_raw: Sunday, January 25, 2004 - 1:49 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#34;Before I invent something, I need a good name for it&#34;, some famous guy once said. But even though I actually haven&#39;t &#34;invented&#34; any ideas about optimal weight gradations &#40;yet&#41;, I still don&#39;t have a name for it either!  :-&#41; <BR> <BR>-- <BR> <BR>Eben, keep asking &#40;and I don&#39;t mean me&#41;. <BR> <BR>hhp <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 45658
    user: 2942
    date: 2004-01-25T17:07:00
    date_raw: Sunday, January 25, 2004 - 5:07 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">John, That helps alot - I had a feeling that there might be a way to steamline the process of looking &amp; comparing the possibilities - even if it doesn&#39;t give finnished results.  <BR> <BR>Do you have any suggestions for sources of python scripts? <BR> <BR>An aside about MM fonts: I think that MM instances are generated using a linear process. When you make a MM font you have to decide as the maker where the 50% mark is &amp; if you will have additional defined midpoints &amp; if so, where they are  - which lets you establish a sort of curve. Not a true curve but something more like one.  <BR> <BR>As a user of MM font you have to generate a font &amp; decide what values it will have and if the maker has only two extremes &amp; no strategically placed midpoints built in to cause sort of psudo curve then you might think a 75% value is going look like 75% - which it isn&#39;t. Linear scaling does not equal optical scaling. <BR> <BR>I&#39;ll talk more about that in another posting because I see MM as &#40;maybe&#41; flawed when it comes to generating weights in a purely theoretical sense both with &amp; without midpoints because it is a linear process. <BR> <BR>There is more to this but I am going to hold off for now. MM per se is really a side issue &amp; not too important in a practical sense at this point.  <BR> <BR>James, Sorry if I came off as snotty. I didn&#39;t mean to be. I just thought your answer was incomplete. I see now that theory isn&#39;t your thing. Fair enough. I don&#39;t &#39;trust&#39; theories either. I don&#39;t reject them out of hand either. Dogma is a bad thing because it closes your eyes to your own authentic aethetic perception. Dogam about rejecting all theories is equally dubious in my opinion. <BR> <BR>Am I seeking a way out of &#42;all&#42; the labour? No.  <BR> <BR>Some of it? - Definitely.  <BR> <BR>If I dig a ditch I might choose a shovel rather than a spoon. Does that make me less nobel or my ditch less good because it took me 3 hours vs. 6 days to dig my ditch?  <BR> <BR>I want to avoid the drudgery that computers are good at so I can do what I hope am good at - looking &amp; judging.  <BR> <BR>In the end I think you are right that the eye has the be the final arbiter. I am admittedly new to this. I see that you are not. &#40;Nice stuff BTW&#41;.  <BR> <BR>I also see how doing most things yourself by hand &amp; not leaving it to machines is the only way to make really solid wothewhile stuff in nearly every case - even when making something like a handwriting font from scans.  <BR> <BR>On the other hand if I can look at lots of sets of weights made with different equations &#40;&amp; therefore different weight curves&#41; then I imagine I can do a better job of making multiple weights - particularly if there are lots &amp; lots of weights. <BR> <BR>Quite apart from whether you want math in your font process - you could talk about which model of weights looks better to you; Porchez, DeGroot, someone else, or maybe your own weight system. And you could talk about why you think that. You could talk about how you decided to make the weights you made for Alfon.  <BR> <BR>You could talk about really skinny or fat fonts &amp; why you don&#39;t make them - or haven&#39;t so far from what I can see on your web site. <BR> <BR>This kind of info could be seen as a trade secret too I suppose... <BR> <BR>Hrant, <BR> <BR>Do you work in multiple weights much or are you concerned with middle/normal weight forms for the most part?  <BR> <BR>All, sorry this entry is so long winded. When I post some examples &amp; test images with the formulas behind them I am sure they will clarify what I am after &amp; why better than my typing here has for the past two postings.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
