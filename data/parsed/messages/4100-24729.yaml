  - id: 45694
    user: 2942
    date: 2004-01-26T01:57:00
    date_raw: Monday, January 26, 2004 - 1:57 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">What I have done so far to make sense of this issue is to take the sample I found on the De Groot page &#40;See above with the arrows&#41; &amp; measure the density of pixels that compose the arrow&#39;s horizontal lines. A black pixel is 100 units &amp; grey one might be worth between 1 &amp; 99 units. Two black pixels measure as &#39;200&#39;. <BR> <BR>When I had estimated relative widths I looked for a rule or equation that could describe &amp; predict the changes that I saw from the thinest to the thickest.  <BR> <BR>The rule that seemed to be used for weight increase was: take 1&#43;1/3 of the weight of a charcter add it to get the target weight of the next charcter. In excel the formula is =Cx/3&#43;Cx where C is the column &amp; x is the number of the starting weight.  <BR> <BR>In this way 21 is converted to 28 &amp; so on. Not all number convert cleanly like this. For instance 28 becomes 37.33333... <BR> <BR>Because points in FontLab or Fontographer do not come in fractionally numbered positions some rounding must be done and an ideal curve/formula would therefore: <BR> <BR>- Provide a pleasing optical &#39;one step&#39; increase. <BR> <BR>- Provide numbers that either were either whole or were as close to a whole number as possible eg 1.1 &#40;1&#41;is better than 1.4 &amp; 1.9 &#40;2&#41; is better than 1.5. <BR> <BR>- Provide a whole pixel em unit number at 9 or 12 points or whatever screen size you might be targeting. For the font I am working on now &#40; monoline &#41; that would be 100 em units for a target of 9 pixels on screen. This last point is irrelevant if you are making a font with no focus on screen rendering such as a display face. <BR> <BR>The em units I calculated using my hypothetically &#39;De Groot style&#39; curve &amp; 1 as a base with every 2nd number sampled starting with 1 are <BR> <BR>1,2,3,6,10,18,32,56,100,177,315 <BR> <BR>These are also the rounded or clean numbers. The unrounded mathematical result is: <BR> <BR>1 <BR>1.333333333 <BR>1.777777778 <BR>2.37037037 <BR>3.160493827 <BR>4.21399177 <BR>5.618655693 <BR>7.491540924 <BR>9.988721232 <BR>13.31829498 <BR>17.75772663 <BR>23.67696885 <BR>31.56929179 <BR>42.09238906 <BR>56.12318541 <BR>74.83091388 <BR>99.77455184 <BR>133.0327358 <BR>177.3769811 <BR>236.5026414 <BR>315.3368552 <BR> <BR>Probably none of these numbers match the Thesis fonts exactly either in terms of their actual ratios to each other. If I have sussed the formula he used that would be interesting especially since it yeilds mostly nice #s. I like the fact that it yields a 10 &amp; a 100 for instance. <BR> <BR>Here is what the rule/formula looks like as a curve charted in excel: <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/24914.gif" alt=""> <BR> <BR>Here is the same formula rendered to screen using a cross &amp; circle as examples. I have4 used weights 1-177 for 10 weights:  <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/24915.gif" alt=""> <BR> <BR>My reaction to this curve is that it emphasizes the light &amp; dark too much in 10 steps. A flatter curve would be better. The steps do feel even though - that much is good. A smaller fraction than 1&#43;1/3rd might give better results. It would be nice to sample every number too. It might be better to start with 2 or 3 or even 5 rather than 1. These are the ideas I will be testing next. <BR> <BR>It seems like a golden mean ratio could be tried too. I have to look into it. <BR> <BR>If I owned thesis I could measure it directly - but I don&#39;t. As you can see it wasn&#39;t really crucial to know what he did exactly to be able to start experimenting. I am not sure I like his formula so well that I would want to use it in any case. I mean I really like &amp; respect his stuff, but Porchez may have something in that crit.   <BR> <BR>Also I&#39;d rather work out my own rationale. It more fun, it&#39;s valid intellectual property &#40; if I was keeping it to myself &#41; and maybe it&#39;s even a noble kind of labour or something like that. <BR> <BR>BTW : DeGroot actually provides three equations on his site but I have not been able to make anything out of it so far. If anbody else can explain them please let me know! <BR> <BR>I will do some additional experiments and post them if folks are interested - especially if I make something I like.  <BR> <BR>I could also post the my excel sheet somewhere if it could help anybody work out formulas/weight curves they like. <BR> <BR>Does my original question make better sense now? Am I just nuts?  <BR> <BR>Do you think a split curve would make better sense or give better results? eg: One curve for the bolds &amp; one for the ligher weights with a normal weight in the middle. If you think so, why? <BR> <BR>Thanks!</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 45698
    user: 2942
    date: 2004-01-26T04:18:00
