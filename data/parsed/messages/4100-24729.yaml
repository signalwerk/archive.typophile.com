    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Check out this thread <BR> <BR>Typophile Forums � Build � Type weights new thread...  <BR> <BR>There is alot of info relevant to this topic there. For some reason I only just found it. It deals with a related issue - the question of &#39;How to make a bold face&#39;.  <BR> <BR>Reading James Montalbano&#39;s 116th entry explained alot to me about why he was dubious about even asking the question I brought up. His example in answering this question is great! Go check it out! Here is the supporting graphic from it: <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/24922.jpg" alt=""> <BR> <BR>Also, Randy Jones provides a link to Foundy&#39;s Monoline &amp; a PDF which uses the font. He explains that even a monoline should be built in a similar maner - carefully. He&#39;s right. <BR> <BR>Based on James Montalbano&#39;s example I guessed at how Foundy built their bold in this graphic. Am I close? <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/24923.gif" alt=""> <BR> <BR>In any event, I still contend that one or more weight curve formulas might help in creating a more pleasing set of weights even for a font with contrasts - especially if it&#39;s used in the context of a deliberate &amp; artful method as shown by the example graphics provided by James &amp; randy - rather than as a sort of global filter like an expand outlines filter or MS Word Bold treatment. <BR> <BR> My question isn&#39;t &#39;How do make a bold face&#39;. My question is different.  <BR> <BR>I am asking &#39;HOW much bolder do you make each face - especially in a large group?&#39;. It&#39;s a realated question but not the same one at all. <BR> <BR>It&#39;s not that fonts don&#39;t need to built carefully &amp; thoughtfully to be worthwhile. They do.  <BR> <BR>It&#39;s that that same thought &amp; creative process can be informed &amp; enhanced by a mathematical reference.  <BR> <BR>If you look carefully at the example James provides the font is getting bolder in a linear fashion. Each step seems fairly equal to the next.  <BR> <BR>I am guessing that instead, the steps should be slightly different each time with the differences based on a formula/curve, to achieve a better more optically pleasing result. <BR> <BR>But maybe that&#39;s not true.  <BR> <BR>Maybe linear increase is best.  <BR> <BR>If it is; can you show me why? <BR> <BR>Thanks!</font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 45700
    user: 1353
    date: 2004-01-26T05:31:00
    date_raw: Monday, January 26, 2004 - 5:31 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; BTW : DeGroot actually provides three equations on <BR>&#62; his site but I have not been able to make anything <BR>&#62; out of it so far. If anbody else can explain them  <BR>&#62; please let me know! <BR> <BR>Actually it&#39;s only one equation, in different &#39;arrangements&#39;. <BR>I don&#39;t know what you want to be explained, I think it&#39;s <BR>pretty simple. <BR> <BR>In any case, I&#39;ve applied his equation to some of your data, <BR>and it&#39;s surprising. For example: <BR> <BR>Your data: <BR>a = 1.333333333 <BR>b = 1.777777778 <BR>c = 2.37037037 <BR> <BR>Result from De Groot&#39;s equation b = sqrt&#40;a&#42;c&#41;: <BR>b = 1,777777777 <BR> <BR>Another try, your data: <BR>a = 74.83091388 <BR>b = 99.77455184 <BR>c = 133.0327358  <BR> <BR>De Groot&#39;s equation: <BR>b = 99,77455184 !!!</font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 45706
    user: 1215
    date: 2004-01-26T06:10:00
    date_raw: Monday, January 26, 2004 - 6:10 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">H�ctor -- The post you&#39;re looking for does not sound like anything I remember posting before. You give me too much credit. This is not an area where I have any expertise. <BR> <BR>It is interesting that Eben&#39;s one-third formula is so close to De Groot&#39;s square root. But looking at the cross and square example, it seems to me that the curve is only reasonable in the mid region. The extremes are too flat &#40;at one end&#41; and too steep &#40;at the other&#41;. <BR> <BR>De Groot&#39;s formula assumes two given weights. Whereas, Eben is trying to derive a sequence from a single starting point.  <BR> <BR>The De Groot formula may be useful for a specific situation, but it requires the designer&#39;s judgement in picking the two starting points. The square-root formula seems to do a good job of generating a single instance which is optically in the middle of the two starting points &#40;or extrapolating an endpoint, such that one of your starting points becomes the midpoint&#41;.  <BR> <BR>But at the extremes, a proper visual grading may require more than a &#42;single&#42; instance between two weights -- such as between Eben&#39;s 99 and 177, for instance. In such a case, the De Groot formula can only generate an odd number of successive midpoints. <BR> <BR>-- K. <BR></font></font></font></font></font></font></font></font></font></font></font>
  - id: 45709
    user: 1275
    date: 2004-01-26T06:37:00
    date_raw: Monday, January 26, 2004 - 6:37 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I don&#39;t have read all this page, but what I can say is it more simple than formula and so on. Each new font require different way, just because the contrast is variable and some have Serifs, others not. Some need to be used in small size, so large counters in Black when others mostly for display. <BR> <BR>Don&#39;t miss also that a real letter is not just a &#43; or a circle. <BR>When designing a Black, I say BLACK not b l a c k as in many case, most of the job is to achieve the perfect visual weight, not the mathematical weight: So a g lc will be very different than n. Same for the horizontal of a B or E compared to vertical of a N, etc. <BR> <BR>And in Thin weight it will be more mathematical adjustment, as less contrast by definition. <BR> <BR>So, when you interpolate such extrems, your regular or demi can suddenly appear to contrasted when x an y interpolation are same values. So, again some adjustment need to be made. <BR> <BR>Not also that an interpolate curve is not straight, the regular between thin and black is not at 50%! <BR> <BR>Here after some adjustement made for Anisette intermediate weight. <BR><img src="http://www.typophile.com/forums/messages/4100/24926.gif" alt=""></font></font></font></font></font></font></font></font></font>'
