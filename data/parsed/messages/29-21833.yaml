    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey Paul, thanks again for keeping me on the money. Speaking of money, I can&#39;t imagine this puppy getting adopted by anyone anytime soon� <BR> <BR>Anyway, as I told you offline, I took Ignaz Textura to Typo-Berlin, and got some great feedback. Namely, my upper and lowercase alphabets look too different from each other. Moreover, because of its lack of detail &#40;in comparison with the lowercase&#41;, the uppercase works better in text than the lowercase, whose intricate details only come about in point sizes above 18 or so. <BR> <BR>So, the new plan is to turn Ignaz Textura into two fonts, a titling font &#40;more like the old lowercase&#41; and a text font &#40;more like the old uppercase&#41;. Posted here is a 10 letter comparison between the old Ignaz &#40;as seen in previous posts&#41;, and first goes at Ignaz Titling and Ignaz Text. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/37197.gif" alt="first optical sizing experiment"></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
