    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Yes, Paul, here&#39;s something for you. I haven&#39;t posted anything new, since I didn&#39;t get much feedback from my first round, but here are two new samples. My letterspacing isn&#39;t right yet. And I&#39;m still working on things, like the uppercase. The second sample shows some alterations to 5 uppercase letters that I&#39;m working on now. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/28750.gif" alt="ignaz textura sample 1"> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/28751.gif" alt="ignaz textura sample 2"></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 52137
    user: 1353
    date: 2004-03-17T05:37:00
    date_raw: Wednesday, March 17, 2004 - 5:37 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Wow, very nice, Dan. <BR>The lowercase seems fine to me. But maybe I&#39;d like to see a descending z. The uppercase... yes, it needs work. There are some good ideas, like the two A&#39;s in your bottom image, and the T, but there are also some confusing glyphs, like V/W, M/N, O/P/Q, I/J. Finally, I&#39;d try to make the figures just a bit heavier.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 52139
    user: 851
    date: 2004-03-17T06:01:00
    date_raw: Wednesday, March 17, 2004 - 6:01 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Dean, <BR> <BR>This is beautiful type. It really stands apart from every other Textura I&#39;ve seen. Keep going in the same direction with it. You already recognize that the spacing is an issue, and that&#39;s the only major thing I&#39;ve noticed. <BR> <BR>You should consider adding a half-r, which looks somewhat like a condensed x-height 2. One example can be found in Helzel&#39;s K�nig-Fraktur G14: <BR> <BR><a href="http://www.romana-hamburg.de/fraktur2.htm" target="_blank">http://www.romana-hamburg.de/fraktur2.htm</a> <BR> <BR>It&#39;s at the very end of the fourth specimen line from the top of the box, the second black line on the page. I&#39;ll try and post a Textura example from Carter&#39;s Flammande later on.  <BR> <BR>The half-r is generally substituted after a &#34;round&#34; letter like o, p, or b. <BR> <BR>For something with shapes as uniform as a textura, you may consider making the general spacing tight &#40;an n would have stem-width sidebearings on either side&#41; and then adding mostly positive kerning as needed. Most fonts are the other way round and have mostly negative kerning. <BR> <BR>I&#39;m sorry I didn&#39;t respond to this earlier. I&#39;ve been very busy. But this is one of the best designs I&#39;ve seen on Typophile in a year or so. There are plenty of other good ones, make no mistake, and I think the quality of designs being critiqued has steadily improved. And yet this one still stands out.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
