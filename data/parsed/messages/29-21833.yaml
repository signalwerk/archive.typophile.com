    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Yes, I do have plans for a descending z. I&#39;m going to add a half r, too. I&#39;ll post them soon. <BR> <BR>I&#39;m very excited by OpenType, but I&#39;ve never done anyth�ng with it. &#40;Although, I think that a blackletter typeface, which requires different letterforms in different settings, would be a great first-time application for me.&#41; I haven&#39;t even used OpenType while setting text, although I saw a great demo at an InDesign User Group sometime last year. <BR> <BR>I&#39;m still working with Fontographer, since I have a copy of it. I&#39;ve seen FontLab, but have yet to use it. Is FontLab is the only software that can export OpenType formats?  That might force my hand toward a switch...</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
