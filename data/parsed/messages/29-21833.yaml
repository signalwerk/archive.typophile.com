    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">OK, here is an updated version, based on feedback. I&#39;ve even added a half-r, although I&#39;m not sure how to use it properly. Some numerals and caps are new, along with a few additional characters and a long-z. <BR> <BR>&#40;John, in Albert Kapr/Hans Peter Willberg&#39;s <i>Fraktur: Form und Geschichte der gebrochenen Schrfiten</i>, I found a sample of a half-r, but not any description of usage, even though the book has a nice appendix on setting Fraktur correctly, etc. Do you know anyone who has written a nice tract about this?&#41; <BR> <BR><img src="http://www.typophile.com/forums/messages/29/29244.jpg" alt=""></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
