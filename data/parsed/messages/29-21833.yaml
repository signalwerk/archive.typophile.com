    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>John what about the site you posted? are those typefaces for sale?</i> <BR> <BR>Yes. That&#39;s Gerhard Helzel&#39;s site. His main blackletter page is <a href="http://www.romana-hamburg.de/fraktur1.htm">here</a> and his general page is <a href="http://www.romana-hamburg.de/">here.</a> I don&#39;t know if he speaks English, but he appears to understand Latin and Greek. He&#39;s built a library of neglected and forgotten blackletter fonts. He added some swift code info, so I guess he&#39;s been getting some foreign orders lately. <BR> <BR>-- <BR>Back to Ignaz: <BR> <BR><i>First, two new I variants, then three Ps. I really like the form of P number 2, but it looks alot like a schwabacher E� Then M, N, S, and Y</i> <BR> <BR>Texturas are never used in all caps except when inscribed around a gang member&#39;s beerbelly. So keep P#2. I like it as well, and in the proper context it should be legible, I would think. Remember that you can always stash as many alternates as you like in the SALT or AALT or SSxx sets in OpenType. &#40;Contact me directly if you need help assembling any of those features.&#41; <BR> <BR>Do you have plans for a descending z?</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 52646
    user: 1085
    date: 2004-03-21T11:08:00
