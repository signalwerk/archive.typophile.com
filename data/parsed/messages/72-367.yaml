  html: 'FOR IMMEDIATE RELEASE <BR> <BR>                              Date: 9/13/01  <BR> <BR>                              Dear Associate,  <BR> <BR>                              Do you, like me, feel humbled almost into <BR>                              insignificance by the magnitude of the horrible <BR>                              events of September 11th, 2001? Probably <BR>                              most of us feel sickened and hopeless. I sit <BR>                              here wondering how my skills can help the <BR>                              causes of humanity or humanitarianism. My <BR>                              chosen trade seems to limit my options for <BR>                              expressing compassion and assistance &#40;and <BR>                              my recent visits to the UK preclude my <BR>                              donating blood to the Red Cross&#41;.  <BR> <BR>                              But there is, after all, something specific that <BR>                              we in the typographic community can do. Type <BR>                              designer Stuart Sandler has made a proposal <BR>                              that may help. Inspired by Claes K&auml;llarsson&#39;s <BR>                              Font Aid, Stuart has initiated Font Aid II, a <BR>                              collaborative &#34;font&#34; in which each glyph will be <BR>                              designed by a different type designer. We will <BR>                              make the finished product available to <BR>                              members of the public as a token thank you for <BR>                              their donations to the Red Cross and victim <BR>                              relief efforts.  <BR> <BR>                              The Society of Typographic Aficionados will act <BR>                              as the organizing body to ensure that all funds <BR>                              are donated as promised. You can get more <BR>                              information about this project at the SoTA <BR>                              website, <A HREF="http://www.typesociety.org" TARGET="_top">http://www.typesociety.org</A>.  <BR> <BR>                              When civilized life is threatened, artists should <BR>                              use their talents to speak out against <BR>                              barbarism. As a fellow type designer, you can <BR>                              help by donating your glyph to this cause. I <BR>                              hope you will participate by donating through <BR>                              the Font Aid II channel. In this small way, type <BR>                              designers can give something specific to the <BR>                              relief efforts.  <BR> <BR>                              Regards, Richard Kegler <BR>                              ----------------------------- <BR>                              Board of Directors Chair, Society of <BR>                              Typographic Aficionados <BR>                              <A HREF="http://www.typesociety.org" TARGET="_top">http://www.typesociety.org</A>'
