    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The Fachhochschule Wiesbaden in Germany has a logo for each department, as well as an umbrella logo for the college. Their CI is Meta, I think. <BR> <BR>I&#39;m almost certain that Werner Schneider had a hand in their design. In any event, he taught their forever before retiring a few years ago. His Vialog from Linotype also has a symbol set, designed with f&uuml;nfwerken. But that doesn&#39;t have anything to do with the school &#40;although it is in the same style&#41;. Vialog, and some of its symbols were designed for the Munich Transportation Authority, which now has a kick-<font color="ff0000">&#149;</font><font color="ff0000">&#149;</font><font color="ff0000">&#149;</font> navigation/identity system as well. <BR> <BR>Linotype Vialog <BR><a href="http://www.linotype.com/43576/vialogltsigns-family.html" target="_blank">http://www.linotype.com/43576/vialogltsigns-family.html</a> <BR> <BR>F&uuml;nfwerken <BR><a href="http://www.fuenfwerken.de/" target="_blank">http://www.fuenfwerken.de/</a> <BR> <BR>FH Wiesbaden &#40;unfortunately, the school website does not have a clear description of its identity system on its website, that I know of&#41; <BR><a href="http://www.fh-wiesbaden.de" target="_blank">http://www.fh-wiesbaden.de</a> <BR> <BR>Munich Transportation Authority <BR><a href="http://www.mvg-mobil.de/" target="_blank">http://www.mvg-mobil.de/</a></font></font></font>
