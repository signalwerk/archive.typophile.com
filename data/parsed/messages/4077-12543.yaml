  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">If you are going to be attending the ATypI 2003 conference in Vancouver, and are interested in visiting my workshop, look me up in the crowd, and we can arrange a time for you to visit. The workshop is a short  25 minute trip on the local Sky Train tranit system. <BR>You can see some type casters in operation, and get an idea how I engrave new metal type for casting. Or E-mail me at . . . <BR> <BR><a href="mailto:rimmertype@shaw.ca">rimmertype@shaw.ca</a> <BR> <BR></font></font></font></font>
