    html: <font class="dontLookLikeCrap">My favorite resource for this type of thing is the Library of Congress&#39; &#34;American Memory&#34; website, which can be found &#60;a href=&#34;<a href="http://memory.loc.gov/ammem/amtitle.html" target="_blank">http://memory.loc.gov/ammem/amtitle.html</a>&#34; target=&#34;new&#34;&#62;here&#60;/a&#62;. Every time I visit, I get sucked in for awhile, but I&#39;m usually able to find excellent images to guide me when I&#39;m trying to reconstruct something from the past.</font>
