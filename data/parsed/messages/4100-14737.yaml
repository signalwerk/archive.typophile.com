    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The <a href="http://www.adobe.com/type/browser/F/FUTQ/F_FUTQ-10016000.jhtml">Adobe version</a> is my least favorite. It was one of their  <BR>earliest releases and you can kinda tell. <BR> <BR>The <a href="http://www.myfonts.com/fonts/bitstream/futura/">Bitstream version</a> is pretty good, especially for text.  <BR>There is also <a href="http://www.neufville.com/uk/startfuk.htm">the new one from Neufville Digital</a> which looks  <BR>very good and has lots of extras like small caps and old  <BR>style numerals. Also, it has CE, Turkish and Baltic language  <BR>support. <BR> <BR>One thing that I miss from the pre-digital days are the  <BR>display cuts of Futura. All the available digital versions  <BR>seem to be based on the text sizes &#40;except, I remember  <BR>Image Club did display versions, I don&#39;t know if those are  <BR>still available&#41;. The text cuts--even good ones--look a bit  <BR>clumsy at display sizes.</font></font></font></font></font>
