    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">the simple forms that provides de structure for the letter, are closed to the essential and basic method pottery is made. from the clay to the recipient &#40;yes in looks like an elegant womb that also develops this idea&#41;. <BR> <BR>Origen means Origin, this also remind me basic lines, and the D is a way the client use to spell out from. &#34;From the Origin&#34; is the final concept. <BR> <BR>And in fact, the &#34;D&#34; was one of the changes the client suggested. <BR> <BR>here is the final version, i don&#39;t know why i like more the first one. <BR> <BR><IMG SRC="http://www.typophile.com/forums/messages/29/3091.jpg" ALT="finalorigen.jpg"></font></font></font></font>
