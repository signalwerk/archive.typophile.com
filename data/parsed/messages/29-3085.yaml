    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> I think that it is a wonderful beautiful and graceful feminine form that speaks well to both pottery and to creativity &#40;a sort of womb&#41;. Really elegant and strong at the same time. Nicely done, cristian. Could you please provide a little more information on the meanings of the words and her vision about chilean pottery? For instance, the D doesn&#39;t seem to fit but that may be just because I am not understanding the language? </font></font></font></font>
