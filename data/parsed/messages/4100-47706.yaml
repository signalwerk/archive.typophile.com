  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I assume &#34;leg&#34; is only for the letter K? <BR>and the tail being for something curved? <BR> <BR>Please help me clearify these two terms</font></font></font></font></font></font></font></font>
