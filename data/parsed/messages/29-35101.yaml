alt="Rosart sample"> <BR> <BR>I found this in &#34;Treasury of Alphabets and Lettering&#34; attributed to Jacques Francois Rosart. The forms are similar to the ones from my &#34;Frog&#34; book, so you may be right. I want to find out more about him. <BR> <BR>I&#39;m getting off track with this, so I apologize. The source I&#39;m using is mainly an inspiration--I wanted an exercise in something more refined than my <a href="http://www.typophile.com/forums/messages/29/17923.html?1081260500">last effort</a> &#40;which I&#39;m still working on&#41;, but I think I need to work on the uniqueness. I&#39;ll post a slightly revised sample soon. <BR> <BR>Thanks, <BR>Addison</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
