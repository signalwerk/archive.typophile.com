 class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Addison, I&#39;d have to check the Enschede specimen book I&#39;m hoarding from the UCLA library &#40;the stratospheric 1908 edition&#41; if this is really based on something F&#39;man did &#40;it sort of feels like Rosart too, although much more refined&#41;. Please remind me on Monday. <BR> <BR>BTW, this is feeling more and more like Carter&#39;s Victoria&amp;Albert font, a revival of which is now used by the LA Times for the section heads. <BR> <BR>About the widths: an all-caps font can have more ample widths for &#34;lopsided&#34; letters &#40;like the &#34;T&#34;&#41;, because it&#39;s supposed to be spaced out a lot anyway. <BR> <BR>hhp <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
