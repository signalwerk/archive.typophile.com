  - id: 59223
    user: 1250
    date: 2004-05-06T11:51:00
    date_raw: Thursday, May 06, 2004 - 11:51 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Wow, it&#39;s great you have that. <BR>But unless it&#39;s another article than the one I have &#40;by Scorsone&#41; it won&#39;t have trigraphs. The article does have a reference to my source for trigaphs though: &#34;Secret and Urgent&#34; by Pratt, 1939. It&#39;s funny that the best linguistic source for type designers comes from war &#40;via cryptography&#41;. There&#39;s also another source for trigraphs &#40;and higher&#41;, but that&#39;s a huge unsorted list that would be pretty painful to distill. <BR> <BR>hhp <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 59745
    user: 2412
    date: 2004-05-11T07:36:00
    date_raw: Tuesday, May 11, 2004 - 7:36 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">All 26 letters &#40;capitals&#41; are complete now, but the spacing is still pretty bad. I&#39;m revisiting Briem&#39;s site and Letters of Credit to take care of this, but meanwhile here&#39;s a PDF of what I&#39;ve got so far. Let me know what you think. <BR> <BR><!--attachment: Frogs_Specimen-35617.pdf*mime_pdf.gif*application/pdf*12.3*Specimen*Frogs+Specimen%2epdf --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align=left alt="application/pdf">Specimen<br><a href="http://www.typophile.com/forums/messages/29/Frogs_Specimen-35617.pdf" target="_blank"><b>Frogs Specimen.pdf</b></a> (12.3 k)</td></tr></table></center><!--/attachment--> <BR> <BR>Thanks, <BR>Addison</font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 59787
    user: 1250
    date: 2004-05-11T10:16:00
    date_raw: Tuesday, May 11, 2004 - 10:16 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#40;I just had a strange deja vue when I read the second page...&#41; <BR> <BR>Very classy stuff. <BR> <BR>I think the outside serifs on the &#34;C&#34;, &#34;G&#34; &#40;on top&#41; and &#34;S&#34; need more length. <BR>I&#39;m not sure about the &#34;J&#34; - try a serify terminal. <BR>The leg of the &#34;K&#34; feels cramped on the inside - maybe try a descending form? <BR>Give the &#34;L&#34; a wider base &#40;look at the &#34;T&#34;, and remember the all-caps factor&#41;. <BR>I would flare the &#34;M&#34;. <BR>I would make the head of the &#34;P&#34; slightly larger. Maybe. <BR>The tail of the &#34;Q&#34; seems to flow too much into the body on the left. More juice, please. <BR>The &#34;Y&#34; seems to need a heftier top. <BR>The tips of the &#34;Z&#34; &#40;and &#34;N&#34; at the bottom too&#41; seem to need more flourish. <BR> <BR>This is already looking really pro, Addison - an improvement even on Rosart. <BR>I wonder about the name, though; what about &#34;Aristo&#34;? <BR> <BR>hhp <BR></font></font></font></font></font></font></font></font></font></font></font></font>
