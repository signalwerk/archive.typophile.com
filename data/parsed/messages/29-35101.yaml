class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Nice illustration, Juan, I understand what you mean. I guess I&#39;m still developing that sense of balance between the letterforms and the spaces between the letterforms. I don&#39;t use measurements all that much, perhaps I should... <BR> <BR>Hrant, I&#39;ve made a note to remind you about the Fleischmann specimen. I can&#39;t believe you can get an Enschede specimen from a library--the bookstores here &#40;Mississippi&#41; don&#39;t know what a type specimen is... but we have the blues. Anyway... <BR> <BR>I need to get that Carter book, I&#39;d like to see the V&amp;A font as well. <BR> <BR>Eduardo, the spacing was done in the layout &#40;actually slapped together&#41; so it doesn&#39;t really reflect the sidebearings. The sidebearings really haven&#39;t been set yet--I still haven&#39;t finished all the letters. So maybe the spacing would solve the problem &#40;or help&#41;? <BR> <BR>Thanks, <BR>Addison</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
