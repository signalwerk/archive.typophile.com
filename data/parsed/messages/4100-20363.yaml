    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Great suggestions in this thread, even though I think it would be a good thing seeing some of the drawings of the illustrator, yes Tiffanny it is a PITA, they have to work so well together...  <BR> <BR>You could also take a look at the  <a href="http://www.chank.com/img/aGFYdisplay.pdf" target=_top>Go Font Yourself Handwriting Fontpak</a> from Chank. <BR></font></font></font></font></font></font></font></font></font></font>
  - id: 38365
    user: 1250
    date: 2003-11-19T09:20:00
    date_raw: Wednesday, November 19, 2003 - 9:20 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; probably because as each character is repeated <BR> <BR>I&#39;ve come to the tentative conclusion that the necessity for letterform &#34;randomness&#34; is limited to foveation. What I mean is that as long as the font uses 3 or 4 variants of a glyph &#40;which is the most we can see in the fovea at one time, and that&#39;s assuming 3 or 4 of the same letter ever actually happens in sequence...&#41; it&#39;s OK, because short-term memory concerning exact glyph shapes probably doesn&#39;t survive a saccade. Interestingly, Letterror&#39;s FF Kosmik-Flipper uses 3 variants per character. <BR> <BR>But I&#39;ve also come to realize there&#39;s a much bigger problem: handwritten stuff typically has <i>mistakes</i> in it, which can either be corrected -but visibly- or just left in. This means you need some fancy software to replicate that in order for something to truly appear handwritten... <BR> <BR>hhp <BR></font></font></font></font></font></font></font></font>'
