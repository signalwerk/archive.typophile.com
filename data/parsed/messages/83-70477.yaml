    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I hunted through my Sans Font ID Guide, but couldn&#39;t find a match for the rather closed a &amp; e and rather open g.  I am hunting through the &#39;Dutch Type&#39; book in case this was done by a Dutch type designer.</font></font></font></font></font>
