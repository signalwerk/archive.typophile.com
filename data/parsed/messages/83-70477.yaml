    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Winston - <BR> <BR>If you look on the lower right of page 80 you&#39;ll <BR>notice a caption for the covers in cyan.  <BR>It says &#34;Composer set in Classified News, enlarged&#34; <BR> <BR>If you jump back to page 22 you&#39;ll see mention <BR>of Karl setting his work with an IBM composer <BR>and then enlarging the result. Also on page <BR>18 there is a specimen of the face shown in a  <BR>few sizes with some rather raucous text settings. <BR> <BR>I love it. Clunky, loose and strangely charming.</font></font></font>
