    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">No luck in the &#34;Dutch Type&#39; book, although it somewhat resembled a typeface designed by Jan Tholenaar for large-print books called &#39;GLB-16&#39;. This was used between 1973 and 1974 for printing about 50 books for sight-impaired readers. It was one of the first Dutch digital typefaces.</font></font></font></font>
