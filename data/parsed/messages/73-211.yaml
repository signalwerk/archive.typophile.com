    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">LK, <BR> <BR>Otomo is not &#34;by Fontographer&#34;. That&#39;s just the <BR>piece of software used to create it. It&#39;s by James  <BR>Nazaroff of Zang-o Fonts. Boy, it was tough  <BR>to find James&#39; stuff on the Web. He was part of <BR>Chank&#39;s now defunct army - and his link is now <BR>404ed over there: <A HREF="http://www.chank.com/zangofonts/" TARGET="_top">http://www.chank.com/zangofonts/</A> <BR> <BR>Rude, Chank! Have a heart! <BR> <BR>So I&#39;ve lost Zang-o. If anyone finds their new <BR>home, please post. <BR> <BR>But yes, Otomo is a purdy thing, thanks for  <BR>reminding me.</font></font></font></font></font>'
