  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">hi all, <BR>the following attachment is Wax - an ornament typeface based on my chest hair. i worked on it as part of Mike Essl&#39;s experimental typography class at Cooper Union last year &#40;thanks mike&#41;. tell me what you think and feel more than free to spread it around. <BR>cheers <BR>Roy <BR> <BR><!--attachment: wax-64316.zip*attachment_icon.gif*application/zip*46.2*type+file*wax%2ezip --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/attachment_icon.gif" align=left alt="application/zip">type file<br><a href="http://www.typophile.com/forums/messages/29/wax-64316.zip" target="_blank"><b>wax.zip</b></a> (46.2 k)</td></tr></table></center><!--/attachment--></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
