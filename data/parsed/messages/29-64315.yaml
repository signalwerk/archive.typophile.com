    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Roy&#39;s got more hair on his chest than I have on my head. <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 91685
    user: roy-users
    date: 2005-01-31T15:00:00
    date_raw: Monday, January 31, 2005 - 3:00 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">hey guys, <BR>thanks, and yes i guess i got more hair on my chest than most of you got all over... so why not decorate with them ah? <BR> <BR>it all started from looking too long at Dalliance Flourish... and now that is the result. but a hair stroke is a pretty neat material to work with <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 91689
    user: 1011
    date: 2005-01-31T15:15:00
    date_raw: Monday, January 31, 2005 - 3:15 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Positively follicular! <BR> <BR>My only criticism would be that the characters in the font that were created by mirroring or flipping variations of the same shape &#40;the more pattern-like glyphs, that is&#41; are much less interesting than the raw component shapes. I think the example that Armin produced is a perhaps more effective use.</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 91695
    user: roy-users
    date: 2005-01-31T15:58:00
    date_raw: Monday, January 31, 2005 - 3:58 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">thanks Grant, <BR>i agree, indeed i only included three mirror-like shapes to see how people react and i think im going to cut them out.  <BR>the mirrors are more of a way to use it rather than a stand alone shape. <BR>thanks for your input</font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 91707
    user: 1011
    date: 2005-01-31T18:44:00
    date_raw: Monday, January 31, 2005 - 6:44 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Are you still developing additional characters for this font? I&#39;d be curious to see how many variations you can <i>pluck</i> out of it... <BR> <BR>{ ouch }</font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 91727
    user: roy-users
    date: 2005-01-31T22:18:00
    date_raw: Monday, January 31, 2005 - 10:18 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">the process was taking the hair taping each seperately and then mixing the shapes i got. after i was happy with one of the form i scanned it and traced it. than i increased the contrast, so it will work even in a small size and different printers.  <BR>i have tones of shapes, but at some point you understand &#40;and i know it sounds awkward but that is just the way it is&#41; that hair is some what like a snow falck i mean, all the shapes are different and exciting, and it is an endless resource.  <BR>so i just stoped at some point to collect them,</font></font></font></font></font></font></font></font></font></font></font>
