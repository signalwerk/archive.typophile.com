  - id: 25358
    user: 533
    date: 2003-08-10T23:39:00
    date_raw: Sunday, August 10, 2003 - 11:39 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">As a few alternative suggestions, Adobe&#39;s <BR>Penumbra Sans is a tailor-made sans-serif <BR>companion to Trajan, but, like Trajan, <BR>it is an all-caps font: <BR> <BR><a href="http://www.adobe.com/type/browser/P/P_1112.jhtml" target="_blank">http://www.adobe.com/type/browser/P/P_1112.jhtml</a> <BR> <BR>Also, Berthold&#39;s Formata works very well when <BR>paired with Trajan, as its upper-case characters <BR>have similar structure to Trajan in many respects: <BR> <BR><a href="http://www.bertholdtypes.com/adobe_lib/080218000.html" target="_blank">http://www.bertholdtypes.com/adobe_lib/080218000.html</a> <BR> <BR>David</font></font></font></font></font>'
  - id: 25368
    user: 1520
    date: 2003-08-11T02:13:00
    date_raw: Monday, August 11, 2003 - 2:13 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">James, that&#39;s pretty good news about Giacomo SC :-&#41;. It&#39;s always keen to have non-Adobe-folks adopt the OTF-Pro-format &#40;when Linotype et al seem to be content with just converting old fonts to OTF without using the pro features&#41;, and your typographic style on Giacomo and Clearview is, as I said, legible and clear and thus a solid alternative to other, more overused sans serif typefaces. So I sure hope you find the time to do some more OTF stuff :-D. </font></font></font></font></font>
