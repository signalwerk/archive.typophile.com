    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Gill Sans. <BR> <BR>Maybe not the most original choice per se, but you&#39;ll find that Eric Gill, as the stone-cutter he was, designed the upper case characters to be very close in proportion to the inscriptions chiseled on the Trajan column.</font></font></font></font></font>
