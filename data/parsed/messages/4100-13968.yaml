    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I would love to use Fedra-sans -- But we are currently re-doing the ID for our firm, and using Fedra serif. so I think might be too close. But I love that face.</font></font></font></font></font>
  - id: 25210
    user: 1286
    date: 2003-08-08T15:40:00
    date_raw: Friday, August 08, 2003 - 3:40 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">It needs to work well in rather large text blocks, but should be versitle enough to set in big advertisment type titles. Im considering NOT using Trajan at all, simple because of its over use and abuse, especialy in the whole &#34;film&#34; world. But I&#39;m not sure I can get buy without it, being that is is incorporated into the logo.</font></font></font></font></font>
  - id: 25219
    user: 1947
    date: 2003-08-08T16:40:00
    date_raw: Friday, August 08, 2003 - 4:40 pm
    votes: 5
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Well two plugs here, <BR> <BR>Instead of the overused Trajan, use Dave Farey&#39;s La Gioconda, it based on Cresci&#39;s lettering and has a lowercase to boot <BR><a href="http://www.myfonts.com/fonts/letraset/la-gioconda/" target="_blank">http://www.myfonts.com/fonts/letraset/la-gioconda/</a> <BR> <BR>For the sans I recommend Giacomo. Not only do both fonts have Italian names starting with G but they have a certain affinity for one another <BR><a href="http://www.terminaldesign.com/retail_specimen.php?ID=1176&amp;viewFam=1" target="_blank">http://www.terminaldesign.com/retail_specimen.php?ID=1176&amp;viewFam=1</a> <BR></font></font></font></font></font>
  - id: 25260
    user: 2085
    date: 2003-08-09T10:56:00
    date_raw: Saturday, August 09, 2003 - 10:56 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;The logo is in place &#40;for now&#41; <BR> <BR>Kyle, I think you are thinking in getting rid of it �? <BR> <BR>&#62; But I&#39;m not sure I can get buy without it, being that is is incorporated into the logo. <BR> <BR>It doesn�t mean you need to use the font for anything else, sometimes is ok and sometimes it&#39;s even a bad thing to do, it depends on the work. And as I understand that maybe, not long, you will try to change the logo, it will be easier if you forget at all about using the Trajan  anymore. <BR>By the way, I liked the Gioconda, I didn&#39;t know it.</font></font></font></font></font>
