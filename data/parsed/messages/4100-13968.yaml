  - id: 25555
    user: 1520
    date: 2003-08-12T04:21:00
    date_raw: Tuesday, August 12, 2003 - 4:21 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;I know Meta was SO used for a while, but &#62;it&#39;s &#34;trend&#34; status seems to have subsided a bit &#62;of late. You might just take a look. <BR> <BR>Same here. After years of not using Meta, I was verrry close to using it again on a job some days ago and found it quite pleasing, but still decided on FFInfo, as the job needed a bit of a more static and computer-like feel while still maintaining legibility. Still, you don&#39;t see Meta too often anymore, and the font itself is good work. We still could use a MetaLight, imo, though. And of course, full OpenType Treatment. Makes sense with all those foreign language sets already devbeloped at MetaDesign/FontShop.  <BR> <BR>And James... for a small foundry, Giacomo does come with a rather painful price tag attached. The OTF made me buy it, but still... prices like these are what keeps me from buying Bliss and a batch of Lineto Fonts. Your work is outstanding, and I&#39;m all for paying the price a speicific work is worth, but when even works by Luc&#40;as&#41; de Groot and Fontshop are less expensive, it makes the decision to get your fonts a bit harder. A few Euro more and I could have bought the wonderful Taz III. And over at Chester&#39;s and Rick&#39;s you get the great section at 99$... now THAT is an incentive :-D.  <BR> <BR>Still, Giacomo is well worth the money spent &#40;maybe the Upgrade can be for free, though, hinthintnudgenudgewinkwink...&#41; Would&#39;ve bought Clearview as well, but my money was all spent... we&#39;re finally moving into a larger house/bureau and I&#39;m pretty broke after buying the whole thing. </font></font></font></font></font>
  - id: 25562
    user: 1947
    date: 2003-08-12T05:24:00
    date_raw: Tuesday, August 12, 2003 - 5:24 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; <BR> <BR>&#62; Still, Giacomo is well worth the money spent &#40;maybe the Upgrade can be &#62; for free, though, hinthintnudgenudgewinkwink...&#41; <BR> <BR>When the small caps are added, the upgrade will be free. <BR> <BR>Thank you for the pricing feedback, I think the hardest thing in all of design is the pricing of ones work. At what point is it too much for the client, at what point is it too little for the designer. Realistically, how does a graphic designer pass these costs onto their clients. A lot of my graphic design experience was pre-computer. Typesetting, stats, photo retouching, art production, all of these costs were marked-up slightly and passed on to the client. Marked up to cover the cost of being a &#34;bank&#34; to your client. <BR> <BR>With digital fonts, what are the pricing and billing models being used to by designers to get the fonts they need, and to pass those costs along to clients? <BR> <BR>I understand that discussing pricing is a sensitive subject, I don&#39;t want Typophile to accused of being a price fixing consortium, but perhaps younger designers need some advice on how to manage their cash flow and billings. <BR> <BR>Just a thought? Anyone?</font></font></font></font></font>
  - id: 25592
    user: 1286
    date: 2003-08-12T09:59:00
    date_raw: Tuesday, August 12, 2003 - 9:59 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Well billing, haha, thats a tricky subject. <BR> <BR>In my case it is subjective. <BR> <BR>With purchasing something like a type face, with some clients we would mark it up by 10-20%, with some clients that price might need to be burried within something else. Sometimes we might not even mark up for a type face, if it is something that we are basically bying to use once or twice on some client work and then keep for our own use later. I think realisticly you have to take things like this on a case by case basis. <BR> <BR>I know some that would be fine with purchasing fonts. I know other thats would say, &#34;What th hell? $360 for a font? Why didnt you just use something you had&#34; and would then begin thinking that you are trying to cheat them in some way. <BR> <BR>Like I said with us, we have decided that billing for things of this nature needs to be delt with on a client by client basis. <BR>Were not the biggest firm, but we do have a good a good amount of people, and a modest sized client base.</font></font></font></font></font>
