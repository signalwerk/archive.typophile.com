    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">James -- <BR> <BR>I&#39;m excited you mentioned Giacomo. I had actually been looking at that face, strangley enough. <BR> <BR>But what concerns me is no SC&#39;s? And this system is laiden with acronyms and such. You think I can get by without it? <BR> <BR>Great suggestions, I think I may run them by the others and see what they think. <BR></font></font></font></font></font>
  - id: 25312
    user: 1947
    date: 2003-08-10T14:02:00
    date_raw: Sunday, August 10, 2003 - 2:02 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; <BR> <BR>I think you can get by without the SC. I have mixed feelings about SC in sans faces. I will probably make Sc for Giacomo in the future, but with its large x-height, all caps setting may not be as intrusive as with other more traditionally proportioned types. But hey, if having SC in Giacomo will speed its adoption, I&#39;ll make SC for Giacomo!</font></font></font></font></font>
  - id: 25315
    user: 1520
    date: 2003-08-10T14:25:00
    date_raw: Sunday, August 10, 2003 - 2:25 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I love Giacome, very nice and lively blend, I feel, between American Gothic and Italian Renaissance attitude, legible yet not bland. It could do with a small caps set, although the Sc should be part of the OTF-File... maybe an update for users or something? I wonder though, what Stephen doesn&#39;t like about the a.  <BR> <BR>Emigre&#39;s Priori by J.B. is also wonderful, although not really a very legible font, a bit too different. Still, I&#39;m waiting for the right job to justify buying the set... I love the capital letters they did for the sans serif. </font></font></font></font></font>
