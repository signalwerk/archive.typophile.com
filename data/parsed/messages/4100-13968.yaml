    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; Comes out to $6 per font per computer. Would it be better if I gave it away? <BR> <BR>Well, I think we both know the hard work that goes into developing something of this nature. <BR> <BR>I think the hand made Bentley wich sells at near the 300,000$ range is well worth the investment, but on my income, not quite realistic. <BR> <BR>I hate to have to admit it, but I think we all know we have to do our best to cut corners here and there. <BR> <BR>Hope you didnt find the previous post insulting -- this was definately not my intention. <BR> <BR>If it is any consoltation, I would only be using it on one system <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> maybe two tops. <BR> <BR>The OT crossplatform factor is quite an advantage though.</font></font></font></font></font>
  - id: 25523
    user: 1262
    date: 2003-08-11T23:19:00
    date_raw: Monday, August 11, 2003 - 11:19 pm
