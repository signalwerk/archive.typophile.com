  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I find myself trying to rethink an Corp ID i did some time back. <BR> <BR>Currently the type system consists of Trajan as titles, and the palatino family to take care of the rest, they/we are wanting to move to a more mordern appearence, from a more classical one. <BR> <BR>My question to you folk is this: <BR> <BR>The logo is in place &#40;for now&#41; and is basically a reversed out trajan. &#40;see here <a href="http://www.sharingway.com" target="_blank">http://www.sharingway.com</a>&#41; <BR>I am looking for a good san-serif face to pair with trajan. it has to have professional appeal, but needs to be a touch friendly, just not to cold. It also needs a fairly complete family &#40;ie. small caps, italics, and several weights, ligatures are always sexy too&#41; <BR> <BR>So, this said, any suggestions? <BR> <BR>Thanks.</font></font></font></font></font>'
