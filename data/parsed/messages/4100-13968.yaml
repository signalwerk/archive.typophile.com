    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This deserves it&#39;s own thread for sure James. I&#39;ve seen two  <BR>approaches out there: the big agency model and the studio  <BR>model. <BR> <BR>The big agencies buy the big libraries &#40;<a href="http://www.fontshop.com/virtual/index.cfm?area=SF_fonts&amp;subarea=SF_fonts_library" target="_blank">like these</a>&#41; <BR>and supplement as needed with single fonts from various  <BR>places. <BR> <BR>The studio model is more like Kyle described: <BR> <BR>a&#41; If at all possible, pass the cost on to your client. This  <BR>means padding the project expenses when you write the  <BR>estimate, if you foresee having to buy type. This model is  <BR>standard for photography and illustration and can be for  <BR>fonts, especially if it&#39;s more of a specialty face that you will  <BR>have a hard time reusing in your studio. <BR> <BR>b&#41; If you can&#39;t justify passing the costs onto your client,  <BR>invest in faces you will be able to use later.</font></font></font></font></font>'
