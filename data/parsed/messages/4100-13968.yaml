    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Kyle, are you looking for a face for use in text, or a secondary typeface to use with your Trajan logotype?  <BR> <BR>We just did a system that uses Trajan in the logotype, with Meta as the secondary typeface. I thought it was an odd pairing at first, but it works. I think it might work as your text face - it is fairly complete &#40;with small gaps and lining numerals, etc.&#41; <BR> <BR>I know Meta was SO used for a while, but it&#39;s &#34;trend&#34; status seems to have subsided a bit of late. You might just take a look.</font></font></font></font></font>
