    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#34;cooper&#34; = barrelmaker. &#40;barrel = big wood container&#41; <BR> <BR>Kuppa = so close to gentle Cooper black - yet so hard to tell whether it should be ONE pixel bigger overall to convey Cooper&#39;s humanity. <BR> <BR>But no! Let it live at this size, with this italic. <BR> <BR>TS: You mean welcome back Kotter? <BR>welcome back - your dreams were your ticket out. <BR>Welcome back - To the same ole place that you laughed about. <BR> <BR>MH: How are you going to do the punctuation? The cooper asterisk is a monster, let alone @ or Euro.  <BR> <BR>Sauna is fantastic, I have the book. It &#40;book&#41; survives reading in the shower. Kuppa adds the Nintendo crispness. Can they sit in a fat sweaty sauna together? [faints]</font></font></font></font></font></font></font></font></font></font></font>'
