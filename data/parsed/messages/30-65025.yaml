    date_raw: Tuesday, February 15, 2005 - 2:49 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">First of all i want to thank you all for helping me out in this matter.  <BR> <BR>Im doing a &#34;newspaper&#34; as a schoolwork. This newspaper is ought to be a renaissance newspaper who has all the history and happenings of the renaissance period in it.  <BR> <BR>My task is to &#34;design&#34; the newspaper so it looks like if its from that era. <BR> <BR>maybe ive done my self a little more clear of what i want.</font></font></font></font></font></font>
  - id: 93423
    user: 1250
    date: 2005-02-15T15:00:00
    date_raw: Tuesday, February 15, 2005 - 3:00 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Is it OK that newspapers weren&#39;t invented by the Renaissance? <BR> <BR>Maybe this could still make sense, but before you figure out what the &#34;look&#34; should be I think you need to think about the raison d&#39;�tre of a &#34;Renaissance newspaper&#34;. What sort of information might people back then have needed quick access to? Like the weather, or how inventions could end up helping them with their daily chores. Dunno. Consider the Farmer&#39;s Almanac stuff maybe - when/how did that start, and what did it turn into? <BR> <BR>Getting a grasp of this first will make your end result design much more meaningful - instead of just mimicking a contemporary newspaper with old letter styles or something. <BR> <BR>hhp</font></font></font></font></font>
