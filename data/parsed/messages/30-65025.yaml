    date_raw: Wednesday, February 09, 2005 - 4:32 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Bembo: 1495 <BR>Jenson: 1470 <BR>Poliphilus: 1499 <BR> <BR>Fons et origo.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 93078
    user: 571
    date: 2005-02-10T19:17:00
    date_raw: Thursday, February 10, 2005 - 7:17 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">hanif <BR> <BR>You might take a look at Monotype Pastonchi &#40;available from Monotype Imaging&#41;. When the metal version was released the promotional book that was issued &#40;printed, with specimen showings, by Giovanni Mardersteig&#41; indicated that it was a complete rethinking of what constituted a renaissance face &#40;based on hand written forms rather than printer&#39;s type, which at the time was also based on hand written forms&#41;. The Monotype metal version was released relatively late in the scheme of things so it never got its proper due. The digital version released by Monotype Typography in the late 90s is quite an exact replication of the metal version. It is quite an interesting and unique face.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 93082
    user: 909
    date: 2005-02-10T19:50:00
    date_raw: Thursday, February 10, 2005 - 7:50 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Pastonchi is indeed quite interesting.  <BR> <BR>One of our &#40;Adobe&#39;s&#41; faces that I quite like that takes the same theoretical approach - though with very different results - is Brioso. <BR> <BR>Regards, <BR> <BR>T</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 93117
    user: 2021
    date: 2005-02-11T03:51:00
    date_raw: Friday, February 11, 2005 - 3:51 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Guys, this is very clever, but bad advice. Hanif wants the real thing, not a latter-day version. <BR> <BR>He wants Beethoven and you&#39;re suggesting John Williams.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 93151
    user: 4754
    date: 2005-02-11T08:26:00
