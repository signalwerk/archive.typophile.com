  - id: 93207
    user: 571
    date: 2005-02-11T14:21:00
    date_raw: Friday, February 11, 2005 - 2:21 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Tiffany <BR> <BR>Pastonchi is not any less a revival than Bembo and Poliphilus are themselves tributes. In all three cases the typefaces are based on letterforms of the period. To say that Bembo or Poliphilus are exact copies of faces that existed in the 15th century is erroneous. They are simply reconstructions, as well as was Pastonchi. <BR> <BR>That Pastonchi did not fare as well as Bembo or Poliphilus has less to do with its pedigree than its late release, in 1928, and the much larger event that was forthcoming, that being the Great Depression. <BR> <BR>One can actually track the release or lack of release of foundry designs by the ups and downs of the back to back recessions that lasted from 1929 up to 1941, resolved only with the preparations for World War.</font></font></font></font></font></font></font></font></font></font>
  - id: 93209
    user: 108
    date: 2005-02-11T14:37:00
    date_raw: Friday, February 11, 2005 - 2:37 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">That isn&#39;t what I was saying. I agree that none of them are exact. But, I believe that the latter three are closer than is your suggestion of Pastonchi. I also know that this is all subjective. It is simply my opinion that Pastonchi, and Brioso for that matter, are less close to what might be called an accurate revival of the 1500-era garamond-style type. Pastonchi reminds me a bit of Perpetua for that matter.</font></font></font></font></font></font></font></font></font>
  - id: 93211
    user: 571
    date: 2005-02-11T14:54:00
    date_raw: Friday, February 11, 2005 - 2:54 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Tiffany <BR> <BR>I&#39;m confused. What do Bembo, Poliphilus, et al have to do with the later Garamond-like faces? <BR> <BR>Pastonchi was an attempt at correction of popular misconceptions about renaissance faces. Can&#39;t state it any more clearly than that. <BR> <BR>Reminds you of Perpetua does it? Hmmm.</font></font></font></font></font></font></font></font>
