    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Something like this? <BR><a href="http://www.typography.com/catalog/historicals/more2.html" target="_blank">http://www.typography.com/catalog/historicals/more2.html</a></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 93191
    user: 571
    date: 2005-02-11T13:38:00
    date_raw: Friday, February 11, 2005 - 1:38 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Nick <BR> <BR>Pastonchi is not a latter-day version of anything. It was effort on the part of Francesco Pastonchi and Eduardo Cotti to convey the letterforms of the Italian tradition in the fifteenth century. It was released by the Lanston Monotype Corporation, London about 1927. At least that is the date that is to be found on a printed specimen included in the printing of the Mardersteig book. The digital version was released by Monotype Typography in beta form in 1997. Does that make it a John Williams? <BR> <BR>The dates you give for Bembo, Jenson, Poliphilus are dates that are associated with the original printed specimens from which the early twentieth century metal versions of these faces were based. Since most digital typefaces did not exist before the mid-1980s how then do we find Beethoven?</font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 93196
    user: 108
    date: 2005-02-11T13:50:00
    date_raw: Friday, February 11, 2005 - 1:50 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Ok. I&#39;ll bite.  <BR> <BR>I would say that Pastonchi and Brioso both seem to be more a tribute to that era than an actual revival...if you follow me. If someone asked me for a typeface from that era--granted actually from the era is impossible--I would most probably follow Nick&#39;s recommendations. But, if someone wanted something that hints at or resembles that era with some of the dust blown of it then I could understand Pastonchi and Brioso. <BR> <BR>my 2¢</font></font></font></font></font></font></font></font></font></font></font></font>
