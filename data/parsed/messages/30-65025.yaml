    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Bembo: authentic form, but present day refinement and neatness of finish <BR> <BR>Adobe Jenson: authentic form, with a highly stylized, subtle mimicry of the quality of letterpess. <BR> <BR>Poliphilus: authentic form, with a great deal of &#34;distress&#34; to imitate rough letterpress printing.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
