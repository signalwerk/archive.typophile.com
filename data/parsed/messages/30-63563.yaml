ass="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">A shout-out to all Typophiliacs and friends in the NYC metro area. SOTA is coming to town on TypeCon2005 business the first week in February. There&#39;ll be an open townhall-style planning meeting and smaller get-togethers on the schedule. The main planning meetings will be held at the offices of our co-presenting partner, the Type Directors Club &#40;TDC&#41; on W. 25th in Manhattan.  <BR> <BR>If you&#39;re interested in helping with TypeCon2005 and would like to get together, please send me a private message and/or post here. If you can&#39;t make an in-person appearance this time, but would still like to be involved, let me know.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
