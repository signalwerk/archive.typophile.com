 3 = $62 per person <BR>$205 / 4 = $51 per person <BR> <BR>That&#39;s not so bad. <BR> <BR>Combine that with a TypeCon supported roommate finder service  <BR>and it&#39;s really a good idea to stick with the conference hotel.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
