  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">so this place is called The Eaves, its an attic like space that will be hosting experimental/rock type of music, very independent kind of stuff. i was trying to avoid something too generic or like the &#34;scene&#34;. the main type there is LHF becker monogram english, but its pretty modified.. especially the E. charlemagne is the THE. <BR>thoughts? it will be on backlit light panels, maybe a wood sign.<img src="http://www.typophile.com/forums/messages/29/39361.gif" alt="eaves logo"></font></font></font></font></font></font>
