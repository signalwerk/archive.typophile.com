    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think this is a great start . . . The overall feel of the typeface communicates what you are going for . . . <BR> <BR>A few suggestions: <BR> <BR>&#34;THE&#34; kind of looks like it is akwardly hanging out there -- it seems like it would fit perfectly in the space between the E and the tall swoop of the &#39;v&#39; . . . this would make it feel like more of a unit as well. <BR> <BR>The V is hard to read -- I thought the name was &#34;Eaues&#34; <BR> <BR>The space between the &#39;a&#39; and the &#39;v&#39; is also a bit akward because it is so defined. Perhaps making the &#39;v&#39; come to more of a point so it is more readable, will also solve this as well.</font></font></font></font></font>'
