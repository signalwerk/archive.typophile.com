    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Hey, those area beauties! Except all of your &#34;R&#34;s are pointing the wrong way. ;&#41; ::ducking:: <BR> <BR>Seriously, very nice job... crisply legible AND stylishly designed. <BR> <BR>I took Russian at the U. of Utah for a quarter &#40;don&#39;t ask ;&#41; &#41;. I may not be fluent, but I still recognize the glyphs. <BR> <BR>David Thometz </font></font></font></font></font></font></font></font></font>'
  - id: 665
    user: 1020
    date: 2001-10-03T16:56:00
    date_raw: Wednesday, October 03, 2001 - 4:56 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Thanks for the encouragement. <BR> <BR>Can I point your attention to the &#34;construct 11 pt&#34; versus the &#34;construct 12 pt.&#34; Notice the UC B and E, <BR>how the 11 pt has one pixel cross bars and the 12 pt has two pixel cross bars... <BR> <BR>I like the one pixel version because it is reminiscent of extra black wood type and seems  <BR>somehow appropriate and forgivable given the scale. However, is this awkward or somehow  <BR>historically inaccurate? What do you think? <BR> <BR>I&#39;m hoping to get this thing ready before bukva:raz. I think I better finesse my Russian  <BR>for the proofs though. Lorem ipsum doesn&#39;t quite work in Russian. <BR> <BR>//joe </font></font></font></font></font></font></font></font></font>
