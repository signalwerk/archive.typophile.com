  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Before I knew &#34;constructivism&#34; existed I was studying Russian in high school... Later, when I began studying design I fell in love with Rodchenko.  <BR> <BR>So, here it is--some traditional Cyrillic to start--in regular and bold. Followed by some more constructivist inspired stuff in heavier weights and sizes. <BR> <BR><IMG SRC="http://www.typophile.com/forums/messages/29/394.gif" ALT="sample"> <BR> <BR>Your honest feedback is appreciated. <BR> <BR>//joe</font></font></font></font></font></font></font></font></font>
