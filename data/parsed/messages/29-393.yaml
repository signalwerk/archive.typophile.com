    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Non-Latin bitmaps - YAY! <BR> <BR>In the case of Cyrillic &#40;with its cap-like <BR>forms squeezed into the x-height&#41; bitmaps <BR>are extra tricky. Brave man, our Joe! <BR>And I think your outline font rules. <BR> <BR>hhp </font></font></font></font></font></font></font></font></font>
  - id: 656
