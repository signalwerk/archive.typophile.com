  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> I am presently running Opperating System 10.2 and am searching for the best method/application to help me create a specimen book. Any suggestions? I am using Font Reserve as my font handler and am aware of it&#39;s ability to create specimen pages but I find it annoying to work with and am unsatisfied with my choices for specimen templates. Any help is appreciated, thanks. </font></font></font>
