    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I like the new design, it feels far more comfortable to me than the old one ever did and just seems to make more sense.  <BR> <BR>Its cute to see what people look like &#40;or however else they wish to be graphically depicted&#41; next to the posts too. Apologies for the use of the word cute there.  <BR>  <BR>Three things though:  <BR>  <BR>I very much do <i>not</i> like that shoutbox thingy thats now eating away at the right hand of my window. Why does everyone always assume that people use their browsers fullscreen?  <BR>  <BR>Secondly, I seem to have to log in an awful lot - why doesn&#39;t it &#34;stick&#34;?  <BR> <BR>And finally... voting? Nahhhh. <BR>  <BR>Nice work though <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0></font></font></font>'
