    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The &#34;Voting&#34; thing: <BR>Even ignoring my aversion to voting in general, the fact that you can vote on the same item as many times as you want means that some petty, vindictive users will often enter &#34;vote=1&#34; half a dozen times against all the posts of a given participant &#40;and necessarily anonymously&#41;. The voting thing might work fine when the thread is docile, but in a contentious situation it clearly becomes banal, and any sincere attempt at flagging an entry as worthwhile reading gets lost. <BR> <BR>So I propose you replace the voting with a simple binary, positive-only &#34;recommend&#34; flag, preferably with a cookie check to reduce &#40;you can&#39;t eliminate&#41; multiplexing. <BR> <BR>hhp <BR></font></font></font>'
