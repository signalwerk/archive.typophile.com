    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I have a tip for JFP and others having trouble finding the <BR>latest posts: Have the posts emailed to you. Set it up in your <BR>profile. You can pick only the threads or forums you&#39;re <BR>interested in. Then, to avoid in-box overflow, set a &#34;rule&#34;  <BR>or &#34;filter&#34; in your email client to send all Typophile messages <BR>to a seperate folder. All new posts are then easily seen in <BR>your mailbox. I&#39;ve set this up with Entourage, Outlook and <BR>OS X&#39;s Mail.app, so I&#39;m happy to help you get it working <BR>if you need any.</font></font></font>'
