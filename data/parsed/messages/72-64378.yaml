  html: '<font class="dontLookLikeCrap">Attention, New York Typophiles: TypeCon2005 is coming to town. <BR> <BR>TypeCon is the annual conference of The Society of Typographic Aficionados &#40;SOTA&#41;, an international not-for-profit organization dedicated to the promotion, study, and support of type design, typography, and the related arts. <BR> <BR>The date for TypeCon2005 is set - July 20-24, 2005, at Parsons School of Design. SOTA teams up with co-presenting partner, the Type Directors Club &#40;TDC&#41;, in bringing TypeCon to NYC. Other partners include the American Printing History Association &#40;APHA&#41; and Typophile. <BR> <BR>There will be a TypeCon2005 planning meeting on Thursday, February 3, 2005. Be prepared for brainstorming and fun.  <BR> <BR>Meeting details:  <BR> <BR>Thursday, February 3, 2005 / 6-8pm  <BR>Type Directors Club <BR>127 West 25th Street, 8th floor <BR>New York, NY 10001  <BR>Tel 212-633-8943  <BR> <BR>Feel free to invite your friends and colleagues in the NYC metro area who might be interested. Everyone is welcome! Please send email if you need more info about TypeCon2005, and to RSVP to the meeting. <BR> <BR><a href="mailto:info@typesociety.org">info@typesociety.org</a> / <a href="http://www.typecon.com" target="_blank">www.typecon.com</a> / <a href="http://www.typesociety.org" target="_blank">www.typesociety.org</a></font>'
