    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Ok, I&#39;m back... <BR> <BR>I successfully regenerated the PostScript versions of one of the font families that we had discovered this problem in. Clearing the HT glyph slot in FontLab and spitting out fresh files seems to do the trick. I cleared the font cache files with <a href="http://www.macosxcocktail.com/">Cocktail</a> prior to installing the new fonts and viewed/printed them using TextEdit. <BR> <BR>Here are some screendumps and additional commentary documenting what happened. <BR> <BR>1. Original Unactivated Fonts in FontAgent <BR><a href="http://www.flickr.com/photos/splorp/4424322/" target="_blank">http://www.flickr.com/photos/splorp/4424322/</a> <BR> <BR>2. Same Fonts Activated <BR><a href="http://www.flickr.com/photos/splorp/4424324/" target="_blank">http://www.flickr.com/photos/splorp/4424324/</a> <BR> <BR>3. FontLab Showing Occupied HT Glyph Slots <BR><a href="http://www.flickr.com/photos/splorp/4424326/" target="_blank">http://www.flickr.com/photos/splorp/4424326/</a> <BR> <BR>4. Regenerated Fonts Activated in FontAgent Pro <BR><a href="http://www.flickr.com/photos/splorp/4424323/" target="_blank">http://www.flickr.com/photos/splorp/4424323/</a> <BR> <BR>Thanks again Mark. I don&#39;t know how you managed to track this bug down, but it&#39;s appreciated. I suppose one or more of us should report this to Apple...</font></font></font>
  - id: 93029
    user: 1043
    date: 2005-02-10T12:03:00
    date_raw: Thursday, February 10, 2005 - 12:03 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Glad to be of service. I remember noticing this once but forgot to look into it. I&#39;m glad it came up.  <BR> <BR>As I mentioned briefly above, I have a font I made which has a glyph in the HT slot &#40;don&#39;t ask&#41; and as I went font by font through FontBook to see if any of my installed fonts had this wierd spacing problem, it stuck out like a sore thumb. Instead of a space it displayed the glyph the I had stuck in the HT slot. Mystery solved.</font></font>
  - id: 93153
    user: 1011
    date: 2005-02-11T09:02:00
    date_raw: Friday, February 11, 2005 - 9:02 am
    votes: null
    html: <font class="dontLookLikeCrap">I think I have enough information here, so I am going to try to submit a bug report specific to ATSUI and this reproducible problem. I can access the Apple Developer Connection bug reporting site through my developer account . I think this might be a better way to get this addressed than through the normal consumer-level bug reporting channels.</font>
