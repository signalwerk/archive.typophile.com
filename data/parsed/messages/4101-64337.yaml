  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Is sthere anyone else who have problems with some of you PS1 fonts loses the spacing in OSX rendered apps, but see no problem in Adobe apps?  <BR>This can be random fonts in a typefaces family. <BR> <BR>Anyone who&#39;s knows anything about this.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
comments:
  - id: 91665
    user: 1011
    date: 2005-01-31T12:44:00
    date_raw: Monday, January 31, 2005 - 12:44 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I have been discussing this same issue with Peter and can duplicate the problem on a fresh OS X installation - so it doesn&#39;t appear to be related to any font management utilities or other system extensions. The same fonts work perfectly under OS 9. The problem exists in several other libraries as well, just not every face is affected. Regenerated the font does not always fix the problem. <BR> <BR>Here are a couple of screen captures illustrating what we are seeing. <BR> <BR>The first image shows Fountain&#39;s Eric Sans and Udo families as they appear in Apple&#39;s TextEdit. Note that the space character appears to be complete missing from the italic weight of Eric Sans, while the word spacing is double what it should be in the Udo weight. <BR> <BR>The second image shows the same faces displaying with the proper spacing within Adobe InDesign 2.0.2 ... in fact any Adobe application under OS X &#40;including CS versions&#41; displays the fonts correctly. I am assuming that this is due to Adobe applications using CoolType to render text, rather then Apple&#39;s OS-based services. <BR> <BR><img src="http://www.typophile.com/forums/messages/4101/64353.gif" alt="Eric Sans and Udo in TextEdit"> <BR> <BR><img src="http://www.typophile.com/forums/messages/4101/64354.gif" alt="Eric Sans and Udo in InDesign"> <BR> <BR>Thoughts on this, anyone?</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 91733
    user: 799
    date: 2005-01-31T23:51:00
    date_raw: Monday, January 31, 2005 - 11:51 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Is it a bug in OSX? If so, then it&#39;s pretty big bug!</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 91754
    user: 1011
    date: 2005-02-01T07:01:00
    date_raw: Tuesday, February 01, 2005 - 7:01 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I can&#39;t see how it could be <b>not</b> be related to something in the way OS X renders PostScript typefaces. Like I mentioned before, the same fonts work perfectly well in OS 9. The same fonts work in Adobe applications which do not use the same method of rendering text. The fact that these odd spacing issues follow through to the printer indicates something dreadfully wrong with the way the operating system is handling the fonts.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 91757
    user: 1043
    date: 2005-02-01T07:18:00
    date_raw: Tuesday, February 01, 2005 - 7:18 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Have you tried clearing the font cache? You can do it with a utility such as <a href="http://homepage.mac.com/mdouma46/fontfinagler/" target="_blank">Font Finagler</a>.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 91759
    user: 799
    date: 2005-02-01T07:28:00
    date_raw: Tuesday, February 01, 2005 - 7:28 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Yes, tried that. I&#39;ve checked the Apple forums &amp; people have experienced problems with PS1 fonts on regular Apple applications.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 91761
    user: 1133
    date: 2005-02-01T07:33:00
    date_raw: Tuesday, February 01, 2005 - 7:33 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Grant, Peter,  <BR> <BR>Mac OS 9 and Adobe applications use Adobe software &#40;ATM/CoolType&#41; to render the Type 1 fonts. Mac OS X uses Apple&#39;s own ATSUI renderer. The most obvious differences are visible with hinting. Mac OS X displays some extreme deterioration of screen display of Type 1 font, which is &#34;ironed over&#34; a bit when the type is antialiased. But it&#39;s thoroughly possible that other aspects of the fonts, e.g. metrics, kerning, or special treatment of particular characters, is realized differently in the ATSUI model by Apple than in the ATM/CoolType model by Adobe.  <BR> <BR>Regards,  <BR>Adam</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 91764
    user: 1043
    date: 2005-02-01T07:43:00
    date_raw: Tuesday, February 01, 2005 - 7:43 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think I may have figured out what&#39;s going on. <BR> <BR>It seems to have to do with the HT character in the low ASCII range. If a font has a character defined there, the Apple rasterizer seems to display that instead of the usual space character when you type a space. Most T1 fonts don&#39;t have an HT character defined, which is probably why most T1 fonts don&#39;t have this problem. I wonder if this is some UNIX/Next thing from way back? <BR> <BR>I&#39;ve found a few on my system &#40;including some of my own&#41; which do have the HT character and they all exhibit this behavior. I don&#39;t remember adding this character to the fonts in question, but I do recall that it&#39;s easy to inadvertently define a character in FOG simply by selecting the character cell.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 91766
    user: 799
    date: 2005-02-01T07:52:00
    date_raw: Tuesday, February 01, 2005 - 7:52 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Mark, that makes sense, at least too why the spacing is so wide  in Udo &amp; the very narrow in EricSans Italic. But the other fonts in those 2 families have the same width in the HT slot. <BR>What would be a &#34;defined character&#34;? There&#39;s no vector points in that slot.  <BR>And what would be a solution? copying the &#34;Space&#34; width to &#34;HT&#34;?</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 91767
    user: 1043
    date: 2005-02-01T08:11:00
    date_raw: Tuesday, February 01, 2005 - 8:11 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think the solution would be to delete the HT character from the font. There&#39;s no reason to include it anyway. <BR> <BR>You can tell if it&#39;s been defined by opening the Type 1 font in FontLab. If the glyph cell is white, then it has been defined. It&#39;s not necessary for it to have any vector points to be defined. For instance, double-clicking on an empty &#40;gray&#41; cell in FontLab will define a new glyph 1 em wide with no outline data. <BR> <BR>The reason I know it&#39;s the HT character that&#39;s causing the trouble is because one of the fonts I tested is an old font I made which has a particluar character in that slot, and that character showed up instead of the expected space character in TextEdit and FontBook. I have a hunch there may be other low-ASCII characters causing problems as well in some cases. <BR> <BR>I think the rule here is: Don&#39;t define any low ASCII characters except for the ones which are part of the MacOS Roman character set &#40;e.g., Eth, eth, etc.&#41;. It didn&#39;t used to be a problem because the Adobe rasterizer ignored them, but apparently Apple&#39;s OS X rasterizer doesn&#39;t.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 91772
    user: 1043
    date: 2005-02-01T08:17:00
    date_raw: Tuesday, February 01, 2005 - 8:17 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">BTW, in FOG you can tell if a character has been defined by the bold outline on the top of the character cell. Also, in FOG the HT character is labeled &#34;TAB&#34;.</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 91774
    user: 799
    date: 2005-02-01T08:20:00
    date_raw: Tuesday, February 01, 2005 - 8:20 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I checked  &amp; yes � the italic HT slot/cell is white, and so are many of the other slot/cell around it &#40;except for the MacOS Roman character set &#41;The strange thing is that so are the slots in the Regular, which doesn&#39;t show the same problem as the italic.  <BR> <BR>Should i remove all of them..or is there a way to undefine them in Flab? <BR> <BR>Thank you for the help :-D</font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 91776
    user: 1011
    date: 2005-02-01T08:22:00
    date_raw: Tuesday, February 01, 2005 - 8:22 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks for the clues Mark. Great sleuthing. <BR> <BR>This is all making much more sense now. The difficulty I was having was determining whether some component of the fonts themselves were the trigger. Up until now, I wasn&#39;t able to see anything obviously different between faces that worked and those that displayed the spacing problem. <BR> <BR>I am going to regenerate a few of the Test Pilot Collective and Virus faces that I have source files for and try to confirm that this is the case.</font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 91777
    user: 1043
    date: 2005-02-01T08:23:00
    date_raw: Tuesday, February 01, 2005 - 8:23 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">In FontLab: Select the glyph cell and then hit delete on your keyboard. <BR> <BR>In FOG: Select the character cell and choose &#34;Clear&#34; from the Edit menu.</font></font></font></font></font></font></font></font></font></font></font>'
  - id: 91780
    user: 1043
    date: 2005-02-01T08:29:00
    date_raw: Tuesday, February 01, 2005 - 8:29 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>&#62;The strange thing is that so are the slots in the Regular, which doesn&#39;t show the same problem as the italic.</i> <BR> <BR>I&#39;m not sure why that would be, but it&#39;s obviously unintended behavior and may not always happen for some reason we haven&#39;t figured out yet. <BR> <BR>No doubt those slots were really meant to be left undefined, but since it didn&#39;t used to cause problems, it didn&#39;t used to matter. I bet programmers have a name for this sort of thing. </font></font></font></font></font></font></font></font></font>
