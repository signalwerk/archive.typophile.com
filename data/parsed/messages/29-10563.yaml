    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Durex condoms? Interesting. It does look a little rubbery. I think it suits logotype better than text, but it does have too much character. Perhaps a little refinement could personalize it. <BR> <BR>Is that &#34;s&#34; part of the typeface? It looks a little wonky, particularly leading to the spurs. <BR> <BR>The logotype looks a little tight in the &#34;sim&#34; or loose in the &#34;pro.&#34; <BR> <BR>The proportion of &#34;simpro&#34; to &#34;solutions&#34; is too extreme. If the logotype gets any smaller, &#34;solutions&#34; will become specks. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/11305.gif" alt="simpro small"> <BR> <BR>The molecular metamorphosis occuring on the left half of the &#34;o&#34; looks a little lumpy and complicated. The forms could be smoothed and simplified to better effect. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/11306.gif" alt="simpro o"> <BR> <BR>Hope that helps! <BR>Cheers.</font></font></font></font>
