    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think it would look nice with just a dot pattern making the left half of the &#34;o&#34; - without the weird connectors and ambiguously shaped blobs. <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> <BR> <BR>I agree that &#34;solutions&#34; is too small. I would try putting it after &#34;Simpro&#34; in a font that is one to two-thirds the size. In dark blue, of course. <BR> <BR>Paul </font></font></font></font>
