    html: <font class="dontLookLikeCrap">Hello Mr. Joe Pemberton. <BR>I am late for the wishes, but I hope not much, <BR>and I have to say I find lovely this kind of threads. <BR>Back on 1997 I spent some time in London, a Jamaican <BR>guy called Andrew Pemberton lodged me; now I lost the <BR>contact with him, but here, well, just a short story <BR>that came to my mind because of your name. <BR> <BR>AS</font>
