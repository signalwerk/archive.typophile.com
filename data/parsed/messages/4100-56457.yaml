    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Ive seen previous issues of &#39;Lodown&#39; and they were quite nicely designed.. Back then they were all about life, surfskatesnow, style, music and what I would like to call &#39;alternate arts&#39;.. <i>A tad too trendy sometimes, maybe, but nice nonetheless..</i> <BR> <BR>&#39;Die Gestalten&#39; released two books, &#39;<a href="http://www.die-gestalten.de/display.php?template=verlag.php&amp;usetmpl=71&amp;cat=1&amp;sub=3&amp;item=132" target="_blank">Lodown</a>&#39; &#43; &#39;<a href="http://www.die-gestalten.de/display.php?template=verlag.php&amp;usetmpl=71&amp;cat=1&amp;sub=3&amp;item=131" target="_blank">Schizophrenic</a>&#39;, dedicated to the design of &#39;Lodown&#39;.: <BR><i>&#62; <a href="http://www.die-gestalten.de/display.php?template=verlag.php&amp;usetmpl=71&amp;cat=1&amp;sub=3&amp;item=132" target="_blank">www.die-gestalten.de/display.php?template=verlag.php&amp;usetmpl=71&amp;cat=1&amp;sub=3&amp;item=132</a> <BR>&#62; <a href="http://www.die-gestalten.de/display.php?template=verlag.php&amp;usetmpl=71&amp;cat=1&amp;sub=3&amp;item=131" target="_blank">www.die-gestalten.de/display.php?template=verlag.php&amp;usetmpl=71&amp;cat=1&amp;sub=3&amp;item=131</a></i></font></font></font></font></font></font></font></font>'
  - id: 87325
    user: 5514
    date: 2004-12-23T01:16:00
    date_raw: Thursday, December 23, 2004 - 1:16 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The first one is indeed the best, in my opinion. And the reason for that is the way the photograph gets the message across. It is an interesting image which makes you wonder - always a good thing. <BR> <BR>Since this image works well, I think you shouldn&#39;t let typography get in the way too much. As it is, all kinds of fonts and typographic treatments compete for attention, and the end result lacks uniformity because of this. <BR> <BR>So some suggestions: <BR>- Try using one font for all the lettering; this may feel slightly boring, but isn&#39;t that exactly what this cover is about? <BR>- Try moving &#39;not with&#39; lines to the bottom, to maximize the effect of the photograph <BR>- Treat the title of the magazine more like a logo instead of two fonts next to each other.  <BR> <BR>Good luck!</font></font></font></font></font></font></font>'
