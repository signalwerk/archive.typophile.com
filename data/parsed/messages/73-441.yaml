  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The Goudy International Center for Font Technology and Aesthetics &#40;Rochester Institute of Technology&#41; <BR> <BR>The Goudy International Center for Font Technology and Aesthetics is the first worldwide independent resource center for dissemination of information about type, its history, development, and its use in documents, and is housed in the School of Printing Management and Sciences at Rochester Institute of Technology. The Center offers courses addressing a broad range of technical, aesthetic, historic, and legal aspects of alphabets and typefaces, including those from both Western and non-Western cultures, as well as offering courses focused on the typography and design of documents. A major area of concern in the Center&#39;s courses and research is the development of multicultural document creation skills. <BR> <BR><A HREF="http://www.rit.edu/~goudyctr/" TARGET="_top">http://www.rit.edu/~goudyctr/</A></font></font></font></font>
