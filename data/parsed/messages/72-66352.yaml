    html: <font class="dontLookLikeCrap">UPDATE <BR> <BR>The course will be held Wednesday evenings, from 4-7 PM &#40;not 7-10 PM&#41;, <BR>starting on May 18 and ending on August 17. We are being provided with two <BR>classrooms, one for discussion/sketching, the other for computer work. Also, <BR>there will be a field trip to Archetype Press as well as a guest presenter. <BR> <BR><a href="http://www.artcenter.edu/atnight/coursedescription.jsp?xd=advertising+%2B+graphic+design&amp;xid=2578&amp;id=5406&amp;loc=PAS" target="_blank">http://www.artcenter.edu/atnight/coursedescription.jsp?xd=advertising&#43;%2B&#43;graphic&#43;design&amp;xid=2578&amp;id=5406&amp;loc=PAS</a> <BR> <BR>Registration begins April 11, and enrollment is limited to 12 &#40;not 10&#41; students. <BR> <BR>Hrant Papazian <BR>The MicroFoundry <BR>hrant_at_inverselogic_dot_com <BR><a href="http://www.artcenter.edu/atnight/facultydetail.jsp?id=3225" target="_blank">http://www.artcenter.edu/atnight/facultydetail.jsp?id=3225</a></font>
