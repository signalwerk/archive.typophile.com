  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap">ADVANCE NOTICE <BR> <BR>This summer I will be offering &#34;Introduction to Typeface Design&#34; &#40;E/402&#41; through Art Center College of Design&#39;s Art Center at Night program. This 14-week course will be held at the new &#34;Windtunnel&#34; South Campus &#40;950 S Raymond Ave, Pasadena&#41; one night a week &#40;from 7 to 10 pm&#41; from the 3rd week of May through the 3rd week of August. Exact weeknight to be determined soon. <BR> <BR>From the upcoming catalog: <BR>This new course nurtures a deep appreciation of typography through the exploration of classical and experimental letterform design. Discover why new fonts are created, examine several philosophies of letterform design, and explore the difference between text and display typefaces, as well as the differences between other lettermaking disciplines &#40;e.g. calligraphy, lettering&#41; and type design. Hand-drawn, traced, and digital letterforms will be compiled into working typefaces using FontLab software. Projects will first emulate existing letterforms, then develop into the beginning designs for a new typeface, including the application of spacing/kerning, test sheets and a simple specimen. Prerequisite: Form &#43; Letterform, or by permission of an Art Center counselor. <BR> <BR>Since type design can be a highly personal thing for most people, the emphasis on individual attention will be a central part of this course. Students will be encouraged to start their own journey towards a hobby or a career in the craft of type design, exploring their talents and refining their skills. <BR> <BR>Registration begins April 11. <BR>Enrollment is limited to 10 students.   <BR><a href="http://www.artcenter.edu/atnight" target="_blank">www.artcenter.edu/atnight</a>  <BR>626-396-2319 <BR> <BR>Hrant Papazian <BR>The MicroFoundry <BR>hrant_at_inverselogic_dot_com</font></font>'
