    date: 2003-08-29T15:13:00
    date_raw: Friday, August 29, 2003 - 3:13 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think the only glyphs that don&#39;t work are those with too <BR>many traps, like the &#39;o&#39; and &#39;e&#39;. What happens if you only <BR>do two corners &#40;on opposite ends&#41;? It&#39;s really nice, Jared. <BR> <BR>&#39;g&#39; seems a bit wide. Maybe reign in the bottom half <BR>one pixel from the left.</font></font></font></font></font></font>
  - id: 27809
    user: 1014
