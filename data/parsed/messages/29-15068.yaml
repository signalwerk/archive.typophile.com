  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">It&#39;s been a while since I&#39;ve posted anything, so lest you think I actually know what I&#39;m doing, I&#39;ll post a little sum&#39;n sum&#39;n I&#39;ve been working on. This was built entirely in <a href="http://www.font.to/cgibin/at.cgi?a=227536">Bitfonter by FontLab</a>. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/15069.gif" alt="pixeltrap"></font></font></font></font></font></font>
