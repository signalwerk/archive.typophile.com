    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Kewl. You know, I don&#39;t usually comment on pixel fonts &#40;not my bag&#41; but . . . One thought: I think either you should also notch the shoulder of the &#39;h&#39;, or else remove the &#34;underarm&#34; pixel. That stem-arch joint just seems too solid. <BR> <BR>-- K.</font></font></font></font></font></font>'
  - id: 27808
