    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Also, I am familiar with Miguel&#39;s amazing work,  <BR>I&#39;d just like to see some other people jump in, too. <BR> <BR>bj</font></font></font></font></font></font>
  - id: 27818
    user: 1109
    date: 2003-08-29T15:22:00
    date_raw: Friday, August 29, 2003 - 3:22 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Jared, <BR> <BR>Nice font specimen. I think that the tails of f, g and y are too decorative. I like the optical internal greys, looks great. BTW, I want to buy a Bitfonter that can produce pixel fonts optimised for flash, and maybe a new version who can generate super pixel fonts, vector with greys. I am a windows user, but if bitfonter can offer a new version for those who design pixelfonts...it would be great! I never knew if Bitfonter was a sucess of sales for Pyrus anyway.. <BR> <BR>MH.</font></font></font></font></font></font>
  - id: 27833
    user: 1011
    date: 2003-08-29T16:38:00
    date_raw: Friday, August 29, 2003 - 4:38 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Miguel said: <i>I think that the tails of f, g and y are too decorative.</i> <BR> <BR>I like those tails Jared, but they do look a bit out of context with the rest of the face. Perhaps you could derive two versions of the characters: one that is a straighter gothic sans; and one that is more decorative - sort of a sans w/swash lowercase. <BR> <BR>Or, whatever. <BR> <BR>Regardless, it looks swell.</font></font></font></font></font></font>'
  - id: 28011
    user: 1250
    date: 2003-09-01T21:59:00
    date_raw: Monday, September 01, 2003 - 9:59 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Has it been 72 hours? I really can&#39;t hold it in any more...  ;-&#41; <BR> <BR>I personally like large pixelfonts in general, not least because there are so few of them! This is a strange one &#40;in a good way&#41;, and the main question about it seems to be: what&#39;s it for? <BR> <BR>If it&#39;s for good performance in video, then the trapping is going to look strange versus &#34;display&#34; usage, but OK functionally. So if you&#39;re shooting for the former, you&#39;ll have to put in more traps &#40;like in the &#34;I&#34; - yes, I can see the trickiness there&#41;, but if it&#39;s for the latter you&#39;d probably need to balance them aesthetically &#40;generally by reducing the trapping in some glyphs&#41;. <BR> <BR>As to the somewhat unorthodox glyphs &#40;like the &#34;g&#34; and &#34;y&#34;&#41;, I honestly can&#39;t figure out if they should stay or go... One thing about the &#34;g&#34; though: it&#39;s too wide, and leaning rightward - try to make the join to the tail thinner and within the left bound of the head. <BR> <BR>hhp <BR></font></font></font></font></font></font>'
  - id: 28068
    user: 3
    date: 2003-09-02T13:30:00
