    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks everyone for your feedback! I&#39;ve been refining as you&#39;ve been posting and will post another sample later this week when I get a window of time. <BR> <BR>jb</font></font></font></font></font></font>
  - id: 39606
    user: 2046
    date: 2003-11-30T01:54:00
    date_raw: Sunday, November 30, 2003 - 1:54 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The starstruck g and y are fine to my eye, maybe because they look great from 5 feet away. A fitter quote might go, &#34;Pixeltrap attains its shape at a distance of 5&#39;, or 120 dpi, whichever comes first.&#34; <BR> <BR>I am not teasing. Photonic analog interference is wild and real between the viewer and the display. Only those with digital eyes will see strange lighttraps. <BR>&#60;self-serving&#62; maybe some of them want to be gray. &#60;/sans&#62;</font></font>
