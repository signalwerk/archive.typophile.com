    date_raw: Friday, August 29, 2003 - 3:14 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Yeah, it&#39;s very good, imo, nice work. <BR> <BR>Like best, the lc y and g, but all of them grab your attention. <BR> <BR>It seems to me that pixel display &#40;bigger than 8 or 9 px&#41; <BR>is a niche that is not being fully served and it&#39;d be nice to <BR>see more faces like this. <BR> <BR> <BR> <BR>bj <BR> <BR> <BR> <BR> <BR> <BR></font></font></font></font></font></font>
  - id: 27812
