    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">What about this? <BR> <BR><a href="http://www.octavo.com/" target="_blank">http://www.octavo.com/</a> <BR> <BR>I would like to get some of these for my birthday.</font></font></font></font></font>
  - id: 79074
    user: 1250
    date: 2004-10-18T21:40:00
    date_raw: Monday, October 18, 2004 - 9:40 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Well, nobody&#39;s gonna loan you their Eusebius to slap on a scanner!  :-&#41; It&#39;s not highly difficult to get to handle some of those old gems &#40;try a good university&#41;, but getting permission to squish them down or expose them to strong light is another matter. Maybe if you had a really good macro photography setup that could work in low light, you might get somebody somewhere to OK it. The big-name &#34;revivalists&#34; often have important friends, or they might work directly from the punches or matrices. <BR> <BR>But Octavo is indeed one good way to get at that type of stuff. Good facsimiles are another, but they do have to be good enough. You might also find enlargements of snippets of text here and there, like in that Gaskell article: &#34;Photographic Enlargements of Type Forms&#34; in the Journal of the Printing Historical Society, #7, 1971, pp 51-53. <BR> <BR>hhp</font></font></font></font>'
  - id: 79075
    user: 1085
    date: 2004-10-18T23:38:00
    date_raw: Monday, October 18, 2004 - 11:38 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Whoa, Nick Jenson� <BR>unfortunately, none of his punches have survived, to my knowledge. I think that the oldest known punches are Garamond&#39;s, in the Plantin-Moretus Mueseum in Holland. <BR> <BR>New England &#40;and New York&#41; are awash in old Jenson books, if you look in the right libraries. Both Brown and Harvard have them, for instance� others must, too. Many of the libraries may have &#34;official photographs&#34; on record as well, which might be reproducable when the books are not. But librarians can be very protective. Have good answers ready.</font></font></font>
  - id: 79106
    user: 4825
    date: 2004-10-19T07:05:00
    date_raw: Tuesday, October 19, 2004 - 7:05 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Fortunately, I don&#39;t need punches, just images of his prints. <BR> <BR>Before I actually design anything, I want to go through the motions in FontLab with a variant of an existing typeface. I saw an enlargement of some Roman type by Jenson in &#39;The Elements of Typographic Style,&#39; by Robert Bringhurst, and realized it would be a lot of fun to make an &#34;antique&#34; variant of it, complete with alternates. A good starter project. I might even degrade the quality further and make an &#34;ancient&#34; style face. Much as I adore Caslon Antique, I think it misses some of the flavor I see in this Jenson sample. <BR> <BR>Thanks for all the suggestions! Octavo.com already has me drooling...</font></font>
  - id: 79138
    user: 108
    date: 2004-10-19T09:10:00
    date_raw: Tuesday, October 19, 2004 - 9:10 am
    votes: null
    html: <font class="dontLookLikeCrap">You could always research at different special collection libraries. Most libraries have the availability of photography and photocopying available. For instance, the <a href="http://sc.lib.byu.edu/" target="_blank">L. Tom Perry Special Collections</a> has an amazing collection of books from the incunable period and beyond.</font>
