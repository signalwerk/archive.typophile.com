  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;m looking for hardcopy or hi-res files of very old type, such as original work by Nicolas Jenson. Where do the revivalists get their samples? <BR> <BR>I&#39;m also looking for old magazines and pulp fiction in the public domain, especially British, French and German. Are there any good resources on the web?</font></font></font></font></font></font>
