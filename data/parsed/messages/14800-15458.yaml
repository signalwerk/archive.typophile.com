    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Randy, good idea. <BR> <BR>We  have plenty of top-notch type designers here. <BR> <BR>Anyone want to share ideas on how this could be set up? <BR> <BR>It could be as simple as a designer sending Randy and Kyle <BR>an email, I suppose. <BR> <BR>Randy, Kyle, your thoughts....</font></font></font></font>
  - id: 29268
    user: 618
    date: 2003-09-10T11:34:00
    date_raw: Wednesday, September 10, 2003 - 11:34 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Sure, send me an email. <BR> <BR>I know how it shouldn&#39;t work :-&#41;  <BR>The experienced designers should NOT post-up �Hey, everyone I&#39;m happy to take someone on.� How long will it be before they&#39;re overwhelmed with email -- take me, take me. <BR> <BR>I think there are two real possibilities: <BR>1&#41; People who are serious about learning nominate themselves, and they are contacted by interested parties. <BR>2&#41; People who are serious about learning contact whomever they want to work with and ask nicely.  <BR> <BR>In the end #2 seems better. It puts the responsability where it belongs, on the person who wants to learn. If nobody responds to your contact, they probably didn&#39;t have time to work with you anyways. Just takes a little courage to make the call, send the email &#40;or go to a type-conference and chat collaborate face to face&#41;. <BR> <BR>Looks like the SOTA conference in the Bay Area will be my first chance to rub elbows with you type weirdos :-&#41; <BR>Vancouver was just out of the question right now. <BR> <BR>Cheers, <BR>Randy</font></font></font></font>'
  - id: 29338
    user: 604
    date: 2003-09-10T17:38:00
    date_raw: Wednesday, September 10, 2003 - 5:38 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I agree...emails usually work best. <BR> <BR>Maybe after the collabos are established, the participating parties could either:  <BR>� Announce on Typophile that they&#39;re starting a collaboration. <BR>� Post the results of the collaboration <BR>or <BR>� Keep it all to themselves and not let us nosy bastards in on their hard work. <BR> <BR>The second or third options seem the best, given how side projects can sometimes fizzle and fade away. <BR> <BR>Just to be clear, Randy, are <i>you</i> wanting to collaborate on something? I&#39;ve got the email ready if that&#39;s the case.</font></font></font></font>'
  - id: 29470
    user: 618
    date: 2003-09-11T08:52:00
    date_raw: Thursday, September 11, 2003 - 8:52 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Yes, I&#39;m interested in collaboration. I&#39;m interested in  <BR>developing skills for designing text faces &#40;serif and sans&#41;. I  <BR>have done several projects this realm  &#40;prodigal and  <BR>friday_fonts&#41; and want to take it to the next level. <BR> <BR>Kyle, I&#39;ve no idea what you&#39;ve got in mind, by all means  <BR>shoot me that email and we&#39;ll see where this goes.  <BR> <BR>BTW, I would consider myself the inexperienced wheel in  <BR>most collaborative bicycles, particularly involving the  <BR>interests I mentioned &#40;for example, I&#39;ve never drawn an  <BR>italic&#41;. <BR> <BR>Regards, <BR>randy&#40;at&#41;aquatoad.com</font></font></font></font>
