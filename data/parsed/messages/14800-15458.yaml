  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I was wondering if anyone would be interested in a one on one collaboration on a font? I don&#39;t really know what this would look like, but it just seems like it would be really great to pair up a respected/established designer with someone just getting started.  <BR> <BR>Don&#39;t get me wrong, having a slew of people say, &#34;<i>tweak the terminal on the f, and the 6 looks a tad wide</i>&#34; is useful and great, but to have the same mentor talk you through revisions would be amazing. <BR> <BR>Maybe you just work through HAMBURGEFONTS/hamburgefonts. I dunno? Time is of great value to everyone, so it must not become a burden for either. Perhaps an email every couple of days or once a week? <BR> <BR>Just a thought when I saw the collaborative threads. <BR> <BR>Regards, <BR>Randy`</font></font></font></font>
