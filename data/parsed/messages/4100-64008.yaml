    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">the mark makes a lot of sense - for a production house.  print the mark out and draw over the top of it all the ways you could make the d and p connect.  I am seeing vhs, reel to reel, 35mm film from above...lots to go on here - i think the wordmark below is way too small compared to the large size of the logo. also I would try some variations with the typeface on the wordmark.  Does it have to be sanserif?  could you add something if dp was sans and productions was serif? <BR> <BR>good luck.</font></font></font>
