  - id: 29900
    user: 1014
    date: 2003-09-14T23:00:00
    date_raw: Sunday, September 14, 2003 - 11:00 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">hmm, do you mean &#34;tints&#34; ... <BR> <BR>in this design &#40;.001&#41;, you have solid <BR>contiguous shapes and you&#39;d just <BR>print that 3 color, imho. <BR> <BR>You&#39;d have red, dark burgundy, and <BR>the third color, which is kinda slate grayish. <BR> <BR>You could match the slate gray <BR>or you could use clear ink to achieve <BR>a similar effect. <BR> <BR>The clear ink will darken the fabric and <BR>could achieve an effect as shown. <BR> <BR>We use a base plate of white <BR>so the fabric color isn&#39;t a factor. <BR> <BR>Because the designs in this competition are <BR>entirely vector, there&#39;s no need for halftones, <BR>which are used for raster art. <BR> <BR>as far as tints... <BR> <BR>Tints off a main color tend to cheapen the look of T-shirt <BR>designs, in my opinion,  <BR>because of the coarse line screen, typically <BR>less than 85; the dots are quite big. <BR> <BR>They work great in print! <BR> <BR>Our local screenprinter, the printer who&#39;ll print the <BR>Typophile shirts, is the primary printer for <BR>Split, Quiksilver, Volcom, Freshjive and <BR>a bunch of others...so we are in good hands. <BR> <BR>The operation is quite massive <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0>. The place <BR>has 28 automatic machines of 12 color or more, all of  <BR>them laser sighted. I could find out what brand they <BR>are. Anyway, the printer is always printing with <BR>new inks and new techniques so I will advise <BR>Jared and Joe on options depending on which <BR>design wins. <BR> <BR>diff. screenprinters do diff. things. but that&#39;s <BR>the info from this end. <BR> <BR>bj</font></font></font></font>
