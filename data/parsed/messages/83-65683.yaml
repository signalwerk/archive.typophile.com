    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Yves is on the right track. Add a little thorn to Neutraface,  <BR><a href="http://ms-studio.com/FontSales/proximasans.html" target="_blank">Proxima Sans Black</a>, or <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=LH.107898.0.11&amp;attributes.sampleSize=48&amp;sampleText=G&amp;sampleSize=188" target="_blank">Avenir</a> and you get close to the G.</font></font>
