    html: <font class="dontLookLikeCrap">Use <a href="http://www.myfonts.com/fonts/linotype/itc-serif-gothic/extra-bold/testdrive.html?s=G&amp;p=72" target="_blank">ITC Serif Gothic</a> and you don&#39;t need to add the thorn, just file off the serifs <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0></font>
