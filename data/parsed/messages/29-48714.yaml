    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I really like the swashy illustration of a truck logo. At first glance you&#39;d think it&#39;s cliche, but I honestly can&#39;t think of any trucking logos I&#39;ve seen on the highway go with that type of style. <BR> <BR>I do like your last wordmark. I can see that working quite nicely. I don&#39;t think the &#39;P&#39; by itself really works, though.</font></font></font></font></font></font></font></font></font>
  - id: 75427
