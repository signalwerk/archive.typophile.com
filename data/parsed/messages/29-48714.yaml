    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think you&#39;re getting somewhere. This successfully captures the essense of what you seem to be going for. Darrel is right about the &#34;P&#34;. It&#39;s off balance�heavy on the right &#40;weight &#43; motion&#41;. I think the &#34;P&#34; that you had before, with the tail on the last feather extending past the P-stem was more balanced. Also, the dot over the &#34;i&#34; is a little flat. It probably needs either less of an arc on the round/right side, or it just needs to be taller. <BR> <BR>Overall, I really like it. <BR> <BR>Aloha! <BR>Scott</font></font></font></font></font></font></font></font>
