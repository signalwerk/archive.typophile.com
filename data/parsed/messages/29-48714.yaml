    date: 2004-09-10T14:16:00
    date_raw: Friday, September 10, 2004 - 2:16 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">And here is some sketches that we did... <BR> <BR><img src="http://www.typophile.com/forums/messages/29/48731.jpg" alt=""></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 74954
    user: 2236
    date: 2004-09-10T14:18:00
    date_raw: Friday, September 10, 2004 - 2:18 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I love the fast service cafeteria logo they are currently using. Do they specialize in pizza? <BR> <BR>Of the posted designs, I also prefer #2. <BR> <BR>Have you explored any concepts with the winged P starting the word P&#43;remier? I think having one &#34;fast&#34; read, rather than two &#40;icon &#43; title&#41; might work well here. It might also allow for a streak, or flowing line, or some other graphic element to keep the P from looking like a stand alone &#34;super P&#34;�You would just have to be careful to maintain a sense of unity between the P and whatever other element you used. <BR> <BR>You&#39;ve made a good start. <BR> <BR>Aloha! <BR>Scott</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 74955
    user: 108
    date: 2004-09-10T14:25:00
    date_raw: Friday, September 10, 2004 - 2:25 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">What Scott just articulated is what I meant, or was getting at meaning, when I suggested two different &#40;and yet the same&#41; logos. The idea being that the P could serve on doors and smaller areas while the main logo, if you like, would be the winged P-remier</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 74956
    user: 2236
    date: 2004-09-10T14:26:00
    date_raw: Friday, September 10, 2004 - 2:26 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Oops! It looks like you posted while I was typing. <BR> <BR>I think  you&#39;ve taken the right direction. The thing that seems to be missing in all of these is a sense of being &#34;Premier&#34;. Your &#34;P&#34; indicates fast movement, or transport, but there needs to be some element in their identity/brand that indicates that this is a premier company. Maybe it will come in the application treatments &#40;metallic inks, elegant sophistication in type treatments, etc.&#41;. For starters, IMO, I don&#39;t think the green is contributing to this.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 74961
    user: 2331
    date: 2004-09-10T14:37:00
    date_raw: Friday, September 10, 2004 - 2:37 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Whoa... this is one fast moving forum! I&#39;ve been trying to make the winged p work as the first letter in the work Premier but am struggling with the fact that it&#39;s outlined. Do you think an outlined typeface would work well as a logo? <BR> <BR><img src="http://www.typophile.com/forums/messages/29/48743.jpg" alt=""></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 74964
    user: 2331
    date: 2004-09-10T14:40:00
    date_raw: Friday, September 10, 2004 - 2:40 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Forgot to post... the green colour is something that they don&#39;t want to change as most of their trucks are green. I plan on using brushed aluminum and frosted glass in their signage... so that should help the &#34;Premium&#34; part of the name really shine. <BR> <BR>Thanks for all the feedback!</font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 74982
    user: 2236
    date: 2004-09-10T15:43:00
    date_raw: Friday, September 10, 2004 - 3:43 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think outlined logotype could work�It&#39;s just a challenge to make it work; but hey, that&#39;s what we do. It is also possible for an outlined &#34;P&#34; to coexist with other solid letterforms. You&#39;ll have to really work the positive/negative play with either of those options. <BR> <BR>Aloha! <BR>Scott</font></font></font></font></font></font></font></font></font></font></font></font>
