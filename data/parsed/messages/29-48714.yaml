    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Jesse- <BR> <BR>I&#39;m a big fan of this P that you posted previously. I think it&#39;d be interesting if you continued developed a wordmark &#34;PREMIER&#34; in all capital letters starting with this P.  Perhaps the &#34;P&#34; could be a larger cap than &#34;REMIER&#34;.  When I think of trucking, I think of strength.  The graphic edges of this P convey strength to me.  Can you tell us more about the types of clients that Premier serves? <BR><img src="http://www.typophile.com/forums/messages/29/49822.jpg" alt=""></font></font>
  - id: 76707
    user: 2236
    date: 2004-09-25T11:18:00
    date_raw: Saturday, September 25, 2004 - 11:18 am
    votes: null
    html: <font class="dontLookLikeCrap">If you were to pursue Ty&#39;s suggestion, you could remedy the off balance &#40;heavy on the right&#41; &#34;P&#34; by having it cut into the small caps &#34;R&#34;�that way the &#34;R&#34; would bare some of the weight of the right side of the &#34;P&#34;.</font>
