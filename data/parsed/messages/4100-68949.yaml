    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I would think that it is important first to see the style of the illustrations, and the space they take up, how the type will fit in, and how much text you have. Also the emotional tone. Is it warm and fuzzy, or scary or funny? Then you could narrow down what would work a lot better.</font></font></font></font></font>
