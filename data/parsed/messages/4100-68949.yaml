  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi everyone, <BR> <BR>i ll be designing/typesetting a &#39;fairy taleish&#39; Kid&#39;s book which is based on hand-drawn illustrations. <BR> <BR>I&#39;d like some suggestions for suitable fonts &#40;headlines &amp; captions&#41;. <BR> <BR>Thanks for your help, <BR> <BR>Seb</font></font></font></font></font></font></font></font></font></font>
