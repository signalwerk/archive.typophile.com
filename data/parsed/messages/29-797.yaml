  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Here is the Design Alchemy logo , which is a modified &#34;A&#34; from RXC&#39; s Spanner typeface. It weighs in at about 230 lbs and is fabricated to spec by Rubicon Design &#43; Fabrication in solid 4&#34; steel using plasma cutting technique. It was then distressed with torch and hammer. <BR>I had it photographed by Robin Bartholick &#40;bartholick.com&#41; . We shot 5 rolls of 4x5 and then scanned the best pictures at 360 meg files with a Nikon 8000 film scanner. We did a couple of rolls experimenting with fire by applying rubber cement and ligthing it on fire.  <BR>I have yet to finish up these as they take lots of time due to difficulty of creating realistic masks around fire. <BR>I am currently going through ideas and comps for a co-promotion of Psyops/Design Alchemy. I will post this as it comes into final stages. <BR><IMG SRC="http://www.typophile.com/forums/messages/29/798.jpg" ALT="Metal A .jpg"></font></font></font></font>
