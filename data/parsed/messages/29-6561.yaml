    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks for your responses. I&#39;ll look into them and post some of my changes. Although I don&#39;t write the tag line or have to like it &#40;or the title for that matter&#41;. The only major control I have had so far is in creating the central image.   Thanks again though for the constructive criticism. Working on your own it is hard to get outside your own head sometimes!</font></font></font></font></font>
