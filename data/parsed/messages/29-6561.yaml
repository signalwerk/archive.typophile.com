  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This is a cover I haven been working on for a long time. It is an Australian man&#39;s life in India and Afganistan in the early 1980s. It&#39;s a very long and interesting book that hopefuly will prove popular. I am happy with the image but not the typography. We&#39;re trying to achieve the dream: mass-market not down-market and easily recognisable. I thought with these requirements everyone&#39;s experience with logos might help. Thank you!<img src="http://www.typophile.com/forums/messages/29/6562.jpg" alt="Book cover"></font></font></font></font></font>'
