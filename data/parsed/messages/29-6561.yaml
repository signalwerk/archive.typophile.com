    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I would set the type negative instead...</font></font></font></font></font>
  - id: 12642
    user: 1215
    date: 2003-02-14T02:55:00
    date_raw: Friday, February 14, 2003 - 2:55 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">If it&#39;s just a matter of degrees, you might consider Matthew Carter&#39;s Mantinia in place of the Galliard caps. It&#39;s similar, but a little more exotic looking. Mantinia was designed as a titling companion to Galliard.  <BR> <BR><img src="http://www.typophile.com/forums/messages/29/6570.gif" alt="Mantinia"> <BR> <BR></font></font></font></font></font>
  - id: 12650
    user: 1262
    date: 2003-02-14T04:20:00
    date_raw: Friday, February 14, 2003 - 4:20 am
    votes: 4
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Good call, Kent. Mantinia was my first thought too &#40;although this might suggest that it&#39;s a little obvious&#41;. Another good option would be the titling weight of HTF Requiem, which could also be used for the author&#39;s name. The text weight could be used for the tag line at the top, although it&#39;s really a bit naff: The Man. The Life. The Novel. The Ego. The Cheese.</font></font></font></font></font>'
  - id: 12653
    user: 1275
    date: 2003-02-14T04:52:00
    date_raw: Friday, February 14, 2003 - 4:52 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Its a typographical proportion problem, not a typeface problem. The position of the title is too low and the SHANTARAM text zone is equal to the author zone.  <BR>not enough space on each side of the title, and too much space inside the title. <BR> <BR>Perhaps, the word structure is not at its best in all caps setting &#40;very angular and difficult to space&#41;. Switch author name in caps -- title in lowercases.</font></font></font></font></font>
  - id: 12656
    user: 1204
    date: 2003-02-14T05:55:00
    date_raw: Friday, February 14, 2003 - 5:55 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I really dig the halftone mandala-esque design in the middle. <BR> <BR>You might want to reduce the size of the author&#39;s name. I agree with Jean -- it&#39;s fighting with the title.</font></font></font></font></font>
  - id: 12658
    user: 1195
    date: 2003-02-14T07:01:00
    date_raw: Friday, February 14, 2003 - 7:01 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">maybe putting a ligature in SHANTARAM is a good idea. </font></font></font></font></font>
  - id: 12669
    user: 1112
    date: 2003-02-14T12:56:00
    date_raw: Friday, February 14, 2003 - 12:56 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I agree with Jean about reversing the caps and lc treatments. I also agree with an earlier comment about choosing a bit more flourished face for the title or employing ligatures in an lc setting. <BR> <BR>I don&#39;t know if this is up for discussion, but I think the tagline doesn&#39;t belong on the cover. I&#39;m not one for taglines on book covers to begin with, but in particular I think this one is a bit cliched and detracts from the opportunity to let the image &#40;which is lovely, by the way&#41; and the title shine.</font></font></font></font></font>
  - id: 12671
    user: 1404
    date: 2003-02-14T13:38:00
    date_raw: Friday, February 14, 2003 - 1:38 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">�A man. A plan. A canal. PANAMA. In theaters this May.�  <BR> <BR>This reminds me of an assignment I had in first or second grade. We were supposed to draw the cover of a biography that would be written about us in the future. I think mine was called �One Man, One Plan.� Amusing, no? Maybe I should go into copywriting� <BR>  <BR>I&#39;d try eliminating the tagline, pushing the illustration down, put the title above the image, and leave the author at the bottom.  <BR>  <BR>I think JFP&#39;s suggestion is also good.   <BR>  <BR>Play around with different combinations and positions. Don&#39;t let yourself get locked into one layout and try to force the rest of the elements to fit.  <BR>  <BR>For example: I&#39;m not necessarily in love with the gold field behind the title. You might try mocking up a few versions without it.</font></font></font></font></font>'
