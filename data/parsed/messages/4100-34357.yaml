    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I like the interaction between the overlapping Cs on the left, but it feels to me that the lines of text are being swallowed� they&#39;re not strong enough to hold their own. Try bumping up the size on &#34;omposition&#34; and perhaps skewing/baseline shifting individual letters to match the style of the initial caps. Of course, this screws up the positioning entirely within the mouth of the C. <BR> <BR>&#34;Visual&#34; is kinda hanging out there and doesn&#39;t fit the curve you&#39;re continuing with the outline of the largest C.</font></font></font></font></font></font>
  - id: 57543
    user: 2412
    date: 2004-04-27T06:54:00
    date_raw: Tuesday, April 27, 2004 - 6:54 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">To me, your definition is competing with the large overlapping Cs. Because they &#40;the big Cs&#41; create a wonderful, lively shape that dominates the format, perhaps your definition could be something more subdued and orderly for more contrast. You&#39;ve got big to small, now maybe try chaos to order &#40;but always allow one to dominate&#41;. <BR> <BR>I think I would lose the gray and work only with black and white. Only reintroduce the gray if you really need it. <BR> <BR>It&#39;s very nice overall. You&#39;re a much better student than I was... <BR> <BR>-Addison</font></font></font></font></font>
