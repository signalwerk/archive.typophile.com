  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hello, <BR> <BR>   I was wondering if any of you out there can give a few sugestions on how to improve on this design. We have to use the word &#34;Composition&#34; and give the definition. The definition can be in any font, but the word &#34;Composition&#34; has to be in either Helvetica Black or Arial Black. <BR> <BR>This is due on wednesday and my professor ran out of time toady to give me any kind of solid feedback. Given his &#34;No artwork emails&#34; policy I am feeling frustrated about a good direction to move in. The only critique that he managed to offer was that &#34;the word &#39;Composition&#39; and the definition are crammed into the space there. And to explore more use of the unlimited typfaces avaliable for the definition. <BR> <BR>Here&#39;s the link and I appreciate any helpful tips or direction to explore!  <BR> <BR>	Thank you, <BR>		 Sean-Paul <BR> <BR> <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/34358.gif" alt="Composition Art"></font></font></font></font></font></font></font>
