    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> duuuuh, it&#39;s sometimes the simple things that solve a complicated problem, i guess. i thought i did copy everything, but after your post, Rodi, i thought i should maybe do it again ... and now it works perfect again! thanks for ... whatever. <BR> <BR>for all of you reading this thread, interested in pixar typestry, i&#39;ll post a mail i got from pixar&#39;s customer support: <BR> <BR>&#62; No, Pixar never did sell the rights to Typestry to anyone. <BR>&#62; It was simply discontined, and suppport stopped one year <BR>&#62; later. <BR>&#62;  <BR>&#62; I will agree with you that it was a fabulous product, but <BR>&#62; Pixar restructured at that time, and moved out of PC and Mac <BR>&#62; products to concentrate on movies, and high end rendering  <BR>&#62; software. <BR>&#62;  <BR>&#62; We&#39;re glad that you enjoyed the product.  Most reviews, and <BR>&#62; responses from customers was overwhelmingly positive. <BR>&#62;  <BR>&#62;  <BR>&#62; Thanks, <BR>&#62; Pixar Customer Support </font></font></font>'
