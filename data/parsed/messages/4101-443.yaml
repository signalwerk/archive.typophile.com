  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> I still love using that &#34;old&#34; software Pixar Typestry 2.1.2b3 to do some whacky 3D typestuff. Some time ago i got myself a dual processor G4 running on Mac OS 9.1 and now i can&#39;t load any looks, textures, lights etc. anymore. It&#39;s not the system because the software is running just fine with OS 9.1 on my old PowerPC. Anyone know how to fix this problem? Pixar unfortunately does not offer any kind of support for Typestry anymore. </font></font></font>
