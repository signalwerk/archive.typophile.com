  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I am to design the end of year student exhibition, titled &#34;launchbox&#34;, the target audience is fellow design students. They want to be impressed with something different, not the usual everday work of peers.  <BR> <BR>I have harsh, but delightful, limitations to the brief. I am restricted to only B&amp;W and Type only. I am pursuing an original solution to this problem.   <BR> <BR>What do you think of this concept? Comments and crituque, please welcome. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/35556.gif" alt=""> <BR> <BR>Cheers.</font></font></font>
