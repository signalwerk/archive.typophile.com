  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> i have recently discovered the beauty of the pixel! consequently, pixel/bitmap faces are fascinating and eluding me. would someone be kind enough to point me in the direction of information pertaining to their usage, creation, output and whatnot. none of my type tutors know anything about them... <BR> <BR>thanks. </font></font></font></font></font>
