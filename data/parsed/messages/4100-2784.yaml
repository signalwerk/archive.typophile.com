    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> firstly, thank you. i should have really checked <BR>the site thoroughly //shame//. second, i am also <BR>intrigued by the nature of the beasts; their <BR>inherent reductionist, almost modernist construction.  <BR>surely there must be some writing about this?  <BR> <BR>incidentally, i have also noticed the simalarities <BR>between pixel fonts and cross-stiching. at least  <BR>i think this is what it is called, the textile art <BR>that uses grids as a basis of construction. </font></font></font></font></font>
