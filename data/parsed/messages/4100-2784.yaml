    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Joe - That plug is &#34;shameless&#34; because there is  <BR>no shame in plugging an excellent article on the  <BR>very site that makes this forum possible. <BR> <BR>Now for a shameful plug: See <A HREF="http://typographi.ca/2002_07_08.php" TARGET="_top">this bit on Susan Kare</A>  <BR>who&#39;s work is often considered the finest in early  <BR>pixel design.</font></font></font></font></font>'
