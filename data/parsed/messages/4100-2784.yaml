    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">1 <BR>They&#39;re older than you think. Consider Wim Crouell&#39;s  <BR>work. Pick up <I>20th Century Type Remix</I> by Lewis Blackwell&#41;. <BR> <BR>2 <BR>They&#39;re a great way to cut your teeth in type design.  <BR>Apart from being fun, they&#39;re A&#41; easy to bang out since  <BR>the grid is set. b&#41; They&#39;re simplistic. They make you  <BR>focus on general character sizes, counter sizes, x- <BR>height, etc. And not the nuances of getting the curves  <BR>right or doing intensive kerning. <BR> <BR>Perhaps it&#39;s a stretch, but I&#39;ll relate it to beginning  <BR>photography, where students use slide film and learn  <BR>how to use a camera and compose shots. Then, when  <BR>they&#39;re ready, they get into the darkroom stuff and  <BR>perhaps PhotoShop. <BR> <BR> <BR>3 <BR>Sadly the latest OSs seem to abandon bitmaps. Having  <BR>used OS X and Windows XP, I think screens aren&#39;t  <BR>totally ready to move away from bitmaps. However,  <BR>Palms, cell phones, iPods, etc will need bitmaps for a  <BR>long time coming. <BR> <BR>4 <BR>&#40;Shameless plug.&#41; Have you read our interviews with <BR><A HREF="http://typophile.com/articles/bardram/index.html" TARGET="_blank">Matthew Bardram</A> or <A HREF="http://typophile.com/articles/gillespie/index.html" TARGET="_blank">Joe Gillespie</A>?</font></font></font></font></font>
