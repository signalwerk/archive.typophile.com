  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi all, <BR> <BR>I&#39;ve chosen Avenir as the font for heads and subheads for a book geared toward CEOs &#40;the cover uses Avenir&#41;. And I&#39;m looking for a good companion font.  Does anyone have any ideas? I like Wilson as well but I need a font family that contains a bold italic. Any help you can provide is greatly appreciated. Thanks!</font></font></font></font></font></font></font></font></font></font>
