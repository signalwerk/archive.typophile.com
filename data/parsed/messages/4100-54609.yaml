    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I really like the suggestions, however I need a font with a bold italic in the family. The Sabon NEXT does have a bold italic but I can&#39;t afford it. Thanks...</font></font></font></font></font></font>
  - id: 84523
    user: 1085
    date: 2004-11-30T16:24:00
    date_raw: Tuesday, November 30, 2004 - 4:24 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">What is your budget? How many weights do you want &#40;4? regular, italic, bold, bold italic? more?&#41;? Let me know, and I&#39;ll see what I can find that is within your price range.</font></font></font></font></font>
  - id: 84531
    user: 4094
    date: 2004-11-30T17:02:00
    date_raw: Tuesday, November 30, 2004 - 5:02 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Dan, <BR> <BR>Thanks so much for the assistance...Yeah I need four &#40;regular, italic, bold, bold italic&#41; at least. Possibly a small caps too. I really don&#39;t want to go over $40 per font.</font></font></font></font>
  - id: 84561
    user: 1085
    date: 2004-12-01T03:32:00
    date_raw: Wednesday, December 01, 2004 - 3:32 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Tamara, <BR> <BR>Wow $40 per font, you can buy almost anything &#40;from us at least&#41;.  <BR> <BR>My first recommendation, if you like Sabon NEXT, would be the original Sabon. They are two different designs, but the original Sabon was designed by Jan Tschichold, and is pretty comprehensive. Sabon has many, many weights, and separate Small Caps sets available, so you certainly can get a bold italic. You can even get a bold italic small caps/osf font! All weights cost 22 Dollars or Euros, plus tax. The regular weight is even availble as an OpenType font�so the small caps and old style figures are already in there. What a value &amp; savings!  <BR><a href="http://www.linotype.com/1436/sabon-family.html" target="_blank">http://www.linotype.com/1436/sabon-family.html</a> <BR> <BR>Sabon is based on Garamond. Jean-Fran�ois Porchez, when he designed Sabon NEXT, wanted to make Sabon more like its Garamond roots, I think. So you should look at some Garamonds, too. The prettiest Italic weight in any Garamond is hands down Stempel Garamond&#39;s. Stempel Garamond has 13 different fonts, including that bold italic small caps/osf! Each one costs 22 Dollars/Euros <BR> <BR><a href="http://www.linotype.com/1500/stempelgaramond-family.html" target="_blank">http://www.linotype.com/1500/stempelgaramond-family.html</a> <BR> <BR>There are lots of other Garamonds on the market. You can comparison shop &#40;both price and style&#41; by using MyFonts.com <BR> <BR>Also, you might want to consider another font from Jean-Fran�ois. A good text face might be his Le Monde, which is the typeface used to set the French Newspaper Le Monde. Check out some of the other faces there, too. I don&#39;t know if you can buy these as individual weights or not, though. Try asking him. <BR> <BR><a href="http://www.typofonderie.com/alphabets/view/LeMondeJournal" target="_blank">http://www.typofonderie.com/alphabets/view/LeMondeJournal</a> <BR> <BR>And, if none of these do it for you, let me know and I will try again</font></font></font>
  - id: 84688
    user: 4094
    date: 2004-12-01T15:22:00
    date_raw: Wednesday, December 01, 2004 - 3:22 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks, Dan <BR> <BR>I was leaning toward Sabon for the companion font. However, I&#39;ve changed the type on the cover from Avenir to Agenda Semibold Condensed  &#40;the title is really long and I needed something that would allow me to bump up the size a bit &#41;.  <BR> <BR>Do you think Sabon could work well with Agenda?</font></font>
  - id: 84731
    user: 1085
    date: 2004-12-02T02:15:00
    date_raw: Thursday, December 02, 2004 - 2:15 am
    votes: null
    html: <font class="dontLookLikeCrap">That depends on which Agenda you mean. On MyFonts.com, I found two very different looking typefaces named Agenda. The sans serif Agenda from Font Bureau would still pair well with Sabon, I think. The other Agenda from URW&#43;&#43; I&#39;m less sure about. That might call for a more robust serif face? <BR> <BR>BTW, Avenir NEXT has a semibold condensed weight of its own. The revised/expanded Avenir NEXT is a much better family than the original Avenir, but it might be out of your budget range�</font>
