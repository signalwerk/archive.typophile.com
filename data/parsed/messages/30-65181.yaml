    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>Quick! What�s your favorite font for setting a little Vietnamese?</i> <BR> <BR>Minion Pro <BR> <BR><i>Any of the Native American languages?</i> <BR> <BR>Plantagenet <BR> <BR><i>Persian?</i> <BR> <BR>Nafees <BR> <BR><i>Transliterated Arabic?</i> <BR> <BR>Gentium <BR> <BR><i>Yoruba?</i> <BR> <BR>Gentium <BR> <BR><i>Pan-Nigerian?</i> <BR> <BR>Gentium <BR> <BR><i>Etc. etc.</i> <BR> <BR>Wingdings</font></font></font></font></font></font></font></font></font></font>
  - id: 93377
    user: 2021
    date: 2005-02-15T10:39:00
    date_raw: Tuesday, February 15, 2005 - 10:39 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;Etc. etc.  <BR> <BR>Wingdings <BR> <BR>LOL <BR> <BR>&#42;&#42;&#42; <BR> <BR>Gentium is developed by a non-profit Christian outfit. Nafees is a University project. I&#39;m guessing that the Native American glyphs of Plantagent had some institutional financing. Minion is from Adobe. <BR> <BR>None of these are &#34;speculative&#34; retail fonts, such as where an independent foundry would cover the entire R&amp;D upfront. I can see that an indie foundry with a really good selling typeface might get around to extending its language support -- and that seems to be happening with FF Meta, for instance. I&#39;ve produced some OpenType CE versions of some of my fonts, but haven&#39;t got around to releasing them on the general market. I think the OpenType format will drive this, but it&#39;s early days yet.</font></font></font></font></font></font></font></font></font>
  - id: 93378
    user: 5094
    date: 2005-02-15T10:40:00
    date_raw: Tuesday, February 15, 2005 - 10:40 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;&#62;a little Vietnamese? Any of the Native American languages? Persian? Transliterated Arabic? Yoruba? Pan-Nigerian? Etc. etc.&#62;&#62; <BR> <BR>&#62;<i>You can&#39;t be serious. That would be pro bono work for an independent foundry, if not financial suicide, and a disinclination to pursue such can hardly be described as &#34;crass commercialism&#34;.</i> &#62; <BR> <BR>Not to start an argument, but have you looked at the glyphs required? A dot below about 7 letters solves most Arbic, a macron below and a breve below &#40;along with the dot&#41; solves Persian &amp; Yoruba -- Navaho &amp; other Native American languages use the Polish hook, sometimes comined with an acute, etc. etc. All in all, I&#39;d bet that less characters are involved to cover all these languages than to include a set of swash caps. <BR> <BR>I&#39;ll try to get my partner to help me post the samples to a website. <BR> <BR>&#42;&#42;&#42; <BR> <BR>I took a look -- Minion pro does NOT have the characters &#40;diacritics&#41; needed for Vietnamese. I&#39;ve seen Plantagenet; best I remember, it does not have the needed accents. Yes, Gentium has them -- so too does Bitstream Cyberbit as I remember -- but the existence of a couple of fonts doesn&#39;t solve things. <BR> <BR>Charles</font></font></font></font></font></font></font></font>
