post:
  id: 93089
  user: ajd-users
  date: 2005-02-10T21:09:00
  date_raw: Thursday, February 10, 2005 - 9:09 pm
  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hello. I&#39;m doing a report on how technology and the digitalization of the publishing industry has affected the quality &#40;typographic and otherwise&#41; of published work. I noticed that quite a few people here are typographers and book designers, and that some have been in the industry since the days of the Linotype and Monotype machines &#40;Gerald Giampa and Jim Rimmer?&#41;. I was wondering if I could get someone else&#39;s opinion on this topic, as many of you are most likely much more knowledgable about the issue than I. <BR> <BR>Currently, I&#39;m leaning towards the opinion that the reduced learning curve and investment involved in using today&#39;s technology compared to technology before the digital era has led to a lower overall standard of quality. Of course, the issue is more complicated than that &#40;I seem to remember Gerald Giampa once saying that bad type can be set using any technology&#41;, but it&#39;s a start. <BR> <BR>Can anyone help, share their opinion, or point me to any relevant books or articles? <BR> <BR>Thanks, <BR>Andrew</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
comments:
  - id: 93090
    user: 4406
    date: 2005-02-10T21:26:00
    date_raw: Thursday, February 10, 2005 - 9:26 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The cheapness of today&#39;s tools means that it is both much easier to produce top-quality work as well as much easier to turn out crap. <BR> <BR>Going digital is a minor issue in the overall story of publishing quality. The big question is one of economics: will publishers invest a little more time and money into quality, or will they heed the imperative of cost minimization as a way to maximize profits? <BR> <BR>It used to be that you <i>had</i> to invest some serious labor to get a book typeset, no choice. These days, you can run off the Microsoft Word manuscript on a high quality laser printer, and get results that many people would not be easily able to distinguish from quality typesetting. <BR> <BR>I&#39;m also not sure how much sense it makes to talk of an overall standard of quality. There&#39;s always a range. I savor the experience of encountering fine book from a hundred or more years ago, but a lot of books from back then were no better typographically than run-of-the-mill books today.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 93113
    user: 2172
    date: 2005-02-11T03:13:00
    date_raw: Friday, February 11, 2005 - 3:13 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;d argue that the lower end of the spectrum has strayed further from the general pack &#40;because of the lowered barrier for entry for first-timers, uninformed amateurs&#41; while the means of producing that low end has risen, so there&#39;s more nicely printed crap. <BR> <BR>Maybe. It&#39;s too early for me to articulate this properly.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 93174
    user: 1250
    date: 2005-02-11T10:40:00
    date_raw: Friday, February 11, 2005 - 10:40 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Technology only amplifies what society wants. <BR>The drop in quality is very real, but it comes directly from Capitalism. <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 93274
    user: 5094
    date: 2005-02-14T19:31:00
    date_raw: Monday, February 14, 2005 - 7:31 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Sort of a sweeping question for which one could only give broad, sweeping answers. I think I could write a book on the topic, which sort of rules it out for a message board. A few sweeping generalities: <BR> <BR>-- I think the average book set today is better than the average book set with hot metal. Of course, when you say �hot metal� you include Linotype linecasters with monotype machines � and just one for-instance here -- getting the type height even with a linecaster was about impossible; much easier with monotype . . . <BR> <BR>-- A little more � while most of the books in metal days were fairly dreadful, there was some interest in what are called �fine-print� books. I do believe that interest has diminished, but to the extent in remains, those books are still set metal &amp; printed letterpress, because that is the tradition. Not too many people have tried to make a go of �fine-print-computercomp-offset . . .� When people pull out examples of good work from the letterpress era, often it is these fine-print books. <BR> <BR>-- If you are familiar of the photo of Tschichold looking like a well-satisfied chef, you might think he marked up the typography on ever page of the Penguin books. As I hear it &#40;from those who knew him&#41;, no, it was just the title page &amp; maybe a bit of the display type in the prelims, the typography in the rest of the book was from the comp. <BR> <BR>-- Most printing plants were union shops before 1960. With the union shop, there was a strong apprenticeship program. Computer comp busted the unions &#40;starting with newspapers&#41;, and the training that comes with apprenticeship. But this is a union issue, not a technical one. <BR> <BR>And as to the crass commercialism, a little story. I went to AtypI when it was in Boston to plead for a few typefaces that would set well at text size, when printed offset, computer-to-plate. Most of the type designers said �oh, that . . .� or �there�s no money in it.� I was so disgusted by the trip that I paid for it out of my pocket rather than charging it to the business, and didn�t take it as a business expense on my personal tax returns. We rework a number of fonts for setting type for books, EULA be damned. Let me get up in open court &amp; explain why we had to go to the trouble and expense of remaking them for our own work &#40;&amp; show examples&#41;. So let�s not blame just the publishers here. <BR> <BR>Charles Ellertson</font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
