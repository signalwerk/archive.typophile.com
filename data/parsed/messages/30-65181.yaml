  - id: 93394
    user: 2021
    date: 2005-02-15T11:54:00
    date_raw: Tuesday, February 15, 2005 - 11:54 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;but have you looked at the glyphs required? <BR> <BR>No. Why should I bother? I really don&#39;t believe that there is a market for any of my typefaces for setting Vietnamese or Persian &#40;Why isn&#39;t that, like, Iran?&#41;. <BR>Everything to do with an independent foundry is incremental, not very significant considered in isolation, but one has to prioritize. Everything is competing for attention, including yakking on Typophile &#40;except when it&#39;s down&#41;. <BR> <BR>One of my next hurdles is getting out OT versions of my back catalogue, possibly with CE encoding. I&#39;d prefer to add the typographic extras rather than extra language encoding. It&#39;s a real dilemma of what to do, for a small foundry: new fonts get the marketing exposure, but all the old ones need to be updated to CE and OT. And I don&#39;t consider myself to be overly &#34;Anglo-centric&#34;, after all, I am an Anglo. However, I do find many of the CE diacritics fascinating: did you know that the slash on the l-slash goes at the top of the ascender in scripts? <BR> <BR>I think every foundry should have one face that is a multi-lingual workhorse. Maybe two, a sans and a sans serif. I&#39;m working on one at the moment, but my loyalty is divided, I&#39;m also spending time on developing fonts which utilize contextual alternates -- the aesthetic imperative of OpenType, rather than the linguistic one.</font></font></font></font>'
