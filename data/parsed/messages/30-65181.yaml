    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;but I don�t know how. <BR> <BR>Have you tried saving the scans as a PDF? If you post the scans on a website and give us the URL, the 7 Mb size is no problem to download &#40;broadband helps.&#41; <BR> <BR>&#62;a little Vietnamese? Any of the Native American languages? Persian? Transliterated Arabic? Yoruba? Pan-Nigerian? Etc. etc.  <BR> <BR>You can&#39;t be serious. That would be pro bono work for an independent foundry, if not financial suicide, and a disinclination to pursue such can hardly be described as &#34;crass commercialism&#34;.</font></font></font></font></font></font></font></font></font></font></font>
