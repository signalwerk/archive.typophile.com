  - id: 93350
    user: 5094
    date: 2005-02-15T07:32:00
    date_raw: Tuesday, February 15, 2005 - 7:32 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I�d be happy to show some examples, but I don�t know how. I made some scans of printed works for a talk I gave a couple of years ago, but the file sizes are in the 5-plus meg range. When I try to sample down, all seems lost. <BR> <BR>I have a comparison of Monotype Bembo printed letterpress by The Stinehour Press, Monotype PostScript Bembo printed CTP, and a re-worked PostScript version, also printed CTP. File size is 7.3 meg as an EPS. The second example is Scala printed from repro, contrasted to Scala printed CTP &#40;4.2 meg&#41; and printed from repro contrasted to a re-worked Scala, also printed CTP &#40;7.6 meg&#41;. <BR> <BR>As far as the weigh/contrast matter goes, this is just what I have already scanned; and I�d take the Bembo sample as typical of all the fonts that originated in the metal era, and Scala as typical of all the fonts that originated in the repro-negative-plate era. <BR> <BR>Also interesting with most of the Monotype fonts is the reduction of the ascenders &amp; descenders. I suppose this was done for magazines? But a good argument can be made that the original proportions were better for bookwork text � that was the �original intent�, anyway. <BR> <BR>And while a long way from �finally� I�d note that with most fonts, the glyph compliment is lacking. In real estate, it is suppose to be �location, location, location.� With book work, it is �glyph compliment, glyph compliment, glyph compliment.� Quick! What�s your favorite font for setting a little Vietnamese? Any of the Native American languages? Persian? Transliterated Arabic? Yoruba? Pan-Nigerian? Etc. etc. <BR> <BR>Charles</font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 93369
    user: 2021
    date: 2005-02-15T09:43:00
