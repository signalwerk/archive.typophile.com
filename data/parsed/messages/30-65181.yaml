  - id: 93388
    user: 909
    date: 2005-02-15T11:09:00
    date_raw: Tuesday, February 15, 2005 - 11:09 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Wow, something Nick and I actually agree on, more or less. <BR> <BR>Charles, the very latest versions of Minion Pro and Myriad Pro do indeed have Vietnamese support. This was added last year. <BR> <BR>Although many, many languages can each be done with &#34;a few extra glyphs,&#34; all those extra glyphs do add up to quite a bit of work. Especially if one is going to consider kerning, and small cap versions, and so on. <BR> <BR>If one is a stickler for design quality, any of the diacritics which actually attaches to a character is yet more work, because additional optical adjustments must be made. You can&#39;t just remove overlap and get a nice result. The ogonek and the Vietnamese hook are both good examples of this. <BR> <BR>The typeface I&#39;m working on right now would be a lot closer to done if I hadn&#39;t kept on saying things like &#34;I&#39;ll just throw in Vietnamese, too&#34; &#40;or the extra Latin for the delta between CE and WGL4, or whatever&#41;. &#34;It won&#39;t be that much more work.&#34; <BR> <BR>Cheers, <BR> <BR>T</font></font></font></font></font></font>
