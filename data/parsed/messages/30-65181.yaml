  - id: 93404
    user: 5094
    date: 2005-02-15T13:24:00
    date_raw: Tuesday, February 15, 2005 - 1:24 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I suppose the charge of �crass commercialism� against type designers on a forum inhabited mostly by type designers is asking for trouble. Actually, all I wanted to do was to point out that any such charge can�t be directed only at publishers, or printers, or anyone in this industry. And by the way, do you think the reason my plea at AtypI was ignored was because I don�t own any black clothes? <BR> <BR>But just to wrap this up a bit: Minion is a national treasure. It may not be perfect for lyrical poetry, but it will serve. It may not be perfect for highly technical material, but it will serve. And for most texts, it serves very well indeed.  <BR> <BR>I know full well that adding diacritics to a character is not always trivial; and yes, the ogonek &amp; Vietnamese horn are especially difficult. Things get generally harder in the italic font � I set up the metrics window with the desired letter between �l�s� for accents that go over the letter, between a �q� and a �p� for diacritics that go under a letter, and you still have to check how the diacritic forms with the letter as a separate object. Still far easier than drawing swash caps � at least for me. <BR> <BR>And since it is relevant to the discussion -- it wasn�t only or even primarily the lack of glyphs that bothers me -- Mr. Shinn said elsewhere: <BR> <BR><i>Like many people who don&#39;t experiment much with typesetting &#40;especially book designers&#41;, Mr Tufte expects digital versions of the well known faces to duplicate the effect of letterpress.  <BR> <BR>In the first place, this is not necessarily what the digital foundries set out to do. Secondly, it&#39;s not easy, and reviving a classic in such a manner may not be as good an idea as making a new face, eg Scala or Charter, to tackle the problem of &#34;digital to offset&#34;. <BR> <BR>. . . <BR> <BR>BTW, the magnificent Monotype Bembo was their second attempt at the Griffo font, Poliphilus was the first, and they were pretty happy with it for a while.</i> <BR> <BR> <BR>Oh my. First of all, I don�t know if Mr. Tufte was expecting to <b>duplicate</b> the effect of letterpress; if so, it can�t be done. But that is a long was from saying that the characters can�t have a similar feel; that the contrast between the fine and heavy strokes can�t be adjusted so that the text printed CTP &#40;which implies digital&#41; cannot have a balance similar to the text printed letterpress. I�ve done this a time or two, it takes less time to make these adjustments than it does to properly kern a font. This kind of expectation would be perfectly reasonable. <BR> <BR>Secondly, I�ve been through a few technical changes � VIP to Linotron 202 to PostScript &#40;Type 1, Type 3&#41; and now OpenType. Always hard to guess the foundries motives, but I�d note it isn�t too cynical to say that their motive is to get the product out as fast as possible as cheaply as possible. Remember the VIP &amp; its 18-unit em? And we got the same setwidths &amp; sidebearings with the 202 &amp; its 54-unit em. What did Linotype say? Oh, we did that so our customers wouldn�t have to change their kerning tables. Yeah, right. So why offer the 54-unit em, anyway? <BR> <BR>And as to Scala &amp; Charter � jeez, these are very different from Bembo. I like all three, but would not consider them alternatives. And both Scala &amp; Charter are different when printed from repro-negative-plate than when printed CTP. <BR> <BR>Finally, the way I hear it, Monotype was happy with Poliphilus and Blado until someone pointed out to them that they had used a particularly bad portion of the text to take them from, if they�d only gone a few pages farther, they would have been much better. <BR> <BR>For another fun muck-up from the letterpress days, check out the story of Fournier in <i>The Talley of Types</i>. �Owing to some confusion &#40;due to the typographical adviser�s absence abroad&#41;, series 185 was approved . . . The second and, surely, preferable design . . . is numbered series 178, only one size of which, in one set of matrices, was struck. They were acquired by Cambridge, where they are known as `Barbou,� and were first used in for the composition of <i>The Fleuron,</i> vol. V . . .�� &#40;pp 75-80&#41; <BR> <BR>&amp; then there is the story of the wrong capital �R� in Bembo being sent down, finally, tacitly admitted in PostScript with an alternate R . . . <BR> <BR>I�m still not going to buy any black clothes . . . <BR> <BR>Charles</font></font>'
