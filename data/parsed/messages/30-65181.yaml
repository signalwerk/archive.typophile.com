    html: <font class="dontLookLikeCrap">&#62;it isn�t too cynical to say that their motive is to get the product out as fast as possible as cheaply as possible <BR> <BR>Actually, that is somewhat cyncial. You really shouldn&#39;t generalize about foundries, which come in many stripes. It may be that a foundry, sitting on top of a large collection of legacy designs would, in the early days of digital, have done a perfunctory job of switching formats. And it may be that a lot of &#34;boutique&#34; foundries turned out dodgy fonts in the heyday of deconstruction. But those days are gone, and many experienced, high quality digital practitioners have emerged, who have put, and will continue to put, a lot of care and attention into manufacturing original typefaces. <BR> <BR>Bembo, schmembo.</font>
