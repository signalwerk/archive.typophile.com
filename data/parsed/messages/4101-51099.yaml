    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thank you for narrowing it down for me Thomas. <BR>I understand it much better now. <BR> <BR>As you said it&#39;s just the letters/glyphs that the customer was after � not the encoding. <BR> <BR>Adam: What I did was I used &#34;Latin 1&#34; as a base and changed a copy of it to &#34;Latin 15&#34; by hand. <BR> <BR>T o follow up what you said about Fontlab codeppages are a sort of encoding. Whn I go under Info�&#62; Encodings and unicode,  is there a way of choosing encoding?</font></font></font></font></font>'
