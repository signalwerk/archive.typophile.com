  html: <font class="dontLookLikeCrap">HermesSOFT is a small private company founded in 1989. It has always been the leading Bulgarian Company for design and developing Cyrillic and multi-lingual typefaces. HermesSOFT&#39;s superior design and technological capabilities have allowed these Cyrillic and multi-lingual typefaces to be faithfully reproduced for digitally. Currently, all HermesSOFT font families are being expanded to support all countries inside Europe and US and are available in TrueType and PostScript formats. In addition, some of the HermesSOFT&#39;s font experts are members of ADOBE Developers Association Europe and therefore they are deeply in the PostScript and Typefaces area. Such a professional Type Library together with an expert support team allows HermesSOFT to effectively assist companies with a complete worldwide font solution. <BR> <BR><a href="http://www.hermessoft.com" target="_blank">http://www.hermessoft.com</a></font>
