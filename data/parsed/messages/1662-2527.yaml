    html: "So the final tally is 386 entries. <BR> <BR>Thanks everybody for all your submissions. There are a  <BR>good number of shirts here I&#39;d be proud to wear. It&#39;s  <BR>interesting to see how about 10% of the bunch rise to  <BR>the top with solid concepts and quality craftsmanship. <BR> <BR>May the best design win. <BR> <BR>Regarding: the ommitted submissions. Charles you&#39;re  <BR>not alone in your sentiment. Early on we decided not to  <BR>limit the contest with lots of rules and guidelines.  <BR>However, we should&#39;ve had more foresight and  <BR>included a note about suggestive or provocative sexual  <BR>references or material that in our judgement is not  <BR>appropriate. <BR> <BR>The bottom line: that stuff isn&#39;t what we&#39;re about."
