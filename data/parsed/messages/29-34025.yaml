    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Paul, in the current layout, seems like a drop cap or <BR>first-sentence small caps would be an improvement ... <BR> <BR>You were doing a redesign, yeah? <BR> <BR>Maybe you could show us how the new mugs look <BR>in the context of the new layout ... otherwise, it&#39;s <BR>kinda difficult to give you an accurate critique. <BR> <BR>bj</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 57136
