  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">okay, this is a fun project i&#39;ve been fooling with today � new mugshots for our newspaper. There&#39;s not much to them, but one can always use a crit right? So lemme know where there&#39;s room for improvement. I hafta confess, the format is very similar to the mugs in The Arizona Republic, but I think this solution is so much better than having huge column-wide heads. Oh, and btw, that <i>is</i> Hrant&#39;s Patria at the bottom � <i>Thanks Hrant!</i> And the names are in Folio BC. <BR><!--attachment: CressyMug-34026.pdf*mime_pdf.gif*application/pdf*35.1*Mug+1*CressyMug%2epdf --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align=left alt="application/pdf">Mug 1<br><a href="http://www.typophile.com/forums/messages/29/CressyMug-34026.pdf" target="_blank"><b>CressyMug.pdf</b></a> (35.1 k)</td></tr></table></center><!--/attachment--> <BR><!--attachment: SamMug-34027.pdf*mime_pdf.gif*application/pdf*30.7*Mug+2*SamMug%2epdf --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align=left alt="application/pdf">Mug 2<br><a href="http://www.typophile.com/forums/messages/29/SamMug-34027.pdf" target="_blank"><b>SamMug.pdf</b></a> (30.7 k)</td></tr></table></center><!--/attachment--></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
