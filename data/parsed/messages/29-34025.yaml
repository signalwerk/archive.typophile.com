  - id: 57249
    user: 618
    date: 2004-04-24T05:31:00
    date_raw: Saturday, April 24, 2004 - 5:31 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Paul, <BR> <BR>Much improved! I would still consider 4 things. <BR>1. The fuzz clipping on the photo. Try a hard edge with a very simple light shadow. <BR>2. The copy between the rules is cramped. Too close to the rules, or too far from each other &#40;fiddle with both&#41;. Do you need both? Would one be fine? <BR>3. The drop cap is ok, but you have many indicators that you are at the start of a story: Headline, Photo, Name, Rules, Etc. I&#39;d ditch it. <BR>4. This may make me unpopular, but of your two choices I&#39;m not getting good vibes off of Patria. Apologies up front Hrant. I know a rediculous effort was put into it. &#40;It could partly be the setting&#41; The trouble for me is not technical, it&#39;s aesthetic. IMHO, Patria lacks some visual cohesion. If this turns into a big side discussion, lets take it to the Patria critique. <BR> <BR>Cheers, <BR>Randy</font></font></font></font></font></font></font></font>'
  - id: 57257
    user: 1250
    date: 2004-04-24T07:48:00
    date_raw: Saturday, April 24, 2004 - 7:48 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; Patria lacks some visual cohesion. <BR> <BR>I would hope so! It&#39;s a text font. There are many details &#40;such as the dot on the i&amp;j being too big, the serifs on ascenders being different sizes, etc.&#41; that are consciously designed to help reading, but they can&#39;t be pretty as well. Formal harmony at the letterform level is not entirely compatible &#40;it might even be essentially <i>in</i>compatible&#41; with readability; a &#34;real&#34; text font <i>has</i> to have a certain sort of ugliness about it. In fact I worry Patria is still not ugly enough during deliberative reading. Check out Fleischmann&#39;s #65. <BR> <BR>That said: <BR>1&#41; There are things I still need to fix, most of all the serifs on some caps. <BR>2&#41; Critiques of Patria entirely welcome&#42;. But if you want to discuss the issue of &#34;necessary ugliness&#34; maybe start a new thread. <BR> <BR>&#42; <a href="http://www.typophile.com/forums/messages/29/805.html" target="_blank">http://www.typophile.com/forums/messages/29/805.html</a> <BR> <BR>hhp <BR> <BR>-------- <BR> <BR>Today, learn about the Amenian Genocide. <BR></font></font></font></font></font></font></font>'
  - id: 57508
    user: pablohoney77-users
    date: 2004-04-26T17:33:00
    date_raw: Monday, April 26, 2004 - 5:33 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">hey thanks for the crit randy. i did to a fuzzy edge on the first of these and realized it was the wrong choice. I&#39;ll hafta go back and fix that for sure. I&#39;ll hafta take a look at the copy between the rules. I can totally see your point about all of the elements together looking too busy. I really should lose the drop cap to make it all as clean as possible. I didn&#39;t really think Patria was ugly Hrant! But then again I like ugly. I mean someday i&#39;m gonna buy me a Pontiac Aztec � how&#39;s that for ugly. I think that Patria looks a lot better on newsprint, Randy, and maybe not quite as good on screen in a sharp pdf. But I&#39;m not married to Patria, in fact, i&#39;m more married to Times at the moment but am seeking a divorce! Thanks again for all your help and I&#39;ll post updates when i get a chance.</font></font></font></font></font></font>
