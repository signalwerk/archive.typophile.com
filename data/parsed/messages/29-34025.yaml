    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">hector: align EVERYTHING to the left? or what? <BR> <BR>bj: yeah i&#39;m trying to <a href="http://www.typophile.com/forums/messages/4100/25479.html" target="_blank"> redesign</a> our paper as inspiration comes. &#40;which is very slow&#41;. So far I&#39;ve tried to re-design the front page including the <a href="http://www.typophile.com/forums/messages/29/26543.html" target="_blank"> nameplate</a>. I&#39;m still trying to figure out what to do about replacing the text type &#40;which is currently Times&#41; <BR>I like the drop cap idea. Do you think i should just use that for columns &#40;where these mugs are used&#41;? I tend to think that using it more than that &#40;except maybe in the headlining story&#41; might be overkill, especially because our paper is so small. I&#39;ll the dropcaps a try and post the results for commentary. Thanks for the interest and your suggestions guys!</font></font></font></font></font></font></font></font></font></font></font></font></font>'
