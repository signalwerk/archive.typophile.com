  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hello all -- <BR> <BR>My name is Andy and I&#39;m currently a graphic design student at San Diego State University. I&#39;m a big fan of the typophile critique discussion group and have been looking forward to posting a typeface of my own design for critique. <BR> <BR>I&#39;m a little bit eager to get some feedback on a face I&#39;m currently working on, so I&#39;m posting the completed lowercase set before moving on to finishing up the bits and pieces of uppercase and figures that I&#39;ve started.  Please let me know what you all think. <BR> <BR>When I started out this typeface, my intention was to create a simplified blackletter typeface that is able to be stenciled.  As you can see I have definately digressed from this original plan but it still hints to its calligraphic roots. <BR> <BR>Thanks! <BR> <BR><IMG SRC="http://www.typophile.com/forums/messages/29/1477.gif" ALT="Stencil Fraktur"></font></font></font></font>
