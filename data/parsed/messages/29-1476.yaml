    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> I forgot to mention one thing.  I&#39;ve included both regular and roudned versions.  I think the rounded version is a little easier on the eyes.  Let me know what you think </font></font></font></font>
  - id: 4622
    user: 103
    date: 2002-06-09T20:41:00
    date_raw: Sunday, June 09, 2002 - 8:41 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Miles Newlyn&#39;s <A HREF="http://www.emigre.com/dp/getfontpage.php?PSabR.html" TARGET="_top">Sabbath Black</A> immediately comes to mind. <BR>Yours is more distressed and uses simpler forms and I  <BR>think that works well. Yes, the rounded edges are more  <BR>appropriate for the theme, which I think of more as  <BR>stamped and worn rather than stenciled. <BR> <BR>The &#39;u&#39; and &#39;v&#39; could use some more differentiation. <BR>Note how Newlin adds a flourish to his &#39;v&#39; and a foot <BR>on the &#39;u&#39; to make them distinguishable forms. <BR> <BR>Overall it&#39;s pretty cool and I can see it used in a variety  <BR>of ways - both with the classic history in mind and in  <BR>more grunge/punk DIY pieces. <BR> <BR>Stephen</font></font></font></font>
  - id: 4623
    user: 1250
    date: 2002-06-09T21:13:00
    date_raw: Sunday, June 09, 2002 - 9:13 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> &#62; I&#39;m posting the completed lowercase set before <BR> <BR>Good idea - caps are secondary anyway - numerals tertiary. <BR> <BR>First of all, the rounded form isn&#39;t just &#34;easier on the eyes&#34;, it seems much more authentic too. So that&#39;s what I&#39;m looking at. What I see is that it works quite well, I&#39;m just unsure about the &#34;downhill&#34;s on the &#34;f&#34; and &#34;t&#34;. And I agree with Stephen that there&#39;s a problem with the &#34;u&#34;/&#34;v&#34;. What really needs the most work though are the &#34;s&#34; and &#34;z&#34;. BTW, I think you forgot the smooth the tail of the &#34;j&#34;. <BR> <BR>hhp </font></font></font></font>
  - id: 13085
    user: loop-users
    date: 2003-02-20T21:15:00
    date_raw: Thursday, February 20, 2003 - 9:15 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi, <BR> <BR>I&#39;m sorry but I mostly desagry with precedent post. <BR>I really like the idea, but  what interest me in your font is the reinterpretation of historical reference, adapt to a more modern aesthetic. <BR> <BR>It&#39;s the reason why I prefer the first version, more geometrical. The result is more unique, less revival, more inspired. <BR>I don&#39;t  like the round vervion, it&#39;s make no sens for me. <BR> <BR>I am personnaly a fan of stencil font and I think  you should go further that way.  <BR>To do so, you could try to regulate the space between part of the same glyph. For example, the �r� don&#39;t work as a stencil. <BR>I think your font could gain to be a little bit more on the baseline.  <BR>I found lower connection of the �p� really interesting and I wonder if it could be use for �g� as well. <BR>The �a� look quite different from other caracters because the lower bowl connection. <BR> <BR>&#43;A</font></font></font></font>
  - id: 13086
    user: 596
    date: 2003-02-20T22:00:00
    date_raw: Thursday, February 20, 2003 - 10:00 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Andy, I think this is really sweet. And I, unlike     <BR>Anouk, love the Rounded version. I think that, your historical inspiration aside, the Rounded is more true to the finished result of what this is � a cut stenciled type.  Spray paint  blurs at it&#39;s edges as it is used.  It is sort of like your first &#34;regular&#34; design is the stencil itself. The second &#34;rounded&#34; version is the result of using that stencil. I see it as authentic from this perspective. <BR>    <BR>It seems to me that some how on &#34;v, w, x &#34;, and &#34;z&#34; you lost some focus with these characters. They seem less disciplined than the first half of the alphabet. These glyphs break up to much in comparison to the rest. I like the first half of the alphabet better.    <BR>    <BR>The dots, I feel, on the &#34;i&#34; and the &#34;j&#34; should be less rounded. Instead, they should emulate the stroke of the regular version and the rest of the design closer. I strongly feel these should be more squared.    <BR>    <BR>I like it.    <BR>    <BR>-smc</font></font></font></font>
