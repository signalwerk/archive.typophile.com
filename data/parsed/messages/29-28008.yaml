post:
  id: 50770
  user: 3063
  date: 2004-03-05T16:05:00
  date_raw: Friday, March 05, 2004 - 4:05 pm
  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This is a pixel font I have been working for a few weeks. I am part of the class of the class from UW-Stout placing their specimens over in the Display forum. <BR> <BR>This typeface shows the truth of spoken word through voice stress recognition.  <BR> <BR>This is optimized for the screen because initially I wanted to use this as an option on a television that would listen to broadcast voices and determine the truth of the statements&#40;ie State of the Union Address&#41;. <BR> <BR>It is aesthetically influenced generally by Blackletter faces based on the decorative nature and its past use as the dominant typeface in one regime.<img src="http://www.typophile.com/forums/messages/29/28009.jpg" alt="afton"> <BR> <BR>All comments are welcomed. <BR> <BR>jp</font></font></font></font></font></font></font></font></font></font></font></font></font>
comments:
  - id: 50779
    user: 1250
    date: 2004-03-05T19:14:00
    date_raw: Friday, March 05, 2004 - 7:14 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Unless this will be set pretty large &#40;which seems unlikely if it&#39;s supposed to transcribe a full speech and stuff&#41;, it&#39;s too light: TV fonts need to have much more body, especially in the horizontal &#40;ie vertical stems&#41;. <BR> <BR>But the idea itself is pretty cool, and I like the blackletter basis too. <BR> <BR>One more thing: if you can make the two variants &#34;uniwidth&#34; &#40;where a given character has the same set-width in either font&#41;, that&#39;ll help you dynamically swap in one of the font styles for a single word or something without affecting the rest of the setting: less movement, more readability. <BR> <BR>hhp <BR></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 50822
    user: 3063
    date: 2004-03-06T12:32:00
    date_raw: Saturday, March 06, 2004 - 12:32 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I agree the face does not have body enough to be displayed on television. This is my first pixel font and i can&#39;t say it has been hard getting this going, but adequately building this with another pixel in terms of thickness is something I have not gotten to understand.  <BR> <BR>Actually the nature of the &#34;false&#34; set is to change the legibility, to make it difficult to read.  Lies are disguised and distorted versions of the truth. When I was building the alternate face I was trying to lose information and make it harder to read. It then turns out that the forms became related further to Blackletter and the underlying theme of Nazi &#34;truth&#34;. <BR> <BR>Yet, you do have a good point with the uniwidth. I don&#39;t know if it can be possible in contrast to my overall goal to show the lies in speech. I had an older version based off of Scala Sans where the forms were exploded, stems fell over, etc., but the overall width changed still. <BR> <BR>Maybe I could if they flatten out a little bit, with a little less pitch. I&#39;ll see if it is possible. <BR> <BR>thanks <BR> <BR>jp <BR> <BR> <BR> <BR></font></font></font></font></font></font></font></font></font></font></font>
  - id: 50824
    user: 1250
    date: 2004-03-06T12:47:00
    date_raw: Saturday, March 06, 2004 - 12:47 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; the nature of the &#34;false&#34; set is to change <BR>&#62; the legibility, to make it difficult to read. <BR> <BR>Or you could say that lies are meant to make us <i>more comfortable</i>! So maybe the honest font should be a bit harsh while the dishonest one should be all soft and flowery. <BR> <BR>BTW, be careful of associating blackletter with fascism - that itself perpetuates an untruth. <BR><a href="http://www.typophile.com/forums/messages/4077/11682.html" target="_blank">http://www.typophile.com/forums/messages/4077/11682.html</a> <BR> <BR>hhp <BR></font></font></font></font></font></font></font></font></font></font>
  - id: 50850
    user: 3063
    date: 2004-03-06T21:10:00
    date_raw: Saturday, March 06, 2004 - 9:10 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Yeah I have thought of that also. Turning it around and making lies look pretty as seen in our current communications. I look at both perspectives and don&#39;t see one more favoring than the other in terms of approach. It seems that lies that are soft and flowery people would understand and similarily vice versa.  <BR> <BR>Upon further review I rescind my comment I made before about the use of blackletter type in Germany during WWII. My facts were not straight and for any inconveinences I apologize. I guess I should also round out my type history.  <BR> <BR>What about the type forms as a whole? I don&#39;t want to get some big head because the type guys at Typophile didn&#39;t give me any comments about the letter forms.  <BR> <BR> <BR>jp</font></font></font></font></font></font></font></font></font>
  - id: 50861
    user: 1286
    date: 2004-03-06T23:37:00
    date_raw: Saturday, March 06, 2004 - 11:37 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">First thing is, have you ever seen a one pixel line in television? It doesnt work. &#40;period&#41;. the scaning makes it jump around like a crack whore. &#40;excuse the.. well&#41; <BR> <BR>A face that works well for screen &#40;TV is what I&#39;m talking here&#41; is one with some balls, one with open counters. It really needs to have a little substance to be halfway ledgible.</font></font></font></font></font></font></font></font>
