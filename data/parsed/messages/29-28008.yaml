    html: <font class="dontLookLikeCrap">Well I am getting closer to hopefully finshing this.  Its new name is Insidior &#40;latin for treacherous or I suppose insidious&#41;.  Taking in all the considerations that have been suggested I presume this has a better chance of delivering my original intentions. <BR> <BR>If you need to know what those were, you can look at the first post. <BR> <BR>Pixelfonters unite and give me some advice. <BR> <BR>josh <BR> <BR><img src="http://www.typophile.com/forums/messages/29/32902.jpg" alt=""> <BR> <BR> <BR>Sorry if it is a little blurry. Not much I can control from Illustrator.</font>
