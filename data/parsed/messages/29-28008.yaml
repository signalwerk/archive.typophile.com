    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Well I have gone back to the drawing board of sorts and tried to thicken this up.  <BR> <BR>I have so many questions about pixel fonts that I have I don&#39;t even know where to start. I am concerned that I need to stick to this screen-based font, otherwise it loses its meaning. Its like chocolate chip cookies without the chips.  <BR> <BR><img src="http://www.typophile.com/forums/messages/29/28635.jpg" alt=""> <BR> <BR>When I posted in the build forum about how to approach this I got a bunch of responses, but none that I could make any sense of. Sort of type geek talk with em units being thrown all around and debate between type designers, but not directed toward a &#34;beginning&#34; student in type design. <BR> <BR>So I have some questions: <BR> <BR>How does everyone else build their pixel type? Fontlab, Illustrator, other?  Can I build a pixel font in Illustrator? <BR> <BR>What should I be using if I don&#39;t have Fontlab available and only Fontographer? <BR> <BR>If I am building in a program like illustrator what is a general grid that I should set up to effectively make a readable pixel font? <BR> <BR>Other considerations I should take into mind? In simple terms if at all possible. <BR> <BR>And finally what is going on with this face. Ideas, critique, etc. <BR> <BR>jp <BR> <BR></font></font></font></font></font>'
  - id: 52066
    user: 1250
    date: 2004-03-16T15:05:00
    date_raw: Tuesday, March 16, 2004 - 3:05 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey, pixelfonts are a hack, so it&#39;s technical! <BR>But your Fontographer is plenty. <BR> <BR>Visualize the font&#39;s vertical space &#40;&#34;EM&#34;&#41; spanning a number of pixels onscreen -depending on point size and dpi- and you can figure out how your font&#39;s &#34;space&#34; needs to be structured. <BR> <BR>For example a font with an EM of 1000 &#40;the norm&#41; set at 8 points at 72 dpi will have a &#34;pixel block unit&#34; of 1000/8 = 125. In your case it looks like you have a vertical span of around 16 pixels&#42;. That doesn&#39;t divide into 1000 roundly. What you can do is either go up to 20 &#40;so have pixel blocks 50x50&#41;, or have some &#34;internal leading&#34;: like have blocks of 60x60, which means you use 16 x 60 = 960 units of the EM for the letterforms, and that leaves 40&#42;&#42; units empty. Then when you go to use the font you use the point size you targeted &#40;like 20, or 16&#41;. <BR> <BR>&#42; I&#39;m counting top-to-bottom of the lc, which is the most useful measure. <BR> <BR>&#42;&#42; It&#39;s best to distribute this blank space more to the top than the bottom, like 30/10 in this case. <BR> <BR>There are also other issues though, like overlaps/touching between blocks, internal spaces coming out black instead of white, etc. <BR> <BR>As for the font itself, allow me to leave that to others - I have my own bitmaps to finish!  :-&#41; <BR> <BR>hhp <BR></font></font></font></font>'
