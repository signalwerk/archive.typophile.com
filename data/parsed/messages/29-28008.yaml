    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Yeah so I finally figured it out. One&#39;s self is always the best teacher. I actually used the 20 pixel measurement you quoted above. I built the initial face and it looks great&#40;clear and crisp&#41; at 20 pixels, points, whatever.  <BR> <BR>I hate math and wish to avoid aspects of it at all costs, but I got it and hopefull there will not be so many wasted entries next time.  I appreciate all your help Hrant and you other folks.  <BR> <BR>&#42;&#42; I was looking at Cranbrook&#39;s 2D department site and saw some pixel type inspiration along the lines of mine. <BR> <BR><a href="http://cranbrookart.edu/2d/" target="_blank">http://cranbrookart.edu/2d/</a> <BR> <BR>jp</font></font></font>
