    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;ve made that on the one that says transform&#62;shear. Somehow I&#39;m not convinced by that skew... Maybe I&#39;m doing something very wrong. Thanks for your time tiff. <BR> <BR>Here&#39;s the <a href="http://design.adrianoesteves.com/faces/trythis.zip" target="_blank">.AI</a>, if you want to try it &#40;or someone else&#41;.</font></font></font>
  - id: 73201
    user: 2236
    date: 2004-08-26T12:01:00
    date_raw: Thursday, August 26, 2004 - 12:01 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Adriano: <BR> <BR>You have done a pretty good job already. The concept is there, the problem is that as a designer you have a better than average trained eye. You will never satisfy the optical correctness that you are looking for because the graphic doesn&#39;t use correct perspective. You are using a flat perspective that doesn&#39;t accurately convey depth. Even if you were using accurate perspective, the fact that one face is traveling away from the viewer while the other is traveling toward the viewer would create a visual distortion of the size relationship. <BR> <BR>Aloha! <BR>Scott</font></font>'
