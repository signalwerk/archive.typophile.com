    html: '<font class="dontLookLikeCrap">thanks tiffany, for your continued attention. <BR> <BR>i&#39;ve got three other styles of scripts i&#39;m working on, but this was the one i was the most excited about. <BR> <BR>in the end, it has suffered from the same problems all my other attempts have: letters leaning the wrong way, or &#34;interpretive&#34; characters conflicting stylistically with &#34;literal&#34; characters. <BR> <BR>i haven&#39;t been able to create a set that flows naturally. yet. <BR> <BR>i&#39;m open to any advice! <BR> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/65561.gif" alt=""></font>'
