  - id: 92809
    user: 2139
    date: 2005-02-09T01:23:00
    date_raw: Wednesday, February 09, 2005 - 1:23 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">well, the upper case set is functioning at least. i really don&#39;t know how much more i can tweak it, but i&#39;ll keep trying. <BR> <BR>i thought i might create a script uppercase, but that was a disaster. so i went with the more conservaative approach; essentially turning the font into an upright italics. <BR> <BR>sort of. <BR> <BR>the vertical nature of the set as a whole is rather hard for me to capture with the uppers while simultaneously giving them any sort of curvature. everything ends up looking angular. <BR> <BR>any critical eyeballing is most welcome. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/65006.gif" alt=""></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 92879
    user: 2462
    date: 2005-02-09T10:42:00
    date_raw: Wednesday, February 09, 2005 - 10:42 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think you may find it wise to eliminate the descender of the &#34;l&#34;. It reads like a &#34;long s&#34; to me.</font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 92926
    user: 1295
    date: 2005-02-09T15:44:00
    date_raw: Wednesday, February 09, 2005 - 3:44 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">katie is very elegant, tyler - i like it. <BR> <BR>i agree with kevin that the long &#39;l&#39; is distracting. <BR> <BR>i think the uppercase fits well to the lowercase. maybe you could try to make the stem of the &#39;Y&#39; vertical? <BR> <BR>you can also try to extend it to bigger sizes &#40;15, 17, 19...&#41; - it will get even lighter and softer. <BR> <BR>i can imagine this font in a composition with a big capital, ornamented borders &#40;something like your icon&#41;... <BR> <BR>have fun, <BR>- g.</font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 92934
    user: 2139
    date: 2005-02-09T17:27:00
    date_raw: Wednesday, February 09, 2005 - 5:27 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">after seeing how the first uppercase set forced me into an italic font rather than a script font, i decided to see what a non-italic version would look like. <BR> <BR>i&#39;m still trying to capture an elegant script uppercase set, but it&#39;s slow going. <BR> <BR>in the mean time, here&#39;s a few variations of katie so far. <BR> <BR>kevin and gustavo, thanks for your help. i&#39;ve noted your desire to see a baseline l. i haven&#39;t been able to make one i like yet, because it looks like it&#39;s leaning awkwardly without the long tail to balance it. <BR> <BR>i&#39;ll put something up soon. <BR> <BR>it&#39;s a pleasure to have your feedback stephen. thanks again for your time everyone. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/65093.gif" alt=""></font></font></font></font></font></font></font></font></font></font>
  - id: 93067
    user: 2139
    date: 2005-02-10T17:54:00
    date_raw: Thursday, February 10, 2005 - 5:54 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">getting crazy with the cheese-wiz here. <BR> <BR>many of these characters are either a&#41; place fillers until i can figure out better solutions, b&#41; satisfactory solutions for a script set, but not necessarily THIS script set, or c&#41; i don&#39;t know. i haven&#39;t figured out c yet. <BR> <BR>scripts are very complex! <BR> <BR>isn&#39;t it better if all the characters&#39; ascenders and descenders arc the same way? <BR> <BR>i&#39;ve done what i can to research existing sets on the web, but each one is so unique, it really doesn&#39;t do me much good as far as extrapolating a basic set of rules to follow. <BR> <BR>all i know is that these scripts aren&#39;t working yet. i&#39;ll keep tinkering. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/65166.gif" alt=""></font></font></font></font></font></font></font></font>
