    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">thanks for your help tiffany, i&#39;ll keep tweaking things and tighten the kerning. <BR> <BR>btw: your icon is one of my favorites. the loop in the center just slays me.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 92772
    user: 2139
    date: 2005-02-08T17:23:00
    date_raw: Tuesday, February 08, 2005 - 5:23 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">trying to marry the characters better. especially between the second half of the set and the first. <BR> <BR>since i can&#39;t think of a way to stand the second half upright, i&#39;ve tried to tilt the first half toward the second. <BR> <BR>flows a bit better this way, and besides, the a, b, c, d, e, g, o, p, and q all are made of the same bowl now. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/64985.gif" alt=""></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
