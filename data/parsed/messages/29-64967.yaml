  date: 2005-02-08T14:57:00
  date_raw: Tuesday, February 08, 2005 - 2:57 pm
  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">like many pixel font junkies, i&#39;m continually inspired by miguel hernandez. his fundamental typeface has been one of my favorites for years, and i have always wanted to try my hand at a character set that featured those fabulous peaks throughout the lowercase set. <BR> <BR>so, i finally committed an evening to doing something about it, and katie is the result. <BR> <BR>now, i know nothing of script typefaces. in fact, i have very little traditional type heritage knowledge. i just like creating the pixel letterforms. usually, not a problem. <BR> <BR>now, it&#39;s a big problem, because i have NO idea where to start with the upper case. <BR> <BR>i&#39;m thinking the uppers will be very subdued compared to the lowers. <BR> <BR>can anyone point me in a direction to follow? <BR> <BR>also, i&#39;m having trouble with the second half of the lc character set. they lean, where the rest are upright. i&#39;m not sure there&#39;s much i can do about it though. <BR> <BR>is the second version too &#34;scripty&#34; ? <BR> <BR><img src="http://www.typophile.com/forums/messages/29/64968.gif" alt=""></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
