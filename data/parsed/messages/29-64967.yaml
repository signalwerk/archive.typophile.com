    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Tyler this is getting better and better. I can see how the -l- could read as a -long-S- but I think context helps a lot. Hmm. Tough call. Either way I am really loving this. Lots of fun. Alternates can make or break a typeface, but you have offered so many it can ONLY be a good thing. &#40;It always sucks when a typeface says it has alternate characters and the reality is that two of the characters have alternates.&#41;</font></font></font>
