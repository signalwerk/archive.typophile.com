  date: 2004-11-11T10:45:00
  date_raw: Thursday, November 11, 2004 - 10:45 am
  votes: null
  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">a swedish colleague of mine recently purchased an opentype font. he&#39;s running windows NT. he wants to access things like the alternative figure styles.  <BR> <BR>some of his applications support unicode but not opentype layout features, so i advised him to insert the desired glyphs through character map. <BR> <BR>trouble is, his character map seems different to mine, and only seems to support the first 255 characters &#40;ascii?&#41; <BR> <BR>here&#39;s a screenshot of his charmap: <BR><img src="http://www.typophile.com/forums/messages/4101/53419.gif" alt="swedish"> <BR>here, for comparison, is my charmap, offering the full range of glyphs in the font: <BR><img src="http://www.typophile.com/forums/messages/4101/53420.gif" alt="british"> <BR> <BR>any ideas would be greatly appreciated. thanks, geraint</font></font></font></font></font></font></font></font></font>'
comments:
  - id: 82391
    user: 909
    date: 2004-11-11T10:52:00
    date_raw: Thursday, November 11, 2004 - 10:52 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">IIRC, NT supports Unicode. However, the CharMap utility may be a bit different. It may be that the NT CharMap only views specific Unicode ranges one at a time, instead of being able to browse through all of Unicode. That might also make it hard to get to private use codepoints or other odd things. <BR> <BR>Your friend should poke about for an option like the &#34;advanced view&#34; that enables full Unicode browsing in the Win 2000 and later CharMaps. <BR> <BR>T</font></font></font></font></font></font></font></font>
  - id: 82392
    user: 1133
    date: 2004-11-11T10:54:00
    date_raw: Thursday, November 11, 2004 - 10:54 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">1. With Character Map, one is only able to access the alternate characters if they are encoded in the Private Use Area. While the Calaxie Polaris font &#40;by Thirstype&#41; supports this, not all OpenType fonts support PUA because, in a way, it is a sort of a &#34;hack&#34;.  <BR> <BR>2. While the Windows NT character map looks different, it supports Unicode ranges -- just like the Windows XP character map. In the Windows NT character map, the Unicode ranges are shown in the list that in the Swedish version is labeled &#34;Delm�ngd&#34;.  <BR> <BR>Tell your friend to scroll down that list to see something that says &#34;Private Use Area&#34; in Swedish. He should be able to find the alternate characters there.  <BR> <BR>Regards,  <BR>Adam</font></font></font></font></font></font></font>
