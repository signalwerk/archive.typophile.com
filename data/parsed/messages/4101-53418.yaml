    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">many thanks for the advice: i&#39;ve spoken to him and he can now access the ranges, including the all-important private use area <BR> <BR>incidentally adam, you say &#39;hack&#39;, but is there any other way to encode multiple glyphs &#40;eg alternates, figure styles&#41;?</font></font></font></font>'
  - id: 82590
    user: 1133
    date: 2004-11-12T12:29:00
    date_raw: Friday, November 12, 2004 - 12:29 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Geraint,  <BR> <BR>Encoding alternates &#40;swashes, old-style ligatures, small caps, inital versions etc.&#41; or ligatures should be done only through advanced typographic layout features. The by far most popular and relevant advanced typographic layout system is OpenType Layout.  <BR> <BR>Practically, alternates and ligatures should not be encoded via Unicode, but only by associating them with the basic glyphs using OpenType Layout features.  <BR> <BR>Assigining PUA Unicode indexes are just a hack, its aim is to allow the user to access the alternate glyphs in applications that do not support OpenType Layout features. The main problem is that glyphs inserted into the text corrupt the text logic: a small cap &#34;a&#34; inserted into the text using PUA Unicodes will not be recognized by the application&#39;s spell-checker, hyphenation algorithm, or the find-and-replace feature. Similarly, copying-and-pasting the text or changing the font will result in corrupted text: square boxes instead of the actual letters.  <BR> <BR>Regards,  <BR>Adam</font></font></font>'
