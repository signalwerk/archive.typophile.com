  html: '<font class="dontLookLikeCrap">To whomever it may concern, <BR> <BR>As some of you already might&#39;ve noticed, I have a new weekly column  <BR>on Typographer.org in which I critique recent typeface releases. <BR> <BR>If you are releasing a new typeface/type family or know about any <BR>interesting new releases, I would be very grateful if you&#39;d notify me. <BR> <BR>The first two instalments can be read here: <BR><a href="http://www.typographer.org/2005_01_01_digests.html" target="_blank"> Bald Condensed 1</a> Review of FTF Garda Titling &amp; FTF Flama <BR><a href="http://www.typographer.org/2005_02_01_digests.html#110742194966337319" target="_blank"> Bald Condensed 2</a> Review of 30 new type families from Device</font>'
