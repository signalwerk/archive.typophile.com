  html: '<font class="dontLookLikeCrap">============================================================ <BR>LinoLetter 02/05 - What a Bargain! Five Outstanding Stencil Fonts <BR>============================================================ <BR>An online version, illustrated with images of this month�s  <BR>featured typefaces, is available on the Linotype website via  <BR>the following link: <BR>- <a href="http://www.linotype.com/8-38-8-18097/issue2005-02.html" target="_blank">http://www.linotype.com/8-38-8-18097/issue2005-02.html</a> <BR> <BR>! Welcome to the February issue of LinoLetter ! <BR> <BR>INTRODUCTION: <BR>We have four special offers in store for our readers this  <BR>month: first, Linotype�s design experts have pulled together  <BR>five of their most interesting stencil fonts into the new  <BR>Stencil Value Pack, on sale now at an unbeatable price! Also  <BR>this month, we are pleased to present the unconventional  <BR>Varius fonts, as well as a recap of the many revivals of the <BR>Renaissance Garamond typefaces available in our Webshop,  <BR>and notice of a recently released DVD documentary film about  <BR>the life of the virtuoso contemporary type designer Adrian  <BR>Frutiger. <BR> <BR>For all lovers, February 14th is the highlight of the year.  <BR>Our Valentine�s Day font collection will help put you in the  <BR>right mood to celebrate this extraordinary day. <BR> <BR>Have fonts of fun! <BR> <BR> <BR>------------------------------------------------------------ <BR> <BR>IN THIS ISSUE:  <BR> <BR>1.  Stencil Value Pack: Download five fantastic stencil  <BR>    fonts at once <BR> <BR>2.  Varius Font Family: A noble text design in six styles <BR>  <BR>3.  Garamond: A peek behind the classic name <BR> <BR>4.  The Man of Black and White: An Adrian Frutiger  <BR>    documentary on DVD <BR> <BR> <BR> <BR>____________________________________________________________ <BR> <BR>1.  Stencil Value Pack: Download five fantastic stencil  <BR>    fonts at once <BR>____________________________________________________________  <BR> <BR>If you have been on the lookout for a round up of some of  <BR>the best-loved modern stencil fonts, then look no further:  <BR>Linotype has collected its five favorite examples in one  <BR>low-cost value pack. These fonts provide the perfect touch  <BR>to documents requiring tactile headlines or display  <BR>elements. Let them inspire your next project! <BR> <BR>Special sale for the month of February only: get the  <BR>complete Stencil Value Pack for just USD/EUR 29,50!  <BR>Download now: <BR>- <a href="http://www.linotype.com/6-2381-6/stencilvaluepack.html" target="_blank">http://www.linotype.com/6-2381-6/stencilvaluepack.html</a> <BR> <BR> <BR>____________________________________________________________ <BR> <BR>2.  Varius Font Family: A noble text design in six styles  <BR>____________________________________________________________ <BR> <BR>The shapes of the f-holes on a violin reminded German  <BR>designer Andr� Maa�en of an italic letter &#34;f&#34;. Maa�en used  <BR>these captivating contours as the basis unit for his type  <BR>family, Varius, an elegant and creative family of text fonts  <BR>that deserves special attention for its excellent use of  <BR>OpenType alternate glyphs and ligatures. The Varius family  <BR>also includes a font of musical symbols and notations, as  <BR>well as an elegant ornaments font that can be used in  <BR>conjunction with the text fonts or on its own to create  <BR>beautiful borders and individual decorative elements. <BR> <BR>Varius is well-suited for use in many applications,  <BR>including body text, headlines, posters, book design, screen  <BR>design, and even corporate identity design. Setting Varius  <BR>in different sizes allows all of the facets of its design to  <BR>come forward: the effects are as versatile as the  <BR>possibilities! <BR> <BR>Check out the Varius family here: <BR>- <a href="http://www.linotype.com/7-2389-7/varius.html" target="_blank">http://www.linotype.com/7-2389-7/varius.html</a> <BR> <BR> <BR>____________________________________________________________ <BR> <BR>3.  Garamond: A peek behind the classic name <BR>____________________________________________________________ <BR> <BR>Punch cutter and publisher Claude Garamond &#40;ca. 1480-1561&#41;  <BR>created typefaces and books that profoundly influenced the  <BR>future development of typography. The Linotype Library has  <BR>several digital fonts inspired by Garamond�s old style  <BR>typefaces; though they vary in design and exact model of  <BR>origin, each is considered a distinct representation of  <BR>French Renaissance style, easily recognizable by its  <BR>elegance and readability. Garamond�s work went on to  <BR>influence future generations of type designers, many of  <BR>whose designs have been revived by the Linotype Library  <BR>over time as well. Typefaces falling under the  <BR>Garamond-pedigree include Stempel Garamond, Adobe Garamond,  <BR>ITC Garamond, Simoncini Garamond, Garamond #3,  <BR>Garamond No 5, ITC Garamond Handtooled, and Garamond  <BR>Classico. <BR> <BR>Dive into the world of Garamond, and pick out the fonts that  <BR>are best for you:  <BR>- <a href="http://www.linotype.com/13305/garamond-doc.html" target="_blank">http://www.linotype.com/13305/garamond-doc.html</a> <BR> <BR> <BR>____________________________________________________________ <BR> <BR>4.  The Man of Black and White: An Adrian Frutiger  <BR>    documentary DVD <BR>____________________________________________________________ <BR> <BR>Adrian Frutiger is one of the most important type designers  <BR>of the modern age. He has created more than thirty  <BR>typefaces, including the world-renowned Meridien, Univers,  <BR>and Frutiger families. This straightforward yet sensitive  <BR>film is a visual portrait of the brilliant designer and his  <BR>work. It presents Adrian Frutiger�s extraordinary  <BR>achievements in a new way, giving prominence to him as well  <BR>as to his relationship with nature and the great influence  <BR>it played on his entire life. <BR> <BR>�The Man of Black and White,� from award-winning documentary  <BR>filmmaker Christoph Frutiger, is now available on DVD  <BR>exclusively from the Linotype Webshop. Order your copy now: <BR>- <a href="http://www.linotype.com/6-26-6/merchandise.html" target="_blank">http://www.linotype.com/6-26-6/merchandise.html</a> <BR> <BR> <BR> <BR>------------------------------------------------------------ <BR> <BR>Don�t Forget! <BR> <BR>Linotype.com offers a wide variety of possibilities that may  <BR>help you find the right typeface or font package, as well as  <BR>the chance to try the fonts out and make a purchase. This  <BR>month, check out our Valentine Value Pack, and get up to  <BR>speed on OpenType, the new and flexible cross-platform font  <BR>format. <BR> <BR>Valentine Value Pack <BR>February 14th is the romantic highlight of the year, and  <BR>Linotype has just the thing for you this Valentine�s Day.  <BR>Our Valentine Value Pack includes affectionate calligraphic  <BR>scripts, handwriting, and symbol fonts that should appeal  <BR>both to young lovers and lovers of the young at heart.  <BR>Download them now for your sweetheart, or for any personal  <BR>Valentine�s Day designs, before time runs out! <BR>- <a href="http://www.linotype.com/6-1964-6/valentinevaluepack.html" target="_blank">http://www.linotype.com/6-1964-6/valentinevaluepack.html</a> <BR> <BR> <BR>OpenType Fonts <BR>OpenType is a new cross-platform font format, collaboratively  <BR>developed by Adobe and Microsoft. OpenType fonts offer many  <BR>advanced typographic features to their users, including the  <BR>capability to switch between alternate glyphs, and to set  <BR>multiple languages and writing systems. To date, Linotype  <BR>offers over 1,600 fonts in the OpenType format. Learn more: <BR>- <a href="http://www.linotype.com/7-1475-7/liste.html" target="_blank">http://www.linotype.com/7-1475-7/liste.html</a> <BR> <BR> <BR>&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42; <BR> <BR>We hope you found this issue of LinoLetter informative and  <BR>useful. We would highly appreciate your feedback at  <BR><a href="mailto:info@linotype.com">info@linotype.com</a> <BR> <BR>The next issue of this newsletter will be published and  <BR>dropped in your mailbox at the beginning of March. <BR> <BR>Your Linotype Library Online Team <BR> <BR> <BR>------------------------------------------------------------ <BR>Publisher: <BR>Linotype Library GmbH <BR>Du-Pont-Stra�e 1 <BR>61352 Bad Homburg / Germany <BR> <BR>Website: <a href="http://www.linotype.com" target="_blank">www.linotype.com</a> <BR>Contact: <a href="mailto:info@linotype.com">info@linotype.com</a> <BR>Phone &#43;49 6172 484-418 <BR>Fax   &#43;49 6172 484-429   <BR>------------------------------------------------------------ <BR> <BR>&#40;c&#41; 2005  Linotype Library GmbH</font>'
