post:
  id: 59673
  user: 1334
  date: 2004-05-10T14:05:00
  date_raw: Monday, May 10, 2004 - 2:05 pm
  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Of the many events planned for TypeCon, this year&#39;s benefit auction will be a great way to support your typophile habits and support SOTA at the same time. We will have a preview list posted soon that will give you some idea of the great items you can bid on at the Friday night auction. <BR> <BR>More to the point, we are starting to collect donations for the auction. If you have a spare 1923 ATF catalog, signed Frederic Goudy smoke proofs, or even more modest typographic items, we will grateful accept all donations. We will acknowledge all donors &#40;unless you wish to remain anonymous&#41; and all donations are tax deductible in the US since SOTA is a 501&#40;c&#41;&#40;3&#41; not-for profit organization. <BR> <BR>Send an email to <a href="mailto:richard@typesociety.org">richard@typesociety.org </a> if you would like to donate any items and we will send you additional information on how to donate. <BR> <BR>Thanks <BR>RK</font></font></font></font></font></font></font></font>
comments:
  - id: 60318
    user: 1334
    date: 2004-05-14T07:49:00
    date_raw: Friday, May 14, 2004 - 7:49 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">We are getting some nice donations for the auction.  <BR> <BR>In the past, we have limited the auction bidding to those present at TypeCon.  Just as a hypothetical, what do people think of having absentee bids allowed for people who cannot make the conference? <BR> <BR>It is just a thought at this point. <BR> <BR>RK</font></font></font></font></font></font></font>
  - id: 60326
    user: 1947
    date: 2004-05-14T08:59:00
    date_raw: Friday, May 14, 2004 - 8:59 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; <BR> <BR>I think the main value of the auction &#40;aside from raising money&#41; is that of entertainment. Keeping the bidding going and watching people&#39;s reaction to that bidding. I&#39;m not sure phone bids would add to the entertainment, and it would be a bigger burden on the auctioneer to get it right. <BR> <BR>I say no. <BR> <BR> </font></font></font></font></font></font>
  - id: 60329
    user: 108
    date: 2004-05-14T09:16:00
    date_raw: Friday, May 14, 2004 - 9:16 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I agree with James. The auction should be for those who do attend TypeCon. Running the auction &#40;from the help I gave last year&#41; is a blast, confusing, but a blast. I think adding phone management would do remove some of that. </font></font></font></font></font>
