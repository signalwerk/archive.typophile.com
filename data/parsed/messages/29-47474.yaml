    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">thanks miss tiff. you&#39;re the other person i was waiting to comment. ;^&#41; i don&#39;t think a branding iron would literaly produce flames, but i thought fire would be easier to &#34;code&#34; than smoke. and i don&#39;t need a strict literal interpretation of the branding iron anyway. oh and flames are just cool. ha ha <BR> <BR>but what do you think of the lettering? is it too much? superfluous? are the lettershapes sound? is it</font></font></font>
  - id: 73305
    user: 3768
    date: 2004-08-27T07:27:00
    date_raw: Friday, August 27, 2004 - 7:27 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Paul, <BR> <BR>I like how your mark has developed. Your latest posting although simpler in design from the originals is much more dramatic. A terrific improvement. A couple of minor comments, the \ stroke of the X looks a little thin and something about the 3-d effect is slightly off because X doesn&#39;t seem to be lying on the same plane as the H. One last thought, personally I&#39;d like to see the mark and the type relate more. Have you tried using the slab serif HX in the flame mark instead of the sans?</font></font>
  - id: 73477
