    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">...for your help i guess it was. <BR> <BR>anyhow i did my best to come up with some suitable lettering. it&#39;s no Dispatch, but this little scratch of lettering has a lot of me in it i was actually shocked that that comes through in beziers. after i spent a ridiculous amount of time on the lettering i placed it with the art and figured it probably doesn&#39;t even need it! i guess i&#39;d probably end up using the mark and the lettering separately. anyhow, take a look, lemme know whatcha think. <BR> <BR><!--attachment: HX07-47590.swf*attachment_icon.gif*application/x-shockwave-flash*1.8*logo+%26%2343%3b+lettering+%3d+%3f%3f%3f*HX07%2eswf --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/attachment_icon.gif" align=left alt="application/x-shockwave-flash">logo &#43; lettering = ???<br><a href="http://www.typophile.com/forums/messages/29/HX07-47590.swf" target="_blank"><b>HX07.swf</b></a> (1.8 k)</td></tr></table></center><!--/attachment--></font></font></font></font></font></font></font>'
