  date: 2004-08-25T00:11:00
  date_raw: Wednesday, August 25, 2004 - 12:11 am
  votes: null
  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">okay, so here&#39;s a little something i&#39;ve been trying to put together for myself. i&#39;m a native Arizonian and my people are cow-punchin&#39; ranch folk and the &#34;brand&#34; in this logo is my family&#39;s actual brand - like they put on cattle &#39;n&#39; such, so it&#39;s got a bit of sentimentality behind it. i tried to develop the concept that was bouncing around in my head and here are the results. now i need some help ironing &#40;no pun intended&#41; out the kinks and generally making this hold together. anyhow, any help would be greatly appreciated.  <BR> <BR>here goes nuffin... <BR><img src="http://www.typophile.com/forums/messages/29/47475.gif" alt="with tag"> <BR><img src="http://www.typophile.com/forums/messages/29/47476.gif" alt="plain: sans stripes"> <BR><img src="http://www.typophile.com/forums/messages/29/47477.gif" alt="with color"></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
comments:
  - id: 72885
    user: 2915
    date: 2004-08-25T04:53:00
    date_raw: Wednesday, August 25, 2004 - 4:53 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Paul I&#39;m not a big fan of the 3D effect. With Adobe Illustrator CS You are going to see alot of cheesy 3D so you might not want to go there. I love the flames though. I&#39;m not in love with the campy cowboy HX Brand type, its 2004 not 1864. Loose it, just my suggestions</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 72891
    user: 1058
    date: 2004-08-25T05:21:00
    date_raw: Wednesday, August 25, 2004 - 5:21 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Paul <BR> <BR>...well this is the best thing to communicate with designers all around the world. I could never meet i greek who designs a logo for a ranch. <BR> <BR>Anyway my view is that you need to make less lines and more tight composition. I would propose to keep dark the width of the letters &#40;as in your last proposal&#41; and if possible to avoid the inner light of the fire so the flames can just be black and describe the shape of the letters. If you sure need to keep the inner parts of the fire you could maybe use them dark and the outer shape with a fat and calligraphic outline. <BR> <BR>I realy had a hard time to explain in english what i mean and hope you understood. If not is reasonable why. <BR> <BR>christos</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 72945
    user: pablohoney77-users
    date: 2004-08-25T09:44:00
    date_raw: Wednesday, August 25, 2004 - 9:44 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">thanks for your comments thust far. let me take a bit of time to respond <BR> <BR><i>I&#39;m not a big fan of the 3D effect. With Adobe Illustrator CS You are going to see alot of cheesy 3D</i> <BR>darnation! this was my concept before i hoped on illustrator and even knew you could do this 3D thing... maybe i should use my &#34;3-D&#34; sketches but i wanted this to be really clean. is 3D really that cheesy? any other opinions? the main thing is that i wanted to give the HX mark some weight when set on an angle, i don&#39;t want them feeling flimsy. what would be a good alternative to give weight to the mark? i guess i&#39;m not married to this design, it&#39;s just the strongest concept i&#39;ve come up with so far, but i can do some more brainstorming... <BR> <BR><i>I&#39;m not in love with the campy cowboy HX Brand type, its 2004 not 1864</i> <BR>i was actually shooting for comtemporary but maybe this is too 70s? 2000? instead of 2004. Again I&#39;m not wedded to this type, i just stuck it in there to comp the feel of having a tag there in that spot. i&#39;m not sure if it helps or hinders there. Maybe i&#39;ll try to draw some beautiful slab letters like <a href="http://fontbureau.com/fonts/font_frames.tpl?cart=109345214610152766&amp;fontname=Dispatch" target="_blank"> FB&#39;s Dispatch</a> for the tag. <BR> <BR>Christos: <BR>Is this what you meant? if so it&#39;s genius! but maybe you had something even more genius in mind. let me know what you think. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/47533.gif" alt="revised B&amp;W"></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 72951
    user: 2236
    date: 2004-08-25T10:25:00
    date_raw: Wednesday, August 25, 2004 - 10:25 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Paul: <BR> <BR>This last post is a huge improvement. There is definitely a difference between &#34;3-D&#34; and &#34;cheesy 3-D&#34;, and this last post is not &#34;cheesy&#34;. You have a much better use of your positive/negative space. <BR> <BR>Before seeing your last post, my main comment was going to be that I usually see brands on a more vertical plane &#40;on the side of cattle&#41;. I didn&#39;t immediately think brand when seeing your graphic. I realize that the branding iron would probably be seen this way, but there is no handle/pole coming from the brand to identify it as the iron. <BR> <BR>Aloha! <BR>Scott</font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 72960
    user: pablohoney77-users
    date: 2004-08-25T10:43:00
    date_raw: Wednesday, August 25, 2004 - 10:43 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Scott, <BR> <BR>i was waiting for you to comment. ;^&#41; <BR> <BR>Maybe i should clarify a bit better. My whole concept with this logo plays off the word &#34;brand.&#34; Yes, this HX mark is my family&#39;s brand as in branding iron, but i acutally want to take the mark from the meaning it had in 1864 to the present meaning: &#34;a trademark or distinctive name identifying a product or manufacturer&#34;-- Websters &#40;not necessarily a big hunk of metal&#41; That said i want to keep some of the symbolism of the branding iron - thus the flames and the rust-colored HX in the first post. So no one really needs to &#34;see&#34; a brand as in a hunk of metal on a post, but i want it to be &#34;felt.&#34; does that make any sense? <BR> <BR>oh and thank you for the &#34;not cheesy&#34; comment. i feel much better now.  <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0></font></font></font></font></font></font></font></font></font></font></font>'
