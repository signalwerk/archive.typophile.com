    html: '<font class="dontLookLikeCrap">Paul, I like the inclusion of the &#34;HX Brand&#34; type beneath the marque where appropriate. The only snafu I see &#40;which probably won&#39;t be a problem&#41; is many trendy clothing companies do the same with their logos� place a logo image captioned with &#34;foo brand&#34;. <BR> <BR>I actually liked the Western type in #1 better than the one in the SWF; have you tried Clarendon? Also, I agree with Kirsten, there&#39;s something funny happening at the join of the H and X.</font>'
