    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Sounds like a great project. I love some things about Berling &#40;like the short descenders&#41; but also see some anachronisms. It&#39;s notable that Bill Hill chose Berling as the native font of the MS Reader software when that was lauched, probably for a combination of reasons, including its performance in ClearType as well as its high readability for book work. I also like that the Bold isn&#39;t too dark &#40;at least in the Lino version&#41;. The two things I don&#39;t like are: <BR>1&#41; The head serifs seem very affected. <BR>2&#41; The caps are a bit large. <BR> <BR>Also, since the x-height is nice and small you might consider giving it hybrid numerals. <BR> <BR>Lastly, if you really want to get heavy, you should give it two italics: a rigid one of moderate incline and Roman features, and a cursive one that&#39;s steeper. <BR> <BR>hhp <BR></font></font></font></font></font>'
