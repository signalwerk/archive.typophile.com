  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Calling all typophiles: <BR> <BR>My agency, Pangea design, are about to design <i>Berling nova antiqua</i>. <BR> <BR>All contracts have been signed with proper authorities, and we have the blessing of Geith Forsberg, the widow of Karl-Erik Forsberg, the designer of Berling. <BR> <BR>As familiar with most of you, some of the typefaces made in metal have through the years and through technique or lack thereof, moved from dynamic useful typefaces to either dull, anorectic or plain bad interpretations.  <BR> <BR>This is not the case with the present Linotype version, which we think is good. It is not, however, complete. <BR> <BR>Our goal is to design a new book version and a new display version. It will include both going back to the sources <i>and</i> making the on-screen appearence good.  <BR> <BR>We&#39;ve been given access to Linotypes sketches, friskets, letraset letters, photo setting versions, early sketches by Forsberg &#40;unfortunately the original sketches given to the type punchers have vanished&#41;, new found and unused metal types have been printed in various sizes for us to use. The typographic guild in Stockholm have been briefed for feedback too. <BR> <BR>I would like to know what you think about this project, in general, and more specific, what would you like a new Berling to perform, something the current versions, unauthorized or not, don&#39;t? <BR> <BR>Which Berling do you prefer? The Linotype, Adobe, Scangraphic, Bitstream, megafonts or maybe some other version? <BR> <BR>For <i>what</i> do you use it? <BR> <BR>I believe the amount of knowledge on this site could give the project a definite good boost, and if there&#39;s interest I could keep you updated.  <BR> <BR>Yours, <BR>�redrik  <BR> <BR> <BR>  </font></font></font></font></font></font>'
