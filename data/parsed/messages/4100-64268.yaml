  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hello to all... it&#39;s been some while since I had much opportunity to contribute. Good to have a free moment to get back in the community. <BR> <BR>I&#39;m looking for some ideas, along the lines of type suggestions for an identity I &#40;we&#41; are developing. <BR> <BR> <BR>I would love to post the design briefs, but that are anything but brief, near 6 pages of 10 point type. <BR> <BR>So here are the basics: <BR> <BR>Company: Blume Custom Homes <BR>Type of Company: Custom home builder, 1.5&#43; <BR>They are on of the top ten custom home builders around. Building mainly in the southwest region. <BR>We have finished the mark and color systems and are now moving on to a type system. I am looking for two famlies. <BR> <BR>The feeling is custom, artistic, one-of-a-kind, unique, southwestern, arizona, new mexico. <BR> <BR>We are using a slightly modified Mantinia for the name in the mark, the subline of text &#40;custom homes&#41; is set in Quadratta Sans &#40;sp&#41; <BR> <BR>&#40;1&#41; for headlines and use at large point sizes, 24&#43; point sizes. Im thinking a serif, possibly even a script. This has to be mature, and challenging, if that makes sense. <BR> <BR>&#40;2&#41; A family for body copy, needing SC, text figures and lining figures. Im thinking sans, something along the lines of scala, possibly something like a semiserif, or wedge even? <BR> <BR>Just looking for some suggestions, I seem to be in a bit of a rut. I would like to keep the total for font purchase to aroun $300 USD, if possile. <BR> <BR>Love to hear your thoughts. <BR> <BR>Cheers! <BR> <BR><!--attachment: Blume_CustomHomes_Mark-64269.pdf*mime_pdf.gif*application/pdf*26.3*Mark+and+Grid+for+mark*Blume_CustomHomes_Mark%2epdf --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align=left alt="application/pdf">Mark and Grid for mark<br><a href="http://www.typophile.com/forums/messages/4100/Blume_CustomHomes_Mark-64269.pdf" target="_blank"><b>Blume_CustomHomes_Mark.pdf</b></a> (26.3 k)</td></tr></table></center><!--/attachment--></font></font></font></font></font></font></font></font></font>'
