  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">hi there, i am a graphic design student  doing a project on an exhibition of explorers of the last 250 years and am looking for a typeface to use for the identity. the typeface is for use in the logo. <BR> <BR>i am keen to use a serif typeface but not too classical, a contemporary interpritation would be ideal, can anyone suggest any favourites or nice ones? <BR> <BR>the artwork i am producing contains certain details of victoriana and floral flourishes but in a fresh way, a bit deconstructed. i want the work to look contemporary but with one eye on past styles of the explorers era, so i feel the chosen typeface must mirror this concept. <BR> <BR>any help is greatly appreciated.</font></font></font></font></font></font></font></font></font></font></font>
