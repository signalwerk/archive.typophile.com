    html: <font class="dontLookLikeCrap">your help is greatly appreciated people as always. i am still considering my options on this one!  <BR> <BR>i feel that with the typeface being used primarily for a logo and therefore a corporate &#39;styling&#39;, i have to take a little time to experiment. this logo will be the &#39;face&#39; of the exhibition to appear on all promotional stages and media, so i really wouldn&#39;t like to rush it. <BR> <BR>the typrface has to be fully legible quite small, no smaller than probably 7pt. <BR> <BR>just to say, i was only recently introduced to this site, and already i have found it to be of great help, other peoples opinions, i feel, do indeed help, and open up avenues of typefaces i never explored before.</font>
