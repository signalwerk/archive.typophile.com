  html: <font class="dontLookLikeCrap">We&#39;re happy to say that we&#39;ve gotten some good press mentions today in SFWeekly, a local paper here in San Francisco. Associate Editor and Bay Area typophile Karen Zuercher wrote a piece on the Typophile Film Festival and the local Bay Area typography community.  <BR> <BR>Read the SFWeekly <a href="http://sfweekly.com/issues/2005-01-12/calendar/nightday2.html">pre-show</a> and <a href="http://sfweekly.com/issues/2005-01-26/culture/books.html">post-show</a> writeups. <BR> <BR>The first public screening of the Typophile Film Fest took place two weeks ago today. Response was so overwhelming that we had to open a 2nd show at the last minute to accommodate the crowd. This night could not have been possible without the generosity of <a href="http://www.fontshop.com">FontShop</a>, <a href="http://www.111minnagallery.com">111 Minna Gallery</a>, <a href="http://www.typesociety.com">SoTA</a> and <a href="http://www.punchcut.com">Punchcut</a>, and, of course, the filmmakers themselves, some of which were able to attend the event. The festival first premiered as part of TypeCon &#39;04, in San Francisco <BR> <BR>Thanks and kudos to all the filmmakers who were a part of our inaugural festival.  <BR> <BR><b>If you have a type film you&#39;ve created and/or know of one that should be in this summer&#39;s festival at Typecon NYC, please contact us immediately at <a href="mailto:filmfest@typophile.com">filmfest@typophile.com</a>. Spaces are limited and running out, so act now!</b>  <BR> <BR>jb</font>
