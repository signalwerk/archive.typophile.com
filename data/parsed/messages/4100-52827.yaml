    html: '<font class="dontLookLikeCrap">&#62; 6pt Helvetica <BR> <BR>I think my tea will shortly be coming out backwards... <BR> <BR>There&#39;s always some type on eBay, but: <BR>1&#41; The keywords vary, especially among people who are selling stuff they don&#39;t understand. Some people for example use the term &#34;hot stamping&#34; to mean lead type.  :-/ <BR>2&#41; Be careful of crappy ones. Like there&#39;s this guy who sells them heaped in plastic bags... <BR> <BR>Here&#39;s something decent: <BR><a href="http://cgi.ebay.com/ws/eBayISAPI.dll?ViewItem&amp;category=46735&amp;item=3849892871&amp;rd=1&amp;ssPageName=WDVW" target="_blank">http://cgi.ebay.com/ws/eBayISAPI.dll?ViewItem&amp;category=46735&amp;item=3849892871&amp;rd=1&amp;ssPageName=WDVW</a> <BR> <BR>Also: besides avoiding Helvetica outright, I would recommend staying away from very small sizes. Not because they&#39;re useless, but because they might sap your passion for typesetting. I know I personally hate fidgeting with the really small stuff. <BR> <BR>hhp</font>'
