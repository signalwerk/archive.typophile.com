  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;m new to typography and I&#39;d really like to get my hands on some metal typefaces play around  and get my hands dirty, I&#39;ve searched the net and so far all I found was some 6pt Helvetica on e-bay. <BR> <BR>Does anybody know of anywhere in London that I can buy some faces either 2nd hand or new???</font></font>
