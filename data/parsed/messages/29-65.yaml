    votes: null
    html: I think it&#39;s coming together pretty nicely. <BR>Your &#34;k&#34;s are very nice - much improved. The lc &#34;a&#34; is especially handsome. The only major eyesore is the lc &#34;c&#34; &#40;and the UC also&#41;. I think the lc &#34;r&#34;&#39;s beak is still too big for even spacing. And the lc &#34;f&#34;&#39;s ascender could be braver. BTW, you might try giving the lc &#34;j&#34; a one-sided serif, to the left. Oh, and I love the UC &#34;Y&#34;. <BR> <BR>As for the name, it sounds really cool, but the meaning might clash somewhat with the look. <BR> <BR>hhp
