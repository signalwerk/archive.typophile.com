    html: Ok i&#39;ve finally gotten around to making some revisions to this face. I think I&#39;m going to rename it Allium-- it&#39;s gotten way to formal for a name like raisin nut. I increased the width of the serifs and tweaked the caps quite a bit. As soon as I can get it to work I will post an swf. <BR> <BR><IMG SRC="http://www.typophile.com/forums/messages/29/166.gif" ALT="alluim1">       <IMG SRC="http://www.typophile.com/forums/messages/29/167.gif" ALT="allui2">
