    html: "I&#39;d say that the UC &#34;K&#34; and &#34;Q&#34; and <BR>the lc &#34;g&#34; need work, otherwise <BR>pretty nice! <BR> <BR>As for making it work in a block of <BR>text, good spacing is key. In terms <BR>of letterforms, the only real problem <BR>I see is the lc &#34;r&#34;: shorten its beak, <BR>and that&#39;ll help. <BR> <BR>Also note, however, that there are two <BR>things that would help it as a text face: <BR>1. Making the descenders longer. <BR>2. Possibly adding a little bit of weight. <BR> <BR>hhp"
