    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Andy you have the same problem your classmates have. Ask your self: Why would anyone know this word/place is a restaurant? The name looks like it could be a night club, plus you gave no explaination of the type of restaurant it is. Is it McDonalds or Le Cirque, is it French or Asian. The logo means nothing without brand idenity. So make it painfully clear its about food and the kind of place it is.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 59502
    user: 804
    date: 2004-05-08T15:47:00
    date_raw: Saturday, May 08, 2004 - 3:47 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I concur with Daniel. in addition I think your instructor must lack some passion, if everyone seems to be going in the wrong direction I suspect this instructor could not make a living in the real world and decided to teach instead. Unfortunate for his/her students, but regardless, the students can still do the quality work for themselves regardless of how low the standards the teacher places on passing or even good grades. <BR> <BR> <BR>Here is am example of some work I did a few years ago. that I think is nice and well though out. Exterior circular logo was not designed by me . My task was to improve and build upon what was existing-at the lowest cost possible. <BR> <BR>I would expect you can tell a lot about this place &#40;price point, atmosphere, services/products, etc...&#41; without any written explanation.  <BR> <BR>It is a hip coffeebar, they show art, they serve great coffee,  <BR>they offer crepes and waffles for breakfast. Neighbor hood is  <BR>Belltown, just north of Seattles&#39; downtown business district, urban, somewhat stylish clients. Simple. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/35445.jpg" alt="lux"> <BR> <BR>boxed &#34;X&#34; is closed sign, Lux logo was re-created as interior identity/art with flourescent lights-simple, cheap post modern. <BR>Food icons were placed on windows in vinyl by entrance.Top image was postcard. &#40;mechanical shark may look familiar it was  <BR>on MTV for a while after someone from thee saw it at the cafe and licensed artist for use on MTV&#41; </font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 59516
    user: 3437
    date: 2004-05-08T22:22:00
    date_raw: Saturday, May 08, 2004 - 10:22 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;ll also agree with Daniel; to me, a restaurant&#39;s identity is one location where the average customer should not notice flashy design or excellent typography. Of course the identity package you create must match the style and intended use of the restaurant, but &#39;overdesigning&#39; risks appearing contrived.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
