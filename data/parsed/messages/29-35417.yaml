    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#34; Because we all know <BR>how frustrating an in-class crit can be, everyone <BR>with an opinion and very few with a foundation <BR>to base that opinion on. &#34; <BR> <BR>Not to hijack the thread, but I find nothing can replace peer review. Even at the student level. Granted, a lot of this depends on the quality of the particular professor. When I was in school, I was fortunate enough to have professors that spent as much time teaching us the art of critique as they did teaching us the art of design...not to mention the art of presenting our own work. <BR> <BR>A lot of the restaurant logo posts in here have been &#39;this is a logo I made for a restaurant. What do you think?&#39; which is WAY to vague to be of any use to anyone giving a critique. As such, it seemes as if critiques were not being done in-class. <BR> <BR>Again...this in no way is meant as a critique of these students...I just found it a bit odd that it was happening.</font></font></font></font>
