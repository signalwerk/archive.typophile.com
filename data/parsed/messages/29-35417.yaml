    date_raw: Sunday, May 09, 2004 - 5:39 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#42;Double post. Server keeps giving me errors. Sorry.&#42;</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 59581
    user: 804
    date: 2004-05-09T21:15:00
    date_raw: Sunday, May 09, 2004 - 9:15 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Roh. I read your critique.My reply- The Lux work is supposed to look minimalist &#40;or generic as you described it&#41;. Lux is located between upscale independent clothing stores and restaurants. It is not supposed to look expensive &#40;nor inexpensive&#41;. The prices are a bit higher than most cafes &#40; as well as quality&#41;, but it was not owners desire to specifically express the aspect. This is Seattle and most people do not care if it costs a bit more. People wanting Starbucks or Tullys can walk a block in any direction and find either &#40;again this is Seattle&#41;. Lux is different from both of these large Espresso mega chains. Lux venue is sometimes host to a variety of events from Dj music nights, poetry, art openings, etc. But none of these events are on regular schedules, nor part of Lux&#39;s core business.  <BR>The identity has served the client well for the last few years. Besides, it&#39;s businesscard &#40;which features logo&#41; was recently published in a graphic design book &#34; Best of Businesscards 6&#34; from Rockport Publishing, so I guess at least some industry folks find it is attractive and functional sincve it was picked over 1000&#39;s of other entries.  Their older logo is shown below. At the time this logo was used, furniture was mostly handmade wrought iron, and place had more of a casual &#34;artsy&#34; feeling. This was partially changed because people would hang out all day and buy less. New identity and interior changes improved sales and brought profits up to help owner sell business which was her desire with the changes. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/35521.jpg" alt="old lux"></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 59584
    user: 3679
    date: 2004-05-09T22:13:00
    date_raw: Sunday, May 09, 2004 - 10:13 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">hey  andy... hows it going... i reckon u should make the logo look more colourful as it  is a modern lookin restarants for young... im thinking of energetic colours ..  as it is young ... i see u did that with ur type but would be cool to see it in colour... and ya... its hard to read &#34;EIGHTY NINE&#34; and looking closely at the &#34; eighty nine&#34; i see that &#34;HTY&#34; seems to be bigger than the rest of the text... is that intentional or ... ?.... anyways .... good luck.. <BR> <BR> <BR>Hey Ole it would be nice to see you giving some positive feedback to Andy&#39;s work.... and give him suggestions to improve his logo.... laters! <BR></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 59585
    user: hodges-users
    date: 2004-05-09T22:18:00
    date_raw: Sunday, May 09, 2004 - 10:18 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Although im only a newbie to this forum, isnt it bad form to hijack someone else&#39; s thread? and yet it has so far been a bit me me me with this lux business.... <BR> <BR>Im from seatle myself -- Starbucks and Tullys arn&#39;t the only coffee shops in town, it  would be a mistake to compare oneself to them, much like it would be to compare a restaurant to mcdonalds in a design sence. <BR> <BR>In the industry you see a lot of varying design work and i happen to agree with what Roh was saying about how the lux design style is very generic and to me does not speak what the cafe is all about but presents a sterile view of a design style that is used everywhere. <BR>Does the coffee get served in a sealed plastic cup and rubber gloves? <BR> <BR>&#42;              &#42;                  &#42;             &#42;               &#42; <BR> <BR>Getting back to what we should all be here for....Andy Campbells logo... <BR> <BR>Very nice andy, the typography is stylish and unified, and straight away it says new and up beat. <BR>Perhaps a little color would pick it up a beat . <BR> <BR>I would say that the restaurant side of things would come out in its surrounding elements, and no more is needed in the primary logo to say this. <BR>It is nice, simple and memerable too, everything a logo should be.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 59595
    user: 804
    date: 2004-05-10T01:13:00
    date_raw: Monday, May 10, 2004 - 1:13 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">My apologies with the Lux post. I wanted to show something simple, and should have done something with subject at hand instead of dragging up my old work to illustrate my point. <BR> <BR>back on track... <BR>With regard to Jive 89. Perhaps looking into to roots of the word Jive and the culture in started in may be a good direction to take. I looked up the word in dictionary and came up with <BR> <BR>1. Jazz or swing music. <BR> <BR>2.The jargon of jazz musicians and enthusiasts. <BR> <BR>3.Slang. Deceptive, nonsensical, or glib talk: �the sexist, locker-room jive of men boasting and bonding� &#40;Trip Gabriel&#41;. <BR> <BR>As for the work you have shown, it is a bit cryptic for most, although I am personally a sucker for numeric looking type design. The numeric thing has been done a lot, especially in magazine design &#40;David Carson/Raygun for example&#41;, but is it dead ?-not sure. On it&#39;s way out-properly. Maybe to be on the safe side try to stick with just the inverted 3, and drop the rest of the numeric characters. The inverted 3 is properly the least cryptic of the batch. You can style it a several ways to make it more or less &#34;3&#34; like. example. <BR><img src="http://www.typophile.com/forums/messages/29/35536.jpg" alt="3"></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 59689
    user: kris-users
    date: 2004-05-10T15:45:00
    date_raw: Monday, May 10, 2004 - 3:45 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hello Andy. Didn&#39;t someone do the old  <BR>number/letter thing last term, or maybe  <BR>one before that? Why would you write  <BR>&#39;jive89&#39; when the logotype spells out  <BR>more or less 318HTY9183? It looks like <BR>a hip accountancy firm, at this stage,  <BR>more than a restaurant. I think that it  <BR>would be wide to listen to all forms of  <BR>critique, even if negative. Work with <BR>the word jive. It has such potential. <BR>More than just flipping numbers around. <BR>Good Luck. <BR> <BR>kris.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
