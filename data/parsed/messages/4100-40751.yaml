  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hello, <BR> <BR>Does anyone have any suggestions about rhythm of letterform design when working with the uppercase and lowercase?  <BR> <BR>In my case, I just finished sketching out the lowercase letters and am now trying to complete the uppercase. However, I do not know how to approach the uppercase in a way that I can retain the lowercase characteristics; lowercase seems more rounder than uppercase, which seems to have very sharp corners and angles.  <BR> <BR>In terms of rhythm, how would you design a upper/lower case set and yet at the sametime keep coherence so that they complement each other. Also, expanding out, how can this be applied to all other sets within its family?  <BR> <BR>Please help, thank you.</font></font></font></font></font>
