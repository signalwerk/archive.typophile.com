    html: <font class="dontLookLikeCrap">Mr. Jesse Lee. <BR>The spearhead of rhythm is the fusion of the identity and novelty. <BR>Attached is a sample from the course I had with Mr. Laurent Rebena, <BR>from Paris, note the differences in the scripts. <BR>If you want to understand Rhythm you can look at the moon, <BR>count from one to four when you skip or listen to music; <BR>or you can buy a book on calligraphy, take a pen and the ink, <BR>start with the Chancery style &#40;Cancelleresca&#41;. Don&#39;t be afraid, <BR>you won&#39;t fall into the inkpot. <BR>Best, <BR>AS <BR><img src="http://www.typophile.com/forums/messages/4100/40913.gif" alt=""></font>
