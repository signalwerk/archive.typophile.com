    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Well, first of all I feel that &#34;rhythm&#34; is a misleading term &#40;at least in the realm of text fonts&#41;. <BR> <BR>But terminological issues aside, the one &#40;possibly counter-intuitive&#41; thing I&#39;ve discovered about designing caps is that you can&#39;t make them too harmonious with the lc - that backfires. You just have to let them be what they need to be, and stick to ensuring overall stylistic consistency, even color, etc. Unless you&#39;re trying to break new ground... <BR> <BR>hhp <BR></font></font></font>
