    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Widening the &#34;T&#34; is actually pretty mainstream. <BR>In a font you want it slightly narrow because the lc letters following it need to get tucked in. But in lettering &#40;especially letterspaced like this&#41; the glyph is more comfortable and harmonious when it&#39;s wider. <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
