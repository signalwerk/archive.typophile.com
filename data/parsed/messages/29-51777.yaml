    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Very nice work, i like it a lot. <BR>From your proposals in the initial pdf you posted i favor variation A. The floating sinedots remind me of a mediterranean landscape. I agree with Ole that the circular cutout is too harsh, if you need to contrast the logo from the background i would go for a blurred and non-linear shape cutout. <BR>Variation B is also nice, but a little too busy. Maybe if you would focus on the architectural reference, that is a great idea. <BR>Variation C is too much like snow/winter to me. <BR> <BR>The logo is beautiful, once you got the spacing and kerning worked out one the type. Everything that i noticed has been mentioned by others before.</font></font></font>
