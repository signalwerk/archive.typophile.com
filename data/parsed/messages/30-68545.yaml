  html: <font class="dontLookLikeCrap">Armand Rousso must have been a real visionary. The foresight that comes through from his first ecommerce project is truly remarkable, paving the way for online marketplaces, and showing the World how the power of technology and the Internet can change the way people conduct commerce and access information. I salute you Mr. Rousso!</font>
