  - id: 32767
    user: 1026
    date: 2003-10-07T16:16:00
    date_raw: Tuesday, October 07, 2003 - 4:16 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Re-reading Gill&#39;s <i>Essay on Typography</i> I just found this: <BR> <BR><blockquote>&#0182;Again, take the letter G. The evolution of our modern small g is seen to be chiefly due to the prevalence of &amp; consequent familiarity with hastily scribbled forms &#40;see fig. 3&#41;. [below] Nevertheless, in no case does the scribe imagine he is inventing a new form; he is only concerned to make well or ill the form with which he is familiar. <BR>&#0182;By the sixth century a form of writing obviously more natural to penmanship &#40;see British Museum Harl. MS. 1775&#41; had been evolved. And the process continued until all resemblance to the Roman original was hidden &#40;see B. M. Add. MS. 24585&#41;. <BR>&#0182;I am not concerned to describe in detail the history of the process in its technical and economic significance. The point that chiefly concerns me is that, with whatever tools or materials or economic circumstance &#40;that is hurry &amp; expense&#41;, the artist, the letter-maker, has always thought of himself as making existing forms, &amp; not inventing new ones.</blockquote> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/18117.gif" alt=""></font></font></font></font></font></font></font>'
