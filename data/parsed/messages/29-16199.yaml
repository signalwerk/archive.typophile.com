    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think just looking at the g in most samples of Carolingian Minuscule will give you a good idea on how to shift between the different g-forms back and forth in history. The more you&#39;ll get, anyway, the most complete the picture will be. Gill&#39;s example may be misdirecting, since the samples are all redrawn by himself. &#40;Hi, Nathan, anyway! Hope you&#39;re OK! <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> &#41;</font></font></font>
