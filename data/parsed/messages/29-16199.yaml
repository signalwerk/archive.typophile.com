post:
  id: 29952
  user: 2305
  date: 2003-09-15T11:13:00
  date_raw: Monday, September 15, 2003 - 11:13 am
  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;m not precisely a historian of type, and so this question has been irking me lately... Where did the binocular g come from?  It looks to me like it evolved from a cursive letterform, but it&#39;s not accompanied by other cursivised forms, in most cases &#40;such as the 3-like z and delta-curved d&#41;.  &#40;Which is unfortunate, because I&#39;d love to see a face influenced by those forms.&#41;</font></font></font></font></font></font></font>
