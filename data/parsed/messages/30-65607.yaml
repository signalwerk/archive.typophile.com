    html: <font class="dontLookLikeCrap">&#62;Based on type specimen books prior to and concurrent with the turn of the century, it could be assumed that there was some indirect French influence.  <BR> <BR>Found something vaguely interesting at the Newberry Library the other week. I was looking through Alex Wilson &amp; Sons specimen from &#40;I think&#41; 1828, and noticed that there was a stack of small, loose printed sheets in the back. One seems to be printed with type from Pierre Didot -- or at least font with his oddly formed &#39;g&#39;.  <BR> <BR>Anyhow, in my ignorance, it was something I wouldn&#39;t have expected to see in a specimen from Scotland.</font>
