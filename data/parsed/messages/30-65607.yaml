  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">When I first became acquainted with type, &#34;Bodoni&#34; was considered to be the archetypal &#34;modern&#34; typeface. Later, I discovered that &#34;Didot&#34; might be a purer form of the genre. <BR> <BR>However, more recently I have taken an interest in the typical Modern face of the 19th century, which is quite different. This is the genre that appears to begin with the work of Miller and &#34;Scotch Roman&#34; in the early 19th century, and has later exemplars in the form of De Vinne, Modern 20, any number of &#34;Numbered&#34; moderns from the early 20th Century, and of course Monotype&#39;s Modern, and much later Torino. <BR> <BR>To me, this is a quite distinct genre, and very different from the neo-classical Moderns of Didot, Bodoni, and Walbaum. It is characterized by huge serifs &#40;pot-hooks in the italic lower case that are almost cursive in effect&#41;, tiny aperture, and extreme stroke contrast. <BR> <BR>I have seen this kind of lettering on gravestones in England from back in the 18th century, so I assume that, as usual, the typefounders were playing catch-up. However, it seems to me from looking at specimens from Figgins, and Caslon from the 1830s, that the genre was precisely defined in type by then.  <BR> <BR>Can the definition of the style be attributed to any one designer, perhaps Richard Austin?</font></font></font></font>
