    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Nick <BR> <BR>I think probably so but perhaps not definitively. Based on type specimen books prior to and concurrent with the turn of the century, it could be assumed that there was some indirect French influence. <BR> <BR>The problem with genre I think has to do with our perspective. I suspect contemporary type histories are problematic because 1&#41; of the notion that there was a form of cognizant continuum prior to the revival period and 2&#41; the revival period provided a false continuum. <BR> <BR>Early punchcutters and type foundries were not students of the history of type development &#40;Moxon, for instance, had no clue, two hundred years following the development of movable type, of its evolution over the years&#41;. They were mainly concerned with the more immediate descendant as passed down in the trade. As type centers moved from slowly from one geographic area to another certain changes occurred, in some cases because of technical developments, but mainly because of regional traditions. <BR> <BR>With the stabilization of photographic equipment and film technology in the late nineteenth century &#40;Kodak: you push the button and we do the rest&#41; the past was opened up for the revival period. In looking at a historical Didot or a Bodoni and any of the moderns of the nineteenth century, certain characteristics would have been detected in the form, and a continuum would have been assumned where one may not indeed have existed. <BR> <BR>The photographic search for materials &#40;hidden away in collections&#41; relating to the renaissance began in the mid-nineteenth century &#40;the Strausberg Documents regarding legalities surrounding Gutenbery were reproduced via the newly available photo collotype process&#41;. Emery Walker&#39;s photographic investigations of mideval and renaissance letterforms certainly influenced William Morris who as well used the camera for obtaining specimens from the past for his revival designs. <BR> <BR>And Pandora&#39;s box was opened.</font></font></font>'
