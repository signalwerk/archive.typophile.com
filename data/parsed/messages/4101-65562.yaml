    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">There is also Mshtagan for Mac OS X. But those are TrueType fonts. If I export TT it works fine. I want Type1 fonts. OTF is also acceptable but T1 is preferable.</font></font></font>
  - id: 94109
