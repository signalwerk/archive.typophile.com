    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Yeah, did some testing here and got to the same result. <BR>In InDesign everything went fine, but Word and TextEdit <BR>kept on switching to Arial Unicode everytime I changed <BR>the keyboard layout and started typing Armenian. <BR> <BR>I even ran the font through Adobe&#39;s OTF File Typer as <BR>suggested by Filip Blazek, but it didn&#39;t help. <BR> <BR>Btw, I&#39;m running MacOSX v10.3.8, InDesign CS and  <BR>MS Word 2004 for Mac v11.1.</font></font>
