post:
  id: 93640
  user: levonk-users
  date: 2005-02-18T13:24:00
  date_raw: Friday, February 18, 2005 - 1:24 pm
  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi, <BR> <BR>I am having problems with some Armenian fonts that I did. <BR> <BR>I am using FontLab 4.6 on OS X. <BR> <BR>I would like to create Type 1 fonts, but it seems that T1 does not support unicode. So I tried OpenType, but the OS does not recognize the font as Armenian. It works fine in InDesign, but MS Word, TextEdit simply revert to the default Armenian font. <BR> <BR>I created TrueType fonts and it worked, but I do not want TT, I prefer T1 but OT is also acceptable. <BR> <BR>Is there any way to make OS X accept the T1 font as Armenian. <BR> <BR>PS. I also want to convert the font to be used on a PC.</font></font></font></font></font></font></font></font></font></font></font></font>
comments:
  - id: 93651
    user: 1049
    date: 2005-02-18T13:58:00
    date_raw: Friday, February 18, 2005 - 1:58 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The easy, although maybe not entirely legal, way to do this would be to load a working Armenian OpenType CFF font into FontLab and compare the character mappings, and codepage/Unicode bits with your font.  <BR> <BR>Does seem strange that saving the font as TTF works but .OTF doesn&#39;t - problem may be with the OS rather than the font. <BR> <BR>Si</font></font></font></font></font></font></font></font></font></font></font>
  - id: 93663
    user: 5890
    date: 2005-02-18T15:24:00
    date_raw: Friday, February 18, 2005 - 3:24 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I don&#39;t think Levon can find any working Armenian font as such. OS X doesn&#39;t support OpenType. Therefore .OTF fonts do not show in the font list of applications that use OS X text engine &#40;like TextEdit&#41; but they do show in font list of OT savvy applications like InDesign, running on OS X. I&#39;m not sure what&#39;s up with MS Word. It might also be the case that the Mac version of MS Word doesn&#39;t support OT either. <BR>.TTF fonts always show in OS X font list. But if they are enhanced with OT features, those features don&#39;t work with OS X text engine like in TextEdit. <BR>If the features of a font are not supported in an application, it&#39;s a good idea not to have it listed in the font list.</font></font></font></font></font></font></font></font></font></font>
  - id: 93669
    user: 1049
    date: 2005-02-18T15:57:00
    date_raw: Friday, February 18, 2005 - 3:57 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Armenian doens&#39;t require any OpenType features so the difference between the TTF that works and the OTF that doesn&#39;t should just be the form of the outlines - CFF instead of TrueType outlines. If the fonts are otherwise identical &#42;and&#42; work in InDesign I&#39;d blame the OS.</font></font></font></font></font></font></font></font></font>
  - id: 93670
    user: 5890
    date: 2005-02-18T16:41:00
    date_raw: Friday, February 18, 2005 - 4:41 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I was just advised that there are two sets of OTF fonts in system font folder of OS X. One, AquaKana is not listed in font list for TextEdit. The other one, Hiragino is listed and as far as English keyboard&#39;s concerned, it works just fine. &#40;but of course there is no OT feature in it&#41; <BR>So you are right it&#39;s an OS thing. OS X do recognize OTF fonts though, but not all of them. The question remains what should be put into the construction of the font to make this possible. Is it a bug related situation or &#39;standard&#39; related situation. <BR>I&#39;m not at that level, but Levon may be able to study the construction &#40;information&#41; iside these two fonts and draw the conclusion. <BR>A hint: FontLab can not open fonts with Japanese name. You have to change the name of the copy of the font to something Roman.</font></font></font></font></font></font></font></font>'
  - id: 93694
    user: levonk-users
    date: 2005-02-19T00:24:00
    date_raw: Saturday, February 19, 2005 - 12:24 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The font does not have any OT features. Actually it is only the basic Armenian character set &#40;38 characters &#42;2 &#43; numbers &#43; punctuation&#41;. The OT font appears in TextEdit and other programs, but when the &#34;Armenian-Western QWERTY&#34; keyboard layout is selected it makes no difference what font you select, it uses the system default Armenian font. I can understand that if the font has no Armenian in it. The problem is the same with the T1 font. <BR> <BR>When that same font, with no changes, is exported as TrueType, everything seems to work, although in the begining I had some difficulty. <BR> <BR>It does seem to be an OS issue. I was told that OS 10.3.5 &#40;which I am using&#41; has some problems. Maybe if I update the problem will be solved.</font></font></font></font></font></font></font>
  - id: 93699
    user: 5890
    date: 2005-02-19T06:06:00
    date_raw: Saturday, February 19, 2005 - 6:06 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;m running 10.3.8 and when I installed an Adobe Pro otf font, it didn&#39;t listed in TextEdit. This is an OS problem and may be due to overkill sophistication in font ID recognition... or simply a bug. <BR>But try this: set the character set of your otf version to Western for MS and Roman for Mac Fond ID. See if your keyboard function properly with a make believe Roman font. I once did this with a PersoArabic font and it did the trick. Not an elegant solution but nontheless a solution.</font></font></font></font></font></font>'
  - id: 94032
    user: 1344
    date: 2005-02-23T08:06:00
    date_raw: Wednesday, February 23, 2005 - 8:06 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Maybe it is not your case, but there is a bug with OTF files on OS X. The system cannot properly recognize OTF fonts until they have assigned type/creator properties &#40;for example in FileBuddy application <a href="http://www.skytag.com/filebuddy/" target="_blank">http://www.skytag.com/filebuddy/</a>&#41;. OT fonts generated on OS X usualy works fine, but fonts copied from PC or downloaded from websites usualy must be corrected. I&#39;ve found more info at <a href="http://www.underware.nl/site2/index.php3?id1=support&amp;id2=opentypequestions" target="_blank">http://www.underware.nl/site2/index.php3?id1=support&amp;id2=opentypequestions</a>. Those OT fonts work, but the OT features are not accessible from Adobe CS application and sometimes the font does not even appear in the font list at all.</font></font></font></font></font>
  - id: 94055
    user: 1844
    date: 2005-02-23T09:52:00
    date_raw: Wednesday, February 23, 2005 - 9:52 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">For a good working Armenian font to be used as a benchmark,  <BR>try John Hudson&#39;s <b>Sylfaen</b>. <BR>It comes with Windows 2000 and XP.</font></font></font></font>
