  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><A HREF="http://www.typesociety.org" TARGET="_top">http://www.typesociety.org</A> <BR> <BR><B>Mission</B> <BR> <BR>The Society of Typographic Aficionados &#40;SoTA&#41; is an International Organization dedicated to the promotion, study, and support of type, its history and development, its use in the world of print and digital imagery, its designers, and its admirers. <BR> <BR><B>Charter</B> <BR> <BR>The Society of Typographic Aficionados &#40;SoTA&#41; exists for the affordable education of its members and participants, to further the development of type, typographical information and typography, to appreciate on multiple levels the attributes of type, typography, design, the book arts &amp; calligraphy. Furthermore, SoTA is comitted to sponsoring relevant topics in pursuit of these goals. SoTA pursues these goals through an annual conference &#40;<A HREF="http://www.typecon2001.com" TARGET="_top">TypeCon</A>&#41;, held in the United States once each summer.</font></font></font></font>
