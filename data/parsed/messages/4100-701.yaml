  - id: 2010
    user: 1250
    date: 2002-01-30T14:02:00
    date_raw: Wednesday, January 30, 2002 - 2:02 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> This reminds me how increasingly designers are providing different types of numerals for a given font &#40;Enschede for example provides 4 or 5 kinds!&#41;, which in turn makes me realize that the same should be done with the UC set - and I&#39;d say that it&#39;s even more important there. You&#39;d need a set for optimal readability &#40;incuding a special set for German&#41;, a set for optimal scannability &#40;where proper names are central&#41;, another set for acronyms, one for smallcaps, etc. But for some reason numerals get the lion&#39;s share of this &#34;alternate&#34; attention. <BR> <BR>hhp </font></font></font></font></font>
