    date_raw: Thursday, March 28, 2002 - 8:41 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Just to be boring, &#34;Hybrid&#34; figures are nothing new - I did a family with hybrid figures about ten years ago, and I&#39;m sure I wasn&#39;t the first. </font></font></font></font></font>
  - id: 2875
