  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">A friend pointed out some cool figures on the  <BR>menu at Buzz 9 &#40;in San Francisco&#41; recently.  <BR> <BR><IMG SRC="http://www.typophile.com/forums/messages/4100/702.gif" ALT="Solex Courtesy Emigre Typetease"> <BR>Solex, Courtesy of Emigre&#39;s Typetease <BR> <BR>They are neither lining nor fully old style. The  <BR>result is something that isn&#39;t so plain as lining  <BR>figures without the jumpiness of the old style. <BR> <BR>Once again, Zuzana innovates with a knowing  <BR>nod to the past. <BR> <BR>// joe</font></font></font></font></font>
