    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#34;Hybrid&#34; is cool... until the next hybrid comes along! :-/ <BR>Maybe at that point we can call them &#34;Carter&#34; numerals!  :-&#41; <BR> <BR>BTW: <BR><A HREF="http://www.emigre.com/Typetease/" TARGET="_top">http://www.emigre.com/Typetease/</A> <BR> <BR>hhp</font></font></font></font></font>'
  - id: 1996
    user: 1203
    date: 2002-01-29T23:10:00
    date_raw: Tuesday, January 29, 2002 - 11:10 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> In case it wasn&#39;t clear from previous posts, as far as I know, Georgia is derived from Miller. So that would explain the figures.  <BR> <BR>Also, didn&#39;t Richard Austin basically invent this approach to figures &#40;and then it might not be such a coincidence that Miller has them since Austin was an originator of the Scotch Romans and Miller is a sort of Scotch Roman&#41;? </font></font></font></font></font>
  - id: 1999
    user: 1250
    date: 2002-01-30T07:54:00
    date_raw: Wednesday, January 30, 2002 - 7:54 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> I was never sure about any hierarchy between Miller and Georgia - all I knew was that they were  designed in the same year &#40;right?&#41;, which might make one think that the influence went both ways &#40;especially considering how long a good type design takes&#41;. On the other hand, since Georgia can be considered a &#34;lower-grade&#34; font &#40;in its outlines if not its on-screen rendering&#41;, maybe it&#39;s safer to see Miller as the father. Is there any documentation about this? <BR> <BR>Austin: <BR>As I mentioned, I thought/suspected that somebody had done hybrid numerals before Carter. But would Austin -as a punchcutter- take such innovative liberties? Maybe he just cut numerals somebody else designed &#40;who&#41;? Also, wasn&#39;t Austin -among other things- Bell&#39;s punchcutter? Bell innovated the 3/4-height numerals &#40;which I adore, and which are actually an &#91;indirect&#93; feature in Fenway too - more later&#41;; did he also innovate the hybrids? <BR> <BR>hhp </font></font></font></font></font>'
  - id: 2000
    user: 1160
    date: 2002-01-30T11:06:00
    date_raw: Wednesday, January 30, 2002 - 11:06 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Adobe&#39;s Bell Gothic <BR> <BR><IMG SRC="http://www.typophile.com/forums/messages/4100/726.gif" ALT="Adobe Bell Gothic"></font></font></font></font></font>
  - id: 2003
    user: 1250
    date: 2002-01-30T11:45:00
    date_raw: Wednesday, January 30, 2002 - 11:45 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> So I went to check out those hybrid numerals in Sports Illustrated, and they were even nicer than I expected. For those wondering: they&#39;re basically 3/4 height numerals of wide set, but with a very modest oldstyle up&amp;down: the effect is one of friendly sophistication - and it&#39;s more readable &#40;and to a lesser extent more legibile too&#41; than any lining scheme. So I think I&#39;m going hybrid next time! <BR> <BR>BTW, another interesting thing was the smallcaps. I&#39;m calling them midcaps: they&#39;re taller and not so wide, and seem to have been designed to set acronyms in running text, as opposed to mixing with &#34;normal&#34; caps. And to be honest, very few people use smallcaps - acronyms are so much more common, so maybe we should be making midcaps instead &#40;or at least first/primarily&#41;? <BR> <BR>In toto, in the context of American sports, both the numerals and the midcaps seem to be very intelligent solutions. <BR> <BR>I also found the font as a whole to be very nice, even though I really don&#39;t like Moderns; it sort of reminded me of Olympian, the way Carter took a dated model and deftly made it much better &#40;like the lc &#34;k&#34;, in both Fenway and Olympian&#41;. <BR> <BR>BTW, speaking of numerals, Jonathan, if I may ask: <BR>What do you think of using other distributions of the up&amp;down? For example, what about making the &#34;3&#34; and &#34;5&#34; ascend instead of descend? Some old French foundries &#40;like D&amp;P&#41; used to do this, and I like it better myself - but virtually everybody does the oldstyle figures the same way. Is there a reason besides conformity? <BR> <BR>hhp </font></font></font></font></font>'
  - id: 2004
    user: 1250
    date: 2002-01-30T11:50:00
    date_raw: Wednesday, January 30, 2002 - 11:50 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Joe, that&#39;s interesting! <BR>Here&#39;s my explanation: The light weight is intended for text, that&#39;s why the numerals are shorter &#40;less obtrusive&#41;. But the darker weights are intended for display &#40;although I myself wonder about the middle one&#41;, so the numerals align with the caps. I wonder what the caps-ascender relationship is. <BR> <BR>hhp </font></font></font></font></font>'
  - id: 2005
    user: 1250
    date: 2002-01-30T11:58:00
    date_raw: Wednesday, January 30, 2002 - 11:58 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> I forgot something about Fenway: <BR>Because of their nature, the numerals often look like their &#42;spanning&#42; the lowercase, as opposed to sitting on the baseline or hanging from the x-line. For example in something like &#34;Porsche 955&#34;. What&#39;s most fascinating is that Carter has previously expressed interest in the Ancient Greek method of putting glyphs on a centerline, as opposed to making them fit between multiple lines - and &#34;Skia&#34; comes to mind as one &#91;partial&#93; implementation of this. I like it. <BR> <BR>hhp </font></font></font></font></font>'
