    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> The Hoefler face in question isn&#39;t for retail... I can&#39;t remember the name. Try to find an _Esquire_ and see if they&#39;re still using it.. I don&#39;t know. What&#39;s the L.A. free weekly? L.A. Weekly right? I bet it uses it for the body copy. Take a look. I haven&#39;t compared either to the DTL face but if I had to guess, the DTL was a more specific translation of Fleischmann, whereas these two are looser &#40;esp. since the one in the newspapers is a newsface and has really short descenders if I remember right&#41;. </font></font></font></font></font>
  - id: 2043
    user: 1250
    date: 2002-02-01T18:36:00
    date_raw: Friday, February 01, 2002 - 6:36 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Thanks much - I&#39;ll check those out. <BR> <BR>BTW, you&#39;re using the term &#34;newsface&#34;, but &#40;except for LA Weekly&#39;s paper stock&#41; all three cases are really magazines - which makes me ask the question: are the requirements for a magazine typeface roughly in between those for a newspaper face and a book face? <BR> <BR>hhp </font></font></font></font></font>'
  - id: 2052
    user: 1250
    date: 2002-02-02T19:42:00
    date_raw: Saturday, February 02, 2002 - 7:42 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> &#62; The Delegates&#39; report for 2000 <BR> <BR>OK, I took a closer look at Fenway thanks to that, and I was wrong, of course - it&#39;s not a Modern. Maybe the ball terminals threw me off; or the italics. So is it correct to call it a &#34;Dutch Old-Style&#34;? There&#39;s a certain non-Dutch air to it, but maybe I&#39;m comparing it to 20th century Dutch work, as opposed to stuff from Fleischmann&#39;s era. <BR> <BR>hhp </font></font></font></font></font>
  - id: 2105
    user: j-hoefler-users
    date: 2002-02-07T08:37:00
    date_raw: Thursday, February 07, 2002 - 8:37 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> &#34;Dutch&#34; is a tough category. I think it was probably an easier moniker before the Second World War, when there were few enough typefaces that everything from Van Dijck to Times New Roman could be called &#34;Dutch,&#34; but I think Hrant makes a good point: to call a face &#34;Dutch&#34; might mean that it&#39;s inspired by Van den Keere, Kis, Fleischman, Rosart, or Gerrit Noordzij. There&#39;s an ineffable sympathy between these styles, but it&#39;s still quite a range to choose from. Christian Schwartz recently showed me a Fleischman revival he&#39;s working on, leading us to speculate that &#34;Fleischmans&#34; will be its own category in the FontShop book, circa 2010. <BR> <BR>The font that Tobias and I did is called Mercury. The display face, which I designed, is used in Esquire; the text version, which Tobias designed, is used throughout the New Times newspaper chain, among other places. &#40;There&#39;s also an adaptation of it used in Esquire, for their text.&#41; It&#39;s very much a news face: some of its styles look lovely printed intaglio on coated stock, but it&#39;s really designed to work under less accomodating circumstances, such as New Times&#39; web presses and highly absorbent stock. &#40;&#34;Half a sheet will prove it.&#34;&#41; There&#39;s nothing online about Mercury right now, but I&#39;ll keep you posted. It&#39;s one of my favorite projects, largely because it was the first thing that Tobias and I both got into together, arms deep. <BR> <BR>Matthew&#39;s &#39;large small caps&#39; for Fenway were I think necessitated by the number of acronyms that appear in Sports Illustrated, many of which appear regularly in plurals where the final lowercase &#39;s&#39; would otherwise be indistinguishable from a small cap &#39;s&#39; of the same height &#40;i.e. &#34;1999 MVPs&#34;&#41;. I wondered whether Zuzana had the same thing in mind when she designed Mrs Eaves&#39; two sets of small caps. <BR> <BR>As for Hrant&#39;s question about alternate configurations of old style figures, there&#39;s an anecdote about the French preference for raising the 3 and 5, which has something to do with a system to foil counterfeiters, but I can&#39;t seem to figure out the details. &#40;This always sounded to me like a folk tale, though it&#39;s widely circulated -- perhaps Jean-Fran&ccedil;ois Porchez can fill us in?&#41; Anyway, I personally find anything but the standard arrangement of 012/34579/68 to be distracting, but that&#39;s just me. I read best what I read most, to paraphrase Zuzana. </font></font></font></font></font>'
