    date_raw: Thursday, March 28, 2002 - 9:00 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;ve done some informal research, and -assuming we&#39;re talking about the same thing&#42;- the oldest ones I found were in Intertype Garamond &#40;I think from the beginning of the 20th century&#41;. And besides Carter the only other designer I&#39;ve found using them is Alan Greene: <BR> <BR><A HREF="http://www.fontfont.de/packages/atmas11264.1/atmas11264.1.html" TARGET="_top">http://www.fontfont.de/packages/atmas11264.1/atmas11264.1.html</A> <BR> <BR>&#42; Old-style figures with large bodies and small extenders. <BR> <BR>In any case, I&#39;d love to see your work too, or pointers to other &#34;hybrid&#34; designs. <BR> <BR>hhp</font></font></font></font></font>'
  - id: 2921
    user: anonagain
    date: 2002-04-01T09:16:00
    date_raw: Monday, April 01, 2002 - 9:16 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Hrant: <BR>&#62;Furthermore, any references to 2002, <BR>&#62;2001 and 2000 are &#42;entirely&#42; x-height.  <BR>&#62;Down with blandness! <BR> <BR>Are you suggesting random ascenders and descenders where words currently have none too!? <BR> <BR>Quick quiz: longest word with no ascenders or descenders &#40;no &#34;i&#34;s or &#34;t&#34;s!&#41;. <BR> <BR>I got &#34;assume&#34; so far. </font></font></font></font></font>'
  - id: 2929
    user: 1250
    date: 2002-04-01T10:13:00
    date_raw: Monday, April 01, 2002 - 10:13 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> &#62; Are you suggesting random ascenders and descenders where words currently have none too!? <BR> <BR>Not random, but you&#39;ve touched on something huge: the Latin alphabet needs more extenders &#40;because it helps bouma divergence, hence recognition, hence reading&#41;. It&#39;s a major project to figure out how to carry out such changes &#40;it&#39;s essentially a more ambitious flavor of my Alphabet Reform work&#41;, but some letters are better candidates than others, and I can for example cite the &#34;e&#34; as definitely needing a descender. <BR> <BR>And you want more blasphemy?  :-&#41; <BR>Here ya go: We should abandon the baseline. <BR> <BR>&#62; longest word with no ascenders <BR> <BR>That&#39;s a great little question! <BR>Just to check: when you say no &#34;i&#34; or &#34;t&#34;, you mean that those count as extending, right? That&#39;s probably fair, although some fonts have very shy &#34;t&#34;s. If you decide to allow the &#34;t&#34;, then &#34;tobacco&#34; is a favorite of mine, not only because it doesn&#39;t have extenders, but because set in something like Futura or AG, it clearly shows the functional weaknesses of such typefaces. <BR> <BR>hhp </font></font></font></font></font>'
