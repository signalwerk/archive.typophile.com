    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Pardon the &#91;on-going&#93; digression, but speaking of Miller: <BR><A HREF="http://www.typophile.com/forums/messages/30/703.html?1011900345" TARGET="_top">http://www.typophile.com/forums/messages/30/703.html?1011900345</A> <BR> <BR>hhp</font></font></font></font></font>'
  - id: 1991
    user: j-hoefler-users
    date: 2002-01-29T14:44:00
    date_raw: Tuesday, January 29, 2002 - 2:44 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Matthew&#39;s used that technique a couple of times, always to good effect. He designed these kinds of figures into the great text face he made for Sports Illustrated, which I believe is called Fenway; check it out. <BR> <BR>Tobias and I finally decided to go straight to the horse&#39;s mouth and ask him if there&#39;s a name for these not-quite-old-style-not-quite-lining figures. &#34;Hybrid&#34; is the term he uses, and we both liked it. </font></font></font></font></font>
