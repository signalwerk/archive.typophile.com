    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> A quick reflection on numeral extenderness: <BR> <BR>Now that we&#39;re in the 21st century I think there&#39;s an extra reason to make the &#34;2&#34; ascending: under the conventional scheme the first three digits of a year will all be x-height until the year 2030. Furthermore, any references to 2002, 2001 and 2000 are &#42;entirely&#42; x-height. Down with blandness! <BR> <BR>hhp </font></font></font></font></font>'
  - id: 2873
    user: anonagain
