    date_raw: Thursday, January 24, 2002 - 10:22 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Correction/Elaboration: <BR>I guess it was about 4 years earlier, sorry: <BR><A HREF="http://www.microsoft.com/typography/fonts/fonttest.asp?FID=4&amp;FNAME=Georgia&amp;FVER=2.05" TARGET="_top">http://www.microsoft.com/typography/fonts/fonttest.asp?FID=4&amp;FNAME=Georgia&amp;FVER=2.05</A> <BR>Note that -possibly contrary to Carter&#39;s preferences- the MS guys decided to replace the hybrid figures with &#34;proper old-style figures&#34;, in 1998. Although I like the hybrid approach, I suspect that MS might have done some -possibly informal- focus group sessions where enough people complained that the figures &#34;seem somewhat misaligned or something&#34; that they decided to play it safe and make them &#42;really&#42; &#34;misaligned&#34; &#40;traditional old-style&#41;, so as to &#34;snap away&#34; from the bothersome &#34;somewhat misaligned&#34; stigma and go into the open waters of &#34;just not aligned&#34;... :-&#41;  This might be especially true in the low-res screen world, Georgia&#39;s primary target. As for Solex, considering it&#39;s essentially a display face, I&#39;d prefer lining figures, at least as the primary form &#40;although alternates -especially coupled to OpenType technology- are always welcome&#41;. <BR> <BR>hhp</font></font></font></font></font>'
