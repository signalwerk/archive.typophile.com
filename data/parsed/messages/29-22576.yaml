  - id: 44596
    user: 2172
    date: 2004-01-16T10:16:00
    date_raw: Friday, January 16, 2004 - 10:16 am
    votes: null
    html: <font class="dontLookLikeCrap">The problem with this site seems to spring from a problem with the company&#39;s image of itself. Identity Mine appears too scared to actually tell anyone what they do. Instead, they all their energy telling you why they&#39;re certified, great, and business savvy, with, as steve pointed out, dull, poorly set, and poorly written copy. It&#39;s also so laced with business-speak that it ends up communicating nothing but cognitive vacuity. On top of that, the &#39;identity&#39; stuff is based on some nebulous concept of technology and IT structuring determining identity. This connection is confusing. <BR> <BR>The &#39;Solutions&#39; page should be on the front, as it provides the most actual content, with the righthand navigation fromt the home page being the content, rather than existing as an oddly-placed series of faded stock-art. <BR> <BR>Don&#39;t even get me started on the useless random Flash animations that refer to nothing at all. Circling arrows?? <BR> <BR>Again, Steve is right. They need to know <i>why</i> they want/ need a website, not just that they want one. This is a problem that goes to the core of their marketing &#40;on this site&#41;. If you can step into a meeting with them and get all that across without making all of them hate you, my hat goes off to you. Design is the least of their problems, but hopefully it can help them organize their thoughts. Good luck, Michael.</font>
