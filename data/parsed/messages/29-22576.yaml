  - id: 44537
    user: 2876
    date: 2004-01-15T16:17:00
    date_raw: Thursday, January 15, 2004 - 4:17 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">When I visited the site, I didn&#39;t even see the identity consulting/mobility/products/User Experience options &#40;I&#39;m calling it frame 2&#41;, it was so far right.  And what&#39;s up with the inconsistent capitalisation?  The MS certified, DigitalIDWorld, VeriSign logos &#40;frame 1&#41; are all superfluous, and need to move somewhere less obtrusive.  The links on the header - Home, About IM, Solutions, Industry Experience, Careers, Contacts Us - need to stand out more: I looked over this page for three minutes before I even noticed them. <BR> <BR>I would probably start at the top with a header with less motion and more contrast - there&#39;s no reason for those squares and arrows to move except that the designer was pretentious.  Then below that, from left to right, I would have frame 2 and the main window.  Frame 1 would, at most, be incorporated into the footer.  For some reason, it was important enough to be on every page, so I guess subjugating them to their own page isn&#39;t an option, but they don&#39;t even link! <BR> <BR>That&#39;s my significantly more than two cents worth. <BR> <BR>Van</font></font></font></font>'
  - id: 44539
    user: 1717
    date: 2004-01-15T16:36:00
    date_raw: Thursday, January 15, 2004 - 4:36 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The text on the front page is long-winded, dull and poorly-written, both in terms of grammar and in terms of providing information. <BR>The &#40;lack of&#41; spacing around the hyphens in the quote at the bottom turns the words into nonsense. <BR>The links down the right all go to the solutions page - this is an unnecessarily confusing approach to site navigation. <BR>The logos on the left add little to the site - we&#39;ve seen them often enough to know that they are no indicators of quality. <BR>Most of their &#39;industry experience&#39; seemed to be IT admin stuff - what&#39;s it got to do with identity? <BR>The information architecture needs work.  <BR>They need to believe you when you tell them to: <BR>Start by deciding what the site is for. What info needs to be there, and for whom? Purge the text of all that management bollocks, organise the info, then design the site navigation structure according to the structure of the information. <BR></font></font></font>'
