  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I didn&#39;t design this site but I&#39;m redesigning it. I&#39;ve voiced a few of my concerns with the current design that they are using, but they don�t think that other people see or think what I do about the current site. If you could just give your review / critique of this site it would be greatly appreciated, and would help in my effort &#40;hopefully&#41; to educate and give insight to the problems / design flaws in the current design.  <BR> <BR>Site to Critique  <BR><a href="http://www.identitymine.com" target="_blank">http://www.identitymine.com</a>  <BR> <BR>Thanks  <BR>Michael</font></font></font></font></font></font></font></font></font></font></font>
