  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap">============================================================ <BR>Linotype Press Release - Type Directors Club honors  <BR>extraordinary Linotype designs <BR>============================================================ <BR> <BR>Linotype designers awarded for Elementis and Pirouette <BR> <BR>Bad Homburg, 28 February, 2005. The internationally renowned  <BR>Type Directors Club in New York has awarded the Linotype  <BR>fonts Elementis and Pirouette for Best Type Design in 2004.  <BR>Designed by Hans-J&uuml;rgen Ellenberger and Ryuichi Tateno  <BR>respectively, the Type Directors Club jury selected their  <BR>work out of 165 entries from 24 countries � a distinction  <BR>reserved to only 19 award-winners. These designers� fonts  <BR>are not only both original and fulfill the highest aesthetic  <BR>standards, they both also have surprising origins. <BR> <BR>Hans-J&uuml;rgen Ellenberger began his work on Elementis in 1975  <BR>with the goal of transforming the rounded forms of an  <BR>alphabet so all letters would have the same gray value.  <BR>However, as was typical of the times, his design work would  <BR>require a number of complicated and cumbersome development  <BR>steps and had to be postponed. He would not continue until  <BR>over 20 years later, when wide market penetration of desktop  <BR>publishing made it possible to digitize his designs for  <BR>further processing. In one sense, this prize might be  <BR>considered a tribute to the difficulties all type designers  <BR>faced in the pre-digital age. <BR> <BR>While Ellenberger was busy scanning his designs in 1999, the  <BR>Japanese designer Ryuichi Tateno was beginning to work on a  <BR>new shampoo packaging design and logo. The result not only  <BR>greatly pleased his client, it also inspired him to develop  <BR>a complete font family. Tateno was surprised at how quickly  <BR>the first designs flowed from his hand. Yet he sees the  <BR>source of his inspiration less in his own talent than in his  <BR>previous hard work. In fact, he had 10 years of typography  <BR>and calligraphy studies behind him before attempting his  <BR>first type designs. In his vision for Pirouette he also drew  <BR>inspiration from the calligraphic work of Prof. Hermann Zapf  <BR>and his Zapfino font family in particular. <BR> <BR>These Type Directors Club awards for Elementis and Pirouette  <BR>celebrate two highly original designers who have developed  <BR>extraordinary typefaces each in his own unique way. And it  <BR>is further proof of the quality and diversity of the Linotype  <BR>Library, in which excellent typefaces can be found for all  <BR>purposes.  <BR> <BR>For anyone curious to get an impression of Elementis and  <BR>Pirouette, simply drop by:  <BR>- <a href="http://www.linotype.com/6-23-6-17055/elementis.html" target="_blank">http://www.linotype.com/6-23-6-17055/elementis.html</a> <BR>- <a href="http://www.linotype.com/6-23-6-17051/pirouette.html" target="_blank">http://www.linotype.com/6-23-6-17051/pirouette.html</a> <BR> <BR> <BR>If you would like further information, please contact: <BR> <BR>Linotype Library GmbH <BR>Du-Pont-Stra�e 1 <BR>D-61352 Bad Homburg <BR>Tel.: &#43;49 &#40;0&#41; 61 72 - 484 - 24 60 <BR>Fax: &#43;49 &#40;0&#41; 61 72 - 484 � 5 24 60 <BR>E-Mail: <a href="mailto:info@linotype.com">info@linotype.com</a> <BR>Website: <a href="http://www.linotype.com" target="_blank">http://www.linotype.com</a> <BR> <BR>------------------------------------------------------------ <BR>Linotype Library GmbH, based in Bad Homburg, Germany and a  <BR>member of the Heidelberg Group, looks back onto a history of  <BR>119 years . Building on its strong heritage, Linotype  <BR>Library develops state-of-the-art font technology and offers  <BR>more than 6,000 original fonts, covering the whole  <BR>typographic spectrum from antique to modern, from east to  <BR>west, and from classical to experimental. All typefaces &#40;in  <BR>PostScript� and TrueType� format as well as more than 1,400  <BR>fonts in OpenType�&#41; are now also available for instant  <BR>download at <a href="http://www.linotype.com" target="_blank">www.linotype.com</a>. In addition to supplying  <BR>digital fonts, Linotype Library also offers comprehensive  <BR>and individual consultation and support services for font  <BR>applications in worldwide &#40;corporate&#41; communication. <BR>------------------------------------------------------------</font></font>'
