    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> So... the Ten Favourite Fonts list. <BR>As far as fonts go i have two categories: 1&#41; All time favorites 2&#41; Fonts that inspire but does not nesecarily meet up to the criteria in the first category, but nevertheless are important and interessting. This second category is less predictable and will perhaps give us a few not so well known fonts..and perhaps that will spark a discussion on what we individually strive to express in a typeface.  <BR> <BR>The all time favourite fonts will most certainly include fonts that we allready know...so I dont think it will produce to many surprises to us...So <BR>it would be nice if everyone added a font that they like &#40;not nessesarily for its perfection..but rather for inspiration&#41;.  <BR> <BR>&#40;I regret for posting as Anonymous the first time...<IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":&#41;"> <BR> <BR>Sbo </font></font></font></font></font>'
  - id: 1269
    user: 1042
    date: 2001-12-09T19:28:00
    date_raw: Sunday, December 09, 2001 - 7:28 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> I have only just stumbled upon this thread. Haven&#39;t got time to read all of it, but remembered that I&#39;ve had similar discussions before. I think a list is a great idea, especially if it is such a personal test. It&#39;ll make us all feel good. It will, however, not change the world of type-usage out there one bit.  I have my own theory about the success of certain faces and it would be nice to explore at some point how something as despicable as Avantgarde Gothic or something as sickly cute as Optima ever became so popular. But then, your present president took his post with less of a quarter of the adult population of this country having voted for him. One Steve Jobs with an old Linotype catalog in his garage had a bigger influence on the course of typedesign than all living typedesigners together. <BR> <BR>A few years ago, a journalist asked me what I thought were the ten most popular typefaces in use today. His question implied that those would also be the ten best typefaces of all time.  <BR> <BR>Here is an excerpt from my answer: <BR> <BR>1. What makes a good typeface is decided by the users, not the designer. <BR> <BR>2. Most good typefaces have been designed for one purpose, they do not come <BR>from a designer�s whim. <BR> <BR>Bodoni designed all his faces for specific books. <BR>Times was designed for the newspaper, <BR>Frutiger for signage at Charles de Gaulle airport, <BR>Helvetica to appeal to certain graphic designers, <BR>Bell Gothic for the American telephone books, <BR>Gill for a shopfront, <BR>Century for a magazine, <BR>Meta for the German post office. <BR>... <BR> <BR>3. there are certain laws of perception as well as cultural traditions which <BR>a typeface has to adhere to <BR> <BR>4. it has to look almost like all the others, but <BR> <BR>5. just be a little different <BR> <BR>When we talk about the ten most used typefaces, I am not sure which culture <BR>we are looking at. Holland? Sweden? Germany? The world? Roman type? Arabic? Chinese? <BR>Including the USA, or just Europe? Western Europe, Eastern Europe? <BR> <BR>I presume we mean the Western world, but we should all be aware that these <BR>presumptions are very arrogant and very unprecise. <BR> <BR>Let me try and compose a list, without any statistical relevance, but an educated guess. And &#34;in use&#34; can�t mean sold or bought, nor can it mean used in the highest print runs, like the bible or <BR>telephone books, nor even daily papers. I suppose we  mean the faces <BR>which have been most specified by designers, typesetters or printers. So <BR>whatever you write down, it won�t say much about our cultural preferneces, <BR>because we read best what we read most. And most people get their <BR>typographic influences not from books or design magazines, but from daily <BR>papers and official forms. <BR> <BR>Times New Roman, 1931 <BR>Futura, 1927 <BR>Helvetica, 1957 <BR>Univers, 1957 <BR>Garamond &#40;one of dozens of versions&#41;, ca 1532 <BR> <BR>Those 5 must be the top 5, even if not in that order. The rest will be very <BR>different in different countries, because that depends very much on the <BR>manufacturers in those countries. Before computers and floppy disks, <BR>typefaces were very difficult to ship, so printers bought what their local <BR>typefoundry had in stock. So my guess is this: <BR> <BR>Frutiger, 1976 <BR>Akzidenz Grotesk, 1898 <BR>Franklin Gothic, 1904 <BR>Century, 1900 <BR>Gill, 1928 <BR>Caslon, 1725 <BR>Baskerville, 1757 <BR>Bodoni, 1790 <BR> <BR>A face like Franklin Gothic has been very popular and widely used in <BR>advertising, but if you counted the print runs, it would be far behind the <BR>classic caslons or bodonis which have been used for books all over the <BR>world. <BR> <BR>And don�t forget Courier and Letter Gothic, the IBM faces from the 50s! </font></font></font></font></font>'
