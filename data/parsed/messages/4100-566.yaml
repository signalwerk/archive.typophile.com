    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> From what I gather, we are going to go with our personal favorites &#40;to play with on a deserted island, equipped with a G4 and a DSL line<IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":&#41;">&#41;, not necessarily the &#39;greatest&#39; faces or the faces in greatest use. Is that right? <BR> <BR>For fun, in addition to our favorites, maybe some typophiles want to include their thinking on the world&#39;s &#39;greatest&#39; faces, most used faces, or perhaps some other things � Top 10 non-Latin faces, Top 10 favorite glyphs, Top 10 Adobe faces, Top 10 things to do with a leg of type, Top 10 nicest quotes about typography... Hey, the weight of the world doesn&#39;t rest on your list. If you&#39;re not a regular poster, don&#39;t let that stop you. Let&#39;s have fun and be casual rather than formal! <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":&#41;"> <BR>Also, I&#39;m sure everyone would love to see comments about each face that is chosen, a link, and the designer&#39;s name. <BR> <BR>Noon, PST tomorrow. <BR> <BR>bj </font></font></font></font></font>
