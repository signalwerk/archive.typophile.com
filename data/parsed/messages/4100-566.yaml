    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> &#62; It&#39;ll make us all feel good. <BR> <BR>But what&#39;s better than that? <BR> <BR>&#62; your present president took his post with less of a quarter of the adult population of this country having voted for him <BR> <BR>:-&#62; <BR>And what a quarter it was... <BR> <BR>&#62; One Steve Jobs with an old Linotype catalog in his garage had a bigger influence on the course of typedesign than all living typedesigners together. <BR> <BR>Let&#39;s not forget the other Steve &#40;Wozniak&#41; - the guy who actually built the thing. <BR> <BR>&#62; 1. What makes a good typeface is decided by the users, not the designer. <BR> <BR>In terms of popularity, sure. But what about quality? For example, the &#34;users&#34; of movie theatres choose the stupidest stuff. <BR> <BR>BTW, I guess there&#39;s nothing interesting to do in San Francisco on a Sunday night since the .com implosion? &#40;I know there certainly isn&#39;t in Glendale, at &#42;any&#42; time of the week.&#41; I&#39;ve heard that all the sushi bars in SF are now Denny&#39;s.  ;-&#41; <BR> <BR>&#62; When we talk about the ten most used typefaces, I am not sure which culture we are looking at. <BR>&#62; .... <BR>&#62; I presume we mean the Western world, but we should all be aware that these presumptions are very arrogant and very unprecise.  <BR> <BR>Right on! <BR>Well, my list of 10 &#40;which I thought we were not supposed to reveal before the 15th...&#41; has one non-Latin font in it. The problem, of course, is how do you judge a font in a script you&#39;re not familiar with? So maybe when somebody presents a list he/she should state its scope. <BR> <BR>&#62; we read best what we read most. <BR> <BR>But we also read best what we read best, no? <BR> <BR>Anyway, I thought your list was very informative! Thanks. <BR> <BR>hhp </font></font></font></font></font>
  - id: 1322
    user: 617
    date: 2001-12-13T08:09:00
    date_raw: Thursday, December 13, 2001 - 8:09 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Wow! Erik Spiekermann! An immortal amongst us!  <BR>Erik is spot on here. There&#39;s no point in pretending to be objective. Just choose your favorites. Trouble is, I don&#39;t think anyone here would be particularly interested in my top ten as it would probably include such boring fonts as Cheltenham and Plantin - and where&#39;s the fun in that?! The 2001 idea is not bad - but not exactly easy to be sure of as release dates are never clear after a font is launched. Plus there are so many new fonts released in a year, and nobody keeps track of them all. Not unless someone wants to start IFDB.com, along the lines of the Internet Movie Database - imdb.com. </font></font></font></font></font>
  - id: 1323
    user: 1250
    date: 2001-12-13T08:30:00
    date_raw: Thursday, December 13, 2001 - 8:30 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> &#62; There&#39;s no point in pretending to be objective. <BR>&#62; Just choose your favorites. <BR> <BR>Totally. <BR> <BR>But dude, Plantin is a man among boys - it&#39;s the real thing &#40;as opposed to Times, the Prom King&#41;. I don&#39;t care if the lc &#34;a&#34; has a flawed pedigree - it more than makes up for it. <BR> <BR>On the other hand, I&#39;m one of those crazies who thinks that Cheltenham &#40;the real one, not the ITC caricature&#41; deserved its popularity: it has a distinct charm, and a unique readability. I think the fact that it was designed by a non-type-designer tends to mar the objectivity of some stodgy -or overly conservative, or overly pedantic- type designers &#40;like Tracy, as much as I admire him for other things&#41;. And maybe the same negative forces are at work in the denial of the true origin of Times - but that&#39;s another can of worms. <BR> <BR>BTW, I thought Cooper university &#40;no, it&#39;s not a school where you learn to make chocolate letters&#41; had something like an &#34;IFDB&#34;. <BR> <BR>hhp </font></font></font></font></font>'
