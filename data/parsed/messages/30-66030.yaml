    html: <font class="dontLookLikeCrap">Be consistent; use &#39;2004&#39; or &#39;04&#39;, but not both. List your freelance clients; if I was using this CV to judge you, I&#39;d be more interested in those than in the short placements. <BR>&#39;We designed adverts for printing&#39; doesn&#39;t really cut it to be honest...why else would you design them? <BR>Who says &#39;one 17 AD&#39; are &#39;reputable&#39;? - don&#39;t put subjectivity like this into a CV. <BR>Sorry if this seems a bit critical, but what you write in a CV &#40;I write as someone who has to read them for recruitment&#41; is more important than whether you&#39;re using DIN or not.</font>
