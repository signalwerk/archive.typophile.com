    html: <font class="dontLookLikeCrap">An image for Marilyn, which I cannot find at the moment, was a simple line drawing in black and red based on her mole, lips and eyes &#40;must have been based on this image or similar <a href="http://www.decodog.com/inven/mm/mm25579.jpg" target="_blank">http://www.decodog.com/inven/mm/mm25579.jpg</a>&#41;. Personally I think that Scarlett does not have the same look as Marilyn, less overt &#40;<a href="http://www.bbc.co.uk/films/2003/12/17/images/scarlett_johansson_top.jpg" target="_blank">http://www.bbc.co.uk/films/2003/12/17/images/scarlett_johansson_top.jpg</a>&#41;. Just because she is blonde, an actress and is the same gender, journos find it easy to pigeonhole her. So perhaps your answer to the question should be a resounding �No�. As for a typeface to represent Marilyn I would go for something like this <a href="http://www.myfonts.com/fonts/ef/stilla/?PREFS_SET%5BRenderSize%5D=36&amp;PREFS_SET%5BRenderString%5D=Marilyn+Scarlett" target="_blank">http://www.myfonts.com/fonts/ef/stilla/?PREFS_SET%5BRenderSize%5D=36&amp;PREFS_SET%5BRenderString%5D=Marilyn&#43;Scarlett</a> <BR>Tim</font>
