    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Tail is too heavy and flattens out too much on the thick &#40;right&#41; side. Concept is very interesting. <BR>Since you are having problems with it, I  would suggest you think of common words one may use an upper case Q for. In english most words starting with a &#34;Q&#34; follow with a &#34;u&#34;-example :Question, Queen, Quagmire, etc..and think of how this glyph would look in that context. </font></font></font></font></font></font></font></font></font></font></font>
