  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi. I&#39;m no font expert, but I have been trying to design an uppercase Q for a font that has no uppercase included, and would appreciate some criticism. The gifs below show my first three versions, any constructive criticism most welcome.. I think I&#39;m getting close with the last version, but the inner elipse is distorted. Thanks. Tom <BR> <BR><img src="http://www.typophile.com/forums/messages/29/39498.gif" alt=""> <BR><img src="http://www.typophile.com/forums/messages/29/39499.gif" alt=""> <BR><img src="http://www.typophile.com/forums/messages/29/39500.gif" alt=""> <BR><img src="http://www.typophile.com/forums/messages/29/39501.gif" alt=""></font></font></font></font></font></font></font></font></font></font></font></font>
