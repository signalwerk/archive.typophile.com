    html: "<font class=\"dontLookLikeCrap\"><font class=\"dontLookLikeCrap\"><font class=\"dontLookLikeCrap\"><font class=\"dontLookLikeCrap\"><font class=\"dontLookLikeCrap\"><font class=\"dontLookLikeCrap\"><font class=\"dontLookLikeCrap\"><font class=\"dontLookLikeCrap\"><font class=\"dontLookLikeCrap\"><font class=\"dontLookLikeCrap\">\x1c?x?\x1f?�?as i see the main element of the font  <BR>is a curve that ends to a tear. So, instead of  <BR>making three separate forms why don&#39;t you make  <BR>an open &#34;O&#34; which will extend its tale right  <BR>bottom ending to the tear? I think it will work. <BR> <BR>cheers, christos</font></font></font></font></font></font></font></font></font></font>"
