    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Luka,  <BR> <BR>Microsoft Font Validtor can be used to validate all tables except the CFF table. The tools CFFchecker and OTFproof that are part of the Adobe FDK for OpenType &#40;AFDKO&#41; can be used to validate the OT font, including the CFF table. Also, the Apple ftxvalidator can be used for additional validation.  <BR> <BR><a href="http://www.microsoft.com/typography/FontValidator.mspx" target="_blank">http://www.microsoft.com/typography/FontValidator.mspx</a> <BR><a href="http://partners.adobe.com/public/developer/opentype/afdko/topic.html" target="_blank">http://partners.adobe.com/public/developer/opentype/afdko/topic.html</a> <BR><a href="http://developer.apple.com/fonts/OSXTools.html" target="_blank">http://developer.apple.com/fonts/OSXTools.html</a> <BR> <BR>Regards,  <BR>Adam</font></font></font>
