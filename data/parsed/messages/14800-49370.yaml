    html: <font class="dontLookLikeCrap">My suggestion is to maybe change the name... heh.  Acronyms really don&#39;t make great brands.  Usually large companies end up becoming acronyms because what they do today is not what they did 30 or 50 or 80 or 100 years ago.  However, some companies just pick an acronym to start; I guess they think that makes them look huge, or they do it because their name is just too long and it wasn&#39;t a very good name to begin with.  Unfortunately, that just makes them hard to remember. <BR> <BR>What does TJB stand for?  Maybe just going with the name itself without the middle initial would be a better approach altogether.  You&#39;d have more to work with.</font>
