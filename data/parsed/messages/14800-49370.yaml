  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey All, <BR> <BR>I haven&#39;t been inclined to use this forum but got a project I thought would be a fun group effort. <BR> <BR>I am friends with a home builder who did a favor and I wanted to surprise him with a new logo design that I thought would be far better than what he&#39;s currenlty using. <BR> <BR>My critique of the logo is that he&#39;s sacrificing the &#39;elegance&#39; of the market he&#39;s going for, for the readbility of his initials which make really ugly monogram letters and ligatures. <BR> <BR>Anyhow, I haven&#39;t started anything more than sketches but would love to get more input on how to put these three letters together so they read &#39;TJB&#39; cleanly and elegantly. All my attempts make the T the center and the JB on either side which reads like JTB . . . <BR> <BR><img src="http://www.typophile.com/forums/messages/14800/49371.gif" alt="TJB Logo"> <BR> <BR>We&#39;ll see how this goes and for the record, this is actually a gift, I haven&#39;t been hired to do this even though this guy builds nice houses and can afford a REAL logo. I just feel he should have a better one . . . <BR> <BR>Thanks in advance all! <BR>Stuart :D</font></font></font></font>
