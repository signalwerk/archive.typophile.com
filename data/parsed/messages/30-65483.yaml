    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Font book is not a great software but I haven&#39;t used it much. I recommend Font Reserve. When you add a font to Font Reserve it gives you the option of leaving it where it is or copying it into this dumb thing called the Vault. It will not copy your font into the system folder. Font Reserve also has nice perks like a character map which is surprisingly missing from Font Book.  <BR> <BR>Organizing by foundry is interesting... I just do it alphabetically. Easier for me to find them.</font></font></font></font></font></font></font></font></font>
