    date: 2005-02-16T17:50:00
    date_raw: Wednesday, February 16, 2005 - 5:50 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Well, I kept Font Book, waiting for a better interface coming out from the depths of Apple&#39;s HI group. I used to be a Font reserve user, gave Suitcase a try too. But I found out that I have better things to do with my RAM and computing power than to spend it senselessly to managing my fonts, I only have couple of hundreds installed, so no big deal for font book as I found. <BR> <BR>I have to admit that this is totally up for personal taste.</font></font></font></font>
  - id: 93585
    user: 1043
    date: 2005-02-16T19:10:00
    date_raw: Wednesday, February 16, 2005 - 7:10 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I use FontBook, too. I&#39;ve used Suitcase, ATM Deluxe, and Font Reserve in the past, but I don&#39;t think they are as essential as they used to be. If I needed auto-activation I would consider one of the current third-party font managers, but I found that with OS X, they were more trouble than they were worth, at least for me. <BR> <BR>You can avoid most of your font headaches if you avoid Classic. Classic really throws a wrench in the works and things are much simpler, fontwise, without it. Dealing with Classic is one area where a third-party font organizer can be a big help. <BR> <BR>One other tip: I have my font collection pretty well organized &#40;in a completely separate directory&#41; and I like to keep it that way, so I set FontBook&#39;s preferences to <b>copy</b> fonts rather than <b>move</b> them when installing them. That way, my originals stay nicely organized. When I uninstall them from FontBook, it just moves the copy to the Trash, again leaving my original safely organized. This does use up disk space with duplicate copies of fonts, but font files are so tiny compared to today&#39;s hard drives, it&#39;s a very small price to pay for convenience.</font></font></font>'
  - id: 93592
    user: 103
