    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Ditto on Mark&#39;s move vs. copy experience, but I do it with <a href="http://www.insidersoftware.com/FA_pro_osx.php" target="_blank">FontAgent Pro</a> which I&#39;ve used for 2 years and found far more solid than FontBook, Font Reserve, or Suitcase.</font></font>
  - id: 93704
    user: 1947
    date: 2005-02-19T07:38:00
    date_raw: Saturday, February 19, 2005 - 7:38 am
    votes: null
    html: <font class="dontLookLikeCrap">I understand that I am probably the only person on the planet who uses MasterJuggler, but I find it the best thing to use if you are developing fonts and have multiple versions of a developing design. Since all MJ does is turn the font on or off &#40;no moving/copying/creating databases&#41; it is a very simple and elegant solution. That and it allows you to peruse various unicode codepages within the fonts. To me it is the most ATM DeLuxe-like of them all. And I have tried them all.</font>
