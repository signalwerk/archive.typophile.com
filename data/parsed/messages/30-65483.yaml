post:
  id: 93515
  user: switcher
  date: 2005-02-16T09:00:00
  date_raw: Wednesday, February 16, 2005 - 9:00 am
  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I hope I&#39;m posting this in the right area. Moderator, please move if this is incorrect. I was advised by a Mac forum to ask this question here so I&#39;m hoping you guys can help. I&#39;ve just switched from a PC to a Mac and was wondering if there is anything akin to shortcuts to fonts for the Mac. On my PC, I used to organize my font collection by foundry and then if I needed to install a font, I simply pointed windows to where it was located. The font wasn&#39;t copied to the system fonts folder and thus didn&#39;t result in a duplicate font somewhere I didn&#39;t know about. With OS X, I&#39;ve tried using font book &#40;but I&#39;m admittedly new at it&#41; and using collections but this still results in the font being copied from its original location &#40;my organized folders&#41; to a fonts folder under my username. Is there something akin to shortcuts to fonts on a Mac?</font></font></font></font></font></font></font></font></font></font>
comments:
  - id: 93516
    user: 3275
    date: 2005-02-16T09:05:00
    date_raw: Wednesday, February 16, 2005 - 9:05 am
