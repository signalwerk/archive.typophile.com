    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap">John Downer ought to know something about that. Consider: <a href="http://www.emigre.com/EF.php?fid=83" target="_blank">Brothers</a> <BR> <BR>After cruising around the link that hrant posted elsewhere, <a href="http://www.a4.se/eng/typsnitt/lft_sy.html" target="_blank">Thalia</a> might work depending on the headline, or if budget is an issue. <BR> <BR>And just for fun, and since you mentioned fire engine lettering, the following are two photos from the Window Lettering workshop at Typecon with John Downer and Leonard Otillio. Here Leonard has silkscreened down the black and a dull bevel varnish, and is laying down the gold leaf: <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/50079.jpg" alt=""> <BR> <BR>After that&#39;s dry, holes have been patched, and backing applied, the excess leaf is rubbed off. After the leaf went on I was skeptical of how nice it would come out because it was so wet and wrinkly. Not so. Nice don&#39;t begin to describe the result. Check that bevel varnish now. Sweet golden goodness. <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/50080.jpg" alt=""> <BR> <BR>He said he does this on firetrucks too, but most often what you see around is done cheaply with pre-made vinyl letters. Fun to learn more about this niche field. <BR> <BR>R</font></font>'
