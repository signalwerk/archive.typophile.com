  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><img src="http://www.typophile.com/forums/messages/4100/50048.jpg" alt="Antique Photo"> <BR> <BR>i kinda wanted to match type for a headline to the period feel to this photo from 1924 and i figgered it gives me an excuse to finally license some type from <a href="http://www.letterheadfonts.com/" target="_blank">Letterhead Fonts</a>. Problem is: i&#39;m not sure what to choose. <BR> <BR>I kinda like <a href="http://www.letterheadfonts.com/contributors/tomkennedy/firehouse.shtml" target="_blank">Fire House</a>, but i kinda want something not so flashy??? &#42;unsure&#42; Maybe Argentine would be nice or Boston Truckstyle? or maybe someone can suggest something outside of LHF. <BR> <BR>I&#39;ll probably use Copperplate Gothic for some accompanying text, so mixing well with that is another requirement. <BR> <BR>Anyhow, lemme know quick... I hafta have this done by Friday and preferably much sooner. Thnx for yer help!</font></font></font></font>'
