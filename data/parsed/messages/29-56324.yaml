    html: <font class="dontLookLikeCrap">Great points Sarah. Unfortunantly this work will properly never go any futher unless I decide to rework it solely for my portfolio. The publication it was intended for is no longer in business. The work was incomplete as I was still waiting for final text to be supplied from my editor at the time.</font>
