  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This is the illustration/typographic layout designed to accompany text for an article/review of the soon to be released  <BR>film Constantine.This article was for the March 2005 issue of  <BR>�������� &#40;I prefer not to mention name for legal reasons&#41;, anyway it is a film/science fiction magazine, <BR>The text is to be set in James Montalbano&#39;s Clearview but as you can see it is not yet placed. I vectorized the &#34;Constantine&#34; type from a jpg. the film studio sent me, for reasons unclear to me it was not available in vector, so I did it myself. I noticed in some of the studios press materials that they used Adam Roe&#39;s Percolator, so I decided to use a modified version of this on the layout.  <BR>Before my completion of this work the magazine was put on the shelf to to speak due to corporate reorganization. Still I think the work completed so far was worth sharing. As I am no longer getting paid on this project it will properly never be finished. <BR> <BR>Besides showing off my work the is another reason I decided to post this. I am wondering what similar experiences other designer have had with projects that get &#34;parked&#34; during the creative process. During this layout I was not expected to invest this much time on the publishers timeclock but thought perhaps this would be a sweet future portfolio  piece so I took it home and spent a few hours off the clock to get it to par with other works I wish to show in my portfolio. <img src="http://www.typophile.com/forums/messages/29/56325.jpg" alt="Constantine Movie "></font></font></font>
