  html: Garagefonts has just recharged the site with 100 cool new fonts! <BR> <BR>And for a limited time, you can get a super price on the entire GarageFonts collection. The GF library normally retails for $3,995. Now through May 31, 2001, over 650 GarageFonts can be yours for the low, low price of $995. Only 100 libraries will be made available at this special price - first come, first served. This offer is good only through May 31, 2001, or until the first 100 libraries are sold.This offer is good for telephone orders only. Call 1-800-681-9375 or 1-301-879-6955 and get your new fonts today!
