    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I understand your concern, Max, but there are a <a href="http://www.typophile.com/forums/messages/83/27299.html" target="_blank">bunch of fonts</a> <BR>that come close to your design, some of which I believe were  <BR>released before yours. Similarity just comes with the territory <BR>when working in the grid-based realm. <BR> <BR>I don&#39;t like cloners any more than you do, but from the experience  <BR>I&#39;ve had with James I can tell you he&#39;s an upstanding fellow who  <BR>respects designer&#39;s rights. Both of your designs have merit. <BR> <BR>Please forgive me if I overreacted and your post was nothing but  <BR>a good-natured nudge.</font></font></font>
