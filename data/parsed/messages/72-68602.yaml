  html: '<font class="dontLookLikeCrap">The deadline for paper submission for the ATypI Helsinki conference has <BR>been extended to April 14. Please find below and attached information <BR>about the conference and keynote speaker Aaron Marcus. <BR> <BR>&#43;&#43;&#43;&#43;&#43;&#43;&#43;&#43;&#43;&#43;&#43;&#43;&#43;&#43;&#43;&#43;&#43;&#43;&#43;&#43; <BR> <BR>Call for Papers and Presentation Proposals for the ATypI Helsinki 2005 <BR> <BR>Association Typographique Internationale &#40;ATypI&#41; Annual Conference 2005 <BR>Conference Theme: ON THE EDGE <BR>Helsinki, Finland, 15-18 September, 2005 In association with the <BR>University of Art and Design &#40;UIAH&#41;, Helsinki, and Lahti Polytechnic <BR>Institute of Design, Lahti <BR> <BR>West New York, New Jersey: January 23, 2005 � Announcing the opening of <BR>the Call for Papers and Presentation Proposals for the ATypI Helsinki 2005 <BR>conference. ON THE EDGE: This is type on the northern edge of Europe and <BR>the edge of the Baltic Sea; type of the Nordic and Baltic cultures and <BR>languages. This is type on the forward edge of technology: type on <BR>television screens; type embedded in telephones; type circling around the <BR>world. This is type on the edge of a global culture: type as a medium of <BR>change and also of preservation; type as a carrier of cultures. And this <BR>is type on the edge of design: type as form and content; type as an idea, <BR>and type as an activity. <BR> <BR>The Board of Directors of ATypI is proud to note that the ATypI <BR>Conferences are sponsored by many of the leading companies in the graphic <BR>arts and computer business. Early sponsorship for Helsinki comes from the <BR>Microsoft Corporation. <BR> <BR>Keynote: The keynote speaker for ON THE EDGE is Aaron Marcus is President <BR>of Aaron Marcus and Associates, Inc., a leading user-interface design and <BR>information-visualization firm. AM&#43;A&#39;s clients include BMW, <BR>DaimlerChrysler, Motorola, Nokia, Samsung, Siemens, the US Federal Reserve <BR>Bank, and Visa. Mr. Marcus is a graduate in physics from Princeton <BR>University and in graphic design from Yale University. The title of the <BR>keynote is �User Interfaces and Visible Languages: Culture, Signs, and <BR>Devices.� User interfaces present facts, concepts, and emotions to people <BR>around the world across all devices, content, and contexts. What are the <BR>visible language design issues? How does culture affect visible language <BR>display? Can there be a universal visible language? The lecture explores <BR>issues of the future based on Mr. Marcus� forty years of professional <BR>experience in combining graphic design and computer graphics. <BR> <BR>The ATypI 2005 programme planning committee invites submissions of <BR>abstracts for presentations on any theme related to type and typography <BR>&#39;on the edge&#39;; novel interpretations are welcome. Appropriate topics <BR>include, but are not limited to: typeface design, typographic media new <BR>and old, font technology, printing history, the use of type in graphic <BR>design, multilingual typography, and design education. Proposals are <BR>welcome for practical demonstrations as well as lectures and panel <BR>sessions. <BR> <BR>Abstracts should include the title of the proposed presentation, the <BR>presenters name&#40;s&#41; and a short biographical note &#40;approx. 50 words&#41;, and a <BR>short summary &#40;approx. 100 words&#41; suitable for publication in the <BR>conference programme.&#42; Forty minutes is the standard length for a lecture <BR>or demonstration, including questions. Proposals for panel discussions or <BR>workshops may by allocated more time. The deadline for submissions is 31 <BR>March 2005. <BR> <BR>It is expected that the speakers will provide the text of their <BR>presentations, and images if possible, for inclusion in a publication <BR>after this event. <BR> <BR>&#42;Biographies longer than 50 words and presentation descriptions longer <BR>than 100 words may be edited for length. The programme committee may also <BR>edit for clarity. <BR> <BR>Presentation proposals should be sent to the programme planning committee <BR>by e-mail to &#60;<a href="mailto:helsinkiprogram@atypi.org">helsinkiprogram@atypi.org</a>&#62; or by mail to <BR> <BR>ATypI 2005 Helsinki <BR>Association Typographique Internationale <BR>6050 Boulevard East, Suite 2H <BR>West New York, NJ 07093 USA <BR> <BR>Please note that all other correspondence should be addressed to the ATypI <BR>Secretariat and Conference Office &#40;see below&#41;. <BR> <BR>Helsinki Programme Committee <BR>Chair: Kai Rentola, University of Art and Design &#40;UIAH&#41;; Tomi Haaparanta, <BR>Suomi Type Foundry; Jarno Lukkarila, Format Design; Sami Kortem�ki, <BR>Underware; Jorma Hinkka, Graafiset Neli�t Oy; Pavel Zelenka, Studio <BR>Marvil; Maxim Zhukov, Typographer; Ritva Leinonen, Lahti Institute of <BR>Design; Markus Itkonen; Graphic Designer; Riitta Brusila, Professor, <BR>University of Lapland; Marjaana Virta, WSOY, Graphic Designer. <BR> <BR> <BR>About ATypI: Association Typographique Internationale is the only <BR>worldwide organisation dedicated to type and typography. Founded in 1957, <BR>ATypI provides the structure for communication, information and action <BR>within the international type community. ATypI annual conferences are <BR>attended by delegates from more than 40 countries. Recent Conferences have <BR>been held in Prague &#40;2004&#41;, Vancouver &#40;2003&#41;, Rome &#40;2002&#41; and Copenhagen <BR>&#40;2001&#41;. The ATypI Board of Directors: Jean-Fran�ois Porchez, President; <BR>John Hudson, Vice President; Mark Barratt, John D. Berry, Henrik Birkvig, <BR>Roger Black, Clive Bruton, Ted Harrison, Gerry Leonidas, Thomas Phinney, <BR>Fiona Ross, Erik Spiekermann, Adam Twardoch, Pavel Zelenka, and Maxim <BR>Zhukov. <BR> <BR>For more information, visit <a href="http://www.atypi.org" target="_blank">http://www.atypi.org</a> or contact the ATypI <BR>Secretariat &amp; Conference Office &#40;please note that due to administrative <BR>changes the mailing address will be different after April 1, 2005; please <BR>check the ATypI website for current contact information after that date&#41;: <BR> <BR><a href="mailto:secretariat@atypi.org">secretariat@atypi.org</a> <BR>Association Typographique Internationale <BR>Secretariat &amp; Conference Office <BR>6050 Boulevard East, #2H <BR>West New York, New Jersey, USA <BR>t. &#43;001 201-453-1775 <BR>f. &#43;001 201-861-3365</font>'
