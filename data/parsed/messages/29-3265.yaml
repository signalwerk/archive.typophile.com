    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> e: el rulo de la &#34;e&#34; deber&iacute;a resolverse de forma descendente, y no de la manera realizada. tal vez se pierda la &#34;gracia&#34; que has querido asignarle, pero no es correcta la forma actual de la letra &#34;e&#34;, no se unifica con las demas, del sistema. <BR>e: the roller of the &#34;e&#34; would have to be solved of descendent form, perhaps and of the made way the &#34;grace&#34; is not lost that you have wanted to assign to him, but is not correct the present form of the letter &#34;and&#34;, is not unified with others, of the system.  <BR> <BR>w: est&aacute; muy comprimida en su base. <BR>w: its very compressed in your base. <BR> <BR>L: &eacute;sta letra podria llevar en su base el mismo serif que se insin&uacute;a en la letra &#34;a&#34; .  <BR>L: this letter could take in its base same serif that is insinuated in letter &#34;a&#34;.  <BR> <BR>a: esta letra es una de las que mas identidad le otorga a &#34;latina&#34;, deber&iacute;as pensar como transladar estas cualidades formales a las dem&aacute;s. sobre todo deber&iacute;as prestarle atenci&oacute;n al bast&oacute;n horizontal de la misma. <BR>a: this letter is one of which but identity &#34;Latin&#34; grants to him, you would have to think as to transfer these formal qualities to the others mainly you would have to pay attention to him to the horizontal cane of the same one. <BR> <BR>saludos! ;&#41; sebas </font></font></font></font>'
