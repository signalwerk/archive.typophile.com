    date: 2002-12-13T01:30:00
    date_raw: Friday, December 13, 2002 - 1:30 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Ale - This is your finest and most mature work yet.  <BR> <BR>I&#39;m impressed that you&#39;ve managed to work decent-sized <BR>accents into a face with a pretty large x-height, although it  <BR>could be a problem at smaller sizes &#40;hard to tell on-screen  <BR>what 9 pt. would look like&#41;.  <BR> <BR>I also dig the alt characters, but I don&#39;t quite buy the &#39;e&#39;  <BR>for the roman yet. Needs more balance somehow.  <BR> <BR>The stroke contrast is nice. Overall, it&#39;s a clean sans with  <BR>the organic feel of the pen. Very lovely.  <BR> <BR>I like the italic best - let&#39;s see more of it. <BR> <BR>P.S. Very sneaky with the  <BR>propaganda-laced specimen  <BR>text. I&#39;m with you.</font></font></font></font>
