    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> Alejandro, you have really worked out a nice sans. The one blaring thing that you have to work out is that �e�. I think it�s an italic but you also include it as an alternate. You have to work on the stress on that glyph. It�s totally leaning to the right and throwing off the rhythm. I&#39;m only saying this because you owe it to yourself to work this out because the rest of your characters are really beautiful and deserve a more considered and dedicated �e� &#40;a fairly frequent letter&#41;. Good job and keep up the good work. PS. the alternate �g� seems to have a really angular bottom story. Maybe something to think about ? and the �w� seems a bit narrow on the bottom. &#40;?&#41; </font></font></font></font>
  - id: 9057
