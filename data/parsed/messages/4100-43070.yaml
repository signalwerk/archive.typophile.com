  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi, <BR> <BR>I&#39;m working on a sans serif face. I�m drawing it in  a vectorial program. When I print some samples at aproximatedly 10 point size &#40;in common paper&#41;, I see a lot of variation of thickness, but each time I print the same samples the results are different, what is confusing me.  <BR> <BR>When you work on typefaces, how do you do to test them in small sizes? The results of printing a font file in a small size vary from the results of printing a font from its vectorial drawing? Is it better to generate the font in Fontographer before testing it in small sizes? <BR> <BR>Thanks  <BR><a href="mailto:fermello78@uol.com.br">fermello78@uol.com.br</a></font></font></font></font></font></font>
