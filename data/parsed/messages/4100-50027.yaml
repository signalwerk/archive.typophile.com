  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hello, <BR>I&#39;m looking for advice on type for an artist&#39;s book. The book will be mostly photographs, printed in warm quadratone, one to a page &#40;in some cases one to a spread&#41;. There will type on title pages, acknowledgements, and on a one or two page essay. The type is set simply, fairly large &#40;13pt&#41; and the essay is set with very large margins. Page size is 15 x 13 inches. <BR> <BR>The photographs are dense and lush, but of stark subject matter, and formally could be seen as late modern. The overall time feel of the images is &#34;some time in the 20th or 21st centuries.&#34;  <BR> <BR>I&#39;ve expermimented with a couple of treatments, including sans serif &#40;which just seemed to plain in the context of the work&#41; and traditional serif faces like Garamond and Bembo, which seemed to &#34;retro&#34; and to overemphasize that aspect of the work. <BR> <BR>My current mockup uses Mrs. Eaves. I like the general look of it, but the letterspacing in the body copy is kind of wonky. Also, it seems kind of trendy right now ... I&#39;d prefer something with a similar feel but fresher. <BR> <BR>As a final note, I may end up having the text printed letterpress from plates made from digital files. Mrs. Eaves seems designed to give a &#34;letterpress look&#34; and I&#39;m not sure if it&#39;s a good idea to print a face that mimics letterpress on an actual letterpress. However, I may end up printing conventionally, so ideally I&#39;ll use a type that would work with either approach. <BR> <BR>Any thoughts on what I might look at? <BR>Some samples of the photographs are at <a href="http://www.paulraphaelson.com" target="_blank">www.paulraphaelson.com</a> <BR> <BR>Thank you very much for any help.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
