    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">FontFont&#39;s Seria, or Seria Sans, Storm&#39;s Sebastian and Lanston&#39;s Deepdene.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 77162
    user: 103
    date: 2004-09-29T14:17:00
    date_raw: Wednesday, September 29, 2004 - 2:17 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I like John&#39;s direction. In the same vein: <a href="http://fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=californian&amp;font_categories_checkbox=font_keyword_search&amp;x=34&amp;y=10" target="_blank">FB Calibornian</a>, which <BR>is akin to Deepdene and Berkeley but with the versatility of three <BR>optical weight classes.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 77164
    user: 103
    date: 2004-09-29T14:24:00
    date_raw: Wednesday, September 29, 2004 - 2:24 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I also have a feeling <a href="http://fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;displayfontid=FB.100198.0.0" target="_blank">Elmhurst</a> would do well on letterpress. <BR> <BR><a href="http://fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=atma&amp;font_categories_checkbox=font_keyword_search&amp;x=34&amp;y=10" target="_blank">FF Atma</a> is a nice alternative to Mrs. Eaves, with better spacing  <BR>and a ton of features. <BR> <BR>Here are links to <a href="http://fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;displayfontid=FF.11178.0.0" target="_blank">Seria</a>, <a href="http://fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;displayfontid=FF.11118.0.0" target="_blank">Scala</a> &#40;its cousin with a larger x-height&#41;,  <BR><a href="http://fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;displayfontid=FF.11179.0.0" target="_blank">Seria Sans</a>, and <a href="http://www.stormtype.com/sebastian.html" target="_blank">Sebastian</a>. <BR> <BR><font color="808080">I want those cookies.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 77165
    user: 1474
    date: 2004-09-29T14:29:00
    date_raw: Wednesday, September 29, 2004 - 2:29 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">When travelling in neighbouring states, I�ve noticed bumper stickers and the like with phrases such as �Don�t Californicate Oregon�. Is FB Calibornian an anagramic variation of a similar but much more obscure movement... �Don�t be Born in California�?  or from the fire season... �Don�t Burn in California�? <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> <BR> <BR>I know that making fun of a typo is a bit of a cheap shot... especially when I am so frequently guilty of much worse ones. In the spirit of fun only... <BR> <BR>cheers, <BR>Dana</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 77167
    user: 103
    date: 2004-09-29T14:39:00
    date_raw: Wednesday, September 29, 2004 - 2:39 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Funny, Dana. I was about to fix my misspell but now I&#39;ll leave it  <BR>in favor of maintaining thread continuity. ;&#41;</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 77340
    user: 4760
    date: 2004-09-30T16:06:00
    date_raw: Thursday, September 30, 2004 - 4:06 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks for all the advice, everyone. <BR>I&#39;ve been experimenting a lot, and nothing looks as good as Mrs. eaves for the title page and cover type. But it&#39;s not working for the body copy, partly because of the low x-height and partly because of the messed up letterspacing.  <BR> <BR>Of everything I&#39;ve looked at for the text, the two faces that look best are baskerville &#40;which I guess eaves is based on&#41; and cochin. <BR> <BR>Do you think it&#39;s strange to use two different serif text faces like this? They won&#39;t be on the same page as each other ... the mrs. eaves will only be at the front of the book, since there won&#39;t be display copy used with the text. <BR> <BR>One thing I find I like for this project is a capital W without a center serif &#40;as in the baskerville and the eaves, but not the cochin&#41;. I know this sounds nitpicky, but it stands out for me since the title starts with W.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 77346
    user: 1196
    date: 2004-09-30T17:15:00
    date_raw: Thursday, September 30, 2004 - 5:15 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">How about Vendetta? It&#39;s got a bit of quirkiness that adds character &#40;No pun&#41;, but it&#39;s not silly. It has an edginess that would stand up to the blackness of the photos &#40;I took a peek; rich work�I think your font is going to have some substance to it.&#41; If you remain attached to  Mrs. Eaves, using it as display type and Baskerville for body copy would not be amiss. They are conceptual cousins. It&#39;s just that Baskerville can be a bit thin.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 77348
    user: 1250
    date: 2004-09-30T18:39:00
    date_raw: Thursday, September 30, 2004 - 6:39 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">If you want a Mrs Eaves that actually works for text, try The Foundry&#39;s Wilson: <BR><a href="http://www.foundrytypes.co.uk/foundry_wilson/wilson.html" target="_blank">http://www.foundrytypes.co.uk/foundry_wilson/wilson.html</a> <BR>For one thing, it&#39;s not trendy at all - it&#39;s pretty rare. <BR> <BR>Another option is to use InDesign, since its optical spacing fixes Mrs Eaves&#39;s horrid spacing. <BR> <BR>Photopolymer letterpress printing: since letterpress has notable gain while offset doesn&#39;t, you can&#39;t really have the same exact font come out nice on both mediums. But if you find a typeface that has many weights in a very tight range &#40;or if you manage to tweak the weight of the font yourself, or maybe outsource that task&#41; then you could just swap the two weights as needed. Just watch the linebreaks if the two weights are not uniwidth. <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 77355
    user: 1250
    date: 2004-09-30T22:22:00
    date_raw: Thursday, September 30, 2004 - 10:22 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Spooky. Today I got the latest issue of M-Real magazine &#40;which includes an interesting co-interview with Spiekermann, as well as an article about the mechanics of reading/perception&#41; and guess what font they&#39;re using for text and titling: Wilson! <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 77425
    user: 1159
    date: 2004-10-01T11:55:00
    date_raw: Friday, October 01, 2004 - 11:55 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Paul, <BR>Looking at your photographs I keep thinking of Franklin Gothic. It may be the foreigner&#39;s romantic view of early 20th Century New York but, to me, those desolate industrial spaces are calling for some of Benton&#39;s faces. <BR> <BR>I think a nicely spaced and carefully sized Franklin Gothic Heavy would work very well for titles and, specially, captions. And if you print photopolymer-letterpress it will help convey the strong human-scale dimension of that face. <BR> <BR>Raph Levien has on his site some <a href="http://levien.com/type/atf_1923/" target="_blank"> images</a> of the 1923 ATF specimen book, with nice samples of both Franklin and News Gothic. <BR><a href="http://www.linotype.com/12600/itcfranklingothicheavy-font.html?PHPSESSID=0b3163a10bba60888762e3d419511cb3" target="_blank">Link</a> to Linotype&#39;s ITC Franklin Gothic. <BR> <BR>I hope this helps, your work is really good and, regardless of your type choice, I&#39;m sure it will be a beautiful book.</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 77442
    user: 4760
    date: 2004-10-01T14:06:00
    date_raw: Friday, October 01, 2004 - 2:06 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#60;font class=&#34;dontLookLikeCrap&#34;&#62; <BR>Thank you, Jesus, for the kind words about my work. <BR> <BR>I&#39;m interested in earlier the remark that Mrs. Eaves&#39; spacing is fixed by Indesign. I thought this might be the case and printed a sample; indesign definitely flowed the paragraph better, but the letterspacing within the words was about the same. Is there a preference or something within the program that can adjust this? <BR> <BR>I&#39;ve also been looking at Veljovic. The color is a bit light, but otherwise I like the type very much.  <BR> <BR>I&#39;m definitely sticking to serif fonts .. my experiments with sans serif just haven&#39;t worked out for this project. <BR>Still looking, but I&#39;m considering all the suggestions here and I greatly appreciate all the input. <BR>&#60;/font&#62;</font></font></font></font></font></font></font></font></font></font></font>
  - id: 77511
    user: 4406
    date: 2004-10-02T23:04:00
    date_raw: Saturday, October 02, 2004 - 11:04 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Of the suggestions above, my favorite is the Wilson. If the Mrs Eaves is working for you, the Wilson will probably work just as well or better. <BR> <BR>Especially if you&#39;re going to go through with the photopolymer, I might also suggest Centaur. The current digitization suffers from being a bit thin and spidery, but cranking up the press gain could fix that. I&#39;m working on optically scaled versions, but it&#39;s going to be quite some time before those are ready. <BR> <BR>The Sierra Club has used Centaur in their photo books to great effect. I was just looking at &#34;This is the American Earth&#34;.</font></font></font></font></font></font></font></font></font></font>
  - id: 77516
    user: 1062
    date: 2004-10-03T00:21:00
    date_raw: Sunday, October 03, 2004 - 12:21 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Regarding your question about word spacing in InDesign: <BR> <BR>Open the Paragraph palette. In the fly-out menu, choose Justification. Then set the Desired value to something less than 100% to tighten the word spacing. &#40;I&#39;ve used values as low as 40%-50% for headlines.&#41; <BR> <BR>Note that the Minimum and Maximum settings only come into play when text is justified, and that your Minimum percentage must always be smaller than the Desired setting.</font></font></font></font></font></font></font></font></font>'
  - id: 77527
    user: 711
    date: 2004-10-03T04:16:00
    date_raw: Sunday, October 03, 2004 - 4:16 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Paul: <BR>You are using &#34;optical kerning&#34; rather than &#34;metrics&#34;, aren&#39;t you. <BR> <BR>And, if you like Wilson, you really need to check out FF Clifford. There will be no need to fix the spacing with it!</font></font></font></font></font></font></font></font>'
  - id: 77677
    user: 4760
    date: 2004-10-05T09:19:00
    date_raw: Tuesday, October 05, 2004 - 9:19 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I was originally using metrics, which seemed quite uneven. optical kerning improves the evenness, but doesn&#39;t actually make it look right. <BR> <BR>Does anyone have opinions on Storm Andulka? I&#39;ve been looking at Storm&#39;s samples and I like it very much. I&#39;m considering using it for text, and using Mrs Eaves for the titling capitals. I have a hard time trusting my judgement based on someone else&#39;s text samples &#40;in Czech!&#41;.</font></font></font></font></font></font></font>
  - id: 82039
    user: 2881
    date: 2004-11-09T10:59:00
    date_raw: Tuesday, November 09, 2004 - 10:59 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Some really good suggestions here. <BR> <BR>Keep in mind that with traditional letterpress, depending on the font and paper choice, the line weights can tend to come out appearing just a tad narrower than with other printing methods. <BR> <BR>Have you considered using Democratica as a typeface? It&#39;s got a twist to it, and I particularly like combining the cap and lowercase letterforms in the same word, as they have the same height.  <BR> <BR>Might be a bit trendy, tho.</font></font></font></font></font></font>
