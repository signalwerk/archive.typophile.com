  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Howdy All, <BR> <BR>I am admitedly still learning the ins and outs of design principles and despite all the books I have bought and studied, kerning still escapes me. If any of you could help me with the kerning on this logo for my toughest client &#40;myself&#41;, I would be in dept to you. <BR> <BR>-Jeff <BR> <BR> <BR> <BR> <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/42219.jpg" alt="The Culprit"></font></font></font></font></font></font></font></font></font>
