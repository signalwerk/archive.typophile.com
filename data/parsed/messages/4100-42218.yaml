    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Howdy Mr. Jefferson Lomax. <BR> <BR>Definitions and samples of kerning are written in many books, <BR>but since the physical square of the letter is disappeared, <BR>you have to be able to read the white and imagine it. <BR>Kerning is about painting somehow. <BR>A link for you: <a href="http://www.owlsoup.com/foamtrain/glossary/" target="_blank">http://www.owlsoup.com/foamtrain/glossary/</a> <BR>I played with your logo. Cool monogram. <BR> <BR>Best, <BR>AS <BR><img src="http://www.typophile.com/forums/messages/4100/42354.gif" alt=""></font></font></font></font></font></font></font>'
