    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Alessandro, <BR>Thanks for the links and the help. It looks a lot better. You are entered into my &#34;People I Owe&#34; folder on my desktop. <BR> <BR>Daniel, <BR>The original dot on the i seemed to stand out too much and therefore was removed. I have made some adjustments that hopefully will feel more like the other letters and will post them here with the original. Let me know what you think. <BR> <BR>Top= original i, Bottom= new version  <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/42440.jpg" alt="LDlogo2"></font></font></font>
  - id: 70824
    user: 2332
    date: 2004-08-09T11:33:00
    date_raw: Monday, August 09, 2004 - 11:33 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Jefferson, <BR> <BR>I think the kerning  looks better and the words more even. <BR> <BR>For what it&#39;s worth: I really have to say that the i should keep its original round dot. The combination of letters &#39;ig&#39; make a nice vertical balance at that part of the word and the modified dot just makes the letter and word look somehow squashed or imparied. <BR> <BR>The a in Lomax looks a little small like the bottom of the bowl isn&#39;t descending below the baseline as it should and the  recessed crown on it make it look like it&#39;s timid. <BR> <BR>Jon</font></font>'
  - id: 71025
    user: 3602
    date: 2004-08-10T13:59:00
    date_raw: Tuesday, August 10, 2004 - 1:59 pm
    votes: null
    html: <font class="dontLookLikeCrap">Howdy John, <BR> <BR>I have replaced the dot on the &#34;i&#34; but haven&#39;t changed the &#34;a&#34; though. It is the original &#34;a&#34; from Friz Quadrata and in Illustrator it bottoms out at the same level as the other round letters used here. I wonder if the shortness your seeing may be due to conversion to raster format. When I am more confident, I&#39;ll just design all the lettering instead of &#34;adjusting&#34; someone elses design.   ...gimme time. <BR> <BR>On a sidenote, I am designing my first font that I&#39;ll post in the critique section soon. I&#39;ve listened to this forum for a while now and am impressed by the professional critiques that are given.</font>
