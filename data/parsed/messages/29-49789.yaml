  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><img src="http://www.typophile.com/forums/messages/29/49790.jpg" alt="wack logo"> <BR> <BR>I wanted to move away from the old logo of the gallery. The gallery specializes in glicee prints by artists such as Coop, Shepard Fairey, Pizz, Clayton Brothers. <BR> <BR>So I wanted to exploit the eccentric nature of the art by using a circus-cum-western look to the logo. To seperate its identity from other galleries.  <BR> <BR>I would apply this logo to a very eccentric corporate identity. To reflect the art and its buyers. <BR> <BR>Sock it to me!</font></font></font></font>
