    html: <font class="dontLookLikeCrap">The skewing of the logo gives it an uneasy look, as if it&#39;s falling or slipping away, but then it looks as if it&#39;s out of wack, so its form is expressive of the name. It has a tension in it, I almost expect it to do something. <BR>I can&#39;t offer any negative critique on the type itelf as I&#39;m just a hack graphic designer to begin with.</font>
