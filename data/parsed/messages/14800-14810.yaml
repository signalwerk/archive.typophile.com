    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>&#62; Commercial competition is not based in the technique.  <BR>It is based on talent and work.</i> <BR><i>&#62; Real competition is in the field of real design quality.</i> <BR>I totally agree. If it were based on technique, the guy  <BR>with the most powerfull machines, the most recent software  <BR>and the largest collection of &#34;How To Design&#34; magazines <BR>would be top of the heap. Well, there <i>ARE</i> clients who  <BR>believe that all we do is click the option &#34;Good Design&#34; <BR>in the menu bar... <BR> <BR><i>&#62; And such quality doesn&#39;t depend on having or not having  <BR>the clue to use some stupid trick.</i> <BR>Well, try to tell that to the evil empire of Coca Cola. <img src="http://www.typophile.com/forums/clipart/wink.gif" border=0> <BR>Again, I&#39;m not saying it necesarilly is so, I just wanted  <BR>to get a couple of different opinions. And I think the  <BR>Mr. Ego blasts on the shoutbox are <i>REALLY</i> stupid. <BR> <BR><i>&#62; Stamp tutorial is really useful, you can propose  <BR>one tutorial idea and others can help to finish it here,  <BR>that&#39;s great.</i> <BR>Thanks for the offer, but you&#39;re talking to an obsessive  <BR>control freak here. I don&#39;t know if I could handle someone  <BR>else finishing off something I started when I know where  <BR>it&#39;s supposed to go. <img src="http://www.typophile.com/forums/clipart/lol.gif" border=0> <BR>Next up could be a &#34;Text in a box&#34; tutorial which only works  <BR>in Adobe InDesign, not QuarkXPress. Anyone interested?</font></font></font></font>
