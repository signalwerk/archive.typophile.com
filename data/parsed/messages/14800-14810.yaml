    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I strongly agree with Miguel. Real competition is in the fields of real design quality. And such quality not depend on having or not having the the clue to make some stupid trick.</font></font></font></font>
