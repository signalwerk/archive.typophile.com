  - id: 29366
    user: 1109
    date: 2003-09-10T20:44:00
    date_raw: Wednesday, September 10, 2003 - 8:44 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;ve got an idea, what about Collaborative Tutorials?  <BR> <BR>Tricks for Indesign, Photoshop font preview images with high quatity on screen, alternative methods for font design, making of pixel fonts, <BR>how to choose a good type for different stuff, Type illustration as an image, how to think like a client, how to build a portafolio online, how to make a foundry, etc, etc... <BR> <BR>Collaboration is Essential. <BR> <BR>To get started on Typophile Tutorials, i want to start making a call for all who want to collaborate and help us to make a definitive guide to make pixel fonts for flash, on Fontographer and Fontlab users. <BR> <BR>There are many good designs here, keep secret on tricks are silly. <BR> <BR>Let the designs of the fonts sell the font, not whether they work or not. <BR> <BR>Lets put our hands together to put an end to this thedious blind steps. <BR> <BR>mh <BR> </font></font></font></font>
