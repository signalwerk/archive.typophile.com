  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The TypoGenealogy design project is off and running. <BR> <BR>What are some other collaborative things that everyone would <BR>like to do here? <BR> <BR>As it says in the Forum Header: <BR>This is your playground for collaborative design projects,  <BR>an ideal spot to generate ideas and work on fun, freebie,  <BR>pro-bono projects with your fellow Typophiles.  <BR>This is not a place for spec work or contests.  <BR> <BR>So throw out some ideas and let�s run with them. <BR> <BR>bj</font></font></font></font>'
