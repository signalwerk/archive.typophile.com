    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Yes and no: I&#39;m more than willing to share some of  <BR>my typography tricks no prob &#40;I don&#39;t design type&#41;  <BR>just like I once put up my <a href="http://www.typophile.com/forums/messages/83/10551.html#POST18130" target="_blank"> weathered look tutorial</a>  <BR>in a Type ID thread. BUT there still is an argument  <BR>for signature techniques that give you a creative or  <BR>commercial advantage over the competition. <BR> <BR>What do the others think?</font></font></font></font>'
  - id: 29402
    user: 1109
    date: 2003-09-11T02:44:00
    date_raw: Thursday, September 11, 2003 - 2:44 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Yes and No, can&#39;t decide eh... <BR> <BR>for me... comercial competition is not based in the technique.  <BR> <BR>Is based on Talent and work. <BR> <BR>Good work speaks for itself. <BR> <BR>This is a Forum, whe can make the difference with such kind of collaborative proyects, with profesional and amateur typophiles. <BR> <BR>Stamp tutorial is really usefull, you can propose one tutorial idea and others can help to finish it here, that&#39;s great. <BR> <BR> <BR>mh.</font></font></font></font>
