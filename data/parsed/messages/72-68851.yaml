  html: '<font class="dontLookLikeCrap">This long-awaited volume is finally in stock on the <a href="http://www.bl.uk/acatalog/Catalogue_ISBN_0712348123_450.html">British Library catalogue</a>. Amazon US and UK have not picked up the stock availability yet, but the BL shop will sell one to you.  <BR>For my money Richard Southall is by far the most intelligent commentator on typeface design around: he writes well, with substantial command of the relevant theory and history, and exemplary understanding of the technology and its impact on design processes. There are very few people writing about typeface design at this level, and any commentator worth their salt should have read Richard&#39;s texts.  <BR>So, I must be a fan, then.</font>'
