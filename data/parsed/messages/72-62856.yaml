  html: <font class="dontLookLikeCrap">High-Logic today announces the release of Font Creator� version 5.0 for Windows, a powerful application that puts font creation within the grasp of the average PC user, typographers and graphic designers. The editor lets you easily select and modify the entire character set of any TrueType� font and fonts based on OpenType� font technology. Features include the ability to convert &#40;scanned&#41; images to outlines, thus enabling you to create fonts with your own signature, logo and handwriting. <BR> <BR>The intuitive interface makes Font Creator the perfect tool for both new and experienced users. The advanced validation features make the design process easy and help you avoid common mistakes. <BR> <BR>The new contour operations &#40;union, intersection, exclusion and knife&#41; greatly simplify and speed up the design process. Other new features include the ability to add selected characters or entire character sets with their mappings, to automatically calculate ascender and descender values and to show comparison glyphs in the glyph edit window. The new complete composites feature quickly adds diacritical marks to incomplete glyphs. This powerful feature can complete over a thousand characters within a few seconds. <BR> <BR>Whether you&#39;re a font vendor who wants to create and distribute royalty-free fonts, a designer who needs a unique font, a business person who needs to add a euro sign, logo or signature to an existing font, or a home user who wants to make a font based on your own handwriting, Font Creator has the tools you need. <BR> <BR>Availability and pricing <BR>Font Creator version 5.0 for Windows is available in two editions. The Home Edition costs $65.00&#40;US&#41; and the Professional Edition costs $99.00&#40;US&#41;. Both versions may be purchased securely online at <a href="http://www.high-logic.com" target="_blank">http://www.high-logic.com</a>. Free, fully-functional 30-day trial versions can be downloaded from the same web site.</font>
