  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Anyone planning to go to the How conference this year in Chicago? <BR> <BR><a href="http://www.howconference.com"> How 05</a> to check it out if you have not heard. <BR> <BR>Also, if anyone here has attended in the past, what did you think? I am considering attending the upcoming conference for the first time, but am wondering how &#40;no pun intended&#41; good it is. <BR> <BR>Mike</font></font></font></font>
