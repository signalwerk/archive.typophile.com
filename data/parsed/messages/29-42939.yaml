    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">It looks a little more current, but now I&#39;m seeing a Marshall&#39;s or TJ Max handbag company, or maybe a logo for a new French toasted bagel product at the corner coffee shop. <BR> <BR>I&#39;m not getting anything related to music or its promotion. The fudge name works because of its quirkiness, which is what I would try to play off of. <BR> <BR>Aloha! <BR>Scott</font></font></font></font>
