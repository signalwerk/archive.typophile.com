    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Scott I almost wrote something identical &#40;I mean the same&#41; but the recognized your posting before posting myself, thankfully.  <BR> <BR>I don&#39;t want to start a discussion if being hip is the right starting point for a logo or generally for a business. This mostly has only short reach. &#40;I mean being hip in first place&#41;. <BR> <BR>I&#39;d be going much more in the music direction. The TV interpretation does not hit the point for me. <BR>Music Videos are much more about music than about video. So maybe try something referring to music and singing. <BR> <BR>Servus <BR> <BR>Dominik <BR> <BR> <BR></font></font>
