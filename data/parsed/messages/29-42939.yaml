    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This is certainly a lot better, but, yea, I guess I agree with Scott...still not quite the right target. <BR> <BR>BTW, is there a domain name for this &#40;fudge.tv&#41;? If not, then I&#39;d probably loose the dot-thing. You wouldn&#39;t want fudge.tv taken up by a porn site down the road or something. ;o&#41; <BR> <BR>OK...one idea...melted &#40;&#39;hot&#39;&#41; fudge? Fudge dripping over a TV? Piece of fudge wrapped in a fudge TV wrapper? </font></font></font>
