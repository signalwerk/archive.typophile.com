  - id: 91461
    user: 1133
    date: 2005-01-29T19:49:00
    date_raw: Saturday, January 29, 2005 - 7:49 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The font has pretty strange font metrics. The descender line is at -3, the x-height is at -1, the ascender and the caps height are at 1000.  <BR> <BR>I assume you&#39;re using FontLab? Either unlock the Vertical Metrics layer and drag the ascender, descender, caps height and x-height lines to their appropriate positions, or go to File / Font Info / Metrics and Dimensions / Key dimensions, and enter the appropriate values here.  <BR> <BR>Adam</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
