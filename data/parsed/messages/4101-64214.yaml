  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I created most of a pixel font &#40;A-Z, a-g&#41; and everything works fine except for the fact that the &#34;g&#34; does not show up below the descender line. <BR> <BR>the &#34;Ascent&#34; is 1125 <BR>the &#34;Descent&#34; is 250 <BR>the &#34;Em Square&#34; is 1000 <BR> <BR>I am a begginer so any advice is appreciated <BR> <BR>Thanks, <BR>Matt</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
