  - id: 91467
    user: 1043
    date: 2005-01-29T21:02:00
    date_raw: Saturday, January 29, 2005 - 9:02 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">A couple of things:  <BR> <BR>The em square should normally be the sum of the ascent and descent values. As it is, they add up to much more than 1000. It doesn&#39;t have to be 1000. In the font you posted it would be 1125 &#43; 375 = 1500. 1500 is not the typical figure, but it will work fine. <BR> <BR>To do this, just go to the Font Info window and check both &#34;Retain path coordinates when changing em square&#34; and &#34;Automatically compute em square from ascent &#43; descent&#34;. Click OK and everything should work a lot better.</font></font></font></font></font></font></font></font></font></font></font>'
  - id: 91967
    user: goldy2006-users
    date: 2005-02-02T15:46:00
    date_raw: Wednesday, February 02, 2005 - 3:46 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I changed the em square to 1500. Unfortunately, all this did was change the font size at different sizes, but I appreciate the advice. I still feel like something is wrong with the metrics, but I&#39;m not sure what.</font></font></font></font></font></font></font></font></font></font>
  - id: 91975
    user: 1043
    date: 2005-02-02T17:29:00
    date_raw: Wednesday, February 02, 2005 - 5:29 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>&#62;I changed the em square to 1500. Unfortunately, all this did was change the font size at different sizes, </i> <BR> <BR>Yes, it would have that effect. The problem &#40;or at least part of the problem&#41; is that you are drawing the characters far outside the boundaries of your font. The ascent and descent lines are where the topmost and bottommost parts of your characters should normally stop. If you extend parts of characters beyond those limits, they will get clipped off when you use the font in most programs. <BR> <BR>I would suggest spending some time with the Fontographer manual, go through the tutorials, etc.</font></font></font></font></font></font></font></font></font>
  - id: 92089
    user: 2575
    date: 2005-02-03T16:27:00
    date_raw: Thursday, February 03, 2005 - 4:27 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I have always done my outlines in Ikarus, and for the kerning pairs and weight generation I use Fontographer. <BR> <BR>I find that if I generate a Mac or PC font from the Ikarus data, the results are accurate and for the greatest part I get exactly what I want from the outlines. <BR> <BR>Once I open up the Mac font into Fontographer, all kinds of ugly things happen. <BR> <BR>Point types are changed from say a curve to an angle, and angles to inflection points &#40;the type where a straignt goes into a curve&#41;. <BR> <BR>I have long ago misplaced my manual, and I am stumped as to how I can change a point type to any other point type. <BR> <BR>Can any of you FOG wizards tell me how to do this? <BR> <BR>Thanks. <BR> <BR>Jim Rimmer</font></font></font></font></font></font></font></font>
  - id: 92107
    user: 2575
    date: 2005-02-03T18:18:00
    date_raw: Thursday, February 03, 2005 - 6:18 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">After trying every botton on the keyboard, I discovered a prompt up in the header that tells me to hit command, 8,9, or 0. This seems to give me the proper point type substitute, but the curve point still looks like a corner point and behaves that way if I drag it. By holding down the option key ands puling on the handles, it behaves like a curve point, but how terribly awkward! <BR> <BR>I hope Fontlab is not so clumbsy, since I am planning to switch to it soon. <BR> <BR>On the othert hand I could be doing this all butt-backwards. Any suggestions? <BR> <BR>Jim Rimmer</font></font></font></font></font></font></font>
