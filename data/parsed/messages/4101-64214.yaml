    user: goldy2006-users
    date: 2005-02-05T06:57:00
    date_raw: Saturday, February 05, 2005 - 6:57 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>The problem &#40;or at least part of the problem&#41; is that you are drawing the characters far outside the boundaries of your font. The ascent and descent lines are where the topmost and bottommost parts of your characters should normally stop. If you extend parts of characters beyond those limits, they will get clipped off when you use the font in most programs.</i> <BR> <BR>Neither the ascent lines nor descent lines touch any character of my font. They are above and below each character respectively.</font></font></font></font></font></font>
  - id: 92310
    user: 1043
    date: 2005-02-05T08:02:00
    date_raw: Saturday, February 05, 2005 - 8:02 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Matt, is it possible for you to post the Fontographer font file here? &#40;Not the generated TrueType of PostScript font&#41; There seems to be something fundamentally wrong with the way you&#39;ve set up the font. <BR> <BR>Jim, FontLab uses a different system for curve/line transition points which may make more sense to you. These points can be designated as smooth or not smooth. Smooth gives the same effect as a tangent point in Fontographer when a line a curve meet. The control point of the curve is aligned to the angle of the incoming line keeping the transition between the curve and the line smooth. When the point is set to not smooth, the control point is unconstrained allowing the transition to form a sharp corner. The smooth/not smooth thing works with the transition between curves as well except that it keeps the control points on either side aligned, again creating a smooth transition. This is the same as a &#34;curve point&#34; in Fontographer. <BR> <BR>I sure hope there are other people familiar with Fontographer to help answer some of these Fontographer questions. I switched to FontLab cold turkey over a year ago and would rather forget about Fontographer and all the stupid little tricks you have to learn to use it effectively. FontLab is way better.  <BR> <BR>And Matt, as it seems you are just starting to learn about making fonts, I would suggest using something like FontLab&#39;s <a href="http://www.fontlab.com/Font-tools/TypeTool/">TypeTool</a>. It&#39;s cheap and easier than FontLab, and you won&#39;t be learning to use an obsolete and virtually unsupported program &#40;Fontographer was last updated in <i>1996!</i>&#41;. Plus, you can upgrade to FontLab later if you decide you like this sort of thing. Just a friendly suggestion.</font></font></font></font></font>
