    date: 2005-01-21T11:13:00
    date_raw: Friday, January 21, 2005 - 11:13 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I feel that one of our jobs as designers is to visually educate people with meaningful thoughtful sensitive design. One way to NOT do this is to remove the meaning all together. If there is no meaning you aren&#39;t educating anyone. <BR> <BR>For me it makes it difficult on the viewer to try to figure out why you combined the letterforms. Especially if there is no reason.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 90050
    user: 2236
    date: 2005-01-21T12:35:00
    date_raw: Friday, January 21, 2005 - 12:35 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Wow! We&#39;re starting to get really philosophical over this. <BR> <BR>To David&#39;s point, an entity&#39;s logo should be purposeful. It should represent the entity that it is being designed for. <BR> <BR>In Dragan&#39;s defense, this logo&#39;s purpose is to represent his design business, possibly, but not necessarily,  in a way that reflects his design style; hence, it is successful in that it is his initials &#40;representing his business just as well as any business that is represented by names or initials&#41; and it is designed by him &#40;must show his style&#41;. I think his concept is solid, so it is his execution that will determine whether or not this is a successful logo in the end. <BR> <BR>Your concept in post 6 looks like a bed&#39;s footboard on its side. Of the concepts in the last post &#40;7&#41;, I like the direction on the bottom, but now &#40;your going to kill me for this&#41; it&#39;s a little too subtle. Rather than reading a &#34;B&#34;, I&#39;m seeing a big pimple or mosquito bite. Try bringing back a little more of the stroke in that area so that the bump isn&#39;t so abrupt. Also, the terminal is a little too rounded. I think there&#39;s a good shape in there, it&#39;s just hiding in between a couple of your executions. <BR> <BR>Aloha! <BR>Scott</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
