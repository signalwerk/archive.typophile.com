  - id: 90148
    user: 3471
    date: 2005-01-22T09:40:00
    date_raw: Saturday, January 22, 2005 - 9:40 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">You could theoretically combine a &#34;d&#34; and a &#34;b&#34; all day long in a million different ways.  Which way is the right way? <BR>I ask myself  simple question about the logos presented here.  <BR> <BR>How do these logos visually represent that you are a graphic designer? <BR> <BR>To Darrel; <BR>Don&#39;t you think a logo is more memorable if it has some underlying metaphor or meaning in it? I&#39;m not talking about a literal meaning like you mentioned. I am talking more simplified, timeless and abstract. <BR> <BR>Here comes my sobering point of the day. <BR>Graphic design firms with logos are limiting themselves. Why would you design a logo for a logo designing company? This might be to heady to talk about on this forum. Look at the logos of some the greatest design firms in the world. You will find that there is nothing tricky or contrived or forced about any of them. In fact, they have a certain consistency about them for a simple reason. They do to many different tasks as design firms to try and represent themselves with a single mark. Most of there logos are more like logotypes that just read simply and smoothly , no bells and whistles man. <BR>  <BR>Again...only my opinion.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
