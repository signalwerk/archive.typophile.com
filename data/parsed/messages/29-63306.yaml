    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">IRT: Scott <BR>yes i have mostly done silverpieces and just plain black ones with no other colors, it&#39;s not like i do ONLY them, it&#39;s just that i have always liked black and white stuff more. but everything gets old if you give it enough time, so you venture into other places, so i have done lots of color pieces too, yes. <BR>regarding the id, you have pointed out some very important issues once again, i&#39;ll do that. <BR>  <BR>IRT: David <BR>  <BR>i don&#39;t think it necessarily HAS to mean anything in particular, do you? <BR>  <BR>in Scott&#39;s first reply he has seen it as a unique letterform, and that&#39;s what i wanted to do, i want people to see one letter, but to &#39;know&#39; there are two . . . <BR>i don&#39;t know if you understand me, i hope you do . . . <BR>hat&#39;s why i posted here, mainly because of the &#39;B&#39;, i don&#39;t know if people will &#39;see&#39; that &#39;B&#39;, or will they read just &#39;D&#39; and stare confused? <BR>  <BR>Scott, there are some zipped photosattached for you or anyone. <BR><!--attachment: graff-63394.zip*attachment_icon.gif*application/download*509.1*graffiti+flicks*graff%2ezip --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/attachment_icon.gif" align=left alt="application/download">graffiti flicks<br><a href="http://www.typophile.com/forums/messages/29/graff-63394.zip" target="_blank"><b>graff.zip</b></a> (509.1 k)</td></tr></table></center><!--/attachment--></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 90032
    user: 3471
