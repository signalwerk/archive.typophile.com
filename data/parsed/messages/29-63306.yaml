  - id: 90075
    user: 5543
    date: 2005-01-21T15:36:00
    date_raw: Friday, January 21, 2005 - 3:36 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">IRT Daniel: <BR>i did that &#39;db&#39; thing once and it reminded me too much of a penis, so i let it go. <BR>i didn&#39;t mean to offend anyone here, it just did! sorry . . . <BR>as for the first part of you suggestion, i&#39;m afraid i don&#39;t understand what you are trying to say, as i said before, english isn&#39;t my mother tongue. :-&#40; <BR>  <BR>IRT Scott: <BR>i get you once again. <BR>i thought too the curve is too &#39;mellow&#39; now. <BR>as this conversation is going, i was thinking about it and i came to a conclusion that a logo really doesn&#39;t have to represent anything at all, but even in that case it WILL represent something - NOTHING&#40;if that is your attitude&#41;, if you can understand what i&#39;m saying . . . <BR>well what i am trying to say here doesn&#39;t neccessarilly has to reflect this design in particular, i am talking on the subject of the logo being the true symbol that will represent the core of the company or an individual. <BR>so, it can be taken for a l&#39;art pour l&#39;art kind of thing, you know . . . <BR>i consider myself a kind of a nihilist in some ways even, so. . . <BR>anyways it is something to think about. :-&#41; <BR>  <BR>tomorrow i&#39;ll redo some things, i just hope no one got uset over this whole thing, or even worse get angry at someone. and i hope that this issue of mine isn&#39;t a burden to anyone, if that is the case, please be assured it was not my intention and you have my deepest appologies for me posting it here.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
