    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">and i appreciate it. :-&#41; <BR>  <BR>do you feel that people looking at logos, i mean &#39;ordinary&#39; people, &#39;little men&#39;, people who are not designers, see anything in a logo? <BR>  <BR>from my experience, i think they don&#39;t, they just get a certain &#39;feel&#39; or a &#39;vibe&#39; from a logo, but i don&#39;t think it goes deeper that that for them . . . correct me if i&#39;m wrong. <BR>  <BR>as for designers, i think it&#39;s obvious taht they do look for something &#39;inside&#39; the logo. and see it. <BR>  <BR>i didn&#39;t want to transform this into nothing else but letters. i didn&#39;t want to make a pictogram or anything out of it . . . <BR>so i guess i&#39;m sticking to it. <BR>  <BR>here are 2 new ideas, plus i am working on scott&#39;s suggestions<img src="http://www.typophile.com/forums/messages/29/63400.gif" alt="new"></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
