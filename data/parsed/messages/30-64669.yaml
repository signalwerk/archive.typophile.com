    html: <font class="dontLookLikeCrap">Damn. It makes me wish I&#39;d gotten on top of things and made it to the Festival. Next time�if there is a next time�I&#39;ll be there for sure. <BR> <BR>You know, the more I learn about type and the uses of type in graphic design, the more impressed I am by San Francisco, a city that seems to be overflowing with typographical talent. This is a city where even &#40;especially?&#41; New Age crystal stores can have beautifully balanced sans / serif etched display type used in their windows. Not to mention all the brilliant hand-lettered sign painting. Or the preternaturally talented taggers and graffiti artists. Just walking around is a continuous source of inspiration!</font>
