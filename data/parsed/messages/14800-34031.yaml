  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I have a company which is an e-business consulting service specializing in B2B &#40;business to business&#41;. Our logo and letterhead are designed in Frutiger. I&#39;m looking for a nice/ contemporary/clean/easy to read typeface for correspondence which will compliment/go well with the Frutiger letterhead. I&#39;ve attached a file of our logo and tag line. <BR> <BR>I&#39;ve received some suggestions but have not found one which stands out for me. Any suggestions - &#40;please also include weight, etc.&#41;  <BR>or what I should be looking for. <BR>Suggestions so far include: <BR>Universe <BR>ITC Officina Sans <BR>ITC Officina Serif <BR>ITC Franklin Gothic <BR>ITC Conduit <BR>Icone or Breughel or Meridien <BR>Thanks, <BR> <BR>Roger Curtis <BR> <BR><!--attachment: sitcur2-34032.unk*attachment_icon.gif*image/bmp*68.1**sitcur2%2ebmp --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/attachment_icon.gif" align=left alt="image/bmp"><br><a href="http://www.typophile.com/forums/messages/14800/sitcur2-34032.unk" target="_blank"><b>sitcur2.bmp</b></a> (68.1 k)</td></tr></table></center><!--/attachment--></font></font>'
