    html: <font class="dontLookLikeCrap">Roger, <BR>If you&#39;re looking for a serif face to match Frutiger, I&#39;d start with some of Adrian Frutigers other fonts - Didot, Versailles, and Iridium all look pretty good with Frutiger &#40;I prefer Versailles&#41;. <BR>Alex</font>
