  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi all. <BR> <BR>This is last friday&#39;s effort from my Friday Fonts campaign. I&#39;m continuing to work on my <BR>grotesque, but needed a break. <BR> <BR>It&#39;s based on a photo I took of an antique child&#39;s toy. The original was woodburned so I  <BR>tried to keep some of that appeal. Hopefully it still has some appeal. When I eventually  <BR>revamp my website, I was thinking of maybe offering it as a free font. Or should I try  <BR>to sell it? <BR> <BR>Thanks for your thoughts, <BR>Randy <BR><img src="http://www.typophile.com/forums/messages/29/10941.gif" alt="AT Tenement"></font></font></font></font>
