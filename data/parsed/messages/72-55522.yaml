  html: '<font class="dontLookLikeCrap">============================================================ <BR>LinoLetter 12/04 - Experience Zapfino�s New Possibilities!      <BR>============================================================ <BR> <BR>! Welcome to the December issue of LinoLetter ! <BR> <BR>INTRODUCTION: <BR>Creating unique typographic possibilities is our company�s  <BR>mission and goal. This month we are pleased to present our  <BR>most innovative OpenType font to date: the new Zapfino  <BR>Extra Pro, with Contextual OpenType Features. This  <BR>update of one of our best-selling families elevates the  <BR>Zapfino experience to a whole new level. And speaking of  <BR>old favorites, we have chosen December to roll out another  <BR>classic Linotype collection: Type before Gutenberg. This  <BR>finely drawn compilation of our best calligraphic  <BR>typefaces offers a flourish of lettering spanning several  <BR>historical epochs. Finally, we�d like to draw your  <BR>attention to three of our favorite places on the Linotype  <BR>website: we�ll take a second look at the script face  <BR>Expectation as well as drop by our &#34;New Font Releases&#34; <BR>and &#34;Bookshop&#34; sections. <BR> <BR>Have fonts of fun! <BR> <BR> <BR>------------------------------------------------------------ <BR> <BR>IN THIS ISSUE:  <BR> <BR>1.  Zapfino Extra: Experience Zapfino�s New Possibilities! <BR> <BR>2.  Type before Gutenberg 1�3: Three compilations of  <BR>    yesteryear�s calligraphic designs for today�s  <BR>    typographers <BR> <BR>3.  Brand new fonts from Linotype Library <BR> <BR>4.  The Expectation Family: Two trendy fonts with a  <BR>    handwritten feel <BR> <BR>5.  The Linotype.com Bookshop: Books on type and typography <BR> <BR>____________________________________________________________ <BR> <BR>1.  Zapfino Extra: Experience Zapfino�s New Possibilities!  <BR>____________________________________________________________  <BR> <BR>Zapfino Extra Pro elevates the Zapfino experience to a whole  <BR>new level. Our latest update to this contemporary classic  <BR>includes an extensive set of OpenType features - simplifying  <BR>text setting with Zapfino and allowing the user to quickly  <BR>achieve stunning results. <BR> <BR>When used in modern layout applications which support  <BR>OpenType features &#40;such as Adobe InDesign CS or Adobe  <BR>Illustrator CS&#41;, Zapfino Extra Pro simulates a natural <BR>calligraphic flow. A sophisticated system of contextual  <BR>substitutions embedded in the font automatically chooses  <BR>different stylistic variants of the alphabetic characters.  <BR>And this happens as you type, without needing to select any  <BR>options! <BR> <BR>Are you ready for the ultimate e-calligraphic experience?  <BR>Dive into the world of the new Zapfino: <BR>- <a href="http://www.linotype.com/6-2326-6/zapfinoextra.html" target="_blank">http://www.linotype.com/6-2326-6/zapfinoextra.html</a>     <BR> <BR> <BR>____________________________________________________________ <BR> <BR>2.  Type before Gutenberg 1�3: Three compilations of  <BR>    yesteryear�s calligraphic designs for today�s  <BR>    typographers <BR>____________________________________________________________ <BR> <BR>In the late 1980s and early 1990s, several well-known  <BR>calligraphers were invited to design original  <BR>interpretations of historical handwriting styles �  <BR>especially for use in modern typesetting. Under the banner  <BR>&#34;Type before Gutenberg,&#34; three compilations of these  <BR>typefaces are now available. Each &#34;Type before Gutenberg&#34;  <BR>pack contains fonts from the different historical ages  <BR>leading up to Gutenberg�s invention of the printing press  <BR>at around 1450. <BR> <BR>Included in these packages are our beloved Herculanum and  <BR>Omnia from Adrian Frutiger, Gottfried Pott�s  <BR>Carolingian-style Carolina, and the extravagantly elegant  <BR>Notre Dame, Beneta and San Marco from Karlgeorg Hoefer! <BR> <BR>Take a trip back in time with Type before Gutenberg 1-3: <BR>- <a href="http://www.linotype.com/6-2166-6/typebeforegutenberg.html" target="_blank">http://www.linotype.com/6-2166-6/typebeforegutenberg.html</a> <BR> <BR> <BR>____________________________________________________________ <BR> <BR>3.  Brand new fonts from Linotype Library   <BR>____________________________________________________________ <BR> <BR>In order to keep you informed about the latest releases in  <BR>our ever-expanding Font Library, we have created a new  <BR>section in our Font Finder entitled &#34;New Font Releases.&#34;  <BR>Take a look at our new faces, intended for use in trendy to  <BR>top-notch settings. Best of all, these new fonts will equal  <BR>or surpass the technical quality of your old favorites. <BR> <BR>Check it out here: <BR>- <a href="http://www.linotype.com/5-2297-5/newfontreleases.html" target="_blank">http://www.linotype.com/5-2297-5/newfontreleases.html</a> <BR> <BR> <BR>____________________________________________________________ <BR> <BR>4.  The Expectation Family: Two trendy fonts with a  <BR>    handwritten feel <BR>____________________________________________________________ <BR> <BR>Making a Christmas card takes a lot of work! Finding the  <BR>right typeface can be tough, too. Have you ever spent hours  <BR>searching for just the right one? Well, back in 2003,  <BR>instead of spending hours searching, German designer Guido  <BR>Bittner made up his own. This delicate series of letters  <BR>maintains a handwritten feel, in part because it began as a <BR>digitalization of Bittner&#39;s own handwriting. Expectation  <BR>Swash includes additional swash letters, which can be paired  <BR>with regular version characters of Expectation to create  <BR>superior effects. The Expectation font family was a winner  <BR>in the Linotype Library 2003 International Type Design  <BR>Contest. <BR> <BR>Let these fonts exceed your expectations and spark your  <BR>inspiration: <BR>- <a href="http://www.linotype.com/7-2278-7/vsexpectation.html" target="_blank">http://www.linotype.com/7-2278-7/vsexpectation.html</a> <BR> <BR>  <BR>____________________________________________________________ <BR> <BR>5.  The Linotype.com Bookshop: Books on type and typography <BR>____________________________________________________________ <BR> <BR>New service: Linotype Library has gathered together some of  <BR>the best books on type and typography, including works from  <BR>such type legends as Jan Tschichold, Paul Renner, Sumner  <BR>Stone, and Gottfied Pott. Other selected books include  <BR>titles no self-respecting type designer can afford to live  <BR>without! We are proud to bring this bookshop to you in  <BR>association with Amazon.com. <BR> <BR>Detailed descriptions of all available books can be found  <BR>here: <BR>- <a href="http://www.linotype.com/7-2262-7/bookshop.html" target="_blank">http://www.linotype.com/7-2262-7/bookshop.html</a> <BR> <BR> <BR> <BR>------------------------------------------------------------ <BR> <BR>Don�t Forget! <BR> <BR>Linotype.com offers a wide variety of possibilities to help  <BR>you find the right typeface or font package, as well as the  <BR>chance to try the fonts out and also make a purchase. This  <BR>month, we would like to remind you of our award-winning font  <BR>search application, FontExplorer, and our most up-to-date  <BR>special offers. <BR> <BR>Fontexplorer <BR>Take this little application for a spin � with FontExplorer,  <BR>you can easily search our 6,000&#43; font database, specifying  <BR>exactly which features should be highlighted in the process  <BR>&#40;including design features and subjective key words&#41;. <BR>- <a href="http://www.linotype.com/5-18-5/fontexplorer.html" target="_blank">http://www.linotype.com/5-18-5/fontexplorer.html</a> <BR> <BR>Special Offers <BR>Font Packs for all needs at the lowest prices! Selected  <BR>packs are available for both beginners and professionals. <BR>- <a href="http://www.linotype.com/5-2163-5/specialoffers.html" target="_blank">http://www.linotype.com/5-2163-5/specialoffers.html</a> <BR> <BR> <BR>&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42;&#42; <BR> <BR>We hope you found this issue of LinoLetter informative and  <BR>useful. We would highly appreciate your feedback at  <BR><a href="mailto:info@linotype.com">info@linotype.com</a> <BR> <BR>The next issue of this newsletter will be published and  <BR>dropped in your mailbox at the beginning of January. <BR> <BR>Your Linotype Library Online Team <BR> <BR> <BR>------------------------------------------------------------ <BR>Publisher: <BR>Linotype Library GmbH <BR>Du-Pont-Stra�e 1 <BR>61352 Bad Homburg / Germany <BR> <BR>Website: <a href="http://www.linotype.com" target="_blank">www.linotype.com</a> <BR>Contact: <a href="mailto:info@linotype.com">info@linotype.com</a> <BR>Phone &#43;49 6172 484-418 <BR>Fax   &#43;49 6172 484-429   <BR>------------------------------------------------------------ <BR> <BR>&#40;c&#41; 2004  Linotype Library GmbH</font>'
