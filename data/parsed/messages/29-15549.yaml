    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">1&#41; The title is not part of the shirt. <BR>2&#41; Look at the country of origin: the title was &#40;most probably&#41; written by a non-English-native. To them things like &#34;Come jump @ biggest partyzone!&#34;&#42; is impeccable English, and SNL plays on words have no meaning. <BR>3&#41; I honestly don&#39;t see any pedophilia in it at all. Maybe I&#39;m just lucky?  :-/ <BR>4&#41; What about racism? That skinhead is teasing a little black boy, right? <BR>5&#41; Yves and I are dads too. <BR> <BR>&#42; From an actual club flier &#40;Leipzig&#41;. <BR> <BR>hhp <BR></font></font></font></font>'
