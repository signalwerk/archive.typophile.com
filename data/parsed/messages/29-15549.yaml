    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;&#62; 4&#41; What about racism? That skinhead is teasing a little black boy, right?  <BR> <BR>r  e  a  c  h  i  n  g   on that one, imo. :P <BR> <BR>One person&#39;s skinhead is another person&#39;s bald man. <BR> <BR>I thought the guy was being nice to a little letter. <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> <BR> <BR> <BR>I didn&#39;t get the pedophilia until Joe mentioned it. <BR>I thought the design was stylish, in terms of vectors, color, <BR>execution...I&#39;d buy it...c&#39;mon it&#39;s cooper!...but not now. <BR> <BR>This would be a good candidate for a revision, methinks. <BR> <BR>bj <BR> <BR> <BR></font></font></font></font>
