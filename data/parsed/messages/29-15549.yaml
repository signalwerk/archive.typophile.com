    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">P.P.P.S &#40;and quite seriously&#41; I was in no way implying that you are ignorant, Joe. I refer instead to the collective &#34;we&#34; of American society. I leave it to oversea Typophiles to condemn of commend their own cultural experiences.  <BR> <BR>I hope my post was not misconstrued.</font></font></font></font>
