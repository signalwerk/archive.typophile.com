  - id: 32481
    user: 577
    date: 2003-10-05T17:27:00
    date_raw: Sunday, October 05, 2003 - 5:27 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I was totally confused by this thread until I went back and saw the title, which I had missed. So now I get the whole typo/pedo attempt at malapropian humor.  <BR> <BR>There actually is something funny about the this shirt - not about pedophilia, Joe, but about ignorance. As in, &#34;What the hell is a typophile? Isn&#39;t that someone who likes little kids?&#34; The fact that the suffix phile &#40;or the sound &#34;ophile&#34;&#41; most immediately elicits a correlation with the most depraved philia is more an indictment of our literacy as a culture than  an endoresment of NAMBLA. I think we all know many more people who enjoy a good book, their iPod, and a decent Merlot than the company of a young child, but how often are the terms biblio-, audio-, or enophile uttered in mainstream media &#40;or in conversation&#41;? <BR> <BR>On a seperate note involving humour involving lowercase letters, did anyone see the Saturday Night Live Weekend Update bit on Verne Troyer&#39;s &#40;Mini Me in Austin Powers&#41; drinking problem? They said he had checked into a lowercase &#34;a.a.&#34; group. Now THAT&#39;S funny. <BR> <BR> <BR>CCHS <BR> <BR> <BR>P.S. There is nothing funny about Alcoholism. <BR>P.P.S. There is nothing funny about little people either.</font></font></font></font>
  - id: 32483
    user: 577
    date: 2003-10-05T18:07:00
