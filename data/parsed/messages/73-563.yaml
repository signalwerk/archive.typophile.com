    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> I just purchased Fedra Sans. It is not cheap, but I am really happy with the font. It&#39;s clarity and character is unprecedented, it displays really well on screen and it is just lovely on paper. Highly recommend it. </font></font></font></font>
  - id: 3021
