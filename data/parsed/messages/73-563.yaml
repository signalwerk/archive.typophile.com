    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> I have been using Fedra since it came out in fall 2001. I love it, but do not care for the open letters such as the P, for all jobs as it is just a bit to stylish for the times you want the type to not stand out. I spoke to Peter Bilak about this and was told there is a mono-version in the works which has these closed. I needed a screen version for a couple of sites and managed to get the beta version of Fedra Screen which is really nice. Peter is working on it still and will be releasing it later this year i believe. </font></font></font></font>
