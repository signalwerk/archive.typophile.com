    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey, I&#39;ve only had two pics here, and this new one was kind of a social commentary. Or something. Anyway, I&#39;m highly unphotogenic &#40;or just plain ugly&#41; so a good photo comes around like every 12 years. Hey wait, that means I&#39;m overdue! <BR> <BR>hhp <BR></font></font></font></font></font></font>
  - id: 71571
    user: 1947
    date: 2004-08-14T07:14:00
    date_raw: Saturday, August 14, 2004 - 7:14 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I just stumbled across this thread.  <BR> <BR>Your comparisons and samples of halation look like they are computer generated. This is of no use whatsoever. The optics of halation are quite a complex phenomenon. The only way to truely get an idea of what is going on is to make signs on the appropriate retro-reflective material and document what happens through a carefully controlled experiment. <BR> <BR>Different retro-reflective materials from different manufacturers &#40;ie Diamond Grade, Prismatic&#41; will create different halation issues. <BR> <BR>Another thing to keep in mind when dealing with these sorts of fonts is their acceptability to the general highway engineering community. One of the reasons Clearview looks the way it does was it was designed to solve problems of legibility and readability without scaring the very conservative highway engineers with a radical &#34;designed&#34; solution.</font></font></font></font></font>
  - id: 71953
