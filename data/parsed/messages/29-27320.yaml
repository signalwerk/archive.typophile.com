    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">We dont have a referece in a book, and we dont talk with James Montabano yet. We are building the letters on empiric tests at this first step, comparing the problems who occur in common used typefaces, here in chile we found Interstate on highways,and Frutiger on small signages and information in buses&#40;local transportation&#41;. In the internet we look at Clearview now,and we want to start to compare some of our proposals with the Clearview typeface. <BR> <BR>1.- Clearview, 2.-Optica <BR> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/27369.gif" alt=""> <BR> <BR>Hern�ndez &#43; Vergara</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
