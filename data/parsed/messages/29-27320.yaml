    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">It seems to me most signage type in Italy follow quite raw and simplicistic rules. <BR>I&#39;ve had no actual problem in reading it, but this does not meen it can&#39;t be improved. <BR> <BR>Does anyone of you &#40;from Italy&#41; know who designed most of the types we found in our cities &#40;and highways&#41;. I&#39;m sure there&#39;s more than two alphabets around, even considering the condensed ones.</font></font></font>
