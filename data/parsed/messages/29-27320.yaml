    user: 1250
    date: 2004-08-10T13:44:00
    date_raw: Tuesday, August 10, 2004 - 1:44 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Eventually I&#39;ll take a close look at Optica and give some feedback, but for the time being here&#39;s something I just rediscovered that might interest you - a glyph I drew about two years ago, intended for tiny sizes: <BR> <BR><img src="http://www.typophile.com/forums/messages/29/42573.gif" alt="mini_p"> <BR> <BR>Note: every feature is on purpose. <BR> <BR>hhp <BR></font></font></font></font></font></font></font></font></font>'
  - id: 71271
    user: 3829
    date: 2004-08-12T03:03:00
    date_raw: Thursday, August 12, 2004 - 3:03 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Very interesting the use of irregularity on a sans serif typeface to increase its legibility. I like this idea.  <BR>Do you have some bibliographic reference about this topic? <BR> <BR>The irregularity helps to transform letter in words. Letters work better together than isolated.  <BR>Maybe it is also a good idea for a sanserif typeface for text. <BR> <BR>Another question: which will be the colour of the letter and of the panel?  <BR>I printed the pdf and looked the paper from far &#40;I have sight handicap and I could be a good tester..&#41;. It works very well, but I fear that the eye of &#34;e&#34; and of &#34;a&#34; is a little bit small. <BR>In my opinion the capital &#34;E&#34; is too much condensed. </font></font></font></font></font></font></font></font>'
