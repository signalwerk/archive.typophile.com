  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi typophiles, this is our fist proyect as a team, in Chile. We start to think in how the  <BR>eye changes the perception of the forms in a typeface with far distance exposure, on highways.  <BR> <BR>Please help us with your feedback, thanks. <BR> <BR> <BR> <BR>OPTICA�, a typeface for highway signage. <BR> <BR> <BR>When a typeface for signage is designed, it starts to be draw with same forms with they need  <BR>to get&#40;printed&#41;. With Optica we try to make them as we need to read them well&#40;with different  <BR>emphasis,as the results required&#41;, far from caligraphic rules, near to our vision behaviour. <BR> <BR>We found inspiration on the Vernacular signage in transportation vehicles, who are very  <BR>common to read, every day, to get a upright italic initial structure of the characters. <BR> <BR>There are many interesting topics about legibility who we want to share and discuss at the beginning of the developing of this typeface, starting with the lowercase characters. <BR> <BR>We want to start showing you a pdf file with an specimen of the Lowercase characters in a first revision, we calle him step a &#40;positive contrast version&#41;. <BR> <BR><!--attachment: optica_carta-27321.pdf*mime_pdf.gif*application/pdf*26.9**optica+carta%2epdf --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align=left alt="application/pdf"><br><a href="http://www.typophile.com/forums/messages/29/optica_carta-27321.pdf" target="_blank"><b>optica carta.pdf</b></a> (26.9 k)</td></tr></table></center><!--/attachment--> <BR> <BR>The next is to show and explain the functional topics in the .gif image and showed below: <BR> <BR><img src="http://www.typophile.com/forums/messages/29/27322.gif" alt=""> <BR> <BR>1.-This is a comparision bettwen a phrase exposed to the effects of a phenomena called  <BR>&#34;blooming&#34; or &#34;halo-ing. Blooming occurs when a car&#39;s headlights shine directly on a sign on  <BR>which letters have been formed from highly reflective material. <BR> <BR>Our types have exagerations who keeps an inteligible structure under those effects,  <BR>increasing the internal forms of the letters. <BR> <BR>2.-this is a detail of the difference bettwen similar forms in the x weight top side of the  <BR>letters g and q, showing different internal forms, to make them more differet. <BR> <BR>3.- This is the most controvertial&#40;�?&#41; part of the font, the stucture of the vertical lines  <BR>are very similar to uprights italics, who increase the direction of the reading to the left, with some forms in the base line of teh x weights, like serifs, who helps tomake a union in the base line, and to make a heavy weigh &#40;like serifs&#41; who helps to keep the normal &#34;sans&#34; structure, with the 2 factors agaist the actual traditional sans serif and grotesk typefaces for highway reading; distance &#43; blooming. <BR> <BR> <BR>Hern�ndez &#43; Vergara</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
