    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">You could always reverse the N for that Russian anti-establishment perestroika protest look &#40;or whatever&#41;. <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> <BR> <BR>Paul</font></font></font></font>
