    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">thanks for your comments. john: i also thought stencil would be good but my client had stencil associations that couldn&#39;t be overcome.. paul: hm wasn&#39;t there a thread in here about logos and  bandnames with backwards letters or did i read that somewhere else? as you can see i&#39;ve switched to antique olive, UC and tried to use the words to form a platform... &#40;?&#41; <BR> <BR><img src="http://www.typophile.com/forums/messages/29/4693.gif" alt="ANA_crit2"> <BR> <BR>ps. gender-specific pronouns aren&#39;t unavoidable in english, but oh well maybe you&#39;ll grow out of it;&#41; &amp; don&#39;t hate me b/c i&#39;m a nuisance</font></font></font></font>'
