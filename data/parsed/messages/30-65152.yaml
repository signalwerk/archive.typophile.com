    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks for the info, guys. <BR> <BR>Does anyone who has used Gill Sans Small Caps have an opinion about them? <BR> <BR>Also, are the small caps part of Gill&#39;s original designs or are they one of the many later add ons?</font></font></font></font>
  - id: 93715
    user: 1520
    date: 2005-02-19T12:38:00
    date_raw: Saturday, February 19, 2005 - 12:38 pm
    votes: null
    html: <font class="dontLookLikeCrap">I have worked with the Monotype version which includes the SC and they are just fine. I always liked the GillSans Uppercase forms much better than the lowercase and have found that they work almost absurdly well in a job that combines Trajan and the Gill SC, which sounds weird at first, but matching these two somewhat overused fonts turned out right somehow. It&#39;s not perfect and I think there are more modern designs and fonts &#40;in the technical sense&#41; out there, that are more fun to work with, but it sure as heck is better than using fake SC.</font>
