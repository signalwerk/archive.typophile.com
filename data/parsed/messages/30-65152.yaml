  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi, this is my first time posting here. I&#39;m looking for a bit of Gills Sans expertise. <BR> <BR>I was recently hired by a company whose logo used fake Gill Sans caps &#40;&amp; ITC Garamond Italic with a 1pt stroke to make it bold, but that&#39;s another issue&#41;. The first thing I did was to redraw their logo with some proper small caps. Then last night I discovered that AgfaMonotype sells a Gill Sans Small Caps font. This leads me to 3 questions <BR> <BR>1. Whose version &#40;of the standard weights&#41; of Gill Sans is better, Linotype or Monotype? Or are they the same? <BR> <BR>2. Is Monotype&#39;s Gill Sans Small Caps any good? <BR> <BR>3. Whose version of Gill Sans comes with OSX?</font></font></font></font></font></font></font></font></font>
