  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> I have an ingrained dislike for this face. I  <BR> realise that someone probably spent ages making <BR> it and all the rest, and I see it popping up <BR> everywhere from newspapers to tv advertising &#40;this <BR> is in New Zealand&#41;. Too many times it  <BR> is used for typography assignments here at  <BR> design school. We got a little  <BR> curious in regards to its origin, but it is an  <BR> elusive little devil. I am wondering if anybody <BR> out there in the blue nowhere knows anything about <BR> it? </font></font></font></font></font>
