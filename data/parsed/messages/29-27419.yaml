    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><a href="http://www.veer.com" target="_blank">www.veer.com</a> is worth a look for quick and dirty. <BR>Awesome info at the library of congress american memory site: <BR><a href="http://memory.loc.gov/ammem/amtitle.html" target="_blank">http://memory.loc.gov/ammem/amtitle.html</a> <BR> <BR>Collections on advertising from late 1800&#39;s - early 1900&#39;s <BR>Also on women&#39;s culture and women&#39;s sufferage. Maybe something there. <BR> <BR>Randy</font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 49903
    user: allison9190-users
    date: 2004-02-27T23:24:00
    date_raw: Friday, February 27, 2004 - 11:24 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">thanks for the links. any thoughts on the composition? i&#39;m trying to get it in the standard sytle of the 50s &#40;headline, large image, supporting text on the bottom&#41;, but any other suggestions? also, how&#39;s the copy reading? </font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 49923
    user: 618
    date: 2004-02-28T10:19:00
    date_raw: Saturday, February 28, 2004 - 10:19 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Allison, <BR> <BR>The layout is looking fake retro. Immerse yourself in real retro advertising to get a sense of how the different tools and printing affected the layouts. The look is often not as clean as you have going. Simple yes, but clean no. Part of this is the fonts. Try the copy in futura bold, Draw it up how you want it. Print each piece, image, type etc. Scan them back in and hand composite in photoshop. Also, use real quotes! Here are links to layouts: <BR> <BR><a href="http://www.chickenhead.com/truth/" target="_blank">http://www.chickenhead.com/truth/</a> <BR><a href="http://www.pinballrebel.com/game/cola/ads/ads.htm" target="_blank">http://www.pinballrebel.com/game/cola/ads/ads.htm</a> <BR><a href="http://www.the-forum.com/advert/" target="_blank">http://www.the-forum.com/advert/</a> <BR> <BR>Above all, have fun. <BR>Randy.</font></font></font></font></font></font></font></font></font></font></font>'
  - id: 49924
    user: 2739
    date: 2004-02-28T10:21:00
    date_raw: Saturday, February 28, 2004 - 10:21 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><a href="http://fontdiner.com">Font Diner</a> not only has great fonts for you, he&#39;s got a &#34;Homemade Specialties&#34; section. You can find some real inspiration there. <BR> <BR>I think your ideas are pretty solid, but I think you&#39;ve got a long way to go in the posters&#39; designs. The font on the Kraft one is hard to read. Also, you have a really good opportunity to contrast the woman and the stove with type. Maybe separate the images with the type. <BR> <BR>The Kraft one: I would drop the hyphens and write &#34;mom who does everything&#34;. I also think the washer and dryer are too big. <BR> <BR>Overall, your concepts are strong, but the design isn&#39;t there yet. I would consider a thick sans serif for the body text instead of the display types you&#39;re using. For something like this I wouldn&#39;t feel bad recommending Helvetica. <BR> <BR>Have you thought about colors? These could look really nice with some washed out colors. <BR> <BR>Does anybody have tutorials or know a way to get faded colors and images, ala MisterRetro&#39;s machine wash filters?</font></font></font></font></font></font></font></font></font></font>'
  - id: 49930
    user: 1019
    date: 2004-02-28T12:10:00
    date_raw: Saturday, February 28, 2004 - 12:10 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Honestly, if chosing a modern product I&#39;d go Adbuster style with your ad and make a present-day looking ad - and use the copy &#40;the words&#41; to make your point, rather then depending on old fonts and image treatements to do your work.  <BR> <BR>But I found some old ads that might help you anyway. My only comment is that I don&#39;t think many were 4 colour - ads for the time frame your depicting. you migth want to change your product image to a duotone or change the era. <BR> <BR><a href="http://hans.presto.tripod.com/scan/teletype/28_01.html" target="_blank">http://hans.presto.tripod.com/scan/teletype/28_01.html</a> <BR> <BR><a href="http://www.vintagemartini.com/ephemera/catalogs/pages/85.html" target="_blank">http://www.vintagemartini.com/ephemera/catalogs/pages/85.html</a> <BR> <BR><a href="http://www.kodakgirl.com/kodakgirlsframe.htm" target="_blank">http://www.kodakgirl.com/kodakgirlsframe.htm</a> <BR> <BR><a href="http://www.jsimon.com/Fun/twisted5.html" target="_blank">http://www.jsimon.com/Fun/twisted5.html</a> <BR> <BR><a href="http://www.bitlounge.net/retrolounge/advertising.htm" target="_blank">http://www.bitlounge.net/retrolounge/advertising.htm</a> <BR> <BR>don&#39;t forget there&#39;s a ton of stuff to be said about playboy covers with respect to women and advertising, as well as perfume,&#40;chanel namely&#41; and tobacco ads, liquor and fashion. Women weren&#39;t always dressed as maids and moms showcasing products  - a lot targetted the glamourous woman inside too.  <BR> <BR> <BR> </font></font></font></font></font></font></font></font></font>
