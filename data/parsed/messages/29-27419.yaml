  - id: 50093
    user: 2739
    date: 2004-03-01T11:43:00
    date_raw: Monday, March 01, 2004 - 11:43 am
    votes: null
    html: '<font class="dontLookLikeCrap">Allison, I think your plan of attack needs a little tinkering. You&#39;re trying to portray women as professionals and housewives, but you&#39;re running into a problem, namely that you seem to want to use 50s style to reinforce the fact that women &#60;em&#62;weren&#39;t&#60;em&#62; professionals back then, and that advertising hasn&#39;t modernized its portrayal of women. I think you have some potential for tongue-in-cheek stuff here, starting with the first line. <BR> <BR>I might consider adjusting the first line to: Don&#39;t have all day to prepare the family dinner? <BR> <BR>Then the next one you might try: You need all the help you can get! &#40;exclamation points must be used with discretion, this is a rare case where I think it&#39;s ok&#41; <BR> <BR>&#34;Had a long day at work and now you have to cook? etc...&#40;the rest of this paragraph is nice&#41;&#34; <BR> <BR>&#34;Del Monte�Because a woman&#39;s job at home is never done.&#34; <BR> <BR>As the form goes, I think you&#39;re getting the feel. You&#39;ve got some good use of Didot, though digital Didot might print a little thin. I&#39;m not sure. I think your use of Helvetica makes it look authentic, though watch out, as Helvetica might be anachronistic &#40;designed in like 1959&#41;. <BR> <BR>That&#39;s a great image of the Del Monte can. I would love to see it turned 30 degrees clockwise an bigger &#40;huge?&#41; and overlapping the b/w image and green bar, as if it&#39;s falling out of the bag. Then you can wrap your text around it &#40;maybe&#41;. Watch your rag &#40;&#34;cook&#34; can come up&#41; and smart quotes &#40;&#34;day&#39;s&#41;. <BR> <BR>I&#39;m assuming the background color will be the paper color? Keep in mind that you won&#39;t have white anymore, as in the b/w image and the can. Something to think about. Try an off-white if you want the paper to not be blinding. <BR> <BR>This is a lot to absorb, and I can&#39;t even vouch for all of its significance, but I think this is getting good! Good luck.</font>'
