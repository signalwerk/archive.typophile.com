  votes: null
  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">hi. i&#39;m a student working on a poster series about women&#39;s roles as seen through advertising. although women have gained equality in the workplace since the 1950s, ads today are targeted towards women for &#34;traditional&#34; roles they still supposed to play. i&#39;ve included 2 initial concepts for this series, and i want to  show how not much has changed between now and 50 years ago, as far as gender-dictated roles in the household go. i&#39;m having some trouble finding images &#40;i will be photographing the actual products&#41;. does anyone know where to find good images? also any suggestions for composition...how to integrate the type better? how can i make these stronger? <BR> <BR><img src="http://www.typophile.com/forums/messages/29/27420.gif" alt="poster1 gif"> <BR> <BR><!--attachment: kraft-27421.unk*attachment_icon.gif*application/x-macbinary*1393.7*poster1*kraft --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/attachment_icon.gif" align=left alt="application/x-macbinary">poster1<br><a href="http://www.typophile.com/forums/messages/29/kraft-27421.unk" target="_blank"><b>kraft</b></a> (1393.7 k)</td></tr></table></center><!--/attachment--> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/27422.gif" alt="poster2 gif"> <BR> <BR><!--attachment: gain-27423.unk*attachment_icon.gif*application/x-macbinary*821.9*poster2*gain --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/attachment_icon.gif" align=left alt="application/x-macbinary">poster2<br><a href="http://www.typophile.com/forums/messages/29/gain-27423.unk" target="_blank"><b>gain</b></a> (821.9 k)</td></tr></table></center><!--/attachment--></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
