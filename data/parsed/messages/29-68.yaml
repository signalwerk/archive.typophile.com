    html: "I think it&#39;s pretty cool: classical but <BR>not at all boring. And the caps are <BR>tamed in size, which is nice. <BR> <BR>Some things: <BR>1. The lc &#34;k&#34; bugs me a little. <BR>   You might consider staggering the arms. <BR>2. The bottom-right serif on <BR>   the UC &#34;N&#34; looks strange. <BR>3. Give the UC &#34;Q&#34; a braver tail: <BR>   letter combinations like &#34;Qj&#34; <BR>   are really very rare. <BR>4. I&#39;m not sure but I think the <BR>   spacing should be tighter. <BR> <BR>Great stuff, keep it up! <BR> <BR>-Hrant"
