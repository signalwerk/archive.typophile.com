would be to promote social change. Minorities are often depicted in an unfavorable way, this is due to the fact that minorities have not taken a true interest in promoting a good self-image. Often the image displayed are from people who have no idea what it means to be a minority. This depiction become our an unwanted representation of who we are. example: I find it desturbing to see minorities in movies cast as &#34;maintenance workers&#34; or &#34;waiters&#34; things like that. I would also like to be able to help design better products for companies who export their goods to the USA. I belive better design promotes economic growth. This is my goal.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
