    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Currently a little of both. I work full time <BR>&#40;Not a great job&#41; and do as much freelance as I can. Profit or non-profit. It doesn&#39;t matter to me just as long as I am doing what I love....Thinking and designing. If I don&#39;t have projects to do, I make them up. There are many people out there who will can benefit from good design. If they can&#39;t find you, GO FIND THEM. Practice effeciency. It&#39;s better to make any  decision &#40;good or bad&#41; than no decision. Go out and find something that looks like s&#42;&#42;t and redesign it. Why not! If you don&#39;t finish, so what! At least you are keeping your mind active and alive. <BR> <BR> <BR>When it comes to your identity here is a trick. <BR> <BR>Think of it as though you are designing an identity for someone you met who is exactly like you. Sounds strange but hopefully it might help you look at it from a different angle. It did for me.</font></font>