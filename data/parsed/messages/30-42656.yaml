 I&#39;m old school. I like to design my font by sketching them out. then make a tight drawing and finally scanning them into illustrator. I don&#39;t have fontographer or fontlab yet. <BR> <BR>IM</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
