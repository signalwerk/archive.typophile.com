    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Paul, <BR>Yes, it is amazing the difference it makes when daily survival is not an issue. <BR> <BR>Hrant, <BR>If getting shot at was a high point of your childhood, what was a lowpoint? :-&#41;</font></font></font></font>
  - id: 71874
    user: 1250
    date: 2004-08-16T22:31:00
    date_raw: Monday, August 16, 2004 - 10:31 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; what was a lowpoint? <BR> <BR>Losing electricity halfway into writing a program on my C64? I guess not. Worse still was when the fighting was so bad around our building that we&#39;d have to go down to the bomb shelter. Usually I could convince my parents that we were essentially safe in this central room in our 6th floor apartment&#42;, but I remember the time my mother went to the kitchen to get some hot water for tea, and the light from the candle she was holding attracted an RPG straight into the laundry room next to the kitchen. We all ran to her, she was OK, but then a second one hit the division between our floor and the lower floor - basically half a meter higher and we would of all been toast. We were all deaf for a few minutes. Then my father glared at me and said &#34;We&#39;re going down to the shelter now&#34;... But that was just a bit frightening, not a &#34;lowpoint&#34;. The major lowpoint was when a close uncle got assasinated. His son recently wrote a great book, though - I highly recommend it: <BR><a href="http://images-eu.amazon.com/images/P/0743222830.01.LZZZZZZZ.jpg" target="_blank">http://images-eu.amazon.com/images/P/0743222830.01.LZZZZZZZ.jpg</a> <BR> <BR>&#42; Some of my best work painting D&amp;D miniatures was done by candle-light in that room, with Kalashnikovs and mortars raging in the neighborhood, with the beautiful, primordial prayers from the mosques blasting to encourage the fighters. <BR> <BR>My theory is that you miss <i>anything</i> that happened during your childhood. And if your childhood was messed up, that simply results in you having a messed up sense of what&#39;s healthy. <BR> <BR>hhp <BR></font></font></font>'
