work.  <BR>Question: what do you do when you have creative block or are depressed? <BR> <BR>IM</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 71216
    user: 3135
    date: 2004-08-11T14:53:00
    date_raw: Wednesday, August 11, 2004 - 2:53 pm
    votes: 20
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I have designed many business cards and logos for myself over the past 40 or so years.  I have never had any of them printed.  I look at them a few weeks later and say, &#34;I can do better.&#34;  What you have to realize is that you grow as a person and a designer every day so you will never design something good enough for the you who will see it a few months from now.  There is a place where you have to say, &#34;This will work for today.&#34; and just accept your human failings as they are.  You cannot ever be perfect but you can be satisfied to know you tried your best in the amount of time you had.  Remember, a business card, above all, is just a place to put your name and phone number, not your soul.  Take the pressure off of yourself.   <BR>Take 4 hours only and design a card. Print it on a Laser printer, that way it does not seem so precious or so permanent. If in 6 months, you can&#39;t stand it, do another 4 hour maximim card and go about your life. <BR> <BR>My family came here to the US from Greece.  We are such a small minority that nobody even knows we exist. I have worked sweeping floors in a resturant, as a laborer in a steel mill, and as a laborer in a construction job.  It was hard, dirty, tiring work but it was honest work and nothing to be ashamed of.  I worked my way through college and now work in an office as a designer but I am the same person I was in the steel mill scraping slag with a pick and shovel. <BR> <BR>Don&#39;t worry what biggotted fools may think of your herritage.  You know better.  Be proud of who you are inside right now, today. Don&#39;t measure your success as a human being by the size of your bank account--certainly not by the comments of fools.   <BR>The way you talk about your dreams to make the world a better place tells me you have the soul of a great man. The best thing you can do in this world is help others and love your family. You can do that as a designer as well as anything else. <BR> <BR>Best of good luck to you, <BR> <BR>ChrisL</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
