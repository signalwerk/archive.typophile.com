  - id: 71381
    user: 3553
    date: 2004-08-12T18:24:00
    date_raw: Thursday, August 12, 2004 - 6:24 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">� Between the hands &amp; the memory there is a tight link. <BR>The script is the script of the memory, <BR>because the memory is the fruit of whatever other thoughts, <BR>no matter if moral or philosophic: <BR>it is the remembrance of the antique, the wish of love, <BR>the hark back of the past, the design of a moral world, <BR>and at the same time it is everyday life. <BR>Writing allows to multiply feelings, images, <BR>fantasies, wishes, fuss and desires, discoveries, <BR>acceptation of the different, of the other. <BR>There is no memory without attention, <BR>and the memory is the general guard of the habits. <BR>And a poet is always a man who dreams. � <BR> <BR>Giacomo Jeopardy, 1798-1837.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 71383
    user: 3135
    date: 2004-08-12T18:33:00
    date_raw: Thursday, August 12, 2004 - 6:33 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#34;Che gelida manina&#34; <BR>Giacomo Puccini</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 71391
    user: 1530
    date: 2004-08-12T19:55:00
    date_raw: Thursday, August 12, 2004 - 7:55 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I tend to doubt about myself when facing a challenging project. I start to digress between design books and magazines, look at some top design studios portfolios and to repeat my ideas over and over again in sketches. I get obsessive about details and then wonder if anyone will ever nottice them. <BR> <BR>I know that if I were more self confident I could have much better ideas and feel satisfied by my work. But I could go forever with a design project and never feel satisfied with it so then I complete the work when I realize the deadline is getting close. Ego is so compromised in design. <BR> <BR>I liked both Oglivy�s and Luke�s phrases.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 71392
    user: 3089
    date: 2004-08-12T20:12:00
    date_raw: Thursday, August 12, 2004 - 8:12 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Mr. Alessandro Segalini: <BR> <BR><i> &#62; would you dare to say that God is not perfect?</i> <BR> <BR>Perfect in the sense that the distinction between perfection and imperfection is ultimately meaningless, which is not the sense I was employing. Of course before there were yin and yang there was the undifferentiated tao, and ji pervades all. <BR> <BR>On the subject of whether God is perfect, consider this passage from the NY Times, which suggests that we may in fact be inhabiting a universe of one of the lesser gods &#40;sorry to sidetrack the conversation, but this is too remarkable a quote to pass up&#41;. The context is a campaign appearance by Bush in Florida: <BR> <BR><i>In Niceville, Mr. Bush&#39;s appearance took on the air of a revival meeting as the audience chanted affirmation to his description of the rationale for his antiterror efforts and roared at any religious reference. Gary Walby, a resident of nearby Destin, told the president during a question-and-answer session that though he always voted Republican, &#34;this is the very first time I felt God was in the White House.&#34;</i> <BR> <BR>&#40;But don&#39;t get depressed. Really.&#41;</font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 71395
    user: 3861
    date: 2004-08-12T20:37:00
    date_raw: Thursday, August 12, 2004 - 8:37 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Depression was always a great inspiration for me. I might add many others, Mozart for example. Happy people are a friggin bore. Don&#39;t allow depression to get in your way. <BR> <BR>Go kick butt. <BR> <BR></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 71637
    user: 1316
    date: 2004-08-15T08:05:00
    date_raw: Sunday, August 15, 2004 - 8:05 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Uh, uh, depression is such an ambigue word. Step out of &#34;psychoanalitic&#34; language and in general you&#39;ll see it&#39;s a signal of needed internal growth. <BR> <BR>I don&#39;t want to sound superficial: almost all the few typefaces I have on sale &#40;except the initial Ottomat, in part, and the latter Ogilve&#41; were designed in a constant state of disgust and continuous doubt. As I was working of them &#40;and in many moments I gave up&#41; they seemed just worthless and ugly. <BR>Only after regaining balance I became able to look at them objectively, and see what was good in them. <BR> <BR>My only advice &#40;which is probably the best I always received from many people&#41; is to finish each thing you start, no matter how ugly or senseless it may seem. <BR>It&#39;s not easy &#40;I&#39;m rarely able to do so myself&#41; but it&#39;s the only way to reacquire a critical perspective.</font></font></font></font></font></font></font></font></font></font></font>'
  - id: 71704
    user: kris-users
    date: 2004-08-15T17:58:00
    date_raw: Sunday, August 15, 2004 - 5:58 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;&#62;I get obsessive about details and then wonder if anyone will ever nottice them.  <BR> <BR>Yep. <BR> <BR>&#62;&#62;almost all the few typefaces I have on sale &#40;except the initial Ottomat, in part, and the latter Ogilve&#41; were designed in a constant state of disgust and continuous doubt. <BR> <BR>Agreed. <BR> <BR>I am in an interesting place. People come in wanting &#34;business cards printed&#34;. Totally unaware of design. I could just slap something up, shudder and print it. But it is much more exciting trying to explain in 5 mins or less what I can do that is much better. It might cost a little more, but the business card will be better for it. I feel like this is the front line, as it were. Sometimes I get waverings of depression thinking &#34;Garrgh, no-one cares!&#34; but choose to ignore it and get stuck in. I like the challenge of severe time restraints now, quoting and charging accurately are very interesting. I was also afraid that my type desiging time will get eaten into, but have decided to do some of my proofs on small signage jobs! Pretty cheeky, but I reckon it will be effective. </font></font></font></font></font></font></font></font></font></font>
  - id: 71710
    user: 3135
    date: 2004-08-15T19:17:00
    date_raw: Sunday, August 15, 2004 - 7:17 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; I was also afraid that my type desiging time will get eaten into, &#60; <BR> <BR>We all have to eat &#40;food as well as time&#41;. You will find ways to do the things that are important to you. Those will be the precious moments that brighten your day. <BR> <BR>ChrisL</font></font></font></font></font></font></font></font></font>
  - id: 71742
    user: 4424
    date: 2004-08-16T05:28:00
    date_raw: Monday, August 16, 2004 - 5:28 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey everyone, thank you so much for you insight. It has been helping me quite a bit. Now if you can give your insoght on a personal desigh project, it would be greatly appreciated. I am currently designing a buiseness card for myself. It includes simple yet elegant type letterpressed on 100 percent cotton card stock. Now the design element I want to incorporate is the use of custom made rubber stamps of some of my &#34;type&#34; specimens and artwork. Since I will make several rubber stamps I&#39;ll have a few unique cards I can distribute to clients. I feel this will give the design a feeling of individuality and imagination. And if I ever get tired of a specific image I can just have new rubbrestamps made. What do you think?</font></font></font></font></font></font></font></font>
  - id: 71832
    user: 3264
    date: 2004-08-16T14:31:00
    date_raw: Monday, August 16, 2004 - 2:31 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Ivan -- some words of advice from an abuelo who has been involved in every way to get ink and color on paper for 55 years. My late colleague and fellow member of the National Cartoonists Society, Charles Schulz, suffered from severe depression despite the fact that he made the Forbes list of the richest people in the world. Clinical depression is a medical condition that should be treated.  Occasional depression is something else. Perhaps we take ourselves too seriously at times and that we should find ways to lighten up. I&#39;m sure Mr. Lozos, who was in Vietnam would agree, that there are so many more opportunities to enjoy life when one isn&#39;t being shot at. Even then, things could always be worse, no matter the present situation. Descartes, a brilliant mind of the enlightened 17th century, said: I think,  therefore I am. It may sound trite to you but it works. I hope this helps. Good luck. <BR>PG <BR><a href="http://giam.typepad.com/the_branding_of_polaroid_/" target="_blank">http://giam.typepad.com/the_branding_of_polaroid_/</a></font></font></font></font></font></font></font>'
