    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">-Being of hispanic heritage my dream would be to promote social change <BR> <BR>Ivan, you got something in common with many other hispanic and latin american people...an Amazing Culture!!!!!!! <BR> <BR>Please be cool, and discover and learn to love hispanic revolutionary posters, cuban music, precolumbian amazing design heritage &#40;thousands of years&#41;, latin food, mexican music, bossanova, vernacular signpaint, etc, etc.. hispanic Graphic designers have a rich heritage, pre and post columbian, in my point of view, this richness is almost undiscovered as visual language. <BR> <BR>You will find an incredible amount of motivation if you put all your love and passion in your day by day work, please dont forget to show us your business cards here, in typophile, of course ; &#41; <BR> <BR>-Question: what do you do when you have creative block or are depressed? <BR> <BR>In my personal experience, i discover a passion in typography during a depresion in my first time in college, related to a non motivated state. <BR>Typography, typedesign and graphic design, for me, are a therapy. Typophile is a great place, thanks for been a such a wonderful community. <BR> <BR>Un abrazo Hermano, <BR> <BR>mh</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
