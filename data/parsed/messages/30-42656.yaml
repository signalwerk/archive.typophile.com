    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap">amazing story, Hrant. <BR> <BR>And regarding the topic of this post, I heard this saying the other day and it applies so nice in here: &#34; lo mejor es enemigo de lo bueno&#34; &#40; The Best is the Good�s enemy&#41;. let�s do it, let�s have fun with it and if it doesn�t come up perfect, let�s try again next time. </font></font>'
