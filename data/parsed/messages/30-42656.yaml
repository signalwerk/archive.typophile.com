ass="dontLookLikeCrap">hello everyone, this is my first time in the forum and I love it! so much helpful info. <BR>I guess i thought of this topic because I myself am depressed. this is primarily due to he fact that I have not been able to design my own buisness card &#40;never truly happy with my results&#41;. I also find myself to be extremely self critical of my own work. This inturn makes it hard to start design projects. I&#39;m pretty sure this is common among other designers. maybe some feedback on this matter will help me as well as other designers. <BR> <BR>IM</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
