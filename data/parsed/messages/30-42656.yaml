    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Mr. Tom Christensen, grazie, writing that &#34;nothing is perfect&#34; <BR>you made me think that the problem is not if there&#39;s or not <BR>something perfect -- in typographic design as well as under <BR>other human perspectives &amp; relations. <BR>This link is interesting <a href="http://seeing.nypl.org/" target="_blank">http://seeing.nypl.org/</a> <BR>but would you dare to say that God is not perfect? <BR>It is also interesting to note that the actual Greek root <BR>of the word &#39;problem,&#39; namely, &#39;probalein,&#39; means &#39;to throw&#39; <BR>or &#39;to thrust forward.&#39;  <BR>Problems are the very means by which God drives us forward. <BR>Without problems, there would be no growth. <BR>So, the problem is not if something is &#34;not perfect:&#34; <BR>I&#39;d advice to try hard to seek for where and when to act. <BR>I&#39;m saying that if you love a flower which is upon a star <BR>then the night is gonna be sweet, looking at the sky. <BR>AS <BR><img src="http://www.typophile.com/forums/messages/30/42688.jpg" alt=""></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
