k">http://www.feldmangallery.com/media/brodsky/broexh_99/bed-01.jpg</a> <BR>Check also the typewriter: <BR><a href="http://www.feldmangallery.com/media/brodsky/broexh_99/typewriter-01.jpg" target="_blank">http://www.feldmangallery.com/media/brodsky/broexh_99/typewriter-01.jpg</a> <BR>AS</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
