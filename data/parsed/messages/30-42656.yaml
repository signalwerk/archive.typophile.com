  - id: 71284
    user: 3472
    date: 2004-08-12T06:24:00
    date_raw: Thursday, August 12, 2004 - 6:24 am
    votes: 5
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I myself have gone through a major depression due to my obssesive nature about design,typography and life. So much so, that all sense of rationale and logic was lost in my wee little brain. I was forced, by my own mind, to stop designing all together&#40;and go fishing <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> &#41;. Once I did that, the design bug came back to bite me in the <font color="ff0000">&#149;</font><font color="ff0000">&#149;</font><font color="ff0000">&#149;</font> a year later. I learned a great deal about myself when I was depressed. The main thing I realized is that I am sad some days and happy others. As I have gotten  a little older I have learned to embrace the depression. I feel sad when I am sad. I feel happy when I am happy. Don&#39;t suppress your feelings. Breathing &#40;and Design&#41; ultimatey will make you feel alive. Alive doesn&#39;t have to be happy or sad it can be both....Enjoy both. This is just my personal expierience. Everyone is different, but judging from this thread, alot of us are the same. Let pain and joy guide you simultaniously.  All the best <BR> <BR>DG</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
