    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Julio, <BR> <BR>I hate to barge in at this late hour, but this logo has great potential and I see some issues. The main problem is in the balance of the letters. Right now the i is stable, the n is stable &#40;the curves look wobbly but it&#39;s hard to tell&#41;, the d is falling to the left, the e is falling to the left the a is relatively stable. <BR> <BR>In my opinion it doesn&#39;t have to do with the location of the corners, but rather an instability in your master glyph shape from which all the others are derived. If you balance that shape, then your letters will be balanced. The following illustration highlights what I&#39;m talking about. <BR><img src="http://www.typophile.com/forums/messages/29/36662.gif" alt=""> <BR>Very nice work! <BR>Randy</font></font>
