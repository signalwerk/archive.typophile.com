  - id: 81593
    user: 1250
    date: 2004-11-05T17:44:00
    date_raw: Friday, November 05, 2004 - 5:44 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">There&#39;s something in that article of Bringhurst&#39;s that I&#39;d like to ask him about. I remember once running into his email address, but apparently have failed to keep it handy. Anybody out there who can give it to me? If privacy protocol dictates please first ask him if that&#39;s OK. <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 82147
    user: 1085
    date: 2004-11-10T08:26:00
    date_raw: Wednesday, November 10, 2004 - 8:26 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hrant, I got your article in the mail today� that was super-fast. Thank you. Looking through the article, two things jumped out at me, which hadn&#39;t been at the fore of my thoughts in a while. <BR> <BR>The first is that Baskerville Italic is just beautiful. I mean fantastic, wow� I don&#39;t know how I could just forget things like that� <BR> <BR>The second was Bringhurst&#39;s idea about neoclassical type design, and its place as the &#34;missing link&#34; between Baroque type and Modern faces &#40;which he calls Romantic&#41;. I was familiar with this from <i>Elements�</i> already, but I&#39;m glad to have something that expresses his ideas deeper.  <BR> <BR>Part of what I find so interesting about these faces is that they seem to have a dillemma between the hand and the mind. They are conscious, thought out designs &#40;so were older faces�&#41;, but it seems that 18th Century designers wanted you to KNOW that they were thinking about form, and that they weren&#39;t going to make forms just by using the easiest methods� i.e., the way that the humanists did when they cut forms that were inspired directly by handwriting styles. <BR> <BR>Of course, Didot and Bodoni take this even further, and create type that is more about style and interpretation more than anything esle. Their work is brilliant, but I can&#39;t identify with it personally. It feels so remote, cold, technical, or even mathematical. Even though it isn&#39;t. <BR> <BR>Ahh, back to RdR� I&#39;m going to work on the the slanted roman first, curved v&#39;s and everything. I&#39;ll post something in the critique forum by the end of the year.</font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 82283
    user: 1250
    date: 2004-11-10T18:28:00
    date_raw: Wednesday, November 10, 2004 - 6:28 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Baskerville italic: Yes, it&#39;s quite nice, especially in the lc. But I think the distribution of swashiness in the UC is a bit hare-brained. <BR> <BR>Transitional &#40;Neoclassical&#41; versus Modern &#40;Romantic&#41;: I much prefer the former; I would say the latter is too much of a good thing. And the duality you mention in the Neoclassical genre is an astute observation; it&#39;s something that I&#39;m trying to resolve well in my revival, by balancing lachrymal and pointy terminals, soft and hard transitions, etc. <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font></font>'
  - id: 82298
    user: 1262
    date: 2004-11-10T22:15:00
    date_raw: Wednesday, November 10, 2004 - 10:15 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think the identification of neoclassical type design as the stage between baroque and romantic is fairly obvious, both in terms of the chronology of Baskerville&#39;s work and its relationship to contemporary art, music, architecture, etc. It is precisely the ability to put type design in the broader cultural context that makes this art-historical terminology so much preferable than the specialised terminology of &#39;transitional&#39; and &#39;modern&#39;, which are meaningless in any broader context. <BR> <BR>Robert&#39;s real piece of brilliance in this area is, I think, the identification of <i>rococo</i> type design: the final flourishing of baroque before the restraining order of the neoclassical. This has contributed to a new interest in the work of Rosart and Fleischmann, which is very welcome.</font></font></font></font></font></font></font></font></font></font>'
  - id: 82323
    user: 1085
    date: 2004-11-11T04:33:00
    date_raw: Thursday, November 11, 2004 - 4:33 am
