  - id: 82365
    user: 1262
    date: 2004-11-11T09:14:00
    date_raw: Thursday, November 11, 2004 - 9:14 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The RdR marks the beginning of neoclassical type design. Although aspects of the style of the type belong to the baroque, the rationalist circumstances of its design make it part of the neoclassicist project. One could take the view that the work of the committee was neoclassicist, and Grandjean&#39;s interpretation of that work was more baroque.</font></font></font></font></font></font></font></font>
