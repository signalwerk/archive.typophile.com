  date: 2004-11-04T22:09:00
  date_raw: Thursday, November 04, 2004 - 10:09 pm
  votes: null
  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">It seems Typophile threads have the attention span of Linotype slugs, so Dan&#39;s RdR thread has to be reincarnated yet again... <BR> <BR>From: <BR><a href="http://www.typophile.com/forums/messages/30/51336.html" target="_blank">http://www.typophile.com/forums/messages/30/51336.html</a> <BR> <BR>Dan, in doing some research on Baskerville, I found an article by Bringhurst about Neoclassical types in an issue of Serif, and in it he&#39;s brought together many useful aspects of the RdR&#39;s development; for example he mentions the provenance of the various italics. If you&#39;d like a copy &#40;although some parts of <i>my</i> copy are actually hard to read&#41; just give me your ground address. <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
