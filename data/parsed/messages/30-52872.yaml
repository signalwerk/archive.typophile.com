  - id: 84245
    user: 1085
    date: 2004-11-29T06:21:00
    date_raw: Monday, November 29, 2004 - 6:21 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hrant, I think I found another book for you to look at. This is a sweet little small edition, I think. It is called <i>Von der Romain du Roi zu den Schriften J.G. Justus Erich Walbaums: Eine Schriftstudie</i>, which means--&#34;from RdR to the typefaces of J.G. Justus Erich Walbaum; a study.&#34; It was written by Gustav Bohadti, and published by H. Berthold AG in Berlin and Stuttgart, 1957. <BR> <BR>It has a print of RdR paired with Granjean&#39;s true italic, from 1702. And then the same text is printed again with RdR and Alexandre&#39;s true italic, from 1712. <BR> <BR>Then come copies of specimen pages from Fournier, Didot, and Bodoni. Here&#39;s the cool part: it has one print comparing text set in RdR with Fournier, Didot, and Bodoni texts. <BR> <BR>And there is also a lot of text about Walbaum and H. Berthold AG, but that isn&#39;t as relevant to the forematter about RdR.</font></font></font></font></font></font>'
