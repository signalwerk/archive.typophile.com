    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">OK Mitchell, out of the latest two versions I  <BR>like the &#34;B&#34; from the first one and the &#34;L&#34; from  <BR>the second. I know I am totally flipping my  <BR>preferences but that is just how it is. Does that  <BR>combination work?  <BR> <BR>I like the slope of the first one better as well.  <BR> <BR>Concerning the stokes that surround the  <BR>letters I think it is looking better, but now they  <BR>might be too heavy. I say cheat them and  <BR>make them technically lighter than the second  <BR>try but appear appear that they may be the  <BR>same width as the letters. I am sure that  <BR>I like the strokes on the second one better when  <BR>they do not wrap as much. It is getting there in  <BR>my opinion but it still needs some clean up on <BR>those curvy arm things.  <BR> <BR> I wish someone else would share their opinion. <BR> <BR>I am a little worried about the top of the &#34;L&#34;  <BR>disappearing at smaller sizes. You will have to  <BR>determine that. It is too hard to tell on screen.  <BR> <BR>-smc <BR></font></font></font></font>
