  - id: 16137
    user: 618
    date: 2003-04-02T06:37:00
    date_raw: Wednesday, April 02, 2003 - 6:37 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Mitchell, <BR> <BR>I think you&#39;re off to a lovely start with the mark and agree it would look excellent embossed. I&#39;d like to speak to the text for a minute. I think there are a three issues to consider: <BR> <BR>1&#41; I thing you&#39;ve got too many styles working in one logo. There&#39;s the script mark, the serif name, and sans photography. I think you would do well to limit the design in this regard.  <BR> <BR>2&#41; Given that your mark is really calligraphic with diagonal stress and large variance in stroke weight, It probably makes sense to choose a serif type with similar properties. One that comes to mind that would keep the feel of what you&#39;ve got going is Poetica small caps &#40;I wouldn&#39;t use any of the swashes, keep it simple and let your mark do the talking&#41;. As an alternative, maybe try a script. While I can see the why Hrant would point you towards Isadora, in this case I think its the wrong choice. I&#39;d first try a spencerian script. <BR> <BR>3&#41; I think the current arrangement of mark and logotype are out of proportion/position. In a mark-on-left arrangement, I&#39;d reduce it&#39;s size by at least 70%. Also try a centered arrangement. <BR> <BR>On a side note, two fashion faces that come to mind that are at least as prolific as helvetica... Optima and Didot, neither of which would work with your mark. &#40;So helpful!&#41; <BR> <BR>BTW, I don&#39;t mind the heavier circle/O. <BR> <BR>Good Luck, <BR>Randy <BR></font></font></font></font>'
