    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Nice work. <BR> <BR>I am fond of the &#34;L&#34; in version one, and the &#34;B&#34;  <BR>in two. <BR> <BR>The main thing I see is that the modulation  <BR>in the strokes that encircle the letters should  <BR>be varied.  <BR> <BR>For instance the &#34;L&#34;, in one, should not stop  <BR>but should continue on till the end of the top of  <BR>the &#34;B&#34; where the stroke is the thinnest. <BR> <BR>The same thing is true with the swash of the  <BR>&#34;B&#34; it should be thickest toward the middle. <BR> <BR>I am also wondering if the color of the symbol  <BR>could better match the color of the type. They  <BR>seem a little disconnected to me. <BR> <BR>I think it is quite nice despite my  critique. <BR> <BR>-smc</font></font></font></font>
  - id: 15978
