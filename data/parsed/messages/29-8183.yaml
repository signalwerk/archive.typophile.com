    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Ohhhh. Nice. <BR> <BR>I can see what you mean about such a thin vertical for the B. It was meant serve dually as double line vertical for both the B and L. Like the ones in <a href="http://www.myfonts.com/fonts/linotype/itc-isadora/regular/testdrive.html?s=like%20so%2C%20JFP&amp;p=48">Isadora</a>, but I guess it&#39;s not pulling that off. <BR> <BR>Though, I had think I was in agreement with Tiffany&#39;s <a href="http://www.typophile.com/forums/messages/29/8183.html?1049989070#POST16190"> suggestion</a> about having a single vertical serving for both the B and L. Which I have a recent version of. <BR> <BR>Thank you all very much for the help so far. I&#39;ve not been around as I am swamped and had pretty much ran out of &#40;paid&#41; time for this logo and needed to finish it up. Of course, Jean has me inspired all over again. Maybe I can sneak some more stuff in before we have to call it final. <BR> <BR>I&#39;m also doing Brian&#39;s collateral and website. I&#39;ll keep you all posted. <BR> <BR>Mitchell</font></font></font></font>
