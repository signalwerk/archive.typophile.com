    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Great work Mitchell. <BR> <BR>I am putting out a strong vote for 4.2A. This  <BR>is clearly my favorite.  It has the strongest  <BR>negative vs. positive relationship. I also think <BR>it will look better at small sizes than the others.  <BR>That  top of the &#34;L&#34; has really been cleaned  <BR>up. Now, I would account for a bit of  ink  <BR>trapping there to avoid plugging it up when  <BR>printing it. <BR> <BR> As for earlier comments concerning &#39; the  <BR>unintentional letter &#34;O&#34; ...that detracts  <BR>attention from what should be the focus&#39; ,  <BR>I would argue, particularly with the latest  <BR>changes you have made, that this is not true.  <BR>In reality the shape is a clear continuation of  <BR>the letter forms. In fact, I believe that it is the  <BR>thinner lines are guilty of distracting from the  <BR>letters. In this case they are really something  <BR>other than parts of the letter forms. They  <BR>are disconnected. <BR> <BR>Hey, Mitchell that is a great link by the way. Thanks. <BR> <BR>-smc <BR> <BR> <BR></font></font></font></font>
