  - id: 16009
    user: 1047
    date: 2003-03-31T17:32:00
    date_raw: Monday, March 31, 2003 - 5:32 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">sean, thanks. I think I&#39;m with you about the &#34;L&#34; in 1 and the &#34;B&#34; in 2. I&#39;m going to look into working that in to version 1. <BR> <BR>Also the modulation you suggested was what I naturally went for at first but I thought that it was detracting from the mark, but that was on much earlier and rougher versions, and I&#39;ve been thinking I&#39;d look into it again. I realize that currently it&#39;s not how it would work if the pen was held at a cosistent angle troughout. <BR> <BR>As for the color of the mark I&#39;m quite sure that I don&#39;t want to go any heavier with the face used for the name, so I&#39;d have to lighten the mark. Is this what you mean? <BR> <BR>Hrant, good call on Isadora, it was the face I looked at most when coming up with this. I have tried it for &#34;photography&#34; but the client is really not into it. He feels it is just what you would expect. I think it goes well with the mark but am with him on not using it &#40;or any other scripts&#41;. Especially since the bold weight of Isadora seems the best match and is overpowering to the name. But if anyone feels that the helvetica is quite an eyesore in this please speak up. <BR> <BR>Thanks for the critique. I&#39;d love to hear more from anyone. <BR> <BR>mitchell</font></font></font></font>
