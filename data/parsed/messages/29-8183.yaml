  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This is for a photographer just getting started out on his own name. He is primarily focusing as a wedding photographer. He wants something classy &#40;obviously&#41;, and since he is going for high-dollar clients he wants something exclusive feeling and fashion-like. <BR> <BR>version 1 <BR><img src="http://www.typophile.com/forums/messages/29/8184.gif" alt="v1"> <BR> <BR> <BR>version 2 <BR><img src="http://www.typophile.com/forums/messages/29/8185.gif" alt="v2"> <BR> <BR>He&#39;s really liking what I have so far but since I&#39;ve very little experience with calligraphy I am mainly concerned with how well the monogram is working. I have two versions and am aware of their need for polish on the curves, but how are the base forms and is stroke variance as it should be? <BR> <BR>Of course, I&#39;d love to see any comments on the type as well. I&#39;m using Candida for the name, and Helvetica Neue 33 for �photography� Yep, over-used as it is I&#39;m afraid I don&#39;t know of too many other faces that portray fashion to me. Suggestions very welcome. Brutality also welcome. <BR> <BR>mitchell</font></font></font></font>
comments:
  - id: 15977
    user: 596
    date: 2003-03-31T13:06:00
