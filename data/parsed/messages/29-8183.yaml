    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I like the first versions better - the circle in the new version wants to be an &#34;O&#34; to me and makes it harder to focus on the pretty ligature.   <BR> <BR>I think the one from March 31 suits the purpose best, but I&#39;d still like the encircling decoration to have less heft. <BR> <BR>It would look lovely embossed &#40;really embossed&#41;, but where the loop of the &#34;L&#34; crosses the circle might be funky. Would this direction work? <BR><img src="http://www.typophile.com/forums/messages/29/8260.gif" alt="no cross"></font></font></font></font>
