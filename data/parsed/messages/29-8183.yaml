  - id: 16179
    user: 1047
    date: 2003-04-02T11:43:00
    date_raw: Wednesday, April 02, 2003 - 11:43 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Ly, it looks as if your thoughts reached me before I even read the critique, I came here ready to post your suggestion <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0>  <BR><img src="http://www.typophile.com/forums/messages/29/8280.gif" alt="bl3"> <BR>It seems most of you agree that the encircling strokes are detract from the &#34;BL&#34;. I think this latest version is better in that regard, even with the thick strokes. <BR> <BR>Randy, I think I&#39;m in agreement on the proportions and the reduction of styles. I know that Brian is quite pleased &#40;settled&#41; with Candida for the name &#40;so am I, by itself at least&#41; Though other fonts better match the mark. Well, he&#39;s actually quite pleased with it all, and I think he will more or less take my opinion on where to go with the mark. I&#39;m definetly still trying to figure it all out though. <BR> <BR>in case anyone&#39;s interested, a little history to show how I arrived here: <BR> <BR>First came the wordmark because Brian and I had agreed that most important was his name and it should be able to stand alone. A mark would be great but just a name would be fine. What Brian was looking for was coming out of the advertisements in the magazine <i>Elegant Bride</i> and logotypes like Gucci, Armani, Donna Karan. Think the <a href="http://www.orangeitalic.com/luxury/">Luxury collection</a> from Orange Italic. I showed a few faces and a few marks but no marks grabbed him, and the Candida mark was what he liked. <BR> <BR>Then on the business cards and such, we needed to identify what he offered. So &#34;photography&#34; was added &#40;but should not have to appear everyhere his logo does&#41;. Being there no monogram &#40;third style&#41; yet, the fashionable helvetica extended was chosen. <BR> <BR>Then I was inspired by <a href="http://www.boguslav.com/"> this excellent work</a> and the work in �Fonts &amp; Logos� by Donald Young. So I thought I&#39;d try a good ol&#39; monogram-type mark. What do you know Brian really likes it, so here I am. <BR> <BR>mitchell</font></font></font></font>'
  - id: 16188
    user: 596
