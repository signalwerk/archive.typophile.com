    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks so much for the comments.  <BR>  <BR>I&#39;ve taken some of the suggestions and made use of them. We&#39;ll have to wait and see how the client takes them - such as a a non serif for &#42;forge&#42;. It looks better to me, maybe not to him.    <BR>  <BR>BTW  <BR>Any suggestions for sans?  <BR>  <BR>I know I am beyond the very small budget at this point but I am still working to make it better within the constraints I am facing. It is ironic &#40;no pun intended&#41; that such a high-end market wouldn�t want to pay for more design time.  <BR> <BR>Also, I realized after reading A.Schibono&#39;s comment more clearly, I should state that minus Matrix, the type is custom. If anyone knows of similar faces I would be interested as I am thinking of extending the style. It might  be too eighties, but hey, the eighties have a certain class. &#40; Maybe its just Matrix &#41; <BR> <BR>I will post more images soon.</font></font></font></font>
