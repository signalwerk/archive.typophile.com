    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">There is at least some weight problems between heavy e s and others letters. The e don&#39;t fit very well with the rest. The weight structure of it is quite different from p, perhaps use same way to built them. &#40;oblique axis of e compared to vertical axis of p&#41;. Dots of the i are little too close. <BR> <BR>And Forge will be indeed better in a Sans, perhaps better little more far from the bottom of the baseline of the ellipsis word.</font></font></font></font>
