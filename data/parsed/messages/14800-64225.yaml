  html: <font class="dontLookLikeCrap">I&#39;m currently a design student in Boston looking to start a graphic design e-zine that focuses on young artists and designers.  Something similar to &#34;Design is kinky&#34; or &#34;k10k&#34;, but I&#39;m working with a few journalism students to make this into a magazine instead of a design portal. <BR> <BR><a href="http://www.trampt-magazine.com" target="_blank">http://www.trampt-magazine.com</a>  <BR> <BR>I&#39;ve designed up a logo but I&#39;m unhappy with it.  The idea I have in my head is a clean, all caps, serif-font for the design but I can&#39;t seem to find the right one. I was hoping one of you typophiliacs can show me the design that I can&#39;t seem to get out of my head.  I can show the layout of the e-zine to those interested if you think that will help inspire a design.  I&#39;m not looking for anything but a straight forward text treatment on the word &#34;trampt&#34;. <BR> <BR>The audience is mainly young designers and design students.  Not really sure what I can offer in return or how interested anyone would be. <BR> <BR>If anyone has any questions please feel free to email me directly at <a href="mailto:cocorobot@gmail.com">cocorobot@gmail.com</a>. <BR> <BR>Thanks, <BR>Keegan</font>
