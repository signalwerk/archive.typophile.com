    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Perhaps the word DESIGN is too close?  <BR> <BR>When I first looked at this it reminded me of something that might be used for a club or something ... not necessarily a bad thing. Have you tried lettering the word DESIGN? Not to totally remove it from type, but letter it tight so as to look like type but to have some of the same energy as the word STIR.</font></font>
