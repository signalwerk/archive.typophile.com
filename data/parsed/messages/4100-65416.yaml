    html: <font class="dontLookLikeCrap">Shouldn&#39;t the R in Stir be lowercase? The smallcap R interupts the flow of the word, at least IMO. I don&#39;t like the geometric sans Design, but I&#39;m not sold on the other typeface you chose either.</font>
