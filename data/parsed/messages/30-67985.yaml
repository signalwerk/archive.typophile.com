    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Actually, a fixed pen angle is not required in &#34;Western calligraphy&#34; at all, although it does tend to be a norm in most hands from what I can tell. The three parameters are translation &#40;movement in the Cartesian plane&#41;, rotation &#40;of the pen&#41; and pressure &#40;which releases more ink, with the correct type of pen&#41;. In fact, even in hands that are based on a fixed angle you get the occasional exception &#40;depending on the letter &#34;skeleton&#34; - think of the &#34;z&#34;&#41;, to avoid ungainly results. <BR> <BR>BTW, there&#39;s quite an uncanny similarity between certain Celtic manuscript motifs and certain Armenian ones, including the famed knotwork... And from what I understand there are at least two scholars working to figure this out. <BR> <BR>hhp</font></font></font></font></font></font>
