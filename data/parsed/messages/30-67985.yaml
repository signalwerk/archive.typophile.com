    html: <font class="dontLookLikeCrap">Blackletter came to M�xico in the XVI century with the first printshop in Am�rica brought from Spain by Juan Pablos. <BR> <BR>Spain used blakletter &#40;rotunda&#41; extensively until the late XVI century and as at the beginning Juan Pablos wasn�t allowed to cast type &#40;as many other colonial printers&#41; blackletter was the star of the time.  <BR> <BR>Indeed the first roman type cut and casted in America was produced by Juan Pablo&#39;s former helper and later competitor Antonio de Espinosa whose work has been revived by Cristobal de Henestrosa. &#42; <BR> <BR>However I suspect that the use of blackletter in signage became popular in M�xico during the 20th century in an attemp to give an ancient feeling to colonial cities.  <BR> <BR>An example of a similar fashion can be seen in Storm&#39;s Patzcuaro with it�s funny tildes under the &#34;O&#34; which as far as I know were invented in the 70&#39;s by some sign painters in Guanajuato to achieve this ancient look. &#42;&#42; <BR> <BR>&#42; <a href="http://www.typophile.com/forums/messages/29/26018.html" target="_blank">http://www.typophile.com/forums/messages/29/26018.html</a> <BR> <BR>&#42;&#42; <BR><a href="http://www.stormtype.com/patzcuaro.html" target="_blank">http://www.stormtype.com/patzcuaro.html</a></font>
