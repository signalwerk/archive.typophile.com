  - id: 99209
    user: clare-holmes-users
    date: 2005-04-06T13:59:00
    date_raw: Wednesday, April 06, 2005 - 1:59 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The corona logo is set in roman type in europe and blackletter in the rest of the world.  Something to do with the war i think! but thats a whole different topic... <BR><img src="http://www.typophile.com/forums/messages/30/69024.jpg" alt="english/european"> <BR><img src="http://www.typophile.com/forums/messages/30/69025.jpg" alt="mexican/ the rest of the world"></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 99492
    user: scripsit-users
    date: 2005-04-08T11:11:00
    date_raw: Friday, April 08, 2005 - 11:11 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hello everyone. First time poster. Interesting topic� <BR> <BR>And what war would that be? Any rationale that blackletter has lost popularity over the years due to German history is specious. There are many different national forms of blackletter / sub-variations within the national styles / evolutionary variations / stylized variations for special occasions / modern bastardizations, etc. <BR> <BR>Thank Claude Garamond for dealing the near-death blow to blackletter in the 1540s. It has lost in popularity ever since. The powers that be within the commercial world continue to drive nails into its typographic coffin. <BR> <BR>It continues its popularity within certain limited national cultures &#40;esp. Germanic &amp; Latin&#41; due to cultural asthetics and historic factors; and certain societal &#34;cults&#34; &#40;gangs, metal bands, etc&#41; because they think it looks &#34;fancy&#34; and cool;  and specialty applications &#40;churches, diplomas, etc&#41; for obvious reasons of tradition. These examples are a gross over simplification but a decent nutshell encapsulation. <BR> <BR>Blackletter has its place just like any of the typographic tool at our disposal. It can be a very effective tool when used appropriately. Unfortunately, as ours is a rather esoteric pursuit, understanding is not common. Consequently, when it comes to matters concerning blackletter, intelligent usage seems, more often than not, relegated to whim.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 99594
    user: 1085
    date: 2005-04-09T03:45:00
    date_raw: Saturday, April 09, 2005 - 3:45 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Welcome to Typophile, Don! <BR> <BR>I certainly agree with you that Blackletter is a rich, and varied medium, which can be used just like any other tool for the right purpose. However, I disagree with two other things that you mentioned in your post. <BR> <BR>First, the second world war has everything to do with the decline of blackletter as a used typeface style&#40;s&#41;. Blackletter today serves a number of decorative roles in design and society. But pre-1930, it was used for a wider scope of design roles. Today, most Germans avoid Blackletter like the plague, because they associate it with Nazism &#40;and people&#39;s assumptions are often more powerful and convincing that the truth&#41;. This reaction is especially true in younger Germans, in my experience, even among graphic designers &#40;who should know their type history better&#41;.  <BR> <BR>Books just aren&#39;t printed with Blackletter types anymore, neither in Germany nor elsewhere. Blackletter may still be seen the world over &#40;even in Germany, especially on things that are supposed to look old, or on beer labels&#41;, but it has been relegated to a much less significant, and more superficial place. <BR> <BR>Secondly, it wasn&#39;t Claude Garamond in c.1540 who struck the death-blow to Blackletter as text in non-Germanic countries, but rather the duo of German printers and Italian patrons in the 1460s and 70s. Especially Nicholas Jenson &#40;okay, he wasn&#39;t really German, but he was a Gutenberg apprentice in Mainz, I think&#41;. <BR> <BR>The Italians never embraced Blackletter printing. Even their more-native Rotunda hands didn&#39;t get much press. The Renaissance Humanists wanted &#34;Roman&#34; looking letters. They actually got Frankish letters, but they couldn&#39;t tell the difference <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0>  <BR> <BR>They never took to Textura or Schwabacher, like patrons in Germany &#40;and Holland, England, Scandinavia, etc&#41; were doing. And by the time that the Holy Roman Emperor commissioned the design of Fraktur, there was a stylistic split across Europe which would soon become ideological: Luther&#39;s works were solely printed with Schwabacher and Fraktur types, making them &#34;Protestant&#34; type. A southern Catholic would have used those letters for his books at his peril.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 99595
    user: 1085
    date: 2005-04-09T03:59:00
    date_raw: Saturday, April 09, 2005 - 3:59 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">In my above post, I generalized with the term &#34;southern Catholic.&#34; I really meant the countries south of Germany, from 1517 onward. <BR> <BR>I should point out as an additional aside that, in Southern &#40;i.e., Catholic&#41; Germany, Textura was still used during the Reformation and Counterreformation to set religious texts in Latin, and that was OK. After a certain point &#40;I can&#39;t put a date on this&#41;, there wouldn&#39;t have been any &#34;Protestant&#34; stigma attached to any sort of lettering style within the German-speaking countries; I suspect that this was after the Catholic Church in Germany felt comfortable enough with the relative success of their Counterreformation. <BR> <BR>However, were I a printer in Rome in the 1600s, I would not have tried printing anything for the Pope with Fraktur�</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 99606
    user: 1250
    date: 2005-04-09T08:15:00
    date_raw: Saturday, April 09, 2005 - 8:15 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think Jenson and company &#40;not Garamont&#41; did indeed have more influence on the demotion of blackletter than WWII. It&#39;s true that the Nazis were most responsible for reducing its usage &#40;after having hailed it as the &#34;true German typestyle&#34;&#41;, but think about why they really dumped it: it was unsuitable to the needs of Empire; and only because of the pre-existing typographic situation, due to... the Italian Humanists! Mussolini would be proud. Heck, <i>she</i> probably would be today... <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 99638
    user: scripsit-users
    date: 2005-04-09T21:30:00
    date_raw: Saturday, April 09, 2005 - 9:30 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Dan, <BR> <BR>Thank you for your warm welcome. It is indeed a pleasure to find a website where one may indulge one&#39;s typographic interests with other knowledgeable &#34;typophiles.&#34; <BR> <BR>&#34;I disagree with two other things that you mentioned� <BR>First, the second world war has everything to do with the decline of <BR>blackletter as a used typeface style&#40;s&#41;. Blackletter today serves a <BR>number of decorative roles in design and society. But pre-1930, it was <BR>used for a wider scope of design roles. Today, most Germans avoid <BR>Blackletter like the plague, because they associate it with Nazism <BR>&#40;and people&#39;s assumptions are often more powerful and convincing that <BR>the truth&#41;. This reaction is especially true in younger Germans, in my <BR>experience, even among graphic designers &#40;who should know their type <BR>history better&#41;.&#34; <BR> <BR>I agree completely with your above observations. You wrote what I should have written if I&#39;d had the time to properly explain my point. In my zeal to clarify why Blackletter has waned in popularity I was incomplete. It would be preposterous to suggest that WWII didn&#39;t have its effects. &#40;People around me get tired of hearing me go on about how WWII was the greatest catalyst of change in human history since the renaissance in everything. Typographic matters not excluded&#41;. It&#39;s just that you wouldn&#39;t believe how many times I&#39;ve heard people say that WWII was &#42;THE&#42; reason for the unpopularity of Blackletter, rather than one of the most recent contributing factors. <BR> <BR>It&#39;s true that Blackletter regained popularity as the official national hand in Germany under the rise of the Nazis. Germany always was reluctant to give up its beloved Frakturs, due to tradition and nationalistic fervor. However, even in Germany the Blackletter was, little by little, losing ground to Roman faces with time. It certainly never would have faded as much as it has if not for the Nazis, On the other hand, it also wouldn&#39;t have continued to be as dominant as it was had it not been propped up by the heavy handed nationalist powers of the times. <BR> <BR>An additional point that I was trying to make &#40;but didn&#39;t do well&#41; was to clarify that Blackletter is often thought of as German when in fact it is a general term for an entire branch of the medieval calligraphic/chirographic/typographic tree. Certainly Blackletter was most popular with the the Northern European countries. But nearly every nationality had its own take on the Blackletter resulting in: Fraktur, Bastarda, Rotunda, Old English, et al, not to mention dozens of Gothic sub-variants. <BR> <BR>Thank you for bring my historic lacun� to my attention <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> <BR> <BR>&#34;Secondly, it wasn&#39;t Claude Garamond in c.1540 who struck the <BR>death-blow to Blackletter as text in non-Germanic countries, but <BR>rather the duo of German printers and Italian patrons in the 1460s and <BR>70s. Especially Nicholas Jenson &#40;okay, he wasn&#39;t really German, but he <BR>was a Gutenberg apprentice in Mainz, I think&#41;. <BR> <BR>The Italians never embraced Blackletter printing. Even their <BR>more-native Rotunda hands didn&#39;t get much press. The Renaissance <BR>Humanists wanted &#34;Roman&#34; looking letters. They actually got Frankish <BR>letters, but they couldn&#39;t tell the difference <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0>&#34; <BR> <BR>Again well reasoned and stated. One cannot dismiss the importance of Nicholas Jenson in this matter. Of course, many people utilized Roman characters before these gentlemen. And Jenson certainly initiated what would become the movement of the Roman&#39;s supremacy over Blackletter. But I&#39;m going to stick with my statement that it was Claude Garamond who struck the death-blow to Blackletter. For it was due to the skill, elegance, popularity and marketing of Garamond&#39;s work that truly established the Roman letter and resulted in its spread and popularity throughout most of Europe. <BR> <BR>Like Jenson&#39;s influences and Italian patrons, Garamond also had a mentor &amp; influence in the genius of Geofroy Tory. Though a French native, Tory spend many years in Italy and was a stanch pro-Italian influence on the renaissance publishing arts. Garamond cut his faces following the Roman style of letter under the direction of Tory. Garamond&#39;s designs became an phenomenal success and swept through Europe unlike any work before it. It has also been said that if it wasn&#39;t for Garamond the French would have been reading Blackletter up into the 20th century. <BR> <BR>I think there is another factor making Garamond&#39;s work the ultimate catalyst for the Roman&#39;s rise over Blackletter. Garamond is considered the first to establish a type foundry, where he designed faces, cut punches, then sold the type he created. Also, being the first: <BR>� to create an Italic face as a companion face within a font family &#40;rather than as a font branch all its own&#41;. <BR>� to design sloping majuscules to work with his Italics &#40;rather than the practice up to that time of using Roman caps with Italics&#41;. <BR>� to create varying companion weights and numerals. <BR>In other words establishing the development of the type family system. This had to make his Roman designs more popular than other options of the time because it was a more complete, innovative, and refined tool. Combined with the fact that he was considered the most distinguished type designer of his time with powerful connections; all this lead to the unprecedented spread of his designs. Which, in turn, lead to his work becoming the national style of France. What an unprecedented powerhouse! Just as Gutenberg didn&#39;t invent printing, but popularized it; Garamond certainly wasn&#39;t the first in utilizing Roman letters, but was responsible for popularizing them. <BR> <BR>At least in my opinion� I hope this Typophile newbie doesn&#39;t come across as didactic or pedantic. I just love this stuff and it has been an important part of my life for over a quarter of a century. It&#39;s fun to get to share it with people who know &amp; care. Sorry for the length of this post. <BR> <BR>dm</font></font></font></font></font></font></font></font></font></font></font></font></font>'
