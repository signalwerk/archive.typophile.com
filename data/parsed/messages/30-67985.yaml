    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Looking at that Reebok site, I got this idea: why not marry a revival of blackletter with all-lc setting? This might make sense on a number of levels: blackletter UC is &#40;traditionally&#41; illegible &#40;to those who only know the Roman structures&#41;; German text has too many caps &#40;at least many Germans think so&#41;; one reform will keep the other company, so to speak&#42;. Noting that Otl Aicher set the German text in his Typographie in all-lc. &#60;preempt&#62;Yes, and in Rotis too...&#60;/preempt&#62; <BR> <BR>&#42; Although I&#39;m personally a huge fan of mixed-case text; I&#39;m just thinking of an angle to break the ice &#40;faster&#41;. <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 99148
    user: diego-m-users
    date: 2005-04-06T08:48:00
