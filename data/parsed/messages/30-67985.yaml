    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Late arrival:  <BR> <BR>Blackletter is close in structure and concept to several kufi styles. I am attaching an example I found via google on: <BR> <BR><a href="http://www.kb.dk/kb/dept/nbo/oja/os/katalog-arabisk-islam/ara1.htm" target="_blank">http://www.kb.dk/kb/dept/nbo/oja/os/katalog-arabisk-islam/ara1.htm</a> <BR> <BR><img src="http://www.typophile.com/forums/messages/30/69320.gif" alt="Kufi sample"> <BR> <BR>There&#39;s also this: <BR><a href="http://w3.uniroma1.it/studiorientali/arabistica/webgrafia/univers/" target="_blank">http://w3.uniroma1.it/studiorientali/arabistica/webgrafia/univers/</a> <BR> <BR>Note: Arabic Kufi started developing with the Islamic conquests and was quite developed by the 9th century.</font></font></font></font></font></font></font></font>'
  - id: 99707
    user: 1085
    date: 2005-04-10T15:11:00
    date_raw: Sunday, April 10, 2005 - 3:11 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>Note: Arabic Kufi started developing with the Islamic conquests and was quite developed by the 9th century</i> <BR> <BR>That puts Kufi way ahead of blackletter in terms of historical development! The first real blackletter hands were probably French texturas from c. 1100. <BR> <BR>Your image posted above reminds me a lot of Irish manuscripts like the Books of Kells, Durrow, etc. While some of their pages were quite elaborately decorated and patterned &#40;so much so that individual letters are hard to discern&#41; other pages have large decorated letters against more neutral backgrounds. When I was studying art history, my professors believed that the Irish elaborate style�which looks an awful lot like really elaborate Islamic calligraphy, inlay, and metal work�can be traced back to Germanic metal work from c. 400�800, and not Islamic Art. However, a lot of Romanesque and some Gothic art was &#42;very&#42; influenced by Islamic Art, especially art from Spain. <BR> <BR>At the time of the Islamic conquest of Spain, Irish monks were traveling through Europe, converting the Germanic tribes to Christianity. They must have had encounters with Spanish Muslims. <BR> <BR>Here is a question then: some calligraphers say that alot of the differences between Irish, Textura, and Italic hands is primarially a mater of what angle the pen is held at &#40;some Irish hands hold the pen straight, Textura can be made by holding the nib at a 45 degree angle, Italic and contemporary hands often hold the pen at a 30 degree angle�&#41;. Does this stroke angle have any effect on Arabic calligraphy? How does that come into play with Kufi scripts? Could there be some influence in Western writing&#39;s stylistic development through Islamic pen angle holding? <BR> <BR>I think that you told me once that, in the case of some Kufi forms, the angle changes. This seems to be different from my understanding of western calligraphy, where one of the basic principles is a steady hand and an unchanging pen angle???</font></font></font></font></font></font></font>'
  - id: 99711
