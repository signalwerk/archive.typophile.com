    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Regarding the similar characteristics between different writing systems� <BR>When similar tools &amp; rules are employed, similar characteristics result. A broad-edged instrument produces a similar effect, whether it be a reed, quill, brush, or nib. Through most of writing&#39;s history bold was preferable because they were easier to read. &#40;Keep in mind that this was before eyeglasses and were most often designed to be read aloud from a lectern.&#41; <BR> <BR>Regarding pen-angle� <BR>Pen-angle always has an effect on the creation of a character no matter what the style. The angle of the cut-edge of the writing instrument is responsible for producing the weight relation of the vertical strokes to the horizontal strokes. The x-height relative to the pen-width establishes the overall weight of the hand. The more shallow the pen-angle, the more emphasis is placed on the vertical elements. The more steep the pen-angle, the more emphasis is placed on the horizontal elements. These angles are implied in typefaces by the stress of a character. <BR> <BR>Maintaining a consistent pen-angle is important. It is what produces a consistent relationship thus unifying the overall alphabetic design. While a constant angle is generally strived for, there are, of course, occasionally exceptions. At these times an altered pen-angle, or sometimes &#34;pen-manipulation,&#34; is used to optically create a more refined letter or detail. <BR> <BR>While pen-angles may vary from one writer to the next, over the centuries of trial &amp; error parameters have generally been agreed upon and established as a guide. For instance, Italic uses a 45� pen-angle with a 5 pen-width x-height. This provides a uniform character color between the horizontal and vertical elements with the stress being minimized by appearing only in the lower left and upper right angles of the part-rounds. <BR> <BR>Here are a few other general pen-angle references� <BR>&#40;Note: pen-width x-height varies for each&#41; <BR> <BR>30�: Rotunda <BR>10��90�: Rustica &#40;steeper angles most common&#41; <BR>0��30�: Half Uncial &#40;flatter angles most common&#41; <BR>30��40�: Humanistic, Carolingian, Foundational, Running Bookhand, Gothic Blackletter <BR> <BR>One will notice that the most common pen-angle is approximately 30� as a general rule. <BR> <BR>dm</font></font></font></font></font>'
