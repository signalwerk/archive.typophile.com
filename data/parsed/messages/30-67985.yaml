    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">As a mexican graphic and type designer I have to attest to the amazing multiplicity of blackletter in the country. The diversity and originality of the shapes and how they are used is quite inspiring.  <BR>It is used everywhere: bars, meat vendors, markets, clothing shops, ice cream or hot dog carts, street snacks, taxis, buses, restaurants, etc. etc.  <BR>I made quite an extensive photographic research, trying to figure out the exact meaning of it, like what exactly it is conveying, elegance? tradition? heat? but everytime I found an instance defying convention. I think it is something engraved in the Mexican subconscius. <BR>Furthermore, the sign painters have not stayed stuck to the traditional model, of course. There are places where truly original designs are evolving &#40;more jungle-like, funky, luscious&#41; <BR>It is so fun! <BR>d <BR> <BR>ah!, another funny thing. Corona&#39;s logo &#40;the famous beer&#41; is made with blackletter in Mexico, but not in europe &#40;?&#41; <BR> <BR><img src="http://www.typophile.com/forums/messages/30/68975.jpg" alt="mexican gothic lettering"></font></font></font></font></font></font></font><