    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#34;I don&#39;t want to diminish Garamond&#39;s role in the development of typograpy, but I don&#39;t think that he had much of anything to do with driving Blackletter out of France.&#34; <BR> <BR>A very curious opinion indeed! I wasn&#39;t going out on a limb here, merely reporting what is a commonly recognized bit of typographic history. And I wasn&#39;t just talking about France, but the majority of Europe. Here are just a few brief quotes from various sources on the matter. Many more can be found without much effort. <BR> <BR> <BR>CLAUDE GARAMOND&#39;S EFFECT ON BLACKLETTER: <BR> <BR>&#34;His roman letter forms won general acceptance in France and elsewhere and were a chief influence in establishing the roman letter as standard, in place of the gothic or black letter.&#34; � The Columbia Encyclopedia, Sixth Edition. <BR> <BR>&#34;Through Garamond&#39;s remarkable skill as a type designer and punch cutter, roman letterforms began to replace blackletter as the French typographic norm. It has, in fact, been said that were it not for the work of Gramond, the French &#40;like the Germans&#41; would have been reading blackletter well into the 20th century.&#34; � Allan Haley, Typographic Milestones &#40;also Director of typographic marketing at ITC&#41;. <BR> <BR>&#34;The quality and beauty of his typefaces are credited as major reasons for the elimination of Gothic [sic Blackletter] types all over Europe.&#34; � Early 20th Century Typeface Design, Philip B. Meggs 2nd Edition. <BR> <BR>&#34;Garamond&#39;s type was a great success and became so widely accepted that it is considered to be the final deathblow to the Gothic letterforms.&#34; � graphicdesign.sfcc.spokane.cc.wa.us <BR> <BR>&#34;Garamond was the first to produce a reworking of the earlier typefaces of Aldus Manutius, creating a face called Garamond. This small roman type became the standard European type of the day and was still in use in the 18th century.&#34; � identifont.com <BR> <BR>&#34;He was responsible for the adoption of roman typeface designs in France as a replacement for the the commonly used Gothics or Blackletters, also he was the first type designer to present Westernised Arabic numbers and oblique capitals to complement the italic lower case.&#34; � fontfactory.com <BR> <BR>&#34;He established an independent type foundry around 1530, and the legibility of his Roman type is credited with a major role in eliminating Gothic style type from most of Europe.&#34; � westkingdom.org <BR> <BR>&#34;The Garamond became the European prototype.&#34; � jyanet.com <BR> <BR> <BR>As for Garamond not having &#34;much of anything to do with driving Blackletter out of France.&#34; <BR> <BR>Garamond recieved a royal commission from the French court to create a series of typefaces. Garamond also produced an amazing number of books for France&#39;s most prominent and wealthy patrons. Garamond&#39;s punches even became part of the original equipment of the French Royal Printing Office, and later the French National Printing Office of Paris. According to Allan Haley, &#34;Through Tory&#39;s enthusiastic influences and Garamond&#39;s remarkable skill as a type designer and punch cutter, roman letterforms began to replace blackletter as the French typographic norm.&#34; <BR> <BR>dm</font></font></font></font>'
