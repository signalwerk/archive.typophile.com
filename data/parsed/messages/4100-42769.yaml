    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thread ID#: 4100/42575 <BR> <BR>-------- <BR> <BR>POST 1/4: <BR>Daniel Genser: <BR><a href="http://www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=daniel_genser-users" target="_blank">http://www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=daniel_genser-users</a> <BR>Registered <BR>Username: daniel_genser <BR>Post Number: 1 <BR>Registered: 8-2004 <BR>&#34; <BR>Hello,  <BR> <BR>                           I&#39;m a new design student who is very interested in typography &#40;in fact, this is my <BR>                           first post here&#41;. I&#39;m designing a logo for an acupuncture clinic and the problem <BR>                           I&#39;m running into is this: I&#39;m creating the logo in a size somewhere in the <BR>                           neighborhood of 8000 X 5000 at 300dpi. From there I&#39;m resizing downward <BR>                           depending on the use. The problem I&#39;m running into is setting the type. What <BR>                           methods are there to set type that large? Are there typefaces available that <BR>                           large? Or is the typical method to design your own type for that size of a project? <BR>                           In my smaller rough drafts I was using Trajan as the typeface. I&#39;ve attached a <BR>                           web-ready rough draft. Thanks in advance! <BR>{logo.gif} <BR>&#34; <BR> <BR>-------- <BR> <BR>POST 2/4: <BR>Alessandro Segalini <BR><a href="http://www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=as8-users" target="_blank">http://www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=as8-users</a> <BR>Typophile Regular <BR>Username: as8 <BR>Post Number: 280 <BR>Registered: 4-2004 <BR>&#34; <BR>Why do you set type in Photoshop?  <BR>                                     Kern the dot after the P, now it is closer to S.  <BR>                                     AS <BR>&#34; <BR> <BR>-------- <BR> <BR>POST 3/4: <BR>David Hubner <BR><a href="http://www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=formlos-users" target="_blank">http://www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=formlos-users</a> <BR>Uppercase <BR>Username: formlos <BR>Post Number: 176 <BR>Registered: 2-2002 <BR>&#34; <BR>You should use a vector program / software for creating logos &#40; or when working with type <BR>                   &#41;, something like Freehand, Illustrator or Corel Draw.. That way, your logo being a vector <BR>                   file, is scaleable and there would be no problem with rezising it..  <BR> <BR>                   <a href="http://www.prepressure.com/image/bitmapvector.htm" target="_blank">http://www.prepressure.com/image/bitmapvector.htm</a>  <BR>                   <a href="http://graphicssoft.about.com/library/weekly/aa000327a.htm" target="_blank">http://graphicssoft.about.com/library/weekly/aa000327a.htm</a> <BR>&#34; <BR> <BR>-------- <BR> <BR>POST 4/4 &#40;x2&#41;: <BR>Daniel Genser <BR><a href="http://www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=daniel_genser-users" target="_blank">http://www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=daniel_genser-users</a> <BR>Registered <BR>Username: daniel_genser <BR>Post Number: 2 &#40;&amp;3&#41; <BR>Registered: 8-2004 <BR>&#34; <BR>                           Thanks for the suggestions. Like I said earlier, I&#39;m a very beginning design <BR>                           student! I just bought Illustrator, so I&#39;ll use that.  <BR> <BR>                           Also, thank you David for the links. It&#39;s hard to find solid information that breaks <BR>                           things down like that on the web, sometimes.  <BR> <BR>                           Back to the drawing &#40;Illustrator using vectors&#41; board! <BR>&#34; <BR></font></font></font></font></font></font></font></font></font></font></font>'
