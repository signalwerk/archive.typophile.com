  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I am a designer working at an advertising agency, and we are in the process of developing an identity system for one of our clients. The client is a major footwear company in the United States, and we have presented a logo and logotype direction that has been approved. We are in need of a type designer to make necessary changes to the logotype to make it ownable, and further down the line we will be needing a redesign of the typeface we have proposed. <BR> <BR>The deadline for the logotype is Friday, December 3rd. If you are available for this time line and interested in the project, I&#39;d love to hear from you. I can deliver a PDF with specific guidelines with request.  <BR> <BR>I hope you will have a great Thanksgiving, and look forward to meet interested participants. <BR> <BR>You can contact me at: <BR> <BR><a href="mailto:soohyenp@arnyc.com">soohyenp@arnyc.com</a></font></font>'
