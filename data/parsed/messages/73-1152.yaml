    html: '<font class="dontLookLikeCrap"><a href="http://www.trove.net"> Trove.net</a> is a digital repository for members of the Research Libraries Group, which includes many of the large academic and research libraries. <BR> <BR>They have quite a few images that might be of interest to people on this forum &#40;though not necessarily easily found&#41;. <BR> <BR>A couple of samples: <BR> <BR><a href="http://www.trove.net/CSHR0008/CSHR0008_000037.html"> Cactus Brand Oranges</a> from a collection of citrus labels. <BR> <BR><a href="http://www.trove.net/NLIG0006/NLIG0006_000026.html"> Kto skoree book cover</a> from a collection of Russian children&#39;s books. <BR> <BR>The images on the site are low-rez &#40;250x250 pixel or so&#41;, watermarked versions, but if you are accessing through a member institution, you can jump to a high resolution image. If not, you can license the high-rez image through a stock agency. But for inspiration for a lettering or font project, the lo-rez image is often perfectly adequate.</font>'
