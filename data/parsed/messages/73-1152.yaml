    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The Melbert B. Cary, Jr. Graphic Arts Collection is one of the country&#39;s premier libraries on the history and practice of printing.The original collection of 2,300 volumes was assembled by the New York City businessman Melbert B. Cary, Jr. during the 1920s and 1930s. Cary was director of Continental Type Founders Association, a former president of the American Institute of Graphic Arts, and proprietor of the private Press of the Woolly Whale. His professional and personal interests in printing led him to collect printer&#39;s manuals and type specimens, as well as great books of the printer&#39;s art. In 1969, the Cary Collection was presented to RIT by the Mary Flagler Cary Charitable Trust as a memorial to Mr. Cary, together with funds to support use of the collection. Today the library houses some 20,000 volumes and a growing number of manuscripts and correspondence collections. Also included are impressive holdings on bookbinding, papermaking, type design, calligraphy and book illustration. The goal of developing the digital image database is to enable users all over the world to sample the wealth of rich materials housed in the collection.  <BR> <BR>Commonly known as �The Cary Library� <BR>Located at the Rochester Institute of Technology <BR>in The Wallace Library <BR>90 Lomb Memorial Drive <BR>Rochester NY 14623-5604 <BR>&#40;716&#41; 475-2408 <BR><A HREF="http://wally.rit.edu/cary/" TARGET="_top">http://wally.rit.edu/cary/</A></font></font></font></font></font>
