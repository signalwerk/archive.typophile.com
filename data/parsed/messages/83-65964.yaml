  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I was really happy with the identification of the Escape from NY font, so I thought I&#39;d request an ID on another movie title font that&#39;s been bugging me. <BR> <BR>This is the font for the movie now &#40;wouldn&#39;t mind having this IDed as well if possible, thanks&#41;: <BR><img src="http://www.typophile.com/forums/messages/83/65965.jpg" alt="Current Font"> <BR> <BR>But, this one is the original font used on teaser posters and the like. It was not used in the final promotion of the release. I think it was something to do with the font being too middle-eastern looking, and the film being released shortly after 9/11. This is the font that&#39;s been bugging me and I will be absolutely stoked if anyone can ID it. &#40;&#42;stoked&#42; being an Australian slang term - in other words, I&#39;ll be pretty pleased&#41;. <BR><img src="http://www.typophile.com/forums/messages/83/65966.jpg" alt="Original Font"> <BR> <BR>Any help in identifying these fonts would be greatly appreciated. Thank you!</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
