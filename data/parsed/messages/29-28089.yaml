    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks for your feedback! <BR> <BR> <BR>Hi Kunihiko, <BR>Your critiques are great,  <BR>i will work on it now. <BR>The handwriting style let me make the K  <BR>&amp; H more understandable to make  <BR>differences between fonts, nice to know  <BR>from you, a japanese reader and  <BR>speaker, what kind of details can make  <BR>the difference to distinguish similar  <BR>characters. <BR> <BR>Eduardo, <BR>i am agree with the stylistic  <BR>divergence, bettwen the latin and  <BR>japanese fonts, that�s because i try to  <BR>make such japanese details in small  <BR>size, so the same geometric solution  <BR>for latin, can�t show differences  <BR>bettwen characters who sometimes can be  <BR>confused, because of the similar  <BR>details&#40;Distinction of &#34;SHI&#34; and &#34;TSU&#34;&#41; <BR> <BR>Yours critiques are very useful to me  <BR>too, i will make some changes soon. <BR> <BR> <BR>Hrant, <BR>Thanks to Eduardo for the answers. <BR>About the color variance, youre right.  <BR>But in Hiragana more than in katakana.  <BR>I will try to compensate making more  <BR>thiner&#40;one pixel less&#41; in the more  <BR>black ones. <BR> <BR>One more thing.. any kerning text or  <BR>Pangram to start to write in japanese?  <BR> <BR>;^&#41; <BR> <BR> <BR>mh</font></font></font></font></font>
