    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;m not sure about it, really. Kunihiko certainly knows better. <BR>In my understanding, and to use your own terms, it&#39;s &#39;socially unacceptable&#39; to publish something all-Kana. But not only because of &#39;social&#39; issues... <BR> <BR>It&#39;s complicated. There are words, for example, that have proper Kanji spellings, but that most people spell/write using only Hiragana &#40;&#39;arigatou&#39; is a common example, and Katakana is mostly used for foreign words&#41;. </font></font></font></font></font></font>
