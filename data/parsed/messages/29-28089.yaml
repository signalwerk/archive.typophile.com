    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; i am agree with the stylistic divergence, <BR>&#62; bettwen the latin and japanese fonts, that�s  <BR>&#62; because i try to make such japanese details <BR>&#62; in small size, so the same geometric solution <BR>&#62; for latin, can�t show differences bettwen  <BR>&#62; characters who sometimes can be confused,  <BR>&#62; because of the similar details&#40;Distinction of  <BR>&#62; &#34;SHI&#34; and &#34;TSU&#34;&#41; <BR> <BR>Ok, but I still think there&#39;s too much difference. <BR> <BR>Also, notice that your Kana fonts are too big. I agree that they should be slightly taller than the Latin &#40;maybe in 2px&#41;, but 6px is just too much &#40;I&#39;m comparing Hiragana A and Latin A&#41;, considering that your Latin letters are 11px tall. <BR> <BR> <BR>&#62; One more thing.. any kerning text or <BR>&#62; Pangram to start to write in japanese? <BR> <BR>No idea. <BR>I guess you&#39;ll have to take a look at some Japanese learning books. <BR>BTW, I&#39;d like to see a setting... mixing the three fonts.</font></font></font>
