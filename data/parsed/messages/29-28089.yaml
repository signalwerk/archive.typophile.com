  votes: 5
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hola amigos typophiles, <BR> <BR>this is my first non latin greyscale pixel font. The challenge was to develope a Yummy bold caps font for titling, who can work well for Japanese language readers. <BR> <BR>If anyone can read or recognize if this first designs sketches works, maybe someone who know about Katakana or Hiragana, can make some critiques here..every help is welcome! <BR> <BR>Muchas gracias, <BR> <BR>mh <BR><img src="http://www.typophile.com/forums/messages/29/28090.gif" alt=""></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
comments:
  - id: 50956
    user: shotype-users
    date: 2004-03-08T03:13:00
    date_raw: Monday, March 08, 2004 - 3:13 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi, Miguel. <BR> <BR>I&#39;m Japanese. It is a very pretty nice font. Is the resource of this font the sketch of the handwriting style? <BR>The font of the handwriting style is in fashion in Japan. <BR> <BR>Well, There are some wrong points. <BR> <BR>&#34;SU&#34;, &#34;SE&#34;, &#34;SO&#34;. The right-hand side upper part point &#40;Its name is &#34;DAKU-TEN&#34;&#41;  is unnecessary. <BR>Not &#34;ZU&#34;, &#34;ZE&#34;, &#34;ZO&#34;. <BR> <BR>&#34;HO&#34;, The top of right-hand side does not cross. It is not &#34;MA.&#34; <BR> <BR>And as my opinion, <BR> <BR>I cannot distinguish &#34;SO&#34; from &#34;N&#34;. <BR>Note that angle of stroke. Right-hand stroke of &#34;SO&#34; moves top to bottom, the other, stroke of &#34;N&#34; moves bottom to top. <BR>Although, Japanese people sometimes mistake. <BR> <BR>Distinction of &#34;SHI&#34; and &#34;TSU&#34; is good! <BR>Japanese people sometimes mistake too. <BR> <BR>&#34;NU&#34; and &#34;ME&#34; are too wide. <BR> <BR>&#34;GA&#34;, Upper double point &#34;DAKU-TEN&#34; should be most in right-hand side. <BR> <BR>from KYA,KYU,KYO to HYA,HYU,HYO <BR>Right-hand side character is too large. <BR> <BR> <BR>I am looking forward to completion of this font. <BR> <BR></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 50969
    user: 1353
    date: 2004-03-08T06:06:00
    date_raw: Monday, March 08, 2004 - 6:06 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">It&#39;s nice, Miguel, but there&#39;s too much &#39;stylistic&#39; divergence between the Latin font and the Japanese fonts. The Latin font is squarish, geometric, clean, &#39;cool&#39;. The Japanese fonts, as Kunihiko said, look handwritten, maybe a bit &#39;childish&#39; too. <BR> <BR>I&#39;d try to make the Japanese fonts more squarish and geometric like the Latin, but that&#39;s a personal preference. They&#39;re still nice fonts in itself. <BR> <BR>&#42; &#42; &#42; &#42; &#42; <BR> <BR>I mostly agree with Okano&#39;s post, of course. <BR>And I&#39;d like to add that: <BR>- &#39;N&#39; &#40;h&#41; is too short, make it taller; <BR>- &#39;KA&#39; &#40;k&#41; is not just the &#39;KA&#39; &#40;h&#41; without the little stroke, the hiragana should be rounder/softer ; <BR>- the descending strokes of &#39;KO&#39;, &#39;RO&#39; and &#39;YO&#39; &#40;k&#41; are too long; <BR>- &#39;A&#39;, &#39;WA&#39; &#40;h&#41;, and &#39;TA&#39; &#40;k&#41; are too big; <BR>- &#39;YA&#39; &#40;both h and k&#41; is too small; <BR>- &#39;RU&#39; and &#39;RO&#39; &#40;k&#41; are too exaggerated. <BR>&#40;h=hiragana, k=katakana&#41;</font></font></font></font></font></font></font></font></font></font></font></font>'
