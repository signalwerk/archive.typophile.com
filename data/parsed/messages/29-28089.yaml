    html: <font class="dontLookLikeCrap">&#62;In my understanding, and to use your own terms, it&#39;s &#39;socially unacceptable&#39; to publish something all-Kana. But not only because of &#39;social&#39; issues...  <BR> <BR>&#62;It&#39;s complicated. There are words, for example, that have proper Kanji spellings, but that most people spell/write using only Hiragana &#40;&#39;arigatou&#39; is a common example, and Katakana is mostly used for foreign words&#41;.  <BR> <BR>I think so too. <BR>In the case of a packaging design, Sometime, a brand name and company name may be displayed in kana. A font of only kana is popular. <BR> <BR>There are some fonts of only kana. <BR>for example... <BR>GrayGraphics&#40;FreeFont 1byte&#41; <BR><a href="http://www.orange.ne.jp/~den7/index.html" target="_blank">http://www.orange.ne.jp/~den7/index.html</a> <BR> <BR>Almost all the fonts in this site consist of only kana. <BR>It is used as a display font. I use often. <BR> <BR>While, There is also a kana font which replaces full set Japanesefont&#39;s kana. <BR>For example, Adobe&#39;s Ryo is. <BR> <BR>Adobe Ryo &#40;PDF&#41; <BR><a href="http://www.adobe.co.jp/products/fontfolio/pdfs/ryo.pdf" target="_blank">http://www.adobe.co.jp/products/fontfolio/pdfs/ryo.pdf</a> <BR>This textsetting replaced Kozuka Mincho&#39;s kana with Ryo. <BR> <BR>&#62;One more thing.. any kerning text or  <BR>&#62;Pangram to start to write in japanese?  <BR> <BR>Kana may adjoin all characters. So, a huge quantity of a kerning pair is needed. It is infinitely. <BR>It is better to have been able to set without depending on kerning as much as possible. Therefore, in this case, it is better to equalize character width of this font. <BR></font>
