    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; 1&#41; Where did you get the template - is it complete? <BR> <BR>Well, you can get this kind of template in any Japanese &#39;learning&#39; book. I think this template is complete, yes. <BR> <BR> <BR>&#62; 2&#41; Is Kanji really not needed? <BR> <BR>What do you mean? <BR>I guess this face is intended for some sort of &#39;small-size-display&#39; &#40;like interface buttons or something&#41;, and in this case you can choose to work only with Kana. I&#39;d say that when you have single words or pairs of words, you can use only Kana. But when you have a whole paragraph or sentence, you should use Kanji too. <BR>Both Kana alphabets are phonetic, so you can write anything &#40;that you&#39;d write with Kanji&#41; with them.</font></font></font></font></font></font></font></font></font></font>
