kills to take 100&#43; new images and add them to the growing <a href="http://www.typophile.com">Found Type gallery</a>. <BR> <BR>We&#39;ll trade your gracious labor for a complete 2004 Uppercase membership &#40;including the t-shirt, forum access, SoTA discount, etc&#41;. <BR> <BR>Requirements: <BR>- Rudimentary knowledge of Flash 6 &#40;it&#39;s not rocket science, no action scripting required&#41;.  <BR>- You must have your own &#40;or your employer&#39;s&#41; copies of Flash 6, Bitstream&#39;s Clarendon &#40;Clarendon BT&#41; and Photoshop. &#40;Mac preferred for easy font translation from the existing files, but not required.&#41; <BR> <BR>Email me if you&#39;re interested and able - <a href="mailto:pemberton@typophile.com">pemberton@typophile.com</a></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
