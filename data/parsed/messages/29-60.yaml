  html: "<!-NOTE: Message edited by 'admin'-!>This face was created by &#34;slicing and dicing&#34; and reassembling letterforms from authentic brushstroke Japanese kanji. The goal was to create an authentic look, which can be read upon further study. I have finshed all the letters from A-Z. <BR> <BR>I designed it for use in a redesign of Detour magazine for a school assignment. The spreads can be found in my portfolio at <A HREF=\"http://www.typophile.com/benson\" TARGET=\"_blank\">http://www.typophile.com/benson</A>. &#40;click the Mayo&#41; <BR> <BR><IMG SRC=\"http://www.typophile.com/forums/messages/29/61.gif\" ALT=\"yakuza\">"
