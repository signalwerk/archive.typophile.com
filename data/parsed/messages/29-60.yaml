    html: I&#39;ve always thought a kanji version of roman  <BR>letterforms would make an excellent font and you  <BR>executed it very nicely. Great work.
  - id: 43
    user: benson-public
    date: 2000-04-27T14:55:00
    date_raw: Thursday, April 27, 2000 - 02:55 pm
    votes: null
    html: I&#39;ve seen a lot of cheesy pseudo-asian fonts, and my goal was to create one that was really authentic-looking. The best way was to slice and dice authentic kanji for parts. I like it much better than the well-known &#34;Sumdumgoi&#34; font.
  - id: 51
