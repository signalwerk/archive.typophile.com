    date_raw: Wednesday, May 03, 2000 - 10:04 am
    votes: null
    html: 'Jared, nice idea, but I think you&#39;re pushing <BR>it a little too much: if you want it to be <BR>nearly impossible to read, fine. But other- <BR>wise I think you might find that your personal <BR>familiarity with the forms is hinding their <BR>very low decipherability. <BR> <BR>As a comparison, check out Want&#39;s Fusaka: <BR><A HREF="http://www.adobe.com/type/browser/F/P_469/F_FUSA-10005000.html" TARGET="_top">http://www.adobe.com/type/browser/F/P_469/F_FUSA-10005000.html</A> <BR> <BR>And my own Trajic notRoman: <BR><A HREF="http://dev.cdi.ucla.edu/~hrant/trajic.gif" TARGET="_top">http://dev.cdi.ucla.edu/~hrant/trajic.gif</A> <BR>&#40;Note: those aren&#39;t words, just letters.&#41; <BR> <BR>hhp'
  - id: 53
    user: stephen-public
    date: 2000-05-03T22:46:00
    date_raw: Wednesday, May 03, 2000 - 10:46 pm
    votes: null
    html: Mr. Papazian, I disagree.  <BR> <BR>Yakuza may be in the same genre as Fusaka but is an  <BR>entirely different take on the kanji style. I would also  <BR>argue that it is as readible as Fusaka and your lovely  <BR>Trajic. Readability is easily acheiveable with context as  <BR>is evidenced in Hoefler&#39;s own Gestalt. <BR> <BR>Also, if the intended use calls for a face representing  <BR>authentic kanji forms Yakuza entirely more usable than  <BR>Fusaka.
  - id: 56
    user: 1250
    date: 2000-05-04T20:43:00
    date_raw: Thursday, May 04, 2000 - 08:43 pm
    votes: null
    html: "Just call me Hrant - and don&#39;t worry <BR>about the pronunciation either!  :-&#41; <BR> <BR>I totally agree that Yazuka has an <BR>authentic Kanji look that Fusaka <BR>doesn&#39;t. But I still worry about <BR>the former&#39;s decipherability. <BR> <BR>What we really need is to carry out some <BR>public tests &#40;like I did at TypeCon98 with <BR>Trajic&#41;, to get a better idea of the level <BR>of legibility of Yazuka. This would help <BR>better define its usage characteristics <BR>for typographers: &#34;relatively safe&#34;, or <BR>&#34;heavy-deciphering-effort-required&#34;. <BR> <BR>Jared, what about providing some test <BR>settings, and seeing how many of us <BR>can read the stuff? Should be fun! <BR>If you go for it, I think the replies <BR>should be e-mailed to you, instead <BR>of immediately being made public; <BR>after some time, you could compile <BR>the results and let us know. <BR>Wadayasay? <BR> <BR>hhp"
