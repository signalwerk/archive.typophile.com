  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Here&#39;s my short list of letterpress info and supplies online: <BR> <BR>Don Black Linecasting &#40;supplies in Toronto&#41; <BR><a href="http://www.donblack.ca/" target="_blank"> http://www.donblack.ca/</a> <BR> <BR>The old Fireproof Press site <BR><a href="http://work.colum.edu/~matma/letterpress/letterpress.html" target="_blank"> http://work.colum.edu/~matma/letterpress/letterpress.html</a> <BR> <BR>Graphic Chemical &amp; Ink <BR><a href="http://www.graphicchemical.net/" target="_blank"> http://www.graphicchemical.net/</a> <BR> <BR>Harold Berliner Press <BR><a href="http://www.berlinerpress.com/" target="_blank"> http://www.berlinerpress.com/</a> <BR> <BR>M &amp; H Type <BR><a href="http://www.arionpress.com/mandh/index.htm" target="_blank"> http://www.arionpress.com/mandh/index.htm</a> <BR> <BR>Arion Press <BR><a href="http://www.arionpress.com/" target="_blank"> http://www.arionpress.com/</a> <BR> <BR>NA Graphics &#40;great supply house!&#41; <BR><a href="http://www.printmart.com/ads/970-387-0212.htm" target="_blank"> http://www.printmart.com/ads/970-387-0212.htm</a> <BR> <BR>Red Wheel Studio &#40;type for sale&#41; <BR><a href="http://redwheelstudio.home.attbi.com/" target="_blank"> http://redwheelstudio.home.attbi.com/</a> <BR> <BR>Sherwin Beach Press &#40;Chicago&#41; <BR><a href="http://www.sherwinbeach.com/" target="_blank"> http://www.sherwinbeach.com/</a> <BR> <BR>Springtide Press &#40;Chicago&#41; <BR><a href="http://www.springtidepress.com/" target="_blank"> http://www.springtidepress.com/</a> <BR> <BR>Starshaped Press &#40;Chicago&#41; <BR><a href="http://www.starshaped.com/" target="_blank"> http://www.starshaped.com/</a> <BR> <BR>Tryst Press &#40;Utah&#41; <BR><a href="http://www.trystpress.com/aboutus.html" target="_blank"> http://www.trystpress.com/aboutus.html</a> <BR> <BR>AAPA Resources for letterpress <BR><a href="http://members.aol.com/aapa96/lpress.html" target="_blank"> http://members.aol.com/aapa96/lpress.html</a> <BR> <BR>The Printer &#40;monthly newletter&#41; <BR><a href="http://apa-letterpress.org/Files/APA/ThePrinter.html" target="_blank"> http://apa-letterpress.org/Files/APA/ThePrinter.html</a> <BR> <BR>Owosso Graphics &#40;magnesium dies&#41; <BR><a href="http://www.owossographic.com/index2.htm" target="_blank"> http://www.owossographic.com/index2.htm</a> <BR> <BR>Box Car Press &#40;photopolymer services, etc.&#41; <BR><a href="http://boxcarpress.com/" target="_blank"> http://boxcarpress.com/</a> <BR> <BR>Columbia College Center for Book and Paper Arts &#40;Chicago&#41; <BR><a href="http://www.bookandpaper.org/" target="_blank"> http://www.bookandpaper.org/</a></font></font></font></font>'
