  html: <font class="dontLookLikeCrap">Can you suggest any books on type design? I mean type design and &#42;not&#42; type setting. I&#39;ve read &#34;The Elements of Typographic Style&#34; but now I want to read about <BR> <BR> &#42; What are the basic graphical elements of a type? <BR> &#42; How can they be varied? What has been done in the past? <BR> &#42; What&#39;s the effect of those different variations? <BR> &#42; In general, how does type convey meaning or correspond to emotions? <BR> &#42; Examples, examples, examples... <BR> <BR>I know that this is a huge field but can you suggest a book which covers at least the basics? There must be something which can get me started.</font>
