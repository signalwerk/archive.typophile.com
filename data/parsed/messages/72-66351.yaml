  html: '<font class="dontLookLikeCrap">Buffalo, NY  - February 25, 2005 <BR> <BR>For Immediate Release: <BR> <BR>Please note the following correction to press release &#34;P22 announces The &#39;Clifford Family&#39; of Script fonts&#39;&#39;, dated Feb.16th: the name of the 7-font collection has been officially changed to the &#34;Staunton Script Family&#34;. <BR> <BR>The collection is available on March 1, 2005.  <BR> <BR> <BR>About the Staunton Script Family: <BR> <BR>The Staunton Script Family was developed to parallel typographer Ted Staunton�s authorship of a historical novel titled The Clifford Bible. The novel  traces seven generations of the Clifford family from entries on the flyleaves of an old family Bible. This collection of fonts was generated to augment the text and reflect some of the stylistic transitions that evolved in a period spanning between the English Civil War &#40;1640s&#41; and the Victorian Era &#40;1839-1901&#41;. The scripts illustrate the stylistic transitions from gothic to copperplate, reflecting cultural influences and the characteristics imparted by the evolution of  writing instruments from the quill to the steel nib.  <BR> <BR>Each distinctive writing style was reconstructed as a font for Mr. Staunton&#39;s book project, but the availability to the public is a welcome addition to designers in search of authentic historical handwriting fonts. The fonts will be available for sale on March 1, 2005 exclusively through P22 type foundry&#39;s Sherwood Type Collection division. Each font can be downloaded separately or in one set. Prices start at $19.95.  <BR> <BR><a href="http://www.p22.com/sherwoodtype/stauntonscripts.html" target="_blank">http://www.p22.com/sherwoodtype/stauntonscripts.html</a> <BR> <BR>Samples of each font can be found at:  <BR><a href="http://www.p22.com/sherwoodtype/files/Virginian.pdf" target="_blank">http://www.p22.com/sherwoodtype/files/Virginian.pdf</a> <BR><a href="http://www.p22.com/sherwoodtype/files/Royalist.pdf" target="_blank">http://www.p22.com/sherwoodtype/files/Royalist.pdf</a> <BR><a href="http://www.p22.com/sherwoodtype/files/Grosvenor.pdf" target="_blank">http://www.p22.com/sherwoodtype/files/Grosvenor.pdf</a> <BR><a href="http://www.p22.com/sherwoodtype/files/Grenville.pdf" target="_blank">http://www.p22.com/sherwoodtype/files/Grenville.pdf</a> <BR><a href="http://www.p22.com/sherwoodtype/files/Elizabethan.pdf" target="_blank">http://www.p22.com/sherwoodtype/files/Elizabethan.pdf</a> <BR><a href="http://www.p22.com/sherwoodtype/files/Broadwindsor.pdf" target="_blank">http://www.p22.com/sherwoodtype/files/Broadwindsor.pdf</a> <BR><a href="http://www.p22.com/sherwoodtype/files/Chatham.pdf" target="_blank">http://www.p22.com/sherwoodtype/files/Chatham.pdf</a> <BR>----------------------------- <BR>P22 type foundry, Inc. <BR>  International House of Fonts <BR>  Lanston-P22 <BR>  Sherwood Type <BR>PO Box 770 <BR>Buffalo, NY 14213 <BR><a href="http://www.p22.com" target="_blank">http://www.p22.com</a> <BR>Phone: 716-885-4490 <BR>Fax: 716-885-4482 <BR>-----------------------------</font>'
