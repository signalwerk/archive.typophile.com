    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I like the Metsys lettering. I have done plenty of mods to Metsys myself. I took the liberty of  <BR>doing a few tweaks I think may help you in solving your problem. The Metsys &#34;n&#34; is really nice, I think it could really helps define the &#34;a&#34; as the rounded &#34;a&#34; you did is perhaps a bit illegible without the context of the rest of the surrounding letters. I would also widen the &#34;e&#34; and &#34;a&#34; as shown. Hope I was of some help.  <BR><IMG SRC="http://www.typophile.com/forums/messages/29/1495.jpg" ALT="Elanco mods.jpg"></font></font></font></font>
