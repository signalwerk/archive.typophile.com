    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> As letterforms you may be on to something  <BR>&#40;with some tweaks&#41;, but as a word mark, you  <BR>may have more work to do. Show us some  <BR>context--is this a steel refinery or a  <BR>housewares store? <BR> <BR>I agree about the e and the a... open them up  <BR>a bit. </font></font></font></font>
