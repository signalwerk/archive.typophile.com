    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> apparently, I got the image right, but the text is gone... <BR>so, here comes the brief: this is the rough sketch I did for a russian client, ang he liked the logotype enough to drop the suggested symbol. <BR>however, there are things bothering me about the overall balance. maybe you could suggest some tunings to make it look better. <BR>and the second issue: though there are only a few letters displayed here, do you think these have potential to be extended into a full character set? do you have any recollection of similar fonts? <BR> <BR>thank you all, <BR> <BR>george // cellsius creative <BR> <BR>P.S. this is my first attempt at designing lower cases. please, don&#39;t be too harsh :-&#41; </font></font></font></font>'
  - id: 4655
    user: 1250
    date: 2002-06-11T08:02:00
    date_raw: Tuesday, June 11, 2002 - 8:02 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> As shapes, I like it. What&#39;s the company about? <BR> <BR>As a logo, it might need to be a bit darker, but the &#34;e&#34; and &#34;a&#34; are already too cramped, so try making the &#34;n&#34; &#40;especially&#41; and the &#34;c&#34; and &#34;o&#34; narrower. The thing at the bottom of the &#34;el&#34; is too subtle, and as a result out of character too - but don&#39;t make it curl &#40;it would create more color problems&#41; - just make it straight. The &#34;c&#34; is structurally superb, just make the top-right curve more round and remove the slight flare from the bottom finial. <BR> <BR>I think it could work as a font. If you go that way, do something original with the caps &#40;maybe uncial forms&#41;, since your &#34;a&#34; is already unconventional &#40;and we already have a lot of boring caps&#41;. <BR> <BR>hhp </font></font></font></font>
  - id: 4663
