    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> I do like it. <BR> <BR>one thing that strikes me about this, in all <BR>of its versions shown, is how the first three <BR>characters call attention to themselves. Because <BR>of this, and only in my opinion, the last three <BR>characters seem less important. hmmm. Need the <BR>right words.  <BR> <BR>&#40;pause&#41;  <BR> <BR>Because the &#39;e&#39; and the &#39;a&#39; have so much <BR>character, the focus, through my eyes only perhaps,  <BR>isn&#39;t evenly distributed&#40;?&#41;. Or in  <BR>other words, the logo looks to be only <BR>those three letters because of this visual  <BR>emphasis. </font></font></font></font>
