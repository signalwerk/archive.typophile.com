    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62; <i>Even Classic mode only sees about 18 out of 300.</i> <BR>&#62; <i>And Quark 4.1 only sees three of those in Classic mode.</i> <BR> <BR>This makes me think that there is something seriously wrong with the fonts. What foundries or suppliers are these faces from? If you&#39;re having that much dropoff in terms of OS 9 to OS X transitioning, I would be concerned that some of the face may not make the conversion intact anyway.</font></font></font></font></font></font></font>
