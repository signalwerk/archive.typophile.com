post:
  id: 77618
  user: 4825
  date: 2004-10-04T19:13:00
  date_raw: Monday, October 04, 2004 - 7:13 pm
  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The dreaded upgrade is here and suddenly all my OS9 fonts are obsolete garbage. Adobe CS came with some nice fonts, but our shop needs so much more. <BR> <BR>On a lark, I downloaded Fontlab for OS X and opened a Type 1 font from OS 9. I exported it as OpenType, set some type with it in InDesign, made a PDF, opened it in Acrobat, preflighted it, and printed it to a Postscript Level 2 laser printer. Whoa. <BR> <BR>Did that really work? It can&#39;t be that easy. Can I batch-process 300 fonts to OpenType with Fontlab and keep production running smoothly? The boss would think I was god if I could pull that one off.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
comments:
  - id: 77620
    user: 1011
    date: 2004-10-04T19:42:00
    date_raw: Monday, October 04, 2004 - 7:42 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Whoa, now! <BR> <BR>Why do think your OS 9 fonts are obsolete garbage? <BR> <BR>Type 1 fonts are perfectly compatible with OS X and Adobe&#39;s CS apps. Converting Type 1 directly to OpenType offers no advantages other than a single font file with OTF versus separate outline and screen font files with T1. I think you&#39;re wasting your time with the conversion unless your entire Type 1 library is pre-1990 vintage and the bitmaps are still using FONT resources rather than NFNTs. <BR> <BR>Can you clarify why you think this is necessary?</font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 77621
    user: 571
    date: 2004-10-04T19:58:00
    date_raw: Monday, October 04, 2004 - 7:58 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Jefferson <BR> <BR>There has been a long ongoing thread on this regard over at T-D &#40;Type-Design&#41;. It may be possible to convert a standard PS1 to OT but batch conversion is a bit problematic at this point, especially if you are trying to combine certain fonts, say a font that also has a separate Expert set. Besides the encoding problem, PS1 fonts don&#39;t share kerning pairs. <BR> <BR>While I do agree that conversion will become a necessity, simply because at some point down the type road Adobe and Microsoft apps are not likely to support PS1, at this point I really don&#39;t see how this can be effectively done in any form of batch process &#40;despite the proposed and much delayed FontLab TransTypePro&#41;.</font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 77623
    user: 4825
    date: 2004-10-04T20:12:00
    date_raw: Monday, October 04, 2004 - 8:12 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Grant, <BR> <BR>I&#39;ve tried running the fonts in question on OS X, which largely refuses to recognize them. Even Classic mode only sees about 18 out of 300. And Quark 4.1 only sees three of those in Classic mode. And it all crashes at the drop of a hat. For a number of reasons, we&#39;re moving to OS X and Creative Suite. <BR> <BR>Gerald, <BR> <BR>Thanks. I&#39;ll look for the thread you mentioned. I&#39;m not absolutely opposed to doing all this manually, but I have to convince the boss that it can be done - and done successfully - for x number of dollars. The cost of Fontlab is equal to the budget I have for fonts, so it&#39;s an intriguing proposition.</font></font></font></font></font></font></font></font></font></font></font>
  - id: 77624
    user: 2438
    date: 2004-10-04T20:59:00
    date_raw: Monday, October 04, 2004 - 8:59 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Yuri explained briefly how to do batch conversions on <a href="http://groups.google.com/groups?&amp;selm=5b7aadb5.0112111639.26a81782%40posting.google.com">comp.fonts</a>: <BR> <BR><blockquote><hr size=0><!-quote-!><font size=1><b>quote:</b></font><p>If you want to convert many Type 1 fonts to OpenType, you may try to use Tools/Transform range... command, then select Fonts in the fonts <BR>list in the &#34;range&#34; list, click the &#34;...&#34; button and then fill the batch converting list with the fonts. Do not forget to select destination format in the list at the bottom &#40;&#34;Transformations&#34; chapter&#41;.<!-/quote-!><hr size=0></blockquote></font></font></font></font></font></font></font></font></font>'
  - id: 77633
    user: 909
    date: 2004-10-04T22:24:00
    date_raw: Monday, October 04, 2004 - 10:24 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Although there are a couple of other advantages to conversion &#40;much smaller file sizes, cross-platform fonts&#41;, it&#39;s hardly a necessity at this time. I say this despite being one of the most visible proponents of OpenType. <BR> <BR>Cheers, <BR> <BR>T</font></font></font></font></font></font></font></font>
