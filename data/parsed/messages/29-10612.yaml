    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">How is this going? I have some opinions &#40;don&#39;t I always&#41; about this. <BR> <BR>� The beautiful androgynous image is so ethereal. the light blue next to it seems appropriate, but that green does not. Could it be a bluer green? <BR>� The images below the adrogy image also seem very jarring. The colors might be complimentary, but ... somehow they seem wrong together, at least in this composition.  they seem unrelated in a non-conceptual way. <BR>� The word DECOSIT, gill elephans seems way to fat. You&#39;ve used geometric faces, this humanist seems out of place. Especially that close to the eurostile. <BR>� The black outline on the cover, on the &#43; symbol also seems out of place. <BR>� And this is going to be wrong coming out of my head, but the roman numerals, for this non-american football watching person said &#34;superbowl&#34;. No, really. that is what i thought of the first time i looked at this.  <BR> <BR>i really need to see a shrink. <BR> <BR>I really like the beautiful photo. I feel the other image is so heavy. It defeats the lightness, the otherworldliness, of the other image.  The pattern works for me. it is light and airy, but somehow because it is so rigid against the photo hmm. can&#39;t wrap my tongue around that one. but i hope you can read my mind. Let&#39;s talk.</font></font></font></font>
