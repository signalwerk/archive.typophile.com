  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi everyone, <BR> <BR>I&#39;ve decided to take advantage of the Critique Forum to test-drive some of  <BR>my designs. First up are the front and back covers of a catalogue. Here goes  <BR>nothing: <BR> <BR><font color="ff0000">:catalogue</font> <BR><b>Decosit 2003</b> - International Trade Fair for upholstery fabrics <BR>25th edition} <BR><i>and</i> <BR><b>DecoContract</b> - a worldwide view on contract interiors <BR> <BR><font color="ff0000">:concept</font> <BR>As the advertising campaign for Decosit &#40;and its sister fair DecoContract&#41; is  <BR>done by an advertising agency, I always have to work with the materials  <BR>they provide. Only the campaign pictures are mandatory. I choose to reuse  <BR>the colour scheme and usually take some liberties with the type treatment. <BR> <BR>This year&#39;s the 25th edition of the trade fair, so I decided to play around the  <BR>concept of Roman numerals XXV. I used this graphic theme both as micro-  <BR>treatment &#40;textile pattern&#41; and macro-treatment &#40;container for the  <BR>DecoContract campaign image&#41;. <BR> <BR>The type family used in this year&#39;s campaign is Foundry Monoline &#40;a radical  <BR>break away from Eurostile which they&#39;ve been using for the past few years ;&#41; &#41;. <BR>The XXV pattern looked interesting enough to me to try and design my own  <BR>characters based on the same simplified geometrical grid &#40;my second ever  <BR>serious venture into type design&#41;. I did some minimal optical corrections,  <BR>but yes: that O and C are &#40;based on&#41; perfect circles, sorry about that. I  <BR>reckon the characters are small enough that it doesn&#39;t hinder. I also know I  <BR>could use <a href="http://www.shinntype.com/" target="_blank"> Nick Shinn</a>&#39;s <a href="http://www.fordesigners.com/products/fonts/view.cfm?CFID=378762&amp;CFTOKEN=20620087&amp;SKU=NS10100" target="_blank"> Monkey</a>, but I&#39;d rather do my own stuff. <BR> <BR>Let me know whaddayathink. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/10613.jpg" alt="Decosit2003"></font></font></font></font>'
