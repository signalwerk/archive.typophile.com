    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><i>&#62; about typeface choice: I think Gill Sans &#40;Kayo?  <BR>I can&#39;t remember the correct name right now&#41; and  <BR>Eurostile don&#39;t fit with the design.</i> <BR> <BR>I know, they&#39;re horrible, aren&#39;t they? Those are the  <BR>official &#34;logos&#34;, not to be touched. I consider it already  <BR>a small victory I convinced them to feature them on  <BR>the inside cover: last year they forced me to use them  <BR>on the front cover. It looked absolutely dreadful!  <BR>Did you really think I would in my right mind use this  <BR>combination of typefaces? ;P <BR> <BR><i>Maybe you can try working with another color on  <BR>the backcover.</i> <BR> <BR>Color scheme is provided by the agency that did the  <BR>advertising campaign; it refers to the ads and  <BR>preliminary flyers. Everything else is in this gray/ <BR>green/olive scheme. I&#39;ll think about what I can do, <BR>also about the big &#39;XXV&#39; on the back covers.</font></font></font></font>'
