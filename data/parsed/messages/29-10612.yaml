    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Et voil�, I lowered the cross-bar of the &#39;A&#39; a little to open up the counter. If  <BR>I do it any more I fear it will start to look too much like a triangle, as the  <BR>type is used fairly small. The &#39;S&#39; is rotated a tiny bit clockwards. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/10682.jpg" alt="Decositype_solid.jpg"> <BR> <BR>Here&#39;s what it looks like when inlined. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/10683.jpg" alt="Decositype_inline.jpg"> <BR> <BR>Actualy, I followed your suggestion and did mirror the back cover. ;&#41; You  <BR>were right. I&#39;ll post a new sample when the interior covers are done as well. <BR> <BR>I&#39;m really hesitating if I should devote more time to the type. On the one  <BR>hand the budget for the catalogue doesn&#39;t warrant it, but on the other hand if  <BR>someone were to say &#34;Hmmm... cute little face&#34; I might consider doing it for  <BR>myself. I&#39;ve always been scared $h!tle$$ to start anything remotely  <BR>resembling type design because I&#39;ve got no formal training at all. Also,  <BR>does the world need another &#39;Monkey&#39;-style typeface when Nick Shinn has  <BR>done it so well? <BR> <BR>Here&#39;s the PDF to allow close-up viewing. <BR> <BR><!--attachment: Decositype_solid-10684.pdf*mime_pdf.gif*application/pdf*6.9*Decositype_solid%2epdf*Decositype_solid%2epdf --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align=left alt="application/pdf">Decositype_solid.pdf<br><a href="http://www.typophile.com/forums/messages/29/Decositype_solid-10684.pdf" target="_blank"><b>Decositype_solid.pdf</b></a> (6.9 k)</td></tr></table></center><!--/attachment--></font></font></font></font>'
