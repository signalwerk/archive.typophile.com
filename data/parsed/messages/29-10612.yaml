    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi everyone, <BR> <BR>I received feedback from the client. They asked for some adjustments: <BR><ul><li>&#39;2003&#39; should be on front cover and make &#39;XXV&#39; larger <LI>Decocontract&#43; picture not in &#39;XXV&#39; as it only exists for 3 years and this could be confusing</li></ul> <BR>I decided to use the plus sign from DecoContract&#43; &#40;the sister fair gets an expanded  <BR>treatment this year&#41; as it emphasises both the &#43; in the name and suggests the  <BR>pairing of both fairs. This time I added the inside covers too. Feel free to tell me what  <BR>you think. <BR> <BR><img src="http://www.typophile.com/forums/messages/29/11058.jpg" alt="Decosit2003_coverfront.jpg"> <BR> <BR><img src="http://www.typophile.com/forums/messages/29/11059.jpg" alt="Decosit2003_coverback.jpg"> <BR> <BR>Here are the PDFs <BR> <BR><!--attachment: Decosit2003_cover1-11060.pdf*mime_pdf.gif*application/pdf*1339.2*Decosit2003_cover1%2epdf*Decosit2003_cover1%2epdf --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align=left alt="application/pdf">Decosit2003_cover1.pdf<br><a href="http://www.typophile.com/forums/messages/29/Decosit2003_cover1-11060.pdf" target="_blank"><b>Decosit2003_cover1.pdf</b></a> (1339.2 k)</td></tr></table></center><!--/attachment--> <BR><!--attachment: Decosit2003_cover2-11061.pdf*mime_pdf.gif*application/pdf*21.9*Decosit2003_cover2%2epdf*Decosit2003_cover2%2epdf --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align=left alt="application/pdf">Decosit2003_cover2.pdf<br><a href="http://www.typophile.com/forums/messages/29/Decosit2003_cover2-11061.pdf" target="_blank"><b>Decosit2003_cover2.pdf</b></a> (21.9 k)</td></tr></table></center><!--/attachment--> <BR><!--attachment: Decosit2003_cover3-11062.pdf*mime_pdf.gif*application/pdf*11.2*Decosit2003_cover3%2epdf*Decosit2003_cover3%2epdf --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align=left alt="application/pdf">Decosit2003_cover3.pdf<br><a href="http://www.typophile.com/forums/messages/29/Decosit2003_cover3-11062.pdf" target="_blank"><b>Decosit2003_cover3.pdf</b></a> (11.2 k)</td></tr></table></center><!--/attachment--> <BR><!--attachment: Decosit2003_cover4-11063.pdf*mime_pdf.gif*application/pdf*13.1*Decosit2003_cover4%2epdf*Decosit2003_cover4%2epdf --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align=left alt="application/pdf">Decosit2003_cover4.pdf<br><a href="http://www.typophile.com/forums/messages/29/Decosit2003_cover4-11063.pdf" target="_blank"><b>Decosit2003_cover4.pdf</b></a> (13.1 k)</td></tr></table></center><!--/attachment--></font></font></font></font>'
