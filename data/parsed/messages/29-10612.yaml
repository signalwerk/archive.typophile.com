    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hmm... your attachments weren&#39;t working yesterday, but now  <BR>I can see it. Odd. <BR> <BR>Anyway, about typeface choice: I think Gill Sans &#40;Kayo? I  <BR>can&#39;t remember the correct name right now&#41; and Eurostile  <BR>don&#39;t fit with the design. <BR> <BR>And, on your backcover, I think you could remove that big  <BR>background &#34;XXV&#34;. This element looks strange with the  <BR>mirroring on inside/outside, imho. Just remove that and I think  <BR>that would be ok. Or you might try working with the plus sign  <BR>on backcover too. <BR> <BR>Do you know how many pages this is going to have? And what  <BR>size is it? <BR> <BR>Another thing. Maybe you can try working with another color  <BR>on the backcover. It seems like back and front cover are  <BR>totally different pieces, even with the same little XXV pattern.  <BR>I&#39;m not so sure about this myself, but you might wanna try  <BR>something.</font></font></font></font>'
