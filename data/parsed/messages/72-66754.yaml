  html: '<font class="dontLookLikeCrap">Do you teach typography and have any great type exercises or assignments you would like to share? Or have you taken a class and had any assignments that were particularly useful?  I am working on the 2nd edition of my book, <i>Type Rules! The designer&#39;s guide to professional typography,</i> to be published by Wiley &amp; Sons, Inc., and will be including educational supplements this time around. I am looking for your ideas and suggestions for assignments which effectively teach practical applications of type. My goal is to make this book an invaluable, informative and instructional teaching tool. Credit will be given for all contributions.  <BR> <BR>Click here &#40;or cut and paste&#41; to download <i>Type Rules!</i> table of contents: <BR>ftp://typestudioftp:<a href="mailto:typestuff@files.thetypestudio.com">typestuff@files.thetypestudio.com</a>/TypeRulesTofC.sit <BR> <BR>Contact me if you have trouble with the download and I will send it to you directly. <BR> <BR><b>The deadline for your contributions is April 4.</b> <BR> <BR>Thanks so much, <BR>Ilene Strizver <BR> <BR>.. .. .. .. .. .. .. .. .. .. .. .. .. .. <BR> <BR><b>THE TYPE STUDIO</b>   <BR>Westport, CT <BR>203.227.5929 <BR><a href="http://www.thetypestudio.com/" target="_blank">http://www.thetypestudio.com/</a> <BR> <BR>~ Type by Design ~</font>'
