  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This Old English type of Font was found on Sports Uniforms.  Very likely the &#34;Champion&#34; brand of Uniform.  This sample is from a photgraph taken in the late 1970&#39;s or early 1980&#39;s.  This Font was likely used for decades before and probably after. <BR> <BR>Can anyone Identify the Font Name or Font Foundary for this and if it is available to purchase? <BR> <BR> <img src="http://www.typophile.com/forums/messages/83/54058.jpg" alt="Old English &#40;?&#41; Letter &#34;S&#34;"></font></font></font></font>
