  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hello people, <BR>these are roughs for a poster about a play in theater called &#34;the child&#34;, written by the Norwegian Jon Fose &#40;propably this is not the correct spelling but I have his name only in greek&#41;. <BR> <BR>The play starts at a bus station where some people are waiting, including a man and a woman who like each other. The next scenes are showing the life of the couple, where the distance between them is growing more and more. <BR> <BR>The subjects that the play is touching, are the gap between people, the emptyness of the relations, the luck of communication and the unspoken words as the unborn child of the couple.  <BR> <BR>The writer himself says that the most important of his plays, is the pause... <BR> <BR>So, there are the solutions I gave for the moment, and I am expecting your views. <BR> <BR>Fonts used: Base, DIN, CF Ray<img src="http://www.typophile.com/forums/messages/29/6934.jpg" alt="poster1"><img src="http://www.typophile.com/forums/messages/29/6935.jpg" alt="poster2"><img src="http://www.typophile.com/forums/messages/29/6936.jpg" alt="poster3a"><img src="http://www.typophile.com/forums/messages/29/6937.gif" alt="poster3b"></font></font></font></font>'
