    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">So, these are the proposals i will send to the cliend. I thought about the earthquake Hrant, but it seems to me it won&#39;t help since earthquake includes the element of trembling, opposite to the stillness of the play. As for the &#34;x&#34; i disagree because i think is suitable to symbolize the canceled process of pregnacy, plus is a strong mark and i need something strong in that part of the poster. <BR> <BR>Colin I tried the xeroxing first thing in the morning and i end up with the lettering in the 2nd poster. Though i am not sure for the lettering  result &#40;maybe they look like lettering for a horror movie&#41;, this is the poster i believe in. It will be pitty if the clients will insist to put color &#40;i am sure they will ask&#41;. In that case i would rather chose the 3d poster. <BR> <BR>Thank you all for your advises. Of course the work didn&#39;t finish so i would be happy with more comments <BR> <BR><img src="http://www.typophile.com/forums/messages/29/6971.jpg" alt="poster1"><img src="http://www.typophile.com/forums/messages/29/6972.jpg" alt="poster2"><img src="http://www.typophile.com/forums/messages/29/6973.jpg" alt="poster3"> <BR> <BR>PS. don&#39;t pay attention to the yellow-gray border...supposed to be the wall behind...</font></font></font></font>
