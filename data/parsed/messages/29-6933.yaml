    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This is great stuff. <BR> <BR>The rip is not bad. The best element is the misaligned benches <BR>showing the disconnect between the couple. <BR> <BR>Because of that darkness and the rip, the fetus imagery  <BR>&#40;especially when it&#39;s red&#41; seems to communicate abortion.   <BR>However, the x works well because it is more understated,  <BR>and I agree that it should be lower. <BR> <BR><a href="http://dictionary.reference.com/search?q=nitpick&amp;r=2">Nitpick</a>: To be concerned with or find fault with insignificant <BR>details. &#40;I wonder if the etymology of this is &#39;knit pick?&#39;&#41;</font></font></font></font>'
