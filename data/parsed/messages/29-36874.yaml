  - id: 61969
    user: 2236
    date: 2004-05-27T11:22:00
    date_raw: Thursday, May 27, 2004 - 11:22 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The first thing I would do, is take it out of the box. I think this will help in evaluating the relationships between letterforms vs. the relationship between letterforms and the box. I think you&#39;re on the right track with the &#34;r&#34;, but I&#39;m not sold on the &#34;F&#34; yet. Outside of the black box, I think you can increase the letter spacing between some of the letters more easily &#40;i-r, m-e for starters&#41;. <BR> <BR>Aloha! <BR>Scott</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 61970
    user: 1014
    date: 2004-05-27T11:23:00
    date_raw: Thursday, May 27, 2004 - 11:23 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Oscar, a few issues here imo .... <BR> <BR>&#42; The dot on the i cutting into the F creates <BR>an odd counter shape and sharpness that <BR>doesn&#39;t fit in with the rounds. <BR>&#42; the Vertical stem widths appear consistent, <BR>but the horizontals are inconsistent. <BR>-- the counters on the m are too tall. <BR>--the crossbar on the F seems too thick. <BR>--the top horizontal stem on the F seems thick <BR>in relation to the other letters, too. <BR>You might set some guides, adjust, <BR>and then eyeball a print out. &#40;Actually, not you <BR>but your friend.&#41; <BR>&#42; the m seems too wide. <BR> <BR>bj</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
