  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">We at Alphabet Design are deeply saddened by the loss of lives resulting from the earthquakes and tsunamis in South and Southeast Asia on December�26. <BR> <BR>To help the relief efforts of the international community we are <b>donating 100% of proceeds of font sales</b> to WorldVision until January 15th, 2005. <BR> <BR><b>Plus, all fonts are 50% off</b> as an added incentive for you to donate today. <BR> <BR>Links to registered charities are also privided. <BR> <BR>Buy fonts and do some good today! <BR><a href="http://www.alphabet-design.com" target="_blank">http://www.alphabet-design.com</a></font></font>
