    html: '<font class="dontLookLikeCrap">Per Daniel&#39;s tagline suggestion: something to the effect of� <BR> <BR>Profitable Real Estate Strategies <BR> <BR>Strategic Real Estate Consulting <BR> <BR>Real Estate Investment Services <BR> <BR>If the services focus on real estate investments within Idaho, then a silhouetted map or some representation of the state of Idaho might work. If the services encompass a larger region, such as the US, then a similar approach can be taken. The same approach can be applied to the world. Of course, the absense of a graphic mark wouldn&#39;t hurt either. <BR> <BR>Aloha! <BR>Scott</font>'
