    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Danel, leaving aside the question of whether it&#39;s appropriate, I don&#39;t think the letterspaced type looks like a mistake. IDAHO aligns nicely with the width of the mark, and the color change makes a longish URL easier to read.</font></font></font></font></font></font></font></font></font></font></font>
