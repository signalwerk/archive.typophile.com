    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">My problem Marc is it is forced. No design should look forced. The letter spacing is design for design sake. This is not an attack, just my opion. Steve still has to address Peters comment. Its not just about design its about marketing.</font></font></font></font></font></font></font></font></font></font>
