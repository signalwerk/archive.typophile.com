    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks to all for the feedback thusfar.  The business purpose is the marketing and sale of real estate investment property in Idaho.  We cater to a wide range of investors.  From the lower end individual that is looking for a smaller single family rental property to the large, possibly multi-party investor looking to invest 10 million in a development project.  The logo needs to cater to both parties and everyone in between.   <BR> <BR>I agree with the potential for confusion given the lack of clarity with regards to type of investment.  Are we an investment brokerage i.e. stocks or we do real estate or what?  However, I&#39;m reluctant to throw a house or some such in the logo as 1&#41; We&#39;re not just talking about houses and 2&#41; Real Estate logo with a house = very common. <BR> <BR>I&#39;m at a loss on how to move forward.</font></font></font></font>
  - id: 87730
    user: 2915
    date: 2004-12-29T13:50:00
    date_raw: Wednesday, December 29, 2004 - 1:50 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Steve, try moving the website to another location in the communications and add a tagline that clairifies the business. What does the mark mean? Is it something that means something in Idaho?</font></font></font>
  - id: 87811
    user: 804
    date: 2004-12-30T09:24:00
    date_raw: Thursday, December 30, 2004 - 9:24 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">At first the yellow triangle with a secondary triangle cut out of it &#40;on the left&#41;, reminded me of a paper airplane...crashing, a few seconds later I realized it was properly a stylized star with most of it missing. It is perhaps clever as an icon, but a bit of a stretch to catch. I do not like it for this reason. <BR>Aligning the 3x I&#39;s is very nice, consistant with the idea of investing-building/stacking.... <BR>Altogether a good start-keep going...</font></font>
