    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Steve, It reads like a brokerage firm and not a real estate company. It needs to be clairified that its real estate and not a stock exchange investment firm. What does the graphic mean? The colors are way to harsh, they look like a farm cooperative, make them more subtitle/upscale &#40;think investment&#41;. I&#39;m not in love with letterspaced type, it looks like a mistake.</font></font></font></font></font></font></font></font></font></font></font></font></font>
