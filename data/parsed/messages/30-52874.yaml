    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Instead of porting everyone&#39;s account info over to a new system &#40;I&#39;m going to get flogged for this&#41; just make everyone sign up again.  It&#39;s a good way to set everyone off on equal footing with a fresh start on a fresh board, and it purges the database of all those people who signed up and never posted</font></font></font></font></font></font></font></font>
