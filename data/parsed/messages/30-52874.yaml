  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">p { font: 10pt arial,helvetica,sans-serif; } <BR> <BR>No one have same &#34;problem&#34; as me, with the fonts in Typophile? I found bit strange to specify such &#34;not at best fonts&#34; for screen for a marvellous Type related forum such Typophile? <BR> <BR>My proposed change is: <BR>p { font: 10pt &#39;Lucida Grande&#39;, &#39;Lucida Sans&#39;, &#39;Trebuchet MS&#39;, verdana, sans-serif; } <BR> <BR>[_] yes <BR>[_] no</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
