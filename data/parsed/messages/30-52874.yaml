    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font face="&#39;Lucida Grande&#39;&#44; &#39;Lucida Sans&#39;&#44; &#39;Trebuchet MS&#39;&#44; verdana&#44; sans-serif">Despite hearing warnings against deleting Windows&#39; &#34;core&#34; fonts, I took a chance and deleted Arial and Times New Roman awhile back. Surprisingly, nothing broke. Web pages use the brower&#39;s default serif or sans serif fonts. Global UI elements that call for Arial are substituted with the much more eye-friendly Lucida Sans Unicode. So, if you&#39;re as sick of looking at Arial as I was, it appears that deleting it won&#39;t screw up Windows XP. &#40;No guarantees, try at your own risk!&#41;</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
