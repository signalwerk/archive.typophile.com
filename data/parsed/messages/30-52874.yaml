  - id: 82019
    user: 1461
    date: 2004-11-09T09:04:00
    date_raw: Tuesday, November 09, 2004 - 9:04 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#34;that we&#39;re sitting on <BR>3.5 years of archived &#40;searchable&#41; content. &#34; <BR> <BR>So...leave the current board as-is in &#39;read-only&#39; mode and get on with the new one ;o&#41; <BR> <BR>The &#39;but we have so much legacy data&#39; is such a dangerous excuse. I see it used constantly in almost every industry and it simply prolongs &#40;and exasperates&#41; the inevitable. ;o&#41; <BR> <BR>My biggest gripe is the fixed-width pages that make the line lengths in here rather hard to scan through.  <BR> <BR>But, hey, this is a free forum put together via the fine folks at punchcut and it has a great group of people, so I don&#39;t want any technology gripes cloud that fact. ;o&#41; <BR> <BR>&#34;If it ain&#39;t broke...&#34; <BR> <BR>Ah, but it is broke. ;o&#41;</font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 82021
    user: 1250
    date: 2004-11-09T09:14:00
    date_raw: Tuesday, November 09, 2004 - 9:14 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">It is indeed seriously broken. <BR>Not just the text display, or even the posting mechanism, but the archives: searching for stuff is working increasingly less, and yesterday I noticed that 11 months of archives seem to be completely missing! <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font></font>'
  - id: 82047
    user: 1160
    date: 2004-11-09T11:17:00
    date_raw: Tuesday, November 09, 2004 - 11:17 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Darrel, I have to agree about the &#34;legacy data&#34; thing. It&#39;s the  <BR>albatross of anybody with large and aging systems. The  <BR>choice between upgrading what you have and starting from <BR>scratch is never easy, but the answer always seems clear -  <BR>upgrading old systems is just prolonging the inevitable. <BR> <BR>Don&#39;t forget that the content is only half of it. Starting from  <BR>scratch also requires porting over people&#39;s account info and  <BR>members&#39; email addresses. Not impossible, but it requires a  <BR>concerted effort that we&#39;re gearing up to do in early &#39;05. <BR> <BR>____ <BR> <BR>Re: &#34;missing&#34; archives. These are merely offline in order to  <BR>save precious &#40;costly&#41; server space. If you need access to  <BR>something specific, Jared is your man.</font></font></font></font></font></font></font></font></font></font>'
