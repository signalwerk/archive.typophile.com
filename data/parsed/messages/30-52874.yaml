  - id: 81675
    user: 1735
    date: 2004-11-06T19:45:00
    date_raw: Saturday, November 06, 2004 - 7:45 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">phpBB or vBulletin would be nice, but the current &#34;upload files to server&#34; option that typophile has really makes it an excelent place with no broken images links, so normal on the other foruns. I don&#39;t think this option is available on those softwares, is it? <BR> <BR>Yes, skip arial <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 81679
    user: 1160
    date: 2004-11-06T22:25:00
    date_raw: Saturday, November 06, 2004 - 10:25 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Believe me, we&#39;ve looked into alternate board software. PHPBB is  <BR>enticing because it&#39;s free &#40;opensource&#41; and because PHP is so  <BR>powerful &#40;customizable&#41;. However, one of our main problems  <BR>with considering a move to another board is that we&#39;re sitting on  <BR>3.5 years of archived &#40;searchable&#41; content. <BR> <BR>So, any discussion about moving &#40;upgrading&#41; to new forum  <BR>software has to include strategies about porting or archiving  <BR>the existing content. PHPBB looks most promising - again  <BR>because it&#39;s customizable. And of course, the ability to post  <BR>images is a must that we have to build in. <BR> <BR>The CSS is another matter entirely... The current Discus software  <BR>and CSS go together like hammers and screws. Discus is built <BR>with proprietary tags that make any CSS usage like covering a  <BR>bad hair day with a band-aid. Suffice it to say, with an updated  <BR>board will come a revamped CSS. <BR> <BR>And, yeah, Lucida Sans is really nice and Trebuchet is nice in  <BR>small doses. Have you Mac OS users noticed that you can  <BR>spec Hoefler Text and Myriad with your HTML &#40;for Mac users of  <BR>course&#41;?</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 81687
    user: 1977
    date: 2004-11-07T01:14:00
    date_raw: Sunday, November 07, 2004 - 1:14 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Start a new phpBB forum from scratch, and then keep this one around, locked to new posts of course, for the archive. <BR> <BR>Even if you have to get rid of all the posts, phpBB is worth it...vBulletin is even better if you don&#39;t mind paying for a licence.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
