    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">You know what I&#39;m going to say, right? Being seen over the rest of the clutter can be as simple as not having any clutter.  <BR>Contrast works as well, if not better, than out doing the doers. Letting the design speak for itself, and say what it  <BR>needs to say, rather than trying to say something similar to what other book covers are saying, is probably more effective  <BR>than a rave review by a &#34;reviewer&#34; who may or may not be trustworthy. Maybe this is cynical, but does anyone trust those  <BR>quotes any more? Did any one ever? The cover in question would not be well served with additional elements on it. The title,  <BR>the colors, and the image are enough to poke you in the eye as is. TMI isn&#39;tjust an acronym for teenage girls. I&#39;m sure this  <BR>is nothing new to you or anyone else that reads this. <BR> <BR> <BR> <BR>Sorry about the bad rag. I&#39;m just trying to prevent horizontal scroll.</font></font>
