    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I disagree with Dan and Sarah. This isn&#39;t a geeky Photoshop how-to book, it&#39;s obviously  <BR>something much edgier. A menopause monologue apparently. This might be slightly  <BR>sexist / misogynistic of me, but crazy works in this case. Think of the menopause  <BR>stereotypes and most of the words that come to mind will be synonyms of crazy. <BR> <BR>The type treatment works with all of that. It&#39;s a little off, a little wild, a little crazy but not  <BR>Charles Manson crazy. And the author&#39;s name is a good size. Being reversed out  <BR>increases the visibility. I get severely annoyed when I see books with no apparent title,  <BR>but the author&#39;s name is so huge it barely fits on the cover. It just seems egotistical to me. <BR> <BR> <BR> <BR> <BR>And for the record, you Europeans started the whole sensitivity thing.  ;&#41;</font></font></font></font></font></font>
