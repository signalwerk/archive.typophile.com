    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Are you talking about kerning existing fonts in graphics apps or fonts you are developing in a font editor? <BR> <BR>Assuming it&#39;s more likely the latter, here&#39;s what a lot of type designers do, briefly: <BR> <BR>Once you have your basic spacing set and things are looking good with unproblematic glyph combinations, you go through and find pairs of glyphs with problematic right and/or left sides &#40;A, L, T, etc.&#41; and then put these in your kerning/metrics editor amongst &#34;normal&#34; or &#34;control&#34; glyphs &#40;usually runs of H and O&#41; and add kerning until you get even spacing or a reasonable facsimile. As a reality check, generate and install the font and set some words, sentences, paragraphs, etc. in a graphics program and go back to the kerning editor if necessary. <BR> <BR>It&#39;s a pretty tedious task, so it&#39;s good to be as systematic about it as you can &#40;e.g., make lists or tables of possible pairs, etc.&#41; and take advantage of tools and shortcuts available &#40;e.g., Kerning Assistance in FontLab and FOG, class kerning, etc.&#41;. The thing NOT to do is just dive in and start kerning pairs at random or to attempt to do kerning before the basic spacing is worked out. I also don&#39;t recommend auto-kerning.</font></font></font></font></font>'
