  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I want to find out how you guys kern. what do you think makes for good kerning? Do you look for specific problematic pairs of letters, or do you try to make the entire words themselves have even &#34;coloring&#34; or weight? Do you treat words first, and then their relationship within sentences? <BR> <BR>I need some experienced advice as how to best approach this. <BR> <BR>thanks!</font></font></font></font></font></font>
