  html: '<font class="dontLookLikeCrap"><b>P22, Holland Fonts, and Baseline Join FontShop</b> <BR><a href="http://www.fontshop.com/virtual/newsletters/mar2005/" target="_blank">http://www.fontshop.com/virtual/newsletters/mar2005/</a> <BR> <BR>........ <BR> <BR><b>New Foundry: <a href="http://www.fontshop.com/showfont.cfm?mID=53" target="_blank">P22</a></b> <BR><a href="http://www.fontshop.com/showfont.cfm?mID=53" target="_blank">http://www.fontshop.com/showfont.cfm?mID=53</a> <BR>Richard Kegler is an art lover. He and his historical experts at P22 are famous for transforming the trademark writing of masters like Leonardo da Vinci, Dard Hunter, Frank Lloyd Wright, and Edward Hopper into handsome fonts. Their faithful digitizations make for great display typography. For proof, just stop by a variety of coffee shop chains who have found scripts like C�zanne ideal for adding warmth and personality to their locations worldwide.  <BR> <BR><b>New Foundry: <a href="http://www.fontshop.com/showfont.cfm?mID=51" target="_blank">Holland Fonts</a></b> <BR><a href="http://www.fontshop.com/showfont.cfm?mID=51" target="_blank">http://www.fontshop.com/showfont.cfm?mID=51</a> <BR>Max Kisman is a globetrotter. His foundry may be named after his homeland, but Max has lived all over the world. The influences of his travels are apparent in his type, from the distinct East Indian flavor of Mata Hari to the Euro-techno Chip and tribal Bfrika. Max&#39;s playful character is also palpable in many of his fonts � see Bebedot, Mundenge Rock, and Quickstep. <BR> <BR><b>New Foundry: <a href="http://www.fontshop.com/showfont.cfm?mID=50" target="_blank">Baseline</a></b> <BR><a href="http://www.fontshop.com/showfont.cfm?mID=50" target="_blank">http://www.fontshop.com/showfont.cfm?mID=50</a> <BR> Nathan Williams is a printmaker. You can smell the ink of the letterpress in his designs. Old hot metal text fonts like Grit Primer and Slab American join hardy wood types such as 57 Rodeo, Country Fang, and Chitchy in recalling an era where the printing was wrought by hand and the prints were one-of-a-kind. <BR> <BR>........ <BR> <BR><b>Free Font of the Month: <a href="http://www.fontshop.com/freefonts" target="_blank">GreenbriarSE</a></b> <BR><a href="http://www.fontshop.com/freefonts" target="_blank">http://www.fontshop.com/freefonts</a> <BR> <BR>Brian Sooy of Altered Ego offers a complimentary weight of his upcoming Greenbriar � a font that takes its inspiration from blackletter forms, distilled to their essence. Bonus: this is FontShop�s first freebie in the OpenType� format! Experience the ease of a single file for both Mac and Windows systems. <BR> <BR>........ <BR> <BR><b><a href="http://www.fontshop.com/virtual/us/fonts/hfusecompetition.html" target="_blank">FUSE Competition:</a> Security</b> <BR><a href="http://www.fontshop.com/virtual/us/fonts/hfusecompetition.html" target="_blank">http://www.fontshop.com/virtual/us/fonts/hfusecompetition.html</a> <BR> <BR>The 15-year-old institution of experimental design is back with a new competition. Your work could be in the next FUSE website and book. <BR> <BR>........ <BR> <BR><b><a href="http://www.fontshop.com/virtual/us/fonts/FontFont_FiFFteen.htm" target="_blank">FiFFteen Exhibition:</a> New York</b> <BR><a href="http://www.fontshop.com/virtual/us/fonts/FontFont_FiFFteen.htm" target="_blank">http://www.fontshop.com/virtual/us/fonts/FontFont_FiFFteen.htm</a> <BR> <BR>This summer, the retrospective exhibition <i>FiFFteen � 15 years of type for independent minds</i> will be shown at in NYC in conjunction with <a href="http://www.typecon.com" target="_blank">TypeCon2005</a>. Details will follow. <BR> <BR>Meanwhile, read more about the show and see photos from its run in <a href="http://www.fontshop.com/virtual/us/fonts/Photos_Manchester.html" target="_blank">Manchester</a> and <a href="http://www.fontshop.com/virtual/us/fonts/Photos_London.html" target="_blank">London</a>. <BR> <BR>........</font>'
