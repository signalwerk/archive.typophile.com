    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Given a sufficiently round type, you could use the power symbol as the U in UPS, or you could &#40;with many sans&#41; use it in place of the O in FOR. I&#39;d play around with that.  <BR> <BR>As for the name, I don&#39;t think they would be in danger. They aren&#39;t in the shipping business, and there are other UPS outfits, e.g. <a href="http://www.minutemanups.com/" target="_blank">http://www.minutemanups.com/</a> &#40;who use a plug in their logo&#41;. <BR> <BR>However, if United Parcel Service does decide to sue them, there will be lots of publicity. So, design a logo you would be proud to see on the 6 o&#39;clock news!</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font