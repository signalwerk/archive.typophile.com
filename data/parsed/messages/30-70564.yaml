    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">It doesn&#39;t come down to imperceptible details. <BR>Now there are obvious serifs on the Optima Nova roman &#34;a&#34; and &#34;c&#34;, where there were none before, just a slight flare. It was that subtle treatment of those terminals that I always admired, and, IMO, made the face the marvelous &#34;neither fish nor fowl&#34; that it was. Now that state of grace has been lost.</font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 101815
    user: 1551
    date: 2005-04-25T18:22:00
    date_raw: Monday, April 25, 2005 - 6:22 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;Now that state of grace has been lost. <BR> <BR>Nick, something may have been lost in elegance at large sizes, but we still have the original design in digital. I suspect that at smaller sizes the new version works better. But designers can try both and see which works better for their purposes, I guess.</font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 101816
    user: 1262
    date: 2005-04-25T18:33:00
    date_raw: Monday, April 25, 2005 - 6:33 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">It hasn&#39;t been lost, Nick, because the old version of Optima &#40;and of Sabon and Frutiger, and any other of the new/next/nova Linotype types&#41; is still available. What we have are <i>additional</i> versions of these types that might be useful for specific projects and purposes. <BR> <BR>In the case of the new Sabon, the redesign is very thorough, going back to Tschichold&#39;s sources and his drawings for the foundry version, before he adapted the design to the unitised widths of mechanical setting. I think of it less as a new Sabon as simply a new Garamond. However one looks at it, it is an additional typeface for designers to work with, and not something that replaces the older Sabon.</font></font></font></font></font></font></font></font></font></font></font>
  - id: 101843
    user: 4019
    date: 2005-04-25T22:06:00
    date_raw: Monday, April 25, 2005 - 10:06 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Well said, and for the curious, there is a fabulous and as yet unreleased Linotron version of Optima optimized for very small sizes by ... Matthew Carter.</font></font></font></font></font></font></font></font></font></font>
  - id: 101862
    user: scoffer-users
    date: 2005-04-26T03:12:00
    date_raw: Tuesday, April 26, 2005 - 3:12 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I didn&#39;t intend to suggest that the original Optima is no longer avaialble. My point is that the &#34;Optima&#34; quality has been lost in the new version, by over-serifization. <BR> <BR>As for italics, IMO the &#34;proper&#34; italic for Frutuger Next is far more successful than that of Optima Nova, especially in the heavy weights, which are quite gorgeous. The synergies which make one update a success but not another are enigmatically circumstantial. <BR> <BR>John, I think most of us agree that the new &#34;Sabon&#34; is really more of a Garamond, so closely was the personality of Tschicold&#39;s design of the original invested in the openly-fitted, duplexed roman&#43;italic kind of layout in which it excelled. Bill, there is something about that kind of layout which must have appealed to Tracy. <BR> <BR>There is nothing inherently wrong with having Italic and Roman with the same character count. It&#39;s a very modernist idea, and you will find that the mid 19th century moderns &#40;Scotches&#41; have this feature of an equivalence in tonality and count. The idea, mid 20th C, that a sloped roman was a desirable form of italic, had a lot going for it. After all, this was the dominant form of the 20th century sans italic &#40;sans Gill Sans&#41;, and a matching form of serifed italicization is logical.  <BR> <BR>I&#39;m not sure how much bearing my criticism has on the usefulness of Optima Nova today, but I think that when typographers familiarize themselves with typefaces, they do form an impression based, not just on the functionality of the way the face behaves, but also on an awareness of the personality and virtue of the letterforms under close scrutiny. <BR> <BR>Ultimately, my take on revivals is that tinkering is a mistake. A revival should be either scrupulously faithful to the original, or respect it enough to put some design distance between the two, with a consistently new interpretation based on a fresh insight into the way things have changed between then and now.</font></font></font></font></font></font></font></font></font>
  - id: 101905
    user: 1551
    date: 2005-04-26T07:58:00
    date_raw: Tuesday, April 26, 2005 - 7:58 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;something about that kind of layout which must have appealed to Tracy <BR> <BR>Was Tracy the supervisor of Sabon for Linotype? If so, then there is an obvious reason: Linotype machinery, I have read, requires that the italic character is the same width as the corresponding roman character.  <BR> <BR>Your point about revivals is plausible, but I don&#39;t know it it&#39;s true. I personally am happy that Zapf had a chance to re-make the face in the way he thought most appropriate for digital. Time will tell, I guess, how useful it is compared to the original digitization. I guess I would be interested in whether the serifs on the a and c were Zapf&#39;s idea or Kobayashi&#39;s. I suspect they were Zapf&#39;s.</font></font></font></font></font></font></font></font>'
