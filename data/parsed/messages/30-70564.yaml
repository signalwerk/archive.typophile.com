    date_raw: Saturday, April 23, 2005 - 7:51 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This is a great description and makes the book seem essential. I disagree with but one point, the last. I have always had the feeling that many works of art and craft owed their perpetual greatness to the overcoming of the merely temporary constraint that was put in the craftsman/artist&#39;s way at the time the work was being made. In other words, it was the constraint which inspired the artist to greatness, and that is not invalidated in later generations when the constraint is removed. Just to give some silly examples, is Shakespeare any less great because he couldn&#39;t say all the things he could have said today, and, today, would have said, just because he could have? Is Mozart&#39;s music now invalid because he didn&#39;t know chromaticism or the 12-tone system? Is Bach invalid because he had none of our modern instruments? It is interesting to note as a &#39;case&#39; that Forster&#39;s unpublished novel, in which he discusses everything he couldn&#39;t, is his weakest. Is any type less good because of the technical constraints which exist at the time it was made? Are the types we make today less good because of the constraints &#40;mostly indolence, I fear!&#41; that exist for us today? What, for that matter, is more appealing about type than its constraints? Isn&#39;t it just because of its constraints, and the incalculable lure there is in the feeling of overcoming, that we wish to make type? Isn&#39;t constraint the very reason we are interested in type? What is Goethe&#39;s famous remark? Something like, &#39;Man lebt solang er strebt&#39;? Man lives so long as he strives? <BR> <BR>Actually, checking on the source, I see I err somewhat. It is, &#39;Es irrt der Mensch, solang er strebt&#39; Man errs as long as he strives.  <BR> <BR>Yet in context, the words are spoken by God to the Devil, the question is the tempting of Faust. What God roughly says is, So long as man lives on the earth, you will not be forbidden to tempt him, for man errs as long as he strives.  <BR> <BR>The Devil thanks God for this sentiment politely, pointing out, in Kaufmann&#39;s translation that he wants them living, and &#39;When corpses come, I have just left the house--I feel as does the cat about the mouse.&#39;  <BR> <BR>Anyway, what art/craft is about constraint if type is not?</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 101597
    user: 1262
    date: 2005-04-23T12:10:00
    date_raw: Saturday, April 23, 2005 - 12:10 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">In any given typeface &#40;poem, painting, sonata, dinner&#41; one needs to distinguish three formal achievements that may be present: the brilliant fittedness of form to constraint &#40;when the the constraint becomes part of the architecture&#41;, the bravura or virtuoso overcoming of constraint &#40;the demonstration that the constraint was not so constraining as everyone else had thought&#41;, and the optimal compromise &#40;when the constraint can be neither worked to advantage nor overcome, but must be accepted and the best limited solution found&#41;. Of course, it is unusual to find all three achievements in a single work. <BR> <BR>Forrest mentions Sabon, which is a very good example of a work with deliberately imposed and considerable constraints. Most people agree, I think, that the lowercase italic <i>o</i> in Sabon is a disaster, excusable only on account of the constraints of duplexing and unitising. Alternatively, the italic <i>o</i> could be considered an achievement of the third kind: an optimal compromise within the terms of the constraints. This kind of achievement is seldom valued very highly, and most people do not recognise it as an achievement at all. But there are few things more useful to consider when trying to get into the head of the maker of a thing: to examine the part that doesn&#39;t quite seem to work, to understand why it has been made that way, and to grasp that, under the constraints, it is indeed the best solution that could be found. <BR> <BR>But the optimal compromise should be seen as the achievement that the maker would most like to replace or revise, if the constraints were lifted. There is no way that Tschichold wanted to make that italic <i>o</i> so wide &#40;or the roman <i>a</i> -- and we have his drawings to confirm this&#41;. If the constraints were lifted, i.e. if he had the chance to revise the typeface for new typesetting systems that did not impose the particular duplexing and unitising constraints of Linotype and Monotype, but which allowed much greater refinement in the widths of letters, I have little doubt that he would have removed as many compromises as possible.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 101665
    user: scoffer-users
