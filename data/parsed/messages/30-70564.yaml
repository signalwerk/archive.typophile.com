    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">You aren&#39;t impressed by Optima nova, even though it was done by Hermann Zapf, too? I imagine that Optima nova is the way that he always <i>wanted</i> Optima to be.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 101680
    user: 3553
    date: 2005-04-24T13:57:00
    date_raw: Sunday, April 24, 2005 - 1:57 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I was looking at the samples of Optima Nova, and thinking <BR>that the regular weight italic&#39;s slant to the right made <BR>it look like it was going to fall over. <BR> <BR>This was set in Optima nova : <BR> <BR>&#34; We use the letters of our alphabet every day with <BR>the utmost ease and unconcern, taking them almost <BR>as much for granted as the air we breath.  We do <BR>not realize that each of these letters is at our <BR>service today only as the result of a long and <BR>laboriously slow process of evolution in the age- <BR>old art of writing. &#34; <BR> <BR>&#34; Wir benutzen die Buchstaben unseres Alphabets <BR>jeden Tag mit aller Ruhe und Sorglosigkeit; <BR>betrachten sie als etwas Selbstverst�ndliches, <BR>wie die Luft, die wir atmen.  Wir nehmen nicht <BR>zur Kenntnis, da� jeder dieser uns zur Verf�gung <BR>stehenden Buchstaben, das Ergebnis eines langen <BR>und m�hevollen Entwicklungsprozesses der <BR>jahrundertealten Kunst des Schreibens ist. &#34; <BR> <BR>  Douglas C. McMurtrie <BR> <BR> <BR>AS</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 101704
    user: 5605
    date: 2005-04-24T19:57:00
    date_raw: Sunday, April 24, 2005 - 7:57 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The problem with technologically imposed constraints is that they&#39;re essentially arbitrary: the machine tells you what you can and cannot do, rather than you rationally deciding what does and doesn&#39;t work aesthetically or functionally. While compositors and typesetters would have been fools to not welcome the Linotype and the Monotype with open arms, it seems undeniable to me that the work of those who attempted to design patterns for letters got a lot harder, for no reason other than that things they were easily able to do with hand set type weren&#39;t possible with the new technologies. <BR> <BR>By duplexing italics onto the matrices with the romans, Linotype essentially broke the ancient function of italic, which was to be a more economical alternative to roman type. Granted, that function had been lost already, largely, but suddenly it became a law that could only be broken at great cost. Next to that, losing the ability to kern seems somewhat trivial. <BR> <BR>Yes, Sabon was a beautiful technical achievement, and Tschichold deserves much credit for creating a typeface that was both serviceable and elegant given those constraints. But take away the context in which it was designed, and you just have another garamond type. I <a href="http://www.pushby.com/forrest/typ/arc/007973.html">talk about this on my blog</a> &#40;somewhat hamfistedly, because I&#39;m still wrestling with this issue in my head&#41;. I believe that Sabon has the cachet among typographers that it does because of Tschichold&#39;s near-unique achievement in making an identical typeface for three different typesetting systems, rather than any inherent beauty in the typeface itself. We&#39;re praising the constraints rather than praising the product. Or so I believe. <BR> <BR>And when you read Southall&#39;s book, you will see that attempting to grapple with technological constraints has turned promising projects into epic trainwrecks far more often than producing Sabons. Walter Tracy in <i>Letters of Credit</i> and Stanley Morison in <i>A Tally of Types</i> allude to some of these disasters as well, although not as explicitly. <BR> <BR>The Renaissance masters sharply limited the primary colors in their palettes, and worked with very austere geometry and forced perspectives, and produced some of the greatest art the world has ever seen. But they chose those constraints, in large part &#40;although there&#39;s an argument to be made that they were making the best of what they had, given the relative paucity of vivid pigments during the Renaissance&#41;, instead of having them arbitrarily imposed on them. I think type still has a ways to go until the technological constraints in digital typeface design are low enough that we can impose new ones of our own choosing without tangling with our technology.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 101713
    user: 4019
    date: 2005-04-24T23:51:00
    date_raw: Sunday, April 24, 2005 - 11:51 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">None of this explains why Tracy chose to set Letters of Credit in photo Sabon, when he had thousands of other &#39;non-compromised&#39; typefaces to choose from. Granted, he understood a lot more about type and typesetting than any of us.  <BR> <BR>It is very easy to say what is wrong with traditional Sabon. Those are relatively easy insights to arrive at, even though we all feel we come to them only after exhausting study. &#40;I have no comment on the redesign.&#41; It takes considerably more acute analysis to discover what is right about it. Why did Tracy choose just that seemingly hopelessly compromised typeface for his masterpiece? What is it about Sabon that appealed to him so greatly? What lessons are we missing here?</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 101727
    user: scoffer-users
    date: 2005-04-25T05:09:00
    date_raw: Monday, April 25, 2005 - 5:09 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;You aren&#39;t impressed by Optima nova, even though it was done by Hermann Zapf, too? I imagine that Optima nova is the way that he always wanted Optima to be. <BR> <BR>Perhaps he has always wanted a proper italic for Optima, but things don&#39;t always turn out as well as hoped.  <BR> <BR>The contribution of punchcutter August Rosenberger to Palatino and Optima was crucial; he was, after all, the designer of the incomparable &#40;metal&#41; Bauer Bodoni.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 101751
    user: 4019
    date: 2005-04-25T09:57:00
    date_raw: Monday, April 25, 2005 - 9:57 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">What Zapf may want from type at this point is almost as little known as what Heidegger wanted of God late in life. There are two fallacies here. The first is that Optima Nova represents Zapf&#39;s final wishes. The second is that his final wishes are typographically definitive.  <BR> <BR>In type, you are only as good as your collaborators. Your final wishes are interesting but do not necessarily result in better design. <BR> <BR>Type is not art, and cannot be treated as art. There is little room for the artist&#39;s viewpoint either in design or in criticism. This is what Tracy was attempting to teach. It is really striking to me, again and again, how the best type is so often produced by people who are not great intellectuals, not great aesthetes, not great thinkers - people who can often barely spell, and probably can&#39;t write and can&#39;t really think well as we should probably define it. The best type people are often rather, well, I don&#39;t want to say strikingly grotty, or something really classist, but how else to get the point across?  <BR> <BR>Finally, just a little technical point. Anybody who thinks Zapf would consider definitive a version of Optima designed under the limitations of the Postscript grid is naive. I mean, he does have an eye. <BR> <BR>So in type, you&#39;re only as good as your collaborators. But consider this: in digital we have so much freedom that Zapf did not have in Optima. But in Lino metal, he had one crucial freedom we do not have: infinite, seemless variation of curve and stroke, well beyond the capabilities of the ignoble Postscript grid. So one might say, although I don&#39;t like to, that in digital type, you&#39;re only as good as your maximum grid. 1,000 x 1,000 is not enough for a designer of the quality of Zapf, or anyone else really interested in achieving definitive statements. That is why some nuts today are still designing with Ikarus. A 15,000 x 15,000 grid really does let you say what you want to say - even when it is just the simple technical matter of duplicating the quality of an historical or pre-Postscript design.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 101758
    user: 1551
    date: 2005-04-25T11:11:00
    date_raw: Monday, April 25, 2005 - 11:11 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#62;Type is not art, and cannot be treated as art. <BR> <BR>Type is both art and craft, not purely one or the other. Some are greater artists, such as Goudy and Zapf, and some are greater craftsmen, such as Benton.  <BR> <BR>Though I have not seen it in action, to my eye Optima Nova is a definite improvement on the old metal face. The original Optima is a fabulous artistic achievement, but had craft problems - it was too light and grey at smaller sizes. The new version seems to correct this fault, though as I say I have not seen it in action.</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
