  - id: 101988
    user: scoffer-users
    date: 2005-04-26T19:02:00
    date_raw: Tuesday, April 26, 2005 - 7:02 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><img src="http://www.typophile.com/forums/messages/30/70844.jpg" alt="ract2"> <BR> <BR>Text. <BR> <BR>I also prefer the original scooped out &#34;f&#34;. That feature is an example of a constraint &#40;no f_ ligatures&#41; causing an interesting character shape &#40;same idea in Palatino&#41;. It&#39;s an integral part of the typeface&#39;s personality; changing it changes the personality of the typeface; with their longer arms and angled trim, the r and f of the Nova alter the open, even color of the type, taking the initial simple rigor in a smoother and more complex direction. This is a quality of digital type &#40;measurable, no doubt, by Fourier patterns&#41; which has its merits, but in a pre-digital era typeface design, it doesn&#39;t appeal to a purist like me.  <BR> <BR><img src="http://www.typophile.com/forums/messages/30/70845.jpg" alt="fi_opt"> <BR> <BR>Enough of criticizing Hermann Zapf, how about some praise? Speaking of the way that technology and opportune collaboration influence the design of type, what more awesome example is there than Zapf and Twardoch&#39;s &#34;Zapfino Extra Pro&#34;, with its mind-boggling deployment of OpenType contextual alternates?</font></font></font>
