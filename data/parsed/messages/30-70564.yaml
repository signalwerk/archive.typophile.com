  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I ordered this book directly from the British Library Press shortly after reading the press release describing it here, and received it &#40;along with several other books�I have poor self-restraint&#41; about a week later. I just finished reading it, and I figured Typophiles would be interested in it, so here are some brief notes on it. I&#39;ll probably write a full review for my &#40;neglected&#41; blog later. <BR> <BR>The book covers what Southall calls the &#34;typographic century&#34; from 1889 &#40;with the introduction of the Monotype and line casters&#41; through the mid-1990s. It&#39;s no tour de force of reasoning about type design, like Walter Tracy&#39;s Letters of Credit, but is instead an excellent summary of printing technologies and the effects those technologies have had on the practice of crafting type. With each new technology, he discusses the mechanical aspects affecting reproduction of character images, and then discusses the compromises necessary to produce effective designs for that technology. <BR> <BR>He draws several useful relationships, defining type design as the interaction between a client, a designer, and a producer, and shows how the dynamics between these three roles changed as the century progressed. This is informative in several cases, particularly when he discusses the various arguments Stanley Morison got into with the Monotype drafting offices over the design of Eric Gill&#39;s Perpetua�a conflict Southall uses to illuminate how the normally more-or-less reasonable Morison didn&#39;t trust or respect the Monotype drafters, a conflict Southall puts down to Morison refusing to believe that the draughtsmen at Monotype understood the machinery better than he did. <BR> <BR>One of the most striking things about the book is the manner in which it shows how the history of type design follows the contour of 20th century technology in the larger world, starting in mechanized industrial processes, proceeding into a quasi-scientific High Church of Technology &#40;there&#39;s a hilarious picture of Adrian Frutiger proofing drawings of Univers while Ladislas Mandel and another Photon employee look on in their lab coats&#41; before dematerializing into pure information at the end of the century. &#34;Dematerializing&#34; is a word he uses frequently, as punches, physical models, matrices, and finally even drawings of characters disappear. <BR> <BR>Instead of ending, like most of us would expect, with the development of Postscript and laser imagesetters, or perhaps OpenType, the last chapter of the book is a fascinating study of a project Southall did with Ladislas Mandel for US West Dex, designing a family of type for phone books. Mandel worked with Adrian Frutiger on the development of phototype, as well as the design of Univers, so he&#39;s no stranger to technical innovation, but when confronted by the demanding combination of tiny type and low-quality printing, he judges Postscript fonts unacceptable, insisting on pixel accuracy along with scalability. A fascinating discussion follows, with Southall describing the process by which he used Donald Knuth&#39;s Metafont to create a family of typefaces in which scalable outlines are combined with features &#40;i.e. ink traps and the quasi-serifs used to compensate for ink spread&#41; that stay the same absolute size regardless of the point size of the type. <BR> <BR>The clear implication of Southall&#39;s conclusion is that the technology of typeface development is still under development, and that none of the current solutions are sufficient to solve many of the real-world type design problems that were easily solved by hand-cut type 100 years ago. After reading about the elegant &#40;although laborious, and somewhat crufty&#41; solution Southall devised for encoding fonts for US West, Adobe&#39;s &#34;optical sizing&#34; seems like kind of a halfassed joke, even though designing fonts for Metafont is a nightmare &#40;as Southall&#39;s chapter on TeX, with which he has long experience, makes perfectly clear&#41;. <BR> <BR>The book is a fun read and pulls together details from a variety of sources so wide that few of us are likely to have encountered many of them before. It deserves a wider audience than it will receive, I&#39;m afraid�I think any digital type designer could gain a huge amount from paying attention to the problems encountered by type designers in older technologies, as well as the constraints they erected to deal with them. It also makes me appreciate achievements like Times Roman and Sabon all the more, even while recognizing that what made them triumphs over constraint in the past renders them somewhat superfluous today. Anyone who&#39;s read this far owes it to themselves to read the book.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
