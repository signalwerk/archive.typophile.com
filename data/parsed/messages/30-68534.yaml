  date: 2005-03-31T23:58:00
  date_raw: Thursday, March 31, 2005 - 11:58 pm
  votes: null
  html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">SOTA is seeking images of lettering from New York City for possible inclusion on the TypeCon2005 website and in other visual material associated with the conference. We want to showcase New York&#39;s eclectic typographic flavor! <BR> <BR>From funky and chunky to slim and elegant, lettering from billboards, graffiti, retail signage, glass gilding, found typography and more are welcome. Images can be old or new, but please only offer your own photographs or those that you are authorized to submit for publication. We&#39;ll need high quality high-res files for possible use in both print and onscreen. Please email me at tamye at typesociety.org with URLs of your image galleries or a zipped archive of thumbnails for review if you&#39;re interested in participating. <BR> <BR>TypeCon2005: Alphabet City | July 20-24, 2005 | <a href="http://www.typecon.com" target="_blank">www.typecon.com</a></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
comments:
  - id: 98509
    user: 1817
    date: 2005-04-01T00:16:00
    date_raw: Friday, April 01, 2005 - 12:16 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><img src="http://www.typophile.com/forums/messages/30/68537.jpg" alt=""> <BR> <BR>this is classic NY lettering... 1984, Brooklyn Heights fire box... IND&#42;500 tag... taken with a Nikon FM-2 on Polaroid Intant 35mm Slide film &#40;an 80s attempt to create quick news/sports film&#41;. I don&#39;t know if it&#39;s what you want though.  <BR> <BR>the Polaroid slide film was very grainy and looked like RGB with a strange diffrent Red channel. Blacks tend to look purple and Red is brilliant usually. It is it&#39;s own animal. But for graffiti it is perfect. <BR> <BR>the original is 3000px x 2029px  <BR> <BR>Alphabet city is not the place I remember it&#39;s now a mall and CGGB&#39;s is now practically the Hard Rock Cafe.. they ruined my town.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 98588
    user: 1947
    date: 2005-04-01T15:03:00
    date_raw: Friday, April 01, 2005 - 3:03 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">If its any consolation Vincent, you can still get shot and killed in Alphabet City. Although I&#39;ll admit, not as often as 10 years ago. <BR> <BR>ANd while the rest of NYC has begun to smell more and more like a mall, the real Alphabet City &#40;Avenues A, B, C, and D&#41; could never be mistaken for one. <BR> <BR>Loisada.</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 98618
    user: 1817
    date: 2005-04-02T01:37:00
    date_raw: Saturday, April 02, 2005 - 1:37 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I know Rudy put police with dogs in the lower east side and then in the late eighties art galleries started opening. I went to see a friends show and it looked like a scene from Batman where there were only cops and dogs and clean streets... not a bit like the needle park and shooting gallery it use to be. <BR> <BR>But I have been told by my old friends that St. Mark&#39;s Place is no longer the way it use to look and someone stole the cube at Astor Place. <BR> <BR>vinnie</font></font></font></font></font></font></font></font></font></font></font></font></font>
