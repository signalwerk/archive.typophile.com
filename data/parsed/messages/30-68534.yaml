    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">St. Mark&#39;s and the surrounding area is reasonably clean and commercial.  However, I&#39;ve never been there when it was anything but. <BR> <BR>The Astor Place cube has not been stolen, but it has been removed for cleaning or fixing or something official.  In the meantime, there&#39;s a lot of performance art installations there.  They&#39;re going to put it back sometime, hopefully soon. <BR> <BR>--an NYU kid</font></font></font></font></font></font></font></font></font></font>
