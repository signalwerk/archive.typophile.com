    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;ll have to check for The Alamo &#40;the name of the cube in Astor Place&#41; the last time I was there it was in place, but there is a lot of construction going on, the  Cooper Union is building a new building. <BR> <BR>As for the galleries on the Lower East Side, it is amazing. I remember going down to Rivington Street in the late 80&#39;s and thinking I was decending into hell, but now... smell the cappucino.  <BR> <BR>Better fed than dead I suppose.</font></font></font></font></font></font></font></font></font></font></font>
