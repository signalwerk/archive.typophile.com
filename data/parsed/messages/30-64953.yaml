  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I�m looking for a complete list of alphabets produced by Photo-Lettering Inc. I have a copy of Alphabet Thesaurus Vol.3 but this book doesn�t show all their typefaces. In the foreword of this book the authors mention a seperate companion book with one-line showings of all their 6500 alphabets but I can�t find any information about this book &#40;has it ever been released and if so, what is the title of this book?&#41;. <BR>So if anybody can help me finding a complete list of the Photo-Lettering library I would be very grateful. <BR> <BR>Thanks in advance, <BR>Sander</font></font></font></font></font>
