    html: '<font class="dontLookLikeCrap">Did anybody happen to notice this tidbit? <BR> <BR><i>Photo-Lettering: Back to the Future <BR>House Industries purchased the what remained of the Photo-Lettering display type collection in 2003. They have since partnered with dutch type master and visionary Erik van Blokland and prolific designer Christian Schwartz to revive the collection and create a new portal for vending the timeless classics as well as new creations. Rich Roat describes how the PLINC partnership will combine the timeless creativity of the original PLINC contributing artists with a modern technology to make some of the more unique elements of the collection  <BR>available again.</i></font>'
