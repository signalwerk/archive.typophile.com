    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Actually, what I did was to forget the bloody semicolon at the end of the line. I put it in, &amp; it now compiles &#40;haven�t tested it yet, though&#41;. The features area has REALLY small type in my display. <BR> <BR>BTW, while it compiles, it isn�t really right;I suppose it should be limited to Greek <BR> <BR> <BR>feature liga { # Standard Ligatures <BR> # Latin <BR>    sub hyphen hyphen hyphen hyphen hyphen hyphen hyphen hyphen hyphen by threeemdash; <BR>    sub hyphen hyphen hyphen hyphen hyphen hyphen by twoemdash; <BR>    sub hyphen hyphen hyphen by emdash; <BR>    sub hyphen hyphen by endash; <BR>    sub f f i by f_f_i; <BR>    sub f f l by f_f_l; <BR>    sub f f by f_f; <BR>    sub f i by f_i; <BR>    sub f l by f_l; <BR>    sub f agrave by f_agrave; <BR>    sub f egrave by f_egrave; <BR>    sub f igrave by f_igrave; <BR>    sub f ograve by f_ograve; <BR>    sub f ugrave by f_ugrave; <BR>    sub \uni03B6 \uni03C1 by zeta_rho; <BR>    sub \uni03BE \uni03C1 by xi_rho; <BR>    sub \uni03C7 \uni03C1 by chi_rho; <BR>} liga; <BR> <BR>Thanks in advance, <BR> <BR>Charles</font></font></font>'
  - id: 87491
    user: 1262
    date: 2004-12-25T14:44:00
    date_raw: Saturday, December 25, 2004 - 2:44 pm
    votes: null
    html: '<font class="dontLookLikeCrap">You don&#39;t need the slashes in this context: <BR> <BR> sub uni03B6 uni03C1 by zeta_rho;  <BR> <BR>You only need the slashes when entering glyph names in preview text boxes, and then they should be / not \. <BR> <BR>The backslash is only used for actual Unicode values, e.g. \03B6, again in preview text boxes. <BR> <BR>Try dropping the slashes from your feature code and see if it compiles.</font>'
