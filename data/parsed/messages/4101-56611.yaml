  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;m making a font that has both the Latin characters and Greek characters &#40;including Greek extended&#41;. The rho has a tail, so I need to make a ligature for a rho following a zeta, xi, and chi. Making the glyphs is not the problem. <BR> <BR>No matter how I put these ligatures in the &#42;liga&#42; feature in FontLab, it won&#39;t compile. Obviously, I&#39;m doing something wrong -- can anyone tell me the proper form? <BR> <BR>Oh yes, what is the proper name for a swash small-cap R? R.scswash? <BR> <BR>Thanks, <BR> <BR>Charles</font></font></font></font></font>
