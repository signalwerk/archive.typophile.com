  html: '<font class="dontLookLikeCrap">[Vladimir Yefimov asked me to post this press release to Typophile.] <BR> <BR> <BR><b>TypeArt�05: The winners</b> <BR> <BR>The judging of TypeArt�05, an international Cyrillic type design competition, <BR>took place in Moscow on Fryday, 18th March 2005, at the ParaType office &#40;47 Nakhimovsky Prospect, 117418, Moscow, Russia&#41;. <BR> <BR>The contest was judged by Nikolay Dubina, of ProDTP &#40;Moscow&#41;; Yuri Gordon, of LetterHead &#40;Moscow&#41;; Dmitry Kirsanov, of Moscow State University of Printing Arts; Tagir Safayev, of Higher Academic School of Graphic Design &#40;Moscow&#41;; and Vladimir Yefimov, of ParaType &#40;Moscow&#41;. The jury was chaired by Vladimir Yefimov. <BR> <BR>Ninety two designers from nine countries�Armenia, Bulgaria, Canada, Germany, Great Britain, Russia, Serbia and Montenegro, Ukraine, United States�took part in the competition; one hundred seventy four entries competed in five design categories: Text, Display, Text/Display Type Systems, Type Superfamilies, and Pi Fonts typefaces. Twenty four winning entries have been adjudged Awards of Excellence in Type Design. <BR> <BR>Fourteen Cyrillic text typefaces &#40;forty four styles&#41; were submitted by thirteen designers. Prizes have been awarded to: <BR>1.	Helvetica Linotype by John Hudson &#40;Canada&#41; <BR>2.	Corbel by Jeremy Tankard &#40;England&#41; <BR>3.	Calibri by Luc&#40;as&#41; de Groot &#40;Germany&#41; <BR>4.	TheAntiqua by Luc&#40;as&#41; de Groot &#40;Germany&#41; <BR> <BR>One hundred twenty one Cyrillic display typefaces &#40;one hundred eighty four styles&#41; were submitted by sixty nine designers. Prizes have been awarded to: <BR>1.	Daiga by Ekaterina Maslova &#40;Russia&#41; <BR>2.	EZZ by Anastasia Davydchik &#40;Russia&#41; <BR>3.	Fourty-Nine Face by Aleksandra Korolkova &#40;Russia&#41; <BR>4.	Polie by Vuga Radulovi&amp;#263; &#40;Serbia and Montenegro&#41; <BR>5.	UniOpt by Viktor Kharik &#40;Ukraine/Germany&#41; <BR>6.	P22 Operina by James Grieshaber &#40;USA&#41; <BR>7.	Jedrilica by Ivana Daki&amp;#263; &#40;Serbia and Montenegro&#41; <BR>8.	SPQR Caps by Sergei Egorov &#40;USA&#41; <BR>9	Tikhy Chas by Elena Kolesnikova &#40;Russia&#41; <BR>10.	Kamysh by Tatyana Malakhova &#40;Russia&#41; <BR>11.	DR Galushki by Dmitry Rastvortsev &#40;Ukraine&#41; <BR>12.	Parangon Poluustav by Anatoly Kudryavtsev &#40;Russia&#41; <BR>13.	Parangon Ustav by Anatoly Kudryavtsev &#40;Russia&#41; <BR>14.	Multicross Cyr by Dmitry Greshnev &#40;Russia&#41; <BR>15.	Sobor_Vyaz� by Ivan Sharenkov &#40;Russia&#41; <BR> <BR>Eighteen Cyrillic text/display type systems &#40;forty styles&#41; were submitted by eleven designers. Prizes have been awarded to: <BR>1.	Candara by Gary Munch &#40;USA&#41; <BR>2.	Bucentoro by Sergei Egorov &#40;USA&#41; <BR> <BR>Two Cyrillic type superfamilies &#40;fifty seven styles&#41; were submitted by two designers, but the jury have decided not award any entry at this category. <BR> <BR>Twenty Cyrillic pi-fonts &#40;twenty six styles&#41; were submitted by fourteen designers. Prizes have been awarded to: <BR>1.	Vykhod est� by Kirill Sirotin &#40;Russia&#41; <BR>2.	Blooming Meadow by Viktor Kharik &#40;Ukraine/Germany&#41; <BR>3.	Astra by Andrey Belonogov &#40;Russia&#41; <BR> <BR>Selected entries will be shown at the Awards Exhibition in Moscow that will take place in Moscow&#39;s Central Artist&#39;s Hall during 11th Specialized Exhibition of Advertising �Dizayn i Reklama� &#40;Design and Advertising&#41; from 5 to 9 April 2005.  <BR> <BR>The awards ceremony will take place in Moscow&#39;s Central Artist&#39;s Hall during 11th Specialized Exhibition of Advertising �Dizayn i Reklama�. The proper date of the awards ceremony will be announced later on the official contest Web-site <a href="http://www.typeart.ru" target="_blank">www.typeart.ru</a> <BR> <BR>Our congratulations to the winners! <BR> <BR><i>The Organizing Committee of TypeArt�05</i></font>'
