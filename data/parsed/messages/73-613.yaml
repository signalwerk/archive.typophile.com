    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"> 1. The TDC deadline is Monday... <BR>2. I hope bukva:raz! happens again &#40;it was free to enter&#41;, since it&#39;s the only one with a strong non-Latin angle. <BR>3. Morisawa &#40;every three years&#41; is great because it&#39;s free to enter, they don&#39;t bother with categories, and there are large monetary prizes. The bad things are that -if you win- Adobe gets first dibs on licensing your design for a year &#40;although: they rarely do; I&#39;m not clear if you&#39;re allowed to sell it yourself or not - I think you are&#41;, and that it&#39;s only Latin and Japanese. Note: Brady was fired from Adobe &#40;bad econmomy, I guess&#41;, and Slimbach has replaced him on the Mori jury. <BR>4. There&#39;s also Linotype&#39;s contest, held every two years &#40;I think&#41;. It&#39;s free to enter, but again there&#39;s a winner-licensing clause, if I remember correctly. <BR>5. Critique magazine had arguably the most intelligently-run competition &#40;although it wasn&#39;t free&#41;, but they&#39;re out of business. <BR>6. There are occasionally some small competitions now and again, like the one by Garage/Macromedia, or by the &#40;now-dead?&#41; Serif magazine, or a couple of recent Russian ones. <BR> <BR>hhp </font></font></font></font></font>'
