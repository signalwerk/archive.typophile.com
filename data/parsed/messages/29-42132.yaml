  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">this is a header i&#39;m working on for a special section for our newspaper to commemorate the Little League season. Bascially this section will be a big scrapbook of team pictures with a little bit of editorial content. i&#39;ve been working on this this morning and i&#39;m having a bit of trouble getting it just right. there&#39;s not much to it, but any help would be appreciated. Thnx <BR><img src="http://www.typophile.com/forums/messages/29/42133.gif" alt=""> <BR><img src="http://www.typophile.com/forums/messages/29/42134.gif" alt=""></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
