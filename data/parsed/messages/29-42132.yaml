    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap">thanks for the tips, suggestions. <BR>i&#39;ll post what i&#39;ve got so far for some last minute comments. <BR>i was going for the baseball jersey look, that&#39;s why i did what i did. I was gonna use Nick&#39;s Team Spirit font, but I used that last year and it&#39;s a bit too cute for what i was going for this time around. Anyhow, I&#39;ve tried to incorporate your suggestions. If you could take a look again and lemme know whatcha think, I&#39;d appreciate it. thnx again! <BR> <BR>Oh and BTW, the official Little League logo &#40;as far as I know&#41; is the logo on the banner that the girls are holding. <BR> <BR><!--attachment: LLtab-42165.pdf*mime_pdf.gif*application/pdf*1572.8*Tab+Cover*LLtab%2epdf --><center><table border=1><tr><td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align=left alt="application/pdf">Tab Cover<br><a href="http://www.typophile.com/forums/messages/29/LLtab-42165.pdf" target="_blank"><b>LLtab.pdf</b></a> (1572.8 k)</td></tr></table></center><!--/attachment--></font></font>'
