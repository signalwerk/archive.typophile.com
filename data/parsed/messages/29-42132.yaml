    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I think what I was referring to as an existing Little League logo &#40;which reminded me of what you are doing here&#41; can be illustrated with these images: <BR> <BR><img src="http://www.typophile.com/forums/messages/29/42161.jpg" alt="Little League Logo"> <BR> <BR>The following images represent some type treatments I think work well in this arena: <BR> <BR><img src="http://www.typophile.com/forums/messages/29/42162.jpg" alt="Little League Type"> <BR> <BR>Good luck!</font></font></font></font></font></font></font>'
  - id: 70457
    user: 3472
    date: 2004-08-05T14:26:00
    date_raw: Thursday, August 05, 2004 - 2:26 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Dude Paul Don&#39;t use the smalls version of the sanserif typeface you have selected. That typeface doesn&#39;t have a small caps version. <BR> <BR>I think that is the exact &#34;little league&#34; logo just strangly modified.</font></font></font></font></font></font>
  - id: 70460
    user: 108
    date: 2004-08-05T14:44:00
    date_raw: Thursday, August 05, 2004 - 2:44 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I agree with David, just stick with all caps. <BR> <BR>The word spacing of &#34;Little League&#34; is too wide. <BR> <BR>I might also consider tightening the letter spacing in between L and e in League.  <BR> <BR>I wouldn&#39;t stack Winslow looks more like an after thought and it will be difficult enough to make Little League feel more handlettered without adding a word over it. What if you put Winslow in the banner? Or maybe take a cue from the middle/bottom row image that Scott posted. <BR> <BR>The way the banner is attached to the e in League doesn&#39;t feel organic, it feels snapped on. The curve from the e to the banner is too stiff. Think in the third dimension. and again take cue from that middle image. The e should thin out and then go into the banner, as if it is waving. <BR> <BR></font></font></font></font></font>
