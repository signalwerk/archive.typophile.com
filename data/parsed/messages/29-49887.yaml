    date_raw: Tuesday, September 28, 2004 - 2:11 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Nice site! I&#39;m no designer &#40;and you are a fine one&#41;, so I shall leave others to comment on the design. I noticed a couple of typos though:<ul><li>on <a href="http://www.klim.co.nz/content/type.html">this page</a> definately should be definitely; <LI>on <a href="http://www.klim.co.nz/content/logos_bliss.html">this page</a> there are two <i>Home</i> breadcrumbs rather than one; <LI>in the first sentence on <a href="http://www.klim.co.nz/content/approach.html">this page</a> there should be a word between �is� and �type�.</li></ul> <BR>Good luck with the &#40;ad&#41;venture!</font></font></font></font></font></font></font></font>
