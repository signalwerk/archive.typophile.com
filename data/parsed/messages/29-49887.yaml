  - id: 76854
    user: 865
    date: 2004-09-27T07:29:00
    date_raw: Monday, September 27, 2004 - 7:29 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The background image and the logo look great. <BR> <BR>First off. I don&#39;t care what version you&#39;re on, so why tell me? If you&#39;ve got a couple of versions then fair enough, but unless you want to link to previous versions for users who might be familiar with an old site then I&#39;d drop that. <BR> <BR>I&#39;m not 100% keen on the links. Unless you&#39;re going to change the colour of the links then you&#39;ll have to keep it for links in the text, but I&#39;d try and drop it from the menu items for evry state but the roll over. <BR> <BR>I thought there was a little bit confusion over the colour. The sections of type picked out with colour look good in terms of style, but I felt that using the same colour as the links gave them status in excess of their place in the content &#40;eg. the media coverage page&#41;. <BR> <BR>The breadcrumbs are helpful, but again, with the current page looking like a link I wasn&#39;t as sure of where I was as I could have been. Also if you made them smaller, you&#39;d have room to keep the links for each item in the portfolio, without having to use &#39;next&#39; and &#39;previous&#39;. <BR> <BR>I guess I feel that there&#39;s not quite enough hierarchy across the site. On the portfolio&#62;logos page the note has &#39;Note:&#39; in bold, which is way too strong for a footnote given the weight of the rest of the page &#40;apart from anything else, I think most people would get it was a footnote from the asterisk&#41;. <BR> <BR>Generally it looks great, I don&#39;t think you&#39;ve made any mistakes and even though users won&#39;t care it&#39;s your first attempt that makes it more impressive. <BR> <BR>cheers.</font></font></font></font></font></font></font></font></font>
  - id: 76968
