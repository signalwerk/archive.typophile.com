  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><a href="http://www.klim.co.nz" target="_blank">www.klim.co.nz</a> <BR> <BR>is up and running. There shouldn&#39;t be any broken links or anything. Have a look around and tell me what you think. It is my very first website, so I had to learn HTML and CSS from scratch. Please folks, be honest. <BR> <BR>kris.</font></font></font></font></font></font></font></font></font></font></font>
