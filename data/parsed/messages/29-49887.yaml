    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hey, thanks for all the feedback people! <BR> <BR>I am rather embarrassed to have typo&#39;s, that is being combed at the moment. <BR> <BR>You are right about the structure, the logo  is a bit too much at the moment. version 0.8 will be dealing with structure and the finer navigational details, whereas this one was to get the content up.  <BR> <BR>Gee whizz, I am getting used to this interweb thing pretty quickly, I shouldn&#39;t really upload inferior versions! Sometimes impatient, too easy to upload!</font></font></font></font></font></font>
