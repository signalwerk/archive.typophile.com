    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Okay, v.08 is up and running. I have chopped home, and have it defaulting to &#34;approach&#34;. The language has been toned down, and the grammar has been groomed. The KLIM logotype is now greyed in the portfolio sections. Thank you all for the feedback, it is highly appreciated.</font></font></font></font></font>
