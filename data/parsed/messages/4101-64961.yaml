  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">What do you name small caps that don�t really have an AGL equivalent? For instance, if you are making a font that includes the underdots used in Persian, Yoruba, or transliterated Arabic, etc., you use the Latin Extended Additional Unicode area. <BR> <BR>As I understand it, one should use &#42;uni1E24&#42; for the name of a &#40;full cap&#41; H with a dot below, rather than using &#42;Hdotbelow&#42; for the name and 1E24 for the Unicode index. Is this right? And if so, do you then name the small cap variant &#42;uni1E24.sc&#42; with no Unicode index? <BR> <BR>BTW, I thought at one time &#42;dotbelow&#42; was in the AGL, but I don�t believe &#42;brevebelow&#42; or &#42;macronbelow&#42; ever were, so the question remains even if one should use &#42;Hdotbelow&#42; &amp; &#42;Hdotbelow.sc&#42; as the names in the example. <BR> <BR>Thanks again, <BR> <BR>Charles</font></font>
