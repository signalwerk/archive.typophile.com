    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The AIGA published a paper called <i>Use of Fonts</i> as part of their Business and Ethics series. I don&#39;t recall if it covers this specific issue, but you might want to check out the PDF at <a href="http://www.aiga.org/resources/Content/4/6/0/documents/AIGA_2Font.pdf" target="_blank"> www.aiga.org/resources/Content/4/6/0/documents/AIGA_2Font.pdf</a>. <BR> <BR>-- K. <BR></font></font></font></font>
