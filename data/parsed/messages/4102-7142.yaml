    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">This goes both ways. <BR> <BR>I can&#39;t count how many times clients have asked us to send  <BR>them the fonts after we&#39;ve created a piece that they will need  <BR>to maintain or update internally. Our standard answer  <BR>is simply that we can&#39;t legally do that. Sure they may think  <BR>we&#39;re stiffs, but they also realize that we&#39;re just protecting  <BR>ourselves, and not trying to be jerks.</font></font></font></font>
  - id: 14174
    user: 1262
    date: 2003-03-07T20:42:00
