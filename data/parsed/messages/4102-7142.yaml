    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">You&#39;re not only protecting yourself: you&#39;re also protecting them. <BR> <BR>I&#39;ve generally found that the larger the client is the better they understand the need to ensure that all their software, including fonts, is legitimately licensed.</font></font></font></font>'
