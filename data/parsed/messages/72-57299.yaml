  html: <font class="dontLookLikeCrap">As of January 6, the Indian Ocean tsunami on December 26, 2004, has claimed the lives of over 155,000 victims, with thousands left unaccounted for. This tragedy necessitates immediate aid for those left homeless, hungry, and struggling to rebuild and recover from great losses. <BR> <BR><a href="http://www.typesociety.org/" target="_blank">The Society of Typographic Aficionados</a> &#40;SOTA&#41; and <a href="http://www.buildingletters.org/" target="_blank">Building Letters</a> have joined forces in <a href="http://www.typesociety.org/fontaid.html" target="_blank">Font Aid III</a>, a project uniting the typographic and design communities in raising funds to expedite relief efforts in the affected countries. Font Aid III offers multiple opportunities for participation by professionals and amateurs from typography and all related arts. <a href="http://www.typesociety.org/fontaid.html" target="_blank">Find out how you can help.</a> <BR> <BR> <img src="http://www.typophile.com/forums/messages/72/57301.gif" alt=""><img src="http://www.typophile.com/forums/messages/72/57302.gif" alt=""></font>
