    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">The Details logo is set in September, by Hubert Jocham, which the magazine also uses for text and display. The magazine&#39;s serif face is Enigma, by Jeremy Tankard. <BR> <BR><a href="http://www.hubertjocham.de/" target="_blank">http://www.hubertjocham.de/</a> <BR><a href="http://www.typography.net/type/enigma.htm" target="_blank">http://www.typography.net/type/enigma.htm</a> <BR> <BR>&#40;Thanks to Ole Sorensen, who first pointed me to Mr. Jocham&#39;s work a couple years ago when I was a Typophile newbie!&#41;</font></font>
  - id: 84729
