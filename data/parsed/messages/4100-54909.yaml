    html: '<font class="dontLookLikeCrap">Angel <BR> <BR>The typface used by Details is called &#34;September&#34; and is currently exclusive for the magazine. There might be a solution for you though. Details have been one of my regular magazines for many years and I was slightly inspired by  September during my process of making &#34;Sophisto&#34;. Have a look at: <a href="http://www.macrhino.com" target="_blank">http://www.macrhino.com</a> <BR> <BR>Cheers/SH</font>'
