    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Structurally nice, but too mild, man! <BR>The obvious  thing would be to use a spicy font, like something with flames, like Sotoflame: <BR><A HREF="http://www.typophile.com/forums/messages/29/3025.html" TARGET="_top">http://www.typophile.com/forums/messages/29/3025.html</A> <BR> <BR>A more tasteful thing would be to change the top flat part of the spoon&#39;s head into something with small flame-like protrusions. Or at least do something with that &#34;p&#34; close to the spoon. <BR> <BR>hhp</font></font></font></font>'
