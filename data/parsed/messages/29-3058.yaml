  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi, <BR> <BR>I created this logo a couple of years ago and I would like to hear what you think about it. <BR><IMG SRC="http://www.typophile.com/forums/messages/29/3059.gif" ALT="SpicySpoon logo"> <BR>The font is Meta and the spoon is drawn by hand and vectorized. <BR>The company sells spices and spice grinders etc. <BR> <BR>Regards, <BR>Jacob</font></font></font></font>
