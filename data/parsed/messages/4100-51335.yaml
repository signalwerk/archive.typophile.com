    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I dont mean to hi-jack this thread: <BR> <BR>I have yet to start designing my own face as I am also new to type design, but I am starting to analyze letterforms as much as I can to get a good idea and figuring out how the strokes and such are designed and what style of letters I like most &#40;like double bowl g and two story a&#39;&#41; but soon enough I will eventually start my own. However one thing I know I need to work on and I know good type design execution relies on it, being able to master beziars curves. <BR> <BR>I have heard of some people taking existing typefaces and re drawing them, for instance I think I read on here somewhere that someone started out as a way to get practice was re drawing Gill Sans. Is something liek this a good way to get started in terms of execution?</font></font></font></font>'
