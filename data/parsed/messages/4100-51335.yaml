  id: 78817
  user: 4930
  date: 2004-10-16T02:52:00
  date_raw: Saturday, October 16, 2004 - 2:52 am
  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi, I&#39;m new around here so please be gentle ;&#41;  <BR> <BR>I am currently writing my own brief for a college project and I&#39;ve decided to design my own typeface in a minimalist style. As I&#39;m a complete novice I only have limited knowledge of type but I love typograpghy and so I&#39;ve set myself this task. I&#39;m not asking for my work to be done but any nippets of advice would be greatly appreciated, like things to avoid or whats a good programme to develop my font in. Any help would be fantastic.  <BR> <BR>Bec</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
comments:
  - id: 78818
    user: 618
    date: 2004-10-16T03:38:00
    date_raw: Saturday, October 16, 2004 - 3:38 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;d recommend fontlab, or it&#39;s paired down little brother, typetool available at <a href="http://www.fontlab.com" target="_blank">http://www.fontlab.com</a>. There really isn&#39;t another good option. I would also recommend Leslie Cabarga&#39;s book Learn Fontlab Fast. Available at the fontlab website. <BR> <BR>Randy</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 78822
    user: 1085
    date: 2004-10-16T05:12:00
    date_raw: Saturday, October 16, 2004 - 5:12 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Leslie Carbarga&#39;s other book, <i>The Logo, Font, and Lettering Bible,</i> &#40;<a href="http://www.logofontandlettering.com/" target="_blank">http://www.logofontandlettering.com/</a>&#41; is a great intro about how to begin to draw and design letters and typefaces, and is less technically specific that <i>Learn FontLab Fast,</i> yet still offers some good tips. It is a fantastic book! <BR> <BR>In terms of advice, the only pieces that I can think of without hearing more about what you would like to do are these: <BR>1. Design &#40;draw&#41; entire words first, not single letters. Letters in a typeface don&#39;t exist in a vacuum, but rather in context with one another. <BR> <BR>2. Remember the negative spaces! The spaces inside the letters, and the spacing in between the letters is just as important as the letterforms themselves. Erik Spiekermann wrote that type designers don&#39;t design marks on a page, but rather the spaces around those marks &#40;or something like that�&#41;. Often, novice designers spend all their time designing the font&#39;s glyphs, and then quickly space and kern, or auto-space and kern, and their outputed fonts suffer for that.</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
  - id: 78827
    user: 4930
    date: 2004-10-16T06:05:00
    date_raw: Saturday, October 16, 2004 - 6:05 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">thanks for the advice. <BR> <BR>I&#39;m looking at stripping down the individual letters  to their most minimal form, I want to play around with how far I can take them before they become unrecognisable. I&#39;m still in the proposal part of my idea so I&#39;m still working out what I&#39;d like to do.  <BR> <BR>Bec</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 78848
    user: 1250
    date: 2004-10-16T10:17:00
    date_raw: Saturday, October 16, 2004 - 10:17 am
    votes: 14
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Rebecca, it probably won&#39;t surprise you that experimetal minimalism in type has been attempted by a number of people in the past. But that doesn&#39;t mean you shouldn&#39;t try your own hand it. In fact I would recommend that you specifically <i>avoid</i> looking at other past attempts at this! This is such an extreme thing that it&#39;s necessarily personal, and outside influences can stunt the critical early stage of the process. <BR> <BR>We could give more advice about specific &#34;tricks of the trade&#34; shall we say but it seems to me that&#39;s tangential right now. You&#39;re not planning on producing a mainstream text face, and trying to absorb too much of the craft too early might actually distract you from the whole point of your effort. I guess the one general thing I myself would recommend though is this: observe the alphabet, in all its incarnations, to try to get at its essence, and thereby the essence of its elements - remembering that the letters are only really themselves in the context of the whole system. <BR> <BR>So maybe do your own thing, in private, but then do please show us what you got! <BR> <BR>hhp</font></font></font></font></font></font></font></font></font></font>'
