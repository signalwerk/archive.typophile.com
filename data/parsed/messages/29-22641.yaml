    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Andrew. <BR> <BR>This reminds me of the type/shoe print Tanya did a while back. Nice work. I also like the submarine, spaceship duality. A couple of comments:  <BR>- Consider elongating the engine to fill the void caused by the L. <BR>- The lighter version is better at small sizes, but weak larger. <BR>- The RTU ligature looks a little odd &#40;moreso large size&#41;. Consider making it just a TU lig and introducing a bit of space in between the RT. <BR>- Color. I might do a two tone paint job, like most boats &#40;the space shuttle for that matter also&#41;. One color above the waterline, another below. Maybe light blue above, navy below, red and orange stripes on a light blue engine, with orange flames. Even if it were only one color, I still might go Light on top darker on the bottom, with the engines filled with a tint. <BR> <BR>Fun stuff. I wanna go back in time! <BR> <BR>R</font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font></font>'
