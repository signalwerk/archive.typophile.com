    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I agree...as a lefty, when writing, I have always had troubles with not only Ss, but also <BR>5s and 8s. <BR>Now in typography, it is even a bigger issue.</font></font></font>
  - id: 71354
