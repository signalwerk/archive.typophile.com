    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I used to have a lot more trouble with the &#34;S&#34; particularly in really heavy weights. <BR> <BR>One trick that has helped a bit is to get rid of the on-curve points at the inflection points on the spine of the S until the shape is perfect and finalized. Using only the vertical control points to control each side of the spine curve helps immensely. <BR> <BR>I think that Leslie Cabarga may have mentioned this in his &#34;Logo, Font &amp; Lettering Bible.&#34; <BR> <BR>Regards, <BR> <BR>T</font></font>
