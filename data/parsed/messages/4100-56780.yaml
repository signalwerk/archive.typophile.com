  - id: 87885
    user: ciara-users
    date: 2004-12-30T19:20:00
    date_raw: Thursday, December 30, 2004 - 7:20 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi guys, <BR>Took Tiffany&#39;s advice and tried out Gotham and Grotesque results below. Please ignore kerning etc. Entire logo still very rough. I&#39;m presenting to my client, a construction crew and a group of architects. They like the graphic but lots of conflicting comments on choice of font. So suffering from creative block at the moment and really appreciate the professional advice. <BR> <BR>Paul let me know if you can now view the logo. <BR> <BR>Thanks, <BR>Ciara <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/56852.jpg" alt="vertigo"></font></font></font></font></font></font></font>
  - id: 87889
