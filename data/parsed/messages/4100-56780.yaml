  - id: 87756
    user: ciara-users
    date: 2004-12-29T17:36:00
    date_raw: Wednesday, December 29, 2004 - 5:36 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Thanks Tiffany but the Typofonderie website is offline. Know of any other sites where I could test out this font? <BR> <BR>Ciara</font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 87815
    user: 108
    date: 2004-12-30T09:44:00
    date_raw: Thursday, December 30, 2004 - 9:44 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Ah right. Hmm. Well anyway I don&#39;t think Costa is right anyway. The graphic&#39;s contrast is much higher than Costa&#39;s contrast &#40;thick and thin&#41;. Does your client not like your choices so far? What other typefaces have you shown them? Maybe you should look at H&amp;FJ&#39;s <a href="http://www.typography.com/catalog/gotham/index.html" target="_blank">Gotham</a>—Near to zero contrast, could compliment without being overtly decorative. Also has an oblique companion and a good variety of weights. Your graphic, it seems to me, won&#39;t work with the new square-din style sans, nor will it work with anything grotesque or humanist. Although I did think you had used Franklin there and so maybe a Grotesque is exactly what you need.</font></font></font></font></font></font></font></font></font></font>
