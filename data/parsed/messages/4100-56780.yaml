  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi there, <BR>I would appreciate any advice in choosing a font to complement the rough graphic below. My client is a new bar/restaurant that hopes to create a sophisticated, yet unintimidating image. The typeface cannot be too stylized or retro but must be capable of standing alone without the graphic.  <BR> <BR>Any suggestions? <BR> <BR>Ciara <BR> <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/56781.jpg" alt="vertigo"></font></font></font></font></font></font></font></font></font></font></font></font></font></font>
