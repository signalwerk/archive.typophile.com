    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">My top two would be 3 and 1. I assume you would tuck the &#34;Bar and restaurant&#34; part to the left of the g descender in the #3 variant.</font></font></font></font></font></font>'
  - id: 87899
    user: 4404
    date: 2004-12-31T02:30:00
    date_raw: Friday, December 31, 2004 - 2:30 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Clara <BR> <BR>I sent this earlier, but it disappeared somehow... Maybe Sophisto or Stalemate would fit your purposes? You&#39;ll find them both here: <a href="http://www.macrhino.com" target="_blank">http://www.macrhino.com</a></font></font></font></font></font>'
  - id: 87932
    user: ciara-users
    date: 2004-12-31T09:35:00
    date_raw: Friday, December 31, 2004 - 9:35 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hi Stefan, <BR>Thanks for the advice. Managed to only try out Stalemate with Veer &#40;see 4&#41;. Agree with Steve, think 1 and 3 are strongest but 4 looks less retro. They hope to attract a trendy crowd along with soccer and domestic sports fans &#40;not that sports fans aren&#39;t trendy&#41;. The interior is quite sophisticated and streamlined. This in mind I don&#39;t think a retro feel hurts but my clients are label savvy, Prada wearing people and I feel veering more on the contemporary. Hence the stylized option &#40;3&#41;. Yet, there&#39;s concerns that the logo may date. <BR> <BR>Which logo do you think is strongest based on the above? <BR> <BR><img src="http://www.typophile.com/forums/messages/4100/56894.jpg" alt="vertigo"></font></font></font>
  - id: 87959
    user: 103
    date: 2004-12-31T13:12:00
    date_raw: Friday, December 31, 2004 - 1:12 pm
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap">#1 is definitely the strongest <i>and</i> the most streamlined. Any <BR>time you overlap halftones with text in a logo you&#39;re looking for <BR>trouble. It&#39;s so difficult to keep an eye on every printing instance <BR>that your logo may be caught in a situation where the halftones <BR>are too dark and the restaurant name is obscured. Go with #1, <BR>besides being the most versatile, the type matches the symbol  <BR>well and can be either &#39;60s chic or contemporary.</font></font>'
