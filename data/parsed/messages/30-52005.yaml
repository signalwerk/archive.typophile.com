    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">yeh that&#39;s what I figured. I can easliy make an animated gif that is similar as the flash image but less flashy and a bit bigger. then that will come up when there isn&#39;t flash or it is blocked. <BR> <BR>personally if they don&#39;t have broadband and they don&#39;t have flash then they aren&#39;t the customer...</font></font></font></font></font></font></font></font></font></font></font>
