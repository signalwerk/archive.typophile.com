  votes: null
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Do you bother with &#39;alternate pages&#39; for the users who don&#39;t have Flash?  <BR> <BR>The new Flash MX has the ability to do flash detection but I don&#39;t see it being used in the typophile home page. Do any of you Flashers bother?  <BR> <BR>ta..</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
comments:
  - id: 79873
    user: 1461
    date: 2004-10-25T08:04:00
    date_raw: Monday, October 25, 2004 - 8:04 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">If you&#39;re target audience is graphic design geeks like us, then Flashturbate all you want.  <BR> <BR>Otherwise, you need to put it all in the context of your usergroup. Flash is rarely an improvement to the overall end-user experience when we&#39;re talking your average online consumer, or news site, etc. It can enhance the experience of certain types of sites...teen marketing, movie promos, etc. <BR> <BR>If you ask yourself the basic question &#39;WHY is a person coming to this site?&#39; it usually answers the Flash question. If that doesn&#39;t, then look at the accessibility issues &#40;for those with screen readers, PDAs, corporate networks that block flash, older browsers, and folks that just hate flash&#41;. Is the benefit of the flash outweigh the percentage of lost audiene? <BR> <BR>Like Helvetica, Flash is best when used in moderation, IMHO.</font></font></font></font></font></font></font></font></font></font></font></font></font>
  - id: 79878
    user: 2145
    date: 2004-10-25T08:24:00
    date_raw: Monday, October 25, 2004 - 8:24 am
    votes: null
    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">i&#39;m building mostly 2 versions, because i mostly use xml for the content storage. that way it&#39;s quite &#34;easy&#34; to build a non-flash site that uses the same data base... and &#40;even more important&#41;: google will index the site contents &#40;yes, google does crawl flash content for some weeks now, but only uncompressed flash files! and normally everyone makes use of the compression export setting&#41;. all this only makes sense if you have content on your page of course <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0></font></font></font></font></font></font></font></font></font></font></font></font>'
