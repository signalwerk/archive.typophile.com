    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;m with Daniel on this one.</font></font></font></font></font></font></font></font></font>
  - id: 80577
    user: 1160
    date: 2004-10-29T18:18:00
    date_raw: Friday, October 29, 2004 - 6:18 pm
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">As for Flash detection, yes, you should always detect for it.  <BR>However, I&#39;d argue that the need is becoming less and less &#40;for  <BR>mainstream audiences&#41; to build both Flash and non-Flash  <BR>versions. <BR> <BR>I agree that Flash is still largely used incorrectly - which doesn&#39;t  <BR>make the use of Flash right or wrong. It just means you should <BR>use it for what it does best. <BR> <BR>Regarding screen readers and PDAs. This has opened up so  <BR>vastly in the last 2 versions of Flash &#40;roughly 2 years&#41; that Jakob  <BR>Nielsen, Flash&#39;s one-time nemesis, now fully endorses Flash,  <BR>provided it&#39;s built within standard usability guidelines. The list of <BR>improvements include standard interface elements &#40;widgets&#41; that <BR>behave like browser widgets - drop down menus, pull-downs,  <BR>tab-enabled forms, selectable text &#40;which means machine  <BR>readable text&#41;, etc, etc. <BR> <BR>When we recently redesigned the fStop home page, we left out  <BR>the Flash gimmicks and built in some smart tools that allow the  <BR>fStop admin people to quickly update the content without the  <BR>need to either know Flash or use a content-management system  <BR>&#40;CMS&#41;. &#40; <a href="http://www.fstopimages.com/" target="_blank">http://www.fstopimages.com/</a> &#41; <BR> <BR>When we designed our own site, we deliberately blurred the lines  <BR>between Flash content and HTML content so that users cannot  <BR>immediately tell what is Flash and what is not. This required  <BR>using a system font &#40;Arial&#41; for all body text in and out of Flash,  <BR>but it&#39;s a good compromise that provides a seamless look.</font></font></font></font></font></font></font></font>
  - id: 80585
    user: 1817
    date: 2004-10-30T01:08:00
    date_raw: Saturday, October 30, 2004 - 1:08 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Well I decided to detect flash from vers. &#60; 4.0.. if it&#39;s not there it goes to an alt page which I change the flash bit with an aminated .gif.  <BR> <BR>The Flash image is quicker than the .gif and smaller. <BR> <BR>And I&#39;m finding even older Macs that I expect to have no flash had Flash 6 installed so it&#39;s in most browsers.</font></font></font></font></font></font></font>
  - id: 80798
    user: 1461
    date: 2004-11-01T08:10:00
    date_raw: Monday, November 01, 2004 - 8:10 am
    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#34;And I&#39;m finding even older Macs that I expect to have no flash had Flash 6 installed so it&#39;s in most browsers.&#34; <BR> <BR>Whether the technology exists or not shouldn&#39;t be the deciding factor...it should be whether or not the end-user wants to use the technology. Borwser detection in all forms only detects hardware set up...not end-user preferences, which is what you really want.</font></font></font></font></font></font>
  - id: 80811
