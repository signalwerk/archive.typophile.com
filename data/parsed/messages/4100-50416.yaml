  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap">I&#39;m designing a character to be featured on a label for a 1Kg couscous package. The product will be sold in Morocco. The name of the product is &#39;La Rifaine&#39; and it refers any woman from the region of &#39;Rif&#39; in Morocco. So I decided to design a female character from this region. <BR> <BR>Here are two designs, the first has the woman wearing a scarf that also covers her neck. The second is more revealing.. <BR> <BR>Both are still in concept and final work will be cleaned up. Any feedback I can get will be much appreciated &#40;color, line, composition, proportions, subject..&#41; <BR> <BR>Thanks <BR> <BR>http://www.raioo.com/logos/photos/berkasha_10.jpg <BR>http://www.raioo.com/logos/photos/berkasha_11.jpg</font></font>
