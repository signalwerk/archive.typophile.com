    html: <font class="dontLookLikeCrap"><blockquote><hr size=0><!-quote-!><font size=1><b>quote:</b></font><p>You�re right it�s too much text in the front, not eye catching,  <BR>I wouldn�t read it.<!-/quote-!><hr size=0></blockquote> <BR>Well, that&#39;s quite unfortunate, because all the text needs to be on  <BR>there. <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0> Ain&#39;t that a bitch... <BR><blockquote><hr size=0><!-quote-!><font size=1><b>quote:</b></font><p>Alice I see has morphed into a man<!-/quote-!><hr size=0></blockquote> <BR>Not only that, but he/she has contracted a skin disease that goes  <BR>by the name of <i>Pityriasis Versicolor Acheomiant</i> &#40;according to the  <BR><i>Fichier de Dermatologie</i> where this illustration comes from&#41;. <IMG SRC="http://www.typophile.com/forums/clipart/sad.gif" ALT=":-&#40;" BORDER=0> <BR><blockquote><hr size=0><!-quote-!><font size=1><b>quote:</b></font><p>Yves, what tha font is Spreken &amp; zwijgen? :P tasty<!-/quote-!><hr size=0></blockquote> <BR>Damn straight! Oxtail is but one of the numerous delicious type  <BR>designs by the inimitable espresso lover <a href="http://www.macrhino.com/" target="_blank"> Stefan Hattenbach</a>. <BR> <BR>Time&#39;s up! Flyer needs to be at the printer&#39;s first thing in the morning. <IMG SRC="http://www.typophile.com/forums/clipart/happy.gif" ALT=":-&#41;" BORDER=0></font>
