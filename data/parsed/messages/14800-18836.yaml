    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">John are you able to resell to others or are you bound to release only with Microsoft. Will this be a postscript font? For mac? I would, well my client would too, really like to have a nice, well done, full set of Ethiopic we could use on my system for print publications. I&#39;m just 1 person here - you could slip it under the door  can&#39;t ya! hehe. <BR> <BR>Combined with a latin face we&#39;d be set, as we do work telecom style and I imagine could have the original piece of text set in Amharic and flipped to North American english on a button using the combined Latin. You see right now I get scans of any Amharic I usually end up drawing in illustrator...which lead me to that crazy idea of building a font until I discovered most obstacles. <BR> <BR>Have you talked with Dr. Aberra Molla, who seems to think he&#39;s the only one who can develop it further and owns the idea for creating electronic Ethiopic or are you using his ModEth structure - which on paper sounds like its down pat anyway. <BR> <BR>And what do you say about the whole no copyright thing. See besides the fact that I don&#39;t know how to code anything and would have had to use someone else to format my font, I also decided to stop because of the whole no copyright thing. It sounds selfish I know. But it would have been made for 1 specific client and if sold - obviously it would only have a major market in Ethiopia, but one would only need to release 1 package and it would circulate like wildfire for free with no consequence I gather.  <BR> <BR>As for the full extended Ethiopic - sad isin&#39;t it, that wouldn&#39;t even help me in Canada - well unless I bought the new MS Office I guess.  <BR> <BR>During my own research, reading through this unicode problem and realizing different languages use the same and on and on - I found it terribly englightning to see such an ancient language - that really is so simple - virtually overnight, become one that is terribly difficult to intergrate into our world and electronify. Its very strange I thought &#40;y&#39;no with all this technology&#41; and goes to show how limiting our communication systems are. <BR> <BR>I laugh at our English and then cry when I have to cut and paste columns of Ethiopic character images together.  <BR></font></font></font></font></font></font>
  - id: 42791
    user: 1262
    date: 2003-12-31T09:31:00
