    votes: null
    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Tanya, the Ethiopic font for MS is wholly owned by them, so I won&#39;t be able to resell it. It will be a TrueType flavour OpenType font, so it will work on OS X, but not on earlier versions of Mac OS. It may not be released until the next version of Windows ships, the date of which seems to be getting further away not nearer. <BR> <BR>I&#39;m not in contact with Dr Aberra Molla, and generally avoid people who think they&#39;re the only people who can do something. All script encoding and text processing is a team effort. My main contact for Ethiopic is Daniel Yacoub, who works closely with minority language users and academics in Ethiopia and is active in the Unicode community. I&#39;m sure Daniel knows Dr Molla. <BR> <BR>Regarding the copyright issue, this is something I&#39;m content to let Microsoft worry about. I probably wouldn&#39;t be keen to make a speculative, retail font for the Ethiopic market. <BR> <BR>The only really complicated aspects of Ethiopic text processing are input methods -- i.e. coming up with a logical and consistent keyboard layout -- and sorting algorithms for different languages, which, thankfully, is not our problem. Making Ethiopic Unicode fonts and handling the text once it is input is actually very straightforward, since the script is so simple.</font></font></font></font></font>
