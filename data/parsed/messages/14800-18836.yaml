    html: '<font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">&#34;electronic alphabet for a people of Africa..&#34; <BR> <BR>I have been trying to develop one for an African client for some time and ran into alot of obstacles in my research. <BR> <BR>But it has been done and actually if one were to look into the script forms and study what languages it is the people are using for writting you might find more in common. Some Semitic scripts are used for 3-4 different languages including Amharic which 29million people use daily - same as our roman characters are used for english/french/spanish ect. So perhaps your not really leaving out that many cultures. Problem is there seem to be so many battles over the coding of it and politically how its to be used. <BR> <BR>I&#39;ve heard that it is hard to produce such languages electronically mainly because the full unicode dosen&#39;t exist quite yet. much ado about the keyboard ect ect. For some Ge&#39;ez &#40;I beleive Microsofts&#41; you might have deadkey entry to produce the character i.e. phonetically sounding &#34;bo&#34; you type in b and o to produce the character that represents that sound - but that character might have a different sound in a different dialect - so others wanting to use the font would have to know this fonts base dialect as well as english in order to understand the keys that make the corresponding sound.  <BR> <BR>There&#39;s over 400 characters alone and we&#39;re asking them to know all the similar dialects as well as english just to be able to type it. <BR> <BR>anyway here&#39;s a bunch of info about it and some people doing it: <BR><a href="http://trigonal.ncat.edu/AAU-Network/aau/feature/abera2.html" target="_blank">http://trigonal.ncat.edu/AAU-Network/aau/feature/abera2.html</a> <BR>and some upset people: <BR><a href="http://www.ethiopic.com/plag97.htm" target="_blank">http://www.ethiopic.com/plag97.htm</a> <BR> <BR>here&#39;s a run down of African languagesI picked up from a friend:  <BR>Algeria	Arabic &#40;official&#41;, French, Berber dialects	 <BR> <BR>Angola	Portuguese &#40;official&#41;, Bantu and other African languages	 <BR> <BR>Benin	French &#40;official&#41;, Fon and Yoruba &#40;most common vernaculars in south&#41;, tribal languages &#40;at least six major ones in north&#41;	 <BR> <BR>Botswana	English &#40;official&#41;, Setswana	 <BR> <BR>Burkina Faso	French &#40;official&#41;, native African languages belonging to Sudanic family spoken by 90% of the population	 <BR> <BR>Burundi	Kirundi &#40;official&#41;, French &#40;official&#41;, Swahili &#40;along Lake Tanganyika and in the Bujumbura area&#41;	 <BR> <BR> <BR>Cameroon	24 major African language groups, English &#40;official&#41;, French &#40;official&#41;	 <BR> <BR> <BR>Central African Republic	French &#40;official&#41;, Sangho &#40;lingua franca and national language&#41;, Arabic, Hunsa, Swahili	 <BR> <BR> <BR>Chad	French &#40;official&#41;, Arabic &#40;official&#41;, Sara and Sango &#40;in south&#41;, more than 100 different languages and dialects	 <BR> <BR> <BR>Congo, Democratic Republic of the	French &#40;official&#41;, Lingala &#40;a lingua franca trade language&#41;, Kingwana &#40;a dialect of Kiswahili or Swahili&#41;, Kikongo, Tshiluba	 <BR> <BR>Djibouti	French &#40;official&#41;, Arabic &#40;official&#41;, Somali, Afar	 <BR> <BR>Egypt	Arabic &#40;official&#41;, English and French widely understood by educated classes	 <BR> <BR> <BR>quatorial Guinea	Spanish &#40;official&#41;, French &#40;official&#41;, pidgin English, Fang, Bubi, Ibo	 <BR> <BR> <BR>Ethiopia	Amharic, Tigrinya, Oromigna, Guaragigna, Somali, Arabic, other local languages, English &#40;major foreign language taught in schools&#41;	 <BR> <BR>Gabon	French &#40;official&#41;, Fang, Myene, Bateke, Bapounou/Eschira, Bandjabi	 <BR> <BR> <BR>Gambia	English &#40;official&#41;, Mandinka, Wolof,  <BR>other indigenous vernaculars <BR> <BR> <BR>Ghana	English &#40;official&#41;, African languages &#40;including Akan, Moshi-Dagomba, Ewe, and Ga&#41;	 <BR> <BR> <BR> <BR>Guinea	French &#40;official&#41;, each ethnic group has its own language	 <BR> <BR> <BR> <BR>Guinea-Bissau	Portuguese &#40;official&#41;, Crioulo, African languages	 <BR>� <BR> <BR> <BR>Kenya	English &#40;official&#41;, Kiswahili &#40;official&#41;, numerous indigenous languages	 <BR> <BR> <BR>Liberia	English 20% &#40;official&#41;, some 20 ethnic group languages, of which a few can be written and are used in correspondence	 <BR> <BR> <BR>Libya	Arabic, Italian, English, all are widely understood in the major cities	 <BR> <BR> <BR>Madagascar	French &#40;official&#41;, Malagasy &#40;official&#41;	 <BR> <BR> <BR>Malawi	English &#40;official&#41;, Chichewa &#40;official&#41;,  <BR> <BR> <BR>Mali	French &#40;official&#41;, Bambara 80%, numerous African languages	 <BR> <BR> <BR>Mauritania	Hasaniya Arabic &#40;official&#41;, Pular, Soninke, Wolof &#40;official&#41;, French	 <BR> <BR> <BR>Mauritius	English &#40;official&#41;, Creole, French, Hindi, Urdu, Hakka, Bojpoori	 <BR> <BR> <BR>Morocco	Arabic &#40;official&#41;, Berber dialects, French often the language of business, government, and diplomacy	 <BR> <BR> <BR>Mozambique	Portuguese &#40;official&#41;, indigenous dialects	 <BR> <BR> <BR>Namibia	English 7% &#40;official&#41;, Afrikaans common language of most of the population and about 60% of the white population, German 32%, indigenous languages: Oshivambo, Herero, Nama	 <BR> <BR> <BR>Niger	French &#40;official&#41;, Hausa, Djerma	 <BR> <BR> <BR>Nigeria	English &#40;official&#41;, Hausa, Yoruba, Igbo &#40;Ibo&#41;, Fulani	 <BR> <BR> <BR>Rwanda	Kinyarwanda &#40;official&#41; universal Bantu vernacular, French &#40;official&#41;, English &#40;official&#41;, Kiswahili &#40;Swahili&#41; used in commercial centers	 <BR> <BR> <BR>Senegal	French &#40;official&#41;, Wolof, Pulaar, Jola, Mandinka	 <BR> <BR> <BR>Sierra Leone	English &#40;official, regular use limited to literate minority&#41;, Mende &#40;principal vernacular in the south&#41;, Temne &#40;principal vernacular in the north&#41;, Krio &#40;English-based Creole, spoken by the descendants of freed Jamaican slaves who were settled in the Freetown area, a lingua franca and a first language for 10% of the population but understood by 95%&#41;	 <BR> <BR> <BR>Somalia	Somali &#40;official&#41;, Arabic, Italian, English	 <BR> <BR> <BR>South Africa	11 official languages, including Afrikaans, English, Ndebele, Pedi, Sotho, Swazi, Tsonga, Tswana, Venda, Xhosa, Zulu	 <BR> <BR> <BR>Sudan	Arabic &#40;official&#41;, Nubian, Ta Bedawie, diverse dialects of Nilotic, Nilo-Hamitic, Sudanic languages, English	 <BR> <BR> <BR>Tanzania	Kiswahili or Swahili &#40;official&#41;, Kiunguju &#40;name for Swahili in Zanzibar&#41;, English &#40;official, primary language of commerce, administration, and higher education&#41;, Arabic &#40;widely spoken in Zanzibar&#41;, many local languages <BR> <BR>note:� Kiswahili &#40;Swahili&#41; is the mother tongue of the Bantu people living in Zanzibar and nearby coastal Tanzania; although Kiswahili is Bantu in structure and origin, its vocabulary draws on a variety of sources, including Arabic and English, and it has become the lingua franca of central and eastern Africa; the first language of most people is one of the local languages	 <BR> <BR> <BR>Togo�	French &#40;official and the language of commerce&#41;, Ewe and Mina &#40;the two major African languages in the south&#41;, Kabye &#40;sometimes spelled Kabiye&#41; and Dagomba &#40;the two major African languages in the north&#41;	 <BR> <BR> <BR>Tunisia	Arabic &#40;official and one of the languages of commerce&#41;, French &#40;commerce&#41;	 <BR> <BR> <BR>Uganda	English &#40;official national language, taught in grade schools, used in courts of law and by most newspapers and some radio broadcasts&#41;, Ganda or Luganda &#40;most widely used of the Niger-Congo languages, preferred for native language publications in the capital and may be taught in school&#41;, other Niger-Congo languages, Nilo-Saharan languages, Swahili, Arabic	 <BR> <BR> <BR>Zambia	English &#40;official&#41;, major vernaculars - Bemba, Kaonda, Lozi, Lunda, Luvale, Nyanja, Tonga, and about 70 other indigenous languages	 <BR> <BR> <BR>Zimbabwe	English &#40;official&#41;, Shona, Sindebele &#40;the language of the Ndebele, sometimes called Ndebele&#41;, numerous but minor tribal dialects</font></font></font></font></font></font></font></font></font></font>'
  - id: 42773
