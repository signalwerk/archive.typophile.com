post:
  id: 34215
  user: 2485
  date: 2003-10-18T15:28:00
  date_raw: Saturday, October 18, 2003 - 3:28 pm
  votes: 2
  html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">Hello, <BR> <BR>I&#39;m fairly new here but I would like to suggest a project. I don&#39;t have much information but maybe someone here would know more. I&#39;ve heard from a friend that some cultures in the world don&#39;t have an electronic alphabet that they can use &#40;Inuits already have one but you can imagine what I mean&#41;. I&#39;ve searched for informations online but did not find much. If some people would be interested I&#39;d try to dig a little deeper into it or see if we could ask some organisation to help build links. The project would basically be to start from an existing alphabet and make it into a screenfont or even print font. <BR> <BR>I know for some countries it would be a little tougher. Example, if we did an electronic alphabet for a people of Africa, all the other 150 people or so would wonder why THEY don&#39;t have one. But then again.... it would be a nice challenge to make sure everyone can use their language in the virtual world. <BR> <BR>Let me know your opinions!</font></font></font></font></font></font></font></font></font></font></font></font></font></font>
