    html: <font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap"><font class="dontLookLikeCrap">If you are interested in developing fonts for African languages, you should subscribe to the <a href="http://lists.kabissa.org/mailman/listinfo/a12n-collaboration">Africanisation Collaboration</a> list. I&#39;ve been involved since the list began, and it has attracted a good group of knowledgeable people, including a number of Unicode Technical Committee members. <BR> <BR>By the way, Tanya, I&#39;ve nearly finished a combined Ethiopic/Latin font for Microsoft. It only covers the current Unicode Ethiopic block at the moment, but I&#39;m in fairly close contact with some of the people working on a proposal to encode extended Ethiopic for additional minority languages. When the full set is encoded in Unicode, about 80 languages will be supported. <BR> <BR>I spent a week buried in the African Studies library at Northwestern University in 1998, cataloguing orthographies for African languages, and have a fairly large amount of data. The biggest impact of this data was confirming that it is pointless to try to support anything more than a small percentage of African languages using the Latin script without dynamic mark positioning. The variety and number of tone and nasalisation markings required is very large, and since only about 20% of African orthographies are stable and well-documented -- and new orthographies are being developed all the time --, dynamic mark positioning &#40;e.g. OpenType GPOS&#41; is the only efficient and largely future-proof approach. Unfortunately, as this is cutting edge stuff &#40;Windows Office 2003 and Adobe InDesign Middle East version are about the only apps I know that support it&#41;, it is not readily available within Africa itself.</font></font></font></font></font></font></font></font>
