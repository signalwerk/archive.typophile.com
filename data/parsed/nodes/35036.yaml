    <p>Hi,</p>
    <p>I guess this is the right place to ask about ligature charachtes on the web. What are the main technical issues with using them on the web in a UTF-8 document?</p>
    <p>The main issue—that I have found—with ligatures on the web is lack of search engine support. A search engine such as Google does not understand that ‘<a class="freelinking-external" href="http://www.google.com/search?client=opera&amp;rls=en&amp;q=%EF%AC%81nd&amp;ie=utf-8&amp;oe=utf-8">ﬁnd</a>’ and ‘<a class="freelinking-external" href="http://www.google.com/search?client=opera&amp;rls=en&amp;q=find&amp;ie=utf-8&amp;oe=utf-8">find</a>’ means the same.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/35058" class="topic-previous" title="Go to previous forum topic">‹ Making OTF problem</a> <a href="/node/34903" class="topic-next" title="Go to next forum topic">Embedded bitmaps in TTF in Windows ›</a></div>
