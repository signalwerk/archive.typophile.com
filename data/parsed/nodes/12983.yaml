      <p>Since I know nothing about the company, I can only voice my preference for the look. I prefer the second one (yellow balloon, sans). If you use the serif face, try the sans for the tagline. I assume the shape above the 'i' is supposed to look like a word balloon. Is that true?</p>
      <p>Also, at smaller sizes, 'complete communications' will turn into ant tracks. Be careful. It should probably be at least 150-200% larger, I'd guess.</p>
