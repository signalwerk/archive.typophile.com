    html: |-
      <p>Patty, I recommend "space - en dash - space" for practical reasons, because as I said, emdash treatment varies so widely with typeface. For instance, this Futura em dash is really nasty, with no sidebearings and a long way from the vertical centre of the x-height. This is the kind of situation where "following the rules" will cause a typographer to do stuff which looks clumsy.<br>
      On the other hand, Electra's em dash has plenty of sidebearings, i.e. built-in spaces. No trouble there, but "space - en dash - space doesn't look bad either, so that setting works in both fonts.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Dash2_3468.png"></div><p></p>
      <p>For more experienced typographers, I would agree with you that the old school emdash with no added space is ideal, but may require nuancing, such as inserting some manual kerning or hair space, and maybe baseline shift, depending on the font and the typographer's taste.</p>
