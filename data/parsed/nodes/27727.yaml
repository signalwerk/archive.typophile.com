    html: |-
      <p>My two cents... (and I'm in Australia, so not sure where that fits in to British or American style, probably both)</p>
      <p>I use an en dash to indicate a range, sometimes with a space, sometimes not (eg Mon–Fri, 9–5pm; 4 September – 5 October), depending on if the 'ranged' items also have spaces within them.</p>
      <p>In extended text, I like the em-dash with hair spaces either side to indicate the change-of-thought. Although some editors that we use think that is an old-style approach and prefer spaced ens instead.</p>
      <p>eliason - I think the difference in space between the dots within an ellipsis and a period that follows makes sense. Otherwise, it would look like an ellipsis with four dots? I'd even go so far as to insert a thin space to make the difference noticeable.</p>
