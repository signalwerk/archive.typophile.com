      <p>True, but it also does its own thing. The colon and parenthesis are short and vertical, whereas the length of the em dash -- imagine oneself writing it -- provides urgency and continuity.</p>
      <p>Dashes are also visual design elements, look at the symmetry and shape of:<br>
      "All right, boys--that's enough."</p>
      <p>So much more attractive than:<br>
      "All right, boys: that's enough."</p>
      <p>or:<br>
      "All right, boys, that's enough."<br>
      which lacks the forcefulness the text warrants.</p>
      <p>although:<br>
      "All right boys, that's enough."<br>
      would be OK.</p>
      <p>It's not enough to rely solely on grammatical rules and standards.</p>
