      <p>Stephen: I may just do that if I am able to find the time to dig up my old implementation and get it in a presentable format.</p>
      <p>Nick: That particular case is very easy. The latter example has a matching pair, but the former doesn't.</p>
      <p>In general, all you really have to do is determine when there are matching pairs and when there aren't. In practice, it can of course get tricky (and the parsing can get pretty hairy), but it's currently possible to do an excellent job.</p>
      <p>I say "excellent" as opposed to "perfect". Doing a perfect job, while not theoretically impossible, would require perfect natural-language processing, which is a Very Hard AI challenge that we haven't yet overcome.</p>
      <p>BTW, the job is much easier for software like SmartyPants than it is for, say, Microsoft Word. That's because Word does it in real-time (as you type), while SmartyPants has the luxury of processing the full text at once.</p>
