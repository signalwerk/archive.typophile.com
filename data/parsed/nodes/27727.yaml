    html: |-
      <p>&gt;what do the Brits do for dates</p>
      <p>I just looked back at Bringhurst, which I got not quite accurate from memory. He says the m-dash for a 'phrase marker' is 'Victorian'. He says, "Like the oversized space between sentences, it belongs to the padded and corsetted aesthetic of Victorian Typography." I remember the use of the spaced n-dash from my years in England, and it is part of Tschichold's recommended style for Penguin. I suspect it is in other English style books, but I don't have any on hand. </p>
      <p>For dates, Bringhurst recommends en dashes without spaces, as is also American style, eg. in the Chicago Manual of Style. </p>
      <p>If I remember rightly from earlier Typophile discussions, Matthew Carter came up with the idea of three-quarter em dashes with spaces out to the em. Being a 'mid Atlantic' kind of guy, I guess this is apt. I think it is probably the best solution. Kent Lew wrote that in Whitman he did the Carter-style em dashes and also negatively kerned them so if keyed in successively they make a solid line.</p>
