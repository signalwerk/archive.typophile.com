      <p>Yeah, I did use a hyphen, and often do when typing emails or other informal correspondence because I'm too lazy to do the shift option thingie. I also sometimes use all lowercase in email but that ain't correct typesetting either. And I use abbreviations and shorthand too altho (there's one) I wouldn't in a book or other printed piece.</p>
      <p>As we have all noted there is a lot of variety in size of dashes but that's no excuse for poor typesetting. I do kern a little extra space around an em if it's too tight, which they often are. And yes it's cool to horizontally scale the dashes a bit to suit your taste, I've even created style sheets just for dashes. </p>
      <p>But the original question in this thread concerned usage and I'm old school—I think it's important to use dashes correctly and not mix them up.</p>
