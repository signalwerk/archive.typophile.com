      <p>That's no longer a matching pair. The first apostrophe is followed by a digit, which weights the probability heavily in favor of it being an apostrophe. The second apostrophe has an <cite>s</cite> before it and a space afterwards (and no punctuation), which similarly increases its probability being an apostrophe rather than a closing quotation mark. This evidence, taken together, allows us to make a reasonable guess that we have two unconnected apostrophes. The guess may sometimes turn out to be wrong, but in most cases -- as in this one -- it will be correct.</p>
      <p>(I'm a little disconcerted by the repeated challenges. I did say that the parsing can get tricky, and isn't currently perfect. It's easy to construct pathological cases that will trip up even the best of the current solutions. In practice, such cases occur very infrequently.)</p>
