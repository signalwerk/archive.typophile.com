      <p>that's all very interesting, i wasn't aware that there were cultural/national differences in usage of en-/em-dash.<br>
      I can only comment/add on the ‘traditional’ usage in germany:<br>
      the m-dash aka „Streckenstrich“ (something along the lines of ‘distance-stroke’) was to be used to designate a distance/span of time and space like „10—12 km“/„12—14.00 Uhr“; or to be used in amounts of money with no digits like „10,— Mark“. The interesting thing is that you almost never see it being used today, i suspect exactly because it is deemed too long, as stated above. When used, you rarely see it without small 1/8th- to 1/4th-em spaces over here.<br>
      Seeing the em-dash in use as described today to me makes quite a traditional, if not ‘reactionary’ impression, like using the st-ligature in body copy, if you get my drift; but of course it depends on the typeface being used, context, etc. I find the en-dash sufficient in most cases.<br>
      Apparently there is no reliable rule of thumb to be found here, as the design of both dashes varies too much from typeface to typeface.</p>
