      <p>Nick [space hyphen space] I agree the Futura em is clunky—too long and too high—but I don't think the en with spaces improves it. The Electra em is nice tho. </p>
      <p>I am a stickler but also realize that the average Joe doesn't even know the difference. Of course the average Joe doesn't look at the front and back cover of a book together to notice how nicely you've balanced and lined up the various elements either. And wouldn't care that the fractions weren't converted or whether there were prime marks instead of smart quotes. Typesetting is a lonely business but I come from book publishing, where this kind of thing matters. And I'm not dumbing down for the average Joe.</p>
