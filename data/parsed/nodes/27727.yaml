    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Oscar_4632.jpg"></div><br>
      This is nice, from 1940.<br>
      I believe it was written, or edited, with typographic appearance in mind.<br>
      There seems to be a variety of marks used for subordinate clauses:<br>
      -commas<br>
      -brackets (parentheses)<br>
      -dashes<br>
      The variety animates the setting, along with frequent paragraph breaks and italicization.<br>
      Dashes are used more often with quotations, perhaps to contrast with the quote marks themselves, whereas brackets are favoured for the author's text.<p></p>
      <p>The dashes are narrow and the word spaces wide, compared with how it would usually be done today*, but as has been mentioned, the main thing is to find your style and be consistent -- readers will "get" it pretty quickly, because that's the kind of adjustment they make all the time, reading material as diverse as newspapers, magazines, books, advertisements, etc. So no need to dull down to some conservative ideal of what's considered most readable.</p>
      <p>*a combination of the metrics (character widths) in the font, and the H&amp;J setting.</p>
