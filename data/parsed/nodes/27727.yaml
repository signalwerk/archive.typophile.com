    html: |-
      <p>Not only do dashes vary in width from font to font, but also height and thickness. Some have built-in space on either side, while others don't. So like most things typographical, the trick is to get to know the typefaces you work with, and experiment to produce the best setting.</p>
      <p>As a rule of thumb, if you're thinking about using an em dash and not quite sure about how it will work out for a particular setting, use the en-dash with a space either side instead.</p>
