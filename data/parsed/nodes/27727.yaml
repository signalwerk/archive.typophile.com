      <p>Ah, yes indeed. John Gruber, author of Smarty Pants addresses the issue in the <a href="http://daringfireball.net/projects/smartypants/" rel="nofollow">documentation</a>:</p>
      <blockquote><p>Algorithmic Shortcomings</p>
      <p>One situation in which quotes will get curled the wrong way is when apostrophes are used at the start of leading contractions. For example:</p>
      <blockquote><p>'Twas the night before Christmas.</p></blockquote>
      <p>In the case above, SmartyPants will turn the apostrophe into an opening single-quote, when in fact it should be a closing one. I don’t think this problem can be solved in the general case — every word processor I’ve tried gets this wrong as well. In such cases, it’s best to use the proper HTML entity for closing single-quotes (’ or ’) by hand.</p></blockquote>
