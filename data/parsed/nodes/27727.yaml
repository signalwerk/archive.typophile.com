    html: <p>Nick - beg to differ. As in the primer, the em and en dashes have very different functions, and should not be used interchangeably or have spaces around them. The en is a connecting dash; it represents a span of time or space. The em is a separating dash—to set apart a thought or idea. I do find that in some cases the em in particular is kerned too tight, but you can adjust those in the kerning tables (and I do).</p>
