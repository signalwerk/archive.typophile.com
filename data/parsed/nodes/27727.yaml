      <p>Just an FYI for Patty and all: See the "Formating guidelines" below. Typophile is enhanced with "SmartyPants", a script that translates ASCII characters into "correct" characters once you hit the "Post comment" button. For example:</p>
      <ul>
      <li>straight quotes become "correct quotes", beginning and ending</li>
      <li>two hyphens -- become an em dash</li>
      <li>three dots ... become an ellipsis</li>
      </ul>
