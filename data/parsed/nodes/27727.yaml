      <p>Cameron: yes, we're in agreement—the en connects and the em separates. I have yet to meet an editor who will allow any breach of that norm and I've been designing books for 20 years. I'm sure one can get away with more creative use of dashes in other contexts.</p>
      <p>Tim: The point of the em dash is exactly that: to add a big gap. It represents a gap in thinking, a change in thought. I happen to like the width of the em in this font (Mercury is it?) It's too bad when it's either disproportionately wide or kerned too tight but those can be adjusted and should.</p>
      <p>FYI (and I'm not sure where the Brits fit in) it is also common in Europe not to indent paragraphs, which I find makes for hard reading.</p>
