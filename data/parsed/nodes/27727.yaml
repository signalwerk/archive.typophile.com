    html: |-
      <p>An em dash -- is simply a long dash. If it's too long for you, use an en dash or horizontally scale it (yes, it's okay to scale a rectangle).</p>
      <p>Contrary to the P22 primer, the europeans generally use spaces (sometimes thin spaces) on either side of dashes, and I prefer it. No space creates visual tension for me. Many fonts need the room to breathe. As Nick said, all of this depends on the font, as some dashes are longer than others and some have sidebearings with space, some do not.</p>
      <p>The only hard and fast rule is that you must remain consistent in your use throughout a piece or brand.</p>
      <p>Hey Patty - you just used a hypen with spaces when addressing Nick! Is that ok? ;)</p>
