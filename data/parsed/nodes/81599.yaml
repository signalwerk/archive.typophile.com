    html: |-
      <p>Thanks for your feedbacks! In fact I'm not so good in naming :)<br>
      I have chosen “radical” just because<br>
      1. I like the word :) it makes people talk :) and it doesn't seem to be already taken for a font.<br>
      2. I had more in mind the <em>radical</em> choice to have blocky, solid, geometrical shapes + all-caps only. A choice that was radical in the 30s of course, as the italian <a href="http://en.wikipedia.org/wiki/Futurism" target="_blank" rel="nofollow">futurist</a> movement was (but don't want to cite futurism for font naming to avoid any link to fascism).<br>
      I know very well my final design isn't "radical" at all in 2010, it's not the scope.<br>
      The version shown here is the wider one (so more round and closer to Gotham); I'm working on condensed versions that look closer to the link Stephan kindly posted. In fact I've an type-photo project ongoing too. </p>
      <p>@Hrant: <em>Titling</em> sounds much better, thank you!</p>
