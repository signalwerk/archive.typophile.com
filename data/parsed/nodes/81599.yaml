    <p>Hello everybody,<br>
    well… I'd like to ask for any feedbacks and/or suggestions about the first font I’m publishing.<br>
    At the basis I’m a web&amp;graphic designer but I’d like to work in type-design too. </p>
    <p>I’ve called my font Radical Display: it is an uppercase-only font family inspired on european typographic tendencies of the first half of 20th century.<br>
    It looks rational, geometric and blocky. However, it is based on optical proportions.<br>
    This font face is designed to be used for headlines, visual identities or short sentences.<br>
    Lighter faces provide a more contemporary and design look&amp;feel, while the bolder ones look definitely retro.  </p>
    <p>Here below a little demo:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/demo_4716.jpg"></div><p></p>
    <p>I’ve also created a micro site to show it, add more informations and permit its download <a href="http://typography.synthview.com" target="_blank" rel="nofollow">typography.synthview.com</a>.</p>
    <p>I plan to complete this font by a series of condensed versions afterwards. </p>
    <p>Thank you in advance.<br>
    Jan</p>
