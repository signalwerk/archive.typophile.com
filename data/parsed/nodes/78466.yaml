    votes: null
    html: |-
      <p>@Eliason: Good call on the /H/; I hadn't thought of that. The serify bits—lets call them 'stumps'—are to me an integral part of the character of the face. They're used on 14-16 glyphs (depending on if you use the alt E and F) and there are fatter stumps on 8-12 or so more (depending how broadly you define 'stump'). So I thought it was pretty thoroughly established... Hmm... Is it just that the contrast is too much, as 1996type suggests?</p>
      <p>I definitely agree that the numerals are the best part, which is funny since I whipped them up in about 30min from sketches through vectors.</p>
      <p>@1996type: What is it about the ligatures you don't like?</p>
      <p>---</p>
      <p>In general, I need to do some x-height equalizing and such.</p>
      <p>Here's a catalog cover (rough draft) I designed using Laffy Fatty:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AIA-Covers_take2_4213.jpg"></div><p></p>
