    html: |-
      <p>As I <a class="freelinking external" href="http://typophile.com/node/80997" rel="nofollow">said to this fellow</a>, the issue is good sportsmanship more than anything else. If you're going to solicit design feedback in a forum populated by professional typographers, some basic due diligence is in order. </p>
      <p>A Google search for <a class="freelinking external" href="http://www.google.com/search?client=safari&amp;rls=en&amp;q=fatty+font&amp;ie=UTF-8&amp;oe=UTF-8]" rel="nofollow">"fatty font"</a> would've brought up Dilworth's font as one of the top results. A search on FontShop for "fatty" would've shown it as <a class="freelinking external" href="http://www.fontshop.com/search/?q=fatty" rel="nofollow">the top result</a>. <a class="freelinking external" href="http://new.myfonts.com/search/fatty/fonts/" rel="nofollow">Same with MyFonts</a>. </p>
      <p>"But … but …" But what? The only possible counterarguments to this principle are "I didn't know that Google, FontShop, or MyFonts existed" or "I didn't have the 10 seconds it would've taken to do those searches."</p>
