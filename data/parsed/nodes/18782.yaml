    <p>The teachers at my school have asked us students to recommend three typefaces (families), as they are looking to expand their (meager) library on the school’s computers.. and you all here seem to be very handy in recommending fonts when someone is looking for a good alternative to this and that font, so I’d just love for you all to inspire me to find three nice families to recommend.</p>
    <p>I was thinking I’d recommend a serif text font, a sans serif and a more fanciful display font (not necessarily House Industries fanciful, but more exotic and unique). Preferrably all available in Opentype formats.</p>
    <p>Oh, and they have many of the standard classics (Garamond, Baskerville, Bodoni, Bookman, Franklin Gothic, Futura, Palatino, Gill Sans, Helvetica, etc.) so I was thinking I’d recommend some more new and not quite as common fonts. They should be fairly broad in usability though since they’d be used for students on all kinds of projects.</p>
    <p>Thank you in advance!</p>
