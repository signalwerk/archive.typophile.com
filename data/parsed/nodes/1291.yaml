  - id: 10297
    user: 2203
    date: 2003-09-16T14:49:00
    date_raw: 16 Sep 2003 — 2:49pm
    votes: null
    html: <p>I'm not a big fan of using the same font for a logo and the text. I feel the logo should stand alone, unique in character. But for CI purposes, establishing a sans and a serif that reflects the feel of the clients goals is imperative. I'd be tempted to go techno for the logo type and be less dogmatic on which sans or serif faces you propose for this client. Remember most people using this site won't get it anyway, they are more concerned with content than the shapes of the letters, especially in text size formats. Plus you have another consideration, on text on their site that changes regularly, you will have to pick a font that is pretty universal and on most computers. Its not a simple chore. Dan </p>
    html_clean: <p>I'm not a big fan of using the same font for a logo and the text. I feel the logo should stand alone, unique in character. But for CI purposes, establishing a sans and a serif that reflects the feel of the clients goals is imperative. I'd be tempted to go techno for the logo type and be less dogmatic on which sans or serif faces you propose for this client. Remember most people using this site won't get it anyway, they are more concerned with content than the shapes of the letters, especially in text size formats. Plus you have another consideration, on text on their site that changes regularly, you will have to pick a font that is pretty universal and on most computers. Its not a simple chore. Dan </p>
