  html: <p><img src="http://www.typophile.com/forums/messages/4100/16216.jpg" alt="Cobalt Data Logo"> <br> <br>Looking to re-vamp this logo for a client. <br> <br>Starting with the type. <br> <br>I'm looking for suggestions on a flexible sansserif face that will be used for the entire identity system. <br> <br>The mark will remain virtually unchanged, except for some minor improvements. I will use this type in the actual mark, as well as for the body text of all printed materials -- so it needs to be somewhat flexible. Cobalt data is a database and programming/development software company. Not selling software, but strictly development for clients, mostly server side applications. <br> <br>Looking for something to reflect this, something with a touch of a technical feel, but something that could be flexible enough to set body text in, for example NOT a titling face. Preferably 3 or so weights, small caps and ligatures are always a plus, especially considering the amount of acronyms in an IT field such as this. <br> <br>So, suggestions? Also the customer is looking to stay in the $150 ceiling price range. <br> <br>thanks! <br> <br>hildebrant. <br> <br></p>
  html_clean: <p><img src="http://www.typophile.com/forums/messages/4100/16216.jpg" alt="Cobalt Data Logo"> <br> <br>Looking to re-vamp this logo for a client. <br> <br>Starting with the type. <br> <br>I'm looking for suggestions on a flexible sansserif face that will be used for the entire identity system. <br> <br>The mark will remain virtually unchanged, except for some minor improvements. I will use this type in the actual mark, as well as for the body text of all printed materials -- so it needs to be somewhat flexible. Cobalt data is a database and programming/development software company. Not selling software, but strictly development for clients, mostly server side applications. <br> <br>Looking for something to reflect this, something with a touch of a technical feel, but something that could be flexible enough to set body text in, for example NOT a titling face. Preferably 3 or so weights, small caps and ligatures are always a plus, especially considering the amount of acronyms in an IT field such as this. <br> <br>So, suggestions? Also the customer is looking to stay in the $150 ceiling price range. <br> <br>thanks! <br> <br>hildebrant. <br> <br></p>
