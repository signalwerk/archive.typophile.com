    date_raw: 16 Sep 2003 — 11:56pm
    votes: null
    html: <p>I'm a big fan of <a href="http://www.fontbureau.com/fonts/font_frames.tpl?fontname=Stainless" target="_blank">FB Stainless</a>. Underexposed (never seen it  <br>used) and modern without an overt hi-tech luster. Plus, it's <br>by Cyrus Highsmith, so you can count on quality of the <br>highest caliber. <br> <br>It has no small caps, but I think your money for this sort of <br>usage is better spent on multiple weights and widths than <br>on SCs. Also, consider the benefit of a <a href="http://www.fontbureau.com/fonts/font_frames.tpl?fontname=Dispatch" target="_blank">serif companion</a> <br>for future purchase.</p>
