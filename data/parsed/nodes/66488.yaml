    <p></p><div class="imageWrap"><img src="http://typophile.com/files/01_5754.jpg"></div><p></p>
    <p>Santa is late but he's finally here! The OpenType Basic version, full commercial licence, of Adelle Bold and Bold Italic can be downloaded free of charge at TypeTogether's website. </p>
    <p>The award winning Adelle is a dynamic slab serif designed by Veronika Burian and José Scaglione. While it is conceived specifically for intensive editorial use, its personality and flexibility make it a real multiple-purpose typeface. The intermediate weights deliver a very legible and neutral look when used in text sizes, providing the usual robustness expected in a newspaper font. The unobstrusive appearance, excellent texture and slightly dark color allow it to behave flawlesly in continuous text setting, even in the most demanding editorial applications.</p>
    <p>As it becomes larger in print, Adelle shows its personality through a series of meassured particularities that make it easy to remember and identify. Its energetic character, so inherent to slab serif fonts, becomes evident as the typeface is used for subheadings and headlines.</p>
    <p>The full OpenType Pro version of this font family has 12 styles, ranging from light to heavy, with more than 900 characters per font. It provides support for many OpenType features such as small caps, stylistic alternates, fractions, five sets of figures and more.</p>
    <p>To download the fonts go to the address below and use code: f21dd6a</p>
    <p><a href="http://www.type-together.com/index.php?action=carro/getFreeFont" title="http://www.type-together.com/index.php?action=carro/getFreeFont">http://www.type-together.com/index.php?action=carro/getFreeFont</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/02_5002.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/03_3825.jpg"></div><p></p>
