    html: |-
      <p>Cuttlefish, what are you seeing in this icon? I probably can't unsee it once I do, but right now I'm not seeing anything other than a lock.</p>
      <p>I also agree the /e interrupts the flow. The lowercase /i possibly makes the logo too casual for a security firm, but perhaps the concept of the /i in the lock icon will be lost on you then. I guess you will have to try a few different things out.</p>
      <p>I can say however that it generally goes against my philosophy to use a typeface for a logo which is already in overuse. There are exceptions to this, but essentially a logo needs to be unique, and I don't think you do that by selecting the most popular/overused typefaces there are. The rounded shapes do match well with the icon though, so I would look for other sans serifs with the same kind of shapes.</p>
      <p>Maybe shorter ascenders will work nicely as well. It would make the type more compact so you have more vertical space to fill, which might fix the weight issue you're having (which is rather a color issue I think) and allows you to set the slogan at a bigger point size. I guess you shouldn't be afraid to use a bit more space horizontally as well, otherwise you will have to use a condensed type for the slogan, which is probably not smart.</p>
