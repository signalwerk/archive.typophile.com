    <p>Hi Typophile friends,</p>
    <p>I am currently refreshing the logo to be used on web, pretty much everywhere else. I feel that the weight of type might not match the icon. Currently using Futura bold with Museo slab 500.  Should i use two sans serif fonts or keep the two different styles currently?</p>
    <p>Also, I was wondering for the web, if I went ahead with the two fonts above would you guys and gals use the same fonts for the web copy (one for headings, the other for paragraph)? Any tips??? Please critique away..</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/logoNEWlarge_6602.jpg"></div><p></p>
    <p>Thanks a ton!</p>
