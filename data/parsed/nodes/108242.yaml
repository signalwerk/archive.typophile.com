    html: |-
      <p>&gt; Should i use two sans serif fonts</p>
      <p>Different weights or styles from the same family might be fine, but two entirely different sans serifs in the same logo could look weird. </p>
      <p>To me, Futura's circular shapes goes well with the round icon, but using all lower case (which I usually like in a logo) may be a tad casual for a security firm. You might experiment with all caps or a cap "I".</p>
      <p>"Home security" will become very tiny if the logo is reproduced small.</p>
