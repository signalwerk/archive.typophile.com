  html: |-
    <p>Hey y'all</p>
    <p>A friend of mine is looking for an easy way to make her handwriting into a usable font. I would suggest something along the lines of FontLab (which I think is what we used in school) but I'd like to give her something a little more simple -- hopefully so she won't have to mess with illustrator etc. </p>
    <p>Just from googling I've seen a couple services dedicated to this, but I'm wondering if any of you have tried something like this and/or would recommend one over the other.</p>
    <p>Thanks!</p>
    <p>Helen</p>
