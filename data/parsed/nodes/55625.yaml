    html: |-
      <p>Hi Sanch,</p>
      <p>welcome to Typophile!<br>
      This is probably based on/influenced by <a href="http://www.fontshop.com/fonts/downloads/itc/itc_bauhaus_std_by_adobe_complete_vp/&amp;sample_text=bambo" rel="nofollow">ITC Bauhaus</a> or <a href="http://www.fontshop.com/fonts/downloads/itc/pump_std_virtual/&amp;sample_text=bambo" rel="nofollow">Pump</a>. Also check out <a href="http://www.houseind.com/fonts/chalet" rel="nofollow">Chalet</a> and <a href="http://www.fountaintype.com/typefaces/dessau/styles" rel="nofollow">Dessau</a>.</p>
      <p>In case you are interested in the finger-like terminals, have a look at <a href="http://www.fountaintype.com/typefaces/girl" rel="nofollow">Girl</a> or <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_cocon/" rel="nofollow">Cocon</a>.</p>
      <p>BTW, such requests should better be posted on the <a href="http://typophile.com/forum/29" rel="nofollow">Type ID Board</a>.<br>
      F</p>
