    html: |-
      <p>Thanks for your suggestions. Using a visual element was my first idea, because six languages are really too much. Below is the image I've made.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ambi_3454.jpg"></div><p></p>
      <p>The other one is to use only text in 'interesting' way. Maybe it can be done with only one font (using different styles, like Hrant suggests, for the different 'voices'), or can be done with totally different fonts, one for each language.</p>
      <p>And to add another problem the arabic text can't be set in indesign. For that reason I think is better a font with the cyrillic than a font with the arabic language. What do you think of Gentium? (money is another problem)</p>
      <p>I don't think my client want to split it in more than one poster.</p>
    html_clean: |-
