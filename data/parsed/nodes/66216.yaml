      <p>I just remembered that Seria has a recently-made Arabic companion:<br>
      <a href="http://www.behance.net/Gallery/FF-Seria-Arabic-First-Arabic-Speaking-FontFont/242682" title="http://www.behance.net/Gallery/FF-Seria-Arabic-First-Arabic-Speaking-FontFont/242682">http://www.behance.net/Gallery/FF-Seria-Arabic-First-Arabic-Speaking-Fon...</a><br>
      Although it's not what I consider ideal, it's still quite good.</p>
      <p>And Seria itself has serif and sans styles, each with two weights*,<br>
      each of those with an upright cursive! So you could set 8 Latin-script<br>
      languages with it. :-)  The only missing piece would be the Cyrillic.</p>
      <p>* You could set the Regular large and the<br>
      Bold small to end up with a visual balance.</p>
      <p>hhp</p>
