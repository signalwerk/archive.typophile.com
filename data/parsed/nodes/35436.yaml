    <p>Hello again,</p>
    <p>MAQ is a company that is going to start giving out certificates for nurses and other people in the medical field. The certificate is for treatment/handling of prescription drugs, dosage and things like that for patients.</p>
    <p>They take a test and if they pass they get a certificate that shows they are capable of handling prescription drugs.</p>
    <p>Anyway, I sort of mentioned the first idea that popped into my head to the client. That perhaps some version of the round stamp/seal that you usually see on old certificates, could be a nice logo. She really liked it for some reason but I hadn’t really thought through how that would look exactly.</p>
    <p>So the first versions I drew is suppose to remind one of the stamp.</p>
    <p>I would like to hear your opinions about the feather pen and the leaf. The pen would relate to the signing of the certificate making it official. The leaf would stand for growth and education. Is it to far of a reach or do you think this idea could work?</p>
    <p>These sketches are pretty rough.</p>
    <p>Peter</p>
