      <p>The feather/leaf icon is kinda interesting, not really for medicine. In addition I think you have to make the leaf a tad bit smaller. The size relation is off. </p>
      <p>As for the rest of the stamp idea. I don’t think they read as certificate stamps. #4 looks like a cross/hill and sunrise. #2 could work, but I don’t understand the little green collar. #3 seems busy and to abstract. #5 I just don’t like. It looks heavy. #6 you said it...alien like. You gotta keep in mind how this will work in black/white. #2 works the best out of all them. </p>
      <p>The visual I saw when you mentioned the stamp on an old certificate seemed more organic, not so polished. Just some thoughts.</p>
