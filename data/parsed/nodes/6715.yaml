  html: "<p>I need to make a typographic statement for this neophilic question: \"Is Scarlett (Johansson) the new Marilyn Monroe?\".  I am trying to capture some of the speculation how people are hailing this actress the new Marilyn, especially as she bares more than a passing resemblance to her: the hair, full lips, curvy figure, glamour beyond her 19 years. When she wore a white satin dress to the Bafta awards, she was on the cover of many newspapers who put their pictures next to each other and made comparisons. <br>This is not for commercial use, I am a student and would appreciate any advice on how to convey this using pure typography and/or images.  I am just finding it difficult to start, and even though these designs wont be sold, I also feel wary about using existing photos of Marilyn (copyrights etc). The design will be screenprinted onto a large tea towel so any imagery I would use of Scarlett/Marilyn I would want to be 2 colours max, but iconic enough - her lips or a Warhol type print of her face/ use of silhouettes.  I have been looking at her movie posters but don't merely want to rip one off.  I do want to include some of that vintage Hollywood glamour, but also the question of whether Scarlett is the our answer to Marilyn for 2004?!   <br>There is the idea of clones and today's stars styling themselves as the older Hollywood legends - to increase their status perhaps?  <br> <br>I could also do the statement \"Puppies are the new babies\" - using type or image.  I am referring to the trend of mainly celebrities using puppies as the latest A-list accessory, think Paris Hilton, Legally Blonde.  I would appreciate any thoughts or advice that might help, as it would be interesting to see how typographers would approach this brief. ..</p>"
  html_clean: "<p>I need to make a typographic statement for this neophilic question: \"Is Scarlett (Johansson) the new Marilyn Monroe?\".  I am trying to capture some of the speculation how people are hailing this actress the new Marilyn, especially as she bares more than a passing resemblance to her: the hair, full lips, curvy figure, glamour beyond her 19 years. When she wore a white satin dress to the Bafta awards, she was on the cover of many newspapers who put their pictures next to each other and made comparisons. <br>This is not for commercial use, I am a student and would appreciate any advice on how to convey this using pure typography and/or images.  I am just finding it difficult to start, and even though these designs wont be sold, I also feel wary about using existing photos of Marilyn (copyrights etc). The design will be screenprinted onto a large tea towel so any imagery I would use of Scarlett/Marilyn I would want to be 2 colours max, but iconic enough - her lips or a Warhol type print of her face/ use of silhouettes.  I have been looking at her movie posters but don't merely want to rip one off.  I do want to include some of that vintage Hollywood glamour, but also the question of whether Scarlett is the our answer to Marilyn for 2004?!   <br>There is the idea of clones and today's stars styling themselves as the older Hollywood legends - to increase their status perhaps?  <br> <br>I could also do the statement \"Puppies are the new babies\" - using type or image.  I am referring to the trend of mainly celebrities using puppies as the latest A-list accessory, think Paris Hilton, Legally Blonde.  I would appreciate any thoughts or advice that might help, as it would be interesting to see how typographers would approach this brief. ..</p>"
