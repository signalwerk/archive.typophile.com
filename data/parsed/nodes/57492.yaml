      <p>I used to hate how a Les Paul looked. Until I realized that the very nature of the Les Paul <em>defines</em> what cool is. If it plays awesome, is awesomely useable, sounds great, works in any number of settings, etc., then almost magically it starts to look awesome as well.</p>
