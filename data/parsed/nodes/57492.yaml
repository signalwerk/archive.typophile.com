      <p><cite>If it does not look great before the explanations, why would it look great afterwards?</cite></p>
      <p>Because type appreciation is cutural. The explanation allows me to appreciate why someone would design a font like this, why he thought that there are designers who might use it, and why he thought people wouldn’t have too much trouble reading it when they encounter it. I still wouldn’t use Vidange—it just isn’t my cup of rather orderly tea. But, having seen the photos that inspired it, I’m sure that there are plenty of designers in France who would just love to use Vidange.</p>
