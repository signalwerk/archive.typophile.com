    <p>Hello all,</p>
    <p>I’m designing a logo for a chiropractic/wellness practice, and am looking for an appropriate typeface. I’m looking for something clean, sans serif, and perhaps humanist. Really looking for something that would fit with a sort of new age vitality mentality without being trendy. Feel free to plug your own work, I’m looking for some suggestions to table to the client.</p>
    <p>J.</p>
