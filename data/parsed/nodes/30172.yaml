      <p>There are so many new and nice San Serif faces out there - and that does seem like a nice path for you to be on for this project.</p>
      <p>I love Today Sans - but only in the lighter weights. The other suggestions are nice as well.</p>
      <p>A newer font that was brought to my attention from a French designer is Kievit. (He is making me use it in a project he is working on - and it’s growing on me... replacing Frutiger and Formata for that matter)</p>
      <p>If not for this project - it may still be worth a look-sie to keep in mind when you are looking for a san serif that is well drawn and you are tired of the others...<br>
      <a href="http://www.myfonts.com/fonts/fontfont/kievit/" title="http://www.myfonts.com/fonts/fontfont/kievit/">http://www.myfonts.com/fonts/fontfont/kievit/</a></p>
    html_clean: |-
