      <p>I fear it will develop in parallel to the overall gist of electronic gadgets: bells and whistles, instead of real functionality. I really don't want to be negative about this, and I'm prepared to be proven wrong (and even take part in a future where I'm proven wrong) but almost everything I've seen is way too concerned with "image", and not concerned enough with really helping users. A couple of weeks ago I had an encounter with Patricia Roller (founder and former CEO of Frog Design) and she seems to share this disillusionment. She actually got visibly angry at somebody who was praising the supposed "power" of his Treo.</p>
      <p>hhp</p>
