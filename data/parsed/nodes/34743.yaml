      <p>It's a good open question. I'll help the discuss with a breakdown of the 3 types of instances where it will show up (which loosely defines the players responsible):</p>
      <p>1- Mobile phone UI. The UI that's built into the handset (as with Punchcut's Qualcomm Sans in the article you mentioned). // Falls to the manufacturers and carriers.</p>
      <p>2- Mobile web sites (like what you will see when using a mobile browser (Opera and Opera Mini, IE for Windows Mobile, Safari Mobile Version, etc., etc., etc., The list is long, tedious and the results ugly.) // Falls to the web site and content owners.</p>
      <p>3- Fonts embedded into "after market" games, applications, themes, and content (like e-books). // Falls to the app developers and sometimes affected by the carriers who certify them.</p>
