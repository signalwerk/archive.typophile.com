    <p>I was recently flipping through the type issue of Step Inside Design magazine, where Jared Benson offered his expertise on the subject. Looking at the case studies, and with the iPhone being introduced this week...it had me thinking... </p>
    <p>What will the future of typography on cell phones and handheld devices be like?</p>
    <p>Are higher resolution handheld displays changing how people think about designing type for these devices?</p>
    <p>(* Note: Please do not use this thread as an excuse to rant about how much you may hate the iPhone.)</p>
