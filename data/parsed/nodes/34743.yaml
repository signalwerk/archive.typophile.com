      <p>eInk, ePaper or whatever you call it. No matter how they name it I don't think this will be the course of the future for displaying things, because this will limit the usage of devices. And I don't think that eInk in any way shape or form will be of any usable form and packed into a really useful device in the next at least 5 years. Because processor power will be in the time of the technology so much higher, there will be completely other  possibilities of interaction. Processor will be able to handle them. eInk as a ready technology will probably be a decade too late on the market to really spread.</p>
      <p>When it finally comes out its lifespan won't be as it is with nowadays LCDs. They're here to stay with the interaction technology for as long as we will interact with computers the way we do. Even interaction changes may not change them. Take for instance Microsoft's Surface (which is BTW just an exploitation of the first step done just now by the iPhone)</p>
      <p>Displays will definitely "go off" devices. I wondered who ever used UMTS for practical reasons and not just because it's so fancy to talk and see the other party? It's not intuitive, it's not how we think communication works. Not with a mobile device. This will change.</p>
