      <p>&gt; Try last year: Sony CLIÉ.</p>
      <p>Exactly what I was saying:<br>
      <cite>And I don’t think that eInk in any way shape or form will be of <strong>any usable form and packed into a really useful device</strong> in the next at least 5 years.</cite></p>
      <p>I should probably write: market successful device that has obvious advantage over competing products without ePaper.</p>
      <p>The thing is that CLIE is just another handheld device. The use of eInk/ePaper doesn't really need to be there. It could be done like all the rest. ePaper will be great in applications as mentioned later: newspapers, public places... And hopefully small devices that would be able to have larger display as the dimension of device itself. That's where ePaper comes in and replaces LEDs (TFTs, OLEDs, whatever).</p>
      <p>Also consider the development of LEDs. The biggest difference between ePaper and LEDs is the light source. If they manage to make a durable flexible LED display that integrates back light and doesn't consume too much energy, believe me, ePaper WILL BE DEAD. Light and energy are main advantages. If they don't make the resolution of it at least 2x it's bound to fail.</p>
      <p>As I can see we are still talking the same things here.</p>
