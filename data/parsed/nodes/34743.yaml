      <p>What good is pixel font editor if the device is high res and uses ClearType like technology? It was probably more important years back with monochrome displays. All future handhelds (we'll see how long we'll have to wait) will use technologies like ClearType, which means that fonts will be vectors there too. No need for pixel editors. Processor power is doubling every 18 months, memory prices are falling down, so doors are opening here too. iPhone BTW doesn't use the highest res of all the handhelds I know about. AFAIK there's a much better display around on an iPaq. (coincidentally named with starting i?)</p>
      <p>The bigger problem that I see here is the size of the display. Handhelds may become smaller and have higher resolution displays and being able to display FIRST CLASS type but that will definitely restrain our eyes. So the biggest advancement will still be in displays not technology behind them. How to pack a bigger display in a device of a smaller size? Or even don't pack it but project the image in space/surface somehow.</p>
      <p>And BTW: you can develop .Net solutions for mobile devices running Windows Mobile OS. No $$$ included... There's a special .Net Compact Framework that serves the purpose.</p>
