      <p>"Image" isn't necessarily a bad thing. Saying that image isn't an important part of user experience just doesn't make sense. The bigger problem, as I've seen it, is that device manufacturers/purchasers don't understand the value of typography in creating "image". As an industry the device makers are still a little engineering focused, as opposed to experience focused. Making type look good can be expensive from a processor/memory standpoint, not to mention from a development/design standpoint. The iPhone will raise the bar in this category, whether it's successful or not.</p>
      <p>As for the power of the Treo: it's the only mass market phone that I know of where a user can write and compile software without having to sign up for a crazy developer program that requires each application to be signed by the phone manufacturer and lots of money (I'm not sure if windows mobile requires signatures, but I'm pretty sure that windows mobile devs can't use free compilers - only pros with $$$ can play). A good example of why this is powerful: how many phones have a great pixel font editor? Only the Treo, as far as I know. In the bitmap font editor category, my years old treo is light years ahead of the iPhone with its closed platform. I know that hackability doesn't always equate to user-friendliness, but user-friendliness is not the same as power.</p>
