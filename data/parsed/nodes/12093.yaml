    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a>: Greg Kolodziejzyk</strong></p>
    <p>Greg founded <a href="/wiki/Image%20Club" class="freelinking" rel="nofollow">Image Club Graphics</a> in 1985 and designed several dozen typefaces in the late 80s using first-generation versions of <a href="/wiki/Fontographer" class="freelinking" rel="nofollow">Fontographer</a>.</p>
    <p>Website:</p>
    <p><a href="http://www.adventuresofgreg.com/" title="http://www.adventuresofgreg.com/">http://www.adventuresofgreg.com/</a></p>
