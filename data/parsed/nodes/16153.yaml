    <p>Hi</p>
    <p>I am graduate student in Communications Design Program at Pratt Institute, NYC.<br>
    As a part of my studies I have started the research process for my thesis, and clearly convinced that I wanted this to deal with Type I have come to a point were OpenType has crossed by.</p>
    <p>For this matter I’ve tried to read as much information on the web and in all the blogs about this subject, (typophile, typographica, typotheque and typblography) to get to a point where I would like to ask for opinions and advice from all of you (typographers, type designers and graphic designers) about your opinions and expectations regarding OpenType.</p>
    <p>Some generic questions that come to my mind are:<br>
    - Is OpenType going to become the standard format in the near future putting apart TrueType and PostScript fonts?<br>
    - Will OpenType allow for better typographical usage from general users?<br>
    - Will the internet benefit from the use of OpenType?<br>
    - Will most common applications become OpenType savvy?</p>
    <p>A more precise question that I have is about the possibilities that OpenType encoding can allow.<br>
    Taking Amy Papaelias great thesis project as starting point, ( <a href="http://www.typetalkfonts.com/typetalk_demo.html" title="http://www.typetalkfonts.com/typetalk_demo.html">http://www.typetalkfonts.com/typetalk_demo.html</a>  &amp;  <a href="http://typographi.com/001007.php" title="http://typographi.com/001007.php">http://typographi.com/001007.php</a> ) I have been wondering how far can we take the encoding of OpenType fonts. Any thoughts?</p>
    <p>I’d kindly appreciate anyone’s opinions, comments or suggestions for future readings, directing me to other posting or to any other related materials.</p>
    <p>Thanks.</p>
    <p>Giovanni Jubert</p>
