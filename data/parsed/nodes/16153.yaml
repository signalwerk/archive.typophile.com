      <p><cite>Is OpenType going to become the standard format in the near future putting apart TrueType and PostScript fonts?</cite></p>
      <p>Besides agreeing with earlier comments, I’d like to point out that there is a big difference between three things in terms of what constitutes “the standard format”:</p>
      <ul>
      <li>The installed base of fonts, what people have available to work with. Because fonts last virtually forever, the installed base will remain overwhelmingly non OpenType for a long time.<p></p>
      </li><li>Which of the fonts they have available people choose to actually use. OpenType will do pretty well here, at least among professional designers and graphic artists.
      </li><li>What fonts people buy. I think that by the end of 2006, if not sooner, OpenType fonts will be the majority of fonts being sold.</li></ul>
      <p><cite>Will OpenType allow for better typographical usage from general users? Will the internet benefit from the use of OpenType?</cite></p>
      <p>I agree with John’s comments on these issues. Eben is right insofar as the difference won’t be overwhelming, but it should be noticeable.</p>
      <p><cite>Will most common applications become OpenType savvy?</cite></p>
      <p>If “most common applications” comprises Microsoft Office, key Apple applications, Adobe/Macromedia applications, and QuarkXPress, then the answer is clearly “yes.” But I think it may be a very long time before your average accounting software becomes OpenType savvy.</p>
      <p>Cheers,</p>
      <p>T</p>
