      <p>Thanks Giovanni! </p>
      <p><em>I have been wondering how far can we take the encoding of OpenType fonts. Any thoughts?</em></p>
      <p>many thoughts...</p>
      <p>Christina Schulz’s <a href="http://www.christinaschultz.de/piclig_web.htm" target="_blank">Picture Ligatures</a> is really interesting. Although she no longer has the demo online, I’m sure she’d be willing to answer some questions.</p>
      <p>Hopefully, you are already aware of House Industries’ <a href="http://www.houseindustries.com/index.php?page=showfont&amp;id=150&amp;subpage=ed_features" target="_blank">Artificial Ed-telligence</a> and Christian Schwartz’s <a href="http://www.vllg.com/OrangeItalic/LocalGothic/mudTyper+Weights" target="_blank">Local Gothic</a></p>
      <p>OpenType affords many more possibilities for customization, but my question is: to what end? What do you hope is the outcome of your research? </p>
      <p>I suggest you focus your efforts on both learning more about OpenType and also, thinking about the “to what end” question...In my case, I probably would have never come up with the idea of visualizing linguistic behaviors in a font if I had not been serendipitously studying sociolinguistics...</p>
      <p>feel free to contact me if you have any questions, etc...</p>
      <p>Amy</p>
