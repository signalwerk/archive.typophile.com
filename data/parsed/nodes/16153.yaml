      <p>I wrote a piece about OT for Graphic Exchange in 2002. “Big Thing” (it’s in PDF at my site). Phil Baines had something in Eye at the same time. </p>
      <p>I think OT is about to break, now, for many reasons.</p>
      <p>First will be support from Quark 7, still a big force in the graphics industry, despite routine vilification at Typophile.</p>
      <p>Second is “push” from type designers enthralled by its possibilities. These are folk who started off as grunge mac artists and have followed a career trajectory that’s become increasingly professional. Their creative output is engaging with OT.</p>
      <p>Three is the role of trans-national corporations and their support from MS and Adobe — if you’re launching a product in the EU and packaging requires Greek (presently a member) and Cyrillic (Ukraine on the wait list) blurb, it’s no longer good enough just to have optional CE fonts. MS (ClearType upcoming) and Adobe (Minion etc.) are really pushing the market by bundling fonts with massive language support — other foundries will have to do likewise — Peter Bilak’s Fedra at Typotheque is off and running, and many others (myself included) have similar projects under development.</p>
      <p>Four is the penetration of OT support in Adobe apps — they’ve been plugging away at this and InDesign is now well established, and the GaramondPro registration offer is a nice idea, putting a premium on the OT format. I should also mention that distributors like Myfonts are doing their bit to explain and promote, with their system of icons to indicate feature support. </p>
      <p>Five: third time lucky — after GX and Multiple Master, it’s about time for a new font format that sticks.</p>
      <p>I could go on, but it seems to me that OT is well established, and proceeding on many fronts. The fact that it hasn’t yet been a huge immediate “killer app” is a testament to the serious nature of the format — Unicode and what we once called “Expert” typographic features.</p>
