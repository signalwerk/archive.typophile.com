      <p><cite>Is OpenType going to become the standard format in the near future putting apart TrueType and PostScript fonts?<cite></cite></cite></p>
      <p>No technology is ever put aside completely. I predict/guess that OpenType will gain slowly but surely. But It could be a long time before it dominates. 10 years or more.</p>
      <p><cite>Will OpenType allow for better typographical usage from general users?<cite></cite></cite></p>
      <p>No. Good use of type is always going to be a deliberate act bourne of sensitivity insight and knowledge. Asking this is like asking if highway medians will make people better drivers. Of course not. But the medians make accidents less likely and less bad (mostly) when they do happen. So it might seem like you have better drivers with medians in place. If the end result is less carnage then that’s great. Of course accidents still happen and Opentype will not prevent all Typographic accidents.</p>
