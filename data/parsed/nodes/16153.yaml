      <p>I think you need to do a good deal of background reading about the OpenType format. It is pretty crucial to understand and use the terminology of the technology in a consistent and accurate way. For instance, your phrase ’OpenType encoding’ is problematic and doesn’t obviously relate to anything in the format or in OT Layout (and understanding the distinction between the file format and the layout handling is also crucial).</p>
      <p>I recommend starting with the material on the MS Typography website.</p>
      <p><em>Is OpenType going to become the standard format in the near future putting apart TrueType and PostScript fonts?</em></p>
      <p>An OpenType font <em>is</em> a TrueType font insofar as it shares the same sfnt table structure as other flavours of TrueType. What practically distinguishes the OpenType format from TrueType is the <em>optional</em> presence of OpenType Layout tables and/or a CFF PostScript outline table. [The format distinction between TT and OT is the presece of a ’dsig’ table, but this isn’t a very practical distinction for most users.]</p>
      <p><em>Will OpenType allow for better typographical usage from general users?</em></p>
      <p>In many cases, it will effectively enforce better typographic usage by improving the default behaviour. So, for example, one can expect standard ligatures and contextual alternates to be on by default. Likewise, when users select a smallcaps function, there will be a better chance that they will get true smallcap glyphs, rather than scaled uppercase letters.</p>
      <p><em>Will the internet benefit from the use of OpenType?</em></p>
      <p>It already does for the millions of people who access websites in e.g. Arabic, Hindi, Thai, etc. Smart font layout is required for the correct shaping of many of the world’s writing systems. It is important to understand the degree to which the typographic niceties that most English-language typographers associate with OpenType are riding on the back of software internationalisation and complex script support.</p>
      <p><em>Will most common applications become OpenType savvy?</em></p>
      <p>Yes. In many cases, they will become so through system level libraries and services. For instance, my browser and e-mail software are already OT savvy when it comes to the complex scripts that I work with on a daily basis, and that is simply through utilising capabilities that the operating system makes available. As the operating systems expose more typographic features, these too will become widely available.</p>
      <p>The biggest problems cases for OpenType adoption are large and very popular programs like MS Word, which have a massive legacy code base and backwards compatibility commitments. New applications have it easier.</p>
