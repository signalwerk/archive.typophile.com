    html: |-
      <p>The P22 license says, "The font may be modified if properly licensed for non-commercial or in-house use. The modified font software may not be sold or distributed." Which appears to be functionally the same as Adobe.</p>
      <blockquote><p>The two groups you cite do not contain the same fonts. One contains a 'Standard' set and the other contains the 'Pro' set. </p></blockquote>
      <p>The two packages both have the Std character repertoire. Perhaps they represent two different OpenType conversions of the same set of Type 1 fonts, one by Adobe and the other by Monotype?</p>
