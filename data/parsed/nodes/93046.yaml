    html: |-
      <p>There is no difference between your two selections, the presence of both is indicative of some confusion in the way in which families and foundries are grouped on that version of Monotype's web site. You could try the beta version of their <a class="freelinking external" href="http://new.fonts.com/" rel="nofollow">new web site</a>, which is an improvement, or you could go through <a class="freelinking external" href="http://www.adobe.com/type/" rel="nofollow">Adobe's web site</a> which is clearer. Alternatively, MyFonts lists these and several other takes on Goudy.</p>
      <p>You could also consider the Goudy revival, <a class="freelinking external" href="http://www.theleagueofmoveabletype.com/sorts-mill-goudy" rel="nofollow">Sorts Mill Goudy</a> released through the League of Moveable Type under the SIL Open Font License.</p>
    html_clean: |-
