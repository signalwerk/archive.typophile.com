      <p>Karl, I did look at the Sorts Mill Goudy but the lack of a bold ruled it out for my intended use.</p>
      <p>Juergen, the Lanston package seems like good value next to the Adobe offering, and it has the long descender versions included. From looking at <a href="http://imap.typophile.com/node/85635" rel="nofollow">this thread comparing the two</a> it seems that the LTC version is based on a smaller master than the Adobe one which would be more in line with the size I plan on using it at. It's also got lining, old style, proportional and tabular numerals.</p>
      <p>Decisions, decisions...</p>
      <p>I'd be interested to hear opinions from anyone who's used both.</p>
