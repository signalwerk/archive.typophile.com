      <p>Chris - The two groups you cite do not contain the same fonts. One contains a 'Standard' set and the other contains the 'Pro' set. </p>
      <p>Following is a quote from Tom Phinney on an Adobe Forum:</p>
      <p>"All Adobe Standard fonts support the following languages: Afrikaans, Basque, Breton, Catalan, Danish, Dutch, English, Finnish, French, Gaelic, German, Icelandic, Indonesian, Irish, Italian, Norwegian, Portuguese, Sami, Spanish, Swahili and Swedish.</p>
      <p>Adobe Pro fonts support those languages, plus AT LEAST: Croatian, Czech, Estonian, Hungarian, Latvian, Lithuanian, Polish, Romanian, Serbian (Latin), Slovak, Slovenian and Turkish. Some Pro fonts have more language support than this, such as Greek and/or Cyrillic, and additional extended Latin."</p>
