    <p>Hello all,</p>
    <p>I'm currently looking to purchase a complete family of Goudy Old Style including small caps and old style figures, and having had a look at what's on offer I'm going to plump for the Adobe versions. Browsing around fonts.com turned up two packages that on the face of it seem to offer the same thing, only their naming differs:</p>
    <p><a href="http://www.fonts.com/findfonts/detail.htm?productid=215395" rel="nofollow">Goudy Oldstyle Complete Family Pack</a><br>
    whose fonts are named 'GoudyStd...' or</p>
    <p><a href="http://www.fonts.com/findfonts/detail.htm?productid=215392" rel="nofollow">Goudy 1 Volume</a><br>
    whose fonts are named 'Goudy Old Style...'</p>
    <p>Same price, format, number of fonts and features as far as I can make out. Am I missing something fundamental or is there no practical difference other than what names I'll be seeing in the font menu? I'd be curious to hear the backstory if there are any Adobe folk who could illuminate me.</p>
    <p>Many Thanks</p>
