    html: <p>I think if your paper is North American, you really should look at a serif face for the text. Very few newspapers here use sans for text. I would also be very careful about mixing different text faces. You are better to keep to one family for the text weights. It would be acceptable to find a pair of complementary sans families for heading applications.</p>
