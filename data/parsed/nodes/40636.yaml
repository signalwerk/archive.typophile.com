    <p>Hello,</p>
    <p>I’m in the process of designing a student newspaper (Studentbladet <a href="http://www.stbl.fi" title="www.stbl.fi">www.stbl.fi</a>). It’s about 20 pages in size. Size of the paper is A3 roughly.</p>
    <p>Now I’m looking for header and body text fonts. I’m thinking about useing four diffrent fonts, two sans-serif for header and body text, two sans for smaller column headers and text.</p>
    <p>You can find last years editions in PDF files here <a href="http://www.stbl.fi/tidning/" title="http://www.stbl.fi/tidning/">http://www.stbl.fi/tidning/</a>. I’m going to redo pretty much everything since I and the rest of the new staff don’t agree with the current layout.</p>
    <p>Any suggestions would be much appreciated since I’m new to designing a newspaper. Specially type, suggestions on good readable sans and sans-serifs for print.</p>
    <p>peter</p>
