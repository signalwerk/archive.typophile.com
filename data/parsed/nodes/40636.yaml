      <p>Trim size, number of columns, and measure (as I’m sure you know) can demand a face that will set conservatively. Low x-height will also be tough to handle well in smaller point sizes. I would like to see a sample design if you have time to post.</p>
      <p>You might slug in some <a class="freelinking-external" href="http://www.stormtype.com/typefaces-fonts-shop/free.php">Lido</a> for reference if the Caslon and Jenson are not working like you would want.</p>
