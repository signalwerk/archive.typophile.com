      <p>It’s not North American and it shouldn’t matter.</p>
      <p>After looking around some more I think I’ll go with one serif for main articles headlines and body text and a sans for smaller columns headlines and body text. I’m also considering a third font for vignettes to certain articles that always occur in the paper with some added graphic elements.</p>
      <p>Right now I’m leaning towards Caslon or maybe Jenson.</p>
