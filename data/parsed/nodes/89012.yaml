    <p>Hi everyone, I'm brand new to posting on this forum but I have been an avid reader for a while.</p>
    <p>I am trying to find a standard text outlining the principles of legibility for Chinese typesetting, perhaps in the same way that Jan Tschichold's The New Typography speaks to the principles of legibility for Latin alphabets .</p>
    <p>Maybe no such text exists, but thought I would put it out there.</p>
    <p>Regards</p>
