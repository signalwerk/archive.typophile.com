    <p>I think this is probably a dumb question but here goes anyway...  Is there any point in adding the <a href="/wiki/aalt" class="freelinking" rel="nofollow">aalt</a> feature?  Say it was:</p>
    <p>feature aalt {<br>
      feature liga;<br>
      feature calt;<br>
      feature salt;<br>
    } aalt;</p>
    <p>my fonts seem to work the same whether I put it in or not.  The only reason I can think of for it is to order the other features - ie ligatures get processed before contextual alternates, but they seem to anyway, regardless of the position of the liga feature in the aalt feature.</p>
    <p>What am I missing?</p>
