      <p>The 'aalt' feature was originally defined by Adobe because they wanted a way for glyph insert palettes, such as that in InDesign, to be able to present all the variant forms of a given glyph in a fly-out UI. At the time, they thought the way to do this would be to put all the variants into a single feature, so that the glyph palette could simply query that feature to present the variants.</p>
      <p>But some of use didn't play ball :) -- and started shipping fonts without implementing the 'aalt' feature, and Adobe's app developers did the sensible thing: they wrote the glyph palette code to query all the GSUB layout features and harvest the one-to-one variants that way.</p>
      <p>So, from my perspective, there is no need to implement the 'aalt' feature. That said, Adobe continue to put this feature in all their fonts, and I'm guessing there is probably a processing benefit, in terms of speed and memory resources, if the glyph palette can grab the variants from this one feature. It also probably means you have some control over what variants are presented in the glyph palette.</p>
