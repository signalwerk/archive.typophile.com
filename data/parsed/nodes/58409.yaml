      <p><cite> It also probably means you have some control over what variants are presented in the glyph palette.</cite></p>
      <p>Not only <em>which</em> alternates, but how they appear. In cases where, for whatever reason, the various alternates appear in the Glyphs palette in a strange order, we can specify all the alternates in a specific order in 'aalt'.</p>
      <p>I can't remember exact cases, or if it's even much of an issue anymore... but we did this most often with the various figure styles, where we might have three alternates like fitted oldstyle, etc., and also numerators, etc. We would sometimes see these alternates appearing in an unpleasant order in the Glyphs flyout. We would "hardcode" the desired order in 'aalt' to solve the problem.</p>
      <p>There was also a time when we would put certain alternate substitutions in 'aalt' if we wanted to see them but they didn't appear in other features. Eventually we decided that such substitutions should find a home in some "real" layout feature rather than 'aalt', so we try not to do that anymore.</p>
