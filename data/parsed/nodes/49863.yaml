      <p>Here are a couple of other possibilities:</p>
      <p>1. Use lower-case roman numerals: ix</p>
      <p>2. Combine the numeral and the name (Eva and Tony don't have that). You could use a larger number with the word nine spelled out below and surrounded by a box to make it look like a flash card, or if you used rounded corners on the box you could make it look like a playing card -- if that appeals to you. Or you could curve the word around the top of the number.</p>
      <p>Please take to heart the earlier advice of others to choose your tattoo artist carefully.</p>
      <p>Whatever you decide, please post a photo of the final result for us to see.</p>
