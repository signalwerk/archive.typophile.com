    <p>Yep, that's what I'm gonna do. Don't even try to stop me.</p>
    <p>The inherent problem with the number 9 is that it looks just like the number 6. I'm putting this on my inner forearm, right before the elbow. If I'm sitting at the computer, elbows bent, the bottom of the 9 will face the desk. I'll be looking at it upside down so it will probably look like a 6 to me.</p>
    <p>Wondering if there is any font that is clearly a 9 vs. a 6. I'd like something a little rockabilly-ish looking, but not a 9-ball or something like that. Just a 9, plain and simple. </p>
    <p>I also like the way Garamond has a break between the ball and stem of the 9. </p>
    <p>Thanks for any feedback.</p>
