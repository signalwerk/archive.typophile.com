    html: |-
      <p>"Wondering if there is any font that is clearly a 9 vs. a 6"</p>
      <p>Think you are going to struggle to find a typeface that will achieve this. The problem is that the elements that make a '9' be a nine are the same factors that are used to make a '6' be a six. Thus changing any of the elements i.e changing the straightness of the leg on the '9' will only ultimately change the 6 in the same way. Saying that I do think that it is possible to make the mark more like a 9 instead of a six, but not enough to use on its own.</p>
      <p>From what others have suggested I think possibly having a dot after the number will work best. At first I thought the roman numeral idea might work, but then realised that in fact IX(9) upside down is actually XI(which is 11), so might no do the job unfortunately. </p>
      <p>Good luck. Let us all know what you decide to do.</p>
    html_clean: |-
