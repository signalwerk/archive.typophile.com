    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Point of Maximum Stress</strong></p>
    <p>The thickest part of curved letters, like <strong>C</strong>, <strong>O</strong>, <strong>S</strong>, etc. (The term <a href="/wiki/stress" class="freelinking" rel="nofollow">stress</a> in typography generally indicates emphasis, not pressure.)</p>
