    html: |-
      <p>I don't think licenses can be transferred whatsoever, as the user is <strong>granted the permission to use</strong> the fonts, but doesn't actually <em>own</em> them. Common logic tells us you can't transfer what you don't own. If another end user wants to use those same fonts, he needs to purchase his own license.</p>
      <p>It was the previous owner's responsiblity to delete the copies of the fonts from his hard drive before selling the computer to your friend. But it's your friend's responsibility <em>not</em> to use said copies of fonts -- if he does, he is liable for prosecution.</p>
      <p>Anyone, correct me if I'm wrong.</p>
