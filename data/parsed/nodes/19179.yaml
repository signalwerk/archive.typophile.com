    html: |-
      <p><em>“You may transfer all your rights to use the Font Software to another person or legal entity provided that (i) the transferee accepts and agrees to be bound by all the terms and conditions of the Agreement, and (ii) you destroy all copies of the Font Software, including all copies stored in the memory of a hardware device.”</em></p>
      <p>Seems rather simnple, I think.</p>
      <p>Your friend can keep using the Monotype* fonts on the purchased computer as long as:</p>
      <p>1. The seller was the real licensee of the fonts on his computer before he sold the machine.<br>
      2. The seller deletes all other copies of the fonts he has, including copies he may have installed on other machines.<br>
      3. Your firend agrees to abide by all of the Monotype EULA's terms.</p>
      <p>Otherwise, your friend must delete all the Monotype fonts on his new computer himself. He did not purchase a license for them, and does not have one simply through acquisition of the computer.</p>
      <p>* Other foundries and other fonts might have differnt EULA restrictions regarding license transfers. You friend must check up after all 1000 of the fonts.</p>
