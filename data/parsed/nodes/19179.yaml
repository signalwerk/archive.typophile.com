      <p>Hi Yves, that was my inital assumption (that licences non-transferrable) however some of the EULAs had transfer clauses such as the example below.</p>
      <p>Example; <a href="http://www.fonts.com/Legal/MI-EULA.htm" rel="nofollow">Monotype</a><br>
      "You may transfer all your rights to use the Font Software to another person or legal entity provided that (i) the transferee accepts and agrees to be bound by all the terms and conditions of the Agreement, and (ii) you destroy all copies of the Font Software, including all copies stored in the memory of a hardware device."</p>
      <p>I'm no lawyer, I could be misinterpreting all this. :^)</p>
