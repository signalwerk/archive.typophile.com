      <p>Every foundry has their own stipulations about the transferability of their fonts within their EULA. </p>
      <p>- Did the person from which your friend bought the laptop also give him the license to the laptop? The fonts which are installed with the system are now licensed to your friend.</p>
      <p>- If the fonts are not part of the system, your friend most likely does not hold the license and should probably delete them.</p>
