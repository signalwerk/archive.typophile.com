      <p>Let me just point out that even if the EULA is binding on the licensee (a big if), the new owner of the computer is not bound by its terms, because of what is known as "privity of the contract" (a contract cannot bind a third party).</p>
      <p>However, in that case the new owner in possession of the fonts might be restricted by law (not by the EULA) from using the fonts for commercial purposes, but that really depends on the jurisdiction.</p>
