  html: |-
    <p>What exactly constitutes a font licence transfer? For instance, my friend recently bought a used Apple Powerbook G4 with 1000 fonts <cite>already</cite> installed. Who owns the font licence now? Is it the previous owner’s or my friend’s responsibility to delete the fonts from the hard drive? </p>
    <p>How do you <cite>usually</cite> transfer a licence? Is there a common ground here?</p>
    <p>I had a quick look through some of the EULAs on disk and I admit I was perplexed by the legal-lingo and general lack of standardisation regarding licence transfer.</p>
