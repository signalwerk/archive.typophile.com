    html: "<p>Andreas, <br> <br>Missing scripts. New scripts are being added all the time, and there is a significant roadmap document that preserves spaces for new scripts in both the Basic Multilingual Plane (16 bit) and the extenstion planes (32 bit). Of the scripts you mention, Etruscan and Gothic are already encoded. I'm not sure what you mean by Gaelic script. <br> <br>Missing characters. If you know of a character that you think needs to be encoded, I encourage you to document it and submit a proposal. Sometimes, if you make enough noise about a particular character and provide a convincing enough argument, someone else will do the work of submitting a proposal, but you can't rely on this. Better to do it yourself. Example: last year at ATypI in Rome, Peter Lofting from Apple made a pilgrimage to the Isle of Tiberius to photograph the earlist known carving of the Rod of Aesclepius in order to demonstrate that this should not be confused with the caduceus and should be separately encoded. He documented his proposal well, and the Rod of Aesclepius has been accepted for encoding in the Unicode Miscellaneous Symbols block. I also notice that the Guarani currency symbol has been accepted, which means that someone has done the work of proposing it. <br> <br>Regarding scribal abbreviations, I am not convinced that these need to be encoded. Unicode encodes characters for plain text, but not everything that occurs in text needs to occur in plain text. Scribal abbreviations are a form of ligature, and it is possible for them to be handled with markup and with smart font features (including selection from multiple abbreviations of the same character sequence). <br> <br>Regarding generic informational signs, there is a move to encode more of them, although this has raised the philosophical question of where, exactly, does one draw the line. A case in point is the 'Man cleaning up after his dog' sign, which has recently been debated by members of the UTC (not sure what they decided). Such things will always -- and probably should -- raise philosophical issues for a <i>text</i> encoding standard. <br> <br>Regarding Zapf Dingbats, those are included only for backwards compatibility with Apple's ZD codepage. They may not have been accepted if proposed today, but they went in very early, and Apple were a founder members of the consortium. The circled numbers are for compatibility with East Asian standards. <br> <br>Regarding the graphic representation of characters in the codepages, these are intended to be informational only, and are clearly identified as such. The charts are not claimed to be normative, inerrant, consistent, or anything else; the Unicode Standard is not the charts, it is the abstract characters behind the charts. The charts are made from available fonts, in many cases provided by the individuals who proposed specific characters for inclusion. Yes, there is room for improvement, and yes it is possible to suggest improvements or, even better, provide replacement fonts. The Unicode Consortium is not interested, however, in a 'universal standard of writing': the glyphs in the code charts need to be sufficient to present a recognisable and acceptable form for each character: <i>any recognisable and acceptable form</i>. Unicode is a character encoding standard for plain text: it is intended to be the backbone of text processing, not as a project to catalogue shapes.</p>"
