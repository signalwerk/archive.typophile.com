    html: <p>The Serbian italics and the typographic glyphs issue are both conqequences of the character/glyph model (principles 2 and 3 I outlined above). <br> <br>Neither of these things is a "problem" in a smart font format such as OpenType. For example, all of our Cyrillic fonts support the Serbian forms in the italic. <br> <br>The general reason for not encoding typographic glyphs as if they were characters is that it is harmful to plain text operations, and it is an unbounded task. What ligatures would you encode? How about the "Th" ligature that is commonly found in newer Adobe text fonts? What about people who want to have two sizes of small caps in the same font? Or figures that are halfway between oldstyle and lining? <br> <br>Finally, the question about which dingbats are in Unicode is a question of which ones got in because of association with existing standards and codepages. I think you'll find that the black telephone is a standard character in one of the Asian standard character sets, for example. <br> <br>Regards, <br> <br>T</p>
