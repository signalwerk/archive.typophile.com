    html: "<p>First a cheer to John Hudson and Thomas Phinney  for having started discussion. <br> <br>Missing scripts  -:  I enjoyed to lern recently that there are serious activities to add relevant historic or minority scripts. I regard this as very important, in the case of historic scripts it becomes possible for us in the future to keep in touch with our cultural heritage. Many publishing projects need to use things like Etruscan, Anglosaxon, Gaelic, Gothic, Hethit and the like. <br>  <br>Missing characters  -:  It's not so strange that there are any characters missed at all, but in some cases I cannot avoid wondering about the contents of a certain set encoded. An example for this: Currency symbols (20A0 - 20B1. Apart from the well known $, �, � and others which are placed in other areas I miss some signs for currencies or even weight measurement units, the latter being a class of signs historically interrelated with the signs for money: the Balboa (panama, looks like B/.), the Centner (or Zentner), the ancient Denarius (made of an majuscule X horizontally stroked), the ancient greek Drachme, Florens build from f and l (in various glyph shapes), Guaran� (Paraquay), old german Kreuzer and Mark signs, ancient latin Sesterz (horizontally stroked IIS for �two and a half [II+semi]�; as well as a definition for old officinal measurement signs like Drachme, Pound, flemish Pound, Gran, Obolus, scrupulus, Sextans and Once.  <br> <br>Another field is that of latin abbreviational letters like they have been widely in use for a long time, even in printing: letters with abbreviational supplements (bars and the like) for frequently occuring syllables, e.g. �pro�, �per�, �con�, prae�, �ter�, �tur� and so on. <br>A  field of signs needed rather recently, as Ingo Preuss has already mentioned, are all the telephones, Airplanes, house-, print-, document-, sports-, attention-, notification- and orientation signs massively used today even in composing combination with alphabetic expression. Yet, what is definitely unappropriate here is an encoding of all blossy blobs of the �Zapf Dingbats� font, a font which essentially lacks any semantic reason. Further. its hard to understand why encircled numerals occure in a serif and a sans-serif manner respectively. This is not even a matter of characters and glyphs, its just a matter of style. And there we're coming to �encoding policy�. <br> <br>Things like that mentioned above let me just ask: on what theoretic ground are those decissions made? Is there only a somehow accidently grown body �of �proposals� from outside or does the consortium back serious efforts in research? <br> <br>Another issue is the graphic representation of characters on the codepages. Unfortunately it is inconsistent in many cases it could be consistent. What is, for example, given as representation of coptic letters, is just a copying of one particular manuscript or other source, it does'nt really show the relation of that letters with the greek alphabet on an adequate level of graphic shaping. Another example: the abbreviational letter R which is cross-stroked by an oblique bar (meaning Reverse or Response) occurs, if I'm right, twice. But it's just the same sign. In one case the stroke got a serifed shape so that it looks like a R-x ligature�  Why this? <br>I suggest, to make a clear distinction between the GRAPH as the essential graphic representation of a semantic entity on the one hand - and the STYLE in which a given Graph can (can!) be drawn on the other hand. Therefore, what's actually relevant for a standard is the SEMANS-GRAPH-relation. <br> <br>I would like to learn wether Unicode is open even to improve not only the tables as such, but, perhaps important, the METHOD of knowing what actually a universal standard of writing would have to contain.                          *</p>"
