    html: "<p>At the beginning: I criticize neither the work nor the necessity of unicode. <br>In this call it concerns the exchange and suggestions. Mainly to signographic problems with unicode. <br> <br>For example: <br>In the Bulgarian Code Page are included all vowels with accents that are really necessary for the typesetting in Bulgarian language, and are not included in the Cyrillic Code Page. Different Glyphes and same unicode... <br> <br>0x0432\t#\tCYRILLIC SMALL LETTER VE <br>0x0436\t#\tCYRILLIC SMALL LETTER ZHE <br>0x043A\t#\tCYRILLIC SMALL LETTER KA <br>0x044E\t#\tCYRILLIC SMALL LETTER YU <br> <br>I very probably understood the differences between a character and glyphs.  But if I liked to make an extensive cyrillic, italic OT Font, I have problems with Russian and Serbian (0x043F CYRILLIC SMALL TYPE CHARACTER PE). This character has completely different forms with same unicode in italics. Why? <br> <br>Why codepage for Dingbats (Range: 2700�27BF) and not (like other symbols/ornaments) in PUA... <br>Why no symbol for mobile telephone in unicode? (But 0x260E for black telephone. Why no symbol for white telephone?) <br> <br>Why no own unicode for typographic glyphs such as SmallCaps, Titlings...? Why unicode in PUA? <br>Why no own unicode for latin-ligatures?</p>"
