    html: "<p>[this message by Andreas Stötzner was generously posted by Ingo Preuss because of technical problems with posting] <br> <br>Dear John, <br> <br>I always enjoy to learn things getting better. And I believe, besides some critical querries, that the completion of the standard is really on a good way.  <br> <br>It would actually be no problem (for me) to make one proposal per week, but, as a freelancer hunting for jobs to feed a family and spending the rest of time to collecting and signographic research it's a little bit hard to afford even further resources to a proposal procedure if it goes beyond some four, five characters. I don't know wether others do think so too. Well, but that' perhaps a personal problem rather than Unicode's. <br> <br>You have stated one aspect which in particular seems worth considering: that Unicode is a standard for text processing and not a catalogue of graphic shapes. Sure, this has to be put a stress on. Yet, what is text, and what is not? <br> <br>I do ask this for a couple of reasons. I guess, at least we being people of the western culture are still sometimes preoccupated with the concept of 'text' just consisting of 'script' and 'script' consisting of alphabetical characters. But this is obviously only a partition of what we have to deal with. � A music score or an electrical scheme - are they texts as well? So what is with electronical signage? What is with musical characters? What is with meteorological signs? What is with characters used on architectural plans or on topographical maps? Could'nt be there a reason for implementing these things too? <br> <br>Regarding pictographical and ideographical signs ( - I propose to speek about SIGNS rather than SYMBOLS since not every sign is a symbol as well) it is true that a line has to be drawn between the DO's and the DON'Ts. What I want to point here is, that such signs increasingly become a part of conventional (=alphabetical) texts in a lot of contexts (!). As I observe it there is a strong trend to use such signs as they offer some advantages like quicker perception as well as saving space. In composing encyclopaedias, for instance, it has been (and is still?) a good tradition to replace most frequently occuring words by an ideogramm. In my opinion, ideographical characters should be worked on seriously. And the don't deserve to form just a motley labeled �Miscellaneous� or �Letterlike�. <br> <br>What you say about graphic representation makes me wonder a bit. What means the notion \"only informational\"? It sounds like a misregard: ONLY INFORMATION. But, anyway, it <b>is information</b>.   And thus it <b>has to be</b> information  even in the graphical sense. Since bad graphics are often enough a reliable source for bad or even wrong information. In many cases the noise about missed or missunderstood characters seem to actually come from this problem.  <br> <br>I agree that the actual standard is - something abstract behind - yet it's not \"abstract characters\" but the \"abstract\" is the <b>sema</b> or semantics behind the character. There are no �abstract characters�. Abstract is what you think. What you see is always something concrete. And it is graphically feasible to give good presentations of every sign in an elementary 'graph manner' so that this can be read as a graphic model rather than a particularly intended execution. Anyway, the graphical too has its semantics. <br> <br>I would suggest to consider these more fundamental matters too. Does Unicode actively patronize theoretical research?</p>"
