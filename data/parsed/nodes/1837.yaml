    html: "<p>I agree with John's comments above. I'm particularly curious about what \"missing scripts\" there are? I mean, sure, it seems like they have old Nordic runes without having all the old Hungarian runes, but in terms of modern language usage, what's missing? <br> <br>As for the encoding policy, there are really three policies that govern Unicode: <br> <br>1) compatibility with pre-existing encoding standards <br> <br>2) encode characters, not glyphs (except when required by 1 above) <br> <br>3) use only one slot for a given character, even though it may have somewhat different presentation forms in different languages <br> <br>I'm curious about which of these principles people are objecting to, and on what grounds. <br> <br>I'll note that the existence of principles 2 and 3 strongly implies the need for a technology like OpenType to bridge the character/glyph divide, to handle things such as small caps, alternate forms, etc. <br> <br>Regards, <br> <br>T</p>"
