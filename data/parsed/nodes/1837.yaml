  html: '<p>The <b>Unicode Standard</b>, on which the consortium is labouring for about ten, twelve years, will obtain essential significance for the future of all handling of text and type matters throughout the world. Of course a matching of all the world�s signage cultures comes out to be of herculean extent so that this can hardly be feasible without any difficulties. Therefore a lot of issues are discussed vigorously among type designers, typographers and others about missing certain characters or even scripts. Further, a somewhat questionable encoding policy on the Unicode side is considered by many professionals. <br>  <br>In order to bring the matter of this discussion a little bit further the editors of SIGNA have proposed to feature relevant articles on the matter in the forthcoming issue (no.6, spring 2004). Experiences, suggestions as well as criticism in terms of the development of the standard, practical aspects or encoding policy may be presented here. The objective of that is to bundle opinions and efforts of the community and to promote dialogue between the consortium and the experts. <br>  <br>To make sure that a future standard does really take into account all relevant signage cultures and scripts (even the rather strange ones) it seems desirable to publish dedicated statements by those who have to make substantial suggestions.  <br>Please, feel encouraged to submit to SIGNA what you have to state. <br>  <br>Andreas Stötzner <br><b>SIGNA</b>, Signographic studies, editor <br> <br><i>Note:</i> <br>The requested articles are to be published in SIGNA No.6 in the first quarter of 2004. <br>Please submit your contribution <br>:: in paper form to: <br>Redaktion SIGNA <br>c/o. Andreas Stötzner <br>Edition Waechterpappel <br>PSF 436 <br>04663 Grimma <br>Germany <br> <br>:: or via web to: <br><a href="mailto:a.stoetzner@t-online.de"> mail to Andreas Stötzner</a> <br> <br>Please give attention to the following specifications:   <br>A size of about no more than six typoscript pages is recommended.  <br>Supply plain text files in no other format than ASCII, TXT or DOC.  <br>Complementary figures are welcome as TIFF, PICT, JPEG or EPS. <br> <br>A definite decission about an article actually going into print is made by the editorial board: <b>Dr. Uwe Andrich</b> (Grimma/Germany), <b>Ingo Preuss</b> (Heidelberg/Germany), <b>Andreas Stötzner</b> (Leipzig/Germany). However, the editor cannot accept any responsibilities for loss or damage of supplied materials. <br><b>SIGNA</b> is regularly published in german, none the less there is no problem with articles set in other languages than german. If nothing else has been agreed, the rights of the text remain on the author�s side. The author just grants a royalty-free publishing permission to the editor of SIGNA for one issue. <br>Authors are requested to deliver also brief curriculum vitae data as well as a notice on current professional position. <br>Authors will be provided with three copies without beeing charged.  <br>--- <br><b>Informations about SIGNA</b>: <br><a href="http://www.hoefgen.de/publ/edWaechterpappel.html" target="_top">Edition Waechterpappel</a> or <a href="http://www.typeforum.de/modules.php?op=modload&amp;name=News&amp;file=article&amp;sid=162" target="_top">typeFORUM.de</a></p>'
