    html: "<p>Dear Thomas, John et all, <br> <br>it is for me all about the following: <br>By the beginning of 2003 the coding of SmallCaps was regulated by the AdobeGlyphList (AGL) obviously. A unicode was for the base glyphs exactly one name and exactly scheduled in it. All earlier 'expert-fonts' are based on this allocation. Since the beginning of 2003 has given the Adobe Glyph List For New Fonts (AGLFN). It is defined into this that SmallCaps is coded completely in the PUA. No obligatory unicode. This already was before so but the designer has the 'total' freedom now. He can allocate the name and unicode both freely in PUA. <br> <br>Situation following now: A typographer puts a text with an extensive use of SmallCaps. The customer doesn't like the used document. The typographer changes it. The new document is coded (by ADLFN) completely differently than the old one. Text garbage arises ... <br> <br>Foundry A coded SmallCaps in PUA. Foundry B coded SmallCaps differend from Foundry A. How can there be a passing consistency there if the obligatory creation is missing as you code? <br> <br>Why can't a creation be made for SmallCaps (extended Latin), PetitCaps (extended Latin) and Titlings (extended Latin) in unicode? Why the 'usual' ligatures obligatorily don't code. With stand-by. Sufficient space would be available in the unicode tables anyway. <br> <br>[preusss].</p>"
