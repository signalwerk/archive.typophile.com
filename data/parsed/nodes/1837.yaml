    html: <p>Regarding the smallcaps mess, this has nothing to do with Unicode, which does not encode smallcaps. This has to do with pre-Unicode software and fonts using 8-bit character sets to include smallcaps and Adobe's very unfortunate decision to map from those smallcap character sets to the Unicode &lt;i&gt;Private Use Area&gt;/I&gt;, i.e. to non-standard codepoints. With the result than any document produced using these codepoints for smallcaps will be garbage unless displayed in appropriate fonts that use Adobe's convention (a convention that even Adobe have realised was a bad idea). <br> <br>Smallcaps should not be encoded as such. A smallcap letter is a glyph variant (of either a lowercase or uppercase character, depending on context), and should be handled in markup, i.e. at a higher level above plain text. <br> <br>I'll respond to your other comments later.</p>
