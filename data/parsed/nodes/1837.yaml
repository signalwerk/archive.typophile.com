    html: "<p><i>Therefore a lot of issues are discussed vigorously among type designers, typographers and others about missing certain characters or even scripts. Further, a somewhat questionable encoding policy on the Unicode side is considered by many professionals.</i> <br> <br>Can you give some examples of 'missing characters'? I've been involved with Unicode for several years, and most often when people start talking about missing characters I find that they do not understand the character/glyph distinction. There is also a tendency to base opinions on what is missing on what is present, ignoring the fact that there are many characters in Unicode that are there only for backwards compatibility with pre-existing character sets, and do not meet the character criteria of the Unicode character/glyph model. Of course, this does not mean that there are not genuine missing characters, but there are procedures for proposing such characters and, if they meet the Unicode character criteria, they will be encoded. <br> <br>This is not to say that the Unicode Standard is perfect: there are things which I think the UTC got wrong, some of which can and has been changed, but much of which cannot be changed because of stability agreements with other standards bodies. <br> <br>I would be interested to know what, exactly, 'many professionals' find 'somewhat questionable' about the Unicode encoding policy.</p>"
