    html: |-
      <p><cite>I don’t know how the “A” got the side swash...</cite></p>
      <p>The font EULA allows you to do that in Illustrator. With “Type &gt; Create Outlines” you can get the splines of both an A and a K or an R and then take the swash you want from the K or the R and put it on the A.</p>
