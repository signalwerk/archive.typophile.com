    <p>Hello all,</p>
    <p>I need to know the font that is on the cover of this book - it is almost reminds me of a Pirate font, but it has a right side swash on the letter A and the serifs are different from most Pirate fonts - so I am not really sure if it’s one or not.</p>
    <p>Any guesses?</p>
    <p></p><div class="imageWrap"><img src="/files/grace_5103.jpg"></div><p></p>
    <p>Thanks in advance!</p>
    <p>karen</p>
