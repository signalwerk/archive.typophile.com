    html: |-
      <p>I doubt if any fonts were used to make that logo, and at least two styles were used: sans and serif. The fact that the two L's in BELL are so different supports the idea that these were drawn by hand. Maybe <a class="freelinking external" href="http://www.myfonts.com/fonts/letraset/boink/" rel="nofollow">Letraset Boink</a> could be used for BELL, with some tweaking. <a class="freelinking external" href="http://www.myfonts.com/fonts/pizzadude/el-vistereo/" rel="nofollow">El Vistereo</a> might be a starting point for SAVED, and <a class="freelinking external" href="http://www.myfonts.com/fonts/blhd/soylent-blu-bh/" rel="nofollow">Soylent Blu</a> for BY THe. You could probably find freebie fonts that would also have some of the same feel as these three lettering styles.</p>
      <p>- Mike Yanega</p>
