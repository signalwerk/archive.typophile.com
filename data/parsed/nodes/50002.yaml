    html: |-
      <p>I doubt if any fonts were used to make that logo, and at least two styles were used: sans and serif. The fact that the two L's in BELL are so different supports the idea that these were drawn by hand. Maybe <a href="http://www.myfonts.com/fonts/letraset/boink/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Letraset Boink</a> could be used for BELL, with some tweaking. <a href="http://www.myfonts.com/fonts/pizzadude/el-vistereo/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">El Vistereo</a> might be a starting point for SAVED, and <a href="http://www.myfonts.com/fonts/blhd/soylent-blu-bh/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Soylent Blu</a> for BY THe. You could probably find freebie fonts that would also have some of the same feel as these three lettering styles.</p>
      <p>- Mike Yanega</p>
