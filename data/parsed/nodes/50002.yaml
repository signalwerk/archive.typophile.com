  html: <p>I assume the logo is probably a custom type. Trying to find a font similar to the Saved By The Bell logo.  <img src="/sites/default/files/old-images/images_3470.jpeg"></p>
  html_clean: <p>I assume the logo is probably a custom type. Trying to find a font similar to the Saved By The Bell logo.  <img src="/sites/default/files/old-images/images_3470.jpeg"></p>
