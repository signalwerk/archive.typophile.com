    html: <p>Also <a href="http://www.fontshop.com/fonts/singles/bitstream/liorah_ot/" rel="nofollow">Liorah</a>. The drawback of these two is that they are more casual than Carpenter. If you want to maintain a more formal feeling, have a look at <a href="http://www.fontshop.com/fonts/downloads/monotype/voluta_script_pro_ot/" rel="nofollow">Voluta Script</a>.</p>
