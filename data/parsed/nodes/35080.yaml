      <p>How about Nick Curtis's <a href="http://www.myfonts.com/fonts/nicksfonts/bayern-handschrift-nf/" rel="nofollow">'Bayern Handschrift'</a>? It is a digitization of an old Art Nouveau era script typeface, so the time period is a good match for Carpenter.</p>
      <p>- Mike Yanega</p>
