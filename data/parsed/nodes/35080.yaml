    <p>I have designed a direct mail piece using Carpenter for a few headlines. The client wants a font that is more "readable" while I don't want to change the look and feel too much. Any ideas for a substitute for Carpenter?</p>
    <p>Thanks in advance,</p>
    <p>KC</p>
