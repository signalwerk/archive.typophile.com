    html: |-
      <p><cite>No one ever made an in-app interface for defining instances on the fly. Part of the reason MM never really gained traction.</cite></p>
      <p>This is not true. Older versions of Illustrator (version 10 was the last one IIRC) had a Multiple Master palette that allowed instant generation of instances. And Quark XPress used to have a plug-in (Font Creator?) that allowed the same. I often made MM versions of my typefaces early in the process in order to quickly test different weight or width settings in Illustrator.</p>
      <p>The main reason MM failed was not technology, but the fact that the majority of graphic designers are not trained/able to make decisions on a micro-typographic level. Having a seamless transition between weights and widths in a typeface faced most people with too much choice. Life is much easier when one can only choose between Regular, Medium and Bold.</p>
