    html: |-
      <p>The main reason MM failed was lack of support from type foundries.<br>
      I tried to make some MM fonts with Fontographer (this would be around 1995) but could never get the damn things to work properly.</p>
      <p>OpenType succeeded (despite Quark's slowness to support it, and Adobe burying it deep within application interfaces) because it entered the broad type production culture, thanks to Adobe and Microsoft making information about it available, primarily over the Internet, which was not a factor back in the early and mid 1990s.</p>
