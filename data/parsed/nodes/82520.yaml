    <p>Hi,</p>
    <p>I know that MM Fonts are not developed any further by Adobe, but I have the chance to work with some of these old Adobe MM fonts. Question is how to use these in a layout application like InDesign. </p>
    <p>How does one define the axis (of weight, optical size, etc.) in InDesign? Or do fonts have to be generated with FontLab before they can be used? I would like to know how this works for a normal job. And what about the compatibility? Do they still work in CS5?</p>
    <p>Would be great if you have some info on this!</p>
