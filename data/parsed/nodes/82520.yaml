      <p>Adobe says:</p>
      <p>Multiple Master Font Requirements</p>
      <p>Note: Applications that use the Adobe type engine (for example, Adobe Illustrator 7.0 and later, Adobe Photoshop 5.0 and later, and Adobe InDesign 1.x) don't require ATM (Adobe Type Manager) to display multiple master fonts.</p>
      <p>Mac OS</p>
      <p>-- System 6.0.5 or later</p>
      <p>Note: OS X version 10.2 and later support multiple master fonts, but OS X version 10.0-10.1.5 don't.</p>
      <p>This is what you get when installed on Mac 10.6.7<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/KeplerMM_6040.png"></div><p></p>
