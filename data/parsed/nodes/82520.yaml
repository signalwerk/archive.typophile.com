    html: |-
      <p><cite> &gt; I believe, "fonts have to be generated with FontLab before they can be used".</cite></p>
      <p>Or if you have an old machine running OS 9 and the Font Creator utility to create instances (also a functionality of ATM Deluxe). I can’t remember if you can do this running in Classic or if it has to be directly in OS 9 (or earlier).</p>
      <p>The resulting instances are just PS T1 fonts, so you should be able to install and use — at the very least in the Adobe/Fonts folder as James described.</p>
      <p>No one ever made an in-app interface for defining instances on the fly. Part of the reason MM never really gained traction.</p>
