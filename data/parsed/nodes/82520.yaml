      <p>Place the font files in the Fonts Folder located at: Library/Application Support/Adobe/Fonts</p>
      <p>Only the instances that are present in the Suitcase file will be available, and in some circumstances you may have to convert to outlines to get them to print, especially if you are making a pdf.</p>
