    html: <p>Thank you Paul for setting the record straight. I can add Lari Software's Lightning Draw GX, which had live sliders for all MM and TT/Variation fonts. No special palette to access either - - the sliders were always there. LightningDraw also supplied most of the new features of Illustrator between versions 7 and 10 - - it was an amazing program, way ahead of its time. Thank you James for the Illustrator tip - -  a rare example of backward compatibility on the Mac platform. Anyone who wants to know how, in the future, a font interface should work, just has to find an old Mac and get LightningDraw up and running.</p>
