    html: |-
      <p>The MM fonts usually came with the most basic instances already generated -- range of weights in small, text, mid-range, display sizes. These became the basis for the Pro Opticals series.</p>
      <p>Which families are you looking at and what sizes are you wanting? </p>
      <p>If you generate separate fonts out of a current font editor, you don’t have to export to PS T1 format. You could just as easily generate CFFOTF. Of course, there won’t be any features if you don’t write any. But at least you’ll have the more current font format.</p>
