    <p>Hi all.</p>
    <p>Creating a publication, a 're-do' of an old version that we did a year ago. The whole layout is set using the Univers family, but I'd like to freshen things up a bit in this new design with the use of a serif for captions, folios, running heads etc? Any ideas of a nice compliment to Univers...?</p>
    <p>Thanks in advance.<br>
    Rez</p>
