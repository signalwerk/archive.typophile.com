    html: <p>Our corporate design is built on a Univers-Minion Pro relationship. This, admittedly, is not ideal, because they have different x-heights. But if you're using your serif largely separately, or if you don't mind the occasional tweaking, I'd recommend it. For an example, take a peek at <a href="http://www.lampstandpress.com/egypt/pdf/watopics.pdf" rel="nofollow">this product page</a>, or at our <a href="http://www.lampstandpress.com/xindex.php" rel="nofollow">homepage</a> (with, obviously, lots of Arial scattered around).</p>
