  html: |-
    <p>I'm wondering which accented characters are commonly (or even occasionally) used in superscripted form. I know é and è are common in French abbreviations, and that ú is needed for ordinal numbers in Irish. Are there other accented forms for which it which might be desirable to include superscripted variants?</p>
    <p>André</p>
