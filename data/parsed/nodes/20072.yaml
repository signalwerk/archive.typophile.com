      <p>WWN uses Futura Extra Bold and Futura Extra Bold Condensed. Don't know about the others.</p>
      <p> - Lex</p>
      <p>P.S. WWN also uses various weights of Interstate (all stretched and squooshed) inside their magazine.</p>
