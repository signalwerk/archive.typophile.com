  html: |-
    <p>Hi<br>
    I'm looking for a typeface suitable for a jewish cultural institution in norway. Ir will be used for signage, letters, exhibitions, publications etc., must work in all sizes, and feature small caps, osf and the usual "expert" stuff. I want it to be modern, legible, and with a tiny "twist" to it. With "twist", i mean Oversized ink traps, signature letters, characteristic italics etc. I've only found one so far (after thinking for one hour), is etelka by storm type foundry <a href="http://www.stormtype.com/typefaces-fonts-shop/families-15-etelka" title="http://www.stormtype.com/typefaces-fonts-shop/families-15-etelka">http://www.stormtype.com/typefaces-fonts-shop/families-15-etelka</a></p>
    <p>ideas, anyone? should condensed versions be a criterium?</p>
    <p>thanks!</p>
    <p>alex</p>
