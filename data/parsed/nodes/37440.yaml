      <p>&gt;You’re making this very black and white.</p>
      <p>Well, that may be. Jews feel they are subject to regular unfair and negative portrayals, and so the clients, if they are Jewish, are likely to be sensitive, and maybe hyper-sensitive, to this. I may be wrong, but I suspect they want to look contemporary, but not 'cutting edge' or 'edgy'. I think the main thing is to find out what the client thinks is appropriate.</p>
