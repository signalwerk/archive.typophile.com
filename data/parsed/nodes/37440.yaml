      <p>&gt;an antisemitic outrage in Norway by choosing a typeface too bold.</p>
      <p>:) OK, I'm way more emotional about type than the public will ever be. But the challenge is of hitting the right emotional note, which the client and the museum visitors will intuitively feel. I am a fan of Soho, but I would think that something more humanist, like PMN Caecilia, would be more suitable, if you want to go in the direction of a slab. I still like Fedra better for this use, as it has both very modern and humanist qualities.  </p>
      <p>I will be interested to see what Alex comes up with and the feedback from the client.</p>
