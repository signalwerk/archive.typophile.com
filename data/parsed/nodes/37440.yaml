      <p>I guess trendy was not quite the right word. Both Etelka and many Emigre faces are rather self conscious and lack the strength and balance of great type IMHO. </p>
      <p>If you want a fresh, contemporary look, but with the strength and dignity appropriate to a museum, I think Fedra, both the sans and serif, would be very good. </p>
      <p>In the US <a class="freelinking external" href="http://www.nextbook.org/" rel="nofollow">Nextbook</a>, an organization developing and promoting Jewish books is using it very successfully in their magazine, and you can see a bit of it on their web site. ok</p>
