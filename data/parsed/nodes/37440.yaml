      <p>How important a companion Hebrew font is depends on whether they will actually use Hebrew to identify items, etc., in the exhibitions. </p>
      <p>If it the museum material is bilingual, then of course it is very important. It the Hebrew is only in displayed items, it is of secondary importance. </p>
      <p>Visually harmonizing Hebrew and roman is difficult, because Hebrew has thick horizontals and thin verticals, and roman is the other way around. </p>
      <p>The most usual way to harmonize is by putting them in mirrored columns, so to speak. </p>
      <p>One way is to use 'sans' style in both scripts, as these have less contrast. An interesting effort is the Hebrew font 'Erica Sans', (as in Eric Gill) which manages to 'Hebraicize' features of roman type in a good way. You can read about it <a class="freelinking external" href="http://www.oketz.com/iontef/" rel="nofollow">here</a>.</p>
      <p>You can find other links to Hebrew foundries <a class="freelinking external" href="http://typophile.com/node/34494?" rel="nofollow">here</a>.</p>
      <p>Typophiler David Hamuel has also done <a class="freelinking external" href="http://www.myfonts.com/search?search%5Btext%5D=david+hamuel" rel="nofollow">some beautiful Hebrew fonts</a>.</p>
