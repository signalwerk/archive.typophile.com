    html: <p>I think the symbol is just supposed to be an arrow, pointing forward. It goes with the 'Next' idea, and has the visual message that they are not a stale repetition of past ideas--which is unfortunately very common--but a fresh take on Jewish tradition and culture. The combination of the straight and italic in the symbol just adds visual interest, and matches with both the roman title and italic subtitle.</p>
