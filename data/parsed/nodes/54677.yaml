  html: |-
    <p>Has anyone heard of a term <em>other</em> than "dot" for the dot that occurs above the lower case i and j?</p>
    <p>I've been asked if there was an "official" term and I know of none. </p>
    <p>Perhaps we can invent a new "official" term. Then we can claim special knowledge of it.</p>
    <p>And to make this even more open-ended, I want to pass along the fact that here at Megacorporation, the registration mark is commonly referred to as an "R-ball". For some reason, however, a copyright symbol is not referred to as a "C-ball."</p>
    <p>Kristin</p>
