      <p>Can also be referred to as a Jot:</p>
      <p>Jot / N. Gr. </p>
      <p>The name of the letter, ex. i.<br>
      The smallest letter of the Greek alphabet.<br>
      An iota; a point; a tittle; the smallest particle.</p>
      <p>Although a Jot usually is referring to the whole character.</p>
