      <p>Kristin:</p>
      <p>We should stick with "dot" and leave "tittle" to purists and jargon mavens.</p>
      <p>I mean: why should we have to say or write "tittlelessi" when we can use "dotlessi"? For another thing, "tittlelessi" looks like the name of a Greek or Bulgarian cheese I could buy at Spiro's up there on University Avenue.</p>
      <p>I had not bothered to see who made that first post until I saw Ricardo refer to "Megacorporation." Then I knew it was you. Cheers from across the river.</p>
      <p>powers</p>
