    <p>Hey there, everyone!</p>
    <p><em>Catorze27</em> is a typeface inspired by northern Portuguese modernist lettering.</p>
    <p>Wrought iron is a widely used element on Portuguese architecture and, as such, the typeface started after collecting several photographs of modernist iron signage in several cities in the north of Portugal, specially in Espinho, Porto, Ponte de Lima and Viana do Castelo.</p>
    <p>As a result, <em>Catorze27 / Style 1</em> is the first of 3 styles, featuring 570+ glyphs, 7 weights, case-sensitive forms, 2 styles of numerals in 2 sizes, Greek (Monotonic), Cyrillic and supports most of the Latin Unicode ranges.</p>
    <p>Available from:<br><a href="http://new.myfonts.com/fonts/fabio-martins/catorze27-style1/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">MyFonts</a></p>
    <p>Other resources:<br><a href="http://Scannerlicker!&amp;#039;s Blog" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Scannerlicker!'s Blog</a><br><a href="http://www.facebook.com/thescannerlicker" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Facebook Page</a><br><a href="http://www.behance.net/gallery/Catorze27-Style-1a-Font-Family/2109974" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Behance Network</a><br><a href="http://origin.myfonts.com/s/aw/original/126/0/64782.pdf" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Specimen</a></p>
    <p>Thank you in advance for your replies.<br>
    Cheers!</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/cover_BIG_0.png" width="590" height="590" alt="">
