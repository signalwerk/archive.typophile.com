    html: <p>Yateendra -- <br> <br>The math characters in the Hoefler Text Roman Alt font are in normal keyboard positions. That's why Jonathan created the Alternate font, in order to provide easy access to these characters.  <br> <br>In the Mac Postscript font, the Omega is in the option-z position and the delta is in the option-j position. I don't know if this is true in the Windows version of the font. <br> <br>If this doesn't help, then contact the Hoefler Type Foundry at <a href="mailto:info@typography.com">info@typography.com</a>. <br> <br>-- Kent. <br></p>
