  html: <p>Please help! How does one insert Greek characters (Ohm sign, Delta, and so on) of the font (Hoeflet Toman Alt) into a PageMaker 6.5 Plus document? <br>   The Windows 2000 character map utility shows the code (U + 2126 for Ohm, U + 2206 for Delta and so on) but how do I insert these characters in the document? Presumably, these are Unicode numbers. <br>   Will be grateful for some help in the matter. <br>   Yateen &lt;<a href="mailto:yateen@teri.res.in">yateen@teri.res.in</a>&gt;</p>
