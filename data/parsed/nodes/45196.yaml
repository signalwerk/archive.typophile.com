      <p><cite>For instance, there was a time when it was “uncool” to concentrate in painting.</cite></p>
      <p>If you spend your life worrying about things like that you'll never achieve anything.</p>
      <p>Are you looking for undergrad or graduate education? If the former I'd say don't focus too early - my best advice is to attend a liberal arts school with a strong art/graphic department and keep your options open until you are sure you want to be a designer. Your undergraduate education is the last real chance you get to explore like that, why go to trade school? If graduate school I'd say work a few years first, try to get an internship or entry level job at a design studio (picking up whatever small freelance projects you can along the way) and see where that gets you before you go into debt on a graduate program that has dubious career benefits. </p>
      <p>Meanwhile from what I understand your best best are probably SVA or Pratt. I have not heard great things about the student quality at Parsons - it seems the students there are trying to get good grades and not pushing themselves creatively. A friend of mine taught there and he got frustrated with the lack of curiosity and initiative among the students.</p>
