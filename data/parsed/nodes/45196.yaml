      <p>The best school anywhere for graphic design, or any other subject, is in one's skull. And only there.</p>
      <p>Aside from the networking and resume advantages, schools offer no real advantages to folks who can generate the good ideas that are the core of our practice. Ultimately, craft and execution can be picked up anywhere, or delegated to those who can do them best. It's the ideas that matter and that ability can't really be taught. Practiced, yes. But frankly, some people are just good at coming up with ideas for visual communication and some aren't. A pricey school won't make you the former.</p>
      <p>Personally, I didn't go to a brand school so I am biased against dropping a ton of money on a label. Just as going to Harvard Business School doesn't make you a genius entrepreneur (see: Bush, George ), so too going to any well-known NYC design institution doesn't necessarily make you anything more than another pixel pusher with a heavy debt load. At the end of it -- do you have any ideas worth communicating? That's what I want to know. Everything else can be taught and picked up. [Have you been to the "graphic design" section of book stores these days?]  Including, yes, nazi-ish kerning. </p>
      <p>If I had gone to a name school, it would have been an easier path for me -- I'm a senior designer at a major publisher here in New York -- but then I wouldn't have worked my butt off on a crazy project that ultimately landed me this job. Not the most linear way to go about a career but then, life is more interesting than straight lines. It's the work and ideas that ultimately matter, not the pedigree. Frankly, when I'm interviewing, I don't care where you're from. Could care less. Have some interesting ideas? That's what I want to see. </p>
      <p>It is worth noting that many, many people don't have jobs in anything remotely related to what they went to college for. Myself included -- I have a degree in journalism (which is what I settled on after I stopped doing electrical engineering).  So, I would say don't break the bank on a piece of paper -- it's the stuff in your head that really counts in this world.</p>
