      <p>I just finished up my sophomore year at SVA for graphic design. Sophomores are required to take seven classes (Basic Typography, Basic Graphic Design, Computers in the Studio, Drawing, Visual Literacy, History of Graphic Design and one Humanitiy class each semester)</p>
      <p>The workload is huge, and sometimes feels unbearable, but I feel as though I got a LOT out of the classes I was required to take this year. SVA, like many other art schools, give you back what you put into it. Some students coast while others work their asses off.</p>
      <p>The teachers at SVA are all working in the field they teach, so they are up-to-date with everything going on in the design world and they are also great for making connections and networking.</p>
