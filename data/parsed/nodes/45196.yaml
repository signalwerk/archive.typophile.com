      <p>Well, I don't know what it would cost you as an international student to study in Canada, but  as a canadian I payed 3,500 per year, and the program I took is 3 years long.  It covers typography, design history, art history, drawing, life drawing, design illustration, layout, branding, colour theory &amp; perception, motion graphics, as well as tutorial classes for every piece of software we use.</p>
      <p>It's worth a shot, but some of the other people here have nailed it almost dead on.  Education helps you lay out a framework for personal study, but design education doesn't make you anywhere near ready for design.  I'm going to say 70+% of design is learned outside of a classroom, and while I don't advocate forgoing education altogether, I don't depend on education alone to prepare me.</p>
      <p>If it's your passion; if you truly live and breathe design, you can thrive in any environment.</p>
