      <p>There are many good schools in New York City for Graphic Arts - it depends on which field you want to apply yourself in. I would have expected your question to raise a rivalry between the schools - instead I am very surprised at the type of answers you are receiving.</p>
      <p>Firstly, college gives you a few more years to grow up and mature in. For some students, this is all they are looking for, as they are too young to enter the marketplace.</p>
      <p>For some, it's to acquire new skills or open their minds to new ideas. For some it means learning there is more to art than Madonna and Child. For others it means there is more to life than what transpired in their small home town. College/University can give you a chance to solve problems - to really think your thoughts through. So many think they can do that, surprise is on them. Well, that is -- if you are fortunate to have a true intellectual as a professor --  just takes one - so you don't have to worry about all the professors and student instructors that you may have to sit through. You can learn - yes, even in a fox hole -- you can learn.</p>
      <p>I don't know which schools you have looked into or which areas you may want to concentrate on. School of Visual Arts was always progressive (and from the readings above, I don't think that has changed, fortunately!). Pratt turns out excellent students, so does Cooper Union and the Fashion Institute. Also, not mentioned above are a few technical colleges around the city -- some of which specialize in the trades - such as printing. These too are graphic art schools, just maybe not what the above crowd is speaking of. </p>
      <p>If you are in High School right now -- try to speak to 1) your art teacher and 2) your guidance counselor. Narrow down what field you might want to select, your art teacher should be a great help for that as well as steer you towards the right place. Make appointments to meet the admission staff of each of the schools you are interested in. Get the school tours -- see for yourself where you'd feel comfortable.</p>
      <p>Graphic Design artists have come from all walks. Yes several went to RISD or SCAD or SVA, etc. some just had the opportunity of training with art directors (whose credentials could make your head spin) in bullpens throughout the publishing and advertising worlds.</p>
      <p>Good luck - it's your future, I hope you decide wisely.</p>
