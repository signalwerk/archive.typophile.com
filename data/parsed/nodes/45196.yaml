      <p>Business Week ran a story last year touting that the MFA is the new MBA. (another excuse for designer graduates to put off the hard work of making a living) </p>
      <p>I went to a seminar on the subject, sponsored by the magazine, and while several of the speakers were entertaining, it was still the standard "Business Speak" with a few design terms thrown in. The one almost everyone was enthralled with was "Innovation". Innovate here, Innovate there. Team Innovation, Facilitating Innovation. Fostering Innovation, Rewarding Innovation.</p>
      <p>It all reminded me of a advertising design director who commented on some test words that I sent him for a new font proposal for his latest campaign.</p>
      <p>"I like it", he said. "But I was hoping for something more optimistic."</p>
