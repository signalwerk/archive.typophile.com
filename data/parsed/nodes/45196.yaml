      <p>Since evilfans (the original poster) is asking about NYC, here is a possible course of action:<br>
      Get a 2-year undergraduate / liberal arts degree somewhere else, then move to NY and take all the continuing education design classes you can at SVA. Most of them are taught by the same instructors, follow similar curriculae, but cost a small fraction of actually being enrolled for a degree. I'm surprised more people don't do this, it seems like a great deal. You could work at the same time and go at your own pace (none of this 6-classes-at-a-time nonsense.)</p>
      <p>Having said that, I will sort of disagree with myself with the following: I think the above posters who are minimizing the value of a design degree are probably right in regard to designers who are going to work on their own from the beginning. But IMO, to get a job, you need a degree. To get a good job, you need a degree from a good school. There's just too much competition.</p>
      <p>I graduated from Pratt a few years ago and the students in my program were almost all employed in design jobs before school even ended. Plus, if you love design, you'll love design school. It's a great way to spend a few years. I'll be paying off my loans for years, but I have a job I love going to every day -- it's a fair trade.</p>
