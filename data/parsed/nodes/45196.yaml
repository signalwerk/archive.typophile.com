      <p>terminaldesign, I think you should send that one to <a href="http://adverbatims.blogspot.com/" title="http://adverbatims.blogspot.com/">http://adverbatims.blogspot.com/</a></p>
      <p>From the designers I've seen who get what you might call a "liberal arts design degree" (something like 2/3 liberal arts classes and 1/3 design), typically labeled as a BA, they don't exit with much of anything -- they need more time to develop their design skills &amp; thinking, and they've taken a bunch of 100 level courses in anything and everything. I think getting a BFA (usually 2/3 art/design classes and 1/3 liberal arts) is much more successful at preparing you to be a professional designer, just because there's so much that has to be crammed into four years. </p>
      <p>That said, I don't think everyone majoring in design is necessarily looking to work as a designer. It can be just another form of majoring in Spanish or International Studies -- something you're interested in when you're 20, and a stop along your path to getting a real estate license. I don't find anything wrong with this. Design is a great tool for self-discovery.</p>
      <p>I find it hard to believe designers will ever be business leaders, just because there's a certain type of person who's typically attracted to design, and they're not the Donald Trumps of the world. There's a certain type of person attracted to teaching, and a certain type attracted to the military, and they develop their own sort of culture, with rules and codes and self-imposed limitations. If design schools want to break free from this, they need to start requiring more business and marketing classes for their undergraduates.</p>
