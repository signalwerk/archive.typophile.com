      <p>JackieT,</p>
      <p>I come from a family of Guidance Counselors, Teachers, Principals and School Administrators. My first job out of college was that of a public school teacher. I think GCs do a wonderful job in the early middle school grades, and may be even of some help in guiding students to more traditional fields, but anyone who falls out of the standard mold, like having an interest in design, will receive very little help.</p>
      <p>But then modern secondary education, at least in America, was designed to prepare rural farm kids to work in factories. It is completely ill equipped  to offer any preparation to a student entering the modern global economy. American drop out rates and high school graduation rates point to its failure.</p>
      <p>James</p>
