      <p>I find it hard to believe designers will ever be business leaders, just because there's a certain type of person who's typically attracted to design, and they're not the Donald Trumps of the world. There's a certain type of person attracted to teaching, and a certain type attracted to the military, and they develop their own sort of culture, with rules and codes and self-imposed limitations. If design schools want to break free from this, they need to start requiring more business and marketing classes for their undergraduates.</p>
