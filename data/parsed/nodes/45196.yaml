      <p>I got a four-year degree from an art school. Not a terribly well-known one, but I think everyone I graduated with in design is working in the industry in some capacity. That said, a lot of them are buried in debt, and might be working on the same level as someone with a 2-year AA who spent $4000 for their whole education. Or they might be working alongside someone who got an MFA from an expensive east coast school and is $100,000 in debt, and is making the same amount as them.</p>
      <p>What I think an expensive art school gives you is contacts: think of it as the George W. Bush model of success. The importance of knowing the right people in design can't be overstated. With some design schools pushing 40K/yr. now, a lot of design schools are going to need to start coming up with real statistics about the ROI you'll get for buying one of their expensive degrees, though.</p>
