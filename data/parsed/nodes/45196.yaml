      <p>Hello,<br>
      I currently attend Cooper Union. I'm finishing up my sophomore year (3 days left!)<br>
      We don't have declared majors, and you can only take a certain amount of credits each year in a certain field. Freshman year is foundation, sophomore you can take .. 6 credits per semester in graphic design junior year you can take 9 per semester, and senior year is unlimited). I don't know much about other schools' graphic design programs, and have only had so much experience here with design because I'm in my sophomore year. That said, I have already encountered some really great professors.. and some not-so-great. That'll occur anywhere, though, of course. </p>
      <p>Professors I have had have been very supportive and excited to help me. I can't really comment on how commercially-geared the courses are. It really varies from professor to professor.</p>
      <p>There seems.. at least in my year.. to be not a high interest in design here. I've heard the school goes through phases. For instance, there was a time when it was "uncool" to concentrate in painting. That may be the case with design now; who knows. A lot of my classes have people for whom graphic design is not a passion; they simply signed up for the class to fulfill a curiosity about graphic design. This, to me, is both a positive and negative thing in terms of class critiques.. </p>
      <p>My best advice would be to look at the websites of whatever schools you're interested in. Most have online galleries of student work.. and some even have faculty work. </p>
      <p>Sorry this is such a poorly structured/written reply. My keyboard is messed up and I'm tired. Anyway, I'd be happy to answer any questions you may have! </p>
      <p>Johanna</p>
