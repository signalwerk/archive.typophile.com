      <p>I'd say SVA is the most commercial, in the sense that it is very career-oriented as opposed to theoretical (which makes sense, since it started as a trade school after WW2), and most of the instructors there are not professional teachers, they're professional designers who happen to teach a class or two a week (which James seems to think is a bad thing, but I couldn't disagree more). Every school in NYC has working artists teaching, though, it's just a matter of proportion and finding the faculty that you fit with best. In any other city you'd have to worry more about professional teachers with no real experience.</p>
      <p>There's such a volume of talented artists there who enjoy teaching that you can find a good mentor at any school. And ultimately that's what it boils down to, and what you can never learn with practice or books or the web -- making connections, with both faculty and students. The best thing that can happen to you is that you have an instructor you get along with, you mentor with them and get help lining up those first few critical jobs.</p>
      <p>You can also easily spend a ton of money and get nothing out of it -- the standards are pretty low at most schools, and you can easily go through four years and not improve or put any effort in. Successfully navigating through an art school is much, much more difficult than getting through a typical bachelor's program. You very much get out of it what you put into it.</p>
