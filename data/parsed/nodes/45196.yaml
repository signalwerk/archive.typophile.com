      <p>I just finished at Pratt. I almost certainly spent more money than was probably necessary, but the experience, IMHO, was totally worth it. It is true that you can gain a wealth of skill "on the job", as has been suggested. I've been working as a interactive design swiss army knife for the last 10 years, and I was way ahead of the curve compared to many of the students. But for all that on the job learning, there was still something I was lacking, and that's why I went back to school after so many years.</p>
      <p>Aside from the contacts, which may ultimately be as valuable as my school debt, design education is about the problem solving process – about how to think about and create design. Anyone can operate a microscope, but it takes some learning to master microbiology. Poor analogy, maybe. But being able to stop traffic with Illustrator skill does not make you a good designer. Learning the process, learning how to address a design problem and apply my acquired skill (and practicing this process over and over) was very helpful to me. I also got work on the kind of projects that are rare in my day job, which was nice.</p>
      <p>If I could offer 2 suggestions, they would be:</p>
      <p>(1) Check out FIT. I've heard lots of good things about it.</p>
      <p>(2) You will get out of it what you put into it. You have to believe that it's worth it and work to get your money's worth from the experience.</p>
