      <p>In two days, I will be graduating from SVA. I took a handful of humanities classes at FIT every summer (once enrolled you're allowed a total of 9 credits from another school) and every teacher I met at FIT was "retired" from SVA, in that they were no longer practicing professionals, but still in love with teaching, so they went to teach at FIT. I went to SVA directly from high school, thinking that deciding on design early on was a good thing. In retrospect, I think even a year at a liberal arts school may have paid off for me. I just didn't want to dilly dally for two years until I had to declare a major, I wanted to go in head first. That is not to say that the humanities department is lacking, we have amazing teachers which for some reason are usually ignored, because people choose the easy classes so they can focus on their studio classes, I chose the hard ones because I didn't want to waste my tuition money on a journal class (a mixture of writing in your dairy and show and tell).</p>
      <p>Fly over here, tour the schools, see which facilities you can picture yourself working in for hours and days on end. I know SVA's computer labs were ridiculously packed this year, forcing me to work at home where I'm more likely to randomly get up and bake some zucchini bread instead of focusing. </p>
      <p>It's too late for me to regret the amount of money spent on tuition, and I won't know if it was REALLY worth it for awhile. All I do know is that every single freelance job I've had in the last three years I have in some way met the person at or through SVA.</p>
      <p>Feel free to ask me anything!</p>
