      <p>I entered college an art major and graduated with a degree in art. However, the best classes I took were not necessarily art classes. I studied Philosophy, Astronomy, Dance, Psych, Dostoevsky, Evolution, the Atom Bomb (this was still the cold war) and the Old Testament among other subjects. I actually regret that I was so focused on art, art history and film - I could have broadened myself even further while I had the chance. My school had an amazing music department and I'm very sorry I didn't take advantage beyond going to a few gamelan concerts. There is plenty of time to focus after you graduate. Any future employer who would penalize you for not having a graphics degree from Cooper Union or SVA is probably not someone you want to work for anyway. One of best art directors I ever worked for had a literature degree from Skidmore.</p>
      <p>For fashion, don't forget FIT.</p>
