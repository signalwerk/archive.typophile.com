      <p>Just to get it straight, Cooper Union is free for New York residents only. </p>
      <p>As an design educator at Buffalo State College, in Buffalo, NY, students will get out of their education what they put into it. My best students (and I would hold them up to any Parsons, Cooper Union, etc. student) are those who are have a driving curiosity to learn and experience design from many different perspectives. They are the students that go the extra mile to research techniques, paper, methods of execution, etc. that cannot be touched upon in the classroom. Why, because as educators we are trying to balance the need for technical instruction and design asthetics. In addition, you have a classroom of adult learners who are on all different levels and that takes lots of individual attention. </p>
      <p>My advice is take tours of schools that interest you and talk to the students not administrators or even teachers. Have the department put you in touch with an alumni that can relate to you their after college experience. You will find out much more about an institution than any brochure or website can provide.</p>
