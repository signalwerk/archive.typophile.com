      <p>My dislike for educations that lean toward broadness is that I know a hell of a lot of people who went to school, learned a lot of little bits about this and that, and forgot it all, myself included. We have our entire lives to do that—at least those of us who actually try to learn things and don’t just get off work and watch TV. But for many people, those undergraduate years are the only time in their lives that they’ll have to put aside the distractions and really focus on something. That’s a great opportunity, and it would be a shame to miss it just for four years of dabbling about in a liberal arts program.</p>
      <p>My design program was not a liberal arts program; it was a very focused design program. And it was great to be in a school where almost everyone wanted to be there, and really cared about the subject at hand. The first time I went to school I was focusing on a much broader program (liberal arts with a focus on anthropology), and about half the people in every class were only taking it because it was a required elective for whatever they were doing. That meant we got a lot of dumbed down curriculum, tedious discussions, and is why I dropped out to focus on work until my mid-twenties. </p>
      <p>A broad education may be a great thing for people who just don’t know where they want to go. But for someone like me, it’s like having teeth pulled. When I was in high school I never even knew what a design school was. If my asshole teachers and advisors had stopped their demagoguery about broad-mindedness for the ten minutes it would have taken to discuss art schools with the kid who was nearly failing classes for sitting around drawing custom letters all day I’d be ten years into a design career, instead of having to figure it all out myself at twenty nine.</p>
