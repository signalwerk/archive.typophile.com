      <p>I'm not gonna hire anyone. I'm a one person operation and will always be a one person shop.</p>
      <p>I just think one should think long and hard about plucking down their hard earned cash for an "education" in graphic design. That's all. </p>
      <p>And if you can come up with a killer portfolio without all the nonsense you go through in "higher education" good for you. There are certainly many more resources that the average person can take advantage of now, then when I was learning this stuff. And I learned this stuff on the job, cranking out work in a type shop with a studio manager screaming at me and all the other bull pen jockeys all day long. I came into the business knowing a lot about print production, showed an ok portfolio, lied to get the job, put my head down, made myself useful and learned all I could. I sort of look at it as "lower education". That was after my university and graduate school days. But I got an education at school, not vocational training. And believe me I know the difference since I have my B. A and my M.Ed. in Vocational Education.</p>
