    <p>Hello,</p>
    <p>I posted this in the SoCal Type Fanatics section, but there wasn't much response there, so I'm reposting here.</p>
    <p>I’m looking for someone to (letterpress) print some business cards for me. I’d prefer a local company (Los Angeles, USA). It seems like <a href="http://www.aardvarkletterpress.com/" rel="nofollow">Aardvark Letterpress</a> is pretty well respected.</p>
    <p>Does anyone recommend a different company or have any comments or advice on where to go? It doesn't necessarily have to be local, but I would prefer if it were.</p>
    <p>Thanks!</p>
