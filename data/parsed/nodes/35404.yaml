    <p>I keep getting asked (by multiple sources) to create PDFs of Orange County Register (newspaper, OC southern California) articles. I’ve been using fonts that are close to what they use, but darn it, I’d like them to be exact if I can. Can anyone i.d. the fonts in this JPEG, or does anyone know offhand what fonts the OC Register uses? Thanks.</p>
    <p>(BTW - I _think_ that the main serif font is Century Schoolbook... it’s close, but not a perfect match)</p>
    <p></p><div class="imageWrap"><img src="/files/OCReg_5581.jpg"></div><p></p>
