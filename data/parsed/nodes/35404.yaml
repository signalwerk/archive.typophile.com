    html: |-
      <p>OK... finally found a way to access/download and open a PDF article from their website. Looks like the fonts are:</p>
      <p>Interstate (thanks, bshaykin)</p>
      <p>Benton Modern One</p>
      <p>From MyFonts.com:</p>
      <p>Morris Fuller Benton of USA<br>
      Born: Milwaukee, Wisconsin, 1872<br>
      Died: Morristown, New Jersey, 1948</p>
      <p>Leading American type designer who designed typefaces and managed the typographic design program at ATF from 1892 until 1937; son of Linn Boyd Benton.</p>
      <p>...Benton designed (is credited for) Century Expanded and Century Schoolbook, which must be why it’s (CS) so close. I couldn’t find a listing for Benton Modern, does anyone know who carries it, or is it a custom job for the paper/publisher?</p>
