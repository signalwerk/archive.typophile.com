      <p>You have all offered very helpful suggestions as usual! Thanks.</p>
      <p>Dan and Timd, you are correct of course. I approached the outline the wrong way and ended up distorting the negative space inside the characters. You will find this corrected. My intent was not to outline the characters, as much as to fill the characters with a double line. Or rather to draw them with a double line in the first place. I could not figure out how to do this in Illustrator, short of carefully editing each character by hand, so I faked it with an outline. I believe this new version conveys the idea a little better. </p>
      <p>It is meant to portray the look of the most popular type of fiber optic cable used. It is a duplex style (2 cables seamed together) in bright orange. If you were to have an install by this company you would most likely see this cable everywhere. And having seen the logo you will hopefully remember forever who did it.</p>
      <p><a href="https://web.archive.org/web/20060522215654/http://typophile.com/files/new-logo-expanded-fiberpack.gif">Here’s the new version</a></p>
