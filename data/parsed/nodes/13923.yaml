    html: |-
      <p>When making an outline of a typeface it is usually better to have the outline on the outside of the original face because Illustrator and Freehand apply stroke to either side of the path in equal amounts (a simple way of doing this, in this case, is to have two layers one with double the amount of stroke required and the second above the first with a fill of the background colour). The audio device at the side looks a bit sonar, try rotating it to parallel with the type.<br>
      Tim</p>
