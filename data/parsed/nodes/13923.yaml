      <p>No vote on #2. It’s awkward looking. I guess if you refine the “loop” a little more it could be a candidate.</p>
      <p>#3 is still the strongest, but those teeny, tiny marks inside the O will disappear at a smaller size, like on a business card.</p>
      <p>#1 is too difficult to read and there are awkward joins between the two words. Something I want to point out-when “fusing” two shapes, letterforms or otherwise, you need to be aware of not only the shape you are creating, but the shape of the negative area as well. On #1, there is a weird negative space between the k and the upside-down A. Something to remember for future designs.</p>
