    <p>Ok, I am taking the previous advice and concentrating solely on the logo now. I have spoken with the client in much detail regarding the nature of fiberoptics and done my own research as well. Please give me your thoughts on the new logo I am working on.</p>
    <p>To refresh memories:<br>
    • Business is a network design firm specializing in fiberoptic and UTP transmission of packetized digital audio.<br>
    • They would like to emphasize the fiberoptic approach since it is higher bandwidth, hence more reliable for realtime applications.<br>
    • Their clients are looking for the complete design and installation of a digital audio network in the following locations: broadcast studios, recording studios, performance venues, stadiums, clubs, campuses.<br>
    • Largest competitor is <a href="https://web.archive.org/web/20060522215654/http://www.afassoc.com/">Ascent Media</a>, although Ascent is working a much larger demographic.<br>
    • Their primary needs for identity are website, storefront, letterhead, invoice, and business cards.</p>
    <p>Thanks!</p>
