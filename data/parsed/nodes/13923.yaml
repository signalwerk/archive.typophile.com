      <p>As regards to showing multiple designs, I tend to agree with the late Mr. Rand’s perspective. Show only one, and show the best. Don’t give the client an opportunity to choose an inferior design, because most of the time they will.</p>
      <p>I agree with adnix. From a compositional perspective, #3 is by far the strongest — but the “O“‘s internals might get lost a smaller sizes. My eye tells me that there is perhaps too much going on around the “O,” which distracts from the typography.</p>
