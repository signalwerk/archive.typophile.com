    html: <p>You are getting the contrast and prioritizing aspect of your logo. Avoid gradients as in number 2 they cause production problems and it will come back to bite you. Number 1 looks like a mistake, Audio doesn’t read. As I noted before number 3 will fall apart or fill-in in small sizes. I also suggest trying to make anything you design work in black and white (tints of black are fine). The reason is any fatal design flaws can be hidden by color. Also test your designs at the smallest size you know they will be used. One last note do not let your client take a piece from one design and a piece from another design, that is how the Camel was made.</p>
