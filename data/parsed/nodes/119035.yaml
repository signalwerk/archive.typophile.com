    <p>Hi guys, it´s my first post, so if i lack the vocabulary sorry in advance. Im having trouble with a specific font letter, i get two different types of I´s(seen in image) i´ve tried to edit the font but it all seemed normal to me. It´s strange, generally the F should not get in the space of the upper part of the I and sometimes it does.Can´t really understand why and i kinda need that I loose. Any thoughts?</p>
