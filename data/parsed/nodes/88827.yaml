  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/robothon2012-typophile_5005.png"></div><p></p>
    <p>Hey! Join us 8-9 March in The Hague for the 2012 edition of the Robothon Conference on Type Design and Technology. This year we’re proud to announce an international range of speakers, the new UFO 3 format, amazing new tools and ideas. Robothon is a great opportunity to hang out with your colleagues from around Europe, meet the TypeMedia crew, and see the Gerrit Noordzij Prize exhibition and seminar dedicated to Wim Crouwel.</p>
    <p>Confirmed speakers so far:<br>
    Tal Leming <em>TypeSupply</em><br>
    Frederik Berlaen <em>RoboFont</em><br>
    Erik van Blokland <em>LettError</em><br>
    Yanone <em>SpeedPunk</em><br>
    Miguel Sousa <em>Adobe Type Team</em><br>
    Frank Grießhammer <em>Adobe Type Team</em><br>
    Petr van Blokland <em>Buro Petr van Blokland + Claudia Mens</em><br>
    Ben Kiel <em>House Industries</em></p>
    <p>Robothon 2012 is hosted at the Royal Academy of Arts (KABK) in The Hague.<br>
    Prinsessegracht 4, 2514 AN The Hague</p>
    <p>More info and tickets:<br>
    <a class="freelinking external" href="http://robofab.com/robothon2012/" rel="nofollow">http://robofab.com/robothon2012/</a></p>
