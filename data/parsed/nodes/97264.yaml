      <p>Can't find a font that matches the all thing (some more letters <a class="freelinking external" href="http://bravo-company.info/1021/190778/works/junpiter-futbol" rel="nofollow">here</a>)... Having also a look to the main logo "JUNPITER", I thought it could have been a (modified) <a class="freelinking external" href="http://fontfabric.com/category/free/" rel="nofollow">FontFabric font</a>  (Nexa, Intro, Code, Solomon...) but none of them, even <a class="freelinking external" href="http://www.myfonts.com/foundry/Fontfabric" rel="nofollow">their commercial releases</a>, match all specifications... <a class="freelinking external" href="http://www.myfonts.com/fonts/font-fabric/intro/" rel="nofollow">Intro</a> is probably the closest I have from them but /I and /K are off.<br>
      If you have Gill Sans or Gotham on this computer, you'd rather go with Gill Sans, I guess it'd need less work to customize.<br>
      I like also <a class="freelinking external" href="http://www.myfonts.com/fonts/mostardesign/sofia-pro/" rel="nofollow">Sofia</a> (/V and /K off) and <a class="freelinking external" href="http://www.myfonts.com/fonts/g-type/houschka-pro/" rel="nofollow">Houschka</a> (/V off) which are very close.<br>
      Your best chance would probably to ask directly to <a class="freelinking external" href="http://bravo-company.info/1023/about" rel="nofollow">Bravo Studio</a>. And if they do, drop some lines here.</p>
