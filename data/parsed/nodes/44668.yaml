      <p>andrew: this was not meant to be a serious thing. i'd call it a display font for extra big sizes with a weird concept... i actually don't know how to explain the the lenght of the counters, but i think the rules i followed while designing them are clear. one explanation could be 'super heavy weight with super big contrast' which is best visible in the 'o'. this system, of course, is not possible to use with all letters, but the aesthetic effect which this system produces is quite interesting, i think.<br>
      later i will design the 'normal' version with counters as long and as regular as they should be :)</p>
