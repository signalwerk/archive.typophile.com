    <p></p><div class="imageWrap"><img src="http://typophile.com/files/klimax_specimen-3-4_5726.png"></div><p></p>
    <p>hello. this is klimax. it is part of my diploma project with two other display fonts (<a class="freelinking external" href="http://www.typophile.com/node/44981" rel="nofollow">Monoxil Outliner</a> &amp; Kakao).<br>
    the idea was to draw two opposite climaxes - the heaviest and the lightest, but both sharing the identical metrics and kerning.<br>
    i would really appreciate some feedback and critique.</p>
    <p>thank you. ondrej</p>
  html_clean: |-
