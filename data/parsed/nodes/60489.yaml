    <div class="info">Submitted by <a href="/user/827" title="View user profile.">Ale Paul</a> : 31.Jul.2009 7.10am </div>
      <p>//////////////////////////////////////////////////////////////////////<br>
    SUDTIPOS. NEW RELEASE. AUGUST 09.<br>
    //////////////////////////////////////////////////////////////////////</p>
    <p>Cold winter in South America is a perfect time to produce a fresh new font.<br>
    We are happy to announce the release of <strong><a href="http://www.sudtipos.com/fonts/125">Diplomatic</a></strong> .</p>
    <p></p><div class="imageWrap"><img src="/files/typophilediplomatic_6327.jpg"></div><p></p>
    <p><strong><a href="http://www.sudtipos.com/fonts/125">Diplomatic</a></strong> is another script from the Koziupa and Paul duo. It relies on calligraphic simplicity to achieve artistic sophistication. Prominent ascenders and descenders work alongside calculated but casual strokes to produce an unmistakably elegant typesetting.</p>
    <p>//////////////////////////////////////////////////////////////////////<br>
    We also want to share with you that our font <strong><a href="http://www.sudtipos.com/fonts/123">Adios Script</a></strong> was nominated for the »Design Award of the Federal Republic of Germany«. The Design Award of the Federal Republic of Germany is the country‘s highest distinction in the field of design. Yes... a nomination is enough to be more happy!<br>
    //////////////////////////////////////////////////////////////////////</p>
    <p>Wherever you are, at the hot north hemisphere or at the chilly south, have a nice month!</p>
    <p><strong><a href="http://www.sudtipos.com">Sudtipos</a></strong></p>
