    <p>CakeType was founded in 2004 as an independent digital type foundry and is owned and operated by Pieter van Rosmalen. CakeType specializes in the design, production and distribution of original and high quality typefaces.</p>
    <p>CakeType also offers the creation of custom typefaces, as well as the improvement and adaptation of existing typefaces. We have produced exclusive typefaces for Audi (in collaboration with Paul van der Laan), KPN (Royal Dutch Telecom) and the road signage in South Korea, amongst others, as well as the lettering for the KWF Kankerbestrijding logo and Bookedoo logos.</p>
    <p><a href="http://www.caketype.com" title="http://www.caketype.com">http://www.caketype.com</a></p>
