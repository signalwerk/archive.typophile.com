    <p>Hi All,</p>
    <p>In the past year, I've developed a passion for typography and graphic design, and am looking forward to exploring this site more often. I'm still new to all this, but what I'm learning will compliment my work in the film industry. I'm in the process of starting up my own company and customized a seven letter logo from an existing font in Illustrator CS to create my own version, reshaping the letters the way I wanted them. In order to utilize the pre-built text effects in my motion graphic software, I need to somehow convert the custom logo text into a "font". </p>
    <p>Ted at Fontlab was kind enough to route me here. He explained that this is not a simple operation, and as it's a one time thing, it makes the most sense to try and hire a typographer. Would anyone be kind enough to shed light on what's involved, and what the costs might be?</p>
    <p>Thanks in advance,<br>
    ~Chris</p>
