      <p>Well, first, let's make sure nobody's talking at cross purposes.</p>
      <p>If I understand you correctly, you want to take the seven letter shapes that make your logo and drop them into an otherwise empty font, so that the text effects can work with it. I think anybody with font software can do that without much trouble.</p>
      <p>I think Ted might have been thinking that you wanted to expand your custom logo into a complete typeface of the same style with a full character set.</p>
