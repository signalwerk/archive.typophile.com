  html: |-
    <p>happy New Year, typophiles!<br>
    I am glad to present a new <a class="freelinking external" href="http://type.org.ua/osnova" rel="nofollow">Osnova family</a>, sans serif workhorse.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/osnova06_4841.png"></div><p></p>
    <p>Osnova supports slavic Cyrillic (belarusian, bulgarian, macedonian, russian, serbian and ukrainian), Latin for western, baltic, central and eastern european languages, and also monotonic Greek codepages.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/osnova02_5612.png"></div><p></p>
    <p>the font has six weights from thin to heavy with small caps, old style and tabular figures, some ligatures, alternatives and letter variations for three alphabets. italics preserves roman glyph shapes. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/osnova03_4098.png"></div><p></p>
    <p>some of features are separated for using eg. in office software.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/osnova04_4568.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/osnova05_4086.png"></div><p></p>
    <p>Osnova will be suited for both display and text use, for corporate identity and signage as well as for publishing and editorial design, and even for navigation design.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/osnova07_6067.png"></div><p></p>
    <p>Osnova was presented for first time on <a class="freelinking external" href="http://rutenia.org.ua" rel="nofollow">Rutenia 2010 </a> type-festival in Kyiv. please look to <a class="freelinking external" href="http://3z.com.ua/portfolio/identity/2131/" rel="nofollow">example of usage</a> by 3z studio.</p>
    <p>the typeface is named after the first ukrainian cultural magazine <em>Osnova</em> (1861–1862).</p>
    <p>Osnova@myfonts: <a class="freelinking external" href="http://new.myfonts.com/search/osnova/fonts/" rel="nofollow">http://new.myfonts.com/search/osnova/fonts/</a></p>
