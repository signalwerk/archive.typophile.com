      <p>I'm interested by the greater length of descenders than ascenders.<br>
      What is your thinking behind this, in all three scripts?</p>
      <p>Also, I find the ear of the Latin "g" to be idiosyncratic (nothing wrong with that!) -- what would you consider to be correspondingly idiosyncratic glyphs in the other two scripts?</p>
