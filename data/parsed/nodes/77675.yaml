    <p>happy New Year, typophiles!<br>
    I am glad to present a new <a href="http://type.org.ua/osnova" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Osnova family</a>, sans serif workhorse.</p>
    <p><img src="/sites/default/files/old-images/osnova06_4841.png"></p>
    <p>Osnova supports slavic Cyrillic (belarusian, bulgarian, macedonian, russian, serbian and ukrainian), Latin for western, baltic, central and eastern european languages, and also monotonic Greek codepages.</p>
    <p><img src="/sites/default/files/old-images/osnova02_5612.png"></p>
    <p>the font has six weights from thin to heavy with small caps, old style and tabular figures, some ligatures, alternatives and letter variations for three alphabets. italics preserves roman glyph shapes. </p>
    <p><img src="/sites/default/files/old-images/osnova03_4098.png"></p>
    <p>some of features are separated for using eg. in office software.</p>
    <p><img src="/sites/default/files/old-images/osnova04_4568.png"><br><img src="/sites/default/files/old-images/osnova05_4086.png"></p>
    <p>Osnova will be suited for both display and text use, for corporate identity and signage as well as for publishing and editorial design, and even for navigation design.</p>
    <p><img src="/sites/default/files/old-images/osnova07_6067.png"></p>
    <p>Osnova was presented for first time on <a href="http://rutenia.org.ua" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Rutenia 2010 </a> type-festival in Kyiv. please look to <a href="http://3z.com.ua/portfolio/identity/2131/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">example of usage</a> by 3z studio.</p>
    <p>the typeface is named after the first ukrainian cultural magazine <em>Osnova</em> (1861–1862).</p>
    <p><a href="mailto:Osnova@myfonts">Osnova@myfonts</a>: <a href="http://new.myfonts.com/search/osnova/fonts/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://new.myfonts.com/search/osnova/fonts/</a></p>
