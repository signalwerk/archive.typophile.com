      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Eff_5441.png"></div><br>
      The top right serif here (Goudy Old Style) is quite interesting.<br>
      The stroke moves across the top stem steadily, then begins to rotate counter-clockwise as it approaches serif position.<br>
      The <em>coup de grace</em> occurs as the right side of the nib is lifted off the paper and the left corner is dragged straight down.<p></p>
