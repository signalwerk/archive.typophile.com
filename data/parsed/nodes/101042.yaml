      <p>This is only useful for understanding the mistakes of the past. Not even the most devout disciples of Gerrit Noordzij follow chirography that closely. Most of all, I would be very sad to see you apply these approaches to the highly promising area of parametric fonts*; you'd be killing your relevance to the future of type design. Sorry for the harsh reality-check.</p>
