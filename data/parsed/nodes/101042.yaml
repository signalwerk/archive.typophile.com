    html: |-
      <p>Thanks for your responses, Do you think the asymmetrical serif is a result of stylising the broad nip brush stroke? A friend showed me these passages from The Stroke:</p>
      <blockquote><p>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Translation-Expansion-Running-Interrupted_4829.jpg"></div><br>
      The difference between the returning construction of 6.5 and the interrupted construction of 6.6 is not visible in the shape of the letter.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/6_5707.5.jpg"></div>6.5<br>
      <div class="imageWrap"><img src="http://typophile.com/files/6_4324.7.jpg"></div>6.6<br>
      When the interrupted construction is adopted the letter can acquire feet accentuating the ends of the strokes but the feet are details from which no hasty conclusions can be drawn (figure 6.6). This is the prototype of textura. If this letter were to be made narrower, the difference between the curves and the feet would become too small (figure 6.7).<br>
      <div class="imageWrap"><img src="http://typophile.com/files/6_5658.7.jpg"></div>6.7<br>
      The letter is no longer recognizable as an m. This can be remedied with a backstroke in the feet (figure 6.8). This is the endpoint of the blackening of the textura…<br>
      <div class="imageWrap"><img src="http://typophile.com/files/6_5236.8.jpg"></div>6.8<br>
      …The humanistic cursive is a cursive with a small counterpoint (figure 6.13)<br>
      <div class="imageWrap"><img src="http://typophile.com/files/6_6629.12,6.13.jpg"></div>6.12 &amp; 6.13<br>
      and the roman has all the characteristics of the textura but for the heavy stroke (figure 6.12). After 400 years we have become accustomed to roman type, but we might yet do well to marvel at the fact that the reversal in the textura foot has been so emphatically adopted, and for no other reason than the prestige of mediaeval western civilisation…
      <p></p></blockquote>
      <p>I can see how the asymmetrical serif might derive from the brush stroke then stylised to look like the construction John Hudson posted.</p>
