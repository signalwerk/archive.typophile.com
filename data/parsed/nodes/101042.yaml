      <p>In Fr Catich's <em>The origin of the serif</em> there is a nice illustration of how symetrical serifs are made with a broad brush. It involves two strokes, the first integrated with the vertical stem, the second overlaid: </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/catich_4835.jpg"></div><p></p>
      <p>This is pretty much the model for most typrographical serif constructions. Obviously asymetrical serifs, as illustrated by Dolly, seem to be a fairly recent design trend.</p>
