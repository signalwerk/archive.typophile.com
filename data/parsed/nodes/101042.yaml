    html: <p>Correction, with Dolly, I can imagine it being the same but with its core stroke curved to follow the asymmetric outlines — however I've no idea why it would be this way… whether it's the product of another method of construction I don't know about or style (as in stylised away from original brush constructed serifs) Reading Noordzij didn't clarify this either!</p>
