    html: |-
      <p>Indeed, but I think you're looking so deep that you're missing the obvious, that a broadnib pen can be held at any angle, people like to experiment, and so forth. Somebody tried something different, and found liked the results.</p>
      <p>Actually, the reason we have serifs is because the Romans used them, especially in stone -- serifs, especially symmetrical, make vertical and horizontal strokes look formal and regular, and the Romans liked their effect. Symmetrical serifs also look like the plinths and whatnot that join columns to buildings. Another factor is that they used to paint their letters onto stone as a guideline for sculptors to chisel, and switched from round to flat brushes early on. Or that it was the official Imperial style: formal, regular, somewhat elaborate, time-consuming, and expensive. So really, it's as much a matter of taste as of technology, much as it is in any style of writing.</p>
