  html: |-
    <p>I’m making my own envelopes by hand and was wondering if you could recommend any glue or have any tips?</p>
    <p>Elmers sort of glue always ripples, glue sticks are hard to control, and rubber cement doesn’t hold.</p>
    <p>Thanks</p>
