    html: <p>Fractions (the whole glyph) typically match the height of the lining numbers, so the component numbers would normally be a little less than x-height. The same numbers can be used for superiors and inferiors as well as in precomposed fractions. Stem width of the fraction numbers is a just little less than of the lowercase.</p>
