      <p>I think you should double check those EULAs. What you are proposing is a Commercial Use rather than a Business Use. Most EULAs I'm familiar with make this distinction, and require an additional license fee.</p>
      <p>On another note, I had double cataract surgery two years ago, and in the year or so prior, when my vision was the poorest, I did not find any difference in reading different type styles. They were all difficult.</p>
