    html: |-
      <p>As I understand it, it is OK to embed all Adobe fonts. Is this correct?</p>
      <p>Also, I checked the EULA for DS Type, which licenses Leitura, and it reads as follows:<br>
      -----<br>
      Embedding<br>
      The User may embed the font software in a secure electronic document for Previewing and Printing use only. The font software may NOT be used to create or distribute any electronic document in which the font software, or any part thereof, is embedded in a format that permits editing, alterations, enhancements, or modifications by the recipient of such document without obtaining a License Extension from DSTYPE Unipessoal LDA, authorizing you to do so.<br>
      -----</p>
      <p>I think PDF files fulfill this requirement since, short of hacking in, the fonts in PDF files can't be accessed by users. </p>
      <p>And thanks to JamesM for the extremely helpful article on legibility for older viewers.</p>
