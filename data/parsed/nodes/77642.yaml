    html: |-
      <p>The AIGA (an organization for designers) has an article you might find useful: </p>
      <p>"Typography and the Aging Eye: Typeface Legibility for Older Viewers with Vision Problems"<br>
      <a href="http://www.aiga.org/content.cfm/typography-and-the-aging-eye" title="http://www.aiga.org/content.cfm/typography-and-the-aging-eye">http://www.aiga.org/content.cfm/typography-and-the-aging-eye</a></p>
      <p>The article recommends using fonts that have:<br>
      •&nbsp;Consistent stroke widths<br>
      •&nbsp;Open counterforms<br>
      • Pronounced ascenders and descenders<br>
      • Wider horizontal proportions<br>
      •&nbsp;More distinct forms for each character (such as tails on the lowercase letters “t” and “j”)<br>
      • Extended horizontal strokes for certain letterforms (such as the arm of the lowercase letter “r” or the crossbar of the lowercase letter “t”)</p>
