      <p>Why not go with Georgia? If you intend the viewer to read this ebook on a monitor, Georgia is designed for that purpose. </p>
      <p>Of the four faces that come with the ibook app on my ipod touch, Georgia is the easiest to read.</p>
      <p>Or try Interstate. Highly legible, several weights.</p>
