    <p>I am setting an e-book using InDesign that will be distributed online. The target audience is people who are about to undergo eye surgery (retinal surgery, cataracts, etc.).</p>
    <p>I'm trying to decide which fonts might be have the best readability for this audience. I would appreciate any suggestions.</p>
    <p>I am considering Leitura News and Leitura Sans. Both come in four weights, and the the no. 2 weight of each is somewhere between a regular roman and a semibold, which strikes me as ideal, bigger than the usual body text, but not screamingly big.</p>
    <p>I also am considering Warnock Pro, but it is a bit delicate looking for my purposes.</p>
    <p>Any suggestions from you experts?</p>
