    html: |-
      <p>If your readers are blind, I recommend Braille. </p>
      <p>If they're about to undergo eye surgery its probably because they can't read anymore. I had a grandma with a cataract once. She had 10% vision left in that eye. We ended up having to put her down. But that's besides the point. I think you should get a typeface that capitalizes on a 10% reading and recognition level. A big slab serif, like Morgan, Jubilat,or Neutraface. Would work well at 172 pts. Because even when slabs are blurry, like being drunk or almost blind, the definitions of which letters they are still end up being legible. I really think Jubilat looks great in pdfs. Its like the unofficial defacto pdf typeface. If you must go sans, I would stick with blacks. Like they say once you go black... You'll never go ultra lol. Joke. But seriously, ultras tend to get condensed on the details, like on S especially. And bold may not be as impacting as you need, depending on the typeface. Akagi black is good. So is Alright black. Gotham, may be one of those blacks that just look too thin and open. However, using Gotham ultra retains details better than Akagi black I think. Design the ebook first, worry about EULAS latter.</p>
