      <p>BTW, This is the Steelers 75th anniversary year so that should give you a point in time to look at. In the 1930s Pittsburgh was known as the smokey city and steel capital of the world. Heavy wooden crates of steel products were common and all stenciled.<br>
      The United States Steel Corporation also had a stencil logo and the symbol of the Steelers is taken directly from the old Steel Industry symbol.</p>
      <p>ChrisL</p>
