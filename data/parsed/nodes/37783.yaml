      <p>It's a little bit funny actually. The wiki doesn't mention the fact that most stencil faces have taken on that look, from laziness. The patterns were originally made to improve hand painting of letters where such expertise was lacking, (Pittsburgh perhaps and the Military most certainly being good examples). After the islands were painted, the "so simple a private can do it" bridges were s'posed to be painted as well to make it look like there was an expert involved.  Oh well ;) </p>
      <p>Cheers!</p>
    html_clean: |-
