    html: <p>Eric Kindel at the University of Reading has done extensive research on what are the predecessors to stencil fonts, if you are interested in going that far back. I’m aware of 2 papers, the first in Typography Papers 5 and the second in Typography Papers 7; as well as at least one in Eye and another in Baseline. His line of work, I am sure, has good bibliography information. You can reach him through the Typography Department’s site. <a href="http://www.rdg.ac.uk/AcaDepts/lt/home.html" title="http://www.rdg.ac.uk/AcaDepts/lt/home.html">http://www.rdg.ac.uk/AcaDepts/lt/home.html</a></p>
