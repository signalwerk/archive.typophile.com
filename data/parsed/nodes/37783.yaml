      <p>"...teams such as the Pittsburgh Steelers"</p>
      <p>Besides the military uses mentioned, industrial uses of stencils were quite prominent and most likely predated military usage. I grew up in Pittsburgh in the 40s and 50s. I had summer jobs in mills and factories. Stencils were used to mark material for easy retrieval in a warehouse. They were an efficient way to mark numerous crates over and over on all sides so that they can be read from any vantage point. Since </p>
      <p>Pittsburgh was above all an industrial town, It makes sense that the Steelers would follow the lead of the steel industry and give their logo an industrial look.</p>
      <p>ChrisL</p>
