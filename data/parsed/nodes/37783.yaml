    html: <p>In <a href="http://www.rdg.ac.uk/typography/home.html?publications/typo_papers/index.html">Typography Papers 5</a> You'll find a rather thorough presentation of <em>stencil letters and associated artefacts of the past four centuries</em> by <a href="http://www.rdg.ac.uk/typography/home.html?staff/academic/eric_k.html">Eric Kindel</a>. He's also written on the subject in <a href="http://www.baselinemagazine.com/mainframe/Baseline/other_issues/issue_38/issue%2038_8page.html">Baseline 38</a>. I think he's the go-to guy when it comes to stencil lettering, but I assume James Moseley who's occasionally contributing to Typophile has something interesting to add as well.</p>
