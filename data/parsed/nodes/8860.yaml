  html: "<p>Hi, <br> <br>I'm researching a project on the typography of The Times newspaper, and have a couple of questions: <br> <br>� Which typeface/s were used before the development of Times (New) Roman? <br>� Were both the Monotype and Linotype versions of Times Roman used in production? <br>� Are Times Millennium and Times Classic commercially available? <br> <br>I appreciate that this is probably basic typographic history, but any answers or pointers are greatly appreciated. <br> <br>Best, <br>Richard.</p>"
