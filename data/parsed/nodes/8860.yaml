    html: <p>I think Times Roman and Times New Roman are essentially the same typeface, the first being made by Linotype and the second Monotype. This is the impression given by the Eye article.</p>
    html_clean: <p>I think Times Roman and Times New Roman are essentially the same typeface, the first being made by Linotype and the second Monotype. This is the impression given by the Eye article.</p>
