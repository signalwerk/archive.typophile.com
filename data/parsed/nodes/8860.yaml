    html: "<p>Morison wrote several good pieces in addition to the History Hrant mentioned, <i>Printing the Times since 1785</i>, '<i>The Times</i> New Roman: cutting and designing the new type' in <i>The Times house journal</i>, and <i>Memorandum on a Proposal to Revise the Typography of 'The Times'</i>. See also Tracy's article in <i>Letters of Credit</i> and John Dreyfus, 'The evolution of Times New Roman' in <i>Penrose annual</i> 66. <br> <br>In short, The Times had used a Caslon until the late 1800s, when it switched to a modern called simply \"Times Roman\". (Richard, you are of course correct in the current usage of the term, more on which see Charles Bigelow's <a href=\"http://www.truetype.demon.co.uk/articles/times.htm\">posting to comp.fonts</a>.) <br> <br>Both the Linotype and Monotype versions were used, Monotype for the text and Linotype for headlines. <br> <br>I don't think the newest members of the Times lineage are commercially available. Just Times (New) Roman, and Times Europa. See also John Berry's article 'Times Classic: a new type for the old <i>Times</i>' in <i>Contemporary newspaper design</i>, and the notes on <a href=\"http://briem.ismennt.is/2/2.2a/2.2.7.1.btim.htm\">Briem Times</a>, which is the \"new\" name for Times Millennium.</p>"
