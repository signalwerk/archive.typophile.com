    html: '<p>More alternatives to the over-present-but-great Gotham: <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/proxima-nova" rel="nofollow">Proxima Nova MS</a></strong> (top quality, great design and very affordable, both stand alone or family), <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/gibson" rel="nofollow">Gibson CT</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/salvo-sans" rel="nofollow">Salvo Sans FB</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/northernblock/loew" rel="nofollow">Loew TNB</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/niramekko/motiva-sans" rel="nofollow">Motiva Sans</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/gautier/maax" rel="nofollow">Maax</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/g-type/houschka-alt-pro" rel="nofollow">Houschka Alternate G-Type</a>, <a class="freelinking external" href="http://www.martinplusfonts.com/realistnormal/index.html" rel="nofollow">Realist M+</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/font-fabric/nexa" rel="nofollow">Nexa FFF</a>, <a class="freelinking external" href="http://www.impallari.com/projects/overview/matt-mcinerneys-raleway-family" rel="nofollow">Raleway</a></p>'
