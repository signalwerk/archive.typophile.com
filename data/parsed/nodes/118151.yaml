    <p>Hi everyone. I'm new here, and I chose this forum as a last resort, to identify a font.  Even though I can grasp some graphic work, I'm a programmer, not designer, so please bear with me. </p>
    <p>In short, I have to build a site, using fonts that are present on a flyer from the company. Of course, no one could provide any information, just an image (jpg) of 72dpi. I've tried a few offline/online tools to identify it, Google-d around quite some time, but the result wasn't the desired one. So I've edited the image, and cropped the only word which has that font. Here it is:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/font2_5632.jpg"></div><p></p>
    <p>The closest guess of mine would be those:</p>
    <p><a href="http://www.linotype.com/610732/NeueFrutigerProBlack-product.html" title="http://www.linotype.com/610732/NeueFrutigerProBlack-product.html">http://www.linotype.com/610732/NeueFrutigerProBlack-product.html</a></p>
    <p><a href="http://www.linotype.com/517462/DINNextPaneuropeanBold-ot-cff-w1g-font.html?showVariation=727058" title="http://www.linotype.com/517462/DINNextPaneuropeanBold-ot-cff-w1g-font.html?showVariation=727058">http://www.linotype.com/517462/DINNextPaneuropeanBold-ot-cff-w1g-font.ht...</a></p>
    <p><a href="http://www.fontshop.com/fonts/downloads/linotype/neue_frutiger_pro_black/" title="http://www.fontshop.com/fonts/downloads/linotype/neue_frutiger_pro_black/">http://www.fontshop.com/fonts/downloads/linotype/neue_frutiger_pro_black/</a></p>
    <p>but obviously they are not the right ones. </p>
    <p>Well, my question is simple. Could someone kindly decipher it, and name it, or, even better, could someone suggest me the closest alternative? I don't know yet if the client would pay for a font, but I'm almost sure not. Thanks in advance.</p>
    <p>Kind regards,<br>
    Andrew</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        Gotham Black        </div>
            </div>
    </div>
