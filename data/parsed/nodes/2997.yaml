    html: <p>I think you're right, Tiffany. I wonder what font it's pretending to be? The italic is very narrow. <br> <br>This reminds me of a Scott Kim (I think) puzzle in <i>Publish</i> magazine a few years back. He showed samples where the Adobe substitute fonts had replaced well-known typefaces. The idea was to identify what the missing font was.</p>
