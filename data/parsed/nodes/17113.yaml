      <p>&gt; All i did was to also uncheck the [Generate “kern” feature<br>
      &gt; if it is not defined] at Tools / Options / Generating<br>
      &gt; OpenType &amp; TrueType / Kerning! </p>
      <p>Yes, this is on by default because novice users will just specify their kerning in the Metrics Window and don't want to be bothered with manually editing stuff in the OpenType panel. But if you compile your features yourself using "Build kern feature" in the OpenType panel or "Apply and Save" in Kerning Assistance, then you'll most likely will want to turn this feature off. </p>
      <p>&gt; So many options… it is just like a cockpit there…</p>
      <p>A very good comparison. If you learn to be an airplane pilot, you'd better read the plane's manual and learn to work with the cockpit. If you want to develop OpenType fonts, it's just the same thing. Fonts are not trivial things and no matter how much we'd like to make their creation simple, it won't become simpler below a certain level. </p>
      <p>Many people long for the simplicity of Fontographer 3.5 but forget that that application was only good for creating Adobe Standard-encoded Type 1 fonts with 230 or so glyphs. For anything else, it was useless or at least very cumbersome. </p>
      <p>The goal of OpenType fonts is to reduce complexity of typographic design on the *user side*. But nothing gets lost in Nature: the overhead of complexity gets loaded off the final user towards the font developer. </p>
      <p>In short: read the manual, guys! :) We *did* improve it in FontLab Studio 5. </p>
      <p>A.</p>
