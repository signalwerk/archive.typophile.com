      <p>Tools&gt; Kerning Assistance&gt; Apply and Save<br>
      ...is necessary, even if there is no class kerning.<br>
      After you've done it, you will see that there is now a "kern" feature in the OpenType panel, with the values you've entered in the metrics window.</p>
      <p>(This is for FL4.6, but I'm assuming v.5 is the same.)</p>
