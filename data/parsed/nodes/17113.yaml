      <p>You don't need to use the "kern" feature to have kerning in a TrueType font. </p>
      <p>The "kern" feature is a more advanced and efficient way to set up kerning and is used only in OpenType fonts. It allows the use of something called "class kerning" which lets you group similar glyphs into classes for kerning purposes, which is especially fonts with large multi-lingual character sets which would have unreasonably large kerning tables otherwise.</p>
      <p>If you remove the "kern" feature (or disable the inclusion of OT features when you generate the font), you should get a standard kern table instead when you generate the font.</p>
    html_clean: |-
