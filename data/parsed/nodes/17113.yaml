    html: |-
      <p>Henry, what kind of font are you generating? I have seen lack-of-kerning in fonts with a standard kern table generated as OTF, even with "generate kern feature" enabled.</p>
      <p>In these cases, I open the OpenType panel and in the file pulldown select "Generate kern feature". Then I compile the feature, and try to generate the font again.</p>
      <p>Another case of lack-of-kerning seems to have been due to over-complexity in the glyphs themselves: too many nodes.</p>
      <p>If neither of these is the issue, maybe you can send your file and I'll troubleshoot it for you. chester[at]vllg.com</p>
