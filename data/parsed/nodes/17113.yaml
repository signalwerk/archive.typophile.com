      <p>tyfont, in my experience, there are always little hiccups in typeface development. It's not like Lego, with a binary relationship betwen parts, but is much more organic, temperamental and difficult to wrangle. I have spent some time wrestling with font files - mine and other people's - trying to figure out why one seemingly-simple thing won't work, and answers are sometimes elusive. I'm sure that many people here can tell horror stories. And the larger your type families get, the harder it is to get everything working consistently.</p>
      <p>If you think of FontLab or TypeTool as being hammers, you'll have a better appreciation for them. You need a hammer to hang a painting; the hammer being the tool you use to force the nail into the wall. But depending upon who is holding the hammer, how firmly they're holding the nail, where in the wall they're banging the nail... Well, the hammer becomes simply a component in the huge operation. You might bend 100 nails and blame the hammer, when in fact the problem is that the wall is made of concrete. If you want that nail to stick in the wall, you'll need to drill a hole first.</p>
      <p>So, while my suggestion may be a workaround, it also happens to have proved successful for me in the past, and I was sharing my knowledge. Hopefully someone who knows what s/he is talking about will materialise and fix your problem for you. Have a nice weekend.</p>
