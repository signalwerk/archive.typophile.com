    html: |-
      <p>Hello there everyone... this is also my first post here, and it is all about ttf font with kerning pairs that don't show up in Photoshop CS2! The excact same problem that Heners had.</p>
      <p>Let's start from scratch!</p>
      <p>- Win XP SP2<br>
      - FontLab v.5 (Demo),<br>
      - Type Tool 2 (Demo),<br>
      - ttf files tested in Photoshop CS2 / Flash 8 when installed.</p>
      <p>I know that the demo versions of Fontlab and Type Tool have limitations as it concerns the number of glyphs/metrics exported/saved in a vfb file ect.</p>
      <p>I have also read the manual but didn't really get any help...</p>
      <p>Let's start all together like a tutorial... (and that's what i did)</p>
      <p><strong>Step 1:</strong></p>
      <p>I created a new font (unicode - MS Windows 1252Western) from scratch at <strong>Fontlab 5 (Demo)</strong>, and only draw with the rectangular tool 3 letters D, E and F with only one kerning pair  E F +1500 (yes so large number in order to easily see that the kerning will be embended). I can see the pair in the table at the right side of kerning window and i then choose "Generate kern feature"...</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/mypreviewmetrics3fv.gif"></div><p></p>
      <p>...so as to be saved in the opentype panel too with the code <strong>feature kern {} </strong>.</p>
      <p>I then saved the vfb file... and chose to Generate font (ttf) with the default values in the options. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/fontlabgenerateoptions6je.gif"></div><p></p>
      <p>Before i install it, i opened the generated ttf in Fontlab 5 again just to be sure that the 1 pair i created was still there... and yes i could see it in the kerning window. </p>
      <p>So i installed it in the system... but the kerning pair was not shown in Photoshop CS2 (Metrics was the selection for kerning in the PS type tool)   :(</p>
      <p><strong>Step 2:</strong></p>
      <p>I created a new font (unicode - MS Windows 1252Western) from scratch at <strong>Type Tool 2 (Demo)</strong>, and again draw with the rectangular tool 3 letters D, E and F with only one kerning pair  E F +1500 (for the same reason as Step 1). I can see the pair in the status bar of the Metrics window as there are no tables in TypeTool.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/typetoolmetrics8mc.gif"></div><p></p>
      <p>...and then chose Generate ttf with the default values at the options</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/typetoolgenerateoptions9mu.gif"></div><p></p>
      <p>... and when i installed the font on the system... Photoshop could write with the right value (+1500) of the kerning pair i created!!! :)  Hoorey! for the cheaper Type Tool!</p>
      <p><strong>Step 3:</strong></p>
      <p>I took the generated ttf file from Step 2 (that Type Tool 2 had created) and opened it in FontLab... i could see the kerning pair there too, and i decided to generate a ttf from that file again (with different file/font/family name) just to see the results! Once again Fontlab failed in generating a ttf that Photoshop CS2 could write with the kerning pair included in the font. :o(</p>
      <p><strong>Step 4:</strong></p>
      <p>I then took the ttf that FontLab created (Step 1) and opened it in TypeTool 2, to see once again that there was a kerning pair included... i chose Generate ttf with the default values and a warning window came up!</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/warning.gif"></div><p></p>
      <p>I press the Continue button with the GPOS table selected (without knowing what this is all about)... and for this reason TypeTool 2 failed for the first time to generate a ttf that PS could write with the kerning pair included!!!</p>
      <p>When at the warning window chose not to select the GPOS - 80 table... then PS could write with the kerning pair included!!!</p>
      <p>So what this is all about?? any hints? If someone knows something i would be glad if he shared his thoughts... if he will say to me "RTFM", at least tell me the page where i can read that info... that explains it all... and how to create a font with kerning pairs that will work...</p>
      <p>So far so good with my 4 Steps tutorial... and neither of them was able for FontLab to Generate a font that will produce ttf that would have a working pair in Photoshop CS2...</p>
      <p>So here comes a "free" font from <a href="http://www.backpacker.gr" title="www.backpacker.gr">www.backpacker.gr</a> <strong>BPpong - download TrueType</strong> that amazed me...!</p>
      <p><strong>Step 5:</strong></p>
      <p>I downloaded the BPpong ttf file... opened it in FontLab (Demo) and chose save as vfb. Once again warning windows came up telling me all about the Demo restrictions and the final vfb was saved with fewer glyphs than the original. It's ok with me... i will only need 1 kerning pair and a couble o glyphs to work. The BPpong ttf had many pairs already included (~2.200) which i deleted them all from the table in the kerning/metrics window and also from the opentype panel... I then created my good old kerning pair E F +1500 :o) and then selected the "Generate kern feature" so as to be the only pair in the feature kern in opentype panel. I cliked at Generate font (with default settings) and a new warning came up to me...</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/attention4oe.gif"></div><p></p>
      <p>!?! if anyone knows what this also means... i'm all ears (eyes)!! </p>
      <p>Anyway binary and compiled worked just the same!!! I saw Fontlab for the fist time giving me a ttf with the ability to have the kerning pair included and Photoshop could show it right!!!!</p>
      <p>So what special settings does this font has?</p>
      <p>I'm so confused.... i just need to have Fonlab to work like TypeTool does... create fonts with embended kerning pairs...</p>
      <p>Thank you for reading till down here... :o)</p>
      <p>Hope someone can help...</p>
    html_clean: |-
