      <p>&gt; You mean that if i want to buy the great<br>
      &gt; FontLab Studio for 645$ and i want to create<br>
      &gt; a font with only having some kerning pairs,<br>
      &gt; i have to add ligature features too? wow… </p>
      <p>No. He means that if you want to make an OpenType PS font that has kerning in Adobe InDesign CS/CS2, Illustrator CS/CS2 or other Adobe applications, you also need to add another OpenType Layout feature into the font. This has nothing to do with "the great FontLab Studio for 645$". If your OpenType PS font only contains the "kern" OTL feature and no other features, you will get no kerning in Adobe applications — no matter whether you build your font using FontLab 4.x, FontLab Studio 5, DTL FontMaster or Adobe FDK for OpenType. It's a bug in Adobe applications that Thomas Phinney hopes will be fixed in future releases. </p>
      <p>OpenType PS fonts with just the "kern" OpenType Layout feature and no other features work fine in other OpenType Layout-savvy environments, e.g. Windows Presentation Foundation (aka Avalon) or Mellel. </p>
      <p>Adam</p>
