    <p>Hello,</p>
    <p>This is my first post. I hope someone can help.</p>
    <p>I am using Fontlab 5 to produce a type face. I currently have all upper and lower case glyphs created. I have set the metrics for each of these so the default spacing is pretty good. There are currently 562 kerning pairs which have been kerned appropriately.</p>
    <p><strong>THE PROBLEM...</strong></p>
    <p>When I install the font file and open up some content in a word document the font does not use any of the kerning values, it just ignores them. The kerning in Fontlab comes up correctly when using the metrics window.</p>
    <p>Any help would be great, I am stuck until this is sorted.</p>
    <p>Thanks,</p>
    <p>Henry.</p>
