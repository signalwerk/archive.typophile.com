      <p>Newspaper printing is grey ink on grey paper, whereas laser toner is very black.<br>
      You can laser print onto newsprint paper, which helps, as does the "spread" of laser printing, which is a bit like the large amount of press gain in newspaper printing.</p>
      <p>If you're serious about this, I would suggest finding a newspaper which uses a commercially available font (Utopia is quite popular), and experimenting, trying to create as close a facsimile as possible of a particular page or column.</p>
      <p>dpi and lpi have nothing to do with this--they are really only relevant for halftones, not type.</p>
