    html: <p>newspapers are quite varied these days in terms of paper stock and print quality. Less important than the resolution is the paper stock. Most newsprint (traditionally, at least) tends to be rather absorbent and hence, you end up with a bit of ink bleed that you want to take into consideration. A laser printer won't necessarily emulate that for you. You could go with an inkjet and some crappy paper and trial and error.</p>
