    <p>Hi,</p>
    <p>What is the approx. resolution of type printed in a newspaper? I have done quite a bit of searching, and all I can work out is that most newspapers are printed offset at 100 lpi. Some articles I've read equate this to 150-300 dpi and others to 600 dpi or more.</p>
    <p>I suppose a better question would be: to simulate newspaper resolution what dpi should I set my laser printer to?</p>
    <p>Thank you,<br>
    Ryan</p>
