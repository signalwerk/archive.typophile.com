      <p>That should be DPI = LPI x 2, as in your example: scan at 300 dpi for printing at 150 lpi.</p>
      <p>The linescreen is useful to know for other design stuff too - like how much you enlarge/crop in scanning, for example, may depend on how sharp an image you expect your printers to produce. But the general point is very true, that the linescreen is something done by the person operating the imagesetter or platesetter, not the designer.</p>
