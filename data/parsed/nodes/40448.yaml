    html: <p>Newspapers I'm familiar with print with a line screen of 85 lpi to 105 lpi for halftones, which requires a digital image from 170 to 210 ppi. I find my 600 dpi LaserWriter generates both text and halftones that are a reasonable facsimile for a printed newspaper, though looking a little crisper because my paper is whiter than newsprint.</p>
