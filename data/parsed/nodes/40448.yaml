    html: |-
      <p>Electronic Pre-Press 101:</p>
      <p><code>Dots per inch (DPI) x2 = Linescreen (LPI)</code></p>
      <p>and (basically)</p>
      <p><code>DPI = Pixels per inch (PPI) </code></p>
      <p>Why are most scanned images recommended to be 300 PPI? Because the final output for a magazine is typically 150 LPI, give or take. 100 LPI would be really heavy for newsprint, since the dot gain would basically wipe out any of the benefit of having the higher res. Unless, as was mentioned, really nice newsprint paper were being used.</p>
      <p>But linescreen is not something that we as the designer needs to worry about, except for getting the proper resolution of bitmap images.</p>
    html_clean: |-
