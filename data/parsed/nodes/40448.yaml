      <p>An additional issue in newspaper output is that the editorial staffs usually inhabit expensive downtown office space and the production and manufacturing plants are on cheaper ground far outside of town, sometimes across the country. This means the final pages are often scanned at 600 dpi and sent by secure network to the plant. If one reads the NY Times, one can find instant undesired multiple masters where the buffer fills up in this process squeezing and then stretching a thin column of the whole page.</p>
      <p>Cheers!</p>
