    html: |-
      <p>Ink total is important here, Magazines are usually 280% (shadow areas with a combined CMYK percentages,for instance 80%C, 70%M, 70%Y, 70%K=290%total ink, a little high for a magazine, but would still work), while newsprint is 240%. You have to setup a special CMYK in Photoshop color settings custom cmyk 240% ink total. You can have the LPI set correctly, but if there is too much ink going on the paper M U D. I think on a laser printer it would look light, but the end result would look good.</p>
      <p>Do you have a photo that has been printed on newsprint? I would then try to match the laser printer tor the printed piece.</p>
      <p>The Truth shall set you free</p>
