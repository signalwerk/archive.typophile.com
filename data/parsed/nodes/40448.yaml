    html: |-
      <p>The lpi number usually refers to the halftone screen pitch used for photos and graphic tones. It has to be fine enough to blend visually while coarse enough to produce a sufficiently broad range of dot sizes (and thereby, gamut of tones) given the resolution of the imagesetter, compensated for the gain properties of the paper, ink, and press. Most such imagesetters run at 1200 dpi or higher. </p>
      <p>100 lpi tone sounds a bit high for newspaper, but a well maintained offset press with the more modern smoother newsprint might be able to handle it.</p>
      <p>On a laser printer you usually have to use an even coarser halftone screen (60-80 lpi) due to the cohesive properties of the electrostatic toner. You may only be able to produce tones from 20 to 80 % before they blow out to white or gain to solid black, respectively.</p>
      <p>Still, test it at various settings. Make a test image with stepped tone and smooth gradient bars and see what comes out best at different pitches.</p>
