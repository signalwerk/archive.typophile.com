    <p>Greetings. It's been a while since my last visit, but this is one of my favorite forums and I think I'll stay awhile this time.</p>
    <p>My college has a logo that was once official (it's been demoted, but is still very popular). It was designed back before EPS stood for anything, so there's no vector of it online (which is not a big deal, it's pretty easy to trace it). I doubt the college would offer up a vector either, considering its unofficial status.</p>
    <p>What I'd like to know is, what exactly is this font?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bullet_logo_6644.gif"></div><p></p>
    <p>Here's what I've managed to glean off of it, beginning with the obvious:<br>
    - Sans serif<br>
    - No bars on the I (and presumably the J)<br>
    - Bowls are closed<br>
    - Verticals are all equally long and wide<br>
    - Stroke in R is wider than vertical<br>
    - Bowls in R and P have entirely different proportions- R's is shorter, P's is thinner</p>
    <p>I presume that this font is the kind that tries to keep its capital characters in line- what I mean is, there is probably no capital letter taller than any other- and that most characters are boxy and symmetrical- no spurs or complicated stems or what have you.</p>
    <p>Has anyone got any ideas?</p>
