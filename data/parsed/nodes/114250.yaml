    <p>Hi everybody, </p>
    <p>I'm trying to find some authentic (as possible) digitised versions of historical English sans serif typefaces.</p>
    <p>Along the lines of: Caslon Sans, Figgins, Johnston etc.</p>
    <p>I've been trawling the forums and it seems like Caslon Sans is difficult to get hold of/has a strange license (I might be wrong). The one I've seen which I really like is John Morgan's version.</p>
    <p>I've looked at Figgins, and as beautiful as it is, it is a little 'bulky', for want of a better word, for my use.</p>
    <p>My knowledge of type history is patchy and ill-informed at best so forgive my vagueness!</p>
    <p>I'm looking for something along the lines of a sans serif that could have been used on an English shop from an unspecified time 'back in the day', with a bit of quirk and character.</p>
    <p>English designed and digitised would be ideal but willing to look at other digitised versions of typefaces based on grotesque's if need be, such as Klim's Founders Grotesk: <a href="https://klim.co.nz/blog/founders-grotesk-design-information/" title="https://klim.co.nz/blog/founders-grotesk-design-information/">https://klim.co.nz/blog/founders-grotesk-design-information/</a> which is as close a one I can find. It is a lovely font!</p>
