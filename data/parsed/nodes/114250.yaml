      <p>----start quote---<br>
      a sans serif that could have been used on an English shop from an unspecified time 'back in the day', with a bit of quirk and character. with a bit of quirk and character.<br>
      ---end quote---<br>
      It would be very helpful if you could clarify what you mean by "back in the day." 1850? 1900? 1930? 1970?<br>
      The term grotesque was first applied to an early sans serif by the English foundry Thorowgood in 1832.<br>
      English shops used hand lettered signage up until very recently. Some were clumsy, some were elegant.<br>
      If you are looking for grotesque typefaces that might have influenced sign makers you might start with  something like Monotype Grotesque of 1926, available as a digital font <a href="http://www.myfonts.com/fonts/adobe/monotype-grotesque/" title="http://www.myfonts.com/fonts/adobe/monotype-grotesque/">http://www.myfonts.com/fonts/adobe/monotype-grotesque/</a><br>
      A list of headline grotesque fonts <a href="http://www.fontshop.com/fontlist/genres/angloamerican_headline_grotesque/" title="http://www.fontshop.com/fontlist/genres/angloamerican_headline_grotesque/">http://www.fontshop.com/fontlist/genres/angloamerican_headline_grotesque/</a><br>
      For interesting variations google "wooden type" "grotesque."<br>
      Characteristics of the English grotesque, as compared to other sans may include a vertical spur on the G and a square M. Also check the design of a, e, g and t in fonts known to be grotesque.<br>
      Don</p>
