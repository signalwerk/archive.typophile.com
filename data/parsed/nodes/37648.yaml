    <p>Dear Typophiles around the world... I’m busy with a research project about Horley Old Style. As you might know, this face was developped in 1922 from Monotype as an answer to Goudy’s successful Kennerley. I guess later (1977?) Robert Norton worked on a revival and today Horley is available as a digitised typeface as well.</p>
    <p>If anybody of you have special background or any information about Horley, the specific designers behind it, Robert Norton or if anybody has access to specimens from the diffrent typefaces (1925, 1977, today....) or if anybody knows where such specimens could be watched... Every little hint or information is very helpful.</p>
    <p>Thank you very much and have a good time!</p>
    <p>cheerz,<br>
    Roland</p>
