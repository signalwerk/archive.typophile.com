  html: |-
    <p>The new movie "V for Vendetta" set in a totalitarian London of the future would seem to hold some real promise for stylish typographics. A peek at the movie website though reveals more mish-mash than style. I count about four faces on the opening page.</p>
    <p>Fittingly, they do use ITC Johnston or P22 Underground for some...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/vfont.jpg"></div><p></p>
    <p>A sinister redrawing of Gill or Johnston would have been cool, maybe set in a corrupted Tube roundel. A little more consistency would be nice. The posters page inside the site shows quite a mix of styles.</p>
