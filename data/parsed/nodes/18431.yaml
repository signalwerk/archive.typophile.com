      <p>Ok, I have the graphic novel, not the original individual comics. The typography of the novel design is inconsistent, the cover jacket has something like Univers Condensed and Eurostile, inside there seems to be a mixed use of Eurostile/Bank Gothic(!!) and Univers Ultra Condensed (but not quite), the R is different. The combination of eurostile and bank gothic throughout is not pretty at all... almost if the designer(s) did not notice the difference between the two.</p>
      <p>There is some ITC Kabel in there! ~ Page numbers and headers are set in ITC Kabel Medium. :)</p>
      <p>P.S. The chapters are set in an art deco typeface, drastic.</p>
