    <p>I’ve already put in a help ticket, but essentially I am trying to turn our logo into a single glyph for automation purposes on our magazine’s InDesign templates.</p>
    <p>I’ve saved the logo in every different format I can imagine and it just looks bizarre. The logo is a word mark that uses one case of Univers and a simple geometric shape. But no matter how I save it when I open it in Sig Maker the letters look like the outline is jacked up - like when you set Flash to trace something and set it to be way too smooth - you know how the letters have parts that are missing and they look all weird and triangular? Not pixelated, just distorted? </p>
    <p>What am I doing wrong? I’ve got the full-blown version and just installed it yesterday and reinstalled it. I test drove other files using different fonts and they all look the same.</p>
