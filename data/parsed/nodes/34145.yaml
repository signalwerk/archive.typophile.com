      <p>I believe this could be the one by Jon Hares as discovered by <a href="http://typophile.com/user/12832" rel="nofollow">zachary</a> in my post on dot fonts <a href="http://typophile.com/node/30152" rel="nofollow">here</a>, where you can find other proposals... Good dot fonts are obviously hard to find... Eventually I did my own take on the dot type for a project but it didn't work that great and I eventually didn't use it (also I suck as a typographer...)<br>
