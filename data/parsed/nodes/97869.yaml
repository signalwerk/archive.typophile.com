      <p>The text body looks indeed very close to <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/urw/baskerville/urw-baskerville-t-medium-extra-narrow/" rel="nofollow">URW Baskerville Extra Narrow Medium</a></strong></p>
      <p>The title looks like a different font, but it could be approximated by <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Adobe&amp;ffam=Caslon%20Book%20BE%20-%20Regular&amp;fstyle=&amp;fsize=60&amp;fid=69edc279563ee0f3f7f4ba93b978ad37&amp;wrap=2&amp;text=ARIES%20or%20THE%20RAM" rel="nofollow">Caslon Book</a></strong> with the exception of |A| &amp; |T|</p>
