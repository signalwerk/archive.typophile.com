  html: |-
    <p>Hello,</p>
    <p>Would anyone by any chance be able to identify the typeface used in the attached sample, taken from Joseph Macleod, "The Ecliptic" (Faber and Faber, 1930)? I have a hunch it might be a brand of Baskerville? Apologies that the resolution is not fantastic - I'm working from a pdf.</p>
    <p>Many thanks for your time,<br>
    Sean</p>
