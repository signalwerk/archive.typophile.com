    <p>Hey everyone,</p>
    <p>I’m working on polishing a logotype for a client and could use your help pointing out any areas to clean up. I’m rather new at modifying type. The original face is Fling.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-2_4246.jpg"></div><p></p>
    <p>Also, I’m looking for the right serif to use for body copy with this, hopefully something that’s classy and modern but maybe with some  feminine character. Hopefully with a nice small cap variation.</p>
    <p>Thanks for your help!<br>
    Matt</p>
