      <p><a class="freelinking external" href="http://new.myfonts.com/fonts/doyald-young/young-finesse/" rel="nofollow">Young Finesse</a> is a very light version of Optima that works well at very large sizes.</p>
      <p><a class="freelinking external" href="http://new.myfonts.com/fonts/agfa/mentor-sans/" rel="nofollow">Mentor Sans</a> is one I quite like. It has a bit more of a chiseled look. The lower case is particularly nice.</p>
