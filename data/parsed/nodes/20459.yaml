      <p>David, a juice extractor could come in handy at the after-hours parties...</p>
      <p>Adam Twardoch, Tom Phinney, and Mark Simonson are teaching the advanced font tech workshops. Jim Lyles, Sue Zafarana, and Steve Zafarana from Bitstream will be teaching the beginner’s sessions. Ilene Strizver will offer her famous Gourmet Typography workshop. We’ll also have Monotype Imaging’s workshops on font QA, font marketing, and experimental type (get your hands dirty), letterpress, traditional calligraphy, Arabic calligraphy (including digitization techniques), illuminated lettering, and engraving.</p>
      <p>No Friday workshops, sorry Joshua :( The main conference program will be in full swing, and it will be presentations and panel discussions on that day.</p>
      <p>I feel your dizziness, Andi - I’m excited, too!</p>
