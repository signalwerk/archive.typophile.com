    html: <p>A few things come to mind that I thought I'd share. <br> <br>[1] Because of the softness of the ear on your mark, it might be interesting to see a softer sans. However, I wouldn't go with a humanist sans, the modulation of strokes would contradict the monolinear-ness of your mark. What about Storm's DynaGroteskRE? <br> <br>[2] What if you used the ear from a more interesting typeface? Font Bureau's Amplitude has a trap near it's ear which could be incorporated for a more geometric mark. I think this might also make it appear more "talking balloon" like as well.  <br> <br>[3] There doesn't seem to be a rhymne or reason for the red box, accept to give weight to your mark. What if you made the stroke of the mark heavier and red? <br> <br>[4] You showed us how you created the mark, and I understand the talking balloon, but I don't understand the box.  <br> <br></p>
