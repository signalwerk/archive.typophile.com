    html: <p>Luka, I'm back. Take a look at these sans faces and see if any of them compliment your logo better. News Gothic Condensed, Trade Gothic Condensed (its squarer than News Gothic), Formata light Condensed, Optima, Agenda Light Condensed. You can find these faces at MyFonts to take a look. If you want something more unusual, take a look at Dyna Grotesk D Plain, Faber Eins/Zwei Normal, Pragma ND Light.</p>
