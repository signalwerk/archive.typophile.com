  html: |-
    <p>I work with FontLab and use multiple master technology for developing font families with a large amount of weights.<br>
    Unfortunately I am experiencing an issue in combination with font-audit.<br>
    The option "extremium point" does not work well with multiple masters.<br>
    It adds an extremium point to the current master, but this extremium point is not placed correctly on the other masters.</p>
    <p>Does anyone experience the same issue?<br>
    Anyone has a solution?</p>
