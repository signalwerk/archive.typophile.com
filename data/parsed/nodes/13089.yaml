      <p>ASTRA Frutiger is a custom version of Frutiger designed for the Swiss government. I don’t know who designed it. Frutiger gave his blessings, though. The vertical strokes in ASTRA are heavier than in the standard Frutiger, and the letters have been a bit condensed as well.</p>
      <p>ASTRA Frutiger’s development was documented in the Fresh Fonts exhibition at the Museum für Gestaltung Zürich in 2004.</p>
      <p>If you need more info, I can try to track something down…</p>
      <p>__<br>
      <a href="https://web.archive.org/web/20081006111313/http://www.typeoff.de/" title="www.typeoff.de">www.typeoff.de</a></p>
