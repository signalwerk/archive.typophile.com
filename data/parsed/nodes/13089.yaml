      <p>I can only answer from a practical point of view here (since I live in Switzerland).</p>
      <p>The old road signs using another font are being replaced slowly with Frutiger (ASTRA?). I have also spotted Frutiger Condensed on road signs with long town names.</p>
      <p>But mostly it’s still the old signs with that no-name font. “VSS” is the name, as I recall from another recent thread (Belgium has the same old road sign font):<br>
      <a href="https://web.archive.org/web/20081006111313/http://typophile.com/node/12978" title="http://typophile.com/node/12978">http://typophile.com/node/12978</a></p>
