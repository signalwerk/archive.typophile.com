    <p>I’m trying to figure out whether Frutiger is in use as a road-sign font anywhere in the world. I’m under the impression that it’s used in Switzterland, but that the version there (ASTRA-Frutiger?) may have been reworked by the Swiss government. Does anyone know anything about Frutiger being used on Swiss roads, or whether any version of it appears on highway signs anywhere else? If so, what version is currently on those signs?</p>
