    html: <p>Well, some says that Avenir <em>is</em> a better Futura, so... I still think that it's more geometric than humanist in spirit, though. Well, okay, maybe it's more 'tough' and 'sturdy' rather than 'geometric' proper; but it's also warmer than, say, DIN.</p>
