      <p>Since at least 1900 (and probably much earlier than that), printed law reports in the US have uniformly used typefaces with lining figures only.  The United States Reports (U.S. Supreme Court opinions) use Century Expanded in the printed version, and Century Schoolbook in the preliminary versions handed out to the press and downloadable from the Court's website.  I can't remember what typeface the West reporters use, but they, too, use lining figures only.  The vast majority of law firms use Times New Roman, which likewise has lining figures only (at least in the standard Windows versions).  Legal texts and law school casebooks use lining figures only.  And because citations are put in text rather than footnotes, legal briefs and judicial opinions and law school materials use LOTS of figures, vastly more than in, say, an ordinary novel or magazine article.</p>
      <p>So any lawyer whose uses a typeface with old-style figures (I see Georgia from time to time, for example) is screaming "WEIRD!!  DIFFERENT!!!"  As far as 99.9% of lawyers and judges are concerned, that lawyer might as well use P.T. Barnum or Comic Sans or Blue Island.  For a profession as hidebound as the law, OSF are a serious no-no.  Legal typefaces need to be invisible, and they can't be invisible if they use OSF.</p>
