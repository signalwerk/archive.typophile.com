    html: <p>ITC Stone Serif with oldstyle figures (from ITC, not Adobe) is a tremendous workhorse that blooms at 9pt, whereas others mentioned here bloom more at 10pt. And it's very crisp, fairly high contrast, with a large x-height, available in three weights. Dolly, Absara, and Fedra are way too informal, even cute. Stone Serif (use its matching Stone Sans as a sidebar) is just right for a law firm, even aggressively right. Or, Warnock Pro from Adobe.</p>
