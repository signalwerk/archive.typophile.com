    html: |-
      <p>Any font for all-purpose law firm use absolutely, positively needs lining figures, not old style figures, as the default, not merely accessible via opentype advanced features.  Any law firm needs a font that will work with Microsoft Word or WordPerfect, instead of requiring InDesign.  That means that Dolly and Fedra are out.  They're both too unusual, anyway, and there's something not quite right about Dolly's bold.</p>
      <p>Stone Serif might work, but I'm not familiar enough with it.  Linotype Sabon is ok.  Monotype Sabon is too light.  Sabon Next and Le Monde Livre are in general very good, but Porchez likes weird pilcrows (Paragraph signs) for some unknown reason, and that might be a dealbreaker for LML and SN (SN has good pilcrows, but only in its small cap set).  Linotype Sabon is a little bit too light, but is good otherwise.  SN and LML are just about a perfect darkness for law firm use.  Abrams Augereau is also very good, but also has a problem with the pilcrow.  What's with these weird pilcrows in Garamond revivals, anyway?</p>
      <p>You may think that it's odd for me to be so concerned with the pilcrow (paragraph sign), but whereas, in general, it's little used, in legal work it's used a lot (although that varies with the type of law practice)</p>
      <p>Palatino is quite decent, but it may be too common for branding purposes.  Or not.  99% of law firms use Times New Roman or similar, and nothing else.  Lawyers don't normally ever see Palatino.  And it has a nice, conventional pilcrow.</p>
      <p>A law firm will almost never use anything as small as 9 point, except maybe in parts of contracts intentionally aimed at being hard to read.</p>
      <p>Miller, Escrow, and assorted variants of Century are quite good, IMO, but may seem too old-fashioned for someone who wants something "very modern."</p>
      <p>Meridien is good, except the regular is a little bit too light, and the medium a little bit too dark (and not a big enough contrast with the bold).</p>
      <p>I'd be inclined to recommend going with Palatino.  It's quite good for many uses, and has the advantage of being "free."  </p>
      <p>Kingfisher would be a really good choice, but Tankard made the default figures old style.  You need opentype advanced features to get at the lining figures, so most law firms wouldn't be able to.  Grrrrr!</p>
