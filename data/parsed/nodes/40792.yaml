      <p>I can't comment on 1L textbooks--I was a 1L 35 years ago, and have no recent 1L texts on hand.  And Aspen (recently eaten by Wolters Kluwer) is small potatoes in American legal publishing.  But I compulsively went through the several dozen Aspen treatises and texts (maybe 150 volumes in all) in my firm's library, and every single one uses lining figures only.  There was one small exception--on the cover and title page of one supplement, "2007-2008" was in OSF, but the body text in that volume uses lining figures only.</p>
      <p>I also double-checked the U.S. Reports, and they're lining figures only, all the way back to the first volume (1796).</p>
      <p>As I said, from time to time I see legal publications that use OSF, almost always because they're done using a font (e.g., Georgia) that by default prints using OSF in Microsoft Word or WordPerfect .  There are virtually no law firms, big or small, that use anything other than such word processing programs for in-house document production.  Many (including my firm) often use outside printers when they aren't equipped to do them in house (e.g., for small format U.S. Supreme Court briefs), and those outside printers often use sophisticated layout programs such as InDesign.  And my firm and many others farm out production of glossy propaganda sent to clients and prospective clients.    But lining figures are still pretty near universal, and that hasn't changed recently.  And I'd be willing to bet that the vast majority of instances where OSF are used don't reflect a conscious choice of OSF over LF when both are available for use, but reflect a choice of an alternative font that happens to have default OSF by people who know nothing about typography, but do know that they're ready for a change of pace from Times New Roman and Arial.</p>
      <p>Typographically, documents produced by lawyers and law firms, including the biggest and best firms, tend to suck, because few pay any attention at all to typographical matters.  Sample legal briefs from any large, prestigious law firm, and you'll see documents that regularly violate every principle in Bringhurst.  Why?  Tradition, and the choices made by the firm's head secretary back when typewriters were cutting edge technology.</p>
    html_clean: |-
      <p>I can't comment on 1L textbooks--I was a 1L 35 years ago, and have no recent 1L texts on hand.  And Aspen (recently eaten by Wolters Kluwer) is small potatoes in American legal publishing.  But I compulsively went through the several dozen Aspen treatises and texts (maybe 150 volumes in all) in my firm's library, and every single one uses lining figures only.  There was one small exception--on the cover and title page of one supplement, "2007-2008" was in OSF, but the body text in that volume uses lining figures only.</p>
