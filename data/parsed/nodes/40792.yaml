      <p>That's a well-argued opinion, and I used to think the same way until very recently (see my earlier post in this thread). But then I found that it did not bother me at all to be reading cases set in osf. I even began setting my casebooks in Minion with osf and although you don't believe a decision like that could be intelligently made, I received nothing but favourable responses.</p>
      <p>At bottom, it is a question of convention and habit. Lawyers have adjusted quite quickly to reading case law on the screen, set in sans. Surely they will overcome osf.</p>
