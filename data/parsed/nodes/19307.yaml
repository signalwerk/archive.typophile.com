    <p>My client is a small semi-upscale boutique for designer infantwear. They describe themselves as punk, but everything looks too clean for me to endorse that fully. Rather, think D&amp;G writ small, tiny rock-themed graphic Ts, asian patterns, etc. </p>
    <p>They need a typeface (or two) to use across a range of publications. It should be suitable for body copy and headlines. I can use either a single face or a body/headline pairing. Their marketing strategy is entirely focused on the parents. The baby is framed as an accessory of sorts.</p>
    <p>The concepts of 'punkness' and 'infancy' are almost completely antithetical. Thus far, every combination  I have found comes across as a joke. Is there such a thing as clean, safe, adorable punk? They currently use all lowercase courier new, which is awful . . ..</p>
    <p>Tim</p>
  html_clean: |-
