      <p>Actually, yes it's doing very well . . . in the region's most upscale shopping area, no less. As I touched on earlier, it's not really 'punk' as I understand it (c.1970s London) but it's definitely edgier than any other infantwear I've seen. We're presenting it this way: A baby could care less what decorates her onsie, so her parents might as well dress her as they like until she's old enough to define herself . . . and very few twentysomethings would opt for Winnie the Poo as a personal aesthetic. </p>
      <p>And actually, I was completely serious about the Clarendon. Am I the only one to notice the Clarendon/Edgy-art-school-knitting-club connection? In hindsight, "they seem favor sturdy Victorians like Clarendon" has a backhanded "women in comfortable shoes" connotation that I absolutely did not intend. Sorry if I offended anyone :-/</p>
