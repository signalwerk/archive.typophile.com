      <p>Honestly, I think I would simply go with Courier, no alterations—the classic, not a modernized remake. It is just ugly enough to merit punk. If you notice the descender on the lowercase "p" you'll see that it becomes quite muddled. That's a good thing; it needs no alteration. And, the spacing of the letters are just discongruent enough that it won't look perfect. </p>
      <p>Part of the uniqueness of punk is that it doesn't try too hard. Cut n' paste and typewriters are not punk because they've been sanctified by the Punk Rawk Academy, they are merely accessible and easy methods. Style was—at at least at one point—a byproduct of the tools, not the other way around.</p>
      <p>As a person who grew up in a punk scene, I abhor grunge fonts. I feel that if one wants to dirty up a font, then that person should do it by hand. Could you suggest to your client that they take all their print material and photocopy it to give it that extra edge? I realize that's a chore, but if you can sell them on the idea, I feel it would do your work (and most importantly their brand) justice.</p>
      <p><strong>Have fun.</strong></p>
