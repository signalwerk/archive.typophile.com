      <p><a href="http://www.myfonts.com/fonts/canadatype/quiller/" rel="nofollow">'Quiller'</a> from Canada Type (a revival of 'Privat' by Joachim Siercke) has alternate characters that have a similar flare, and could make a good substitute if the original can't be found. I have a feeling this might be a font from Scriptorium -- at least I think it looks familiar. Still checking Part 4 of the Script Guide...</p>
      <p>- Mike Yanega</p>
