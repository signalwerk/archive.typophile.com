      <p>Neither do I seem to understand Berlowese, but rest assured that x-direction “hints” are <em>not</em> turned off in ClearType.</p>
      <p>If you are looking for a switch similar to the INSTCTRL[] for re-introducing x-direction deltas (cf end of <a href="http://www.beatstamm.com/typography/RTRCh4.htm#Sec12" rel="nofollow">RTR 4.1.2 Deltas “Galore”</a>), the answer is ‘no’—I didn’t put one into the rasterizer at the time, and I’m unaware of anybody else who might have done so since. If you’re considering programming in native TrueType assembly language, you could use <code>GETINFO[]</code> to identify the rendering method and bracket instructions executed in x-direction by <code>IF[] … EIF[]</code> pairs. However, be aware that while this may solve spacing problems related to <a href="http://www.beatstamm.com/typography/RTRCh4.htm#Sec20" rel="nofollow">RTR 4.2.0 “Compatible” Advance Widths</a>, it may introduce new ones as a result of the advance width still being rounded to integer (“padding” or “truncating” of the right side-bearing, cf <a href="http://www.beatstamm.com/typography/RTRCh3.htm#Sec30" rel="nofollow">RTR 3.3.0</a>, <a href="http://www.beatstamm.com/typography/RTRCh4.htm#Sec21" rel="nofollow">RTR 4.2.1</a>, and <a href="http://typophile.com/node/80015#comment-457577" rel="nofollow">this example in the RTR thread</a>).</p>
    html_clean: |-
