  - id: 499440
    user: 11119
    date: 2012-03-14T06:14:00
    date_raw: 14 Mar 2012 — 6:14am
    votes: null
    html: |-
      <p>Most “hinters” I’ve come across don’t seem to understand the concept and power of size-independent instructions, nor CVT cut-ins or dual PVs for that matter, let alone the necessary preconditions for using <code>SDPVTL[R]</code>—testament of which I’ve seen time and again while analyzing major failures of fonts rendered with early implementations of ClearType. “A computer could never do this!” was the mantra-esque “explanation” I was given when I tried to nudge “hinting” towards a ppem agnostic ansatz. “We need these deltas to do it properly!” and “Hinting puts the ‘Clear’ into ‘ClearType!’” While today the latter seems more than a bit ironic to me, at the time this engineer on somebody else’s payroll was happy to comply with the employee review goals and added 256 combinations of ClearType deltas to the GUI of VTT for everybody’s exuberant indulgence in color fringes.</p>
      <p>While prototyping an auto-hinter it dawned on me how intensely absent the notion of ppem independence was amongst professional “hinters:”</p>
      <ul>
      <li>“Spacing algorithm? Don’t bother with it, most of the time this doesn’t work, anyway.” More deltas!</li>
      <li>“Inheritance tree? Well… you could do 3 pixels here and 4 pixels there, but in <em>this</em> case it’s too early to do 2 and 3.” CVT deltas!!</li>
      <li>“Composites? Just use fn nn to put the accent on top of the base character. What do you mean, ‘center the umlaut’?” Composite deltas!!!</li>
      </ul>
      <p>Deltas are completely useless in an auto-hinter. The auto-hinter doesn’t go “Hm… maybe I should ‘pop’ this pixel here and that pixel there” after it’s done with a character. When you write an auto-hinter, the code has to get it right the first time around, in a ppem-independent way. Hence for the inheritance algorithm I gathered abundant anecdotal evidence until I saw a pattern, while for the composites I revisited the tenets of my PhD thesis and implemented a kludge. As to the spacing algorithm, I compromised it to the prevailing preferences and the anticipation that subsequent use of the font will require linear spacing (WYSIWYG and similar fixed layouts). </p>
      <p>The world around me seemed comfortable with the ClearType quirks of <code>MDAP[]</code>, <code>MIAP[]</code>, <code>MDRP[]</code>, <code>MIRP[]</code>, and <code>ROUND[]</code>, along with a generous palette of deltas, but me and my auto-hinter weren’t. While I can’t tell you how I implemented the auto-hinter, I can give you the gist of what I did for many of the illustrations in the RTR (cf e.g. the table in <a href="http://www.beatstamm.com/typography/RTRCh6.htm#Sec10" rel="nofollow">RTR 6.1.0</a>):</p>
      <ul>
      <li>Use <code>SCFS[]</code> instead of <code>MDAP[]</code> or <code>MIAP[]</code></li>
      <li>Use <code>MSIRP[]</code> instead of <code>MDRP[]</code> or <code>MIRP[]</code></li>
      <li>Do my own math instead of <code>ROUND[]</code>, including CVT cut-in logic and minimum distance constraint</li>
      <li>Use a <code>SCANTYPE[]</code> snippet like <a href="http://www.beatstamm.com/typography/RTRCh4.htm#Sec12" rel="nofollow">this</a> in my <code>prep</code> even though I’m not using a single delta.</li>
      </ul>
      <p>This does require some programming in native TrueType assembly language but lets me address a plurality of rendering methods with a single set of function calls, like so for a Calibri UC ‘H:’</p>
      <p><img src="http://www.beatstamm.com/temp/CalibriH11pt96dpiAAX.png"></p>
      <p>What may seem like many parameters is simply a way to switch out spacing algorithms or linking strategies. This permitted me to emulate the “link tree” of your example, with the left edge rounded to grid and the right edge rounded to sample—without “re-hinting” Calibri—simply by changing the respective function (notice that I didn’t use a CVT for the LSB since I don’t know the strategy behind your spacing algorithm). This produces a decent size ramp in B&amp;W with consistent stroke design contrast. Once the vertical stems are heavier than the horizontal crossbars, they stay heavier, with the ratio approximating the original design as closely as the coarse pixels allow.</p>
      <p><img src="http://www.beatstamm.com/temp/CalibriH6to48pt96dpiBW.png"></p>
      <p>That same set of functions can implement different rounding “granularities” once it’s rendered in gray-scaling, with progressively smoother transitions between stem and crossbar weights, along with a more gradual introduction of stroke design contrast. The rounding granularity is simply an implied parameter of some of the functions used in the process. Also notice the subtle introduction of the rounded stroke ends by around 30 pt on the middle row, and earlier on the bottom row.</p>
      <p><img src="http://www.beatstamm.com/temp/CalibriH6to48pt96dpiAA2x.png"><br>
      <img src="http://www.beatstamm.com/temp/CalibriH6to48pt96dpiAA4x.png"><br>
      <img src="http://www.beatstamm.com/temp/CalibriH6to48pt96dpiAA8x.png"></p>
      <p>Plain ClearType suffers because it doesn’t anti-alias in y-direction, hence the crossbar weight “jumps” in increments of pixels, but at least it doesn’t appear to have crossbars that are heavier than the stems. Likewise, it cannot render the rounded stroke ends until 127 pt or thereabouts, at which point it makes little sense to use ClearType in the first place. Like in your B&amp;W and gray-scaling examples both stems are left-aligned to pixel boundaries, while the stem weights are rounded to the nearest 1/6 of a pixel, compatible with ClearType’s 6× oversampling rate, and hence pairs of stems yield the exact same color fringes.</p>
      <p><img src="http://www.beatstamm.com/temp/CalibriH6to48pt96dpiCT.png"></p>
      <p>ClearType with y-anti-aliasing improves on the aforementioned short-comings, with the rounded stroke ends coming in at 27 pt. This difference is due to the fact that the middle row of the gray-scaling examples uses 4× oversampling, compatible with Windows NT gray scaling and above, while y-anti-aliased ClearType uses 5× oversampling. In other words, y-anti-aliased ClearType uses slightly smaller samples and hence the rounded stroke ends can be “turned on” at a slightly smaller point size.</p>
      <p><img src="http://www.beatstamm.com/temp/CalibriH6to48pt96dpiCTyAA.png"></p>
      <p>Following your examples, below are 3 juxtapositions of TT source code and rendered output. Top to bottom:</p>
      <ol>
      <li>ClearType, y and x instructions on</li>
      <li>ClearType, y instructions on, x instructions and <code>IUP[X]</code> and <code>IUP[Y]</code> commented out</li>
      <li>Same as above except forcing integer ppem sizes in the <code>head</code> table</li>
      </ol>
      <p><img src="http://www.beatstamm.com/temp/CalibriH11pt96dpiCTX.png"><br>
      <img src="http://www.beatstamm.com/temp/CalibriH11pt96dpiCTNoXFractPpem.png"><br>
      <img src="http://www.beatstamm.com/temp/CalibriH11pt96dpiCTNoXIntPpem.png"></p>
      <p>The difference between x instructions on and off is apparent. What may be less apparent is the effect of forcing integer ppem sizes in the <code>head</code> table. At 11 pt and 96 dpi, the exact ppem size is 14 2/3. Forcing this to integer rounds this up to 15 ppem, with commensurate effects on height and width of the outlines. While the height is still hinted (and would be perfectly smooth without commenting out the <code>IUP[Y]</code>), without hinting the black body width further encroaches on the RSB space, which may not help spacing.</p>
      <p>Granted, most of the above TT related jargon may be outside the conceptual range of casual Typophile Forum visitors. At the same time, 256 combinations of ClearType deltas are all but ludicrous, even with a graphical user-interface. But overcoming this “bazillion exception approach” requires programming, whether you <code>MIRP</code> it or <code>MSIRP</code> it. Along the way you get to change the spacing algorithm or similar strategies without “re-hinting” the entire font. And your file size does not “bloat” n-fold. That’s why I called it <a href="http://www.beatstamm.com/typography/RTRCh6.htm#Sec3" rel="nofollow">Beyond “Delta-Hinting”</a>.</p>
      <p>@frode frank<br>
      Unnskyldning på kapre din tråd igjen…</p>
