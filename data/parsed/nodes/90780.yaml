    html: |-
      <p>Like I said, x hints are turned off in ClearType. </p>
      <p>The MS specification is also wrong now, as it says: <em>"An MSIRP <strong>has the same effect</strong> as a MIRP instruction except that it takes its value from the stack rather than the Control Value Table."</em></p>
      <p>(my italics and bold italics, only because there is no black italic;)</p>
      <p>We can do it any way MS says!, though I was hoping for something compatible with the publicly available tools, like the ones Frode is probably using. </p>
      <p>Which returns us to the original question of how to turn off instructions that don't work anyway. </p>
      <p>Is there any publishable documentation that lists the complete set of TT instructions that are not turned off but just don't work with Cleartype? Or is it simply anything that references the CVT?</p>
