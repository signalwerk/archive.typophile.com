    html: |-
      <p>You mean in the context of colour subpixel Quartz rendering, yes? The Win8 rendering is something new: 8x1 asymmetric greyscale rendering (8 shades of grey in the x direction, 1 (black) in the y direction) jumping to a 4x4 symmetric rendering for larger sizes, but unlike older greyscale rendering positioned on natural widths using subpixel positioning. I think in the y direction the new MS rendering will still be better than Mac in terms of readability, since it doesn't allow horizontals hairlines to lose contrast; but in the x direction greyscale on a subpixel spacing grid may be fuzzier than colour subpixel rendering on the same spacing grid in many situations.</p>
      <p>I confirmed this morning that DWrite specifically prevents hinting of advance widths. I'm not sure what this implications of this are for the Win8 rendering, but I suspect it isn't good in terms of whether we'd be able to hint to avoid the subpixel positioning. This suggests that in order to produce crisp and dark text under typical desktop/laptop resolutions in Metro, one would need to target specific sizes with outlines and metrics all fitted to full pixel edges, because even a small variance off the full pixel advance widths would have a knock on effect on the fuzziness of subsequent glyphs in a line (and, of course, even if you do keep to full pixel advance widths, you'll lose sharpness as soon as someone uses the font in the same line of text as a preceding different font without this (an issue we hit with subpixel rendering of an Arabic UI font recently)).</p>
      <p>On mobile phones and tablets, for which the Metro UI is clearly targeted, these issues will be ameliorated but not removed by higher screen resolutions. There is also the possibility that this is a temporary situation, I suppose, particular to Windows 8. The fact that the decision was made so late in the day -- after the developer preview -- suggests that maybe the Metro programmers felt they didn't have time to optimise either their code or the ClearType renderer to improve performance, and this is something they might be able to do for Windows 9.</p>
