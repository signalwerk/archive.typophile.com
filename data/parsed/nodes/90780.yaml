    votes: null
    html: |-
      <p>If there's a way to post graphics here, I can't find the button no more. but <a href="//typophile.com/node/91017" rel="nofollow">here</a>. </p>
      <p>The link that I pointed to above in this thread, includes testimony of the fact that one can hint the stems to move in x when CT is turned on, but one cannot do it with “links”, or <em>size <strong>in</strong>dependent instructions</em> like "mirp" and "mdrp". </p>
      <p>Thus! <em>size dependent instructions</em> for CT, depending on how many sizes are “hinted”, make the font file n-times larger than “normal” x-direction hints (for aliased or greyscale rendering), where n is for all practical purposes, the number of sizes one hints.</p>
