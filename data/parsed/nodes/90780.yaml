      <p>David, I didn't find the four riders, but then I wasn't looking for them, either.</p>
      <p>What I did find is a glossy new runs-on-any-device interactive whizbang user interface -- 'Metro' -- that is apparently so demanding of the graphics processor and memory that, somewhere between the Win8 developer preview and the public beta, Microsoft decided to disable ClearType for Metro apps and UI and replace it with a faster-rendering 8x1 greyscale antialiasing (4x4 at larger sizes, gaspable) but -- and here's the nasty bit -- <em>keeping subpixel positioning.</em></p>
      <p>I'm not sure yet what hints are respected in this new rendering. If all the old greyscale rendering hints are respected, then presumably there's the possibility of snapping to full pixel widths and avoiding the effects of the subpixel positioning.</p>
      <p>_____</p>
      <p>Indeed, congratulations, Frode!</p>
