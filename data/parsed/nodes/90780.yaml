      <p><em>@jasonc:</em> Not a silly question: with the exception of distorting deltas, none of the instructions are turned off, but—depending on the direction of the projection vector—rounding is generally performed in one of two ways:</p>
      <pre><code>
      <strong>if</strong> “projection vector is in y-direction”
      <strong>then</strong> “round to pixel”
      <strong>else</strong> “round to sample”
      <strong>end;</strong>
      </code>
      </pre><p>
      where sample at the time was defined to be 1/16 pixel. The <code><strong>else</strong></code> case includes both x-direction and notably any diagonal directions. The background behind this logic is described in <a href="http://www.beatstamm.com/typography/RTRCh4.htm#Sec1" rel="nofollow">RTR 4.1 ClearType &amp; “Legacy” Fonts</a> and plenty more details are available in GregH’s article “<a href="http://www.microsoft.com/typography/cleartype/truetypecleartype.aspx" rel="nofollow">Backwards Compatibility of TrueType Instructions with Microsoft ClearType</a>.”</p>
      <p><em>@dberlow:</em> With all due respect for someone like you, Mr Berlow, who can run a business making fonts in this day and age: I have tried to help you with anything I could, but now it sounds like someone lost his TrueTypity blanket…</p>
      <p><img src="http://www.beatstamm.com/Temp/David Berlow TrueTypity Blanket.png"></p>
