    <p>A substyle of <a href="/node/12128/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Blackletter</a> type, probably first developed in Germany around 1470. Schwabacher is more open, wide, and rounder than the earlier <a href="/node/13831/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Textura</a>, as well as less standard and less ornate than the later <a href="/node/13772/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">fraktur</a>.</p>
