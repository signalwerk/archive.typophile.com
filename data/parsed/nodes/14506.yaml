    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Blackletter" class="freelinking" rel="nofollow">Blackletter</a> : Schwabacher</strong></p>
    <p>A substyle of <a href="/wiki/Blackletter" class="freelinking" rel="nofollow">Blackletter</a> type, probably first developed in Germany around 1470. Schwabacher is more open, wide, and rounder than the earlier <a href="/wiki/Textura" class="freelinking" rel="nofollow">Textura</a>, as well as less standard and less ornate than the later <a href="/wiki/Fraktur" class="freelinking" rel="nofollow">Fraktur</a>.</p>
