    <p>hello - i have a general question and so anyone’s time and advice would be much appreciated.</p>
    <p>i’m currently a publicist at pr agency in the film industry in new york city. i’ve been doing this for the last 5 years and while it’s been great (also grueling, lifesucking, rewarding, fun and not fun), i’m ready (more than ready) to stop and take a break and change course, before i hit age 30 in 3 years.</p>
    <p>i have always been interested in art and design but never very actively pursued it other than general interest of taking classes throughout high school and a few in college and just being a general art enthusiast. i didn’t listen to my teachers or instructors to pursue a degree in art-related field but i’ve always kept it in the back of mind.</p>
    <p>recently, i read about the aas program at parsons and i thought the program’s description was speaking to me in regards to pursuing a new career in graphic design. </p>
    <p>while i am seriously considering this - and doing things like taking a continuing ed class to dip my toe in (that’s actually where this whole career change idea stemmed from initially) - i wanted to know, what things should i be considering? obviously i’m facing at least $60K in loans if i do a “fast track” since i have a BA or $120K+ if i chose to do the regular 2-year program for a more saturated expereince. also, i’ve worked up the ladder to account exec and i’m ready to start over in a new field - but what entry level salaries am i going to be looking at? (yikes)</p>
    <p>thanks for reading and look forward to any thoughts!</p>
