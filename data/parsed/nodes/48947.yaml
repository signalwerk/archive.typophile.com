      <p>I would say you’re way ahead of the game, because you already know how to use business-speak. This is an invaluable skill, because it turns a $2000 “I need a logo” job into a $20000 “brand development” job. </p>
      <p>I would seriously consider looking at other schools, with a smaller price tag. I went to an expensive school, although it didn’t have quite the name recognition of Parsons, especially after Project Runway, but I have never felt like I make more or less than other designers because of it. I’ve met unemployed people with</p>
