    <p>Hello.</p>
    <p>I'm in the middle of designing a book on the roots of creativity and thinking of setting it in Aldus. The character and the feel is good but the whole thing seems a little tight. Of course it's less efficient than setting in Bembo for example but the book isn't really heavy, like a novel, it's more illustrative. I may have to track it out a little to get a better flow. Yes I've looked at Palatino light but I hate it.</p>
    <p>Anyone had experience in using vast amounts of Aldus?</p>
    <p>Thanks, James.</p>
  html_clean: |-
