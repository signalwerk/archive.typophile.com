    html: |-
      <p>I once (1991) used a lot of digital Aldus, and re-kerned it in Quark.<br>
      I found that combinations such as s-a and p-o, etc., needed opening up.<br>
      That relieved the tightness which you spoke of.<br>
      The problem was that the bowls were too narrow and squarish to be fitted so tight.<br>
      Palatino was the corporate face I had to work with. Aldus was my cheat for text, I used Palatino for Bold, and display. If I were doing the same job now, and had free rein, I would use a contemporary face. Seria, perhaps, has a similar cut and proportion.</p>
