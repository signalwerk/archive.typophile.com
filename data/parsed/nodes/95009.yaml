    <p>Hello,</p>
    <p>I am looking for a font to match my logo. It should have a somewhat <em>boxy</em> feel to it. Right now I am using FF Din, I just wish it was available in small caps. Can anybody think of a better font?</p>
    <p>It should be simple, pure, minimalist, geometric, highly visible at small sizes, and it should be a good fit for the logo.</p>
    <p>Thanks for any suggestions!</p>
