  - id: 519806
    user: 3602
    date: 2012-08-23T05:54:00
    date_raw: 23 Aug 2012 — 5:54am
    votes: null
    html: |-
      <p>Tintin,</p>
      <p>That first one is yours. I guess I should have labeled them.</p>
      <p>As far as getting the mark and the type to play off each other, I don't know of any sources that offer tutorials. I think it's one of those things you have to observe in other well crafted logos and try and incorporate in your own designs. I think you've got a start by using similar colors and not using a serif font. And copying the "D" mark into the type wouldn't work.</p>
      <p>Perhaps find logo books at the library or book store. I find hand drawing really good logos gives me a feel for how they were crafted and hopefully sticks a little in my brain.</p>
