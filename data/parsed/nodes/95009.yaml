    html: |-
      <p>I'm usually late to the party, and wearing shorts while the rest are in suits. However, my curiosity overpowered my antisocial tendencies. I currently have only one commercially available font, that just happens to be a boxy sans. I threw it together with your mark just to see if it would stick to the wall.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_38_Variations_3654.png"></div><p></p>
      <p>I'm inclined to repeat timaarts' comment about making the mark and the type play off each other. That makes for a much more cohesive logo and less likely to get ripped off, by the design trolls. </p>
      <p>In which case, my offering wouldn't work at all in your current mark iteration. But, there it is.</p>
