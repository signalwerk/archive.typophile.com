      <p>Charles, thanks but your suggestion doesn't help much. Here is what happens.<br>
      1. Inserting hair space before Combining Acute Accent gives stressed space (both English and Cyrillic). The stress is shifted up and right in this case:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Hyphen_1_3503.jpg"></div><p></p>
      <p>2. Inserting hair space after Combining Acute Accent doesn't allow to hyphenate the word:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Hyphen_2_4925.jpg"></div><p></p>
      <p>3. Inserting discretional hyphen right after Combining Acute Accent manually makes the trick but we need autohyphenation.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Hyphen_3_3947.jpg"></div><p></p>
