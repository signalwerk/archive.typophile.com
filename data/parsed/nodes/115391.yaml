    <p>Hello everyone!</p>
    <p>I have the following text layout problem in InDesign CS6 and CC for Mac. Text is typed with Times New Roman. Some vowels have stresses placed with the symbol Combining Acute Accent (Unicode 0301). This is the common character for the stress in Cyrillic texts. When I choose to automatically hyphenate text the hyphen shifts down if it appears after the stressed letter. This happens when you select the Hunspell hyphenation dictionary and text is marked as Russian. Everything works perfect with English text.<br>
    So the question is: What is the cause of the problem, is it in the Adobe software or in the font? What could be changed in TNR to make it work properly?</p>
    <p>Thanks!</p>
    <p><img>http://typophile.com/files/2zfr728.jpg</p>
