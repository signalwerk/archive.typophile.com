    html: |-
      <p>It would be the mis-use of the features if they are causing a problem. I can't think how to test this, since the discretionary hyphen is inserted automatically. </p>
      <p>Except maybe... You could do this: put in a hair space following the letter that you want the hyphen appearing, and put in, by hand, a discretionary hyphen after the hair space, then force the work to break there by adding text in front, so the word has to break. If that works OK, then you know some silly sod has made a mistake with mark or mkmk in the font.</p>
