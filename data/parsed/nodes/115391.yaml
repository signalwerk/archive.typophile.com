    html: |-
      <blockquote><p>2. Inserting hair space after Combining Acute Accent doesn't allow to hyphenate the word:</p></blockquote>
      <p>As Frode said, perhaps... </p>
      <p>I was suggesting this as a way to debug, to see if mark or even mkmk was somehow attached to the discretionary hyphen. Adding the thin space blocks the character sequence with the U+0301 accent, putting in a manual discretionary hyphen (in InDesign) should allow the word to break there -- within InDesign, of course. But it seems InDesign will not break after white space, in spite of the discretionary hyphen.</p>
      <p>But this is the build forum, and you maybe have a font editor?  If so, debug as you would anything -- my way is to add one instruction at a time until you find the problem.</p>
