    <p>I designed this retro looking sans (all caps) for a logo of a client of mine, now i'm trying to extent that in to a usable font.</p>
    <p>i'm not to bad at spacing loose words, but doing it in Fontlab with the space before and after is confusing, i have been at it for a wile, but i just don't get it, i'm doing something wrong.</p>
    <p>so please could someone point me in the right direction, and be free criticise the design</p>
