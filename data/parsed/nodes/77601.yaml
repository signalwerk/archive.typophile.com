    html: <p>You don't have to limit the use of contextual lookups to features that are defined as 'contextual'. You can freely use contextual lookups in any feature if it makes sense to do so. Some of my Stylistic Set features in the MS Gabriola font include both non-contextual and contextual lookups, because there are some contextual substitutions that are normative to the particular stylistic variation.</p>
