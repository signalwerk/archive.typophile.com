    html: |-
      <p>&gt; what’s the reason</p>
      <p>Historical (the early OpenType specs assumed that certain lookup types would be tied to certain features). The implementational policy of the major text engine vendors proved that this was an unnecessary limitation. Currently, the implementational suggestions in the OpenType spec for certain features can be treated as "use this if you don't want to think too much".</p>
