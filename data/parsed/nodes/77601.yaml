      <p><cite> You can freely use contextual lookups in any feature if it makes sense to do so.</cite></p>
      <p>I suppose this is equally valid for multiple substitution lookups (Ä → Ae)? If so, what’s the reason for recommending the tags to be used with one certain lookup type in the Open Type Layout Tag Registry?</p>
