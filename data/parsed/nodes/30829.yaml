  html: |-
    <p>I walk outside and the snow settles betwen the bricks, describing a million perfectly white capital “I”s, with gorgeously subtle serifs.  Each of them unique and yet they go together.  </p>
    <p>I was playing hockey this morning - and every single cut in the ice felt like lettermaking, lots of “c”s and “o”s and “u”s.</p>
    <p>The branches in the park nearby have delightfully light “fs” with sharply invividualized flags, and “ts” with the wispiest of crossbars.</p>
    <p>And so on....</p>
    <p>Is this a normal reaction to visiting this site and spending time with books on typeface/typography?  </p>
    <p>Anyone else experience this?</p>
    <p>I wonder if the alphabet came from observing nature?  I remember Robert Graves claiming that the letter “v” came from watching geese. :-)</p>
