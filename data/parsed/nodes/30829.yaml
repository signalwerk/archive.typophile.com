      <p>Yes. I’ve seen it mentioned here and there among posts, or at least hinted at. It is perfectly normal. Okay, I don’t really know if it is really “normal”, but it happens. The shapes of the letters are very powerful, and the most ungainly are no accident. When you’ve got them on your brain, their ghosts appear everywhere.</p>
      <p>The rest of the time, I think people seem to get sucked into consiously IDing and analyzing the typeface choices of others around them. I was flipping through some CDs, and thinking, “Why don’t the labels use more hand lettering?”</p>
