    html: <p> &gt; I’m posting the completed lowercase set before <br><br>Good idea — caps are secondary anyway — numerals tertiary. <br><br>First of all, the rounded form isn’t just “easier on the eyes”, it seems much more authentic too. So that’s what I’m looking at. What I see is that it works quite well, I’m just unsure about the “downhill”s on the “f” and “t”. And I agree with Stephen that there’s a problem with the “u”/”v”. What really needs the most work though are the “s” and “z”. <span class="caps">BTW</span>, I think you forgot the smooth the tail of the “j”. <br><br>hhp </p>
