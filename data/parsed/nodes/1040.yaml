  html: <p>Hello all — <br><br>My name is Andy and I’m currently a graphic design student at San Diego State University. I’m a big fan of the typophile critique discussion group and have been looking forward to posting a typeface of my own design for critique. <br><br>I’m a little bit eager to get some feedback on a face I’m currently working on, so I’m posting the completed lowercase set before moving on to ﬁnishing up the bits and pieces of uppercase and ﬁgures that I’ve started.  Please let me know what you all think. <br><br>When I started out this typeface, my intention was to create a simpliﬁed blackletter typeface that is able to be stenciled.  As you can see I have deﬁnately digressed from this original plan but it still hints to its calligraphic roots. <br><br>Thanks! <br><br><img src="http://www.typophile.com/forums/messages/29/1477.gif" alt="Stencil Fraktur"></p>
  html_clean: <p>Hello all — <br><br>My name is Andy and I’m currently a graphic design student at San Diego State University. I’m a big fan of the typophile critique discussion group and have been looking forward to posting a typeface of my own design for critique. <br><br>I’m a little bit eager to get some feedback on a face I’m currently working on, so I’m posting the completed lowercase set before moving on to ﬁnishing up the bits and pieces of uppercase and ﬁgures that I’ve started.  Please let me know what you all think. <br><br>When I started out this typeface, my intention was to create a simpliﬁed blackletter typeface that is able to be stenciled.  As you can see I have deﬁnately digressed from this original plan but it still hints to its calligraphic roots. <br><br>Thanks! <br><br><img src="http://www.typophile.com/forums/messages/29/1477.gif" alt="Stencil Fraktur"></p>
