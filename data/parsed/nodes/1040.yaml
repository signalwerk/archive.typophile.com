    date: 2002-06-09T20:41:00
    date_raw: 9 Jun 2002 — 8:41pm
    votes: null
    html: <p>Miles Newlyn's <a href="https://web.archive.org/web/20150124082735/http://www.emigre.com/dp/getfontpage.php?PSabR.html" target="_top">Sabbath Black</a> immediately comes to mind. <br>Yours is more distressed and uses simpler forms and I  <br>think that works well. Yes, the rounded edges are more  <br>appropriate for the theme, which I think of more as  <br>stamped and worn rather than stenciled. <br> <br>The 'u' and 'v' could use some more differentiation. <br>Note how Newlin adds a flourish to his 'v' and a foot <br>on the 'u' to make them distinguishable forms. <br> <br>Overall it's pretty cool and I can see it used in a variety  <br>of ways - both with the classic history in mind and in  <br>more grunge/punk DIY pieces. <br> <br>Stephen</p>
    html_clean: <p>Miles Newlyn's <a href="https://web.archive.org/web/20150124082735/http://www.emigre.com/dp/getfontpage.php?PSabR.html" target="_top" class="link-external">Sabbath Black</a> immediately comes to mind. <br>Yours is more distressed and uses simpler forms and I  <br>think that works well. Yes, the rounded edges are more  <br>appropriate for the theme, which I think of more as  <br>stamped and worn rather than stenciled. <br> <br>The 'u' and 'v' could use some more differentiation. <br>Note how Newlin adds a flourish to his 'v' and a foot <br>on the 'u' to make them distinguishable forms. <br> <br>Overall it's pretty cool and I can see it used in a variety  <br>of ways - both with the classic history in mind and in  <br>more grunge/punk DIY pieces. <br> <br>Stephen</p>
