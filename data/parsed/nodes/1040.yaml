    html: <p>Miles Newlyn’s <a href="http://www.emigre.com/dp/getfontpage.php?PSabR.html" target="_top">Sabbath Black</a> immediately comes to mind. <br>Yours is more distressed and uses simpler forms and I  <br>think that works well. Yes, the rounded edges are more  <br>appropriate for the theme, which I think of more as  <br>stamped and worn rather than stenciled. <br><br>The ‘u’ and ‘v’ could use some more diﬀerentiation. <br>Note how Newlin adds a ﬂourish to his ‘v’ and a foot <br>on the ‘u’ to make them distinguishable forms. <br><br>Overall it’s pretty cool and I can see it used in a variety  <br>of ways — both with the classic history in mind and in  <br>more grunge/punk <span class="caps">DIY</span> pieces. <br><br>Stephen</p>
    html_clean: <p>Miles Newlyn’s <a href="http://www.emigre.com/dp/getfontpage.php?PSabR.html" target="_top" class="link-external">Sabbath Black</a> immediately comes to mind. <br>Yours is more distressed and uses simpler forms and I  <br>think that works well. Yes, the rounded edges are more  <br>appropriate for the theme, which I think of more as  <br>stamped and worn rather than stenciled. <br><br>The ‘u’ and ‘v’ could use some more diﬀerentiation. <br>Note how Newlin adds a ﬂourish to his ‘v’ and a foot <br>on the ‘u’ to make them distinguishable forms. <br><br>Overall it’s pretty cool and I can see it used in a variety  <br>of ways — both with the classic history in mind and in  <br>more grunge/punk <span class="caps">DIY</span> pieces. <br><br>Stephen</p>
