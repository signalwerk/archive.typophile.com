    html: |-
      <p>From the era of phot0-composition lettering. This is a 19th century style that was usually called French Clarendon. A MyFonts search using the term<br>
      <a href="http://www.myfonts.com/search/tag%3A%22reverse+contrast%22/fonts/" rel="nofollow">Reverse Contrast</a> will show you some that are similar. The style is also lumped in with Wild West or Western. Also some at dafont in the Western theme category.<br>
      Don</p>
