    html: |-
      <div class="comment-spam-body"><p>Found an italic slope font where the letter forms, including the ear on g, are pretty close to the font in your image. It's <a href="http://www.myfonts.com/fonts/fontmesa/western-sky//" rel="nofollow">Western Sky</a> by Font Mesa. The term "Italian Slab" mentioned in the font info section was used in much the same way as French Clarendon to describe these reverse contrast fonts.<br>
      Don</p>
      </div>
