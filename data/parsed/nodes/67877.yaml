    html: |-
      <p>Neo Sans is not a free font, as you may have guessed from looking at sites that are selling it.</p>
      <p>Why do you need this font? If you really need it, you should be able to get your client or sponsor to pay for it and get it legally. If you only need a font that has the same feel, I'm sure you will be able to find free fonts, or fonts that you already paid for and are bundled with other software, that are similar enough for your needs.</p>
      <p>But if you are studying for university entrance examinations, I can't imagine why you would really need this font. Don't you mean you just really want the font? There is a difference between needing and wanting.</p>
      <p><cite>If I buy and download only Neo Sans Regular, is it possible that I italicise and bold this font?</cite></p>
      <p>Some software will produce mechanical obliques (false italics) and bolds from the regular, but this creates visual distortions and is not considered professional.</p>
