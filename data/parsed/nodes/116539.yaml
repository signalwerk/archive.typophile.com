    <p>Hello everyone!</p>
    <p>My friend and I are starting a small design partnership called "Little Tipi Design Co.", and I'm tasked with creating our logo. I have the logo symbol already drawn out, but I'm struggling to pair it with a good typeface. I am currently using Clarendon, but I'm not convinced. I've attached a pic of what I have so far. What do you think of the current pairing? Do you have a better suggestion? Choosing typefaces has always been my weak point, so thank you so much in advance for your help!</p>
