    html: |-
      <p>I suggest you put aside the question of what type looks good with your artwork, and first answer what does your company do, who is your target market, and what unique value does your service provide?<br>
      To me, Clarendon says <em>we're strong, no-nonsense, and a little old-fashioned</em>. The use of all-lowercase, and the word "little" in the name, says <em>but we don't take ourselves too seriously</em>. The Native American symbol (possibly authentic) hints at a regional/folklore/ethnic specialty in the services you offer.<br>
      So for instance, if what you design is moderately-priced camping equipment, this logo is probably perfect the way it is. If what you design is e-commerce websites, you probably want something more sleek and modern, and that idea will guide not only your selection of type, but whether to capitalize, whether to leave the artwork in the center, or place it above/below the type, flush left/right, etc.</p>
