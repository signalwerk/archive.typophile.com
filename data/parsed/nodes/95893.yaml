    html: <p>First impression - decent but sterile with a not a lot to differentiate it from all the other fonts out there. The big question, and unfortunately one that I can't answer, is what do you want this font to communicate? Fun? Quirky? Cold? Precise? Haughty? Morbid? Easy? Simple? Plain? Complex? Right now it doesn't seem to have a voice and it leaves your creation lifeless in my eyes. But it has, I think, potential once you find out how or what its supposed to communicate. Hope this is helpful.</p>
