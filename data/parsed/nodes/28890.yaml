      <p>You obviously know how to make things look nice, but this falls into the trap common with design students (and design professionals) is that it doesn’t dig deep enough. Your decisions seem arbitrary and not rational.</p>
      <p>Dig deeper.</p>
      <p>The concept is there. A New York feel in the Bay area. Research. What makes New York, New York? What kind of typography is associated with New York?</p>
      <p>New York is very different than San Francisco. Make us <em>believe</em> we’re in New York.</p>
