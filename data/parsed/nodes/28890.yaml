      <p>Good call on using an extended font for the word “lounge” in the first of your new samples. The compressed, upright letters of your earlier versions visually contradict a literal meaning of the word.<br>
      The rotated “2” doesn’t really read in the negative form without being told it’s there. It’s a strong shape, but it isn’t communicating what it’s supposed to.</p>
