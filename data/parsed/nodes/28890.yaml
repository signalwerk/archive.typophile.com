      <p>I suppose I should of done a better job explaing myself. Your note of it hinting at an old East Coast bar is probably a good way of explaing the feel that I want to get. This is a makeshift Identity project for school. The establishment will be aged to fit like a high life New York (in opposition to its local San Francisco) esque bar, offering a taste of that sort of lifestlyle in a small eastbay community. This is one part of the logo, with various other marks as works in progress. </p>
