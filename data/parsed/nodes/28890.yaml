      <p>If you’re going to use type for the logo, it seems like it would be a good idea to not add an extra abbreviation. I don’t think most of these work very well, mostly because the type looks dated and more appropriate for something on the east coast. Unless this place is built into a Victorian, they just don’t work.</p>
      <p>The idea of breaking up two one two with ninety degree rotations is nice, but you’re breaking it up into two twelve with the numeric versions.</p>
      <p>If I was going to pick a favorite, it would be the middle-bottom. It’s not as dated as the serif designs, and it’s not as corny as the stepped design, but it isn’t especially compelling, either.</p>
