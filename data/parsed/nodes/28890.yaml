    html: <p>I wouldn’t over think this one, its just a bar. Go with an elegant 212 and if you have to use the word lounge make it small. This is a case where you aren’t really selling anything like food. Its just about atmosphere and that will be conveyed by the interior design more than any logo you could develope.</p>
