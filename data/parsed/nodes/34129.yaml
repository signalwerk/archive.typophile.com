      <p><em>I have taken over the project from someone else...</em></p>
      <p>In my experience, the source of this kind of problem is often someone else's bizarre work habits. Generate a font with what you have, open the font in FontLab, and re-save it as a .vfb file...this OUGHT to get rid of the voodoo the previous artist put into the file.</p>
