      <p>Ruth,</p>
      <p>it's practically featureless and needs a strong visual/graphic motif to go with the type---something to engage the imagination and get the point across. If it's a vegetarian restaurant maybe a ghostbusters-style circle with cross thru it and a cow inside the circle, or something like that.</p>
      <p>Consider using a softer-edged font. Vegetarianism is tantamount to humanism (human respect for animals), so how about using a Venetian (Benbo, High Tower, Jenson etc) and lower case letters, or even a script type.</p>
      <p>Color would help make it more attractive too.</p>
      <p>The by-line needs a hyphen: "A meat<strong>-</strong>free dining experience"</p>
      <p>j a m e s</p>
