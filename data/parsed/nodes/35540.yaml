      <p>Being a hipster myself (I've tried to get away from it, but I'm too ironic...), I can appreciate the stark minimalistic logotype you display. But I agree with the masses, I wouldn't want to eat there.</p>
      <p>I think when I see the word "Animalia" I think of some flowery design with things spilling out, and lots of color. That may be because I am reminded of Fruitopia, that fruit drink, and their logo. Here's an example: <a class="freelinking external" href="http://en.wikipedia.org/wiki/Image:Fruitopia.jpg" rel="nofollow">Link.</a></p>
      <p>Perhaps it also sounds like Cornucopia, which is so often depicted as a cone flowing over with food.</p>
      <p>If the name of the restaurant was "Däs Animal" or something like that, I'd totally see it. But Animalia? That's not a minimalistic image right there.</p>
      <p>-Andrew Welfle</p>
