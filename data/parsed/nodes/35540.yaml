      <p>Love that idea Lex!</p>
      <p>Animalia set in type that simulates stark meat packaging or cattle branding doesn't strike me as particularly ironic. I suppose if the word were VEGETABLE and it looked like meat branding, that would have some inherent irony. But since the name is ANIMALIA and the type looks like something on a package of MEAT, there's no inherent conflict that would present itself ironically. Actually, they kind of look like they belong together.</p>
      <p>Branding vegetables, creating an animal out of vegetables or broccoli ... those are ideas that are interesting because of the juxtaposition. They also truly underscore the concept of the restaurant. And by the way, they're pretty ingenious too. It's that kind of intrinsic counterpoint that could make this a logo people will remember and enjoy. I believe such a mark would do a better job of selling the restaurant and bringing people in. I believe that on a subconscious level an intelligent, ingenious design causes people to raise their expectations about the whole experience, and it gives them a helpful mnemonic by which they can hang on to the memory in their busy brains.</p>
      <p>There's something very pleasing about discovering a visual irony ... or a vegetable irony, as the case may be. I could just hear one of my vegan friends saying, "Lets go to that restaurant with the broccolli animal thing. That was cool." I cannot imagine someone saying, "Let's go to that restaurant with the really stark type that says Animalia. Just looking at that logo makes me smile and feel happy. It's very wecoming"</p>
      <p>I also agree with James that there might be a better approach than something so sterile. In just a few minutes he put together some rather nice treatments that have personality and warmth. Very thoughtful and kind of you, good man. If you're not going to have a pleasing ironic interplay, at least make the customers feel warm, welcomed and enticed when they see the mark.</p>
      <p>If you want to stick with the stark, cold MEAT-like labeling motif, in my view you're going to have to add something to it to make it ironic. Otherwise I think it just looks cold, flat and not particularly relevant. </p>
      <p>Anyway, It's really fun to read everybody's opinions and see their examples. That's why I love this place. You learn. You meet really smart people who provoke thinking. And you get to bathe in gorgeous fontrocities. A delightful way to spend an evening indeed.</p>
