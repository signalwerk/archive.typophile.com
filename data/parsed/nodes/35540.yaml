      <p>First, I question the use of hipster and vegetarian together; it's not a clear message. Are you saying hipsters are now vegetarians, or it's hip to be a veg, or it's only a place for vegetarians who are hipsters, or you want to create a cool veg eatery that has some style to it?</p>
      <p>As a vegetarian, if someone told me it was a 'hipster vegetarian restaurant' I'd probably be immediately turned off. In my impression hip no longer is what's new and cool, but a bunch of annoying young people wearing bad neon clothing, and ridiculous fashion that would otherwise usually be left on the runways of fashion shows.</p>
      <p>So, that being said, I don't believe that mark is the right fit. Personally, I find it plain and if I was looking for my restaurant to stand out from the crowd I'd probably a more daring feel as opposed to conservative.</p>
      <p>--</p>
      <p>In response to aluminum's statement about why people don't eat meat – I personally don't for health reasons, and my wife doesn't for environmental reasons. Neither of us are non-meat eaters because we think it's about animal rights or a statement against cruelty to animals. </p>
      <p>Just an observation that the name might not always connect with your target audience either. It's also slightly hard to pronounce IMHO.</p>
