    <p>This is a work in progress (maybe, depending on the feedback) for a hipster vegetarian restaurant. I have designed a logo that will be simple and sleek, as the restaurant will have strong graphic treatments and I didn't want the composition as a whole to be too busy. The logo will probably be reversed out of the images. I have included a variation on the logo, the one with the solid black box bordering, and then the second logo with lines above and below. The third logo includes the by-line of the restaurant, I assume to be put on the restaurant sign. Let me know what you think, changes, critques etc. I really would appreciate feedback so as to learn as much as possible!</p>
