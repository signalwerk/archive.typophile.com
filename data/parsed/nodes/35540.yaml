      <p>This is not a critique, more just a comment in general.</p>
      <p>My favorite logos are the ones that have an idea to them. A concept that reinforces the message of the brand. There are plenty of lovely logos that are just a word set in type—and some do a fantastic job of setting a mood or personality. For example, I happen to like the Veer logo over there on the right of the page. But I believe that a logo with a strong, ingenious idea is always the most memorable. I don't mean an idea which overcomplicates the logo—simplicity is key. I mean an idea which provides the viewer with both a visual discovery and a mnemonic device. There is something wonderfully satisfying about seeing a logo which makes you go, "wow, that is really clever/smart/unexpected."</p>
      <p>To me, as simple and strong as your logos are, they are merely a typeset word, and heck, a lot of people can do that. I know, there's a lot of logos that are mere words out there. I think that's because creating a logo with a real idea is so bloody hard.</p>
      <p>Just a thought. ;-)</p>
