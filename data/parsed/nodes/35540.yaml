      <p>Sorry folks, I was in a hurry when posting and failed to explain my point properly. What I'm driving at is this: I honestly think a plain sans serif is too sterile and a far from ideal type for a restaurant, as it lacks organic qualities. If the brief feels instinctively off-target and the specs appear set to produce an ineffective design I have no qualms about bucking the specs.</p>
      <p>You shouldn't either. If it doesn't make sense, try something that does.</p>
      <p>Using a Venetian type for this logo is an exaggerated alternative. Here are some mock-ups using types closer to the original brief:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/animalcomp1_6218.gif"></div><p></p>
      <p>Serifa black, plus Serifa regular for the by-line. Graphic effect without the sterility of a sans serif.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/animalcomp4_4313.gif"></div><p></p>
      <p>Serifa bold caps. Effect as above but the capitals make it less endearing. Some patrons might think they're being shouted at.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/animalcomp3_5267.gif"></div><p></p>
      <p>Clarendon black plus Clarendon regular for the by-line. The bracketed serifs and tails on the a's make it much more organic. But it's still graphic in effect. Dectractor---Clarendon is widely used and may not stand out enough for some patrons.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/animalcomp6_4300.gif"></div><p></p>
      <p>Chianti black plus Chianti bold for the by-line. Closer to a sans serif without being one. Not as graphic in effect but friendly and organic at a glance. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/animalcomp5_6232.gif"></div><p></p>
      <p>Chianti weights as above but all capitals. A more graphic effect from the same type. If it must be done with all caps this one avoids the sterile quality of a straight-laced sans. </p>
      <p>j a m e s</p>
