    <p>ALAS. Is as you read an international gastronomy club.  <br>Their subject is rather various. They don't just read or write recipies.  <br>They are a kind of gastronomy scientists (that's why the glasses  <br>on the frying pan).  <br> <br>On the first image you see the finalists and on the next the logo  <br>they choose, but they are not sure about the typeface.  <br>I am pretty sure that the most of you are tired of Helvetica, as I am.  <br>Beyond that I like  the combination of the clarity and wideness  <br>of Helvetica with the forms of the symbol I create. <br> <br>~What do you think? <br> <br><img src="http://www.typophile.com/forums/messages/29/12378.gif" alt="showcase"> <br><img src="http://www.typophile.com/forums/messages/29/12379.gif" alt="logo"> <br></p>
