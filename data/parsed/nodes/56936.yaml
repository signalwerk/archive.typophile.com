      <p>I'd echo what Will said. Moreover, we'll even hyphenate the last word of a paragraph, unless the customer specifically prohibits it. If they prohibit it, they pay the price of gappier word spacing.</p>
      <p>Our rule is that the end of a paragraph must be visually longer than the paragraph indent of the following paragraph, again as Will said. You can find hyphenated words that have more characters taken down than two words, e.g., "of it." If I had to, I'd break "preconceived;" "-conceived" is significantly longer than any reasonable paragraph indent.</p>
      <p>There are places where I'd work real hard to avoid this -- right before a subhead, for example, especially a centered one. </p>
      <p>* * *</p>
      <p>I keep saying it, but there are always compromises to the "do nots." Usually, they come out of "tight and even word spacing." It isn't that comps are lazy, they are honoring the more basic "do" of tight &amp; even word spacing. As always, there are those who speculate and theorize, and those of us who work for a living.</p>
