      <p>Ken, with the ‘Keep’ options, one can address a different problem: avoiding orphans and widows, i.e. keeping the first/last <em>n</em> lines of one paragraph within the same column or frame. (It’s not a very sophisticated approach, but it might be of value in some situations.)</p>
      <p>Bowerbird, your sarcasm aside, please define ‘ugliness’. A single word in the last line of a paragraph is often the lesser evil, depending on column width, word length/language etc. If there was an automatism, it better should be very intelligent – and customizable.</p>
