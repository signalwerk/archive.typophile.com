      <p>I can add nothing to the InDesign discussion. </p>
      <p>But I am curious to know why a single word on a last line of a para is considered undesirable. I have never felt this to be a bad thing except on some occasions during my stint as an advertising type director. Most book typographers and compositors I've worked with do not see this as a thing to be gotten rid of. At a given size and measure and face, we will often be faced with a single-word exit line on a para. I do not like to see very short single words in that position, for sometimes they can be shorter than the para indent, and that does look bad. Otherwise, let them flow.</p>
      <p>And what should be done about an exceptionally long word in such a position? How should, say, the word "typographically" be handled if it is the last word in the para and starts a line?</p>
      <p>powers</p>
