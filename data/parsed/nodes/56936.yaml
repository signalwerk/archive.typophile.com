    <p>Hi,<br>
     I have a problem with (and now I try to explain it in my best Englisch) a single last paragraph word on a new line. I work in InDesign CS3 and I don't want that the last word of a paragraph starts on a knew line. I now the ways of correcting this manually, but I am looking for a way to prevent this. Any one a good idea /tip?</p>
