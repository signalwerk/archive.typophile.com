      <p>Alas, P.P. GREP is kind of magic but your expression is not valid (non-GREPpers are excused from reading on). The lookahead stuff does not allow variable lengths.</p>
      <p>You need the 2nd part to be variable;</p>
      <p>Search: \s(\S+)$</p>
      <p>Replace: ~s$1</p>
      <p>might work -- but again, it'll happily swallow everything at the end of a line, no matter how long the word.</p>
      <p>Pers'nally, I like to do this stuff by hand, so I can choose between either running in (to gain a line on a page), or let it run out with a very modest tracking, making the last line longer.</p>
