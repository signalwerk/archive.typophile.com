      <p>Hallo Hans,</p>
      <p>you can use GREP to solve this issue.<br>
      In the search/replace window (in InDesign CS ≥3), there’s a tab called ‘GREP’. Search for <code>\s\w+?\W+?$</code></p>
      <p><code>\s</code> is a placeholder for ‘any space character’. (That’s the last word space in your paragraph.)<br>
      <code>\w+?</code> stands for ‘one or more word characters’. (Matches the last word.)<br>
      <code>\W+?</code> is for ‘one or more non-word characters’: it matches the dot, but also the question mark, exclamation mark etc. Why ‘one or more’? Because your paragraph could end with a closing quotation mark <strong>and</strong> a punctuation mark. Maybe there’s even an additional superscript character, indicating a footnote.<br>
      The final <code>$</code> stands for: ‘look at paragraph endings only’.*</p>
      <p>Now you can easily add the ‘no break’ property (directly or via character style) to the hits.<br>
      F</p>
      <p>*) Maybe there’s a more elegant way; I’m still getting used to GREP. Love to hear ideas.</p>
