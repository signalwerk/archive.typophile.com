      <p>will said:<br>
      &gt;   But I am curious to know why a single word<br>
      &gt;   on a last line of a para is considered undesirable.</p>
      <p>it's only undesirable if it's ugly.</p>
      <p>and, for the most part, it's ugly if it's fairly short...<br>
      first of all, that makes it look stubby, by definition.</p>
      <p>what's worst is when it's about the same length as<br>
      (or shorter than) the paragraph-indented next line,<br>
      where it then causes some attentional confusion...</p>
      <p>there might be other cases where it's ugly too, but<br>
      i trust that you will know them when you see them.</p>
      <p>&gt;   Most book typographers and compositors I’ve<br>
      &gt;   worked with do not see this as a thing to be gotten rid of.</p>
      <p>in the situations i outline above, they would/should.</p>
      <p>&gt;   At a given size and measure and face, we will often<br>
      &gt;   be faced with a single-word exit line on a para.</p>
      <p>that's the reason you use multi-line breaking routines,<br>
      to avoid the situations where you'd get such ugliness...</p>
      <p>&gt;   I do not like to see very short single words in that position,<br>
      &gt;   for sometimes they can be shorter than the para indent,<br>
      &gt;   and that does look bad. Otherwise, let them flow.</p>
      <p>ok, so we're in agreement.</p>
      <p>&gt;   And what should be done about an exceptionally long word<br>
      &gt;   in such a position? How should, say, the word “typographically”<br>
      &gt;   be handled if it is the last word in the para and starts a line?</p>
      <p>that's fine, typographically.</p>
      <p>but a one-word line in the _middle_ of a paragraph can be bad,<br>
      if you do justification, because there's no place to put the slop.</p>
      <p>if you're hyphenating at the same time -- with a short measure,<br>
      and justification, you'd better be hyphenating too -- you'd then<br>
      try to hyphenate that baby across two lines, to get some spaces.</p>
      <p>-bowerbird</p>
