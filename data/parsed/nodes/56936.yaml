      <p>You have a point, Will.<br>
      The GREP query can be refined to account for that:<br>
      <code>\s\w{1,4}\W+?$</code></p>
      <p><code>\w{1,4}</code> is for ‘one or up to four adjacent word characters’, or, in plain English, ‘words with less than 5 characters’.</p>
