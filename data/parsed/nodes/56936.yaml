      <p>I think most general rules or thoughts about this have all already been mentioned:<br>
      When working with indents, the ending line better should be longer than the indent below.<br>
      In justified setting, the most important aspect is even spacing. Applying a ‘no-break’ attribute to the last two words might counteract that goal.<br>
      Certain circumstances (e.g. before subheads, as Charles mentioned, or your example with repeating words; ‘zijn’) are especially unfortunate and might demand a workaround.<br>
      In ragged-right settings, things can be handled more permissively. If it’s the last paragraph of the column or page, I try to achieve an ending line with more than one word, ideally filling half the column width or more.</p>
    html_clean: |-
      <p>I think most general rules or thoughts about this have all already been mentioned:<br>
      When working with indents, the ending line better should be longer than the indent below.<br>
