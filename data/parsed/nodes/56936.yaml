      <p><em>...inane editor...</em></p>
      <p>More likely a designer/art director who breaks up the rigidity of the grid by having an image straddle a gutter. So, not so much an image that is a fraction of a column, but an image that is one and a bit columns, or two and a bit columns, etc.</p>
      <p>It's not unusual, given the ease with which layout applications can cause text to wrap around a clipping path or picture box.</p>
      <p>And not just an image. It could be a pull-quote that's being wrapped around. Or a drop cap.</p>
      <p>It's a design issue for any kind of publication that has justified body copy, but of course, if you're going to wrap text round an image, you should be extra careful with how it breaks.</p>
