      <p><cite>I use left alingment and I like regular hyphenation. In my opinion the right gap/indent is to big when a single word on a last line is to short.</cite></p>
      <p>Ah, if you're setting flush-left/ragged-right text, then you can try applying InDesign's "Balance Ragged Lines" command (found in the menu off the Paragraph palette, or the menu off the Control panel when the text tool is active). </p>
      <p>As the name implies, this command only takes effect when the text is unjustified.</p>
      <p>You may or may not like the overall results for the paragraph, but it will fill out a disproportionately short last line.</p>
      <p>-- Kent.</p>
