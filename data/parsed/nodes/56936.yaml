      <p>I've often found that a very short last word looks bad, particularly if it is shorter than the following paragraph indent. </p>
      <p>The problem with a "no last word on a line" rule, whether done manually or by computer, it that there are exceptions. If the last word is exceptional long, it should be able to stand alone. And sometimes there will be two or three two letter words, and they can look bad. The computer, or the rule, will not deal with these.</p>
