    html: |-
      <p><cite>what do you do when the last line of a paragraph is flush left with “normal” word space widths, and just about every other line has much wider word spaces? Don’t you think that looks odd?</cite></p>
      <p>Yes, you're right. And it does happen. The frequency depends on the text of course, but also on the layout program. For instance, I find that InDesign does this -- and other infelicities -- if (1) you use the paragraph composer, and (2) you don't get good values for min-ideal-"not honored" (aka max) spacing. The "best" values can change a bit with the size of the type and the measure. </p>
      <p>Not to pick on InDesign, TeX had a its oddities too. The penalty for increasing the word space was the same as for decreasing the word space, on a percentage basis. Well, using real numbers, if you set the minimum spaceband to 180 and the maximum (which TeX somewhat honors) to 400, using any value other than 290 as "ideal" (halfway in between) would skew the results, based on change penalties computed as a percentage. But 290 is too big; 240 is more like it. Since using TeX with these parameters "encouraged" adding space to justify, we wrote another routine adding a demerit for setting more lines that absolutely needed in a paragraph. The value you used for this demerit would control the spacing behavior.</p>
      <p>Too much information, I know. The point is, for setting extended text, you have to understand how your layout program works, &amp; adapt it to your needs/desires.</p>
    html_clean: |-
