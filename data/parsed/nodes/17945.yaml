      <p>Yes... but what are you looking for in particular?</p>
      <p>That's like saying, "Do you know any recipes from France?"</p>
      <p>Here's a link to one of many image databases that contain visuals of many period posters, ads and publications.<br><a href="http://ahds.ac.uk/visualarts/" target="new">AHDS Visual Arts</a></p>
