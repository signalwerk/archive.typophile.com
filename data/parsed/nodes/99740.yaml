      <p>** Hey, check <em>this</em> out:<br>
      <a href="http://typophile.com/node/99612#comment-538227" title="http://typophile.com/node/99612#comment-538227">http://typophile.com/node/99612#comment-538227</a></p>
      <p>BTW have you actually been reading Typedrawers? Can you really claim adding those meager (and often passive-aggressive) conversations here would revive this place? Pure delusion. I won't let you use me as a scapegoat. Instead try to help by being pro-active.</p>
      <p>hhp</p>
