    <p>Hi guys!</p>
    <p>People told me if there is a place, where I can find help to figure out fonts - then its here. I really hope you can help me.</p>
    <p>I am looking for two fonts from an second world war propaganda poster. Can you recognize them? Or tell me free fonts that are looking very close to them?</p>
    <p>That would be awesome!</p>
    <p>Thanks in advance for your help.</p>
    <p>Cheers,<br>
    PauloCoe</p>
