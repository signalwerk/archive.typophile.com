    html: |-
      <p>First of all, I want to sincerely thank the several posters that have stood up and challenged the ugliness of Hrant the Bully in this thread.</p>
      <p>Jeff - you did nothing wrong. You were - God forbid - helpful.</p>
      <p>PaulCoe - as an artsit (per your profile) I'm sure it wouldn't bother you for someone to take your art without paying, right? Not right? Well then, why is it OK for you to take a commercial font without paying - and then offer it via a link for lots of other folks to steal?</p>
      <p>Hrant the Bully - I do understand the underlying frustration inherent in your agenda here. As one of the original moderators of MyFonts' What The Font forum, I've been through several stages of that frustration. The first was angrily confronting posters who linked to illicit download sites for commercial fonts. Skipping through several stages in between (because you wouldn't understand) we arrive at two years ago, when there were more moderators, several of which (not I) were accosting the aforementioned posters of bad links with aggressive confrontation and ugliness - not unlike your own. After awhile, the moderators' official MyFonts contact (a great, easy-to-talk-to guy) asked those aggressive mods to tone it down. Why?</p>
      <p>Well, the main point was that it made the forum a <em>far</em> less friendly place. That's a point, it seems, that you could care less about ... but are you <em>hearing us</em> that it <em>does</em> matter to some of us? Secondly (I was, at the time, amazed to hear this), MyFonts does not consider those renegade posters a threat at all! Those posters come to MyFonts with no intent of paying for a font - and no amount of berating will change that. Education <em>might</em> later on change their view (I verbosely tried that for a couple of interim years), but only for that single poster.</p>
      <p>Therein lies the absurdity of your agenda here, Hrant the Bully: Your extremist approach accomplishes <strong>absolutely nothing</strong> toward your goal! The willfully defiant are more defiant and the clueless (the vast majority of those you berate) carry on in their cluelessness. Lack of awareness about fonts and the people who make them is one of the most arcane and negligible sins of this world. As such, it's one of the most forgivable. To make clueless transgressors the target of your bile is sad.</p>
      <p>&gt;&gt;Yes, like I said: an honest mistake. I do however consider it a mistake to provide such help to a "stranger". Because I suspect ~90% of font IDs lead to a font being pirated.&lt;&lt;</p>
      <p>You contradicted yourself there. According to you, Jeff made a mistake by providing help to a "stranger".</p>
      <p>Suspicion and presupposition should guide our helpfulness? Ah ... no. I doubt anyone here would agree with you. That's the equivalent of guilty until proven innocent - which is exactly what you've been throwing around here lately.</p>
      <p>&gt;&gt;It actually wouldn't be so bad if some of the people asking for IDs participated in actual discussions about fonts. But they almost never do; if you look at their pattern of behavior it's 95% hit-and-run. &lt;&lt;</p>
      <p>WHAT???  Posters who have their font identified and don't stick around to discuss it??? You're kidding, right? Well, no - you aren't kidding. You actually expect every poster asking for help here to be a typophile (type lover). What planet do you live on, Hrant the Bully? Some posters actually take the stated purpose of this forum at face value -and not for anything else: "Need to know what font it is? Post it here."</p>
      <p>&gt;&gt;Even most of the long-term members who regularly provide type IDs* rarely do anything else here - it's like some dumb hobby.&lt;&lt;</p>
      <p>Like a bully, you've just insulted most of the helpful identifiers here - almost all with a pirating detestation near on par with your own. The difference is that we are realists and not unrealistic extremists with an unrealistic agenda like yourself.</p>
      <p>Finally, I only can only best copy/paste Jan's simple post:<br>
      "Helping Typophile, Hrant?<br>
      You gotta be kidding."</p>
      <p>Precisely. The poster flaunting his/her lawlessness? Many of us censure him/her (On MyFonts, a steal-the-font link is very soon seen by a moderator and edited out. Here, e-mailing a person with authority to do so is a clunky, slow solution). The clueless poster (the vast majority)? Education might help, but confrontational anger only irritates. And the next clueless poster? They've almost certainly read none of what has come before.</p>
      <p>So what, then, is your ugly-gatekeeper ranting accomplishing? Nearly nothing. You accomplish nothing against the posters you don't like. New posters you don't like (apparently any "stranger") surely haven't read prior posts and are at high risk for pissing you off. The <em>only</em> thing you are accomplishing is making this forum an ugly, unfriendly place. How absurd an outcome of an agenda is that?</p>
      <p>&gt;&gt;He just strikes me as the sort of user that should be shunned.&lt;&lt;</p>
      <p>J. Edgar Hoover. Speaks volumes to Americans. I'm sorry I'm not learned enough to bring up an international equivalent (if one exists).</p>
