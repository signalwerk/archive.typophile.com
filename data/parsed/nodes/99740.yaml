      <p>Yes, like I said: an honest mistake. I <em>do</em> however consider it a mistake to provide such help to a "stranger". Because I suspect ~90% of font IDs lead to a font being pirated. And when the person admits to it (especially when he points to the source!) that's about as actionable as it gets. One warning. Second time, close the account. Anything less makes Typophile look like Mos Eisley.</p>
      <p>It actually wouldn't be so bad if some of the people asking for IDs participated in actual discussions about fonts. But they almost never do; if you look at their pattern of behavior it's 95% hit-and-run. Even most of the long-term members who regularly provide type IDs* rarely do anything else here - it's like some dumb hobby. Helping people? Hey what about helping the place that's letting you help people not become some bottom-feeder** heaven...</p>
      <p>* We even have one guy who sells a piece of software that helps you find free "alternatives"...</p>
      <p>** <a href="http://typophile.com/node/99624" title="http://typophile.com/node/99624">http://typophile.com/node/99624</a></p>
      <p>Don't get me wrong, I'm not some crusader out to stop piracy. Mostly this is about helping Typophile.<br>
      <a href="http://typophile.com/node/99675#comment-537961" title="http://typophile.com/node/99675#comment-537961">http://typophile.com/node/99675#comment-537961</a></p>
      <blockquote><p>Simply send the URL to the copyright holder.</p></blockquote>
      <p>And TypeSnitch.</p>
      <p>And of course remove the reference here! Even if it's a broken link. Teuton is in fact on that pirate site.</p>
      <p>hhp</p>
