      <p>At some point I’d like to compose a small piece of writing for people who continually ask for type IDs. Where it goes, I don’t know. I’m sure you'll agree with this one hrant. Something to the effect of:</p>
      <p>“With the exception of people using software to identify fonts, you are asking older people who were in the field years before computers existed. The only way they learned how to play “name that font” was by <a href="http://en.wikipedia.org/wiki/Rote_learning" rel="nofollow">rote learning</a>. Sheer practice. Page after page, year after year. They never would have acquired this skill if they constantly asked others to do it for them. If you want to develop this skill, the only way is to practice. So buy a big-ass font book, and look at it every day with your morning coffee and evening pint. Remember — If you give a someone a fish, you feed them for a day; if you show someone how to catch fish, you feed them for a lifetime (Chinese proverb). </p>
      <p>Addendum: I can easily scare away a first date by pointing to a font every 5 minutes and telling her what it is. Pub sign, drink menu, menu, coaster, poster, katsup bottle, table advertisement, bathroom doors, desert menu, taxi door… If I made it that far, I’m either getting into that cab, or going back into the pub alone to have a few more pints ;)</p>
