      <p>Wow: quite a dust-up. No matter which side of the fence you sit on, it is abundantly clear that this site is seeing more and more traffic from people who don’t even have the common courtesy (or is it simply common sense?) of reading the forum headings before posting their font ID requests. </p>
      <p>The font ID service provided here is free—unlike all of the other ad-supported sites—so, if we get more than our fair share of freeloaders, what else can we expect? Doesn’t EVERYONE deserve EVERYTHING they want?</p>
  - id: 538711
    user_id: 57325
    user_name: R.
    user_path: null
    date_raw: 18 Jan 2013 — 5:40am
    date: 2013-01-18T05:40:00
    votes: null
    html: |-
      <p>I think most of us agree that it does not get us anywhere to berate people based on their presumptive attitude towards buying fonts. You also can’t walk up to every man you see and start interrogating him—So, where have you been last night?—just because a man is statistically more likely than a woman to be a criminal. Well, you can do this, but I don’t think it would contribute anything to improving society, just like pirate hunting is not effective in terms of improving Typophile. And it seems sufficient to me that the type ID board is separated from the other boards. You could ask Punchcut to devise an entry page that gives you two options: ‘I need a font ID’ (in large type) and ‘I want to participate in general discussions’ (in smaller type). It’s (unfortunately?) not very likely that they will implement something like this.</p>
      <p>One more thing: It might help to draft a concise explanation why pirating fonts is bad, written in layman’s terms. You could link to such a pamphlet when users seem to be misinformed about font licensing (which covers a considerable share of those asking here and elsewhere). I think that’s the only thing you can do: throw out those who openly brag about their collection of pirated fonts, try to educate those who don’t know what they are doing (without playing the schoolmaster) and live with the rest.</p>
