      <p>MyFonts is a business. Typophile is not. Your brand of "friendly" I see as a disease of contemporary Western society, and something that's often subverted to make our masters richer. What you describe as "standing up to a bully" I instead see as blindly defending a self-centered, shallow, hedonistic philosophy.</p>
      <p>The only reason certain others who think like me (I am not alone) aren't fighting like me is that they've given up on the situation. I might too one day. But not yet.</p>
      <blockquote><p>Your extremist approach accomplishes absolutely nothing toward your goal!</p></blockquote>
      <p>You haven't seen extremism.</p>
      <p>And I'm a pragmatic person, so I'm not yet sure it's wasted effort. It's not impossible that Typophile might one day have moderators who are more strict with people who clearly have no respect for type design, and the confrontation I'm engendering might be a catalyst. The main impediment to this is simply that Punchcut is sadly 99% hands-off now (and really, it's always been pretty hands-off).</p>
      <p>Your intentions might be good, but your method is fatally flawed. You (plural) are making this place worse, in terms of how it can best serve typography - as opposed to merely serving individuals who only ever want vapid font IDs (and those who consider IDing fonts as a big accomplishment).</p>
      <p>Since there's virtually no interaction between people who ID type and people who discuss type, I reiterate my suggestion of separating the two parts as much as possible, so that people who care about type don't get upset (often leaving) and people who don't want to be bothered by this can carry on with their lifestyle. My own desire is not at all to change anybody's personal beliefs.</p>
      <p>hhp</p>
