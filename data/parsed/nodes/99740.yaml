      <p>Glad to hear you don't condone it. But sometimes you're an -unwitting- accessory to it, and I'm hoping that doesn't feel good. And most of all, it would be useful if you -and many others- would jump in to complain when you see a really bad case. Not fighting for something makes it weaker. Feel free to be more tentative than me, but don't be afraid of driving the worst offenders away. You think I'm too aggressive - I think you're too passive.</p>
      <p>&gt; <a href="http://typophile.com/node/99624" title="http://typophile.com/node/99624">http://typophile.com/node/99624</a></p>
      <p>What more proof do you need?! I have to say here that to me your silence there is in fact part of the problem I'm talking about. Certain people need to be driven away - or at least isolated from the parts of Typophile that actually value typeface design. You really think the best thing this place can be is a type ID swamp?</p>
      <p>I don't think your perception of Typophile -and the evolution of general online participation*- is realistic. I still see more typographic value on Typophile than anywhere else. As for the people who left (in actual effect far fewer than you imply**) perhaps they weren't meant to be discussing things in the open. Maybe they want a place where everybody is friendly to them. That's what cocktail parties are for.</p>
