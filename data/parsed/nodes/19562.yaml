    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/13962" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Concepts</a>&nbsp;:&nbsp;Legibility</strong></p>
    <p>“Legibility” is based on the ease with which one letter can be told from the other. “Readability” is the ease with which the eye can absorb the message and move along the&nbsp;line.</p>
    <p>—from ‘Types of Typefaces,’ by J. Ben Lieberman,&nbsp;1967</p>
    <p>Whether this distinction reflects an underlying difference in reality is&nbsp;controversial.</p>
    <p><strong>Articles:</strong><br><a href="http://fontfeed.com/archives/fred-smeijers-on-legibility/">Fred Smeijers on Legibility</a><br><a href="http://www.fonts.com/aboutfonts/articles/typography/legibility.htm">Allan Haley, “It’s About&nbsp;Legibility”</a></p>
