    html: |-
      <p>There were quite a few "photo alphabets" shown from time to time in older issues of <em>U&amp;lc</em>, several of which were done by Herb Lubalin. But these were essentially pictures of found articles resembling letterforms. If I can find one of these articles I'll try to post samples. As for an actual typeface, I don't recall a font using photos of handtools.</p>
      <p>There are a few type designs using tools such as <a href="http://www.myfonts.com/fonts/adobe/toolbox/" target="new" rel="nofollow">Toolbox</a> by Brian Strysko.</p>
