    <p>Hello</p>
    <p>I seem to recall a typeface made from photos of handtools (hammers, drills, etc.) I'm thinking maybe Herb Lubalin did it... does this sound familiar to anyone and/or can you tell me where I could see a photo of it?</p>
    <p>Thanks,</p>
    <p>Rob</p>
