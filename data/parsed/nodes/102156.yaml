    html: |-
      <p>Strictly an amateur speaking here, but either way loses something. If you show only the font name and designer, it's possible that the user will locate and purchase a different version of the font than you're using.</p>
      <p>On the other hand, the original designer is, to me, more important than the foundry. And what IS the foundry? It's often difficult, if not impossible, to separate resellers from font makers. </p>
      <p>So i guess it comes down to the way you show it - the designer name (if known).</p>
      <p> - Herb</p>
