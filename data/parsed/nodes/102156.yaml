      <blockquote><p>does iKern replace the sidebearings, or can it be used to only add kerning?</p></blockquote>
      <p>AFAIK, it does both as the same time.<br>
      For auto-kerning only (keeping side-bearings untouched) you can try DTL Kernmaster.</p>
      <blockquote><p>Also, a designer of a Google font isn't forced to use iKern, is he?</p></blockquote>
      <p>No, no one is forced to use it. But is available if the designer want to use it.</p>
