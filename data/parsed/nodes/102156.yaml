      <p>Google does improvement to the many of the fonts, including iKerning, Char-set extension, new weights/styles, hand-hinting, etc... Those improvement are usually not advertised, but they are happening all the time, in particular to the ones that have better ranking on the stats.</p>
      <p>Old Standard does have kerning (as show in the attached image), but for some weird reason it's not working on some browsers (I will investigate it). But I agree, it needs to be fixed so all browsers can use it (I will try to release a fixed version, if time allows).<br>
      <img src="http://f.cl.ly/items/3j16350G1p1x1K0k2T3s/Screen%20shot%202013-04-10%20at%2010.48.22.png"></p>
