    <p>I'm creating a "webfonts-in-use" colophon on my website and was wondering what would be best, to list the foundry or the designer(s)? There's not enough room to list both so I was thinking it might be best to link the foundry so others can find the webfonts if they choose to use them.</p>
    <p>Example:</p>
    <p><img scr="http://f.cl.ly/items/453a1U123Z0Y3V34291A/Image%202013-04-09%20at%206.41.25%20AM.png"></p>
