    html: |-
      <blockquote><p>Is there a specialized team that does this or is it the type designers themselves?</p></blockquote>
      <p>AFAIK, when there is something to improve, the original designer is contacted/commissioned first. If he is not able to make it, other designers will be contacted/commissioned as second option.</p>
      <p>In my own fonts, as a small example:</p>
      <ul>
      <li>Alexi (Cyreal.org) was commissioned to add Cyrillic to Lobster.</li>
      <li>Irina Kheyso was commissioned to add hand-hinting to Cabin.</li>
      <li>I was commissioned to expand Matt McInerney's Raleway-Thin into a 9 weights family.</li>
      <li>I'm also commissioned to expand my own fonts, or to develop new ones.</li>
      <li>Igino Marini's iKern was commissioned for Spacing/Kerning all of them.</li>
      </ul>
