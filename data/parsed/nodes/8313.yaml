  html: <p>I am desiging a new teen magazine that deals a lot with celebrities and fashion. Just what we need right? Anyway - I was wondering if anyone might have suggestions about fonts? Right now I am in the mock-up stage so anything goes. It has to appeal to teenage girls but I am trying to stay away from cutesy. Something on the verge of pop culture with feminine undertones? All your suggestions are much appreciated.</p>
