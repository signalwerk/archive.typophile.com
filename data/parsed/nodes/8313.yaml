    date: 2005-01-02T20:12:00
    date_raw: 2 Jan 2005 — 8:12pm
    votes: null
    html: <p>I did a prototype for a teen magazine a few years ago using a combination of FF Sari and FF Cocon, with a handwritten script (whose name escapes me) as an accent. Something about the rounded shapes and occasionally non-traditional letterforms said "young" to me.  <br> <br>But I agree with Daniel -- it's usually color, layout (busy, lots of info-chunks) and use of slangy, casual language that brand something as being for teens.</p>
