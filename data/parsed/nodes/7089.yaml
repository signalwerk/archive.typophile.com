    html: <p>If the fonts are TrueType or OpenType format, one could do this for free using Just van Rossum's <a href="http://www.letterror.com/code/ttx/">TTX</a> tool, which dumps an sfnt font to a human-readable/editable XML document, which can then be turned back into a font with the same tool. This, as I say, is free, but it does require that one knows one's way around inside the font tables. For Rodrigo's purposes, I think he can achieve his aim simply by editing the 'name' table (for a TT font; PS might be more complicated).</p>
