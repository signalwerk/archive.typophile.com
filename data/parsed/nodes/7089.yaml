    html: "<p>To elaborate on Tiffany and John: <br>The MS core fonts (as well as some other high-end fonts) are not pixelfonts; neither do they contain any \"true\" embedded bitmaps. They're super-hinted, which means they include special TrueType instructions, tailored to each point (actually PPEM) size, to distort the outlines so that they render out as nice bitmaps at those sizes. Yeah, I think it's kind of wierd too.  :-) <br> <br>hhp</p>"
