  html: "<p>Hi all: <br> <br>This may seem to you a very simple question, but remember I am no typographer but just a book and type lover. <br> <br>I have two fonts I would like every program in Windows XP to recognize as Roman and its Italic. That is, when working in font A, and when I select italic, I would like font B to be automatically selected.  <br> <br>I know you font map in this way in many typesetting and even some wordprocessing programs, but I would like to have the two fonts paired for every program.  <br> <br>Is there a way to do this? And what (sensibly priced, say around US$50 - for personal use only) program would be able to do this?  <br> <br>Every reply will be welcome. <br> <br>Rodrigo de S</p>"
  html_clean: "<p>Hi all: <br> <br>This may seem to you a very simple question, but remember I am no typographer but just a book and type lover. <br> <br>I have two fonts I would like every program in Windows XP to recognize as Roman and its Italic. That is, when working in font A, and when I select italic, I would like font B to be automatically selected.  <br> <br>I know you font map in this way in many typesetting and even some wordprocessing programs, but I would like to have the two fonts paired for every program.  <br> <br>Is there a way to do this? And what (sensibly priced, say around US$50 - for personal use only) program would be able to do this?  <br> <br>Every reply will be welcome. <br> <br>Rodrigo de S</p>"
