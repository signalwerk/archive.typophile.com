    html: <p>Well, it isn't difficult, but you need the correct software to do it, I think. You'd need to edit each font's naming structure in its Font Header, and then re-generate (export) the entire font. That is the only work-around that I can think of, but I'm not a font programming expert. <br> <br>Depending on the fonts involved, this might actually be "illegal." I know that this sounds silly at first, but it is really meant to protect you, your documents (if you sent them to press), and any one else who might later use your fonts/documents</p>
    html_clean: <p>Well, it isn't difficult, but you need the correct software to do it, I think. You'd need to edit each font's naming structure in its Font Header, and then re-generate (export) the entire font. That is the only work-around that I can think of, but I'm not a font programming expert. <br> <br>Depending on the fonts involved, this might actually be "illegal." I know that this sounds silly at first, but it is really meant to protect you, your documents (if you sent them to press), and any one else who might later use your fonts/documents</p>
  - id: 48925
    user: 4668
    date: 2004-10-17T08:24:00
    date_raw: 17 Oct 2004 — 8:24am
    votes: null
    html: "<p>Dear Dan: <br> <br>Thank you for the reply. But let me assure you that I want to pair the too typefaces for printing only, and even that not commercially.  <br> <br>To let you all know, I just like to 'test' the books I write. So before actually publishing them, I print them as well as I can and distribute them to my students (they photocopy them). But this is NOT an edition: it is something I do for two or three years until the book is corrected, completed, and publisheable.  <br> <br>At this point I send the text to the publishing house in RTF format, and I have no further say in formatting issues - as often as not I get the dreaded Times Roman (luckily not MT!). Of course I do not send fonts with it. I use only fonts that come with windows (especially Palatino Linotype because of its extended character set which enables me to use Greek when I need it).  <br> <br>So, I'm sure I am not breaking any law as the types I use in the early versions of the book are for my use only. I even do not provide them as PDFs as people might get a way of extracting them.  <br> <br>Truth is, I'm just an amateur typographer. I like to make the most beautiful 'books' possible as I am passionate about book printing. But then the publishing houses very seldom are... It is only a private passion. Suffice it to say that they always require an RTF copy!  <br> <br>SO you may believe me: what I am asking for is purely for private use and *never* commercial.  <br> <br>By the way: I just purchased ITC Galliard cc. When I make pdfs I use the normal Galliard. I acquired it without such restrictions.  <br> <br>I hope I have set your minds to rest. <br> <br>So may I have your opinion on what would be the proper program to do it? <br> <br>Rodrigo de S</p>"
    html_clean: "<p>Dear Dan: <br> <br>Thank you for the reply. But let me assure you that I want to pair the too typefaces for printing only, and even that not commercially.  <br> <br>To let you all know, I just like to 'test' the books I write. So before actually publishing them, I print them as well as I can and distribute them to my students (they photocopy them). But this is NOT an edition: it is something I do for two or three years until the book is corrected, completed, and publisheable.  <br> <br>At this point I send the text to the publishing house in RTF format, and I have no further say in formatting issues - as often as not I get the dreaded Times Roman (luckily not MT!). Of course I do not send fonts with it. I use only fonts that come with windows (especially Palatino Linotype because of its extended character set which enables me to use Greek when I need it).  <br> <br>So, I'm sure I am not breaking any law as the types I use in the early versions of the book are for my use only. I even do not provide them as PDFs as people might get a way of extracting them.  <br> <br>Truth is, I'm just an amateur typographer. I like to make the most beautiful 'books' possible as I am passionate about book printing. But then the publishing houses very seldom are... It is only a private passion. Suffice it to say that they always require an RTF copy!  <br> <br>SO you may believe me: what I am asking for is purely for private use and *never* commercial.  <br> <br>By the way: I just purchased ITC Galliard cc. When I make pdfs I use the normal Galliard. I acquired it without such restrictions.  <br> <br>I hope I have set your minds to rest. <br> <br>So may I have your opinion on what would be the proper program to do it? <br> <br>Rodrigo de S</p>"
