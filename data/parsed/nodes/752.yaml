    html: <p>It makes perfect sense to include both AFM and INF files along the standard PFB and PFM files when you produce PC Type 1 fonts (Windows PostScript fonts).  <br> <br>On MacOS X, Windows, and Unix systems, there are typesetting applications such as LaTeX that directly use PFB and AFM files. Not providing the AFM file makes the use of the font cumbersome.  <br> <br>Some CAD and plotting applications that do custom font handling use AFM files.  <br> <br>On some versions of Windows, PFM files that ship with a font may cause problems -- especially if the PostScript font was made with an ancient application such as Fontographer. In such case, the user can delete the PFM file and use ATM to create a new PFM file from AFM and INF (both are necessary).  <br> <br>I cannot think of a way how providing AFM files could help piracy.  <br> <br>Adam</p>
    html_clean: <p>It makes perfect sense to include both AFM and INF files along the standard PFB and PFM files when you produce PC Type 1 fonts (Windows PostScript fonts).  <br> <br>On MacOS X, Windows, and Unix systems, there are typesetting applications such as LaTeX that directly use PFB and AFM files. Not providing the AFM file makes the use of the font cumbersome.  <br> <br>Some CAD and plotting applications that do custom font handling use AFM files.  <br> <br>On some versions of Windows, PFM files that ship with a font may cause problems -- especially if the PostScript font was made with an ancient application such as Fontographer. In such case, the user can delete the PFM file and use ATM to create a new PFM file from AFM and INF (both are necessary).  <br> <br>I cannot think of a way how providing AFM files could help piracy.  <br> <br>Adam</p>
