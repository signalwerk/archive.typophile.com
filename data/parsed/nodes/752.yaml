    html: <p><i>they make it easier for people to pirate fonts...</i> <br> <br>Hmmm, that's a new one on me. How so? It seems that any of the metrics information available in an AFM could also be extracted from either an NFNT or SFNT resource Mac-side. My opinion is that AFM files are a quaint holdover from the glory days of desktop typesetting, when some applications had to parse the metrics independently from the screen fonts. Does any other platform actually use the AFM file format?</p>
    html_clean: <p><i>they make it easier for people to pirate fonts...</i> <br> <br>Hmmm, that's a new one on me. How so? It seems that any of the metrics information available in an AFM could also be extracted from either an NFNT or SFNT resource Mac-side. My opinion is that AFM files are a quaint holdover from the glory days of desktop typesetting, when some applications had to parse the metrics independently from the screen fonts. Does any other platform actually use the AFM file format?</p>
