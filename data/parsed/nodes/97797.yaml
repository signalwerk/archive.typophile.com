      <p>Sorry, I know you're after a match but I have found only a similar for now: <a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/design-system/" rel="nofollow">Design System</a>. The main big difference is the /K, the rest is very close.</p>
      <p>EDIT: talking about this /K, it's clearly not as "gas-pipe" as the rest of the lettering... As it is was for a signage, they've may be decided to change and go with another /K to avoid any misreading because, as most of gas-pipe style fonts, the /K could be very (too) close to /H and so confusing.</p>
