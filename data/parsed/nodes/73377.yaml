    <p>I work for author Kate Carlisle, and I'd like to identify the font that her publisher used on her book covers. In particular, I want to know the fonts used in the "A Bibliophile Mystery" tag and the title. Any ideas?</p><div class="imageWrap"><img src="http://typophile.com/files/homicide_250_3804.jpg"></div><p></p>
