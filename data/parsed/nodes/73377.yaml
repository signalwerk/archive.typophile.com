    html: <p>The script appears to be Troubadour. The open version of that old German metal font has been digitized as Rechtman. You can find some information and more known aliases in <a href="http://www.typophile.com/node/38718" rel="nofollow">this older thread</a>. I am not aware of a digital version that looks like your sample, i.e. a regular, non-open one. Maybe it has been customized.</p>
