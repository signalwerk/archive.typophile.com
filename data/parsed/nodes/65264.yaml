      <p>New version uploaded with kerning by <a href="/wiki/FontForge" class="freelinking" rel="nofollow">FontForge</a>'s auto-kerning, which is actually pretty good. </p>
      <p>@bemerx25: Thanks for the comments. This font is intended more for signage and headlines, not body text, but it would be nice to make a version for body text. Are you talking about the <em>U</em> in the name, where's its next to the <em>I</em>? I think it might be the combination of those two letters contributing to an unbalanced feeling.</p>
