    html: <p>I love the name and how the accents work! It seems awfully dark though. I can't see typesetting a book with this (at least not as it is now). Also the UC "U" seems confused - I like the idea but the eye just goes straight to the right top edge and wonders why it doesn't "feel" (if not look) symmetrical. I think this happens for other letters as well. So I would suggest thinking of how to balance them a bit more while retaining the "idea". Just some thoughts.</p>
