    <p>This design started out from imagining that the dotless <em>ı</em> was the basic <em>i</em>, and the dots on <em>i</em> and <em>j</em> were diacritics. I was traveling in Turkey and Hungary at the time, and the other diacritics flowed naturally.</p>
    <p>Please let me know what you think, good or bad. I'm also looking for a name, if anyone has any suggestions.</p>
    <p><img src="/sites/default/files/old-images/xenonsequitor-sample-590.png"></p>
