  html: |-
    <p>I’m designing a font with lots of alternate characters. While playing around with Brioso pro, I noticed a cool little pop-up menu (triangle symbol on each glyph square) in the glyphs palette in Illustrator CS2 that showed a selection of alternates for each character that had them. I want this for my font! I did a little research and read that it had something to do with all alternates (aalt). So I looked at Brioso’s OT coding and fumbled around with my own but alas, couldn’t get it to work. To complicate things even more, I opened it up in InDesign CS2 and it recognized my alternates and gave me the pop-up. But no go in Illustrator. Could someone inform me how exactly to get get this working? It would be much appreciated!<br>
    Thanks!</p>
    <p>Josh</p>
