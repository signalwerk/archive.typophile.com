    html: |-
      <p>The AFDKO feature syntax for “aalt” is special, unlike any other feature. Rather than duplicating all possible substitutions that are already defined in the font, Adobe created this shorthand notation for “aalt”: the AFDKO compiler looks at the “table of contents” defined under “feature aalt”, then checks all the feature definitions listed there, collects all the lookups associated with those features and maps them to “aalt”. In other words, through the special “aalt” syntax, the font developer decides which of the lookups that are already defined in his font and are associated with some features should be also associated with “aalt”. </p>
      <p>Adam</p>
