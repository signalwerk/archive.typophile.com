    html: |-
      <p>Whenever you define any features in your font that produce 1:1 substitutions by some alternates (salt, ss01-ss20, swsh, hist, smcp, c2sc etc.), you should link these features to aalt in the following way:</p>
      <p>feature aalt {<br>
        feature salt;<br>
        feature ss01;<br>
        feature ss02;<br>
        feature hist;<br>
        feature smcp;<br>
        feature c2sc;<br>
      } aalt; </p>
      <p>All the substitutions from the original features that have been linked into “aalt” will become available in the little popup menus of the Illustrator and InDesign glyph palettes. </p>
      <p>Best,<br>
      Adam</p>
