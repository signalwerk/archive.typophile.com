      <p>This 3d thing is not made to replace the 2d logo (i love it too much). but for example if you take only the alpha channel of the first image you basically have my 2d logo. It's not perfect but good enough to have fun with After Effect,so i can animate my logo and have fun with it. I don't know if i will ever use it for real, this is experimental.. i do 3d when i need to change idea because i'm stuck in other projects i don't really look forward that way for my job except for animations :P<br>
      and the (gold) texture with reflect is the better way to see the default of the model, i don't want to have a GOLD logo OMG no!! :D</p>
