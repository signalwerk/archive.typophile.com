      <p>I actually prefer the lefty2.jpg<br>
      It is traditionally 'correct' in respect to the laws of logo design.<br>
      It scales well, its simple but eye catching. Its truly beautiful.<br>
      Less is more and just because gradients and three dimensional bells and whistles are sexy it doesn't mean they're practical. Imagine the 3d version at the top of a letter head photocopied three times over in black and white and then faxed across the country.<br>
      The lefty2 would retain a true to form image.<br>
      As it should.<br>
      It's wonderful.</p>
