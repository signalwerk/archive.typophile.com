    <p>I'm not sure about posting this on this site is right, since<br>
    your about typo not logos but i'd like opinion about<br>
    my logo. My 2d logo was created almost 10 years<br>
    ago, it was created with a program by Adobe (i don't<br>
    rember the name) who made vector 3d and was much<br>
    better than the 3d function added to Illustrator.<br>
    So basically my logo is a circle-thing mapped on a top<br>
    of a sphere. With cinema4d, added dimention to this<br>
    flat logo.</p>
    <p>wich one do you prefer? (and why if your kind)<br>
    thx</p>
