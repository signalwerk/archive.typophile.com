  html: |-
    <p>1) Tondo - a beautifully crafted rounded font family</p>
    <p>Of the few rounded fonts available, fewer still have been carefully<br>
    designed and crafted. With Tondo, we release a font family that continues<br>
    the tradition of our high quality designs…<br>
    More: <a href="http://www.daltonmaag.com/news/59.html#S1">http://www.daltonmaag.com/news/59.html#S1</a></p>
    <p>1) Tondo - eine Schriftfamilie mit weichen Rundungen</p>
    <p>Von den wenigen erhältlichen Rounded-Fonts sind noch weniger sorgfältig<br>
    gestaltet und ausgearbeitet. Mit Tondo veröffentlichen wir eine<br>
    Schriftfamilie, die unsere Tradition von qualitativ hochstehenden<br>
    Schriften fortführt…<br>
    Mehr: <a href="http://www.daltonmaag.com/news/59.html#S1">http://www.daltonmaag.com/news/59.html#S1</a></p>
    <p>2) Find your way in Southampton</p>
    <p>A coherent and attractive wayfinding system is being developed for the<br>
    city of Southampton. Dalton Maag designed a contemporary typeface<br>
    specifically for this task…<br>
    More: <a href="http://www.daltonmaag.com/news/59.html#S2">http://www.daltonmaag.com/news/59.html#S2</a></p>
    <p>2) Sich in Southampton zurechtfinden</p>
    <p>Für die Stadt Southampton wurde ein kohärentes und attraktives<br>
    Signaletik-Projekt entwickelt, für das Dalton Maag eine eigene<br>
    zeitgenössischen Schriftfamilie entwarf…<br>
    Mehr: <a href="http://www.daltonmaag.com/news/59.html#S2">http://www.daltonmaag.com/news/59.html#S2</a></p>
    <p>3) What about OpenType support?</p>
    <p>Commercial OpenType fonts first began to appear in 2000 and all the major<br>
    font foundries have since converted most of their libraries to OpenType<br>
    format. But have the applications caught up yet?<br>
    More: <a href="http://www.daltonmaag.com/news/59.html#S3">http://www.daltonmaag.com/news/59.html#S3</a></p>
    <p>3) Wo steht die Unterstützung von OpenType?</p>
    <p>Die ersten kommerziellen OpenType Schriften erschienen im Jahr 2000; alle<br>
    grossen Schriftbibliotheken haben seither die meisten ihrer Schriften in<br>
    diesem neuen Format herausgegeben. Aber haben auch die Applikationen<br>
    aufgerüstet?<br>
    Mehr: <a href="http://www.daltonmaag.com/news/59.html#S3">http://www.daltonmaag.com/news/59.html#S3</a></p>
