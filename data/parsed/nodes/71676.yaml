    <p>So I'm designing &amp; typesetting a book in Newzald; and some Greek terms have come up. At first I was reasonably OK with Georgia:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Griechisch_Georgia_4261.gif"></div><p></p>
    <p>But I'd love to find something that matches Newzald better, especially the color/weight. Plus, it turns out there's some more Greek in a different text, in which [at least my version of] Georgia can't display all characters. I'm assuming this is Polytonic Greek?<br>
    Using Lucida Grande:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Griechisch_Screenshot_4442.gif"></div><br>
    .<br>
    There is not a lot of Greek, but I'd really like it to not be too jarring.<br>
    Can anyone point me towards a font that supports Polytonic Greek, would work with Newzald (think Fleischmann/Rosart, Transitional, narrowish vertical, relatively dark) and if possible doesn't cost an arm and a leg? I only need regular weight, but with italics.<p></p>
    <p>Thanks for any help!</p>
