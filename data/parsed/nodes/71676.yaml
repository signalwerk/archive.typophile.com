      <p>John, the Porson style of Alfios italic seems a nice idea, but the x-height is way too small -- the Greek accents will be all over the place in Nina's layout and the Greek caps will obtrude far more than the Latin, which is always an issue mixing Greek with Latin.</p>
      <p>I really think that one needs to match vertical proportions, and therefore use a compact Greek.</p>
      <p>ANY style of Greek font with comparable capital and x (kappa) height to Newzald should be the starting point.</p>
