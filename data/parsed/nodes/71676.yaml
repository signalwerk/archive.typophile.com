    html: |-
      <p>Greta looks fine for the most part, and won't give you any trouble in terms of weight, although the style is a bit more contemporary than Newzald. Among Slimbach fonts, the best match might be Minion Pro (possibly the caption cut, to get the weight and x-height closer to Newzald), although this is less contemporary in style than Newzald. GFS Elpis might be in the right vicinity too.</p>
      <p>However, do you need the ancient numerals (like koppa and sampi)? If so, Elpis doesn't have them. Minion Pro has them in lowercase, which is usually - but not always, depending on the kind of texts you're setting - all you need. Greta has both uppercase and lowercase forms, but they're not always well drawn in relation to the rest of the character set.</p>
