      <p>Thanks everyone for the input so far.<br>
      Constantia looks «not bad», formally – is there a Polytonic version? I can't seem to find it.</p>
      <p>The GFS fonts (of which I tried the «Didot» and the «Bodoni») look like they'd be quite nice as standalone fonts, but they don't blend in with the existing Latin too well. Andron is probably over the budget in this case, and it might also be a bit too light and a bit too «oldstyle» in the setting I have – if I used that, I'd really prefer to use it within its own Latin.</p>
      <p>One thing I'm realizing is that I need the Greek to be rather subordinate to the Latin in this case, so actually not too «traditional» – both in terms of blending in (there is very little Greek, and the Latin should be allowed to set the tone so to speak), and also in terms of not being too italic/cursive-looking when upright.<br>
      I need Roman+Italic to be rather distinct (I'm dealing with situations like in the Latin within the top screenshot above, which is from a transcription of a manuscript, where italicization (even inside words) carries extra meaning).</p>
