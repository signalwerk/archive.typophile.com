    votes: null
    html: <p>Most likely, the unsophisticated expectation of the reader is that all the letters in a text, regardless of the alphabet they belong to, should look as if they were part of the same set, i. e. typeface. If this is not possible because the font does not contain all the characters needed, it might be least distracting to use a noticeably different typeface for a well-defined group of letters, namely Greek ones, than to make a moribund attempt at creating the perfect match. To my mind, this is not erudite, it is just good sense.</p>
