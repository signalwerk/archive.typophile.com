    html: <p>This «most part» includes the basic uppercase/lowercase letters. I'm not sure about the accents - they are rather understated, and angle of the acute and grave accents is very steep (thus poorly differentiated). To my eye, Greta works better for monotonic Greek than for polytonic. However, if the Greek text is only short snippets, it would probably be OK. The sort of people who care about the exact choice of words in ancient texts will know the accentuation from context anyway.</p>
