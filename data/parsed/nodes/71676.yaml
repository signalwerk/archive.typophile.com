      <p>&gt;I find that when mixing Greek with English (or German) it is better to use a typeface that does *not* match . . . &gt;</p>
      <p>By that logic, if you set a job in Arno or Garamond Premier, etc., you'd change fonts to set any Greek?</p>
      <p>And while I suppose I'm hopelessly out of date, I'd not set any Greek run into the text with a sans when the text is set in a serif. At some point, type has to be about the reader and his/her unsophisticated expectations, not about the oh-so-erudite designer . . .</p>
