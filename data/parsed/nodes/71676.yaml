      <p>Hi Nina,</p>
      <p>Nick is right on about the desirability of similar vertical proportions, but I also agree with the others who suggest you don't try to "match." I think there's a middle ground between matching and jarring: A complementary non-match is better than an imperfect attempt at matching.</p>
      <p>Though I don't have my copy (copies) of <em>Elements of Typographic Style</em> handy, I think Robert Bringhurst suggests something like this when combining Latin and Greek (and Cyrillic) scripts. I seems to me that when you're using a type doesn't have Greek letters, it might be best to look for something different enough not to look like a bad match. It's kind of like the style convention of using italic for occasional foreign words (using Latin script) within an English language text.</p>
      <p>I like the idea of a sans like  Fedra -- or any Greek face that's got workable proportions but less stroke contrast than Newzald. Let us know how your experiments with it go.</p>
      <p>- Matthew</p>
