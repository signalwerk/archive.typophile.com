      <p>If all you need is "MODERN CHARMS" just render the text in Helvetica Neue Ultralight using Illustrator and modify the outlines (or scan, trace and clean up a rendering/printout of the bold/rounded version). If you want an actual font you would ideally open Helvetica Neue Ultralight in a font editor (like FontLab) and make a new font that's just how you like it. However I think Linotype's EULA forbids modification, at least not without permission. Personally I actually don't mind people violating such a "no-mod" clause, as long as they make sure the derivative font doesn't get distributed; and if does get distributed and they get caught, they need to pay for the consequences. So: taking personal risks, and accepting the associated responsibilities.</p>
      <p>hhp</p>
