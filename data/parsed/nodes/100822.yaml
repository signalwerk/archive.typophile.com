    <p>Hello, I'm having a frustrating font problem that perhaps someone here could help with.  I created some text in Photoshop using Helvetica Neue Ultralight.  Then I added a faux bold to it which made it look very similar to Neue Light.  However, for some reason the faux bold also added a rounded appearance to the text which I really like.  You can see the text here:  <a href="http://www.moderncharms.blogspot.com" title="www.moderncharms.blogspot.com" class="link-external">www.moderncharms.blogspot.com</a>  it's the "MODERN CHARMS" at the top of the page.  Now I'm working on a print layout and I want the text to look like this, but I can't use text from photoshop because it is not a vector program so the text will not look sharp when printed.  I can't even convert this text into shapes in photoshop because the program refuses to convert anything to shape that utilizes a faux bold.  So i figured I would just purchase the font Helvetica Neue Rounded Light, but it turns out there is no such thing.  So I'm trying to find a good alternative.  I considered Arial Rounded Light, but the capital 'R' is quite different which I don't like and since it occurs twice in "MODERN CHARMS" I'm hoping not to have to use this font.  If anyone has any suggestions or recommendations I would greatly appreciate them.</p>
    <p>Mark</p>
