    <p>Starting Monday 2 January, BBC Radio 4 is running a week long special edition of <em>In Our Time</em> devoted to the history of writing. Sure to be fascinating.</p>
    <p><a href="http://www.bbc.co.uk/programmes/b018wfsc" title="http://www.bbc.co.uk/programmes/b018wfsc">http://www.bbc.co.uk/programmes/b018wfsc</a></p>
