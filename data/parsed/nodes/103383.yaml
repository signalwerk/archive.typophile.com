      <p>If you purchase Trim Poster this is what you get for outlined accents similar to the sample:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/TrimPosterRingUmlaut_4509.jpg"></div><br>
      And other accents:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/TrimPosterMoreAccents_3583.jpg"></div><br>
      The font in your sample is more rounded than Trim Poster -- similar to Futura -- but you can see the technique from the sample if you want to make your own accented capitals in illustrator or a font making program.<br>
      This only works for very large headlines. I would have used more white space to make it more useable for smaller headlines.<br>
      Don<p></p>
