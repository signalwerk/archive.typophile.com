    <p>What about this one. It's from the Swedish newspaper Kvällspesten [sic]<br>
    I am going to make a fake poster for a friend who asked me to make one for him...  but I cannot figure out what kind of type they use. Maybe it is something they've invented themselves? the Ä and Ö and A with an ° on top must be specially made for their headlines.</p>
    <p>Anyone who could recommend something for me to use? I can make the Ä and Ö and A with an ° on top myself in illustrator.</p>
