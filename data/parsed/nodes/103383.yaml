      <p>Are you sure the newspaper’s name isn’t <a href="http://www.expressen.se/kvp/dagens-kvallsposten/" rel="nofollow">Kvällsp<strong>o</strong>sten</a>?</p>
      <p>The typeface looks like some home-brewn Futura to me – probably custom(ized). If you are looking for a similar retail font with such compact diacritics, see Scangraphic’s Supertypes Series, labeled with SH – e.g. <a href="http://myfonts.us/td-zwprBg" rel="nofollow">Futura SH</a>. This series started in the 1980, i.e. before OpenType. The compact alternates are still not properly encoded as alternates, but can be accessed via ~ (tilde) for Å and { for Ö. In the early 1990s, URW released its Poster series. In <a href="http://myfonts.us/td-0X8lia" rel="nofollow">Futura P Extrabold</a>, such integrated accents are the default.</p>
      <p>Albert-Jan Pool kindly provided me with this information for my recently published <a href="http://www.flickr.com/groups/fancy-diacritics/discuss/72157633790076349/" rel="nofollow">article on unusual umlauts</a> for TypoJournal.</p>
    html_clean: |-
