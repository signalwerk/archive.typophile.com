    html: <p>Fonts can be re-used in unlimited ways, making them more like a tool, whereas other web content is typically not seen as valuable for re-use. All the applications for fonts, from books and magazines to identities and websites, also have potential for their creators to make money. You can try, but you can't legally make money selling photos, writings, movies or music that you aren't author of, or legally entitled to sell. Fonts have similar value as tools, but the new situation presents the possibility of those tools, which still have value, to be distributed freely, against the will of the original designers.</p>
