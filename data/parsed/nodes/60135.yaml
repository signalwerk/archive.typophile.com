      <p>Remember, we're just trying to get a simple web font format which offers some protection. EOT Lite offers that. Any number of other proposed formats would be adequate as well. The persistent use of the simplistic and inflammatory term "DRM" is really not helpful to the discussion. EOT Lite offers enough protection for many foundries and has nothing even vaguely resembling DRM in it.</p>
      <p>One other thing to consider: The DVD format offers relatively mild copy protection, and it did rather well. You could say that there was a small but vocal opposition to it being there, but by and large the average customer didn't even notice. It worked, and the format was one of the most successful new technologies in history. You might call that apples and oranges, but it's an example of an industry having enough protection to be comfortable putting its digital content out in the world without causing any particular inconvenience to customers.</p>
      <p>Adobe does have reason to expect that recent and future versions of IE would support CFF fonts in EOT. Possibly older versions as well, with a little help from Microsoft. With the compression inherent in CFF, the compression issue becomes less urgent.</p>
      <p>And yes, subsetting can be pretty handy.</p>
