      <p>Thanks John, for that clarification. </p>
      <p>I think that the DRM vs free dichotomy that many keep asserting in these threads is really a false dichotomy. There are more options than either trying to make it impossible to steal a font, or to make it free. Two things can I think and hope create a sustainable market for web fonts: 1. Making it not easy and obvious to download the font for non-browser use without piracy software; and 2. Enforcing large, public violations of EULAs. </p>
      <p>Because fonts are tools for publishing either on the web or print, and because publishing is by definition public--and the web especially public--the situation is significantly different from the story with music. Font vendors are not going to even attempt to go after the individual consumer, which was the issue with downloading music. But they will go after publishers. </p>
      <p>And I think large foundries such as Monotype, Adobe, will be willing to sue owners of web sites who do considerable business for violating EULAs for web fonts. And once the principle is established, my guess is that web businesses will be extremely reluctant to do stuff in public that makes them subject to a hefty law suit, when there is a relatively low cost to getting the font.</p>
      <p>So I think that while significant control of piracy among say scrap-bookers may be impossible, it does seem possible to have enough enforcement leverage on web publishers to create a remunerative market for web fonts.</p>
