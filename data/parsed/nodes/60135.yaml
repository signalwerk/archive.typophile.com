      <p>@kentlew</p>
      <p><cite>I’d like to think it isn’t an either/or proposition and that any additional compression both inside and outside a font format would be worth some extra code.</cite></p>
      <p>This is not necessarily true, running gzip over a file twice generally won't result in a more compressed file, just as enclosing a JPEG in a zipfile won't reduce the size.  The EOT format used MTX compression which includes two different types of compression, Truetype-oriented compression of things like hints and metrics and general entropy compression similar to gzip for everything else. <a href="http://www.w3.org/Submission/MTX/" rel="nofollow">[1]</a>. With heavily-hinted TrueType fonts, MTX does much better than gzip but with more lightly-hinted fonts (e.g. Microsoft Cleartype fonts) the results are more marginal <a href="http://spreadsheets.google.com/pub?key=rKT_wNzraVrkXQcKSWb-jTA&amp;gid=0" rel="nofollow">[2]</a>. </p>
      <p>Also unmentioned during the panel discussion was the fact that the embedded font API's on Windows used to support EOT do not support Postscript CFF fonts, so there's <strong>no</strong> backwards compatible way of supporting these fonts in Internet Explorer, other than to convert them manually to fonts with TrueType glyphs.</p>
      <p>[1] <a class="freelinking external" href="http://www.w3.org/Submission/MTX/" rel="nofollow">MTX description</a><br>
      [2] <a class="freelinking external" href="http://spreadsheets.google.com/pub?key=rKT_wNzraVrkXQcKSWb-jTA&amp;gid=0" rel="nofollow">Comparison of MTX compression to gzip and lzma</a></p>
