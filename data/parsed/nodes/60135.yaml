      <p><cite>And yet we don’t find TIFF as a graphic standard for the web, relying on server-side gzip compression to handle size issues. Instead we prefer already compressed file formats like JPEG.</cite></p>
      <p>Poor analogy, TIFF as commonly used is a lossless form of compression, JPEG is a lossy form which results in dramatic compression ratios.  All the font compression techniques discussed are lossless (gzip, lzma, MTX) so the question is how much better does a given compression method improve compression ratios versus already available methods (i.e. HTTP gzip compression).</p>
      <p>As David Berlow suggests, a "lossy" form of compression like subsetting is where substantial gains are to be made in reducing the size of fonts served.  This doesn't require a new font format, it requires new tools that do this accurately without quality loss.  Typekit is effectively providing a tool like this, a tool used to create a custom font for each user of their service.</p>
