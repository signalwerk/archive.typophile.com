      <p>DrDoc, this entire thread is about DRM, as a) that's whats in the title of this discussion, and b) that's why the variety of new font formats are being proposed for.  The existing font formats would work fine with font-face, the big foundries don't want to use them for the web because they don't have DRM and can be readily downloaded and used both on other web sites and on your local computer.</p>
      <p>The problem with this is, either the format conversion from say truetype or opentype to a new 'webfontformatwithdrm', is that either the conversion is lossy (as in, the web font is incomplete compared with the original, reducing the usability of the font), or there WILL be conversion tools that reverse the process (and strip out any drm).</p>
