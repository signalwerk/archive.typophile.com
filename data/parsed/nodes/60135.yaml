      <p>To the original post, </p>
      <p>&gt;Why must type be protected?</p>
      <p>Type, must not be protected, ever. Fonts must be protectable though. Seeing this from the user perspective, it is not entirely totally the opposite of other media, but close.</p>
      <p>&gt;Why do you believe fonts are “special” for the web [...] vs any other licensed media such as graphics, music or video?</p>
      <p>Type must be protected. (just kidding). Fonts, not so much special, are different because the operating system's treat them differently.</p>
      <p>&gt;[How are type designers different] than the creator of images on a webpage, or sound, or text?</p>
      <p>We're all human, beyond that what's the question?</p>
      <p>Kent, I think the panel gave entirely the wrong idea of compression. David or someone jumped raw and naked at Bill or someone when they implied that compression is a bad thing and nobody stopped him, nobody. Then David said, compression is not a bad thing... but well, if you don't have to compress a font, that's a good thing isn't it? Compression in this instance particularly sucks because digital outline fonts are so friggin compressed, you couldn't fit a credit card in there. What's more, there is danger in font compression that makes, e.g. your connection speed issue trivial. So, maybe compression is a separate and slowly cooling issue ;). Subsetting, now that should be a hot issue!</p>
      <p>The only other thing I might have bit on panel-wise, and maybe other people thought of it too, was when the user asked from the audience what would happen if, (though it's more likely <em>when</em>), their @font-face call doesn't work: the panel agreeing unanimously for a change, that the backup font would be there, probably like Verdana... But what if text is replacing a graphic of text, like everybody says they are trying to with @f-f? Can web developers write code to, "Either display this font, or if you can't, tell me, and I'll tell you to display this graphic instead?" It might be trivial, but then it is the web we're talking about so my guess is that there are going to be at least some size differences to cope with, getting from a bunch of scaleable letters back to a block of pixels of text... I mean no one wants their logo e.g. to default to Verdana or anything else, do they? </p>
      <p>Cheers!</p>
