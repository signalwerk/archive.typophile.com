      <p>bert:  The idea that every use of unlicensed IP counts as though it were physical theft, and that all the people who do license it need to pay for those unlicensed uses, well, is ridiculous.  I know that's how groups like the BSA like to calculate so-called software industry losses, but that doesn't make it a reasonable argument.</p>
      <p>You seem to be equating font designers getting paid with DRM.  Other industries have shown that DRM winds up hindering, not helping those industries.</p>
      <p>The more obstacles you put between yourself and your customer (wacky licensing agreements, drm, etc...), the more likely your customer will be to find another solution (that may or may not include pirating your font).</p>
      <p>There are lots and lots of web designers and companies that make web sites and make sure all the elements on their pages are properly licensed (graphics, photographs, text) without needing browsers to have DRM embedded in them.  If using a specific font for a web site is perceived to have enough value (ie, the same or more value than it's licensing fee), a designer will license and use it.</p>
      <p>If there are enough designers who value the fonts you provide enough to use them (as in, the value they add to the site meets or exceeds the amount you charge), you have a viable business.  If there aren't, you don't.  Adding a layer of DRM just increases the 'charge' side of the equation, without any benefit (as it costs everybody, font designer needs to configure and add it to the fonts, along with any infrastructure it needs, web browser needs to implement it, paying customer needs to figure out how to make it work with their web site).</p>
