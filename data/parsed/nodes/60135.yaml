      <p>As Frank Martinez pointed out during the prep meeting for the TypeCon web fonts panel, DRM is a business model not a technology. Confusion over this is one of the reasons why we decided to avoid the term during the panel discussion.</p>
      <p>No one that I know of is advocating a web font format solution that would enable a DRM business model. It simply isn't on the table because unlike, say, iTunes music, a web font format needs to be supportable directly within browsers, not in special web font 'players' or via plug-ins, and most of the browser makers will not implement a format that contains technical measures to protect software that require enforcement on the part of the browser. What some of us are advocating is a format that a) is appropriate to the web medium (which means a format including compression) and b) contains bulkhead protections against casual and unintentional unlicensed use. The difference between the bulkheads and the kind of technical measure that would enable DRM -- the kind of measure that automatically invokes DCMA law in the US -- is that the bulkheads simply sit between the web font and casual breaking of license agreements, requiring no special action on the part of the browser.</p>
    html_clean: |-
