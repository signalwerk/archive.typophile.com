      <p>Cristobal: "Am I right, or am I missing something?"</p>
      <p>You're missing that it is violates copyright law.</p>
      <p>Sure, somebody may create a blog on their own host that may use your font, and blow off your complaint to them about it, but any non-trivial company (which is what virtual all web-designers are doing work for) will care about their public-facing web site blatantly violating copyright.  They won't like that the web designer they paid to make their web site opened them up to a lawsuit, at least potentially costing them thousands of dollars in legal fees, let alone settlement fees.</p>
      <p>Blogging sites like wordpress and sites like twitter/myspace/facebook will probably want to offer new fonts as a feature, and they'll make sure to get a license for those fonts (and just not permit the use of fonts from the foundries that attach unreasonable licenses/fees for the fonts).  And they probably won't let users upload random fonts.</p>
