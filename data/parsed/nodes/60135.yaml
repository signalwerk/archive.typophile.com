      <p>crossgrove: Um, graphic designers and photographers would definitely have a problem with what you wrote, as they find their work can get copied and used on other web sites and even moved to print, that others make money off.  It's all just intellectual property, that is "owned" by an individual/company and licensed to others with various limitations in the license.</p>
      <p>Could a font be used on every web page on the planet?  Sure.  Is it likely to happen?  No.</p>
      <p>Will some web sites, either accidentally or intentionally, use a font for which they aren't licensed on their web site?  Definitely.  Will DRM make a significant difference?  From looking at how other IP is treated on the internet, it is unlikely.</p>
      <p>People who professionally make web sites (either inhouse or freelance), or care about their brand/image, will make sure their font usage is properly licensed.  The ones that don't, or individuals just making one-off pages, are less likely to use web-based fonts because it costs more to host/deliver their web site, and even if that doesn't affect them, then they still wouldn't pay the licensing fee, even if asked (at best, they would simply stop using the font).</p>
      <p>The foundries with complicated licensing agreements will find that they simply are impeding their fonts from being used legitimately, rather than "protecting" their font.  Adding DRM which will take years to adopt just keeps them in a bigger hole than other foundries without these requirements.</p>
