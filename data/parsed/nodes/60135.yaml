      <p>Re: Compression<br>
      As John Daggett points out, there are substantial reductions in file size to be had over CFF alone.<br>
      And the numbers for LZMA really caught my attention.<br>
      At the server level, gzip reduces the size of the file as it's transmitted with the browser un-gzipping it on the other end.<br>
      However, I have a problem with saying "use gzip" and letting it go at that, because it's exclusionary - it assumes a level of technical expertise and control over the web server. Compression built into the file can be created by anyone even if they don't know a .htaccess file from a hole in the wall. Compression at the file level, is just simpler. And I believe, as a rule, that the closer web development stays to a do-it-yourself proposition, the more inclusive and democratic it will be. I don't think JD or anybody will argue differently.</p>
      <p>@tim brown<br>
      As to the original question: as with any grant of copyright, granting the monopoly only makes sense if it helps to promote the "useful art" (as the US Constitution phrases it). In other words, if it helps keep the work product we need coming at a reasonable price. In the case of fonts, which are both labor and knowledge intensive, I believe it does. Others disagree.</p>
      <p>@bb<br>
      You entertain me, as_always.</p>
