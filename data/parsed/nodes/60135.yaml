      <p>I’m not with DRM or something, but let me see if I get it right:</p>
      <p>Let’s say that you, as a type designer, need 100 dollars a month to live. If 10 designers are paying for your fonts, you can charge 10 dollars each.</p>
      <p>But if only two of those designers are paying, the easiest solution is to charge 50 dollars each. So the honest designer is paying 50 dollars instead of 10. <em>In this sense,</em> I’d say that the honest designer is paying for the pirate (subsidizing?). Another option: you can start selling cheaper, hoping to make more sales (but no guarantee).</p>
      <p>Now, if at some point those two remaining designers stop paying (“Why should I, if I get the same stuff by free and no one else is taking the right way?”, “Why should I pay 50 bucks for this, if it should be costing only 10?”), you need to find another job and the world won’t see more fonts by you (or anyone else who takes this job seriously, given the effort it implies). But your type designs are helping those 10 designers to make money, right? How is that? I don’t know if piracy is the only responsible for this, but definitively doesn’t help.</p>
      <p>Now, the big problem is how you can convince the non-paying guy to change his mind, but it’s another story (and the original question of this thread, I am afraid).</p>
      <p>Am I right, or am I missing something?</p>
