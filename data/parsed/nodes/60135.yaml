      <p>Sounds like a great plan, right? Yeah, it’s just as if type designers will let everyone use the products of their effort and time for what? A pat on the back? A cigarette?</p>
      <p>What piracy means is that the honest people who pay for the product subsidise the pirates. And as soon as these honest johns turn in to blackjacks and stop doing that, there will be no more for [insert product of choice] for anyone. And alternative marketing methods — as suggested on ILT — will not make up for that, or counter the trend.</p>
      <p>BTW My friend made national television with his plan (in the Netherlands, okay…). </p>
      <p> . . .<br>
      Bert Vanderveen BNO</p>
