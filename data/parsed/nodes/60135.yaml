    <p>You'll get nothing less than appreciation from me for the work that goes into the type I use on a daily basis. My respect for type design is deep and sacred. I would pay more than some type sellers charge, if money were no object to me, because my love and appreciation for the craft behind each curve is so great.</p>
    <p>I understand, though, that not everyone shares my affinity for type –&nbsp;or my willingness to pay for something that has been incubated with creative energy and lifelong practice even when something similar is available elsewhere for free.</p>
    <p>How would you argue for the value of a type license?</p>
    <p>Secondly, regarding the difference between type that is licensed for web use and type that is protected with DRM-like restrictions: in the comments section of a recent blog post of mine, folks have asked:</p>
    <ul>
    <li>Why do you believe fonts are "special" for the web [...] vs any other licensed media such as graphics, music or video?</li>
    <li>[How are type designers different] than the creator of images on a webpage, or sound, or text?</li>
    </ul>
    <p>What do you think? As you answer, try to consider the issue from the perspective of folks who have been severely disappointed by other creative industries' restrictions.</p>
