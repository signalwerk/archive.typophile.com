      <p>Cristobal: Your countrymen don't have a high regard for IP.  Being in a business that produces IP and trying to sell it locally may not be the smartest thing to do.  Slapping on a layer of DRM on fonts won't make a difference to them.  If they want to use it on their web site, they'll do it, and it'll probably be easier for them than for your paying customers because they won't have to worry about making sure the DRM works right when somebody visits their web site.</p>
      <p>However, other countries, with perhaps a lower piracy rate, where lots of companies spend a lot of time and money on branding and image, they do take IP seriously.  And they have the money and are willing to spend it to get IP they want.</p>
      <p>And IMHO, piracy for web fonts could easily be less than it is for computer fonts, just because they will be public.  These fonts are not aimed at being used on internal wikis.  They are for creating a more compelling public web site for customers to see.  Foundries can readily find out if a web site is using one of their fonts.  With computer fonts, it's much harder (or impossible) for a foundry to tell that a given company is using their fonts for all their correspondence, because where they are being used is internal-only, or just to clients (or even in printed matter).</p>
      <p>Lots of companies (in the US at least) will do the right thing (either stop using the font or pay to license it) if notified they shouldn't be using it.</p>
      <p>Simply put, for a business that sells IP of any kind, a strategy of aiming your sales strategy at people who have money and are willing to part with it in exchange for the IP works much better than trying to shoot arrows into everybody that will never in a million years pay for your IP.</p>
