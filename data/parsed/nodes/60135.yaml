      <p>@John Hudson</p>
      <p>Browsers these days support general gzip compression for <strong>all</strong> content loaded via the HTTP protocol, including IE.  It's unfortunate that the Typecon web fonts panel gave the distinct impression to everyone attending that a new file format is somehow required to get compression of fonts, it is not.  Rather the question is really would font-specific compression techniques provide additional compression that would justify the additional code required to support it.  In many ways, I think supporting better general compression techniques would be a far bigger win for the web.  For example, general lzma compression appears to do a <a href="http://spreadsheets.google.com/pub?key=rKT_wNzraVrkXQcKSWb-jTA&amp;gid=0" rel="nofollow">better job compressing your Constantia font</a>.</p>
      <p>What precisely is a "bulkhead protection" against casual font use?  Are you talking about a wrapper format that contains obfuscated font data or a format that uses some form of automated licensing information to regulate font usage?</p>
      <p>John Daggett<br>
      Mozilla Japan</p>
