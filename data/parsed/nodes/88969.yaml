    html: |-
      <p>Nice design. I like the /g/. The /q/ is also quite cool though it might be creating too much texture in the vertical center of the lowercase letters.</p>
      <p>The tittle on /i/ should be a little higher. Also, are your round characters slightly taller so they look optically the same height as square characters? I'm not 100% certain but the rounded characters seem to look optically slightly smaller.</p>
      <p>I think if you want to give /P/ and /R/ such large bowls then the horizontal bar in /A/ should be a bit lower so the counter becomes larger.</p>
      <p>You might want to extend the horizontal stroke in /G/ to the height of the horizontal bar in /B/ or just a bit below that. I suspect that should fix your issue with /G/.</p>
      <p>/T/ could be a little wider.</p>
