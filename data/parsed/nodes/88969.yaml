    html: |-
      <p>Great suggestions.</p>
      <p>@guifa, I'm not familiar with Spanish handwriting, but it would be highly unusual for the spur of a /q/ to be below the baseline—not that my /q/ isn't unusual now, of course. I would be interested in seeing an example of this, if you can find one, though.</p>
      <p>As for the link of the /g/, you're just suggesting that it curve smoothly rather than being so angular, right? I don't really get the connection with /e/, though. I'll tinker...</p>
      <p>@Martin, The lowercase texture issue is one I hadn't thought of, but adjustment will probably have to wait until I can do testing on blocks of text.</p>
      <p>You're definitely right about the tittle and the /T/, though. The round characters are optically adjusted, but I think you're right that they should be pushed a bit further.</p>
      <p>Good call on adjusting the /A/'s crossbar.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/PAR_6187.jpg"></div><p></p>
      <p>I bumped the /G/'s bar up a bit. The /B/E/ crossbar height was too high, but it does little better now, I think...</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/GRAB_4101.jpg"></div><p></p>
