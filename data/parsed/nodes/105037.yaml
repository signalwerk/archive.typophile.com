    html: |-
      <p>Can't identify either but can't stop thinking this /S looks borrowed from another font.<br>
      2 options:<br>
      - you're after the real name and I can't help more<br>
      - you just want to reproduce it and have enough skills to do it so your best choice is to start with Univers Ultra Condensed suggested by bojev, borrow the /S from <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/benton-sans" rel="nofollow">Benton Sans</a>/<a class="freelinking external" href="http://www.myfonts.com/search/futura" rel="nofollow">Futura</a> (squooshing it)/<a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/news-gothic" rel="nofollow">News Gothic</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/trade-gothic" rel="nofollow">Trade Gothic</a>. A ready-to-go alternative: <a class="freelinking external" href="http://www.myfonts.com/fonts/dunwich/lorimer-no-2-condensed" rel="nofollow">Lorimer no 2 Condensed</a>.</p>
