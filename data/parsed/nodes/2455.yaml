    html: "<p>I think those are called cupped serifs. <br> <br>The style is nice. The trouble I see is a color issue. It has to do with your thins. Take a look at the BETW combination. The B has some of the thinnest thins in the whole face. Compare it to the BE. The W is even more thick than them. True they won't be exactly the same, but they should *look* the same. I'd shoot for a uniform thin slightly less than the arms of the E. <br> <br>Oh here's a tip on E's. The arms shouldn't be of equal thickness or they will look unequal. I start with them equal, then add a hair to the bottom (heft is needed at the bottom), and shave a bit off the middle. Again the key is making them *look* the same. (top of T = bottom of E) <br> <br>While I'm at it, here are some common construction issues with caps: <br>F: Equals the E with the middle arm moved down slightly (sometimes extended), and the bottom right serif extended (how much is up to you) <br>L: Equals the E with the bottom arm shortened. <br>P: Bowl equals the top of the R dropped down a bit (or the R is raised up a bit.  <br>X: Watch out for <a href=\"http://www.typophile.com/forums/messages/29/21083.html?1074095015\">this</a> problem. (scroll down) <br> <br>Keep an eye on the curves on the S. They're wobbly through the spine. <br>I'd try a different leg on the R. With those fancy pants serifs it want's something more than a straight crutch. (also raise up the waist </p>"
