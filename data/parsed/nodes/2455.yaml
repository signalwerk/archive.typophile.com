    html: <p>&gt;&gt;With those fancy pants serifs... <br> <br>That's pretty much it, isn't it! It's just a bloody fancy, almost pretentious typeface. It is amazing what a few grouped beziers can say... <br> <br>&gt;&gt;And cupped serif does sound better. <br> <br>Do you think? I reckon "bifurcated" sounds fancier, "cupped" sounds more friendly, and reminds me of bra's. Thanks for the feedback, I realised that it is quite rough at this stage. It is a digitisation of a speciman I found in an old type journal. I am pretty much using it to have a play and familiarise myself with the older titling proportions.  <br> <br>kris.</p>
