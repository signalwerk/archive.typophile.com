      <p>I think “ugly” is a tongue-in-cheek word in this usage.  There are things you have to do in text sizes to keep counters open and joins to not feel heavy which, when enlarged greatly, just don’t look right. This was easily handled in the hot metal days where type was drawn specifically for the casting size. When Hrant says “ugly” just smile and think “visually adjusted to meet the needed characteristics for correct perception at small sizes”.  But, as you can see, that is quite a mouthful so maybe a new word is needed.  How about “Hugleigh”? It has the sound and feel of ugly but the warmth of a hug by Janet Leigh :-)</p>
      <p>ChrisL</p>
