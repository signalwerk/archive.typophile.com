      <p>Hey guys —</p>
      <p>Great feedback. I’m sure lots of people will find this as helpful as I do. I’m aware of learn fontlab fast. I think I read it about 10 times before even applying the tips and tricks. The extrema rule exception is particularly interesting. I suppose I’m always trying to make my shapes as smooth and beautiful as possible, but there are times when creating uglier forms is necessary — such as a really solid book face. I guess this is just like not skimping on points to stay true to your shapes — if you need to break the extrema rule to achieve a shape, that’s what you have to do.</p>
