    html: |-
      <p>Luke, </p>
      <p>Here are some axioms that can help you get better-quality outlines: </p>
      <p>Use the fewest number of points (segments) to achieve your desired outline.</p>
      <p>However, do not cheat the design by skimping on points where they are necessary.</p>
      <p>Place points on the extrema (top, bottom, left, right) of any curve. Those may be all you need for certain shapes. The points on extrema help rasterizers align letters with their neighbors via hints.</p>
      <p>Do a lot of digitization in the environment (software) you expect to use primarily. Though Illustrator and FontLab employ beziers, the behavior of certain tools in Illustrator is not as useful for letter design as the type drawing tools in FL. </p>
      <p>If you follow the above guides, and spend time digitizing, you will see there’s not much to document.</p>
