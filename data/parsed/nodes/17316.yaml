    html: |-
      <p>&gt;Place points on the extrema (top, bottom, left, right) of any curve.</p>
      <p>Ah, that brings up an important question. This rule about extrema is often said, but also often broken. For example, if you open up Adobe Garamond Pro, and turn on ‘font audit’, you will see that practically every serif is drawn without an extremum, and is flagged for possible correction. </p>
      <p>I find it hard to believe that Slimbach doesn’t know what he is doing, and I think I read somewhere that defining the extrema is important for the stems and arcs, but not for small terminals, such as that on the e, which are not normally hinted anyway, I believe. </p>
      <p>Can some of you tech mavens clarify when putting points on extrema is important and when not?</p>
      <p>For me, sometimes I haven’t been able to make some convex curves at terminals look good with nodes placed at the extrema. Concave curves seem to be more amenable to accepting the extrema.</p>
