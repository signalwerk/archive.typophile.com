    html: |-
      <p>&gt;“ugly” is a tongue-in-cheek word</p>
      <p>I think that Hrant and I have a substantive disagreement, though I may be wrong. I think that in general good aesthetics is a plus for a typeface, and only should be compromised with great reluctance. </p>
      <p>I don’t think you can make a 9 point type as elegant as an 18 point type and keep it readable. It needs lower contrast and shorter extenders. But this doesn’t mean it has to be ugly. The distortions for the sake of legibility, such as in the joins, don’t have to be so great at normal text sizes to make the characters ugly.</p>
