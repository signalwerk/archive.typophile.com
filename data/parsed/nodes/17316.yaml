  html: <p>There is quite a lot written on the form of letters — structures, balances, styles etc etc, but seemingly very little written on the actual digital construction of the forms themselves. It seems to me that when you get your head around general principles of letters, you’re expected to bumble through the digitalisation process, working out bezier principles through trial and error. Now I’m not saying there is anything wrong with this process per se — observing how others have done it, and trying yourself. But, it just doesnt seem there is enough documented on this subject. I can only really say that leslie carbarga’s font and logo lettering bible is all I’ve come across that touches on this subject — and even this isn’t all that helpful. I could be looking in all the wrong places of course?</p>
