    html: |-
      <p>Great question, dux.</p>
      <p>The Fontlab manual for 4.6 was an index of functions, rather than an explanation of how to use the functions in drawing and production. The new manual for 5.0 I am just starting to look at, and it seems to be quite a bit better written, but still an index of functions. </p>
      <p>Leslie Cabarga’s ‘Learn Fontlab Fast’ is essential reading as it starts to explain the ‘How to’ of using the functions. —Do you know this book?</p>
      <p>Still, it is only a start. The “How to” Section here in the Typowiki has a lot of good stuff also, thanks to experienced pros like John Hudson and David Berlow, who have written stuff in threads that have been posted there. </p>
      <p>Here are a couple of things I have gleaned from Typophile or by trial and error or elsewhere, confirmed on Typophile. </p>
      <p><strong>Task</strong>: Revising glyphs to get ‘best version.’<br>
      <strong>How to</strong>: Paste the existing glyph to mask before starting revisions. That way you know what you are changing, and can easily go back selectively, and not only by ‘undo’. I put the ‘mask’ tool bar on the desk top so it is instantly accessible. Also, revise in context. Have the preview window open, big enough to see the curves but small enough to see the context of a number of side-by-side glyphs.</p>
      <p><strong>Task</strong>: Smoothing out ‘bumps’ and fixing awkward curves.<br>
      <strong>How to</strong>: Make use of the shift key. With the shift key down, if you click and hold on a non-selected bezier node you can slide it while keeping the bezier handle points fixed. This sometimes magically takes out bumps, where moving the handles around trying to do the same thing will just drive you crazy. Also, with the shift key down clicking on a non-selected handle point while enable you to drag the handle point while keeping the handle the same angle and the node fixed. Being able to move either the node while keeping the handles fixed or visa versa really gives you a lot more control in fixing curves. You can, for example, first take out the lump moving the node, then fix the resulting curve by moving the handles.  </p>
      <p>There are no doubt more and better ways for these two tasks, and for sure a lot more good guidelines for other tasks in drawing and production; I would love to learn other people’s techniques on these and other tasks. The best could go to the Typowiki ‘How to’.</p>
