    html: <p>I was so hoping that he'd have won at least one of the two MTV MusicAwards he was nominated for. The video was one of the most touching I've seen in a very long time, the song is a killer and it would simply have been nice to see someone like Cash win something... anything... on a channel like MTV. Instead we get Justin Timberlake. Yeah... right. I hope now that Cash is dead, someone at MTV is kicking him- or herself in the bee-hind ;-). </p>
