    html: <p>If the fonts are called the same, then they clash. The obvious solution is to rename the font, say call it "Helvetica Neue Type1" instead of "Helvetica Neue". It is less expensive than buying a font called "Helvetica Neue Std" or anything else if you don't need it.</p>
