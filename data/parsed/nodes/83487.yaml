  html: |-
    <p>Don't laugh, until April of this this year I was still running OS9 and using Type1 fonts... now I'm on OSX and need to migrate my typefaces, but not all are enjoying the experience. Helvetica Neue, which I bought from Adobe back in the early 1990's as part of a typeface collection, keeps disappearing. Fontbook is of no help, and Adobe has not answered my emails about a cheap upgrade(? I can't afford the $961 for the same font in a new format, thanks Adobe). </p>
    <p>I still have the original Adobe CD, but i guess they don't care. Has anyone here ever successfully talked Adobe into a format upgrade without shelling out a stack of cash?</p>
