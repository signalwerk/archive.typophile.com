      <p>Read this (or even better: copy and print out):</p>
      <p><a href="http://www.jklstudios.com/misc/osxfonts.html" title="http://www.jklstudios.com/misc/osxfonts.html">http://www.jklstudios.com/misc/osxfonts.html</a></p>
      <p>All the info re HelveticaNeue you need is there. </p>
      <p>As to converting to other font formats: in al lot of cases this is not necessary.</p>
      <p>On another note: OS X does NOT like font suitcases with multiple files in them (family styles, combinations of different cuts, etc.). These need to be smashed into separate files (eg using Smasher, or on an old computer with OS 9 and a Font/DA-Mover-like application</p>
