    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 17.Mar.2009 2.24pm </div>
      <p>For Immediate Release<br>
    Buffalo, NY- March 17th, 2009</p>
    <p>P22 proudly announces Kelly Pro by Ted Staunton</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/KellyFlag_5349.gif"></div><p></p>
    <p>P22 Kelly Pro is a Celtic-styled uncial font with a medieval gothic flavor<br>
    and an overall contemporary feel. The font is an addition to the Sherwood<br>
    Collection of historical and period-based fonts by Ted Staunton. It is<br>
    ideal for uses that need to evoke the Celtic spirit or the medieval period.</p>
    <p>The font is available in pro and basic OpenType styles. Kelly Pro combines<br>
    the two basic OpenType styles, Regular and Alt Caps, into one font and adds<br>
    Pro OpenType features such as swashes, additional titling caps and Central<br>
    European character sets. The Regular and Alt Caps styles are each available<br>
    separately. The two fonts share the same lower case with stylistically<br>
    different upper case designs.</p>
    <p>Introductory offer through March 31st.</p>
    <p><a href="http://www.p22.com/sherwoodtype/kelly.html" title="http://www.p22.com/sherwoodtype/kelly.html">http://www.p22.com/sherwoodtype/kelly.html</a></p>
