  html: "<p>Hi all, <br> <br>the subject says it: does anybody know when Linotype officially released their Optima nova? The article on creativepro (see the News &amp; Events section) is from Nov. 3rd, but I think the font has been released somewhat longer ago (I found different dates in different sources). Some fellows and I are just wondering. <br> <br>Regards <br>jpg <br> <br>PS: Don't hesitate to post your thoughts about the revised Optima if you have some.</p>"
