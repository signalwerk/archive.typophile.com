    votes: null
    html: <p>Thank you for your replies. <br> <br>Personally, I think that the old Optima (allow me to call it Optima classica) hasn't become obsolete and can still justify its existence. It's not that I didn't like Optima nova. I do. How could I not? The Optima nova family is really easy on the eyes (I do like those italics and Optima Titling), well constructed, significantly more complete than its predecessor and thus pretty versatile (as could be said - much to my delight - about the whole Linotype Platinum series). <br> <br>But for me, Optima classica shows a pattern of elegance Optima nova hardly can come up to. Undoubtedly, Zapf and Kobayashi knew what they were doing when they (maybe bravely) redesigned Optima and possibly they had slightly different objectives in mind than Zapf has had back in the Fifties. The new, more serifed Optima obviously has some strong qualities of its own, but, IMHO, can't fully replace Optima classica (and perhaps was never meant to). <br> <br>Again, your opinion is most welcome. <br> <br>jpg</p>
    html_clean: <p>Thank you for your replies. <br> <br>Personally, I think that the old Optima (allow me to call it Optima classica) hasn't become obsolete and can still justify its existence. It's not that I didn't like Optima nova. I do. How could I not? The Optima nova family is really easy on the eyes (I do like those italics and Optima Titling), well constructed, significantly more complete than its predecessor and thus pretty versatile (as could be said - much to my delight - about the whole Linotype Platinum series). <br> <br>But for me, Optima classica shows a pattern of elegance Optima nova hardly can come up to. Undoubtedly, Zapf and Kobayashi knew what they were doing when they (maybe bravely) redesigned Optima and possibly they had slightly different objectives in mind than Zapf has had back in the Fifties. The new, more serifed Optima obviously has some strong qualities of its own, but, IMHO, can't fully replace Optima classica (and perhaps was never meant to). <br> <br>Again, your opinion is most welcome. <br> <br>jpg</p>
