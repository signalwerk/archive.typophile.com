      <p>There are a number of newer sans typefaces with "two-story" lowercase g's.</p>
      <p>I would suggest <a href="http://www.vllg.com/Thirstype/ApexNew/" rel="nofollow">Apex New</a> for one.</p>
      <p>and if they like Meta, maybe consider <a href="http://www.fontshop.com/search/?q=unit&amp;x=0&amp;y=0&amp;sample_text=gtp&amp;sample_size=96" rel="nofollow">FF Unit</a></p>
