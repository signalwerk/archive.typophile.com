      <p><em>I wouldn’t call the interviewees talking heads. When have you ever heard from most of these guys beyond the odd magazine article or design conference? Part of the value of the film is that it gives graphic designers and type designers a voice on film. That is very rare.</em></p>
      <p>"Talking head" is a popular term used to describe anybody interviewed on a screen for any purpose. Wiktionary defines it as, "(idiomatic) A pundit who discusses issues of the day, especially one on TV." <a href="http://en.wiktionary.org/wiki/talking_head" title="http://en.wiktionary.org/wiki/talking_head">http://en.wiktionary.org/wiki/talking_head</a></p>
      <p>My use of the rem is broader than that. At least as broad as it is long.</p>
      <p>The problem with Helvetica is that it only gives a handful of designers and type designers a voice on film. That's disappointing. It isn't broad enuff.</p>
      <p><em>I found the titles perfectly appropriate. Helvetica is important for its neutrality (or dullness for some) and ubiquity. To do something different just for the sake of being different ignores the soul of Helvetica.</em></p>
      <p>Your view and interpretation of what Helvetica is and the uses it can be put to is a bit conservative in my estimation. I advocate doing something different with it (for the film's titles) not merely for the sake off being different, but to reduce the yawn factor. Helvetica's soul can survive any assault, mild or extreme.</p>
      <p><em>I’m interested. What sort of music says Helvetica to you? Hustwit’s choices were personal, but carefully considered, and I think they fit the subject well.</em></p>
      <p>The music Hustwit chose was unimaginative and had a dulling effect. Fitting the subject is one thing, sending the audience to sleep is something else.</p>
      <p>There is more to documentary filmmaking than appropriateness, if you follow the significance of that. For example, by doing something unexpected and pushing the interpretation at the edges a flimmaker can throw a new perspective on the subject. It all has to do with catching the audience off-guard and taking a fresh look at things.</p>
      <p>j a m e s</p>
