      <p>What about the other music candidates? Any of those appeal to you? Satie is anything but sleep-inducing. Bach is pretty exciting. Miles mesmerizes.</p>
      <p>One thing is for sure, Helveeta the font is quite generic and goes with just about anything, yet Hustwit's film is remarkably one-dimensional. Surely he could have come up with a lot more in the way of opinions and context. Only the bigwigs in the type business and a few prominent graphic designers like Carson and Brody are included, along with a few isolated draftsmen connected with the original font's creation.</p>
      <p>Narrow, narrow, too narrow even for pretend consideration.</p>
