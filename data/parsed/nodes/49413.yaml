    <p><strong>Sum up:</strong> On the <a href="http://typophile.com/node/47892" rel="nofollow">Advice on establishing an Australian type club thread</a> I said "the only interesting person in Helvetica is David Carson." That was overstating it. Carson isn't the only talking head worthy of your attention in Gary Hustwit's documentary on Max Meidinger's ubiquitous mid-century grotesk. Jonathan Hoefler and Tobias Frere Jones give David Carson a decent run for his money. Hoefler in particular came across as we would expect such a type luminary to—articulate, lucid, quick-witted and well-informed. Frere Jones was more sober yet no less erudite or cultured than his partner. Matthew Carter was absorbing and informative.</p>
    <p>What disappointed me about this film was its near complete absence of teeth. It's just plain dull. A balanced view of Helvetica the font should present more than a handful of the type world's biggest and brightest stars. Hustwit made the mistake of focussing on mainstream opinion and mainstream use of Helvetica, and went on repeating this mistake for a mind-numbing eighty minutes of trite, safe, risk-free pandering to the lowest common denominator.</p>
    <p>Where are all the other stars in the typosphere, such as Nick Shinn, Robert Slimbach, Sumner Stone, Gerald Giampa, Stuart Sandler, Tiffany Wardle, Rebecca Alaccari, Brian Bonislawsky, Richard Kegler, Peter Bruhn, Peter Bilak, Stephen Coles, James Grieshaber, Carl Crossgrove, Ray Larabie, Erik van Bokland, Hrant H. Papazian, Akira Kobayashi, Shu?</p>
    <p>Where are the opinions of working graphic designers who hate the flipping thing? Why did Hustwit limit the expression of opinions on Helvetica to talking heads, and why limit samples of the font in action to signage and other real world use? It's a film for crying out loud. Cinema is a visual medium and Gary Hustwit simply did not make use of its many possibilities.</p>
    <p>Made-up samples of Helvetica made specially for the film could have been made to voice the views of less important type people. The titles are set in Helvetica, but designed and executed in an almost insufferably dull fashion. A boring font Helvetica may be (depending on your point of view), but artists are supposed to do interesting and surprizing things with boring fonts, aren't they?</p>
    <p>I'm hardly what you'd call a type geek, yet the film contains absolutely no factual information on the Helvetica font I did not know already. At the end of it I thought of a dozen ways it could have been made a superior, more interesting, stimulating and informative viewing experience. Instead Hustwit delivered <em>Nothing New About Helvetica</em>.</p>
    <p><strong>Spec notes:</strong> At 80 minutes it's far too long. The music is blows Dimetrodons.<br>
    <strong>Rivals:</strong> The Life of Al Gore, A World Without Zinc, Beyond 'The Golden Compass'.<br>
    <strong>Also try:</strong> Standing outside a train station and greeting commuters like they are guests arriving at your birthday party.<br>
    <strong>Rating:</strong> Two stars.<br>
    <strong>My choice:</strong> No, sorry. I sort of want to like it but I can't.</p>
