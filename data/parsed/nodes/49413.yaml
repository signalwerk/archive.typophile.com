      <p>Helvetica is so generic a typeface it can be contrasted with almost anything in any setting. That's kind of the whole point of my review and my take on the film as well as the type itself.</p>
      <p>Typophiles seem to have a black &amp; white view of the type itself. I have been saying for almost a year now that Helvetica in bold weights really isn't so bad. Certainly it's more robust and malleable in bold or heavy guise, altogether less ugly, more palatable, and a lot more chuckable in the the hands of graphic designers and typographers who use it.</p>
      <p><strong>Alternative music candidates</strong><br>
      Philip Glass  -- Glassworks [Rubrid Facades Floe, Islands], Akenaten,<br>
      <a href="http://en.wikipedia.org/wiki/Philip_Glass" title="http://en.wikipedia.org/wiki/Philip_Glass">http://en.wikipedia.org/wiki/Philip_Glass</a><br>
      Steve Reich  -- Tehilim, Drumming, Six Pianos, Music for 18 Musicians<br>
      <a href="http://en.wikipedia.org/wiki/Steve_Reich" title="http://en.wikipedia.org/wiki/Steve_Reich">http://en.wikipedia.org/wiki/Steve_Reich</a><br>
      John Adams -- Short Ride in a Fast Macine, Shaker Loops<br>
      n.wikipedia.org/wiki/John_Adams_(composer)<br>
      Eric Satie -- gymnopaedie<br>
      <a href="http://en.wikipedia.org/wiki/Erik_Satie" title="http://en.wikipedia.org/wiki/Erik_Satie">http://en.wikipedia.org/wiki/Erik_Satie</a><br>
      Bill Evans --<br>
      <a href="http://en.wikipedia.org/wiki/Bill_Evans" title="http://en.wikipedia.org/wiki/Bill_Evans">http://en.wikipedia.org/wiki/Bill_Evans</a></p>
      <p><strong>But also try:</strong><br>
      Grace Jones -- Slave to the Rhythm (get it yet?)<br>
      Miles Davis<br>
      The Art of Noise<br>
      Weather Report<br>
      Johanne Sebastian Bach</p>
      <p>j a m e s</p>
