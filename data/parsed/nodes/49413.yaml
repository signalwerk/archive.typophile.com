      <p>&gt; Why did Hustwit limit the expression of opinions on Helvetica to talking heads</p>
      <p>I wouldn't call the interviewees talking heads. When have you ever heard from most of these guys beyond the odd magazine article or design conference? Part of the value of the film is that it gives graphic designers and type designers a voice on film. That is very rare.</p>
      <p>&gt; The titles are set in Helvetica, but designed and executed in an almost insufferably dull fashion.</p>
      <p>I found the titles perfectly appropriate. Helvetica is important for its neutrality (or dullness for some) and ubiquity. To do something different just for the sake of being different ignores the soul of Helvetica.</p>
      <p>&gt;  music is blows Dimetrodons</p>
      <p>I'm interested. What sort of music says Helvetica to you? <a href="http://www.flickr.com/photos/stewf/579455436/" rel="nofollow">Hustwit's choices</a> were personal, but carefully considered, and I think they fit the subject well.</p>
