    <p>Im working on poster and like to hear some fead back I have 2 versions. I started with illustration drawing and now leaning on digital. It is reflection on Time and time by using Kin Hubbard quote «The bee isn't really that busy — it just can't buzz any slower.» Final size will be  40in  or abut  101cm high. </p>
    <p>Link: <a class="freelinking external" href="http://www.behance.net/gallery/The-Bee/1074745" rel="nofollow">The Bees</a></p>
