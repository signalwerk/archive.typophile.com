    <p>I am working on a brand for a summer-long church event. The brand theme is as follows (in order of importance):</p>
    <p>1. Compliment an Old World themed room (Think Tuscany)<br>
    2. Contain Palm Trees in the imagery<br>
    3. Have a luau feel to it<br>
    4. Fun, family, summertime</p>
    <p>Don't know if that helps paint a picture in your mind, but my issue is finding a typeface to anchor this brand design. Any thoughts or suggestions are welcome.</p>
    <p>Thanks in advance!</p>
    <p>Brent</p>
