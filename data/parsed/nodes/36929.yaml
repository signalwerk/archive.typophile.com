    <p>Last Tuesday I was asked to replace a speaker who has to drop out of the conference at the last minute. I won't be in the printed programme, but I suppose my presentation details will soon be included in the online <a href="http://atypi.org/05_Brighton/20_main_program" rel="nofollow">programme presentations timetable</a>.</p>
    <p>Until this is arranged, below are the details of my presentation in case anyone's interested in showing up.</p>
    <p>__________________________</p>
    <p><strong>Oversampled</strong><br>
    __________________________</p>
    <p><em>Yves Peters</em></p>
    <p><strong><em>Friday 14 September</em> | 10:45 – 11:15<br>
    Location: Seminar Room 202</strong><br>
    Presentation | Theme: <em>Hand made</em> | Duration: 30 minutes</p>
    <p>For as long as type has existed, successful designs have been copied by competing foundries. More recently, the grunge boom in the nineties saw the birth of a new, punk-influenced design aesthetic. Aspiring type designers with no formal training adopted the DIY attitude, disassembling the outlines of existing typefaces and reconstructing them into bastard hybrids. This approach is similar to sampling in hip hop, where rhythm tracks are assembled by rearranging snippets of existing songs. But whereas the music business provides a legal framework for sampling, the type industry has yet to formally address this phenomenon.</p>
    <p>__________________________</p>
    <p><strong>Speaker details</strong></p>
    <p>Yves Peters is a [typo]graphic designer, writer about type, rock drummer and father of three. After a three-year stint as type expert/technical advisor at the Belgian FontShop franchise, he was hired by communication agency Making Magazines, now Magelaan.</p>
    <p>Yves joined the Typophile community in 2002, where he currently is head moderator of the Type Identification Board. Besides reviewing typefaces for David John Earls’ Typographer.org, Yves edits Unzipped – his blog for FontShop Benelux – and makes occasional contributions to Typographica and The FontFeed. Together with Stephen Coles, he is responsible for cross-referencing the current edition of FontBook.</p>
    <p>His talent for being able to identify most typefaces on sight is utterly useless in daily life.</p>
