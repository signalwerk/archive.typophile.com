      <p>I knew Gerald all of two hours.</p>
      <p>I'd walked into the antique shop looking for metal type and wanting to see if I could gather complete alphabets from the little bins they had there. As I searched amongst the letters, Gerald came over and, upon discovering I was interested in letterpress and typography, talked with me about his work in letterpress and the old days. I had no idea who he was at the time, but his eyes lit up while telling me his stories and sharing his knowledge. Those two hours I spent gathering bits of metal and learning about the ins &amp; outs of letterpress and making typefaces from such a great man in the industry were simply marvelous. Indeed I was sad to leave and hoped to return to talk to him again; to learn from him again. Sadly, I will never have the chance.</p>
      <p>Thank you Gerald, for your kindness and passion to share your knowledge. It was an honor to meet you, even briefly, and I felt inspired by your words. Safe journeys, and be at peace.</p>
    html_clean: |-
