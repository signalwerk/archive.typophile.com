    html: |-
      <p>Thanks from here also, John. I'm sorry to hear this.</p>
      <p>I worked with Gerald about 1990 in bringing Pabst out in digital form. I used to keep the 1923 ATF book by my desk at the ad agency where I was type director. Art directors would thumb through it, looking for something "new." When a guy insisted Pabst was the "only" face that would work for a new Dow product, he was in luck, for I knew Gerald had the metal patterns.</p>
      <p>Gerald offered me a ridiculously low price to digitize the roman, but at that date he did not know if he had the patterns for the italic (so we just slanted the roman in Quark; looked like hell). It was quite a trip. We had lots of back-and-forth about letterfit, where in the character set to place the special logotypes, etc.</p>
      <p>I hate that typeface, and I cringe when I see it, recalling that I had a hand in making it newly available (even though eventually it would come to life again, I suppose). But the phone calls and faxes (no e-mail then) with Gerald made it all worthwhile.</p>
      <p>I just re-read this good thread, to which Gerald made many posts (it is one of those to which Kent alludes above, I'm sure):</p>
      <p><a href="https://web.archive.org/web/20150125233917/http://typophile.com/node/5303" title="http://typophile.com/node/5303">http://typophile.com/node/5303</a></p>
      <p>Re-read it all. The last post is a fitting self-eulogy for Gerald.</p>
      <p>I will raise a glass to him this evening (or sooner if I get lucky).</p>
      <p>powers</p>
