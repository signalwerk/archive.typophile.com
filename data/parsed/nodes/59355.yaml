    html: |-
      <p>One of the funny things about Gerald was how different his online persona seemed from his in-person demeanor. Or so is my impression: I only ever really hung out with him once, at TypeCon 2002 in Toronto I think it was. I ended up sitting next to him at dinner and enjoying some good conversation. He was hoping to get Adobe (my then-employer) to buy Lanston's assets, but we weren't all that interested (and perhaps the price was still a bit high).</p>
      <p>Unless I have this confused with a different Toronto type conference a few years earlier, the Indian food we were eating was fabulous. I had a tandoori cauliflower that was to die for... I had always hated cauliflower before that night.</p>
      <p>Cheers,</p>
      <p>T</p>
