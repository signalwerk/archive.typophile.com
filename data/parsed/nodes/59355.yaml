    html: |-
      <p>Thanks for posting that photograph, Gerry. It's a lovely image of Gerald and Jim in their typographical element.</p>
      <p>Speaking of elements, I think the period when I saw a lot of Gerald in the mid-90s must have been the only time in his life when he didn't have a boat in the water. He felt the lack keenly.</p>
      <p>Two nautical (mis)adventures of which you have reminded me:</p>
      <p>Gerald recounted sailing up to Deep Cove and spending a long lunch in the pub there before rowing back out to his boat, hoisting canvas and heading back down the Sound. Don't drink and sail. He forgot to haul in his anchor, and it dragged along behind him, catching the lines of several other boats and pulling them after him while their owners shouted from the shore in alarm.</p>
      <p>Gerald and his then wife, Mary Jane, were living aboard a boat moored at Granville Island. They'd gone to bed for the night, but were alerted by a cry and a loud splash. A drunk staggering out of the Arts Club Lounge had tripped and fallen into False Creek. Gerald and Mary Jane rushed on deck to rescue him, and other drinkers emerging from the bar were greeted by the sight of Gerald, stark naked, hanging over the edge of the boat trying to keep the waterlogged man above water.</p>
      <p>It seems to be a characteristic of Gerald's stories that they end at the funny bit, and I never found out how the situations were resolved.<br>
      ___</p>
      <p>P22 Foundry, who purchased Lanston from Gerald, still host the eccentric website he made including the <a href="https://web.archive.org/web/20150125233917/http://www.p22.com/Lanston/Giampa/GiampaTour.html" rel="nofollow">biographical pages</a>. These end before his return to Vancouver from Finland.</p>
      <p>‘I started with nothing, and still have most of it left.’</p>
