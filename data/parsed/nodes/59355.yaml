      <p>This is all truly sad. </p>
      <p>I've been going through some e-mail correspondence I had with Gerald in 2004 (a first: reading e-mail from a deceased person). We had felt a sudden kinship during some rage at Typophile and I wanted him to come to Stockholm (this was during the period he was living in the Finnish archipelago, not too far away) and give a lecture at the Typographic Guild.<br>
      And as bold as some of his statements were on this site (and his own), as humble – or dare I say shy – was his response. He would love to, but admitted he wasn't much of a speaker(!) It could be one of those weeding speech intros; "I'm not much of a speaker, but..." and then go on forever, but I actually believe he was sincere. Not much of an ego there. Unfortunately for the Guild he soon left Finland for Canada. And now, onwards, upwards. Oh, well...</p>
      <p>ƒ</p>
