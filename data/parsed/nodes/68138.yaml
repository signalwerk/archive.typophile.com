      <p>Splendid idea! Perhaps you should stretch n, h and u a hair's breadth wider. H and N even more. "g" looks good when it is big but when it is small the neck looks a bit clumsy. Perhaps try to lower the loop a little bit.<br>
      Good luck with the "s"!</p>
