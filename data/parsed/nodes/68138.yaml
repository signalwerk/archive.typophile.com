      <p>Hey, lovely idea here! naturally being a art school student, I grown quite a pious reverence for helvetica in all it's forms, but its cool to see it alternatives being thought up.</p>
      <p>I like the idea present in the /K/ but it seems pretty wide.</p>
      <p>The simplicity of the /G/ is exciting to me, maybe a similar treatment for the /Q/?</p>
      <p>There is something weird in the joint of the /Y/, not quite sure what but take a closer look.</p>
      <p>The right of the /W/ has a weird moment at the baseline joints.</p>
      <p>Maybe you can play with the flag of the /r/ its pretty intense right now.</p>
      <p>Regardless, nice stuff going on here. There is really something about the /G/, maybe it's just me.</p>
