  html: |-
    <p>All magazines that think they've got something serious to tell about wellness, as well as lots and lots of companies that operate in the field of well-being, find it hard to choose anything different from Helvetica Light Extended. I don't blame them, it looks awfully good (I was going to type <cite>awesome</cite>, but that's a bit too much...).</p>
    <p>Anyway, I thought "Why not make them an alternative?". Light, wide, clean... I've used a big part of my free Sunday to draw up some glyps. They need a lot more work, but I'ld like to hear your opinions for now...</p>
    <p>Thanks.</p>
