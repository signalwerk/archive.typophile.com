    html: "<p>Last year, I picked up a light trade paperback, John Man's <a href=\"https://web.archive.org/web/20081007111341/http://www.amazon.com/exec/obidos/tg/detail/-/0747245053/ref=lpr_g_1/103-4593740-6655052?v=glance&amp;s=books&amp;n=507846\" target=\"_blank\">The Gutenberg Revolution: The story of a genius and an invention that changed the world</a>. <br> <br>Like most Gutenberg scholarship, Man's book seems to to based heavily on speculation, as very little detail is known about the facts of Gutenberg's life. Man makes both speculations of his own, and summarizes the speculations of others he seems to agree with. A good attempt is made throughout the book at trying to get an angle on Gutenberg's business operations; how much money he had, where he got it, depts, court cases and other civil &amp; legal records, etc. One can easily imagine how things could have gone the other way for Gutenberg, changing the course of history (at least a little bit</p>"
