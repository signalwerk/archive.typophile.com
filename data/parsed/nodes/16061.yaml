    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Carol Twombly</strong></p>
    <p>Carol Twombly (1959-) studied architecture at the <a href="/wiki/RISD" class="freelinking" rel="nofollow">Rhode Island School of Design</a>, and went on to become one of the five students to get master's degrees in type design from <a href="/wiki/Charles%20Bigelow" class="freelinking" rel="nofollow">Charles Bigelow</a> at Stanford. Twombly briefly worked for Bigelow as well. Her typeface <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=BT.6414.0.0" rel="nofollow">Mirarae</a> won the Morisawa type design competition, and was produced by Bitstream. She worked for <a href="/wiki/Adobe%20Systems" class="freelinking" rel="nofollow">Adobe Systems</a> from 1988-99, producing many well-known typefaces, including <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=LH.398.0.0" rel="nofollow">Lithos</a>, <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=LH.108134.0.0" rel="nofollow">Trajan</a>, and <a href="http://store.adobe.com/type/browser/P/P_180.html" rel="nofollow">Adobe Caslon</a>. She retired from type design and left Adobe in 1999 to do other crafts, such as textile-based design and jewellery.</p>
