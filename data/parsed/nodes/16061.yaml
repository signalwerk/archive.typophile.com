    <p>Carol Twombly (1959-) studied architecture at the <a href="/node/12180/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Rhode Island School of Design</a>, and went on to become one of the five students to get master’s degrees in type design from <a href="/node/add/wiki?edit%5Btitle%5D=Charles%20Bigelow" title="Create node &quot;Charles Bigelow&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Charles Bigelow</a> at Stanford. Twombly briefly worked for Bigelow as well. Her typeface <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=BT.6414.0.0" class="link-external">Mirarae</a> won the Morisawa type design competition, and was produced by Bitstream. She worked for <a href="/node/16058/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Adobe Systems</a> from 1988-99, producing many well-known typefaces, including <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=LH.398.0.0" class="link-external">Lithos</a>, <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=LH.108134.0.0" class="link-external">Trajan</a>, and <a href="http://store.adobe.com/type/browser/P/P_180.html" class="link-external">Adobe Caslon</a>. She retired from type design and left Adobe in 1999 to do other crafts, such as textile-based design and&nbsp;jewellery.</p>
