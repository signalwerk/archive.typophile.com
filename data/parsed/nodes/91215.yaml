    <p>Hello everyone,<br>
    I've looked for a solution for this problem for almost 2 days. I usually don't write on forums because I always find someone who already had my problem and have a solution, but well, this is time is my time to have a problem unsolved. </p>
    <p>So,<br>
    I created a new typeface and installed it as .otf<br>
    and it works well on all my programs (on mac) : textedit, open office, indesign<br>
    but it doesn't work on word (macintosh).... -_- it doesn't even appear in the list of fonts<br>
    very strange thing, it does work on word (windows).<br>
    Edit : I also tried with .ttf (same problem)</p>
    <p>I need to make it work on mac as well. Anyone already had this problem and know a solution ? </p>
    <p>So, please,<br>
    Help ! :( </p>
    <p>Thank you,</p>
    <p>Steffi.</p>
