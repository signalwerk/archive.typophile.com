      <p>Hi and thank you for your help !</p>
      <p>The name of the font is COHDA-Regular. It's a font made from pictograms for an visual identity.<br>
      I made it with Glyphs software. So, I've made only one version, the regular one.<br>
      How can I know if the FontInfo follow the word convention ?</p>
      <p>I didn't have to change anything in word on my pc, it works well.<br>
      And I did try everything on my mac, including support of foreign languages. Still, the font doesn't even appear. </p>
      <p>Also I gave the font to a friend to try it on another pc. He told me only the first line of his keyboard from A to P works. All the others letters of this font doesn't work.... ??????????</p>
      <p>Thank you again for your help :)<br>
      Steffi</p>
