  html: "<p>Why is Linotype claiming ownership of Eurostile and filing trademark applications when it is in the public domain? <br> <br>Following are Adobe's notes on Eurostile <br> <br>Typeface notes: <br>In 1952, Aldo Novarese and A. Butti designed Microgramma for the Nebiolo foundry. It was a popular face, but was available only in capitals. In 1962, Novarese produced a full character set, including lowercase letters, and the foundry renamed the family Eurostile. The letters are square-shaped with rounded corners, producing a look reminiscent of the machinery, technology, and interior design of the 1950s. <br>Designers: <br>A. Butti <br>Aldo Novarese <br>Eurostile is a trademark of Nebiolo.</p>"
