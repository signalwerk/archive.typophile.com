    html: <p>If a trademark has been abandoned, it does not automatically enter the public domain. A trademark can be judged to have entered the public domain if it has become a generic term and has not been legally defended by a company claiming the trademark. But if a company ceases to exist or simply neglects its trademarks, it is possible for another company to try to register that trademark. The application can be challenged by other companies, or by individuals if they believe that the name has become a generic term. <br> <br> <br>Habemus papam!</p>
