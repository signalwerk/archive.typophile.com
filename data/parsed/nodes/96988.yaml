  html: <p>I've done PS autohints, but couldn't fix one thing. The font has pretty tight spacing and while individual glyphs hint well, they seem to merge in small sizes. I'd like to add more space between glyphs in small sizes (I'm thinking minimum 1px of space between glyphs). Is this something possible to fix in PS hinting?</p>
  html_clean: <p>I've done PS autohints, but couldn't fix one thing. The font has pretty tight spacing and while individual glyphs hint well, they seem to merge in small sizes. I'd like to add more space between glyphs in small sizes (I'm thinking minimum 1px of space between glyphs). Is this something possible to fix in PS hinting?</p>
