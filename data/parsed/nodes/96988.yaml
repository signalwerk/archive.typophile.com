    html: <p>No, this is not something you can do in the PS hinting. It is something you can do with TrueType <em>in some rendering environments,</em> but increasingly the only way to obtain variations in spacing at particular sizes is to make separate fonts for those sizes with appropriately spaced glyphs.</p>
