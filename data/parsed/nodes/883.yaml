  html: '<p>Advanced Font Production Workshop, TypeGallery Added to TypeCon2002 Program. <br> <br>BUFFALO, NY, MAY 24, 2002 - The Society of Typographic Aficionados (SOTA) has announced additional programming for TypeCon2002. To be held in Toronto, Ontario, Canada, July 12-14, the fourth annual event is presented by SOTA and The Type Club of Toronto. <br> <br>Digital Font Production 201: Advanced FontLab is aimed at working type designers seeking to enhance their technical skills in FontLab. Topics include new font editing tools, advanced TrueType hinting, creating OpenType fonts and more. This workshop is geared toward experienced font designers. <br> <br>Hosted by FontLab, this workshop will be held on Friday, July 12. This session is limited to 12 participants, with space available on a first-come, first-served basis. Attendees must be registered for TypeCon2002 to participate in this event. The cost for DFP201 is $100USD/$160CAD. <br> <br>Conference organizers have issued a Call for Entries for the TypeCon2002  TypeGallery, an unjuried showcase of new type designs and typography from around the world. The TypeGallery will be on exhibit continuously during TypeCon2002. An online exhibition will go live at the TypeGallery website after the close of the conference. Details on submitting work for inclusion in the gallery can be found at the TypeCon2002 website, or by emailing mailto:<a href="mailto:tamye@typesociety.org">tamye@typesociety.org</a>. <br> <br>TypeCon2002 will take place at the Courtyard by Marriott in downtown Toronto. Discounted hotel room rates are available to conference attendees. Please visit the conference website for details. <br> <br>TypeCon2002 is the annual event of the not-for-profit Society of Typographic Aficionados, an international organization dedicated to the promotion, study, and support of typography and related arts. Secure conference registration and further information is available at <a href="http://www.typecon2002.com" target="_top">http://www.typecon2002.com</a>, or by email at mailto:<a href="mailto:info@typecon2002.com">info@typecon2002.com</a>. For more information about SOTA, please visit the website at <a href="http://www.typesociety.org" target="_top">http://www.typesociety.org</a>, or email mailto:<a href="mailto:info@typesociety.org">info@typesociety.org</a>.</p>'
