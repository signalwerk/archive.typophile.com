    html: "<p>Hrant, thank you.  <br>I immediately tried to find it, but I didn't succeed:  <br>Not abebooks, nor amazon, nor german-european used books site gave me any  <br>reference to Parkes :-(  <br>Do you know any special site to look there? <br> <br>Stephen, thats a very interesting thread.  <br>I didn't know it before. Thank you for leading me there. <br> <br>Maybe I'm wrong, but I like to dig out a natural understanding and use of that symbol. <br>I think it's much more nice, humanistic and feeding visual competence  <br>to use asterisk, dagger, double-dagger and pilcrow for marking marginals and similar things in some cases, <br>than those always boring numbers, who always remind of scientific essays. <br> <br>But with (mis-)understanding the dagger as a cross, its use is reduced to a few things. <br> <br>Michael <br></p>"
