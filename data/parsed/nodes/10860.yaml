    html: "<p>Matha, sean: thank you! <br> <br>interesting info!  <br>There seem to be a lot of implications. But most of them come  <br>from a later view (especially those connections to paganism). <br>To me it seems that the pointer root (or roasting spit - nice!)  <br>is the most early. It makes the most sense, for with a pointer you can <br>optically point out best those spurious or interesting passages within a text. <br>This would imply that first there was no reference to religious symbols  <br>may it be the cross or any other. <br> <br>And as far as I know those theologians (I myself studied protestant theology),  <br>they were much more rational and functional in their work. <br>Maybe they didn't have a cross or something like that in mind.  <br>Otherwise - I think - there should have been some reflection on this use of a symbol. <br>Very interesting for me: Those mathematics-use. <br> <br>But I'd like to trace it to the ground: Does any of you know early manuscripts  <br>or prints with the dagger where its form and meaning can be seen? <br> <br>Michael</p>"
    html_clean: "<p>Matha, sean: thank you! <br> <br>interesting info!  <br>There seem to be a lot of implications. But most of them come  <br>from a later view (especially those connections to paganism). <br>To me it seems that the pointer root (or roasting spit - nice!)  <br>is the most early. It makes the most sense, for with a pointer you can <br>optically point out best those spurious or interesting passages within a text. <br>This would imply that first there was no reference to religious symbols  <br>may it be the cross or any other. <br> <br>And as far as I know those theologians (I myself studied protestant theology),  <br>they were much more rational and functional in their work. <br>Maybe they didn't have a cross or something like that in mind.  <br>Otherwise - I think - there should have been some reflection on this use of a symbol. <br>Very interesting for me: Those mathematics-use. <br> <br>But I'd like to trace it to the ground: Does any of you know early manuscripts  <br>or prints with the dagger where its form and meaning can be seen? <br> <br>Michael</p>"
