    html: <p>There are some interesting things going on here, asterisks mark a beginning, birth, alfa and daggers an ending, a death, omega. Maybe the Alfa/Omega thing is coincidental. Does anyone know when the dagger first appeared? <br> <br>I don't agree with interpreting Egyptian obelisks as purely phallic, Obelisks are meant to be 'solidified rays of sunlight'. </p>
