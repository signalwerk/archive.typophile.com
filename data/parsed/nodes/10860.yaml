    html: <p>I believe the symbols origin is a sign for death.    <br>It was marked on coffins. I think.   <br>  <br>A current use is to mark that a person is  <br>deceased - in a body of text.   <br>  <br>If anyone has a copy of E.T.S. handy ( mine    <br>is at home ) I am sure there is a section on it.    <br>If no one comments further I will provide more    <br>info tonight.   <br>   <br>-smc</p>
