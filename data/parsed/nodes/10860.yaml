      <p>Perhaps this will  help, perhaps not. </p>
      <p> The division sign was[ circa 1659]...  known either as the obelus or sometimes the  obelisk, from a Greek word meaning a  roasting spit. The idea seems to have been  that such dubious matter was thrust through,  as with a spit; the word is the same as that for  a tapering pillar, another object with a pointed  end. Confusingly, the word obelus was later  used for the printer</p>
