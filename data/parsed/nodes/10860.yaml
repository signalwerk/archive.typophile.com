    html: <p>I have read E.T.S. (you mean Bringhurst?). <br>But it's not quite detailed. I think in the later use the confusion  <br>or double signing dagger/cross is of course there, as today, and in the  <br>following the use as a cross and sign of death or religious things.  <br> <br>But the early term "obelisk" doesn't seem to reference to the  <br>cross as a religious symbol. "asterisks and obelisks" has been  <br>a term for pro and contra in theological scientific dicussions  <br>in the 16th century (Martin Luther vs. Johannes Eck). And it results  <br>from the signs used in the (biblical) text for marking marginals. In this  <br>context it doesn't make sense if dagger/obelisk=cross  <br>because asterisk and obelisk should be on the same level.  <br> <br>So my question is about the early development, the form, use and understanding  <br>of the sign. Maybe there is any evidence for clarifying its first meaning <br> - or even its double meaning from the beginning. <br> <br>Michael</p>
    html_clean: <p>I have read E.T.S. (you mean Bringhurst?). <br>But it's not quite detailed. I think in the later use the confusion  <br>or double signing dagger/cross is of course there, as today, and in the  <br>following the use as a cross and sign of death or religious things.  <br> <br>But the early term "obelisk" doesn't seem to reference to the  <br>cross as a religious symbol. "asterisks and obelisks" has been  <br>a term for pro and contra in theological scientific dicussions  <br>in the 16th century (Martin Luther vs. Johannes Eck). And it results  <br>from the signs used in the (biblical) text for marking marginals. In this  <br>context it doesn't make sense if dagger/obelisk=cross  <br>because asterisk and obelisk should be on the same level.  <br> <br>So my question is about the early development, the form, use and understanding  <br>of the sign. Maybe there is any evidence for clarifying its first meaning <br> - or even its double meaning from the beginning. <br> <br>Michael</p>
