    <p>Hello fellow typophiles,</p>
    <p>I am looking for a bit of advice/knowlage and hoped that some of you might be able to point me in the right direction...</p>
    <p>I am a student at Kingston University and am currently trying to develop an experimental typeface based upon information getting corrupted/changed the more its reproduced. For this I have started creating a typeface whos letterforms change depending on how many times you use them. </p>
    <p>In order to do this I am currently in the process of designing about 50-60 varients of the font and I wondered if anyone knew of a way to have the font change which varient it selects based on how many times its been used e.g. the 6th time a letter g gets used it would uses varient 6 of letter g.</p>
    <p>I don't know if this is possible or not but I thought I would see if anyone on here had any suggestions/advice.</p>
    <p>Thanks</p>
