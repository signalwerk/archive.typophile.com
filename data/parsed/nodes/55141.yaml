      <p><cite>As for figure anything out, the controlling consensus on this kind of wild-assed font behavior in OT is “Who needs it?” with undertones of “We don’t want any complicated and possibly buggy fonts out there blue-screening our pristine operating system and/or application program performance with wild-assed font behavior!”</cite></p>
      <p>...and the distinct whiff of <em>"Get off my lawn, you damn kids!"</em> ;)</p>
      <p>There are plenty of reasons for playing around with this stuff. Sure, the results will be buggy at first and maybe somebody's file might crash (serves 'em right if they weren't hitting save regularly), but nothing ventured nothing gained, amigos. I for one am interested in reintroducing the subtle imperfections of analog print through digital means, which is why I'm pursuing OpenType randomness (though I'll settle for regular cycling). As Part of my grad thesis I'm looking into ways that digital type can reclaim ground lost to photo and hot metal. It would be nice if a font could adjust itself optically according to point size, especially on the web or mobile devices. there's plenty we can make type do, and no reason to let it stagnate simply because people don't want to deal with the inconvenience of experimenting. </p>
      <p>John, you are certainly right about "scripting language" being a bit f an undeserved complement to the AFDKO feature language. If only the powers that be had decided to make digital fonts be actual programs instead of mere system extensions...</p>
      <p>I wonder what it would take to make fonts more powerful. OpenType offers a lot of flexibility, but the inherent status of fonts on modern operating systems is holding them (and us) back.</p>
      <p>—Noam</p>
