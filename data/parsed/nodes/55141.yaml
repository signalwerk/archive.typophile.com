    html: |-
      <p>I recently designed a <a href="http://www.typetrust.com/fonts/font.php?id=ODEx" rel="nofollow">pseudo-random Opentype font</a> that cycles through three subsets. I started using Thomas Phinney’s code :</p>
      <p>feature calt {<br>
      lookup rotate {<br>
        sub @default @default' by @alt1;<br>
        sub @alt1 @default' by @alt2;<br>
        <em>etc ad infinitum</em><br>
      } rotate;<br>
      lookup rotate;<br>
      } calt;</p>
      <p>The Phinney method worked, but Indesign flakes out and will occasionally disable CALT at the beginning of a line after a series of lines cycling like this. In Illustrator CALT is off by default, and in many programs it’s simply unsupported. So Silas Dilworth came up with the brilliant idea of writing a PHP script to build a cycling engine based on LIGA. It works very well, and is supported by a lot more software. The downside is that for a 1144 character font there are 1536 lines of LIGA code. It also tends to chug along in some apps. I honestly don’t know how it works so you’ll have to get in touch with him (try Facebook) for an explanation.</p>
      <p>Something you need to consider before you go too far with this project is the number of glyphs and file size. If you do 60 permutations of a 256-character font you’ll have over 15,000 glyphs, if you’re adding lots of points to change the shapes that means you’ll end up with a pretty big file and won’t be able to master the font in Fontlab (but you could do it with Fontforge, Asia Font Studio, AFDKO or combinations of them). I have no idea what kind of software problems you’ll run into with a font that big, but plan ahead and assume you’ll run into some.</p>
    html_clean: |-
