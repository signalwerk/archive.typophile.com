      <p><cite> I for one am interested in reintroducing the subtle imperfections of analog print through digital means…</cite></p>
      <p>When I was working on Black Monday I started by spending a tremendous amount of time distressing type by hand. It was a waste of time. I realized that in the digital realm, all you can ever do is simulate. Vector type will never come close to the imperfections of metal type. Massive photofonts with character randomizers and baseline randomizers and anything else anyone thinks of will never convince anybody that they’re metal type. Things get more interesting when we just embrace the digital size of things and exploit all the great stuff digital type gives us instead of trying to recreate a technology that has as beauty all its own.</p>
      <p><cite>I wonder what it would take to make fonts more powerful.</cite></p>
      <p>For the most parts fonts don’t need to be more powerful, the end-users just need to do a better job setting their type. The answer to optical sizing is not having OpenType do it automatically, it’s getting designers who don’t even know how to use old-style figures to RTFM. Making all this stuff automatic will not, for the most part, make typography better, it will just create more headaches because of all the people who don’t understand what’s going on.</p>
