      <p>OpenType has an internal scripting language, which allows you to program features for it. Unfortunately, it's not a complete programing language. It's mostly for specifying glyph substitutions and positioning info. No variables, no arithmetic, no fancy stuff. I'm facing a similar problem, trying to code a font that can change optical size automatically (through glyph subs) depending on what size a text is set in. We're both trying to make a font do things based on external factors, which I don't think OpenType can handle without a lot of hacking.</p>
      <p>When Erik van Blokland and Just van Rossum designed Beowulf, they did all the coding in <a href="http://en.wikipedia.org/wiki/PostScript" rel="nofollow">PostScript</a>, which is a real Turing-complete programming language. Their code was being run by the output device, i.e. the printer. If you're working on a font designed for the screen, this may not be helpful.</p>
      <p>Best of luck...if you figure anything out, let us know!</p>
      <p>—Noam</p>
