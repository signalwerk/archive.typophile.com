      <p>Hi itsluke</p>
      <p>Robert Bringhurst's 'The Elements of Typographic Style' has a great little discussion of exactly what you're talking about in Section 9.3.2: Manual, Random and Programmed Variation. He uses the example of a typeface called Beowolf by Fontshop, which uses a small program embedded in the font to introduce random variation to the letterforms.</p>
      <p>From what I understand, OpenType fonts can contain embedded programs that can achieve what you're thinking of. You'd have to create a small program to count how many times the face has been called upon for a certain letterform, and introduce greater variation the more times the character has been called. I don't know the technical details or limitations of OpenType, but I think it can be very flexible.</p>
      <p>So, look into OpenType, Beowolf and snatch a copy of Bringhurst out of the Uni library.<br>
      Hope this helps,</p>
      <p>Sebastian</p>
