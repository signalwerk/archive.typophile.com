    <p>MacFormat is a Mac magazine in the UK. I know the tagline at the top is set in some form of Myriad, but I have no idea about the “Mac”. I’ve run it though various different identifiers, all to no avail.</p>
    <p>The logo attached is from <a class="freelinking-external" href="https://web.archive.org/web/20080828111448/http://www.macformat.co.uk/">their website</a>.</p>
    <p>Thanks,<br>
    Ted</p>
