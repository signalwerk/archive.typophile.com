      <p><cite>Is it a simple job to convert them?</cite></p>
      <p>I never have converted a PC Type1 font to a Mac Type 1 font, but it is dependent from the tools you use and from your experiences, as in most cases. But I am relatively sure, that there also is a font folder on the Mac, that belongs to the Illustrator directory, where you can put in PC Type1 fonts. (Search for fonts in the Adobe directories to locate font folders, if nobody else replies, that can specify the path.) I don’t know, if there is a free Mac tool for font conversions. Except from the Adobe Font Development Kit for OpenType (AFDKO), with the help of which you can build OpenType fonts.</p>
