      <p></p><div class="imageWrap"><img src="http://typophile.com/files/burbank_5562.gif"></div><br>
      Have a look at <a href="http://www.houseind.com/fonts/burbankcollection/viewfonts" rel="nofollow">Burbank</a>. <p></p>
      <p><em>»Back in the prehistoric period before 2007, animated typefaces tended to be drawn as single stand-alone fonts. They rarely had relatives and scarcely had a supporting cast, causing short-sighted typesetters to seldom use them for much more than featherbrained frivolity. Tal Leming recognized this sad state of affairs and set forth to rescue animated typefaces from their improper pigeonhole. He plotted, planned, deliberated and developed for nearly a decade before Burbank was complete. The final family is a coordinated collection of 20 fonts, hand hewn to handle tasks from big to small, wide to condensed, light to black and countless styles in between. Burbank is ready for anything from hyperbolic headlines on outdoor billboards and in major magazines to miniscule matters in tiny classified advertisements.«</em></p>
