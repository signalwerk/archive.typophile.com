    <p>Hi All,</p>
    <p>Im looking for quintessential typefaces used in 1960s cartoons.<br>
    I dont know much about that sort of typography. Any explanations/ideas for typefaces to use are welcome! :)</p>
    <p>So far all Iv found is Dom Casual (seems to have been popular at the time), and maybe Ad Lib (Pink Panther style) and BudBird (Pink panther style).</p>
    <p>Any other Hanna Barbera style popular typefaces would be great. Thanks!</p>
