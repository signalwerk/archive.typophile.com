    html: <p>On an handwritten letter, you have not only the forms of the letters used, but the texture, the color, the size, the smell, the noise from the paper, you have also the envelop you need to open, you have the stamps, in fact, many many small details who can't be compared to a perfect screen of a computer. <br> <br>So, its not Zapfino who will solve alone the problem. Sadly... <br></p>
