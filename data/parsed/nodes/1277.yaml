    html: <p>No handwriting font or font technology could replace the warmth and human quality of handwriting. It's the direct, physical act of writing that makes it so unique, so human. <br> <br>I grew up without any mechanical means to write other than to do it by hand. When I was in school, we produced class magazines by handwriting. Informal posters, notes, letters, handouts, everything was handwriting. Very few things were typewritten even (with manual Chinese typewriters!). If I wanted type, the only way to get it was to get it from a typesetting firm. There was a clear distinction between published and informal work. We're losing that all thanks to the computer. I still love handwriting things. The very act of writing is so satisfying and so contemplative. <br> <br>I write in English most of the time now, and I must say I really like the computer as a tool for writing. I can type so much faster than I can write, so using the computer to write is so much more efficient for me. But at the same time it's also sad that we don't see handwriting so much any more. <br> <br>The case is reversed for Chinese. My Chinese typing is extremely slow, so writing on the computer is an extremely tedious process. I simply can't write efficiently in Chinese on the computer. But then again writing by hand in Chinese is also a slow process. That's why handwriting is still used a lot in Chinese-speaking countries. And good handwriting continue to be an important skill to have. As the Chinese say, handwriting is a person's clothes. <br> <br>We need to move away from handwritten fonts, I think. A good everyday, informal typeface should not be a handwriting typeface. Ligatures and OpenType is not a solution. On the other hand, we need to revive and sustain handwriting in our increasingly typeset world!</p>
