    html: "<p>I think the central problem is essentially insurmountable.  :-( <br> <br>The \"warmth\" from handwriting I think comes from two things: <br>1) Handwriting -especially handwriting that's read by <i>others</i>- is getting rarer, and this creates an aura of value. <br>2) It's different for every person writing. <br> <br>I guess #1 could theoretically be overcome by using a font that's so variable that the reader can't tell it's type. Problems with this: <br>- It's technically very difficult. The Letterror twins have done some work in this direction, but as seminal as it is it's not the real thing. <br>- It's very hard to tell if it's working or not, because of the difference between conscious deliberation versus our subconscious \"firmware\". Merely asking a reader if he thinks it's handwriting or type doesn't cut it. <br> <br>As for #2, it's much much trickier! How do you make a font vary -convincingly- for each person? For one thing, no current (or past) font technology [I know of] supports such variance. But even if it did, the hypercomplex code would have to be written. I actually know [of] only one person doing something like this: Vlad Atanasiu, who recently finished a PhD dissertation on the quatification of Arabic calligraphy. His work is jaw-dropping, and makes even Tomas Milo's herculean efforts in making Arabic type look authentic seem oversimple. BTW, it's interesting that even though Latin is much more widespread and the west generally engages in quantification more than anybody else, nobody has tried to do for Latin what Atanasiu and Milo are doing for Arabic, at least not at all convincingly. <br> <br>-- <br> <br>The thing is, why do you want to do this? Certainly \"warmth\" is generally a good thing to convey, I agree. But in terms of emulating handwriting, since it's technically so difficult, and I'd say essentially anti-typographic, maybe there's another way to convey warmth in type? I would have to admit that it's much harder, or at least a lot less obvious. But maybe the qualitatively greater capacity of type to express abstraction can be used to convey a warmth of universalities, as opposed to individualities? Dunno. <br> <br>hhp <br></p>"
