  html: "<p>Good day. I am working on solving the problem of understanding the much more intimate feeling one receives from getting a letter in the mail, verses receiving an email in their inbox... I am working on solving this problem typographically and have looked at numerous script typefaces, such as work by Jill Bell, Hermann Zapf, the typeface Dalliance along with many others. And I ask: What makes a good \"handwritten\" face?  <br> <br>And: What kind of application could give the same effort, care, love &amp; time that is put into a handwritten letter?  <br> <br>I have a couple of ideas, but I haven't hit the lightbulb, any help would be appreciated. Thanks!  <br> <br>jessie</p>"
  html_clean: "<p>Good day. I am working on solving the problem of understanding the much more intimate feeling one receives from getting a letter in the mail, verses receiving an email in their inbox... I am working on solving this problem typographically and have looked at numerous script typefaces, such as work by Jill Bell, Hermann Zapf, the typeface Dalliance along with many others. And I ask: What makes a good \"handwritten\" face?  <br> <br>And: What kind of application could give the same effort, care, love &amp; time that is put into a handwritten letter?  <br> <br>I have a couple of ideas, but I haven't hit the lightbulb, any help would be appreciated. Thanks!  <br> <br>jessie</p>"
