    html: <p>The term junk mail came well before the personal computer. Things that make junk mail obvious are bold graphic statements on the envelopes. The only envelopes I open (other than bills) are plain envelopes that have no graphics on them and a simple return address, no logo. More often than not it a sales promotion, but they achieved their purpose, I opened the envelope. With e-mail I have filters that do most of the work, I'd say 75% and I just can look at the sender and tell the other 25% of the junk and delete it with no eyeballs on it. I don't think type has any bearing on mail, but handwriting would. Just my opinion, Dan</p>
