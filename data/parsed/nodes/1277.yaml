    html: "<p>First: I think my comparison between the work of Atanasiu and that of Milo was misleading. If I left the impression that the former is somehow a superset of the latter, that is not correct. Milo applies the intricate rules of Arabic calligraphy to render arguably the best Arabic type out there (if you subscribe to the chirographic school). Atanasiu first of all doesn't even have any software (public or otherswise) that actually does typography; his project involves the quantification of actual hands in Arabic calligraphy, such as that of ibn Muqla, and his algorithms work with continuums, so you could automatically render a hybrid hand between two \"presets\" for example; conceivably this means he can extend his work to render handwriting differently for each person, possibly by defining parameters like \"speed\", \"confidence\" or who knows what else. Vlad has a book out*, and it's one of the most wonderful works I've ever read, not least because he fuses the aesthetic and mathematical spheres in that ancient way that hasn't been fashionable since the Enlightenment, even though it's really the most natural and effective way to explore reality. One small insight into this \"style\" is a graph in his book: it shows the letter usage frequency for half a dozen or so Western langages, with an illustration of a... full-on winged jinni sitting on top of it! :-&gt; As if to remind us: \"Don't forget the whole point of your humanity\"! Too much - too good. <br> <br>* <a href=\"http://www.typophile.com/forums/messages/30/2371.html\" target=\"_blank\">http://www.typophile.com/forums/messages/30/2371.html</a> <br> <br>Here's Atanasiu's site: <br><a href=\"http://www.atanasiu.freesurf.fr/thesis/\" target=\"_blank\">http://www.atanasiu.freesurf.fr/thesis/</a> <br> <br>BTW, both Vlad and Thomas are very interesting characters in person, and I personally feel a link with both of them: the former because of that ancient style of science that [I hope] I share, while the latter because he has experienced the Lebanese Civil War. <br> <br>-- <br> <br>&gt; is his studies that recent?? <br> <br>The book came out in 2000, but there's only the French version. His PhD defence was this past May - which reminds me that I should ask him how it went... The paper was a 244-page tour de force, but also in French. <br> <br>&gt; \"warmth\" <br> <br>I think most of all it comes from the reader knowing (or actually, merely thinking) that somebody used the tangible world to create it. This didn't used to be a big deal, but since the Industrial Revolution and especially the Computer Age, it's gained inceasing value mostly through its rarity, but also because in the end humans are at least half physical things. <br> <br>-- <br> <br>Alan, the Arabic \"symposium\" is at ATypI-Vancouver in less than 2 weeks. I too will have to miss that event, sadly. But Prague for sure. <br> <br>hhp <br></p>"
