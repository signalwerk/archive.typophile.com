    html: "<p>Something just hit me like a ton of broad-nib pens: <br> <br>A very big difference between manual versus mechanical <br>writing is that in the latter corrections are invisible. <br> <br>It's not that there are no typos (in fact there might <br>be more, or at least of a different kind), it's that <br>you can fix typos (or simply change your mind about <br>what to write) without the reader seeing that. <br> <br>This is I think even more important than the usual <br>difference people point out about handwriting and <br>typography: that no two letters are exactly alike. <br>In fact the mechanics of saccades (where one can <br>see only a maximum 4 letters totally clearly, and <br>where arguably the short term memory about exact <br>letterforms isn't retained between fixations) can <br>mean that if you have like three variants for each <br>letter and use them in a cyclic fashion (just like <br>the Letterror boys do) then you're OK there. <br> <br>-- <br> <br>But since this is issue is at the type composition <br>level (as opposed to type design) type designers are <br>oblivious and/or powerless about it - so it's the job <br>of the software, but maybe with help from OpenType? <br> <br>So if you want a typographic system (as opposed to just <br>a font) to be a convincing substitute for handwriting, it <br>must incorporate a way to show mistakes/changes_of_mind. <br> <br>Also: Analysis of how people type with typewriters (at least <br>those that don't allow correction) might give some insight. <br> <br>hhp <br></p>"
