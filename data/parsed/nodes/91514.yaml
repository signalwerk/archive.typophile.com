    html: |-
      <p>Interesting theory.</p>
      <p>In fact when we moved from Lebanon to the US<br>
      when I was 6 and then moved back when I was 9<br>
      I had to flip-flop between detached and cursive<br>
      handwriting, and the last thing I remember was<br>
      having to figure out what an "a" is "supposed" to<br>
      look like on my own (because I was too old to be<br>
      formally re-taught). After a period of writing the<br>
      "a" in binocular form (too slow) I went (back?)<br>
      to the monocular form.</p>
      <p>hhp</p>
