    html: <p>Actually I had quite good handwriting early on.  The teachers said my cursive was truly beautiful. But then my fifth grade teacher (teacher of 10 year-olds if you are not used to the american system) kept making us write all theses sentences, like hundreds and hundreds of paragraph long sentences, as a form of punishment.  Myself, I was fairly well behaved, so out of my resentment I wrote out those sentences just as fast as I could.  The fall was imminent after that.</p>
