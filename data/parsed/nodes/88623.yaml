      <p>That is why I have used the word positioning data, not Positioning lookups. These many hundreds of of GPOS lookups may contain small amount of data as compared to my font. As the positioning lookups are properly arranged in my font in kern, curs, mark, mkmk order and also the Extention lookups is turned on.</p>
