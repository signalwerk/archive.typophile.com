    html: |-
      <p>The problem is solved as I worked out to refine the complete MS VOLT project of my font and removed some positioning data from the lookups. </p>
      <p>It appears that there is no limit for lookup numbers as there are more than 425 lookups in my font at present and VOLT is compiling it correctly but certainly there is a limit for positioning data in MS VOLT and when this limit is reached then the compilation starts failing in MS VOLT.</p>
    html_clean: |-
      <p>The problem is solved as I worked out to refine the complete MS VOLT project of my font and removed some positioning data from the lookups. </p>
