    <p>Hi </p>
    <p>Can anyone help me id these two typefaces please....</p>
    <p>The first one is an  elegant serif, that one of my local galleries have used for an exhibition flyer...</p>
    <p>The second one is a dotted sans serif that feels like its based on avant garde / century gothic , but the g dimensions are different from both.</p>
    <p>This is the first post i have done on this site as i joined a week ago - i think its a really good idea to share information on design and i will try my best to help other people as well </p>
    <p>- thankyou for setting the site up.</p>
