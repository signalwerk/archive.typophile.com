      <p>Elegant, condensed, expressive -- sounds like you need to get some more stroke contrast in there.</p>
      <p><a href="http://www.fontshop.com/fonts/singles/creative_alliance/itc_roswell_four/&amp;sample_text=MAGCORPORATION&amp;sample_size=74" rel="nofollow">ITC Roswell</a><br>
