    html: <p>Great call Marco, I'm not sure why I overlooked Verlag Compressed (I actually like the Condensed more). Neutra Condensed is even more beautiful ... and not as strange as I would have guessed. Neutra really shows it's personality in body copy with those low x-heights. It really looks great as display.</p>
