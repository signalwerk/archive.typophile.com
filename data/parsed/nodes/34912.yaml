  html: |-
    <p>I'm working on a magazine mast identity and I'm having trouble finding a bold, condensed sans serif that is expressive, unique, fun, approachable, etc.</p>
    <p>All of the ones I've looked at (see attached): Helvetica, Univers, Akzidenz, Franklin Gothic, Gotham don't seem to feel right. The publication name is long and I'm looking for an elegant solution.</p>
    <p>Any thoughts? Thanks,</p>
    <p>Sam</p>
