    html: |-
      <p>I contacted the nice folks at <a class="freelinking external" href="http://www.woodproductsigns.com/" rel="nofollow">Wood Product Signs</a> because they had this photo posted of a newer sign they made with that older type:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/sand-dunes_5308.jpg"></div><br>
      They told me that it was routered out using CAD software, and that the "font" (CAD letter outlines) they use is called "Old Time Round Gothic." That's not really a font, but maybe it can help you in your search?<p></p>
      <p>None of these are exact matches, but have have a similar retro feel (to me):<br>
      - <a class="freelinking external" href="http://www.myfonts.com/fonts/szardesign/zar-brush-gothic/" rel="nofollow">Zar Brush Gothic</a><br>
      - <a class="freelinking external" href="http://www.myfonts.com/fonts/comicraft/dash-decent/" rel="nofollow">Dash Decent</a><br>
      - <a class="freelinking external" href="http://www.myfonts.com/fonts/parkinson/wigwag/" rel="nofollow">Wigwag</a><br>
      - <a class="freelinking external" href="http://www.myfonts.com/search/magnesium/fonts/" rel="nofollow">Magnesium</a><br>
      - <a class="freelinking external" href="http://www.myfonts.com/fonts/dtptypes/delargo-dt-rounded/" rel="nofollow">Delargo Rounded</a></p>
      <p>Search terms like "monoline," "rounded," "speedball," "showcard," retro may get you closer...</p>
