    html: |-
      <p>Maybe I'm wrong, but as you copy a text, you should get it as it is was encoded.<br>
      In PDFs, copying a text where ligatures are applied as Ot features makes you obtain plain text (no ligatures).<br>
      Of course if you hard-code a non-standard glyph into your text, you could have issues when copying it.</p>
