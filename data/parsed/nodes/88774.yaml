      <p>Thanks guys. I think I'm going to go with taking them out of every address. I understand what you're saying John about maybe getting away with common words in short emails, but then I think we'll get into the realms of um-ing and ah-ing over what is possible.</p>
      <p>What has really swayed me in the direction of being militant about no ligs is the fiftymilesofideas.ca web address Joe shared. I think even the jedis felt THAT disturbance!</p>
