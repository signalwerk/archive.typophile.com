  - id: 490173
    user: 1262
    date: 2012-01-03T18:22:00
    date_raw: 3 Jan 2012 — 6:22pm
    votes: null
    html: <p>As a general rule I agree with Joe that ligatures should be avoided in email addresses and URLs. I think an exception is <em>possible</em> in the case of domains consisting of single, common words, presuming the text is appropriately spaced (always important when ligatures are involved). So, for example I think you can get away with <em>ﬁction.org,</em> but not <em>moreﬁction.org,</em> and definitely not <em>moreoﬃction.org.</em></p>
