  html: |-
    <p>Here's a question ... Is it better to remove ligatures in email and web addresses when designing for print.</p>
    <p>Or is just me being OCD?</p>
  html_clean: |-
    <p>Here's a question ... Is it better to remove ligatures in email and web addresses when designing for print.</p>
