      <p>Ralf, you'll find more about this in the book called <a href="http://www.amazon.com/Streamline-American-Deco-S-Heller/dp/0811806626">'Streamline: American Art Deco'</a> by Steven Heller and Louise Fili. </p>
      <p>I think it says that 'streamline' referred to mid-century American Modernism and included architectural and product design. Chronicle Books may have incorporated it as a chapter into a newer book called Euro Deco, but I'm not sure. The original is out of print, but good reference. You're right about the relationship to neon signs; motel signs in particular.</p>
      <p>Then there is also</p>
      <p><a href="http://www.fontdiner.com">http://www.fontdiner.com</a></p>
      <p><a href="http://www.misterretro.com">http://www.misterretro.com</a></p>
      <p>and of course</p>
      <p><a href="http://www.flashfonts.com/flashsite/fontspage2.htm">http://www.flashfonts.com/flashsite/fontspage2.htm</a></p>
