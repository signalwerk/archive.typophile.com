      <p>This may just be where I grew up but in Pittsburgh during the 50s, we called car nameplates "chrome script." An older guy from Detroit (even older than me) several years ago explained that the joined nature of the heavy script was just due to the technical manufacturing aspect. It was just one piece to cast and only needed 2 rivots to mount on the car. Today, they can do anything so there is no need for that style.  It is fun to look at though!</p>
      <p>ChrisL</p>
