    <p>Hi!</p>
    <p>I’m looking for information about the <a href="http://www.flickr.com/photos/ralf_herrmann/123848381/in/set-1284234/">streamline fonts</a> that were used in 40’s and 50’s on american cars, refridgerators and so on. </p>
    <p>Is »Streamline Font« a correct term to categorize such fonts, or are there any other better or »offical« terms?</p>
    <p>What’s the origin of these kind of letterings? Where they »invented« for car emblems or where there any other forerunners (like neon signs maybe)?</p>
    <p>Any information would be appreciated. I could’nt find anything useful about this topic here in Europe.</p>
    <p>Ralf Herrmann</p>
