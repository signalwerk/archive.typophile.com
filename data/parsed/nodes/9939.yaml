  html: <p>I have Photoshop 7 and Win XP, but am not very experienced in PS. I just downloaded the Bickham Script Pro from Adobe. In Photoshop, I did some type in the regular characters, but I cannot find how to access the alternate characters for this font. Adobe wants $39.95 to answer the question, so I hope to get help here. The dropdown next to the right of the font box says "regular" and there are no other options to select.</p>
