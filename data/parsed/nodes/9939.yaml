    html: |-
      <p>Paul, </p>
      <p>Photoshop and Illustrators programmers work in San Jose while InDesign programmers work in Seattle. So they never even get a chance to meet for lunch :) </p>
      <p>If you look at Creative Suite 2, you will notice that the user interfaces of Photoshop and Illustrator look alike (e.g. the way the new WYSIWYG font menus were implemented) but InDesign's UI looks totally different. </p>
      <p>A.</p>
