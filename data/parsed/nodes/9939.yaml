    html: <p>what i want to know is why photoshop handles OT features so much differently from InDesign &amp; Illustrator. When you switch on the "swash" feature in InD, you get swsh+cswh. In Photoshop you can't access the cswh feature. In InD the "discressionary ligatures" switches on dlig+hlig. In Photoshop you only get the dlig tag applied. this drives me batty. does anyone else have any additional pitfalls i should avoid when writing OT code where the Photoshop programmers were not on the same page as the InD team???</p>
