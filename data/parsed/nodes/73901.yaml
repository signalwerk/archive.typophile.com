  html: <p>I am trying out fonts.com web fonts beta and was trying to find a font similar to Avenir. I think that I have narrowed it down to Metro Office, Neuzeit office (both of which are designed for the computer screen) and Neuzeit S; however, I was hoping for a better opinion than mine to determine which would be best. Any suggestions?</p>
