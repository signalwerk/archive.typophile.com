      <p>I apologize for such a late reply. Thank you all for all your suggestions I became interesting in the fonts.com beta after reading <a class="freelinking external" href="http://webfonts.info/wiki/index.php?title=Web_Fonts_(Monotype)" rel="nofollow">this</a> page I figured I would try it out. Other fonts are supposed to be available later, but the initial 2,000 consisted of a select few geometric fonts. And based on what was offered I wanted some clarification of what would be a good alternative to Avenir based on the choices I had.</p>
