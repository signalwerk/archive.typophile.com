    date: 2010-09-06T15:43:00
    date_raw: 6 September 2010 - 3:43pm
    votes: 0
    html: "<p>Metro is closer (Neuzeit is more of a grotesque/geometric hybrid — see Graphik), but you have to keep in mind the level of hinting put into these fonts if you’re going to use them at text sizes on the web. A lot of users still see fonts rendered with Microsoft’s grayscale renderer, and almost none of the newly @font-face licensed fonts hold up under those conditions. Another issue to consider is how similar things start to look at smaller sizes in low resolution. The most important characteristic of Avenir as low res text is it’s low x-height. My advice is: look for that first.</p>"
    html_clean: "<p>Metro is closer (Neuzeit is more of a grotesque/geometric hybrid — see Graphik), but you have to keep in mind the level of hinting put into these fonts if you’re going to use them at text sizes on the web. A lot of users still see fonts rendered with Microsoft’s grayscale renderer, and almost none of the newly @font-face licensed fonts hold up under those conditions. Another issue to consider is how similar things start to look at smaller sizes in low resolution. The most important characteristic of Avenir as low res text is it’s low x-height. My advice is: look for that first.</p>"
