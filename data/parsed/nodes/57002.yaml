      <p>To my mind, in reading, the entire word is figure. The ground is the surrounding space the word stands out against. One of the great oversights of perceptual psychology, it seems to me, is the failure to understand that within the word as bounded map, both the black and the white are information contributing to visual word-form resolution. Psychology sees the black but has nothing to say about the white.</p>
      <p>Underlying this is the principle that the rods and cones in the retina are responsive to reflected light.</p>
