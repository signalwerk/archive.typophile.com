      <p>Peter: <em>The Noordzijian statement and central attunements emergent in the design process can certainly lead to potentially important hypothesis. They did in my case.</em></p>
      <p>When I say that they don't lead anywhere, I mean that they don't lead deductively to a particular conclusion. Of course they might prompt or inspire hypotheses, but that's you taking the ideas somewhere, not them leading.</p>
      <p><em>My claim is that your idea that (inside the bounded map created by the blacks, interletter and intraletter whites) the role of the white is “to provide a contrastive ground for the letter shape” is a widely held and oestensibly common sense assumption that needs to be explored, when it comes to what the visual cortex uses.</em></p>
      <p>I entirely agree. I'm being tenaciously Occamist, not budging from what seems to me the minimally sufficient role of the white, precisely because so much woolly fluff has been said by designers about the importance of the white. I'm not sure that my stated view is actually a widely held assumption: it seems to me that the widely held assumption, at least as represented in what designers say, is that the white is almost mystically important, and indeed what is said about it is largely mystification. I'm pushing for something more rigorous.</p>
      <p><em>Certainly the white provides a contrastive field, but inside the bounded map or bouma it also provides criterial information toward rapid automatic visual wordform resolution in immersive reading, or so I think. I know I’m just repeating my mantra, but it seems to me to provide a powerful ground for understanding the importance of the white inside design.</em></p>
      <p>As a hypothesis, I'm sympathetic to this. But I think it is begging the question to justify the hypothesis on the grounds that it provides understanding of the importance of the white within design. This is what is at question: how important is the white within design?</p>
      <p>I think white is critical to rhythm and, hence, to spatial frequency. Which is to say that the <em>size</em> of the white areas relative to each other is important, and this provides the impetus to modulate the black shapes and their spacing in ways that maintain appropriately sized white counters and inter-letter areas. All very important. What I am not convinced about is that the <em>shape</em> of the white is important; indeed, the shape of the white is necessarily subservient to the style of the individual typeface, as expressed in the shapes of the black. There are a few examples of true ‘designing the white’, in which the shapes of white areas are the starting point and dictate something of the shape of the black and hence the style of the typeface; Legato is the obvious example. But the vast majority of type designers throughout history, regardless of what they might say about the white, have been in the business of designing black shapes.</p>
