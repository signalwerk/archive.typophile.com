      <p>A simple experiment to run regarding counters would be to run a reading comprehension test using the counters as an independent variable. Condition 1 would have a normal typeface, condition 2 would have the same typeface with the counters filed in. You'd have to outline the entire page and manually remove the counters, or customize a typeface, which would make materials preparation a bit time consuming. I'm pretty confidant that no one has conducted a study of this nature (but I tend to forget what I read, unless I've read it three times). A quick database search (PsychINFO and Web of Science) didn't turn up anything at a glance. Counterbalancing a 2x2 within subjects design isn't that hard. Data entry and analysis would be a breeze.</p>
      <p>Ss 1 = A1, B2<br>
      Ss 2 = A2, B1<br>
      Ss 3 = B1, A2<br>
      Ss 4 = B2, A1</p>
      <p>A = counter<br>
      B = passage</p>
      <p>A simple <a class="freelinking external" href="http://en.wikipedia.org/wiki/T_test" rel="nofollow">t-test</a> should do for data analysis (keeping in mind I'm not as advanced as I would like to be in stats-land. I prefer to spend my time on experimental design. But for fun, I have taken to developing three dimensional <a class="freelinking external" href="http://en.wikipedia.org/wiki/Latin_squares" rel="nofollow">Latin squares</a>. I'll get there someday).</p>
      <p>@ Sorkin, thank for the reference to <a class="freelinking external" href="http://journalofvision.org/4/12/12/" rel="nofollow">Pelli et al. (2004)</a>. I wandered around the paper and ended up at a great link to <a class="freelinking external" href="http://psych.nyu.edu/pelli/software.html" rel="nofollow">the Sloan font</a> (scroll down about three screens and there's a little blue link to download. It's free). Strangely enough, the same day I read this, I had a doctors appointment. They are moving offices so they were throwing stuff out. I noticed an old eye chart in the pile *yoink!* Check out that capital G!</p>
      <p>(I appear to be having problem inserting images. It keeps saying "Could not copy image. Error. " Anyone?).</p>
