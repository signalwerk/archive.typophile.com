      <p>Christopher: <em>A simple experiment to run regarding counters would be to run a reading comprehension test using the counters as an independent variable. Condition 1 would have a normal typeface, condition 2 would have the same typeface with the counters filed in.</em></p>
      <p>What's the purpose of such an experiment? No one is denying that the existence of counters is important, and removing them doesn't affect the debate about the way in which they are important. I maintain that they are by products of the shape of the letters: by removing them you are changing the shape of the letters. Also, letters include both open and closed counters and, arguably, any internal white space constitutes a kind of counter. Where would you draw the line on what to remove? Is the space between the arms of a k a counter?</p>
      <p>I'm not sure if there is a reliable test for the independent significance of counters in reading, because there is no such thing as an independent counter. You can't obscure the counter without obscuring the letter shape, and we already have good research on obscuring letter shapes (such that we know what parts of letters are essential to recognition).</p>
