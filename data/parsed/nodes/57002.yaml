      <p>Peter: <em>I think designing the white means being attuned to the white as shape in the process of designing, and it means designing so the whites are all in the same key, to use a musical metaphor.</em></p>
      <p>In my experience, the ‘white as shape’ is a by product of the shape of the letters. As for getting the whites in the same key, I think this happens as a result of getting the letters in the same key (which increasingly I think of in terms of tuning to a consistent spatial frequency channel).</p>
      <p><em>In some words, like ‘look’ the wide open counters are the most salient feature.</em></p>
      <p>I think that's begging the question. Certainly when looking at the word ‘look’ the counters of the double o are the largest features, but does that make them the most salient when <em>reading?</em> I'd argue that the most salient features from a word recognition perspective are those that distinguish ‘look’ from ‘lock’, the closest confusable word in our language. It is not the counters that are salient, but the rings enclosing the counters.</p>
      <p><em>Considered from the point of view of role-units, counters vary at least as much and are as rich in cue-value as stems and curves.</em></p>
      <p>I don't think that is true, at least not for the Latin script. The number of counters is far less than the number of letters, and almost all those counters are limited to the x-height range. Of these, most are of similar size and related shape (making possible the historical use of the counterpunch). Indeed, most of them differ from each other only by virtue of the difference in the arrangement of their bounding stems and curves. Again it is the shape and weight of the letter the wholly determines the size and shape of the revealed ground.</p>
      <p>Fred Smeijers gives the example of ‘not’ and ‘hot’ -- two words with identical internal white space --, and notes that the preponderance of letters with one or more vertical sides greatly reduces the variety of inter-letter white shapes.</p>
      <p><em>What I’m still wondering about is if the white uses the same spatial frequency scale as the black.</em></p>
      <p>? As I understand it, spatial frequency is a measure of transition between contrasted objects. I'm not sure that it makes sense to question whether ‘white uses the same spatial frequency scale as the black’, because what spatial frequency refers to the interaction of the white and the black.</p>
