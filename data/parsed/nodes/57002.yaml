      <p>It sounds like you are suggesting that the "white*" space has a similar role in (illustration?), poster design text, and micro typography. I think this is mistaken. The thing about the white space is that as far as I can see there are many phenomena occurring at once: you have overshoots which is a kind of optical illusion , and the other similar illusions which I won't enumerate here, scale specific illusions**, and then interactions the specific qualities of the design such as regularity ( or not) of forms, Horizontality, and so on. It is a rich mix.</p>
      <p>And you might also want to look at the phenomena of "crowding". Do a search for Pelli and crowding. The article "The uncrowded window of object recognition" by Denis G Pelli &amp; Katharine A Tillman in Nature Nueroscience might be the best place to begin.</p>
      <p>But back to the why, I think that the reason you don't find much about why is that it is on some level a scientific / optical / neurological question about perception. As designers we try to become sensitive to what is happening &amp; what works and thereby develop an intuitive sense of what's happening. We can observe, name and compare common typographic phenomena - this is probably the case with Tim's book for instance, and is the case when we look at a different phenomena like overshoots. However without insulting that ability which helps us a great deal (quite the reverse in fact!), I think it is safe to say that this kind of activity isn't so much explaining why but what. To get at why you would need to do scientific experiments. And again, this is not to say that you can't get a great deal done by analyzing what. And indeed you can start to develop some theories about why from this and even test them in a soft sense in your own designs. </p>
      <p>In terms of Helvetica and Arial, I think that given enough time and attention you will eventually see why one is better drawn than the other in general. But you will also discover that there is not "one" Helvetica, and by this I don't mean Neu Helvetica or different weights, I mean that there are actually different versions. You will also discover that Arial is good at things that Helvetica isn't - some specific screen applications, and in specific rendering environments. As far as it's relevance to your stated topic I have to agree with Ricardo.</p>
      <p>*since it may simply be a the contrasting color</p>
      <p>** If you look at what works best for type design at various sizes ( and you might want to get Tim Ahrens' new book  <a href="http://typophile.com/node/56793" title="http://typophile.com/node/56793">http://typophile.com/node/56793</a> ) you will find that the designs for various sizes differ. For instance the counters for letters that will be very small need to get larger and the spaces between letters do too. And the features need to be more beefy/crude/large/obvious. Also, experimenting a little you can find that a badly drawn font which is well spaced will outperform a one which is better but which has spacing which is worse. To me this fact alone explains the Massimo Vignelli quote. Ironically it is the size specific quality of the spacing ( look at how close the i &amp; l are set ) that makes Helvetica nice when it is set large and not so nice set small. It is that lack of robustness in the design of its spacing, among other things; that makes Helvetica a very poor choice for signage systems for instance.</p>
