      <p>Massimo's quote indicates a closeness to Swiss modernists, not only in typography, but in graphic design. See both Emil Ruder's "Typographie" and Armin Hofmann's "Graphic Design Manual". The Swiss of that time quite often built the black by subtraction using white. It was important to make the space "active" in the letterform design as well as the typography and page layout.</p>
