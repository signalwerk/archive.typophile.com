      <p>Bill: <em>I take it from your reply that you do see the effect, though for some reason you don’t admit it.</em></p>
      <p>Yes, I see the effect. I thought I had acknowledged that. But my point was that the G is antialiased, so there is a gradient shift between the black and white, and, more importantly, it is huge. The further you get away from the image, the smaller it becomes, and the less obvious the mach band effect. I don't doubt that if you were able to get back far enough, the effect would disappear, as it does when I look at the grey image on the Wikipedia mach bands page from more about 15 feet away. This is what leads me to conclude that such effects are size-dependent.</p>
      <p><em>I think it is absurd to deny that such ’pop’ or ’shimmer’ has played an important role in the popularity of Helvetica Bold for display. Slight scintillation as I said helps get attention in display type, and so is something a designer might want to take advantage of.</em></p>
      <p>I don't deny any of this. But I didn't think we were talking about display type. Sure, at display sizes these kinds of effects are significant, and are significant at the letter level. I don't think they are significant at text sizes, and I think it is a good thing that they are not. I also think that the absence of such effects at text sizes is one of the factors that has contributed to those sizes being preferred for continuous text.</p>
      <p><em>They are by no means the only reason for the importance of attending to whites in type design, but they are one reason.</em></p>
      <p>Okay, this is good. This is what I'm looking for. I think one can take the observation further, though, and say that this is a good reason for approaching design of text and display types in different ways with regard to the importance of the white.</p>
