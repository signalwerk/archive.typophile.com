      see the review of this work and the pelli work here:<br>
      <a href="http://www.mapageweb.umontreal.ca/gosselif/Grainger_et_al.pdf" title="http://www.mapageweb.umontreal.ca/gosselif/Grainger_et_al.pdf">http://www.mapageweb.umontreal.ca/gosselif/Grainger_et_al.pdf</a></p>
      <p>[Kevin] “If we look at a single letter, we need to decide if it’s one of 26 possible letters (in English). If we’re looking at the spaces, there are 26-squared (or 676) possible spaces.“</p>
      <p>In the review, feature-based <em>letter perception</em> is discussed. First the visual cortex needs to resolve stimulus-derived information into the features. I think current guesses place the amount to less than half of 26. If the intra-letter whites are used this figure can be elevated. (Let’s leave the perceptual processing role of the inter-letter white moot for now.) </p>
      <p>This might suggest the most efficient route to <em>word recognition</em> is to resolve identity directly at the feature level. My model is an attempt to outline the basics of such a route. The review opts for a hierarchical — instead of direct — route. Heirarchical processing is less efficient, from a neural computation point of view.</p>
