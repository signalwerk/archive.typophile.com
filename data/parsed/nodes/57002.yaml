    html: "<p>During the 1990s, I went to <a href=\"http://en.wikipedia.org/wiki/Alberto_Breccia\" rel=\"nofollow\">Alberto Breccia</a>'s comics workshop for a brief three months, and he had a great exercise for beginners: to train you to \"see\" and appreciate the white space, he would have you pick a black and white photo from a collection he had. Then, you would have to draw the picture on a colored piece of paper -- red, green, blue, etc. -- and fill in both the white and black areas. You would end up with a high-contrast drawing, and having to paint in the white areas made you appreciate that the white space was indeed part of a dynamic between it and the black. The white was a shape, just as much as the black was.</p>"
    html_clean: "<p>During the 1990s, I went to <a href=\"http://en.wikipedia.org/wiki/Alberto_Breccia\" rel=\"nofollow\" class=\"link-external\">Alberto Breccia</a>'s comics workshop for a brief three months, and he had a great exercise for beginners: to train you to \"see\" and appreciate the white space, he would have you pick a black and white photo from a collection he had. Then, you would have to draw the picture on a colored piece of paper -- red, green, blue, etc. -- and fill in both the white and black areas. You would end up with a high-contrast drawing, and having to paint in the white areas made you appreciate that the white space was indeed part of a dynamic between it and the black. The white was a shape, just as much as the black was.</p>"
