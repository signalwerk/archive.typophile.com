      <p>J, </p>
      <p>Sorry, i should have been clearer. I have of course read a lot in type text books etc. but i am looking for research that explores the importance of good letter spacing vs. non. I am putting forward the idea that the figure ground relationship between the positive and negative ground in type design and in book/poster design, is a vital aspect to the stressfulness and clarity of the intended communication. </p>
      <p>As you know a lot has been written about "how to" correctly do this, but im trying to determine "why" it is necessary. </p>
      <p>Why is it, for example, that Helvetica is often judged as a more aesthetically appealing typeface than Arial, even when looked at by people who know nothing about type. Being so similar i believe that there must be a sub-conscious psychological reason for this.</p>
