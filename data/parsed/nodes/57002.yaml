      <p>Christopher, on counterbalancing S3 should be A1, B1 and S4 should be A2, B2.</p>
      <p>If you found statistical differences with a t-test analysis, those differences would hold true, but it’s not the perfect test because it treats your 4 conditions as independent from each other. A 2x2 ANOVA would be a better analysis because it lets you compare your two A1 conditions against your two A2 conditions, and your two B1 conditions against your two B2 conditions. This reduces the probability of dismissing real differences as a chance event.</p>
      <p>As John points out, interpreting the results is definitely challenging.</p>
