      <p>Peter: <em>My aprior is that the feature-manipulative attunement that characterizes type design leads to the deliberate gauging of counters according to the integrity of their shape.</em></p>
      <p>Yes, I think this does happen, but largely as a by product of what we're doing with the black structure and features. But just because something happens in design doesn't mean that it is significant in reading, and it certainly doesn't mean that this kind of design developed because of significance in reading. There's a lot of stuff going on in type design, and not all of it is significant in its contribution to reading. Readability, as I apparently never tire of saying, is a prerequisite, not an achievement. The sheer variety of typefaces strongly indicates that much of the distinctive design in any given typeface is something built on top of readability, not something contributing directly to it.</p>
      <p><em>The Noordzijian idea that a letter is two shapes, and a word a complex of these leads to the idea that all of this is used.</em></p>
      <p>No, it doesn't lead to that idea. This is what I am saying: the Noordzijan description of what is happening in a letter -- which I think is one of the most useful contributions to type design, as I explained in my lecture at St Bride's a couple of weeks ago -- does not lead anywhere in terms of what we use during reading. Further, I don't think the 'two shapes' idea is necessary to the description. I ask, what is the sufficient role of the white? -- and it is to provide a contrastive ground for the letter shape. Without experimental evidence to the contrary, I'm not inclined to assign <em>shape</em> significance to the white.</p>
