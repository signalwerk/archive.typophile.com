      <p>I think that the figure/ground relationship of type is one thing, and the quality of Helvetica vs. Arial is another. The former does not necessarily affect the latter. See <a href="http://www.ms-studio.com/articles.html" rel="nofollow">"The Scourge of Arial"</a> for more info on Helvetica vs. Arial, and the reasons (not necessarily aesthetic or related to negative space).</p>
      <p>For general discussions of the white space between black type, see:</p>
      <p><em>Counterpunch</em>, by <a href="http://www.hyphenpress.co.uk/authors/fred_smeijers" rel="nofollow">Fred Smeijers</a></p>
      <p><em>Letters of Credit</em>, by <a href="http://www.godine.com/isbn.asp?isbn=1567922406" rel="nofollow">Walter Tracy</a></p>
      <p>...and also these online resources:</p>
      <p><a href="http://briem.ismennt.is/" title="http://briem.ismennt.is/">http://briem.ismennt.is/</a></p>
