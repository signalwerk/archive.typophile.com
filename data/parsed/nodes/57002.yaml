      <p>re. Mach bands...</p>
      <p>Bill, I fail to see the relevance of mach bands to type, except in terms of antialiased text on screen. The mach bands phenomenon appears to rely on a gradient transition between dark and light. I also note that the Wikipedia entry discusses and illustrates this in terms of dark and light, <em>not black and white.</em> Finally, the mach bands phenomenon is scale-dependent, as can be demonstrated by putting your illustration onscreen and then looking at it from different distances. So I don't think it is possible to say that a given typeface design exploits this phenomenon, other than in particular rendering modes at particular sizes.</p>
