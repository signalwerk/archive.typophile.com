      <p>Christopher, I was referring to a graphic in a draft of a study by Caroline Blais of the University of Montreal and Daniel Fiset. It used to be on line, but seems to have been pulled, perhaps for reworking and publishing. It was called “Skilled Readers Process Words Letter by Letter in Nearly Optimal Sequence.” It used the ‘bubbles’ technique of Gosselin and Schyns to uncover the features involved at different moments in image discrimination. A ‘classification image’ for a representative test word javel shows space-time voxels reaching statistical significance at the counter of the e, the right arm of the v and the interletter shape between the j and a. The results are interpreted using a serial reader modeling paradigm, but I thing a role-unit based modeling paradigm should be explored as well.</p>
      <p>I think the bubbles / classification image technique has great potential for identifying what features or units are being used in perceptual processing.</p>
      <p>John, we are at a stalemate. My aprior is that the feature-manipulative attunement that characterizes type design leads to the deliberate gauging of counters according to the integrity of their shape. And this becomes a functional operator in the evolution of type. The Noordzijian idea that a letter is two shapes, and a word a complex of these leads to the idea that all of this is used. Dean is right in suggesting tests for this, but I think it opens up fertile perspectives on what perceptual processing in reading entails, that is it opens up interesting perspectives on what really happens at a neural transmission level in the visual cortex.</p>
