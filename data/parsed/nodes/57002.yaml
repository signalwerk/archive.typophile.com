    html: <p>John, the article I showed you with the key features important for letter recognition wasn’t Pelli. It was an article from the folks that Peter mentioned (Fiset and Gosselin are two of them) using the bubbles methodology. In the bubbles methodology they take letters filtered in different spatial frequency channels then different portions of the letter are further occluded. Recognition can only happen if the most important frequencies and letter components remain. Unfortunately I don’t have a citation with me.</p>
