      <p>John, to the best of my knowledge, Pelli nowhere identifies the features that are indispensable to recognition. He does conclude in several places that items more primitive than letters — parts at the granularity of strokes — are indispensable. He does this in his  2006 paper “Feature Detection and Letter Identification,” and in his 2002 paper with Majaj, “The role of spatial frequency channels in letter identification.’</p>
      <p>All his papers are at <a href="http://www.psych.nyu.edu/pelli/papers.html" title="http://www.psych.nyu.edu/pelli/papers.html">http://www.psych.nyu.edu/pelli/papers.html</a></p>
      <p>You say: “[…] just because something happens in design doesn’t mean that it is significant in reading, and it certainly doesn’t mean that this kind of design developed because of significance in reading.” […] “[T]he Noordzijan description of what is happening in a letter does not lead anywhere in terms of what we use during reading.”</p>
      <p>I think your second statement is far too categorical. The Noordzijian statement and central attunements emergent in the design process can certainly lead to potentially important hypothesis. They did in my case. My claim is that your idea that (inside the bounded map created by the blacks, interletter and intraletter whites) the role of the white is “to provide a contrastive ground for the letter shape” is a widely held and oestensibly common sense assumption that needs to be explored, when it comes to what the visual cortex uses. I know of no evidence that has a bearing on this, either for or against. Certainly the white provides a contrastive field, but inside the bounded map or bouma it also provides criterial information toward rapid automatic visual wordform resolution in immersive reading, or so I think. I know I'm just repeating my mantra, but it seems to me to provide a powerful ground for understanding the importance of the white inside design.</p>
      <p>Did you say you gave a presentation relevant to this. Is it available?</p>
      <p>To get back to the original contaxt for this thread, Vignelli's claim that “[t]ypography is really white, its not even black. Its the space between the blacks that really makes it.” This sounds very much like Noordzij's comment that “[t]he white of the word is my only holdfast.” I think this is true of typography as a practice in the sense that in defining interletter spacing as well word spacing and line spacing, it is getting a handle on the white that makes it.</p>
