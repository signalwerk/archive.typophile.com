      <p>One of the other issues in dealing with white is figure/ground ambiguity or lack of it. In the West, 'notan' seems to most often refer to illustrations in which the white is used as foreground, such as snow on a mountain in Chinese and Japanese brush painting with ink. </p>
      <p>In Helvetica Bold or Black, and other bold or black type faces, I think the counters tend to pop out partly because as the black dominates more, so the eye may want to read the white as 'figure' rather than background. I don't know how much the effect in Helvetica Bold is due to Mach bands, and how much to figure/ground ambiguity, but I suspect both are at work.  </p>
      <p>In fonts for extended text, it seems that figure/ground ambiguity is actually a bad thing. You want the blacks to be more salient, to be 'read' and the whites not to read. One of the most interesting things to me in the testing of Clearview is that medium weights are more legible at a distance than bold ones. In text fonts, I think you have something like 1/3 black 2/3 white on average between the base line and x-height. That keeps the white as ground and black as figure, and avoids any ambiguity. </p>
      <p>That's where I'm with John, where also my Bullshit Detector--that's what we called it in the midwest when I was growing up--starts ringing with phrase "designing the whites".</p>
      <p>The whites are critical, but I am doubtful that their actual shape is as salient a factor as that of the blacks. For example as well as 'dark-light' (notan) being one balance in Chinese theory of ink brush painting, 'thick - thin' is another. When you alter the thick-thin balance of the black in a typeface it is very noticeable. But you are only altering the white in a counter by a few percent, where you might be doubling or tripling the thickness of a thin. And the eye responds to small absolute but big relative change of the black in a way that shows to me it's more salient, i.e. has more impact.</p>
      <p>This is not to deny that we 'read' closed counters, etc., as Peter argues. That may be. And having the right letter spacing, and counters in proportion to the right letter spacing is no doubt important. But I am skeptical that the details of the shapes of the whites are as important as those of the blacks.</p>
