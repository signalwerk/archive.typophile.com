      <p>John, I think designing the white means being attuned to the white as shape in the process of designing, and it means designing so the whites are all in the same key, to use a musical metaphor.</p>
      <p>In some words, like ‘look’ the wide open counters are the most salient feature. This is even true for ultra bolds. I can't believe it isn't used. Some recent tests appear to confirm this. Considered from the point of view of role-units, counters vary at least as much and are as rich in cue-value as stems and curves.</p>
      <p>What I'm still wondering about is if the white uses the same spatial frequency scale as the black. It could be that it uses a coarser scale. And if it does, what does this indicate in process terms. Is information at the density or granularity of the salient whites resolved first?</p>
      <p>It’s convenient that the raven is black. If it were an osprey, you'd be using the white as information.</p>
