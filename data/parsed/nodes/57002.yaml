      <p>Whenever people start talking about ‘designing the white’ or about how the white is more important than the black, my bogosity meter starts to twitch. It sounds really cool to say one ‘designs the white not the black’, but what does it mean? What is the process? How does this process differ from designing the black?</p>
      <p>Peter: <em>both the black and the white are information contributing to visual word-form resolution</em></p>
      <p>I'm not convinced of that or, at least, not convinced that the kind of information contributed by the white is either similar to or as important as that contributed by the black. Letters are positive shapes occupying negative space. The white is space more or less occupied by a given letter shape. Yes, the letter shape creates internal and inter-letter space-shapes, but those shapes a) vary much less than the letter shapes so provide relatively little cue value and b) are not independently featural, their size and shape is defined by the letter weight and style. Letter shapes of different weights and styles may still retain obvious structural and featural similarities, but the white spaces within and around them will not.</p>
      <p><em>Underlying this is the principle that the rods and cones in the retina are responsive to reflected light.</em></p>
      <p>And yet we do not obtain more information from more bright things: we obtain information from contrast which enables us to discern and recognise shapes. When I see a raven fly across a bright sky, the shape of the sky around the raven isn't where I'm getting the information from to recognise the bird: it's the bird that is the shape, and the sky is only providing a field of sufficient contrast to see the shape.</p>
