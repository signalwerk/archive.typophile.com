      <p>@ nhallam:</p>
      <p>Sorkin made some good points. In order to answer the "why" you will need to conduct controlled experiments with a directed research question, a clearly articulated hypothesis and independent and dependent variables. To conduct research at this level, you will probably need about two years of undergraduate psychology specifically focused on cognition. Psych 2000 (or the equivalent of the primary 2nd year psychology course at your institution), a few labs, and an intro stats course should be a good start. And your supervisor will more than likely need to be research scientist, not a designer.</p>
      <p>Sorkin mentioned:</p>
      <p>Pelli, D.G., Tillman, K. A. (2008) The uncrowded window of object recognition. <em>Nature Neuroscience</em>. 11(10) 1129–1136</p>
      <p>This is a well respected journal with a high impact factor. Check out the references. There is a lot of good stuff there, but it's pretty narrow-cast science. Pelli and Tillman (2008) is a review article and is a little more digestible. You may find the reference somewhat obscure, and you'll probably need to get someone who knows stats to help you interpret the results. I usually do as I still haven't got as much math under my belt as I would like. I believe I had to go through the database and journals at my school to get this, which usually requires paid access. My school pays about $3,000,000 a year to have access to all of this knowledge (pier-reviewed journals &amp;c) so you may need to call in a favour. However, I often have great success simply contacting the author directly and asking if they wouldn't mind sharing their research with you.</p>
      <p>Larson also has a nice piece of work online:</p>
      <p><a class="freelinking external" href="http://www.microsoft.com/typography/ctfonts/wordrecognition.aspx" rel="nofollow">The science of word recognition</a>.</p>
      <p>One of the earlier players in this game:</p>
      <p>Bouma, H. (1973). Visual Interference in the Parafoveal Recognition of Initial and Final Letters of Words, <em>Vision Research</em>, 13, 762-782.</p>
      <p>A lot of research in this area is still in dispute however. It's fairly hot at the moment. To date, the answers to our "why" questions are primarily supported by convention, aesthetics and intuition, and not objective measures of human performance and empirical data. There are two pretty strong camps on this area so be mindful of both. Often, threads of this nature end up in a "art vs science" debate. Myself, I favour science.</p>
