      <p>I think it was Frutiger who first said that he designs the whites, rather than the blacks. I think that's a huge exaggeration to make the point that whites are important, which is true. </p>
      <p>I think there are a lot of different effects at play with whites. One of the important ones is the phenomenon which I learned from Kevin Larson is called "Mach Bands". </p>
      <p>Here from the Wikipedia article of that name is an example: </p><div class="imageWrap"><img src="http://typophile.com/files/240px-Mach_band_6317.svg.png"></div><p></p>
      <p>The white Mach Band is the whiter band you see to the left of the black. (There is also a blacker one to the right.] It is so obvious that you will be surprised that it disappears when you cover the black on the screen with a piece of white paper. </p>
      <p>It is also noted by G. Noordzij, though he mistook the cause. The cause, as the article says, lies not in optics, but in the way our brain processes contrasts.</p>
      <p>This is one of the things that Helvetica and Frutiger in different ways are designed to take advantage of. The closed shapes of the Helvetica bold e I think result in two Mach Bands enhancing each other in the 'gap', causing the letter to look bright and scintillating. The smaller eye of the e in bold weights also makes the Mach bands more vibrant. Helvetica really does take advantage of this. </p>
      <p>Frutiger does it in a different way. If you compare the e's in Frutiger and Myriad, you will see that the lower terminal in Frutiger swells lightly, producing a sharp angle in the black and a more vibrant Mach Band effect than in Myriad, which tapers and is much less vibrant and assertive, even though the difference in the outlines is very small.</p>
      <p>[Sorry I don't have the time to copy and post the pictures]</p>
      <p>The way Mach Bands are handled is an important feature of whites, but only one. Also it is not necessarily desirable. In a text face, you may well want less shimmer, and more quietness. </p>
      <p>There are a lot of other issues, and I think it's important to recognize that there isn't just one effect involved.</p>
