      <p>I would like to again raise a distinction between between John's model and a notanic model in which the forms are not opposed but linked. Perhaps rather than linked I should say inseparable. Take the example of the bowl. A bowl is one because of the empty space made inside it. It would be silly say the most important part of a bowl is the empty part of the bowl or the body of the bowl. If they are a bowl they are not opposed. The opposite is true. I do want to say that despite my preference for thing about B&amp;W in terms of notan that I don't think that this means that black &amp; white have to be the same, equal, or  equivalent. Far from it. In fact I would be surprised if that was so. Inseparability does not preclude difference. But at the same time as far as I know we don't have substantial research based reasons to characterize either one's role. If I am mistaken I would love to be corrected. Obviously type is not bowls or physical in the same way and type isn't one shape. But despite all these differences it seems to me that the reality that opposition is nonsense carries through. I realize that this analogy may sound like Taoist propaganda to some and that is okay. I accept that. </p>
      <p>But rather than dwell on white vs black, or notan or not notan, I would suggest that the interesting way of looking at this is to think in terms of features and their clarity or ability to be detected. </p>
      <p>The fact that they are in B&amp;W just happens to make things less complicated. When you detect an animal in the forest - perhaps a deer, your image may be incomplete because of bushes grass or brush; or because of tree trunks or branches, but if you see enough you mentally assemble the parts into a whole deer. This might be in full and posisbly very flat color which is low contrast or it may be in near silhouette. But in all cases in  we are assembling recognized features, if given enough of them, into recognition of a 'deer'.</p>
      <p>Deer in silhouette: <a href="http://www.flickr.com/photos/harve64/2271532149/" title="http://www.flickr.com/photos/harve64/2271532149/">http://www.flickr.com/photos/harve64/2271532149/</a></p>
      <p>The process of recognizing letters is a similar process. We are recognizing features ( Peter would say salient features ). And it is the job of the black &amp; white (however characterized) not just to make the features themselves easy to detect, but also to group, or as Pelli would put it to Integrate them into a whole 'a' or 'g'.</p>
      <p>See: Crowding is unlike ordinary masking:  Distinguishing feature integration from detection  <a href="http://journalofvision.org/4/12/12/" title="http://journalofvision.org/4/12/12/">http://journalofvision.org/4/12/12/</a> </p>
      <p>So "white's" role, inseparable from "black's" or not, is to facilitate this process. </p>
      <p>Bill thanks for the Mach band.</p>
      <p>Peter : In terms of tuning the white not simply as a necessary aspect of the black but a a feature, in the way that we look at thins &amp; thicks in black strokes, stem widths, and so on -  what aspects are you thinking of? I assume you mean things like wordspace, letterspaces and countershapes. Perhaps lines spaces get a look in as well. One other kind one occurs to me as well: proximal spaces such as with punctuation, but also within glyphs such as between the dot in an ! and the stroke above as well as in the openings or spaces of: a e, c 3 &amp; 5, U &amp; H, f &amp; t,  and so on. Do you have others you would like to bring up? Is this what you mean?</p>
