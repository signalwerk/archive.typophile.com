      <p><em>Did you say you gave a presentation relevant to this. Is it available?</em></p>
      <p>I'd been told that the lecture would be recorded, but in the event they didn't record it. I may give it again at TypeCon, but this is not confirmed yet.</p>
      <p><em>To get back to the original contaxt for this thread, Vignelli’s claim that “[t]ypography is really white, its not even black. Its the space between the blacks that really makes it.” This sounds very much like Noordzij’s comment that “[t]he white of the word is my only holdfast.” I think this is true of typography as a practice in the sense that in defining interletter spacing as well word spacing and line spacing, it is getting a handle on the white that makes it.</em></p>
      <p>I can agree with all of that, because none of it implies or requires a significance for the <em>shape</em> of the white in reading. It is critical to get a handle on the amount of white, but the shape of the white, whether inside the letters, between the letters, between the lines of text, or anywhere else on a page including text is wholly derived from the shape of the letters, the spacing of the letters, and the arrangement of the text on the page.</p>
      <p>Now for Noordzij, who insists on total control of typography, tuning typefaces for specific uses, it makes more sense to talk in terms of black and white working together, because he is treating the black as mutable as the white. But for most typographers the black is a given.</p>
