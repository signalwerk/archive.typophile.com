      <p>Peter says “Psychology sees the black but has nothing to say about the white….Underlying this is the principle that the rods and cones in the retina are responsive to reflected light.”</p>
      <p>The rods and cones (photoreceptors) respond to both white and black. There is a base firing rate for both. When looking at something that is the perfect average of the room luminance (i.e. a medium grey), the photoreceptors will fire at a baseline rate. If the photoreceptors then switch to looking at something black, they will fire at a rate lower than the baseline (thus seeing black). If the photoreceptors switch to looking at something white, they will fire at a rate higher than baseline (thus seeing white). White and black are both “seeable”, thus the same photoreceptors and recognition processes can be used for black text on a white background and for white text on a black background.</p>
      <p>White (or background) is necessary for letter recognition because without sufficient interior and exterior letterspace, the letter is unrecognizable. But I would argue that we recognize the shapes of the letters and not the shapes of the spaces because that is an easier comparison task. If we look at a single letter, we need to decide if it’s one of 26 possible letters (in English). If we’re looking at the spaces, there are 26-squared (or 676) possible spaces. It’s more efficient to search among 26 possibilities, and our brains like efficiency.</p>
      <p>This has been a very interesting discussion, and a pleasure to read!</p>
