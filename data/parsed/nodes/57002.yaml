      <p>John, I take it from your reply that you do see the effect, though for some reason you don't admit it. And it doesn't depend on the outer frame in the G above.  </p>
      <p>As I said this is but one example of the more general effect of 'lateral inhibition'. I don't know the literature on this and what conditions are labeled 'Mach Bands' and what labeled 'lateral inhibition', but illusions of brighter and darker patches in black and white designs are quite common, and don't depend on the screen or gradations of gray. </p>
      <p>Here is another example of 'shimmer', and here, in the Hermann Grid Illusion, only black and white are involved:</p>
      <p>  </p><div class="imageWrap"><img src="http://typophile.com/files/HermannGridIllusion_500_4484.gif"></div><p></p>
      <p>Further, it works pretty small. And of course type fits into various grids, so it is relevant to type design.</p>
      <p>Now there is debate about what exactly causes these various illusions, but the important point is simply that they are at work in type design. </p>
      <p>I think it is absurd to deny that such 'pop' or 'shimmer' has played an important role in the popularity of Helvetica Bold for display. </p>
      <p>Slight scintillation as I said helps get attention in display type, and so is something a designer might want to take advantage of. Nick Shinn said he deliberately did so in his Eunoia design. </p>
      <p>In smaller sizes, such effects still happen, but more with bolder type, and probably more with sans serifs than with serifs. In general, bold type--more black--seems to give rise to these effects more. </p>
      <p>That generally such effects are less evident in text faces is not a reason to dismiss the importance of these optical effects. Rather it is evidence that traditional text faces in general avoid them, and that it is a good idea to do so. </p>
      <p>That faces used for extended text are generally of medium weight, and not very light or bold may be partly because these conditions avoid such disturbing illusions. And it may be that serifs help defeat such effects. For example, one of the articles shows that non-square shapes in the Hermann Grid can kill the scintillation. </p>
      <p>I really think you are making a mistake in dismissing these effects as irrelevant. </p>
      <p>They are by no means the only reason for the importance of attending to whites in type design, but they are one reason.</p>
