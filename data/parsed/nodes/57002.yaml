    <p>I am currently writing a paper that is discussing Massimo Vignelli's quote: </p>
    <p>"We think typography is black and white. Typography is really white, its not even black. Its the space between the blacks that really makes it."</p>
    <p>I'm looking or any previous writings or information about the topic that I could reference in my paper. </p>
    <p>I would have thought that someone would have written about the topic, but I have yet to find any serious writings. </p>
    <p>If you know of anything, please post it up!</p>
    <p>N</p>
