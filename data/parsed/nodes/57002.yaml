      <a href="http://www.mapageweb.umontreal.ca/gosselif/FISET_COGNEURO_2008.pdf" title="http://www.mapageweb.umontreal.ca/gosselif/FISET_COGNEURO_2008.pdf">http://www.mapageweb.umontreal.ca/gosselif/FISET_COGNEURO_2008.pdf</a><br>
