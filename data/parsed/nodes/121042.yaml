      <p>The following Google Fonts (<a href="http://www.google.com/fonts" title="www.google.com/fonts">www.google.com/fonts</a>) are similar to Norpeth, to greater and lesser degrees, and are available free for print and web. Perhaps one of them could work for you:</p>
      <p>Play, by Jonas Hecksher<br>
      Cuprum, by Jovanny Lemonad<br>
      Maven Pro, by Joe Prince<br>
      Exo and Exo 2, by Natanael Gama<br>
      Armata, by Viktoriya Graboska<br>
      Ropa Sans, by Botio Nikoltchev<br>
      Doppio One, by Szymon Celej<br>
      Ruda, multiple designers<br>
      Lekton, multiple designers</p>
