      <p>Some commercial fonts that are also very close, and which come in a full family of weights:</p>
      <p>Klavika:<br>
      <a href="http://www.myfonts.com/fonts/processtype/klavika/" title="http://www.myfonts.com/fonts/processtype/klavika/">http://www.myfonts.com/fonts/processtype/klavika/</a> [single-story |g| available as stylistic alternate]</p>
      <p>Sentico Sans:<br>
      <a href="http://www.myfonts.com/fonts/dtptypes/sentico-sans-dt/" title="http://www.myfonts.com/fonts/dtptypes/sentico-sans-dt/">http://www.myfonts.com/fonts/dtptypes/sentico-sans-dt/</a></p>
      <p>Coupe:<br>
      <a href="http://www.myfonts.com/fonts/t26/coupe/" title="http://www.myfonts.com/fonts/t26/coupe/">http://www.myfonts.com/fonts/t26/coupe/</a> [double story |g| only]</p>
      <p>Soleto:<br>
      <a href="http://www.myfonts.com/fonts/daltonmaag/soleto/" title="http://www.myfonts.com/fonts/daltonmaag/soleto/">http://www.myfonts.com/fonts/daltonmaag/soleto/</a></p>
      <p>Klint:<br>
      <a href="http://www.myfonts.com/search/Klint%20Rounded/fonts/" title="http://www.myfonts.com/search/Klint%20Rounded/fonts/">http://www.myfonts.com/search/Klint%20Rounded/fonts/</a> [double story |g| only]</p>
      <p>Gustan:<br>
      <a href="http://vllg.com/luxtypo/gustan" title="http://vllg.com/luxtypo/gustan">http://vllg.com/luxtypo/gustan</a></p>
      <p>Great Escape:<br>
      <a href="http://www.myfonts.com/fonts/typodermic/great-escape-rg/" title="http://www.myfonts.com/fonts/typodermic/great-escape-rg/">http://www.myfonts.com/fonts/typodermic/great-escape-rg/</a></p>
