    html: "<p>Well, four months later, and here's what we are close to going with: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/13400.gif\" alt=\"final court logo\"> <br> <br>Of course, as many of you have pointed out (and as I've always known) if you show a client multiple options, they'll always choose the least interesting of the bunch. I did try and simplify it a bit so it wasn't quite as trendy and hopefully the lock-up in a color block will be used consistently. We'll see. ;o) I still need to tweak the kerning and such. <br> <br>Thanks for all of the advice everyone! <br> <br> <br></p>"
