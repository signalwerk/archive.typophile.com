    html: <p>#1 has a good concept, but the execution is too... Well,  <br>too CSA, and is inappropriate. I'm sure there are better  <br>ways to execute an illustration here. Think fine-etched  <br>engraving (like money perhaps). <br> <br>#2 is the only one that seems appropriate for a judicial  <br>branch. The pillar is a better (less obvious) way to say  <br>'law' than the scales of justice. That said, the pillar is still  <br>obvious. Is there a classy way to render the loon, so it's  <br>not so cartoony? <br> <br>#3 is way too trendy. The color, the illustration stlye,  <br>even the subject matter is ultra-obvious (which is why  <br>you've rendered it this way, I'm guessing). I'd avoid this  <br>direction, even though, we could all guess that the  <br>client asked for it. <br> <br>Best of luck.</p>
