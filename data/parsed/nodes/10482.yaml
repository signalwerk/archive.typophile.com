  html: "<p>I hope this is fitting for this forum. It's more logo-related than logo-type-related, but seeing the great critiques here compelled me to post. Plus, I'm the only graphic designer in the building, so it helps to get other's input. <br> <br>This is a logo for our branch of government here in MN. I've come up with 3 variations that I (and a few others) seem to think are the strongest. I now need your harsh, honest critiques! <br> <br>There's one disclaimer, and one I'll probably take some heat for saying...but I an limited to only free fonts and whatevers on my machine (gasp!). As our state is in the hole a few billion, getting darrel a few licensed fonts isn't really on the priority list. <br> <br>So, here they are. <br> <br>Logo one (uses Tanek, from CSA) represents the state (duh) and the 10 court districts rendered in a stained-glass-like way. This also hints at the stained glass ceiling installation in the supreme court. PROS: nice double-meaning, simple CONS: not as nice in one-color. <br> <br>Logo two (uses Futura, from Apple, and Covington, from apostrophiclab) is the more 'elegant' of the bunch (if not just a bit hokey). It's the state bird perched upon a roman column. (bird = MN, column = courhouse) PROS: most 'regal' of the bunch CONS: is it hokey? (Most have said 'no' but I still wonder...) <br> <br>Logo three (uses Futura, from Apple) is a simple rendering of common iconography...the state and the scales of justice. PROS: recognizable iconography CONS: cliche? Too trendy? <br> <br><img src=\"http://www.typophile.com/forums/messages/29/7047.gif\" alt=\"Logos (GIF)\"> <br> <br>now, let me have it!</p>"
  html_clean: "<p>I hope this is fitting for this forum. It's more logo-related than logo-type-related, but seeing the great critiques here compelled me to post. Plus, I'm the only graphic designer in the building, so it helps to get other's input. <br> <br>This is a logo for our branch of government here in MN. I've come up with 3 variations that I (and a few others) seem to think are the strongest. I now need your harsh, honest critiques! <br> <br>There's one disclaimer, and one I'll probably take some heat for saying...but I an limited to only free fonts and whatevers on my machine (gasp!). As our state is in the hole a few billion, getting darrel a few licensed fonts isn't really on the priority list. <br> <br>So, here they are. <br> <br>Logo one (uses Tanek, from CSA) represents the state (duh) and the 10 court districts rendered in a stained-glass-like way. This also hints at the stained glass ceiling installation in the supreme court. PROS: nice double-meaning, simple CONS: not as nice in one-color. <br> <br>Logo two (uses Futura, from Apple, and Covington, from apostrophiclab) is the more 'elegant' of the bunch (if not just a bit hokey). It's the state bird perched upon a roman column. (bird = MN, column = courhouse) PROS: most 'regal' of the bunch CONS: is it hokey? (Most have said 'no' but I still wonder...) <br> <br>Logo three (uses Futura, from Apple) is a simple rendering of common iconography...the state and the scales of justice. PROS: recognizable iconography CONS: cliche? Too trendy? <br> <br><img src=\"http://www.typophile.com/forums/messages/29/7047.gif\" alt=\"Logos (GIF)\"> <br> <br>now, let me have it!</p>"
