    <p>As some know, I have relocated to Buffalo, NY. Those who were fortunate enough to attend last year’s TypeCon recognize the resources that exist here in the city. After missing Hal’s class during TypeCon I am thrilled to be getting my hands inky and learning a few basic moves. These images were taken last night during our class. Thanks again Hal.</p>
