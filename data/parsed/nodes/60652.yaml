    <p>Dear all,</p>
    <p>I'm not sure this is the right forum, so my apologies if this post is misplaced.</p>
    <p>I'm looking for an option in Adobe Acrobat Professional to make one book<br>
    subdivided in stapled sets.<br>
    This means that I have e.g. 10 pdf documents which should be Combined as a Binder, BUT as chapters.<br>
    How can this be done?</p>
    <p>I'd be very happy with some tips to solve this issue or information where to obtain information about this.</p>
    <p>thanks!</p>
    <p>Bas Schouten</p>
