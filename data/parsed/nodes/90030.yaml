    <p>So I'm starting to dabble in type design and have been messing around with the calligraphic brushes in illustrator.</p>
    <p> I've skeletoned out some letter forms with lines and curves. I would now like to apply a calligraphic stroke, but I would like the nib/tip of the calligraphic brush to be a rounded rectangle and not oval shaped. There doesn't seem to be an advanced options area for calligraphic brushes. I almost reached the affect by making the rounded rectangle shape into a scatter brush and reducing the spacing, but the minimum spacing is 10% (I would need 0%).</p>
    <p>Is there any way to create this affect? Is there any way to create a calligraphic brush with a custom shaped nip/tip?</p>
    <p>Thanks in advance.</p>
    <p>j</p>
