      <p>&gt; I understand that type design in very detailed and intricate process.<br>
      &gt; I am trained in the fine arts and know the proper way to approach a project like such.</p>
      <p>Type design is not a fine art, it's a craft, like architecture or furniture design.</p>
      <p>What fine arts training do you have that includes type design training? Unless you have *specifically" studied type design (whether formally or not), you don't know how to approach it. This doesn't mean you shouldn't, or shouldn't learn. Note also that type design is not the same thing as calligraphy.</p>
      <p>&gt; My current endeavor takes my down an alternate path. This font is based deeply in mathematics and precision,<br>
      &gt; hence it's creation in a computer program.</p>
      <p>Modern typefaces are pretty much *all* created in computer programs. It's just that most type designers use dedicated type design programs to do it. Maybe half of them do sketches first, and about as many do not.</p>
      <p>Cheers,</p>
      <p>T</p>
