  html: |-
    <p>Hi, guys,</p>
    <p>I am looking for some critique on this project. It started as a sketch of the uppercase characters &amp; developed into lowercase. I am wondering whether to introduce some weight to this project as the negative space in some of the lowercase glyphs contrasts a lot with the uppercase. </p>
    <p>Does the x height of the lowercase fit the cap height ok? I looked at Gotham Condensed Bold for some guidelines on vertical proportion. </p>
    <p>Would appreciate any feedback from you experts out there.</p>
    <p>Regards,</p>
    <p>Harrycb</p>
