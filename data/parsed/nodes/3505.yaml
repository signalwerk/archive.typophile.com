  html: <p>Anyone interested in showing off ID/Style Guides they've put together for clients? I haven't done one in years and am now about to do one for our state agency. I have the basics down (color rules, size restrictions, placement, media types, etc.) However, this is going to be targeted specifically at the average employee, as we do not have a formal marrketing group to force adherence. So I'm interested in anything that is targeted at the LCD...the rogue webmaster putting together an intranet oblivoius to IT standards or the secretary that is getting logo sweatshirts done 'just for fun' type of thing. <br> <br>Or anything, really...I just like looking at style guides. ;o)</p>
