    html: <p>Thanks Kyle. I had forgotten all about that identityworks.com site. <br> <br>I've actually found a handful of good university style guides, which is probably as close as I'm going to get to the type of verbage I need for this project.  <br> <br>I'll post what I have so far hopefully today. <br> <br>Also, while I'm at it, has anyone had to design an ID system where there is an existing 'seal' that is often used? Be default or state's seal has become the de-facto 'logo' for any agency that is too lazy to use the seal properly.  <br> <br>Oh...and as to the system font thing...my first gig was as an intern at 3M. I could use pretty much anything as long as it was either Times or Helvetica. <br> <br>As much as we cringe at using system fonts, there are financial + IT related reasons for doing it, and consistency with system fonts is probably better than no consistency at all. <br> <br>I'm not sure if I can convince the powers that be here that we should also be considering type setting standards. We hardly have a stationery system at this point. I have a lot of talking to do... ;o)</p>
    html_clean: <p>Thanks Kyle. I had forgotten all about that identityworks.com site. <br> <br>I've actually found a handful of good university style guides, which is probably as close as I'm going to get to the type of verbage I need for this project.  <br> <br>I'll post what I have so far hopefully today. <br> <br>Also, while I'm at it, has anyone had to design an ID system where there is an existing 'seal' that is often used? Be default or state's seal has become the de-facto 'logo' for any agency that is too lazy to use the seal properly.  <br> <br>Oh...and as to the system font thing...my first gig was as an intern at 3M. I could use pretty much anything as long as it was either Times or Helvetica. <br> <br>As much as we cringe at using system fonts, there are financial + IT related reasons for doing it, and consistency with system fonts is probably better than no consistency at all. <br> <br>I'm not sure if I can convince the powers that be here that we should also be considering type setting standards. We hardly have a stationery system at this point. I have a lot of talking to do... ;o)</p>
