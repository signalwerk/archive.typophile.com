    html: "<p>I think the style guide is good. <br> <br>On the style guide, depending on who your audience is, it might help to separate out the logo use and abuse advice for different media/functions: one page for use on the web (size, borders, file-type etc); one page for color printing; one page for black and white printed matter; one page for signage etc. <br> <br>Otherwise, there may be a danger that people say 'Oh well, I prefer the signage version, and although I'm about to put out a leaflet, it's \"approved\" so I think I will use that.' Also some of your audience may start reading about Pantone colors and just think 'This is all stuff for professional printers, I reckon I'll just do the best I can' <br> <br>It might also be useful to divide sections clearly into \"Preferred\" \"Tolerated\" \"Forbidden\" categories: sort of red, amber and green. Otherwise my guess is people will tend to treat anything not expressly prohibited as permitted. That's how (we) lawyers think. <br> <br>Do you need as many alternatives as you have? For instance, do you need both the green on black and the black on green horizontal versions (since both have the red too)? Which is preferred, or is it a totally free choice? Is the version with the logo preferred to the all-words version, or don't you mind?</p>"
