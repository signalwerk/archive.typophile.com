      <p>Okay, it appears your sample has a larger counter in the O than Impact has. If you substitute Impact's zero for its O, it is still a good approximation.</p>
      <p>Placard MT Condensed Bold is another option:<br>
      <a href="http://www.myfonts.com/fonts/mti/placard-mt/" title="http://www.myfonts.com/fonts/mti/placard-mt/">http://www.myfonts.com/fonts/mti/placard-mt/</a></p>
      <p>or Brown Gothic Black:<br>
      <a href="http://www.fonts.com/font/shinntype/brown-gothic/black?SiteId=15" title="http://www.fonts.com/font/shinntype/brown-gothic/black?SiteId=15">http://www.fonts.com/font/shinntype/brown-gothic/black?SiteId=15</a></p>
      <p>or Helvetica Inserat:<br>
      <a href="http://www.myfonts.com/fonts/linotype/helvetica-inserat/" title="http://www.myfonts.com/fonts/linotype/helvetica-inserat/">http://www.myfonts.com/fonts/linotype/helvetica-inserat/</a></p>
      <p>or CG Triumvirate:<br>
      <a href="http://www.fonts.com/font/monotype/cg-triumvirate/compressed?SiteId=15" title="http://www.fonts.com/font/monotype/cg-triumvirate/compressed?SiteId=15">http://www.fonts.com/font/monotype/cg-triumvirate/compressed?SiteId=15</a></p>
      <p>or Benton Sans:<br>
      <a href="http://www.myfonts.com/fonts/fontbureau/benton-sans/" title="http://www.myfonts.com/fonts/fontbureau/benton-sans/">http://www.myfonts.com/fonts/fontbureau/benton-sans/</a></p>
