      <p>You're welcome.</p>
      <p>It seems for sure that the data in the PDF and others like it were created either a long time ago, or with non-standard Thai fonts.</p>
      <p>(I know about this issue with Thai, as I have dealt with these issues in many languages over the past two decades. It's a real nightmere. Unicode aims to correct the problem for now and the future. The problem that you are facing is with the old data.)</p>
      <p>To create a workable data conversion program, you need to know the old Thai encoding for each character, or to obtain a copy of the old Thai font which was used to create the files and the PDF. Can you gwet hold of either this information, or one of the old Thai fonts which were used? (Different Thai fonts may have been used by different people, creating the need for different conversion tables in the data conversion program.)</p>
      <p>There was a program called "Add/Strip" on Apple Macintosh to create such a program. I am certain that there are similar programs on Windows. Contact FontWorld (<a href="http://www.fontworld.com">www.fontworld.com</a>, if you seek a custom solution - they have been doing this stuff for manty years).</p>
