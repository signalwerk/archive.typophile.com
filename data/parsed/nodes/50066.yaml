      <p>Where did you get an Adobe Thai font? How old is it?</p>
      <p>Proper Thai fonts today, to operate correctly in Adobe InDesign CS/3 require to be encoded in Unicode.</p>
      <p>If the font is encoded in Unicode, it should recognize all Thai characters correctly.</p>
      <p>Very old fonts, even in early PostScript or TrueType font formats, were not encoded in Unicode. As a result, they will not behave correctly.</p>
      <p>"Smart" OpenType fonts, if programmed intelligently, will not only treat Thai text encoded in Unicode correctly, but will also make "intelligwnt" contextual changes of certain Thai characters, such as switching one letter with a average character height, for another alternative character with a higher than average character height.</p>
      <p>I am unaware if any "smart" OpenType Thai fonts are available, but I know my friends at FontWorld (<a href="http://www.fontworld.com">www.fontworld.com</a>) are working on releasing a package early next year.</p>
