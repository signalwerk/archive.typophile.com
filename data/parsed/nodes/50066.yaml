      <p>Israel, the Adobe Thai fonts are CFF OpenType, Unicode encoded. I know, because I made them. :)</p>
      <p>There are a number of other OpenType Thai fonts available, including the classic Linotype Sukothai and Sirichana designs (the latter partly redesigned).</p>
