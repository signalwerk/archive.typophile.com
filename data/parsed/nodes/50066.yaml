      <p>You can use Adobe Thai in InDesign CS3, with a couple of caveats, but it is important that you set the language of the text to [No language] for spellchecking etc. purposes. InDesign does not support Thai text beyond basic layout: no spellchecker, no hyphenation dictionary, etc. For some reason, the layout only works if the language is set to [No language].</p>
      <p>I'd say that about 99% of Thai layout works correctly in InDesign CS3. The thing that doesn't work is decomposition of the sara am vowel, which causes mark collisions when the preceding letter also takes a tone accent. There are manual ways to fix this, but these involve editing the text string, so are far from ideal.</p>
