    <p>Hi Folks,</p>
    <p>Does anyone have any experience with using Adobe Thai Font in InDesign (CS3)?</p>
    <p>I have to copy text from a PDF document into InDesign, in order to be able to move around some text. The problem is, that I cannot get Adobe Thai Font to work properly (that is to show the proper Thai characters/signs). </p>
    <p>Can anyone help me?</p>
    <p>Kind Regards<br>
    Anne</p>
