      <p>I would send them an email, with a copy to Adobe's Type Development Department. Besides the encoding question, describe the problem of copying Thai text from the PDF.</p>
      <p>===</p>
      <p>It is very likely that if Adobe sold it recently, it is encoded properly with Unicode, as Unicode has been supported by Adobe for many many years.</p>
      <p>There is also the very likely possibility that the text that you copied from the PDF appeared as Thai, but was encoded in some wierd non-standard way from a long time ago.</p>
      <p>The PDF format has been around for a long time.</p>
      <p>Before text was encoded in Unicode, there were many non-standard ways of encoding text for Thai and other non-Latin languages.</p>
      <p>If this is the case, there are two options.</p>
      <p>A) If it's a small amount of text, then the text must be retyped using a font which was encoded in Unicode.</p>
      <p>B) If it's a large amount of text, such as page after page after page, then a simple text conversion program must be written or acquired, to convert the old text into the new Unicode text.</p>
