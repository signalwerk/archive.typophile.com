      <p>Hmm, thank you! Yes Futura of course seems close, and fitting with Chicago's Miesian history, but its those sleek lower crossbars. Sadly yes could be re-drawn but I would love to set a whole drawing set in it -- with different weights -- not just a few words. </p>
      <p>Neutraface is close for a contemporary re-make, I think ... still looking for the "heritage" version though ...</p>
