    html: |-
      <p>Sorry, don't know the original name of the typeface this signage was made from.<br>
      My first thought was "<a class="freelinking external" href="http://www.myfonts.com/search/futura" rel="nofollow">Futura</a>" but after a closer inspection, too many details are off. That's clearly not solving this case and you're probably not after this kind of answer but could be easily redrawn from Futura: /C finials "à-la-/G", lowering /H crossbar, highering /A crossbar<br>
      More alternatives: <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/urw/erbar" rel="nofollow">Erbar</a></strong> (could work as it, probably the closest I could get), <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/semplicita-pro" rel="nofollow">Simplicita</a> (quite same issues as Futura), <a class="freelinking external" href="http://www.myfonts.com/fonts/durotype/simplo" rel="nofollow">Simplo</a> (same issues as Futura + /R off), <a class="freelinking external" href="http://www.myfonts.com/fonts/paratype/journal-sans" rel="nofollow">Journal Sans</a> (/K and /R off)</p>
