  html: |-
    <p>The swedish independent type foundry Fountain has just released the font Capri designed by Felix Braden. This geometrical sans-serif antiqua combines ancient roman design principles with modern letter-proportions to its own individual character. Capri stands for the contemporary interpretation of classical elegance and is predestined for advertising in the fashion or beauty business. The complete Capri family includes 4 fonts and is available for just 69 EUR.<br>
