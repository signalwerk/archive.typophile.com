    <p>There are gimmicky fonts and there are solid fonts. The gimmicky ones are fleeting. Cool for a moment, but they tire quickly. Emigre and T-26 and even some Underware fonts in time will look the same way. Then there are typefaces that feel standard, that feel timeless and hardworking — by that I mean versatile, usable, readable. The problem with those two extremes is you want something that works hard, but that feels fresh. Something that will last but that will still let you pull out some surprise and some sparkle in your system. A few typefaces come to mind — Meta (<a href="/web/20080906163114/http://www.typophile.com/wiki/Erik%252BSpiekermann" class="wiki">Erik Spiekermann</a>) had that quality. And more recently Amplitude (<a href="/web/20080906163114/http://www.typophile.com/wiki/Christian%252BSchwartz" class="wiki">Christian Schwartz</a>) and Pill Gothic (<a href="/web/20080906163114/http://www.typophile.com/wiki/Christian%252BRobertson" class="wiki">Christian Robertson</a>).</p>
    <p>Now enters Freight (<a href="/web/20080906163114/http://www.typophile.com/wiki/Joshua%252BDarden" class="wiki">Joshua Darden</a>). In the standard sizes it looks fairly standard/normal but then you get to weights like Freight Micro, and Freight Display Italic where it takes on a display quality that I love and can’t wait to find the right moment to use.</p>
    <p></p><div class="imageWrap"><img src="/web/20080906163114im_/http://www.typophile.com/files/idlemode_logo_4632.gif"></div><br>
