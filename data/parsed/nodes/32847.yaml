    <p>Hi everybody, I'm posting my topic because I've never sold a font yet and I don't know anything about licences. I've found in my cupboard some old letraset press-type fonts. I've decided to digitalize the <a href="/wiki/Neil%20Bold" class="freelinking link-lost" rel="nofollow">Neil Bold</a> by scanning it for a school magazine that I'm creating now. Then I realize that a lot of people was looking for this font on the Internet and they asked me if I'll sell it. The problem is that it was already digitalized by OPTIFonts but they aren't selling it anymore. There is also a "based on" font which is Alejandro Paul’s Mobley Sans but generally it stray far from the look of Neil Bold. Now I'm wondering that if none is selling it and if I digitalized it from the original letraset, do I have the right to propose my font to a foundry ?</p>
    <p>Thanks in advance.</p>
