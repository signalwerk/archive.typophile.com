    html: <p>Back in 1978 I bought some Chartpak transfer lettering that was named Vector. The name of the magazine I was working on at the time. It seemed like the perfect set of letterforms for our logo. I found out  a few years later that Chartpak's Vector was VGC's Neil Bold. So as long as you don't use the trademarked name I can't see a problem as long as you don't mind being a derivative pirate.</p>
