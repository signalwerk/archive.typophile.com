      <p>To me the most interesting angle in this topic is the role of serifs in the relationships in multi-script systems. Let me give an example from my own experience. When making a text face with Latin and Armenian components, the Latin (Roman) can be upright and can possess the conventional serif scheme without problems*, but if one follows the (flawed) tradition of making the Armenian based very closely on the Latin one ends up with upright forms and... too many serifs! Because the Armenian "x-height" is choc full of vertical stems. One alternative is to give the Armenian a slanted semi-serif form; one reason this works well is Armenian needs Italics far less than Latin (since it has a floating emphasis mark that can be placed on any vowel). Now, if one makes the Armenian upright, semi-serifs cause the letteforms to appear slightly backslanted**. I have an article about all this entitled "Latinization: Prevention and Cure" in back issues of both Spatium and Hyphen - it might be useful to read it.</p>
      <p>* Not that there's no room for massive innovation in this area!</p>
      <p>** Although Bloemsma showed an interesting solution to this in his Avance.</p>
      <p>Here's one view of the type system in question:<br>
      <a href="http://themicrofoundry.com/ad/CR.pdf" title="http://themicrofoundry.com/ad/CR.pdf">http://themicrofoundry.com/ad/CR.pdf</a></p>
      <p>hhp</p>
