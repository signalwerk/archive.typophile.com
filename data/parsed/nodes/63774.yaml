      <p>I study graphic design at KASK (Koninklijke Academie voor Schone Kunsten / Royal Academy of Fine Arts) in Ghent, Belgium.</p>
      <p>This thesis is for my Master's program.<br>
      The main goal in this year is to create an artistical work. (I will create a typeface)<br>
      The secondary goal is to create a theoretical piece (my thesis). The thesis only has to be 10.000 words long.</p>
      <p>my supervisor for the artistical work is Danny Dobbelaere<br>
      my supervisor for the thesis is Stijn van Rossem<br>
      my extra (external) supervisor is Jo De Baerdemaeker. He's helping me design my typeface and I hope he will also help me a little with my thesis.</p>
