      <p>This sounds very interesting.</p>
      <p>You should also discuss and compare the notion of readability as it has changed over time, such as from print to screen. While serif designs are generally considered to be the most readable in print, when it comes to mobile devices, sans serif is generally better, perhaps due to the more uniform stem widths. In fact, some sans serif designs actually have small serif-like thingies at the terminals, or the stroke terminals are flared. The serifs and flares are actually detrimental when it comes to mobile device use.</p>
      <p>BTW, I cover CJK writing systems in <a class="freelinking external" href="http://oreilly.com/catalog/9780596514471/"><em>CJKV Information Processing</em>, Second Edition</a>, though I don't cover the topic of readability per se.</p>
      <p>Dr. Ken Lunde<br>
      Senior Computer Scientist, CJKV Type Development<br>
      Adobe Systems Incorporated<br>
      <a href="mailto:lunde@adobe.com">lunde@adobe.com</a></p>
