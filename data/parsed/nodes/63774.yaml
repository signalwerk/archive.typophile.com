    <p>Hey all,</p>
    <p>I'm doing my thesis on the role of the serif in Latin and non-Latin writing systems. </p>
    <p>I would like to start with the Latin writing system.<br>
    1. Origin of the Serif<br>
    2. Different shapes of Serifs<br>
    3. It's role in readability/legibility<br>
    4. It's role as a decorative element</p>
    <p>Then it was my plan to apply that scheme to other writing systems, such as Japanese, Chinese, Hebrew, Arabic, Devenagari, Cyrillic, Greek...(These are the possible candidates. I won't discuss them all. )</p>
    <p>I would work as following:<br>
    Is there a serif/equivalent to a serif?<br>
    Does it have a name? What's its origin?<br>
    Does it improve readability/legibility?<br>
    Or does it merely exist for esthetical reasons?</p>
    <p>I have some questions I would like to ask you:<br>
    1. Is this a good idea all together? Should I just stick with Latin?<br>
    2. Do you know any good books on any of these writing systems?</p>
