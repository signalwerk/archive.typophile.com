      <p>Thanks everyone for the help.</p>
      <p>@hartmannsgruber: I will certainly try to get a hold of Huda Smitshuijzen Abifares' book</p>
      <p>@Ken Lunde: I will discuss readability in relation to different types of media/circumstances. E.g.: Low resolution screens and highway signs demand a simpler letterform; a sans...</p>
      <p>@Hrant: thanks for the very interesting examples. I love the solution of a slightly slanted, semi-serif roman as a companion to the armenian font. Very nice to see the latin being moddeled after the Armenian, instead of the (usual) other way around.</p>
      <p>The role of serifs in relation to multi-script systems is indeed the interessanting angle. Unfortunatly I don't speak/read any language in a non-Latin script. So I won't be able to do extensive research and I will have to rely on other people since I can't tell wether a certain script has been latinized and if the result looks odd</p>
      <p>Thanks again<br>
      Wouter</p>
