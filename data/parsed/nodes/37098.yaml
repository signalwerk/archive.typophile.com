    html: |-
      <p>If this is the same typeface at the »first«(?) or original (?) version, I'd say it is a custom work done by Gabriel da Abreu from Swith Design (South Africa). See Jürgen Sieberts <a href="http://www.fontblog.de/files/wm_2010_logo.html" rel="nofollow">Fontblog-topic ”That‘s the WC Logo from 2010«</a> (sorry, germanspeakers only).<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/page0_blog_entry324_1_3530.jpg"></div><p></p>
      <p>BTW, I think Neuland is an excellent suggestion for a substitute, as always. The Neuland-typeface-concept is also known as Nueland or Phosphor and maybe more I don't know of.</p>
    html_clean: |-
