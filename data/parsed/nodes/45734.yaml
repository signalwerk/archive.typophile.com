    <p>Hi all,</p>
    <p>I've recently started working with MM technology in FL and there's a particular problem I'm running into which I haven't been able to solve, so I thought let's see if anyone here can help me with this.</p>
    <p>In the attached picture you see a lowercase g with another master behind it.<br>
    Notice that a few points of the master in the background are being cast into space.<br>
    I have compared pointstructures, starting points, contour direction and the glyphs seem to be identical.</p>
    <p>Any thoughts on this?</p>
    <p>Best,<br>
    Artur</p>
