      <p><em>It is not safe to correct path direction and remove overlaps automatically..</em></p>
      <p>No, it isn't. But if you do one manually, then you can safely do the other automatically. I personally prefer to do direction manually and remove overlaps automatically (since removing overlaps by hand is tricky, and maintaining direction is not).</p>
      <p>Apparently the AFDKO does both, and correctly. I don't see how this can work always: I assume that it uses heuristics, and mostly guesses right. I'd be curious as to what that heuristic is, if it isn't an Adobe trade secret.</p>
