      <p>Artur,</p>
      <p>I see by your example, that your g is made up of three separate pieces. May I suggest that you try to interpolate as many characters as possible as whole glyphs, and not rely on this piece-together approach. </p>
      <p>With your current approach once you have all your instances generated, you are still going to have a lot of "remove overlap" work to do. Wouldn't you agree that touching up two g glyphs is more efficient that touching up 6, 8 or 12?</p>
      <p>And I agree that Tim's RMX tools are terrific!</p>
      <p>JamesM</p>
