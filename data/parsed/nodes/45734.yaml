      <p>Ah, I see. I hadn't thought of that possibility to build an MM font. Just out of curiosity: does the g also get messed up if you use Mask to Master instead of Assign Master? I always use the former method but it's not much different, actually.</p>
      <p>If it's only a very small number of glyphs that gets messed up then you could fix that quite quickly by putting the bold master into the mask of the MM font (using Assign Mask) and then manually shift the nodes of the bold master back where they belong. Should only take a minute.</p>
