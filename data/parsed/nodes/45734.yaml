      <p>One thing that bugs me is that FLS has a problem with removing overlaps in some cases like an 'A': FLS seems to expect that in this case, both the 'arrow' and the 'dash' outlines follow the same direction -- but FLS's own function for setting outline directions to 'PS' turns one counter-clockwise, the other clockwise. Then removing overlaps fails. It is not safe to correct path direction and remove overlaps automatically. In so far I never trusted the last-minute removal of overlaps, but envy everyone who does it successfully.<br>
      (I really don't want to care for outline directions manually ...)</p>
      <p>Karsten</p>
