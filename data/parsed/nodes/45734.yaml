    html: |-
      <p>There are definitely cases when keeping a glyph as separate parts has advantages when using multiple masters. A good example is a Q in which the tail crosses the bowl at an angle. When you go from the lightest to the boldest weight, you want the intersection of the tail and the bowl to follow the curve of the bowl. If you remove overlaps before interpolating, the intersection will follow a straight line between the two extremes, rather than the curve of the bowl:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/QvsQ_6394.jpg"></div><p></p>
      <p>The Q on the left was interpolated from separate parts; the Q on the right was interpolated from a continuous outline. Note the distortion in the area where the tail intersects the bowl.</p>
      <p>In fact, anytime there is a change of angle or rotation between the extremes, you're going to have interpolation problems. There isn't always an adequate solution, but in some cases, having separate parts helps.</p>
