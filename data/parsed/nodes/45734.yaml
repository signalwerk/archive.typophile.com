      <p>Cool, that last suggestion worked actually! Well, I didn't maunually shift nodes, but I copied the contours of g from the source font and pasted them into the mask layer of the bold master in the MM font, then I used the Mask to Master command.</p>
      <p>So what I understand from this is that it is better to first assign a source font as a mask to an MM font, and then use the Mask to Master command.</p>
      <p>And all this only to use your wonderful RMX tools Tim! ;)</p>
