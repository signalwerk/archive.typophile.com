      <p><em>While I don’t normally ascribe national feelings to typefaces, I *do* think this one has a definite French feel to it.</em></p>
      <p>Why do you think that is?</p>
      <p>I was going to say that it vaguely reminds me of letterforms in art nouveau, which I associate with France. Originally I thought it was the roundness, together with greater weight on the top of the glyph, but I think there's more to it than that.</p>
      <p>Nice.</p>
      <p>But maybe you were thinking something totally different when you said it has a "French feel."</p>
