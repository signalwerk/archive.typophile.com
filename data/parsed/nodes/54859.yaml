    <p>Hi there!<br>
    My name is Laure Afchain, I'm currently studying in the Type]Media master in the Hague.<br>
    I just wanted to share with you some good news from a french type design project I was involved in:</p>
    <p>Since the beginning of 2009, the city of Toulouse, in France, has a brand new typeface, named Garonne. Toulouse is actually the first french city to get its own exclusive typeface. Garonne is a type system which contains four fonts: a regular and its italic for the running text, an ultra-bold, and a condensed version dedicated to display. It will be soon used by the municipality on its logo, publications, posters, invitations, newspapers.</p>
    <p>We've been designing it during my fourth and fifth year in the visual communication department of the Fine Arts School in Toulouse. To be more precise, it has been designed by <a href="http://www.pampatype.com" rel="nofollow">Alejandro Lo Celso</a>, <a href="http://www.francoischastanet.fr" rel="nofollow">François Chastanet</a>, Géraud Soulhiol and <a href="http://www.lo-circonflexe.fr" rel="nofollow">me</a></p>
    <p>Hope it will have a nice "avenir" :)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Garonnes_3810.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/GaronneCharSet_5000.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/GaronneA_6285.jpg"></div><p></p>
