    html: |-
      <p>Congrats for this beautiful project!<br>
      Just to be a bit more precise, Toulouse is not the first French city to get a custom design. Franck Jalleau did a type family for the city of Brive-la-Gaillarde back in 2002.</p>
      <p><a href="http://www.typographe.com/article/565/IN-Brive" title="http://www.typographe.com/article/565/IN-Brive">http://www.typographe.com/article/565/IN-Brive</a></p>
      <p>Now that this truly great part of work is done, what really counts is how the typeface will be used by the mayor's offices. And this has obviously been a big issue for Brive. I have documents coming from them that still burn my eyes.</p>
      <p>By the way, I'm always curious as to which extend a typeface design can claim itself being "collaborative". Could you tell a bit more about the design process?</p>
