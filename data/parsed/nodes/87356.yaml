      <p>{Pre-empting a possible destructive deletion.}</p>
      <blockquote><blockquote><p>But now let's say that Baskerville's EULA has a clause in it that says absolutely no modification of any type is allowed (is this really enforceable by law though? I mean really) then you can't do it, or at least you are not supposed to do it. What can they do to you anyway though? I'll bet you couldn't really be sued, right?</p></blockquote>
      <p>You could always draw it from scratch to harmonize with the existing design.</p>
      <p>And don't be so sure legal action cannot be successfully taken against infringers of EULAs.
      </p></blockquote>
      <p>{End of pre-emption.}</p>
      <p>James, what kind of people would waste time stalking Ryan on the off chance they can catch him red-handed violating their no-mod clause, and then drag him to court? To me all that stuff (and maybe your post too?) is just scare tactics. And fear actually doesn't do well in the long term, and doesn't do well on Typophile from what I've seen. BTW, Hoefler and Licko were two font designers who used to be very gung-ho about suing people, but they ended up giving up. Bruisable egos do not make for good business.</p>
      <p>Ryan, you've actually nicely alluded to an interesting paradox: modifying a font is (usually) illegal, but making your own copy of a font design is not! At least not in the US. The thing is, do you think a font house would rather sell a font to somebody who will modify it, or not only not sell the font but have a no-strings-attached (and probably free) clone of it floating around!  :-/</p>
      <p>To me it's all about treating people with reasonableness, and taking personal responsibility, instead of using lawyers to manipulate people's emotions or riding rough-shod over people's <em>reasonable</em> expectations.</p>
      <p>BTW, even though I personally do not respect no-mod clauses, I don't take on commissions that involve violating that clause, and this is because: I don't feel like I can guarantee my own "no leaks" clause; and the client could one day decide to incriminate me. However I do try to encourage others to not fall for scare tactics, and any fonts I license myself I feel free to modify as it suits me (while making sure my files are secure). A sort-of-related example: when making Trajic notRoman* I took the liberty of directly using Adobe Trajan's outlines, but to every one of the dozens of people who over the years contacted me to purchase it, I said No.</p>
      <p>* <a href="http://themicrofoundry.com/ss_trajic.html" title="http://themicrofoundry.com/ss_trajic.html">http://themicrofoundry.com/ss_trajic.html</a></p>
      <p>&gt; Worst case scenario they say no.</p>
      <p>Best case scenario: tell them you refuse to buy their fonts because of the no-mod clause, and even though you know it's just a scare tactic. Communicate clearly that you are not consumerist livestock.</p>
      <p>hhp</p>
