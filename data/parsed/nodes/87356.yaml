  votes: null
  html: |-
    <p>I see a lot of font foundries offering custom font solutions to clients where they say that they would take an existing retail font (many protected by an End User License Agreement that clearly states that altering and selling the font is not allowed) and alter it slightly and sell it to the client.</p>
    <p>Is this really legal?</p>
  html_clean: |-
