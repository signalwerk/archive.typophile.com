      <p>I've yet to encounter a no-modification clause that wasn't negotiable. Sometimes the original designers want to make the modifications personally, sometimes they want to charge a supplemental fee for this additional permission, sometimes they just give permission. I've never encountered a designer who simply said 'No' when asked about modifications.</p>
      <p>I don't see anything unreasonable about a clause that obliges people to contact the original designer if they want to have a modified version of a font, and it is indeed about lack of respect for the original designer if one just goes ahead without permission.</p>
