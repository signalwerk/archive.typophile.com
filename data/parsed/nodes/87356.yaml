    html: <p>For fonts whose EULAs allow modifications by someone other than the original foundry, the font is not resold back to the original purchaser.  The person who did the modification work is simply paid for his/her services.  This is not a product sale.  If you buy a Ford truck and later bring it to a custom shop to add a trailer hitch, the custom shop does not resell your truck, they just charge you for the services rendered.</p>
