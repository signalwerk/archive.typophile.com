    html: <p>Modifying and (retail) "reselling" is prohobited by just about any EULA out there, even for most free fonts. Some EULA's allow modifications for personal use, and some EULA's allow third-parties to make modifications for the client. Some again require you to contact the reseller/foundry to ask before you hire a third-party.</p>
