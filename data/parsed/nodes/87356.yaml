      <p>Hrant: ‘<em>To me it's all about treating people with reasonableness, and taking personal responsibility, instead of using lawyers to manipulate people's emotions or riding rough-shod over people's reasonable expectations.</em>’</p>
      <p>To me it is all about respecting the EULA’s that go with fonts. It does not matter whether the end user (or you) consider certain limitations reasonable or not. If one does not agree with the EULA, one should not purchase the font in question and buy one which comes with a more suitable license from another foundry. </p>
      <p>People in the font business should by deﬁnition <strong>completely</strong> respect the conditions deﬁned by the rightful owner(s) of font data and design, <em>even</em> if the latter part is not protected by law in certain countries. </p>
      <p>This forum is public and in my opinion one really has to think twice before stating that to a certain extent and under certain conditions end users or third parties are basically allowed to infringe EULA’s.</p>
      <p>FEB</p>
