      <p>Is this what you mean?</p>
      <p>But now let's say that Baskerville's EULA has a clause in it that says absolutely no modification of any type is allowed (is this really enforceable by law though? I mean really) then you can't do it, or at least you are not supposed to do it. What can they do to you anyway though? I'll bet you couldn't really be sued, right?</p>
