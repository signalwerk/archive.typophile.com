    html: <p>1. I was confused at first, I thought you removed my question as I couldn't find it anymore. Luckily I started going through the list before flaming away. <br> <br>2. well, we kinda met years ago, at the A-Type1 conference in Antwerp (93? 94?). I pretty much spent the whole weekend in the Typelab there. Mario Beernaert (remember TV27) got me there, with a couple of other students. I don't think I really spoke to you back then, apart from maybe asking the odd Fontographer question or some printer problem. ;-) <br>As a customer of FS Belgium and reader of various FS publications, I obviously recognised your name when I saw it here. <br> <br>voila. da's ook weer opgelost dan...  <br> <br></p>
