      <p>It does make sense that a dark font with a large x-height is ideal for smaller text - as long as it's loose enough. But if you have to track it looser to work, the font needs to be fixed (because "boundary conditions", like the right side of the "r" will go wrong).</p>
      <p>hhp</p>
