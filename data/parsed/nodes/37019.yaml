    html: <p>Frutiger would work well with so many typefaces. Tell us more about the client and their audience to help us narrow it down.</p>
    html_clean: <p>Frutiger would work well with so many typefaces. Tell us more about the client and their audience to help us narrow it down.</p>
  - id: 226402
