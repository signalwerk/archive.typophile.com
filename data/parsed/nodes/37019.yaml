    date: 2007-09-11T18:17:00
    date_raw: 11.Sep.2007 6.17pm
    votes: null
    html: <p>I’m not a designer or anything, and I’m the one writing the proposal.  I do web development work, some corporate, and some non-profit, and I’m looking for something that looks clean and modern, but not distracting.  This proposal, in particular, is for a web 2.0-ish application for a professional organization.  The proposal probably won’t be read by more than three or four people (a mix of technical staff and non-technical stakeholders - lawyers, mostly), but I’d like to make a good impression.</p>
