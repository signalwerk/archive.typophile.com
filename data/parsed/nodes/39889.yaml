    <p>Hello I'm looking for a little help...</p>
    <p>I'm designing a flyer for an art exhibition called Sideshow. The main type will be set with JFRingmaster and the flyer will resemble an old circus poster, with portraits of the four artists. I'm really keen to find some graphics or a font with oval ornament frames for the portraits (they're all dressed up too), but I'm having trouble doing so. Can anyone help me?</p>
    <p>Thanks from Louise</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sideshow_6054.gif"></div><p></p>
