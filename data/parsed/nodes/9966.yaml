      <p>Gerry: "Greek miniscules have some forms partially in common with Latin, but the Greek letters retain a much more calligraphic form."</p>
      <p>Nick: "The idea that the Greek alphabet is inherently more calligraphic than the Latin is absurd."</p>
      <p>I certainly agree with Gerry's statement. I suppose with Nick's comment, one can debate whether that difference is "inherent" or simply "commonly implemented."</p>
      <p>In the absence of something else unusual going on in the typeface design, I tend to think of the degree to which a Greek lowercase is calligraphic as being more-or-less the opposite of how Latinized it is, with the two being on a continuum.</p>
      <p>Cheers,</p>
      <p>T</p>
