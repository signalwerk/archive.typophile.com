      <p>I would recommend you keep it simple and avoid polytonic, which is a huge amount of work to get right.<br>
      I don't believe there is much of a market for polytonic fonts, and what there is has been well catered to by bundled fonts from Apple, Adobe, and Microsoft.</p>
      <p>The idea that the Greek alphabet is inherently more calligraphic than the Latin is absurd.<br>
      Nonetheless, it is a myth with some traction. For instance, there does seem to be a trend away from the traditional symmetrical lower case sans serif nu, towards the adoption of an asymmetric shape.</p>
