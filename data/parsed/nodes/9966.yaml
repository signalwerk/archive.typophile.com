      <p>Personally, I think the problem comes when you are "aiming" at any historic solution. Past solutions certainly influence all of us in all scripts but if we just work at solving the needs of the typeface we are working on, the needed amount of influences will come through. We don't use or even see calligraphy or even handwriting much anymore in our normal lives. We also are not constrained by the production process of hot metal type. We are in a different place with different tools. The new tools may speak differently and both cause new problems and give new opportunities for solutions to old problems.</p>
      <p> ChrisL</p>
