      <p>On thinking about this some more and talking it over with Gerry, I would like to refine my earlier comments: the Greek lowercase in a "good" typeface is more calligraphic than the Latin lowercase, by "some amount." There might be a range or reasonable amounts, and the ideal degree of additional chirography might vary from one typeface to another.</p>
      <p>(In my own Hypatia Sans, the typeface is somewhat mannered and moderately geometric. The Greek is noticeably more calligraphic than the Latin, as it "should" be, but still not very calligraphic on any absolute scale. But that's okay.)</p>
      <p>T</p>
