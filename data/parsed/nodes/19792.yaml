      <p>The main title is set in some predigital version of <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=LP.9493.0.0&amp;attributes.sampleSize=48&amp;sampleText=NOSFERATU&amp;sampleSize=48">Koch’s sans</a>. The more recent <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;startrow=1&amp;records=20&amp;currpage=1&amp;totalrecords=12&amp;searchby=&amp;searchID=&amp;searchletter=&amp;searchstr=kabel&amp;font_categories_checkbox=font_name_search&amp;fontRendererText=NOSFERATU">Kabels</a> from Linotype and ITC are similar, but more regularized, lacking idiosyncrasies like the “upside-down” cap S.</p>
      <p>Credits could be in any predigital Futura or Futura copy such as <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;startrow=1&amp;records=20&amp;currpage=1&amp;totalrecords=6&amp;searchby=&amp;searchID=&amp;searchletter=&amp;searchstr=twentieth&amp;font_categories_checkbox=font_name_search&amp;fontRendererText=HENRIK+GALEEN">Twentieth Century</a>. Lanston’s <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startrow=1&amp;records=&amp;currpage=1&amp;totalrecords=2&amp;displayfontid=G.10964.0.0&amp;fontRendererText=Art+Direction+ALBIN">No. 206</a> version is the closest match I find. <a href="http://www.p22.com/lanston/products/twentiethcen.html">Here</a> is the most recent digitization of this version by the folks at P22, but it is missing the italics.</p>
    html_clean: |-
