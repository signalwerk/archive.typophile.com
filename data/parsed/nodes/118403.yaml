    date: 2014-08-07T17:12:00
    date_raw: 7 Aug 2014 — 5:12pm
    votes: null
    html: |-
      <p>Type 1 fonts can only have so many encoded glyphs, and to have rcaron in a Type 1 font would require an unusual encoding. That character is not in WinANSI (codepage 1252) or Adobe Standard Encoding. It is however in Windows 1250 (Central European). You may need to be sure you set that encoding before generating the font, see if that helps?</p>
      <p>It is also possible that there is some sort of Windows or app-specific bug in this regard, related to assumptions about encoding.  :(</p>
      <p>Note that Type 1 fonts will not even show up in modern DirectWrite apps, so it's kind of a dead end these days. I wouldn't build a new font in Type 1 unless it was required by a customer for some odd reason.</p>
