    <p>I have set kerning in my win type 1 font, and, wanted to use it in MS word. Weird is, kerning works just in some cases - just on basic characters. The problem is only in office - in all other programs like illustrator / indesign not. </p>
    <p>- screenshot - left - illustrator, right MS word 2007 (problem at "ře" vs "re" )</p>
    <p>Tryed<br>
    - turn kerning in word on/off,<br>
    - play with settings at fontlab options in kerning,<br>
    - made openType feature "kerning" with kerning asist.<br>
    nothing worked. seems like word ignoring all national characters kerning.. </p>
    <p>Anyone can help me?</p>
