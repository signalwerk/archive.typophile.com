    html: |-
      <p>Type 1 fonts have no kerning classes, so you probably should expand the class kerning before generating the fonts (Tools → Kerning Assistance → Expand).</p>
      <p>By the way, I didn’t know that Type 1 fonts were still supported by Word ;)</p>
