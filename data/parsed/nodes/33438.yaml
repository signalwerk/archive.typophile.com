    <p>I'm looking for the typeface used for the title "Worlds Beyond."</p>
    <p>I just know this is gonna be so easy that I'll feel stupid, but I cannot for the life of me remember this typeface. It's possible this is a hand-lettered version, because I seem to remember it being just a touch wider, but it's definitely based on an existing face.</p>
