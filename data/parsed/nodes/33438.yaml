      <p>I just looked Lydian up in McGrew's book of 'American Metal Typefaces' and there was a condensed version, created in 1946 by Chappell, but not marketed until 1949. However, it doesn't match the sample very well. There were other similar metal types, like Valiant (Monotype 1940), Czarin (Baltimore Type 1948) and Samson (Ludlow 1940) which were similar pen lettering designs, but not as close as Lydian to the posted sample. There is also mention of a typeface by Koch called 'Offenbach' from 1935, as being the model for Czarin (which is actually very similar to Lydian).</p>
      <p>Probably too much information, but I'm hard to stop once I get rolling ;^)</p>
      <p> - Mike Yanega</p>
