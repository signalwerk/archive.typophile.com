    html: |-
      <p>Interesting, however these are Not Typefaces but interactive typographic algorithms.</p>
      <p>Smart fonts can indeed respond to text, but primarily as letter form content, not lexical meaning.</p>
      <p>Typography that responds to the reader is another matter.</p>
      <p>Some type designers have used OpenType substitution code to implement such effects, most notably Amy Papaelias: <a href="http://www.typetalkfonts.com/typetalk_demo.html">http://www.typetalkfonts.com/typetalk_demo.html</a></p>
      <p>Just and Erik described <em>Twin</em> in 2002:<br>
      “Twin is not really a typeface, but more an application that runs on the web.”<br><a href="http://letterror.com/portfolio/twin/index.html">http://letterror.com/portfolio/twin/index.html</a></p>
