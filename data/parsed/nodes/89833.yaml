  html: |-
    <p>Greetings all!</p>
    <p>I'm wondering if anyone can point me in the direction of some good Chinese fonts. We have the usual suspects that travel with MS Word and/or Windows (PMingLiU for instance) but there is at least one character (Unicode 20B1D) that isn't in that font.</p>
    <p>The book is a compilation of authors/editors and they've used no less that 20 different fonts for all the text, Chinese and otherwise. I'm hoping to find something that will have all the characters we need but not look like the Heiti fonts that come with the Mac, which is just plain homely.</p>
    <p>Thanks for any help you can offer!</p>
    <p>Ken</p>
