    <p>Hello to all.</p>
    <p>I’m looking for a free font to use in a portfolio pdf for screen display. It will be set in aprox. 9pt size over a 595x595 px page. And I want it to be readable without having to zoom in on text.<br>
    Does anyone have any suggestions? I’m trying to avoid using system fonts like verdana or Tahoma, a pixel font could also work, it just have to be free and well suited to display on screen. It doesn’t need to perform well in running text, as I’ll only use a couple of lines with maybe 5/6 words each.</p>
    <p>Any suggestions will be greatly appreciated.</p>
    <p>Thanks in Advance</p>
