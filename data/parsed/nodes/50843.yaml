      <p>When pdfs open they rarely open at 100%. </p>
      <p>It’s one of the pitfalls pdfs. </p>
      <p>Keep this in mind if you choose a pixel font as they look terrible when not displayed at 100% (or 200%,300%...).</p>
      <p>If you do choose a pixel font (which I suggest you don’t) FFF have some good cheap ones here: <a href="http://www.fontsforflash.com/" title="http://www.fontsforflash.com/">http://www.fontsforflash.com/</a></p>
