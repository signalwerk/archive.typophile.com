comments:
  - id: 67153
    user: 653
    date: 2002-02-07T16:50:00
    date_raw: 7 Feb 2002 — 4:50pm
    votes: null
    html: <p> Thanks for that feedback Jonathan. I have a pretty unconventional understanding of typography and I'm not totally clear on "Wild Style". the only Wild Style i'm familiar with is the 80's movie about hiphop/graffiti, and a graffiti style where the letters are almost unreadable with complex "ligatures" but I have a feeling you're talking about something else, right? </p>
  - id: 67154
    user: 1014
    date: 2002-02-09T00:24:00
    date_raw: 9 Feb 2002 — 12:24am
    votes: null
    html: <p> Phil - Boozefighter is a piece of work. To paraphrase Joe, Weee, it's Buffy the Cowgirl. It says woodtype to me, but it is certainly not something I've seen before. So that's a good thing. <br> <br>The few things I would examine... <br> <br>The Z and the T have razorsharp terminals. Perhaps they should be neutered more, like the J. <br> <br>The middle stem on the 5 might do better firm than droopy. <br> <br>The lower half of the 7 calls for something else than the curve it is given. <br> <br>The foot of the Y should extend across, as JH mentioned. <br> <br>Maybe the M, N and W could stand a width change, giving them another stem widthwise. <br> <br>The stem crossing on the X needs a wee bit of work. <br> <br>Overall, the craft is sound on this one. Nice debut! Looking forward to more. <br> <br>bj </p>
  - id: 67155
    user: 863
    date: 2002-02-11T10:50:00
    date_raw: 11 Feb 2002 — 10:50am
    votes: null
    html: '<p>Has anyone had a go at doing a graffiti font? Im an ex writer whos tried and failed many times at producing a graffiti style font. Script fonts arent really my thing and I dont seem to be able to formalise the strokes enough to produce a workable typeface. Heres my latest sketches for your comments: <br> <br><a href="http://www.selfbuildtype.com/metro.gif" target="_top">http://www.selfbuildtype.com/metro.gif</a> <br> <br>Im by no means happy with this : )</p>'
