    user: 804
    date: 2002-02-11T11:37:00
    date_raw: 11 Feb 2002 — 11:37am
    votes: null
    html: <p> Craig,I actually like the Metro type you started. There is obviously a lot of repetative elements which makes it look computer generated, so I would suggest a lot of tweaks to each letter to give it a handmade feel, but in all it has some direction I like. </p>
