    html: <p> Craig! keep up on the graffiti Fonts, some of the one mentioned aren't really graffiti like you would experience <br>today. i us to write when i was a kid, but have never tried to make or design a graffiti fon, and i think you have <br>it cornered both with "Metro and Alpha"! if ya need any help let me know. the best way if your having problems would to be draw then out, scan them and trace them in Illustrator. then copy and paste into the font <br>program your using. but KEEP IT UP! we need real graffiti fonts from real graffiti artists. <br> <br>Phil, i like! keep it up also. nice to see fonts that aren't the norm. hope to see more soon! </p>
  - id: 67164
    user: 863
    date: 2002-02-12T17:11:00
    date_raw: 12 Feb 2002 — 5:11pm
    votes: null
    html: '<p>I thought id post a few more sketches: <br> <br><a href="http://www.selfbuildtype.com/gallery/throw.gif" target="_top">http://www.selfbuildtype.com/gallery/throw.gif</a> <br><a href="http://www.selfbuildtype.com/gallery/tag.gif" target="_top">http://www.selfbuildtype.com/gallery/tag.gif</a> <br> <br>The tag style font is the one I want to crack. The visual for this is done in fireworks even though it looks like marker. Each character is a symbol making tweaking characters in context a lot easier. The plan is to create the basic letterforms and add additional swashes that can bolted on. Ill keep working at it!</p>'
