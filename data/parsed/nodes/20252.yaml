      <p>&gt; Its a chirographic trait.</p>
      <p>It's an artefact of chirography, but it could be many other things too,<br>
      and you don't need to be thinking chirographically in implementing it.<br>
      The same with many other things, like stroke contrast. Legato has it, but<br>
      certainly not because Evert was a fan of chirography - quite the opposite.</p>
      <p>hhp</p>
