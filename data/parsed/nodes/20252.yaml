      <p>From the 16th Century through till the end of World War Two, the German blackletter was Germany's national typeface. In the original creation of blackletter, the letter forms were a romantic symbolism of light over darkness; the heavenly and eternal presence.</p>
      <p>&gt;Is it possible to restore the symbolic value of the blackletter?</p>
    html_clean: |-
      <p>From the 16th Century through till the end of World War Two, the German blackletter was Germany's national typeface. In the original creation of blackletter, the letter forms were a romantic symbolism of light over darkness; the heavenly and eternal presence.</p>
