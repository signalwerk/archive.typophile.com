      <p>&gt;<em>Is this going to be a full thesis or a dissertation supported by a body of work?</em><br>
      It's my fourth/final year. An honours year where we I think do a kind of visual thesis you could say. We do not have to write a big final essay. Though some other departments like Industrial do have to. We started research second half of last year. Have written essays etc. Now up to the stage where we start designing through the question we have formed from all our research. End of year we have an exhibition. I didn't know anything of this topic when coming into it. Yes, with our projects, they say, they end up being big topics with much more potential to go further. Therefore, I have considered a further year of study will be very beneficial. I still greatly value your imput, thanks.</p>
      <p>What initially captured me was that the political powers of WW2 enforced blackletter and then banned it from all printed ephemera (and this was only a typeface, but this helped show some of the extremity of the time). I have been passionate about blackletter through this background.</p>
      <p>&gt;<em>Bit of Ignorance</em><br>
      I'm glad you described to me a bit of what the German streets of blackletter look like. And some other countries.</p>
      <p>&gt;<em>The Interviewee</em><br>
      He is from Bremen, if that is anything of interest.</p>
