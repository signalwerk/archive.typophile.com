      <p>hrant: </p>
      <p>Of course I was only talking about those "schaftstiefelgrotesk"ones!<br>
      I love blackletter fonts and what the Nazis did to them was sort of a violation. Never to forget that they also shamefully used the good old ones. Unfortunately present day Neonazis have no idea which fonts where used in Nazi times, so that you can see Old Schwabacher on those fascist's shirts, which makes the image of the blackletter even worse.</p>
      <p>Yaronimus: </p>
      <p>There are a lot of good and readable Blackletter, it's just they are not/ or not properly digitized yet. Take for example Unger Fraktur, a very light and gentle font.<br>
      Also I think it's a matter of custom to read those fonts.<br>
      And to forget about some letters like the long-s (I know some of you might want to kill me for this, but the long-s is to forgotten to be reintroduced) or to sligthly adjust some of the Letters that are problematic like the small k, z or the x.</p>
      <p>For a great selection of Styles you may want to see a recently released book (sorry only in German, but there's not too much text to read) named "Fraktur mon amour" editor is Verlag Hermann Schmidt.<br>
      It comes also with a cd with some free fonts.<br>
      Sadly the free ones are of the worst quality I ever saw. But at least it's free and there are some pretty rare ones on it.</p>
