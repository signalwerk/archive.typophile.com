      <p>First of all...thanks everyone for the many replies!! I have had a good look around on the Typophile site and it is good to have that pool of information when it's not necessarily out in books everywhere.</p>
      <p><em>Blackletter:Type and National Identity and Paul Renner's book</em> have been a great kick start for my research. They are full of good information. I have briefly compared Futura and Fraktur/blackletter/ww2 in an essay. However, as the tutor pointed out, I need to consider that these are on completely opposite poles. Futura was the extreme of modernism and fraktur at the other end.</p>
      <p><em>Validating</em><br>
      That is a good quesiton. My tutor actually asked me that the other day. Initially I am thinking that I want to bring a positive aspect to blackletter and something fresh compared to what it has taken on leading up to it's demise.<br>
      Perhaps it is more modernity that I'm wanting to inject(contemporary not historically). I realise this has been talked on typophile already.</p>
      <p>The idea of a readable blackletter applicable for text use today sounds affable.</p>
      <p><em>Most young Germans do not care</em><br>
      Yes, I do not know many Germans myself. Are any of you German? I spoke to a German student who is just in New Zealand for a short time. Here are his comments:</p>
      <p>blackletter in Germany is<br>
      - very rarely seen, however...<br>
      - it is used in some modern type books<br>
      - playing with just the one single letterform<br>
      - they use the knowledge that it is old type to play around with it and use it as something completely different to the modern<br>
      - I think it is cool to bring it back to play around with but not as whole text (he must be one of the few who like??)<br>
      - they always use the very traditional, never WW2 blackletter</p>
      <p>So it appears from above it is more of a left field art in Germany??</p>
      <p>Validity is really what I need to crack down on.</p>
