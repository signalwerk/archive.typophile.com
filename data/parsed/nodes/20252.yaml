      <p>Yes, Thomas, but the problem with the use of blackletter is that it exclusively limited to historic, display applications. Like the town museum in Wiesbaden's suburb, Mainz-Kastel… Its sign (Heimatmuseum) is set in Fette Fraktur. Naturally withOUT the long-s ;-0</p>
      <p>All of the modern street signs in Mainz's historic district are set in a Textura. And of course one sees blackletter all over old buildings. And on beer and wine labels. But these things are all old, and don't speak very well to younger generations.</p>
      <p>I do like how younger designers play with blackletter on posters and flyers. Yet I get a feeling that a lot of this is just because that sort of thing is done so much (more) in other countries.</p>
      <p>Of course lots of young German designers are interested in blackletters. But compared with younger designers in other countries, the proportion is smaller. Blackletter was all over 1990s graphic design in Florida. And London has more blackletter throughout the city (both old and new) than anywhere in Germany (although there it is textura/old-english instead of fraktur).</p>
      <p>Even Mexico, as is discussed elsewhere here, has more blackletter integration in the daily visual culture than Germany in 2006.</p>
      <p>If I were to oversimply, I would say that Germany's visual culture, typographically speaking, is all about sans serif typefaces (AG, Helvetica, Univers, Frutiger, DIN, DIN again, DIN again and again, Meta, etc.).</p>
