    html: |-
      <p>I think there's movement towards acceptance of blackletter again, even if it occurs through its resemblance to fraktur faces. If you've been following so-called 'urban' graphic and fashion design in the US and UK during the last year, it's en vogue to use intricate graphic silhouettes, often coupled with display type in fraktur and copy in a clean sans face. The visual cues between the illustrations and the type are frequently the angled 'cuts' and the high contrast you speak of. </p>
      <p>Of course, the prevalent style is closer to that you identified as contemporary to WW1, but the groundwork is being laid.</p>
    html_clean: |-
