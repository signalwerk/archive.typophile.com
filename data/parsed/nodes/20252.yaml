    <p>Hey Everyone,</p>
    <p>I'm not sure how active this forum is? As a New Zealander I am currently doing major project, here is my central question:</p>
    <p>The black-letter Fraktur was Germany’s national choice of typeface style, however because it was terminated almost indefinitely by Hitler in WW2 I propose this question: can validity be restored to the typeface style, fraktur, which was defaced and became an index of inhumanity?</p>
    <p>How does everyone see the reputation of blackletter today?<br>
    - negative/positive etc</p>
    <p>What i'm really wondering is how can i start restoring validity? How can i design a typeface that is sensitive and honouring its history? One that moves people because of the context it is placed in. My original interest in blackletter was a link through from my empathy to the victims of WW2. Is their a way i can get that kind of empathy into the blackletter? Lots of questions - do i really want to get that empathy coming through (i.e.bringing back the past), like a memorial???</p>
