      <p>I think the division of blackletter typefaces in "WW I" and "WW II" style is not appropriate as well. It was already pointed out that blackletter typefaces have a much longer history. Also, different fraktur/blackletter faces were used during the NS regime, not only Tannenberg and its fellow 'Schaftstiefelgrotesk's.<br>
      These are to a certain degree (and under ideologically alarming conditions) also trying to modernise blackletter.<br>
      Political/ideological afflixion of typefaces is always a matter of context and of usage and reception in a certain (collective) disposition of perception.</p>
