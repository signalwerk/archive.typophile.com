      <p>&gt;poms</p>
      <p>That is a very interesting and unique modernised blackletter.<br>
      Definitely here it has been used as a display font, but I can't tell if it has been used for the text titles?<br>
      They are kind of awkward shapes yet they still seem to work well together, perhaps because I'm not used to seeing this kind of display font.<br>
      The numbers I like the best. Their rounded edges remind me alot of the bauhaus below.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/bauhaus_3480.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Brussel_02_5138.jpg"></div><p></p>
      <p>The designer has taken the broken and angled characteristics of blackletter and made a feature out of them in this typeface. I really like the idea of doing it that way, makes it a bit simpler anyway. I wonder what inspired them?</p>
      <p>Placing the blackletter with the pink (contemporary use of colour) also makes it more modern and friendly.</p>
      <p>They are still quite quirky letterforms however, and perhaps that's something of blackletter that will always be seen when made today? Maybe?</p>
