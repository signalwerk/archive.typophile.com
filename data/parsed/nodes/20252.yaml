      <p>Blackletter of course has such a rich and varied history that the whole 1933–1941 period is just a blip in its continuum. But most young Germans do not care. They seem to dislike blackletter, mostly because they want to distance themselves from the past, espcially the Nazi past. (Blackletter's hey-day, say 1450–1800, is not a period that modern Germans can associate with either. Almost nothing in their daily lives has anything to do with it. Blackletter was also highly tied up with Religion, especially the Protestant Reformation. As most young Germans are not religious, this is just one more strike against blackletter).</p>
      <p>Fortunately, the world is much bigger! Even if the Germans never use blackletter again,* there are still plenty of other people left to like it.</p>
      <p>I think that the reason that Blackletter isn't seen so often anymore is because almost none of the blackletter fonts available for computer users today are optimized for smaller text sizes. Note that Underware's Fakir is a new, and brilliant, exception.</p>
      <p>* Even this will never happen. Museums, beer labels, and heavy metal bands will always be with us ;-)</p>
