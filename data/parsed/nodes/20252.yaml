      <p>I think blackletter is much more than a Nazi letterform. Of course its Nazi connotations are strong, but that is just a tiny bit of its history. Blackletter existed many centuries before Hitler and hopefully will survive many more after him.</p>
      <p>Hanna, I would suggest you to look into the letterform itself. Check out the shapes, ornaments and strokes in the letterform. I believe there is where you could find the contemporary validation you are looking for.<br>
      Blackletter has a delicate, precise anatomy. Is a very crafty and passionate letterform. Is a whole parallel universe to roman type!</p>
      <p>I suggest you to check out: Albrecht Durer’s: Of the just shaping of letters.</p>
