      <p>Hrant:<br>
      &gt;<em>Is there more blackletter in former-East-Germany than former-West-Germany?</em></p>
      <p>Albert Kapr wrote that the DDR (East Germany) published far more books per year in Fraktur than the West did. But I have a feeling that there is more blackletter in the open environment in the West, as West Germany rebuilt more of its old building after the war than the East Germans did.</p>
      <p>Kapr also wrote (in 1993) that young East German designers did not associate Fraktur with the Nazis at all. This may be because they were taught history differently. And/or they hadn't had as many war movies made in the East as West Germany (and Hollywood) made.</p>
      <p>Neo-Naziism is more prevalent now in the former East, however. They use a lot of blackletter, although they use a lot of heavy condensed sans serif type, too. Probably more than they use blackletter, even.</p>
