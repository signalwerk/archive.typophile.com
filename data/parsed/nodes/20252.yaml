      <p>Hannah,</p>
      <p>There is a bunch of material that can help you make stronger links between blackletter and Sans or Antiqua forms. See the Renner biography by Burke, and also Renner's own book, "Eine Jahresgabe der Typographischen Gesellschaft". In it are many illustrations of his deliberate experiments to somehow synthesize blackletter and Antiqua forms. He approaches the idea several different ways, and manages to come up with several interesting developments. You might examine how elements of Blackletter can be incorporated or evolved to be relevant or functional in modern printing. There's also a wide continuum of forms between blackletter, Uncial and Antiqua that you could consider.</p>
