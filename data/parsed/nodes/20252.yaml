      <p>yay! a good blackletter thread.<br>
      personally i really love blackletters of all kinds and shapes. as a jew who lived with the knowledge of the jewish holocaust (and lost a relative who was a victim of the german nazi’s actions), i still love blackletters. but i also “feel” some blackletters as “dangerous”, “brutal”, and “frightening”, and it allures me even more.<br>
      what you intend to do is important, because it’s you may bring this beautiful style to a rebirth, and clean it from the other connotations of “nazi,medieval,punk-rock,whatever”.</p>
      <p>unfortunately, there are well known common feelings about the blackletters. however, as people said here - the black letter was the text face of culture and knowledge from the medieval age, and that cannot be ignore.</p>
      <p>some of the blackletters faces scream “kill” or violence when you see them. but i think that there is a way for inovation, mabe if you analyse the graphic language of the styles and try to avoide it, or at least be concious of it.. if a foreign designer who has never seen blackletters before will stumble upon them, he will probably note two things which are apart or together.<br>
      1. sharp edges<br>
      2. too much detailes<br>
      3. high width contrast in the letters parts.<br>
      now i don’t want to exagarate, (i might be totaly wrong because there is a big variety). these are some of the features and qualities that are not always there, but it sums up what i was seeing. i think that some of the fraktured letters look violent, or jumpy.</p>
      <p>in my opinion there are some readability problems. sometimes i see faces with german letters which are not so known to the non germans. other times i couldn’t understand which letter is a certain capital.</p>
      <p>i agree with Hrant. i think that i havn’t seen many existing digitised fonts that are good for long texts, because there is a strange readability streaming problem. that is to say - the reading is not easy and flowing. there is a cavity that needs to be filled with a good modest and simple yet elegant blackletter. one that doesn’t scream, bite, or eat you, and who isn’t too much detailed.. it could be a good start to develope.</p>
      <p>(im sorry if my english is a little hard to understand).<br>
      cheers and good luck!!<br>
      yaron</p>
