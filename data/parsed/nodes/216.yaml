    html: <p> The Dutch g is pronounced in one of two ways, <br>depending on who's speaking and where. It's <br>either the same as the German "ach-laut" in <br>"Bach" and  the Scottish "loch," or it's the <br>exact same sound voiced. The "voiced" part is <br>the difference between the English k (unvoiced <br>palatal plosive) and the English g (voiced <br>palatal plosive). The ach-laut is an unvoiced <br>palatal fricative, and the Dutch g, when not <br>pronounced the same as the ach-laut, is a <br>voiced palatal fricative. <br> <br>I spent weeks and weeks walking around trying <br>to train myself to make the voiced version,  <br>scaring lots of people in the process, and <br>when I finally got to the Netherlands, everyone <br>I heard speaking Dutch was using the unvoiced <br>version. My time would have been better spent <br>on Dutch vocabulary. <br> <br>Another thing to watch out for is the ch sound. <br>In German it's pronounced one of two ways, but <br>in Dutch it's only pronounced one way (the same <br>as the ach-laut, and never voiced.) <br> <br>--John <br>  with an otherwise unused BA in German </p>
