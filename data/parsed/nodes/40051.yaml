  html: |-
    <p>I’m looking for a modern typeface (probably sans) that connotes performance, leadership and entrepreneurship; if it looked a little techy that wouldn’t be such a bad thing.</p>
    <p>Right now, my closest faces are <a href="https://web.archive.org/web/20081012145244/http://www.fonts.com/FindFonts/detail.htm?pid=415110">Neo Sans</a>, <a href="https://web.archive.org/web/20081012145244/http://www.daltonmaag.com/browse/fonts/dama/interface/corp">Interface</a> and <a href="https://web.archive.org/web/20081012145244/http://www.daltonmaag.com/browse/fonts/dama/foco">Foco</a> ... <a href="https://web.archive.org/web/20081012145244/http://books.google.com/books?id=OR-HKs4ZvrAC&amp;pg=RA1-PA291&amp;lpg=RA1-PA291&amp;dq=trantino+bold&amp;source=web&amp;ots=l1KCGKtmJR&amp;sig=kkgHX6BpZMYmBZ8kqnPep_3uexw">Trantino Bold Italic</a> is close but looks a little dated, unoriginal.</p>
    <p>Is there anything new or unexpected that someone can suggest.</p>
    <p>It should be durable enough for web/motion graphics. This will be a brand’s primary typeface.</p>
    <p>Thanks so much!</p>
