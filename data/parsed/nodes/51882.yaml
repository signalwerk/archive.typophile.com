  html: |-
    <p>I don’t think I can praise <a class="freelinking external" href="http://www.evernote.com" rel="nofollow">Evernote</a> enough. You’d have to give me a lot of time anyway. Among the many uses I have for it, one of them is keeping a scrapbook of everything typographically interesting I come across. If you’d like, you can explore it here:</p>
    <p><a href="http://www.evernote.com/pub/mrh/typography" title="http://www.evernote.com/pub/mrh/typography">http://www.evernote.com/pub/mrh/typography</a></p>
    <p>Or, you can grab the rss feed for it <a class="freelinking external" href="http://feeds.feedburner.com/evernotetypography" rel="nofollow">here</a>.</p>
    <p>I update it on a highly irregular basis.</p>
