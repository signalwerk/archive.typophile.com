      <p>A follow-up to this follow-up.</p>
      <p><cite>.. she opened the file on her own computer with her copy of Word, switched the selection to “Endnotes to Footnotes,” and apparently that did it. When I imported the new file, all of the superscripts were in arabic numerals.</cite></p>
      <p>The default number format for footnotes is arabic. The default format for endnotes is roman. Converting existing notes <em>will</em> change the active numbering mode, but ... it's somewhat easier to only change the number format:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/notes_5415.PNG"></div><p></p>
      <p>I didn't react to the original question because, well, isn't this an option in Quark? (Well, apparently not...)</p>
