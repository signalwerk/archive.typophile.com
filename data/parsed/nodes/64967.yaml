    <p>Greetings,</p>
    <p>Having had zero response from Quark after 24 hours, I thought I might try here in case someone knows about this. </p>
    <p>I am designing a scholarly history right now, 256 pages, with about 400 endnotes. I'm running Quark 8.1 on a Mac, bringing in a manuscript written in Word (97, I think?) on a Sony laptop running Windows XP.</p>
    <p>When I bring in the document, all of the superscripts change from the arabic numerals in the manuscript, to lower-case roman numerals! No variation of "use existing style" or "use new style" seems to change this. I asked the author to uncheck "fast save" since I remember this having been an issue in jobs from many years ago, but she looked at her tools settings and it was already unchecked.</p>
    <p>Anybody know what setting I need to change? I spent a long time looking through the Quark user manual and in their knowledge base (and also checked here) but couldn't turn up anything. Help!</p>
    <p>Many thanks,</p>
    <p>Bruce</p>
