      <p>Bruce -- Good to see you; it's been a while. Some random thoughts: </p>
      <p>Sounds like an encoding issue to me. Find out how the author has been entering the superscripts. What font is used on the author end? What font are you using on the design side? </p>
      <p>Are the resulting roman numerals full-size baseline characters, or superscripted?</p>
      <p>Try selecting a bit of copy and use File &gt; Save Text . . . to get the text back out and inspect it in a text editor. You might try saving in XPress Tags format to see if there are mysterious features being applied to the superscripts in question.</p>
      <p>Good luck.</p>
