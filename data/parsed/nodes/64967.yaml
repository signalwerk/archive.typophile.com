      <p>Hi Kent and everyone,</p>
      <p>Yes, it's been ages since I came by. I'll hope to be around more often in the future. </p>
      <p>Problem resolved: I paid my $39 to get this fixed, and discovered that it is "a known issue" with Quark (not sure if all version numbers, but certainly 8.1) and Microsoft Word. In the end the very nice person at Quark Tech Support had me email her the manuscript doc and she made the changes for us, because my collaborator/author was not able to do this workaround on her own machine. I'm going to spell it out here in case anyone does a search for this problem in the future.</p>
      <p>In Word, follow this path: INSERT &gt; REFERENCE &gt; FOOTNOTES. At that point there's a pop-up dialogue labeled CONVERT (or the equivalent). There are supposed to be three choices. However, the author's machine had only the top choice active/black and had its radio button already pressed, with no chance for us to deselect it. As I recall this top choice was "Footnotes to Endnotes." The other two choices were "Endnotes to Footnotes" and something else that I don;t remember (and her computer is now gone). In our situation both of these other choices were grayed out and inaccessible. Hence the request from the tech person that I email her the file. </p>
      <p>To the best of my understanding, she opened the file on her own computer with her copy of Word, switched the selection to "Endnotes to Footnotes," and apparently that did it. When I imported the new file, all of the superscripts were in arabic numerals.</p>
      <p>Bruce</p>
