  html: |-
    <p>The Getty Museum has a current exhibition titled <a class="freelinking-external" href="http://www.getty.edu/art/exhibitions/music_masses/">Music for the Masses: Illuminated Choir Books</a> that’s interesting not just for the manuscripts themselves, but also for the relationship between writing and music.</p>
    <p>They also have an upcoming exhibition (November 2007 to January 2008) on <a class="freelinking-external" href="http://www.getty.edu/visit/exhibitions/future.html">The Decorated Letter</a>, which focuses on illuminated letters from 800 to 1500.</p>
