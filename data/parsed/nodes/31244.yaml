    <p>Jo De Baerdemaeker, born September 8 1974 in Brussels, Belgium, is considered one of the two active typedesigners of Belgium. Frederik Berlaen is the other one.</p>
    <p>He is an experienced designer who has a passion for type and typography. Recently graduated at the University of Reading, Jo De Baerdemaeker designed and developed <strong><em>Lungta</em></strong>, a Tibetan-Roman typeface, and is eager to continue to work as a typeface designer, teacher and consultant.<br>
    He understands the complete creative process from concept to final output and keeps himself up-to-date regarding recent technological developments.</p>
    <p>De Baerdemaeker is also ATypI Country Delegate for Belgium.</p>
    <p>Education</p>
    <ul>
    <li><strong>Since October 2005</strong> Jo De Baerdemaeker is undertaking a PhD entitled <em>Tibetan Typeforms: from their inception in 1738 up to the present day</em> <a href="http://www.rdg.ac.uk/AcaDepts/lt/" rel="nofollow">at the Department of Typography and Graphic Communication, University of Reading</a>, UK.</li>
    <li><strong>2003-2004</strong> Master of Arts in Typeface Design, <a href="http://www.rdg.ac.uk/AcaDepts/lt/" rel="nofollow">Department of Typography and Graphic Communication, University of Reading</a>, UK. Graduated with distinction.</li>
    <li><strong>2001-2003</strong> Postgraduate Aggregate Typography <a href="/wiki/Plantin%20Moretus%20Museum" class="freelinking" rel="nofollow">Plantin-Moretus</a> Society, Antwerp, Belgium. Graduated with distinction.</li>
    <li><strong>1995-1999</strong> Master of Arts Graphic Design and Communication at <a href="http://www.sintlukas.be/" rel="nofollow">Hogeschool Sint Lukas, Brussels</a>. Graduated with distinction. Awarded as Laureate of 1999. Exhibition at Art Gallery Hogeschool Sint Lukas, Brussels, Belgium (1999).</li>
    </ul>
    <p>Writings</p>
    <ul>
    <li><em>Tibetan typography, a survey of evolutionary typestyles</em>,<br>
    dissertation at <a href="http://www.rdg.ac.uk/AcaDepts/lt/" rel="nofollow">University of Reading</a>, September 2004</li>
    <li><em>Jacques-Francois Rosart sculpsit</em>, essay at <a href="http://www.rdg.ac.uk/AcaDepts/lt/" rel="nofollow">University of Reading</a>, May 2004</li>
    <li><em>Defining a Tibetan character set</em>, essay at <a href="http://www.rdg.ac.uk/AcaDepts/lt/" rel="nofollow">University of Reading</a>, January 2004</li>
    </ul>
