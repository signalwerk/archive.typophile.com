      <p>Rich —</p>
      <p>I don’t know the story, but if you ever decide to try researching further, this info from the finder’s guide to the BPL Dwiggins Collection might help give you a head start.</p>
      <p>The relevant material is in Box #72.<br>
      United States Postage Stamp Project:<br>
      folder 24 — correspondence;<br>
      ff. 25-26 — drawings &amp; sketches;<br>
      f. 27 — postal cards with sketches (annotated);<br>
      ff. 28-29 — photographs of design by other artists;<br>
      f. 30 — memos &amp; clippings regarding project;<br>
      ff. 31-34 — reference materials.</p>
      <p>BTW, folders just after this in the same box are related to the currency project.</p>
      <p>— Kent.</p>
