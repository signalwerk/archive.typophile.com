      <p><em>But this time it’s an artist who knows how to really toy with his audience.</em></p>
      <p>Is everyone in said audience a graphic designer? Or familiar with Stefan Sagmeister? I’m sure plenty of Absolut vodka drinkers out there are not graphic designers, or are even aware of Sagmeister’s work. So how will this impact those members of the audience?</p>
      <p>As I implied earlier, if this ad is courting controversy, <a href="http://www.mediabistro.com/agencyspy/tbwachiat_day/origin_of_an_idea_absolut_v_art_123660.asp">its creator(s)</a> did not aim for the largest possible audience. So, I still think they lamely copied a concept by someone whose work they admire, and now someone noticed, and they (the agency) look bad, and their client (Absolut Vodka) will, too. Nothing brilliant about it.</p>
      <p>And speaking of Sagmeister and slavish imitation, I think <a href="http://www.coroflot.com/public/individual_file.asp?individual_id=152664&amp;portfolio_id=1400410&amp;">this</a> is absolutely brilliant. :-)</p>
