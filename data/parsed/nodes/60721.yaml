      <p><em>No matter how cool an Absolut ad is the chances of anyone noticing are next to nil.</em></p>
      <p>I’m not so sure of that, James. I noticed their ads during the 90s, when they would appear in WIRED magazine... They weren’t ripping off artists then, they were working <em>with</em> them, and hiring them to do ads! (This Keith Haring ad is from the 80s, but you get the point.)</p>
      <p></p><div class="imageWrap"><img src="/files/haring-absolut-ad_6669.jpg"></div><p></p>
      <p>I’m not saying that controversy doesn’t generate publicity or word-of-mouth (think Benetton), but plagiarizing an artist’s work (any artist’s, not just Sagmeister) could backfire against them... I think they’ve shot themselves in the foot here.</p>
      <p><em>And every design geek on Earth gets incensed and demands that everyone stop and look at what Absolut is doing.</em></p>
      <p>I’m not sure we’re that influential... :-)</p>
