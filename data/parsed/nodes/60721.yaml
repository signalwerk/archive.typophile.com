    html: |-
      <p>Both videos comprise sentences with words formed from raw materials in a variety of environments.<br>
      I don’t think it’s possible to say whether or not plagiarism is involved.</p>
      <p>(You could trace the “each sequential shot is a word in a sentence” concept back to the Pennebaker 1965 “video” of Bob Dylan’s Subterranean Homesick Blues, or earlier. I made a film a bit like that in 1974, with a number of people each saying a word in sequence.)</p>
      <p>However, when a creative comes up with something that bears a strong resemblance to well-known currently fashionable/popular work, even if there is no plagiarism involved, it’s best to kill that baby, for the sake of reputation.</p>
      <p>But if the “second man in” already has a substantial reputation, or both have equal reputations, they are not so likely to get called on it.</p>
      <p>It happens in type design...</p>
