    date_raw: 6.Aug.2009 4.20pm
    votes: null
    html: <p>This campaign is brilliant. Absolut has done so many great ads that there’s a coffee table book devoted just to one series. No matter how cool an Absolut ad is the chances of anyone noticing are next to nil. So this brilliant guy comes along, blatantly riffs on Sagmeister, while Sagmeister is surfing in Indonesia, with an ad about being different. And every design geek on Earth gets incensed and demands that everyone stop and look at what Absolut is doing. And for the next year the design police will be blogging about every Absolut promotion in relation to this scandal. The only sad thing is how many designers don’t realize that they’re being manipulated by advertising—am I the only one who went to an art school that made a semester of critical thinking part off the curriculum?</p>
