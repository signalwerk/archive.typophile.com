    html: <p>Frankly I don’t see the problem with Absolut’s ad. Exploring creating type out of found materials or experimenting with type in nature is hardly patented by Sagmeister nor does he have a copyright on the idea. If Absolut had stolen or ripped off his work, fine, I get it, but they didn’t. Maybe the author was inspired by Sagmeister’s work, maybe the designer was inspired by something else (hell, we’ve done type in food experiments here on typophile, does that make us rip off artists too?), but there was no theft involved here. If anything, maybe it is an homage to Sagmeister’s work and how different his work is from everyone else. Who knows?</p>
    html_clean: <p>Frankly I don’t see the problem with Absolut’s ad. Exploring creating type out of found materials or experimenting with type in nature is hardly patented by Sagmeister nor does he have a copyright on the idea. If Absolut had stolen or ripped off his work, fine, I get it, but they didn’t. Maybe the author was inspired by Sagmeister’s work, maybe the designer was inspired by something else (hell, we’ve done type in food experiments here on typophile, does that make us rip off artists too?), but there was no theft involved here. If anything, maybe it is an homage to Sagmeister’s work and how different his work is from everyone else. Who knows?</p>
