    html: <p>I think that they still are working with an artist. But this time it’s an artist who knows how to really toy with his audience. It’s like Hirst sticking dead animals into tanks of preservative and selling it to the gullible nouveau riche just so people will argue about whether or not a dead shark in a glass box is art and how much the price tag has to do with the definition.</p>
