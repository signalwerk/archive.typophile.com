      <p>Norbert, I just spoke with Stephen Coles and he agrees with you.</p>
      <p>This is what he told me.<br>
      This series has been on Typophile a few times. As I remember the publisher digitized ITC Didi, a 1970s photo font. It's not available publicly. Similars include Didona, Moderno, Benton Modern, and Veer/Jukebox's digitization of Pistilli Roman.</p>
      <p>I guess the case is closed, thank you both Norbert and Stephen.</p>
