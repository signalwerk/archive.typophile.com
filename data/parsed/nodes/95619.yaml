  html: |-
    <p>Hello typophile,</p>
    <p>I'm wracking my brain trying to identify this typeface, and what makes it worse is that I believe I once identified it and have since forgotten. My mind is a sieve, but I usually remember font names, apparently not this time.</p>
    <p>The closest I could come up with would be a condensed version of Sahara Bodoni, but I fear it's actually a Didot and not a Bodoni. Another one that was suggested to me was Bitstream Industrial 700, but I was told that is not quite correct either.</p>
    <p>It's lovely and driving me mad, any ideas?</p>
    <p><img src="http://typophile.com/files/22_vgogh.jpg"></p>
