      <p>Hi Malcom,</p>
      <p>I was looking for some method less manual. Yeap, I finally did that, but it is a pain not to have a way to reset class members if someone has been messing around with them.<br>
      If you set them to zero they continue ignoring changes in the leading pair. After setting all of them to zero I cleaned the kerning erasing all pairs with a value under one. In that way they work again with the class.</p>
