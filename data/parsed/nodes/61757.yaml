    <p>Hi there,</p>
    <p>I have to improve the kerning in a font. The question is there are many wrong exceptions in the class based kerning.<br>
    I need to erase all kerning values that are not equal to the leading pairs. Is there a way to do that?</p>
    <p>Thanks in advance.</p>
    <p>Ramiro.</p>
