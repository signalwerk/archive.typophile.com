    html: |-
      <p>Ramiro</p>
      <p>How many is 'many'?</p>
      <p>If you have a couple of hundred bad exceptions it is possible to just delete these from the metrics window kern listing. Make sure you have the kerning classes you require correctly added to the Classes Pallet. The kern values for your exceptions should now turn red in the kern listing.</p>
      <p>Now click the top of the kern listing on the header that says 'Value'. This will sort the listing and force all the red exceptions to the end of the listing. Go to the end of the listing and start deleting them.</p>
      <p>It is a bit infuriating that you can only select one entry at a time to delete which means if you have more than just a couple of hundred - it will take a long time to delete them all.</p>
      <p>Hope this helps<br>
      Malcolm</p>
