      <p>Thanks all for your very insightful comments, particularly that infographic by pica pusher. </p>
      <p>I believe the Hebrew in my sample is Adobe Hebrew, the kamatz was positioned automatically.</p>
      <p>The dictionary would read right-to-left because that's the instinctive direction for thumbing through a Hebrew dictionary. This project is a revision of the classic Jastrow Aramaic-English Talmud dictionary from 1903, which is paginated from left-to-right, ostensibly due to the vast majority of english text, but it's unwieldy when searching for that specific reason.</p>
      <p>The original also indented the Hebrew heading for each entry, which is why I did in my sample. Any thoughts as to best practices in this regard? Should the heading be indented, flush, outdented?</p>
      <p>Oh, to David Hamuel, Meira is my neice :)</p>
