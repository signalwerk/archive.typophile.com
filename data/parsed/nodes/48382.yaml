    html: |-
      <p><cite>Does the MS Word doc encode the Hebrew characters right-to-left?</cite></p>
      <p>(Sure it does. Word even has no problems at all with Arabic and its initial/medial/finals.)</p>
      <p>(Post-edit: "encoding" ... the text appears left-to-right in the actual file, and that's what InDesign/Regular reads and shows. It's <em>also</em> what InDesign/ME reads, but that shows it correctly.)</p>
      <p><cite>How averse are you to moving to CS3?</cite></p>
      <p>If I was the OP, I'd go down kicking and screaming.<br>
      Sure, CS3 has a few advantages over CS2 -- it's significantly faster, and its GREP Search and Replace has some fantastic applications. But, like CS2, it has <strong>no</strong> support at all for RTL languages. It will import the Word document just fine, but without warning it will load all text left to right, thus "gnisrever" the RTL text. The ME version has it all.</p>
      <p>No anchored frames because of<br>
      <cite>thousands of entries, and each will be imported from Word text.</cite><br>
      wouldn't worry me in the least. If these words always appear at the same place, for instance as a heading before the actual definition paragraph, it's well worth the effort writing a script that cuts the word, inserts an anchored object, and pastes the word inside it. Thing is, anchored objects do not like text wrap, and reverse. I think there are solutions to this; perhaps you'd better ask in the <a class="freelinking external" href="http://www.adobeforums.com/cgi-bin/webx/.3bbf275c/" rel="nofollow">InDesign User's forum</a>. Whatever the solution is, scripting is the way to go.</p>
