    html: |-
      <p>Adobe InDesign CS/3 ME (Middle East edition, for Middle Eastern languages, such as Arabic, Hebrew and Persian [Urdu]) is a very intelligent program which handles mixing both left-to-right languages, such as English or Russian, together with right-to-left languages, such as Arabic or Hebrew, in an intelligent way.</p>
      <p>The combination can either be for a left-to-right language (in which the arrow indicator in the character palette should be on the left side, pointing right (see the character palette), or be for a right-to-left language (in which the arrow indicator in the character palette should be on the right side, pointing left (see the character palette), or side by side, with each language in its own text block.</p>
      <p>When the two languages are side-by-side in separate text boxes, consider carefully the best side to place the boxes.</p>
      <p>As a professional typesetter, I suggest to place the left-to-right language on the left side, and the right-to-left language on the right side. </p>
      <p>This decision is based upon the graphic arts concept of "eye movement". When the left-to-right language is on the left side, the left-to-right language reader simply places his or her eye naturally on the left side. So, too, when the a right-to-left language is on the right side, the right-to-left language reader simply places his or her eye naturally on the right side. </p>
      <p>If the right-to-left language is Hebrew, the size of the font and the line spacing is not simply automatic.</p>
      <p>This is because Hebrew text translates into much more words in Western languages, such as English. Thus, if the font size and line spacing remains the same in both languages, the Hebrew side will take up far less lines than English. If you desire this kind if result, fine. If, however, you desire to each text block to be filled with lines equally, you have three choices:<br>
      1) to keep the same line spacing, but to increase the font size for the Hebrew;<br>
      2) to keep the sane font size, but to increase the line spacing for the Hebrew;<br>
      3) to increase both the line spacing, and the font size.</p>
      <p>Another consideration is that Hebrew letters look much too big if they match the size of uppercase English letters. Yet, if they match the size of lowercase English letters, the Hebrew letters look much too small.</p>
      <p>I think the correct way to match side-by-side languages is to weigh the "color" look of the page as a whole. This means, each side has a certain "color" of the amount of black ink and white empty space. The best font size and line spacing for the Hebrew is a proper "color balance".</p>
      <p>Ideally, the font should not be increased too much for the Hebrew to cause ot to look too "holey" or "spacey". On the other hand, the line spacing should not be increased too much to cause the Hebrew letters to look too small in comparison to the English text, or to have too much space between the lines.</p>
      <p>Of course, since the right-to-left language determines the page count, it should be laid out first, and the left-to-right language should follow later.</p>
