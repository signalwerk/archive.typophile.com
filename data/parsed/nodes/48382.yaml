    <p>I'm working on a Hebrew-English dictionary project for print, and want to achieve what appears in the following image:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hebrew_5710.gif"></div><p></p>
    <p>As a web designer primarily, the only way I can describe this is that I want the Hebrew word to "Float Right" immediately preceding (or inside) the English paragraph comprising the Hebrew word's definition.</p>
    <p>Any ideas on how to assign this as a paragraph or character style inside InDesign (CS2 Middle Eastern)? Thanks!</p>
