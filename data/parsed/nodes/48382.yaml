    html: |-
      <p>I forgot to mention that if you choose to use Adobe InDesign CS/3 ME, you will need up-to-date Hebrew fonts with Unicode encoding. Older Hebrew fonts, including some TrueType Hebrew fonts, will not work.</p>
      <p>If you choose to use Adobe InDesign CS/3 in its US or Western European version, then you could use older Hebrew fonts.</p>
      <p>You might be able to position the Hebrew words as embedded or anchored graphics. However, before you make the graphic, you will have cause the Hebrew text to be lowered a little, so the baseline of the English text lines up with th Hebrew word. Also, you will have to key in the Hebrew letters in backwards order, or hit the left arrow key after entering the Hebrew letters in correct order.</p>
      <p>I syuggest to mix the languages in the proper way, and use Adobe InDesign CS/3 ME.</p>
      <p>You can contact FontWorld (at <a href="http://www.fontworld.com" title="www.fontworld.com">www.fontworld.com</a>), for very good sales and free technical support for Adobe InDesign CS/3 ME and other Adobe ME products.</p>
