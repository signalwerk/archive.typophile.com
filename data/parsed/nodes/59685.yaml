  html: |-
    <p>Hi All</p>
    <p>I am designing a logo for a event planner. I am leaning toward designing a wordmark rather than a pictoral logo. That being said, I am trying to find a clean, art-deco inspired typeface with some interesting ligatures, particularly an L with an inset E.<br>
    So far, I have found <a class="freelinking external" href="http://www.veer.com/products/typedetail.aspx?image=UMT0000422#characters" rel="nofollow">Cordial</a> and <a class="freelinking external" href="http://www.veer.com/products/typedetail.aspx?image=TTT0000021#characters" rel="nofollow">Estilo</a> (which I love - have already used it for my wedding stationery), but I would welcome a few more suggestions. </p>
    <p>Thanks!</p>
    <p>Natalie</p>
