      <p>As with all things, the particulars make the difference.  The percentage of sale price paid to the individual type foundries with MyFonts, to date, has been reasonable. This is one of the reasons for the success and the feeling of partnership in the working arrangement.  With this fair share per sale model, I see no reason to divvy up any portion of the $50M sale price of MyFonts organization with contributing foundries.  I see it as we have been paid monthly all along just as promised.<br>
      In the recent past, there have been (and may still be) arrangements with larger resellers where the percentage of sale price received by the designer foundry has been far less to the point of seeming unfair. With MyFonts, this has not been the case.  MyFonts makes no claim of ownership of the intellectual property nor does it set prices.  Further, there are no binding exclusivity clauses.  Those of us selling through MyFonts are not taking a risk.<br>
      My hope is that all of this continues. I hope that: "When foundry contracts come up for renewal, we will of course revise the contracts to reflect the new ownership" does not mean any changes in either policy or rates or contractual expectations. The Bitstream folks who sold off the MyFonts assets have every right to their $50 M. I certainly do not feel that I am owed any portion of it.</p>
