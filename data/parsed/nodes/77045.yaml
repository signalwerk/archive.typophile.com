      <p>Bill, I don't think I alluded to Marx's labour theory of value, although I think its 'moral appeal' lies directly in the common sense appreciation that value <em>is</em> created by labour and, although the total value of a thing cannot be calculated from this basis, to deny it is, at least, morally unappealing.</p>
      <p>I'm not looking for an economic theory, I'm looking for a way of doing business that puts profits into the hands of the people who make things: not instead of into the hands of people who finance things, but more equitably distributed, so that capital -- and its corollary, power -- is concentrated in fewer hands and more people can have a greater say in how their lives are organised and to what end. Capitalism left to its own devices will never become 'more just and human', because neither justice nor humanity are its concerns. When individual capitalists behave in ways that are just and humane regardless of the effect on financial return, they do so contrary to capitalism, out of personal beliefs that are, at best, orthogonal to capitalism and frequently in opposition to it. Such beliefs can be a starting point for reform, but only widespread structural change is going to humanise economic activity. I believe this structural change should subsist in worker ownership, whether directly (roughly how we run Tiro), through <a href="http://en.wikipedia.org/wiki/Mondragon_Corporation" rel="nofollow">cooperatives</a>, or in joint ventures (there is a successful <a href="http://harmacpacific.com/employees.php" rel="nofollow">pulp mill</a> near here that is jointly owned by the workers and a group of private investors). Where such businesses have been established, they compete in the same market as capitalist businesses, which is ample evidence that commercial activity is not reliant on the capitalist class, that the free market may be just as free -- <a href="http://www.youtube.com/watch?v=a-0gxca-VxM" rel="nofollow">or more so</a> -- without them.</p>
      <p>Eighty years on, <em><a href="http://www.vatican.va/holy_father/pius_xi/encyclicals/documents/hf_p-xi_enc_19310515_quadragesimo-anno_en.html" rel="nofollow">Quadregismo Anno</a></em> remains pertinent reading.</p>
