      <p>Jan and Bill, note again that I was responding to Adam's statement that 'the foundries did all the hard work anyway, and truly are the ones who generated the value'. Now, as you and others have pointed out, this is not actually the case, and the MyFonts staff have also created value and, by financially facilitating the activity of that staff, so have the investors. They have all generated value, through a combination of products and services. My belief, though, is that everyone who contributes to the generation of value should receive a share in the profits of that value proportionally equal to what they contribute.</p>
      <p>I am not suggesting that, under the present arrangement, MyFonts should divvy up the $50 million in this way. I am questioning the present arrangement, which is based on a negotiated inequality among the creators of value. Chris and others have expressed their satisfaction that 'the Bitstream folks who sold off the MyFonts assets have every right to their $50 M', and that's an entirely legitimate view that I don't challenge, and I fully agree with Chris that the MyFonts contract and royalty model is much better than that offered by many other resellers or foundries. MyFonts has been, on the whole, a good thing for type. But here's an idea: when the products <em>and contributed marketing materials</em> of a vendor contribute substantially to the value of a corporate asset, wouldn't it be a good thing if the vendor contract made provision for dividends from the sale of that asset? This isn't even a negative for the corporation, since it can be used as a means to encourage vendors to continue to sell their products through the reseller's service, by linking the dividends to active contracts.<br>
      _____</p>
      <p>Bill, ownership <em>becomes</em> the key issue when ownership of the means of production by capital has such a strong tendency to exploitation of the non-owning worker. Sure, it isn't a philosophical issue: one can imagine a capitalist economy in which all the capitalists were really nice people who believed in a more equitable distribution of wealth and acted accordingly. But that isn't how they act, nor how they have acted, in any significant numbers, for the few hundred years in which they've been doing their thing. So it is a practical issue. For the past hundred years or so, unionism and sometimes governments have tried to ameliorate the inequality while maintaining capitalist ownership. The result, in case you have not noticed, is that wages, in real spending terms, have decreased over the past half century, the inequality has grown more extreme not less. The bail-out swindle by which profits are privatised while loss is nationalised, by which the most profitable sector on the planet holds nations to ransom and forces taxpayers to cover its bad gambling debts, is simply the latest round of what  as Warren Buffett rightly describes as a class war by the rich against the rest of the population. I see no evidence at all that this will change or improve without an increase in worker ownership.</p>
      <p>If you visit cooperative, worker-owned or hybrid workplaces, you'll find that it is, in fact, the key issue that transforms the nature of work from one of servile indebtitude -- I must do this job and not rock the boat because otherwise I will be unable to feed my family -- to one of active agency -- I do this job because I have a stake in this business and am share in its success.</p>
