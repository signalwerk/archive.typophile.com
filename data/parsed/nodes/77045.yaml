      <p>Adam, I agree with your analysis. </p>
      <p>I think the problem is that wherever there are large amounts of money involved, such as in banking or stocks, there is tremendous opportunity for corruption and exploitation. To prevent this requires strong government regulation, progressive taxation, and enforcement. Unfortunately these have failed often the past 30 years, partly due to campaigns against them in the name of the "free market." I think this is what makes people extremely suspicious, even when capitalism is working well, and to the benefit of many people. </p>
      <p>John, concerning the issue of whether ethical business practices are inherently anti-capitalist. I interviewed the great industrialist Aaron Feuerstein, who paid all of his workers for a year after a factory fire, until the factories were rebuilt. He has been held up as the model of an ethical capitalist. He told me that you can combine ethics and profit, but it takes a lot of creativity and courage to do so. I hope he's right.</p>
