      <p>please note that according to the current NASDAQ stats, Bitstream’s current total market capitalization is some $57.7M. Total market capitalization means: the total price which the market participants would be willing to pay for all of Bitstream’s stocks. In recent times, the BITS stock price was on a slight declining course, with no major changes. Of course the “total market capitalization” is a bit of a fictitious value because if the stockholders offered all the shares for sale on the open market at the same time, that price would not be achieved. But given that the Monotype merger has not covered all of Bitstream (i.e. the Pageflex and Bolt businesses are being spun off), the $50M sum seems rather close to the stock value. </p>
