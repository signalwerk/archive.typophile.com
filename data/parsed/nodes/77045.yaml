      <p>John, ownership of the means of production by the government has also proved, contrary to Marx, to be highly vulnerable to exploitation of workers. That's why focusing on ownership  misses more important factors. In studying agricultural transformation all around the world, throughout modern history my wife found failed and successful examples with government ownership and private ownership, small and large farms, etc. </p>
      <p>Your citing experience in the past 50 years is misleading. In the US, before FDR there was extreme inequality. From FDR through about Jimmy Carter, greater equality held. From Reagan on—the past 30 years—the inequality has increased. This is because of government policies, as Paul Krugman explains in his book Conscience of a Liberal. Contrary to what you say, mixed capitalist and government ownership economies, such as we've had in the West, can work without the the extreme exploitation you've pointed to. Employee ownership also has a mixed record, in reducing exploitation, from what I've heard. So it alone isn't a magic bullet. </p>
      <p>As far as ethical practice tending to reduce profit, I think that's wrong as a general rule. Building relationships of trust among partners in an enterprise, which ethical conduct achieves, generally promotes profits—an argument made to me by Feuerstein, and which he actually did benefit from monetarily, in specific ways. It is also true that being ethical can at times run contrary to short term profits, as Feuerstein also conceded. So ethics can cut both ways. The creativity is to find a path where you take advantage of the profit-enhancing aspects, and minimize the losses. I think that's Feuerstein's view, if I got him right.</p>
