      <p>John,<br>
      In a post-industrialist service-oriented society, how do you define “making things”? Isn’t a website, a database, a user interface or, more abstractly, a user experience, also a “thing” that somebody has made, and invested a lot of know-how and time and creativity into? What people get for their money when they visit a website is not just this “thing” called a typeface or a book or a toaster, it is also their buying experience, the information provided, and perhaps quick and good service if something goes wrong. A distributor like MyFonts offers these things and seems to do a good job at it. Is it part of the product or isn’t it? It seems to be part of the reason why people come back, so it’s part of what people are willing to pay for. If a designer/foundry is not very interested in providing all of that, then they can either try to sell their “thing” as is, without the same quality of experience attached; but they might be doing users a disservice, or simply not reach any users. Or they outsource that part of their product, and pay a commission based on the success of the service (i.e. sales). Why would producing this service at a mutually agreed price be in any way unethical or redundant? </p>
      <p>You seem to argue that service is, in any case, of a lower order than “things”. I don't want to get into that. Much of my work is a hybrid of both; and I think that valuing the part of my work that results in something tangible higher than the part that results in somebody smiling or nodding, would be … counter-productive.</p>
      <p>Btw, a typeface also has an abstract component. It implies, or provides, a user experience which can be good or not so good. This is independent of its actual drawings, the stuff that you can see and almost touch and that makes it most similar to a “thing”. In fact, that part (OT programming, Unicode compatibility, etc.) is quite similar to user interface programming. Less thing-ness, but just as crucial to the experience. Which takes me back to my initial question: define “thing”.</p>
