      <p>John, I agree worker ownership of businesses is a good thing, but it doesn't solve the economic problems we face. The macro-economic policies of the government are critical for creating an environment that is both thriving economically and relatively fair. And, as my wife found, who owns what is a less important a variable than the macro-economic policies pursued by the government. </p>
      <p>The exception is that high income inequality tends to corruption, so that government policies end up enriching a few instead of investing in the economic growth of the whole nation. If employee stock plans limit exorbitant CEO pay, particularly when the business does poorly, that would be great. Looking at the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Employee_Share_Ownership_Plan" rel="nofollow">wikipedia article on employee ownership</a>, I don't see any information on that. </p>
      <p>I do think that the way our publicly own corporations are structured, with management having excessively short-term incentives, is a huge problem, so maybe there is something in worker ownership that can have a benign effect. The <a class="freelinking external" href="http://en.wikipedia.org/wiki/Distributism" rel="nofollow">distributist philosophy</a>, which I didn't know about and gather you are a fan of, seem to be impractical romantic schemes in their early 20th century origin of "three acres and a cow". When enterprises are big, it can be a problem for employees to be invested too much in their own company, because if the company goes down, so do their pensions. Also governance of large companies I think tends to attenuate the influence of workers as opposed to management. </p>
      <p>In these matters, what I have learned from my wife's work is that the detailed policies often turn out to be more important than the form of ownership, but I'm happy to learn more. If you have links on the impact of employee ownership on CEO pay and corporate governance, I'm interested.</p>
