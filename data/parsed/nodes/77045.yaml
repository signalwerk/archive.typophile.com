      <p>Adam, I know how corporate capitalism works. As you may have noticed, Tiro tries to operate in a different way. I believe -- doubtless to my own financial detriment -- that the people who create value should share in the returns on that value to a proportionate degree, and that one shouldn't seek to profit from the labour, skill and creativity of another person except insofar as you add value to what is produced (a distribution system adds value, for instance, but is of its nature secondary to the production of the thing distributed). So when <em>you</em> acknowledge that 'the foundries did all the hard work anyway, and truly are the ones who generated the value', I'm bound to ask what share those value-generators get of the income from the transfer of ownership of that value. I know they probably won't get any, because Bitstream -- like most companies in the capitalist system, as you describe -- is set up in a way that rewards people who have had no direct hand in the creation of the value, but have only wagered on the ability of the people who have.</p>
      <p>Meanwhile, here we plug along trying to make good things and sharing the profits among the people who contribute their labour, skills and creativity, 'cause that's how we roll.</p>
