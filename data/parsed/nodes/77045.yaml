      <p>Bill: <em>John, ownership of the means of production by the government has also proved, contrary to Marx, to be highly vulnerable to exploitation of workers. That's why focusing on ownership misses more important factors.</em></p>
      <p>That doesn't follow. I never said anything about state ownership of the means of production: I talked about three different practical models of <em>worker</em> ownership of the means of production, including one that involves shared ownership with capital investors. The fact that both capitalist and state ownership of the means of production tend to exploitation of the workers suggests to me that anything other than actual worker ownership will tend to that exploitation. Yes, there are other factors that should not be overlooked -- including bureaucratization, resulting in a division within worker owned businesses between a management class and a labour class, which is a criticism that has been made of the Mondragon cooperatives by some commentators --, and I don't think worker ownership is a 'magic bullet'. But I do think there needs to be an increase in such ownership, that financial services should not be biased against such ownership as they are now, and that an accounting of value needs to include a reasonable consideration of the contribution of labour and corresponding reward. [Note that this is something quite different from a Marxian labour theory of value, which seeks to establish value by reference to labour; I'm talking about a multifaceted estimation that tries to account for the ways in which different people contribute to commercial value.]</p>
      <p><em>Contrary to what you say, mixed capitalist and government ownership economies, such as we've had in the West, can work without the the extreme exploitation you've pointed to.</em></p>
      <p>Because thousands of men and women shed their blood to win the eight hour day, the weekend, collective bargaining, universal suffrage, labour law, and the other ameliorating checks against such exploitation. None of these things were handed to the workers by capitalists: it has all been fought for, and frequently died for. And these are precisely the hard-won checks on exploitation that <a href="http://www.bloomberg.com/news/2011-10-02/koch-brothers-flout-law-getting-richer-with-secret-iran-sales.html" rel="nofollow">today's capitalists</a>, with the collusion of bought-and-paid-for governments, are systematically dismantling.</p>
