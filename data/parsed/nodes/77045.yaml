      <p>John, </p>
      <p>Unfortunately, I’m not able to answer your specific question. However, I’ll try to help. First, let’s have a look at how companies work, in a somewhat simplified model: </p>
      <p>1. You want to set up a company.<br>
      2. Usually, you need money to finance your operation. That’s called capital. You find capital: either you invest your savings (in which case you’re the owner, i.e. sole shareholder or stockholder), or you take up a credit at a regular bank (in which case you’re also owner but have a credit running that becomes part of your expenses — but we’ll get to that later), or you sell shares aka stocks of the company (then you have other shareholders/stockholders, i.e. co-owners).<br>
      3. You can offer the shares to an investment bank, in which case it becomes the shareholder or co-owner of your company. Or you can sell the shares to some selected individuals. Or you can offer them for public trading (so-called IPO).<br>
      4. You set up a business model. You have expenses and you have revenue. If you’re selling some vendors’ products, you typically offer the vendors a deal: a part of the revenue (your first expense) goes directly to the vendors.<br>
      5. The other part of the revenue (your commission) covers your other expenses: office rent, revenue taxes, reserves, investments, payroll for employees, consultants, payments to contracting companies and other “cost of operation”.<br>
      6. The revenue minus the expenses equals profit. You perhaps pay some taxes off the profit, and then you distribute the profit to the shareholders (i.e. owners) as a dividend.<br>
      7. As long as your company is a publicly traded company, anyone with some spare capital is free to buy the stocks from existing shareholders who are willing to sell them. At any time, employees, consultants or vendors can become shareholders as long as they buy the stock.<br>
      8. You continue to run your business as long as you decide to do so.<br>
      9. If you decide to stop running the business, you negotiate with your shareholders a potential sale of the shares, and negotiate with prospective buyers.<br>
      10. If the negotiations with both parties work out fine, the transaction happens: the buyer acquires the shares from the shareholders (i.e. owners), and becomes the new owner. The former owners i.e. shareholders receive a payment. </p>
      <p>To sum it up, there are typically three groups (roles) of people who contribute value and receive money in exchange while a business is running:<br>
      a) Vendors contribute their goods and receive payments as part of the business deal outlined in item 4.<br>
      b) Employees and consultants contribute work, contracting companies contribute services, and they all receive payments as part of the item 5.<br>
      c) Owners i.e. shareholders contribute capital, and they receive payments as part of item 6, and — should if items 9 and 10 occur — as part of 10. </p>
      <p>As I wrote above, the roles listed above can be interchangeable: vendors, employees, consultants or contracting companies are free to become co-owners or shareholders as long as they contribute capital. If they do so, they become recipients of the payments in items 6 and 10. </p>
      <p>&gt; So how much of that $50 million is going to be shared with the people<br>
      &gt; who generated the value that Bitstream are now cashing in on?</p>
      <p>If you’re a shareholder of Bitstream —&nbsp;which has been a company traded publicly in the U.S. (NASDAQ symbol "BITS") — I assume that there are appropriate channels where you can find it out. I’m not a shareholder of Bitstream and am not involved much in stocks trading in the U.S., so I cannot answer your specific question. </p>
      <p>Some information about the acquisition can be found in the <a href="http://www.marketwatch.com/story/bitstream-inc-agrees-to-sell-font-business-to-monotype-imaging-files-registration-statement-for-spin-off-of-non-font-business-2011-11-10" rel="nofollow">Bistream press release</a> and the <a href="http://www.marketwatch.com/story/monotype-imaging-to-acquire-the-font-business-of-bitstream-inc-2011-11-10" rel="nofollow">Monotype Imaging press release</a>. Also, according to <a href="http://www.google.com/finance?client=ob&amp;q=NASDAQ:BITS" rel="nofollow">Google Finance</a>, Bitstream currently has a market capitalization of approx. $57.7M. You may also find the <a href="http://biz.yahoo.com/e/111110/bits8-k.html" rel="nofollow">SEC 8-K filing summary</a> or the actual SEC filing materials (<a href="http://www.sec.gov/Archives/edgar/data/818813/000119312511307248/0001193125-11-307248-index.htm" rel="nofollow">1</a> | <a href="http://www.sec.gov/Archives/edgar/data/818813/000119312511307245/0001193125-11-307245-index.htm" rel="nofollow">2</a>) interesting. </p>
      <p>But I hope I was able to clarify the issue a bit, and provide you with some pointers to where and how you can find more information! :)  </p>
      <p>Best,<br>
      Adam</p>
