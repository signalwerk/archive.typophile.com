    html: |-
      <p>&gt; The folks who started MyFonts are out there, James.</p>
      <p>Chris, </p>
      <p>the folks who started MyFonts are still at MyFonts, and I don’t think much will change in that respect :) </p>
      <p>It’s already about 7-8 years ago that a couple of the original team members left the project and since then, MyFonts hired some new people, but practically all of the original team members are still with MyFonts. I joined the team some 9 months after the project’s inception and have been working for MyFonts for 11 years now — and I don’t intend to go anywhere. </p>
      <p>(One person whom we do miss indeed, and owe a huge lot, is Charles Ying, then-Bitstream Chairman who came up with the MyFonts idea and nurtured the project from its early years. He passed away in 2010.)</p>
      <p>Remember, when MyFonts started, there was much trouble in the air because of the fact that it was Bitstream who started the project. Back then, Bitstream was considered the “bad guys”: “the knockoff boys who almost killed the industry for bundling 900 fonts with Corel Draw and selling a 500-font-CD collection for $50”. </p>
      <p>I try to judge people based on the quality of the work they do, not based on the labels they carry. When I was joining the MyFonts team in 2000, it was important to me that Bitstream showed its intentions to “clean up its licensing mess” — and they did. (2003 was the final round when they signed licensing agreements for some Linotype designs — which Bitstream still sold under different names, but the designs were finally licensed). </p>
      <p>From what I’m hearing from the new owners, one of the main reasons why they paid $50 million for MyFonts was because they found our project to be successful, and I like to think that one of the key factors behind its success has always been the team (I think they mentioned that, too). </p>
      <p>After 11 years now, I can say that it’s by far one of the best teams I’ve ever worked with, or heard that anyone’s worked with. The MyFonts people are dedicated, focused and show amazing work ethics (by my standards anyway). It’s also true that we’ve enjoyed great autonomy and freedom in running MyFonts. </p>
      <p>I for myself cannot imagine “starting another online font store”. So far, MyFonts has been the place where I could see my best and sometimes craziest ideas come into existence. The spirit and chemistry among the team has been just mind-blowing (without exception, for 11 years — beat that!), and I expect this to continue the same way. </p>
      <p>What’s important: Monotype says that they recognize the way the team operates as a key factor behind MyFonts’ success, so I’d be rather surprised if they decided to suddenly change things. Of course, we shall see how it goes — but I don’t really think the question would be any less open if anybody else acquired MyFonts (say, an investment bank or whatever). </p>
      <p>In a sense, while I did recognize the fact that Bitstream was MyFonts’ owner, that fact never was of paramount importance. Had MyFonts been owned by Monotype or whomever else from the very beginning, I guess the same would have been true.</p>
      <p>Economic theories say that monopolistic developments are not good for the market because they slow down innovation and make people lazy. Well — at least from what I’ve learned from working with the MyFonts people for 11 years is that those folks are anything but lazy or lacking innovation. </p>
      <p>Dunwich Type writes: </p>
      <p>&gt; When [the folks who started MyFonts] cashed out</p>
      <p>The folks to cash out would be Bitstream shareholders. Bitstream has been a publicly traded company for a long time now. If *you* had bought any shares, you’d be one of those to cash out, I guess. Not sure, however, whether the Bitstream shareholders are the ones whom Chris is referring to as “the folks who started MyFonts”. The MyFonts team consists primarily of employees of the company as well as consultants (such as myself). And most of us were in their early 20s when we started the project. </p>
      <p>One thing is certain: consider that Monotype Imaging bought Linotype for $60M and MyFonts for $50M (a rather comparable amount). I still remember the times very vividly when we hit the first 1,000,000 purchases, or when MyFonts broke even financially. It’s amazing that within ten years, the humble work of not much more than a dozen people helped generate this value, and that I’ve had the privilege to be part of it almost from the very beginning. </p>
      <p>So — let’s get back to work. As usual, there are many amazing things that we want to do! </p>
      <p>(Incidentally — I do have quite a few good friends and colleagues within Linotype and Monotype, so actually I am glad that I’ll probably have more chances to talk to them and work with them. Monopolies aren’t very welcome but fierce competition can be as damaging.)</p>
      <p>Best,<br>
      Adam</p>
