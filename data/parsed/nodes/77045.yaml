      <p>John, </p>
      <p>if you look through the SEC filing documents, you’ll discover that one of Bitstream’s stockholders is an investment firm that otherwise invests mostly in hotels and resorts, and their website advertises mostly to senior U.S. citizens. I don’t want to go into a detailed discussion about investment firms, but one simplified view of the situation can then be described like this: </p>
      <p>A number of U.S. senior citizens have put the money that they have saved over the years into an investment firm, which then bought Bitstream stock and provided capital to run the MyFonts operation. For the first few years, setting up and running MyFonts cost more money than it generated. It was those senior citizen’s risk to put their money at our disposal (indirectly, of course, through the investment firm). </p>
      <p>We could have screwed up or we could have done well. In that time, those investors saw little or no money coming in, but the employees and consultants as well as the foundries who offered their fonts for sale, have been constantly paid. </p>
      <p>In other words (in a very simplified way), for the first few years, some U.S. senior citizens financed my living (as a MyFonts consultant). I contributed labor, and I have been rewarded. It has always been my choice or right to try negotiate my payment terms. I may or may not have made use of that right. But, since I did agree, it means that I did agree. I have been paid constantly for the last 11 years for the labor I contributed. I did not need to care where this money came from. </p>
      <p>The same was truth for the other employees or consultants, and for the foundries. They have received their checks regularly. </p>
      <p>The investors, however, put their capital on risk: they had a chance of "cashing out" or they had the possibility of losing everything. (Of course, they did trade the stock between themselves etc., but at every single moment there was a group of investors whose money was being used by Bitstream to operate MyFonts, and it was their money that was at risk.) </p>
      <p>At some point, Monotype Imaging offered the $50M, and that money can now flow back to the investors. Whether it’s a big cash out or just moderate, or actually just so-so, or perhaps it’s even less that they invested — I don’t know. And I don’t care. They put their money to our disposal so we could work. Now they’re getting some money back. I actually do hope that it’ll be more than they invested. I hope that it’ll be *significantly* more than if they invested into some other business. </p>
      <p>They chose our stock. They didn’t choose Apple’s, Microsoft’s, Nike’s or whomever else’s. And for that, they should be rewarded as handsomely as it is only possible. Because, on top of our brains and time spent, and in addition to the hard work and talent of the type designers whose fonts we’ve been selling, we also owe our success to the investors, since they provided us with capital. </p>
      <p>(At any time I could have chosen to buy BITS stock, i.e. become part of the investors group.)</p>
      <p>To me it does sound like a fair deal. The investors are getting their money, the foundries have been getting theirs, and I’ve been getting mine. I think, I’ll continue to be paid, as long as I contribute my labor, the foundries will continue to be paid as long as their existing or new fonts will be attractive to the buyers, and the investors will continue to have a chance to be paid as long as they contribute their capital. </p>
      <p>I don’t see anything fundamentally wrong with the system. There are many details that are worth working on, but I do believe we need all components of the system. We need labor and we need capital. </p>
      <p>Best,<br>
      Adam</p>
