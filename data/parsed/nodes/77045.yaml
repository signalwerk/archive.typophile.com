      <p>John, there are a lot of questions that are important and too demanding to get into depth here, aside from the fact that I'm not knowledgeable enough to do it well. </p>
      <p>But two points anyway. One of the discoveries in my wife's book <a class="freelinking external" href="http://www.amazon.com/Success-Agricultural-Transformation-Isabelle-Tsakok/dp/0521717698/ref=tmm_pap_title_0" rel="nofollow">Success in Agricultural Transformation</a> is that the Left has made the mistake of thinking who owns what is the key issue. I think you're making that mistake. The mistake on the Right has been to think that income inequality doesn't hurt anything, which is also wrong in a big way. </p>
      <p>The other thing is that the minimizing the value of the services of the merchant, which I'm not sure you meant to do, but it sounded like it as Jan mentions, is wrong both economically and morally. The services are very real economically, as MyFonts in fact seems to indicate. Morally, the devaluing of the merchant, the seeing of the merchant's cut of the price of goods as an ill-gotten gain, can get very ugly. It has been used to justify riots and murder against minority merchants all around the world: Jews in Europe, Chinese in Southeast Asia, and Indians in Africa.</p>
