      <p><cite>The real question, is who is going to buy this Monotype/Agfa/Linotype/ITC/Ascender/Bitstream amalgamation?</cite></p>
      <p>That’s an interesting question. Bill Gates does not seem interested in developing the type business that Corbis acquired when it bought Veer. Steve Jobs could have done a bang-up job, but he is out of the picture. I think it’s more likely to be a small purchase by a massive holding company that wants a small but steady stream of revenue that is relatively insulated from local economic shocks. But I’m not a business guy, so my guesses would just be the obvious mammoths like Bain or Berkshire, and they’re to big to bother.</p>
      <p><cite>Si, Perhaps just a coop would be better. We make an online setup like MyFonts and each contribute a fair and reasonable percentage for operating cost.</cite></p>
      <p>Something like Vllg, but without the focus on mammoth families and editorial faces, might be a good idea. But is there someone out there who really knows how to put that together? If most type folks were great at digital retail we wouldn’t have hooked up with MyFonts to begin with.</p>
