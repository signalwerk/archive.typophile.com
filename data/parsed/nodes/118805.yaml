    html: |-
      <p>Ha! Very interesting, thanks. They were right under my nose. (Well, not really, as I'm a Mac guy.) I found a Windows 7 system to check out and they're there all right. The documents came from a Windows system and had specified some other font, but possibly through misconfiguration or transferring between systems that didn't have the font installed, the documents ended up using this system font.</p>
      <p>It's somewhat startling to see an interesting Latin font buried within a non-Latin font. From what I've seen the Latin characters of non-Latin fonts are usually a copy of something else (like Arial) or are some fairly uninteresting design. Kind of cool to find this hidden gem. It would be interesting to do a survey of other non-Latin fonts to see what Latin character designs might be there.</p>
      <p>Also interesting that this design has apparently never appeared in a Latin font. At least, not one that any of the ones that I've run across.</p>
      <p>To kthomps5, thanks for the link to whatfontis.com. I had tried WhatTheFont at myfonts.com but it didn't find it.</p>
      <p>I note that Sakkal Majalla has a regular and a bold variant. My sample is the bold. The regular looks pretty nice, too. See also: <a href="http://www.fonts.com/font/sakkal-design/sakkal-majalla">http://www.fonts.com/font/sakkal-design/sakkal-majalla</a></p>
      <p>Thanks again!</p>
