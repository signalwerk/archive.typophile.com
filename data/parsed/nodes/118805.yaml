    <p>Hi all, I'm returning here to seek your help after a long absence.</p>
    <p>This sans-serif font has many distinctive features, so many that I'd think identifying it would be a snap. However, I've spent hours poring over identifont and various catalogs and specimens and I haven't been able to identify it. Here's a representative sample:</p>
    <p><img src="/sites/default/files/old-images/VLCScreenSnapz001_6540.png"></p>
    <p>This is a frame grab from a video of a PowerPoint presentation (long story). I actually have the PowerPoint document but none of the fonts it claims it uses match this font. I've unpacked the file and it looks like there are some fonts embedded in the document. I think these are encrypted, though, so I can't extract any information from them, even the names.</p>
    <p>Can someone help? Thanks!</p>
