  html: "<p>Hello <br> <br>I'm trying to develop a logo for freelance work, to be used initially on a business card, letterhead, etc. Maybe later on a website.  <br>I would like to keep the mark type only. <br>My name is Robert King.  <br> <br>Here are four ideas. These are all in grayscale at this point... I will address color when I am closer to a final design. <br> <br>The \"KD\" stands for \"King Design,\" although as you can see from the other options, I'm flexible about how my name is listed. <br> <br>I like the 1920s-looking faces, because I'm leaning towards a non-coporate image, but I tried a variety here to get some reactions. <br> <br>The fonts are, in order: Adobe Garamond, Bitstream Clarendon Light, Toot Sweet and Bergling Fantasia, both by Nick Curtis. <br> <br>Any comments would be much appreciated. <br> <br>Thanks, <br> <br>Rob <br> <br><img src=\"http://www.typophile.com/forums/messages/29/22932.jpg\" alt=\"clarendon\"><img src=\"http://www.typophile.com/forums/messages/29/22933.jpg\" alt=\"garamond\"><img src=\"http://www.typophile.com/forums/messages/29/22934.jpg\" alt=\"toot sweet\"><img src=\"http://www.typophile.com/forums/messages/29/22935.jpg\" alt=\"bergling\"></p>"
