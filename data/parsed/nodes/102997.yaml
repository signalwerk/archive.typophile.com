      <p>Hard to say, very generic and not many letters. Part of this soft sans with blunt corners (which actually could be the result of a post-treatment), that could be a lot of things even totally done from scratch. Their own actual corporate typeface is <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/avenir" rel="nofollow">Avenir</a>, they may even have started with it.<br>
      Some more, same ballpark, rounded or not, fitting only for /k, /v and /i: <a class="freelinking external" href="http://www.myfonts.com/search/daxline" rel="nofollow">FF Daxline</a>, <a class="freelinking external" href="http://www.myfonts.com/search/handel" rel="nofollow">Handel Gothic</a>, <a class="freelinking external" href="http://www.myfonts.com/search/klavika" rel="nofollow">Klavika</a>, <a class="freelinking external" href="http://www.myfonts.com/search/univers" rel="nofollow">Univers</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/unit" rel="nofollow">FF Unit</a>, <a class="freelinking external" href="http://www.myfonts.com/search/signa" rel="nofollow">FF Signa</a>, <a class="freelinking external" href="http://www.myfonts.com/search/strada" rel="nofollow">FF Strada</a>, <a class="freelinking external" href="http://www.myfonts.com/search/sari" rel="nofollow">FF Sari</a> (nicely rounded but many redrawing/adjustments needed), <a class="freelinking external" href="http://www.myfonts.com/search/neuzeit" rel="nofollow">Neuzeit DIN and S</a> (Soft Rounded <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/neuzeit-office-soft-rounded/" rel="nofollow">here</a>), <a class="freelinking external" href="http://www.myfonts.com/fonts/primetype/notes-soft" rel="nofollow">Notes Soft</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/hermes" rel="nofollow">Hermes FB</a></p>
