    <p>I’m trying to find out if anyone else remembers a one-panel newspaper cartoon from the late 1960s or early 1970s in which the characters were, well, “characters.” That is, they were letters and numbers who spoke, and the joke was that they were puns about themselves. There was no continuity from day to day, just a different pun about the characters depicted.</p>
    <p>A couple that I recall:</p>
    <p>There are two capital letters, and the one on the right (a <strong>G</strong>, I believe) has a subscript <strong>2</strong> next to it. The letter on the left says, “Hey, George. Who’s the cute little number?”</p>
    <p>A lower-case <strong>e</strong> is speaking to an <strong>ê</strong> with a circumflex, wearing it like a hat. The <strong>e</strong> says to <strong>ê</strong>, “I like it. It’s got a certain <em>je ne sais quois</em>.”</p>
    <p>Am I imagining this, or does anyone else remember this cartoon? I would love to find examples of it.</p>
