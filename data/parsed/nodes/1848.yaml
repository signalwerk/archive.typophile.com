    html: <p>&gt;How new is new? <br> <br>What I am interested in is primarily typefaces based on original ideas, designed within the last decade, eg Base. <br> <br>Stuff that ain't retro --- suitable for the 21st century. Or any other century, but in a parallel universe (eg Dalliance, or as Tiffany suggested, Sebastian). <br> <br>The deconstructed "New Typography" era is over, so what does "new" mean now? <br></p>
