    html: <p>BTW, the only time it's bad to rebuild the kern feature is if you've edited the kern feature code directly in the OT Panel or have generated it outside of FontLab (using something like Metrics Machine, for instance). Rebuilding the kern feature will wipe out whatever you've done, replacing it with whatever happens to be in the kern table.</p>
