  html: |-
    <p>I keep changing things within the kerning and whenever I generate a font, it asks me if I want to rebuild the kern feature.</p>
    <p>Sometimes, I get the dialog box when generating the OTF font file at the end of the exporting process... and that's when it freezes the program. the only safe way I can rebuild it is to rebuild it within the opentype window and then generate the font.</p>
    <p>I'm afraid i'm damaging the font?</p>
    <p>Any suggestions would be greatly appreciated</p>
