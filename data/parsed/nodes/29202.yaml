    html: |-
      <p>&gt;&gt; Indesign, which is only available for OS X<br>
      InDesign is, and always was, available for Windows as well.</p>
      <p>from InDesignCS2 Help:<br>
      "Print Visible Guides and Baseline Grids<br>
      Prints visible guides and grids in the same color as shown in the document. You can control which guides and grids are visible in the View menu. This option is unavailable when you are printing separations."</p>
      <p>This option is also disabled when you choose Postscript File as Printer.</p><div class="imageWrap"><img src="http://typophile.com/files/PSFile_3872.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/PSPrinter_4028.gif"></div><p></p>
