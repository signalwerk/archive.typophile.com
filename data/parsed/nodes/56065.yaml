      <p>Hmm… if by any chance the font we're looking for is the one used in the logo of Café Casablanca: There's a PDF on the site* that lists the font as "Casablanca", which would most likely mean it's a custom job. That, or a bad case of <a href="http://www.flickr.com/groups/ltypi/">LTypI</a>. :-)</p>
