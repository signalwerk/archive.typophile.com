  html: "<p>Ok, nothing fancy here, just a school assignment.. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">  <br> <br>We're supposed to come up with a mark (black/white) for a travel agency specialized in time travel. The name is to be a combination of the letters S, T and O and it has to be set in Futura (how's that for originality). No arbitrary design decisions, every single shape needs to be there for a reason. <br> <br>Our instructor told us to keep this quote in mind: \"A logo is a good logo if you can draw it in the sand with your toe\". <br> <br>So this is what I have now, it's an hourglass with the sand flowing upwards (as in going backwards in time): <br> <br><img src=\"http://www.typophile.com/forums/messages/29/40718.gif\" alt=\"\"> <br> <br>I wanted to keep the whole thing pretty clean and loose, so I went for bold shapes and emphasized the negative space.. I tried to echo the O's shape in the pictogram, and the lower curve is supposed to continue the flow of the S. I'm not sure about the line weight of the two curves.. I did make them thicker at one point but that kind of destroyed the image of the hourglass..  <br> <br>Any suggestions?</p>"
  html_clean: "<p>Ok, nothing fancy here, just a school assignment.. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">  <br> <br>We're supposed to come up with a mark (black/white) for a travel agency specialized in time travel. The name is to be a combination of the letters S, T and O and it has to be set in Futura (how's that for originality). No arbitrary design decisions, every single shape needs to be there for a reason. <br> <br>Our instructor told us to keep this quote in mind: \"A logo is a good logo if you can draw it in the sand with your toe\". <br> <br>So this is what I have now, it's an hourglass with the sand flowing upwards (as in going backwards in time): <br> <br><img src=\"http://www.typophile.com/forums/messages/29/40718.gif\" alt=\"\"> <br> <br>I wanted to keep the whole thing pretty clean and loose, so I went for bold shapes and emphasized the negative space.. I tried to echo the O's shape in the pictogram, and the lower curve is supposed to continue the flow of the S. I'm not sure about the line weight of the two curves.. I did make them thicker at one point but that kind of destroyed the image of the hourglass..  <br> <br>Any suggestions?</p>"
