    html: <p>I would, but I don't think we're allowed to modify the letter shapes.. It's a pretty restrictive assignment. I'd love to marry the pictogram to the type and play around with the letterforms, but I don't think we're meant to. <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"> <br> <br>Then again, I think I did attempt to combine the O and the hourglass in an early sketch, but that got too cluttered.. <br> <br>Thanks for the input! </p>
