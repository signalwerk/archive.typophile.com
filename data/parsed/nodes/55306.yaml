      <p>For the "g", the top of the bottom bowl can be moved up to arrive at a better balance of proportions. But there are issues of polish as well, like the inside of the top bowl is not very circular - it's more like a fat diamond, and the curve widths seem inconstant. The "diamond" problem is repeated in the "o", and other glyphs have similar problems. Also in the "g": the ear is too long.</p>
      <p>hhp</p>
