      <p>Hi there, first i would like to say thanks to the responses that we had.<br>
      To explain the initial idea for this font, this is not for a paid client, it has born from the major interest that 3 persons from the studio, have in typography, and would like to improve their knowledges and after some hard study and investigation, we started to do a font that somehow represented a bit of each of us, we have take some nordic inspiration, and without doubt FF Signa was a major one(of course without the intend of beeing a clone), FF Max, Etelka from StormTypeFoundry, and some portuguese from Dstype.<br>
      Our major intent is to be a text font, readable and modern with some "cool" feeling behind it.</p>
      <p>Answering to Altaira and Bendy (thank you :) ), the mirrored "p,b,q,d" it really needs more atention and perhaps with would work better with a little diferences between them.</p>
      <p>The "g" was the last letter to be drawn, and it was a headache, first he've tried what seems logical to us a shape that was a "q" with a tail, but somehow with seemed that it didn't work, so we've tried to do it in this way, any suggestions??!!!!, should we persue the this"g" or the other one???</p>
      <p>Regarding the "o" we really like the "openness" of it, but we will try to balance it with the rest.</p>
      <p>Thanks to all and keep on touch, we will be on workin.</p>
      <p>Our best regards</p>
      <p>Prpa</p>
