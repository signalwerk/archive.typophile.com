      <p>On the 'o' and 'g'; the 'o' needs to be more square, basically like the 'c' but closed off, so to speak. The same goes to the top of the 'g', it is too circular, it needs to be more angular to fit with the rest of the characters.<br>
      I also think the same could be said for the 's'. While it is a rather nice 's' on itself, I don't think it fits particularly well with the overall design. Just like the 'o' and 'g', it is too smooth. Take a look at <a class="freelinking external" href="http://new.myfonts.com/fonts/jan-fromm/camingo/" rel="nofollow">Camingo</a>, or some of the other examples that have been mentioned, to see how these issues were solved.</p>
      <p>The right stroke of the 'y' seems to be too heavy. You have to turn this around, the left stroke should be the heavier one.</p>
      <p>The ear of the 'r' starts way to low in my opinion. This one seems to be made with a sliced off 'n', but really you should see it as a completely seperate shape. Take <a class="freelinking external" href="http://www.typeworkshop.com/type-basics/typebasics-17.jpg" rel="nofollow">this image</a> as an example (exerpt from Underware's Type Basics). The ear of the 'r' works best if it starts somewhere in the range 1/2 or 3/4 of the stem (so 2/3's could also work, etc.).</p>
