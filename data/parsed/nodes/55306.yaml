      <p>I feel like writing a long post. :-)&nbsp;&nbsp;Though I'm only a beginner so please take my comments with a large grain of salt.</p>
      <p>This looks interesting, even though it's positioning itself in a rather densely populated genre. For instance, a few glyphs (especially the "e") instantly reminded me of Etelka. It might be quite fruitful to do some research in this genre (if you haven't done so already).</p>
      <p>To give deeper / more meaningful feed-back, it would be good to know what purpose you have in mind for this – is it intended for display, or text sizes?</p>
      <p>My main impression – especially if this is not only meant for large sizes – is that it's very "graphic design-y", which mostly means there are a lot of identical shapes. I wonder if that is intended; and even if it is, I doubt it'd work at least in smaller sizes. </p>
      <p>For one thing, the "b", "d", "p", and "q" look like they might all be the same shape, mirrored / rotated; I tend to think the "b" and "p" are working better – the "d" and "q" look "flipped" to me. Similarly, the "u" seems to be a rotated "n" – and looks slightly too wide as a consequence. </p>
      <p>What you have here is an interesting idea, but I believe it could grow to be much more if you are ready to dive deeper into the intricacies of type design, where it departs from the simpler/straighter (IMHO) premises of graphic design.</p>
      <p>Some detail impressions:</p>
      <p>I'd try a monocameral "g". This one seems out of character (and even if one accepts the basic premise for a second, I'm not sure the tail works).</p>
      <p>"k": It does look nice, but may be out of character in this font. Have you tried a double join? Or maybe one with a crossbar?</p>
      <p>At least if this is going to be a text face, the joins on the "n" and "m" may be too high.</p>
      <p>The "o" is way too round. </p>
      <p>The "s" looks pretty nice – congrats. Though it may have a hair too much weight in the tight curves, especially the bottom-right. I believe the usual way to do it is to put the most weight on the spine.</p>
      <p>There's something slightly off-putting about the "x"; then again, I haven't figured the "x" out myself so I can't really say why. Perhaps it's too narrow?</p>
      <p>I like the "y" a lot, especially the join.</p>
      <p>Is the diagonal of the "z" a bit too heavy?</p>
      <p>Keep us posted. :-)</p>
