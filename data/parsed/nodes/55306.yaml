      <p>Hi,<br>
      I agree with some of Nina's observations, thought the pbdq thing was unexpected.<br>
      I agree there's a whole lot of other fonts in the square sans genre these days so if you want to market this you'll need to be definite about making it different.<br>
      My initial feelings were about the g,u and m. The g needs reconsidering. The bowl is too round and the tail is a bit flat. u needs a higher join, and the mnr could be lower as Nina said. m looks too wide to me.<br>
      a and c don't quite harmonise because c is curved on top and a looks straight.<br>
      I think the traps on vwy should carry over to z. The round shapes could do with more overshoot.<br>
      Again, I'm not very advanced in fontmaking so feel free to add more salt... :)</p>
