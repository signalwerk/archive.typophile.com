    <p>Hello all.</p>
    <p>Here is a design by Mucca and I'm aware that they do a lot of their own type design. I'm hoping it isn't the case for this design because I could use this font/style for a project that requires a "Frenchy, not entirely art nouveau, storefront sign" font. </p>
    <p>Any ID or other suggestions would be most helpful.</p>
    <p>Thanks in advance,</p>
    <p>RTT</p>
