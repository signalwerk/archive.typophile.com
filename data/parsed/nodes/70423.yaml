      <p>It probably is custom work, but <a href="http://new.myfonts.com/fonts/redrooster/schiller-antiqua-rr/" rel="nofollow">Schiller Antiqua</a> is somewhat similar in the heavier weights. The T would need the most tweaking, but you could approximate this with layering.</p>
      <p>I'm still looking for something closer. Perhaps at Letterhead Fonts.</p>
      <p>- Mike Yanega</p>
