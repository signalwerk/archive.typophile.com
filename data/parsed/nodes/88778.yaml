    html: |-
      <p>Ramiro: ‘<em>Please, keep us updated about it.</em>’</p>
      <p>Hallo Ramiro, I deﬁnitely will do this.</p>
      <p>Nick: ‘<em>What about HintMaster […]</em>’</p>
      <p>We don’t have a separate autohinting tool. The ones included in the FM tools are very good though; the cradle for the hinting technology stood in Hamburg at URW, after all. A couple of years ago (I think it was in Frankfurt) Miguel Sousa and I compared Adobe’s Type1 hinter with the URW++ one, and I recall that Miguel was impressed. When it comes to TrueType hinting, the IKARUS-based tools are also very good. But, again, we don’t have a separate hinting tool –at least not at this moment.</p>
      <p>Richard: ‘<em>The only thing missing is the comparison to the feature sets of the other products on the market.</em>’</p>
      <p>I will see if we can improve the information on this. Over the years we organized exclusive FM conferences in ’s-Hertogenbosch, The Hague, and Hamburg, and also almost every year FM sessions at the ATypI conferences (which we sponsor also every year), where the functionality was discussed. So far, we did not receive many invitations for other conferences on font technology. Our experience is, that the majority of people interested in our products have an IKARUS background and are technically very savvy. And I must underline here that all the DTL/URW++ products are developed for internal use in the ﬁrst place anyway.</p>
      <p>Richard: ‘<em>BTW - I am ASSUMING that demo versions of all are available?</em>’</p>
      <p>Yes, you can download these from the <a href="http://www.fontmaster.nl/english/downloads.html" rel="nofollow"> <em>DTL FontTools</em> web site</a>.</p>
      <p>FEB</p>
