    html: |-
      <p>I found this: </p>
      <p>"Not the macro, but FontLab Studio. All you have to do is to activate flexhint generation in the FontInfo dialog of FLS (Not in the options dialog!). FLS will add the flexhinting. Note, that this will not destroy the autohinting from the macro! There is no disadvantage with regard to the macro. Just use the bug fixed version, because then you can choose, if you want to generate hints with or without replacement.<br>
      If you want to convince yourself, just autohint your font one time with the macro (with activated flexhint option) and one time from the command line (with flexhint option). Then decompile the name table of both font files with TTX and compare them with the help of a program like UltraCompare.|</p>
      <p>From: <a href="http://forum.fontlab.com/hinting/importing-hints-from-compiled-fonts-to-fontlab-t7793.0.html" title="http://forum.fontlab.com/hinting/importing-hints-from-compiled-fonts-to-fontlab-t7793.0.html">http://forum.fontlab.com/hinting/importing-hints-from-compiled-fonts-to-...</a></p>
