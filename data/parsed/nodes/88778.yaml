      <p>Richard: ‘<em> […] one-page summary of DTL's product line […] the main strengths simply stated.</em>’</p>
      <p>Currently we have the following range of products (I cut and pasted some of the following texts from the DTL web sites):</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<strong>DTL FontMaster suite</strong><br>
      DTL FontMaster is a set of utilities for professional font production. It includes a module for designing and editing letters in beziér format (BezierMaster), interpolating fonts (BlendMaster), testing and correcting glyph contours (ContourMaster), generating and converting font formats (DataMaster), the editing of the IK format (IkarusMaster), generating and editing kerning pairs (KernMaster) and scanning and auto-tracing letters and logos (TraceMaster).<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;DTL BezierMaster, DataMaster, and IkarusMaster contain the modiﬁed URW++ version of Adobe’s Hatch Open Type (HOT) tool, which is also part of OTM. This means that the character set does not have to match the characters listed in the OpenType Layout features ﬁle, because all features that are not covered by the character set will be removed automatically (‘subset’) during compiling. All FM modules are batch-oriented.</p>
      <p>FM is currently only available for Windows. Newly programmed versions of a couple of the listed modules will become available for OS X, to start with KernMaster 2012 this year. Perhaps we will make a separate module for manual digitizing under Mac OS X, which IkarusMaster currently supports for Windows.</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<strong>DTL OTMaster</strong><br>
      This is a sort of Swiss knife for OpenType and TrueType fonts. One can use the application on a relatively simple level for altering for instance name tables or for adding, removing, or editing glyphs. Because of the modiﬁed HOT tool, it is also very easy to generate OT layout tables using an ‘all covering’ features ﬁle.<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;OTM can also be used for entering and altering the guts of .otf and .ttf fonts, for editing mark positioning using a GUI (one could for instance import an existing feature ﬁle for for instance Arabic, and subsequently put the marks on their appropriate places)</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<strong>DTL CompareMaster</strong><br>
      A small program for comparing the metrics, hinting, and contour data of OTF with OTF, OTF with Type1, and Type1 with Type1 fonts. The contours (showing the differences) can be plotted as PS files.</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<strong>DTL LetterModeller</strong><br>
      This gives you some idea of a future program for parametrized type design and font editing, which we are working on.</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;FEB</p>
