    <p>Hi there,</p>
    <p>I've been making some experiments with the AFDK 2.5 autohinting and I rather like its outputs.<br>
    Problem is it autohints .PFA or OTF files and I would like to have these hints in my FL (or UFO) masters.<br>
    Is there a way to export the AFDK generated hints in the OTF font back to my FL master file?</p>
    <p>Thanks in advance.</p>
    <p>R.</p>
