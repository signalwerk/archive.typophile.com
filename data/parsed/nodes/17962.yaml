    <p>Hello,</p>
    <p>Sorry about creating a new forum topic, but I am not sure how<br>
    to add pics to the message after you create a new topic.<br>
    If someone could inform me on how to do that would be great.</p>
    <p>I have gone back and made more changes to my typeface.<br>
    I smoothed out alot of the curves and I also thickened up a lot of<br>
    the horizontal bars. That definetly made it feel better on paper.<br>
    I also added an alt version with no desending serifs. Also please<br>
    excuse the spacing on some of the letters. I forgot to<br>
    do that last night.</p>
    <p>Let me know what you think.<br>
    Thanks!</p>
