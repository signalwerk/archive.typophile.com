    <p>hello!<br>
    i’m designing this new logo for caldea, an asiatic textile import/export italian factory; they ask me for something warm and something that remembers home (the textile they import is almost for house uses.)</p>
    <p>this is the solution i gave and they liked it, but they want it to be more similar to textile...do you have any suggestion?</p>
    <p>and also, they ask me if i could use the logo as a part of the name, instead of the last “a”. do you think it could be better o could work better?</p>
    <p>any other suggestion, comment and critique is apprecieted!!</p><div class="imageWrap"><img src="/files/caldea004_3835.png"></div><p></p>
