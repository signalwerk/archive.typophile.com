    html: <p>I’m by no means qualified to critique this, but I can say that as a viewer/reader, I find the mixture of lower case characters with the barless “A” characters difficult to deal with. I guess my brain is making the quick assumption that all the letters are lower case, and I interpret the “A”s as “n”s. I can also say that I do find the colours and serifs feel warm (I guess fitting with the thermal connotations of the name) and mature.</p>
