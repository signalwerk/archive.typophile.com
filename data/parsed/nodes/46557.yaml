    html: |-
      <p>Definitely no Rotis, Trajan, or thin Helvetica for this project  :)  Although, I was quite tempted by some of the Egyptian serifs.</p>
      <p>I’m currently working on the Adelto branding project, and appreciate all of your comments/criticisms. I ended up deciding on FF Cocon for the type. I think it has great potential and is not used as often.</p>
      <p>The colour scheme is indeed a work in progress. My first idea was the following:</p>
      <ul>
      <li>Vivid aqua blues, samples taken from ocean shots</li>
      <li>Aluminium metallic shades</li>
      <li>Woody browns, more finished and polished</li>
      <li>Charcoal greys and dark greys</li>
      </ul>
      <p>I’m now leaning more towards brighter reds as the highlight colour, but will need to do more basic mock-ups before finalising.</p>
      <p>The range of products and services on offer is quite diverse, so I’d like to keep the palette fairly natural, with one main highlight colour.</p>
      <p>I’ll look forward to hearing more input from you guys as this progresses. </p>
      <p>Cheers</p>
      <p>Trev</p>
