    html: |-
      <p>First off, I’m so glad you didn’t go with Rotis or Helvetica. And I like this font choice, however it’s a very now style versus a timely style... but if the majority of your product is modern, I don’t think that’ll be much of an issue. </p>
      <p>How does the logo look in simple 2D black and white, with out all the gradients. This should be the first step, making sure the silhouette and shapes are appealing before adding “style-effects”. You’ll get a lot of grief from the designers on this site for having gradients in your logo, so expect that. Also it’ll be easier to critic as far as letter spacing and kerning are concerned.</p>
      <p>All in all, it’s nice and simple.</p>
    html_clean: |-
