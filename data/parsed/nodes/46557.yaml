      <p>I like the overall look.  Like you say, colours have to be finalised, but I like it.  The only thing I would say, is that because of the modern look of the typeface it doesn’t give the immediate impression of “...the upper end of the luxury market”, but that’s solely based on the usual formulae that some high end companies tend to go for more austere serif fonts(in my experience) like Times New Roman etc.  But then these conventions should be challenged from time to time.  Like it!</p>
      <p>JH</p>
