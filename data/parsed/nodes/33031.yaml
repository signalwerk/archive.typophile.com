      <p>You can link directly to fonts at Fontshop, and you can even set type and point size for your links. See <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_meta_bold/&amp;sample_text=Student%20Centers&amp;sample_size=36" rel="nofollow">here for 'Student Centers' in Meta Bold</a> and <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_scala_regular/&amp;sample_text=Student%20centers&amp;sample_size=36" rel="nofollow">here for 'Student centers' in Scala</a>. </p>
      <p>Linking to FontShop isn't new, but they've just changed it so that when you 'Generate Sample' for custom text, a link appears under it that says 'Link to this Custom Text.'</p>
