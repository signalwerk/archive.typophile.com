    <p>Anyone know this one? It looks to have been widely used for Canadian newspapers circa 1910s(?) to atleast the 1930s and maybe even 1940s and 1950s. Chalet Comprime is close, but not quite it (though I fear it may the be the closest).</p>
    <p>Thanks!</p>
