    <p>Hi all,</p>
    <p>Here’s an excerpt of a typeface which I can’t identify. Sometimes I think it’s a kind of Garamond, but the j’s are too different. Does anyone recognize this font?</p>
    <p>It’s a scan from a Dutch translation of Dante’s Divine Comedy, by Primavera Pers, Leiden,  published in three parts around 2000.</p>
    <p>Thanks in advance.</p>
    <p>Marcel</p>
