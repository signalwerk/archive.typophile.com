      <p>Thanks, Peter. This is one of the clearest expositions of your ideas that I have read.</p>
      <p><em>Explicit labeling would be fatal, because it introduces the “[phonological] disambiguation overhead” issue, which some learners can get hung up on to the point of developing enduring reading difficulties.</em></p>
      <p>Fatal seems too strong a word. The fact that some readers get hung up on phonological disambiguation means that this issue is, in fact, introduced -- presumably strongly in the case of some learning methods --, but on the other hand only <em>some</em> learners have difficulty with it.</p>
      <p>Of course, phonological disambiguation isn't an issue at all for the baboons, since they neither associate the visual objects with sounds nor with meaning. 'Bear' and 'Fear' are simply like-arrangements of sub-word objects to the baboons.</p>
    html_clean: |-
      <p>Thanks, Peter. This is one of the clearest expositions of your ideas that I have read.</p>
      <p><em>Explicit labeling would be fatal, because it introduces the “[phonological] disambiguation overhead” issue, which some learners can get hung up on to the point of developing enduring reading difficulties.</em></p>
      <p>Fatal seems too strong a word. The fact that some readers get hung up on phonological disambiguation means that this issue is, in fact, introduced -- presumably strongly in the case of some learning methods --, but on the other hand only <em>some</em> learners have difficulty with it.</p>
      <p>Of course, phonological disambiguation isn't an issue at all for the baboons, since they neither associate the visual objects with sounds nor with meaning. 'Bear' and 'Fear' are simply like-arrangements of sub-word objects to the baboons.</p>
