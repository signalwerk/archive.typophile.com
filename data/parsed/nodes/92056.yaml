    html: <p>Ryan, the notion that we recognise <em>whole</em> word shapes isn't given credence by anyone familiar with reading research. The open question is whether we recognise words by building up from letters or from combinations of letter features across the word. In this forum, I tend to argue the letterwise side, mainly because the most interesting and knowledgeable contributors to discussion make the case for various kinds of feature arrangement recognition.</p>
