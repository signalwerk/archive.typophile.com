      <blockquote><p>How is distinguishing learned letter groups from unlearned ones anything like reading?</p></blockquote>
      <p>That's not what happened. In the learning phase, the baboons were exposed to sets of words and non-words, but in the testing phase they were exposed to <em>different</em> sets that they had not seen before. So what they were demonstrating was the ability to recognise patterns in how letters are ordered or not ordered in English words, what the researchers call orthographical processing. It doesn't surprise me that this level of orthographical processing is independent of language knowledge, because I can easily tell the difference between, say, real Russian text and random arrangements of Cyrillic letters, even though I can't read the language. But I am surprised -- and delighted -- that baboons can do the same sort of thing, especially since they're primates that are not even in the hominid line, which means that a shared perceptual functionality that makes this possible must have evolved an incredibly long time ago.</p>
      <p>The comments at the end of the article seem misleading, though, or at least poorly expressed. 'Recognising the entire word'? If anything, in this regard, the study suggests that what is being recognised is patterns derived from letter ordering principles. Entire words can't be being recognised because the baboons don't know the words. What they are recognising is patterns of letters that correspond to learned rules.</p>
