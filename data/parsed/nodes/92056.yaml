      <p>[John] “Do you think there is any way to isolate 'across-the-word feature-conjunction' patterns from letter ordering patterns in a way that would make it possible to test the functional distinction?”</p>
      <p>I think to do this effectively we first need to compare quantitatively the potential supercapicity benefits (because of interfacilitation) that would attach to redundancy when calculated at a letter level versus at a role-unit or sub-letter feature level. If these turn out to be distinct values, fits to performance variance in Word Superiority Effect tasks could be decisive, provided quantification of Word Superiority Effects could be made sensitive enough. Because of the limitations of screen refresh rates, actual tachistoscopes would need to be used.</p>
      <p>Interfaciliation usually isn't in the picture in most models of perceptual processing in words, because channel independence at a feature and letter level is widely assumed. Role units, as distinct from both features in a strict and primitive sense, and letters, aren't even recognized.</p>
