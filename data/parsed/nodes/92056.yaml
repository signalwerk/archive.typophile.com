      <p>Peter, yes, that alternative explanation is possible, as it is for human reading. Of course, the baboons are performing a different task than the human reader: they're not recognising words as semantic objects, they're only distinguishing between patterns of ordering, which is something that the human reader has to do too, but only as a sub-task process. In the past, we've posited super-letter pattern identification as an efficiency, something that makes it possible for us to get to where we really need to be, which is word recognition, faster than letterwise recognition. The baboons, it seems to me, don't need that efficiency, recognising patterns in letter order is where they need to be to complete the task. And I'm not convinced that 'word-specific trans-glyphic featural patterns' are more 'ecologically valid' as extensions of Brincat &amp; Connor's findings than, say, starting from even lower level, intra-glyph feature recognition, e.g. recognising the relationship between stem and bowl in /b/ as constituting a distinct object, then distinguishing the order of that object in a sequence such as 'blob' from a sequence such as 'lbbo'.</p>
      <p>Do you think there is any way to isolate 'across-the-word feature-conjunction' patterns from letter ordering patterns in a way that would make it possible to test the functional distinction?</p>
