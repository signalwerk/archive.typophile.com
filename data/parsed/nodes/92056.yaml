      <p>John, perhaps fatal is too strong a word.</p>
      <p>My view is that phonological awareness is a necessary and important part of reading literacy. And phonological mapping is a strategy we use almost automatically whenever we encounter (are stopped by) an unfamiliar word. </p>
      <p>In reading acquisition we are taught a letter-wise, or bi-gram or tri-gram, etc., parsing of the word which sets up, so it seems to me, a parallel letter recognition / interactive activation-based processing architecture and neural representation.</p>
      <p>Repeated exposure in a typographical spacing environment where there is 1) a distinctive narrow phase alignment that avoids auto-correlation in the vertical parts of strokes as well as distracting harmonics, and 2) rhythmic cohesion in the whites, creates a situation where, with non-word letter clusters, short-exposure foveal crowding would normally occur, but also — and because of the potential crowding — provides, in orthographically legal wards, a catalyst for a perceptual learning process that remaps words at a more primitive (than orthographic) visual level, the level I'm calling the role-unit level. Synaptic interfacilitation replaces interactive activation here.</p>
      <p>We don't in my opinion arrive at effortless immersive reading until this remapping occurs.</p>
      <p>So perfect spacing is beneficial to the development of skilled readers. For the rapid, automatic visual word-form resolution of skilled readers, though, explicit labelling at a letter level by the visual system, such as is encouraged in reading acquisition, can disturb the immersive reading process.</p>
