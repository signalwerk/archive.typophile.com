      <p>I don't think you need to design that many different things; you try to design things that strike a balance of: what the current "average" bouma is for that word*; and what the bouma <em>should</em> be, to maximally diverge it form others. The balance you strike depends on: how progressive you want the font to be; and how quickly bouma familiarity is actually gained...</p>
      <p>* Which is why a descending "f" in an Italic is bad.</p>
      <blockquote><p>would broom and bloom have the same shape?</p></blockquote>
      <p>No, but the deeper into the -increasingly blurry- parafovea, the more the boumas will converge. In fact this example is one small pointer to the need to make the "el" more than just a dumb stick (and the "r" wider than might seem to make sense on a formal, deliberative level). But that's just one pair of words; we're supposed to be worrying about entire lexicons...</p>
      <p>hhp</p>
