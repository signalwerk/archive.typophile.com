      <p>I think ‘building up’ is a misleading metaphor. The visual cortex works on the principles of learned responsiveness and task optimizing channeling. It doesn't ‘rebuild’ the letters inside the brain out of tiny bytes supplied by rods and cones. With it's tuning mechanisms and form-resolution capabilities, the visual cortex (a many-layered thing) <em>connects</em> us dimensionally to the marks on the page in the way that best supports the tasks we need to do with these marks. </p>
      <p>I like to say that in humans in the visual cortex, for material in the uncrowded foveally centered span, there is responsiveness to role-units, their local combinations (to form letters) and their across-the word distribution. These configurations of role units in local combinations and word-specific distributions are what the brain has 'representations’ for, for familiar words. Responsiveness to local combination accounts for the fact that we see words as lettered things, but <em>without explicit labeling</em>. As Edmund Burke Huey argued in 1908, there is an inhibition of incipient recognitions for letters. </p>
      <p>Explicit labeling would be fatal, because it introduces the “[phonological] disambiguation overhead” issue, which some learners can get hung up on to the point of developing enduring reading difficulties.</p>
      <p>‘By-parts’ or letter-wise processing imagines a chunking process that tends toward explicit labeling at a letter level, as a process where connected role-units are processed in hermetically-sealed slots or independant channels with no opportunities for across-the-word interfacilitation between role-units while the processing is going on, just (a computationally less efficient) interactive activation in hierarchical schemes.</p>
      <p>While the human visual cortex learns a kind of role-unit-analytic processing in writing and forms distributional mappings at this level from repeated exposure during reading acquisition (which is largely and properly ‘phonological awareness’ based), I believe baboons stick with a kind of feature-analytic processing such as Frank Smith described, that responds to patterns of features properly so-called. Features are things like disturbed or undisturbed expressedness, or closure / absence of closure, in forms with round or oblong envelopes; aspect or extendedness, when it comes to items with lack of curvature. In printed words, configurations of these types of features make up distinctive patterns which can become familiar, to the point where similarity can be assessed, even by species without humanoid language capabilities.</p>
