      <p>I think this is a perfect case of fair use. You’ll be copying one page, the copying will not affect the sales of the remnants of ATF. If this is a noncommercial, educational work, it’s even better.</p>
      <p>Go <a class="freelinking-external" href="http://en.wikipedia.org/wiki/Fair_use">here</a> for details.</p>
      <p>Considering how unpredictable the courts are in judging cases of copyright infringement, many publishers ignore the fair use option and just don’t print things for which permission was not granted even if they perfectly meet fair use criteria.</p>
