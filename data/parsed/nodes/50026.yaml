      <p>I am not an expert of US copyright law, but I know from German copyright law that copyright period calculations are often tricky. As regards the calculations by Mr. Kentlaw concerning pre-1978-US-works it seems to me that his calculations are not correct.</p>
      <p>see <a href="http://www.copyright.gov/circs/circ15a.pdf" title="http://www.copyright.gov/circs/circ15a.pdf">http://www.copyright.gov/circs/circ15a.pdf</a></p>
      <p>Furthermore, calculations start on the 1st of January of the following year, so that the work (given that Mr. Kentlaw’s assumptions are correct) would fall into public domain on the 1st of January, 2010.</p>
