    <p>I’m trying to figure out some details regarding getting permission to an image of a page from the 1934 ATF specimen in a revival of a typeface. First, is there even anyone to get permission from? Second, has anyone ever checked to see if ATF even bothered to renew the copyrights for it’s books? Last, I feel that if I reprint a single page for the purpose of comparing letters on it with a revival I’m covered under fair use. Does anyone disagree?</p>
