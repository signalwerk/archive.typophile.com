    html: |-
      <p>The copyright on the 1934 work is long expired and cannot be renewed.</p>
      <p>When ATF was auctioned off, the name and all rights associated with it went up for bid. Despite all the tear shedding one reads about this auction, it is my understanding that NO ONE bid on the rights. Kingsley’s digital font realm dissolved some time before the auction of the physical plant itself. There may be trademark rights etc still valid for licensing purposes but you are free and clear to reproduce whatever you want from the 1934 specimen catalog. My god, the BB&amp;S catalog is completely digitized and available on ebay for $25.</p>
      <p>Gerald</p>
