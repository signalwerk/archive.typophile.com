      <p>Ah yes, right. I believe it was the so-called “Mickey Mouse” statute of 1998 that extended the second term by another 20 years. The copyright reference that I generally use is from 1997, so I’d forgotten about that.</p>
      <p>James, I guess you’ve got to wait another 20 years before you’re in the clear (thanks to Sonny Bono). Assuming that ATF renewed the copyright in 1962, that is.</p>
      <p>All of this sidesteps the question of whether what’s being proposed is fair use. Which it very well might be. But I am not a lawyer and would not presume to advise in this regard. </p>
      <p>— K.</p>
