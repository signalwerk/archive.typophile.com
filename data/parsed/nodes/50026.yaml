      <p>For works created before Jan 1978, the maximum duration for U.S. copyright protection is 75 years from date of publication, assuming all renewals were filed in a timely fashion. </p>
      <p>So, for the 1934 ATF specimen, if you wait a couple more months to publish your comparison, you’re home free.  Fair use or not. ;-)</p>
      <p>— K.</p>
