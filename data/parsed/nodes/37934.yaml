  html: <p>At the end of Wheel of Fortune this evening, Pat and Vanna were talking about their favorite fonts and Vanna said she uses Arial and Helvetica. Ok, so I am slightly embarrassed to admit that I was watching The Wheel, but it is worth public ridicule to bring this to the attention of typophiles everywhere.</p>
