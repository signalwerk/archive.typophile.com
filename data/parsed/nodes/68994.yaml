      <p>Hi everyone,</p>
      <p>Thanks for the responses.</p>
      <p>I just wanted to clarify first of all that I do understand a logo is more than a pretty font. There is more to this logo, which has been removed as I'm not quite ready to reveal it to the world (and I'm sure the client would prefer it this way, too). Also, the serif on the k is a side effect of my very lazily removing parts of the logo so that the focus could be on the type. So long story short - this isn't the logo, just the type ripped out of the logo.</p>
