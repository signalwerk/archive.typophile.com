      <p>after staring the same piece of work for too long, I find It helps to turn it upside down and look at it from a distance, so you are just looking at the relationships of the shapes as they are without thinking about what you want them to look like. </p>
      <p>My 2¢: the 'ka' is a problem. Have you tried fudging the 'k's arms and legs to even out the upper and lower spaces a little? (prolly not gonna work) Or all due respect to Riccardo, maybe keep the 'vi' ligature and create a 'ka' ligature.</p>
    html_clean: |-
      <p>after staring the same piece of work for too long, I find It helps to turn it upside down and look at it from a distance, so you are just looking at the relationships of the shapes as they are without thinking about what you want them to look like. </p>
