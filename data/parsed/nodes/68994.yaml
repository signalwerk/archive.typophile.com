    html: |-
      <p>I agree with both comments above. The serif on the k seems off. The top right arm of the K needs to be closer to the A (ie. same distance as the bottom arm), and the "iv" looks like it needs to be adjusted. It looks almost like the I and the V are different heights and not lining up quite right. </p>
      <p>If it were me, I'd let the i and the v touch, but just as a "kiss" and not as a crash. I think I would open up the spaces between the "a r," the "a i" and the "a l" just a tad. Right now, they look to be closer together than the "r n." (probably an optical illusion). </p>
      <p>If anything, the "r n' should be closer together due to the counter below the arm of the r.</p>
      <p>Just my thoughts.</p>
      <p>RL</p>
    html_clean: |-
