    html: <p>InDesign thinks its primary codepage isn't the same as the other fonts in the menu. <br> <br>What language groups does the font support? <br>What format is the font? What OS are you on? What version of InDesign? <br>How are you activating the font? <br> <br>Regards, <br> <br>T</p>
