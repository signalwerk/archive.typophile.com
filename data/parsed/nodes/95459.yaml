      <p>If the typeface can make a difference, how about leading?<br>
      Point size?<br>
      Justiﬁcation?</p>
      <p>Perhaps Baskerville might not have seemed so truthful with a different typespec.</p>
      <p>**</p>
      <p>These kind of “priming” tests (to use Kahneman’s term) point in an interesting direction, but they are just the tip of the iceberg. As graphic designers, we work with the full range of typographically expressive means, and to suggest that merely choosing a particular font will have speciﬁc and predictable neurological effects is to banalize our profession.</p>
