    html: |-
      <p>The informal study was only among six typefaces, hardly enough variety to claim that Baskerville has a lock on projecting authority and credulity. Looking at the other faces: : Computer Modern, Georgia, Helvetica, Comic Sans and Trebuchet, what the outcome says to me is that tradition is seen to equal truth, i.e. the oldest typeface looked the most trustworthy. Let’s see a contest among Baskerville, Caslon, Bodoni, Garamond and other pre-20th century faces and then see what happens. Let’s change the content to something non-scientific (in this case it was an asteriod hitting Earth) and see what happens. Let's change the colour of the text, change the size, the leading, the column width, etc. etc. and see what happens.</p>
      <p>David</p>
