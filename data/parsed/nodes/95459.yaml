      <p>Well, I was dismayed that they included Computer Modern in that test instead of Century Schoolbook or Century Expanded; this limits the usefulness of its results.</p>
      <p>I would also have been very interested to learn where Times Roman ranks in such a test.</p>
      <p>Before looking at the article in the link, though, this reminded me of another famous saying... but though I read it in a book, on the web, it seems that Tamazight or French are more often given the title of the language of free men.</p>
