      <p>Yes, he could have expanded the test, and I agree that different sizes of fonts might affect the results; Trebuchet looked nasty on my screen on the size used, but much better enlarged a bit. The results are still  interesting.</p>
      <p>Seeing that the fonts were rendered by browsers, I wonder if they could find differences in results based on the browser used. It might have been better to use images. I assume browsers present them more uniformly.</p>
