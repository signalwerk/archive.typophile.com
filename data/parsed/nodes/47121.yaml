      <p>Paul: <em>as for coffee, i think a lot of the locals enjoy Tim Horton’s, but i’ve not tried it. it may be more american (Canadian) than you like...</em></p>
      <p>Generally speaking, I don’t drink drip or percolator coffee. Brew methods that kill most of the flavours in coffee just seem wrong to me. Coffee is like wine: the beans possess an extraordinary range and complexity of flavours. Good roasting and extraction will bring out the flavours, but most of the world’s coffee is effectively destroyed by the people who make it. Imagine if 95% of the world’s grape harvest were lumped together in large batches to produce largely indistinguishable cheap table wines.</p>
      <p>People often assume, since I’m always keen to locate the best cafe in any destination, that I must drink a lot of coffee. I don’t. Typically, I have one small espresso in the morning and another in the afternoon. I’m not downing gallons of the stuff to stay awake or excite my neurons. I want a fantastic taste experience, and I want to know where the beans have come from, who roasted them, and I want the drink made by someone who understands and cares about quality.</p>
    html_clean: |-
