    <p>TypeCon is a little more than a week away, and I realise that I still don’t know where the best espresso is to be had in Buffalo. I mean seriously good, 25-second shots of chocolatey, crema-rich darkness, not Starbuck’s burnt black p*ss. Anyone know?</p>
    <p>While we’re on the topic of Buffalo, what restaurants are recommended?</p>
    <p>I’ve found a <a href="https://web.archive.org/web/20080821122022/http://www.the-latinmass.com/id137.html">traditional Roman rite Mass</a> for Sunday morning, so church is taken care of.</p>
