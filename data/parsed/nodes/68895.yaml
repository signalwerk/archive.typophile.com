  html: |-
    <p>This is a sample from the Solari split-flap "Train Information" board at Amtrak's PHL 30th St. Station. I suspect the typeface on the flaps is a custom job (presented as monospaced on single-character flaps, but kerned on longer place-name flaps), but I'm looking for something with a similar feel. So far the best I've got is Whitney Condensed Book or Medium; which will work fine, but I still wanted to see if there were any other opinions.</p>
    <p>Thanks!<br>
    MB</p>
