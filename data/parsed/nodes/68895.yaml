    html: |-
      <p>It doesn't have to be monospaced, but narrower M's and W's help.</p>
      <p>Frutiger looks a lot rounder than this to me; even the condensed version. Myriad is even further in that direction. I'd really like to replicate the slightly cold industrial feel. Perhaps I'll have to settle on one of these and modify it slightly.</p>
