  html: "<p>Hello all, <br> <br>I'm a graphic design student, and while I think I'm getting better at kerning, practice makes perfect - so here's my idea: <br> <br>Give me a word or few words and a font (or fonts). Then I'll attempt to kern em to perfection; post the results, and see how bad I did... <br> <br>I suppose you could stipulate U&amp;LC, small caps, or all caps. And the fonts I have available are the Mac OSX system fonts, plus: benguiat, benguiat gothic, bauhaus, bookman, souvenir, aphasia, and carlton. <br> <br>Thanks for playing! <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Cheers!</p>"
  html_clean: "<p>Hello all, <br> <br>I'm a graphic design student, and while I think I'm getting better at kerning, practice makes perfect - so here's my idea: <br> <br>Give me a word or few words and a font (or fonts). Then I'll attempt to kern em to perfection; post the results, and see how bad I did... <br> <br>I suppose you could stipulate U&amp;LC, small caps, or all caps. And the fonts I have available are the Mac OSX system fonts, plus: benguiat, benguiat gothic, bauhaus, bookman, souvenir, aphasia, and carlton. <br> <br>Thanks for playing! <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Cheers!</p>"
