    html: <p>Geppetto, here is my suggestion. Kerning isn't just the color of one word but the color overall as well. Try getting your hands on business cards and re-layout the design and work on the kerning. The reason business cards are hard is all those darn numbers. It would give you kerning and layout experience at the same time.</p>
