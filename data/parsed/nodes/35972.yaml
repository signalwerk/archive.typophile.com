    html: <p>Great article -- tremendously significant too, because it is probably the most detailed account of a single typeface that has ever been published in a general interest magazine. The writer did an exceptional job too, I thought, especially considering he's a recent J-school grad. Many far more experienced journalists have been hopelessly flummoxed by type and its arcana. Altogether most impressive, including, James, especially, the font - - very happy for you.</p>
