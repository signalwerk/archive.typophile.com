    <p>MAGAZINE  | August 12, 2007<br>
    The Road to Clarity<br>
    By JOSHUA YAFFA<br>
    How a graphic designer and a typographer and their obsession with fonts and legibility led to a painstaking effort to clean up America’s road signs, one letter at a time. </p>
    <p><a href="http://select.nytimes.com/preview/2007/08/12/magazine/1154684598978.html?ex=1186804800&amp;en=a8c0a86a18d2357c&amp;ei=5121&amp;emc=eta1" title="http://select.nytimes.com/preview/2007/08/12/magazine/1154684598978.html?ex=1186804800&amp;en=a8c0a86a18d2357c&amp;ei=5121&amp;emc=eta1">http://select.nytimes.com/preview/2007/08/12/magazine/1154684598978.html...</a></p>
    <p>Just found out that this is coming out this Sunday.</p>
    <p>James</p>
