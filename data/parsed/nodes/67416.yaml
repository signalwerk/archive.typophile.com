    html: |-
      <p>This is an interesting looking font. It would be nice to see a pdf; that way we can judge the shapes, contrast and smoothness better. It looks quite well crafted. </p>
      <p>At first glance, it looks like you're not quite decided whether this should be narrow or wide. The caps are wide but the lowercase (especially e and g) is narrow. I think that could work very interestingly as a concept, but then there are still discrepancies like the wide lowercase a or narrow uppercase J. </p>
      <p>It looks like the stems of the uppercase could be a bit heavier.</p>
      <p>Comma is not in tune with the other glyphs, style-wise. It needs squaring off. The period too. Asterisk needs to be monoline I think.</p>
      <p>Uphill stroke of X and x needs a bit of offset.</p>
      <p>Lowercase j should have a flatter tail.</p>
      <p>The @ sign has a bit too much white space. Put the ring nearer the a?</p>
      <p>Keep going, this could turn out very interesting!</p>
