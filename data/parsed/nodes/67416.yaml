      <p>This looks awesome, please finish it.<br>
      What if the bottom-left corner of the lower case b looked like the upper-left corner of g.<br>
      I found the terminal of lowercase e a little awkward but it could be just me.<br>
      Maybe also reduced the contrast between the thicks and thins in the uppercase, AXKYN.<br>
      In my opinion a close loop P may work better with this typeface (mainly because I don't like open loop ones :P) I love the R though.<br>
      It could be that the high contrast Uppercase makes the capitals a little thicker than the lowercase at times but it's really hard to tell from a PNG.</p>
      <p>Ben said:"At first glance, it looks like you're not quite decided whether this should be narrow or wide."</p>
      <p>Please don't fix that by making the whole thing narrower.</p>
