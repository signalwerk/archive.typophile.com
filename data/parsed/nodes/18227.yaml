    html: |-
      <p>I was wondering the same thing. For years, I only knew it as "Bauer Topic," the name it shows up as in the VGC library and so on. Just guessing, but I wouldn't be surprised if the name was changed when it was marketed in the US, similar to the way Akzidenz Grotesk was marketed as "Standard" in the US.</p>
      <p>As evidence for this, I have an art directors' type guide/manual published in 1959 which has short samples and text describing most of the metal display faces available in the US at that time ("Practical Handbook on Display Typefaces" by Kenneth B. Butler and George C. Likeness). It's listed as Bauer Topic and the text suggests that it had only recently become available.</p>
