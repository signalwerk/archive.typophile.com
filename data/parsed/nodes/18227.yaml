      <p>'Ugly is in the eye of the beholder.'</p>
      <p>Tiffany, I will hope some time to put up some examples that I think place the matter beyond doubt. However, they are not really historical examples, just my own private meanderings. </p>
      <p>'What is the rap on Steile Futura in terms of suitability for text or display?'</p>
      <p>It's obviously not intended for anything but short passages of text, set rather large. However, the smallest size cut was 8 points.</p>
      <p>'What claims are made for it by the author of the prototype or the foundry that corrected it?'</p>
      <p>None that I can find in the marketing literature beyond 'a new design by Paul Renner'. But then, what is needed beyond that?</p>
      <p>'What pretensions does it address.'</p>
      <p>Don't really understand the question which may be too broad. Could you talk a little bit more about this?</p>
      <p>'What aspects of the Renner drawings or the metal and digital realizations do you stuggle with Bill? What specific authenticity, mechanical reproduction, appropriation issues occupy you as you struggle with it’s redigitization.'</p>
      <p>When you are redigitising, redesigning, re-producing a type face, you want to think that are inside of the typeface, inside the designer's head, inside its time in history, and yet that you are fully present in the present. Well, at least that is what I want. How can you present a typeface if you don't understand it deeply? Very generally, I know quite well - it is not a matter of opinion or shading - that I am not deep enough in Renner's head, far from it. </p>
      <p>Speaking particularly, let's look at the problem of the left and right quotation marks in Steile. I am dissastisfied with them in the metal, and also in the Tasse re-approach, which in this respect was too literal for my taste. There is too much space, and it has something to do with the angle of the angled quotation marks, which are in any case a difficult object to deal with under the best of circumstances. It is probably easily fixed by bringing them closer to straight and tightening them. But wait: suppose I fix them and a few lines look OK to me. What other problems have I now caused? The simple word 'it's' looks bad to me in Steile Metal and Tasse. But if I fix that to my liking, what other problems will I have caused? What is my liking and why do I have it? To what extent am I the prisoner of the present, and is this preventing me from imagining the future? Can my study of the past help me get to the future? Did they have a better way of looking at the apostrophe in 1950, and should I consider that as we move towards 2050? </p>
      <p>Do I need to appropriate from the past in order to plan the future, or do I need to free myself from it? This is a particular problem we have in type at just this point in history. It arises because there are so many obvious craft and aesthetic issues we have to go back to the past for. Otherwise we will be stifled by our incompetence. Our problem is how to gather from the past only what is liberating. That isn't easy because it involves a lot of conceptual gear shifting.</p>
      <p>Let's take another particular small problem, the ff ligature. In metal, this has a typical Linotype form that I find jarring. A big sweep for the top of the first f, and then a tiny sweep for the second f to make it consonant with standalone f. Can anything be done to resolve this problem? Should the top of the second f of ff be extended to make it work with the first f? In that case, should the standalone f be similarly changed? But that would be quite a radical decision, wouldn't it? Was the production version designed this way in the hope that Linotype would eventually adapt it? If so, wouldn't it be better to un-Lino it? But what will be the consequences of that? How can I know what is the right thing to do when I don't feel an overwhelming answer coming out of me? If I don't have an irrational voice saying 'do this' - and I would trust that voice if I heard it - what rational analytical tools can I use to determine the best choice?</p>
      <p>Similarly, with the other f ligatures there are consistency problems. Each has been designed rather differently. Perhaps each is the best compromise possible, but some seem too curvy, like fi, for such an angular face How can we test that? And what about the flaring on the f of fi that is not present in any of the other f's?</p>
      <p>Speaking of flaring, let's return to the e I showed. We saw that in this particular character, I de-cornered the bottom right feature to avoid flare. In this case, I was being faithful to the metal. But the analogous feature at the bottom left of the g has a much more intense flare in metal. To what extent should I respect that difference, or try to make each more consistent? How can I answer the question: why are the flares on e and g (and fi) so different? To what extent is consistency working for the face? To what extent against? </p>
      <p>Will I address the optical scaling question? Bauer did an outstanding job in this respect, though the 8 point may seem a hair too dark to some. (I was noticing this problem in Lino Granjon recently.) Or would a variable bold axis be adequate? In that case, what do I make available to the user? Different optical sizes, or to keep things simpler, some weight variants? </p>
      <p>So there are a lot of problems and frankly, I don't see how they can be adequately solved outside of a co-operative foundry environment. From this point of view, it's not surprising that the only real effort to bring Steile into the future came from Font Bureau, and it's not surprising that nobody had the energy to take on the italic. </p>
      <p>Stephen is right. Steile is a mystery.</p>
