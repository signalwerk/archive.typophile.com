      <p>Whether it's text or display, though, a sharp corner results in all kinds of flaring effects (not on the serifs obviously, but all kinds of other terminal points) that may seem garish and I think that is a particular problem with Steile.</p>
      <p>There have always been programs that would round corners, so theoretically you could design with sharp corners to save time, and then round off automatically later, but this has never appealed to me because you are going to have to look at each character anyway to make sure the effect worked the way you wanted it to.</p>
      <p>Yes, I would want an optical axis, even if it was pretty simple. (Ideally, all single master fonts would be MMs with a single spacing axis, which would be better than tracking, because you probably want to space out rounds proportionately more than you space out straights as you go down in point size.) There are some great tools in Robofog which can theoretically greatly simplify this kind of development, but I have yet to get them to work. However, the tools are constantly evolving and sooner or later they will. </p>
      <p>&gt;as you continue this project</p>
      <p>At the rate I am presently going, I would expect someone else to come out with 20 versions first. There is so much to think about. I still haven't really figured out where Steile and Tasse diverge, and why. A lot of intelligent thought went into that project. And there is always the hope that one day a Tasse italic based on Steile will appear. It is a little difficult to compare Steile and Tasse because there is not an exact weight/width match. However, it should be reasonably easy to interpolate one. What really happens with Tasse? What is changed, and  why? One reason I am reluctant to put too much focus on Steile is that I keep on hoping that Font Bureau will ultimately release a Tasse italic. I think I remember David Berlow expressing the same wish, and saying it was up to the designer, who I guess is thinking things over. Somebody should contact him and see what is going on. </p>
      <p>In the meantime, it would be interesting to hear more comparing Steile to Tasse and comparing Berthold Steile (bold and bold italic only) to FC/URW and to the originals. I seem only to have the low-res version of Berthold Steile, which is not much use for comparisons at the level we are talking about here.</p>
