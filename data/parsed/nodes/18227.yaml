      <p>Guys, Charles Leonard has just posted a page of Renner's drawings which says more about the process by which a great type is made than any other piece of historical material I have ever seen.</p>
      <p>How can you look at this unbelievable artefact that history has most unexpectedly vouchsafed us, and remain silent? </p>
      <p>We have here the most unexpected window into the type-creation process we are ever likely to be able to look through. Doesn't that mean anything to you?</p>
      <p>Have any of you any sense of the huge gulf that separates Renner's drawings from the finished type? Can you imagine the thousands of steps, the endless hours of thought, the anxious hours of discussion that must have transpired before this gap was filled? </p>
      <p>What Charles posted is by far the most informative thing I have ever seen about Renner or any other type designer period. And not to rake up a pointless issue, but ... what does it say about a writer who must have encountered this material (if he didn't, he had no business writing the book at all), and who doesn't even mention it in a book that is so unremittingly and bafflingly lifeless? This was his moment to turn on the juice to say something that was actually informative, actually engaging. But no, he was probably more worried about how <em>his</em> type would look on the pages. Has anyone considered how very oddly self-serving it is to write a tribute to a great type designer and not use one of that type designer's types to set it in? No, instead, one uses a completely unrelated type of one's own. Is one writing a tribute to Renner, or an advertisement for one's type? </p>
      <p>In my opinion Charles's image is the most important thing ever to be posted on Typophile or any other type blog or listserve.</p>
      <p>I was thinking of posting some images to illustrate my uncertainties about fitting the font (I think it is too loose in metal but I have probably made it too tight in my present version) and the question of cap height, but I have been so blown away by this image that I think my past meanderings in trying to come to grips with Steile Futura are simply irrelevant. </p>
      <p>Here are some of the basic questions that need to be answered:</p>
      <p>What is the date of these drawings?</p>
      <p>Are there other drawings, drawings from later stages, even from earlier stages?</p>
      <p>Who is responsible for the final design? Did Renner effect the transformation between sketch and finished type himself, without outside intervention from the foundry? That seems unlikely, but it is possible. How can we learn more about this? What material is known to exist? Is there extant correspondence? Has any type historian read it? Is that type historian fluent in German or .... ?</p>
      <p>What happens when we try to analyze what we have on hand - the sketch and the finished type? Can we see a logical path of development? Can we see some inevitable process taking place? Is there a demonstrable logic in the transition? Do we have a good idea of why the changes were made? If we do, we may ask ourselves if they are self-evident? Can we assume that Renner too knew they were self-evident? If that was the case, why didn't he just design the face that way from the start? Do we know anything of Renner's intentions with regard to these sketches? Did he mean them to survive? Was this a case analogous to the Bruckner symphony, where Bruckner's editors insisted on hundreds of changes and simplifications which Bruckner in unutterable despair gave in to, all the while saving a manuscript of the original, marked 'for posterity' ? Did Renner intend this sketch to show posterity what he would have done if only he had been allowed? Or was this sketch an unimportant doodle to him, something unwittingly preserved by the foundry? Was the sketch intended to represent foundational characters, or did someone ask for possible alternates and did Renner then provide this?</p>
      <p>I have a postulate which could perhaps be tested. That Renner presented this sketch to the foundry as something he thought they could and should do. The foundry then came back to him and said, we can't do this, this and that, for this, this and that technical reasons. It is not possible in metal type. Instead, we suggest that you do this, this and that instead, to comply with our technical limitations. (They have aesthetic objections too, perhaps, but of course they don't mention them to Renner, as Bill was not working for Bauer at the time . . . .)</p>
      <p>Is it possible that that is what happened? Can we illustrate it based on the material we have here? For instance, by making a little mini font of the sketches and seeing how they fit together, and respecting metal limitations? Or just by making duplicates of the characters, and pasting them into words, as used to be done routinely to 'proof' type sketches before font software was invented?</p>
