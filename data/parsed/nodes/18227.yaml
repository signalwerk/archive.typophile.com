      <p><em>There’s also quite a few faux examples of it in use included with the specimen, mainly for advertising use, all with common german brand names on them, but surely made up by the foundry, i wonder if it was an early attempt on getting that synergy-effect working with the foundry possibly getting paid by the respective companies?</em></p>
      <p>I can't say if there was any cross-marketing going on with Bauer's specimens, but the mocked-up ads is a very common trait of German typeface brochures from the early 20th century. The Ruhard'sche/Klingspor specimen book for Eckmann, which was printed sometime between 1900 and 1910, and the second half is filled with dummy-ads. I aso have some images from their late specimen book for Wallau <a href="http://www.typeoff.de/?p=29" rel="nofollow">here</a>. Dummy ads are a good idea still, in my opinion. Sadly, when we design brochures today, some type designers don't want that stuff in their brochure!</p>
