      <p><em>everyone is afraid to do a great small text face</em></p>
      <p>Small text faces are not something there's any demand for, except maybe for agate.<br>
      Digital work flow, high resolution printing, and being able to "see" small text on a monitor, rather than have to inspect a galley -- these may explain the perception that special faces aren't required for 5 or 6 pt. type. People will use Helvetica 45 on coated stock; tends to weed out the over-40s as readers, though.</p>
      <p>I've done some news text faces, Worldwide and Brown, for use around 8 pt size, with kinks, gouges and traps, that look pretty horsey (not necessarily ugly?) at 14 pt. I could probably have made them look nicer, but it would have been a lot of unnecessary work, as there are also display versions.<br>
