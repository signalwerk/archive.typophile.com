      <p><strong>Call:</strong> I’m not saying that a small text font has to be ugly when examined at 14 points</p>
      <p><strong>Response:</strong> I am.</p>
      <p>A better or more nuanced way to think of this, or think this through might be to consider that what works optical-grammatically at 14 points might not work at all optical-grammatically at 7 points. </p>
      <p>At 14 point what works well optical-grammatically at 7 might appear optical-grammatically dysfunctional (= ugly?). This has to be purely a function of the ratio of receptor (rod / cone) density relative to proximal stimulus extent, and the visual spatial frequency band used in form resolution while reading versus inspecting.</p>
      <p>On the gestural-atmospheric (mood) axis the 'mood signature' of a block of 7 point type in a given font will be totally incompatable with the 'mood signature'(ugly?) of the same type with all the parameters exactly proportionately scaled, for the same receptor density / frequency band reasons.</p>
    html_clean: |-
      <p><strong>Call:</strong> I’m not saying that a small text font has to be ugly when examined at 14 points</p>
      <p><strong>Response:</strong> I am.</p>
      <p>A better or more nuanced way to think of this, or think this through might be to consider that what works optical-grammatically at 14 points might not work at all optical-grammatically at 7 points. </p>
      <p>At 14 point what works well optical-grammatically at 7 might appear optical-grammatically dysfunctional (= ugly?). This has to be purely a function of the ratio of receptor (rod / cone) density relative to proximal stimulus extent, and the visual spatial frequency band used in form resolution while reading versus inspecting.</p>
      <p>On the gestural-atmospheric (mood) axis the 'mood signature' of a block of 7 point type in a given font will be totally incompatable with the 'mood signature'(ugly?) of the same type with all the parameters exactly proportionately scaled, for the same receptor density / frequency band reasons.</p>
