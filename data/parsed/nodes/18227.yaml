    html: |-
      <p>Renner designed <a href="http://www.myfonts.com/fonts/urw/futura-display/" rel="nofollow">Futura Display</a> in 1932 for Bauer. It's nothing like Futura of course, but why waste a good brand name. It's a Black weight only face, and seems to be the precursor of Steile Futura (also nothing like Futura). No doubt Renner's sketch books have variations on the theme, over the years. Maybe I should call all my types Fontesque-something-or-other.</p>
      <p>The <a href="http://www.canadiantire.ca/index.jsp" rel="nofollow">Canadian Tire logo</a> is quite old, and uses Futura Display. (To even mention it is tempting fate for a re-brand, sorry.)<br>
      Note the minuscule forms of cap M and N, as in Steile.</p>
      <p>Eurostile was nicely done, but a ten-years-after family extension of Microgramma, the TV screen face. Zapf called its "squared circle" shape the supercurve, and used it in Melior. Univers has some of the same feel, especially evident in Frutiger's roughs, which were "squarer" than the way it eventually turned out. The supercurve is a different, newer shape than that of Steile Futura, which was a type in the well-known lettering genre of "block gothic".</p>
