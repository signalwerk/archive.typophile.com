      <p>great to meet somebody else in love with steile futura! The contrast between the upright and italic is just gorgeous. </p>
      <p>I have a specimen (mid 50s) of Steile Futura Fett from Bauer here, will post scans up later today or tomorrow, if time allows and somebody's interested. There's also quite a few faux examples of it in use included with the specimen, mainly for advertising use, all with common german brand names on them, but surely made up by the foundry, i wonder if it  was an early attempt on getting that synergy-effect working with the foundry possibly getting paid by the respective companies?</p>
      <p>i also only have the information from the Renner book by C. Burke, but alweays wanted to know more about it's development, market success (i always thought 'you never see Steile Futura anywhere' and since got more familiar with it it seems to be everywhere! spotted it on a graphic card packaging, cleasning agent bottle, etc. just the other over here in germany)</p>
      <p>on the naming issue, i always suspected that topic possibly was called that way not to get in trouble with that certain company from Illinois, which offers the only "officially named" Steile Futura… if anyone could shed any light on this?</p>
      <p>this is gonna be interesting…</p>
