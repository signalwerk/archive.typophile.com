      <p>'Did he not realize that none of them would be his? :-/'</p>
      <p>No, he didn't. He thought one of them would be Futura. And I don't think he was that far off in his expectations. Futura has proved to be very durable, even in the post-metal age. It was of course a great deal more useful in the metal age because we then had sizes that looked good in text. It is interesting that Futura is still so much used in medical product branding. Nothing else really carries its message of being completely trustworthy, scientifically valid, safe, modern, rational. He could not have anticipated the revival of rationalised grotesques, or of post-Syntax sanses (that humanist label is really too loaded, I don't like it). But if you want your pill to sell, you're still pretty apt to use Futura.</p>
