      <p><em> I can’t get away from the feeling that if Renner had thought this a viable option he would have pursued it, and that pursuing it would cause all kinds of other unintended consequences. Does anyone have an opinion?</em></p>
      <p>On pages 22 – 3 of <em>Die Kunst der Typographie,</em> Paul Renner writes briefly about his disatisfaction with the German Unified Standard Baseline. He felt it was too low on the type body, effectively shortening the descenders in relationship to the mean and cap heights in the font. He suggested, in these pages, that a solution would be to produce fonts that were reduced in size in the upper part of the type body and by "… these means, the image of the type would become somewhat smaller; something no one will be annoyed with, given today's current preference for smaller types.  The descenders could once again become as long as with classic fonts, and it would leave sufficient space over the capital letter for the accents and umlauts. … So that once again type would look good in unleaded settings. " Because he envisioned the descenders becoming proportionally longer, he was, in effect, proposing a reduction in cap height on the body, and I suspect that he would have considered the extra space a reasonable trade-off.</p>
