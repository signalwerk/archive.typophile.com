      <p>Nick, to understand what a biogaphy of a person living through the Weimar, Nazi, and post-Nazi eras could and should be like, why not take a look at Gitta Sereny's 'Albert Speer: His Struggle With Truth' a book which quite incidentally also makes a couple of instructive though subtle typesetting points. Sereny points the way to anyone who aspires to biography of anyone in that period and will give you an idea of the kind of exciting reading experience that you have a right to expect to occur when a biogapher is really knowledgeable about and really engaged with her subject. Speaking, off-topic, of subtle typographical points, Nick, can you tell us why Celeste footnote is a bad example of optically corrected design? (I am assuming that you have outgrown your Richler period, and I have concluded that this is the only interesting question CB's book raises.) Chris, I don't need to write a biography of Renner - Charles Leonard has already said what most needs to be said, most elegantly, most economically, merely by posting a one-page scan.</p>
      <p>May I say that I am extremely bored by the evidence here of intemperate worship at the altar of a minor and most unlikely god-figure called Chris Burke? The depth of high-falutin moral outrage on display here is astounding. Did you guys spend so much energy when the Taliban destroyed the Buddhas in Afghanistan? When the remaining ATF material was dispersed? When the Imprimerie Nationale was endangered - still a current concern? </p>
      <p>So I ask: what do you want to do with your time: blather, or try to think through the issues that have been presented here, which, entirely incidentally, and quite unimportantly, do not reflect well on the Apostle of Reading. Life is very short. I would rather talk about something important. And read good books.</p>
