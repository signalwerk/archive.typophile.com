      <p>First of all, Vilem Flusser's <cite>Die Schrift. Hat schreiben Zukunft?</cite> ("Writing. Is there future for writing?"), by a Goettingen publisher named "European Photography", but I cannot find an English edition at Amazon. <cite>The Shape of Things</cite> and <cite>The Freedom of the Migrant</cite> I like most. But each of  his books is worth reading. Beware, he may be called postmodernist.</p>
