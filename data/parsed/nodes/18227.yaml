      <p>&gt;The automatic popping up of the idea that beauty-is-subjective gets in the way of the development of a common and detailed vocabulary for talking about the formal features of a piece of art/craft, leaving the field open to the sociopolitical-context bores.</p>
      <p>Well put. Aesthetic quality also should not be identified with beauty alone, in the sense of prettiness. An illustration of both the intersubjective character of aesthetic quality and the difference between aesthetic quality and prettiness is an experience I had in China. We visited a Buddhist Temple reknowned for its vivid images of devils and hell. </p>
      <p>It was full of these statues and pictures, and a lot were not so well done. But there were a set of stone statues of devils along a walkway--all hideous and truly frightening--that were just great. Not pretty, but aesthetic achievements. And in fact the guidebooks highlighted these as highlights of the Temple. Why have people admired these statues for hundreds of years? Well, they are good, and  it's not the matter of an individual's or even a generation's opinion. The guy who did them was just a better artist than the one  who did the others. </p>
      <p>Similarly, you can have small type that is artistically better and worse, even if none of it can be as pretty as big type with slender limbs and thin waists.</p>
