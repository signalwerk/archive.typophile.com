      <p>We can only trust in our own eyes to reveal what we see. If someone else describes what they see, it does not reproduce that vision for you. Designers should just produce what it is that they see as best and let the public decide later if that choice works for them.<br>
      We spend too much time putting things in neat catagories so that we can either point to catagorizations we approve of or to those we damn to hell. All of the "isms" or "istics" don't absolve the designer from his or her duty to make it work on its own. Whether it is Modernism, Humanism, Artistic or Scientific in its intelectualized pidgeon holeing doesn't amount to a gram of good. The society of self-proclaimed critics will find a reason to condem anything that does not fit their mould so just do what you will and go on to the next thing knowing you tried your best.</p>
      <p>ChrisL</p>
