      <p>From Burke's book on Renner:</p>
      <p>"A typeface actually called 'Renner-Grotesk' appeared in trial type castings by Stempel typefoundry in May 1936. The Stempel Renner-Grotesk was very condensed in its regular weight, with a consequent stress on the modular squareness of the letters (figure 115 [shown below--MS]). This design seems to have been taken over by the Bauer typefoundry in 1938, and in 1939 the grotesk changed shape to some extent, becoming less modular and incorporating references to pen-made forms. The italic accompaniment to this grotesk, simply called Renner-Kursiv, was actually a true cursive, marking a decided difference between this typeface and Futura. Work on the Grotesk and Kursiv continued through the late 1930s and early 1940s. However, progress on these typefaces seems to have been very slow, perhaps due to Renner's failing health: he had a serious heart attack in 1948 (at 70 years of age) which restricted his activity. By 1951, Renner had begun to work again, and his Grotesk began to appear in 1952 from the Bauer typefoundry under the name of Steile Futura (figure 116 [shown below--MS]). Perhaps the typeface was renamed merely in order to link it to the successful Futura family."</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/renner-grot.gif"></div><p></p>
      <p>Figure 115 (Renner-Grotesk)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/stil-fut.gif"></div><p></p>
      <p>Figure 116 (Steile Futura)</p>
