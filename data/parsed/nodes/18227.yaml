    date_raw: 27 May 2010 — 5:47am
    votes: null
    html: |-
      <p>A few photos more (distorted and out of focus, sorry ...), in addition to the drawings Charles Leonhard already posted about four years ago. The source for these pictures is a publication by the typographic society in Munich:</p>
      <p><em>Paul Renner. Eine Jahresgabe der Typographischen Gesellschaft München, zusammengestellt und herausgegeben von Philipp Luidl, unter Mitarbeit von Günter Gerhard Lange, Typographische Gesellschaft München 1978</em></p>
      <p>Text on p 88 (my translation):<br>
      <em>Here you see – as an extension to 'Futura', which is based on circle and square – a variant that is based on rectangle. This developed 1932 into 'Futura Schlagzeile'.</em><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/IMG_p88_89_6623.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/IMG_p89_6324.jpg"></div><p></p>
      <p>Text on p 90:<br>
      <em>Trial version of 'Futura Schlagzeile', proof on 9 March 1932.<br>
      The long s and the uncial-script-like shape of T were later omitted, as well as the alternative shape of A that corresponded more with the lower case a.</em><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/IMG_p90_91_6560.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/IMG_p91_4131.jpg"></div><p></p>
      <p>Text on p 92:<br>
      <em>Drawings for the initially planned regular for 'Futura Schlagzeile'.<br>
      K, M and V have diagonals that are different from the final version.</em><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/IMG_p92_93_6563.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/IMG_p93_6578.jpg"></div><p></p>
      <p>Text on p 94:<br>
      <em>Alternative shapes for 'Futura Schlagzeile'. Note the remarkable B. Renner, as a skilled draughtsman, avoided plain construction. The vertical strokes in B, C, P and Q are curved.</em><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/IMG_p94_95_5171.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/IMG_p95_5746.jpg"></div><p></p>
      <p>Text on p 96 (same as the picture already posted four years ago):<br>
      <em>Concept for the italic regular for 'Futura Schlagzeile'. These shapes – although being broader and more fluid – already anticipate the characteristics of 'Steile Futura italic'.</em></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/IMG_p96_97_3591.jpg"></div><p></p>
      <p>Text on p 98 (same as the picture already posted four years ago):<br>
      <em>The fluidity at the beginning of the stroke and in the terminals is much better (here) than in 'Steile Futura italic'. Note the shape of german s, a quality criterion for the connoisseur.</em><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/IMG_p98_99_3715.jpg"></div><p></p>
      <p>All Renner's typefaces, in chronological order (p 51)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/IMG_p51_5435.jpg"></div><p></p>
