      <p>:)</p>
      <p><cite>-- Different optical sizes, or to keep things simpler, some weight variants?</cite></p>
      <p>With sanserifs, especially low-contrast ones, it may be worth trying a combined solution: lighter weights at the same time serve as larger optical sizes. But this requires many finely graded weights. And details matter. E.g. your e shows rounded corners. Sharp corners are easier to handle, they look the same at whatever size. But then, your roundings are so minute that they may look ok even at larger sizes. (I tended toward rounded corners earlier, less minute than yours, so if enlarged, letters looked like sausages. I decided for sharp corners instead ...) It really depends on the effect you desire, but also practical considerations -- as great as optical sizes are typographically, who uses them? or, who will ever use more than two weights of a really big family?<br>
      Whatever you do, and however faithful you'll do it -- it will be your interpretation and never a "true" Renner. So I would not bother and just try corrections and see if it would change the image of the type too much.</p>
    html_clean: |-
