    votes: null
    html: |-
      <p>"but of course there are many independent digitizations of Steile Futura and I doubt any single one could be called the “original”. If at all, it would have to come from FT Bauer."</p>
      <p>I don't quite understand what you are saying, Adam. There are two primary digitizations. The first was Font Company's from a VGC photo master, of which the URW is an exact copy with every defect preserved. My impression is that Font Company did the work, and URW acquired the rights under typical IK licensing. This digitizations includes the two weights, medium and bold, both in regular and italic. The second primary digitization is Berthold's, which unfortunately is only of the rather less interesting bold. It differs from the FC version in many details. The FC/URW version is almost unusable because it is so amateurishly, in fact irrationally spaced and because there are so many incorrect glyphs. Both versions take considerable although not fatal liberties with the metal cut. In the metal, there is substantial variation from size to size, making it quite difficult to decide on proportions. In addition, the spacing is rather loose by contempoary standards. But Adam, what do you mean when you say that the original 'could only come from FT Bauer'? Everyone has access to the same specimens, and FT Bauer has not shown the slightest originality in any of its digitizations or design choices. If anyone is going to produce an 'original' Steile, I think it is very unlikely to be FT Bauer. Its Futura digitizations largely recklessly imitate, often point for point, previous translations of the fonts into photo from metal. Nowhere have we yet seen what we most need, a Futura intended for setting at text sizes, which in metal features the substantially reduced ascenders which are necessary to make the type viable at text sizes. Because we have not seen anything from 'FT Bauer' which in the slightest degree resembles research into original drawings or any effort to come to understand what the foundry originally did, I would conclude that FT Bauer does not actually possess any original artwork or pattern drawings, and is simply relying on precisely the same sources that are available to everyone else. So Adam, what makes FT Bauer so special? Based on past performance, any Steile FTB does will be a copy of the URW version with, one hopes, improved spacing. I do not see the smallest evidence that FT Bauer has ever done anything the hard way! You know, research into originals, redrawing, throwing out the old photo masters, rethinking,  reconceptualization, all that good stuff that makes good type what it is. Sure, their Futura is OK. But where is it substantially different from everyone else's? What evidence is there of historical research? As far as I can see, that foundry is all hype, hype, hype, and lawyers, lawyers, lawyers - rather like what Berthold has become under the combined weight of the two Hunts. To speak of these cloners as 'digitizing' anything reflects badly on what is, after all, a metier.</p>
      <p>It is precisely because it is so difficult to digitize type from a 12 point specimen, without master drawings (and assuming that the drawings would actually be helpful in making the type, which does not follow), that I doubt 'FT Bauer' has any material that is different from anyone else's. They are making the same, sloppy, cost-effective decisions that everyone else does when confronted, in type, with the desirability of doing some really hard work. And this does not impress me. This is not what we need at this point in type history.</p>
      <p>Stephen, I think you are very acute to be so obsessed with this type. It is still miles ahead of its time. I think in its original form that it is  still a little too shocking to see much use. But the skill with which it was conceptualized is what most impresses me. The relationsip between the bold and medium is particularly notable. There is no artificial bolding such as we all, conceptually (and sometimes literally) do. The different weights are independently thought out, which is as it should be. In certain respects, which I cannot describe because I don't fully understand them, I think it is the best typeface design I have ever seen, on a technical and aesthetic level that I could never aspire even to understanding, much less to rivalling. Perhaps Berlow, if he felt like it, could persuasively analyze what is going on in this remarkable typeface. </p>
      <p>In the meantime I have a question. Jeff Level, when we first thought of redigitizing this typeface in 1993, felt strongly that the cap height should be reduced by about 10%. I can't get away from the feeling that if Renner had thought this a viable option he would have pursued it, and that pursuing it would cause all kinds of other unintended consequences. Does anyone have an opinion?</p>
