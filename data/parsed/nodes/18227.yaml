      <p><em>Wait, so those traps were drawn for display cuts?!</em></p>
      <p>According to caption, which is all I have to go on, the "Skizzen" [sketches] were explorations of alternate characters/weights for Futura Schlagzeile [headline]. I agree that the cuts are odd. They may indicate that in 1932 Renner was considering a new, condensed text font, but that is pure speculation. However, the arrival of Steile Futura in 1952 suggests that that was what he was considering.</p>
      <p><em>Is that really what he [had] said?</em><br>
      Throughout <em>Typografie als Kunst</em> and <em>Mechaniserte Grafik,</em> Renner draws distinctions between form, which derives from "organic" processes, and style, which is the province of the artist. He defined the task of his time as, "… the conscious confrontation with the mechanical, the cleansing of mechanized technology of the old form-world of handicraft.” Because type formed its word images by a single application of pressure from the type, and not the ductile movement of pen over paper, anything that made reference to a process different from printing—writing—was not inherent in the "form idea" of the letter, and, if an artist was to work in a style commensurate with the mechanical era, artifacts of the hand and pen such as slope, stroke weight difference, curve thickness transitions, et al had no place in the "Schrift unserer Zeit."<br>
      Charles</p>
