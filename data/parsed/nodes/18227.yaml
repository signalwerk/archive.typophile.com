      <p>A bit belated -- I am not sure if I want to know what Heidegger or Benjamin had to say about a particular typeface. You could ask the shop assistant next door as well. Never inquire philosophers about arts.</p>
      <p><cite>has anyone seriously looked into the possibility of digitising these typefaces?</cite></p>
      <p>It would be nice to have a book which presents them. To enjoy looking at them, and to study how Renner approached certain design problems. (Like the great Schneidler book which is itself an amazing object.) But to revive them? They are period pieces. Right now I have much more sympathy for typefaces like Freight; it combines type history without being just a revival of anything particular, that is, it does not imitate individual letterforms, but addresses specific problems in a way which tells me that its designer knows something about type history.</p>
      <p><cite>but it looks like the FC/URW cuts some corners, shows more evidence of digital/Bezier?</cite></p>
      <p>Softening corners is a bezier characteristic. But FC/URW hints to Ikarus which uses circle-segments for curve description -- which have their own characteristics. :)</p>
      <p>Karsten</p>
