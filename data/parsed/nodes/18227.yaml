      <p>DeWitt, thanks for confirming my memory!</p>
      <p>***</p>
      <p>Chris Burke's "Renner" is one of my favourite books on typography. I particularly like its scope -- the way Burke relates so many aspects of Renner's life and times to his type designs, and its depth -- discussing issues like National Socialism and blackletter, and Renner's take on modernism. It is also a nicely designed book with many illustrations and specimens, superb production values, set in Burke's own Celeste and Celeste Footnote, with thorough index, footnotes, etc.</p>
      <p>I contacted Mr Burke on a visit to the UK a few years ago, and he was gracious enough to have lunch with me and show me round the typography department at Reading University.</p>
