      <p>Peter, great questions.</p>
      <p>Karsten, I think a good rule of thumb is this: the most informed an opinion is, the more it has to be "filtered" using context. For example, if I get a crit of a font from a person who I happen to know makes chirographic type, I certainly don't ignore it outright, but I do use that context to eliminate or focus the particular opinions. So for example if that person says "the 'g' is too dark", great; but if he says "the bottom of the 'd' is wrong" then I know to simply smile it into oblivion.</p>
      <p>hhp</p>
