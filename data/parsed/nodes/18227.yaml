      <p>&gt; Gill ... obviously intended as such.</p>
      <p>I don't think this can be taken that far. In parallel to the fruitful reliance on another person (like a punchcutter, or a pantograph operator) to "manufacture" the actual font, among some designers -including Gill, I'd say- there was/is a willful oblivion towards some aspects of the craft. It's no secret that Gill didn't do the fitting (spacing) of his fonts, leaving that supposedly menial task to the Monotype works boys; looking at some of his drawings, it seems that he didn't even incorporate overshoots to the rounds in his drawings! How much of that is faith in the skills of another, how much is plain cavalier sloppiness/laziness?</p>
      <p>Different people are good at different things, and the smart<br>
      ones realize what NOT to expect of themselves; it can be argued<br>
      for example that Gill didn't have what it takes to space a font;<br>
      but maybe he didn't even bother finding out either way.</p>
      <p>&gt; it is an imperative of creativity to have the idea for the<br>
      &gt; glyph before you have the glyph itself, and that is the<br>
      &gt; function of the free drawing.</p>
      <p>I would instead say that "impulsive" activities like drawing (but especially "painting" - think calligraphy and brushwork) can reveal unexpected ideas for glyphs via the process itself. In fact many designers leverage this impulsiveness, sometimes to the point of demoting introspection, but sometimes with great results. Happy accidents are as common as unhappy ones!</p>
      <p>hhp</p>
