      <p><em>On the one hand, Renner is known for Futura most of all. (1) Futura indeed seems to own much to Bauer. Then, it seems still unsolved whether the Futura uppercase were by Renner or an architect; I am not up to date and don’t know if this is settled now.</em></p>
      <p>Not to toot my own horn too much–but a bit–I did address the Ferdinand Kramer v. Paul Renner question in my thesis "Paul Renner and Futura: The Effects of Culture, Technology, and Social Continuity On the Design of Type for Printing" available as a PDF at<br>
      <a href="http://etd.gsu.edu/theses/available/etd-07222005-152053/" title="http://etd.gsu.edu/theses/available/etd-07222005-152053/">http://etd.gsu.edu/theses/available/etd-07222005-152053/</a>. Due the similarity of dimensional increments between drawings–and reproductions of drawings–known to be by Renner and the drawings tentatively attributed to Kramer by Hans Peter Willberg, I came to the conclusion that the drawings were more probably by Renner, although it is clearly possible that Kramer collaborated with Renner on the designs for the Frankfurt public signage project.</p>
      <p>Renner's own extensive experience as a book designer from 1907 on suggests that while he was not personally adept at the proportional subtleties seen in the font released by Bauer in 1927, he was attuned to them. A myth persists that Renner wasn’t much of a lettering artist prior to his involvement with Bauer in the production of Futura. However, as a book designer he was responsible for the design and production of as many at 250 volumes per year between 1910 and the beginning of World War I. Many of these books sport title pages that are photo engravings of lettering executed by Renner. Further, it is helpful to remember that it was Renner that Fritz Wichert, director of the Frankfurter Kunstschule recruited in 1925 to rejuvenate that school’s program of instruction in lettering and typography.</p>
