      <p>&gt;it looks like the FC/URW cuts some corners, shows more evidence of digital/Bezier?</p>
      <p>My instinct is to say the simplification must have occurred in the VGC photo conversion. My reasoning is that the FC work was done in Ikarus and the conversion to PS does not seem to me to have been radically simplified. But anything is possible.</p>
      <p>I haven't done enough analysis of the size variations to come to any definite conclusions. I was hoping to avoid having to round off the corners because I seem to have spent my entire adult life rounding off corners in a hundred different typefaces, and it seems like such a waste of time in the greater scheme of things. Yet when it really comes down to it, I don't like supersharp corners in this typeface, I think it causes too much exaggeration. What do you think? I would really love to hear some persuasive arguments in favour of sharp corners. I've done my time on round corners.</p>
