      <p><cite>I think what helps is getting critiques from several different people.</cite></p>
      <p>Definitely so. I take comments by non type designers serious. If they find that something is wrong, then something IS wrong, and you have to figure out what. But only type designers, by their own experience, can give comments like: "Make this curve a bit smoother, and it will look right."<br>
      What I cannot accept however is considering philosophers as authorities regarding type, photography, painting, movies. (With respect to type, Vilem Flusser comes to mind. He had great ideas about writing and type and invented etymologies that blow you away because they seem so evident -- why didn't I see it like that before? --, but this has almost nothing to do with the reality and practice of writing or designing. It's fancy. Beautiful, but fancy.)</p>
      <p>Karsten</p>
