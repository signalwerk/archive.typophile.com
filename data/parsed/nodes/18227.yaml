      <p>Well, Hrant, that is pretty much to be taken for granted, don't you think? We are not discussing servility per se; what we are doing here is interrogating how something quite out of the norm is called into being. Here, we hope to have left the servile behind. (In any case: who are the most servile designers? You might call Robert Slimbach, for example, one. Yet his work is filled with rebellions, if you actually look at it.) However, let us not diverge. We take it for granted that typography is servile, and we further assume that, by and large, the more servile the better. Yet why should this be a rule? Isn't the entire point of Steile Futura to demonstrate how, with rigour, we can attain the essential ego expressivity without which we probably would not be human, yet remain within the recognized parameters of the field? In typography, the unexceptional is the norm and the fantastic is inevitably quite short-lived. What is unusual is for the exception to have any lasting power. Here we seem to have just that case, and in its strongest form.</p>
      <p>I would argue that it is a case of mastery over slavery. I would also argue that mastery over slavery characterizes the best movies, historically. In film you have an art form which because of the expense in production, must of necessity make money. So all kinds of narrative and formal requirements have to be satisfied before ego expression can be thought of. Renner is obviously of considerable intellectual calibre and can be assumed to be aware of all of these things. A rigorous biography that actually delved into correspondence might clarify these points, but Renner outside the world of type is unlikely to attract that depth of scholarly interest. But couldn't we argue that a similar mechanism takes place in all art and literature production? That we are essentially looking for the point where we can say - this point of time and being is mine - with this work I claim it - ? </p>
      <p>I would also argue that the craftsman or artist who can get to this point is expected to be exceptionally talented and probably quite mature - but that is not always the case, is it?</p>
