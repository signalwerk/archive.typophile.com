      <p>'What is clear is that by 1932 he had dropped his insistence that artifacts of the hand had no place in the creation of modern typefaces.'</p>
      <p>I think that's the most important insight to take away from this. It makes me so uncomfortable every time someone says 'you must do it this way, because it's un-something to do it any other way', or 'this is the only valid way' or 'such-and-such is out of time, inauthentic, inartistic, invalid, unchirographic, uncalligraphic, untypographic, unmechanical, unhumanistic (whatever that dreadful word now means in type), out of order and unPC', etc. etc. etc. I don't think it matters much how or why we do what we do. What matters if it works - for someone. Maybe that someone whom it works for will be millions of readers. Or maybe that someone will be only one. It doesn't matter. Like Julia Margaret Cameron said 150 years ago when she was attacked for her fuzzy photographs, which people are obstinately still admiring, 'Who is to say which is the right focus?'</p>
