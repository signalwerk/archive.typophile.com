      <p><cite>Karsten thinks philosophers shouldn’t be connected to art or craft but I think this is rather limiting.</cite></p>
      <p>Oh, I just said that you better not ask a philosopher about the design of a *particular* typeface. A philosopher is not a designer, and -- in most cases -- may not see more than other non-designers. There are exceptions of course, I could easily add Adorno to your list. However, I am not sure if what they wrote would help a designer answering particular design questions with comments like: "Better if you make this curve a bit smoother -- see the effect?" They deal with art in a very general way (music-an-sich, photography-an-sich). What Benjamin says about reproduction does not necessarily have consequences on how photographs look like.<br>
      Philosophic minds like Danto or Luhmann (German sociologist, system theory) tell you a lot about everything related to art. (There are such nice ideas like: If you start with a work of art, you got all possibilities to make whatever decision, but as you go on designing, with every decision of yours the possibilities get less and less, and you are more and more forced to subordinate to your artwork's structure. Not sure if this is Adorno or Luhmann who also had Spencer-Brown's <cite>Laws of Form</cite> in mind who in turn seems much "inspired" by Peirce's earlier "entitativy graphs".) But they don't really tell you what makes art art. And if you look for advice on making art, the cheapest "how-to" book is the better choice.<br>
      I like both realms, and they depend on each other and influence each other. In a very remote way.</p>
      <p><cite>... lack of attention given to Erbar, ...</cite></p>
      <p>What are you appealing to? That Erbar (but other typefaces too) changed over time, and some letters were modified to look more like Futura?  ;-)</p>
