      <p>'it seems that he didn’t even incorporate overshoots to the rounds in his drawings! How much of that is faith in the skills of another, how much is plain cavalier sloppiness/laziness?'</p>
      <p>An good reason not to put overshoot into master drawings is that the overshoot will be proportionally different for every size. </p>
      <p>The same with fitting: that must be different for every size, especially in mono/lino, where unit requirements will impose slightly different fitting limitations at each size.</p>
      <p>Always keep in mind that in that era, a type designer's master drawings are explicitly part of a production process where many quite different manufacturing drawings are to be made. The designer presents an idea of what he wants to see on the page; it is up to the foundry to turn that into manufacturing practice. There are many more disconnects between the initial design and the printed page. We are so unaccustomed to our more direct way of working, that it is difficult for us to remember it wasn't always so.</p>
      <p>'there’s a reason that type design neophytes tend to make highly geometric fonts…</p>
      <p>It’s one of several genres that don’t require typographic sophistication, true.'</p>
      <p>I can't let you two off with this so easily. The first thing that happens when a neophyte constructs a simple geometric sans is that the vertical strokes are the same weight as the horizontal strokes. The second thing that happens is that the neophyte is already so type blind that he can't see that the horizontal strokes have to be reduced because they are visually too heavy by a few percent. This is one of the points in type design education where you really need someone to tell you what is going on, and I have had to be that person for several neophytes, just as someone had to be that person for me.</p>
      <p>'I’d say: People don’t pay for what they don’t know exists.'</p>
      <p>True and characteristically astute. But the obverse isn't true: people won't necessarily buy what they do know exists, and that is especially true in type, mainly because there are so many choices out there that all type purchasers are suffering from overload and now want to simplify to the maximum extent. This has been true for several years and I don't know how we are to get out of this technology-driven lock. Until we do, there will be minute sales of non-basic items. Single-weight novelties are what sell, and that has been true for decades.</p>
      <p>'Yes, modernism reduced everything to the bare bones and is by nature “naive”.'</p>
      <p>Reading this, I get the nostalgic feeling that if Renner were alive today, he would be saying exactly what he was saying 60 years ago: you have too many types, you need only three. As I once quipped to a Heidelberger, 'Nur einen Renner kann uns retten!' (Only a Renner can save us. That's the type designer's spin on Heidegger's famous posthumous interview with Der Spiegel from the 1970s, entitled with his most (for him) shocking remark, 'Nur einen Gott kann uns retten' - Only a God can save us.)</p>
      <p>So maybe we need a new movement not towards complexity but simplicity? Maybe this is the time, hurtling towards thousands of gigantic OT fonts that nobody really wants either to make or to use, to rethink where we are going? And if we can't affect where we are going, can we affect how we are going there?</p>
