    <p>Hello friends. I'm perpetually in love with Paul Renner's <a href="http://fontsinuse.com/typefaces/28702/steile-futura" rel="nofollow">Steile Futura</a> (AKA Bauer Topic or URW Topic). I'm hoping those with type book collections can help me out with more information on its history and design. Digital versions are available from a few vendors, but none divulge any more than the number of weights and a price.</p>
    <p><strong>Digital Versions</strong><br>
    <a href="http://www.myfonts.com/fonts/urw/topic/" rel="nofollow">URW Topic</a> at MyFonts<br>
    <a href="https://www.fontshop.com/families/urw-topic" rel="nofollow">URW Topic</a> at FontShop<br>
    <a href="http://urwpp.de/bri/show_font_details.php?sprache=english&amp;fontnummer=t040volume" rel="nofollow">URW Topic</a> at URW++<br>
    <a href="http://www.bertholdtypes.com/font/steile-futura/bq/" rel="nofollow">Steile Futura BQ</a> at Berthold</p>
    <p><strong>Articles</strong><br>
    <a href="http://www.creativepro.com/story/feature/10560.html" rel="nofollow">Renner article at creativepro.com</a> mentions a design date of 1953–55<br>
    <a href="http://www.linotype.com/7-762-7/paulrenner.html" rel="nofollow">Renner bio at Linotype</a> mentions design date of 1952.</p>
    <p><strong>Reinterpretations and Followers</strong><br>
    <a href="http://www.fontbureau.com/fonts/Tasse" rel="nofollow">Tasse</a> (Guy J. Nelson) This is the closest to a revival but strangely omits the italics which are the most interesting aspect of the original.<br>
    <a href="http://www.emigre.com/EF.php?fid=121" rel="nofollow">Solex</a> (Zuzanna Licko)<br>
    <a href="http://www.myfonts.com/fonts/typodermic/pakenham-boss/?refby=typographica" rel="nofollow">Pakenham</a> (Ray Larabie)<br>
    <a href="http://www.fountain.nu/catalogue/hybrid.asp" rel="nofollow">Hybrid</a> (Simon Schmidt)</p>
    <p><strong>In Use</strong><br>
    <a href="http://www.usc.edu/dept/architecture/shulman/" rel="nofollow">L.A. Obscura: The Architectural Photography of Julius Shulman</a><br>
    <a href="http://www.flickr.com/photos/stewf/53572902/in/photostream/" rel="nofollow">"The War Within" movie poster</a><br>
    <a href="http://www.amazon.com/gp/reader/0767915054/" rel="nofollow">"A Girl Named Zippy" book cover</a><br>
    <a href="http://youworkforthem.com/product.php?sku=P0649" rel="nofollow">H.N. Werkman book cover</a></p>
    <p>Thanks for your help. I don't have <a href="http://www.hyphenpress.co.uk/titles/paul_renner/synopsis.html" rel="nofollow">Burke's Renner biography</a>. Anything in there?</p>
