    html: |-
      <p>Charles, let me add passionate thanks for these marvellous illustrations, which I don't remember seeing before. Exactly what do they represent? Are they some kind of drawing or trial cut? What is fascinating and instructive is to see how very different they are from the finished font. The ink traps are completely irrelevant, of course, as they chose not to use any in the final font. (As far as I can tell, there are no traps even in the smallest sizes which are what - 12 pt? 10 pt?) It is the radical changes in the letterforms that I find so impressive. How he started from here and got to there. Type being so collaborative, we must really wonder quite who is the auteur here? We naturally wish to think of Renner as sole auteur, sole arbiter. But what if this - what you have shown - was his final creative word? What if the rest, everything that makes the typeface the great totality we know today - came from the foundry staff? </p>
      <p>Do we have any information on this? Are there any survivors from the process? Did anyone keep diaries? Are there any corporate records? (There must be some kind of documentation - sie waren Deutsch!) I find the contrast between the design and the pre-design most fascinating to contemplate - very moving. There must have been a huge amount of effort and thought, and perhaps much heartbreak, as the letters were transformed from here to there. Where on earth do we find, today, anyone taking lettermaking so seriously? It is all very inspiring, what you have presented.</p>
      <p>It is utterly shocking to me that Chris Burke did not address these issues at all in his book on Renner - as far as I can remember. That is the dullest book I have ever read, though one is grateful for it even so - -  How it would have been <em>enlivened</em> if he had thought to penetrate the questions these illustrations raise. He must have been aware of this material, no? To write 200 pages about Renner and not have a single interesting thing to say about him - - when you could be discussing <em>this</em>.</p>
      <p>I look at what you have sent and I say to myself 'and <em>you</em> aspire to present a version of this typeface to the public? YOU? What makes you think you have a tenth of the requisite expertise?' </p>
      <p>I'm blown away, falling not perhaps quite upwards, as Hölderlin says, but sideways to and fro.</p>
