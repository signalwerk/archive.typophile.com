      <p><em>Exactly what do they represent? Are they some kind of drawing or trial cut? What is fascinating and instructive is to see how very different they are from the finished font.</em><br>
      Sorry to have been away so long, but I had to run down a copy of the 1978 Munich Typographic Society publication on Paul Renner—found a mint edition from a bookseller in Stockholm for less than $35 including shipping. The illustrations in the book are all of drawings done by Renner. So, none of the images I posted were of type. The drawings were for alternate forms and weights for Futura Schlagzeile [Headline] (Bauer, 1932). It appears to me that ideas Renner tried out circa 1932 reemerged 20 years later in the less curvilinear Steile [upright] Futura. One other thing to consider is that these drawings appear to have been done after Bauer engineered Futura oblique. The second and third images posted are referred to as “Kursiv.” Whether that was Renner's term or one applied by those who cataloged his drawings is not clear. There is of course a distinction between cursive, italic, and oblique scripts. Unfortunately, the German word “kursive” makes it difficult to discern Renner’s position relative to italic v. oblique. In other words, was this a competitor to Futura oblique or an italic to accompany the headline type then under development. What is clear is that by 1932 he had dropped his insistence that artifacts of the hand had no place in the creation of modern typefaces.</p>
