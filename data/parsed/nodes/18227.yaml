      <p>I don't have the energy. In the meantime I have been looking at Charles Leonard's thesis, which is linked to in another Typophile thread, <a href="http://www.typophile.com/node/18165" title="http://www.typophile.com/node/18165">http://www.typophile.com/node/18165</a>, and thinking about the dichotomy between what Renner wants to do in his drawings and what he has to do in the finished type. His ideas are always consistently more radical than 'type' will accept. I am surprised that Hrant and some others have not had more to say about this. We tend to be so prissy and self-censoring in type -- it is a necessity, I suppose, but as a mindset it impedes creativity. Renner was fortunate to be able to work in a situation where he could do what he wanted and leave the censoring to others. However, either way, nothing radical ever gets put into widespread use. </p>
      <p>Karsten thinks philosophers shouldn't be connected to art or craft but I think this is rather limiting. Nietzsche spends his entire career obsessed with Wagner, and Heidegger spends most of his obsessed with Nietzsche, and large schools of their successors spend their entire careers obsessed with both. Walter Benjamin gives us the modern keys to looking at photography, reproduced art, mechanisation, appropriation and authenticity, all issues that are important to type. As regards appropriation, Edit DeAk has pointed out in an I think unpublished essay that current day appropriation can be compared to the book - you may own the book, but not what's in it (Well, can't you own your view of it?), and compares image appropriation to reading - if I read her correctly. You get at least some hints of these connexions in Charles's thesis and I wonder if they couldn't be profitably explored further? What is more hot button for type than authenticity, reproducibility, mechanisation, appropriation? A small thing I am surprised at in the Leonard thesis is the lack of attention given to Erbar, but I haven't yet read all of it.</p>
      <p>In the meantime I am wondering if any of the ideas (are they ideas? -- or are they just glyphs?) in Renner's Steile sketches couldn't be incorporated into a new version. 'Version' is an underexplored concept, isn't it now? Now that is really interesting.</p>
