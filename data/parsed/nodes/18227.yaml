      <p>That isn't a Berkeleyan question because at the very least, someone did see it: you. Even if nobody else ever sees it, your experience of having seen it cannot be separated from your interactions with others and the influence you have on others. So my very simple minded vote is, it exists. </p>
      <p>In the case of Renner's Futura variants, which were supposed to be the main event, we have the case where a few see them and most do not. In the case of the Steile sketches, we have something that was never made into type, and that only a very few have seen.</p>
      <p>But back to the point: it is now possible for a machine to create a hitherto unseen typeface. So, if nobody actually looks at the output, does it exist?</p>
