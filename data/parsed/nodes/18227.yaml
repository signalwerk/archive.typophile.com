      <p><em>there’s a reason that type design neophytes tend to make highly geometric fonts…</em></p>
      <p>It's one of several genres that don't require typographic sophistication, true.<br>
      But as has been mentioned earlier in this thread, Renner was a practised lettering artist and typographer when he started work on Futura. It's important to distinguish modernism in general from the historical modernist movement that occurred during the 1910s and '20s. Tschicold, for instance, grew up in a house where his father was a professional calligrapher/lettering artist, and he acquired those skills in his teens. Nonetheless, he abandoned the traditional nuances when he became a modernist. </p>
      <p>Bauer went along with Renner's radical letterforms, providing them as alternate sorts. They were eventually dropped through lack of sales. The same thing happened with Futura's old style figures. The market spoke, preferring the less busy letterforms</p>
