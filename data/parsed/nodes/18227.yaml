      <p><cite>-- you better not ask a philosopher about the design of a *particular* typeface.</cite><br>
      <cite>-- On the other hand, in some cases, you better not ask another type designer about a particular typeface! :-/</cite></p>
      <p>Yes! I often miss <cite>serious</cite> criticism of type -- not just nice articles about the latest stuff. But then: Only type designers have an eye educated enough to SEE details for they share the experience of designing type. Yet at the same time you never know if the criticism isn't just expression of personal amity or animosity, or of different approaches to type design (different "schools"). Who knows? Which means that a reader would need to be as critical (able to analyse) as the critic and have some information about work and personalities of both criticised and critic.</p>
      <p>[I hope my use of "critic" and "criticism" is correct. I remember an article about differences in the use of these words in the US and in Britain. But this was written pre-1900.]</p>
