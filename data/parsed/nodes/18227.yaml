      <p>Charles, I agree with your assessment. There is always the wish to tear down the giant, and with Renner we get some clues to how we could do this in the wildness of some of his drawings. But to make the leap from Renner doing wild drawings to Renner not knowing anything about type is to make the wrong leap. We have to consider also the profound cultural-psychological differences between homo Americanus and homo Germanicus of that period. Speer said something to the effect that what made war production so spectacular on either side was that you had rigid Germans who were suddenly given strong imperatives to sponantaneity, while on the other side, you had spontaneous Americans who were suddenly given stringent requirements towards rigidity. The result in both cases was spectacular advances in productivity. </p>
      <p>In his drawings I think you see Renner making this leap from rigidity to spontaneity. We have to get away from the idea that a drawing is of necessity a blueprint for manufacturing. It isn't. A drawing in type can have the same relationship to manufacturing that a drawing can to a painting, especially when we know that the draw-er is also a painter. To quote again from an as yet unpublished essay by Edit DeAk, </p>
      <p>'Drawing is the simplest way of establishing a pictorial vocabulary because it is an instant personal declaration of what is important and what is not. Drawing is the most unalienated medium: private, it practically doesn't have an audience in mind, just the artist's expression. Because it is private it can be measured by its idiosyncrasies.'</p>
      <p>And there you have one of many possible, valid prisms through which to view Renner's drawings. One can also view many of Gill's drawings this way. They are very far from being glyphs that the punchcutter will literally trace on the pantograph. They are not glyphs, in fact, but ideas for glyphs. And they are obviously intended as such. Now the punchcutter or pantographist or even the designer himself must somehow translate these ideas into type. But it is an imperative of creativity to have the idea for the glyph before you have the glyph itself, and that is the function of the free drawing. Can a 'z' be twice as wide as we think it can? Only one way to tell: try it.</p>
      <p>We have also to consider that for both Gill and Renner, there may have been a very clear expectation, there may have been an excellent idiomatic understanding, of quite precisely how one of their non-literal drawings would be translated into practical type by their collaborators. That being the case, there would be no need for them to expend any more effort. All type designers want to save time and labour whenever they can. (One gets the sense that was true also for van Krimpen, though to a lesser extent, and also that he was far too prideful and insecure to admit it, except indirectly.)</p>
    html_clean: |-
