      <p>&gt;if someone showed you “Topic”, would you have thought of Renner? </p>
      <p>I can easily answer that honestly with a no. It is outside all norms and precedent. In type, that is. But not in German culture of the 1950s. Take for example Mann's Krull, a contemporaneous work, which is so totally unexpected from just that hand. No doubt there are many much better comparative examples in the painting and literature of that period. That raises again the question of period. Are we to regard Steile as decisively a post-war work? Or does it represent a hidden spring running through the 1930s and 40s which never was allowed to run quite dry, thanks to the protective influence exercised by Speer, who was always trying to live up to Tessenow's expectations?</p>
      <p>&gt;Not to speak of the much better roman typefaces which mostly remained in the drawer.</p>
      <p>Exactly. The one commissioned by Speer should have been digitised and used to set the Renner book. Why doesn't anyone do anything with it, or at least explore its ideas? Not to mention its particular interest in one of the most daunting tasks in roman typeface design, aesthetically pleasing condensation which is, or should be, very much a green issue. Karsten, has anyone seriously looked into the possibility of digitising these typefaces? Like ... have you thought of doing anything with them? ? (Incidentally, what was Renner's opinion of Walbaum and Walbaum derivatives?) </p>
      <p>&gt;There is nothing more ironic than history.</p>
      <p>Yes ... to those lucky enough to possess both an irony gene and a history gene. But there are some who don't. One would like to know what Heidegger would have made of Steile Futura. Would he have seen in it some incarnation of the technological era he was describing? That is kind of what Dwiggins, in his skillful PR for Electra, claimed for that face, but it can't really be taken seriously as the typeface remains too influenced by the late 18th century transitionals so admired by Updike, whose influence on Dwiggins cannot be overestimated. Renner's Steile by contrast really does mark a decisive break with the past. One can imagine, going far out on a limb, that Walter Benjamin would have found Steile authentic, Electra not.</p>
