      <p>Karsten, Flusser sounds very interesting--what do you recommend of his? What available in English? </p>
      <p>On the issue of 'ugliness' of very small type, my main problem with Hrant's characterization is that if taken seriously it would mean that you can ignore aesthetics in small type, which I don't think is right. As Peter notes, the type might look decent from an aesthetic viewpoint at the intended size, even if wierd at larger sizes. And as Tiffany points out, some effective at small sizes at large have aesthetic interest of their own. So the better way to put this, I think, is that at small sizes changes have to be made for legibility that may look odd at larger sizes. I think that is about as far as one can go.</p>
