      <p>... it’s difficult for typographers to assess a typeface strictly on immersive grounds</p>
      <p>Yes. ...</p>
      <p>And that's why everyone is afraid to do a great small text face, with thousands of kinks, gouges, and traps ... something designed not to look good to a graphic designer, but to use density to convey letter shapes to readers in the most effective way possible. Because it's more than just gouges, traps, etc. Once you really start looking at what's happening in small text, and once you start letting go of making your letters look beautiful, you can really confront what it takes to get things to work at six or seven points. I'm not saying that a small text font has to be ugly when examined at 14 points, but I am saying it is the easiest way to design it, if you can be freed from that pretty-at-14 requirement. That said, Sumner Stone's new 5 point size of Cycles manages to be both functional and not ugly. But that's Sumner.</p>
