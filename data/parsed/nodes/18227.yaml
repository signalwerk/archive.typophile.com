      <p>I would say (but this is purely speculative) that it represents Renner's ultimate effort to assert himself creatively and to prove that he could also do that in a functional manner. In type we have a convenient scale: the more individual any typeface is, the less functional it is. We are all perpetually involved in trying to bridge this chasm - it is our great struggle in type design. Is not Topic's appeal that it represents a maximum of individuality with a minimal hit (though still not negligible) hit on functionality? I should be expressing this more elegantly, but you get the point. </p>
      <p>That this is so difficult to do is evident in the fact that there is nothing else we can really compare to Steile Futura in the history of type design. Nobody likes to be subservient: to craft, to form, to persons. Here Renner is saying, isn't he? 'Ich bin, zuletzt, Renner.'</p>
      <p>Was Renner familiar with Nietzsche's famous words from the preface to Ecce Homo? It would seem likely, and it should be possible to ascertain. In any case, they represent the sentiment that I am suggesting Renner may (must) have felt at this particular point towards the end of his life:</p>
      <p>'I have a duty against which my habits, even more the pride of my instincts, revolt at bottom, namely, to say: <em>Hear me! For I am such and such a person. Above all, do not mistake me for someone else!</em>'</p>
      <p>(author's italics)</p>
      <p>What better summary is there of the specific conflicts which lie under the hood of the German creative spirit? Man must assert himself, even though habit and 'pride of instinct' say NO!</p>
