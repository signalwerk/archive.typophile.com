      <p>Huuhhh, I see I must be careful with my not very proper English ...<br>
      No "wish to tear down the giant" on my part -- as said, I do admire Renner's work, his writings (unmatched til today), typography, his later type designs. But sorry, not Futura.<br>
      Yes, modernism reduced everything to the bare bones and is by nature "naive". Both the Bayer type and Renner's early drawings for Futura exhibit this. Just one example: Take the "special" lowercase "a" (the hook and the circle) and "g" (the circle and the triangle). This is not reflexion of the history of these forms, or their origins (say, in writing), but brutally pressing them into "elementary" clothes. (I am aware that there are "a" forms which look a bit more like studies into history, or an "e" which is almost unical. So, there are enough "but"s left for you.)<br>
      Compare this with Rudolf Koch's Kabel (Cable) which follows the same idea of going back to the basics -- but at the same time does it in a playful and ironic way. Ends of stems are not horizontal but slightly diagonal and thus maintain the idea of directionality of type. And Kabel lowercase "g" is a stroke of genius: it is at the same time more rigid in that it is strictly geometric, and is also very "calligraphic" -- it resembles a "g" form you find in Koch's roman (Marathon) and rotunda (Wallau) types as well. In some way, with respect to Koch's other typefaces, Kabel is the real surprise. Though not a "perfect" type either.</p>
      <p>hhp: <cite>But in any case: although I agree that one can never be 100% certain here, there’s a reason that type design neophytes tend to make highly geometric fonts… Also, one might even say that Modernism is anti-type.</cite></p>
      <p>Yes. :)</p>
      <p>hhp: <cite>It’s no secret that Gill didn’t do the fitting (spacing) of his fonts, leaving that supposedly menial task to the Monotype works boys; looking at some of his drawings, it seems that he didn’t even incorporate overshoots to the rounds in his drawings! How much of that is faith in the skills of another, how much is plain cavalier sloppiness/laziness?</cite></p>
      <p>Very interesting, I haven't paid attention to it before! A related idea: Can earlier type designers measured by the same standards as are today's type designers? It is not the same if someone gives in an sketch and some words and someone else does the "technical stuff", or if someone does it all on his/her own -- from the first sketch to the final product.</p>
      <p>But this is now *really* off-topic. Back to Steile Futura.</p>
