      <p>I am a bit amused about the question, if Renner or the foundry is to be considered the "author". (I exaggerate a bit, but this seems the essence of your post.)</p>
      <p>There has always been the conflict between type designer and foundry. A good foundry, past and present, deals critically with the type designer's work. Sometimes the type designer worries about this, sometimes the typeface profits from the foundries expertise -- sometimes both at the same time. :) I would be irritated if a typeface would NOT develop inbetween drawing and release! So I really don't understand the author question.</p>
      <p>At the time when Renner made the Futura, he obviously still was an amateur in type design, being a painter, then typographer first of all. Much of the refinement -- say, thinning round elements as they approach stems -- seems to come from the foundry.<br>
      But Renner learned a lot from working with Bauer, and drawings for his later typefaces show this. (And at a time he could complain that a foundry he worked with lacked the expertise he had experienced with Bauer.) My favorites are his later roman typefaces, by the way.</p>
      <p>Personal comment:<br>
      On the one hand, Renner is known for Futura most of all. (1) Futura indeed seems to own much to Bauer. Then, it seems still unsolved whether the Futura uppercase were by Renner or an architect; I am not up to date and don't know if this is settled now. (2) Futura was not the "new" thing as that it was advertised. Typefaces of this kind were on the marked since 1920, like a "Grotesk" by Wagner &amp; Schmidt in Leipzig, in 1931 issued as "Rund-Grotesk" by C.E. Weber. Unless you know all the internals of foundries -- which seems hard to get hold of -- you cannot really say "which came first". Also, around this time, various design schools taught lettering in the constructive style. This kind of typefaces was "in the air".<br>
      (If Futura is interesting, then not for the "innovation" as which it was sold (I consider this to be mere marketing, one shouldn't mistake marketing for historical fact), but for the still very "Germanic" remains in the first versions, like the long-s plus ligatures in this "moderne schrift".)<br>
      On the other hand, Renner proved to have become a master only with his later type designs -- which remain unknown. Steile Futura may be one of them; if someone showed you "Topic", would you have thought of Renner? Not to speak of the much better roman typefaces which mostly remained in the drawer.<br>
      There is nothing more ironic than history.</p>
      <p>Karsten</p>
