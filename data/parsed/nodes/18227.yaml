      <p>Nick, rather  than googling, why don't you call Matthew Carter, Sumner Stone, Frank Blokland, Robert Slimbach, Hermann Zapf, etc. and find out who I am and 'what I do.'</p>
      <p>Now could we get back on-Topic, please?</p>
      <p>Here's how my involvement started. </p>
      <p>Back in 1994 when Jeff Level and I were forming Adagio Type (Jeff, as you will recall, is the guy who Robert Norton in 'Types Best Remembered/Best Forgotten' said had the best eye for type in the industry), we were very interested in Topic. Jeff (who gave Robert Slimbach his first job when he was the director of the type department at Autologic) was then working for Precision Type, and used the Font Company version for an order form that was quite a brilliant piece of design. But the spacing on the FC version (which is identical to the one URW sells today) was so bad that he had to hand kern each single word. So one of the many ideas we had was to revise Topic, which we thought only needed a quick fix.</p>
      <p>It needed (1) a complete refitting and (2) in Jeff's perhaps overly-Aldine-influenced opinion, less tall caps. </p>
      <p>This was a project that over 12 years I kept on returning to. The first obstacle was fixing the digitisation, which was really rough. That took some time. The second problem was redesigning all the non-basic-set characters, like the ligs, quotes, and all the symbols, because FC had used generic, Helvetica-like characters, not the real thing. But getting into Renner's head is not a part-time job.</p>
      <p>This was something I did bit by bit, between other projects, whenever there was time, never giving it a solid slot of a few months to itself.</p>
      <p>Several years ago, Phan Nguyen became interested in the project, and gave me his original brochures and other artwork, because he was convinced that there were fundamental flaws in the FC design (based on a VGC photo master) that I was not considering. I of course took that seriously, but I still thought the VGC master was good enough.</p>
      <p>Now I look at where I am now and I am seeing some painful things.</p>
      <p>1. I overcorrected on the fitting, which makes the font I have unusable at under 50 points or so.</p>
      <p>2. Phan was right. There are a lot of problems in the artwork I was following. You see many weight problems amongst the individual characters. You see many problems when you compare it closely to the metal, which I have only recently begun seriously to do, and you also, at last, begin to see some faults in the metal that you would like to fix.</p>
      <p>One problem I have going forward is that I don't have complete character sets in sizes above 24 points or so. It would be nice to have a complete set in the largest size - was it 80? But there are so many other problems. You can see why I am reluctant to take this further on.</p>
      <p>Here's a sample showing FC/URW's data in red, and mine, based on Renner, in blue, at 780 points:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/e.jpg"></div><p></p>
