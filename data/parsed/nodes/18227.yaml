      <p>'What it does mean however is that the intent is not self-expression; that expression happens in spite of the designer - because he is human - he can’t help it.'</p>
      <p>Sorry, Hrant, I think you're making too big a leap there. Au fond, you are making the assumption that intent can be controlled, either externally or internally, that intent is monolithic, that intent can be even be accurately and fully described. I can't accept that. I find it too . . . simplified. Moreover, you would be the first to argue that nothing is black and white, grey is everywhere, etc. etc. I appreciate that you are trying to hone in on something here, and that doing so requires some brutal simplification. The reason I don't think it flies in Renner's case is that your argument implies lack of complex (and probably clearly articulated) intentionality on Renner's part. And that is simply inconceivable in someone who is artist, craftsman, intellectual, above all German of just that incredibly rich period. Burke can be forgiven for possibly not having a clear idea what constitutes a German intellect of the Weimar, Bauhaus, Nazi and postwar periods, but he makes it abundantly clear that Renner was one, even if he can't or simply doesn't care to qualify it. And that is a creature above all of clearly articulated intentionality. Generalities will not serve here. We are talking about Renner, a complex man in a complex time. I don't think Renner can be discussed non-contextually, and the context here is dauntingly complex and open to many more or less conflicting views.  I too am guilty of trying to oversimplify at this point, but I think I am always trying to keep context in view. Renner was living in times when you could turn on the radio to hear Heidegger give a lecture, or go outside to get involved in a street fight over Max Weber's latest lecture. In the midst of this inapprehensible cultural richness, you have the Nazis trying, largely successfully, and using the most brilliant propoganda techniques, attempting to impose a drastically simplified totalitarian world view that is fundamentally out of synch with the period that directly precedes it, and which could not have succeeded without Versailles, the Wall Street crash and the unbearable economic hardship that accompanies these events.</p>
      <p>Against this unbelievably powerful current Renner stands firm, deeply isolated, but never wavering in his opposition, even when the personal risk is huge and the penalties he pays are draconian and humiliating. This is someone who by intrinsic worth, and tried in the most frightening circumstances, defines intentionality. Moreover, of all people here, you are probably best equipped through personal experience to understand such a figure. May I suggest reading Burke's book, in which you might find a lot that you would understand better than most? Sereny's Speer would then be a good way to buy a lot of context at a fairly cheap price.</p>
