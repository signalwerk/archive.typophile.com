      <blockquote><p>•	Peignot : 1937 (Cassandre) (naked Art Deco-oriented)</p></blockquote>
      <p>too much stroke contrast and too constructivist. I would not consider this kind of typefaces as typical for the Humanist Sans category. Especially when one wants to consider such a thing as Neo-Humanist as a (sub-)category, typefaces such as Peignot should become a slot of their own. </p>
      <blockquote><p>•	Lydian : 1938 (Warren Chappell) (calligraphic and Koch-oriented)</p></blockquote>
      <p>too much stroke contrast to be included in Humanist Sans. </p>
      <blockquote><p>•	Optima : 1958 (Hermann Zapf) (incised latin-oriented)</p></blockquote>
      <p>too much stroke contrast to be included in Humanist Sans. By the time VOX and BS made up their classifications, there were hardly any typefaces like this, now there are enough to create something like Contrast Sans (suggestions, anyone?) </p>
      <blockquote><p>•	Eras : 1961 (Albert Boton) (incised latin-oriented)</p></blockquote>
      <p>Altough it relates more to Frutiger and TheSans and less to Gill Sans, I think that (ITC) Eras still is a very good example of the Humanist Sans. The ‘a’ is a bit idiosyncratic and the upper counter of ‘e’ is rather small, but in text sizes on the same x-height, it does not really perform different from Syntax I think.</p>
      <blockquote><p>•	Antique Olive : 1962 (Roger Excoffon) (the French answer to Helvetica/Univers and whose design is based on an olive!)</p></blockquote>
      <p>I would not consider Antique Olive as typical for the Humanist Sans category. When one wants to classify typefaces with a possibly small number of slots, I’d include it in Humanist Sans (in real life I did so). Today I’d rather label it in such a way that it may become clear that it is too exotic to belong to the core of Humanist Sans.<br>
      A similar case would be typefaces like DTL Prokyon : 2000 (Erhardt Kaiser), FF Daxline : 2005 (Hans Reichel) or Karbon : 2009 (Kris Sowersby). They are more or less built on the Humanist kind of stroke contrast, forms and proportions, but they do not belong to what I consider to be the core. </p>
      <p>I like to test my considerations on which typeface should belong in what class with the question ‘Could typeface X serve as a typographic alternative for typeface Y?’ The point is that Antique Olive could serve as a typographic alternative to FF Balance and vice versa. But if I’d take Syntax or Scala (all at the same x-height) I’d probably have to review my decisions on the appropriate line feed. If I’d switch to FF Meta or Helvetica, I’d probably have to review my complete layout (even when the x-height is a constraint). Switching between Novel, DTL Documenta Sans and FF Kievit would probably only evoke minimal changes.</p>
      <p>I think Identifont does an great job in quickly providing similar alternatives. Although I was surprised that DTL Prokyon and Karbon do not pop up as a first alternative to FF Daxline.</p>
