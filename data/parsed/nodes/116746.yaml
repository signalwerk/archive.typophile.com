      <p><strong>Humanist Sans</strong> started in England with Edward Johnston (<em>Johnston Underground</em>) and Eric Gill (<em>Gill Sans</em>).<br>
      There's a 80's  trend of typefaces called <strong>SuperFamily</strong> or <strong>Serial</strong>  that integrate <strong>Humanist Sans</strong> in their family.<br>
      They were odd examples before the 80's concerning <strong>SuperFamily</strong>.<br><strong>Neo Humanist Sans</strong> typefaces are refined, soft and perfect for text and some offer ligatures as in the Old style Serifs of the Renaissance. They sometimes have the flavor of the <strong>Neo Grotesque</strong> like <em>Helvetica</em> but tamed with the Renaissance readability.</p>
      <p>Let's get back to the 2000's and 2010's decades and what do you see as <strong>Neo Humanist Sans</strong>?</p>
