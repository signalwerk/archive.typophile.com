      <blockquote><p>Reading your reasoning for distinguishing a ‘tamed’ sub group, it sounds as if you think that the tamed ones are better than the others. I personally doubt wether this works out. I would not prefer to use ITC Officina, FF Nuvo or FF Unit for longer texts. Too my reading eye they’re all a bit too quirky and heterogenous, they ask too much attention. In the other hand, there are also some typefaces in the ‘original’ group which I would not prefer either. Johnston’s Underground and Gill sans are a bit too heavy and too blunt (the thins should be a bit thinner).</p></blockquote>
      <p>¶ I disagree. I find <em>FF Meta</em> to be good for reading. It's like a warm <em>Helvetica</em>. The Humanist Sans from the 1910's till the 1960's were just display style. This category per se is versatile and not that homogenous because you find a mix bag of showy leanings.</p>
      <blockquote><p>I do not know how you would classify Frutiger; I like its forms and in signage it often works out fine, but the regular weight of the original Frutiger family is a bit too heavy for reading black text on white or slightly toned paper I think. Fine in very small sizes, but too black in regular and larger text sizes. Neue Frutiger book may perform a bit better in regular and larger text sizes.</p></blockquote>
      <p>¶ <em>Frutiger</em> is a Humanist Sans: in my book, it looks like a rounded <em>Univers</em> or a humanized <em>Univers</em>—I am very fond of <em>Univers</em> because of its cinematic connotation. It's <em>Syntax</em> and <em>Polo</em> that start the 'neo' trend but they were oddities and almost the vanguard of things to come.</p>
      <blockquote><p>What I think I have learned through the years is that too much uniformity/homogenity (be it letterforms, stroke weight, counter widths or counter forms) tends to lead to letterforms that are harder to distinguish from each other. Futura and Univers Condensed set a good example here. On the other hand, too much individuality/heterogenity easily leads to ‘unrest’ caused by unusual letterforms and uneven grey values in words and lines. It can be seen in typefaces such as Gill Sans, Via, Rotis Sans etc. When designing for optimal legibility and readability in texts for longer reading, a balance between individuality and uniformity has to be found.</p></blockquote>
      <p>¶ I agree with you concerning these general rules.</p>
      <blockquote><p>Generally speaking, I think that the Grotesques (Transitional Sans as I’d call them) such as News, Trade and Franklin Gothic suffer from having half heartedly defined stroke contrast, mediocre proportions and unclear counters. The diagonally cut stroke ends of a, s and e mess up the white forms.</p></blockquote>
      <p>¶ I wouldn't be that harsh with those typefaces that work well as display, especially <em>Franklin Gothic</em>, the prototype of such category. I can cite many examples of use throughout the years that I admire. A company called Daystar Productions exploit that typeface with great results. It's a good workhorse on the whole.</p>
