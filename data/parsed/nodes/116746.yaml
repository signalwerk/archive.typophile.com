      <p>Dear Maxim, thanks for posting! In serif typefaces the angular and round counters usually behave more in line with old style/garalde and modern/didonic.<br>
      When I did the typeface classification for the Scangraphic Digital Type Collection in 1990, I subdivided Garalde into Old Face and Old Style and subdivided Didonic into Modern Face and Modern Style. I used the ‘Face’ groups for the typefaces that closely followed the historical models and the ‘Style’ groups for the more free interpretations. Thus I avoided to throw all newer and difficult-to-classify typefaces into the ‘Variation’ or ‘Display’ box.</p>
      <p>This resulted in:</p>
      <p><strong>Old Face</strong><br>
      Bembo, Garamond, Palatino, Sabon …</p>
      <p><strong>Old Style</strong><br>
      ITC Esprit, ITC Slimbach, Swift, Vendôme …</p>
      <p><strong>Modern Face</strong><br>
      Bodoni, Basilia, Walbaum …</p>
      <p><strong>Modern Style</strong><br>
      Bernhard Modern, ITC Century, Engravers, ITC Zapf International …</p>
      <p>Thinking this over, one could do the same for Humanist Sans Serif and Modern Sans Serif (Neo-Grotesque) today. But I would like to avoid ‘Neo’ in a set classification terms which also makes use of ‘Modern’. Or the other way round of course.</p>
