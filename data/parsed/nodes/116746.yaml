      <p>I think it's the use of the term "Neo' here which is confusing the issue. I personally break my sans serif type into 3 basic categories: Grotesque, Geometric &amp; Humanist. Neo, implies that the tradition of humanising the sans either a) stopped and restarted or b) that there was some sort of evolutionary 'jump' in the genre itself, neither of which, I personally adhere to. Which makes a 'Neo humanist sans' something of a misnomer for me.<br>
      As an addendum, I similarly don't find the term Neo Grotesque helpful or meaningful in any way in terms of evaluating a design's provenance.</p>
    html_clean: |-
