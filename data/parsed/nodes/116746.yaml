      <p>When one would like to split up Humanist Sans  into sub-groups, the idea of distinguishing between classical/circle/old style and classicist/oval/modern proportions (as shown by Maxim) makes sense to me. </p>
      <p><strong>Humanist Sans</strong><br><em>with classical/circle/old style/garalde proportions</em><br>
      Underground : 1916 (Edward Johnston)<br>
      Gill Sans : 1928 (Eric Gill)<br>
      Syntax : 1968 (Hans Eduard Meier)<br>
      Today Sans Serif 1988 (Volker Küster)<br>
      FF Scala Sans : 1993 (Martin Majoor)<br>
      Cronos : 1996 (Robert Slimbach)<br>
      FF Quadraat Sans : 1997 (Fred Smeijers)<br>
      DTL Haarlemmer Sans : 1995 (Frank Blokland)<br>
      DTL Documenta Sans : 1997 (Frank Blokland)<br>
      FF Seria Sans : 2000 (Martin Majoor)<br>
      FF Nexus Sans : 2004 (Martin Majoor)<br>
      Novel Sans : 2010 (Christoph Dunst)</p>
      <p><strong>Humanist Sans</strong><br><em>with classicist/oval/modern/didonic proportions</em><br>
      Goudy Sans : 1930 (Frederic W. Goudy) <em>how sans is that?</em><br>
      GST Polo : 1972 (Georg Salden)<br>
      Congress Sans : 1985 (Adrian Williams)<br>
      ITC Quay Sans : 1990 (David Quay) <em>how sans is that?</em><br>
      ITC Officina : 1990 (Erik Spiekermann)<br>
      FF Meta : 1991 (Erik Spiekermann)<br>
      DTL Argo : 1992 (Gerard Unger)<br>
      Via : 1999 (Bo Linnemann)<br>
      FF Unit : 2003 (Erik Spiekermann/Christian Schwartz)</p>
      <p>But unfortunately, I happen to have some left-overs:<br>
      Frutiger : 1976 (Adrain Frutiger)<br>
      FF Nuvo : 2008 (Siegfried Rückel)<br>
      FF Yoga Sans : 2009 (Xavier Dupré)<br>
      TheSans : 1994 (Lucas de Groot)<br>
      Parisine : 1996 (Jean-François Porchez)<br>
      Parisine Office : 2005 (Jean-François Porchez)<br>
      Parisine Plus : 1999 (Jean-François Porchez)<br>
      Productus : 2000 (Petr van Blokland)<br>
      Fresco Sans : 2001 (Fred Smeijers)<br>
      Sense : 2010 (Nick Shinn)<br>
      Sensibility : 2010 (Nick Shinn)<br>
      According the ‘proportion rule’ they’d fit in the ‘oval’ category, but when you compare them by their overall look-and-feel, most of them fit in the ‘circle’ category. Another distinguisher would be to look at the construction. One could distinguish between an interrupted construction (such as in all Humanist Sans with ‘circle’ proportions as listed here) and a running construction (such as in Frutiger). For explanatory illustrations, have a look here:<br><a href="https://www.flickr.com/photos/albert-jan_pool/9209545848/in/set-72157629679838154">https://www.flickr.com/photos/albert-jan_pool/9209545848/in/set-72157629...</a><br>
      and here:<br><a href="https://www.flickr.com/photos/albert-jan_pool/9131677869/">https://www.flickr.com/photos/albert-jan_pool/9131677869/</a><br>
      but this knife does not provide a clean cut either. Using both would do so, but it would also leave us with a large group of ‘incorrect hybrids’, which does not make sense when it comes to usability.</p>
      <p>I doubt wether ‘ligatures’ or ‘small caps’ is suitable for distinguishing typefaces. Today, almost all non-display typefaces have these slots filled in some way or another. And even if they are not necessary or appropriate for the style, it is likely that some slot-filler will be doing this within the next few years in order to boost up the number of characters in a font. </p>
      <p>What I like about this discussion is that no one seems to be inclined to include high contrast sans serifs such as Optima and Pascal within this group (as suggested by the BS classification).</p>
    html_clean: |-
      <p>When one would like to split up Humanist Sans  into sub-groups, the idea of distinguishing between classical/circle/old style and classicist/oval/modern proportions (as shown by Maxim) makes sense to me. </p>
      <p><strong>Humanist Sans</strong><br><em>with classical/circle/old style/garalde proportions</em><br>
      Underground : 1916 (Edward Johnston)<br>
      Gill Sans : 1928 (Eric Gill)<br>
      Syntax : 1968 (Hans Eduard Meier)<br>
      Today Sans Serif 1988 (Volker Küster)<br>
      FF Scala Sans : 1993 (Martin Majoor)<br>
      Cronos : 1996 (Robert Slimbach)<br>
      FF Quadraat Sans : 1997 (Fred Smeijers)<br>
      DTL Haarlemmer Sans : 1995 (Frank Blokland)<br>
      DTL Documenta Sans : 1997 (Frank Blokland)<br>
      FF Seria Sans : 2000 (Martin Majoor)<br>
      FF Nexus Sans : 2004 (Martin Majoor)<br>
      Novel Sans : 2010 (Christoph Dunst)</p>
      <p><strong>Humanist Sans</strong><br><em>with classicist/oval/modern/didonic proportions</em><br>
      Goudy Sans : 1930 (Frederic W. Goudy) <em>how sans is that?</em><br>
      GST Polo : 1972 (Georg Salden)<br>
      Congress Sans : 1985 (Adrian Williams)<br>
      ITC Quay Sans : 1990 (David Quay) <em>how sans is that?</em><br>
      ITC Officina : 1990 (Erik Spiekermann)<br>
      FF Meta : 1991 (Erik Spiekermann)<br>
      DTL Argo : 1992 (Gerard Unger)<br>
      Via : 1999 (Bo Linnemann)<br>
      FF Unit : 2003 (Erik Spiekermann/Christian Schwartz)</p>
      <p>But unfortunately, I happen to have some left-overs:<br>
      Frutiger : 1976 (Adrain Frutiger)<br>
      FF Nuvo : 2008 (Siegfried Rückel)<br>
      FF Yoga Sans : 2009 (Xavier Dupré)<br>
      TheSans : 1994 (Lucas de Groot)<br>
      Parisine : 1996 (Jean-François Porchez)<br>
      Parisine Office : 2005 (Jean-François Porchez)<br>
      Parisine Plus : 1999 (Jean-François Porchez)<br>
      Productus : 2000 (Petr van Blokland)<br>
      Fresco Sans : 2001 (Fred Smeijers)<br>
      Sense : 2010 (Nick Shinn)<br>
      Sensibility : 2010 (Nick Shinn)<br>
      According the ‘proportion rule’ they’d fit in the ‘oval’ category, but when you compare them by their overall look-and-feel, most of them fit in the ‘circle’ category. Another distinguisher would be to look at the construction. One could distinguish between an interrupted construction (such as in all Humanist Sans with ‘circle’ proportions as listed here) and a running construction (such as in Frutiger). For explanatory illustrations, have a look here:<br><a href="https://www.flickr.com/photos/albert-jan_pool/9209545848/in/set-72157629679838154" class="link-external">https://www.flickr.com/photos/albert-jan_pool/9209545848/in/set-72157629...</a><br>
      and here:<br><a href="https://www.flickr.com/photos/albert-jan_pool/9131677869/" class="link-external">https://www.flickr.com/photos/albert-jan_pool/9131677869/</a><br>
      but this knife does not provide a clean cut either. Using both would do so, but it would also leave us with a large group of ‘incorrect hybrids’, which does not make sense when it comes to usability.</p>
      <p>I doubt wether ‘ligatures’ or ‘small caps’ is suitable for distinguishing typefaces. Today, almost all non-display typefaces have these slots filled in some way or another. And even if they are not necessary or appropriate for the style, it is likely that some slot-filler will be doing this within the next few years in order to boost up the number of characters in a font. </p>
      <p>What I like about this discussion is that no one seems to be inclined to include high contrast sans serifs such as Optima and Pascal within this group (as suggested by the BS classification).</p>
