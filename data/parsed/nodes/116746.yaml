      <blockquote><p>If I follow the above statement, Neo-Humanist Sans is a Humanist Sans tamed with Neo-Grotesque properties</p></blockquote>
      <p>Yes, that sounds like a good description. Reading your reasoning for distinguishing a ‘tamed’ sub group, it sounds as if you think that the tamed ones are better than the others. I personally doubt wether this works out. I would not prefer to use ITC Officina, FF Nuvo or FF Unit for longer texts. Too my reading eye they’re all a bit too quirky and heterogenous, they ask too much attention. In the other hand, there are also some typefaces in the ‘original’ group which I would not prefer either. Johnston’s Underground and Gill sans are a bit too heavy and too blunt (the thins should be a bit thinner). I do not know how you would classify Frutiger; I like its forms and in signage it often works out fine, but the regular weight of the original Frutiger family is a bit too heavy for reading black text on white or slightly toned paper I think. Fine in very small sizes, but too black in regular and larger text sizes. Neue Frutiger book may perform a bit better in regular and larger text sizes. FF Nexus has an elegant look and feel because of its long ascenders and descenders. Still the stroke contrast is low, so everything within the x-height is still a bit too spotty for a long text. Also, the long ascenders and descenders need generous leading. Which is fine when lines are long, but a nuisance when they’re short.</p>
      <p>What I think I have learned through the years is that too much uniformity/homogenity (be it letterforms, stroke weight, counter widths or counter forms) tends to lead to letterforms that are harder to distinguish from each other. Futura and Univers Condensed set a good example here. On the other hand, too much individuality/heterogenity easily leads to ‘unrest’ caused by unusual letterforms and uneven grey values in words and lines. It can be seen in typefaces such as Gill Sans, Via, Rotis Sans etc. When designing for optimal legibility and readability in texts for longer reading, a balance between individuality and uniformity has to be found. Generally speaking, I think that the Grotesques (Transitional Sans as I’d call them) such as News, Trade and Franklin Gothic suffer from having half heartedly defined stroke contrast, mediocre proportions and unclear counters. The diagonally cut stroke ends of a, s and e mess up the white forms. The German philosopher Anselm Feuerbach once stated ‘Mediocrity is always the correct weight, except the scales are not true’. I think this also goes for typefaces. Seen from that point of view, the Neo Humanist Sans as you define it has a high potential. But maybe most of designers who tried their luck in that area have been putting too much ‘design’ in their typefaces? I think that the linear character of sans serif typefaces asks for another approach. It suppresses heterogenity, but to enhance it, we should probably not replace it by introducing highly individualized letterforms, too much stroke contrast etc. Having seen the experiments that Ann Bessemans did for her research project is that of all modulations she applied to the sans serif typeface Frutiger in order to enhance their legibility for children with learning problems, the outcome was that most of these did not really work out. Changing the proportions of Frutiger was the only thing that showed a statistically significant improvement for beginning readers when it comes to comparing within the group of sans serifs. In this interview <a href="http://opentype.info/blog/2013/10/01/type-design-children/">http://opentype.info/blog/2013/10/01/type-design-children/</a> she focuses on serif versus sans serif for obvious reasons, but the idea of studying spatial frequencies and rhythm within typefaces could also tell us something about designing legible sans serifs. I think that it should be considered to test some of the sans serif typefaces with classical proportions against those with grotesque (= ‘mediocre’) proportions. Or test proportionally varied versions of the same typeface to get clearer results.</p>
