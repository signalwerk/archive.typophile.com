      <blockquote><p>•	Peignot : 1937 (Cassandre) (naked Art Deco-oriented)</p></blockquote>
      <p>¶ This typeface is a Humanist Sans because of its contrast and width. At first glance, it can be seen as a Geometric Sans but it's not, really not. When you look at it closely, you find a reference to the late Didot style by Jules Didot. There's even a reference to the uncial calligraphy: see the small cap "g".</p>
