      <p>John Hudson’s homage to Borges:</p>
      <p>According to ‘a certain Chinese Encyclopædia,’ <em>The Celestial Emporium of Benevolent Knowledge</em>, typefaces are divided into the following categories: </p>
      <p>1. those used to typeset the words of the Emperor,<br>
      2. no longer available ones,<br>
      3. those that are good for ‘the small print’,<br>
      4. the ones you used last week,<br>
      5. those that remind you of former lovers,<br>
      6. fabulous ones,<br>
      7. those in unknown formats,<br>
      8. those included in the present classification,<br>
      9. those you have forgotten,<br>
      10. innumerable ones,<br>
      11. those that are too light to be used for the present job,<br>
      12. others,<br>
      13. those in which the g ‘just looks wrong’,<br>
      14. those that will be used to typeset this list.</p>
