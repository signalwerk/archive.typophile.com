      <blockquote><p><em>I think it’s the use of the term ‘Neo’ here which is confusing the issue. I personally break my sans serif type into 3 basic categories: Grotesque, Geometric &amp; Humanist.</em></p></blockquote>
      <p>In my opinion, <em>neo</em>-Humanist sans-serifs are closer to the [neo-]Grotesques and American ‘Gothics’ than to Humanist sans. Similarly to Humanist sans, they do feature very open apertures, but their proportions come from good old grotesque sans-serifs. Using Galina Bannikova’s binary classification, one could say that the proportions of Humanist sans are circle-, and the neo-Humanist sans oval-based.<img src="/sites/default/files/old-images/Neo-Humanist_Sans-Sm_6704.jpg"></p>
