      <blockquote><p>¶ The Humanist Sans from the 1910's till the 1960's were just display style.</p></blockquote>
      <p>Yes, but that is mainly because of the thins being too thick. Geometric Sans from that period wasn’t much better either. The way you’d like to define Humanist Sans would leave us with a group of typefaces that is too small to be useful in daily life. What other typefaces do you think that would fit in, next to Johnston Underground, Gill Sans and maybe Granby?<br>
      Looking at my list of Humanist Sans again, I’d include DTL Caspari : 1993 (Gerard Daniels), Bliss : 1996 (Jeremy Tankard), Foundry Sans : 2003 (David Quay, Freda Sack), FF Kievit : 2005 (Mike Abbink) FF Milo : 2006 (Mike Abbink) and Calluna Sans : 2010 (Jos Buivenga) now.</p>
      <blockquote><p>¶ Frutiger is a Humanist Sans</p></blockquote>
      <p>Agreed. As I said, I am inclined to include most of my ‘left-overs’ into the Humanist Sans as well. But then I do not get why you label Today Sans Serif und TheSans as ‘Neo’. To me, these typefaces have much more in common with Gill Sans, Syntax and Frutiger than with ITC Officina, Via and FF Unit.</p>
      <blockquote><p>¶ I wouldn't be that harsh with those typefaces that work well as display, especially Franklin Gothic, the prototype of such category.</p></blockquote>
      <p>I was thinking about reading text (like you seem to intend with ‘neo-humanist’), not about display quality.</p>
