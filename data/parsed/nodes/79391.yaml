      <p>Try...</p>
      <ol>
      <li>Switching to INDEX mode;</li>
      <li>Select ALL;</li>
      <li>SORT GLYPHS by Unicode;</li>
      <li>Switch to CHARMAP mode; then</li>
      <li>Generate your font</li>
      </ol>
      <p>Sorry: can't offer any advice about Mac voodoo...</p>
