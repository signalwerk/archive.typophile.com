    html: <p>I like the more stencilled and eroded serif typeface. Not sure about Futura as its companion. I would opt for a more 'common' font like Helvetica Inserat (possibly eroded too?) to emphasise the cardboard-feel. In stead of making your type black, I'ld use a very dark grey. How about adding some black-line boxes with texts in them and/or icons like 'this side up' and 'handle with care'? Or is that too funny considering the subject?</p>
