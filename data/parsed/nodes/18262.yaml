      <p>I don't mind the John Lewis logo.<br>
      There was a John Lewis in Norwich when I was there, and I used to go by it often.<br>
      Streamlined art-deco brick building.<br>
      First time I saw the logo I thought, oh, post-modern Gill mod(ification).<br>
      That's what a lot of the world looks like; the new imposed on the old, rather than something fresh which integrates old and new themes from the ground up.<br>
      The logo connects past and present, conservative and modern, which is what everyone wants. Yeah it's ugly, but PoMo ain't about harmony.<br>
      It makes sense in that they use straight Gill as their corporate face.<br>
      Bear in mind that this is just a logo treatment, not a typeface.</p>
      <p>However, it would have been preferable for Lewis's to start fresh with a new logo and custom corporate font. Quite a few UK firms do that. last year was a banner year, with Smith's <a href="http://www.channel4.com" rel="nofollow">Channel 4</a> face and Barnes &amp; Schwarz's <a href="http://www.guardian.co.uk/theguardian/story/0,,1566047,00.html" rel="nofollow">Guardian</a> face unavoidable.</p>
