      <p>RE: What exactly do you mean by Post-Modern here? That design should ignore aesthetics?</p>
      <p>I don't think you are bothering to read what Nick is saying here. He explained his idea succinctly &amp; very well. He wasn't defending po-mo just describing it. You are still reacting to the design alone. </p>
      <p>Personally I think equating Po-mo aesthetic with ugliness is silly. Also, I want to highlight one the points Nick was making indrectly. It isn't neccesary for a type face to be conceived with 'Po-mo' in mind for the use or design using that type to be Po-mo.</p>
      <p>It is probably true that it is harder to make a type face with long term value while satisfing a po-mo urge than it is to make one without. But those 90's po-mo stuff did sell stuff - not becvause they were ugly ( even if they were perhaps ) but because they said things in a 'voice' that was exciting at the time. They had a purpose &amp; the purpose was served.</p>
      <p>All that said; I do think the John Lewis Logo is incredibly dubious.</p>
      <p>Here is a po-typeface that works quite well for it's purpose:</p>
      <p><a href="http://www.mutek.ca/2006/index.php?lang=en" title="http://www.mutek.ca/2006/index.php?lang=en">http://www.mutek.ca/2006/index.php?lang=en</a></p>
      <p>And I don't think it's ugly. Maybe it's not a face for the ages but... so what? </p>
      <p>Oh yeah. That fruiger rip-off sucks in principle.</p>
