      <p><em>Not in typefaces and logos.</em></p>
      <p>Typography is not immune to Post-modernism.<br>
      Compare the present-day post-modern use of a generic sans, Arial, to the modernist use of a generic sans, Helvetica, 40 years ago. Then, Helvetica would be used for formalist reasons, as a reductive design that works well in a minimalist layout. Now, Arial would be used because it is the default that everybody uses. Non-aesthetic design logic.</p>
      <p>The idea behind the John Lewis logo is that their corporate face, used for POP and media advertising (see their web site) is off-the-shelf Gill Sans, and the logo is a "treated" version of it.</p>
