    html: |-
      <p>That John Lewis logo sure is irritating. You can just imagine the thought process:</p>
      <p>“Say, have you noticed some of these new fonts have a snipped-off look on the tall bits?”<br>
      "Yeah, isn’t it cool?!”<br>
      “But theirs all go in the same diagonal direction.”<br>
      “Why would that be?”<br>
      “Dunno. Boringggg!”<br>
      “Hey, I'll flip that diagonal angle over!”<br>
      “Wicked!”</p>
      <p>The resulting J is a 3D extrusion of a round-bottomed vertical stroke. The L is another extrusion, this time of a sans L in severe perspective. The h gets off without any butchery for some reason. The e suffers because someone on the team likes Trebuchet.</p>
      <p>It’s particularly irritiating for me since I loved the old lettering on the shop in Reading (and hankered after obtaining it one day). John Lewis stores often retained the name of the shop they'd taken over: for decades Reading's John Lewis store was called “Heelas”. And it was those six letters, in huge white caps, that were proudly outside the big store until only 3 or 4 years ago. Central office must have got the jitters that the brand might not be getting through. Happily, I heard the sign was so well loved among staff that it now resides in the garden of one of the execs. At least it wasn't scrapped.</p>
