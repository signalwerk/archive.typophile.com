    <p>see the image attached or see this PDF for example:</p>
    <p><a href="http://www.b-rail.be/corp/N/assets/pdf/antwerpsenoord-zuidverb.pdf" title="http://www.b-rail.be/corp/N/assets/pdf/antwerpsenoord-zuidverb.pdf">http://www.b-rail.be/corp/N/assets/pdf/antwerpsenoord-zuidverb.pdf</a></p>
    <p>other fine examples can be found here:<br>
