      <p>The site you link says that these "ugly" designs are "easy to use, fast to load, and uncluttered" and not slick. </p>
      <p>Si, that sounds like good design to me. Pretty isn't the only thing to good design. Actual ugliness I can't believe helps if you are selling clothes and furniture, like John Lewis. </p>
      <p>What the article I think is saying is that slickness and polish doesn't necessarily help help sell. I've heard of this for example for used cars and other cut rate stuff. If you look too slick and pretty people think it's too expensive for them. You can have good design that isn't slick or pretty, but I don't know where ugly helps.</p>
