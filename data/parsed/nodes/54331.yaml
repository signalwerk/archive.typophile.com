    <p>can you give me any feedback on this logo? they love it, I showed them a couple rounds of concepts that showed various plays on saws/horses, incorporating an actual saw horse into the letter ’w’ or ’m’ etc. </p>
    <p>They ultimately liked this one the most because its like a saw blade and blades of grass (which they love), and nods to the company’s creative + simple approach to web projects. </p><div class="imageWrap"><img src="/files/grasshorse2_4480.png"></div><p></p>
