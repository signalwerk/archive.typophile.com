    <p>Hi there</p>
    <p>I would be eternally grateful  (well for a couple of hours at least!) if anyone can help me to find the name of the font used in the Lambeth Council Logo.  the url for the homepage is  <a class="freelinking external" href="http://www.lambeth.gov.uk/home.htm" rel="nofollow">http://www.lambeth.gov.uk/home.htm</a></p>
    <p>Thanks in advance for any suggestions offered.</p>
    <p>Cheers</p>
    <p>ben</p>
