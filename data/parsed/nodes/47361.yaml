      <p>One way to discourage this sort of thing is to mention software legalities in your original contract with your client.</p>
      <p>While it’s hard to deal with a bullying client, you should really say no to a bullying third party, such as the printer in this case. Hopefully, your client will not see this as a negative, but respect your professionalism.</p>
      <p>Printers are the last people that designers should let themselves be pushed around by, because the relationship should be the other way around—you want to be in the mindset where you say: the colour you printed doesn’t match the PMS number, reprint the job.</p>
