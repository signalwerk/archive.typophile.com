      <p>AS noted, it’s very odd that any printer only uses CorelDraw. If they are a PC shop, and their designers prefer CorelDraw, that’s fine. But how could they survive not having any Adobe apps? This cant’ be the first and only time this has happened. If they were a serious Printer they’d have to have the Adobe CS, even if they preferred to use CorelDraw for their in house designs.</p>
      <p>I use CorelDraw all the time, and I can’t see any issues with converting the fonts to outlines, except that the files will get larger, possibly much larger, if there’s a considerable amount of text. This would only be an issue if the printer used inadequate hardware, for instance if his machine lacked the memory to process it. This could be the problem, and rather than fess up to not having current machines, he’s putting the blame on you by saying there are phantom “other issues” with using outlines.</p>
