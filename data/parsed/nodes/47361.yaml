      <p>“Anyway, sorry for the rant but it left me annoyed and confused.”</p>
      <p>I really feel sorry for you. What seems to have happened, based on previous similar experiences, is that the printer has convinced your client that he can modify and edit your designs for future events and save the client some money by not needing you as a middle go-between. I stopped using Quark years ago because it wouldn’t let me outline fonts. Since then I always outline fonts. With the fonts passed on to them, I’ve had printers make edits and completely bungle a layout due to their design ineptitude. </p>
      <p>Beyond what the crowd here would say about the EULA of the fonts, it’s more about your work. I would hate to be put in the position you were put in, but I’d have to tell the client and printer that any edits to my work need to be done by me. You might lose the client, but it doesn’t sound like the client cares too much about the relationship with you anyway and is looking to cut you out of the deal if possible.</p>
