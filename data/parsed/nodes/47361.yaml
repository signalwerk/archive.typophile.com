      <p>JAZZ:</p>
      <p>If this cowboy is only using Corel Draw he should be out of business pretty soon. Anyway - you could just provide a generic EPS file with all fonts converted to outlines. That will open perfectly in any pro vector app.</p>
      <p>I worked in digital offset print prepress for five years in the late nineties and nearly all the files we received were in Quark 4 on Mac. This meant that all design studios sent us the original quark file, with separate graphic files used in the document AND all fonts used. Yes that is against most EULA’s but Adobe PDF was not a robust prepress application like it is now with spots, embedded fonts, PANTONEs etc.<br>
      We always requested the designer’s fonts as even if we had the font there could be subtle differences in different releases or iterations of the same font which could ruin the typesetting of a job.</p>
      <p>Most of you guys here have a few years on me - what was your modus operandi during those years?</p>
