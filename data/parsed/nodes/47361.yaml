      <p>It sounds very fishy. I agree with those who say the printer is angling to cut you out and grab your part of the pie. If one is in the printing business, 90% (at least) of the work you’ll get will be in some sort of Adobe files. It would just be plain bizarre to try run a shop that only uses Corel.  This from a Corel user. I would be possible, but not worth the effort. For the money and headaches you’ll save, go out and buy Illustrator, Indesign, &amp; any other design software in use. (or in this guy’s case, steal them.)</p>
      <p>The problems with fonts converted to outlines sounds like bunkum to me. Since Adobe so completely dominates the Graphic arts software biz, The one thing Corel has to do to survive is import Adobe files properly, which it does. The only time I’ve ever had any problem has been due to version compatibility issues (older version trying to import files saved as a newer version). </p>
      <p>(edit to add, Corel’s support of Open Type only extends to the common character set so it could cause problems, but not if converted to outlines)</p>
      <p>-=®=-</p>
