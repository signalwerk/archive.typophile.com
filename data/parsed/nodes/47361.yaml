      <p>From what I figure, the problem here is your printer (or his attitude).<br>
      My clients don’t decide on the printer; I present a design which they approve, and then I deceide on a suitable printer (according to the needs of the project). I have worked with the same printer for a couple of years now, and I have never had any problems so far. He works on PC, I’m working on Mac. I provide PDF files with outlined text. I don’t provide fonts - ever. Works just fine.</p>
      <p>I only had an issue once with a PDF file generated through Illustrator, where an embedded Photoshop file was altered. It worked just fine on the Mac, but apparently not on PC. Unfortunately I only saw the error when I came collecting the job :-(<br>
      We were able to sort out the problem by running some tests on his PC. So far I’m very happy with my printer.</p>
