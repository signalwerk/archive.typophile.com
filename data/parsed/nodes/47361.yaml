      <p>The major issue for any printer you deal with should be: Is he/she capable of printing/outputting this job, as designed. Period. That means they need to become capable of handling PDFs and the resultant workflow. Any time I’ve allowed a printer to make changes, and every single time they’ve made changes to my work without consulting me, they have made mistakes, created bigger problems than they were trying to solve, or completely ruined the job. Unless you are part of a house that does design, prepress and print, those roles are best left separate. </p>
      <p>This does not presume that designers never make unprintable work, but it is the general rule. </p>
      <p>If the printer feels the need to make changes, that sounds like they are trying to get the work away from you and that possibly they have convinced a cheap or unethical client that they will save money this way. Delete both from your address book. They deserve each other. You should definitely talk to the client separately, and get a clear sense from them of their needs and intention. Ask them point blank if they are unhappy with your rates or with your work. Help them clarify why they use you and not Dimwit Printing for design. If they prefer cheap over quality, they should make that choice once and for all, and be professional enough to communicate that with you directly, and not enlist the printer to make an ugly mess as a cowardly mechanism for firing you.</p>
