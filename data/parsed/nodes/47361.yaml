    <p>And I’d like any opinions on it please.  I’ve recently started a project for a new Delicatessen, designing their stationery, logo, wine &amp; cheese cards etc.  In addition, they own a bar and restaurant two doors down.  I’ve not done any work for these guys before so I want to make a good impression.</p>
    <p>Anyway, they’re promoting some jazz nights at the bar and I did a A6/postcard flyer for these nights, which they then took to their printer - who incidentally lives literally around the corner from my office.  Now what I usually do is either create a PDF with the fonts embedded as standard, and whoever (as in printers) I’m dealing with, this doesn’t seem to be a problem.  If they prefer, I tend to save as an eps file with all font converted to outlines.  The printer in this case work in CorelDraw on a PC - I work on a Mac using Illustrator.  Anyway, with this in mind, on this occasion I converted fonts to outlines to avoid the historical font issues between the two platforms.</p>
    <p>Now the printer called me and asked for all the fonts and a version of the design with the text intact so that he could edit the text if it needed changing (I never send anything to a printer until it’s approved anyway, so they shouldn’t need to be altered).  I explained to him that I wasn’t happy to hand over fonts that I’d paid for, and I also explained that if the fonts I’d used for Mac only it wouldn’t be any use anyway.  He kept on insisting he needed the fonts, and that converting them to outline causes other problems - which he didn’t seem to want to elaborate on.  He also let it be known that the client was actually with him at the time, which made me think  “is he trying to make me look difficult or inadequately qualified in front of the client?”.</p>
    <p>Anyway, to cut a long story slightly shorter, I reluctantly handed over one of the fonts, so as not to appear awkward, but ended up having to replace another font for one of his fonts to make the artwork usable (this was Clarendon Bold, which I thought he’d have anyway).  I was unhappy about this as the artwork wasn’t quite as I’d intended, and he’d sort of used the client (who he’s known for over 20 years), plus I felt manipulated into doing something I didn’t feel was right on a least two levels.</p>
    <p>Anyway, sorry for the rant but it left me annoyed and confused.  I’ve been in design for about 10 years, but this guy has been in the print trade for over 30 and I did feel a little like a kid when he spoke to me, due to his years in the print trade! So, my questions to you guys are;</p>
    <p>* Is it ok to convert to outlines to avoid these issues, like all other printers I’ve worked with have suggested?</p>
    <p>* If he’s using CorelDraw, what format do you reckon is best for him, coming from Illustrator CS3?</p>
    <p>* Have any of you guys experienced this kind of thing yourselves, where you’re made to think you’re doing something wrong, even when you’re sure it’s right!?</p>
    <p>Any opinions gratefully welcome.</p>
    <p>JH</p>
