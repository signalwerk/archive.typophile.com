      <p>You have taken away some of his income and he is just being difficult.<br>
      He knows the client, and knows they are ’in the dark’ when it comes to the print processes, so I guess considers them a soft touch.<br>
      You do have to be careful as the printer will almost definitely cut you out of the loop and go direct the client questioning your ability to supply the artwork ’properly’ even if this is obviously not true, so he can charge to put it right.</p>
      <p>If its not to late, and even if it is, get another quote from a ’proper’ printer and put it to your client. My guess is that it will be cheaper (and better quality) than the existing printer. I would be so annoyed if I was in your position that I would not even add the 30% handling charge and just put your client in touch with a printer you trust. </p>
      <p>Good luck</p>
