    html: <p>I’m not intending to start a “which software is more professional” argument, but in my experience, the kind of printers who _only_ use Corel Draw are the kind of printers who focus on doing work for people who happen to have a copy of Corel Draw, and aren’t designers (so, things like business cards, flyers, etc.). They tend not to be too concerned about courting the business of designers, and thus don’t tend to stay very up to date with the software and methods that designers are using. So I’m in agreement with the others here. Avoid this guy (and others like him) if at all possible.</p>
