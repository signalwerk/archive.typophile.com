    html: <p>One factor is you are often not dealing directly with the person who does the work. You go through a rep who passes the work to a supervisor and then it goes to the designer, then it's given to the proofreader, and you get billed for each of their times. And each of those folks is billed at a high rate, and even if it takes 3 minutes they probably round their time up to 15 or 30.</p>
