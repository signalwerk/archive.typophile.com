    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Font%20Retailers" class="freelinking" rel="nofollow">Font Retailers</a> : Veer</strong></p>
    <p>Veer provides visual elements for use in professional creative work, such as graphic design, motion design, advertising and filmmaking. Products include stock photography, illustration, maps, typefaces, and unique design-related merchandise. Products are showcased on the website <a href="http://www.veer.com/" rel="nofollow">veer.com</a> and in regular direct-mail <a href="http://www.veer.com/ideas/catalogs/" rel="nofollow">catalogs</a>.</p>
    <p>As part of the company's ongoing involvement in the design community, the creative folks at Veer also maintain <a href="http://blog.veer.com/" rel="nofollow">The Skinny</a>, a lively design and pop-culture influenced weblog. Veer also hosts the type-related animated shorts <a href="http://www.veer.com/ideas/btt/" rel="nofollow">"Behind the Typeface: Cooper Black"</a> and <a href="http://www.veer.com/ideas/etched/" rel="nofollow">"Etched in Stone"</a> -- both produced by Typophile regular <a href="/wiki/Cheshire%20Dave" class="freelinking" rel="nofollow">Cheshire Dave</a>.</p>
    <p>Veer sells fonts from the following foundries: <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a>, <a href="/wiki/Alias" class="freelinking" rel="nofollow">Alias</a>, <a href="/wiki/Atomic%20Media" class="freelinking" rel="nofollow">Atomic Media</a>, <a href="/wiki/Cabinet" class="freelinking" rel="nofollow">Cabinet</a>, <a href="/wiki/Device%20Fonts" class="freelinking" rel="nofollow">Device</a>, <a href="/wiki/Elsner%2BFlake" class="freelinking" rel="nofollow">Elsner+Flake</a>, <a href="/wiki/Font%20Bureau" class="freelinking" rel="nofollow">Font Bureau</a>, <a href="/wiki/Fountain" class="freelinking" rel="nofollow">Fountain</a>, <a href="/wiki/G-Type" class="freelinking" rel="nofollow">G-Type</a>, <a href="/wiki/IHOF" class="freelinking" rel="nofollow">IHOF</a>, <a href="/wiki/Jukebox" class="freelinking" rel="nofollow">Jukebox</a>, <a href="/wiki/Lanston%20Type%20Co." class="freelinking" rel="nofollow">Lanston Type Co.</a>, <a href="/wiki/Letraset%20Fontek" class="freelinking" rel="nofollow">Letraset Fontek</a>, <a href="/wiki/Mean%20Tangerine" class="freelinking" rel="nofollow">Mean Tangerine</a>, <a href="/wiki/P22" class="freelinking" rel="nofollow">P22</a>, <a href="/wiki/Red%20Rooster" class="freelinking" rel="nofollow">Red Rooster</a>, <a href="/wiki/Rimmer%20Type%20Foundry" class="freelinking" rel="nofollow">Rimmer</a>, <a href="/wiki/Sherwood%20Type%20Collection" class="freelinking" rel="nofollow">Sherwood</a>, <a href="/wiki/ShinnType" class="freelinking" rel="nofollow">ShinnType</a>, <a href="/wiki/Test%20Pilot%20Collective" class="freelinking" rel="nofollow">Test Pilot Collective</a>, <a href="/wiki/The%20Type%20Trust" class="freelinking" rel="nofollow">Type Trust</a>, <a href="/wiki/Umbrella" class="freelinking" rel="nofollow">Umbrella</a>, and <a href="/wiki/Virus" class="freelinking" rel="nofollow">Virus</a>.</p>
