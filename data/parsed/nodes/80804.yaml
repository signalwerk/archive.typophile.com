    <p>Hi there.<br>
    I'm struggling to find the bold uppercase font used on this flyer for the text:<br>
    LAUREN HARRIS<br>
    GARETH POWELL<br>
    NOT THE ROLLING STONES<br>
    DJ SCRUBS</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/invite_5444.jpg"></div><p></p>
    <p>It's got a pretty distinctive 'J' and 'R' but the usual methods don't get close. The distressing looks custom or maybe a result of the stock used. </p>
    <p>A thousand thank-you's in advance for any help. Great board.</p>
    <p>DG</p>
