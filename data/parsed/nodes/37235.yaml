      <p>very nice, voobshche!<br>
      a couple concerns:<br>
      the body of the Ф is nice and large, but the main stroke endings (top and bottom) are likely to get lost at smaller sizes. this stroke can actually overshoot the cap height line and the baseline and will generally improve the appearance of this glyph.<br>
      the arms on ЖКжк seem splayed a bit too much to me. if the diagonals could be a bit more upright, i think these glyphs would look better. the ж looks a bit extra wide in the lower case, but i seem to always make mine too narrow, so it might be just right.<br>
      the upper bowl on the я could be a bit larger.</p>
