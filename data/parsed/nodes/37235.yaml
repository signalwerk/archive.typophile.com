      <p>oh, i like it, Jos!</p>
      <p>i prefer your previous rectangular lc forms, because they have some "wave" a bit corresponding to latin lc. please give more play over them, and more play with center-crossed lowercases like -в-я-з- maybe something like your -a- or -e- forms? </p>
      <p>you can make left leg in -л- (and -д-) more flowing, and make diagonal in -и-й- (and even horizontal in -н-) less geometric. </p>
      <p>-м- looks unclear for me, -П-п- looks too wide, -У- and -Я- looks too narrow, -б- looks old-timed, -Й-й- be better with a bit bigger breve. </p>
      <p>maybe right oval in -ф- will be better if you mirror them? maybe top of oval in -ь- can follow -b-? and you can animate tails in -ц-щ-</p>
      <p>sorry for my english and good luck with this beauty!</p>
