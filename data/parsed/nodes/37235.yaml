    html: |-
      <p>I like first б better. I don't particularly like your ж (I guess я and к are still also the problem), it is very weak at the bottom and bold at the top. I think you should entirely redesign the relation between the lower legs and the top parts in ж, я and к (both UC and lc). </p>
      <p>I think л and д are not a bit better, though still not balanced enough. The "shelf" in д is still too short — it realy needs to be visible in small sizes. The LEFT edge of the right tooth in д should be located slightly to the RIGHT of the RIGHT edge of the right stem of д. In other words, the right tooth of д should be clearly off limits of the right stem of that letter. </p>
      <p>Regards,<br>
      Adam</p>
