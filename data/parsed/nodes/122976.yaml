    html: <p>For cover, I suggest Linotype <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/neue-helvetica" rel="nofollow">Helvetica Neue</a>. looks the closest to me (/1 top bar length, /t foot curvature and crossbar length...). Couldn't tell for the body text but still 'Helvetica'.</p>
