    html: <p>Frutiger Next is Linotype's revision of the original digital Frutiger. They've been re-working some of the classics like Syntax, Sabon, and Optima. One big difference is that Frutiger Next has a real italic and not just a sloped roman. <br> <br>I thought Myriad Pro had small caps, too.</p>
    html_clean: <p>Frutiger Next is Linotype's revision of the original digital Frutiger. They've been re-working some of the classics like Syntax, Sabon, and Optima. One big difference is that Frutiger Next has a real italic and not just a sloped roman. <br> <br>I thought Myriad Pro had small caps, too.</p>
