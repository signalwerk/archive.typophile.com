    html: <p>As a side note, I've used the semibold weight in Myriad Pro as small caps for the regular weight, a touch narrow, but very close in weight at the default 70% reduction in InDesign. It matched up nicely with figures set in proportional old style. Not a great solution for a lot of text, but adequate for corporate identify projects.</p>
