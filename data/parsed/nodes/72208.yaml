      <p>I agree with James on this. It feels too stiff and formulaic to me. There are slight variations in the stroke widths, specifically on the horizontals, in the sign that aren't there in the digital interpretation. This then causes the letterforms to generally have much wider bowls and counters in the digitization as a result. I think a more careful observation of the idiosyncrasies of the sign would have yielded a more honest &amp; human typeface, rather than one that appears to have been made with fontstruct.</p>
