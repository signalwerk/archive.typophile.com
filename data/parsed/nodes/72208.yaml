    html: |-
      <p>I did notice that most of 'farquarts' comments being rather on the negative side.</p>
      <p>And I agree with both James and Penn; I did not capture those metallic, rusty forms, but just made a digital interpretation of the original. But then again, that was my intention. I was not looking for accurate reproduction of each individual glyphs.</p>
      <p>Steelworks is a font, not a sign. To be true to the original, 'V' would look way too thin, and 'W' and 'M' would just look weird, and I had to interpolate lots of glyphs. So, some compromises had to be made.</p>
