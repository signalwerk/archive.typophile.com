    html: |-
      <p>Perhaps it is difficult to plan which idiosyncrasies to include when an application for the design is unspecified. If Steelworks is needed for layouts that include images of the Henry Avenue Forge sign or similar signs, then the typeface is successful without idiosyncrasies.</p>
      <p>If it is meant to stand alone and give the impression of this sign, then some idiosyncrasies are needed. Blatant errors should not be replicated and material textures ought not be represented in the type, but small bevels, rounds and curves should carry over. It is important to take advantage of your tools by creating what Fonstruct cannot.</p>
    html_clean: |-
