      <p>It's strange that your interpretation removes the qualities that attracted you to this lettering, Tomi.<br>
      Why not retain the charming proportions (e.g. the squareness of E) and something of the legibilty-challenging idiosyncrasies?<br>
      Wouldn't the design challenge be to resolve that issue, rather than avoid it?<br>
      Steelworks is a straightforward techno font, nothing wrong with that, but quite apart from whether or not it is stiff and a bit flat, and how useful the face may be, you have missed an opportunity to do something more informed by the source material and more interesting.</p>
