      <p>There is no need to duplicate lookups, just drag same lookups into your  feature, the same way you would associate lookup with feautres in different scripts or language systems:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/features_3500.JPG"></div><p></p>
      <p>OpenType layout does not allow to references between features. Your example is only AFDK syntax to include all lookups from one feature to another.</p>
      <p>Thanks,<br>
      Sergey</p>
      <p>P.S. There is no search available in MSN Groups :(</p>
