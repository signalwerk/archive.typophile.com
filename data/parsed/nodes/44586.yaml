  html: |-
    <p>How do I add the <a href="/wiki/aalt" class="freelinking" rel="nofollow">aalt</a> feature? </p>
    <p>feature aalt {<br>
        feature locl;<br>
        feature onum;<br>
        feature case;<br>
        feature frac;<br>
        feature calt;<br>
    } aalt;</p>
    <p>Do I  copy the lookups? For example, the local feature is  local_MOL  and the lookup is sub Scedilla scedilla by Scommaaccent scommaaccent</p>
    <p>Access All Alternates &lt; aalt &gt;<br>
      local_MOL<br>
      onum_latin<br>
      case_latin<br>
      frac_latin<br>
      calt_latin </p>
    <p>Thank you.</p>
