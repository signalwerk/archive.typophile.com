      <p>What are the priorities in a package design?<br>
      To inform the consumer of what is in the box?<br>
      To tell the consumer who made the stuff in the box?<br>
      To protect and contain the product?</p>
      <p>All of these are necessary, of course, but it seems that brand identification has taken precedence over product identification with the new design. The only text smaller than the "INSTANT OATMEAL" line is the one that says "ARTIFICIALLY FLAVORED". It does allow more space to display the product photo without an intersecting orange rectangle, but without close inspection it could be any kind of mush. </p>
      <p>There are reasonable arguments on either side regarding promoting brand over product, but Quaker is such a well recognized brand, especially in the context of oatmeal, that the logo speaks for its self, and it doesn't need to be spelled out in bold letters larger than anything else on the box. The new design tells me the opposite. There is no question that this is a Quaker product, but is it oatmeal?</p>
