      <p><em>it’s precisely because digital filters make effects so easy that they suddenly proliferate where not needed.</em></p>
      <p>But surely they are a legitimate and integral part of, for instance, the "Peaches &amp; Cream" lettering on the left package?<br>
      Without the dropshadow, the light weight white-on-orange type would not stand out strongly, as indeed is the case with those words on the new package, where they have been given less importance, relative to the brand name, than before. </p>
      <p>I suspect that both designs are representative of an evolving concept of brand packaging at different points in time, going from something which spells out OATMEAL and an exciting flavor, Peaches &amp; Cream, in big jazzy letters, to something cool and discreet that doesn't need to shout what is an established flavor, and focuses on the wordmark Quaker and the picture of the product. The new corporate-technical look also has a nutraceutical vibe; I can't see what else is on the package, but I bet there's something about how healthy oatmeal is.</p>
