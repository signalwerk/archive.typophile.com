    <p></p><div class="imageWrap"><img src="http://typophile.com/files/QuakerOats_4095.jpg"></div><p></p>
    <p>Yesterday, I went to my local supermarket to pick up more Instant Quaker Oatmeal for my mother-in-law. (The only thing she eats anymore, god bless her, at 92.)</p>
    <p>At first I couldn't find her beloved Peaches &amp; Cream - and then I did, looking like a box of elbow macaroni.</p>
    <p>I was wondering what you thought about this. It isn't a "design" question - I felt it more appropriate in general discussion, as hopefully, none of us designed this.</p>
    <p>The one on the left was the package they have been using for years, nicely balanced, well thought out - fun with type...<br>
    the one on the right is there new and improved - or as they say, "New Look, Same Great Taste."</p>
    <p>I don't want to influence you - but am I the only one that thinks they hired a kid out of school who had to prove he was worth the salary they were giving him?</p>
    <p>I'd love to hear your opinions. Honest. </p>
    <p>P.S. I know that Quaker Oats was having some problems and the US government made them change some of the claims on their packaging. That might have been the excuse for a new design, but I would have liked to see a design first.</p>
