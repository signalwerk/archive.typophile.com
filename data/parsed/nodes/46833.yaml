      <p>Alas, a grocery post! Growing up in the family grocery store, stocking boxes of Apple Jacks, Cocoa Puffs, and Sugar Smacks at age ten, I was fortunate to get weekly, intimate exposure to package design. Some I loved, others I hated. My brother and I would sit together in an aisle, on milk crates, and every once in a while pose a "which is cooler?" question. Liquid Plumr or Drano? Betty Crocker or Duncan Hines? Speas or Tree Top? Hi-C or Haiwaiian Punch?</p>
      <p>Not many things in the grocery store are more classic than that Quaker Oats cylinder. It breaks my heart every time a brand chooses to redesign its packaging for the sake of "updating." Yes, I love technology (but not as much as you, you see), but thank God for Quisp. I think it's the only kid's cereal cartoon character that hasn't been destroyed with Illustrator gradients.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/quisp-cereal_5851.jpg"></div><p></p>
      <p>As for the new Quaker packaging, fine. Go ahead and ruin a good thing. That's about all I can say anymore. I'm tired of seeing it happen. Creamette, Mountain Dew, Oxydol... But if I could have my way, I think it would make much more sense to model the instant oatmeal packaging after the classic cylinder, something more like this one:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/quaker-oats_3997.jpg"></div><p></p>
      <p>The bottom line is I'm sick to death of drop shadows, gradients, and outer glows, and I crave flat colors and hard lines. It's an opinion, I suppose, but I often wonder how much package updating is done only because it has become so easy to do it, and student-just-out-of-school or no student-just-out-of-school, 21st century designers love their digital effects.</p>
    html_clean: |-
