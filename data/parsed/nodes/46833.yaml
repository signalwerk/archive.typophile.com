      <p>(This has nothing to do with type...this is an anything-goes general discussion, I hope!)</p>
      <p>James...</p>
      <p><cite>That’s a simplistic load of nonsense, transparently unscientific and not true at all. </cite></p>
      <p>I understand that our bodies are complex, and I am impressed with your explanation. But, simplistic as that old proverb may be, it holds true for me. Our bodies take what they need from what we put into them, be it through eating, drinking, breathing, or by needles. Without scientific evidence to back it up, I'm willing to believe that good, wholesome inputs are the preferred building blocks for our bodies, and that artificial ingredients, chemicals, and corn corn corn cause unnecessary stress on our bodies. Can the ol' bod handle it? Sure. Would it rather not? Probably.</p>
      <p>(This has a little bit to do with type)</p>
      <p>I might be one who comes off as resistant to change, but not so fast... I don't care for change for the sake of change, and I don't see all change as progress. I am more interested in timelessness, and I get bummed out when I see what I thought was a timeless piece of design tossed out the window in favor of today's cutting-edge style. Change for the better, on the other hand...that is something I like very much.</p>
