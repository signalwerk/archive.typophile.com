    html: |-
      <p>Yes, this is from an era* when -with few exceptions- fonts were only ever stored in the printer's firmware and all the computer sent to the printer was ASCII codes (plus some control codes). I remember however that some printers did allow you to download custom fonts to the printer - which is how my brother and I got Armenian (and Arabic) to print on our Star Micronics NX-1000, circa 1983! It <em>might</em> be possible to go the other way and get the fonts out of a/that LQ 1050, but of course they won't be bezier-curve fonts, so they can't really be re-used...</p>
      <p>* Although for duplicate forms impact printers <em>still</em> matter...</p>
      <p>hhp</p>
