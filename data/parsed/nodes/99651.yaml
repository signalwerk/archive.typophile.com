      <p>a little online research hints that these are fonts available only through installation of your printer, and only seen by the printer. it may be that you have them on an installation disc or that they are hidden in your system somewhere. they seem to be named "Font11a" and the like. here's an article that shows some of this info.</p>
      <p><a href="http://sandstorm36.blogspot.com/2012/09/proper-fonts-for-dot-matrix-printers.html" title="http://sandstorm36.blogspot.com/2012/09/proper-fonts-for-dot-matrix-printers.html">http://sandstorm36.blogspot.com/2012/09/proper-fonts-for-dot-matrix-prin...</a></p>
      <p>note: this is simply a guess, based on the examples provided.</p>
