    <p>Hi,</p>
    <p>Does anybody know if when you ask for the services of one credit card processing company you get a way to set up the 'download link' as well? Or is it something you have to solve by yourself using PHP, etc?</p>
    <p>On top of that... any suggestion for a particular company?</p>
    <p>Thanks in advance.</p>
    <p>R.</p>
