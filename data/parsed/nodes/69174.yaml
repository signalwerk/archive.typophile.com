    html: |-
      <p>There are all-in-one services for Electronic Software Distribution (ESD) that do the credit card thing as well as providing the download (link). They charge a bit more than services that do just the credit card transaction, though.</p>
      <p>I am using PayPal, where it is called "Instant Payment Notification" (IPN). You have to implement the ESD yourself with PHP but it's not too difficult. Have a look at their documentation and sample PHP code.</p>
