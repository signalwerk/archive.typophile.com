      <p>Ramiro,</p>
      <p>Whatever is your final CC processing solution, may I suggest that you incorporate some sort of e-mail verification before allowing the download. Our payment gateway is set up to send a verification e-mail to the purchaser. The purchaser then has to follow an activation link and re-enter their username and password. Since installing this system, we have had no cases of CC fraud.</p>
      <p>If you allow a direct download after processing the CC you are asking for trouble.</p>
      <p>James</p>
