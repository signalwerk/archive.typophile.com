      <p>A good way to start is through learning the basic letterforms, so calligraphy is always helpful. It helps to understand how negative space (at least the space between the letters) relates to the letters themselves. But of course the work you list here is highly diverse, in letterform and the ability to use it. So yes, learning to perfect this takes a very long time.</p>
      <p>An important key in all the examples that you list is understanding contrast. In that aspect calligraphy helps as well, since you learn to build contrasts naturally (because of the tool you use, the pen, creates this automatically)</p>
      <p>Your question is so 'huge' that it's difficult to answer, but if you enjoy hand-lettering, an calligraphy course is always nice to do. Of course finding the right calligraphy course is also problematic, but I'm sure other people from around New York will have some pointers.</p>
