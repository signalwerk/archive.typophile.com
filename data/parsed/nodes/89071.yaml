      <p>I'm not sure learning calligraphy will be of much help for doing lettering like these guys. All of this stuff is what is known as "built-up" lettering, in which the letters are drawn, not written as in calligraphy. The spencerian examples are like a certain kind of calligraphy, using a split nib pen, but I highly doubt that these were done that way, in spite of how they look.</p>
      <p>There are as many ways of making built-up lettering as there are people doing it. Here are some books I would recommend to get you started:</p>
      <p><em>Logo, Font, and Lettering Bible,</em> by Leslie Cabarga.</p>
      <p><em>Dangerous Curves,</em> by Doyald Young.</p>
      <p><em>Lettering for Advertising,</em> by Mortimer Leach.</p>
      <p><em>Lettering for Reproduction,</em> by David Gates.</p>
      <p>Cabarga's book is probably the most comprehensive, and covers using computers for lettering in great detail. Young's book addresses design more than technique, but does give you a good idea how he worked. The other two predate the digital age and would give you a good insight into the way the old guys did it. Mortimer Leach was Doyald Young's teacher.</p>
