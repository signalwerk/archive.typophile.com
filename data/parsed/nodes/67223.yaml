    <p><em>Hello Respected Typohiles.</em></p>
    <p>Recently i tried to do an experiment of using too many typefaces in one single composition &amp; try to make them sync together &amp; create an interest.<br>
    I don't know did it really worked on not, but when i shared the composition with people i got a very two-sided response. Some viewers loved it in first go &amp; agreed that this works perfectly &amp; on the other side some viewers just totally discarded it &amp; said its too confusing &amp; bizarre for their eyes. </p>
    <p>What do you all think ?<br>
    <em>Critisim,feedback is much appreciated.Thanks!</em></p>
