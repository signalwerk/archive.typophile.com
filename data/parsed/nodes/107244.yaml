    html: |-
      <p>Thanks for the better pic.<br>
      I had to download your original pic to make any sense of it. I edited it to look like this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/UnknownStencil107244_3502.jpg"></div><br>
      I looked at various stencil fonts and none were a good match either for a base font or choice of where to make the stencil gaps.<br>
      I suspect this is custom logo work.<br>
      Anyway the base font is close to Helvetica Neue Black.<br>
      I did some cuts and minor further editing of A and the result looks like this:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/HelveticaNeueBlackStencil_5283.jpg"></div><br>
      Pretty close.<br>
      You could do the same to reproduce this part of the logo.<br>
      Don<p></p>
