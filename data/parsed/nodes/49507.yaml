      <p>I went to my copy of Updike's "Printing Types" and looked at the sections on "Italian Types 1500-1800". He shows a type specimen from Rome in 1628 called "Canon Grosso" from the Stamperia Vaticana. This has the same G of your sample and other letters also seem consistent with your Roman sample. The type is named according to size, apparently, with "Ascendonica" being a similar typeface in a smaller size. The italic is called "Corsivo Grosso", but it does not match your samples. One thing Updike describes is how much of Italian printing during the 17th century mixes typefaces, using whatever is at hand, so perhaps this should not be surprising.</p>
      <p>I could not find a sample of an italic that matches yours. I notice that the italic 'g' varies quite a bit in your samples.</p>
      <p>- Mike Yanega</p>
