    html: |-
      <p>This is how I started the revival. It's all wrong. I made way too many assumptions and did not even start using the actual proportions of the typeface.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/attempt1_6078.jpg"></div><br>
      Later on, with the help of a teacher, (Erik van Blokland) I realized that I was making a mistake, a big one and started from scatch. I made a high resolution scan and superimposed from 6 to 9 prints of each letter. This helped me to find the maximum average surface of every letter, as if the ink spreaded out more or less evenly from the center of the ductus of the letters in the surface of the lead type.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/maximums_4344.jpg"></div><br>
      This exercise allowed me to understand the real proportions of the original typeface even if I didn't have any information regarding details such as shape of the serifs, etc. The next logical step was to start drawing with the information available but from the inside out, avoiding assumptions about the details and concentrating efforts on the proportions and the desired characteristics of the revival. The shapes derived from this exercise can certainly be far from the original but at least provided a solid ground for drawing.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/attempt2_3580.jpg"></div><br>
      New shapes emerged when trying to be respectful to the self-imposed limits. I borrowed some shapes typical from 15th and 16th century typefaces such as Adobe Garamond Pro to fill the "empty spaces".<br>
      <div class="imageWrap"><img src="http://typophile.com/files/attempt3_4396.jpg"></div><br>
      Next step consisted on trying to simulate a texture with the few drawings available. The tool available at adhesiontext.com was a great help on this.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/textura_3745.jpg"></div><br>
      Now I am trying to complete the lowercase set. Your feedback will be greatly appreciated.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/textura minusculas_6243.jpg"></div><p></p>
