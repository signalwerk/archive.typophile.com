      <p>Well, that’s quite a tricky one, and it’s hard to say what your chances are to actually find out ...</p>
      <p>My guess for the italic is:<br>
      This font is from poorly justified matrices (too much letter spacing/tracking and dancing baseline) from punches by Robert Granjon.<br>
      Some letters like ‘r, m, n, p, a, t, g, long s’ share characteristics with Granjon’s italics.<br>
      (Some letters like ‘z’ look as if these were later additions/replacements. But then again, Granjon’s italics were quite popular, and therefore often imitated, so probably it’s not by Granjon at all.)<br>
      It’s quite possible that the capitals of the italics are from a different font.</p>
      <p>My advice:<br>
      Measure the fonts (caps height, x-height, measurement for 20 lines) and compare with Vervliet's article on Granjon (I hope you have access to a library with good typography books):</p>
      <p>H. D. L. Vervliet: ‘The italics of Robert Granjon’,<br>
         in: Typography Papers 3 (1998), pp 5–59</p>
      <p>Also these two books are quite useful:<br>
      J. Dreyfus: Type specimen facsimiles I (1–15)<br>
      H. D. L. Vervliet, H. Carter: Type specimen facsimiles II (16–18)</p>
      <p>Good luck.</p>
