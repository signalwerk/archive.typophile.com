  html: <p>All I know is that it comes from a book printed in Venice, ca. 1694. The name of the book is Cicceide Legitima, by Francesco Lazzarelli. These are some pictures from pages of the third edition. Notice the unusual shape of the g in both roman and italic versions. Any help will be greatly appreciated. </p><div class="imageWrap"><img src="http://typophile.com/files/DSC04518_3952.JPG"></div><div class="imageWrap"><img src="http://typophile.com/files/DSC04525_6016.JPG"></div><div class="imageWrap"><img src="http://typophile.com/files/DSC04530_3716.JPG"></div><p></p>
