      <p>What's your aim with this font? Your method leaves you with "soft" looking letters - you would get that with letterpressed ink spread of course, but in that case the physical impression also lends a sharpness that your font won't have. </p>
      <p>Your method has given you very solid proportions, though, it seems to me.</p>
