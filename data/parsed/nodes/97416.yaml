    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Figure 1 Color Typeface Comparison Legibility Illustration Credit Steve Matteson Monotype Imaging_3809.jpg"></div><br>
    Typeface Legibility Attributes (Credit Steve Matteson) <p></p>
    <p>Monotype and MIT AgeLab co-present at Telematics Munich 2012 on the Impact of Typeface on Driver Demand. Monotype Imaging is a Gold sponsor of Telematics Munich 2012– Europe’s largest telematics conference, Oct. 29-30, at Munich Hilton Park Hotel. </p>
    <p><a class="freelinking external" href="http://www.telematicsupdate.com/munich/conference-agenda.php#1key" rel="nofollow">Presentation: The Impact of Typeface on Future HMIs</a></p>
    <p>Join Monotype’s Dave Gould and Massachusetts Institute of Technology (MIT) AgeLab Research Scientist Bryan Reimer as they present results of a new <a class="freelinking external" href="http://cts.businesswire.com/ct/CT?id=smartlink&amp;url=http%3A%2F%2Fagelab.mit.edu%2Ffiles%2FAgeLab_typeface_white_paper_2012.pdf&amp;esheet=50419415&amp;lan=en-US&amp;anchor=MIT+AgeLab+white+paper&amp;index=1&amp;md5=e86ffc072f7278e682a71f7404d38840" rel="nofollow">study</a> that sheds light on how optimizing typeface design can reduce driver distraction. They’ll examine how focused typeface design can enhance human-machine interface (HMI) ergonomics to produce user interfaces that align with European Commission specifications.<br>
    Monday, Oct. 29 at 16.05-16.40, Conference Room A</p>
    <p>Full results of the study are available in an <a class="freelinking external" href="http://agelab.mit.edu/files/AgeLab_typeface_white_paper_2012.pdf" rel="nofollow">MIT AgeLab white paper</a>, in addition to a <a href="http://www.youtube.com/watch?v=BMP5cuAYG_Q&amp;feature=youtube_gdata_player" rel="nofollow">video</a> that highlights the research and its findings.  </p>
    <p><a class="freelinking external" href="http://www.telematicsupdate.com/munich/conference-agenda.php#1key " rel="nofollow"> Panel: Designing superior HMIs: HTML5, Smartphone Integration and Beyond</a></p>
    <p>Vladimir Levantovsky, Monotype’s senior technology strategist will take part in a Telematics panel to examine the potential of new UI development tools such as HTML5 to enrich the user experience. The panel will examine how to boost the automaker’s scope for intuitive HMI solutions that aid in establishing multiple points of connectivity. Moderated by IHS iSuppli senior infotainment analyst, Luca De Ambroggi, the panel will include experts from Continental, RIM, Symphony Teleca, and Luxoft.<br>
    Monday, Oct. 29 at 16.40-17.15, Conference Room A</p>
    <p>For more information about Monotype’s automotive expertise, click <a class="freelinking external" href="http://www.monotypeimaging.com/markets/automotive.aspx?prn=yes" rel="nofollow">here</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Figure 1 Color Typeface Comparison Legibility Illustration Credit Steve Matteson Monotype Imaging_3809.jpg"></div><p></p>
