    <p>Though strictly not type related it is relevant in a round about way :) </p>
    <p>Basically I’ve just finished my second year on my graphics course moving in the direction of exhibiton design along with information graphics. However my tutor suggested I use a programme to create 3D maps and layouts of areas for exhibitons, thing is I suggested CAD (I’ve never used it so I know I’m being quite dim but I know its used for 3D mapping) she suggested another programme but for the life of me I can’t remember what it was. </p>
    <p>So can any one suggest a programme that would be relevant to mapping space for a mac? </p>
    <p>Thanks in advance</p>
    <p>Bec x</p>
