      <p>I don't know how much it could have been customized but the base looks definitely "<a class="freelinking external" href="http://www.myfonts.com/search/bookman" rel="nofollow">Bookman</a>". Your best chance is probably to start with <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/bookmania" rel="nofollow">Bookmania MS</a> by Mark Simonson, "a revival of Bookman Oldstyle (1901) and the Bookmans of the 1960s, but with all the features you would expect in a modern digital font family."<br>
      Here are your /<a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/bookmania/semibold/glyphs.html#glyphs/519883/910" rel="nofollow">M</a>, /<a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/bookmania/semibold/glyphs.html#glyphs/519883/548" rel="nofollow">B</a>, /<a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/bookmania/semibold/glyphs.html#glyphs/519883/992" rel="nofollow">O</a>, /<a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/bookmania/semibold/glyphs.html#glyphs/519883/1052" rel="nofollow">R</a>, /<a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/bookmania/semibold/glyphs.html#glyphs/519883/1430" rel="nofollow">e</a>, /<a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/bookmania/semibold/glyphs.html#glyphs/519883/1814" rel="nofollow">s</a>...</p>
