    html: |-
      <p>I think it's quite good for a first attempt, but there are many more fonts like this. You should look up those fonts and make sure your font is clearly different.</p>
      <p>A font like this should also work great at pixel level. Say 8 pnts without anti-aliasing. To make this happen you should stick to a grid of 8 by 8 in your font-editor.</p>
      <p>It seems your strokes don't have the same thickness everywhere, e.g. the middle horizontal stroke in a and e is to thick. This might also be an optical illusion, but in that case you should also change it. You should also have another look at the @.</p>
      <p>Good luck!</p>
