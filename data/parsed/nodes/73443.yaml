    html: |-
      <p>I think the 'K' and 'k' look out of place due to the sharp 45 degree angles that don't appear anywhere else. Maybe make them a little closer to the 'X' and 'x'.</p>
      <p>Also the 'Z' and '7' look like they've had their corners sliced off, but the '3' and 'z' do not.</p>
      <p> - Lex</p>
