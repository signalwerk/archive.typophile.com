    <p>Inspired by a comment by Hrant Papazian that several other scripts have advantages over the Latin script in readability, I've come up with an alternative to learning a new script in order to obtain the benefits sought.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/semi2_5648.jpg"></div><p></p>
    <p>I started with Linden Hill, compressing the capital letters vertically by 15%, while leaving the lower-case letters unchanged.</p>
    <p>I gave the capital letters A, G, and L small ascenders, and C, G, P, T, V, W, and Y small descenders, by restoring their uncompressed forms, and aligning them suitably. The letter J had a small ascender added the same way; so its original large descender remained unchanged.</p>
    <p>Expanding the lower-case letters a, v, and w by 25% gave a a small ascender and v and w small descenders. m, n, and r were given small descenders by dealing with elements of the letters, and u was given a small ascender in the same fashion.</p>
    <p>In addition, the large ascender of d and the large descender of q were diminished in size (but not reduced to the size of small ascenders and small descenders) to avoid the mirror-reflection issue.</p>
    <p>So even words in all caps will now be more likely to have a "bouma", and lower-case words will have more frequent ascenders and descenders, but small enough to be not overly disturbing to the Latin alphabet with which everyone is comfortable.</p>
