      <p>I have to admit that my personal bias is in favor of the primary mechanism in reading being letter by letter. However, I didn't find Larson's paper fully convincing, because proving that something is nonexistent is more difficult than proving its effect, if there, must be small.</p>
      <p>As I noted, I was surprised by Hrant's suggestion that certain other scripts, usually viewed by Latin script users as much less legible, were more readable. This makes me think that there is a missing piece in the puzzle - have there been studies of the visual mechanisms used by native readers of the Arabic script, for example?</p>
      <p><cite>Also, it's entirely routine for an experimental psychologist to miss the point.</cite></p>
      <p>That certainly happens, although it wasn't clear to me why this was likely to have been happening here.</p>
      <p>And then it dawned on me that perhaps the criticism being aimed at the paper might be this: experimental tests of reading speed and the like are more reliable as tests of legibility than readability. Efficiency and speed in reading short texts may depend primarily on legibility, while readability affects the effort required, and shows up in performance primarily when dealing with longer texts.</p>
      <p>If, though, the definition of readability has retreated this far, I can see the aptness of Hrant's remarks about the mystical versus the determinate.</p>
      <p>A potential experimental test has occurred to me. If subjects are tested on reading effectiveness using different typefaces, including ones known to be highly readable (Baskerville, Imprint, Jenson Oldstyle) and ones known to be unsuited to extended reading (Helvetica, Futura) and performance differences don't show up in tests of the kind used to debunk Bouma, then that would show the tests <em>are</em> missing readability, and thus we're not dealing with false subjectivity.</p>
      <p>Also, I seem to recall that some experiments were described in Typographical Printing Surfaces that crossed the divide between legibility and readability.</p>
