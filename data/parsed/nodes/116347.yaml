      <p>Incidentally, after posting this, thinking of the fact that Hrant mentioned Arabic and Korean, I thought of another way to add more bouma to the Latin script. Have the letters in each syllable on a baseline angled downwards slightly, perhaps descending in steps. Or just have the consonants before the vowel raised, those after the vowel lowered.</p>
      <p>Also: the illustration provided is simply a mockup of a thought I had, so as to get feedback from Hrant as to whether this kind of font would address his concerns or not. It may be that I have misunderstood what he finds to be lacking in the Latin script.</p>
      <p>As well, while it is true that the baselines are perhaps less prominent when there are more ascenders and descenders, it isn't intended to lead to a ransom note effect. This diagram, incorporating some minor corrections as well, shows the lines:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/baselines_5000.jpg"></div><p></p>
      <p>1: Ascender height<br>
      2: Old cap height - cap secondary ascender height<br>
      3: New normal cap height<br>
      4: Lowercase secondary ascender height<br>
      5: x-height<br>
      6: baseline<br>
      7: Secondary descender depth (upper and lower case)<br>
      8: Reduced full descender depth (q)<br>
      9: Descender depth</p>
      <p>The reduced full ascender height, as evidenced by the letter d, didn't get a horizontal red line in this diagram; it would have been just two pixels above the new normal cap height, (3).</p>
      <p>And here is a small, not extended, text sample:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/text2_6687.jpg"></div><p></p>
