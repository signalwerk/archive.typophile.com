      <p>Thomas, there are many indicators that Larson's conclusion is fatally flawed (and I'm not the only one who believes that). I have outlined them here and there. It's pretty straight-forward once you really think about it. Also, it's entirely routine for an experimental psychologist to miss the point. One can harbor a bit more hope for experienced typophiles however.</p>
      <p>The reason many people want to believe in the letterwise-decipherment model might be that they instinctively realize that the alternative would put them on a road that might not end (the white being essentially indeterminate). It is mystical, and in this age we are conditioned to shun that in favor of the determinate.</p>
      <p>BTW learning things is always harder. You benefit later. Expecting no [subconscious] effort from readers is not far removed from not asking them to read.  :-)</p>
      <p>---</p>
      <p>John, please give me a bit more time to think about your interesting proposal...</p>
      <p>hhp</p>
