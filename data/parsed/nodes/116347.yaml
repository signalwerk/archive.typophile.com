      <p>It's an interesting exercise. I think this could work best in situations where fast uncontextualized word recognition may be critical</p>
      <p>This could certainly amount to the readability of isolated words but I'm not so sure how this would work on a long text. The changes do certainly give the typeface a playful character. Do you have samples of long running text set with this?</p>
      <p>A thing to consider is that increasing the distinctiveness of characters may ultimately hinder readability of longer texts because it's not all about distinction (which may lead to distraction) but also about rhythm and unobtrusiveness. While reading the mind is predicting and confirming predictions to make sense out of the text: context and good writing can help readability more than the best type designer could ever do.</p>
