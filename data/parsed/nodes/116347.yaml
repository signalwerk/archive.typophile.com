      <p>Hrant's comments on the readability of the Latin alphabet in another thread,</p>
      <p><cite>Armenian and Georgian are more readable than Latin. So is Arabic, by a big margin. Hebrew is less readable. Thai is probably slightly inferior. Korean? Makes Latin look like a village idiot.</cite></p>
      <p>led me to construct the sample alphabet shown above simply to ask Hrant if this was the sort of improvement the Latin alphabet could use. His full post was:</p>
      <p><cite>You're way too rosy-eyed towards Latin.</cite></p>
      <p><cite>Actually blackletter (I mean structurally, not necessarily most instances of it) is inherently more readable* than Latin:</cite><br>
      <cite>http://themicrofoundry.com/ss_fraktur1.html</cite></p>
      <p><cite>* Not at all the same thing as "legible".</cite><br>
      <cite>And virtually nothing to do with "literacy".</cite></p>
      <p><cite>Armenian and Georgian are more readable than Latin. So is Arabic, by a big margin. Hebrew is less readable. Thai is probably slightly inferior. Korean? Makes Latin look like a village idiot.</cite></p>
      <p><cite>The adoption/abandonment of a script has little to do with its readability, sadly. Especially in this age of idiotic democracy. And it has even less to do with familiarity.</cite></p>
      <p><cite>Is it worth switching? Hmmm, is it worth learning math in school? It's so hard!...</cite></p>
      <p>So I was treating this as if it was my responsibility to find a way to save the Latin script; to improve its readability to match that of other, superior scripts, by whatever criteria Hrant is applying, in order to avoid the necessity of everyone in the Latin script world having to learn to read and write all over again. (Someone might ask: why am I taking this so seriously? Who has made Hrant Papazian emperor of the world? But while it is true there is no real deadline, if he has identified a real problem, it deserves to be examined.)</p>
      <p>And while lower-case is quite differentiated in the Latin alphabet, it's not the case that every word has a unique overall shape; ascenders and descenders aren't <em>that</em> frequent. This is why I thought having more of them would improve the odds.</p>
      <p>But it wasn't just ease of adoption that led me to make the new ones smaller; if almost all the letters have ascenders, then the result is the same as if hardly any have ascenders, the words mostly have similar shapes; by having the new ascenders have a new height, I'm sure of increasing variety instead of decreasing it.</p>
      <p>(If my approach is valid, this would also mean that the Cyrillic script, where so many lower-case letters have a small capital form, is somewhat less readable than Latin. But I am not going to attempt a reformed Cyrillic at this stage, as I don't yet know if I've understood Hrant correctly.)</p>
      <p>So when you say,</p>
      <p><cite>On the specific proposal here, I am skeptical that it will help ease readability. That is because the roman lower case, particularly, is pretty highly differentiated. So I'm doubtful that additional differentiation will be of much help.</cite></p>
      <p>I am not disputing it. I thought that Latin was as differentiated as it needed to be too. But Hrant seems to be saying otherwise; so I am essentially here asking him if that was what he <em>did</em> say - or if it's something else entirely that is the limitation of the Latin script that he perceives. I'm not yet prepared to take a definitive position on whether script reform for Latin, such as the one I've tentatively proposed, or of a different nature, to improve readability <em>is</em> needed.</p>
