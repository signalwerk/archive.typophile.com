      <p>First, give up on the “bouma”&nbsp;thing, it has been pretty thoroughly debunked by science, decades ago. <a href="https://www.microsoft.com/typography/ctfonts/WordRecognition.aspx" title="https://www.microsoft.com/typography/ctfonts/WordRecognition.aspx">https://www.microsoft.com/typography/ctfonts/WordRecognition.aspx</a></p>
      <p>Now, making letters more distinctive is a worthwhile goal and does contribute to legibility. But I expect that the differences need to be within the range of normal for those letters. Otherwise the reader has to essentially “learn” your specific typeface to become comfortable and speedy reading it. That seems like an awful lot to expect of a reader. Until that time, your typeface will be in effect harder to read, not easier.  :(</p>
