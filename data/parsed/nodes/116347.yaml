      <p><cite>It was called Реформа печати ради глазъ (“A Printing Reform for the Sake of Eyes”),</cite></p>
      <p>Oh, wow! Counter-free Cyrillic!</p>
      <p>Initially, it seems to me that filling in all the counters removes major difference between the individual letters, leaving only more subtle details around the edges of the letters.</p>
      <p>So my initial reaction is that this would cause a major <em>decrease</em> in legibility instead of an improvement.</p>
