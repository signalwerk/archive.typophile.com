      <p><cite>Until that time, your typeface will be in effect harder to read, not easier.</cite></p>
      <p>Worse yet, the easier it is for people to read texts in the modified script - these distortions can be applied to most text typefaces - the more important letter shapes (which aren't changed much) are, and the less important word shapes (which is what this changes) are.</p>
      <p>In a way, that's not a cruel paradox; the less benefit it provides, the less effort it asks. But it could mean that if it can be done, it's not worth doing.</p>
      <p>Only if such a script initially impairs readability, by no longer providing the word shapes that people have memorized through their reading, would the greater diversity of word shapes provide a benefit. I tried to minimize the problem by making the new features much smaller than previously existing ascenders and descenders, but I suspect that won't be sufficient to reduce the impact, since any contribution of word shapes to facile reading would not happen at a conscious level.</p>
