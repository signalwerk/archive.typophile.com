      <p>On the issue of readability. Peter Enneson and I wrote a long article on the scientific research of Matthew Luckiesh, who first introduced the concept of readability as ease of reading extended text. Luckiesh collaborated with Linotype in the late 30s and we think his research is still relevant and important. He found that increase in blink rate over time indicated lower readability, that the text was more taxing to read in extended blocks.</p>
      <p>Our paper was published in December in <a href="/wiki/https%3A/%252Fhyphenpress.co.uk/products/books/978-0-907259-48-0" class="freelinking" rel="nofollow">Typography Papers 9</a> (I see that also the Princeton Architectural Press in the U.S. will be publishing it.)</p>
      <p>On the question of letter-by-letter reading, if I remember rightly, I think that Kevin has conceded that Peter Enneson's theory of reading by whole word patterns of sub-letter parts is not hit by most of the objections in his survey paper.  The paper assumes that whole word theories are only looking at the 'envelope' of the outer outline of the word. </p>
      <p>On the specific proposal here, I am skeptical that it will help ease readability. That is because the roman lower case, particularly, is pretty highly differentiated. So I'm doubtful that additional differentiation will be of much help.</p>
