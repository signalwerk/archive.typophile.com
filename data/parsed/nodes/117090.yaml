      <p>Another possibility that might work. Find a suitable digital font, convert it to eps and/or whatever format can be read by a digital printer. Have 3D printing service produce a thermal tolerant mold used to cast a metal plate suitable for hot foil stamping. It's at least worth exploring this concept.<br>
      Don</p>
