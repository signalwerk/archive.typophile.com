    html: <p>Gold hot foil stamping will require metal type if you want to reproduce the labels close to the  originals. Finding something close maybe be hard so you should check the letterpress printing newsgroups. Photo polymer plates I don't think will work for stamping foil but those can be used for a printed paper label. Most hand bookbinders have some types for foil stamping in my experience, but only one or two.</p>
