      <p>To my eye, this is a version of a font usually then called French Old Style in English speaking countries and was sold as an Elzevir in Europe -- the term Elzevir lumped it together with Dutch fonts of the 17th century. French Old Style is an extremely thin style of font designed by Théophile Beaudoire in 1858. The upper case is derived from Louis Perrin's Lyon Capitals. There is no available digital font, that matches French Old Style, but J.P. Knox has been working on a digital revival of its European predecessor for many years under the name of Marquet Titling.<br>
      Here is a sample of his work<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/MarquetTitlingByJPKnoxInUse_5771.jpg"></div><br>
      which is almost identical to the book binding letters. The spurred _G_ and _R_ with the tapered curved leg are essentially the same letter-forms as the book binding letters. Other versions of French Old Style have an _M_ with vertical sides and a _W_ with no spurs at the vertex.<br>
      Further information at <a href="http://typophile.com/node/108094" title="http://typophile.com/node/108094">http://typophile.com/node/108094</a><br>
      As for substitutes to match the book binding letters, as I mentioned above no version of French Old Style has been digitized.<br>
      Loosely similar fonts include Louize <a href="http://www.myfonts.com/fonts/nonpareille/louize/" title="http://www.myfonts.com/fonts/nonpareille/louize/">http://www.myfonts.com/fonts/nonpareille/louize/</a> but it's too heavy and is only a partial match, and Romana <a href="http://www.myfonts.com/search/romana" title="http://www.myfonts.com/search/romana">http://www.myfonts.com/search/romana</a> but again too heavy and an even poorer match.<br>
      Don<p></p>
