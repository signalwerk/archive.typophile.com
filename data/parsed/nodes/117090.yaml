    html: |-
      <p>First off, thanks to all of you—especially Don—who have provided input on this.  Let me re-focus this discussion a little.  My desire is to identify the ORIGINAL font used and if at all possible, to use moveable type from that font to reproduce the labels on these 39 volumes.  (I know that’s a tall order.)  If and when it becomes obvious that that is impossible, I may seek a digital solution.  For the record, the most pleasing digital fonts I have seen are Paratype “Neva” and (surprisingly) Microsoft’s Yu Mincho Light.  (Neva was identified via Identifont.)<br>
      French Old Style has been on my radar screen for some time as a likely match.  Reviewing old specimen books from BB&amp;S, Inland, ATF, Linotype and Intertype as well as McGrew’s catalog of 20th Century types, I have not found a good match under French Old Style or any other Old Style, Bookman, Booklet, Lightface, Clearface or other.  Most of these have serifs at the apex of the W and M’s with slanted legs, and few have the curved leg on the R.  None has all three.  Specimens for many of the possible matches don’t include all of these letters, which hampers comparison.  My hope was that one of you might have access to 19th century specimen books that I don’t and could find it that way.<br>
      Bancroft and his brother operated the printshop that published these books from the early 1860’s through at least the 1890’s in San Francisco.  You may have seen my other post for a font that I believe was based on Bauer Gable.  What I didn’t mention is that that book, published in Missouri in 1894, used what I believe to be this same typeface on its title page.  Don’s posts to date (in this and other message threads) suggest that French Old Style or Elzevir was designed in 1858, adapted by others, and widely used in Europe and America through the last half of the century, and finally fell out of favor near the turn of the century.  Because I can trace use to printers in SF and Missouri who made a lot of books in this timeframe, my guess is that it was being made or imported and distributed by a major player in the type business in this timeframe.  I’m too new at this to know who that might have been, but I think that’s the direction to look in—specimen books from major foundries and importers who might have been selling type west of the Mississippi during this timeframe to significant book printing shops.  Were Lyon Capitals, Beaudoire’s French Old Style or any of the European derivatives being imported to America in a big way?<br>
      Again, thanks to all for your help.<br>
      Bill S</p>
