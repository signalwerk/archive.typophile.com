      <p>Bill I wish you luck on a search for a specimen book from the mid 1890s with a match.<br>
      Some books have not only survived, but are digitally available at Archive org or HATHI. Unfortunately most are from the ATF combine, or Inland. Of these ATF Pacific Blue is worth a close check. But there is nothing digital from Bruce, Connors, BB &amp; S or other foundries of the early to mid 1890s.<br>
      I note you are in California. A visit to the University of Cailfornia might turn up something in the rare books collection. Some of the best digital specimen books at Archive Org are from that source. Best to check several UC locations.<br>
      For purchase of a specimen book E-bay, Abe books, Amazon and Google could be explored for leads.<br>
      Finally, just because a font was used by a publisher in 1894 doesn't mean that it was a new font. Parsimony is the name of the game in book publishing then as now and some less frequently used fonts could have been many years old.<br>
      I am not clear from your remarks whether you do letterpress printing yourself. If you do, ignore the rest of this paragraph. ... If you can identify a font by name that you think would work you can then attempt to purchase it. My observation from casual visits to letterpress websites is that there is an active market for letter press fonts. Some old some new. And there are advice and trading forums on the internet.<br>
      As for technique, Bob's suggestion seems good. Again I expect your attempt is not unique and some internet digging could be helpful.<br>
      I wish you good luck on achieving a satisfying outcome.<br>
      Don</p>
