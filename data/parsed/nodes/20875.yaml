    <p>i'm after a certain kind of brasilian text face, and i was after some recommendations. i've checked out the very useful wiki <a href="http://typophile.com/wiki/brazil" title="http://typophile.com/wiki/brazil">http://typophile.com/wiki/brazil</a> and some of the sites listed on it. there's also <a href="http://cg.scs.carleton.ca/~luc/brasilfonts.html" title="http://cg.scs.carleton.ca/~luc/brasilfonts.html">http://cg.scs.carleton.ca/~luc/brasilfonts.html</a> and <a href="http://www.typophile.com/node/13220" title="http://www.typophile.com/node/13220">http://www.typophile.com/node/13220</a> </p>
    <p>but this post relates to something a little more specific and i was hoping you guys could help me out. here are the details:</p>
    <p>--i'm after a brasilian-designed, or failing that s. american face.</p>
    <p>--it's for text i'm setting on the brasilian diva elis regina (not for publication--i am setting the text just as a learning excersise). so it could somehow reflect some of the character of brasilian music, or better still, of the fiery singer, known as 'little pepper'.</p>
    <p>--specifically, i would like something taut and beziery, with M-formula-type curves; perhaps part of that certain recent trend of south american faces some have termed 'fauve'. <a href="http://typophile.com/node/5303" title="http://typophile.com/node/5303">http://typophile.com/node/5303</a></p>
    <p>--must be suitable for setting extended text, must have OS figs, pref SC also. OTF preferably. an extensive range of weights wd be nice, but is rather less important.</p>
    <p>--budget is also a consideration, as this is just a personal project, and i've spent all my money on brasilian music:)</p>
    <p>miguel, is your quetzal available? that fits the bill totally!</p>
    <p>any suggestions welcome</p>
    <p>g</p>
    <p>ps. congrats guys, by the way, on last night's victory:)</p>
