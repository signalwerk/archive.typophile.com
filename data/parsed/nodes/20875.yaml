      <p>There aren't many Brazilian text (serif) typefaces; I don't think there's any with the characteristics you're looking for (<em>"taut and beziery, with M-formula-type curves"</em>).</p>
      <p>Yomar Augusto's <a href="http://just.letterror.com/ltrwiki/YomarAugusto_2fFinalProject" rel="nofollow"><strong>Den Dekker</strong></a> and Eduardo Berliner's <a href="http://www.personal.rdg.ac.uk/~lts98gl/MATD/Pollen_specimen.pdf" rel="nofollow"><strong>Pollen</strong></a> [PDF] are two nice typefaces with a strong calligraphic influence on letterforms.</p>
      <p>Rodolfo Capeto's <a href="http://www.rcapeto.com/etc/houaiss-normal.gif" rel="nofollow"><strong>Houaiss</strong></a>  is a custom and exclusive typeface for the Houaiss dictionary.</p>
      <p>And there's my own Lalo (still work in progress, to be finished soon); it will be available in 3 optical weights:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/omine-tipograficamente-lalo_5677.gif"></div><p></p>
      <p>-- <a href="http://www.omine.net/" rel="nofollow">omine.net</a></p>
