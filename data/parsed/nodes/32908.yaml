      <p>I like the image a lot. </p>
      <p>[sermon]That plus the fact that you're putting the effort into getting the type looking equally nice is a poignant illustration of how anarchism (compared to socialism) will never catch on until more anarchists stop using DIYism as an excuse for aesthetic laziness.[/sermon]</p>
      <p>The font used for the subtitle (Courier?) feels cold, mechanical, technological -- not at all like what I presume the book intends by either socialism or ecology. </p>
      <p>Also, three typefaces seems too much here. I would simplify and use one for the title and one for everything else (including the "Socialist Press" bit), though in the latter case, different styles of the same face could be fine.</p>
      <p>With that in mind, perhaps you need a type face that looks attractive as a display (for the subtitle) yet can be used for the text on the back. I've been rather interested in <a href="http://www.stormtype.com/typefaces-fonts-shop/families-42-sebastian" rel="nofollow">Sebastian</a>, which has something of an organic look.</p>
