    <p>I would appreciate constructive criticism on this A5 book cover:<br>
    <a href="http://www.nothingisreal.com/tmp/Red_and_Green_cover.pdf" rel="nofollow"><em>Red &amp; Green: Socialism and the Environment</em></a>.  Please bear in mind that I have no formal training in graphic design or typography, and this is the first book cover I've designed.  Expect elementary mistakes and faux pas, and please help me correct them.</p>
