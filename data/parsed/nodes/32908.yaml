      <p>Couple of things on the type on the back, remove double word spaces (this is a hangover from typewriters) and replace the em dash (—) with space en dash space ( – ) this use is more normal for UK publishing. You could also spend some time cleaning up the rag (the non-aligned margin), possibly by increasing the width of the column and turning over some of the shorter words, the idea is to get the righthand margin making a smooth (not necessarily straight) line. The red of the cover seems a little more organic than socialist, however given the subject why not keep it.</p>
      <p>What does the interior look like?</p>
      <p>There are some quality free* typefaces linked here, some freebies on the net are of variable quality.<br>
      <a href="http://typophile.com/wiki/FAQ_Free" title="http://typophile.com/wiki/FAQ_Free">http://typophile.com/wiki/FAQ_Free</a></p>
      <p>*check the permitted uses.<br>
      Tim</p>
