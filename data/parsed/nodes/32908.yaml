      <p>The subtitle is in Computer Modern Teletype and the other text is in Andale Sans.  Now that you mention it, I agree that CM is perhaps a bit too cold; I think I used it mostly because the various Sans typefaces I tried looked odd.</p>
      <p>Unfortunately, I don't think we have the budget to spend €200 or even €30 on a typeface for a single book cover.  As this is a volunteer effort, we've been limiting ourselves to the fonts that come with LaTeX, the standard PostScript fonts, and free fonts.  Do you think something in one of those categories would be appropriate?  (Computer Modern Sans, Helvetica, Avant Garde, Bitstream Vera Sans, etc.)</p>
