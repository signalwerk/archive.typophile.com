    <p>I've tried using several Arabic fonts in CS3 and am having trouble getting the characters to connect properly (they don't connect at all).<br>
    Any one know another font I should be using or a trick to get the font I am using (Nazanin LT) to join properly? (BTW, I have already dealt with the backward-forward problem by typing in all my characters backward)</p>
