      <p>The OP is working in CS3 ...</p>
      <p><cite>I've tried using several Arabic fonts in CS3 and am having trouble getting the characters to connect properly (they don't connect at all).</cite></p>
      <p>Correct. By default, when you type a single character, InDesign picks the "Isolated" form, whereas software designed to work with Arabic automatically use the "Initial", "Medial", and "Final" character forms. If you want to do this by hand: it's not <em>very</em> complicated, but it's a lot of work: select each character, one by one, and look in the Glyphs panel for its alternates. Then pick the appropriate one, by hand. Take care in selecting the correct ones: the <em>right hand side</em> is -- in Arabic Right-to-Left writing -- the "Initial"; all inbetweenies are "Medials", and the <em>left hand side</em> is the "Final".</p>
      <p>Note that not all characters come in all 4 shapes; for example, Times New Roman only has Isolated and Final forms for the Alef. I *think* (but I could be dearly mistaken) that the Final form should only be used as such, so in this case you should use the only alternative everywhere else.</p>
      <p>I hope you have a good example to work from ... It might be faster and more accurate to do this in Word, print to PDF, and insert as image.</p>
