    html: <p>For CS3 and earlier you would need to use InDesign ME, the version of InDesign sold by WinSoft that is modified for setting Middle Eastern languages. For CS4 and later, the western-language InDesign has a hidden Arabic typesetting ability that you can activate with templates, scripts, or plug-ins.</p>
