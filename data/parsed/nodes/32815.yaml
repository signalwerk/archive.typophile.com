    <p>Intern interview season is upon me again, and this year my collection of stuff is pretty big. I am showing it all on boards so that I can easily swap stuff in and out for different firms, but I have some questions about the size of the portfolio. I usually see the expected size of professional portfolios as 12-20 pieces, and for students with smaller bodies of work, 5-10 really good pieces. But what constitutes a piece? If I bring in ten pages of spreads from two publications, should I only toss a few more pieces to top it off, or do firms see those ten spreads as just ten pages from two pieces of work?</p>
