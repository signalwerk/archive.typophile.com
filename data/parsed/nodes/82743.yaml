      <p>I agree that h5 shouldn't come after h2, and it's been on the long list of bugs to fix. We can use a validator, too, and had a choice whether to produce perfect, clean code or to get this useful site into everyone's hands all that much sooner. Still, our browser testing shows only minor difficulties, primarily our tab handling on IE6. :-)</p>
      <p>What we'd really like is to have you play with the site and explore all that is within. If you're a type designer, do you think this will be useful to you? Let us know that you think are the most useful features, and what you'd like us to improve. What other information would you like to see on the site? What questions do you have? Thanks!</p>
