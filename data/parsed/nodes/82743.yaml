    <p><em>Finally, after years of development and months of testing...</em></p>
    <p><strong>We're proud to announce the unveiling of a new site dedicated to gathering information on writing systems - ScriptSource</strong>:</p>
    <p>	<a href="http://scriptsource.org" title="http://scriptsource.org">http://scriptsource.org</a></p>
    <p>ScriptSource is a dynamic, collaborative reference to the writing systems of the world, with detailed information on scripts, characters, languages - and the remaining needs for supporting them in the computing realm. It currently contains only a skeleton of information, and so depends on your participation in order to grow and assist others.</p>
    <p>A major goal of ScriptSource is to enable the development of software that supports minority writing systems, including fonts, keyboards, sorting routines and typographic rendering systems. We hope that the site will draw together the design, computing and linguistic communities to meet these needs and increase global multilingual computing.</p>
    <p>ScriptSource is currently sponsored, developed and maintained by SIL International (<a href="http://www.sil.org" title="www.sil.org">www.sil.org</a>), a faith-based nonprofit organization committed to serving language communities worldwide as they build capacity for sustainable language development.</p>
