      <p>hmmm, devolving into a code discussion. THIS, I know something about.</p>
      <p>H5 <em>can</em> come after H2, but it <em>oughtn't</em>. HTML exists to semantically mark up your content so that different systems can properly interpret it. You are in effect saying:</p>
      <p>(here's my second-level heading) Our Promises (end of my second-level heading)<br>
      (here's a paragraph) We have several promises for you. (end of the paragraph)<br>
      (here's my fifth-level heading) Logic (end of my fifth-level heading)<br>
      (here's a paragraph) We promise to be logical. We know that it's important that we make sense. (end of the paragraph)<br>
      (here's my fifth-level heading) Clarity (end of my fifth-level heading)<br>
      (here's a paragraph) We promise to be clear. We know that it's important that we communicate. (end of the paragraph)<br>
      (here's my fifth-level heading) Professionalism (end of my fifth-level heading)<br>
      (here's a paragraph) We promise to be professional. We know that we'll look silly if we don't. (end of the paragraph)</p>
      <p>"But wait," I hear you exclaim. "What marks up the beginning and end of a sentence?"</p>
      <p>Capital letters and punctuation.</p>
      <p>"What marks up words?"</p>
      <p>Spaces.</p>
      <p>Anyways, I hope at least a little of that made sense.</p>
