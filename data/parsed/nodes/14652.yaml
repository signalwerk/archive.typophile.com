    <p><strong>Individual Fonts</strong><br>
    <a href="http://new.myfonts.com/fonts/storm/lido-stf/" rel="nofollow">Lido</a> by <a href="/wiki/Storm%20Type%20Foundry" class="freelinking" rel="nofollow">Storm Type Foundry</a>. Modification of Times.<br>
    <a href="http://letritas.blogspot.com/2006/05/chcara-una-tipografa-econmica.html" rel="nofollow">Chucara</a> and <a href="http://www.typies.blogspot.com/" rel="nofollow">Romeral</a> by <a href="/wiki/Juan%20Pablo%20De%20Gregorio" class="freelinking" rel="nofollow">Juan Pablo De Gregorio</a>. Humanist text and slab serif. Must contact De Gregorio (or post your e-mail address on his comments page) to receive fonts by e-mail.<br>
    <a href="http://www.underware.nl/site2/index.php3?id1=unibody&amp;id2=overview" rel="nofollow">Unibody</a> by <a href="/wiki/Underware" class="freelinking" rel="nofollow">Underware</a>. Pixel font for Flash.<br>
    <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium" rel="nofollow">Gentium</a> by <a href="/wiki/Victor%20Gaultney" class="freelinking" rel="nofollow">Victor Gaultney</a>. Multilingual font with extended character set.<br>
    <a href="http://www.ms-studio.com/FontSales/anonymous.html" rel="nofollow">Anonymous</a> by <a href="/wiki/Mark%20Simonson" class="freelinking" rel="nofollow">Mark Simonson</a>. Monospace.<br>
    <a href="http://www.archivetype.com/FreeStuff.htm" rel="nofollow">Type Mix I</a> by <a href="/wiki/Archive%20Type" class="freelinking" rel="nofollow">Archive Type</a>. "Ransom note" font made from period typefaces.<br>
    <a href="http://www.kontrapunkt.com/en/about-us/our-own-typeface/" rel="nofollow">Kontrapunkt Light &amp; Bold</a> by Kontrapunkt. Danish typeface of the year, 2004.<br>
    <a href="http://www.vllg.com/Thirstype/Pixella/mudTyper+Weights/" rel="nofollow">Pixella</a>, <a href="http://www.vllg.com/Thirstype/Freedumb/mudTyper+Weights/" rel="nofollow">Freedumb</a> and <a href="http://www.vllg.com/Thirstype/SatchelPaige/mudTyper+Weights/" rel="nofollow">Satchel Paige</a>, all by Thirstype. Pixel, Egyptian, slab serif. <em>No longer available?</em><br>
    <a href="http://www.p22.com/products/freefont.html" rel="nofollow">Sinel</a> by P22. Art deco display face. Registration required.<br>
    <a href="http://www.selfbuildtype.co.uk/" rel="nofollow">SB Basement</a> by Selfbuildtype. Machine.<br>
    <a href="http://www.typeco.com/" rel="nofollow">Cypher7</a> by Typeco. Techno. Registration required.<br>
    <a href="http://www.philsfonts.com/freefont.html" rel="nofollow">Free Font</a> by Phil's Fonts. Quality single font; selection changes.<br>
