    <a href="http://www.psyops.com/html/library_crash.html" rel="nofollow">Crash Numbering</a> by PsyOps. Machine numbers.<br>
    <a href="http://www.devicefonts.co.uk/cgi-bin/device2.cgi?action=free" rel="nofollow">Free Font</a> by Device. Selection changes.<br>
