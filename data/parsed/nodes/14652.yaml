    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12452" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">FAQ</span>s</a>&nbsp;: Where can I get free&nbsp;fonts?</strong></p>
    <p>Legit free fonts. As always, please respect the <a href="/node/13840" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">EULA</span></a> when using free fonts:<br>
    “Some are licensed for unlimited use, some only for private use but not for commercial jobs. You don’t want to take advantage of the kindness and generosity of the people who designed them; it’s really bad for your karma. And you don’t want to risk that, do you?” –<a href="/node/12040" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Yves&nbsp;Peters</a></p>
    <p><strong>Why doesn’t this page list freeware font websites?</strong><br>
    Most of the sites below are run by type designers or foundries, and they tend to offer a few dozen fonts at most. Why doesn’t this page list the huge freeware websites? Take a quick look at those sites and you’ll see that the fonts there are of variable quality, with very few that are useful to a professional designer. But even more important, many of the type designs are clearly copied from other people’s work. To be fair, mixed in with the knockoffs are thousands of original fonts made by amateurs who just love type. But the lack of oversight—anyone can upload—and the confusing way that those sites mix the bad with the good, makes it hard for us to recommend them. (In the end, those sites need no help; a Google search quickly turns them up.) Below, legitimate free fonts offered by the people who created&nbsp;them.</p>
    <p><strong>Additional Articles:</strong><br><a href="http://fontfeed.com/archives/an-introduction-to-free-fonts/">FontFeed: An Introduction to Free Fonts</a><br><a href="http://fontfeed.com/archives/free-fonts-free-is-not-always-free/">FontFeed: Free Fonts: Free Is Not Always&nbsp;Free</a> </p>
    <p><strong>Individual Fonts</strong><br><a href="http://new.myfonts.com/fonts/storm/lido-stf/">Lido</a> by <a href="/node/12193" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Storm Type Foundry</a>. Modification of Times.<br><a href="http://letritas.blogspot.com/2006/05/chcara-una-tipografa-econmica.html">Chucara</a> and <a href="http://www.typies.blogspot.com/">Romeral</a> by <a href="/node/add/wiki?edit%5Btitle%5D=Juan%20Pablo%20De%20Gregorio" title="Create node &quot;Juan Pablo De Gregorio&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Juan Pablo De Gregorio</a>. Humanist text and slab serif. Must contact De Gregorio (or post your e-mail address on his comments page) to receive fonts by e-mail.<br><a href="http://www.underware.nl/site2/index.php3?id1=unibody&amp;id2=overview">Unibody</a> by <a href="/node/13509" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Underware</a>. Pixel font for Flash.<br><a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium">Gentium</a> by <a href="/node/add/wiki?edit%5Btitle%5D=Victor%20Gaultney" title="Create node &quot;Victor Gaultney&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Victor Gaultney</a>. Multilingual font with extended character set.<br><a href="http://www.ms-studio.com/FontSales/anonymous.html">Anonymous</a> by <a href="/node/15527" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mark Simonson</a>. Monospace.<br><a href="http://www.archivetype.com/FreeStuff.htm">Type Mix I</a> by <a href="/node/add/wiki?edit%5Btitle%5D=Archive%20Type" title="Create node &quot;Archive Type&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Archive Type</a>. “Ransom note” font made from period typefaces.<br><a href="http://www.kontrapunkt.com/en/about-us/our-own-typeface/">Kontrapunkt Light <span class="amp">&amp;</span> Bold</a> by Kontrapunkt. Danish typeface of the year, 2004.<br><a href="http://www.vllg.com/Thirstype/Pixella/mudTyper+Weights/">Pixella</a>, <a href="http://www.vllg.com/Thirstype/Freedumb/mudTyper+Weights/">Freedumb</a> and <a href="http://www.vllg.com/Thirstype/SatchelPaige/mudTyper+Weights/">Satchel Paige</a>, all by Thirstype. Pixel, Egyptian, slab serif. <em>No longer available?</em><br><a href="http://www.p22.com/products/freefont.html">Sinel</a> by <span class="caps">P22</span>. Art deco display face. Registration required.<br><a href="http://www.selfbuildtype.co.uk/"><span class="caps">SB</span> Basement</a> by Selfbuildtype. Machine.<br><a href="http://www.typeco.com/">Cypher7</a> by Typeco. Techno. Registration required.<br><a href="http://www.philsfonts.com/freefont.html">Free Font</a> by Phil’s Fonts. Quality single font; selection changes.<br><a href="http://typo3.org/?id=1942">Share</a> by Typ03. Sans text and monospace.<br><a href="http://www.psyops.com/html/library_crash.html">Crash Numbering</a> by PsyOps. Machine numbers.<br><a href="http://www.devicefonts.co.uk/cgi-bin/device2.cgi?action=free">Free Font</a> by Device. Selection changes.<br><a href="http://www.showstudio.com/projects/031/031_typeface.html">Pagan Poetry</a> by ShowStudio. Display face used in Bjork packaging.<br><a href="http://www.atf.com.au/free_font.asp">Free Font</a> by Australian Type Foundry. Selection changes. Registration required.<br><a href="http://www.kennmunk.com/main.html">Dummytapes</a> by Kenn Munk. Mimics Dymo label machine.<br><a href="http://www.noedesign.com/2005/index.html">Noe</a> by Dan Noe. Techno.<br><a href="http://www.adjarabet.com/sylfaen.htm">Sylfaen</a> from Adjara Bet. English character set is distinctive slab serif.<br><a href="http://freefont.de/us/index.htm">Free Font</a> by Softmaker. Selection changes.<br><a href="http://www.ourtype.be/">Bonus Font of the Month</a> by Ourtype. Selection changes. Click “About,” then “Bonus Font.”<br><a href="http://www.autodidakt.se/index.php?page=autostyler">Autostyler</a> from <a href="/node/29027" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Autodidakt</a>.</p>
    <p><strong>Free Font Collections</strong><br><a href="http://www.alvit.de/blog/article/20-best-license-free-official-fonts">25 Best Free Fonts</a> compiled by Vitaly Friedman. Discriminating list includes good serif text.<br><a href="http://www.smashingmagazine.com/2006/10/11/17-more-free-quality-fonts/">19 More Free Quality Fonts</a>, Vitaly’s follow-up, includes full-featured Opentype serif text faces.<br><a href="http://thinkdesignblog.com/20-beautiful-free-serif-fonts.htm">20+ Beautiful Free Serif Fonts</a> compiled by think design blog.<br><a href="http://www.smashingmagazine.com/category/fonts/">Free fonts of the month</a> compiled by Smashing Magazine. Focus is on practical faces for text.<br><a href="http://www.iginomarini.com/fell.html">The Fell Types</a> by Igino Marini. Historical revivals.<br><a href="http://www.identifont.com/free-fonts.html">Free Fonts</a> from Identifont. Good range of text, display, pixel, others.<br><a href="http://moorstation.org/typoasis/designers/klein/index.htm">Fonteria</a> by Manfred Klein. Art-inspired display faces, blackletter, text sans, dingbats.<br><a href="http://www.moorstation.org/typoasis/designers/curtis/pages/a.htm">Fabulous Free Fonts</a> by <a href="/node/17341" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Nick Curtis</a>. Period display, especially 1920s-50s.<br><a href="http://moorstation.org/typoasis/allfonts.htm">Typoasis</a> at Moorstation.org. Library of designers includes the two standouts directly above.<br><a href="http://www.glashaus-design.com/site/glashaus.html">Free Fonts</a> by Glashaus. Quality text sans.<br><a href="http://www.shamrocking.com/fonts.html">Free Fonts</a> by Shamrocking. Range of display fonts, especially animated and casual.<br><a href="http://www.robotjohnny.com/fonts/">Free Fonts</a> by Robot Johnny, aka illustrator John Martz. Good animated <span class="amp">&amp;</span> casual.<br><a href="http://www.fontoville.com/">Free Fonts</a> by Fontoville. Casual display.<br><a href="http://www.nerfect.com/typefree.html">Free Fonts</a> by Nerfect, aka Britton Walters. Mostly grunge, distressed, machine.<br><a href="http://www.fontdiner.com/silver.html">Free Silverware</a> by <a href="/node/12599" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Font Diner</a>. Display and novelty.<br><a href="http://www.noordeman.com/fonts.shtml">Free Fonts</a> by Noordeman Graphic Design. Display.<br><a href="http://www.myfonts.com/search?search%5Btext%5D=free">Free Fonts</a> by MyFonts. Display faces. Click “purchase options,” then checkout for free.<br><a href="http://www.core.nu/fonts.html">Fonts</a> by Core. Casual, serif display, condensed gothic, pixel, more.<br><a href="http://www.typemotion.de/_typographie/freefonts.php">Free Fonts</a> from Typemotion. Machine, techno and sans.<br><a href="http://www.fontfont.com/downloads_right.html">Free Downloads</a> from FontFont. Selection changes.<br><a href="http://www.fountain.nu/catalogue/probono.asp">Pro Bono Fonts</a> by <a href="/node/12045" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fountain</a>. Range of display, pixel and dingbat fonts.<br><a href="http://koenhachmang.com/">Free Fonts</a> by Koen Hachmang. Sans, calligraphic sans, techno, machine.<br><a href="http://www.misprintedtype.com/v3/fonts.php">Misprinted Type</a> by <a href="/node/20084" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Eduardo Recife</a>. Grunge, distressed, machine and penmanship.<br><a href="http://www.chank.com/freefonts.php">Free Fonts</a> from Chank. Range of display types; quality varies.<br><a href="http://www.macrhino.com/">Typefaces For Free</a> by <a href="/node/12032" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">MacRhino</a>. Semiserif, unicase, others.<br><a href="http://www.typedifferent.com/2005/index.html">Free Samples</a> by <a href="/node/14094" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">büro destruct</a>. Range of display, techno, handwriting, Japanese.<br><a href="http://www.fontshop.com/freefonts" title="download fonts">Free Fonts</a> from <a href="/node/12019" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontShop</a>. Selection changes.<br><a href="http://www.cape-arcona.com">Free Fonts</a> by <a href="/node/add/wiki?edit%5Btitle%5D=Cape%20Arcona" title="Create node &quot;Cape Arcona&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Cape Arcona</a>. Grunge and distressed, machine, period, others.<br><a href="http://www.houseind.com/index.php?page=freefonts">Free Fonts</a> by <a href="/node/12703" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">House Industries</a>.<br><a href="http://www.haroldsfonts.com/frontpage.html">Free Fonts</a> by Harold’s Fonts. Display, penmanship, historical recreations.<br><a href="http://flat-it.com/Freewares.php">Freewares</a> by Flat-it. Display.<br><a href="http://www.sugargliderz.com/Font/Font.html">Free Downloads</a> by Sugargliderz. Display.<br><a href="http://www.interq.or.jp/ox/gau/gau_pra/font/simple/index.html">Free fonts</a> by Graphic Arts Unit. Pixel, techno, striped triline, more.<br><a href="http://www.k-type.com/freebies.html">Freebies</a> by K-Type. Novelty, machine, punk dingbats.<br><a href="http://www.04.jp.org/">Extra</a> by 04.jp.org. Bitmap fonts for web design.<br><a href="http://www.fontboutique.de/">Free Fonts</a> by Fontboutique. Display.<br><a href="http://www.smeltery.net/">Free Fonts</a> by Smeltery. Unusual scripts and techno.<br><a href="http://floodfonts.com/freefont/freefont.html">Free Fonts</a> by Floodfonts. Mostly techno.<br><a href="http://www.milkwort.org/fontscape.html">Fontscape</a> by Milkwort. Pixel, techno, machine.<br><a href="http://www.petitboys.com/fonts/index.html">Fonts</a> by Petitboys. Techno, machine.<br><a href="http://www.junkohanhero.com/fontit.htm">Free Fonts</a> by painter Junkohanhero. Quality punk.<br><a href="http://www.blambot.com/fonts.shtml">Comic Book Fonts</a> by Blambot. Comic book lettering of all types.<br><a href="http://www.rotodesign.com/fonts/index.html">Free Fonts</a> by Roto Design. Casual, animated, gothic sans.<br><a href="http://www.9031.com/p-font/">Free Fonts</a> by P-Font. Techno, grunge, sans.<br><a href="http://www.typebox.com/">Free Fonts</a> by Typebox. Humorous dingbats, techno, Japanese.<br><a href="http://typo.lomo.jp/index2.html">Free Fonts</a> by Tomoyuke Watanabe. Click “font,” then “download?” Grunge, machine, techno.<br><a href="http://pixelfonts.style-force.net/">Pixel Fonts</a> by Style-Force. Pixel.<br><a href="http://pixelyn.com/typography.html">Typography</a> by Pixelyn. Pixel.<br><a href="http://www.habitat7.de/update21/index.htm">Free fonts</a> by Habitat 7. Pixel. Drag trash into woodchipper.<br><a href="http://www.miniml.com/">Free Fonts</a> by Miniml. Pixel. Scroll to bottom.<br><a href="http://www.feltron.com/">Typefaces</a> by Feltron. Pixel, techno, stencil, machine gothic.<br><a href="http://add.jp.org/index3.html">Fonts</a> by Add. Pixel, techno, machine, casual display.<br><a href="http://www.din.or.jp/~liar/enter.html">Free Fonts</a> by Sucharaka. Pixel, techno, pictorial letterforms.<br><a href="http://www.designerinaction.de/fonts/show.php?art=fonts">Downloads</a> by Designer in Action. Range of display, pixel, penmanship; quality varies.<br><a href="http://www.aenigmafonts.com/index.html">Free Fonts</a> by Aenigma Fonts. Techno display fonts.<br><a href="http://www.astigmatic.com/freeware.html">Free Fonts</a> by Astigmatic. Display, novelty, pictorial letterforms.<br><a href="http://www.speakeasy.org/~ecf/alphabet.htm">Free Fonts</a> by Emerald City Fontwerks. Penmanship, grunge, others.<br><a href="http://www.pennyzine.com/fonts.htm">Free Fonts</a> by Pennyzine. Punk.<br><a href="http://www.eutypoce.com/top.html">Freeware Fonts</a> by Eutypoce. Techno, pixel.<br><a href="http://www.die-gestalten.de/fonts/freefonts/archive">Free Fonts</a> by Die Gestalten. Techno. Selection changes.<br><a href="http://www.hvdfonts.com/#4-Free%20Fonts">Free Fonts</a> by Hannes von Dohren. Grunge, penmanship.<br><a href="http://www.fontenvironment.com/">Free Fonts</a> by FontEnvironment. Novelty, dingbats.<br><a href="http://www.beaufonts.com/archive/v1/index.html">Free Fonts</a> by Beaufont. Techno, machine.<br><a href="http://www.pizzadude.dk/freefonts.php">Free Fonts</a> by Pizzadude. Casual, graffiti, pictorial letterforms.<br><a href="http://www.clavis.ne.jp/~sonic/segasonic/act5/font.htm">Segasonic</a>. Mimics screen fonts from Sega arcade games.<br><a href="http://fonthead.com/freeware.php">Freeware</a> by Fonthead. Penmanship, novelty, dingbats.<br><a href="http://www.iai-jp.com/font/font_main.html">Free Fonts</a> by <span class="caps">IAI</span>-<span class="caps">JP</span>. Display, novelty, Japanese, pictorial dingbats.<br><a href="http://www.roast-horse.com/type/index.html">Free Fonts</a> by RoastHorse Type Foundry. Pixel, stencil.<br><a href="http://www.josbuivenga.demon.nl/">Free Fonts</a> by exljbris, the library of Jos Buivenga. Text typefaces, serif and sans.<br><a href="http://www.fontlab.com/font-editor/fontlab-studio/download-fontlab-studio/">Free Fonts</a> by FontLab. Penmanship and grunge.<br><a href="http://www.girlswhowearglasses.com/kiss.html">Free Fonts</a> by Dinctype Hoboken. Novelty.<br><a href="http://new.myfonts.com/search/lowest_price:0/fonts/">Free Fonts on MyFonts</a><br><a href="http://www.stormtype.com/free-fonts.html">Free Fonts on by the Storm Type&nbsp;Foundry</a></p>
    <p><strong>Greek</strong><br><a href="http://www.backpacker.gr">Free Greek Fonts</a> and more by George Triantafyllakos<br><a href="http://www.greekfontsociety.org/pages/en_typefaces.html">Free Greek Fonts</a> and more by <a href="/node/31983" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Greek Font&nbsp;Society</a></p>
