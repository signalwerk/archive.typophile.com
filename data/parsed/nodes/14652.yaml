    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/FAQs" class="freelinking" rel="nofollow">FAQs</a> : Where can I get free fonts?</strong></p>
    <p>Legit free fonts. As always, please respect the <a href="/wiki/EULA" class="freelinking" rel="nofollow">EULA</a> when using free fonts:<br>
    "Some are licensed for unlimited use, some only for private use but not for commercial jobs. You don’t want to take advantage of the kindness and generosity of the people who designed them; it’s really bad for your karma. And you don’t want to risk that, do you?" --<a href="/wiki/Yves%20Peters" class="freelinking" rel="nofollow">Yves Peters</a></p>
    <p><strong>Why doesn't this page list freeware font websites?</strong><br>
    Most of the sites below are run by type designers or foundries, and they tend to offer a few dozen fonts at most. Why doesn't this page list the huge freeware websites? Take a quick look at those sites and you'll see that the fonts there are of variable quality, with very few that are useful to a professional designer. But even more important, many of the type designs are clearly copied from other people's work. To be fair, mixed in with the knockoffs are thousands of original fonts made by amateurs who just love type. But the lack of oversight—anyone can upload—and the confusing way that those sites mix the bad with the good, makes it hard for us to recommend them. (In the end, those sites need no help; a Google search quickly turns them up.) Below, legitimate free fonts offered by the people who created them.</p>
