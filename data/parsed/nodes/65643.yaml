      <p>Solid work Hrant. The Latin seems distinctly Armenized, but without that being too in-your-face. Seems classy and contemporary. I like this a lot.</p>
      <p>Why is the Armenian version at <a href="http://www.luys.am" title="http://www.luys.am">http://www.luys.am</a> different (no serif on the "ւ")?</p>
      <p>There's something about the "s" that's bugging me, but I can't quite put my finger on it. It seems a bit mechanic perhaps in terms of contrast / linking of the outlines. The arch-based letters seem more refined to my eye. Curious, what made you diverge so far from the original Nour/Harrier "s"?</p>
