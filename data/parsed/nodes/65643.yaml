    <p>I was recently commissioned to create a new bilingual logo for<br>
    an education development foundation in Armenia: <a>Luys.am</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/LuysLogos_4947.gif"></div><p></p>
    <p>The brief for the Latin logo was to exhibit a strong Armenian flavor, but be contemporary and dynamic. The Armenian logo followed suit - or rather, led from behind.</p>
    <p>The letterforms are based on the TMF Nour typeface.</p>
    <p>Note: The spelling of the Armenian logo follows the reform orthography. The Mesropian spelling is "Լոյս". </p>
    <p>--</p>
    <p>Although the new logo is already in use, I would value any feedback no less.</p>
    <p>Also, on Flickr:<br>
    <a href="http://www.flickr.com/photos/48413419@N00/4210138954/" title="http://www.flickr.com/photos/48413419@N00/4210138954/">http://www.flickr.com/photos/48413419@N00/4210138954/</a></p>
    <p>hhp</p>
