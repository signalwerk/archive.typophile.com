      <p>My (unprofessional) observations:<br>
      The curves look too overshot to my eye (e.g. the *interior* curve at the top of s almost looks like it aligns with the top of y).<br>
      I also agree that the s is not quite fitting style-wise.<br>
      The swash underline approach (or <a class="freelinking external" href="http://typophile.com/cms/node/49473">whatever you'd call it</a>) doesn't say "contemporary" to me, to be honest. It also seems overmechanically executed (see esp. the terminal of the L). But maybe I'm totally misreading the intention of how this is to be read.<br>
      That L-shaped letter in the middle of the Armenian logo might need some beefing up on its lower serif (unless downplaying it was intentional).</p>
