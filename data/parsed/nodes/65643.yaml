    html: |-
      <p>Thanks for all feedback so far!<br>
      It's been as interesting to contemplate as it has been useful.</p>
      <p>I guess nativity cuts both ways. I know how to make a logo Armenian-looking, but by the same token it's hard for me to tell if I've gone so far as to give it negative attributes. An Armenian looking at it will probably be pleased (and that's been the case quite strongly so far) but this logo -like most any logo- isn't intended to be viewed only by a specific ethno-cultural group! Although the foundation's fund-raising is probably focused on Armenian sources, it's not good for the logo itself to be <em>that</em> focused.</p>
      <p>The "chopped" terminals with the horizontal shears for example are a classic Armenian motif. In fact -as Nina alludes to- the logo's source font (Harrier) has a traditional Latin structure in the "y" and "s". Changing the "y" was pretty easy to justify*; the "s" however was more of a stretch, and it's very possible I've gone too far with it. But the traditional "s" structure <em>did</em> clash pretty strongly with the rest in my view...</p>
      <p>* Latin uses that structure sometimes, and it<br>
      made sense to echo the "յ" from the Armenian logo.</p>
      <p>Similarly the "underline" aspect of the "L" is also an Armenian motif. I have to agree though that it might seem old-fashioned. As for "dynamism", I'm hoping the slant does some of that (although otherwise I do admit it's pretty rigid).</p>
      <p>&gt; Why is the Armenian version at <a href="http://www.luys.am" title="http://www.luys.am">http://www.luys.am</a> different</p>
      <p>I'm working on that...<br>
      It seems they wanted to make the two logos comparable in width (as you guess) so they figured to "just" chop the terminal of the "ւ"... So Craig, the beefier it was, the more chance it would get cut I guess.  :-/</p>
      <p>&gt; The curves look too overshot to my eye</p>
      <p>Considering the sourse is a text font, that's entirely possible. It does depend on how large they'll be setting this thing though. Ideally I need to make multiple versions for different sizes (as Jos suggested).</p>
      <p>hhp</p>
