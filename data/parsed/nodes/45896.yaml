    <p>EDIT: My reason for this post</p>
    <p>I am starting a blog devoted purely to ambigrams. I was wondering who has done them before (as I have a few on my own) and who would like to contribute some of their work, sketches, and maybe a quick write-up about the process.</p>
    <p>If you've ever done any of these, interested in doing one, or in the process of creating one, shoot me an email please to <a href="mailto:npgraphicdesign@yahoo.com">npgraphicdesign@yahoo.com</a>. I'll email you back with more details, why I am asking for this, etc.</p>
    <p>A short wikipedia link describing ambigrams - <a href="http://en.wikipedia.org/wiki/Ambigram" title="http://en.wikipedia.org/wiki/Ambigram">http://en.wikipedia.org/wiki/Ambigram</a></p>
    <p>These are ambigrams btw..</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ad2_5056.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/ad1_4882.jpg"></div><p></p>
