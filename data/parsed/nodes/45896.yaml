    html: |-
      <p>Hello Everyone,</p>
      <p>As some of you know from my Typophile or HOW Magazine forum posts, I'm starting up a blog devoted solely to ambigrams. Rather than have this blog be just a showcase of work, I would like it to be as much about the process as it is about the final product. So, this is what I'm asking the participants to contribute. I know that everyone is busy with work, life, family, etc. So submit what you can, and lets have a blast!!</p>
      <p>Email to send the submissions to:<br>
      <a href="mailto:ambigblog@gmail.com">ambigblog@gmail.com</a></p>
      <p>Required part of the submission:<br>
      a. One ambigram in jpg/gif/tiff format. You do not have to size it down to a specific size, as I will take care of that.<br>
      b. A few sentences about your ambigram. Include who the client was, whether it was a personal or freelance project, and why you decided to use an ambigram for the specific project. Include a sentence or two (or three) about your thought process if you can!!<br>
      c. The most important part: SKETCHES! More so than the work, I'd love to see the process. So any sketches you have, whether it's 1 or 10 sketches showing the creative process, please scan them in and send them to me. I will resize them and convert them to the appropriate file format. And the sketches do not have to be perfect; they can be as doodle-esque or unorganized as you want them to be, as long as they are SOMEWHAT clear ;) If you don't have any sketches, that's perfectly fine. I would still love to have your submissions for the blog!</p>
      <p>Optional part of the submission:<br>
      a. More than one ambigram. I would like everyone to submit at least ONE. But if you have to time to submit more than one, along with sketches, descriptions, etc., why not??</p>
      <p>Include the following with your submissions (only if you want to!):<br>
      a. A URL to your work (if you want people to look at your other work as well)<br>
      b. Your real name or a monicker (could be a forum nickname, could be another nickname, etc) but someway to identify yourselves<br>
      "I will not post any of your personal contact info, email, URL, name or otherwise without your explicit permission."</p>
      <p>And finally, spread the word! I want this to be a website about ambigrams, about the process, and about networking and getting to know artists that have similar interests! If you know anyone who is interested in ambigrams, who has created them before, or wants to take a crack at it, send forward this email to them or have them shoot me an email with some questions, which I will be more than happy to answer.</p>
      <p>Some other things to be included on the website: interviews with artists and well known designers that specialize in ambigrams and typography, case studies, etc. I will shoot out periodic emails informing everyone of new developments!</p>
      <p>Thanks everyone! Looking forward to all the great work!</p>
      <p>Nikita</p>
