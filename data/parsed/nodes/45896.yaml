      <p>I made some, right after reading Dan Brown's "Angels and Demons" (that's where these samples come from).</p>
      <p>My tag:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/jongware_ambi_5940.gif"></div><p></p>
      <p>My favourite game :-)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/elite4_ambi_4714.gif"></div><p></p>
      <p>I used Illustrator. It boils down to "a good idea" (you can't just take any phrase and turn it into an ambigram), followed by a lot of work. Place an upside-down copy on a layer below your working copy; swap them at (ir)regular intervals until they are the same.</p>
      <p>Another one, based on -- (what font was that?)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/theun_ambi_5176.gif"></div><p></p>
