      <p>The closest match I could find for this was <a href="https://web.archive.org/web/20141113045258/http://www.itcfonts.com/fonts/detail.asp?nCo=AFMT&amp;PID=ITC8179" target="new" rel="nofollow">ITC Tabula</a>, but the '&amp;' is different. The site sample is not quite big enough to see whether the strokes of the C and S taper the same way.</p>
      <p>If this lettering is from British official government documents, it is very possible that this is not a commercially available font.</p>
      <p>- Mike Yanega</p>
