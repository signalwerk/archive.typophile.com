      <p>Any luciferian iconography is strictly in relation to how things are defined by the religious communities. </p>
      <p>I would strongly suggest you look at current Gnostic and Rosicrutian practices, the OTO, Kali, and a variety of other cross-cultural strains that have some intellectual underpinnings as this may help you put things together in a context that is broader than pointy tails and Ouija boards.</p>
      <p>It is with great reservation that I post this here, but I have a very dear friend that is an author in the field. The interviewer here seems  determinately confused, but Bill’s comments are studied and sometimes even informative.</p>
      <p><a href="http://freemantv.liber.us/2008/01/25/bill-whitcomb-interview/" title="http://freemantv.liber.us/2008/01/25/bill-whitcomb-interview/">http://freemantv.liber.us/2008/01/25/bill-whitcomb-interview/</a></p>
      <p>You might find this interesting. If so you would likely find Bill willing to comment in regards to your current project. Let me know if you would like contact information.</p>
      <p>Cheers</p>
