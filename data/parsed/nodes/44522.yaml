    <p>Dear all wizards of typography!<br>
    I'm working on an exhibition on witchcraft and magic. And I'm looking for a typeface that gives some sort of magic/occult connotations. The closest thing yet is maybe <a class="freelinking external" href="http://www.vllg.com/Underware/Fakir/mudTyper+Weights/" rel="nofollow">Fakir</a> by Underware but I'm looking for something a bit more legible and not necesarily inspired by blackletter. Any suggestions?</p>
