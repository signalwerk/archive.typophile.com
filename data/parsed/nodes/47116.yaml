    html: |-
      <p>Your basic design is solid, and pretty fresh for its category. The J particularly makes me happy.</p>
      <p>All that remains, then, is to learn how to tweak your curves. There are a lot of visible bends where a curve meets a straight line. For example, look at the top of the P; you can tell exactly where the curve and the line meet. Check the joining node, and if the handles aren't lined up, straighten them out. If they are, but it still looks kind of pointy, then you'll want to use your eyes and make subtle changes to smooth it out. Pure geometry is often not in agreement with what you actually see. Study other fonts to see how they achieve this visual smoothness. If you're still working with one thick stroke, you'll need to convert it to outlines at some point so that you can adjust the inside and outside independently to really make it look right. You'll have to do that eventually anyway to make it into a font.</p>
      <p>It looks like the top of your E accidentally got moved very slightly off level. In future, if you can get your stuff into a PDF to post, it will help you get better feedback here, because then people can examine the vectors more closely and be more sure of what they see.</p>
