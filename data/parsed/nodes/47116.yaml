    html: <p>Thanks for your feedback. I'll put up a pdf. I wasn't sure if jpegs were ok. I'll expand the strokes to outlines for tweaking because at the moment it is even all over. In a typeface like this, do I still need to add contrast or will that throw off the geometric style I'm going for?</p>
  - id: 288282
    user_id: 2462
    user_name: cerulean
    user_path: null
    user_image: /files/pictures/picture-2462.png
    date_raw: 8 Jul 2008 — 1:31am
    date: 2008-07-08T01:31:00
    votes: null
    html: |-
      <p>Contrast can still help something like this, as long as it is so minimal as to be imperceptible. Try making your pen proportions something like 97% high by 100% wide, more or less. If you get that proportion just right, it should look <em>more</em> even.<br>
      Be sure to save your original strokes before you convert them to outlines; they may often come in handy later.</p>
