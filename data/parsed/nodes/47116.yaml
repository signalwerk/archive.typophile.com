      <p>Sorry Seán, I didn't mean to discourage you. Still, it's a good effort for a first typeface. As Jens says it's all part of the learning process, which is never a waste of time. That's the trouble with type design - producing something original requires as much thinking as actual drawing.</p>
      <p>Not looking at other typefaces while you're producing a design is a good idea. Looking at other typefaces then doing something different is also a good idea.</p>
      <p>Keep at it. It'll only take a lifetime, and you'll still be learning.</p>
      <p>Nick Cooke</p>
