    html: |-
      <p>There is no rule that you have to release any typeface at all, and it's really quite a good idea to develop your first typeface(s) with the understanding that you never will release them. In 10 years time you will cringe when you see your earliest student work on packaging, movie titles, etc. and all the naive and inept flaws will stick out at you. Take this opportunity to learn from everything you see, including Nick's counter-example. Go hunting for all the typefaces that have these traits. see how they are different as well as similar. Look at your point structure and try to refine it. Be willing to redraw things to get a better shape. Set your typeface in 7 point and see if it works (being honest about that is one of the hardest lessons).</p>
      <p>Honestly I'm confused when you say you're sketching all the time, because this typeface looks completely made of straight lines and circle segments. Nothing about it looks handmade. It looks machine-routed. One thing about type is that even if things all look the same thickness, they probably aren't. Joins between rounds and straights, or several diagonals typically get thinner to avoid the clogs like you have in the bottom of G and middle of K.</p>
