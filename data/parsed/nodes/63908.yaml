    <p>Made a quick logo/concept for my sister. It's going to be for a blog that provides information on "green" services and what not in the Dallas/Fort Worth area. </p>
    <p>The mark is Texas and the orange part represents DFW.</p>
    <p>Not sure if I feel satisfied about it, but she likes it. What do you think?</p>
