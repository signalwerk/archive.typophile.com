    <p>Hello there.</p>
    <p>I am currently writing on my BA thesis and I thought I'd ask for some help here. Since it's my first thesis paper and I am quite interested in making things look neat and clean, I wanted to ask if anybody had suggestions what fonts to use.</p>
    <p>My research field is the quality debate in online market-research; a relatively young branch in market-research and something young and modern would totally fit the purpose.</p>
    <p>At the moment I thought about using Futura Medium in headlines and ITC New Baskerville Roman for the text-parts. Is this a good combination? I tried setting the headlines bold but the bold Futura looks a bit too strong.</p>
    <p>I would be really grateful if someone could give me a hand in helping me to pick the right fonts to make my thesis paper not only good concerning quality but also neatly looking.</p>
    <p>Thanks a lot!<br>
    Florian</p>
