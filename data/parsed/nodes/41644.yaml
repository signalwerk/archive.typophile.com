      <p>Okay, thanks! I did not even know that! So is there anything else that's printer-friendly and clean looking? I even thought of using MS's Office:mac 08 Calibri &amp; Cambria combination but I thought about this one paper where my lecturer was simply stunned by me using Sabon (I was trying out things though) ... and that's why I think it is important my thesis paper looks good.</p>
      <p>It's clear to me that I want to use a sans-serif for topics and a serif font for the body. The body would be 12 pt and the headings probably 16 pt but I know it totally depends on what fonts I use.</p>
      <p>I want to 1.5-space the paper as double-spacing looks gross.</p>
      <p>So ... I won't ask about my options here because I know there a plenty ... but are there any good combinations you already tried you could pass on to me?</p>
