      <p>Don’t use ITC New Baskerville for body copy, it gets mushy and gross at those sizes. I wouldn’t recommend any Baskerville if you aren’t having it printed professionally; even really great laser printers can have trouble rendering Baskerville well enough that cranky professors with poor eyesight won’t mind dealing with it.</p>
      <p>Futura is going to overwhelm just about any Baskerville; and really, the geometry of the designs just clash.</p>
