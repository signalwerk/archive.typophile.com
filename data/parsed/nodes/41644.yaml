      <p>1. Ask your supervisor.</p>
      <p>2. Check to see if there is some requirement of your school. The faculty I wrote my Masters in let you do pretty much anything you wanted, but every other graduate degree at my uni made you do everything (and I mean everything) in 12 pt Courier.</p>
      <p>3. If all else fails, use a really common sans for heads and a really common serif for text, particularly if your thesis has to be filed as a pdf or scanned into your national archive. Helvetica and Times are the lowest common denominators.</p>
