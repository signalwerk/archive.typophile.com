      <p>Florian<br>
      You just about had the proper contrast. I would use Futura Demi as the subhead and go to the original Monotype or foundry version of Baskerville.<br>
      I have often used Futura demi with Garamond No. 3 for some the academic printing. Another thing to consider is what kind of paper your going to use. Baskerville for smooth finish paper and matte or vellum finish for Garamond.<br>
      Good Luck</p>
