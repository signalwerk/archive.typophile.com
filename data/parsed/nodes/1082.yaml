    html: <p> This font was inspired most in Peignot and a typeface designed by Hrant Papazian (wich name i do not remember) wich idea was to increase legibility by increasing the diferences between pairs of letters. <br> <br>And the "n"... mmm... the font that Hrant designed used a "n" like capital... </p>
