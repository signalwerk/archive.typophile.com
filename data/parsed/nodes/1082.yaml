    html: <p> Paco, the font you're talking about was more "conceptual" than practical (I've never given a copy to anybody), and it goes by the name of MasLucida - it started from the outlines of Lucida - because Lucida has the "essential" forms I needed. <br> <br>It's great to see the idea used like this, especially in a bitmap font! BTW, your lc "e" (in your large outline sample) is one of the most powerful glyphs I've seen in a while. <br> <br>hhp </p>
