    html: <p> Thanks a lot for the comments,  <br> <br>Grilo, let me work in some other variations, as soon as i have them done, i will post here the results. <br> <br>Hrant, thanks for your comments, the large outline sample it's another font in progress that will be posted here soon to be criticized, called Sacrílega Plus (Sacrilege) i want it to be for text setting... so there will be a lot to criticize, and to learn. <br> <br>Thanks a lot. <br>=) </p>
