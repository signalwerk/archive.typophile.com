    <p>I am the first stages of a logo design for a Dutch company which goes under the name Provokatief. As you might guess, this means provocative. In Dutch this is normally spelled with a c, but the client feels that using a k is provocative in itself. I tend to agree.</p>
    <p>The company sells trainings for high-end managers, and it's methods are rather unorthodox. In the briefing we concluded a masculine, corporate logo was a good choice, but to do this with a twist. This seems a good choice for the market this company reaches; which also dictates that the logo should not be very illustrative or ornate, rather simple and direct.</p>
    <p>In the attached file you find four options. Bear in mind these are sketches; although I worked them out in illustrator, they are far from refined. These four are my favorites among the thirty or so ideas I have our second meeting about. I have used magenta as a second color, which is slightly provocative in this market, but of course this choice is arbitrary in this stage of the development. </p>
    <p>I would like your feedback on these four. My problem is to find a right balance between the corporate feel and the provocative twist. Too corporate doesn't make the company stand out, too provocative alienates the corporate market it still has to reach.</p>
    <p>Also typographical feedback is welcome - I've used Univers, Futura and Eurostile here, but there might be less wellknown fonts that bring across the same feel.</p>
