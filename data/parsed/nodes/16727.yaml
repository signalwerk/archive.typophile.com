      <p>Number 1 without a doubt. The reverse k draws the eye immediately and provokes reaction, as you want to achieve.</p>
      <p>Maybe try the whole wordmark in single colour (magenta?). The k sticks out enough due to it being reversed; you don't need to single it out using vivid colour to emphasise it - it breaks up the word. This might be just me, but I'd like to read it and during the process of reading have the k jump out (and you'd 'get it'). If it's hitting you smack bang in the face then you read the k immediately before trying to read the wordmark.</p>
      <p>wdq154226 - thanks, I've been looking for a ratchet buckle (?)</p>
