      <p>Thanks so much for looking into it. I agree on the first being the most potential. It is the most self contained one. I agree with Duckworth about making the whole wordmark unicolor; as it is now the k stands out in three ways: orientation, color and the spelling. Two might be more than enough.</p>
      <p>Strange enough this was one of the rare cases my first idea turned out to be the most potential. Doesn't happen often. :-)</p>
      <p>I'll get back to you all after meeting the client - for which i have some more ammunition now.</p>
      <p>Thanks, again.</p>
