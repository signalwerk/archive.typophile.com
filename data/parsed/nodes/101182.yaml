    <p>My newest typeface, <strong>Transat</strong>, is now available on <a href="http://www.myfonts.com/fonts/typetanic-fonts/transat/" rel="nofollow">MyFonts</a> and <a href="http://www.youworkforthem.com/font/T4279/transat" rel="nofollow">YouWorkForThem</a>. For a limited time, you can get all 5 weights, plus optically corrected obliques, for $30.</p>
    <p>Transat is a geometric sans serif typeface, with caps inspired by Art Deco signage — found inside the "Gare Maritime" (literally "sea station") ocean liner terminals in both Le Havre and Cherbourg, France, in the early 1930s. The name “Transat” is the common shortening of “Compagnie Générale Transatlantique,” the company that operated majestic ocean liners like the SS <em>Normandie</em> out of Le Havre from 1862–1974.</p>
    <p>Transat includes many OpenType features, such as ligatures (ff/ft/fft), small capitals, case sensitive forms, stylistic alternates, arbitrary fractions, and a full complement of proportional, tabular, and oldstyle figures. Enjoy!</p>
