    <p>SO I took a stroll down in the french quarter:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/palace_canal2_4462.jpg"></div>Palace Cafe on Canal Street. I really love how tall and skinny the letterforms are. I wish I could have gotten a better view of the font. It's very elegant and classy Serif font!<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Jax_millhouse2_4152.jpg"></div>Jax brewery. Here's a Serif Font. It has short and stubby looking letters kerned  a litter wider apart than usual.<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/oohlala2_4298.jpg"></div>Here's some very decorative  handwritten font along with a serif font using small caps.<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sherie amour2_6353.jpg"></div>Calligraphic script<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/voodooblues22_3475.jpg"></div>Here's a fun and modern san serif font. The letters remind me of bubble fonts<p></p>
