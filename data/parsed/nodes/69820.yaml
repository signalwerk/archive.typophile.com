    html: |-
      <p>Hi John;</p>
      <p>When makeotf fails at parsing a parsing a feature file, it lists the keywords that are legal in the current context.  It saw the keyword "lookup", when it was expecting one of the tokens that it lists in the message</p>
      <p>From comments on another e-mail thread, I think that you got your syntax problems fixed.</p>
      <p>- Read Roberts</p>
