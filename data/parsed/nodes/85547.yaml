    html: |-
      <p>I know the answer's already there, but I was just thinking: </p>
      <p>as to making the “extrusion” behind the letters, you could use the 3D Filter in illustrator, keeping only the faces you need. Give the text a relatively thick outward outline. Then use an Expand-ed version of the text outlines to punch the space between the letters and their extrusions. And then follow with the clipping paths..</p>
