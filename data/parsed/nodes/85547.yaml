    html: |-
      <p>It's a great effect, due in part to the intricate detail. I'm sure you could do this using PhotoShop, but I would be using Illustrator and creating a series of vectors you can reuse. This is time consuming, but you'll get the best result as you can exercise a lot more control over the shadows and line work.</p>
      <p>You can import these into PhotoShop and add textures later.</p>
      <p>This tut doesn't show you exactly how to achieve this effect, but may help:</p>
      <p><a href="http://vector.tutsplus.com/tutorials/designing/create-a-variety-of-3d-lettering-effects-for-poster-design/" rel="nofollow">http://vector.tutsplus.com/tutorials/designing/create-a-variety-of-3d-lettering-effects-for-poster-design/</a></p>
