    <p>Dunwich Type Founders is proud to announce our latest release, Armitage.</p>
    <p>Sturdy and humane, Armitage renders type with vintage American warmth. Even with a subtle sparkle Armitage stays humble to let words work.</p>
    <p>Rather than build on recent trends, Armitage starts over, derived from designs of the late nineteenth century. Designer James Puckett cast a wide net for source material. Letters from sign manuals, inscriptions, period posters, and architecture inspired Armitage as they inspired the designers of the nineteenth century.</p>
    <p>Armitage’s asymmetrical strokes and subtle flares prevent monotony by rolling with the cadence of language. Six weights and italics make Armitage suitable for a wide range of tasks. Sturdy features stand up to adversity. With a strong jaw clenched in a grin, Armitage is always ready to work.</p>
    <p>Armitage is dedicated to Punchcut!, who do us the favor of hosting Typophile, and to the current and former board members of the Society of Typographic Aficionados, who make Typecon happen. I must also acknowledge the scholarship of James Mosely. James’ essay <em>The Nymph and the Grot</em>, and the accompanying illustrations had a powerful influence on the design of Armitage.</p>
    <p>Web use licenses are available from Fontspring. Students, teachers, and individuals can purchase discounted personal use licenses from MyFonts.</p>
    <p><a href="http://dunwichtype.com/pdfs/DTF_Armitage_Specimen.pdf" rel="nofollow">Click here to download a PDF specimen of Armitage</a><br>
    <a href="http://www.fontspring.com/fonts/dunwich-type-founders/armitage" rel="nofollow">Armitage can be purchased at FontSpring.</a><br>
    <a href="http://new.myfonts.com/fonts/dunwich/armitage/" rel="nofollow">Armitage can also be purchased at MyFonts.</a></p>
