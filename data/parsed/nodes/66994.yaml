    html: |-
      <p><cite>I'd be interested in some more insights about your inspiration.</cite></p>
      <p>Armitage started as a design based on wonky Victorian square capitals that appear on apartment buildings from the late nineteenth century. When that went nowhere I used the proportions as the basis for a font based on letters from an 1812 lettering manual that James Mosley showed in <em>The Nymph and the Grot</em>. Other bits and pieces came from Victorian posters and random old letters scattered around the USA. I’m working on an essay about it that will appear on ILT.</p>
