    html: |-
      <p>Haven’t found a match yet, but appears to owe a debt to Nicolas Cochin:</p>
      <p><a href="http://www.myfonts.com/fonts/lanston/ltc-nicolas-cochin/">http://www.myfonts.com/fonts/lanston/ltc-nicolas-cochin/</a></p>
      <p>EDITED: Olympus appears to be a match (dropping out the intersections of perpendicular strokes appears to be a customization):<br><a href="http://www.ffonts.net/Olympus-Normal.font?text=Because%20of%20Winn-Dixie">http://www.ffonts.net/Olympus-Normal.font?text=Because%20of%20Winn-Dixie</a></p>
      <p>Computer Support Corporation evidently appropriated and renamed typefaces; does anyone recognize  Olympus as a digitization/copy/ripoff of another typeface?</p>
