    html: <p>It may interest some that most of the Casady&amp;Greene FLF series is available for free from the typOasis, apparently with permission. Mind, these are TTs, not T1s. Might be good enough, though, for a recapture-your-youth flip.</p>
  - id: 520837
    user_id: 11578
    user_name: HVB
    user_path: null
    date_raw: 2 Sep 2012 — 9:34am
    date: 2012-09-02T09:34:00
    votes: null
    html: <p>There are a very few FLF fonts for which typOasis did not receive permission to post (and so they don't appear there). These include Abelard (by Judith Sutcliffe) and Richard Ware's Garamond family. Ware's Keycaps and his Murmansk and Glasnost groups weren't labeled 'FLF',  and are also omitted.</p>
