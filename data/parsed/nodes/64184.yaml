    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 12.Nov.2009 10.50am </div>
      <p>* Three short talks<br>
    * Wednesday 18 November 2009 at 7pm<br>
    * In the Bridewell Hall, St Bride Foundation<br>
    * Admission £7 - concessions £5 - Friends of St Bride £3<br>
    * Pay on the door</p>
    <p>Three short talks about lesser-known aspects of Isotype, a method for<br>
    showing facts and connections in pictorial form. The talks draw on new<br>
    research from the ‘Isotype revisited’ project at the University of Reading.</p>
    <p>Matthew Eve: From hieroglyphics to Isotype<br>
    —————————————————————<br>
    Between 1942 and 1945, Otto Neurath drafted a ‘visual autobiography’, an<br>
    innovative attempt to document his life and work through its visual<br>
    influences, and culminating in Isotype. This talk describes the shape<br>
    and content of Neurath’s text, his intentions for its publication – not<br>
    realized at the time – and work now underway to give it published form<br>
    as From hieroglyphics to Isotype.</p>
    <p>Sue Walker: ‘They are wizard books’<br>
    —————————————————-<br>
    Graphic explanation for children is one way to describe the children’s<br>
    books designed by the Isotype Institute from the 1940s to the late<br>
    1960s. This talk will offer an account of the making of these books and<br>
    show how the Neurath’s brought a child-centred approach to book design,<br>
    and how Isotype principles were used to enhance accessibility.</p>
    <p>Eric Kindel: Isotype in Africa<br>
    ———————————————<br>
    In the mid 1950s, some ten years after Otto Neurath’s death, Marie<br>
    Neurath, director of the Isotype Institute, travelled to West Africa to<br>
    consult on public information initiatives in several countries emerging<br>
    from British colonial rule to full independence. This talk will review<br>
    Marie Neurath’s trips to Nigeria, Gold Coast and Sierra Leone in 1954<br>
    and 1955, before looking in detail at Isotype work produced in support<br>
    of social democracy in the Western Region of Nigeria.</p>
    <p><a href="http://stbride.org/events/isotyperevisited" title="http://stbride.org/events/isotyperevisited">http://stbride.org/events/isotyperevisited</a></p>
