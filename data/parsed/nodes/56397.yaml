    html: |-
      <p>Command G<br>
      Name your glyphs "paragraph.alt" and Q.alt"</p>
      <p>They will now be available to users in the glyph palette.</p>
      <p>Also:</p>
      <p>Create a Stylistic Set.</p>
      <p>sub paragraph by paragraph.alt;<br>
      sub Q by Q.alt;</p>
      <p>This will work if you generate ".otf" fonts, and be available to users in the OT features palette.</p>
