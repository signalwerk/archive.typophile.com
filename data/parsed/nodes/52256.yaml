      <p>Molly:</p>
      <p>Charles' comment about paper, ink, and press is very solid. Spend some time in bookstores looking at new books—ones that identify the typefaces—and the paper they were printed on, and then at books from other eras.</p>
      <p>&amp; since you are in Minneapolis, I invite you to visit the Minnesota Historical Society Press at the Minnesota History Center in Saint Paul. I'm Design &amp; Production Manager there, and I can show you quite a few recent typefaces and how they print on various kinds of stock.</p>
      <p>william[dot]powers[at]mnhs.org</p>
      <p>powers</p>
