      <p>Your favourites are original old-styles.<br>
      Might I suggest <a href="http://www.fonts.com/findfonts/detail.htm?pid=202823" rel="nofollow">Montype Bulmer</a> as being next in line chronologically, if not Baskerville.</p>
      <p>Staying closer to what you like, Robert Slimbach (who redesigned Garamond for Adobe twice) has produced two new designs in the classic old style vein, Minion and Arno. Arno Pro is his final word (so far) on the genre, a face of truly awesome scope. </p>
      <p>If you are interested in sophisticated book typography, being able to handle such things as footnotes--with special glyphs for superior figures, and optically scaled type for the smaller text at the bottom of the page or the back of the book--then you need this kind of Pro (OpenType font). So I would concur with Justin that the route to take is via InDesign, which will enable you to set proper typography, and which comes with Arno bundled, AFAIK.</p>
