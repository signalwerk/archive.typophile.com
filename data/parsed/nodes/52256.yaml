    <p>Hi, I'm 17 and I just came into some money that I'd like to use (partially) to buy a new font for my Mac. I've only bought a couple of fonts before but I download a lot from free websites. I am kind of a font maniac, as most of you probably are, I can identify almost any font from sight and have trouble reading books in fonts I dislike. </p>
    <p>Anyway, some of my favorite fonts are: Adobe Garamond, Granjon, and Caslon. I like really classic fonts with nice rounded question marks and apostrophes, and if something's too off or weird about a font I have trouble writing long things in it (I'm a novelist). For instance, I have Deepdene on my computer and I thought I would love it, but it's just too quirky for me. </p>
    <p>I'd love some suggestions about what I could buy that's similar to the fonts I like, but a little bit different. I was thinking Sabon, but I'm not sure. Any thoughts? Please, give me some of your fontaholic expertise!</p>
    <p>- Molly</p>
