    html: |-
      <p>Now that you've made your selection --</p>
      <p>I notice that you have both Adobe Garamond and Granjon, and were thinking about Sabon. These are all based on <cite>Garamont</cite> or <cite>Garamond</cite> fonts. The Adobe Garamond is probably the best in PostScript digital format. In metal -- there was no Adobe of course -- the Granjon was probably superior. Sabon was a compromise, designed by Tschichold so that the same letterforms could be set by hand, and by either the Monotype machine or the Linotype linceaster. It was an admirable &amp; beautiful compromise; well worth it. And as things turned out, it was also one of the best fonts for the early Linotype digital photocomposers, such as the Linotron 202. For reason none of us completely understand, Sabon didn't fare so well in the conversion to PostScript. Sabon *Next* isn't really the Tschichold font, simply another Garamond revival. </p>
      <p>The point of all this is that type is used to put ink on paper, and what the ink is, the paper is, and the method of applying it all have a considerable effect on what looks good.</p>
      <p>So pay attention to how your fonts look when printed on the inkjet or laser printer, and how the same fonts look when printed offset, especially the Trade edition of the book (before the mass market edition). This is just knowledge, so if you wind up a successful novelist, you aren't pestering the publisher to use a font that looks good on your laser printer, but is rather less successful when printed offset.</p>
      <p>And if you find your interest in fonts runs deeper than that, you might consider purchasing a font editing tool like FontLab. You can then work over fonts -- at least, those where the license permits -- to your own taste and needs. Adobe allows this.</p>
      <p>Whether your interest in type remains one of appreciation or grows larger, good luck to you.</p>
      <p>Charles</p>
