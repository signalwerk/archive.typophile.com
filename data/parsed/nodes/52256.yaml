      <p>Do you have a program like InDesign or Quark to make full use of your fonts? If not, the student pricing on InDesign is similar to the price of a nice font family, and I think you'd enjoy it. Also, at least InDesign CS2 let you get Garamond Premiere Pro for free once you registered it.</p>
      <p>Adobe's Type Collection for Students is a good deal as well--quite a few good families in it.</p>
      <p>Other typefaces you might like: Baskerville (I like Storm's Baskerville 10 Pro the best), LTC Caslon (a nice Caslon), Minion Pro (has a very rounded question mark--I think it comes in the Type Collection for Students), and Bembo Book</p>
      <p>-Justin</p>
