      <p>Personally I love <a class="freelinking external" href="http://www.underware.nl/site2/index.php?id1=dolly&amp;id2=overview" rel="nofollow">Dolly</a> from Underware (or <a class="freelinking external" href="http://www.underware.nl/site2/index.php?id1=dolly&amp;id2=pdf" rel="nofollow">here for a pdf</a>). I use it regularly, and it works beautifully for book typography, plus it is quite affordable.</p>
      <p>If I had the money or a good project for it, I would also buy <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/ourtype/fresco_lf_normal/" rel="nofollow">Fresco</a> from OurType. </p>
      <p>If you like classic fonts, take a look at <a class="freelinking external" href="http://www.typography.com/fonts/font_styles.php?productLineID=100020" rel="nofollow">Requiem</a> from Hoefler &amp; Frere-Jones. Also quite afforable.</p>
      <p>I've also been looking at DSTYPE's <a class="freelinking external" href="http://www.dstype.com/capsa.html" rel="nofollow">Capsa</a>. Yet again, very afforable.</p>
      <p><a class="freelinking external" href="http://www.ludwiguebele.de/item.php/Typefaces/Text/Augustin" rel="nofollow">Augustin</a> also seems quite nice, but more angular.</p>
      <p>Feliciano Type Foundry has <a class="freelinking external" href="http://www.felicianotypefoundry.com/main/?page_id=22" rel="nofollow">Rongel</a>, which is also a nice classic typeface (unfortunately only Type 1 format).</p>
      <p>If you want a real classic looking face, <a class="freelinking external" href="http://www.stormtype.com/typefaces-fonts-shop/families-21-jannon" rel="nofollow">Jannon</a> from StormType could be interesting.</p>
      <p>For more suggestions, check out the <a class="freelinking external" href="http://typophile.com/node/39592" rel="nofollow">Choosing a font for book design?</a>-thread.</p>
