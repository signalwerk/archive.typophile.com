  html: |-
    <p>Dalton Maag will have been in business for 15 years this autumn. To celebrate this we hold an exhibition of our work and share our thoughts about type. The exhibition first runs in Zurich from 9 June to 23 June. We are hosting an opening night on 8 June. For details please go to: <a href="http://www.daltonmaag.com/index.html?lang=de" title="http://www.daltonmaag.com/index.html?lang=de">http://www.daltonmaag.com/index.html?lang=de</a></p>
    <p>We plan to travel the exhibition and will release further dates and locations in due course.</p>
    <p>Bruno Maag<br>
    Dalton Maag Ltd</p>
