    <p>Hey Guys, </p>
    <p>I'm a third year Graphic Design student and i am constructing an imaginary seminary for one of my papers. </p>
    <p>I am looking for interesting Spatial Typographers as ideas for speakers, I have a few chosen but i would really like to find some tattoo artists that specialize in type, as i am looking into the personal aspect contrasting corporate identities.</p>
    <p>Can anyone help me out with some suggestions?  </p>
    <p>Thanks! :)</p>
