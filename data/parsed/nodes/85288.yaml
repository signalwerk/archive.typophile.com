      <p>Thanks everyone for commenting and for the kind words. In general, I agree with the idea that I have some problem with these angled stems and terminals. I still have to find a solid system to get the consistency right. What bothers me the most is that I tend to use the angled top a little bit too systematically, and I'm testing to see if I like having some flat tops or different solutions to keep these angles. You can also see some example of my recent tests on this thread (sorry, it's in french but you'll get the idea with the images) : <a href="http://www.typographe.com/forum/viewtopic.php?pid=13783#p13783" title="http://www.typographe.com/forum/viewtopic.php?pid=13783#p13783">http://www.typographe.com/forum/viewtopic.php?pid=13783#p13783</a></p>
      <p>Nothing has proven to be completely successful so far, but I will post the results when I feel that I have found a good solution.</p>
      <p>I'd like to start experimenting with some weights soon, and maybe that'll bring some answers.</p>
