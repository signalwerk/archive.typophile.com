      <p>I recently did some extended test prints, and I think my bold is not bold enough. also, I might have make it a tiny bit too big because testing at 12pt was looking bigger than most fonts. So I'm back to the drawing board to increase the weight of each glyph and I surely will edit the shape of some because I think I might have missed some nice opportunities with letters like v, w, x, y and z.<br>
      I'll also work on a new spacing, I feel like it needs to be a bit increased in general.</p>
      <p>I'll make sure to upload some of the updates. Any thought anyone?</p>
