    <p><strong> <a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Johnson &amp; Smith Foundry of Philadelphia</strong></p>
    <p>The Johnson &amp; Smith foundry was a descendant of <a href="/wiki/Binny%20and%20Ronaldson" class="freelinking" rel="nofollow">Binny and Ronaldson</a>, one of the first American type foundries. It was formed in 1833 when Johnson &amp; Smith took over the James Ronaldson foundry. Johnson introduced <a href="/wiki/electrotyping" class="freelinking" rel="nofollow">electrotyping</a> in Philadelphia and was a tireless worker. In 1843 it became the Johnson foundry after Smith's retirement. Johnson passed away in 1860 and the firm was taken over by his three partners at the time and became <a href="/wiki/mackellar_smiths_and_jordan" class="freelinking" rel="nofollow">MacKeller, Smiths &amp; Jordan</a> foundry, one of the most important American foundries of the 19th century. In 1834 the company published a specimen book showing the first American <a href="/wiki/sans%20serif" class="freelinking" rel="nofollow">sans serif</a> type in both <a href="/wiki/upper%20case" class="freelinking" rel="nofollow">upper</a> and <a href="/wiki/lower%20case" class="freelinking" rel="nofollow">lower case</a>.</p>
