  html: "<p>here's my first crack at a bitmap type family. fignuts is a slab serif face with 8 styles: <br> <br>11 condensed light <br>21 light <br>22 regular <br>31 extended light <br>32 extended regular <br>33 extended bold <br>34 extended bold outline <br>35 extended bold shadow <br> <br>the font includes full punctuation, ligatures, and oldstyle &amp; lining figures. I'm also planning on including a full sans-serif version of the family as soon as the slab version is completely worked out. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/2682.jpg\" alt=\"fignuts01.jpg\"></p>"
