      <p>First, looks like a hand-lettering to me. All repeating letters are different (3 /S, 3 /E, 2 /R, 2 /P...).<br>
      Second, I was unable to spot a font that could match all these specific letters. Looks like it mixes different styles of font (at least 2): /S (/T, /A, /L...) on one side and /P, /R, /O and /P on the other.  May be mixing some of these ones would be interesting: <a class="freelinking external" href="http://youngjerks.com/#/highway-typeface" rel="nofollow">Highway</a> (flare serif but overall design looks in the same vein), <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/wyvern" rel="nofollow">Wyvern</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/railroad-gothic-rr" rel="nofollow">Railroad Gothic</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/kimmy/maxwell-sans" rel="nofollow">Maxwell Sans</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/capearcona/ca-airespro" rel="nofollow">CA Aires</a>, <a class="freelinking external" href="http://www.tendollarfonts.com/strassenbahn" rel="nofollow">Strassenbahn</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/route-66-nf" rel="nofollow">Route 66</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/outer-loop-nf" rel="nofollow">Outer Loop</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/snv" rel="nofollow">SNV</a>, <a class="freelinking external" href="http://www.myfonts.com/search/highway" rel="nofollow">Highway</a> (Blue Highway, Highway Gothic, Interstate, Expressway...), <a class="freelinking external" href="http://www.youworkforthem.com/font/T1052/signal" rel="nofollow">Signal</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/saa" rel="nofollow">SAA</a>, <a class="freelinking external" href="http://www.myfonts.com/search/monod" rel="nofollow">Monod</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/coniglio/nomad" rel="nofollow">Nomad</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/context/cougher" rel="nofollow">Cougher</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/rsantos/van-condensed" rel="nofollow">Van Condensed</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/inventory" rel="nofollow">Inventory</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/kimmy/station" rel="nofollow">Station</a></p>
