    html: |-
      <p>I think you better go by the reverse logic. Identify the beginning of a word not by presence of space but by absence of letters:</p>
      <p>@anyLetter = [a b c ...];<br>
      ignore sub @anyLetter b';<br>
      sub b' b.alt;</p>
      <p>This makes it easier to deal with different spaces, punctuation marks, numbers, currency symbols, math symbols, etc.<br>
      In case you do <em>not</em> want to see the b-to-b.alt replacement if, for example, a period precedes the word, then simply include period in the @anyLetter class.</p>
