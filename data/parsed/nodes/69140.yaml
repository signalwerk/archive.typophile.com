  html: |-
    <p>I have problem with automatic contextual replacement in InDesign f.e. with such code</p>
    <p>sub space b' by b.alt;</p>
    <p>it works only after usual or non-breaking space, but when after a 'emdash' is inserted thin space — the replacement not works automatically, then I must insert alternate manually via 'glyphs palette'. What can I do to resolve this problem? Or it's impossible?</p>
