    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;: Tabular&nbsp;Figures</strong></p>
    <p>A style of numbers that are all designed on a common width so as to line up in documents that compare numerical data in columns. One drawback of this scheme of common widths is that some numbers appear to have too much space, the number one in particular.<br>
    See <a href="/node/17239" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Proportional Figures</a>. Sometimes indicated in a font’s name as <span class="caps">TF</span>.</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/4863">Tabular Periods and Spaces</a><br><a href="http://www.typophile.com/node/41464">Speaking of Tabular Figures</a><br><a href="http://www.typophile.com/node/41191">A Tabular Question</a><br><a href="http://www.typophile.com/node/33642">Keeping Rupee, Peseta Tabular?</a><br><a href="http://www.typophile.com/node/16998">The Space between the 1 and 9 in Most Fonts is Terrible. Why??!?</a><br><a href="http://www.typophile.com/node/17217">Which Figures for Default</a><br><a href="http://typophile.com/node/8268">Question about #s</a><br><a href="http://typophile.com/node/8268">Which Figures Should Be Default in OpenType Fonts?</a><br><a href="http://www.typophile.com/node/16330">OpenType Feature “tnum” problem in&nbsp;InDesign</a></p>
