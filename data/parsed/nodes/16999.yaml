    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Tabular Figures</strong></p>
    <p>A style of numbers that are all designed on a common width so as to line up in documents that compare numerical data in columns. One drawback of this scheme of common widths is that some numbers appear to have too much space, the number one in particular.<br>
    See <a href="/wiki/Proportional%20Figures" class="freelinking" rel="nofollow">Proportional Figures</a>. Sometimes indicated in a font's name as TF.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/4863" rel="nofollow">Tabular Periods and Spaces</a><br>
    <a href="http://www.typophile.com/node/41464" rel="nofollow">Speaking of Tabular Figures</a><br>
    <a href="http://www.typophile.com/node/41191" rel="nofollow">A Tabular Question</a><br>
    <a href="http://www.typophile.com/node/33642" rel="nofollow">Keeping Rupee, Peseta Tabular?</a><br>
    <a href="http://www.typophile.com/node/16998" rel="nofollow">The Space between the 1 and 9 in Most Fonts is Terrible. Why??!?</a><br>
    <a href="http://www.typophile.com/node/17217" rel="nofollow">Which Figures for Default</a><br>
    <a href="http://typophile.com/node/8268" rel="nofollow">Question about #s</a><br>
    <a href="http://typophile.com/node/8268" rel="nofollow">Which Figures Should Be Default in OpenType Fonts?</a><br>
    <a href="http://www.typophile.com/node/16330" rel="nofollow">OpenType Feature "tnum" problem in InDesign</a></p>
