  - id: 45790
    user: 1250
    date: 2003-01-29T23:01:00
    date_raw: 29 Jan 2003 — 11:01pm
    votes: null
    html: "<p>I'm only warming up to Python scripting myself. It's basically a way to \"algorithmize\" tasks. <br> <br>Like for the shearing you might say: <br>1. Go around the outline point by point. <br>2. When you find an acute angle of less than 30 degrees*: put two new points on either side of the point in question, 2 ems away; dump the original point and connect the two new ones. <br> <br>* The shear threshold recommended by Doyald Young. <br> <br>So you run the script and BAM! in a second you've done the work of a full day. Both RoboFog and FontLab support Python scripting, although I don't think the code is portable. BTW, now that FontLab is so powerful, I don't see much room left for RoboFog. <br> <br>&gt; how does he explain that Hz spacing stuff?! <br> <br>You mean in terms of doing it without a computer? I guess the same way he explains Optima Next: he sits there and talks, and somebody else \"codifies\" things. Either that or he's got a next-generation voice-command system... <br> <br>hhp <br></p>"
    html_clean: "<p>I'm only warming up to Python scripting myself. It's basically a way to \"algorithmize\" tasks. <br> <br>Like for the shearing you might say: <br>1. Go around the outline point by point. <br>2. When you find an acute angle of less than 30 degrees*: put two new points on either side of the point in question, 2 ems away; dump the original point and connect the two new ones. <br> <br>* The shear threshold recommended by Doyald Young. <br> <br>So you run the script and BAM! in a second you've done the work of a full day. Both RoboFog and FontLab support Python scripting, although I don't think the code is portable. BTW, now that FontLab is so powerful, I don't see much room left for RoboFog. <br> <br>&gt; how does he explain that Hz spacing stuff?! <br> <br>You mean in terms of doing it without a computer? I guess the same way he explains Optima Next: he sits there and talks, and somebody else \"codifies\" things. Either that or he's got a next-generation voice-command system... <br> <br>hhp <br></p>"
