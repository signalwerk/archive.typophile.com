    html: <p>Oops... Remember when Apple used to have these 'language kits' for the System 7? I used to refer to the Chinese Language Kit as CLK... Of course that's history now. Daimler Freudian?! <br> <br>&gt; I guess Hiroshige is a subtley faux orientalesque face? <br> <br>Maybe. But to me it's more like Western calligraphy. Oh yes, a lot of CJK fonts are unmistakably calligraphic, but I think it is awkward to combine Western and Eastern calligraphic type like that, because they are based on fundamentally distinct principles and traditions. <br> <br>I'm cooking up some articles on Chinese typography at the moment... I'll let you know as soon as they go live. <br> <br>K.</p>
