    <p>Hi.</p>
    <p>new here.</p>
    <p>I feel a little like brown shoes with a tux..........but......</p>
    <p>there appears to be quite a wealth of information &amp; interesting design concepts wandering around, so here goes......</p>
    <p>I’m an architect.  looking for a very tall very slender font for a new logo.<br>
    Similar to Blakely light, Newport classic, Bougainville Light, Ingram BT.<br>
    thin, wispy,<br>
    needs to have a cool S.<br>
    The S’s the above fonts all are more like letters - i’m thinking like a soft S turn in the road.....doesn’t round over at the top or bottom.  kind of like the S in city blueprint, but more compressed, taller.</p>
    <p>It SEEMS like I have seen this font .....somewhere.</p>
    <p>I will understand if the general response is pfffffffft.......</p>
    <p>but any help appreciated.</p>
    <p>bob</p>
