    html: <p>If there is only one style of cap (no alternates) it's preferred that both the lowercase and uppercase slots are filled, even if the glyph is the same.</p>
    html_clean: <p>If there is only one style of cap (no alternates) it's preferred that both the lowercase and uppercase slots are filled, even if the glyph is the same.</p>
