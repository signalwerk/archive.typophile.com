    html: |-
      <p>Well if the early 1900s are acceptable as “modern” then you’ll find plenty of books using different blackletter typefaces in German literature.</p>
      <p>If you image-search for “german blackletter” then you’ll find works from that time period. Personally, I found Herman Zapf’s handwritten blackletters quite beautiful. You might also find the chapter on Gothic Lettering interesting in “Letters &amp; Lettering” ( <a href="https://archive.org/details/letterslettering00browiala">https://archive.org/details/letterslettering00browiala</a> ).</p>
      <p>A modern blackletter design from that time would be Elfen Fraktur: <a href="https://fdi-type.de/blog/elfen-fraktur-article/">https://fdi-type.de/blog/elfen-fraktur-article/</a></p>
