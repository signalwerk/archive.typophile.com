    html: |-
      <p>Actually, the more I look at it the more I think it's a customization of existing typefaces. Nothing is really consistent:<br>
      - "WTAPS": /S should be "slab-serifed" too but it's not, making me thinking they could have started with some "<a class="freelinking external" href="http://typophile.com/node/99935#comment-539470" rel="nofollow">United Sans</a>-like", manually adding slab-serifs<br>
      - "LIMA" VS. "WTAPS": nothing matches (different weight, different /A...). "LIMA" is actually matching many "NBA" font from Eriq Jaffe's collection I've already pointed to.<br>
      - /76 counter: also inconsistent with both "WTAPS" and "LIMA" designs. Counter can't be square but hexagonal/faceted if had to match "WTAPS" or /7 would have been bottom serifed to match "LIMA".</p>
