      <p>What's legal is what the lawyers feel like arguing that day. Nothing more, nothing less.</p>
      <p>The point I'm trying to get at here is not that I think it's OK to deliberately copy someone's else's work, but that in the world of type design, at some point it becomes unavoidable.  Really, aren't we are derivative of the original Latin?  Of course we are, we have to be or else our glyphs would be unrecognizable and thus unreadable.  There is a certain built in need for us to make our work about 95% similar to what came before.  You can't say that of any other artform really.  I'm just trying to open this pandora's box for discussion.  Obviously being a (very amateur) type designer myself, I wouldn't like the idea of people copying my work and claiming it as their own, but you know what, I bet their lower case L's are going to be damn similar.  Again, they have to be.  So we can probably agree that autotracing another font is wrong, but what about copying by eye?  What about that work you posted recently where you said you created it by starring at another font?  Is that copying? Or is it merely "being inspired by?"  I find this line incredibly thin in the world of type design.  Again, I say, it has to be.</p>
