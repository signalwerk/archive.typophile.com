      <p>That you even have to ask the question indicates that you know it is wrong already.  Legal or not, I can't say, I'm not a lawyer. Whether the results suck or not is not the question.  Whether this is your "first font" or not is not the question.  The question is, why in the hell would you want to do that?  The question behind that is why do you want to design type to begin with? If you want to design type just because you want to "make one of those" (while pointing to a stack of existing successful typefaces), you are making a bad decision.  If you want only to do revivals then at least study the type and drawings of the originals and learn from it and make your contribution of how to make it better for our time and place.  If you don't want it to be better than what exists, then don't bother trying.<br>
      If you indeed want to design your own type, then just do it. You don't need to trace someone else's work to be able to do that.  If you seriously want to begin a career as a type designer and want to get up to speed quickly, go to Reading or KABK for a year and learn from good teachers who know their stuff. If you can't do that, then just start designing the typeface that is within you and you would like to see in use. You can learn a lot by just taking a shot at it.  Your failures will teach you well, your successes not as much.</p>
