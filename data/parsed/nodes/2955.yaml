    html: <p>&gt;some of the Gaudi buildings. <br> <br>Funny, yet of course sad, story. Gaudi was killed while building the Sagrada Familia. Apparently it was important to Gaudi that it face due east – hence, entirely disrupting the already established circulation (auto, pedestrian) patterns in that area. He was killed by an errant streetcar on its way through the newly wayward streets. Since Gaudi had been living at the site during its construction, no one recognized him &amp; everyone at the scene thought he was a homeless man. Consequently he was sent to the ‘people’s’ hospice. As opposed to the decent hospital where the wealthy were taken. Upon finding out the situation, one of the bishops or something went to the hospice, but Gaudi refused to leave. There’s some famous quote which I can’t remeber along the lines of ‘I lived with the people &amp; I’ll die with the poeple.’ Which of course he unfortunately did. </p>
