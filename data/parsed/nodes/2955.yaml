    html: "<p>It has been a lot of time without going to Barcelona, too long and no excuse, maybe this year... I have not very hot information but I hope these few and actual links can be useful in your trip: <br> <br>There are now two exhibitions in the <a href=\"http://www.museuartsdecoratives.bcn.es/home.htm\" target=\"_top\">Museu de les Arts Decoratives</a> about two catalanes designers, Oscar Tusquets and Carlos Vives, that might worth a look. <br> <br>You could take also a look at this <a href=\"http://www.adg-fad.org/news.php?pg=byid&amp;categ=4&amp;id=212\" target=\"_top\">one</a> and the site, can be interesting too. <br> <br>In Madrid <a href=\"http://www.guiadelocio.com/madrid/\" target=\"_top\">La Guia del Ocio</a> is a  very useful link to know what is going on at the week in the city, in <a href=\"http://www.guiadelocio.com/english/\" target=\"_top\">english too</a>, concerts, movies, exhibitions, etc. I don't now how it works the one from <a href=\"http://www.guiadelocio.com/barcelona/\" target=\"_top\">Barcelona</a>, try it, here you have some <a href=\"http://www.guiadelocio.com/barcelona/buscaarte/index.cfm\" target=\"_top\">exhibitions</a> for example, I can't find the english version for Barcelona though. In Madrid and in Barcelona (I guess) you can buy the print version more complete (weekly) at the Kioskos everywhere. <br> <br>Hope it helps a little. <br> <br>Buen Viaje! <br></p>"
