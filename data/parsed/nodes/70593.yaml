    <p>Hi everyone -</p>
    <p>Apologies for what may be a basic question, but my company has been evaluating TypeKit for the past month and I'm trying to figure out if we can use Google Font API instead. I have a couple of questions I was hoping folks might be able to help answer.</p>
    <p>We've been wanting to use TypeKit in the hopes that we'll be able to use a variety of typefaces across a portfolio of sites that we manage and it's attractiveness up until this point has been that it provides the largest library of high quality typefaces in a way that protects the foundries rights as well as offers the most cross browser support.</p>
    <p>That said, if we can use the Google Font API to access non-open source fonts that we buy from foundries such as Mark Simonson, Veer, Village, etc., it might be cheaper and more cost effective for us to buy the fonts and use them this way, rather than pay for the enterprise TypeKit account.</p>
    <p>Specifically, I see that the Google Font API has a "custom" module that allows you to reference fonts on other servers. My understanding is that you still have to be referencing fonts that have a web embedding license in order to use the custom module, and that you can't just use any standard font that you've purchased. </p>
    <p>Is this correct? </p>
    <p>Also, while I'm asking, does using the Google Font API automatically convert your TTF typeface to other formats such as EOT in order to display it in IE browsers or do I need to provide links to an EOT packaged typeface on our servers?</p>
    <p>Thanks in advance. Any help navigating this subject would be greatly appreciated.</p>
    <p>best,<br>
    kyle</p>
