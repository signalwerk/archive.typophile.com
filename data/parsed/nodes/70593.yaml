      <p>I think web font services can offer two distinct advantages over "host your own" solutions.</p>
      <p>1. Make commercial fonts available<br>
      2. Provide on-the-fly enhancements when improved (hinted) versions of fonts become available, or when new platforms and browsers emerge. </p>
      <p>The downside would seem to be having someone else host the fonts, and losing a level of control. </p>
      <p>So unless I'm missing something, the Google service doesn't provide item 1 and doesn't mention 2. So I really don't see the point of it vs freeware "host you own" sets from operations like Font Squirrel.</p>
      <p>My guess is that this was developed for Google's own use (in ads) or perhaps for things like Googledocs (where it will be used to host licensed commercial fonts), and Raph is just sharing Google’s engineering cleverness with the world.</p>
