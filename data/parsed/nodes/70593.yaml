      <p>@sii</p>
      <p>Number one on your list *is* available: in addition to whatever Google is offering in their repository, you can add Typekit's offerings (using your Typekit account), as well.<br>
      Not sure how it would work with anybody else's product. Haven't had a chance to fully absorb all of it.</p>
      <p>&gt;So I really don't see the point of it vs<br>
      &gt;freeware "host you own" sets from operations<br>
      &gt;like Font Squirrel.</p>
      <p>I am assuming (only assuming, don't know for sure) that Google is using a CDN so speed of delivery is an issue. Also - and this is almost sure to be the case - Google's servers will already be set up to gzip and add appropriate cache-headers where appropriate. So, if you're unsure of what you need to do server-side to host effectively, Google is providing that.</p>
      <p>&gt;My guess is that this was developed for Google's own use or perhaps for things like &gt;Googledocs, and Raph is just sharing Google’s engineering cleverness with the world.</p>
      <p>Well, if you ain't at least got engineering cleverness, what have you got?<br>
      I'm guessing differently. The whole thing has been set up as a big open source project and there's a lot of enthusiasm behind it.<br>
      But it's still in the cradle right now and only time will tell.</p>
      <p>@kylec</p>
      <p>I would contact Garrick Van Buren at Kernest.com - the open source font hosting service. He will probably be able to provide you with exactly what you need, even if it's just sound advice. <a href="http://kernest.com" title="http://kernest.com">http://kernest.com</a><br>
      garrick[at]kernest.com</p>
