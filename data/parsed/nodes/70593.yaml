      <p>In its current state, the Google Font API only works with the fonts we're hosting, which are all open source. The WebFont Loader library (written in JavaScript) has modules that will load fonts from other providers, including Typekit.</p>
      <p>For the fonts we host, we automatically generate EOT, with more formats coming. We will be improving hinting, spacing, and other technical aspects of our fonts, and all these improvements should just work when you use our API.</p>
      <p>We are using Google infrastructure for content distribution. Without getting into specifics, it's pretty good, and we're doing all the things you'd expect to optimize performance.</p>
      <p>We definitely built this to serve both the world (as an open source project) and Google applications, including the new Spreadsheet Forms themes, and of course we're excited about the future of the project.</p>
