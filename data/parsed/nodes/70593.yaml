      <p>I don’t think I’ve seen any commercial foundries allowing such use. And yes, converting a commercial font to EOT is most likely a violation of the license agreement (EULA).</p>
      <p>With Fontfont Webfonts you can upload the files to your own web server, but they demand a license per domain, per business. Also: they only offer EOT and WOFF files, which isn’t completely cross browser yet.</p>
