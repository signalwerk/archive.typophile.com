    <p>Hi all,</p>
    <p>I am trying to replicate the main body font style shown at this website <a href="http://mediatemple.net/" title="http://mediatemple.net/">http://mediatemple.net/</a> but I am doing it in photoshop text with (no antialiasing).</p>
    <p>on my computer this webpages text is rendered like this:<br>
    <a href="http://gyazo.com/dcda9166b97bdc41afc8a1f27a42e53f.png" title="http://gyazo.com/dcda9166b97bdc41afc8a1f27a42e53f.png">http://gyazo.com/dcda9166b97bdc41afc8a1f27a42e53f.png</a></p>
    <p>And in the webpages code for this text it shows:<br>
    16px "Lucida Grande", "Lucida Sans Unicode", Arial, Helvetica, sans-serif</p>
    <p>Now I have all the fonts there on my computer, but when I am in photoshop and trying to replicate this font it's just not the same (Lucida Grande is very close but MT's is a lot cleaner).</p>
    <p>I'm new to special webfonts or anything like that, not entirely sure what is going on here.</p>
    <p>Any help would be great</p>
