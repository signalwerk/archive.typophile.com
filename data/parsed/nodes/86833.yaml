      <p>Hi guys this is what I had in photoshop (the bottom one) without any antialiasing.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/47701d4d096f716e7be2859ccd19eebc_4136.png"></div><p></p>
      <p>But I think I have worked it out, as soon as I tried this with (sharp) antialiasing, its pretty much identical to what I see in the webpage, so as Frode Frank says I guess what this is telling me is that there is some slight rending going on in my browser, and that it's not just a pixel font.</p>
      <p>I guess I've got to research some more about webpage font rendering/@fontface clear type, that sort of thing.</p>
