    <p>Hello all.</p>
    <p>As I learn and read more about type design, one area of continued interest for me is the lowly/mighty <a href="/wiki/serif" class="freelinking" rel="nofollow">serif</a>. It's always facinating to me to see what aspect of their function authors highlight.</p>
    <p>For example: <cite>Counterpunch by Fred Smeijers</cite><br>
    On pages 30-32 (and elsewhere) he talks about how serifs promote good word image by defining the space between letters and the counters within letters. This helps designers as we try to balance the internal and external space. Smeijers suspects it helps readers too ...</p>
    <p>I'd like to do a comprehensive read on the topic. Can you recommend credible books or other resources that give insight here?</p>
    <p>Thanks,<br>
    Randy</p>
