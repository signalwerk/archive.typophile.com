    html: "<p>My primary interest in the role of serifs in reading concerns their possible contribution to overcoming lateral masking in the parafovea. This is non-intuitive, but research has shown that adjacent forms that have connecting strokes are less affected by lateral masking that forms that are separated by gaps. Lateral masking is the phenomenon whereby which a form perceived in the parafovea that is adjacent to another form or between two other forms is harder to recognise than an isolated form. Obviously lateral masking has a huge impact on our ability to recognise any letter shapes in the parafovea, but some recent research indicates that serifs, by bridging the gap between the letters, may reduce the effect of lateral masking. As I say, this is counter intuitive, since it is the proximity of the letters that produces lateral masking in the first place. Note that this isn't counter to Hrant's comments about serifs helping convergence of letters into boumas: it explains in part how they do this in the parafovea, by overcoming the lateral masking that obscures the 'role architecture', to use Peter Enneson's phrase, of the constituent letters.</p>"
