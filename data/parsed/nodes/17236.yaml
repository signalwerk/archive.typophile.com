      <p>I think Tiffany has an important point that is useful to consider: in developing a test typeface with enough variants to isolate the serif's effects, wouldn't it be useful to settle on a letterform that, at text weights, can accomodate sans as well as serif structure, i.e. a moderate-contrast thing like Schneidler, Chaparral or Joanna? </p>
      <p>Then, too, there are other choices you would face, like, do I deny the possible importance of diagonal stress and make the thing all vertical like Baskerville or Cheltenham? Throw out the ideas that Bloemsma was getting at? </p>
      <p>Then, how to filter out the variable of width? It's true that not only spacing but letter widths should change as well depending on serif presence. </p>
      <p>But also, proportions between letters must have an effect on reading comfort; surely monospaced type is not optimal, but then too much width contrast also hinders reading comfortably. </p>
      <p>Rather than enumerate the variables, I guess I'm saying that if you want to test the usefulness of serifs, it may require more complex, interlinking factors than simply which serifs are present. What assumptions do you start with? Obviously Helvetica and Didot are not candidates. So many things affect readability that it might be necessary to test existing faces that are related but differ in one aspect, like contrast, and come to some conclusion about the ideal contrast level. Then, test faces with the same contrast level and differing amounts of diagonal stress. Determine the optimal diagonal stress. Then test faces with optimal stress and contrast with different widths.....</p>
      <p>Of course if you start that kind of elimination with serif faces, find "the one" most readable, and chop off a few serifs, it might fall apart..... Back to square one?</p>
