      <p><cite>Smeijers is probably the most reputable, mainstream author</cite><br>
      What he is saying makes sense. And I agree he is talking about serifs in the context of notan and boumas without the vocabulary. I'd like to read your articles in Typo 13. Can you send me the text? Or is it still available?</p>
      <p><cite>I wonder</cite> if there aren't at least several things fighting sans serif typography for text.<br>
      1. The word shapes break down into letter shapes when you space sans serif type optimally for text (by harmonizing the space between letters with the space inside letters). This is another way of saying what you said above.<br>
      2. In some sanserif type (and also in modern serif typography) the vertical stress accentuates the break down.<br>
      3. Defining word shape requires a solid perception of x-height and baseline. This is kind of like the traintrack idea, but more at a word level than a scentence level. Sans serif type really lacks some definition at the baseline, but also the x-height.</p>
      <p><cite>One thing that has yet to be really addressed is the semi-serif.</cite><br>
      This is what got me started. I'm reworking a semi serif design that was laying around on my hardrive. What I would like to achieve is essentally "sans serif" for longER text, facilitated by the addition of serifs at critical locations. What I've found thus far is that it's very difficult not to allow stylistic choices to trump the schema that I'm trying to work out. I'm finding it very interesting.</p>
      <p>I was messaging with Paul Hunt about opentype this afternoon and we stumbled on a further idea together. What about a semi-serif opentype face, that contextually places serifs based on neighboring glyphs? An interesting concept that could potentially allow a font to reflect this dialogue in a new way.</p>
      <p>Thanks for your thoughts all and keep them coming. -- Randy</p>
