      <p>Paul, your second ton and tonne look better, but here you are following the traditional way an italic would be done, so they conform more to reader expectations.</p>
      <p>Another issue here is the narrowness of the letters and of the sidebearings. </p>
      <p>Randy, on your example, one could get the total sans case to have more even color, similar to the more serifed version, by pulling in the side bearings appropriately. So the issue isn't just serifs but also spacing. If you start deleting or adding serifs depending on context, you would probably want also to play with the spacing according to context, when you add or substract the serif. This might get more complicated than it's worth. Still, I think it is an interesting exploration, and you may well come up with something very nice. Good luck!</p>
