      <p>Randy, the bulk of justifications of the serif, even by reputable and otherwise excellent sources is pretty hollow. Reasons like "they create train tracks for the eyes", "they define the line so that line-returns are easier", and "they define the ends of strokes better" are the sad norm - sad because these things don't hold up for 10 seconds once you really delve into reading.</p>
      <p>Smeijers is probably the most reputable, mainstream author who has come closest to what I think makes sense - and that's pretty rare unfortunately. He's talking about notan, and that's the key. But he still doesn't go far enough. The articles by Peter and myself in Typo 13 try to go deeper, although they don't really focus on serifs. Serifs help essentially because they increase the convergence of letters into boumas. In comparison, the only way sans fonts can attempt this is by making the letters too close, and of course that backfires.</p>
      <p>A paradoxical extension of this is that serifs help by making letters<br>
      less themselves (and more parts of boumas). It's possible to see this<br>
      as parallel to the belief that a real text font needs a certain ugliness.</p>
      <p>BTW:<br>
      1) One thing that has yet to be really addressed is the semi-serif.<br>
      2) You might be interested to know that Bloemsma went through<br>
      a love/hate thing with serifs - he was conscientious enough that<br>
      he needed to justify them (as you seem to be trying to do) instead<br>
      of just leaning on them blindly or shunning them.</p>
      <p>hhp</p>
