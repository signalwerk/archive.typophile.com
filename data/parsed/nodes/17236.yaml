      <p>In 'Letters of Credit,' which you probably already know, Walter Tracy makes a number of interesting comments on the sans serif. One of these is that the sans needs to be more tightly spaced because of the absence of serifs. </p>
      <p>John, which sans was tested in the research about lateral masking? The reason I ask is that I suspect the reason for the problems of letter recognnition in sans is that a balance between counter space and letter space is important for letter recognition. If the letters are wide--the 'o' more circular rather than oval--and the letters closely spaced, as in Helvetica, then I would expect the letters would be less easy to decipher. But when the letters are narrower--the 'o' is a narrower oval--then the narrower letter space of the sans would be less of a problem, and the 'lateral masking' less. </p>
      <p>This is my effort to explain why I find Helvetica in small printed text much less readable than Gerard Unger's Vesta, or Meta for that matter. My explanation: the narrower counters balance the tighter spacing of sans faces.</p>
      <p>I suspect that the 'knitting together' of words as units is a due to a different effect of serifs. I think the serifs help to achieve even color in the word, making it easier for the parafovea to see upcoming words as separate words, and plan for the next saccade. In other words, the parafovea can identify words as grey blocks separated by word spaces,even without being able to read the letters within the words. The set of grey blocks may be enough for planning, and highly functional. </p>
      <p>Without the serifs, and with wide letter spacing, the grey word block is not as distinguishable from the word space. That is why, I think, you can't simply track Helvetica more widely and get a good readable text face from it. And it is why sans serifs need tighter spacing in the first place. </p>
      <p>In other words, serifs serve two purposes: both knitting the words together visually as units and keeping the letters far enough apart in comparison to their inner spaces for easy letter recognition. In sans faces, these two different goals come into conflict, particularly for wide designs. I think even with narrow designs the horizontality of the serifs helps get better color to knit together words, but the advantage is less marked for designs with narrow counters. </p>
      <p>Finally, I think the horizontal strokes help to tell the eye where the line of text is, so it is easier for the eye to 'hold the line', and not get confused with the next or previous line. I think that is a factor in why sans usually need more leading. </p>
      <p>Now one of the reasons why all this is difficult to prove is that the brain can overcome all these obstacles that sans put up. But it is taxed by the effort. That is my explanation for why some faces seem friendlier and more inviting and easier to read. And also why I think Kevin Larson found that usable comprehenson was better with good typography. In other words comfort in reading--which I think you, John, were skeptical about once here--is a very real factor that makes an important functional difference, even though identifying it is quite subtle and hard to test for.     </p>
      <p>Incidentally, none of the effects I am hypothesizing here are dependent on the existence of a 'bouma' effect, such as Peter Enneson is hypothesizing--that is, a reading of whole words as patterns (including internal features of letters), rather than first identifying letters and then assembling them into words.</p>
