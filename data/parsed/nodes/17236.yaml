      <p>William: <em>John, which sans was tested in the research about lateral masking?</em></p>
      <p>The lateral masking research to which I referred was not testing typefaces per se. Peter Enneson sent me the information, and I'll need to dig around in my notes to find it. The tests were using shapes of various kinds, first isolated, then adjacent to other shapes, and then with connecting strokes to adjacent shapes. Participants were better able to identify the shapes in the parafovea in the latter case, which surprised the researchers. My observations about serifs are an inference from this study, but obviously a lot more study needs to be done, and specific testing of typefaces should be done to confirm the inference.</p>
      <p>I don't recall every being skeptical about the importance of comfort in reading. It seems to me very important. Eye-strain is one of the most easily quantifiable aspects of readability testing, because it is possible to measure the activity of the relevant muscles.</p>
      <p>Your comments about the relationship of internal and interletter spacing in sans serifs are absolutely right (have you read <em>The Stroke</em> yet? this is illustrated very well). But this addresses the question of why one kind of sans serif, spaced in a particular way, may be more readable than another kind of sans serif spaced in a different way. It doesn't address the point of the serif.</p>
