      <p><cite>a lot of people think MINE was the rubbish part!</cite><br>
      It's a superb piece, and I'd love to see whether divergence in incunable-style micro-properties can work as well as the macro-divergence of your example lowercase (on the grounds that the reduced clarity of vision in the parafovea isn't really gaussian - there's no <cite>certainty</cite> that different architectural forms are more clearly perceived than things like different lengths of serif or different relationships between internal and external axes). As for colour, I do find consistently divergent colour very off-putting in, say, the light s of the original California Old Style or the light h of digital Poliphilus, but perhaps if divergent colour were spread more evenly across the alphabet it wouldn't matter so much.</p>
