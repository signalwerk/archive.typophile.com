      <p>Paul: My observations on my effort apply to yours too. I don't think you need the interior serif, but you will need to look at your glyph proportions. Hacking off a serif changes the size of the counter significantly. Spacing looks tight for text, but it's hard to say in this context. Pretty sure it will need to loosen. Your nn combo with two serifs may make sense in the context of your design (which is much closer to serif type than sans). In mine, i'm trying to add the minimum to maintain as much sans feel ... hence tonne #3</p>
      <p>William: Removing a serif from the outside also shrinks the apparent size of the counter, though less than removing a serif inside (see above). In the sample, I did adjust the spacing (didn't simply whack off a serif), but I didn't slightly widen the sans version (which I should).</p>
      <p>Chris: In Leporello you were approaching readablility by looking at glyph structure itself. What I hope to accomplish to keep glyph structure as consistent (normal?) as possible, and to isolate the effect of the serifs. This is for my own sanity. If you change too many things, you loose the cause of your effect.</p>
      <p>Re: naive audience rather than type Design people</p>
      <p>Since quirks will be limited to serif placement, how quirky the face appears will depend on the OT rules applied. The idea is to create n.full, n.xht, n.base, n.sans sets for the lower case (where applicable), and test various observations like I made above. So I'll be changing the rules instead of changing the glyphs themselves. Hopefully this will add a level of detatchment about normalness. In otherwords, I'll try to turn off the voice that says: "it's readable, but is it marketable?" To be honest, I don't think even the craziest placement would fall too far out of the mainstream.</p>
      <p>Tiffany: The modulation here is looking more toward the helvetica end of the spectrum, though not as monoline or vertical. As the weights get heavier I plan to apply more contrast. The glyph structures in this light version should hint at what is to come though. There is a definate diagonal stress.</p>
