      <p>&gt; It doesn’t address the point of the serif.</p>
      <p>I guess I wasn't clear enough. The serif reconciles the conflicting poles of even color and adequate letter spacing for readability. It also helps the eye hold the line of text. </p>
      <p>Also you have the additional problem with sans that they are generally supposed to look linear, which makes it more difficult to get even color at the joins. </p>
      <p>So the power of the serif, with modulated stroke, is that you have a powerful tool that solves a number of problems at once. </p>
      <p>I was waiting till I didn't have to pay shipping from Europe for The Stroke. I'm ordering it now, and look forward to reading it.</p>
