      <p>Perhaps we could wrap our discussion around a concrete example. Below are 4 variations on the letter n ranging from a "traditional semi serif" to a sans version. I've put them in an isolated context (a serif free zone if you will) -- the word "tone". Then I put it next to another potentially serifed letter -- in the word "tonne". Obviously these are simplified cases, but I'm curious what forms work in this specific context, based on people's notions about serifs and readability.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/n_serifs.gif"></div><p></p>
      <p><cite>Note: The resolution of the image makes spacing problematic. I know this is a light weight which introduces it's own issues, but it's what i've got.</cite></p>
      <p>My observations:<br>
      1. The serifs do help to define the space between the n and rounds.<br>
      2. As a result tone #3 seems best to me (traditional semi serif placement)<br>
      3. One serif seems to be enough to define the space between the letters.<br>
      4. The space inside the n seems well enough defined without serifs inside.<br>
      5. It seems like the x height serifs are more critical than the baseline serifs.<br>
      6. As a result, tonne #3 seems best to me.<br>
      5. I'm making these observations as a designer in a meta context not a reader immersed.</p>
      <p>Thoughts?</p>
