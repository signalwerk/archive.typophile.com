      <p>Lasse, interesting observation about the ilj. These three letters are given serifs in FF Info Display. I think it idea was to make them easy to differentiate from each other and the cap I, but this would be an additional benefit. </p>
      <p>John, I finally got my (cheap) Amazon USA copy of 'The Stroke'. The illustration you referred to, on p. 42-43, is just brilliant. It really settles the argument as to the importance of the ratio of interletter space to counter space. An additional factor he doesn't go into, but which I think is important is the influence of the weight of the letters on ideal spacing. These all interact with the influence of serifs.  </p>
      <p>The interaction of different factors is I think why Randy's inquiry is tough. It isn't only the presence or absence of serifs, but also the *ratios* of stroke weight, size of counters and inter-letter spacing. And Lasse's insight raises the question of whether there are special issues for narrow letters.</p>
