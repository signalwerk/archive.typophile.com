      <blockquote><p>I introduce Myfonts.com, and Fontshop.com, and then search for “slab serif”.</p></blockquote>
      <p>Some of the unexpected results you're seeing come from the fact that you're using the <em>search</em> function — which on these two sites finds any text that matches your search term. This is a job instead for <em>browsing</em> which results in fonts that have been filed in preselected categories (see <a href="http://www.fontshop.com/fonts/category/" rel="nofollow">FontShop</a> and <a rel="nofollow">MyFonts</a> category pages). Of course, this is a usability issue which could be improved by including a link to a matching category when you perform such a search (search for "slab serif", get a link to the Slab Serif category page, then a list of all the fonts that match the search term).</p>
      <p>On Chaparral: I empathize with all sides, and this example adds yet more fodder when I argue with those who find no use for narrower subclasses, or even classification at all.</p>
