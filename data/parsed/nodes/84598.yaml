    <p>My expectation of the term would be obviously with serifs, and they would all be horizontal portions of rectangles parallel or perpendicular to the baseline without exception.&nbsp;<br>
    Such serif structure and the related lack of stress in curves team up to form what I always thought of as a slab serif...&nbsp;Chaparral has some in common with my definition in the baseline serifs, some of the curves are unaffected by a diagonal pen.&nbsp;<br>
    But... Most of the common characters in&nbsp;Chaparral show the liveliness of the pen, and there are lots of angled serifs, more in the class of the “old style”&nbsp;class, than the Slab Serif sub-class of&nbsp;“modern”</p>
    <p>Today's classifying and sub-classing of&nbsp;type designs is not entirely dissimilar to trying to guess the weight of angel, and it may be that my old definitions have been shifted by the sands of type, so perhaps some more opinions would help.</p>
    <p>To partly establish a mass of examples of my opinion, I introduce Myfonts.com, and Fontshop.com, and then search for&nbsp;“slab serif”. Both seem to follow my definition, for at least a few fonts, and for the most part keep to it for 80% or so, before the search engines seem to break down.&nbsp;<br>
