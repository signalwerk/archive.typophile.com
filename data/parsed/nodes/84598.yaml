    html: <p>I also always thought of Chaparral more as an old-style text face with sturdy serifs than a Slab. But if we agree on Clarendon-like typefaces as being Slab Serifs — with stroke contrast and features left over by the pointed pen — Chaparral could count for one too, a humanist one. (Serifa/Clarendon, Caecilia/Chaparral) Or do you mean to argue that Slab Serif is a subclass of modern? (Uh!)</p>
