      <p>David, I think you're saying that the serifs alone aren't enough to classify something as a slab or not. And I totally get that point. I think I take a more loose approach on this one. I think a classification of slab or old style could both be considered right. Chaparral is a pretty thorough hybrid sharing lots of traits with both. But then perhaps one could also argue that its main use could have some influence (I certainly use it more in the way I would a normal text face, which only supports your point too).</p>
      <p>I'm comfortable calling it either, though I still tend to prefer slab. It's where the essence of the face sits for me.</p>
