  html: |-
    <p>So, I have been working on writing up detailed step-by-step instructions on how to install RoboFab, FontTools/TTX and friends to go with FontLab Studio. Both Mac and Windows. I figured if I found some aspects non-obvious I would not be alone.</p>
    <p>The scripts and such that one can run with these tools are very handy, even if you are not interested in writing your own scripts. </p>
    <p>I am pretty much done, but before I post them on the FontLab blog, I could use a small number of folks who are interested in installing these bits, to test out my instructions.  :)  Especially on Windows, as it has fewer font-editing folks and doesn’t get as much attention.</p>
    <p>If interested, just drop me a note here and I will pass you the current draft.</p>
