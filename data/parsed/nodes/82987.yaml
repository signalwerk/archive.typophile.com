    <p>We'll be taking Typophile offline at 12:00AM EST (9:00PM PST) today (11 June 2011) for maintenance and software upgrades. We plan to have everything patched and back online as soon as possible, but may be down for most of Sunday 6/12 to perform all necessary tests.</p>
    <p>No site design/function changes are expected at this time.</p>
    <p>Direct any inquiries to me at <a href="mailto:typophile@punchcut.com">typophile@punchcut.com</a> (or comment below.)</p>
    <p>Thank you!</p>
    <p>//jared</p>
