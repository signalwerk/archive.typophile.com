    html: <p> Doh, I usually don't forget to describe the client when it comes to logo critique. <br> <br>It's a nu-jazz band. meaning they play jazz but incorporate samplers and syntheziers in their music... They are also some sort of conceptual band, so they don't stick completely to the jazz route.  <br> <br>I wanted a logo that was relatively neutral for the above reason, but when I think about it, it should be something organic. <br> <br>As for the dentist office comment, yeah, I have had it before... :/ <br> <br>Back to the drawing board I guess.  <br> <br>Suggestions for a condensed gothic typeface? (other than trade gothic) </p>
