    html: <p>I'm playing with the idea of growing branches, and perhaps flowers (but that's stretching it a bit) on the LB part, to emphazise the jazz in an interesting way, it helps getting away from the corporate look IMHO. Here's a small update (only sketches). <br> <br><img src="http://www.typophile.com/forums/messages/29/1375.gif" alt="branching"> <br> <br>I feel that the first one is the best looking, extensive ornamentation might be interesting but It's quite difficult to get good looking branches <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>Comments? <br> <br>As for the musical note ideas, I thought of it from the beginning, tried a few... but the band didn't want anything obviously related to music, very interesting ideas and links non the less. Thanks.</p>
