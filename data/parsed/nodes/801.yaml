    html: "<p>&gt; something organic <br> <br>Cool - my favorite thing. <br> <br>Check out the logo here: <br><a href=\"http://www.thtfct.com/\" target=\"_top\">http://www.thtfct.com/</a> <br> <br>And there was also a logo shown here on Typophile, but I can't find it now - it was a lc \"b\" with some amorphous border - that was great too. <br> <br>Ligation: too often it's relied on as a gimmick, but here it might actually make sense. If the band were German I'd suggest trying to make an eszet look like an \"L\" + \"B\"... Or what about this: try merging the \"L\" + \"B\" into something that looks like a musical note, like maybe that clef thing. <br> <br><a href=\"http://www.google.com/search?hl=en&amp;q=musical%2Bsymbols\" target=\"_top\">http://www.google.com/search?hl=en&amp;q=musical+symbols</a> <br> <br>hhp</p>"
