  html: <p>Hi again. I'm having some trouble with a logo I decided to help a friends band with. <br> <br>Any suggestions as on what to do? The original idea was to have some sort of ligature, but none of the ligatures I tried to make looked good. <br> <br>This is what I have got so far, the "lundström bygdell" part is temporary, I'm looking for another condensed and good looking typeface (current is trade gothic condensed no 20). <br> <br><img src="http://www.typophile.com/forums/messages/29/1366.gif" alt="logo"> <br> <br>Suggestions welcome, it would be a huge plus if the typeface was available from the font folio 9 disc as my budget for this job is $0.</p>
