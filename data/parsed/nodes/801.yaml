    html: <p> Hmmm... Perhaps there's a way you can still use some of the work and momentum you've already built.... <br> <br>It wouldn't be too difficult to turn your current logo into a musical "repeat" bar -- the double bar with two dots next to it (the two dots, of course, would be formed by the counters of the "B"). This way ou could keep the "LB" direction and work in the music concept as well. <br> <br>David </p>
