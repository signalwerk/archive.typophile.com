    <p>Hi all,</p>
    <p>I need to commission an environmental portrait of a museum curator in Amsterdam for an American business magazine. Can anyone recommend a photographer in the Netherlands? Looking for someone with solid publication experience and an online portfolio that my client and I can review.</p>
    <p>Failing that, I’d be interested in the names of Dutch business magazines whose art director/photo editors I could contact for referrals.</p>
    <p>Thanks,</p>
    <p>Marc</p>
