    <p>Hello to All,</p>
    <p>I am new to the beauty and complexity of fonts in general and am in no way a professional in that area.  I do not make my money by writing or publishing. As I move along in my self education though, I have run across the history of Palatino.  I understand that the only digitized version of the original of Zapfs masterpiece is to be found on the font CD published by Softmaker.  I also found a thread on this site that discusses this, but it did not answer my questions.  I hope you all can help.</p>
    <p>1. The original Palatino (rendered as Palazzo Original from Softmaker) is quite different from later digitized versions.  Although much crisper, the later versions seem less elegant and flowing to my eye.  The gotcha for me is that Palazzo Original was, I believe, digitized without the owners permission (who was the actual owner at this time anyway). Is this accurate?</p>
    <p>2. I have purchased Bitstreams collections via Corel and I am very happy with the font quality. For my uses I rarely require ligatures or small caps, so they are fine for me. If I purchase the CD from Softmaker and use Palazzo Original for my own use, is that a violation of copyright or other laws? What about ethically? It is a shame that such a beautiful font has not been digitized by more legitimate means.</p>
    <p>3. Since I used Bitsream fonts regularly and there are opinions about their fonts being "rip-offs", where does Softmaker stand?</p>
    <p>4. If a font published by a legitimate company is discontinued for some time, can a person or company redistribute the font after a set length time as in copyright law? </p>
    <p>Thanks for your time.</p>
    <p>All the Best,<br>
    John</p>
