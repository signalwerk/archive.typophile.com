      <p>Hello,</p>
      <p>Thank you all for your kind and timely comments. I have played with the font Palatino in text using FontForge. Even in text sizes, it reads very well for a display face. It is a hair light, but that is what Aldus was developed to address. This is very good forum with many hands and minds willing to help a neophyte.</p>
      <p>I noticed that the question of ethics and legality is a little muddy (at least for me) with various opinions.  To be on the safe side, I will only use the font for my personal use and convert characters to graphics when I embed, which I rarely do.</p>
      <p>Uli,<br>
      Thanks for the links and documents; they were extremely helpful.</p>
      <p>Michael,<br>
      Thanks for the education and enlightenment.</p>
      <p>All others,<br>
      Thanks for the copyright data and the information on Aldus as a text companion to Palatino.</p>
      <p>One more thing,<br>
      I find Palatino easy to read at text sizes as well as easy on the eyes.  What are your opinions? What publications, books, etc use or have used the original Palatino? How about the original Aldus?</p>
      <p>Thanks again,<br>
      John</p>
    html_clean: |-
      <p>Hello,</p>
      <p>Thank you all for your kind and timely comments. I have played with the font Palatino in text using FontForge. Even in text sizes, it reads very well for a display face. It is a hair light, but that is what Aldus was developed to address. This is very good forum with many hands and minds willing to help a neophyte.</p>
      <p>I noticed that the question of ethics and legality is a little muddy (at least for me) with various opinions.  To be on the safe side, I will only use the font for my personal use and convert characters to graphics when I embed, which I rarely do.</p>
      <p>Uli,<br>
      Thanks for the links and documents; they were extremely helpful.</p>
      <p>Michael,<br>
      Thanks for the education and enlightenment.</p>
      <p>All others,<br>
      Thanks for the copyright data and the information on Aldus as a text companion to Palatino.</p>
      <p>One more thing,<br>
