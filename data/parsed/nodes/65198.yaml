      <p>The font file, Palatino BQ from Berthold, would be protected by copyright (for 100 years, as an institutional work - 95 in the U.S.) even if the <em>design</em> has no legal protection. A font file is like a book or a computer program, it has unquestionable and ironclad copyright protection.</p>
      <p>Just because Berthold went bankrupt doesn't mean it is an orphan work - presumably one of H. Berthold AG's creditors owns the font. And I'm surprised, therefore, that something so valuable - the only <em>authentic</em> digital version of Palatino - isn't still offered for sale.</p>
      <p>Actually, there are enough books out there exhibiting Palatino in hot metal form that I'm surprised, given that there are open-source imitations of Palatino out there, that there isn't a properly done, but legal, swipe of the typeface in a digital font.</p>
