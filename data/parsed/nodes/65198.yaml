      <p>One other important consideration is that Palatino was originally intended by Zapf to be a display face, although today just about anything with 'palatino' on it is used as a text face.</p>
      <p>Zapf's other design, <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/aldus/" rel="nofollow">Aldus</a> was intended to be a companion text face to palatino and as I understand it, is somewhat of the equivalent of what might have been called "palatino book." Notice the overall shape of the letters and the fact that there really is only one weight.</p>
      <p><a href="http://www.evanmade.com" target="_blank" rel="nofollow">evan</a></p>
