      <p>The above scan Enge-Aldus.jpg was drawn from page 13 of the 1967 edition "Linotype Schriften". On page 11 of this same edition, the normal Aldus is also shown.</p>
      <p>The very rare "Enge Aldus" was shown for the first time in the 1962 "Linotype Schriftenreigen", but I preferred the 1967 edition for a scan, because it was printed on calendered paper resulting in a better scan. </p>
