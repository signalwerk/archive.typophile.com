      <p>The historical situation, as far I have ascertained it, is as follows:</p>
      <p>The defunct H. Berthold AG, in 1992, one year before it went bankrupt in 1993, converted the old 1950 Palatino font, with the permission of Hermann Zapf, to a Postscript font, which is shown and embedded in the PDF scangraphic.pdf (see below) as "Palatino BQ" (see the PDF document properties).</p>
      <p>Several other font forging, font cloning and font renaming outfits, among them Scangraphic, Franzis, Softmaker, grapped this Postscript font file "Berthold BQ" after Berthold's bankruptcy and sold it under fancy names, e.g. under the names "Paxim" (Scangraphic), "Palazzo" (Softmaker), "Palmer" (Franzis), etc.</p>
      <p>See for example</p>
      <p><a href="http://www.sanskritweb.net/forgers/scangraphic.pdf" title="www.sanskritweb.net/forgers/scangraphic.pdf">www.sanskritweb.net/forgers/scangraphic.pdf</a>, page 13</p>
      <p><a href="http://www.sanskritweb.net/forgers/megafont.pdf" title="www.sanskritweb.net/forgers/megafont.pdf">www.sanskritweb.net/forgers/megafont.pdf</a>, page 9</p>
      <p><a href="http://www.sanskritweb.net/forgers/franzis.pdf" title="www.sanskritweb.net/forgers/franzis.pdf">www.sanskritweb.net/forgers/franzis.pdf</a>, page 23</p>
      <p><a href="http://www.sanskritweb.net/forgers/franzis2.pdf" title="www.sanskritweb.net/forgers/franzis2.pdf">www.sanskritweb.net/forgers/franzis2.pdf</a>, page 42</p>
      <p>You may use any of these versions, and also the old Berthold BQ version, for free, but you must not claim to be the copyright owner or the design owner, because the typopgraphical design rights to this 1950 Palatino have fallen into public domain.</p>
