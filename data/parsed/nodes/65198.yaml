      <p>As typerror correctly stated, the 1950 metal version was completely different, especially in small point sizes. The attached sample</p>
      <p><a href="http://www.sanskritweb.net/temporary/palatino-8-point.jpg" title="www.sanskritweb.net/temporary/palatino-8-point.jpg">www.sanskritweb.net/temporary/palatino-8-point.jpg</a></p>
      <p>scanned from a mid-1960 book shows 1950 Palatino, which had been typeset in 8 on 10 points and had been printed by letterpress on wove paper. There was virtually no contrast between thin upstrokes and thick downstrokes (e.g. of capital A etc.) in small point sizes.</p>
