    <p>Electrik Sheep Gallery Presents... Seb Lester</p>
    <p>Electrik Sheep is proud to be hosting Seb Lester’s first solo show<br>
    of exclusive prints and originals.</p>
    <p>Sneak preview: <a href="http://www.youtube.com/watch?v=cVhP1J2BA5M" title="http://www.youtube.com/watch?v=cVhP1J2BA5M">http://www.youtube.com/watch?v=cVhP1J2BA5M</a></p>
    <p>The Electrik Sheep Gallery, Newcastle will be showing a full body of work from<br>
    Seb Lester this August including a number of new limited edition prints and<br>
    originals exclusive to Electrik Sheep. These will complement a selection of<br>
    his well known back catalogue of work which documents his recent foray<br>
    into the world of art.</p>
    <p>Seb is "passionate about letterforms" which form the basis for his pieces.<br>
    He brings letters to life with his innovative approach and bold sense<br>
    of humour. Often drawing on racy subject matter and a dazzling array of<br>
    lettering styles he manages to produce thoroughly modern work that<br>
    would look as good on the wall of a New York loft apartment as it would<br>
    in an English country house.</p>
    <p>Seb was trained at the renowned Central Saint Martins School of art<br>
    and is internationally known for his typeface designs and illustrations<br>
    which have been used by many of the world’s biggest companies<br>
    and publications including Intel, The New York Times, The Sunday Times,<br>
    Penguin, Faber &amp; Faber and GQ Magazine.</p>
    <p>Following on from other exclusive solo shows from Faile, Eelus, Eine<br>
    to name a few the show will open on August 6th at 6pm with one<br>
    of Electrik Sheep's infamous street parties and an after party at<br>
    the Forth Hotel. All pieces will also be released online at the same<br>
    time for those of you unable to make the trip.</p>
    <p>See you there!</p>
    <p>Electrik Sheep Presents.. Seb Lester</p>
    <p>August 6th 2009, 6 pm</p>
    <p>Electrik Sheep<br>
    22 Pink Lane<br>
    Newcastle upon Tyne<br>
    NE1 5DW<br>
    UK<br>
    <a href="http://www.electriksheep.co.uk" title="www.electriksheep.co.uk">www.electriksheep.co.uk</a><br>
    <a href="http://www.seblester.co.uk" title="www.seblester.co.uk">www.seblester.co.uk</a> </p><div class="imageWrap"><img src="http://typophile.com/files/SebLester_Solo_Show_4972.jpg"></div><p></p>
