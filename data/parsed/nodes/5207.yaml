    html: <p> thank you Stephen &amp; Joe <br> <br>Hmm...maybe I should loose the arrows in the regular font &amp; just put them &amp; all the other figures in a dingbat set...?! <br> <br>I thought it would be nice to have a quick font for small texts in web graphics. <br> <br>A bold version wouöld be nice..if I ever get the time. <br> <br>/peter </p>
