    html: <p> I like this a lot. <br> <br>To echo Stephen, the UC height is great. The <br>numerals are nice too. <br> <br>The 'serifs' on the lc f and l as well as the UC I  <br>and J are a nice touch. The lc r is also nice.   <br>These nuances illustrate how attentiveness to  <br>optics at this scale is more important than  <br>how it's 'supposed' to be drawn. <br> <br>I have to get knit-picky and say that I don't care  <br>for the fat arrowheads hanging on those thin  <br>stems. Perhaps they don't need stems... <br> <br>Out of curiousity, what are your plans for this  <br>face? A bold version? <br> <br>//joe </p>
    html_clean: <p> I like this a lot. <br> <br>To echo Stephen, the UC height is great. The <br>numerals are nice too. <br> <br>The 'serifs' on the lc f and l as well as the UC I  <br>and J are a nice touch. The lc r is also nice.   <br>These nuances illustrate how attentiveness to  <br>optics at this scale is more important than  <br>how it's 'supposed' to be drawn. <br> <br>I have to get knit-picky and say that I don't care  <br>for the fat arrowheads hanging on those thin  <br>stems. Perhaps they don't need stems... <br> <br>Out of curiousity, what are your plans for this  <br>face? A bold version? <br> <br>//joe </p>
