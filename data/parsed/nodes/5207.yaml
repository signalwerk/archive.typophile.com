    html: "<p> Peter, <br> <br>I applaud three things: <br> <br>1, The caps are a good height - shorter than  <br>ascenders. Too often designers of pixel fonts  <br>forget what's been learned from traditional  <br>typography. <br> <br>2, The extensive character set. I suppose we <br>should expect a good number of accented glyphs <br>from a Swede. ;) <br> <br>3, The uc 'W'. It's nice. <br> <br>It's great to see you here. I admire your work <br>and often point to Mercury's little 'g' when <br>people ask why I love typography so much. <br> <br>Welcome. <br> <br>Stephen </p>"
    html_clean: "<p> Peter, <br> <br>I applaud three things: <br> <br>1, The caps are a good height - shorter than  <br>ascenders. Too often designers of pixel fonts  <br>forget what's been learned from traditional  <br>typography. <br> <br>2, The extensive character set. I suppose we <br>should expect a good number of accented glyphs <br>from a Swede. ;) <br> <br>3, The uc 'W'. It's nice. <br> <br>It's great to see you here. I admire your work <br>and often point to Mercury's little 'g' when <br>people ask why I love typography so much. <br> <br>Welcome. <br> <br>Stephen </p>"
