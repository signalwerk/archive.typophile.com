    <p>Hi,</p>
    <p>Wondering if someone can help me out with identifying a font. I tried what the font and i've had a good look online. No luck.</p>
    <p>The font I need the name of is within the Brisan Carriages logo at <a href="http://www.brisancarriages.co.uk" title="www.brisancarriages.co.uk">www.brisancarriages.co.uk</a> and the "Carriages" font.  I think it would be a script font. </p>
    <p>Thanks so much</p>
    <p>Lee</p>
