    html: |-
      <p>You could get pretty close to _BRISAN_ with PAG Bankas<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/PAGBankasAsBrisanLogoTypophile114879_3486.jpg"></div><br>
      with the bottom of the _S_ swept to the left.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/BrisanLogoTypophile114879b_5682.jpg"></div><br>
      <a href="http://www.myfonts.com/fonts/prop-a-ganda/pag-bankas/" title="http://www.myfonts.com/fonts/prop-a-ganda/pag-bankas/">http://www.myfonts.com/fonts/prop-a-ganda/pag-bankas/</a><br>
      As for _Carriages_ the g and s, and perhaps other letters are significantly modified, but you could use a script like Amazone which has similar _r_ and _s_ <a href="http://www.myfonts.com/fonts/tilde/amazone/" title="http://www.myfonts.com/fonts/tilde/amazone/">http://www.myfonts.com/fonts/tilde/amazone/</a> or pick a script with all letters but _s_ such as Commercial Script <a href="http://www.myfonts.com/search/Commercial+Script/fonts/" title="http://www.myfonts.com/search/Commercial+Script/fonts/">http://www.myfonts.com/search/Commercial+Script/fonts/</a><br>
      Palace Script <a href="http://www.myfonts.com/fonts/mti/palace-script/" title="http://www.myfonts.com/fonts/mti/palace-script/">http://www.myfonts.com/fonts/mti/palace-script/</a><br>
      or Sackers Italian Script <a href="http://www.myfonts.com/fonts/mti/sackers-italian-script/" title="http://www.myfonts.com/fonts/mti/sackers-italian-script/">http://www.myfonts.com/fonts/mti/sackers-italian-script/</a><br>
      I trust that another font detective will post something closer for the script, or perhaps even an exact match.<br>
      Don<p></p>
