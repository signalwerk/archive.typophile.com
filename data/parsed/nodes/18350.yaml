    html: |-
      <p>Mike, I think 'Rock It' looks like a grunged House Gothic, but it doesn't really match the 'Never Miss' sample. Look at the E, which is not symmetrical. I suppose you could 'manufacture' one using the Rock It/House Gothic F&amp; E. And the V looks like an inverted N. </p>
      <p>- Mike Yanega</p>
