    html: <p>I recall once talking to a printer about this sort of project. They told me they could print on the flap. But, they'd have to open the envelope to print on the flap and the front at the same time. In doing so they'd have to charge me extra for the time it takes to manually babysit the press (as it would probably cause more problems) as well as having to order more envelopes to keep from having too many unders.</p>
