      <p>i did this also; similar to what miss tiffany described they printed 4/0 with the envelopes completely unfolded, folded after printing.</p>
      <p>there was a slight increase in cost. unfortunately i worked thru a print broker and did not deal directly with the printer, who was far away. (i'm in new york, printer was in florida).</p>
      <p>i would not recommend that arrangement as it made on-press proofing impossible and we had to reprint once for color.<br>
      (i convinced the vendor to absorb the cost but that's another story). </p>
      <p>but it is possible as a 4/0  job.</p>
