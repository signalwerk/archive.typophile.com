  html: |-
    <p>I'm working on an envelope design that features the address on the front, and some text on the back flap that closes and seals the envelope. Does anyone know of a (inexpensive) printer that can so such a thing? I've done a lot of searching online, but have only come up with printers who print on the front. </p>
    <p>Any ideas are appreciated. Thanks!</p>
    <p>Robert</p>
