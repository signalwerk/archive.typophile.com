    html: <p>You're definitely best off printing flat, and having it converted into an envelop. It's more expensive, but the results will most likely look better. I once printed a large field of color on a folded envelope and the varying thickness on the back side (where the various flaps overlap) caused the color to print unevenly -- you could see the the impression of those thicker areas in the color field.</p>
