    html: |-
      <p>I've also printed on the flaps of envelopes, and as Miss Tiffany says, somebody has to manually open each envelope before it goes through the press. (And then close each flap again for delivery.) It's okay for a small print run. Larger quantities can make people unhappy. </p>
      <p>If it's a very large or very complicated print run, the printer can print on flat stock and have the envelopes die-cut and made after printing.</p>
