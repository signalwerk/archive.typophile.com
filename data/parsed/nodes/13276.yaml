    votes: null
    html: <p>Bee is URW's name for the old VGC "B" series. These were unnamed fonts that may go back further than Univers, and may have been knock-offs of Photo-Lettering faces. (Unfortunately, it's difficult to precisely date P-L faces, so I can't say for sure there was no Univers connection.) VGC had a whole series of fonts that only had a letter-number designation--no name--mostly casual scripts and such, but also sort of generic looking sans serifs, like the B series.</p>
  - id: 204288
    user_id: 1043
    user_name: Mark Simonson
    user_path: null
    user_image: /files/pictures/picture-1043.jpg
    date_raw: 23 May 2007 — 8:23am
    date: 2007-05-23T08:23:00
    votes: null
    html: |-
      <p>New information about the "B" fonts: They all originated at Filmotype in the 1950s. Each font had a different name that started with a G--Giant, Gaucho, Grant, Gazette, etc. VGC knocked these off in the 1960s (a common practice at the time) as the "B" fonts. In fact, most (if not all) of the unnamed fonts in VGC's catalog originated at Filmotype. P-L had similar fonts, but not quite the same design.</p>
      <p>FYI: <a href="http://typophile.com/node/29561" rel="nofollow">The Filmotype library is being digitized.</a></p>
      <p>Edit: I see that some similar information was provided in this thread: <a href="http://www.typophile.com/node/10616" title="http://www.typophile.com/node/10616">http://www.typophile.com/node/10616</a></p>
