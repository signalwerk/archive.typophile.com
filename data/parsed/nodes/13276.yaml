    date: 2005-06-24T08:07:00
    date_raw: 24 Jun 2005 — 8:07am
    votes: null
    html: <p>Bee is URW's name for the old VGC "B" series. These were unnamed fonts that may go back further than Univers, and may have been knock-offs of Photo-Lettering faces. (Unfortunately, it's difficult to precisely date P-L faces, so I can't say for sure there was no Univers connection.) VGC had a whole series of fonts that only had a letter-number designation--no name--mostly casual scripts and such, but also sort of generic looking sans serifs, like the B series.</p>
