    html: |-
      <p>Those may look good, but are they suitably neoclassical (18th century)?<br>
      Hoefler Text is an oldstyle, and knockout is Victorian.</p>
      <p>Caslon or better yet the definitive transitional face, Baskerville, would be the obvious choices for the serif face.<br>
      For the sans, something anachronistic such as Sebastian or Eureka Sans.</p>
      <p>This is just theory, I haven't actually put the faces side by side to see waht they look like, it's just the principle of historical allusion, that faces from the same era may be good pals. Something about shared aesthetic concerns, according to Hudson.</p>
