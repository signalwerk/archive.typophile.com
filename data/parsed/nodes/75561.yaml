    html: |-
      <p>Brian, your Latin minuscules look very nice. (re-check p, q, s, y)</p>
      <p>Your Hebrew glyphs appear being larger even than the Latin capitals. That may become a problem in mixed typesetting.<br>
      It is a general issue when a bicameral script is combined with a unicameral one: which height should the latter get?<br>
      I tend towards a solution where the unicase part (Hebr.) gets rendered at a height considerably lower than that of the Latin capitals.</p>
