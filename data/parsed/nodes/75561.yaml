  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/heb_4999.png"></div><p></p>
    <p>I have a (very) rough Hebrew version here. This does not match well with the Latin. I had originally though that to make the Hebrew match, I should try to make much of the structure similar. But, that really only ended up with a highly angular, complicated design. It has become clear to me (partially through the guidance of fellow Typophiles here), that I should match the color first, and then try to make some of the finer details similar. I think a simpler, less angular Hebrew will match better with this, and I'll also be able to fit the color better that way.</p>
    <p>The widths and proportions obviously are everywhere, I haven't had time to study the different widths of Hebrew letters as yet - I still need to buy a copy of Romm Vilna, FrankRuhl, Hadasa, Narkissim, and Koren, possibly Nathan, David (any suggestions on specific versions of any of these? I can't believe I'm going to shell out so much money on fonts at once!). I started to analyze the proportions of STAM, but that is as yet uncomplete.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/heb_4999.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/uc_4708.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/lc_6093.png"></div><p></p>
    <p>I thought I'd post this and see what everyone thinks - perhaps it will help me with my next rendition.</p>
    <p>As a note on the origin of this version of the design, I've based it upon Hebrew types from several periods, and also tried to match some parts to the Latin.</p>
    <p>Shabbat Shalom!</p>
