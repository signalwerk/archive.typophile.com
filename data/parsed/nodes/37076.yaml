    html: |-
      <p>Coney Island’s pretty much closed for the season now, yes? And on top of that Astroland and a good chunk is going permanently, right? The way I hear, out east a ways, is that only the Ferris Wheel and he Cyclone will survive. As Landmarks. Oh, yeah, and the parachute skeleton. The boardwalk has to also, yes? Or is whatever developing there will to be going to make the boardwalk off-limits somehow? Damn! There goes the old haunts. Once and for all.</p>
      <p>A buddy of mine, my now-82-year old dad, and I make a pilgrimage there and to the old neighborhood once a year. Usually right after Labor Day. it’s delayed this year, maybe a week or two more, because my buddy’s ill—but we’re going to have to do it soon, because I figure the face of it starts to change again any second.</p>
      <p>I’m reminded, however—because of where this has come up, on this forum—that for years and year and to this day, there’s something about getting to where I can finally see certain distinctive types—the ones that spell out “Wonder Wheel,” “Nathan’s,” “Cyclone,” “Shoot the Geek” (not one that was there when I was a kid, but that always sadly cracks me up now).</p>
      <p>Thanks for reminding me. Got to make some phone calls today and get this year’s little expedition scheduled.</p>
