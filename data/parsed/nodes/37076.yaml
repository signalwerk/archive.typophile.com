      <p>Coney Island in the off-season is fantastic. Don’t forget to grab a drink at Ruby’s. It’s great on a foggy fall day. But I think it’s a very sad sign of the direction NYC is headed that Astroland is closing for good to be replaced by condos, a hotel, and a Disnified, Vegasized version of the old Coney. Problem with Coney is that tourists don’t go there much. Which is of course why we locals love it. Where else can you ride the teacups with your kids right next to a junkie and her kids? It’s the real deal, honky tonk and all. They even had a real freak show (not a side show) until recently, which cured me of any interest in freak shows.</p>
      <p>But all that means it has no value for Mayor Dollarsign. </p>
      <p>First sign of trouble was when they tore down the Thunderbolt coaster (featured in Annie Hall) followed by shutting down the flea market - which was really a junk sale. And now Astroland. The city no longer has a soul.</p>
      <p>James, I am so sorry about your dog.</p>
      <p></p><div class="imageWrap"><img src="/files/mermaid1_5659.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="/files/mermaid2_5201.jpg"></div><p></p>
      <p>None of those women are me. That’s the mermaid parade for those who don’t know.</p>
