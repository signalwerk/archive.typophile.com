    html: "<p>Try this too: enter a word in which the last character is a combining mark shifted vertically from its default height, e.g. stacked above another combining mark; then type a word space; then change to another font and start typing. In InDesign CS3 ME, the text in the new word will be shifted off the baseline to a height corresponding to the height of the shifted combining mark in the previous font. This only happens when the last character in the preceding word is a combining mark.</p>"
