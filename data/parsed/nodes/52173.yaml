      <p>&gt; <em>when I am attempting to stack several combining marks over a base character, they are lined up diagonally, each subsequent mark higher and further to right than the previous one.</em></p>
      <p>FWIW, this was working correctly in InDesign CS3. ID CS3 had a nasty bug involving combining marks (described <a class="freelinking external" href="http://typophile.com/node/46665" rel="nofollow">here</a>) that got fixed. Perhaps that work triggered this new bug. I've logged it in our bug database and it's being analyzed. Thanks for reporting it.</p>
