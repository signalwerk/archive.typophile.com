      <p>I reported failings of mkmk about 3 months ago (for CS3). Admittedly, they've never <em>advertised</em> it was working. I tested with <a class="freelinking external" href="http://home.kabelfoon.nl/~slam/fonts/fonts.html" rel="nofollow">Rogier van Dalen's Legendum</a>, which has (AFAICT) proper mark and mkmk support. Just not for InDesign!</p>
      <p>Since you are testing, can you do this: type a base character, then a mark (which should go over the preceding character), then another character <strong>in another font</strong>? That fails just miserably in CS3 -- the mark feature loses all its magic properties, and the mark gets set as a spacing diacritic.</p>
