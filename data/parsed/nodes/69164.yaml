      <p>@oldnick<br>
      <cite><br>
      If you steal a music CD from a store and are caught, you will be arrested. It is unlikely that you will be caught stealing software, but a crime occurs nonetheless. In the first instance, you did not steal the physical object--the disk--for the object itself, but for its content. The fact that, in the instance of software theft, there may be no physical product stolen does not mean that the two kinds of theft are intrinsically different. In either case, you intentionally deprive the creator of the work of any compensation for his or her efforts, which is theft, plain and simple.</cite></p>
      <p>As to your second point: if you buy a gun and possess, are you free to do whatever you want with it?<br>
      </p>
      <p>First, I don't support violating license agreements (even if I find a certain license immoral), I rather avoid it completely. Second, stealing a physical object is not like copying a piece of software; when I steal an object I deprive it of you, a real loss. But when I copy a piece of software I deprive you nothing as you still have it, there is no real loss. There is however an expected loss, based on an unproven hypothesis that the "pirate" would have purchased a copy if he didn't get it for free, which I have never seen and evidence that support it (to the contrary, several studies fond that people who download music from file sharing services are the one who purchase music most!).</p>
      <p>As for second point, I think it was clear that I was talking about ownership rights.</p>
