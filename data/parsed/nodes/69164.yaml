      <p><em>I find the ownership vs. licensing a complete non-sense spread by software industry that I don't agree with. I bought something and I possess it, then it is my property and I'm free to do whatever with it. If eulas say otherwise, then I'm not paying for it.</em></p>
      <p>If you steal a music CD from a store and are caught, you will be arrested. It is unlikely that you will be caught stealing software, but a crime occurs nonetheless. In the first instance, you did not steal the physical object--the disk--for the object itself, but for its content. The fact that, in the instance of software theft, there may be no physical product stolen does not mean that the two kinds of theft are intrinsically different. In either case, you intentionally deprive the creator of the work of any compensation for his or her efforts, which is theft, plain and simple.</p>
      <p>As to your second point: if you buy a gun and possess, are you free to do whatever you want with it?</p>
