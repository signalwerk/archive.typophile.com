      <p>Khaled,</p>
      <p>As a user of type, I'm not entirely unsympathetic your position. The problem has more to do with what all this new technology has brought. </p>
      <p>Suppose, for example, you had bought Linotype mats for a linecaster. You'd need 8 point, 9-point, and at least one of 10, 11, or 12-point. Plus some display sizes. Roman and italic (though most were duplexed). That's for "one font," say Janson. The purchase price was about $2,000 in the early 1960s -- about the price of a new car.</p>
      <p>OK, you own them. But you own a shop with more than one casting machine. If you want run the magazines on more than one machine at a time, you'd have to buy another set of mats -- another new car.</p>
      <p>Today, fonts are software, not physical objects. So, what is sold is a license, not a physical object. Copying is easy; policing copying is difficult. And the price doesn't let the font designer buy a car with each purchase -- a good lunch is more like it.</p>
      <p>The model of "owning fonts" is difficult with software, esp. to a collection of people use to viewing something as a physical object. But as has so often been pointed out to me, I'm old. For the younger crowd, the notion of type as a physical object is passing strange. It will take a while for all this to settle down.</p>
      <p>Today, I'm going to skip purchasing a font, so off to lunch.</p>
