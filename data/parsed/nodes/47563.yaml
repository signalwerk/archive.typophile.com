      <p>It was in one of those neighborhood circulars that get mailed to "Current Resident", this one in the Cincinnati area. I think it was for pools, but I don't have it right now. I remember thinking, "Wow, if that's Olicana, it's gotten a whole lot of market penetration in a very short time." And it was, so it has. I congratulate you--within one year, your font made it into a place where I'd expect most people to just use system fonts.</p>
      <p>I'm probably over 99% sure I'll still market with Veer, so now this has been graded down to just being kind of curious, mixed with not worrying about it. Whenever I hear back about it, that'll probably satisfy me.</p>
