  html: |-
    <p>I saw Olicana used to write "Tropical Paradise" in an ad today, and decided to visit its critique page, where I found out that it's been pulled from the market because Veer has an "unreasonable" new contract, due to new management. This made me concerned, because I'm working on getting my first font (Newt) sold, and I've gotten it pretty far down the pipeline with Veer. What should I know about Veer's new terms? I'm pretty sure Grant Hutchinson is an honest guy, but you never know about upper management, so it'd be nice to know what's changed and what makes it "ridiculous".</p>
    <p>Nathanael</p>
