  html: |-
    <p>DSType releases Capsa, a typeface designed for use in books. Although inspired by several types from the Type Specimens of Claude Lamesle, Capsa does not intent to be a revival. Capsa is available in Roman, Bold, Italic, Swashes, Vignettes and Patterns.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/DSType_Capsa_5363.jpg"></div><p></p>
    <p>The pdf specimen, containing a short essay on the design of Capsa (in portuguese only) can be downloaded at: <a href="http://www.dstype.com/capsa.html" title="http://www.dstype.com/capsa.html">http://www.dstype.com/capsa.html</a></p>
    <p>Dino dos Santos<br>
    DSTYPE</p>
