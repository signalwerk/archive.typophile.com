    html: |-
      <p>Other typefaces of Goudy's with this ligature (from Bruckner's book on Goudy): Bertham, Garamont,  Goudy Antique, Italian Old Style, Kaatskill, Kennerley (pretty close, but not identical, I think), Truesdell, University of California (Berkeley) Old Style.</p>
      <p>From the sample of Lanston Kennerley I see in the old Precision Type Guide, it appears the digital version is less like this 'mystery' ligature than the metal version of it seemed to be.</p>
      <p>- Mike Yanega</p>
