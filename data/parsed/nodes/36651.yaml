      <p>&gt; This thread points out a weakness in search capabilities at font sites: there seems to be no way to search for fonts with special glyphs, like this ’st’ ligature.</p>
      <p>We don't have a way to search for a particular glyph, yet, but FontShop recently released a Complete View of every font's glyph set. For OpenType fonts, there is also a list of features so you can display just the glyphs you're interested in.</p>
      <p>Here are discretionary ligatures in <a href="http://www.fontshop.com/fonts/singles/monotype/adobe_caslon_pro_ot/?acs=1&amp;acs_ss=4">Adobe Caslon</a> and <a href="http://www.fontshop.com/fonts/singles/monotype/adobe_garamond_pro_ot/?acs=1&amp;acs_ss=4">Adobe Garamond</a>. </p>
      <p>The full glyph set of <a href="http://www.fontshop.com/fonts/singles/carter_cone/itc_galliard_roman_alternates_cc/?sample_text=AaBbCc%20Handgloves&amp;sample_size=36&amp;acs_p=1&amp;acs_pt=24&amp;acs=1">ITC Galliard CC Alts</a> and <a href="http://www.fontshop.com/fonts/singles/lanston_type/goudy_village_h/?sample_text=AaBbCc%20Handgloves&amp;sample_size=36&amp;acs_p=1&amp;acs_pt=36&amp;acs=1">Goudy Village H</a> from Lanston</p>
