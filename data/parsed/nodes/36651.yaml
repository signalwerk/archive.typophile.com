      <p>Some other things I looked at that it is NOT: Adobe Caslon, Adobe Garamond, Garamond Premier, Arno, Galliard and Goudy Village. </p>
      <p>This thread points out a weakness in search capabilities at font sites: there seems to be no way to search for fonts with special glyphs, like this 'st' ligature. Even when you know fonts that have them, it is hard to find a way to display them.</p>
      <p>Anyone know anything that contradicts these last two statements?</p>
      <p>- Mike Yanega</p>
