    <p>hi Typophiles,<br>
    i've just released AndrijScript Cyrillic.<br>
    it bases on my own handwriting, fascinated by historical Ukrainian <em>'skoropys'</em> quick-writing and spiced by few chimeric shapes and unusual Cyrillic ligatures. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ascript_01_6166.png"></div><p></p>
    <p>welcome see few pictures on <a href="http://type.org.ua/andrijscript-cyrillic/" title="http://type.org.ua/andrijscript-cyrillic/">http://type.org.ua/andrijscript-cyrillic/</a><br>
    or test-drive on <a href="http://new.myfonts.com/fonts/andrijtype/andrijscript-cyrillic/" title="http://new.myfonts.com/fonts/andrijtype/andrijscript-cyrillic/">http://new.myfonts.com/fonts/andrijtype/andrijscript-cyrillic/</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ascript_25off_5784.png"></div><p></p>
    <p>thanks!</p>
