  html: |-
    <p>Hey everyone,<br>
    Been working hard on a few families as of late and before I was ready to generate and start testing I hit a "snag". It wasn't a snag really, just a question about hinting. Is it really important with the advances in screen technologies nowadays? </p>
    <p>I've looked around online and even read a few manuals and all signs point to yes however most of these articles that give you tutorial advice on hinting haven't been updated since 1998. And I'm sure advances in screen resolution and type rendering have moved on since then. </p>
    <p>So the question still remains... How important is hinting to typeface design and production now?</p>
