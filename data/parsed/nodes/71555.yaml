    html: <p>Hinting is extremely important if you’re selling your fonts to people who will be using them to set running text on obsolete platforms like Microsoft operating systems that still use hinting to make text legible. Otherwise just learn to set up your blue zones and stem values and let the Adobe autohinter do the rest.</p>
