      <p>I don't know what the design process behind Industria was, but here's what I assumed, as a Face subscriber. In May 1984, this was the cover:<br><img src="/sites/default/files/old-images/Face84.png"></p>
      <p>Two months later, the typeface later named Industria appeared in the magazine.<br>
      Seeing the way that visual ideas evolved in The Face from issue to issue, it seemed obvious at the time that the ELECTRO cover was the bridge between Neville Brody's earlier post-punk mixed-up-Mecanorma headline style, and using the type styles he designed himself. Simple modular faces look alike, and I don't see why Industria couldn't be developed without reference.</p>
