      <p>Have you been to the Design Museum? Admittedly, it was a couple of years the last time I visited. To be honest, I got more out of Tate Modern and I'm more into the graphical side of things to boot. Admittedly, the Design Museum is incomparable in terms of space; the scope that design covers is enormous... when I visited, it devoted most space to architecture (as yet not mentioned). It must be a difficult juggling act to keep everyone happy. I just don't think Dyson kicking out at it helps things... maybe a separate graphic design museum should be the way forward. It plays a very small part in the Design Museum, and if you've travelled all the way to London, I've got a feeling that many graphic designers would end up disppointed.</p>
