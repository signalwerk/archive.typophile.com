      <p>&gt;Well, you can read Verdana, but you can’t board a Concorde. I’d say, that’s a pretty good indicator of which one works better. </p>
      <p>Well, there was a definite problem with the original Concorde spec, but I would argue that the design was so good that it stayed alive and flew for over twenty five years anyway. Also Verdana is now ten years old, and possibly may soon be replaced by the MS Clear Type fonts, including Carter's own Meiro. </p>
      <p>The basic problem with the Concorde is that they assumed cheap fuel, and when it was clear that that was wrong, they still went ahead with it. The British and French had to write off billions in development costs. However, when it flew it actually made money year over year, basically because it was so fabulous both technologically and aesthetically that rich people were willing to pay absurd amounts to fly on the thing. </p>
      <p>I live not so far from Dulles airport and once in a while we saw it fly over, and it was a thrill every time. I saw it a few times on the ground at the airport and it took my breath away. It was that beautiful, and looked like it was travelling a hundred miles an hour when it was sitting still. </p>
      <p>My neighbor was the chief mechanic on it at Dulles, and just loved that machine. He said it could easily take off straight up, like a rocket ship, except that the passengers would sh*t in their pants. It travelled faster than a bullet at its top speeds. </p>
      <p>The romance of the thing was so powerful that it stayed alive when it really didn't make commercial sense. So it is rightly a design icon, I think, in spite of the story of stupid government decisions on the specs for it. It reminds me of another design icon here in Virginia, Monticello. It was impractical and didn't make economic sense, but it is an inspiration to visit it, and it would be a fabulous place to live, at least for a little while. </p>
      <p>I certainly think that bad finances are a very bad idea, but sometimes great design has emerged anyway.</p>
    html_clean: |-
