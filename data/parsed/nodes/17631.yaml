      <p>Nick, let's not get ahead of ourselves - before I address what's<br>
      wrong in your most-recent post, please concede the following:<br>
      - Industria is not a typically British font.<br>
      - My sample is much closer to Industria than it is to Helvetica or Univers.<br>
      Tell you what, I'll make you a deal: just one of those is fine.</p>
      <p>Tim, I'm not good enough to design anything better. But I am good enough to know there's something wrong, and to have ideas for improvement. Like addressing Erik's "tourists will travel an extra 15 minutes on the tube when they could walk the distance between stops in 5." Of course a strict application of scale would backfire, but what about a square (or greater) root of distances (or time)? Think of how (good) diagrams of the solar system -a much more extreme case- do NOT show the planets equally spaced and all the same size. Or what about splitting the map/diagram into two: a central one, and a broad one. Think of how infrequently commuters would need to switch between them. It's not like suburbanites who use the same route to get to/from work every day ever look at the diagram anyway; and few tourists venture outside the center. The desire to put everything on one page isn't necessarily good design, it's more likely despotic.</p>
      <p>My point is there's no reason -except worshipping Modernism- to dump all that "real" information. If you incoporate extra layers in a subtle way, no commuter is going to miss his train; and some commuters will have more questions answered - people are not morons, they observe and extract. And what's the real sacrifice? It would look less "tidy". But you can't make soup with tidy. Post-war insecurity is best addressed with open discussion, not a whitewash of oversimplification in the dirty practical details of life.</p>
      <p>&gt; you can read Verdana, but you can’t board a Concorde.</p>
      <p>Good point, but do look at the age difference.</p>
      <p>hhp</p>
