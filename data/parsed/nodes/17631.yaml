      <p>Your plan of splitting the two sections has been done, most tube carriages have a central area map without the extremes (together with a longish horizontal representation of the line including all stations on that line), a good reason for this is that there simply isn't space* in the carriage to post a full map/diagram. (*and still keep the valuable advertising space.)<br>
      The trouble with a logarithmic scale is that the audience has to be aware of that scale and how it works, in your example, most people, myself included, have very little conception of how far a light year is, but to give them a map that appears to show double a five minute walk only for that to turn out to be twenty minutes and they might well complain. A cynic might say that it is not in the Underground's best interest for its consumers to know that by walking for five minutes would save fifteen minutes on the tube.<br>
      Tim</p>
