      <p>I don't think Dyson is myopic. As Terence Conran notes: 'what James has wanted, and I agree totally with him, is to create a balance between exhibitions of what is hip and fashionable and those that explain the process of design and why that process matters so much in Britain today',  and identifying the need to give 'space and energy to less obviously fashionable, yet equally fascinating and, <em>socially and economically, more significant design.'</em> [my italics]. I'm very sympathetic to this, because far too much of what gets publicly presented as design is mere stylistics and window dressing. And this isn't a crude division between industrial design and graphic design: there are whole areas of graphic design dealing with information design, wayfinding systems, etc. that generally gets passed over in favour of flashy brand-oriented design.</p>
      <p>A few years ago, Briem paid me a visit and in the course of our conversation he described type design as industrial design. This really struck me, especially since it was coming from such an accomplished expressive calligrapher. I don't think all type design is industrial design -- certainly a lot of display type is not --, but I think there is more commonality between the working processes and attitudes of type design and, e.g. vacuum cleaner design, than there is with a lot of graphic design.</p>
    html_clean: |-
