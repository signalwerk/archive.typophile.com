    html: <p>FWIW. I went to the Design Museum yesterday. Only one floor open. The British Design award and the Robert BrownJohn exhibit are all that is currently open. There is a discount right now. The BJ exhibit closes this Sunday. I have to say the discount was a good thing as the BJ exhibit wasn't as large as I'd hoped for. Of course you get to see the titles he did for "From Russia with Love" and "Goldfinger". His titles for "The Tortoise and th Hare" -- clever for their time. But his television commercials didn't do anything for me. He has some print work that did make me grin. Mostly in the time with Chermayeff and Geismar so I have to wonder. I will get the book, but only after I find it for sale. I won't go into as I'm sure some worship all he has done.</p>
