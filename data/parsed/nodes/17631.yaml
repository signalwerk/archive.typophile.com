      <p>&gt;sacrifices layers of information, information that can useful to some people sometimes, and for what reason? Das Grid.</p>
      <p>&gt;It’s that ol’ Modernism, got your brains by the balls.</p>
      <p>As Tim's useful links reveal, the designer of the map, Harry Beck, was an electrical draftsman, whose idea for his breakthrough 1933 map came from electrical circuit diagrams, not from modernist aesthetics. The horizontal, vertical and diagonal lines are just easier to follow with the eye and the finger, as with circuit diagrams. </p>
      <p>The additional information you say is of use to 'some people, sometimes' is exactly the information that makes more informationally-loaded maps worse for most riders, most of the time.  Circuit diagrams reduce the information to what electrical devices are conntected to what other electrical devices--the essentials of how the circuit works and how to connect it or trouble-shoot it. </p>
      <p>Similarly, the advantage of Beck's approach is that it gives the rider immediately the most "mission critical" information: The stops, and where to change to another line. This information about connections is the essential information for the decisions the rider needs to make to plan his or her route from one station to another. The schematic insertion of the river gives an orientation, without detracting. </p>
      <p>The 'time travel' link of Tim is a noble effort that shows how difficult it is to improve on Beck's design. The revised version is not as compact, and the lines are harder to follow with the eye. Both significant minuses. Furthermore, the current version of Beck's map is close enough to relating time travel and length that it I believe is always or almost always possible for a Tube rider to find the shortest path in time to his or her destination. (There may be an issue about the picadilly vs victoria line; I don't remember for sure.)</p>
      <p>Overall, the time travel map would be a useful addition to the 'London A-Z' map, which a significant number of tube riders probably have on their person, and which contains the geographic information. </p>
      <p>Having lived in London and used Tube and the map daily for 5 years, I can testify that it is great information design. Tim I see is a Londoner, and so speaks from knowledge and experience of using the map. His brains are working just fine.</p>
    html_clean: |-
