      <p>Thinking further on a logarithmic scale, it could only work on the distance between individual stations, so to make an extreme example – three stations X, Y and Z.</p>
      <p>X to Y is 25 minutes (or miles) and is therefore shown on the map as having 5 units between them.</p>
      <p>Y to Z is 36 minutes (or miles) 6 units between them</p>
      <p>One cannot represent X to Z as 11 units (which would scale to 121 minutes/miles) or as a square root of 61 minutes/miles (7.8 units).<br>
      So it would have to be<br>
      (X to Y) + (Y to Z)<br>
      (5x5) + (6x6) = 61<br>
      which is a lot of mental arithmetic, especially for longer journeys that can't be divided into whole numbers.<br>
      But perhaps I am overthinking this, especially as I am unlikely to ever be offered the chance of redesigning the Underground map.</p>
      <p><em>The design is well suited to livestock</em><br>
      So you have been on the Underground :)</p>
      <p>Tim</p>
