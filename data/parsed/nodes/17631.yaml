    <p></p><div class="imageWrap"><img src="http://typophile.com/files/conc_si.jpg"></div>  <p></p>
    <p>vs </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/mc_si1.jpg"></div><p></p>
    <p>Verdana has been nominated in this competition organized by London's Design Museum. </p>
    <p><a href="http://www.designmuseum.org/digital/index.php?id=11&amp;pt=1" title="http://www.designmuseum.org/digital/index.php?id=11&amp;pt=1">http://www.designmuseum.org/digital/index.php?id=11&amp;pt=1</a> </p>
    <p>On Sunday I visited two of the other nominees at Seattle's excellent Museum of Flight - I think Verdana has the edge over both Concorde and the Spitfire - but we shall see. </p>
    <p>Here's the voting page - <a href="http://www.bbc.co.uk/arts/cultureshow/designquest/vote/" title="http://www.bbc.co.uk/arts/cultureshow/designquest/vote/">http://www.bbc.co.uk/arts/cultureshow/designquest/vote/</a> </p>
    <p>Although I'm not sure if the typeface will win, it's great that type design has been recognized by the organizers. The British motorway signage system has also been nominated.</p>
    <p>Cheers, Si</p>
