    html: <p>Verdana is great craftsmanship, but I don't think it has the aesthetic greatness to merit being chosen eg over the Concorde. The Concorde is both extremely functional and extremely beautiful. This is not to criticise the face, as the limitations of the screen severely limited what Matthew Carter could do. He himself says his challenge was identify the least ugly shape that would work effectively within the constraints. It seems to me that what is chosen as representative of the best should have both qualities--functionality and aesthetics.</p>
