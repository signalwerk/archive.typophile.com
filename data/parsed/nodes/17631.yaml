      <p><em>Beck’s map</em></p>
      <p>Beck's map is not a map, it is a diagram (regardless of what it says on the printed pieces). Once you accept that, you'll also accept that you cannot map a city the size of London diagrammatically without sacrificing some information. If the distances would be equal across the diagramm, i.e. proportionate to their true measurements, either the centre would be ridiculously small or the stations beyond the circle line would need to be shown on separate sheets. </p>
      <p>The trouble is that the tube diagram is so well-known by now that most people – especially those not familiar with the city – use it as their <em>only</em> reference to London. More often than not, tourists will travel an extra 15 minutes on the tube when they could walk the distance between stops in 5. </p>
      <p>We – Tim Fendley at AIG in London with a little help from myself – are currently working on a project which should provide better information, both in print and on the ground – for pedestrians. Walking is a very good way to get around London, but for most visitors, the topography can be intimidating&nbsp;- especially if they're from grid-based North America. Das Grid (or Der Raster, as we call it) actually makes those people feel more at ease than "proper" maps.</p>
