      <p>Well well well...weeks later, we have a match! It is, it seems, Akzidenz Grotesk Bold Condensed Italic, in Berthold's new OpenType suite. It seems they have transposed the Helvectica-style cap-R to the "Alt" variant of the font.</p>
      <p><a class="freelinking external" href="http://www.bertholdtypes.com/bq_library/590037.html" rel="nofollow">http://www.bertholdtypes.com/bq_library/590037.html</a></p>
      <p>Huzzah!</p>
