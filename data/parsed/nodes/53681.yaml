  html: |-
    <p>Hello folks!</p>
    <p>I cam across this rather tasty grotesque in the most recent issue of Little White Lies (UK film magazine). Instantly my brain went for Berthold's Akzidenz Grotesk Condensed Italic, then Trade Gothic Condensed 20 Oblique, then E+F's TV Nord Condensed Bold Oblique, but no cigar. Though they're all relatively similar, the squared shoulders of the R and S (amongst others) set this one apart. Other weights in regular and italic appear in the mag, so it would appear to be part of a larger family.</p>
    <p>Appreciate the help!</p>
    <p>Cheers,<br>
    Nick</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/littlewhitelies_4454.jpg"></div><p></p>
