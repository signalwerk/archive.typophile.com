    <p>Ok, hey everyone! My first post.</p>
    <p>Im really looking for help, ideas and suggestions.<br>
    I’ve got to write an essay thats 5,000 words long for my last year at University.<br>
    I have chosen typography because I god tarn’ love it. THE PROBLEM IS,<br>
    I can’t settle on an argument or a compare contrast theme. I was supposed to come up with a title and a subtitle, but cant settle on one thats worthy of 5,000 words. (Plus I did rubbish on my essay this year)</p>
    <p>SO HERE IT IS</p>
    <p>I need a title and sub title and an area of typography to base it on. Im begining to think maybe I should have chosen something else. Perhaps you guys can proove me wrong?</p>
    <p>Anyway thanks for reading my post, and I look foward to any ray of light anyone can offer. Thanks.</p>
