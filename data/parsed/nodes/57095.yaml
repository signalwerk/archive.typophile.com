    <p>Hello</p>
    <p>I've a clutch of questions relating to the practice of capitalising the first word or few words of the opening of a chapter e.g.<br>
    "WE ALL HAVE THOSE DAYS when we wish we could just stay in bed." </p>
    <p>1: is there a name for this used in typography books / InDesign etc.<br>
    2: is this going out of use or still deemed ok to do?<br>
    3: any differences between using it in magazine vs book design?<br>
    4: are there any rules as to how many words capitalized, a limit or just what feels right?</p>
    <p>thanks for any advice</p>
