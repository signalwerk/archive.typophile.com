    html: |-
      <p>1. I do not know of any term other than something like "all-cap lead-in" or (better) "all small-cap lead-in."</p>
      <p>2. If you wish to do it and can do it well, why not do it? If your phrase "out of use" refers to style or fashion, just don't worry about that.</p>
      <p>3. Depends on the overall design.</p>
      <p>4. Now this is the important part of your query, foggy. Far too often designers or editors issue a specification something like "first 4 words in opening sentence, all small caps." So, the paragraph starts with a sentence such as "I was not born in a tent in Canada", and if you follow the spec you get the all-cap lead-in thus "I WAS NOT BORN in a tent in Canada." And that just looks a bit silly, because the writer obviously had been born. So keep an eye on the syntax and the meaning of the chapter opening para.</p>
      <p>I use this design device quite often. It can require a lot of hard looking and thought, particularly if a book has a lot of chapters. Ideally you'd be able to keep the all-cap phrases to a somewhat similar length, but that rarely happens. You might start one chapter with 3 short words, and the next with 6, including a long one, to get the meaning right. But will it look OK? You have to decide. Once I got lucky and was able to set the entire first line of every chapter in tracked small caps, and they all had good syntatic sense. I hardly expect to see that repeated.</p>
      <p>All small capitals will most often look better than all full capitals. &amp; then give them some letterspacing so they can breathe a bit.</p>
      <p>powers</p>
