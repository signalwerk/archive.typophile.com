    html: |-
      <p>And you can easily do it in InDesign with nested styles on paragraph style. I use it all the time.</p>
      <p>When nested style doesn't have a fixed length (as in number of letters, words, lines) I usually end nested style with N-space, because it's easy to type (Ctrl-Shift-N). But you can also use the "end nested style" special character accessible from context menu or Type menu... But it's more cumbersome.</p>
      <p>If N-space is too wide you better put a keyboard short-cut for "end nested style"... It'll make your life easier.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
