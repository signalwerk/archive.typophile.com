    <p>I was just wondering: is it even possible to have a decent academic writing (i.e., not too fancy) typeset on MAC OSX’s bundled/native fonts and/or free fonts?</p>
    <p>Somehow all the fonts available for running text on MAC OSX seem to have a weird deficiency — weird final forms of Hoefler Text (which has only black, no bold), ugly bold Baskerville, too-fancy Cochin, too-common (read: boring and unappealing) Helvetica and Times, Bodoni only 72 pt, and the list goes on.</p>
    <p>I haven’t found free fonts out there much more reassuring (a possible exception is Gentium).</p>
    <p>And by the way: no, I won’t pay $100 for a font, as I’m not a designer and make no money from it.</p>
    <p>Is it advisable to just stop caring about fonts?</p>
