      <p>&gt; is it even possible to have a decent academic writing [?]</p>
      <p><strong>“If you can dream of it, you can do it.”</strong></p>
      <p>The issue of font choice for academic editing can be sliced down to several questions worth of consideration, and of differentiation.<br>
      – What good practice is kinda established in a certain field of study?<br>
      – What character repertoire is required?<br>
      – What font functionality is wanted?<br>
      – What typographic style is preferred?</p>
      <p>Maybe you gather from that listing that the matter is fairly complex. You scientists ought to have a predilection for that sort of thing. So let’s go ahead.<br>
      (Just for the records: those of you asking us for “where do I get everything for nothing” – just re-think about your choice of forum).</p>
      <p>Just a few thoughts upon this …</p>
      <p>– If you are clever enough, you can nowadays exploit your average system font collection to a much higher degree than this would have been possible ten years ago. Chapeau.</p>
      <p>– You may well be better off if you can determine exactly what you actually need. Hence, this gives you a certain position for then searching the wild … and finding something appropriate.</p>
      <p>– If  you ever happen to find fonts of interest which leave *something* to be desired in terms of your specific needs, consider this: fonting is a very demanding business: conception, research, design, crafting, encoding, feature programming, mastering, editing, testing, distribution, support, …<br>
      I’m sure you’re not expecting to get all this at a $9,99 ticket, or just for free.</p>
      <p>Everyone at the academies expect from their computers (and fonts) that just happens what they want to happen. But academies still hardly consider what is actually neccessary for the fonts to perform like it is wanted. Few exceptions of course, not to mention all the nerds who are labouring during dark hours on their own …<br>
      However, I maintain that – in a rather broad perspective – our academies still need to realize what potential actually lies in script science and fonting development. A potential the big share of it is still unearthed to the very day. But ‘typography’ has no reputation as a true academic discipline. There is no logic behind that, it is just an old habit.<br>
      The dark side of that moon is: requests like “which is the proper font choice for my dissertation?” are ever more increasing nowadays, as far as I can tell.</p>
      <p>Just my 2 pence.</p>
