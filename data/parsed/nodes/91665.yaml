      <p><cite>As far as I can tell, Alegreya is not kerned.</cite></p>
      <p>I believe that's correct. At least, in the fonts I downloaded. It seems to be set up for what the web currently supports. Aside from kerning (not finished yet), I made some alternate characters that I prefer. Having said that, it reminds me somewhat of Quadraat, and I suspect it will print quite well.</p>
      <p>To me, Crimson has some issues -- on a personal level, as much work as Alegreya for less gain -- but of course, we have a large number of commercial fonts available. Most all the <cite>libre</cite> fonts need some work, which of course, the license allows. As far as that goes, most of the commercial fonts need some work too, esp. in kerning.</p>
