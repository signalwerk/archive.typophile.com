    html: |-
      <p><cite>Charis is fine but its leading is just too wide.</cite></p>
      <p>??? Do you really mean leading? Pretty sure you can change the leading in LaTeX... You can in plain TeX, which I used for years, with our own set of macros. That's all LaTeX is, TeX with a bunch of macros...</p>
      <p>At some level, if you really care about typography, you will have to address font editing programs. Most of us start with kerning (which you can do in plain TeX) and move on.</p>
      <p>You do not need bold for headings. I frequently don't use bold for either subheads or chapter heads. Type size, extra white space, etc. are all alternatives to bold, and often give a much more harmonious page.</p>
      <p>Again, if you care, you're going to have to get a notion about the elements of interior design. I'd recommend Rich Hendel's book <cite>On Book Design</cite>. Rich is interested in how designers think, not a set of rules. Books about design that are *prescriptive* -- a set of rules -- may give you a start, but if such rules would always work, design could end with a program, and the profession wouldn't be needed.</p>
      <p>* * *</p>
      <p>You may not care enough about such things to study them, but curiosity is never ending. I spent an hour with Donald Knuth at ATypI in Boston, and all we talked about was organs (the musical instrument). That man's range of interests is incredible...</p>
