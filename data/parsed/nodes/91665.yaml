      <p>No one seems to be helping anymore.</p>
      <p>Which academic disciplines? Most of us would use different fonts for the social sciences than for literature -- esp. classical literature -- with the physical sciences having other considerations.</p>
      <p>I' d agree that the PostScript renditions of Electra, New Caledonia, and Fairfield are unfortunate.</p>
      <p>You may find that the Libre fonts require you to license FontLab (there is an academic yearly rate now), to attend to a few details, esp. kerning. That fee may be higher than the licensing fee for a couple families, but the skill in being able to tailor fonts to your needs is, like the credit card advertisement, priceless.</p>
      <p>For example, take a look at Alegreya</p>
      <p><a href="http://www.huertatipografica.com.ar/tipografias/alegreya/ejemplos.html" title="http://www.huertatipografica.com.ar/tipografias/alegreya/ejemplos.html">http://www.huertatipografica.com.ar/tipografias/alegreya/ejemplos.html</a></p>
      <p>It's a Google font, so free. It is pretty complete, but needs kerning (and the small caps put into the main font) and best if it had some OT features.</p>
      <p>Nice enough for literature. </p>
      <p>For social sciences, I'd use (in fact I have, professionally, on a couple books selected for the AAUP book show) Charis, worked over.</p>
      <p>Charles</p>
