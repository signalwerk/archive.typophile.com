    html: <p> Well, "Senator" was said to have been <br>based on her "Emigre 15" (now renamed <br>"Lo-Res Twenty-Two Serif"); <br> <br>"Matrix" was the outline version of "Emigre 14" (now renamed "Lo-Res Twenty-One Serif");  <br> <br>"Modula" was based on "Emperor 15" <br>(now renamed "Lo-Res Twenty-Two Narrow"); <br> <br>The entire "Base" family was designed with <br>screen-resolution bitmap grids in mind; etc. <br> <br>She seems to use the bitmap grid to its full <br>advantage from the very beginning of her <br>design process. </p>
    html_clean: <p> Well, "Senator" was said to have been <br>based on her "Emigre 15" (now renamed <br>"Lo-Res Twenty-Two Serif"); <br> <br>"Matrix" was the outline version of "Emigre 14" (now renamed "Lo-Res Twenty-One Serif");  <br> <br>"Modula" was based on "Emperor 15" <br>(now renamed "Lo-Res Twenty-Two Narrow"); <br> <br>The entire "Base" family was designed with <br>screen-resolution bitmap grids in mind; etc. <br> <br>She seems to use the bitmap grid to its full <br>advantage from the very beginning of her <br>design process. </p>
  - id: 141
    user: 851
    date: 2002-04-25T05:21:00
    date_raw: 25 Apr 2002 — 5:21am
    votes: null
    html: <p> She also hand-tunes the Mac bitmap fonts in her suitcases instead of foolishly trusting Fog to do a perfect job of it. The PC versions of Emigre fonts unfortunately lack this feature. <br> <br>With full-fuzz antialiasing becoming the norm (or as Adam Twardoch likes to call it, full-alcohol) bitmaps in newer suitcases are becoming rarer and rarer. I'm trying to figure out a way to add embedded bitmap data to CFF .otf files. </p>
