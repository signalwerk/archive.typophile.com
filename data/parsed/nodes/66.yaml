  - id: 142
    user: 1250
    date: 2002-04-25T07:39:00
    date_raw: 25 Apr 2002 — 7:39am
    votes: null
    html: <p> Although PC PostScript fonts can contain (low-grade) hints, they cannot contain bitmaps, and bitmaps are better. But PC TrueType fonts can contain bitmaps. They can both contain hinting, but even TT's powerful hinting can't compare to the real thing. <br> <br>BTW, John, maybe BitFonter can do OTF? <br> <br>hhp </p>
