    date_raw: 14 Sep 2003 — 7:21pm
    votes: null
    html: <p>Being someone who admires versatitlity and originality, I would have to say Zuzana Licko. Further, Emigre--the foundry and the publication--are to be reckoned with. <br> <br>However, if, as she would say, it is an art form, then type design is too personal to have a "best".  <br> <br>Actually, I like my own work best, particularly whatever I'm working on at the moment. But I have no idea whether it's good or bad. As an art director, I can never be sure whether one of my faces is suitable for a piece -- unless I've seen someone else use it successfully in similar circumstances.  <br> <br>Does anyone else have a similar experience?</p>
