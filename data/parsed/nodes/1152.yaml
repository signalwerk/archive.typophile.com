  - id: 9100
    user: 1262
    date: 2003-09-14T23:25:00
    date_raw: 14 Sep 2003 — 11:25pm
    votes: null
    html: "<p>After a typeface is finished, I tend to treat it exactly the same way as the other fonts on my computer: I look at it critically and decide whether it is good for a given task. The fact that I made it doesn't really enter into the equation, except insofar as it might give me a better idea of how well it will stand up to particular media. <br> <br>There are times, late at night, when the lowercase g comes out just right -- clicking into place like a box being shut, to borrow TS Eliot's description of when a poet knows that he has written a good poem -- when I feel I'm the best type designer in the world: or at least the best one awake in my time zone. The feeling seldom lasts until morning.</p>"
