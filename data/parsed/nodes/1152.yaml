    html: <p>It is easier speaking highly of those that are dead. Not so easy if they still live. <br> <br>However this man will outlive me so I had better speak while I still can. I am sticking to my previous opinion. <br> <br><a href="http://www.lanstontype.com/JimRimmer.html" target="_blank">http://www.lanstontype.com/JimRimmer.html</a> <br> <br>He never admits to it, but Jim Rimmer has designed, and "cut a typeface for metal" in 8 days. He will draw circles around anyone I have ever met, or you have ever met. <br> <br>Don't mistake "speed for sloppy". This man is an acrobat with a pencil. At one time I thought he should be forced to design with his right hand (he is left handed) until I found out it would make little difference. <br> <br>Every type designer, so far mentioned, would kill for Jim's gifts. <br> <br>Gerald Giampa <br></p>
