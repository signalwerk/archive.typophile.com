      <p>Luc Devrouye's <a class="freelinking external" href="http://luc.devroye.org/longdesigners.html" rel="nofollow">designer page</a> lists the designer of "Abel Cursive" as Bernie Abel and says it was a Compugraphic font in 1974. I think that means it was a film type. Apparently, not digitized.</p>
      <p>- Mike Yanega</p>
