  html: |-
    <p>Good morning, good afternoon and good evening, wherever you all may be!</p>
    <p>I need to modify typed used in a logo in order to optimise it for use at a small size - say printed as four lines of 18pt, tightly kerned and leaded, with no unusual printed applications. </p>
    <p>the obvious thing would be to open up the letterspacing and leading a wee bit. I’m thinking I might need to shave crotches a bit too. I don’t have a great deal of experience in the more functional aspects of drawing type (may i burn in hell), so any comments would be appreciated.</p>
    <p>Cheers,</p>
    <p>Luke</p>
