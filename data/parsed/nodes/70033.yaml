    html: |-
      <p>Stakan,<br>
      are you using ID? Which version?<br>
      ID offers automatic paragraph bullets. You define this in the paragraph style and may choose the bullet from any glyph in any font. There are many glyphs which can be used as bullets in fonts like Warnock, Arno, Minion, Meta Serif and so on (bullets, arrows, hands, asterisks, flourishes etc.)</p>
