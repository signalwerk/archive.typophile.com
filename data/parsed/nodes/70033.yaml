  html: <p>I am working on a manual, book size body type and I have a lot of bullet lists that I am currently using round bullets or dashes for, to indicate a new item. Are there any alternative typographic devices?</p>
  html_clean: <p>I am working on a manual, book size body type and I have a lot of bullet lists that I am currently using round bullets or dashes for, to indicate a new item. Are there any alternative typographic devices?</p>
