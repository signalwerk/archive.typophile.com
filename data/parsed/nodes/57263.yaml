    <p>You may see our display font as known<a class="freelinking external" href="http://www.antreposhop.com/product/modul-72-dpi-bold" rel="nofollow"> "Modul 72 dpi"</a>. It is a part of <a class="freelinking external" href="http://www.antreposhop.com/category/fonts" rel="nofollow">Modul Family.</a></p>
    <p><a class="freelinking external" href="http://www.antreposhop.com/product/modul-300-dpi-font" rel="nofollow">Modul 300 dpi Base</a> was created for graduate thesis. This thesis presents font designs which are capable of covering what is demanded by the "digital age" and discusses the issues that need to be considered regarding the applications within this new age.<br>
    It is pixel based vector font, you can use only one font file for high or low resolution design file.</p>
    <p>And the <a class="freelinking external" href="http://www.antreposhop.com/product/modul-72-dpi-bold" rel="nofollow">Modul 72 dpi</a> is a non-readable version of <a class="freelinking external" href="http://www.antreposhop.com/category/fonts" rel="nofollow">Modul Family.</a></p>
    <p>Now we show the new family members, And the <a class="freelinking external" href="http://www.antreposhop.com/product/modul-72-dpi-solid-font" rel="nofollow">Modul 72 dpi solid</a>,  <a class="freelinking external" href="http://www.antreposhop.com/product/modul-72-dpi-line-font" rel="nofollow">Modul 72 dpi line</a>, It is available at Antreposhop, just 10 US dollars for each one.</p>
