    html: |-
      <p>Hi Christopher,</p>
      <p>it depends:<br>
      psi is a Greek character (<a href="http://www.decodeunicode.org/u+03A8" rel="nofollow">U03A8</a> for uppercase), so it is included in <em>every </em> font with Greek language support.</p>
      <p>Then, it could be used as a symbol in mathematical typesetting. There are a couple of codepoints, depending on its application: <a href="http://www.decodeunicode.org/de/u+1d7a7" rel="nofollow">U1D7A7</a>, <a href="http://www.decodeunicode.org/de/u+1d6bf" rel="nofollow">U1D6BF</a>, <a href="http://www.decodeunicode.org/de/u+1d7a7" rel="nofollow">U167A7</a>, <a href="http://www.decodeunicode.org/de/u+1d76d" rel="nofollow">U1D76D</a>, <a href="http://www.decodeunicode.org/de/u+1d733" rel="nofollow">U1D733</a>, <a href="http://www.decodeunicode.org/de/u+1d6f9" rel="nofollow">U1D6F9</a>.</p>
      <p>Special fonts like Cambria Math will likely contain these glyphs.<br>
      F</p>
