      <p>Ah, okay!</p>
      <p>Here are a <a href="http://www.fontshop.com/search/?q=greek" rel="nofollow">couple of fonts with Greek language support</a> distributed by FontShop (check out ‘Character Set’ to view the ‘Ψ’), and some more by <a href="http://www.linotype.com/en/86463/keyword/greek.html" rel="nofollow">Linotype</a> (» ‘Encoding map’).<br>
