      <p>Bert beat me to it. I think this looks like custom work by Angel Koziupa who does a lot of the calligraphic scripts at Sudtipos (with Ale Paul). His <a class="freelinking external" href="http://new.myfonts.com/fonts/sudtipos/amorinda/" rel="nofollow">Amorinda</a> is quite similar, as are Malbeck and Inoxida. To me his style is all over this one.</p>
      <p>- Mike Yanega</p>
