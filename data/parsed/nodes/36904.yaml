    <p><a href="https://web.archive.org/web/20081007191804/http://farm2.static.flickr.com/1208/1345452419_04c3511b43_o.gif" title="http://farm2.static.flickr.com/1208/1345452419_04c3511b43_o.gif">http://farm2.static.flickr.com/1208/1345452419_04c3511b43_o.gif</a></p>
    <p>PLEASE TELL ANYONE YOU KNOW WILL BE IN NYC TO POP IN.<br>
    Upcoming locations: Leeds / Newcastle / Sheffield / Dublin / Paris &amp; more.</p>
    <p>++++</p>
    <p>Blanka and Candy<br>
    in association with Veer present ‘50’<br>
    celebrating 50 years of Helvetica</p>
    <p>50 image makers, 50 original works<br>
    50x50cm, each in an edition of 50<br>
    Epson archival Giclee prints<br>
    £50 each via blanka.co.uk</p>
    <p>[The Brief]<br>
    Each artist was allocated a random year [1957 - 2006] from<br>
    Helvetica’s lifetime. From this they were asked to illustrate an<br>
    event of creative or cultural significance which occured during their<br>
    allocated year. There were no other rules applied other than if they<br>
    used a typeface it must be Helvetica of of their own hand.</p>
    <p>Helvetica 50<br>
    at Espeis Gallery<br>
    90 Wythe Avenue (at n. 11th st.)<br>
    Williamsburg, Brooklyn<br>
    New York City</p>
    <p><a href="https://web.archive.org/web/20081007191804/http://www.espeis.nu/" title="http://www.espeis.nu">http://www.espeis.nu</a><br>
    e: <a href="https://web.archive.org/web/20081007191804/mailto:hola@espeis.nu">hola@espeis.nu</a></p>
    <p>Opening: September 15th, 7pm<br>
    With music by Activaire.</p>
    <p>Supported by Epson, Commonwealth, GF Smith, Generation Press, Activaire, Build &amp; Victionary.</p>
    <p>+++++</p>
    <p>Contributors: 1957 Spin 1958 Vince Frost 1959 Bleed 1960 Ros Shiers<br>
    1961 The Designers Republic 1962 Farrow 1963 Antoine et Manuel 1964<br>
    Ian Wright 1965 Fabio Ongarato 1966 Experimental  Jetset 1967 Parra<br>
    1968 Kam Tang 1969 Build 1970 Hamish M<!--
