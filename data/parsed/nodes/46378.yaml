      <p>The client, with all vendors, businesses and services, has an influence. I think the skill set in some organizations can manage the client, and in many ways you have to, since ultimately, we won’t produce anything unless the client signs off first.</p>
      <p>If your creative and marketing presentations on a campaign contain “researched detail” on the effectiveness of your proposed imagery, copy, graphics, type choices upon the target audience, you just might get away from facing the clients “personal preferences” for color or photos, etc.</p>
      <p>I have had comments from very big clients on very large interactive projects asking us to change the shape of a “button” on the global navigation. “Yes sir, we will look into that with our Information Architect and Creative Director. But you see, sir, they specifically selected this particular shape since the click-through rate just happens to be 12% higher than your suggested shape, sir.”</p>
      <p>Business is business, and art isn’t.</p>
