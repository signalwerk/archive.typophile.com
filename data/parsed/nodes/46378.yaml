      <p>If a client insists on making you do poor work, the client will reap the rewards of their own heavy hand in the end. In turn, you will not look good or prosper if your clients don’t.</p>
      <p>It is a fine balance between paying the bills and maintaining some reputation for yourself or your group. I don’t think you can be too careful and choosing the work you do. Be ready to travel light and be picky.</p>
