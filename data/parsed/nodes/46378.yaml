      <p>i’ve worked at small and big agencies, and it depends. at my agency, we pride ourselves on being good at what we do - that’s why the client hired us. if they want to dictate type choices, they should hire a production artist and skip the agency fees.</p>
      <p>whenever clients dictate things like this for no reason, reason it out of them. Justify your typefaces and why theirs are wrong for the brand for whatever reason. If you let them run all over you, they won’t respect you and you’ll be stuck doing production work instead of designing.</p>
