    <p>So, I had particularly annoying day with client revisions and a coworker and I got into a discussion about how much input clients have at larger agencies. I work at a small firm ( &lt; 10 people), in a small market, and the philosophy is: no matter what the client wants, give it to them. </p>
    <p>Is this the same at larger agencies? I recognize that no matter where you work the people that fit the bill will always have last say, but what about when they’re running with scissors? What if they say I want my logo fonts changed to Lucida Calligraphy and Comic Sans???? &lt;—Reason for this post.</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20080907013309/http://www.typophile.com/node/46301" class="topic-previous" title="Go to previous forum topic">‹ New Fell Types and new iKern site.</a> <a href="/web/20080907013309/http://www.typophile.com/node/46517" class="topic-next" title="Go to next forum topic">Calgary: June meeting ›</a></div>
