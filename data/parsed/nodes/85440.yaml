    html: |-
      <p>I know you're working with an existing crest, but try pointing the griffin the other way (to the right).  Since we read left to right, an image of a person or animal that's looking to the left can subconsciously be perceived as looking backwards. </p>
      <p>Another option might be to have 2 small griffins, one on each side, looking towards the center. This might not work as well but I'm just mentioning it as another approach.</p>
      <p>As you mentioned, the colors are dark. Try printing the logo in the size it'll appear on the menu, and then sit at the darkest table in the restaurant and see if the logo is still legible.</p>
