      <p>i think you have overcooked it with the typography. You have in effect used 2 display fonts in 3 lines, looks messy, I  would suggest you substitute the font top and bottom lines for something a simple like a condensed bold sans font with some letterspacing through it.</p>
      <p>The main line has some weird widths on the letters, the R really wide compared to the U and the O, the general effect is it all looks jammed in, and does not read well.</p>
      <p>If you are stuck with that image of the griffon, I would suggest you use the solid version, it looks cleaner and more modern. try using the griffon in the light grey on the dark grey background. Position the griffon over to the left as in the first sample and make it bigger. then have the lettering positioned to the left of it coming flush right up to the griffon. This will take you eye into the griffon, and all the components will function as one piece. This layout is more modern than the centred version. see suggest version attached</p><div class="imageWrap"><img src="http://typophile.com/files/griffonblog_4622.jpg"></div><p></p>
