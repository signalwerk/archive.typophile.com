      <p>(Warning: Amateur opinion)</p>
      <p>To me, the greatest problem with the original poster's designs are the lack of contrast. The dark reds and purples are as good as invisible on the dark grey background. The gold-on-maroon of the second image is pretty, though.</p>
      <p>I agree the cursive font is prettier than the caps, but it reads "ferugino" to me... </p>
      <p>Haloguy's arrangement is definitely more balanced and harmonious than the previous ones. I'd probably make the three text lines evenly spaced, though (which may be an beginner's mistake on my side?), and either increase the contrast between the griffin's outline and fill color, or remove the outline.</p>
