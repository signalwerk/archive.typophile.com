      <p>I really like the Perugino typeface from the second option. It alone could easily work as a logo. For that reason I would consider using some plain serif for "il nouvo ... enoteca", definitely not your current choice as it competes with Perugino.</p>
      <p>In the same vein, I really do <em>not</em> like the choice of Perugino typeface in 1st and 3rd options. It makes the logo look old and it has this feel of a smaller Italian restaurant... of a family kind, but neither modern nor refined.</p>
      <p>As far as the griffon goes - it doesn't appear to make much difference if it is there or not. It looks like a part of a background, so one can replace the griffon with a basket of petunias and no one would really notice :)</p>
