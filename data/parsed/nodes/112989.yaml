    <p></p><div class="imageWrap"><img src="http://typophile.com/files/JimWest-Schrift_4934.png"></div><p></p>
    <p>Not the best image to show my own version of this weird but beautiful script style, inspired on 1883 James West "Hoyt Script", here I just try to do a very wide range of alternate gliph designs, and hope to have some digital examples to show all of you here or anywhere.</p>
    <p>Any kind of criticism are very well welcomed.</p>
