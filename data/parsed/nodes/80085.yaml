    <p>I'm going to London for a few days with 12 graphic design students in April.<br>
    Does anybody have some suggestions on what to see (graphic design, studios, museums, typography etc).<br>
    We would also like to visit a printing company, and I would be really grateful , if somebody could come up with a few names for me. </p>
    <p>Thanks!</p>
