      <p>• the Underground<br>
      • shop front lettering<br>
      • St Bride library (a MUST for typophiles)<br>
      • Westminster Abbey (epigraphy)</p>
      <p>Victoria &amp; Albert and Transport museums are excellent suggestions.<br>
      I always get as much inspired by the breathtaking antiquities collections in the Britisch Museum.<br>
      And if some pounds are left, embark on the “London Eye”. It’s worth the money.<br>
