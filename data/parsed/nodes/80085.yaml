    html: |-
      <p>I'd suggest the Victoria and Albert Museum in South Kensington. Although there isn't a lot that is a concentrated collection of just graphic design there are lots of great examples of it amongst other good design in the modern galleries. I love the fashion collection and the S.E.Asian collections. 19th Century plaster casts of the Trajan Column and similar monuments displayed in a 19th Century manner. Lovely building. Good bookshop and gift shop. It's free although there are some exhibitions that have an entrance fee.<br>
      <a href="http://www.vam.ac.uk/" title="http://www.vam.ac.uk/">http://www.vam.ac.uk/</a></p>
      <p>There's a Wim Crouwel exhibition at the Design Museum while you're here.<br>
      <a href="http://designmuseum.org/exhibitions/2011/wim-crouwel" title="http://designmuseum.org/exhibitions/2011/wim-crouwel">http://designmuseum.org/exhibitions/2011/wim-crouwel</a></p>
