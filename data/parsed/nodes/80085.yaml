      <p>Head to Brick Lane and up towards Old Street (East End) for graffiti and street art...don't venture too far off the beaten track though...ride any of the overground trains around the south and you'll see some pieces on the warehouses and retaining walls.</p>
      <p>The Cemeteries near <a class="freelinking external" href="http://maps.google.co.uk/maps?client=safari&amp;rls=en&amp;oe=UTF-8&amp;redir_esc=&amp;um=1&amp;ie=UTF-8&amp;q=st+pancras+cemetery&amp;fb=1&amp;gl=uk&amp;hq=st+pancras+cemetery&amp;hnear=London+N12&amp;cid=0,0,9397200359882542634&amp;ei=1X6GTZWZH86ChQfPn_27BA&amp;sa=X&amp;oi=local_result&amp;ct=image&amp;resnum=2&amp;ved=0CB4QnwIwAQ" rel="nofollow">Highgate</a> might offer some rewards too.</p>
      <p>@1985 - good call. Always be looking up, the commercial signage for Chicken Cottage et al is a feature in itself.</p>
      <p>I'd split them into groups, it's a big ass city to cover.</p>
