  html: <p>Ok, so I have come about some credit at FontFont. <br>Some of you may know how. <br> <br>Im looking to pickup a versitile sans face. <br>I want something that I can make good use of. <br>It needs to be something with chracter, but not overly mannered. Something that would work well for a text face. Hopefully with a 'pro' set. SC OSF and the such. <br> <br>I've been wanting to pick up Scala Sans for some time now. Is this the time? <br> <br>Hildebrant.</p>
