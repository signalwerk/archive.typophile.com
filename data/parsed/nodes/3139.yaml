    html: <p>But some people pronounce that "gay-lah".  :-/ <br> <br>Since the name comes from an opera house in Milan, I'd pronounce it "SCAH-lah". On the other hand, I pronounce Officina with a "tch" (since it's [also] of Italian origin), but its creator (Spiekermann) pronounces it with an "s"! <br> <br>Kyle, Scala is certainly versatile, of character, and texty. But it's also too ubiquitous. I'd go for something less used, like Eureka Sans, Profile, Quadraat Sans, or maybe even Karbid. <br> <br>hhp <br></p>
