  html: |-
    <p>Once again I'm hoping for some input from the experts here.</p>
    <p>Attached is a PDF with five different versions of the first page of my writing sample (for tenure track job applications in philosophy). The only difference from page to page is the initial capital. Which one do you prefer?  I suspect this issue is just a matter of pure preference, and thus that there is no wrong answer here. That said, I'd still like to know what more experienced typographers and typesetters think.</p>
    <p>I know that the kerning can be tweaked a bit more on many of them, but I would like to decide which one I'm going to use before I iron out all of the details. Thoughts? Suggestions? Criticisms?</p>
    <p>Thanks in advance!</p>
    <p>Matty</p>
