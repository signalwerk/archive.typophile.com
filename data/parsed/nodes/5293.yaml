  html: <p><img src="http://www.typophile.com/forums/messages/83/38819.jpg" alt="Notebook Typeface. 1949"> <br> <br> I found this very intressting typface at some notebook-frontpages. (The books are printed in 1949 in norway) <br> <br> It seems familiar but i've got hard to tell the name of it. Sorry for the bad quality and the small amount of letters. <br> <br>Any ideas?   would even like to see faces with simularities, though i am planning to reconstruct a face like this one.</p>
