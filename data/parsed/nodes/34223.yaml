      <p>Patty:<br>
      I am mostly referring to the masses. I'm not surprised to see typographers and graphic designers spouting harsh critiques. We're an opinionated bunch and the logo is at first jarring. I agree completely with your design-by-committee comment. Very true. </p>
      <p>I just believe there's an inherent danger in "unveiling" a new design. In doing so the logo is put on display, almost requesting a reaction. With this design being so unexpected, people will stick to their first impressions. I think that unveling the logo without the support of context and additional branding elements (motion graphics, systems, photogrpahy) makes it bound to not quite connect with people. </p>
      <p>And then there's the culture issue. Londoners are certianly arguing over what cultural element is missing from the logo. This is why committees often ruin the design process. "We can't agree, so let's just use little abstract woodcut-style people holding hands in a circle."</p>
