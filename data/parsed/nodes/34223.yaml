    html: <p>Well, I posted a comment that was pretty damning of the London 2012 logo - and, although I could edit it, I'm going to let it stand even though I think I've made a mistake. Having lastnight seen how it conveys a sense of energy, I'm growing to like it! My gut feelings (see post above) were negative, but I really don't think companies such as Wolff Ollins get it wrong. I'm still really unsure of the supporting elements (the animated visual style is very 80s dance graphics), but I think the logo is already doing its job. I think the organisers will be pleased about the press and news prominience this has got - which I don't think would happen with a 'safe' logo which would likely go unnoticed. It's really going to start mattering in a few years time so to judge it now is really premature. The one thing that this logo is, is different - and that's pretty important.</p>
