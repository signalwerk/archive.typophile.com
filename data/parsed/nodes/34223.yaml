      <p>Dalton Maag makes some very good points, and some very over the top ones.</p>
      <p>In my opinion, the logo falls short because it doesn't communicate WELL, and it's unfortunate only because of the missed opportunity. </p>
      <p>D-M hit it when they said that by trying to be trendy, Wolff Ollins (and the committee) trapped themselves into being dated. And by 2012, well, I imagine the designers will be thinking, "it SEEMED like a good idea..."</p>
      <p>Goofy type treatments can be effective (Taco Bell got away with using Fajita for years), but they should be communicative.</p>
      <p>But D-M's assertion that the Olympic logo will destroy British design credibility throughout the visually-literate world is a silly overstatement. And in the end, I think the public is going to worry a lot more about the 50-m sprint time than they will about four tangram shapes and some weak typography.</p>
