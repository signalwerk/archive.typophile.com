      <p>I'm surprised at the almost unanimous hatred towards this mark.</p>
      <p>Admittedely, from a typography standpoint, it's lacking, but as an overal logo and part of the larger ID system (including the motion graphics) I can't really argue against it. It seems to work.</p>
      <p>There are bad logos, and then there are controversial logos. I think this is the latter. Not necessarily bad, but those that find it bad, REALLY find it bad and are quite loud about it.</p>
      <p>A bland logo would have likely been a poorer solution, but ultimately would probably not have provoked that many folks to care as much about it.</p>
      <p>"The one thing that this logo is, is different - and that’s pretty important."</p>
      <p>Well said.</p>
