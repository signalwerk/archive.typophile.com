      <p>Working in the Branding industry I cannot help but feel that this logo is a real let down. Years are spent on the bidding process and pitching phases with regards to just hosting the games. </p>
      <p>I remember an article by Bruno Maag in creative review about the importance of the olympics and how it should be treated with more respect. The Olympic games is a worldwide event and is a chance for countries to basically tell the world a little about themselves, their attitudes, their beliefs, their tradition, in an exciting way. </p>
      <p>I can understand what the logo is trying to do, trying to appeal to the younger generation by using the graffitti look and the bright colours but further than this it really seems to miss the whole point. </p>
      <p>The logo is just the tip of the ice berg, it is a mark that is used to farmiliarise people with the brand. Below this there is a need for marketing, advertising, print material, films and novelty items such as flags, leaflets etc. If this is the standard that will dictate the design of these elements then I can only hope they take into consideration and try to understand a little of where the rest of the british people are coming from.</p>
    html_clean: |-
