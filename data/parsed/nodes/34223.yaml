      <p>Number 11 Rules! (Referring to the alternates in the BBC article.)</p>
      <p>The final mark takes a lot of risks, that the otherwise safe (too conservative) execution does not support it or payoff the risks and the result is bad. The "brand video" they produced is the most interesting piece, but the logo itself doesn't live up to it. The site design as a component of the whole brand picture is also a let down. The Duplo color palette is carried through, but because of the lack of interesting composition there's no connection to the energy in the video.</p>
      <p>The London Olympics, as established by the logo and the brand site, is now a low budget, kids television program.</p>
