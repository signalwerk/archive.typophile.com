    <p>I live and work in London as a designer, and am appalled by the just revealed choice of logo design for the 2012 Olympics.</p>
    <p>I think it is a massive error of judgement by all concerned. It does not in the least reflect any design values that belong to London, and instead looks like the Olympic organisation is breaking up/smashed</p>
    <p>It goes without saying that this is one of the premier commisions any designer could ever want, and is a travisty to the design talent that exists in  the UK (london).</p>
    <p>Can anyone be positive about this?</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/1542899_0.jpg" width="180" height="180" alt="">
