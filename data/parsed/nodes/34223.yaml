      <p>Good things about the logo: </p>
      <p>Dynamic, energetic, upbeat, good balance--artistically very well executed.</p>
      <p>Harmonizes with appealing and successful motion graphics. (It works as part of these better than on its own.)</p>
      <p>Bad things:</p>
      <p>Second 2 illegible. Serious problem. </p>
      <p>Too self-conscious--draws attention to itself rather than the Olympic games. </p>
      <p>Cut out + candy colors gives too child-like message for Olympic games (see Scott's post).</p>
      <p>Trying too hard to be 'trendy' and just missing. </p>
      <p>[edit:] In sum, for the purpose of promoting the Olympic Games, disconcertingly inappropriate, off-key, a sour note. Hence the reaction.</p>
