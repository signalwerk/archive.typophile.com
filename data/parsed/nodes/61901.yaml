    <p>I'm getting ready to redesign my Company's identity, <a href="http://www.malones.bc.ca">way overdue</a>, and I'd like to see if anyone has any great examples of pre war style bar logos<br>
    maybe 20's or 30's</p>
    <p>mostly I'd just like to see something masculine and refined, this is a sports bar in a building that's been there since the early 1900's, but we don't really want to remind anybody that it's a sports bar</p>
    <p>thanks very much</p>
