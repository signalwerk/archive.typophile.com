    html: |-
      <p>&gt;i assume only a regular license is needed here?</p>
      <p>If the font is to be installed on a server then you may need a specific server license. If the foundry you're licensing from doesn't offer server licenses then a workstation license may be sufficient, but you may get caught out under restrictions around concurrent users - especially if they define web site visitors (people who indirectly use the font) as users. As always the best option is to ask the foundry.</p>
    html_clean: |-
      <p>&gt;i assume only a regular license is needed here?</p>
