    <p>hey,</p>
    <p>i guess this have been posted and discussed already and i could use the search option, BUT i just wanna be sure the information on this topic is up to date.</p>
    <p>is there any special license agreement needed to render fonts and display them on a commercial website using tools that don't embedd the font, but just render an image?</p>
    <p>to be clear: the font is not embedded in a flash file, it's stored on the server in ttf or otf, but only accessable by the server itself, not public.</p>
    <p>i assume only a regular license is needed here?</p>
    <p>thanks: lars</p>
