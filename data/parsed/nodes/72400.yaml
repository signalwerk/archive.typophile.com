    html: |-
      <p>'Word is not actually converting non-unicode characters into unicode characters when it should'</p>
      <p>I'm assuming that you mean by non-unicode font a font that has glyphs that differ from the typical representation of the character indicated by the Ansi and Unicode number. If, for instance, the Greek lower-case mu is not at 181 in Ansi, then Word will not display a glyph that looks like a mu. Word does not do conversions since at the the latest Word 2000. It simply selects the glyph corresponding to the Ansi or Unicode code point in the particular font you are using. It is often the case with pre-OpenType fonts that the glyphs selected are simply those that suit the font designers fancy and for perfectly legitimate reasons.</p>
