  html: |-
    <p>How necessary is it to always have nodes at extremes of all glyphs?</p>
    <p>I have always put nodes at extremes and made the right extreme node the startpoint.</p>
    <p>But when I try to put a node at the extreme of this shape (right leg of “V” &amp; “W”), I end up with a really short curved segment. When I paste it into FontLab from Illustrator, it looses its fidelity and the curve gets wobbly.</p>
    <p>I can’t seem to fix the tiny bcp even at FontLab’s highest magnification.</p>
    <p>So what happens if I get rid of that extreme node and make a node close to the extreme the startpoint instead?</p>
    <p></p><div class="imageWrap"><img src="/files/extremes_3971.gif"></div><p></p>
