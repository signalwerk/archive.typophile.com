    html: <p>If you use Illustrator to design your glyphs you should force Illustrator to use a grid which corresponds to the UPM settings in FontLab. Otherwise your curves will always look different when you paste them into FontLab.</p>
    html_clean: <p>If you use Illustrator to design your glyphs you should force Illustrator to use a grid which corresponds to the UPM settings in FontLab. Otherwise your curves will always look different when you paste them into FontLab.</p>
