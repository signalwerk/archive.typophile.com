    html: |-
      <p>According to the specifications for Type One fonts, and I believe for CFF fonts, you do not need to have extrema on such things as the tip of a rounded e and c. This looks like a similar thing. I think you can do with only a node at the top with horizontal handles and a node lower down, not at an x extremum, with handles not vertical. The need for points at the extrema is because of hinting, as I understand it, and you are not going to have hints here anyway, I believe. But those with more knowledge of Type One hinting will hopefully chime in. </p>
      <p>I believe that most type designers (not all) draw directly in Font Lab or Fontographer for the reasons Ralf mentions.</p>
