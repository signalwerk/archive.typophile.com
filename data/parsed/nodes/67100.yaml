    html: |-
      <p>Not an answer to your question, but I have to defend FontLab a little bit here :) I think FontLab is a great application. I've used it for a couple of years now producing many fonts – and only had small, small problems now and then, which I also have with other application btw. Often these problems can be easily solved and many times they arrives from something wrong I did myself. Or by adding some third party macro which was not really clean. Since FonLab is very much open to modification by the users (like modifying databases and such), it's hard to say where the problems actually come from, FontLab – or the user.</p>
      <p>That's my two cents anyway.</p>
