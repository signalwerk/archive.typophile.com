    html: "<p>Fedra will have a Cyrillic version soon (<a href=\"http://www.typotheque.com/site/discussions.php?topic=642\">link</a>). <br><a href=\"http://www.paratype.com/\">Paratype</a> works with multilingual fonts (mostly Cyrillic though). <br>Some Emigre fonts do have Cyrillic and Greek versions, but they're sold separately, as far as I recall. <br>Most of the MS fonts shipping with WinXP also cover CE, Cyrillic and Greek. <br>And of course, Adobe fonts: Warnock, Adobe Garamond, etc.</p>"
    html_clean: "<p>Fedra will have a Cyrillic version soon (<a href=\"http://www.typotheque.com/site/discussions.php?topic=642\" class=\"link-external\">link</a>). <br><a href=\"http://www.paratype.com/\" class=\"link-external\">Paratype</a> works with multilingual fonts (mostly Cyrillic though). <br>Some Emigre fonts do have Cyrillic and Greek versions, but they're sold separately, as far as I recall. <br>Most of the MS fonts shipping with WinXP also cover CE, Cyrillic and Greek. <br>And of course, Adobe fonts: Warnock, Adobe Garamond, etc.</p>"
