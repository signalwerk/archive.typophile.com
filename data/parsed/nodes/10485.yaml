    html: <p>Actually, Adobe Garamond Pro does not have Cyrillic. Adobe's upcoming Garamond Premier does, though. Besides Warnock, there's both Greek and Cyrillic support in Minion Pro and Myriad Pro. Most of our other typefaces currently in development will support both Greek and Cyrillic, too. <br> <br>Regards, <br> <br>T</p>
