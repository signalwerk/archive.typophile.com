    <p>Lots of variations in the picture; does anyone recognize this?</p>
    <p>The letter "h" is pretty distinctive, as are the ampersands "&amp;" and the way the tail of the lowercase "y" bends, and the way the bottom tip of lowercase "t" sweeps up at severe angle rather than a curve.</p>
