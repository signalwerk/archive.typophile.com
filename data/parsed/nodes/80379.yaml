    html: |-
      <p>A narrower version of Verdana that is some what available cross browser, because it comes installed with both OSX and Windows is Tahoma. There’s no italics though, and it isn’t available on most mobile devices.</p>
      <p>Verdana is a rather wide (read up on the design process if you want to understand why) humanist sans serif. Some more “normal” width humanist web fonts include: Frutiger, Compatil Fact, Syntax (the fonts.com website is a bitch to navigate, giving up at this point but please do look further!) Droid Sans Pro, FF Kievit, FF Milo, FF Scala and there’s also FF Unit which is rather narrow IMO. Typotheque offers Fedra Sans Screen, but I personally think they went a bit too far with that one: it really suffers on a Mac, but look splendid in Windows.</p>
      <p>You can pick up some info on the hinting quality of Lucida Grande &amp; Sans (Unicode) <a class="freelinking external" href="http://www.typophile.com/node/29822" rel="nofollow">here</a>. I can say for sure that many designers use Mac and often forget about the end users that usually sits on another platform.</p>
