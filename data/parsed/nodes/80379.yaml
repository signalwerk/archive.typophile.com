    <p>Hi there,<br>
    I wondered what website fonts might look good for an internet site. I tried Fakt (Opentype) on one website and I feel it looks better than Arial. ( in case you want to have a look: <a href="http://info-buddhismus.de" title="http://info-buddhismus.de">http://info-buddhismus.de</a> )</p>
    <p>For 2 other websites I was thinking maybe I use another opentype font which can be included directly via the @font-face CSS rule. But I checked with Museo Sans or Calluna Sans and it does not look good at all.</p>
    <p>Any idea which Font might work well? Verdana and Arial/Helvetica seem to be still the better choice. Also any example or link to a site which uses a well working font (being easy to read and also looking good) would be welcomed.</p>
    <p>I couldn't find a discussion thread about this topic on typohile, so I started this one. In case there is one already, please let me know and I do apologize.</p>
    <p>Thanks a lot.</p>
