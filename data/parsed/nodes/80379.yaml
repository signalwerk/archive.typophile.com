    html: |-
      <p>Apetickler, I couldn't agree more (how's that for a funny sentence?).</p>
      <p>Always test your website on Windows XP with default settings (with multiple browsers, and of course other OSes too). You will be surprised at how awful most webfonts look at smaller sizes. Here are some estimates of OS market share:</p>
      <p><a href="http://www.w3schools.com/browsers/browsers_os.asp" title="http://www.w3schools.com/browsers/browsers_os.asp">http://www.w3schools.com/browsers/browsers_os.asp</a></p>
      <p><a href="http://en.wikipedia.org/wiki/Usage_share_of_operating_systems" title="http://en.wikipedia.org/wiki/Usage_share_of_operating_systems">http://en.wikipedia.org/wiki/Usage_share_of_operating_systems</a></p>
      <p>Typekit has a feature called "Browser Samples" that shows screenshots of their web fonts on various OS/browser combos at different sizes. Most of the fonts tend to become legible around 18px and larger, which "coincidentally" is the size at which Georgia and Verdana switch to anti-aliased (on Windows anyway).</p>
