    html: |-
      <p>Mick. You need to check the rendering in multiple browsers, not just one. This is a huge topic, and there have been many post here in the past. Try <a class="freelinking external" href="http://www.google.no/search?q=site%3Atypophile.com+%40font-face&amp;ie=utf-8&amp;oe=utf-8&amp;aq=t&amp;rls=org.mozilla:nb-NO:official&amp;client=firefox-a" rel="nofollow">this google search</a>.</p>
      <p>In short: Both Arial and Verdana has had months (years?) worth of coding and nudging to help the computer interpret it’s curves as pixels. This is called hinting. Verdana is probably the best hinted font out there. Most of the new web fonts will not preform as good under all conditions, but some of them will look great in <em>most</em> conditions. Where do you start looking? </p>
      <p>• <a class="freelinking external" href="http://webfonts.fonts.com/en-US/Project/Choosefonts#classification%3D795536%26page%3D1" rel="nofollow">Fonts.com webfonts, classification: hand hinted</a><br>
      • <a href="/wiki/www.fontshop.com/fontlist/n/web_fontfonts/" class="freelinking" rel="nofollow">The Web Fontfonts</a> (there seems to be some problems with the Fontshop website)<br>
      • <a class="freelinking external" href="http://www.webtype.com/" rel="nofollow">Webtype</a><br>
      • <a class="freelinking external" href="http://typedia.com/blog/post/cure-for-the-common-webfont-part-1-alternatives-to-arial-and-helvetica/" rel="nofollow">Typedia, Cure for the common webfont pt 1</a><br>
      • <a class="freelinking external" href="http://typedia.com/blog/post/cure-for-the-common-webfont-part-2-alternatives-to-georgia//" rel="nofollow">Typedia, Cure for the common webfont pt 2</a></p>
