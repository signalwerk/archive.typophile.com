      <p>I can corroborate that the right arm of /V /v /y appears to range farther than the left and leaves a lot of space under it. I recommend pulling the bottom a bit to the right and preserving the present width.</p>
      <p>A forward-balancing /S tends to work just fine in context and can be left to personal taste. That said, I hope you will consider re-creating the dollar sign independently, perhaps with different terminals as well.</p>
