    html: |-
      <p>I like it. It has that transitional feeling without being as sharp as a Baskerville or Times. Much will depend on what the italic looks like, but the warmth you want is certainly there. I rather like (and am considering buying at the moment) <a class="freelinking external" href="http://www.fontspring.com/fonts/hoftype/ashbury" rel="nofollow">Ashbury</a> for similar reasons, so it's a font I can imagine buying myself.</p>
      <p>My one concern (though this is true about Ashbury as well) is the x-height. It depends on what you want it to propose it be used for, I suppose, but isn't it a bit big, perhaps, for body text? I also don't like that Q - perhaps it's me, but strokes not connecting when they should always subliminally make me feel like there's some kind of glitch. But I like the curve of it a lot.</p>
