      <p>In the smallest setting the tittles look too small, but maybe that's a rasterization issue?<br>
      /e/c/o/ look too wide to me. maybe /r/, /U/ too?<br>
      Terminals of /C/G/S/ need more weight.<br>
      Bottom vertex of /N/ should dip down a bit lower.<br>
      Bottom half of /s/ looks a bit too angular and off-balance, though of course you don't want to smooth the character out of it completely.</p>
