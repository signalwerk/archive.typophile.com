    <p>Hello all,</p>
    <p>I'm new here and I'm also new to type design. Having said that, I've been drawing type since I was a child and eventually grew up a little and became a graphic designer along the way. My hobby is now taking a serious turn as it's about time I tried to share and even sell my typeface designs. My first attempt was a hand drawn, all caps, neoclassical serif face that I named 'Carrig'. Carrig being the Irish word for 'rock' (I'm based in Ireland) and the typeface itself was strongly influenced by classic letterforms carved into stone and weathered by time.</p>
    <p>So, now I am developing Carrig into a full family and here, with the Roman weight, I have drawn a full set of lowercase characters to suit the style of their uppercase parents.</p>
    <p>Before I release this to the world, I would absolutely love some considered criticism (or praise!) so that I may improve it. As I am a novice, I am a little bit wary of making "schoolboy errors" and any advice anyone here can give will be greatly appreciated. And... as this is my first post, I promise to become involved with the community – if you'll have me :)</p>
    <p>You can look at further examples on my website – <a class="freelinking external" href="http://paulogoode.com/carrig-roman-typeface" rel="nofollow">Carrig Roman</a></p>
