      <p>You can say that again @Glider (sorry – it had to be said!). Fair comment about the x-height being big, that's been a deliberate decision because it's my first proper attempt at font creation and I'm designing via a combination of what I like and what feels intuitive. My original drawings (16 years ago) were calligraphic, hence the remnants of a hand drawn/unfinished style that you're picking up on and, as a strong influence, I've always loved how (some) Garamonds have an open /P bowl. I'm leaning towards keeping the /P and /R open to retain personality and differentiation, but will definitely look at joining the /Q.</p>
      <p>Cheers!</p>
