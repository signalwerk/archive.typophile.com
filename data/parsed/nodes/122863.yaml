      <p>Thank you @cerulean, that's exactly the kind of feedback I was hoping for when advised to sign up here. I will take those points on board and yes, I was being lazy with the dollar symbol and I already have that down to be reworked. </p>
      <p>My next question to anyone would be, is my font saleable? Is it too similar to another? I've been heavily influenced by Baskerville and the inscriptions from the Trajan column, is that obvious and therefore detrimental? Or do you see Carrig having its own merits and personality? </p>
      <p>I've made a conscious decision to avoid any straight lines in the letterforms (punctuation excepted) with the aim of giving  the typeface a natural warmth and friendliness... does that come across?</p>
      <p>Thanks again for your considered opinions.</p>
      <p>Paulo</p>
