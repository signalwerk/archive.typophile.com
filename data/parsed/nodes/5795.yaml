    html: <p>I have some familiarity with the work of the Eclat-lookalike font designer (one more edit is needed to get rid of all the places it showed up, by the way). I'd be a bit reluctant to accuse him of stealing Doyald's design, because I think they may both have used some old Art Deco -era books from the 20's and 30's as their inspiration. Many of the other fonts that Mr. N. C. has done have been digitizations of other authentic typefaces from that era. In fact that time period, as we know, seems to be in vogue again, and many foundries have revivals of old typefaces.  <br> <br>Stephen, does Doyald say that the Eclat design is his original creation?</p>
