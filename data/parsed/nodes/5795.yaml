    html: <p>When going to purchase Eclat yesterday, I also came across the unmentionable font above suggested. As evidenced by this quote I came across, it was indeed based on Eclat <i> :"Another phine phont phorwarded by Phil --- Letraset Eclat --- provided the inspiration for this addition to the collection. A mover, a shaker and a money-maker, ideal for when when you want to make a strong but elegant statement. The name? Eclat � �clair � Creampuff � seemed like a natural progression to me."</i> <br> <br>I downloaded it anyway for comparison and am glad I purchased Eclat, for two reasons (in addition to the piece of mind). Eclat has alternates - not many, but it's nice to have connecting and non-connecting versions of some letters like the lowercase g. Secondly the few letters that are different (lowercase r) I think are stronger in the original. No surprise there. If anyone's curious, I'd be glad to post a few comparison GIFs.</p>
