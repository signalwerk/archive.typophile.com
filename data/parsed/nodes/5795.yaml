    html: <p>Stephen, the showing of <a href="http://www.identifont.com/show?2OZ" target="_blank">Eclat at Identifont</a> says the design was 'Inspired by "fat face" designs of the early 19th century'  (I wonder if they meant 20th?). In any case that implies to me that it is not completely original, and it's possible that the other designer may have used the same sources.</p>
