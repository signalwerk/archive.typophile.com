    html: |-
      <p>Ahh, the site loaded in Firefox. I was attempting in NetNewsWire. Downloaded and installed the TrueTypes.</p>
      <p>As can be expected, attempts to fit the widths of another font result in a weak design. Such was the case with Arial, and Liberation Sans is similarly stunted. The Serif is more interesting.</p>
      <p>I'm not surprised to hear it's Matteson. He's done this sort of <a href="http://www.ascendercorp.com/Ascender_fonts.html#ascendersans" rel="nofollow">metric matching work</a> before.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/liberation_3803.png"></div><p></p>
