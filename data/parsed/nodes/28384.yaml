      <p>Perhaps what has happened in  recent years is that many people experience type and letterforms primarily through their computer and the font menu. It is easy to assume someone started with an existing typeface and made a logo or brand name. It is easy to fall in to the trap of assuming things came from a pull-down menu unless you have been in the business for long enough to remember otherwise.<br>
      In years past, hand lettering for such things was quite normal and expected. It was even easier to find a skilled lettering artist than it was to try and manipulate typeset forms. Today, there are fewer lettering artists who work the old fashioned way and billions of digital fonts available. A person can post an image here on this forum and in minutes get a close relative to a lettering sample, go to an online vendor, download and use it within the hour. Pretty amazing actually what a service folks like Mike, Patty, and Yves perform in minutes!</p>
      <p>ChrisL</p>
