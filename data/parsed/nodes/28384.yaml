      <p>Even very good custom script logotypes follow models, usually (in my experience) rather closely. Even though a handdrawn Bickham can be very different from a custom Bickham-based script, it's still a Bickham (not that this is, of course, just an example). </p>
      <p>For example, if you read the writings of The Doyald (Young), he'll almost always describe how he bases each logo on an existing typeface, and he's one of the most talented logo artists around.</p>
      <p>I've sometimes thought that some very good letterers have a limited number of "typefaces" (types of writing that they have learned and that are part of their repertoire). Like a "typeface" typeface, only more flexible, and some of these typefaces can be the creation of the letterer him or herself. I don't know if that's a fair comparison though.</p>
