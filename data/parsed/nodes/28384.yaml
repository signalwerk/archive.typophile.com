      <p><em>those kind of remarks belittles the talent of professional letterers and type designers.</em></p>
      <p>Usually we just answer questions like this by saying ' It looks custom designed, but Snell Roundhand or Ballantines Script might be similar', and I suppose if Stephen had said it that way maybe Nick wouldn't have reacted. As Yves said, the poster intended no harm, and so it seems unnecessary to consider an innocent question (or the reply) as any sort of slight to type artists/designers. Regardless of the way the questions are worded, people are usually coming here to ask us for something that can re-create a certain typographic look, hopefully by telling them the exact typeface (digital, if possible) that was used, but failing that to offer something that might give a similar look without needing to be able to draw it yourself, or hire a designer to do it.</p>
      <p>That's what we do here, isn't it? (Maybe with a little education about lettering artists and type designers thrown in, as a bonus.)</p>
      <p>- Mike Yanega</p>
