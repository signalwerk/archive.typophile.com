      <p><em>“how do you like the splotch?”</em><br>
      I like it. At this size, it didn’t strike me as artificial at all (at least when it’s used small). But you’d have to show a PDF to be sure.</p>
      <p>I don’t agree with Litera’s point of equalizing the level of detail. To my eye, this contrast in detail-level between the type and the splotch is very interesting visually and works just fine;* plus, I don’t think it’s so <em>very</em> detailed that you’ll run into reproduction issues at a “normal” size/usage.</p>
      <p>* Though I’ve been known to like more extreme levels of contrast than other designers, so maybe it’s just me. But coming back to the artificiality question above, I’m thinking if you make the splotch less detailed, it might just stop looking like a splotch!</p>
