    <p>Hello,</p>
    <p>I do screen printed and letterpress stationary which I also sometimes illustrate with pen and ink</p>
    <p>Okay which do you like best and why? Or if you hate them all and have another idea that’s good too.</p>
    <p>It is supposed to be “read”:  Anavi Ink</p>
    <p>However as you can see in the first logo it is AnavInk</p>
    <p>I want to convey a feel of vintage and organic with just a touch of the feminine and maybe a little bit of grunge thrown in for good measure.</p>
    <p>I need help.</p>
    <p>thanks!</p><div class="imageWrap"><img src="/files/Logos_5828.jpg"></div><p></p>
