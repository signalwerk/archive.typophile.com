    votes: null
    html: |-
      <p>Small splatters have way too much detail to be complemented with less detailed type. On the other hand, none of the big ones work...</p>
      <p>so you either:<br>
      1. try to make a big splatter work<br>
      2. remove detail from the small one (I would also enlarge it a bit)</p>
      <p>regarding #7. It’s probably better to have it as capital I, but what should definitely be done is stem weight to match other letters.</p>
      <p>And apart from my comment with “1 and 2”... I’d separate splatter from the letters. I guess that’s a good way of using a bigger splatter. If you make the splatter somehow resemble letter “a” it would be even better. But it should look natural and not too artificial/pushed... Or maybe use letter “a” and replace the bowl with a splatter. Could be a nice logo symbol. And probably also a very nice and original use of splatter.</p>
      <p>Splatters are usually visually pleasing, natural and beautiful. So I would just use ’em as is.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
