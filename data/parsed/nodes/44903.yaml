      <p>Heather, I prefer Stormtype's version of Baskerville above all others. Their <a href="http://www.stormtype.com/typefaces-fonts-shop/families-77-baskerville-10-cyrillics" rel="nofollow">Baskerville 10</a> sets nicely.</p>
      <p>As for Adobe vs BQ, I do like the BQ version at smaller sizes, but the emdash is actually smaller in the BQ cut.</p>
