    html: |-
      <p>The issue of font licensing varies. Agfa-Monotype (now Monotype Imaging) distributes all of the fonts at its website under their own license; MyFonts.com distributes all of the fonts at its website under the issuing foundry's license. The important matter to consider here is that, when you "sell a font," you are not actually selling a piece of software, but only a license to use that software.</p>
      <p>The advantage Monotype gains from their practice is that, since they are selling their own licenses, they can determine the selling price (and collect a heftier commission). MyFonts.com merely serves as a sales agent, and collects a smaller commission.</p>
      <p>Without going into details, let me say that, personally, I do not intend to renew my distribution agreement with Monotype when its current term expires, but will continue with MyFonts.com as long as they'll have me.</p>
