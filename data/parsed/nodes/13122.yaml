    <p>I'm thinking on building up a small Foundry/Font Distributor web based company for Portuguese/Portuguese comunity Indie Font Developers. Already bought the URL, TYPENATION.com, and I wanted to ask you typophiles what are the legal/comercial aspects I have to start with. </p>
    <p>For instance, is the fonts licence issues a foundry responsability? On myfonts.com what is the process to add up the foundry on the list?</p>
    <p>Any help on these issues/warnings is welcome.</p>
    <p>Jim, from unionfonts.com or Grant from Veer.com, any help would be appeciated :) </p>
    <p>thanks.</p>
