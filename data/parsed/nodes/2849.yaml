    date_raw: 31 Jan 2004 — 8:03am
    votes: null
    html: "<p>Hi Matt, thanks for pointing me here. <br> <br>&gt;I was trying to do something that wasn't roman or traditional. <br> <br>I don't see a reason for which you should worry about doing a thing \"too this\" or \"too that\". What makes a rivisitation of an historical form interesting is what you add/subtract/modify, more than what you \"preserve\" or \"redo\", in my opinion. <br> <br>For this reason, I find the original z less traditional and thus more appropriate to be used as the main z (with some adjustment, maybe). The new d, g, p and y are great. <br> <br>Be careful with the alternate f: it can be easily mistaken for a long s. <br> <br>I would definitely try stranger forms, anyway (like the alternate D).</p>"
    html_clean: "<p>Hi Matt, thanks for pointing me here. <br> <br>&gt;I was trying to do something that wasn't roman or traditional. <br> <br>I don't see a reason for which you should worry about doing a thing \"too this\" or \"too that\". What makes a rivisitation of an historical form interesting is what you add/subtract/modify, more than what you \"preserve\" or \"redo\", in my opinion. <br> <br>For this reason, I find the original z less traditional and thus more appropriate to be used as the main z (with some adjustment, maybe). The new d, g, p and y are great. <br> <br>Be careful with the alternate f: it can be easily mistaken for a long s. <br> <br>I would definitely try stranger forms, anyway (like the alternate D).</p>"
