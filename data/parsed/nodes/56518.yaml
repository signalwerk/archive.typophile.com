      <p><cite>[it] looks as intended, with ClearType x-direction and greyscale y-direction antialiasing.</cite></p>
      <p>Sure, it looks much nicer!</p>
      <p>But this type of rendering – “ClearType 2” – was intended to be in Vista, but it was not included.* And looking to the screenshots of Windows 7, it is probably not going to be there either.</p>
      <p>Web fonts are coming, and how will they look like in headlines? With jaggies (ClearType) or only with greyscale antialiasing. Both ways are certainly not the nicest.</p>
      <p>* By included I mean at least a user preference to turn it on, like it was ClearType in XP. Strictly speaking, it is included in Vista, but it can only be accessed by programs which were written specifically with the setting for this type of rendering.</p>
