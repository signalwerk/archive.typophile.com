    html: <p>Yes, I wonder about this too. On the one hand, MS are pushing DirectWrite -- as well they should --, and I'm being hired to make fonts specifically with this technology in mind. On the other hand, even Microsoft's own major apps, especially Office, seem unlikely to be rewritten or replaced for DWrite/WPF. But perhaps Web browsers and readers are where we will see this stuff implemented first, since something like IE is a much smaller code base than e.g. Word and without the same backwards compatibility issues.</p>
