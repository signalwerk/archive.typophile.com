    html: |-
      <p>I reserve the term ‘script’ for typefaces that deliberately mimic handwriting, usually -- but not always -- with connecting letters. Although the Gabriola letters have a lot of flow to them and a distinctive pattern of entry and exit strokes, I think of them as essentially typographic forms, not handwritten ones.</p>
      <p>The ‘Flemish roots’ to which James refers are really a kind of visual inspiration rather than a model for the letterforms. I was inspired by the look of things like this (by the master Jan van de Velde):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/VDV_5728.jpg"></div><p></p>
      <p>But both the shape of the letterforms and, crucially, their stroke modelling is very different. The Baroque Flemish writing masters used a broad nib which they rotated to produce a greater variety in the pattern of thick and thin strokes than had previously been done. Gabriola is based around an expansion stroke model, closer to that characteristic of a pointed split nib. I'll be talking about the reasons for this during my lecture at St Bride's later this month. The short reason is that the expansion stroke model is more flexible than the translation or rotation models.</p>
    html_clean: |-
