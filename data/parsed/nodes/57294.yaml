      <p>Thanks gferreira. But I must say that Visual TrueType looks as complex as normal TT hinting in FontLab. And after reading this:</p>
      <p>Is Visual TrueType an appropriate tool for you? </p>
      <p>Although the graphical user-interface of VTT dramatically simplifies the task of font hinting, the tool is not for the novice. The learning curve is fairly steep, simply because hinting requires professional skills regardless of the tools. Even accomplished type designers who have been using Fontographer and FontLab for years to design fonts have evaluated VTT and decided that professional hinting is not for them. In a way, this is similar to desktop publishing programs, as they make it easier for the professional typesetter to cut-and-paste, but they don't make the rest of us professional typographers.</p>
      <p>I don't think this is the solution to make TT hinting easier. But thanks anyways, it's better than nothing ;)</p>
      <p>Rudy</p>
