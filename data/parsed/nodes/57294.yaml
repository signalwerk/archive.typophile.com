    html: <p>I started to try to teach myself about it and I got some good results but I never felt that I had a comprehensive understanding. The other thing is you can semi-OK hinting with automated methods. And the rendering environments that TT hinting is made for may or may not be ones your project needs to worry about. So before you invest the time I would look carefully at why you need to know about this. Once you have a clear context it maybe a great idea to learn about but it may just as easily be a waste of time. And finally my understanding is that Pros use special in house tools you cannot buy. I would be interested in any info that contradicts this last point.</p>
