    votes: null
    html: |-
      <p>Rudy, </p>
      <p>For the Type 1 hinting model the essential steps to do is: </p>
      <p>1. Font Info / Hinting Settings / Auto Zones.<br>
      2. Tools / Action / Hints and Guidelines / Autohint (with Apply to entire font enabled).<br>
      3. Font Info / Hinting Settings / Standard stems / Auto stems. </p>
      <p>Once this is done, you can let FontLab Studio do the conversion when generating the TT font, or you can take the separate step to convert your outlines to TrueType outlines and then convert hints to TT instructions using Tools / Action Set. This will have exactly the same result. </p>
      <p>However, if you do the conversion in a separate step, you'll be able to open the TrueType Hinting tool before generating the font and review the hinting results glyph by glyph. </p>
      <p>Cheers,<br>
      Adam</p>
