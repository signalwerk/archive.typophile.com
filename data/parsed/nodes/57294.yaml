    <p>I was wondering if there were any new tutorials or books about TrueType hinting in Fontlab? I've read the guide on: <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;cat_id=FontDesignTools" title="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;cat_id=FontDesignTools">http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;cat_id=FontDesi...</a>  and I'm also studying the Fontlab Manual, and I have seen some other sites on the matter, but I'm looking for something refreshing that will shed new light on the subject.</p>
    <p>I'm hoping to find a tutorial or book that will guide you through the TrueType hinting process in a step-by-step manner that will keep me awake and off the coffee :P</p>
    <p>If anyone knows of such a tutorial/book, or knows if there's one coming, please let me know :)</p>
    <p>Thanks in advance!</p>
    <p>Rudy</p>
