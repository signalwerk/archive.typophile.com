    html: |-
      <p>Monospace.<br>
      Something new, I note the reference to 2012.<br>
      If this is a screen play the usual rule is that it must be written in courier 12 point, a monospaced font where the consistant character spacing means one page approximately equals one minute of screen time. Recently screen plays are also accepted in Courier Prime and Courier Final Draft. But none match your sample.<br>
      I did not find a full match from any type writer fonts -- also monospaced -- via Identifont &amp; Myfonts, although some were close. Probably your font(s) could be found by going though the foundries that are not included there. Not at H&amp;FJ. Some key points for comparison are the ear and lower bowl on g, 3, 2, j, a, &amp;  italic x.<br>
      Identification goes to someone who perseveres in the search.<br>
      Don</p>
