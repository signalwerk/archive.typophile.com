  html: |-
    <p>I'm compiling a list of rounded condensed typefaces - preferably something with a distinctive regular book/light for body text.</p>
    <p>So far Gravur condensed and Brauer Neue are fairly on the money, just wondering if anyone's got any more suggestions (not hermes though).</p>
    <p>Thanks.</p>
