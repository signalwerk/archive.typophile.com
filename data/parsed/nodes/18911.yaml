    html: <p>You have to enable it via the International control panel in System Preferences. Select the "Input Menu" tab of the International control panel. Make sure both "Show input menu in menu bar" and "Keyboard Viewer" are checked. You should now have a menu with a little flag icon at the top. The Keyboard Viewer will be in that menu.</p>
