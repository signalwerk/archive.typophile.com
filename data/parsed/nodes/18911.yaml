    <p>Help!!!</p>
    <p>I'm setting a magazine and am involved in a very complicated index. There are many, many foreign accents. However, I am having trouble identifying all of the keystrokes. I am using Times as I believe it contains most of the accents. Does anyone know where I can access a chart or listing of complete accent keystrokes?</p>
