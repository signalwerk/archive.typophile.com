    html: <p>Adam, I'm not sure if this is the issue that Eric is encountering, but I had a problem with the rename glyphs script last year when some .ren files I created had Unicode encoding instead of 'DOS'. [I made them in UltraEdit, with which I know you are familiar, and had set up my preferences so that every new document was automatically Unicode encoded.] When I converted the .ren files to 'DOS' encoding, the script worked. <br> <br>Is it possible that your script requires 8-bit text?</p>
