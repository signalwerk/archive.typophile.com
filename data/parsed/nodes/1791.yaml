  html: <p>Earlier this year I wrote an article for Graphic Exchange, &lt;a href="<a href="http://www.shinntype.com/Stories/Uniformity.pdf" target="_blank">http://www.shinntype.com/Stories/Uniformity.pdf</a>"&gt;The Face of Uniformity,&lt;/a&gt; in which I criticized the widespread use of old sans-serif typefaces. <br> <br>As a follow-up, in my next article I will be discussing original, contemporary typefaces. <br> <br>That doesn't exclude designs in traditional genres, although I would be more inclined to include Frank Heine's Dalliance than his Tribute.  <br> <br>Any suggestions? (Type designers, feel free to mention your own work.)</p>
  html_clean: <p>Earlier this year I wrote an article for Graphic Exchange, &lt;a href="<a href="http://www.shinntype.com/Stories/Uniformity.pdf" target="_blank" class="link-external">http://www.shinntype.com/Stories/Uniformity.pdf</a>"&gt;The Face of Uniformity,&lt;/a&gt; in which I criticized the widespread use of old sans-serif typefaces. <br> <br>As a follow-up, in my next article I will be discussing original, contemporary typefaces. <br> <br>That doesn't exclude designs in traditional genres, although I would be more inclined to include Frank Heine's Dalliance than his Tribute.  <br> <br>Any suggestions? (Type designers, feel free to mention your own work.)</p>
