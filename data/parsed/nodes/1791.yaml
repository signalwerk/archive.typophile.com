    html: "<p>Yes, great article - very informative, and a great close. <br>You should try to get it published widely. <br> <br>&gt;&gt; \"The look of late 60s typography was very, <br>&gt;&gt; very tight, and this way of setting has <br>&gt;&gt; become intimately associated with Helvetica. <br> <br>Not least because Helvetica's default spacing is way too tight (for good readability)! <br> <br>Doyald Young in fact offers a very interesting -if also somewhat esoteric- explanation for the greater success of Helvetica over Univers: the latter is -or actually seemed- too loose. <br> <br>hhp <br></p>"
