    html: <p>Thomas, <br> <br>I doubt there is a font to match this hand drawn  <br>lettering, but these kinds of initials are often offered as  <br>clipart. The Dover books are a good source. Search for  <br>"dover initials" at amazon.com, or abebooks.com. <br> <br>Also, Linotype's Madame isn't so far off. Interestingly,  <br>the forms are so complex, it requires several keystrokes  <br>to create each letter. See -&gt; <br><a href="http://www.myfonts.com/Testdrive?p=96&amp;s=pPaAvV&amp;id=11650&amp;submit=display" target="_top">http://www.myfonts.com/Testdrive?p=96&amp;s=pPaAvV&amp;id=11650&amp;submit=display</a> <br> <br>Stephen Coles</p>
