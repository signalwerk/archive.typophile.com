      <p>&gt;Giving a younger person with a brain a chance at leading the country is a nice idea, but how practical is it?</p>
      <p>Obama ran an astoundingly disciplined campaign. He came from basically out of nowhere and managed to unseat the frontrunner in the primary, Hillary. He had an organized field operation that turned out the vote in places that had not voted for a democrat in decades. His first real act as candidate was choosing a vice president; he went with a man who has the experience he lacks rather than a publicity grab like Sarah Palin. He has shown extraordinary judgment and restraint in the general election. I have no doubt that Obama will staff his administration with smart, experienced advisors. I trust that he will have learned from what went on the past 8 years and cooperate with the other side, especially since he’s facing the sorts of challenges (economy, wars, healthcare, global warming) that require a bipartisan effort rather than just ramming legislation through.</p>
      <p>And importantly, he represents a chance for America to redeem its tattered reputation abroad.</p>
