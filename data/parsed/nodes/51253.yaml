      <p>Well, I’m sitting up here in Canada, right on top of good ol christian america.  I doubt most americans realize their neighbours to the north also just finished a federal election.</p>
      <p>Yup, that’s right, we re-elected Stephen Harper as Prime-Minister of Canada.</p>
      <p>Now, what do I think of the election, living almost within sight of the US, and raised in a half-american home?</p>
      <p>If this election shows us one thing, it’s that the mainstream american media has more power than ever.  Most americans I talked to for the longest time though the election was between Hilary and Obama.</p>
      <p>As america’s #1 trading partner, Obama gives me the heebie-jeebies.  He focuses on America’s weaknesses and mistakes, and his promise of change, but I haven’t heard enough of his political platform, his plans and his personal worldview to support the man.</p>
      <p>McCain does talk, and I believe him to be a liar, or delusional.</p>
      <p>We all know Obama was going to get in, and we’re in for a 4 year ride.  Please, please all americans get involved in politics in your community, get involved and don’t let your country go to waste because of a leader (no matter who it is)</p>
      <p>I think the next election will be the one that uses the Internet in place of Television as the deciding battleground - it would be wise to start working on that framework and technology now!</p>
