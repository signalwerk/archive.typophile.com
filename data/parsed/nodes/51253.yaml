    <p>So I was sitting around the other day and realized that I had some nice development on some type to help express my political views and had unfortunately done nothing with it. So I sat down for an hour and pushed something out for fun. I figured I would post it and see if we can get a poll on election day of the typography crowd up here. So throw them up! Take a few minutes (or more if able) and show your support for your party with a fancy little type lock up. You know, if you are into that kind of thing.</p><div class="imageWrap"><img src="/files/obama-we-believe_3767.gif"></div><p></p>
