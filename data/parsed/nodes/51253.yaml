      <p>As a “foreigner” like Sii, I don’t get to vote in the U.S presidential election(s). This one has recieved so much attention outside the U.S that people over here and elsewhere have been saying we non-U.S citizens of the free Western world should get to vote for the U.S president since it affects us in more ways than we care to mention.</p>
      <p>I like Barak Obama and think he would make an excellent president in 15 to 25 years from now, when he has more life experience and experience holding executive office. I know, he is an early bloomer, and America really needs change right now, but installing a young president who isn’t white-skinned is not the way to do it. Obama’s skin color is not an issue with me. His lack of experience and world weariness is tho. And not being white-skinned makes him the target of hatred and bigotry. I don’t want to see him get blown away. Watching Kennedy die was bad enuff. A liberal white-skinned nominee devoted to change and pulling America out of Iraq, Afganistan and Pakistan, funding the war veterens hospitals and public health care system properly would be a better choice.</p>
      <p>A large number of the public are still using the outmoded term “race” when referring to Obama. There is no such thing as race or races within the human species. We are all of the same race—homo sapiens. In a politically-correct liberal society, “race” should not be an issue to the extent it does not even rate a mention, yet people continue referring to Barak Obama’s “race”. So we ain’t there yet.</p>
      <p>j a m e s</p>
