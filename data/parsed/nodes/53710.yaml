  html: |-
    <p>Every time I insert my four-letter-lowercase code (prgr) into a new typeface I feel like I should make another effort to register Paragraph. Over the past year I sent numerous emails to Microsoft Typography, followed all sorts of outdated links, supplied all sorts of info, emailed technical support, and in the end ended up where I started: <a href="mailto:tsitebug@microsoft.com">tsitebug@microsoft.com</a>, where as far as I can tell, nothing happens.<br>
    How important is the registration, and does anyone still provide it?<br>
    prgr ;-)</p>
