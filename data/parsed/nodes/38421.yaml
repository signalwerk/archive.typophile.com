      <p>No, Woofin’ is a Japanese Urban magazine. This is the version geared towards females so that’s why it says Girl. (Like American magazine VIBE and then there is a female version of VIBE called VIBE Vixen which isn’t any sort of slang, it’s just the name of a magazine) It features more fashion and makeup, etc. Woofin’ is not any sort of new slang as the original Woofin’ (which is still on sale) has been out for years now, and it certainly isn’t a reference to “brick shithouse” or Snoop Dogg. Don’t hurt your heads thinking too much into it.</p>
      <p>On the Cawaii image I want to know what the big word “Cawaii” is written in. Not anything else because I have those in my comouter, but thanks for your help.</p>
      <p>So does anyone know what the big “Cawaii” is written in?</p>
