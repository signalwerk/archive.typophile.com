    html: |-
      <p>Yes (although more about weight than size). In a text face busy letters (like often the "s" as well) have to look lighter when large/magnified in order to end up looking the correct weight at small sizes.</p>
      <p>Also, I believe a good binocular "g" must necessarily look a bit small and a bit vertically cramped in order to avoid more important things going out of whack across the font as a whole.</p>
      <p>hhp</p>
