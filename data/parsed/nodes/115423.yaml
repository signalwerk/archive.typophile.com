  html: <p>I was just curious as to why most serif typefaces that have a lowercase g with a loop are proportionally less in weight than the other letters. Is this to optically balance it out so it doesn't end up looking too big?</p>
  html_clean: <p>I was just curious as to why most serif typefaces that have a lowercase g with a loop are proportionally less in weight than the other letters. Is this to optically balance it out so it doesn't end up looking too big?</p>
