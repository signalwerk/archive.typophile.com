      <div class="comment-spam-body"><p>In the typewriter era Italic typefaces were very rare.<br>
      To produce a page with part of the text in Italic it would have been necessary to take the page out of the machine and put it in a different typewriter that used an Italic typeface, manually align the page and type the Italic portion of the text. Then take the page out and return it to the original typewriter to resume typing with the Roman typeface.  A painstaking process, to say the least.<br>
      The usual practice for making Italic letters was to continue typing the Italic portion with the regular Roman typeface, then go back and type over the Italic portion with the underscore key.<br>
      Don</p>
      </div>
