      <p>Typewriter manufacturers did make italic faces for typewriters, even though they were not popular - emphasis was done by underlining, or by switching to the red side of the ribbon. When the IBM Selectric came along, at least you could change typestyles by changing the element.</p>
      <p>And of course, before the Selectric, there was the Blickensderfer and the Hammond.</p>
      <p>So a little research will turn up quite a few examples. There were even italic faces for the IBM Executive.</p>
      <p>But I presume you're looking not just for the typeface, but for ready-to-use fonts in TTF or OTF format, of which I can't recall an example offhand.</p>
