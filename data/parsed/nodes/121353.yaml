      <div class="comment-spam-body"><p>I had forgotten about Triplicate Poly [proportional spacing]. Of the suggestions so far it is the only one that gives you something of an old typewriter look, with Italics, that looks finished rather than distressed. It's seems to have comfortable spacing for extended text -- neither too tightly set or too loose -- and might work OK for a book length. </p>
      <p>The mention of old pulps reminds me that many of them were set in Plantin. I posted a sample at the end of the following thread: <a href="http://typophile.com/node/117180" title="http://typophile.com/node/117180">http://typophile.com/node/117180</a></p>
      <p>Plantin would work well in a book that used a Roman for much of the text and the typewriter look for some purposes.</p>
      <p>If the typewritten stuff is relatively short, the underscore technique would give a real flavor of period authenticity.</p>
      <p>Don</p>
      </div>
