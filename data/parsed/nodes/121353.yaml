      <p>I read a book once, "File Under Architecture" by Herbert Muschamp, that was entirely set in typewriter fonts. I don't recall having any trouble or fatigue from reading it. In fact it was printed on brown craft paper, sometimes using purple ink. Yet I remember it as being very enjoyable to read. I'm not saying it's necessarily a good idea to design a book this way (if the book had been dull, I might have had a different opinion about its design), but I think it can work.</p>
      <p>Typewriter fonts are generally not as beautiful or refined as book typefaces, but most were at least designed to be legible, given their limitations. Their main drawback is that they are not very space efficient. A book face set poorly (too tight or too loose or too small or with too little leading) would probably be worse than a typewriter font in terms of reading fatigue.</p>
      <p>(Anecdotal, I know.)</p>
