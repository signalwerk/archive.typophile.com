    <p>Hello Typophiles,</p>
    <p>I'm working on a book that draws a lot from old hard-boiled detective fiction, and a typewriter font just feels right. But ITC American Typewriter doesn't—too big, not quite low-tech or yesterday enough. </p>
    <p>Problem is, as I try and run down other typewriter fonts that might work better, most (for obvious technological/historical reasons) don't have an italics variation. I have reluctantly concluded I do need to use italics at certain points, and therefore am having an even harder time finding the perfect font.</p>
    <p>Please, can you knowledgeable folks throw me some recommendations for fonts that can pass as reasonably reminiscent of old-school typewriters, yet depart from that enough to have a proper italics variation included? </p>
    <p>Thank you in advance!</p>
    <p>Respectfully,<br>
    irrenmann</p>
