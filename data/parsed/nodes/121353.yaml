      <p>Do you plan to set the entire book in a monospaced typewriter font? That could become tiresome to read quite fast.<br>
      If the typewriter setting is just for selected portions of text, I would go for full authenticity and follow Don’s advice about underscores instead of italics.<br>
      If all the text is to be equally set in the same typeface, I would go for something proportional in width that just hints at typewriter style or, maybe better yet, something that reprise the style of typefaces used in the old pulp paperbacks (perhaps keeping the monospaced typewriter treatment for headings).</p>
