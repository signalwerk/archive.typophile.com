    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Typophile's List of "Essential" Typefaces</strong></p>
    <p>In response to several requests for a list of "essential" typefaces, this page is an experiment to compile a list agreed upon by Typophiles.</p>
    <p><strong>Rules:</strong>
    </p><ol>
    <li>If you don't see a typeface you feel is "essential," please list it here. For every face you agree is essential, put an "I" in the parentheses following the font name. This will be representative of one (1) vote.</li>
    <li>Put a designation in the square brackets: bt=book text, mt=magazine text, nt=news text, dn=display sans, df=display serif, fp=fine print, as=architectural signage, gp=general purpose, cs= computer screen, tv=television. <em>(Feel free to add more as needed)</em></li>
    <li>Put your initials in the curley brackets and an explanation of your initials in the Initials Index at the bottom.</li>
    </ol>
    <p></p><p>Please do not "stuff the ballot box." Also, do not erase others' votes. Moderators will be able to know who has tampered with the voting!!!</p>
    <p><strong>The List</strong><br>
    <a href="/wiki/Amplitude" class="freelinking" rel="nofollow">Amplitude</a> (I) [] {sjc}<br>
    <a href="/wiki/Avenir" class="freelinking" rel="nofollow">Avenir</a> (I) [bt] {tc}<br>
