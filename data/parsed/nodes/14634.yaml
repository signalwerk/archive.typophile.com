    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: Typophile’s List of “Essential”&nbsp;Typefaces</strong></p>
    <p>In response to several requests for a list of “essential” typefaces, this page is an experiment to compile a list agreed upon by&nbsp;Typophiles.</p>
    <p><strong>Rules:</strong>
    </p><ol><li>If you don’t see a typeface you feel is “essential,” please list it here. For every face you agree is essential, put an “I” in the parentheses following the font name. This will be representative of one (1)&nbsp;vote.</li>
    <li>Put a designation in the square brackets: bt=book text, mt=magazine text, nt=news text, dn=display sans, df=display serif, fp=fine print, as=architectural signage, gp=general purpose, cs= computer screen, tv=television. <em>(Feel free to add more as&nbsp;needed)</em></li>
    <li>Put your initials in the curley brackets and an explanation of your initials in the Initials Index at the&nbsp;bottom.</li>
    </ol><p>Please do not “stuff the ballot box.” Also, do not erase others’ votes. Moderators will be able to know who has tampered with the&nbsp;voting!!!</p>
