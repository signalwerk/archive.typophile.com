      <p>For the K–12 level, you probably do not need any specialized math or TeX font. You may run into trouble with vector arrows in physics, but as far as I know, any good typeface with Greek support will do the job. Almost every professional font includes √, mathematical π Δ and ∂,  ∫, ∞, and ∑, though I would make sure they have ≥ ≤≅ and the angle symbols since those are non standard. No font includes the characters for vincula and the radical overbar—either your equation engine makes them itself, of you manually construct them with em dashes or underscores.<br>
      In my experience, I've found it easier to just manually typeset the built-up equations with text boxes and em dashes. Much more flexible that way and you can correct stuff that looks funny. I typeset an entire physics paper that way. The only place I can see you running into trouble is with the stretch parentheses and stuff—you might have to resort to a helper font that contains those symbols (or just draw the helper font yourself).</p>
      <p><a class="freelinking external" href="http://1.bp.blogspot.com/-7v3h0CnOhWU/VASwkryLhUI/AAAAAAAAAdY/wQbUbY20vYk/s1600/Screenshot%2B065.png" rel="nofollow">Example using just Minion Pro and a word processor</a></p>
