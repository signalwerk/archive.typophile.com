      <p><cite>we are about to start a textbook series for K-8 and highschool levels so we're consulting the professionals about the best-suited typography for equations &amp; formula input.</cite></p>
      <p>I'm confused. What you have listed are *typefaces,* and not ones particularly suited for technical/mathematical typesetting. For one thing, they seem to lack the needed characters.</p>
      <p>I would assume, if you're going to be setting technical/mathematical material, you would consider some form of TeX -- LaTex, XeTeX, etc. The layout program (typesetting program) is going to be much more important than any font choice here.</p>
      <p>Fortunately, the TeX uses of the world are usually quite willing to advise someone on font choices, based on the material needing to be set.</p>
