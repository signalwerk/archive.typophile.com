      <p>The <a href="http://www.ctan.org/tex-archive/fonts/minionpro" rel="nofollow">MinionPro package</a>  uses the MnSymbol fonts that were designed  to be used with Minion. Here are all the fonts included in the pdf:</p>
      <pre>MinionPro-Capt
      MinionPro-It
      MinionPro-Regular
      MnSymbol12
      MnSymbol8
      </pre><p>I used pdfLaTex; so the  MnSymbol fonts come from Type 1 files; there are files for 5, 6, 7, 8, 9, 10 and 12 points. I thus presume the way the parentheses scale follow the designer's preferences. </p>
      <p>If I compile the same file with the package fourier (Utopia based), which is the package I use regularly, here is what I get:<br>
      <img src="/files/eqn_utopia_four_6343.png" width="100%"><br>
      (Equations using the Fourier math font and Utopia)<br>
      The large parentheses are less agressive. The fonts used are (listed with <code>pdffonts</code> on the pdf file)</p>
      <pre>Fourier-Math-Extension
      Fourier-Math-Letters-Italic
      Fourier-Math-Symbols
      Utopia-Italic
      Utopia-Regular
      </pre><p>There is no "opticals". </p>
      <p>I don't think I would parenthesize the way you did though. I usually put smaller parentheses inside larger ones which would give something like this (with fourier)<br>
      <img src="/files/fourier_paren_x4_4469.png" width="100%"><br>
      (Open in new window for larger image)</p>
