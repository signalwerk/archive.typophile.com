      <p>This is a somewhat old thread which just came to my notice.</p>
      <p>Computer Modern, although the current version is much improved over the original, is still questionable from a typographical standpoint.</p>
      <p>Given that the textbook is not college-level, it may not be the case that you need a typeface with a comprehensive set of mathematical characters.</p>
      <p>There are a number of open-source imitations of Times Roman that have extensive sets of mathematical characters (STIX, which has display problems in some programs, and TeX Gyre Termes, which has fewer mathematical characters, come to mind.)</p>
      <p>If you prefer something resembling Palatino, there's Asana-Math; like STIX, it may have problems with some programs under Windows.</p>
      <p>Symbola, DejaVu Serif, and Quivira are other choices.</p>
