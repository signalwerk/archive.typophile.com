    <p>Hello Everyone, </p>
    <p>I represent a small University Press based on Mexico, we are about to start a textbook series for K-8 and highschool levels so we're consulting the professionals about the best-suited typography for equations &amp; formula input. The one with all the bells and whistles.<br>
    We hope you can help us with some suggestions.</p>
    <p>Our considerations so far are:<br>
    Freda Serif A<br>
    Le Monde Livre<br>
    Athelas</p>
    <p>Thanks in Advance for your help.<br>
    All best.</p>
