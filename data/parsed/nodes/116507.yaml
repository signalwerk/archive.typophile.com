    html: |-
      <p><cite>Are books for students also mostly typeset in a sans?</cite></p>
      <p>That depends on the country you are in, and the time period.</p>
      <p>In the English-speaking world, textbooks for the earliest primary grades used to be set in large sizes of Caslon, and then we saw Spot run in Century Schoolbook.</p>
      <p>In some other countries, infanta versions of sans-serif faces are often resorted to in primary schools; in the English-speaking world, they're used for some storybooks that parents buy to read at home to their small children.</p>
      <p>For older students, there was Monotype Modern Series 11 in the days before Times Roman conquered the world. These days, Baskerville, Garamond, Caledonia, Palatino... whatever is used for text setting in general may be found in a textbook. (Halliday and Resnick, a very popular first-year University physics textbook, was set in Baskerville.)</p>
      <p>Not that Helvetica or Univers could not be found in, say, a textbook on architecture or graphic design. My experience is with the physical sciences, where there was more conservatism, and I do not recall sans-serif faces in primary or secondary school textbooks in the 1960s.</p>
      <p>I know that I have come across a math book in an uncommon foreign language - perhaps it was Hungarian - set in a Venetian typeface, of all things.</p>
