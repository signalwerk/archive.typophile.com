      <p>So, Papazian, apparently you know of no good font choices which can successfully be combined with a layout program for Mr. Sánchez to typeset equations and formulas. Why, then, did you post? Do you in fact have such knowledge, but are unwilling to share it? Or are you suggesting that since nothing meets your criteria, Mr. Sánchez should abandon his efforts and seek other employment? </p>
      <p>Mr. Sánchez -- since you've been a typophile member for almost four years, you already know Papazian rarely has anything helpful to offer, especially for people who want to <cite>use</cite> type. </p>
      <p>Any working professional should know there are type families other than Computer Modern which can be used with TeX. And the TeX community is a good place to ask about them. As a general note, many of the more technical books published through The Johns Hopkins University Press are typeset using LaTeX, as that is what most (technical) author's use to prepare their manuscripts. Much easier on all concerned to just follow through and use LaTeX to set the book after the editorial &amp; design work is done. The designer must take the typesetting process into consideration, of course, but would in any case. How do you typeset a book requiring characters not available in a font?</p>
