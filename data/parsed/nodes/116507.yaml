      <p>Luis, if you are still checking this, what layout application(s) are using for composing your equations? Have you considered (if it is a consideration) how you will transform to MathML or output digitally? Currently MathJax is one of the best tools for delivering equations in digital products and online but it uses the STIX fonts by default (for MathML) and this could mean a dramatic shift in look and feel between your printed and digital output. <a href="/wiki/https%3A/%252Fgroups.google.com/forum/%2523%21msg/mathjax-users/PjcC7lqbNGs/z-EafIHplpoJ" class="freelinking" rel="nofollow">There are workarounds</a> but they are complex.</p>
      <p>In terms of print there are numerous options, including TeX as mentioned above, <a class="freelinking external" href="http://office.microsoft.com/en-us/word-help/write-insert-or-change-an-equation-HA001230361.aspx" rel="nofollow">Microsoft Word</a> (Cambria Math), <a class="freelinking external" href="http://www.dessci.com/en/products/mathtype/" rel="nofollow">MathType</a> (<a class="freelinking external" href="http://www.dessci.com/en/products/mathtype/misc/euclid_plain.gif" rel="nofollow">Euclid</a> and various symbol fonts) and <a class="freelinking external" href="http://www.phsoftware.com/pages/powermath_indesign.html" rel="nofollow">PowerMath</a> (Helvetica, Palatino, Times Ten and symbol fonts). I am sure there are more but these are the ones I am most familiar with. All of these applications come with typographic support as indicated in brackets but they may not fit your expectations.</p>
      <p>It is important to keep in mind accessibility and by having clean MathML compliant mark up you should be fine. I am not as familiar with TeX output but would hope that accessibility would not be a problem.</p>
      <p>Murray Sargent's overview of <cite><a class="freelinking external" href="http://blogs.msdn.com/b/murrays/archive/2006/09/13/752206.aspx" rel="nofollow">High-Quality Editing and Display of Mathematical Text in Office 2007</a></cite> is a must read.</p>
