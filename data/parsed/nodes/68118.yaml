      <p>Riccardo — I'm not sure what the impetus would be for “inventing” a composed ellipsis for advanced typewriters. </p>
      <p>I quickly checked a few references for the Selectric series and I didn’t see any evidence that they went beyond ASCII in their character sets. Perhaps some other did.</p>
      <p>I think the only value of a pre-composed ellipsis comes when you have a computer making the line-break choices (and no way to tell it that three spaced full stops should not break). I believe that even the most advanced justifying typewriters still relied on human operators to make decisions about line breaks.</p>
