      <p>Harry — Welcome. I’ve just taken a look at your <a href="http://csswizardry.com/web-design+/">Web Design +</a> document. Lots of good stuff there. I have two typographic quibbles for you. </p>
      <p><strong>(1)</strong> In §10.1, you offer this about the Em: “a relative measure defined as <em>A unit of measurement used in typesetting, approximately the width of the letter ‘m’</em>.” This is an oft-repeated, but completely bogus definition. </p>
      <p>The value of an em has nothing to do with the width of the letter ‘m’. The traditional definition is “a relative measure equal to the point size of the type in question.” You might enjoy <a href="http://type101.fontbureau.com/archives/36">this essay on the Em</a> by type designer Cyrus Highsmith.</p>
      <p>You’ll be hard pressed to find a typeface with an ‘m’ that measure anywhere near an em. You’ll have slightly better luck finding an ‘M’ that is <em>approximately</em> an em in width. But that definition is still apocryphal.</p>
      <p>The rest of your section shows an adequate understanding of the em; it’s just this definition which is a pet peeve of mine. </p>
      <p><strong>(2)</strong> In §10.3 iii, you state “An ellipsis is commonly mistaken for three full-stops, when in actual fact it is a whole character unto itself.” This is not entirely true.</p>
      <p>While there may be very good reasons to advocate the use of the encoded composite ellipsis character, this argument is not in the same class as the others. Proper quotations marks are semantically different from primes. En &amp; em dashes have distinctly different roles from hyphens, et al. The same is not true, however, for the ellipsis vs. three full stops.</p>
      <p>Historically and traditionally, an ellipsis in text — that is, an omission or a sudden shift in thought&nbsp;—&nbsp;has been represented by three full stops. You will not find a metal sort that is three periods cast together. There is no place for such a sort in a type case. You will not find a keyboard position on a Linotype or Monotype machine for an ellipsis character. </p>
      <p>I can’t be absolutely certain about phototypesetting; but I’m pretty sure that the concept of a separate ellipsis glyph is recent and digital. It is not an editorial or grammatical development.</p>
      <p>As I say, there are very good reasons to use a non-breaking encoded ellipsis glyph in web pages. But the use of three full stops is not semantically incorrect.</p>
      <p>The [often poorly considered] design of the ellipsis glyph in digital fonts is a separate discussion. We’ve had lively debates about the ellipsis before. For instance, see <a href="http://typophile.com/node/42278" title="http://typophile.com/node/42278">http://typophile.com/node/42278</a>.</p>
      <p>Some will think me old-fashioned for clinging to some of these minor points, but you’re young and bright, and I thought you should be presented with this perspective.</p>
      <p>— K.</p>
