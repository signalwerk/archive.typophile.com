    <p>Hi,<br>
    My name is Harry Roberts, and I can't believe I've only just signed up here!</p>
    <p>I'm a 19 year old web developer from the UK. I'm also a type geek, and although I'm by no means a typographic designer, I have a massive interest in web typography.</p>
    <p>I own csswizardry.com and have authored several online and industry recognised documents, some of which you can find here: <a href="http://csswizardry.com/resources/" title="http://csswizardry.com/resources/">http://csswizardry.com/resources/</a></p>
    <p>I also Tweet (possibly too much) here: <a href="http://twitter.com/csswizardry" title="http://twitter.com/csswizardry">http://twitter.com/csswizardry</a></p>
    <p>All the best,<br>
    Harry</p>
