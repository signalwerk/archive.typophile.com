    html: |-
      <p>Totally agree with skyfein. Was about to say the same while searching for some alternatives. So I guess a manually slanted Meta (or <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/fontfont/ff_meta_correspondence_pro/" rel="nofollow">Meta Correspondence</a> to get such a /i, probably not enough bold though) with a custom /a would get you pretty close (if not matching).<br>
      Some alternatives: <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/fontfont/ff_unit_pro_collection/" rel="nofollow">FF Unit</a> (right /i but too much condensed), <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/signa-pro/" rel="nofollow">FF Signa</a> (Condensed), <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/akko/" rel="nofollow">Akko</a> (spurless /a), <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/neo-sans/" rel="nofollow">Neo Sans</a> (rounded), <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/max/" rel="nofollow">FF Max</a> (spurless /a), <a class="freelinking external" href="http://www.myfonts.com/fonts/parachute/pf-beau-sans-pro/" rel="nofollow">Beau Sans</a> (spurless /a, slightly rounded) and <a class="freelinking external" href="http://typecache.com/font-clusters/04/" rel="nofollow">a list of "spurless /a" fonts compiled by the amazing guys at Typecache</a></p>
