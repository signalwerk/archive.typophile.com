  html: '<p>{Got this today, thought it might be of interest -jb} <br> <br>Dear Sirs, <br> <br>I am writing this letter to make you aware of the development within the <br>area of digital typography for the web. Your average font and/or web <br>professional seems to be under the incorrect impression that web fonts, <br>such as Embedded OpenType and TrueDoc (eot and pfr fonts), are dead <br>technologies. People seem to associate web fonts with: slow rendering, slow <br>downloads, flickering, no print support, low quality, not cross platform, <br>promotes font piracy, no typography consistency, etc. <br> <br>I have taken it up on myself to educate people on this matter. These claims <br>might have been true at one point in time, and they may still be true for <br>some web font technologies. However, all claims are not true today, and <br>certainly not for all technologies.  So, if you give a damn about using <br>fonts on the web, then have a look at my white paper on this subject at: <br> <br><a href="http://www.em2-solutions.com/apps/fairy/webfonts.html" target="_top">http://www.em2-solutions.com/apps/fairy/webfonts.html</a> <br> <br> <br>Regards, <br>em2 Solutions <br>Michael Jansson</p>'
  html_clean: '<p>{Got this today, thought it might be of interest -jb} <br> <br>Dear Sirs, <br> <br>I am writing this letter to make you aware of the development within the <br>area of digital typography for the web. Your average font and/or web <br>professional seems to be under the incorrect impression that web fonts, <br>such as Embedded OpenType and TrueDoc (eot and pfr fonts), are dead <br>technologies. People seem to associate web fonts with: slow rendering, slow <br>downloads, flickering, no print support, low quality, not cross platform, <br>promotes font piracy, no typography consistency, etc. <br> <br>I have taken it up on myself to educate people on this matter. These claims <br>might have been true at one point in time, and they may still be true for <br>some web font technologies. However, all claims are not true today, and <br>certainly not for all technologies.  So, if you give a damn about using <br>fonts on the web, then have a look at my white paper on this subject at: <br> <br><a href="http://www.em2-solutions.com/apps/fairy/webfonts.html" target="_top">http://www.em2-solutions.com/apps/fairy/webfonts.html</a> <br> <br> <br>Regards, <br>em2 Solutions <br>Michael Jansson</p>'
