    html: |-
      <p>Basically you're getting tunnel vision about the distinguishing characteristics of your typeface. No typeface succeeds with only one salient feature; there are always multiple elements working together. Your lowercase k does fine without being shaped like an egg, so there is no reason to try to force your capital K into the shape of an egg. If you set "Hello", there is a reason the ells look much better than the H. Sometimes you have to give the recognizable features of a letter priority over those of the typeface. Use straight lines wherever they are appropriate, and you will find that in context they won't be as out of place as you expect.</p>
      <p>At the same time, you can seek commonly accepted alternatives that let you work in the signature shape without compromise: an A can be round on top; an E can be shaped like a C with a crossbar; M and N can take the forms of a giant m and n.</p>
