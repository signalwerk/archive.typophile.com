  html: |-
    <p>I am working on my first typeface and would like a bit of advice. I started with the lower case letters and am fairly happy unity of the set. I am having a bit of trouble, however, with the capital letters. Applying the curvy aesthetic of the lower case letters to the upper case is a stretch at times and it makes many of the letters look awkward.</p>
    <p>I am curious as to the process of some more experienced type designers. Do you start a design with both upper and lower case in mind?  What are some tricks you use to balance the two? </p>
    <p>Any general comments on the typeface would be greatly appreciated as well. Thanks!</p>
