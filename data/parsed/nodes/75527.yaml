    <p>Hey typophiles, I've got another logotype that near to completion. This one has been really difficult for me so I really need your guys eyes on this. </p>
    <p>I've been asked to create a logotype for a wool felt and leather iPhone, iPad, MacBook Sleeve accessory maker who also makes really nice leather bags. She has become very popular on Etsy and has created quite a name for herself, and thought it was time to get a custom mark. She was formerly an architect and applies her clean modern aesthetic to all her pieces. She asked me to create a custom logotype that would reflect her taste and design ethos. </p>
    <p>The brief included some very specific requests, namely: It must haves serifs, must have high ascenders, must use an ampersand and not a '+', it should pair nicely with neutraface, it should be inspired by midcentury modern architecture and design, it should be clean and not too feminine.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typophile_BirdBelle_01_6373.jpg"></div><p></p>
    <p>With this brief in mind I made a humanist (almost geometric) slab serif. Since she makes cases I wanted the ampersand to appear to be held between the 'd' and the 'b'. In the initial phase of this project she really fell in love with some sketches and the way i rendered the text with a pencil with lines to align the stem heights, tops and bottoms. It reminded her of architectal sketchs and the way she designs each of her products, so also attached is a roughed up version. Once I have the digital version refined to a t, i plan on redrawing it with a pencil to get the real deal.</p>
    <p>Looking for any areas where a line looks too fat or a curve looks to wavy. Thanks in advance.</p>
