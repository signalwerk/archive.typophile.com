    html: |-
      <p>1. The ampersand looks a tad large — perhaps set a separate 'cap-height' that it comes up to as opposed to ascender height as you have it now. </p>
      <p>2. The 'e' looks like it needs more modulation; its stroke width is a bit too uniform. This makes it look thicker than it should. Use the bowls on 'b' and 'd' as a guide to how much to thin the stroke.</p>
      <p>3. It might just be my taste, but I'm not convinced neutraface is the right face for the tagline. Something about it doesn't sit right with your custom lettering above.</p>
      <p>Nice work</p>
