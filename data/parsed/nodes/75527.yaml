    html: <p>Looks good. Normally, the serif on the top of the d should point towards the left. I think it will look better when you make the &amp; smaller. e seems a bit too wide. You might consider making 'HANDMADE MODERN' larger, so that it's still legible at small size. The gap in your e will probably disappear at smaller sizes, so I'd make it a bit larger, or at least test it. good luck.</p>
