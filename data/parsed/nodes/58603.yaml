      <p>Thanks you all for your input. The challenge for me is making the logo “feminine” without excluding the masculine completely (if that makes any sense).</p>
      <p>altaira–thanks for your comments regarding the “Filosifia” direction. I’ve had moments when I’ve found it’s classic look appropriate and others where I’ve question it completely. I think you put words to my negative gut feelings.</p>
      <p>Here’s some revisions based on your comments. I’m not satisfied with it the way the u and the p are disconnected but look as though they should be connected. As a purist, modifying it to allow them to connect is painful. Any suggestions on how to resolve that issue? Is it even an issue?</p>
      <p>I’m also showing another variation of the same logo just because I think it might also work. Once again, thanks for your time and suggestions.</p>
