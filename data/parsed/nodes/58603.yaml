    <p>Yup, I said it – Portable toilet logo. The name of the company is UPTOWN RESTROOMS and they specialize in clean, spacious and pleasantly smelling portable toilets for weddings and corporate events. The logo should appeal to women as the bathrooms are mostly for them (hey guys can go anywhere). I’m rebranding them and would love some feedback as I’ll be presenting the client in a couple of days. I’ve included 2 of my directions below. Thanks in advance.</p>
    <p>My key words for the project are…</p>
    <p>high-end<br>
    exclusive<br>
    clean<br>
    feminine</p>
    <p></p><div class="imageWrap"><img src="/files/UPTOWN-Bv01_3475.jpg"></div><br>
    <div class="imageWrap"><img src="/files/UPTOWN-Dv01_6384.jpg"></div><p></p>
