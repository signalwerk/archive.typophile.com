    html: |-
      <p>Woman here :)<br>
      My initial reaction was that the second one is trying too hard to be classy. And old-style: I personally always find it a bit humorous if establishments try to look like they’ve been around forever, use a font reminiscent of 2 centuries ago, &amp; even put the “since whenever” line in their logo – and then they’ve been around for what, 3 years? Seriously.</p>
      <p>That said, I think the first one has good potential. It looks a bit more unusual but pleasantly surprising/surprised, especially with that Baskervillian high “p” – so nicely matching a client’s reaction upon visiting/using a portable toilet that’s actually nice :-). “Fresh” is a good adjective.<br>
      Hell, you might even try a heavy sans for the TOWN part. Or maybe not.<br>
      Most of all, I’m not sure about the “restrooms” either. It’s too close to the “up” but not quite the same. I might try a wide-ish sans (think Gotham, or maybe something more classicist) in tracked-out all caps, not too large, not too heavy.</p>
