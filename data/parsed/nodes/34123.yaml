    <p>An introduction to myself -- so you can understand where I'm coming from.</p>
    <p>1) i'm a student (graphicDesign/photography)<br>
    2) have not taken very many design courses<br>
    3) eager/willing to learn</p>
    <p>So, here are the steps that I've taken -- mind you I have zero training in this department  :)</p>
    <p>1) sketches (hundreds).<br>
    2) photograph/scans.<br>
    3) streamline/illustrator vector.<br>
    4) import EPS -&gt; fontLab</p>
    <p>So here's where the problem comes up. I'm vectoring the letterForms perfectly fine in illustrator. However, upon importing into fontLab, I'm finding apparitions at the ends/tips of the curves. I do not have sample images at the moment ( im at work ), however, I'll post some later. </p>
    <p>Nevertheless -- some questions...</p>
    <p>1) am I following the accurate steps?<br>
    2) are theres any webSites that can describe to me how to draw a serif typeFace</p>
    <p>I apologize if this was a cumbersome post, and thanks for reading through. Also, thanks in advance to all who respond.</p>
    <p>c.</p>
