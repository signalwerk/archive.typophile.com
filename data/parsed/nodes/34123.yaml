      <p>Why is copying and pasting from Illustrator to FL considered less accurate? That's what I've been doing, and it seems to work fine.</p>
      <p>In FL I make a box from the baseline to the cap height line and I cut and paste it into Illustrator. In Illustrator I scale my alphabet so the caps match the height of the imported box. Once all the letters are scaled up I can cut and paste them into FL and they are all the same relative size.</p>
