    html: |-
      <p>The trouble with pasting Illustrator paths into Fontlab lies in Fontlab's strict use of coordinate points. In Illustrator, you can place a node and it's control handles anywhere and adjust them in very fine increments. In Fontlab, the nodes and handles can only lie on its grid system of unit coordinates. For instance, if your Fontlab file is using a 1000 UPM value, the nodes must sit somewhere on a grid based on one thousand units per em square. </p>
      <p>When you import or paste a path from Illustrator, Fontlab will nudge the nodes and control handles into positions that fit onto the grid, basically altering the shapes just a bit. If you're seeing changes in the fine details of your curves, maybe set your Fontlab file to a higher UPM value (the new Cleartype fonts use a 2048 value, for instance) and see if that translates the Illustrator paths with greater accuracy.</p>
