      <p>Yep, I've only just turned 15. I don't think I want to achieve a Garamond feel (I've never been good at setting a goal and sticking to it). I want to achiev the same comfortable reading experience as garamond. I'm pleased with the ascenders and descenders now. Furthermore, I also have to take the Sans into account. It's ascenders/descenders would look rediculously long with Garamonds' proportions. The c is a bit of a personal thing. I always find 'normal' c a bit distracting as it creates a large gap in the word. I'll review the width/thickness again though. That s is a little light indeed, though I wouldn't know what to do about it (spine is already quite thick) and Garamonds s is also quite light. However, this will, just like the y, also be reviewed. One of the most important lessons I've learned so far is to never deny critique without having tried.</p>
