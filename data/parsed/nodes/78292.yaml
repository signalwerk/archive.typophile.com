    <p>Hello everybody,</p>
    <p>Sensato SANS can be seen here: <a href="http://www.typophile.com/node/77453" title="http://www.typophile.com/node/77453">http://www.typophile.com/node/77453</a><br>
    and here (black): <a href="http://www.typophile.com/node/77840" title="http://www.typophile.com/node/77840">http://www.typophile.com/node/77840</a></p>
    <p>The aim of Sensato SERIF is to be very legible at small sizes and still interesting on larger sizes. It has influences from Garamond, Calluna and Centro Serif, resulting in a fun mix between old comfort and modern crispness. I'm quite pleased with how it works in text. So much, that I have adjusted the colour of the Sans to fit with this, instead of the other way around. ALL feedback is much appreciated. It's only lowercase for now. I hope to include Caps soon. Enjoy!</p>
    <p>Cheers, Jasper de Waard</p>
    <p>update 3: The whole design has been adjusted towards a more modern, clean look. More like Calluna or Centro Serif now. I think it's much better now, hope you agree.</p>
