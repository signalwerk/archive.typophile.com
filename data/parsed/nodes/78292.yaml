    html: |-
      <p>No doubt you have a good startpoint here. I see you did adopt these features:</p>
      <p>– ascenders and descenders much shorter than AG;<br>
      – x-height scaled-up;<br>
      – rounded terminals replaced by a smaller triangular shape;<br>
      – straight serifs;<br>
      – ink traps; and<br>
      – rounded corners.</p>
      <p>Your goal is to make the font more modern and as confortable as its reference. The question is: which elements would convert these adjectives into an articulate design?</p>
      <p>From the characteristics present, straight serifs help to give a more modern feel reducing the calligraphic influence. Ink traps help confort with sharper prints. Both work in the direction you aim.</p>
      <p>Rounded corners are very nice, but will not cause big effect at text sizes. No influence on your goal, although a relevant feature for display sizes.</p>
      <p>Your ascenders and descenders are quite short, especially after the x-height was increased. <em>Here</em> you have a problem regarding the confort issue. Reading experience would be more confortable and fluid with ascenders and descenders taller –not necessarily as much as AG, but surely bigger than this Sensato version.</p>
      <p>You may search Typophile for in-depth discussion about excessively high x-heights and book fonts. I remember Hrant has some very good analysis on this. I was initially skeptical about short ascenders and descenders to be a bad choice for book fonts, but became convinced after extensive tests with my own font project.</p>
      <p>Still about asc/desc, Sebastian said they seem weak. I agree and think this is because they are short and doesn't have proeminent terminals/serifs/diamonds. You can observe most contemporary fonts with short asc/desc use to have strong serifs and terminals (v.g. Swift, Fedra, Greta or Centro). A strong finish compensates the small height of the stems.</p>
      <p>Hence, my main suggestion is you to evaluate the basic proportion between x-height and asc/desc. To change this in a further stage would cause a huge amount of work.</p>
      <p>About terminals, I second Sebastian's opinion. You reduced their size and changed their shape. I think the problem is not with the shape, which appears in various glyphs in a consistent way. But they are lacking expression, what I believe can be solved with a bigger size. Note that a positive critique about this –or any other feature– relative to Sensato Sans may not be equally valid for the serif companion.</p>
      <p>I also agree the stem variations in |v|w|y| are abrupt. Top detail of q is very small. Stress points of o are thicker than other stress points (as |b|d|p|q| curves). There are small vector bumps in g (upper bowl, conection at bottom), d (top curve), f (rounded right corner in bar), p (bottom curve) and v (internal serifs).</p>
      <p>Hope some of this would be useful. Keep the good work!</p>
