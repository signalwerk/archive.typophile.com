    html: |-
      <p>Congrats! I really like the feel of the /y/! The /k/ is neat. I also like the Calluna-like serifs.<br>
      Small, rapid observations:<br>
      - the bowl of the lowercase /a/ seems a bit loose. I like it's form, but perhaps lifting its stress point a little up (the thick-region) would help.<br>
      - The form of the /s/ is <strong>s</strong>plendid, yet I think it is now too dark in comparison with the rest of the alphabet.<br>
      - Most important, I think, is to notice that the overall contrast of the characters is too high. Specially if you look at the /r/, /n/, etcetera, their high contrast is alike to other fonts ment specifically for display sizes, but yours is ment for setting text.<br>
      - I don't know if your /g/ shape is helpful in terms of legibility. It's loop stands out far to the right, making a "sharp" curve, which may look good, but will prevent you from kerning upright letters with serifs at the bottom (/l/, /h/, /n/,...) a bit tighter. For instance, look at the "gh". It's clear that there is a gap, but with the actual forms there aren't much things you could improve with just kerning...<br>
      - I also think the head serifs (/r/) are too heavy compared to the rest of the serifs. (Perhaps that impression vanishes solving my last observation).<br>
      - Finally, keep revising the flowing of the curves (ie. /a/) and think about consistency of terminals (/r/,/y/ || /a/,/c/,/f/)<br>
      Good work; keep retouching it!</p>
    html_clean: |-
