      <p>I like!</p>
      <p>A couple of observations:</p>
      <p>- the upper left diamond serif on letters like n and m is thinner than the stem. Is that on purpose?<br>
      - the thick strokes of v, w and y get really thin really fast. I see the idea, but it's a bit too strong for me.<br>
      - you increased the x-height -- a lot. This makes the face less formal, and allows for tighter lines, but right now I just feel that the ascenders are weak. Not more legible, just weak. Not too sure how to fix this one.<br>
      - in the PDF, the letters stand relatively wide apart. I guess you haven't really done spacing yet (can't blame ya!), but maybe this influences my first impression too.<br>
      - you castrated terminals everywhere, but haven't really turned them into anything yet. Everyone feels familiar with Garamond-ish fonts, and most people's eyes will stumble over those amputated pieces. If you're not a fan of the drops and tails, at least turn them into something more ... solid? Whatever you do, the stumps right now don't really work with the diamond serifs. </p>
      <p>This looks really friendly to me, and I really think this has potential! Keep us posted!</p>
