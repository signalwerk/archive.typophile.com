    html: "<p>It’s hard to use to almost-but-not-quite-similar designs well together. The differences tend to look like errors. Roma is modeled on the letterforms of capitalis monumentalis, as is Trajan. There is at least on sans serif take on these: Trajan Sans. It has no lowercase though.</p>"
