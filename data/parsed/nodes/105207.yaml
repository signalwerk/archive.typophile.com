    html: |-
      <p>Hey Frodo,</p>
      <p>Can't use the inline because as far as i can say it is made to use in combination with for example Roma solid,  The X-height off all the letters is more or less different (for example compare U and M), if i'm not mistaken therefore its only to be used as an "inline" specifically with other Roma variants. When i type a word with the inline version the word looks kind of wobbly and some letters appear to not sit on a baseline but kind of float in-between baseline and x-heigth.</p>
      <p>I'm not a type designer so do correct me if i'm completely wrong on this.</p>
      <p>I considered DTL Noble because i kind of had the idea they kind of would work...again not sure therefore i was asking for some suggestions from people whom are better at this and have loads more experience.</p>
