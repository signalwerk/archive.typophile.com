      <p>Tough problem indeed. I do think that in the case of the word “beautiful”, the “a” in the lower example works much better than the upper.<br>
      With “pistilli”, in a didone typeface I'm working on I increased the spacing between the letter pairs ll, lh, and lb by kerning them. I think that could be done here slightly, to keep a more even texture if you want.</p>
