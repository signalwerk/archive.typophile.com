    <p>Hello friends!<br>
    I'm writing because I feel I'm lost with my project.<br>
    I need your eyes here, because I'm tired of trying things and it seems this font has no solution.</p>
    <p>I want to make "the boldest" didone out there, so I started experimenting and this was my result.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/help_boldest_5629.png"></div><p></p>
    <p>The problem is that some letters (ie the "e" or the "v" etc) don't work in small sizes.<br>
    In the lowest part of the image I wrote "Mexico and Pistilli" So you can see what I mean.<br>
    Pistilli turns really black (and that's what I want) but Mexico has so many white space between letters that it drives me crazy.</p>
    <p>Is there something you suggest?<br>
    I tried making the stems of those "open" letters bolder, but it seems it's not the solution.</p>
    <p>Any referent?</p>
    <p>Thanks!<br>
    Max</p>
