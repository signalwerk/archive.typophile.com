      <p>fontplayer</p>
      <p>In some cases, typefaces from the metal years went through further transformations; photofilm, digital. And the licensing of these typefaces generated further income. Infringement could involve one in legal hassles.</p>
      <p>Here is a hypothetical case: a very well known and long-lived typeface from a very well known firm is suspected of being based on someone else's drawings. Since this face had been licensed and cross-licensed over the years, if someone could make the claim that the very well known typeface itself was an infringement of this previous design that they had legal rights to, and won an entitlement, they could very well seek compensation based on all moneys made over the years.</p>
      <p>Yes people do copy metal faces all the time, and sometimes they get a letter from a law firm. If rights had been established and there is a legal continuance of those rights, as in licensing, copying a metal face is as wrong, and potentially as dangerous, as copying a digital face.</p>
    html_clean: |-
