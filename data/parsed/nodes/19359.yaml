      <p><em>&gt; they sometimes have the right to say no</em></p>
      <p>Here is what I was trying to get at with the words "the right": In some contries, it is easier to patent the design of a typeface than it is in the US. If someone gets a 25 year design patent, and dies 20 years into it, I believe that the patent would pass on to his heirs for the remaining 5 years. In this time, you could not redigitize/release the said design without their consent.</p>
