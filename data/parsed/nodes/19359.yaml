      <p>&gt; <em>I suspect ol’ Aldo was trying to raise some quick cash on the side</em>.</p>
      <p>Sadly, that was the case with several revered type designers whose royalties from other foundries were meager to begin with. At CG, I worked with <a href="http://www.myfonts.com/search?search%5Btext%5D=tony+stan" target="new" rel="nofollow">Tony Stan</a> (Stanziola) on the release of his last type family, Pasquale, named after his father. Also, <a href="vincent pacella" target="new" rel="nofollow">Vincent Pacella</a> had been hopeful in developing a releasing some of his own designs through CG.<br>
      There were many type designers from around the world, both known and yet-to-be known that I had the pleasure of meeting. </p>
      <p>Also, a young <a href="http://www.myfonts.com/person/boge/garrett/" target="new" rel="nofollow">Garrett Boge</a> was knocking at the door in 1989. I still have his early sketches of <a href="http://www.myfonts.com/browse/person/boge/garrett/" target="new" rel="nofollow">Visage, Spring, and Florens</a>.</p>
