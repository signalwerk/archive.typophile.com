      <p>&gt; <em>So, it is always polite to ask first before you digitize, presuming that there is someone to ask.</em></p>
      <p>Agreed, but without opening another can of worms, there have been those who claimed "rights" in the past who have denied revivals strictly based on "type politics".</p>
      <p>One of the only type families that I personally wanted to revive (strictly out of affection) is <a href="http://www.neufville.com/FontData/FONTS_AZ.htm#H" target="new" rel="nofollow">Hispalis</a> originally from Fundición Tipográfica Nacional, with rights held by Neufville. A visit to Barcelona in the eighties got me nowhere (my primary objective was to license Schneidler).</p>
      <p>Somehow it's still on Neufville Digital's list of "to do" digitizations, yet RoosterTypes has a somewhat sterilized revival version called <a href="http://www.roostertypes.com/view_fullfont.asp?catalogid=1402&amp;total=4" target="new" rel="nofollow">Schiller Antiqua</a> by Steve Jackaman.</p>
      <p>What I loved about the metal design was the eccentric "irregularities" which are often the first things to go when standardizing for digital. </p>
      <p>I know... sour grapes! :-\</p>
