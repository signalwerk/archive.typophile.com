      <p>Both books were equally fascinating, and moving at times. Garamond was the big McCullough bio of Harry Truman. Calson was the same writer's bio of John Adams. Both verged a bit too much toward hagiography, but that's always a danger of biography.</p>
      <p>Caslon types have never pleased me very much. They all seem a bit spiky and sparkly, lacking in the dark color that started this here discussion. I rarely specify a book to be set in any form of Caslon. I know that a participant here is at work on a Caslon; I shall attempt to bring an open mind when I can see it.</p>
      <p>I know I'm not "supposed" to like ITC Garamond. Being the serious typographer (ahem) that I am. But it posed no reading problems. Even the few instances of faked small caps did not pester me. Nor the lining figs.</p>
      <p>powers</p>
