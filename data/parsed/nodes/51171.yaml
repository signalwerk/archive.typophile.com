      <p>Indeed. Technology and quality of typefaces have improved immensely, certainly since Gutenberg. The possibilities now are almost endless when it comes to producing good typefaces to a variety of needs and demands. I even like the still existing practice of designing optical sizes and the quality has improved in that field as well.<br>
      You could argue about the actual *need* for all this improvement when you think about the world getting more and more digital and the *value* for the craftsmanship and the amount of work put into certain typefaces getting lower by the year.<br>
      Not to mention that print quality has improved quite a bit since then, and it's really more the extreme ends of point sizes that need addressing when it comes to optical sizes.</p>
      <p>All this must effect the type of education students get in schools when it comes to typography. Plus, students are not entirely clueless, they see what's going on around them, the vast majority of things to look up to and inspire by are digital or in some digital form or other.. so how do we suppose they'll be interested in this rather old-fashioned practice in legibility and optical sizes and even good typography. Let alone appreciate the (price) value of it.</p>
      <p>There are several magazines and publications out there that seem to benefit from this available practice in type-design and use it quite well in most parts (look at the recent redesign of Interview, or T. Thy both have an art-direction that is typography-aware. But is it really from "Need" or "Necessity", or rather the Classical or Sentimental quality they are after. </p>
      <p>I hate to use the word Novelty in this context, but I can't help but thinking this is more what's on the minds of the designer/art director these days, or the aspiring designers/art directors out there.</p>
