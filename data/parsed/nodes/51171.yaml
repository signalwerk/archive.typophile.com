      <p>Nick, on timelessness, I wrote that the goal is a *sense* of timeless rightness. I am well aware that because of the continual changes in technology, in order to *look* timeless, you have to keep changing. The effort to get digital revivals to actually look 'Classic' is the latest effort in a long standing one, as you say. One of the things I have done, reducing contrast, is part of the more recent efforts in revivals. I'm well aware that revivals of classics are of their time. Adobe Caslon, Founders Caslon are, and would be done differently today. I'm sure a late 19th century performance of Beethoven sounded a lot different than a late 20th century one.   </p>
      <p>I don't know how original I've claimed to be, but I have claimed to specific things differently. A lot relate to readability, which you don't believe in, so I'll write about that elsewhere. </p>
      <p>The example you give of Cloister I'm pretty sure is big. The point about a lot of earlier digital revivals is that they were based on larger sizes, where the ink spread makes less of a difference. One of the key things about doing classics right, in my view, is to reduce contrast in the 10-12 point area, not just in the 8 point and below range, which is where ATF did it. And Slimbach also tends to have pretty high contrast in the regular range. ATF was letter press, and the 'stroke' that ink spread adds was a kind of automatic optical sizing, in my view. So where I differ with Twombly and Simbach is that I've designed a regular size with lower contrast. However, it's not that simple, because actually my joins are pretty narrow. The look is influenced by the way the weight changes through the arches. </p>
      <p>All the things I have done on this are only subtly different, but they add up to a different look. One of the things I am proudest of is that I think you can recognize Williams Caslon on the page from its texture, without looking at details. The differences are small but systematic, so they add up to a different "look". The other thing I am pleased with is that it doesn't look like anything else, like something that came out of Reading or KABK or Adobe. </p>
      <p>I do reject the retro label. I don't have a problem with retro, but this is not an exercise in nostalgia, and would be disappointed if that is the reaction. I hope readers will just see a comfortable, welcoming and highly readable font, not one that says "18th century" or "old fashioned." Well, ok some of the swashes may look old timey, but they're not the heart of the font, and you can use them or not for a special effect.</p>
