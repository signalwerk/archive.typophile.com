      <p>Every book face ever released by Font Bureau.</p>
      <p><a href="http://www.myfonts.com/fonts/adobe/itc-giovanni/">ITC Giovanni</a>. I know some people write Giovanni off as anachronistic or immature in comparison to Slimbach’s other work but it holds up beautifully on cheap paper and reads like a dream under bad lighting. </p>
      <p><a href="http://typography.com/fonts/font_overview.php?productLineID=100026">Whitney Book</a> is an incredible sans for text.<br><a href="http://www.stonetypefoundry.com/">Magma</a> would make a fabulous book face given the right subject.</p>
      <p>Are there any contemporary Didones designed with books in mind? I’ve seen Monotype Didot look great in books, but can’t think of any others.</p>
