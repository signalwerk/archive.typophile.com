      <p>About halfway down, the book page that shows a Victorian-era woman is from "A Gift of Light," a study of 19th-c photography (I designed that book for the University of Notre Dame Press in 2002). </p>
      <p>It was printed on a dull coated sheet, and Clifford really works well. It has great body weight for text, captions, and backmatter. It is very easy to read.</p>
      <p>The book may be hard to find. Libraries with extensive library holdings in photography may have it. But I have heard that it did not sell well, and that the publisher pulped the remaining copies (without asking if I wanted to buy some!)</p>
      <p>Clifford and Miller are pretty much my "house faces" these days.</p>
