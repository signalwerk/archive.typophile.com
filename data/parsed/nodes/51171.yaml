      <p>Zach, when we talk about a darker face for book, it's more in it's contrast and proportions. A medium weight like the Garamond you mention can work very well for books, since it has enough contrast to hold well on rougher paper.<br>
      However, most of the times at the book publishers we chose not to use the Adobe Garamond cause it was simply to "beautiful" for book text and too perfectly cut that somehow made it more of a display face or for larger sizes.</p>
      <p>The best would be to print some text with several fonts you want to check out on the actual type of paper you plan to print your books on, many book printers have already made samples, or can do it for you if you plan a long relationship with them. That would be the most ideal test.</p>
      <p>About the Bembo, ALL the Bembo's are too light!! (well almost all except some rare cuts you won't be able to find anywhere). I don't understand why they still keep using it for books. I was once asked to design a 6pt. Bembo to meet with the Publisher's demand for small sizes, to match reproductions of Older publications.</p>
      <p>One thing I learned is the the Publisher's world is quite conservative and many have their own specific punctuation rules and demands from a book-typeface, that it's really hard to get in there - any typeface that doesn't fit those rules get's ignored. It almost demands custom typefaces for each publisher.. phew :)</p>
