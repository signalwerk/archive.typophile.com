      <p>And for those who do know better, the idea of "matching" is simplistic. </p>
      <p>If you exactly mimic the look of an earlier era it will generally look antiquarian. If that's what you want, fine, but it won't carry the same meaning as it did in the era in which it was originally printed, for the printing then looked "normal." In other words, true "matching" is, ironically, not authentic to the original feel, but adds a message of antiquity or nostalgia. </p>
      <p>So the "dialectic" you rightly speak of should start with a recognition that mimicking is as a rule a poor idea. It is mimicking that requires a special reason, and not the use of a type that today looks "normal." And if you choose not to mimic, then a wide range of possibilities opens up, many of which may be good ones. </p>
      <p>Historical association is one factor, but I think it is generally best attenuated. If I remember rightly the Penguin Complete Shakespeare is in Plantin. But it isn't the original look of the first printing of Shakespeare, but of the 20th century revival, which looks "classic" and 20th century, when it was published. So the historical association is rightly attenuated by quite a bit.</p>
