      <p><em>...lots of 19th century books (including many of the original editions I've been working from) were printed in Caslon.</em></p>
      <p>That's unlikely. In the first half of the century the style of text type was modern (didone). Mid century, some rough old Caslon type, with long "s", was used for a few historical pastiches. In the second half, a genre of modernized "old style" emerged, but it wasn't named Caslon and was a far cry from what we would recognize as Caslon today, although there are some latter day Caslons (e.g. 471) which are based on it, erroneously.  </p>
      <p>James Mosley:<br>
      <a href="http://typefoundry.blogspot.com/2009/01/recasting-caslon-old-face.html" title="http://typefoundry.blogspot.com/2009/01/recasting-caslon-old-face.html">http://typefoundry.blogspot.com/2009/01/recasting-caslon-old-face.html</a></p>
