      <p>Nick, your analogy between costume in a play or movie and a typeface is interesting, but also I think brings out the differences. Costumes don't "disappear" as you see the play or movie to the extent that text typefaces do as you read the book. </p>
      <p>I believe Barnes and Noble has published a bunch of paperback "Classics", popular out-of-copyright books, and I will have to check, but I believe they have rather similar formats and fonts. I really don't think that is sloppy and self-indulgent. It may be that they put a priority on the look of the overall series, and frankly I don't think it would interfere with the reader's enjoyment, provided they are well set otherwise. </p>
      <p>I'm not saying that historical allusion is bad, but I just think you are overdoing its importance, when there are other priorities.</p>
