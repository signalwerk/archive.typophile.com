      <p><em>...that a re-publication of a text has to be in the same type as the era in which it was written is I think a questionable notion—and in any case not a generally accepted one. </em></p>
      <p>This is certainly true for those who don't know any better.<br>
      As long as a type looks suitably old to the reader it will do.<br>
      However, for those who are aware of the vintage of both text and type, there is a dialectic present, which one would hope has been considered by the typographer, because it effects the meaning of the work.</p>
      <p>I wouldn't say that type has to match the era of the text, but if it doesn't, there should be a significant reason, not just "close enough".</p>
