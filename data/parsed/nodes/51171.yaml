      <p>Nick, your characterization is off the mark. </p>
      <p>My aim in this revival was to create a look that is "contemporary classic," something with a timeless quality, rather than a design redolent of the era in which it was first created. I didn't want an "antique" or "retro" look. So my approach has been to adopt some features of the original look, which I think deserve reviving, while consciously rejecting others. Your account only notes the first, not the second.</p>
      <p>To put it another way, my general approach to revival has been more like that of Matthew Carter's Miller, not that of Justin Howe's Founder's Caslon.  </p>
      <p>I was indeed inspired by the look of printed letter press, and have aimed to have my font, when printed by contemporary offset and direct-to-plate methods, possess some of the virtues of the letter press versions. However, I consciously rejected the 18th century look of clumpy inks and large ink spread due to printing on damp paper. My inspiration was the look of the ink and ink spread involved in early 20th century printing. </p>
      <p>I also deliberately changed the look of 20th century metal type, as well. I did round external corners, as with letter press ink spread. However, I kept joins of branches sharp and unbracketed, contrary to the effect of letter press ink spread. Williams Caslon Text is more crisp internally, and in this feature, together with others, is a 21st century digital design, and not an 18th, 19th, or 20th century one.</p>
      <p>The outlines, particularly of the lower case, do have a hand-modeled look. This modeling is designed to increase readability, and to achieve a welcoming, humanist aesthetic. It does not mimic the artifacts of Caslon's 18th-century punch cutting. I have seen the drawings of Mergenthaler Linotype Caslon Old Face, at the Printing Museum in Andover, which are based on blow-ups of metal type. These old Linotype drawings do indeed attempt to reproduce the irregularities of hand punch cutting. My outlines don't have this goal, and don't have these artifacts.</p>
    html_clean: |-
