      <p>&gt;Why is this redundancy a requirement for sustained reading?</p>
      <p>That's a really good question. My take on it is that different aspects have different advantages. </p>
      <p>Serifs have four advantages:<br>
      1. Help the eye hold the line.<br>
      2. Make the ends of strokes easier to detect. Tests have shown that the extremes in a glyph are more salient for reading.<br>
      3. I think serifs also help to get even color while having wide enough spacing to relieve crowding.<br>
      4. They also probably contribute to a distinctive "word image" better than sans. For example, a "b" and "d" are more different in a serif than a sans.  </p>
      <p>Some variations in design help evenness of color--for example, making the end of the r heavier than the end of the s. </p>
      <p>Some variations help break up the "picket fence"--the tendency of too much vertical emphasis and a dazzle, which is always threatening in roman type, and is bad for text.</p>
