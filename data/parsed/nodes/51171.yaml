      <p>The outlines, particularly of the lower case, do have a hand-modeled look. This modeling is designed to increase readability, and to achieve a welcoming, humanist aesthetic. It does not mimic the artifacts of Caslon's 18th-century punch cutting. I have seen the drawings of Mergenthaler Linotype Caslon Old Face, at the Printing Museum in Andover, which are based on blow-ups of metal type. These old Linotype drawings do indeed attempt to reproduce the irregularities of hand punch cutting. My outlines don't have this goal, and don't have these artifacts.</p>
