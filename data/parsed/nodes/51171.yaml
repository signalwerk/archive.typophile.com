      <p>How can something that it is clearly recognizably as a "Caslon" revival be anything but a retro design?!<br>
      Despite being revised at various times subsequently, the Caslon we all know and love remains an 18th century look.<br>
      "Caslon", the collective archetype, is an 18th century typeface.<br>
      Furthermore, the "modeling" you have employed, for purposes of readability, is strongly informed by the look of letterpress, which again gives the face a retro, antique look, as if the ductus, contrast, and serif shapes of Caslon were not cue enough.</p>
      <p>@William: <em>However, contrary to what you say, I consciously rejected the 18th century look of clumpy inks and large ink spread due to printing on damp paper. </em></p>
      <p>I didn't comment on your rationale (and it should be noted that effects are not always as intended).<br>
      I said that your face "parses the uncoated-stock press gain of 18th century printing", and could have added "and earlier".<br>
      I suspect this is because you've followed the twentieth century manner of representing the appearance of old styles.<br>
      In revivals of later faces, such as didones, the tendency was generally to remove the trace of process and emphasize their simple geometry. For instance, the myth of the geometric Bodoni was long dominant, until ITC Bodoni in 1994 represented the letterpressed image.</p>
      <p><em>I also, though, deliberately changed the 20th century metal look as well.</em></p>
      <p>The style of rounded external corners and sharp bracket joins, which you adopted as a representation of the letterpress process, has been in use since early in the 20th century, so you didn't change anything. As I mentioned, Goudy originated it. Benton used it in Cloister, his Jenson, in 1920. Digital fonts such as Bitstream Baskerville, and Monotype Bulmer, to name two digital 18th century revivals from the late 20th century, feature it. Your Caslon is similar to Adobe Caslon in its style of finish, although the proportions are different. Filosofia went further in playing round outside corners against sharp inside corners -- your foot serifs are slightly bracketed.</p>
      <p><em>I did not attempt to ape the artifacts of metal punch cutting.</em></p>
      <p>Again, I made no comment on your motives. I pointed out that the irregularity, or "modeling" as you say, of your drawing (e.g. serifs are not uniformly copied and pasted, with that on the right of "n" being wider than that on the left) suggests the irregularity of punch cutting. And although your drawing does not reproduce specific gnarly artefacts, as Justin Howe's did, irregularities such as the beak of "r" that is slightly larger than the corresponding triangle in other letters (this detail is same-sized in many other Caslons) suggest an artefact of letterpress printing pressure, although that was not your intention.</p>
