      <p>In recent years, Robert Slimbach has been more concerned about ensuring the text weights are heavy enough. Actually, it's always been an important topic, but I think fashion has drifted in that direction lately.</p>
      <p>Unfortunately, we also don't proof with an imagesetter as much as we used to. When I got to Adobe, the type group had its own imagesetter down the hall, and we would crank out pages and pages of proofs to ensure that the weights of the text sizes were reasonable. Some time ago, we moved from one floor to another and lost the old imagesetter, and Adobe didn't want to keep chugging through the chemicals used for processing, so now we only get to proof that way once or twice during development. As everyone knows, laser printer proofs require some mental adjustments (but if anyone is good at understanding that, it's Robert).</p>
      <p>It was nice in the MM era, when one could just tweak the weight axis and have whatever they liked. Of course, now, we still develop MMs and generate instances, but the end user doesn't get to choose. Recent Slimbach faces have offered good options though, I think. The medium weight of Garamond Premier was created specifically to offer something for more substantial text settings. (The text in the Garamond Premier Pro specimen book is set in the medium weight.)</p>
    html_clean: |-
      <p>In recent years, Robert Slimbach has been more concerned about ensuring the text weights are heavy enough. Actually, it's always been an important topic, but I think fashion has drifted in that direction lately.</p>
      <p>Unfortunately, we also don't proof with an imagesetter as much as we used to. When I got to Adobe, the type group had its own imagesetter down the hall, and we would crank out pages and pages of proofs to ensure that the weights of the text sizes were reasonable. Some time ago, we moved from one floor to another and lost the old imagesetter, and Adobe didn't want to keep chugging through the chemicals used for processing, so now we only get to proof that way once or twice during development. As everyone knows, laser printer proofs require some mental adjustments (but if anyone is good at understanding that, it's Robert).</p>
      <p>It was nice in the MM era, when one could just tweak the weight axis and have whatever they liked. Of course, now, we still develop MMs and generate instances, but the end user doesn't get to choose. Recent Slimbach faces have offered good options though, I think. The medium weight of Garamond Premier was created specifically to offer something for more substantial text settings. (The text in the Garamond Premier Pro specimen book is set in the medium weight.)</p>
