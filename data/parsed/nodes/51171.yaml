      <p>Nick, the Old Style from Johnson was indeed the electroplated Caslon. Mac McGrew explains that while it was Caslon, "Johnson simply called the face Old Style, as family names were a later development." But it is, in fact Caslon, and not a font derived from the Miller and Richard Old Style Antique designed by Alexander Phemister in around 1860. </p>
      <p>And hence, Caslon 471 is indeed based on the originals, but I think recut, and not the same.</p>
      <p>By the way, that also shows you that the matrices from the Electroplated Caslon were around in the US since the 1860s. As I said, how often they were used, I don't know. </p>
      <p>The real Caslon craze it seems only started in the 1890s, according McGrew. </p>
      <p>We've disagreed before about to what extent the Phemister Old Style face resembles Caslon—where I'm also not in full agreement with Mosley——so I'll just let that lay.</p>
