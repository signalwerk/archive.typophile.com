      <p><em>Nick, there is a difference between "retro", which appeals to nostalgia, and "classic", which appeals to a sense of timeless rightness. You don't acknowledge the reality of this category, but most of the rest of the world does.</em></p>
      <p>I do, and I would say that any Caslon revival is both classic and retro, but I fail to see how something that is timeless can be a 21st century typeface. You can't have it both ways, Bill!</p>
      <p><em>The phase of digital "new classics" with optical sizes and lower contrast is phenomenon of the past 10 or 15 years, </em></p>
      <p>I disagree that it is a recent digital phenomenon, there is nothing particularly new in the process of updating the classics, it goes on all the time. The process of designing weightier serifed text faces, to compensate for the attenuation of the high-res digital-to-offset process, has been going on since the start of digital, and applies to both new and classic serifed faces. Yes, there have been more and more optically-enabled faces since 1995, but Adobe Garamond, FB Eldorado and H&amp;FJ Didot were earlier. </p>
      <p><em>When you say that Goudy already did what I did, you are simply failing to understand the issue. Goudy did letter press, and letter press just had to live with ink spread. <em></em></em></p>
      <p>I have explained this before: the resolution of letterpress in Goudy's era was much higher than in the historic era (pre-didone). He was doing large drawings, not punchcutting at that time (his early career). Therefore he was able to produce letterforms which pastiched the vagaries of earlier, rougher printing. Look in<em> Goudy's Type Designs</em> where he described his problems with the technicians at Linotype who wanted to "clean up" his Garamond (e.g. straighten the slant on the vertical stem of "a"), because "they had always done it that way".</p>
      <p><em>This means molding type in a different way, and new decisions on how to do it.</em></p>
      <p>If I am being dismissive, it is not of your excellent typeface, but of claims that you are making for its originality which are exaggerated. Do you really believe that type designers for the past 100 years have not "molded" and "modeled" their drawing of type -- especially in the oldstyle genre -- to both suggest and anticipate the effect of press gain? How does your drawing differ in stylization from that of Bitstream Baskerville or Monotype Bulmer?</p>
      <p>Here is Cloister, scanned from a 1920s magazine ad: note the heft, the molded roundedness of the serifs, and the sharpness of the internal joints.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Jaffee2_4707.png"></div><p></p>
