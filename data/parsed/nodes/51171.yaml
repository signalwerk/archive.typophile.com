      And its narrowness makes its large x-height effectively smaller.</p>
      <p>&gt; This statement of yours above:<br>
      &gt; “Do note that Iowan has a hefty x-height,<br>
      &gt; so it’s not suitable for “book” setting.”<br>
      &gt; is pretty broad. Would you say a bit more?</p>
      <p>Maybe you're right, but my quotes around "book" above hopefully save me from having to retract. :-) I was referring to sizes ideal for reading a long book, as opposed to a publication where other factors (such as economy) take higher precedence. And it's for this reason that "Book" cuts of fonts typically have a smaller x-height* (and lighter color, and tighter spacing). For smaller text (and books that for whatever reason need to be set with small text) Iowan is just fine.</p>
      <p>* This is because, as you might agree, extenders<br>
      need to be leveraged more in immersive reading.</p>
      <p>&gt; I do find the short extenders a problem</p>
      <p>Indeed.<br>
      Just try to read one of the unfortunately<br>
      numerous books set in ITC Garamond.</p>
      <p>--<br>
      All this leads to a question I've asked myself (and others, actually :-) concerning the relationship of vertical proportions and authenticity: don't you guys think that a large x-height is anathema to certain styles, like Venetian and Garamond? It's interesting to note here that Mandel believed that a font can't really be French unless it has a small x-height.</p>
      <p>hhp</p>
