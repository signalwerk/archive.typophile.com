    <p>John D. Berry, in <a class="freelinking external" href="http://www.creativepro.com/article/dot-font-a-new-face-for-small-text" rel="nofollow">an article on MVB Verdigris</a>, writes: </p>
    <p><cite>Too many digital "book" faces don't hold up at the sizes we commonly use for text these days. Many of them are revivals of older, metal typefaces, but are based on a model size that's much larger (12pt or 14pt) than the size at which they'll actually get used. The result is fine, light, wispy text type, instead of the solid, easily-read black type of classical book printing.</cite></p>
    <p>Similarly, we hear a lot of complaints about too many light anemic-looking typefaces being used in books.  Would it help to come up with an introductory list that people can refer to see what their options are to overcome this problem?</p>
    <p>1. MVB Verdigris<br>
    2. ?<br>
    3. ?</p>
    <p>Rahim</p>
