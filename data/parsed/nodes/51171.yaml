      <p>I’m glad this topic has been running for so long (it started about a year and a half ago!). I agree with Nick Shinn’s comment from back near the beginning: you can’t force people to do good design. Some good digital book faces have been around for about 15 years, but most designers don’t realize that it’s important to use (and pay for!) them. Some of my students recently produced a newspaper using ITC Fenice for all the text (without asking me first). It’s dreadful, spidery and impossible to read more than a few sentences without getting a headache.<br>
      I remember a conference in (I think) New York City at the end of the 1980s. Monotype put it on and there was discussion involving me, David Berlow, and a few others about optical sizes for digital type. We were just starting to get small caps and oldstyle figures in PostScript type back then. I had experimented with adding stroke weight (dipping in “digital chocolate”) with a few faces, with varying (mostly bad) results. I'm so glad that type is now better than it has ever been since Gutenberg.</p>
