      <p>Nick, let me try again on costumes vs type. </p>
      <p>I don't think reading the novel or play in Times New Roman vs Baskerville is going to make you think that differently about the characters in Huckleberry Finn or Hamlet. But a great film that has costumes and the look of an actor may make you think about these stories differently. I just think the influence of text type is less specific, less attached to the content of the story. It sets a mood rather than gives a specific historical reference. It is a step further removed from the content of the experience.</p>
      <p>I think the mood is more important than an historical connection. So, for example, I like Zach's idea of using Walbaum for Dracula, because it is a little unusual looking and stylish, so it might add to the general creepiness of the story. That Dracula was, in 1897, originally set in an Old Style (I checked on Google Books) I don't think is as important as the mood.   </p>
      <p>The historical reference you can do more with display type, and I'm not against it. I agree with you that historical setting should be considered, but I have the feeling that I would put it lower in priority and you do, and I also think there's a danger of looking antiquarian, which will may work against the mood, in spite of being historically more accurate.</p>
