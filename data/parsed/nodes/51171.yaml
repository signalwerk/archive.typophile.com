    html: |-
      <p>All of the Font Bureau Retail fonts are now available in OpenType format. *However,* note that these are what FB is calling "simple" OpenType fonts -- which basically means that they're just a straightforward format conversion, with minimal OTL features, kinda like Adobe's "Std" OT fonts. </p>
      <p>FB's sOT fonts provide the basic OT advantages of being single, cross-platform files with Unicode encoding (although the hacked ligatures, et al., are also still in their original positions for backward compatibility, and then duplicated with proper OT names). </p>
      <p>In addition, there are a few basic OTL features, the most important being {liga} which allows all the double-f ligatures to substitute automatically now. The three basic fractions have been written into a {frac} substitution; the three basic superiors are in a {sups} substitution; and the two basic ordinals are in a {ordn} substitution.</p>
      <p>But, for instance, no attempt has been made yet to integrate SC fonts with their Romans. That will have to wait for the development of ProOT fonts. AFAIK, the FB ProOT standard is still being finalized. I would imagine that Miller would be high on the list of FB fonts for re-development, but I have no specific knowledge.</p>
      <p>BTW, simple OT fonts are the same price point as the other formats. And I believe that if you already have a license for FB fonts in PS or TT format, you can get the equivalent sOT by request. But don't quote me on that. You'd have to contact the FB office directly.</p>
      <p>-- Kent.</p>
