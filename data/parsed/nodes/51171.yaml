      <p>Matching is not mimicking, which is besides impossible unless one prints letterpress.</p>
      <p>I'm talking about historically sensitive type choices that express something of the aesthetic of an age, apart from considerations of newness or antiquity.</p>
      <p>What is the relationship between the shape of a sentence and the shape of a type?</p>
      <p>I would like to believe there is some kind of ecological synergy, that writers have some inkling of the appearance of their text in the publications of their day, and write accordingly. Cultural works do not exist in isolation from time and place, but are expressions of them. If today we are interested in the past at all, and want to feel and understand it, surely inserting a filter of anachronism between text and reader is no help.</p>
      <p>This is why historical theatre and film is generally performed in period costume. Typographers should pay attention to that, wise up, and stop being so sloppy and self-indulgent.</p>
