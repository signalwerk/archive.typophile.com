      <p>When we were asked to update the classic Swedish typeface <em>Berling</em> by Karl-Erik Forsberg we made thorough investigations and found boxes of unused Berling type in metal at a printing museum in the south of Sweden. From these we made trial prints in 8 pt and it's from these the new <a href="http://www.linotype.com/116522/berlingnova-family.html#" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Berling Nova</a> was based. It turned out much darker and not as edgy as previous digital (and photo setting) versions (we saved that for the <a href="http://www.linotype.com/116524/berlingnovadisplayregular-font.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">display</a> version). I'm rather happy with the result.</p>
