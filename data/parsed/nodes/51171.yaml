      <p>Great topic, Rahim. Book designers really need to cast their net wider. Despite the hundreds of excellent text faces designed specifically for today's workflow and presses, the old metal stuff, often poorly digitized, is still being used. Here are some of my favorite digital typefaces designed specifically for long-running text:</p>
      <p><a href="http://www.felicianotypefoundry.com/main/?page_id=22">Rongel</a><br><a href="http://www.teff.nl/fonts/renard/index.html">Renard</a><br><a href="http://fontfeed.com/archives/akira-kobayashi-on-ff-clifford/">FF Clifford</a><br><a href="http://www.felicianotypefoundry.com/main/?page_id=13">Merlo</a><br><a href="http://www.fontshop.com/fonts/downloads/bitstream/iowan_old_style_osf_ot/">Iowan Oldstyle</a><br><a href="http://www.fontshop.com/fonts/downloads/garagefonts/freight_text/">Freight Text</a><br><a href="http://typography.com/fonts/font_overview.php?productLineID=100017">Mercury Text</a><br><a href="http://typography.com/fonts/font_overview.php?productLineID=100032">Chronicle Text</a><br><a href="http://www.fontshop.com/fonts/downloads/itc/itc_mendoza_roman_std_complete_vp/">ITC Mendoza</a><br><a href="http://www.houseind.com/index.php?page=showfont&amp;id=171">Paperback</a></p>
      <p>And there's no reason to remain married to ye olde oldstyle serifs. Contemporary slabbish and semi-serif designs are just as effective for book text:</p>
      <p><a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_tisa_pro/">FF Tisa</a><br><a href="http://www.fontshop.com/fonts/downloads/ourtype/versa_professional_ot/">Versa</a><br><a href="http://metaserif.com/">FF Meta Serif</a></p>
