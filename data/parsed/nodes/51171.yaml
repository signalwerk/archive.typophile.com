      <p>Reviving this old thread, with a new(?) question:</p>
      <p>Is it generally a bad idea to use a darker-than-regular weight of face for book use? </p>
      <p>I ask because I'm selecting a house face for a small startup publishing imprint, and I keep coming back to this thread, as I'm looking for something on the dark side. One option I'm drawn to is <a href="http://www.fontshop.com/fonts/singles/creative_alliance/garamond_premier_pro_medium/" rel="nofollow">Garamond Premier Pro Medium</a> – the regular weight seems too light. But maybe the medium would look too heavy in such an extended setting? It's hard for me to tell without seeing an extended specimen. Perhaps someone here has experience in this area.</p>
      <p>While I'm commenting, I'll agree with Stephen that <a href="http://www.fontshop.com/fonts/singles/monotype/bembo_book_pro_roman/" rel="nofollow">Bembo Book</a> looks really nice. I'm also considering Feliciano's Merlo and Rongel, which have just the kind of darkness I want, but the open-bowl P's are holding me back so far...</p>
