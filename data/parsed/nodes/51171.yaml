      <p>Nick, as the Mosley article makes clear, copies of a fairly original Caslon were available in the US beginning in the 1850s. I don't know how widely they were used. </p>
      <p>Although "Old Style" is significantly different from Caslon itself, it does indeed adapt some of Caslon's look, so that Caslon itself is not too alien to a 19th century look.</p>
      <p>According Mac McGrew, Caslon itself became very popular in the US when Vogue magazine adopted it in 1892. Also according to him, Caslon 471 is not based on Old Style, as you say, but on Caslon itself, in the version from the electroplated version available in the US from the 1850s on. ATF acquired this as part of the consolidation of foundries at the end of the 19th century. </p>
      <p>I don't know how much 471 and the later 540, with reduced descenders, were recut from the electroplated version, but I am guessing that ATF redid it and regularized it with the Pantographic punch cutter. The digital 540 is based on the larger sizes of Caslon, not the smaller sizes, which is why it works well as a display face, but not a text face.</p>
