      <p>To Nick's question:</p>
      <p>There are people in this discussion who have studied far more thoroughly than I the sciences of making typefaces and of reading them. So I'm going to go out a limb and see what you all make of a few ideas; there'll probably be some words that are "non-tech," but I'll try to make the point.</p>
      <p>One: Perhaps the "busy" and the redundancy Nick spoke of are essential to what so many of us want in book faces because they break up the uniformity of letter shapes and thus help them form into specific units (words) more easily. Maybe they also impart some basically recognizable features to specific letters. Some "g-ness" or "q-ness." &amp; those nesses help readers put them together into words.</p>
      <p>Two: Perhaps there is some cultural familiarity at work here also. Perhaps readers come to "know" book faces (which are faces with these redundancies and busy parts) from early days of reading, and so these become established as "book faces."</p>
      <p>That's as far as I am able to go now. I'm already feeling over my head. But behind it I'm sure are some of the factors that have made me accept some faces and reject others for the work I do. I'm sure–I hope–there is something more to it than "I don't like this type."</p>
      <p>To Hrant and my original question to him: Perhaps in my general inclination to agree with you I am just echoing what I was told as a kid compositor. But there's some basis for it. Some years ago I learned that the Monotype house I used had TNR with long descenders. So we designed a quarterly newsletter with those descenders, and the thing did look notably better (letterpress). At this remove I cannot say if it read any better.</p>
      <p>I cited a few weeks ago in another thread the 900 pages I recently read in ITC Garamond. It was easy as pie, easy on my eyes. The most recent tome was 700 pages in Adobe Caslon, which I found more difficult to read. What gives there?</p>
      <p>Back to work for me.</p>
      <p>powers</p>
