      <p>Zach, I do think your samples are "Old Style", meaning one of the faces derived from the 1860 Old Style Antique of Alexander Phemister. </p>
      <p>As the Jaspert Encyclopedia of Typefaces explains, "Its purpose was to cut a type that overcame what was regarded as archaic in CASLON. The serifs are slighter and more sharply cut. Stress is vertical, though not abruptly so. ...Ascenders and descenders are rather short."</p>
      <p>In other words, Old Style was the first Caslon revival, though it was undoubtedly strongly influenced by current 19th century fashions, as Mosley points out. As you I think rightly note, it also does distinctly remind one of Caslon, even though it is substantially changed in some respects. </p>
      <p>As I wrote earlier, that a re-publication of a text has to be in the same type as the era in which it was written is I think a questionable notion—and in any case not a generally accepted one. I can understand not wanting it to look totally anachronistic, but aside from that, I think the main thing is to be readable, look good, and suit the mood of the piece. </p>
      <p>My problem with Old Style and the many fonts derived from it is that I think they look dull. If you test one of the digital ones—there are a bunch—I think you will see what I mean. For me the original contrast is just a little too low, and the ascenders too short—which, as Tracy notes, tends to make a face dull. Also short ascenders looks less "literary" in a book setting. I personally think they are less readable, but I know my view is very debatable. </p>
      <p>Just looking now at some of the digital versions, they seem rather high contrast compared to 19th century printed versions. See Bruce Old Style, Binny Old Style, and Old Style 7. Bookman is closer in being low contrast, but I think rarely used for books. Century Old Style is end 19th century and not so closely related to Caslon, but has perhaps more the feel of that era, if that's what you want. </p>
      <p>ps. I would use old style figures with text. I notice that the "Old Style" font has them...</p>
