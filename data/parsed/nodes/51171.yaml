      <p>This is old news.<br>
      Digital type designers have been on the job since day one (Think Quadraat, Charter, Scala, etc.)<br>
      In fact it is one of the central issues of contemporary type design.<br>
      Many of my faces address it.<br>
      And yet lots of books are still set in wishy-washy versions of Perpetua and Bembo.<br>
      Go figure.</p>
