      <p>Nick, there is a difference between "retro", which appeals to nostalgia, and "classic", which appeals to a sense of timeless rightness.  </p>
      <p>You don't acknowledge the reality of this category, but most of the rest of the world does. </p>
      <p>The effort to produce better digital versions of classics has been a major movement in type, including Slimbach's efforts. And the phase of digital "new classics" with optical sizes and lower contrast is phenomenon of the past 10 or 15 years, including Bembo book and indeed various recent Caslon revivals other than mine.   </p>
      <p>When you say that Goudy already did what I did, you are simply failing to understand the issue. Goudy did letter press, and letter press just had to live with ink spread. Now with offset printing and digital type we can decide selectively what of the effects of ink spread to accept and reject. This means molding type in a different way, and new decisions on how to do it. This is only one issue involved in revivals, but it is an important one.</p>
      <p>Your analysis is reductive and dismissive, and so in my view misses or dismisses important issues.</p>
