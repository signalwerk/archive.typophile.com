      <p>@Bill: <em>...not an attempt to look like 18th century printing.</em></p>
      <p>Surely there is more to 18th century printing than its roughness and relative distress.</p>
      <p>The basic letter shapes of Williams Caslon are 18th century. It looks like "Caslon", it's named Caslon, and, to a similar extent as in Adobe Caslon, it has flexed serifs, and parses the uncoated-stock press gain of 18th century printing as both a softening of the outline and a reduced-contrast "darkness" that is the theme of this thread.</p>
      <p>The technique, a complex drawing of each glyph, suggests the variation in cutting and randomness of printing artefacts that one associates with 18th century printing, as opposed to the subsequent sharpness and regularity of the Didone style -- and is quite different than the application of a thematic, reductive system, as in the design of Matrix or Charter.</p>
      <p>It's not a 21st century idea: Goudy was the first to develop it in Kennerley (1911).</p>
