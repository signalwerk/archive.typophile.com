    <p><strong><a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Vialog</strong></p>
    <p>Vialog, available from <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a> as part of their <a href="/wiki/Platinum%20Collection" class="freelinking" rel="nofollow">Platinum Collection</a>, was designed by <a href="/wiki/Werner%20Schneider" class="freelinking" rel="nofollow">Werner Schneider</a> and <a href="/wiki/Helmut%20Ness" class="freelinking" rel="nofollow">Helmut Ness</a>.</p>
    <p>In 1988, Schneider designed a proposal for a universal European signage typeface. This typeface was adapted together with <a href="/wiki/Helmut%20Ness" class="freelinking" rel="nofollow">Helmut Ness</a> of <a href="/wiki/Fuenfwerken" class="freelinking" rel="nofollow">Fuenfwerken</a> at the <a href="/wiki/Fachhochschule%20Wiesbaden" class="freelinking" rel="nofollow">Fachhochschule Wiesbaden</a> in the late 1990s for use in the new Munich transit system. Ness, among others, would go on to completely redesign the city of Munich's transit authority system. Vialog would be used for everything, from large signage down to tiny print on pocket-sized maps.</p>
    <p><a href="http://www.linotype.com/53981/vialog-family.html" rel="nofollow">Vialog overview on the Linotype website</a><br>
    <a href="http://www.linotype.com/43576/vialogsigns-family.html" rel="nofollow">Vialog Signs</a>, a 14 weight companion symbol font family.</p>
