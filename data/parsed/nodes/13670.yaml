    <p>Vialog, available from <a href="/node/13697/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Linotype</a> as part of their <a href="/node/15662/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Platinum Collection</a>, was designed by <a href="/node/13669/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Werner Schneider</a> and <a href="/node/13671/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Helmut Ness</a>.</p>
    <p>In 1988, Schneider designed a proposal for a universal European signage typeface. This typeface was adapted together with <a href="/node/13671/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Helmut Ness</a> of <a href="/node/13668/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Fuenfwerken</a> at the <a href="/node/13672/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Fachhochschule Wiesbaden</a> in the late 1990s for use in the new Munich transit system. Ness, among others, would go on to completely redesign the city of Munich’s transit authority system. Vialog would be used for everything, from large signage down to tiny print on pocket-sized&nbsp;maps.</p>
    <p><a href="http://www.linotype.com/53981/vialog-family.html" class="link-external">Vialog overview on the Linotype website</a><br><a href="http://www.linotype.com/43576/vialogsigns-family.html" class="link-external">Vialog Signs</a>, a 14 weight companion symbol font&nbsp;family.</p>
