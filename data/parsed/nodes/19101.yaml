    <p>i apologize since this is probably not the place to ask (as it's not truly related to fonts), but i don't feel like finding and registering at some illustrator forum so here goes..</p>
    <p>i was testing to see all the glyphs in my current typeface project in Illustrator CS2 (on PC), but it was replacing the characters ƒ Š Œ š œ Ÿ with their Arial counterparts instead of the ones i had made. i figured it must've been something wrong with the font, but i can't find anything and then i tested other typefaces on my computer and all of them have those characters replaced by the Arial counterpart.. what the? in Photoshop, they display properly, so this is clearly an Illustrator thing.. has anyone heard of this before? is it some bug in the software or may it just be my Illustrator that needs to be reinstalled?</p>
    <p>upon further testing it appears it doesn't happen to every single font, so for some of them it uses the font's own glyphs and for others it does the same as it did with my font.. it doesn't seem to be any Truetype-only or Opentype-only thing either.</p>
    <p>any help on the matter would be greatly appreciated.</p>
