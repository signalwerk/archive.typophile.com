    date_raw: 14 Dec 2002 — 7:18pm
    votes: null
    html: <p> What might have made Dave think of Clarendon is that the letters that Indiana used might have been taken from outlines or patterns designed for smaller sizes. Make any typeface with bracketed serifs large enough and it takes on a Clarendon appearance, in a sense. That's one reason display faces are necessary.  <br> <br>To me, big Clarendons usually look good. The letters in this 'LOVE' sculpture don't look good. </p>
