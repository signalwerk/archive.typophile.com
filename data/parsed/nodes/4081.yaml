    html: <p> The reason I rescinded my Clarendon idea is that there’s no weight or make of Clarendon I could ﬁnd online that has a V with such a heavy thick part. It may be that the artist started with Clarendon and then redrew all the letters to suit his&nbsp;fancy. </p>
