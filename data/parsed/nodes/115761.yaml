      <p>‘Can't explain also why but it feels hand-drawn/amateurish and most probably intentionally.’</p>
      <p>Maybe it is details like the transitions of curves to straight lines in the U that make it look amateurish? Especially in the image provided by Adam it looks as if these are just attached circles without any optical corrections. The horizontal strike in the middle of B looks funny to. The upper outline seems to be slightly diagonal instead of horizontal. Or something is wrong with the transition from straight to curve.</p>
