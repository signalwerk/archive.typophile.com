  html: <p>I've been making fonts for a while now and I'm starting to see them in the wild more often. I've bought books I'll never read, women's magazines, greetings cards, tshirts, and most recently, biscuits, solely because they use my fonts. This practice could get expensive! What have you bought just because it has your font on it?</p>
