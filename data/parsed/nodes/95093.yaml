    html: |-
      <p>Wait! I am confused.</p>
      <p>Are people bragging about all the stupid ways that THEY PERSONALLY spent their hard-earned dough, or is this some kind of blanket condemnation of mindless consumer consumption?</p>
      <p>Not that it matters to me but, if someone is going to call<em> themselves</em> a moron in a public internet forum, I feel compelled—<em>noblesse oblige</em>, and all—to agree with them, in the most emphatic manner which is socially and politically correct. Because that's the kinda guy I am: the right tool for the right job. Kinda like Craigslist—except everyone knows the rules upfront.</p>
      <p>In fact, depending on the openly-offered evidence of their self-proclaimed and indubitably egregious stupidity, I might find myself—without recourse and in good conscience—FORCED to agree, AND in terms of such a superlative nature as to defy belief! Even if it means that I MUST declare a New World Champion!</p>
      <p>Unless I am mistaken about the premises…which, IMHO, I am clearly not…</p>
