      <p>Mindless consumer consumption?<br>
      I see it more like sticking your kid's drawing on the fridge door. Probably for you the novelty has worn off, but for someone like myself, just starting out, the first few times you see your font in the wild, that makes you proud. So buying the thing with the font on it is not some moronic act of mindless spending - it's acquiring yourself a keepsake, which in a way proves to you you're not wasting your time! And if it gives you an excuse to eat some nice biscuits, why not?</p>
