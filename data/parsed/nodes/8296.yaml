    html: <p>Bienfang - Graphics 360 Pad chopped in half  <br>length wise to conserve paper waste. Sturdy  <br>for erasing, takes a pen without bleeding,  <br>transparent enough to trace, but opaque  <br>enough to see the new line you're drawing. <br> <br>All in all, a great workhorse. <br> <br>- Randy</p>
