  html: |-
    <p>We’re redesigning our in-house magazine and I’m interested in getting some recommended fonts for headlines/subheads. We have to use Rotis Semi Sans for the body copy (corporate style and all) but what we use for headings is open. The design/content of the magazine is fairly straight and serious, but we’re looking to make it a little cleaner, sharper and more contemporary while still maintaining its professional (somewhat straightlaced) positioning.</p>
    <p>Any suggestions?</p>
