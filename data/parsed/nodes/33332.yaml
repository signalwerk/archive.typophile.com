      <p>See Langdon's page about "types of ambigrams". Given the many different ways to approach them, and an infinity of lettering styles to draw from, it's just a matter of ingenuity. </p>
      <p>You could also post your name and let the Typophiles take a swing at designing some for you. Could be fun all around. I love playing with ambigrams.</p>
