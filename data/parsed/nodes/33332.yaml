    html: |-
      <p>Letterforms are infinitely malleable. If they weren't, we would run out of typefaces to design. Therefore, no ambigram is absolutely impossible. It's just a matter of how good it can be. Sometimes it will necessarily be bad.</p>
      <p>And one never stops learning new tricks with practice; there are requests that, had I received them only a few years ago, I would have turned away saying "it's not going to be remotely legible or attractive," but are within my ability to make them so now. The last time I actually said "I'll understand if you just want a refund" was for BOOXTER, and even then they picked a sketch they liked enough to approve for completion.</p>
      <p>Feel free to look through <a href="http://ceruleanstimuli.com/ambigram/" rel="nofollow">my ambigram gallery</a> for inspiration (or to commission me if you've given up, as I am still madly cheap).</p>
      <p>(new url. I didn't realize editing the reply would drop it to the end.)</p>
