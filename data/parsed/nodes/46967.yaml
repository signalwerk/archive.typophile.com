      <p>Perhaps this small Mac/Win command line Java tool is useful in this case:</p>
      <p><a href="http://www.fonttools.org/downloads/DTL_AFMInterpolator.zip" title="http://www.fonttools.org/downloads/DTL_AFMInterpolator.zip">http://www.fonttools.org/downloads/DTL_AFMInterpolator.zip</a></p>
      <p>________________________________________________________________</p>
      <p>DTL AFM Interpolator version 1.1<br>
      last update: 2 July 2008</p>
      <p>New in version 1.1:</p>
      <p>- also interpolates POS values next to KPX<br>
      - negligible values (specified by an optional, extra argument) are left out<br>
      - instead of using a space as delimiter character, it now delimits using any amount of whitespace</p>
      <p>Usage:<br>
      java AFMInterpolator [file1] [file2] [factor] [flag] [output] ([limit])</p>
      <p>- file1: first AFM file<br>
      - file2: second AFM file<br>
      - factor: interpolation percentage (0-100)<br>
      - flag: 0 leaves incomplete pairs out, 1 ignores missing pairs and calculates using 0 instead<br>
      - output: output file<br>
      - limit: lower limit for values, leaves pairs with values smaller or equal out (optional)</p>
      <p>example use:<br>
      java AFMInterpolator fontname_regular.afm fontname_bold.afm 50 1 fontname_medium.afm 10</p>
      <p>Note: output file is automatically overwritten</p>
