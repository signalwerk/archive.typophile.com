      <p>The Bold font and the light font are both open. </p>
      <p>Assign the light font to the mask layer of the bold font. </p>
      <p>Define the new axis (weight)</p>
      <p>Using Mask to Master, assign the mask (light font) to the Wt0 axis. (As opposed to the Wt1 axis which would be the Bold font)</p>
      <p>You now have the light font at axis Wt0 and the Bold font at axis Wt1.</p>
      <p>Both axes are in the one font. Which started out as just your bold font</p>
    html_clean: |-
