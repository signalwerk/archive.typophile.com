      <p>&gt; <em>Before I get too excited is there anything else I should be looking for.</em></p>
      <p>Sometimes it happens that the masters look good, but in an interpolated instance some glyphs are mangled. This is caused by incompatibilities between the masters, things like,<br>
      -- different starting point node<br>
      -- contours in different order*<br>
      -- contours in different directions (I'm not sure of this one)</p>
      <p>*pay close attention to glyphs like the ellipsis, the colon, the equal sign, the double quotes, etc.</p>
    html_clean: |-
