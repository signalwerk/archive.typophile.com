      <p>I agree to terminaldesign, forget the blend feature and use Mask to Master. However, Mask to Master does not merge the kerning.</p>
      <p>If you need to transfer the kerning between masters or fonts you can use afm files. The metrics window allows you to export and import them. When you import an afm into an MM font, only the currently active master will be affected. Same for export. This works really reliably and has helped me repair MM fonts quite a few times already.</p>
