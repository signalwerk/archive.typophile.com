    <p>Hi all,</p>
    <p>I've been doing some experiments with the Blend Fonts command to produce interpolated weights. </p>
    <p>My question concerns the interpolation of the kerning values. The interpolated weights produced from the master blended font contains some of the kerning pairs that are present in the orginal fonts but not all of them.</p>
    <p>I made sure that the orginal light and bold weights had the same kerning pairs but with different values.</p>
    <p>Should the kerning be interpolated ? </p>
    <p>Is there a better way of doing this ?</p>
    <p>Is there a reason way some kerning pairs are present and not others ?</p>
