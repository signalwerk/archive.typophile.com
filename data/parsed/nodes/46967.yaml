    html: |-
      <p>Alternatively, Robofab offers a kerning interpolation method where the kerning of two seperate fonts can be interpolated in another font directly in FontLab:<br>
      <code><br>
      from robofab.world import CurrentFont<br>
      from robofab.interface.all.dialogs import SelectFont</code></p>
      <p>interpolval = 0.5   # 50% interpolation</p>
      <p>f1 = CurrentFont()<br>
      f2 = SelectFont('please select mininum pole')<br>
      f3 = SelectFont('please select maximum pole')</p>
      <p>k1 = f1.kerning<br>
      k2 = f2.kerning<br>
      k3 = f3.kerning</p>
      <p>k1.interpolate(k2, k3, interpolval, clearExisting = True)<br>
      f1.update()<br>
      print 'done'<br>
      </p>
