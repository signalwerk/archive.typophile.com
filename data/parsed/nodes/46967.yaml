    html: |-
      <p>MM via Mask-to master</p>
      <p>1. Create two fonts that you want to create a MM with. Export their afm files via the metrics window.<br>
      2. Make sure all the glyphs have the same number and type of points, in the same relative position. Also make sure all path directions are the same for each glyph.<br>
      3. Assign one of the fonts to the mask layer Tools&gt;Mask&gt; Assign Font Mask<br>
      4. Define the appropriate axis: Tools&gt; Multiple Master&gt; Define New Axis<br>
      5. At this point if not before, it is a good idea to Save As and assign this soon to be MM vfb a new name. Just in case something goes wrong<br>
      6. Select the glyphs in the font window and using Mask to Master convert the Mask to the appropriate Master Axis: Tools&gt;Multiple Master&gt; Mask to Master. When you are asked whether to let FontLab add points where necessary, make sure you select NO</p>
      <p>If you have done your prep correctly you will have no problems, but that hardly ever happens, you will always have a few problems. At this point you will most likely have to import the kerning and sometimes the metrics via the afm files you created to the newly created MM axes.</p>
    html_clean: |-
