    html: <p>-Since this is a grayscale experiment, maybe you should use the grays to compensate its color (darkness). <br> <br>Thanks Eduardo, you're right about the color, they suffer for been too Blocky (geometric) and near from old pixel fonts too. <br> <br>I am back with Apple using Multiple Grayscale shades. I post the first new Apple image to get your feedback. <br> <br>I build and test this font in a LCD screen at 1152 x 768 (powerbook g4 15"), for been used in similar screens,small pdas, cellphones and in E-Ink, who uses grayscale colors. For the moment i am on those 3 light regular and bold versions, but upright italics its in developing yet.  <br> <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/47355.gif" alt="Grayscale Apple Sans "> <br> <br> <br>Best, <br> <br>mh</p>
