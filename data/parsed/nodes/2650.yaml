  html: <p>Hola Typophiles, <br> <br>This is a new pixel font family, inspired in the early and classic "Chicago" by Susan Kare, but more complete and crisp, because it have greyscale antialiasing. Please post your coments or critiques, <br> <br>Thanks a lot. <br> <br>mh <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/23779.gif" alt="The Apple Proyect"></p>
