    <p>Hello,<br>
    I have a big assignment for school and I've decided to display my work in a fake magazine  (I don't know if it makes any sense). I've chosen to take CLASH magazine as an inspiration for page settings but I have some trouble identifying the fonts they use and I'd really like to use the same since I think they look very good.<br>
    I'm posting a few pages, if you know the name of any font on it, please tell me (I don't care about the logo, though)<br>
    Sorry, I guess most of them must be quite obvious, but I don't know a lot about fonts.</p>
