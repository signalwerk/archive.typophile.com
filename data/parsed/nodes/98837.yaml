    html: |-
      <p>Probably all bespoke typefaces, at least masthead and headlines.<br>
      For "CLASH" masthead, I'd probably start with <a href="http://commercialtype.com/typefaces/graphik/super" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Graphik Super</a> recreating /C with a middle right cut /O.<br>
      For the headlines, it's either all from scratch or they could have start from some slab-serif condensed, elongated it, rework/remove some serifs and add some elements (strokes, double bars...) to give some contemporary feeling to it. If you like this kind of fonts, have a look to <a href="http://tendollarfonts.com/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Ten Dollar Fonts</a>.<br>
      According to this <a href="http://www.typophile.com/node/92952" title="Click to visit an external URL." class="freelink freelink-external freelink-internal">previous discussion</a>, body text could be <a href="http://Mercury Text" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Mercury Text</a> but hard to say at this size.</p>
