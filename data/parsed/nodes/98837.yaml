    html: |-
      <p>Probably all bespoke typefaces, at least masthead and headlines.<br>
      For "CLASH" masthead, I'd probably start with <a class="freelinking external" href="http://commercialtype.com/typefaces/graphik/super" rel="nofollow">Graphik Super</a> recreating /C with a middle right cut /O.<br>
      For the headlines, it's either all from scratch or they could have start from some slab-serif condensed, elongated it, rework/remove some serifs and add some elements (strokes, double bars...) to give some contemporary feeling to it. If you like this kind of fonts, have a look to <a class="freelinking external" href="http://tendollarfonts.com/" rel="nofollow">Ten Dollar Fonts</a>.<br>
      According to this <a class="freelinking external" href="http://www.typophile.com/node/92952" rel="nofollow">previous discussion</a>, body text could be <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100017" rel="nofollow">Mercury Text</a> but hard to say at this size.</p>
