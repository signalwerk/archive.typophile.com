    html: "<p>The funniest thing at TypeCon: <br>When Si introduced himself as moderator of the Blog and  <br>Communities panel and said, \"I'm Si Daniels and I work for  <br>Microsoft. Sorry about that.\" <br> <br>The most frustrating moment: <br>Scoring a 6 on that *lousy type quiz (okay 8, if I give myself  <br>2 points for getting my name right). I had to second  <br>Stephen's assertion that it needed some questions from  <br><i>this</i> half of the last century. (*No offense Kent, it's just  <br>that you have to come down to the rest of our levels to  <br>speak to us. Haha. I guess next year I should do some  <br>homework.) <br> <br>The warmest fuzzy: <br>Realizing that the people you've looked up to forever are  <br>genuinely warm, friendly people. (Awww.) <br> <br>The truest prediction: <br>Jill Bell lamented that the Mac OS Finder should be able to  <br>recognize and activate fonts by double clicking them. The  <br>guy from Apple granted her wish 4 hours later when he  <br>gave a demo of Apple's Mac OS X update, Panther (Mac OS  <br>X 2.6). <br> <br>The strangest moment: <br>Sitting at lunch with Delve Withrington, hoping he doesn't  <br>notice me staring, thinking <i>Is he really an immortal vampire?</i> <br>By the end of the conference I still couldn't tell... <br> <br>The second worst moment: <br>Realizing that our room did not have high speed internet  <br>access. <br> <br>The worst moment: <br>Realizing that, not only did our room not have high speed  <br>internet access, but that the hotel's \"business center\"  <br>consisted of a single PC and a single chair in a closet-sized  <br>space that was constantly occupied. (I humbly suggest that  <br>TypeCon '04 be held at San Francisco's wireless enabled  <br>Herbst Theater or similarly equipped venue for us tech- <br>spoiled kids.) <br> <br>Biggest regret: <br>Flying on Priceline. Leaving Sunday morning. Essentially we  <br>missed the one day of the conference that was dominated  <br>by people of my own generation -- Test Pilot, Miniml,  <br>Aesthetic Apparatus among others. <br> <br>The simplest pleasure: <br>Watching Jim Parkinson beaming like a proud parent over  <br>the pages of Indie Fonts 2. The book itself was a catalyst  <br>for a pile of his recent releases. I'm sure he was both  <br>relieved to have the work done and proud of the showings.  <br>Note to self: invite Jim over for Sunday dinner sometime. <br> <br>Funnest time: <br>Sharing a panel with Si, Jon, Armin, Stephen and Jared.  <br>There were some genuine good laughs. I'm glad we could  <br>pull off a smoke screen so that not everyone realized  <br>that we were sitting up there modeling the emperor's new  <br>wardrobe.</p>"
