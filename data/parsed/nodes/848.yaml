  html: <p>Hi Everyone, <br> <br>It was great to meet so many of you for the first time and to catch up with TypeCon friends who I had fallen out of touch with. I'd like to echo some of you who have already stated just how  informative and friendly the conference is. I'm simply amazed at how well it has progressed. The very first one set the tone and it is still ringing true. Okay, that's a bit cheesy but you know what I mean.</p>
