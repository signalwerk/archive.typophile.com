    date: 2003-07-24T05:06:00
    date_raw: 24 Jul 2003 — 5:06am
    votes: null
    html: <p>John, Hrant --  <br> <br>Matthew was commissioned recently to create a new  <br>design to be cut in wood type by the Hamilton Wood  <br>Type &amp; Printing Museum in Two Rivers, WI. (Carter says  <br>the invitation caused him to realize that wood was, in  <br>fact, a technology that he had never created type for  <br>before.) His design is an all-caps, chunky, latin-serif  <br>design and is called Carter Latin. One of the more  <br>notable aspects of the design is that it has two variants  <br>-- a positive and a negative -- which can be combined  <br>for interesting figure-ground interrelationships. The  <br>typeface is done, but the font is still being manufactured,  <br>I think. Matthew confessed that last weekend was the  <br>first time he's actually seen it. It will be available in  <br>wood, one size only for now, I believe -- 12-line (about  <br>2 inches). <br> <br>There's nothing about this project on the <a href="http://www.woodtype.org" target="_blank"> Hamilton website</a> yet. <br> <br>Matthew has the rights to produce a digital font, but says  <br>he's not inclined to do it any time soon, so that the  <br>Hamilton can have a measure of exclusivity for a while. <br> <br>-- K. <br></p>
