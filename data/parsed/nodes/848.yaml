    html: "<p>Mike Parker tells the story: <br> <br>Once a young salesman was peddling new-fangled  <br>dictation machines that worked by recording speech  <br>for playback later. He managed to gain entrance to the  <br>Mergenthaler offices on Ryerson Street in Brooklyn and  <br>was shown to C.H. Griffith's office. The young man  <br>recorded a brief conversation with Mr. Griffith. He then  <br>played it back to CHG. Upon hearing the voice issue  <br>from the machine, Griffith declared gruffly, \"I never  <br>said that!\" <br> <br><i>&gt;too busy looking for photos of Kent Lew on the dancefloor.</i> <br> <br>I never did that. <br> <br>-- K. <br></p>"
