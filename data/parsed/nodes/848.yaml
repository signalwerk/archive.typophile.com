    html: <p>Well, I'm slowly getting back to reality.  <br> <br>TypeCon was great and it was wonderful to meet so  <br>many of you. I think, for the most part, I was able to  <br>express to you just how much I admire some of you  <br>and what wonderful inspirations you are. If I didn't  <br>get the chance this year, I'm  <br>hoping for the next. I'm planning to be there and  <br>I hope you will be as well. <br> <br>The highlights were many and the biggest was of course  <br>being in the same room as all of you. <br> <br>Other great points, for me, were; <br> <br>1) <b>Peter Bilak's presentation</b> <br>2) <b>Stuart's LazyDrinker</b> <br>3) <b>Some great spacing and kerning files  <br>from Bitstream</b> <br>4) <b>Knowing I can only do better on next  <br>years type quiz.</b> <i>( I actually won the most  <br>typographically challenged prize. Thanks Keith and Tiffany,  <br>for humoring me and grading my test. )</i> <br> <br>There are way to many good things to talk about. <br> <br>I should try to post later when I am more together.  <br>It is actually a little hard to get my head around it all. <br> <br><b>The biggest surprise;</b> Kent on the dance floor. <br> <br>Kent, you can really tear a rug up! Nice. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>-Sean</p>
