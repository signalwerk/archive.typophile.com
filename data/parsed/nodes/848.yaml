    html: <p>Glad to meet and talk to many of you. Because of TypeCon, I have about four new projects (both design and research) I want to pursue. I rarely ever write anything down, but I kept digging out my pink pad to jot down what was running through my head. For a young guy like me, this was a great experience. It was very inspiring. Thanks, everyone.</p>
