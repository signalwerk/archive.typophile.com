    html: <p>While you're at it, don't forget to give <a class="freelinking external" href="http://fontforge.sf.net/" rel="nofollow">FontForge</a> a try. It's come a long way in the last few months even, now that it has a Spiro drawing mode that no other font editor has (if you install libspiro first, among some other dependencies you may need to install too). It will generate OpenType fonts and a bunch of other formats both common and obscure. It's a little weird and initially uncomfortable working in an X11 window when you're used to Mac software, but you'll get over it, and if you find you don't like it at least you aren't out any cash for trying.</p>
