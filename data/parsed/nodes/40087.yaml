    html: |-
      <p>I would strongly recommend FontLab. I was using Fontographer at first (for about two-three months while learning how to make fonts...) but very soon I felt it was very limited. You cant make an OpenType font in Fontographer, and you cant use any OpenType features at all. OpenType is the new standard, and that makes Fontographer outdated.</p>
      <p>Speaking of old, the whole application has an old, almost retro-touch over it. It feels like using an application in MacOS 7.5 or something with anti-aliasing always OFF, which makes the bezier curves look not so smooth. FontLab is smooth and you see the letters as you see them in apps like InDesign etc. Fontographer is looking more like some old CAD-vector-drawing tool. Think of the difference between game consoles. Fontographer is like a Commodore 64 or Atari 128 while FontLab is more like Xbox 360 ;-)</p>
      <p>Other than that, I would also like to add that FontLab has a whole bunch of helping tools that really helps you when making fonts, and you can also add all the great python scripts available.</p>
      <p>Go FontLab, you wont regret it!</p>
