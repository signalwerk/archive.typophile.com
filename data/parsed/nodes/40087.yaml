  html: <p>I'm going to be upgrading from TypeTool to a better program, pretty soon here. I had planned on upgrading to FontLab, but I just disovered that I could instead upgrade to Fontographer for $300 less. So, my question is, what would I be missing if I didn't spend those $300? The big limitations on me from TypeTool are that it won't let me put more than one character set in a font, it takes lots of effort to make all the accented characters, and it's a bit unstable. Would Fontographer solve these problems? If I wanted to export in .otf format, would I have to buy FogLamp, or is there another utility that I could use? And what does FontLab have that Fontographer doesn't?</p>
