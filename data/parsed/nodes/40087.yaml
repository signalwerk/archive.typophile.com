      <p>I'm on a Mac and I have used Fontographer since its initial concept. Those guys in Texas were great - too bad they sold out.</p>
      <p>Meanwhile, I had a demo of FontLab -- and for the Mac I was too impressed. It was good for opening OT fonts and for saving them. The Fontographer I have doesn't even recognize an OT font -- but it is great for making Mac Type 1 fonts. </p>
      <p>Don't know if that helps you - but I think you can still try a 30 day demonstration from each and decide for yourself. Then you can report back here an let us know.</p>
