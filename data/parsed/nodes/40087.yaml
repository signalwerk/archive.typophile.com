      <p>Just out of curiosity, I've been playing around with FontForge. I've read a bit about it in <em>Fonts &amp; Encodings</em> and learned that it has some features that don't (yet) exist in FontLab, which could make it useful as a supplementary tool to FontLab, such as support for Raph's spiro curve drawing system, creating AAT fonts, and the ability to add OT features not yet supported by the <a href="/wiki/AFDKO" class="freelinking" rel="nofollow">AFDKO</a> (and therefore not yet supported by FontLab). Also, it has .ufo support, which makes it compatible with tools like Superpolator and MetricsMachine. </p>
      <p>I can't seem to get the spiro tool to work though. The button on the tool bar to activate it is greyed out and disabled.</p>
