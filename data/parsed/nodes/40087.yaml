      <p>I used Fontographer from the early nineties for over 10 years. Once you got use to working around its many bugs, it was OK for making Type 1 fonts. It was fairly intuitive, unlike (in my opinion) FontLab. I imagine I whined &amp; complained when I had to learn FontLab after using Fontographer for 10+ years.</p>
      <p>Now I wouldn't go back. Part of that was due to some of the nice points of Fontographer being phased out (the behavior of the kerning window) with Macromedia's release 4.X. A lot of it has to do with not having to work around all the bugs. FontLab has a few, but nowhere near what you had to put up with using Fontographer.</p>
      <p>As to OpenType features -- if you will be making fonts you would like InDesign users to buy, you need to be making OpenType fonts, which means including OpenType features. Adobe and Microsoft are big players these days. They seem to committed to OT technology, and that is probably more important than whether or not OT is, in some abstract sense, the best format.</p>
