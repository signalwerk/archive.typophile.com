    <p>I am designing a letterhead to go with with this logo. The logo font is Garamond Bold and I would like to find a standard system font to compliment it so that when letters are composed in MS Word a nice look and feel can be kept intact. Does anyone have any ideas of a font I could use?</p>
    <p>Thank you for your help and insight,</p>
    <p>Duncan Robertson</p>
