    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a>: Erik Spiekermann</strong></p>
    <p>Erik Spiekermann (b. 1947) is a graphic designer, typographer and type designer. Spiekermann founded <a href="/wiki/MetaDesign" class="freelinking" rel="nofollow">MetaDesign</a> in 1979 and designed its namesake typeface <a href="/wiki/FF%20Meta" class="freelinking" rel="nofollow">FF Meta</a>. In 1989 he, <a href="/wiki/Neville%20Brody" class="freelinking" rel="nofollow">Neville Brody</a>, and <a href="/wiki/Joan%20Spiekermann" class="freelinking" rel="nofollow">Joan Spiekermann</a> started <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a>. This was preceded by the formation of font retailer <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a>. Most recently, Spiekermann founded <a href="/wiki/United%20Designers%20Network" class="freelinking" rel="nofollow">United Designers Network</a> with offices in Berlin, London and San Francisco. In January 2007, the studio has been renamed SpiekermannPartners.</p>
    <p>Spiekermann splits his time between his homes in Berlin, London and San Francisco. He often travels to various speaking engagements and to jury type and graphic design competitions. For a decade Erik helped organize TypoBerlin, the annual FontShop sponsored conference in Berlin.</p>
    <p>Spiekermann's most prolific typefaces are<a href="/wiki/ITC%20Officina%20Sans%20and%20Serif" class="freelinking" rel="nofollow">ITC Officina Sans and Serif</a>, <a href="/wiki/FF%20Meta" class="freelinking" rel="nofollow">FF Meta</a> and <a href="/wiki/FF%20Unit" class="freelinking" rel="nofollow">FF Unit</a>.</p>
    <p>Spiekermann's highest profile clients are Nokia, Audi, the city of Berlin, and <em>The Economist</em>. The system of typefaces he designed with <a href="/wiki/Christian%20Schwartz" class="freelinking" rel="nofollow">Christian Schwartz</a> for DB Deutsche Bahn (the German Railways) won the German Federal Design Prize for 2007, the most prestigious award in Germany.</p>
