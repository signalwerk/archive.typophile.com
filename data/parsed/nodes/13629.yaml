    <a href="http://www.fontshop.com" title="http://www.fontshop.com">http://www.fontshop.com</a> - the font retail operation he co-founded<br>
    <a href="http://www.fontfont.com" title="http://www.fontfont.com">http://www.fontfont.com</a> - the type foundry he co-founded<br>
    <a href="http://www.fstopimages.com" title="http://www.fstopimages.com">http://www.fstopimages.com</a> - the stock image library started by FSI in 2002<br>
    <a class="freelinking external" href="http://www.katranpress.com/stamps_spiekermann_1_1.html" rel="nofollow">Postage stamps designed by Erik Spiekermann</a></p>
