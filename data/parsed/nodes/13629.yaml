    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>: Erik&nbsp;Spiekermann</strong></p>
    <p>Erik Spiekermann (b. 1947) is a graphic designer, typographer and type designer. Spiekermann founded <a href="/node/15651" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">MetaDesign</a> in 1979 and designed its namesake typeface <a href="/node/13815" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">FF</span> Meta</a>. In 1989 he, <a href="/node/14015" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Neville Brody</a>, and <a href="/node/add/wiki?edit%5Btitle%5D=Joan%20Spiekermann" title="Create node &quot;Joan Spiekermann&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Joan Spiekermann</a> started <a href="/node/13594" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontFont</a>. This was preceded by the formation of font retailer <a href="/node/12019" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontShop</a>. Most recently, Spiekermann founded <a href="/node/add/wiki?edit%5Btitle%5D=United%20Designers%20Network" title="Create node &quot;United Designers Network&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">United Designers Network</a> with offices in Berlin, London and San Francisco. In January 2007, the studio has been renamed&nbsp;SpiekermannPartners.</p>
    <p>Spiekermann splits his time between his homes in Berlin, London and San Francisco. He often travels to various speaking engagements and to jury type and graphic design competitions. For a decade Erik helped organize TypoBerlin, the annual FontShop sponsored conference in&nbsp;Berlin.</p>
    <p>Spiekermann’s most prolific typefaces are<a href="/node/add/wiki?edit%5Btitle%5D=ITC%20Officina%20Sans%20and%20Serif" title="Create node &quot;ITC Officina Sans and Serif&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">ITC</span> Officina Sans and Serif</a>, <a href="/node/13815" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">FF</span> Meta</a> and <a href="/node/13632" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">FF</span> Unit</a>.</p>
    <p>Spiekermann’s highest profile clients are Nokia, Audi, the city of Berlin, and <em>The Economist</em>. The system of typefaces he designed with <a href="/node/13636" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Christian Schwartz</a> for <span class="caps">DB</span> Deutsche Bahn (the German Railways) won the German Federal Design Prize for 2007, the most prestigious award in&nbsp;Germany.</p>
    <p><span class="caps">URL</span>s:<br><a href="http://www.spiekermann.com">http://www.spiekermann.com</a> - his personal blog<br><a href="http://www.spiekermannpartners.com">http://www.spiekermannpartners.com</a> - his Berlin and San Francisco-based design studios<br><a href="http://www.fontshop.com">http://www.fontshop.com</a> - the font retail operation he co-founded<br><a href="http://www.fontfont.com">http://www.fontfont.com</a> - the type foundry he co-founded<br><a href="http://www.fstopimages.com">http://www.fstopimages.com</a> - the stock image library started by <span class="caps">FSI</span> in 2002<br><a href="http://www.katranpress.com/stamps_spiekermann_1_1.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Postage stamps designed by Erik&nbsp;Spiekermann</a></p>
    <p><strong>Additional Articles:</strong><br>
