      <p>The following code works in FontForge and gives the same behaviour as the lookups in AlmostRandom.otf.</p>
      <pre>lookup contextofone {
        lookupflag 0;
          sub [\zero  ] [\zero]'  by [\zero.2] ;
          sub [\zero.2] [\zero]'  by [\zero.3] ;
          sub [\zero.3] [\zero]'  by [\zero.4] ;
          sub [\zero.4] [\zero]'  by [\zero.5] ;
      } contextofone ;

      lookup contextoftwo {
        lookupflag 0;
          sub [\zero.4] [\zero.5] [\zero]'    by [\zero.2] ;
          sub [\zero.5] [\zero.2] [\zero.2]'  by [\zero.4] ;
          sub [\zero.2] [\zero.4] [\zero.3]'  by [\zero  ] ;
          sub [\zero.4] [\zero  ] [\zero.4]'  by [\zero.5] ;
          sub [\zero  ] [\zero.5] [\zero.5]'  by [\zero.3] ;
          sub [\zero.5] [\zero.3] [\zero  ]'  by [\zero.2] ;
          sub [\zero.3] [\zero.2] [\zero.2]'  by [\zero  ] ;
          sub [\zero.2] [\zero  ] [\zero.3]'  by [\zero.4] ;
          sub [\zero  ] [\zero.4] [\zero.4]'  by [\zero.3] ;
      } contextoftwo ;

      feature calt {
        script DFLT;
           language dflt ;
            lookup contextofone;
            lookup contextoftwo;

        script latn;
           language dflt ;
            lookup contextofone;
            lookup contextoftwo;
      } calt;
      </pre><p>
      In the font AlmostRandom.otf, the zeros are numbered from 1 to 5; the default zero contains a 1; without any substitution lookups you would see zeros numbered as follows:</p>
      <pre>   111111111111111
      </pre><p>
      With the first lookup, that uses a single character as left context, you get</p>
      <pre>   123451234512345
      </pre><p>
      With the second lookup, that uses two characters as left context, you replace the first occurrence of 451 by 452 and advance the cursor to get</p>
      <pre>   1234522|34512345
      </pre><p>
      and then 522 becomes 524 and so on.</p>
      <p>You end up with</p>
      <pre>   123452415321435
      </pre><p>
      and that sequence is then repeated indefinitely.</p>
      <p>For more details, cf <a href="http://typophile.com/node/19625" title="http://typophile.com/node/19625">http://typophile.com/node/19625</a></p>
      <p>Michel</p>
