      <p>If your aim is to fill a page with only variants of zero, I see no OTL solution because no contextuality is carried from one line to the next. When pseudo-randomness is used to mimic handwriting for instance, then it is possible to use some character further away in the current line as a "seed" for a "pseudo-random process" so as to avoid repetition. There is an example in Nick Shinn's thread <a href="http://typophile.com/node/46521" title="http://typophile.com/node/46521">http://typophile.com/node/46521</a>. </p>
      <p>Michel</p>
