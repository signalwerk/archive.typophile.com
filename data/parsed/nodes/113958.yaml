            lookup caltContextualAlternatesinLatin;<br>
            lookup sub_chain_caltlatn_0;<br>
        script latn;<br>
           language dflt ;<br>
            lookup caltContextualAlternatesinLatin;<br>
            lookup sub_chain_caltlatn_0;<br>
      } calt;</p>
