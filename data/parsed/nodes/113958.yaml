    <p>Hi,<br>
    I've been testing and googling for a while now, but I can't get this work.<br>
    I'm working on an experimental type project. What I'm trying to do is to repeat a character in a random way</p>
    <p>I have following 5 characters: </p>
    <pre>zero, zero.001, zero.002, zero.003, zero.004, zero.005
    </pre><p>Currently I am using this code to repeat them, when they are typed after each other:</p>
    <pre>lookup rotate {
     sub zero zero'  by zero.001 ;
     sub zero.001 zero' by zero.002 ;
     sub zero.002 zero' by zero.003 ;
     sub zero.003 zero' by zero.004 ;
     sub zero.004 zero' by zero.005 ;
     sub zero.005 zero' by zero ;
    }rotate;
    lookup rotate;
    </pre><p>I attached an image of how it looks like now (the worm poops are the character "zero, zero.001... zero.005"), but I would like to repeat them differently for the second, third and fourth loop, so that the repeat patter can not be recognized easily. </p>
    <p>Can anyone help me with this?<br>
    /Gerolin</p>
