      <p>[FontForge code, font from erwindenissen ]</p>
      <p>lookup caltContextualAlternatesinLatin {<br>
        lookupflag 0;<br>
          sub [\zero ] [\zero ]'  by [\zero.2 ];<br>
        subtable;<br>
          sub [\zero.2 ] [\zero ]'  by [\zero.3 ];<br>
        subtable;<br>
          sub [\zero.3 ] [\zero ]'  by [\zero.4 ];<br>
        subtable;<br>
          sub [\zero.4 ] [\zero ]'  by [\zero.5 ];<br>
      } caltContextualAlternatesinLatin;</p>
      <p>lookup SingleSubstitutionlookup6 {<br>
        lookupflag 0;<br>
          sub \zero by \zero.2 ;<br>
          sub \zero.2 by \zero.4 ;<br>
          sub \zero.3 by \zero ;<br>
          sub \zero.4 by \zero.5 ;<br>
          sub \zero.5 by \zero.3 ;<br>
      } SingleSubstitutionlookup6;</p>
      <p>lookup SingleSubstitutionlookup7 {<br>
        lookupflag 0;<br>
          sub \zero.2 by \zero ;<br>
          sub \zero.3 by \zero.4 ;<br>
          sub \zero.4 by \zero.3 ;<br>
      } SingleSubstitutionlookup7;</p>
      <p>lookup sub_chain_caltlatn_0 {<br>
        lookupflag 0;<br>
          sub [\zero.4 ] [\zero.5 ] [\zero ]'lookup SingleSubstitutionlookup6  ;<br>
        subtable;<br>
          sub [\zero.5 ] [\zero.2 ] [\zero.2 ]'lookup SingleSubstitutionlookup6  ;<br>
        subtable;<br>
          sub [\zero.2 ] [\zero.4 ] [\zero.3 ]'lookup SingleSubstitutionlookup6  ;<br>
        subtable;<br>
          sub [\zero.4 ] [\zero ] [\zero.4 ]'lookup SingleSubstitutionlookup6  ;<br>
        subtable;<br>
          sub [\zero ] [\zero.5 ] [\zero.5 ]'lookup SingleSubstitutionlookup6  ;<br>
        subtable;<br>
          sub [\zero.5 ] [\zero.3 ] [\zero ]'lookup SingleSubstitutionlookup6  ;<br>
        subtable;<br>
          sub [\zero.3 ] [\zero.2 ] [\zero.2 ]'lookup SingleSubstitutionlookup7  ;<br>
        subtable;<br>
          sub [\zero.2 ] [\zero ] [\zero.3 ]'lookup SingleSubstitutionlookup7  ;<br>
        subtable;<br>
          sub [\zero ] [\zero.4 ] [\zero.4 ]'lookup SingleSubstitutionlookup7  ;<br>
        subtable;<br>
          sub [\zero.4 ] [\zero.3 ] [\zero.4 ]'  by [\zero.5 ];<br>
      } sub_chain_caltlatn_0;</p>
      <p>feature calt {<br>
        script DFLT;<br>
