      <blockquote><p>You are right. The endings of 9 are not horizontal like Helvetica's. So we are looking at a greek interpretation of another font.</p></blockquote>
      <p>Yes... and No... Even if I'm clearly not a specialist of Greek fonts. My first thought was "this is not Helvetica, /9 is off. looks more like Akzidenz Grotesk". But after checking the <a class="freelinking external" href="http://www.bertholdtypes.com/font/akzidenz-grotesk/proplus/#charset" rel="nofollow">Berthold Akzidenz-Grotesk Pro+ Greek character set</a>, /γ was still off (and many more actually such as /ɛ). So really don't know what it could be... May be asking to specialists like <a class="freelinking external" href="http://www.cannibal.gr" rel="nofollow">Cannibal Fonts</a> would worth a shot...</p>
