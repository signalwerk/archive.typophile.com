  html: |-
    <p>I am not sure whether a greek font is something that users of this forum can recognize, but all my greek forum attempts failed.<br>
    I would like to know if anyone can recognize this font.<br>
    It looks like a greek helvetica but all the greek helveticas I have found do not have this kind of gamma (γ).<br>
    Usually it looks like a y but this font has a more rounded lower part.<br>
    Thank you very much.</p><div class="imageWrap"><img src="http://typophile.com/files/spanos_3541.jpg"></div><p></p>
