    html: "<p>Another tip for pasting into FL4 from AI: <br>In Illustrator, move the origin point to the place where you want the basepoint to be in FL. Then, when you paste in, it will be aligned to the basepoint properly. <br> <br>This saves the time and effort of moving the characters into place. Also, since they are in place, you can then Transform them all at once, scaling them relative to the basepoint. <br> <br>(I also miss the way it worked in FOG, where I just used a vertical line to define the height.)</p>"
    html_clean: "<p>Another tip for pasting into FL4 from AI: <br>In Illustrator, move the origin point to the place where you want the basepoint to be in FL. Then, when you paste in, it will be aligned to the basepoint properly. <br> <br>This saves the time and effort of moving the characters into place. Also, since they are in place, you can then Transform them all at once, scaling them relative to the basepoint. <br> <br>(I also miss the way it worked in FOG, where I just used a vertical line to define the height.)</p>"
