    html: <p>FontLab is a bit literal-minded when pasting in art from Illustrator.  <br> <br>FontLab interprets points in Illustrator as em units. More importantly, it rounds off all measurements to the nearest point. Since coordinates in Illustrator can be specified with an accuracy of up to 1/1000th of a point, you will lose a certain amount of accuracy in the transition. This is okay and necessary since coordinates in fonts <i>must</i> be whole numbers. But, if you create your art in Illustrator at an em square (in points) smaller than your em square (in em units) in FontLab, and you scale it up in FontLab, you will lose accuracy. The more scaling, the worse it gets. <br> <br>(If you uncheck "Do not scale EPS files..." in FontLab's preferences, it scales the artwork to 175% when pasting from Illustrator. This lets you, what, create your artwork at 57.142% in Illustrator? I don't get it.) <br> <br>Consequently, if you are using a 1000 unit em square in FontLab, you should scale your characters to fit a 1000 point em square in Illustrator <i>before</i> moving them to FontLab. <br> <br>Fontographer does this automatically when pasting from Illustrator, and it uses fractional em units internally (up to 1/1000th of an em) so, even if you scale artwork up after importing, there will be no noticeable loss in accuracy. Coordinates are rounded off in the generated font, however.  <br> <br>There is a certain logic and sensibleness to FontLab's strict adherence to whole coordinates, but it has definite drawbacks from a design perspective. For instance, if you scale a character up or down, and later try to restore it to its original size, it will not match the original due to distortions introduced by coordinate rounding in the intermediate stages. (The same thing happens in Fontographer, but the distortions are a thousand times less significant since it bases its calculations on 1/1000 of an em unit.) <br> <br>As Jens suggests, it is probably better to learn to draw directly in FontLab, and, in fact, it's ill-suited to the Illustrator/Fontographer workflow many of us have been using for years. But for those of us "spoiled" by the ease and flexibility of working this way, it feels like a lot of extra and unnecessary work.</p>
