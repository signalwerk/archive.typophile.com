  html: <p>I'm new to Fontlab. <br>I'm curious about you're way to bring you're Illustrator design characters to Fontlab 4.5. <br> <br>The only way I found is blowing the characters(corresponding to 12pt) at around 4000%. <br>Previously, in FOG, I only have to cut/paste(yeah with alt down, of course!) with a maximum scale rectangle. <br> <br>And you?</p>
