    <p>Western NY Book Arts Collaborative printer's apron.<br>
    The new WNYBAC printer's apron features the California job case "cheat sheet". The layout of the California job case is printed upside down on the apron for quick easy reference by the wearer minding their Ps &amp; Qs. For those who do not hand set type on a regular basis, a quick look down onto the apron will be all you need. This fashionable and practical apron also features the WNYBAC logo designed by James Grieshaber printed on the 2" wide pocket. Black Nylon with white printing. Only $12.50 ($10 for members) (+$5 for shipping with in the US)<br>
    <a href="http://www.wnybookarts.org/publications.php" title="http://www.wnybookarts.org/publications.php">http://www.wnybookarts.org/publications.php</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/WNYBACapron_5695.jpg"></div><p></p>
