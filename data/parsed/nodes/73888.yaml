    html: <p>Have you tested with other applications? IIRC, OpenOffice was, erroneously, using the WinAscent/Descent values of the OS/2 table to compute line height, where it should be using the TypoAscent/Descent values. So I think you should reported that as an OpenOffice bug, and use the negative leading if it works for you (I myself stopped using office suites long ago, it is just to fragile and unpredictable for me to use, if I were you, I'd go with some TeX based solution; LaTeX, ConTeXt or even Texinfo depending on your particular needs).</p>
