    <p>I am not a designer. I use Open-Office.org as office suite on a Linux distribution (Fedora) and I need advice about fonts with "an above the average" default leading:</p>
    <p>Most of the free fonts (SIL license) I have tried have a huge default leading (probably because of the numerous scripts they support, or the designer taste?).</p>
    <p>I would like to know if setting a negative leading (e.g. line-spacing proportional=80%, or line-spacing fix=0.45 cm) in the paragraph style is custom practice or not? If it is not, I will search for other fonts with a "regular" default leading (well, I am used to increase the leading with traditional fonts).</p>
    <p>Usage: writing reports to print on paper or pdf.</p>
    <p>Thanks in advance.</p>
