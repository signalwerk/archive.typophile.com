      <p>I am currently working on a revival of a couple of Ihlenburg's other typefaces, Columbus (1892) and American Italic (1902).</p>
      <p>More info on Ihlenburg:</p>
      <p><a href="http://library.rit.edu/cary/collections/hermann-ihlenburg-papers" title="http://library.rit.edu/cary/collections/hermann-ihlenburg-papers">http://library.rit.edu/cary/collections/hermann-ihlenburg-papers</a><br>
      The Cary Library's collection of Ihlenburg materials includes Ihlenburg's initial sketches for many of his typefaces.</p>
