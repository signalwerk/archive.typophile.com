      <p>A bit more .. Southern Software did "Riccio", no doubt a clone of Fontbank's Bangle, with SSI and SSK labeling. Somewhere along the line, someone internally renamed the SSI/Keypro Riccio to "Bijou", leaving "RiccioDisplayScriptSSI" as the PS Font Name.</p>
