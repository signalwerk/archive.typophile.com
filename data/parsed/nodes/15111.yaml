      <p>— — —<br>
    PRESS RELEASE<br>
     — — —</p>
    <p>Ascender Creativity Font Pack includes fonts, templates, design tools</p>
    <p>ELK GROVE VILLAGE, IL - September 13, 2005 - Ascender Corporation today announced the release of its first retail font software package targeted at Microsoft Office users. The Ascender Creativity Font Pack is the first product of its kind offering OpenType fonts specifically enhanced for crisp display with ClearType in Microsoft Windows XP. The font selection includes a fresh variety of text, display and script fonts licensed from leading type designers, along with an assortment of design tools.</p>
    <p>The Ascender Creativity Font Pack features 30 world-class OpenType fonts, 40 professionally-designed templates for Microsoft Word, the Ascender Font Selector utility and design tips &amp; tricks from renowned author Roger C. Parker. It is value-priced at $19.99 and is available as an electronic download from the <a href="http://www.ascenderfonts.com" title="www.ascenderfonts.com">www.ascenderfonts.com</a> website.</p>
    <p>“We are proud to bring an affordable set of true professional-quality fonts and design tools to home and office computer users” said Ira Mirochnick, President of Ascender Corporation. “This is truly an impressive collection of fonts and design tools. In combination they will help Microsoft Office users more quickly and easily create attractive and effective documents.</p>
    <p>Real fonts from real type designers<br>
    Ascender worked with leading type designers and foundries to assemble a set of fonts that normally sell for over $500 if purchased separately. Fonts were carefully selected to provide an extensive range of designs which will help reinforce the message of many types of documents. Designer and font foundry participants included Gunnlauger SE Briem, Chank, Elsner + Flake, The Font Bureau, Steve Matteson, Steve Mehallo, Microsoft, Thomas Rickner and Mark Simonson. Each of the fonts had to meet Ascender’s exacting quality standards. These fonts are far and above the quality of shareware or jumbo-package fonts – they include 384 characters for extensive European language coverage and careful tuning for on-screen display with ClearType.</p>
    <p>More than just fonts<br>
    The Ascender Creativity Font Pack also includes a variety of helpful design tools to put the fonts into action. There are 40 smart-looking templates for Microsoft Word that are ready to be personalized. They cover a diverse range of activities: cards, invitations, stationery, certificates, flyers, forms and more for personal and business tasks. The Ascender Font Selector is a new utility for selecting the right font for the right situation. It allows users to browse through font previews organized by personality, occasion and type classification. Also included in the product is Roger C. Parker’s Design Tips – an illustrated design guide with a baker’s dozen tips and tricks from Roger C. Parker, author of 35 books on desktop publishing, design and marketing. </p>
    <p>System Requirements<br>
    The Ascender Creativity Font Pack is a 3.4MB electronic download file. Internet access is required to purchase and download the product. Windows XP is recommended, but it will work with Windows 98, ME and 2000. Microsoft Word is required for the templates.</p>
    <p>About Ascender Corporation<br>
    Ascender Corporation is a provider of advanced font products specializing in font design, development and licensing. Ascender’s founders are font industry experts, and have been involved in developing some of the most important and influential fonts used in computers, phones and printers. Ascender provides multilingual, custom font development for enterprises and hardware &amp; software developers. Ascender also provides high quality fonts for immediate download from the Ascender Font Store website (<a href="http://www.ascenderfonts.com" title="www.ascenderfonts.com">www.ascenderfonts.com</a>).</p>
    <p>Contact:<br>
    Bill Davis<br>
    Ascender Corporation<br>
    25 Northwest Point Blvd, Suite 975<br>
    Elk Grove Village, IL 60007 USA<br>
    Phone: (847) 357 0730 ext. 10<br>
    Fax: (847) 357 0731<br>
    <a href="http://www.ascendercorp.com" title="www.ascendercorp.com">www.ascendercorp.com</a></p>
    <p>Trademarks: Ascender is a trademark of Ascender Corporation which may be registered in the US Patent and Trademark office and certain other jurisdictions. Microsoft, Windows, OpenType and ClearType are trademarks of Microsoft Corporation. All other trademarks are property of their respective owners.</p>
