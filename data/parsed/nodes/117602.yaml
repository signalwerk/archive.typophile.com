      <p>Many thanks Mike! A veritable flood of copycats with minor variations. I wonder how many he missed? Do you have any information on the intrepid researcher Bernhard Schnelle?<br>
      The "Germania" variation is in Dan X. Solo's catalog at page 109.<br>
      I don't know if "Germania" dates from circa 1900 -- nothing on this variation in Petzendorfer's big Schriften Atlas of 1898 or Phillips Old Fashioned Type Book of 1945 -- or whether it was another kick at the can from a lettering artist in the photo-type era. Many but not all of the fonts in the big Solo Catalog were metal. This variation never made it into the Letraset catalog. Out of curiosity I will flip though the big Photo Lettering catalog when I next visit my local university library.<br>
      If all else fails I can have a drink of Ketel One vodka<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/KetelOneSM_5389.jpg"></div><br>
      Don<p></p>
