      <p>It looks like <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-1&amp;ffam=Deutsch%20Gothic%20-%20Normal&amp;fid=baa262cc8769a7cfde01ce5671118c84&amp;fsize=60&amp;text=Lannister&amp;fit=1" rel="nofollow">Deutsch Gothic</a></strong> free font by J. Fordyce [1994]</p>
      <p>It also exist under the following names:<br>
