      <p>The lowercase in Germania and similar fonts may be adapted from a blackletter design by William H. Bradley in 1894 for the Inland Printer. By 1897 the imitations with minor variations by otherfoundries was a source of strong comment in the Inland Printer. I suspect that "Germania" et. al was a production of BB&amp;S, but will have to check. The original is available in digital form in Ralph Unger's Bradley <a href="http://www.myfonts.com/fonts/profonts/bradley/" title="http://www.myfonts.com/fonts/profonts/bradley/">http://www.myfonts.com/fonts/profonts/bradley/</a><br>
      Don<br>
      Note: corrected post.</p>
