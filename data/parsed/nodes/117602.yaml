    html: |-
      <div class="comment-spam-body"><p>I standardized the the scale of Jim Fordyce's Deutsch Gothic of 1994 and Dieter Steffmann's Germania and compared several glyphs. I found that the outlines of the Germania glyphs are point for point identical with those of Deutsch Gothic. I conclude that Germania is a clone of Deutsch Gothic, but note that some glyphs have been added to supplement the basic alphabet. I have not seen Dabblet, but given the stated date, I suspect that it is an original digitization.  I suspect that with the exception of Deutsch Gothic and/or Dabblet, all of the others on the well researched list provided by Fivos, are clones.<br>
      Don</p>
      </div>
