  html: |-
    <p>As I announced previously, David and I wanted to do something special with #200 of the <a href="http://typographi.com/001024.php" target="new">TypeCon2005 booklet</a>. Well, just yesterday I found it in my mail, after it had travelled all over Europe* — together with #000 and #001 — collecting the last signatures.</p>
    <p>Yup, this extremely limited copy of the booklet not only sports the magical number 200 of 200, but its title page is signed by all the type designers who participated in this project. The list ranges from young up-and-comers to card carrying type design celebrities: Stefan Hattenbach, Jean François Porchez, Tomáš Brousil, Nick Shinn, {ths}, Rian Hughes, Randy Jones, Mark Simonson, Peter Bil’ak, Eduardo Manso and David Berlow.</p>
    <p>So, David and I <em>are</em> keeping the equally signed #000 and #001 for ourselves — heh, we’re not <em>that</em> crazy —, but number 200 will be auctioned to the highest bidder. Even better, we decided that the money raised by this auction will be split in half and donated to both the SOTA and ATypI organisations. We might occasionally rail against capitalism running amok and corporate greed on Typographer.org, but at least we put our money where our mouth is. We made this booklet for the community, and now we’re giving back to the community. I hope this will be sufficient incentive to bid generously.</p>
    <p>I will add more details in this thread soon. For now, check this out…</p>
    <p></p><div class="imageWrap"><img src="files/Booklet_200.jpg"></div><br>
    * Yes indeed, although we shipped it in a protective envelope, sandwiched between two pieces of cardboard, the corners are ever so slightly worn. But I feel this only adds to its charm. You can actually <em>see</em> it has been places. ;^)<p></p>
