    <p>A few people saw the original <a class="freelinking external" href="http://typophile.com/node/67214" rel="nofollow">Silverback</a>, but now it's back from the drawing board. I was so excited about the results, I thought it could deserve a new thread. Thanks to Justin_Ch and riccard0 for their thoughts on the original.</p>
    <p>An all-caps face, Silverback was inspired by old stock certificates, bill heads, and other monetary documents.</p>
    <p>I'm in to process of importing the characters into a font program, so please excuse any spacing issues for now. I'm really just looking for thoughts on letterforms and how they work together (if they do at all).</p>
    <p>Here are the characters I have done so far, and the attached PDF includes some set text.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Silverback1_4760.png"></div><p></p>
