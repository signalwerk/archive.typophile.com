      <p>Thanks, for the awesome suggestions (and great diagram) Kevin.</p>
      <p>• That curve <em>was</em> messed up. I tried a few iterations of it and stuck with a cleaned up version of the original.<br>
      • Lowered the gap in the C. Better.<br>
      • Tried some variations with the 5 and came out with what's here. Using the caps of the Y proved to make it stick out like a sore thumb in the line up. I think it's different enough now that it doesn't bring on confusion.</p>
      <p>Now for the pesky T. I tried a few solutions and came out empty handed. But, it definitely isn't done. So, I've left it alone for now until a solution shows itself.</p>
      <p>It still has a long way to go, but here's where things are right now. I've also posted a new sample to the original post. Next up, punctuation and more characters.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Silverback3_6235.png"></div><p></p>
