      <p>I like this, it's fun. I think it would be helped by some refinement of this recurring curve:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/silv_crit_4008.png"></div><p></p>
      <p>I would lower the gap some in C, to avoid G-ness.</p>
      <p>The vast width of T might be a little offputting. You could try making the center stroke suddenly narrower at the top, like a table lamp, to make room to pull the sides in.</p>
      <p>To stop 5 looking like an S it will probably be necessary to do something to the top corners. Maybe take inspiration from Y.</p>
