    <p>Hi all,</p>
    <p>I've been trying to figure out some things about digital type in the early and mid-nineties. I have licensed sets of fonts from URW (not URW++!) and Bitstream. Both these contain ITC fonts, for instance ITC Symbol and ITC New Baskerville. However, these fonts have several differences; For one the kerning differs and the accents are mostly different. Here is an example, ITC Symbol from Bitstream and URW.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ITCSymbol_4569.jpg"></div><p></p>
    <p>Top is the Bitstream version, bottom the URW version. If I compare these to the fonts now offered by ITC on MyFonts, it seems the URW version is closer, whereas the Bitstream version seems to have more generic accents for it‘s fonts. My question is what was licensed from ITC? It seems only the outlines are the same. </p>
    <p>As far as I know URW and ITC used to work closely together in realising the ITC fonts, which were also sold by URW at the time. I don't know exactly what their collaboration amounted to, though I know they developed smallcaps fonts for several typefaces, including Mendoza and Symbol. When URW when bankrupt in 1994 the license agreement stopped, and seems to have gone to Elsner and Flake (former URW employees). This is why URW++ does not sell the ITC fonts anymore. Bitstream seemed to have a more straightforward licensing deal, which was ended when Monotype bought ITC.</p>
    <p>I'd love to have more info, or corrections, from those in the know.</p>
    <p>Thanks</p>
