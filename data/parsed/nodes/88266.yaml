      <p>In the years of photo and then in the early part of digital (I'm taking about 80s-early 90s), a lot of the ITC stuff was done at Mergenthaler-Linotype and later at Linotype-Hell (same company.. just merged with Hell Graphics). Mergenthaler took the supplied 'film strips' and 'film' letter forms, and adopted them to their grid (unit) system. Linotype felt they did a better job, because they examined all the 'control' characters throughout the family of weights, and made spacing and character proportion adjusted as necessary. The general consensus was that Mergenthaler did a very good, job. The joke on the inside was, why doesn't everybody just leave our stuff alone, like Mergenthaler, instead of changing things, when in fact, it was the other way around. And, we all know that Adobe came to Linotype for the Linotype version of all the fonts currently in use today. Or, I should say... most of them. There are always exceptions.</p>
      <p>As far as I know, URW licensed the fonts from Linotype, and as far as I know, should be the same. But then, Elsner &amp; Flake negotiated a licensing agreement to distribute Linotype fonts. I think, they might of made changes. I cannot remember the specifics. Maybe others can shed more light on this.</p>
      <p>And then, of course, in the early/mid-80s, Bitstream (created by former Linotype employees) started to create digital versions of the 'Linotype Library' for Camex and Scitex. </p>
      <p>An interesting previous thread about Bitstream...</p>
      <p><a href="http://typophile.com/node/904" title="http://typophile.com/node/904">http://typophile.com/node/904</a></p>
      <p>Anyway, Bitstream made many changes (improvements), because of the old Linotype antiquated (18) unit system, and added in their own accents. In some cases Bitstream went back to the original (well-known) designers and actually created a new digital version of the font family(s) with many aesthetic improvements.</p>
      <p>But, because they could not get Linotype's blessing, they had to adopt their own font naming scheme. It was actually a very good typeface naming solution. Later on, Linotype negotiated a deal with Bitstream... and all the fonts are still around, different names and different flavors.</p>
      <p>That's just about the extent of it. That's why all the differences.</p>
      <p>I hope this was helpful.</p>
