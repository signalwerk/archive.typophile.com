  html: |-
    <p><em>The New York Times Magazine</em> unveiled a redesign today. Aside from the magazine being "9 percent smaller -- a little off the top, a little off the sides" (as the editor wrote in his letter that doesn't seem to be online), there is a brand new type palette at work. "This week we are introducing a new typeface, <a href="http://carvalho-bernau.com/retailfonts/lyon" rel="nofollow">Lyon Text</a>, that was designed by Kai Bernau and Christian Schwartz and will be used exclusively by the magazine. It is more condensed than our previous typeface -- with the result that the words-per-page tally has hardly been affected. Perhaps if we hadn't mentioned it, you would hardly know the difference.... We are introducing new display-type faces -- <a href="http://www.typography.com/fonts/font_overview.php?productLineID=100013" rel="nofollow">Knockout</a> (by the studio Hoefler &amp; Frere-Jones) and Nyte (by the Portuguese designer <a href="http://www.dstype.com" rel="nofollow">Dino dos Santos</a>) ..."</p>
    <p>These three are joined by <a href="http://typophile.com/node/6774" rel="nofollow">Stymie</a> and Process Type's <a href="http://www.processtypefoundry.com/custom/sunday.html" rel="nofollow">Sunday</a> from the previous design.</p>
    <p>Scans below. Check out the link to Lyon Text above for more information and samples.</p>
    <p><strong>Page with Knockout, Nyte, Lyon Text, and Sunday</strong><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/NYT 1_5574.jpg"></div><p></p>
    <p><strong>Nyte by Dino dos Santos</strong><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/NYT 2_6438.jpg"></div><p></p>
    <p><strong>Lyon Text by Kai Bernau and Christian Schwartz</strong><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/NYT 3_5178.jpg"></div><p></p>
