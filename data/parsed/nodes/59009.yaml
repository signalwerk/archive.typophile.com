    html: "<p>\"What you are sure to have noticed is our new design. When we were told last winter that our dimensions were being downsized, we took a cue from Rahm Emanuel -- we muttered lots of words we aren't allowed to print, then saw how our 'crisis' might present an opportunity: a redesign. The magazine's look had not changed much during this decade, and for at least one good reason: We have annually won a raft of design awards, including the 2007 magazine-of-the-year-award from the Society of Publication Designers. But every object can use a bit of refurbishing now and then, and that is what our art director, Arem Duplessis, and his staff have done -- they've given the magazine a cleaner, more modern feel without changing who we are and what we do.\"</p>"
