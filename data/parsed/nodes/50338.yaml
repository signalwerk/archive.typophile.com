      <p>Why do we have to interpret questions?</p>
      <p>If the font is blockish, then it probably needs no kerning (or only a touch). But it will have to be properly spaced. I don’t think you want to auto-spaced the font. But the whole Uppercase alphabet could be spaced in a very short time.</p>
