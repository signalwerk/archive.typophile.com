      <p>Sorry if I have confused people, and hopefully I am writing in a manner that is clear and correct to wiser heads.</p>
      <p>I fully understand Terminaldesign’s opinion on kerning and laziness.<br>
      I am a Graphic Designer of many years and would hate a fully automated process that for instance, automated a t-shirt design, or a logo, or business card art, or web graphics, etc.</p>
      <p>But more my question was related to the things you can control.<br>
      Here’s a wider example, and hopefully this helps.<br>
      Say the font was regimented by being blockish and you wanted the same kerned relationship between all the glyphs.<br>
      Now we have 200 glyphs and within those 200 glyphs we have 59 different widths.<br>
      (The 200 glyphs fit into 59 widths)<br>
      And you know the same spacing you want across all 59 width occurrences, because however stupidly, you think it looks good!.</p>
      <p>So, is it possible to ask FontLab to look at all possible occurrences of all glyphs, irrespective of width, and equally kern them? Or doesn’t FontLab need to know the width to automatically kern fonts?</p>
      <p>Apologies, if I’m asking a stupid question. I’m learning and I just wondered if this was feasible. I already know that professional, individual (and time consuming) kerning of glyphs is the correct and professional thing to always do. Just wanted to know that if you had a regimented situation, was this possible.</p>
      <p>Thanks Again for any insights.</p>
