    <p>Hi guys,<br>
    I’m creating a font that’s quite ’blockish’ in shape (rectangular/portrait).<br>
    I’m learning as I’m working through FontLab Studio. Reading the Manual and practical work.</p>
    <p>I was wondering...<br>
    If I had a font that consisted of just, say Capitals A-Z and nothing else, and overall the glyphs were, say 5 different widths covering the 26 letters, is there a way to automatically ask FontLab to generate the same kerning width right across the glyphs, irrespective of the widths.</p>
    <p>I’m reading the Manual and trying to understand Auto Kerning, and I can do, and understand the kerning of pairs, but I cannot see where or how to ask FontLab to take in every eventuality when every unique instance of kerning would arise. Can FontLab do this by itself? (of course with me programing it in) Or do I need to kern every pair and their relationship to each other.<br>
    I’m reading and reading, but just probably need a wise head here to either show me a quick way, or the way they do it best.</p>
    <p>I hope I’ve made it clear, and haven’t confused you guys.<br>
    The more insights from you guys, the more I learn.<br>
    Thanks<br>
    Kind Regards<br>
    Drj</p>
