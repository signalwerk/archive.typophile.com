      <p>What I interpreted in the question is not so much “auto kerning” (though that’s the term Jack used) as “kerning assistance” or class kerning.</p>
      <p>A monospaced font would not need kerning. That would defeat the purpose.</p>
      <p>And I would think a ’blockish’ ’rectangular’ all-caps design would need minimal or even *no* kerning.</p>
      <p>So I’m not sure what the point of the question is exactly.</p>
