    html: <p>I don't know if this is a international law but in Sweden the copyright lasts for 70 years after the creators death. Since Edvard Munch died in 1944 the copyright will belong to Munch until year 2014. But the picture in Sprout isn't a copy of "The Scream", it's just a interpretation of the painting and then I think there are other laws that applies?</p>
