    html: "<p>I like the idea of the 515 partially cutout from a background like 1 and 4. Instead of settling on one concrete design, I'd focus more on choosing/creating a distinctive typeface for the text and numerals and using that as the common thread in all designs. That way, you can continually alter the background shape/image/what-have-you, without changing the distinctiveness of the logo. <br> <br>For example, if you took the \"studio 515\" from #4 and made the field in the shape of a red fireman's helmet, it would still be recognizable as your logo. Many companies do this when branding product, some even go so far as to change all parts of the design but the name itself. <br> <br>As for typeface recommendations, I'm a sucker for serif small caps. A nice Neoclassical or Lyrical Modernist face, with condensed italic numerals and standard-weight small caps for the text would look smashing, </p>"
    html_clean: "<p>I like the idea of the 515 partially cutout from a background like 1 and 4. Instead of settling on one concrete design, I'd focus more on choosing/creating a distinctive typeface for the text and numerals and using that as the common thread in all designs. That way, you can continually alter the background shape/image/what-have-you, without changing the distinctiveness of the logo. <br> <br>For example, if you took the \"studio 515\" from #4 and made the field in the shape of a red fireman's helmet, it would still be recognizable as your logo. Many companies do this when branding product, some even go so far as to change all parts of the design but the name itself. <br> <br>As for typeface recommendations, I'm a sucker for serif small caps. A nice Neoclassical or Lyrical Modernist face, with condensed italic numerals and standard-weight small caps for the text would look smashing, </p>"
