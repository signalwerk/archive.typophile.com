    html: <p>Because I'm targeting smaller local business, I didn't want to get too abstract. "studio" is really the only element that hints at what kind of company this logo is for. Besides, I've already registered studio515.com.<img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>I did try to emphasize the 515 element in some of the designs. I think BJ is right in that the right unique typeface would give these logos more individuality.  <br> <br>I'm trying to keep it simple and I don't have a lot of revision time. Is there any one design that that stands out above the others? Any problems or adjustments that could improve any specific designs? <br> <br>Thanks for all the feedback.</p>
