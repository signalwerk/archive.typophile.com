    date_raw: 21 Aug 2007 — 9:27am
    votes: null
    html: |-
      <p>I wonder why he's come to you and not say a local Australian type designer? Is he a fan of your work, or maybe he's just spamming a whole bunch of freeware designers that he thinks may work for less money than established vendors who do corporate work. Is the "specific design" he has in mind one of yours? If not I assume he's going to want you to do something that's similar to an existing font and indeed that seems like trouble. The way you describe it the whole thing does seem a bit fishy. </p>
      <p>Anyway re. pricing treat it like any other work for hire, ie. your hourly rate x expected number of hours plus additional fees / mark-up for changes.</p>
      <p>Cheers, Si</p>
    html_clean: |-
      <p>I wonder why he's come to you and not say a local Australian type designer? Is he a fan of your work, or maybe he's just spamming a whole bunch of freeware designers that he thinks may work for less money than established vendors who do corporate work. Is the "specific design" he has in mind one of yours? If not I assume he's going to want you to do something that's similar to an existing font and indeed that seems like trouble. The way you describe it the whole thing does seem a bit fishy. </p>
