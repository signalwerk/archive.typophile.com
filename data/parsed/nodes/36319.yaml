  html: <p>I just got an email from someone in Australia requesting a quote for a custom font family in two weights plus italics and "reasonable" extended characters. Says "I have a specific design in mind". This would be for exclusive corporate use. What is an appropriate range to charge for this sort of project? Since I'm based in the USA, what special considerations might be necessary for dealing with an Australian client?</p>
