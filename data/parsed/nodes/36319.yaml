    html: <p>Si- I suspect that is exactly what is going on. The actual email I got was just as vague as I described, and I have not yet replied. My only released fonts (learning projects made years ago) have been distributed at free font sites like <a class="freelinking external" href="http://1001fonts.com" rel="nofollow">http://1001fonts.com</a> and <a class="freelinking external" href="http://dafont.com" rel="nofollow">http://dafont.com</a> so, while he might think my fonts have some merit, it is likely he has contacted other free-fonters out there too.</p>
