    <div class="node-spam-content"><p>I am attempting to determine if there is a base font for the grunge letters in Press Letter A Dirty Stamped Font </p><div class="imageWrap"><img src="http://typophile.com/files/PressLetterOrigSM_5688.jpg"></div><br>
     <a href="http://wegraphics.net/downloads/http://wegraphics.net/downloads/press-letter-a-dirty-stamped-font/" title="http://wegraphics.net/downloads/http://wegraphics.net/downloads/press-letter-a-dirty-stamped-font/">http://wegraphics.net/downloads/http://wegraphics.net/downloads/press-le...</a><br>
    I cleaned up the letters <div class="imageWrap"><img src="http://typophile.com/files/PressLetterSM_3665.jpg"></div> and sent them to What the font which suggested FF Meta Serif Medium <a href="https://www.myfonts.com/fonts/fontfont/meta-serif/" title="https://www.myfonts.com/fonts/fontfont/meta-serif/">https://www.myfonts.com/fonts/fontfont/meta-serif/</a> which is somewhat similar.<br>
    I wonder if there is anything closer?<br>
    Thanks<br>
    Don<p></p>
