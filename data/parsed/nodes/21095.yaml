      <p>Slighty OT</p>
      <p>Does anyone here have any information about <a href="/wiki/Jock%20Kinneir" class="freelinking" rel="nofollow">Jock Kinneir</a> and <a href="/wiki/Margaret%20Calvert" class="freelinking" rel="nofollow">Margaret Calvert</a>'s <a href="http://en.wikipedia.org/wiki/Rail_Alphabet" target="new" rel="nofollow">Rail Alphabet</a>?</p>
      <p>In the mid 70's I went to Maidstone College of Art in Kent, UK. I recall lots of British Rail brand guideline posters all over the walls in the commercial design studio. In those days, I was committed to drawing, painting and latterly, photography and had little more than a passing interest in graphic design and typography.</p>
      <p>Given the quantity, and quality, of material on the walls, I suspect there was a connection between the design team and the college.</p>
      <p>I wish I had paid more attention at the time.</p>
