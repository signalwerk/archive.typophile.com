    <p>Logo for a company working on systems to improve and enhance patient/doctor information and decision-making.<br>
    No red cross, so maybe a shepherd’s crook/ankh/cross symbol (Balance “f”)<br>
    with co. name. </p>
    <p>Surgical green. (green is the color of the academic hood for medicine)</p>
    <p>All comments appreciated.<br>
    Thank you.<br>
    John</p>
