    html: |-
      <p>I just remembered that there was an optional method in which a small machine scanned the layout and created a stencil or printing plate from that scan. </p>
      <p>If I remember correctly, that method reduced the overall quality slightly, but it made it easier to produce more complicated layouts and/or include illustrations. (If you produced the stencil directly on your typewriter without a scanner, illustrations needed to be drawed directly on the stencil, or else you needed to purchase pre-made stencil illustrations that were then cut and pasted into the stencil. I did that occasionally and it was a pain.)</p>
      <p>Since the scanning method required the purchase of a special scanner, it was probably used mostly by larger organizations that could afford the extra expense.</p>
