    html: |-
      <p><cite>Perhaps there were different types of mimeographs.</cite></p>
      <p>I never handled the printer but I am fairly sure it could be used as a mimeograph, i.e. you could put directly the typewritten waxed paper on it and print; that's how most handouts would have been produced. However, for our newspaper,   what was typed on the waxed paper was transferred onto a plate; the same machine would then be used as an offset printer. I googled and found no reference on such machines that could do both. So far as I understand, when used as a mimeograph, the ink would have to be put inside the barrel; if a plate is used, the ink needs to be put somewhere else, I guess. I dont' remember that there were two printers but maybe it was so (the year was 1964-1965).</p>
