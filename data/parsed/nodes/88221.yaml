    html: |-
      <p>&gt;  mimeographed ... some chemicals to transfer what<br>
      &gt; was typed onto a metal sheet </p>
      <p>Perhaps there were different types of mimeographs. In my first job I had to mimeograph a weekly newsletter and no metal sheets or chemicals (except ink) were involved.</p>
      <p>I removed the typewriter ribbon and typed on a stencil, which felt like a sheet of waxy paper. The typewriter punched through the stencil's waxy layer, but a bottom layer which was permeable stayed intact. Then I wrapped the stencil around an inked drum. The ink would ooze through the areas cut out by the typewriter.</p>
      <p>The waxy stencil would deteriorate after printing a few hundred copies. Perhaps the metal sheet you mentioned was used in jobs where more durable materials were needed to print larger quantities.</p>
    html_clean: |-
