    <p>I'm doing an event poster for a homework assignment. </p>
    <p>The topic is an S&amp;M street fair, the 'Folsom Street' fair as subject. </p>
    <p>Anyone know a good solid display face that in your opinion could be tweaked for these purposes? </p>
    <p>I'd rather work with some more known faces, then tweak them to my own ends...</p>
    <p>Here's the current mark as it stands. </p>
    <p>any thoughts are appreciated...</p>
