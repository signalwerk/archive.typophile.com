    <p>Hi there:</p>
    <p>One can easily say Akira Kobayashi's AXIS sans is a beautiful distillation of Frutiger and Meta. Does it surpasses those types? Decide for yourself.<br>
    TypeProject is releasing trial versions of the regular and condensed styles. </p>
    <p>I'm sure you'll see, like I have, AXIS presents text clearly, friendly, and yet is a fresh take on familiar informational type designs .<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/akira2_4745.png"></div><br>
    <a href="http://www.typeproject.com/product/file/axis_cond_joyo_chars.pdf" title="http://www.typeproject.com/product/file/axis_cond_joyo_chars.pdf">http://www.typeproject.com/product/file/axis_cond_joyo_chars.pdf</a><br>
    <a href="http://www.typeproject.com/product/file/axis_joyo_chars.pdf" title="http://www.typeproject.com/product/file/axis_joyo_chars.pdf">http://www.typeproject.com/product/file/axis_joyo_chars.pdf</a><br>
    <a href="http://www.typeproject.com/product/download.html" title="http://www.typeproject.com/product/download.html">http://www.typeproject.com/product/download.html</a><p></p>
    <p>Use Google Language Tools to help you navigate the site.<br>
    REMEMBER THIS IS A TRIAL- YOU WILL HAVE TO DELETE THE FONT FILES FROM YOUR MACHINE AFTER THE TRIAL IS OVER!</p>
    <p>Mike Diaz :-)</p>
    <p>PS... Wouldn't it be nice for a latin only version of these type?</p>
