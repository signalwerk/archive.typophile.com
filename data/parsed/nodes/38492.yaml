    votes: null
    html: |-
      <p>Type Project has a plan to retail Latin only versions of AXIS. So now we've been designing Italics, Small caps, Old style figures and some ligatures. We've also got some requests about the Italics and Small caps from users. If you have any request about AXIS, let us know and refer to it.<br>
      Unfortunately, we are tied up with a lot of high priority projects now, but we try to release Latin versions as soon as possible.</p>
      <p>I enjoyed Akira Kobayashi's lecture. The lecture had three parts. The first was the Alphabet logotype critiques. Akira critiqued the logos which were designed by active young graphic designers. Akira exchanged ideas and opinions with each designer and refined the logo with every designer on stage. I was excited about hearing each person's opinion. Akira mentioned his opinion from type designer's point of view, on the other hand, every designer had a concept designing his/her logotype as a graphic designer.<br>
      Second, Akira showed his works such as Avenir Next, Palatino sans and explained what the appropriate letter form of geometric sans serif is. He compared the O of Avenir Next with a perfect circle form and explained the difference of the two forms.<br>
      The third part was the talk session with another two graphic designers.<br>
      And at last, Akira answered the questions that the attendees asked him about the type, the letter forms and so on.<br>
      There were about three hundred peoples in the lecture room. It's hard to get a ticket of his lecture recently. I was lucky to join it.</p>
      <p>Thanks.<br>
      Kunihiko Okano</p>
