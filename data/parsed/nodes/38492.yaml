      <p>Hi Mike,<br>
      Thanks for your introduction.</p>
      <p>Isao Suzuki (Type Project founder) asked Akira Kobayashi to design the Atlphabet parts of AXIS before Akira worked for Linotype. So all Latin, Greek and Cyrillic parts of AXIS standard ver. designed by Akira Kobayashi. And I've expanded the family of AXIS Condensed and Compressed version after Akira went to Germany. We've been preparing to release AXIS Compressed by the end of next year.</p>
      <p>The Greek and Cyrillic are included in Japanese font, which is not for a body text but for a symbol like math and so on. So I guess it's hard to set a body text using the Greek and Cyrillic parts. Besides, the width of them are mono and 1000upms.</p>
      <p>Yes, Nintendo Wii uses AXIS font in Japanese text but it is combined with Avenir in Latin part. And Apple store Japan also uses AXIS Fonts but of course, the Latin part is Myriad.</p>
      <p>BTW, I'm going to attend Kobayashi's lecture today.<br>
      I'm looking forward to hearing it.</p>
      <p>Thanks.</p>
      <p>Kunihiko Okano</p>
