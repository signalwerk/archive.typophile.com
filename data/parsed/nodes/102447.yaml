  html: |-
    <p>I wonder how <em>Roboto</em> should be classified. Is it a grotesk, a geometric sans serif, a humanist sans serif? In any case it is a lineal sans serif, but I am wondering about the contextual category.</p>
    <p>If you ask me, it’s a hybrid, with classicist grotesk (lowercase a and as, and uppercase S, C, G) with elements of a humanist sans serif (lowercase e, g, etc.). What do you think?</p>
    <p><a href="http://www.fontsquirrel.com/fonts/roboto" title="http://www.fontsquirrel.com/fonts/roboto">http://www.fontsquirrel.com/fonts/roboto</a></p>
