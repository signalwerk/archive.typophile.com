    html: <p>I posted it in context of my own work on Hikari and criticism my announcement received, about it being a “neo grot”. I found it refreshing and interesting that other designers are not caring too much about classification and more about design principles they apply, a result of research and conclusions they draw while examining the environment where their fonts will be used. I find this approach similar to my own goals, as I am designing Hikari for screen applications and not just for print. I have even thought about a user interface version for mobile devices.</p>
