      <p>Well, one thing I don't agree with is obsessing over classification. :-)  But mostly -like I said in my Typographica comment- when I see it on my Galaxy Note 2 it just works - at least in that context. Hunting down "historical impurity" is for inquisitionists. Everything is hybrid.</p>
      <p>There's also something quite awesome about Roboto: it's under the Apache license, not OFL; the former allows the selling of modifications. In the end this means more designers can justify helping more people.</p>
      <p>hhp</p>
