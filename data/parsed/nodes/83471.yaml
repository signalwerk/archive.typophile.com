      <p>Sure, I just ran a proof off my printer and noticed a few other things:</p>
      <p>• Terminals on lowercase a and c don't match. The a has a steeper slope, the c is more horizontal. Check the e and g and s too. I won't say what my preference is.<br>
      • Top arms of K and k aren't quite in harmony yet — the angle looks rather shallower on the lowercase.<br>
      • As well as being slightly too dark, I think the caps generally could be a bit too wide.<br>
      • Cap X needs a little more offset between the two strokes. Lowercase x looks rather wide.<br>
      • Join of Y may be a little too low (top counter is large).<br>
      • Draw the flag of 1 out more, it's too short.<br>
      • 2 and 3 may need more hood, try bringing it round slightly more. Compare to the openness of c.<br>
