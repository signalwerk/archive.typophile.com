      <p>New PDF spec sheet at top!</p>
      <p>Thanks Bendy! I appreciate your critique! Let me apologize for the state of the /&amp;/, I haven't been working that hard on it, but i will be improving it. You have not deterred me in the least!</p>
      <p>To begin with the Cap-hight versus ascenders, (to quote Samuel Johnson) “Sheer Ignorance.” I started it as such and i thought it looked good and different..</p>
      <p>The reason my /a/ is flabby is because I trying to make a distinctive /a/ letterform. When I started the typeface, i was scribbling letters and I made an /a/ that looked like this..<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/a_3796.png"></div><br>
      It didn't do well in anything other than very large display sizes, and even then It was very grating to look at, so I adapted it to what it is now so that it would feel like the letter i made originally, but be more accessible.<p></p>
      <p>I do realize that most type begins narrower and is re-drawn for extended sizes, but I saw <a class="freelinking external" href="http://new.myfonts.com/fonts/font-fabric/gabriel-sans/" rel="nofollow">Gabriel Sans</a> and I loved how it was natively set extended. This font is still largely inspired by Gabriel Sans: It is fairly mono-line, is natively extended, and I believe it mixes humanist with grotesk (which I didn't realize I was doing when I started this face).</p>
      <p>I think you're right, I haven't really decided if it is going to be display or body or logotype.. I think it would be a strong typeface for display and headlines.<br>
      Maybe some other time I could condense it so it can also be a body-text face</p>
      <p>What changes should I make for this typeface to be effective in display and headline settings? I can make the caps less extended if they are too pronounced, i thought it was interesting character, but it might only be disregarding rules of Type, yielding unattractive results.</p>
