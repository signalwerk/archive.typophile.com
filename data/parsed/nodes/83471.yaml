    html: |-
      <p>Another core principle of font design is:<br>
      The counters (inner white spaces) should have same volume  (or LOOK like that) across all lowercase or uppercase. In other words, optically there should be equal amounts of inner white space in /b/, /o/, /e/, /n/ etc.<br>
      Right now, /b/ seems too wide, /e/ seems to dark.</p>
