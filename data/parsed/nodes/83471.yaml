      <p>What Bendy said: knowing the intended purpose of typeface is crucial.<br>
      Display typefaces are used at larger sizes, so every inconsistent curve or black spot is more visible.<br>
      Big sizes allow room for details - use that.<br>
      But space in headlines or posters are quite limited, so you need to make your font economical.</p>
