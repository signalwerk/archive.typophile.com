      <p>First thing that catches my eye is /a/. It's bowl seems unbalanced and middle horizontal bar needs more logic: why is it a curve when other bars are straight? If it's intentional, then why this angle? Such questions about style's unity are irritating the unconsciousness - like Arial's unknown angle terminals :)</p>
      <p>Can't see the combos here, but /J/ seems too wide. Try /LJ/ or similar pair to test.</p>
      <p>Is /m/ made from 2 unchanged /n/'s? It might work to condense it a bit.</p>
      <p>/t/ bar's right edge most of the times is supposed to be same width as a terminal.</p>
      <p>/G/ angled leg is the only such one. Again - breaking the stylistic unity. </p>
      <p>/M/ middle connection is a no-no.</p>
      <p>And it's better to upload curved .pdf's - that way people can zoom in at desired level in browser - no need for an image app.</p>
      <p>Interested to see darker weights :)</p>
