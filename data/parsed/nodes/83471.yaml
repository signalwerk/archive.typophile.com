    <p>Magenta is an extended geometric sans serif typeface designed for legibility at larger sizes (not sure about body text).</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/mag_3894.png"></div><p></p>
    <p>This is my first type design, and i'm excited to hear how to make it stronger.<br>
    Please, critique every last thing, because this needs some work, specifically width of characters, styling, width of strokes, everything.</p>
    <p>I drew from typefaces like Gabriel Sans, Salvo Sans (esp. Salvo Sans Black), maybe Neutraface (subconsciously hehe), Futura, Gotham.</p>
