      <p>The upper one is new? Top of the bowl now connects with the new /d/ counterpart, but that's it. In this sample it stands out by not being geometric and by not having a straight line like other letters do.<br>
      If you decided to change it because it <cite>"didn't have a tension or interest anywhere in it"</cite>:<br>
      If there's only one advice any artist or designer of any field should take, it's <strong>"CONTRAST"</strong>. Because it gives the tension, and tension gives the interest.</p>
      <ol>Dark vs Light<br>
      Big vs Small<br>
      Static vs Dynamic<br>
      Sharp vs Blurred<br>
      Grid vs Chaos<br>
      <strong>Straight vs Curved</strong>
      </ol>
      <p>Sure, the new /a/ may be easier to identify from /e/, but we're back to square one: Why such angle? Why not curved /e/?<br>
      If you want to add more "tension" (I don't like to use fancy words) to old /a/, you can try raising or lowering the middle to change counter's proportions. So they are less equal in volume (big vs small).</p>
      <p>P.S. /h/ too wide...</p>
