      <p>/m/ is too condensed.<br>
      /y/ right bar is too dark.<br>
      /t/ bar and /r/ terminal heights don't match.<br>
      /t/ bar looks darker than /e/'s.<br>
      And I still would condense /d, p, q, b/. Letter /o/ should be the widest of them. </p>
      <p>I know how in beginning it is fun and easy to work with modular constructions (o+l = b, d, p, q) (n = u, r, m), but it hurts legibility and most important (especially for such semi-modular, non-decorative fonts) makes them less warm and interesting. My two cents.</p>
