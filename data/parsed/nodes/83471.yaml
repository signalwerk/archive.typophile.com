      <p>Now /a/ looks way better!</p>
      <p>/M/ short middle connection creates an optical illusion of diagonals getting narrower in the middle. It makes letter look fragile too.</p>
      <p>To human eyes, same width horizontal lines look darker than verticals. So there is balance work need to be done. Some examples:<br>
      /H/ bar and /b/ bowl top/bottom look darker than verticals.<br>
      /A/ bar looks narrower than diagonals.</p>
      <p>/&amp;/ "falls" to the left.<br>
      /1/ is too short :)</p>
      <p>Use some <a class="freelinking external" href="http://www.whatfontis.com/" rel="nofollow">font identification service</a> and always keep looking look for analogues (similar fonts) everywhere:<br>
      1. It helps to avoid unintentional copying.<br>
      2. Analysing analogues helps solve various problems and questions about your own font.</p>
