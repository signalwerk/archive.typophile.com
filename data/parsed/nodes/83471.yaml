    html: |-
      <p>This is a good starting point. All the above is important. I would go for Display. Text fonts simply require a greater understanding of lettershapes, proportions and balance. Display type doesn't have to be flawless, though off coarse, that's what you should aim for.</p>
      <p>Give S more whitespace at the top area.<br>
      Make the terminals in C end at the same horizontal point.<br>
      Try adding a vertical (not horizontal crossbar) to C, to make G. I'm not saying it's better, but you should at least try it. It usually looks cleaner.<br>
      E F K M N P R U slightly narrower (10-20 units)<br>
      Consider a descending tail in J (goes below baseline). This also requires a different structure for the tail itself. Right now, J causes a huge white gap.<br>
      O and Q need slightly more overshoot.<br>
      Complete the numerals. Good numerals are important!<br>
      Extend the top terminal in G towards the right.<br>
      Move the lef of R towards the right.<br>
      I prefer /I/ without horizontals, but it's your choice. Look at the context.</p>
      <p>Move the most left nodes in the bowl of /a/ down.<br>
      k might scare away potential buyers/downloaders.<br>
      Lift the dots (tittles) at i and j up.<br>
      s same as S<br>
      n m h slightly narrower (5-15 units)</p>
      <p>Move the top bowl of &amp; to the right<br>
      Please have a look at some other options for the comma and quotes. It needs to be cleaner.<br>
      @ too light<br>
      Move top of ? to the right.</p>
      <p>MIND THE OPTICALS!</p>
      <p>From now on, drop the measuring tool and trust your eyes. STARE, change, STARE, change, STARE, -coffeebreak-, STARE, change, untill ALL STROKES appear to have the same thickness. Sorry for my poor use of ALLCAPS :-P</p>
      <p>Pay special attention to diagonals, and make sure you're zoomed in enough to avoid rendering issues. </p>
      <p>Keep going.</p>
      <p>Cheers,<br>
      Jasper</p>
