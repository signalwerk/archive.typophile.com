    html: |-
      <p>Hi Mark, I was going to give some crit but I think you are doing very well without...often you'll find as you work recursively through the glyphs you'll automatically be balancing the forms to better fit together, and I think you're doing exactly the right sorts of things. </p>
      <p>If you want my opinion, my main concern would be that the overall aim of the face is not clear enough. I'm not sure if this is intended as a text or a display font. Thinking through what you want the face to do will help fix the brief and determine some of your choices. For example, what's the thinking behind the ascenders being lower than the caps? I'm very much for experimentation, but something this fundamental could restrict the usefulness for some people. I'd want to put the font into the intended typographic space (a paragraph, headline, poster, website, logotype) and see how it looks before settling on these sorts of parameters. Another thing I'm struggling with is the width...is this planned to be an extended width to go with a narrower cut? Normally one would draw the regular width first, as an extended cut would be less suitable for extended reading, and therefore difficult to appraise in its own right.</p>
      <p>I'm intrigued by the way you're blending humanist and grotesque influences here, something I'm quite keen on myself. </p>
      <p>If this is merely an exercise in drawing letterforms, at the next level of detail I'd suggest:</p>
      <p>Your K and k need some attention as they're not harmonious.<br>
      I can see you're attached to the shape of your /a/, but I'd suggest making the curves tauter, more defined and less flabby.<br>
      e does look a little wide to me.<br>
      I'd make f and t wider.<br>
      G has a very dark spot.<br>
      Bowl of R is rather large.<br>
      Curves and proportions of ampersand are bad.<br>
      Curves of B don't quite harmonise with the other bowls.<br>
      Does I need to be so wide?<br>
      The bowl and stick letters still look dark and spotty around the spurs; as the triangular notches are rather shallow, I'd suggest simply pushing their vertices further in towards the bowls.<br>
      Numerals look interesting, maybe try bringing in some of that funkiness to the alphabetic characters?</p>
      <p>I hope this doesn't put you off, as I can see you are developing an eye for good curves and I think this has potential.</p>
