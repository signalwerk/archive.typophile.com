      <p>Really not bad for a first go! I'm not a pro so take my comments with plenty of salt and sugar. </p>
      <p>I'll come back later in a day or three with a more expansive crit, but there are two main things that poke my eye. Spacing is too tight and rather uneven. I'm only slowly learning spacing myself, but I reckon you can open it up a lot more, even for large sizes. The other thing is the stroke thickness. On the whole, it looks rather monoline, which I'm guessing is what you wanted. But look carefully at /b/ for example, and you'll see that where the bowl meets the stem, there are quite dark areas that mess up the overall colour. I can see you've already noticed how your inspiration typefaces have dealt with that problem, but I'd take it a little further.</p>
      <p>Ok, two more observations. You've angled the top terminals of K and N but not L. (And similarly on I but not T.) I don't understand the logic, and frankly don't think the angled bits add much to the design and personally I find it distracting. Following a similar idea, look at the terminals of your uppercase and lowercase Cc and Ss...the counters in one case are much more open and the angles are cut differently.</p>
      <p>Ok, those are my general observations. Hopefully I'll be back to think about individual characters.</p>
