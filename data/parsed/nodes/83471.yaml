      <p>Anchors? Here you're talking about nodes and control handles. Anchors have a different meaning in FL.</p>
      <p>First, the top and bottom counters are way too different in area. Second, try slimming the overall shape somewhat. Then thin the join of the bowls. Then I'd make the curves more approximate a circle (overlay some circles in the mask layer for example), but only slightly. Ideally you want to share out the tension in the curves equally between the two control handles.</p>
    html_clean: |-
