      <p>Hi Mark, I'm sorry I don't have the chance to look thoroughly at this for the next few days, hopefully at the weekend I'll have a bit of free time. In the meantime, think balance, contrast and tension...if you manage to make every decision based on those lines of reasoning, you'll be going a very long way. This is a real improvement, and it shows a lot of promise. </p>
      <p>One thing for now is that you've got very unusual proportions between the uppercase and lowercase. I think this can work but look what happens with 'Ma' in terms of the comparative counter spaces between this version and the previous one. Also, check the lower join of the bowls of /d/ and /a/ for consistency.</p>
