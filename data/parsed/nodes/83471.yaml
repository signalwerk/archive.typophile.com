    html: |-
      <p>I think you're definitely starting to get a rhythm and evenness that wasn't there before. </p>
      <p>I may have said this before but I think you could afford a little more thinning at the stroke junctions, which are still looking a little too dark. I'd suggest also that there could be a fraction more difference between the verticals and horizontals. See what happens if you reduce the sections of /p/ at 12 and 6 o'clock by a couple of units. Of course that might just be my eyes.</p>
      <p>I'd pull the tail of the /a/ into a tighter curve. (Compare with /t/.)</p>
      <p>Look carefully at /v/. The right side looks heavy because we're used to seeing a bit of contrast on this letter. Even a monoline face needs to forget mathematics. Similarly the /o/ looks ever-so-slightly dark at 10 and 5 o'clock to my eyes.</p>
      <p>Curves of /s/ look a bit loose. (Compare with the bowl of /a/.)</p>
      <p>Is /j/ too narrow?</p>
      <p>Remember this is all very subjective, the best advice is just to keep rebalancing the letters with each other. It's a very recursive process, as I think you have realised. :)</p>
