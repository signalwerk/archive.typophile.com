    html: |-
      <p>Thanks Eimantas! The font identification program gave me a lot of grotesk fonts and Antenna light (I’ll take that as a complement..)</p>
      <p>something that I don't quite understand is shaping of the bowls of the /dbgqp/.. should they follow more after the curves of /a/, or more after an /o/? or is it a sliding scale between them both to make continuity and distinctive style:</p>
      <p><a class="freelinking external" href="http://myfonts.us/td-LHuPrv" rel="nofollow">Cillian</a> seems to match the the curves of /d/ to /a/, as does <a class="freelinking external" href="http://myfonts.us/td-jejwCv" rel="nofollow">Antenna</a></p>
      <p>however, neither <a class="freelinking external" href="http://myfonts.us/td-rRErC3" rel="nofollow">Gabriel Sans</a> nor <a class="freelinking external" href="http://myfonts.us/td-Crm91b" rel="nofollow">FF DIN</a> does so, in favor of more conventional letterforms (Grotesk-esk) all the while not pushing letters to unusual or uncomfortable appearances.</p>
      <p>It seems the former makes typefaces that are distinctive, since traits are carried through to more letters, while the latter make more “accessable” typefaces since they are more usual. If my purpose was to have a recognizable typeface, but not to the point of uncomfortable letterforms, which side should i err toward?</p>
      <p>Also, how does the darkness/line-thickness of /o/ look when compared to the rest.. I'm not sure if it's too dark or not.</p>
