    html: <p>When you design, anything really, you want to make it LOOK in a certain way. By not applying optical correction, you make it LOOK as if the strokes don't have the same thickness. Nobody cares if they ARE the same thickness, if they don't LOOK that way. Something's been done in the past without optical correction, that doesn't mean it's good. I can't think of any good reason for you to make the strokes LOOK different in thickness.</p>
