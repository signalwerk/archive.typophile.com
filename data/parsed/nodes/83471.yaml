    html: |-
      <p>Nice work on /j/. I just would shorten the hook a bit to differentiate from /t/ and /f/.</p>
      <p>/f/ right side of the bar has to be aligned with terminal. Same goes for /t/. </p>
      <p>About /e/ width - again, the equal inner space is the waypoint. And it looks almost fine as it is now. When put along /a/ it looks    s l i g h t l y    bigger, so it may help to narrow /e/ a bit. But it's nitpicking.</p>
      <p>/K/ has problems:<br>
      Middle diagonal is too thick and it's height doesn't match capital height.</p>
      <p>Try raising /R/ bowl to differentiate from /P/.</p>
      <p>Is /L/ bottom bar as long as /E/ counterpart? If yes, it needs to be shorter. /L/ naturally has a too much white space, so we need to solve that.</p>
      <p>Both of /A/ counters have to share the same optical volume. The bar needs to be lowered.</p>
      <p>P.S. There are lots of methods for spacing, most of them start with two symmetrical letters: /o and n/ /H and O/.<br>
      Start with /n/ - space between two letters should NOT be similar to bars or counters.<br>
      Then start to incorporate /o/: nnonn nnonon nnoonn nnnonoononnon.<br>
      This initial spacing is the most important, don't be afraid to spend a lot of time on it. This is your foundation for all other letters. You will not enjoy respacing everything because of improper beginning.</p>
      <p><strong>Important</strong>: When doing metrics, use as big letters as you technically can (pixel distortion). Also keep moving away from monitor and x-flipping everything. Squint your eyes, look slightly above letters and see whole sequence as one element.<br>
      Set a value and then undo. Did it look better, worse? Look for inconsistencies to remove.</p>
