      <p>Dan X. Solo's fonts in his big catalog are indexed by the "Solopedia" <a href="http://abfonts.freehostia.com/solopedia/" title="http://abfonts.freehostia.com/solopedia/">http://abfonts.freehostia.com/solopedia/</a> which includes any known alternate names for the ones that he used. the fonts _Romany_ or _Jugenstil_ are included, but there is no information as to original names or digital versions.<br>
      Based on style features, such as the tilde shaped center bar on E and the lazy a, I date them to the decade before the Great War of 1914-1918.<br>
      Don</p>
