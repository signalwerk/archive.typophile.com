    <p>I've been trying to identify the foundry this came from for over a year, to no avail. I originally found it in one of Solo's catalogs under the name Romany. The same catalog also shows it in condensed form as Jugenstil. I have a photo, probably from eBay, of about a half-dozen letters of the same font, but it isn't named. At the least the photo does prove it was of metal origin but all the source material I can access doesn't show it.</p>
    <p>I'm guessing it to be circa 1920-30 or so, although given what Solo collected it could be much older. Anyone's help would be appreciated.</p><div class="imageWrap"><img src="http://typophile.com/files/Romany_font_5709.jpg"></div><p></p>
