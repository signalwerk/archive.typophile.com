      <p>@Mike, thanks for the offer of the scan, but I have the complete alphabet. I discovered the font was also released by an unknown 2" film-font company pre-1990, so I have it from a local company's old specimen book.</p>
      <p>I think, but cannot be certain, that I have seen the font in another of the old film-font books. What I was most surprised to discover is that Photo-Lettering Inc. did not show it in their vast collection from the 70s. It is a nice display face.</p>
      <p>Someday I hope its history will turn up.</p>
