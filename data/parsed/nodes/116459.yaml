      <p>If you are looking to find the complete alphabet, this is shown in the Art Nouveau Display Alphabets book by Dan Solo, published by Dover. They never tell you the foundry. I think this is earlier than you suspect, and is probably 19th century if Solo groups it in Art Nouveau.</p>
      <p>It is not in the Dover book  "Treasury of Authentic Art Nouveau Alphabets" by Petzendorfer, which would have named the foundry.</p>
      <p>If you need a scan of the alphabet, I can make one for you.</p>
      <p>- Mike Yanega</p>
