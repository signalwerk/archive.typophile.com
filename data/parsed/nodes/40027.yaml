  html: |-
    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 12.Dec.2007 1.32pm </div>
      <p>Magazines are dead!<br>
    Long live the Magazine!</p>
    <p>The thriving world of twenty-first century magazine design</p>
    <p>One-day conference, Friday 25 January 2008.<br>
    10.00am–5.30pm</p>
    <p>Following hugely popular events focused on newspaper and book design the next one-day conference at St Bride will explore the past, present and future of magazine design. Speakers will include Tony Chambers (wallpaper*), Luke Hayman (New Yorker, Time), Jeremy Leslie (author of magCulture and design director at John Brown), William Owen (author of Modern Magazine Design), Paul Rennie (Central St Martin’s) and Simon Esterson (Blueprint, Eye).</p>
    <p>Tickets £60 (£35 concessions).</p>
    <p>You can book online: see <a href="http://stbride.org/event/magazinesaredead" title="http://stbride.org/event/magazinesaredead">http://stbride.org/event/magazinesaredead</a><br>
    Or, contact St Bride Foundation: <a href="mailto:info@stbridefoundation.org">info@stbridefoundation.org</a> / +44 (0)20 7353 3331</p>
