    html: <p>This font is <span class="caps">WTC</span> Favrile. It was in one of the Expresiv collections as “Fascinate”. It was designed by Tom Carnase in 1985 for the World Typeface Center. The book I have showing it says Autologic and Linotype also sold it, but this was a book published 13 years ago (Modern Encyclopedia of Typefaces 1960 — 1990, by Lawrence&nbsp;Wallis.)</p>
