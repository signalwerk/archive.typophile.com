    <p>Hey Everyone</p>
    <p>I wanted to get some feedback on my UI redesign for oDesk's Test Results/Certificate page. It's my first UI design for a high traffic website.</p>
    <p>Current:<br>
    <a href="http://www.odesk.com/exams/Certified-English-Sentence-Structure-Experts_81555" title="http://www.odesk.com/exams/Certified-English-Sentence-Structure-Experts_81555">http://www.odesk.com/exams/Certified-English-Sentence-Structure-Experts_...</a></p>
    <p>Updated:<br>
    <a href="http://www.rosem.com/work/odesk/code/" title="http://www.rosem.com/work/odesk/code/">http://www.rosem.com/work/odesk/code/</a></p>
    <p>Basically they wanted the page to be more "certificate like", without being too cheesy. Simplicity and limited image usage was also a priority.</p>
    <p>Thanks,<br>
    Mike</p>
