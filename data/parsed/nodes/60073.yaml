      <p>I really like how you eliminate and invented new letter anatomy. f seems like it doesn't belong to the group, it look very normal. c look like e, h and k are hard to identify (or is there is no k, just two h ?). is there two n too? a and n look kinna similar, what if you eliminate the extension on top of a ?</p>
      <p>I think adding counter space (like the white circle dot of b and a) is just ruining the look. Perhaps, for example letter b, you could draw a thin vertical stroke with curve end from where the intersection of the bowl and the vertical stroke down to the white dot, about half way to the white dot, you might like it, or not ... i really like g, and the word: hills.joins is kinna hard to read, look like joms because only i and m are touch.</p>
