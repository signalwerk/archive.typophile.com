      <p>Since you don't have much of the letter counterspace, that's hard to recognize the silhouette of the whole letter before look at the anatomy of the letter. For example, lot of letter look like 'o' if you take their counterspace away, like a c, e, s, they all 'ball' up in a round shape. Maybe a little more counterspace will help to define and distinguish them from each other, like how you did to letter h and k, m and n.</p>
      <p>Seem like not many ppl like to comment on this typeface. Is it gonna release for free? I think it'll be fun for other designer to play around with it.</p>
