  html: |-
    <p>Any help would be appreciated, and feel free to be brutal!</p>
    <p>I'm trying to make a poster-sized fat face that has its base in the geometrics that Non-Format and such use, but with a feminine and humanist feel (e.g. Odile). I started out trying to add this curly bifurcated serif, and have been steadily trying to calm it down, but am definitely getting stuck.</p>
    <p>Commentary I've already received -- add countershapes .... I'm reluctant to do this, because I feel it loses a bit of the power and contemporary feel. It feels like it starts to go cartoony, Gills Sans UltraBold territory. To do small dots, like Christian Robertson's TypeBattle 28/Defiant doesn't seem to fit here either.</p>
    <p>But maybe I'm wrong. Anyways, feel like I'm just nudging around without making a bold move, so any insights would be great, thanks!!!!!! </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophile_post_1_3575.png"></div><p></p>
