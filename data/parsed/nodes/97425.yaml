    <p>Follwing the popularity of the Fontli app on iPhone, we have released Fontli on the Windows Phones (<a href="http://www.fontli.com" title="www.fontli.com">www.fontli.com</a>) ! And with an all-new smashing user Interface! The first truly typography-related application on the Windows app store! Now you see why we are so excited!</p>
    <p>The user interface has been completely revamped to use the best of what Windows platform has to offer: the Metro UI. Check out some of the screenshots  here <a href="http://www.windowsphone.com/en-us/store/app/fontli/0d09f01f-17de-4757-b63c-a1cb32fbd655" title="http://www.windowsphone.com/en-us/store/app/fontli/0d09f01f-17de-4757-b63c-a1cb32fbd655">http://www.windowsphone.com/en-us/store/app/fontli/0d09f01f-17de-4757-b6...</a> and you will see they are anything but a clone of Fontli on the iPhone.</p>
    <p>What makes us even happier about being on Windows is Microsoft’s own enthusiasm about typography; expressed quite clearly through the unique and bold Metro UI. It is fitting therefore, we felt, to have our font-lovers’ app available on their app store.</p>
    <p>So those with an iPhone or a Windows Phone, do download your copy and share your type love!</p>
