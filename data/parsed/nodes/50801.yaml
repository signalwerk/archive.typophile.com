      <p>I’ve had to work with low resolution photos before, and the way I got around it was by cropping out the main focal point (yes, making them even smaller) and then popping these elements into the text with a text wrap around them with a wide border between the image and the text.</p>
      <p>I’m not very proud of the design, and I learned a lot from it for sure, but sometimes you have to listen to the design itself and try what it wants, and it’s a lot of trial and learning I’m afraid!</p>
