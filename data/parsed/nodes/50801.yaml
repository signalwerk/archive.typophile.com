    <p>I am in the midst of designing a magazine where I am being forced to use amateur “snapshot” type photos throughout. </p>
    <p>How can I present the photos in a way that makes them look as good as possible? (Assuming I have already corrected exposure, color balance, noise, etc.) Has anyone dealt with this problem successfully? Or have you seen examples of designs where snapshots are used well? </p>
    <p>I know this is a vague question. Any ideas would be very much appreciated.</p>
