      <p>One of the realities of this ‘Destop Publishing‘ business is that the person in front of the computer can do it all… And that does mean that some of the ancient crafts have to be learned by that person: Typesetting, compositing, touch up, colorcorrection, colorseparation, proofreading…</p>
      <p>Well, the absolute minimum is to try and improve the amateurs work.<br>
      1. Fix contrast en lighting<br>
      2. Straighten (esp verticals — most people can not keep theri camera straight when pushing the button)<br>
      3. Remove blemishes<br>
      4. (!) Change to Black and White.</p>
      <p> . . .<br>
