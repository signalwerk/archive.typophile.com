      <p>There are a number of techniques you can work with. By amateur I assume you mean that these shots are low resolution/poor lens choice/bad exposure/poor focus/bad composition/&amp;c.; try this. First, see if you can improve the image by applying a ’fix lens distortion’ filter. Then skew the image if additional perspective correction is necessary; this possibly after rotating the image if it’s crooked. There are a number of effects you can produce at this point, such as [Photoshop specific] change to bitmap mode and generate lithograph patterns; multiply a duplicate layer and mask based on the most flattering color channel; change color mode to grayscale and then to monotone/duotone might get you something interesting to look at. Or do something collage-like. I like the suggestions here that move you in a typographic direction, because let’s not forget we are type folks here.<br>
      I prefer large to small and inconspicuous.</p>
