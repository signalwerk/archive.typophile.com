      <p>I usually agree with a lot of James’ opinions, but i have to take exception with a couple of his points on this topic.</p>
      <p><em>No photographer has any kind “right” not to have their shots monkeyed with. </em></p>
      <p>It’s often easy for designers to forget that the other creatives they’re working with are also artists. I believe there <em>is </em>an inherent “right” to expect your work to be treated respectfully. For instance, I would never think of hiring an illustrator to create a piece for a publication and then dump it into Photoshop and change the colors of the work to suit my own needs. If these sorts of changes need to be made, I would — in <em>every</em> case — consult the artist at the least, and either give them the opportunity to make the changes themselves or sign off on any changes I made to the work. If that agreement couldn’t be secured, I would pay the artist the ’kill’ fee and move to someone else. Of course this is a different situation when dealing with stock images (where the artist signs away all creative rights), but when dealing one-on-one with another creative, I believe there are creative rights involved.</p>
      <p><em>There isn’t much they can do about it, and at the end of the day most of them wize up and accept it as normal and par for the course. People who can’t accept their images being manipulated or cropped in some way are unrealistic and unprofessional.</em></p>
      <p>Again, I disagree. There is nothing unprofessional about expecting the designer to preserve the artistic integrity of commissioned work. If I treated the illustrators, photographers and other creative professionals I work with with that attitude, I would find my stable of professionals empty pretty quickly. And I wouldn’t blame them a bit for refusing to work within that atmosphere.</p>
      <p>Having said that, crops and scalings fall pretty much in the realm of ’design considerations,’ and should, in most cases, be professionally acceptable to most commissioned artists.<br>
      This gets a little away from your topic of working with unprofessional snapshot work, but I had to voice my difference to the concept of whatever-the-designer-wants approach.</p>
    html_clean: |-
