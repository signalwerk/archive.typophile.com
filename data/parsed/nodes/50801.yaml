      <p>james and hrant: lighten up a little! what’s with all the trollish negativity ?<br>
      are you the new topic police ? if so i will unsubscribe.</p>
      <p>there are plenty of threads on typophile which relate to type only indirectly, many less so than this one. general design, layout, software, hardware, music, sports, politics, the law... the list goes on. i find many of them quite interesting and generally relevant to a professional creative life. if not, i just skim and move on.</p>
      <p>meanwhile, i’ve found this method helpful with small or lower rez photos:</p>
      <p>after full color and contrast correction i duplicate the layer and apply a sharpen filter to the new top layer. then i reduce its opacity to 50% so it mixes back with the original. a similar technique employs slightly blurring another dupe layer and changing that layer to a “lighten” transfer mode (also at reduced opacity), creating a bit of a glow around hi-lites. variations (darken, contrast modes, etc)<br>
      can be played with, always mixed back into the dominant original. </p>
      <p>effects depend on context and narrative function of the shot.</p>
