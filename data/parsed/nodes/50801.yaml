      <p>Hey Curtis—this thread has nothing to do with type, typography, fonts or typeface design, neither specifically nor even in a general sort of way.</p>
      <p>@cjg: <em>just a thought— depending on the context, the photographers/submitters might not appreciate you applying actions and effects to their photos. Correcting colour and press prep is obviously accepted, but even amateurs have a right not to have their shots monkeyed with.</em></p>
      <p>What crap. This kind of thing depends on the publication’s editorial policy and what the photographers / image owners may have agreed or not agreed to regarding having their images published. No photographer has any kind “right” not to have their shots monkeyed with. Where did you get that idea? Cropping, color correction and so forth go on all day every day in my job. We even do it to costly rights-managed stock photos by way of written contractual agreement we have with the stock agencies we buy from—because we have to be practical</p>
      <p>Photographers and image owners may indeed not appreciate the applying of actions and effects to their photos—but that’s just too bad. It’s what happens. There isn’t much they can do about it, and at the end of the day most of them wize up and accept it as normal and par for the course. People who can’t accept their images being manipulated or cropped in some way are unrealistic and unprofessional.</p>
      <p>j a m e s</p>
