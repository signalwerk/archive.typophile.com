  html: <p>I'm wanting to pick up a nice color proof printer for my home office. The basic requirements would be 11x17 support (preferably 13x19), individual ink cartridges, broad paper support, and under $1k.  I didn't include extremely high quality, because I'm mostly printing graphics as opposed to glossy photos. <br> <br>There seems to be a new crop of printers from all the major manufacturer's geared toward "graphic professionals"  recently. Does anyone have any experience with any of the following printers? <br> <br><a href="http://www.epson.com/cgi-bin/Store/ProductQuickSpec.jsp?BV_SessionID=@@@@1938925413.1045174549@@@@&amp;BV_EngineID=eadcghdfeghlbfdmcfjgckidnf.0&amp;oid=20306147&amp;category=Ink%2BJet%2BPrinters">Epson Stylus Photo 2200</a> <br> <br><a href="http://www.usa.canon.com/html/ibeCCtpItmDspRte.jsp?minisite=10000&amp;item=8617&amp;t=10001&amp;section=10024&amp;m=10023">Canon imagePROGRAF series</a> <br> <br><a href="http://www.usa.canon.com/html/conCprProductDetail.jsp?modelid=6616&amp;item=6657&amp;section=10214">Canon S9000</a> <br> <br><a href="http://www.ldr.com/products_new/hp_designjet_20ps.shtml">HP DesignJet 10,20,50</a> <br> <br>My personal experience has been with the EPSON 3000 (slow, decent quality) and EPSON Photo 1280 (one very expensive ink cartridge). Both of which confine me to expensive Epson brand papers, which limits my ability to proof some projects. I realize I am limited in the ink-jet arena in that respect. Maybe step up to a $1500 Xerox Phaser? <br> <br>Any thoughts?</p>
  html_clean: <p>I'm wanting to pick up a nice color proof printer for my home office. The basic requirements would be 11x17 support (preferably 13x19), individual ink cartridges, broad paper support, and under $1k.  I didn't include extremely high quality, because I'm mostly printing graphics as opposed to glossy photos. <br> <br>There seems to be a new crop of printers from all the major manufacturer's geared toward "graphic professionals"  recently. Does anyone have any experience with any of the following printers? <br> <br><a href="http://www.epson.com/cgi-bin/Store/ProductQuickSpec.jsp?BV_SessionID=@@@@1938925413.1045174549@@@@&amp;BV_EngineID=eadcghdfeghlbfdmcfjgckidnf.0&amp;oid=20306147&amp;category=Ink%2BJet%2BPrinters" class="link-external">Epson Stylus Photo 2200</a> <br> <br><a href="http://www.usa.canon.com/html/ibeCCtpItmDspRte.jsp?minisite=10000&amp;item=8617&amp;t=10001&amp;section=10024&amp;m=10023" class="link-external">Canon imagePROGRAF series</a> <br> <br><a href="http://www.usa.canon.com/html/conCprProductDetail.jsp?modelid=6616&amp;item=6657&amp;section=10214" class="link-external">Canon S9000</a> <br> <br><a href="http://www.ldr.com/products_new/hp_designjet_20ps.shtml" class="link-external">HP DesignJet 10,20,50</a> <br> <br>My personal experience has been with the EPSON 3000 (slow, decent quality) and EPSON Photo 1280 (one very expensive ink cartridge). Both of which confine me to expensive Epson brand papers, which limits my ability to proof some projects. I realize I am limited in the ink-jet arena in that respect. Maybe step up to a $1500 Xerox Phaser? <br> <br>Any thoughts?</p>
