  html: |-
    <p></p><div class="imageWrap"><img src="/files/corner_edge_small_5599.jpg"></div><p></p>
    <p>Awhile back I had to catalog a bunch of type catalogs that were piling up. It got me thinking about showcasing them instead of allowing them sit quietly in the dark - as if they had been punished and banished to the corner of the room. What better way than to build them into a piece of furniture - something I would use and view everyday.</p>
    <p>After tinkering with the design, the project was put into gear. While these photos don’t show the completed piece, you can get the idea; The left half is reserved for monitor/keyboard/wacom, and the right half is the “production” area (which is cool because x-actos can not scratch the 1/4” glass top, yet it cuts like a dream). The supports in the middle now hold the computer tower.</p>
    <p>Now the fun part - try and figure out where the type came from...</p>
    <p><a href="http://typophile1.notlong.com">Top View</a>&nbsp;/&nbsp;<a href="http://typophile2.notlong.com">Underside</a>&nbsp;/&nbsp;<a href="http://typophile3.notlong.com">Glass Edge</a>&nbsp;/&nbsp;<a href="http://typophile4.notlong.com">Close up 1</a>&nbsp;/&nbsp;<a href="http://typophile5.notlong.com">Close up 2</a>&nbsp;/&nbsp;<a href="http://typophile6.notlong.com">Corner Edge</a></p>
