    html: <p>I’d go for something with proper <a href="/wiki/small%252Bcapitals" class="wiki">small capitals</a>… faking it is never pretty. It seems to be a <a href="http://www.myfonts.com/fonts/linotype/trajan/">Trajan</a> style you’re after. <a href="http://www.veer.com/products/typedetail.aspx?image=ADT0001724#characters">Trajan Pro</a> seems to have small caps. You might also like <a href="http://www.t26.com/fonts/display.php?f_id=218&amp;dw=1421">Minerva Display <em>Antiqua</em></a> by <a href="/wiki/Gabor%252BKothay" class="wiki">Gabor Kothay</a> (which doesn’t seem to have small caps unfortunately).</p>
    html_clean: <p>I’d go for something with proper <a href="/wiki/small%252Bcapitals" class="wiki link-lost">small capitals</a>… faking it is never pretty. It seems to be a <a href="http://www.myfonts.com/fonts/linotype/trajan/" class="link-external">Trajan</a> style you’re after. <a href="http://www.veer.com/products/typedetail.aspx?image=ADT0001724#characters" class="link-external">Trajan Pro</a> seems to have small caps. You might also like <a href="http://www.t26.com/fonts/display.php?f_id=218&amp;dw=1421" class="link-external">Minerva Display <em>Antiqua</em></a> by <a href="/wiki/Gabor%252BKothay" class="wiki link-lost">Gabor Kothay</a> (which doesn’t seem to have small caps unfortunately).</p>
