    <p>Hi!</p>
    <p>I’m trying to make a logo for this clay pigeon shooting club. I like the style of this font but I don’t like the cross behind each character. And I’m not a big fan of the short top horizontal on the ’E’</p>
    <p></p><div class="imageWrap"><img src="/files/lorde_park_5881.gif"></div><p></p>
    <p>I will be keeping a fairly wide kerning of the font I think.</p>
    <p>Obviously, the logo will be made more detailed and unique but I wanted to see if I could get any recommendation for fonts before continuing.</p>
    <p>Many thanks.</p>
