      <p>Alessandro, that is an excellent guide  (the one by Sappi).</p>
      <p>I used to work at a book publisher, and I remember when my boss showed us printer proofs (or tear sheets, I can’t remember which it was now)where a serif typeface had been used on a book cover, and the type had been set in Photoshop. Of course, the edges were not very crisp, as they would have been in Quark or InDesign..Sans-serif, though, doesn’t suffer (as much).</p>
      <p>Hopefully you can show  your boss that even though images look fine at 300dpi, text doesn’t. If I remember correctly, text should be printed around 1200 dpi or more.</p>
