    <p>Ok, here is the deal. I’m a production artist for a smaller agency. SInce I’ve always worked in smaller venues I’ve never had what I would call a highly experienced person to teach me. Maybe one, but mostly I’m self taught. I’ve long been under the impression that photoshop was for images, illustrator was for vector and indesign was for page layout. I have done my type in either illustrator or indesign (indesign if more than one page is needed) and while photoshop has the ability to do type I stay away from it.<br>
    Now the creative director and I get into arguements about where type should be done, all the creatives build their files in photoshop because that is what they are used to and in his mind so long as the files are 300ppi and cmyk they are good to go to print. I disagree. Am I wrong? The whole reason I was hired is because the files have been problematic at the printer. I’ve fixed that but now it seems I have to justify my process.</p>
    <p>If you have time please give me a short explaination on how you guys build final files.</p>
    <p>Thanks,<br>
    Pete</p>
