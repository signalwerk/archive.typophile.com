      <p>IMHO</p>
      <p><strong>For files with minimal type</strong>: With PhotoShop CS it is now possible to have a vector layer and save the file as an EPS saving the vector information. However, if you flatten the file, your type becomes nothing more than pixels and you lose the crispness, even if you are working at 300 dpi you it is still aliased and so not as crisp as the type could be if left on a vector layer or done in Illustrator or InDesign. If you are applying filters and trickery to the type then, of course, you need to do it in PhotoShop and can’t get around the aliasing.</p>
      <p><strong>For files with more than a few words</strong>: If you do more than a few words in Photoshop, you are wasting time.</p>
    html_clean: |-
