      <p>It all depends on the project AND how well you really know your stuff. My day job is at a printing company, so I see a lot of projects come in in a lot of different ways: sometimes they work, sometimes they don’t...</p>
      <p>On one particular job, a “designer” sent us files for a four-color brochure done entirely in Photoshop. Unfortunately, this “designer” did not allow for bleeds OR creep, the project needed both, and all of the pages had screened-back images as backgrounds. Needless to say, it took a considerable amount of effort to make this garbage printable.</p>
      <p>On the other hand, if you DO know what you’re doing, and DO allow for bleeds and such, there is one incontrovertible fact in the boss’s argument: rasterized type does not rewrap, drop out or get substituted. On the third hand, rasterized type doesn’t overprint and can cause registration problems if it’s composed of more than one color. On the fourth hand, Photoshop can really add a lot of visual interest to headline type with no additional overhead.</p>
      <p>I hope that this clears things up...</p>
