      <p>I’m with Miss Tiffany, although I would expand that to a few lines if need be. Write an EPS and preserve vector. Do not reopen it in Photoshop, it will rasterize. I work in newspapers a lot so I have no problem Distilling the EPS although it makes the type a little bolder (Is that because the hinting is destroyed?). I keep that in mind when I’m designing.</p>
      <p>The type on things I do is very minimal, just headlines and taglines and maybe a small bit of information. Anything more than this is in Photoshop is lunacy.</p>
      <p>I have also done match prints comparing rasterized type and logos (300ppi and up) with vector, same layout. Looking very closely I can see the difference but showing it to ordinary folks around the office they could not tell at all. Not that I am advocating this…</p>
      <p>But - I do send flattened TIFFs to one national magazine due to their track record of managing to make embedded fonts in PDFs from ID look pixelated.<br>
      peace</p>
