    html: <p>Hi Pete, if you are talking cover design do your type in Illustrator. Incorporate it with Photoshop files for images. That’s only for starters - there are effects you can apply to headlines in PhotoShop that you can’t emulate easily in Illustrator - but for most type, PhotoShop is clumsy. And then of course there’s Quark. For text you can’t beat it.</p>
