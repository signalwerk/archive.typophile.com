      <p>Thank you all for the response. Everyone in my department will now have a copy of the Sappi manual, I had seen that once before and sort of forgot about it so thanks for the link.<br>
      I am by no means the worlds greatest PA but I do know what I am doing and your replies confirm the fact that I do know what I am doing and have learned correctly.</p>
      <p>Luckily I have now been on both ends. I’ve been the guy who has to try and print the “garbage”. While it was mostly a digital press I still needed to create bleed where none was given and make sure I did not mess up any type. Now that I am the guy creating those files I do what I can to make it streamlined for the printer and less of a headache for me.</p>
      <p>I have a feeling I’ll learn a lot here. So again thanks.</p>
      <p>-Pete</p>
