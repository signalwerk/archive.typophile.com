    html: |-
      <p>Many Korean serif text typefaces use Latin glyphs in the Century style, often with high x-height and squashed descenders to avoid sticking out when used with the Korean glyphs. One widely-used text typeface seems to use something based on ITC Garamond, presumably because the light glyphs with high x-height apparently harmonize well enough with Korean glyphs.</p>
      <p>Rather than designing Latin glyphs from scratch, makers of Korean text typefaces will typically base their designs on existing ones that harmonize well with the Korean glyphs and adjust weight and proportions.</p>
