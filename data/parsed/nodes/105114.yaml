      <p>I know that some Asian typefaces do use a particularly ugly form of the Latin alphabet. There is a Unicode font, called, strangely, "Caslon Roman", which embodies this style.</p>
      <p>I believe those were drawn by Asians based on their own penmanship manuals showing the Roman style for sign-painting and the like: the traditional Chinese almanac (T'ung Shu) has hand-drawn characters in which the same design peculiarities can be seen.</p>
