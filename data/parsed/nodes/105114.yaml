    <p>Hi Everybody,</p>
    <p>I'm looking for some informations about latin glyphs incorporated into asian fonts.<br>
    (i.e. Kozuka Mincho, Adobe Myungjo Std, LiSong Pro, MingLiU…)</p>
    <p>Do you know some ressources on the subject? Especially about Adobe Ming Std.<br>
    Do you know on which western font Ming Std's latin glyphs are based?</p>
    <p>I noticed that some of them seem to use stretched (monospace forced) version of Times.<br>
    But maybe I have to check the “Scotch” style as well?</p>
    <p>Thank you!</p>
