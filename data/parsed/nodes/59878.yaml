    html: |-
      <p>Take a look at the thorn inside the bowl of the O - to me it looks larger in the "condensed" version. It should be smaller if it was simply condensed, shouldn't it?</p>
      <p>As for 3D: Of course you can imitate 3D effects in a font, just like you can do perspective in a drawing on a flat piece of paper. But as soon as two such letters overlap the effect is gone. The rendering engine does not know which letters you mean to have "on top", so the outlines of your letters "below" will shine through. Which is obviously not the case in the image. (Remember, I wrote "You can have either in a font but not both.")</p>
