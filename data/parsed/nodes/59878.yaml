    html: |-
      <p>Actually, while the two Os are different, one looks like the other one but squooshed. So, it COULD be a font (or based on a particular typeface).</p>
      <p>The 3D effect is certainly something one can do in a font (it's not actually 3D) and the overlap could easily be achieved via negative letterspacing. Not saying it *is* a font, but those two things don't preclude it from being one.</p>
