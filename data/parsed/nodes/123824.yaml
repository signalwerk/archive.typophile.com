      <div class="comment-spam-body"><p>The intertitle lettering artist seems to have been influenced by the style used by lettering artist Elizabeth Colwell. A version of her lettering from 1916 is the basis for a font by Fleisch &amp; Apostrophic called Colwell  </p><div class="imageWrap"><img src="http://typophile.com/files/ColwellAsCycle_3950.jpg"></div> <a href="http://www.dafont.com/colwell.font" title="http://www.dafont.com/colwell.font">http://www.dafont.com/colwell.font</a><p></p>
      <p>A toned down interpretation was published as a font by American Type Founders before 1923. Nick Curtis produced a digital version as McKenna Handletter NF </p><div class="imageWrap"><img src="http://typophile.com/files/McKennaHandletterNFAsCycle_3532.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/McKennaHandletterNFAscomes_6633.gif"></div><p></p>
      <p>Luc Devroye has an informative page on Elizabeth Colwell's lettering and various digital productions <a href="http://luc.devroye.org/fonts-51178.html" title="http://luc.devroye.org/fonts-51178.html">http://luc.devroye.org/fonts-51178.html</a><br>
      Don</p>
      </div>
