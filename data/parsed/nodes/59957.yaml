    <p>Hi everyone,<br>
    I've been working on this poster, I've fiddling around with it so much, and have come up with something pretty unsatisfactory.<br>
    I can't see where else to go with it at the moment, and was hoping for a bit of guidance.</p>
    <p>Its an A3 poster, aimed at people interested in all sorts of design.<br>
    I wanted to achieve a stylish, typographic layout, but could do with a little help, after looking at it for too long! Theres a lot of content to shoehorn in.</p>
    <p>Many thanks</p>
    <p>Toby </p><div class="imageWrap"><img src="http://typophile.com/files/poster_3942.jpg"></div><p></p>
