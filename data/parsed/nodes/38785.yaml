    <p>Here's a typical Helsinki taxi sign from the front. At the back there's an individual number, usually in Helvetica or Futura. On Friday I was sitting in a tram when I spotted one with the number in Cooper Black. Now, that was refreshing... Unfortunately I didn't have a camera with me.</p>
