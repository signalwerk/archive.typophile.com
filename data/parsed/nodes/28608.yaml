    <p>Dear Typophiles,</p>
    <p>is it possible to have two types of fraction (slashed and nuts) in the same font? I have the slashed ones implented via frac-feature in opentype, so I can have fractions like 2323423/34575685 or 15/4. This works fine in Indesign CS2 already.</p>
    <p>How do I implement additional nut fractions? Is it possible via Opentype, and if yes, what is best practice? </p>
    <p>Thanks for your help<br>
    Sebastian</p>
    <p>Here is the code I used for slashed fractions (I think I got it from here, because I can't imagine that I invented this on my own...)</p>
    <p>feature frac {</p>
    <p>lookup FRAC {<br>
          sub [zero zero.onum zero.superior zero.subscript zero.denominator] by zero.numerator;<br>
          sub [one one.onum onesuperior one.subscript one.denominator] by one.numerator;<br>
          sub [two two.onum twosuperior two.subscript two.denominator] by two.numerator;<br>
          sub [three three.onum threesuperior three.subscript three.denominator] by three.numerator;<br>
          sub [four four.onum four.superior four.subscript four.denominator] by four.numerator;<br>
          sub [five five.onum five.superior five.subscript five.denominator] by five.numerator;<br>
          sub [six six.onum six.superior six.subscript six.denominator] by six.numerator;<br>
          sub [seven seven.onum seven.superior seven.subscript seven.denominator] by seven.numerator;<br>
          sub [eight eight.onum eight.superior eight.subscript eight.denominator] by eight.numerator;<br>
          sub [nine nine.onum nine.superior nine.subscript nine.denominator] by nine.numerator;<br>
       } FRAC;</p>
    <p>   sub zero.numerator' slash' zero.numerator' zero.numerator' by perthousand;<br>
       sub zero.numerator' slash' zero.numerator' by percent;<br>
       sub one.numerator' slash' two.numerator' by onehalf;<br>
       sub one.numerator' slash' three.numerator' by onethird;<br>
       sub two.numerator' slash' three.numerator' by twothirds;<br>
       sub one.numerator' slash' four.numerator' by onequarter;<br>
       sub three.numerator' slash' four.numerator' by threequarters;<br>
       sub one.numerator' slash' five.numerator' by onefifth;<br>
       sub two.numerator' slash' five.numerator' by twofifths;<br>
       sub three.numerator' slash' five.numerator' by threefifths;<br>
       sub four.numerator' slash' five.numerator' by fourfifths;<br>
       sub one.numerator' slash' six.numerator' by onesixth;<br>
       sub five.numerator' slash' six.numerator' by fivesixths;<br>
       sub one.numerator' slash' eight.numerator' by oneeighth;<br>
       sub three.numerator' slash' eight.numerator' by threeeighths;<br>
       sub five.numerator' slash' eight.numerator' by fiveeighths;<br>
       sub seven.numerator' slash' eight.numerator' by seveneighths;</p>
    <p>   sub [slash @FIG_DNOM @FIG_FRAC] @FIG_NUM' by @FIG_DNOM;<br>
       sub [slash] by fraction;</p>
    <p>} frac;</p>
