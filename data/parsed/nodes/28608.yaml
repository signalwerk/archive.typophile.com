      <p>I have nut fractions as the default fraction feature in Austin, which I am publishing next year.</p>
      <p><a href="http://typophile.com/node/28517" title="http://typophile.com/node/28517">http://typophile.com/node/28517</a></p>
      <p>Here's the code:</p>
      <p>sub @FIGURES' slash by @numr2;<br>
      sub slash' @FIGURES @FIGURES by nut2;<br>
      sub @FIGURES @numr2' nut2 by @sups;<br>
      sub slash by nut;<br>
      sub [nut2 nut] @FIGURES' by @sinf;<br>
      sub @numr2' nut by @sups;<br>
      sub @FIGURES' @numr2 by @sups;<br>
      sub @sinf @FIGURES' by @sinf;<br>
      sub @sups @numr2' by @sups;</p>
      <p>There are two "negatively-sidebearinged" nut bars, one for single-digit denominators, and one for two-digit denominators. There is a class of numerator characters with extra sidebearing width, to centre over double-digit denominators. This system works perfectly for everything from 0/0 to 99/99, but only in InDesign!</p>
      <p>In the same font, users can build slash fractions by selecting numerator and denominator features. (This is possible, because the nut fractions use the smaller superior and inferior figures). I have also included the basic fractions in the font, as composite characters, in the nut configuration.</p>
      <p>The reason I put the nut fractions first is because they are appropriate to the style of the typeface (a scotch modern revival).</p>
    html_clean: |-
