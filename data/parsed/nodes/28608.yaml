      <p>Here is the info on Underware (Cheers Paul)</p>
      <p><a href="http://www.underware.nl/site2/index.php?id1=liza&amp;id2=features" title="http://www.underware.nl/site2/index.php?id1=liza&amp;id2=features">http://www.underware.nl/site2/index.php?id1=liza&amp;id2=features</a></p>
      <p>[Show all opentype features and expand more info]</p>
      <p>I like this, as it makes absolute sense to have have nut fractions for tables... BUT...</p>
      <p>@Nick - I don't quite understand your question.<br>
      From my perspective which currently is: use inline in a set text- I am working on fractions themselves that will consist of numbers approximate in design to (scaled down) lining Figures. These wouldn't naturally line up with Text Lining figures as shown above. If they were to do so, would make the nut fraction too small (surely [untested]). I know it would be difficult to beef up the small numbers to match the density of Lining Figures. [I would hope there is no need for nut fractions in Bold surly]<br>
      There lies the challenge. </p>
      <p>However this is exactly how the Liza Pro has them for table use... which I like the idea of.<br>
      I have just seen in the User Guide PDF that the nut fractions extend both up (above the Cap height) and down (below the base line) by quite a bit, making them not so good for annual reports but great for 50s style advertising vernacular ephemera.</p>
      <p>I was thinking this is also the way (Nut-style) to have fractions for a titling alternative style.</p>
