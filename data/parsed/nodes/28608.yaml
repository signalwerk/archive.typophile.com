      <p>Nick, </p>
      <p>the problem is that *you* would commission translations for maybe 25 languages, somebody else would do so for just 7 languages, and yet someone else would only provide English names. In the end, there would be always the danger that the user in a non-English locale would get a random mix of translated and untranslated names depending on the selected font. This is not the kind of user experience that is desirable in today's world. These days, the user expectancy is "translate well or not at all". A localized application with one of the menus appearing untranslated looks unprofessional. </p>
      <p>A.</p>
