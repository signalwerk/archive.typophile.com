    html: |-
      <p>Even if the code is very clever, it can't distinguish between a real fraction and a date using a slash separator (that doesn't include the year). 9/11 anyone? Is 2/3 = Feb 3rd, 2nd Mar, or two thirds?</p>
      <p>Ergo, being in the habit of using fractions globally would be dangerous, even if the fractions were coded as well as possible for that purpose.</p>
      <p>Of course, one could do fraction code in a manner more forgiving to users than Adobe's approach, but it would get pretty complex.</p>
      <p>Cheers,</p>
      <p>T</p>
