      <p>For all those interested, the current best practice at Adobe regarding the 'frac' feature, is to NOT access pre-composed fractions (onehalf, onethird, etc.) via OpenType layout substitutions. The glyphs are included in the fonts (where applicable) and assigned Unicode values accordingly, but there is not reference to them in the features.</p>
      <p>Our goal for taking this approach is to preserve the character stream as it was input by the user, i.e. <strong>U+0031 U+002F U+0032</strong> (1/2) won't be replaced by <strong>U+00BD</strong> (½). This means that all fractions are by default arbitrary, and therefore the elements that compose them need to kerned as needed.</p>
