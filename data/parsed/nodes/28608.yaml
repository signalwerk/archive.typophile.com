      <p>Your logic is impeccable as ever Adam, but given the scenario you describe, I think that the tendency would be towards word-free icons, as in the Illustrator OT menu. And I really do prefer words -- as I mentioned, I have never warmed to the OS X interface, and still rely on the pop-up words to distinguish InDesign from Photoshop in the "Dock". I am still confused between "paragraph leading" and "paragraph indent" in the InDesign menu, despite many years of almost daily use. </p>
      <p>What I would really like to see:</p>
      <p>* First, the Fraction features should be properly conceived, named as "sfrc" and "nfrc", not "frac" and "afrc". In other words, they should be Slash and Nut, not with a designation that assumes the Nut is the alternate. </p>
      <p>*Secondly, I'd like to see two options in the OT menu, Slash and Nut, with icons and pop-up names, as in Illustrator. </p>
      <p>*Thirdly, where a feature is absent from a font, no greyed-out or unchecked menu item, just nothing.</p>
      <p>Even if fonts don't have an arbitrary nut fraction feature, which is problematic to implement, it would still be feasible for foundries to include the basic fractions (halfs, quarters, eights and thirds) as composite glyphs, programmed to the "nfrc" feature.</p>
      <p>While I appreciate the logic of standardization, I also find that typographically it makes too many assumptions about what the default feature should be. Why does every typeface have to have tabular lining figures as the default? Why does every typeface have to have slash fractions as the default? Why not two figure styles instead of one or four?</p>
