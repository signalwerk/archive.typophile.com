    html: |-
      <p>@paul, that would be a lot of work. Shouldn't figure and fraction features be global?</p>
      <p>IMO, the alternative fraction style, whether slash or nut fractions, should be independently applicable to figure styles.<br>
      As "afrc" is not yet supported by layout apps, that means the alternate fraction style should be put in a stylistic set or the titling feature.</p>
      <p>@michael, I've made nut fractions the default for the Modern Suite fonts--all weights and styles--extending below the baseline. I don't see why this depth would be a problem anywhere that fractions are used; in fact, it means that mathematical operators are vertically centred on the nut fractions. The alternative fractions (arbitrary slash) are available in the titling feature.</p>
