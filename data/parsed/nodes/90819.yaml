    html: |-
      <p>The simplest thing to do is to create alternate glyphs that include the underscore, for every character. “Sophistication” would be needless complexity—featuritis—in this instance. </p>
      <p>If you’re working in FontLab, the “new glyph” command will make your alternate glyphs with the original glyph vector paths and width, which is a huge timesaver.</p>
      <p>Class size is not an issue: if the end users have access to software that supports OpenType features, then their hardware is powerful enough to blast through fonts with large numbers of glyphs. That’s digitech synergy.<br>
      I’ve made fonts with multiple alternates of every character (for pseudo-randomization), and they work just fine.</p>
      <p>The worst that happens is that documents with many pages and much text take a fraction longer to open, but that fraction is marginal, compared to, for instance, the lag caused by image files.</p>
