    html: |-
      <p>Theunis,</p>
      <p>I'm actually still using CS3, so things may have changed. But in CS3 one-to-many substitutions are *definitely* not supported, as can be confirmed by simply adding random stylistic sets to a font which involve such substitutions and noting that they don't work.</p>
      <p>Even in CS3, though, hardcoded fi will be rendered as FI regardless of whether this glyph is included in any opentype feature. This is because InDesign does some preprocessing before applying a font's features. ﬁ (UFB01) will be converted to either fi (U0066+U0069) or FI (U0045+U0049) before any case-related GSUB features are applied to this sequence. This conversion is done by InDesign's type engine, not by any type-2 lookup defined by the font.</p>
      <p>André</p>
