      <p>Vit, it seems you are concerned over font file size vs. processing speed. Remember that <em>each of the characters</em> in the user's text in your font has to be processed. It takes only one step in the feature table to swap a glyph for an underlined one, or it takes a dozen steps to coax precisely the right "underline" character into position.</p>
      <p>Swapping one glyph for another is an extremely efficient operation due to the way Opentype feature tables are internally represented. One could say it's the cornerstone of the entire features idea.</p>
