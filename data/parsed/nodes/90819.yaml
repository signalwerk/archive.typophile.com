      <p><cite> Any suggestions for the first Feature?<br>
      What I want is actually to change the string like "abcd" to "aXbXcXdX" only with exception for space (or few more characters). </cite></p>
      <p>One to many substitutions can only be applied to individual glyphs, not to glyph classes, so you'd need something like:</p>
      <p>sub a by a X;<br>
      sub b by b X;<br>
      etc.</p>
      <p>You might want to look at <a class="freelinking external" href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html" rel="nofollow">the adobe feature file syntax guide</a></p>
      <p>As for 'inverting' classes, that's best done using the <code>ignore</code> keyword, also described in the above guide.</p>
      <p>André</p>
    html_clean: |-
