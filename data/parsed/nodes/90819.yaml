    html: |-
      <p>instead of<br>
      sub @class1 @class1 by @class1 @class2<br>
      you should use<br>
      sub @class1 @class1' by @class2</p>
      <p>The tick (') indicates the piece that should be substituted for.<br>
      That should work whereas your "many-to-many" substitution won't.</p>
