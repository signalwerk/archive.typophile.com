    <p>Hello everybody,<br>
    I'm working on a new font and I would like to make few non-standard OT features. But I cannot figure out how to make them work:</p>
    <p>The First one should make a special underline or strikethrough effect. It would be most probably Stylistic set. I want it to insert a special zero-with "underline" character I made after every single glyph in my font except for space (and maybe few more glyphs). I have made a huge class including all characters but space, and tried to make some substitutions, but no success yet. </p>
    <p>The second feature should make quite simple substitution for letter pairs like "oo" "ee" "ll" "gg". It would not be problem if there wasn't so many combinations to list them all individually. Let's suppose two classes are defined: @class01 (o e l g) and @class02 (o.alt e.alt l.alt g.alt). I thought something like <em>sub @class1 @class1 by @class1 @class2</em> but this kind of substitution does not work.</p>
    <p>This feature could also work in two ways:<br>
    - substitute just the same letter pairs like "o-o" to "o-o.alt" (and ignore "o-g"), or<br>
    - substitute all combinations from defined classes, e.g also "o-g" to "o-g.alt"<br>
    I would put this in Calt feature, but it also does not work yet :(</p>
    <p>Could anyone help, please?</p>
