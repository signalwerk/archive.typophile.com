      <p>Unfortunately, there's no shorter way of doing this of which I am aware.</p>
      <p>Also, be advised that a number of major applications (including the Adobe CS applications) don't actually support one-to-many substitutions so if you do go this route your font will not work for all users.</p>
      <p>You might achieve better results by simply including underlined variants of all applicable glyphs.</p>
      <p>André</p>
