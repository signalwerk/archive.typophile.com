    <p>Hi,</p>
    <p>A little question about the exact date of creation of Neue Haas Grotesk/Helvetica:</p>
    <p>Alan Marshall and Lewis Blackwell both wrote that Max Miedinger designed Helvetica between 1951 and 1953, but this year is the 50th anniversary of the typeface, and indeed every website I look at indicate that it was designed in 1957.</p>
    <p>So, would anybody have the right answer, and a reliable proof of it?</p>
    <p>Thanks<br>
    Alice</p>
