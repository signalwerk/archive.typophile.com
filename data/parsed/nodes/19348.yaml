      <p>this may be a little bit offtopic, but:</p>
      <p>hrant said:<br>
      «Semitic languages need vowels far less than Indo-European ones.»</p>
      <p>as far as i know, egyptian language (2000BC or so) used no vowels at all in written language - but i dont know how it was in spoken language.</p>
      <p>that fact leads to the problem that some names could be pronounced differently - lets say "Ramses" could also be "Rumsos". but most of the names are probably covered because there are transcripts of them in other languages (à la stone of rosetta).</p>
      <p>and yes, i know that semitic would mean "on the arabic peninsula" if you'd be precise, but i just wanted to add this fact, nothing more.</p>
