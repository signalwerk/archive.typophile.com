      <p>Misunderstood and Underestimated Space-savingness!<br>
      What makes Arabic space-saving is Not Only the Word-Spacings But Also Ligatures and Kerning (inter-word-spacing).<br>
      Ligatures integrate 2 or more letters into one. Example: L+M+H+M occupy a single Ha-space.<br>
      Kerning integrates 2 letters into One. Example: Alif+R occupy a single R-space.<br>
      Ligatures and Kerning are fantastically handled in my font.</p>
      <p>Vowels too play their role in Arabic Space-savingness. How?<br>
      Arabic Vowels are virtually dropped without sacrificing readability thus made less horizontal than the Vowels-thirsty English.</p>
      <p>Word Space Modulation (WSM)<br>
      If a word ending with a clockwise letter (like Ra) is followed by a word starting with counterclockwise letter (like 3ain), the space between them is eleminated without sacrificing readability.  My word Macros fail to do this WSM in the case of a fully justified text.</p>
      <p>What’s holding me back me from transforming my the Six (6) TTFonts into a single OTF?!<br>
      Unfortunately, LinoType rejected my font without giving any reason save-I guess- the complexity of transforming the 6 TTFs fonts into a single OpenType Font though they have never produced any “uncompromising” font with nor without the Quran style.<br>
      Lack of Capital, Lack of indepth Knowledge of Open-Type Tech and more discouraging is the Web that has rendered Copyrights meaningless particularly in the Arabic World. Here and around you can get All the Linotype and SIL fonts free of charge.<br>
      Otherwise, by now, I have marketed them without transforming them into a single font?</p>
