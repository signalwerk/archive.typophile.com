      <p>If Arabic is hostage of technology then *users” of Arabic technology become the same. I do not see your statement in disagreement of mine. To clarify mine further, when Arabic or any other script editing and production on computers requires costly and technically sophisticated technologies we risk loosing users, markets, global competitions, and a lot of unnecessary expenses.  Complex Chinese jumped to the web before Arabic!  Arab petro-dollars spent billions to ensure that letters like “Dal” must have an isolated, initial, medial, and more glyphs.  Why? </p>
