      <p>Incidentally, on <a class="freelinking external" href="http://www.tug.org/TUGboat/Contents/contents18-1.html" rel="nofollow">this page</a>, there is a link to an article about the complexities of even the simpler approach of typesetting Arabic in metal type without the refinements I've mentioned.</p>
      <p>Direct PDF link: <a class="freelinking external" href="http://www.tug.org/TUGboat/Articles/tb18-1/tb54arab.pdf" rel="nofollow">http://www.tug.org/TUGboat/Articles/tb18-1/tb54arab.pdf</a></p>
      <p>The same article, but with different formatting, is available from <a class="freelinking external" href="http://omega.enstb.org/yannis/" rel="nofollow">this page</a> as item #40 in the numbered list of publications on that page.</p>
      <p>Direct PDF link: <a class="freelinking external" href="http://omega.enstb.org/yannis/pdf/ep96-arabic.pdf" rel="nofollow">http://omega.enstb.org/yannis/pdf/ep96-arabic.pdf</a></p>
      <p>Also, I'm sure that if Thomas Milo has made mistakes in his understanding of how Arabic is traditionally written, he will be most interested to hear of it. I think I accidentally came across his paper when searching for information related to Nastaliq. As there is an open-source Nastaliq font that just happens to be usable only in an obsolete Mac environment, taking its glyphs and making a new open-source Nastaliq font would seem to be a useful service that some Linux enthusiast might perform. The glyphs are there in the package separate from the font in its Mac-specific form; I am going to have to see if it's one that Fontforge is capable of reading.</p>
