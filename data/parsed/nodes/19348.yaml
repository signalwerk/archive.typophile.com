      <p>In looking up information about the Nastaliq style of Arabic script, I found the statement that it originated as a simplification of the previous Naksh style. And so the common Naksh fonts that work with only four forms of each letter indeed do not do it justice. Even the font shown here, with its ligatures, apparently is not doing everything that the Naksh writing style normally includes: in proper written Naksh, while the writing baseline is horizontal, and not diagonal as in Nastaliq, it can still vary in steps because not all letters will always join at the base.</p>
      <p>As for Semitic languages and vowels - the story is complex. Basically, because the root of the word consists of consonants, while vowels alter the word grammatically, like suffixes in English, writing vowels as full letters instead of as an annotation is distracting. This is also true of ancient Egyptian, which is believed to be related to the Hamitic languages and perhaps the Semitic ones, but this classification is not certain. So vowels may be a bit less important, but also that their importance, as it may be, is of a different kind. (Of course, spoken Egyptian had vowels, or it could not have been spoken.)</p>
    html_clean: |-
      <p>In looking up information about the Nastaliq style of Arabic script, I found the statement that it originated as a simplification of the previous Naksh style. And so the common Naksh fonts that work with only four forms of each letter indeed do not do it justice. Even the font shown here, with its ligatures, apparently is not doing everything that the Naksh writing style normally includes: in proper written Naksh, while the writing baseline is horizontal, and not diagonal as in Nastaliq, it can still vary in steps because not all letters will always join at the base.</p>
      <p>As for Semitic languages and vowels - the story is complex. Basically, because the root of the word consists of consonants, while vowels alter the word grammatically, like suffixes in English, writing vowels as full letters instead of as an annotation is distracting. This is also true of ancient Egyptian, which is believed to be related to the Hamitic languages and perhaps the Semitic ones, but this classification is not certain. So vowels may be a bit less important, but also that their importance, as it may be, is of a different kind. (Of course, spoken Egyptian had vowels, or it could not have been spoken.)</p>
