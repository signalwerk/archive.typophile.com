    <p>Dear Friends,<br>
    Referring to the MRALLAH.jpg that comprises all the Arabic Characters from Hamza-to-Ya, I would like to highlight the Smart, Attractive + Space-saving Features of the Arabic Script first.</p>
    <p>Needless to say, the Arabic letter Ha has 4 shapes: the flower-like initial, the 8-like middle + the final that looks like either o or q depending on the letter coming before.</p>
    <p>That's right: Virtually, Arabic letters Change shape —Tails not heads— in such a way that they:<br>
    1. join (connect) appropriately to neighbouring letters through short curves or  straight lines. See (S+J) in Sojjadan + As-Sojood and how J joins D in the first and WAW in the latter.<br>
    2. form easy-on-the-eye + self-explanatory Combinations (Ligatures) of 2 or more letters, not only at the beginning, but also at the mid &amp; end of words.<br>
    See (S+J) in Sojjadan and As-Sojood and (M+H+M) of Mohammed and explore more...<br>
    3. need no space between the words: one would simply understand where a word ends and the next one starts.<br>
    That's clearly seen in virtually all the Arabic Calligraphy (AC) of the "Qol Howa Allaho Ahad" where the Ha of the "Howa" overlaps the Lam of "Qol". Since the Lam takes the final shape and Ha the flower-like shape, then the space between the 2 words "Howa and Qol" is narrowed to minus.<br>
    —————— 03.2003 Start bulding my Naskh with 5+1 TTFs ——————<br>
    As the strength of a chain lies in its weakest link, the Quality of an Arabic font lies in its poorest feature: Ligatures , Diacritics Positioning Kerning?<br>
    By Applying my own technique, I finished designing -9 months ago- a new font of AC with the help of which I successfully completed building up the most Challenging Arabic Text of the Glorious Quran—3 years of hard work...<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/MRALLAH_3859.JPG"></div><br>
    As the MRALLAH.jpg shows, my font is distinguished by:<br>
    • Ligatures of upto 4 Consonants, not only at the beginning, but also at the mid + end of words.<br>
    • Smart Joiners: Straight and curved Tails for Consonants and ligatures.<br>
    See (S+J) in Sojjadan and As-Sojood and how J joins D in the first and WAW in the latter.<br>
    • Full Kerning by shifting up and/or right any letter that follows, R,D,WAW and likewise. See (D+Alif) in Ashidda and (R+T) in Maghfiratan.<br>
    • Four (4) baselines for Consonants &amp; 7 lines for Vowels (Diacritics).<br>
    See the 3 lines in (M+H+M) of Mohammed and the fourth in (Y+N) of Allazina.<br>
    • Accurate Vowels Positioning. They —Vowels (Diacritics or Marks) are:<br>
    1 horizontally centered, slightly above or below the letters they belong.<br>
    2 distributed in harmony with the ligatures,<br>
    3 neither touching the letters to which they belong, nor transgressing neighbors.<br>
    • WAW Discrimination:  The word WAW (AND) is lowered and attached to the next word. See (WAW+R) in WaRizwana.<br>
    • Compatibility with any software that runs on 98/2000/XI &amp; reads RTF.<p></p>
    <p>That's right: In order to achieve all the possible ligatures of AC, and accurately position diacritics, I:<br>
    • Designed (5+1) TTFs comprising  more than 1100 Glyphs and<br>
    • Translated the Rules of AC into Word-Macros to juggle 5 TTFs accordingly.</p>
    <p>Finally, worth mentioning that Virtually, the Arabic Text (AT) of All the PC &amp; TV Programs of the Glorious Quran<br>
    • is too small and/or does not match the poorest AC.<br>
    • does not always start and/or end meaningfully in the same screenshot,<br>
    • and/or does not always go in line with Recitation and/or Translation.<br>
    In summary: My Font solves all the Screen and Paper Publishing problems<br>
    ————————— 08+09.2010 Aziz Naskh = A single TTF —————————<br>
    Aziz Unique+Dynamic Ballpen Naskh is being finalized to go with<br>
    <a href="http://typophile.com/node/48495" rel="nofollow">MaryamSoft Arabic Calligrapher</a>. I have typeset the above sample in Word 2003 and printed it to a PDFile (attached) in 2 colors, Glyphs in Black and the separable Dots + Marks in blue to emphasize the point mentioned by <a href="http://www.khaledhosny.org/node/142" rel="nofollow">khaledhosny</a>.<br>
    ——————————————————————————————<br>
    Thanks Typophiles for the Input + Feeback with <a href="http://www.typophile.com/node/51401" rel="nofollow">Flowers</a>.</p>
