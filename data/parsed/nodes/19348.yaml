      <p>&gt;&gt;As the strength of a chain lies in its weakest link, the Quality of an Arabic font lies in its poorest feature: Ligatures , Diacritics Positioning and Kerning?</p>
      <p>Ligatures, are both strength and weakness. Strength calligraphically but weakness typographically. Technology almost passed Arabic by because of insistence on institutionalizing complexity as the norm. Arabic should not be hostage of technology, it should instead emphasize simplification to conquer technology. In fact Arabic history adapted to new factors.</p>
      <p>&gt;&gt;need no space between the words: one would simply understand where a word ends and the next one starts.</p>
      <p>Even the greatest quraanic and calligraphic Arabic test can significantly benefits from spaces. There is a need for space. </p>
      <p>Nick Shinn wrote:</p>
      <p>&gt; If your font is as good as you say it is, there should be enough of a market</p>
      <p>Hrant wrote:</p>
      <p>&gt;&gt;Not really. Simply because high culture is not very marketable (like you should be realizing with Panoptica). Certainly, “good” doesn’t equate to “trendy”. In fact sometimes, Really Good stuff simply has to be given away. And other times it’s sadly not a good fit to the devious and capricious retail market.</p>
      <p>Dear hrant.  I am confused.  In another Forum and discussion, you attacked Mr. Thomas Milo, a pioneer Arabic caligraphic typfaces designer for decades dismissing even the need for Quraanic and calligraphic Arabic fonts. Why Aziz’s fonts are different now?</p>
      <p>-Saad</p>
