      <p>&gt; Ligatures ... weakness typographically.</p>
      <p>That's a Modernist fallacy.<br>
      Some very recent related material: <a href="http://typophile.com/node/19376" title="http://typophile.com/node/19376">http://typophile.com/node/19376</a></p>
      <p>&gt; Arabic should not be hostage of technology</p>
      <p>And neither should readers.</p>
      <p>BTW, a hostage can't exactly liberate himself by becoming servile!</p>
      <p>&gt; dismissing even the need for Quraanic and calligraphic Arabic fonts.</p>
      <p>1) Look through my previous posts in this thread, and try to find any place where I say that I actually like Aziz's font... A good critic helps a person get to where that person wants; he does not dismiss, he does not coerce; but he does educate and warn along the way. Taming one's own ideals is the key to becoming a good critic, for the simple reason that personal context is everything, and nobody is infallible or omniscient. Basically, it's an act of sharing, not shepherding.</p>
      <p>2) The argument with Thomas was messy and emotional (especially when he lapsed into historical revisionism on occasion - as you yourself complained back then) but as far as I remember my point wasn't to dismiss anything, but to ask that people not engage in historicism for its own sake, ignoring the current sociopolitical needs of users, and also that whatever path they choose, they realize and admit its full effects. To me Thomas's "problem" is that his work in effect (if not really necessarily) engrains chirography to the depths of the bones of visible language, where I feel that even its presence in the outer skin is a problem! This, whether anybody realizes it, admits it, or not.</p>
      <p>To his great credit however, if you remember, Thomas had the grace and humility to admit that perhaps chirography is not as good a foundation for his scheme as would be readability. I wish that other people -including myself- could be that way more often.</p>
