      <p>If your font is as good as you say it is, there should be enough of a market for it in the West (in fact, all around the world) to justify developing and publishing it yourself.</p>
      <p>While going through that process might not at first be a good return on your investment of time, other things will grow out of it.</p>
      <p>What you will need is your own website to publicize and explain the font, with a link to myfonts.com, where customers will be able to license and download it. That's the basic set-up for "indie" fonts, used by hundreds of foundries. </p>
      <p>While Myfonts distributes all-comers, other distributors are selective, to varying degrees, in the number of foundries they represent. But those other distributors will be more inclined to distribute your font(s) once you have established a basic presence.</p>
      <p>And really, there's not much difference between a contract with a distributor, and one with a publisher ("foundry").</p>
