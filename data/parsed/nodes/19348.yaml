      <p>this may be a little bit offtopic, but:</p>
      <p>hrant said:<br>
      «Semitic languages need vowels far less than Indo-European ones.»</p>
      <p>as far as i know, egyptian language (2000BC or so) used no vowels at all in written language - but i dont know how it was in spoken language.</p>
