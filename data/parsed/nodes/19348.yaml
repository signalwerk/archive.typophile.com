      <p>Arabic is a glorious script (one of my all-time favorites),<br>
      and you've put in an incredible amount of effort. Bravo.</p>
      <p>The main thing I notice about this is its extreme tightness.<br>
      This is not unique, but especially in the digital realm it<br>
      is pretty rare. It saves space, and creates a special texture,<br>
      but as you might have already encountered, some people<br>
      will say it's too tight.</p>
      <p>Speaking of saving space, you write:<br>
      &gt; need no space between the words</p>
      <p>Although this is more true for Arabic than Latin (except for  fully-joined Latin script fonts :-) it's still not true enough: if the last letter of a word happens to be one that has no join on its left, it can often get confusing. On the other hand, Arabic does save space in two other ways: it can dump [short] vowels*; and it distributes its "information" more evenly in the Cartesian area** (which also has a  readability advantage). But this latter part comes at a price: lesser apparent size.</p>
      <p>* Although this actually comes from a linguistic advantage:<br>
      Semitic languages need vowels far less than Indo-European ones.</p>
      <p>** Whereas Latin for one is much more horizontal.</p>
      <p>In terms of getting this to market, I might suggest Linotype.<br>
      But if they say no, they probably have a valid reason: they<br>
      already have an accomplished "uncompromising" Arabic<br>
      typeface, including full coverage of the Qur'aan style.<br>
      If they decline you could look for font houses that would<br>
      like to rival Linotype in Arabic fonts.</p>
      <p>Or you could try contacting SIL. They recently<br>
      released Arabic fonts, but nothing like yours.<br>
      <a href="http://www.sil.org/" title="http://www.sil.org/">http://www.sil.org/</a> _<br>
      Just one thing: with SIL, don't push the Qur'aan angle too much.</p>
      <p>Lastly, like Simon said you could do it all on your own.<br>
      But finding and leveraging good distribution channels<br>
      for this sort of thing is non-trivial.</p>
      <p>hhp</p>
