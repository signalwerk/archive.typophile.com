      <p>Well, I can think of a few reasons, one being that I was/am not being even-handed enough. But other reasons are: like I said, Thomas is engraining chirography much more deeply; and Aziz and Thomas have different contexts, and are asking for different things (or not asking for anything*); Aziz for example seemed confident (too confident?) in the integrity of his design, and was actually mainly asking for marketing advice. I guess I was trying to encourage a relative unkown simply by saying that the effort is appreciated; passion is the key, and it can drive future development, often in better directions; like how I used to make cruddy Armenian fonts (I mean really cruddy - not like Aziz's work at all) and people encouraged me, so I kept at it, and now make totally different, and I think much more mature, Armenian fonts.</p>
