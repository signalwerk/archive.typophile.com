      <p><em>high culture is not very marketable (like you should be realizing with Panoptica)</em></p>
      <p>Aziz (or should I be addressing you as Mostafa?) -- I have type designs released by four publishers (since 1984), and another 20-odd typefaces which I publish myself (since 1999), which are sold around the world by nine distributors. So my advice is based on practical experience.</p>
      <p>While it's true that a typeface such as my Panoptica sells only a small amount, and never gets on the best-seller list at Myfonts, since its release in 2003 it's sold over a hundred (individual fonts) there, to people from many countries. That's the thing, although the retail market is, if not devious, at least capricious, thanks to the Internet it is a world market, and there are enough people committed to good typography, around the world, to make self-publishing a viable business.</p>
