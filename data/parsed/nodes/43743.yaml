      <p>W uses Garamond 3 for body copy (and some display type)...<br>
      <a href="http://www.myfonts.com/fonts/atf/garamond-no-3/familytree.html" title="http://www.myfonts.com/fonts/atf/garamond-no-3/familytree.html">http://www.myfonts.com/fonts/atf/garamond-no-3/familytree.html</a></p>
      <p>...and the aforementioned W Macro (slab serif) by Joshua Darden...<br>
      <a href="http://joshuadarden.com/custom/behind_wmagazine.php" title="http://joshuadarden.com/custom/behind_wmagazine.php">http://joshuadarden.com/custom/behind_wmagazine.php</a></p>
      <p>...and both NewJune and NewLibris (sans serifs) by Hubert Jocham<br>
      <a href="http://www.hubertjocham.de/item.php/type/sans/NewLibris/" title="http://www.hubertjocham.de/item.php/type/sans/NewLibris/">http://www.hubertjocham.de/item.php/type/sans/NewLibris/</a><br>
      <a href="http://www.hubertjocham.de/item.php/type/sans/NewJune/" title="http://www.hubertjocham.de/item.php/type/sans/NewJune/">http://www.hubertjocham.de/item.php/type/sans/NewJune/</a></p>
      <p>Thus endeth the lesson.</p>
