    html: |-
      <p>If you're looking at that A on a proof from a desktop laser printer, you may not be getting an accurate representation. The overshoot may be getting suppressed at lower resolutions, depending upon the hinting &amp;c. </p>
      <p>I would advise against increasing the size of the A. Even a seemingly negligible increase could lead to unwanted side effects regarding relative weight.</p>
      <p>-- K.</p>
