    html: |-
      <p>If something looks 'wrong' to your client, it may be, it isn't necessarily what they think it is. </p>
      <p>The top of the A has a natural problem of light 'color', but this is handled in Futura by extending its sharply pointed top higher than the overshoot height of the O. However, in small sizes the sharp top may visually vanish, I don't know. I think somebody mentioned this on the thread about Gotham and Avenir. If you go to a heavier weight or use Avenir instead--which has a flat top that won't disappear at small sizes--it might improve things. </p>
      <p>I have Futura Light BT on my machine and the built-in kerning looks good for PAV. However, if it is with other letters on either side, than can affect how loose or tight the whole thing should be. Also if you pushed for maximum tightness that would mess up the balance.</p>
      <p>If you just shrink the caps, instead of using small caps, they may well also look 'wrong' by being too light. If you are going to shrink them you will probably have to go to the next heavier weight, then shrink, in order to look right.  </p>
      <p>So I don't know what's wrong, but it can be something other than you might think at first. </p>
      <p>edit: I cross posted with Kent. I like his analysis. The problem may be *both* a proof and an optical effect of Futura Light at small sizes as well.</p>
