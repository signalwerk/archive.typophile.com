    <p>Would someone help me from committing any unforgivable type abominations? </p>
    <p>I have been working on stationery for an accounting client. They want all partners' names on the letterhead with professional credentials following each name (e.g. John Smith CPA, CVA).</p>
    <p>The typeface I'm using is Futura BT Light. The names are set in 8-pt.</p>
    <p>I have 2 questions:</p>
    <p>1. I don't like the way the all caps look following each name; they seem so overpowering. Is it acceptable to deemphasize them by applying small caps (from InDesign's type style palette) to those credentials? Or is it best to leave credentials in caps the same size as the first letter of the names? (I know that some typeface families have proper small caps sets, but haven't checked to see if it's available in Futura BT.)</p>
    <p>2. My client saw a digital proof and says the capital A seems smaller than the other capital letters in the same line. She asked if we could make only the A larger to correct that. Is this acceptable? I've never changed the point size within single lines of type this way because I have faith the type designer knows best.</p>
    <p>TiA</p>
