    <p>Hello.</p>
    <p>I am doing an identity branding for a client who would like to use Vag Rounded. I seem to be using this more and more with clients and would like to have something similar, but a little different.</p>
    <p>I was wondering if anybody could throw any ideas in the air as to what alternatives there could be to Vag Rounded.</p>
    <p>Thanks a lot.</p>
    <p>James</p>
