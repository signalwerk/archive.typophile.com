    <p>Hi typohiles!</p>
    <p>This is probably the first time I really have to get the kerning right in a logo. Im a web designer by trade and come from Iceland where everyone is pretty much a generalist. I would be very thankful if you nice people would help me make the kerning in this logo better.</p>
    <p>My eye tells me this is close but I'm not too sure about the "ke" pair at the end. What do you guys think?</p>
    <p>Thanks in advance.</p>
