    date: 2012-04-13T22:11:00
    votes: null
    html: |-
      <p>Agree with what others have posted, 're' is too tight, as is 'ak' in relation to 'ma'. For me, the 'ke' at the end is still a problem, it looks like you've set 'remake' quite tightly, but you might want to try it looser because the 'ke' being so tight just doesn't work, in my opinion.</p>
      <p>Also agree that there might be a problem with 'electric' once you scale the logo down, as it will start to get very small. And the kerning between the c and t is a little loose at the moment. It looks a little like it says 'elec tric'.</p>
      <p>Hope that helps, actually think it's not far from being a good logo.</p>
