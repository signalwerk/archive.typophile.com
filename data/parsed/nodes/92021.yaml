    html: |-
      <p>I agree with hrant, the spacing in general is a bit too tight. When you reduce this to smaller sizes you may lose spacing between letters entirely. </p>
      <p>I'd increase the space evenly in remake, and perhaps an extra pixel or two between "ak". On electric, the "t" should be nudged a bit to the left, and "ele" should be moved over a little bit (an extra pixel).</p>
