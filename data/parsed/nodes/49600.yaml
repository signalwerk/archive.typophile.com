    html: |-
      <p>@Alessandro: I don't understand what you mean. “Campionario caratteri” is the name which has been used as long as we had printed specimens, I did not propose a theoretical name.<br>
      If you use "specimen" side by side of "caratteri" on Google you get more results, but if you use "campionario", you get less, but more relevant.<br>
      Of course, the English term has become more common use as in the last 10 years more Italian people started to get involved in type design, but the English term does not make a substitute per se.</p>
      <p>I have never thought history of typography could be separated from the history of writing, where did you get the idea when you believed so?</p>
      <p>EDIT: Of course, "specimen" is Latin, but in this specifical meaning is an English adoption. In Italian it seems it's used mostly as a biology (or medicine) term.</p>
