    <p>Hello,</p>
    <p>how do you say »type specimen« in other languages?<br>
    In German, my native language, it is »Schriftmuster«.<br>
    What is it in France, in Spanish, Greek or Russian?</p>
    <p>Jak se česky řekne »type specimen«?<br>
    Hoe zeg je »type specimen« in het Nederlands?<br>
    Miten sanotaan »type specimen«suomeksi?<br>
    Comment dit-on »type specimen« en français?<br>
    Πῶς λὲς »type specimen« στὰ ἑλληνικά;<br>
    Come si dice »type specimen« in italiano?<br>
    Jak się mówi »type specimen« po polsku?<br>
    Como se diz »type specimen« em português?<br>
    Как сказать »type specimen« по-русски?<br>
    ¿Cómo se dice »type specimen« en español?</p>
    <p>Please tell me your native language and how you say »type specimen«.<br>
    Thank you very much in anticipation of your answers!</p>
    <p>Kind regards,<br>
    Th. Kunz<br>
    [www.pomeranz.de]</p>
