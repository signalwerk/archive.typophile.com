      <p><cite> and if we look at G.B. Bodoni he had not used “campionario” but “serie.” </cite><br>
      Yes, although we have a plurality of meaning in this.<br>
      You're right, however, about "campionario", it's more a commercial term and it probably emerged in the early 1900s, after the industrial revolution. But it seems quite a good explanatory term in Italian to me, for this purpose. Actually "serie" would be almost an appropriate translation for "Font" (a specific style, weight and size). Of course, "serie" is also the weight/variant only.</p>
      <p>Thanks for all the translations… :=)</p>
