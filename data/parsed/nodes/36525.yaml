  html: |-
    <p>I’ve searched high and low for this font that appeared on the AA Publications book “Morphogenesis of Flux Structure” book by Mutsuro Sasaki.</p>
    <p>It’s similar to Chunkfeeder or United faces, but particularly different “G” and “R.” It may or may not be monospaced.</p>
    <p>You can see the whole specimen here:<br>
    <a href="http://www.aaschool.info/publications/images/sasaki_book_cover.jpg" title="http://www.aaschool.info/publications/images/sasaki_book_cover.jpg">http://www.aaschool.info/publications/images/sasaki_book_cover.jpg</a></p>
    <p>But here’s a snippet of it:</p>
    <p></p><div class="imageWrap"><img src="/files/sasaki_book_cover_4925.jpg"></div><p></p>
    <p>Any ideas?</p>
    <p>Thanks in advance.</p>
