  html: |-
    <p>I extracted this image from the letterhead of a controversial website with the same name. It was in a gaudy gold on blood red presentation, which I eliminated. </p><div class="imageWrap"><img src="http://typophile.com/files/GermanVictimsScriptSM_5345.jpg"></div><br>
    The design looks similar to some German script fonts from the 1920s and 1930s that are fairly regular in style and were set in metal type. But I did not find a match in Jaspert's _Type Encyclopaedia_.<br>
    Repeating letters _m_ and _i_ seem to be identical. The good fit of the tails with following letters might be produced by the usual methods used to create a digital font<br>
    I would welcome any suggestions.<br>
    Thanks .<br>
    Don<p></p>
