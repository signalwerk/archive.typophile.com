    <p>Hello,<br>
     The french singer Stromae uses amazing backgrounds and Tools of communication to promote and for his covers. Could you tell me what's the font he used ?</p>
    <p><img src="/sites/default/files/old-images/Stromae-Papaoutai_3951.png"></p>
    <p> Maybe it could help : for his first album he used Century Gothic. It seems this font looks like the font i'm looking for.</p>
    <p>Do you have any idea of the name of this font ?</p>
    <p>Thank you for your help !</p>
    <p>J.</p>
