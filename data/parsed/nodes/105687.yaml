    html: |-
      <p>This font is based on a mathematical construct called a moebius strip.<br>
      Note the twist in the o.<br>
      This matches the twist in the O in <a href="http://www.emigre.com/EF.php?fid=214l">Priori-Acute</a> by John-Barnbrook at Emigre.<br>
      Priori-Acute is an uppercase font, while "stromae" is lowercase.<br><img src="/sites/default/files/old-images/PrioriAcuteJohnBarnbrookEmigre_6453.jpg"><br>
      I look forward to someone finding a match for the two versions of the lower case twisted sans used by Stromae.<br>
      Don</p>
