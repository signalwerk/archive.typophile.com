    <p>Anyone have any suggestions for a “breezy”/contemporary Egyptian typeface that would be a good match for the sans-serif Flama:</p>
    <p><a href="https://web.archive.org/web/20081015211333/http://www.felicianotypefoundry.com/main/?page_id=10" title="http://www.felicianotypefoundry.com/main/?page_id=10">http://www.felicianotypefoundry.com/main/?page_id=10</a></p>
    <p>The Egyptian would be used for display type in a newspaper, and would ideally have several available weights.</p>
    <p>Thanks!!</p>
