    <p>I'm trying to locate a font similar to <a href="http://desktoppub.about.com/library/fonts/hs/uc_creampuff.htm" title="Click to visit an external URL." class="freelink freelink-external freelink-external">creampuff</a> (like Eclat) but not quite as fat. I've looked at Monotype Script, Ballpark, Sedona, Ephemera, Casey, etc and can't quite find the right one. It has to have straight tops to the lowercase letters as opposed to rounded. Does anyone have any suggestions?</p>
    <p>Something like <a href="http://www.baseballatthebeach.com/_borders/Baseball%20at%20the%20Beach%20Logo.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this image</a> or the <a href="http://www.sportslogos.net/images/Baseball/NL/NYM_1235.gif" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Mets logo</a> would be great...</p>
