  html: |-
    <p>This is a typeface I have been working on for a couple of years, and I have not been able to get to a point where I feel it is finished. I think it is the puncuation and non-letter characters that I do not like. It is mostly a display face but I do envision it being used for small blocks of text. I would appreciate any comments.</p>
    <p>I am also looking for any ideas on what to name the typeface.</p>
    <p><a href="http://www.typefetish.com/itw/quirkblklttr.pdf" title="http://www.typefetish.com/itw/quirkblklttr.pdf">http://www.typefetish.com/itw/quirkblklttr.pdf</a></p>
    <p>Thanks<br>
    Michael</p>
