      <p>Bert's answer is probably right, but you could approximate this with H&amp;FJ <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100004" rel="nofollow">Didot</a> using the larger point size versions. All that is missing is a half bracket on the right side of the thin stem serifs.</p>
      <p>- Mike Yanega</p>
