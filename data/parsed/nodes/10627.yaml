    html: <p> Cool! <br> <br>And the hairline solutions on "B", "K", "R", and especially "N" are particularly interesting. <br> <br>"N" perhaps should be widened by a pixel or so to provide a bit more counter room, though. It's the darkest glyph of the set in color, and the one most in danger of optically clogging up. <br> <br>David </p>
