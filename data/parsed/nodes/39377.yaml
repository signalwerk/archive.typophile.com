      <p>Diacritic characters, i.e. letters with diacritic marks, can be entered in text using two ways: static and dynamic. </p>
      <p>The static method is using precomposed forms, i.e. each character is represented by one glyph in the font. Most of these glyphs are made using components, so they are composite, or precomposed, glyphs. But for a repertoire of these precomposed glyphs, , codepages is an antique mechanism to look at. Please look at Unicode Ranges (also called Unicode blocks), this is a far more up-to-date mechanism to address  the repertoire of encoded precomposed diacritics. For example, look at the Latin Extended B block -- you will find a number of characters that are not in any codepages but are present in the Unicode standard. In the Unicode Ranges mode of FontLab Studio, you can create those glyphs by double-clicking, usually. </p>
      <p>Letters with diacritic marks that are not encoded in the Unicode standard in their precomposed form can be entered in text as a sequence of base letter followed by a combining diacritic mark. Their rendering can be performed using two dynamic methods: substitution or positioning. </p>
      <p>The substitution method works in many applications that support OpenType. It typically employs the "ccmp" OpenType Layout feature, while sometimes it can also be duplicated in the "liga" feature for backwards compatibility. I have detailed the process of their creation in FontLab Studio on the <a href="http://groups.msn.com/FontLab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=3403" rel="nofollow">FontLab forum</a>. </p>
      <p>The other dynamic method is positioning. This is done using the "mark" and "mkmk" OpenType Layout features. You need Microsoft VOLT to add those features. There is a VOLT tutorial on the <a href="http://scripts.sil.org/VOLT_Tutorial" rel="nofollow">SIL site</a>. </p>
      <p>Karsten Lücke's <a href="http://www.kltf.de/kltf_otresources.htm" rel="nofollow">OpenType resources collection</a> is also a good starting point. </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
