  html: |-
    <p>I have noticed that in many installed fonts, there is a HUGE selection of diacritical alternates for all sorts of letters that don't appear to be covered by the usual codepages. I would like to support at least some of these in my own typeface, but it doesn't appear that I can easily create these glyphs the way I can with the diacritics recognized by the codepages, wherein you can simply double click the glyph and a copy of both the letter and the diacritic is created. This allows changes made to either the diacritic or the letter to be automatically updated, and it makes large groups of these alterates very easy to create, delete and recreate as necessary.</p>
    <p>For these unrecognized diacritical glyphs, do I have to lose this functionality? I want to support a wide range of diacritics, but I might not have the time to create and manage them if they can't be handled as easily as the recognized ones.</p>
