  html: |-
    <p>I'm kerning a font, and the blue characters (that indicate that a glyph is part of a metrics class) in the Kerning palette of the Metrics Window distract me, so I can't as easily see where the kerning problems are.</p>
    <p>Is there a way to turn off the blue characters?</p>
    <p>Thanks,<br>
    Sv.</p>
