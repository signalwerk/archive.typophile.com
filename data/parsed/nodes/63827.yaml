    html: <p>The concept of the growing i is nice, but it's not well executed. I actually had a feeling there was an error in the logo, being that the first i was just way too short which makes the V's look like capital letters even though they're not bigger than the rest of the letters. This puts the whole logo out of balance. If it weren't for that "error", I probably wouldn't have noticed the growing i's. It has potential, but you're not quite there yet.</p>
