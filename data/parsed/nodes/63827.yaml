    html: "<p>I appreciate the concept if growth in the i's. Personally, I would maybe think twice about embedding the idea that the kids will be growing out of the clothing right in the logo. That said, should you choose to keep it ( and not be as paranoid about it as I may be ) I would suggest making it a bit more pronounced, so as to register at the first look : I only discovered it on the second or third take after thinking \"what's up with the i's, something is off balance\".</p>"
