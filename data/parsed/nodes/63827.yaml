      <p>The growing "i"s are fun. Have you tried small caps (but keep the tittles!)?<br>
      That way you'd lose the ascenders on "k" and "d", which do seem to "interrupt" the growth process. Although it might then look even more like the "i"s (=kids) are "growing out" of the brand – maybe don't make even the last one full height?</p>
      <p>Also: finding a more diagonal-oriented shape for the "k" might make it click with the "v"s better; and to my eye the "s" is too Helvetica-ish in comparison to the other glyphs.</p>
    html_clean: |-
