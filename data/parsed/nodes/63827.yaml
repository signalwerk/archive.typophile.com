    <p>Hi everyone</p>
    <p>can i get your guy's opinion on an identity i am working on?<br>
    my gf and i started a line of illustration on baby onesie and toddler shirts.</p>
    <p>here is a link to the illustrations.<br>
    <a href="http://designtn.com/vivikids/" title="http://designtn.com/vivikids/">http://designtn.com/vivikids/</a></p>
    <p>and here is the identity that is accompanying that line.</p>
    <p>i wanted something clean, simple, and will appeal to mom's<br>
    i modified and "v" and "i" in the logotype.</p>
    <p>any comments?</p><div class="imageWrap"><img src="http://typophile.com/files/vivikids_3929.png"></div><p></p>
    <p>…and thanks for looking and your feedbacks.</p>
    <p>:tony</p>
