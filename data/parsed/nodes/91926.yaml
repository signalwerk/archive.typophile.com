    <p>Hello,</p>
    <p>I am currently considering dissertaion topics for my Graphic Design degree.<br>
    One of my propsed topics is; Comparing the ebook with the printed book in terms of design aesthetics and whether the ebook spells the end of the printed book in the British publishing market.</p>
    <p>Any advice/ relevant information regarding my proposed topic would be much appreciated.</p>
    <p>Thanks,<br>
    Rebecca</p>
