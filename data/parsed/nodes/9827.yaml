    html: "<p><i>\"Also, the color feels inconsistent.\" --&gt; can you explain me this one? i am German-speaking and don't understand this one (word). do you mean gray impression that might be not even? </i> <br> <br>Yeah, the large aperture and thin lower stroke in the c, especially, might keep the letters from creating an even gray on the page. \"Color\" is indeed the overall impression of the page's balance of black and white. And I probably spoke to soon: that was just my gut response, and until I see this font in a text setting and printed, I won't know how I feel about its color. <br> <br><i>i am unsure about the t myself, but i don't know how to do it yet. is it right that the cross bar has to be x-height?</i> <br> <br>The t's height and crossbar are all right, I think you just need to work on the curve of the tail. It feels too narrow. <br> <br><i>s is (as expected) my big problem child  i just don't know how to do it right. do you think it should rise more steeply?  <br>at the moment, it's too small as well. </i> <br> <br>The curve in the middle of the s should be thinner</p>"
    html_clean: "<p><i>\"Also, the color feels inconsistent.\" --&gt; can you explain me this one? i am German-speaking and don't understand this one (word). do you mean gray impression that might be not even? </i> <br> <br>Yeah, the large aperture and thin lower stroke in the c, especially, might keep the letters from creating an even gray on the page. \"Color\" is indeed the overall impression of the page's balance of black and white. And I probably spoke to soon: that was just my gut response, and until I see this font in a text setting and printed, I won't know how I feel about its color. <br> <br><i>i am unsure about the t myself, but i don't know how to do it yet. is it right that the cross bar has to be x-height?</i> <br> <br>The t's height and crossbar are all right, I think you just need to work on the curve of the tail. It feels too narrow. <br> <br><i>s is (as expected) my big problem child  i just don't know how to do it right. do you think it should rise more steeply?  <br>at the moment, it's too small as well. </i> <br> <br>The curve in the middle of the s should be thinner</p>"
