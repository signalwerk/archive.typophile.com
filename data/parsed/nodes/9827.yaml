    html: <p>you are right, a high stroke contrast implies lesser readability, that's why i intend it for short texts only (maybe jewelry-advertising? i don't know), and for display use. <br>"Also, the color feels inconsistent." --&gt; can you explain me this one? i am German-speaking and don't understand this one (word). do you mean gray impression that might be not even? <br> <br>the direction of the serifs is inspired by Rotis SemiSerif (Otl Aicher), i think they are okay, except maybe for the z (i can't figure out how to do them right). <br> <br>i am unsure about the t myself, but i don't know how to do it yet. is it right that the cross bar has to be x-height? <br> <br>s is (as expected) my big problem child <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> i just don't know how to do it right. do you think it should rise more steeply? <br>at the moment, it's too small as well. <br> <br>you are right on the c and the m. c has to be corrected, i will have a look on m as well. <br> <br>i hate the tail on the y <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br>do you really like this one? <br> <br>well, next big step will be upper case, but before i will think about re-doing the horizontal stroke weight. <br> <br> <br>thanks a lot for your feedback, this really helps me to continue <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
