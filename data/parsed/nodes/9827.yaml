    html: "<p>Right now it feels a bit like a didot, with the weaknesses that implies: I think the widths of your horizontal strokes will be pushing things at text sizes. Also, the color feels inconsistent. <br> <br>I like the serifs, although I think maybe they're a little too consistent right now, with all of them facing left except for the g. They also look a little funny on the v, w, and z, although I'm not sure what I'd like to see instead. <br> <br>The t feels a little stunted. The spine on the s feels inelegant and chunky, although I like the terminals. <br> <br>The counters all look nice, except the m feels a little compressed and the c has too much open space inside. <br> <br>I like the tail on the y. <br> <br>Overall, this has promise. This has kind of a postmodern feel without being irritating about it, and I like what you've done with the idea of semi-serifs.</p>"
    html_clean: "<p>Right now it feels a bit like a didot, with the weaknesses that implies: I think the widths of your horizontal strokes will be pushing things at text sizes. Also, the color feels inconsistent. <br> <br>I like the serifs, although I think maybe they're a little too consistent right now, with all of them facing left except for the g. They also look a little funny on the v, w, and z, although I'm not sure what I'd like to see instead. <br> <br>The t feels a little stunted. The spine on the s feels inelegant and chunky, although I like the terminals. <br> <br>The counters all look nice, except the m feels a little compressed and the c has too much open space inside. <br> <br>I like the tail on the y. <br> <br>Overall, this has promise. This has kind of a postmodern feel without being irritating about it, and I like what you've done with the idea of semi-serifs.</p>"
