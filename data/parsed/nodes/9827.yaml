  html: <p>Hi, <br> <br>this is my first font i've ever made. It is a quite a strange mixture of classicistic fonts and modern semi-serifs. <br> <br>i have just finished a first sketch of the lower case glyphs, now starting with upper case, and i would appreciate some feedback about the work so far. <br> <br>I haven't done any kerning or spacing yet, so it doesn't make sense to show reading-sized text (it would be too ugly), but the font is intended to be used as reading-font for small text-passages, and display-sizes. <br> <br>what do you think about the idea at all? what about horizontal stroke-weight? is it too thin for reading-sized text? any suggestions about one of the glyphs? <br> <br>thanks for your comments, <br>sebilar <br> <br><img src="http://www.typophile.com/forums/messages/29/67605.gif" alt="gif of lowercase unnamed_classicistic_semiserif"></p>
  html_clean: <p>Hi, <br> <br>this is my first font i've ever made. It is a quite a strange mixture of classicistic fonts and modern semi-serifs. <br> <br>i have just finished a first sketch of the lower case glyphs, now starting with upper case, and i would appreciate some feedback about the work so far. <br> <br>I haven't done any kerning or spacing yet, so it doesn't make sense to show reading-sized text (it would be too ugly), but the font is intended to be used as reading-font for small text-passages, and display-sizes. <br> <br>what do you think about the idea at all? what about horizontal stroke-weight? is it too thin for reading-sized text? any suggestions about one of the glyphs? <br> <br>thanks for your comments, <br>sebilar <br> <br><img src="http://www.typophile.com/forums/messages/29/67605.gif" alt="gif of lowercase unnamed_classicistic_semiserif"></p>
