      <p>Well, TeX will do what Karsten suggests. I'm not sure whether or not InDesign has the resources, I'll have to think on that. Maybe Karsten already knows, and a simple script could be written. I'm not sure you, as a font designer, have to support the language regardless of the text editor chosen -- in mathematics, for example, few text editors, without plugins, can handle multi-level equations, even if all the pieces are available in the font.</p>
      <p>But you're right on at least two counts, it is an interesting problem, and differing orthographies use differing treatments of basic characters. And I can certainly feel the emotional tug to provide the solution inside the font, so any neophyte can have success.</p>
