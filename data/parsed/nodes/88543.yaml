      <p>Firstly, I thank very much all you for the detailed information and ideas.</p>
      <p><em>You have to poke with even scholars. They use what's both easy, and available.</em></p>
      <p>Charles, you are right they would use the tool available and this can cause misinterpretation. But this situation is a bit different.</p>
      <p>My attention to this issue was actually a result of a <a class="freelinking external" href="http://typophile.com/node/67787#comment-416624" rel="nofollow">comment</a> about my font project. Its author, James Crippen, studies the Pacific Northwest languages and knows about typography. Since then, I kept contact with other researchers and got information about <strong>both</strong> combinations, using macron below and line below.</p>
      <p>The macron below is easy to manage with mark positioning. The problem arises with U+0332, as I found the three possible approaches cited above.</p>
      <p><em>...when an application finds this diacritic, it knows that it needs to underline the preceding base character's glyph(s) and generate an underline</em></p>
      <p>Karsten, this would be nice –if available.</p>
      <p>Underline effect cannot emulate the line below diacritic when there are descenders. Combinations with g, p, q or j and u+0332 must have the diacritic below the descender and not crossing it. But this is not the way underline effect is applied in word processors.</p>
      <p>The only alternative I know is InDesign underline style (the same may exist in Quark). But, again, this reduces the audience.</p>
      <p>Although there is no clear solution by now, this is a rich discussion. Thanks.</p>
      <p><em>Sidenote about type designer's role</em><br>
      IMHO, as a font embraces base characters and diacritics, it would offer a decent result when combining these elements through the state-of-art technologies. We have precomposed glyphs and mark positioning to produce this, but in some cases this seem not enough –as in the U+0332 case.</p>
      <p>If layout applications can supply additional improvement, so better. But if the font claims support to a given language, it need to offer user a solution for at least the current version of main word processors.</p>
