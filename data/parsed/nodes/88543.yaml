      <p>Are you sure the diacritic used in African and Amerindian orthographies isn't U+0331, the combining sub macron? That is a much more common diacritic mark than the underline.</p>
      <p>With regard to your other question, my interpretation of the combining underline, and the combining overline, is that they should connect to form a continuous line.</p>
