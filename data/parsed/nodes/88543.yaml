      <p>For the line below a digraph, there is U+035F. Used in romanized Indic scripts, too -- kh &amp; gh, isn't it?</p>
      <p>As for the general character to be used, this cannot be entirely left up to typographers. I'm in sympathy with the macron below (U+0331), but if a publisher/editor/author insisted, would use the touching line below.</p>
      <p>There is a sort of parallel here with the glottal stop for romanized Polynesian. Why should it (the okina) be signaled with the turned comma, ("single open quote"), whereas so many other romanized languages use the raised comma ("single closed quote")? And why does one of the the South American Native languages have to use yet another character to signal a glottal stop? (It is late, I am tired, forgive me for not remembering.) Orthography is custom, in the final analysis.</p>
      <p>I'm still of the opinion the type designer must provide for both, the typesetter can recommend the "macron below," but in the end, author/editor (aka customers) have the final choice.</p>
      <p>FWIW</p>
