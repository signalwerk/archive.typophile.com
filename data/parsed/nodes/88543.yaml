      <p>Trying out my "brute force" solution, I wrote <a class="freelinking external" href="http://amiri.git.sourceforge.net/git/gitweb.cgi?p=amiri/amiri;a=commitdiff;h=8f49417e677b45110eec105d299a9a623aa7cd29" rel="nofollow">a bit of Python code</a> (using FontForge) to automate building the mark glyphs, the variants and the contextual substitutions (the code is unnecessary complex because I want to handle glyphs that have other combining marks).</p>
      <p>It seems not to work with all OpenType engines though (2 out of 3 tested work, didn't test MS's or Adobe's however), an interesting exercise nevertheless.</p>
