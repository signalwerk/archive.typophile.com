      <p>Karsten, in theory I like that approach. If I understand you, syntactical meaning would be preserved, but the presentation would be handled by the layout program.</p>
      <p>The problem is I trust type designers more than I trust the software engineers who write layout programs. Just one small example: with InDesign, the "figure space" is one value. It does not change with the figure character set selected. </p>
      <p>One larger example: now that we have EPUB3, you would think the readers would comply. But they're too caught up with device wars. So Apple changes the available fonts, but does not, best I can tell, allow useful, always-going-to-work, font embedding. If you can take a bit of rough language, you might find this enlightening: </p>
      <p><a href="http://www.the-digital-reader.com/2011/02/20/an-analysis-of-epub3-and-uh-a-bit-more/" title="http://www.the-digital-reader.com/2011/02/20/an-analysis-of-epub3-and-uh-a-bit-more/">http://www.the-digital-reader.com/2011/02/20/an-analysis-of-epub3-and-uh...</a></p>
      <p>Back to layout programs: it's not quite enough if the layout program supports this only for those who can write a script -- too small an audience. There are very few people who have all the needed expertise with languages, typesetting, programming, etc.</p>
      <p>(my turn to apologize for a bunch of edits)</p>
