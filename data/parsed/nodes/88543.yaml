      <p>I think this is issue is similar to <a class="freelinking external" href="http://en.wikipedia.org/wiki/Syriac_Abbreviation_Mark" rel="nofollow">Syriac abbreviation mark</a> which is an overline that spans a whole word, and thus need to be handled in a special way by the layout engine (AFAIK only MS's Uniscribe handles it correctly). I think the layout engine can handle the combining overline/underline in a similar way e.g. stretching or shrinking it to fit the width of the underlying glyph, or even replacing it entirely by a horizontal rule (in TeX speak) of thickness and position similar to the diacritic in the font.</p>
      <p>Another brute force approach is to have multiple glyphs each fits the width of a group of base glyphs and use contextual substitution (trying this for my Arabic font, where I might use the overline for Quranic annotation, it seems I'll need from 25 to 50 overline glyphs, based on how vigorously I round base glyph widths for grouping).</p>
