      <p>What you write is interesting because it suggests a solution which some applications already use when it comes to space characters (thin space, en-space, em-space, figure space, etc):</p>
      <p>Technically, there does not need to be a glyph for Unicode 0332 in fonts. Instead, when an application finds this diacritic, it knows that it needs to underline the preceding base character's glyph(s) and generate an underline that is slightly wider than glyph(s) width. As a bonus, <em>if</em> a glyph is present for Unicode 0332 in a font, the application would measure its yMin and yMax to determine the generative underline's positioning and thickness – but ignore the glyph's actual shape.</p>
      <p>I do not think that it is a good idea that fonts provide glyphs for each and every Unicode character. It also looks like a misunderstanding on type designers' side and application developers' side. Unicode also encodes operators and higher-level delimiters which may or may not be used by layout engines, and may or may not be present in a character string, yet they either do not need any visual representation or their appearance is better generated on the application side.<br>
      E.g. the above-mentioned spaces are more consistent if applications produce them in a generative way and independent of the fonts in use, which makes 'space behavior' more predictable to the typographer. Put a bit less favorable as regards ourselves: Type designers easily get such things wrong and come up with ideosyncratic solutions. Their job, above all, is to design the visual elements for text production. They do not need to know whether this or that special character exists, they should not be bothered with certain technicalities of text layout. This is not their business. Switching from type designers' to fonts' perspective: It is not up to fonts to care for all aspects of text layout. They provide the visual parts needed for text layout.<br>
      In so far, it would be interesting to have some Unicode Companion that not only offers a brief description per character, but for special characters provides clear recommendations whether and, if so, how to visualize them. Application and/or layout engine developers who claim to produce Unicode compatible software better follow.</p>
