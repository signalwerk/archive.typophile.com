      <p>A story. When I had to set a book with a number of Kiowa words -- which use a "line below" for some vowels -- I asked the author what was proper, a macron below, or a line below? And if a line, should it be the width of the character it was below, or have a constant width? And I pointed out to him that if a line below with constant width was used, there could be some vowel sequences that would, in effect, appear like several characters simply underlined.</p>
      <p>His rely was that it should be a macron below. I'd note in his typescript, he had used an underline.</p>
      <p>Point is, you have to poke with even scholars. They use what's both easy, and available. Then old wives tales are set up. I use to draw up characters for the hamza and ayn (for romanized setting of Arabic) that were in keeping with the font. Then kept getting told by junior-level proof readers that the proper character was monoline (well, they don't know that word, but that's what they meant), as in the phonetic half-ring. What they didn't know was that prior to PostScript, that was about as close as we could easily come to a character that represented what was needed. Its use was an unfortunate compromise</p>
      <p>Question: At what point does an unfortunate compromise become accepted orthography? Many of these languages never had a written form until scholars came up with an orthography for a romanized setting. They chose what was easy. And that choice could be affected by whether or not they were using a pencil or a typewriter, as with the differences between Ella Deloria and Buchtel in Lakota.</p>
      <p>If we're voting, I vote with John on this one for the proper character, but disagree about touching. Just a standard-deviation decision, based on author responses.</p>
      <p><cite>Edit</cite></p>
      <p>Actually, if you want to be thorough, you should have both. Hard to tell an expert in the language he/she is wrong, even when there is disagreement by the scholarly "authorities" on what's correct. IIRC, The only real decision rests on a couple of precomposed characters in Latin Extended Additional. These two could be handled by a stylistic set. Or maybe I don't RC.</p>
