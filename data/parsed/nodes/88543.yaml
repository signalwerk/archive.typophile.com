      <p>Igor, when I'm making a font in which I know the overline or underline combinng marks need to work, I include a few different variant widths based on typical letter widths, and triggered by context. I also vary the height over the whole run of glyphs depending on whether there are ascenders/descender or not. And because some wide glyphs may not have a line the covers the full width, I contextually insert connecting strokes between the bases.</p>
      <p>Karsten, application over/under lining for diacritic purposes is tricky. You need information about diacritic weight and alignment to do it properly.</p>
