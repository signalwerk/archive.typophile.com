    <p>The "line below" diacritic is used in African and native North American languages. It has the 0332 codepoint. Also called underline, it must not be confused with the typographical underline feature.</p>
    <p>Questions this diacritic causes:</p>
    <p><strong>1</strong>. Must this diacritic match the base letter width? I found three approaches so far: <em>(a)</em> fonts with line below matching the base letter width; <em>(b)</em> fonts where the line below has always the same width; and <em>(c)</em> fonts with line below matching thin letters (as i and l) but with a fixed size for the others. </p>
    <p><strong>2</strong>. If the line below must follow the base width, how to distinguish i or l with line below from i or l with macron below?</p>
    <p><strong>3</strong>. When pairing two letters with line below, must the diacritics touch each other in order to produce a continuous line?</p>
    <p>Similar issues could be argued about the line above diacritic (Unicode 0305)</p>
    <p>Samples:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/linebelow_4296.gif"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/linebelow2_6641.gif"></div><p></p>
