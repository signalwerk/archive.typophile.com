      <p>Khaled, that's a real problem. Unicode doesn't have precomposed characters with U+0332, does it? Yet you can't have a single character as with U+0332 that covers an "i" and a wide letter, such as a "W", and is connecting. If you make it wide enough for the "W", when used with an "i", it will "overextend" enough to underline other characters. What to do? </p>
      <p>You shouldn't use the layout program to underline, as that is not a character but an attribute, and will not preserve syntactical meaning. What you would have to do in the font is to use *ccmp*, not *mark*. And BTW, a number of languages have diacriticals on the character besides the "underline," so you're stuck with ccmp throughout.</p>
      <p>Now if most languages use the macron below, the problem is lessened.</p>
      <p>Or write a EULA that passes the problem along to the comp, who has to deal with the author(s) in any case. I know, I'm a broken record.</p>
