      <p>I suppose I ought to chime in here about Pacific Northwest orthographies again. The original implementation of underscore diacritics in the Pacific Northwest languages was on (American) typewriters. An underscore was considered to be very easy to use, you simply pressed backspace and then pressed the underscore key (Shift + -). It was also a symbol that wasn’t going to be confused with English, and it had the added advantage of being mnemonic as a ‘lower’ symbol to represent uvular sounds that are articulated further back in the mouth. Since typewriters were designed for English, the underscore was obviously originally meant to be a punctuation or annotation symbol and hence was meant to connect between glyphs so one could type a continuous underline. This would replicate the traditional manuscript underlining meant to indicate italics to the printer.</p>
      <p>When the underscore was repurposed as a diacritic there was absolutely no thought given to typography since after all people were using <em>typewriters</em> where typographic nuance was already terribly impoverished. But if you look at the very few publications that had input from professional typographers (e.g. Constance Naish &amp; Gillian Story 1973, “Tlingit verb dictionary”) you find that they replaced the underscores with carefully crafted diacritics which did not extend the full width of the glyph, and more importantly didn’t connect between glyphs. In addition, rather than crossing the descenders like the typewriter underscore would, the typographically sensitive solution shortened the descenders slightly and put the diacritics below them.</p>
      <p>It’s less likely that you’d get a chance to see handwriting, but I can unequivocally say that handwritten underscore diacritics are always separate from each other when two of them occur in sequence. (Due to the vagaries of handwriting, the width of the diacritics is wildly variable, ranging from a slightly extended dot to a straight line wider than the actual letter with curls at both ends.) In handwriting it is more common for the diacritic to cross the descender, but they sometimes do appear below.</p>
      <p>Now we come to Unicode, which actually makes a distinction between the two kinds of underscore diacritic. This the first time in history that the two kinds are available at the same time in the same system. U+0332 is meant to connect between glyphs, as the Unicode standard explicitly says. Consequently U+0331 must be meant to act as a diacritic appropriate to a single glyph, and isn’t meant to connect between glyphs. But the scholars and community members who are working to computerize their languages are not Unicode experts, and they go with whatever a “good looking” font happens to implement (or more often they use whatever underlining markup is provided by e.g. Word, HTML, Flash, or InDesign). They also choose something familiar, and if all you’ve ever seen is typewriter underscores then that’s all you know. Unicode was to some extent trying to capture the distinction between textually meaningful underlining (as opposed to markup) and the underscore as a single-glyph diacritic. That’s a distinction that was never made within the same document, but now all document preparers are forced to make the decision between the two. Most don’t even know that there was ever a decision to be made.</p>
      <p>The point I’m getting at is that this is a situation where the font designers have to take charge, rather than rely on some community consensus that will probably never arise. If you make fonts where U+0332 doesn’t do what people expect but also make U+0331 available, then people will switch to it. If you make a compromise between them then people won’t switch and we’ll be left with both poor typography and incompatible encoding of fundamentally the same orthographic symbols. In reality this depends a bit more on keyboard layout designers than on font designers, since the layout is what makes the diacritics easily available for people. But it’s rather useless if you have a symbol you can type but which won’t print, so the fonts need to have good support too.</p>
      <p>There are actually a few orthographies where the connected underscore is the proper one to use. Dakelh, a.k.a. Carrier, uses underscore diacritics on *digraphs*. Because of this, the underscores are meant to connect together since the two glyphs in a digraph are orthographically part of a single letter. For this use, even if U+0332 doesn’t connect between glyphs it should get nearly to the point of connection so that the spread of the diacritic across digraphs is clear.</p>
      <p>The overline was probably initially thought of by Unicode members for things like Roman inscriptions and for manuscript transcriptions. In manuscripts it is often used to indicate elision or abbreviation, so that Χ̅Ρ̅ is an abbreviation for ‘ΧΡΙΣΤΟΣ’, and l̅ for ‘vel’. If one is trying to make an accurate transcription of a manuscript then this cannot be treated like some kind of markup, but is instead an integral part of the text as much as the letters or punctuation. I imagine that an underline has seen similar uses, hence Unicode’s inclusion.</p>
