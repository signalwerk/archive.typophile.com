    html: |-
      <p>Sorry, I have been gone for a week, but those samples convince me that "Life" is the right typeface. There is only one anomaly that I have noticed -- the italic J is wrong. The "Life" italic J should not have a serif on the tail of the J, just as it does not in the Roman J (see John Rimmer in bottom sample). The type is surely not Times because the J is below the baseline and the wrong shape.</p>
      <p>I'm sticking with my answer.</p>
      <p>- Mike Yanega</p>
