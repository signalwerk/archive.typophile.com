    html: |-
      <p>In looking through Jaspert's "Encyclopaedia of Type Faces" I think this may be Life by Ludwig &amp; Mayer from 1964. The <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/life/ ?refby=bowfin" rel="nofollow">digital</a> version does not show the slightly angled eye of the 'e', but the distinctive slanted upper bowl of the 'g' is there. It seems as if your scan lost some details, like the ear of the 'g' and the arm (?) of the 'r', but if I had to guess right now, that would be my choice.</p>
      <p>Anyone else have some printed metal samples of Life to compare?</p>
      <p>- Mike Yanega</p>
