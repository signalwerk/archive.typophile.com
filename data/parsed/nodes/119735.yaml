    html: |-
      <p>Suzee, Coco and Signalist are interesting as being close on _m_ and _n_ but more angular than the other lower case letters in Tim Hortons. All of the suggestions are useful for their insights as to how a Tim Hortons font could be constructed. An interesting possible alternative to the endless assortment of bulgy irregular doodlings and creamy packaging letters  that pass for modern thick scripts.<br>
      Don</p>
