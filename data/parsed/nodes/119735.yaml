    <p>Burger King recently purchased Tim Hortons.<br>
    I know the Tim Hortons logo is lettering but I was wondering what font would be the closest.<br><img src="/sites/default/files/old-images/TimsHortonsSM_6317.jpg"><br>
    Any suggestions?<br>
    Thanks.<br>
    Don</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/TimsHortons.jpg" width="1225" height="801" alt="">
