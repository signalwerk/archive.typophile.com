      <p>Thanks Fivos &amp; Kevin for the good suggestions.<br>
      I was going through them from the top, and the thought occurred to me that Coffee Service might be loosely based on Tim Hortons, which is in the business of serving coffee -- mostly to the blue collar/sports fan crowd rather than the yuppies of Starbucks.<br>
      Now, on to the next suggestion...<br>
      Don</p>
