    html: |-
      <p>Is the slight contrast fully intentional? In my opinion, the industrial look you want could be achieved more easily if the strokes seemed monolinear. The "h" and the "b" are too wide for my taste. The "v" is still out of the concept, but its low contrast is consistent with the industrial look you're after. The lower stroke of the "e" is too short. The "m" is too complex in comparison with the other letters.</p>
      <p>¿Es intencional el contraste? En mi opinión, el "look" industrial que busca podría conseguirse más facilmente si los trazos fueran monolineales. En cuanto a proporciones, la "h" y la "b" me parecen muy anchas. La "v" sigue viéndose fuera del concepto, pero su ausencia de contraste me parece consistente con el look industrial perseguido. El trazo inferior de la "e" me parece demasiado corto. La "m" es muy compleja en comparación con las demás.</p>
      <p>César Puertas<br>
      diseñador (tipo)gráfico</p>
