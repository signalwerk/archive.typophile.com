    html: |-
      <p>The second version of your font is a great improvement toward usability. I can see commercial use for this family.</p>
      <p>My opinions and suggestions:</p>
      <ul>
      <li>The "h" is definitely too wide. You also presented two different "u"s. The first one (after "b") is wider than the second one (after "g"). Use the second one (width and style are correct) and also adjust "h" to the same width.
      </li><li>You will have to adjust "b" but maybe not as much as "h"
      </li><li>"m" works better but still needs some work. Try making the first curve less round.
      </li><li>You will have to change the "g" to be more like the rest ("b" and "h" may be a starting point). You will probably change the lower part of the bowl to go upwards like with "a".
      </li><li>"r" is beautiful. I like it VERY much. Pointing a little bit down.
      </li><li>"f" probably needs some work on the top.
      </li><li>Letter "t" doesn't really look like it's part of the same family.
      </li><li>The right stem of the "v" could be slightly curvy. Try that to make it more family like.
      </li><li>"o" is a bit too light compared to the others especially to the neighbouring "n". So is "s".
      </li><li>Try a round dot on the "i" or "rounded" dot.
      </li></ul>
      <p>This looks like a really promising font. I like it very much. You're getting there. Keep up the GREAT work.</p>
    html_clean: |-
