      <p>Hi everyone,</p>
      <p>Stephen,<br>
      Thanks a lot for the isonorm link. I didn’t know that font exists. The research I been doing until now has been limited to the information in this industrial labeling guide: </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/rotulacionindustrial_3732.gif"></div><br>
      ---<p></p>
      <p>Biddy,<br>
      I agreed with you, the “m” needs more work. </p>
      <p>César,<br>
      You are right; the “v” is extremely heavy. </p>
      <p>Scott,<br>
      Your comments about the “i” and “e” made me reconsider several issues about them. Your comment about the x height made me reconsider as well. </p>
      <p>Elsebra,<br>
      You are right. The original idea was getting lost. Although what I want to do is to interpret that original idea in a different way. I wish to redesign each letter but not making an exact copy of the industrial labeling. </p>
      <p>I agree as well with your comments regarding: letter spacing, ascending height and “f” ascendant to be less geometric. </p>
      <p>Subsequently you can find new corrections: </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/escuadra_cfcg_6junio07_6660.gif"></div><p></p>
      <p>---</p>
      <p>I will appreciate if you could check them and let me know any comments or suggestions you may have</p>
      <p>Thanks!</p>
      <p>—<br>
      Carlos Fabián Camargo G.</p>
