    <p>Hi everybody,</p>
    <p>Escuadra was inspired in the font used by the architects in their drawings when computers were not created yet and they had to use chinese ink to label their plans. Any comments and criticisms would be most welcome.</p>
    <p>Thanks!</p>
    <p>—<br>
    Carlos Fabián Camargo G.</p>
