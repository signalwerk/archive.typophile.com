    html: <p>This ultra light version is very interesting. The second version with the modified “m” was starting to remind me of Etelka a bit. Now in the ultra light I see its own character emerging more. Look at the caps and consolidate the vocabulary of curves in the “G”, “B”, and consider extending the foot of the “R” slightly. The “a” and “e” look very solid to me.</p>
