      <p>(English below spanish)</p>
      <p>¡Hola Carlos!<br>
      ¡Una vez más incursionando en el mundo del diseño de letras! Admiro tu constancia y lamento no tener yo mismo algo de ella. Te felicito, una vez más.</p>
      <p>Te digo mi humilde opinión acerca de lo que veo:</p>
      <p>- No queda mucho de la esencia de las letras en las que te basás (si es que ellas son, como creo, las grisadas de la parte superior de la imagen). Como si Escuadra no surgiera de donde en verdad surge. La forma de los caracteres que estás trabajando no guardan demasiada relación con sus "ancestros". Esto no es una crítica, sólo que me llamó la atención que en tu dibujo se pierda parte del espíritu que los generó (caracteres usados por los arquitectos cuando no se había inventado la computadora).<br>
      - Veo un interletrado muy estrecho.<br>
      - Acuerdo con biddy, quien te dice que la 'm' no está funcionando correctamente.<br>
      - Las ascendentes quizá sean demasiado cortas, no lo sé.<br>
      - La 'f' quizá debería tener un ascendente menos "geométrico" y más ajustado ópticamente.<br>
      - Relacionado con lo anterior: pareciera que la fuente pide ajustes ópticos. Algunas modulaciones se me aparecen extrañas a los ojos: como si el trazo fino se destacara más de la cuenta y hubiera que atenuar esa diferencia. No sé si me explico bien...<br>
      - La ISONORM es una buen ejemplo para estudiar, creo que vale el comentario de Stephen Coles. (El punto de la 'i' quizá encuentre solución a partir de ver cómo se resuelve en esa fuente)</p>
      <p>Por ahora no veo mucho más.<br>
      ¡Espero haberte ayudado y que nos tengas al tanto de los avances!</p>
      <p>Abrazo desde Argentina,</p>
      <p>elsebra<br>
      <a href="http://www.elsebra.com.ar" title="www.elsebra.com.ar">www.elsebra.com.ar</a></p>
      <p>/ / / / / / / / /</p>
      <p>Hello Carlos!<br>
      Facing into the world of the letterdesign once again!<br>
      I certainly admire you and I'm sorry that I have not something of your perseverance. I congratulate you, once again!</p>
      <p>Here's my humble opinion about what I see:<br>
      - Escuadra isn't left to much of the essence of the letters in which you actually based your work (if it is that they are, as I believe, the grey ones of the superior part of the image). As if Escuadra didn't come from where it really comes. The character forms that you are working doesn't show too much relation to their "ancestors". This is not a critic, only that called my attention that your drawing loses part of the spirit who generated them (characters used by the architects when the computer had not invented yet, as you say).<br>
      - I see a very narrow kerning.<br>
      - I agree with biddy, that says to you that 'm' isn't working correctly.<br>
      - Perhaps the ascendants are too short, I don't know...<br>
      - Perhaps 'f' must have an ascendant less "geometric" and more optically adjusted.<br>
      - Related to the previous thing: it seemed that the font requests optical adjustments. Some modulations appear strange to my eyes: as if the fine outline stood out more of the account and was necessary to attenuate that difference. I do not know if I explain myself well...<br>
      - ISONORM is a good example to study, I believe that it is worth the commentary of Stephen Coles. perhaps (maybe dot of 'i' finds a solution from seeing how it is solved in that font) </p>
      <p>I don't see much more.<br>
      I wish I helped.</p>
      <p>Waiting to see the advances,<br>
      best regards from Argentina, </p>
      <p>elsebra<br>
      <a href="http://www.elsebra.com.ar" title="www.elsebra.com.ar">www.elsebra.com.ar</a></p>
