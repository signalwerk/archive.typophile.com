    html: |-
      <p>I see the dot of the "i" as a distraction -- awfully heavy, doesn't seem to line up with anything (other than it's own stroke). Perhaps it should be as thin as the horizontal strokes? </p>
      <p>The counter of the "e" also seems a bit heavy... with such a large x-heght, all the other letters are high-waisted (pants pulled up around their chests), but the "e" goes in the opposite direction with a low crossbar.</p>
      <p>Very nice, though... reminds me a little of Radiant, which I worked on (a version of) many years ago. You might check it out (the light weights) for inspiration.</p>
    html_clean: |-
