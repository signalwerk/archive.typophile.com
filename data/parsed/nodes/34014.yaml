      <p>The concept of Escuadra seems very good to me, but I find problems in some letters. The "m" might be slightly narrower and its middle stroke should be straight so that it doesn't pull to the left. I find problems vith the "v" also, since there should be some contrast but there's not any.</p>
      <p>The general proportions are ok but I'd try not to force the curves so much. The grid still seems too evident to me.</p>
