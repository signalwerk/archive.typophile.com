    votes: null
    html: |-
      <p>Why do you think that is? If we concede that the design can be improved then two obstructions have to be overcome time is the major constricting factor, closely followed by cost – the market share for newspapers has been reduced by newer, more instant, cheaper and generally easier* media.</p>
      <p>*By easier, I mean why bother reading a newspaper when a man or woman in a suit will read it for you in the corner of your living room.</p>
      <p>The technologies involved in newspaper production – printing (colour, inks), layout software, paper manufacture etc. have all improved in terms of speed and quality and this is clearly the case compared to a decade ago.</p>
      <p>Newspaper's budgets are mainly allocated to the content (the reporting) and production. Since even media barons cannot expand time, cost is the only area that can be squeezed, so, for example, there is a limit to the amount of non-printed space, the remaining number of employees have to be able to produce the product.</p>
      <p>To sum up, if the paper is to survive, it cannot afford to lose its loyal readers, who want the content and will not pay (much) more, and the consumables and wage bill keep a constant then something has to give and that casualty is design. I don't envy anyone trying to redesign a newspaper within these constraints.</p>
      <p>Tim</p>
