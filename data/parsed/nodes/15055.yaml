      <p>I'm getting used to it.<br>
      The typeface is OK. A bit like Cartier, eh?<br>
      Perhaps the serifs could have been a bit narrower, in the headline fonts, for a slightly closer fit, given the tightness of the layouts and the small wordspace.</p>
      <p>I find the G2 section is too small in size. There is a problem that with the smaller formats and the larger pictures, the fancy colors and light weights, that the paper loses gravitas. This is particularly evident when you have one story dominating a page and it's got a big stock photo -- that ain't news! Looks more like a cheap magazine: but that is something that the facility to put big colour pictures everywhere sucks you into, and unique to the Guardian.</p>
      <p>The big double-page photo spread every day is brilliant.</p>
      <p>Overall, I am still concerned that a serious anti-establishment paper should carry some clout. The Guardian was big and tough, but now it is proud to leave behind that daunting presence (as charged by focus groups, no doubt) to be friendlier -- smaller, prettier. I have the same problem with the little Independent and its frilly Century heads. Easy to discount.</p>
      <p>Please tell me I'm wrong, and that these toy dogs barking at the powers that be will not be contemptuously kicked aside.</p>
