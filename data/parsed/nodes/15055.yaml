      <p>I'm disappointed by the all-serif look.<br>
      I felt the same way when the Toronto Star, also a leftish paper run by a foundation, rather than a media conglomerate, was recently redesigned with all serifs.<br>
      Somehow, it signals a pandering to "taste", a movement away from a hard-line stance, whether or not that is the editorial drift.<br>
      My initial impression (which may nonetheless be revised once I see it on newsprint) is that the newly refined look will be at odds with the necessarily blunt messages that this newspaper, so frequently critical of the establishment, must carry.</p>
