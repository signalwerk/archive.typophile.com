      <p>The front page design, with the masthead halfway down the folded berliner cover looks very well designed  <a href="http://image.guardian.co.uk/sys-video/Media/video/2005/09/09/guardian_new_thinking.mpg" rel="nofollow">(see the TV advert)</a></p>
      <p>It means the paper can't be folded again without folding it along the masthead, so newsagents will have to display it as it comes.</p>
      <p>This also leaves a very dynamic space for a headline or picture that is visible with the paper folded.</p>
      <p>The column width is good, much more readable than old eight-column broadsheet.</p>
      <p>But - there are still lots of line-end words broken with hypens on the dummy copy (re-main, investi-gated ver-sion, for-mat, newspa-per, jus-tice, pa-per) that make it harder to comprehend the writing.</p>
      <p>Not something you see on their website!</p>
