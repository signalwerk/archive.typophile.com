      <p>Well, the e and c are very common letters, and they and their variants (schwa, etc) have always given me some trouble. </p>
      <p>But now with renewed focus on the e haha, perhaps try raising the bar a bit (literally, I mean)?  You have such a low bowl on the a, having a higher one on the e might balance out a bit better.</p>
      <p>Also, now the q and the t are getting my attention.  They are the only two letters that seem to go to a pinprick point. They don't look that off to me, but I wonder if they might go even better with more blunt points.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
