      <p>Libro looks nice and I think it has a lot of potential. I think it would be best at this stage to determin which road to follow. At this moment there are too many (little) things going on (read: too many discrepancies) to make a next step. For Libro to work properly there has to be more coherence (as manuelcorradine also states). My suggestion for now is: take one word "handgloves" or "hamburgefontivs" and try to work that out with shapes as coherent as you can (don't forget to look at other fonts for some reference if needed). </p>
      <p>BTW ... It *is* kinda thin for a text face. Did you test it already on a good laser printer?</p>
