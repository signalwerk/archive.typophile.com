      <p>it's great. with such a lively design it is going to be difficult to get consistency in weight across letters but I think this can be achieved...the thin strokes vary in width a bit, and the angle of stress is not the same. See the bottom of the u and the bottom of the c to see what I mean. It's got a nice feel to it. I think the v, s, r and a need refining a bit (too heavy?) and i might be tempted to make the ascenders a bit taller.<br>
      Just some ideas... :)</p>
