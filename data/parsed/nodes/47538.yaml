      <p>I like the progress the typeface has made, visible in your last posting. I have troubles with the ›g‹: it looks too perfect and as if belonging to another typeface. You need to get more consistency into the shapes of the serifs. Sometimes they are quite heavy and sturdy, sometimes they are delicate -- look at the foot serifs. The top serif of ›a‹ needs to be tamed, i think it’s better in the ›s‹. Do something with the bottom left inner curve of the ›o‹. But not the same corner from the upper right, rather something that cites it.<br>
      Then you need to go into spacing: start with nnnnnnoooooonnnooonnnoonnoonn, then nnnooonnononononon until the rhythm is well balanced. Then go on from nononononnonon by replacing the ›n‹s and ›o‹s by the other letters, one after the other.</p>
