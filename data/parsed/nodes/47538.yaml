      <p>I'm not sure I could see this as being a long-run face, though I think it has great potential as something more mid-length, like pamphlets or handouts, etc.</p>
      <p>I think you might want to shift your accents a little bit to the left.  They feel a bit right-heavy at the moment.</p>
