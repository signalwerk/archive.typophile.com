      <p>Creo que hay un gran avance pero falta mucho por recorrer sobre todo en cuanto a generar una coherencia formal entre las letras. Veo letras con "quiebres" interesantes como la a y la n (incluso un poco en la p), pero otras parecen de diferente estilo, pues carecen de estos "quiebres", como es el caso de la e, la d y la o; en estos casos creo que debería ser un poco más arriesgado. Dee todas formas hay que buscar un equilibrio entre la experimentación y la legibilidad para no irse a extremos.</p>
      <p>Estoy de acuerdo con avanzar un poco con las altas para visualizar mejor la interacción de las formas.</p>
      <p>Manuel</p>
