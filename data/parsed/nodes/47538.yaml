    html: |-
      <p>Bien por la incursión en este género tipográfico. Pienso que una letra de texto debe generar una textura uniforme al pasar la vista por encima de una página, por lo tanto creo que los aspectos a mejorar en principio son los calibres de ciertas letras que se ven muy desproporcionados y generan irregularidades en el color del texto: Es el caso de letras que destacan demasiado como las que conforman la palabra "natural" (uniformes entre sí) frente a letras como la j, la c y la e.<br>
      Por otra parte debe haber correspondencia en el contraste, los remates y las serifas. Si los remates inferiores de la l y la t coinciden por qué no asemejar a estos las terminaciones de la a , la c y la e (estas dos últimas comparten la misma forma general).<br>
      Veo también la intención de condensar un poco el ancho de la letra pero hay caracteres que no corresponden en amplitud como es el caso de la v y la f.<br>
      Hay que trabajarle bastante pero tiene detalles con mucha personalidad como la lágrima de la a y la curva en el acento agudo.<br>
      Espero no sonar muy criticón, pero esa es mi opinión a primera vista.</p>
      <p>Hágale pues...!</p>
