      <p>Hi Carlo</p>
      <p>Great of you to post your design!</p>
      <p>I'm not sure if this font is suitable for long text runs.</p>
      <p>Especialy in the small sizes the text becomes a bit fibrant. It seems to dance in front of my eyes. That is not something you want for long patches of text.<br>
      Aside that, I'm intrigued. It has a feel around itself of something of a sketch. It has a roughness about it.</p>
      <p>You might – however – want to take another look at positioning the letters in relation to each other. However, this might even contribute to the roughness.</p>
      <p>Again, I'm intrigued. Especially due to the roughness.<br>
      I can not put my finger on it, maybe there are others who can?</p>
      <p>Hope this helps.</p>
      <p>Raymond</p>
