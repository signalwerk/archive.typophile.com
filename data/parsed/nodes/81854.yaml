    html: |-
      <p>I was working on it in 1997 when I happened to see a sign over a confectioners shop in Salzburg - Georg Houschka - which was very similar to my existing design, even the rounded A. Unfortunately I don't have a digital photo of it, and it no longer exists. So the answer to your question is no, Houschka wasn't inspired by an earlier typeface, but the name was inspired by a shop sign.</p>
      <p>I was probably subconsciously inspired by European signage from earlier visits. The style is quite 'Continental Europe' IMO, especially Austria and Italy, but not so much UK.</p>
      <p><a href="http://www.type.co.uk/a_to_z_listing/id/40847" rel="nofollow">Houschka Pro</a></p>
