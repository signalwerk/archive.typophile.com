    html: "<p>I would get Today because: <br>1) Cronos is close enough to it -without giving credit- that I'd prefer rewarding the original. Some aspects of the derivation (like the temporal naming) are nothing short of enraging to me. <br>2) It's more interesting. <br>3) In some ways it's better-made (like it has trapping). <br> <br>On the other hand, Cronos has more variants, including optical scaling. But if you only need one weight that's mostly moot. <br> <br>hhp <br></p>"
