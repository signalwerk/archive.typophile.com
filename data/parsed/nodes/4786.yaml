  html: <p>I am doing another logo for a sleep testing company. The icon illustrates a girl asleep and laying against the moon. Her hair is wrapped around the moon to become the blanket when it comes back around. The logo is due Monday (I haven't had much time) so I can't do any major changes such as starting from scratch. Any suggestions would be appreciated. <br> <br><img src="http://www.typophile.com/forums/messages/29/35987.gif" alt=""> <br> <br>Also I have included my first idea for a logo. I went with the above idea because I felt the logo below was too abstract and just not very good.  <br> <br><img src="http://www.typophile.com/forums/messages/29/35988.gif" alt=""></p>
