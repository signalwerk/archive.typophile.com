    html: |-
      <p>If the point indices are the same, and known, this would work in any Robofab environment:</p>
      <pre>f = CurrentFont()
      f["a"] = f["d"].copy()

      # contour 0, segment 1, point 2
      f["a"][0][1][2].x = f["q"][0][1][2].x
      f["a"][0][1][2].y = f["q"][0][1][2].y

      # contour 0, segment 2, point 0
      f["a"][0][2][0].x = f["q"][0][2][0].x
      f["a"][0][2][0].y = f["q"][0][2][0].y

      # contour 0, segment 3, point 0
      f["a"][0][3][0].x = f["q"][0][3][0].x
      f["a"][0][3][0].y = f["q"][0][3][0].y
      </pre><p>
      but in practice it doesn’t because in Roboto the q is narrower than the d, so the right side of the new «a» won’t end up vertical.</p>
