    <p>In the thread <a href="http://typophile.com/node/103643" title="http://typophile.com/node/103643">http://typophile.com/node/103643</a>, a question was raised that can be reformulated as follows: "how can one build the latin small letter alpha?", which is uni0251 (in the IPA extensions). Even with a serif font, its lower part appears to be that of a d and its upper part that of a q. My question here is how to do that programmatically.</p>
    <p>The intent, in the tread above, was to get the corresponding glyph for the Roboto fonts. The question is interesting because with Roboto, in all fonts, the d and the q have the same number of truetype points, and they are numbered similarly. In order to get the "latin small letter alpha" in the middle below, I took a d and then moved the points  6, 7 and 8 at the coordinates they have in the letter q.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/daq-Black3_4307.png"></div><br>
    I could in fact do that editing (with a script) the ttx files. I found no way to do it (programmatically) with FontForge. I can only get a copy of the contours, the modifications are not reflected in the font. I found no way to access those points in the font tools. How can you do that (programmatically, I mean) with your professional tools (even if it is not really worth the trouble for this particular example). Is that easy to do with Glyphs?<p></p>
