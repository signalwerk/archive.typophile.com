      <p>After all, it is unclear I would gain much with Robofab; to create a new character, I can do something fairly close to the code above, but I need to use the pen to draw (or redraw) the character; here is something that works from the Fontforge script menu and creates uni0251 for Roboto.</p>
      <pre>f=fontforge.activeFont()
      ld=f["d"].foreground
      lq=f["q"].foreground
      # Contour 0, point 6
      ld[0][6].x = lq[0][6].x
      ld[0][6].y = lq[0][6].y
      # Contour 0, point 7
      ld[0][7].x = lq[0][7].x
      ld[0][7].y = lq[0][7].y
      # Contour 0, point 8
      ld[0][8].y = lq[0][8].y
      # Create the new character
      f.createChar(0x0251,"uni0251")
      # Draw the modified layer ld
      pen=f["uni0251"].glyphPen()
      ld.draw(pen)
      pen=None
      f["uni0251"].width = f["d"].width
      </pre><p>Since <code>ld</code> is only a copy, the character d is left unchanged.</p>
      <p>Added: to get the same numbering for the points in the resulting glyph, I have to draw contour 1 before contour 0. So it is</p>
      <pre>ld[1].draw(pen);  ld[0].draw(pen)
      </pre><p>instead of <code>ld.draw(pen)</code>. (weird!)</p>
      <p>Of course, for the italic, we need to calculate the x coordinate of point 8. To cover all cases we thus need to add something like</p>
      <pre>m=(ld[0][8].x -ld[0][9].x)*1.0/(ld[0][8].y-ld[0][9].y)
      ld[0][8].x =ld[0][9].x + (lq[0][8].y-ld[0][9].y)*m
      </pre><p>before <code>ld[0][8].y = lq[0][8].y</code>. This works fine even for the thin italic where there are four points between the top and the bottom of the right part of the d and q.</p>
      <p>Here is the picture with d (green) in the background.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/segment-9-10_5148.png"></div><br>
      Points 9 and 10 are very close. The value of m above is the slope of the segment 8-9 when x is seen as a function of y.<p></p>
      <p>Correction: there are two other points close to 9; there is thus a 9,10,11 cluster and then a 12,13,14 cluster. Hmm, no! I looked closer and there is a cluster of four points, 9,10,11,12 and then two point 13,14</p>
