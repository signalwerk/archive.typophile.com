      <p>In RoboFont this would do:</p>
      <pre>f = CurrentFont()
      f["a"] = f["q"] &amp; f["d"]</pre><p>
      ... but only because RoboFont has implemented the Boolean operators (in this case &amp;, «and») for glyph operations. I don’t know if other editors have similar options.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/glyphmath_4041.png"></div><p></p>
      <p>The result would still need some manual cleaning though:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/glyphmath-a_3734.png"></div><p></p>
      <p>Edit: This only seems to work with PS curves, not TT curves.</p>
