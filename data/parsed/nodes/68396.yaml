      <p>Love this font. My opinions:</p>
      <p>Done pretty well with joining the 'lim' up, maybe could do with a bit of smoothing out.</p>
      <p>I agree with Jennifer on docking the 'm' - dont do it. If you feel the need to, just cut a tiny bit of in order to have consistency with the terminal direction on the C and ampersand.</p>
      <p>With regard to the 'K - l' kerning, you could try docking both serifs to bring them closer, or perhaps have the l serif pointing upwards and therefore slotting underneath the K? Just a thought..</p>
