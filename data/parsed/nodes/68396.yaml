    <p>Hello, </p>
    <p>In this logo I use Bodoni Poster Italic font.<br>
    However, I don't have much experience working with classic linked typefaces.</p>
    <p>1. I've changed a bit the default kerning so it feels homogeneous and works as logotype.<br>
       Does the rhythm of letters looks correct? (<a href="http://klim.co.il/misc/logo_01.jpg" title="http://klim.co.il/misc/logo_01.jpg">http://klim.co.il/misc/logo_01.jpg</a>)</p>
    <p>2. It is TTF font, so it doesn't complete the links between letters.<br>
       So I built them manually. Are they correct? (<a href="http://klim.co.il/misc/logo_01.jpg" title="http://klim.co.il/misc/logo_01.jpg">http://klim.co.il/misc/logo_01.jpg</a>)</p>
    <p>3. The opened link of "m" looked unnecessary, so I decided to cut it.<br>
       It became a little limping, so I compensated it by pulling the stem a bit lower.<br>
       I also fixed the kerning between "m" and "&amp;". (<a href="http://klim.co.il/misc/logo_02.jpg" title="http://klim.co.il/misc/logo_02.jpg">http://klim.co.il/misc/logo_02.jpg</a>)<br>
       I've tried to decide what correct angle the cut should be according<br>
       to the cuts of "&amp;" and "C". Is that ok? (<a href="http://klim.co.il/misc/logo_03.jpg" title="http://klim.co.il/misc/logo_03.jpg">http://klim.co.il/misc/logo_03.jpg</a>)</p>
    <p>Thanks a lot for any help and suggestions!</p>
