      <p>Quite lovely. </p>
      <p>I wouldn't dock the tail on the m though. But if you do, think not only about the the angle of the other tails but also the termination height in relationship to the base line.</p>
      <p>I'm being pretty very picky here but I might tighten the C and o VERY slightly if you don't join them.</p>
