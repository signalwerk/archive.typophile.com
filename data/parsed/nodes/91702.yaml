    html: <p>If you use that one font there, make sure to kern the e closer to the a or the A closer to the T. That would be a great start. Also kern the v and the e closer together. If you're going to be designing logos you need to learn to be aware of letters that are too close or far away from each other based on their shapes. When you squint it should look smooth without gaps. If there's a gap, try filling it in somehow by altering one of the letters to extend into the gap. A logo should be streamlined like an airplane that's been in a wind tunnel for some period of time.</p>
