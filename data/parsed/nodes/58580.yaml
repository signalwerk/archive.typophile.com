      <p>I just spotted this:<br>
      Garaje 53 Unicase Black – <a href="http://www.256tm.com/en/special_offers.htm" title="http://www.256tm.com/en/special_offers.htm">http://www.256tm.com/en/special_offers.htm</a></p>
      <p>It's not a super-close match (see the "C" or "G" for instance), but it shares the approximate proportions, and has the somewhat low waisted "R" that you're after.<br>
      And it's also free.</p>
