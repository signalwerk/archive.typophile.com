      <p>Other than Neutraface, the only sans I can think of with the large counter on the R is Joe Treacy's Forever family. I can't seem to get his website to open (<a href="http://www.treacyfaces.com">www.treacyfaces.com</a>), but you could see them there. However, looking at hte sample in the old FontBook, the C seems more closed than your sample.</p>
