  html: |-
    <p>This would not have seen the light of the day if it were not for some typophiles provoking me to do so :-) The ‘history’ of it can be read in <a class="freelinking external" href="http://typophile.com/node/71989" rel="nofollow">this</a> and <a class="freelinking external" href="http://typophile.com/node/72242" rel="nofollow">that</a> discussion.</p>
    <p>I hereby release <strong>Hibernica Medior Regular</strong> on beta stage, for a limited time at $19,90 ‘tester’s fare’. ( –› <a class="freelinking external" href="http://www.signographie.de/cms/front_content.php?idart=7&amp;changelang=2" rel="nofollow">Contact</a> )</p>
    <p>Hibernica, as many of you know, is a daughter font of my recently released <a class="freelinking external" href="http://typophile.com/node/71254" rel="nofollow">Lapidaria family</a>. The font contains full Western character set, plus special Irish/Gaelic accents, ligatures and – goodie – a few ornaments. Future options are an alternativ Minor (=lowercase) font and light/bold cuts.</p>
    <p>Thanks to all of you out here who helped with comments.<br>
    .<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/hibernica_beta_sample_5736.jpg"></div><p></p>
