  html: |-
    <p>This would not have seen the light of the day if it were not for some typophiles provoking me to do so :-) The ‘history’ of it can be read in <a href="http://typophile.com/node/71989" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this</a> and <a href="http://typophile.com/node/72242" title="Click to visit an external URL." class="freelink freelink-external freelink-external">that</a> discussion.</p>
    <p>I hereby release <strong>Hibernica Medior Regular</strong> on beta stage, for a limited time at $19,90 ‘tester’s fare’. ( –› <a href="http://Contact" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Contact</a> )</p>
    <p>Hibernica, as many of you know, is a daughter font of my recently released <a href="http://typophile.com/node/71254" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Lapidaria family</a>. The font contains full Western character set, plus special Irish/Gaelic accents, ligatures and – goodie – a few ornaments. Future options are an alternativ Minor (=lowercase) font and light/bold cuts.</p>
    <p>Thanks to all of you out here who helped with comments.<br>
    .<br><img src="/sites/default/files/old-images/hibernica_beta_sample_5736.jpg"></p>
