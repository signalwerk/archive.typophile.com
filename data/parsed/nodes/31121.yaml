    <p>Two queries for anyone out there!</p>
    <p>1) I am interested in Clifford FF, which is highly regarded. It comes in 6,9,12. As I am mainly doing standard text work, at around 10 or 11 pts, am I right to assume that the 9 is the one to go for? Font_Font, who sell the product never replied to my question!</p>
    <p>2)I am a WordPerfect user, and am really unable to access ligatures (I tried with Walbaum Text Pro from Storm. I can do it in Word, using the character map, but WP does not support this. WP said to use ctrl W, which brings up sets, typographic, multinational etc, but the ligatures in the typographic sets are just some standard sans serif horror, not the face one is using!</p>
    <p>Any thoughts</p>
    <p>John</p>
