      <p><cite>There is the masters panel, where i can switch views of different masters (this is exactly what i want), but this only works in drawing and metrics windows, not in glyph window. the masters panel goes away if i go to glyph window, and it can't be activated (greyed out) in view menu.</cite></p>
      <p>I think we have to agree on some FL terms before going forward. What is the Drawing Window? I do all of my drawing in the Glyph Window and I am able to switch between masters quite easily. Perhaps when you say Glyph Window you are really referring to the Font Window. You can easily change the display of the Font Window by adjusting the MM sliders in Font Info.</p>
      <p>As to FL MM being ancient. All you have to do is be precise when you create your outlines, pay attention to number and location of points. Tell FL never to add points and Never use the Blend Function to make an MM. Mask-to-Master is a much better way to go.</p>
