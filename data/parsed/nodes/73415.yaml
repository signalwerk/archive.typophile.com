    <p>Quick Question: I'm experimenting / learning about multiple master in fontlab. Works quite well for now, the only question i have: is there a way to tell fontlab to show a different master in the glyph overview window?</p>
    <p>I have a very simple test font that has a weight axis, with two masters, light and black (Wt0 and Wt1). Fontlab shows me Wt0 previews in glyph window. Sometimes i'd like to see Wt1 glyphs though ...</p>
    <p>I can "rearrange masters" from MM menu, and change the order of light and black, then the black one is shown. But isn't there a more ... non-editing way to do this?</p>
    <p>There is the masters panel, where i can switch views of different masters (this is exactly what i want), but this only works in drawing and metrics windows, not in glyph window. the masters panel goes away if i go to glyph window, and it can't be activated (greyed out) in view menu.</p>
    <p>thanks for your help<br>
    Sebastian</p>
