    html: <p>yes, mm handeling in FL is very ancient. Even if your masters are 100% compatible. MM building in FL changes often the startpoint numbering or loosing one point very close to an other point, so you have to work on and fix the genereted fonts to clean up things what could and should worked from start.</p>
