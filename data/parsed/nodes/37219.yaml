    html: |-
      <p>Do any of you interact with people from <a href="http://http://stumptownprinters.com" rel="nofollow">Stumptown Printers</a> or <a href="http://www.texturaprinting.com/" rel="nofollow">Textura</a>? They seem to do some cool print-related stuff in Portland. For Stumptown, I think a significant amount of their income is related to music packaging. </p>
      <p>Here's a Portland moment: Today I went downtown to visit the Powell's, the largest book store on Earth. As usual, I spent a few minutes looking through the rare books room. In particular, I asked to examine a 1591 printing of Aldus's <em>Institutiones grammaticae</em>. It's possible that it was printed by Aldus' grandson, I don't know very much about old books. I made a sincere effort to look like I was being very careful with it. When I was handing it back to the clerk I mentioned how amazing it is that books like that are for sale. He shrugged and explained that as a Buddhist, he didn't personally own very much stuff. "I guess it's kind of ironic that I work with rare books." he said. </p>
      <p>I didn't buy the book, although it's an interesting idea. If it was easy to resell, it might be much easier to just buy books like that if I want to look at them. I know that libraries have rare books available for examination, but they seem to get nervous if you don't have an obvious reason for looking at stuff. And, obviously you can't check them out.</p>
