      <p><cite>It was at the end of my hippy days that I lived there, so I may be over-romanticizing my memories of it.</cite></p>
      <p>The Rose Garden is still fun. Whenever I go there, I get the "Tiger's Blood" flavored sno-cone, which is a mix of raspberry and coconut. Forest park is pretty cool too. You can be surrounded by dense forest only a few minutes from downtown. I'm not a "zoo bomber" but I have ridden the route from the Max station at the zoo into downtown. In, my case, I did it on a normal bicycle with decent brakes. My impression of type wonks in PDX is that often they're too busy actually doing stuff to lurk in online forums. </p>
      <p>I thought Pete's presentation at TypeCon was great, btw. We <em>should</em> have TypeCon in Portland.</p>
