    html: <p>Hi Dawn, <br> <br>If you are going for a futurist look I would stay away from Helvetica altogether. Too much of a 70s feel. There are many more sans serif fonts that would lighten up this card.  <br> <br>I would also look at making the address line a little bigger. Use flush left or right alignment to pull the name, title and address together. <br> <br>The false small caps on "President" should be replaced with either all caps, or title case. <br> <br>The problem with the E and the T is the space between the letters. Try pulling the T across and joining ET to lose this space.</p>
    html_clean: <p>Hi Dawn, <br> <br>If you are going for a futurist look I would stay away from Helvetica altogether. Too much of a 70s feel. There are many more sans serif fonts that would lighten up this card.  <br> <br>I would also look at making the address line a little bigger. Use flush left or right alignment to pull the name, title and address together. <br> <br>The false small caps on "President" should be replaced with either all caps, or title case. <br> <br>The problem with the E and the T is the space between the letters. Try pulling the T across and joining ET to lose this space.</p>
