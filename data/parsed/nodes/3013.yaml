  html: <p>I am designing a logo for a tech company and they like the design finally (after many, many tries). They like the look of the Helvetica Ultra Compressed for the "text", but I don't like the way it looks in the address line. Is there a font that looks like HUC, but has a much shorter x-height and is extended? I want to maintain the "techie" look. The client loves the o's and the basic rectangular look of the letters.  <br> <br>Anything that I could use to complete the look without them knowing I'm using a different font? And, please keep in mind this is only the first round of the final design, so it's still kind of rough. The address line seems to overwhelm the rest of the card and I want the rocket and the person's name to be the primary visuals. I'd prefer to fill up more of the white space on the bottom line and to give it a lighter more futurist feel.  <br> <br>One more thing, the t at the end of rocket is a visual irritation to me. I'm considering dropping the top of the t to the bottom of the e and moving the logic to left or just replacing it with a lowercase t. Any input? <br>Thanks! <br> <br><img src="http://www.typophile.com/forums/messages/4100/25811.jpg" alt=""></p>
  html_clean: <p>I am designing a logo for a tech company and they like the design finally (after many, many tries). They like the look of the Helvetica Ultra Compressed for the "text", but I don't like the way it looks in the address line. Is there a font that looks like HUC, but has a much shorter x-height and is extended? I want to maintain the "techie" look. The client loves the o's and the basic rectangular look of the letters.  <br> <br>Anything that I could use to complete the look without them knowing I'm using a different font? And, please keep in mind this is only the first round of the final design, so it's still kind of rough. The address line seems to overwhelm the rest of the card and I want the rocket and the person's name to be the primary visuals. I'd prefer to fill up more of the white space on the bottom line and to give it a lighter more futurist feel.  <br> <br>One more thing, the t at the end of rocket is a visual irritation to me. I'm considering dropping the top of the t to the bottom of the e and moving the logic to left or just replacing it with a lowercase t. Any input? <br>Thanks! <br> <br><img src="http://www.typophile.com/forums/messages/4100/25811.jpg" alt=""></p>
