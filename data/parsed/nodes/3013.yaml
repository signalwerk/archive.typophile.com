    html: <p>I agree with all your suggestions, however, the client doesn't want to change the format. Believe me, I've tried. This is about the 100th idea and my original format for this version was different and they changed it to the above and finally found something they "loved". So the changes I make have to be subtle or we'll be back redesigning (design by committee with a lot of A types).  <br> <br>But I'm not totally thrilled with it and want to add a little more class. I don't think I can change the font for "LOGIC" or the name. I tried setting the title in all caps, all lower case, upper and lower, and small caps and they only liked the above version for the title. I will try your suggestion on the ET and hope they won't notice. I truly appreciate the your input, though.  <br> <br>What other fonts would you suggest? Most of the other ones I've tried were too round for the client and they didn't like them. They really are hooked on the rectangular shape of the letters.</p>
