    <p>Hi All</p>
    <p>I am trading services with a just-graduated event planner - she is helping out on the day of my wedding and I will design a logo and business card for her. Budget-friendly for both of us!</p>
    <p>I have been sketching out some ideas and one of them I really like but would appreciate some critique before I send all the ideas to her. I showed an earlier version to my fiancé and he said it didn't read well, so I worked on it some more. I really like it, but I know the name and have been staring at it. I am wondering if I am beating a dead horse or if I am on to something. I appreciate all your wisdom and input!</p>
    <p>Thanks!<br>
    Natalie</p>
    <p>PS. The name of the company is Humble Olive. It's a bit odd, I know. My fiancé said the earlier version read Humb Le Olive.</p>
