  html: |-
    <p>Is there a special term for that part of the letter /u/ on the right(circled) compared to the one on left.</p>
    <p>I'm also looking for the earliest examples of fonts with this kind of design at that part of the letter /u/. How old could the practice of designing the letter /u/ or /n/ with this specific style be or it has been there since the beginning of sans-serifs? </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/u_4599.gif"></div><p></p>
