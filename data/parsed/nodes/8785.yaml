    date_raw: null
    votes: null
    html: "<p>Thomas: <br>My experience of the differences between InD2 and InDCS are that the latter is less prone to crashing, feels faster, and is more intuitive to use. My assumption is that the underlying technology is very different from that found in earlier versions, different enough that I would not be surprised if they share less than 50% of their code. At anyrate, the continued lack of backwards compatibility and adobe's failure to provide the promised plugin coupled with their recommended solution of using xml as the interchange format suggests that there are differences in how things are handled. Big ones. Additionally, InD2 has no problem with the font while InDCS does. What I've heard is that InDCS bypasses most of the OS level font handling, though I don't know if this is only for Macs. <br> <br>Since I doubt someone such as yourself would have any desire to steal the unfinished font of a novice (this goes for anyone on this board) if you have InDCS handy and are willing to test the font at least then I will be certain that it is something specific to my machine.</p>"
    html_clean: "<p>Thomas: <br>My experience of the differences between InD2 and InDCS are that the latter is less prone to crashing, feels faster, and is more intuitive to use. My assumption is that the underlying technology is very different from that found in earlier versions, different enough that I would not be surprised if they share less than 50% of their code. At anyrate, the continued lack of backwards compatibility and adobe's failure to provide the promised plugin coupled with their recommended solution of using xml as the interchange format suggests that there are differences in how things are handled. Big ones. Additionally, InD2 has no problem with the font while InDCS does. What I've heard is that InDCS bypasses most of the OS level font handling, though I don't know if this is only for Macs. <br> <br>Since I doubt someone such as yourself would have any desire to steal the unfinished font of a novice (this goes for anyone on this board) if you have InDCS handy and are willing to test the font at least then I will be certain that it is something specific to my machine.</p>"
  - id: 57601
    user: 909
    date: null
    date_raw: null
    votes: null
    html: <p>The underlying technology in ID2 and IDCS is essentially the same. In areas that are present in both, the composition engine was revised, and plenty of bugs were fixed, and performance was improved, but the overwhelming majority of the code that was in ID2 continued into IDCS. <br> <br>Both versions bypass substantial aspects of the OS level font handling, though both rely on the OS for some of that (like enumerating fonts installed at the system level, and on the Mac enumerating the primary script supported by the font). You might see more bypassing the OS in the future, as we continue to contend with OS-level bugs. <br> <br>I'm going to continue to be pretty swamped this week, but if nobody else takes a look at it before then, I'd be happy to look at your font next week. <br> <br>Regards, <br> <br>T</p>
    html_clean: <p>The underlying technology in ID2 and IDCS is essentially the same. In areas that are present in both, the composition engine was revised, and plenty of bugs were fixed, and performance was improved, but the overwhelming majority of the code that was in ID2 continued into IDCS. <br> <br>Both versions bypass substantial aspects of the OS level font handling, though both rely on the OS for some of that (like enumerating fonts installed at the system level, and on the Mac enumerating the primary script supported by the font). You might see more bypassing the OS in the future, as we continue to contend with OS-level bugs. <br> <br>I'm going to continue to be pretty swamped this week, but if nobody else takes a look at it before then, I'd be happy to look at your font next week. <br> <br>Regards, <br> <br>T</p>
