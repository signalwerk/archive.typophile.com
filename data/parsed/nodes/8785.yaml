    html: <p>Are you using different versions of InDesign on the two different machines? <br> <br>Can you be more specific about how ID2 and IDCS differ in your experience? This sort of substitution I would not expect to behave in any way differently in the two app versions. <br> <br>In general, I am inclined to agree with Adam that, in this area of font functionality, if the font works correctly on one of the two computers, the problem probably lies outside the font. (There are some other areas where I would not bet on this, like whether and how fonts appear in application menus, but that's another story.) <br> <br>Oh, and it's probably not necessary to "contact Adobe" seeing as I'm here. Besides being the PM responsible for fonts, I'm also the PM responsible for Core Tech components in InDesign.... <br> <br>Regards, <br> <br>T <br> <br>Program Manager <br>Fonts &amp; Core Technologies <br>Adobe Systems</p>
