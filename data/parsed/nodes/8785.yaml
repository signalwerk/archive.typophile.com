    html: <p>If your problem were at print time, that might have something to do with it. But it's on screen, right? No Adobe applications are using the UniqueID (nor its successor, the XUID) for any such purpose. <br> <br>Adobe itself no longer uses these, and omits them entirely in new fonts. You can just leave them blank in FontLab. They're in the first set of stuff under "Version and Identification" in the Font Info dialog. <br> <br>T</p>
