    html: <p>Wild thought -- long ago, there was a problem with "font caching", wherein some RIP's would cache the font by the font's ID number. Strange things could happen . . . which led me to both rename all my fonts (Bembo is B0500000) AND to set the font ID number to "0" (zero) in Fontographer. This let Fontographer write off the font with the font ID number as a comment line. <br> <br>I can't find a similar place to comment out the font ID number in FontLab 4.6.  <br> <br>Charles</p>
