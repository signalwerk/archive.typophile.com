  html: <p>So I made a font with liga, smcp, onum, pnum, and tnum. All very basic. I generated the font. I started laying out pages in InDesign to see if it was ready. Everything worked fine. But I thought the metrics weren't quite right so I adjusted them in the .vfb file, removed the .otf and regenerated the font. Many tries later (including rewriting the features and rebuilding the classes) I still can't get the features to work in Indesign. In fact, they are unavailable. What am I doing wrong?</p>
