  html: <p>Hey all.  Speaking of Unicode, I'm having a little problem getting a particular codeset to work.  I can get the Private Use Area codes to work, even tried Armenian as an experiment and it works too; but when I assign the codepoints for I Ching Hexagram symbols, they won't show up in the MS Word "Insert &gt; Symbol" box.  What am I missing?</p>
