      <p>If you look at pages 88-90 in the good ol’ Solotype Catalog, you can see just a bit of the range of hand-drawn type that was available. The Photo-Lettering catalogs are full of more of them. Panache and URW are two studios that have digitized more of these than most, although I think these typefaces (many by Ed Benguiat) are a rich resource that many have ’mined’ over the years.</p>
      <p>- Mike Yanega</p>
