    html: |-
      <p>Possibly, in the sense that looking truly hand-printed is more ’now’ than in the days when lettering was done by pros whose hand-lettering looked too good to be hand-drawn.</p>
      <p>This has a casual feel that seems almost more like pencil or chalk than a pen or brush. The way the strokes end heightens that effect.</p>
      <p>Once again we are back in the realm of hand-printed fonts (= cheap &amp; easy to make) and so anyone with experience in hand-lettering could have created this font.</p>
      <p>The next question it makes you ask is ’aren’t there a lot of fonts that are enough like this that I wouldn’t be able to tell them from this one without looking at them side-by-side?’ I think the answer to that one is ’yes’. </p>
      <p>Mike’s Rule of Hand-lettered fonts: If it’s too much trouble to find the exact match, pick a close equivalent, and get on with it.</p>
      <p>- Mike Yanega</p>
