      <p>Stephen, I just started searching Part 6 of the Script Font ID Guide, and <a href="http://bowfinprintworks.com/ScriptSmall/BritchesScr.gif">Britches Script</a> caps, from Panache, seem to match the letters if you squoosh them a bit. This seems to suggest that this lettering is derived from some of the many hand-lettered film types in the pre-digital era.</p>
      <p>- Mike Yanega</p>
