    <p>Just noticed this on Versiontracker and updated to it:</p>
    <p>NEW! Version 5.0 (Nov 2007)<br>
    Support for grayscale and color — from simple black-and-white to 32-bit color with smooth transparency<br>
    Direct import of EPS graphics — assists you in turning your Adobe Illustrator drawings into a font<br>
    Export of .vfb format fonts — for use in any font editor by Fontlab Ltd.<br>
    Transformations and filters — from Pencil to Gaussian blur<br>
    Advanced image-split algorithms — from Table to Book Smart<br>
    Direct import of most image formats, including EPS, GIF, JPG, TIF, BMP, PNG and (on Mac OS X) PDF</p>
