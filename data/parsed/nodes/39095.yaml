    votes: null
    html: |-
      <p>Also, for users who have problems running ScanFont together with FontLab Studio or TypeTool -- in ScanFont's preferences, in the Outline Font Editor section, choose "Export outline font into VFB file".  You will then be able to save the ScanFont output into a .VFB file that you can open in FontLab Studio or TypeTool using conventional means (File / Open). </p>
      <p>A.</p>
