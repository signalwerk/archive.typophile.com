      <p>SparkyType, </p>
      <p>ScanFont 3 was $198. ScanFont 5 is $99 and it can plug into TypeTool 3 (also $99). So the bundle costs the same as ScanFont 5 alone (hence no downgrade at all), and TypeTool 3 is much more of a full-blown font editor than the crippled ScanFont 3 font editing part. Instead of TypeTool 3, you can use FontLab Studio 5. </p>
      <p>Adam</p>
