      <p>Is it Windows or Mac problem? If it is on Windows, please, reboot, then run FLS, then run ScanFont 5 and try to export the font. Let me know if it works or not.</p>
      <p>ScanFont can save VFB (format supported by FontLab Studio or TypeTool) if there is a problem with live communication. You can turn it on in Tools &gt; Options &gt; Outline font editor.</p>
