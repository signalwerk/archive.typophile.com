    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 9.Dec.2005 10.20am </div>
      <p>In this newsletter:</p>
    <p>* MainType version 1.0 released<br>
    * Special offer: get MainType for $29 only<br>
    _______________________________________________</p>
    <p>We are pleased to announce the release of MainType version 1.0 for<br>
    Windows.</p>
    <p>OVERVIEW OF MAINTYPE<br>
    MainType is a powerful font manager that offers a straightforward and<br>
    easy-to-use interface to help you maintain your fonts.</p>
    <p>It includes features for novice users who just want to view and install<br>
    fonts as well as advanced features for graphic designers and typographers.<br>
    In order to find the right fonts for your needs, the software includes<br>
    filter and sort functionality as well as a font information pane that<br>
    reveals important typographic data. The groups pane helps you quickly<br>
    organize your font collection.</p>
    <p>For your convenience the character grid shows all characters grouped in<br>
    Unicode blocks. Print (along with print preview) results in outstanding<br>
    reports. The export wizard is able to output font information to clipboard,<br>
    text and html.</p>
    <p>SPECIAL OFFER<br>
    You can download MainType freely and try it out before you buy it. MainType<br>
    costs $40.00 (US), but you can get MainType for a special introductory price<br>
    of just $29.00 (US). This special offer will end on December 31, 2005.<br>
    MainType makes a great gift for people who want to get the most out of their<br>
    fonts.</p>
    <p>For more detailed information about features and pricing, please visit:<br>
    <a href="http://www.high-logic.com/maintype.html" title="http://www.high-logic.com/maintype.html">http://www.high-logic.com/maintype.html</a></p>
    <p>Best regards,</p>
    <p>Erwin Denissen</p>
    <p>High-Logic Software<br>
    <a href="http://www.high-logic.com/" title="http://www.high-logic.com/">http://www.high-logic.com/</a></p>
