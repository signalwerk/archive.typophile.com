    html: |-
      <p>Yes, I will be adding Syllabaries as another top level index.</p>
      <p>A pure alphabet has distinct symbols (letters) for consonants and vowels, both of which are <em>always</em> written in full.* So Devanagari and the other Brahmic-derived scripts are not ‘essentially alphabetic’ in a pure sense, because the inherent vowel is presumed. That is the defining feature of an abugida. Hangul, on the other hand, although it is written in a way that composes letters (jamo) into syllabic blocks, is an alphabet and not a syllabary, because it is the jamo that are the basic building blocks of the script, not the syllables. One could write Hangul sequentially using jamo, like the Latin alphabet. if one were inclined to; native readers would find it very odd, of course, but the writing system permits this because it is fundamentally alphabetic.</p>
      <p>* This leads to some confusion in the classification of some scripts. Arabic and Hebrew are classified as abjads, i.e. cosonantal alphabets in which the writing of vowels is optional, because this is what they are when used to write the Arabic and Hebrew languages. But the Arabic script used to write Kurdish is an alphabet, as is Hebrew used to write Yiddish. Also, even for writing Hebrew, these is some limitation on the optionality of vowels, as the letter vav may be either a consonant or a vowel (holam male), and is always written even when a vowel.</p>
