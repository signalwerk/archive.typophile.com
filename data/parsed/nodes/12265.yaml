      <p>I take it Katakana and Hiragana would go under Syllabaries, another top-level writing system? It looks like the omniglot people know what they’re talking about, but I’m still not completely sure that the categories are the Absolute Truth. Typographically, Hangul is composed of syllables, while Devanagari is essentially alphabetic, which strongly suggests that their classification is all about the implicit vowels. Wait a minute, what this “vowel” thing? All I see are pretty shapes :)</p>
