    html: |-
      <p>Hi,</p>
      <p><cite>One could write Hangul sequentially using jamo, like the Latin alphabet.</cite></p>
      <p>In Korea, it is called Segmented Writing (pul.uh.su.gi) which has been experimented and used since 1914. There are on-going debates and discussions of its use among the interests. Its research and applications have been usually for machine writing, but the idea and its actual use can be found in some extreme examples of Non-Tetragonal type of fonts. These days, the Segmented Writing is pervasive in logo types and commercial graphic design work. It is so popular that it became sort of a cliché.</p>
      <p>Yes, defining Hangul either as an alphabet or a syllabary is in every ways very fuzzy.</p>
      <p>Seonil</p>
