      <p>&gt; Hangul, on the other hand, although it is written in a way that<br>
      &gt; composes letters (jamo) into syllabic blocks, is an alphabet and<br>
      &gt; not a syllabary, because it is the jamo that are the basic building<br>
      &gt; blocks of the script, not the syllables.</p>
      <p>I think that’s too creator-centric. There are much more readers of Hangul than makers of Hangul fonts, a script should first serve its users, and [adult] readers read the “blocks” as whole syllables*; so if I had to choose, I’d list it as a syllabary (with a proper elaboration on its alphabetic aspect).</p>
      <p>* It’s their boumas.  :-)</p>
      <p>hhp</p>
