      <p>&gt; it is called Segmented Writing</p>
      <p>In “The Korean Alphabet” (Young-Key Kim-Renaud ed., 1997), Chin W Kim calls it “deblocked” (p 151), while Ross King calls it “on line” (p 225). I think I prefer “segmented” though.</p>
      <p>And yes, Hangul really deserves its own category… and on many levels!</p>
      <p>hhp</p>
