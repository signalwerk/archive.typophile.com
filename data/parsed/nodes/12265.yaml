  html: |-
    <p>While prowling in the new Typowiki (sure to be another excellent procrastination tool), I noted that there was a hesitant ‘Alphabets’ index that linked to a small number of writing systems, only some of which were actually alphabets. So I took it upon myself to retitle this <a href="http://typophile.com/wiki/Writing%20Systems">Writing Systems</a>, and to add under this general heading Abjads, Abugidas, and Alphabets, each of which I’ve populated with as exhaustive a list as I can come up with, largely thanks to the brilliant <a href="http://www.omniglot.com/">Omniglot</a>. Later I will add other classifications of writing systems under the general heading, unless someone beats me to it. In the meantime, I encourage people to start populating the wiki nodes for individual writing systems.</p>
    <p>Obviously, this represents quite a lot of work, so if you have bright ideas for changes to the overall arrangement of the Writing Systems indices, perhaps you could contact me and we can discuss them — or post them here —, rather than just going and making wholesale changes to what I’ve done. Wikis still unnerve me somewhat: where’s the editor? no editor? what do you mean there’s no editor?</p>
