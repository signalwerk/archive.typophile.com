    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Handsome</strong></p>
    <p>The Handsome family, now in <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a>, was designed by <a href="/wiki/Nick%20Shinn" class="freelinking" rel="nofollow">Nick Shinn</a>. <a href="/wiki/Contextual%20alternates" class="freelinking" rel="nofollow">Contextual alternates</a> make Handsome have the random flavor of real writing. The weights have been named after writing devices like “Fineliner” and “Speedball" instead of the traditional Light, Regular, Bold approach bringing fun to a casual family of fonts.</p>
    <p>URL: <a href="http://shinntype.com/Handsome_frames/C_han.html" title="http://shinntype.com/Handsome_frames/C_han.html">http://shinntype.com/Handsome_frames/C_han.html</a></p>
