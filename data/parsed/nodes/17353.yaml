    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;:&nbsp;Handsome</strong></p>
    <p>The Handsome family, now in <a href="/node/12420" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OpenType</a>, was designed by <a href="/node/12442" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Nick Shinn</a>. <a href="/node/add/wiki?edit%5Btitle%5D=Contextual%20alternates" title="Create node &quot;Contextual alternates&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Contextual alternates</a> make Handsome have the random flavor of real writing. The weights have been named after writing devices like “Fineliner” and “Speedball” instead of the traditional Light, Regular, Bold approach bringing fun to a casual family of&nbsp;fonts.</p>
    <p><span class="caps">URL</span>: <a href="http://shinntype.com/Handsome_frames/C_han.html">http://shinntype.com/Handsome_frames/C_han.html</a></p>
