  html: <p>Designed by <a href="/node/13538" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">William Addison Dwiggins</a> for <a href="/node/add/wiki?edit%5Btitle%5D=Megenthaler%20Linotype" title="Create node &quot;Megenthaler Linotype&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Megenthaler Linotype</a> under the direction of <a href="/node/add/wiki?edit%5Btitle%5D=C.%20H.%20Griffith" title="Create node &quot;C. H. Griffith&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">C. H.</span> Griffith</a> starting 7/19/39 through 2/6/41. These typeface <a href="/node/add/wiki?edit%5Btitle%5D=fleurons" title="Create node &quot;fleurons&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">fleurons</a> were inspired by Dwiggins’ work with stencils and stencil artwork. One can clearly see some of the same shapes and curves in the design of his&nbsp;marionettes.</p>
  html_clean: <p>Designed by <a href="/node/13538/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">William Addison Dwiggins</a> for <a href="/node/add/wiki?edit%5Btitle%5D=Megenthaler%20Linotype" title="Create node &quot;Megenthaler Linotype&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Megenthaler Linotype</a> under the direction of <a href="/node/add/wiki?edit%5Btitle%5D=C.%20H.%20Griffith" title="Create node &quot;C. H. Griffith&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost"><span class="caps">C. H.</span> Griffith</a> starting 7/19/39 through 2/6/41. These typeface <a href="/node/add/wiki?edit%5Btitle%5D=fleurons" title="Create node &quot;fleurons&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">fleurons</a> were inspired by Dwiggins’ work with stencils and stencil artwork. One can clearly see some of the same shapes and curves in the design of his&nbsp;marionettes.</p>
