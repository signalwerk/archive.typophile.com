  html: <p>Designed by <a href="/wiki/William%20Addison%20Dwiggins" class="freelinking" rel="nofollow">William Addison Dwiggins</a> for <a href="/wiki/Megenthaler%20Linotype" class="freelinking" rel="nofollow">Megenthaler Linotype</a> under the direction of <a href="/wiki/C.%20H.%20Griffith" class="freelinking" rel="nofollow">C. H. Griffith</a> starting 7/19/39 through 2/6/41. These typeface <a href="/wiki/fleurons" class="freelinking" rel="nofollow">fleurons</a> were inspired by Dwiggins' work with stencils and stencil artwork. One can clearly see some of the same shapes and curves in the design of his marionettes.</p>
  html_clean: <p>Designed by <a href="/wiki/William%20Addison%20Dwiggins" class="freelinking link-lost" rel="nofollow">William Addison Dwiggins</a> for <a href="/wiki/Megenthaler%20Linotype" class="freelinking link-lost" rel="nofollow">Megenthaler Linotype</a> under the direction of <a href="/wiki/C.%20H.%20Griffith" class="freelinking link-lost" rel="nofollow">C. H. Griffith</a> starting 7/19/39 through 2/6/41. These typeface <a href="/wiki/fleurons" class="freelinking link-lost" rel="nofollow">fleurons</a> were inspired by Dwiggins' work with stencils and stencil artwork. One can clearly see some of the same shapes and curves in the design of his marionettes.</p>
