      <p>"AGAIN" appears to be Octin Spraypaint A Regular:<br>
      <a href="http://www.myfonts.com/fonts/typodermic/octin-spraypaint/" title="http://www.myfonts.com/fonts/typodermic/octin-spraypaint/">http://www.myfonts.com/fonts/typodermic/octin-spraypaint/</a><br>
      <a href="http://www.fontsquirrel.com/fonts/octin-spraypaint-free" title="http://www.fontsquirrel.com/fonts/octin-spraypaint-free">http://www.fontsquirrel.com/fonts/octin-spraypaint-free</a></p>
      <p>"day" was harder to match, but I'm pretty sure its Porcelain:<br>
      <a href="http://www.fontsquirrel.com/fonts/porcelain" title="http://www.fontsquirrel.com/fonts/porcelain">http://www.fontsquirrel.com/fonts/porcelain</a> </p>
      <p>The following are also close, but not spot-on:<br>
      <a href="http://www.myfonts.com/fonts/archivetype/archive-petite-script/" title="http://www.myfonts.com/fonts/archivetype/archive-petite-script/">http://www.myfonts.com/fonts/archivetype/archive-petite-script/</a><br>
