  html: <p><i>from Mark Davis, Unicode Technical Committee</i> <br> <br>We are pleased to announce the final release of <a href="http://www.unicode.org/versions/Unicode4.0.0/">Unicode 4.0</a>. As with other major releases of the Unicode Standard, the Unicode Character Database and Unicode Standard Annexes for version 4.0 are final and available for implementation. The text of the book is currently in copy-edit, and will be on shelves in September 2003. Key sections of the book will be posted online as each becomes available.</p>
  html_clean: <p><i>from Mark Davis, Unicode Technical Committee</i> <br> <br>We are pleased to announce the final release of <a href="http://www.unicode.org/versions/Unicode4.0.0/" class="link-external">Unicode 4.0</a>. As with other major releases of the Unicode Standard, the Unicode Character Database and Unicode Standard Annexes for version 4.0 are final and available for implementation. The text of the book is currently in copy-edit, and will be on shelves in September 2003. Key sections of the book will be posted online as each becomes available.</p>
