    <p>So i've had our vector logo for a while and I've never been able to find the exact type face for this. The closest I've been able to come is ITC Garamond Book Italic. That's what 'whatthefont' says it is. But I know for sure when looking at certain letters that it is not this. Could anyone figure this out? I have been wanting to know FOREVER!!</p>
    <p>Thanks,</p>
