      <p>It does look like ITC Garamond Book Italic.  Two differences: the ascenders in the "l" and "h" are a little higher in your logo, and your logo is a touch heavier. The heaviness could have been achieved by a photostat with a shorter exposure. The higher ascenders may be a feature of the pre-digital version or a custom tweak.</p>
