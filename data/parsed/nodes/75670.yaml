      <p>Gosh I'm old...</p>
      <p>A photostat is how we would scale our artwork back in the pre-digital days. It's a high resolution reproduction made from a camera that would output high contrast black and white art onto photo paper. By increasing or decreasing the exposure time, we could fatten or thin an image.</p>
      <p>We would take this art and paste it up onto a mechanical, and... </p>
      <p>I could go on, but why bother? You're lucky you don't have to do this anymore. Same with specifying type by counting characters, cutting rubylith overlays, and all kinds of processes that are no longer needed.</p>
