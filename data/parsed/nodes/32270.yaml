    <p>Monotype Imaging Inc. has introduced the Soho™ typeface family, a slab serif design created by Sebastian Lester of the company’s UK subsidiary. As one of the largest typeface families ever released by Monotype Imaging, the Soho family is available in the OpenType® Pro format and consists of 40 fonts in various weights and widths.</p>
    <p>“This uniquely versatile typeface family offers flexibility for all applications and provides outstanding legibility for on-screen use as well as in print,” said Robin Nicholas, head of type design at Monotype Imaging Ltd. “As an industrial strength, contemporary design, the Soho family is a rich addition to the Monotype® Library of typefaces.” </p>
    <p>The Soho typeface is rooted in designer Lester’s observation of what was missing from font offerings: “It’s amazing in an age of so many typefaces that gaps and niches still exist in the marketplace,” he said. “Slab serifs have been very popular recently with this sub-genre of the serif taking a firm hold in the realms of publishing and corporate identity. Yet there have been few multi-width slab serifs with fundamentally modern aesthetics to choose from.” </p>
    <p>A slab serif typeface is a subset of the modern serif, characterised primarily by thick and blocky serifs. “There is something inherently strong, solid and reliable-looking about a good slab serif. It’s not surprising slab serifs have enjoyed this renaissance. Being closely related to sans serifs, they tend to look more modern than other varieties of serif as well, and they’re very robust on screen. Given that slab serifs are often used in headlines, it makes sense to have a variety of widths and weights so that even the most demanding of designers can find the correct weight and width for their needs,” Lester said. </p>
    <p>Soho fonts are available in the cross-platform compatible OpenType format. “Features such as ‘stylistic sets’ can be useful – where a wide variety of alternative characters can be applied easily,” said Allan Haley, director of words and letters at Monotype Imaging Inc. “This gives one font the ability to reflect different appearances, from conservative to cutting edge.” </p>
    <p>“As a type designer, I’m preoccupied with finding ways in which I can address modern problems like good legibility in modern media and create fonts that work precisely and efficiently in the most technically demanding of corporate and publishing environments,” said Lester. “I hope I have achieved this with Soho.” </p>
    <p>Information about the Soho typeface family and its availability can be found and ordered online at <a href="http://www.monotypefonts.com/soho" title="www.monotypefonts.com/soho">www.monotypefonts.com/soho</a>. Individual Soho fonts, selection packs and the complete Soho typeface family can be viewed, purchased and downloaded from <a href="http://www.fonts.com" title="www.fonts.com">www.fonts.com</a> and <a href="http://www.faces.co.uk" title="www.faces.co.uk">www.faces.co.uk</a>. Customers may also contact Monotype Imaging in the U.S. toll-free at (800) 424-8973, prompt 1, or in Europe on (+44)(1737 765959). Customers from other parts of the world may dial 1-970-6000 (U.S.).</p>
    <p>Other typefaces by Sebastian Lester include the Scene™, Neo Sans™ and Neo Tech™ designs.</p>
    <p>About Monotype Imaging<br>
    Based in Woburn, Mass. with regional offices in the U.K., Germany (Linotype), Mt. Prospect, Ill., Redwood City, Calif., Boulder, Colo., Japan and China, Monotype Imaging is a leading global provider of text imaging solutions for manufacturers of consumer electronics devices, including laser printers, copiers, mobile phones, digital televisions, set-top boxes, digital cameras, and operating system and software application vendors. Monotype Imaging technologies are combined with access to more than 9,000 typefaces from the Monotype®, Linotype® and ITC® typeface libraries – home to some of the world’s most widely used designs, including the Times New Roman®, Helvetica® and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative and business professionals through custom font designs, direct sales or e-commerce Web sites. Monotype Imaging offers fonts and industry-standard solutions that support all of the world’s major languages. Information about the company and its products can be found at<br>
    <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>, <a href="http://www.fonts.com" title="www.fonts.com">www.fonts.com</a>, <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a>, <a href="http://www.monotypefonts.com" title="www.monotypefonts.com">www.monotypefonts.com</a>, <a href="http://www.customfonts.com" title="www.customfonts.com">www.customfonts.com</a>, <a href="http://www.fontwise.com" title="www.fontwise.com">www.fontwise.com</a>, <a href="http://www.itcfonts.com" title="www.itcfonts.com">www.itcfonts.com</a> and <a href="http://www.faces.co.uk" title="www.faces.co.uk">www.faces.co.uk</a>.</p>
