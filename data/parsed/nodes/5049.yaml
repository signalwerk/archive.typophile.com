    html: <p>If you design for yourself, why sell the finished work then? Not being an ••• just for the sake of it, but c'mon. No profession is that self-serving where one does stuff only for one's self. Type designers make typefaces in hope that they get used, right? If not, what would be the point of doing them? Simply to &lt;em&gt;show them off&lt;/em&gt; seems a silly reason. <br> <br>When you are starting to design a typeface, I'm sure even the slightest of intentions is worked into it, whether you are thinking "This would look bitchin' on a billboard" or "I'm sure a designer can run this at 4 pt and still be legible". There has to be the slightest of intent to appeal to somebody </p>
