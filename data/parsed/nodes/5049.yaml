    html: "<p>Thanks Hrant and Stuart. Those are the kind of things that are intriguing. Being a graphic designer, it is very clear for me who I design for: I design for my client's clients but I give them the impression that I'm designing for them (the direct clients). So I basically have two clients, or targets, I have to please. However, for type designers it does seem a bit more vague and fluctuating from one type designer to the next. <br> <br>Do you ever listen to graphic designers' opinions on what typefaces they like and why the choose one over another? We are a snobbish and bitchy bunch, so I can understand why sometimes our opinions could be shunned. <br> <br>Do you react to trends? If retro scripts are in fashion do you set out to do one and cash in?</p>"
