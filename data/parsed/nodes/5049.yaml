    html: <p>This is an intriguing question. When I was a student I wanted to design a typeface for my senior BFA project. Two different instructors had differing opinions about how I should proceed. One suggested I create a hypothetical client or a design problem to solve and therefore be better able to measure the success of the project. The other instructor took the opposite view, suggesting I design it for me and let it be more of a personal expression. <br> <br>(I'd encourage any design student with the hankering for type to try it out. I'm no type designer, but that exercise has made me much more comfortable pushing type around, experimenting and questioning the norms.) <br> <br>I believe there is room for both approaches. If it weren't for the personal expression we wouldn't have typefaces like <a href="http://www.fontbureau.com/fonts/font_frames.tpl?cart=1086330099122010&amp;fontname=Amplitude" target="_blank">Amplitude</a> or <a href="http://www.emigre.com/dp/getfontpage.php?PTarWR.html" target="_blank">Tarzana</a> or anything from <a href="http://www.fontdiner.com/" target="_blank">Stuart</a> or <a href="http://www.testpilotcollective.com/" target="_blank">Test Pilot Collective</a>.  <br> <br>Armin, I know you wanted to focus on non-commissioned types, but you can't deny the place commissioned faces have on the typo-landscape. Consider <a href="http://www.terminaldesign.com/retail_specimen.php?ID=1001&amp;viewFam=1" target="_blank">Clearview</a>, <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdisplay&amp;displayfontid=BT.107419.0.0&amp;packagefontid=0&amp;view=package&amp;searchID=0&amp;searchby=keyword&amp;searchletter=A&amp;searchstr=bell%20gothic&amp;totalrecords=44&amp;startrow=1&amp;records=20&amp;currpage=1" target="_blank">Bell Gothic</a>, <a href="http://www.typography.com/catalog/hoeflertext/index.html" target="_blank">Hoefler Text</a>, <a href="http://www.typography.com/press/pr_04_09_02.html" target="_blank">Retina</a> or <a href="http://www.linotype.com/469/frutiger-family.html" target="_blank">Frutiger</a> (which are all available for retail sale after their original exclusivity has expired). The list is endless, and the innovations on the utilitarian front are huge. That can't always be said of more personal designs. <br> <br>Ahem, now I'll shutup and let the type designers speak.</p>
