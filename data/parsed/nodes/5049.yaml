  - id: 36583
    user: 1226
    date: 2004-06-03T13:08:00
    date_raw: 3.Jun.2004 1.08pm
    votes: null
    html: <p>I'll bite Armin . . . <br> <br>I design type first for me, second for the masses (anybody with a computer and a credit card who likes fonts). I feel completely indulgent in my profession and in the back of my mind I honestly do think I can't wait for other people to see and use these fonts and hope they think they are as cool as I do. <br> <br>I want my fonts to inspire people. <br> <br>I don't care if they use the fonts for personal birthday party invites or cereal boxes. I want people to see the fonts in use and feel a connection to the fonts and the message being communicated to them. <br> <br>I think as an art director for many years I felt there was this 'ultimate' consumer I was designing for - straight up demographics (Female 24-37, Income . . .). Then i tried to get into their heads and invent people to design ads to and it left me very empty. <br> <br>Once I started making type, I started having more satisfaction in my work because I felt, if every designer in the world starts using my fonts, in 10 years my porfolio is going to hit the millions. (I'm not so concerned about my portfolio these days) <br> <br>I don't need to design every ad in the world and honestly have no desire to, there are people who are better than me and really love making ads. BUT, if I can make better typefaces for designers and consumers to use and see in use, I feel I am enabling better communication with my talents instead of working up headlines with a copyrighter and doing tons of layouts through the night. <br> <br>I recently wrote in an editorial piece that I think we're living in a more typographically aware world than say 10 years ago. Mark my words in a few years time don't be surprised to see our intimate type community explode into the mainstream. <br> <br>Stuart :D</p>
