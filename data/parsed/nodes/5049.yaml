    date_raw: 3.Jun.2004 7.20pm
    votes: null
    html: "<p>Armin, great question. <br> <br>I think the first thing to note here is that retail type design is so unlikely to provide a sufficient and steady income to most individuals that it does in fact make sense that so many people \"indulge\" in it. Some of those people make their living with custom type work (which is generally less rewarding \"spiritually\"), or in a totally different field. The net result is that the designs are very \"divergent\" in terms of utility: they are unlikely to be best-sellers, but some people will have wet dreams (personal joke intentional ;-) over some of them. It's more like Art, and some people (like me) actually have a problem with that, since I have to question how that serves other people. Designing to answer some funky personal riddle or whatever seems a bit too bourgeois for me.  :-) I already have a BMW - I'm bourgeois enough! <br> <br>Personally, when I design a font \"out of the blue\" I <i>try</i> to make it something end-users, more than designers, <i>need</i> - and simply hope that there are designers out there who think the same way, and want to deliver that same kind of typography to their \"users\", so they end up needing that certain kind of font. I'm not claiming that I do this because I'm a noble person or something, it's probably simply due to my nature (which is out of my hands) - I enjoy satisfying other people (although maybe only if they're \"in tune\" with me). So for example I made the Akhakalak Georgian font because I saw that the Georgian script is too wide, and wanted to give people a display face that would set narrow, like on bottle labels for their wonderful wines. And when I made Nour (Armenian) you could say I targeted even beyond what Armenian users think they need, or what they say they want: I targeted what I think Armenian typography needs now. And once in a while I run into a designer who \"gets it\" and enthusiastically pays me to get a copy of it. It's sort of like a cultural crusade. <br> <br>The other thing that turns me on though is solving technical issues with new fonts, like pushing the limits of readability, or fighting lo-fi repro. That's the engineer in me. <br> <br>hhp <br></p>"
