    <p>As type designers who do you design for?  <br> <br>Who is your target audience?  <br>Is it the professional user (aka Graphic Designer)? <br>Are architects, accountants, plumbers at all in the picture (aka the lay man)? <br> <br>Do you design with a particular end use in mind (ie, a nightclub flyer, annual report, web)? <br> <br>Or do you design to fit a particular foundry you desire to be represented by? <br> <br>These and many other questions about type designers' audience plague my mind. <br> <br>(Let's skip commisioned typefaces, as those serve very specific needs and come with many requirements)</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/5175" class="topic-previous" title="Go to previous forum topic">‹ East coast vs. West coast.</a> <a href="/node/5198" class="topic-next" title="Go to next forum topic">Some Wingdings characters ›</a></div>
