      <p><cite>Mathmaticians, typographers, which font has your favourite infinity symbol?</cite></p>
      <p>After looking through a few fonts, I realized that many, if not most appear to be placeholders. Really the infinity symbol should reflect the style and character of the face. But carefully crafted stroke variance, such as seen in John's example, is rare. </p>
      <p>However, it may also be that there is a consideration for the possibility that the symbol could be used at both large and small sizes. For example, the infinity might be used in superscripts as well as with a sigma when describing a sum. These are some of the smallest symbols that would be generally used in typesetting, especially if they were in footnotes or endnotes. So, type designers might have to hedge on designs that work for the smallest sizes. </p>
      <p>Below is the infinity symbol from Optima. I would suspect that the newer the font is, the more likely it is that the symbol is the work of the original designer. This version increases in size from left to right slightly. The one I found in Gill Sans does this even more-- although, even with these distinct shapes, I feel unsure if they are the work of the original designer, or if they too were added in later to achive completeness.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/optima.jpg"></div><p></p>
