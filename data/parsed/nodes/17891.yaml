      <p>It's great that you think about a math companion font, that's something that's sorely missing from many typefaces.  And of course designing a proper symbol for the text font is still the right way to go, as long as you're aware of its limited usefulness.</p>
      <p>You should definitely look at old style numbers for reference. The infinity sign will appear in similar places as a number, but it will never be directly next to a digit, so it doesn't have to harmonize with lining figures in that sense.  The main point is that it's not analogous to a lowercase letter, and modelling it after, say, the shape of your omega would probably not work out too well.</p>
      <p>Have a look at <a href="http://timstadelmann.de/infty.pdf" rel="nofollow">this PDF</a> if you're in doubt about typical uses.</p>
