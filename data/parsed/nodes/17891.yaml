      <p>The infinity symbol is such a distinctive shape, I think it can withstand a variety of typography treatments. Obviously if one is producing a typeface specifically for mathematical typesetting, one should be aware of the conventions used in that kind of publishing. But the symbol is also used in a variety of non-technical ways; there is, for instance, a condominium development in Vancouver called Infinity that has the symbol machine engraved in granite at the front of the building. So in display types there is a good excuse to have some fun with this character and focus on its evocative and aesthetic, even decorative, potential rather than on its functional characteristics.</p>
      <p>I like to give the infinity symbol a reverse ductus, rather than following the typical contrast pattern of letters and numerals:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/infinityJH.gif"></div><p></p>
    html_clean: |-
