      <p>Using old style figures for maths typesetting was the rule in old (roughly, pre-war) books and papers, but it's become increasingly unusual since.  I wasn't aware of a cultural difference in this regard (although there are substantial differences between the anglo-american style of maths typesetting and the continental European one; just as the metric system, the latter forms the basis for the international standard but is mostly ignored in the US). However, a quick and totally unsystematic look through old papers that are available online shows that the American Physical Society switched to lining numbers as early as 1924, while British Journals still used old style numbers in the fifties.</p>
      <p>Personally, I prefer to use old style numbers unless publication style requires something else. I'm currently setting my DPhil thesis in this style, and none of the proofreaders (Physicists) seemed to notice the  numbers at all. They are easier to tell apart even when used at small sizes, and since most mathematical formulae use mixed case, they seem more natural. Moreover, operators are usually aligned to lowercase letters.</p>
      <p>Using lining numbers also has the added disadvantage that you have to worry about what to do with the remaining numbers in your document, and there's not really a good answer to that; typically lining numbers are used throughout.</p>
      <p>Tim</p>
