      <p>To clarify, numbers that are not rational are irrational, not transcendental. Transcendental numbers are numbers that are not solutions to any polynomial equation having integer coefficients. I am sure this helps settle the original question. :^)</p>
      <p>Being a mathematician, not a typographer, I tend to think of “infinity” as a number. It is sometimes appended to the real numbers to form what is known as the extended real numbers. Furthermore, Cantor's transfinite numbers and J.H. Conway's surreal numbers include infinite quantities, though they do not use the “lazy eight” to represent them.</p>
