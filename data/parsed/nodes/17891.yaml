      <p>As Mathworld points out, infinity is an "unbounded quantity", so it's not too useful to think of it as a operator. </p>
      <p>I think it's more likely to be seen with variables or with an arrow, so I think it should harmonize with the lower case. As we see in the Mathworld entry, it's often seen printed small, under "lim" with a variable, denoting a limit as n approaches infinity. </p>
      <p>BTW, all <a href="http://mathworld.wolfram.com/TranscendentalNumber.html" rel="nofollow">transcendentals</a> are <a href="http://mathworld.wolfram.com/IrrationalNumber.html" rel="nofollow">irrationals</a>, but not all irrationals are trancendentals.</p>
