      <p>Thanks Tim.</p>
      <p>I put the full set of characters for standard Latin encoding in all my fonts.<br>
      Things like printer's fists and arrows would be more useful to typographers than infinity, but the people who compiled the standard encodings made a dreadful hash of things, so instead we have lozenge, mu and product -- and no minus or multiply in the basic Mac font.</p>
      <p>I'm not designing a math font, this is more of a general enquiry.</p>
      <p>However, I am working on a typeface that would be good for maths, so I am getting my head into that space, and may later produce an accompanying math font, so it makes sense to tackle some of these problems now, rather than have an eventual discrepancy between the same character in regular and math versions of the face.</p>
      <p>Your point about infinity harmonizing with figures: that's possible with old-style figures, but I feel that the landscape format of the infinity symbol doesn't harmonize at all with the portrait orientation of lining figures: how can that be resolved?</p>
