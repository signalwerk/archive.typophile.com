      <p>Interesting question, and it's good too see you're putting thought into mathematical symbols.</p>
      <p>Mathematically speaking, infinity is neither an operator nor a transcendental number (they  are a subset of those real numbers that aren't rational).  It's not a number at all, but it's usually used analogously to a literal number, and as such it should preferrably harmonize with the figures in your font.  It's interesting to compare it to the zero, which often occurs in the same contexts as an infinity sign, also used to be hard to grasp for people, historically, and incidentially shows the same uncertainty between a stressed and monoline glyph in old typefaces.</p>
      <p>Practically speaking, mathematical typesetting prefers the stressed version, as far as I can tell.  As infinity takes a sign, it should be centred with respect to the horizontal bar of the plus and minus signs; it should have equal sized loops and look neither like a bow tie nor (worse!) like two circles with fused curves. If you keep Ourboros in mind you can't go wrong.</p>
      <p>Favourites are difficult, there's not much choice in mathematical fonts.  The following example from a custom math font to go with Times illustrates proper design and alignment:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/infty.png"></div><p></p>
      <p>Are you designing a complete font for mathematics, or are you just trying to fill a required encoding point? In the latter case it's likely never going to be used anyway, I'm afraid. You might as well save some effort and fake an infinity sign by rotating your eight, as they did in the bad old days... You still see lots of infinity signs with larger right loops, doublessly originating from this practice.</p>
      <p>By the way, there's no hard rule that operators (and relations) shouldn't be drawn stressed.  That works better for such symbols as are derived from simple geometrical shapes, but for example "proportional to" and "approximately equal to" signs are regularly drawn with stress and arguably look less clumsy this way. Mathematicians also have no qualms about using text symbols (asterisks, ampersands) as operators in specialized context.</p>
      <p>Tim</p>
