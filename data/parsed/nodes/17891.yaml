      <p>Nick:</p>
      <p>Being neither mathematician nor typographer, I'm going to charge in anyway:</p>
      <p>On the one hand, the concept "infinity" should probably be written out in text; using a symbol for it makes about as much typographical sense as using the alchemical symbols for Venus and Mars to indicate men and women in text. So, why craft it as a lower-case character? Typographers can't presume to make good style choices for authors, but maybe they can help discourage poor ones.</p>
      <p>The symbol  seems to me best thought of as a transcendental value--like the constants <em>c</em> for the speed of light, or <em>g</em> for the force of gravity--and not a mathematical operator. But that's where things get tricky, no? Because <em>c</em> and <em>g</em> usually show up--I think--as italic characters in the base font of the text. So you're back to where you--that is, I--started.</p>
