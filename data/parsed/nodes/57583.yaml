    html: <p>Most likely hand lettered. <a href="http://www.fontshop.com/fonts/singles/linotype/vectora_com_96_black_italic/&amp;sample_text=NEW%20YORK&amp;sample_size=60">Vectora</a> is an option, though less heavy. Also <a href="http://www.fontshop.com/fonts/singles/itc/itc_franklin_gothic_std_heavy_italic/&amp;sample_text=NEW%20YORK&amp;sample_size=60">ITC Franklin Gothic</a> or <a href="http://www.fontshop.com/fonts/singles/monotype/twentieth_century_std_ultra_bold_italic/&amp;sample_text=NEW%20YORK&amp;sample_size=60">Twentieth Century</a>.</p>
    html_clean: <p>Most likely hand lettered. <a href="http://www.fontshop.com/fonts/singles/linotype/vectora_com_96_black_italic/&amp;sample_text=NEW%20YORK&amp;sample_size=60">Vectora</a> is an option, though less heavy. Also <a href="http://www.fontshop.com/fonts/singles/itc/itc_franklin_gothic_std_heavy_italic/&amp;sample_text=NEW%20YORK&amp;sample_size=60">ITC Franklin Gothic</a> or <a href="http://www.fontshop.com/fonts/singles/monotype/twentieth_century_std_ultra_bold_italic/&amp;sample_text=NEW%20YORK&amp;sample_size=60">Twentieth Century</a>.</p>
