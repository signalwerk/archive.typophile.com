      <p><cite>Wikipedia calls it a tombstone.</cite></p>
      <p>I doubt Wikipedia ever worked in editorial design. </p>
      <p>I worked in magazines for years, and never heard it called a tombstone. End mark was the term most commonly heard, that and occasionally "bug"</p>
      <p>Yes Kent, I think I have confused the cubs by using the copy editors mark that indicates "the end". But I always left it in the ms. when I sent the spec to the type shop, and they always knew to replace it with our end mark</p>
