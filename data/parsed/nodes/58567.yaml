    html: |-
      <p>Regarding the term "tombstone":</p>
      <p>"Tombstone" in letterpress news and magazine work was also used as a term for an advertisement that appeared regularly in issue after issue, with no changes. The form would be put away as each issue was killed, and hauled out for the next. After much repeated use the type might be re-set, but exactly as it looked earlier.</p>
      <p>powers</p>
