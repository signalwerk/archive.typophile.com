    html: |-
      <p>Wikipedia calls it a tombstone.</p>
      <p>In mathematics, it's known as a QED symbol or halmos (after Paul Halmos, who popularised its use to mark the end of a proof). Some authors use a different mark for proofs by contadiction (I personally draw a lightning bolt, but a filled square is probably more common).</p>
