  html: |-
    <p>I've been catching up on some typography, but one thing has eluded me; what is the glyph a lot of magazines tend to end their articles with?</p>
    <p>Most tend to use a square, while some spruce it up with their own inventions, but from a typographer's point of view, what exactly are they? A quirky idea or an ancient typographic convention?</p>
