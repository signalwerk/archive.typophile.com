    <p>Last time while reading a magazine, I saw on the back page a lingerie ad, that contained 2 fonts I wish to identify or at least find similar ones.</p>
    <p>The fonts I'm looking for are<br>
    - the one from the logo : Triumph<br>
    - and the one in which the sentence "L'armature qui se fait oublier" is written. </p>
    <p>Thanks for helping me out !</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Triumph-2_4947.jpg"></div><p></p>
