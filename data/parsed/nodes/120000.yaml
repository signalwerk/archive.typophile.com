    html: |-
      <p>Feather Script is an unusual combination of an classic structured lowercase similar to Englische Schreibschrift with casual swooping capitals.  Feather Script seems to give some hint as to how letters other than the _T_ in _Triumph_ could work with the _Triumph_ lowercase.<br>
      As for the second script -- Triumph Tailoress Script -- it's a far from casual design.  I made a somewhat similar _f_ from scratch. </p><div class="imageWrap"><img src="http://typophile.com/files/Recreated_t__6046.jpg"></div><br>
      The exercise was surprisingly time consuming. Wish I could find a similar design as elegant and structured in an an existing font that is available to the public.<br>
      Don<p></p>
