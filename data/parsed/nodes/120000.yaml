      <p>_Triumph_, also bespoke, is difficult to replace with a substitute. It seems to be based on the traditional 18th and 19th centuries English script but with a reduced inclination.<br>
      For example Bo Berndal's Carl Beck </p><div class="imageWrap"><img src="http://typophile.com/files/CarlBeckInUse_5416.jpg"></div><br>
      <a href="http://www.fonts.com/font/monotype/carl-beck/regular?SiteId=15" title="http://www.fonts.com/font/monotype/carl-beck/regular?SiteId=15">http://www.fonts.com/font/monotype/carl-beck/regular?SiteId=15</a><br>
      Another script that attempted this is Aldo Novarese's Juliet, which has been digitized by  Rebecca Alaccari and Patrick Griffin as Ambassador Script <div class="imageWrap"><img src="http://typophile.com/files/AmbassadorScriptInUse_3698.gif"></div> <a href="http://www.myfonts.com/fonts/canadatype/ambassador-script/" title="http://www.myfonts.com/fonts/canadatype/ambassador-script/">http://www.myfonts.com/fonts/canadatype/ambassador-script/</a><br>
      Don<p></p>
