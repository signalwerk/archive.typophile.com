    html: '<p>My ATypI experience echoes the positive notes of other posters. I offer one more story that may help swing any fence-sitters to come: every summer my typeface design students ask "should we come to ATypI?" (which for them takes place after a year of little income and considerable expenditure, and on the eve of trying to get back into the job market). Most of them manage to make the trek, even if it is halfway round the world. So far most have come back to me and said it was well worth it; and none complained that they misspent their time and money.  <br>And, be sure that the gestures of welcome and hospitality mentined above have been very real, and in some cases substantial.</p>'
