    html: <p>I'll second what Adam has said about ATypI conferences. ATypI grew out of a manufacturer's association, so it has always been more associated with the business side of type than other type clubs and conferences, and this is one of its strengths. And, yes, this means that the conference attracts professionals, but in no way is it limited to professionals. There are always a good number of students in attendance, as well as people who are just starting out in the business. <br> <br>ATypI Prague marks the 10th anniversary of Tiro Typeworks. When Ross and I saved our pennies, checked into a dodgy hotel in San Francisco's Chinatown, and attended our first ATypI in 1994, we had not completed our first typeface designs and didn't know anyone. We had an introduction to Dave Farey and Matthew Carter courtesy of Gerald Giampa, and that was it. One of the first people we met at the opening reception was Margaret Richardson, then editor of <i>U&amp;lc</i> and she and other people went out of their way to make us welcome and to introduce us to people like Gerard Unger, Sumner Stone and Petr van Blokland. It is something I remember with gratitude, and I always try to meet some new attendees, particularly type design students, at each conference and make sure that they are made as welcome as Ross and I were in 1994. <br> <br>I really encourage people not to stay away from ATypI because they're worried that it is elitist or only for professionals and experienced designers. Come to Prague, and if you find it hard to get talking to people, come and find me or Adam. We'll be happy to meet you, buy you a drink, and introduce you to some people.</p>
    html_clean: <p>I'll second what Adam has said about ATypI conferences. ATypI grew out of a manufacturer's association, so it has always been more associated with the business side of type than other type clubs and conferences, and this is one of its strengths. And, yes, this means that the conference attracts professionals, but in no way is it limited to professionals. There are always a good number of students in attendance, as well as people who are just starting out in the business. <br> <br>ATypI Prague marks the 10th anniversary of Tiro Typeworks. When Ross and I saved our pennies, checked into a dodgy hotel in San Francisco's Chinatown, and attended our first ATypI in 1994, we had not completed our first typeface designs and didn't know anyone. We had an introduction to Dave Farey and Matthew Carter courtesy of Gerald Giampa, and that was it. One of the first people we met at the opening reception was Margaret Richardson, then editor of <i>U&amp;lc</i> and she and other people went out of their way to make us welcome and to introduce us to people like Gerard Unger, Sumner Stone and Petr van Blokland. It is something I remember with gratitude, and I always try to meet some new attendees, particularly type design students, at each conference and make sure that they are made as welcome as Ross and I were in 1994. <br> <br>I really encourage people not to stay away from ATypI because they're worried that it is elitist or only for professionals and experienced designers. Come to Prague, and if you find it hard to get talking to people, come and find me or Adam. We'll be happy to meet you, buy you a drink, and introduce you to some people.</p>
