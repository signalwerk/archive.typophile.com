    html: <p>Hrant, <br> <br>Thanks for the info! I have been to Salzburg once, not nearly long enough, and it was easily the most beautiful city I've ever set foot in. After a 13-hour series of flights and preceding time totaling to over 24 hours without sleep, I landed in Salzburg, checked into my hotel in the early afternoon, then decided to walk around instead of crashing and messing up my sleep schedule for the whole trip. <br> <br>I bumbled and staggered up and down the street and noticed a path up the wooded mountain across the street from my hotel. I got on it and followed it wearily. About forty minutes later I reached the top, where someone had long ago cleverly erected a restaurant and Biergarten. If only all mountains were so equipped! <br> <br>So yes, so far Salzburg is my favorite city. Second would have to be Munich. Tons of people tell me Vienna is the most beautiful, but also expensive, and Prague has that part beat. But I speak zero Czech, so traveling alone is far less stressful in Vienna. I still have not yet made a firm decision about the Vienna part.</p>
