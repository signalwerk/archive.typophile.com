    html: <p>I'll second all of that. <br> <br>I too will happily buy you a drink and introduce you to some other type nuts.  <br> <br>Also, just because somebody is a Big Name Type Designer or works for Famous Type Foundry doesn't mean they're unapproachable. Almost all of them are in this because they love type, and very few of their heads have swollen to the point where they're jerks or unapproachable. <br> <br>Actually, it's kind of funny; even most people who are relatively sharp-tongued online are mostly pretty mellow in person. <br> <br>So if you can afford it, and you love type, you should come out. Just be sure to introduce yourselves, okay? <br> <br>Cheers, <br> <br>T</p>
