    html: <p>When I visited Prague I flew into Germany then took trains to cross into Austria* and the Czech Republic, and that was trivial. Flying straight in might be different, but I'm pretty sure you don't need a visa for a US passport. To be safe, ask ATypI. <br> <br>* Salzburg, Innsbruck, Salzkammergut and Vienna. BTW, who told you Vienna was so beautiful? I guess beauty is subjective, and if you like neoclassical stuff it certainly has the most impressive stuff in the world as far as that goes. But on my list there are very many cities (including Salzburg) that are much more beautiful. To me Vienna is very pretty. <br> <br>BTW, I might also hop over to Bratislava - it's very close. Krakow is a supposed to be a very beautiful city too*, although that's a few hours north of Prague. <br> <br>* From what Nathan and this Polish guy I know have told me. <br> <br>Honestly though, my recommedation would actually be to spend as much time as you can in Prague. Only Barcelona is better. <br> <br>hhp <br></p>
