  html: "<p>I am gearing up for ATypI Prague. A question for Americans who have been there before: do I need to do any weird visa stuff in advance? Is there a visa cost? <br> <br>I hope to see everyone there! <br> <br>P.S. I plan to go to Vienna for a few days after Prague since I've never been there before, and since it's supposed to be the most beautiful city on Earth. Will anyone else happen to be going that way? And are there any typo-tourist-y things to do there?</p>"
