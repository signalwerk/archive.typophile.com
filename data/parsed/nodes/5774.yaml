    html: "<p>Wow - ATypI has an official airline? Cool. Can we get an official chocolate too? C�te d'Or, please?  :-) <br> <br>The content of an ATypI conference (except maybe Leipzig) is certainly worth the admission fee - but there is the matter of actually being able to afford it. I think most of us waste more than the equivalent of the fee on junk during the year, so in part it's a matter of self-discipline and planning (not fortes for me...). On the other hand, getting good deals on transport and lodging certainly helps! So here's what I've found: <br> <br>If you plan on making a longer vacation out of this, you might consider staying away from the Archa area, and go for something more central, like the really charming-looking Meran, which is in this pretty good package: <br><a href=\"http://www.francevacations.net/travelzoo/text11.cfm\" target=\"_blank\">http://www.francevacations.net/travelzoo/text11.cfm</a> <br> <br>If you want to spend extra and be closer to the Archa (which the conference hotel is not), I can recommend the Meteor Plaza, where I've stayed: <br><a href=\"http://www.pragueholiday.cz/meteor.html\" target=\"_blank\">http://www.pragueholiday.cz/meteor.html</a> <br>It has a 14th century cellar which they've turned into a wine/cocktail bar. And their breakfast was memorable. <br> <br>And this site seems to have a great selection and good deals for Prague: <br><a href=\"http://www.hotelclub.net/\" target=\"_blank\">http://www.hotelclub.net/</a> <br> <br>Now, if you <i>are</i> rich, and want to make this a special vacation in addition to attending the conference, there really is only one place to stay: <br><a href=\"http://www.pragueholiday.cz/irongate.html\" target=\"_blank\">http://www.pragueholiday.cz/irongate.html</a> <br>Amazing looking place. <br> <br>hhp <br></p>"
