    html: '<p>David wrote: "Even if I am pretty close to the Czech border, I may not be able to attend ATypI Prague, sadly enough, due to not being a rich and famous type and graphic designer, by now. "  <br> <br>David,  <br> <br>it is a common misconception that only "rich and famous type and graphic designers" go to ATypI conferences. First of all, there are very few, if any, such people. When I went to my first ATypI conference in 1998 (to Lyon), I was a very poor student -- I lived in Lyon in a youth hostel. Of course, I was lucky to use the student discount. ATypI conferences are IMO worth saving money for it.  <br> <br>We have now a good deal with Czech Airlines (<a href="http://www.atypi.org/08_Prague/60_city/40_travel" target="_blank">http://www.atypi.org/08_Prague/60_city/40_travel</a> ) while for people from European countries -- most railway companies offer some sorts of discounts if you book in advance.  <br> <br>Best,  <br>Adam <br></p>'
