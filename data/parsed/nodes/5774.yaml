    html: '<p>When you introduce yourself, be sure to ask to be introduced to others! Perhaps we can set up a special code for such help: <br>"Thomas Phinney new Geometrical Sans" ;-) <br> <br>*** <br> <br>I recall to have meet John Hudson at the terrasse of a caf� in the harbor of Barcelona, for a lunch organised by a large American foundry (Belgium by its name) the year after, in 1995. <br> <br>(my first was in 1993, in Belgium where I meet Yves Peters all all the type troops). <br> <br>In 1993, I recall to try to speak a very bad English to some famous people, when years after I realized that some of them speak quite good French in fact at my surprize. <br> <br>But the most impressive for me was to be able to have comments on my Apolline from booth Zapf and Frutiger in same time!!!</p>'
