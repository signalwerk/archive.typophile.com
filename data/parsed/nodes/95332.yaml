      <p><cite>the pre-compiled version doesn't run atm</cite></p>
      <p>I just tried on my MacBook Pro with OS X 10.6 and had no problem running it.  I first right clicked on the link and saved the file  <code>sfnt2woff.txt</code>. Then I executed</p>
      <p>  mv sfnt2woff.txt sfnt2woff<br>
        chmod 755 sfnt2woff</p>
      <p>and put <code>sfnt2woff</code> in my <code>~/bin</code> directory (which is in my PATH).</p>
      <p>Added: I just tried on a Mini and I directly got the file <code>sfnt2woff</code> but still had to use <code>chmod</code> to make it executable.</p>
