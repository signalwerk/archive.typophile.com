    <p>Hello,</p>
    <p>I was wondering which tools are available to create/convert web fonts from OTF (cff) files? I'm on OSX and it could be command line tools as well.<br>
    I know there are more than a few sites available that can do it for you, but I'm looking at fonts that I'd like to convert myself and also test with OT features.</p>
    <p>I've looked at sfntly from Google but it's still a work in progress and also does not handle OTF/CFF fonts.<br>
    There's an (old) tool from JKew (<a href="http://people.mozilla.org/~jkew/woff/">http://people.mozilla.org/~jkew/woff/</a>) but could not test it yet (the pre-compiled version doesn't run atm).</p>
    <p>Any ideas or pointers?</p>
    <p>Regards,<br>
    Rolf</p>
