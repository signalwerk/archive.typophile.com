    html: "<p>@Frank: Are you sure sfntly handles CFF? When I was playing with it last time (back in March) Brian (from the project) wrote: <em>\"[...] Currently sfntly can recognize the CFF table block but cannot take the CFF table apart or reassemble it; ie: cannot edit or subset it. We also want to subset OTF/CFF fonts so we are working on adding subsetting support for CFF but it's a biggish task and will take a while (several seasons).\"</em> I think it can read the font, but that's it really.. no real support yet.</p>"
