    html: |-
      <p>I ran the following test. I made an otf file without a UniquID (using ttx) that I named <code>unicasem.otf</code> and giving the following trace:</p>
      <p>  681 % otfinfo -i unicasem.otf<br>
        Family:              unicase<br>
        Subfamily:           Medium<br>
        Full name:           unicase<br>
        PostScript name:     unicase<br>
        Version:             Version 001.000<br>
        Copyright:           Created by Boyer Michel</p>
      <p>and I sent it to the font-face generator to get my "package". In particular I received a ttf file. Here is a trace:</p>
      <p>  692 % otfinfo -i unicasem-webfont.ttf<br>
        Family:              unicase<br>
        Subfamily:           Medium<br>
        Full name:           unicase Medium<br>
        PostScript name:     unicase<br>
        Version:             Version 001.000<br>
        Unique ID:           FontForge 2.0 : unicase : 5-8-2012<br>
        Copyright:           Created by Boyer Michel</p>
      <p>Note the UniqueID that was put into the font by the fontface generator.</p>
