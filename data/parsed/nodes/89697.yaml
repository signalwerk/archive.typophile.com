      <p>By the way, a way of learning this is to compare the evenness of color of words set in your new font to the same words in some existing fonts that you admire as well crafted. Then adjust your letters and spacing until it's as good as the model. You could compare yours to flat sided sans like DIN, for example.</p>
      <p>Again, I do think this can work and encourage you to go on.</p>
