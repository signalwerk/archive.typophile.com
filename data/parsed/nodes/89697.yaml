      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;The ‘eyeballing’ in case of type is purely relative to the underlying model. Sometime ago my Dean said that some matters [in art] can’t be deﬁned and I replied that if these can’t be deﬁned they simply don’t exist.</p>
      <p>FEB</p>
