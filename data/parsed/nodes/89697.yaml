    <p>Firstable What is auto-kerning? This can be a magical solution for me bacause im a kind of new as i said and i'm sure you all agreee with me adjusting metrics is a little bit boring in the end of design part. Actually Kerning is also is a part of design but i want to be a typographer in a way like step by step or font by font. I cant learn whole process in a short time.. I used Fontographer and Fontlab, Fontographer is like very basic for this job but it have a non-working autokerning tool i think..Is there something like that in fontlab or any other apps. i want to learn is there another auto kerning tools like this any application or any tip. I found iKern service but you should know i'm a student. And Kernmaster is also not for a student i think.</p>
    <p>Ok if theres no autokerning i have to make it with my hands..<br>
