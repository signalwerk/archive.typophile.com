      <p>William: ‘<em>Plenty of things exist that aren't defined like love. Also many things in science that were once not measurable were later measured, like voltage.</em>’</p>
      <p>I am not a physiologist, neither a psychologist, nor a physicist, but I am a type designer and a (senior) lecturer in type design for more than 25 years now. And I do know that in case of type we are talking about formalized, standardized, and systematized grapheme systems, which were inventions by mankind and not –as far as I know– provided by any God or by nature itself.<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;What type designers do, is making variants on themes, where the themes can be more loosely interpreted with an increase of point size. Much, if not everything of the métiers of the type designer and typographer can be dissected, anatomized, and described into details, including idiom. So far most attempts to mystify the ‘eye’ of the type designer I have seen, were more related to marketing than to actual knowledge. Of course, I could be wrong though.</p>
      <p>William: ‘<em>For example, has anyone successfully defined you or me?</em>’</p>
      <p>In the chapter titled <em>Introduction on Taste</em> of <em>A Philosophical Enquiry into the Origin of our ideas of the Sublime and Beautiful</em> (1757), Edmund Burke states: ‘<em>On a superﬁcial view, we may seem to differ very widely from each other in our reasonings, and no less in our pleasures: but notwithstanding this difference, which I think to be rather apparent than real, it is probable that the standard both of reason and Taste is the same in all human creatures. For if there were not some principles of judgement as well as of sentiment common to all mankind, no hold could possibly be taken either on their reason or their passions, sufﬁcient to maintain the ordinary correspondence of life.</em>’ This may not exactly deﬁne you and me, but at least it suggests that to some extent we have a lot in common.</p>
      <p>FEB</p>
