      "Some people got it, and some people don't got it."<br>
      Which I believe is true of everybody in any given aspect.</p>
      <p>Some people are not good at spacing. With enough effort<br>
      virtually any such person can become passable at it, but<br>
      if their mind doesn't "enjoy" it it might be better to rely<br>
      on somebody else, or an algorithm.</p>
      <p>&gt; kerning is just directly related to spacing</p>
      <p>This is actually why I would ideally like<br>
      to think of it <em>not</em> as a "refinement" of it.<br>
      I would even like to be able to consistently<br>
      think of the black/white within letterforms<br>
      as integral to their spacing/kerning, which<br>
      is difficult however. It's like zen.</p>
      <p>&gt; it should be not too difﬁcult to deﬁne what<br>
      &gt; exactly makes manually kerning better. </p>
      <p>But how do you quantize eyeballing?</p>
      <p>&gt; Drawing letters is the lowest form of type design.</p>
      <p>In fact it's not type design at all - it's lettering.</p>
      <p>There is indeed no type design without spacing, which<br>
      is fully half the heart of individual letterforms even.</p>
