      <p><cite>i'm sure you all agreee with me adjusting metrics is a little bit boring in the end of design part</cite></p>
      <p>No, actually. :-)<br>
      Spacing and kerning is when a font starts coming together, and really working... To me, it <em>is</em> like zen: slowly, iteratively ironing out the wrinkles, smoothing the bumps in the pattern just enough, and learning, learning to see. And that's why I'd very much disagree with James: If you want your first one(s) to be a learning experience, learning to space and kern them can teach you very much. (If on the other hand your main motivation is getting the thing out there, do look at algorithms, or other people; because really learning to do this takes some time :-), and like Hrant says, not everyone enjoys it equally.)</p>
