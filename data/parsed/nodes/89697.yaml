      <p>Hrant: ‘<em>I would even like […] think of the black/white within letterforms as integral to their spacing/kerning’</em></p>
      <p>The more I measure Renaissance type, the more I am convinced that the proportions of Jenson’s and Griffo’s roman types, and their derivatives by Garamont and consorts, were the result of standardizations and systematization’s in the production process of movable type, and that Jenson even ‘designed’ his famous roman on a grid. The spacing was deﬁned by the grid and the length of the serifs preserved the spacing. Although not speciﬁcally on this part, I already placed some info on this <a href="http://typophile.com/node/73675" rel="nofollow">topic</a>.</p>
      <p>With a standardized system for the widths a punch cutter could theoretically control the spacing of his type ‘from a distance’, and hence the quality of the complete production. If the justiﬁer/caster was aware of such a system and the type was based on it, the widths could be simply distilled from the design itself. The simplicity of such a system could be an explanation for the fact that there is no documentation on this matter preserved from the early days of typography.<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;As we all know, an incorrect spacing can ruin a typeface. The simplest possible method which might have been used by casters that I could reconstruct, is to take the n (designed on a grid) as a basis and to put just a little bit space at both sides of the serifs (the length of the serifs being based on the unit arrangement system). The resulting width can then be used for a large range of other letters and other groups of letters can be placed on widths based on parts (ranges of simple units) of the n. For instance I could distill this from Garamont’s <em>Gros Canon Romain</em> type and the related <em>Moyen Canon Romain</em> from Van den Keere in the inventory of the Museum Plantin-Moretus, which are attributed to the sixteenth century (there is no documentation on the casting of these speciﬁc types and the dating is therefore a bit uncertain; I am trying to get the C14 method applied to the alloy, but it seems that there is not enough carbon in it).</p>
      <p>Hrant: ‘<em>But how do you quantize eyeballing?</em>’</p>
      <p>The power of the human eye is purely relative to the anatomy of the things perceived. In <em>Art and Illusion</em> (Oxford, 1987 p.255) Gombrich notes on this phenomenon: ‘<em>The stimulus patterns on the retina are not alone in determining our picture of the visual world. Its messages are modified by what we know about the “real” shape of objects</em>’<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;So, a lot that we (think/want to) see is based on conditioning. Conditioning is based on conventions and conditioning preserves conventions. Thus the snake bites its own tail; to be able to use one’s ‘eye’ like Fournier advocated, one has to be educated to look at type in the same way. What is considered to be harmonic, rhythmic and æsthetic in type is merely the result of conditioning, i.e. cultural habituation.<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;The ‘eyeballing’ in case of type is purely relative to the underlying model. Sometime ago my Dean said that some matters [in art] can’t be deﬁned and I replied that if these can’t be deﬁned they simply don’t exist.</p>
      <p>FEB</p>
