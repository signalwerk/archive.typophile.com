      <p>Hrant: ‘<em>I think most people got it, but for some it's just not how their mind works.</em>’</p>
      <p>I reckon that Hrant is speaking in tongues here, because I have no idea what he is talking about. Kerning is a reﬁnement of the spacing, which is necessary because the grapheme systems in use for representing the Latin script are to some extent inconsistent. This inconsistency is caused by the fact that within the grapheme systems, like for instance roman type, characters with a different morphological background are combined. Also the rigid rectangle-based movable type paradigm is something that requires (‘optical’) corrections.</p>
      <p>If one is able to design and space the stuff, kerning should be no problem then. Perhaps deﬁning kern classes and enumerating pairs is considered tedious work, but kerning is just directly related to spacing and therefore by deﬁnition easier to generate than the spacing itself. What makes kerning complex, is that it should be done in such a way that it is reproducible. Whenever changes and/or enhancements are made to a font, new or additional kerning pairs with the same (sort of) values as that of the existing ones should be easy to generate in a fully controlled manner. Automated/parametrized kern generation makes this work easier and the outcomes more consistent. </p>
      <p>If one thinks that manually, i.e. optically, kerning is better than automated/parametrized kerning, then it should be not too difﬁcult to deﬁne what exactly makes manually kerning better. The outcomes can be used then to change the parameters in such a way that the automated/parametrized kerning results are identical to that of manual kerning.</p>
      <p>FEB</p>
