      <p>The following is a post that I have been trying to upload since Typophile went nuts over the past 2 days.  Therefore, it would make more sense if read just after Nina's post above instead of today:</p>
      <p>Frank, The digital type variation on the unit system is indeed a grid, albeit much finer than what we typically call a grid.  The proportion categories of the roman alphabet have been around for centuries so I can easily see how the "system" you refer to in your theory is quite plausible.  While I can certainly agree that an analysis could bring about some repeatable mathematical process, I don't, for the time being, see that this would be faster than what Hrant calls "eyeballing"--at least not for me.  If your latest  software, now in beta, can remove all the calculations for the user and "know" a very good outcome, this could certainly change my mind.  I guess my fear is that it would not do what I want and require adjustment, anyway.  There are several ways to set spacing/sidebearings and the kerning needs to work in consort with the spacing method.  Hopefully, there is an "open marriage" possible where by the user (marriage councilor) can keep harmony among all parties.</p>
      <p>I agree with Nina's assertion about spacing and kerning being part of the whole design journey.  I find that there are glyph drawing corrections required and part of the "tinkering process" that we call type design.  The act of spacing and fitting places a focus on what may be weaker combinations that need to be revisited in the drawing--or even {calt} substitutions of alternates.  I would be nervous about turning kerning over to a software process and missing this vital part of the process without having the ability to reteach the software to follow what I might think of as a better path.  Yes, Nina, it takes some time--I seem to be getting slower rather than faster at design with the more I learn ;-).  This experience is invaluable though.  Turning over the space/kern process to software without the ability to understand what is being done, can leave you blind to what the results should be.</p>
      <p>At any rate, I have come to agreeable terms with kerning and learned not to try and hurry through it any more.</p>
