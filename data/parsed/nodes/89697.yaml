      <p>I like the overall look of this, but I think you've got some problems in letter design that are going to cause problems in spacing and kerning. If the internal space isn't harmonious, then the spacing and kerning is never going to look right. For example, I think the leg on your L is too long compared to the other characters. The L is one of those characters that perhaps Frank was referring to that you can't totally solve, but shortening the leg a little would help. Also I wonder aesthetically about the difference between your M and N, with totally different structures, and the narrowness of the M. Also your numbers need work; they are not as good as the letters.</p>
      <p>So I think, like Thomas, that working on the spacing, but simultaneously adjusting the characters, is the way to start. Because of its design, with single case, straight sides, bent arms on the VWXY it may not need a lot of kerning, maybe none at all.</p>
