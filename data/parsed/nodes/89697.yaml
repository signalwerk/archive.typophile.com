      <p>You MUST get the spacing right before you start kerning. If you don't, you'll eventually have to throw out all your kerning and start over again. Walter Tracy's </p>
      <p>Automation? Igino Marini's ikern is the best auto-spacing and auto-kerning tool out there. Adobe InDesign's auto-kerning is second, and only useful insofar as the initial spacing of the key letters is good. Nothing else I've seen is really worth considering.</p>
      <p>If you are not using something truly automated, you need to learn about class-based kerning and use that.</p>
