    <p>I'm working on a project that's using Proxima Nova for headlines, but I've been asked to find a complementary typeface for body copy that will be set as small as 12px. I'd just as soon as stick with PN, but I'm curious if there is something that's ideal for that setting?</p>
    <p><img src="http://i.imgur.com/GQPpyzO.png" alt="font-sample"></p>
    <p>Using Typekit, if that matters.</p>
