      <p>Steve,</p>
      <p>I hope this doesn’t get buried, because I’m interested to learn more about this topic as well. The potential pitfalls of going beyond the bounding box has been discussed before. A Google search (site:typophile.com) will turn up some discussions. <a href="http://typophile.com/node/72954" rel="nofollow">Here’s one of them.</a></p>
      <p>Georgia (on my system) use these shapes:</p>
      <p>Ď ď Ȟ ȟ Ǐ ǐ Ǩ ǩ Ľ ľ Ť ť</p>
      <p>As far as I know, the accent should be centered on the base glyph.</p>
      <p>In the case of the alternate shape in d l L t, these are specific for the Czech and Slovak languages and “(…) related to these languages culture and typographical heritage. The same does not occur in other languages.” (Quote by Igor Freiberger.) Above capital L and T this shape would not make as much sense.</p>
      <p>One possible solution, that I have used for other accented letters with ascenders, is to provide an alternate version of the base glyph that is slightly lower than other ascenders, and also a slightly compressed accent.</p>
