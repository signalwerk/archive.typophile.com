      <p>I thought I had buried that image! </p>
      <p>Yes that is one of the early studies of what eventually became Trilby. The version I released was chilled out a lot, but there's something here (especially in the italic) that I hope I can come back to if I take another stab at a reversed stress face. I forget what the status of this font is, but as Kent said, feel free to get in touch if you are interested in it or any of my other work.</p>
      <p>Have you seen Novarese's Estro? Not sure what the digitizations are like, but I love it. Then there are more playful Cowboy-ish fonts like the recent <a href="http://www.hvdfonts.com/" rel="nofollow">Cowboyslang</a>.</p>
      <p>Regarding the term 'French Clarendon': Looking at the marketing copy, Audebaud appears to be a 'Clarendon that is French', while the faces that I took inspiration from were 19th-century wood types called 'French Clarendons'. I think these tended to be of British/American origin, reversed stress, bracketed, and usually condensed. There are some examples of <a href="http://www.utexas.edu/cofa/a_ah/rrk/antiqueclarendonmenu.php" rel="nofollow">French Clarendons</a>, and <a href="http://www.utexas.edu/cofa/a_ah/rrk/antiqueegyptianmenu.php" rel="nofollow">French Antiques (without bracketing)</a> on the excellent Rob Roy Kelly Collection site.</p>
      <p>I'm no classification expert, and I wasn't trying to make a statement by calling Trilby and Manicotti 'French Clarendons'. It just happened to be the label for the sources that I used as a jumping off point for these projects. I've spoken with people who refer to the whole mess as 'Italian', though this makes me think specifically of the super-backwards, high-contrast <a href="http://woodtyper.com/wp/uploads/2009/09/caslon-italian.gif" rel="nofollow">Caslon's Italian</a>, and related <a href="http://moderntypography.com/Typedesign/Classics/CaslonItalian/index.html" rel="nofollow">revivals</a>/<a href="http://vllg.com/Village/Arbor#panel=poster" rel="nofollow">reimaginings</a>. So I'm not sure if any of these are 'accurate' terms, but I guess they'll have to do in a pinch.</p>
