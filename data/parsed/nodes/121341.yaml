    html: |-
      <p>It most certainly is hand drawn.<br>
      If an existing typeface was the model, someone could come up with a match.<br>
      In the meantime, looking for “railway” at MyFonts, brings some interesting results.<br>
      Perhaps unsurprisingly, Western Railway (<a href="http://www.myfonts.com/fonts/jnlevine/western-railway/" title="http://www.myfonts.com/fonts/jnlevine/western-railway/">http://www.myfonts.com/fonts/jnlevine/western-railway/</a>) has a similar flavour to the words (it needs some condensing for “Municipal”), while something from Greater Albion Typefounders (<a href="http://www.myfonts.com/fonts/gatf/birmingham-new-street/" title="http://www.myfonts.com/fonts/gatf/birmingham-new-street/">http://www.myfonts.com/fonts/gatf/birmingham-new-street/</a> <a href="http://www.myfonts.com/fonts/gatf/great-bromwich/" title="http://www.myfonts.com/fonts/gatf/great-bromwich/">http://www.myfonts.com/fonts/gatf/great-bromwich/</a>) could give you the |F|.</p>
