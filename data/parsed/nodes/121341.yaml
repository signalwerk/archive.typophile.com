    html: <p>Some of the serifs, and especially the |A|s have a Latin shape (<a href="http://www.myfonts.com/search/latin/" title="http://www.myfonts.com/search/latin/">http://www.myfonts.com/search/latin/</a>), which, I think, make them optically better suited to be placed on an arc.</p>
