      <p>Hanging stuff is often indeed taken so far that it looks wrong. To me, putting quotes completely outside the paragraph block is a design affectation. The reason to hang puctuation is to reduce gaps; causing a proportional black spec in the other direction is not a solution. So there has to be balance, visually. Basically, people aren't even supposed to notice anything is going on at all, much less bother to form opinions that it's "right" or "wrong".</p>
      <p>hhp</p>
