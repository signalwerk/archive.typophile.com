      <p>There are a few threads that tackled this subject.</p>
      <p>Jason's <a href="http://typophile.com/node/12883" target="new" rel="nofollow">A Typographer's Checklist</a> reviews several refinements in detail.</p>
      <p>Nick Shinn's <a href="http://www.shinntype.com/Assets/Depts/Essays/DigginIt.pdf" target="new" rel="nofollow">DigginIt (pdf)</a> in inspirationally informative for typographers.</p>
      <p>Hanging puctuation has several levels of implementation and means different things to different designers. All forms of punc refinement was integral to the "house style" when I was in charge of advertising at Compugraphic/Agfa Type Division many years ago. We were trying to impress the high-end typography market, so all of the work had to be exemplary. </p>
      <p>I rarely see such diligence of this level in today's print, and yes, most consider it to be a violation as opposed to a refinement.</p>
      <p>---------------------------------------------<br>
      Yes, I'm old, that's why my punc is hanging!</p>
