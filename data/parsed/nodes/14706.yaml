    html: |-
      <p>Gutenberg Bible hangs hyphens, but they're much lighter in weight, and hyphens hang on the right side, which is usually not the dominant edge of a paragraph (but it could be).</p>
      <p>I think hanging looks great in headlines, callouts, quoting poetry, or some other special type treatment (which is almost always in larger type sizes). However, with regular text sizes, just because of the shape of the character, you either have a space going in or a mark going out. It's anyone's opinion as to which is the stronger line. If one can ignore the mark, why not ignore the space?</p>
      <p>Even in larger text sizes for paragraphs, say a children's book or information for elderly, you usually won't need to hang punctuation. The example below is an extreme case of what could happen with quotes. In 13 pt text (ugh) I increased paragraph indents from my usual em to 15 pts, so that the indents stand out when quote marks on following lines or quotes at the beginning of following indented lines occur. Even when it's a combo of quote-W, a little kerning is pretty much all you need. There's been times I did hang indents that started with a quote mark, (like the "Eu in the example) but if you do, just be consistent throughout the entire text.</p>
      <p><a href="http://mywebpages.comcast.net/brian912/linked/typoImages/Untitled-1.html" rel="nofollow">quick example (century school infant, not shown at actual size of 13/18)</a></p>
