    <p>I'm having a lot of trouble with getting people to understand the importance of hanging bullets and punctuation. I'm pretty good at talking about design, but for some reason I keep hitting a wall on this topic. The strongest opposition to them is that "not used to seeing hanging bullets, they look like an error."</p>
    <p>Could anyone help me out with some talking points and logic so that I can make a good argument for them?</p>
    <p>thanks,<br>
    Randy</p>
