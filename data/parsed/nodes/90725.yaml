      <p>When I read or think about this, I cannot help but turn to two things: what I know about modern lingustics theory - Chomsky's notion of "deep structure" - and it's counterpart in musical tonality made possible by the twelve-tone "well-tempered" tuning system.<br>
      Bottom line: I might be missing something, but why would the "eye of the designer" lead somewhere other than the way the technology would ordinarly tend to evolve over time in the hands of technicians? Is there a mutual exclusivity that I'm missing?</p>
      <p>Could it not be that the "eye" is not mythical? That it exists in the DNA of both designer and technician?</p>
