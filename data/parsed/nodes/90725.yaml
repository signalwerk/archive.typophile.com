      <p>Guided not by the eye, but by the heart as the supreme judge, I would say — following the beat.<br>
      It’s easier to write to a steady rhythm, just as it is easier to create a mechanical system of interchangeable parts according to standardized units of measurement.<br>
      Perceptually, too, a regular grid provides a benchmark or matrix against which variations acquire significance.</p>
      <p>These general considerations of regularity precede any deterministic effects related to specific technologies.</p>
