    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Gros_Canon_Romain_units_6160.jpg"></div><p></p>
    <p>Since 2007 I am doing a PhD research at Leiden University, of which the title is <em>Harmonics, Patterns, and Dynamics in Formal Typographic Representations of the Latin Script | The regularization, standardization, systematization, and unitization of roman type since its Renaissance origin until the Romain du Roi</em>. Over time I have posted some info on my research on this forum, and now there is a <strong><a href="http://www.lettermodel.org" rel="nofollow">dedicated blog</a></strong> with related fragments, mostly presented as ‘notes on’. </p>
    <p>The question on which my research is meant to ﬁnd an answer, is whether –and if so, to which extent– the harmonics, patterns, and dynamics of formal grapheme systems in use to represent the Latin script since the invention of movable type, are the result of standardizations and systematizations of the production process of Renaissance printing type (centuries before documented regularizations were applied on the Romain du Roi).</p>
    <p>This research comprises some controversial aspects, because it questions the myhical ‘eye’ of the type designer. The skills of type designers have been mystiﬁed since the early days of punch-cutting. For instance Pierre Simon Fournier emphasized the role of the ‘eye’ in his <em>Manuel Typographique</em> from 1764–1766, when he criticized the attempts of Jaugeon and his colleagues to standardize the design of the Romain du Roi: ‘<em>These gentlemen would have been well advised to a single rule which they established, which is chieﬂy to be guided by the eye, the supreme judge […].’</em> But my measurements of French Renaissance type from the inventory of the Museum Plantin-Moretus in Antwerp seem to provide ample proof for the hypothesis that the structures and patterns of roman type ﬁnd their origin for a large part in standardizations of the production process of movable type during the early days of typography. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/LetterModel_strokes_1_5963.gif"></div><p></p>
    <p>My research also questions to which extent handwritten letters played a role in the development of roman type. Is it possible that the writing models currently in use to educate the basics of type design, which are often related to Edward Johnston’s ‘Foundational hand’, and used to prove that roman type ﬁnds its origin in the patterns and structures of writing, actually show a standardization that was the result of the production process of the archetypes by Nicolas Jenson and Francesco Griffo? If this turns out to be the case, then the writing models are used for circular logic.</p>
    <p>Currently the site index contains:</p>
