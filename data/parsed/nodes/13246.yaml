      <p>Adobe’s is identical to Linotype’s. If you are at all familiar with the old display versions (say, from an old Letraset catalog or headline setting machine or even the metal foundry version), you may notice that it looks different. This is because Linotype’s version was designed primarily for text setting (although you could set it larger on their machines).</p>
      <p>The version that most closely matches the original Helvetica display sizes is URW’s <a href="http://www.urw.de/cgi-bin1/dalcgi/english/schnellsuche.htd?searchchar=helvetica" target="_blank">Nimbus Sans</a>. They don’t have a license to use the name, but it’s the most faithful version of the display version in digital format.</p>
