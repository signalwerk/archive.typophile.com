    <p>I know the following question has been posted innumerable times on Typophile, so I apologise in adavance, but...</p>
    <p>I wanted to know which foundry has the best cut of Helvetica, by “best” I mean loyal to the original design.<br>
    I have Adobe’s Helvetica and am assuming it is a butchered version, is Linotype the closest?</p>
    <p>Thanks.</p>
