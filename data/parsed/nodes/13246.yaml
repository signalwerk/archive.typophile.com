      <p>Here is a comparison of the early Linotype Helveticas and the original Haas version:</p>
      <p><a href="http://www.marksimonson.com/Helveticas-compared.gif" title="http://www.marksimonson.com/Helveticas-compared.gif">http://www.marksimonson.com/Helveticas-compared.gif</a></p>
      <p>The differences are most visible in the e and a.</p>
      <p>In the top four you can see the source for the Linotype/Adobe version. The bottom two differ slightly, so you can see there were differences in the various point sizes that were cut in metal. The very bottom one is the version that was usually seen in display type before digital type took over, and the one URW sells as Nimbus Sans D.</p>
      <p>There is a third version, Helvetica Neue. This was created by Linotype around 1980. It’s supposed to be an improvement, and in many ways it is, particularly in terms of consistency of letterforms between weights. But it is even more different from the Haas original than the earlier Linotype version. I think it lacks some of the roundness that the original had.</p>
      <p>Clearly, some versions of Helvetica are more “authentic” than others. The original display version was designed for display use, so I would use that one for a poster if I could. Ultimately, it’s pretty subjective.</p>
    html_clean: |-
