      <p>Removing nodes in FLS is a lot better than it used to be in previous versions of FL, in which removing even a single node would often result in major outline distortions. In FLS there are still plenty of annoyances, though:</p>
      <p>Removing nodes individually usually works differently (and better) than removing a bunch of nodes all at once. This means one needs to carefully select and delete nodes in sequence, trying to guess from experience what order will result in the least distortion and extra editing.</p>
      <p>Removing a start point results in a straight line, even if the start point had a curve on both sides. This means one needs to redefine the start point to somewhere else on the outline before removing nodes.</p>
