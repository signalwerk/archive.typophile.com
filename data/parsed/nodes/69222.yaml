    <p>I've made a couple of quick videos to show the difference in editing between Fontographer and FontLab. FontLab has so much more power than Fontographer, so I'm not complaining overall. But I AM frustrated by some of the actual drawing/editing behaviors.</p>
    <p><a class="freelinking external" href="http://www.typesetit.com/video/fog-demo.mov" rel="nofollow">In this first video</a>, I show how I use Fontographer to connect two letters to make a ligature. In this case, I used the "r" to the letter "k."</p>
    <p> I began by removing the overlap of two paths, then using the merge tool to get rid of unwanted nodes. With Fontographer, the interpretation of that merge is so much more intuitive with regard to what I want it to do. The amount of editing is limited.</p>
    <p><a class="freelinking external" href="http://www.typesetit.com/video/fl-demo.mov" rel="nofollow">In this second video,</a>, I perform the identical task of making the same ligature. But what happens in FontLab with regard to the merge (in FontLab, the delete button does the same task as Merge in Fontographer) is a bit frustrating. Its interpretation of what I want it to do is different and requires more editing on my part. </p>
    <p>With this simple task demonstrated in the two videos, I'm able to perform more than three times faster in Fontographer than in FontLab.</p>
    <p>QUESTION: Is it that I am just very accustomed to how Fontographer works, or is there something I could do differently in FONTLAB that would make this process easier (and, more like how Fontographer performs)? </p>
    <p>Or is my interpretation that Fontographer is more intuitive a correct one?</p>
    <p>P.S. I hope the videos explain what I mean... I didn't want to have to try explaining by typing all of the steps out.  :)</p>
