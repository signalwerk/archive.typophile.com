      <p><cite>Removing a start point results in a straight line, even if the start point had a curve on both sides.</cite></p>
      <p>As someone pointed out above, this problem can be avoided by using the Erase Tool instead of the delete key. You can also left-right-click the node, which retains the curve even if it is a start node.</p>
