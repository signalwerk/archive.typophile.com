      <p>I guess I messed up... I edited my original remarks and added the video stuff.... now some of these threads won't make sense to new viewers.  My apologies.</p>
      <p>BELOW is the original POST of this thread:</p>
      <p>Adam Twardock mentioned in another thread:</p>
      <p><em>I've checked and Fontographer 5.0 (soon to be released) behaves the same way as the Type 1 spec and the same way as FontLab Studio.</em></p>
      <p>Cool. I know and understand that FontLab is far more popular and powerful a tool than Fontographer, but I'm looking forward to the release and intend to get it. </p>
      <p>I've been using FontLab exclusively since I got it about 7 weeks ago. And while I've learned a great deal, and recognize the overall superiority, there are things about how FontLab functions that simply put, are inferior to Fontographer from my point of view. It's probably more a matter of my being used to Fontographer, as I have used it since 1988. </p>
      <p>In fact, over the years I often found myself using Fontographer to do work that most people would do in Adobe Illustrator. I simply liked Fontographer's drawing methods better than Illustrator. It seems to be so much more intuitive.</p>
      <p>There are definitely things I like about FontLab over Fontographer, but my hope is that Fontographer's upgrade will incorporate some of those features FontLab has with the already good features of Fontographer.</p>
