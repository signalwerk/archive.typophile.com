    html: |-
      <p>I <em>like</em> the phallic one. The elements are blended into one visual object, as it should be in a logo, and there's a feeling of movement, of informality, and of fun.<br>
      The monochrome gray is boring, but it's easy to experiment with different color schemes. Since the letters are all simple shapes with broad strokes, you might even try filling some of them with photos or artwork that articulate the blogger's theme.</p>
