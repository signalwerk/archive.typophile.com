    html: "<p>I like the very first concept you posted, although it would need some work. In the more recent \"I do\" batch, I like #1 the best, although the line spacing bothers me a bit (I like to see lines 1 and 2 closer together, but the ascender on the \"d\" creates a problem). Don't think I'd agree with comment about being too vertical; that one looks more squarish to me than vertical.</p>"
