    html: <p>I know. This is what drew me (pun not intended, lol) to this type of art style; the ability to express whole volumes in a few black lines. My own strips have never met with the kind of success as Schultz, but I will always enjoy doing them because they are fueled by my love of the craft (as well as those who craft them).</p>
