    votes: null
    html: <p>Little Chicago was my first strip I ever created. Originally I had created a character called <a class="freelinking external" href="http://dougcloud.net/show/hopps.gif" rel="nofollow">Hopps</a> - a bullfrog - and the rest of the characters I just developed over time. These are a group of critters who all live in a large park in the middle of the Windy City. I used to draw out these strips in pencil and then ink them with a black Flair pen. You may view one of these old strips <a class="freelinking external" href="http://dougcloud.net/show/littlechicago.jpg" rel="nofollow">here</a>. This was the first of my cartoon strips I scanned into Photoshop and colored. D. C. Wayne is my pen name; a take on my actual name just with the letters switched around. I always liked names with initials (J. R. R. Tolkien, for example).</p>
