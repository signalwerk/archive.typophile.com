    <p></p><div class="imageWrap"><img src="http://typophile.com/files/compeanuts_6237.jpg"></div><p></p>
    <p>This is the comic that changed my whole life as a kid and gave me the desire to be a cartoonist myself. This is a fitting tribute to one of the great comic strip artists of our time ....</p>
    <p>"Canadian cartoonist <a class="freelinking external" href="http://www.drawnandquarterly.com/artStudio.php?artist=a3dff7dd55a576" rel="nofollow">Seth</a> (Gregory Gallant) has quietly joined the ranks of über book designers such as Chip Kidd, having recently designed raconteur Stuart McLean's Vinyl Café Diaries and the much-anticipated, definitive, 25-volume reissue of The Complete Peanuts. Seth spent a decade editing, designing and illustrating this petite book, and his postmodern retro aesthetic is evident everywhere, from the tall, stylized deco script on the bottle-green stamped cloth cover to his trademark font, hand-lettered chapter titles, illustrations and drawings throughout. As a result, Bannock resembles a vintage elementary-school primer."</p>
