    html: |-
      <p>So do I. Any cartoonist worth his mettle does his own lettering by hand. The lettering is a talent as much as the drawing is. I remember my first job as an entry level drafter fixing all the company's technical illustrations and doing all the lettering by hand. It came naturally to me, just like lettering my own comics does. It's an inborn ability just like the drawing. Also cartoon style fonts are as much an art form as any other font (and I'm not speaking of Comic Sans MS). My favorite sites for finding cartoon fonts are <a class="freelinking external" href="http://www.blambot.com/fonts.shtml" rel="nofollow">Blambot</a> and <a class="freelinking external" href="http://www.comicbookfonts.com/home.html?sid=0001zm1QUkEia2ErQk4p0q8" rel="nofollow">Comic Book Fonts</a>.</p>
      <p>I love being a cartoonist and I love being a part of that field because no matter how bad a day I'm having cartoons can always make me smile :)</p>
