      <p>I loved Peanuts as a kid -- even though I did not become a cartoonist, I think it had a pretty big influence on me. I would draw my favorite characters from the strip, and was fascinated with Snoopy's novel-in-progress, which always began, "It was a dark and stormy night."  :-)</p>
      <p>With this collection, Seth and Fantagraphics have done Schulz proud.</p>
