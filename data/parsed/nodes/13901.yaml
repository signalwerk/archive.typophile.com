  html: |-
    <p>Maybe my question has been asked somewhere else already, but search not beign available yet...</p>
    <p>Is there a way, either from Fontlab or from a script (maybe robofog?) to have a list of all the glyph combinations possible. Lets say an output to a txt file.</p>
    <p>For instance, I’m currently working on a 620 glyphs font and would like to quickly check out all the possible miss matches in the metrics and kerning. I’ve used the KernKing by Mr Cabarga but I’ve yet many more glyphs that are not covered in there.</p>
    <p>Thanks in advance!</p>
