    date: 2010-03-11T07:49:00
    date_raw: 11.Mar.2010 7.49am
    votes: null
    html: |-
      <p>It's what I would class as a Bauhaus-style font, of the <a class="freelinking external" href="http://www.bowfinprintworks.com/BauhausFaces4.html">Oblong kind</a>. Tantalus, with its alternate (from T-26), is sort of similar, but there are differences. Your sample's 'a' could have been made from the Tantalus 'o'(almost), but still the s and r are not the same in either face. I suppose it might be a customization of Tantalus, but more likely it's a new font I haven't met yet.</p>
      <p>- Mike Yanega</p>
