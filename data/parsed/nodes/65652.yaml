    <p>The "Adobe Type Library Reference Book" (of which I bought the German edition in this week) contains numerous typefaces, which Adobe declares to be of unknown designers.</p>
    <p>Here is a list of the "unknown" typefaces:</p>
    <p>With answers supplied by Typophiles:</p>
    <p>1.	Clarendon - Hermann Eidenbenz (1953)- agisaak<br>
    2.	Dorchester Script<br>
    3.	Ehrhardt<br>
    4.	Falstaff<br>
    5.	Fette Fraktur - Johann Christian Bauer - Fontgrube<br>
    6.	Flyer<br>
    7.	Gazette - Edwin Shaar (1977) - agisaak<br>
    8.	Gothic 13<br>
    9.	Monotype Grotesque - Frank Pierpont (1926)- agisaak<br>
    10.	Helvetica Rounded<br>
    11.	Horley Old Style - F. Pierpont (1925)/Robert Norton (1977) - agisaak<br>
    12.	Inflex<br>
    13.	Monotype Italian Old Style - F.W. Goudy (1911) - agisaak<br>
    14.	Latin - Will Carter (1935) - agisaak<br>
    15.	Maximus - Walter Tracy (1967) - agisaak<br>
    16.	MICR<br>
    17.	Monotype Modern<br>
    18.	Monoline<br>
    19.	Monotype Old Style<br>
    20.	Old Style 7<br>
    21.	Palace Script<br>
    22.	Raphael<br>
    23.	Rockwell - Frank Pierpont (1934) - agisaak<br>
    24.	Runic<br>
    25.	Monotype Scotch<br>
    26.	Monotype Script<br>
    27.	Serlio<br>
    28.	Spartan<br>
    29.	Wittenberger Fraktur</p>
    <p>Does nobody know the designers of these typefaces?</p>
    <p>How come that Adobe attributes most of these typefaces to Monotype, although Adobe does not know the designer of these typefaces?</p>
