    votes: null
    html: "<p>Don't know this Devil Breeze but I'm afraid it's a blatant <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/itc/avant-garde-gothic\" rel=\"nofollow\">Avant-Garde Gothic</a> rip-off. And actually, this sample all looks like Avant-Garde Gothic using some stylistic alternates and ligatures: <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/itc/avant-garde-gothic/std-book/glyphs.html#glyphs/540757/356\" rel=\"nofollow\">UT</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/itc/avant-garde-gothic/std-book/glyphs.html#glyphs/540757/342\" rel=\"nofollow\">NT</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/itc/avant-garde-gothic/std-book/glyphs.html#glyphs/540757/302\" rel=\"nofollow\">V</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/itc/avant-garde-gothic/std-book/glyphs.html#glyphs/540757/292\" rel=\"nofollow\">M</a>. Birth of A Hero is also a (illegal?) roughened version of Avant-Garde Gothic... Better go with the original...</p>"
    html_clean: "<p>Don't know this Devil Breeze but I'm afraid it's a blatant <a class=\"freelinking external link-external\" href=\"http://www.myfonts.com/fonts/itc/avant-garde-gothic\" rel=\"nofollow\">Avant-Garde Gothic</a> rip-off. And actually, this sample all looks like Avant-Garde Gothic using some stylistic alternates and ligatures: <a class=\"freelinking external link-external\" href=\"http://www.myfonts.com/fonts/itc/avant-garde-gothic/std-book/glyphs.html#glyphs/540757/356\" rel=\"nofollow\">UT</a>, <a class=\"freelinking external link-external\" href=\"http://www.myfonts.com/fonts/itc/avant-garde-gothic/std-book/glyphs.html#glyphs/540757/342\" rel=\"nofollow\">NT</a>, <a class=\"freelinking external link-external\" href=\"http://www.myfonts.com/fonts/itc/avant-garde-gothic/std-book/glyphs.html#glyphs/540757/302\" rel=\"nofollow\">V</a>, <a class=\"freelinking external link-external\" href=\"http://www.myfonts.com/fonts/itc/avant-garde-gothic/std-book/glyphs.html#glyphs/540757/292\" rel=\"nofollow\">M</a>. Birth of A Hero is also a (illegal?) roughened version of Avant-Garde Gothic... Better go with the original...</p>"
