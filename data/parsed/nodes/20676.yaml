      <p>Enjoying these anecdotes, and thought to add one in keeping with the general tone of the responses.</p>
      <p>Recently I finished reading a very well written book, “Book Typography” by Ari Rafaeli. There are many historical examples of types attributed to the wrong original designer. Much of the drama of early type is determining who did what. My favorite from the book is the story of Monotype Ehrhardt. Seems the original designer, a Nicholas Kis from the Holland, left town and ended up in Poland (c1680). He tried to sell his matrices to Edling Type Foundry. Edling thought Kis’ work amaturish and declined to purchase the matrices. Kis left the matrices with Edling while he scoured the area for a buyer.</p>
      <p>Unfortunately for Kis, he was arrested by the king. He was later released on the condition he promise to never bring invading armies into Poland again. Seems the King blamed Kis for his recent political troubles. </p>
      <p>Kis left town and abandoned the matrices. They stayed with the Edling Foundry, passed on as companies were sold and acquired. Ultimately the matrices ended up with Stempel who issued a version from the original. The kicker for Kis is they attributed the design to Janson (Edling’s mentor/master) who was not there when Kis first arrived at Edling’s Foundry.</p>
      <p>Cheers!<br>
      LTL,<br>
      Xtian</p>
