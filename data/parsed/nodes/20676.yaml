      <p>There’s this story about Alexandre Wollner visiting Herb Lubalin in New York. He says:” H.Lubalin had this three-floor office in N.Y. The main room was as big as Alexandre Wollner’s house with tables covered with sweets and chocolates. Wollner asked him what the room was for and how he managed all the luxury when he (Wollner) back in Sao Paulo couln’t even dream of having such an adequate room. He replied:” I’m going to tell you a secret: on the first floor there’s a room full of people working, but they only do retail down there, which I don’t show to anyone and which doesn’t appear in any book. We make a lot of money there. On the 2nd floor we produce pubblications of a slightly higher level:some adverts, but mostly magazine page spreads, medical pamphletes, and these make reasonable money. I don’t publish this stuff anywhere either. Then there’s is this room here where I do the things you see; the Avant garde alphabet, Eros magazine etc. These don’t bring in a dime, they just cost money. It’s the 1st floor that sustains the other 2. I don’t know if this is the sort of anecdotes you are looking for but I’ve found it cool because now, when I visit some super high profile studio (not that I do this a lot...) I always think about the secret floors.<br>
      The story is from Alexandre Wollner published by CosacNaify in Brazil (a project by Andre Stolarski)</p>
