      <p>Ed Benguiat told me this years ago (and he has so many stories it’s hard to confirm the “truth” of it or not... but I believe him ;-P )</p>
      <p>Many, many years ago, Ed had worked on some logo designs for El Al, based on a stylized manora. El Al decided not to use the designs, so Ed shelved them. (Actually, he put them into his famous “drawer” of ideas and sketches.)</p>
      <p>A few years later, United Airlines was looking to update their logo. Ed pulled out the El Al manora, deleted a few of the candelabra arms, and came up with the logo below —<br>
      </p><div class="imageWrap"><img src="/web/20071009174630im_/http://typophile.com/files/UAL-logo2_5394.gif"></div><p></p>
