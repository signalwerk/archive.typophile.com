    html: <p>My first agency job was in an agency arranged just like Lubalin’s. Top floor was for the management and grand meeting rooms, middle floor for higher grade designers with less luxury, ADs etc and the bottom floor (where I was, a trainee) had the production department (newspaper ads for department stores and shoe shops etc) with all the left over furniture. One morning I went to the office to find my chair missing. I never found it, someone higher up must have needed it.</p>
