    <p>Hello all,</p>
    <p>I’m busy collecting anecdotes in relation to type or to a specific letter. I know there must be loads, but they are hardly listed in any Typography book. Does anyone know any funny, interesting, exciting stories? It could also be a surprising type-historical fact.</p>
    <p>I love this one for example:<br>
    <a href="https://web.archive.org/web/20071009174630/http://www.worldnetdaily.com/news/article.asp?ARTICLE_ID=21501" title="www.worldnetdaily.com/news/article.asp?ARTICLE_ID=21501">www.worldnetdaily.com/news/article.asp?ARTICLE_ID=21501</a><br>
    This story is about a Sabotage act in the White House which apparently happened shortly before George W Bush and his staff moved in. Apparently the former staff made a practical joke and removed as many “W” keys from all the keyboards in the White house as they could.</p>
    <p>Thanks sharing any more stories!</p>
    <p>Fox</p>
