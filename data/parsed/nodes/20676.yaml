      <p>You believe Benguiat? Okay (well, Ivan Chermayeff used to do the same thing). And I think you’ve all already heard the Chase logo story—I posted it some years back. </p>
      <p>Okay, I’ve got two I love (sorry so long):</p>
      <p>1. In the pre-desktop days, I used to give Photolettering a lot of business and Sid Haber would take me to lunch sometimes. One time, he told me that he started as a young man as a linotyper, and one night, he had a blind date. It was love at first sight! He knew he was going to marry this girl. He said he was so excited, that he had to set some type. So he took her up to the shop and and set “I love you,” and put it in her hand. And it burned her! And they got married and she still had the scar on her hand.</p>
      <p>2. Right out of school, I had the great privilege of interviewing with Herb Lubalin to be his assistant on U&amp;lc. Well, it turned out that I interviewed him. I spent all day with him and he showed me and reminisced about all his favorite work. When we got to the PBS logo (the “P” as a head), he was infurated . . . he said that PBS used it for a while, everything was fine and then they decided it wasn’t good that the face was facing LEFT. So they gave it to Chermayeff &amp; Geismar to rework and Lubalin said they just basically stole his logo and just turned it around.</p>
      <p>Well, 20 years later, I’m at Chermayeff &amp; Geismar and told Tom Geismar the story and Tom loved it and said Herb was crazy and PBS approached him to rework the logo to show they were a corporation of many public stations—not just one. And it worked better facing right.</p>
      <p>I believe them both. (p.s. I got the job! But Lubalin died a week later ;( )</p>
