      <p>Mark Simonson created one of the most popular handwriting fonts ever made: <a href="https://web.archive.org/web/20071009174630/http://www.ms-studio.com/FontSales/felttiproman.html">Felt Tip Roman</a>. It’s a close digitization of his own writing. </p>
      <p>He told me once he knew he had arrived as a type designer when he received one of those direct mail pieces in which they try to fake real handwriting to make it seem more personal. They used Felt Tip Roman. It was like getting a postcard from himself.</p>
