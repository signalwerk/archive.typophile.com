      <p>One of the most famous incidents and misquoted-quotes involved Frederic Goudy in 1936 at an award ceremony in his honor. The result after viewing the award certificate he uttered —<br>
      <em>“Anyone who would letterspace <strong>blackletter</strong> (“lowecase” is substituted nowadays) would <strong>shag</strong> (“steal” is more commonly quoted) sheep.”</em></p>
