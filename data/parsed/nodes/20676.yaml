      <p>&gt;Looking at the letterfrequency of the English language, the most used character is not “E” as it’s mostly believed (11.2%) but the actual “Space” character (13.2%). </p>
      <p>That sounds fishy - since when did the space become a letter? It’s hardly even a character. This is exactly the same as saying the hole is the least filling part of a doughnut.  </p>
      <p>But in the spirit of this discovery I nominate ’2pt leading’ as the most used ’letter’ in the English language, so many books include this invisible letter above, or below, each character printed in the book.</p>
