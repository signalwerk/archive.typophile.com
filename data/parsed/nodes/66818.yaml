      <p>I think the important point is not whether the use of Pinyin  will become extensive and common or not. (I agree with you that its distribution is likely to be limited, though perhaps surprisingly large.) Learners can be expected to be somewhat familiar with Pinyin, and will occasionally encounter a situation where they may feel its use is important. In those situations, font designers are obligated to at least think about the results of Pinyin diacritic combinations, whether they bother to support them or not.</p>
      <p>Font designers do not generally make fonts for use in random, one-off situations, at least not when designing fonts for commercial use. A good font is instead designed to be functional and convenient for the largest variety of possibilities within the designer’s capabilities and the design’s restrictions. This is a hard idea to characterize precisely of course, but it is intuitively easy to grasp: make your work fit as many possible circumstances and uses as is within your means to support.</p>
      <p>My point is that if a font designer bothers to include the various European diacritics in a font, then they should consider the uses that an imaginative user might subject the font to. Deciding whether to support these uses is of course a separate decision, but a reasonable designer should at the very least ponder the possibilities. The large and increasing number of Mandarin Chinese learners – and occasionally native speakers –&nbsp;who have some interest in Pinyin behooves font designers to at least consider the possibilities inherent. Of course it’s still up to the individual designer whether they bother to invest the effort or not.</p>
    html_clean: |-
