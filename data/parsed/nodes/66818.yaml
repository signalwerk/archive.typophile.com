      <p>An early 21st century solution to the ogonek clash might be to use wider tracking throughout the text. I haven’t a clue how the early 20th century printers managed it, but most of what I’ve seen in Athabaskan texts is actually pretty good.</p>
      <p>I agree that the Scotch Modern a-ogonek is a disaster. I’ve seen examples where the ogonek was hung in the middle, which is antithetical to Eastern European typography, but can be acceptable for Athabaskan uses given careful design. Of course there are other occasions where they used a cedilla instead...</p>
      <p>Any font aiming to support the majority of European languages should also try to handle the Pinyin occurrences. The demand for such support will only be increasing with time, and seeing the good support for various European diacritics would lead most users to expect the Pinyin ones to work reasonably well too.</p>
