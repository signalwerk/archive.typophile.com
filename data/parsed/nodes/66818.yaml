      <p><cite>Romanized Chinese</cite></p>
      <p>Tone marks are conveyed in Hànyǔ Pinyin using the following glyphs:</p>
      <p><code><br>
       ā ē ī ō ū ǖ<br>
       á é í ó ú ǘ<br>
       ǎ ě ǐ ǒ ǔ ǚ<br>
       à è ì ò ù ǜ<br>
      </code></p>
      <p>The only letters from your collision list that could precede these are FPTWYft. Not all potential combinations exist in Pinyin, but I reckon most do.</p>
    html_clean: |-
