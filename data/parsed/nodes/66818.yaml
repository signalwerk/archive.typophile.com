    html: "<p>Omitting tones from romanized Chinese is not very different from leaving the accents off caps in French: a custom arising from the character-set limitations of typewriters (in the case of French) and 1-bit fonts.  A great deal of sinological work still doesn't bother with tones, but it is reasonable to hope that usage will increase as the number of fonts with Unicode <em>pīnyīn</em> continues to grow (in 2008 <a href=\"http://blogs.adobe.com/typblography/2008/08/extended_latin.html\" rel=\"nofollow\">Thomas Phinney</a> reported they are included in Adobe Latin 4).  Sinology may be coming around: for example, in 2008 the University of Chicago press included tones in Sigrid Schmalzer's <a href=\"http://www.press.uchicago.edu/presssite/metadata.epl?mode=synopsis&amp;bookkey=5780990#\" rel=\"nofollow\">The People's Peking Man</a> -- where there is a noticeable difference in type color between pages with lots of <em>pīnyīn</em> versus those without.</p>"
