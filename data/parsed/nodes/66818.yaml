      <p><cite>On a related note, is it better to kern and prevent collisions or just let them occur? </cite></p>
      <p>Think of type as an artifact of Guttenberg's promotion of the printing press rather than the photocopier. On that model, it is better to design ligatures to solve crashing problems that would be avoided by the skilled scribe.</p>
      <p>* * *</p>
      <p>I don't know how much the font designer is responsible, esp. for Native American language combinations. To add to the list above, Kiowa uses macrons above and below vowels. The combination i+macronbelow, f, i+macron does occur. Of course, the editor wants the word in italic. "Crash" isn't strong enough to describe such a mess. I know this the usual way; I had to set it. The solution was to draw several f-ligatures to work with the various vowels. I'd say the designer can't anticipate all such occurrences; what they can do is to have a EULA that permits the compositor to go into the font and do the needed work.</p>
    html_clean: |-
