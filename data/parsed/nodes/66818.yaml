      <p>I put together a 6MB text file containing newspapers and Wikipedia articles from European languages and a few others I had listed above. I also Googled each pair just to see what came up. I assumed FPKTVWYft are the only letters at risk for accent collision. Lowercase t is an unlikely risk but I've made some strange lowercase tees before. In small cap fonts you might want to check more A accent pairs.</p>
      <p>I don't think any capital accents are collision risks.</p>
      <p>ći éî fā fă fã fè fë fē fì fî îè ît íč íň íř íš íž ši šī št tă tã úř žī Fā Fă Fã Fè Fë Fē Fì Fî Kā Kī Kř Kū Pā Pă Pã Pè Pë Pē Pě Pì Pî Pï Pī Pň Př Pū Pž Tå Tā Tă Tã Tè Të Tē Tĕ Tě Tī Tř Tš Tū Tž Vā Vă Vã Vë Vē Vě Vî Vī Vš Vž Wå Wā Wè Yā Yã Yū</p>
      <p>'à 'è 'ì 'ù á' é' í' ó' ő' ú' ű' ý' ń' ź'ã'ä'ë'î'ï'ñ'õ'ö'ü'ÿ'ā'ă'č'ē'ĕ'ě'ğ'ĩ'ī'ĭ'ĵ'ň'ŏ'ř'š'ũ'ū'ŭ'ž'</p>
      <ul>
      <li>Most Romanized Chinese &amp; Japanese pairs are not included. (I included some which came up as popular place names or last names).
      </li><li>Vietnamese. I'll tackle that some other time.
      </li><li>Greek, Cyrillic etc. . . read the first post.
      </li><li>Pairs which are only used in one-off City/town names are not included except for a few big cities.
      </li><li>I included a few common Romanized Chinese name/place pairs but not all of them . . . there are so many of those.
      </li></ul>
      <p>The whole point of this is to have a "at the very least, check these pairs" list. What to do about accent collisions is a different matter. I just want to have a reasonable, practical list that covers the majority of European languages which use Latin 1,2,3,4. If anyone knows of any important pairs I've missed, please let me know.</p>
