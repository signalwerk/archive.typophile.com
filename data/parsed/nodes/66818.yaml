      <p>Charles: <em>On that model, it is better to design ligatures to solve crashing problems that would be avoided by the skilled scribe.</em></p>
      <p>Better yet, use contextual variants to dynamically create ligated or otherwise adjusted glyph sequences that resolve collision problems. This is more flexible than creating actual ligature glyphs, and enables you to hit a wider range of potentially problematic sequences with a smaller number of glyphs.</p>
    html_clean: |-
