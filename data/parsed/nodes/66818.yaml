    html: <p>The type and frequency of accent collisions depends heavily on the language used. Native American languages have some orthographic practices that cause thorny problems in this area, like the use of multiple accented vowels in sequence, surprising letter combinations, or unusual sequences of diacritics. Consider examples like íì, íë, fì, ęj, fš, and fā which are not sequences that occur typically in European languages. How much of this should a font designer reasonably be expected to prepare for in advance? It is however not that much trouble to automatically generate a large pile of text with potentially problematic combinations and then eyeball for the worst ones.</p>
