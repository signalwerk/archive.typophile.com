      <p><cite>Better yet, use contextual variants to dynamically create ligated or otherwise adjusted glyph sequences that resolve collision problems.</cite></p>
      <p>That is what I did in the case above. As you say, a slightly fewer numbers of glyphs to create. For the Kiowa, I used several variant f's rather than ligatures. As I remember, there one "f" for use with an i+macronbelow before, one for an i+macron after, one for any other vowel with macron or grave after, one for the i+macronbelow with a vowel+macron or grave after, and a final one for the specific sequence mentioned above.</p>
      <p>Whether to use liga or calt depends on what is involved, and the solution. There are a number of European languages where an f followed by certain accented vowel are problems. Depending on the font, sometimes I make up a ligature, sometimes switch to a different f via a calt feature. Sometimes I use both, a ligature for the i and only a different f for other vowels. </p>
      <p>YMMV, but my point is that much of this is only possible by the compositor, who has a manuscript in from of him/her. To anticipate all problems just isn't possible -- I believe even Ross Mills wonderful new font doesn't cover Kiowa.</p>
