    html: |-
      <p><strong>How long does it take you to develop one of your custom typefaces?</strong><br>
      <strong>JF</strong>: It depends on the typeface. Sometimes we work quite quickly and they’re exactly what we want for the job. Others need more work.<br>
      <strong>KE</strong>: Some won’t be the whole alphabet either, just the letters that you need. Then later you might go back to them.<br>
      <strong>JF</strong>: It might look great for the letters you need but might not for the rest of the alphabet. We had that with the Wire – we hoped and prayed that they wouldn’t write a headline with a Z in it! We didn’t have one.</p>
      <p>Source: <a href="http://www.creativereview.co.uk/crblog/dear-non-format/" rel="nofollow"><strong>CR Blog</strong></a></p>
