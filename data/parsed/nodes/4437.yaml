  html: <p>Yup, I'm a noobie at the forum.  I need help with a typeface.  I am designing a logo for a vintage car repair shop and need a typeface for "Service Station".  Been looking all morning, not satisfied.  Should I use initial caps or all caps?  Any suggestions for a typeface and where I can find it?.  Thanks in advance.</p>
