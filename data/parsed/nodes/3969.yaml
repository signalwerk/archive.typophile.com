    html: '<p>The Roots of Akzidenz Grotesk <br> <br>Ferdinand Theinhardt (1820-1909) and owner of his foundry "Ferd. Theinhardt Schriftgiesserei Berlin", designed the ROYAL GRETESK round about 1880. His foundry was soled to to Berhold AG in 1908. After the end of the Germany monarchy (1918) Berthold renamed it to "Akzidenz-Grotesk (AG mager)". <br> <br>source: <a href="http://www.typolexikon.de/t/theinhardt-ferdinand.html" target="_blank">http://www.typolexikon.de/t/theinhardt-ferdinand.html</a> <br> <br></p>'
