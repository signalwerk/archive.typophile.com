    html: |-
      <p>I think it is normal.<br>
      I'm not saying that your code is correct, but from what I heard,<br>
      despite some of the Pro fonts containing the locl feature, the latest<br>
      version of InDesign, CS2, still does not support it yet.<br>
      But keep the feature in your font, because future versions will.</p>
