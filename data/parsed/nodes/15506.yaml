  html: |-
    <p>Is it normally? Or something wrong in my feature definition:</p>
    <p>@acute = [cacute sacute zacute nacute oacute];<br>
    @kreska = [ckreska skreska zkreska nkreska okreska];</p>
    <p>feature locl { # Localized Forms<br>
    language PLK exclude_dflt; # Polish;<br>
          sub @acute by @kreska;<br>
    } locl;</p>
    <p>???</p>
    <p>PS<br>
    All corresponding glyphs really exists! :)</p>
