      <p>HAPPY and NAKED are an inline version of a 19th century slab serif font named Hellenic wide. Several digital versions including <a href="http://www.fontspring.com/fonts/fontmesa/lonestar" rel="nofollow">Lonestar</a> by Font Mesa, and <a href="//typekit.com/fonts/hellenic-wide" rel="nofollow">Hellenic Wide</a> by Veer<br>
      Don</p>
