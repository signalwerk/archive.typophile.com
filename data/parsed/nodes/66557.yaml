  html: |-
    <p>Hi-</p>
    <p>This is an idea I've been mulling over for a day or two: could we as a web community design a font for Typophile?</p>
    <p>This font/font family would be owned by Typophile, and all royalties would go directly to the same place donations would, and rights would be managed by the same people handling the funds for the site, and all designers would agree that this is all done for sole purpose of funding the community, and the administrators would agree to use the profits of the font to be used only for Typophile.</p>
    <p>We could all participate in the design; swap font files weekly or monthly with willing designers, and have ongoing critique online.</p>
    <p>To kickstart this, I already have a .vfb-file done with just about most neutral glyphs I can draw, to get things going:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/TypophileSans_3662.png"></div><p></p>
    <p>This is just to test the ice; I do not know if this is legally/contractually possible to do, or even if people are interested in this.</p>
    <p>What do you think?</p>
