    html: |-
      <p>Yes, no walking corpses, but forget about doing a text font.</p>
      <p>For mass-collaboration to yield something other people would pay money for, there will have to be as much talking as drawing. For example, even something basic like arriving at good vertical proportions will require a good amount of iteration and an eventual general consensus. Assuming there will be a large number of people working on this, I can imagine the necessity of: having some sort of polling mechanism; people dropping off over time. We have to plan for such things before we smack this thing with the Moet, otherwise the iceberg will get us.</p>
      <p>hhp</p>
    html_clean: |-
      <p>Yes, no walking corpses, but forget about doing a text font.</p>
      <p>For mass-collaboration to yield something other people would pay money for, there will have to be as much talking as drawing. For example, even something basic like arriving at good vertical proportions will require a good amount of iteration and an eventual general consensus. Assuming there will be a large number of people working on this, I can imagine the necessity of: having some sort of polling mechanism; people dropping off over time. We have to plan for such things before we smack this thing with the Moet, otherwise the iceberg will get us.</p>
      <p>hhp</p>
