      <p>You need to be careful that people don't see the quill pen and think you're an illustrator or calligrapher. The film strip look (sprocket holes and visible frames) is clever but video doesn't have those. </p>
      <p>Maybe I'll change my mind when I see the finished art, but currently I don't think it's working. But keep working on it.</p>
      <p>Video is a difficult concept for icons. People used to use VCR cassettes as icons, but those are rapidly disappearing. I know that film strips are still used sometimes as icons, but they really don't fit video. Maybe a video camera shape or a clapboard?</p>
      <p>&gt; T o m o r r o w's Memoirs.</p>
      <p>Normally you don't space out characters when writing a company's name in plain text, even if it's widely spaced in the logo. It looks odd and if it's at the end of the line it could be broken into 2 lines with no hyphen.</p>
