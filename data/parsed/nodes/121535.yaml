    html: |-
      <p>Logos often need to be reproduced in a small size (business card, small web ad, etc), but in a small size the ink bottle becomes way too light and the sprocket holes disappear:</p>
      <p><img src="/sites/default/files/old-images/logo3_6408.jpg"></p>
      <p>I would increase the line weight and make the sprocket holes fewer and larger. Remember this is an icon, not a literal representation.</p>
      <p>Also the type spacing needs some tweaking. At the very least I'd move the T closer to the O and center the apostrophe between W and S. Also the type might be too light in small sizes, print it in small sizes as a test. </p>
      <p>And you might consider putting the name in 2 lines — at least when it's printed in small sizes —&nbsp;as in narrow-width situations the drawing will become small to accommodate the type's width.</p>
