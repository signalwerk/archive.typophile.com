    <p>It's just a sketch but I am starting my own videography company. I want to mainly Document weddings. It's called T o m o r r o w's Memoirs. </p>
    <p>Wanted to capture the message that a story is being told through my work when I shoot weddings or other celebrations and I also want to incorporate film. Hence the Quill pen made of film strip. I'm not the best Drawer. I have someone inking my sketches now so I can see what it looks like.</p>
