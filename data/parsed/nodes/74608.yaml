      <p>Yes, as forrest said, just swapping them out would be the cheapest. However, I'll point out that the weight is slightly different, and the terminal ending in the fonts (including the guillemets) is a little different. Swapping them out would work perfectly fine, though. It would definitely be best to do this directly to the font. If you can't afford (or figure out how to use) the software, I could easily do it for you, either for free or a very reasonable amount (it's only a few characters).</p>
      <p>Email me if you're interested.<br>
      artistenator <em>at</em> gmail <em>dot</em> com</p>
      <p>Also, if it's only going to be a couple pages, you'd be just as well to do a search and replace.</p>
