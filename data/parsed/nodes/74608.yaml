    <p>Since Adobe isn't doing custom work on fonts I'm looking for a type designer who is willing to customise my copy of Arno Pro SmText, Italic SmText and Semibold SmText (version 1.038).</p>
    <p>I want the single and double guillemets to look narrower and thus more unobtrusive, just like in most other text typefaces. See below for an example of Arno and Warnock -- the guillemets in Warnock look like I want them to look.<br>
    I'm still a student, so my budget is limited. Could you recommend me a type designer?</p>
    <p>Arno Pro:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/guillemets_arno_5290.png"></div><p></p>
    <p>Warnock:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/guillemets_warnock_5344.png"></div><p></p>
