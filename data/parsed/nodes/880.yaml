    date: 2003-08-12T18:24:00
    date_raw: 12 Aug 2003 — 6:24pm
    votes: null
    html: <p>Hey thanks alot guys. I do plan on tweaking it here and there - the byline and such...but gotta do that on my time now in secret-teeny updates that the committee hopefully won't notice as they've approved moreso out of time/budget contraints.  <br> <br>Jacques I'm interested in your comment but don't understand what you mean by mirroring? <br> <br>Ignacio, I know what you mean...but here check it out in context with the nav bar on the site (general look and feel so far). <br> <br>As for the colour - I wanted to stick with WaterCan's own pantone so that it won't increase any print costs on collateral - I think it says a little something to do with sticking "on brand" so-to-speak <br> <br>I've also allowed for some strange standards. Because I can't really target any one age group I suggested that in collateral appealing to older crowds - we place fewer decorative bubbles or even none so that it has more of a "MTV" feel. Younger crowds get more small bubbles - super young - lots! so you get the "Nickelodeon" idea. In essence the bubbles are going to help it scale up and down the targets - or something like that. haha <br></p>
