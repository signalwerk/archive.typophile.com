    date: 2003-08-10T16:02:00
    date_raw: 10 Aug 2003 — 4:02pm
    votes: null
    html: <p>Its a bit confusing to explain <br> <br>H2Oh! is a WaterCan initiative (a Canadian NGO that deals with water issues in dev. countries and Canada) Its a program that will be introduced into the Canadian High School cirriculum. Its goal is to create a learning series and offer lesson plans (modules) that can be incorporated, modified and tailored by teachers into the science stream. The program is being developed by a committee of teachers and distributed via official channels (school board cirriculum officers) for review at this point. But the hopes for phase 2, 3 and beyond are that teachers themselves will find it and ask for it to be incorporated. Further still, they hope that parents and even students will seek and get involved.  <br> <br>Its sort of like taking First Aid  (St. John's Ambulance), or Jump Rope for Heart that kids take in phys ed. (Heart and Stroke Foundation) that students take in school. Except this is for the science courses and the topic is water produced by WaterCan. <br></p>
    html_clean: <p>Its a bit confusing to explain <br> <br>H2Oh! is a WaterCan initiative (a Canadian NGO that deals with water issues in dev. countries and Canada) Its a program that will be introduced into the Canadian High School cirriculum. Its goal is to create a learning series and offer lesson plans (modules) that can be incorporated, modified and tailored by teachers into the science stream. The program is being developed by a committee of teachers and distributed via official channels (school board cirriculum officers) for review at this point. But the hopes for phase 2, 3 and beyond are that teachers themselves will find it and ask for it to be incorporated. Further still, they hope that parents and even students will seek and get involved.  <br> <br>Its sort of like taking First Aid  (St. John's Ambulance), or Jump Rope for Heart that kids take in phys ed. (Heart and Stroke Foundation) that students take in school. Except this is for the science courses and the topic is water produced by WaterCan. <br></p>
