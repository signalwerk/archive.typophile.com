      <p>Hey there!</p>
      <p>Take a look at <a href="http://new.myfonts.com/fonts/fontbureau/amplitude/" rel="nofollow">Amplitude</a>, its a very versatile family with a condensed version that will fit your needs. Also, I've recently discovered <a href="http://new.myfonts.com/fonts/hvdfonts/klint-lt-pro/" rel="nofollow">Klint LT Pro</a>, another big family of fonts. They are both, however, more on the technical side as far as look and feel. If you want a more neutral typeface thats just as contemporary, go for <a href="http://new.myfonts.com/fonts/dstype/prelo-condensed/" rel="nofollow">Prelo Condensed</a>.</p>
      <p>Hope this helps!</p>
