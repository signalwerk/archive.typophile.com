  html: |-
    <p>I'm creating some reports containing mostly tables with a lot of columns.  So, the text tends to be very small (7-10 points).  I'm looking for a sans-serif typeface that looks very readable at those small sizes and within tables.  It has to come in TTF, which the reporting tool requires.</p>
    <p>I've been thinking about typefaces like DIN, Meta Condensed, Milo Sans, and the like.  We'll be using Milo Sans and Serif for other reports, so I'm leaning towards that, but it's ashame Milo doesn't come in a condensed form.</p>
    <p>Any suggestions?</p>
