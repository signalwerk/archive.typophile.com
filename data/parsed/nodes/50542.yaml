    <p>I am new to this site and am really enjoying the various threads I have read so far. </p>
    <p>My question for the day is in regard to the font Argentica. Does anyone know where/if this can be purchased or even have any info about this font? I have asked the Google and it didn't net any results so I thought I'd put it to the forum..</p>
    <p>Any help much appreciated</p>
