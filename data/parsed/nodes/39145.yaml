      <p>Oh I heartily agree they are imperfect. The numbers in general are much too heavy, and the N and X didn't even exist in the original. It is most assuredly time fore some cleanup, but I'm doing this mostly for the experience of translating hand-lettering to digital type, and there are flaws inherent in that process.</p>
      <p>I swear I've seen a similar commercial font somewhere, but I just can't place it in my mind. Hmm...</p>
