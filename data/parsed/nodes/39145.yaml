  html: |-
    <p>This is a quick and dirty trace job I did from an old Speedball Textbook (16th ed.). It took me about a week.</p>
    <p>The original:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/SB_poster_gothic_cond_5292.png"></div><br>
    and my output:<br>
    <div class="imageWrap"><img src="http://typophile.com/files/posterony_test_image_6559.png"></div><p></p>
    <p>The spacing isn't perfect, and I had to create a couple letters to fill out the alphabet, plus all the extras for a complete MacRoman font. See the attached PDF for all that, and to peer into the fleshy curves.</p>
    <p>I made it in FontForge mostly using Spiro curves. They get a bit difficult to deal with though, since you have to convert them to Bezier curves to make a usable font and the procedure isn't fully optimized in the current version, requiring much manual tweaking, lest one get 5 or more Bezier points for each Spiro point on a curve.</p>
