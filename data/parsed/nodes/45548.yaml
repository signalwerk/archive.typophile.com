      <p>This <a href="https://web.archive.org/web/20141112083328/http://www.three.co.uk/threefiles/pdf/dateline.pdf" target="new" rel="nofollow">PDF</a> from the three website lists the fonts as Modena-CondensedLight and Regular (and Verona). The HMRC fonts are listed as IRModena.</p>
      <p>It appears to me that the x-height is increased in the condensed, relative to the letter height, and that the descenders are brought up in pro.</p>
