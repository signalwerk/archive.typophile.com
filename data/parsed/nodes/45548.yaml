    <p>I've seen this font sometimes around London, including printed adds here. It is incredibly legible at small sizes, with its tiny ascenders and descenders. First thought it was HM Revenue &amp; Customs Modena, but it's not... </p>
    <p>Might be an easy one, I must confess.</p>
    <p>Thanks in advance...</p>
