      <p>Oh, well in my research I found that Perpetua was named after a Christian martyr and its sister font, Felicity, that was being created at the same time by Gill (but I don't believe its ever  been released) was named after a co-martyr of Perpetua's from the same time period, who met the same end. But I will look into the Roman style named after a man.<br>
      Thank you,<br>
      Jessica</p>
