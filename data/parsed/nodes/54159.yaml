    <p></p><div class="imageWrap"><img src="http://typophile.com/files/perp_blog_5693.jpg"></div><p></p>
    <p>Perpetua and I fell in love last year in Mrs. Bernardo's class. :) She is an elegant and graceful typeface, meant to flow across the page effortlessly. </p>
    <p>Created by Eric Gill and released in 1932, Perpetua has a long story to tell. Along the way Gill didn't know for sure if this would be the typeface he would release. He had another offer from another company for her sister font, Felicity. The time, scheduling, and mismanagement worked out in Perpetua's favor. </p>
    <p>Gill named her after Saint Perpetua who was one of the first martyrs to die for Christianity. It took nearly 8 years of meticulous work to to be able to produce such a beautiful typeface to suit such an honorable woman. In the end he produced a masterpiece that is still unique and timeless today. </p>
    <p>Knowing Saint Perpetua's story as well as the sketchy business related background that went into this typeface, I had to share its story as well as choose it as my favorite.</p>
