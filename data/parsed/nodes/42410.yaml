      <p>LUXE shows signs of <a href="/wiki/squoosh" class="wiki">squooshing</a>. Could be <a href="http://www.fontshop.com/fonts/singles/linotype/trade_gothic_lt_std_extended_ot/?sample_text=LUXE&amp;sample_size=60">Trade Gothic Extended</a> with slabs attached.</p>
