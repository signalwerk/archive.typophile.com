    <p>Hey all, I have this great opportunity coming up where i have alot of creative freedom to make a title sequence for a show called "Settlers".<br>
    Im a little stuck for ideas as they want it to have a more contempory feel.The main ideas being "firmly grounded" and bringing the past into the present, as opposed to taking the viewer back in time.<br>
    I have attatched some crap i thought of but Any fonts or suggestions would be great.</p>
