    html: |-
      <p>The show consists of celebrities discussing there heritage,how certain personality traits they have, may have come from there ancestral background.<br>
      "What did the Settler's contribute to the modern Kiwi personality?"</p>
      <p>I have thought about the above comments and they have both helped,<br>
      another idea i had was to show the letters grown out of the "S" so each letter represents a generation..which inturn has come back to the last "S"?...so maybe a font which has character that is strongly revolved around the curves of an "S".</p>
