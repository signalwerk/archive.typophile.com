    <p>Pretty basic question, but I couldn't find an answer. Here it is:</p>
    <p>I'm expanding a typeface to include old style numerals and small capitals. I have a draft of all these glyphs drawn in FontLab. How would you go about proofing these? I see that you can print up glyph tables in FontLab, but I'm wondering if there is an effective way to create specimen sheets with all these new glyphs in the context of the larger typeface? Ideally, I'd like to print them out. Thank you,</p>
    <p>Luke</p>
