      <p>I assume the original font was done by somebody else? If so, first of all know that many font licensing agreements prohibit any sort of modification, so to stay squeaky-clean legal you'd have to make a totally separate font with your additions and use it in parallel to the original... Although to me if you keep it all safely internal I think it's acceptable to ignore such a no-mod clause*, especially to ease development. But if you let it leak out, beware...</p>
      <p>* There was a useful recent thread about this, but for the life of me I can't find it right now...</p>
      <p>Since you're sort of splicing in to somebody else's thought process, in terms of making the new glyphs work think not just about maintaining things like equal weight with the original, but also what glyphs from the original's set your stuff needs to work with. For example, smallcaps have to work with both the caps (in "capitalized" all-caps setting) and the lowercase (especially for acronyms) and they should probably also harmonize with the numerals, both from the original and the new ones. So make a specimen sheet that covers all these permutations.</p>
      <p>hhp</p>
