      <p>"Why one person gets something right away and another person does not"</p>
      <p>Please explain to us all what we are missing –&nbsp;to help us "get it".<br>
      You have been repeatedly asked to explain how the rotten meat and flies says something about the AIDS epidemic in Africa. This poster is exceptional enough to have been chosen for that illustration annual you mentioned, it must be strong enough to survive a little probing.</p>
      <p>I know the message you are trying to communicate, but I need help in understanding in how this poster helps achieve your aim.</p>
      <p>My fear –&nbsp;and I would like to be proved wrong –&nbsp;is that while <em>at first</em> it seems like a clever visual trick ... aah yes, Africa <em>is</em> shaped a little like a steak ... when you think about it (etc.)<br>
      But then ... if you ask yourself "why?" it seems to unravel.<br>
      What connotations does meat already have?<br>
      meat is murder.<br>
      one man's meat is another man's poison.<br>
      treating people like meat.<br>
      meat as metaphor for greed and/or violence<br>
      meat as muscle or strength.<br>
      a "meat-market".<br>
      and so on.</p>
      <p>When you work with loaded material you have the opportunity to exploit the pre-existing semiology, or to play off it in new and exciting ways. I'm not sure that your use of meat falls into either category (other comments in this thread have offered many explanations why, I won't go over them).</p>
      <p>I know that the larger context of the poster is the West's neglect of the third world but you <em>specifically</em> focus on AIDS and <em>that</em> is where I&nbsp;see the problem between text and image in your poster.</p>
      <p>The <em>text</em> says AIDS is a major problem in Africa (this is an awful truth)<br>
      The <em>image</em> possibly says "Africa is rotting" (or "Africa is rotten" which clearly problematic)<br>
      It could obviously say many other things (some have been previously suggested) and I hope you can explain the alternative reading that links it to AIDS and clear this up once and for all.</p>
      <p>I also think that, with the exception of a couple of comments, people here have been polite and courteous in the face of your resistance to delve deeper into the strengths and weaknesses of this piece of work that you put up for critique.<br>
      You seem to have focussed on the fact that people don't like the work, rather than <em>why</em> they don't like it.</p>
