      <p>Patty is right, the metaphor is mixed and is at odds with the copy. It has no call to action, there is a piece of information that on its own does not offer any answer (however small and insignificant), nor does it appeal for any assistance. The illustration isn't of a <em>rotting</em> steak, it seems fresh, why are there bites taken out of the uncooked meat –&nbsp;what does that say about aids or the number of casualties? Mozambique seems to have a Mickey Mouse shape chopped out of it. Some of the copy is superfluous, my feeling is that the headline message should reveal its meaning in as few words as necessary, it could read "…than the total casualties in all wars…", for example.<br>
      Tim</p>
