      <p>Hey, Chris, well, let me try something.  This was at the point with the CA cover where I tried to explain my work.  It then set off a historic chain reaction of events.</p>
      <p>By the way, Chris, hrant, Hunt, Lore, West, all veterans of the CA cover thread - the image has gotten traction.  It's in the current CA design annual.  Yes, sounds corrupt, but the jury was neutral I suppose.  Nine judges from Design firms and such around the world picked it as one of the best images of the year.  But, what do they know...</p>
      <p>Getting back to this one.  Thanks (most of you) for all the advice.  That feller Randy is one cool cat.  Gives some very nice thought out info.  Hrant is one cool cat too, in some other ways (i.e. sticking to the script) I kid Hrant, chill.</p>
      <p>About the image, my thinking.  I'm tired of little red ribbons and soft statements about helping this and that.  I wanted something raw to get people's attention.  I wanted it to be some street thing, not all sophisticated and fancy typework and all.  I felt like an over designed poster just didn't work for this.  I didn't want to render a grey steak or juice or whatever.  Just a red flat silk-screened image. bam. there it is.  I'm tired of fanciness.  While we sit here on a forum discussing x-heights, Africa is rotting away and disappearing, why be all fancy with the cool fonts and the this and the that?  Just put an image down and stick some text on it. period.</p>
      <p>Bring it on....</p>
