      <p>Just dropped off my ballot at the postoffice.</p>
      <p>Edel, I think your work is excellent. Thoughtful and well executed. This is why you are getting the big covers and recognition.</p>
      <p>However, in this case, i think you have a good idea but the execution is not on par with your other work. I will try to make my criticism as constructive as possible.</p>
      <p>1. Type. It doesn't feel integrated with the concept. Just words typed on a page. I was looking at the <a href="http://www.drawger.com/edel/?section=gallery&amp;gallery_id=181&amp;image_id=3584" rel="nofollow">Defiance</a> poster on your site. Much better. The words fit in the soldiers ribbons and match the style. Somehow the type should be more integrated in the concept here, or should just be a caption below it. The picture should have it's own impact. It's a little bit of show and tell as is.</p>
      <p>2. Empahsis. All the elements are emphasized the same. OK africa is red. But type, flies and Africa are all flat. Maybe what I'm saying is that they're all at the same depth of field. I picture the flies closer and farther to the viewer. Maybe. It could just use more graphic impact. Are you emphasising the rotting meat or the nasty flies all over it? Neither at the moment.</p>
      <p>3. The steak. I think the shape of africa is iconic enough without country lines. They distract from the rotteness of the meat.  Maybe simplify the continent shape (no bites?) and use the space to make it more rotten and meaty (introduce grey into the meat/blood juice?).</p>
      <p>4. Style. It seems too sterile to be rotting. I think it needs more texture like some of your other pieces.</p>
      <p>Thanks for your involvement at typophile.<br>
      Hope that was helpful.</p>
      <p>Randy</p>
