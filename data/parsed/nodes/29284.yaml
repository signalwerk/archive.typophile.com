      <p>So far it seems to read like this:</p>
      <p>You ask people what they think.<br>
      They tell you what they think.<br>
      You tell them that the image was selected for the American Illustration Annual book this year and then adopt a passive-aggressive tone with "what do illustrators know anyway ... right?".<br>
      People raise issues with the image that fail to get a response even when the same issues keep cropping up:<br>
      What do rotting meat or flies say about AIDS in Africa <em>or</em> about the West's neglect of the third world?</p>
      <p>This is not because we don't "get it" – because we can't get past our "1+1=2" mentality – this is not an "Artists" vs. "Designers" thing as you continue to assert, this is about communication.</p>
      <p>The word or image of meat is a heavily loaded metaphor that seems out of place here, and not in an intellectually provocative way.</p>
      <p>If you intend to communicate (even part) of a complex problem with an image, you should be concerned about the fact that it seems to have caused confusion here, a forum for people who (often) work in the same field as you – 2D communication designed for print or screen.<br>
      You have also jumped to the conclusion that everyone here is a "designer" and therefore, in your view, not an "artist". Aside for the fact that there are many "artists" and non-typographers here, where is the art/design line drawn? I certainly think that it's more blurred than you are making out.</p>
      <p>Illustration can offer a means to communicate without language barriers. This is a major strength, but also a responsibility when dealing with sensitive (and enormous) issues such as this.</p>
      <p>Nobody likse to have their work unfairly criticised and it's clear that you think this is the case here, but can you at least drop the "us and them" attitude toward Typophile users – you are creating divisions that needn't exist.</p>
