      <p>Honest opinion - I think the meat and flies are well executed, but taking the three 'bites' out of the meat makes it less Africa like. Also it's not obviously rotting - the flies would be attracted to a nice fresh cut of meat too, no? Type is not particularly interesting - seems odd that it was posted to typophile and the "general discussion" area in particular. </p>
