      <p>Nick &amp; the rest have been working a long, long time on this. I wish I could take some credit but all I did was sit on the sidelines and say "wow, that looks great" as they added useful, well-integrated features.</p>
      <p>I am really proud to be part of this company and to work with people like Nick, John, Kevin, Laurence, Adam, Jan and the few other folks I've worked with directly.</p>
