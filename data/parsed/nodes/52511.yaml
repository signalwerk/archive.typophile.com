      <p>The reborn Mefonts is facking great! If only they had remonikered it "Mefonts" I would be ecstatic. As it is I'm merely a very happy man. I mean, they've come up to speed with their technology and visitor experience, but the brand experience still lacks somewhat in "want it" vibes. Notwith-standing I'm giving the new site a top rating.</p>
      <p>Have you guys tried out the OT feature switching palette? It's facking great! You can turn on and off all three levels of ligation in my new <a href="http://new.myfonts.com/search/jabberwub/fonts/" rel="nofollow">Jabberwub font</a>. Click the "ff" lig Advanced typography widget then try checking and unchecking LIGA, DLIG, CALT, SALT, HIST and FRAC. Of course this thingy works for other fonts with OT features ;^)</p>
