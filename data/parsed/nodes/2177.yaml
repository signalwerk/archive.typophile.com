    html: <p>It reminds me of <a href="http://66.70.183.115/fonts/fontshow/db.cgi?db=default&amp;uid=default&amp;ID=33220&amp;ww=on&amp;view_records=View%2BRecords" target="_blank">T-26 Metsys</a>, but it's been tweaked away from that. The broken t is an obvious characteristic. If Gareth Hague didn't design this one, he has someone looking over his shoulder.</p>
