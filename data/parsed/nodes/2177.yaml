    html: <p>Mike's right. It definitely has some serious Metsys underpinnings. I wonder if it's a non-commercial variation from Gareth and David James. Many of their faces tend to riff off of each other. Take <a href="http://www.veer.com/results.asp?image=ALT0000124">Sylvia</a> and <a href="http://www.veer.com/results.asp?image=ALT0000127">Aminta</a> or <a href="http://www.veer.com/results.asp?image=ALT0000105">Enabler</a> and the upcoming Anomoly (I'll try to find an example of this...) for instance.</p>
