    html: |-
      <p>Interesting that they use "X height" to mean the height of the <em>capital</em> x.</p>
      <p>Also, they give the sign-makers a complete kerning table! You look up a kerning pair by finding the first letter in the pair and sliding along the row until you find the cell for the second letter, and it gives you the spacing value.</p>
