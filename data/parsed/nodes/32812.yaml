    <p>Hello all:</p>
    <p>I am an author and about four months ago I downloaded a font called “Mohammed” from a free internet site to use as the title font for my new book “The Sparrow’s Blade.” I recently had to install a new hard drive on my computer and completely forgot to back-up my font files and so now “Mohammed” is gone so work can’t continue on the cover art. I have only a .jpg of the cover art but it does show the now missing font. I have searched the internet for two weeks now but to no avail...you folks are my last hope. I will attempt to post the .jpg of the cover here but if it doesn’t work please go to my website at <a href="http://www.kennethrlewis.com" title="www.kennethrlewis.com">www.kennethrlewis.com</a> and click on the page called “books” and you can see the cover art there...”The Sparrow’s Blade.” And please be advised that on this cover for the words The Sparrow’s Blade a red Mohammed font has been overlayed with another black Mohammed font but slightly off center for a shadow effect. The smaller words “a novel” are lower case black Mohammed. So, I know the name of my missing font but need to know where I can find it again? Thanks to all of you in advance, for your help.</p><div class="imageWrap"><img src="/files/THE SPARROW'S BLADE_5552.font.JPG"></div><p></p>
