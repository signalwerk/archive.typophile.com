    html: <p>Kenneth - Aaron Beck’s Warlock was the original for that font you used. He created it way (in computer time) back in 1994 and, until recently, offered it as $5 shareware. <a href="http://www.recordkeeper.com/products/fonts.html" target="_blank">The website</a> appears to mostly be defunct now in favor of Beck’s <a href="http://www.awbeck.com/" target="_blank">latest Web incarnation</a>.</p>
