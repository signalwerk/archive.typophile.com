      <p>SUCCESS! I have the font again and refinements may now continue on my book’s cover. My thanks to all of you, and especially to Angel 71. By the way, I did find out this font is shareware and I am doing my best to contact its creator and pay him his $6.00...don’t know how I missed this the first time but I guess I was so excited about finding the “perfect” font I didn’t bother to read the “read me” file attached with it. Thank you again for introducing me to the world of typophiles...I had no idea such an alternate universe existed! But I’m inspired now. Here’s the title and a short synopsis to my next novel:</p>
      <p>        “The Deadliest Font” by Kenneth R. Lewis</p>
      <p>        When a gathering of typohiles at the annual<br>
              Stockholm Typophile Convention in Sweden leads<br>
              to contention between two rival groups...the Sans,<br>
              and the Serifs...over who designed the year’s<br>
              prize winning font and will go home with the coveted<br>
              “Typie” Award, bickering leads to brain bashing murder<br>
              in this fast paced tale of deadly secrets, intrigue, and<br>
              steamy typography inside one of the modern day world’s<br>
              most misunderstood societies.</p>
