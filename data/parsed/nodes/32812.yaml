      <p>That’s obviously an unfortunate font name, because searching for it gets you too many places that have nothing to do with fonts. The only fonts with this name I could find at freebie sites I know look like pseudo-arabic, and not like your typeface at all.</p>
      <p>If someone else doesn’t solve this, I’d strongly recommend looking for a new typeface, and backing it up.</p>
      <p>- Mike Yanega</p>
