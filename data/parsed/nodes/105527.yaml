      <p>I'm not sure exactly what effect you're looking for, but something like this is simple in Photoshop. Create the letter, rasterize (layer &gt; rasterize &gt; type), then apply the mosaic filter (filter &gt; pixelate &gt; mosaic).  Don't know how to in Illustrator.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/h4_5405.jpg"></div><p></p>
