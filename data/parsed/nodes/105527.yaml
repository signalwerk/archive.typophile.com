    <p>Hi everyone,</p>
    <p>I've been trying to create a halftone effect on an italic letter 'h' but i just don't get there...tried looking for online tutorials but non of them deal with the complexity of a letter (just stars...etc)</p>
    <p>Could someone please tell me how to accomplish a nice and clean halftone effect on a letter in illustrator the way a half tone should be on type. </p>
    <p>kind regards</p>
