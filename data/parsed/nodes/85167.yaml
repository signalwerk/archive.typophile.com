    html: |-
      <p>I have tried a font cycling five sets of capitals (A-Z) with the code like Thomas posted, and it works very well with only one class containing all the capitals from the five sets, space and punctuation.<br>
      The real limitation of this code though is that it doesn't look further than six steps back, and the code gets much longer with each additional step... And with each five new glyphs longer still.<br>
      You might want to add some more conventional 'shuffle' lookup before this code to avoid always starting with the same set of versions, and to help glyphs from different sets mix together more evenly.</p>
