    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 22.Aug.2007 3.55pm </div>
      <p>· · · · · · · · · · · · · · · · · · · · · · · · · · · ·<br>
    18 and 19 September 2007<br>
    At St Bride Library London and the Department of Typography,<br>
    University of Reading</p>
    <p>· · · · · · · · · · · · · · · · · · · · · · · · · · · ·<br>
    The St Bride Library and the Department of Typography, University of<br>
    Reading are collaborating on a two-day conference on non-Latin<br>
    typeface design. The conference will be on Tuesday 18 and Wednesday<br>
    19 September 2007, and will comprise a day of talks at St Bride<br>
    Library, London, and a day of hands-on sessions at the Department of<br>
    Typography, Reading.</p>
    <p>Speakers at the conference at St Bride include Graham Shaw (Head of<br>
    Asia, Pacific and Africa Collections at the British Library), Victor<br>
    Gaultney, Thomas Phinney, Simon Prais, Nigel Roche, Mamoun Sakkal,<br>
    and Maxim Zhukov.</p>
    <p>The hands-on day at Reading includes sessions working with original<br>
    material from collections of both institutions. Sessions will be<br>
    conducted by: Dr Martin Dodds (Principal Examiner for Urdu, Cambridge<br>
    International Exams), Jo de Baerdemaeker, Gerry Leonidas, Thomas<br>
    Milo, and Dr Fiona Ross. As sessions at Reading involve working with<br>
    original artefacts, places will be limited to 30 persons.</p>
    <p>The twin events will be accompanied by substantial exhibitions on the<br>
    theme of the conference from the collections of both institutions. A<br>
    lot of this material has rarely been seen before, and certainly not<br>
    in this concentrated manner. The gems include original drawings for<br>
    several reference non-Latin typefaces. The exhibitions will be<br>
    curated by Fiona Ross and Rathna Ramanathan.</p>
    <p>Registration fees are £60 for the Tuesday only, and £120 for both<br>
    days; student fees are £40 and £80 respectively. Accommodation is<br>
    available on the Reading campus.</p>
    <p>You can book online. See:<br>
    <a href="http://stbride.org/events_education/events/non-latintypefacedesign" title="http://stbride.org/events_education/events/non-latintypefacedesign">http://stbride.org/events_education/events/non-latintypefacedesign</a></p>
    <p>You can also contact St Bride Foundation directly:<br>
    email info [at] stbridefoundation [dot] org<br>
    telephone 020 7353 3331</p>
    <p>· · · · · · · · · · · · · · · · · · · · · · · · · · · ·<br>
    There are limited places still available for the workshop day at the<br>
    University of Reading. Please contact St Bride Foundation to book for<br>
    both days.</p>
