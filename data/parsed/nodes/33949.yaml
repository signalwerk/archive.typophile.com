    html: |-
      <p>The second image is fantastic. In the right context this face would work beautifully.</p>
      <p>I'm not as keen on the heavier weight though; It feels clumsy and not as refined. The swashes don't flow from the letter as nicely either (e.g. the t).</p>
      <p>I would really like to see one of the letters (perhaps the 'G') up close to get a feel for the detail.</p>
      <p>Sorry I don't have anything more helpful to say.</p>
      <p>Out of curiosity, how did you start the design process? Did you use a pointed nib?</p>
