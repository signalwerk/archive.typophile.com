      <p>More information <a href="http://www.linotype.com/2596/part1.html">here</a>. It replicates Andys point about the Fruti airport usage, but part of the problem you face with this is that<br>
      a) Frutiger is prolific – lots of examples from lots of typefaces<br>
      b) many corporate brand identities may have used the 'unquirky' Frutiger faces as a starting point, but will have tweaked them in development and application<br>
      c) Linotype doesn't appear to be trumpeting the 'quirky' aspects of Frutiger's work.</p>
      <p>I know that Meridien and Univers were used for corporate IDs for banks here (in NZ). Univers Condensed Thin and Ultra get used for film poster credit lines (as Stephen Coles has pointed out elsewhere on typophile).</p>
