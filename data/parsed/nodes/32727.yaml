    <p>Can anyone help me?</p>
    <p>I am trying to list as many different ways in which Adrian Frutigers typefaces have been used.(for a student project.) By “used” I mean adopted in brand identities, signage systems, etc.</p>
    <p>What i have so far includes; Avenir's use in the visual identity of Amsterdam and Univers's use in the Paris Metro, Montreal Metro and numerous airports.</p>
    <p>Any use will be of help but the quirkiest the better!</p>
    <p>Thank you</p>
