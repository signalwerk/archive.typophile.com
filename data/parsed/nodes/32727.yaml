      <p>Frutiger (1975) was made specifically for signage at the Paris-Roissy Airport (for a reference refer to Bringhurst's The Elements of Typographic Style, p. 257).</p>
      <p>And according to wiki:<br>
      [Frutiger] was commissioned in 1968 by the newly built Charles De Gaulle International Airport at Roissy, France, which needed a new directional sign system. Instead of using one of his previously designed typefaces like Univers, Frutiger chose to design a new one. The new typeface, originally called Roissy, was completed in 1975 and installed at the airport the same year.</p>
