    <p>Hi guys,<br>
    I am doing a small poster 50x70 cm size (19.6 x 27.5 inches), very classic and clean. The design is approved by the client and tomorrow morning it will enter in press. </p>
    <p>Here is the poster<br>
    <a href="http://www.pixentral.com/show.php?picture=18H4Ma01w4Zr2JfQ29efaFPGlmdwJ5" title="http://www.pixentral.com/show.php?picture=18H4Ma01w4Zr2JfQ29efaFPGlmdwJ5">http://www.pixentral.com/show.php?picture=18H4Ma01w4Zr2JfQ29efaFPGlmdwJ5</a></p>
    <p>However, i have some concerns about a good Tracking (and kerning) and any advice on that will be appreciated. I am using for most of the stuff.</p>
    <p><a href="http://www.pixentral.com/show.php?picture=14Lk7hZFN0CLOMVJIETFfJsfFznkd" title="http://www.pixentral.com/show.php?picture=14Lk7hZFN0CLOMVJIETFfJsfFznkd">http://www.pixentral.com/show.php?picture=14Lk7hZFN0CLOMVJIETFfJsfFznkd</a></p>
    <p>Helvetica Neue Lt Std<br>
    85 Heavy<br>
    45 Light</p>
    <p> -25 Tracking for small text in Helvetica Heavy<br>
     -50 Tracking for large Headline text in Helvetica Heavy<br>
     0 Tracking for Helvetica Light</p>
    <p>and for subheads and contact info<br>
    <a href="http://www.pixentral.com/show.php?picture=1mUvVgd53dc7IMmAvKK7DYIovFE1" title="http://www.pixentral.com/show.php?picture=1mUvVgd53dc7IMmAvKK7DYIovFE1">http://www.pixentral.com/show.php?picture=1mUvVgd53dc7IMmAvKK7DYIovFE1</a></p>
    <p>Centennial LT Std<br>
    46 Light Italic<br>
    75 Bold</p>
    <p>0 tracking/kerning</p>
    <p>Thanks for any idea or suggestions.</p>
    <p>Cheers,<br>
    Sebs</p>
