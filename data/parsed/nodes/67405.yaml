  html: |-
    <p>Hey Typophile buddies! I need some help- I'm working on the identity for a small restaurant opening in my neighborhood soon. I want it to look like the older hand painted gold leaf window signs-</p>
    <p>examples:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Gold_leaf_6250.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/gulfstream_6636.jpg"></div><p></p>
    <p>I need your help to find a proper typeface that is in the style I'm looking for here- So far I was thinking Interstate Condensed Bold:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/mouton_4918.png"></div><p></p>
    <p>But I'm really looking for something more maybe.. naive? more flawed possibly- something a little more hand painted and older looking.</p>
