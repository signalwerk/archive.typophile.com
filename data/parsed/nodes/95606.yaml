    html: '<p>Most probably custom and/or handdrawn to mimic wooddentypes. Same vein: <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/deerfield/" rel="nofollow">Deerfiled</a> (/A is off though), <a class="freelinking external" href="http://www.losttype.com/font/?name=liberator" rel="nofollow">Liberator</a> (/R off), <a class="freelinking external" href="http://www.myfonts.com/fonts/chank/liquorstore/" rel="nofollow">Liquorstore</a> (/A off), <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/canby/" rel="nofollow">Canby</a> (/R off), <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/unionthug.php" rel="nofollow">Union Thug</a> (combinating upper and lowercases), <a class="freelinking external" href="http://www.myfonts.com/fonts/k-type/mandatory/" rel="nofollow">Mandatory</a> (/R off)</p>'
