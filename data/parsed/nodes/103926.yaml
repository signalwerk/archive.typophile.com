      <p>Are Book and Medium two separate weights?<br>
      some suggestions:<br>
      Acute and grave placement on the O/o is off.<br>
      Quotation marks are too small.<br>
      Is J too narrow? t may be a bit top heavy.<br>
      Notch at upper right of g and q looks indecisive.<br>
      Superior figs too big. I don't think the barred OS one works in this monoline style. The little tie in % also seems out of place. I like the idea of oldstyle-height %, but it gets awfully wide.</p>
