    <p>I've been brooding over Verdana for a while, and since I had some free time last weekend, I decided to make my own Verdana-esque typeface; but without those odd terminals. I started with (roughly) the dimensions of Verdana, and just worked my way through the glyps, and ended up with something that, to my eye, is an interesting amalgamation of News Gothic and Verdana, with some Myriad trown in. What do you think?<br><img src="/sites/default/files/old-images/Ababdon_6497.png"></p>
