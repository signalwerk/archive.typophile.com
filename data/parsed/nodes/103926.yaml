      <p>Thanks, Craig-</p>
      <p>This started as a Medium, but I then decided it to be Book weight.<br>
      You're righ; fixing those acutes and graves.<br>
      And I'll look into those J and t.<br>
      And right again; those need more depth. I'll definetily fix those to compliment p.<br>
      And I believe I have to go through your other commets as well, since they seem to make sense to me. But like I said, I only strated this last weekend, and really only got in touch with the overall feel of the font, so this is still in a design study stage, rather than a final product.</p>
      <p>Thanks again.</p>
