      <p>Looks nicely sober - if predictable. Reminds me of FHWA (AKA Interstate) too. And I like seeing "rationalist" (AKA mirrored) quotes.</p>
      <p>I would shorten the descenders. And the spacing is too loose (at least for print). Also, the caps are <em>almost</em> the height of the tittles; I would match the heights.</p>
      <p>hhp</p>
