  html: |-
    <p>'Lavigne Display' is the first release of a type-family aimed at publications such as interior design and women magazines—anywhere a touch of distinction is to be desired. In the opinion of its designer, glossy magazines have been boring us with the same type families for years, with only a small group of fonts being used to denote refinement and sophistication.</p>
    <p>The philosophy behind 'Lavigne' is to achieve the high contrast and other refinements observed in classic 'modern serif' typefaces, without borrowing too much from history. Accordingly, the main source of inspiration, was careful observation of pointed-pen calligraphy and sketching.<br>
    'Lavigne' is planned as an ambitious family with 2 main divisions, Display and Text. The range will cover every type-hierarchy required in modern magazine design.</p>
    <p>The six distinct styles in the Display version are published in OpenType format, featuring small caps and four sets of numbers (proportional old style, tabular old style, proportional lining and tabular lining), as well as matching currency symbols.</p>
    <p><a href="http://www.re-type.com/fonts/fonts-lavigne.html">http://www.re-type.com/fonts/fonts-lavigne.html</a></p>
    <p><img src="/sites/default/files/old-images/lavigne-newsletter3_5651.png"></p>
