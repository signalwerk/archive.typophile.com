    html: <p>No, Raph, I'm saying that the text, as used, is generic. I get dozens of these e-mails, and they all use variations of the same text. Presumably they are not all from the same person, so unless someone were to come forward and say 'I wrote the originals on which all these are based', I think these texts have long since ceased to be anyone's intellectual property. Intellectual property needs to be defended, and if it is not it ends up in the public domain before its time. <br> <br><i>[Should I be reading in a smiley the second time?]</i></p>
