    <p>Howdy folks!<br>
    I have over the past few years tried my hand at brush-lettering or hand-lettering or whatever name this kind of style goes by. I have attached a few images for clarification. I am currently involved in another project that uses a similar style and whom better to ask than the typophiles:</p>
    <p><strong>In designing hand-lettering, what must one always be aware of to make it… you know… work?</strong></p>
    <p>The things I have so far struggled with a lot are:</p>
    <ul>
    <li>Angles and incline</li>
    <li>Stroke width</li>
    <li>Connections</li>
    </ul>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/cambai_6308.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/milchhausle_5251.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/flextor_3541.png"></div><p></p>
    <p>Regarding <em>the incline</em>:<br>
    I find it challenging to measure an angle on geometric lettershapes, but downright impossible to do so on something as organic as brush-lettering. Sure, you can eyeball some kind of "optical axis", but what good is that if you need precision? It does not work too well for me, at any rate.<br>
    How do you guys do it? Come to think of it, how do you measure angles at all? I create a line at the desired incline, paste it into the mask-layer (I am a Fontlab-guy) and duplicate the around any letter I need the angle checked on. Is that beginner's stuff?</p>
    <p><em>To deal with stroke width</em>, I tend to use what Leslie Cabarga calls <em>"gauge balls"</em>, which are simply circles that you position inside your outlines to see whether they have the right amount of thickness.<br>
    Also, <em>duplicating similar curves from other letters</em> for comparison has helped me out of a few tight spots.<br>
    I also <em>try to be mindful of how the tool the was used for lettering would have spread its marks on the paper</em>, for example the drag that a brush would experience when moving through a curve, but I have yet to fing a hands on guide on where to place the apex of such a curve.</p>
    <p><em>Connections</em> are some of the hardest things to get right, because they should look convincingly real, should give the letters distinct and recognizable shapes and, usually at least, maintain a certain sense of order and yet not be too identical. Delicate balance to meet there.</p>
    <p>Please feel free to share any kind of reference, links to former threads, I really looked but found next to nothing, or your own wisdom. I am immensely curious to hear how you guys approach this problem!</p>
