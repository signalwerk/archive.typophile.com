      <p>There's a lot of public domain books available about brush lettering.  They're pretty old, but some things never change.</p>
      <p><a href="http://archive.org/search.php?query=subject%3A%22Sign+painting%22" title="http://archive.org/search.php?query=subject%3A%22Sign+painting%22">http://archive.org/search.php?query=subject%3A%22Sign+painting%22</a></p>
      <p><a href="http://archive.org/search.php?query=subject%3A%22Lettering%22" title="http://archive.org/search.php?query=subject%3A%22Lettering%22">http://archive.org/search.php?query=subject%3A%22Lettering%22</a></p>
      <p>Traditionally the connections are done last on brush lettering, after everything else has been completed.  It's not like cursive hand writing where you make the connections as you're writing the word.</p>
      <p>It wouldn't hurt to head over to myfonts and check out Sudtipos work<br>
      <a href="http://www.myfonts.com/search/sudtipos/fonts/?view=list" title="http://www.myfonts.com/search/sudtipos/fonts/?view=list">http://www.myfonts.com/search/sudtipos/fonts/?view=list</a></p>
