  html: <p>--------------------------- <br>FOR IMMEDIATE RELEASE <br>--------------------------- <br> <br>SOTA Announces Plans to Honor Hermann Zapf During Chicago, Minneapolis Events <br> <br>BUFFALO, NY, APRIL 16, 2003 - The Society of Typographic Aficionados (SOTA) has announced that it will present the first SOTA Typography Award to renowned type designer and lettering artist Hermann Zapf. The presentation will take place in Chicago on Tuesday, May 20, during an evening event featuring a lecture by Zapf and Akira Kobayashi, type director for Linotype Library GmbH. <br> <br>Zapf will team with Kobayashi to present the story behind the development of Optima Nova, and other typographic tales. Other scheduled speakers include Bruno Steinert, managing director of Linotype; David Pankow, curator of the Cary Graphic Arts Collection at the Rochester Institute of Technology (RIT); and Richard Kegler, president of P22 type foundry and chairman of the SOTA board of directors. <br> <br>This event will take place at the UIC Theatre Building, Room L285, 1044 West Harrison in Chicago. A reception will begin at 6:00 p.m., with the lecture commencing at 6:45 p.m. Admission is $35 in advance or $45 at the door, and $25 for students showing valid ID. Seating is limited, and tickets may be purchased by calling 1-888-698-8545. Organized by Dynamic Graphics as part of their educational series, the evening is sponsored by Creatas, Linotype, Rohner Letterpress, Fox River Paper Co., and STEP magazine. <br> <br>The Chicago awards presentation will serve as a prelude to a planned tribute to Zapf, which will take place later this year during TypeCon2003. Zapf, who serves as an ex officio member of the SOTA board, will be honored by friends and colleagues from around the world. TypeCon2003, SOTA's fifth annual conference, will be held July 17-20 in Minneapolis. Further conference details and online registration are available at <a href="http://www.typecon2003.com" target="_blank">http://www.typecon2003.com</a>. <br> <br>SOTA is an international not-for-profit organization dedicated to the promotion, study, and support of type design, typography, and the related arts. For more information about SOTA, please visit the website at <a href="http://www.typesociety.org" target="_blank">http://www.typesociety.org</a>, or email <a href="mailto:info@typesociety.org">info@typesociety.org</a>.</p>
