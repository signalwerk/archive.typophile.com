      <p>Hi Sindre!<br>
      Thank you so much for posting. You're right, I will add a pdf version instead, jpg is wrong with curves. When I lived there for three months, I spent a lot of time in the Vigeland park. I must have taken hundreds of pictures of the statues. I find his work so sensitive and it's almost impossible considering the size and the massive proportions of the artist's "models". Yet there is so much emotion going on, something really woke up inside me. Maybe because their attitudes are so human. </p>
      <p>I also liked Bygdoy (sorry for lack of o slash) because it's so easy to feel apart from the world there. There is a great abstract structure there that looks like a table with waves or a whirlpool. That is where I had the idea to carve my type in the material, to make it where it was supposed to stand.<br>
      I lived in Kampen and was surrouded by small shops and vintage stuff where the information was painted or made of fabrics. So it surely had some effect.</p>
