      <p>Hello again, Pascaline. </p>
      <p>I'm afraid I can't give much detailed advice on your typeface, I'm only into non-display faces myself, and have never made anything more daring than <a class="freelinking external" href="http://typophile.com/node/81129" rel="nofollow">this</a>. </p>
      <p>I think you have succeeded in capturing something vaguely Norwegian, though I can't quite point my finger to it. What I would like to challenge you on, is to make this a whole lot more irregular. Draw it again without a single straight line. Make the stems uneven. Challenge the baseline, the x-height and the cap height. Make corners soft and uneven. Make the glyphs look more like twigs. Have another look at the Mediæval runes.  </p>
      <p>Use the restrictions of your concept more to your advantage. Make the difference between the black counterspaces and the apertures less obvious. Or more obvious. Be bolder and more timid. </p>
      <p>I hope you don't feel I'm tearing your typeface completely apart. I'm not, I'm just being (too) honest because I see some potential in here that I think is not quite fulfilled. </p>
      <p>Bygdøy's indeed a treat. I hang out a lot there in summer. Did you see the work of Gustav Vigeland's younger brother <a class="freelinking external" href="http://www.emanuelvigeland.museum.no/index.htm" rel="nofollow">Emanuel</a>, by the way? If not, next time you're in Oslo, that's compulsory.</p>
