      <p>No Sindre, I haven't seen Emanuel's work. I have seen many things but don't remember hearing about this museum. Yes, I definitely need to come again and visit what I missed!</p>
      <p>Thanks for your feedback. I understand what you mean and it could actually be a way to propose variations of the typeface, considering I won't have italics. I could play with width and black letters. When I did my first version, I saw something aproaching Mediæval runes and it worked because all letters had the same x-height. I also used it on clay after I made sculpted letters and keeping the x-height helped to maintain a staight line in the text. You can see an exemple below.</p>
      <p>Hei Frode Frank, does that mean that you like it?</p>
