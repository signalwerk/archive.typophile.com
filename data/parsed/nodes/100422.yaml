    html: <p>True, on rethinking it my expectation of semicircular terminals is too narrow for the word "rounded." But at the same time I see Unit's curves as corners made into "quarter rounds," that is as arcs of a circle and thus also the same kind of "rounded" animal as a font with semicircular terminals. Satya's typeface to my eye is a different thing--more inflated than router-carved.</p>
