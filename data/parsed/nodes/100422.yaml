    <p>Hello Typophiles,<br>
    Hope you've all been good. </p>
    <p>I'm giving final touches to a new Latin typeface which has also a soft/rounded version. I was slightly confused whether I should call it  Rounded or Soft? Any suggestions? </p>
    <p>Here is how it looks:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Quantum01_6389.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Quantum02_4939.png"></div><p></p>
    <p>Thanks,<br>
    Satya</p>
