  html: |-
    <p>An experiment in satire expressed through typographic style. This recent quote from a Muslim cleric seemed custom made for the format of a Wild West wanted poster. I based the typography on actual fonts from old posters and contemporary wood-type fonts, but rendered it in walnut ink, then added my own faux Asian-Farsee brush calligraphy. Apologies to the purists, at least the text is exact, as lifted from one of the many inexact translations available at online news sites and on the crumpled up front page of the Times at my local coffee shop.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/WomenWhoLR_4131.jpg"></div><p></p>
