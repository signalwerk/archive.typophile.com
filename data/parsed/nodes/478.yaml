    html: <p>Hrant, <br> <br>Remind me to ask Jim Rimmer about chinaman's hats and matrices along with green spiders in the bath. <br> <br>You think I am joking! <br> <br>You soon are to discover strangeness was invented much earlier in the world of typography. Sometimes I think I am the only "normal person in the world". Probably that's why my grandmother called me the "lonely rose with a good set of thorns". Didn't she say the nicest things? <br> <br>Whatever your thoughts are, Jim and I can certainly offer knowledge previously unavailable to you. Hopefully that will provide a useful enough contribution that you will forgive me for my twisted sense of humour.  <br> <br>I am not as bad as I sound. Italians tease. <br> <br>I would like to meet you and all the other guys. Now about that nose guy! That is a little odd, can you adopt an ancestor? <br> <br>Gerald Giampa  <br> <br> <br> <br> </p>
