    html: <p>"I once worked with somebody who was a huge Brahe fan. What's the deal with him?"  <br> <br>Well, that's the thing. What was the deal with him?  <br> <br>His twin brother is born dead. He is given to his uncle as a son. First person, at the age of 12 or something to look at the stars holding the first printed ancient star maps and realizing they were wrong. Is able to prove this. Loses his nose in a sword fight over who is the best mathematical student. First scientist to use the printing press to print his work, papermill and all. Trains the great Dutch printer and scientific publisher, Willem Janszoon Blaeu. First to establish what we now call a scientific research facility. The King of Denmark gives him his own island and he imprisons the inhabitants. Has a couple of dwarfs for entertainment. Invents running water for the sole purpose of a practical joke on unsuspecting visitors. Has a jail under his castle. Never lets an apprentice leave the island, ever. Invents all his own instruments, of which their were very very many. His entire castle revolves to follow the movements of the stars. Contributes significantly to astronomy; on his death bed he gives his apprenctice Kepler all his data. Dies from mercury poisoning associated with the several hundred false noses he had. And I'm not even touching on the good stuff.  <br> <br>Hell, where do you start?  <br> <br>Our narrator is imprisoned in the dungeon.</p>
