  html: <p>"Gerald, I am trying to remember if you are the person who prints beautiful "works". If so, what are you up to these days? In the way of printing I mean." <br> <br>Gerald <br> <br>I don't know if I am that person either. But I did do a broadside once called Murder in the Printshop that used your Caslon 337 letterpress. Sent you a copy. <br> <br>Currently, whether I am that person or not, I am printing a book on Joseph Moxon. He said something and I respond. Sort of like an e-mail conversation, except completely under my control!!! Was great fun until I started printing.</p>
