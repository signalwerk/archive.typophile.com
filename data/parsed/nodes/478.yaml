    html: "<p>&gt; I will send the scan along to Jim Rimmer <br> <br>Please do - thanks! (And I wish I could make it to TypeCon...) <br> <br>But please do include the relevant parts of the conversation we've had here - or just point him to this thread. Although I have no doubt those are traps, I certainly don't want anybody to think that I feel the trapping there is well done. <br> <br>BTW, one more thing: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/12209.gif\" alt=\"Pascal_b.gif\"> <br> <br>These are 48, 24 and 12 point casts of Pascal, [presumably] from different foundries: the 48 and 12 are from one sample (source: Lindegren), and they have trapping (and of different scales), while the 24 is from another (source: S Carter), and it doesn't! So it was not an aesthetic decision on the part of the designer himself (and hopefully the punchcutter didn't make any aesthetic decisions on his own, certainly not at the larger sizes!), it was a technical decision on the part of the punchcutter. Or it could even have been done by the finisher of the actual sorts! Does that make sense? <br> <br>hhp <br></p>"
