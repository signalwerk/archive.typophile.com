    html: "<p>&gt; Read 24 pt. instead of 12 <br> <br>It's pretty obvious to me that the 24 point would look much more \"brisk\" (and in character, considering the overall design - again, are you familiar with Pascal?) if it had traps in the crotches between the stem and the bowl. <br> <br>Maybe you just like the mushy 70s style of font?  :-) <br> <br>&gt; My inviting him would not have the impact of your inviting him. <br> <br>? <br>You said you've been in twice-daily contact with him for a decade... Just tell him you don't have to be a member of ATypI (you don't even need to register anywhere for anything), and encourage him to join the fray. But if he doesn't enjoy \"iterative\" (as opposed to one-sided) discussion, well, that might explain why he's never heard of trapping!  :-/ <br> <br>But really, the point at which trapping started being used (I hope nobody will claim that the traps in <i>digital</i> DTL Fleischman are slips of the graver...) is secondary* - the question is if they're useful (when the right size). <br> <br>* Although a serious and deliberate analysis of very many metal fonts (not just Pascal) reveals traps in certain classic places, like inside the tail of the UC \"Q\". Soon I will show you some Palatino. <br> <br>&gt; In the corners and pinches, the shapes were terminated with a small radius, because of the revolving cutter on the pantograph. <br> <br>Anybody relying [only] on a pantograph to cut punches certainly doesn't care about admittedly secondary refinements such as traps. But refinements nonetheless. <br> <br>&gt; a pattern has a mistake and it is used for multiple sizes, the \"mistake\", allow me, will be multiplied. <br> <br>But: <br>1) My point was that the 24 doesn't have trapping (at least not to the extent that the 48/12 do), so it wasn't an aesthetic decision (like you proposed). <br>2) The traps in the 48 and 12 are different. <br> <br>Also remember: Mendoza y Alemeida drew separate versions for different sizes - or least small ranges - certainly the 48 and 12 weren't from the same drawing. The really good guys didn't rely on the pantograph too much. <br> <br>&gt; His cure is worse than the ailment. <br> <br>At 60 point especially, the traps -certainly the one in the \"b\"- are indeed too big. But there would have to be a difference of a couple of bottles of Muscatel for the guy to be so bad at cutting on the \"b\" and then so fine on the \"A\" for example. <br> <br>The point isn't how badly/well the cutter did his job, the point is the <i>intention</i>. And to me it's crazy to claim it wasn't there. <br> <br>&gt; Jim and I can certainly offer knowledge previously unavailable to you. <br> <br>Certainly, and I appreciate that greatly. The one thing I'm most anxious to learn about involves something on your site: \"One of Lanston's</p>"
