    html: <p>Hrant, <br> <br>Actually decades of double daily discussions with Jim. Remember he was involved in the Giampa Textware days. But for the last decade I have seen Jim maybe twice, and only briefly. <br> <br>For absolute accuracy nothing could beat a Benton Pantograph. The specifications were beyond reproach. Far smaller than the human eye could perceive. For instance the tolerances of measurement was no more than 1 / 100,000 of an inch. The measuring scale is 2 feet long in degrees so fine that it requires a microscope to read them. Technology used in punch cutting for mechanical type manufacture had tolerances and requirements far in excess of what is humanly possible. <br> <br>Furthermore in setting up the tool to measure it must be sent to the standards bureau in France. The freight, because of the heat requirements and vibration prevention cost us over $2700. and that does not include the cost of adjustment. The device must be in a constant operating temperature, the work to be measured had to be in the same room until it reached its own room temperature. <br> <br>Sure we cared about type. You bet.  <br> <br>You would kill for the dedicated comparator. This was a special magnification device for viewing types or matrices. It might not agree with your theory however. <br> <br>The height-to-paper machine was also a microscopic device. If you made a slight mistake in motion you could loose the face of the matrice for weeks, literally. Tiny matrices became a moonscape. <br> <br>You have to understand the importance that mechanical typesetting was to mankind. You speak of the reading public. Without systems of which I speak we would all be illiterate. Spacing was also far superior in a Monotype than hand-set. I resisted that thought but soon came to appreciate the systems that were developed. <br> <br>These matters are an entire new area of discussion. There is a book you should read by Krimpen that was put together by John Dreyfus. It deals with this very topic in letter form back and for with someone you are biased against. Stanley Morison. I enjoyed Krimpen</p>
    html_clean: <p>Hrant, <br> <br>Actually decades of double daily discussions with Jim. Remember he was involved in the Giampa Textware days. But for the last decade I have seen Jim maybe twice, and only briefly. <br> <br>For absolute accuracy nothing could beat a Benton Pantograph. The specifications were beyond reproach. Far smaller than the human eye could perceive. For instance the tolerances of measurement was no more than 1 / 100,000 of an inch. The measuring scale is 2 feet long in degrees so fine that it requires a microscope to read them. Technology used in punch cutting for mechanical type manufacture had tolerances and requirements far in excess of what is humanly possible. <br> <br>Furthermore in setting up the tool to measure it must be sent to the standards bureau in France. The freight, because of the heat requirements and vibration prevention cost us over $2700. and that does not include the cost of adjustment. The device must be in a constant operating temperature, the work to be measured had to be in the same room until it reached its own room temperature. <br> <br>Sure we cared about type. You bet.  <br> <br>You would kill for the dedicated comparator. This was a special magnification device for viewing types or matrices. It might not agree with your theory however. <br> <br>The height-to-paper machine was also a microscopic device. If you made a slight mistake in motion you could loose the face of the matrice for weeks, literally. Tiny matrices became a moonscape. <br> <br>You have to understand the importance that mechanical typesetting was to mankind. You speak of the reading public. Without systems of which I speak we would all be illiterate. Spacing was also far superior in a Monotype than hand-set. I resisted that thought but soon came to appreciate the systems that were developed. <br> <br>These matters are an entire new area of discussion. There is a book you should read by Krimpen that was put together by John Dreyfus. It deals with this very topic in letter form back and for with someone you are biased against. Stanley Morison. I enjoyed Krimpen</p>
