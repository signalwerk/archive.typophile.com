    html: <p>Thank you for your valuable input. <br> <br>&gt; he is a no nonsense punchcutter <br> <br>Good, good. <br>I hope that his duly respected skills at punchcutting are matched by a grasp of past practice, of how some other people have chosen to cut type. Many good digital type designers don't use traps - but even they have to admit that some others do! <br> <br>&gt; Perhaps his cutting was intended for someone not so thrifty with tins of ink! <br> <br>I agree (and I already stated) that I think the traps there are too big. <br>But at least this way we have more proof that they -and the <i>intentions</i>- were there! <br> <br>On the other hand, I think you would agree that people tend to use too much ink (and pressure) more often than too little, no? That at least is [the other] Gerald's view, and he's not a dilettante like me! <br> <br>&gt; Can you tell one from the other? <br> <br>No, and it's things like this where I need the most help, from people like you. <br> <br>My only faint clue here is that -according to the director of Neufville as well as a former student of his- Mendoza y Almeida drew all the necessary sizes (or at least very narrow ranges) himself. How would this have affected the role of the pantograph? And coming around to that issue I wanted to one day approach you with, how might Benton's so-called "cutting slips" (mentioned in Rehak's book) be relevant here? (So maybe today is the day then! I wish I had a Cessna to fly to Finland...) <br> <br>&gt; Working away from a crotch enacts a digging motion. Work into a crotch there will is a lifting motion. <br> <br>This is very interesting, and I admit very logical. But a good punchcutter (or the pantograph?) would be able to reduce/eliminate this effect, no? I have many questions - much to learn... Where exactly do you see the effects of this phenomenon you describe in the Pascal 60? Maybe in the fact that the "b" has a much deeper cut than the "d"? It might be important here to state explicitly that the scan has been flipped horizontally, for easy decipherment of the letters. <br> <br>But it also seems like some shapes have symmetrical cuts (both with respect to their flanking sides as well as with respect to the location on the letterform), irrespective of cutting direction. And also, some shapes (not necessarily the ones I've scanned) are missing traps/nicks where I would expect to see some - these are generally secondary ones, like the asterisk, but sometimes it seems like they just forgot (which also happens in digital too, like in the DTL Fleishmann I mentioned). <br> <br>&gt; The 12 point appears natural <br> <br>? <br>It has a huge trap! <br>And remember, that was a <i>print</i>. <br> <br>&gt; I ask again whether the type was cut and then "electroplated" or just "punched". <br> <br>I would have to ask Henk Gianotten, who used to work for Tetterode before they went under. <br> <br>&gt; Font le Roy, San Francisco you will see sparkling "ink trapless" type. <br> <br>Could you elaborate on this? <br> <br>hhp <br></p>
