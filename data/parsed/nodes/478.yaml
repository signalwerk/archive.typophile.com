ure(s) have given the design the intended emotions of the designer. Cutting emotions. I suggest a more finished look  would have greatly reduced its appeal. <br> <br>If you view the crotch in the Q you will see a place where it would "certainly deserve" the "ink trap treatment" you refer to "if the punchcutter believed as you".  <br> <br>I see a punchcutter seeking a-cut-look-&amp;-feel to his letterforms, and getting it. Forgiving people such as yourselves for mistaking them to be either faults, or "in your(s) case(s)" inktraps in order to achieve the characteristic nature of the letterforms that have drawn our attentions. By the way, which because of the tooling, are acidly beautiful. <br> <br>You have to love it for what it is, not for what you want it to be. You should remember that boys, and the girls shall be forever thankful. <br> <br>There is an acid sharpness throughout, and I suspect lots of "gravure", little "file".  <br> <br>There is a general crudeness throughout and if you notice the "h" has another mis-cutting on the top left curve. Also if you view the beard of the same character you will see a flatness on the lower portions of the gravure straightening into perpendicular at the top of the stroke meeting close to the same error. He is giving a lot of meaning to free handing and that I believe issues much of the beauty of this particular typeface.  <br> <br>I highly recommend that some of you consider cutting types yourselves. The impossibility is merely an obstacle in your minds. But remember, there is few of us left. Contact Jim Rimmer. <br> <br>Gerald Giampa <br>Lanston Type Company</p>
