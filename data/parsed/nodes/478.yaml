    html: "<p>Hrant, <br> <br>Seems as if Jim Rimmer has been following this topic. I was unaware of that, however I previously suspected he wrote a smallish note. Now I think I was wrong, perhaps. Hmm, the feeling seems to be a weak feeling. <br> <br>Someone other than myself should invite him to participate. He mistakenly thinks you have to be a member of ATPi. My inviting him would not have the impact of your inviting him. After all, I suspect I may have outworn my welcome. You may have concluded that yourself. <br> <br>But I feel his inclusion would contribute very fine value. Hopefully you will not hold me against him. He has his own opinions, his own observations which are his alone. <br> <br>Also I reserve the right to disagree with him. I am, after all, as you may have noticed, a disagreeable sort of fellow. <br> <br>***** <br> <br>Here is the e-mail he sent me. I trust he has no objection. <br> <br>Gerald: <br> <br>I've been following your intense messaging back and forth with Hrant Papazian about the ink-trapping situation. <br> <br>I am certain that no such thing existed in metal type. I certainly recall that in using your comparator to re-drawe letters for you from your Lanston punches that just the reverse was true. In the corners and pinches, the shapes were terminated with a small radius, because of the revolving cutter on the pantograph. <br> <br>It seems that Lanston did not deem it necessary to hand-nick out these tight spots. You and I both know that a person can print with no problem with Monotype type. It's all in the hand of the pressman that scoops the ink out of the can. A little bit goes a long way. I don't think it has ever been the responsibility of the type  manufacturer or punch cutter to try to anticipate with how much vigor and enthusiasm the pressman applies the ink. <br> <br>Since I am not a member of ATypI I cannot get involved in the forum. Perhaps that is a good thing. There is slittle to be gained from getting heated about a thing like that. <br> <br>I finally got finished with the job of cutting flat mat accents for 18 point Nicholas Cochin for Lucy lambert, and am now involved in the alignment and <br>fitting of the 14 point Cartier Roman font that I cut 14 point flat mats for last month. I have to gop back and recut a few letters, but overall it is <br>looking quite good. <br> <br>It will be necessary to hand rub all the casting becasue of the leave created by directly engraving flat the mats. If more than a few people are interwsted in buying type, I am going to ship the type in individualbaggies, and send each buyer a free file along with the type. <br> <br>Hope all is well with you in your new island paradise. Drop me an E. <br> <br>Jim <br>******* <br> <br>Yes Jim, we both seem to agree that ink is far to cheap. I think the pigment should be made from burnt flesh from \"errant pressman\". Then maybe types would cease to be tortured making the world a prettier place for our children to read in. <br> <br>Isn't that a romantic thought? Maybe I should write poetry. Do you like poetry Jim? <br> <br>Gerald Giampa <br>the Lanston Type Company <br> <br></p>"
