    html: <p>Hrant,  <br> <br>I see what you see, only I read it differently. I see cleaning out the corners. The metal must be clean or it will not relieve when cast. It will "hold" when the type is removed. What I can see is evidence of gravure slippage, or manipulation error on the top crotch of the "h".  <br> <br>On the "b" if your theory was correct the punchcutter has lost control. Please draw your eye to the top bowel-crotch of the ascending stem. Either the top crotch is an error, or the bottom crotch an error? Take your pick. There is no need for one without the other. If you take issue to the nature of stems and placement compare the situation on the companion areas of the "d". <br> <br>So no more yeah buts . . . please! <br> <br>If "ink trapping" were "the intention" the application "should be even". His work, as you can easily see, is not that fussy. <br> <br> <br>Or, lots of theory, little ability to apply.  <br> <br>Meaning this artifact lends little support to your hypothesis. If he is cutting ink trapping intentionally he should have enough skills to apply his principals evenly throughout. I am not disparaging the beauty of his letterforms in fact the cut-look-&amp;-feel is integral to the very beauty. The crudeness is in effect, much more than secondary to the design. <br> <br>But "ink trapping", come come. <br> <br>These letters are much as if they were cut in linoleum or wood. Those are the characteristics which come easily when using similar tools such as a gravure. There are large and small gravures. Tools, including needles are used in small point sizes or tight areas. These cuts are "humongoumamouth".  <br> <br>Looking at these letterforms I see forms worked by mostly a single gravure, large by type cutting standards. Certainly it, possibly them, would be used only in the crudest of work when cutting an 8 pt. character. Probably, not even then.  <br> <br>The very nature of these letterforms does not required fine gravures. The large gravure(s) have given the design the intended emotions of the designer. Cutting emotions. I suggest a more finished look  would have greatly reduced its appeal. <br> <br>If you view the crotch in the Q you will see a place where it would "certainly deserve" the "ink trap treatment" you refer to "if the punchcutter believed as you".  <br> <br>I see a punchcutter seeking a-cut-look-&amp;-feel to his letterforms, and getting it. Forgiving people such as yourselves for mistaking them to be either faults, or "in your(s) case(s)" inktraps in order to achieve the characteristic nature of the letterforms that have drawn our attentions. By the way, which because of the tooling, are acidly beautiful. <br> <br>You have to love it for what it is, not for what you want it to be. You should remember that boys, and the girls shall be forever thankful. <br> <br>There is an acid sharpness throughout, and I suspect lots of "gravure", little "file".  <br> <br>There is a general crudeness throughout and if you notice the "h" has another mis-cutting on the top left curve. Also if you view the beard of the same character you will see a flatness on the lower portions of the gravure straightening into perpendicular at the top of the stroke meeting close to the same error. He is giving a lot of meaning to free handing and that I believe issues much of the beauty of this particular typeface.  <br> <br>I highly recommend that some of you consider cutting types yourselves. The impossibility is merely an obstacle in your minds. But remember, there is few of us left. Contact Jim Rimmer. <br> <br>Gerald Giampa <br>Lanston Type Company</p>
