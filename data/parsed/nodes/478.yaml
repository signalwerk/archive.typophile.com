    html: <p>Gerald <br> <br>My last book project with metal was around 1998, I think. Started using photopolymer in 1991.  <br> <br>Photopolymer is just a great printing surface; with a platemaking machine it's like having your own Monotype caster but not being limited to Monotype. And desktop publishing software and digital type is a blessing, is now and has been for some many years. <br> <br>Well, yeah, Moxon will be prohibitively expensive. About a grand. When you are printing a book with a hand-operated press and using handmade paper that cost $7.50 a sheet, and it sucks up a couple years of your life, yeah, it gets expensive. On our last book, a speculative book on the proof of Gutenberg, I think my partner and I spent around $70,000 on a book that was printed in an edition of 146 copies. Now that's a risky investment when you are not making a book that is intentionally directed at any market whatsoever. More like, this is what we want to do and this is what we have to do, so let's get down on our knees and pray.  <br> <br>Basically, just an idiotic career choice. <br> <br>A wish-we-could book currently in research stage is on the 16th century astronomer Tycho Brahe!!! A very interesting and strange and important fellow. We will have a lot of fun with this one. Well, at least, initially. <br></p>
