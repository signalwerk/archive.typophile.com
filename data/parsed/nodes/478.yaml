    html: "<p>&gt; Very nice scanning job. <br> <br>Long live Agfa. It's a damn shame they don't make scanners any more. I just wish I'd gotten one of their higher-end ones (1200 dpi) before they stopped. <br> <br>ATF Garamond: will look soon.  <br> <br>-- <br> <br>&gt; I see cleaning out the corners. <br> <br>My friend, don't make me give up on you. Those are classic traps. Why so much resistance? Is your stance that trapping doesn't even exist, that it's only my imagination? Come on. The traps in that font are all over the place, but nowhere that they don't belong: there's nothing \"mistaken\" about it. <br> <br>On the other hand, the traps are indeed too big for that point size, and also, it's simply not a very good trapping job in terms of maintaing size and shape - it's hard to do consistently, which is probably one reason not many people do it. Look at the trapping in DTL Fleischmann, a digital face where there is no graver to slip: it's all over the place. <br> <br>BTW, Pascal is not a \"crude\" face, intentionally or otherwise. Are you at all familiar with it? <br> <br>&gt; If you view the crotch in the Q <br> <br>So you've failed to see the trap there? What about the micro-traps around the join of the \"f\"... Ah, you'd missed those too. :-&gt; And what about on all three corners (not just the top) of the counter of the \"A\"?... <br> <br>&gt; the \"h\" has another mis-cutting on the top left curve. <br> <br>That's just damage. I know because I did it. <br> <br>Don't see what you <i>want</i> to see, eh?  :-) <br> <br>BTW, the 30 point has similar trapping... <br> <br>hhp <br></p>"
