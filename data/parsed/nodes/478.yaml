    html: "<p>&gt; For absolute accuracy nothing could beat a Benton Pantograph. <br> <br>But it couldn't reproduce a sharp inside corner, right? <br> <br>&gt; Spacing was also far superior in a Monotype than hand-set. <br> <br>I don't know anybody else who thinks that. <br> <br>&gt; The samples you have provided would have never met the rigid controls of either of the two Monotypes. <br> <br>One more time: I don't care about the quality of the execution, just the nature of the intention. <br> <br>I don't discredit the pantograph more than I discredit the technology of television, or even a kitchen knife for example; it's not the tool, it's what you do with it. The pantograph wasn't guilty of anything - the Benton boys even tried to get people to use it properly - but they failed: people used it to save effort/money, nothing more. Even though the pantograph's technology allowed for it, optical sizing died - it simply became too easy <i>not</i> to do it anymore. So this tragedy happened way before phototype. <br> <br>hhp <br></p>"
