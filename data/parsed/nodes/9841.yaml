  - id: 148793
    user: 1203
    date: 2005-03-19T10:27:00
    date_raw: 19.Mar.2005 10.27am
    votes: null
    html: <p>This is Elderkin by Eric Olson / Process Type Foundry. For some reason it's not available on his site any longer. I purchased it before it was removed. Another alternative would be Ultramagnetic <a href="http://youworkforthem.com/product.php?sku=T0020" target="_blank">http://youworkforthem.com/product.php?sku=T0020</a> or Garage Gothic from Font Bureau <a href="http://www.fontbureau.com/fonts/GarageGothic" target="_blank">http://www.fontbureau.com/fonts/GarageGothic</a>. Mike's idea is also a good one, if you just need to set a headline or short bit of text you could try Trade Gothic Condensed Bold and round the corners in Illustrator or Freehand for a similar feel.</p>
    html_clean: <p>This is Elderkin by Eric Olson / Process Type Foundry. For some reason it's not available on his site any longer. I purchased it before it was removed. Another alternative would be Ultramagnetic <a href="http://youworkforthem.com/product.php?sku=T0020" target="_blank" class="link-external">http://youworkforthem.com/product.php?sku=T0020</a> or Garage Gothic from Font Bureau <a href="http://www.fontbureau.com/fonts/GarageGothic" target="_blank" class="link-external">http://www.fontbureau.com/fonts/GarageGothic</a>. Mike's idea is also a good one, if you just need to set a headline or short bit of text you could try Trade Gothic Condensed Bold and round the corners in Illustrator or Freehand for a similar feel.</p>
