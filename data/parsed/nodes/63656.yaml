    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lucecitaManiac_4254.jpg"></div><br>
    Hello typophiles, Cocijotype has released Lucecita, a led screen based typeface with 3 styles, Regular (Healthy), with kernings; Maniac Foreground and Maniac Background, both of them with no kernings. It's available at <a href="http://new.myfonts.com/fonts/cocijotype/lucecita/" rel="nofollow">MyFonts</a>. Have fun!<p></p>
