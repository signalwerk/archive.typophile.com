      <p>James Mosley pointed out that Roycroft had some alternative characters. It isn’t a text face though and I don’t know that I approve of all of them. Hmmmm. </p>
      <p>My goodness! -  but that font Lightline sure is pretty! It even reads well - far better than helvetica I would say, and interestingly it shares a surprising number of formal characteristics with it.</p>
