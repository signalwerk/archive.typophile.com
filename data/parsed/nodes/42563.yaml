      <p>Eben —</p>
      <p>I’ve never seen the 1912 ATF. You should really try to get yourself a 1923 book. That’s the seminal one. </p>
      <p>Does the 1912 show full character sets? The sets in the 1923 show all f-ligs where applicable, and alternates for more decorative faces.</p>
      <p>— K.</p>
