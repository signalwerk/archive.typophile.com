    <p>I have been going over the 1912 ATF catalog to see what ligatures and contextual shapes might be lurking. But while I do find the odd ff lig, st lig and ct lig in the examples of type in use, the specimen sheets themselves don’t show them. </p>
    <p>Do they show up in a supplement edition, or a specific year’s catalog?</p>
    <p>Where should I be looking do you suppose?</p>
    <p>Thanks!</p>
