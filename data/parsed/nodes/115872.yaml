      <p>If you count printing musea, there are quite a few of those in various countries. For instance Basel has the Swiss museum for paper, writing and printing, in an old paper mill:<br>
      <a href="http://www.papiermuseum.ch/index.php" title="http://www.papiermuseum.ch/index.php">http://www.papiermuseum.ch/index.php</a><br>
      And during ATypI Dublin we visited the Irish Printing museum:<br>
      <a href="http://www.nationalprintmuseum.ie/" title="http://www.nationalprintmuseum.ie/">http://www.nationalprintmuseum.ie/</a></p>
