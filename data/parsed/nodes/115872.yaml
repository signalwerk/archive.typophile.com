    <p>I'd like to start a topic about museums dedicated to typefaces.<br>
    Many typeface museums were originally foundries.<br>
    Share with us your experience and opinion of such museums.<br>
    Let's draw a map of these establishments.</p>
    <p>1. Which typeface museums do you recommend from your perspective?<br>
    2. What are the must-see in that field?</p>
