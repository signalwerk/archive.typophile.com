      <p>And in the US, Hamilton (god do I want to go)<br>
      <a href="http://woodtype.org/" title="http://woodtype.org/">http://woodtype.org/</a></p>
      <p>Germany has Klingspor and Gutenberg Musea<br>
      <a href="http://www.klingspor-museum.de/EUeberdasMuseum.html" title="http://www.klingspor-museum.de/EUeberdasMuseum.html">http://www.klingspor-museum.de/EUeberdasMuseum.html</a><br>
