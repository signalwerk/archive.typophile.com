    html: <p>Well, for one thing Interstate has a very strong automotive/transportation connotation*, which might be good or bad depending on what your company does. But also on the formal level I think Interstate is problematic here. I think you need something more "rational", more contemporary. BTW, if you're going to use the font for significant amounts of text, choose a serif one. <br> <br>* At least in the US. <br> <br>BTW, wouldn't the logo be better with no extra space in "SY"? <br> <br>hhp</p>
