    html: <p>I don't agree that a serif font would be necessarily good for large amounts of text. <br> <br>It may be controvertial to say this but the idea that a serif font is more readable is very much old-school thinking. Modern research, apparently, suggests that there's no significant difference in legibility between serif and sans today. Remember, "People read best what they read most", and there's such an abundance of both serif and sans serif fonts out there in use everyday. <br> <br>I subscribe to the principle of identity between content and expression, so the font you choose should reflect the kind of work you do. If it's technology or design orientate, then a Sans Serif is often more appropriate. Unless your design is distinctly retro of course.</p>
