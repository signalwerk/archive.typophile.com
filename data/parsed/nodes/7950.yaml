    html: <p>I'd say absolute nothing is a 100% priority. Absolute anything doesn't even exist! So I totally agree that legibility and readability are simply factors in the balance of compromises that is Design. I for one have no problem making something intentionally hard to figure out - as long as you do it for a good reason. Not because you think breaking stuff is cool. <br> <br>That said, when it comes to something like a novel, I think the performance difference between sans and serif is actually quite large. <br> <br>hhp</p>
