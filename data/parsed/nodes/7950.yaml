    html: <p>To me the aggregate of data, experience and intuition tells me that serifs help reading. There are bits of empirical research (not much, unfortunately) that makes sense in the context of what most typographers believe about reading and many people believe about human nature. The tons of empirical research that point away from the bouma (letter-cluster-shape) model of reading are simply flawed when you analyze the details; but they shouldn't be ignored outright (even though that's what most empiricists do with anecdotal experience, sadly), they should be assimilated. Every bit has to make sense. And in the bouma model it does. <br> <br>There's no Proof of this (yet). But I for one think that proof is for lab rats. On the other hand, saying "it justs makes sense" is indeed unfair - it's just difficult to elaborate all the time, especially since this is <i>not</i> actually a simple topic - not at all. It's like E B Huey said almost a hundred years ago, but sadly academic hubris tends to impede self-doubt, tends to put aside the very real paradox that numbers don't lie simply because numbers don't say anything - we just hear them say things, and sometimes we hear what we expect. <br> <br>I guess a good way to arrive at usable (if tentative) practical conclusions is to strike a balance between personal research and trusting others who have done more research. The former helps gauge the reliability of the latter, and so does putting the latter in context. In my view cognitive scientists can be trusted to generate reliable <i>data</i>, but are not in a position to interpret the data properly, simply because they (generally) lack any anecdotal experience to guide them. They work with assumptions (something inescapable) that originate in a vaccum, or from their own personaly (non-typographic) experience. <br> <br>Whatever you do though, please don't be afraid to leave the house because you have no proof that a car won't hit you. <br> <br>hhp</p>
