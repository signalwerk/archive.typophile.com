    html: "<p>I'm not even remotely old-school, and I have no doubt that serifs help readability. And I believe this not based on much empirical data (99% of it is totally flawed) but based mostly on plain old <i>thought</i>: when you analyze it (for many years), it simply makes sense. <br> <br>Furthermore, the Emigre mantra is over-simple to the point of being false. It serves mostly as an escape from responsability. Not to mention that none of its proponents have spent more than 5 seconds analyzing Familiarity... But you know what's really ironic? The most fiercely anti-Emigre school (the chirographers) uses the Familiarity escape clause to believe in the exact opposite thing! But of course they haven't thought about it much either... <br> <br>&gt; the font you choose should reflect the kind of work you do. <br> <br>Of course. But this is only one piece of the puzzle. <br> <br>hhp</p>"
