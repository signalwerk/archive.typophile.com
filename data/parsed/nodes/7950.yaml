    html: <p>Glad I asked. <br> <br>Don't you think though, that in marketing communications at least, absolute legibility is, more often than not, not an absolute, 100% priority? Not least because the drop in readability between a conventional serif and sans serif font, if either measured mathematically or judge intuitively, must surely be minimal.  <br> <br>The appropriate level of readability is also just one part of the puzzle. <br> <br>The influence a well chosen font has on an identity or brand is significant and isn't that the context of Henrik's original question, which I don't think we've answered (quite possibly my fault).  <br> <br>Henrik, if you're still there, I'd suggest Frutiger, Bliss or perhaps even Berthold's Imago. None of them are particularly "new" but are clean, legible, look contemporary and are well designed. Each has a good range of weights and should be readily available for both Mac and PC from any good font supplier.</p>
