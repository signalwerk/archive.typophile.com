    html: <p>Hello Noel &amp; welcome to Typophile. <a class="freelinking external" href="http://www.typography.com/fonts/font_styles.php?productLineID=100036" rel="nofollow">Vitesse</a> is a retail font distributed by Hoefler &amp; Frere-Jones type foundry. It's not a free font and you have to buy it through their <a class="freelinking external" href="http://www.typography.com/fonts/font_styles.php?productLineID=100036" rel="nofollow">website</a>. Though, on their website you cannot order just the bold weight, however I believe that they are reasonable people and if you really need the font you could <a class="freelinking external" href="http://www.typography.com/ask/faq.php#Ft_11" rel="nofollow">contact them</a> with your enquires. Good luck!</p>
