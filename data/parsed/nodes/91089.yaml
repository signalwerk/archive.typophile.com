    votes: null
    html: |-
      <p>Heh. Can I make something with more style? That will remain a lifelong challenge. My answer for today is: not without more training and much more practice. Or I could give money to someone competent.</p>
      <p>I have taste, but my skills are elsewhere.</p>
      <p>The point of the alternating colors (and yes, this works OK in b/w) is to mimic the practice of Jazz/Blues improvisers passing solos back and forth, 4 (or 8) measures at a time. Making the /g/ into an /8/ -- plus the fact that there are two of them and they can be different colors -- just helps add to it. (They <em>traded</em> the /8/s.) To my mind. Maybe the whole thing is too much of an inside joke.</p>
      <p>So yeah, I like the alternating option too.</p>
      <p>Thanks <em>so much</em> for the feedback. I appreciate that y'all took the time.</p>
