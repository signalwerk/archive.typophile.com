      <p>Get a hold of the old issue of Emigre magazine where it was premiered. (BTW, I happen to have a letter-to-the editor about the font in a subsequent issue, but I forget the issue number, and it's too deep in the garage to bother looking for. :-)</p>
      <p>One thing I've heard about Filosofia (correct spelling) is that Licko offered it to some large OEM font supplier (it was either Bitstream or Monotype) for inclusion in a future version of Windows, but was turned down. But that could just be a rumor, so you'd need to do the research... and hope the right people tell you the truth. Maybe now that Licko is retired from type design (?) such details -or denials- will flow more freely.</p>
      <p>hhp</p>
