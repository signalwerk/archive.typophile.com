    <p>Hey there!</p>
    <p>I'm a new and learning designer just taking my first typography class.  It is something I am really enjoying.<br>
    As part of my class, I was assigned a typeface to study and do research on and present as my final project.  The face I was given is "Filosophia."  It is a beautiful one and I know it was developed by Zuzana Licko of Emigre Fonts in the 1990's.  I also know that it was inspired by the classic "Bodoni."  Outside of that, I have found very little information on Filosphia itself.  </p>
    <p>Does anyone know of any books that include information about it or its history?  Are there any groups, or communities dedicated to Filosophia?  How about any valid websites?</p>
    <p>Thanks for the help!</p>
