      <p>Hrant: <em>One thing I've heard about Filosofia (correct spelling) is that Licko offered it to some large OEM font supplier (it was either Bitstream or Monotype) for inclusion in a future version of Windows, but was turned down.</em></p>
      <p>I've not heard that story. Just possibly it is a confusion arising from Filosofia being the basis for asking Microsoft to register the <a href="http://www.microsoft.com/typography/otspec/features_uz.htm#unic" rel="nofollow">'Unicase Forms'</a> OpenType Layout feature. That was accepted, of course, but support for the feature in apps has not followed (it will be available for webfonts with CSS3 though).</p>
