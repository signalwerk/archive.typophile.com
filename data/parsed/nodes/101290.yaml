    html: <p>I can't remember exactly when we registered the {unic} feature, but my guess is around 1998-99. Implementation lag has been a perennial complaint for a lot of OpenType Layout features for the past 15 years. In the case of a feature like {unic} though, support is less likely than most because, in a traditional desktop word processing or page layout app it is the sort of thing that needs UI real estate, but there are, what, two typeface families that use it?</p>
