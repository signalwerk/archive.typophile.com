      <p>KEEP YOUR FORM AND YOUR FUNCTION.<br>
    INTRODUCING NEUTRAFACE NO. 2</p>
    <p>Neutraface No. 2 is an extension of the Neutra legacy, where form and function meet at the nexus of practicality and versatility. It is by no means intended as an improvement or replacement of the original Neutraface, but as an expansion of the original concept. Neutra’s highly sought-after residential and commercial designs have stood the test of time, as will the typography that bears his name.</p>
