  html: <p>I overwrote the Data/preview.txt file in fontlab and want it back! if someone can post it, that would be great. However, I thought I'd also ask what other text strings you use when tweaking metrics and kerning. So...aside from the default preview.txt, are there any text strings you've found especially useful when tweaking metrics and kerning?</p>
