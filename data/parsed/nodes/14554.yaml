    html: |-
      <p>I usually find an n and an o neclace to be quite helpful.  This is something I learned in Caligraphy from Arnold Bank. The purpose in caligraphy is as a pracrice excersize but find it is a good way to check side bearings,<br>
      In case "Neclace" is not self evident; the idea is to type out the alphabet with a letter N between each letter and then the same with o.<br>
      ANBNCNDNEN...anbncndn... AOBOCODOEO... aobocodoeo...</p>
      <p>ChrisL</p>
