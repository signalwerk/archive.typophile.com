  html: <p>The font was used on the labels that pharmacists typed up and stuck to medicine bottles.  I live in Australia but I don't think that the typewriter was made locally!  I also remember seeing the typeface in a World War II US Army training manual that I saw on Ebay.  I can't find the pics now.  Ah, childhood memories...</p>
