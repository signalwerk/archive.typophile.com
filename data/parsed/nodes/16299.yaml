    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Hannes Famira</strong></p>
    <p>Type designer and lecturer. Educated at the <a href="/wiki/Royal%20Academy%20of%20Art" class="freelinking" rel="nofollow">Royal Academy of Art</a> in The Hague (<em>Den Haag, </em> The Netherlands), he has taught type design and new media at the <a href="/wiki/SfG" class="freelinking" rel="nofollow">SfG</a>, Schule für Gestaltung in Basel, CH as well as Lettering and Typedesign at the <a href="http://www.njcu.edu/dept/art/" target="_blank" rel="nofollow">NJCU</a> New Jersey City University. Hannes runs the website <a href="http://www.typEdu.org" rel="nofollow">www.typEdu.org</a> and the <a href="/wiki/kombinat-typefounders" class="freelinking" rel="nofollow">kombinat-typefounders</a>. He currently teaches <a href="http://www.cooper.edu/ce/design.html" rel="nofollow">Digital Typedesign</a> and Experimantal Typography at the <a href="/wiki/Cooper%20Union" class="freelinking" rel="nofollow">Cooper Union</a> and Typography at CUNY.</p>
