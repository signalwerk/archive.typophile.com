      <p>It could be your Wacom tablet Kristian. I had problems with loads of software including Fontlab 5.0.2 after installing Tiger.</p>
      <p>I spent ages on the phone to Apple support before figuring there was a conflict somewhere.</p>
      <p>I fixed it by downloading a new Wacom driver from the Wacom website. Everything works fine now.</p>
      <p>Nick Cooke</p>
