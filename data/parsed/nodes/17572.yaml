    <p>So, recently my school, Princeton Theological Seminary, changed its logo. I'm curious to see what you all think about the change. I'm not the designer, and I don't know him or her personally. </p>
    <p>I'm curious about a few things: </p>
    <p>1. What do you think the change is trying to communicate/emphasize?<br>
    2. What do you think the new logo says? What impression does it give you of our institution? </p>
    <p>Sadly, I've not yet discovered how to imbed images into typophile threads, so bear with me as you click on the images, cleverly named "oldlogo" and "newlogo." </p>
    <p>I love reading your critiques and opinions. Have at it...</p>
    <p>Traci </p>
    <p>PS For information on Princeton Seminary and how it is or is not consistent with the logo, check out <a href="http://www.ptsem.edu/About/" title="http://www.ptsem.edu/About/">http://www.ptsem.edu/About/</a></p>
