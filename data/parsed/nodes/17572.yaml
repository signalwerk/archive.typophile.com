    html: |-
      <p>I looked at your website link and the use of the logo seems very small. It also appears to have a drop shadow, which I would definitely lose, it doesn't contribute anything, in fact given the size of the logo means that the deep red colour is darker than that of the text. The vertical line, dividing the mark and the text, is too tight to the mark, especially given the tracking you have applied to the text.<br>
      It is an improvement over the old logo, the mark is much better and the type seems more appropriate.<br>
      Tim</p>
