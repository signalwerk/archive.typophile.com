    <p>This project is just in the beginning stages. It's for my brother in law so it's not anything that's on a time limit, it's just something I've began and I'm having fun with.</p>
    <p>He's a commercial real estate appraiser who works for himself. Basically this logo would only be for letterhead, business cards and a cover sheet for the actual appraisals themselves. </p>
    <p>His initials are e and g. He said he'd like to keep his name in it instead of adding an abstract shape. So I'm playing with his initials to create a shape. I like the way the lower case e and upper case G were essentially the same shape when mirrored. </p>
    <p>Obviously number 1 is just getting the letters on there and the rest were taken from there.</p>
    <p>Does anyone have any thoughts? </p>
    <p>A tagline will be added below with the full company name, but I'm not there yet.</p>
