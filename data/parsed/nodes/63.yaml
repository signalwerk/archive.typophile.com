    <p>FOR IMMEDIATE RELEASE <br>1 April 2002 <br> <br>San Francisco, CA -  In an unprecedented move today, Microsoft has formally announced the acquisition of internet property Typophile (<a href="http://www.typophile.com" target="_top">http://www.typophile.com</a>) as part of it's .type integration package. <br> <br>"We plan to own the online typography space," commented Dan Simons, "and acquiring Typophile was a move we've had on the boards for over a year now."  <br> <br>"There are several other typography sites that we have our eye on, " Simons continued, "and we're currently negotiating with Lines &amp; Splines, Typographer.com, and a few others we can't mention right now. But let's just say that if Jonathan Hoefler hadn't grabbed the typography.com domain name eight years ago, we could have saved a lot of money." <br> <br>As part of the deal, Microsoft acquired all assets associated with Typophile, including the highly popular Typophile Forums, which feature over 120 original typefaces that Microsoft plans to bundle with their next release of Microsoft Windows XP™ <br> <br>Although financial details of the transaction are undisclosed, Typophile founders Jared Benson and Joseph Pemberton were last seen switching over to PCs and purchasing homes in the Bay Area.</p>
