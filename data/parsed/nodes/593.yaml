    html: <p>Jason, <br>I think the basic shapes you drew are clear &amp; open, which should work well on screen. There are some strange things in the contrast though; The 'I' is thinner than most other uprights for instance. Within letters like 'w' and 'S' some fluctuations in thickness appear. Moreover the horizontals are heavier than the uprights (or is that on purpose?). It is hard to tell from this example how this will work on tv. Try looking at it in white on a moving and colorfull background then see what happens.  <br>Best, <br>Diederik</p>
