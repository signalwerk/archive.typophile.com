  html: <p>Hi, I am a student at the Art Center College of Design in Pasadena. I am working on my very first font (don't really know what I am doing so all the help you can give me would be appreciated). I have included a gif of what I have so far... which is just upper and lower case. This font will be used as a captioning font on a television.. which is very low resolution. Any suggestions would be great.<img src="http://www.typophile.com/forums/messages/29/12829.gif" alt=""></p>
