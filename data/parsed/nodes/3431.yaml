    html: <p> Hrant -- <br> <br>Thanks for the clarification on the origins of "bouma." I didn't realize that "Bouma-shape" had been previously published. I don't necessarily think "bouma" and your use of it is bad. I just think it's useful to keep in mind that the term is newly coined and its use is strongly associated with you and your theories. <br> <br>As for "bicameral," I didn't mean to imply that you invented it; but the use of the word to describe the two-story form of 'g' is, I believe, unique to you. Is it possible that you misappropriated it from Bringhurst? He uses "bicameral" to describe the dual-case nature of the Latin alphabet. "Bicameral" means "having two chambers" and is used primarily to refer to governments comprised of two legislative chambers and it carries an implication of hierarchy -- think House of Lords and House of Commons. Thus Bringhurst uses it to describe an alphabet like Latin (with its majuscule and miniscule -- its upper and lower cases) or Greek or Cyrillic -- as opposed to Devanagari or Hangul, for instance, which have no capitals. <br> <br>-- K. </p>
