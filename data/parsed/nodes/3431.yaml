e second one might be more \"evolutionary\": we should realize that we need to design words (or more accurately letter-strings) primarily, and individual letters only secondarily. Anyway, thanks Martin, and keep your eyes open for an upcoming article in tipoGraphica magazine (and its eventual online version in English). <br> <br>hhp</p>"
