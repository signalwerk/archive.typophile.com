    html: "<p> &gt; strongly associated with you and your theories. <br> <br>My theories concerning readablity are only really mine to a small extent: they're mostly \"codifications\" -or at most direct interpretations- of generally accepted views in psychology. However, the way I apply them (like in Alphabet Reform) are decidedly mine - although those are still \"public domain\". <br> <br>I think \"my\" theories seem idiosyncratic largely  because Theory in general (at least in the realm of type design functionality) has been completely shunned during the past couple of decades. I *wish* people would challenge my views with more than the classic \"nothing matters\" relativist fallback... <br> <br>Example: <br>A lc \"a\" without a strong terminal (on top) contributes more to readability than one with. Discuss. <br> <br>hhp </p>"
