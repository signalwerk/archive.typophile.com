    html: "<p>Well, yes, I suppose those outrageous, dogmatic statements have sparked some spirited debates, but they always seem to start off polarized. <br> <br>How can I argue with your 'a' declaration when you start right off praising my own design? ;-) But I will say this: I think it depends upon how you want to define \"strong terminal.\"  <br> <br>I agree that some faces with very strong ball terminals -- many of the modern genre -- tend to be too dark in text sizes, and I can see your point about becoming nondescript at parafoveal distances. <br> <br>But I think that your declaration terminal=bad / no terminal=good is an over-simplification. I don't think that the terminals on Jenson-inspired faces, for instance, detract from the divergence of the 'a'. I find most of the traditional book faces (the Aldines and Garaldes) completely acceptable in terms of divergence. I think it comes down to a balance of the weight and style of the terminal in relation to the weight and size and shape of the bowl. I don't think it's so much a matter of the terminal <i>per se</i> as it is a matter of the curvature and closure of the upper counterspace. <br> <br>I think the no-terminal 'a' runs other risks, mostly the vulnerability to creating distracting gaps when paired with certain letters, like 'c k r s.' When designing a no-terminal 'a' for a text face, one has to pay special attention to the curvature and where the stroke does end. <br> <br>Let me ask you this: I seem to remember that one of the points to your alphabet reform analysis was that the traditional 'a' and 'e' are too similar in rotation. Doesn't the elimination of the top terminal of the 'a' deprive the shape of one of its important divergent characteristics? <br> <br>-- K.</p>"
    html_clean: "<p>Well, yes, I suppose those outrageous, dogmatic statements have sparked some spirited debates, but they always seem to start off polarized. <br> <br>How can I argue with your 'a' declaration when you start right off praising my own design? ;-) But I will say this: I think it depends upon how you want to define \"strong terminal.\"  <br> <br>I agree that some faces with very strong ball terminals -- many of the modern genre -- tend to be too dark in text sizes, and I can see your point about becoming nondescript at parafoveal distances. <br> <br>But I think that your declaration terminal=bad / no terminal=good is an over-simplification. I don't think that the terminals on Jenson-inspired faces, for instance, detract from the divergence of the 'a'. I find most of the traditional book faces (the Aldines and Garaldes) completely acceptable in terms of divergence. I think it comes down to a balance of the weight and style of the terminal in relation to the weight and size and shape of the bowl. I don't think it's so much a matter of the terminal <i>per se</i> as it is a matter of the curvature and closure of the upper counterspace. <br> <br>I think the no-terminal 'a' runs other risks, mostly the vulnerability to creating distracting gaps when paired with certain letters, like 'c k r s.' When designing a no-terminal 'a' for a text face, one has to pay special attention to the curvature and where the stroke does end. <br> <br>Let me ask you this: I seem to remember that one of the points to your alphabet reform analysis was that the traditional 'a' and 'e' are too similar in rotation. Doesn't the elimination of the top terminal of the 'a' deprive the shape of one of its important divergent characteristics? <br> <br>-- K.</p>"
