    html: "<p>&gt; \"binocular\" <br> <br>Love it. I've now switched. <br> <br>&gt; Please elaborate <br> <br>With pleasure. <br>Basically, the essence of the \"a\" (what it contributes to readability) is in it's bottom bowl; a strong top makes it more of a nondescript blob, especially in blurry parafoveal vision (which makes up about 2/3rds of reading). An \"a\" with a weak top contributes some great divergence into boumas. What's a good finial for a (highly-readability) lc \"a\"? Anything with no flare, certainly no big lump at the end. <br> <br>The lc \"a\" in Petr van Blokland's Proforma, your Whitman, and my Patria are good. The lc \"a\" in the Text cut of Smeijers's Arnhem* is bad (especially since the Display cut has a nice -if somewhat too old-school French- one with no terminal). But when I say \"good\"/\"bad\" here, I'm talking about \"raw\" functionality, and only for text work. There might still be an over-riding aesthetic reason to put a blub on the terminal - as long as you know the damage that's doing to reading. Example: in Patria the lc \"a\" has a fine terminal, but overall it's too wide; it would be more readable narrower. So why did I make it (as well as the lc \"e\", \"g\" and \"s\") too wide? Because it plays better with the character of the face. <br> <br>* <a href=\"http://www.new-series.org/?arnhem\" target=\"_top\">http://www.new-series.org/?arnhem</a> <br> <br>BTW, a few weeks ago I started preparing a short expose about how we read, parafoveal vision, boumas, etc. and will publish it on my site as soon as it's ready; it has some interesting pitchurz. <br> <br>&gt; Otherwise, the discussion tends to quickly deteriorate into .... <br> <br>Yes, that's the worst. <br>On the other hand, in *starting* a discussion I've found that when I elaborate too soon and in too much detail, it tends to stifle further contribution from others. So a seemingly dogmatic intitial statement actually has its usefulness!  :-) <br> <br>hhp</p>"
    html_clean: "<p>&gt; \"binocular\" <br> <br>Love it. I've now switched. <br> <br>&gt; Please elaborate <br> <br>With pleasure. <br>Basically, the essence of the \"a\" (what it contributes to readability) is in it's bottom bowl; a strong top makes it more of a nondescript blob, especially in blurry parafoveal vision (which makes up about 2/3rds of reading). An \"a\" with a weak top contributes some great divergence into boumas. What's a good finial for a (highly-readability) lc \"a\"? Anything with no flare, certainly no big lump at the end. <br> <br>The lc \"a\" in Petr van Blokland's Proforma, your Whitman, and my Patria are good. The lc \"a\" in the Text cut of Smeijers's Arnhem* is bad (especially since the Display cut has a nice -if somewhat too old-school French- one with no terminal). But when I say \"good\"/\"bad\" here, I'm talking about \"raw\" functionality, and only for text work. There might still be an over-riding aesthetic reason to put a blub on the terminal - as long as you know the damage that's doing to reading. Example: in Patria the lc \"a\" has a fine terminal, but overall it's too wide; it would be more readable narrower. So why did I make it (as well as the lc \"e\", \"g\" and \"s\") too wide? Because it plays better with the character of the face. <br> <br>* <a href=\"http://www.new-series.org/?arnhem\" target=\"_top\" class=\"link-external\">http://www.new-series.org/?arnhem</a> <br> <br>BTW, a few weeks ago I started preparing a short expose about how we read, parafoveal vision, boumas, etc. and will publish it on my site as soon as it's ready; it has some interesting pitchurz. <br> <br>&gt; Otherwise, the discussion tends to quickly deteriorate into .... <br> <br>Yes, that's the worst. <br>On the other hand, in *starting* a discussion I've found that when I elaborate too soon and in too much detail, it tends to stifle further contribution from others. So a seemingly dogmatic intitial statement actually has its usefulness!  :-) <br> <br