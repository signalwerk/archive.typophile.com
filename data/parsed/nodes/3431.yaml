glyphs -in their normal positions- contribute to boumas. For example, if the \"a\" in a font is made my taking an \"e\", rotating it 180 and adding a tail to its bottom-right, you will occasionally cause a \"fault\" in reading (basically when you're looking at a long and/or unfamiliar word in foveal vision). But since the \"a\" and \"e\" obviously only appear in their normal positions (in normal text), it's much more important to mind what they contribute to boumas. So in fact the funky \"a\" I describe above might actually be more *readable* than the conventional \"bulbed\" lc \"a\"! <br> <br>hhp </p>"
