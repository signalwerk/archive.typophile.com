    html: "<p>I didn't mean that your theories are necessarily yours exclusively or entirely or originally. But you must admit that you have refined the ideas and applied them in your own ways, and you are the most visible and vocal exponent of them, so things like \"bouma\" are closely associated with you. That's all. <br> <br><i>&gt;I swear, I got it from some online discussion a while back.</i> <br>Hmmm. Okay, I believe you. But I'll bet it was originally a misappropriation of Bringhurst. <br> <br><i>&gt;Yes, I know. It seems clunky to me.</i> <br>It seems clunky to me, too, but at least it makes more sense. If you want latinate jargon, then an alternative description for the two-storied form of 'g' is \"binocular,\" since a counter is sometimes referred to as an eye. It has the disadvantage of other familiar associations, but it does conjure up Eric Gill's \"spectacles\" characterization. [cf. <i>An Essay on Typography</i>] <br> <br><i>&gt;A lc \"a\" without a strong terminal (on top) contributes more to readability than one with. Discuss.</i> <br>You know that I'm more than happy to debate you on such matters (as we have on various occasions) when I have the time. But, it would be easier to have a useful discussion with you if you would provide more substance than just a broad, blanket statement like this. Please elaborate: Why/how? Define \"strong terminal.\" Can you cite an example for us to examine where the lack of terminal improves legibility?  <br> <br>Then we have something to discuss. Otherwise, the discussion tends to quickly deteriorate into \"No it doesn't\" \"Yes, it does\" \"So's your mother\" \"Nyaah\". <br> <br>-- K.</p>"
    html_clean: "<p>I didn't mean that your theories are necessarily yours exclusively or entirely or originally. But you must admit that you have refined the ideas and applied them in your own ways, and you are the most visible and vocal exponent of them, so things like \"bouma\" are closely associated with you. That's all. <br> <br><i>&gt;I swear, I got it from some online discussion a while back.</i> <br>Hmmm. Okay, I believe you. But I'll bet it was originally a misappropriation of Bringhurst. <br> <br><i>&gt;Yes, I know. It seems clunky to me.</i> <br>It seems clunky to me, too, but at least it makes more sense. If you want latinate jargon, then an alternative description for the two-storied form of 'g' is \"binocular,\" since a counter is sometimes referred to as an eye. It has the disadvantage of other familiar associations, but it does conjure up Eric Gill's \"spectacles\" characterization. [cf. <i>An Essay on Typography</i>] <br> <br><i>&gt;A lc \"a\" without a strong terminal (on top) contributes more to readability than one with. Discuss.</i> <br>You know that I'm more than happy to debate you on such matters (as we have on various occasions) when I have the time. But, it would be easier to have a useful discussion with you if you would provide more substance than just a broad, blanket statement like this. Please elaborate: Why/how? Define \"strong terminal.\" Can you cite an example for us to examine where the lack of terminal improves legibility?  <br> <br>Then we have something to discuss. Otherwise, the discussion tends to quickly deteriorate into \"No it doesn't\" \"Yes, it does\" \"So's your mother\" \"Nyaah\". <br> <br>-- K.</p>"
