    html: "<p> &gt; I think it comes down to a balance of the <br>&gt; weight and style of the terminal in relation <br>&gt; to the weight and size and shape of the bowl. <br> <br>OK, or more generally the relation of the terminal to the overall color of the face. But if you agree that a text face has to fall within a narrow range of color (or more accurately, a narrow range of balance between positive and negative space), then  maybe any strong terminal *is* just bad after all. <br> <br>Sure, \"strong terminal\" is relative, but basically I see the two requirements as: <br>1. Primarily: the shape should contribute divergence to boumas - like the lc \"a\" should contribute a hole towards the top of the x-region. <br>2. Secondarily: the shape should be pleasing during conscious evaluation, especially in the context of the entire glyph set - and I for one think the \"weak-top\" lc \"a\" can work beautifully in a font - look at Proforma. <br> <br>&gt; When designing a no-terminal 'a' for a text <br>&gt; face, one has to pay special attention to <br>&gt; the curvature and where the stroke does end.  <br> <br>OK, sure. Just like a lc \"r\" is harder to space/kern than an \"n\". <br> <br>&gt; I seem to remember that one of the points <br>&gt; to your alphabet reform analysis was that <br>&gt; the traditional 'a' and 'e' are too similar <br>&gt; in rotation. Doesn't the elimination of the <br>&gt; top terminal of the 'a' deprive the shape of <br>&gt; one of its important divergent characteristics? <br> <br>\"Hey, you're paying attention, doofus!\"  -Butthead <br>Wow, you're sharp.  :-) <br> <br>In the beginning of my \"research\" I put too much emphasis on letterwise conflict: it's instictive (since generally we can only appreciate individual shapes in consciousness), plus I was influenced by the bulk of legibility research which limits itself to the decipherment of individual glyphs. There *is* a relevance to the rotation deal, but it's nothing compared to what the glyphs -in their normal positions- contribute to boumas. For example, if the \"a\" in a font is made my taking an \"e\", rotating it 180 and adding a tail to its bottom-right, you will occasionally cause a \"fault\" in reading (basically when you're looking at a long and/or unfamiliar word in foveal vision). But since the \"a\" and \"e\" obviously only appear in their normal positions (in normal text), it's much more important to mind what they contribute to boumas. So in fact the funky \"a\" I describe above might actually be more *readable* than the conventional \"bulbed\" lc \"a\"! <br> <br>hhp </p>"
