    html: |-
      <p>Nice one.<br>
      A few comments:</p>
      <p>R: The upper part seems odd/too squarish.<br>
      S,O,C, etc.: Your rounded letters definetely need more overshoot, if there's any at all yet?<br>
      S: seems much more rounded at the sides compared to C,O, G which have long vertical/straight sides…<br>
      A: could do with a bit opening up of the inner white space<br>
      Q: very nice, but i'd think about an alternative because it's going to be the only letter with a descender, and – presuming it's caps only – a designer would most likely want to use your face with very little line spacing, but if a line contains a Q you're in for a surprise, as your picture already illustrates. I'd think about a Q form without a Descender, which might be a hard nut to crack – maybe you could try somethiung inside the white space of the Q. And you could still have your version above supplied as an alternative. Honestly, I as a graphic designer, would want to use that one as tight as it gets both horizontally and vertically.<br>
      All in my very humble opinion of course.</p>
