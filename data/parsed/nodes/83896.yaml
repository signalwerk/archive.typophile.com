    date: 2011-07-28T00:13:00
    date_raw: 28 Jul 2011 — 12:13am
    votes: null
    html: <p>I can add that in our case an additional embedding license needs to be purchased when a client wants to use one of our fonts as part of a product (be it in hardware or software). Typically this means that we charge a periodical fee based on the revenue of that product.</p>
