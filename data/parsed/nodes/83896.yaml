  html: <p>I have a customer interested in licensing one of my fonts for an iPhone / Android app. I was curious if you have ever seen, or sold your customers on some licensing like this before? Do any of you have ideas on what sort of flat fees you would charge for this kinda of font embedding? I have been getting a few of these requests lately, but not really sure what sort of rate I should go with...</p>
  html_clean: <p>I have a customer interested in licensing one of my fonts for an iPhone / Android app. I was curious if you have ever seen, or sold your customers on some licensing like this before? Do any of you have ideas on what sort of flat fees you would charge for this kinda of font embedding? I have been getting a few of these requests lately, but not really sure what sort of rate I should go with...</p>
