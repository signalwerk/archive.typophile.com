  html: |-
    <p>I'm trying to identify the production date of an early brochure the company I worked for produced between 1963 and 1980. It definitely looks like it was done in the mid to late 60s, and I'm guessing it was done with phototypesetting.</p>
    <p>I'm wondering if the fact that the main typefaces it uses are Alternate Gothic and Eurostile Bold would help narrowing down the timeframe it was produced.</p>
    <p>I know Eurostile was designed in 1962, but perhaps if it wasn't available as prototype until later, that might help me narrow things down.</p>
    <p>Any ideas?</p>
    <p>Thanks!</p>
    <p>Jonathan</p>
