  html: '<p>============================================================ <br>Linotype Press Release - Linotype expands portfolio of the  <br>Compatil Type System  <br>============================================================ <br> <br>Compatil 6.0 sets a new standard in style <br> <br>Bad Homburg, 07th December 2004. Linotype has enhanced the  <br>aesthetics and functionality of its innovative Compatil  <br>Type System. In addition to cross-platform solutions in  <br>OpenType format and numerous design improvements, genuine  <br>italics are now available for each type style in the system.  <br>Compatil 6.0 thereby effectively doubles the range of  <br>typographic options while improving the functionality and  <br>availability of these fonts for international communication. <br> <br>Thanks to their consistent proportions and appearance, type  <br>styles from the Compatil Type System can be mixed freely to  <br>create rich typography of the highest order. As Silja Bilz,  <br>Senior Consultant of the Compatil Corporate Type Team  <br>explains: �Typographic styles are a way of influencing  <br>readers� emotional behavior and consciously steering the way  <br>they read. Styles enable designers to emphasize what�s  <br>important and create or highlight interesting contrasts. The <br>new italics clearly extend the creative potential of the  <br>Compatil System.� The new version has been developed in  <br>response to increased demand for highlighting options from  <br>Compatil Type System users in the design, advertising and  <br>corporate fields and builds on the original tonality concept  <br>of the project�s initiator, Professor Olaf Leu. <br> <br>More details and samples about Compatil: <br>- <a href="http://www.linotype.com/6-1806-6/compatil.html" target="_blank">http://www.linotype.com/6-1806-6/compatil.html</a> <br> <br> <br>If you would like further information, please contact: <br> <br>Linotype Library GmbH <br>Du-Pont-Stra�e 1 <br>D-61352 Bad Homburg <br>Tel.: +49 (0) 61 72 - 484 - 24 60 <br>Fax: +49 (0) 61 72 - 484 � 5 24 60 <br>E-Mail: <a href="mailto:info@linotype.com">info@linotype.com</a> <br>Website: <a href="http://www.linotype.com" target="_blank">http://www.linotype.com</a> <br> <br>------------------------------------------------------------ <br>Linotype Library GmbH, based in Bad Homburg, Germany and a  <br>member of the Heidelberg Group, looks back onto a history of  <br>118 years . Building on its strong heritage, Linotype  <br>Library develops state-of-the-art font technology and offers  <br>more than 6,000 original fonts, covering the whole  <br>typographic spectrum from antique to modern, from east to  <br>west, and from classical to experimental. All typefaces (in  <br>PostScript and TrueType format as well as more than 1,400  <br>fonts in OpenType) are now also available for instant  <br>download at <a href="http://www.linotype.com" target="_blank">www.linotype.com</a>. In addition to supplying  <br>digital fonts, Linotype Library also offers comprehensive  <br>and individual consultation and support services for font  <br>applications in worldwide (corporate) communication. <br>------------------------------------------------------------</p>'
