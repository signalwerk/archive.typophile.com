      <p>Now I am starting to see where you are going. Especially the s! </p>
      <p>You know Fontfont had some interesting experiments &amp; FUSE too a while ago that remind me of this. Have you looked ta that stuff?</p>
      <p>This kind of thing is definitely out of fashion now of course but I myself feel sympathetic to the experimental urge. I want to encourage you! </p>
      <p>What is your technique now? It isn't completely scribbled is it? I wonder what it would be like if you were laying handwritting over &amp; over to start to find new shapes/relationships.</p>
      <p>-e.</p>
