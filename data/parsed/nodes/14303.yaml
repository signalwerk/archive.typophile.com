    <p>This is my most recent experiment. The inspiration was something my high school art teacher told me years ago. While on the phone he would scribble onto a piece of paper and try to find human faces from the resulting lines. I've tried to do the same with letterforms.</p>
    <p>After I located a set of upper and lowercase I placed them on top of each other to further the idea of unconscious scribbling and layering.</p>
    <p>I've been playing with this very much off and on (mostly off/ignoring) for three months but not at all sure how to develop or improve on this very basic idea. Any thoughts? Do you think the idea is even worth it?</p>
    <p>Cheers,</p>
    <p>Nick Plant.</p>
