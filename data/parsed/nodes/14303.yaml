      <p>Great. I think to make something you really like - something of long term value it would still take a long time! </p>
      <p>But I am happy to see what you are trying out &amp; what you like. </p>
      <p>I guess where I was going with this in my own mind was that the forum of typophile &amp; the urge to put something up that can create may not be the shape or length of time needed to do good work. While my enthusiansm may help at first if you rush to meet it - it might constrain your process. And I don't want to see that happen. </p>
      <p>Now that I write this idea down it seems a little partronizing. If it feels that way - sorry. Like I said before; I want to encourage you.</p>
