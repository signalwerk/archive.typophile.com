      <p>You court me out. Those weren't the original scribbles the letterforms were made from. I set the word and added the scribbles after but I like the results and it's close to the asethetics of my first sketches. </p>
      <p>Your handwritting idea is interesting. I experimented a lot with handwritting and signatures on my Foundation Art and Design course before university, layering signatures from the student signing in book on top of each other using acetate. I'll try to find the experiments to show you and work on.</p>
      <p>Cheers Eban,</p>
      <p>NP.</p>
