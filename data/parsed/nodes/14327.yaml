    html: <p>The last two versions are better. Please don’t set your name verticaly. It looks like a mistake. Make it smaller and flush left with the word photo. If you can make it work have the Kodak Image Center Solutions appear after and not before your name. The version on the white background (color wise) works. If you insist on the red back ground make your name and Photo in white. Remember Stop signs are white type against a red background for a reason. They can be seen from far off. Also you have to make a white stroke around the blue Plus and stripes because the value of blue and red are the same. If you were to xerox the blue against the red on a black and white copier the Plus and stripes would disappear.</p>
