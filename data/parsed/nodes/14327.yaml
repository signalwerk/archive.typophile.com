      <p>I think, given those restrictions, you should look at emphasising that you are a company who happens to use Kodak equipment, in other words your name should appear first when reading left to right or top to bottom, also consider a colour away from the red of Kodak. I would steer clear of using a similar shaped box, icon or typestyle (in fact I wouldn’t use any icon or swoosh, as it will probably clash with the Kodak logo). I am not suggesting you produce anything that looks like the two elements are fighting, more that you give your company a prominence that Kodak doesn’t need.<br>
      So sketch out the areas/shapes that your logo will have if you work with a 50:50 split with the Kodak logo. Look at colours that could be an alternative to red without clashing (so that will cut out many greens), or being too light to read if printed on white (yellow), then try to create a shortlist of the kinds of typeface that you feel works for your company name.<br>
      Hope this gives you a start.<br>
      Tim</p>
