      <p>I think 3.2 represents an advance in that your company is dominant (although the ratio seems to have been reduced to 80:20 in your favour), the colours separate your business from the Kodak logo and the basics of your services are clear. However, the camera icon has a dated appearance and might be unnecessary, the speed lines might work better if they joined the P of Plus and tapered to the left or the slant that you presently have on the right could be moved to the left. The black outline on the white out text could also be viewed as unnecessary, if you decide that you prefer to retain the outline perhaps you could look at making them of equal weight. In the strapline I suggest that you use an en dash instead of a hyphen and consider whether developing is a term that customers would accept in place of, for example, processing which has more correlation with digital photography and still relates to the developing and printing of film. I am not clear on your intentions for using both but I would advise against it in order to retain a single identity, if you are concerned about the background to which you are applying your logo you could look at using a white border on the red box and reverse out the type for a dark background. My overall view is that in order to produce a logo which sits comfortably with the set element (the Kodak logo) you should go with a simple style.<br>
      Tim</p>
