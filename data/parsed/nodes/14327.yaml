      <p>Take a look at Vista from Emigre. A nice Sans Serif face with character. I would make your company name prominate. Stack it above the Kodak logos where possible and make the Kodak logo a lot smaller. What is important isn’t the process or the equipment, or the potential client would just send their images straight to Kodak. Your company and your people make the difference. Kodak is just a trademark that they can trust. </p>
      <p>The problem with your current typeface is it doesn’t look serious enough. It would be a great typeface for an ice cream vendor.</p>
