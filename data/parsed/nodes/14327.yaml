    <p>I just stumbled across this site while looking for some ideas for a logo for our new Photo kiosk bar in my photolab.  I was hoping somone might be able to give me some suggestions on improving our logo.  We are required to use one of teh two Kodak logos I have attached (attachment 2 &amp; 3) and our current logo is attachment 1.  We have changed the tagline on the logo several times over the past 3 years.</p>
    <p>Your picture experts<br>
    Your film &amp; Digital experts<br>
    Your digital picture experts<br>
    “Cleverly hidden on E. Johnstown Rd. at Hamilton Rd.”</p>
    <p>Any tips, pointers or suggestions?</p>
    <p>Ben<br>
    <a href="http://www.photoplus.us">www.photoplus.us</a></p>
