      <p>The problem always comes when we try to put a one-solution-fits-all notion on anything.  It may be more valuable to examine why ligatures work better in some situations than others.  You can frame this in a readability only issue to reduce variables.  I also very much like the notion of "usability" David mentioned above. When do principles other than readability take a greater roll to increase the chances of the printed piece meeting the author/designer's objectives? Receiving a wedding invitation from a friend may be an instance. This kind of thing is so subjective it may be impossible to test.  Nevertheless, it is valid and how design work is really done. </p>
      <p>ChrisL</p>
