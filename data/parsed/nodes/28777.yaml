      <p>Eben, all:</p>
      <p>After reading Will Harris' short piece I have decided he's definitely over-simplifying and many of his examples are poor and lack real merit. (Maybe I'm over-simplifying too.)</p>
      <p>His point about the odd shape made by the fl ligature in a few of his examples is good, however, and I've noticed this myself before. I've even not used the fl ligature on occasion because it does create an h-like shape.</p>
      <p>One flaw, I think in what he is saying are in his examples. He's basically using what can be seen as display settings. But the usability of a ligature is in text settings and for small point sizes so what he is showing us doesn't wash with me. I'd rather see a paragraph at a reader's point size and then form my own opinion. OF COURSE, the ligature might call too much attention to itself at dispaly sizes, duh! </p>
      <p>If the letters don't "crash," to use his word, then perhaps that is when ligatures aren't needed. I agree with this. But again, his samples, only in a few instances, really prove his point. The Caflisch sample, for instance, I think, is better for the ligature as the tittle creates visual noise, display or text, which needs to be taken care of.</p>
      <p>In some cases, for text setting (and maybe display), where the tittle doesn't crash, I wonder aloud if the ligature doesn't simply remove a bit of data that we simply don't need because we recognize the letter pairing without it.</p>
      <p>I feel out of my league with the rest of you, but this is a great thread.</p>
