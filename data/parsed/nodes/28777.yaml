      <p><em>I (and I suspect most of us here - correct me if I err) think that there is such a thing as better &amp; worse design.</em></p>
      <p>I don't think you err at all; in fact, I probably have a lot more to learn from you than the other way around. I present my case here half hoping that someone will prove me wrong! :-)</p>
      <p>I'm all for making choices based on what I believe to be 'better design'. I just don't know that I would claim such decisions to be right or wrong in a more absolute, universal sense -- not that I think you're doing that, mind you. In other words, I'm open to research that could prove my choices to be wrong.</p>
      <p>But even if incontrovertible 'hard data' were to prove, say, that for a certain target audience lining figures make for better readability than text figures, I would still use the latter, especially in extended text. In fact, I think a lot of people do this consciously all the time: if it were proven once and for all that serif faces are more readable than sans-serif ones, or that faces with high contrast and vertical stress are more readable than low-contrast ones with an oblique axis (for a given target audience), Bodoni wouldn't all of a sudden become the most popular face among well-informed designers.</p>
      <p>To sum up, I believe in better and worse design; I'm just not sure that better design always corresponds to better readability.</p>
