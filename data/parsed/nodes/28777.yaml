      <p>I have used the expression 'sweet spot' refer to some kind of ideal balance of weight of strokes, dimension of counters, width of spacing and evenness of color (etc.!) that results in the most comfort of reading. </p>
      <p>I haven't thought that the 'sweet spot' for text will vary with the person. I do think different optical sizes will require a different balance of the factors. Also it will be affected by measure and leading. But beyond that I have maybe the simplistic notion that reading process among competent readers with good eyesight or good corrective lenses is pretty similar. </p>
      <p>There isn't any grand theory here, just a notion that there is some ideal balance of factors to shoot for, at a given optical size, line measure and leading.</p>
