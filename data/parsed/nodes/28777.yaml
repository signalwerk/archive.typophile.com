      <p><cite> Yikes, can we just talk about the Big Bang or evolution or something instead? </cite> </p>
      <p>Maybe on another site. This site is about type! ;-) </p>
      <p>I may agree that the analogies can get pretty fruity at times here. But I think we are all doing our best even if that doesn't always seem good enough to some of us some of the time. You all have my respect &amp; thanks for considering this issue, debating this with me &amp; educating me in the process!</p>
      <p>I do think that a careful reading of this thread shows that ligatures are not just a typographic nicety in all cases. Sometimes, but in fact - rarely. Sometimes they really do seem to improve a design ( even though nobody can PROOVE it ). Sometimes they seem to get in the way ( even though nobody can PROOVE it ). And sometime they don't seem to do much at all. They seem vitrually neutral, not improving nor detracting from a design. In which case we can call them a 'typographic nicety' ( even though nobody can PROOVE it ). I think this case is the unusual one however - and I cannot proove it). </p>
      <p>Another way of looking at it, and this was the way I was looking at it when Tiffany made her point before - is that when a ligature does work well it's working because it isn't drawing attention to itself and it is working neither better nor worse than the glyphs around it. It's not distictive from a readability point of view from the glyphs around it. So it might be said to be average in some sense except for it's exotic connection &amp; hence a 'typographic nicety'.</p>
      <p>John Hudson's point about the profound power of the reader is of course an excellent one. But I don't think that it obsolves the type designer of the responsibility to be interested in incremental improvement and of being curious about how that improvement might be achieved. For the record, I am not admonishing anyone just stating my point of view.</p>
      <p>I will also readily admit that the topic name I chose for this thread was as usual pretty naive!</p>
      <p><cite> might possibly be a red herring which detracts...</cite></p>
      <p>I do agree that the specific examples that people brought up showing relative success &amp; failure in specific cases were by far the most useful things in the thread.</p>
