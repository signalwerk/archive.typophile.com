      <p>Usability is indeed an interesting topic: as with readability, in my opinion one simply cannot talk about usability without talking about culture and education. Of the myriad variables that affect usability, many have to do with traditions and habits. People learn to use things -- from kitchen knives to computer interfaces -- and not every person in every culture grows accustomed to using the same things in the same manner.</p>
      <p>Take a kitchen knife, for instance: most chefs will give high usability ratings to heavy knives with large blades; my wife (who is not a chef) only likes small knives, and her preference has nothing to do with having small hands or not being able to lift a large knife. It's just that she never learned how to properly "operate" a chef's knife, so to speak.</p>
      <p>Someone who can appreciate the refinement of a good ligature will find it aesthetically pleasing in Chris's wedding invitation; someone who's never seen one before may find it strange, especially if the text is large and the ligature is clearly visible.</p>
      <p>I have great respect for Peter Enneson, but am not yet convinced that the perceptual processing benefit ligatures may bring to someone is independent from that person's education and culture. Enneson's suggestion that we go deeper and consider not readability as a whole but the different "sub-atomic" factors that define readability sounds to me a little like discussing how a certain substance can help a brain-dead person because it causes the person's heart to beat. (I am, however, completely open to the possibility that I haven't studied this subject enough to be able to question Enneson properly.)</p>
