      <p>&gt;Do ligatures improve readability? </p>
      <p>Kevin Larson, may correct me if I'm wrong, but I think that any improvement in reading performance between texts where the only difference is ligatures vs no ligatures would be far too small to measure using current techniques. </p>
      <p>I know the team studied performance where all the typographic stops had been pulled out (ligs, small caps, osf etc.,) vs no typographic niceties and found the difference not measurable even then.   </p>
      <p>Cheers, Si</p>
