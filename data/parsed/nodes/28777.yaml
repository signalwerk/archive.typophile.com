      <p>Bill, we might not notice the crashes, much like we don't notice regressive eye movements. They don't break through to our overt awareness unless we are attuned to them, or scan the setting with the eyes of a practiced typographer. But I would suggest that they are registered in the early layers of the visual cortex as activation spikes at a level disproportionate to the cue value importance of information in the stimulus area where they occur. This makes necessary--or so I think--additional neural computational work in accomodating the activation provoked by the stimulus complex--with its rogue area of over-dense, distracting or clotting visual information--to the neural code for a known or familiar word. </p>
      <p>The receptive fields of the visual cortex benefit from--does it's work better with--clean, well-managed saliency maps, with no areas where contour interactions become disruptive.</p>
