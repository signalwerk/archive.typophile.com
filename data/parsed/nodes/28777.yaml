      <p>&gt; Isn’t the truncated f common now in sans faces? Why is that</p>
      <p>Tradition usually has a lot to do with that sort of thing. Plus Modernism wreaks its usual havoc, seeing as how it prefers sans to begin with. Also note that sans fonts tend to have larger x-heights, making a [relatively] large beak on the "f" fit fine.</p>
      <p>&gt; Do we also have to debate ...</p>
      <p>You don't.</p>
      <p>BTW, the notion that metal type was usually (or even often) set without leading is incorrect (except in newspapers). And if you've ever set metal type you know why: the lead keeps those little sorts from falling into the bottom line like rotten teeth! The lead physically holds the line together.</p>
      <p>But Linotype, different story, since the type was the line itself (besides being limited in other ways compared to "foundry" -coldmetal- type). And Monotype, being mechanically tighter than human hands, I'm guessing could get by without leading as well.</p>
      <p>hhp</p>
