      <p>I do find Nick Shinn's idea of contextual adjustment of characters--instead of just kerning--intriguing. Nick may have already implemented this in a font--he will tell us, I hope. </p>
      <p>Aziz's reference to the kashida in Arabic script is also apt and interesting. In Hebrew also, in spite of the fact that it is a separated script (even in cursive), traditionally scribes would extend letters to fill out lines. In latin script, written with lower case, scribes, if I remember correctly, would fill out the line by extended swash terminals, rather than by stretching a character. </p>
      <p>The reason for the difference in scribal practice, I think, is a difference in structure of the glyphs. In Arabic and Hebrew the horizontals are thick and the verticals thin--the reverse of latin characters. The horizontals also play a much more prominent role. </p>
      <p>If you consider the latin lower case, there are no pure horizontals. The f and t cross bars are paired with arches, and the e cross bar is connected with a circle. The r could be a candidate also, but it is a partial arch also. </p>
      <p>As opposed to the latin lower case, the resh in Hebrew has a single straight, thick stroke to the left--and it typically is a glyph stretched to fill out a line for justification. For this reason, I am a bit skeptical about how much contextual alteration in the lower case can be done. Of course I think Nick is suggesting subtile changes to help color, so this might lead to improvements, even if small ones. </p>
      <p>Currently what comes closest to kashidas for latin script is the stretching or squashing of the whole character by up to 2% to justify a line--a capacity of InDesign. </p>
      <p>The latin caps are a different story, as you have the 'H-LEFT' which have pure horizontals. And here I think there is more opportunity of contextual alterations, eg of the L in the LA combination. Similarly, you could shorten one or both arms of the T in the Th combination, which is common in English.</p>
