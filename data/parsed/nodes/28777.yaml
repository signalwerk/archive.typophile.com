      <p>"Do ligatures improve readability?"<br>
      So, then there are legibility, readability and usability. Do footnotes improve readability? Do page numbers improve readability? Italics don't but we use them to "improve" usability by distinguishing emphatic statements or those outside of the main language of a text. At some point, the convenient things, like ligatures, logotypes, numeral variety, style variations and the many other tricks that well-used type one can bring to the table are not as readable as something else might be, but their usability outweighs their faults. </p>
      <p>If seen the worst of this by the way, from some of "the best typographers in the world" not long ago in a published sample of OT features where every single instance of c^t and s^t were ligated in the accompanying text. I wanted to barf, but I eventually got myself to gently point out that, usually these types of ligatures are set repeatedly only in big text, like ad use, or in pull quotes. Otherwise, use should be "intelligently" sprinkled into text to help the reader off, e.g. as the signal that an end of a ppg. is nigh.</p>
