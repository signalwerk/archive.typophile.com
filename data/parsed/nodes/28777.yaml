      <p>"An arrangement of lines and curves and angles may be beautiful in itself, but unless it suggests a form it is valueless. And the more clearly and definitely it suggests that form, the more we value it." - Talbot Baines Reid, <em>Ars Typographica,</em> Winter, 1920.</p>
      <p>In classic serifed faces, the fi and fl combinations create indefinite forms in which the letters are almost-merged. Ligatures solve this problem by fully merging them.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/liga_5597.jpg"></div><br>
      Reading research has discovered that we read letters not words, but I suspect it is more likely that we read discrete, contiguous shapes -- which is what most letters are, except for those which have separate accents, and that includes the i. Therefore, the circumstance where the dot of the i becomes attached to an adjacent letter is detrimental to readability. <p></p>
      <p>That's a rationalization for something we understand not with mere intellect or gut feeling, but with typographic sensibility.</p>
