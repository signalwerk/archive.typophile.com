      <p><cite> Nick may have already implemented this </cite> - William</p>
      <p>He said that he had when he showed us the example here on typophile. Did you not see that? Can anybody point me to it. For some reason I can't find it.... But I am glad that you see that the idea holds some potential! It seems to me that the greatest potential for improvement in type design today lays down that path.</p>
      <p><cite> For this reason, I am a bit skeptical about how much contextual alteration in the lower case can be done </cite> - William</p>
      <p>It seems like the wy might be one place to look... But that's  <a href="http://typophile.com/node/29362" rel="nofollow">another thread</a>. However, I absolutely agree with you that the characteristics of the letters themselves must color the ways in which alteration can be accomplished. But that also shows why there will be variety. The forms have a huge range of variety. So while we could probably develop semi-predictive theory about where to check for opportunity for successful alteration based on inherent structural chacteristics I am more interested in looking for examples and then analysing what I have for patterns later on. The human eye &amp; mind are pretty wonderfully adaptive. I have a feeling that like the L example on the <a href="http://typophile.com/node/29362" rel="nofollow">other thread</a> we will find that style &amp; a host of factors and circumstances that make it possible to adjust letters in a myriad of surprising &amp; delightful ways. </p>
      <p>So, if you see examples of pro-color or pro-notanic adjustment would you point me or send the examples?  I am starting a collection which I will share for free; (I hope) via a searchable database driven web site. Unless of course, there are so few that that is overkill. But we shall see. My best guess is that there will be a TON. </p>
      <p><cite>kashidas</cite> - Aziz</p>
      <p>Aziz, thank you for explaining about arabic connections &amp; kashidas. I was wondering, have you ever seen an arabic typeface that has extended connections so the overlap is exagerated? I have an idea that doing that would maybe allow for some additional spacing without using kashidas. Maybe this is naive. What reasons might there be for avoiding that solution?</p>
      <p> I was thinking that for searchable text you would maybe not want to have kashidas present. Of course you could (maybe) write your search engine so that it tosses kashidas out... Do you see what I am getting at? Are kashidas used very much or is it something that is rare? </p>
      <p><cite> That’s why Legato is called Legato btw. </cite> - Hrant</p>
      <p>You mean a the non-litteral definition<br>
      legato<br>
           adj : (music) without breaks between notes; smooth and connected;<br>
                 "a legato passage" [syn: smooth] [ant: staccato]<br>
           adv : connecting the notes; in music; "play this legato, please"<br>
                 [ant: staccato]</p>
      <p>Yes, okay. I remember reading that on Evert's site. (I wonder if it's still in the google cache ) But do you see the distictions I was getting at? I am not sure that the distictions I was making preclude agreeing with you that contextual alterations are <cite>just another way to ligate</cite>. I have said &amp; will say again that what we recognise as ligatures are in fact just a subset of solutions to a given problem whose disproportionate mental prominance can only be explained by our thrill in observing the  obvious 'rule breaking' they engage in. <strong>Ooooh! They touch!</strong> Still, it this disproportionately emphasized visual distinction does also have a practical/fuctional impact re: letterspacing that raises it's own questions. I don't see the conflict or contradiction there. I would like it if you addressed them more specifically! And if the two ideas are somehow opposed, please explain why that is.</p>
