      <p>It sounds like a lot of people are saying the same thing: they're good if they're good.</p>
      <p>I think ligatures should fix a problem, and they should disappear. I've seen lots of nice Linotype faces (and others) which are designed to not need ligatures. I think it's especially difficult for young type designers to come around to the idea that ligatures aren't always better -- because they are so fun to make and look at.</p>
      <p>As mentioned above, if the ligature itself doesn't match the overall letterspacing, it's trouble.</p>
      <p>Once again, I can cite some changes between the old Type 1 version of Utopia and the newer OpenType version to show how two different approaches to ligatures compare. (I always thought the old ligatures were a little obtrusive, despite my liking the design of them. I think especially the first f in the ffi "reaches" a little too much.)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture3_5452.png"></div><p></p>
