      <p>Eric, I'm long on hypotheses but short on methodologies. One approach might be to see how the magnitude of the Word Superiority Effect varies with spacing, ligatures in fonts that need them, and style of stroke termination. Another might be to measure the responsiveness of the Visual Word Form Area under conditions of 'priming' with these variations. The best thing would be to develop a criterial test for what I refer to as 'letter-wise slot processing' verses the more direct and supercessionary pattern-based recognition style of visual word-form resolution that I claim emerges when reading becomes fluent.</p>
      <p>Eben, 1) I misused and miss-spelled the latin phrase <em>mutatis mutundis</em>, thinking it meant something like 'in the nature of the case.' 2)  Expanding on 'facility at visual wordform resolution,’ ‘adequate discrimination affordances of role architectural particulars,’ ‘proper saliency of criterial features’ and ‘response bias collapse’:</p>
      <p>'facility at visual wordform resolution,’<br>
      I use this instead of 'word recognition' because the term 'word recognition' doesn't isolate and reference clearly enough the foundational <em>perceptual</em> processing moment' of the sense-following mechanisms in reading. It can mislead us into thinking that the interesting and important part of what we are dealing with in reading is mainly a cognitive letter-assembly mechanism. </p>
      <p>In my scheme, facility at visual wordform resolution is a learned perceptual skill which develops of its own accord, without conscious effort because of the optical-grammatical structure of writing and, once solidified, proceeds automatically and under the radar of consciousness. It becomes the 'response bias' of the visual system when it is confronted with separated written or printed text. It begins to supercede the letter-wise routine we must master to become skilled readers. The visual binding forces of serifs and rhythmic spacing make breaking the system's learned bias toward a kind of wholistic processing an effort-intensive process neuro-mechanically. These visual binding forces broker or catalyze the perceptual learning that must occur. Bad spacing and the abscence of serifs may make breaking the wholistic respones bias less difficult. They may threaten it, or they may actually privilege a more letter-wise neuro-mechanical routine. When the more letter-wise neuro-mechanical routine is induced or privileged by the typographic realization of the text, I speak of 'wholistic response bias collapse".</p>
      <p>‘adequate discrimination affordances of role architectural particulars,’<br>
      Visual wordform resolution requires that the visual system be able to 'make out'--and the visual cortex register and integrate--the shapes of visual components of the word at least up to the level of letter parts and counters. My word for letter parts is 'role architectural particulars'; my word for things like counters is 'role architecturally evoke form'. I use them because we need a set of generic terms for things like bowls and stems and shoulders and counters. Because the stems and counters 'afford' or lend themselves to being 'made out' by the visual sytem, I use 'discrimination affordance'. When the lighting is too dim or the contrast with the ground too low, or the type too small for role architectural components to be registered or connected with effectively or made out, the 'discrimination affordances' or 'discrimination affordance quotients' of the font's component letters are inadequate for the condition of use. The discrimination affordances of some fonts are greater at threshlds of size or illumiation or degradation than others.</p>
      <p>‘proper saliency of criterial features’<br>
      Even if the discrimination affordances are optimal for a given condition of use, the type may not perform well, because certain parts of the visual wordform that are perhaps marginal to perceptually resolving it's identity are given too much visual weight by idiosyncracies in the shaping of the letters. The forms have to be balanced against eachother so that all the parts that are collectively important to resolving the perceptual identity of the stimulus have equal visual weight. In these contexts I speak of 'proper saliency' and 'cue value'. And it is important that salient holes and crashes not draw neural processing attention away from areas that are criterial for visual resolution of the identity of the stimulus. This mucks up processing from the retinal receptors up through the visual cortex. Salient here means salient for the visual system <em>at a receptor and neurological level</em>--not necessarily salient for conscious vision)</p>
      <p>‘response bias collapse’<br>
      [see above]</p>
      <p>Hope this helps!</p>
