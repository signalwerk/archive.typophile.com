      <p>I think a good f-ligature is one that is invisible when read quickly, and when looked at slowly doesn't look awkward. </p>
      <p>The problem of a no ligatures in faces with a rightward extended f is that the clash results in an awkward-looking juxtuposition. The ligature is basically for aesthetics. </p>
      <p>The aesthetic dimension is important, particularly for headings and display type, but I wouldn't expect much of an impact on reading.</p>
