      <p>Clearly that's true. It's also true that the vast majority of what we find useful in letter design today comes from that source- cultivation and intuition. So we should respect it. That respect needn't suggest a phobia about science or testing of course.</p>
      <p>&lt; cite&gt; Perhaps it would be more to the point to ask whether that is true for, say, French baby boomers that read Le Monde.  ( Erik ) </p>
      <p>I am less convinced of the importance of culture as a relvant factor than you are. I think other directly observable ( an measurable) factors in type are better places to look for specificity. That said I think regional testing would be good too. The thing is I don't have any confidence that anything like the grand ideas we have espoused for is likely to be pursued in the near future. I hope I am wrong. But we shall see.</p>
      <p><cite> reserve the terms legibility and readability </cite> ( Peter) </p>
      <p>I don't think anyone can control these terms use except in their own speech and writing.</p>
      <p>I would like you to expand on what you mean by:</p>
      <p>' facility at visual wordform resolution' and 'adequate discrimination affordances of role architectural particulars ' and 'proper saliency of criterial features' and 'mutatis mutandi' and 'response bias collapse'</p>
      <p>for my sake and others.</p>
      <p>And by expand I mean I would like for you to give examples to illustrate what you mean. I can guess what you mean but I don't know that that would be too helpful.</p>
      <p><cite> Than let’s ask more interesting and testable questions like: do serifs, tight spacing and ligatures promote or inhibit visual wordform resolution </cite> ( Peter )</p>
      <p>Now that's more like it! I even think we could get even more particular while we are at it if we want,and that that would probably be a good idea.</p>
