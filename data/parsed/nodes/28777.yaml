      <p><em>BTW- you might want to search Typophile for threads about legibility and readability. They are different too.</em></p>
      <p>I am well aware of the difference. Here the distinction didn't seem important, since no contrast is being made between one and the other. In any event, I've edited my posts so that the word 'readability' is now used throughout.</p>
      <p><em>I suspect when you say good design you might mean good style or maybe beauty. That’s complex too.</em></p>
      <p>Hmm... Not really, no. I mean, designers usually strive for style and beauty, yes, but that shouldn't be their ultimate goal. After all, a designer has a problem to solve: finding the best possible way to communicate a certain message or messages.</p>
      <p>But what is the best way to communicate a message? Doing it in such a way that the reader will be able to process the verbal message with maximum efficiency? Or finding the most effective solution to convey a certain mood? Or trying to strike a balance between one and the other? That all depends on the designer's goal, of course: sometimes it's mostly about being as clear and matter-of-fact as possible, sometimes it's mostly about creating a certain atmosphere, sometimes both are important.</p>
      <p><em>But even in our relatively impovrished state (from a hard data point of view); there is quite alot that intuition, cultivated sensitivity, and awareness of context can offer in the persuit of legibilty. Pehaps you will be one those folks who will chew on the data! Or create the data. That would be great!</em></p>
      <p>I don't believe cultivation and intuition will ever be entirely supported by hard data. My point is that even if research proves your cultivation and intuition to be 'wrong', I don't think you should give them up. 'Better design' will <em>never</em> be entirely objective, even if you do make a conscious effort to solve a problem rather than just 'make things pretty'. Besides, you can always try to educate the audience a little.</p>
      <p><em>This doesn’t mean that there are no generalities that can be noticed and which support legibility. They exist, but in a very provisional or contextual way rather than absolute one.</em></p>
      <p>I completely agree. That's why, in my opinion, looking for universally applicable generalizations can be a thankless job. Rather than ask whether ligatures improve legility/readability -- a 'universal' question -- perhaps it would be more to the point to ask whether that is true for, say, French baby boomers that read Le Monde.</p>
      <p><em>But I do think testing may eventualy help us to know more precisely what a type design is likely to be able to do.</em></p>
      <p>If you're talking about general guidelines, I agree. But not even those general guidelines will be universal; you'll always need to try your design on a focus group if you want to determine how well it works in comparison to something else.</p>
      <p>In the end, though, no tradition is absolute and universal, but that doesn't mean you should abandon tradition. It's a little like religion: keep doing it, but never hold it to be a universal truth.</p>
      <p>By the way, if anyone thinks all I've said here is a load of c*** or that I've disrupted the discussion that was going on without being knowledgeable enough about the subject, feel free to say so.</p>
