      <p>&gt; I don’t know how much letterspacing if any is acceptable in Arabic fonts.<br>
      <a href="http://typophile.com/node/19609" rel="nofollow">Arabic writing</a> is cursive (linked). That means that the same character has up to 4 different graphic forms, according to whether it is linked with the previous character, with the following character, with both, or with no other character.</p>
      <p>As in Roman text, and depending on each font, Arabic consonants can form «ligatures». In a manner analogous to what happens when you write «œ» instead of a separate «o» and «e», 2 or 3 Arabic consonants can merge into one synthetic glyph with its own length, four position-representations, and kerning behaviour.</p>
      <p>Since Arabic characters are linked together, you can’t change the letterspacing (also known as positive tracking) simply by adding short spaces between characters as in Roman text: the links would display as non-continuous ones. In this case, short pieces of link (called kashidas) between Arabic characters are automatically inserted. In other words: there are 2 ways of performing full justification in Arabic: either by magnifying the spaces between words as in Roman, or by automatically adding small kashidas after each linked character to make the words longer.</p>
      <p>In addition to letterspacing and automatic kashida, there exist 2 other means of modifying the horizontal size of a word:<br>
      • Adjusting the width of characters<br>
      • Entering a manual kashida-character from keyboard, as you would do when using primitive word-processors.</p>
      <p>In general, using the automatic kashida settings is a far better solution: after a text-reformating, if some kashidas become unnecessary, elastic style-kashidas will automatically disappear, while keyboard kashidas will have to be removed manually.</p>
      <p><a href="http://typophile.com/node/19348" rel="nofollow">My font</a> has the additional feature of making Calligraphic full-justification with the help of prolonged overlapping swashed final forms.</p>
