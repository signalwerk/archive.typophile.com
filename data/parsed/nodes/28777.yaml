      <p>' facility at visual wordform resolution' and 'adequate discrimination affordances of role architectural particulars ' and 'proper saliency of criterial features' and 'mutatis mutandi' and 'response bias collapse'</p>
      <p>for my sake and others.</p>
      <p>And by expand I mean I would like for you to give examples to illustrate what you mean. I can guess what you mean but I don't know that that would be too helpful.</p>
      <p><cite> Than let’s ask more interesting and testable questions like: do serifs, tight spacing and ligatures promote or inhibit visual wordform resolution </cite> ( Peter )</p>
      <p>Now that's more like it! I even think we could get even more particular while we are at it if we want,and that that would probably be a good idea.</p>
