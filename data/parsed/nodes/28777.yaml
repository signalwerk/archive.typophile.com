      <p>Alessandro : I do see beauty there but plenty of beautiful things are not functional. Ideally the two should be married &amp; if you listen to some beauty should precede or fuction should as they prefer. But my question is how did you come to decide this. That is what I mean by basis. You can still count me as sympathetic just skeptical of either point of view having been made in a some kind of solid way.</p>
      <p>"The other difficulty is that some sets of ligs are done better than..." Chris that's a very good point and while it clouds the issue somewhat - that's just too frickin' bad. That's reality! </p>
      <p>Actually the only really strong arguement I have heard so far against ligatures is that they can make spacing look odd when the basic letter spacing is screwed with. This is Will Harris' aregument. See the link above. But his point of view is overly practical in my view. He is advocating safer type. Not better type if you see what I mean. He is seeking the robust over the perfect and somewhat brittle. I see his point even if I am not completely taken with it.</p>
      <p>Reading over everybody's posts the final thing that I am reminded of ( again one of Will's arguements or obsevations ) is that it is possible to simply design letters differently to avoid the problems that would have occured. An f can be made more narrow so collision is avoided. </p>
      <p><a href="http://www.will-harris.com/ligatures.htm" title="http://www.will-harris.com/ligatures.htm">http://www.will-harris.com/ligatures.htm</a></p>
      <p>So I suppose I aught to reframe the question ( without expecting a solid answer per se ) is it better to redesign the forms or to use ligatures for immersive reading. I bet they wash out as more or less equal. And other issues such as 'is it a revival?' etc. must trump any kind of absolute decision you could make.</p>
      <p>Of course now I am think about it I am starting to see other redesigned elements in typefaces which are not ligature related but are related to robustness in spacing such as the seemingly shrinking arm on the 'r' glyph. Anybody care to mention other examples?</p>
