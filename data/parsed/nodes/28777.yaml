      <p>Re: <cite> To sum up, I believe in better and worse design; I’m just not sure that better design always corresponds to better legibility. </cite></p>
      <p>Your may be right. It isn't clear to me what you mean by better design. </p>
      <p>So let's take that apart: I think a design can be said to be good if it does something very specific - very well. But it's really complex.</p>
      <p>( BTW- you might want to search Typophile for threads about legibility and readability. They are different too. )</p>
      <p>Even just speaking about legibility is complex. Legibility should probably be considered in the context of culture as you pointed out, on what paper, with or accomodating what feeling or style, and at what size, and.... many more things. With type there are many many many somethings that could be done well and some of the specifics are not compatible. </p>
      <p>For instance: Type that works wonderfully well looking just at legibility at 72 point we know does not work well at 9. And vice versa. It would be silly to expect one design to do both.</p>
      <p>I suspect when you say good design you might mean good style or maybe beauty. That's complex too. Style by definition has to coexist with other attributes. Some attributes of style like weight or serifs can impact legibility positively or not depending on how they are handeled. But you are certainly right to think that sometimes a design can be beautiful at the expense of legibility. Is that your point? If so, keep in mind that Beauty is not just one relevant measure in some cases - it may be the primary one depending on the purpose of the face or the design in which it is used.</p>
      <p>This doesn't mean that there are no generalities that can be noticed and which support legibility. They exist, but in a very provisional or contextual way rather than absolute one.</p>
      <p>But coming back to a pervious point of yours (if I understand it). I agree that people who design type don't have nearly enough hard data to work with yet. That may change. And to be sure some of what we do is probably neither helping nor hurting legibility. But that's not necessarily the problem that it may sound like; legibility being just one way to measure the success of a typeface. </p>
      <p>But even in our relatively impovrished state (from a hard data point of view); there is quite alot that intuition, cultivated sensitivity, and awareness of context can offer in the persuit of legibilty. Pehaps you will be one those folks who will chew on the data! Or create the data. That would be great!  </p>
      <p>However I don't think that proof is what will emerge from testing or that 'proof' will help anyone, but rather I hope that testing will illumminate the way that characteristics of type can be traded off against each other to differing and hopefully increasingly deliberate effect. No matter what the test results may show - a prescription for Bodoni ( or any other face ) will never be 'the right one'. But I do think testing may eventualy help us to know more precisely what a type design is likely to be able to do. I put it that way because then there is the question of use. That's a whole additional area!</p>
      <p>This is way too long. Sorry about that. I hope it is helpful and not a pain.</p>
      <p>Cheers!</p>
