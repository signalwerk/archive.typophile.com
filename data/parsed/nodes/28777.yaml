      <p><cite> Ligatures don’t cause comprehend-ability to increase - they avoid retarding it. </cite> David, this is a sweeter way of putting it. It's more lucid &amp; less baggage laden. I would amend this further in this way: 'Well designed ligatures included in typefaces in those cases where they are actually needed don’t cause comprehend-ability to increase - they avoid retarding it.' </p>
      <p>To get past Hrant's objection that you are creating a model of reading with the statement you might offer the corrolary that 'In those typefaces that need ligatures you would see comprehend-ability to increase when well designed ligatures are included." </p>
      <p><cite> and any disturbance of the all is as good as many disturbances? </cite><br>
      I am sure you meant something by this but I think the langauage actually written can't get me closer to what you meant. I would be willing to say that any distubance of the 'all' is relevant. Is that what you meant? Hrant, was this all on the page in your mind or does it include the possible sound of a child in the room?</p>
      <p><cite> read at some sort of maximum </cite> </p>
      <p>I think you are absolutely right to insist on avoiding that 'model' of reading.</p>
      <p>I think what I was getting at is that any design ( for anything ) has a built in 'maximal' potential use ( defined in whatever way you like ) but that that maximum is just potential. It doesn't mean that it is desirable to reach per se, or even 'reach for' in real life use. That also does not deny that achieving certain testable maximums might not enhance comfort. But your main point if I get you, I agree with - a test ( even a theoretical one) is not a valid theoretical model of reading in itself.</p>
