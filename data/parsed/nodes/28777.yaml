    <p>Do <a href="/wiki/ligature" class="freelinking" rel="nofollow">ligatures</a> improve <a href="/wiki/readability" class="freelinking" rel="nofollow">readability</a>? When I ask this I am thinking of <strong>ff fl fi </strong>etc rather than <strong>st </strong>or <strong>ct</strong> the later being a little distracting I think. I ask this because I had been thinking as an article of faith you might say that certain ligatures ( assuming a ligature design that is not showy or attention getting ) simply did make better word forms and hence generally speaking better &amp; more pleasant immersive reading. </p>
    <p>But think about it again I realize that all I have is my gut for this. </p>
    <p>What do you guys think? </p>
    <p>BTW: Here are some threads &amp; links with related info/ideas. They don't actually deal withis question directly but they are ligature related.</p>
    <p><a href="http://typophile.com/node/9473" rel="nofollow">Ligatures in OpenType: Discretionary vs. Standard</a><br>
