      <p>Eben, and also Christopher for his “they’re good if they’re good”, I leave you your definition of beauty because I like things that are not funtional especially in the semiosphere. What are commonly referred to as ligatures are strictly aesthetic forms, most exist to avoid awkward collisions between characters (or text kerned glyph systems as tradition has it that ligatures should  not be used in display type). They have no phonetic or syntactical roles (some editors dislike ‘&amp;’)----they are strictly typographic constructs.</p>
      <p>Regarding the point whether it is possible to “simply design letters differently to avoid the problems that would have occured” I would say that italics should be set only with the default designed spacing, as for the Roman, I expect old and young type designers to come around to the idea that there are new possiblities in forms but lettering is a precise art and strictly subject to tradition -- you can’t make letters any shape you like, you can’t make houses any shapes you like, unless you live all by yourself on a desert island.</p>
      <p>Eben, I am glad I can count you as sympathetic and skeptical, I have my knowledge, my know-how and my physical being as basis, I'd like to quote Buckminster Fuller for you, “When I’m working on a problem, I never think about beauty. I think only how to solve the problem. But when I have finished, if the solution is not beautiful, I know it is wrong.”</p>
    html_clean: |-
      <p>Eben, and also Christopher for his “they’re good if they’re good”, I leave you your definition of beauty because I like things that are not funtional especially in the semiosphere. What are commonly referred to as ligatures are strictly aesthetic forms, most exist to avoid awkward collisions between characters (or text kerned glyph systems as tradition has it that ligatures should  not be used in display type). They have no phonetic or syntactical roles (some editors dislike ‘&amp;’)----they are strictly typographic constructs.</p>
      <p>Regarding the point whether it is possible to “simply design letters differently to avoid the problems that would have occured” I would say that italics should be set only with the default designed spacing, as for the Roman, I expect old and young type designers to come around to the idea that there are new possiblities in forms but lettering is a precise art and strictly subject to tradition -- you can’t make letters any shape you like, you can’t make houses any shapes you like, unless you live all by yourself on a desert island.</p>
      <p>Eben, I am glad I can count you as sympathetic and skeptical, I have my knowledge, my know-how and my physical being as basis, I'd like to quote Buckminster Fuller for you, “When I’m working on a problem, I never think about beauty. I think only how to solve the problem. But when I have finished, if the solution is not beautiful, I know it is wrong.”</p>
