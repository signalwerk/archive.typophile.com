      <p>Here's what I wanted to say all along, which also may be what Hrant is driving at above. </p>
      <p>Ligatures are I think in principle a liability for reading in a separated script like latin script. However, the overhanging f is a nice differentiating feature in seriffed faces. It is enough of a plus that when you subtract out the slight negativity of introducting ligatures to avoid crashes, it still comes out a plus. So ligatures are a kind of compromise that is overall beneficial, but a compromise none the less. </p>
      <p>So f-ligatures, good. Other ligatures (st, ct etc.) bad in text as they are not necessary to compensate for problem crashes. Of course, in display you can have Zapfino or whatever, but that is a horse of a different color.</p>
