      <p>Perhaps it's unclear where I was heading with this.</p>
      <p>I have to be cryptic, because for now I've overextended myself on Typophile and must attent to other things.</p>
      <p>I'm positing: "sustainability of immersion with effective engagement and good comprehension" as the overall goal of efforts to improve reading performance and readability. I could also say: sustainability of sense following over time and text-extent relative to the varient conditions of reading.</p>
      <p>In cognitive processing terms, with extended texts, there can be a too fast and a too slow, and this relates to the capacities of short term memory and the integration of it's contents into one's 'world'. The speed at which a balance of comprehension and holding on to the thread of narrative or argument is 'found' (or occurs) in practiced readers who don't suffer from reading disorders varies, but hovers about a mean. </p>
      <p>Type plays it's role in enhancing the sustainability of this sense-following by not placing 'maintaining it' at risk for reasons of perceptual processing fatique or expense of neural effort in overcoming neural-attentional diversion, which holes and crashes do. Ligatures address that.</p>
