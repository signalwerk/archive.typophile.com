      <p>&gt; I stop short when I see an un-ligatured fi. So yes, I think they improve legibility.</p>
      <p>I agree, but only for display sizes. When reading text settings (less than 13 pt), I think my eye is just too caught up in decoding words to usually notice a colliding f and i or l.</p>
      <p>What REALLY stands out, though, is an fi-lig or fl-lig that is too cramped. How many times have we all seen a word with loose tracking applied but a "stands out like a sore thumb" auto-inserted fi-lig? Yeesh. That's the real peeve for me.</p>
      <p>As a rule, I say "use 'em at display sizes, but only when the ligs a) avoid a bad collision and b) are close in kerning to the way the letters would appear without a lig.</p>
      <p>--Michael.</p>
