    html: <p>I suspect that Utopia's popularity as a news face might have something to do with this. Given that most news text varies tracking quite a bit to assist justification on narrow columns, if the font has a dotless fi ligature, you will get a variety of ligating and non-ligating f_i combinations in text, with an overall appearance of "quantum dotting", which is probably not a good idea. Therefore the dotted ligature is to be preferred -- at least this was my reasoning for doing it that way in Worldwide.</p>
