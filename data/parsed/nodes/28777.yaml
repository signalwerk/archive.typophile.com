      <p>Does this help (as a pre-amble to what I wrote earlier)?</p>
      <p>The <em>visual wordform</em> is the totality of stems, counters, ascenders, descenders, bowls and between-letter shapes <em>in their visual relationship</em> or <em>pattern</em>. (I refer to sensitivities to how these elements combine as optical-grammatical attunements)</p>
      <p>There are two ways of looking at word recognition in reading. The one says the visual system moves directly from what I have described just now in terms of pattern to the sense or meaning of the word. I call the perceptual process involved in this: visual wordform resolution, and claim it has a neuromechanical component which makes it, all things considered, advantageous. The other says, no the visual system <em>streams</em> stem / bowl / counter / ascender / descender information <em>according to the letters they comprise</em> and from there resolves the identity of the word before linking to meaning. I claim this has a neuromechanical component which makes it, all things considered, counter-indicated. </p>
      <p>Then I say visual wordform resolution is a learned mechanism, involving perceptual learning of the pattern, which develops in learning to read. Because the visual wordform resolution process requires a dependance on stems, etc. <em>in their pattern</em> and not the streaming of letter-part information according to letters ('slot-processing'), a 'respnse bias' of the visual system to that (first) kind of processing, when confronted with word-separated text, develops. (The problems encountered by 'word-blind' (dyslexic) persons demonstrate the <em>consequences</em> of the falure of my 'learned mechanism' to develop.)</p>
