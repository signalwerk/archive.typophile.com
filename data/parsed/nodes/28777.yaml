      <p>Bill, to follow up, essentially I'm averse to downplaying the perceptual processing benefit in favour of the aesthetic benefit. In the case of ligatures they are both operative in our engagement with the text. In isolated instances the costs might seem inconsequential. Over time and a large text the costs might be calculable. Especially if the type of problem ligatures try to solve is endemic to the font.</p>
      <p>I would suspect that the perceptual processing costs are proportionate to the aesthetic costs.</p>
