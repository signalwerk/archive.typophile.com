      <p>I said all of that to say this.  Since I have read just about anything printed, I have been exposed to many fonts and typefaces with and without ligatures.  The one thing I have noticed is that when the flow of my reading is interrupted because I perceive a hitch in spacing in the word structure, one of the reasons (there are others) is because of both the absence and presence of ligatures.  This bump in the reading flow can occur for me at even small point sizes (8).  The factors that come into play for me are:</p>
      <p>1.  If a ligature is present and I bump over it in text, it is usually because the ligature looks cumbersome; the font does not lend itself well to construction of proper ligatures or the ligature structure was poorly implemented in that particular font.</p>
      <p>2.  The opposite is also true; if a ligature is absent and I notice it, the font could probably benefit from a well constructed ligature or better general construction.</p>
      <p>These are just an amateur's opinions; ligatures make reading for me better when they fit well with the font and make it worse when they don't and the opposite is also true.  This kind of reminds me of the Ford vs Chevy discussions that we have here at work (warning! lowbrow content!).  They both have strengths and weaknesses, but both must be used for what they are best suited and that is ususally strictly in the eye of the beholder (or the end user).  </p>
      <p>Thanks for listening.</p>
      <p>All the Best,<br>
      John</p>
      <p>P.S. - I have started using the font Baramond which, I believe is derived from Garamond Antigua.  The implemention of ligatures in this font I find pleasing.</p>
