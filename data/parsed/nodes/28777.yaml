      <p><cite> contextually sensitive ligation , cursive etc.</cite></p>
      <p>Here is what I was getting at:  Let's take the Wy design Nick showed us a while back. ( I tried to dig it up to link to &amp; failed. Sorry. ) He could have made a ligature but he didn't. He made contextual alteration where the h has a shorter serif on the left side so it sits with the Cap w nicely. Did you see it? If he had made a ligature it would have been designed with the assumption that you have a certain range of letter spacing &amp; no more. It's not utterly brittle kind of thing - but compared to non-ligating letter designs, ligatures are more brittle. By brittle I mean when failure does occur - it's BAD and quite obvious. In contrast, contextual alteration permits far more letterspacing before letterspacing causes a failure of equivalent severity and that failure is probably near the point of failure for the type face as a whole. So non-ligating contextual alteration might have a benfit that trumps ligatures.* If so, it would be yet another reason to dig into it with gusto! :-)</p>
      <p>But now I will undermine that arguement a little. The subtlety of very high quality notanic interaction of glyphs probably also depends on letterspacing not getting out of hand. The ratios of tollerance before the 'point' of the design is lost maybe nearly identical to that of ligatures. So, if the point of the design is to be finely tuned and optimized it may be that the kind of robustness I had been talking about is not relevant to contextual alteration for text faces. </p>
      <p>On the other hand it might well be that each case has it's own dynamics and it's a very mixed situation. That's why I am keen to collect lots of samples and watch what's happening. But every experiment needs a hypothesis or two! ;-)</p>
      <p>* Hrant of course, argues that any near-ideal text face will need ligatures and so the point of avoiding them is mute anyway.</p>
      <p>In thinking about differences between what I am after &amp; cursive or Arabic I am kind of knocked out by the enormity of the question. I don't know how much letterspacing if any is acceptable in Arabic fonts. That would be something I would need to know. I can imagine there is a little bit but I bet that in that case &amp; in the case of scripts there is a built in brittleness of a different kind than you would see in a face with only occasional connections. How is that for a start? Maybe you have a different point to make. Do you?</p>
    html_clean: |-
      <p><cite> contextually sensitive ligation , cursive etc.</cite></p>
      <p>Here is what I was getting at:  Let's take the Wy design Nick showed us a while back. ( I tried to dig it up to link to &amp; failed. Sorry. ) He could have made a ligature but he didn't. He made contextual alteration where the h has a shorter serif on the left side so it sits with the Cap w nicely. Did you see it? If he had made a ligature it would have been designed with the assumption that you have a certain range of letter spacing &amp; no more. It's not utterly brittle kind of thing - but compared to non-ligating letter designs, ligatures are more brittle. By brittle I mean when failure does occur - it's BAD and quite obvious. In contrast, contextual alteration permits far more letterspacing before letterspacing causes a failure of equivalent severity and that failure is probably near the point of failure for the type face as a whole. So non-ligating contextual alteration might have a benfit that trumps ligatures.* If so, it would be yet another reason to dig into it with gusto! :-)</p>
      <p>But now I will undermine that arguement a little. The subtlety of very high quality notanic interaction of glyphs probably also depends on letterspacing not getting out of hand. The ratios of tollerance before the 'point' of the design is lost maybe nearly identical to that of ligatures. So, if the point of the design is to be finely tuned and optimized it may be that the kind of robustness I had been talking about is not relevant to contextual alteration for text faces. </p>
      <p>On the other hand it might well be that each case has it's own dynamics and it's a very mixed situation. That's why I am keen to collect lots of samples and watch what's happening. But every experiment needs a hypothesis or two! ;-)</p>
      <p>* Hrant of course, argues that any near-ideal text face will need ligatures and so the point of avoiding them is mute anyway.</p>
      <p>In thinking about differences between what I am after &amp; cursive or Arabic I am kind of knocked out by the enormity of the question. I don't know how much letterspacing if any is acceptable in Arabic fonts. That would be something I would need to know. I can imagine there is a little bit but I bet that in that case &amp; in the case of scripts there is a built in brittleness of a different kind than you would see in a face with only occasional connections. How is that for a start? Maybe you have a different point to make. Do you?</p>
