      <p>I've been 'lurking' in this thread and have learned a lot from so many erudite posts. One thing I've been wondering, though, is whether this discussion should first be approached from the other end, so to speak.</p>
      <p>Before diving into the complexities of how ligatures and other lettershape features affect word image and, ultimately, readability, shouldn't one look into the expectations of people from different cultures and printing traditions?</p>
      <p>To me, Patty's comment says it all:</p>
      <p><em>I stop short when I see an un-ligatured fi. So yes, I think they improve legibility.</em></p>
      <p>My reply would be, "Well, yes, but that's because you're a type nut, like the rest of us."</p>
      <p>People who have lived their whole lives in places with little or no typographic tradition (like Brazil) are not at all unlikely to never have laid eyes on a 'standard' ligature. Couldn't it be that ligatures cause more of an imbalance to the word image that those people expect to see than so-called 'crashes'? After all, one can only process ligatures without any conscious effort if one is intimately familiar with them. In other words, if all one has seen their whole lives is 'unsightly' collisions between f's and i's, perhaps that's what they expect to see.</p>
