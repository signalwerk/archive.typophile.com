      <p><em>So, then there are legibility, readability and usability.</em><br>
      ...and <a href="/wiki/readerability" class="freelinking" rel="nofollow">readerability</a>.<br>
      when Eben asked me my opinion on this topic in an email a few weeks back, i replied that i believed that ligatures are a "typographic nicety," but that my views on readability issues tend to follow John Hudson's ideas about the ability of readers to adapt. i think "ligatures do (or do not) improve readability" is tough to argue, because it's all about specifics. there are so many variables that may or may not improve readability that it's probably next to impossible to isolate them to measure them: serif vs sans, leading values, spacing issues, x-height, point size, medium, &amp;c. &amp;c. all this talk about readability might possibly be a red herring which detracts from the amazing ability of the reader to adapt to a wide range of reading environments.</p>
