      <p></p><div class="imageWrap"><img src="http://typophile.com/files/pfis_6149.png"></div><br>
      The unfolded f, e.g. in Palatino, at left, minimizes the need for ligatures, but is apt to create vertical "fingers' (the reverse of "rivers") with descenders in the line above.<p></p>
      <p>The strongly terminated f, shown centre and right, is better disambiguated from adjacent descenders, but at the cost of requiring ligatures.</p>
      <p>Traditional serifed typography, which did not use extra leading, was and is dependent on type forms where the f ligatures are absolutely essential. One sees this notably in type associated with the Morison years at Monotype, as in his little book on type practice, which is set in a solidly leaded Bembo, if my memory is correct.</p>
