      <p><cite>one can only process ligatures without any conscious effort if one is intimately familiar with them</cite></p>
      <p>I think this idea is a mistake. It's true that familiarity ( culture) has it's effects. Culture is not a minor aspect.  It's a big deal. It is however, just one part of the puzzle. I ( and I suspect most of us here - correct me if I err) think that there is such a thing as better &amp; worse design. I would be willing to bet that a well designed ligature will beat crashing &amp; holes in what ever population you toss it into. And a poorly designed one will not. Assuming you are not stressing the font out with heavy spacing as Will harris ( see above) points out. Also, all the ligatures pairs and triples are different. an fi is not a ct. I would argue that the ct is more significantly an artifact of the chrographic origin of the lower case. It's more vestigal and has less obvious visual utility. Where as the fi ( when it is designed well) has quite alot of visual utility.</p>
