      <p>When ligatures work ( or don't) I think the impacts aught to be thought about perceptual processing terms to be sure, and in terms of comprehend-ability and in terms of simple measures such as speed, and ... many many things. There are lots of ways of slicing this. </p>
      <p>So as far as I can tell I don't disagree with you on that.</p>
      <p>So; far from advocating one particular way of slicing this - my point had to do with the unusualy contingent or accutely provisional context in which ligatures are designed. That being, ligatures may be needed: badly, a little, or not at all. In contrast, an 'A' or 'a' of some kind is always needed. And ligatures themselves are suited to their font's actual needs (or not) by degrees. Even though I liked David's axiom very much in some ways - these factors seemed left out of it. </p>
      <p>That's the problem with saying something pithy &amp; axionmatic about ligatures. All the factors count and there are almost too many of them.</p>
