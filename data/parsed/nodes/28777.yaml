      <p><em>better typography may be able to improve perception of glyphs and word recognition, and reduce fatigue, but not aid much in decifering meaning when either the writing is convoluted or the terms are unfamiliar</em></p>
      <p>Yes, that's exactly what I meant. Obviously, in order to comprehend a text one first needs to be able to recognize the bits that make it up, namely letter shapes and word forms. I have no doubt that good typography can make a world of difference in this process.</p>
      <p>When it comes to making sense of all the printed words that have already been decoded, however, I'm not quite sure how good typography helps, even if I suspect that it does. Perhaps Hrant et al are right: it's all a matter of comfort. The more comfortable the reading, the longer one can read and the more energy one can devote to interpreting meaning (since less energy is expended in recognizing glyphs and words).</p>
      <p>When I read something long on a computer screen, I start getting restless because of discomfort and this may cause me to pay less attention to the text, even if I have no trouble making out letters and words.</p>
      <p><em>Type plays it’s role in enhancing the sustainability of this sense-following by not placing ‘maintaining it’ at risk for reasons of perceptual processing fatique or expense of neural effort in overcoming neural-attentional diversion, which holes and crashes do.</em></p>
      <p>Yes, that makes sense. I guess that's the conclusion I came to in the previous paragraph.</p>
