      <p>The other difficulty is that some sets of ligs are done better than others.  It might be hard to make a blanket statement about ligatures without measuring the difference between the good ones and the not-so-good ones.<br>
      The main job of the lig is to avoid the crash and the hole.  To me, it makes sense that a crash and a hole can cause a brief moment to sort out slowing down the reading a tiny amount. Context solves most of it but I find when I am looking at text in a foreign language, the absence of ligs seems most jarring--I have no context to help me there.<br>
      The other issue is with typography that is readable enough as words and language but whose meaning becomes enhanced by typographic effects including ligatures. This is probably not the case for emersive reading but might hold true for the things we might dwell over reading a bit longer--covers, ads, menus, art books, display material...</p>
      <p>ChrisL</p>
