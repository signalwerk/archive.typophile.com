      <p>Actually Eben, I think Nigella's reply makes me think I still have a ways to go in making plain to a general audience my frames of reference. Looking back I see I could have done and need to do more.</p>
      <p>Immersion in numerous studies of word recognition convince me of the need for sharper terms of reference. Without that immersion it might be hard to see the need for them. And besides, I could be wrong. My own sense of my terms is that they open up novel, physiologically grounded ways of thinking through action at the micro-typographical level.</p>
