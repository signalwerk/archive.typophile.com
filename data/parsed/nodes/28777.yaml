      <p><cite> if it doesn’t need ligatures! </cite> I think the point I was making is separate because I was thinking ( assumptions at work - look out! ) of display &amp; text at that time where as you are always in text mode. ;-) Also that phrase does not include references to maximality per se -just to improvement.</p>
      <p>But to address your point, if I get you: I have not firmly concluded that what your saying about text faces is utterly true. But my very strong suspicion is that in spirit what you are is quite correct. Partly it's because I know I have alot more looking and study to do before I could possibly have seen for myself that this is so. But in addition to that I am still keen on the idea that ligatures are just one kind of contextual alteration that could be applied to improve text faces. </p>
      <p>They are the most obvious because they seem to break the 'rule' that glyphs don't touch in Latin. They might also be the most gross in terms of the size or scope of the alteration. I have not assembled a good list of contextual alterations yet so again, I am working on it. </p>
      <p>But again, given the options of ligatures ( or no ) in a text face with and assuming the options we are conventionally aware of, I think I would simply agree. That partly because I think ligatures achieve a better notanic relationship than the design solutions created to avoid needling ligatures do. </p>
      <p>I am also starting to characterise what I think is going on there - I think ligatures offer a richer or more complex notanic relationship, and that is maybe one of the reasons they are valuable to a text face.</p>
      <p>But in terms of my own theory with specific emphasis on text faces; the ideas fighting for equity in my mind now are wheather the ligature is perhaps great but flawed approach. Maybe in a 'perfect' font a ligature is a little too inflexible a solution. Maybe ligatures are a kind of protrotype alteration that hints at a better way. </p>
      <p>The rival idea is that ligatures are just one of a broader range of partially undiscovered/documented pro-notanic alterations that are possible the 'rightness' of which are purely need/context based. As of today the later idea is winning. </p>
      <p>The underlying question that separates these two ideas the degree to which a type designer can ever hope to control the way in which the face is used. Obviously there are lots of instances in which fonts are basically abused. But in general there is a trend towards font awareness and appreciation, care, respect, etc. And in the case of a special, perhaps bespoke face for immersive reading, [ Hi Tiff! there's your word ;-) ] maybe the type designer could start to expand their influence to issues of leading, word space &amp; so on. In the case where the type designer succeeds in that the place of ligatures is stronger. If you are designing with robustness or 'abuse resistance' in mind this is less true. </p>
      <p>Anyway, thats the way the shades of grey are swirling for me at this time.</p>
