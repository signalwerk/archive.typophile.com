      <p>David Berlow gets the the shift in referential framework I'm trying to encourage.</p>
      <p>A Modest Proposal: Let's reserve the terms legibility and readability for base-level experiential judgements about writing and texts (with both language use and typographical formatting being factors in the perception of readability), where they are more at home. Familiarity with the script, facility at visual wordform resolution, adequate discrimination affordances of role architectural particulars and proper saliency of criterial features are (co)operative within these base-level experiential judgements of the typographical component of the readability of texts. Let science isolate, denominate and focus in on them.</p>
      <p>Than let's ask more interesting and testable questions like: do serifs, tight spacing and ligatures promote or inhibit visual wordform resolution / promote 'response bias (to the whole) collapse"?</p>
