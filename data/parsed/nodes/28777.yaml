      <p>&gt; I stop short when I see an un-ligatured fi. So yes, I think they improve legibility.</p>
      <p>As would be the case with most of us here. But that is because we are trained to look for them, just as typewriter quotes bother us, and slow down our reading. But to most people, these typographic niceties are not recognized, and would not cause them to "stop short."</p>
      <p>I see it as a case, like so many other things, where good typography can give good color to a page, and that can improve reading. Will Harris makes some good points in his article (linked above). I will insist that good color does improve readibility, at least until someone shows me a study that refutes it.</p>
      <p>Bad color ... the worst case being the use of bold words sprinkled within text ... means that the eye is attracted to the (bold) words, breaking the normal flow of the text. This has to decrease readability as the eye is jumping about unnecessarily.</p>
      <p>Lining figures, fake small caps, full cap acronyms, and other bumps in the road to good color will all do the same thing, although  not as badly as bold text.</p>
