      <p>"type designers use aesthetic criteria to judge that balance."</p>
      <p>That is only part of it. Granted, it is not a scientific measure used by type desighners but their trained eyes are capable of seeing disruptions in visual pattern that are caused by missfitted neighboring glyphs. They either fix the problem with adjustments to the outlines or with font metrics--fixed or kerning based.  If this fails, ligatures may be a solution.  I don't think these decisions are based so much on the aaesthetics of the type as they are on what the type designer feels is the function of the type. Anyone can debate if the type designer is successful in fixing problem crashes and holes (people like Kevin may be able to measure the effectiveness in some more concrete way) but I don't think the typical type designer would call his an aesthetic decision.</p>
      <p>ChrisL</p>
