      <p>So, there are different kinds of ligatures. Those that are used in text to reapportion areas of saliency in the total figuaral word-object, so that the balance of cue-values for criterial recognitional features is maintained, (or they "look better" than the default glyphs), are aides to readability (fi, at least). Those ligatures that are used in text to embellish the total figuaral word-object, so that the balance of cue-values of criterial recognitional features is disturbed to the reader, should do so for some purpose, or risk doing so for nothing, or less.</p>
