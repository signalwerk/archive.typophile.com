      <p>It seems to me that speed can never be ignored. I can see a very clear distinction between efficiency (speed at which letter shapes/word forms/word clusters are correctly recognized) and efficacy (speed at which comprehension occurs), but speed is a component of both.</p>
      <p>Complex as research on reading efficiency may be, it's probably child's play compared to research on reading efficacy. After all, comprehension quickly leaves the realm of visual processing and enters a nebulous domain populated by variables such as intelligence (or intelligences), attention span, education, culture, cognitive strategies, length and complexity of sentences, and so on.</p>
      <p>If I take myself as an example, I'm well educated by most common standards, score above average on traditional IQ tests and exams, am a very efficient reader, but not a very efficacious one in that I read rather slowly when I need to actually comprehend a text. I suppose I'm not very good at concentrating and need to re-read some passages, especially when the writing is convoluted and when there are many levels of nested structures in a sentence. Could typography improve my reading efficacy? I really don't know.</p>
