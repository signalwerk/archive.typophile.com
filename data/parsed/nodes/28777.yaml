      <p>Let me put what I am anxious to communicate this way and put the shoe of incomprehensibility on the other foot:</p>
      <p>Ligatures, where they are necessary to avoid holes and crashes when type is rhythmically spaced enhance the ease of visual wordform resolution. I've tried to detail what this means and how this might work.</p>
      <p>If you prefer to say: ligatures improve readability because they speed up recognition and this is shown by the fact that texts with ligatures are read faster, go ahead. But how much is actually being said? When I ask how this works and why this is so, the term readability doesn't help me to an explanation, and the term recogntion doesn't isolate finely enough where in the process the advantage is acheived. To dig deeper--to be more informative--I need to expand my repertoire of terms and extend my knowledge of the percptual and cognitive mechanics. The risk of digging deeper, expanding the repertoire of terms, extending knowledge into 'subatomic' areas, is the perception of making relatively straightforward things seem more complex than necessary. </p>
      <p>It's not for everyone.</p>
