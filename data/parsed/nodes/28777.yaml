      <p>You may be right Peter. I really don't know, of course. I am just guessing that this is not a big factor. Reflecting on this again, let me partly retract what I said. I was reacting to the fact that I and other people don't notice the fi crash in Times Roman in MS Word, where they don't have ligatures. There are just millions of documents like this. However, if fi ligatures were all over the place in a language, it would be important. But I wonder if then it might be better just to have no overhanging f. </p>
      <p>On the gap at the bottom of a seriffed n. Funny thing, I was just working on that yesterday. I think it has a lot to do with having the 'n' look balanced and even in color within words. I think here the aesthetic and readability considerations largely coincide. The balance and even color give the neutral background against which only the salient features of the n stand out as different and are easily and instantly registered by the eye and brain, without any distraction. Of course, connecting the bottom of the n completely would also change the architecture, so that apprearance would need to be avoided.</p>
