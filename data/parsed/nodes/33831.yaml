    <p>I've just installed InDesign CS3 (trial) and am a little disappointed that it didn't import -- or even offer to import -- my InDesign CS2 configurations and preferences. I just can't believe that I'll have to recreate all my workspaces, arrangement of panels, default character and paragraph styles, etc, etc, etc. Any suggestions?</p>
    <p>(Sorry if this has been asked and answered before, but the search facility yielded no results. I'm a bit suspicious, though, because the term <em>cs3</em> alone returned no results either, but I'm sure there's been some discussion about the new Creative Suite.)</p>
