    html: |-
      <p>Erik et al,</p>
      <p>The workspace model has changed dramatically from CS2 to CS3. The underlying technology is completely different, and that was the only way to go, <a href="http://www.adobe.com/designcenter/video_workshop/?id=vid0065" rel="nofollow">in order to provide the current flexibility</a>.</p>
      <p>Unfortunately that comes with the trade-off that the preferences are not sharable between the two versions. AFAIK, if anyone tries to use the “Active-Workspace.xml” file from CS2 with CS3, will get a warning message saying that the file was saved in an old format.</p>
      <p>BTW, in case someone is doing InDesign scripting, this change will also affect you.<br>
      <a href="http://www.adobe.com/devnet/indesign/sdk/InDesign_CS3_SDK_whats-new.pdf" rel="nofollow">As noted on this file</a> (PDF),<br>
      <cite><strong>Palette and Panel-related APIs Changes</strong> — Adobe adopted a new common palette appearance for all Adobe Creative Suite® 3 applications. Implementing this new appearance in InDesign required an extensive rewrite of InDesign’s palette system, including changes to public APIs and how palette resources are specified.</cite></p>
    html_clean: |-
