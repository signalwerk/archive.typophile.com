      <p>Thanks, Tina and Tiffany. I was reluctant to copy files from the CS2 to the CS3 install/configuration directories because there have been changes in the way some things work, so inevitably there will be changes in the structure of most configuration files. But by now I think it's pretty clear that Adobe has not provided us with any simple, hassle-free alternatives.</p>
      <p>Ain't that nice: launch a slightly modified version of your software every year, charge a few hundred dollars for the upgrade (several hundred if you are in the developing world), and don't even bother to make transition from the previous version easy. Way to go, Adobe.</p>
