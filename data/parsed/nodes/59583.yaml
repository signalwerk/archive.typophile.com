    <p>Hi Typophiles,</p>
    <p>I'm having trouble with a custom font I created in FLS5: It's appearing at the bottom of Word's font menu, below the last alphabetical listing. The font contains special glyphs placed in FL's Supplementary Private Use Area-A, which I suspect is why the font appears down there (with all the CJK fonts). Does anyone know how I can get the font to appear in it's correct alphabetical position, without removing glyphs?</p>
    <p>Also, a related problem is that the font does not appear under Word's Insert &gt; Symbol menu. I have Googled, searched the Forums both here and on FontLab without any luck. Any help from anyone is appreciated!</p>
