    html: |-
      <p>ATF</p>
      <p>It’s just an assumption: Check the box "Encoding and Unicode, Unicode Ranges, <strong>Private Use</strong>". (I think you can trust in the auto settings of this FontLab dialog. You know, normally you cannot blindly trust in the auto functions of FontLab.) But there is a problem, if you have an italic style (linked to regular) with more glyphs in the PUA than the regular style, at least in OpenOffice. Then you cannot access the part of the PUA of the italic style, that is missing in the regular style. So you probably should provide dummy characters in the regular style. Furthermore I assume, that the Unicode points of the PUA characters should be the same in both styles, at least I doubt, that Word can find the italic partner of the dummy character, if its Unicode point is different.</p>
      <p>In this context a general tip: Don’t style link to bold, at least not in those cases, in which your font family contains more than two weights!</p>
