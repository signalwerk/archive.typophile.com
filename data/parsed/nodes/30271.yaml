    html: |-
      <p>DeKine - how I miss the aroma of the mimeograph machine, Mum in the kitchen turning away as political flyers were reproduced for a larger portion of the population. Even in Manhattan in the 1950s -- your mimeograph had to be registered!</p>
      <p>Meanwhile, I have two hopes for a new trend for 2007. Here goes - and please no laughing...</p>
      <p>1. The return of proper punctuation. Damn you - it's a quote mark, not a inch mark!<br>
      2. Readability. Of all my years in typography professionally, we strove for legibility. Now, I feel the age of grunge is behind us, may we please get back to reading materials again. I thank the Dutch Type Foundry -- I found them recently, and believe they have some of the cleanest type designs I have seen since Berthold's Formata.</p>
      <p>Really, sometimes history is good - and okay to repeat itself. That's my hope, we go back to "clean" type. Not to inhibit design, mind you -- but...to be able to communicate to the general public. (Hey wait -- that's what good typography was always about....)</p>
    html_clean: |-
