      <p>&gt; <em>By the end of 2007, over 50% of all fonts licensed will be in OpenType format.</em></p>
      <p>I'm sorry to say that the adoption rate was a little slower that I hoped. According to <a href="http://www.fontshop.com/20years/" rel="nofollow">FontShop's figures</a>, OpenType didn't hit 50% until late in 2009. But I can tell you that the curve continues its sharp upward trend. OT is well above 50% in 2010. Maybe 75% by the end of the year.</p>
      <p>That number is helped by the font manufacturers. Since <a href="http://typographica.org/2009/features/our-favorite-typefaces-of-2008/" rel="nofollow">2008</a>, nearly <em>all</em> new fonts were released in OpenType.</p>
