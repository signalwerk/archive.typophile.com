    <p>Thought I'd kick this off, with a look into my crystal ball...</p><ol><br>
    <li>More industry consolidation, continuing the trend of 2006 when Monotype acquired Linotype.<br>
    </li><li>We'll be seeing a lot more of Calibri, as Office 2007 rolls out with it as the new default.<br>
    </li><li>Intense public debate over ClearType, with Vista, IE7 and Office 2007 having CT on by default and with new Microsoft document fonts targeting the rendering environment.<br>
    </li><li>Font licensing issues coming into sharp focus…<br>
    <ul><br>
    <li>With high-def DVD formatted titles and WPF applications relying on shipping OpenType fonts.<br>
    </li><li>Browsers starting to support raw font downloads and temporary installation for Web page rendering.<br>
    </li><li>Font-themed personalities on mobile phones and other devices.<br>
    </li></ul><br>
    </li><li>More talk but little action on the open source fonts front.<br>
    </li><li>Comic Sans Flair and Helvetica Flair finally being released.<br>
    </li><li>TypeCon Seattle will be the best ever.<br>
    </li><li> Apple announces new DRM protected font format - JobsType. Bruno Steinert comes out of retirement announcing new venture making JobsType fonts.<br>
    </li><li> FontLab produces XBox 360 version of FontLab</li></ol><p></p>
    <p></p>
