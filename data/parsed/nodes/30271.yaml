      <p>Regarding Si's #8;<br>
      I would add that "JobsType" would be followed by a competing type format springing out of a deal between type designers in northern Canada, Alaska, Siberia, and Finland which would be founded upon recently rediscovered coldtype libraries from the 60s. To avoid copyright infringement on both the the names "Coldtype" and "JobsType", the new competing format would be called "SnowJobs". The two type formats would do battle in type wars which would legally be called the "Cold War" because that name was never copyrighted.</p>
      <p>ChrisL</p>
      <p>PS: Bill Clinton and Monica Lewinski thought about joining the battle but the name they chose for their font format was banned from public disclosure due to a gag rule. When asked about the nondisclosure, Monica was reported to say that she still gets all choked up thinking about it.</p>
