  html: |-
    <p>hey, has anybody thought about names of typefaces appearing in pop songs. and - if they do appear - does that mean anything? like, is there some spiritual insight when type and music link?</p>
    <p>take this for instance: i've always considered the HOBO being one of the most useless faces around, still it keeps popping up. then today, i found the song "hobo blues" by jack johnson - perfect fit or mere coincidence?</p>
    <p>listen to this (hope it works...)</p>
    <p><a href="http://www.amazon.com/gp/music/wma-pop-up/B0000UX5IY001004/ref=mu_sam_wma_001_004/002-8441353-0353604" title="http://www.amazon.com/gp/music/wma-pop-up/B0000UX5IY001004/ref=mu_sam_wma_001_004/002-8441353-0353604">http://www.amazon.com/gp/music/wma-pop-up/B0000UX5IY001004/ref=mu_sam_wm...</a></p>
    <p>does anybody else see the connection? </p>
    <p>cheers,<br>
    curtze</p>
