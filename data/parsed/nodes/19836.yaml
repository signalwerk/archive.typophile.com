      <p>If the designer is still alive I'd agree that this is your best first step. Your best second step is to approach the foundry and read the EULA. If the EULA allows modifications and/or derivatives you shouldn't have any problems. However, even then most foundries who do allow mods and derivs allow it only for in house use, ergo not for resale. So, that takes you back to the first two steps. </p>
      <p>So, you aren't going to tell us the font?</p>
