    html: "<p>I’ve never noticed a glyph palette in Photoshop. However, two suggestions for inserting the exact character: 1) Open the ’Keyboard Viewer’ or 2) Open the ’Character Palette’. Both methods allow for insert text into an active text box in Photoshop.</p>"
