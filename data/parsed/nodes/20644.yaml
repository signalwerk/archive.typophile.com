    <p>I am now using “Dear Sarah Pro” in Photoshop and would like to access some of the other characters (like alternate f’s, etc) like you can see here:<br>
    <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000104" title="http://www.veer.com/products/typedetail.aspx?image=UMT0000104">http://www.veer.com/products/typedetail.aspx?image=UMT0000104</a></p>
    <p>When I go into Photoshop - Character - OpenType, I only see Swash and Titling Alternates as options. Is there another way I get those characters to show up?</p>
    <p>Thanks!<br>
    Shana</p>
