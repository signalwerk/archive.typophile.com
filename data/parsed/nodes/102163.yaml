    html: "<p>I don't have a perfect match for this one. If I have to reproduce it, I would probably start from <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/urw/eurostile\" rel=\"nofollow\">Eurostile Extended Black</a> (the only difference I can quickly identify is /D counter internal shape) and customize it (cutting some crossbars). For the rest, it's very <a class=\"freelinking external\" href=\"http://www.myfonts.com/foundry/Typodermic/\" rel=\"nofollow\">Typodermic Ray Larabie</a>, some of his fonts could fit almost perfectly: <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/typodermic/sui-generis\" rel=\"nofollow\">Sui Generis</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/typodermic/pirulen\" rel=\"nofollow\">Pirulen</a>... Another option would be to have a look to <a class=\"freelinking external\" href=\"http://www.dafont.com/theme.php?cat=303\" rel=\"nofollow\">Techno &gt; Sci-Fi</a> and <a class=\"freelinking external\" href=\"http://www.dafont.com/theme.php?cat=304\" rel=\"nofollow\">Techno &gt; Various</a> to pick a good base font to customize or, may be, a match.</p>"
