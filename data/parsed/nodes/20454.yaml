    <p><strong> <a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/History" class="freelinking" rel="nofollow">History</a> : Illumination </strong></p>
    <p>Illumination is the art of decorating a manuscript with line drawings, colour and gilding. The art of illumination was revived in Victorian times through the encouragement of people such as Henry Shaw, who copied manuscripts held in the British Museum with the cooperation and support of Sir Frederic Madden, the Museum's Keeper of Manuscripts; <a href="/wiki/William%20Morris" class="freelinking" rel="nofollow">William Morris</a> and <a href="/wiki/Edward%20Johnston" class="freelinking" rel="nofollow">Edward Johnston</a>. </p>
    <p>Illuminated manuscripts of medieval times were almost always religious books. The texts were written in <a href="/wiki/Uncial" class="freelinking" rel="nofollow">Uncial</a>, <a href="/wiki/Carolingian%20Minuscule" class="freelinking" rel="nofollow">Carolingian Minuscule</a> and <a href="/wiki/Humanistic" class="freelinking" rel="nofollow">Humanistic</a> scripts. The pages were vellum (finely scraped and stretched calf- or goatskin) and often beautifully bound with gold and gems set into the covers. The decorations helped the users of the books navigate through the pages in the absence of page numbers or running titles. Large illustrations (such as the Gospel pages in <a href="/wiki/Book%20of%20Kells" class="freelinking" rel="nofollow">Book of Kells</a> and the <a href="/wiki/Lindisfarne%20Gospels" class="freelinking" rel="nofollow">Lindisfarne Gospels</a>) could be held up to show to an illiterate audience. Illumination also served glorify the word of God; possibly illumination may have "protected" the books from evil, with crosses and symbols serving as talismans. </p>
    <p>References</p>
    <ul>
    <li>de Hamel, Christopher. <em>A History of Illuminated Manuscripts</em>, 1986. ISBN-0-7148-2361-9</li>
    <li>Jarman, Christopher. <em>Illumination for Modern Calligraphers</em>, 1988. ISBN-0-8230-2534-9</li>
    <li><a href="/wiki/Edward%20Johnston" class="freelinking" rel="nofollow">Johnston, Edward</a>. <em>Writing &amp; Illuminating, and Lettering</em>, 1906.</li>
    <li>Shaw, Henry. <em>Illuminated Ornaments Selected from Manuscripts of the Middle Ages</em>, 1833.</li>
    </ul>
