    <p><strong> <a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12207" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">History</a>&nbsp;:&nbsp;Illumination </strong></p>
    <p>Illumination is the art of decorating a manuscript with line drawings, colour and gilding. The art of illumination was revived in Victorian times through the encouragement of people such as Henry Shaw, who copied manuscripts held in the British Museum with the cooperation and support of Sir Frederic Madden, the Museum’s Keeper of Manuscripts; <a href="/node/12139" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">William Morris</a> and <a href="/node/12134" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Edward Johnston</a>. </p>
    <p>Illuminated manuscripts of medieval times were almost always religious books. The texts were written in <a href="/node/13703" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Uncial</a>, <a href="/node/13704" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Carolingian Minuscule</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Humanistic" title="Create node &quot;Humanistic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Humanistic</a> scripts. The pages were vellum (finely scraped and stretched calf- or goatskin) and often beautifully bound with gold and gems set into the covers. The decorations helped the users of the books navigate through the pages in the absence of page numbers or running titles. Large illustrations (such as the Gospel pages in <a href="/node/add/wiki?edit%5Btitle%5D=Book%20of%20Kells" title="Create node &quot;Book of Kells&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Book of Kells</a> and the <a href="/node/add/wiki?edit%5Btitle%5D=Lindisfarne%20Gospels" title="Create node &quot;Lindisfarne Gospels&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Lindisfarne Gospels</a>) could be held up to show to an illiterate audience. Illumination also served glorify the word of God; possibly illumination may have “protected” the books from evil, with crosses and symbols serving as&nbsp;talismans. </p>
    <p>References</p>
    <ul><li>de Hamel, Christopher. <em>A History of Illuminated Manuscripts</em>, 1986. <span class="caps">ISBN</span>-0-7148-2361-9</li>
    <li>Jarman, Christopher. <em>Illumination for Modern Calligraphers</em>, 1988. <span class="caps">ISBN</span>-0-8230-2534-9</li>
    <li><a href="/node/12134" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Johnston, Edward</a>. <em>Writing <span class="amp">&amp;</span> Illuminating, and Lettering</em>,&nbsp;1906.</li>
    <li>Shaw, Henry. <em>Illuminated Ornaments Selected from Manuscripts of the Middle Ages</em>,&nbsp;1833.</li>
    </ul>
