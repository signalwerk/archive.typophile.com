      <p>I suppose the question would be, what are you being paid for this identity design. If you are doing it on the cheap then the $314.00 for FF Clan Pro may be a budget buster, but if you are charging industry rates, than a $314.00 investment to license the fonts so you can put forth a strong proposal seems like a small price to pay.</p>
      <p>And what happens when your client accepts your font proposal. Most likely they are going to have to invest in a substantial company-wide license to utilize the fonts in your identity program. No?</p>
      <p>James</p>
