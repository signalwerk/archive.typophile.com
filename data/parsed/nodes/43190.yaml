    <p>Hi All,<br>
    I’m currently in the midst of building an identity system for a client at the moment and I’ve managed to find a suitable font which is FF Clan Pro for the system.</p>
    <p>For the logotype I’ve managed to vector trace a snapshot of the font as a place holder but now I’m at the stage where I’m visualising all the applications and collaterals and it’s tough not having the font. I really want to sell this font to the client so they can use it across all their communication, including touchscreen etc.</p>
    <p>How does one go about visualising a project like this without the font<br>
    Thanks</p>
