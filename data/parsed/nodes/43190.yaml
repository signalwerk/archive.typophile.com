      <p>I totally agree with belleisle... from my experience it’s better to raise your fee to cover typeface purchases and factor it in when you work out the initial budget. </p>
      <p>Or else people do tend to question it and you end up being forced to limit your choices. As designers we don’t have a lot of expenses once we have all the equipment – so treat it as you would treat anything else you outsource (photography, illustration...).</p>
      <p>If there’s no way you can raise the initial funds – consider billing half up front.</p>
      <p>But in this case you can only really either just go for it and get back the cost in your bill, or try and see if the foundry will let you have a trial version.</p>
      <p><a href="http://vllg.com">Village</a> also do a thing where if you purchase one weight (pretty affordable) you can go back and purchase the family at the discount package price. </p>
      <p><a href="http://vllg.com/Schwartzco/StagSans">Stag Sans</a> Medium looks fairly similar to FF Clan Pro.</p>
      <p>Ed</p>
