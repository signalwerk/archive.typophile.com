      <p>You raise a good point.<br>
      The answer is it not always that easy.</p>
      <p>1. The best solution is that the budget is expansive enough to allow the purchase of font(s) in the development process.</p>
      <p>2. Another solution is to contact the foundry and secure the font on a trail basis. (some foundaries understandably won’t do this).</p>
      <p>3. A third solution is to substitute a similar font in its place and sell the client a paper print out of the font style you want to use. This approach is often flawed as a lot of clients will say why am I having to pay or an extra font when the one you have used looks perfectly OK.</p>
      <p>4. My preferred solution is to factor in font purchases when I quote up front for the job, not giving the client the option. If you think about it, even if you were to use the fonts that come ’free’ with, for example the Creative Suite, you have had to pay for them indirectly when you purchased the software. It makes business sense to pass on the cost of font licensing in the same way you would pass on the cost of laser prints, writing CD-R’s etc etc...</p>
