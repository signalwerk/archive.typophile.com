    <p>Hi,<br>
    my name is guy ,new here.<br>
    except this im also a graphic design student in my final year,<br>
    at the academy of design and education wizo haifa,israel(its long)<br>
    and starting working on my final project.</p>
    <p>my project is a reserch on the relation between architecture and typography.<br>
    the base point of this reserch lay on the term "spaces",which as you all know<br>
    spaces define form, and the function of spaces is the essence of the "product",<br>
    at first i thought on working with constructional arch'(all forms of buildings+)<br>
    to explore and find any pattern,grid,understanding,while searching for some material<br>
    in the internet and talking to some arch'rs i found the term "noli map" and for those who<br>
    dont know its a way to map a city to public space and living spaces,in a way that(first design by<br>
    an italian arch'r,nolli, at the 18 century in rome).<br>
    let say black=neigborhoods white=parks,shoping areas and so on,as i say only in black<br>
    and white,well its got me and i thought it will be better to relate the reserch to city space<br>
    to find a way to explore relation between the public spaces and the living spaces,<br>
    and base on the results to design typeface,that reflect the nature of the city in its dynamic,<br>
    thats it more or less.</p>
    <p>i would like to hear anything that can help/inlight/cancel/++<br>
    thank you very much<br>
    guy</p>
