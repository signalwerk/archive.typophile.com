      <p>A really interesting book (which I found out about thanks to Lawrence<br>
      and John H) that draws parallels between typefaces and other cultural<br>
      contributions -including architecture- is "The letter as a work of art;<br>
      observations and confrontations with contemporaneous expressions<br>
      of art from Roman times to the present day" by G Knuttel, 1951.</p>
      <p>hhp</p>
