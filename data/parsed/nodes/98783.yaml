    <p>Hi Everybody</p>
    <p>I couldn’t find an intro thread so here goes...</p>
    <p>I saw some interesting topics on this forum (like the “business card” thread) and liked the “feel” of it - not the usual bickering as on some forums. Also quite a few members here seem to be “old school” which also interests me :)</p>
    <p>I’m a semi-retired printer (letterpress and litho) based near Leeds, UK.</p>
    <p>I’ve had a long term interest in typography - starting in 1964 as an apprentice compositor (typesetter) with a small family letterpress firm and starting my own little litho and letterpress business in 1977. This business is now run by my son and I’m just in the background - although I still enjoy using the old methods and like to produce the occasional short run bespoke business cards myself in letterpress foil on a small hand machine.</p>
    <p>I found the resurgence of demand for letterpress very interesting - and a little surprising - the letterpress Christmas cards offered by Steve Jobs had a lot to do with my own renewed interest and also the general resurgence in demand for letterpress, I think - anyway that’s about it :)</p>
    <p>- David</p>
