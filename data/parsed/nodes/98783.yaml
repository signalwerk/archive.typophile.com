      <p>So I had to Google "Arab Platen" — it looks like a flywheel operated platen press, similar to most C&amp;Ps. The Pilot, on the other hand, is a table top platen press, operated with a lever. It was designed for high schools, more as a tool to explain and practice the basics of letterpress than for any real job work. It's a lot more difficult to injure yourself with than a flywheel press.</p>
      <p>By the way, do you know about <a href="http://www.briarpress.org" title="www.briarpress.org">www.briarpress.org</a>? It's a great letterpress resource.</p>
