    html: |-
      <p>Good point about the mixed uc/lc sequences. Another issue is that space may need adjustment if next to all-caps words spaced/kerned for all-caps setting. This can get tricky especially if one wants to deal with one-letter-words, but it is doable.</p>
      <p>So far I <em>did</em> care for all-caps setting -- not by kerning but by adjusting caps' sidebearings contextually in all-caps context. However, re-thinking my production workflow right now, I wonder if this was too much work for an effect that obviously nobody would even notice: Looking around, I see all-caps logos and headlines, typeset in typefaces that obviously are not prepared for this, and lacking any manual intervention by the designer/typographer. Speaking of respected foundries and respected design agencies here. Since there are no outcries by otherwise over-critical fellows (on design forums and blogs) my conclusion is that there is no need for this level of quality.</p>
