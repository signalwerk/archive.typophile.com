  html: |-
    <p>I am a bit torn on this issue myself.</p>
    <p>On one hand I'd like my fonts to set beautifully (=kerned) no matter how the user choose to write text with it.<br>
    On the other hand the whole InterCaps debate is a touchy typographic subject, and it IS a bit of extra work (and results in quite a lot of extra kernpairs - even with class kerning).</p>
    <p>For some fonts I have kerned for InterCaps but for others not - taking into account what I imagine they will be used for ;)</p>
    <p>So I'm curious to know: what is your "modus operandi"? And your reasons for doing so?</p>
