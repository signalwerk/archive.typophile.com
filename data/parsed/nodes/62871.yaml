    html: <p>The most annoying part if you don't kern for InterCaps is when you write promotion text for your font IN your font - and use the words OpenType and TrueType. Those InterCaps Ts can look really horrible if they are not kerned... Wouldn't it then be a bit "dishonest" to manually kern those instances in your font promotion?</p>
