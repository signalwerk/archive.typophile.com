    <p>I'm doing research for an academic study on type piracy within the design community (designers who use pirated type), and was wondering if I could throw out a couple of questions: </p>
    <p>How has piracy altered the profession of type design in the last 10 years? </p>
    <p>What impact has type piracy had on releases?</p>
    <p>(If there are any threads or other resources relating to this topic elsewhere, please let me know. Thanks!)</p>
