      <p>Hey, I can be really honest about this: I ‘collect’ type. That means I have a lot of apparantly illegal software on my computer. BUT the fact is — I pay for the stuff I actually use. Same goes for programs. I'll try a demo (or if it's not available a cracked version) of a program and if I think it's ok, I'll pay up. Let me be clear: Software is the largest outlay my firm has, after the mortgage on our office and italian espresso coffee ; ).</p>
      <p>That may not be the ‘proper’ way of doing things — but then there's the other side of the equation: I buy all of the music I listen to (I have never ever downloaded a song without paying for it), I have never burned a “back up copy” of any of the 120+ DVD's and 250+ CD's own (and payed for), BUT I do have to pay a surcharge on all of the media (CD's and DVD's) I use to make backups of work files, because some government appointed foundation here (in the Netherlands) has to wherewithal to just do that — I mean imposing that surcharge. The next item on their agenda is hitting MP3 players with a special fine, so go figure.</p>
      <p>I have a PayPal account to pay for shareware, I support small foundries and software makers by paying for their stuff, even if I hardly use it, so I think I am on the right side of the track here.</p>
      <p>And then there's the whole discussion about the big foundries ripping of each other stuff (ATF anyone?) — that's been going on for a century and more, because a lot of countries never ratified the Berne Convention… As long as there's no universal vision re intellectual property, you won't be able to get a clear picture on this (but you WILL be able to buy a seventies design German car in China for a really LOW price).</p>
