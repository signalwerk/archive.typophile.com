      <p>Very interesting. As an issue this is certainly older than just the last decade. And it means that now people often design type just because they love doing it and they realise that it's very hard to control distribution of the end product once it's out there. I think widespread piracy may also distort the foundries' sales figures of the most commonly used fonts, because after all those are the ones that are being ripped/copied/borrowed/pirated the most.</p>
      <p>This is such a widespread phenomenon that clients frequently question why they would need to budget for font(s) as part of a design project.</p>
      <p>At the risk of sounding provocative in the present company, a recent academic conversation here in NZ suggested that investigating the whole of type development's history (Gutenberg onwards?) as an ongoing form of appropriation would be a worthwhile study. Looking at the family tree feature at myfonts might give an indication of what 'other foundries recuts/versions' does for releases, rather than sales.</p>
