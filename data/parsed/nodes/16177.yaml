      <p>Thanks everyone for the responses and suggestions. This is sort of a mass reply to all of the postings thus far: </p>
      <p>On some of the earlier promptings, I checked out more threads on typophile (and elsewhere), and found a good deal of the answers I was looking for. Thanks for the links and references (particularly the last one, Tiffany.)</p>
      <p>As for the ten years statement... it's true that digital type piracy has been around a bit longer, but I feel that trends in technology (p2p filesharing, faster connections, greater access to computers worldwide, etc.) have created a unique mode of piracy. But then again, it was a bit "shortsighted" on my part. Does anyone think that there's a benchmark for "the modern mode of type piracy"? The emergence of desktop publishing? The publishing of type 1 encoding? Desktop printers?</p>
      <p>Hrant, these two points are very interesting. </p>
      <p>2) I think the main cultural effect has been that more people spend more time making type simply because they love doing so, which speeds up evolution.<br>
      3) On the other hand, a certain high-end category of designer is now less likely to spend time making type (especially in the retail sphere).</p>
      <p>Do you think that this indicates a rise in non-retail typography (like custom designs for magazines and corporate usage?)</p>
      <p>Norbert, I'll let you know when I have some results. I've been interviewing design students, non-designers, and "professional" graphic designers and was surprised to find how many use "freeware" fonts as an alternative to both buying fonts and stealing them. </p>
      <p>I also created an <a href="http://youpop.com/survey.html" rel="nofollow">online survey</a> (anyone feel free to fill it out), but I'm not sure about people admitting to theft online. The ratio between how many faces people have on their CPUs vs how many they use is somewhat amusing (or apalling, depending on perspective). </p>
      <p>Thanks again!</p>
