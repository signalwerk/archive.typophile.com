      <p>I checked out your survey, John and it's very direct and straight forward. But I think that if you get rid of the word "Piracy" in the title, you may get a more honest set of responses.</p>
      <p>I don't sense that the majority of graphic designers using type truly understand what piracy of a type design is, nor do they relate a sense of "authorship" to designs and therefore <em>a font is a font is a font</em>.</p>
      <p>I think most users of computers do understand the protection/licensing aspect of "pricey" software, like Microsoft Office, Adobe Photoshop, Quark, InDesign, etc. and they also know of potential consequences for distributing bootleg copies. </p>
      <p>It is a very very common practice to search and download useful free-or-shareware, and in fact, the general software industry accepts and sometime even produce them. But the VALUE of the software is related to WHAT IT DOES and WHO DEVELOPED it, and to some degree, computer users attach a sense of "quality" to software produced by well known development companies (Intuit, Adobe, etc.).</p>
      <p>So when your novice or everyday walk-around young graphic designer downloads a copy of the <em>Jurassic Park</em> typeface from a free site, I'm sure they are not even aware of the existence of Neuland Inline, or if they did, they just believe the "free" face is just not at the same quality of the "pricey" font.</p>
      <p>To most designers <em>piracy</em> is the illegal use or replication of software, and if someone can find a nice looking or close match to a PAY font as a free download, to them it's NOT stealing.</p>
      <p>Therefore your use of "Piracy" in your survey title sets up another set of responses from your average computer user, whether they are graphic designers or not. If your survey's title was just "Font Usage" your respondents would be less guarded.</p>
      <p>A NEW FONT POLL<br>
      (I hate seeing the term font and typeface used interchangeably, but I guess it's already accepted.)</p>
      <p>I've developed a set of twenty questions that are presented in a tone that is particularly suited to the information I want to gather. Some of the questions are related to free vs. pay, some to purchasing habits, and others on awareness of new type designs. I don't plan to use them all at once in a single survey. At the moment I am planing to take smaller sets of questions and post them as polls on various designer sites. Some of my questions are very similar to yours, such as:</p>
      <dl>
      <dt>Do you know what a font EULA (End User License Agreement) is?</dt>
      <dd>__ no</dd>
      <dd>__ yes, but never read it</dd>
      <dd>__ yes, and ocassionally read it</dd>
      <dd>__ yes, and always read it</dd>
      <dd>__ yes, but don't care</dd>

      </dl>
      <p>I'll will from time to time post some in-progess results, that is if I even get any replies.</p>
