      <p>Interesting appointments you did Eben. But I disagree of the most of all. About the Spanish look and feel: no iron works! Maybe ceramics! :) Sometimes the lowercases look to me as a calligraphy piece, sometimes. Anyway, to me the tech inspiration is present in the typeface, but with a exotic appeal.<br>
      I really like the Dutch design work. In Brazil we have a great heritage of the European vanguards.<br>
      Anyway when I start the font my mind was clear but I have only one the statement: Please everything else except another boring pixel font. During the drawings I respect the grid for the most of characters but sometimes don’t (M for example). This kind of deliberated disobedience create most of the characters.</p>
