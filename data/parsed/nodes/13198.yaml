    html: |-
      <p>I wasn't sure why I said those things at the time - they felt right, but I didn't know why. Now I think I can explain.  </p>
      <p>About the 'Spanish'. </p>
      <p>- What I am thinking of here is : ironwork, there is a certain kind of ironwork I saw when I was in spanin in Granada &amp; Cordoba whose density &amp; shape have something in common with the letterforms</p>
      <p>-also, there is a kind on Spanish Caligraphy with Small &amp; large leters whose cross bars remind me of yours. Totally Different style &amp; yet there was a common feeling. Also, your font remineded me of the tilework I saw in Granada, Spain. None of this is provable - just my own resonance. </p>
      <p>- I think in part it is the way the decoration feels like an overlay that makes me associate this way. I guess I could be associating your font with western wood type because of the middle of the letter decoration but I don't...</p>
      <p>About the 'Dutch'. </p>
      <p>-There was alot of experimentation with geometric forms that dutch designers did which was not a retro 50's 60's 70's or 80's tech kind of thing but had to do simply with with geometry. Wim Crouwel comes to mind but there were lots of other earlier than him too. I don't think of your font as having the tech associations that other pixel type suggests - and that's why I think dutch.</p>
      <p>What do you think of these associations? What made you decide to make the font the way you did? You have some explaination text but is there more to say?</p>
