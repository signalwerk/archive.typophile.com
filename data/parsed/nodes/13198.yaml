    html: <p>I like it. It has a nice flavor for display, or very small texts. It is both pixely (obviously) but also - full of personality. The flavor of that personality is hard for me to describe. Part of that comes from the way the personality interferes with legibility. Actually, that's part of the flavor. A kind of willful disreagard for easy reading. The clash is part of what is interesting but it also obscures the flavor of what is below that for me. It makes you say, what is that? Like a curtain or a cloud in front of something. I guess what I mean is that to me it adds interest. Under that cloud is what? I am not sure. It is decorative &amp; old fashioned but I guess I don't know my type history enough to guess at it's source. It does feel a bit dutch or spanish to me.</p>
