      <p>Hi Eben,</p>
      <p>don't worry! I really like your comments. Since I started to show the fonts, 1 or 2 months ago, I received different opinions but the overall concern was positive. The readability and legibility is a recurrent topic but is really not my principal matter. The exploration of the formal aspect to me is more important in this case. I agree with the legibility crusaders in some points. The uppercases works much better than the lowercases. The more difficult to me was draw some diacritcs signals because of the complexity of some one. In the last days I´m working in another versions. One is the same drawing but is for print and the others are for “ultra-large” sizes. Take a look bellow.</p>
