      <p>2 previous discussions on the same topic, actually works by the same designer(s) Jorgen Grotdal of <a class="freelinking external" href="http://www.behance.net/LigatureCollective" rel="nofollow">Ligature Collective</a>: <a class="freelinking external" href="http://typophile.com/node/114526" rel="nofollow">The Chivalric Romance</a> and <a class="freelinking external" href="http://www.typophile.com/node/108180" rel="nofollow">The Ligature Collective</a></p>
      <p>EXPLORING AT WORK/GARDEN PARK &amp; CO: released yesterday by <a class="freelinking external" href="http://www.behance.net/JorgenGrotdal" rel="nofollow">Jorgen Grotdal</a> and <a class="freelinking external" href="http://www.studiojameslewis.com" rel="nofollow">James Lewis</a> of <a class="freelinking external" href="http://www.behance.net/LigatureCollective" rel="nofollow">Ligature Collective</a> under the name of <a class="freelinking external" href="http://www.behance.net/gallery/Quaint/15535095" rel="nofollow">Quaint</a></p>
      <p>ESTD/TOOLS &amp; OUTFIT/2014/TRD/MRK: Ltt <a class="freelinking external" href="http://www.myfonts.com/fonts/latinotype/trend" rel="nofollow">Trend</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/latinotype/trend-hand-made" rel="nofollow">Trend Hand Made</a></p>
      <p>Lumber: can't find a perfect match, possibly hand-drawn; closest I have is ‘CAC Lasko Even Weight Regular’ which came bundled with Create-a-Card software by American Greetings Company; some alternatives: <a class="freelinking external" href="http://www.dafont.com/thats-font-folks.font" rel="nofollow">That's Font Folks</a>, <a class="freelinking external" href="http://www.dafont.com/preludeflf.font" rel="nofollow">Prelude</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/paratype/propisi" rel="nofollow">Propisi</a>, <a class="freelinking external" href="http://www.dafont.com/einstein-grand.font" rel="nofollow">Einstein Grand</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/latinotype/showcase/script" rel="nofollow">Showcase Script</a>, <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/maccampus/inessa" rel="nofollow">Inessa</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/comicraft/spaghetti-western" rel="nofollow">Spaghettu Western</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/comicraft/matinee-idol" rel="nofollow">Matinee Idol</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/mawns/society-editor" rel="nofollow">Society Editor</a>, <a class="freelinking external" href="http://artandsignstudio.com/bogie.html" rel="nofollow">Bogie</a></p>
