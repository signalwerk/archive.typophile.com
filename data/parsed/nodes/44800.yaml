    <p>So I’m a young designer hired on by an IT staffing company to do there marketing and design in-house. I’m working in the corporate environment for the first time and am getting accustomed to meshing High Design and Corporate Ideals. I’m working on a logo for a website that is being launched and need some guidance. Here’s what we’ve come up with.</p>
    <p><a href="https://web.archive.org/web/20080706175202/http://i138.photobucket.com/albums/q275/sthartl/erplogo.jpg" title="http://i138.photobucket.com/albums/q275/sthartl/erplogo.jpg">http://i138.photobucket.com/albums/q275/sthartl/erplogo.jpg</a></p>
    <p>Here are my challenges:<br>
    The colors are set<br>
    The hexagon shape is required<br>
    The web address (with the hyphen) was to easily discernable, i.e. there has to be continuity throughout ’erp-consulting’<br>
    Needs to maintain high-end corporate look<br>
    The general council is comprised of non-creative so anything over stylized doesn’t fly.</p>
    <p>In general what’s a good way to manage lots of type in a logo?<br>
    Any advice on doing creative work in non-creative environments? How do I stay inspired and how so I integrate design into the corporate mindset</p>
