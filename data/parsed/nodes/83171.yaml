    <p>First post for me here, and I would like help to identify the two fonts attached.<br>
    The first attached file is from my high school, and I knew it once before but I can't seem to recall it. It is most noticably displayed on the R with the split leg and segments</p>
    <p>The second font is really generic and seemingly just italic, but rather then just get close to a font that matches, if someone could notice something I didn't, it would be much appreciated.</p>
    <p>Thank you again</p>
