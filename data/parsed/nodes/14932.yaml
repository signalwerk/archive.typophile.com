      <p>I don't think this is a digital font for a computer. I think this is a built-in typeface for a receipt printer. The closest digital font I can think of is FF SubVario or SubMono (see <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startrow=1&amp;records=&amp;currpage=1&amp;totalrecords=30&amp;displayfontid=FF.11053.0.0&amp;fontRendererText=QJ*6123+MN9+p%2FP" title="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startrow=1&amp;records=&amp;currpage=1&amp;totalrecords=30&amp;displayfontid=FF.11053.0.0&amp;fontRendererText=QJ*6123+MN9+p%2FP">http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startro...</a>)</p>
      <p>- Mike Yanega</p>
