    <p>Hi all!<br>
    I have a very hard time finding wich font this is.<br>
    I've scanned it from an old receipt, and the letters u can se is: QJ*6123 MN 6,9 p/P</p>
    <p>I've "restored" the QJ*6 letters in photoshop, all the letters should look like that but the others is due to bad scanner/receipt...</p>
    <p>What i've found is that it almost looks like some kind of Gothic font.. but none of them is like the letter J.. Please help me!</p>
