    html: |-
      <p>The discretionary ligatures are an OpenType feature that require support by the application. Graphics programs like the ones you mention may not have that support.<br>
      One possibility for accessing these features/glyphs in such a graphics program would be to type the text and trigger the features in another program that does support OpenType more fully, then cut the text from there and paste it into the graphics program. (For example, cutting from Illustrator and pasting into Photoshop.)</p>
