  html: |-
    <p>I just downloaded a font that supports ligatures (<a href="http://new.myfonts.com/fonts/characters/insider/" title="http://new.myfonts.com/fonts/characters/insider/">http://new.myfonts.com/fonts/characters/insider/</a>) but much to my chagrin, when I type with the font, the ligatures don't show up.</p>
    <p>Do I need to use a special program? I have tried scrolling through charmap (Windows 7) in the font to see if there are special ligature characters, but it doesn't seem so. </p>
    <p>I am using an old version of Paint Shop Pro, but I tried it in Photoshop as well and no ligatures. :( I feel like I'm missing something obvious, what is it?</p>
