    date: 2004-05-21T08:56:00
    date_raw: 21.May.2004 8.56am
    votes: null
    html: <p>First, you should try to avoid having the fonts installed in two different places. It just causes confusion (for apps as well as people trying to figure out your problem). <br> <br>Second, would I be correct in thinking that those are the only styles that show in other applications as well? <br> <br>My guess is that you are running Windows 2000 or XP. To get full MM support on those OSes, you have to install ATM. Unless you want to pay for ATM Deluxe, install ATM Light 4.1, and the patch to 4.1.2. <br> <br>Alternatively, if you don't want to access the MM instances in apps other than Adobe's InDesign/Illustrator/Photoshop, just remove the fonts from the system fonts folder. Then the ones in the private Adobe location will get used, and you don't need the system level support. <br> <br>Regards, <br> <br>T</p>
    html_clean: <p>First, you should try to avoid having the fonts installed in two different places. It just causes confusion (for apps as well as people trying to figure out your problem). <br> <br>Second, would I be correct in thinking that those are the only styles that show in other applications as well? <br> <br>My guess is that you are running Windows 2000 or XP. To get full MM support on those OSes, you have to install ATM. Unless you want to pay for ATM Deluxe, install ATM Light 4.1, and the patch to 4.1.2. <br> <br>Alternatively, if you don't want to access the MM instances in apps other than Adobe's InDesign/Illustrator/Photoshop, just remove the fonts from the system fonts folder. Then the ones in the private Adobe location will get used, and you don't need the system level support. <br> <br>Regards, <br> <br>T</p>
