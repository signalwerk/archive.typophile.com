    html: "<p>It is possible to create the \"size\" OpenType Layout feature in FontLab. Please refer to:  <br><a href=\"http://partners.adobe.com/asn/tech/type/opentype/appendices/features_pt.jsp#size\" target=\"_blank\">http://partners.adobe.com/asn/tech/type/opentype/appendices/features_pt.jsp#size</a> <br><a href=\"http://partners.adobe.com/asn/tech/type/otfdk/techdocs/OTFeatureFileSyntax.jsp#8.b\" target=\"_blank\">http://partners.adobe.com/asn/tech/type/otfdk/techdocs/OTFeatureFileSyntax.jsp#8.b</a> <br>The second document describes the syntax that you should use in FontLab's OpenType panel.  <br> <br>Regards,  <br>Adam</p>"
    html_clean: "<p>It is possible to create the \"size\" OpenType Layout feature in FontLab. Please refer to:  <br><a href=\"http://partners.adobe.com/asn/tech/type/opentype/appendices/features_pt.jsp#size\" target=\"_blank\" class=\"link-external\">http://partners.adobe.com/asn/tech/type/opentype/appendices/features_pt.jsp#size</a> <br><a href=\"http://partners.adobe.com/asn/tech/type/otfdk/techdocs/OTFeatureFileSyntax.jsp#8.b\" target=\"_blank\" class=\"link-external\">http://partners.adobe.com/asn/tech/type/otfdk/techdocs/OTFeatureFileSyntax.jsp#8.b</a> <br>The second document describes the syntax that you should use in FontLab's OpenType panel.  <br> <br>Regards,  <br>Adam</p>"
