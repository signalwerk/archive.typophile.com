    html: <p>1) Hard to say. Perhaps it will get removed when or after Adobe completely drops support for multiple master fonts. No date has yet been announced for this. <br> <br>2) MM axes have short names ("Op") and long names "Optical Size"). Presumably InDesign is keying off one of these. Axes do not have any other kind of encoding AFAIK. <br> <br>Regards, <br> <br>T</p>
