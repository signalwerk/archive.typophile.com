    html: <p>David,  <br> <br>For Type 1 and OpenType PS fonts, I'd recommend decomposing composites. For OpenType TT/TrueType fonts, you can leave the composites in. For overlapping outlines, it's not only "technically not good".  <br> <br>If a user applies some stroked contour to the letters or converts them into outlines, the overlap may become visible. Also, some laser printers and imagesetters don't deal with overlapping outlines very well. So I recommend always decomposing glyphs such as ccedilla or eogonek, and removing the overlaps.  <br> <br>Also, ogonek rarely works well from the design point of view if used as one and the same shape in all the glyphs. The connection of ogonek with e and U should be usually designed differently than the connection of ogonek with the other glyphs. See <a href="http://193.174.120.13/twardoch/f/en/typo/ogonek/ogonek.html" target="_blank">http://193.174.120.13/twardoch/f/en/typo/ogonek/ogonek.html</a> <br> <br>Regards,  <br>Adam Twardoch <br>Fontlab Ltd.</p>
    html_clean: <p>David,  <br> <br>For Type 1 and OpenType PS fonts, I'd recommend decomposing composites. For OpenType TT/TrueType fonts, you can leave the composites in. For overlapping outlines, it's not only "technically not good".  <br> <br>If a user applies some stroked contour to the letters or converts them into outlines, the overlap may become visible. Also, some laser printers and imagesetters don't deal with overlapping outlines very well. So I recommend always decomposing glyphs such as ccedilla or eogonek, and removing the overlaps.  <br> <br>Also, ogonek rarely works well from the design point of view if used as one and the same shape in all the glyphs. The connection of ogonek with e and U should be usually designed differently than the connection of ogonek with the other glyphs. See <a href="http://193.174.120.13/twardoch/f/en/typo/ogonek/ogonek.html" target="_blank" class="link-external">http://193.174.120.13/twardoch/f/en/typo/ogonek/ogonek.html</a> <br> <br>Regards,  <br>Adam Twardoch <br>Fontlab Ltd.</p>
