    html: <p>Adam, <br> <br>Every version of Word that I have used under Windows (up through XP; I have not yet tried 2003) shows only 256 characters in the Insert/Symbol dialog (ending with y-dieresis, the last character found in an old-style [non-Unicode] Windows font) when a Type 1 font is being used.  I just did a quick test with Adobe Garamond Pro under Word XP, and this continues to be true.  I then tried typing some Unicode values followed by Alt-x, using characters that I knew existed in Garamond Pro.  Word first displayed a blank box and tried to change the font back to Times New Roman.  After manually resetting the font to Garamond and redoing the Alt-x I was able to get the characters to display.  So I should amend my statement to "doesn't handle well at all" rather than "doesn't handle."  My recollection, which I now have no way of testing, is that earlier versions wouldn't take characters beyond y-diresis at all in a T1 font.  Of course Garamond Pro is an OT font which may have something to do with it.  But Insert/Symbol still needs to learn some new tricks, at the very least. <br> <br>David</p>
