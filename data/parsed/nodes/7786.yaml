    html: <p>I'll second what Adam has said about keeping composites for TrueType fonts, but decomposing for PS fonts. Note, however, that OpenType PS fonts can be generated using subroutinisation, which will automatically make the CFF table as efficient as possible, effectively replacing the composite format. This is an option in FontLab, which I believe is on by default.</p>
