    html: <p>Thanks, gentlemen. <br> <br>I distribute my font only as TT (now TT flavored OT), because Word can't handle T1 fonts with more than 256 glyphs.  This probably explains why I've never heard of problems with the composites.  I will decompose the cedilla and ogonek composites, though.  And someday when I have stopped adding even more obscure characters I will go back and improve the design of the ogoneks. <br> <br>David</p>
