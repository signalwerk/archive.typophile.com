    html: <p>David,  <br> <br>what you describe is a bug in Word 2000 and XP. This was fixed in Word 2003, which is also otherwise much better than the previous versions. Not that I wouldn't agree that if you're making a font intended primarily for multilingual use, then the OpenType TT format is your best choice.  <br> <br>Regards,  <br>Adam</p>
