  html: <p>I have a very large multilingual font (file size ~1 meg.) that contains a great many composites.  I had always understood that using composites made for a smaller and possibly more efficient font.  I recently read in Leslie Carbaga's book on FontLab that "some font formats" don't deal well with composites.  He recommends making all composites into separate characters with their own outlines as the last stage in font production.  I have seen many quality fonts that make extensive use of composites for accented characters, and I have never had a problem with any of them or with my own font.  What is the best practice here? <br> <br>On the same topic, I have a few composites with outlines that overlap slightly (cedilla and ogonek mainly).  I know that overlapping outlines are technically not good, but the Font Validator help file says that newer versions of the TT rasterizer handle such overlaps OK.  So again, what's the tradeoff here?  Keep the overlaps or make a bunch of separate and possibly unecessary characters? <br> <br>Thanks - David</p>
