    html: <p>The only logical model moving forward would be some sort of iTunes for fonts whereby licensing would be enforcible by the application. <br> <br>Currently, only Extensis Suitcase Server for X does a similar function. <br> <br>The problem for indepentent font makers is just we don't have the resources to sell an instantly downloadable font that can be serialized at the time of purchase and instantly dowloaded - Let alone serialized. <br> <br>Stuart :D</p>
