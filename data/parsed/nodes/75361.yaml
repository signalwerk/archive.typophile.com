    <p>Donald and Liza from Typeradio took the opportunity at the ED-Awards celebrations 2010 in Rotterdam to interview Veronika about her work. She attended the awards ceremony, because TypeTogether received a Gold Medal for Adelle. The interview starts questioning Veronika about religion and then continues to ask how she got to type design, her favourite letter and more. </p>
