    html: <p>Hrant, I agree with you completely. <br> <br>My point was that much of Andreas' work is so obviously aimed at titling and not paragraph useage, there is no need to justify why we like his work with comments like "these types will probably only be used in flyers, poster, CD covers, etc. Therefor they are OK". <br> <br>I do not want to lock horns with you on the deeper effects of typography upon the reader, as you have given this subject much more thought than I. <br> <br>However, I for one, am up for the challenge of a few new takes on familiar letterforms for the sake of emotional representation of the word itself.</p>
