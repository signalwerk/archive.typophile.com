    <p>Hi All. <br>I've been working on and off with a collection of typefaces for my conceptual foundry Brainreactor/GyoDea. The collection starts to take shape, and I would be glad of any comments regarding my work.  <br> <br>The collection contains both display/experimental and some sans serifs for Display/Logo purposes. <br> <br>I appologize for the pdf layout in this preview, I work on a book where all the fonts will be displayed in a proper way. <br> <br>All typefaces have full alphabets with upper- and lowercase letters, numbers and so on. However,  I think it's a bit early to show them all in here. I have 24 other full alphabets going on on top of the ones I show here. I will upload a new pdf within two weeks, with more and harder experimental Typefaces. <br> <br>Any comments? <br> <br>Andreas Lindholm</p><center><br>
