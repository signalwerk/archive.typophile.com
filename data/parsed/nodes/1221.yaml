    html: <p>Hey, I will continue with my experiments... Or call it self-expressive needs if you want. I think Hrant is right about the theory about readability versus experimentation, but if everyone was experimenting with readability I think the typographic scene should look very boring after a while...? <br> <br>Think about this; If I tell my wife that I Love her, I should probably use a quiet language typed with my mouth using some classic typography. If I want to scream to the world that I have something to sell, say or maybe proclaim... I think a language that gains interest visually is better...!? <br> <br>Andreas <br> <br>&gt;Ren</p>
