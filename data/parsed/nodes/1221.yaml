    date: 2003-11-16T11:41:00
    date_raw: 16 Nov 2003 — 11:41am
    votes: null
    html: "<p>Andreas, I'm a huge admirer of your work. Let me say right now that I'm no type guru. But I am a lover of words. In fact, my love of type comes directly from my love for words and the act of expression through writing. <br> <br>For this simple reason, I have no problems at all with the readability of individual characters, or even the readability of a word, so long as its aesthetic expression is dramatic and intelligent. It may take a moment of adjustment to pick up the letterforms, but it is the artfullness of the type that demands I invest my attention in the word it represents. <br> <br>What I mean to say is, there are more uses for type than just stringing together complete sentences or paragraphs. I do not see any need to compare your work to more mainstream samples or useage. <br> <br>There is a definate place for your type: right on the cutting edge. <br> <br>Wherever there are words written in the throws of anxiety, anger, excitement, suprise, nearly any condition of extremety, your letterforms shine appropriate.</p>"
