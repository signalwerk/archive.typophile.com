    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Michael Abbink</strong></p>
    <p>Mr. Abbink left Wolff Olins (NYC) in June 2006 after 3 years and is now trying his hand at freelance and developing his own design  practice. He was co-founder and creative director of Method, a design firm based in San Francisco doing graphic design, and web &amp; interface design. He formerly worked at Meta Design and Apple Computer, and is the designer of <a href="/wiki/FF%20Kievit" class="freelinking" rel="nofollow">FF Kievit</a> and <a href="/wiki/FF%20Milo" class="freelinking" rel="nofollow">FF Milo</a> typeface families.</p>
    <p><strong>FontShop Bio</strong><br>
    Mike Abbink earned two BFAs: one in Fine Arts, and one in Graphic Design and Packaging from Art Center in Pasadena. He has been designing letter forms since 1992, and his first completed typeface, FF Kievit, is used around the world and has won awards from the ISTD and <a href="/wiki/ATypI" class="freelinking" rel="nofollow">ATypI</a>. In 2000 Mike designed FF Milo which became part of the FontFont Library in 2006.</p>
