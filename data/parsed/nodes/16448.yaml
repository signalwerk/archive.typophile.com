    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Michael&nbsp;Abbink</strong></p>
    <p>Mr. Abbink left Wolff Olins (<span class="caps">NYC</span>) in June 2006 after 3 years and is now trying his hand at freelance and developing his own design  practice. He was co-founder and creative director of Method, a design firm based in San Francisco doing graphic design, and web <span class="amp">&amp;</span> interface design. He formerly worked at Meta Design and Apple Computer, and is the designer of <a href="/node/30954" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">FF</span> Kievit</a> and <a href="/node/add/wiki?edit%5Btitle%5D=FF%20Milo" title="Create node &quot;FF Milo&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">FF</span> Milo</a> typeface&nbsp;families.</p>
    <p><strong>FontShop Bio</strong><br>
    Mike Abbink earned two <span class="caps">BFA</span>s: one in Fine Arts, and one in Graphic Design and Packaging from Art Center in Pasadena. He has been designing letter forms since 1992, and his first completed typeface, <span class="caps">FF</span> Kievit, is used around the world and has won awards from the <span class="caps">ISTD</span> and <a href="/node/13403" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">AT</span>ypI</a>. In 2000 Mike designed <span class="caps">FF</span> Milo which became part of the FontFont Library in&nbsp;2006.</p>
    <p><strong>External Links</strong><br><a href="http://www.method.com">Method</a><br><a href="http://www.metadesign.com">Meta Design</a><br><a href="http://www.fontshop.com/fonts/designer/michael_abbink/">Michael Abbink fonts</a> at FontShop<br><a href="http://www.fontfont.com/designers/michael-abbink">Michael Abbink fonts</a> at&nbsp;FontFont</p>
