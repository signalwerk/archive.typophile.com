    html: |-
      <p>MyFonts currently lists over 1370 families with CE support. </p>
      <p>To look for Central European fonts on MyFonts, go to:<br>
      <a href="http://www.font.org/mf/International#ce" rel="nofollow">http://www.myfonts.com/International#ce</a></p>
      <p>There, click on "Central Europe" and then on "Search for fonts containing Central Europe characters". </p>
      <p>To fine-tune the search go to<br>
      <a href="http://www.font.org/mf/search" rel="nofollow">http://www.myfonts.com/search</a></p>
      <p>There, click on "Fonts" and choose "Central Europe" as character set. Optionally, you can filter the results by entering some keyword (e.g. "sans") or selecting a particular foundry (e.g. URW++, ParaType, Elsner+Flake, Storm, Linotype, Ascender, DSType, Flat-it, P22, to name a few that have larger offerings of CE fonts). </p>
      <p>Regards,<br>
      Adam</p>
