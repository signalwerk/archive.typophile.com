      <p><strong>Update:</strong> MyFonts has just updated their entire Linotype offering, including <a href="http://www.myfonts.com/search?advanced=1&amp;params%5Bsearchtype%5D=fonts&amp;search%5Btext%5D=&amp;params%5Bboolean%5D=and&amp;params%5Bnameordesc%5D=desc&amp;search%5Bminprice%5D=%240.00&amp;search%5Bmaxprice%5D=%241%2C000.00&amp;search%5Bcblockop%5D=%26&amp;search%5Bcblocks%5D%5B%5D=ce&amp;search%5Bfoundry%5D=29&amp;refby=fontorg" rel="nofollow">over 450 Linotype families with Central European characters</a> (100 new families and 350 families in which the CE support was added). This gives the total of almost <strong>1,800</strong> families that support CE on MyFonts. It’s a great day for European customers!</p>
      <p>Adam</p>
