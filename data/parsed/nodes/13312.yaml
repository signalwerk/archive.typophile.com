      <p><em>I think that all of the big foundries have put everything on OpenType by now.</em></p>
      <p>I contacted Font Bureau about a year ago to ask if they offered their libarary in OT format. They said that their clientelle hasn’t really been demanding it, so they don’t offer OT fonts. The did say they would develop OT fonts if I were interested. I think there are several foundries that have yet to offer anything in OpenType.</p>
