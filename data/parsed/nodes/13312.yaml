    html: |-
      <p>Terry, I work in a Mac, and generate all of my work files as Mac PS. But I will soon be generating OpenType files, as that is the only way to test OpenType features ;-)</p>
      <p>I’ll be generating OT CFF, since I’m drawing with PostScript outlines.</p>
      <p>I think that all of the big foundries have put everything on OpenType by now. You gotta wonder about some of the smaller ones who haven’t…<br>
      __<br>
      <a href="http://www.typeoff.de">www.typeoff.de</a></p>
