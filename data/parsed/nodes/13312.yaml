    date_raw: null
    votes: null
    html: <p>Now that Apple and Quark are finally getting on the Opentype bandwagon, I think that demand will increase dramatically, especially in shops that handle a lot of cross-platform work. And I suppose that I need to get on the bandwagon as well. I just wish that (a) the technical info offered by Adobe and Microsoft weren’t written in such a high level of geekspeak; or (b) that someone would write a manual/treatise that made the format a little more accessible; or (c) that I had the time to attend an in-depth seminar (the one at the aTYPI convention in Helsinki looks very promising, but no way am I going to be able to make that one). Anyone have any suggestions on option (b)?</p>
