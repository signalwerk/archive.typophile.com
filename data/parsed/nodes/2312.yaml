  html: <p> Please can anyone help settle a simple disgreement. Can two different fonts be used in the same Corporate identity. And <br> <br>Is this written down anywhere? ie it is okay or it is not okay. <br> <br>A quick answer will make my life instantly bearable <br> <br>cheers </p>
