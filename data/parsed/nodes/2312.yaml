    date: 2002-08-19T09:06:00
    votes: null
    html: <p> I dont think it is necessarily a question of "different" so much as being "compatible" or "appropriate". So long as the combination is thoroughly thought through in terms of the messages it gives out, its range, readability, the typographic structure you intend to use and, of course, its historical contexts, it should not matter. </p>
  - id: 18517
    user_id: 1019
    user_name: tsprowl
    user_path: null
    date_raw: 22 Aug 2002 — 4:31pm
    date: 2002-08-22T16:31:00
    votes: null
    html: <p> it would be a branding nightmare if we only used one. think of what would be the difference between a title, sub-head and body text...bolds? another bold a heavy? and an underline? - it would look like a high school essay produced in word doc. <br> <br>a designer's mark should be in matching pairs of type for collateral and corp systems. </p>
