    html: <p> Thanks for all your input. I am forwarding comments and a couple of quotes I pulled from 'The Complete Typographer' (a book a found from my college days). To the big wigs who (unfortunately) as usual make the choices on final design. Amazing considering all the skills they possess in relation to design </p>
  - id: 139625
    user: 1160
    date: 2002-08-19T06:27:00
    date_raw: 19 Aug 2002 — 6:27am
    votes: null
    html: <p> I assume you mean 'corporate identity' as a  <br>system and not just a 'mark.' In which case I'd <br>also say yes. It's a good idea unless you're  <br>using Helvetica and Impact because you can't get  <br>the right set of weights. (Just one lame example.) <br> <br>But, in general, it seems to make little sense to make  <br>rules about this stuff, when it's totally dependent on how  <br>you're using it and what it's for. </p>
