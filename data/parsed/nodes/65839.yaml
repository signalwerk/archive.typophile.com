    <p>Everyone-<br>
    This may be slightly off-subject, but please bare with me. I am about to build a website for a gentleman who wants his customers to be able to download his product, (an application for surveyors), after successfully submitting their credit card information. I am using this forum because I know that people who sell fonts online use the same process. I would like to know if there is a third-party complete solution to this process... a service that perhaps process orders and than somehow provides a secure link to the server allowing the customer to download, or alternatively a password that allows access to the folder on the server. Or anything else for that matter????!!!???<br>
    Thanks One and All!<br>
    DK~</p>
