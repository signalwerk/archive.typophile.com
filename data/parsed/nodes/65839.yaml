      <p>It's not just a matter of just googling for ecommerce solutions. The trick is finding a solution which is suitable for selling fonts. It would have to allow for free font updates, and automatic notification of updates.<br>
      There were a couple of good 3rd party, font suitable software selling systems before the dot bomb but since then I've never been able to find any that were as good. They all seem like a big step backward.</p>
