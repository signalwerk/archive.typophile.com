      <p>LOL, I see a prison tower, too. It's probably not the image a politician wants to project!?</p>
      <p>It's very conservative and flat; almost clip-arty. It reminds me of an old-school library logo for some reason. If it's a new political party, I think it needs to be fresh and modern, not old-school. Right now it has no quality of breaking free of the current political parties. Isn't breaking free with new ideas the whole point of a new party? The logo should reflect that, IMO. Unfortunately, a lighthouse is about as cliche as you can get.</p>
