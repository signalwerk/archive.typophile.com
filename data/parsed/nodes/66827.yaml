    <p>I'm working on a logo for a new political party. </p>
    <p>The idea is a lighthouse, thematically shedding light on corruption and graft; acting as a navigation point in these stormy times; and, geographically correct for the Ocean State.</p>
    <p>Functionally, the logo must be simple. It will be printed in all sizes (to an absurd degree, billboards to ballots) on all grades of paper and both in color and monochrome.</p>
    <p>I chose Whitman as the font and then constructed the light house out of pieces of the font. I think it's close to working.</p>
    <p>The big issue for me is that they really want the light/beacon to be seen, which is tricky when working in monochrome. Working in two or more color is far easier.</p>
    <p>Thoughts?  Suggestions? criticisms?</p>
