  html: <p>I don't meant to spam, but I think this is of legitimate interest to Typophiles. <a href="http://www.oakknoll.com/results.php?s_CriteriaAlias=SALEBOOKCRITERIA&amp;s_PresetName=SALE%20BOOKS" rel="nofollow">Oak Knoll is selling many Oak Knoll press titles at 50% off right now.</a> The sale includes books about Tschichold, Goudy, early specimens at Plantin-Moretus, and brings the price of Oak Knoll's reprint of Updike’s <em>Printing Types</em> to $25.00. It's a good chance to fill out a library without paying high prices for what is often not the best printing.</p>
