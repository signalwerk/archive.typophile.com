    <p>Hi!<br>
    Best wishes from Brooklyn; we can see Wall Street from here, and it's a mess!</p>
    <p>We have two new releases - actually, one update and one new release. And we'd like to get a little political.</p>
    <p>/ / / / / </p>
    <p>New release: Galaxie Polaris V3 + Galaxie Polaris Condensed</p>
    <p>Finally, our popular Polaris family has three things people have been asking for: small caps, Cyrillics, and a condensed complement.</p>
    <p>Version 3 of Galaxie Polaris features some small but important improvements and adds small caps (with its own specific punctuation) and Cyrillic script support. </p>
    <p>Galaxie Polaris Condensed was started in 2005, used for a conference identity program in 2007, and completed in 2008 for use by the Alliance for Climate Protection. (We also created a special version of Galaxie Polaris Bold for the Alliance, which can be seen in the group's WeCanSolveIt advertising.)</p>
    <p>We are offering a special upgrade price for existing licensees: Galaxie Polaris V3 plus Condensed for US$149.</p>
    <p><a href="http://vllg.com/Village/GalaxiePolaris/mudTyper+Weights/" title="http://vllg.com/Village/GalaxiePolaris/mudTyper+Weights/">http://vllg.com/Village/GalaxiePolaris/mudTyper+Weights/</a><br>
    +<br>
    <a href="http://vllg.com/Village/GalaxiePolarisCondensed/mudTyper+Weights/" title="http://vllg.com/Village/GalaxiePolarisCondensed/mudTyper+Weights/">http://vllg.com/Village/GalaxiePolarisCondensed/mudTyper+Weights/</a></p>
    <p>/ / / / / </p>
    <p>Obama buttons</p>
    <p>With 5 weeks until Election Day here in the US, it is imperative that all eligible voters register to vote. And - sorry Republicans - vote for Barack Obama. He is a dream come true: a thoughtful, intelligent, energetic leader; a constitutional law expert who will do what's best for his country, not his cronies. </p>
    <p>We have designed and produced a set of Obama Heart buttons. We love hearts and we love Obama. The buttons are US$10 within the US, and we are shipping sets out daily for quick delivery.</p>
    <p><a href="http://vllg.com/products/Village/Obamabuttons/" title="http://vllg.com/products/Village/Obamabuttons/">http://vllg.com/products/Village/Obamabuttons/</a></p>
    <p>/ / / / /</p>
    <p>Thanks again.</p>
    <p>Chester &amp; Tracy Jenkins<br>
    Village<br>
    206 Front Street #4A<br>
    Brooklyn, NY 11201</p>
