    <p>Hey experts ...</p>
    <p>I'm gonna make a stencil type-face as a brand for a museum - and was wondering if there are any unwritten rules when you make a stencil typeface?</p>
    <p>Must and don'ts !?!?</p>
    <p>thx</p>
