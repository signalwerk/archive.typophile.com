  html: <p>"I don't love type. Type is dull." -- Dennis Ortiz-Lopez. <br> <br><a href="http://www.ortiz-lopez.com" target="_top">http://www.ortiz-lopez.com</a> <br> <br>I'd never been to this site before today. What a treat. Dennis Ortiz-Lopez has done it all and if you don't believe, check it out. Ortiz-Lopez estimates he has created 600 typefaces in his career, most of them built on a grid in Fontographer. <br> <br>some of his type is at <br><a href="http://ortiz-lopez.com/OLFOLPOLH.html" target="_top">http://ortiz-lopez.com/OLFOLPOLH.html</a></p>
