    html: <p>I've had the pleasure of working with Dennis on custom type commissions during my ad agency days, and then during my tenure at Phil's Fonts, a distributor of his retail fonts. Dennis *is* a complete freak, but a wonderful, trippy guy with a great and twisted sense of humor... talk to him on the phone for 5 minutes, and you'll be in another world. His type treatments and logotypes for pubs are inspiring, and works of art in themselves; his layered typefaces are really fun to play with. <br> <br>My only complaint about Dennis' work is his aversion to creating characters other than the basic alphanumerics for fonts that are to be sold commercially... I don't know if he's gotten past that, but it used to drive me nuts...</p>
