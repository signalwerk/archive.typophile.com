    html: <p> &gt; his aversion to creating characters other than the basic alphanumerics <br> <br>That's very strange, considering he's made Hebrew fonts. <br> <br>hhp </p>
  - id: 24470
    user_id: 107
    user_name: tamye
    user_path: null
    user_image: /files/pictures/picture-107.png
    date_raw: 9 Sep 2002 — 2:50pm
    date: 2002-09-09T14:50:00
    votes: null
    html: <p> Aversion probably isn't the right word - I don't know if it's conscious or not, or simply the result of being too busy, or getting distracted by another project, etc. Anyone who's done 600 well-drawn typefaces is probably going to take shortcuts to remain so prolific. I know nothing about the character sets in Dennis' Hebrew types - I only have experience with his Latin designs and revivals. <br> <br>Commercial types in particular should have a full character set with basic punctuation, currency, etc., whether Latin or non-Latin. This is merely my humble opinion as a typographer, a graphic designer, and as someone who works with type designers in getting fonts prepped for market. It's a bummer to find the perfect typeface for a project, only to discover that it's missing the question mark or "curly quotes." </p>
