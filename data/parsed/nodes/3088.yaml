    html: "<p> &gt; \"I don't love type. Type is dull.\" <br> <br>There is something to that. But only if: <br>1. You're not interested in aesthetics, and <br>2. You're not interested in functionality. <br>Maybe he'd be happier as an accountant? <br> <br>Sure, simply making fonts for the market, without an appreciation for Shape and/or without an understanding of reading is indeed very boring - it's like being a grocery bag boy (and many of those fonts would indeed look smashing on grocery bags). I personally try to express the power of shapes, but am also very grateful for my innate curiosity of how things work deep down. <br> <br>hhp </p>"
