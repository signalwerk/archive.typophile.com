  html: <p> Hi All, <br> <br>Got a strange request from a lady who would like a font converted from Open Type to True Type. Now clearly I'll send her back to the publisher of the original font, but for my information I don't think anybody has ever brought up that topic. <br> <br>So how does one reverse engineer an OT font back to a PS1 or TT font? <br> <br>Stuart :D </p>
  html_clean: <p> Hi All, <br> <br>Got a strange request from a lady who would like a font converted from Open Type to True Type. Now clearly I'll send her back to the publisher of the original font, but for my information I don't think anybody has ever brought up that topic. <br> <br>So how does one reverse engineer an OT font back to a PS1 or TT font? <br> <br>Stuart :D </p>
