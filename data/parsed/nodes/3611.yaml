    html: <p>Open the OT font in FontLab 4.x, choose the encoding mode (names mode, codepages mode, which codepage if applicable) and generate the font in the applicable format. If you're generating a TTF, trash all the OT features first. <br> <br>For Truetype, I usually keep it in Unicode mode unless they're using a very old version of Windows. For Type 1 PC, set it to MS Windows 1252 Latin 1 <b>in codepage mode</b>. (Or whatever codepage your customer is using.) For Type 1 Mac, set it to Macintosh Roman encoding <b>in Names mode</b>. <br> <br><b>Don't choose Adobe Standard Encoding.</b> This causes ugly Symbol substitution. <br> <br>You will need TransType if you are generating Mac suitcase files.</p>
    html_clean: <p>Open the OT font in FontLab 4.x, choose the encoding mode (names mode, codepages mode, which codepage if applicable) and generate the font in the applicable format. If you're generating a TTF, trash all the OT features first. <br> <br>For Truetype, I usually keep it in Unicode mode unless they're using a very old version of Windows. For Type 1 PC, set it to MS Windows 1252 Latin 1 <b>in codepage mode</b>. (Or whatever codepage your customer is using.) For Type 1 Mac, set it to Macintosh Roman encoding <b>in Names mode</b>. <br> <br><b>Don't choose Adobe Standard Encoding.</b> This causes ugly Symbol substitution. <br> <br>You will need TransType if you are generating Mac suitcase files.</p>
