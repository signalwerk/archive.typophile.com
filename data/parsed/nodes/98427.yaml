  html: |-
    <p>At TypeCon New Orleans Joseph Erb and Roy Boney of the Cherokee Nation took the stage to talk about the Cherokee writing system. They took the opportunity to urge type designers to produce more fonts supporting their language, making the case that Cherokee school children doing projects had numerous English fonts but just a handful of Cherokee designs. </p>
    <p>Apart from Mark Jamra's Cherokee font design shown during TypeCon Milwaukee did any other type designers take up the call?</p>
    <p>Cheers, Si</p>
