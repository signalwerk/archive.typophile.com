    html: <p>It has been my experience with simply setting a few books that had Cherokee, political considerations (historical accuracy, Sequoyah's intent, that sort of  political consideration) played the largest role in font selection. If you want to tackle designing Cherokee glyphs, be advised, &amp; perhaps get official input along the way.</p>
