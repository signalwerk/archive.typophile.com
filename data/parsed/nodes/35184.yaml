      <p>"Roman" inscriptional capitals in their original context, carved into architraves, walls and tympanae of buildings erected by the ancient Romans during classical antiquity, were explicity architectural in their construction.</p>
      <p>The relationship to classical architecture goes beyond setting. The basic elements of circle, square, half-square, triangle and post (stem) making up roman inscriptional capitals occur as similar elements in Roman classical architecture, inhereted from the Greeks and elaborated upon by the Romans. Numerous theories have surfaced on the origin of serifs; regardless of their true origin(s), the resemblance of bracketed and wedge-shaped serifs on inscriptional capitals to the wedge-profile of the echinus element of doric columns probably helped secure their position in the grammar of classical lettering style.</p>
      <p>Goudy's Trajan typeface and the Trajan Inscription in Rome are the best-known examples, but there are of course many others.</p>
      <p>The later dual case "roman" typefaces of Francesco Griffo and Nicolas Jenson emulated the style of Roman inscriptional capitals, yet their lower cases were specifically typographic creations of the Renaissance, owing more to their origins as calligraphic letters, which borrowed a bit of stylistic detail from Roman inscriptional capitals. </p>
      <p>That's all very well for classical architecture and classical capitals---if your client fits that shoe. Contemporary architecture (I won't call it "modern") demands contemporary type, faces that retain the basic structural components but shed classical detail. </p>
      <p>A clean set of capitals like those of Neutraface or Futura.</p>
      <p>j a m e s</p>
