    html: <p>From reading <a href="https://web.archive.org/web/20111011142943/http://www.amazon.com/Meggs-History-Graphic-Design-Philip/dp/0471699020/ref=sr_1_1/102-7686315-2079332?ie=UTF8&amp;s=books&amp;qid=1184632072&amp;sr=8-1" rel="nofollow"><em>Meggs' History of Graphic Design</em></a>, I recall that the De Stijl and Bauhaus movements/schools were concerned with design in all forms, from architecture to interior to graphic (and both innovated letterforms as well). Frank Lloyd Wright also did a good amount of graphic design, including desinging some typefaces (available from P22 <a href="https://web.archive.org/web/20111011142943/http://www.p22.com/products/flwfa.html" rel="nofollow">here</a> (look in the left column for the "FLLW" fonts). Any of those could make a good starting point, although all three have very distinctive styles that you may not (or may) want to embrace. I'm partial to De Stijl's asymmetrical balance myself.</p>
