      <p><em>Hiroshige - Is there anything specific from he dropdown menu i should be looking for?</em></p>
      <p>No not really, it was just a general suggestion meant to bring your attention to the hieroglyphs of mesoamericans, such as the words and syllables of the Mayan... <a href="https://web.archive.org/web/20111011142943/http://research.famsi.org/mdp/mdp_index.php" title="http://research.famsi.org/mdp/mdp_index.php">http://research.famsi.org/mdp/mdp_index.php</a>  </p>
      <p>And when their writting was carved of huge blocks of building stone, they became very 3d, which is quite a different method of communicating a written language (organically speaking of architecture) from the greeks and the romans (and their decendants too). With the mesoamericans, the medium was the message(?)</p>
