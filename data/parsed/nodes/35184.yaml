    <p>I'm currently redesigning a logo for a design company who's sister company deals with 3D design for architecture. Therefore the logo has to work for a design company AND a 3D/architecture company. So, I'm looking for any relationships between type and architecture. Anything will do: books, designers, movements web links etc. Anything to help me connect the two.<br>
    Cheers!</p>
