    <p>Hi everybody,</p>
    <p>I'm working on a project which allows to create an .otf font from a uncomplete UFO.</p>
    <p>I found this topic (<a href="http://typophile.com/node/55559" title="http://typophile.com/node/55559">http://typophile.com/node/55559</a>) and I proceeded as written but I have the following error:</p>
    <p><cite><br>
    $ python2.5 ufo2otf.py<br>
    03python/*.ufo<br>
    Compiling: TestFont1 (UFO2).ufo...<br>
    /Library/Python/2.5/site-packages/FontTools/sstruct.py:74: DeprecationWarning: struct integer overflow masking is deprecated<br>
      data = apply(struct.pack, (formatstring,) + tuple(elements))<br>
    /Library/Python/2.5/site-packages/FontTools/sstruct.py:74: DeprecationWarning: 'H' format requires 0 &lt;= number &lt;= 65535<br>
      data = apply(struct.pack, (formatstring,) + tuple(elements))<br>
    /Library/Python/2.5/site-packages/FontTools/fontTools/ttLib/sfnt.py:175: DeprecationWarning: struct integer overflow masking is deprecated<br>
      self.file.write(struct.pack("&gt;L", checksumadjustment))<br>
    makeotf [Note] Converting source font '/font.otf' to temporary Unix Type1 font file '/font.otf.tmp'.<br>
    makeotf [Note] setting the DONT_USE_WIN_LINE_METRICS OS/2 fsSelection bit 7 from fontinfo keyword.<br>
    makeotf [Note] setting the WEIGHT_WIDTH_SLOPE_ONLY OS/2 fsSelection bit 8 from fontinfo keyword.<br>
    makeotf [Note] setting the OBLIQUE OS/2 fsSelection bit 9 from fontinfo keyword.<br>
    makeotf [Note] Writing options file /current.fpr<br>
    makeotf [NOTE] Running makeotfexe with commands:<br>
       cd ""<br>
       makeotfexe "-f" "font.otf.tmp" "-o" "TestFont1 (UFO2).otf" -ff "features" -gf "glyphOrder" -mf "menuname"<br>
    makeotf [Error] Failed to build output font file  TestFont1 (UFO2).otf.<br>
    makeotfexe [WARNING] syntax error [glyphOrder:1] (record skipped)<br>
    makeotfexe [WARNING] syntax error [menuname:1] (record skipped)<br>
    makeotfexe [WARNING] not in Font Menu Name database [SomeFont-Regular]<br>
    makeotfexe [WARNING]  [internal] Feature block seen before any language system statement.  You should place languagesystem statements before any feature definition [features 3]<br>
    <strong>makeotfexe [ERROR]  Glyph "b" not in font [features 4]</strong><br>
    makeotfexe [FATAL]  aborting because of errors<br>
    Done!</cite></p>
    <p></p>
    <p>Does anybody have a suggestion / idea (which file to modify in the library, other library to use, code example,…)</p>
    <p>Thank you very much for your help.</p>
    <p>Nagar.</p>
