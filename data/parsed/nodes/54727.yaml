    html: |-
      <p>This is fun! Good work guys. I just tried it. It's pretty hard, too!</p>
      <p>Minor critique: One thing I'd really really wish for is high scores. This way, it's kind of sad how the end of the game seems to only be defined by the negative (losing all five "ligature" bonuses); it would be nice to introduce a positive incentive to keep playing (apart from learning about spacing!).</p>
      <p>Also, a big wish for version 2 would be not being limited to Helvetica. ;-)</p>
