    <p>Our design studio just released a new game for the iPhone on which we'd love to get some feedback: KERN.<br>
    We are developing some graphic-design oriented titles and wanted to make something specifically for our type loving friends!</p>
    <p>You can see a video preview <a class="freelinking external" href="http://www.vimeo.com/3177481" rel="nofollow">here</a>.</p>
    <p>The App is available at the <a class="freelinking external" href="http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewSoftware?id=304330441" rel="nofollow">App Store</a> as well. </p>
    <p>The project is also featured in detail at the <a class="freelinking external" href="http://www.formationalliance.com/index.php?id=39" rel="nofollow">FORMAtion</a> site.</p>
    <p>Let us know what you think!</p>
