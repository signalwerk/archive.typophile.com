      <p>The falling words is okay, but for a learning/teaching tool I think it would be more useful to have a static word with one or more missing letters that you need to shift left/right. After you submit your answer it's graded the way your game currently does it.</p>
      <p>Perhaps you could offer a few options for how the words appear? Falling, shifting, bouncing, static, etc.</p>
