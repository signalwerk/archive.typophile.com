      <blockquote><p>You think some of the creative sorts found here can't come up with a sans (or a serif) that's hard to read?</p></blockquote>
      <p>How is that going to help? I was thinking to have professional type designers select 5 sans typefaces they think are perfect for readability, 5 popular ones which are supposed to perform well and 5 popular ones with questionable readability and do the same for serif and have large control groups read a random page (not the same text) in each typeface and time the speed at which they're able to read the page. If the results of such a test would be all over the place then the conclusion would probably be that the design of the typeface is of secondary importance to the typographic setting. I strongly suspect however that not only will we see different results for each of the 3 groups per sans and serif, but we will see different results between sans and serif as well. With such a test I suspect we will have a great indication of what will work best. Whether a disprovable theory can be proposed on why one performs better than the other, I don't know. However at least we will be able to say statistically one will perform better than the other. That seems a lot more useful than our personal speculations and anecdotal evidence which is often circumstantial.</p>
      <p>I don't have the resources to perform a test like this. Do you?</p>
