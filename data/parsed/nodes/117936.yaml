      <blockquote><p>It's like when you ask somebody to breathe normally – it can never work.</p></blockquote>
      <p>No, but you can provide a context in which the person would breathe normally naturally. You can perform these kind of tests without explaining what you're actually doing. Use control groups and protect the test. Tell the testers you're studying reading speed and tell them they will be tested for accuracy later so the quality of their reading doesn't decrease as they desperately try to perform better.</p>
