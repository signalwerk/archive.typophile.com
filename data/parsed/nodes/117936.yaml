      <div class="comment-spam-body"><p><cite>But a designer who avoids science is merely an artist.</cite><br>
      Although I think I know what you mean, I find this statement to be very wrong. I wouldn't want to imply that some artists are just incompetent designers (which is what a designer without science could be perceived to be), or that incompetent designers are artists. I also wouldn't want to imply that a designer who doesn't avoid science is more than "merely an artist". And lastly, "merely an artist" seems to imply artists don't follow science. I have to admit a lot more liberties are taken in art than in design, but good art should still follow the same or similar guidelines as in graphic design.</p>
      </div>
