  html: <p>I'm curious if there are any scientific studies on typography I can read for references? I'm doing paper on typography and would like more than just quotes and examples showing why something just works. Having some scientific facts would be helpful as well rather than just what we all have learned and can instinctively all agree works best for legibility and readability.</p>
