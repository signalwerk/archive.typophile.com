    html: |-
      <p>I think one big factor is that graphic designers have an interest in not accepting science and poking holes in it, as it means that the average citizen can do his own research and act on it and opens the designer up to being proven wrong (among other reasons). Throughout history, you see the same appeals to something being an art that science can't hope to understand from medicine to architecture, but then researchers find the answers. Hell, even jewelers, a purely aesthetic trade, have been overrun by engineers who have discovered ways to maximize the brightness of a stone. Recently, therapists (who, unlike actual psychiatrists, are barely screened before putting up a shingle) have been fighting monumentally against the idea that they should be basing their practice off of contemporary psychological research rather than a pop culture idea of what Freud said. For a good example of idiotic pushback in this very thread, look no further than the claim that you can't get somebody to read something without priming him when that's a problem that researchers solve constantly by putting the actual research in the prepwork. You don't even need to set up false research as a cover in this case, as you could just print out your consent form in whatever typeface you want and then test their comprehension of the consent form.</p>
      <p>It is difficult to get a man to understand something, when his salary depends upon his not understanding it.</p>
