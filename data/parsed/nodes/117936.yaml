      <p>The problem with most studies on legibility is that they only tell something about typography and nothing about legibility, let alone typeface design. In many of the scientific studies I read, the influence of typography (poor relationship of type size, line length and line feed, typefaces tested at the same body size but with x-heights that differ considerably, badly printed or photo-copied samples, low-res screens, glossy paper etc.) was much bigger that the differences between the typefaces tested. Many other strange assumptions of scientists about typeface design contribute to results that are not valuable to typeface design, such as ‘we tested Courier in order to be able to say something about the influence of serifs on legibility’ or ‘we tested Arial because it is a standard’. </p>
      <p>Some of the studies of which I think they have been done ‘good’ are those done by Dirk Wendt, Chuck Bigelow, Ann Bessemans, Nadine Chahine, Sofie Beier and Kevin Larson. But one has to take into account that in some cases it is hard to ‘implement’ the results into typeface design.</p>
