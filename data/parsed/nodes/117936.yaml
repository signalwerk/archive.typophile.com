      <blockquote><p>Having some scientific facts would be helpful as well rather than just what we all have learned and can instinctively all agree works best for legibility and readability?</p></blockquote>
      <p>The problem here is what gets included the terms "readability" and "legibility." Most scientific studies make assumptions using simplified meanings of those terms that most typographers -- or even lay people -- would not accept. (Spend a year reading W.V.O. Quine, or take my word for it. Best would be read Quine...)</p>
      <p>You could, for example, do a study showing standard deviation in (1) comprehension and (2) speed, for reading a document set in two particular typefaces -- though even that is tricky -- but the sample size would be tremendous to draw any generally useful data. To make such a study based on a *supposed* single variable (say, serif versus sans serif) would be so full of flaws no one should accept it, even if the number of <cite>people</cite> taking the test approached the number needed to get useful standard deviation numbers. The answer would be valid only for the two typefaces selected for the test.</p>
      <p>* * *</p>
      <p>While not exactly a scientific issue, you can see a parallel with, say, the (1) philosophy of aesthetics and (2) art. Even were it possible to come up with a set of principles to define "what art is," (which would satisfy #1)  that's not to say you have a decision procedure -- it will not answer the question "is <cite>this</cite> a work of art" (i.e., #2).</p>
      <p>To put the matter another way, a useful scientific theory is capable of prediction. It may well do so outside it's data set (in fact, it must to be predictive). The data is the constraint -- it doesn't matter how well something predicts, if any empirical data conflicts, the theory is wrong (of course, that leads many to start "explaining" exceptions). Actually, the second constraint is it's predictive power. If you really have an answer, the model should predict how to construct a typeface that is either easier to read, or easier to comprehend (I'm not going to assume the two are the same).</p>
