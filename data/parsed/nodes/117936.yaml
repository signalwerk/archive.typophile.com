      <p>While there is some crossover between art and graphic design, in general they are very different occupations with many differences, including their basic goals (for art its self-expression, for graphic design it's communicating a message on behalf of a client). </p>
      <p>And I've known many designers who were interested in design research, including some who conducted research and had it published.</p>
      <p>I agree that a client might occasionally mention some design research to reject your concept. I've seen it happen. </p>
      <p>If you have a good concept and a reasonable client, you might be able to change their mind. But if the client is unreasonable, you finish the job, cash the check, and never work for them again.</p>
