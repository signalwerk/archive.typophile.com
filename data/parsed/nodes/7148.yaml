    html: '<p>Here’s my progress so far: <br> <br>Round One: <br>ClearviewOne, Compatil, Corpid, Documenta, Frutiger/FrutigerNext, Info, Kievit, Meta, Myriad, Parisine, PMN Caecilia, Syntax, Transit, Thesis <br> <br>Round Two: <br>ClearviewOne, Corpid?, Meta, Myriad, Thesis <br> <br>I’ll have to spend some time with these behemoths to decide further. <br> <br>Going into this I initially thought of Myriad and Meta as the most obvious choices. Mr. Spiekermann you were right on target with the suggestion of Meta. Thank you for posting. <br> <br>As far as sans serif vs. serif, I think a mild slab-serif might have use - eg. de Groot’s TheMix. I think true serif faces may be too delicate and not representative of Vancouver. <br> <br>Thanks everyone – I’ll be back <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>'
