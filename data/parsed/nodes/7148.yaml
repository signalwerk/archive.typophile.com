  html: "<p>Hi, <br> <br>I'm redesigning a printed ballot for the Vancouver municipal elections as part of my communication design senior project at ECIAD. <br> <br>I'm looking for something with some or all of the following characteristics: <br> <br>- high short-burst legibility <br>- family of weights, widths if possible <br>- letter-forms with visible differences from character to character to help with dyslexic/ESL reading <br>  (opposite of prokyon, univers, helvetica?) <br>- confidence with a little character and warmth <br>- contemporary feeling <br>- good optical characteristics at various sizes <br>- efficient character count (high x-height &amp; condensed available?) <br>- perhaps suitable for voting instructions, signage, etc <br> <br>A lot to ask, I know. The final choice will obviously be a compromise on one area vs. another. All suggestions of any kind are greatly appreciated! <br> <br>Thanks very much.</p>"
  html_clean: "<p>Hi, <br> <br>I'm redesigning a printed ballot for the Vancouver municipal elections as part of my communication design senior project at ECIAD. <br> <br>I'm looking for something with some or all of the following characteristics: <br> <br>- high short-burst legibility <br>- family of weights, widths if possible <br>- letter-forms with visible differences from character to character to help with dyslexic/ESL reading <br>  (opposite of prokyon, univers, helvetica?) <br>- confidence with a little character and warmth <br>- contemporary feeling <br>- good optical characteristics at various sizes <br>- efficient character count (high x-height &amp; condensed available?) <br>- perhaps suitable for voting instructions, signage, etc <br> <br>A lot to ask, I know. The final choice will obviously be a compromise on one area vs. another. All suggestions of any kind are greatly appreciated! <br> <br>Thanks very much.</p>"
