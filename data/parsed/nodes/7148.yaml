    html: <p>Rrrrrr. <br> <br>Resist the impulse to default to sans. I still say Trinité. It has the condensed and extended widths you require, it has the  multiple available extender lengths you require, it's superbly legible, it certainly fills your need for "confidence with a little character and warmth," need I go on? <br> <br>Other TEFF fonts are designed in similarly versatile ways (see also Lexicon.) The closest Adobe font I can think of is Kepler. Many would dismiss it because of its modern serif tendencies, but I think it's a fine and versatile design, perfectly legible, and certainly not overexposed. <br> <br>Step away from the sans!</p>
    html_clean: <p>Rrrrrr. <br> <br>Resist the impulse to default to sans. I still say Trinité. It has the condensed and extended widths you require, it has the  multiple available extender lengths you require, it's superbly legible, it certainly fills your need for "confidence with a little character and warmth," need I go on? <br> <br>Other TEFF fonts are designed in similarly versatile ways (see also Lexicon.) The closest Adobe font I can think of is Kepler. Many would dismiss it because of its modern serif tendencies, but I think it's a fine and versatile design, perfectly legible, and certainly not overexposed. <br> <br>Step away from the sans!</p>
