    html: "<p>Wait a minute, I love serifed text as much as your next humanist, but I don't see what's wrong with \"defaulting to a sans\" here. Especially when one is dealing with short tracts of texts, sans serifs can be highly useful.  <br> <br>I'm not saying that a sans <b>must</b> be used here, but I think that it would be silly to rule them out per some sort of dogma. <br> <br>Here are just some suggestions of humanist sans serifs, with condensed as well as regular weights: <br> <br>Font Bureau's Benton Sans <br><a href=\"http://www.fontbureau.com/fonts/font_frames.tpl?cart=10978590829497945&amp;fontname=BentonSans\" target=\"_blank\">http://www.fontbureau.com/fonts/font_frames.tpl?cart=10978590829497945&amp;fontname=BentonSans</a> <br> <br>H&amp;FJ's Gotham <br><a href=\"http://www.typography.com/catalog/gotham/index.html\" target=\"_blank\">http://www.typography.com/catalog/gotham/index.html</a> <br> <br>Storm's John Sans <br><a href=\"http://www.stormtype.com/jsans.html\" target=\"_blank\">http://www.stormtype.com/jsans.html</a> <br> <br>Linotype Vialog (this is a slightly narrow face, it has no regular or condensed, but a ton of weights. Originally designed as a signage family, its characters are very easily distinguished from another) <br><a href=\"http://www.linotype.com/53981/vialog-family.html\" target=\"_blank\">http://www.linotype.com/53981/vialog-family.html</a></p>"
