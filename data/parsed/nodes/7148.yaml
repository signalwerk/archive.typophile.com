    html: "<p>This may sound obvious, but i do know my faces pretty well: <br> <br>that description sounds like the brief for FF Meta, when i first designed it for the German post office as PT 55 back in 1985. It now even has a condensed version, and it was designed for very small sizes on bad paper with low-res typesetting. It's human, it's warm, it's a Sans. OK, it's overused, but aren't the Frutigers and Myriads even more so?</p>"
