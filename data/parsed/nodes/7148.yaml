    html: "<p>Generally I don't like sans fonts, but for careful, deliberate reading at small sizes they're better than serif fonts. The problem is <i>most</i> sans fonts are more modular (hence more ambiguous) than the typical serif face. I think the ideal here would be a sans that's \"quirky\" - in the right ways though. One font I might recommend is Burke's Pragma*. And if you go with sans, maybe his FF Parable. <br> <br>* <a href=\"http://www.hiberniatype.com/Pragma/pragma.html\" target=\"_blank\">http://www.hiberniatype.com/Pragma/pragma.html</a> <br> <br>Also, stay away from highly chirographic* fonts: although they're not as bad as geometrically constructed designs, they're still too formally modular - it's just a less obvious modularity. Look at the b/d/p/q in your average chirographic font: the bowls are too similar. Good for aesthetic harmony, bad for reading. <br> <br>* Which is a term meaning a design that exhibits the vestiges of handwriting/calligraphy. <br> <br>hhp</p>"
