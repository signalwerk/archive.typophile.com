    html: <p>I don't think you'll find anything that is specifically well optimized for dyslexic/non-Latin readers, which also comes in a large family of weights and widths. <br> <br>I'll also note that legibility and efficient character count (including condensed widths) are largely opposed to each other. Newspaper text faces try to walk that line, but they are also optimized for small sizes and don't meet the rest of your needs. <br> <br>Overall, I'm thinking something in the same general design space as Myriad or Frutiger would seem best suited to the job. Humanist sans, pretty legible, available in a wide range of weights and widths. <br> <br>Regards, <br> <br>T</p>
