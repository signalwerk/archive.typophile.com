    html: |-
      <p>chris, i really like the directions you tackle with your pixel font designs. they are not easy directions, really. the larger the pixel font, the more frail it appears, imo, making every pixel and its placement really count.</p>
      <p>in some ways, making a 'traditional' pixel font of this type is more difficult than making a 'gray' pixel font. placement of each 'notch' must be in the spirit of the overall design, and in a funny sort of way, actually becomes the spirit of the design, just as much as the overall shapes your glyphs are built from.</p>
      <p>you might try to build these as non-italics fonts too. i believe they'd be slightly more sophisticated in their achievement.</p>
      <p>what do i mean by that?</p>
      <p>as it stands, your designs evoke the idea of sophistication (at least to me), but the actual execution of the idea is a little shaky. this is not your fault at all. this just comes from pushing the envelope--and creating a large, one-pixel wide cursive italics font is just about as difficult as it gets.</p>
