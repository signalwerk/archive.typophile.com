    <p>Hello everyone,</p>
    <p>I'm currently designing a logotype for a friend of mine, who'll soon be opening a café/bar here in Duesseldorf. It's a simple "just for fun"-thing i'm doing for free. The font is inspired by (often handpainted) bar and shop signs I saw in Italian towns like bologna, verona etc. last summer. </p>
    <p>There are some inconsistencies, i'm still trying out different things… but what do you think so far?</p>
    <p>Thanks,<br>
    Hanno</p>
