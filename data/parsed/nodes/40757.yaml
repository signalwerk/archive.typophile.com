    votes: null
    html: |-
      <p>Nice work. I wonder if you might play around with slight optical reductions to the strokes in the lower case a and e to open the counters. They look too bold in relation to the other characters. </p>
      <p>I'm not convinced that your tail to the Q is the best solution. It is okay, but why not try for something a bit more unexpected?</p>
      <p>The lower counter spaces in the capital M feel too cramped. How about a little optical compensation to open those wedges up? The flat point doesn't need to be so wide, which could give you some wiggle room.</p>
      <p>The middle diagonals in the cap P and R, and the upper diagonal in the Capital K, and the tail of the lower case g could be slimmed slightly. They look to heavy in relation to the rest of the character. The counter in the tail of the g is too small.<br>
      Also, how about a bit more space under the dot of the i? It is starting to look like an l.</p>
      <p>Have you ever studied the stroke width measurements in Cooper Black? He must have done the whole thing by eye, since no two strokes are the same width. But they all look perfect together. Sometimes I think the computer causes me to over-trust measurement, and my eye gets lazy.</p>
    html_clean: |-
