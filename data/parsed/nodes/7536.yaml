    html: <p>Wolfgang Weingart uses it as his second typeface, after Akzidenz Grotesk. His book, <i>My Way to Typography</i> has its text set in it. <br> <br>In Germany, the academically minded publisher Suhrkamp used Times Bold for decades on its paperback covers. Willi Fleckhaus instituted that when he was Art Director there in the early 1960s. Later, the publishers changed his design so that it would be centered, uglifying the books (in my opinion). Just recently, the publisher redesigned their image; book covers are now set in Adobe Garamond, and flush left again. German designers are up in arms about this that way that we were about the UPS logo change.</p>
    html_clean: <p>Wolfgang Weingart uses it as his second typeface, after Akzidenz Grotesk. His book, <i>My Way to Typography</i> has its text set in it. <br> <br>In Germany, the academically minded publisher Suhrkamp used Times Bold for decades on its paperback covers. Willi Fleckhaus instituted that when he was Art Director there in the early 1960s. Later, the publishers changed his design so that it would be centered, uglifying the books (in my opinion). Just recently, the publisher redesigned their image; book covers are now set in Adobe Garamond, and flush left again. German designers are up in arms about this that way that we were about the UPS logo change.</p>
