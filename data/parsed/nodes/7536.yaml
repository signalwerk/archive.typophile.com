    html: <p><i>In Germany, the academically minded publisher Suhrkamp used Times Bold for decades on its paperback covers.</i> <br> <br>The face Fleckhaus used on the �designed� covers was Times Black, one of those weird weights made for photosetting and bearing not much resemblance to Times New Roman. Except in name, and that always seems enough to make designers pick a face. We fall for brands just like everybody else.  <br> <br>Fleckhaus also spec'd Stempel Garamond for one of the other Suhrkamp paperback lines (they have 3 lines, all designed differently), which used to be set in hot metal back in the 60s, when the series were first designed. Once I get my books back out of the boxes, I can post some scans, if anybody is interested.&lt;/font&gt;</p>
