    html: <p>I love the way it's used in the advertisements for "Six Feet Under", which I see from time to time in BART stations and other transit venues. I'm not sure why it comes across so well to me; perhaps it's because the rest of the graphic design is so sophisticated that the choice of Times <i>has</i> to be conscious rather than default.</p>
