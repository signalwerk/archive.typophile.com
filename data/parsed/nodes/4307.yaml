  html: |-
    <p>Just thought I'd offer up a new item to critique. This is the light weight (not the lightest) of a new font I'm working on. It's a monoline sans serif with a bit of modular modernism that I can see being used in magazines or other publications. <br> <br>Don't mind the weird curves on the 3, I'm not sure why illustrator is messing up the curves, but it looks fine in FOG. <br> <br>Any criticisms are welcomed. <br> <br></p>
