    <p>how do all</p>
    <p>is it possible to blend kerning pairs between two weights? say a light and a bold. I realise that this will lead to imperfect results, but for an enforced need of expediency, it could be my only option. For the sake of curiosity, it will also be interesting to see the level of quality versus a manually grafted set.</p>
    <p>cheers</p>
