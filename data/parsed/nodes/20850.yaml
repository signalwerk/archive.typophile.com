      <p>Adam,</p>
      <p>That operation is not working for me in FLS5.02. The values I get are duplicates of the values from one master. In addition, the number of pairs derived from a MM instance is extremely small compared to the number of pairs in the 2 masters. </p>
      <p>A separate issue, but an important one, is this: After compatibilizing my outlines scrupulously, testing successfully with the "Blend Fonts" function, instances from a MM have erratically exploding shapes; some points simply migrate randomly, many units away from their correct location. This behavior is different from what results when outlines are not compatible or path order is switched between masters. I include some examples. </p><div class="imageWrap"><img src="http://typophile.com/files/sevenwack_3941.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/Hwack_4780.gif"></div><p></p>
