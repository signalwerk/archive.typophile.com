    votes: null
    html: |-
      <p>hrant: I'm with you. There are applications, though, for which skeletons are appropriate, and Inkscape at least gives you the choice, as well as a much more sophisticated way to increase their expressiveness.</p>
      <p>I'm working on the chapter of my thesis that includes the comparison with Ikarus, so I just made this graphic, comparing Spiro with the example that Karow gave in his 1991 paper "<a href="http://cajun.cs.nott.ac.uk/compsci/epo/papers/volume4/issue3/ep044pk.pdf" rel="nofollow">Digital Punch Cutting</a>". As you can see, it takes about half as many control points to achieve the same level of quality. I haven't tried the Autocad spline directly, but from what I have been able to find, it's based on NURBS, which is a polynomial spline roughly similar to the cubic Lagrange spline at the heart of Ikarus. I'd be very surprised if the Autocad and Ikarus splines were much different.</p>
      <p>Dave: I'm still working on the stability question. It turns out to be a more interesting (i.e. harder) problem than I first thought. I have some Javascript code which is slightly better than the C implementation, but now I'm encouraged that a different generating curve may actually be even more robust. I'll release something before too long.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ikarus-spiro_3912.png"></div><p></p>
