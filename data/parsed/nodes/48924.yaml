    html: <p>It seems like this continues the recent development of new tools for creating letters outside of tracing an outline with beziers -- Kalliculator, LivePen, and now this. None of these, as I've seen them so far, can really develop a complete font file the same way FontLab can, though. They seem like good tools for sketching an idea, and can take it to a pretty finished state, but there's still a lot of work to be done in FontLab. I hope somebody creates a tool that takes the best intuitive parts of Kalliculator, LivePen, and Spiro, and combines them into a full-fledged font development tool.</p>
