      <p><cite>FontForge is notorious for having no hard dependencies, other than X11, and the latest version from CVS is often quite far in advance of the last released and packaged version.</cite></p>
      <p>This is true that FontForge will function fine without dependencies, but there are some libraries that will add features if installed (most notably libspiro, but there are others, listed on <a class="freelinking external" href="http://fontforge.sf.net" rel="nofollow">http://fontforge.sf.net</a>). Though the CVS gets well ahead, at least George does make the effort to post a release package on an almost monthly basis.</p>
