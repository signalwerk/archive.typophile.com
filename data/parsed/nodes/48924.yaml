    html: |-
      <p>@raph: I love the way you use "interesting" as a euphemism for "hard" :-) I look forward to your next release with patience :-)</p>
      <p>@FeelTheKern: Combining parts of Kalliculator and LivePen isn't possible, since they are proprietary programs. How Spiro works isn't a secret, but its available under the GPL which means if any other program includes it, it must also not be secret. (Or pay Raph lots of money! haha :-) When I spoke to Frederick about making Kalliculator free software a few years ago, he didn't seem convinced, but there are rumours that he's changed his mind so fingers crossed :-)</p>
      <p>Probably what will happen is that Inkscape's calligraphic pen path tool will be extended from a 'one shot' tool to a skeletal one with much more control. There are existing efforts to add basic type design features to Inkscape directly too, for developing SVG Fonts, which will make the Inkscape -&gt; FontForge workflow a lot smoother.</p>
