    user_name: abattis
    user_path: null
    date_raw: 8 Sep 2008 — 11:07am
    date: 2008-09-08T11:07:00
    votes: null
    html: |-
      <p>@FeelTheKern: Installing X11 on Mac OS X is easy :-) Its on the Mac OS X DVD and is a simple double click install. Then to install and run Inkscape or FontForge you just download their Mac builds, drag them to Applications, start X11, and then click their icons like a normal Mac OS X program. However....</p>
      <p>@James: Building these tools from source is a requirement if you want to see the latest and greatest features. FontForge is notorious for having no hard dependencies, other than X11, and the latest version from CVS is often quite far in advance of the last released and packaged version. Similarly, Inkscape is currently in a rapid development phase and you'll need to build that from source too in order to see the latest Spiro features. I recommend using <a href="http://www.gnewsense.org" rel="nofollow">gNewSense</a>, a version of Ubuntu with no proprietary software. That way you can see what a 100% free software system can do, and all the information available for Ubuntu will be applicable. The website offers an ISO CD image file you can burn off and restart your computer with in the usual way. </p>
      <p>If you get stuck, just post on this thread specifically where you're at and I'll try to help out.</p>
