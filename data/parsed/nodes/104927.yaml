      <p>The Unix script can be called <code>lglyphs</code> without the <code>.lua</code> extension if  the first line is replaced by</p>
      <pre>#!/usr/bin/env texlua
      </pre><p>and will then execute properly.  Other options can be found in the manual at <a href="http://www.luatex.org/svn/trunk/manual/luatexref-t.pdf" title="http://www.luatex.org/svn/trunk/manual/luatexref-t.pdf">http://www.luatex.org/svn/trunk/manual/luatexref-t.pdf</a></p>
