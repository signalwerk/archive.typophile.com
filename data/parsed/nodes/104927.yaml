      <p>I hope the following answers your question; if not, you will need to be more precise. I  know FontLab only very superficially  but I don't think it generates anything else than what you designed. </p>
      <p>Here is what you seem to be experiencing. On OS X and on Windows, TextEdit, Word, Pages, Powerpoint (standard Mac and Windows applications)  use a "fallback font" when the current font is missing a character. To avoid that you need an application that does not rely on the fallback mechanism. I know that Adobe InDesign would not replace your missing glyphs by those of a fallback font. If you are on a campus with a fast connection, you can install texlive 2013 (on the Mac, it is <a href="http://www.tug.org/mactex/" rel="nofollow">MacTeX</a>, on the PC, <a href="http://www.tug.org/texlive/" rel="nofollow">TeX Live</a>). It comes with XeLaTeX that does not use the fallback mechanism either. Here is how MacTeX looks (with TeXShop); first the input file:</p>
      <p><img src="/files/xelatex_4867.png"></p>
      <p>and now what I get after clicking "Typeset".</p>
      <p><img src="/files/bonjour_6323.png"></p>
      <p>The font does not contain Hebrew characters and they are displayed as missing.</p>
      <p>You could also try <a href="http://www.lyx.org/Home" rel="nofollow">LyX</a>, that is built on top of TeX and is supposedly more user friendly.</p>
