  html: |-
    <p>Is it possible to generate a font with only the glyphs that I designed in fontlab. It seems like when I use my typeface in other applications for glyphs that I didn't design it replaces them with a standard glyph which I do not want displayed. </p>
    <p>It might be a silly question, but thanks in advance.</p>
