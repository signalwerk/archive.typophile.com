    html: |-
      <p>Of course, texlive also runs on Unix.</p>
      <p>Once texlive is installed, you also have lualatex. If you have any doubt about the glyph list in your font, here is a lualatex script that will give it (from the manual)</p>
      <pre>--- file lglyphs.lua --- cut here
      #!/usr/bin/env lualatex

      local f = fontloader.open(arg[1])
      local i = 0
      while (i &lt; f.glyphmax) do
        local g = f.glyphs[i]
        if g then
          print(g.name)
        end
        i = i + 1
      end
      fontloader.close(f)
      --- cut line ---
      </pre><p>Then</p>
      <pre>lualatex lglyphs.lua fontfile
      </pre><p>will give you the glyph list in your font file. You can make that file executable and run it as a unix script but on my mac it needs the extension .lua to work.</p>
