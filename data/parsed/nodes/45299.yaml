      <p>The reason my first tries were with FreeType is because I'm not that comfortable with win coding :-) and I'm still developing <em>some</em> FreeType skills. It was pretty easy to write a proof of concept, though.<br>
      Then I realized I couldn't create a <em>vector</em> image that way -- only pixel based, and that was a real drag.</p>
      <p>So I switched to pure Windows, using its native print routines. It turned out to have its own weird stuff. D'ya know that if you select a printer, you're stuck with its resolution, in integers only? So using floating point coordinates is off ... Also, it's <em>impossible</em> to scale a font to non-integer sizes! And I'm having a hard time getting relevant font data from this cursed system :-) So much for Myriad Pro Semibold at 8.5 pts; Windows doesn't allow either! At best, it explains some of Word's intricacies.</p>
      <p>That's the Bad &amp; Ugly news. Good news is that the hard work can be done (I think) in your programming language of choice -- given that you have (a) an image to sample, (b) an array of fonts and sizes (with access to their metrics on a character basis), (c) a large chunk of filler text, and (d) the dimensions and a pointer to some 'canvas' to write the results to. My version is in plain C, but the logic in the hard work loop should be portable enough. Originally, I was considering a PostScript version -- now <em>that</em> would be something! (drool) (okay, not now)</p>
      <p>Your website doesn't mention contact details, but you can reach me through my domain, using my first name as e-mail address. Intentionally oblique, to fool spambots ... (God, how I hate spam! Don't get me started on that.)</p>
