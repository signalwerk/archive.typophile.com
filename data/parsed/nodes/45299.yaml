    html: |-
      <p>An excellent observation!<br>
      No, I don't do that. That means that the "distance" in gray between, say, 4 pt Arial and 5 pt Arial and 6 pt Arial is the same for each. As characters are square objects, this should be a logarithmic difference instead (?? -- pretty sure about that...).</p>
      <p>You can influence this by eyeballing it with the Curves option, but I think I know how to make it more "exact" (read: "less inexact"). It's not the bounding box, because this has the same black-to-white ration for each of the different sizes :-) Instead, I should check against the coverage of each size against the <em>total line height</em> of the line -- that is, the height of the biggest font size. So a 4 pt Arial Black is much lighter than a 12 pt Univers Light, on a line heigth of 12 pts.</p>
      <p>The <em>actual</em> gray values are not that important, though. What's more important is the different <em>ratio</em> from one level to another, those you can now set manually. That should/could be an automatic setting.</p>
