      <p>No need for apologies! It works just as fine with different weights. Or even different <em>fonts</em> (although you're on your own for selecting the gray values).</p>
      <p>I just finished adding a few interface niceties: a <strong>Save</strong> and a <strong>Load</strong> button, so you can save (and load) the font list. You can also manage the list itself, moving stuff up and down and editing with a quick double-flick on the font name. You can save the settings as "defaults.fis", which will set the defaults (...).</p>
      <p>This version has a different <em>name</em>: somewhat more appropriate, <strong>FontImage</strong>. I noticed "TextImage" was already used for ASCII art apps, this is definitely something else :-) (Thanks to Tim Satink for that name.)</p>
      <p>The new version, again available  <a class="freelinking external" href="http://www.jongware.com/binaries/fontimage.1.1.zip" rel="nofollow">at my site</a> (direct link), features a slightly faster printing and better justification. Some bugs included -- still no guarantees.</p>
