      <p>I've heard that most of applications don't support 'valt' feature.<br>
      So all Japanese fonts control the positioning of full-width 'g' and 'y' for vertical setting with 'vmtx' table.</p>
      <p>I've tried to compile valt feature in FLS like this,</p>
      <p>feature valt {<br>
        pos A &lt;0 -1000 0 0&gt;;<br>
      } valt;</p>
      <p>and then, FLS showed it correctly in Preview palet, but it didn't work with Illustrator CS3.<br>
      valt feature might be for full-width Latin characters in CJKV font.</p>
      <p>Do you want to set your font vertically with Japanese fonts?</p>
