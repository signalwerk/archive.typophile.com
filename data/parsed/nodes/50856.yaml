      <p>I should first state that the 'valt' GPOS feature is effectively deprecated, because there is a better way to achieve the functionality. Given that the context in which its functionality is expected to be used is vertical writing, and that it is also expected to be default behavior, we discovered that we could effect this through 'vmtx' table overrides.</p>
      <p>I developed a Perl script, several years ago, that takes two files as input. One is a coverage table, specifically a list of CIDs and CID ranges that are candidates for this treatment. This means anything that is classified as full-width Latin, full-width Greek, or full-width Cyrillic, including full-width symbols. The other is the AFM file for the font, which has the glyph-level BBox information. (The AFDKO tool called "tx" has a mighty convenient "-afm" option for generating AFM files from a font.)</p>
      <p>Consider the full-width Latin glyphs for a, b, and p. In Adobe-Japan1-6, the CIDs are 816, 817, and 831, respectively. For Kozuka Mincho Pr6N Regular, the AFM records for these glyphs are as follows:</p>
      <p><code>C -1 ; W0X 1000 ; N 816 ; B 276 -12 754 514 ;<br>
      C -1 ; W0X 1000 ; N 817 ; B 240 -12 762 772 ;<br>
      C -1 ; W0X 1000 ; N 831 ; B 248 -257 775 514 ;</code></p>
      <p>Given that the top and bottom of the design space is at 880 and -120, what we effectively want to do is to center the glyphs within that 1000-unit space. When I run my script, which I named mkvmtx.pl, the following is the output for these three glyphs:</p>
      <p><code>table vmtx {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;VertOriginY \816 751;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;VertOriginY \831 628;<br>
      } vmtx;</code></p>
      <p>What happened to the entry for CID+817? Look at its Y-axis values, specifically -12 and 772. There is exactly 108 units between the edges and the edges of the design space, so the glyph is alrady centered, and no adjustment is necessary. The default value is 880, and thus is not necessary.</p>
      <p>The workhorse portion of my script, which iterates through AFM records, ignoring those not in the coverage table (%cidrange), is below:</p>
      <p><code>$ybottomlimit = -120;<br>
      $ytoplimit = 880;<br>
      $ycenter = ($ybottomlimit + $ytoplimit) / 2;</code></p>
      <p><code>while ($line = &lt;STDIN&gt;) {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;if ($line =~ /^C.*/) {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;chomp $line;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;($cid,$ymin,$ymax) = (split(/ /,$line))[7,11,13];<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;if (exists $cidrange{$cid}) {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;$halfy = ($ymax - $ymin) / 2;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;$yminnew = $ycenter - $halfy;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;$pushy = round($yminnew - $ymin);<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;$pushy =~ s/^\+(\d+)/$1/;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;printf STDOUT "  VertOriginY \\$cid %s;\n",$ytoplimit - $pushy if $pushy !~ /^-?[0-4]$/;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}<br>
      &nbsp;&nbsp;&nbsp;&nbsp;}<br>
      }</code></p>
      <p><code>sub round {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;my ($arg) = @_;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;if ($arg =~ /\.[0-4]\d*/) {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;$arg =~ s/\.[0-4]\d*$//;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;} elsif ($arg =~ /\.[5-9]\d*/) {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;$arg =~ s/(\d+)\.[5-9]\d*$/$1 + 1/e;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;} return $arg;<br>
      }</code></p>
      <p>If anyone would like the complete Perl script or the coverage tables for our CID character collections, or both, please feel free to drop me an email.</p>
      <p>Dr. Ken Lunde<br>
      Senior Computer Scientist, CJKV Type Development<br>
      Adobe Systems Incorporated<br>
      <a href="mailto:lunde@adobe.com">lunde@adobe.com</a></p>
