    <p>I am working on transforming my resume so that it is fit for graphic design positions. Thus far I have used my resume for part time, clerical, customer service jobs. </p>
    <p>And now I feel inadequate... ha. </p>
    <p>I'm only applying for an internship, and it is unpaid, so I feel like what my resume lacks, I should be able to make up in the fact that I am applying and that seemingly no one else has in the past 3 months. The position has been listed a few times on the company's site of choice. </p>
    <p>So if anyone has any suggestions or tips, they're most welcome. I think I've gotten my content solidified. Now comes the fun part of putting it together in InDesign.</p>
