      <p>I recently went through and re-designed my resume to suit a more graphically minded audience as well. I'll try and help you as best I can. This is free advice though too, and I don't know how much you already know about resumes so take each point with a grain of rice. (I know I know, it's salt but rice rhymed.)</p>
      <p>-If you don't already know what sort of design direction you want to take it in, do some looking at magazines or websites that you like the look of. Take note of graphical elements you can use in your resume like header, bullet and font styles. Make sure you don't go overboard on the designing, however. Remember it primarily needs to be functional and understandable.</p>
      <p>-If you're applying to schools or jobs in a specific field, take that into account in your designs. Make sure your resume matches the look and feel a given type of company or college would want.</p>
      <p>-Remember: the primary goal of a resume is to get you an interview. Make sure that someone flipping through stacks of resumes would flag yours to make a call.</p>
      <p>-General advice about getting where you want to be in a company that can also be applied here: "Dress for the job you want, not the job you have." Maybe a bit cliche, but helps just the same. Design your resume with your desired job in mind. Don't design it as if you were an intern, but as if you were an art director for a major design firm.</p>
      <p>I don't know if any of those points are helpful . . . or if they sounded any different from a self help book on writing resumes. Best of luck in getting that internship.</p>
