      <p>#3 reminds me of Goudy Sans.</p>
      <p>Florian's #2 suggestion of Herold Condensed is good. I also thought it looked like <a class="freelinking external" href="http://new.myfonts.com/fonts/ortizlopez/ol-miehle-classic/" rel="nofollow">Miehle</a> which was a Benton design from 1906. Dennis Ortiz-Lopez's version doesn't have cyrillic, but certainly a metal cyrillic could have existed in the 1910-17 time period.</p>
      <p> - Mike Yanega</p>
