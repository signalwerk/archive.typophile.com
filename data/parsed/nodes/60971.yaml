    html: |-
      <p>Concur re. Herold for no. 2.</p>
      <p>The last is probably Berthold Latinskaya, reinvented in the 1930s as Literaturnaya, familiar to anyone who has ever read any textbook printed in the USSR.  There is a freebie version that can be found on the various Russian font sites.</p>
      <p>See:  <a href="http://en.wikipedia.org/wiki/Literaturnaya" title="http://en.wikipedia.org/wiki/Literaturnaya">http://en.wikipedia.org/wiki/Literaturnaya</a></p>
