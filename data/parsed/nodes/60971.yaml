    <p>Hello,</p>
    <p>I was wondering if anyone knew anything about these faces or more helpful to my purposes if they resemble or were based on any roman typefaces from the same period. They are from the Russian futurist book Tango with Cows. I can post more samples if that would be helpful.</p>
    <p>Not pictured here are cyrillic types based on Akzidenz, Boomerang, Calligraphia and Antique Extra Condensed.</p>
    <p>Thanks!</p>
    <p>Daniel</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/wedged_6601.jpg"></div><br>
