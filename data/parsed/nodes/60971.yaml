      <p>Thanks everyone!</p>
      <p>I'm looking to do a visual translation of the book, so every face I can find an equivalent of saves me the trouble of deciding on a substitute or attempting to recreate it. So for my purposes a cyrillic face isn't necessary.</p>
      <p>Does anyone know if Romana had an italic? I didn't picture it but the book contains a lot of italic of the Romana-cyrillic.</p>
