    html: <p>Mike, now you know why I hate the fact you can condense and expand letterforms. They loose the designers original intention, putting stress on vertical and horizontal strokes that make the type designers here cringe. It looks that you have a good solution, I bet the example was scanned softly or it was a scan of a printed piece. A couple of generations from the original. Dan</p>
