    html: <p>Mike, I feel that there is a huge amount of lazieness. Its so easy to mash or bash a type style, why bother do, like you are doing, catalog and create a library of type designs that can be accessed. Its like the quote I used on the T-shirt contest "I haven't heard from him last year, and I haven't heard from him from him this year and if I don't hear from him next year, I'm going to write him a letter". The point being people won't spend the time for good design when they can do it quickly. So sad, Dan</p>
