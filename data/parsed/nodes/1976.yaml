    votes: null
    html: <p>Dan, what you say is true, but the designer's original intention is not the end user's main concern. A graphics program gives anyone the means to build from a font in almost any way their job requires. Do you think the folks at Google worried if Gustav Jaeger was going to be bothered by his 'Catull' becoming three dimensional with highlights when they used it for their logo?  Sometimes such 'massaging' improves the original work, whose letterforms or kerning pairs were not well planned.  Sometimes it just helps you to fit the space you have, but isn't that within the user's license?  You can say the end result is ugly, but that is the risk the tamperer takes. What if it's better?   <br> <br>For what it's worth I sympathize with the idea that fonts should be used as designed. I play with them when someone wants to match a font I can't find, or that was a custom design no one has any more. I play with them when a customer says 'can't you fix that 't'?'</p>
