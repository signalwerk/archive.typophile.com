    votes: null
    html: <p>Wow.  I'm bowled over.  I can't thank you guys enough for helping us with this. <br> <br>We are now discussing whether it would be easier to switch our logo to one of these "close" fonts, or look for someone to create our font by modifying Agency or one of the others. <br> <br>The web developer that created the logo was known for creating button images using MicroSoft Paint and filling them out a pixel at a time.  If I didn't see that, I wouldn't have believed it.  I do remember him looking through some fonts while creating the logo, so I was hopeful that it wasn't a mix or a free-hand effort. <br> <br>The head hauncho is travelling today, so we can't come to a final decision today.  I think he'll be pretty happy with the progress you all have helped us make. <br> <br>Again, thank you all, and I'll be back in touch after the weekend. <br> <br> <br>Steve</p>
