    html: <p>I disagree about Agency, because it uses a monotone stroke. This typeface is unevenly weighted. It might be worth trying to match the S first, because the A might be a fabrication, like an inverted U. (I was originally trying to help Steve separately, and recommended that he try this board, because the best I could come up with was using letters from Red Rooster's <a href="http://www.philsfonts.com/detail.html?sku=RR00005103P2" target="_blank">Europa Grotesque</a>, and of course slanting them.) I know how font multilations offend Yves, but I couldn't find anything closer. I thought maybe one of you would be more up on the Tech-ish fonts.</p>
