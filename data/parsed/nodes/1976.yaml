  html: <p>Greetings, <br> <br>   Our logo was designed by a web designer who is overseas and unavailable.  We have tried whatthefont.com and other font identification services, but have been unable to find a match.  We aren't sure whether he used an existing font or photoshopped the letters of another font to create our logo. <br> <br>   We would like to use this font within our company to tie our products with the company. <br> <br> <br>   Thanks in advance, <br> <br>Steve Tarter <br>ZedaSoft, Inc (<a href="http://www.zedasoft.com" target="_blank">http://www.zedasoft.com</a>)  <br> <br><img src="http://www.typophile.com/forums/messages/83/20011.jpg" alt="ZedaSoft Logo"></p>
