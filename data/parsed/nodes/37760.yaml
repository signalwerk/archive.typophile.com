    <p>Hi everybody: first font, first problem, first post.<br>
    I’ve worked my way designing the glyphs in illustrator and assembling everything in fontlab, compiling metrics and kerning. I’m now in the testing phase (I’m on a mac) and I noticed a software specific bug, which seems to come up only in some apps, namely apple pages and linotype fontexplorer x. Here’s the problem:</p>
    <p></p><div class="imageWrap"><img src="/web/20080821125420im_/http://www.typophile.com/files/justified_6504.gif"></div><p></p>
    <p>as you can see, everything’s fine in the first unjustified paragraph, but when I test a justified paragraph - the one below - the software screws the tracking (mainly the one of the ’i’) to evenly space the rows. In a former version of the font the same problem affected the letter ’b’, so I deleted the ’b’ glyph and re-pasted from illustrator, re-defined kerning and metrics and recompiled, only to have the ’i’ freaking out this time.</p>
    <p>Another couple of things to be noted: if I tweak the tracking a little in pages, the problem seems to fix itself at random values; using the same font in NeoOffice and making a justified paragraph doesn’t cause any problems or visible bugs.</p>
    <p>So, has anybody any idea of what might be the cause of this bug? Any thoughts or suggestions?</p>
    <p>Thank you in advance!</p>
