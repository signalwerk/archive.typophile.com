    <p>Has anyone made a revival of the <a href="/node/add/wiki?edit%5Btitle%5D=Romain%20du%20Roi" title="Create node &quot;Romain du Roi&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Romain du Roi</a> face? When I searched the Typophile forum for it, the closest match that I could find was Dan Reynolds commendation on a book set with RdR in its digital incarnation – at that time, unavailable to the public.</p>
    <p>So how has things progressed two years from then?</p>
