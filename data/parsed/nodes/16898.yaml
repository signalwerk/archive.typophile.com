      <p>Dolly’s great. I’ve got a tryout license and I love it. I’ve come very close to being able to license it for a job, but budget did not allow.</p>
      <p>It defies traditional book type with its brush-like softness, but it still works well. Perhaps not for a literary work, but in other contexts, I think it holds up for blocks of text. I’m sometimes wary of book face for broader client work because they lack the range of weights that are often called for outside of highly controlled projects, but I’ve spec’ed Whitman (another book face) as a corporate font and had no problems so far.</p>
      <p>Anyway, I support your choice. It’s a great family.</p>
