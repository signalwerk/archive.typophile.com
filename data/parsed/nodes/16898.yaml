      <p>crossgrove:</p>
      <p>It seems that “contrast” in the sense of type has more to do with thick/thin, rather than simply darkness/light.</p>
      <p>If one were to thicken up Joanna, for instance, it would look more like Dolly or whatever metal type. “Dark” and “light” seem to be less accurate terms, since they can also refer to the shade of ink being used. You don’t actaully darken a font, but rather, make it thicker so it appears heavier on the page.</p>
      <p>Am I making sense now?  ;)</p>
