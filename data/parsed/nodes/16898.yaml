    <p>What does everyone think of <a href="/wiki/Dolly" class="wiki-create">Dolly</a> by <a href="/wiki/Underware" class="wiki">Underware</a>: <a href="http://www.myfonts.com/fonts/underware/dolly/" title="http://www.myfonts.com/fonts/underware/dolly/">http://www.myfonts.com/fonts/underware/dolly/</a></p>
    <p>It looks like a very legible, general purpose font. It has a certain warmth and charm that are tugging at my pocketbook. It’s a rather high-contrast face, which might take some getting used to, although that might do my readers a favour.</p>
    <p>For some reason this face doesn’t get alot of attention. Or maybe I haven’t been around the font scene long enough.  </p>
    <p>Supposing I do buy this doggy in the window, can anyone suggest a good sans for this?</p>
