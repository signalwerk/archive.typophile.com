    html: |-
      <p>Well,....</p>
      <p>You’ve grasped the typographic meaning of contrast completely. Didot is high-contrast, Helvetica is extremely low-contrast. </p>
      <p>Even if you’re using a yellow ink, Clifford is still darker than Centaur, because it was digitized and spaced that way. It doesn’t refer to a literal gray value. You could easily compare 2 different weights of the same design in terms of their darkness. “The light weight is too light on the page, the Bold is too dark”. The term would be qualified by what you are using it to describe. </p>
      <p>A dark tale could be printed on dark paper with a dark typeface in a dark ink, by a pressman in a dark mood, at a dark time in history. In this scenario dark refers to everything, but in different ways. None of these describe making type look thicker or darker on paper. Letterpress printing always carries the possibility of a darker or lighter impression (yet another variable), which can affect the look of the page, independently of the typeface or ink chosen. </p>
      <p>No need to avoid a term like dark, as long as it refers to something specific. For better or worse, typography and type design are full of arcane terminology, and some of it is not intuitive or logical at all. Continue at your own peril....    ; D</p>
