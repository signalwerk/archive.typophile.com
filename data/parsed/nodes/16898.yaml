      <p>Christian,</p>
      <p>I’m very surprised to see you describe Dolly as high-contrast. It seems quite the opposite to me. Maybe you were referring to its dark color. I can’t see why it would take getting used to; it’s so warm, humanistic and readable. Maybe you’ve been using sparkly, light faces lately?</p>
      <p>The darkness of Dolly makes it very useful in small sizes and difficult situations. Notice Underware describe Dolly as “A Book Typeface with Flourishes”. So you could expect it to be very durable in small sizes, for extended reading, and it has the right amount of style to be used in magazines. </p>
      <p>I must say I think pairing it with Formata is inspired. For alternatives try Underware’s own Auto, or Quadraat Sans, which also is animated like Dolly.</p>
