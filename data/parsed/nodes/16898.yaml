      <p>Check the crit thread/logo and i.d. and look for small gallery mark post.</p>
      <p>I’m going this direction with a small university gallery, largely because they need something good for wall text. Here’s my short take on Dolly. It is very legible but also really versatile. The SC has a little different flavor than the Roman. The ital a little different than the roman. The bold, very sweet, but again the range of possible uses is very large.</p>
      <p>I’ve paired it with Formata, which has a very different x-height but fills in for tiny text etc. I’m using the combination to provide different looks for different shows, but all within this marriage of the two families. Working well so far. I have some super rough examples posted in the mentioned thread that will give you some idea.</p>
      <p><a href="http://typophile.com/node/16675" title="http://typophile.com/node/16675">http://typophile.com/node/16675</a></p>
      <p>Cheers</p>
