      <p>Christian, </p>
      <p>See <a href="http://typophile.com/wiki/Contrast">this</a> wiki node for a nice definition of contrast in the context of typography. </p>
      <p>Darkness is an appropriate term for the effect you describe. Some faces (digital Centaur, ITC Garamond) appear lighter and some (Dante, FF Clifford) look darker. It’s one of many factors affecting the appearance and readability of a typeface. Poke around in the wiki for more. </p>
      <p>There is always some disagreement about the necessity for bold italic and for small caps with Italic faces. I think opinions typically differ between graphic designers and book designers.</p>
