      <p>I agree with seb - the overall feel is really beautiful, interesting and lively. It's not terribly legible, however. My first take was "Ruebs." I think the Q needs more work to read correctly - it's too small to be an uppercase letter. Have you tried a lowercase q? </p>
      <p>Maybe the "po" wouldn't read as an uppercase "B" if the whipped peak on the o wasn't reaching up to touch the bowl of the p? It's beautiful, but as it is, detracts from the readability and legibility.</p>
