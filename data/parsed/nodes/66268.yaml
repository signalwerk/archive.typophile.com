      <p>BTW, one interesting advantage of uniwidth* fonts like the ones in Daam Entity for animated text is that you can swap (or wait, morph!) the fonts in the system without affecting how they sit within the body of text.</p>
      <p>* Where a given character has the same set-width in all the fonts.</p>
