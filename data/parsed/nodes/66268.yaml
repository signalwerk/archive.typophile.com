    <p>Hi everybody, </p>
    <p>I am currently working on a Kinetic Typography project. I have to animate the lyrics of a song. The one I chose was ... Rob Zombie - Two Lane Blacktop, because I recently watched the movie by the same name.</p>
    <p>If you've heard the song, you would know that, it is a very "in your face" track. I wanted to ask what kind of a typeface would go with it? ... I don't want to use "decorative fonts", and when I use Helvetica, DIN, Avant Garde, Rockwell etc. they seem to be very neutral, or just inappropriate.</p>
    <p>Here's the kind of stuff I've done earlier this year:<br>
    <a href="http://www.vimeo.com/user2388063" title="http://www.vimeo.com/user2388063">http://www.vimeo.com/user2388063</a></p>
    <p>Thanks,<br>
    Sumit</p>
  html_clean: |-
