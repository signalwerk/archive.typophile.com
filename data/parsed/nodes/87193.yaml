      <p>i personally wouldn't have done the typography like that.<br>
      I created this flier, but the client was directing where he<br>
      wanted everything placed at.<br>
      he was just going off what he thought looked good, rather<br>
      than typical typographic thinking.<br>
      I don't think the flier turned out bad. We got it printed,<br>
      and it looks decent looking.<br>
      I feel the typographic layout can be more logical,<br>
      and the hierarchy clearer.<br>
      What do you guys think?</p>
