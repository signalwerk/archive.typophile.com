      <p>a few things bother me - is it kids clothing?</p>
      <p>the panda and balloon concept tells me this - but the panda looks bored?</p>
      <p>if it's a kids thing - why the snake in the background?</p>
      <p>why the "boring" colours?</p>
      <p>rather than having a "brand release party" you should have had a "crfty party" to celebrate the launch.</p>
      <p>the typography and layout is very asian - the QR? barcode thing looks like a chinese japanese character and i expect the rest of the info to be not in english</p>
