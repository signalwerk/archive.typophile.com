  html: <p>Hello and sorry or my bad English. I have a huge problem. I'm working on a logo. Whenever I want to create outlines in Illustrator the fonts are getting bolder and are ruining the design. Is there a solution for this? Thank you very very much!</p>
  html_clean: <p>Hello and sorry or my bad English. I have a huge problem. I'm working on a logo. Whenever I want to create outlines in Illustrator the fonts are getting bolder and are ruining the design. Is there a solution for this? Thank you very very much!</p>
