    html: <p>Drawing programs like Illustrator and CorelDraw render vector artwork differently from the way they render text, and type always appears heavier when converted to outlines (in my experience). Either choose a lighter weight of the typeface, or add a white stroke to your converted outlines.</p>
    html_clean: <p>Drawing programs like Illustrator and CorelDraw render vector artwork differently from the way they render text, and type always appears heavier when converted to outlines (in my experience). Either choose a lighter weight of the typeface, or add a white stroke to your converted outlines.</p>
