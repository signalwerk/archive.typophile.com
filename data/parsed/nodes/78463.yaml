    html: <p>Are you converting a TrueType font to outlines? I have had some (understandably) bad experiences converting the curves in TrueType fonts to Postscript outlines in Illustrator. You can always try putting the type in one color on one layer, the outlines on a higher layer in a different color, and then adjust the outlines to match the type.</p>
