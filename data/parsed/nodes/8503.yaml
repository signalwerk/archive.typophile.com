  - id: 56225
    user: 2088
    date: 2005-01-06T13:19:00
    date_raw: 6 Jan 2005 — 1:19pm
    votes: null
    html: <p>As far as I know Lys Calligraph is the proper name for the typeface, as that is the name in both the Solotype Catalog and the Phil's Photo book. Lorrenne was the NovelFonts digitization, and I can't find any site that carries anything more than one or two isolated NovelFonts any more.  Lysandria is circulating as freeware at a number of sites, but you will need to find them on your own because they have other questionable fonts at some of these sites. Sisman is apparently one of the David Rakowski scanned fonts, originally offered as freeware, now being sold by Intecsas. <br> <br>It was a photo-type that exists now in several digitizations. <a href="https://web.archive.org/web/20141113000317/http://www.typophile.com/forums/messages/83/53345.html?1100186835" target="_blank">This thread</a> in November had more information.</p>
    html_clean: <p>As far as I know Lys Calligraph is the proper name for the typeface, as that is the name in both the Solotype Catalog and the Phil's Photo book. Lorrenne was the NovelFonts digitization, and I can't find any site that carries anything more than one or two isolated NovelFonts any more.  Lysandria is circulating as freeware at a number of sites, but you will need to find them on your own because they have other questionable fonts at some of these sites. Sisman is apparently one of the David Rakowski scanned fonts, originally offered as freeware, now being sold by Intecsas. <br> <br>It was a photo-type that exists now in several digitizations. <a href="https://web.archive.org/web/20141113000317/http://www.typophile.com/forums/messages/83/53345.html?1100186835" target="_blank" class="link-lost">This thread</a> in November had more information.</p>
