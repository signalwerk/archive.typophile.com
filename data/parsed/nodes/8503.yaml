    html: <p>I believe  <a href="https://web.archive.org/web/20141113000317/http://www.faces.co.uk/products/fonts/view.cfm?productsku=IN10136" target="_blank">this</a> font, here called Sisman, is what you're looking for. It's also called Lys Calligraph, Lysandria, Windsor Sword (you can buy it also <a href="https://web.archive.org/web/20141113000317/http://www.qbf.de/dceng.htm" target="_blank">here</a> but not sure if it's Mac or PC).</p>
