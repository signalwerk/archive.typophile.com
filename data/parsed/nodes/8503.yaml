    html: <p>It's tempting to agree with you, but who do you know that wants the job? Considering the number of versions floating around, even with wrong names, does the world really need another one? <br> <br>If someone was able to do something like ligatures and alternate characters, that might make it worthwhile as a font purchase.  I see Dan Solo is back in the font making business. Do you think he would want to do it?</p>
