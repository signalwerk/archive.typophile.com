      <p>You should have access to Pantone books somwhere at your uni/learning institution. Not only does this make it easier to choose colours which work well together, but specifying pantone colours also means you are more likely to have the printed and finished product come out with the colours you intended. You need to use the right guide for the media you are printing on (coated or uncoated stock).</p>
      <p>I think it looks really good - and even though there are less colours in the second pdf you posted, I actually preferred the first one; something about the green NER which doesn't come through with it in pink. I think perhaps it is that the DEMO, in the second poster, becomes the only one of the large words to have its own colour - it already stands out much more by being white and being larger than the rest. This isn't necessarily a bad thing; it may be useful for what the poster is communicating (unfortunately I don't understand it).</p>
      <p>I definitely like it though</p>
      <p>-Rafe</p>
