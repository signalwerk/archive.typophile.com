    <p>I’m in a Design 1 class where we were set the task of designing a poster.</p>
    <p>A specific list of words that must be included was provided, and we were given the rule that we may use simple colours to create effects/contrast, but nothing else. No graphics (I cheated a tiny bit there), no gradients, only one font family. If anyone cares to provide some feedback (please, be harsh, down to the minutest detail—I’m new, I need to learn), I should be very grateful.</p>
    <p><a href="http://qvenon.com/files/opg_6_janus.pdf" rel="nofollow">Link to PDF version</a></p>
