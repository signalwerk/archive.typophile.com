    html: <p>Rafe said it with the pantone stuff. It is good to  take a look at all the color possibilities you have. The second one is the only option obviously, it's stunning. As far as which two colours, that's really your decision. I would definitely find a pantone book if you can. Because it is beginning the teacher most likely wont mark you down for having more colors, but he will probably enjoy you going for less just because it is much cheaper and more efficient in the printing world. to make it three colour (say a blue yellow and green) with key(black) would actually reduce it by two colours as long as you have the yellow and blue mixing to make a green. You obviously seem very interested in this so ask your teacher for a few pointers in regards to what we talked about.</p>
