      <p>I don't think a geometric typeface is a good choice on this part of the body. Keep in mind that your belly will change over the years, it's kind of unavoidable. And a distorted Futura will look horrible. Plus, it's really, very hard to make perfect rounds with such thin lines on skin, and there is always a possibility for the ink to spread a little... Consider choosing a typeface that will aesthetically handle this kind of problem. Also, the quote says that wise people are also a little crazy - imho, Futura is really not the best choice for the idea. At last, the line seem pointless and 80's, and the name of the author is, again imho, useless.</p>
      <p>... mais bon, ceci etant dit, c'est ton corps, hein... bon courage a toi et au tatoueur.</p>
      <p>david</p>
