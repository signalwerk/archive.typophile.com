    html: |-
      <p>I've been pondering about getting a type tattoo for a while as well and I'd just like to point out that tattooing isn't a very exact art-form. The little details that make the letterform can easily disappear, no matter how experienced and/or talented the tattoo artist might be. Skin stretches and while the letters might look good with your arm in a certain position, it will probably look (very) warped when you move around. Also the above mentioned blurring of tattoos may cause problems, especially with such thin lines.</p>
      <p>Type tattoos can be cool, but it's important to keep in mind that tattoo artists are not typographers and skin isn't a piece of paper. A tattoo can never be a perfect copy of your design and vector-sharp edges will blur with time. When I was designing my own tattoo, I had some unrealistic expectations on how the result should turn out. After talking to various tattoo artists, I came to accept the fact that I can't have complete control over the tattooing process. One of the studios I visited actually had a sign on the front door stating that they won't make tattoos for graphic designers – I don't know exactly why, but I think it has something to do with the fact that perfectionists and control-freaks are notoriously hard to work with ;)</p>
      <p>Just my two cent's worth.</p>
