      <p><cite>IMO, the diagonal line will date quickly, but the layout and type choice is good and classic, so will last well.</cite></p>
      <p>I agree with Nick. (I like the quote, too.) </p>
      <p>Just be aware that it <em>is</em> tempting fate/life to get large, light, geometric letters tattooed on a uh, morphable area of the body. It makes for a very nice texture; but make sure you're comfortable with the fact that even if you don't gain weight, it won't always look like it does in your nice mockups but will sag and wrinkle. Skin gets old and looser, and tattoos get lighter and blurrier. If you're fine with that, good.<br>
      That said, I would consider making the name bigger, and/or looser (in terms of spacing). In the layout it looks good in terms of proportion, but it might just be too small/dense/detailed for skin.<br>
      Also, please get a tattoo artist who really knows what they're doing.</p>
