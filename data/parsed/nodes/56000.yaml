      <p>The glass of water thing in Briem is seriously misleading if you take it too seriously. Looking visually equal and actually being equal in area are two different things. I've tested it by measuring inter-letter areas between nn and oo on well-spaced type. They're not mathematically equal, even though they look nicely balanced. </p>
      <p>As well as visual equality of inter-letter space, making the outer space proportional to inner counter space, keeping adjacent parts from visually crowding, keeping a (not exact) regular rhythm of verticals and white, and even adjusting for weight of strokes--left vs right side of M--are all things to consider and weigh. And they are sometimes in conflict with one another. </p>
      <p>I certainly don't claim to know the ideal way to balance all these. Then again there may not be any ideal, but various compromises. </p>
      <p>Oh, and it does change with optical size. Further, the tightening of display vs text is probably best not simply tracking tighter. The oo and ll may work a little differently--at least that's Slimbach's view.</p>
