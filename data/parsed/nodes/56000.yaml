      <p>Could it be that there is a very simple technical explanation/reason for larger sidings in small type vs smaller in larger type? Eg the fact that there is a lot more wear and tear on the parts of metal type that are close the the edge?</p>
      <p>I imagine a natural process having taken place where the typecasters explored this and came to the evident conclusion that there is a minimum amount of sidebearing needed to keep type in good shape (at least for a period long enough…).</p>
      <p>Readers would of course become accustomed to this and notice discrepancies from this practice, making it kind of obligatory to continue, even after we left metal type behind.</p>
      <p> . . .<br>
      Bert Vanderveen BNO</p>
