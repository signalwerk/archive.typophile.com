      <p>I teach the glass of water, because it is the best way to explain how basic sidebearing width works, and for students to get their fonts to space nicely.<br>
      I use O, I, and V in Futura as examples.<br>
      (Admittedly, this is somewhat device-dependant, as Karsten has noted.)</p>
      <p>However, in theory I believe that the perceptual process of reading is multiplex, and that they eye is aware of not only the area of positive and negative space, but the weight of strokes and, as Hrant notes, proximity, or the distance between elements. There is also the issue of scalar versus absolute relationships, the quality of sharpness and the shape of curves. And there are of course visual dimensions of design that we are not aware of and cannot express.</p>
      <p>The reader's eye sees all these different raw visual qualities, and the brain synthesizes meaning.</p>
