      <p>As promised, here's Jost Hochuli's alternative to water, light. It's actually not half as exciting as I thought I remembered – I should have quoted it a few hours ago, considering how far this thread has taken us from when I first mentioned this!</p>
      <p>This is from "Detail in Typography" (1989); my library only has the German edition, so here's my wobbly and definitely unquoteable translation:<br>
      [First he goes on talking about the importance of making everything evenly grey with no "holes"]… "Even though the spaces between the lettershapes are not [mathematically] equal, a well spaced word looks even; so this can not be about equal space in terms of areas of space. If we replace the term "space" by the term "light", everything becomes a lot easier, and we can do without unclear terminology…<br>
      The light – the lightness of the letters' environment, the ground – flows into the counters and the spaces between the lettres from above and below; the light that comes from above is more active than the light from below. This brings about the fact that the letter "n" in a sans serif needs to be a bit wider than the "u" in the same font if they are meant to appear to be the same width optically. In much the same way, the area between "I" and "A" needs to be less than that between "I" and "V" (assuming the same angles on the "A" and the "V"…). This phenomenon cannot be accounted for with the theory of equal areas of space, but very much so with the theory of equal light."</p>
      <p>I should add this is a tiny book for students/novices. I haven't read anything "bigger" by him.</p>
