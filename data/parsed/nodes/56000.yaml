      <p>Nina, the passage from my Typo #13 text you quote above is about design, more specifically, what I call role-architectures, or construction. “Perceptual distances between letterforms must be great enough to minimize criterial cue confusions or masking. But not be so large that cross-letter binding or constructive conjunction is inhibited.” Perceptual distance is a cognitive psychology term for how dissimilar or similar letters are. Hrant did some really nice work on this years ago.</p>
      <p>Perceptual distances are calculated from letter confusion matrices, which are experimentally derived. For example an a and an e are more often confused than an a and an m, so the perceptual distance between a and m is greater than between a and e. Herman Bouma did some nice charting of perceptual distances that corresponds nicely with Hrant's chart of similars and modulars.</p>
      <p>My comment on spacing follows the passage you quoted. I say: “If spacing between letterforms is not in synchronicity with the space inside enclosed forms—with the way the letterform set uses its cartesian space—there are computation costs at the visual cortex level, because the saliencies can’t compound effectively--the ‘saliency maps’ are thrown off. Configural cues become harder to assemble. Conjunctivities are weakened. The wholistic response bias compromised. So “space craft” facilitates effortless perceptual processing.</p>
      <p>I see one factor relating to spacing, and three that relate to scaling for small sizes. For spacing, the blacks must be in step and the whites in synch in spatial frequency terms; for small sizes, perceptual discrimination affordance to the role-unit and evoked-form level must be intact, the ink-spread factor must be accommodated and the dependence of vision on the white must be kept in mind. </p>
      <p>Bear in mind that ‘in step’ and ‘in synch’ are not mathematically quantifiable. In step is not equidistant and in synch is not equivalent in area. I try to think in terms of rhythmic cohesion with the whites, and narrow but not exact phase alignment with the blacks. Fourier transforms, I believe, can gauge this. The method Berlow describes is a way toward achieving it.</p>
      <p>Perceptual discrimination affordance is the visual cortex being able to make out what something, for example a letter-part, is. There are size, crowding, and acuity thresholds here. Making out what a letter-part is means resolving marks into shapes the visual cortex knows. I call this process of resolving ‘quantization.’ Quantization underlies categorical perception, the psychological term for ‘seeing as.’ Seeing a d as a d for instance.</p>
      <p>In relation to the dependence of vision on the white, bear in mind that vision uses reflected light, and the black does not reflect, so if the white is overwhelmed by the black, the fundaments of readability — perceptual discrimination affordance, quantization, categorical perception and rapid automatic visual wordform resolution — all suffer.</p>
