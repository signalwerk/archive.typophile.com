      OK, here comes the big disclaimer: Yes, I was thinking about text vs. small text. But to be honest, I wasn't strictly "looking" at anything – more drawing from what I'm used to seeing. I'll gladly go and see if I can find examples to illustrate this.</p>
      <p>Though now I'm wondering if a lot of what I have been seeing is not actually the proper way of doing things, as I'm probably somewhat used to seeing text set at less than the intended point size, and tracked out (hell, they taught us that at school, too). But the interesting thing is, that still is more readable then than when it's not tracked out (and the counters vs. spacing ratio stays the same). And the opposite – a really wide font for small text that's spaced tight – is definitely not going to be easily readable. Which brings up the question if inter-letter spacing is by definition more of a deciding factor for readability than the space inside the letters.</p>
      <p>***</p>
      <p>William, thank you for this thoughtful post! FWIW, of course my interest in spacing has been triggered anew by thinking about spacing my font; so this list of criteria you posted seems most helpful in a practical way too.</p>
