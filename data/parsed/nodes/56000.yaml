      <p>Nina, Yes, generally, larger type needs less interletter spacing. Other things occur along with the visual mass concept (glass of water theory expanded to include perceptual bias). A big factor is proximity of nearest segment--meaning a serif on a cap V being near a Serif on a cap W.  When the two are quite close, the proximity factor begins to overcome part of the visual mass of space issue. It is often impossible to have a space as those between upright adjacent letters like H and N be truly equal to adjacent opposing diagonals like V and Y unless you vastly letterspace. Using the proximity effect minimizes the perceived difference though.</p>
      <p>ChrisL</p>
