      <p>Nina, the sound of a car engine at the source is a given pitch and does not change. Sound moving through an air mass with dense atmosphere can alter what hits your ear some distance away but does not truly change the source of the sound (the car engine). Granted, I am making a metaphoric comparison, not a scientific one--so far, none exists. The ratio of letterspace to glyph does not change in reality but it appears to. Since the eye is always the final arbiter, we have to appease then not a measuring device. There may come a day when science has a more measurable reason for the difference and can predict the proper distance of change but it is just easier to make your change visually. Take a font designed for text reading and another for display from the same family and scale them to the same size. You will see the difference but you may not find a ratio of change that suits all families of type.</p>
      <p>ChrisL</p>
