      <p>Nina --</p>
      <p>For your consideration (and without any analysis or conclusions from me), here are examples of fitting sequences taken from the Advance Proofs for two different sizes of Dwiggins's Falcon, scaled to equivalence. The upper sample is 10 point; the one beneath is 6 point.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Falcon10_lcspacing_5162.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Falcon06_lcspacing_5675.png"></div><p></p>
      <p>&nbsp;<br>
      An Advance Proof was a standardized final proof that was made by Mergenthaler Linotype for each font of new type before the matrices were passed for stock and released to the trade. One portion of the proof was devoted to checking the fitting intervals and base alignments and consisted of each character in the alphabet alternating between a "square" and a "round" letter (i.e., H &amp; O for capitals and m &amp; o for lowercase).</p>
      <p>So, this offers an excellent opportunity for us to peer into the kinds of adjustment that were being applied in terms of spacing and proportions, at least in the Linotype approach (ca. 1950s). Griffith &amp; co. prided themselves on carefully adjusted individual drawings for each character of each size, not mere geometric or photographic "blowing up" or "blowing down."</p>
      <p>BTW, Griffith is quoted as expressing that he felt the Falcon series represented "an almost perfect proportional curve to the eye." (See Walter Tracy's <cite>Letters of Credit</cite>, page 53 for further discussion of this.)</p>
