      <p>"And I wasn’t looking for numbers (how much to adjust it by, or something)"<br>
      Following, Briem’s page on spacing you always have the type you are employing to guide you. So, if you are composing type, and you want to see what tracking works, and how the glasses of water are equalized, set a line like iiiniii in the face you are spacing, or IIIHIII if caps, (the i's and l's have 'no water inside' and the n or H show you the how the average inside space relates). With tracking you can adjust this text sample so that the space between i's and the counter of the n are even, or as I and many others prefer, with slightly less space outside than in. Then, you can apply this tracking to broader text.</p>
      <p>"I post “tracking” when I want to follow a thread so it “bookmarks” it in my account settings."<br>
      ...but like so many things we are all free to do, if we all did this...</p>
      <p>Cheers!</p>
