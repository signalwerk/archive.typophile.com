    html: |-
      <p>What you are seeing is the result of how the Fonts Window displays glyphs. That the glyphs have apparently been moved up in this display will most likely be the result of how the metrics are set up, specifically the ascender and descender measurements relative to the overall size of the glyph.</p>
      <p>From your screenshot the descender is currently set to -300 and the glyph itself seems to reach a height of 1000, which in a font with a UPM of 1000 would be 300 more than the standard ascender height (which should equal 1000). As the ascender height is not visible in the glyph window this would indicate that it might be even higher than 1000, which could distort things further. Inconsistent metrics may cause problems when using the font in some applications, as such you could look at compensating for this by reducing the size of the glyphs and correcting the metrics relative to the UPM or you could expand the UPM and then check the relative metrics.</p>
      <p>Karsten Luecke's <a class="freelinking external" href="http://www.kltf.de/downloads/FontMetrics-kltf.pdf" rel="nofollow">guide to font metrics</a> (this may trigger an automatic download depending on your browser) is a very useful guide for understanding this.</p>
      <p>If you can provide screenshots of the following windows for the font I might be able to suggest relevant adjustments:</p>
      <p>Font Info&gt;Metrics and Dimensions<br>
      Font Info&gt;Metrics and Dimensions&gt;Key Dimensions<br>
      Font Info&gt;Metrics and Dimensions&gt;TrueType-specific metrics</p>
