      <p>Based on the metrics information in your screen grabs I would recommend rationalising the metrics either to the existing 1000 UPM setting or moving to a 2000/2048 UPM setting in line with generating a Windows TrueType or OpenType-TrueType font. It looks like the Key Dimensions are based on a TrueType metrics set-up which may mean that you have FontLab set-up to convert fonts to 1000 UPM when they are opened (Preferences&gt;Opening OpenType &amp; TrueType - "Scale the font to 1000 UPM" tick box).</p>
      <p>I would recommend updating the metrics overall before generating the final font as you may encounter problems with some applications otherwise.</p>
