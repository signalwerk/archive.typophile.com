    html: |-
      <p>Looking at the current settings it looks like the computer key shape was aligned to the x-height of the font (1004). With that in mind you could consider amending the metrics as below:</p>
      <p><strong>Font Info &gt; Metrics and Dimensions</strong><br>
      Change the UPM size to 2000.</p>
      <p><strong>Font Info &gt; Metrics and Dimensions &gt; Key Dimensions</strong><br>
      Change the fields as follows:<br>
      Ascender: 1800<br>
      Descender: -200<br>
      Caps height: 1708 (unchanged)<br>
      x height: 1004 (unchanged)</p>
      <p><strong>Font Info &gt; Metrics and Dimensions &gt; TrueType-specific metrics</strong><br>
      Change the fields as follows:<br>
      TypoAscender: 1800<br>
      TypoDescender: -200<br>
      TypeLineGap: 0<br>
      WinAscent: 1800<br>
      WinDescent: -200</p>
      <p>Ascender: 1800<br>
      Descender: -200<br>
      LineGap: 0</p>
      <p>This is just a suggestion but this would optimise your metrics if you are generating a TrueType font. If you would prefer to generate an OpenType Postscript font with a 1000 UPM set-up you could try the following:</p>
      <p><strong>Font Info &gt; Metrics and Dimensions</strong><br>
      Leave the font's UPM size as 1000.</p>
      <p><strong>Font Info &gt; Metrics and Dimensions &gt; Key Dimensions</strong><br>
      Change the fields as follows:<br>
      Ascender: 1000<br>
      Descender: 0<br>
      Caps height: 800<br>
      x height: 500</p>
      <p><strong>Font Info &gt; Metrics and Dimensions &gt; TrueType-specific metrics</strong><br>
      Change the fields as follows:<br>
      TypoAscender: 1000<br>
      TypoDescender: 0<br>
      TypeLineGap: 200<br>
      WinAscent: 1100<br>
      WinDescent: -100</p>
      <p>Ascender: 1100<br>
      Descender: -100<br>
      LineGap: 0</p>
      <p>These settings will satisfy FontLab's requirements and hopefully satisfy most applications that require standardised metrics settings, though others may have better suggestions.</p>
