    <p>This is Global Sans<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Fullscreen capture 1182011 94720 PM_6426.jpg"></div><br>
    I'm a little worried about weight distribution within a letter and in relation to other letters, I thought I had the lowercase figured out but I keep sensing inconsistencies.<br>
    I'm trying to get the best spacing possible without any kerning, of course I only realized what a disaster spacing is at the moment when I generated the OTF :D <p></p>
    <p>So just as a background this evolved from sketches of letterforms, I was kinda studying how to build a sans serif rather than write it. The closest letters now to the early sketches are a, e and t and I hope all the others match them. Also it had a short life as a custom typeface for a not-for-profit here in Toronto. It was going to be used in Power Point and Word this is why I'm using straight lines whenever possible (I have the impression that this gives consistent digital rendering as opposed to subtle curves, but I don't know if that's even true) </p>
    <p>So any feedback on the issues mentioned above, please bring it on. But also any suggestions on letter shapes and if there's any inconsistency there I'm glad to hear it.</p>
    <p>Thank you.</p>
