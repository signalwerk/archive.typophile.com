    html: <p>Can't find a perfect match and really doubt there's one actually, commercially available speaking. As almost all the time for the fashion industry, they probably here too use bespoke typefaces which makes perfectly sense when your business tries to evoke luxury, uniqueness and fashion. This one is somehow similar to <a href="http://www.myfonts.com/search/engravers+gothic/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Engravers Gothic</a>/<a href="http://www.myfonts.com/search/blair/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Blair</a>/<a href="http://www.myfonts.com/search/sackers+gothic/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Sackers Gothic</a>, slightly wider. With some little alterations, you could do pretty much the same with <a href="http://www.myfonts.com/fonts/marksimonson/proxima-nova" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Proxima Nova MS</a>, <a href="http://www.typography.com/fonts/gotham/overview" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Gotham HTF</a>, <a href="http://www.myfonts.com/fonts/gautier/maax" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Maax 205</a>, <a href="http://www.myfonts.com/fonts/font-fabric/nexa" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Nexa FFF</a>, <a href="http://www.myfonts.com/fonts/glen-jan/room" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Room GJ</a> or even <a href="http://www.myfonts.com/search/avenir" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Avenir</a> (more work here).</p>
