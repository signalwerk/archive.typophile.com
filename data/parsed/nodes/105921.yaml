    html: <p>OK, I see know some differences with Bal10. Overall design is close but some details remain off though. May be they simply started with Bal10 and created some kind of Bal10 Extended Bold version of it. Main logo is extended, /E middle bar is upper and shorter and /G middle bar is downer which actually are not hard to reproduce. Bests remain definitely Engravers Gothic Bold and Sackers Gothic Heavy. I'd probably start with Sackers (more balance than Engravers) and mainly make it bolder.</p>
