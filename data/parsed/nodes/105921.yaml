      <p>Hello,</p>
      <p>If I may clarify this a little bit:<br>
      The logotype is a bespoke design created by Julien Gallico, the art director responsible for the new Balenciaga identity. We had no hand in it at all. He commissioned us to create a new typeface for this identity. While they certainly share a similar esthetic (that was the goal!), the logo and the typeface are not directly derived from each other. The typeface is a sort of spin-off (I'm not going to say custom since it often means quickly changing a few letters) of our typeface U8, which we transformed under his art direction.</p>
      <p>As far as we know, the typeface has not been used very much yet. We expected it to be used for little prints on labels and things like that, the webfont was not planned (hence the rather poor rendering in your screenshot), but we are glad they embrace the design even for their website.</p>
