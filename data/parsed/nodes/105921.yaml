    html: <p>Can't find a perfect match and really doubt there's one actually, commercially available speaking. As almost all the time for the fashion industry, they probably here too use bespoke typefaces which makes perfectly sense when your business tries to evoke luxury, uniqueness and fashion. This one is somehow similar to <a class="freelinking external" href="http://www.myfonts.com/search/engravers+gothic/" rel="nofollow">Engravers Gothic</a>/<a class="freelinking external" href="http://www.myfonts.com/search/blair/" rel="nofollow">Blair</a>/<a class="freelinking external" href="http://www.myfonts.com/search/sackers+gothic/" rel="nofollow">Sackers Gothic</a>, slightly wider. With some little alterations, you could do pretty much the same with <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/proxima-nova" rel="nofollow">Proxima Nova MS</a>, <a class="freelinking external" href="http://www.typography.com/fonts/gotham/overview" rel="nofollow">Gotham HTF</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/gautier/maax" rel="nofollow">Maax 205</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/font-fabric/nexa" rel="nofollow">Nexa FFF</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/glen-jan/room" rel="nofollow">Room GJ</a> or even <a class="freelinking external" href="http://www.myfonts.com/search/avenir" rel="nofollow">Avenir</a> (more work here).</p>
