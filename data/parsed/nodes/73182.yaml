    <p>Hello there!</p>
    <p>It seems the <a class="freelinking external" href="http://www.istockphoto.com/" rel="nofollow">iStockphoto website</a> went through a major overhaul recently, and their large homepage ads feature an elegant, geometric, light-weight (slab serif?) font that I simply adore. Below is a screencap of one of the ads for convenience. I thought it might be <a class="freelinking external" href="http://www.sudtipos.com/fonts/134" rel="nofollow">Inlove</a> by Sudtipos, or a modification thereof, but now I'm not sure. </p>
    <p>Any thoughts are appreciated.</p>
    <p>Thanks,<br>
    Codi</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/istock_type_4939.gif"></div><p></p>
