    <p>I'm looking for something similar to what Smythson (the British stationer) calls their "George Street lettering." Identifont comes up with Weiss, but that doesn't have the curly tail on the R or the angled serifs on the M. One image below, more at <a href="http://www.smythson.com/SmythsonSite/category/Stationery%5FPersonalised+Stationery%5FView+All/" rel="nofollow"> their web site.</a></p>
    <p>Thanks in advance!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/name-address-cards-detail.jpg"></div><p></p>
