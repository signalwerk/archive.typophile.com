      <p>Before we get to the letterspacing, do reconsider the font choice: Helvetica is a staple of large nasty corporations, and everybody knows it (or at least feels it); are you sure you want it for a tree company? Actually even if it's a large nasty corporation, since you wouldn't want to let that on! Unless you're being a sneaky conscientious designer.  :-)</p>
      <p>And that "a"... yuk. Gag me with a pinecone.</p>
      <p>hhp</p>
