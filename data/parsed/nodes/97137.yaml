  - id: 526155
    user: 201547
    date: 2012-10-12T16:11:00
    date_raw: 12 Oct 2012 — 4:11pm
    votes: null
    html: <p>Less space between the r and the e and a hair more between the double e. Maybe try slightly less traditional colors to offset the use of the traditional font. Green and brown for the tree biz is kind of cliché. If you're going helvetica and geometric, look at some of the classic swiss design. The very obvious T + A = a tree combo needs to be countered with something a little less expected.</p>
