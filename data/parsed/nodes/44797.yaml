  html: |-
    <p>There was a <a class="freelinking external" href="http://typophile.com/node/31345" rel="nofollow">similar thread</a> to this previously, but it referenced appearance of black in PDF (on monitor) and did not address my particular problem:</p>
    <p>In InDesign, my type is set to [Black]. When I print directly from ID, only black ink is used. When I export to PDF and then print, type is printed in CMYK rich black. I don't want this. (Oddly, 50% tint of [Black] prints with color, but 50% opacity of [Black] uses only black ink. A gradient from 100% [Black] to [Paper] uses only black ink.)</p>
    <p>I have already adjusted my "appearance of black" options to not view or output as rich black, instead to output blacks accurately. I have tried various combinations of PDF export options, using No Color Conversion and different settings with the profiles. I've tried changing my color settings as well, using various Color Management options... this makes no difference.</p>
    <p>Clearly something in the process of exporting to PDF is overriding what I want. What am I missing?? I'm going CRAZY.</p>
    <p>Thanks!</p>
