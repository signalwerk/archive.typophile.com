      <p>Very nice work, Vedran. Just a couple of things:</p>
      <p>1. printing in two colors, of course, will cost you more - by the way, I haven't understood if the book is only aimed to standard readers or if the actors will actually use it for rehearsal?</p>
      <p>2. in the text layout - which is very well done - put more than one space (three white spaces should work) between the character's name and the beginning of his/her dialogue (eg. TIANA I tako je Huck...) This is a standard setting in plays book.</p>
      <p>By the way, which size is the text set in?</p>
      <p>Hope this helps,<br>
      Nicola</p>
