    <p>Hello!</p>
    <p>This is my first post, so I apologize if I miss some typophile-related etiquette. :)</p>
    <p>Anyways, I need to design a book of eight theater plays. They are adaptations of kids' classics like Mary Poppins, Robin Hood, Adventures of Huckleberry Finn and the like by a croatian author. However, the book is not targeted (only) towards kids, but to anyone interested in making these plays come to life---actors, directors, etc---and friends of a local town theater these plays originate from. The editor would like for the book to be as inviting as possible to read.</p>
    <p>Plays are cheerful in tone and have a bit of a rural and/or 'retro' feeling to them. There is a subtle environmentalistic message which expands through all of the plays in the book.</p>
    <p>I chose somewhat traditional, or classic, layout for the book, because of the classic character of the plays. One font for the whole book---Adobe Caslon Pro---for its cheerful (and retro) character. It will be 13,5cm x 21,5 cm, so it should be easily handholdable and it'll be printed on recycled cream toned paper. I chose this type of paper because of the environmental overtones and also cream-toned paper should be more pleasant to read.</p>
    <p>Since plays have very few paragraphs in a traditional sense, there were many cases of single lines (how do you call them -- orphans, widows?) going to the next page. This called for a flexible lower margins -- every now and then, I had to expand the text box a leading. This is the prime reason I put page numbering on the outside margins. If they were in the lower marging, that 'breathing' text box would be much more perceivable. Also, when working on a play, people often have to search for their line in the script and I think that page numbering right above the thumb of the reader is easier to track when in hurry.</p>
    <p>Character names are in red because actors from this local theater often underline their character names. This makes for a nice contrast between blue or black pen strokes if they want to do that. It also gives a bit more depth and a sense of uniqueness to the text.</p>
    <p>So, what do you think? Do you have some suggestions? Do you think that two ink colours are a bit too chaotic? Are inner margins a too large? Maybe something else doesn't seem right? I'd very much like to hear your critique since this is my first try at book designing in a more traditional sense.</p>
    <p>Also, you'll have to excuse my English, I'm not a native speaker and the book itself is in Croatian so chances are you won't understand a word. O:)</p>
    <p>Thanks,<br>
    Vedran</p>
    <p>P.S. Gray rectangles are places for the illustrations -- this book is stil a work in progress.</p>
