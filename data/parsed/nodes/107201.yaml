      <p>How is this going to be bound?  If it is perfect bound (a paperback book) the inner margins may be too small, particularly on the right hand (odd number) pages. The character names may disappear into the gutter, the binding of the book. Having enough inner margin is important.</p>
      <p>Why is the right inner margin different than the left inner margin? This would not be my choice.</p>
      <p>I would put the page numbers where the audience expects them to be.</p>
      <p>There is not much advantage to having the names in red, since the names are already differentiated by small caps and by indenting. The red looks okay, but maybe it's not necessary.</p>
      <p>I do not look at books of plays very often, but these are my opinions.</p>
