      <p>Vedran:</p>
      <p>1. Hardcover vs softcover: here in Italy, an hardcover binding is still  *much* more expensive than a softcover one. Also, if the book must be kept in hand by actors, it should be easily handy, and in this case a softcover book could be preferable. It is also true that an hardcover book will look more "classical". As a sidenote, a very nice hardcover binding is the "Bodonian", where the open spread pages really lie flat. And yes, binding must be sewn.</p>
      <p>2. If illustrations must be printed in colors, and they are just 8 on a total of +400 pages, consider the possibility to print in four colors just the 8 sixtodecimos where the illustrations appear (in this case, you will have to set  the characters' name in black, keep the illustrations in color, and thus reduce the total cost of printing while mantaining the colors in the drawings).</p>
      <p>3. Another factor to consider with the client and the printer is the quality of the paper - if you choose the right one (a cream uncoated one is the first that comes to mind for this project) the book will gain in quality. And if you want to keep it small enough and portable, look for the right grammage - the printer could set up a mock up of the book before printing it.</p>
      <p>Hope this helps,<br>
      N</p>
