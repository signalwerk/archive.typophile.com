      <p>Stephan Kurz; your croatian is quite good! Do you have some relatives here or know someone from Croatia? :)</p>
      <p>There is a problem with book length -- it's almost 450 pages long and the editor insists on smalller format. I tried to keep the text as dense as possible and still retain the 'open' feel. If the book were thicker, I'm afraid it would look bulky and heavy and uninviting to easily intimidated croatian readers. I'll try putting an extra point of leading and see how it will affect the number of pages.</p>
      <p>You have a good point on page numbering. I'll definitely try putting them on the foot of the page. This could bypass the 'breathing text box' problem while retaining traditional layout.</p>
      <p>I also print out my layout and cut them to size but I never got my mind to putting it in an existing book! That's a great trick -- thanks!</p>
      <p>The text is still not completely proofed and I'm sure the editor will adress the quotes and similar mistakes.</p>
      <p>Thanks again! :)</p>
