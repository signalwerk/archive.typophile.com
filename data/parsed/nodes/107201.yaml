      <p>Thank you for your feedback!</p>
      <p>nicolacaleffi; I pointed out to the client that printing in two colours will cost more, but they don't seem to have a problem with that. On the other hand, there is a cost problem with hardcover vs. paperback binding. Do you think that setting text in one colour would be that much cheaper to allow the clients to go for hardcover? At this moment, I should mention that there are eight full colour illustrations, one at the beggining of each play.</p>
      <p>The book is primarily aimed at regular readers but some actors, and directors especially, will use it for rehearsals, as well. Unfortunately, reading habits are rather low here in Croatia so the majority of people will buy the book because they were either somehow involved in the work of the theater or they have (or had) someone in the family who is involved with it. I'm afraid that many buyers will buy the book just to have it sit on the bookshelf.</p>
      <p>I was thinking of using more than one space after the character name but it looked somehow odd to me when set. Could be because of the red-coloured names. Didn't realize it was standard. I'll give it a try again.</p>
      <p>Type is set in 11 point size with 14 pt leading.</p>
      <p>J. Tillman; you have sharp eyes -- you're adressing to almost all layout-related problems I have.</p>
      <p>Binding is not yet clearly defined with the printing company. I'll try to insist on sewn binding - both for paperback and hardcover. The printing company showed me some of their earlier work relevant to this book and they had the type of binding where gutter expands almost completely. I lack proper knowledge and nomenclature in technical aspects of bookbinding so I may be talking nonsense.</p>
      <p>Text boxes are symmetrical on both pages but I have negative indent on character names which makes right inner margin smaller then the left one. It also makes the left outer margin smaller then the right one, too. If I off-set text boxes to the right, then I have a problem with continuous text which then looks off-set to the right.</p>
      <p>If I put page numbers to the usual place, how can I solve the problem of 'breathing' text box I described in the initial post?</p>
      <p>The red isn't necessary, that's for sure, but I think it gives a bit more expensive feel to the book. Which seems important to potential buyers who aren't necesserily intereted in actually reading it.</p>
      <p>Again, thank you for your opinions and suggestions -- means a lot!</p>
