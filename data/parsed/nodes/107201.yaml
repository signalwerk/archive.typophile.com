      <p>Looks good, Vedrane!<br>
      I like your approach that quite traditional typeface choice may also lead to an inviting reading experience! Perhaps you could increase the leading by 1pt to make it look even more open.<br>
      More horizontal spacing after the character names has already been mentioned by Nicola, that is standard also in the German-speaking drama typography (ne znam, ali pogledaj neke knjige klasične drame kako to radi u hrvatskoj).<br>
      The idea with putting the page number in the outer margin is also nice, and I even understood they are on the same line as the chapter heading. Yet, this also has drawbacks: 1) your page numbers might be mistaken for line numbers (which are common especially in critical editions, but that might be my bias as a philologist), 2) they might be harder to find than if they had been in traditional places – head or foot of the page –, and you might even put your fingers on top of them.<br>
      When working with such projects I always created a dummy by printing variations of the layout, cutting them to size and sticking them into a book of the same size to get a simulated hands-on on what works best.<br>
      Just another hint: On page 76, there are some straight quotes, check with your editor/publisher how they want them (I’d go for „tik-takanje“).</p>
