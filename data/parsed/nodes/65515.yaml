      <p>You know what would be cool? If at the top you started with a very "European" font on one side and a very South American font on the other, then as you read down the invitation they slowly merge/interpolate and by the time it all reaches the bottom you have a nice hybrid.</p>
      <p>OK, back to reality. You might go for one of the fathers of the recent revival of South American type design, the seminal and award-winning Borges:<br>
      <a href="http://new.myfonts.com/fonts/pampatype/borges/" title="http://new.myfonts.com/fonts/pampatype/borges/">http://new.myfonts.com/fonts/pampatype/borges/</a></p>
      <p>BTW, you might not know about this: <a href="http://www.letraslatinas.com/" title="http://www.letraslatinas.com/">http://www.letraslatinas.com/</a><br>
      Be careful, it can suck you in - you might end up missing the wedding!</p>
      <p>hhp</p>
