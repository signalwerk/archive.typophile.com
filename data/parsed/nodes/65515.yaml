    <p>Here's the story: my sister (from the US, couldn't care less about design) and her fiance (from Chile, also couldn't care less about design) are getting married in two weeks.  Because *I* care about design, I'm trying to gussy up their bilingual wedding program, and thought it would be cool to use a Chilean typeface. </p>
    <p>I love Australis (<a href="http://www.latinotype.com/espanol/fonts/Australis/index.html" title="http://www.latinotype.com/espanol/fonts/Australis/index.html">http://www.latinotype.com/espanol/fonts/Australis/index.html</a>), and purchased the font on latinotype.com this morning, but haven’t received it or any confirmation email (other than the one from PayPal telling me I paid.  I emailed the site owner, and haven't yet heard back.  Does anyone know how font purchasing typically works on LatinoType?  Do you get an email w/an attachment immediately?  A few days later?</p>
    <p>If it sounds like I won't get Australis in the next few hours, I'll buy another font from somewhere I will definitely be able to download it immediately.  Any suggestions?  There's a lot of text in the program, and my sister is printing it out on colored card stock (either light blue or light purple), so I want it to be more black than scant.  It's a pretty informal program, and a pretty informal wedding.  The font certainly doesn't have to be Chilean, but it would be nice if it were South American.  My backup non-Latin-American font is probably Feijoa, which is fun, inky on the page, and very legible at small sizes.</p>
    <p>Thanks, Typophiles!</p>
