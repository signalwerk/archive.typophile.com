    html: <p>I think it's named as "BC Eagles Bold" It was developed for the Boston College Eagles Athletic Department by Nike from 2000-01 until 2011-12. And to me, it nearly looks like a merged combo mix of Impact or Compacta with either Narrowbrand Prime or Blahaus (all italic and bold). After all, it is a custom font design for that university.</p>
