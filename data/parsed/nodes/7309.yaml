    html: <p>The cap S is reminiscent of <a href="http://www.bertholdtypes.com/bq_library/90058.html">Berthold City</a> with the absolute crap skewed out of it. Given the uneven widths and clunky appearence of the various characters, perhaps it's a custom job. <br> <br>As for the use of Bank Gothic, if you download the PDF of the media guide from the Fans Only site, you discover that they're using SSI's infamous Bank Gothic knockoff called Fortis Caps, not the real thing.</p>
