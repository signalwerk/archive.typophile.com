    html: |-
      <p>Here is some other information that I get, this time, with the otfinfo command (that comes with MacTeX). I ran this on 10.6.8</p>
      <p>563 % otfinfo -i 华文细黑.ttf<br>
      Family:              STHeiti<br>
      Subfamily:           Light<br>
      Full name:           STXihei<br>
      PostScript name:     STXihei<br>
      Version:             6.1d2e1<br>
      Unique ID:           STXihei; 6.1d2e1; 2008-11-26<br>
      Trademark:           STXihei and SinoType are trademarks of Changzhou SinoType Technology Co., Ltd.<br>
      Copyright:           Copyright (c) 2002, Changzhou SinoType Technology Co., Ltd.  All rights reserved.<br>
      Vendor ID:           SINO</p>
      <p>So, the PostScript name is STXihei, but the Family name is STHeiti.</p>
      <p>Now, if I use TextEdit, STXihei does not show up and if I choose STHeiti Light and save as pdf, the pdf file contains the font STXihei.</p>
