    votes: null
    html: |-
      <p>For fonts on MacOS X:</p>
      <p>STXihei literally means "ST Hei Light". Do you have any other font named like "STHeiti"? Anyway, I heard STXihei is the standard font in Windows Phone, so it might need to be there.<br>
      Perhaps you can consider giving Hiragino Sans GB a go? It should be in any MacOS X installation, I think.</p>
      <p>For fonts on Windows:</p>
      <p>You can try SimHei/黑体. You can even try SimYou/幼圆 if you dare to use a rounded sans-serif here...<br>
      However, I think Microsoft Yahei is already the best you can get for Windows. And to be fair, it's manually hinted to details, and looks quite good in Windows with ClearType on.</p>
