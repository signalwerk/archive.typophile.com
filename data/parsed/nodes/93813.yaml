    html: |-
      <p>To see what fonts are installed, I used Apple's <code>ftxinstalledfonts</code> command (from the font tools). Here is a trace of execution on OS X 10.7.5 in a terminal window:</p>
      <pre>% ftxinstalledfonts -f -l | grep -i hei
      1	LiHei Pro	/Library/Fonts/儷黑 Pro.ttf
      272	Heiti TC Light	/System/Library/Fonts/STHeiti Light.ttc
      273	Heiti SC Light	/System/Library/Fonts/STHeiti Light.ttc
      553	STHeiti	/Library/Fonts/华文黑体.ttf
      557	Hei Regular	/Library/Fonts/Hei.ttf
      611	SimHei	/Library/Fonts/Microsoft/SimHei.ttf
      679	STXihei	/Library/Fonts/华文细黑.ttf
      788	Heiti TC Medium	/System/Library/Fonts/STHeiti Medium.ttc
      789	Heiti SC Medium	/System/Library/Fonts/STHeiti Medium.ttc
      </pre><p>
      Remark: the folder /Library/Fonts/Microsoft contains fonts from Microsoft Office and I think all fonts from Microsoft Office go there. </p>
      <p>On 10.6.8 I get STXihei in system fonts...</p>
      <pre>STXihei	/System/Library/Fonts/华文细黑.ttf
      </pre>
