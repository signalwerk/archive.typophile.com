      <p>Hi Again – After half a year we are now ready to start coding/testing the new site with 'Hei' as our system font but this is what the web developers have coded in for 'hei':</p>
      <p> "Microsoft YaHei","微软雅黑", Arial, "Verdana", sans-serif, STXihei,"华文细黑</p>
      <p>I feel this hierarchy/font stack could be improved? reasons being:</p>
      <p>– Firstly, I don't have either of these 'hei' versions on my mac. So I think we should consider that...</p>
      <p>– Secondly, I imagine there are better versions of  'Hei' than 'microsoft yahei' that should be higher on the list.</p>
      <p>Any thoughts here?</p>
      <p>Thanks,<br>
      Sullivan</p>
