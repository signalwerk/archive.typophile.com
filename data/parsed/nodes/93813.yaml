    html: |-
      <p>To see what fonts are installed, I used Apple's <code>ftxinstalledfonts</code> command (from the font tools). Here is a trace of execution on OS X 10.7.5 in a terminal window:</p>
      <p>% ftxinstalledfonts -f -l | grep -i hei<br>
      1	LiHei Pro	/Library/Fonts/儷黑 Pro.ttf<br>
      272	Heiti TC Light	/System/Library/Fonts/STHeiti Light.ttc<br>
      273	Heiti SC Light	/System/Library/Fonts/STHeiti Light.ttc<br>
      553	STHeiti	/Library/Fonts/华文黑体.ttf<br>
      557	Hei Regular	/Library/Fonts/Hei.ttf<br>
      611	SimHei	/Library/Fonts/Microsoft/SimHei.ttf<br>
      679	STXihei	/Library/Fonts/华文细黑.ttf<br>
      788	Heiti TC Medium	/System/Library/Fonts/STHeiti Medium.ttc<br>
      789	Heiti SC Medium	/System/Library/Fonts/STHeiti Medium.ttc</p>
      <p>Remark: the folder /Library/Fonts/Microsoft contains fonts from Microsoft Office and I think all fonts from Microsoft Office go there. </p>
      <p>On 10.6.8 I get STXihei in system fonts...</p>
      <p>STXihei	/System/Library/Fonts/华文细黑.ttf</p>
