    <p>Help!</p>
    <p> I'm looking for two different 'Simplified Chinese web fonts', for use on a new Chinese version of an english fashion site.</p>
    <p>1. A Title/display font – Similar to 'modern' or 'bodoni' (if this is even possible, as i guess you don't have Chinese characters with serifs)<br>
    2. A Body copy Font – Similar to 'Gill Sans' or other classic san serifs, with a set of different weights.</p>
    <p>So if anyone has any advice or pointers on selecting a chinese font (technical or aesthetic) that would be great.</p>
    <p>cheers,<br>
    Cian</p>
