      <p>Thanks Riccardo (and ken lunde) for the links and tips, very helpful.</p>
      <p>I think we're going for 'SimHei' for body copy as it seems to be the most widely used chinese web font.</p>
      <p>and for Heads/titles a 'song' variant, using monotype's font subsetting system to keep the file size down.</p>
