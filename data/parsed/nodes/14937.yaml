  html: |-
    <p>I’m having problems with a few files that are being sent to me by a customer. They are PDF’s that have everything embedded but I’m unable to make any edits with the fonts they used. When I try I get a warning that says I cannot edit that font. The customer told me which fonts to buy - FuturaStd1 library and BodoniStd1 library— As it turns out these are OpenType fonts that I purchased from Adobe. The problem is that the customer is using the TrueType version and they are not showing up as available in my library.</p>
    <p>Am I stuck with buying the TrueType version now? Or is there something in distiller that will make those fonts editable?</p>
    <p>Thanks in advance, Dave</p>
  html_clean: |-
