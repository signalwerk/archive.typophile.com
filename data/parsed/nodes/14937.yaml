      <p>&gt;The problem is that the customer is using the TrueType version and they are not showing up as available in my library.</p>
      <p>Adobe does not sell TrueType fonts*, so if these really are TTF’s the customer or someone else must have converted them from the OpenType PS fonts. My understanding of the Adobe EULA is that conversion is allowed and that the customer can provide the converted fonts to you, and you’re allowed to use them udner the license you purchsed for the OpenType PS versions from Adobe. </p>
      <p>Cheers, Si</p>
      <p>*excluding the web type pack released in 1998.</p>
