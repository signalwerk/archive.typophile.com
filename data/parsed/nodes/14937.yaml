    html: |-
      <p>1. “TrueType” is also OpenType. OpenType encompasses two font formats: OpenType PS (.otf) and OpenType TT (.ttf). The latter was formerly known as TrueType. So what you’re talking is the distinction between OpenType PS and OpenType TT / TrueType. </p>
      <p>2. Fonts named “Futura Std” or “Bodoni Std” were never sold in the OpenType TT / TrueType format. They’re only available in the OpenType PS format. </p>
      <p>3. There are many versions of Futura and Bodoni available from many vendors (Adobe, Bitstream, Linotype, Bitstream, URW, Monotype/ITC and others), both in OpenType TT / TrueType and in OpenType PS format. Some permit editable embedding, some only permit read-only embedding (aka “print &amp; preview”). This has nothing to do with the font format. </p>
      <p>So what you’re looking for is not a font in either OT TT or OT PS but a font with a license for editable embedding. </p>
      <p>Regards,<br>
      A.</p>
