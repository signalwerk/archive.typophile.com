    <p>Dear Typophiles, </p>
    <p>Please may I have your comment on my draft logo ideas.</p>
    <p>I am designing a logo for a friend working as a freelance researcher/strategy advisor/writer in London. Among his clients are the BBC and iD. He sums up the majority of his clients up as generally quite conservative, but looking for his creative input. The research/insight he provides is based on fact but also a degree of creativity so the branding needs a science-meets-creativity feel. He would like the logo to be 'simple, current and refined' and is a firm believer in less is more.</p>
    <p>Thank you!</p>
