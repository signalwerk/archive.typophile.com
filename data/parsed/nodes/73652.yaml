      <p>Hello,</p>
      <p>Sorry the slow response - I hope you're all still following this thread! Monday was a public holiday here in England... and all of a sudden it's Thursday! All work and no play makes jack a dull boy.</p>
      <p>Thank you very much for your comments. Penn sums it up well; they are all cliché and don't really reflect any of my friends character. Bezier's suggestion, "Clarity" in a rectangle, is very much the direction I would like to go in but my friend is keen to have a mark of some sort and so my trail of thought has been something like this:</p>
      <p>1. "Focus on the word clarity &amp; use as little as possible to communicate that."<br>
      2. Q. What symbolises clarity?<br>
      3. A. Diamonds<br>
      4. Q. What is the simplest way I can illustrate this?<br>
      5. A. Using basic shapes<br>
      6. Reference: wooden mosaic toys (they're not really diamond shaped but in my mind closely related)<br>
      7. Add a heavy dose of Swiss design - Akzidenz Grotesk<br>
      8. And ta-da! </p>
      <p>What do you think? Good/bad/off my rocker? My friend's always sharply dressed - wears bright but slightly muted colours. He has a Slavic background but is often misplaced as Scandinavian. If he were a movement he'd be a modernist. </p>
      <p>Your comments would be much appreciated. </p>
      <p>With thanks,</p>
      <p>R<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/clarity_logo_v2_5388.png"></div><p></p>
