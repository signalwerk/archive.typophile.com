      <p>With all those different directions it doesn't seem like you know where you want to go with this. Focus on the word clarity &amp; use as little as possible to communicate that. </p>
      <p>These sketches all seem to be following graphic design trends, rather than your client. You pretty much have covered 7 current (cliché) logo trends: Banner motif with all caps gothic type &gt; Plain Helvetica bold &gt; Type reversed out of a cloud blob shape &gt; Different sized dots with a C in the negative space &gt; Set in Avant Garde &gt; Type on a slant reversed out of a circle with gradient &gt; CMYK. </p>
      <p><strong>What do any of these communicate about his position as a researcher / strategy advisor or his personality?</strong></p>
      <p>Judging by your work you've got it in you, just keep working through ideas and sketching.</p>
      <p>--<br>
      <em>penn</em></p>
