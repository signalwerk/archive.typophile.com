      <p>Of these I like the blue one best too, for the simple reason that it's the simplest one.</p>
      <p><cite>"2. Q. What symbolises clarity?<br>
      3. A. Diamonds"</cite><br>
      Maybe we have a language-barrier issue here (English not being my first language) but to me «clarity» would best be shown by transparency. Crystal is clear. Glass is clear. Diamonds are potentially too many other things (precious, valuable, shiny, a girl's best friend); and the many colors in these recent drafts make this approach seem even more complex.<br>
      I'd go back and look for <em>simple</em> shapes, in search of not complexity but transparency.<br>
      One good thing you have is symmetry, which helps make it feel more balanced and regular, which helps «clarity» I think.</p>
      <p>How about just a wordmark? Or if you need a mark, maybe look at "C"s from typefaces with «simple», reduced (~geometric) shapes?</p>
