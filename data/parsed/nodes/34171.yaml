    <p>Please pardon the blatantly non-type related, self-serving nature of this post.</p>
    <p>We have an upper duplex apartment, possibly of interest to type-inclined folk, available for July 1. </p>
    <p>The attractions: good light, small front office room, balcony, entirely renovated last summer, close to downtown Montreal on a street with a bike path. </p>
    <p>The downside: Living above us (two sometimes-adults, two children, two dogs, two motorcycles).</p>
    <p>Contact me for the details or delete the post if I'm totally violating the rules. (And if so, I beg forgiveness and understanding in advance.)</p>
    <p>Cheers,<br>
    K.</p>
