    html: "<p>Stephen -- <br> <br>It's not quite precise to say that Benton Sans was previously called Benton Gothic, as the two remain slightly different families. Benton Gothic was the original family of styles developed for various corporate customers, under Frere-Jones's guidance.  <br> <br>The design family was reworked under Cyrus's direction for retail release. As you might imagine, when a series is developed piece-meal for a variety of clients, each with particular needs, the family may develop some idiosyncracies and inconsistencies across the spectrum. So (I was told) the FB team wanted to harmonize the family and revise it slightly for this release -- hence the new name. <br> <br>You'll notice that the range of weights and styles is slightly different between the two. The earlier Benton Gothic has seven weights from Thin to Black and only two widths. Benton Sans has eight weights from Thin to Black and four widths. So right away, things will be different. <br> <br>At a more subtle level, there are small differences that, to my eye, betray the Highsmith touch. Here is one of the more obvious examples, Benton Gothic Black Condensed and Benton Sans Black Condensed: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/22743.gif\" alt=\"Benton 'a' comparison\"> <br> <br>The differences lie mostly in the curves of the \"shoulder\" and \"belly\". Subtle; but to me, I can just see the two designers, clear as day -- Tobias on the left, Cyrus on the right. It just jumped out at me when I first looked at the new release specimen. <br> <br>Joe -- <br> <br>If I recall correctly, Tobias spent a bit of time looking at a whole bunch of Benton's original work at the Smithsonian -- not just News Gothic, but Franklin Gothic and all the others as well. As a result, the Benton Gothic family was not meant so much as a reinterpretation of News Gothic specifically, so much as a sort of \"Benton gestalt\". <br> <br>-- K. <br> <br></p>"
    html_clean: "<p>Stephen -- <br> <br>It's not quite precise to say that Benton Sans was previously called Benton Gothic, as the two remain slightly different families. Benton Gothic was the original family of styles developed for various corporate customers, under Frere-Jones's guidance.  <br> <br>The design family was reworked under Cyrus's direction for retail release. As you might imagine, when a series is developed piece-meal for a variety of clients, each with particular needs, the family may develop some idiosyncracies and inconsistencies across the spectrum. So (I was told) the FB team wanted to harmonize the family and revise it slightly for this release -- hence the new name. <br> <br>You'll notice that the range of weights and styles is slightly different between the two. The earlier Benton Gothic has seven weights from Thin to Black and only two widths. Benton Sans has eight weights from Thin to Black and four widths. So right away, things will be different. <br> <br>At a more subtle level, there are small differences that, to my eye, betray the Highsmith touch. Here is one of the more obvious examples, Benton Gothic Black Condensed and Benton Sans Black Condensed: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/22743.gif\" alt=\"Benton 'a' comparison\"> <br> <br>The differences lie mostly in the curves of the \"shoulder\" and \"belly\". Subtle; but to me, I can just see the two designers, clear as day -- Tobias on the left, Cyrus on the right. It just jumped out at me when I first looked at the new release specimen. <br> <br>Joe -- <br> <br>If I recall correctly, Tobias spent a bit of time looking at a whole bunch of Benton's original work at the Smithsonian -- not just News Gothic, but Franklin Gothic and all the others as well. As a result, the Benton Gothic family was not meant so much as a reinterpretation of News Gothic specifically, so much as a sort of \"Benton gestalt\". <br> <br>-- K. <br> <br></p>"
