  date: 2003-12-19T18:41:00
  date_raw: 19 Dec 2003 — 6:41pm
  votes: null
  html: <p>How is it that 100 years later, News Gothic is still as fresh as it ever was. It's quite possibly the best workhorse sans ever. (No really.) Lots of people have digitized it (Linotype, URW, Elsner &amp; Flake, Adobe, Bitstream -- the latter being my usual fallback). <br> <br>So, now <a href="http://www.fontbureau.com">The Font Bureau</a> offers the latest addition, <a href="http://www.fontbureau.com">Benton Sans</a>. With 21 weights and styles it could be everything I ever wanted from News Gothic. <br> <br>According to the FB site, Cyrus Highsmith collaborated with The Font Bureau designers in the production and the project was originally started by Tobias Frere-Jones in 1995.  <br> <br>I haven't gotten my hands on it enough to know firsthand, but I wonder how much of the design is true to to the News Gothic I've grown to love and how much of it is an interpretation of Benton's other sketches and/or work. <br> <br>Are you as anxious as I am to test out this face? Will this do to News Gothic what FF DIN did to reg'ler DIN? Or what Helvetica Neue did to Helvetica olde.</p>
  html_clean: <p>How is it that 100 years later, News Gothic is still as fresh as it ever was. It's quite possibly the best workhorse sans ever. (No really.) Lots of people have digitized it (Linotype, URW, Elsner &amp; Flake, Adobe, Bitstream -- the latter being my usual fallback). <br> <br>So, now <a href="http://www.fontbureau.com" class="link-external">The Font Bureau</a> offers the latest addition, <a href="http://www.fontbureau.com" class="link-external">Benton Sans</a>. With 21 weights and styles it could be everything I ever wanted from News Gothic. <br> <br>According to the FB site, Cyrus Highsmith collaborated with The Font Bureau designers in the production and the project was originally started by Tobias Frere-Jones in 1995.  <br> <br>I haven't gotten my hands on it enough to know firsthand, but I wonder how much of the design is true to to the News Gothic I've grown to love and how much of it is an interpretation of Benton's other sketches and/or work. <br> <br>Are you as anxious as I am to test out this face? Will this do to News Gothic what FF DIN did to reg'ler DIN? Or what Helvetica Neue did to Helvetica olde.</p>
