    html: <p>Aww, you usurped the discussion at my place, meanie! It was <br>inadvertent, I’m sure. And I’ve swiped from Typophile plenty. <br>So never mind. <br><br>I think Benton Sans (or Gothic as it was called in the previous <br><span class="caps">FB</span> catalogs) has done well as a magazine face simply  <br>because it oﬀered more cuts. Mags require a lot of styles. <br>I’m not sure I see enough of a diﬀerence from the onscreen <br>previews to determine whether the design itself is reason <br>for picking it over News Gothic. I think it’s merely the new ﬂexibility. <br><br>I’ll print the <span class="caps">PDF</span> soon to have a closer look. They really need <br>to oﬀer a text sampling <span class="caps">PDF</span>&nbsp;too.</p>
