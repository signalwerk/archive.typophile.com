  date_raw: 19 December 2003 - 8:41pm
  votes: 0
  html: <p>How is it that 100 years later, News Gothic is still as fresh as it ever was. It’s quite possibly the best workhorse sans ever. (No really.) Lots of people have digitized it (Linotype, <span class="caps">URW</span>, Elsner <span class="amp">&amp;</span> Flake, Adobe, Bitstream — the latter being my usual fallback). <br><br>So, now <a href="http://www.fontbureau.com">The Font Bureau</a> oﬀers the latest addition, <a href="http://www.fontbureau.com">Benton Sans</a>. With 21 weights and styles it could be everything I ever wanted from News Gothic. <br><br>According to the <span class="caps">FB</span> site, Cyrus Highsmith collaborated with The Font Bureau designers in the production and the project was originally started by Tobias Frere-Jones in 1995.  <br><br>I haven’t gotten my hands on it enough to know ﬁrsthand, but I wonder how much of the design is true to to the News Gothic I’ve grown to love and how much of it is an interpretation of Benton’s other sketches and/or work. <br><br>Are you as anxious as I am to test out this face? Will this do to News Gothic what <span class="caps">FF</span> <span class="caps">DIN</span> did to reg’ler <span class="caps">DIN</span>? Or what Helvetica Neue did to Helvetica&nbsp;olde.</p>
