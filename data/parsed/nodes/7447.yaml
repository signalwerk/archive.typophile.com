  html: <p>I've been thinking lately about the letters that make up the lc latin alphabet, and both the common 'elements' that some letters (conventionally) share and the clearly unique parts. <br> <br><i>ie</i> The rotational/mirrored similarities between p, q, b and d, the shared 'humps' of r, h, n, m, the top parts of i and j and the common general shape of o, c and e.  <br> <br>Then you throw in letters like f, t, g, k and z, which barely seem to be part of the same 'pond'. <br> <br>So it got me thinking about aids to readbility -- is it the lack of variance in the alphabet? That these parts are shared? So surely a more readable alphabet will contain more recognisable similarities?  <br> <br>That does seem counter intuitive though, because surely it's the differences that are important in distinguishing the individual glyphs -- so is a more disjointed alphabet actually more readable (if a little jarring on the eyes!) <br> <br>Basically, I was thinking about creating two companion types, both with the same 'style', but one emphasising similarities and the other emphasising differences.  <br> <br>Am I barking up a thoroughly well barked up tree, or is this something that may be worth running with? <br> <br>Jordan</p>
  html_clean: <p>I've been thinking lately about the letters that make up the lc latin alphabet, and both the common 'elements' that some letters (conventionally) share and the clearly unique parts. <br> <br><i>ie</i> The rotational/mirrored similarities between p, q, b and d, the shared 'humps' of r, h, n, m, the top parts of i and j and the common general shape of o, c and e.  <br> <br>Then you throw in letters like f, t, g, k and z, which barely seem to be part of the same 'pond'. <br> <br>So it got me thinking about aids to readbility -- is it the lack of variance in the alphabet? That these parts are shared? So surely a more readable alphabet will contain more recognisable similarities?  <br> <br>That does seem counter intuitive though, because surely it's the differences that are important in distinguishing the individual glyphs -- so is a more disjointed alphabet actually more readable (if a little jarring on the eyes!) <br> <br>Basically, I was thinking about creating two companion types, both with the same 'style', but one emphasising similarities and the other emphasising differences.  <br> <br>Am I barking up a thoroughly well barked up tree, or is this something that may be worth running with? <br> <br>Jordan</p>
