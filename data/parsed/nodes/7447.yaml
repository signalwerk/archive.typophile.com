      <p>So ... </p>
      <p>Needless to say my idea never got going, things to do, people to see, you know how it is. But I have been thinking about this again, and I think a place to start would be to try and keep common word clusters' boumas similar (to their existing shapes), while diverging and experimenting with individual glyphs.</p>
      <p>I've been reading a little about Cryptography recently, and thought a great place to start may be looking at the shapes of the most common letter combinations. I found this page:</p>
