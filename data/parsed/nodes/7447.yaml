    html: <p>Jordan, this is a great line of thought. <br>Since '98 I've been working on an Alphabet Reform project where <i>dissimilarity</i> (and specifically in the realm of boumas -word shapes- more than individual letters) is emphasized. Because information comes only from contrast. The rest is convention, and malleable (although you have to bend it not break it) <br> <br>I think the trick to optimal readability lies in making the glyphs are different as possible while limiting errant saccades (eye fixations to the wrong part of the text). But the tresholds still escape me. And actually, a font system like you describe could actually be a useful tool when used in empirical testing (which however is very difficult/expensive to carry out properly). <br> <br>hhp</p>
