    html: <p>Sorry to hear about your BMW, it's a shame.  <br> <br>Jordan, not to hijack your awesome thread, do you have any sketches? I'd like to see what you're thinking so far. Same goes for you, Hrant, I remember once seeing a little something of yours in another thread. I just want to see what we're thinking here.  <br> <br>Not to be a crazy theorist, would this be a revolution of the type designers? It seems to me like the alphabet could use some modernizing, and who better?  <br> <br>Should we also be looking at Caps? Or, maybe the variety of shared parts in traditional caps are a good place to start for the lc. It strikes me that there should be some kind of real similarity between lc and UC that doesn't exist now (Aa, Qq) while some letters are nearly resized (Vv, Xx, Zz) or others are well translated (Bb, Mm, Tt).  <br> <br>Also, as we are moving to an increasingly typeset culture, can we ditch structural relationships derived from script handwriting? (that ought to make you happy, Hrant.) <br> <br>K, sorry about the free flow of thought, I just type it as I think it. <br> <br>Aaron</p>
