    html: "<p>Not that I have a lot of expertise or evidence to support my posting here, but a few things come to mind in this general realm of alphabet reform. <br> <br>One is the relationship of letter similarity/dissimilarity and dyslexia. The fact that there are shapes that are reflections or rotations of eachother is a major tripping point for dyslexics. Some people offer certain typefaces and rules (sans over serif, differences in descenders, etc) to fight the problem, but I think an alphabet reform would cure it. (<a href=\"http://www.dyslexic.com/database/articles/fonts.html\" target=\"_blank\">http://www.dyslexic.com/database/articles/fonts.html</a>)  <br> <br>Of course, when it comes to designing a font over designing a typeface, there are issues of uniqueness to a font, character, and so on, that seem to warrant a more radical and fundimental change. I think it's fun to think about the idea of slowly rolling over from one alphabet to another, easing in to it.  <br> <br>Ah, but how much of a difference in this would could a new alphabet make? I imagine that, beyond dyslexia, it could perhaps benefit literacy on a whole, but this is speculation. Are there any sets of research to support such a theory? <br> <br>Most importantly: Is our alphabet broken? Do we read best what we read most, or is there possibility for a better possible system?</p>"
