    html: "<p>Aaran: Ever since I started seriously thinking about designing type, and actually experimenting, it's always bugged me how some letters are (relatively) easy to create once you've got a few basic shapes down, and others a real pain. <br> <br>I hate drawing z, g, and most of all k. They <i>always</i> seem so disharmonious with the rest of the typeface -- even in the most wonderful types it's just a matter of them being squashed in better than in lesser faces. <br> <br>At the same time, it always amused me how traditionally, the clearly identical forms of b, d, p and q had these subtle little divergences (presumably I though, just to bug us designers). The flick on the q's tail, the square serif on the bottom of the b, the opposing serifs on a d and the 'backwards' serif on the p tail. Just so they can insist they're unique! <br> <br>I've not got any sketches or anything, it's just something I was thinking about. I'm drawing a very simple face at the moment, and I kept realising there was this crossroads I came to with each letter -- it could be conventional, 'boring' and readable, or unconventional, unique, but difficult to read. (Even when only using simple basic forms.) <br> <br>Then I thought that surely differently shaped letters should help readability, not hinder it -- but that didn't seem to be borne out when trying to read a face with unusual letterforms (like the faces that use serif splicing experiments such as <a href=\"http://www.fountain.nu/catalogue/alita_post.asp\">alita postmodern</a>). <br> <br>maybe it's a beauty thing -- it's said the faces (as in, human faces, not type-faces) that most people find most attractive are those that are symmetrial but with slight inconsistencies (beauty spots <i>etc.</i>) Maybe we're too preoccupied with the 'beauty' of a typeface (or more specifically, it's individual glyphs) to appreciate that it's function may be served better by having more than slight inconsistencies in it's alphabet -- and we visually reject 'odd' conceptual alphabets on their superficial lack of beauty alone; where the beauty spot has become a boil! <br> <br>I want a b that looks like a lower case delta, a w that looks like an omega, a q that curls up underneath it's neighbouring u, maybe even joining with it, and an l that's more than just a vertical line to be confused with a 1, an I and a |. <br> <br>I just wonder if it'd 'work' or not. No doubt it would take some getting used to, but it would be interesting to test. <br> <br>Incidentally, Hrant, I've enjoyed reading your work on Boumas and revolutionary alphabets (I confess that it was re-reading a post of yours when you posted your experimetally revised alphabet that encouraged me to put some words down on my thoughts). One thing about Boumas -- given that there are an (effectively) infinite number of shapes that words can form, and that you believe it's the word-shapes' divergence that leads to reading ease, do you think that our mind forms a 'bouma alphabet' of some kind -- maybe even a 'visual-syllable' alphabet? <br> <br>Obviously, it would be impossible (or at least, very improbable) for our mind to catalogue every Bouma, and that many very different words will inevitably have similar shapes, how do you think we can store the information in a bouma without first focusing on individual letters first? maybe we just focus on one 'key' letter in each word that leads us to recognise the rest of it by it's shape -- there's probably a good analogy for that but I can't think of one.... <br> <br>Jordan</p>"
