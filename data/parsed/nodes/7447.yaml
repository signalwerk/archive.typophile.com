    html: "<p>Sorry for the delay. <br> <br>&gt; Sorry to hear about your BMW <br> <br>Don't be, it's still a nimble -if ragged and aging- tiger in this world of lumbering hogs. And there's nothing like a beat-up convertible: part tanning salon, part pickup truck.  :-) <br> <br>-- <br> <br>&gt; sketches? <br> <br>Here's something: <br><a href=\"http://www.themicrofoundry.com/other/maslucida.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/maslucida.gif</a> <br> <br>&gt; would this be a revolution of the type designers? <br> <br>Yes, actually (which is why so many people hate it), but a \"subvisible\" revolution, because for something like this to succeed you can't rely on re-educating people, so you have to \"fly under the radar\" sort of and aim for the subconsious. People can't notice, otherwise they'll reject. This does not make improvement impossible however, because reading is essentially a subconscious task anyway. <br> <br>&gt; Should we also be looking at Caps? <br> <br>Eventually, yes - but it's less than 5% of (non-German) text. <br>As for the relationship between caps and lc, I think they need to be <i>diverged</i>, by the same logic as above. People can handle much more than a few dozen glyphs - just look at Chinese. <br> <br>&gt; can we ditch structural relationships derived from script handwriting? <br> <br>That's already happening, of course, very naturally. But we can still try to accelerate it. Why? Because it's an artificial constraint. <br> <br>-- <br> <br>&gt; They always seem so disharmonious <br> <br>Or they're part of a deeper harmony... <br>Morse Code is highly harmonious, but also highly unreadable. <br> <br>&gt; it could be conventional, 'boring' and readable <br> <br>And <i>legible</i>, maybe. Readability is anti-boring! <br> <br>&gt; Maybe we're too preoccupied with the 'beauty' of a typeface <br> <br>Indeed. Probably because tradition can only be learned/taught consciously. People don't like to be told that half of human reality is beyond their appreciation. But it is, and that's why a \"real\" text face cannot be evaluated with superficial formal rules (like ductus). <br> <br>&gt; do you think that our mind forms a 'bouma alphabet' <br> <br>Yes, in the same way that you learn the letters, you learn the shapes of [frequent] cluster of letters. But generally you learn them out of practice, not some schoolteacher telling you. Over time you build boumas in your head, yes, compiling them via the individual letters when you run into an unfamiliar one, but gradually less and less. <br> <br>hhp</p>"
