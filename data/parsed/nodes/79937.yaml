    html: <p>This sounds like a mixture of TEI XML and one of the old 8-bit encodings (GreekKeys, WinGreek, or one of the others). If they're intermingled within the same passages, this may be some sort of strange hack by the previous typesetter. It would be more work to convert it automatically into Unicode if it mixes two systems; if you can't get the information from the previous typesetter, you may need to put together a conversion table yourself.</p>
