      <p>This is probably a custom encoding, and most likely the old<a href="http://socrates.berkeley.edu/~pinax/greekkeys/" rel="nofollow">GreekKeys</a> encoding, as this was the most popular for Polytonic Greek among scholars. Ideally, you would want to identify the custom encoding and then convert the Greek text to Unicode.</p>
      <p>You may find this paper useful:<br>
      <a href="http://ucbclassics.dreamhosters.com/djm/unicodeTalk/unicodeMontrealAPA.html" title="http://ucbclassics.dreamhosters.com/djm/unicodeTalk/unicodeMontrealAPA.html">http://ucbclassics.dreamhosters.com/djm/unicodeTalk/unicodeMontrealAPA.html</a></p>
