  html: |-
    <p>Hello dear typophiles,</p>
    <p>I'm working on typesetting a document with mixed latin and greek text. My problem is not being able to find out what font was used for the greek, or even a suitable replacement.</p>
    <p>The "manuscript" that I received is an XML file, so I have no information on what font was used for the typesetting of the previous edition, and I'm having a hard time finding out what font was used.</p>
    <p>The main problem, rather than knowing the exact typeface used (it could be changed for the new edition) is that the encoding is very strange: for all regular greek letters, the actual text is in latin letters, following the encoding of the old "WinGreek" font - a for alpha, b for beta, etc. However there are also accented characters which are indicated in the xml by an entity, i.e. &amp;iacugr; for small iota with acute; these can be easily converted to their actual unicode points or even a private area one, etc. </p>
    <p>I've already searched trough a lot of sites to try to find something that matches this encoding - let's call it "WinGreek Extended", but so far I haven't been successful. Does anyone know of such a font? </p>
    <p>Contact with the previous typesetter is very very hard (previous problems took literally a year to be answered) so any help is appreciated. </p>
    <p>Thanks!</p>
