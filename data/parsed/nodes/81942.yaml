      <p>Oh I also should add that going outside of the em typically doesn't have as big of consequences as it used to. Where as with older programs, if accents or ascenders went outside of the box, they would get chopped off, but more often than not modern programs—including web browsers—will display the entire glyph, inside and outside the em. </p>
      <p>There are also other OT values you can set to give the font default line spacing, more info about that can be found in a useful PDF Karsten Luecke made and uploaded to his website: <a href="http://kltf.de/kltf_otproduction.shtml" title="http://kltf.de/kltf_otproduction.shtml">http://kltf.de/kltf_otproduction.shtml</a></p>
