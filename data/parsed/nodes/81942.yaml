      <p>Hey Tim,</p>
      <p>This was discussed a little while ago here: <a href="http://typophile.com/node/78036" title="http://typophile.com/node/78036">http://typophile.com/node/78036</a></p>
      <p>The short answer is that it depends: on the designer's preferences, on the intended usage, etc. As you probably know that the more em the characters take up, the bigger the font will seem.</p>
      <p>The general rule of thumb is something that you might expect: try to keep as much as you can in the em. </p>
      <p>It also seems like a part of your question asks about spacing, or arranging the glyph horizontally in the em, and of course this takes up even more time than drawing the letters themselves when one is making a typeface.</p>
