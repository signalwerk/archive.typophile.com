      <p>Thanks Colin! I was sure the collective answer would be that it depends, and the thread you reference definitely speaks to the practical aspects of making these size/positioning decisions.</p>
      <p>But I'm still curious about the aesthetic effects of making this decision with such pragmatism. Perhaps rightly so, it leaves balancing text blocks to the typographer ... but type designers have such astute sensitivity to letter and inter-letter proportions, I wonder if the em box factors into the (at least vertical) aesthetics of their work.</p>
