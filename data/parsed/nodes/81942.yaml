    html: |-
      <p>Ray, clipping is generally determined on Windows by the OS/2 table WinAscent and WinDescent values: so long as those values afre equal to or greater than the bounding box, there should be no clipping. Over the years, we've had to make some fonts like Cambria Math with very large WinAscent and WinDescent values to avoid clipping of the tallest glyps.</p>
      <p>One thing to watch out for though is that a lot of apps also use WinAscent and WinDescent to determine default linespacing as well as the non-clipping zone, so if these values are high you will also get loose linespacing in some apps.</p>
      <p>MS Word does sometimes clip shorter than the WinAscent and WinDescent values if particularly tight linespacing is applied by the user. This is because of the way in which Word draws lines of text.</p>
      <p>I'm not sure how Apple determine clipping.</p>
