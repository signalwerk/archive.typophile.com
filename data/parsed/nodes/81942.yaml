    html: <p>I don't really worry about the body of my letters. I got into type design late enough that most issues related to going outside the box were resolved and people had figured out that it's generally not good to have a caps height bigger than 700 em on a 1000 unit body. I also don't use any glyphs with stacked accents or design scripts with large flourishes. So for me it's a non-issue as long as I keep things under the 700 em height limit other designers established.</p>
