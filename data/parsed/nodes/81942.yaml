  html: |-
    <p>Type designers, do you give as much consideration to the size and position of glyphs within a font's em box as you do to the proportions of letterforms themselves, and to the spacing among letterforms in the font as a whole? Or, on the other hand, are size and position within the em box a more practical matter, based on how you know fonts will behave in typesetting applications?</p>
    <p>Thank you for your time.</p>
  html_clean: |-
