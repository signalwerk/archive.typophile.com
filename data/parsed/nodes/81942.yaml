      <p>About 8 years ago, rather than, you know, reading, I experimented and found the sweet spot where apps wouldn't clip. Some apps will clip beyond 1200, others will display it.</p>
      <p>If you want to squeeze a font tightly into 1200 in FontLab:<br>
      Under Most Important Font Dimensions, sum up the 2nd &amp; 4th Font BBox numbers, ignoring the minus. 120000 ÷ (your result) = scaling factor<br>
      Scale all glyphs with that scaling factor and the font should end up at exactly 1200.</p>
