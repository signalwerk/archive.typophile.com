    html: |-
      <p>With OpenType fonts there's a technical limitation I have to deal with. The maximum vertical size is 1200. The difference between the height of the Aring and the depth of the ogonek (or comma accent or descender) have to squeeze into 1200. I usually rescale the whole font to fit exaclty into 1200 after testing the accents. After scaling, my caps height usually ends up in the 700 range anyway. This way I can design accents that look good to me rather than trying to hit a specific target height.</p>
      <p>Vietnamese accents require more planning to squeeze in without making the font look too small.</p>
