    html: |-
      <p>The em definitely does. In my last design I went through a whole bunch of proportion changes before settling on one that I liked—one that seemed full enough at text sizes without looking too large. </p>
      <p>The proportion that you have inside the em effects default line spacing, how "big" your text is when set at a text size, and the OT values I reference in the second post also enable some control over the default values. The designer also can't go too small in the em or their typeface would look minuscule next to other fonts at the same size and require some adjustment on the behalf of the typographer. </p>
      <p>So like many things in typeface design it is a balancing act, trying to provide your user with the best defaults but knowing some of them will be changed in the type setting anyway.</p>
