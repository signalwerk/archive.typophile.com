    html: |-
      <p>I'm guessing that Ray might be referring to the quasi-standard employed by some foundries that aims for the sum of OS/2 TypeAscender, TypoDescender and TypoLinegap distances to equal 120% of the UPM value -- hence 1200 units on a 1000 unit em --, and to the technical limitation that the sum of the Typo distances should equal the sum of the Win metrics distances to ensure cross-platform and cross-application compatible default linespacing. Taken together, this approach produces a default linespacing that is equivalent to 10-on-12 point leading, but require that all outlines fit within the resulting Win metrics to avoid clipping.</p>
      <p>But neither of these are solid technical requirements or limitations, and there are good reasons to break both of them so long as one know what one is about.</p>
