      <p>Domaine Sans is such a specific face. However, one of the following might work for you:</p>
      <p>Maple:<br>
      <a href="http://processtypefoundry.com/fonts/maple/" title="http://processtypefoundry.com/fonts/maple/">http://processtypefoundry.com/fonts/maple/</a></p>
      <p>Perry Grotesque:<br>
      <a href="https://ourtype.com/#/try/pro-fonts/parry-grotesque/" title="https://ourtype.com/#/try/pro-fonts/parry-grotesque/">https://ourtype.com/#/try/pro-fonts/parry-grotesque/</a></p>
      <p>Supria Sans:<br>
      <a href="http://www.myfonts.com/fonts/hvdfonts/supria-sans/webfont_preview.html" title="http://www.myfonts.com/fonts/hvdfonts/supria-sans/webfont_preview.html">http://www.myfonts.com/fonts/hvdfonts/supria-sans/webfont_preview.html</a></p>
      <p>Bureau Grot:<br>
      <a href="http://www.fontbureau.com/fonts/BureauGrot/" title="http://www.fontbureau.com/fonts/BureauGrot/">http://www.fontbureau.com/fonts/BureauGrot/</a></p>
