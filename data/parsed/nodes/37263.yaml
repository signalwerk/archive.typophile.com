    html: |-
      <p>It's purely conceptual - just something to show how useful the space could be to the client if it were utilised well enough. As I'm from Northern Ireland, both Protestants &amp; Catholics hold their religion quite dearly, but it's not exactly poking fun at scripture, is it? </p>
      <p>I'm honestly at a loss to think of a better strapline concerning Sunday lunch - it fits the tone perfectly, and if I can convince my bosses (I'm currently on work experience) and both partners of the client business, I'll be pleased!</p>
      <p>I appreciate the input, Typophiles, always a pleasure!</p>
