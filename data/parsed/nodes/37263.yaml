    <p>So I've been commissioned to do an ad for a local restaurant promoting their good-old Northern-Irish Sunday Lunch menu - the proprietor wants a quirky message which will entice the customer to dine in their place instead of opting to do it at home, hence the tagline.</p>
    <p>I'm trying to convey the idea that Sunday is indeed a day of rest, and they should let the business do the cooking for them, but I'm unsure whether it could be conveyed as blasphemous as it's bastardising the Bible.. kinda.</p>
    <p>Anyway I'd like your oppinions - note - this is NOT anywhere near the final design, rather just an initial concept.</p>
    <p><a href="http://img210.imageshack.us/img210/1773/picture2dh4.png" title="http://img210.imageshack.us/img210/1773/picture2dh4.png">http://img210.imageshack.us/img210/1773/picture2dh4.png</a></p>
    <p>Regards, </p>
    <p>Paul</p>
