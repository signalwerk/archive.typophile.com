      <p>I'd like to find a setup like that to take a photo of. That would make great fontplay material.</p>
      <p>Btw, if there was a reason to be offended, more Christians would be better off using the opportunity to dialogue in a brotherly way, than getting into a finger-pointing, judgemental mode.</p>
      <p>Personally about the only time I do go out to eat (except for taking customers to lunch) is after church on Sunday. My current favorite is Panera. The bread is so good I can't seem to wolf my sandwich down fast enough. Actually, it is too good. For at least another day I am thinking about how good it was, and am calculating how I can go back again.<br>
      ; )</p>
