      <p>i see that kind of stuff all day. some days more than others. it usually results in me throwing pencils, paper, books and swearing at my computer screen. i cant blame the people who pass it on to me to 'work' with it and 'tweak' it, but the idea of artwork or art these days has gotten so confused (in my opinion)...at least the terms artwork and art. i sometimes wonder if a person with not much art background/exposure sees no real difference in something that might have taken someone 6 months to complete vs. tuffnells parcels express logo thing. i guess it's all in what your trained to perceive...</p>
      <p>w|m</p>
