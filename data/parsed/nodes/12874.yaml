      <p>I'm afraid that in my haste to rant, I didn't make my point clearly enough.</p>
      <p>My intention was to head up the irony of a screenshot of an eps file being presented as "artwork".</p>
      <p>My job is film production in a screen print company, so edge quality is paramount, and a 72dpi rgb jpg really doesn't cut the mustard.</p>
      <p>I find it easier not to worry too much about the aesthetic values  of the brands that I have work with(although Eurostile Bold Extended condensed to 40% does tend to wind me up a bit), rather I try to achieve professional satistaction from reproducing good product from dodgy materials.</p>
      <p>And spotting odd instances of Modena(Beta);-)</p>
      <p>Richard</p>
