    <p>&lt; rant&gt;I had a very bizarre experience at work first thing yesterday morning.</p>
    <p>I received an email from my sales director with <a href="http://www.rhards.co.uk/pics/Tuffnells.jpg" target="new">this</a> attachment, accompanied by the usual "Is this <strong>artwork</strong> OK, or should we <strong>try</strong> to find something better?"</p>
    <p>It took me most of the rest of the day to get over that.&lt; rant&gt;</p>
    <p>Richard<br>
    EDIT: I think I should make it clear that the attachment was the jpg of the screenshot, it isn't a screenshot I've made for the benefit of this post.</p>
    <p>Anyway I work on a PC… runs and hides.</p>
