      <p>This is why my hair has gone prematurely grey... You'd think the basics of typography would be taught in art and vocative schools, BUT they just are not. (I know, because my eldest son is in such a school -- they sit down the kids behind a computer and they can start 'designing'.)<br>
      Before turning all grumpy, here's what keeps me floating and sane: I care about the work I make. I do my best to keep to my own high standards and work hard to do that. And I try to just not care about all the crap that's done. Hard as that is (my denstist warns me not to gnash my teeth so much).</p>
      <p>Anyway, a lot can be improved by changing the awfull defaults of all that American (!) software we have to work with. So change those defaults to smaller wordspacing, disallow letterspacing and glyph distorting beyond a fraction of a percent, disable auto linespacing (20% auto leading -- who ever made that up?), and so on.  AND take out and throw away the "second and inch" key on all keyboards.</p>
