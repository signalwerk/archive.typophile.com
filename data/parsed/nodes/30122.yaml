  html: |-
    <p>Hi,</p>
    <p>I've just updated an old logo for a project I'm in. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/zap_logo_2_5568.png"></div><p></p>
    <p>The aim of the project is to provide free wireless access in Québec city.</p>
    <p>The look I'm aiming at is a mix between 40's illustration style and web 2.0, so something humanist with a modernist twist, or the other way around. Actually the less the modulation, the better I guess, but I still want some. ;)</p>
    <p>The type in the logo is handmade, and I'm looking for a font to go with it.<br>
    So far there are my choices after a bit of research:</p>
    <p>• ITC Johnston --- Like it but unsure.<br>
    • URW Grotesk --- Dinka like this one too but I just dislike the "a" and I'm not sure it would read well.<br>
    • FF Din --- It starts being a bit far from the logo but it would be interesting to use it.</p>
    <p>So far my favourite is Johnston. </p>
    <p>If you have any ideas, go for it.</p>
