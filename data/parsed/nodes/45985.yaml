  html: |-
    <p>Hi there:</p>
    <p>I am generating TTF fonts for a a type family of 4 weights:</p>
    <p>XXX Light<br>
    XXX Regular<br>
    XXX Bold<br>
    XXX Black</p>
    <p>When I test the generated fonts with MS Font ValidatorI get OS/2 errors:</p>
    <p>’E2100A &gt; bit in the fsSelection field doesn’t match the name table’s font subfamily string &gt; fsSelection regular bit is set, but subfamily is Light’</p>
    <p>(I get the message in every weight except, obviously, in regular)</p>
    <p>I do not know how to fix that.</p>
    <p>I did the font naming following the instructions in the Fontlab Forum:<br>
    <a href="https://web.archive.org/web/20081007164750/http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=2843" title="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=2843">http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mvie...</a></p>
    <p>How can I access this field in Fontlab?</p>
    <p>Thanks in advance.</p>
