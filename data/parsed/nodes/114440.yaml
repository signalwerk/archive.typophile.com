    html: |-
      <p>The first one is seems handwritten. Very few script fonts match it's sharp aggressive character, i.e. angular, in a monoline connecting script. Of the fonts suggested so far, Måns Grebäck's  Notera and Signerica [thanks Ryuk] are part way there. A few more partial matches to the character of the script are<br>
      Roland Hörmann's Neo Noir Slim <a href="http://www.myfonts.com/fonts/phospho/neonoir-bold/" title="http://www.myfonts.com/fonts/phospho/neonoir-bold/">http://www.myfonts.com/fonts/phospho/neonoir-bold/</a><br>
      PT Script Barguzin <a href="http://www.myfonts.com/fonts/paratype/pt-script-barguzin/" title="http://www.myfonts.com/fonts/paratype/pt-script-barguzin/">http://www.myfonts.com/fonts/paratype/pt-script-barguzin/</a><br>
      Robert Slimbach's Caflisch Script <a href="http://www.myfonts.com/fonts/adobe/caflisch-script/" title="http://www.myfonts.com/fonts/adobe/caflisch-script/">http://www.myfonts.com/fonts/adobe/caflisch-script/</a><br>
      Mistral is sufficiently aggressive but is much thicker with too much variation in height and angle, so I did not include it.<br>
      Don</p>
