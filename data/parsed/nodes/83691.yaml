      <p>@russelm:<br>
      The articles you cited, which do show that a condition analogous to dyslexia exists within the Chinese linguistic community, also note that that condition is distinct from what we know as dyslexia, because it involves a deficit in a different part of the brain.</p>
      <p>The two conditions should not be given the same name; that is a violation of specific etiology, a useful rule for defining medical conditions, because the cure for a disease usually depends strongly upon its cause.</p>
