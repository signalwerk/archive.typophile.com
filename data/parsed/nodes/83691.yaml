    votes: null
    html: |-
      <p>Function never trumps aesthetics. Aesthetics is about appropriate design. Not pretty design.</p>
      <p>When it comes to type, literacy, readability and legibility, ugliness is very much a factor. What do we really mean by ugly anyhow? (Who even asks that question?) With type, it surely isn't just the opposite of "pretty". Good design stopped being about decorating functional things with flowery doodads a about a century ago.</p>
      <p>Aesthetics have a real function. It isn't just about making things pretty. It is about making them work. There are things which, on a fundamental level, are either ugly or attractive which just about everyone in the world would agree are either ugly or attractive. What is the reason for that? I think it is something hard wired into the brain and is part of how we make sense of the world around us (in a similar way we use analogies like "Hardwired"). A tidy room is more attractive than a messy one because it works. You can find a place to sit down for starters. If you say you prefer messy rooms, that probably means you like the rooms you yourself have made messy because you understand the order things are in and they feel more like they belong to you after you've imposed you own "order".</p>
      <p><cite>If </cite>the disambiguation of characters in the font this thread is about is helpful to anyone, imagine how helpful it would be if it wasn't achieved in such a sloppy manner. </p>
      <p>Where and for what would this font be used? And how often? Will there be some sort of literary ghetto for dyslexics where they all get to read like "normal people" thanks to science, but will unfortunately be even worse off when faced with the other 99.999% of printed matter that will still be set in traditional fonts because they will look strange to them? Or, will "normal people" have their reading abilities degraded by being forced to read only this stuff? Will packaging in Canada be printed in English, French and Dyslexic? </p>
      <p>I think that 'science' as applied to typography is way off the mark 82% of the time. People expect to be able to design a magic bullet in the form of typeface to solve some problem that may in the end have nothing to do with typefaces per se. Seems to me that it's a matter of processing more than what's being processed. Perhaps some of the time it is a question of how children are taught to read. I can remember having a very difficult time telling the difference between 'b' and 'd'. (and this was equally true with my own hand writing (printing) as with my Dick and Jane readers, so right off the bat, I say the whole thing smells like BS) I was a kid with an active imagination. After giving up on trying to read an assignment, but still staring at the page to look busy, I'd start making up stories about the letters on the page. They really were characters. I saw that 'B' and 'b' face the same way but the the 'd' faces the opposite direction than "D", his "parent. Little 'd' was a rebel. Could pick <cite>him</cite> out in a crowd... And that's one little strategy I came up with. Certainly not anything ground breaking. It's just a personal anecdote about how I got over a hurdle. But, it is an example of a different approach to disambiguation that doesn't require such an ugly-arsed font. (It would seem I should have done very well indeed in grade school, what with all those mimeographed homework assignments. They must have been a breeze to read through.)</p>
      <p>Maybe it is as simple as not using a font as devoid of character as Arial or Helvetica, as was suggested earlier, but we may never know. Why is it that folks with next to no knowledge of typography and design apparently prefer go out and invent new wheels that try and understand the ones that are already here. </p>
      <p>So, I ask again... Can dyslexics read hand written (printed) text any better than Arial? It certainly doesn't suffer from the same lack of distinction between characters as Arial. Right?</p>
