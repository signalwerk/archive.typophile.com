      <p><em>... stigmatizes the abnormal with ugliness ...</em> </p>
      <p>Not meaning to come over all 'form follows function', but our notions of what is ugly or beautiful shouldn't come into it if it helps someone to read (and perhaps, not being able to read effectively is more stigmatizing than being lumbered with an ugly typeface?). </p>
      <p>Nick, you're right - the Mencap typeface is beautiful, but it addresses a completely different issue (learning disability vs dyslexia), and it does not address the 'needs' of a dyslexic readership (if we are to agree that a typeface can do this anyway). </p>
      <p>It's not about designers ignoring the tried-and-tested (i.e. for non-dyslexic audiences) formula - the research suggests that there is a fundamental need for characters to not follow conventional lines - ruling out most typefaces already in existence.</p>
      <p>I was being deliberately glib when I derided pretty execution, of course there's no reason why these shouldn't be professional and polished (and yes, even beautiful) typefaces. But we're all looking at them from a different perspective.</p>
