      <p>When we're putting it down as "ugly", though, we're also putting it down as ignoring some of the principles of typography that have been developed over centuries. I want to avoid a semantics argument, but it's my understanding that the primary concern of this typeface is legibility — the ability to distinguish between individual letterforms. The researchers who developed Dyslexie decided that the best way to do this is to emphasize the differences between characters, rather than make them follow the same rational construction. However, they accomplished this by applying the warp tool to a rationally constructed neo-grotesque</p>
      <p>Many of the principles they "discovered" to aid legibility have been used by type designers for centuries, just more subtly. What we're arguing is that Dyslexie and other psychologist-developed typefaces do not accomplish their goals any better than many humanist typefaces do, and when a typeface has no sense of balance (as Dyslexie does not), then it loses readability — i.e. the ability to read it over long periods of time without experiencing eye fatigue.</p>
