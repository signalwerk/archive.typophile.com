      <p><em>It seems to be a common misconception that target readerships are separated groups (e.g. of non-dyslectics vs. dyslectics, visually impaired vs. normal vision people ...).</em></p>
      <p><em>Unless you want to produce and use multiple versions of each sign, notice, book, etc. a typeface that performs better for a minority but worse for the majority is useless.</em></p>
