      <p><em> - the research suggests that there is a fundamental need for characters to not follow conventional lines - ruling out most typefaces already in existence.</em></p>
      <p>Not the research, the theory.<br>
      The theory argues against symmetrical and transformably-identical shapes in simple sans serifs.<br>
      But there are gazillions of typefaces which already follow that principle (it's inherent in the traditional chirographic, serifed oldstyle), which have not been researched or tested.<br>
      In the mass, already existing typefaces can hardly be called conventional. One would expect they follow a bell curve of conventionality. Quite apart from most typefaces in existence, there are a substantial number that might be appropriate.</p>
      <p>If I was designing a typeface for this readership from scratch, I would experiment with clean shapes, then varying asymmetric distribution of weight, and with various arrangements of "some serifs" (e.g. as in TheMix).</p>
      <p>But has anyone ever tested TheMix for readability?<br>
      No, they test Arial, and then take off on their own tangent.</p>
      <p>As Thomas says, what about the humanist sans faces?<br>
      Compared with Arial, they are unconventional.</p>
