      <p>First of all, dyslexia is a diverse condition. Second, it can affect how the printed, written and spoken word is processed. I can't speak for all of those with dyslexia, but this has been my experience. Third, this theory is flawed. I don't care how much of the alphabet someone has behind their name, their theory is incomplete, at best. The determining factor is how a child is taught to read. That is the direction research should take. But, if we must make a font we think will help children with dyslexia learn how to cope with the printed word, please, let's make it one that has some aesthetic appeal. As dyslexics we have our wires crossed. We are not blind or stupid. </p>
      <p>James</p>
      <p>Did I mention that having dyslexia makes typing a pain? Left and right don't have a lot of meaning and spelling is troublesome.</p>
