      <p>@quadibloc <cite>I suspect that the goal would be to have textbooks in the elementary grades all be printed in dyslexic-safe type, so that dyslexia would no longer compromise the process of learning to read for its victims.</cite></p>
      <p>Barking up the wrong tree. The fundamental geometry that makes it possible to confuse a 'b' with a 'd' (for example) remains the same. It's possible for a kid to confuse the two letters in his own hand writing. How is a font with some randomly generated irregularities any an improvement? Having been there, I don't believe there is any merit at all in this approach.  Some paradigm shifting required. </p>
      <p>I very much doubt that improvements in reading accuracy (if any in actuality) due to the disambiguation of letters has anything what soever to do with the ugliness of the font. That is just sloppiness, which comes across to me and, I hope to other people, if they take a second to think about it, as a sign of disrespect and condescension in the very same way that the well meaning people who supplied those appalling orthopedic shoes of days gone by figured "gimpy" kids are -- Well, they're "gimpy" and don't <cite>need</cite> attractive footwear. The same effect (of each letter being distinct from others) could have been achieved in a decently designed font - And largely it has been achieved in a very large number of existing fonts, including many of those in text books used to teach children to read (though now-a-days, that isn't always the case. Most of the text books and workbooks  kids are given by their schools these days are absolute crap. That anyone could learn to read from them is remarkable. Children are exposed to so many appallingly badly designed and written text books and workbooks in schools that is a real shame on our generation.) </p>
      <p>... "Victims"???</p>
      <p>really? </p>
      <p>Victims of sausage-mill like school systems perhaps, but so is everyone.</p>
