      <p><em>…that's hardly the point… </em></p>
      <p>But it is.<br>
      It stigmatizes the abnormal with ugliness, to put it bluntly.<br>
      Furthermore, it assumes that there is no readability benefit in a professionally polished (which you deride as "pretty") execution.<br>
      And it privileges the idea that good intentions trump mere functionality—i.e. there may be many already existing typefaces, designed with other criteria than readability for dyslexics, that would perform just as well if not better, but the scientist with the funding to make a New Font For The Reading Challenged can conveniently ignore those.</p>
      <p>Jason Smith has shown that it is possible to have the best of both worlds, with Fontsmith's Mencap typeface.</p>
