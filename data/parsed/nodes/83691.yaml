      <p>Being dyslexic, I can tell you from personal experience that there is no way to develop a font that will solve problems with reading. I don't know if dyslexic think in pictures or not. I thought everyone did that. I can tell you that one of the main components of the "condition" is that things get re-ordered in the short term memory. I can't see the shape of the letters making any difference. I found this font to be mostly just irritating.</p>
      <p>James</p>
