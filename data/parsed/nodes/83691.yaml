      <p>@russelm:<br>
      <cite>Good design stopped being about decorating functional things with flowery doodads a about a century ago.</cite></p>
      <p>Yes, but that doesn't mean that aesthetics and functional design are one and the same.</p>
      <p>A thing can look ugly because it was put together in a hurry and still work.</p>
      <p>And something can look beautiful and not work - and that is changed not one whit because fashions have changed from rococo to Swedish Modern.</p>
      <p>Aesthetics deals with what we see on the outside, and function has to do with what's doing the work on the inside. The inner workings of many mechanical devices do have a functional beauty, but for functional reasons - keeping dust out of the gears - they're still covered.</p>
      <p>The typeface for dyslexics under discussion does indeed seem to have been thrown together quickly. A typeface could have its characteristics and still also look more like a conventional typeface - for example, there seems no reason to dispense with serifs. But the asymmetries that the function requires likely <em>will</em> compromise the attractiveness of a typeface somewhat, even so.</p>
      <p>@russelm:<br>
      <cite>Or, will "normal people" have their reading abilities degraded by being forced to read only this stuff? Will packaging in Canada be printed in English, French and Dyslexic?</cite></p>
      <p>I suspect that the goal would be to have textbooks in the elementary grades all be printed in dyslexic-safe type, so that dyslexia would no longer compromise the process of learning to read for its victims.</p>
      <p>Once they have learned to read well, then problems with the shapes of individual letters would no longer obtrude, since they would be reading whole words rather than making out one letter at a time to try to sound out what word they are seeing.</p>
