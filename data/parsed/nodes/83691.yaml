      <p>@russelm:<br>
      <cite>How is a font with some randomly generated irregularities any an improvement?</cite></p>
      <p>Well, it is true that the irregularities would have to be the same in all reading material. So one typeface, or one family of typefaces, would presumably have to be used in <em>all</em> the textbooks used in the early grades, until students master reading.</p>
      <p>The idea isn't simply "use Typeface X", it's "change the fundamental letterforms in the alphabet", so that the irregularities of the Dyslexie font are added to the definition of "what makes a b" and "what makes a d".</p>
      <p>Since dyslexia isn't a problem where the Chinese writing system is used, a writing system reform for countries using the Latin alphabet would presumably be effective in eliminating dyslexia as a problem in those countries. Thus, I have to presume that writing system reform, at least in effect, and not simply an "orthopedic" typeface, is the goal here.</p>
