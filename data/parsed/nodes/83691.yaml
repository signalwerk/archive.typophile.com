      <p>I do remember reading somewhere that there is no such thing as a dyslexic in China, because the Chinese characters are not designed with geometrical shapes that are used in upside-down and reversed forms.</p>
      <p>Anyways, I am sure that stigmatizing does not come into this. Instead, no doubt, the makers of this typeface, who are safeguarding their intellectual property, are hoping that <strong>all school textbooks from now on</strong> will be printed in this new typeface. <em>Think of the children!</em></p>
      <p>Of course there may be existing typefaces with some of the properties of this one that would also be more readable by dyslexics. But they're probably display faces - whereas for this purpose one wishes to use an "infanta" design as the starting point.</p>
      <p>For example, I doubt that schools would be willing to specify that textbook publishers use <a class="freelinking external" href="http://www.comicbookfonts.com/fonts/catalog.html?item=fonts:cl329" rel="nofollow">Fairy Tale</a> from Comicraft to typeset their textbooks, even if it also meets the technical requirements.</p>
      <p>EDIT: With the passage of time, Comicraft has rearranged their web site. Current link:</p>
