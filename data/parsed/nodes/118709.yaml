  - id: 587579
    user: 68821
    date: 2014-09-06T12:10:00
    date_raw: 6 Sep 2014 — 12:10pm
    votes: null
    html: |-
      <p>Thank you for the comments, Martin. I like your suggestion of making 2-half fonts, as alternate variations, to get the 2-color look I created using Illustrator in my poster. Actually, that did occur to me as I was working on the promotional poster. Not sure how many customers for that kind of font(s), although something to consider down-the-road, perhaps. My thinking is that graphic artists would prefer to experiment and create these type of variations themselves, on the fly, as I did. But, maybe you are right! I think I'll give it a try. Thanks again.</p>
      <p>On another note, I wonder if a type design concept like this would be desirable for a true italic version as well? How about other weights, small caps or old style figures, etc.—as well as, other “feature” sets? I guess I could keep experimenting, with other variations, if this font becomes successful.</p>
      <p>Any other ideas or suggestions appreciated. Thanks, again!</p>
