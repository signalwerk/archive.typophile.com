    html: '<p>Definitely handdrawn to me. Some similars: <a class="freelinking external" href="http://www.myfonts.com/fonts/typeart/dream-lover/" rel="nofollow">Dream Lover</a> (very close, "only" needs to be roughen), <a class="freelinking external" href="http://www.google.com/webfonts/specimen/Yellowtail" rel="nofollow">Yellowtail</a>, <a class="freelinking external" href="http://www.fonts.com/font/summittype/bristle/expanded-bold" rel="nofollow">Bristle</a> ("MadEwEll"), <a class="freelinking external" href="http://www.impallari.com/dancing" rel="nofollow">Dancing Script</a> (using a /&amp; for /e), <a class="freelinking external" href="http://www.myfonts.com/fonts/kimberly-geswein/never-let-go/" rel="nofollow">Never Let Go</a> ("MadEwEll"), <a class="freelinking external" href="http://www.myfonts.com/fonts/kimberly-geswein/kg-legacy-of-virtue/" rel="nofollow">Legacy Of Vertue</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/comicraft/spaghetti-western/" rel="nofollow">Spaghetti Western Swash</a>, <a class="freelinking external" href="http://www.youworkforthem.com/product.php?sku=T0061" rel="nofollow">Coffee Script</a>, <a class="freelinking external" href="http://www.dafont.com/karine.font" rel="nofollow">Karine</a></p>'
