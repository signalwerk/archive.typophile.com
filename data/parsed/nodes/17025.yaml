      <p>This is a rare thing — I’d like to add — and usually shy away friends of my clients with projects “that won’t take that long”. </p>
      <p>Rule of thumb (or) Code of the West: When someone says it won’t take that long and it really shouldn’t be any trouble at all, run in the opposite direction. Especially if you client is smiling while they say it is for a good friend of theirs. :^/</p>
