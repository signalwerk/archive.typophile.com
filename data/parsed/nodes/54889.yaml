      <p>Hey, Simon!</p>
      <p>Bebit is a version of Milton Glaser's Baby Teeth, which was based on a hand-painted sign he saw in Mexico.</p>
      <p>There is an older Typophile thread on Baby Teeth <a href="http://www.typophile.com/node/2547" rel="nofollow">here</a>.</p>
      <p>I would describe Baby Teeth as being made of simple yet bold geometric shapes, but that is not exactly the same as letters made from standardized parts (i.e., modules).</p>
      <p>P.S. And James makes a good distinction about how the word "modular" is used within FontStruct and outside of it.</p>
