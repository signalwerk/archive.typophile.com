      <p>Hey Martin - thanks for the heads up.</p>
      <p>It's a delight to be able to read such a great book about such a great man - I've been lucky enough to spend some time with Jose at his Sevres home while preparing my upcoming book about Excoffon, and I'm happy that this tribute comes at the right time.</p>
