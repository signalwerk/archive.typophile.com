      <p>"Now everyone is a typographer, just like everyone is a photographer. The tools are afforable and easy to use."<br>
      Nah, the tools are easy to get access to illegally and as easy to abuse. Typography isn't easy, just like photography isn't easy. The fact that people think it is shouldn't affect what a typographer is. I simply can't call anyone who has to do with setting text a typographer. And likewise, I've taken photographs and I've had photography classes at the art academy, but I would never consider myself to be a photographer with my current skills. It's just not justified.</p>
      <p>I have seen the term 'typographer' being used to describe type designers as well though. They should remain distinct professions, however I would think a type designer is also a typographer.</p>
      <p>"In a technical sense, yes, everyone who lays out some text in Microsoft Word is a typographer. He/she uses type to design a page. Quality doesn't matter in this regard."<br>
      I don't agree with this statement. Am I technically a painter by throwing a bucket of paint onto a wall? Quality may not matter directly, but I think the tools the so-called typographer uses do matter and they affect the quality indirectly. I wouldn't call someone who knows nothing about type a typographer, even if he uses the kerning feature in Photoshop.</p>
      <p>Why is it predominantly in art and design that everyone can be considered to belong to a certain profession without having the skills that go with that profession? It's awful. For us to insist that they actually ARE designers doesn't help. I could grab a hammer and helmet and consider myself a builder, and technically you could indeed say that I am because I build, but to be a genuine builder I would think I need to actually know something about building. For me to put on a helmet and get other tools needed for the job doesn't help me finish a house. If I do finish a house and it's understandably unsafe to occupy, you would seriously question my background. You wouldn't say "he happens to be a bad builder".</p>
      <p>I think it's our job to guard the integrity of our work, and so I don't call anyone who works with type a typographer.</p>
