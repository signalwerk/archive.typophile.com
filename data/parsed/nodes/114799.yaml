      <p><cite>But will that really happen through semantics? Who decides then who is qualified to be a typographer?</cite><br>
      In theory it would. In practice it's more difficult to achieve. I don't think anyone in particular will decide who is qualified to be a typographer. In fact, I don't want us to decide who is a typographer and who isn't. My only issue is that we shouldn't just consider anyone who does type to be a typographer.</p>
      <p>If someone lacks knowledge in type, we should point that out, and I think we do. What we shouldn't do is give the person the impression he is already qualified to be a typographer just because he works with type. Right now too many graphic designers think they're good typographers. I thought my typography was done well 6 years ago, but I had no idea how seriously I was lacking in knowledge and therefor lacked the insight to make the typography as good as I would do it now. I suspect in 5 years from now I will feel the same about the work I do now. To have considered myself a typographer 6 years ago would have been unjustified despite the fact I knew more about typography than many you would probably consider to be typographers for merely working with type. </p>
      <p>I don't think we can necessarily judge who is a typographer because indeed there are many things to consider, but I think it helps to ascribe a certain amount of knowledge to a typographer.</p>
      <p>Also, I find the notion of someone typing text in Microsoft Word being considered a typographer to be almost offensive. I think I'm being underrated as a designer exactly because people seem to think anyone can be a designer. I studied hard to get to the point where I am now and I have another 4/5 years to go. I have been doing freelance work for about 12 years but initially I considered myself an artist because I was doing designs and illustrations according to my own principles and knowledge. To be a designer requires more knowledge and insight about color, composition, typography etc. and you need to know about printing, trending, marketing, the history of art and design. Only then do you have control over what you do and only then can you justifiably call yourself a designer.</p>
      <p>Very simply put, you need a certain skill set for a certain profession and it's not justified to consider someone to be of that profession just for doing an activity related to that profession. Perhaps it doesn't apply to the English language, but in the Dutch language there seems to be a distinction between "playing soccer" and being a "soccer player". My sister plays soccer two times a week but I wouldn't consider her to be a soccer player. She just lacks ambition, technique and motivation, and that's alright because it's just a hobby.</p>
      <p>I will give one more example. I like to consider myself an amateur scientist because I analyze data of stars from the Kepler space observatory to find exoplanets. I've found about 10 planets of which I calculated one to be three times the mass of Jupiter and I identified about 10 eclipsing binaries and a few other oddities. Now, it requires quite a lot of insight into astronomy and physics and science in general to do this, hence I'm an amateur scientist. To consider myself a scientist however would be unjustified because although I did a lot of research, I never went to university for a degree in the subject. Although I do scientific work, I don't strictly think like a scientist. In fact, my contributions are predominantly statistical and I have no idea how to actually gather data and construct hypotheses like actual scientists do. To me it's technically correct to call myself an amateur scientist but this is probably more to my own satisfaction. Put me in a lab and I can almost assure you nothing scientific will be done. Hence, scientists need to protect the integrity of their field, and they do. They don't just consider anyone who does something scientific to be a scientist. Fortunately not.</p>
      <p>Conversely, in design we do. In my opinion it's not justified.</p>
