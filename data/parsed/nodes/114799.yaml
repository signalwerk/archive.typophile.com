      <p>I think you slightly misunderstood, which is my fault for wording my statement that way. What I was insinuating is why it's predominantly in art and design that someone can be considered a professional without having studied the subject in question deeply. A good example would be my own career. I've been pretty knowledgeable about typography for many years and in fact I probably could have considered myself a typographer back then. I didn't though, and if I did I think it was an overstatement. My skills at the time, although reaching further than the average graphic designer and many so-called typographers, wouldn't have justified calling myself a typographer I think. You need a certain skill set to make that claim.</p>
      <p>You say the word just describes the activity, but we're not completely working with abstracts here. Arresting someone doesn't make me a cop. Likewise, I've never in my life described myself as a cook for merely making a dinner. I really think it's an overstatement to ascribe a profession to someone because he happens to practice such an activity at the moment.</p>
      <p>I think we can have a debate about semantics and metaphysics here, but the deeper message I want to convey is that it's our job to safeguard the integrity of our profession, and that applies to any profession. I know we live at a time where many tools are easy accessible so the borders between professions and certain principles tend to blur, but to make language blur along with it would be a mistake. Because, in the end what does it mean to be a designer in that case? I'm already being underrated because of my profession, both as a graphic designer and a type designer.</p>
