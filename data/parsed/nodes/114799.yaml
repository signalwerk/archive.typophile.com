    html: |-
      <div class="comment-spam-body"><p>There is a distinction to be made between typesetter and typographer.</p>
      <p>A typesetter can be anyone who merely types in the words and may have little-to-no typographical experience or knowledge. A person who sets type for grocery ads, books or newspapers would be considered a typesetter.</p>
      <p>A typographer is someone who knows the intricacies of what makes type work, of what it takes to make type into a well-composed page. It is usually pretty easy to see the differences between a page composed by a typesetter and a page composed by a typographer.</p>
      <p>So a typographer is not just a typesetter; it takes learning and years of experience to become a typographer. It is true to say that a typographer starts out as a typesetter and it is also true, as you wrote, that a typographer is a kind of graphic artist. Alone that same line, it is also true that not every graphic artist is a typographer.</p>
      <p>The bottom line is that a typesetter is just a typesetter; a typographer is Best of Class.</p>
      </div>
