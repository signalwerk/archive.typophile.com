      <p>Words can change their meaning or the the focus of their meaning depending on the context.<br>
      In a technical sense, yes, everyone who lays out some text in Microsoft Word is a typographer. He/she uses type to design a page. Quality doesn't matter in this regard. Just like Frode said: Everyone who uses a camera is a photographer. Everyone who uses type is a typographer.<br>
      Yet, think about a book like titled “20th century photographers”. It's obvious that this book will be about the best/most famous people of the professional field of photography. </p>
      <p>So typographer/typography can just relate to the technique of designing with type — or those terms imply a certain expertise in execution and/or knowledge. The context decides. And that's okay. It's how language works. ;-)</p>
