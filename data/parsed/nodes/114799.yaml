      <p><cite>it's our job to safeguard the integrity of our profession</cite></p>
      <p>But will that really happen through semantics? Who decides then who is qualified to be a typographer?<br>
      A degree? You can do lousy work even with a degree.<br>
      The act of doing it for money? That also doesn't say much.<br>
      Being famous as a typographer? Maybe that was just good marketing.<br>
      The work being seen as “quality work”? Who can decide that? Is there a global committee somewhere?</p>
      <p>Today, there is not one accepted definition of “typographer” anyway, that could clearly divide people who do something with type in the groups "is a typographer” and “is not a typographer”. Type is now a tool for everyone and reserving typography/typographer just for some sort of elite wont work anyway.<br>
      When in doubt, I personally just speak of the “technique of typography” or the “art of typography”.  In the first case, everyone who works with type is a typographer. In the second case I stress the skill/expertise. That is not blurry at all and I also don't think it devaluates the term. It just reflects how type is used today.</p>
