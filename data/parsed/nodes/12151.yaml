    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : John Hudson</strong></p>
    <p>Proprietor, along with <a href="/wiki/Ross%20Mills" class="freelinking" rel="nofollow">Ross Mills</a>, of <a href="/wiki/Tiro%20Typeworks" class="freelinking" rel="nofollow">Tiro Typeworks</a>. Hudson is an expert on type technologies (particularly the <a href="/wiki/TrueType" class="freelinking" rel="nofollow">TrueType</a> and <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> font formats), character encoding and glyph processing, and development of fonts for multiple <a href="/wiki/writing%20systems" class="freelinking" rel="nofollow">writing systems</a> and languages.</p>
    <p>He has designed typefaces and made fonts for clients such as <a href="/wiki/Microsoft" class="freelinking" rel="nofollow">Microsoft</a>, <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a> Systems, <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>, <a href="/wiki/IBM" class="freelinking" rel="nofollow">IBM</a> and <a href="/wiki/Apple" class="freelinking" rel="nofollow">Apple</a>, as well as for smaller companies and academic organisations. His designs, several of which have been recognised in international competitions, include new typefaces for the <a href="/wiki/Cyrillic" class="freelinking" rel="nofollow">Cyrillic</a>, <a href="/wiki/Ethiopic" class="freelinking" rel="nofollow">Ethiopic</a>, <a href="/wiki/Greek" class="freelinking" rel="nofollow">Greek</a>, <a href="/wiki/Hebrew" class="freelinking" rel="nofollow">Hebrew</a>, <a href="/wiki/Latin" class="freelinking" rel="nofollow">Latin</a>, <a href="/wiki/Ogham" class="freelinking" rel="nofollow">Ogham</a>, and <a href="/wiki/Thai" class="freelinking" rel="nofollow">Thai</a> scripts. In addition to sharing projects with <a href="/wiki/Ross%20Mills" class="freelinking" rel="nofollow">Ross Mills</a>, he is a frequent collaborator with <a href="/wiki/Fiona%20Ross" class="freelinking" rel="nofollow">Fiona Ross</a> and <a href="/wiki/Tim%20Holloway" class="freelinking" rel="nofollow">Tim Holloway</a>.</p>
    <p>John Hudson lives and works in Vancouver, Canada, and is a member of the <a href="/wiki/Canadian%20Advisory%20Committee%20on%20Encoded%20Character%20Sets" class="freelinking" rel="nofollow">Canadian Advisory Committee on Encoded Character Sets</a>.</p>
