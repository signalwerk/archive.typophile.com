    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: John&nbsp;Hudson</strong></p>
    <p>Proprietor, along with <a href="/node/add/wiki?edit%5Btitle%5D=Ross%20Mills" title="Create node &quot;Ross Mills&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Ross Mills</a>, of <a href="/node/add/wiki?edit%5Btitle%5D=Tiro%20Typeworks" title="Create node &quot;Tiro Typeworks&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Tiro Typeworks</a>. Hudson is an expert on type technologies (particularly the <a href="/node/13679" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TrueType</a> and <a href="/node/12420" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OpenType</a> font formats), character encoding and glyph processing, and development of fonts for multiple <a href="/node/12260" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Writing Systems</a> and&nbsp;languages.</p>
    <p>He has designed typefaces and made fonts for clients such as <a href="/node/20191" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Microsoft</a>, <a href="/node/13428" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adobe</a> Systems, <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>, <a href="/node/add/wiki?edit%5Btitle%5D=IBM" title="Create node &quot;IBM&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">IBM</span></a> and <a href="/node/add/wiki?edit%5Btitle%5D=Apple" title="Create node &quot;Apple&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Apple</a>, as well as for smaller companies and academic organisations. His designs, several of which have been recognised in international competitions, include new typefaces for the <a href="/node/14164" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Cyrillic</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Ethiopic" title="Create node &quot;Ethiopic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Ethiopic</a>, <a href="/node/14789" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Greek</a>, <a href="/node/34368" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hebrew</a>, <a href="/node/14508" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Latin</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Ogham" title="Create node &quot;Ogham&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Ogham</a>, and <a href="/node/add/wiki?edit%5Btitle%5D=Thai" title="Create node &quot;Thai&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Thai</a> scripts. In addition to sharing projects with <a href="/node/add/wiki?edit%5Btitle%5D=Ross%20Mills" title="Create node &quot;Ross Mills&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Ross Mills</a>, he is a frequent collaborator with <a href="/node/20067" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fiona Ross</a> and <a href="/node/16182" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Tim Holloway</a>.</p>
    <p>John Hudson lives and works in Vancouver, Canada, and is a member of the <a href="/node/add/wiki?edit%5Btitle%5D=Canadian%20Advisory%20Committee%20on%20Encoded%20Character%20Sets" title="Create node &quot;Canadian Advisory Committee on Encoded Character Sets&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Canadian Advisory Committee on Encoded Character Sets</a>.</p>
