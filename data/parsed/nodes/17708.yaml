    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Handselecta</strong></p>
    <p>Handselecta was founded in the Spring of 2003 by <a href="/wiki/Christian%20Acker" class="freelinking" rel="nofollow">Christian Acker</a> of Adnauseum, Inc. and <a href="/wiki/Kyle%20Talbott" class="freelinking" rel="nofollow">Kyle Talbott</a>, two fellow designers who found they had more in common when they discovered they both had led previous lives as vandals. Focusing their efforts on the documentation of geographic stylictic differences the type foundry was born out of collaboration with numerous accomplished graffiti artists.</p>
    <p>2006 saw the release of their first volume of collaborative fonts with Joker Straight Letter, Mene One Mexicali, Mesh One AOK, Meskyle Laid Back and Sabe Ghetto Gothic.</p>
    <p>URL: <a href="http://www.handselecta.com" title="http://www.handselecta.com">http://www.handselecta.com</a></p>
