      <p>Ah, you're entering detail-tweak land now. Nice. :-)<br>
      Just a few quick things – mind the salt, of course…<br>
      The "N" seems potentially too wide (?), and its joins dark.<br>
      I like the new "G", but I wouldn't make the crossbar quite as short in the context of this font… and try to make the angle of the top terminal consistent with things like the "S" ([more] perpendicular to the stroke).</p>
      <p>Also: In a word like SOFTWARE you're really setting yourself up for trouble trying to space it this tightly. The F_T and also T_W create these large holes next to which everything else seems too tight. It might become more even if you loosen everything up a bit.</p>
