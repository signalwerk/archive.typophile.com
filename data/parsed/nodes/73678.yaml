  html: |-
    <p>Exploring some options to refresh a software company logo. </p>
    <p>The company has a very strong focus on thinking through and developing polished user experiences. Not just the pretty interfaces, but the interaction flows. Trying to build simple, intuitive and smart software basically.</p>
    <p>Existing logo is a temporary one, simple FF Din:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ytsd-old_3505.png"></div><p></p>
    <p>The revised version:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ytsd-1_6104.png"></div><p></p>
    <p>I have mainly focused on selecting the right typeface for it, and trying to communicate the simplicity, elegance and clarity through it. This is Proxima Nova.</p>
    <p>So the question is if the change is working. Would love to hear your thoughts. Thanks.</p>
