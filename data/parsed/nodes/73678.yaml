      <p>Simple and elegant. The type feels a bit dense (tightly set, that is; not stupid!). Consider tracking out the letters a bit. This will dictate whether or not to adjust the leading, too.</p>
      <p>Chances are that the logo looks awesome when it fills your screen, but set as small as it is above (and smaller), legibility definitely becomes an issue.</p>
      <p>I know I'm probably preaching to the choir; you probably know all that already. I promise I'm not just spewing off standard "rules." Sometimes those rules are appropriate, sometimes they exist to throw them out the window. This, however, seems to be a case for the former!</p>
