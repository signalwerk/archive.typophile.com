      <p>hahaha oh how incredibly observant!  I was actually pointing at a nametag that's too small to see at that resolution, although to do so I didn't *have* to make that 'L' shape with my thumb.  Maybe I'm advertising my leftishness more than I thought (on a subconcious level)</p>
      <p>Now, when we got to drawing class in college it made me so delighted when all the right-handers were complaining about getting the sides of their hands dirty from drawing with graphite sticks.  This is the burden lefties have to bear from grade 1.</p>
      <p>Actually, you might find this amusing, we used to call graphite or charcoal stains on our hands and wrists the ‘GD tan’ because only us in graphic design could get it. (and we didn't have real tans because we were inside doing work)</p>
      <p>I know an old designer, a family friend (probably influenced me more than I know) and he wa taught lettering when he studied ‘commercial arts’ back in the day.  I wonder if he'd like to help me out a bit with writing…</p>
