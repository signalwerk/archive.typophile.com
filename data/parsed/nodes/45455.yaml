      <p>I have always loved Poppl's type and lettering. I started as a calligrapher and the "sensitivity" developed from that. Go and take a class from a REPUTABLE calligrapher and you will be on your way. Try and get in touch with Ruth Booth in Toronto! Check out both Poppl and Schneider on the sites I recommended. They are true "finessers" of letterforms. </p>
      <p>Come to Buffalo for Typecon and I will bring some of their work. It will blow you away!</p>
      <p>Michael</p>
