    <p>Hey guys, I've noticed a beautiful little typeface that Tim Hortons has been featuring in all of their new advertising and I want to know what it is!</p>
    <p>it reminds me of Optima, because it's a sans-serif that has a gentle flare at the ends, but it's too *fun* to be optima, which I onsider much more refined and formal.</p>
    <p>Anyway, here's a link to their website, and it's featured in the flash banner on the mainpage.</p>
    <p><a href="http://www.timhortons.com/en/index.html" title="http://www.timhortons.com/en/index.html">http://www.timhortons.com/en/index.html</a></p>
    <p>Thanks for your help, and if you were near me, I'd buy you a coffee! (At Timmy's of course)</p>
