      <p>I swear it looks like Poppl Laudatio Condensed Bold, Berthold, that has been ruined by outlines. The motion stuff moves too fast for these old eyes. I could be very wrong! The low slung cross on the t and the exaggerated terminal, swolen sans leads me to believe I am .... maybe right. He was one of the finest calligraphic/lettering artists and teachers of our time. See Berthold... Pontifex Laudatio Residenz Paladin(sp) etc. His most outstanding student, Werner Schneider... see Linotype Senatus Libretto etc.</p>
      <p>Michael</p>
