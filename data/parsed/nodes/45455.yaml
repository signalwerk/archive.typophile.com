      <p>OK Tom, let me go out on a limb here. My daughters are your age. I remember them making the sign of LOSER years ago. You are holding your left hand up with the same gesture except away from the forehead. Is this a subconscious attempt to say LEFTY??? If so you are very subtle and you should have no problems with subtle letterforms cause that went past me on first glance! Or maybe I am over reaching.</p>
      <p>Michael</p>
