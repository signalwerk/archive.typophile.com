    html: |-
      <p>Very good. I think the "g" is a little to narrow and timid, actually. And the thinness of the verticals of "4" and "7" is perhaps more suitable for a display typeface than for one intended for footnotes. </p>
      <p>There's something very familiar with the top serifs of mnpr and the ascending glyphs ... Mercury Text, perhaps? That's not a problem, but I somehow feel that serif is vaguely out of context with the rest of the typeface, but that might just be me.</p>
