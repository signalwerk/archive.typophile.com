      <p>This is very harmonious already. Lovely work!<br>
      I'm also a learner so take my comments with a dab of salt...<br>
      I'm slightly concerned about the wide N and narrow W. Lowercase w is a slight bit narrow too? And I'd make the tail on the comma a tiny bit longer. Bottom of G looks a bit heavy? And perhaps the terminal of the tail on y could be heavier?</p>
