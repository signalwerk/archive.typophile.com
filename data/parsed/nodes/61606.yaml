    <p>After a long time I decided to revise and finish a typeface I worked on a while ago. My intention was to make it suitable for small sizes from about 7 to 9 points. Hope you like it. </p>
    <p>By the way: It is named after a character of The Godfather. Just like my other typeface Im working on at the moment <a href="http://typophile.com/node/55850" title="http://typophile.com/node/55850">http://typophile.com/node/55850</a>.</p>
