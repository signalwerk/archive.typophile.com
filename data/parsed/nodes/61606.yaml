      <p>Thank you for your comments so far.</p>
      <p>Didn`t had much time to work on it but I made a few little changings and uploaded a new pdf (002). Mainly changing some sidebearings and making the inktraps a bit wider. Think it is a bit more readable now in smaller sizes.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Zügel_3598.jpg"></div><p></p>
      <p>The top one is the old. I widend the g, broadend the ? and gave the letters like Z etc a sharp inner corner.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/0123456789_5519.jpg"></div><p></p>
      <p>Although I changed the numerals a bit and added old style numerals</p>
