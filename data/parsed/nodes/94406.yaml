    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sirba_greek-kopia_3456.gif"></div><p></p>
    <p><a class="freelinking external" href="http://www.type-together.com/Sirba" rel="nofollow">Sirba</a>, a robust typefamily by Nicolien van der Keur, for complex text environments, now offers even more possibilities. The recent update includes a full set of phonetic symbols, designed upon request for the use in dictionaries, and the extension to polytonic Greek. Although the historical way of writing Latin and Greek is very different from each other, the Greek is designed to harmonize well when used together with the Latin. Irene Vlachou and Gerry Leonidas assisted the development of <a class="freelinking external" href="http://www.type-together.com/Sirba" rel="nofollow">Sirba</a> polytonic Greek with their professional expertise.</p>
    <p>more information at: <a class="freelinking external" href="http://www.type-together.com/Sirba" rel="nofollow">http://www.type-together.com/Sirba</a></p>
