  html: |-
    <p>I have been using the font for my <a class="freelinking external" href="http://www.webmama.com" rel="nofollow">http://www.webmama.com</a> business for over 13 years. When iprint changed to new management they dropped my font and all knowledge of letterhead, envelope, business card, mugs, etc, etc designs. </p>
    <p>I need to know the 'name' of the font so that I can continue to use it. </p>
    <p>Thanks,<br>
    Barbara</p>
