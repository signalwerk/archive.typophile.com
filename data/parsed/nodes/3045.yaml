    html: <p>13. You buy magazines "for the articles." <br> <br>14. It ruins a movie for you when they use a typeface that didn't exist at the time the movie is supposed to take place. <br> <br>15. You can page through a 2-inch-thick font catalog without falling asleep. <br> <br>16. The first thing you do when you go to a used or rare book store is check to see if they have any type specimen books. <br> <br>17. You find it difficult to read sometimes because you're noticing the typeface.</p>
