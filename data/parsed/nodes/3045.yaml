    html: "<p>Just for a laugh, my last post to Mark (and his earlier comment about needing a 12-step program) prompted me to make the following List. Maybe some of you can suggest better/additional items? <br> <br> <br>These are the Twelve Warning Signs that you may be a Fontoholic (alt. spelling: Fontaholic): <br> <br>1. You dream about fonts. <br> <br>2. You tell other people (who could not care less) what font the menu is set in. <br> <br>3. You look at magazine ads to identify the fonts. <br> <br>4. You know the urls of over 10 font sites by heart. <br> <br>5. Your copies of font books are falling apart from being used. <br> <br>6. You know the names of over 20 type designers. <br> <br>7. You name things after your favorite fonts. <br> <br>8. It ruins your day when you can't think of the name of a font you KNOW you know. <br> <br>9. You hang out all day waiting for ID posts at newsgroups and forums online. <br> <br>10. You need to buy a bigger hard drive to house your font collection. <br> <br>11. You spend days developing elaborate font classification schemes for your font files. <br> <br>12. You hate it when you know a font, but someone ID's it before you do. <br></p>"
    html_clean: "<p>Just for a laugh, my last post to Mark (and his earlier comment about needing a 12-step program) prompted me to make the following List. Maybe some of you can suggest better/additional items? <br> <br> <br>These are the Twelve Warning Signs that you may be a Fontoholic (alt. spelling: Fontaholic): <br> <br>1. You dream about fonts. <br> <br>2. You tell other people (who could not care less) what font the menu is set in. <br> <br>3. You look at magazine ads to identify the fonts. <br> <br>4. You know the urls of over 10 font sites by heart. <br> <br>5. Your copies of font books are falling apart from being used. <br> <br>6. You know the names of over 20 type designers. <br> <br>7. You name things after your favorite fonts. <br> <br>8. It ruins your day when you can't think of the name of a font you KNOW you know. <br> <br>9. You hang out all day waiting for ID posts at newsgroups and forums online. <br> <br>10. You need to buy a bigger hard drive to house your font collection. <br> <br>11. You spend days developing elaborate font classification schemes for your font files. <br> <br>12. You hate it when you know a font, but someone ID's it before you do. <br></p>"
