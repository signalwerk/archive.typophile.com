    <p>There are, here on the Type ID Board, some recurring requests, which often haven’t a definitive answer or, being custom work, are followed by questions about available alternatives.<br>
    After the n-nth request, someone (usually Florian ;-) compiles a list of fonts in that particular style.<br>
    But these useful lists get buried under the subsequent hundreds of similarly “Please ID this font”-titled threads, making it difficult to find and refer to them.<br>
    So, here I would like to compile a list of such lists, with proper descriptions, for easier access and discoverability.</p>
    <p>Please add any comprehensive list you’re aware of, or create a new one ;-)<br>
    Also, feel free to suggest appropriate keywords.</p>
    <p><strong>So, in no particular order, some lists:</strong></p>
    <p>The Fat Font Fad list, by Stephen Coles<br>
    Keywords: ultra bold, extra black, filled counters<br><a href="http://typophile.com/node/42643">http://typophile.com/node/42643</a><br>
    Related link: <a href="http://fontfeed.com/archives/extra-bold-ultra-black-fonts/">http://fontfeed.com/archives/extra-bold-ultra-black-fonts/</a></p>
    <p>The Fashion Thin and its Ilk list, by Florian Hardwig<br>
    Keywords: thin stressed sans, Noir<br><a href="http://typophile.com/node/67084#comment-394345">http://typophile.com/node/67084#comment-394345</a></p>
    <p>The Unsteady Pen list, by Riccardo Sartori<br>
    Keywords: handwritten, Strangelove, Where the wild things are, unconnected, casual printed, sketched<br><a href="http://typophile.com/node/80075#comment-456211">http://typophile.com/node/80075#comment-456211</a><br>
    Related: <a href="http://typophile.com/node/62921#comment-372169">http://typophile.com/node/62921#comment-372169</a></p>
    <p>The Oh, Shiny! list, by Florian Hardwig<br>
    Keywords: beveled, 3D, dimensional, prismatic<br><a href="http://typophile.com/node/62252#comment-395927">http://typophile.com/node/62252#comment-395927</a><br>
    Related links: <a href="http://new.myfonts.com/search/beveled/fonts/">http://new.myfonts.com/search/beveled/fonts/</a><br><a href="http://www.letterheadfonts.com/tutorials/prismaticeffects/index.php">http://www.letterheadfonts.com/tutorials/prismaticeffects/index.php</a></p>
