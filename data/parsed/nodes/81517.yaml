      <p>Thank you all for the additions! :-)<br>
      I’m with Florian about the extemporaneous nature of these lists and that just few would be really wiki material.<br>
      (Plus, as Craig notes, they will need to be linked here anyway, because wiki entries aren't really discoverable.)</p>
      <p>About FontShop’s FontLists: they’re indeed useful (and decidedly an inspiration for this very thread). There often is a thread which starts from one of these and adds to them, for example:</p>
      <p>The Spurless Sans list, collective<br>
      Keywords: Ubuntu, Prokyon<br><a href="http://typophile.com/node/68016">http://typophile.com/node/68016</a></p>
      <p>Another less, if ever, used external resource would be MyFont’s Albums (example: <a href="http://new.myfonts.com/users/dtk5k4mb2g/albums/207781/">http://new.myfonts.com/users/dtk5k4mb2g/albums/207781/</a>). Admittedly, the fact that they’re less curated, make them less useful.<br>
      And they share the same shortcoming of FontShop’s lists: being limited to one retailer offerings.</p>
