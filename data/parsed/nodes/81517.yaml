      <p>How about we actually come up with semantically informative names (categories), as opposed to clever band names? Rhetorical question: To a newb, who is this “Steven” guy? That’s not very helpful (the section name, not Steven. He actually introduced me to Mike Parker. Thank you for that. You’re right, Mike tells great stories.).</p>
      <p>riccard0 raised a good point, but there is another aspect that people seem to be overlooking.</p>
      <p>We can easily make a (Wiki?) section with categories and examples. Just like <a href="http://www.fontshop.com/fonts/category/">FontShop’s category section</a> which we can update over time.  <em>However</em>, people will still post in the ID section, and end up getting buried list-like responses.</p>
      <p>Solution?</p>
      <p>A single new board for “What are some fonts similar to this?” requests. This removes them from the ever-burying ID board. Then, on the afore mentioned “Similar” board, more experienced Typophiles can simply point the poster to the correct Wiki section. Problem solved. </p>
      <p>And there’s a hidden bonus to this solution: <em>If</em>, in the initial post there is an actual ID request, <em>and</em>, it gets solved (followed by list-like responses, the initial problem statement), <em>then</em>, the ID can be added to the Wiki.  Now, <a href="http://www.youtube.com/watch?v=xos2MnVxe-c">the Wiki grows on its own</a>!</p>
      <p>Remember, people will always be posts on the wrong boards. There’s nothing we can do to prevent this 100%. This issue can only be addressed through moderation, and moving threads.</p>
      <p>See also — <strong><a href="http://typophile.com/node/95527">Typophile to do:</a></strong></p>
