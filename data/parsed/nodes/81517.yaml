      <p>Florian, you picked the two Font ID Guides that I would also have called illustrated lists: Lined Fonts and Bauhaus-style. </p>
      <p>I would also suggest that the <a href="http://bowfinprintworks.com/SerifGuide/serifsearch.php">Serif Font ID Guide</a> has usefulness as a variety of illustrated lists related to Serif fonts: you can show all fonts by a particular designer, from a particular foundry, or with certain structural features, such as crossed W, M's with no top serifs,  and g's with open bowls ( to name just a few lists that could be displayed).</p>
      <p>- Mike Yanega</p>
