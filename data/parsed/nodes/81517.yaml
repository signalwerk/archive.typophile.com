      <p>Craig,<br>
      yes, if you want to, feel free to transfer these lists to the Typowiki. The reason why I didn’t do that myself is that I don’t see much benefit, except that maybe it is easier for others to add to the lists. Most of these lists were created ad hoc, by and for the members of the Type ID Board. I don’t want this to become bureaucratic, and to argue with others whether the lists were academic/complete/useful enough to be included in the Typowiki – which, by its encyclopedic nature, is regarded as a place that is a little more formal and authoritative than the quick notes and comments in the threads. Nor do I want to keep them tidy (or even restore them), after they eventually get vandalized. Still, some of them (optical sizes, grades) are predestined to become a helpful Wiki entry.</p>
      <p>Mike,<br>
      true, your <a href="http://www.bowfinprintworks.com/">Bowfin Printworks</a> website holds a lot more information and tools that are of great use to typeface IDers. Thank you for providing and maintaining it! Your <a href="http://www.bowfinprintworks.com/ScriptIDGuide.html">Script ID Guide</a> is one of my favorite ID resources.<br>
      This brings us to the question what the focus of this thread should be: Ready-made lists (be they curated or collectively compiled, illustrated or not) only, or rather all kinds of ID resources? The Serif Font ID Guide can be used to create lists, but it is more a filter tool, like <a href="http://www.identifont.com/identify.html">Identifont’s ‘by appearance’ questionnaire</a>, or MyFonts’ Advanced Search that lets you create a list of <a href="http://new.myfonts.com/search/tag%3Ascript+designer%3A%28Matthew+Carter%29/fonts/">scripts by Matthew Carter</a>, for example.</p>
