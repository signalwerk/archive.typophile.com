    html: <p>Gray’s book was among those I donated to the UVA library. The University of Maryland in College Park houses the Maurice Annenberg collection of type specimen catalogs, which is quite extensive. The New York Public Library is supposed to have a large collection of specimen books, also, but I haven’t seen it.</p>
