      <p><a href="http://www.oakknoll.com/detail.php?d_booknr=60132" title="http://www.oakknoll.com/detail.php?d_booknr=60132">http://www.oakknoll.com/detail.php?d_booknr=60132</a><br>
      Very interesting book, but the quality of reproductions is poor.</p>
      <p>Nineteenth Century Ornamented Types and Title pages (Faber &amp; Faber 1938, 1951, 1976), By Nicolette Gray:<br>
      <a href="http://www.ebay.com/itm/19th-Nineteenth-Century-Ornamented-Types-Nicolette-Gray-Victorian-typefaces-font-/110972571664?pt=Antiquarian_Books_UK&amp;hash=item19d67b1010" title="http://www.ebay.com/itm/19th-Nineteenth-Century-Ornamented-Types-Nicolette-Gray-Victorian-typefaces-font-/110972571664?pt=Antiquarian_Books_UK&amp;hash=item19d67b1010">http://www.ebay.com/itm/19th-Nineteenth-Century-Ornamented-Types-Nicolet...</a><br>
      Sure it’s expensive, but one thing you’re paying for is the fact that the reproductions are made from line blocks, size as.</p>
      <p>Google book:<br>
      <a href="http://www.galleyrack.com/images/artifice/letters/press/noncomptype/typography/fry/fry-1816-google-bodleian--specimen-of-printing-types.pdf" title="http://www.galleyrack.com/images/artifice/letters/press/noncomptype/typography/fry/fry-1816-google-bodleian--specimen-of-printing-types.pdf">http://www.galleyrack.com/images/artifice/letters/press/noncomptype/typo...</a><br>
      This really demonstrates the problem with reproductions, there is nowhere near enough resolution, never mind the ﬂatness of the image.</p>
      <p>I think you would be better to go to a rare-book library, they are likely to have a type specimen section.</p>
