      <p>Yes, the width and proportions in the smallcaps are indeed much better. I say scale them up, and use them as a mask to adjust the uppercase. </p>
      <p>The bottom bowl of g is too large and I don't really like the shape of the bowl in a. I think it should be more horizontal. Next time perhaps also upload some text samples? Numerals are quite good, but I think 8 needs some 'squarishness'. The horizontals in z look too thin and the overall width of the lc is quite condensed. You could try just scaling the whole thing (including original caps) horizontally. This would also increase the contrast, but I don't know if that's a bad thing. Keep going!</p>
