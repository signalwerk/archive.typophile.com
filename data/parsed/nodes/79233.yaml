    html: |-
      <p>Thank you very much for your response. </p>
      <p>1996type: I agree to H U N being too narrow (especially U!) and L being a bit wide, I’ll fix this.</p>
      <p>frode frank: There is overshoot, but probably too little. The Extrabold is very clumsy, yes but I don't really know what to do about it. My plan was to do a multiple master (it's the topic of the course), that's why I chose such a extreme weight.</p>
      <p>eliason: I agree on J, tail (or what do you call it?) could be longer, not sure about b, d, p, q, but i'm definately not cool with g, yes the bowl is kind of wide and the shape itself is bad I think. I think the balance of the M is fixed by slanting the outer strokes a bit, plus maybe narrow the middle counter a bit, so the letter doesn’t get too wide. About the osf: I probably should, shouldn’t I?</p>
      <p>///</p>
      <p>I got in a rush today and yesterday night and did numerals in capital height and a set of small caps. The weight of the small caps is a bit too heavy, as seen when mixed with normal text in the new PDF. However, I like the small caps much better than the orfinary capitals (they are a bit wider). I'm considering reducing the capital height a bit to make the capitals look less condensed and a bit more like the small caps. Maybe even reduce the ascenders and descenders a bit.</p>
      <p>Thank you all again for you thoughts, It's really valuable to me. It's now 7am – I really need to go to bed. ;)</p>
      <p>Best regards,<br>
      Phillip</p>
