    <p>During a typedesign-course at university, I started to develop this typeface, which is meant to have kind of a nordic touch to it.<br>
    The most basic characters are in it, but I feel it could be a lot better, so I'm looking for critique to eliminate errors and overall spice it up a notch.</p>
    <p>I've started making a bold (or extra bold) version but feel, that the regular should really shine before putting all the effort in doing different weights.</p>
    <p>What do you think? Any suggestions, critique and comments are highly appreciated.</p>
