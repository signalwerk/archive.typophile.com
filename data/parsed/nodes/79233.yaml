      <p>Needs some polishing but it's a pretty likeable start.<br>
      /J/ looks narrow to me. /b/d/p/q/ may be a bit narrow too. /g/'s bowls look quite wide compared to other letters.<br>
      Terminal on /r/'s arm looks a bit harsh.<br>
      Is there a way to adjust /M/ so that its middle counter isn't so outsized relative to the two side counters?<br>
      Would you consider making the "x-height" of the oldstyle figures a little bigger than that of the letters?</p>
