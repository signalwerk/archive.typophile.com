    html: <p>Jim, there is actually a plain version of Arial, with cleanly truncated stems, which looks quite "similar" (as you requested) to Arial Rounded. <br> <br>So, if you were to use that typeface, your work would be different, even though it looked the same! <br> <br>Best of all, it's free, so you don't have to pay onerous licensing fees.</p>
