    html: |-
      <p>I'm a little late to the discussion, but I like the use of Myriad with the logo for precisely the reason others have given for not liking it — it's generic. </p>
      <p>Other typefaces might work just as well, but sometimes a good, generic typeface is preferable to one with a stronger or more distinctive personality. In this instance, the focus should be on the logo (the symbol), which is where the dynamic personality in the composition should be. The main purpose of the typography is to communicate the name of the company and do so in a way that supports the logo, which Myriad does nicely. Myriad is a well- designed typeface (even though it's sort of a Frutiger copy). It's highly legible, and it has a soft, friendly, business-like quality to it. It also doesn't compete with the logo by introducing a conflicting personality. Like I said, other typefaces could work just as well, but I wouldn't discount Myriad due to it being too generic.</p>
