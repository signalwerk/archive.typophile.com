    html: <p>From a design standpoint I agree with the others that it is generic and common looking. I do like the actual logo but your typeface choice is what drags it down. You and your partner(s) should look at the direction of your company and what image you are trying to project to potential clients—upscale, modern, traditional, whatever you intend your business to represent. There are thousands of typefaces out there that could probably do a better job of illustrating your company's identity—once you decide what it is—than Myriad (I believe that is what you are using).  Kevin, this is your company's identity and using a designer might be a prudent decision on your part. The right branding for your future would be worth it.</p>
