      <p>Try joining the beak and the two tittles with a wavy tilde form.<br>
      But I'm not sure you need anything at all. In Romanian there must<br>
      be 3-letter (and maybe even 4-letter) combinations that are more<br>
      common than "fii" - will you be ligating those? :-)  Frequency isn't<br>
      the only thing that matters of course; in some designs even the "fi"<br>
      should avoid ligation.</p>
      <p>hhp</p>
