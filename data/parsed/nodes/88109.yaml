    <p>In Romanian, the letter-combination fii is quite common, perhaps very common. This might look odd when set as fi-ligature + i. Has anyone seen an fii-ligature? Or thought about this before? Below is an example from one of my typefaces. Doesn't this look slightly off? It may soon be equipped with such a ligature, but I'd really like other designer's views on this, if any.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fiintele_3954.png"></div><p></p>
  html_clean: |-
