    html: <p>I think moving the tittle left might make /fii/ in itself look better, but at the same time that rightward straying tittle as-is helps the eye break out of the ligature, which has its own "gravitational force" due to its natural weight. So I think regularizing the alignment might solve one problem but create another. Or at least I'd be on the lookout for that as you experiment.</p>
