    html: <p>You may be right. I just reacted to the shape when I saw it on a test print, 10/12 points, offset. But I can't make exceptions for everything, I already have a ridiculous amount of ligatures (and that is after throwing out more than half of them) and too many kerning pairs. Thank you, all contributors, for taming my completist lunacy.</p>
