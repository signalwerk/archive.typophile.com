      <p>Yes, but then a font, that contains an additional (to the i.sc/I.smcp) dotlessi.sc, should also contain an additional (to the I) Dotlessi, shouldn’t it? I mean, the scenario could be, that someone types in an i.sc from the glyph panel. In Indesign this automatically activates the sc feature, as far as I know. And when the user manually deactivates the sc feature, the application replaces i.sc by i, but not dotlessi. But the same problem would appear, when the user types in the capital I. The I is replaced by the i, but not by the dotlessi, when the user converts capital letters to small ones. So, either a font should contain both, dotlessi.sc and Dotlessi or none of them. At least this sounds consequent and logical to me.</p>
      <p>And if a font contains I, Dotlessi, i.sc and dotlessi.sc, there is the danger, that the user messes both up, if he selects one of the characters from the glyph panel.</p>
      <p>Yesterday I removed the dotlessi.sc from a font and now I don’t know, if I shall undo that step.</p>
