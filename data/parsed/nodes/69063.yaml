  html: <p>Why does Minion contain a dotlessi.sc? Is there any good reason – any advantage – to put a dotlessi.sc into a font, that contains small caps? I mean, Minion does not contain a Dotlessi. It would be only consequent to double not the i.sc only, but also the I.</p>
