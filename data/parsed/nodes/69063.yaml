    html: |-
      <p>Arno, </p>
      <p>1. Minion Pro has been revised several times. It's best to look at more recent versions, e.g. Minion Pro version 2.0. </p>
      <p>2. We at Fontlab Ltd. also think that it's a good idea to duplicate the small cap glyphs, though we recommend naming the glyphs "A.c2sc" and "a.smcp", which makes clear what their purpose is. Since PDF applications often need to parsing glyphnames to recreate the original text string (when searching or copy-pasting), keeping separate glyphname prefixes for glyphs that semantically represent uppercase or lowercase letters allows better text accessibility. </p>
      <p>3. Currently, the recommended way to deal with Turkish letters is to duplicate "i" as "i.TRK" and place the substitution into the "locl" feature:<br>
      <code>feature locl {<br>
      language TRK;<br>
      sub i by i.TRK;<br>
      } locl;</code></p>
      <p>Then you have five glyphs for Unicode characters: I, Idotaccent, i, i.TRK, dotlessi. And you have five smallcap glyphs: I.c2sc, i.smcp and dotlessi.smcp (all identical, without a dot), as well as Idotaccent.c2sc and i.TRK.smcp (identical, with a dot). </p>
      <p>In "c2sc", you use the substitutions:<br>
      <code>feature c2sc {<br>
      sub I by I.c2sc;<br>
      sub Idotaccent by Idotaccent.smcp;<br>
      } c2sc;</code></p>
      <p>In "smcp", you have the substitutions:<br>
      <code>feature smcp {<br>
      sub i by i.smcp;<br>
      sub i.TRK by i.TRK.smcp;<br>
      sub dotlessi by dotlessi.smcp;<br>
      } smcp;</code></p>
      <p>Adam</p>
