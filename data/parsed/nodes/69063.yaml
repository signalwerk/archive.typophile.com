      <p>@ Chris</p>
      <p>Minion substitutes dotlessi by dotlessi.sc (class "smcp3" by "smcp4") in the smcp feature, but dotlessi.sc is not present in the c2sc feature. It neither is present in any class substituted in the c2sc feature nor it is directly listed in a substitution rule of the c2sc feature. This is what I had expected, because it would not make sense to substitute I by dotlessi.sc, maybe except from Turkish.</p>
      <p>And I just see (in the Minion feature file, that Adobe provides along with the AFDKO), that Minion contains two different sc classes, a small letter sc class and a capital letter sc class, but a.sc is the same as A.sc for example. I don’t understand that. Isn’t that totally overdone?</p>
