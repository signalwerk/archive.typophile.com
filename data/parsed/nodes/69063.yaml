    html: |-
      <p>@ Adam</p>
      <p>Thanks!</p>
      <p>But seriously, with regard to the suffix I totally loose the overview, if dotted letters "i" are called i (no suffix), Idotaccent (suffix: dotaccent) and i.TRK (suffix: .TRK).</p>
      <p>And while I can understand, that it is necessarily to have an additional dotted i in the font, I don’t understand, why there are Idotaccent.smcp and (!) i.TRK.smcp. Where is the disadvantage in the following code?:</p>
      <p>feature locl {<br>
      language TRK;<br>
      sub i by <strong>idotaccent</strong>;<br>
      } locl;</p>
      <p>feature c2sc {<br>
      sub I by <strong>i.smcp</strong>;<br>
      sub Idotaccent by <strong>i</strong>dotaccent.smcp;<br>
      <strong>sub Dotlessi by dotlessi.smcp; #*****Additional line (and additional character)!*****</strong><br>
      } c2sc;</p>
      <p>feature smcp {<br>
      sub i by i.smcp;<br>
      sub <strong>idotaccent by idotaccent.smcp;</strong><br>
      sub dotlessi by dotlessi.smcp;<br>
      } smcp;</p>
      <p><strong>Or alternatively this, without dotlessi.smcp and Dotlessi:</strong></p>
      <p>feature locl {<br>
      language TRK;<br>
      sub i by <strong>idotaccent</strong>;<br>
      } locl;</p>
      <p>feature c2sc {<br>
      sub I by <strong>i.smcp</strong>;<br>
      sub Idotaccent by <strong>i</strong>dotaccent.smcp;<br>
      } c2sc;</p>
      <p>feature smcp {<br>
      sub i by i.smcp;<br>
      sub <strong>idotaccent by idotaccent.smcp;</strong><br>
      sub dotlessi by <strong>i.smcp</strong><br>
      } smcp;</p>
      <p>I mean, isn’t Adobe’s actual way a half baked thing with regard to the symmetry of dotlessi?</p>
      <p>And why is there a need for doubling the whole alphabet ([a.smcp-z.smcp] and {!} [A.c2sc-Z.c2sc]), if the glyphs are the same?</p>
