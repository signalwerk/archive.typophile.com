    html: "<p>Highly recommended: Scribble Papers. <br> <br>It's an extended editor, more like a cardbox. I quit using editors like notepad for text transfers to InDesign altogether because this little program is so extremely useful. Best thing is that you can collect all texts for a project at single pages each in one folder without having to save each single file separately. Of course you can export the pages or folders as well, if you prefer. Can't imagine ever living without ... <br> <br>At the moment it's in german, but there are icons, too, and actually you don't need the menu, because if you're accustomed to work with windows explorer, you'll understand scribble papers as well. <br> <br><a href=\"https://web.archive.org/web/20080708213531/http://www.scribblepapers.de.vu/\" target=\"_blank\">http://www.scribblepapers.de.vu/</a></p>"
    html_clean: "<p>Highly recommended: Scribble Papers. <br> <br>It's an extended editor, more like a cardbox. I quit using editors like notepad for text transfers to InDesign altogether because this little program is so extremely useful. Best thing is that you can collect all texts for a project at single pages each in one folder without having to save each single file separately. Of course you can export the pages or folders as well, if you prefer. Can't imagine ever living without ... <br> <br>At the moment it's in german, but there are icons, too, and actually you don't need the menu, because if you're accustomed to work with windows explorer, you'll understand scribble papers as well. <br> <br><a href=\"https://web.archive.org/web/20080708213531/http://www.scribblepapers.de.vu/\" target=\"_blank\" class=\"link-external\">http://www.scribblepapers.de.vu/</a></p>"
