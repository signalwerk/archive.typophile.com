    html: <p>TextWrangler always, SubEthaEdit sometimes and Pages (gasp!) for pointedly <i>not</i> using Word, not choosing to annoy myself and to have a bit of fun while I'm at it. <br> <br>Pico when pressed. Please don't say vi or emacs. <br> <br>Web input forms. Especially in OmniWeb 5. <br> <br>All that said though... with most of the text that I handle, it seems people don't <b>edit</b> their text, text editor or not.</p>
