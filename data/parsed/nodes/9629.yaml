  html: |-
    <p>I am curious about the text editors that people use. Does anyone still use Word or are the notepad style editors all the rage? Also, has anyone had success with a barebones text editor for Windows? My current workflow looks like this: <br>  -Word for text input <br>  -apply styles to inline quotes, headings etc. and save as .rtf <br>  -import into Indesign with analogous paragraph styles set up <br> <br>I would like to take Word out of the loop as it eats up a lot of ram and is often unstable.</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20080708213531/http://www.typophile.com/node/18532" class="topic-previous" title="Go to previous forum topic">‹ Back to the Futura</a> <a href="/web/20080708213531/http://www.typophile.com/node/18540" class="topic-next" title="Go to next forum topic">I see, you see, we all see for an Iced T ›</a></div>
