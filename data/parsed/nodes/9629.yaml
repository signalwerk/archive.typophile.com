    date_raw: 7.Mar.2005 4.26pm
    votes: null
    html: <p>The best text editor I've ever used is my beloved <a href="https://web.archive.org/web/20080708213531/http://www.ultraedit.com/">UltraEdit</a> (for Windows). Adam Twardoch also swears by it. <br> <br>I use Notepad for testing complex script OpenType fonts, because there is less application architecture between the font and the output, so it is a more reliable environment to confirm exactly what the Uniscribe text engine is doing for a given writing system.</p>
