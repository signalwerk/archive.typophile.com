    html: <p>Bob's find of Yorkville is as close as I have seen. But, based on a reasonably thorough search, my opinion is that this probably does not exist as a publicly available font. In particular I have not spotted the combination of a vertical leg on the _R_ like Helvetica but without the little kick at the bottom, _G_ with a rounded lower rhs and no spur like a compressed Futura, _W_ with a vertex that is at only about two-thirds of the letter height, and an _S_ with extended terminals similar to Helvetica. Plus the the base of _A_ is as wide as _O_.</p><div class="imageWrap"><img src="http://typophile.com/files/UnknownSansTypophile117504D_6116.jpg"></div> Futurvetica anyone?<p></p>
    html_clean: <p>Bob's find of Yorkville is as close as I have seen. But, based on a reasonably thorough search, my opinion is that this probably does not exist as a publicly available font. In particular I have not spotted the combination of a vertical leg on the _R_ like Helvetica but without the little kick at the bottom, _G_ with a rounded lower rhs and no spur like a compressed Futura, _W_ with a vertex that is at only about two-thirds of the letter height, and an _S_ with extended terminals similar to Helvetica. Plus the the base of _A_ is as wide as _O_.</p><div class="imageWrap"><img src="/files/unknownsanstypophile117504d_6116.jpg"></div> Futurvetica anyone?<p></p>
