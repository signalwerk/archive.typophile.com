  html: |-
    <p>I was sent these samples and I am having no luck finding the font. The 'a' is the oddest thing, and the slightly angled terminals on the h, t and l. I started thinking the 'a' may have been customized to disguise the font's origin. I was hoping the counters of the p and g would help ID it, but got nowhere so far.</p>
    <p>Anyone recognize this?</p>
    <p>Thanks,<br>
    - Mike<br>
