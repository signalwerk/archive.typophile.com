    <p>Over breakfast this morning I was thinking about old radio and movie companies, as well as travel companies that all had globes for logos that were stretched horizontally with the lettering running across the 'equator' if you like. </p>
    <p>The problem now that I'm at my desk - I don't know that names of any said studios so don't actually know what to search for.</p>
    <p>Does anything spring to mind?!</p>
