    html: |-
      <p>Since these are pure symbol fonts and <em>deliberately</em> do not have Unicode values assigned to them, there is no way you can use a 'substitute' font ... On my Mac, all Webdings and Wingdings glyphs are encoded into the Unicode PUA.</p>
      <p>On the other hand, the entire Zapf Dingbats set <em>has</em> been mapped into UC, so these characters can be used "safely". Zapf Dingbats characters, or at least things that look exactly alike, appear in Arial Unicode MS from position U+2701 onwards, as well as correctly encoded in Zapf Dingbats (the fat parentheses are mapped to regular parentheses; from the scissors on, they are mapped similar to Arial UC).</p>
      <p><em>.. the glyph order of Wingdings is patented by Microsoft.</em></p>
      <p>Fortunately they didn't do that for Arial and TNR! :-D</p>
