    html: |-
      <p>Frank, </p>
      <p>the obvious solution is to use a webfont that includes smallcap glyphs in both uppercase and lowercase positions. </p>
      <p>Also, please note that the <a class="freelinking external" href="http://dev.w3.org/csswg/css3-fonts/#small-caps" rel="nofollow">CSS3 Fonts proposal</a> introduces the <code>font-variant-caps: small-caps</code> and <code>font-variant-caps: all-small-caps</code> properties to access OpenType Layout smallcaps, and also modifies the description of <code>font-variant: small-caps</code> to try OpenType Layout smallcaps first, and only apply uppercase downscaling as a fallback. Of course, it will take considerable time before this gets introduced. </p>
      <p>Regards,<br>
      Adam</p>
