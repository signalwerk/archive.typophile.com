    html: |-
      <p>@frode</p>
      <p>You've brought up an interesting problem that calls for an interrim solution because - as Adam observed - it's going to be a good long while before the specs and browser implementations make it clear how to handle small-caps.<br>
      As you said, right now, most browsers deal with it by synthesizing small-caps.<br>
      I haven't looked into solutions to this problem but I did read somewhere that wherever font-variant small-caps is used, text-decoration:uppercase should also be specified.<br>
      If I can remember the page where that advice was dispensed, I'll come back with the link.<br>
      I believe the point of doing that is to, at least, force uppercase in those browsers that don't synthesize. I haven't checked out the wisdom of that advice, I'm just passing it along - FWIW.<br>
      For now, it's certainly clear that using a separate small-caps font is a necessity.<br>
      That much is clear.</p>
      <p>Regards,</p>
      <p>Rich</p>
