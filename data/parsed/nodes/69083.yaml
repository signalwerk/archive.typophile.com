    html: |-
      <p>Adam: <em>..There are no Unicode small caps ..</em></p>
      <p>Frode: FYI, there <em>are</em> a number of small caps characters defined in Unicode, but these describe the form, rather than the function. The <em>function</em> is for phonetic transliteration of certain speech forms, and these are not to be confused with "regular characters in a small caps form".</p>
      <p>Unicode does not define any font appearance at all -- italics, bold, underline, outline, and so on.<br>
      It has the advantage that this, combined with a Small Caps <em>feature</em>, will copy a small caps text from a PDF in its original 'lowercase' form. If the font has a c2sc (Caps to Small Caps) feature, the original case of the text will be preserved.</p>
