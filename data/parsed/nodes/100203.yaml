    html: |-
      <p>The thing is, you don't actually <em>buy</em> a font (unless you commission a custom typeface) you merely license it, according to certain terms. See section 3 here:<br>
      <a href="http://www.fontbureau.com/help/singleuserlicense/" title="http://www.fontbureau.com/help/singleuserlicense/">http://www.fontbureau.com/help/singleuserlicense/</a></p>
      <p>Things used to be more lenient, but sadly no-mod clauses have become the norm now. I say sadly, because I believe it's disrespectful of the precedents any type design is inescapably based on.</p>
      <p>FYI, Adobe is one of the few foundries that still allows modification. If you're likely to want/need to modify a typeface, buy Adobe. Unless you're like me and you think it's worth taking a risk/responsibility anyway.</p>
      <p>hhp</p>
