    <p>I'm looking for what would basically be Hellenic Bold. A version of the font that is not quite so wide. </p>
    <p>Dispatch extended is a bit more narrow, and closer to what I am looking for, but not quite there yet.<br>
    <a href="http://www.myfonts.com/fonts/fontbureau/dispatch/" title="http://www.myfonts.com/fonts/fontbureau/dispatch/">http://www.myfonts.com/fonts/fontbureau/dispatch/</a></p>
    <p>Any thoughts? I'm thinking it may be easiest to just modify Dispatch.</p>
