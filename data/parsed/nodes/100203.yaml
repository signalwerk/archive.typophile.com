      <p>I'm surprised Hellenic doesn't have a narrow version.</p>
      <p>BTW modifying Dispatch violates its EULA. Frankly I'm personally not against that sort of thing, as long as: you make dead sure it doesn't leave your drive; if it does leak out, be prepared to face the consequences. Also, make sure you don't just do a mechanical narrowing - all kinds of things will go wrong.</p>
      <p>hhp</p>
