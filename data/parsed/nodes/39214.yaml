    html: |-
      <p>Yeah, but the basic statement is kinda wrong.<br>
      Why should everyone (that is, every OS X user) <em>have</em> to buy a new Helvetica Neue?<br>
      The version of Helvetica Neue that ships with OS X is a TrueType version from Linotype. Apple only repackaged it as a .dfont.</p>
      <p>And why this arbitrary differentiation of ‘creative fonts’ and ‘system fonts’? As if the latter was in some dubious extra file format that cannot/may not be used for screen or print design…</p>
      <p>Why should I have to licence it from Linotype (or Adobe, being a reseller – no?) again? That was paid with the OS X license.</p>
      <p>Those who need to work with several versions of Helvetica (Neue) and are afraid of a jumble, they need a proper font management. But then, who doesn’t, anyway?</p>
