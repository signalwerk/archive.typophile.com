  html: |-
    <p>For young font makers, who want to marry, and also for punch-cutters, who want to undertake the risky adventure of a marriage, I uploaded a hires scan of a beautiful large-scale Renaissance woodcut-flyleaf by Hans Sachs dated 1549 and cut in a Schwabacher blackletter typeface.</p>
    <p>Top half of flyleaf: Woodcut with this heading:<br>
    <strong>"A useful advice to those apprentices who want to marry"</strong><br>
    see <a href="http://www.sanskritweb.net/fontdocs/hans-sachs-rat1.gif" title="http://www.sanskritweb.net/fontdocs/hans-sachs-rat1.gif">http://www.sanskritweb.net/fontdocs/hans-sachs-rat1.gif</a></p>
    <p>Bottom half of flyleaf: Poem with this heading:<br>
    <strong>"Advice concerning three types of marriage"</strong><br>
    see <a href="http://www.sanskritweb.net/fontdocs/hans-sachs-rat2.gif" title="http://www.sanskritweb.net/fontdocs/hans-sachs-rat2.gif">http://www.sanskritweb.net/fontdocs/hans-sachs-rat2.gif</a></p>
    <p>The three types of marriage for punch-cutters are these:<br>
    - Firstly, marriage of a young and beautiful, but poor maiden.<br>
    - Secondly, marriage of a rich widow, who was married once.<br>
    - Thirdly, marriage of a very rich widow, who was married twice.<br>
    Guess, which type of marriage is considered by Hans Sachs as least troublesome for font-makers and punch-cutters?</p>
