      <p>Steven, all of those books you just mentioned are great. Read them and then read them again. Don’t forget to question them, or at least notice when they start to question each other (Willberg vs. Otl Aicher, for instance, in <em>Typolemik/Typophil</em>).</p>
      <p>We have a collection of three “must reads” here that we call the <a href="/wiki/Triumvirate" class="wiki">Triumvirate</a>. All of them are good, and Paul just mentioned one (<em>The Elements of Typographic Style</em>). The Triumvirate is more a recommendation for how to make type and/or use it well, not necessarily on how to mix it. </p>
      <p>A good basic primer on type styles and how to mix them is a book by Erik Spiekermann, which you can read either in English (<em>Stop Stealing Sheep and find out how type works</em>) or in German (<em>ÜberSchrift</em>).</p>
