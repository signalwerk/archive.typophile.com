    html: <p>The more I think about this question — not that it occupies every waking moment — I have to suggest you do something else. Instead of relying on one author’s suggestions for good type combinations you could (should?) explore the books all around the bookstore. What strikes you as working? Find books that you perceive to have good type combinations. Using you own instinct, even if at first you rely upon what you think others are doing well, will give you much more interesting results than what you will find in one or two books which will probably only show a small percentage of the type which is actually available for use.</p>
