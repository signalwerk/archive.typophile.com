      <p>Type mixing, like cooking or music, will never be an exhausted topic (I mean to say — though you may get exhausted or bored to death, the subject itself will never run out).</p>
      <p>There are fundamental principals, stylistic preferences, “safe approaches” and dangerous but exciting breaks from the norm.</p>
      <p>Again, like learning to cook or playing music, the fundamentals will allow you to explore safely until you can build enough confidence to try something new with type.</p>
      <p>The major difference over the last ten years or so, is that exploring different type combinations is easier especially if the fonts are already part of your library. Switching types is now a simple menu option on Macs/PCs and not an expensive experiment like buying type output from the old typeshops of yore.</p>
      <p>If you do not have the typeface you are interested in using, try to find a pdf sample of text from one of the type vendor sites. Print it out and literally cut &amp; paste the (1200 dpi+) output next to other blocks of faces you are considering. Like cooking... add an ingredient or spice sparingly at first... sample it, then season to taste.</p>
      <p>A good meal is a good meal — but creating a great meal is something we all would love experiencing. (Gee, I’ve been on Weight-Watchers for two months now... I wonder if it has affected my thinking?)</p>
      <p>BTW — Type mixing could be one of several topics to explore during TypeCon’s Type Education sessions.</p>
