      <p>Coincidentally, <em>Stop Stealing Sheep</em> was the first type book I ever bought, quickly followed by <em>Elements</em>, Friedl’s <em>Typography</em> tome (which technically was a gift, not a purchase), and Tschichold’s <em>Die Neue Typographie</em>, in the English translation, though.</p>
      <p>The last book on typography that I have purchased to date was <em>Arabic Typography</em>, by Huda AbiFares. But I’ve received several books as gifts since. I have no idea what the next book I buy will be, but I’m already looking forward to it, whatever it is ;-)</p>
