      <p><em>The top height of capital letters of Latin typefaces should be 70% (+/- 5%) of the font grid.</em></p>
      <p>This is not a technical requirement.<br>
      The idea that cap heights should be fairly consistent between faces is spurious, as there are many factors that may come into play when one mixes typefaces on the same line, and often relative x-height is more important. </p>
      <p>However, without trying out combinations of Cleartype fonts in a page layout, I wouldn’t want to stick my neck out further.</p>
      <p>Are the Cleartype fonts intended to be used with one another? How far was this a criterion of the development process?<br>
      It doesn’t seem to be much of a factor, given the format of “Now Read This” which, like the vast majority of type specimens, shows new faces in isolation.</p>
      <p>How do the bolds of Calibri and Corbel (as sideheads, for instance) work as contrast faces with Constantia and Cambria (for the rest of a text blocks)? Show that in a page layout, and you would have a more meaningful comparison than a row of letters.</p>
