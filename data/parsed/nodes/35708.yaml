      <p><em>It is obvious that Calibri in the left column looks much smaller than Arial in the right column, although the sample texts are typeset in the very same point sizes. How come that Calibri looks smaller than Arial? The answer is that the glyphs of Calibri do not sufficiently fill the 2048-grid of this TrueType font, as compared with Arial and Helvetica and similar fonts.</em></p>
      <p>The OS/2 WinAscent value in Arial is 1854 units. The tallest glyph in the Arial font is /Aringacute/, the top of which is at 2060 units. That means that more than 200 units of visible glyph in the Arial font falls beyond the WinAscent height, which means it will be clipped in all GDI applications and many printers. The uppercase Vietnamese diacritics in Arial are only kept within the vertical metrics by horribly squishing and distorting their shapes.</p>
      <p>Many of the world’s orthographies need greater vertical space than the inherited scaling and metrics of Anglo-American and western European font development. If you are making fonts that you anticipate being extended to support additional languages, the last thing you want to do is to make them too large on the body, since vertical metrics usually cannot be increased due to backwards compatibility and document reflow issues. This is the trap that Arial and many other core fonts fell into.</p>
    html_clean: |-
