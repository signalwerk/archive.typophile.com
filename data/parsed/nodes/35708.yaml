      <p>My advice would be to avoid “the weed” while posting to typophile. Also the “Americans” in question are Welsh, Irish, Pakistani, Engish and Canadian.</p>
      <p>Anyhow, in the process of adding Vietnamese to these fonts we did have issues with Cambria, whereas for Calibri and Consolas things went pretty smoothly. </p>
      <p>With respect to clipping it’s been our experience that printers do not clip, and that increasing leading mitigates the issue. I feel that for a document font clipping is preferable to having marks that crash together or crash into the base.  </p>
      <p>Cheers, Si</p>
