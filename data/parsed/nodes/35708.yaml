      <p>The question of Mr. Herrmann was whether you can substitute Arial etc. by Calibri etc. in as CSS, i.e. in a website cascading style sheet.</p>
      <p>The answer is NO, because the rendered point size of Calibri is much smaller than the rendered point size of Arial etc. due to the incorrect metrics of Calibri.</p>
      <p>I enlarged my initial calibri.pdf document by two additional examples:</p>
      <p>see new file <a href="http://www.sanskritweb.net/temporary/calibri.pdf" title="http://www.sanskritweb.net/temporary/calibri.pdf">http://www.sanskritweb.net/temporary/calibri.pdf</a></p>
      <p>The first new example shows mixing of Constantia with an Indic font with 300 units caps height.</p>
      <p>The second new example shows mixing of Constantia with Calibri with 3oo units caps height.</p>
      <p>These examples make it clear that you cannot use two fonts in the same text, if the two fonts do not have the same metrics.</p>
      <p>Mr. Lücke claims that “applications could well allow a typographer to define type size by x-height or H-height”. This is the typical “frog in the well” attitude shown by most Typophilers. Since most of them never learnt Indic scripts etc., they do not know that most non-Latin fonts do not have lowercase and uppercase letters. They behave like the Japanese fairy-tale frog in the well who know nothing of the rest of the world.</p>
