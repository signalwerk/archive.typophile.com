      <p>Cross-family consistency in the CT fonts was modelled on having identical vertical metrics in the OS/2 table, so that fonts from the different families could be used together on the same line of text without the interline spacing being distorted by the presence of a font with larger OS/2 metrics within a block of text. Since one of the prime targets for these fonts was MS Word, and we knew most users would not manually set interline spacing values but accept default linespacing, I still think this was a sensible decision.</p>
      <p>Cross-family <em>visual</em> consistency was aimed at by coordinating similar x-heights <em>not similar cap heights</em> (as Uli seems to want). Most text is in lowercase letters, not all caps, so coordinating cap height seems to me pointless and guaranteed to create inconsistent text colour unless all fonts have an indentical cap-to-x height proportion. If I recall correctly, the Constantia x-height is slightly shorter than the other CT fonts, and the Consolas x-height is slightly taller. But the others are very close.</p>
