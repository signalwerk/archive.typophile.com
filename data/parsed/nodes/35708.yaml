      <p><cite>The “body” is indeed a metal type term, otherwise known as the “shank”. In a piece of type, it’s the rectangular column of metal of which the letter shape forms the top part.<br>
      So “small on the body” means “small on the em square”, or, as you might say, “small on the grid”.</cite></p>
      <p>Thanks for the explanation. Now that I know how you define the term “body”, I made three experimental fonts. Here is the result of my tests.</p>
