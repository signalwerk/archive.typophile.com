      <p>Uli, from what rule book did you get your pronouncement about the cap height of typefaces? There’s not much call for lines of all caps, in mixed fonts of any kind; there is common use of different styles of the same design in the same line. X-height is indeed a more useful alignment. Have you taken up grunge typography? Sounds like another pointless opportunity to whine. And you didn’t address the actual question, which pertains to web use. Since the CT fonts were made much later than Georgia/Verdana, and some of them have much larger, more diverse character sets (see Cambria math), perhaps there is something you are missing. For starters, I suggest you look beyond the designer’s “capabilities” to the client’s specifications. None of the CT designers acted in a vacuum.</p>
