      <p>I’m working on a super family at the moment, where the x-height of the sans and serif regular fonts are different.<br>
      My decision is based on the way people use type in layouts.<br>
      Generally, different weights and styles are more likely to be contrasted in adjacent paragraph blocks than in adjacent words in the same line. So the important thing is to give your types proportions which create harmony in that kind of usage.</p>
      <p>But as I’ve said, I haven’t worked with the Cleartype fonts.<br>
      I don’t think that one can make meaningful statements about the way types interact on the page by comparing a few dimension — you have to see it in context as well.</p>
