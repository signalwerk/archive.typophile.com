      <p>&gt; the most vertically challenging accent to squeeze in, at least in my experience as a type designer, is capital A ring.</p>
      <p>This is a challenging case indeed, but the worst case of all in my experience is not ordinary capital letters with ring etc. diacritic, but lowercase ascender letters such as “l” and “k”, which often extend the ordinary capital height, especially in almost all old-style typefaces, as shown by above ascender letter “l” with candrabindu on top of it.</p>
