      <p>I mentioned Vietnamese and Slovak because their diacritics take up a lot of space.<br>
      But in fact, the most vertically challenging accent to squeeze in, at least in my experience as a type designer, is capital A ring.<br>
      So perhaps CT fonts are Scandinavian-friendly.</p>
      <p>The “body” is indeed a metal type term, otherwise known as the “shank”. In a piece of type, it’s the rectangular column of metal of which the letter shape forms the top part.<br>
      So “small on the body” means “small on the em square”, or, as you might say, “small on the grid”.<br>
      Yeah, I know, it’s an archaic term, but I like the suggestion of a tangible space it gives to the em square — for me, digital line spacing that deals with the distances between parts of glyphs just doesn’t “get” what typography is, and is responsible for a lot of difficulties. </p>
      <p>Please, call me Nick, unless you’re 16 or younger.</p>
