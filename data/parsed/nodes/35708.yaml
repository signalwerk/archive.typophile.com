      <p><cite>The answer is NO, because the rendered point size of Calibri is much smaller than the rendered point size of Arial etc. due to the incorrect metrics of Calibri.</cite></p>
      <p>The answer is NO, because CSS does not “scale the fonts according to the x-height” as Ralf Hermann wrote in his original post. That’s all.</p>
      <p><cite>... shows mixing of Constantia with Calibri ... These examples make it clear that you cannot use two fonts in the same text, if the two fonts do not have the same metrics.</cite></p>
      <p>Therefore it is still up to typographers to combine typefaces that match. Either one decides that matching x-height is more important (text), or matching H-height is more important (all caps setting).<br>
      And if <cite>all</cite> metrics should match, type designers sometimes make the decision to design super-families with a serif and sanserif family, see Peter Bilak’s thread <a href="http://www.typophile.com/node/35727">over here</a>. But this involves more than just vertical metrics, of equal importance are the typefaces’ color (weight), style of curves, etc.</p>
      <p><cite>This is the typical “frog in the well” attitude shown by most Typophilers. Since most of them never learnt Indic scripts etc., they do not know that most non-Latin fonts do not have lowercase and uppercase letters.</cite></p>
