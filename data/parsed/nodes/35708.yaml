      <p><em>I wonder why both Mr. Shinn and Mr. Hudson mention Vietnamese, because Calibri does not cover Vietnamese diacritics.</em></p>
      <p>It doesn’t in the current release version, but you can expect that it will in future versions, and not only Vietnamese. The point I am making is that maxing out the size of the glyphs in the em space without giving thought to the future extension of the typeface for other languages is a mistake. Basing such decisions on what characters a font supports in its first development phase is short-sighted, especially when the font is being made for a company that is dedicated to internationalisation and that has a long history of extending their fonts to support additional languages. The phase 1 CT font development was aimed at modern European languages, but it would be naïve to think that this would be the limit of their support.</p>
