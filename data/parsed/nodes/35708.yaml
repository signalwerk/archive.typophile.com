      <p>&gt; All the ClearType fonts are significantly smaller</p>
      <p>Not all ClearType fonts are significantly smaller. For instance, Constantia has correct metrics, but the other fonts have incorrect metrics, i.e. the other ClearType fonts are technically faulty.</p>
      <p>The top height of capital letters of Latin typefaces should be 70% (+/- 5%) of the font grid. PostScript fonts have 1000 units per em, and hence the top serif of the uppercase “I” should be 700 units in the case of PS and OTF fonts.</p>
      <p>For TrueType and also for the ClearType fonts, the grid is 2048 units, and 70% of 2048 is slightly above 1400 units (i.e. 1433 units, to be exact).</p>
      <p>In the case of Constantia, the height of the capital “I” is exactly 1400 units, and this is perfectly correct. A deviation of +/- 50 units (i.e. the range below 1400 down to 1350 and above 1400 up to 1450) is tolerable for TrueType fonts, but if the caps height drops below 1350, the metrics must be regarded as incorrect, because such fonts can no longer be mixed with other fonts in the same line of text, since the letters begin to dance (see below).</p>
      <p>The metrically worst ClearType fonts are Calibri, Candara and Consolas, all three of them with a caps height of only 1300 units. Cambria is tolerable with a caps height is 1365 units.</p>
      <p>If we mix Constantia (which has correct metrics) with Calibri (with has faulty metrics) in the same line of text, the faulty metrical design becomes apparent by “dancing letters”, whose top capital heights do no longer align:</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/calibri.pdf" title="http://www.sanskritweb.net/temporary/calibri.pdf">http://www.sanskritweb.net/temporary/calibri.pdf</a></p>
      <p>It is hard to believe at first glance that all dancing letters in the file calibri.pdf are typeset in exactly the same point size (here 48p), but this is the case, as anyone can find out himself or herself by typesetting a line of sample text using and mixing Constantia and Calibri.</p>
      <p>Kudos to Mr. Hudson, who was able to design his Constantia font with correct metrics (and non-kudos to Mr. de Groot, who was not capable of designing Calibri with correct metrics).</p>
