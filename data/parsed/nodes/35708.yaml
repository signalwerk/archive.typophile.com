      <p><cite>Cross-family consistency in the CT fonts was modelled on having identical vertical metrics in the OS/2 table, so that fonts from the different families could be used together on the same line of text without the interline spacing being distorted by the presence of a font with larger OS/2 metrics within a block of text. Since one of the prime targets for these fonts was MS Word, and we knew most users would not manually set interline spacing values but accept default linespacing, I still think this was a sensible decision.</cite></p>
      <p>I agree that this was a sensible decision. However, there is the problem that the glyph metrics differ noticeably among the CT fonts (e.g. Calibri versus Constantia) and therefore only by voluntarily fixing identical OS/2 values this identical interline spacing could be achieved. </p>
      <p><cite>Cross-family visual consistency was aimed at by coordinating similar x-heights not similar cap heights (as Uli seems to want). Most text is in lowercase letters, not all caps, so coordinating cap height seems to me pointless and guaranteed to create inconsistent text colour unless all fonts have an indentical cap-to-x height proportion. If I recall correctly, the Constantia x-height is slightly shorter than the other CT fonts, and the Consolas x-height is slightly taller. But the others are very close.</cite></p>
      <p>I will not discuss here whether caps heights are “pointless”, because the fact that for instance in German texts capital letters are used much more frequently than in English texts can be ignored here, since the CT fonts were designed for Americans and not for Germans etc.</p>
      <p>The problem with Calibri is not the coordination of caps heights, but that ALL glyphs of Calibri, i.e. both lowercase and uppercase glyphs, do not sufficiently fill the glyph grid with the consequence that the glyphs look too small. The grid is the same, but there is too much white space around the black glyphs (if printed in black color on white paper), and hence they look too small as compared with Arial, Helvetica and similar sanserif fonts.</p>
      <p>Let’s look at</p>
      <p><a href="http://www.sanskritweb.net/temporary/calibri-arial.htm" title="http://www.sanskritweb.net/temporary/calibri-arial.htm">http://www.sanskritweb.net/temporary/calibri-arial.htm</a></p>
      <p>In case you don’t have Calibri and Arial installed on your computer, you can instead look at the PDF file</p>
      <p><a href="http://www.sanskritweb.net/temporary/calibri-arial.pdf" title="http://www.sanskritweb.net/temporary/calibri-arial.pdf">http://www.sanskritweb.net/temporary/calibri-arial.pdf</a></p>
      <p>It is obvious that Calibri in the left column looks much smaller than Arial in the right column, although the sample texts are typeset in the very same point sizes. How come that Calibri looks smaller than Arial? The answer is that the glyphs of Calibri do not sufficiently fill the 2048-grid of this TrueType font, as compared with Arial and Helvetica and similar fonts.</p>
      <p>Let’s look at</p>
      <p><a href="http://www.sanskritweb.net/temporary/grid2048.gif" title="http://www.sanskritweb.net/temporary/grid2048.gif">http://www.sanskritweb.net/temporary/grid2048.gif</a></p>
      <p>To the left we see the uppercase “I” of the TrueType Helvetica (version 1.0), which has a caps height of 1470 units, followed by the uppercase “I” of Calibra, which has a caps height of 1300 units.</p>
      <p>To the right we see the lowercase “x” of the TrueType Helvetica, whose x-height is 1071 units, followed by the “x” of Calibra, whose x-height is 956 units.</p>
      <p>This means that the absolute values of BOTH caps height AND x-height of Calibra are too small, and hence there is too much white space around the glyphs in the 2048 units TrueType grid, and hence Calibra looks too small.</p>
      <p>Since the caps height occupies usually two thirds (2/3) of the grid, i.e. roughly 70% of 2048 units, it follows that the caps height measured in grid units or in percentage can be used to determine whether a font looks too small or not. This can be proved by the following test:</p>
      <p>Let’s look at</p>
      <p><a href="http://www.sanskritweb.net/temporary/caps-height.pdf" title="http://www.sanskritweb.net/temporary/caps-height.pdf">http://www.sanskritweb.net/temporary/caps-height.pdf</a></p>
      <p>In the first row (H1470-100%) we see the original TrueType Helvetica with a caps height of 1470 units. This original vertical size is regarded here as 100 per cent for comparison.</p>
      <p>In the second row (H1176-80%) we see the down-scaled Helvetica, where all glyphs (both uppercase and lowercase) have been reduced to 80% of the original size of all glyphs.</p>
      <p>In the third row (H882-60%) we see the down-scaled Helvetica, where all glyphs (both uppercase and lowercase) have been reduced to 60% of the original size of all glyphs.</p>
      <p>Now look at the three “Hamburgefonts” sample texts, all three of which were typeset in the very same point size of 36 points on 36 points body:</p>
      <p>The H1176 sample text looks smaller than the original H1470 sample text, and the H882 sample text looks still smaller than the other two sample texts.</p>
      <p>This proves: Whenever the glyphs of a font do not sufficiently fill the 2048-grid of TTF fonts (or the 1000-grid of PS fonts), the glyphs look too small, because there is too much white space around the black glyphs.</p>
      <p>That is why Calibri looks much smaller than Arial, Helvetica and similar sanserif fonts, since the glyphs of Calibri (both lowercase and uppercase) do not sufficiently fill the 2048-grid.</p>
