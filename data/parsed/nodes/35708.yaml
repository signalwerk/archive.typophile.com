      <p>I am pleased to learn that Vietnamese diacritics are to be expected in future font versions. Since many Americans do not regard Vietnamese as human beings, but as “weed” belonging to the “axis of evil”, and therefore annihilated millions of them as “weed” using herbicides (“Agent Orange” etc.), it is laudable that today some Americans plan to offer fonts in the future for those who survived the herbicidal annihilation.</p>
