      <p>Well, one could:<br>
      * Use Flash to retrieve the users font list<br>
      * Pass the list to Javascript to check if the ClearType font is installed<br>
      * use DOM scripting to change the CSS class definition. (or better: store the result in a cookie to use the CT class defition for every following page)</p>
      <p>I made an example page:<br>
      <a href="http://www.fonts.info/cleartype/" title="http://www.fonts.info/cleartype/">http://www.fonts.info/cleartype/</a><br>
      It checks for Calibri and replaces the paragraph’s CSS class from “nocleartype” to “cleartype”.<br>
      (Doesn’t work in IE yet. The javascript call from Flash seems to be ignored. Don’t know why.)</p>
      <p>But all this trouble for one font replacement!? So I wonder if there was a good reason to make the Cleartype fonts so small.<br>
      Are we not supposed to use them for websites?</p>
      <p>Ralf</p>
