      <p>&gt; The “CT Collection” are smaller on the body than Verdana and Georgia</p>
      <p>Constantia must be ruled out, because the caps height of Georgia is 1419 units and that of Constantia is 1400 units, so that both fonts have more or less identical caps height metrics.</p>
      <p>Cambria must also be ruled out, for its caps height of 1365 units is sufficient.</p>
      <p>So, the main culprits are Calibri, Candara and Consolas, whose caps heights are insufficient and untolerable.</p>
