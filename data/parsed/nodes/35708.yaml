      <p>Perhaps the smaller size wasn’t done for the benefit of American readers, but Slovak, Vietnamese etc., — to accomodate diacritics.</p>
      <p>I don’t think that being “small on the body” is inherently wrong for a face — different conventions exist. For instance, news faces are large on the body, and many Emigre fonts are small on the body — and generously spaced — to create an open look straight “off the shelf”.</p>
      <p>In fact, as the CT fonts are targeted at Word, the built-in open leading is part of an appropriately less strident effect than, for instance Verdana, which for all its merits, is a strong cup of tea.</p>
      <p>So what we’re seeing is a more sophisticated look from Microsoft.</p>
