      <p>The Adobe PST1 Specs say “typical”, not more. And <cite>Schriftstatistik</cite> contains exactly that: statistics. It is data provided “for your consideration”, not more.<br>
      The great thing about digital type is that it freed designers from restrictions as regards the body, and thus ascender and descender heights.</p>
      <p>The problem is not fonts, but applications. OT and TT fonts already include x- and H-height values, so application could well allow a typographer to define type size by x- or H-Height (or ascender or descender height, if you like). If applications or CSS don’t do this, it is not the fault of font formats or type designers.<br>
      The x- and H-height ratio is a design decision. Imagine Bickham with “correctly” dimensioned ascenders/descenders and according vertical metrics — would be a nice caricature.&nbsp;&nbsp;:)</p>
