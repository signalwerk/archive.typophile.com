    html: <p>Jana -- OUTSIDE is too interesting for Minion. Interesting in a bold, graphic, appealing sort of way. I'm not an outdoorsy type, but I still find myself looking at the mag when I'm in Border's. <br> <br>Miller is wonderful. And as a bonus you can license the display and text versions when you feel like splashing out with larger serifs. I also think it flows well with Big Caslon. Or if you want something a little more understated you might look at Whitman (also from Font Bureau). Both have OsF and smallcaps and all the requisite goodies. <br> <br>Another idea, perhaps a little more similar to Minion, but more interesting IMO, would be <a href="http://bitstream.com/categories/products/nfc/iowan_complete/iowan_complete.html" target="_blank">Iowan Oldstyle</a> ... again all the goodies. <br> <br>Or, if you want a little more flavor than Minion, something truly French, you might try <a href="http://www.typofonderie.com/alphabets/view/LeMondeJournal" target="_blank">Le Monde Journal</a></p>
