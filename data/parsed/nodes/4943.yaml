    html: "<p>Hey, wait a second - more than half of those are fonts I recommend all the time!  :-) <br> <br>-- <br> <br>Jana, I just took a look at the current issue of Outside, and here's some ideas: <br>-It's a really busy, even riotous magazine! Sometimes even a humorless guy like me gets turned on - like I loved the look of that \"crazy mofos\" article. <br>-The Caslon for text actually has a charm here, I think - but it's also too frail, and a bit old-fashioned. <br>-Interstate: although it makes sense in an outdoor transportation sort of way, to me it feels like the odd man out: too plain, and not in a constructive way, because there's a lot going on anyway. <br> <br>So I might suggest these ideas: <br>-Do try Chaparral. Coupled to that charming fat Egyptian for subheads, I think it might sing sing sing. <br>-Consider dumping Interstate. As a sub, try to find a sans that matches Chaparral. Like what? <br> <br>I think the highly \"talkative\" layout needs a somewhat more focused base to really work optimally, and reducing the number of fonts (which is not the same thing as taming all the fonts) might really click. On the other hand, no magazine I've designed has won an award. My defence here is that I've never designed a magazine. :-P <br> <br>hhp <br></p>"
