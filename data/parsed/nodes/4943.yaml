    html: "<p>Jana -- <br> <br>In addition to Font Bureau's showing of Whitman (<a href=\"http://www.fontbureau.com/fonts/font_frames.tpl?fontname=Whitman\" target=\"_blank\">http://www.fontbureau.com/fonts/font_frames.tpl?fontname=Whitman</a>), you can find a more extensive PDF specimen for download at my site: <a href=\"http://www.kentlew.com/Type.html\" target=\"_blank\"> http://www.kentlew.com/Type.html</a>. <br> <br>Whitman is beginning to show up in magazines. I know of one here in the States and another in Europe. I can steer you toward printed examples, if this would help. <br> <br>Also, if having a display version of your primary text face is an important consideration, there are some custom display weights of Whitman that have been developed, but are not yet available through the retail line. Feel free to contact me or Font Bureau if you'd like to know more. <br> <br>Sorry to sound so blatantly self-promotional here.  <br> <br>-- Kent. <br> <br>P.S. Thanks Tiffany, for the initial mention, and Thomas, for the endorsement. <br></p>"
