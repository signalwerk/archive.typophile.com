    html: "<p>Actually, Minion wasn't bundled with Adobe apps for a couple of generations, but it is with the CS apps. I think it's a first-rate text face, but it certainly is ubiquitous. <br> <br>Most of the other suggestions seem pretty solid. Iowan Oldstyle, Whitman and Miller are all great choices. I think Le Monde Journal is perhaps a little too refined for this usage (an objection that could also be made to Minion). <br> <br>One other typeface of ours springs to mind for this usage: Chaparral. I think it would be an excellent choice if you're looking for something a little more out of the ordinary. As the name suggests, it has that sturdy, outdoorsy feel. <br> <br>BTW, sorry that our sales folks aren't as up on typography as one might like.  <img src=\"http://www.typophile.com/forums/clipart/sad.gif\" alt=\":-(\" border=\"0\"> <br> <br>T <br></p>"
