    html: <p>Nick, I'm guilty of suggesting the "same old," too. But what most of these suggestions seem to ignore is that the new text face has to work with the existing type -- Jana didn't say that Outside was undergoing a complete redesign. For that reason, and knowing that most headlines in Outside are "designed," rather than merely "set," I think quieter body type would make more sense.</p>
