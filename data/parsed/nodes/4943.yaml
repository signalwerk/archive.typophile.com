    html: "<p>&gt; always same things are proposed. <br> <br>Yes, that's a problem (with me at least). When asked casually, people will propose what's at the top of their heads at the moment. My own \"excuse\" is that I have too little experience <i>using</i> type (even less than your average type designer), but what I can try to do is apply what I've learned about \"congeniality\" (or what Ovink calls \"atmosphere value\") to the choices at hand. <br> <br>And I think what you're doing JF, staying in our \"minds\" by participating here, is good for your fonts. <br> <br>&gt; Outside is a particularly American looking mag. <br>&gt; So it is appropriate to go for something with <br>&gt; a US flavor. <br> <br>But suggesting a \"robust, honest, and youthful\" font for a male outdoorsy mag is not? <br> <br>Plantin Schoolbook: yes, I agree it's robust and honest, but more than youthful to me it just feels retarded. Those alternates are not working, as far as I'm concerned - certainly not for adult material - they were made to ease learning, and that's how they really work. <br> <br>&gt; gobbledegook <br> <br>Yes, do ignore 5 centuries of anecdotal evidence and a century of empirical evidence, because Larson said so. Oh and of course because Emigre said so. \"We Read Best What We Read Most.\" The Hogwash of the Century. And Avant Garde is just as readable as Adobe Garamond, at least as long as you read it -and nothing else- for 5000 years. <br> <br><a href=\"http://www.themicrofoundry.com/ss_read1.html\" target=\"_blank\">http://www.themicrofoundry.com/ss_read1.html</a> <br> <br>Oh, I so wish there was a sans version of ITC Garamond, which we could set at 14 point in long lines, with big word spaces, negative leading and +25 tracking. That would be such a... <i>cultural</i> statement. Just make sure the content isn't worth actually reading, 'cause nobody will. <br> <br>People are making <i>news</i> faces with zero understanding of readabililty. That's \"democracy\" for you. <br> <br>-- <br> <br>That said, there is I think some cultural justification for using a sans in a magazine... although it certainly helps that magazine reading sessions tend to be very short! Don't pull a stunt like that in a book, unless you think that humans are ethereal beings who use osmosis and not vision to read. <br> <br>hhp <br></p>"
