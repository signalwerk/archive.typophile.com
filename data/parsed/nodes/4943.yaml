    html: "<p>Jana, I'm thinking the three \"character traits\" you want here are: robust, honest, and youthful. Besides that you want something highly readable for a magazine, mostly meaning something with a somewhat large but not too large x-height. I'll resist suggesting a wedge-serif yet again (my \"pet genre\", Jana, since you might not have been here long enough to realize :-), but ideally I think you want something wide, somewhat rigid but a touch idiosyncratic, with chunky serifs. <br> <br>Of the suggestions so far, Whitman and Miller seem good, although the former might be a touch too feminine here - but its proportions are right on, and it has a bounce in its step that Miller might be lacking. Now that I think about it, maybe Miller is too stodgy here. <br> <br>BTW, in the Adobe library, besides Chaparral (a great suggestion) you might consider Warnock too. <br> <br>hhp <br></p>"
