    html: <p>&gt;how can I possibly find out who else is using it? <br> <br>You could look at the magazines that are your competitors (either on the newstand or at awards shows) and identify which typefaces they are using. <br> <br>To aid in identifying the faces, you should accumulate a library of specimen books and leaflets from the likes of Font Bureau, and Hoefler Type Foundry, in particular, who are much favored in the US magazine business.  <br> <br>I can particularly recommend the Bureau's hard cover specimen, a real keeper. <br> <br>And of course, go to TypeCon -- the Goody Bag is a primo source of the best new stuff!</p>
