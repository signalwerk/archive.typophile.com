    html: <p>Wow, really nice to see <i>Outside</i> drop by here. I've loved much <br>of the magazine's design over the years. <br> <br>Tiffany's call for Enigma is a good one. Pick up a copy of <i>Details</i> <br>for an example of how well it works. <br> <br>I think another interesting choice was <i>Wallpaper</i>'s use of <br>Plantin Schoolbook. Plantin is a proven long-reading face, but <br>the 'a' and 'g' variants of the Schoolbook version lent a distinctive <br>quality without being overbearing. Not sure if they're still using <br>it because I haven't seen <i>Wallpaper</i> in a while, but <a href="http://typographi.ca/000490.php" target="_blank">here</a>'s an <br>example of the copy I saw. <br> <br>Of course, none of these have the condensed quality of Minion, <br>but I think condensed is overrated for a text face. Instead, use a <br>smaller point with generous leading.</p>
