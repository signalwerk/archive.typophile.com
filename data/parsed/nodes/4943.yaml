  - id: 35991
    user: 1250
    date: null
    date_raw: null
    votes: null
    html: <p>It depends on how you define "immersive reading". Larson's parallel-letterwise model is inherently limited in terms of how deep into immersion it can go. Any act of reading that doesn't use boumas can't be said to be fully immersive. For an adult reader, the only thing "below" parallel-letterwise reading is sequential-letterwise reading, and since adults are proficient in parallelism, it actually takes an extra effort to read sequentially - so the immersive threshold for adults is between letterwise and bouma, not sequential and parallel. <br> <br>BTW, I have spent plenty of time learning not only what Larson said, but also reading up on almost all his references. Anyway, there will be a round table discussion in Thessaloniki in a month (with John Hudson moderating, so I'm already at a disadvantage, even though I'm sure John will try to be objective - but a human is a human) and we'll see what people conclude. <br> <br>hhp <br></p>
