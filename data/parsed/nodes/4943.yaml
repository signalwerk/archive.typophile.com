    html: <p>Outside is a monthly outdoor/adventure/men's magazine published out of Santa Fe. If you go to SPD.org you might find some spreads of ours; we won Silver Medal for magazine of the year last year (ha! and yet here I am asking about Minion, hm?).  <br> <br>The photos and illos are usually pretty nice (illos by the Clayton Bros, Brian Cronin, Zohar Lazar, etc., photos by James Nachtwey, Anton Corbijn, Jake Chessum, etc.) . <br>I think the main thing is that our creative director would like to make a departure from the body copy font that she had to inherit when she arrived at the magazine. Right now we're using Caslon224 Book. Yeek. The other fonts we use mainly are Interstate, Giza and BigCaslon for display.  <br> <br>I also thought that maybe Miller (Font Bureau) would work well as a new serif?</p>
