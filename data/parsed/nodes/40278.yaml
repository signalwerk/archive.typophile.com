    html: <p>They said you can't add a drop shadow to a /font/.  I don't really say where it was said the program could not be made to dropshadow the price when printed, leaving the font itself alone, although that may have been what they meant, but teh fact that you can't really have a nice gradient shadow inside any font system I know of does make the answer a bit ambiguous.</p>
  - id: 248434
    user_id: 14529
    user_name: mondoB
    user_path: null
    date_raw: 26 Dec 2007 — 7:14pm
    date: 2007-12-26T19:14:00
    votes: null
    html: <p>As you saw on the myfonts link above, drop shadows embedded in fonts are all solid, not halftone and certainly not fuzzy. But you can create these effects per text box in Creative Suite programs and Quark 7. I doubt it will ever be possible to put halftone or fuzzy drop shadows into a font--they have their hands full just extending the glyph coverage! You can create shadowed reusable type buttons and motifs for a web design, though.</p>
