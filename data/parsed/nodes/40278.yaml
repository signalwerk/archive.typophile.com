    html: |-
      <p>Presumably it would be possible to have a font with a half tone drop shadow on each glyph, but the DPI would be relative to font size, and probably by necessity rather course. </p>
      <p>Maybe if the price tags are printed in two colours (and the second one happens to be grey :o) you could off-set the grey, and get your drop shade that way.</p>
      <p>Don, that's a jpg of text with the shade added. Most design aps should be able to handle editable text with drop shade effects.</p>
      <p>-=®=-</p>
