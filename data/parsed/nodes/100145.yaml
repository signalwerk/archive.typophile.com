      <p>Speaking of Monotype, this reminds me of a little project of sorts I've been toying with.</p>
      <p>The IBM Selectric Composer, with its nine-unit system, produced output that, except for the limitations on the mechanical tolerances of the Selectric element, looked like type. If one compares character widths, though, M and W should have been eleven units, not nine, in width, to be consistent with the scale of the other letters.</p>
      <p>I've been looking at the relative sizes of the superscript/subscript characters and the second-level superscripts/subscripts in four-line mathematics to see what widths would have to be assigned to them for an imaginary daisywheel typewriter using the eleven-unit corrected Composer widths for the primary faces.</p>
      <p>Apparently, the best fit would be a seven-unit system for the superscripts and subscripts, and a five-unit system for the second-level superscripts and subscripts.</p>
      <p>The five-unit system could be taken whole from that used on the IBM Executive for Documentary and similar typestyles. The seven-unit system <strong>could not</strong>, however, be the one used on the Model 50, 65, and 85 Selectrics (and also the highly obscure Mag Card Executive), but would instead need to be more like the one used with ATF's Self-Spacing Type (since the characters in the former system were wider than its being a seven-unit system might imply; as with the Composer, the widest characters were compressed, not having their full relative width, so as to make a less coarse unit system).</p>
      <p>It's well, I suppose, that laser printers took over before the power of microprocessors tempted someone to make a fancy daisywheel typewriter that produced typeset-quality output and which did even go to the length of providing four-line mathematics. I might have loved its complexity, but it would have driven others insane...</p>
