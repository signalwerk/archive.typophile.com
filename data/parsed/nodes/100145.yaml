    html: <p>Well, the irony of who brung Eye, in respect of their advertisers, is that for a long time now Eye has predominantly featured the ads of independent type foundries and designers, and not those of the Monotype-owned companies. An editorial might have pointed out that while Monotype have a long, fascinating and nicely archived history, and continue to do important technological development, from a <em>design</em> perspective the more interesting and creative stuff is happening elsewhere, lot least among Eye's regular advertisers.</p>
