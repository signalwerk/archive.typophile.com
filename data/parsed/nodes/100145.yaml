    html: |-
      <p>Concerning the owners of the foundries advertising, listed above, Schwartz, Sowersby, Biľak, Hoefler, Frere-Jones, Olson, Spiekermann and Tankard have all received editorial coverage in <em>Eye</em>.</p>
      <p>Also, art director Simon Esterson uses fresh typefaces every time. For instance, the recent issue which had a big article on Massimo Vignelli was set in Schwartz’s Helvetica revival, making for a brilliant tonality.</p>
      <p>I have yet to achieve sufﬁcient cachet to appear in the <em>Reputations</em> feature, but Mr Esterson did use two of my types in an issue, which was awesome, so I am inclined to think favorably of the publication, and have in fact advertised in it on several occasions before and after.</p>
      <p>I don’t know whether Fedrigoni papers have been used for printing Eye, but I wouldn’t be surprised, as Mr Esterson also specs a lot of different paper stocks — several in each issue.</p>
      <p>I draw attention to this symbiotic ecology not to diss it, but because it’s really quite an interesting and productive publishing model. After all, editorial coverage of graphic designers in Eye doesn’t promote their work, because Eye’s readership is mainly graphic designers, not those who hire their services. However, features on the work of type designers are <em>de facto</em> advertisements for their product, to a key segment of their market.</p>
      <p>It’s a top quality printed type specimen in its own right, or, as foundries such as TypeTogether have used, with ﬂyer inserts, a means of distribution.</p>
