      <p>Anders –</p>
      <p>Don't worry too much about breaking brand names, or any other kind of name. It's a ridiculous notion that names shouldn't be broken; doubly so when it's made-up brand names with intercaps. What I would avoid is breaking a name the <em>first</em> time it appears, if you can, especially if it's unfamiliar. I'd be much more comfortable (in an English-language context) breaking a name like "Fitzwilliam" or "Jackson" than, say, "Ouellebecq." When you do have to break a name, just like any other word, break it at a logical place: "Page[-]Maker" (to take an actual brand name that is easy to hyphenate).</p>
      <p>I know you said you were eschewing all hyphens, but that sounds like an affectation. Even ragged-right copy needs words broken sometimes. It's important to keep in mind the difference between editorial decisions and typographic decisions. </p>
      <p>John</p>
    html_clean: |-
