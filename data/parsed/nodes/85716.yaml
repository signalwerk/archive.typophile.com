    <p>Hi all, </p>
    <p>I am currently working on a bi-annual magazine for a shopping destination. Our account managers and client seems to be under the impression that one can certainly not split a brand name over two lines, which I disagree with. I know it isn't ideal, but in a magazine literally full of brand names, I think its inevitable at some point. What are your thoughts on this, is this something you have dealt with before? Or have I just missed a very crucial typography memo?</p>
    <p>The whole magazine is set in left aligned paragraphs, with no hyphenation. </p>
    <p>Thanks,</p>
    <p>Anders</p>
