      <p>When you say "it's inevitable at some point", do you mean it's inevitable that some broken brand names will slip past you? If you're using InDesign just apply the "no break" attribute to the names, and they will not break even if the text reflows later. Or better yet, create a character style for brand names and apply the "no break" attribute to the character style. You can also apply the "no break" attribute via the Find/Change command. </p>
      <p>But of course you'll end up with some ugly line breaks.</p>
