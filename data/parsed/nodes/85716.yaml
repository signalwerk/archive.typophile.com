      <p>i know you'd prefer an unequivocal answer.</p>
      <p>but sometimes life isn't all that simple.</p>
      <p>depending on the search capabilities of<br>
      whichever electronic tools people use<br>
      to view the digital copy of your work<br>
      -- please tell me you realize that the<br>
      digital version will have more readers,<br>
      and last longer, and spread farther --<br>
      you might wanna consider this approach:</p>
      <p>if the parts of a name are sufficiently<br>
      unique that they have few "false alarms"<br>
      when you search for them, it's probably<br>
      fine to split them across a linebreak.</p>
      <p>for instance, searching for "waterhouse"<br>
      lets you find "price waterhouse cooper".<br>
      so it'd probably be ok to split that one.</p>
      <p>but "apple computer" would probably give<br>
      too many false alarms when searching for<br>
      "apple" or "computer", meaning that people<br>
      must search for the _phrase_, so i'd want<br>
      to prevent that name from being split...</p>
      <p>-bowerbird</p>
