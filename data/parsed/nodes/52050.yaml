    html: <p>And just to really make things weird, some printers don’t seem to pay attention to hints (I’m pretty sure my new Ricoh B&amp;W laser ignores them) while others (HP) have a reputation for for interpreting hints incorrectly. From the research I’ve done it appears that your best bet is to use a Postscript B&amp;W printer from Ricoh or Xante. Those Xante printers are just amazing at text rendering!</p>
