      <p><em>3) How is the type rendered in the preview window in FontLab?</em></p>
      <p>Depends on which platform you use ... If I remember correctly, on Windows FL uses an (the?) Adobe rasterizer for PostScript Outline hinting preview (you can choose between Black/White and Greyscale), and for TrueType outlines the Windows rasterizer in Black/White, Greyscale or ClearType mode.</p>
      <p>On Mac OS X it’s different, obviously the Microsoft rasterizer can’t be used, and that’s why the TT preview on Mac is so bad ;)</p>
      <p><em>How trustworthy is this representation?</em></p>
      <p>As trustworthy as you’re certain about which rasterizer will be used for displaying your fonts finally. In the end reliable hinting comes down to educated guessing and experience, I suppose:)</p>
