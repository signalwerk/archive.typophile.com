    <p>I have several questions so bear with me. I have been trawling through the build forum looking for advice on this subject before posting and confess I have a very limited understanding of the subject. I am working on my first font, it’s PostScript. I don’t feel very confident about proofing what I am drawing, or regarding what I see on screen. I am mainly concerned with how the font prints, though I need a fair screen image to ensure this.</p>
    <p>1) Does hinting affect printing?</p>
    <p>(So far my understanding is ’yes’ though I don’t understand how much).</p>
    <p>2) <a href="http://typophile.com/node/27444" title="http://typophile.com/node/27444">http://typophile.com/node/27444</a></p>
    <p>In Nick’s example he mentions defining standard stems and alignment zones, so this will be the first thing I do.</p>
    <p>3) How is the type rendered in the preview window in FontLab? How trustworthy is this representation? Is this FreeType? What is happening when I quick test as Type1?</p>
    <p>4) If I export a font before applying any hinting is it up to the engines of individual programs to cope with rendering the type on screen? What informs the printout from this scenario?</p>
    <p>5) What are the essentials for a reasonable laser proof? Exporting fonts/printing direct from FontLab, PostScript/emulated etc.</p>
    <p>As you can see I am very confused. I hope someone can take the time to talk me through this, I have spent a fair bit of time reading around but no sooner than I think I have a firm grasp of the subject it somehow slips away. I notice that a lot of threads on this topic go cold fairly quickly, hopefully some typowiki can be gleaned from this one.</p>
    <p>Many, many thanks</p>
