      <p>1) As far as I know, hinting does not affect printing in any way. It is purely data that is (or is not) used by rasterizers for screen display.</p>
      <p>2) Setting up alignment zones (the blue bits) is always a good idea. Both for hinting and optical alignment of rounds and squares.</p>
      <p>3) I don’t know what renderer is used in the preview window of FontLab, but I think it is accurate. Adam Twardoch can probably comment on this one best.</p>
      <p>4) I suspect the rasterizer of the individual progams will have to cope with the rendering. It shouldn’t have an effect on printing it, though.</p>
      <p>5) Personally, I prefer exporting and setting proofs in InDesign, instead of directly printing from FontLab. Purely for convenience’s sake, though. I don’t know what kind of differences there are technically.</p>
