      <p>Most of the original questions have already been answered, but I have a few things to add. </p>
      <p>First, not only does hinting affect printing, but bad hinting can deform letters when printing to a laser printer. Run the AFDKO autohinter before doing your test prints and the prints will look a hell of a lot better. </p>
      <p>I have also found that using Fontlab to generate proofs only works down to nine or ten points. Below that the shapes get mangled, so test small sizes from Indesign.</p>
