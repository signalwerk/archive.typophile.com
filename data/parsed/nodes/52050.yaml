      <p>1) Does hinting affect printing?<br>
      Hinting is not “kind of output” specific — it is resolution and typeface design specific. If one composes type at 72 pt on a 96 dot per inch screen (96 pixels per vertical em), pending typeface design issues, hinting does not effect the type. If one composes 10 pt for a 144 dpi printer, (20 pixels per vertical em), hinting likely is needed to save the type regardless of typeface design issues. Typeface design for less hinting means making fonts more regular in every imaginable way, (until one reaches Chicago;) And for more hinting, typeface design should travel towards Snell Roundhand or Augsburger Initials.</p>
      <p>3) How is the type rendered in the preview window in FontLab?<br>
      Adam, Yuri? How is T1 rendered? How is TT rendered, please? Obviously from above, the larger one renders type in FL, the more accurate, the smaller one renders type in FL, the less accurate. And, the less regular the design, the larger one renders type in FL, the more accurate, the smaller one renders type in FL, the less accurate. Then, depending on how faithful FL is to the OS rendering of your choice, you have an answer.</p>
      <p>4) If I export a font before applying any hinting is it up to the engines of individual programs to cope with rendering the type on screen?<br>
      All screen rendering depends first on the outlines, and then on hints if they are present. The outlines are either scaled and rendered, or scaled/hinted and rendered. Scaling in this context means shrinking from, e.g. a 1000 unit em to a 25 unit em to transform the outline (1000) to the bitmap ( 6 pt 300 dpi). In this scaling, each and every contour point in the outline must find a coordinate in the new space. So, again, the more regular the type is on the em, the more regular it’ll stay when it is scaled to a lower resolution em. Hints are nice if you want irregular type to remain irregular. </p>
      <p>Then, when you project this out into OS and application space, all hell breaks loose unless the OS native to the font format handles it, in which case some hell breaks loose because, though the outlines may be regular or irregular, the hints are treated irregularly if used at all.</p>
      <p>5) What are the essentials for a reasonable laser proof? Exporting fonts/printing direct from FontLab, PostScript/emulated etc.<br>
      It’s best to generate the final format you intend to supply and use it on the OS(s) and in the expected application(s) for output from the devices where you expect people to use it. </p>
      <p>Cheers!</p>
