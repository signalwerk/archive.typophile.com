      <p>“What do you mean by regular on the em?”</p>
      <p>Fonts for print usually have slight variations in otherwise common values, like alignments and stem thicknesses, to create the optical effects one sees in print as correct. These slight variations however, introduce rounding ’errors’ at lower resolutions and one sees these on screens as incorrect.<br>
      One prominent example is the O overshoot vs. H, which, if you look closely on your screen at this font, does not exist, though O overshoot does exist in the outlines of the font you are using. Within the overshoots, the O,C,J,G,S,Q &amp;,&amp; Ø may all have slightly different alignments and weights of the baseline round hairline(s) for print due to variety in shape and proximity of features, width of character, and contrast of baseline hairline, to create the optical effects one sees in print as correct.<br>
      A more regular design might have one common overshoot, or in a squarer design, none and thus be even more regular on the em. And, the hairlines can be simplified down to a couple of values or even a single value, all to create the optical effects one sees on the screen as correct. </p>
      <p>Hope that helps some. </p>
      <p>Cheers!</p>
