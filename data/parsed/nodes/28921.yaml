    <p>PingMag, Tokyo's premiere arts and visual culture online magazine has just posted my latest- an article about <a href="/wiki/Los%20Angeles" class="freelinking" rel="nofollow">Los Angeles</a> <a href="/wiki/graffiti" class="freelinking" rel="nofollow">graffiti</a> and the influence of <a href="/wiki/blackletter" class="freelinking" rel="nofollow">blackletter</a> typography. The article includes a world premiere documentary by Joe Forney about the work of Atlas CBS, a highly influential and active L.A. graffiti writer. </p>
    <p>Within, graffiti zine LOST editor EyeOne is interviewed about the connection between barrio calligraphy, blackletter, and their combined influence on contemporary graffiti in the City of Angels. Includes a number of images showcasing some of Los Angeles' most innovative graffiti.</p>
    <p>The article is here: <a href="http://www.pingmag.jp" title="http://www.pingmag.jp">http://www.pingmag.jp</a></p>
