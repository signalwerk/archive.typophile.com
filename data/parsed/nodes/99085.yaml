    <p>Been searching all morning for a font simliar to the font used in this P.A.C.E. logo. I'm making a printable certificate for a test that provides P.A.C.E. certification, and this is the resolution of the logo they provided. I'm trying to recreate the stamp using vectors, but I've hit a wall with the font.</p>
    <p>Here it is in context of the full stamp.</p>
    <p><a href="http://www.labce.com/license.aspx" title="http://www.labce.com/license.aspx">http://www.labce.com/license.aspx</a></p>
    <p>The 'A' is pretty unique with the slight curved slopes, so I thought it wouldn't be so hard to find, but I've come up with nothing so far.</p>
    <p>Thanks for your help.</p>
