      <p>The English language Wikipedia article, which is well reference, describes the Greek Sphinx: "She was represented in vase-painting and bas-reliefs most often seated upright rather than recumbent, as a winged lion with a woman's head; or she was a woman with the paws, claws and breasts of a lion, a serpent's tail and eagle wings."</p>
      <p>Yet all illustrations show her with a lion's tail, unlike the coiled serpent's tail/body in this illustration. That's what disuaded me from identifying it asa Greek Sphinx.</p>
      <p>Puzzling. Possibly this is an unusual illustration of a Greek Sphinx.</p>
