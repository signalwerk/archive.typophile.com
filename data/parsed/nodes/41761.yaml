    date_raw: 6 Feb 2008 — 8:35am
    date: 2008-02-06T08:35:00
    votes: null
    html: <p>I should have mentioned that the Greek Sphinx is part of the Oedipus myth. The Sphinx sat outside Thebes and asked all the travelers that passed her a riddle; if they answered incorrectly, she killed them. Oedipus answered the riddle, which was "What goes on four legs in the morning, on two legs at noon, and on three legs in the evening?" Since Oedipus answered correctly (a man, or more PC, a person), the Sphinx had to destroy herself.</p>
