      <p>&gt; What's your source?</p>
      <p>Since the image in the OP had a tail, I googled for "sphinx and (serpent or serpents) and tail". Here are some results:</p>
      <p><a class="freelinking external" href="http://en.wikipedia.org/wiki/Sphinx" rel="nofollow">Wikipedia</a><br>
      <a class="freelinking external" href="http://monsters.monstrous.com/sphinx.htm" rel="nofollow">Monstrous.com</a><br>
      <a class="freelinking external" href="http://www.pantheon.org/articles/s/sphinx.html" rel="nofollow">Encyclopedia Mythica</a><br>
      <a class="freelinking external" href="http://www.theoi.com/Ther/Sphinx.html" rel="nofollow">Theoi Greek Mythology</a><br>
      <a class="freelinking external" href="http://www.mythindex.com/greek-mythology/S/Sphinx.html" rel="nofollow">Greek Myth Index</a></p>
      <p><a class="freelinking external" href="http://www.online-literature.com/bulfinch/mythology_fable/10/" rel="nofollow">Bulfinch</a> just says half-lion, half-woman. There are also references to the Sphinx as just having wings and a lion's body, but no tail -- <a class="freelinking external" href="http://www.greek-gods.info/monsters/sphinx/" rel="nofollow">here</a>, for instance.</p>
      <p>The Egyptian Sphinx has come to mean enigmatic, but given the Greek backstory, I'm not sure I'd want it as my logo.</p>
