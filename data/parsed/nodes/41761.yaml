      <p>Hi Eric. I'm not really sure about this, but then I'm not an expert on ancient Greek mythology. I'll have a go at it regardless.</p>
      <p>This creature has the general appearance of a sphinx, but the anatomical details do not match those of the well-known Egyptian sphinx. It has the coiled tail/body and scales of a Greek hippocamp---a sea-going creature with with a horse's torso and the tail of a sea serpent. It's front legs resemble those of a horse, it's head is human, and it has human breasts.</p>
      <p>Somehow I don't think it is ancient Greek, but I'd give it at least 25% chance of being Greek. It looks like something from classical antiquity. Hold on and I'll see if I can get a positive ID on it for you.</p>
      <p>j a m e s</p>
