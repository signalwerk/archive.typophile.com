    <p>Does anybody have any clue why Pakistanis are so good at lettering?</p>
    <p>Is this the highest-quality protest lettering you’ve seen or what?<br>
    Frame 7: <a href="https://web.archive.org/web/20081011042234/http://news.bbc.co.uk/2/hi/in_pictures/4693010.stm" title="http://news.bbc.co.uk/2/hi/in_pictures/4693010.stm">http://news.bbc.co.uk/2/hi/in_pictures/4693010.stm</a></p>
    <p>And then there’s this from a few years ago:<br>
    <a href="https://web.archive.org/web/20081011042234/http://news.bbc.co.uk/2/hi/south_asia/1545697.stm" title="http://news.bbc.co.uk/2/hi/south_asia/1545697.stm">http://news.bbc.co.uk/2/hi/south_asia/1545697.stm</a> _<br>
    I don’t know about you, but that’s really a surreal example<br>
    of non-non-Latin* writing. Will you look at that “f”?! Wow.</p>
    <p>* <a href="https://web.archive.org/web/20081011042234/http://typophile.com/node/601" title="http://typophile.com/node/601">http://typophile.com/node/601</a></p>
