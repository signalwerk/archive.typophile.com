      <p>Not a crime.<br>
      But it depends on what you want.<br>
      Garamond has a stronger character Akzidenz-Grotesk has.<br>
      So it only makes sense to use Garamond for the important part of your design. And AG for the other one.</p>
      <p>Georg</p>
