    <p>Lots of changes coming to the Macworld Expo event this year. Steve Jobs no longer presenting the keynote and the announcement that this is the last year for an Apple booth, who knows what's to come.</p>
    <p>If you're in the area want to check it out, you can get a free pass to the Expo Hall over at the Extensis blog: <a href="http://blog.extensis.com/?p=2512" title="http://blog.extensis.com/?p=2512">http://blog.extensis.com/?p=2512</a></p>
    <p>Hope to see you there!</p>
