    <p>June 1, 2014. An international type design competition, Modern Cyrillic 2014, has been launched in Russia. Its organisers are <a href="http://www.paratype.com/cinfo/" rel="nofollow">ParaType</a>, the premier Russian digital type foundry, and <em><a href="http://typejournal.ru/about/" rel="nofollow">Type</a></em>, the online typographic journal, both located in Moscow. Modern Cyrillic 2014 is a sequel to <a href="http://old.atypi.org/70_boston/news/stories/04.html" rel="nofollow">Kyrillitsa’99</a> and <a href="http://www.paratype.com/k2009/" rel="nofollow">Modern Cyrillic 2009</a>, which were organised by <a href="http://www.paratype.com/cinfo/news.asp?NewsId=396" rel="nofollow">Vladimir Yefimov</a> (1949–2012), the art director and one of the founding fathers of ParaType, and <a href="http://paratype.com/cinfo/news.asp?NewsId=425" rel="nofollow">Emil Yakupov</a> (1957–2014), ParaType’s CEO.</p>
    <p>Cyrillic single-style typefaces, multiple-style type families and type systems developed for body text and/or display composition, and created and/or released after September 15, 2009 are eligible. There is no limit to the number of submissions one may enter in the competition. The deadline for submission is October 24, 2014.</p>
    <p>Participation in Modern Cyrillic is open to all. Participants are not subject to any restrictions based on age, education, occupation or proficiency in languages using Cyrillic alphabet. Participation is free: no entry, or hanging, or publication fee will be charged.</p>
    <p>Modern Cyrillic 2014 is going to be judged by an international team of experts in Cyrillic type design and typography: Dmitry Aronov, Russia; Gayaneh Bagdasaryan, Russia; Konstantin Golovchenko, Ukraine; Yuri Gordon, Russia; John Hudson, Canada; Alexandra Korolkova, Russia; Natalia Vasilyeva, Russia; Jovica Veljović, Germany; Danila Vorobiev, Russia. The jury is chaired by Maxim Zhukov.</p>
    <p>The judging of Modern Cyrillic 2014 is scheduled to take place in Moscow on November 25, 2014. The winning entries will receive honorary certificates ‘For Excellence in Type Design’.</p>
    <p>All details—the rules of the competition, the entry form, the instructions for formatting and submission of the entries, the biographies of the judges, information on the liabilities of parties, contact details—can be found on the competition’s Web site, <a href="http://moderncyrillic.org/" rel="nofollow">moderncyrillic.org</a>.</p>
