      <p>i would like to recommend to anyone with an interest in classical art that they visit the Isabella Stewart Gardner Museum. It is, imho, one of the most underrated museums in the country, and the building is spectacular - a sort of Italianate Victorian / Moorish / English A&amp;C castle on the edge of downtown, very near the fine art museum and almost next door to MassArt. They also have a great cafe, one of the better museum gift shops anywhere, and a beautiful courtyard. I'll certainly be going, and would happily take long anyone else who wishes to visit. The T goes right there, too, I believe.</p>
      <p><a href="https://web.archive.org/web/20120725142202/http://www.gardnermuseum.org/" title="http://www.gardnermuseum.org/">http://www.gardnermuseum.org/</a></p>
      <p>JLT</p>
