    <p>Now that <a href="https://web.archive.org/web/20120725142202/http://www.typecon.com/typecon2006_register.htm" rel="nofollow">you can register</a>, I think we need a thread dedicated to: Who is going? When are you arriving? When are you leaving? Where are you staying? and for some, Who needs a roomie?</p>
