    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;: Display&nbsp;Fonts</strong></p>
    <p>Display fonts are fonts primarily designed to be used in “display” (headlines, titles and so forth) rather than for long-distance&nbsp;text.</p>
    <p>Like most categorisations of type, the category of “display” fonts is flexible. Some fonts are “display” fonts because they are flamboyant or quirky, typographical peacocks; but careful designers and foundries will often produce “display” versions of text fonts, which are likely to be just as sober as the text font, but are designed to be used at large sizes. Such versions are likely to feature adjustments to <a href="/node/12028" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">x-height</a>, stroke weight and <a href="/node/12606" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">letterfitting</a> which help them look and read their best at larger&nbsp;sizes.</p>
    <p>As a general rule, display fonts are best used for larger settings, such as headlines and titles. They can also be used for short paragraphs where immersive or lengthy reading is not&nbsp;required. </p>
    <p>For better readability, long-running copy for such things as brochures, magazines and web sites use a <a href="/node/add/wiki?edit%5Btitle%5D=Text%20Fonts" title="Create node &quot;Text Fonts&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">text font</a>.</p>
