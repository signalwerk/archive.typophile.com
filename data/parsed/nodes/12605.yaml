    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Display Fonts</strong></p>
    <p>Display fonts are fonts primarily designed to be used in "display" (headlines, titles and so forth) rather than for long-distance text.</p>
    <p>Like most categorisations of type, the category of "display" fonts is flexible. Some fonts are "display" fonts because they are flamboyant or quirky, typographical peacocks; but careful designers and foundries will often produce "display" versions of text fonts, which are likely to be just as sober as the text font, but are designed to be used at large sizes. Such versions are likely to feature adjustments to <a href="/wiki/X-height" class="freelinking" rel="nofollow">x-height</a>, stroke weight and <a href="/wiki/Fit" class="freelinking" rel="nofollow">letterfitting</a> which help them look and read their best at larger sizes.</p>
    <p>As a general rule, display fonts are best used for larger settings, such as headlines and titles. They can also be used for short paragraphs where immersive or lengthy reading is not required. </p>
    <p>For better readability, long-running copy for such things as brochures, magazines and web sites use a <a href="/wiki/Text%20Fonts" class="freelinking" rel="nofollow">text font</a>.</p>
