  html: |-
    <p>»Typonauten« is a collective of three designers in Bremen and Hamburg (Germany). They are also typedesigner of some headline fonts. They contribute on the <a href="/wiki/spatium" class="freelinking" rel="nofollow">spatium</a> magazine with some artworks and got some awards for their book designs. </p>
    <p>More information: <a href="http://www.typonauten.de" title="http://www.typonauten.de">http://www.typonauten.de</a></p>
