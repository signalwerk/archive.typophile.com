    html: |-
      <p>You have family problems here. Some of your letters are nice and geometric, while others are not.</p>
      <p>Letters I'd drastically change would be: C, c, K, @, and €.</p>
      <p>Letters I'd moderately change would be: G (too closed on the top or too open on the bottom), M/W (adjust one to another. I don't mean mirror them but adjust them to match), S, s (they are too big and too wide on the top half), Y (it's heavily falling right), 3 (too big top - adjust it to 8), 5 (ending should be more left or move the top left stem more to the right), 7 (unstable just as Y), 9 (too narrow).</p>
      <p>Nice start.</p>
