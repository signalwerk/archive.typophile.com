    <p>Hello</p>
    <p>This is my first font design, called Martins Corner.</p>
    <p>Like a lot of other first timers, it was originally based on my handwriting, but has since moved away from being a script into a fun looking rounded monoline sans serif, while retaining many of the unique forms of my writing.</p>
    <p>So, take a look and I look forward to hearing what you have to say.</p>
    <p>Thanks...</p>
