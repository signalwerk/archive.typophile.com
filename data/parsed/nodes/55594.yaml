    <p>I designed a logo and a business card for my new <a class="freelinking external" href="http://www.designbits.de" rel="nofollow">web design business</a> and I need some feedback regarding composition, choice of colour, kerning etc. In fact, this is the first time that I'm designing a business card... </p>
