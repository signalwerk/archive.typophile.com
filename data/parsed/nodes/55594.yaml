      <p>Greetings Tintin81!</p>
      <p>Yes indeed it is, you do not want to have a suprise when it<br>
      is time to print. I was taught to do it in black and white first<br>
      and then move onto color. Print can be a hassle sometimes because<br>
      what you see on the screen is not what you will get on paper.<br>
      Good look!</p>
      <p>Guerrizmo+Design<br>
      No man is an island unto himself_John Donne</p>
