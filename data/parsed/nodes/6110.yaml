    html: <p>It looks a little more current, but now I'm seeing a Marshall's or TJ Max handbag company, or maybe a logo for a new French toasted bagel product at the corner coffee shop. <br> <br>I'm not getting anything related to music or its promotion. The fudge name works because of its quirkiness, which is what I would try to play off of. <br> <br>Aloha! <br>Scott</p>
