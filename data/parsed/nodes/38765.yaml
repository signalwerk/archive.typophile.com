    html: <p>My guess is that you’re asking what fonts people like for names and phone numbers on stationery and business cards. The actual font will generally depend on what the font used in the company name is, as they need to fit well together. But generally I prefer sans serif faces in this use, which often runs at smaller sizes.</p>
