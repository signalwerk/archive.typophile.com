    <p>Hi all, Im new to this site so please bear with me if I post in the wrong places or dont make sense : )</p>
    <p>I was after peoples opinions about fonts they like to use for Corporate Identities, not really the actual name of the company but rather addresses, names, numbers ect and what size do you usually go for?</p>
    <p>I know certain fonts require certain sizes. But any responses would be appreciated.</p>
    <p>cheers</p>
