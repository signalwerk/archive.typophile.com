      <p><cite><br>
      I know certain fonts require certain sizes.<br>
      </cite></p>
      <p>Do you mean some fonts look best between certain sizes?</p>
      <p>I think what you are talking about is the way letterhead &amp; business cards are handled. Basically what I have seen is that the bigger the business the smaller the type. This is over-simple but it seems to be true. There is a good reason for this. A bigger business needs to be able to print a wider range of names and addresses. Some names and addresses are longer than others - and you will want to future proof the design just in case the business grows. </p>
      <p>As to the font, I will suggest that Helvetica gets used a lot. And News Gothic. But a formula should be avoided. This is meant to be creative work...</p>
      <p>BTW It’s a good idea to make the title a bit more descriptive of your question in the future. It fact you may want to change it if you want more responses.</p>
