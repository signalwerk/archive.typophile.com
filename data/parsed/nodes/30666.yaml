    html: |-
      <p>I wonder if it might be worth trying to output your pages with an <em>inkjet</em> printer. My Epson 900 (PostScript, quite old now) and Epson 2200 (bought in 2004, not PostScript) both make the color of the type significantly darker than my Apple LaserWriter 360 (13 years old and still going strong!!!). The LaserWriter is truer to the digital original, but in the case of what you desire for the Electra, you don’t want faithfulness, you want fullness!</p>
      <p>As Patty said above, the digital version of Electra is pale and skinny compared to the original metal version, I think in large part because what’s missing in the digital is the effect of the ink squeeze that would always be present in letterpress printing on uncoated paper. Let me be clear about results, too: this is with digital type fonts output to an imagesetter and printed by offset, vs. brass matrices used to cast lines of type which are then printed by letterpress, well printed and not overinked.</p>
      <p>Below you will find a comparison between the original 12-pt. Electra set in metal, and a digital version also set at 12-pt. The scan of the metal Electra was carefully made and was not altered to make it look heavier. It comes from the actual booklet released by Mergenthaler Linotype to announce the type in the 1930s.</p>
      <p>No wonder you think there is a difference!</p>
      <p>So I’d say if you like Electra (and it’s a wonderful type!), play around with different papers and output devices to see if you can gain some body weight in your final printed versions, even if the type looks too scrawny on-screen. After all, the only thing that matters is the appearance of the final printed result in the hands of the reader, not how you got there.</p>
      <p>Hope this is of some help.</p>
      <p> </p><div class="imageWrap"><img src="files/electra_letterpress_digital_6605.gif"></div><p></p>
