    html: |-
      <p>&gt;Yes, obviously there were subtle changes whenever any font was adapted from metal<br>
      &gt;to film to digital, but for some reason the digitization of Electra is particularly anemic.</p>
      <p>I suspect that this is because, while metal fonts were designed to be point size specific (10pt was different from 12pt, which was different from 24pt, etc.), photo and digital fonts tend not to be. Often, the new digital font is based on <strong>one</strong> of the older specific sizes only.</p>
      <p>Electra’s digital version has both text and Display cuts (<a href="http://www.linotype.com/363/electra-family.html">http://www.linotype.com/363/electra-family.html</a>). I know that even the text is light, compared with the metal version. I don’t know much about the birth of the digital version. I think it was prepared at Mergenthaler Linotype in the US, while there was still a design office there, in the early 1990s.</p>
    html_clean: |-
