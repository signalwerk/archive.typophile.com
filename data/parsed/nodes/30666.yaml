      <p>Thanks all for your expertise…and…ummm, upon closer examination I find you are right.  </p>
      <p>What do you think of the Antique fonts from Stormfont; or the Fells Types from Hoefler - both or either for poems?  They’re gorgeous - I’d love to use them, but they may be a bit “too much,” as if I’m reaching for effects.  </p>
