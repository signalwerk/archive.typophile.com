    html: |-
      <p>&gt;tracking work proportionally to font size?</p>
      <p>Generally speaking, large sizes need to be tracked tighter, unless they are ‘optical sizes’ designed for that size. </p>
      <p>That’s why the screen is unreliable, and proofing highly desirable: at large screen sizes—necessary because of low screen resolution—what will look good will be too tight in a 10 or 12 point print out. </p>
      <p>Because of the lightness of Electra (a fault in the digital type), Bob may well be right that it benefits from tighter tracking at text size. From a type designer’s point of view, at text sizes the designed spacing should work well as a default.</p>
    html_clean: |-
