      <p>The indented title above the rag-right layout seems neither here nor there. I think it will work better left aligned or centered over the longest line of the poem—something Bringhurst mentions. </p>
      <p>Is the title’s font Univers? I would think that something more ‘flavored’ might work better. Just Electra in a heavier weight or larger size may work very well, depending on the nature of the poetry. Using all the same typeface will give a quieter effect.</p>
      <p>Also I don’t know about the grey. If you want grey you will probably have to up the weight of the title so it balances with the text.  </p>
      <p>On tracking: Since you said your concern is how it will look laser-printed to send to publishers, you would best experiment with its effect on the printed product. How it looks on screen is not reliable, as the laser printing will thicken it, and screen always looks different anyway.</p>
