    html: |-
      <p>I wouldn’t get too happy too soon. It does look like Elante has somewhat reduced contrast, but it also quite a bit shortens the ascenders and descenders. That means at a given nominal size it will be blacker and reduced contrast—and so resemble more the print, though I don’t know how closely. However, squashing the extenders (especially the g) seriously changes the look of the face. </p>
      <p>Maybe some of the Dwiggens experts can tell us more about the history of  Elante. </p>
      <p>edit: looking a McGrew’s “American Metal Typefaces”, I don’t find it. So it was never available generally in metal. I am guessing it was a modification for phototype, as in that era they *loved* the big x-height. There are probably other differences, but the extenders was the first thing that hit me.</p>
