    <p>I'm looking to mimic the style of late 60's-early 70's Veglia Borletti automotive gauges. I remember them most fondly from a Lancia Fulvia, but Ferrari Dinos used gauges with the same font. It's been suggested that the numerals and text are not the same font, I'm not sure if that's true.</p>
    <p>I'm interested in the labels and numerals, not the small "Veglia Borletti" wordmark.</p>
    <p><a class="freelinking external" href="http://www.i-firme.fr/WebRoot/ce_fr3/Shops/236444/4E30/7CDF/28D0/7901/5177/C0A8/8008/349E/jauge_essence_veglia_borletti_innocenti_mini_.JPG" rel="nofollow">Fuel Gauge</a><br>
    <a class="freelinking external" href="http://www.ferraris-online.com/cars/FE-206GT-00396/images/P019Web.jpg" rel="nofollow">Dino Speedometer</a><br>
    <a class="freelinking external" href="http://www.classicitaliancarsforsale.com/wp-content/uploads/2012/08/22.jpg" rel="nofollow">Fulvia Dashboard (lower resolution)</a></p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        EF Radiant        </div>
