      <p>A typeface that gets you very close (you'll have to manually condense the numerals and expand the letters in some instances to match your samples) is Radiant:<br>
      <a href="http://www.fonts.com/font/elsner-flake/ef-radiant/text-medium" title="http://www.fonts.com/font/elsner-flake/ef-radiant/text-medium">http://www.fonts.com/font/elsner-flake/ef-radiant/text-medium</a></p>
      <p>(Originally designed by Robert Hunter Middleton for the Ludlow Foundry in 1938.)</p>
      <p>URW Imperial is also similar:<br>
      <a href="http://www.myfonts.com/fonts/urw/imperial/" title="http://www.myfonts.com/fonts/urw/imperial/">http://www.myfonts.com/fonts/urw/imperial/</a></p>
      <p>As is Euro Sans:<br>
      <a href="http://www.myfonts.com/fonts/profonts/euro-sans-pro/" title="http://www.myfonts.com/fonts/profonts/euro-sans-pro/">http://www.myfonts.com/fonts/profonts/euro-sans-pro/</a></p>
