      <p>Again, it’s Big Caslon by Matthew Carter. The italic and the swashes are not available for retail yet, to my knowledge they were commissioned by Wallpaper Magazine.</p>
      <p>As an alternative, especially if you’re after the swashes, you could try Adobe Caslon Pro.</p>
