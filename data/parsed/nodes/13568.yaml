    <p>Stuart Sandler of Breaking the Norm:<br>
    "What is so impressive is that in the very short history of MyFonts, it's become a significant sales and distribution vehicle for typefaces and it's usually the first "top of mind" URL people head to, much the same way Google became the default search engine."</p>
    <p>* <a href="http://www.myfonts.com/person/sandler/stuart/" title="http://www.myfonts.com/person/sandler/stuart/" class="link-external">http://www.myfonts.com/person/sandler/stuart/</a></p>
    <p>* <a href="http://www.myfonts.com/foundry/btn/" title="http://www.myfonts.com/foundry/btn/" class="link-external">http://www.myfonts.com/foundry/btn/</a></p>
    <p>Gert Wiescher of Wiescher Design:<br>
    "I have started so many typefaces, I lost count. And I am sure some of them got lost. But there was no way for me to market those designs. The big type manufacturers did not want to have them all, too much hassle. Then I found out about MyFonts - it changed my life. I really enjoy being a type designer only now. I have hundreds of ideas for new typefaces in my little black book and I still have a mountain of unfinished fonts hiding on my hard disk so that I think I will not run out of work for the rest of my life. It is great fun."</p>
