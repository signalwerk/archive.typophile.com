    <p>TYPE DESIGNERS SPEAK ABOUT MYFONTS</p>
    <p>We recently asked some of our designers what they thought of MyFonts, what inspired them, what drove them to design more typefaces. Here is a selection of what they had to say...</p>
    <p>Patrick and Rebecca Alaccari of Canada Type:<br>
    "MyFonts changed our perspective on many things, heightened our senses in a way. We're very observant of every design around us now. We are being creative on every level, and are very aware of the creativity of everything around us as well. It feels like a much more creative and bubblier form of existence. Who needs arguing over the remote when you can debate type aesthetics and design flexibilities instead?"</p>
    <p>* <a href="http://www.myfonts.com/person/alaccari/rebecca/" title="http://www.myfonts.com/person/alaccari/rebecca/" class="link-external">http://www.myfonts.com/person/alaccari/rebecca/</a></p>
    <p>* <a href="http://www.myfonts.com/foundry/canadatype/" title="http://www.myfonts.com/foundry/canadatype/" class="link-external">http://www.myfonts.com/foundry/canadatype/</a></p>
    <p>Nick Curtis of Nick's Fonts:<br>
    "I couldn't be more pleased with MyFonts, both as a medium for offering my typefaces to the world and as a tool for helping me do it better. Nobody does it better, nor does anybody even do it as well."</p>
    <p>* <a href="http://www.myfonts.com/person/curtis/nick/" title="http://www.myfonts.com/person/curtis/nick/" class="link-external">http://www.myfonts.com/person/curtis/nick/</a></p>
