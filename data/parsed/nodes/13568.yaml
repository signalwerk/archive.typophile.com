    <p>ROY COLE is a British typographer (biography) who trained under Emil Ruder at the Allgemeine Gewerbeschule Basel in Switzerland in the 1960s. Now based in Wells, England, he recently completed his own Swiss-style sans, Lina. Slightly condensed, of tall x-height, open of counter, sensibly spaced, Lina has superb legibility. The capitals and figures are lower than the lower-case ascenders, letting in some air even when set tight. The roman font, Lina 30, was drawn originally by hand and later its character set extended and digitally redrawn with the aid of Fontographer. We think it's a fine alternative to the usual sans fonts you might choose when you have lots of text to fit in a small space: catalogs, recipes, packaging, map labels - and of course websites. It comes in 3 weights, each with italics. Each font $21.<br>
