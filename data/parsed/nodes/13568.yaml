    <p>IN YOUR FACE -- THE MYFONTS NEWSLETTER -- JULY 2005</p>
    <p>Technicolor version:<br>
    * <a href="http://www.myfonts.com/newsletters/iyf/200506.html" title="http://www.myfonts.com/newsletters/iyf/200506.html">http://www.myfonts.com/newsletters/iyf/200506.html</a></p>
    <p>In This Issue</p>
    <p>1. Where do fonts come from?<br>
    2. Our 10 new foundries<br>
    * Breaking the Norm<br>
    * Lanston Type Company<br>
    * Typo5<br>
    * Archive Type<br>
    * Omine Type<br>
    * Swansbury<br>
    * Jason J Brown<br>
    * Kenneth Woodruff<br>
    * Roy Cole<br>
    * Puckertype<br>
    3. More new fonts<br>
    4. NYC Type Week<br>
    5. Type designers speak<br>
    6. Regulars</p>
    <p>===============================================================================</p>
    <p>"I found out about MyFonts - it changed my life. I really enjoy being a type designer only now. I have hundreds of ideas for new typefaces in my little black book."<br>
    - Gert Wiescher, 2005</p>
    <p>"Mommy, where do fonts come from?" - It's what every parent dreads. Over 97% of parents reported that they had been embarrassed by the question, and mumbled something like "they come from computers". Well, you already know that MyFonts is the easiest way to get hold of the latest fonts online. But where on earth do we get them from?</p>
    <p>Truth is, they are created by talented individuals around the world who get a kick out of making that one undefinable element for your designs. Whether they're from the masters and mistresses of pen and brush, from the stone-carver and the metal-carver, or from the mouse-masher and the pixel-popper, new designs for letters are imported into the FontLab program, tweaked and tested until they make a coherent new typeface, then saved out as fonts ready for market.</p>
    <p>And why do they bring them to MyFonts? First, MyFonts hands back 65% of the retail price you pay to the designers. This gives them an unprecedented incentive to come up with great new designs. Second, MyFonts lets type designers know day-to-day what's selling and what's not. This lets them know just what kind of fonts you want! Read what just four of our participating designers have to say below.</p>
    <p>===============================================================================</p>
    <p>LETTER FROM THE EDITOR</p>
    <p>A super summer for font lovers is in store, with New York City holding Type Week, TypeCon bringing font makers and font lovers together - and of course plenty of new fonts from MyFonts. We're delighted that we're able to continue introducing such a wide variety of font genres to MyFonts users from our existing foundries and the ten foundries new this issue. Feeling funky? Then check out the refreshing and youthful Breaking the Norm collection. Fine revivals of American classics? Then the Lanston collection is where we'd like to direct your attention. Want an antique 19th century look? Archive Type adds a ton of fonts for you. And yes, there's more from that most fontologically active continent, South America.<br>
    Happy font finding!<br>
    -- Laurence Penney, In Your Face Editor</p>
    <p>===============================================================================</p>
    <p>INTRODUCING OUR 10 NEW FOUNDRIES</p>
    <p>BREAKING THE NORM is a new American foundry. Until their debut here at MyFonts, the amazing collection of 500 BTN fonts, all brand spanking new, has only been available for specialist purposes. This is a fantastic collection of affordable fonts to add all kinds of flavors to your designs. Talented designers Stuart Sandler and Brian J. Bonislawsky worked with a team of seasoned font engineers to bring the project together. Our faves? We love the cheery comic-book sans-serifs Surfer Shop, Candy Round and Mandingo. Scrumptious scripts include Youngsook, Bleedblob, Holiday Springs, and Tropicali Script. And a series of picture fonts like Tribal Dividers and Lil' Tipsy rounds off the collection. Browse 102 colorful graphics to see them in action! And the prices? Just $12.99 each.<br>
    BTN fonts are 20% off for 4 weeks!</p>
    <p>* <a href="http://www.myfonts.com/foundry/btn/" title="http://www.myfonts.com/foundry/btn/">http://www.myfonts.com/foundry/btn/</a></p>
    <p>* <a href="http://www.myfonts.com/browse/foundry/btn/" title="http://www.myfonts.com/browse/foundry/btn/">http://www.myfonts.com/browse/foundry/btn/</a></p>
    <p>ARCHIVE TYPE is a great collection of historic fonts compiled and digitized by Archive Type of Slovenia. The foundry specializes in old typefaces found in old prints, books and samples. The thirty fonts, with the imperfections from years of good service all perfectly preserved, bring all the script, sans-serif and poster styles from a 19th century print shop to the digital age! Our faves are Archive Grotesque Shaded, Archive Penman Script and Archive Lightface Extended. Character sets are just as found, so please check if you need more than basic English. Fonts $14.95 each, with permanent discounts of 10 fonts at discount of 30%, 30 fonts for 50% off.</p>
    <p>* <a href="http://www.myfonts.com/foundry/archivetype/" title="http://www.myfonts.com/foundry/archivetype/">http://www.myfonts.com/foundry/archivetype/</a></p>
    <p>* <a href="http://www.myfonts.com/browse/foundry/archivetype/" title="http://www.myfonts.com/browse/foundry/archivetype/">http://www.myfonts.com/browse/foundry/archivetype/</a></p>
    <p>KENNETH WOODRUFF is the foundry outlet of the San Francisco-based designer and animator of the same name. He designed Next Stop, a set of 6 fonts that mimics the appearance of text panels in buses, trams and other public transport, a super alternative to tired old LCD and bitmap fonts. Recommended use: animate messages on websites using a "glow" effect in Photoshop! Fonts $15 each.<br>
    These fonts are 40% off for 4 weeks!</p>
    <p>* <a href="http://www.myfonts.com/foundry/kennethwoodruff/" title="http://www.myfonts.com/foundry/kennethwoodruff/">http://www.myfonts.com/foundry/kennethwoodruff/</a></p>
    <p>* <a href="http://www.myfonts.com/browse/foundry/kennethwoodruff/" title="http://www.myfonts.com/browse/foundry/kennethwoodruff/">http://www.myfonts.com/browse/foundry/kennethwoodruff/</a></p>
    <p>ROY COLE is a British typographer (biography) who trained under Emil Ruder at the Allgemeine Gewerbeschule Basel in Switzerland in the 1960s. Now based in Wells, England, he recently completed his own Swiss-style sans, Lina. Slightly condensed, of tall x-height, open of counter, sensibly spaced, Lina has superb legibility. The capitals and figures are lower than the lower-case ascenders, letting in some air even when set tight. The roman font, Lina 30, was drawn originally by hand and later its character set extended and digitally redrawn with the aid of Fontographer. We think it's a fine alternative to the usual sans fonts you might choose when you have lots of text to fit in a small space: catalogs, recipes, packaging, map labels - and of course websites. It comes in 3 weights, each with italics. Each font $21.<br>
    Roy Cole fonts are 40% off for 4 weeks!</p>
    <p>* <a href="http://www.myfonts.com/foundry/roycole/" title="http://www.myfonts.com/foundry/roycole/">http://www.myfonts.com/foundry/roycole/</a></p>
    <p>* <a href="http://www.myfonts.com/browse/foundry/roycole/" title="http://www.myfonts.com/browse/foundry/roycole/">http://www.myfonts.com/browse/foundry/roycole/</a></p>
    <p>PUCKERTYPE is the own label of Christopher Risdon who lives in Brooklyn, New York. Satellite PT is a family of three geometric sanserif fonts with a feel of primitive electronic equipment, released along with two other families, SAV PT and Cheek PT.<br>
    Puckertype fonts are 50% off for 4 weeks!</p>
    <p>* <a href="http://www.myfonts.com/foundry/puckertype/" title="http://www.myfonts.com/foundry/puckertype/">http://www.myfonts.com/foundry/puckertype/</a></p>
    <p>* <a href="http://www.myfonts.com/browse/foundry/puckertype/" title="http://www.myfonts.com/browse/foundry/puckertype/">http://www.myfonts.com/browse/foundry/puckertype/</a></p>
    <p>LANSTON TYPE COMPANY is one of the most historic names in printing history, and their success marks the point where the USA took the technological lead in printing. In 1887 Tolbert Lanston received his first patent for a mechanical typesetting device. Later refinements led to the revolutionary Monotype casting machine and the emergence of the Lanston Monotype Company of Philadelphia as one of the most renowned type supply companies in the world. Development of the Lanston typeface library was directed by leading American type designer Frederic Goudy from 1920 and later Sol Hess. Read more at our page about Lanston.<br>
    In 2004 Lanston was acquired by P22 type foundry of Buffalo, NY. The classic designs of Goudy and Hess, along with newer designs by such contemporary masters as Jim Rimmer, Dave Farey, and Gerald Giampa, have now been relaunched in definitive new versions. We think fans of classic text fonts will be delighted to see versions of Goudy's Deepdene, Goudy Thirty and LTC Garamont, while of the newer designs we are struck by the beauty of Giampa's LTC Jacobean Initials. Color each layer separately for perfect drop capitals at chapter beginnings. Fonts from $19.95.<br>
    Lanston fonts are 25% off for 4 weeks!</p>
    <p>* <a href="http://www.myfonts.com/foundry/lanston/" title="http://www.myfonts.com/foundry/lanston/">http://www.myfonts.com/foundry/lanston/</a></p>
    <p>* <a href="http://www.myfonts.com/browse/foundry/lanston/" title="http://www.myfonts.com/browse/foundry/lanston/">http://www.myfonts.com/browse/foundry/lanston/</a></p>
    <p>TYPO5 fonts are our latest addition from Latin America. Award-winning designer German Olaya from Bogota, Colombia, has 6 families with us. His fonts aren't exactly grunge... post-apocalyptic seems a better word for them. Civility, even delicacy, is evident -- but only beneath layers of grime. When your daughter marries that Hell's Angel, design the wedding invitation with Chato Band. Liner notes for a thrash/harmonious band? Use Kab. Typo5's fonts have been used worldwide in magazines, music industry, snowboard designs, books, TV, and Hollywood movies. Fonts from $16.95.<br>
    Typo5 fonts are 15% off for 2 weeks!</p>
    <p>* <a href="http://www.myfonts.com/foundry/typo5/" title="http://www.myfonts.com/foundry/typo5/">http://www.myfonts.com/foundry/typo5/</a></p>
    <p>* <a href="http://www.myfonts.com/browse/foundry/typo5/" title="http://www.myfonts.com/browse/foundry/typo5/">http://www.myfonts.com/browse/foundry/typo5/</a></p>
    <p>OMINE TYPE is the foundry of Eduardo Omine (Sao Paulo, Brazil). He brings us three OpenType feature-rich families. Bunker unites stencil types with and without serifs, allowing for interesting stylistic combinations. Gotica Lumina is an excellent attempt to modernize blackletter - a font family with historical flair but easily readable by today's user. Maest is an unconventional blend between calligraphy and constructed type. Surprisingly legible, this 3-weight set would be great for film titles, we reckon.<br>
    Omine fonts are 40% off for 4 weeks!</p>
    <p>* <a href="http://www.myfonts.com/foundry/ominetype/" title="http://www.myfonts.com/foundry/ominetype/">http://www.myfonts.com/foundry/ominetype/</a></p>
    <p>* <a href="http://www.myfonts.com/browse/foundry/ominetype/" title="http://www.myfonts.com/browse/foundry/ominetype/">http://www.myfonts.com/browse/foundry/ominetype/</a></p>
    <p>SWANSBURY of Aberdeen, Maryland specilaizes in handwriting fonts designed by Nan Jay Barchowsky. Barchowsky Fluent Hand is a simple flowing style. By copying the strokes indicated in Barchowsky Dot, you can help your own handwriting to develop a more flowing style too. These are advanced fonts with contextual ligatures: watch them fly in OpenType-aware applications such as Adobe Creative Suite. Fonts $24 each.<br>
    Swansbury fonts are 30% off for 4 weeks!</p>
    <p>* <a href="http://www.myfonts.com/foundry/swansbury/" title="http://www.myfonts.com/foundry/swansbury/">http://www.myfonts.com/foundry/swansbury/</a></p>
    <p>* <a href="http://www.myfonts.com/browse/foundry/swansbury/" title="http://www.myfonts.com/browse/foundry/swansbury/">http://www.myfonts.com/browse/foundry/swansbury/</a></p>
    <p>JASON J BROWN of Toronto offers us Brownhand, a font as friendly as Comic Sans but with serifs. Use it when you need that naive look, but don't want to to look like everybody else. Price $29.<br>
    Jason J Brown fonts 50% off for 4 weeks!</p>
    <p>* <a href="http://www.myfonts.com/foundry/jasonjbrown/" title="http://www.myfonts.com/foundry/jasonjbrown/">http://www.myfonts.com/foundry/jasonjbrown/</a></p>
    <p>* <a href="http://www.myfonts.com/browse/foundry/jasonjbrown/" title="http://www.myfonts.com/browse/foundry/jasonjbrown/">http://www.myfonts.com/browse/foundry/jasonjbrown/</a></p>
    <p>===============================================================================</p>
    <p>MORE FONTS FROM OUR CURRENT FOUNDRIES</p>
    <p>Of the hundreds of new fonts, those that particularly struck the MyFonts eye were:<br>
    * text families Esta from DSType, Relato from emtype, Vista Sans from Emigre<br>
    * the sans and serif OpenType superfamily Amor from Storm with small caps and old style figures<br>
    * OpenType feature-rich fonts Mecheria, Meposa, Amienne and babyish Boopee from Typodermic<br>
    * Milk Script and Mama Script from Sudtipos; Fleurie from Wiescher Design; Flirt from Canada Type<br>
    * blackletters Avebury and Cabazon from Parkinson<br>
    * display fonts Sailor, Nightlife, Jojo and Rush from Canada Type<br>
    * And finally, Kate Greenaway's Alphabet, also from Wiescher Design.</p>
    <p>===============================================================================</p>
    <p>NEW YORK CITY HOSTS TYPE WEEK</p>
    <p>New York, with its advertising and magazine industries to the fore, has always been the most typographic of cities. And this summer Mayor Michael Bloomberg is celebrating the great contribution made by typography to the city, declaring July 18-24 to be Type Week.</p>
    <p>And during that week, finding out more about font conception, gestation and birth (returning to our lead story) has never been easier. The fun and inexpensive TypeCon2005 conference takes place at Parsons School of Design, New York, July 20-24. Learn from the pros how to make letters, listen to talks on typo-topics, then party with typographic designers and aficionados. Join in the week of typographic excitement! Price $235 (pro), $140 (student). Of course MyFonts will be there too. Official site: TypeCon2005</p>
    <p>* <a href="http://www.myfonts.com/info/typecon-2005/" title="http://www.myfonts.com/info/typecon-2005/">http://www.myfonts.com/info/typecon-2005/</a></p>
    <p>* <a href="http://www.typecon.com/" title="http://www.typecon.com/">http://www.typecon.com/</a></p>
    <p>"You can do a good ad without good typography, but you can't do a great ad without good typography."<br>
        -- New York type designer Herb Lubalin (1918-1981)</p>
    <p>===============================================================================</p>
    <p>TYPE DESIGNERS SPEAK ABOUT MYFONTS</p>
    <p>We recently asked some of our designers what they thought of MyFonts, what inspired them, what drove them to design more typefaces. Here is a selection of what they had to say...</p>
    <p>Patrick and Rebecca Alaccari of Canada Type:<br>
    "MyFonts changed our perspective on many things, heightened our senses in a way. We're very observant of every design around us now. We are being creative on every level, and are very aware of the creativity of everything around us as well. It feels like a much more creative and bubblier form of existence. Who needs arguing over the remote when you can debate type aesthetics and design flexibilities instead?"</p>
    <p>* <a href="http://www.myfonts.com/person/alaccari/rebecca/" title="http://www.myfonts.com/person/alaccari/rebecca/">http://www.myfonts.com/person/alaccari/rebecca/</a></p>
    <p>* <a href="http://www.myfonts.com/foundry/canadatype/" title="http://www.myfonts.com/foundry/canadatype/">http://www.myfonts.com/foundry/canadatype/</a></p>
    <p>Nick Curtis of Nick's Fonts:<br>
    "I couldn't be more pleased with MyFonts, both as a medium for offering my typefaces to the world and as a tool for helping me do it better. Nobody does it better, nor does anybody even do it as well."</p>
    <p>* <a href="http://www.myfonts.com/person/curtis/nick/" title="http://www.myfonts.com/person/curtis/nick/">http://www.myfonts.com/person/curtis/nick/</a></p>
    <p>* <a href="http://www.myfonts.com/foundry/nicksfonts/" title="http://www.myfonts.com/foundry/nicksfonts/">http://www.myfonts.com/foundry/nicksfonts/</a></p>
    <p>Stuart Sandler of Breaking the Norm:<br>
    "What is so impressive is that in the very short history of MyFonts, it's become a significant sales and distribution vehicle for typefaces and it's usually the first "top of mind" URL people head to, much the same way Google became the default search engine."</p>
    <p>* <a href="http://www.myfonts.com/person/sandler/stuart/" title="http://www.myfonts.com/person/sandler/stuart/">http://www.myfonts.com/person/sandler/stuart/</a></p>
    <p>* <a href="http://www.myfonts.com/foundry/btn/" title="http://www.myfonts.com/foundry/btn/">http://www.myfonts.com/foundry/btn/</a></p>
    <p>Gert Wiescher of Wiescher Design:<br>
    "I have started so many typefaces, I lost count. And I am sure some of them got lost. But there was no way for me to market those designs. The big type manufacturers did not want to have them all, too much hassle. Then I found out about MyFonts - it changed my life. I really enjoy being a type designer only now. I have hundreds of ideas for new typefaces in my little black book and I still have a mountain of unfinished fonts hiding on my hard disk so that I think I will not run out of work for the rest of my life. It is great fun."</p>
    <p>* <a href="http://www.myfonts.com/person/wiescher/gert/" title="http://www.myfonts.com/person/wiescher/gert/">http://www.myfonts.com/person/wiescher/gert/</a></p>
    <p>* <a href="http://www.myfonts.com/foundry/wiescherdesign/" title="http://www.myfonts.com/foundry/wiescherdesign/">http://www.myfonts.com/foundry/wiescherdesign/</a></p>
    <p>===============================================================================</p>
    <p>REGULARS</p>
    <p>Check our What's New and Special Offers pages for live updates of all the new fonts that go on sale, and the great promotions we run! The Starlets page is our chart of great new fonts.</p>
    <p>* <a href="http://www.myfonts.com/WhatsNew" title="http://www.myfonts.com/WhatsNew">http://www.myfonts.com/WhatsNew</a></p>
    <p>* <a href="http://www.myfonts.com/Promotion" title="http://www.myfonts.com/Promotion">http://www.myfonts.com/Promotion</a></p>
    <p>* <a href="http://www.myfonts.com/starlets.html" title="http://www.myfonts.com/starlets.html">http://www.myfonts.com/starlets.html</a></p>
    <p>We always like to hear of good and bad experiences you have at MyFonts. Just e-mail us at  and we'll get back to you!</p>
    <p>In Your Face is sent out every three months to MyFonts users. It announces every new foundry signing up with MyFonts, new fonts from current foundries, and introduces all the useful and fun new features on the site. To unsubscribe or manage your subscriptions, go here:</p>
    <p>* <a href="http://www.myfonts.com/MailingList" title="http://www.myfonts.com/MailingList">http://www.myfonts.com/MailingList</a></p>
    <p>The font used for our In Your Face masthead is Walburn Tooled from ShinnType.<br>
