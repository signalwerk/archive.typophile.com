    <p>I put a blackletter up for criticism  <a href="http://typophile.com/node/84459" rel="nofollow">here</a>.</p>
    <p>It is a very light blackletter, intended to lure people to think it is a Roman font. It's most possibly of no interest to Rockers(*) that like fake blackletter fonts, but I imagine it could be fun to criticize for other real blackletter nerds.</p>
    <p>So far it has only attracted the attention of one critique and I'm kind of stuck (I want to start making bolder faces and kurrents, but not until I know that the general shapes and ideas are good enough), so I'm in need of more input.</p>
    <p>(*) I just love that word. How a widespread euphemisms for wanking (rock) and banging (rock &amp; roll) became synonymous to a music and life style, through just a few songs with badly disguised sexual innuendo, is just to fun.</p>
