      <p>no, I wouldn't say I'm a "stencil aficionado". I do like things like that though. Old industrial detritus...  It's such a simple, direct and obvious technology. If you are ever in Lunenburg Nova Scotia, the fisheries museum has a great display of stencils and stencil making equipment that used to be used in the canning plants to label boxes. They made some pretty elaborate ones.</p>
      <p>Occasionally the sign shop I work in makes large stencils for pavement markings, but we use a CNC router.</p>
      <p>-=®=-</p>
