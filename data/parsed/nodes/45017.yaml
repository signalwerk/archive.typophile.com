      <p>I cut stencils on my new toy, gravograph LS100. It's a new skool laser cutter, I've had for a while now. The cutting area, eighteen by twelve inches, is already too small for what I want to do in the near future and I've been drooling all over the gravograph IS8000xp which cuts up to twenty four by forty eight inches.<br>
      But for now, I like cutting stencils from mylar for use on canvases etc...</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/stencil_typophile_3572.jpg"></div><p></p>
      <p>If I ever see an old skool stencil machine up around the Ottawa valley I'll let you know :)</p>
