    <p>Er i sure hope this isn't considered as a classified ad or whatever.<br>
    Well here goes i'm a fan of stencil making and i've used "stencil" fonts and they cant beat the real thing. The real thing? Ahh! A good ol' Ideal Stencil Machine or a Marsh even!</p>
    <p>I'm looking for a Ideal Stencil Machine No2. If you ever passed by one in a shop and had a flash: "wow i wish i knew a guy who would post on typophile and say he'd like that machine!".<br>
    Well you now you know that guy, or at the very least you know a poster's name on a forum but close enough ;)</p>
    <p>So yea lemme know if you come across one of those babies :)</p>
    <p>Cheers!</p>
    <p>Ugo</p>
