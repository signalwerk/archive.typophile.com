  html: |-
    <p>New York-area typophiles may be interested in this:</p>
    <p>"Jeanette Abbink and Emily CM Anderson have penned 3D Typography as a reaction to the fact that so much of today’s typography is conceived via screens. Like Gutenberg and generations of typeface designers who worked with physically shaped lead type the featured artists in the book return the literal heft to letters. Join the authors and three contributors, Bela Borsodi, Keetra Dean Dixon and JK Keller as they share the concept and origin of the book, funny anecdotes of their journey, and a showcase of mind-blowing 3D typography projects."</p>
    <p><a href="http://www.nypl.org/events/programs/2010/10/20/art-book-3d-typography?nref=62451" title="http://www.nypl.org/events/programs/2010/10/20/art-book-3d-typography?nref=62451">http://www.nypl.org/events/programs/2010/10/20/art-book-3d-typography?nr...</a></p>
