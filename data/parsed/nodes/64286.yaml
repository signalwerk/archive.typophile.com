      <p>@MargotHoltman </p>
      <p>Because Garamond is one of the most legible typefaces. But the differences between the digital versions are big. My favorites are Merlo (Feliciano Type Foundry) and Stempel Garamond, followed by Berthold Garamond. I feel better with these Garamonds than with Sabon or Sabon Next. (And although I cannot exactly explain why, I dislike Garamond Premier.)</p>
      <p>However, a worthy digital successor of the original Garamond doesn’t seem to exist.</p>
