    html: |-
      <p>This is like saying why do you love someone: if you don’t feel it, it is hard to understand. I just love old-style fonts. Why? Well, I don’t know, but they are elegant and classic, and I like that. And they first appeared in the most beautiful books ever printed (IMO).</p>
      <p>Another approach: the letters reflect the age in which they were born. And the old-style fonts were born in the Renaissance age, one of the most important and interesting periods in history: Gutenberg, the discovery of America, Venice (Aldus!), protestantism…</p>
