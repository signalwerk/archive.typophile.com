      <p>If the fonts you’re working with are in TrueType format, and you’re not averse to hand-editing text files (as opposed to working with a GUI), have a look at <a href="http://www.letterror.com/code/ttx/index.html">TTX</a>. It’s free and it will let you do what you’re trying to do.</p>
      <p>You can download Windows and Macintosh versions from the <cite>ttx binaries</cite> section on <a href="http://sourceforge.net/project/showfiles.php?group_id=29196">this page</a>.</p>
      <p>If you’re using Windows, I compiled a newer version of TTX a while back that you can download from <a href="http://www.font.org/software/ttx/">Adam Twardoch’s TTX page</a>.</p>
