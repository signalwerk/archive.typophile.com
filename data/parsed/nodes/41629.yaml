    <p>Hi,</p>
    <p>I use a certain font for writing musical chord symbols. Now I changed my software for creating sheet music. I would like to keep using my old font with the new software, but unfortunately for transposing, it requires that all twelve pitch names (A, A sharp, B flat etc.) are on certain places in the font. Which of course isn’t the case.</p>
    <p>I hoped there would be a way to map the characters in my old font according to the positions in the new font. E.g. a symbol that used to be on Unicode 0021 would have to go to 00A8 etc.</p>
    <p>As this is not possible from within the software, can anyone suggest a way to do this outside? It only concerns 5 characters, so it would be ok to spend an hour doing it. However, I wouldn’t want to buy software for this issue...</p>
    <p>Thanks a lot.</p>
    <p>Peter</p>
