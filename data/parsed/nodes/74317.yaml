  html: |-
    <p>hello all,<br>
    a question about fontographer 5 (already known from previous versions)...:</p>
    <p>i'm in the process of converting one of my type families from 1000upm to 2048upm.  since that is not exactly 2x1000, all my points and sidebearings are slightly off and have fractional values.  when i "align points to grid" (also with option key pressed), the left sidebearings become integer values again, but the right ones do not.  so far i'm fixing each one individually, which also fixes the total width.... but when working on 10 styles, it becomes endless.  isn't there any command that would round them all off at once?</p>
    <p>....the same question applies to kerning values --</p>
    <p>if not in fontographer, can it be done in fontlab studio?</p>
    <p>thx much,<br>
    joachim</p>
