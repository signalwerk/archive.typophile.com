      <p>Devil’s advocate: You want to go for contrast. Have you thought of using a script for the word “Italian” and then using something more rigid for the word “pixels?” Seems to be a the logical solution, unless of course you actually <em>are</em> going for an ironic juxtaposition of the word “pixels” set in a script.</p>
      <p>Question: Did you intend setting the word “pixels” in a script to be an ironic juxtaposition?</p>
