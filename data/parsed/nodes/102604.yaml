      <p>That's a good point, I agree on the fact that is a quite known and used type nowadays. However, in this case I opted for a brush /script typeface in order to create a dynamic contrast between the rigidity of the concept of a squared pixel, and not to follow any visual trend. I think I might make the script even more custom, do you know some other similar typefaces that might suit the project ? </p>
      <p>Thank you for your time</p>
