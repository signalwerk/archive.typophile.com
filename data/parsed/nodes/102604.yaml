    <p>Hi,</p>
    <p>I am starting a new online community about design and software training . The logo needs to be fresh and professional, but most important relevant to this online community. I am an italian graphic designer, and that's why I called this community "italian pixels", because  I want to make people aware that I'm not mother tongue as I'm going to create youtube educational videos about design and software . Here is the concept I ended up with :</p>
