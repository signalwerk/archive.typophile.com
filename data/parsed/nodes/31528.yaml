    <p>Hi folks, </p>
    <p>Here’s another font ID someone sent me that has me stumped. It reminds me of  Bil’ak’s ’Fedra’, or something by Luc(as) de Groot, or a little bit of Mark Jamra’s ’Kinesis italic’, but I have had no luck finding it. The ’f’ and ’g’ and the triangular serifs seem like obvious earmarks.</p>
    <p>Thanks for your help,<br>
    - Mike</p>
