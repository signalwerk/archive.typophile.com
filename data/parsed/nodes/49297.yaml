  html: |-
    <p>I was riding the Red Line (Boston) this morning, and scrawled across a print ad over one of the windows, in red sharpie, was the phrase "DANGER HELVETICA SCENARIO". The ad had no Helvetica in it. I wish I had a camera on my phone.</p>
    <p>Does this phrase mean anything to anyone?</p>
