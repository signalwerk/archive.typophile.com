      <p><cite>The books will be non-fiction, mostly social sciences. They will be released only in PDF.</cite></p>
      <p>FWIW, I have used a reworked version of Charis-SIL in this context. Two books set in Charis, designed by Cherie Westmoreland, were selected for the AAUP Book Show. To the best of my knowledge, these are the only Libre fonts ever used in an AAUP Book show selection.</p>
      <p>Charis-SIL is esentially the same as Bitstream Charter, a font family designed by Matthew Carter (a MacArthur grant recipient). It is not, perhaps, generally regarded as an elegant font, but is eminently readable.</p>
      <p>Modifications we made were basically in spacing, and cutting old-style numbers -- not particularly needed for social sciences.</p>
      <p>A good companion sans, if you want one, is Lato.</p>
      <p>I can look tomorrow for an Amazon "Look Inside" to show it's use...</p>
