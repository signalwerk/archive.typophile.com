      <p>Sorry, your "best" question doesn't make sense. If there were a "best," everyone would be using it; it would be all over the net. So first step is "best" for what? Romantic poetry? Historical fiction? Social sciences? Physics? And ink on paper or pixels on screen? If on screen, PDF or EPUB?</p>
      <p>Moving on, I know current publishers call themselves "content providers." Which is silly, the author is the content provider. The publisher's role is, say, that of "content assurer." The work of editors and designers (and typesetters) adds a level of quality few authors can bring to their content. Think about that.</p>
      <p>I'd assume by "free" you mean what's generally meant by "libre." "Libre" with fonts means, usually, that the license permits unlimited use, except for (re)selling the fonts. But licenses vary, you need to understand them.</p>
      <p>All of that said, I'm an advocate of libre fonts. And almost all of them need some work to be brought up to first-class status. "Best of the ho-hum" isn't a particularly good place.</p>
      <p>* * *</p>
      <p>Sumner Stone's done fine work over the years. A polished professional. What you would expect from the guy who, when at Adobe, hired Slimbach &amp; Twonbly &amp; generally built Adobe's font department in earlier days...</p>
      <p>However, most of his fonts were drawn when ink was put on paper in a slightly a different way, and have not been re-weighted for DTP printing. Some find that a problem. But web and ink are different...</p>
      <p>You sure you don't want some quality assurance?</p>
