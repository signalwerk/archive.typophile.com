    <p>Hello everybody,</p>
    <p>which free fonts do you consider the best to publish books? I will self publish books under CC, that's why they must be free. There are some amazing ones that are non-free, especially from Adobe, but I couldn't fine anyone that was clean, light and elegant enough to provide a pleasant reading. So maybe you know some. ;)</p>
    <p>By the way <a class="freelinking external" href="http://www.webdesignerdepot.com/2011/02/30-of-the-best-font-foundries/" rel="nofollow">this website</a> contains a description of "Stone Type Foundry", the same font in the attached image. I was astonished how beautiful and elegant it is, and I think it must be perfect to publish a book. Unfortunately it's paid. But what do you think of it? Just curious.</p>
    <p>Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/stonetype_4910.jpg"></div><p></p>
