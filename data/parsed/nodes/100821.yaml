    html: |-
      <p>@Frode Bo Helland:<br>
      <cite>Do you allow people to edit and reprint/republish the book? Do you provide source files for them?</cite></p>
      <p>Well, the answer <em>has</em> to be "yes" to those questions if the book itself is under an open-source license. So you have to be able to do those things to every part of the book in the format (i.e. .doc, .odt, .pdf) in which it will be distributed - and that includes the fonts.</p>
      <p>Now, why he would need to make his book open-source instead of just free as in beer is unclear. Perhaps it's a nonfiction book to which others could usefully add. Or perhaps it includes extensive quotation from another book that's under an open-source license, in which case it <em>must</em> be open-source. Or perhaps he chose to have that license to support the open-source movement.</p>
