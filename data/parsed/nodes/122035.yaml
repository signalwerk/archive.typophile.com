    html: |-
      <p>Designs like this are almost always hand-lettered.</p>
      <p>Inform by Paratype comes close:<br><a href="http://www.myfonts.com/fonts/paratype/inform/">http://www.myfonts.com/fonts/paratype/inform/</a></p>
      <p>So does Brush Hand, by K-Type:<br><a href="http://www.k-type.com/fonts/brush-hand-new/">http://www.k-type.com/fonts/brush-hand-new/</a></p>
      <p>Okay:<br><a href="http://www.myfonts.com/fonts/urw/okay/">http://www.myfonts.com/fonts/urw/okay/</a></p>
      <p>Flash:<br><a href="http://www.myfonts.com/fonts/linotype/flash/">http://www.myfonts.com/fonts/linotype/flash/</a></p>
      <p>House Movements Sign:<br><a href="http://www.houseind.com/fonts/movements/">http://www.houseind.com/fonts/movements/</a></p>
      <p>I’m sure other posters will have even better suggestions....</p>
