    html: |-
      <p>Frode — As an aside: I’m sure Sumner would be the first to point out that ITC Bodoni is not his work alone. He oversaw the project, but the drawings were done by a team of folks. From his own description:</p>
      <p>“The ITC Bodoni was produced by a team of designers, art directed by Sumner Stone. Holly Goldsmith designed the Six Roman; Janice Prescott-Fishman the Seventy-two Roman; Jim Parkinson the Six Italic; Mr. Stone the Seventy-two Italic, the Swash Capitals for the Seventy-two Italic, and the Ornaments. The Twelve point versions of the family were produced by computerized interpolation between the Six and Seventy-two point versions.”</p>
      <p>Just thought I’d clarify.</p>
