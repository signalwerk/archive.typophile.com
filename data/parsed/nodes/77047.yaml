      <p><cite>I read your question as a secret wish to see a book set in the 6-point master.</cite></p>
      <p>Yup. I'd like to see one set using the 6-point master for text. I bet the contrast would be better, but the characters themselves a bit worse for a 10 or 11 point setting. If that was only ascenders and descenders, that'd be easy to fix. Usually there is a bit more to it. And the sidebearings might need some work -- again, not too hard.</p>
