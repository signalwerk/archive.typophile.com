      <p>The didone types are hard to master.<br>
      They are frequently criticized for poor readability, but IMO the fault generally lies with the typographer, not the face.<br>
      There is also prejudice, within some sections of the typographic community, against anything which is not an easy read.</p>
      <p>The violin, it could be said, has poor listenability.<br>
      It is a difficult instrument to play, and to listen to.<br>
      The Bach Partita in D, for instance, is not background music.<br>
      But if it is played by a maestro, and one is prepared to apply some concentration, the entire piece may be listened to and the experience can be quite rewarding.</p>
