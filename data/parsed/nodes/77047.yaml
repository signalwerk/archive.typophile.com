    html: |-
      <p>There are a large number of Bodoni fonts out there. Berthold Bodoni Antiqua medium works OK for books. </p>
      <p><a href="http://www.bertholdtypes.com/bq_library/90005.html" title="http://www.bertholdtypes.com/bq_library/90005.html">http://www.bertholdtypes.com/bq_library/90005.html</a></p>
      <p>Long ago, I made up a set of Bodoni Book fonts with os figs and small caps, based on whatever Adobe was offering. May have had to changed the contrast of the thick-thin strokes a little, I can't remember.</p>
      <p>I think the smallest master size from Sumner Stone would probably work for text. It may say six point, but with today's workflows (direct to plate), probably the best bet, even for an 11-point setting.</p>
      <p>As with so many older fonts, all it takes is somebody sitting down and looking at the ink on the paper rather than the type forms. You can't quite duplicate the look of meal, but you can come close enough. The problems is most Bodoni's go for sparkle, and that means too high a contrast between the thick and thin strokes of the characters.</p>
