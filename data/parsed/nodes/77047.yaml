      <p>I have several books set in (a) Bodoni I'd really love to read, but can't (i.e. the absolutely worthwhile books by Paul Rand).<br>
      Especially when printed on coated paper it is a pain to read!<br>
      So, if you choose Bodoni make sure you pick a variant/weight without too much contrast and/or a natural uncoated stock (maybe with some volume). Readability will probably benefit from dot gain.</p>
