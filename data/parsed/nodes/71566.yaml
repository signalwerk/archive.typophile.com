      <p>Reminds me of the identity I did for <a href="http://mkdunkley.com/" target="_blank" rel="nofollow">MKDunkley</a> (don't worry - he's a local artist, and probably unknown in your area).</p>
      <p>There's nothing to hold "AMG" and "Engineering" together. Maybe make "Engineering" the same width as "AMG" and thicken it up.</p>
      <p>I'd also come up with a second version of the logo to be used at smaller sizes, with thicker stencil breaks in the "AMG".</p>
      <p> - Lex</p>
