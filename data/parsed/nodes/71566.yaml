    html: <p>FWIW I think this looks fragile. It most certainly does not look "solid", for that the stroke weight needs to be much heavier or the type needs to be of a slab variety. Also the pointy joints in A and M spell "precision" and that translates more into the manufacturing and fabricating rather than building restoration.</p>
