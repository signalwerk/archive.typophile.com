    <p>Hi everyone!</p>
    <p>My name is Pierluigi and I'm an italian student of graphic design looking forward in improving my skills in typography (I suck at it).<br>
    I have seen so many impressive works in this forum that I really wanted to join and learn from the masters :)</p>
    <p>Recently I got the job of creating a logo for an already established Civil Engineer Agency (builds and restore buildings), which requires a solid but, yet, quite modern and dynamic look. After a few tests here's what I'm up to :</p>
    <p><a href="http://img194.imageshack.us/i/amgprova5.jpg/" title="http://img194.imageshack.us/i/amgprova5.jpg/">http://img194.imageshack.us/i/amgprova5.jpg/</a></p>
    <p>As you noticed, the logo is focused exclusively on type, but as I'm lacking the whole knowledge on the argument I can't improve it anymore. </p>
    <p>Please, help me with your knowledge guys , I really need it!</p>
    <p>P.s: don't criticize the colours , those will be part of the final part in the design process, thanks.</p>
    <p>Thanks very much for your attention,</p>
    <p>Pierluigi</p>
