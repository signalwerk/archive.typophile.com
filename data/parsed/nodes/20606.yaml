    <p>hello all</p>
    <p>i hope im not starting too many threads, its just that im looking for so many different typefaces at once :)</p>
    <p>im planning to do a photographic book about systems, a research about visual systems and different degrees of chaos coming into organized, clean structures.</p>
    <p>my initial thought was <a href="http://www.lineto.com/The+Fonts/Categories/Text+Fonts/Simple/" target="_blank">simple by norm</a>, but it was used SO often for cultural projects in switzerland that i'd like to find something else. the texts will be short, mainly captions for the photos.</p>
    <p>any ideas? thanks!</p>
