      <p>"The type in a publication doesn’t have to refer so literally to the subject; it can simply evoke or sympathize with it."</p>
      <p>I agree with Carl. Between his choices I would say Proforma is a totally "rational" masterpiece. If you still want to adhere to a grid concept more than a more functional design, Sys by Fabrizio Schiavi would be excellent, but it's too light. So I'd say Stephan's and Rodrigo Cavazos' Sophisto: fantastic and one of their best works.</p>
