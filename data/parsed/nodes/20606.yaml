      <p>"There are a thousand of these, and most of them aren’t any good."</p>
      <p>Amen. </p>
      <p>All typefaces ARE systems, and they appear to be designed systematically, and some are done that way, but typefaces that look overtly systematic and rational are usually not very functional. Consider choosing a high-quality text typeface with some systematic "feel" to it, like ITC Tyfa, or Warnock, or Melior, or Proforma, rather than one derived literally from modules. The type in a publication doesn't have to refer so literally to the subject; it can simply evoke or sympathize with it.</p>
    html_clean: |-
