      <p>Maybe you like <a href="http://www.fontshop.de/sukr.php3?searchtext=generation&amp;searchtype=fo-kw&amp;action.x=44&amp;action.y=12&amp;action=Suchen&amp;fsdsess=585dcca9ae4d0352dc756ff4f831b44d&amp;ch=search.php3&amp;fl=y">Generation</a>.</p>
      <p>The system has two axes:<br>
      - light to bold (5 steps)<br>
      - angular to round (5 steps)</p>
      <p>The starting point for the design was the angular font, so you have a kind of modular design which transforms slowly into a still constucted but smooth lettershape.</p>
      <p>The Presentation brochure won a price for typographic excellence: it is based on the principle of crossbreeding applied on typedesign.</p>
