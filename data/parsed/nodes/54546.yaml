    html: |-
      <p>You've either made superb progress in type design over just a year, or you're staying too close to Unger*. He's a great role model in type, but I still think most individuals can contribute much more from themselves than from imitation. The question of what's too close for comfort is a classic and thorny issue in type design, and requires great introspection as well as listening to advice. But quite possibly I'm making a mountain out of a molehill!</p>
      <p>* I'm not an expert in Unger's work so I can't pinpoint too much.</p>
      <p>Anyway, of itself it's quite nice.<br>
      The weakest glyph is the "j" - it needs a braver descender.</p>
      <p>Concerning self-education: many of our great names in the craft have been self-taught. There are pros and cons (just as there are with formal education) but I have to think that in this age of 100,000 fonts it nicely promotes originality. The main problem is that you can take a few extra years to get to the same spot (although the journey might very well be the biggest prize).</p>
      <p>hhp</p>
