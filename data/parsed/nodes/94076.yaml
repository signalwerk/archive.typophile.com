      <p>Hi, some may say it is a localized form. I personally think that it is actually the more appropriate form for those letters. Some may state that this is more Bulgarian or Ukrainian look for those letters.</p>
      <p>I think it depends on the overall style of the typeface, and the market you are willing to sell it to.  No offense to anyone, but i have heard that Russians actually do not like this way of interpreting Л, Д ...so it is up to you.. </p>
      <p>BTW look here <a href="https://www.facebook.com/cyrillictype" title="https://www.facebook.com/cyrillictype">https://www.facebook.com/cyrillictype</a> .<br>
      On this facebook page we have posted many cyrillic type specimens, to serve as inspirations in such moments. May be you will find your answer there. </p>
      <p>PS: I am actually Bulgarian, and prefer the triangular Cyrillic forms (Lambda based) - i find them adding more dynamic look to the typeface...</p>
