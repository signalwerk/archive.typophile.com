      <p>Thanks, John. </p>
      <p>You don't go into geographical preferences, but rather base the choices one should make on typographic idioms. There are however a number of well-known foundries who will offer alternates based on let's say, a Bulgarian, Serbian, Macedonian or Ukrainian preference. What I am finding difficult is plot a course through (a) what looks right for internal fit/consistency (with Latin and Greek too), (b) what is idiomatically/stylistically acceptable (which is subtly different from (a)), (c) what helps legibility/readability (almost impossible to gauge as a non-Russian/Cyrillic reader), and (d) what is generally preferred by (or at least more familiar to) the majority of Cyrillic end-users.</p>
      <p>I'll stick with just Latin next time and not risk looking a fool!</p>
