    <p>Question for Russian and other Cyrillic users...</p>
    <p>Is it fair game to have a Cyrillic /El/ looking like a Greek /Lambda/ as your standard glyph?</p>
    <p>Is it in any way unacceptable? </p>
    <p>Or is it just a localised form?</p>
    <p>I guess the same question applies to /De/ and /Lje/ too.</p>
    <p>Cheers,<br>
    Nick.</p>
