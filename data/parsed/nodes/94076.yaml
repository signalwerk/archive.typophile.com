      <p>It depends entirely on the style of the typeface. There are established idioms of Cyrillic type design, just as there are of Latin type design, so unless you're coming up with some novel style you need to research the idioms carefully and understand what is appropriate to each. The shape of the Д and Л is one of the most characteristic features of most idioms. The triangular form is most often found in styles based on broad-nib pen constructions influenced by the style of renaissance Latin types, e.g. Lazurski.</p>
      <p>Personally, I don't favour the triangular form, even in my types based on broad-nib styles, and think it works best in all-caps display types, not text.</p>
