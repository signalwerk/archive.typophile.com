      <blockquote><p>I am torn between approaches (a) and (c) for a <em>contemporary</em> sans serif design which I am working on. I am intrigued by the deltoid shape because I have a very straight /y/ (a bit like Verdana) and was trying to avoid hooks on the Л, л and wondered if there were any other design options for the Л, л, Д and д.</p></blockquote>
      <p>[Emphasis mine. мЖ] The real question is, what do you mean by ‘contemporary’? Is that a Geometric, or a Humanist sans? A Grotesque or a Neo-grotesque, etc. There are no hard and fast rules for glyph construction of ‘<strong>a Cyrillic</strong>’ typeface—nor are there any for ‘<strong>a Latin</strong>’ typeface, for that matter. Just to make it a bit clearer: compare the straight-legged R and the caudate Q in an Old-Style roman with their bow-legged and bob-tailed counterparts in a Modern typeface… Like John Hudson says, </p>
      <blockquote><p>It depends entirely on the style of the typeface.</p></blockquote>
