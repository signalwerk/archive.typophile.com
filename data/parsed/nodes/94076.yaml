      <p>In the present-day Cyrillic typography there exist three main construction patterns of the upper- and lower-case Д:</p>
      <p>(<em>a</em>) The delta-like, isosceles; it is often used in Old-Style serifs, in Geometric and Humanist sans-serifs (e.g., in <a href="http://paratype.com/pstore/fonts/Lazurski.htm" rel="nofollow">Lazurski</a>, <a href="http://paratype.com/pstore/fonts/ITC-Kabel.htm" rel="nofollow">ITC Kabel</a> and <a href="http://www.adobe.com/type/browser/landing/hypatia/hypatia.html" rel="nofollow">Hypatia</a>), and also in type designs inspired by Roman monumental lettering (e.g., <a href="http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFontPackage&amp;code=1952" rel="nofollow">Trajan Pro 3</a>, <a href="http://castletype.com/html/tipoteca/goudy-trajan-regular.html" rel="nofollow">Goudy Trajan</a>, <a href="http://www.malgil.com/esl/SPQR-Caps-1p.pdf" rel="nofollow">SPQR</a>);</p>
      <p>(<em>b</em>) The right-triangular, lateen-like: it is typical of the 18th–early 19th century Moderns (Didot, Bodoni, etc.), and has the similar historical flavour (e.g., in <a href="http://paratype.com/pstore/fonts/ITC-Bodoni-72.htm" rel="nofollow">ITC Bodoni</a>, <a href="http://paratype.com/pstore/fonts/Elizabeth.htm" rel="nofollow">Elizabeth</a> and <a href="http://paratype.com/pstore/fonts/ITC-Machine.htm" rel="nofollow">ITC Machine</a>); this pattern is occasionally used in other designs, with no connotation to style Empire; and </p>
      <p>(<em>c</em>) The trapezoid; it is much more appropriate for Modern and Grotesque sans-serifs (e.g., in <a href="http://paratype.com/pstore/fonts/Bodoni.htm" rel="nofollow">Bodoni</a> and <a href="http://www.linotype.com/48344/HelveticaWorld-family.html" rel="nofollow">Helvetica World</a>); this pattern is also typical for the late 19th-century ‘Old-Face’ romans designed in the eclectic Beaux-Arts style, e.g., <a href="http://paratype.com/pstore/fonts/Literaturnaya.htm" rel="nofollow">Literaturnaya</a>, née Lateinisch (Berthold, 1901).</p>
      <p>In (<em>b</em>) and (<em>c</em>) the ascending diagonal is drawn either straight, or sagging, or—occasionally—slightly bowed.</p>
      <p>The form of the Д and д is usually coördinated with the Л, л, Љ, and љ, e.g., in <a href="http://www.type-together.com/Maiola" rel="nofollow">Maiola</a>, <a href="http://paratype.com/pstore/fonts/Standard-Poster.htm" rel="nofollow">Standard Poster</a>, or <a href="http://typography.net/fontfamilies/view/28" rel="nofollow">Bliss Pro</a> (this is the general rule, and there are many exceptions, like <a href="http://paratype.com/pstore/fonts/Academy.htm" rel="nofollow">Academy</a>, <a href="http://paratype.com/pstore/fonts/Kis.htm" rel="nofollow">Kis</a>, <a href="http://www.ascenderfonts.com/font/candara-family.aspx" rel="nofollow">Candara</a>).</p>
      <p>The trapezium-based pattern of the sans-serif Д with the top left corner rounded—e.g., in <a href="http://paratype.com/pstore/fonts/ITC-Benguiat-Gothic.htm" rel="nofollow">ITC Benguiat Gothic</a>, <a href="http://paratype.com/pstore/fonts/Sistemnyi.htm" rel="nofollow">Sistemnyi</a>, or in <a href="http://paratype.com/pstore/fonts/ITC-Anna.htm" rel="nofollow">ITC Anna</a>—is well familiar to the users of Cyrillic.</p>
      <p>The Latin form (D) is used in most Cyrillic script typefaces, inspired by both handwriting and calligraphy (but not in italics), e.g., <a href="http://paratype.com/pstore/fonts/Kapelka.htm" rel="nofollow">Kapelka</a>, <a href="http://paratype.com/pstore/fonts/English-157.htm" rel="nofollow">English 157</a>, <a href="http://www.myfonts.com/fonts/underware/bello/" rel="nofollow">Bello</a>, <a href="http://paratype.com/pstore/fonts/Decor.htm" rel="nofollow">Decor</a>, <a href="http://paratype.com/pstore/fonts/Kisty-C.htm" rel="nofollow">Kisty-C</a>, <a href="http://paratype.com/pstore/fonts/Zhikharev.htm" rel="nofollow">Zhikharev</a>, <a href="http://paratype.com/pstore/fonts/ITC-True-Grit.htm" rel="nofollow">ITC True Grit</a>, <a href="http://paratype.com/pstore/fonts/ITC-Zapf-Chancery.htm" rel="nofollow">ITC Zapf Chancery</a>.</p>
    html_clean: |-
