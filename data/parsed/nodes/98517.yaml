    <p>Hi everyone -<br>
         I've spent several hours online searching for a font that might mimic the appearance of the hand drawn typeface used for the cover of an old Farmer's Almanac.  Anybody know of a close fit? I like the the shading and roundness of the letterforms, but most examples I've found online take the decorative aspect too far for my liking (i.e. zebrawood).</p>
    <p>Thanks,<br>
    Evan</p>
    <p><img src="/sites/default/files/old-images/almanac_deetail_4665.jpg"></p>
