      <p>There are many specs written by IT groups in corporations, schools, and government, which require a desktop computer to boot in Windows to be approved for purchase.  This little diddy just skipped around that catch 22 and opens the choices. That is not to say that hordes will jump at the chance, it just says there is a choice. This is more a point for the UNIX research crowd than for the smaller design publishing market which Apple already has.</p>
      <p>ChrisL</p>
