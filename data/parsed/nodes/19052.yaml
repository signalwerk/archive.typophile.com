    html: |-
      <p>The other thing this does, of course, is to enable Mac users to take advantage of the serious and considerable lead that the Windows versions of Office software have over the Mac versions, especially in terms of internationalisation and complex script support.</p>
      <p>I'll be interested to see what impact this has on companies that produce software for both Windows and Mac (including Microsoft). It may convince some to scale back their Mac-specific development. Why, after all, would you invest in two development teams when the product of one will work on both platforms? And then there are all those companies that have a niche market developing applications for the Mac, who will suddenly have competition from often larger and better funded companies making similar Windows software. I suspect the impact will depend on how seamlessly Bootcamp allows Windows apps to run within a general Mac environment. If developers for Windows apps start shipping them with Mac-like skin options, the competition will be even stiffer. It could be the death knell for a lot of Mac-specific software development.</p>
