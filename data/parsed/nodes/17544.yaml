    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 26.Jan.2006 6.08am </div>
      <p>Hello there</p>
    <p>Typeradio is still alive; more than ever. Last week the first typeradio-show happened at the 33pt event in Dortmund featuring MC Rick Vermeulen, MC Loudmouth, Miss Kathy &amp; the translating bear. Of course the show was presented by LoveLiza &amp; Donald Beekman.</p>
    <p>The next show which will be on Typo Berlin 2006. If you want to be part of the show, you are always welcome to contact us with you suggestions. There is also a typeradio mailing list on the typeradio website.</p>
    <p>Meanwhile we have more than 200 episodes online, waiting for you.<br>
    <a href="http://www.typeradio.org/loudblog/" title="http://www.typeradio.org/loudblog/">http://www.typeradio.org/loudblog/</a></p>
    <p>For a new project Underware is searching for two freelancers.<br>
    The project will be presented in may 2006. So please hurry up, and react fast.</p>
    <p>01 Somebody who is interested in type, who can type fast (70 wpm+) and who likes to listen to the radio.</p>
    <p>02 Somebody who knows all about flash 8 &amp; Action-script 2 &amp; databases.</p>
    <p>Please get in contact with us as soon as possible.<br>
    info(at)underware.nl</p>
    <p>Thank you and best regards, Underware</p>
