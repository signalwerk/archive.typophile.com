    <p>I am looking to find information or resources on a talk by Otl Aicher which he supposedly gave in Paris shortly after Rotis was released.</p>
    <p>He seems to have claimed that Rotis bridges the difference between catholic and protestant, or something like that. Anyone heard of it? Anyone knows of printed sources?</p>
    <p>Thanks!<br>
    Tim</p>
