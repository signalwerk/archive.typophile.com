      <p>Hi Tim</p>
      <p>By curious coincidence I have an exhibition checklist for an Otl Aicher show at the Herb Lubalin Study Centre which took place in Nov/Dec 2000, which you are welcome to. Email me your address at ben [underscore] archer [at] me [dot] com and I'll mail it to you – it's only A3. It mentions Rotis of course, as aiming to reconcile the serif and sans serif traditions, but no other bridge-crossings or boundary-blurrings are hinted at.</p>
