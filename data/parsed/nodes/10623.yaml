  html: <p>I'm working on my first set of true small caps.  I see that in a few fonts the small caps are a little taller than x-height, although theoretically they should be the same as the x-height.  Are there any guidelines for this?  I can see how it might be helpful if a font had a smallish x-height (mine is average).  For my first version I made the stems of the small caps the same thickness as those of the lowercase letters, but I think this is not quite enough.  I'd be grateful for any pointers on this topic. <br> <br>David</p>
