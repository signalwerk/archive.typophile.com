    html: <p>I am an author who occasionally makes his own fonts. I am currently using MS-Word2000 going all the way through to colour-pdf separations for film. I want the whole book to be in a single font--it's working OK, except that when I select small-caps through the format command, Word just makes the small-caps a smaller point-size. I want to embed a smallcap alphabet in my trutype font which MS-word then knows to select. Is this impossible? Is this what open types is for? I only have fontographer version 3 and the cheaper 'font creation program'. <br></p>
