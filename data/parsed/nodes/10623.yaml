  - id: 66705
    user: 1572
    date: 2003-03-02T12:11:00
    date_raw: 2 Mar 2003 — 12:11pm
    votes: null
    html: <p>I did test printouts using Adobe Garamond Pro and Warnock Pro, which I happen to own and which contain true small caps; in both cases the small caps were as I describe, just slightly higher than x-height.  Palatino Linotype had the small caps the same as x-height.  I do not remember where I learned this principle about small caps, but it has been in my head for a while. <br> <br>I am speaking of small caps designed to go with traditional serif book faces, if that makes any difference.  I have used small caps in the past for entering names of Unicode characters in documentation (e.g., LATIN SMALL LETTER THORN) when they occur in running text, and I think that this use does look better with small caps at x-height size (more or less) than it would with taller ones.  I have also seen a word beginning with a cap and the rest in small caps, where a larger size small cap works better.  I'm not sure about all this, which is why I'm asking . . .  <br> <br>David</p>
