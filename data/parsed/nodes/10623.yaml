    html: <p>There are some small caps versions that have different points of view. Personaly I have a curiosity to understand better some combinations and aspects. This AGaramound that have the l/c align to 5-6% than x-height are design to big sizes? Perhaps they have few legibility to small sizes?. Probably the better way is you define a size and try to experiment some tests with different sizes betten x-height and the capital line.  <br> <br>What the typophile community think about the figures, punctuation, basic characters?  <br> <br>Ricardo <br></p>
