    html: <p>&gt; theoretically they should be the same as the x-height. <br> <br>Who told you that? <br>To me it's exactly the opposite. The main reason is that some acronyms* (like "OS", or "SC"!) will look like lc if the smallcaps are as short as the x-height - throwing off the reader. <br> <br>* Which is essentially the main use of smallcaps these days. <br> <br>hhp <br></p>
