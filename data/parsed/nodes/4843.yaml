but a bit dull) to ITC Novarese (excllent (IMO) for advertising the hotel to guests but maybe a bit much for this). <br> <br>I have been given a pretty free reign with the type so I would like to use something that is not too common. <br> <br>I would like a sans that works well as a text face - not just headings. <br> <br>I think that's everything - Fire away!</p>
