    html: <p>As Kent and Hrant and John point out, there are at least two way you can go :-) Antiquated plantationism, or nanny toting yuppyism. I wouldn't get too locked in to overly antiqued *plantation* style type if your audience is looking to buy the island. Kent, I was thinking <a href="http://www.typography.com/catalog/requiem/index.html" target="_blank">HTF Requiem Titling</a> for even more grace! <br> <br>At any rate here are some photos from a visit to a plantation on Martinique in the French West Indies. The type is on the rustic side, but you may find it useful. I got some very odd looks from the staff as I ran around photographing the inside of victrolas and every swinging rhum label on display... all for the type. <br> <br>Randy <br> <br><img src="http://www.typophile.com/forums/messages/4100/36405.jpg" alt=""> <br><img src="http://www.typophile.com/forums/messages/4100/36406.jpg" alt=""> <br><img src="http://www.typophile.com/forums/messages/4100/36407.jpg" alt=""> <br><img src="http://www.typophile.com/forums/messages/4100/36408.jpg" alt=""> <br><img src="http://www.typophile.com/forums/messages/4100/36409.jpg" alt=""></p>
