    html: "<p>This sounds like a pretty interesting project. <br> <br>I might go for something colonial, and maybe weathered. <br> <br>What about Founder's Caslon? <a href=\"http://www.hwcaslon.com/\" target=\"_blank\">http://www.hwcaslon.com/</a> <br> <br>If you go too anachronistic though you might have trouble finding a good sans, especially a texty one. Or you could have a sans that contrasts sharply with the Roman, since the hospitality industry is generally about clean, shiny, efficient things. Like something from Spiekermann. <br> <br>Another serif idea is Octavian: somewhat old-fashioned, dignified, and highly readable. <br> <br>Oh wait, I got it! Quadraat, serif &amp; sans. And there's a really cool Headliner cut too. <br> <br>&gt; the choice of typeface is a very personal decision <br> <br>Well, in that there are simply too many choices, I agree!  :-) <br>But there are still good and bad choices, of course. <br> <br>hhp <br></p>"
