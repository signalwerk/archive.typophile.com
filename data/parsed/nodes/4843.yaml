    html: "<p>Scala is not a bad idea, but i found the Serif a bit straight for the subject. Scala Sans got all necessary qualities you're looking for. perhaps the open caps series from Scala can be fun to use too? <br> <br>Bliss, as Gotham and others are too clean for that subject (in my opinion). <br> <br>Because Paul Stanley refer to Le Monde, why not the full ligatured-alternates Le Monde Livre Classic <a href=\"http://www.typofonderie.com/alphabets/view/LeMondeLivreClassic\" target=\"_blank\">http://www.typofonderie.com/alphabets/view/LeMondeLivreClassic</a> combined with Scala Sans, with the beautiful Sirenne for some titling? <br> <br>And why not Cochin? the italic is wonderful: <a href=\"http://www.myfonts.com/fonts/linotype/cochin/familytree.html\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/cochin/familytree.html</a> Combined with Peignot!! (be careful Peignot is not easy to handled to produce a result with style and not amateurism). <br> <br></p>"
