    html: "<p>Okay, in an effort not to be merely a naysayer, let me see if I can offer a different suggestion. <br> <br>Your brief wasn't crystal clear to me, so I may be way off base. But I think if I was creating a lavish sales piece for wealthy island-shoppers with full-color photos and a matte uncoated (like Vintage Velvet, mmm) then I might try combining the following: <br> <br>I'd start with Hoefler Titling for some nice large graceful heads. I'd also use it to pull out keywords as graphic elements to play against large beauty photography. <br> <br>Then I'd use MvB Verdigris for the main sales text. And give it an extra bit of air for a relaxed, \"I can afford to be extravagant\" feeling. <br> <br>I'd follow up with FTF Stella for all the nuts and bolts sans serif stuff -- complementary bits of text, captions, financial tables.  <br> <br>Hoefler Titling will give you all the elegance and luxury you need. Use it sparingly and set it is island colors. Verdigris is classic, but fresh and solid: very reassuring.  Stella is clean and versatile, friendly but confident. <br> <br>This is not a combination I've tried yet. Just making it up. And it's been a while since I did any marketing sales pieces. But at least now others have something to respond to and maybe you'll get some good suggestions. <br> <br>Good luck. <br> <br>-- K. <br></p>"
