    html: "<p>Your original suggestion of Garamond as \"good but a bit dull\" tends to suggest it might be right. There doesn't seem to me to be anything wrong with \"a bit dull\" in this context. If you get the details right some Garamond or a Garamondish thing (Sabon, say) could be just what's wanted, and the blandness might let you be a bit bolder in display. <br> <br>Some other random suggestions (Warning! from a typographic amateur, but one who knows a few nanny-toting-yuppies): <br> <br>(1) If for an American audience, how about something by Goudy: FB Californian, eg. This kind of elegant but slightly precious font seems to have an old-money yacht club kind of feel: reliable elegance. It might be too mannered for text, but it would certainly be a candidate for display. I'd be worried that Hoefler Titling or Requiem are too much \"old aristocracy\" and a bit too literary. Goudy for people who bought their furniture, which is what you probably want. <br> <br>(2) If you're thinking of Quadraat have a look at Smeijers' Fresco <a href=\"http://www.ourtype.com\" target=\"_blank\"> (from ourtype)</a> too. It's pretty bland (I mean that in a good way), and pretty complete too. I've only seen one book set in it, and it looked finely reticent. You might also have a look at Arnhem, though it has some quirks which you might not want (notably very low cap height). <br> <br>(3) Could Galliard be another possibility? Seen around a lot. Used in books a lot. Now rather out of fashion around these parts? But it's classic and polished without being tricksy. A great deal seems to depend on how well it's set and printed. <br> <br>(4) Finally, what about Le Monde? Everything's there, it looks great printed, and any implications or overtones it has will be exactly the right sort of thing. More \"businesslike\" than Garamond or Galliard, but that may be no bad thing.</p>"
