  html: |-
    <p>I'm looking for a typeface that comes in heavy weights, and has echoes of Gotham black (strong, authoritative but unpretentious), but isn't Gotham. A bit warmer, perhaps with subtly rounded corners, or perhaps a bit more condensed. Still basically geometrical though.</p>
    <p>This is mainly for a logo, probably all-caps. </p>
    <p>Neutra would be a possibility, except there are two Ns in the logo and the sharp-angled Neutra N isn't the feel I'm going for here.</p>
    <p>Any ideas?</p>
