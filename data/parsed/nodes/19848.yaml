    <p>Hmmmm... I know Calibri, Candara, and Corbel (3 of the new fonts in Windows Vista) promise to bring sans oldstyle figures to the masses next year... but is there any font that’s common in today’s Windows systems that also includes OSF? I don’t think there is, but maybe I’m overlooking something.</p>
    <p>Thanks in advance,<br>
    —Michael.</p>
