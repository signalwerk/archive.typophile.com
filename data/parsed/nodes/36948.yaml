      <p>XeTeX is definitely the easiest route to using more typefaces, but beware that not every typeface has all the math support that you might need. See for example, <a href="http://www.tug.org/pracjourn/2006-1/hartke/">Stephen Hartke’s article in the PracTeX Journal</a> on math fonts.</p>
      <p>For regular (PDF)LaTeX, see the excellent <a href="ftp://tug.ctan.org/pub/tex-archive/info/Type1fonts/fontinstallationguide/fontinstallationguide.pdf">Font Installation Guide</a> by Philip Lehmann. Also, there are several articles about font installation in the PracTeX Journal.</p>
