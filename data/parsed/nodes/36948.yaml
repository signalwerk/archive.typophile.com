    <p>Dear All:</p>
    <p>   Here’s my situation. I write academic papers for a living, and I’m pretty much committed to writing them in LaTeX. Some of my work requires technical notation, for example. I’m also tired of the fonts that come with LaTeX or are easily installed off CTAN. I’m wondering how I might expand the repertoire of fonts I can use. I’d appreciate any suggestions.</p>
    <p>Thanks,<br>
    Bernhard.</p>
