      <p>Installing fonts in (La)TeX has always been a pain, for which you can get some relief at the TeXhax mailing list (<a href="mailto:texhax@tug.org">texhax@tug.org</a>).  Recently, XɘTeX (mailing list at <a href="mailto:xetex@tug.org">xetex@tug.org</a>) has made it possible to use OpenType fonts in (La)TeX.  Also, if you don’t mind learning a new Τεχ-based system, there’s ConTeXt that also has some support in that direction.</p>
      <p>—ℐℴℯℓ</p>
