      <p>In addition to the Font Installation Guide, the LCDF typetools are a very easy way to install OpenType fonts into LaTeX.  There is an automatic mode that is almost automatic. I think there’s one configuration—the updating updmap if I remember correctly—that’s not automatic.  These comments are based on my experience running LaTeX under Linux.  I haven’t tried doing this on Windows.</p>
      <p>Edit: OK, I hate to be one of those Linux-using, command-line loving people who throw the word “easy” around indiscriminantly.  After looking up the scripts I wrote to install fonts with otftotfm, I’d say the correct phrase is “easier than it used to be.”  And it’s writing of the .fd files for use with LaTeX that’s not automatic.  There appears to be a script called <a class="freelinking-external" href="http://www.ctan.org/tex-archive/fonts/utilities/otfinst/">otfinst</a> that automates even more of the process.</p>
      <p>Scott Thatcher</p>
