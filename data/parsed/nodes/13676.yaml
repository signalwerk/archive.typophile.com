    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Mergenthaler Linotype</strong></p>
    <p>See <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>.</p>
    <p>The Mergenthaler Linotype Co. was founded by <a href="/wiki/Ottmar%20Mergenthaler" class="freelinking" rel="nofollow">Ottmar Mergenthaler</a> in 1890, Brooklyn, NY. He moved the production of his <a href="/wiki/Linotype%20Machine" class="freelinking" rel="nofollow">Linotype Machine</a>—the "Blower"—there from its first factory in Baltimore.</p>
    <p>Over then next century, Linotype would manufacture a series of hot metal, photo, and digital typesetting machines. Their library of typefaces for these machines (and later for personal computers), would reach the thousands.</p>
    <p>The Mergenthaler Linotype Co. grew quickly, creating international subsidiaries and forging partnerships the world over. Linotype &amp; Machinery, Ltd. was founded in England, also in 1890. In 1896, The Mergenthaler Casting Machines company opened shop in Germany. <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a>, Hass, and many others began producing Linotype matrices for their clients. Eventually, they would become part of the Linotype organization itself.</p>
    <p>The American Mergenthaler Linotype Co. remained the mother company at the center of the global Linotype entity until the 1980s. Thereafter, its assets were purchased by German interests, who formed <a href="/wiki/Linotype%20AG" class="freelinking" rel="nofollow">Linotype AG</a> in 1987.</p>
    <p>Mergenthaler Linotype developed a slew of typefaces that are now part of the present-day <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>'s digital collection: <a href="/wiki/Ionic" class="freelinking" rel="nofollow">Ionic</a>, <a href="/wiki/Excelsior" class="freelinking" rel="nofollow">Excelsior</a>, <a href="/wiki/Bell%20Gothic" class="freelinking" rel="nofollow">Bell Gothic</a>, <a href="/wiki/Metro" class="freelinking" rel="nofollow">Metro</a>, <a href="/wiki/Electra" class="freelinking" rel="nofollow">Electra</a>, <a href="/wiki/Caledonia" class="freelinking" rel="nofollow">Caledonia</a>, and many more. Designers who have worked for Mergenthaler Linotype include <a href="/wiki/David%20Berlow" class="freelinking" rel="nofollow">David Berlow</a>, <a href="/wiki/Matthew%20Carter" class="freelinking" rel="nofollow">Matthew Carter</a>, <a href="/wiki/William%20Addison%20Dwiggins" class="freelinking" rel="nofollow">William Addison Dwiggins</a>, <a href="/wiki/Chauncey%20H.%20Griffith" class="freelinking" rel="nofollow">Chauncey H. Griffith</a>, and <a href="/wiki/Rudolf%20Ruzicka" class="freelinking" rel="nofollow">Rudolf Ruzicka</a>.</p>
