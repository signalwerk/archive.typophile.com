    <p><strong><a href="/web/20190805013831/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/web/20190805013831/http://www.typophile.com/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundries</a>&nbsp;: Mergenthaler&nbsp;Linotype</strong></p>
    <p>See <a href="/web/20190805013831/http://www.typophile.com/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>.</p>
    <p>The Mergenthaler Linotype Co. was founded by <a href="/web/20190805013831/http://www.typophile.com/node/12246" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Ottmar Mergenthaler</a> in 1890, Brooklyn, <span class="caps">NY</span>. He moved the production of his <a href="/web/20190805013831/http://www.typophile.com/node/12232" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype Machine</a>—the “Blower”—there from its first factory in&nbsp;Baltimore.</p>
    <p>Over then next century, Linotype would manufacture a series of hot metal, photo, and digital typesetting machines. Their library of typefaces for these machines (and later for personal computers), would reach the&nbsp;thousands.</p>
    <p>The Mergenthaler Linotype Co. grew quickly, creating international subsidiaries and forging partnerships the world over. Linotype <span class="amp">&amp;</span> Machinery, Ltd. was founded in England, also in 1890. In 1896, The Mergenthaler Casting Machines company opened shop in Germany. <a href="/web/20190805013831/http://www.typophile.com/node/12158" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">D. Stempel <span class="caps">AG</span></a>, Hass, and many others began producing Linotype matrices for their clients. Eventually, they would become part of the Linotype organization&nbsp;itself.</p>
    <p>The American Mergenthaler Linotype Co. remained the mother company at the center of the global Linotype entity until the 1980s. Thereafter, its assets were purchased by German interests, who formed <a href="/web/20190805013831/http://www.typophile.com/node/13493" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype <span class="caps">AG</span></a> in&nbsp;1987.</p>
    <p>Mergenthaler Linotype developed a slew of typefaces that are now part of the present-day <a href="/web/20190805013831/http://www.typophile.com/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>’s digital collection: <a href="/web/20190805013831/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Ionic" title="Create node &quot;Ionic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Ionic</a>, <a href="/web/20190805013831/http://www.typophile.com/node/13378" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Excelsior</a>, <a href="/web/20190805013831/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Bell%20Gothic" title="Create node &quot;Bell Gothic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Bell Gothic</a>, <a href="/web/20190805013831/http://www.typophile.com/node/13654" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Metro</a>, <a href="/web/20190805013831/http://www.typophile.com/node/13652" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Electra</a>, <a href="/web/20190805013831/http://www.typophile.com/node/13650" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Caledonia</a>, and many more. Designers who have worked for Mergenthaler Linotype include <a href="/web/20190805013831/http://www.typophile.com/node/13682" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">David Berlow</a>, <a href="/web/20190805013831/http://www.typophile.com/node/13520" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Matthew Carter</a>, <a href="/web/20190805013831/http://www.typophile.com/node/13538" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">William Addison Dwiggins</a>, <a href="/web/20190805013831/http://www.typophile.com/node/13377" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Chauncey H. Griffith</a>, and <a href="/web/20190805013831/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Rudolf%20Ruzicka" title="Create node &quot;Rudolf Ruzicka&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Rudolf Ruzicka</a>.</p>
