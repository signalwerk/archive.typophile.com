      <p>When you ask for someones opion, you can expect their opinion.<br>
      Sometimes some-ones personal opinion triggers some-one else his.<br>
      I wouldn't worry about this.</p>
      <p>Since you are working on a logo I would loose the shadows.<br>
      Remember that things have to be printed, placed on websites, cars, stationary ...<br>
      often<br>
      Shadows are a pain then. Beside that, they often don't add anything. It often brings an amateuristic feel with it. It is often a way of adding something interesting.</p>
      <p>What is your reason of putting it there?</p>
      <p>And, what is your reason to choose for yellow?</p>
      <p>I would try and look for an other font. Personaly I do like serpentine, but I hardly ever use it because it feels outdated. It has become a bit cheapy. Exception are outthere.</p>
      <p>This together with the logo in front of it, it is not a memorable logo. </p>
      <p>You say you have difficulty in sketching on paper. Often this does open new doors.<br>
      Research, look what is out there and not te be missed: what kind of company is it? Translate that into a logo and I think the one you have now doesn't suit anymore.</p>
      <p>Hope this helps.</p>
