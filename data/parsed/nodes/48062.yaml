      <p>:)) That's more like what I expected.</p>
      <p>To Bobby:<br>
      About the font: ok, I am a little bit short at fonts, and there is no way I purchase them for 150$ or more just for demonstration. So, I have to go with what I have. Sure, I like fonts like Futura, Helvetica, Frutiger, Garamond, and so on, but most of the times my clientel doesn't like them as they are too 'simple' (that's what customer say - I prefer 'timeless'). So they want something out of the row. Maybe you have some suggestions for fonts I could use or would be more appropiate.<br>
      About the shadow, yes, I know, but that's why there is a b/w version at the bottom.<br>
      Orange, I think is still a color which attract attention without alarming.<br>
      To Aziz:<br>
      About connecting the font. yes, I thought of this, but isn't it too much. And there is the problem with direct.com, that it doesn't make sense there to connect the fonts. But both logos should look as a unit.<br>
      If I let lead the arrows to the circle, it wouldn't have the same impression like the 'connect' version and so the unity goes.<br>
      to Ross:<br>
      The company is in the hotel-booking and travel business (and no, there shouldn't be any hotel or house icons in the logo). There will be an addition in the front, like 'Bali-connect.com' or 'Bali-direct.com' (just as an example). The icon will then finally move to the other side.<br>
      Thanks for all your comments.</p>
