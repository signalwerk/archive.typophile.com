      <p>Ok, first, I thought, after 24 hours, to get some 'constructive' critisism. Things like ' I really don't like Serpentine' don't help me - 'Mountain Dew'??? Sorry, doesn't say anything to me, maybe because I am on the other side. Why is Serpentine not right (I think it is a nice 'speedy' font) and which one would be more appropriate??<br>
      'They’re spaced too far apart from each other in all of these examples' - that is something to work with. I will change this, but closing in leaves me no choice than to lift the text and get it a little bit between the 'balls', which make it uneven somehow.<br>
      'The sentiment behind the concept is very dated and the solution looks obvious - by that i mean I have no confidence that you’ve put much thought into it' - yes, I did research, but it is difficult to come with something brandnew in this segment.<br>
      I did the basics in Freehand as it is for me very difficult to sketch on paper. The ideas are in my head. but I can them realise better with a program than with 'bare' hand. My Freehand docs looks like sketches, so... :)<br>
      Any other suggestions??</p>
      <p>Thanks.</p>
