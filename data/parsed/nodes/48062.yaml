      <p>Sounds like your client would be better off devising a single cohesive, marketable brand, rather than registering and trademarking several million nation-prefixed domains. That would make your task much easier, and they could then use subdomains to cater to every conceivable destination without diluting that brand.</p>
      <p>bali.nongenerictravelbusinessname.com<br>
      fiji.nongenerictravelbusinessname.com<br>
      china.nongenerictravelbusinessname.com<br>
      etc.</p>
      <p>Unless, that is, their SEO strategy is to build a massive link farm to attack Google with... :/</p>
      <p>Aside from that, I wouldn't really associate the words "direct" or "connect" with hotels. One makes me think of flights, the other of telecommunications. Also, how is it "direct" when the business is acting as a middleman between me and my destination hotel?</p>
      <p>I suppose none of this will help you with your design, but if the concept is flawed, I don't really see font and color choices mattering that much.</p>
