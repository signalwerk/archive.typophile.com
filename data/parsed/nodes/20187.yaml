    html: <p>If anyone can help us get some journalists interested in writing up the  real threat of losing these materials and resources - please pass them on. We now have a domain <a href="http://www.typemuseumsociety.org/" title="http://www.typemuseumsociety.org/">http://www.typemuseumsociety.org/</a> and a very modest site at the moment - just an anchor point. But if some of you haven't been inside the vault at the Type Museum recently you may like to follow the Typographic Treasure link.</p>
