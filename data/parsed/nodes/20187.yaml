    <p>Some of you may have already heard the sad news - the Type Museum in London is to close. This is what I received:</p>
    <p>The trustees of the Type Museum have taken the decision this week to<br>
    CLOSE and disperse the museum due to lack of funding.</p>
    <p>These unique collections   spanning the evolution of type design and<br>
    manufacture will be split up and the majority put into storage -<br>
    unlikely to see the light of day again.</p>
    <p>You are receiving this email because you have previously expressed<br>
    your interest in, and support for the Type Museum. We need your help<br>
    urgently if we are save the Type Museum as a working resource for the<br>
    future. Apologies if you have received any cross postings.</p>
    <p>A meeting is scheduled to launch a Type Museum Society campaign to<br>
    ensure a working future for the collections.<br>
    18:30 on Wednesday 24 May at the Type Museum, 100 Hackford Road SW9 0QU</p>
    <p>All welcome. We need every kind of active support if we are to succeed.</p>
    <p>If you are able to come along, or have any other time, ideas (or<br>
    money!) to offer please let us know at: </p>
    <p>Thank you in anticipation</p>
    <p>Tim Martin</p>
    <p>for the Type Museum Society<br>
    <a href="mailto:typemuseumsociety@gmail.com">typemuseumsociety@gmail.com</a></p>
