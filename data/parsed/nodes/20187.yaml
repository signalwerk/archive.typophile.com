      <p>I heard that this was sent out prematurely. </p>
      <p>According to Allan Haley, "The British Museum of Science owns much of the hardware in the Type Museum and there was meeting between the principals of both museums last night. So far, the results of that meeting have not been made known."</p>
      <p>I hope things are resolved in a way which in the very least allows for those interested to be able to have continued access for research.</p>
