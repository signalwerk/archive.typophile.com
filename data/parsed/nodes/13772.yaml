    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12128" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Blackletter</a>&nbsp;:&nbsp;Fraktur</strong></p>
    <p>In German, the word <em>Fraktur</em> seems to imply a sense of broken-ness. All Blackletter types in German are referred to as “Broken Types” (<em>gebrochene Schriften</em>). Frakturs are the most decorative of the main Blackletter categories, as well as the most used, and the most quintessentially German (see <a href="/node/12205" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">German nationalism</a>), even though they were also used in Scandinavia and the Netherlands, which are non-German speaking areas of&nbsp;Europe.</p>
    <p>The Fraktur style of type was invented around 1517 at the court of the Holy Roman Emperor <a href="/node/13829" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Maximilian I</a> in Nuremberg. Many artists and designers were involved in the process, including <a href="/node/13828" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Albrecht Duerer</a> and <a href="/node/13826" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Johann Neudoerffer the Elder</a>.</p>
    <p>Fraktur quickly overcame <a href="/node/13831" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Textura</a> and <a href="/node/14506" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Schwabacher</a> as the main style of type used within the empire. The style got a boost after Martin Luther’s first full-translation of the Bible into German appeared on the market—set in Fraktur. For a while, Fraktur was regarded as a “protestant” type. But it managed to be used by the southern Catholics,&nbsp;too.</p>
    <p>After the Napoleonic-era, Fraktur slowly began to loose ground against <a href="/node/13832" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Antiqua</a>, as the Germans called <a href="/node/14507" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Roman</a> type. It disappeared during the 1800s from the Netherlands, Sweden, and the Czech lands altogether. By 1900, almost all books sold in Germany that were translated from foreign languages, as well as most scientific books, were set in Antiqua. By 1930, only about half of all books sold were in Fraktur. After the Nazi ban on Blackletter type in 1941, the type slowly disappeared out the of public eye. The German Democratic Republic (East Germany) managed to print a few books a year in Fraktur, but in the West (and today’s Germany) Fraktur is usually only used in the following contexts: Typographic Games, History, Beer Labels, Gastronomy, Art Books, Heavy Metal, and Neo Nazi&nbsp;paraphernalia. </p>
    <p>Some of the most famous historical Fraktur typefaces have been digitized, and are available in digital&nbsp;form.</p>
    <p><em>For information on these available fonts, see</em><br><a href="/node/13834" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Unger Fraktur</a><br><a href="/node/12986" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fette Fraktur</a><br><a href="/node/13835" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fruehling</a></p>
