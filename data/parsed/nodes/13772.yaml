    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Blackletter" class="freelinking" rel="nofollow">Blackletter</a> : Fraktur</strong></p>
    <p>In German, the word <em>Fraktur</em> seems to imply a sense of broken-ness. All Blackletter types in German are referred to as "Broken Types" (<em>gebrochene Schriften</em>). Frakturs are the most decorative of the main Blackletter categories, as well as the most used, and the most quintessentially German (see <a href="/wiki/German%20Nationalism" class="freelinking" rel="nofollow">German Nationalism</a>), even though they were also used in Scandinavia and the Netherlands, which are non-German speaking areas of Europe.</p>
    <p>The Fraktur style of type was invented around 1517 at the court of the Holy Roman Emperor <a href="/wiki/Maximilian%20I" class="freelinking" rel="nofollow">Maximilian I</a> in Nuremberg. Many artists and designers were involved in the process, including <a href="/wiki/Albrecht%20Duerer" class="freelinking" rel="nofollow">Albrecht Duerer</a> and <a href="/wiki/Johann%20Neudoerffer%20the%20Elder" class="freelinking" rel="nofollow">Johann Neudoerffer the Elder</a>.</p>
    <p>Fraktur quickly overcame <a href="/wiki/Textura" class="freelinking" rel="nofollow">Textura</a> and <a href="/wiki/Schwabacher" class="freelinking" rel="nofollow">Schwabacher</a> as the main style of type used within the empire. The style got a boost after Martin Luther's first full-translation of the Bible into German appeared on the market—set in Fraktur. For a while, Fraktur was regarded as a "protestant" type. But it managed to be used by the southern Catholics, too.</p>
    <p>After the Napoleonic-era, Fraktur slowly began to loose ground against <a href="/wiki/Antiqua" class="freelinking" rel="nofollow">Antiqua</a>, as the Germans called <a href="/wiki/Roman" class="freelinking" rel="nofollow">Roman</a> type. It disappeared during the 1800s from the Netherlands, Sweden, and the Czech lands altogether. By 1900, almost all books sold in Germany that were translated from foreign languages, as well as most scientific books, were set in Antiqua. By 1930, only about half of all books sold were in Fraktur. After the Nazi ban on Blackletter type in 1941, the type slowly disappeared out the of public eye. The German Democratic Republic (East Germany) managed to print a few books a year in Fraktur, but in the West (and today's Germany) Fraktur is usually only used in the following contexts: Typographic Games, History, Beer Labels, Gastronomy, Art Books, Heavy Metal, and Neo Nazi paraphernalia. </p>
    <p>Some of the most famous historical Fraktur typefaces have been digitized, and are available in digital form.</p>
    <p><em>For information on these available fonts, see</em><br>
    <a href="/wiki/Unger%20Fraktur" class="freelinking" rel="nofollow">Unger Fraktur</a><br>
    <a href="/wiki/Fette%20Fraktur" class="freelinking" rel="nofollow">Fette Fraktur</a><br>
    <a href="/wiki/Fruehling" class="freelinking" rel="nofollow">Fruehling</a></p>
