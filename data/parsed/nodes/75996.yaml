      <p>I realize I didn't make myself clear, I'm sorry; I was referring to spacing, the space between those two letters. But I agree with you, 1996type: at text sizes these things will not only not be noticeable, but can, in fact, become helpful.</p>
      <p>And I do understand that the fact that the bolder italics could be seen as a mismatch is precisely why you would like them, Nick. I like them too, but I think they wouldn't work easily and seamlessly combined with the roman in running text. But these weights probably won't be used for long stretches of text, either, so this won't really happen that much, I guess.</p>
      <p>But like I said, I really like the whole thing a lot, and I'm putting it up there with all the inspirations I saw in it, all of which I love dearly. This immediately became one of my favourites. And that's precisely why I felt I needed to jump in and say something.<br>
      I thoroughly appreciate all the idiosyncrasies; many times they're precisely what turns nice fonts into greats.</p>
