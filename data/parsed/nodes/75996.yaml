  - id: 438873
    user: 20926
    date: 2010-11-09T09:58:00
    date_raw: 9 Nov 2010 — 9:58am
    votes: null
    html: |-
      <p>Thanks again for all the kind of words. That. Means. A. Lot.</p>
      <p>About the italics... I can say that much effort is put in getting the italic its colour equal with the roman (which actually isn't the usual case for italics supporting a roman). Wasn't easy, as the italic has a higher and more flexible contrast than its roman counterpart, but they do match and combine perfectly. I can add to this that also its width is somewhat a bit non-conservative. As italics usually are significantly more condensed than their roman counterparts — so it's not with Actium. Because of a personal preference and, again, for the purpose to let them fit better when used together, they're very close in sharing these proportions. So the italic doesn't jump out of text due to its narrowness or colour, but just by its very own form!</p>
      <p>Also, the italic was (obviously) designed to automatically avoid letters clashing into their neighbours by replacing these combinations with alternates or ligatures. For instance, there's an extra 'j' which has a much straighter descender; this alternate version of the 'j' will be used if it follows another character that has descending elements that cause problematic situations. The additional advantage of this approach (using alternates above ligatures) is that it would have less affect on text setting than ligatures if end users tighten the white space by tracking text. The ligatures in the end, like 'fi', of course have been double checked to see how they perform; shape-wise as well as fitting. </p>
      <p>I hope this takes away the worries some have with Actium's italic.</p>
      <p>More about the book @bert_vanderveen is referring to:<br>
      <a href="http://www.underconsideration.com/fpo/archives/2009/06/zonder-wrijving-geen-glans.php" rel="nofollow">http://www.underconsideration.com/fpo/archives/2009/06/zonder-wrijving-geen-glans.php</a> Thank you Bert for bringing it to our attention!</p>
      <p><cite>Yes, the boldest italics are over the top, but what use are such styles to "serious" typographers anyway?!</cite></p>
      <p>I do actually know a pretty serious typographer — and I'm sure some of you know him too — who found a good use for that <cite>'over the top'</cite> black italic weight. Recently: <a href="http://bit.ly/ccktKS" title="http://bit.ly/ccktKS">http://bit.ly/ccktKS</a> + <a href="http://bit.ly/9PKHBt" title="http://bit.ly/9PKHBt">http://bit.ly/9PKHBt</a></p>
      <p>:-)</p>
      <p>Gerben</p>
