    html: |-
      <p>Hey, come on, now… no need to use those quotes on the word “serious” all the time, Nick… I know I'd surely use them too, all the time, on lots of words, but that just becomes a bit disrespectful… yes, these are judgement calls, but they exist and we need to live with them, even when we're aware of their subjectivity.</p>
      <p>I just meant that I thought the roman bolder weights didn't pair up with the respective italics as well as what I was seeing in the lighter weights, which is, I believe, at least to some extent, true. I thought the roman has a certain air to it and the italic has another altogether different air, which could clash with the previous in some applications. But as I said, we probably wouldn't use them together all that much, anyhow. And in display applications, as ultrasparky mentioned, this will – of course – not only work, but be a welcomed addition to a typographic swiss-army knife. Yes, a designer can make or break the typeface he's using, but there's no denying that typefaces have a life of their own.</p>
      <p>Maybe I need to be more specific.<br>
      I don't know, I was getting a kind of “contemporary, cool-and-collected, clean and still humanistic and lively” vibe from the roman, and this is true also in the lighter italics; and then I was getting something like “comic book chic” from the bolder italics. [I'm not getting samples from Actium at MyFonts, right now… don't know why. This is from memory.]</p>
      <p>That's fine, I have no problem with that! But I was thinking the bolder italics had so much in them that they stood almost as a different typeface, and that would warrant them their own name; and in the same way, maybe this family deserved a (let's say) “muter” bolder italic. It's funny you should mention Gill Kayo!</p>
      <p>But, you know… splitting hairs. It's what we do. No harm intended.<br>
      Again, I must stress that I really like Actium a lot. I didn't mean to offend, quite on the contrary.</p>
      <p>And Gerben: I do appreciate the difficulties of making a typeface – well, somehow, at least – (I've tried and failed!), and I share with you this idea that maybe a matching italic should have similar proportions to the roman. I, too, feel kind of sorry when I see a wonderful roman paired up in running text with a too-compressed – even if wonderful on its own – italic. I completely commend your efforts in this regard. But I still thought that, at times, this didn't translate in the finest possible way with regards to the spacing of the italics (i.e., what I mentioned with the fi ligatures being too spaced out in the bolder weights and the “rv” spacing/kerning or lack thereof); and this type family merits perfection, I believe.</p>
      <p>But of course – and I really don't need to tell you this, but I will, nonetheless –, I am in no way an expert. I might be completely wrong and my opinion is worth only whatever you think it should.</p>
