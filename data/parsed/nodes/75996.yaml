    <p>Hey,</p>
    <p>I haven't seen this yet here on typophile, so I thought I'd post it. Resently Gerben Dollen's first typeface has been released, named Actium, under the new founded Type Mafia foundry. I think it's really a great typeface. Hope you agree. <a href="http://new.myfonts.com/fonts/dolwork/actium/" title="http://new.myfonts.com/fonts/dolwork/actium/">http://new.myfonts.com/fonts/dolwork/actium/</a></p>
