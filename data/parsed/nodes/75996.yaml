      <p>@Gerben: Thanks, but I did not mean I wished to check something. I was just curious to hear which resolution you judge good enough to print fulltext-intended typefaces on a laser printer. I know it also depends on the design, and on the toner level, but in general, if you have to produce prints, say, at 9-12 point size, which resolution would you think enough?<br>
      Since your design is also quite free in form, which would be the lowest point size you would dare on a laser printer with, say, 600ppi resolution?</p>
      <p>About the spacing: I did not think there were spacing issues with Actium, just that the MyFonts engine seems to scramble a little the spacing, but maybe it’s just because it’s optimized for text sizes, so seeing it big with some combination makes a strange impression. Also, is kerning always ON by default on the MyFonts site?</p>
