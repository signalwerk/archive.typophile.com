  html: |-
    <p>The typeface used for numbers is sans-serif and it has also been used for Serbia's national team soccer jerseys. </p>
    <p>The typeface used for writing NARODNA BANKA SRBIJE is an ellegant serif font but its serifs are very much reduced. It reminds a little bit of roman capital letters.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/serbia-yugoslavia-50-dinara-2005-pnew-wpmm_3802.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/5000_front_6678.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/200rsd-front_4410.jpg"></div><p></p>
    <p>Thank you all</p>
