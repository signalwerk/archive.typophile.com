    html: |-
      <p>Well, here's one way to think about it, from a potential user's perspective. If the glyphs are intended to interact, they should be in one font, so kerning is possible. If not, two fonts is easier.</p>
      <p>When, early on, Adobe put out "Adobe Garamond" with the titling glyphs in the font, &amp; you were suppose to turn them on with an OT feature, I took them out &amp; made a separate font. You would not want the two to interact, and accidents happen when setting type...</p>
