  html: <p>I'm working on a project in which I have almost two complete sets of A through Z in upper and lower case. I can probably come up with number alternates also. They are all viable glyphs. So, is it better to go with two fonts or one font with an alternate range - through the miracle of open type. Which is preferable to the type and font using community?</p>
