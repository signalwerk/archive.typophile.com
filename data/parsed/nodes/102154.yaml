    html: |-
      <p>@bbg: Not all software applications recognize opentype features - sign specific and some CAD software for instance. There are a lot of users who can't afford the huge cost of upgrades to opentype friendly software. Some people simply don't want the hassle of applying said features. </p>
      <p>The glyphs themselves have no opinion.</p>
