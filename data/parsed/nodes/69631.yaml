      <p>So the way it's written should reflect that. There is no single "display" to be associated with a "desktop font", except perhaps arguably where a 1:1 correspondence of pixels-to-units per em is reached. This will rarely if ever be reached in web use, so it's quite misleading to suggest that the two fonts will display identically. In addition, this assumes that unlike EOT and Cufon toolers, WOFF toolers will be constrained from scaling fonts during conversion. </p>
      <p>Perhaps..."once decoded by a user agent, the WOFF font will behave identically to the input font from which it was created" might be clearer?</p>
      <p>Cheers!</p>
