    html: <p>Regarding protection, it's certainly the case that WOFF does <em>not</em> provide any technical measures to protect font IP, i.e. no DRM-like features. What WOFF does for font developers is to draw a line between existing TTF/OTF fonts not licensed for use in web served typography and a new, compressed format that is licensed for use in web served typography. I see this as a kind of protection against casual or unconscious misuse of TTF/OTF fonts, which is what we were seeking in our objections to naked font linking. At the same time, a new format gives us the opportunity to build delivery systems that incorporate font copy serialisation, embedded EULA abstracts, permissions and recommendations, and other metadata. There's no obligation in the format on browsers to do anything with such metadata in terms of policing licensing, but it makes it easier for font developers and their clients to manage license use and protect their investment.</p>
