      <p>This is neither here nor there, but Opera announced that the most recent release supports WOFF. What's confusing me is that on Win7, XP, and on Mac, I cannot get it to work. I've built the WOFF using three different tools. And they all work fine on other user agents.</p>
      <p>I'm beginning to suspect it's a hoax - an in-joke, and that they're waiting to see who notices! (This part is pertinent to the discussion.) Because unless you're specifically testing for it, nobody would even notice that the WOFF file is not the file being displayed in the browser. In the font stack, it's almost always alongside a TTF of the same typeface. (In my tests, Opera skips the WOFF and takes the TTF or SVG. And it will not take the WOFF, even if it's the only font in the stack.)</p>
      <p>From the point of view of some implementers and authors, WOFF is seen as nothing more than a pain in the butt and an intrusion: things are complicated enough and EOT and TTF cover all the bases.</p>
      <p>I don't know what effect this will have over the long haul, but once web authors get used to something - in this case, serving TTF files, it's a very long time before practices change - if ever.</p>
      <p>Apple sure hasn't rushed to get on the bandwagon.</p>
