      <p>David, the W3C is *not* trying to change the OT specification. As Chris Lilley and I have both pointed out, changing the OT or OFF specs is outside the scope of the W3C webfonts working group.</p>
      <p>My point about it being within the scope of the people who make fonts is that the OT/OFF specs can be changed independently of the W3C webfonts standard. They can be changed to add new embedding bits; they can be changed to add an epar table. Or they can be left just as they are. The standardisation of WOFF provides a new point of reference that needs to be taken into account when considering such changes in future.</p>
      <p>What the webfonts working group is doing is formalising the WOFF spec -- a process that involves Erik and Tal and Jonathan K. --, and writing a conformance specification. In other words, making a formal standard out of this file format. Part of the function of the conformance specification is to state how WOFF implementations may, should or must relate to other standards, including OFF. It is within this context that I've argued that clarification needs to be made that the existing fsType embedding bits do not constitute permission to use a font on the web. I've argued this because of you, David: because you made a good case that EOT's repurposing of the embedding bits was a bad idea that muddied the distinction between document embedding and web serving. I agree with you.</p>
      <p>I threw out the idea of a new, WOFF creation bit after Vlad suggested that existing embedding bit 1 might relate to WOFF creation, and would hence provide a means for a font maker to signal that a given font should not be converted to WOFF. I only suggested that a new bit would be better because there would be issues with using the existing bit at the intersection of a web served font and document embedding, i.e. when someone prints a web page to a PDF. If there isn't any interest from font makers in having a technical mechanism to prevent creation of a WOFF file from a given font, that's fine. The WOFF conformance clarification can simply state that all the existing fsType embedding bits are irrelevant to WOFF.</p>
      <p>How's the epar table spec coming along?</p>
