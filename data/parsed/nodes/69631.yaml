      <p>Rich, with regard to embedding bits and WOFF, I think it would be precipitous for any browser maker to make a statement about this at this stage, because that is certain to be a question the working group looks at. As discussed on Typophile earlier, between Microsoft's original EOT spec, which linked embedding bits to web font linking permissions, and the present circumstances, those bits developed a much broader use in terms of PDF embedding, and as such don't represent any EULA I am aware of with regard to web font linking. The situation is such that for both CWT (EOT-Lite) and WOFF some of us have considered expressly disassociating web font linking from embedding permissions.</p>
      <p>See also:<br>
      <a href="http://lists.w3.org/Archives/Public/www-font/2009OctDec/0027.html" title="http://lists.w3.org/Archives/Public/www-font/2009OctDec/0027.html">http://lists.w3.org/Archives/Public/www-font/2009OctDec/0027.html</a><br>
      <a href="http://lists.w3.org/Archives/Public/www-font/2009OctDec/0032.html" title="http://lists.w3.org/Archives/Public/www-font/2009OctDec/0032.html">http://lists.w3.org/Archives/Public/www-font/2009OctDec/0032.html</a></p>
      <p>Removing ambiguity about the relevance of embedding bits to web font linking seems to me desirable for everyone involved, and the cleanest way to do that is to say that they are not relevant, at least for WOFF. They would, of course, become relevant again the moment someone took a WOFF font and embedded it in something. :)</p>
