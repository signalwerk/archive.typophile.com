    html: |-
      <p>@johnhudson</p>
      <p>Thanks for the news flash. This raises many questions in my mind about IE9, but I guess I'll have answers soon enough.</p>
      <p>@colinmford and all:<br>
      <em>Compressed, protected font files</em><br>
      Compressed, yes. Protected, no. Yes, it's a good thing to have a standardized, compressed wrapper for sfnt fonts. But don't look to them for protection, they won't give you any. If anything, the quick adoption of WOFF presents a dilemma. You got what you asked for, now what? Where's the product? What's the price?</p>
      <p>Outside of a few simple things that can be done to make fonts less usable to someone who's downloaded a font from a web site using @font-face - there is and always has been only two options: 1) avoid the web like the plague 2) take your chances like everybody else who sells resources for web sites.<br>
      If the browser can "see" it, I can take it, shake it, bake it, and, if I so choose - install it. WOFF, EOT, TTF, OTF - all the same. Easy.<br>
      But this does not necessarily mean you have lost a sale or that you won't make money from your efforts. And new, unimagined opportunities might emerge.<br>
      IMHO the type design community is in a far better position than most others to profit from the web.<br>
      And then again, maybe I'm wrong and your income will plummet. There are worse things in the world than having to change careers. You can move to New Orleans and help them rebuild. Or Detroit, maybe.<br>
      Two last things:<br>
      WOFF is certainly an ego stroke to the font design community so by all means take a victory lap and enjoy it. Being accomodated <em>should</em> feel good. And an unexpected show of support from the mother ship (MSFT) an added bonus.<br>
      Contrary to what you might think, there is a tremendous amount of good will towards font designers in the web design community. There really is. And in the long term, without common consent, you are screwed. It's a fragile thing, but my hope is that it remains intact.</p>
