      <p>After all, if the WOFF has meta data added to it, the WebFonts WG will either be; modifying those specifications by edict, or demanding that WOFF conversion tools do it.</p>
      <p>JH&gt;...they're within scope of people who make fonts.</p>
      <p>That's not very encouraging. Most people who make fonts for the web are not on the WG.</p>
      <p>Sii&gt;You're about two years too late</p>
      <p>Lol... You think! </p>
      <p>This I wrote in September of 2008 to a W3C member who queried "What Do You Want!?":</p>
      <p>I want a well-thought-out plan from where we are to where we need to be, executed in stages of advancement that make sense for the user community. As a repurposed piece of ignored technology made originally to compete with PDF, EOT is not a stage of advancement...</p>
      <p>I want LINKING bits in the Open Font Format, before web font linking goes any further. I can't believe people are just trying to repurpose embedding bits, which, from a licensing and end user licensing point of view, is a big deal, I think. [this evolved shortly after Sept 08 into EPAR]</p>
      <p>I want to be able to license url-to-site, pointing to fonts by their trademarked or custom names, with web linking permissions specially for the purpose. I want to be able to establish a cascade of licensing possibilities from a link of a single font to a single page on a single computer, to a blanket license for a series of web-proofed families for all-time use in all-web space. [this evolved shortly after Sept 08 into EPAR]</p>
      <p>I want the web designer to be able to query the user's device and OS environment as part of CSS, like Media Query, but including the rendering method. This, 'Chase Query' would provide detailed enough information so that letters, coming from fonts, linked by url, could get back to being things (optimized for a user's environment if possible and desired), and not pictures of things, (one digital outline font for all and any user's linking to said 'font'...</p>
      <p>I want browsers to concentrate on user agent-ing, (cookies, bookmarks, avatars, font preferences and passwords), and leave network agent-ing, (like font technology filtering) alone, and leave typography up to the user in a consistent way from browser-to-browser. We users, do not need browser wars over font linking/use, I think.</p>
      <p>...not all of this is W3C territory, I know.</p>
      <p>(End Quote) </p>
      <p>I've learned a lot more about the web since then, but not much has changed. </p>
      <p>And Simon, I recognized then that deprecation of OT and EOT support was not going to happen soon, which also supports the need for meta data in the OT font format, as OT is a web standard until everyone says otherwise, and must contain WOFF of EOT-containable permission data.</p>
      <p>But instead of fixing this before rushing OFF off to ISO for the web, MS clearly showed it wanted otherwise. So now, the W3C is trying to change the OT specification.</p>
      <p>I don't think it should be entirely unclear to everyone by now, that there is a problem with not enough change to the input and too much change to the output from 1994 to now.</p>
      <p>Cheers!</p>
