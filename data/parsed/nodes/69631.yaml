      <p>Personally I think the embedding permissions should be treated like the other metadata in the WOFF. Purely informational, optionally presented via a font information panel.</p>
      <p>"The presence (or absence) and content of the metadata block MUST NOT affect font loading or rendering behavior of user agents; it is intended to be purely informative. However, if user agents provide a means for users to view information about fonts (such as a "Font Information" panel) then they SHOULD treat the metadata block as the primary source, falling back on the font's name table entries when relevant extended metadata elements are not present."</p>
