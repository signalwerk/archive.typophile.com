    html: |-
      <p>Si: <em>...conform to the OpenType Spec's definition of document embedding.</em></p>
      <p>Does the OpenType spec have a definition of document embedding? I've looked and failed to find anything that looks to me like such a definition. The closest thing is the statement ‘Embeddable fonts may be stored in a document’, but this is very vague and not what I would consider a definition. There is no statement of what constitutes 'storing in' or of what constitutes a document for this purpose.</p>
      <p>Let's ask the question as plainly as possible: <strong>Does linking to a served font in a CSS file constitute embedding of a font in a document?</strong></p>
      <p>It is because I expect positive and negative responses to this question from different people that I think the issue needs to be clarified.</p>
    html_clean: |-
