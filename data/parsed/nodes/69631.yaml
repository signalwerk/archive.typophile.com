      <p>David: <em>...so it's quite misleading to suggest that the two fonts will display identically. In addition, this assumes that unlike EOT and Cufon toolers, WOFF toolers will be constrained from scaling fonts during conversion.</em></p>
      <p>A WOFF file is a container for a font, so in terms of WOFF we're talking about identical display between the font that goes into the container and the font that comes out of the container. If a tool is performing some scaling or other conversion on a font <em>before</em> putting that font into the container, then that's independent of the WOFF standard, which only cares about the container and what is in it, not what happened to the contents before they were put into the container.</p>
      <p>I agree that using the term 'input font' would be make this clearer and avoid confusion over the possible relationship of a modified input font to some upstream 'original desktop font'.</p>
