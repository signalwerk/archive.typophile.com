    <p>In the latest development of web served typography, the World Wide Web Consortium today accepted and published the Web Open Font Format specification. This is an important step in the standardisation of this format, as set out in the charter of the recently establish W3C web font working group.</p>
    <p>The most notable and exciting thing about this is that WOFF was jointly submitted to the W3C by the Mozilla Foundation (whose Jonathan Kew developed the format along with Erik van Blokland and Tal Lemming), Opera Software ASA, <em><strong>and Microsoft Corporation.</strong></em> And it isn't often that I use bold italics.</p>
    <p>Links:<br>
    1. <a href="http://www.w3.org/Submission/2010/03/" rel="nofollow">The submission documentation.</a><br>
    2. <a href="http://www.w3.org/Submission/2010/03/Comment/" rel="nofollow">W3C staff comment on acceptance of submission.</a><br>
    3. <a href="http://www.w3.org/Submission/WOFF/" rel="nofollow">The WOFF 1.0 File Format specification</a></p>
