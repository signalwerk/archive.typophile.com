    html: |-
      <p>David: <em>I thought WOFF was designed and accepted, and now the WG are supposed to slay the rest of the litter.</em></p>
      <p>Slaying the rest of the litter is what happened <em>before</em> the working groups was established.</p>
      <p>If you're confused about what the working group is doing, <a href="http://www.w3.org/2009/08/WebFonts/charter.html" rel="nofollow">read the charter</a>. It includes delivery of a conformance specification for dead cats.</p>
      <p><em>Embedding information, as hacked into the standard, is not relevant to web use.</em></p>
      <p>This is exactly what the WG is seeking to formally clarify, since David Berlow and John Hudson saying it repeatedly does not a standard make. There seems general agreement about two things:</p>
      <p>1. All but fsType bit 1 (restricted license embedding) are not relevant to WOFF and this should be clearly stated;</p>
      <p>2. User agents, e.g. browsers, will ignore all fsType embedding bits including bit 1.</p>
      <p>What isn't agreed yet is whether that bit 1 — regarding which the OT spec says</p>
      <p><em>Fonts that have <strong>only</strong> this bit set <strong>must not be modified, embedded or exchanged in any manner</strong> without first obtaining permission of the legal owner.</em></p>
      <p>— should be interpreted as meaning that WOFF <em>creation tools</em> must not convert such fonts to WOFF format.</p>
      <p>I suspect the outcome will be that this bit too will be deemed irrelevant to WOFF, but the language of the OT spec -- ‘modified, embedded or exchanged in any manner’ -- is such that its worth looking at carefully.<br>
      ___</p>
      <p>Another possibility is that a new fsType table version could be defined in the OT spec with a specific 'Don't convert to WOFF' bit added. I like this idea, because it has no impact on existing fonts, but would provide a means to restrict new desktop fonts from being converted to WOFF by end users, if that were a font maker's desire.</p>
