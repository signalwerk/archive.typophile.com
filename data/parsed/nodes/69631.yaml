    html: |-
      <p>David: <em>Anything that helps disambiguate embedding bits from web font linking is welcome, but not at any price.</em></p>
      <p>I agree, on the general principle that nothing should be done ‘at any price’, but I'd like to know what you would consider acceptable/unacceptable means of disambiguating embedding bits from web font linking.</p>
      <p>As I see it, formally disambiguating them in the text of the WOFF standard makes sense, and this rightly puts the focus for permissions on the WOFF metadata and on whatever other license data the font maker puts in the font, e.g. in an epar table.</p>
      <p>Would it also be nice to see this disambiquated in the OT/OFF spec and in the EOT spec? Yes, I think so, but that would be a different battle on a different battlefield. The new W3C working group has a specific remit, and I'm interested in figuring out what might be done and what should be done within that context. So the question for today is what, if anything, the WOFF standard should have to say about embedding bits?</p>
