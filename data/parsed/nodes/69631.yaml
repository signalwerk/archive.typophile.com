      <p>&gt;The wrapper or the font contained within?</p>
      <p>Assuming a correct font format UAs do and will do nothing based on either the WOFF wrapper or the wrapped content. That's why I'm confused at this WG's discussion of what this next accepted format is supposed to do/contain other than what the OT format can contain. I thought WOFF was designed and accepted, and now the WG are supposed to slay the rest of the litter. If not, I think little will have been gained.</p>
      <p>&gt;Sequence:</p>
      <p>&gt;Pack up the font in a WOFF, font has, within it, the embedding bits.<br>
      The current OT font format is converted to WOFF. Within it, there is no explicit and standard information about font linking. Embedding information, as hacked into the standard, is not relevant to web use. </p>
      <p>&gt;Send WOFF to browser.<br>
      The browser calls and the server sends and existing WOFF or creates one on the fly.<br>
      This WOFF is downloaded to the CPU of the user</p>
      <p>&gt;Browser unpacks WOFF,<br>
      Browser uses the CPU of the user to convert the WOFF to OT and 'enumerate' it to the OS.</p>
      <p>&gt;looks at font, sees bits, does what it does whatever that may be.<br>
      Not as far as I know. There are no seeing-bit browsers, only format-seeing ones.</p>
      <p>Cheers!</p>
