      <p>David: <em>Then, if we’re lucky, we’ll see how serious is the intent to define and protect font IP, not by mechanism or garden fence format, but by a table of stated, legally unambiguous permissions.</em></p>
      <p>That's the thought that crossed my mind as I typed out the suggestion re. WOFF-specific fsType bit. But a table of 'legally unambiguous permissions' is by definition an abstract of the EULA, and is itself dependent on the EULA to give it any legal weight. Since browser makers are already adamant that the EULA constitutes the source of permissions or prohibitions and that they will not be responsible for any policing of these through technical methods, I'm left with my old question: What is such a table supposed to do that the EULA doesn't already do? How does it work?</p>
      <p>fsType embedding bits, on the other hand, are a conventionally established technical mechanism for restricting certain kinds of use of fonts. If one is interested in a <em>technical mechanism</em> for preventing use of fonts as WOFF files, they're the obvious place to look first.</p>
      <p><em>Or do people think the WOFF conversion tools are the right place to add permissions?</em></p>
      <p>A very valid question: one that I'd like to see answered. The makers of WEFT apparently thought that an EOT conversion tool was the right place to add permissions. Someone thought they would be interested in a technical mechanism (using existing embedding bits) to prevent a font from being converted to an EOT file, so I'm inquring whether a parallel in WOFF creation would make sense. I'm not wedded to the idea, but I'd like to know whether font makers are interested in a technical mechanism to prevent a font from being converted to a WOFF file?</p>
