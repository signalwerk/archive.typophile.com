    html: |-
      <p>Si, the question is not whether the embedding bits should be treated informationally (if relevant at all, then that is surely how they will be treated), but what information those bits present -- if any -- relating to font linking. The issue for font makers is that, thanks to Acrobat, most fonts made over the past decade have embedding permissions set to permit embedding (most often print/preview, sometimes editable, only occasionally installable), but that these settings do not relate in any way to licensing for web font linking. Hence, it becomes important to clarify the relationship of the embedding bits to font linking to avoid confusion over their meaning.</p>
      <p>In EOT, the embedding bits were explicitly associated with web font linking, in terms of embedding fonts within an EOT, both in the spec and as implemented in the WEFT tool. That is one approach to clarification, but obviously one that some font makers find problematic for the reasons stated: a font might have the embedding bits set appropriately for Acrobat embedding, but should not be embedded in an EOT. Simply stated, the embedding bits provide insufficient information, and so are ambiguous in their meaning related to different embedding/linking technologies. Hence the need for other metadata, but rather than having multiple permissions information in different locations, with the attendant risk of conflicting or ambiguous information, it seems to me a good idea to remove this particular set of permissions (that do not directly and solely relate to web font linking) from the equation for web fonts.</p>
