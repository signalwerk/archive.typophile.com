      <p>David: <em>Beginning next week, we'll all be able to write font stacks with but 2 formats, ttf and eot</em></p>
      <p>And -- IE backwards compatibility aside -- in the not too distant future you will be able to write font stacks with only one format, WOFF, which is the only format on which the TTF and EOT browser camps were able to agree and, hence, the only available basis for interoperability. That WOFF also provides in-format compression, is the preferred licensing format for most of your colleagues, and in no way interferes with EPAR or any other custom font table (indeed, EPAR content could also be included in the WOFF private metadata), is either icing or cake depending on one's priorities. Either way, it's the right thing to do and a tasty way to do it.</p>
