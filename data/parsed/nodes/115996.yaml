  html: |-
    <p>I need an exact match for this sans serif. ITC Officina Sans is very close. There are significant differences. The G is a different shape. The S in the sample has a slightly tapered stroke. The verticals on the A seem to curve ever so slightly, though this one could be due to a tracing...</p>
    <p>Any help is greatly appreciated by my client and myself.</p>
    <p>Thanks</p><div class="imageWrap"><img src="http://typophile.com/files/photo-01_6004.JPG"></div><p></p>
