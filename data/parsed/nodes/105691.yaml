    <p>I'm searching for something in between a script and an italic typeface. With character, but still very legible.<br>
    I've always loved Bodoni Poster Italic, but it is of course quite heavy in many occasions. </p>
    <p>I would like a monoline font, preferably in various weights.  Any ideas?</p>
    <p>best regards<br>
    Mads</p>
