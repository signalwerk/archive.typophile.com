    date_raw: 10 Jan 2003 — 10:09am
    date: 2003-01-10T10:09:00
    votes: null
    html: <p>I really like it - personally. I think it works great for headline - and obviously as body copy too. I think it is quite sexy - love those little lilting upswings (very technical terms there) on the tops of the lowercase letters. I kinda wish a bit o' that was incorporated into the caps - but then I don't know if it would be too much. It might be well balanced already. <br> <br>Overall - fantastic - I'd totally use it. It's not abnoxious at all. <br> <br>I won't comment on kerning or any other technicalities - just from visual appeal.</p>
  - id: 31030
    user_id: 540
    user_name: Isaac
    user_path: null
    date_raw: 10 Jan 2003 — 11:00am
    date: 2003-01-10T11:00:00
    votes: null
    html: <p>it's got a great stencil feel to it, without being too informal/stencily. <br>i don't think the caps need the flourishes at all. it would be too distracting. <br>on the other hand, if there were alternates for drop caps, etc., that's a <br>different story.i dig the stroke intersections w/the soft brackets, if they <br>can be called that. pretty cool stuff. <br> <br>am i the only one who sees the W as... well, think fifties pin-up poster.</p>
  - id: 31031
    user_id: 1070
    user_name: fatchair
    user_path: null
    date_raw: 15 Jan 2003 — 1:14am
    date: 2003-01-15T01:14:00
    votes: null
    html: <p>Thanks for your comments - I presume you're referring to the top of the 'a', '2', '3' etc when you say 'upswing'? I did start with that applied elsewhere but thought it affected the legibilty of the face too much - I really wanted to design the typeface as a very 'usable' one (if it's at all possible!) <br> <br>I'm happy with the soft brackets but unfortunately when I've tried making the heavier weights this has been a problem as they look terrible with the wider brackets and really need thinner intersections. I think I may have to drop the heavier weights and maybe stick to to just two weights. Any ideas how to get around this problem?</p>
  - id: 31032
    user_id: 1070
    user_name: fatchair
    user_path: null
    date_raw: 13 Mar 2004 — 3:34pm
    date: 2004-03-13T15:34:00
    votes: null
    html: <p>Just to let you know that that this typeface is finished and now available over at myfonts. I've changed the name to 'Venkmann' - Vasarely just didn't seem appropriate. <br> <br>I stuck with the 2 weights (and italics) although I may do the others if I feel like it (and there's a demand). <br> <br>...and I can't believe I first posted it here over a year ago!</p>
