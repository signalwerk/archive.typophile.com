  html: "<p>Hi <br> <br>This is the first typeface I've designed since I found this forum so I thought I'd get your opinions before I release it. <br> <br>I haven't sorted out kerning yet and it needs a little more work but the bare bones are there. I plan to have 4 weights and matching italics/obliques. <br> <br>Alan Rimmer <br>www.fatchair.com <br> <br><!---Attachment: vasarelylight.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">VasarelyLight.swf<br><a href=\"http://www.typophile.com/forums/messages/29/vasarelylight.swf\"><b>vasarelylight.swf</b></a> (11 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
