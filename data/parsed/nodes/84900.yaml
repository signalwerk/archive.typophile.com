  html: |-
    <p>I am new to the font making business. I made one font and uploaded it to dafont.com. I got this email today:</p>
    <p>" FOX Sports would be interested in using your font in broadcast television and perhaps print media (advertisements only).  What are your licensing terms?</p>
    <p>This is legit. I have NO IDEA what to charge! It's going to be used on TV. What should I do? Please help!</p>
