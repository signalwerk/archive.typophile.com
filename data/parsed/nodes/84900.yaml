    html: |-
      <p>Spend a couple of days doing online research.<br>
      Look at a number of different foundries that explain font licensing and get to know the categories of licence, and try and figure out why different uses are charged differently.<br>
      You won't get much information about pricing, however.</p>
      <p>You should rename your font, Chalkboard is already taken.</p>
