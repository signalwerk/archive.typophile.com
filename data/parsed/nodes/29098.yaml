  - id: 165007
    user: 7869
    date: 2006-10-27T01:32:00
    date_raw: 27 Oct 2006 — 1:32am
    votes: null
    html: "<p>Having worked briefly, ever so briefly, in a firm that designed only Hollywood movie posters... I can say, yes, these people do not stray from Trajan. It was annoying as hell. Setting beautiful type never cut it. It looked boring to them. They wanted filters, bevels, drop shadows, and textures. It had to 'pop'. The most common reason for using Trajan: This movie needs to feel like Oscar material.</p>"
