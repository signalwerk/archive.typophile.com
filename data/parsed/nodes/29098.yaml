      <p>Going back to that Requiem title, how many people are going to look at it and think,"is there something wierd about this? I can't put my finger on it." I think that the Trajan capitals have been ingrained into Western civilization to the point that even non-typophiles can sense when something is wrong about the E's. </p>
      <p>I mean, what ancient Roman tool could chisel perfectly rounded ends? They look like amputated nubs.</p>
