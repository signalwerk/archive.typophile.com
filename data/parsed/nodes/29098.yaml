      <p>What the designer did to that E is just tragic.</p>
      <p>I think that it's because movie posters (and other promotional materials) have gone from being beautifully illustrated designs to quicky Photochops. If you want to make a Photochop look elegant, tossing Trajan on top is a logical (note I said logical, not good) way to go and doesn't require any real effort. </p>
      <p>It might also be because Spielberg keeps using Trajan, and a lot of people in Hollywood will try anything to be cool like Spielberg, and since they can't make a movie like him...</p>
