    <p>With the overuse of <a href="http://www.veer.com/products/typedetail.aspx?image=ADT0001724" title="See Trajan Pro on Veer.com" rel="nofollow">Trajan</a> in movie titles, I found this use especially ironic given the name of the movie: <em><a href="http://www.requiemthemovie.com/" title="View the movie site" rel="nofollow">Requiem</a></em>. I guess they tried to set the title apart by customizing the R and the E, although I think they butchered the latter.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/header_6081.jpg"></div><p></p>
