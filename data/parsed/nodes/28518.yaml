    html: |-
      <p>Yeah, the translation of that quote is a little odd. I don't take it to necessarily mean that AF is okay with Myriad. It would be nice to know what he intended to say there.</p>
      <p>I think Myriad owes much of its identity to its multiple master origin; its design reflects the requirements and capabilities of that technology. I also think that the merits of its design have been proven by how frequently it is seen lately (despite MM going away). Apple and Wells Fargo are two significant examples, but I see it used everywhere these days -- much more than I did ten years ago. The fact that it is used for so many prominent applications confirms to me that it has made its own place in the typographic milieu. (Reinforcing that thought: I often see the italic used by itself, too.)</p>
      <p>Robert has told me many times that the collaboration with Carol was a crucial aspect to its design. Robert's own designs usually bear his personal fingerprint, and the back-and-forth with Carol for Myriad helped keep the design tempered and utilitarian, which was obviously the point from the beginning.</p>
