    <p>What do you make of Frutiger's statement below?</p>
    <p><cite><strong>Who do you respect of contemporary type designers? Is there a next “Frutiger”?</strong></cite></p>
    <p><cite>"of the younger generation there is Roger Slimbach of the US, except the unnecessary doubt concerning <a href="/node/28658" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Myriad</a>, his work is also very good."</cite></p>
