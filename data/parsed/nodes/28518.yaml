      <p>Of course Myriad was influenced by Frutiger, but so have been a hundred others. Frutiger evidently recognizes that Myriad has enough of a different look to be part of the normal process of designers--in all fields--being strongly influenced by others, both past and present, but taking their ideas and making something significantly different. </p>
      <p>For what it's worth, I don't think that any of the faces strongly influenced by Frutiger, the typeface, are as good as the original, including Myriad.  </p>
      <p>Myriad's condensed version is somewhat of a different animal. I believe I remember reading on Typophile that it was done before there was the condensed version of Frutiger--which appears in Frutiger Next. And I remember reading that Slimbach drew the condensed and Twombly the regular, and then they revised each other's work. To me the lighter terminals on Myriad mean that the condensed version actually works better than the regular. </p>
      <p>Just checking on screen the Frutiger Next Condensed and Myriad Condensed, I actually like the Myriad Condensed better.</p>
