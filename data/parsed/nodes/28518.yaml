    <p>Has anyone seen the interview of <a href="/node/12118" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adrian Frutiger</a> recently posted on the <a href="/node/12083" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TYPO</a> webpage?</p>
