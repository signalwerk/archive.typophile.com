  html: |-
    <p>Introduction to type design in FontLab Studio v.5 taught by Hannes Famira. Participants will learn FontLab Studio v.5 by drawing and producing their own functioning digital type faces. Topics include tracing artwork, perfecting curves and building diacritics, as well as the secrets of spacing, kerning, and hinting. Participants should have basic typographic knowledge and some experience in a vector-based drawing application such as Adobe Illustrator or Macromedia Freehand.</p>
    <p>9 Tuesday evenings, May 30-Aug. 1, 6:30-9:30.  $625 plus $25 registration fee.</p>
    <p>Hannes Famira studied graphic and typographic design at the Royal Academy of Fine Arts in The Hague, Netherlands. After apprenticeships at Studio Dunbar and the Font Bureau, he worked at Meta Design and at the Buro Petr van Blokland. Hannes established his studio, Das Kombinat, at the SfG, School for Design in Basel, Switzerland. He now lives in Brooklyn.</p>
    <p>For information and registration, call 212-353-4195.&lt;/<!--
