    html: <p>In InDesign CS5, for spell-check the dictionary only seems to know modern Greek with monotonic marking. However, it does parse the base characters correctly and produces hyphenation that seems sensible, so unless there's some difference in hyphenation behavior for modern Greek vs. classical Greek, it should work. Syllable structure works the same in both languages, so I don't anticipate any important difference in hyphenation.</p>
