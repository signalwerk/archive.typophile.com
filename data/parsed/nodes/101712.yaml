  html: |-
    <p>We have to set a textbook -- called "midlevel" by the publisher -- for classical Greek.</p>
    <p>It occurred to me if we use a character style for the Greek, one option under the advanced features is a language setting -- which I would suppose has some affect on hyphenation.</p>
    <p>But classical Greek is perforce polytonic Greek, and I don't know if the InDesign Greek hyphenation dictionary is set up to include that. If so, it would at least cut down on the handwork...</p>
    <p>Anyone know?</p>
    <p>Thanks,</p>
    <p>Charles</p>
