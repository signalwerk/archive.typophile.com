    date_raw: 26 Mar 2013 — 12:16am
    votes: null
    html: <p>I should add that the problem you will have is that the classical Greek vocabulary and word endings differ enough from modern Greek that a very large number of words will not be recognized by the dictionary; however, it seems to be able to make algorithmic hyphenation decisions on those anyway.</p>
