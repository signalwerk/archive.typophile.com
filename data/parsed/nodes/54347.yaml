    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bolda_4682.gif"></div><p></p>
    <p>Bolda is a lowercase display font, containing the letters a-z in two styles, regular and outline. Lowercase is regular and uppercase is outline. Designed by Morten Iveland (The Infamous Foundry)</p>
    <p>Available for purchase at <a href="http://infamousfoundry.net" rel="nofollow">The Infamous Foundry</a></p>
