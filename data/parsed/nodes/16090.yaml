    <p>We mostly have much more fonts than we normally need, I’m no exception. Thus I was organizing my font files by splitting then apart in categories so I could enable just the kind of font I would like to work with.</p>
    <p>After a while I became confused. </p>
    <p>I really don’t know how to divide then. I don’t know whether to usa the habitual font categorizations or create my own system based on their usage rather then on their “academic” category. </p>
    <p>Particularly I would like to split then in some kind of formal categorization but, since I’m not an expert, sometimes it get’s tricky to tell a Slab Serif font from an Transitional, for example. </p>
    <p>So, I really would like to hear from you guys how do you deal with font files organization.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/9158" class="topic-previous" title="Go to previous forum topic">‹ John Hudson</a> <a href="/node/16071" class="topic-next" title="Go to next forum topic">Six degrees of separation - Le Monde redesign ›</a></div>
