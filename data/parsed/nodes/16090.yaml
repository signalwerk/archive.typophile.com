      <p>If you use Linotype’s new (and free) Font Explorer X (Mac only so far), you can make as many categories as you like, and the same font can be in more than one category. Other font management tools have this capability as well.</p>
      <p>There is an old type specimen catalog that was put out by Phil’s Photo (now known as Phil’s Fonts) around 1980. It had what I thought was a very helpful way of categorizing its fonts. Here are the categories:</p>
      <p>Evenly weighted sans serifs<br>
      Thick and thin sans serifs<br>
      Bracketed serifs<br>
      Ruled serifs [e.g., Bodoni]<br>
      Spur serifs<br>
      Soft serifs<br>
      Square serifs<br>
      Extra light<br>
      Ultra bold<br>
      Condensed<br>
      Italics<br>
      Scripts<br>
      Inline/Outline/Contour/Shaded<br>
      Ornate<br>
      Rustic</p>
      <p>The actual categories they used are not important. The thing is to come up with categories that are meaningful to you and to allow the same font to be listed in more than one category. If you limit each font to only one category, you will never come up with a usable system. This limited idea probably goes back to font catalogs or reference books in which each font could only be listed once to save space or money, so they had to decide which one of possibly several categories a font could fall under.</p>
