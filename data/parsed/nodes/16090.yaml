    html: |-
      <p>If you know what you have, go with kris’ idea.</p>
      <p>Group your fonts by foundry and/or designer. Take Martin Majoor. In my Martin Majoor folder I’d have the Scala collection, Nexus collection, Seria, and so forth. When I think of Martin Majoor, I think of clean, amazingly legible, humanist slab-serifs with perfectly suited, accompanying sans faces. </p>
      <p>These days we are blessed with plenty of serif faces with an accompanying sans. They are designed to work together, so you might as well keep them together under the designer’s name.</p>
