    <p><a href="/web/20081007194323/http://www.typophile.com/wiki/Eduardo%252BManso" class="wiki">Eduardo Manso</a> can’t seem to make one flop yet. </p>
    <p>Bohemia (under the name Argot) won a TDC in 2003.<br>
    Relato Sans and another in TDC award 2006.<br>
    And now Lorena Serif yet another TDC award winner 2007!!!</p>
    <p>Here he has done it again with well a executed text system intended for newspapers. I particularly enjoy the efficient use of space and the sturdy lachrymal terminals. (’Georgia’ for print???)</p>
    <p>MyFonts’s Jan Middendorp interviewed the ’MAN’ for the their February newsletter. Very well done. Check it out:</p>
    <p><a href="https://web.archive.org/web/20081007194323/http://www.myfonts.com/newsletters/rs/200702.html#typedesigner" title="http://www.myfonts.com/newsletters/rs/200702.html#typedesigner">http://www.myfonts.com/newsletters/rs/200702.html#typedesigner</a></p>
    <p>Enjoy,<br>
    Mike Diaz</p>
    <p>PS 1... I wonder who the other TDC winners are. Any inside info???</p>
    <p>PS 2... Is it just me? because the TDC website is ironically one of the ugliest websites ever! They gray on gray color scheme is dated, poor/low res sample showings, pain in the you-know-what navigation, and generally speaking the entire site does not really befit an organization who’s aim is to highlight the best in typography.</p>
