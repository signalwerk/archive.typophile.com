    html: <p>I visited the web sites and looked for more key letters, but it seems not to be one of the Sans Serif fonts I have in my <a href="http://bowfinprintworks.com/SansIDPage.html" target="_blank">Guide</a>. It resembles <a href="http://www.myfonts.com/fonts/t26/flux/" target="_blank">T-26 Flux</a> and also their <a href="http://www.myfonts.com/fonts/t26/leger/" target="_blank">Leger</a>, but neither is exactly right. It also resembles DIN, but the stemless bowl on Telenor's 'b' does not match. <br> <br>It seems to be a Sans I have not catalogued, so I'm curious about it too.</p>
