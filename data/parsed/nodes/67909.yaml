    <p>Some time ago I found myself reading an article, not sure if it was a downloaded PDF or online, and it made a statement something to the effect "…we are no longer climbing corporate ladders, breaking glass ceilings…"</p>
    <p>I think I ended up there following a discussion thread here, but without a working search engine I cannot find it.</p>
    <p>I spent an hour or so with Google and came across this article…</p>
    <p><a href="http://peoplethings.com/andblog/is-graphic-design-dead/" title="http://peoplethings.com/andblog/is-graphic-design-dead/">http://peoplethings.com/andblog/is-graphic-design-dead/</a></p>
    <p>…which I believe I came across on my way to the afore mentioned article.</p>
    <p>Can anyone direct me to this mystery article?</p>
    <p>Thanks in advance.</p>
