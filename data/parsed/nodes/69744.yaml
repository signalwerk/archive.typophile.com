      <p>Dez, I can sort of "read" the characters but don't have a single idea of wot it means :-) (Same with Greek, actually.)</p>
      <p>Somehow"Knyga" = "book" stuck into memory (in several languages: Greek: "biblio", but more correct should be "vivlio"; in Arabic, "kitab"). Simple extrapolation led me to believe it's a "Book of Letters from A to Z".</p>
      <p>But I like the rhythm of written Cyrillic, in the way I like French rap songs. A bit like admiring a poem written in finest Japanese calligraphy -- no clue what everyone is so excited about but it sure looks good.</p>
