      <p><cite>Malevich, Rodchenko, El Lissitsky, and Popova.</cite></p>
      <p>Malevich was not a typographer and the rest are hardly representative of Russian typography. For all the coverage historians give it, constructivism was really a short lived blip in the history of Russian art and design (to some extent because the state banned it entirely), but as with most of design, there’s much more to appreciate once you get out of the boring little box of modernism.</p>
    html_clean: |-
      <p><cite>Malevich, Rodchenko, El Lissitsky, and Popova.</cite></p>
