      <p>Dear Chris, my messages to you keep bouncing, so I am answering your query here.
      </p><ul>
      <li><em>Is it possible to buy a copy of your book?:<br>
      </em>The Art of Type. Selected works of Moscow book artists in 1959-1974<em>. By our own Maxim Zhukov. 1959-1974,) 1977) 1977</em></li>
      </ul>
      <p></p><p>Hmm, it looks like there is a number of mistakes in the above bibliographical reference.
      </p><ol>
      <li>The real name of the book is <em>The Lettering Art: Works by Moscow Book Designers, 1959–1974</em>. Moscow: Kniga, 1977;</li>
      <li>This is not my book: only its design and layout are mine; the name of the editor is Evgenia Butorina; the foreword was written by Yuri Gherchuk;</li>
      <li>The main text of the book is in Russian; however, the designers’ bios, the captions, the summary, and the detailed list of plates is in 4 languages (Russian, English, French and German);</li>
      <li> For easier search and reference, the Russian title is <em>Искусство шрифта: Работы московских художников книги, 1959–1974</em>. Москва: «Книга», 1977.</li>
      </ol>
      <p></p><p>There are still copies available, that’s for sure. The first offer I have found is <a href="http://bit.ly/cAhfqP" rel="nofollow">Oak Knoll</a>’s; however, it is pretty expensive. I hope you can get it for less <a href="http://bit.ly/aabhKO" rel="nofollow">somewhere</a> <a href="http://bit.ly/bFzOUa" rel="nofollow">else</a>. See, <a href="http://www.callig.ru/node/67" rel="nofollow">they</a> sell it for 5,000 RUB (171.70 USD)… And <a href="http://bit.ly/97ylZr" rel="nofollow">here</a> (scroll down) the selling prices vary from 2,500 RUB (85.85 USD) to 6,000 RUB  (205.49 USD). Even cheaper deals may exist… However, I have no idea what the delivery to the US might cost.</p>
    html_clean: |-
