    html: |-
      <p>A few books I can recommend:</p>
      <p>Note: this is my own attempt at translating names and titles, they might be classed under different guises in catalogs and such.</p>
      <p>Russian Graphic Design in 1880-1917, Elena Chernevich and Mikhail Anikst (Русский Графический Дизайн 1880-1917, Елена Черневич и Михаил Аникст) 1990 (Russian edition in 1997)<br>
      I couldn't find a good review page that didn't also include a download link, so I am not posting any.</p>
      <p>Modern Typface, Villu Toots (Современный шрифт, Виллу Тоотс) 1966<br>
      <a href="http://www.callig.ru/node/27/" title="http://www.callig.ru/node/27/">http://www.callig.ru/node/27/</a></p>
      <p>The Art of Type. Selected works of Moscow book artists in 1959-1974. By our own Maxim Zhukov (Искусство шрифта. Работы московских художников книги. 1959-1974, Максим Жуков) 1977<br>
      <a href="http://www.callig.ru/node/67/" title="http://www.callig.ru/node/67/">http://www.callig.ru/node/67/</a></p>
      <p>Book hands in XVII century Russia, Kostukhina L.M. (Книжное письмо в России XVII в., Костюхина Л. М.) 1974<br>
      <a href="http://www.callig.ru/node/153/" title="http://www.callig.ru/node/153/">http://www.callig.ru/node/153/</a></p>
      <p>Sadly, only the first book on the list has an English translation.</p>
