    <p>I am developing an interest in <a href="/wiki/Russian" class="freelinking" rel="nofollow">Russian</a> typography and have not yet started doing any serious investigation. Mostly researching the history, culture and economy of certain regions. </p>
    <p>Can anyone recommend books, Russian typographers, type designers, type companies &amp;c?</p>
    <p>Thank you.</p>
    <p>(I know who Kandinsky is.)</p>
