    html: |-
      <p>I took a look close-up in photoshop, and it appears that the main difference is the tracking, but the letters are a tiny bit wider in light caption and a hair thicker (barely).</p>
      <p>I think it was originally a Multiple Master font with weight and optical-size axes. Later they re-released it with a static selection of weights and optical sizes. These were probably just created by interpolation on the MM axes, so the variation seen between Light and Light Caption is from the optical size axis.</p>
      <p>Your best bet is probably to print it on a good laser printer and see which your eye prefers (assuming this is a print project).</p>
      <p>Personally I find Chaparral Light to have a lot less character than the Regular - the light has very little contrast and looks almost like a monoline font.</p>
