    html: "<p>The caption weight seems appropriate for a 7.8 size text. But looking at your pdf I noticed that you've used, both in the regular and caption settings, the Light version, which seems very uneasy to read at that small size! So I would try first to typeset the entire thing with the Normal version before proceeding. (Chapparal light works very fine for titling, in bigger sizes). Anyway, I don't think there is a general \"rule\" for using the optical sizes with the exact points recommened by Adobe: I think they're more like suggestions.</p>"
