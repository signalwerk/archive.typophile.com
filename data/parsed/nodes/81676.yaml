    <p>Opentype opticals are supposed to be optimized for specific point sizes. I have the chance to use Chaparral Pro opticals in a project, but I'm unsure about something. The "problem" is that I have to work with really small body text. Size: 7.8</p>
    <p>Now, according to the <a class="freelinking external" href="http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFontPackage&amp;code=1718" rel="nofollow">official Adobe guideline</a>, the 'regular' font is designed for 8.4-12.9 points. Does that leave me with the 'captions' design for setting my body text? It is designed for 1.0-8.4 points. Is it that simple? How do you think I should proceed?</p>
    <p>(I attached a sample. First page: regular. Second page: captions. 7.8 points.)</p>
