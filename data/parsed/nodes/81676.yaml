    html: |-
      <p>Yes, I went with the Light version because it seems to me that it gives more contrast to heavier weights than the Normal does. At any rate, I tested the Light+Regular version - it looks fine in print.</p>
      <p>I'm just wondering if it looked better with Light+Captions. I'm not sure whether there is any notable difference between 'regular' and 'caption' besides tracking, which is obvious. Maybe it's a bit "heavier". I thought maybe there are other subtle differences that I don't see, that make it more suitable for smaller sizes, or that only show in print.</p>
