      <p>I disagree.  Unger's new Prisma Pro uses four lines;  in the two sample images, HOLD GLORY is three lines and GOT GAME is five lines.</p>
      <p>For GOT GAME, I like Mirage, by George Williams:<br>
      <a class="freelinking external" href="http://www.fontspace.com/george-williams/mirage" rel="nofollow">http://www.fontspace.com/george-williams/mirage</a></p>
      <p>I found many three-line fonts, but none that match "HOLD GLORY" :(</p>
      <p>- Herb</p>
