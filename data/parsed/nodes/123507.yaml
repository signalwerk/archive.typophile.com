      <p>And here's a very early example of the modern notation for the definite integral,</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/definite_4831.jpg"></div><p></p>
      <p>from Fourier's Théorie Analytique de Chaleur.</p>
      <p>Except for putting the du first instead of last, and putting a period after the abbreviation for the sine function, this differs little from modern notation. However, in other places, there are bigger differences; an integral from 0 to X of an integral in dx appears in one spot - today, the use of the upper and lower case of the same letter would be considered confusing, and avoided sedulously - and while some integrals are shown as going from -∞ to +∞, at other points in the book 1/0 is used instead of the infinity symbol.</p>
