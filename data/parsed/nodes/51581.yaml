    html: |-
      <p>A simple game:</p>
      <p>When was in school instructors had us take three black squares of the same size and find the correct ways to organize them on a 1ft square. Maybe the squares were about 2.5 inches. By doing this assignment I realized that given the context of a situation there are solutions that look optically correct and visually pleasing. Even when given freedom to organize them as you may you will eventually see this is true. No grid necessary. </p>
      <p>If you add words or content everything changes.</p>
      <p>Step two? Add a quarter inch red dot.</p>
