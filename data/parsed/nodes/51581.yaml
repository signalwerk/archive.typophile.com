    html: |-
      <p>Superficially, check out Ray Gun Magazine and David Carson. They always discussed escaping the grid and such in the nineties. </p>
      <p>For richer study: </p>
      <p>If you start looking at design as visual connections you can create a visual language without grids by making paths of direction for the eye. Armin Hofmann was good at this. Many Basel designers are good at this even though known for working within grids as well. </p>
      <p>Just because you abandon the grid does not mean you are in some sort of nirvana within anarchy. Of course, there must be some sort of organization. For instance, Rothko and many of his generation would make a painting of dark violet and other tones only to shatter it with red. The red provided a focal point. So, there are many ways to create order. Creating visual order is a different task with perhaps different intentions that a grid is not necessarily a solution for.  You should start looking at designs or art or whatever you think looks good and ask the question: "How is it this is working successfully." Discover different approaches to organization.</p>
      <p>Another approach I have seen is when designs have an object of such shock or allure that your eye is directed to the information the designer wanted you to see. Lots of ideas out there.</p>
    html_clean: |-
