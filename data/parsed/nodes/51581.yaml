    html: |-
      <p>The grid is very useful for organizing large numbers of elements so that the reader can find his or her way easily, but when things aren't so complex, it's quite possible to design well without a grid. </p>
      <p>I've designed several books that consisted of full bleed photos with small amounts of text on each. Each block of text was placed over the photos without regard to any underlying grid -- instead the shapes within the individual photos determined the placement of the text. </p>
      <p>When to use a grid, and when to break out of it, is a judgement call that designers must learn to decide for themselves. Experience helps.</p>
      <p>      ~~~~~~~~~~~~~~~~~~~~~~<br>
            When trying to go from A to Z,<br>
                I frequently end up At Oz.</p>
