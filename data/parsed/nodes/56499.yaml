    html: |-
      <p><em>I’ll second Deseret. Although I think that has a lot to do with how quickly it came into existence—most writing systems took at least a few centuries more.</em></p>
      <p>I think this is the main problem with most writing systems that I consider to be 'less-than-well-informed' (not necessarily ugly), It seems several more recent script/alphabet developments that were developed with only one media in mind (be it handwriting, type, typewriter, screen, &amp;c.) suffer from having characters or diacritics that are clumsy at least to design in a range of type styles and probably and probably sometimes clumsy in writing.</p>
      <p>I quite like Latin script, it has an almost endless range of styles: from all the calligraphic hands and all the wonderful type styles that were developed first for Latin script. However, Latinized Vietnamese is an assault on the eyes and it seems to me that whoever concocted the current orthography didn't do so in as thoughtful a manner as might have been done. I like Latinized Navajo MUCH more than Vietnamese and it seems that Navajo solves some of the same problems as are present in Vietnamese in a more elegant (but probably not perfect) manner. I really don't like the combining accents in Vietnamese that always seem (to me) to be colliding, no matter how nicely you try to make them appear. Vietnamese needs a refresh.</p>
      <p>I really like the Cyrillic script. I think it works better in writing than in print. The capitals are wonderful, but the canonized form of the lower case could do with some more experimental treatments to find something that harmonizes better with than the current iteration. That said, I don't feel that the so-called Bulgarian Cyrillic is an improvement on the more common form. Perhaps there is some native Cyrillic user with as much wit as Marian Bantjes who can <a href="http://www.underconsideration.com/speakup/archives/002383.html#002383" rel="nofollow">critique the alphabet</a> in such a way as to inspire designers to take more risks in trying to develop a better typographic Cyrillic lowercase. But overall it works, except I find that all the extra letters required for Abkhaz are atrocious, just try designing a good looking 'K/ka with vertical stroke' (u+049C/D), it IS possible, but the 'Abkhasian C/che with descender' (u+04BE/F)(and even without the descener) is reprehensible. Abkhaz needs a refresh.</p>
      <p>And where does IPA fit within this scheme, is it a script? Is it an orthography? Is it an extension of the Latin Alphabet? (I am guessing it's a bit of all of these things) Some of the 'letters' (as that is what they are for some African orthagraphies) could have been better planned such as the hooked f or all the hooked letters for that case. If new orthographies are going to continue to incorporate IPA symbols, some of these letters ought to be rethought. I personally think that a truly 'international' alphabet or script should be better designed and should be descriptive such as the Korean script or perhaps even Tengwar (I'm sure I'm the only one that would love to see that last suggestion fly!) IPA needs a refresh. Talk about a type battle! There's a challenge for a whole team of seasoned type designers.</p>
      <p>And I haven't looked closely enough at it, but I think it'd be a challenge to make N'Ko look good.</p>
    html_clean: |-
