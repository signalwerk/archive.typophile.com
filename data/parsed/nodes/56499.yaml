      <p>Navajo vowels present contrasts along four axes: quality (a, e, i, o), length (short or long), tone (low or high; syllabic n also bears tone), and nasality (absent or present).  I'm sure there are a number of ways to deal with all of those factors, but if you're going to represent the complexity of the vowel system, one way or another you're going to end up with a complex orthography.</p>
      <p>The Hmong Romanized Popular Alphabet deals with some of these issues by using conventional letters in unconventional ways.  Doubled vowels indicate nasality; letters at the end of a syllable indicate tone.  These conventions work because in there is no contrastive vowel length and because the few syllable-final consonants are predictable from nasality and tone and need not be written.  In addition to these innovations, several of the letters and digraphs in RPA represent different sounds than they typically represent in other languages.</p>
      <p>To illustrate, in RPA the word /m̥ɔ̃ŋ˦/ (Hmong) is written "Hmoob"; the 'hm' represents voiceless m, the 'oo' represents a nasalized mid-back vowel (the nasality implies the ŋ), and the b represents high tone.</p>
      <p>The clear upside to this orthography is that no diacritics or special characters are required; the downside is that, because it violates so many conventions, the uninitiated can't even come close to reading it right even though it's written with the Latin alphabet.</p>
      <p>Coming back to Navajo: since virtually all Navajo speakers are also fluent (and, if they're old enough, literate) in English, it's probably easier for them to deal with diacritics and more or less standard alphabetic conventions than it would be to adopt a Hmong-style system that might be more aesthetically pleasing but doesn't work in the way we understand an alphabet to work.  Of course, here I'm setting up a false dichotomy; there are probably ways to represent the contrastive features of Navajo that preserve basic alphabetic conventions without going overboard with diacritics.</p>
