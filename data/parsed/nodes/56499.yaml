      <p>&gt; you get used to it eventually</p>
      <p>That does not make it a good thing. You can get used to losing a leg too.</p>
      <p>A writing system where the differentiation between letters relies on tiny floating bits is severely sub-optimal. Not to mention the aesthetic ungainliness.</p>
      <p>People can handle very expansive character sets; a swarm of diacritics added to a poor base set might seem convenient and cost-effective, but culturally and functionally it's really only useful to the colonial power in the long term.</p>
      <p>hhp</p>
