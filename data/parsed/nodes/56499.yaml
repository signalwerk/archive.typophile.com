    html: <p>A little while ago Patrick Doan showed me some work he did on getting Vietnamese to look better. I was impressed. One of the many things he looked at was making the very high frequency letter shapes hnmu shapes more divergent by lowering the join to the stem. From what I could see it was quite a good idea. It makes designing an italic a little harder but in this case it looked utterly worthwhile. He was also looking at what people had been doing to the diacritics with sign painting etc. I suspect that Vietnamese does have some inherent challenges but Patrick's approach to sorting a way forward and the examples he showed me did seem to suggest that there is a great deal of power in execution. Paul's points about nightmare characters are right on though.</p>
