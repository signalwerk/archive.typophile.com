      <p>As a native Czech speaker living permanently overseas I have been omitting the diacritics in Czech in my typing for decades. Originally, because there were no keyboards/software here that would allow it, nowadays because of habit. My friends and relatives who live in UK, Germany, US and elsewhere do the same. </p>
      <p>Amazingly, there are only a very few instances indeed where the lack of diacritics could cause any confusion: on the whole, Czech writing is comprehensible without (IMO). However, diacritics are necessary as a guide to pronounciation in the spoken language. I find the diacritics distracting in reading and sometimes wish the Czechs reformed again and done away with it.</p>
      <p>As with the criticism of Vietnamese writing presented above, I think that using diacritics generally is really trying to make scripts do something they were not designed to do, to fine-tune otherwise convenient adoption from another culture. From that point of view, the fewer the better. Examples of adapting scripts without diacritics abovnd (apologies, should not iest).</p>
