      <p>Alphabetic and other phonetic-based writing systems -- i.e. those that represent spoken language symbolically -- are always faced with the question of how much of spoken language to represent. Spoken language is phenomenally rich, and only phonetic transcription systems such as IPA are designed to represent any sound that humans can make (including specialised additions for disordered speech of various kinds). Most writing systems represent only a subset of linguistic phenomena, but may provide options to increase that subset. The Vietnamese alphabet is complex because it represents more discreet vowel sounds than many other writing systems, and it consistently represents tone. It isn't unique in this. The Thai alphabet, for example, represents a very similar set of linguistic phenomena, but it looks better because the letters, vowel signs and tone marks evolved in parallel, rather than overloading marks onto Latin letters that had evolved without them.</p>
      <p>The majority of sub-Saharan African languages are tonal, but most of the orthographies indicate tone optionally, i.e. it is not marked consistently but only in pedagogical materials or when necessary to distinguish otherwise identical words in situations where meaning might be ambiguous. Nasalisation is another phenomenon that is optionally marks, again to distinguish words. This means that text in an African language may either look quite clean and simple, or may be liberally covered in tone and other accent marks, depending on the variety of linguistic phenomena represented.</p>
    html_clean: |-
