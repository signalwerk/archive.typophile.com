      <p>Practically speaking, in the case of Vietnamese, the possible revival of Nôm notwithstanding, maybe the overloaded base letters can have variants depending on what's added (carefully chosen to increase word differentiation). For the "a" you could have a mono versus bi form; for the "o" maybe a round versus schwabacher form (spiky on top and bottom). The problem is this would make it even more "noisy"...</p>
      <p>What you really need is for the diacritics to be integral; like how a good ogonek is made. Especially for letters with more than one.</p>
