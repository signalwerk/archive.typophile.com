      <p>I put forward Sutton SignWriting™ for the prize. It's a system based originally on a movement notation used to describe dance, rather than a script conceived from the get go as a writing system for sign language. (There are several proposed sign language scripts, one dating back 200 years, but none has become as widely used as SignWriting.) The system is essentially a combination of stylised pictographs of handshapes and the face plus several kinds of conventional arrows and assorted diacritic symbols used to describe head, eye and hand movements. The symbols are arranged as schematic drawings of the spatial arrangement of the hands and face when a sign is made (from the perspective of the person signing.) </p>
      <p>For a taste of what it looks like, follow these links to a relatively long article about SignWriting by a deaf author and a page with SW greeting cards on the SignWriting web site:</p>
      <p><a href="http://www.signwriting.org/archive/docs6/sw0526-US-Why-SignWriting-Frost.pdf" title="http://www.signwriting.org/archive/docs6/sw0526-US-Why-SignWriting-Frost.pdf">http://www.signwriting.org/archive/docs6/sw0526-US-Why-SignWriting-Frost...</a><br>
      <a href="http://www.signwriting.org/cards/" title="http://www.signwriting.org/cards/">http://www.signwriting.org/cards/</a></p>
      <p>There are two things I find ungainly (to keep it nice) about the system. For one, the symbols are all very blocky and and drawn in a very rudimentary way and the system actually requires the interiors of many symbol shapes to be coloured in solid (or for parts of the symbol to be "broken" and the line gapped in white) to convey certain kinds of information. The second thing is the way the symbols are arranged as a schematic drawing of everything that happens when a sign is made, from the point of view of the signer. </p>
      <p>Basing the character inventory on shapes, plus the use of colouring-in of shapes and breaking-up of lines is unique as far as I know among all writing systems. Every other writing system I can think of relies on combinations of straight and curved lines to form its characters. The way the SW characters are drawn results in the most ungraceful character set of any script I have seen, and in fact all other systems that have been proposed for sign languages follow the usual line-based construction of characters. One major disadvantage of the script is that handshapes and arrows – as well as being coloured in or broken – are rotated on the page/screen to reproduce more or less precisely the direction they face or point, <strong>and</strong> are precisely placed on the writing area to show where and how a hand touches another or touches the face. This makes for an extremely convoluted and complicated computer representation and input system, with a plethora of characters (and positions in the sign diagram) for every minute difference in the way a given handshape can be held in space. </p>
      <p>Combining characters in schematic drawings of a sign being made (including rotating handshape symbols in space and colouring them in or gapping them at one end to represent which way the palm faces), together with the way sequences of fingerspelling handshapes are arranged in horizontal lines, makes for a chaotic visual image on the page, with no consistent arrangement of characters in space, unlike any other script I know of. The way all the symbols are drawn and combined leads to a situation where one can only communicate a minimal amount of information per page, way less than any other natural script. This seems to me to be a major barrier to wider adoption and use. </p>
      <p>Myself, I think SignWriting's basic idea of representing the simultaneous combination of handshapes, locations and movements by combining characters in a two-dimensional matrix is sound, rather than stringing them out in a line the way other sign language scripts have done. But I have trouble seeing how SW as it is can be repaired without gutting the system and rebuilding it. </p>
      <p>I have been working on an alternative to SW that follows the basic principles of sinoform scripts. The basic component characters are drawn with combinations of strokes similar to Sino-Japanese hànzì/kanji and Korean Hangul and arranged in square matrices just like complex kanji or hangul syllables. The overall appearance and rhythm is somewhere in between Chinese script and Korean Hangul, which I think makes for a far more attractive appearance, and also for a much more economical computer representation and simpler input as well.</p>
    html_clean: |-
      <p>I put forward Sutton SignWriting™ for the prize. It's a system based originally on a movement notation used to describe dance, rather than a script conceived from the get go as a writing system for sign language. (There are several proposed sign language scripts, one dating back 200 years, but none has become as widely used as SignWriting.) The system is essentially a combination of stylised pictographs of handshapes and the face plus several kinds of conventional arrows and assorted diacritic symbols used to describe head, eye and hand movements. The symbols are arranged as schematic drawings of the spatial arrangement of the hands and face when a sign is made (from the perspective of the person signing.) </p>
      <p>For a taste of what it looks like, follow these links to a relatively long article about SignWriting by a deaf author and a page with SW greeting cards on the SignWriting web site:</p>
