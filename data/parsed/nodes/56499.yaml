      <p>&gt; Chinese was the writing of the elite</p>
      <p>Makes sense - the same thing happened in Korea.</p>
      <p>However your view of cultural borrowing is surprisingly narrow. Is this something you've been fed at Reading? Although a given culture isn't a person that can walk, talk and eat, people do feel they belong to a culture, and they see other cultures as entities of sorts; furthermore they see opportunities to take things from other cultures and improve their own culture. This happens all the time in non-Latin type design for example, where a non-Westerner will live and study in the West, develop an admiration for Latin in general and a given typestyle in particular, and proceed to make a font in his own script that mimics it. There's no reason to deny that this sort of thing can happen on a grander scale, specifically the creation of a writing system inspired by and/or based on another. Cultural exchange is not limited to imposition by the materially strong on the weak; remember not least the pronounced Roman borrowing of Greek culture after the military conquest.</p>
