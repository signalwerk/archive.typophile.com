      <p>Speaking of diacritics, I feel that the system of vowelling points for Hebrew--nikkud--detract from the beauty of the script. For some reason, the dot above (vav, shin) and in front (vav) don't seem to be clutter, but all the stuff below never works visually. And I have the feeling it can't really be 'read', but rather laboriously pronounced. For non-native speakers, it's a tremendous help--that's what it was created for--but it doesn't look very good. With both nikkud and teamim--the cantillation marks for chanting sacred texts--it really becomes a mess.  </p>
