    <p>Over in the 'Most beautiful alphabet' thread, Hrant writes, in response to the suggestion that any writing system in the hands of a competent lettering artist or calligrapher can be beautiful:</p>
    <p><em>Nah, some scripts are just dog-ugly no matter how hard you try.</em></p>
    <p>So, what do you think are the least visually attractive <a href="/wiki/writing%20systems" class="freelinking" rel="nofollow">writing systems</a>, the ones that are difficult or even impossible to make look beautiful?</p>
