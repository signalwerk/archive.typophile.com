      <p>Also, bicameral writing systems seem to tend to have one nice "chamber" and one not. Armenian's lc is very nice, but its UC has ungainly members; Latin has a sublime UC, but its lc is homely (but not ugly).</p>
      <p>BTW, can Morse Code -which is essentially a writing system- be beautiful? Maybe once in a blue moon to some rare soul, but certainly not enough to be qualified as Beautiful.</p>
