      <p>Hmm, Eureka has a smaller x-height because it's optimized for Czech, right?<br>
      What I meant is language-dependent *varying* of x-height / base glyphs.<br>
      Like, one and the same font (or type system) could have a taller x-height for Greenlandic, which uses very few extenders; narrower glyphs for Finnish, with its many repetitions and long words; a smaller x-height for Czech; an even smaller one for Vietnamese; maybe longer descenders for Polish, to fit ogoneks?, &amp; such.<br>
      It would be a pain to make, but I think one must question the functionality of the one-size-fits-all premise of the Latin script.</p>
