      <p>Let's say a Vietnamese village full of people is dying of thirst.  There might be strangers who come by from other cultures who have plenty of water to drink, do the Vietnamese say, "No, I won't drink your water because it is not from my culture, I choose to go without first."? No, they don't ask what business they have there or if they are harboring deception or imperialistic intent, or a foreign religion based on an unknown world, they just drink the water and are satiated.<br>
      The Vietnamese have had a very long history of being either invaded, annexed, colonized, and prostilitized by foreigners both eastern and western. From the Chinese to the Americans, they have known no peace until the mid 1970's. Some foreigners brought aspects of written language to a culture that was vastly illiterate. Many Vietnamese were thirsty for written communication and literacy and took from their invaders and those who also came to bring "salvation of their souls" reading and writing since they had precious little of their own to begin with. When they could, they finally cast out the waves of different invaders and began their own life.<br>
      If at some point, they decide they need a new script instead of the patchwork they adopted from foreigners, they will devise it themselves. Until then, the Vietnamese don't need yet another foreigner or group of foreigners to either make up their minds to do it for them or convince them to do the task themselves. Hindsight is easy and outsiders may think they know better (including me and anyone else on this forum) but it is not our call to cast judgement on what they should have done in the past or should do in the future. Sure, we can give our opinion on the aesthetic feeling we get from their script but their is no need to cast blame. We can save that for the more heinous things we and other nations have done.</p>
      <p>ChrisL</p>
