      <p>Now hang on, you're asking which script is minging? But I love Latin type in some faces but hate Latin type in other faces. Wouldn't that extend to other language systems as well? For me it's all about the typeface and less or nothing to do with the language system itself. </p>
      <p>I can understand someone disliking a particular script but they will almost certainly have a typeface (or handwriting) in mind when they are making those judgments, won't they? Does anyone genuinely have a neutral idea of a script without attaching a particular rendering, whether it be calligraphic or typographic. Does such a neutral or elemental version of each script even exist? Nope, that's just too subjective to be in any way meaningful.</p>
      <p>For example, I find one script largely hideous, but I don't think that saying which it is will be in any way constructive in this debate, it may even be spiteful! Next, there are some versions of that particular script that make the thing itself look better and some that make it look worse. The same is true for Latin.</p>
      <p>&gt;&gt;&gt;it’s all in the execution</p>
      <p>That, and what I have become used to and thus wedded, affectionate, anaesthetised, immune, indifferent or even completely switched off to.</p>
