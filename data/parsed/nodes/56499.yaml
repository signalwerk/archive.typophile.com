      <p>It is true that Vietnamese to those unfamiliar with the language looks like a horrible mess. However, as a speaker of it, you get used to it eventually just like any other writing system. I don't think the diacritics are much of a hassle - reading and writing is much easier than some people make it out to be. I am also learning Chinese and also the old Vietnamese writing system of Chữ Nôm. I love Chữ Nôm - it's complex yet has a certain mystical beauty about it like Chinese. Oh and before the modern Romanised script called Chữ Quốc Ngữ and even before the Chinese style Chữ Nôm, the ancient Vietnamese had their own writing system called Chữ Khoa Đẩu which was a set of tadpole-like etchings. </p>
      <p><em>[Cho những ai mà không quen thuộc với tiếng Việt thì chắc chắn là họ sẽ thấy cái bộ chữ Quốc Ngữ rất là lộn xộn và xấu xí. Tuy nhiên, khi đã học ngôn ngữ Việt, thì ai nấy đều cũng phải quen thôi. Tui nghĩ rằng ba cái dấu phụ dùng trong chữ viết không lộn xộn gì mấy - và sự đọc và viết tiếng Việt lại dễ hơn nhiều người nghĩ. Tui cũng rất thích Chữ Nôm - cho dù nó khó học thật nhưng nó có một cái nét đẹp rất là đặc biệt như chữ Hán. À trước khi người Việt lấy Chữ Quốc Ngữ làm chính thức và cũng trước thời người Việt sử dụng bộ chữ Hán-Nôm, từ thời cổ người Việt đã có dùng một loại chữ Khoa Đẩu mang những cái ký hiệu y hệt như mấy con nòng nọc.]</em></p>
      <p>So a rough timeline would be presented as:</p>
      <p>[Before the CE] &gt; [~100BCE &gt; 1919CE] &gt; [~1200CE &gt; 1919CE] &gt; [~1700CE +]<br>
      Tadpole script &gt; Chinese script &gt; Vernacular script &gt; Romanised Script</p>
      <p>&gt;Wow this font does not do Vietnamese any justice :P</p>
