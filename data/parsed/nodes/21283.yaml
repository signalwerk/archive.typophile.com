      <p>Also ...</p>
      <p>Thomas Harvey digitized this as <a href="https://web.archive.org/web/20191006072251/http://www.abstractfonts.com/font/6803" target="_blank">Mottek</a> over a decade ago and Aaron Beck tweaked it as <a href="https://web.archive.org/web/20191006072251/http://www.grsites.com/exec/public/fontview.cgi?dir=c&amp;fn=CU______" target="_blank">Cupertino</a><br>
       nearly as long ago. Your best bet is the Paratype version where font quality is at stake, though.</p>
      <p>Incidentally, Motter Tektura was the typeface used for <a href="https://web.archive.org/web/20191006072251/http://en.wikipedia.org/wiki/Apple_fonts#Motter_Tektura" target="_blank">Apple's first logo</a>.</p>
