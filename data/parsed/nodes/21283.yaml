      <p>Also ...</p>
      <p>Thomas Harvey digitized this as <a href="http://www.abstractfonts.com/font/6803" target="_blank" rel="nofollow">Mottek</a> over a decade ago and Aaron Beck tweaked it as <a href="http://www.grsites.com/exec/public/fontview.cgi?dir=c&amp;fn=CU______" target="_blank" rel="nofollow">Cupertino</a><br>
       nearly as long ago. Your best bet is the Paratype version where font quality is at stake, though.</p>
      <p>Incidentally, Motter Tektura was the typeface used for <a href="http://en.wikipedia.org/wiki/Apple_fonts#Motter_Tektura" target="_blank" rel="nofollow">Apple's first logo</a>.</p>
