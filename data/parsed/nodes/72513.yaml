      <p>Reichardt also created <a href="http://www.klingspor-museum.de/Kuenstler.html#E-Anker" rel="nofollow" class="link-external">a list of all typefaces by Ehmcke</a> for the Klingspor-Museum. Note that Ehmcke’s full forename reads Fritz Helmut (without ‘h’).</p>
      <p>Nick,<br>
      why long s in Luftschiffhafen, or in general?<br>
      For the crossbar in ‘Z’: 1. This is common in handwriting models/script typefaces – and blackletter, and can also be found in several of these German transitional (i.e. from Fraktur to Antiqua) typefaces. 2. It helps texturing the otherwise abundant whitespace.</p>
