    html: |-
      <p>Kristian,<br>
      check out this DVD: <a href="http://www.spatium-magazin.de/produkt-der-woche-schriftmuster-dvd-»bleisatzschriften-des-20-jahrhunderts-aus-deutschland«/2318.php" rel="nofollow">Bleisatzschriften des 20. Jahrhunderts aus Deutschland</a> [20th century metal type from Germany]. Dan Reynolds wrote an <a href="http://www.typeoff.de/?p=290" rel="nofollow">English review</a> of this collection of scanned specimens, compiled by Hans Reichardt. Here is a <a href="http://www.spatium-magazin.de/wp-content/uploads/2008/05/bleisatz_d_inhalt_web.pdf" rel="nofollow">table of content (PDF)</a> – you will at least find Ehmcke Fraktur and Ehmcke Schwabacher in it.</p>
      <p>Reichardt also created <a href="http://www.klingspor-museum.de/Kuenstler.html#E-Anker" rel="nofollow">a list of all typefaces by Ehmcke</a> for the Klingspor-Museum. Note that Ehmcke’s full forename reads Fritz Helmut (without ‘h’).</p>
      <p>Nick,<br>
      why long s in Luftschiffhafen, or in general?<br>
      For the crossbar in ‘Z’: 1. This is common in handwriting models/script typefaces – and blackletter, and can also be found in several of these German transitional (i.e. from Fraktur to Antiqua) typefaces. 2. It helps texturing the otherwise abundant whitespace.</p>
    html_clean: |-
      <p>Kristian,<br>
