      <p>Andrey,</p>
      <p><cite>I can't find installer of python 2.3.6 for XP.</cite></p>
      <p>Older versions are indeed a bit tricky to find on the Python website. Maybe I should add a direkt link on my website.</p>
      <p>Python 2.3.5 for Windows can be found here:<br><a href="http://www.python.org/download/releases/2.3.5/">http://www.python.org/download/releases/2.3.5/</a><br>
      which links to this installer file:<br><a href="http://www.python.org/ftp/python/2.3.5/Python-2.3.5.exe">http://www.python.org/ftp/python/2.3.5/Python-2.3.5.exe</a></p>
      <p>As far as I know, FontLab does not support Python 3 at the moment, and RMX depends on the FontLab system.</p>
