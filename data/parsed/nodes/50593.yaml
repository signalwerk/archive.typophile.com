      <p>That seems like a fair point about the look-alike fonts -- I'll probably swap them out for something more appropriate.</p>
      <p><cite>Can you protect the .js file so it is server specific and cannot be linked-to?</cite></p>
      <p>I can put up some hurdles at least, but I haven't look too far into that yet.</p>
      <p><cite>Can you alter your conversion tool to respect the embedding preferences already included in fonts? ie if no embedding, then no conversion.</cite></p>
      <p>The conversion tool does respect embedding preferences.</p>
      <p><cite>Can you make the drawn text selectable/copyable?</cite></p>
      <p>At least in Firefox (and maybe in Safari too), you can actually select and copy the text, but you just don't see the text being highlighted as you select.  It might be possible to add support for highlighting. </p>
      <p><cite>What is a typical bandwidth hit to implement this?</cite></p>
      <p>A typeface.js font ends up being usually a few tens of kilobytes, so not too bad at all.  It will be cached by the browser, and so visitors should only need to grab it on their first page load.</p>
      <p><cite>Does it kern?</cite></p>
      <p>There's no support yet for custom hinting or kerning, but it's certainly possible to add those features in with some work.</p>
