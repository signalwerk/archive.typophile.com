      <p>David Chester was kind enough to ask for input from the type community. Rather than respond with a squabble about embedding vs pdf vs blah blah , I think the feelings could be summarized thusly:</p>
      <p>Type Designers:<br>
      • Please don't make your solution a vehicle for freely distributing our fonts.<br>
      • If you can prevent (or strongly inhibit) theft of our fonts, your solution becomes much more attractive to most foundries.</p>
      <p>Type Users:<br>
      • Thank you. It is nice to have alternative NOW in situations when Flash (SIFR) wont do.<br>
      • Please add kerning<br>
      • Please make all browsers selectable<br>
      • Please keep working on the features you're planing!</p>
      <p>Aluminum: I'm with you. If readers have to buy fonts to view PDFs: what is the point of a Portable Document Format that isn't portable?</p>
      <p>Nick: Specific .js permissions would be needed -- Hence the need for the time machine in my comment. Such permission doesnt' and probably never will exist.</p>
