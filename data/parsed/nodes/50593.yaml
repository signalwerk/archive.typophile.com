    <p>Hi, I'm working on a project called typeface.js, which aims to do font rendering in the browser using javascript, &lt;canvas&gt;, and VML.  With that functionality, we can avoid having to use images or flash to display graphic text on the web.</p>
    <p>The idea is that you should be able to take an open-source font that's free to redistribute, then convert that to a typeface.js font (basically the outline information and metadata in JSON format), and then use that font on your site just like normal, with plain HTML and CSS.  </p>
    <p>It even works.  Here's the site for the project, and it uses its own library to draw its own graphic text:</p>
    <p>     <a href="http://typeface.neocracy.org" title="http://typeface.neocracy.org">http://typeface.neocracy.org</a></p>
    <p>There are a few cool things about it, it seems to me.  One is that you get consistent rendering across platforms, whether you're talking about Windows or Mac or Linux, or whatever else, as long as there's  or VML.  </p>
    <p>Another nice thing is that if you're willing to forego that consistency, once we have cross-browser support for @font-face (if that ever happens), all you'll need to do is substitute some @font-face rules for the call to load typeface.js and its fonts, and that should be all the change that's needed.</p>
    <p>Anyway, think this'll work?</p>
  html_clean: |-
    <p>Hi, I'm working on a project called typeface.js, which aims to do font rendering in the browser using javascript, &lt;canvas&gt;, and VML.  With that functionality, we can avoid having to use images or flash to display graphic text on the web.</p>
    <p>The idea is that you should be able to take an open-source font that's free to redistribute, then convert that to a typeface.js font (basically the outline information and metadata in JSON format), and then use that font on your site just like normal, with plain HTML and CSS.  </p>
    <p>It even works.  Here's the site for the project, and it uses its own library to draw its own graphic text:</p>
    <p>     <a href="http://typeface.neocracy.org" title="http://typeface.neocracy.org" class="link-external">http://typeface.neocracy.org</a></p>
    <p>There are a few cool things about it, it seems to me.  One is that you get consistent rendering across platforms, whether you're talking about Windows or Mac or Linux, or whatever else, as long as there's  or VML.  </p>
    <p>Another nice thing is that if you're willing to forego that consistency, once we have cross-browser support for @font-face (if that ever happens), all you'll need to do is substitute some @font-face rules for the call to load typeface.js and its fonts, and that should be all the change that's needed.</p>
    <p>Anyway, think this'll work?</p>
