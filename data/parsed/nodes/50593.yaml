      <p><em>Do we really need to complicate EULAs to that extent?</em></p>
      <p>We should do whatever is most appropriate.<br>
      There are severe requirements on licensing major graphics software applications, requiring serial numbers that restrict their use to specific computers, and that is a part of doing business if you're a graphic designer.<br>
      We're not talking about $4.95 scrapbook script fonts here, but professional font software products that, when a family is licensed for multi-user use, can cost much more than Quark XPress.</p>
