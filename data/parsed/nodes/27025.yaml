  html: <p>For those of you standing by, the Forums are back online. Thanks to those of you who sent us emails to alert us to the problem. Our host is looking into why this occurs; they assure me that it's a server-side problem and are calling us back after some investigation. We find the outage as annoying as you do; If they don't have answers for us, we'll likely pull our site and switch hosts. <br> <br>Thank you and enjoy - <br> <br>jb <br> <br></p>
