    <p>Hello.<br>
    This is the image found on an old book of a dutch writer Jahan van Doorn, definitely printed in typopress.<br>
    Follow the link: <a href="http://www.martinaflor.com.ar/martinaflor_design/others/research.html" title="http://www.martinaflor.com.ar/martinaflor_design/others/research.html">http://www.martinaflor.com.ar/martinaflor_design/others/research.html</a><br>
    It seems like a didot but please take a look at the details in the f and the j. I post both version regular and italic.<br>
    Someone recognize this typeface?<br>
    Thank you for the help.</p>
