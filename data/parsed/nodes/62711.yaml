      <p>Jan Middendorp’s book “Dutch Type” makes it sound as if the latter part of the 19th century saw the Dutch copying typefaces from other countries. Only Enschedé and Amsterdam Type Foundry were in competition by that time. It seems that not much new Dutch design happened until the time of De Roos in the 1920’s. I’m sorry if these details are wrong, but this is based on a quick scan of the text.</p>
      <p>I was trying to hunt for Dutch typefaces, and maybe that is not where to look.</p>
      <p>- Mike Yanega</p>
