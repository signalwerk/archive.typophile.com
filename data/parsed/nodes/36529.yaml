    html: |-
      <p>Are the garbled glyphs from the same font?<br>
      Do the fonts have Type 1 Unique ID numbers? (They shouldn’t)<br>
      Have they tried restarting the RIP?<br>
      Does the text still come out garbled after a RIP restart?</p>
      <p>Have you tried running the font family through the AFDKO’s CompareFamily?</p>
