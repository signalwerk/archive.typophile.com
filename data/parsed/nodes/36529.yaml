  html: |-
    <p>I made some fonts for a newspaper last year.<br>
    Recently they switched from CS to CS2, and one of the fonts is acting up.<br>
    It’s a Bold Roman, and instead of setting correctly, it produces garbled glyphs, in Bold Italic.<br>
    The paper’s production process goes from InDesign via PDF and EPS back to PDF for RIP, or something like that.</p>
    <p>I wonder if anyone has come across a similar problem, and knows how to fix it?</p>
