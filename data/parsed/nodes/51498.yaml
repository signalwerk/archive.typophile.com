      <p>I'm not sure exactly what your teacher's asking for, but if i was going to pick 4 fonts from Univers to go together I'd do this: choose one to start, then find a bold, italic, and bold-italic version of it.</p>
      <p>For example:<br>
      55 (normal)<br>
      56 (italic)<br>
      75 (bold)<br>
      76 (bold italic)</p>
      <p>or:<br>
      47 ("normal" in this example)<br>
      48 (italic)<br>
      67 (bold)<br>
      68 (bold italic)</p>
