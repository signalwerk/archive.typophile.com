      <p>Iris, I don't understand your question. What does "ofc" and "w&amp;w" mean?<br>
      Weights beginning with a 4 are light,<br>
      Weights begininig with a 5 are regular<br>
      Weights beginning with a 6 are medium,<br>
      Weights beginning with a 7 are bold,</p>
      <p>styles ending with a 5 are upright roman<br>
      Styles ending with a 6 are italic<br>
      Styles ending with a 7 are condensed,</p>
      <p>In other words. Univers 55 is regular weight standard width roman<br>
      Univers 65 is medium weight standard width roman</p>
      <p>ChrisL</p>
