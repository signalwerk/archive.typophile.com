      <p>Just to play devil’s advocate:</p>
      <p>-Make a character style “foo” which creates the desired kern using tracking.<br>
      -In paragraph’s nested styles do:<br>
          [none] up to 1 .-<br>
          foo through 1 .</p>
      <p>This should work as long as there’s only one price per paragraph…</p>
