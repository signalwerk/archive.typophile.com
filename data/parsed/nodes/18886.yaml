      <p>Sebilar: “Without trying it: isn’t this possible with nested styles?”</p>
      <p>It’s a bit tricky with nested styles, because there isn’t a gap between numbers and .- and the amount of numbers vary between 1 and 4. Or at least I haven’t figured it out, yet.</p>
      <p>Apparently it is possible to define a single kerning pair for just one font in Quark, which is what they have been using until now.</p>
