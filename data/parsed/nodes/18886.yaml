  html: |-
    <p>I am freelancing at an agency that does a lot of supermarket ads. They are in a process of changing from Quark to InDesing CS, and came accross a small problem.</p>
    <p>When typing prices without cents they use ,- (50,-) kerned so, that the hyphen is flush left with the full stop. Font used is Helvetica Neue Heavy Condensed. When there are cents, they use superscript. </p>
    <p>Is it possible to define the .- pair so, that it would behave the same way every time, regardess the size of the font, while the kerning of numbers would stay normal? And if it’s possible, how do I do it?</p>
