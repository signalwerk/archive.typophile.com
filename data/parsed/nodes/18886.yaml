    html: <p>Note, in the method Dan explains above, that Adobe InDesign adusts kerning in 20/1000em increments by default which I find excessive, especially at display sizes. Thankfully, this can be adjusted to your liking in “Units &amp; Icrements” preferences under “Keyboard Increments”, I use 5/1000em.</p>
