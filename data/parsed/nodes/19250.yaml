      <p>Hmmm. Bembo is an early 20th century reconstruct of a Griffo letter from 1495. Wish I could remember the bibliographer's alphanumeric code for it. Doesn't exactly roll off of the tongue though. Not exactly junk food in that regard.</p>
      <p>I think the "darn thing" probably took a great while to cut (design was not a consideration). They didn't even bother to name "letters." I doubt they even considered there was such a thing as the delectable, unless of course, they were thinking of the type of righteous life that would lead to salvation.</p>
