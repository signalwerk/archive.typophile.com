      <p>I am working on a semi-serif face (among many others) called "Froggy". It was inspired by one of the first Typophile weekly challenges involving Cooper Black ligatures. It does not look at all like Cooper (thank god) but it will have a contextual alternate that inserts my silly "gg" ligature everytime the word Froggy is typed. It may also work on Doggy and Soggy or any other light-hearted word.</p>
