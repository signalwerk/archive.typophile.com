    <p>Yes, it's the ultimate in the way of junk food threads. (;</p>
    <p>I have to say I do admire a good name in a typeface though, since coming up with that perfect name can take almost as long as the actual designing of the darn thing! Or maybe it's just me.</p>
    <p>Anyway, what's your favorite typeface name?</p>
    <p>Mine's "Bembo". I could walk around and say nothing but Bembo all day, just because it tastes so good to say. Bembo. Bembo. Beeemboooo. It's delectable!</p>
