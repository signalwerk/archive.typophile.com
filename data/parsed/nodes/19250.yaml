      <p>Once I got a group of blondes to pose for a photo under a sign that said BEMBO (a bakery in Mexico that makes junk food and bread), I think it was probably the margaritas that made it funny to me.</p>
      <p>(most people here probably know) Storm Type has a CD of fonts with the excellent name of Typophile.</p>
      <p>Someday it'd be fun to partner with one or more designers to have fonts to offer at my site, like:<br>
      FontPlay Clean (sans)<br>
      FontPlay Odd (odd)<br>
      FontPlay Nasty (grunge)<br>
      FontPlay Hand (if my writing were used it would be another grunge font)<br>
      etc.</p>
      <p>I'm not sure about the situation where another company started claiming a trademark on something called "fontplay technology" after I had been using the name FontPlay publicly for about 7 years. If I start doing anything commercial I'll probably have to get a lawyer's opinion.</p>
