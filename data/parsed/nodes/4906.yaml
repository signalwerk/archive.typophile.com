    html: <p>FontLab Dates <br> <br>1990 - First experiments with fonts and font editing <br>1991 - Release of the Font Designer for DOS <br>1992 - FontLab 2 (first rewrite) <br>1993 - FontLab 2.5 (ScanFont 2) <br>1994 - FontLab 2.51 <br>1996 - Composer 1.0 (based on new FL3 core) <br>1997 - ScanFont 3, TypeTool 2 (both partially based on FL3 core) <br>1998 - FontLab 3 (second rewrite) <br>1999 - First Mac products <br>2000 - FontLab 3.1 <br>2001 - FontLab 4 <br>2002 - FontLab 4.5 <br>2003 - FontLab 4.6 <br>2004 - FontLab Studio 5</p>
