  html: <p>Hello, everyone. <br> <br>Does anyone know about FontLab5 information? <br>And I want to know when FL5 will launch? <br>I'm using FOG4 &amp; Illustrator8 now.  <br>I heard that FontLab announced FL5 in Typo Berlin2004. <br>I'm curious about it is possible to run FL5 in MacOS9 or not. <br>If FL5 is not available in OS9 ,I would like to purchase FL4.6. <br></p>
