    html: <p>At Typo Berlin 2004, an early preview version of FontLab Studio 5 was announced. The software will most likely be released in Autumn this year, first for Windows and subsequently, for MacOS X. We have not decided yet whether the software will be available on MacOS 9.  <br> <br>Regards,  <br>Adam Twardoch <br>Fontlab Ltd. </p>
