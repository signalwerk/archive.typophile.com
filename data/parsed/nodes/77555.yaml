    html: |-
      <p>If you are trying to achieve an effect of accentuating the negative space (around the OLPR), you may want to increase the weight of all the characters in the logotype. This will then allow for the figure-ground relationship to be better represented. There are many logos out there that illustrate this well, as I am sure you are aware, however only a few of them work really well. Take a look here to get a better idea on <a class="freelinking external" href="http://www.gr8lessons.com/EP/figureground.html" rel="nofollow">figure-ground theory</a>.</p>
      <p>This is a great word-mark by the way, I love how it incorporates the idea of a star/poles into the letterforms! Great job.</p>
    html_clean: |-
