      <p><em>What, except the fact that it’s overused to the point of nausea, that its geometrical character shapes and the resulting word shapes are not reader-friendly at all, that it has totally outlived its relevance, that it gets specified because people mistake complacency and lack of imagination for “refinement” and “timeless beauty”</em></p>
      <p>But those flaws all apply to Avant Garde, and would to Avenir if it were old enough to be overused. They are inherent in the design of all regular geometric sans. At least Futura has the sense to avoid Avant Garde's absurdly large x-height. </p>
      <p>Once you've decided to use something "Futura-like", you're basically assuming most of Futura's flaws anyway, so you might as well go ahead and use it. If you have <strong>specific</strong> problems with Futura (like "I prefer two-storey 'a's") then please voice them.</p>
      <p><em>that the most often used digitization (Adobe’s) is a disgrace</em></p>
      <p>So use Bitstream.</p>
