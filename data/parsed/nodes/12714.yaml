    html: |-
      <p><em>What exactly is wrong with Futura?</em></p>
      <p>What, except the fact that it's overused to the point of nausea, that its geometrical character shapes and the resulting word shapes are not reader-friendly at all, that it has totally outlived its relevance, that it gets specified because people <a href="http://www.typographer.org/2005_05_01_digests.html#111668278288994728" target="new" rel="nofollow">mistake complacency and lack of imagination for “refinement” and “timeless beauty”</a>, that the most often used digitization (Adobe's) is a disgrace, that its condensed counterpart looks ridiculously bad, ... ?</p>
      <p>Errr ... except all that, nothing, really. There hasn't been designed anything better these past seventy-odd years, so I think Futura is a perfect choice. ;-)</p>
    html_clean: |-
