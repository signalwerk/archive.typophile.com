    html: |-
      <p>What about Nobel?</p>
      <p>About Futura I quoute Hrant "It's a feature, not a bug"</p>
      <p>Of course Futura has a mediocre performance as a text face compared to most classical roman text faces (altough I read once a whole book set in Futura and it didn't annoyed me as much as reading another book tightly set in Caslon 540). </p>
      <p>Futura still has a lot of character which seems unchallenged today despite the various attempts to substitute it with some other "improved faces" like the boring Univers like Avenir.</p>
      <p>I alsho think that the more classical structure of Futura (and it's consequent elegance) is true to a geometric sans serif as much as to a greek or roman rustical inscription. Most of the other geometric sans serf are not elegant at all.</p>
      <p>Too bad it's overused but people is much less sensitive to this than us.</p>
      <p>Héctor</p>
