    <p>I have something odd going on with Safari. I know I can just use firefox, but I'd like to figure out what's going on. I just got a new iMac, and everything was fine. I then added all my font files to my library, and this happened to the majority of the text I see in my web browser window:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture-1_4902.jpg"></div><p></p>
    <p>In my preferences, I have my standard font set to times, and my fixed-width as courier. Does anyone know why this is getting overwritten, how I can fix it, or even what this hideous typeface is?</p>
