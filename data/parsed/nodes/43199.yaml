    html: |-
      <p>For future reference:</p>
      <p>This occurs sometimes when you add/delete a lot of fonts from OS X.  The best way to solve the problem, without having to hunt down the offending font and delete it, is to clean your font caches.  Font Finagler will do it 10 times for you before you have to pay for it and FontExplorerX will do it for you completely for free.</p>
      <p>Any time you have a weird font problem—when this problem happens usually the text is completely illegible; like opening up a data file in a text editor—the first thing to try is cleaning your caches.</p>
    html_clean: |-
