      <p>Hunter, it should be under the SAFARI drop-down menu, then PREFERENCES from that. Choose the APPEARANCE tab. This should lead you to the fields where you can choose both your font <em>and</em> size. That's all I can say offhand, but it sounds like you've already been down that road. screenshot?</p>
      <p>Otherwise, throw out your preferences for safari. Throwing out preferences is the solution to about 80% of mac problems.</p>
