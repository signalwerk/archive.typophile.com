      <p><em>In terms of writing technique, how are the hairline strokes in the capitals created? I'm guessing, by looking at that D, that the pen is tilted so that only the corner of the nib is used.</em></p>
      <p>Yes, that's the technique, and one that is surprisingly common in European tradition. It can be seen in everything from 6th cen. rustics to gothics from 1000 years later. Some bâtardes use it gloriously, and usually with a gradual thinning of stroke, which brings up:</p>
      <p><em>Following on John Hudson's question, how does a pen come up with this shape?</em></p>
      <p>It is said that most bâtardes were written with a very flexible pen (quill), and so the thinning of these strokes are due to a release of pressure. That's not always the case, as very fine bâtardes can be written even with a stiffer broad pen. In those cases the thinning is typically due to a lifting of one side of the pen. It doesn't usually require a twisting technique, although that can be in the mix.</p>
      <p>This lifting is particularly effective when writing fast strokes. Bâtarde, with all its mannerisms, is thought to have been written slowly. That's probably true of the more florid, formal examples, but as a cursive gothic it really developed with speed and practicality in mind. That meant less twisting, fewer strokes, more connections, etc. Here are two quick examples of strokes written at a relatively high speed with a very stiff pen and a constant pen angle - the first one shows lifting of the right side of the nib, whereas the second is done with a quick downward flick of the wrist, effectively lifting the <em>left</em> corner.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/thinning_4160.jpg"></div><p></p>
      <p>BTW - well done Tom!</p>
