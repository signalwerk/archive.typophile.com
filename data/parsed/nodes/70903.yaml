    html: <p>In terms of writing technique, how are the hairline strokes in the capitals created? I'm guessing, by looking at that D, that the pen is tilted so that only the corner of the nib is used. If so, this is a nice European example of the technique that is central to the nasta'liq style of Perso-Arabic script, which I think may constitute a 4th stroke construction model in a Noordzijan analysis.</p>
