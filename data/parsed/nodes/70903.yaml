    <p></p><div class="imageWrap"><img src="http://typophile.com/files/givry1_4667.jpg"></div><p></p>
    <p>The bâtarde flamande is a style of writing used predominantly in France and present-day Belgium in the 15th century. The style shares an ancestry with other writing styles traditionally grouped as blackletter—fraktur, textura, rotunda, and schwabacher. It had evolved, however, into an æsthetic far removed from its relatives.</p>
    <p>While high-contrast in nature, the bâtarde flamande is more delicate and dynamic than the austere and condensed fraktur and textura. Quick curves lack the rigidity of the schwabacher and rotunda. Flair through swashes is thematic, as are the variations in letterforms.</p>
    <p>The flowing rhythm, achieved through a letterform axis that is overall slightly rightward, is most noticable in the hallmark f and long s. Round forms are fused together for economy of space. It is a writing hand that, with its syncopation and fluidity, produces a vibrance uncharacteristic of other blackletters.</p>
    <p>While suitable as an elegant and energetic display face, Givry was conceived for setting continuous text. The result of many refinements and adjustments is the preservation of the style’s irregular nature, as well as a consistency that continuous-text typography requires. Carefully researched and developed in OpenType format for a wealth of typographic features and support for more than forty languages, Givry is neither derivative nor experimental, but historically accurate. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/givry2_5549.jpg"></div><p></p>
