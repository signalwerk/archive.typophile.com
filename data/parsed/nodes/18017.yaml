      <p>Actually it is possible that Flash offers the same basic support for OT fonts as Freehand MX. That is super limited, but here is its level of support (from <a href="http://www.linotype.com/9-9-9-14510/opentypeandapplicationsupport.html">this page</a> on the Linotype website).</p>
      <p><strong>Freehand MX (Windows XP/Mac OS X)</strong><br>
      1. Only TrueType-flavored OpenType fonts (“TTF”) are supported. These function like traditional TrueType fonts</p>
      <p>2. No support for “CFF”-flavored OpenType fonts</p>
      <p>3. Only the first 255 characters of Latin Character Sets are supported</p>
      <p>4. No Unicode support, and therefore no capabilities beyond Latin 1 languages</p>
      <p>5. No support for OpenType Layout features</p>
    html_clean: |-
