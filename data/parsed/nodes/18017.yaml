      <p>Flash may be a problem. As far as I know, Flash does not support OpenType fonts. With an OpenType font, you could use the same font file on a Mac and a PC. That would normally eliminate your issues.</p>
      <p>I can’t guarantee you that any same PC and Mac versions of a font will render exactly alike. But maybe I’m wrong.</p>
