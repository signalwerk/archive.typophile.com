    <p>Hi,</p>
    <p>I’m currently working with a Flash developer who is using a PC. I am supplying him with Flash templates which I create on a Mac. </p>
    <p>I have supplied him with PC versions of the exact font I am using (even though he owns the font himself, I have made a version for PC using Fontographer, to try and ensure equivalence), but whenever he resupplies me with the completed file, the fonts all look completely different and have shifted position.</p>
    <p>This isn’t the end of the world, it just involves a lot more work for me than I was originally expecting. However, we are about to begin work on a new Flash movie that requires a ’handwritten’ style typeface.</p>
    <p>Can anyone recommend a handwritten font that will work and look exactly the same on both platforms, without me having to reposition it every time?</p>
    <p>Many thanks...</p>
