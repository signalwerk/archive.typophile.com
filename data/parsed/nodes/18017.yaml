      <p>Flash and Freehand do not handle text in the same way at all.</p>
      <p>Flash has <a href="http://www.macromedia.com/support/flash/languages/unicode_in_flmx/">supported Unicode</a> since player 6.</p>
      <p>I’m pretty sure flash supports both flavours of opentype font, but does not support opentype features (flash throws away a lot of font info when it embeds the font).</p>
