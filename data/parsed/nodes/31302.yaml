      <p>Richard, you might consider learning this stuff in FontLab instead. </p>
      <p>The reason is that there is a considerable investment of time learning either program. If you already are comfortable in Fontographer, then there is less reason to switch. But if you have to learn a lot in either program, then it makes sense to me to start in FontLab, as it is the full featured program, and you are likely to have to end up using it anyway. </p>
      <p>At any rate, that was my reasoning and what I have done.</p>
