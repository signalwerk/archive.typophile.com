      <p>poms, I agree with a lot of what you're saying. I should have also mentioned that it's not just the size that bothers me, but also very much the typeface. </p>
      <p>AGaramond is just too bland for me and I want a typeface that has a little character to it that sneaks up on you when reading it. I want our readers to want to immediately dive into the text without hesitation, and while reading it (or even after) there can be a letter or number or something that they notice and momentarily think to themselves, "oh that's neat/nice/interesting" and then move on effortlessly in reading. Obviously it also neds to have it's own personality so there's the subtle acknowledgment that they know they are reading our magazine.</p>
      <p>I adhered to most of Bringhurst's rules when setting the type. I have the copy set for 2, 3 and 4 columns of text. I'm also switching to left justified. I have my settings at 80/100/120% for allowable/preferred/maximum in InDesign. I'd also love some advice for setting left justified text a better way though. I think I might be missing a few things.</p>
      <p>poms, I'll check out Sabon again (looked at it before, it didn't grab me the first time), as well as DTL Documenta and TEFF Lexicon, but if they're that expensive then they may not be an option for me.</p>
