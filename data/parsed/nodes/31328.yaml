    <p>Help me convince my marketing boss that there is a better solution to making body copy more readable that does not simply involve "making it bigger".</p>
    <p>We have a magazine that was set in 10 pt. AGaramond (leading was set to "auto" in Quark - before I started working there). I produced the next issue in InDesign using Bembo set in 9.5 pt. with leading at 10 pt. but set to align to a baseline interval setting of 0.15 inches. It was flush left, ragged right and hyphenations were turned off.</p>
    <p>Now, their argument is that because our target audience is anywhere from the 40's and 50's up to the 60'70's male reader, their eye sight isn't so good anymore and they mostly will have several pairs of glasses. So they want larger type so it's easier to read.</p>
    <p>My problem is the AGaramond set at 10 pt. just looks too large to me. It reduces the class of the magazine. I believe that there are other settings or even other typefaces (sans serif) that can be utilized for better readability at slightly smaller point sizes that is comparable to the 10 pt. set AGaramond.</p>
    <p>Can I get some help with this? Are there any websites out there that discuss this issue and offer solutions?</p>
    <p>Many many thanks in advance.</p>
