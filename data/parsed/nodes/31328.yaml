      <p>Adobe Garamond and Bembo both have relatively low x-heights which makes them look elegant, I agree, but they can be hard to read at small sizes. Remember that font size is relative, Perpetua for example is kind of tiny and you'd need to set it at 11 points to match most 10 point fonts. </p>
      <p>I'd suggest you find a body font that has a slightly higher x-height and perhaps a more condensed shape and then add some lead. You'll satisfy the older folks (I know about this, I had a boss for years that always wanted the type bigger for his tired eyes, and then I remember showing my portfolio to an art director who asked me why I always used such large type) and maintain an elegant airy feel.</p>
      <p>Dante is a nice font that has a higher x-height. Sabon, Columbus, Electra, Spectrum are all nice too.</p>
