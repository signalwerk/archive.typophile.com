      <p>Michael, I think your boss is basically right about too small type, and you should listen to him. If I'm doing the math right, 10 pt Adobe Garamond has about the same x height as 8.5 point Times New Roman. </p>
      <p>Kevin Larson, reading scientist at Microsoft, mentioned here on Typophile what seems to be a reasonably good, if old, test which found that most people prefer to read at 11 point. [I think it was book type, but I'm not sure.] David Berlow mentioned a recent survey of newspaper readers which gave a range of 8-11 point. Now both these surveys are of limited use as they don't refer to x-height, which is the more significant issue. </p>
      <p>And they don't mention other important variables. For example, roughly speaking if you have a shorter measure and more leading, smaller type is more readable than at longer measure and less leading. </p>
      <p>In sum, I would suspect that 10 point AGaramond is only going to work even passably in a narrow, multi-column setting, similar to Times at 8.5 point. </p>
      <p>Also with Times at 8.5 point you are starting to push the lower limits of readability, which is going to be more of a problem for older readers. </p>
      <p>The blanket advice 'use 12 point' is ignorance speaking, as 12 point may well be too big, depending on other factors. But if 'Make It Bigger' (title of Paula Scher's book) is the usual amateur mistake, I think that making it too small is a common designer mistake. The reason is that the white space is going to free you to make your design look better. But try reading it! </p>
      <p>The age factor is also important, depending on the age of your readers. Here from a web site on newspaper design:</p>
      <p>"The aging of newspaper readers has been cause for concern for experts like Mario Garcia, who has redesigned more than 450 newspapers worldwide during the last 25 years. 'I now use 10 point text uniformly on all projects, knowing that we have an increasing number of baby boomers who need reading glasses, and they are likely to be readers for another 30 years or so.'"</p>
      <p>Note that Garcia was talking about newspaper type, like Times, with a large x-height. So if you are talking about Times at 10 point, you are talking Abobe Garmond at probably 11.5 point. Which to my old eyes sounds like something I would be happy with! </p>
      <p>ps. The 18 point plus stuff for those with seriously vision impaired is very important, but it doesn't apply to normal aging, without any special problems.</p>
