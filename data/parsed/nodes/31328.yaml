    html: <p>If you settle on Bembo, and the budget allows for it, look at Bembo Book which is available in OT and was redone to more closely approach the warmth of metal Monotype Bembo. Given what you have said above, you may prefer the thinner, lighter color of the older digital Bembo but for me  the new Bembo Book is much easier to read as text type. In all the years that digital Bembo existed, I actually never used it -- seemed too anemic to me -- so it was use metal or choose some other PostScript face. Now that the Bembo Book is out I'm much happier.</p>
