      <p>I usually tell clients that they may not need to make it bigger-- but I do agree with them that it *might* be hard to read. Then I say something like, "Yeah, the linespacing is probably a little too tight." And then we add more lead and maybe .25 pt and everyone's happy. Unless someone is blind, usually, it's not the size but the leading and line length that makes it hard to read.</p>
      <p>This works with clients.<br>
      Marketing people, though, are different. Little, yellow, different.<br>
      So, it may not work for them.</p>
