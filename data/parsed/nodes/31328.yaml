      <p>Ask yourself, what makes Adobe Garamond less elegant, when set in 10pt than in 9pt for example. What disturbes you, is it too bold in your opinion, is it not "quiet" enough, etc.<br>
      You can check against with Sabon for example. Which is a bit more quiet, but still elegant and a tick more formal in apperance.</p>
      <p>Leading "auto" is quite okay at "normal" width of your textcolumn.<br>
      How many words appear in your textcolumn, Tschichold talks about 12 words maximum …<br>
      Increase the leading, does it look better, is it easier to read? Or reduce wordspacing, does it look better, when leading is set to 120% (auto)? </p>
      <p>Did you print the example textsettings with a good printer – the monitor often "lies"? You're talking about a magazine, in my opinion the typeface here has to set a bit larger than in a book, where the reader reads linear and normally with a reduced distance, if you compare it with the use of a magazine. But surely you can't say - 10pt or 12pt or whatever. </p>
      <p>greetings</p>
      <p>PS<br>
      Do you know DTL Documenta or TEFF Lexicon (both are expensive!)? Both are extremely legible and good looking faces. I'm not a big fan of AGaramond (surely i'm a minority here), if it comes to Garamond, i prefer, "the more rough" Stempel Garamond or as i mentioned, the more formal, Sabon – anyway.</p>
