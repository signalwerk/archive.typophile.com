      <p>I hear ya William, and I'm slowly coming around to the same conclusion. However, I'm not one of those designers who loves small type, because I don't and I think readability is the first priority here. My goal was to make it more "normal-sized" type. The way the magazine was set before I came on board was more on the amaturish side but that may not have had as much to do with the type size as I originally thought. I'm re-evaluating the margins, gutter widths, and yes of course leading and word spacing.</p>
      <p>I might be able to live at 10 point text for now, but I'll have to continue to tweak the other settings as well. I think my biggest problem with the whole scenario is everyone else's (at work, not here) closed-mindedness to hearing that there are other factors that affect readability besides type size.</p>
      <p>I think I can keep Bembo, which has slightly thinner lines than AGaramond, and will help me not have such bulky looking body copy. I will be looking at going to a different font eventually though.</p>
