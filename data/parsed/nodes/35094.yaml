      <p>we stipulate in our contracts that the client gets 3 rounds of changes. After that, they are on the clock. Makes compromise a lot less painful when you know that for every time you lower your standard, you ring the cash register. Of course there’s always a chance you’ll end up with something you’re happy with after all those rounds. In that case, the extra $$ is the icing on the cake. Not to sound crass, but we put the brakes on unlimited changes years ago - after rounds and rounds of seemingly endless revisions. The idea of ’what is finished’ could be a dissertation in itself. </p>
      <p>In terms of whether or not you can put it in your portfolio - we keep 2 portfolios like criminals keep 2 sets of books. You get the idea.</p>
