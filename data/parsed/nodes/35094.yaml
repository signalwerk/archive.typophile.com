    <p>I need advice: I am building a logotype/logomark for a new apparel company. I came up with a concept that basically uses the letters of the comapny name to build the shape of a womans torso [unfortunately my non-disclosure doesn’t allow me to post it here] The original rough nearly satisfied my creative and technical goals for the projects. The clients loved it, but after several revisions the clients still aren’t quite satisfied and continue to ask for changes that I believe stray from good design.<br>
    Any advice on steering them back to the side of sound design?</p>
    <p>Thanks very much,<br>
    cd</p>
