    html: |-
      <p>I have certain “rules” too, like Remy I usually put up to 3 revisions in the contract, after that I bill hourly. But I can be flexible depending on the job - if it’s something I’m proud of and want to be associated with  I’ll be more generous with my time and effort. But I’ll also be quite clear with the client if I feel it’s not moving in a good direction. And I have walked away from jobs where I have felt that either it’s being designed by committee (and the result is not good) or the client and I are not on the same page creatively and are not likely to agree on a solution. Or if the client just can’t articulate what he/she wants and I feel like we’re both spinning our wheels.</p>
      <p>Not everything I do ends up in my portfolio, but if it isn’t going to be a portfolio piece I better have gotten well compensated.</p>
      <p>I also look at the big picture - the easy, high-paying jobs help subsidize the more laborious ones. I’m way underpaid on a job I’m doing right now but it’s a real feather in my cap so I’m sucking up and putting in the extra hours (even cut my vacation short a day).</p>
      <p>I tend not to include work that wasn’t used in my portfolio. I don’t think unresolved jobs (which often require explanation) put your best foot forward. Ditto with spec work. But that’s just my opinion. As an art director, I was always interested in the portfolio pieces that were successful both from a design and a client point of view. Unless you’re a student of course.</p>
