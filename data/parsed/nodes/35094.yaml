      <p>Great that you and the client were able to work together on a successful solution, it’s best when everybody is happy. I’m having a similar issue right now - I know I’m giving my client good design options but for them nothing really “sings” and besides that there are three people I need to please, who don’t necessarily agree with each other. I have to find a solution this weekend that will “sing” for all three or else they have to move on and try someone else, which has rarely happened to me before. If that transpires, I will get paid for the work I put in, but I’m hoping to pull something out of my hat that will let me keep the job.</p>
