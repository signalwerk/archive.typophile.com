      <p>“Ahhh! Leave it out of the portfolio. pretend it never happened.”</p>
      <p>While one should always be proud of their work regardless of the profession, one also has to be a bit pragmatic at times. It is a service industry after all.</p>
      <p>If you have the status and clout as a fine French Chef, you can kick out that customer that insists on asking for Ketchup to go with their steak. Most places, however, will gladly hand the ketchup to the customer and drop of the bill when they’re finished.</p>
      <p>So, if you hit the point where the client just has to have their way, finish it for them, get paid, and then put the version of the logo YOU liked in your portfolio. ;o)</p>
      <p>Remy also has sound advice...never leave the ’revision’ stage open ended.</p>
