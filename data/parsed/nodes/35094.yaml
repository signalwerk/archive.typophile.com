      <p>If you do design work for hire, your current situation is—unfortunately—one that you will encounter all too often. If your artistic integrity is more important than paying the rent, you can simply tell your clients that their ideas are total crap, thank them very much, and walk out the door. If, on the other hand, you’ve put a lot of effort into the project and feel that you ought to be compensated for it, you have to give the people who sign the checks what they want, even if you do, in fact, think it’s total crap.</p>
      <p>In the former instance, you write off your losses and preserve your self-respect; in the latter instance, you collect your fee and leave that particular project out of your portfolio. Bummer...</p>
