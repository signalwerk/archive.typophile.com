    html: '<p>First of all: I can’t tell what font this is based on — there’s a lot of stuﬀ like this — so don’t worry about being kosher or halal or anything else. <br><br>I think your biggest problem is weight diﬀerences, like between the “K” and the “X”. This is not easy to ﬁx in an elegant manner — but you can fool with removing/adding pixels in “unexpected” places to make the glyphs more equal in weight. <br><br><span class="caps">BTW</span>, this thing is screaming to be in grayscale. <br><br>hhp <br></p>'
