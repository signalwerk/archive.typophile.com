    html: <p>Trixie, <br><br>I’m not nearly as practiced as many of the regulars on typohile in regards to the strict discipline of type design. I do, however, put a lot of time into developing pixel fonts. <br><br>The set you are developing is diﬃcult because of the serifs, in my opinion. The pixel grid at that size doesn’t leave you much room to experiment with. <br><br>I think the vertical and horizontal elements of the characters need to be more uniform. This may not turn out to be an exact replica of the font you are emulating. However, as a pixel font and not a postscript one, I think the set as a whole will be more elegant. <br><br>Perhaps all you need to do is make each character two pixels taller. Readjust your curves and diagonals, and then the serifs won’t make some characters look so much heavier than others. <br><br>Again, I’m not very comfortable advising others. This is just what I would try. If it doesn’t work, no harm&nbsp;done.</p>
    html_clean: <p>Trixie, <br><br>I’m not nearly as practiced as many of the regulars on typohile in regards to the strict discipline of type design. I do, however, put a lot of time into developing pixel fonts. <br><br>The set you are developing is diﬃcult because of the serifs, in my opinion. The pixel grid at that size doesn’t leave you much room to experiment with. <br><br>I think the vertical and horizontal elements of the characters need to be more uniform. This may not turn out to be an exact replica of the font you are emulating. However, as a pixel font and not a postscript one, I think the set as a whole will be more elegant. <br><br>Perhaps all you need to do is make each character two pixels taller. Readjust your curves and diagonals, and then the serifs won’t make some characters look so much heavier than others. <br><br>Again, I’m not very comfortable advising others. This is just what I would try. If it doesn’t work, no harm&nbsp;done.</p>
