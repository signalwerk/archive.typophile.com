    html: |-
      <p>I'm not sure how Supria would work typeset for regular document styles. I've never set it that way, and it wouldn't have come to my mind. You'll have to try it out. </p>
      <p>Note that Chris Sowersby recently issues Founders Grot Text, as the original Founders was found to work poorly at small sizes.</p>
      <p>National ( <a href="http://vllg.com/Klim/National#panel=about" title="http://vllg.com/Klim/National#panel=about">http://vllg.com/Klim/National#panel=about</a> ) is a great option that I have found to work well at regular and smaller sizes.</p>
      <p>You probably have specific requirements for the typesetting you are doing. Those requirements will help reduce your options!</p>
      <p>Cheers.</p>
