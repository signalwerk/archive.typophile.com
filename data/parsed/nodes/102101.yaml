    html: |-
      <p>It's good you're moving away from Folio: besides being boring it's not particularly readable (although it's much better than Helvetica).</p>
      <p>I don't think those fonts you mention are too fancy. One thing you should keep in mind is that "fancy" details don't pop out at small (read: text) sizes - they just blend into a -hopefully- pleasant texture.</p>
      <p>Also look at TypeTogether's library.</p>
      <p>hhp</p>
