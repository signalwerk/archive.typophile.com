    <p>hi everybody-  </p>
    <p>I'm not a big expert in font and in graphics but I love typography. I write a lot for my job (something similar to a lawyer) and until now I've used folio. I'm getting a little bored with it so i'm looking for something new.</p>
    <p>I really love grotesk and I've maybe found some replacement for folio: <a class="freelinking external" href="http://www.myfonts.com/fonts/hvdfonts/supria-sans/" rel="nofollow">supria sans</a>, <a class="freelinking external" href="http://klim.co.nz/retail-fonts/founders-grotesk/" rel="nofollow">klim's founders grotesk</a> and of course basic commercial. </p>
    <p>I like a lot these fonts but I'm afraid they seems too much fancy, polished and refined for the every-day writing. </p>
    <p>you agree? any "plain" grotesk to suggest?</p>
    <p>thanks.</p>
