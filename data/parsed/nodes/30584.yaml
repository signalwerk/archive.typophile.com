    <p>Hello,</p>
    <p>I was wondering whether the Romain de l'Empereur or its successor, Caractères de Charles X have been digitalised. What if, based on a book typeset in one of those (or the IMprimerie Nationale book of samples), someone recreated the fonts? What kind of copyright issue would there be? Could they be released for free or commercially under those names? </p>
    <p>I hear someone did that with the Romain du Roi, though! If anyone knows more about this, let me know.</p>
    <p>D.</p>
