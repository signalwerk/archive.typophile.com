      <p>I put everything I know about the <em>romain du roi</em> in a single massive post, which must be such a breach of every kind of online etiquette that I thought I would shut up for a while.</p>
      <p>Somewhere in there you will find my suggestion that the <em>Romain de l'Empereur</em> aka <em>Didot millimétrique</em>, of which a full character set appears in the 1990 Imp nat specimen book, may be somewhere behind the heading font that appears in Le Typographe – <a href="http://www.typographe.com/" title="http://www.typographe.com/">http://www.typographe.com/</a> I don't think that anyone has yet digitized the type Marcellin Legrand / Charles X.</p>
