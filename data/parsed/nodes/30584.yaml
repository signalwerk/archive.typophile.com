      <p>Thank you very much for the reply but you got confused by my late reference to the Romain du Roi, which I don't really care for: it's a garalde, and I am interested in the Romain de l'Empereur which is a Dido(t/ne). It was later redrawn as Caractères de Charles X.</p>
      <p>Another issue for which I have not found any reference is: what are the rules pertaining to copyright that would prevent me to digitise an old font found in a specimen book.</p>
