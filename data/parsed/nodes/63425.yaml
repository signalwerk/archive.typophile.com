      <p>I would recommend that you turn your approach around. You'll probably learn much more about type if you take any one typeface (say the already mentioned Myriad), and go through a mental checklist: If I were the designer, would I use this for: newspaper text? book of poetry? box of chocolates? box of computer software? a vegetarian restaurant menu? a wedding invitation?</p>
      <p>After a while you should be able to reverse the process fairly easily. It is then that you'll find your toolbox.</p>
