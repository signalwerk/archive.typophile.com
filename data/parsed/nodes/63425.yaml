      <p>Boy, I thought I _was_ offering constructive advice.</p>
      <p>I guess what I was trying to get at in my last response is that there really isn't an answer to your question. A lot of feelings just can't be evoked simply by choosing a font. Now, you can find a lot of gimmicky fonts  that you might be able to use for very specific things (a perfect example would be the font Ouch, from Adobe <a href="http://new.myfonts.com/fonts/adobe/ouch/">http://new.myfonts.com/fonts/adobe/ouch/</a>), but things like that have very specific uses and aren't the kind of things that that a good, functional collection is built on.</p>
      <p>Your latest post says you're "looking to build a toolbox of well-designed typefaces." To me, that's much different than asking for fonts that evoke specific feelings. It's also a much easier question to answer (although you'll give widely varying opinions).</p>
      <p>The fonts that come with the Adobe Creative Suite are an excellent place to start. If you're going to be a designer, I think it's safe to assume you'll be using the suite. You get a bunch of classic and well-designed serifs (Adobe Garamond, Minion, Caslon, Arno, Janson), a nice slab serif (Chaparall), a very nice, flexible (and popular) sans serif (Myriad Pro), as well as a bunch of display faces.</p>
      <p>You could probably do 90% of your work with just those.</p>
      <p>You should probably add some classic sans serifs to your collection (Helvetica Neue or Univers, and maybe Futura), and some slab serifs (something along the lines of Rockwell or Stymie). Then maybe some more modern stuff (Meta, Antenna, oand Scala, of the top of my head).</p>
      <p>Jonathan</p>
