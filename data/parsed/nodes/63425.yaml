    html: |-
      <p>Thanks to those that offered help. I appreciate it. </p>
      <p>For my kitchen that has warm bold colors, hardwood floor and stainless steel appliances, I chose Rockwell Regular. I chose Rockwell because the serifs give it a friendly, warm feel. But because they are slab serifs with sharp corners, it also echoes a clean space and is reflective of the stainless steel. </p>
      <p>I also had to choose a font that was opposite of that. I went with Helvetica Narrow, which to me felt clean and more contemporary. While I like to think my kitchen is clean, I do think my kitchen has a warmer, friendlier quality better represented by Rockwell.</p>
      <p>The other space I chose is my commute on the El in Chicago. It's cramped, stressful, anxious, busy, etc. The typeface I chose for this is Univers 47 Light Condensed Oblique with a little tighter kerning. I chose this because the type itself felt cramped because its condensed and with tight kerning. The light weight makes it feel insignificant, perhaps one of many, like on the train. The oblique give the type movement, much like the commotion on the train.</p>
      <p>The opposite for the train is Baskerville Old Face which feels warm and friendly and settled. Perhaps on a random Sunday morning in the fall during a week that didn't happen to have construction, the train might feel like this. But certainly never my rush hour M-F commute.</p>
      <p>I'm open to friendly criticism of my choices. Thanks all!</p>
    html_clean: |-
