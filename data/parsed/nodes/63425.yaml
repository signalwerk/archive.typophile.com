      <p>Things make a lot more sense now. So for the kitchen example, there are a lot of feelings that it could evoke, but I'd look for one overall feeling, since the assignment forces you to make your point simply. You mentioned wood floors, rustic colors, healthy food, and "we" (family? friends? either way, I assume it's people you like being around). That stuff all points me towards a pretty specific overall feeling.</p>
      <p>Since you're looking for tools, rather than specific answers, here's some things to look into (I'm not saying you should pick these, but look into them and see why they might or might NOT be appropriate choices). This is all off the top of my head. I'm sure others here can provide much better examples.</p>
      <p>Geometric Sans Serifs: look at Futura and Avant Garde. They're very geometric, modern, and mechanical. Stainless steel appliance are all those things, but is that what the kitchen as a whole says to you?</p>
      <p>Humanist Sans Serifs: check out how the strokes in Myriad vary, and how the capital O has a barely perceptible slant to it, as if it were maybe based on handwriting. Look into other humainst sans serifs and see how they can blend a modern look with a human feeling.</p>
      <p>Slab Serifs: something like Rockwell is pretty geometric. Chapparal has (like Myriad) a slight handwriting feel to it</p>
      <p>Scripts: there are formal ones, and ones that looking more like handwriting. Snell and Shelly are lovely, but very formal (maybe even slightly stiff?). Something Buffet Script (<a href="http://www.sudtipos.com/fonts/27">http://www.sudtipos.com/fonts/27</a>) is much looser and friendlier.</p>
      <p>Hopefully, that gives you some stuff to look into without giving any obvious answers.</p>
      <p>Also, if you don't want your teacher to think you're lazy, no matter how much time you spend on this, don't pick Papyrus.</p>
