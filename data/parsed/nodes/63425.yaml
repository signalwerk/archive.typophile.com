      <p>Something like "happy" could be expressed with numerous casual scripty typefaces (check out some of Rob Leuschke's stuff<br><a href="http://new.myfonts.com/newsletters/cc/200910.html">http://new.myfonts.com/newsletters/cc/200910.html</a>).</p>
      <p>But I think some of the emotions you're trying to match with fonts may be impossible (I don't think there are any fonts that say "I'm hungry"). In general, I don't think there are going to be a lot of fonts that really evoke the feelings you've listed. So much of this stuff depends on context. In he hands of a good designer, one font could evoke numerous feelings depending on how it's used and what surrounds it.</p>
      <p>What might be a useful exercise would be to do some fake projects and post them in the Critiques section to see if they evoke the feeling you're going after.</p>
