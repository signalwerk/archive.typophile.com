    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 4.May.2009 2.57pm </div>
      <p>For Immediate Release<br>
    Buffalo, NY- May 4th, 2009</p>
    <p></p><div class="imageWrap"><img src="/files/FestivaFlag_5705.gif"></div><p></p>
    <p>P22 and the International House of Fonts proudly announce Festiva- the<br>
    latest font designed by Terry Wudenbachs for the IHOF Collection.</p>
    <p>P22 Festiva is based on lettering found on a 1960s kitchen appliance<br>
    catalog. It evokes 1960s TV and pop culture while still having a<br>
    contemporary feel. The fun exuberant flavor of this face is perfect for<br>
    parties and celebrations. The letters dance across the baseline and the<br>
    lower case wants to be an upper case but just can’t quite make it. P22<br>
    Festiva Regular includes a full unicode European Character set (Western,<br>
    CE, Turkish, Romanian etc).</p>
    <p>Introductory offer through May.</p>
    <p><a href="http://p22.com/ihof/festiva.html" title="http://p22.com/ihof/festiva.html">http://p22.com/ihof/festiva.html</a></p>
