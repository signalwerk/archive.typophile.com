    <p>One of my good friends is in Orlando this weekend for the opening of The Wizarding World of Harry Potter at Universal Islands of Adventure. I was flipping through her photos, when I saw this:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/28204_1486185117068_1307109917_31331518_12137_n_5876.jpg"></div><p></p>
    <p>Now, I know that the wizards have previously established themselves to not be great graphic designers (see <a class="freelinking external" href="http://www.typophile.com/node/47828" rel="nofollow">this thread</a>), so I can excuse the mismatched alignments in the fares table. But you would think that without access to digital technology the wizarding world would provide some sanctuary from that oh-so-ubiquitous Arial. But no, even in the wizarding world it appears that Arial manages to make its presence felt.</p>
