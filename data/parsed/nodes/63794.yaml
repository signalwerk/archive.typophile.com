    html: |-
      <p>Thanks SII. Very helpful =P</p>
      <p>Do you mean this?</p>
      <p>c. Font Components. While the software is running, you may use its fonts to display and print content.<br>
      You may only<br>
      • embed fonts in content as permitted by the embedding restrictions in the fonts; and<br>
      • temporarily download them to a printer or other output device to help print content.</p>
      <p>So the answer to my question would be that the license in this instance does not extend to, for instance, creating a logo or originating any design work in a commercial environment using Calibri?</p>
      <p>Fonts installed through the installation of Microsoft Office are not available to Adobe Illustrator/PhotoShop for instance?</p>
      <p>Am I over complicating things?</p>
