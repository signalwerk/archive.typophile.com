    html: |-
      <p>Yes, that's the bit. It doesn't really speak to the creation of logos - however we've never had a problem with people making outlined logos using the fonts. It's such a fringe activity for 99.9999999% of our users that it's not called out in the license.</p>
      <p>Office fonts are installed as system wide resources so can be used in the Adobe apps you mention.  which doesn't make a lot of sense. </p>
      <p>Typically we see graphic designers, especially those on the Mac picking up end user licenses for fonts like Calibri from Ascender, just to stay safe, and have licenses that are more like typical font EULAs.</p>
