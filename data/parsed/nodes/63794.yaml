    <p>We've been sanitising and extending our current font library and we've come across a licensing question I'm finding difficult to answer.</p>
    <p>When it comes to publishing websites, printed work and commercial design projects in general, are there limitations on using the fonts that are included with the OS (Windows, OS X) and/or with software? (Adobe CS, Microsoft Office, etc.)</p>
    <p>Bottom line, can I use them as freely as I would any font licensed directly from the foundry?</p>
    <p>Thanks for your help.</p>
