    html: |-
      <p>I'm no expert, but it seems interesting how (1) they didn't try to make the 2 scripts equal in apparent size, but matched the length of the text instead / made the text flow in parallel; and (2) that the 2 scripts aren't in separate blocks but interwoven. The Latin seems kind of like a subtitle to the Chinese. :)<br>
      Also, the visual hierarchy is clear: The Chinese is what leads. I wonder if the letterspacing in the Latin, while certainly ugly taken by itself, isn't basically the Latin following/echoing an aspect of the æsthetic of the Chinese text.</p>
