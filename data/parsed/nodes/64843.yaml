      <p><cite>The style, including the palette, is Socialist Realism. It will pass.</cite></p>
      <p>Wait, are you including the colour scheme of gold and white on bright red in that statement? It's very much a Chinese aesthetic as I understand it, quite independent of any Socialist Realism associations.</p>
      <p>Before Chinese began to be written horizontally in imitation of Western scripts, if you found a single horizontal line of Chinese of only a few characters in length (to fit on a horizontally-oriented sign, for example), it would likely be read right to left. This is an analogue of setting a few letters vertically in Latin</p>
      <p>L<br>
      I<br>
      K<br>
