      <p>Some of the special features for setting Japanese are explained in English in the documentation for <a href="http://help.adobe.com/en_US/Illustrator/14.0/WS714a382cdf7d304e7e07d0100196cbc5f-637fa.html" rel="nofollow">Adobe Illustrator</a>.  A subset are available in non-CJK versions of InDesign via templates downloadable from <a href="http://www.transpacificdigital.com/downloads/index.html" rel="nofollow">TransPacific</a>.  As yet, no <em>ruby/furigana</em> -- small type above one or more characters intended to show pronunciation; for that you need CJK versions of InDesign, though regular MSWord, Open Office Writer, and FrameMaker(!) can all handle <em>furigana</em> (when I last checked--years ago--FrameMaker needed a Japanese operating system for this to work).  Some of these tricks can be useful for laying out alphabetic text in unusual ways.</p>
      <p>David</p>
