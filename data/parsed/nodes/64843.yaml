    html: |-
      <p>1. Political. In China of course the Chinese goes above the English. Separate messages would look nicer, but that ain't gonna happen. The Chinese look is designed first, then English is added in the least obtrusive manner.</p>
      <p>2. Size: A given passage in modern Chinese will have about the same character count as the word count of its English translation (and vice versa). If you set them both at the same point size &amp; line height, the Chinese will take approximately 1/3 - 1/4 of the physical space taken by the English text. </p>
      <p>3. Colors. All I can say here is that red and yellow are old favorites...</p>
      <p>4. At least they got someone to proofread the English and at least it wasn't just the pinyin (there used to be [is still?] a tradition of faux internationalization by adding pinyin to signs and book covers)</p>
      <p>5. Fortunately the Chinese haven't yet discovered the drop shadow. </p>
      <p>6. If you look closely, you can see that it was actually done in Futura...</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/signage2_5401.jpg"></div><p></p>
