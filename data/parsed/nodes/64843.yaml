      <p>Back in the early 1970s, Columbia offered an advanced (4th-year?) course in Chinese devoted to learning to read newspapers (I took classical instead).  Headlines were a challenge as they seemed to run any way but bottom-to-top, and the text often used a dense argot.  For Chinese, modern or ancient, context is crucial.</p>
      <p>The modernist aspect of the "gothic" type is part of political sub-text, reinforced by the (smaller) sanserif translation.  But there's whole lot more to China.  Mao's calligraphy used to appear frequently, notably in the phrase 为人民服务 （"serve the people") plastered everywhere in the late 70s, when the effects of the Cultural Revolution were still strongly felt.  Many of the simplified characters -- three of the five just quoted -- are in fact traditional short-hand forms widely used in hand-writing, a lot of the reason simplified chars. can seem garish in print.  Computers now make it vastly easier to type Chinese, but the resolution of small screens -- I think the Chinese passed a billion text messages a day -- means traditional forms blob over.</p>
