      <p>Robert Slimbach's theory on that was about the same when he promoted it to me some eight or nine years ago.</p>
      <p>I was stubborn, however, and had pretty severe misgivings about varying the cap height across weights in Hypatia Sans. In the end I kept the cap height consistent across weights. I'm willing to believe that could have been a mistake, though I guess it is reassuring to see that it is still a contentious question!</p>
      <p>On the side, those single-unit variations in stroke widths may be the result of interpolation in multiple master space.</p>
