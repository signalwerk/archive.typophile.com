      <p>Uli,<br>
      As everybody said, this is completely normal for optical compensation.</p>
      <p>It's also a side-effect of interpolating from only 2 masters (Regular and Black).<br>
      In bigger families, people usually use 3 masters (Thin, Regular and Black) so there is no difference in x-height, Ascender, etc. from the Thin to the Regular. But then again, they slowly increase from the Regular as it reach the Black weight.</p>
      <p>Ideally, the vertical metrics will remain unchanged in the middle weights, and will only increase/decrease as they reach the thinnest and blackest extremes. But using lots and lots of masters for interpolation is not very practical, as each master increase the complexity and the chance of inconsistencies.</p>
