    html: "<p>The vertical proportions are based on Robert Slimbach’s guidance to me according to his ever-evolving theories of reading optics. The basic premise is that capital letters and letters with extenders appear larger the heavier their weight is. The differences you noted are subtle enough to be noticed in print and to my eyes, Robert’s guidance proves true: the various weights do seem better suited to each other than if they were consistent across the range of weights. In proofs that kept ascenders and descenders consistent with the regular weight, the extenders seemed a bit cramped in the ExtraLight weight and a bit long in the Black master. In low-resolution settings these small deviations are not present thanks to hinting instructions that keeps vertical dimension parameters consistent across a range of weights.</p>"
