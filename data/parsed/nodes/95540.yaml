    <p>Since the main thread <strong>"Source Sans Pro: Adobe’s first open source type family"</strong></p>
    <p>see <a href="http://typophile.com/node/95280" title="http://typophile.com/node/95280">http://typophile.com/node/95280</a></p>
    <p>deals only with licensing matters and not with the font itself, I open here a new thread to draw the attention to strange technical peculiarities of this new font.</p>
    <p>When I heard of this font here at Typophile, I download it and made a lot of printouts for testing purposes. At first I thought: Wow, a great new sanserif font, and available for free at that. </p>
    <p>But when I studied all the printouts made on my  laser printer in more detail, I came to the conclusion that all the weights of this font family must have been generated automatically or mechanically in a faulty way with the detrimetal consequence that all the caps heights and x-heights and ascender heights are different in different weights.</p>
    <p>When you open a professional font, e.g. Adobe's Myriad font, with a font editor, you will find that the caps heights of all weights are identical. For instance, the uppercase "U" of Myriad OpenType has a caps height of 674 units as regular weight and as semibold weight and as bold weight and as black weight, that is, all the caps heights of the same letters are identical in different weights. That is what you expect from a professional font, otherwise the letters in a line of text would not align properly.</p>
    <p>However, if you open the new font Source Sans Pro with a font editor, you will find that the caps heights and the x-heights of all weights are entirely different with the consequence the letters in a line of text do not align properly.</p>
    <p>Have a look at the picture <strong>vertical.jpg</strong> attached below. What you see in this picture is the capital "I" of Source Sans Pro in roman, semibold, bold, and black (from left to right).</p>
    <p>The vertical dimensions of the capital "I" are as follows:</p>
    <p>Roman: 656 units<br>
    Semibold: 654 units<br>
    Bold: 652 units<br>
    Black: 650 units</p>
    <p>The bizarre logic for uppercase letters seems to be this:</p>
    <p><strong>The blacker the uppercase letter, the smaller the vertical dimension.</strong></p>
    <p>Now, if you measure the vertical dimensions of the lowercase "u", you will find these dimensions:</p>
    <p>Roman: 486 units<br>
    Semibold: 491 units<br>
    Bold: 496 units<br>
    Black: 500 units</p>
    <p>The bizarre logic for lowercase letters seems to be this:</p>
    <p><strong>The blacker the lowercase letter, the larger the vertical dimension.</strong></p>
    <p>What is your opinion?</p>
