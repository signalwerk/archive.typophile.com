      <p>The second of these findings does not surprise me at all: it is quite common for the bolder weights of a type to have a slightly taller x-height than the lighter weights, as this allows compensation for horizontal reduction of interior counter space and makes the design of complex shapes such as the lowercase a easier. Similarly, the x-height of lowercase italic letters are often shorter than those of their roman companions in order to provide optical correction for the longer diagonal stems, which can appear taller than identical height straight stems.</p>
      <p>The variation in the height of caps is surprising though.</p>
    html_clean: |-
