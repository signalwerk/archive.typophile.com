    html: "<p>Wow-wee! Thanks for all the super+ feedback! I'll answer <br>a few questions first: <br> <br>The images are indeed stock, from the Pepin Press book <br>called \"Signs &amp; Symbols.\" I didn't reply for so long because <br>I was awaitng confirmation on whether I could legally use <br>the images. As it turns out, I can. However, it was always  <br>my intention to modify them.  <br> <br>I agree about the paw holding <br>the torch, it looked off from the beginning. I love all the  <br>suggestions about ebossing, foil stamping etc. When I get <br>the squids together I shall investigate this seriously. At the <br>moment, I will have to gang up on another print job, which <br>is one colour, a black purple. See the attached image for  <br>colour and new filigree. The rest of the type is Jenson Pro, <br>which I found tucked away inside Indy CS. Is it too much? <br> <br>As for the dragonbirdthing, I have been playing with the <br>idea of paying a subtle homage to our native bird, the <br>Kiwi. It is a flightless endangered beauty and the de <br>facto icon for New Zealand, pretty much why we get  <br>called kiwi's. So here it is on my logotype. Does it work <br>any better? I am in the middle of vectorising the thing. <br>Quite tricky. The split-stroke type is my own. Hopefully <br>released one day as well. Thanks for all the feedback. <br> <br>Regards, kris. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/34966.gif\" alt=\"\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/34967.gif\" alt=\"\"></p>"
