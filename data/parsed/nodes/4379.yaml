    html: <p>The holy trinity of black-red-and white jst seems like too easy of a solution to me. I think that there is too much associated with that combination, especially amoung designers (who would be your target audience as a seller of type, no?). <br> <br>The colors, with the beautiful intricate forms of your drawings/letters, just cry out "goth" to me. Not that there is anything wrong with that, mind you. It just seems that you will be more likely to speaking to a different audience. <br> <br>Its always hard for me to settle on the right color combinations, so I really can't offer any great advice. A professor of mine once told me that all the color combinations that we need can be found in nature. Another told me once to work with three colors, two of which should be close to each other in hue and value, and then the third could be a compliment or a split-compliment.</p>
