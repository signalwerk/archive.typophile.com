    html: <p>The design is gorgeous, but will all of those little filigrees survive at actual business card size? <br> <br>This would make an incredible poster for sure. <br> <br>When I looked at the reds, they looked like a gradation from a dark blood red, to a more vibrant red. I assume this is an optical illusion, but I like the effect, regardless. <br> <br>I'd also recommend trying some variations, such as a striking sky blue, or a rich, mossy green with the same value as the red. The red/black/white combination is one of my favorites too, but I could see a 'goth' interpretation of what you currently have (even though I didn't take it that way). Perhaps a nice, rich rust color would give a wrought-iron feel to the scroll-work. Could be nice.</p>
