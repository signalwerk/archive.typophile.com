    html: <p>kris your work is very elegant. As for the colours i would recommend to make the combination it suits you best and don't get confused with afterthoughts like "will it communicate with everybody?", since your work and taste already is not concerning "everybody".  <br> <br>Personaly i prefer the black-red-white variation mainly for the reason that the "KLIM" is not messing with the pattern (as i think it happens in the last two variations). <br> <br>Also i think you sould "liberate" the "Type &amp; Graphic Design" and "Mobile..." lines from the block. The compination with the leaves doesn't work as it does with the "KLIM". Further i believe you should avoid the "stop" of the block that puts a "wall" in front of the leaves. I would advise you to put the lines in an order that follows the rythm of the leaves as the typography is not foreign to the nature but it is inspired from it. <br> <br>thanx for the nice design and hope that the dotted line around the card it is not the croping line and it will be print. <br> <br>christos</p>
