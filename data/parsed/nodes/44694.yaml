      <p>I agree that it's not in my Guide, and I checked the several Dover books I have with type like this and didn't see a match. That included the Solotype Catalog. It resembles Neon that someone re-drew as a Prisma-style font. I thought someone once described a way to fake this look in Illustrator with some sort of outline/offset technique, but I have no other ideas, other than check freebies at Dafont.</p>
      <p>- Mike Yanega</p>
