    html: <p>There are also numerous threads on typophile that get into this question. I suggest you search for them; read them. After that you may have a more specific question or questions that you want to ask. Right now your question is pretty broad. It’s hard to know where to start. What Chris was getting at - that the conetxt of use is crucial to defining what to do is bang on. You might want to decide a bit more about how you think the face would be used &amp; at what size and actually try it out in that way - before you start adjusting.</p>
