    html: "<p>One tidbit: Look at Gill Sans Extra Bold, and Gill Sans Display Extra Bold. Note the awkwardness of the counters of the “text” version, when enlarged. The huge variation of stroke weights in Gill Extra bold are there to provide adequate legibility at small sizes. That’s something you don’t do in a display face. Look at other robust text faces (Serif too), for more things like this. This is just an extreme example of optical compensation for legibility.</p>"
