    <p>I’ve been reading and searching a lot on how to optimize the inner- and counter forms in a font for legibility. I found some material, but this is mostly an explaination of the matter and not an explaination of <strong>hów it works</strong>.<br>
    What I would like to know are the ’does-and-dont’s’, the ’never-worked-for-me’s’, the ’my-tip-is-better’ and the ’look-at-this’.<br>
    I do what I can and feel that optimizing the inner closed forms for itself helps a great deal in the balance of the font. But I never corrected my curves for enhancing legibility. So it’s hard for me to judge from my own fonts if the are display or text fonts. Perhaps most of them are a bit of both.<br>
    I’m currently working on my newest font called ’Reethi Rah’ and this should be a text font. I would like to start in the right way with my proportions and not correct this when it’s almost ready. </p>
    <p>Is there anyone that optimizes his fonts this way and could shed some light on the practical details? </p>
    <p>Thanx,<br>
    ®ené</p>
