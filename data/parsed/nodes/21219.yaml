      <p>Rene,<br>
      That is a tough one to quantify into a procedure.  There are differing opinions on what constitutes legibility and different solutions. I don’t think in the end that there is a recipe agreed upon. It is hard work trying then testing then changing then testing again. The size also matters. A type ballanced for 10pt has different needs than one ballanced for 14pt.  My not-very-helpful suggestion is that you just have to fight with it long enough to train yourself to see differences and tinker to make it work.</p>
      <p>ChrisL</p>
