      <p>I’d say it is worth a detour. Parma is a small city, it is not too touristic and very beautiful–like most of the medieval north italian cities. </p>
      <p>The museum is situated in the ducal palace which is dominating the center. You can still feel the atmosphere of the times when Bodoni was working there as the king of typographers. Bodoni’s elegant books, his tools, punches and characters together with the exhibition regarding the history of the book is worth a visit.</p>
      <p>The museum is open in the morning from 9 am to 1 pm, but you should make an appointment!!!! Tel. 00390521/220411, Fax 00390521/235662, E-mail:mubodoni@unipr.it Maybe someone who speaks english can show you around (some of the students who are working at the library in the palace?</p>
