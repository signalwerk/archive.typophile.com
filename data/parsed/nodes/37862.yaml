    <p>My wife and I are planning our belated honeymoon, and the current plan is for Florence, via Rome, in early January. Ideally I’d like to drag her to as many typographic points of interest as possible during this trip. </p>
    <p>There’s already a lot of info here on what’s available in Rome and Florence, but I’ve also got my eye on the Bodoni Museum in Parma. Looking at the maps, it would seem possible to get to Parma from Florence by rail, but I’m going to assume it will take a bunch of money and time. My question is, to any who have visited this museum, is it worth the trip? Thanks-</p>
