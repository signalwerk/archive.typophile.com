    <p><em>On 24 May, Russia, Bulgaria, Macedonia, and other countries that follow Eastern Ortodox tradition, celebrate <a class="freelinking external" href="http://en.wikipedia.org/wiki/Saints_Cyril_and_Methodius" rel="nofollow">Saints Cyril and Methodius day</a>. This day also commemorates the invention of the Glagolitic and Cyrillicalphabets.</em></p>
    <p><em>In the ninth century, Glagolitic was invented by two brothers known as the “Apostles of the Slavs” to translate Christian texts into the language of the Great Moravia region. Later on, in the 9–10th century, one of their disciples who moved to Bulgaria invented the Cyrillic alphabet as a derivative of the Glagolitic and Greek alphabets.</em></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/cyrillic_celebrations_discount_4290.png"></div><p></p>
    <p>Rosetta type foundry is based today where Great Moravia used to be. We wish to celebrate the Cyrillic alphabet day with the two following announcements.</p>
    <p><strong>30 % discount</strong></p>
    <p>For the next few days we offer a 30 % discount on all our Cyrillic and Pan-European fonts (i.e. Skolar and Maiola). Use the code <strong>457c59a7</strong> during the checkout process. The offer ends on 29 May 2011, at 17:29 CET.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/cyrillic_celebrations_2011_Neacademia_3489.jpg"></div><p></p>
    <p><strong>Neacademia sneak peak</strong></p>
    <p>We are proud to preview our new type family, Neacademia by Sergei Egorov. This excellent Latin and Cyrillic type family is a contemporary interpretation of the Aldine types from 15th century. Neacademia already proved its qualities in the <a class="freelinking external" href="http://www.paratype.com/k2009/" rel="nofollow">Modern Cyrillic 2009</a> competition. The initial release of Text versions of regular and italic this June will be followed by a series of optical sizes (expected release in early 2012). <a class="freelinking external" href="http://www.rosettatype.com/index.php?action=portal/viewContent&amp;cntId_content=2927" rel="nofollow">Read more »</a></p>
