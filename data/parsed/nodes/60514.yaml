      <p>Eric, I think you're right that it's a faux-stencil. Judging from some of the other samples you posted these guys seem to go for antique/obscure fonts and then cobble them up. Both k's in this sample seem clumsily altered. </p>
      <p>When I think about these letters, it looks like the lower case letters are a monotone serif (either italic or slanted Roman -- that 'a' style is not a script 'a', and most of the time it's not even an italic one), and the A and S may be from script fonts. The A sort of resembles <a class="freelinking external" href="http://new.myfonts.com/search/bellevue%C2%AE/fonts/" rel="nofollow">Bellevue</a> in having the straight right stroke with the arched left curve. I don't know what to say about that S. Really.</p>
      <p>I'll try to think about an italic serif that might resemble these lower case letters.</p>
      <p>- Mike Yanega</p>
