      <p>Thank you, Mike. Your hard work on this series of IDs is greatly appreciated.</p>
      <p>Ya, now that I look at it, the cobbled parts do stick out a little more. But I think the sloppiness gives it an appealing organic/signish/graf look. And when holding the actual tag, the cobbled parts aren't as noticeable as when it is scanned and placed in 2D.</p>
      <p>I will also give this ID a shot myself.</p>
