      watching the dark liquid become animated – so unlike the<br>
      ballpoint pens and markers I was used to. I was entranced.<br>
      Not long after that, I bought my first calligraphy set and<br>
      my goal that summer was to spend one hour each day<br>
      practicing. </p>
      <p>My life since then has included long periods where I put<br>
      calligraphy aside, in favor of my work - design and<br>
      typography, but something keeps pulling me back to<br>
      calligraphy. The magazine "Letter Arts Review has been<br>
      inspirational and key to my picking up the pen again, many<br>
      times. Over the years I have watched calligraphy grow and<br>
      evolve on it's pages. Also, when I was younger, I knew I<br>
      would do more calligraphy when I was older – what a<br>
      surprise!, I'm older now! :)</p>
      <p>***</p>
      <p>Best,<br>
      AS</p>
