    html: <p>What about them, ellipsis...  You are what you eat, right? Then forget McDo. Great minds comes from  ... well, you guessed it. Large tempests that grow in the south seas, make their way slowly to the great white north, but not before leaving most of the useless particles behind them. What is left is of great advantage to the people of Canada, since type designers will benefit from what grows from the land. It is fair to say that it has to be a gift from the heavens. In the summer, (yes, there is summer over there) the country that is known to have igloos for shelter instead of houses as most south bordeans that could not pinpoint it on a globe are lead to believe, those icy blocks have a tendency to get a little softy, but winter wise are as hard as rock, just like metal typefaces. So then, creativity that comes from the land of the ice cubes is apparently a natural gift, enough to make jealousy grow in the world around them. PERIOD.</p>
