      I stumbled on this (possibly following a link someone posted here) <a href="http://www.porchez.com/ateliertypo/?c=atelier+uqam" title="http://www.porchez.com/ateliertypo/?c=atelier+uqam">http://www.porchez.com/ateliertypo/?c=atelier+uqam</a><br>
      and was stunned. I didn't know such things existed at UQAM. (Perhaps because I've had my head stuck in Concordia for too long... hmm. I wonder if ConU does stuff like this, too?)</p>
      <p>As for winters, you Islanders, I'll post pictures of Montreal's massive snow banks and the fun I have parking my car (or shovelling it out) every morning... but it's better than 6 months of rain any day. You know You're in Montreal when the inside of your nose freezes and sticks together.</p>
      <p>Kristina</p>
