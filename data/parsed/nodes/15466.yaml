    html: <p>I don't know about the water, but I do know that the Belgian Luc Devroye who teaches at McGill University in Montreal, and to whom I look frequently for links to many many type sites as well as commentary, has probably inspired a few to become type designers, type geeks, whatever. Luc is at <a href="http://jeff.cs.mcgill.ca/~luc/fonts.html" title="http://jeff.cs.mcgill.ca/~luc/fonts.html">http://jeff.cs.mcgill.ca/~luc/fonts.html</a></p>
