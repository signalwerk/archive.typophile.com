    <p>There must be something in the water in Canada.  It seems there are far more people involved in type design who are from  Canada than the size of their population would support. Maybe long winters make people glyph skilled? Other than the Netherlands, I can't think of a single country with more type centrics per capita.<br>
    I wonder if all Canadians on Typophile would tell us what they think is common to their life that brings out the talent and inclination to pursue design type? Whatever the reason, I am glad it happens :-)</p>
    <p>ChrisL</p>
