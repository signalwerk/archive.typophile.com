      <p>Hello Chris Lozos, thanks.</p>
      <p>Yeah, I'm after a period, I moved to Turkey.<br>
      I will copy a piece of the interview.</p>
      <p>***</p>
      <p>I live in a place that is green and wild: rural Vancouver<br>
      Island, British Columbia, Canada. It is one of those<br>
      places where civilization is just touching wilderness, so<br>
      my home is surrounded by tall cedar and hemlock forests,<br>
      rocks, mosses and wildlife. My house is small, with a<br>
      large natural garden frequented by various types of<br>
      animals - but ruled by my dog and cat!</p>
      <p>Despite its remote location, Vancouver Island is rich with<br>
      art and culture. The First Nations in this area have a rich<br>
      artistic heritage, and there are many totems and carvings.</p>
      <p>I am a graphic designer at Suburbia Advertising in<br>
      Victoria, BC, a small, upscale advertising agency<br>
      employing fourteen people, and specializing in retail<br>
      advertising. My background includes seven years of working<br>
      at larger international ad agencies in Toronto, Canada. Not<br>
      surprisingly, I love working with type!</p>
      <p>Like many kids, I doodled on my schoolbooks, and even<br>
      though drawing was one of my favorite pastimes, I always<br>
      doodled letters rather than drawings, on my books. (Alex,<br>
      do you know what doodling is?! Strange word, no?)</p>
      <p>I remember clearly the moment I first encountered 'real'<br>
      ink… I was probably about thirteen, sitting at my brothers<br>
      drafting table. He had an ink pen meant for sketching, and<br>
      I picked it up and started drawing letters. I remember<br>
      watching the dark liquid become animated – so unlike the<br>
      ballpoint pens and markers I was used to. I was entranced.<br>
      Not long after that, I bought my first calligraphy set and<br>
      my goal that summer was to spend one hour each day<br>
      practicing. </p>
      <p>My life since then has included long periods where I put<br>
      calligraphy aside, in favor of my work - design and<br>
      typography, but something keeps pulling me back to<br>
      calligraphy. The magazine "Letter Arts Review has been<br>
      inspirational and key to my picking up the pen again, many<br>
      times. Over the years I have watched calligraphy grow and<br>
      evolve on it's pages. Also, when I was younger, I knew I<br>
      would do more calligraphy when I was older – what a<br>
      surprise!, I'm older now! :)</p>
      <p>***</p>
      <p>Best,<br>
      AS</p>
