      <p>What is it about Canadians, period.</p>
      <p>We ask the same question about Americans.</p>
      <p>The Canadian Government doesn't treat the water with flourides, but with glyphlets, and the fronts that control the weather here originate in Hattem, The Netherlands. Our bullets are typographic, and our pentagons are used to structure page geometry. The frost on the windowpanes here crystallizes according to a bezier logic, but if it is really cold the serifs snap off.</p>
