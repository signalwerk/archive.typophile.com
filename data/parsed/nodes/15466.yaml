      <p>I'd like to think it has something to do with a certain embarrassment in watching George Bush make our neighbours to the south look really, really bad; and by that I mean that his (and, by unfortunate proxy, their) seemingly imperative need to draw as much attention as possible; and by that I mean that up here there is a century-long drive to define Canadian as not-American and thus, maybe, there is a desire to be less conspicuous; and by that I mean that we either fool or berate ourselves into thinking that by being less conspicuous we're more humble, more restrained, more 'dignified,' and all of these, I think, are key characteristics of decent typography. We also tend to see isolation and lack of recognition as romantic, which also fits well. If the goal of good typography is to be understated, Canada's a great place to do it from.</p>
      <p>(The fact that I've been hesitating to hit the "Post comment" button for the past 10 minutes and have re-read the above paragraph about 20 times, wondering if it's too obnoxious, also speaks to this attempt at decorum, and this kind of obsessive-compulsive behaviour is probably also common in the type-inclined.)</p>
