      <p>I grew up in a bilingual city, Montréal, which is also the home to many immigrant communities. (A secondary school trip to the Northwest Territories allowed me to hear and see the Inuktitut language.) As a result I was surrounded by language, both spoken and written, and when I worked at a typesetting bureau, I was taught how to set French, which is not how one sets English. So I understood that type is not an inflexible system of marks, but is a living thing.</p>
      <p>So, that's my theory. You get yourself a humble multi-lingual country, throw in some long winters for good measure, and you get "slow-makers", people who take their time on long-term projects, like writing novels and making typefaces.</p>
