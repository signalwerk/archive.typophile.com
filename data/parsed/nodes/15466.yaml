      <p>"I have a feeling that we’ll find the US still has more active type designer per capita than any other country."</p>
      <p>Nah, I don't think we'll find that's true. If we used "per capita" by its most frequent meaning it would not be true. The United States is a huge country and consists of many different states (regions). In a country so large there are differing mentalities and opinions that are often regional. Being a guy from the Mid-West who has lived on the East Coast and now the West Coast these places could all be different countries. New York City has more in common with London than it does with West Virginia. </p>
      <p>Now, if we were to use the per capita definition and apply it by state we might be on to something. But considering how concentrated the American population is on the extreme coasts I don't think it'd be accurate to use "per capita" in the U.S. I'd be willing to bet money that there are less than 7 type designers in South Dakota. </p>
      <p>Even in New York City I personally know of maybe two people who design typography. Groups of college friends deciding to start a type foundry together doesn't happen here in the U.S. very often, but I hear about it all the time in Europe.</p>
      <p>I think the U.S. has a basic lack of respect for the arts and design. There's too much of a "get a real job mentality" that persists here. If that weren't true, there would be more Ph.D. art and design programs as well as a Master's and Undergraduate type design programs. </p>
      <p>Just 'cuz I like drawing, don't mean I'm dumb.</p>
