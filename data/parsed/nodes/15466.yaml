      <p><em>...can’t think of a single country with more type centrics per capita.</em></p>
      <p>Some of us live in <a href="http://www.vansterdamtravel.com/" rel="nofollow">Vansterdam</a>, which can influence your outlook on a few things. Canadian <a href="http://en.wikipedia.org/wiki/Marshall_McLuhan" rel="nofollow">Marshall McLuhan</a> wrote a whole book about our <a href="http://en.wikipedia.org/wiki/The_Gutenberg_Galaxy:_The_Making_of_Typographic_Man" rel="nofollow">Gutenburg Galaxy: The Making of Typographic Man</a>, and many of us can blame <a href="www.veer.com" rel="nofollow">Veer</a>.</p>
      <p>As for <em>...Candians period:</em> Like <a href="http://en.wikipedia.org/wiki/Pierre_Elliot_Trudeau" rel="nofollow">Trudeau</a> said about Americans: "Living next to you is in some ways like sleeping with an elephant. No matter how friendly and even-tempered is the beast, if I can call it that, one is affected by every twitch and grunt." So a lot of us define ourselves in contrast to Americans.</p>
      <p>Jon</p>
