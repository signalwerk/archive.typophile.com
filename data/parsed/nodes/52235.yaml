    <p>I’ve been asked to come up with a quick and dirty logo for a friend’s school project: Sky Snacks is a company that arranges for in-flight snack sampling: pretzels, chips, candy etc.<br>
    Please have a look and have your say: should the logo push the “snack” aspect more, or okay to leave as is?</p>
    <p>Thanks,<br>
    Michael</p>
