  html: |-
    <p>I have been working with the Kievit family for about three monts, but since the last week I can´t get all of the styles listed on the Adobe CS2 applications, I can only get  about the half of the styles and sometimes they appear with a wrong name (I choose  medium SC and I get bold italic). I can get the 23 styles to appear on Word, but they appear with wrong names.</p>
    <p>I deactivated and reactivated them with Font Explorer X several times, also cleaned the font caches with it and replaced the files used by Font Explorer with a back up copy in case they could be corrupted but nothing works.</p>
    <p>What can I do?</p>
