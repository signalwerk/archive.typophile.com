      <p>If you're using Mac OS 10.4 you can clear your system font caches simply by deleting the following folder:<br>
      /Library/Caches/com.apple.ATS/<br>
      When you drag it to the trash you will be prompted for your administrative password. You should then immediately restart. The folder will be regenerated when ATSServer restarts. That pretty much resets the Mac OS side. </p>
      <p>I'm not aware of Adobe applications ever caching anything more than lists of fonts. In older applications AdobeFnt.lst files held some of this data. You could try doing a Spotlight search for them and deleting them as well. </p>
      <p>You could also test removing your InDesign preferences folder as a test to see if that makes any difference. Obviously, you would want to restart InDesign after each test.</p>
    html_clean: |-
