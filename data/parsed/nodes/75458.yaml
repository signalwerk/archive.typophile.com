    html: |-
      <p>Eli,<br>
      "Netsach" is excellent. My wife thought the numerals were very good.</p>
      <p>An interesting phenomena...   I REALLY liked the title  נצח<br>
      set in Bold (or was it Extra Bold) and I liked the Text<br>
      ששירת מטרות חינוכיות<br>
      which was set in Medium (or maybe Bold).  I liked the Regular, but less.<br>
      In retrospect, I think that this is because as the type face is made heavier<br>
      so the details become less visible and the basic underlying shape becomes<br>
      more dominant. </p>
      <p>A little critical point. I think the Zayin is not sufficiently distinguished from<br>
      the Vav. This is because the Vav is already rather ornate and so adding even more<br>
      to the Zayin is difficult.<br>
      Mike</p>
