      <p>Impressive. This has real charm, and a lovely rhythm. Congratulations! </p>
      <p>The only character that I don't like is the shin, where the lower left space seems pinched. Also I wonder about some of the kerning, like on "chayav" and "l'kayem", where the final letter seems too far from the two yods.</p>
