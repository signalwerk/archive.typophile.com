  html: |-
    <p>I know that the encoding of stylistic glyph variants with unicode PUA code points is frowned upon, and all of our commercial OT fonts contain no PUA encoding. But many of our customers are sign makers, and sign making software is generally not OT savvy. The only way for these clients to access stylistic glyphs, is via Windows Character Map, and that requires a glyph to have a unicode codepoint. Is there any "best practice" as to using PUA that will allow this?</p>
    <p>James</p>
