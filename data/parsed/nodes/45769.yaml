    html: |-
      <p>I think best practice is to stick to a convention within your foundry, i.e. you make yourself a system, and put e.g. swash letters always into the same range, etc.</p>
      <p>PUA is exactly that: private use area, so there is no "industry standard". But it's a good idea to use an internal (private) "standard".</p>
