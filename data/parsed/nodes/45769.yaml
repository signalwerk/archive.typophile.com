    html: <p>I start at E100, which seems to avoid many of the major player's "reserved" PUA codepoints.</p>
  - id: 280979
    user_id: 14556
    user_name: cuttlefish
    user_path: null
    user_image: /files/pictures/picture-14556.jpg
    date_raw: 29 May 2008 — 12:17am
    date: 2008-05-29T00:17:00
    votes: null
    html: <p>There are some organized conventions for use of the PUA, but they are, by definition of the PUA, unofficial. But if you are working in the relevant genre, such as <a class="freelinking external" href="http://www.evertype.com/standards/csur/" rel="nofollow">constructed/artificial scripts</a> or <a class="freelinking external" href="http://www.mufi.info/" rel="nofollow">medieval research</a> it might be helpful to follow those guidelines. This probably isn't much of an issue for the sign making market, but there it is.</p>
