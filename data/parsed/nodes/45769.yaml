      <p>Exactly.</p>
      <p>E.g. If I'm creating a font for the scholarly/philologist with publications of oldmanuscripts in mind, I'd use MUFI recommendations.<br>
      Then again, you'd do that only on commission, so you'd know what to use.</p>
      <p>And as Jason pointed it out, this one is of no concern to your clients.</p>
