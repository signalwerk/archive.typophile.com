    html: |-
      <p>Don't know if it's actually a font, more a custom artwork and lettering for this special occasion.<br>
      Complete illustration here: <a href="http://www.spd.org/2012/11/spd-48-call-for-entries-is-her.php" title="http://www.spd.org/2012/11/spd-48-call-for-entries-is-her.php">http://www.spd.org/2012/11/spd-48-call-for-entries-is-her.php</a><br>
      When looking at this webpage, I noticed the script on the right "Click Here! To Enter Pub 48" wich I think should be <a class="freelinking external" href="http://www.losttype.com/font/?name=lavanderia" rel="nofollow">Lavanderia</a>. Now going back on the artwork, looks like "Society of Publication Designers" has been set in Lavanderia too. So may be, rest of the lettering "Pub N 48" could have been also derived from the same font.<br>
      Same layering style but different design: <a class="freelinking external" href="http://ilovetypography.com/2012/01/13/interview-font-designer-kunihiko-okano/" rel="nofollow">Quintet</a> by Okano Kunihiko, available through <a class="freelinking external" href="http://www.photolettering.com/plog/2011/dec/23/new-alphabet-quintet-kunihiko-okano/" rel="nofollow">Photo Lettering Inc.</a></p>
