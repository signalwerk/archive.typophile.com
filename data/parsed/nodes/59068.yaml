    <p>Hi Guys.</p>
    <p>Im first trip type designer, and i'm editing my first type.<br>
    I'd like to put ALTERNATE characters. The ALTERNATE's objective is that the user change the caracter when you want.</p>
    <p>I'm working with this feature:</p>
    <p>feature aalt {<br>
      sub h by _h ;</p>
    <p>} aalt;</p>
    <p>How can I run this feature!?</p>
