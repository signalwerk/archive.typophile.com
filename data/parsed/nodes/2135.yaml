    votes: null
    html: "<p>The short answer: it was designed for the German  <br>roadway. (DIN stands for the German Industrial Standard.) <br> <br>The medium answer: the different weights were not  <br>designed at once, as a family (think the original  <br>Helvetica vs. the original Univers). They're a loosely  <br>related bundle of faces. Frankly, this becomes obvious  <br>as you try to use them together. <br> <br>The solution: use the FontFont version. The weights are  <br>all reworked (by Albert-Jan Pool) to maintain the spirit  <br>of DIN (compare the Mittelschrift to the FF DIN family)  <br>while creating a unified family. <a href=\"http://www.fontfont.com/shop/\" target=\"_top\">http://www.fontfont.com/shop/</a> <br> <br>If you want the full history just hope Erik Spiekermann  <br>reads your plea. =)</p>"
