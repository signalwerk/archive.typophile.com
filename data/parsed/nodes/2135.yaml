  html: <p> Hi all -- <br> <br>By Tuesday 20th August I have to know what there's to know about the German DIN fonts, i.e. Mittelschrift, Engschrift, Neuzeit Grotesk ... (I guess that sums them up?). <br> <br>At least I should give the _impression_ of knowing everything.  :-) <br> <br>Any pointers to information? Considering the short notice, I prefer information on the web. But book titles you know of will be greatly appreciated as well. <br> <br>Soren O </p>
