    <p>I'm currently working on a website for a new industrially designed product and have an oddly specific client font request. </p>
    <p>In the client's words:<br>
    "The capital M must have straight sides and the bottom of the point must be in line with the two arms.<br>
    The capital A's uppermost point must be slightly flattened rather than ending in a sharp point.<br>
    The lowercase a should be of the kind that does not have an arm over the top of it but rather looks more like an o with a line in the back."</p>
    <p>Some background on the job:<br>
    This is for use throughout the site in both headings and body copy.<br>
    Fonts I had in mind for use were (one of the following) Formata, Myriad Pro or Open Sans</p>
    <p>The only font I can find that meets this criteria is <a class="freelinking external" href="http://www.google.com/webfonts/specimen/Muli" rel="nofollow">Muli</a> but with no bold weight it's rather limited for comprehensive use.</p>
    <p>Anyone think of any alternatives?</p>
