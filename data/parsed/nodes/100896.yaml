    html: |-
      <p>Those specs -especially for the "a"- do point to a sans, but you might want a serif font anyway. FYI serif fonts that have an "a" like that are often termed "Primary" since they're supposed to be reading-learner–friendly.</p>
      <p>BTW for clients that are this picky it's worth a shot pitching a custom -or at least customized- font, since they typically always find <em>something</em> they don't like in an existing font no matter how many you show them!</p>
      <p>hhp</p>
