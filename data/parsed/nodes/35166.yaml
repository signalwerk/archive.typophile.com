    html: |-
      <p>This, like all the other UPC Thai fonts in Windows, was licensed from Unity Progress in Thailand. The company still exists (we extended our rights a while back) but is not in the fonts game. I don't think there are any commercial font efforts in Thailand which is a shame. Anyway as long as you don’t redistribute the file (or derivative font file) you can  use it in your print or digital project. </p>
      <p>Also: If you need to install the font on another platform or machine that doesn't have the font you can license it from Ascender Corp.</p>
