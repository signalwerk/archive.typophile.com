      <p>Our audience: 100k/yr-20m/yr businesses.  Web design, hosting, consultation, custom programming, software development, some IT, and some print design.  We’ve had the name for 3 years and it would be tricky to change at this point, we are just hitting a big growth spurt right now and we want to get our brand up to that.</p>
      <p>Our designer is a gifted and wonderful fellow, and we treat him well.  I was trying to steer more toward a text based logo rather than merely a brand mark.  I think that would allow for greater growth, and a more serious look.  I’ve told him this, though we disagree some.</p>
      <p>We are doing identity, we have the colors picked out, we are narrowing down fonts (this will depend partly on the logo), and we are getting ideas for cards and everything else.  We are just trying to stick a logo to use as the basis for what is to come.  He knows it’s a helluva project, as do we.</p>
      <p>We’ve gone from more marked logos to more text logos, so we are certainly going in a direction, but I am trying to guide it to something I like.</p>
      <p>Aluminum, I like your thoughts about splitting it up…. except our company name is “hidef web solutions llc” so I think legality might bind us a bit.  And (not sure if I can post this) <a href="http://www.hidefweb.com">www.hidefweb.com</a> is our domain.  Of course if I were to name it it would be the core members last names, or conflict design (since my business partner is Iranian and I am Jewish).</p>
