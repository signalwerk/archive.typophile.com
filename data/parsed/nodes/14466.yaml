    html: <p>Hector, is right, these are good examples of design for design sake. Questions I have are who is your target audience, what are you trying to sell (hosting?, design?), What does hidef mean? Even IBM was International Business Machines before it became IBM. You need not just a mark but spell out your name and create a positioning line (even if you don’t use it with the logo). This isn’t a logo project its a CI (Corporate Idenity) project and takes a lot more work than just torturing your designer.</p>
