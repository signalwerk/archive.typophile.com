    html: <p>What bothers me a little about all of the designs is that they seem to be focusing more on image/trendiness and less on communicating what this company is about. It seems to me that these designs would be just as well suited for a clothing line as a dot com. What’s your company’s unique trait that you’d like to convey? Customer service? Quality work? Defining this will help you make a selection. If anything, HiDef, as in high-definition, suggests top-of-the-line. Your previous logo separated the words more, using upper and lowercase to break them into understandable chunks, I think this was a good start. All lowercase letters, as in your current iteration, doesn’t do much to communicate the concept.</p>
