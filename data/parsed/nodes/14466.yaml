      <p>Hi!</p>
      <p>Sorry to be negative, but I think Aluminium’s nailed it…</p>
      <p><a href="http://www.e3direktiv.com">http://www.e3direktiv.com</a> are a .com, web agency. It’s v. similar.</p>
      <p>I actually like the lemon shape but I’m unsure of the reasoning for it, it looks a bit like a stylised leaf to me. Nothing really seems to say ‘high-definition’ - I’m assuming that’s what Hi-Def stands for. Maybe something along the lines of clarity, quality, sharpness, high-end, upmarket - these are all adjectives that might associate well with High Definition. Conceptualise the brand first. Dress it up second… it’s just an exercise in style otherwise. If you revist that, you’ll give yourself the chance to hit on a concept that can then permeate everything associated with your brand - i.e. web, brochures etc., which will aid brand recognition and give it a cohesive look. Just as long as you’ve got a clear idea propping it all up, it’ll be fine.</p>
      <p>My tip would be to switch off your Apple Mac and logically work out your ideas on paper first. Logos that aren’t great look better when they’ve been through Adobe Illustrator, so finding the one/s that work is a bit trickier if you’re just making everything look slick - it’s easy to convince yourself that a logo works because it looks slick.</p>
      <p>Sorry if it’s all negative sounding, it wasn’t meant to be. I’m trying to back up any criticism with constructive comment - it wouldn’t be a critique otherwise.</p>
      <p>Si</p>
