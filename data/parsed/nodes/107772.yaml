      <p>Quite a few Victorian fonts used ball &amp; monkey-tail ornaments. Sometimes the ball was hung close to the terminal, like the one used on your S.  Other times the tail was extended to cross the diagonal. Very few are digitized.<br>
      Font Mesa's Livery Stable<br>
      <a href="http://www.myfonts.com/fonts/fontmesa/livery-stable/" title="http://www.myfonts.com/fonts/fontmesa/livery-stable/">http://www.myfonts.com/fonts/fontmesa/livery-stable/</a><br>
      has an S with the tail and ball in a similar position to your S. The Victorian font, known as Glyptic, was designed by Herman Ihlengerg. Later also sold under the name Morgan TwentyNine. Digital under this name by FontShop 1999. Don't know where you could get a legitimate copy.<br>
      For a ball hung by a tail to below the diagonal see Campanille [not the Bodoni one] at <a href="http://www.myfonts.com/WhatTheFont/forum/case/76375/" title="http://www.myfonts.com/WhatTheFont/forum/case/76375/">http://www.myfonts.com/WhatTheFont/forum/case/76375/</a>.<br>
      Don</p>
