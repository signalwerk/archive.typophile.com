      <p>Thanks for taking the time to comment on my legal question Don, and as I noted previously - I would certainly not want advocate any form of font piracy. </p>
      <p>I simply mentioned OPTIFonts due to the fact that theirs was the only "legitimate" version of Morgan Twenty Nine that I was aware of. Although much of their catalogue is nowadays often regarded as "bootleg typefaces" I know a great many design studios and reprographic companies who legitimately paid the full price, in good faith, for Castcraft's complete library of OPTI CDROMs. </p>
      <p>Consequently, it appears anyone who now searches for OPTI fonts is bound to turn up the same references that I did. That in turn leads us into the murky world of flakey copies, available under the decidedly dodgy banner of "abandoned" and "orphan" fonts, and all that may entail. I was just seeking some clarification on the copyright issues etc., as the original vendor company is no longer in existence.</p>
      <p>So that's clear - just say NO kids!</p>
      <p>I will edit my previous comment to suit.</p>
      <p>Regards</p>
      <p>Doghouse</p>
