      <p>I didn't mention OPTI's Morgan TwentyNine because of the legitimacy issue. I recall the alt.binaries.fonts discussions of OPTI fonts. My conclusion is that any commercial use would be very questionable. Thus I did not include a link to the OPTI font archive.<br>
      OPTI was a notorious font piracy operation, but it did produce some original fonts. OPTI's Morgan TwentyNine could perhaps be original.<br>
      The issue of commercial use orphan fonts, as far as I know, has not yet been ruled on by the courts in the US or elsewhere. In any event, it's not smart business practice to risk being the subject of a test case.<br>
      Given the aggressive methods of intellectual property interests, I would not put it past them to come down like a ton  of bricks on an individual who uses an orphan font, even where the individual does not make a financial gain from using the font.<br>
      Don</p>
