      <p>Hi guys,</p>
      <p>Re: Don's comment about "Morgan Twenty Nine" and not knowing where to get a legitimate copy - well, as I recall it was at one time retailed by OPTI Fonts who folded in 2005. </p>
      <p><strong>EDIT:</strong> part of original comment redacted by Doghouse</p>
      <p>O.K. Right!</p>
      <p>Now, since these fonts are no longer available for sale, it seems they have become widely regarded as "abandoned" or "orphaned" fonts. </p>
      <p>Does that make them legitimate? </p>
      <p>I'm not so sure, it's a bit of an odd one! </p>
      <p>This "Typophile thread" about Castcraft doesn't make the legal side too clear and it's a mash up of the info available on the Luc Devroye site.</p>
      <p><a href="http://typophile.com/node/69064" title="http://typophile.com/node/69064">http://typophile.com/node/69064</a></p>
      <p>Maybe someone can take the time to enlighten (me) us with the legal aspects of this sort of stuff. </p>
      <p>Note: I'm not advocating font piracy - please advise.</p>
      <p>Doghouse</p>
