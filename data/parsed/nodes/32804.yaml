    <h2><a href="/filmfest4" title="Typophile Film Fest 4 // Call for Entries">Typophile Film Fest 4 // Call for Entries</a></h2>   <p><strong>Typophile Film Festival 4</strong> will take place at the opening night of <a href="http://www.typecon.com">TypeCon</a> in Seattle, August 1-5, 2007.</p>
    <p>TFF4 is a <a href="http://www.punchcut.com">Punchcut</a> production and is made possible through the generosity of <a href="http://www.fontshop.com">FontShop</a>. Special thanks to <a href="http://www.typesociety.org">The Society of Typographic Aficionados</a> for providing the venue.</p>
    <p>The Typophile Film Festival is open to anything relevant to typography, design history, and/or type design. It can be educational, experimental, inspiring or humorous.</p>
