      <p><cite> &gt; Its a Journal, rigth? I mean is public domain, no?</cite></p>
      <p>No, not really. Being public is different than being in the public domain. The article would still be under copyright and should not be reproduced <em>in toto</em> publicly (digitally or otherwise) without the author's permission.</p>
      <p>Looks like many back issues of the <em>Printing History</em> journal, including the one you seek, are still in print and available for purchase directly from the APHA. Info here:</p>
      <p><a href="http://www.printinghistory.org/publications/printing-history/back-issues.php" title="http://www.printinghistory.org/publications/printing-history/back-issues.php">http://www.printinghistory.org/publications/printing-history/back-issues...</a></p>
      <p>Doesn't look like an order form is available yet, however, so you may have to contact someone directly.</p>
