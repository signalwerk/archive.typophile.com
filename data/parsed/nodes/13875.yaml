      <p>Letterletter has the virtue of being thought provoking, whether you agree with it or not, and this is a high merit. As I have mentioned earlier, I also agree with John about the fundamental importance of understanding the relation of the tool to letter form. </p>
      <p>I agree with Hrant that type is not writing, but disagree to the extent that type, as Van Krimpen said, retains an influence or force of writing that can't be escaped from. As I think Goudy noted, it is hard to find a (two story) a and g where you don't see the influence of the pen.</p>
      <p>I also think that G. Noordzij is right about the connection of writing and civilization. Without writing, you can't have rule of law over anything larger than a village. It was a key step toward individual freedom, which was to some extent lost in the 'oriental despotisms' of high culture and productivity that came with irrigation technology-in the Nile, Mesopotemia, India and China.</p>
