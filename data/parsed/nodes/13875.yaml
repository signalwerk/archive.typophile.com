      <p>&gt;freedom and equality</p>
      <p>I do not know whether your praise of hunter-gatherer societies vs agricultural is entirely merited--what are your sources?--but in any case it does not contradict what I wrote about law and freedom. The point is that what we regard as the pioneers of civilized societies are the highly productive and creative civilizations of the Nile, Mesopotamia, China and India. I mentioned specifically that something was *lost* in these as well as gained, as well as, no doubt in the earlier transition from hunter-gatherer societies to settled agriculture.  </p>
      <p>What is normally called civilized is just the specialization, with the flurishing of art, invention, and yes writing that came with the irrigation societies. These were far more productive than earlier ones, and so enabled people to have leisure and specialization that resulted in many advances. </p>
      <p>Within the context of these large, developed, sophisticated but oppressive societies, writing enabled the rule of law, protecting the individual to a greater extent. Moses seems to have been the first to try to eliminate the monarch in this context, proposing a rule of law purported to have divine authority. Ancient Greek democracy proposed law sanctioned by the votes of the people, but the same ideal of rule by "law, not men." </p>
      <p>Within large, productive societies that produce economic surpluses--and which allow for such activities as type design--law is critical to individual freedom, and writing is necessary for such law.</p>
