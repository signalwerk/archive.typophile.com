      <p><em>I also think that G. Noordzij is right about the connection of writing and civilization. Without writing, you can’t have rule of law over anything larger than a village. It was a key step toward individual freedom...</em></p>
      <p>There is very strong evidence that individual freedom and equality has never since been so great as it was in pre-civilised, i.e. pre-agrarian, hunter gatherer societies. The downside, of course, is a short lifespan and chronic low level inter-group warfare. Civilisation is defined by a number of key technologies, one of which is writing, but all resting on agrarianism. The aggresive alternative to agrarianism is pastoralism, which occupies the geographic and social fringe of agrarian civilisation, and is generally antagonistic to it. It seems likely that many peoples chose pastoralism precisely because it offered them more individual freedom than in the increasingly tightly controlled agrarian civilisations. The desire for individual liberty that persists <em>despite</em> civilisation can be seen as a kind of homesickness for the freedom that we enjoyed as hunter gatherers. So what we have is a long societal movement from the freedom, social equality and consensus decision making of the small hunter gatherer group, to the increasingly constrained and hierarchical structures of agrarian and, later, industrial society, to modern attempts to foster institutions of individual liberty within mass societies (democratic goverment, constitutional rights, the Internet). The fact that these insitutions are consistently undermined shouldn't blind us to the extent to which they recollect our most ancient sense of ourselves as free persons.</p>
