      <p>&gt; What would the designer do differently?</p>
      <p>First, psychologically: Relinquish the control and ego-trip of creativism (Art) to start heading towards serving the reader (Design) for real. Overcome the fear of not knowing the destination, or even that a destination exists; the reader is served by our attempts during the journey, not our "arrival" anywhere - that only serves us.</p>
      <p>Then, practically: Pay primary attention to the border between Black and White, instead of carrying out moving-front formalisms on an illusionary skeleton. Make glyphs that come together to strike the balance you think is good between: aesthetics, bouma divergence, even color/texture, and familiarity. The glyphs do not need to follow a formal system (like chirography, or geometry) - in fact if they do they cannot approach the "ideal". This makes them nebulously defined, and that's scary - but that's the most something made by a human for other humans can ever be anyway.</p>
      <p>&gt; we don’t understand enough about how we read</p>
      <p>We know enough to stop relying on chirography [as much as we do].<br>
      Even a little knowledge is better than blind allegiance to legacy circumstances.</p>
