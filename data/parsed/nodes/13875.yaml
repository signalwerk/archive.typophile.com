      <p>Hrant, I was actually hoping to corner you at TypeCon and ask your thoughts on <em>Letterletter</em>. It's very interesting stuff, but very at odds with, well, a significant chunk of your philosophy of good type design.</p>
      <p>I found his suggestion for type-drawing techniques to be very illuminating. I'm a fan (in my amateur way) of a combination of techniques, but I'd never thought of doing it quite that way. It appears to add a lot of clarity to controlling axes when you're not using tool that has an inherent axis (I often use a ballpoint pen). Though it's a bit beholden to handwriting.</p>
      <p>Not to start a debate on it, but I also found his writings on the Bible very fascinating.</p>
