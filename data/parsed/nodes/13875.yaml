      <p>The key to the social life of hunter-gatherer societies, or at least the ones who survived, was Information. "After the Ice" explains all this from the only perspective that matters, which is the vast trove of archeological evidence unearthed in the last, and only the last 20 years or so, when they've been able to subject the bones, and one bit of clothe! to cool forensic studies, and the other remains to microbiological and micromineralogical analysis. The book is a must for discussions like this 'cause it's a global study of studies, and spans the transitions from huntress, to shepherdess, to housewife (and from bean eater to bean guarder to bean counter).  ....From these studies, we know that they didn't have italics, free time? a concept of freedom? Not for long. Freedom and eat'em, as they'd say. The other important part we'll never understand but know existed was a connection to nature that was so overwhelming that there was no room for most of the concepts we have today about how people must have lived ; ). They were, as groups, full of information or gone. This slowly morphed into representations of that information: after the ice. </p>
      <p>The ideas of the Noordzij and Catich, mixed with Dyer and Diamond are nearly too much for me at least. The later, by the way, in The One or Two pages on the subject of typography and printing, all but acknowledges the title should be, "...and Steel &amp; Type" and, New Guinea Is home to 2/3 of the spoken languages   on  earth, so it is the old us as we were everywhere, (not).</p>
      <p>Thinking on newly coyned Dichographic Divide. . .could that be it's own thread? because John: "We can pick up bits of empirical and anecdotal evidence about how we read, and we can reach (tentative) conclusions or working hypotheses based on them, and these can and should inform decisions during the design process, but this is very different from saying that we can make the reader the foundation of text typeface design in some way that ignores completely the chirographic background of our writing systems."<br>
      ..has gone in a wonderful new direction.</p>
