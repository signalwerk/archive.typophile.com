      <p>Adam, in the case of 'Lettres françaises' was there enough there in the images that it would be useful learning tool? Or was it more of a beautiful promtional item? Do you have a copy? Do you speak/read french?</p>
      <p>I am getting more and more interested in the Dutch school of type design &amp; want to learn - but I am in alaska so books &amp; websites is what I have. </p>
      <p>At the same time I am finally seeing what Jean Porchez talked about when he said - pardon the paraphrase here, it is imprefect - ' The dutch took type design &amp; gave it new solidity &amp; rigor ' which I imagine comes from an emphasis on written structures - what was called 'ductal logic'  in that christian gothic thread. Then he said something like ' But now French type is giving the type it's elegance back.' Again, apologies for any mis-quotation or mis-paraphrasing. I don't recall exactly where I read it or I would quote it directly.</p>
      <p>At the time I thought that this kind of description seemed a bit maybe nationalistic or maybe even self serving - but I don't think so now. Now that seems *right*. </p>
      <p>Apolline seems to have most of the rigor of the Dutch type I admire so much but an elegant flow to it too. I am still learning where my impressions come from - &amp; my impressions keep changing. </p>
      <p>I am hoping to learn about the dutch school by reading Noordzij.</p>
