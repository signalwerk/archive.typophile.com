      <p><em>What about Catich?</em></p>
      <p>Yes, Catich is important, especially for demonstrating that the tool in question isn't always the obvious one. But Catich was concerned with the production of a specific style of lettering using specific tools, while Noordzij's analysis is much broader and takes into account models of expansion and rotation as well as translation. This is where I think it is most useful, because most Latin type designers, consciously or unconsciously, begin with a translation model. Making designers conscious of the characteristics of other models helps them to extend the 'vocabulary' of their letterforms. It can make designers more adaptive, and increase the range of solutions that will occur to them when they encounter specific problems <em>including problems of readability.</em></p>
      <p><em>While I worry that a beginner is particularly susceptible to suffering the long-term detriments of a misguided foundation. I think the best place to start thinking about type is the… reader!</em></p>
      <p>But what does that mean? We return to my question of some months ago: What would the designer do differently? How would the design process differ? Theoretically, starting from the reader, <em>i.e.</em> starting from an understanding of how we read rather than how we write, makes emminent sense, but I think we have this problem: we don't understand enough about how we read to <em>substantially</em> inform a design process from the ground up. We can pick up bits of empirical and anecdotal evidence about how we read, and we can reach (tentative) conclusions or working hypotheses based on them, and these can and should inform decisions during the design process, but this is very different from saying that we can make the reader the foundation of text typeface design in some way that ignores completely the chirographic background of our writing systems.</p>
      <p>However, all is not lost, because I think the kind of graphic understanding developed by Noordzij can be reconciled very easily with a gradually increasing knowledge of reading and its application to design. Rather than ideologically declaring that type design should proceed from an understanding of reading, even though that understanding is insufficient to support the process -- leading to arbitrary and capricious design decisions --, we can realistically locate such understanding 'downstream' in the design process, as a recognised and increasingly clearly defined target.</p>
