      <p>Back on topic, sort of:</p>
      <p>Ever since the "true Italic" thread where I put "constructed" in quotes in an attempt to qualify it as a broader idea in opposition to chirography, I've realized I need a better term. "Notanic" sucks though. And "chirography" deserves a suitably Greek opponent. So I arrived at the idea of expressing the boundary-based nature of notan-centric design. My first choice was the Greek word for "membrane" (something that both separates and relates), but ironically that's "chorio"... and "choriography" is both taken and too confusable against "chirography". So I've decided to go with "dichography", since "dicho" means -or at least can mean- something like "one thing split into two". And one good thing about it is that many people are familiar with that prefix already.</p>
      <p>Now, I'm not a fan of terminological despotism, so this is your chance to suggest something better.</p>
      <p>hhp</p>
