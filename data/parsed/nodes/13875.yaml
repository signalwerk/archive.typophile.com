      <p>&gt; don’t you think it might have some sort of role?</p>
      <p>It most certainly does. But to me the key is treating it as just another factor (one that can be sacrificed, pushed around, etc.) not an over-arching principle. This doesn't mean I'm a fan of the Cult of the Ugly; I'm a fan of Looks Don't Matter That Much. I'm a fan of what's underneath.</p>
      <p>--</p>
      <p>Like Chris indicates, the "moving front" stuff (a great term) comes directly from GN. Ironically, it is thanks to his formalizations of writing that I've been able to put my finger on exactly why it fails in the realm of type design.</p>
      <p>The making of letterforms can be divided into two general methods: chirography, which creates the black (possibly with an eye on the white, but still) by applying one or more of translation, rotation and pressure on a set of vectors (the letterform skeleton*); and dichography, which creates the boundary between the black and white. Any marking method (such as the broad-nib pen held by the human arm/hand) is chirogaphic; bezier curves are dichographic. Furthermore, reading is dichographic: we percieve and decipher black/white shapes, not movements of some virtual, paraphrased marking method.</p>
      <p>* I further put forth that these structures are imaginary. They make us happy by providing an illusion of control, but there's no reason to believe that letters have any such structure to the reader (just the maker - or <strong>some</strong> makers). Peter will argue that letters do have strucures in reading (and I tend to believe him) but these are definitely not chirographic structures. The conventional structural definitions of the letters are violated every day (like an UC "R" without its vertical stem, which is still read as an "R" just fine), but some people prefer to look the other way. Basically, we don't yet really know what the letters are.</p>
      <p>Both chirography and dichography can create any shape they want, but each is more attuned to making certain types of shapes. I put forth that the functional dimension of typography is better served by dichography. While the aesthetic aspect of typography is <strong>partly</strong> served by chirography; I say partly, because things like geometry and symmetry (both to some extent violated by chirography) are also important in aesthetics. This is why I say that chirography is best for making a certain class of display fonts.</p>
      <p>But it's not a matter of banishing chirography - not at all. It's a matter of seeing and aknowledging its limits, and striking a better balance than we have been between the two worlds, aesthetic and functional; of rekindling the fires of exploration, which will lead to radical improvement, not mere refinement. It's a matter of striking a balance between celebration and progress. Let's put the bottle down already, and find a more rewarding, challenging continent.</p>
      <p>hhp</p>
