      <p>Thanks Hrant, my translation of Gerrit Noordzij's 'mini magnum opus' (as I like to call it) "De streek: theorie van het schrift" will appear published by Robin Kinross's Hyphen Press some time this fall, under the title "The stroke: theory of writing". It will be distributed in North America through Princeton Architectural Press. It's a great compliment to Letterletter. </p>
      <p>Other English language titles are listed at:<br>
      <a href="http://www.letterror.com/noordzij/bibliography/index.html" title="http://www.letterror.com/noordzij/bibliography/index.html">http://www.letterror.com/noordzij/bibliography/index.html</a></p>
      <p>I have not seen "Zetten Bij Thieme, Nijmegen", But "De Handen Van De Zeven Zusters" (The [writing] hands of the seven sisters) is beautifully produced and wonderful to read. It contains numerous essays on type or writing, including the title piece, and ones on the primacy of the pen, the domain of typography, the burgundian bastarda, the typographic word, the word-image, as well as pieces on the creation of heaven and earth and the real meaning of bingo. It's text is probably greek to non-dutch readers, but some of the visuals speak volumns.</p>
