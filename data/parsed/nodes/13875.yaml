    html: <p>I'm a big fan of <em>Letterletter</em>, with all the caveats that I think that statement necessarily implies to anyone else who has read the book. What I like and admire about <em>Letterletter</em> -- and why I am looking forward to reading Peter's translation of <em>De streek</em> -- is that it deals practically with the question of how letters are made, and is the only work I know that attempts to analyse the relationship of tool and motion to letterform. Now, as Hrant will rightly insist, the question of how letters are made is not the same as the question of how letters are <em>read</em>. But for a type designer, especially a beginner coming to the craft from outside either an apprenticeship or school introduction, learning to think about letterforms from the inside-out, as it were, is helpful and probably essential. This is why I have described <em>Letterletter</em> as the most practically helpful book I have read as a type designer, and I suspect that Peter's new English version of <em>De streek</em> will be even more helpful.</p>
