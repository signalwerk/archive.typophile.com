      <p><em>I do not know whether your praise of hunter-gatherer societies vs agricultural is entirely merited—what are your sources?</em></p>
      <p>I'm not <em>praising</em> hunter-gatherer societies, I'm making an observation about their social organisation, which tends to be non-hierarchical, based on consensus decision making, and in which men and women have substantial social equality. One doesn't have to sign-up to a sentimental 'noble savage' myth in order to acknowledge the relative freedom of such groups, and it would be foolish to praise them, because it is not as if they have chosen to live this way: it was simply the pattern of human existence for many hundreds of thousands of years, and it survives, just about, and has been observed among the few hunter-gatherer societies that persisted into the modern age. The key to the social life of hunter-gatherer societies is the small group, and a significant area of open and fruitful land.</p>
      <p>I'm certainly not trying to paint an idyllic picture of such societies. As I noted above, they were characterised by chronic low level warfare. There were almost no pitched battles of the kind that we associate with civilised warfare, but a succession of ambushes and, when possible, massacres. The number killed on any one day was miniscule compared to the increasing efficiency of civilised warfare, but the proportion of the overall population killed in each generation was much higher than in any subsequent warfare (as high as 25%, if I recall correctly). This kind of hunter-gatherer warfare was well documented among the Australian aboriginal peoples, and was still prevalant in New Guinea until quite recently. It is also, by the way, exactly the same kind of warfare that has been documented among different groups of chimpanzees.</p>
      <p>My point about such socieities is that they reflect the vast majority of human history: civilisation is a recent phenomenon. So it isn't unreasonable to think that much of what we are as a species was formed in such societies, and that conformance to hierarchical social organisation is to some degree alien to our nature: it is something that we have learned in the past few thousand years, and which most of us continue to resist and subvert in various ways.</p>
      <p>My main source for this thinking is the early chapters of Gwynne Dyer's <em>War,</em> which I've been reading recently. He provides a good summary of recent research on hunter-gatherer societies, most of which seeks to bury the old noble savage myth and accurately detail the shortness and unpleasantness of such existence (the tribesmen of New Guinea were reportedly very relieved when the goverment told them that they were not allowed to fight each other any more). But at the same time, the relative social equality and freedom of such societies should be acknowledged: because it is part of our common, pre-civilised past.</p>
