      <p>John Hudson: "and I suspect that Peter’s new English version of De streek will be even more helpful." </p>
      <p>I trust it will.</p>
      <p>Hrant: "The GN stuff is great for: analyzing the past; and making pretty organic display faces. No more."</p>
      <p>Yes, Gerrit Noordzij's writings are great for analyzing the past, including the recent past. And his understanding of writing helped him make a series of highly readable text types. Typophiles might be amused to learn that I came to Hrant's bouma concept after having been convinced by Noordzij's writings of the importance of the visual integrity of the word image.</p>
      <p>Gerrit never wanted to prescribe, just describe. In an unpublished text I promised once to get letterpress printed for an ATypI doggy bag, Gerrit writes: The dogma of independent typedesign could only be supported with a selection of beautiful decadent roman fonts in the Dutch manner by such designers as Voskens, Kis, Fleischmann and Caslon. For esthetic reasons they made the shapes of their typefaces different from penstrokes. [...] It is decadent to make an artificial distance between the tool and the shape, but keeping them artificially together is decadent as well. This leaves the playingfield wide open. Gerrit's stuff is great for opening up the future.</p>
