      <p>Since you are primarily using the term chirographic as an adjective to refer to a particular kind of type design, you should be looking for a term that can be contrasted in the same usage. 'Typographic type design' sounds really dorky and is confusing. The simplest place to start is simply 'non-chirographic type design', of which my suggested 'anagnostic type design' would be one, intentional variety. The problem with trying to find an activity-based term for what you are describing is that the activity is difficult to distinguish from the majority of 'chirographic' -- or parachirographic -- type design: the vast majority of type is made by people constructing outlines. The distinction you are seeking is not in the activity, but in how that activity is informed (by handwriting or not by handwriting). So beyond 'non-chirographic' you will probably be thinking in terms of a variety of different ways of thinking about type design and how these inform the activity of making.</p>
      <p>You could reduce your suggested term to 'dichotic type design', by which you would mean type design that is focused on the dividing line between black/white space. I think this is as good a term as you are going to get.</p>
      <p>This leads us to the interesting question: is anagnostic type design necessarily dichotic type design? You would say yes; I am not convinced.</p>
