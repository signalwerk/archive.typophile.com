      <p>&gt; Without writing, you can’t have rule of<br>
      &gt; law over anything larger than a village.</p>
      <p>And you can't end up having such a "civilized" century as the 20th...<br>
      Seeing illiterate cultures as "uncivilized" is disgusting.</p>
      <p>&gt; Yes, Gerrit Noordzij’s writings are great for<br>
      &gt; analyzing the past, including the recent past.</p>
      <p>And the forseeable future even! But not the direction we <strong>need</strong> to be going [now]. And I don't buy that describe-versus-prescribe business; it's quite clear what GN <strong>likes</strong>, and this obviously influences what he makes (where "highly readable" is relative) for others to see/use, and what he teaches/perpetuates.</p>
      <p>&gt; Noordzij’s writings of the importance of the visual integrity of the word image.</p>
      <p>But when will people realize that you can't have both the pen and ideal notan?</p>
      <p>&gt; It is decadent to make an artificial distance between the tool and the shape</p>
      <p>Yes. Dump the tool.</p>
      <p>&gt; but keeping them artificially together is decadent as well.</p>
      <p>Then why keep doing it?!</p>
      <p>&gt; Gerrit’s stuff is great for opening up the future.</p>
      <p>I think if it were, it wouldn't be doing the exact opposite...</p>
      <p>&gt; For esthetic reasons they made the shapes of<br>
      &gt; their typefaces different from penstrokes.</p>
      <p>I see that as an insult against Fleischmann.<br>
      Not to mention against the craft itself.<br>
