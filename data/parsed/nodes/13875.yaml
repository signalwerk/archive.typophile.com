      <p><em>Why such aversion to “-graphic”?</em></p>
      <p>Because, as I explained, you are not talking about writing, but about an approach to type design. The suffix -graphic implies writing to me, especially in the context of a discussion that centres on the role of writing and reading in type design.</p>
      <p>Again, you are using chirographic as an adjective applied to type design, i.e. you are referencing chirography. But you can't reference 'dichography' in the same way, because it isn't something that exists as a practice independent of what you are describing. So I'm suggesting that you make a much more direct adjective, dichotic, that describes the kind of type design without appearing to reference something external to it through a terminological parallel to chirographic. I thought this would appeal to you, because it subtly reinforces your argument: chirography is something external to but referenced in type design (handwriting), while the dichotic approach is internal to type design.</p>
