      <p>Questions of Civilization ( or lack therof ) aside -  It seems to me that some factors have been left out of this discussion about the approach to the design of type.</p>
      <p>Type signifies in at least two ways; One; as written - in other words 'what' is written.  It's type's ability to do this better than letters writen by hand that Hrant in particular seems excited by. But Typophiles in general seem to share this prejudice.* This is also also the reason I am interested GN's books, dutch type &amp; french type. </p>
      <p>Two; type signifys -  and this is where graphic designers get so much of their kicks - from the design/art/style of the letters - and the implied meaning or feeling they suggest. A type has a kind of 'voice' like an actor speaking. </p>
      <p>* By which I mean nothing pejorative.</p>
      <p>I can understand where some type designers may fixate on the 1st kind of signifying but even the 'best', most neutral, or most readable ( pick your own quality really ) type cannot fail be interpreted by readers in both ways. It's probably true that sheer familiarity of the forms reduces the extent to which we are aware of our reactions to the sheer style or feeling of book or text fonts. But this 2nd factor doesn't go away.</p>
      <p>It seems like the 2 characteristics must interact and enhance or undermine each other. It also seems like  a font with a beautiful rhythm would add to it's fuction. I think that the GN influenced fonts &amp; dutch fonts in general have this quality. Fonts from Ourtype, Gerard Unger, Enchede &amp; so on seem to embody this quality. But the Apolline seems to deemphasize some of this rhythym which seems somewhat chirographic in origin to gain some additional melody. My musical analogy may not be right, and my observation may be poor, and finally I could be wrong about the way in which these two elements interact. But thats the way it seems to me. Any comments?</p>
