      <p>I don't think writing with a pen has as much bearing on literacy as it used to.<br>
      There was the Scandinavian discovery recently that teaching writing by going from printed block letter, to keyboarding, followed by script writing, worked very well, not missing anything irrevocably. That would suggest that keyboarding is fully adequate.</p>
      <p>However, what pen/pencil writing provides is an expressive richness. Typography has picked this up, particularly with its riff on the broad nib. That's what we generally understand by chirographic, but there are other expressive aspect of writing which typography has not captured, namely speed and pressure.</p>
      <p>Speed is the deliberative quality of writing, and is apparent in the writer's choice of shortcuts, truncations, and ligatures. Pressure has been parsed, in a way, by the "upstroke thin, downstroke thick" convention of the broadnib-based contrast in types, but that's a slow, stilted version of what happens. The importance of pressure is something I noticed in trying to make a script font from pencil writing, it cries out for a tonal axis.</p>
      <p>The expressive quality of writing is recognized by graphologists -- a derided area of expertise and inquiry which could be useful to script fontmakers.</p>
      <p>It's interesting that the OpenType script fonts now emerging (using contextual alternates) follow established formal genres. These are formalisms that have been successfully established for commercial lettering genres, or type treatments (both metal and typositor).<br>
      There's an opportunity to use digital media to take another crack at making fonts from writing, just as moveable type originally did. It's something I'm contemplating doing, using contextual alternates, but a tonal axis is out of my reach, although I recall that Frank Jonen has done some research in this area.</p>
