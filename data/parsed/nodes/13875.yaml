      <p>Hrant: <em>So I’ve decided to go with “dichography”, since “dicho” means -or at least can mean- something like “one thing split into two”.</em></p>
      <p>I think you are focusing on the wrong part of the word. We already have a distinction between chirography and typography. Noordzij wants to suggest that the distinction is minimal because both are writing (γράφος). So it is the '-graphy' part of the terms on which you should be focusing your attention. I first suggested the term chirography to you because you had been using 'calligraphy', which is a formal aesthetic subset of chirography.*  The distinction between 'writing by hand' and 'writing with type' is perfectly expressed in the terms chirography and typography, and I don't think a new term is necessary in this regard.</p>
      <p>What you are talking about, Hrant, is not writing at all, but a design process for making the individual units of typography. Throughout most of the past 550 or so years, type has come in a sense 'after writing' (i.e. after chiropgraphy), and you are seeking a kind of type that comes 'before writing' (i.e. before typography), and which begins not with writing but with reading. So I would say that, terminologically, what you are talking about has nothing to do with γράφος at all.</p>
      <p>The distinction you want to make is between what you consider 'chirographic type design'** and what I would be tempted to call 'anagnostic type design', from the Greek verb to read. [The equivalent to the Roman order of Lector in the Orthodox Church is the Anagnost.]</p>
      <p>* I think a good argument could be made that 'calligraphy' could refer equally well to a formal aesthetic subset of <em>typography</em>, since it is the formal aesthetic element that defines calligraphy, not how it is made. The new terms chirocalligraphy and typocalligraphy are etymologically obvious.</p>
      <p>** As we've discussed before, I think there is very little purely chirographic type design out there. I think it was Peter Enneson who, on the ATypI list, suggested that most type design was 'parachirographic'. I'm still trying to figure out how to complete the t-shirt slogan 'Parachirogaphers do it with...'</p>
