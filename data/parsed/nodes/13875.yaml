      <p>&gt; What you are talking about, Hrant, is not writing at all, but<br>
      &gt; a design process for making the individual units of typography.</p>
      <p>Indeed. But I can't really call that "typography", can I?</p>
      <p>I'm open to using a suffix other than "-graphy", although I have to point out that its meaning can be a lot looser/broader than something related to writing.</p>
      <p>I actually thought of finding a term related to reading. But I think that's too "intent-centric". It would be better to have an "action-centric" term, something that describes how the stuff is actually made. After all, we are saying "chirography", not "individual-expression-of-creative-control-graphy" or something! :-)  I worry that a reader-based term will be too theoretical, too prone to dismissal by people who say "you don't really know how we read*, so your term can't be any good". Don't you think an activity-based term would be better?</p>
      <p>* And being partly right in saying so!</p>
      <p>&gt; 'parachirographic'</p>
      <p>Yeah, that was hot.</p>
      <p>I agree that chirography (like any concept, really) cannot exist in a pure state (maybe not even in actual writing by hand, since even things like the paper texture play a role). But the way you think of things certainly affects the way you make things. Like look at that nutsy "y" in Unibody-Bold.</p>
      <p>hhp</p>
