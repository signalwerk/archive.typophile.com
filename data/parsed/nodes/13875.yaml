      <p>I thought it might be of interest to insert two quotes by Adrian Frutiger; one on the deliniation of white/black inside/outside space, and one on how chirographic tools affect his abilitity to design. Oddly enough, both are from the same interview.</p>
      <p><strong>ADRIAN FRUTIGER</strong><br>
      Excerpts from an interview with<br>
      Marcelle Charriere, “<em>Information TG</em>” 1970<br>
      English translation by Helen Reshetnik and Pam Manfried, Mergenthaler Linotype Co.</p>
      <p>Q: <em>Have a number of concepts or ideas governed the creation of your typefaces?</em><br>
      <strong>A: Certainly, I feel, for instance, that the inside white spaces are more important than the outside contours of a letter.<br>
         The letters of an alphabet are like the various elements of a house; the material of typography is the black, and it is the typographer’s task, with the help of this black, to capture space, to create harmonious whites inside the letters as well as between them.</strong></p>
      <p>Q: <em>And your Indian typefaces, do they arise from the same concepts?</em><br>
      <strong>A: The Indo-Germanic connection is well-known; and, most important, the writing tools used in India for centuries resemble our own quite closely. The Indians use the pen, the reed pen. I would be unable to design Chinese type characters because I am accustomed to working with a pen, not with a brush.</strong></p>
