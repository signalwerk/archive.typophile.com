    <p>Hi All,</p>
    <p>One of the students that works in my office asked for my help putting a certificate of appreciation together, and I wanted to get some good typophile input first. I've seen plenty of such certificates, but none that were actually thoughtfully put together.</p>
    <p>So what kind of typography is appropriate for such a certificate?</p>
    <p>Thanks for any thoughts on the matter.</p>
    <p>-Casey</p>
