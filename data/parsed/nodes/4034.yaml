    html: <p>I didn't realize there was a difference in the number of weights. <br> <br>The fact that Unger is indeed a "proven talent" is certainly a positive, but wasn't he that when he made the original Swift? How much can you improve an already superb font without making drastic changes? And are individuals not susceptible to versionitis? <br> <br>hhp <br></p>
