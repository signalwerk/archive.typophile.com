    html: <p>The 2.0 version is he most complete and looks very good to me. I ordered it today. I have seen an readingtest from the site of Gerard Unger (<a href="http://www.gerardunger.com/fontstore/store-howto.html" target="_blank">http://www.gerardunger.com/fontstore/store-howto.html</a>) and it looks great.  <br>As Hrant says an PS version is in my case the best I think. I have been told that in mei this year the OT font is coming up but unfortunately I can't wait for that. The project is starting soon where I am working on.  <br> <br>Thanks everybody for thinking with me. <br> <br>Nicolien</p>
