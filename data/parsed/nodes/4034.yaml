    html: <p>&gt;How much can you improve an already superb font without making drastic changes? <br> <br>Here are a couple of other improved versions. The refinements in Minion Pro, compared to Minion, to me made a big difference, even though they are minute. The serifs are a little bit heavier and the round letters narrower. <br> <br>The big Optima Nova project I think is wonderful. It really improved the weight of Optima for digital setting. I don't know about the other re-dos for Linotype, such as by Frutiger; it would be interesting to have somebody to do a survey of these 'second time around' efforts. My guess would be that they would be significant improvements.  </p>
