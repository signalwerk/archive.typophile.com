  - id: 30123
    user: null
    date: null
    date_raw: null
    votes: null
    html: "<p><i>The fact that Unger is indeed a \"proven talent\" is certainly a positive, but wasn't he that when he made the original Swift? How much can you improve an already superb font without making drastic changes? And are individuals not susceptible to versionitis?</i> <br> <br>Did Gerard personally digitise or directly oversee the manufacture the original Swift? I doubt it. Swift 2.0, apart from the obvious benefit of the extension of the range of weights, might be likened to a 'director's cut': you're getting Swift the way the creator of Swift wants you to have it. This is not to say that some people might not be perfectly happy with the earlier version, or even prefer it. However, if I wanted Swift for a job, and the budget permitted, I would go for Gerard's version. Among other (non-drastic) changes, I believe the spacing is improved.</p>"
    html_clean: "<p><i>The fact that Unger is indeed a \"proven talent\" is certainly a positive, but wasn't he that when he made the original Swift? How much can you improve an already superb font without making drastic changes? And are individuals not susceptible to versionitis?</i> <br> <br>Did Gerard personally digitise or directly oversee the manufacture the original Swift? I doubt it. Swift 2.0, apart from the obvious benefit of the extension of the range of weights, might be likened to a 'director's cut': you're getting Swift the way the creator of Swift wants you to have it. This is not to say that some people might not be perfectly happy with the earlier version, or even prefer it. However, if I wanted Swift for a job, and the budget permitted, I would go for Gerard's version. Among other (non-drastic) changes, I believe the spacing is improved.</p>"
