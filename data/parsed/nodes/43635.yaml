      <p>To start, the 4 is Bodoni, or some clone...</p>
      <p>Zerkalo-Stalker looks like a faux-italic (ultra-slanty), squooshed garamond (hook at the end of the leg of lowercase k)</p>
      <p>It's not AG bold condensed (descender on y is too stubby, arm on k doesn't look right). Perhaps Helvetica Black Condensed?<br><a href="http://www.linotype.com/12573/helveticablackcondensed-font.html">http://www.linotype.com/12573/helveticablackcondensed-font.html</a></p>
