    <p>Hello<br>
    I'm trying to find the four typefaces used on this series of Tarkovsky soundtrack CDs released by Toei Music Publishing (Japan) in the mid-1990s.</p>
    <p>•&nbsp;The italic used for the film titles – "Zerkalo" and "Stalker".<br>
    •&nbsp;The bold condensed grotesk used for "Andrey Tarkovsky" (possibly Akzidenz Bold Condensed?)<br>
    •&nbsp;The glittery number "4"<br>
    •&nbsp;The typewriter font used for the glittery Cyrillic version of "Tarkovsky"</p>
    <p>I have a couple more images from other CDs in this series if anybody needs extra letters or numbers to work with, but they are a bit more blurry than this one.</p>
    <p>I know it's a lot to ask, so thanks in advance.</p>
    <p>Andrew</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/iz_69_3_orig_3767.jpg"></div><p></p>
