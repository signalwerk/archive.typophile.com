    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Superfamily</strong></p>
    <p>A superfamily is a set of <a href="/node/16843" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">typefaces</a> released under a common trade name that combines several <a href="/node/16845" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">families</a> across stylistic classes. Members of a typeface superfamily differ not only in <a href="/node/14703" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">weight</a>, <a href="/node/add/wiki?edit%5Btitle%5D=width" title="Create node &quot;width&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">width</a>, <a href="/node/add/wiki?edit%5Btitle%5D=inclination" title="Create node &quot;inclination&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">inclination</a>, <a href="/node/32404" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Optical Size</a> and <a href="/node/add/wiki?edit%5Btitle%5D=character%20set" title="Create node &quot;character set&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">character sets</a>, but also in other design characteristics such as stroke modulation and treatment of serifs — but still share certain other characteristics such as proportions, which allows them to work together. <span class="caps">ITC</span> Stone Sans, <span class="caps">ITC</span> Stone Serif, <span class="caps">ITC</span> Stone Informal and <span class="caps">ITC</span> Stone Humanist are four families that form a&nbsp;superfamily.</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/21412">Multi-font Families?</a><br><a href="http://typophile.com/node/28187">Family that Contains Both Serif and Sans Serif</a><br><a href="http://typophile.com/node/29942">Poll: The best term for a type family that includes both serif and sans serif fonts is?</a><br><a href="http://www.typophile.com/node/35727">How Related are Members of Type Families?</a><br><a href="http://typophile.com/node/39843">Type Terminology: Sytems? Suites? Super&nbsp;Families?</a></p>
    <p><strong>Additional Articles:</strong><br><a href="/node/39833" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Superfamilies</a> (listing of superfamilies)<br><a href="http://www.typotheque.com/articles/my_type_design_philosophy.html">My Type Design Philosophy</a> by <a href="/node/31193" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Martin Majoor</a><br><a href="http://www.typeculture.com/academic_resource/articles_essays/pdfs/tc_article_25.pdf">Serial Type Families</a> (<em><span class="caps">PDF</span></em>) by <a href="/node/12254" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Alejandro Lo Celso</a><br><a href="http://www.fonts.com/AboutFonts/Articles/FineTypography/Super+Families.htm">fy(t)i: Super Families</a><br><a href="http://www.fontshop.com/virtual/newsletters/jun2006_b/">Serif/Sans Families at FontShop</a><br><a href="http://www.fontshop.com/fontlist/super_families/">List of Superfamilies with&nbsp;Samples</a></p>
