    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Superfamily</strong></p>
    <p>A superfamily is a set of <a href="/wiki/typeface" class="freelinking" rel="nofollow">typefaces</a> released under a common trade name that combines several <a href="/wiki/family" class="freelinking" rel="nofollow">families</a> across stylistic classes. Members of a typeface superfamily differ not only in <a href="/wiki/weight" class="freelinking" rel="nofollow">weight</a>, <a href="/wiki/width" class="freelinking" rel="nofollow">width</a>, <a href="/wiki/inclination" class="freelinking" rel="nofollow">inclination</a>, <a href="/wiki/optical%20size" class="freelinking" rel="nofollow">optical size</a> and <a href="/wiki/character%20set" class="freelinking" rel="nofollow">character sets</a>, but also in other design characteristics such as stroke modulation and treatment of serifs — but still share certain other characteristics such as proportions, which allows them to work together. ITC Stone Sans, ITC Stone Serif, ITC Stone Informal and ITC Stone Humanist are four families that form a superfamily.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/21412" rel="nofollow">Multi-font Families?</a><br>
    <a href="http://typophile.com/node/28187" rel="nofollow">Family that Contains Both Serif and Sans Serif</a><br>
    <a href="http://typophile.com/node/29942" rel="nofollow">Poll: The best term for a type family that includes both serif and sans serif fonts is?</a><br>
    <a href="http://www.typophile.com/node/35727" rel="nofollow">How Related are Members of Type Families?</a><br>
    <a href="http://typophile.com/node/39843" rel="nofollow">Type Terminology: Sytems? Suites? Super Families?</a></p>
