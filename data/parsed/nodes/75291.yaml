    html: |-
      <p>Daniel,</p>
      <p>as you already released this font, the proper place to post was Release section. Anyway, as you did post here, I suppose you are asking for some critiques in order to improve future versions of Ataxia.</p>
      <p>Your Roman resembles a lot Guardian Text and Cordale –and, in a minor degree, Enclave. I like these fonts, especially Guardian. So I also like your overall design. But there are some problems you may address:</p>
      <p><strong>01</strong>. bar in |t| and |f| are very big. This disrupts the equibilium of the glyph. |t| could be a bit shorter at right, but |f| needs mode reduction.</p>
      <p><strong>02</strong>. |g| would benefit with more space between upper and bottom ellipsis. I did this error in my onw <a class="freelinking external" href="http://typophile.com/node/67787" rel="nofollow">font</a> and a fellow Typophiler pointed me the problem this brings in small sizes. As you have very good counterspaces, it's easy to reduce a bit the bottom orey to get more air at the center.</p>
      <p><strong>03</strong>. straight cut on top of |q| stem is a bit strange, it does not combines with other elements.</p>
      <p><strong>04</strong>. middle bar in |F| is OK, but it becomes very short in |E| due to the bottom bar.</p>
      <p><strong>05</strong>. almost all curves and connections are good and well designed. But the bottom curve of |C| is still not there, its thick variation does not follows overall curves.</p>
      <p><strong>06</strong>. cedilla is very much ellaborated to Ataxia general style. You can try a simpler shape.</p>
      <p><strong>07</strong>. tilde is excellent. The same with acute/grave. I also like these diacritics positioning. But dieresis must have more gap between dots and Hungarumlaut must have less. Breve needs to be bolder. I cannot evaluate other diacritics at the size of your images. But it seems ogonek and eng leg are going beyond descender line, which is not correct.</p>
      <p>About italics, I second Kevin (Cerulean) and Joerg opinion. I particularly dislike the cut you applied to external curves in |e|k| and descenders. This straight cut is out of the normal fluidness of glyph shape. I don't see a reason to this cut, which is far from the other design elements.</p>
      <p>Closed descenders in italic |g|y|z| are also strange. Ataxia has a rational design, almost without calligraphic or decorative elements. But these lassos are typically calligraphic and brings some deco. Thus, they become like strangers in your design.</p>
      <p>Although I pointed several issues, I did like Ataxia. It could be improved and become a great contemporary serif.</p>
