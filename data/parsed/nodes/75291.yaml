      <p>Hmmm, I think it would be easier to critique constructively if it wasn’t released yet…</p>
      <p>I agree about the italic looking awkward in some details. The vertical cuts seem very distracting and the italic /e/ looks condensed in comparison to, e.g. the /a/.</p>
      <p>As far as I know the hollow areas are a common problem that occurs when two (non-joined) closed vector shapes overlay and are exported as a pdf.</p>
