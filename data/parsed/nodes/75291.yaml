    html: |-
      <p>The roman is generally all right, but there is a rigid awkwardness that pervades the italic. The loops in particular seem like a strange decision. But I guess it would not be a productive suggestion to change the whole look of it after release.</p>
      <p>Some mistakes in the extended Latin set: Ł requires a diagonal stroke. The strokes of đ and ħ should cross through the ascenders. ŋ should not have a serif interrupting the descender. It seems you have somehow confused lowercase ľ with capital Î.</p>
