    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Christopher Slye</strong></p>
    <p>Christopher Slye designed the Elmhurst type family, which was released by <a href="/wiki/The%20Font%20Bureau" class="freelinking" rel="nofollow">The Font Bureau</a> in 1997 as he began his career at <a href="/wiki/Adobe%20Systems" class="freelinking" rel="nofollow">Adobe Systems</a>. Although most of his work at Adobe has been he has helped design extensions for <a href="/wiki/Myriad" class="freelinking" rel="nofollow">Myriad</a>, <a href="/wiki/Tekton" class="freelinking" rel="nofollow">Tekton</a>, and other <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a> Originals typefaces.</p>
