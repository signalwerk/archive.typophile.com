    <p>Christopher Slye designed the Elmhurst type family, which was released by <a href="/node/13730" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">The Font Bureau</a> in 1997 as he began his career at <a href="/node/16058" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adobe Systems</a>. Although most of his work at Adobe has been he has helped design extensions for <a href="/node/28658" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Myriad</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Tekton" title="Create node &quot;Tekton&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Tekton</a>, and other <a href="/node/13428" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adobe</a> Originals&nbsp;typefaces.</p>
