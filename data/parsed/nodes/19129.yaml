    <p>Dear typographers &amp;c.,</p>
    <p>I’m working on my first book design, which is a dissertation on a subject in (the history of) military science. Although I’ve read my Bringhurst and these forums, I’m having trouble deciding on a typeface. The writer himself has only one demand: that the text be legible, which for him implies rather heavy/dark. </p>
    <p>His writing style is somewhat old-fashioned; perhaps, a little dry too. Should I support the character of the text with a classy but ’boring’ Garamond or Minion? Or would it be better, instead, to liven up the text with something more modern, exciting and quirky, like Quadraat or Dolly?</p>
    <p>So, do you have any suggestions for a serif typeface that, in order of importance<br>
    (1) is suitable for setting long text (the book will be about 400 pages in size)<br>
    (2) has nice small caps for headings and nice italics (which are used quite extensively)<br>
    (3) has something of a ’military’ feel to it (this should, of course, not be overdone)</p>
    <p>Thank you in advance for any help you can give me.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/19190" class="topic-previous" title="Go to previous forum topic">‹ Sonopa—Evolution of a Typeface</a> <a href="/node/17772" class="topic-next" title="Go to next forum topic">Why is a zero often very contrast-less? ›</a></div>
