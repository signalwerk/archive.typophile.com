      <p>What exactly are the pros of using OpenType fonts?</p>
      <p>Well, it depends on the fonts, but usually more extensive ligatures, kerning between the small caps and the roman, the superiors, fractions and the like. Switching to “expert sets” for some characters often breaks spellchecking. Better language support means you’re less likely to be in trouble when you discover the Czech name in your English text.</p>
      <p>I set a book in Warnock, because I needed the Greek, and I was very pleased with it.</p>
