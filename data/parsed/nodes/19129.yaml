      <p>John, I’ll be using InDesign. What exactly are the pros of using OpenType fonts, considering I’ve already set up separate character styles for small caps and the like, which can easily be switched back and forth between OpenType and Postscript variants?</p>
      <p>Bulmer I find not adventurous enough. Kepler I like, but not so much its commas and quotation marks. Whitman and Walbaum are interesting options. </p>
      <p>Pataline, <a href="http://www.underware.nl/site2/index.php3?id1=dolly&amp;id2=overview">Dolly</a> (not OpenType, by the way) is one of the fonts I’m considering. I really like its lively character, which indeed might work to make the dry text a bit more exciting. On the other hand, don’t you think Dolly (<a href="http://www.underware.nl/download/dolly/pdf/Dolly.pdf">example pdf</a>) is too happy and friendly a typeface for serious subject matter such as war and its history?</p>
      <p>I’ve also come across Slimbach’s Warnock. Would that be acceptable, keeping in mind the subject of the book? I guess Cronos is a good sans companion?</p>
