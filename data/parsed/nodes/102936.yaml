  html: |-
    <p>I am interested in having my vector designs turned into functioning fonts. I would like to outsource this part of the job though. The font I have designed is quite simple. I am hoping someone can direct me toward someone reputable. The fonts are odd and geometric, and wouldn't require pinpoint perfection.</p>
    <p>No doubt this has been asked about before, but I wasn't able to find a thread. If so please drop me a link.</p>
    <p>Thanks so much,</p>
    <p>Russ</p>
