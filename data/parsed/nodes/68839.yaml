    html: |-
      <p>"x.alterSchwede" was a joke. Name the substituted character or class as you want, r.alt or r.fina for example.</p>
      <p>Minion is an Adobe font. And the AFDKO is the abbreviation for Adobe Font Development Kit for OpenType, that is available for free. You can download the AFDKO and the Minion feature file at "http://www.adobe.com/devnet/opentype/afdko/".</p>
      <p><cite>What needs to be changed in the code if I want to make a start swash or a swash that comes up only after specified character?</cite></p>
      <p>That is answered on page 860 of the FontLab manual (Context Dependent Substitutions).</p>
      <p><cite>What's the point in studying the code if you don't know the language</cite></p>
      <p>I don’t think, that it is possible to learn a programming language without studying code parallel. In case of OpenType I am even not sure, if the feature file syntax is a language.</p>
