    html: |-
      <p>Phoenixed</p>
      <p>That’s explained in the FLS manual. Read it, please.</p>
      <p>sub x' y z by x.alterSchwede</p>
      <p>If x is followed by y and z, it will be substituted. And x, y, z and x.alterSchwede can be single characters, lists of characters (in brackets) or classes (@classname) or lists of classes (in brackets). But it is better explained in the manual. You will not learn, if you don’t try to solve problems by yourself at first. If anything does not work, you can still ask. And I recommend to study the feature files, that Adobe provides for Minion (along with the AFDKO, as far as I remember).</p>
