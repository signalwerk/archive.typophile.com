    html: |-
      <p>Make sure you're updating the kern feature before exporting. In Tools - Kerning Assistance - Update [kern] feature.</p>
      <p>One other thing to remember - the kern feature only works if there is another OpenType feature in the font.  Simple enough to put in liga - sub f i by fi.</p>
      <p>Then when you export it will say something like, 'kerning has changed.... blah blah blah'</p>
      <p>Click yes</p>
