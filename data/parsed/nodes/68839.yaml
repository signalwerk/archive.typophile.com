    <p>Hi! My very first post - logged in because of this question.<br>
    I want to make the following rule in OT font: </p>
    <p>(in human language) If the word ends with "r", it should be substituted with "r.alt"</p>
    <p>So far I've been trying to understand FL manual, search this forum and google for tutorials, but with no luck at all.</p>
