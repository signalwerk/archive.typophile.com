    html: |-
      <p><cite>Could you tell more about it?</cite></p>
      <p><a href="http://www.microsoft.com/typography/otspec/features_fj.htm#fina" title="http://www.microsoft.com/typography/otspec/features_fj.htm#fina">http://www.microsoft.com/typography/otspec/features_fj.htm#fina</a><br>
      and<br>
      <a href="http://www.typotheque.com/fonts/opentype_feature_support" title="http://www.typotheque.com/fonts/opentype_feature_support">http://www.typotheque.com/fonts/opentype_feature_support</a></p>
      <p>In the German version of Indesign CS3 it can be activated by "Opentype/Positionalform/Finalform".</p>
      <p>And I think this should be the code:<br>
      ignore sub r<strong>'</strong> …<br>
      sub r<strong>'</strong> by …</p>
      <p>As far as I remember, it does not work if <strong>'</strong> is missing in the substitution rule because of the ignore rule with the "context indicator" (<strong>'</strong>) in it.</p>
