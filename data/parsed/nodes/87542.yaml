      <p>Hi André;</p>
      <p>Older versions of the FDK are not posted for download. I could recover an installable version of 1.6, but I think it would be a lot less work to make your features file work with 2.5. I can guarantee that the useExtension directive does work under 2.5, and that if the font can be *correctly* built with 1.6, it can also be built with FDK 2.5. Please send me the error log from the makeotf run, and I'll see what I can figure out (<a href="mailto:rroberts@adobe.com">rroberts@adobe.com</a>).</p>
      <p>- Read Roberts</p>
