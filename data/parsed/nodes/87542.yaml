      <p>It turns out that my original assessment was incorrect (Karsten's comment clued me into this since I'd already tried that to no avail, and if that didn't work, there's no reason to think breaking the feature up should matter).</p>
      <p>It turns out I'd made a rather foolish mistake -- I'd performed this experiment on the *wrong* version of the font, and was dealing with a shorter set of code. Here, breaking up the container feature made a difference, but the reason for this turns out to be less than mysterious.</p>
      <p>I'd started out with a single container feature, <code>AGIT</code>, which I'd broken into <code>AGIT</code> and <code>AGI2</code>, which contained roughly the same amount of code. I'd forgotten, though, that the feature file began with:</p>
      <p><code>feature aalt {</code><br>
      <code>&nbsp;&nbsp;&nbsp;&nbsp;feature AGIT;</code><br>
      <code>} aalt;</code></p>
      <p>Since <code>AGIT</code> was now roughly half as long, it's no wonder the GSUB table shrank.</p>
      <p>When I return to the .vfb I'd intended to work with, I get the same problem -- a single <code>useExtension</code> is needed in FLS 5.0.4/FDK 1.6 but no amount of <code>useExtension</code>s will prevent overflows in FLS 5.1/FDK 2.5</p>
      <p>However, this seems to be restricted to this one file. I'd thought it extended to some other files as well, but it turns out the problem was solvable in these. It seems that FDK 2.5 produces longer GSUB code than FDK 1.6 by around 25%. So, except for my single problematic .vfb, <code>useExtension</code> will correct overflows, but it needs to be added to more lookups. After finding the problem wouldn't go away in my one file, I gave up too easily on the others rather than continuing to add <code>useExtension</code> until I was able to compile.</p>
