      <p>After some additional hair-pulling I've discovered (fingers crossed) the source of my problem, though I'm still a bit mystified as to why FLS 5.0.4 and FLS 5.1 are behaving differently.</p>
      <p>In my original font (begun pre FLS 5.1), I'd tried to get around the lack of standalone lookups in FDK 1.6 by defining all of my lookups in a single, unregistered dummy feature at the beginning of my feature list, and then simply using lookup references in all my actual feature definitions.</p>
      <p>I've discovered that if I split this dummy feature into two (or more) dummy features, suddenly I can solve my offset overflow problems with useExtension. Apparently, FLS 5.1 chokes if the combined size of lookups *within a single feature block* exceeds a the size of a 16-bit offset.</p>
      <p>I don't understand *why* it cares whether the lookups are declared within a single feature block or not, but apparently it does.</p>
      <p>André</p>
