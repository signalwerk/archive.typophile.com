    <p>Hi please could you help me identify the font in this Jurassic park poster which reads,</p>
    <p> ' An adventure 65 million years in the making'</p>
    <p><a href="http://3.bp.blogspot.com/-LoXqjF5hRRg/T-X_qLgpYXI/AAAAAAAACok/hQuJBvXTNMs/s1600/1993-jurassic-park-poster1.jpg">http://3.bp.blogspot.com/-LoXqjF5hRRg/T-X_qLgpYXI/AAAAAAAACok/hQuJBvXTNM...</a></p>
    <p>Its pretty similar to Times new Roman but I'm looking for something with numerics more like this on the poster.<br>
    I am almost certain that I have, seen/used it recently but its name has totally escaped me.</p>
    <p>many thanks :)<br>
    Steve W</p>
