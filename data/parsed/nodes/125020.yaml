    date_raw: 8 December 2016 - 3:39am
    votes: 3
    html: |-
      <p>I'm really so happy and excited that Typophile came back.</p>
      <ol><li><strong>Voting</strong> which may remove the need for repeating the same replies by simply upvoting those that one agrees with. Although this voting should have some more meaning related to it. Replies that have higher upvotes should become <em>visually more prominent</em> (not by changing replies order) compared to those that may even receive downvotes.</li>
      <li>And even though this site became very mobile friendly I don't like the non responsive approach because its <strong>usability on desktops</strong> is now very much hindered. It should at least limit it's content width. Nowadays designers having huge displays with huge resolutions makes this page lets just mildly put it <em>unreadable</em>.</li>
      <li><strong>No support for markdown?</strong> These days many sites where users add formatted content use markdown instead of HTML tags. Markdown is so much simpler, a whole lot quicker to type and simple for server side processing. It would be great if you'd support MD formatting. If MD is not something you'd like to support then at least implement keyboard shortcuts for <code>Ctrl+B</code>, <code>Ctrl+I</code> etc. which would insert tags into types content either at caret position or around selection. This is a rather simple thing to do.</li>
      <li><strong>Formatted preview</strong> can be enabled but it will only display what's been typed and won't auto update if one continues editing. <em>Update button</em> is also placed after content instead of below edit box.</li>
      </ol><p>About the keyboard shortcuts this code might help a bit. Very simple and does the trick pretty well...<br><code>$(function() {<br>
          var keys = {<br>
              b: "strong",<br>
              i: "em",<br>
              k: "code",<br>
              open: function(tag) { return "&lt;" + tag + "&gt;"; },<br>
              close: function(tag) { return "&lt;/" + tag + "&gt;"; }<br>
          };<br>
          $("#message-input")<br>
              .off("keyup")<br>
              .on("keyup", function(evt) {<br>
                  if (!keys[evt.key] || !evt.ctrlKey) return;<br>
                  evt.preventDefault();<br>
                  var head = this.selectionStart;<br>
                  var tail = this.selectionEnd;<br>
                  var left = this.value.substr(0, this.selectionStart);<br>
                  var mid = this.value.substring(this.selectionStart, this.selectionEnd);<br>
                  var right = this.value.substr(this.selectionEnd);<br>
                  this.value = left + keys.open(keys[evt.key]) + mid + keys.close(keys[evt.key]) + right;<br>
                  var shift = keys[evt.key].length;<br>
                  this.selectionEnd = tail + shift + 2;<br>
                  this.selectionStart = head + shift + 2;<br>
                  $(this).trigger("input");<br>
              });<br>
      });<br></code></p>
