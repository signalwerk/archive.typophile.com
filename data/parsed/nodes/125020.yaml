  html: |-
    <p>It's been a long, arduous road back, but we hope you're as excited as we are!</p>
    <p>So what's the new Typophile all about? </p>
    <p>First and foremost, all the archives have been preserved and we've even worked hard to ensure that URLs have remained as consistent as possible. You'll find old Forums content now grouped under an appropriate Community. </p>
    <p>Typophile has all always been about community. It's the relationships and conversations we've built together over years that has made Typophile what it is, so we've decided to double down on community. To this end, we've done a few things. </p>
    <p><strong>Home. Optimized for mobile</strong><br>
    We wanted to encourage quick and easy sharing, so we've built a status engine that gives you up to 329 characters (ahem, Latin 1 + 2 if you're curious) to share a thought, link, or picture. Snapping found type and posting from your phone just got really easy.</p>
    <p>Got a few free moments? The new Typophile makes it even easier to scroll through updates and see what people are up to. </p>
    <p><strong>Goodbye Forums. Hello, Communities</strong><br>
    We are declaring the message board format dead and welcome Communities in their place. Active topics across all communities rise to the surface, allowing you to graze and discover new communities that pop up.  </p>
    <p>Anyone can start a community! We hope that the new system encourages lots of meaningful groupings and activity. </p>
    <p><strong>Always Improving</strong><br>
    Despite the unfortunate hiatus, our commitment to Typophile remains stronger than ever. To that end, if you encounter bugs or design glitches, check the <a href="http://www.typophile.com/node/125021">known issues</a> and add it in the comments.</p>
