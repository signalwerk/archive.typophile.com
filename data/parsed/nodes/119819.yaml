    html: |-
      <p>photosynthesize, the debate about whether art can and should be considered separate from the artist exists in most media (I've debated it mostly in the world of fine art). I don't think it's silly at all.</p>
      <p>Nor do I have a definitive pronouncement on the subject. Short of supporting an artist's ongoing and active malfeasance, I think people can and should decide for themselves whether to appreciate the art on its own merits, and to determine their own criteria for appreciation.</p>
      <p>If using Eric Gill's typefaces makes you uncomfortable, there are plenty of other options out there.</p>
