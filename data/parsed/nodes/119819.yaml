      <p>Check out House Industries Chalet series, specifically London 1960, London 1970 and London 1980, for a retro-inspired series of typefaces:<br>
      <a href="http://www.houseind.com/fonts/chalet" title="http://www.houseind.com/fonts/chalet">http://www.houseind.com/fonts/chalet</a></p>
      <p>Another good resource is <a href="http://www.fontsinuse.com" title="www.fontsinuse.com">www.fontsinuse.com</a>, which breaks out type use by industry (including fashion). Sadly, not all samples are dated and the search function beyond the main categories is a bit clunky, but it may prove useful--and amusing.</p>
      <p>Also good (collection is grouped by decades):<br>
      <a href="http://www.advertisingarchives.co.uk/en/page/show_home_page.html" title="http://www.advertisingarchives.co.uk/en/page/show_home_page.html">http://www.advertisingarchives.co.uk/en/page/show_home_page.html</a></p>
