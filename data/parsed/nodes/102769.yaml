    html: |-
      <p>ok, the sans-serif is FF Clan Narrow Black.<br>
      it's hard to identify the serif for one who doesn't know it as the picture is quite small.</p>
      <p>try <a href="http://www.myfonts.com/WhatTheFont/" title="http://www.myfonts.com/WhatTheFont/">http://www.myfonts.com/WhatTheFont/</a> or <a href="http://www.identifont.com/" title="http://www.identifont.com/">http://www.identifont.com/</a><br>
      or ask/google the publisher. </p>
      <p>I mean, this requires time.</p>
