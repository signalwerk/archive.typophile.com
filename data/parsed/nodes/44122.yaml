    html: <p>I was wondering if I’d enjoy <em>Little Miss Sunshine</em>. There were parts that were trying too hard. For instance, the son reads Nietzsche but when he finally expresses his anger at the world (the 2 times actually) his vocabulary is reduced to a bunch of 4 letter words. I’d have assumed he’d be able to be more articulate. The little girl was adorable though and the point made by the entire movie was nice.</p>
