    html: |-
      <p>This is very polished. Nice work! I employed the same serif detail in a text face I designed called <a href="http://www.aquatoad.com/portfolio.php?section_id=3&amp;subsection_id=5&amp;portfolio_id=24" rel="nofollow">Eason</a>. Although I reversed the "pen" action for a more forward motion, though you accomplish this with flaring the stems. Not sure it matters much at text sizes. Here are some pointers, much of it preference:</p>
      <p>1. I wonder if the bowl and counter of the a shouldn't be more equally balanced.<br>
      2. crossbar of the F could come down a hair compared to E and right serif could be lengthened.<br>
      3. For a book type you may want a smaller x height (making the ascenders and descenders longer serves the same purpose).</p>
    html_clean: |-
