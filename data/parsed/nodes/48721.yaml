      <p>Semele, is basically a very beautiful typeface, and its name is very well chosen and quite symbolic.</p>
      <p>It does need some more enhancing along the lines that Randy and Guifa suggested. I do have some suggestions myself.</p>
      <p>In the Semele Light Roman</p>
      <p>The ‘o’ I believe that it should stay as you designed it originally.</p>
      <p>The middle bar of ‘E’ and ‘F’ is charmingly novel and well thought of, I would use something similar in ‘f’ and t’ and in the florin.</p>
      <p>The leg in capital ‘R’ could have also been designed like the leg in ‘K’. If you keep is as it is then this particular curvy stroke must be redesigned to look somehow more calligraphic and or more uniformly drawn. </p>
      <p>The tail of ‘Q’ could be mad a little more emphatic, maybe longer and more horizontal.</p>
      <p>I agree with Randy about the ‘a’, a.5 definitely is the best. </p>
      <p>Numeral ‘6’ looks a bit crude compared to the well designed and balanced ‘9’, also the bowl in ‘6’ should be 15-25 em higher than it is.</p>
      <p>Numeral ‘3’ needs skewing 2-3 units to the right as it looks as if it is tilted to the left.</p>
      <p>Numeral ‘2’ the curve-stroke part that joins with the horizontal bar at the baseline could be improved a little more.</p>
      <p>That’s all for the moment. </p>
      <p>I am quite eager to take a look at the SemeleGreek, the roman and the Italic, could you please post them if they are ready. Also post the Semele Italic when you finish the alterations that Guifa suggested, so that I take a good look at it.</p>
