    html: <p>I like this; it's very elegant. I noticed one small problem, though. The capital theta symbol (03F4) in your PDF looks the same as the ordinary Theta. It has to be clearly distinct, and it's generally expected to have a full-width crossbar. It is intended for use by mathematicians, who (bless their hearts) like to use two different shapes of the same letter as semantically distinct symbols in the same document.</p>
