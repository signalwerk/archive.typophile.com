      <p>Natasha hi, </p>
      <p>I have just noticed that you have been asking Nymus about the lunate sigmas and epsilons. I had some free time so I went to google and look what I found for you:</p>
      <p>Lunate Sigma<br>
      <a href="http://www.tlg.uci.edu/~opoudjis/unicode/letters.html" title="http://www.tlg.uci.edu/~opoudjis/unicode/letters.html">http://www.tlg.uci.edu/~opoudjis/unicode/letters.html</a><br>
      U+03F2 Greek Lunate Sigma Symbol [ϲ]; U+03F9 Greek Capital Lunate Sigma Symbol [Ϲ]<br>
      History<br>
      While in the 4th century BC literary papyri still used the ancient angular sigma (Thompson 1912:107), the cursive lunate form had taken over competely by the next century, where it stayed as the unique form of the sigma until the invention of lowercase in the 8th century—and as the capital sigma, for a millenium longer.<br>
      The form is called lunate, of course, because it looks like a crescent. Lest my defence of monotonic make me look completely unlettered, let me take this opportunity to reject Haralambous' gloss (§4.2.4) of lunate into Modern Greek as σεληνιακό. That means "lunar", and you can be sure that the lunate wasn't the form of sigma used in the Apollo program. The classical term is μηνοειδής; but since that will make Modern Greek speakers scratch their heads and ask "looks like a month?" (or worse, "looks like Menna, patron saint of Crete?"), one can certainly used σεληνοειδής. This is the post-classical word with which μηνοειδής is glossed in Byzantine dictionaries (Hesychius, Lexica Segueriana, Photius, Suda)—for the sake of the ancestors of Modern Greek speakers who likewise scratched their heads at μηνοειδής.<br>
      The word selenoid shows up in English, but only as a mispelling of solenoid (Google: 2350 vs. 681,000), and as the lunar equivalent of the geoid (Google: 22).<br>
      While the lunate was banished as a capital letter in the 18th century, it remains familiar to Modern Greeks through ecclesiastical use: it figures in church icons, and in decorative fonts intended to evoke Byzantium (just as epigraphical alpha and sigma——are kept around in decorative fonts to evoke antiquity). It is inevitable, for instance, that the headers of the webpages of the Church of Greece website all have lunate sigmas; what is interesting is that the homepage itself has the Latin word Ecclesia instead. (The point being, of course, that Ecclesia is a Greek word.)</p>
      <p>There is a lot more about lunate sigma at the address I gave above, and you can go and read it all if you wish.</p>
      <p>Lunate Epsilon</p>
      <p>The lunate epsilon is an uncial character, just as the lunate sigma is; the normal lowercase epsilon became usual only in the 12th century. Just like the lunate sigma, the lunate epsilon is a glyph associated in Greece with Byzantium and Orthodox Christianity. Outside that context, the lunate epsilons are best known as set operators in mathematics; they are already included under that guise in Unicode as U+2208 Element of, ∈, and U+220B Contains As Member, ∋. The set operators are in a glyph tradition incommensurate with letter use, and are coded as mathematical symbols (Sm); if the lunate epsilon is to be included as a letter, it would need to have a lowercase letter category (Ll) and a distinct codepoint—which the lunate epsilon does. (The reverse lunate epsilon, on the other hand, has no use in Greek as a character, and its category is accordingly still Sm.)<br>
      The Capital Theta Symbol and Lunate Epsilons were proposed in March 2000 to the ISO by the US National Standards Body, as part of the STIX initiative to standardise usage of mathematical fonts. They were added to Unicode 3.1; Ken Whistler has a behind-the-scenes report on the deliberations that went on in accepting them. The lunate epsilons were originally proposed as U+213B Greek Symbol Straight Epsilon and U+213C Greek Symbol Reversed Straight Epsilon. All three symbols are described in the proposal annex as "N: normal or ordinary; e.g., symbol used as a variable." This means that some mathematician out there has used ϵ as a variable—despite the fact that it looks just like a set operator—and ϴ as a variable, but not as a glyph variant of Θ (or U+2205 Empty Set, ∅). ϵ∈ϴ? Well, I guess there's no accounting for taste.<br>
      The reason why the epsilons ended up in the Greek block is clear from Whistler's report: ELOT deemed these mathematical characters to be Greek characters—which in the case of lunate epsilon, they more or less are. But just as with the other mathematical symbols: if you're writing a Greek text and want to give it that Olde Bizantine Charme, don't use U+03F5. That's not what it's there for. Agitate for a Unicode uncial font instead.</p>
      <p>As It came to my attention that you are currently designing more and more Ancient Greek charactersI also found a nice image of some novel looking like characters for you, here it is:</p>
      <p>Source: J. Victor Gaultney, Gentium type specimen (University of Reading, 2002), p.14.</p>
      <p>  </p><div class="imageWrap"><img src="http://typophile.com/files/Greek_archaic_3579.png"></div><p></p>
      <p>Archaic Greek letters</p>
