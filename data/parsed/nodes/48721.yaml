      <p>What's your inspiration for the name. At first I thought it was a typo and you meant to write Thesis which of course is taken. Don't you think the two names are a little close for comfort? Naming is hard. Didn't Jonathan or Tobias write a piece about font naming at some point?</p>
      <p>Something else, not sure how you feel about this but check this out: compare the notch on the top left of the n or m to the one on the bottom of the a. I think I would increase the one on the a. Just pull the branching of the counter up a bit. That will keep it more legible in small sizes too.</p>
