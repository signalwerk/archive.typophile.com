    html: |-
      <p>I like a.5 best I think as it best balances area 1 and 2 while keeping the flavor of your original a.</p>
      <p>U is better in second picture.</p>
      <p>Desc/Ascenders are better.</p>
      <p>9 is still not fixed. The closed counter (top) is too small vertically, and the bottom needs more width: the curve of the tail starts too early I think and the end doesn't go far enough left. </p>
      <p>F: crossbar even lower. Make the top of the F crossbar at the bottom of the E crossbar. Also the foot serif, right side make him wider or the whole letter will fall over to the right! Also helps a little with the white hole under the F.</p>
      <p>y: consider a bit more weight in the end of the tail.</p>
      <p>x: cut this stroke ( / ) in the middle and move the bottom left leg to the left maybe 20 em units. Same for cap X</p>
      <p>Somehow this reminds me of Diotima, but more suitable for text. Nice job!</p>
