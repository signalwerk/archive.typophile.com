      <p>SemeleGreekLight Roman Version 10.0 - Some suggestions(Based partly on your AlternateDesignOfGreekCharacters PDF file attachment)</p>
      <p>The pages 394-397 from Lucian’s ‘The Consonants at law’ that you uploaded are very nice, congratulations. You kept to the original layout as best as anyone could. You realize of course that (as Randy pointed out) SemeleLight isn’t good enough as a weight to use it as book text typeface, you will have to design also a Book or a Regular weight for that; also a Bold weight. The Cap height should be increased a little and correspondingly the height of the ascenders and descenders.</p>
      <p>In relation to the overall design of the Semele Greek characters, admittedly the typeface is quite nice and polished, some characters are designed excellently and some others could be improved.  I have found out that the only Greek typefaces that are universally accepted and admired are all those that are digitized from hot metal types designed by great masters such as Bodoni, Baskeville and others and some of the typefaces that you have in your PDF ‘AlternateDesignOfGreekCharacters’.<br>
      All those typefaces have some of their letterform characteristics (hooks, blobs etc) enlarged in ways similar to the enlargement of facial characteristics in caricatures, this keeps the individual style of the typeface quite strong even at small point sizes, this is very important. In the Greek Semele these particular characteristics need to be strengthened quite some more.<br>
      In other words the Greel Semele characters need a bit of a little more enhancing in their characteristics and also to have in some characters a novel morphology (like the ones that you did with nu and kappa for Guifa) in order to be universally accepted by typographic scholars and be included in international digital libraries.</p>
      <p>In view of all the above my suggestions for enhancing the Greek characters of Semele are the following:</p>
      <p>Sigma - Move the middle point 20-30 em to the right and downwards<br>
      Phi - Move the whole oval of Phi a little downwards<br>
      alpha - Better to use another Oldstylish form (Lambrakis or Optima)<br>
      gamma - Make it more balanced vertically<br>
      delta - Better to use a more Oldstylish form (Apla or Porson or TimesTen)<br>
      epsilon - Excellent letterform<br>
      zeta - Keep the epsilon-esque curve-endings but it would be better to use a more Oldstylish form (Apla or Papyrus or Porson)<br>
      eta - The eta needs something but I can’t figure it out yet, maybe an Oldstyle form as in Apla or Katsoulides<br>
      theta - Make the top and bottom more pointed<br>
      iota - make this ‘iota hook’ parts in ALL lower case letters much more emphasized as in Apla, TimesTen, TimesNewRoman or Porson<br>
      kappa - You can also use one of the exquisite ‘kappa’s that you posted to Guifa - kappa.3<br>
      lambda - Excellent kappa and lambda<br>
      nu - You can use instead one of the beautiful ‘nu’s that you posted to Guifa - nu.3 or nu.5<br>
      xi- Keep the epsilon-esque curve-endings but it would be better to use a more Oldstylish form (Apla or Papyrus or Porson)<br>
      rho - The end of the ‘tail’ of rho should be moved 20-30 em to the right<br>
      pi &amp; tau – Excellent<br>
      phi - Better to use another Oldstylish form (TimesTen or Papyrus)<br>
      chi - Better to use another Oldstylish form (Apla or Katsoulides)<br>
      psi - Move middle left curve point 20-30 em upwards<br>
      omega – Excellent letterform</p>
    html_clean: |-
