      <p>Re the archaic file.  Both me and you have been taking similar approaches to qoppa and sampi.  I've found reference of two alternate shapes for them in an <a class="freelinking external" href="http://omega.enstb.org/yannis/pdf/boston99.pdf" rel="nofollow">old unicode proposal</a>.  For Qoppa, the uppercase has been designed as a reversed P (think like Я and R, but with P). For Sampi, it's like a Lambda but with a middle diagonal line going from the middle baseline up into the right arm (sort of like //\ ).    That said I prefer the capitals that look a bit more like the lowercas, but I'll probably add the others as an alternate glyph  :P</p>
      <p>Also for the Ypogegrammoni, I would go with the third or (preferably) forth option in the Semeli(Thetis)LightRomanItalic_Version_15Na.indd__0.pdf file.  The other three don't really match the font .  Also, in the case of eta, doesn't it tend to go a little more to the left, right underneath the left leg?</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
