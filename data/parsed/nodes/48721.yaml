    html: "<p>This is a wonderful italic!  Extremely well polished. I especially like the small upturn that the E and F have.</p>

      <p>Now, as to your alternate characters, I think the f, j, and y should have the same terminal roughly.  So you could keep f.1, the j, and y.2, but use a slightly thinner terminal on y.2.  Or go with the ball terminal in f.2 and y.1 and make one for j.</p>

      <p>z.2 is the better of the Zs for this style, the other two seem a bit heavy since they're not descending.  </p>

      <p>The tail on m is thinner than the others.</p>

      <p>The o seems to be slanted without getting its due stress.  By that I mean, all the other bowls have or appear to have a diagonal stress, but the o looks like it has a vertical stress.</p>

      <p>2 gets too thing, and 4 might be a bit too thick on its diagonal.</p>

      <p>I like that the 3, 5, and 9 have different terminals, but since the rest of the font is consistent with its building blocks, I'd choose one of the three and use the same style.  Personally I prefer 9's.  3's is a bit anemic.</p>

      <p>I'm guessing it's by design, but just to make sure you intended it, B, D, E, and L have stubbier serifs on their left stems than F, H, K, N, R, T.  </p>

      <p>I hope that helps.  Any chance we can get a sample of text in it?</p>

      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>"
