      <p>Great idea to choose ‘The Consonants at Law’ the most appropriate among Lucian’s work and set it in Semele Light. It looks quite nice and yet as I happen to have the Loeb edition of Lucian’s work, I compared the same pages with your pages and noticed that you have set the titles and the body text in smaller point sizes.<br>
      As far as I can see, the typeface is too light for body text, later on you could set it in Semele Book; the ascenders and the descenders could be increased by 20 -50 em. The Greek Semele Light Italic look as if they are a little wider that the Latin Semele Light Italic, but maybe this doesn’t matter a lot.<br>
