      <p>The name ‘Thetis’ that I had originally chosen for this typeface is definitely confusing - as Hannes pointed out it is being easily confused with ‘Thesis’. The Thetis Latin characters were deisigned in such a way so that they would be the basis for the subsequent design of Greek characters which - for book text usage - are always designed in a calligraphic way as in Greek Times Ten, Times New Roman, Minion and other.</p>
      <p>As the typeface will be mainly used for Greek book text, the final name should come from Greek mythology names, it will be probably the name of a nymph, or goddess or a city. At this point I would like to alter it, and after checking at <a href="http://www.identifont.com" title="www.identifont.com">www.identifont.com</a>, I have come up with the following names that have not been used so far:</p>
      <p>		Alcmene<br>
      		Cassiopea<br>
      		Castalia<br>
      		Chloe<br>
      		Danae<br>
      		Erato<br>
      		Iphigenia<br>
      		Ismene<br>
      		Leta<br>
      		Leda<br>
      		Phoebe<br>
      		Semele</p>
      <p>Could you please help me and choose the right name for ‘Thetis’ among the above or even suggest another name for it.</p>
      <p>Soon, I will be posting for your critique, ThetisItalic and ThetisGreekRoman and Italic.</p>
