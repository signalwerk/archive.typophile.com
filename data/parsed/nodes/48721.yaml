      <p>Let's see ... Alcmene sounds odd, Cassiopea is a mouthful, Castalia sounds too much like Castilia for my taste, Chlöe surely has already been used right?  In any case that sounds like a handwriting font.  Danäe is a bastard nymph whose name means "parched" (according to wikipedia) and that doesn't fit.  Erato sounds like eratus to me, but this is a full body principal text so... Iphigenia..riiiiiiight.  Ismene sounds like it'd be a formal script font.  Leta sounds like Star Trek dabo girl, Leda, eh, too short in any case.  Phoebe possible and Semele.... wait... perfect.  Her Roman name is Stimula, which for a calligraphic Greek version could go perfect.  Especially since the light version feels well, light, and agile which could definitely go with a name like Stimula so.... Semele it is.  It has a nice timeless look, and the daughter of Semele (e.g. all documents set it in) was immortal.  The only downside would be that Semele is not actually a Greek name, rather (again according to Wikipedia) Thraco-Phrygian which might have made it a better suited name for a non-Greek designer and I'm guessing by your profile you're Greek (side note: I could use a critique on my Greek font haha)</p>
      <p>In any case, I think Semele works well.  Above all to my ears it sounds the least girly-girl (read: Curlz)  of the fonts and more like a nice robust formal font (think hot conservative librarian).</p>
      <p><em>«El futuro es una línea tan fina que<br>
      apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
