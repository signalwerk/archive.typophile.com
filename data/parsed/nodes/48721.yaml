    <p>I have just uploaded a PDF file with alternate lunate sigmas and epsilons.</p>
    <p>I extend my thanks to all those who have posted their comments and helped me so far with their critique.</p>
    <p>Semele is a book text typeface. Semele Book or Semele Regular are the weights to be finally used as book text typefaces with the relationship between the cap height and that of the acscenders and descenders readjusted; currently I am working on that.</p>
    <p>I would like to add that originally the Semele Latin characters were designed in such a way that they would be the basis for the subsequent design of Old Style Greek characters which — for book text usage in Greek Classical Typography — are always designed in a calligraphic way as in Monotype Greek Upright 90, Greek Times Ten, Times New Roman, Minion and other.</p>
    <p>As the typeface will be also used as a Greek book text, its finalized name has come from Greek mythology. Semele (Σεμέλη) was one of the four daughters of Cadmus who was credited by Herodotus with the invention of the alphabet and other useful things.</p>
    <p>I would be very happy to read your further comments and critique.</p>
    <p>Thanks</p>
