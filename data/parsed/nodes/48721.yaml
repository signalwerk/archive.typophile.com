      <p>In view of the eminent uplifting the morphology of your Greek characters for Semele Light Italic I am forwarding to you the following list as I think that it might benefit you greatly:</p>
      <p>1757 GFSBaskerville<br>
      1790 GFSGazis<br>
      1800 GFSBodoniClassic<br>
      1805 AplaDidotItalic<br>
      1808 GFSPorson<br>
      1850 GFSSolomos<br>
      1917 New Century Schlbk Greek Inclined<br>
      1931 Times New Roman Italic<br>
      1931 TimesTenGreekUpright<br>
      1948 PalatinoItalic<br>
      1990 VergikiosScript<br>
      1992 SabonGreekItalic<br>
      1993 KatsoulidisItalic<br>
      1995 GFSOlga<br>
      1996 ApolloniaItalic<br>
      1999 BookAntiquaItalic<br>
      2001 MinionProItalic<br>
      2005 GentiumItalic<br>
      2005 ArnoProItalic<br>
      2006 BucentoroGreek<br>
      2006 CF Genesis</p>
      <p>The dates that I have attached in front of each typeface name are approximately as exact as I could fathom. it wont be hard to find all these tyepfaces either as Truetype or as Opentype; most of them I am sure that you already have.</p>
      <p>It would be a nice idea to extend your AlternateDesignOfGreekCharacters.pdf by complementing it with pages containing 16 of the italics in the above list.</p>
      <p>For completing thoroughly all the Greek characters of the Extended Greek in Semele Light it would be a nice idea to add the following two Greek Diacritics:</p>
      <p>ʹ 	ʹ 0374 NUMERAL SIGN<br>
      ͵ 	͵ 0375 LOWER NUMERAL SIGN </p>
      <p>And also check the morphology, size (for Greek capitals or lower case characters) and placing of the following diacritics:</p>
      <p>᾽ 	᾽ 1FBD KORONIS<br>
      ι 	ι 1FBE PROSGEGRAMMENI<br>
      ͺ 	ͺ 037A YPOGEGRAMMENI</p>
