    <p>Hi, I thought this might already be on here, since its fairly old news, but found nothing on the search so:</p>
    <p>I would like to find out what the serif font is in the new(ish) Bloomberg Businessweek design. The sans I believe is the Haas Grotesk by Schwartzco Inc. (<a href="http://christianschwartz.com/haasgrotesk.shtml" title="http://christianschwartz.com/haasgrotesk.shtml">http://christianschwartz.com/haasgrotesk.shtml</a>), but I can't figure out the text font. I feel a little stupid because I'm sure this has been talked about, but google gave me nothing.</p>
    <p>Thanks,<br>
    Gabriel</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/businessfont2_6465.png"></div><p></p>
