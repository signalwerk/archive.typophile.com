      <p>Yeah, of course. People also use Comic Sans. Apple also uses Helvetica as UI typeface.</p>
      <p>If you set your Futura to 48pt and positive tracking, everyone can see it. We say it’s not “legible” only when you try and compare a 12pt/16pt Futura and a 12pt of, say, 12pt/16pt Sabon. There’s no only one correct way to “use Futura for a website;” there’re millions of way to use it.</p>
      <p>Yet often times people use incorrectly. Not that it can’t be used on a website; finding that millions of correct way – that’s the problem.</p>
