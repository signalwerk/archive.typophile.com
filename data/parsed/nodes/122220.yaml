      <p>Nothing here indicates bad hinting, save for perhaps the treatment of the B across weights. That’s nitpicking though, and I don’t even know what system this is rendered on. Linux? If that is the case, font hinting instructions doesn’t work anyway – the FreeType rendering engine handles all the interpretation. </p>
      <p>Typography-wise, if you are setting text at this size, you need more contrast between background and text. It would also be wise to track the text a little bit, but you cannot do that reliably yet without modifying the font file. If you are set on Futura, I would first and foremost set it much larger. 5 pixels to the x-height is miniscule.</p>
