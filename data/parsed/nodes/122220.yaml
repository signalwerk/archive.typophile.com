      <p>Why not? But you should study print examples to ascertain the way you should compose. Eg the original Futura has long ascenders and descenders and ‘likes' ample linespacing.<br>
      Longer stretches of text may be problematic if the word count is on the high side, but short lines aren't okay either. Futura is a high bred workhorse typeface that needs a lot of attention.</p>
      <p>In your example the full caps headings are awful, they need more letterspacing and subtle kerning. The body text appears to be unhinted, ergo very inconstistent in colour. Needs a lot of work, or searching for a better source of webfont.</p>
      <p>But I do like Futura.</p>
