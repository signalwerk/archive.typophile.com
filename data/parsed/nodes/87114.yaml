    <p>Hi Everyone,</p>
    <p>I'm trying to identify a feature that I've seen before, although I'm not sure what it's called or where it comes from. In a small-caps face with a larger, initial cap, I've sometimes seen the small-cap "L" be extended to reach up to the larger, initial cap-height.</p>
    <p>The only example I've been able to find is the type for the Disney movie Mulan, although I know I've seen it elsewhere:</p>
    <p><a href="http://ia.media-imdb.com/images/M/MV5BMTIwNjY4NDU2NF5BMl5BanBnXkFtZTcwMzM0OTUyMQ@@._V1._SY317_CR4,0,214,317_.jpg" title="http://ia.media-imdb.com/images/M/MV5BMTIwNjY4NDU2NF5BMl5BanBnXkFtZTcwMzM0OTUyMQ@@._V1._SY317_CR4,0,214,317_.jpg">http://ia.media-imdb.com/images/M/MV5BMTIwNjY4NDU2NF5BMl5BanBnXkFtZTcwMz...</a></p>
    <p>Attached is an image of a logotype I'm working on that uses this feature as well.</p>
    <p>In this case, I feel like it makes the Trajan feel less stodgy and uniform. It gives it a quirkiness which I like, the same quirkiness you get with a unicase. It echoes themes of elevation in the identity, and mimics growing trees in the mark (not shown).</p>
    <p>Is there a name for this? Does anyone have other examples? Is there a history behind this?</p>
    <p>Thanks!</p>
