      <p>Before you set him in the tired old ways, show him how notan is a superset of lettering. When my older son was about 5 he noticed that I draw letters. When he wanted me to show him how, the first thing I told him was to try to see beyond the illusional "skeletons" of letters. It was much harder for him to draw an <em>outline</em> of an ampersand than merely the linear body of an ampersand, but I hope I planted in him a seed that will one day become a high-reaching beanstalk.</p>
      <p>A great little book I recommend is "Notan: The Dark-Light Principle of Design" by D Bothwell.</p>
      <p>hhp</p>
