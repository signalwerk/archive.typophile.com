      <p>Hrant—inculcating young minds with the primacy of the notan!</p>
      <p>When I was young, I often used papercutting for lettering, cutting out forms of letters out of construction paper to be pasted onto posters and such. The method forces you to think in terms of outlines, not skeletons. Papercutting might not be for the youngest of children, but as they grow older it's worth encouraging, I think.</p>
