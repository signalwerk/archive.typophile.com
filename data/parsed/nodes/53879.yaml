      <p>Thanks for the tips. I'm getting the Notan book for myself.</p>
      <p>This is for my nephew. I don't see him that often and when I do we don't always have time to draw together but you've both given me ideas for lessons. His interest is not from seeing other people drawing letters but rather from noticing the lettering associated with other things he is interested in, such as skateboards. One of the first logos he liked was the Disney Narnia one with the lion's tail as a swashy leg of the R.</p>
