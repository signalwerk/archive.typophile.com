    <p>Can anyone recommend books, either instructional or just good reference material for an eight year-old who loves drawing lettering. He is mainly into skate and comic styles, and also likes copying film and TV logos. Both his parents are artists and their home is full of great art books so something big that obviously isn't aimed at children would not daunt him if there was enough pictures.</p>
    <p>In terms of reference material some things I am thinking of are:</p>
    <p>Books of skateboard graphics.</p>
    <p>Comics or graphic novels with particularly interesting intricate lettering but preferably with not too complicated story lines. I'm thinking possibly Will Eisner for those fantastic 3D logos in The Spirit. Also the recent reprints of Krazy Kat with the lovely Chris Ware covers. Sadly the modern editions of Asterix and Tintin he has seem to have replaced a lot of the original hand lettering with digital.</p>
    <p>All suggestions welcomed.</p>
