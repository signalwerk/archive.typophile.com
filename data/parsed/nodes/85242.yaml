    <p>Amanet is original old fashion typeface that comes as Regular weight followed with stylistic compatibile Borders.</p>
    <p>It's pretty readable in small sizes which recommends it for use on packages, labels or specific corporate identities.</p>
    <p>"Amanet" is an archaic Serbian word for English word "legacy".</p>
