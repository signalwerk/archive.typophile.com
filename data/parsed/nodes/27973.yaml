      <p>Yes you can. I understand the allergic feeling you have with LaTeX. I am not a dermaTeXologist, but you should give it a chance. You can do more neat tricks by using Postscript via PSTricks package for example.</p>
      <p>The image was produced by the following</p>
      <p>\documentclass{article}<br>
      \usepackage{graphicx}<br>
      \begin{document}<br>
      \Huge Rodr\rotatebox{90}{i}gue.<br>
      \end{document}<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/typo_3997.png"></div><p></p>
    html_clean: |-
