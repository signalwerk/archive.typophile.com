  html: |-
    <p>Hi,<br>
    I was wondering if anyone knew of a program that could rotate individual letters while keeping the previous and proceeding letters intact? I know that Photolettering used to do it, but I have not found a program yet that can, and I was hoping someone here could help me with this.</p>
    <p>Sincerely,<br>
    Rodrigue Planck</p>
