    html: |-
      <p>There is no “free” version of Baskerville 1757, and there is no “real” digital version of Baskerville. All digital Baskervilles are interpretations of the original, but it does not mean that they are all the same. Designers most certainly influence their revivals with skills, knowledge and taste. If I were you, I’d get hold of a PDF specimen of a couple of revivals (both free and paid), and compare them. Look at the up-close beauty of single letterforms, try your hands (eyes) at the real lakmus test for any text face: reading it in a paragraph, and consider their technical scope. </p>
      <p>Sorry about the preaching :)</p>
