      <p>Well, ITC Baskeville isn't exactly 18th century - it's from the 1980s.<br>
      And I personally think that the spirit of the design actually prefers<br>
      a smallish x-height. It really wants to be set 12-14 point, where a<br>
      large x-height backfires.</p>
      <p>Mrs Eaves? As some here know, I equate it to a beautiful woman with<br>
      a serious speech impediment. The black bodies are great, but the sloppy<br>
      and overly loose* spacing (which Robin Kinross has equated to a loose<br>
      bicycle) kills it for immersive reading.</p>
      <p>* Contradicting the light color and small x-height.</p>
      <p>hhp</p>
