      <p>"Everyone seems to praise the Baskerville typeface. I don't like it at all. I'm a Garamond guy."<br>
      I don't see much wrong with either, though digital revivals are not always successful, and both typefaces have some fairly strong limitations in regard to application — at least in my opinion.</p>
      <p>"It has that inflated x-height that I detest."<br>
      I quite like that. I mean, I personally like a medium to low x-height more, but I think the large x-height fits the typeface. It's quite a shocking design though, especially for the 18th century. I think that's exactly what attracts me though. Not that Baskerville is one of my favorites, by far...</p>
      <p>Mats, what do you think of 'Baskerville' by URW++ (not URW Baskerville)? It has a lower x-height, lower contrast and has been made more contemporary.</p>
      <p>I'm also curious what you think of Mrs Eaves.</p>
