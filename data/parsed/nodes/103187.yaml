      <p>“<em>gut-feeling</em>.<br>
      Irrelevant. That’s even worse than “like.” They have to be able to articulate their thoughts or you, and they, are making uninformed decisions.</p>
      <p>“<em>What <strong>I</strong> would like to communicate is dinamic, flexible, unpretentious and down to earth, and business minded</em>.”<br>
      Irrelevant. Ask the client what <strong>they</strong> want to communicate, to whom, and to what end. Write this down, and get them to sign-off on it as a formal starting point. Go from there, and when you present your concepts, clearly state you have based your decisions on the criteria they signed-off on. If they throw in a few more things, you say “<em>I can do that, however, that was not something we discussed previously, as seen on this document (show them their signature). In order to revisit this, it will take me X hours, and cost an addition $X</em>. How would you like to proceed?” As lawyers, they should respect this. If not, they are hypocrites, and probably going to be a lousy client. </p>
      <p>And just out of curiosity, what is the budget for this job? Do the lawyers work for free? As high priced professionals, their asking someone to work for free is flat out disrespectful (and again, hypocritical). Not to mention how working for free undermines the integrity of the profession, while simultaneously jeopardizing the livelihood of other designers.</p>
      <p>Before you talk budget, ask them what their hourly rate is. That will provide you with an excellent segue.</p>
