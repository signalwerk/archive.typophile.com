      <p>“<em>I am the attorney and I am giving a shot at doing my own logo.</em><br>
      Ah, that’s a game changer. Apologies. I didn’t know that all.</p>
      <p>“<em>Gauging gut feeling is not irrelevant</em>.”<br>
      Completely agree. My point is to gauge (define) gut feelings before making decisions based on them.</p>
      <p>“<em>And refusing to help people who have trouble expressing their gut feelings is ungracious and unproductive</em>.”<br>
      Also agree. As professionals I believe we have an obligation to do our best to (empower others to) make informed decisions that go beyond the subjective.</p>
      <p>I am presently doing design work for my struggling farm friends in exchange for vegetables. And I am constantly helping them make objective decisions regarding their communication strategies. In many instances, what seems simple, obvious, and boring them, may in fact be a selling point. For example, a blight-resistant tomato, a new type of compost, a new tool that makes weeding easier &amp;c. They have “feelings” about what they want to communicate, or accomplish, for example, attract more CSA (community shared agriculture) members. Thats where the designer comes in. I provide them with strategies to do so which often go far beyond their gut or unarticulated feelings, and they freely and graciously acknowledge this every time.</p>
      <p>I believe you and I are on the same page.</p>
