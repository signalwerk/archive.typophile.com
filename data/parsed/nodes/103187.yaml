  html: <p>First of all, I discovered this web site by chance a few days ago, and realized what an immense and fascinating world this is! I think in another life I would like to study font design. I am redesigning a logo for a small law firm (mine). I don't want to use one of those heavy and distasteful fonts that law firms use, especially I don't want anything encased in one of those horrible squares that law firms tend to use to show that they are "reliable, trust-worthy and institutional". Since the name I chose for the law firm is one single, made-up word that could have more than one meaning, I decided to focus entirely on the font, and leave the corporate identity up to the evocative effect of the name. The logo is just going to be the corporate name, blue font. I like sans fonts, and I hate everything that is not plain and essential. So, I was thinking of using Futura, but the results of an internal poll (family and friends in the corporate world) seemed to point toward something with less of an edge and more "comfy" - such as Gill Sans. Someone suggested Century Gothic, saying that given the firm's very unusual name and the fact that none of the letters is emphasized (all LC except for the first letter of the name) it's a cool effect. Any thoughts on this would be really appreciated!</p>
  html_clean: <p>First of all, I discovered this web site by chance a few days ago, and realized what an immense and fascinating world this is! I think in another life I would like to study font design. I am redesigning a logo for a small law firm (mine). I don't want to use one of those heavy and distasteful fonts that law firms use, especially I don't want anything encased in one of those horrible squares that law firms tend to use to show that they are "reliable, trust-worthy and institutional". Since the name I chose for the law firm is one single, made-up word that could have more than one meaning, I decided to focus entirely on the font, and leave the corporate identity up to the evocative effect of the name. The logo is just going to be the corporate name, blue font. I like sans fonts, and I hate everything that is not plain and essential. So, I was thinking of using Futura, but the results of an internal poll (family and friends in the corporate world) seemed to point toward something with less of an edge and more "comfy" - such as Gill Sans. Someone suggested Century Gothic, saying that given the firm's very unusual name and the fact that none of the letters is emphasized (all LC except for the first letter of the name) it's a cool effect. Any thoughts on this would be really appreciated!</p>
