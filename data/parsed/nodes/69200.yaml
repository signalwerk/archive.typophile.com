      <p><em>"Monotype Apollo can be seen as the Monotype version of this design" [Meridien]</em></p>
      <p>I don't know who said that, but these fonts are not equivalent. Both Meridien and Apollo were designed by <a class="freelinking external" href="http://new.myfonts.com/search/adrian+frutiger/fonts/" rel="nofollow">Adrian Frutiger</a>, but a casual look should show that they are not the same at all.</p>
      <p>Meridien italic looks very close, but the C is wider in your sample than in the font.</p>
      <p>- Mike Yanega</p>
