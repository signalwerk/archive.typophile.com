    html: |-
      <p>"Copyright (c) 2013 by Acne Studios. All rights reserved. Font development by Letters from Sweden."<br>
      The character set in Acne Studios Circle Bold does not match the titling in the Grand Palais videos. At least the G and 4 are different.<br><img src="/sites/default/files/old-images/AcneStudiosCircleBold2_6211.jpg"><br>
      Presumably the video font is another custom font developed for Acne Studios by Letters from Sweden, most likely by Göran Söderström.<br>
      Info on Letters From Sweden by Luc Devroye<br>
      -----start quote-----<br>
      Swedish foundry run by two friends.<br>
      Fredrik Andersson. His main occupation is graphic design at Pangea design, creating visual identities for big and small organi­zatio. He lectures on the history and design of typography at Södertörn and Berghs SOC and has been published in Tecknaren and Biblis. Old ramblings on type are still on his now defunct blog Typografism. Type designs include Berling Nova Sans&amp;Serif (with Orjan Nordling), custom work for Nu-institutet and Botkyrka konsthall, and a release for Fountain is also in the works. He is the chairman of the Stockholm typographic guild.<br>
      Göran Söderström. He has been designing type since 2006. He has previously published his works through Psy/Ops, Fountain and FontFont. At Pangea Design, he has developed custom type for ICA, LO, SEB and others.<br>
      -----end quote---<br>
      Don</p>
