      <p>The typeface is exclusively designed for Acne Studios. It’s a collaboration between Acne Studios and me. Letters from Sweden is my type foundry where I do all my type work, both custom and retail.</p>
      <p>There is some more samples of the Acne Studios typeface here:<br><a href="http://autodidakt.se">http://autodidakt.se</a></p>
      <p>Cheers,<br>
      Göran<br>
      Letters from Sweden<br><a href="http://lettersfromsweden.se">http://lettersfromsweden.se</a></p>
