  html: <p>Can anyone recommend a good place to start learning how to implement opentype features using fontlab 4.5? I've copied and pasted code directly from adobe's syntax specification but it doesn't work for me. Is there a primer out there that is not entirely theoretical or completely technical, but just a quick and dirty guide to creating OT ligatures?</p>
