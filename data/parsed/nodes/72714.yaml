    html: |-
      <p>Hi Jess,</p>
      <p>Harsh crit:<br>
      Personally, I would reevaluate the quality of the 'owl' illustration first. Adding the graphic element likely means you're not looking for a purely typographic solution, which is fine, but I think that element needs to be able to take visual priority and communicate, not simply get lost in squiggles... In my mind nothing here jives with the three descriptors used to define the bakery. Instead, it reminds me of some slap-dash internet anime. The quality and conglomeration of the rendering, pun, typeface selection and the objective are all at odds with one another, and no single element is worth retaining.</p>
      <p>Useful(?) direction:<br>
      If you're not using some kind of cultural reference already, I would recommend looking for examples of some script type in 1940's fashion magazines. The pun leads me to believe there should be some air of decadence or refinement. Perhaps the entire mark could be visualized as a piece of delicate ribbon?</p>
      <p>I won't comment on the competency of these marks, but I think these are approaching the ballpark you are aiming for:</p>
      <p><a href="http://www.thecupcakeshoppe.ca" title="http://www.thecupcakeshoppe.ca">http://www.thecupcakeshoppe.ca</a></p>
      <p><a href="http://www.cupcakesonline.com" title="http://www.cupcakesonline.com">http://www.cupcakesonline.com</a></p>
      <p><a href="http://www.swirlscupcakes.ca" title="http://www.swirlscupcakes.ca">http://www.swirlscupcakes.ca</a></p>
      <p>Looking forward to seeing your progress.</p>
      <p>-Best</p>
