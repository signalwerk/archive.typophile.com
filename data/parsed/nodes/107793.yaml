  html: |-
    <p>I am looking for typefaces used by English printers around 1700. Both clean fonts and fonts with a rough appearance to look as the old printed original book page. Preferably of the same style as the attached example.</p>
    <p>And what is the correct classification of these fonts?</p>
    <p>For refernece: classic writers of the period are John Milton, Henry Fielding and Daniel Defoe. Image source: <a href="http://adoptabook.vassar.edu" title="http://adoptabook.vassar.edu">http://adoptabook.vassar.edu</a></p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        IM Fell English Roman        </div>
            </div>
    </div>
