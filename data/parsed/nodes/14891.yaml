      <p>Any technology that puts constraints on the honest punishes the honest for the misdeeds of the dishonest, and will probably only encourage the dishonest to be ever-more ingenious.</p>
      <p>A pirate can easily copy music by simply capturing its analogue output. Why am I stopped from moving my MP3s back to my mac from my ipod, forcing me to find and re-encode 150 CDs after a disaster? A typeface pirate can ultimately reproduce a typeface with the same or similar techniques - so why annoy those willing to financially support you?</p>
      <p>As Stephen says, there's little financial support from pirates.</p>
      <p>Incidentally, all the music I own is readily available illegally for free. I'm not at all fed up that I bought my CDs though.</p>
