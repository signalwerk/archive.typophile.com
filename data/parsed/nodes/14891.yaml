      <p>This seems short-sighted to me, from a purely commercial and self-interested perspective. My thinking is as follows:</p>
      <p>(1) A foundry only loses financially through piracy if either (a) a person who would otherwise have licensed a font and paid for it does not do so because they buy a pirated copy or (b) people buying pirated copies "devalue" the font by using it badly.</p>
      <p>(2) But (a) probably very few people who would buy a pirated copy of a font would have licensed it anyway and (b) those people are probably not "major users" of the font so they are unlikely to devalue it much.</p>
      <p>(3) On the other hand, if you implement a sophisticated automatic licensing system like that proposed (a) it will cost you money to do so which will increase the price of your fonts/reduce your margin and (b) you will probably lose at least some sales because of workflow problems and concerns by users that the technology may become obsolete.</p>
      <p>(4) Plus if you suspend sales of new fonts while you develop the system, you lose additional sales on those fonts.</p>
      <p>(5) Let P1 be the value of the sales that would be lost to pirates (i.e., the value of the sales from those who would have purchased from you but instead purchase from the pirates: one excludes the value of the sales that are made by the pirates but would never be made by you). Let P2 be the value of the sales that are lost because people will not buy your fonts if they know there are pirated versions out there. Let D1 be the costs of developing the solution. Let D2 be the sales that are lost because people are chary of the technology. Let D3 be the sales that are lost developing the new technology.</p>
      <p>(6) It is rational to suspend sales and develop the new technology only if P1 + P2 &gt; D1 + D2 + D3. I doubt very much that this will hold: I suspect that P1 and P2 are very small, and that D1 and D2 are quite large. If it did hold one strongly suspects that the bigger commercial foundries (who could develop things like this in-house at relatively low cost) would have done so. You also have to bear in mind that the solution has got to be watertight: if people can extract the outlines, e.g., and use them to make an "unprotected" font, then the solution will not have stopped the piracy at all.</p>
      <p>(7) My guess is that there are much lower-cost ways to tackle piracy. Expensive as we are it will be much, much cheaper to get lawyers to write nasty letters to E-bay and pirates than it will be go through this hassle.</p>
      <p>Indeed, in purely economic terms I suspect that the only reason for foundries to do anything about piracy is that they "owe it" to those who have purchased the fonts properly to take some steps in that direction. (If I purchased a font and then found it was freely available, I would be fed up.) From that point of view what you definitely do not do is publicise the fact that you have a problem with piracy.</p>
