    html: |-
      <p>It’s difficult, no one can say that these actions are wrong. I just can’t help but feel that hiring the developer to build this system won’t solve the problem. If such a system could be built someone would have done it already, no? Even if the dev pulls it off I think it will have the result mentioned in the other thread (<a href="https://web.archive.org/web/20150124161701/http://typophile.com/node/14914" title="http://typophile.com/node/14914">http://typophile.com/node/14914</a>)... </p>
      <p>1. Honest people might be kept more honest.<br>
      2. Honest people are annoyed and frustrated by the hoops they have to jump through to use the fonts. Support costs go through the roof, and customer sat goes down the tube.<br>
      3. Dishonest people will overcome the system and clone the fonts regardless.  </p>
      <p>Personally I think this approach (Linotype’s?) is still the most sensible. </p>
      <p>1. Unobtrusively stick a unique identifier in the font (serial number if you like) to link a font to a customer in your database. Then you know who’s being bad.<br>
      2. Trademark the font names. In this country the value is in the names not the design. The cloners will stay away from properly registered TM’s. </p>
      <p>Cheers, Si</p>
