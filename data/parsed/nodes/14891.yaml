    <p>Continued from the EULA discussion. Started by Lauri's comment:</p>
    <p><em>Not sure if this has been covered yet, but it looks like Letterhead Fonts won’t release any new fonts before they have a working activation/copy protection in place (link). It looks like some of their fonts were pirated and they won’t have none of it.<br>
