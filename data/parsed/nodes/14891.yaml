      <p>I wish Letterhead the best with this initiative. It will be interesting to see how it works out. But I fear it's more of an emotional reaction to piracy than a practical one.</p>
      <p>A font vendor's R&amp;D money would be better spent in <a href="https://web.archive.org/web/20150124161701/http://www.subtraction.com/archives/2005/0804_try_before_y.php" rel="nofollow">try-before-you-buy</a> technology rather than anti-piracy technology. <em>New sales</em> is where the money is. There is very little cash to be had from those who pirate.</p>
