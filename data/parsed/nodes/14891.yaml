      <p>Thanks for starting a new thread about the topic.</p>
      <p>I don't know that much about ttf, otf, or ps font technology, but I would think that <a href="/web/20150124161701/http://typophile.com/wiki/Letterhead%20Fonts" class="freelinking" rel="nofollow">Letterhead Fonts</a> won't be able to do that much to the font files themselves, but they'd need some kind of a secondary program that controls and limits the use of the font on their machine.  How could they stop a registered user of the font, to open the font in FontLab and recompile under a different name?  And this "new" font would then not have the same restrictions as the original.</p>
