  html: |-
    <p>My dear fellow Typophiles, as I will be in London this weekend (Fri/sat/sun/monday) I am still looking for last minute suggestions on hidden, secret spots and things to do and see, 'over there'. What Ive already planned is not that much. I may be taking a look at the (Barnbrook) 'Friendly Fire' exhibition at The London Design Museum. I will of course be visiting the places Ive lived and worked the last times Ive been there. Lil' Old Truman Brewery, here I come. ;)</p>
    <p>As always, I am very, very thankful for all suggestions and hints.</p>
    <p>Thanks,<br>
    Dav</p>
