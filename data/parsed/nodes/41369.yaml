    <p>Hey, I just compiled a list of all the JavaScript commands to apply/remove OpenType features in InDesign through scripting. They should work in both CS2 &amp; CS3, except the ones marked as ’CS3 only’.</p>
    <p><code><strong>myObject</strong></code> can be anything that accepts the properties, from a whole Story to a single Character. So, if you want to apply the properties to the first story in the document, you’ll need to declare ’myObject’ as:<br>
    <code>var myObject = app.documents[0].stories[0];</code></p>
    <p>If you only want to change the first line of text in a document, ’myObject’ should be declared like:<br>
    <code>var myObject = app.documents[0].stories[0].lines[0];</code></p>
    <p>And if what you want to change is the first character in a document, ’myObject’ should be:<br>
    <code>var myObject = app.documents[0].stories[0].characters[0];</code></p>
    <p>The properties can also be applied to paragraphs, text frames, words, etc.</p>
    <p>Happy coding!!</p>
    <p><code>################<br>
    // All Caps (case+cpsp)<br>
    myObject.capitalization = Capitalization.ALL_CAPS;</code></p><code>
    <p>// Small Caps (smcp)<br>
    myObject.capitalization = Capitalization.SMALL_CAPS;</p>
    <p>// All Small Caps (c2sc+smcp)<br>
    myObject.capitalization = Capitalization.CAP_TO_SMALL_CAP;</p>
    <p>// to reset capitalization<br>
    myObject.capitalization = Capitalization.NORMAL;</p>
    <p>// Ligatures (liga)<br>
    myObject.ligatures = false; // to turn off<br>
    myObject.ligatures = true; // to turn on</p>
    <p>###</p>
    <p>// Discretionary Ligatures (dlig+hlig)<br>
    myObject.otfDiscretionaryLigature = true;</p>
    <p>// Fractions (frac)<br>
    myObject.otfFraction = true;</p>
    <p>// Ordinal (ordn)<br>
    myObject.otfOrdinal = true;</p>
    <p>// Swash (swsh+cswh)<br>
    myObject.otfSwash = true;</p>
    <p>// Titling Alternates (titl)<br>
    myObject.otfTitling = true;</p>
    <p>// Contextual Alternates (calt+clig)<br>
    myObject.otfContextualAlternate = true;</p>
    <p>// Slashed Zero (zero)<br>
    myObject.otfSlashedZero = true;</p>
    <p>// Stylistic Sets (ssXX)<br>
    myObject.otfStylisticSets = 8; // to apply Set 3 (ss03)<br>
    /*<br>
    0 = None<br>
    2 = ss01<br>
    4 = ss02<br>
    6 = ss01+ss02<br>
    8 = ss03<br>
    10 = ss01+03<br>
    12 = ss02+03<br>
    14 = ss01+02+03<br>
    16 = ss04<br>
    32 = ss05<br>
    64 = ss06<br>
    128 = ss07<br>
    ...<br>
    OR<br>
    1 = None<br>
    3 = ss01<br>
    5 = ss02<br>
    7 = ss01+02<br>
    9 = ss03<br>
    11 = ss01+03<br>
    13 = ss02+03<br>
    15 = ss01+02+03<br>
    17 = ss04<br>
    19 = ss01+04<br>
    21 = ss02+04<br>
    ...<br>
    */</p>
    <p>// Positional Forms (init, medi, fina, isol) -- CS3 only<br>
    //// General Form<br>
    myObject.positionalForm = PositionalForms.NONE;<br>
    //// Automatic Form<br>
    myObject.positionalForm = PositionalForms.CALCULATE;<br>
    //// Initial Form<br>
    myObject.positionalForm = PositionalForms.INITIAL;<br>
    //// Medial Form<br>
    myObject.positionalForm = PositionalForms.MEDIAL;<br>
    //// Final Form<br>
    myObject.positionalForm = PositionalForms.FINAL;<br>
    //// Isolated Form<br>
    myObject.positionalForm = PositionalForms.ISOLATED;</p>
    <p>###</p>
    <p>// Superscript/Superior (sups)<br>
    myObject.position = Position.OT_SUPERSCRIPT;</p>
    <p>// Subscript/Inferior (subs if present, else sinf)<br>
    myObject.position = Position.OT_SUBSCRIPT;</p>
    <p>// Numerator (numr)<br>
    myObject.position = Position.OT_NUMERATOR;</p>
    <p>// Denominator (dnom)<br>
    myObject.position = Position.OT_DENOMINATOR;</p>
    <p>// to reset position<br>
    myObject.position = Position.NORMAL;</p>
    <p>###</p>
    <p>// Tabular Lining (tnum+lnum)<br>
    myObject.otfFigureStyle = OTFFigureStyle.TABULAR_LINING;</p>
    <p>// Proportional Oldstyle (pnum+onum)<br>
    myObject.otfFigureStyle = OTFFigureStyle.PROPORTIONAL_OLDSTYLE;</p>
    <p>// Proportional Lining (pnum+lnum)<br>
    myObject.otfFigureStyle = OTFFigureStyle.PROPORTIONAL_LINING;</p>
    <p>// Tabular Oldstyle (tnum+onum)<br>
    myObject.otfFigureStyle = OTFFigureStyle.TABULAR_OLDSTYLE;</p>
    <p>// Default Figure Style<br>
    myObject.otfFigureStyle = OTFFigureStyle.DEFAULT_VALUE;</p>
    <p>###  Not available through the UI</p>
    <p>// Historical Forms (hist)<br>
    myObject.otfHistorical = true;</p>
    <p>// Localized Forms (locl) -- CS3 only<br>
    myObject.otfLocale = true;</p>
    <p>// Mark Positioning, Required Ligatures,<br>
    // Glyph Composition / Decomposition<br>
    // (mark, mkmk, mset, rlig, ccmp) -- CS3 only<br>
    myObject.otfMark = true;</p>
    </code><p><code>// Access any feature available in the font<br>
    // and specify the index of the alternate glyph<br>
    myObject.opentypeFeatures = [["salt", 0]]; // default glyph<br>
    myObject.opentypeFeatures = [["salt", 1]]; // 1st alternate glyph<br>
    </code></p>
