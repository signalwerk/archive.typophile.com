      <p>There was an older mechanism that was replaced by the syntax above in CS2. I think the older one was “OpenTypeFeatures” (not sure how the capitalization is done between the different scripting systems). It specified 2 integers instead of a string &amp; an integer, so it would be harder to use.<br>
      New<br>
      <code>myObject.opentypeFeatures = [ ["salt", 0], ["pcap", 0] ];</code></p>
      <p>Old (something like this)<br>
      <code>myObject.openTypeFeatures = [0x81617282, 0, 0x7a63617a, 0];</code></p>
      <p>I made up those hexadecimal numbers, but you get the drift.</p>
