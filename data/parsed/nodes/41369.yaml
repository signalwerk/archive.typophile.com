    html: |-
      <p>Yes, you can use any OpenType feature and InDesign will apply them blindly. However, you can have trouble if you apply a feature (example ’swsh’) that InDesign has an alternate way of applying — in this case, InDesign may turn it off.  Both GPOS &amp; GSUB features should work. Of course, any 1:many glyph substitutions will still fail.<br>
      Also, you can create character or paragraph styles and modify them via scripting to add features using the code above — a style is another “text target” for these commands. Or, you can apply the feature to text and it the “new style” button which will load these attributes into the style, even though the UI doesn’t support them.<br>
      WARNING: this is a way to confuse less savvy users who may get the documents later...</p>
