      <p>Thanks for all your comments.</p>
      <p>The font used on "Liberty" was to convey the writing similar to what was used during the Revolutionary Era and the signing of the Declaration of Independence.  I agree, though, that is not commonly used in Sports - but is that necessarily bad?  The colors that I used intentionally represent the uniform colors of black white and gold.</p>
      <p>The second attempt is more patriotic and blatant with the red, white and blue and flag theme.  The graphic comes from a tracing of a flag soccer ball photo. </p>
      <p>Enjoying the feedback. Keep it coming please.</p>
