      <p>From a practical point of view, what is the logo to be used on and how will it be applied, it seems to me that if it is on the team strip the type will be small, possibly too small to embroider, you might want to drop travel soccer from the logo (what is <em>travel</em> soccer anyway?); and shift liberty to the bottom you can then get a better proportion of text to image, while Copperplate does follow a curve quite well it is a broad face, for reasons of proportion you might want to consider something narrower. In terms of the image it should either be really well executed or dropped in favour of a simpler rendition at the moment there is too much of a clipart feel to it. My personal feeling is that a team logo shouldn’t need a rendition of the sport.</p>
      <p>Tim</p>
