      <p>Going with the second design was a smart move. Lose the Statue of Liberty—it’s starting too look like a parody of the Fox News in-house soccer team. It’s also just not a remotely appropriate way to treat an important symbl (not that putting a flag on a soccer ball is much better, but people are used to tacky degradation of hallowed symbols when a<br>
      said symbols are flags). Don’t draw the flag to look distorted, it looks unnatural, instead draw it flat and wrap it around a 3D sphere.</p>
      <p>Regarding your type, I would recommend not using a serif type, but if you must, go with a simple slab serif. It’s more sporty and more appropriate for the age of the players. Gotham Rounded would be a great sans type to use, Memphis would be a great slab serif that has a great combination of American and European elements that make it especially appropriate for a soccer team.</p>
