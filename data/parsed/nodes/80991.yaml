    html: |-
      <p>Hrant, that's a good question. Haven't really thought about it, but I'll try now. Since I started drawing type (not that long ago), I've (unconsciously) felt that the shallow curve of the 'U', abruptly transitioning into a straight stem, really doesn't relate to anything else in the upper case. It's always a little wrong, somehow. It's late invention was perhaps done by lesser minds than the genius(es) who made the masterpiece the original (upper case) Latin alphabet is. So my 'U's are just my (possibly) feeble attempt at reinventing one of the very few flawed glyphs of the upper case. (The 'J', an even later invention, is another.)</p>
      <p>Besides, I like cuspy shapes. </p>
      <p>Ben, thank you. Will you post your new typeface on Typophile?</p>
    html_clean: |-
