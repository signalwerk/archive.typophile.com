    html: "<p>I like it. When I read your description I wasn't wild for the phrase \"Swing the State\" (swing can take on all kinds of double entrendre meanings). The design you came up with is simple, clean and conveys the message that your vote matters. The more I look at it the more I like it. One thing though, and it may not matter, but it doesn't say vote democrat. It could just as easily be used by people trying to swing the state republican. I have no suggestion  as to how to imlpy vote democrat other than adding a donkey but that would be assinine.   <br>: )</p>"
