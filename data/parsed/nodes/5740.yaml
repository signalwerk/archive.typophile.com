  html: <p>I was asked to design a logo for the 2004 election. The group "Swing the State" is a non-profit grassroots campaign to beat Bush in 2004.  <br>The goal of the campaign is to address the various undecided Swing States. People affiliated with the organization will travel to these states and try and get as many people registered to vote as possible, as well as try and pursuade "on the fence voters" to vote democratic. I'd love to here the forums opinions on this logo. <br> <br><img src="http://www.typophile.com/forums/messages/29/41304.jpg" alt=""></p>
  html_clean: <p>I was asked to design a logo for the 2004 election. The group "Swing the State" is a non-profit grassroots campaign to beat Bush in 2004.  <br>The goal of the campaign is to address the various undecided Swing States. People affiliated with the organization will travel to these states and try and get as many people registered to vote as possible, as well as try and pursuade "on the fence voters" to vote democratic. I'd love to here the forums opinions on this logo. <br> <br><img src="http://www.typophile.com/forums/messages/29/41304.jpg" alt=""></p>
