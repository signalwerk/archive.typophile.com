    html: <p><i>We badly need to compile a systematic list of multilined faces as  <br>they keep popping up regularly.</i> <br> <br>Yves, this sounds like a perfect place for another Font ID Guide. I already have a bunch of older designs in the Bauhaus Guide (see several on <a href="http://bowfinprintworks.com/BauhausFaces1B.html" target="_blank">this page</a>), and I could use those with samples of the newer fonts mentioned in your links. (Some of which are no longer working links, btw). I think multi-line and inline fonts could be included. I'll try to get something started this week, and we can use it as a reference for these types in the future.</p>
