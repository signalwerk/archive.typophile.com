  - id: 25417
    user: null
    date: null
    date_raw: null
    votes: null
    html: "<p>Thanks for the input Stephen and the additions. I agree that mixing them slows the identification down a bit, so I think I will segregate them by types: Multilinear, and Inline. It's still pretty easy to do with only 2 pages.  <br> <br>The toughest part at this stage is just getting the images, especially if I don't have the fonts. I have to copy multi-part test drives, or appropriate site graphics. (This is a naked appeal to anyone with any multiline fonts, or inline fonts, to provide samples showing the complete character set and font name. Use either vertical style (250 pixel width) or horizontal layout (max 730 pixels wide), and e-mail the .gifs to me for inclusion. Image donors will be credited. Thanks.</p>"
    html_clean: "<p>Thanks for the input Stephen and the additions. I agree that mixing them slows the identification down a bit, so I think I will segregate them by types: Multilinear, and Inline. It's still pretty easy to do with only 2 pages.  <br> <br>The toughest part at this stage is just getting the images, especially if I don't have the fonts. I have to copy multi-part test drives, or appropriate site graphics. (This is a naked appeal to anyone with any multiline fonts, or inline fonts, to provide samples showing the complete character set and font name. Use either vertical style (250 pixel width) or horizontal layout (max 730 pixels wide), and e-mail the .gifs to me for inclusion. Image donors will be credited. Thanks.</p>"
  - id: 25418
