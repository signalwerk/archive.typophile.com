    date: null
    date_raw: null
    votes: null
    html: <p>Just for future multiline or inline font question  reference, I have updated the new <a href="http://bowfinprintworks.com/LinedFontGuide01.html" target="_blank">Lined Fonts ID Guide</a> to separate the two categories, so that you can search for either kind, as Stephen suggested. I also added all the ones that were mentioned (if the links were good, and not all of them were), except Surreal Post-Indian, from Type-o-Tones, because I couldn't find a decent way to produce a sample without owning the font.  <br> <br>I am also trying to get a good sample of Damien Gautier's  <a href="http://typotek.free.fr/caracteres/lechaufferie.html" target="_blank">"LeChaufferie"</a>, if any one has the ability to make one. <br> <br>I also welcome any other suggestions for inclusion in the Guide.</p>
