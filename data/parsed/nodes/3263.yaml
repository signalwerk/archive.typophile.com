    html: <p>OK, for what it's worth I have started a new Font ID Guide called <a href="http://bowfinprintworks.com/LinedFontGuide01.html" target="_blank">Lined Font Identification Guide</a>. At this point it consists of 2 pages with about 30 fonts each. If I get other suggestions, or samples, I will keep expanding it. It's not linked into the rest of my site, but eventually it will have a place in the Site mape and links from other parts of my site. <br> <br>My impulse has been scratched for the time being.</p>
