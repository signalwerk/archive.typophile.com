    <p>I'm developing an application that needs to display ordinary six-sided dice in a three-dimensional view. For technical reasons, implementing the dice graphics as glyphs in a font would be the most practical solution.</p>
    <p>I'm currently using <a href="http://www.myfonts.com/fonts/linotype/game-pi/">Linotype Game Pi</a> as a placeholder in my application, but since I obviously can't distribute that font, I have to replace it with my own before I release the program.</p>
    <p>Here's an image that shows what I've done so far:<br><img src="/sites/default/files/old-images/Die_Spire_01_4832.png"></p>
    <p>And here's an image of the equivalent glyph in Linotype Game Pi (lowercase <cite>t</cite>) :<br><img src="/sites/default/files/old-images/Die_Linotype-Game-Pi_5652.png"></p>
    <p>There is another font called <a href="http://www.partae.com/fonts/products/productinfo/productinfo.php?view=lasvegas">Las Vegas</a> that also contains three-dimensional dice glyphs, but I don't have it at my disposal.</p>
    <p>The target platform for my application is low-resolution Windows Mobile devices; typical screen dimensions are 240×320, and high-end screen dimensions are 480×640. The dice occupy only a fraction of the screen, so I need my design to be attractive and legible at very low PPEM values.</p>
    <p>I would be grateful for any comments and constructive criticism.</p>
