    html: <p>Mark is incorrect. <code>a:link</code> matches hypertext links only in CSS and can thus differentiate <code>A HREF</code> from <code>A ID</code>. It’s a question of CSS, not HTML, and no, it isn’t true that nothing can be done.</p>
