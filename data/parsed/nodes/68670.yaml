    html: |-
      <p>The syntax for <code>A</code> (anchor) is <code>&lt;a&gt;</code><em>your anchor content</em><code>&lt;/a&gt;</code>.<br>
      Not all anchors are hyperlinks, though. You can turn an anchor into a hyperlink by adding the <code>href</code> attribute; full syntax then is <code>&lt;a href="</code><em>your url</em><code>"&gt;</code><em>your anchor content</em><code>&lt;/a&gt;</code>.</p>
