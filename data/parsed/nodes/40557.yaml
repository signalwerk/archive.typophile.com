      <p>You perfectly right about ITC Galliard.<br>
      I’m still convinded this is a font. Lot of texts are written with downer and special characters (é, è, à...). It seems also that there is two weights, regular and bold and all text initials are caps and semi-serifs... So that’s why I have concluded this is a font...<br>
      It is as ITC Galliard semi-serif has come to life...</p>
