    <p>Hi,<br>
    I would like to know if someone could help to find which semi-serif font is used to write "MASAHIRO (S)HINODA" on <a class="freelinking external" href="http://www.asia-tik.com/images/stories/films/shinoda/pack1" rel="nofollow">this packaging</a>.<br>
    I know this is a font because I have this DVD pack and it is used to write a lot of texts.<br>
    After few search and with help on WhatTheFont Forum, it cames that Manfred Klein could be the author.<br>
    Font as <a class="freelinking external" href="http://www.dafont.com/fr/crazycrazy.font?text=MASAHIRO+SHINODA" rel="nofollow">CrazyCrazy</a> is very close but not a perfect match... Hope it helps...<br>
    Thanks in advance.</p>
