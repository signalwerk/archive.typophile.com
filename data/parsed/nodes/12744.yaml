    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : ShinnType</strong></p>
    <p>ShinnType was founded in 1999 by <a href="/wiki/Nick%20Shinn" class="freelinking" rel="nofollow">Nick Shinn</a>, to publish his original type designs. Prior to that, his types had been published by a number of different companies.</p>
    <p>ShinnType fonts are distributed by <a href="/wiki/Faces" class="freelinking" rel="nofollow">Faces</a>, <a href="/wiki/FontHaus" class="freelinking" rel="nofollow">FontHaus</a>, <a href="/wiki/Fonts.com" class="freelinking" rel="nofollow">Fonts.com</a>, <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a>, <a href="/wiki/Fontworks" class="freelinking" rel="nofollow">Fontworks</a>, <a href="/wiki/Phil%27s%20Fonts" class="freelinking" rel="nofollow">Phil's Fonts</a>, <a href="/wiki/Myfonts" class="freelinking" rel="nofollow">Myfonts</a>, and <a href="/wiki/Veer" class="freelinking" rel="nofollow">Veer</a>.</p>
    <p>ShinnType has released 14 retail typeface families (113 fonts): Artefact, Alphaville, Beaufort, Bodoni Egyptian, Brown Gothic, Eunoia, Goodchild, Handsome, Morphica, Nicholas, Panoptica, Preface, Walburn, and Worldwide. </p>
    <p>ShinnType has also designed many exclusive commissioned typefaces, including: Aldo, BN Gothic, Nelson, Richler, and Tribune Century.</p>
    <p>ShinnType also does custom logotype and lettering work, especially newspaper mastheads.</p>
    <p>ShinnType is located in <a href="/wiki/Toronto" class="freelinking" rel="nofollow">Toronto</a>, <a href="/wiki/Canada" class="freelinking" rel="nofollow">Canada</a>.</p>
    <p>website: <a href="http://shinntype.com/" title="http://shinntype.com/">http://shinntype.com/</a></p>
