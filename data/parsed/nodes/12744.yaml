    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundries</a>&nbsp;:&nbsp;ShinnType</strong></p>
    <p>ShinnType was founded in 1999 by <a href="/node/12442" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Nick Shinn</a>, to publish his original type designs. Prior to that, his types had been published by a number of different&nbsp;companies.</p>
    <p>ShinnType fonts are distributed by <a href="/node/add/wiki?edit%5Btitle%5D=Faces" title="Create node &quot;Faces&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Faces</a>, <a href="/node/13426" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontHaus</a>, <a href="/node/13938" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fonts.com</a>, <a href="/node/12019" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontShop</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Fontworks" title="Create node &quot;Fontworks&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Fontworks</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Phil%27s%20Fonts" title="Create node &quot;Phil's Fonts&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Phil’s Fonts</a>, <a href="/node/12184" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">MyFonts</a>, and <a href="/node/12009" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Veer</a>.</p>
    <p>ShinnType has released 14 retail typeface families (113 fonts): Artefact, Alphaville, Beaufort, Bodoni Egyptian, Brown Gothic, Eunoia, Goodchild, Handsome, Morphica, Nicholas, Panoptica, Preface, Walburn, and&nbsp;Worldwide. </p>
    <p>ShinnType has also designed many exclusive commissioned typefaces, including: Aldo, <span class="caps">BN</span> Gothic, Nelson, Richler, and Tribune&nbsp;Century.</p>
    <p>ShinnType also does custom logotype and lettering work, especially newspaper&nbsp;mastheads.</p>
    <p>ShinnType is located in <a href="/node/add/wiki?edit%5Btitle%5D=Toronto" title="Create node &quot;Toronto&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Toronto</a>, <a href="/node/19573" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Canada</a>.</p>
    <p>website: <a href="http://shinntype.com/">http://shinntype.com/</a></p>
