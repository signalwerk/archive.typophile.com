    html: |-
      <p>Re: usage guidelines; yes, I did mean something brief. Having been on the receiving end of corporate standards manuals in the past, the bigger and more detailed they are, the less likely they are to be followed. A one- or two-page list of basic dos and don'ts should suffice. </p>
      <p>If you do want to specify a minimum amount of space round the logo, it may be worth­while actually including that space in the files you create, so that any awkward so-and-so who wants to break the guidelines will have to resort to a "sin of commission" (intentionally cropping the image) rather than the merely ignorant "sin of omission" (just sticking another logo or some text right next to  it).<br>
      _______________________________________________<br>
      Ever since I chose to block pop-ups, my toaster's stopped working.</p>
