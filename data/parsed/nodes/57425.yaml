    html: |-
      <p>PMS uncoated for print media (generally) and PMS coated for signs, banners, vehicle graphics, etc. </p>
      <p>In the sign industry, even though 4 color printing is reliable, you might always be faced with a situation which calls for routed letters, or graphics that must be cut on the plotter. Routers and plotters only see vectors.</p>
      <p><em>I thought EPS’ were vector based? </em></p>
      <p>An eps file can have embedded bitmaps. And, since your logo may have to cross platforms, sometimes fountain fills are converted to ugly bitmaps in some software conversions.</p>
      <p><em>Is it best then to include the vectored logo as a pdf?</em></p>
      <p>PDFs cross platforms and software boundries best with the least problems.</p>
      <p><em>...but how do you convert strokes to objects?</em></p>
      <p>That depends on your software. Illustrator has a feature under path, I think, outline stroke.</p>
      <p>I also can't stress enough, test all formats and make everything backwards compatible. Not everyone has the software budget they would like to have. Some of us would like to have a software budget.</p>
      <p>~~~~~~~~~~~~~</p>
      <p><a class="freelinking external" href="http://www.thefontry.com" rel="nofollow"><em>...from the Fontry </em></a></p>
