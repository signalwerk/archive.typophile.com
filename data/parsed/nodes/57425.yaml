    <p>Hi</p>
    <p>Regular stalker of these forums, but finally I have a question to post...</p>
    <p>I've just designed a logo for a company and I'm putting together a CD with all different versions they may need - is there anything I'm missing from this list;</p>
    <p>- CMYK logo: colour and mono (inverted versions in both)<br>
    - RGB logo: colour and mono (inverted versions in both)<br>
    - jpegs, eps'</p>
    <p>Thanks in advance!</p>
