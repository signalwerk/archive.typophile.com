      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Figgins_5067.png"></div><br>
      There are several ways in which alternates may operate. One that has become quite common in recent years is in typefaces that provide two different "flavours" (old style and modern) with alternate forms of "a" and "g" available in a Stylistic Set.<br>
