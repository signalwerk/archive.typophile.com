    votes: null
    html: |-
      <p>I agree there are too many bad fonts available, and some of these are way too expensive. I don't think offering a high quality font cheaply is likely to change that. I guess MyFonts is based around offering everything to anyone, which means it's often frustrating for good typographers to find good typefaces.</p>
      <p>My concern with offering your font at such a low rate would be that it might be judged to reflect that it's not worth very much, and may be overlooked if people notice the kinds of expensive rubbish that clutter up the amateur font world.</p>
      <p>The other thing to bear in mind is that for some designers, fonts are their profession and they have to make a living from sales. I don't think there's any sense to compare the price of font licences with buying a CD. A font is software, and plenty of software is a lot more expensive than a music CD. The other thing with music CDs is that the sales volumes are many times higher than for an average font.</p>
      <p>At any rate, the font industry is changing rapidly as we speak — I'm sure in the future we'll be licensing fonts on demand so we pay only when we use them.</p>
      <p>It will certainly be interesting to see how the market works, if you're able to share any conclusions in the future.</p>
