    html: |-
      <p>Thanks ^^</p>
      <p>Some people were wondering is the price a limited promotion or I'm just stupid...<br>
      In fact, I planned to give this font away for free, but I wanted to "see how the market works" too.<br>
      I'm well aware of font pricing (I visit MyFonts every day), but as a recent student and currently unemployed post-graduate I can't afford to buy a display typeface for $30 just because I like it. Even if I could - what would I do with my expensive purchase? Use it somewhere once or twice? Music albums or books take years to make and still they cost about ten bucks.<br>
      Also, such low price is attention-grabbing.</p>
      <p>On the contrary, MyFonts has (because they do no selection) plenty of typefaces that cost three times as much but I wouldn't download them even for free, because they don't have my diacritics and/or good kerning, anatomy. </p>
      <p>I think in the future font market will have to follow current music industry's trend to give something (or everything) for free and make money from extra special products. There's just such a huge oversaturation of fonts. Especially neutral text and sans-serif ones.</p>
