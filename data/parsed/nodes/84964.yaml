    html: |-
      <p>$30 at least.  You have to bear in mind that the vast majority of your customers will not be Lithuanian students like yourself, but American graphic designers who can easily afford $30.  Sure, you might lose a few sales charging higher, but you don't have to sell as many to earn as much!  It's all about finding a balance.  You can always offer a non-commercial and commercial license, to cater for both kinds of customer, or even let it be known that students etc. can contact you for a discount code.  Selling fonts too cheap doesn't do you any favours - it will reduce the shelf life because you sell more, it is far more likely to be pirated quickly because someone will think less of 'sharing' their $8 purchase than their $30 purchase, and it doesn't climb as high up the Hot New Fonts / Bestseller listings where you then get extra publicity.</p>
      <p>While it's quite noble that you price your font at 'what you would pay for it' I think you should price your font at 'what you would value it at'.  Sometimes this might backfire and you don't sell any, other times you'll have a big hit and cash in.  It all evens itself out.</p>
