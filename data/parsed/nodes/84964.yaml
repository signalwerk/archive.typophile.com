    <p>Sold at <a class="freelinking external" href="http://new.myfonts.com/fonts/eimapas/magnola/" rel="nofollow">MyFonts</a> and previously named "Magnola"<br>
    Due to lots of images I'll just link to presentation on <a class="freelinking external" href="http://www.behance.net/eimantas/frame/2035997" rel="nofollow">Behance</a> instead.</p>
    <p><strong>Just send me a message for promo code (but you can't be fresh to forums).</strong></p>
    <p>The features are:
    </p><ol>• Probably every latin accent there is.<br>
    • Smart swashes that occur only at the beginning/end of the line. They don't work in MyFonts preview engine though – you need OT application for that.<br>
    • Lots and lots of ligatures (accented too).<br>
    • Oldstyle (default) and Lining numerals.<br>
    • English and Portuguese ordinals.<br>
    • Capital spacing, common fractions, scientific nominators and denominators.</ol>
    <p></p><p></p><div class="imageWrap"><img src="http://typophile.com/files/Magnel-title_6553.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/sriftas-09_3686.png"></div><p></p>
