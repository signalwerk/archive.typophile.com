    <p>Greater Albion's Svengali Roman has grown from a single face to a family of four faces:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Svengali Roman font family_3649.png"></div><p></p>
    <p>In addition to the already released regular face,  a bold weight has been added, as well as an incised (hand cut) face, and a weathered ‘Newsprint’ face.  Try it out for yourself on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/svengali-roman/ " rel="nofollow"> Myfonts.com</a>.  In the meantime there are some new examples of Svengali Roman in use posted on our <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>.</p>
