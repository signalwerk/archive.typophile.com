      <p>Amazing! Thanks for pointing me in the right direction. These are some very nice type faces. I'm looking at <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/home-room/regular/" rel="nofollow">Home Room JNL</a> as well as <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/eckhardt-poster-display/" rel="nofollow">Eckhardt Poster Display JNL</a>. </p>
      <p>They remind me of <a class="freelinking external" href="http://www.myfonts.com/fonts/chank/liquorstore/" rel="nofollow">Liquor Store</a> by <a class="freelinking external" href="http://chank.com/index.php" rel="nofollow">Chank Diesel</a> which is another option I'm considering.</p>
      <p>My plate is full and I'm going to see which one fits best. Thanks for your time, it's greatly appreciated!</p>
