      <p>Ryuk, thank you for your reply. I am only looking for the main-title type. I believe <a class="freelinking external" href="http://www.losttype.com/font/?name=outage" rel="nofollow">Outage</a> is on target for THE STRENGTH GUYS and for VINTAGE INDUSTRIAL, I would say is <a class="freelinking external" href="http://www.losttype.com/font/?name=liberator" rel="nofollow">Liberator</a>. I had looked at <a class="freelinking external" href="http://www.houseind.com/fonts/unitedcollection" rel="nofollow">United Sans</a> on HI but the "I" differs, however, it may be used for the digit and other letters. </p>
      <p>Would you happen to know the type in the image below for the cinema/theatre name that says "Oriental"? It looks very near to something like Outage again, but unsure. Thanks again for your help.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/cinema_5541.png"></div><p></p>
