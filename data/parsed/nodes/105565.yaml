      <p>Actually, there is more than one single font per logo.<br>
      THE STRENGTH GUYS: main lettering is <a class="freelinking external" href="http://www.losttype.com/font/?name=outage" rel="nofollow">Outage</a>, hard to say for me the 2 other ones.<br>
      VINTAGE INFUSTRIAL: I'm pretty convinced you'll find it out in this <a class="freelinking external" href="http://typophile.com/node/105488#comment-562631" rel="nofollow">post</a>. Without too much thinking, I guess <a class="freelinking external" href="http://www.houseind.com/fonts/unitedcollection" rel="nofollow">United</a> Sans and Serif should do you job for both lettering and digit.</p>
