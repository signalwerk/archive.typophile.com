    html: "<p>Sorry, can't name it but doubt it could be a font. Most of signages and neon letterings are custom but... <a class=\"freelinking external\" href=\"http://www.myfonts.com/foundry/Jeff_Levine\" rel=\"nofollow\">Jeff Levine</a> has done many digitizations of these signages. Here are some, in the same vein with a main difference on /A (but easy to reconstruct from /O top half part): <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/jnlevine/waite-park\" rel=\"nofollow\">Waite Park</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/jnlevine/sign-production\" rel=\"nofollow\">Sign Production</a></p>"
