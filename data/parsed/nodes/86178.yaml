    html: |-
      <p>I agree with Andreas. People in lettering tend to come from a lot of different angles to lettering. Folks like John Downer and Charles Borges de Oliveira, for example, came from a sign painting background and signs of this are in their work. Myself, Michael Clark, and others came from the calligraphy tradition and this shows in our work. Some folks have always drawn lettering and their sensitivity to letter forms varies greatly. Folks like Doyald Young (RIP) and Jessica Hische have a knack for very well drawn letters. Some folks with less technical skills at lettering per se have a very fun and illustrative styles. Nate Williams comes to mind in that realm. </p>
      <p>You might start by scouring sites like welovetypography or flickr for people who's style you admire. And, of course, feel free to post samples for critique.</p>
