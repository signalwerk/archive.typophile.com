    <p>Hi,<br>
    I'm a designer from Oxford, UK. I've been working in the industry for five years and, touch wood, things are going pretty well. My main area of interest lies in contemporary applications of traditional methods. I've been letterpress printing for 6–7 years but have become increasingly aware that my work could sometimes benefit from custom lettering. Not to jump on the band wagon of Jessica Hische et al, current trends seem to be moving in that direction and I'd love to be a part of it!</p>
    <p>In my time as a letterpress printer I was lucky enough to work with a very skilled and experienced (and sought after) printer. I'd love to get in touch with an experienced hand lettering artist who could pass on tips and pass just the occasional eye over work in progress.<br>
    I tend to work with pencil (sketching and draughting) and then produce the final design in Adobe Illustrator. </p>
    <p>Can anyone help?</p>
    <p>Many thanks</p>
