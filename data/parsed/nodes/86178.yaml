      <p>“Lettering” embraces quite a lot of ways to do it. Writing, drawing, painting, carving, forging, casting … and much more. I suppose the simple way to get startet is to just show us threee images of what you do and then, according to experience, typophiles will not let you wait that long with some feedback.<br>
      Or do you think of hiring a sort of personal tutor?</p>
