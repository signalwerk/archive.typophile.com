    <p>A while ago me &amp; Kris were nerding out and talking about the Vignelli thing, which led to </p>
    <p>“what if you could only use five typefaces for a year” (Say If money was not an option).</p>
    <p>I think I said:</p>
    <p>Trinite<br>
    Arnhem<br>
    Galaxie Polaris<br>
    National</p>
    <p>annd.... hmmm, maybe Serapion (I can’t remember my 5th one).</p>
    <p>Go on try it.</p>
