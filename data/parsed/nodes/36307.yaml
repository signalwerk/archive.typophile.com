    html: |-
      <p><cite>can’t wait to see that one come out!</cite></p>
      <p>Soon, bro! I had to do a whole lot of work on it, Victoria University (in Wellington) commissioned custom weights of National, National Compressed, Newzald &amp; Newzald display. I was also working on Meta Serif at the same time, so ended up kerning a billion styles and I’m kinda over them at the mo. I need to let National &amp; Newzald rest a while before I can get back to them and kern the SC with fresh eyes. </p>
      <p>Now, my list. Hard, but I reckon, in no particular order:</p>
      <p>Lexicon<br>
      Miller<br>
      Meta<br>
      Meta Serif<br>
      National</p>
      <p>That would be enough for a year I think. I am a bit hesitant about National, but have been using it a bit and quite like it. Most of the time I get so sick of seeing/designing my own faces that I can’t stand to use them! (As Meta S was shared, that’s a bit different).</p>
      <p>Has anyone limited themselves to 5 faces for a year?</p>
