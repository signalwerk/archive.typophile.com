      <p>“Has anyone limited themselves to 5 faces for a year?”</p>
      <p>That would be more like a few years, working as an inhouse designer, hence, why I recently stumbled on this site for inspiration. Mmm, National, Meta nice.</p>
      <p>Two that I know I could enjoy for a year: DTL Nobel and Tribute. I don’t know how practical Nobel is for everyday use, but I really think Tribute is beautifully done. The other three I would want to use seem to be impractical choices of historical script/handwriting, that have been overused anyway.</p>
