      <p>More than having things collide, what I was shooting for was making the “TER[R]A” sort of a negative space thing (I was just inept at the rendering). One benefit of this would be to totally avoid the problematic diagonal separating “AW”*. Another benefit would be that you’d only need one color while still exhibiting a boundary between the two parts. BTW, do you think they’d go for a hyphen? Not necessarily textually, just visually - like in the Microsoft logo.</p>
      <p>* Hey, have you tried simply making them share a diagonal stroke?</p>
      <p>hhp</p>
