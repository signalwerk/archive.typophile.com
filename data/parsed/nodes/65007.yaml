    <p>Hello all, I’m getting close to finishing a logo for a venture capital firm which specializes in something called cleantech ventures, basically this means they are raising funds for technology based start ups who are making advances in the alternative energy industry. My client’s tastes are on the conservative side and after designing a lot of logos, we’ve finally narrowed it down to one, but there are strong opinions on the color across the divide between designer and client. I attached an image which has the logo in two color palettes and I’m hoping to see what you think is the better option. Also, which color has more energy, or communicates the idea of energy more effectively? By the way, I’ve presented them with many non blue options, the final has to be some sort of blue... THanks for the help.</p>
    <p></p><div class="imageWrap"><img src="/files/terawatt_3428.gif"></div><p></p>
  html_clean: |-
