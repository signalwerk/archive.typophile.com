    <p>Anyways, the logo has to be in both English and Armenian, and the brochure/web site have to be in English, French and Armenian.  The big challenge is that Armenia has its own unique alphabet that I have barely seen, no less actually have a grasp on. <a href="http://indoeuro.bizland.com/project/script/armen.gif" rel="nofollow" class="link-external">It looks like this...</a></p>
    <p>So why am I posting?  Well I need some help in selecting some good typefaces to start the logo. I have two main ideas for it:</p>
    <p>1) The Armenian alphabet is very vertical in its orientation and contains letters that are quite similar (even Armenians have a hard time reading it).  So I was thinking that the english version should reflect that - Vertical lettering, similar letters (especially in the anavan section, which is repetitive anyways), perhaps with some vertical serifs (closest I have found to a solution is Modern)</p>
    <p>2) Reference their communist past.  Unlike most former Soviet countries, Armenia was better off under communism.  They suffered a massive earthquake in 1988 and have yet to recover.  So soviet/communist references are acceptable.  The town was named for a communist revolutionary.  So if anyone has any suggestions for appropriate faces that have communist/constructivist references/qualities, I would appreciate it.</p>
    <p>Also, has anyone dealt with a logo that is bi-lingual (especially with multiple alphabets)?  How do I keep them balanced without being awkward (stepanavan is long enough already).</p>
