      <p>It would seem that finding an appropriate Armenian type would be the best beginning. Appropriate for both locals and your non-local target audience.</p>
      <p>Another starting point: Armenian type designers<br>
      Manvel Shmavonyan &amp; Henrik Mnatsankanyan (deceased)<br>
      Types from both should be available. </p>
      <p>I've used some from the second, which one North American critic felt was "too Soviet". So this is a genuine issue.</p>
