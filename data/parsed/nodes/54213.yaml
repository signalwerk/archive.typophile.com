      <p>Your site shows amazing restraint, is beautiful, and the coding is meticulous.</p>
      <p>Here's a comment for work "under the hood" though; add at least a few META keywords and a META description. The keywords will just reinforce a little of your brand to the web machinery. And the description will give you more control over the presentation of search query results and make them look a little better. Here's a screen shot of your description for a search result without a META description in your code:</p>
