      <p>Shari,</p>
      <p>Congrats on the improvements you're making on your website.</p>
      <p>One odd thing remains for me as I view it in IE7: some of the items have a drop-out white box behind them, while others do not. I suspect this is not intentional, but perhaps there is some rational that I don't perceive. (BTW, if you change it to make the items display uniformly, I strongly prefer showing the items without a box around them.)</p>
      <p>I also have a suggestion for you: implement a tag for each of your menu entries so that when the cursor is over an item, a tag pops-up with a repeat of the information you currently show below the item after you actually click on the link. This will allow the viewer to decide if the item is one that interests him or her.<br>
