      <p>Great site, great work. Wow.</p>
      <p>Re controlling fonts over Javascript: You're probably referring to the <em>@font-face</em> embedding technology? The problem with that is, as far as I know, it only works on a handful of browsers yet. So it's still good advice to stick with the usual suspects in terms of fonts.<br>
      You know you can specify an array of fonts in CSS? So you could always specify Lucida Grande, plus some other sans to fall back on in case Lucida isn't installed.<br>
      Maybe also look into the new MS Clearview fonts (Calibri, Consolas, Constantia, Cambria, etc.) as options, they're quite nice for screen reading.</p>
      <p>Btw, that nav.png doesn't seem to work. :-(</p>
