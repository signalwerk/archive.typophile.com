      <p>Very minimalist at the moment. The lovely work speaks for itself.</p>
      <p>As a concession to convention, and bearing in mind that potential customers might not be as sensitive or artistic as you are, perhaps a bit less white space ... If you had a nice logo, almost like a chop stamp on a Chinese watercolour in the top corner, it would not detract from your wonderful designs or compete with them. Then some distinction between your details and the menu list of your work would be good. Perhaps even highlighting the relevant description from the list, by means of colour or tabbing would make the navigation easier.</p>
