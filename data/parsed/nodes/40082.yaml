      <p>I do a bit of freelancing at agencies here, and as far as I can tell, women are more in the role of account managers etc or in the production side of things, just as Shu wrote. Very few seem to make it through the glass ceiling to get to the Creative Director or even Art Director level (I really don’t know how to call all these jobs, they seem to changing every year!). Those who make it, are often given feminine accounts, such as cosmetics, clothing, maybe travel. Mind you, I used to work with a female art director for a petrol station chain, but even that was more about gardening tools and chocolate than petrol. There seems to be more female copywriters than art directors.<br>
      All this is just my gut feeling, no science about it. Ambitious young men get hired and promoted, when young women don’t. I suppose the main reason is, that the young man is unlikely to go on maternity leave (here in Finland you can be absent up to about four years and still expect to have a job waiting for you).</p>
    html_clean: |-
