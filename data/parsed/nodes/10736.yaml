    html: <p>Graham, your doing a great job. <br> <br>That new "a" looks great (the 1st one). <br>The UC looks good except (imo) for the "S". I know on a grid it is perfect, <br>but visually the top serif extends a little too far. <br>Also the "W" might benefit from a slightly extended width. <br> <br>The lc is looking good except for my little problem with the "s" ;) <br>I would go with the 2nd "g" in your alternates. It has a nice balance <br>between both counters. As for the "jy", I think the originals have the <br>best character, stick with them. <br> <br>keep it up and you have a winner! <br> <br>Bren <br> <br></p>
