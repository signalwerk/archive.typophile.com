    html: <p>I really like this too. <br> <br>The only other suggestion that leaps out at me <br>is to try pulling in the overhang of the lc "a" <br>just a bit. As it is, it looks just a bit top-heavy <br>on the left side. <br> <br>As for the italics, try more cursive-italic forms, <br>particularly in the "a" and its related characters <br>("b", "d'", "g", "p", "q") and also in the "k". <br> <br>This could be a commercial success, <br>especially with a full range of weights. <br>I'd buy it. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>David</p>
