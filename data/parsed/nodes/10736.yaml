    html: "<p>&gt; worth finishing ? <br> <br>Definitely. <br> <br>UC: the \"G\" needs a serif inside. The \"Q\" is great. The \"Y\" needs work. <br> <br>lc: I don't like the \"a\". Maybe cut the \"f\" at the top of the arc. Move the bottom of the \"g\" to the right. The \"j\" needs a serif. The \"k\" is great. Superb \"q\". Not sure about the \"r\". The \"y\" needs a serif. The \"z\" is leaning. <br> <br>Numerals: Have a smaller set[ too]. <br> <br>There's something fundamentally wrong about the italics. <br> <br>Peculiars: I like the first eszet and the first percent (great!) but not the first brackets. <br> <br>Make three weights, one an Ultra. <br> <br>hhp <br></p>"
