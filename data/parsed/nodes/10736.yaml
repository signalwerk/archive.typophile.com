    html: <p>The image dump is greatly pixillated, so the image lines are a bit variant in thickness. The lc a is a problem and will have to have another go at it, the florin has not yet had the 12 degree slant put on it, that was on purpose. Will give the 'y' and 'g' half serifs such as in the 'f', that should clear up the problem of current serif looking just like a lump on the end of a line (or even just flare the bottom of the desend) The lc g may need the lower half more rounded to offset problem observed <br> <br>The'Italic' version that worried you was not intended to be true italic, it was just experimentation to get something better than an oblique, something that was visuably different than the first. I was going to call it the Anglic version.</p>
