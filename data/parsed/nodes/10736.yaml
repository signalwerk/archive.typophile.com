    html: "<p>UC: I like the 1st \"G\". The \"L\" is too wide for good spacing. <br> <br>lc: The \"a\" is worse :-( The \"f\" is great, but not the \"j\" or \"y\". The first \"r\" is best. <br> <br>If that's a florin, it should slant. I'm not sure about the asterisk or the quotes. I like the dollar/cent without the serifs. I like the first cedilla, but since you have room in the descender space you could have a deeper one too. <br> <br>Keep it up! <br> <br>hhp <br></p>"
    html_clean: "<p>UC: I like the 1st \"G\". The \"L\" is too wide for good spacing. <br> <br>lc: The \"a\" is worse :-( The \"f\" is great, but not the \"j\" or \"y\". The first \"r\" is best. <br> <br>If that's a florin, it should slant. I'm not sure about the asterisk or the quotes. I like the dollar/cent without the serifs. I like the first cedilla, but since you have room in the descender space you could have a deeper one too. <br> <br>Keep it up! <br> <br>hhp <br></p>"
