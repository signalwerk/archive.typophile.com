      <p>A few months ago I spent some time looking into John Day's work. Amongst other things, he, rather than Caslon, was the first English punch-cutter of serious ability, producing work which would seem to most of us now Garamondian, but which was really in the broad, light though low-contrast, serenely even manner of Jean de Tournes of Lyon - a kind of Renaissance Baskerville, though with better proportions. </p>
      <p>Day put up the great Francois Guyot in his house for a while, and used a double pica roman and italic typeface of his; Day Roman and Heine's Tribute, issued by Emigre, are both modelled on this same type. Tribute was <a href="http://www.emigre.com/EFoITrbF.php">approved</a> by John Downer but <a href="http://cgm.cs.mcgill.ca/~luc/troop-on-tribute.txt">demolished </a> by Bill Troop. In the same commentary, the Apostrophic Labs sketch of the roman, only a few hours' work, is held up as far more sensitive, though it could hardly have been other than 'inadequately conceptualised'. Having looked hard at the original, I agree, and the contrast is fine, but the descenders have been brutally truncated. I also like Tribute: it's hardly a revival, but very attractive, perhaps best thought of as 'Mrs Guyot'.</p>
      <p>I don't actually know whether the DTL italic would synthesize at all with the Apostrophic roman, but each is good. I think you'd just have to play around if you really wanted to find a matching italic - Granjon italics might work.</p>
    html_clean: |-
