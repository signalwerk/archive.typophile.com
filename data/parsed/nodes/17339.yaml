      <p>Geoff</p>
      <p>This is another can of worms. But once you remove copying restrictions I really don't know that EULAs or any other measure can actually provide protection. In the early digital years, and pre-digital (analog) years, licensing was fairly clear, simply because proprietary interests were understood and legally binding. Once that was done away with (and not for the common good as one might assume), well, all hell breaks loose. I assume those with the most power and money, figured they would be the beneficiaries. And, actually, they were. But they still do the obligatory whining. But do you really think they actually care about someone copying their fonts? There are far bigger concerns at play.</p>
      <p>It's the sole-product foundries like P22 and FontFont and Bitstream and Emigre that are hurt most by these "sharing" schemes, not Adobe or Microsoft or Linotype or Monotype Imaging.</p>
      <p>Gerald</p>
