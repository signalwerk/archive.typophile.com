      <p>Nick</p>
      <p>Thanx for words, and agreed, one of the most unusual explanations on why we need freeware fonts.</p>
      <p>My period on freeware fonts was started by an interest in doing something constuctive with my free time, and I will be the first to admit, quality went out the door. You end up on a spiral where you have to get more out, quicker, and you do end up learning, but usually at the expense of everything you should be doing. </p>
      <p>I quite making free stuff about two years ago, mainly due to the rudeness of a lot of people who were virtually demanding free stuff. I made a lot of friends, yes, but more rude, obnoxious people. Now I can take more time to learn properly as I go, and hopefully I will improve each time I make one.</p>
