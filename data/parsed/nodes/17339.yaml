      <p>A good font suits its purpose well--book, screen, newspaper, phone book etc etc--and has good aesthetic quality as well. There is a subjective element of course, but it's not all subjective. </p>
      <p>The 'suiting the purpose' has a lot of objective elements: if for extended reading it's comfortable to read at the intended size; it doesn't waste paper, if that is a need, it can get the readable result with the technology available, etc. </p>
      <p>Aesthetics have a fairly large scope of at least inter-subjective standards. You can talk about balance, variety, color across very different kinds of typeface. Just as Picasso's women are often ugly, but well drawn by a lot of graphic design standards. Then there is also the element of personal taste, of course. But it isn't all a matter of personal taste and preference.   </p>
      <p>For example, for the screen at 10 pt Georgia is better than University Roman. I also happen personally to detest University Roman, but that is another matter.</p>
