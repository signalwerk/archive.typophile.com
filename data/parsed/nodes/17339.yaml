      <p>Tiffany</p>
      <p>Yes, but, this is just finger wagging isn't it? Once the technology for unlicensed copying was put in place and Pandora's Box was opened, it became a matter of trying to legislate human nature.</p>
      <p>In regard to our little corner of the world:</p>
      <p>The early font wars were not over type sales, they were over who would control the method of transmission. Type sales were never a major part of Adobe, though they were quite important for name recognition. Adobe unlicensed its PS1 format as an attempt to make the PostScript Page Description Language the de facto standard. In doing so it eliminated the similar aspirations of its main competitor Bitstream. </p>
      <p>Providing the PS1 format to Altys literally opened the door for the indy foundry and for anyone else; all one had to do was buy a copy of FOG and you were in business whether with good intentions or no. Adobe wasn't concerned with all this sudden new unregulated competition because they controlled the means of transmission. And they had far larger plans for it.</p>
      <p>Adobe put a lot of free guns on the street, so to speak, because it owned the ammunition. And ammunition sales far outweigh gun sales. As a result there is a lot of gun play and we good folk are left with the meager option of telling the bad folk it's not nice to shoot off guns. Well, they are going to. Because they can.</p>
      <p>Gerald</p>
