      <p>Graham, you have no need to apologize for what you are doing. A simple fact which seems to have eluded most of the participants in this particular forum is that free fonts constitute a first line of defense against font theft. You may notice that our clueless little friend who began this thread didn't ask where she could find "a few good free fonts"; rather, she was interested in acquiring LOADS of free fonts.</p>
      <p>In our acquisitive society, those among us who sell our fontwares benefit from the phenomenon by which fonts have acquired the cachet of <strong>bling</strong>, which—as everyone knows—one cannot have too much of (remember: whoever dies with the most fonts, wins). If there were not LOADS of free fonts to be had, our greedy little friends would most likely turn to acquiring pirated commercial fonts, much like they turn to acquiring pirated commercial music (maybe someone with the RIAA ought to be paying attention here).</p>
      <p>So, rather than slamming the creators of freeware fonts, more people engaged in the selling of fonts ought to be thanking them: they do what they do because they love doing it and, in the process, they perform an invaluable service for those of us who do it for love AND money...or just money.</p>
      <p>Thank you, Graham, and everyone else who satisfies the gluttons...</p>
