      <p><em>(How come I never had problems with leechers?)</em></p>
      <p>You're fortunate, I suppose. A few examples from my experience (not their actual words, but their true intent):</p>
      <p>A. Hey, Nick, I really like this Blue Island font, but I don't want to pay for it. How about you make a free version of it? That way, the original designer gets screwed, you do lots of work for nothing, and I get the font for free...</p>
      <p>B. Hey, Nick, I spend hours playing with the type testers for your commercial fonts (although I never buy any of them); how about you make testers for all your freeware fonts, so I can waste <em>even more </em>of my time and your money (bandwidth fees) playing around?</p>
      <p>On top of that, a number of freeloading free font sites were hot-linking back to my site, rather that hosting my free stuff on their servers. When the bill for excess bandwidth charges passed a thousand dollars in one year (to GIVE stuff away), I thought it was time to call it quits. Am I bitter? No: just a little wiser about the habits of the clueless, the greedy, and moral midgets in general...</p>
