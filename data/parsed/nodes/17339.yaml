      <p>Thomas</p>
      <p>While some views are opposing, I am generally in agreement with you. There are a lot of free fonts out there which are bad. I am probably responsible for a good proportion of them myself. </p>
      <p>Well crafted fonts should be the priority in any commercial endeavour, but a lot (not all) of people after free fonts, as the original question in this thread was, are not after them for commercial use, therefore they should have the ability to use any font, good or bad, as long as it suits the effect and appeal they want. Advise is always acceptable of course.</p>
      <p>Also, thanx for the casual backhand slap across the face. Unfortunately I am not priveliged like some to have skill, training and the access to a company who is prepared to supply all the goodies and assistance required to make better fonts, So I will plug away at the rubbish I seem to be making, teaching myself by my own mistakes and enjoying it. I have never deluded myself, or others, that I am anything but average. I do it in the spare time I have, and as a family man, do not let it become the do all and be all of my existence.</p>
      <p>All best.<br>
      G</p>
