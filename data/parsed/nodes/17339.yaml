    html: |-
      <p>I wonder if there has been another industry (other than the current plague of unauthorized copying and distribution of "free" music and videos) that virtually gave away its products.</p>
      <p>I understand the marketing brilliance of Gillette giving away free razors with handle when launching Mach2 and Mach3, since you can't keep shaving with the same razor forever.</p>
      <p>I know that in the infancy of software development, PC based games, freeware, etc., somehow initiated no cost benefit to end users.</p>
      <p>I realize that font bundling, originally done by equipment manufactures and now by software companies, gave away enough fonts in order for the end user to get a running start.</p>
      <p>But the perpetuating concept of FREE FONTS to new users of type has created a consumer base that think fonts are too expensive to buy.</p>
      <p>On one side is the user base, which is comprised mostly of individuals and companies who don't (or don't now how to) make money using type. Yes, it's not like the "ol' days" when typesetting service cost money and type shops bought fonts as part of business.</p>
      <p>I think the agencies and graphic designers today are forgetting (or ignoring) the typesetting aspect of what they do. Somehow, even if the client provides the text file, the use of the type itself should have value. For instance, when estimating or billing a newsletter why can't you assign a typesetting fee for characters set? New typefaces are premium priced.
      </p><ul>
      <li>1500 characters using FF Absara Sans (new design) @ $.005 per character = $7.50</li>
      <li>800 characters using Adobe Jenson Pro (bundled InDesign) @ $.001 per character = $.80</li>
      <li>1700 characters using Helvetica (bundled with equipment) @ $.00 per character = $.00</li>
      </ul>
      <p></p><p>Even if you (the designers out there who want fonts for free) don't actually put this fee on the invoice, you should calculate it into the final price to the client. </p>
      <p>You should be thinking in terms of the value of type on paper or screen. Your grandpa made money setting type, so why are you giving it away.</p>
