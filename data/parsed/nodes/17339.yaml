      <p>Thank your for your insight, Mr. Horton.</p>
      <p>I've downloaded and printed some of Marini's Fell Revivals at 600dpi, and I'm speechless.</p>
      <p><a href="http://www.iginomarini.com/fell.html">http://www.iginomarini.com/fell.html</a></p>
      <p>Is it my untrained eye, or do these truly look beautiful. It is as if I'm reading one of the very early (modern) editions of Tacitus. The italics seem to have just the right amount of ink "spill" or thickening in certain areas, such as the italic lower case "n" in the De Walpergen Pica (at 10.5pt.) And the way the middle curl on the "w" is just a bit too thick to allow the inner white area to show through completely. This is really brilliant stuff.</p>
