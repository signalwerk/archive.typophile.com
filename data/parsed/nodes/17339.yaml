      <p>Underware, at TypeCon 05, was selling small sample books for Dolly and Sauna for about $10 or something. Each was filled with interesting facts and stories related to and set in the font and each included a CD with the entire font family on it for trial use. I thought that was a brilliant idea and bought both. I've been suggesting them to clients where appropriate and am scraping together cash myself because they're both great faces and I've had a chance to try them out (someday soon I'll have them). It makes my life as a designer so much easier.</p>
      <p>Also, I've actually licensed a font family from FontShop because of their free single weight downloads, which I used in a comp for a client.</p>
      <p>Both of these are good examples of quality type for free (I consider the cost of the first one to be for the books, not the fonts), but one has restricted usage and the other has the restriction of being one weight, so there's a trade-off. But it seems like a fair one to me.</p>
