      <p>Let me re-phrase that: 95-99% of the free fonts that aren't rip-offs of retail fonts are junk. Then again, I think that at least 20-40% of retail fonts are junk, too. Maybe half or more when I'm in a bad mood.</p>
      <p>I'm reminded of Sturgeon's Law. Science fiction author Theodore Sturgeon was asked why there was so much bad science fiction out there. He said: "Sure, 90% of science fiction is crud. That's because 90% of everything is crud."</p>
      <p>(Interestingly, whenever this is quoted, people tend to replace "crud" with another word.)</p>
      <p>Why yes, I do think the Eeyore world view is basically accurate. Why do you ask?  :)</p>
