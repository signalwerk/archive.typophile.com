      <p>I recently wrote a lengthy blog post on font quality, here: <a href="http://blogs.adobe.com/typblography/2005/12/quality_in_type.html">http://blogs.adobe.com/typblography/2005/12/quality_in_type.html</a></p>
      <p>We can debate the aesthetics part of this, but there definitely <strong>IS</strong> such a thing as a bad font when one is talking about the technical and craft aspects of font design.</p>
      <p>There are of course some really first-rate free fonts out there, and this is a fine place to come and get pointers to them. But even among those, there are precious few that can give you a serifed text face that comes complete with regular, bold, italic and bold italic variants. If you need a basic family like that, some otherwise great free fonts won't fit the bill (e.g. Gentium).</p>
      <p>Cheers,</p>
      <p>T</p>
