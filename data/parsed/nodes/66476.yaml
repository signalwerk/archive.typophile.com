    <p>I'm designing a book about Medieval churches and would like to use Fleurons to decorate the copy and boarders; does any one know of any good online resources/precedents/examples. I'd like it to be an informed design rather than fluffing it.</p>
    <p>Many thanks,</p>
    <p>R</p>
