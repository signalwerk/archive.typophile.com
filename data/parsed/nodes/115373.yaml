      <p>Shipping tags -- my dad used to have these in the 1950s. Clip art girl with permed short hair, 1920s to 1950s. Clearly not from the digital font era and perhaps not even photo-lettering. Agree 100% with your classification as Fraktur. Very unusual to find sloped Fraktur script.  This is not in script section of Jaspert's _Type encyclopaedia (1970)_. Worth digging further.<br>
      Don</p>
