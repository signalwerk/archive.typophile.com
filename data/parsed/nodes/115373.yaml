      <p>Here is Plakat Fraktur by Peter Weigel <a href="http://www.peter-wiegel.de/PlakatFraktur.html" title="http://www.peter-wiegel.de/PlakatFraktur.html">http://www.peter-wiegel.de/PlakatFraktur.html</a><br>
      My loose translation of Peter Weigel's description, which I trust is an improvement over the Google machine:  Poster Fraktur is a representative commercial font from the early 20th century. It is striking and bold, and is designed for advertising. I have supplemented the font with ligatures and used the UNZ1 coding. This font is free for personal use only. [This font is based on Deiter Steffmann's digital font, so I still don't know what is legitimate.]<br>
      Don</p>
