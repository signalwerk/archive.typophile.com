    <p>Hello there,</p>
    <p>Very close to my house, here in Istanbul, lies a very old latin cemetery, with tombs from french citizen, italian, polish, armenian... Really old tombs. I was scouting around this afternoon when I came across a graveyard from 1800, on which the carved lettering looked really really out of date - I mean, much more modern.</p>
    <p>What do you think?</p>
    <p>dr</p>
