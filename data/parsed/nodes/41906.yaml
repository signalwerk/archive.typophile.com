      <p>Wow, David.</p>
      <p>Weird - and kind of wonderful.</p>
      <p>They do something like that around here (Toronto), when old graves are moved or reclaimed they'll take the headstones and mount them on a new monument. But no quite like that. Of course around here, 1800's is old. I'll post some images in a day or so.</p>
      <p>The sans is quite interesting. I often wonder how much type or lettering styles are influenced by the medium (stone carving is, after all, different from calligraphy with a broad nibbed pen.. ) or contemporaneous fashions and styles. And, I'm guessing in the case of a European cemetery in Turkey, the cultural background, training and influences of the stone carver has something to do with it.</p>
      <p>-=®=-</p>
