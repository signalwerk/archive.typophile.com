      <p>Yes, it is indeed creepy and fantastic. I've seen before old cemeteries being moved away in a crypt, but this is a first for me. About the letterings, it's very interesting for me to see some letters which remind me a lot of Bodoni's style on graveyards that were carved very far away from italy, and of course this very modern sans...</p>
