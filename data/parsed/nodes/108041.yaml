    <p>Dear typophiles,</p>
    <p>I wonder if you can help me with this;<br>
    I'm looking for a Japanese font with Japanese characters for numbers.<br>
    So, not using our own 1-9 'characters' but Japanese characters representing them.<br>
    Does such a thing exist?</p>
