    html: <p>The first two represent zero (the first is the official kanji, and the second is an alternate form). The next ten are one through ten, followed by 100, 1,000, 10,000, 100,000,000, and 1,000,000,000,000. <a class="freelinking external" href="http://en.wikipedia.org/wiki/List_of_kanji_by_concept#Numbers.2C_counting.2C_sequence" rel="nofollow">This Wikipedia page</a> may help.</p>
