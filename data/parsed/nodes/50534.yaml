  html: |-
    <p>While walking home the other day I spotted this on the front-side of a new apartment building. I thought the typographic treatment was very unique, and I liked the way the letters flowed in and out of the surface.</p>
    <p>If you've seen type used in interesting ways where you live, please share them here.</p>
    <p><img src="/sites/default/files/old-images/SNV31250_6019.JPG"><br><img src="/sites/default/files/old-images/SNV31249_4185.JPG"></p>
