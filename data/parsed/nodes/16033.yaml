    html: <p>OpenType fonts will work with pre-CS Adobe applications (and other non-Adobe applications), but you won’t have access to many of the OpenType features. One problem you may encounter, however, is that if your older files make use of small-cap or “expert” characters, your documents will want to find those glyphs in separate font files; most OpenType fonts now include both within the glyph palette of the basic font style (roman, italic, bold, etc.). Your dilemma sounds to me like a royal headache, or, that is, a bureaucratic headache, because what it boils down to is the fact that your workflow is outdated and needs to let go of what was and accept that technology changes. I don’t envy your position.</p>
