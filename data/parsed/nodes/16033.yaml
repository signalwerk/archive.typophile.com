    html: |-
      <p>Cameron,</p>
      <p>The problem you’re encountering is not directly related to font format as such. You want to have the same menu names on Mac and Windows. This is possible regardless of font format involved, but it requires the font developer have considerable understanding of the menu name issues. These include the particular name structures (PostScript FontName, PostScript FullName) that Adobe applications use to generate their cross-platform menu names and determine family groupings in our font menus.</p>
      <p>Again, it’s possible to do all this consistently, regardless of font format, and even across font formats and platforms. But the font developer needs to know what they’re doing. It’s not something you can solve as an end user - unless you count modifying the fonts yourselves, which may not even be permissible under the license agreement (EULA).</p>
      <p>Regards,</p>
      <p>T</p>
      <p>Thomas Phinney<br>
      Program Manager<br>
      Fonts &amp; Core Technologies<br>
      Adobe Systems</p>
