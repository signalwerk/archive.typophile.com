    <p>I work in an in-house studio for an organization that uses a ‘corporate font’ (Azkidenz-Grotesk) for most of its communications, including work that comes out of the Design studio (on MACs) and desktop-published stuff from everyone else (on PCs). We were experiencing some conflicts with transferring files from PC to MAC, which as far as I’m aware were due to the individual font files being named differently between the two font formats. It is our IT department that is dealing with the font reseller in this case, but I’m not sure that they have the best knowledge at their disposal regarding the issues involved, so I’d like some input from anyone out there…</p>
    <p>The solution from IT was to replace all the MAC fonts, which were previously Type1 Postscript, with TrueType versions. This caused some hiccups in our Postscript workflow, especially in relation to creating PDFs for approvals and for output. Another issue is that the TrueType ones appear in the font list as individual fonts, rather than faces within a family, a workflow problem for us when typesetting large amounts of text and converting from one font to another without loss of formatting.</p>
    <p>So we went back to the reseller and asked them to resupply Type1 fonts for the MACs then create new TrueTypes for the PCs using Type1 filenames. They’ve done it the other way round and supplied us with Type1s created to match the TrueTypes, apparently saying to our IT folk that ‘the TrueTypes are superior anyway’. </p>
    <p>The PDF bugs have gone away, because we are using PostScript fonts again, but the fonts still appear as individual faces in application font menus. </p>
    <p>So the quick question at the end of the long story is… Is there a way to have the MAC Type1 fonts talk to the PC TrueTypes across the network, but also for them to work appropriately for us within the studio?</p>
    <p>PS: Another thing that might be relevant – we’re not using Suitcase or a similar app to manage fonts, they are put straight into the System Library by IT. (My workplace is a government department, where bureaucracy is valued over practicality)</p>
