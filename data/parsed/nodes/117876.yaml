      <p>IMO the spacing is wrong for a condensed, low contrast face. Increased sidebearings on the curved characters and diagonals would help—or, same difference, reduce sidebearings on the verticals and track the whole thing out.</p>
      <p>Note in the enlargement how o_d creates a heavy area, and how y_o is tighter than o_u. And see how in l_u_d the space between characters is uneven, although the curved stroke of /d is close to vertical.</p>
      <p>It would have been better to have adopted the spacing paradigm of a condensed sans, rather than use that of a typical serif face.</p>
      <p>The italic is also off-center, to the right.</p>
      <p>The hyphenation at right might beneﬁt from hanging, which can be done via InDesign’s “Optical Margin Alignment” (Type and Tables &gt; Story).</p>
