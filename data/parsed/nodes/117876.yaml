      <p>The overall effect of the spacing is not good. The first thing I would try would be to take the type size down a half a point. This in effect increases the leading, but it's not quite the same thing. Example: I recently tried spacing (kerning plus side bearing work) a font, and with a 10-point setting, it just didn't work very well. I could get it better, but not joyful. But set at 9.5 point (and with several leadings), everything began to click. </p>
      <p>Our one-size-masters tend to work that way, esp. for continuous text setting. There will be a range of sizes, ceteris paribus, that work well. Things will quickly fall apart as you stray too far from these. You can save them to a degree by changing the word spacing, or leading, or measure (margin) but it's only to a degree. The internal space of letters, which is not modifiable in layout design or typesetting, has an affect too, along with word spacing, leading, and margins. All space interacts. </p>
      <p>You have to learn to live with what a particular typeface offers and use it to its best advantage, not some theoretical ideal. That's part of what is called "interior" or "text" design, and it is by no means as easy as many think. It takes an eye.</p>
