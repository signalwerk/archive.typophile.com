    html: <p>Equally unable to put my finger on the source of the discomfort, I just wanted to say that the typeface (Memento) feels hard to read to me as well. One thing I spontaneously dislike is the tight spacing. The spacing generally isn’t great (some random examples <a href="http://myfonts.us/td-7Vp7gO" rel="nofollow">here</a>; apparently nobody thought about the possibility of two consecutive forward slashes when the fonts were created, but words starting with ‘Py’ already existed in the 90s). One more downside, in my eyes, is that the regular cut looks quite light, even flimsy (but I’m admittedly partial to ‘darker’ typefaces). Contrary to what somebody else said, I actually see a fair bit of contrast in the letters. These two factors—light and some contrast—might contribute to the bad screen rendering on some devices. When I printed out a page, things got a little better, but that doesn’t really help when most people probably read the PDF.</p>
