      <p>There's no specific defect in this sample. There are no hyphen strings. There's a river, but it's not egregious. There are a couple of loose lines, but overall the word spacing isn't excessive. It would look better with another point or two of leading, but journals don't usually have that luxury.<br>
      The text face itself may be what you're reacting to. It has a large x-height, shortish ascenders and descenders, and small, blunt serifs. It also has low contrast between thick and thin strokes. To my eye, these factors combine to make the letters all look the same, and thus impede reading. If I were designing this journal, I'd use a more traditional text font with more thick-thin contrast and slightly smaller x-height.</p>
