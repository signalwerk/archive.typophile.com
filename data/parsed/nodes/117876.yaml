      <blockquote><p>Many people think Optical Spacing should never be used; I'm of the opinion that in cases where a font is very poorly spaced (but otherwise desirable) it can be helpful.</p></blockquote>
      <p>That's kind of strange. I initially learned that Optical Spacing should always be used, but my own research has lead me to believe that for body text it's best to use Metric spacing if you're using a professional typeface. If the spacing isn't great Optical Spacing should be used and you may want to add a bit of tracking to compensate.<br>
      For titles using Optical Spacing may be more logical. I tend to use it by default for headings.</p>
      <p>Recently my typography teacher told our class to always use Optical Spacing. I think this is a myth going around in the design community, at least at the art academy I'm at. I told her what I came to understand and I think she has updated her information accordingly. It's kind of pleasant to hear apparently many people think Optical Spacing should never be used. To me it emphasizes the notion that there is middle ground and one should decide whether to use it or not for each individual project, rather than completely avoiding it or always using it by default.</p>
      <p>By the way, I think I find the text from the sample hard to read because it's such a condensed typeface with such a tall x-height, combined with the tight spacing and the lack of any advanced typographic functions. I think the text would be much more pleasant to read if the tracking is set to 10, Story is activated and the settings for Justification and Hyphenation are set accordingly. Even with a typeface which clearly isn't optimal for reading, there's quite a bit you can do in InDesign to make it much more pleasant to read.</p>
