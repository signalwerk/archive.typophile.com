      <p>Actually InDesign's "optical spacing" is not like a width axis at all. Besides the fact that it does not provide a continuous harmonization between internal and external whites, it actually essentially replaces a type designer's spacing determinations with its own, using a clever, but of course not truly intelligent, algorithmic. Many people think Optical Spacing should never be used; I'm of the opinion that in cases where a font is very poorly spaced (but otherwise desirable) it can be helpful.</p>
      <p>Turds: although no font is good enough to be optimal in any situation, I think there most certainly are fonts that are not optimal in any situation.</p>
      <p>hhp</p>
