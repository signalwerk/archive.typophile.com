      <p>When you consider that this is probably a modification of an existing –probably decent– font (look at the contrast in quality between the easier letterforms versus that horrid "g") I think what's happening is that Luin made the serifs much heavier but left the round overshoot the same, which means they became inadequate, causing apparent misalignment. The spacing being so uneven might even point to the original having been a sans, but I'd have to look closer.</p>
      <p>If we want them to change the font, we'll have to suggest something similar in character but crafted much better. Maybe one of these sisters:<br>
      <a href="http://www.myfonts.com/fonts/adobe/meridien/" title="http://www.myfonts.com/fonts/adobe/meridien/">http://www.myfonts.com/fonts/adobe/meridien/</a><br>
      <a href="http://www.myfonts.com/fonts/linotype/frutiger-serif/" title="http://www.myfonts.com/fonts/linotype/frutiger-serif/">http://www.myfonts.com/fonts/linotype/frutiger-serif/</a></p>
      <blockquote><p>The internal space of letters, which is not modifiable in layout design or typesetting</p></blockquote>
      <p>Hmmm, now I'm wondering whether InDesign's "optical spacing" can be useful here.</p>
      <blockquote><p>You have to learn to live with what a particular typeface offers and use it to its best advantage</p></blockquote>
      <p>Unless you can simply jettison the sorry turd into outer space.</p>
      <p>hhp</p>
