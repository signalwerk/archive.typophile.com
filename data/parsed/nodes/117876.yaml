      <p>Within certain limits, InDesign's optical spacing -- if I understand you aright -- is, in effect, like a multiple masters font with a width axis (for condensing/expanding). You can do things with such tools, but maybe different things than one might expect. When Minion Multiple Masters first came out, Richard Eckersley (a book designer) and I played around a fair bit with that axis. Richard was fond of shorter measures -- his favorite trim was a 5.5 x 9 (just trim off the extra half inch), or even a 5 x 9. To get that to look good, a shorter measure was called for. </p>
      <p>But given academic prose (look at what's written in the sample we're all complaining about) there is a tension between the measure and number of word spaces. To justify a line, you vary the word spacing or hyphenate. The more word spaces there are on a line, the less each has to absorb the needed variance. (Yes, modern layout engines can automatically apply glyph scaling and tracking, but if you think that doesn't show beyond small amounts, we have very different eyes). It isn't the big words that kill you, it is the absence of short ones, with the spaces they bring.</p>
      <p>Anyway, using Minion MM, we played around a lot with that width axis, and you know, the type held up quite well. I think the space contained within a letter, even one open on the bottom like h, m, n, is not just a total amount of white, but is also in some ways set up by the curves of the letterforms. When they're working well, condensing a font doesn't hurt. When those relationships are bad, or "fussy," not much helps -- you've got a one-size turd at best. (Which, I think, is why my biggest complaint about a number of interior designers is they spend too much time being tempted by letterforms, and not enough paying attention to how those letterforms interact.)</p>
      <p>Nor do I buy Publishing Mojo's analysis, at least, not in toto. You can make Matthew Carter's Charter a wonderful text face, yet </p>
      <blockquote><p>It has a large x-height, shortish ascenders and descenders, and small, blunt serifs. It also has low contrast between thick and thin strokes.</p></blockquote>
      <p>But I do agree we'd all live longer if a lot of turds were thrown out. Or not really "turds," say rather, fonts that work best with uses other than setting extended text.</p>
