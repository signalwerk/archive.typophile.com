  - id: 404504
    user: 2021
    date: 2010-04-01T18:23:00
    date_raw: 1.Apr.2010 6.23pm
    votes: null
    html: |-
      <p><em>...we actually have a chance to use ligatures and alternate characters, and you want to discourage designers to impliment that possibility...</em></p>
      <p>No I don't. Ligatures and alternates ARE contextual. For instance, one would not set "d with flourish" when followed by "l".<br>
      So I approve of your alternates and ligatures!</p>
      <p>Nonetheless, I still think you could use alternate glyphs to give an impression of the subtle variations in serif form that occur with hand lettering, rather than just for alternate letter-shapes.</p>
      <p>Actually, you needn't even do that: just don't rely so much on cutting-and pasting, but take a little more time to hand-craft each glyph individually. The overall effect will look more human, less plastic.</p>
      <p><em>Tournedot is a font, not lettering. </em></p>
      <p>Then why does it look like brush lettering? The swelling of the vertical stems towards the baseline, the "brushy" serifs that begin and end strokes, the non-geometric, organic curves, the softened corners, the casual jauntiness of "g" and "y", the large counter in "e"--typical of mid-20th century brush lettering, &amp;c, &amp;c.</p>
      <p><em>It is not following traditional type design dogma,</em></p>
      <p>Yes it is.<br>
      It has the traditional regimentation that has generally occurred when a hand-lettering style is turned into a font.<br>
      For instance, all the letters stand precisely on the baseline in a way that hand lettering never could achieve.</p>
      <p>If you are going to design a typeface which is so strongly informed by hand-lettering, why not use available technology to do a better simulation than was possible in the past?</p>
      <p>Alternatively, if you want to make it more "font-like", impose a greater degree of regularity and stylization; refine it more. For instance, make the "entry" serif on "i" and "n" the same.</p>
      <p>At the moment, the idea is not fully realized: it is caught between being a simulation of hand lettering and being a fully refined and rigorously stylized typeface.</p>
