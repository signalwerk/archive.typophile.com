      <p>Tomi,</p>
      <p>The design is nice, but i also agree with Nick. The font is really caught between types. I see it as a heavily formalized script font. But, even that description does not seem right either, since it doesn't flow like a script font should.  </p>
      <p>I would call it, as riccardO suggested, a ballpoint font, more than anything else.</p>
      <p>The forms do look nice, and the alternatives are a neat thought. </p>
      <p>I do understand what Nick is saying though. You've headed in two, possibly three, directions. I think you need to choose just one direction.</p>
