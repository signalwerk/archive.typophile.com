    html: |-
      <p>Thanks, guys-</p>
      <p>Over the years I've developed a routine that helps me to design a basic characters set wit some speed, which allows me then to go back, and review the result without any real loss of production time.</p>
      <p>Some five years ago I started wondering if this method was the best one, and experienced with other ways of font design, like hand drawing and scanning; drawing in Illustrator, and copying and pasting into FontLab; and mixing the order of designing glyphs. In the end I kept to my old method.</p>
      <p>I've also made a conscious effort to use more time to make a font, and after three or four weeks of tinkering I compared the first version to the version I used more time on, and saw no real improvement, so once again I kept to my old method.</p>
      <p>For me one week is about average from idea to a finished font. After that it slows down; italics and different weights take a lot more time, and finishing a complete font family takes months easily.</p>
