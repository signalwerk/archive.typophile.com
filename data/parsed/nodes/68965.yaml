    html: |-
      <p>Nick; you gave me a courtesy by giving me your critique by e-mail, rather than here on the forum, and that was very decent thing to do. I hope you don't mind my quoting you here.</p>
      <p>From your point of view Tournedot "looks like hand writing, but the repeated details are too consistent for that. Therefore the effect is false. Contextualization in OpenType is a new idea that addresses this issue. So far it has been used almost exclusively for script faces."</p>
      <p>After some mulling over, I have to disagree. After waiting some twenty years since PostScript, we actually have a chance to use ligatures and alternate characters, and you want to discourage designers to impliment that possibility. Tournedot is a font, not lettering. It is not following traditional type design dogma, but rather looking for the boundaries of it (sorry; that sounded suprisingly pompous).</p>
      <p>I understand that this new technology can cause the same confusion that happened with lithography in 1900'th century, when suddenly any form was possible for printing. We saw the same thing with PostScript in the 90's, and with OT, we'll see more.</p>
      <p>Each new technology needs to find its limits, before it can find its best qualities. This applies to OpenType as well.</p>
    html_clean: |-
