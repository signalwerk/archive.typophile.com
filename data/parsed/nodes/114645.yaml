  html: |-
    <p>I’m happy to release Cayenne, an all caps hand-lettered font in three weights, two dotted versions and an outline and an inline font.</p>
    <p>You can get the font family at <a class="freelinking external" href="http://www.myfonts.com/fonts/luxus/cayenne/" rel="nofollow">MyFonts</a> for a special introduction price of $29.</p>
    <p>Hope you like it!</p>
