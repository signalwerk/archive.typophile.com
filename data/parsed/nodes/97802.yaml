    html: |-
      <p>FontLab let you export the font as TT or OT (or even other formats). Your .fvb file is not attained to any of these output ways. Even if all your work was done with cubic Bézier curves, you can still export it directly as TrueType, which uses quadratic ones (and it is also possible to convert the contour to quadratic or cubic curves anytime).</p>
      <p>Regarding hints, you can define them (1) manually; (2) using a FontLab auto feature; or (3) using a free command-line program provided by Adobe after exporting the font. This may be done at any moment, but I prefer to define them as soon as I design a glyph.</p>
      <p>If you decide to manually add hints, there is a nice trick: use links instead of hints. Links are very similar to hints, but aimed to TT output. The advantage to use links in a production scenario is that it follows contour changes (I mean, if you decide to make a stem thicker, the link will follow it). In a later moment, you can convert all links to hints, although this is not necessary as FontLab will take care of this when generating the font. Keyboard shortcuts to add links are [ and ].</p>
      <p>Be careful about the result you get in Illustrator. To judge if a font will render and print well, you may test it in text editors and do small-size printings (from 6pt and above). A non-hinted font may present decent result in Illustrator, Photoshop or InDesign due to the typographic controls these applications offer, but then produce an ugly result in something like Word.</p>
      <p>Besides this, you may consider to develop your whole font inside FontLab. To design in Illustrator and then bring the contour to FL is perfectly possible, but this soon become far from ideal when your font grows up. About three years ago I was in your position when designing fonts for the first time. As I knew Illustration well, it was easier to me to design the contours with it. But experienced typophilers suggested to invest some time in FontLab and do all design with it. This proved to be a splendid advice as after two months I was producing much quicker in FontLab than using the Illustrator-to-FL workflow.</p>
