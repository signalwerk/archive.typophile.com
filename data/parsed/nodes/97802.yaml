    html: |-
      <blockquote><p>I have made about 100 glyphs. If my font had more glyphs then i could create an OpenType?</p></blockquote>
      <p>With so few glyphs, as Alex said you probably do not need to worry about OpenType features but outputting in one of the OpenType formats would probably be the best approach. If you would like to output Postscript (cubic bezier) outlines then you should generate an OpenType PS font. If you would like to output TrueType (quadratic bezier) outlines then you should generate a Windows TrueType/OpenType TT font. It is most likely that you will be working with Postscript (cubic beziers) by default when importing from Illustrator.</p>
      <p>In terms of the number glyphs/characters you would only need to worry if you were creating an older Postscript Type 1 font, which has a restriction on the number of characters, limited to 256 depending on the encoding.</p>
      <p>You would probably find <a class="freelinking external" href="http://www.lesliecabarga.com/collections/books/products/learn-fontlab-fast" rel="nofollow">Leslie Cabaga's book, <em>Learn FontLab Fast</em></a> very helpful.</p>
