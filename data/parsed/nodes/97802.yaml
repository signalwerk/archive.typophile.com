      <blockquote><p>My question is what's going on with the hints?</p></blockquote>
      <p>You'll have to be more specific than that.  What's wrong with them at the moment?</p>
      <blockquote><p>I have to do something particular in fontlab?</p></blockquote>
      <p>Well, yes.  You can tell it to generate automatic hints, I believe.  (I don't have FS but it must be in the program settings.)</p>
      <blockquote><p>Also what font should i make truetype or opentype?</p></blockquote>
      <p>If you have to ask that, then it's highly likely that you don't need the special features provided by OpenType.  TrueType is still more widely supported so that's probably your best bet.</p>
