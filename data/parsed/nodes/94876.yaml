    <p>I need help identifying the font on a military building, constructed in early 1940s. The sign on the building was probably installed in 1941.<br>
    The first image is a historic photo of the building sign. The second photo shows the current state where the letters have been stripped from the wall. We plan on replacing the sign.</p>
    <p>Thanks!</p><div class="imageWrap"><img src="http://typophile.com/files/MA_historic sign_4778.JPG"></div><div class="imageWrap"><img src="http://typophile.com/files/Paint stripping_4673.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/overall_3559.jpg"></div><p></p>
