  html: <p>I'm looking for a font similar to InterFace. <br>I was going to use it to set text in a magazine, then my boss said that the @ was hardly legible (I can agrrrree, but I like that @ a lot), and I was forced to choose another font. <br>Now I'm oriented to adopt Bliss from Jeremy Tankard. <br>I also thougth to use Formata or Syntax, but I feel like I need something more "fresh". <br>Hope you can help me. <br>Momo</p>
