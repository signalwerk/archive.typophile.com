    html: <p>Maybe Interface is a bit bland/corporate for a magazine. You're right, fresh is good. <br> <br>Do you have IndieFonts specimen book? (ShinnType should have been in it, but the timing was wrong for me.) Anyway, have a look through, you will find many fresh sanses, shown in text setting! <br> <br>eg Reform, Jigsaw, Hydrous, Faceplate, Default, (yeah, Psyops, straight ahead), Modus, District, Malmo, etc.</p>
