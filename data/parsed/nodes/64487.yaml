  html: |-
    <p>Hello Typophilers,</p>
    <p>I want to start exploring the experts opinion on the licensing of Outline fonts for PDF embedding.</p>
    <p>A lot of our customer base use powerful document composition software that can generate thousands upon thousands of either printed documents or documents for viewing, example PDF.  Customer's like Utility companies can use the Outline fonts to create financial documents like Bills, Statements etc and deliver them electronically to the customer via email or PURL rather than mailing in the post.</p>
    <p>Now, as we understand it, the fonts are only loaded on up to 5 workstations, and then all of the document development and conversion, merging with variable data and conversion to to PDF is done on those.   We also understand that most font foundries allow print and preview embedding with their fonts.</p>
    <p>What we would like to do is explore the possibility of selling commercial PDF embedding licenses to these companies, so that the income generated by the sale better reflects their intensive usage of the fonts, rather than just selling a standard 5 user license.  We also think there is mileage in charging this on an annual basis.</p>
    <p>We have already approached one of the major foundries, who have said they will get back to us, but knowing them they would want to take complete control of matters.</p>
    <p>Look forward to hearing what the experts think.</p>
    <p>Kind regards<br>
    Neil</p>
