    html: |-
      <p>I'm in commercial printing - why would I want to do this?  Pay per use fonts? - no thanks. With already licensed fonts that we already own, we make hundreds of thousands of variable PDF's daily. Using software like PrintShop Mail for the Digimasters and HP's Yours Truly/SmartStream for Indigo presses. </p>
      <p>The font usage if often determined by the designer/artist, so these ppu fonts would have to get in the hands of the designer and the cost would have to be passed to the customer. I just can't see a customer paying for that when print buying. Just my 2 cents from my point of reference.</p>
