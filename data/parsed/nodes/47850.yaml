      <p>Oka. Finally I get it running on PC.</p>
      <p>Posting this just in case someone else find it useful:<br>
      - I ended up with 2 version of Python installed: 2.4 and 2.6<br>
      - FontLab, for some reason, is using Python2.4<br>
      - The latest version of Numpy1.5.1 uses Pyhton2.6, FontLab ignores it.<br>
      - To install Numpy for Python2.4, I used and old Numpy1.2.1 release.</p>
