    votes: null
    html: |-
      <p>Make sure you'll do the following:<br>
      - Download the latest version from robofab.org (Robofab + FontTools + DialogKit)<br>
      - After unzipping, place the RoboFab folder somewhere on your harddrive. I've put mine in my applications folder<br>
      - Run install_zip.py<br>
      - Copy *only* the folder named 'Scripts' to your FontLab macro folder</p>
      <p>If you move the folder with the Robofab data to another location you need to run the install script again.</p>
      <p>Hope this helps.</p>
      <p>-Paul</p>
      <p><a href="http://www.type-invaders.com" title="www.type-invaders.com">www.type-invaders.com</a></p>
