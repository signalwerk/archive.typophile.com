    html: <p>In the meantime here are four shots I took of the stone engravings strewn around <br>the Rotunda (the circular church/mosque/etc. just above the Galerius Arch). <br> <br> <br><img src="http://www.typophile.com/forums/messages/30/40937.jpg" alt="rotun_1"> <br>Byzantine Greek? <br> <br> <br><img src="http://www.typophile.com/forums/messages/30/40938.jpg" alt="rotun_2"> <br>Check out the flipped "S"es, including the one that goes over the margin! <br> <br> <br><img src="http://www.typophile.com/forums/messages/30/40939.jpg" alt="rotun_3"> <br>My favorite. <br> <br> <br><img src="http://www.typophile.com/forums/messages/30/40940.jpg" alt="rotun_4"> <br>The left is a prayer, and the top-right says "rashaad" (maybe the engraver's name). <br>The year says 1327. If that's a Hajeera date, it's only ~1909, which seems too young. <br> <br> <br>hhp <br></p>
