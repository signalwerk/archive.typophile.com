    date: null
    date_raw: null
    votes: null
    html: <p>I took some "air shots" with a disposable b&amp;w camera <br>at Omonia* that night - I'll get it developed soon... <br> <br>* Actually Kotzia square, right off of Omonia - that's where the main public bigsceen was. <br> <br>We actually started heading back to the hotel moments after the end of the match (having had a preview of sorts during the semi in Thessaloniki...), and we saw the entire city converging en masse on the very spot we were trying to leave. It boggles the mind to imagine what that place must have been like probably until dawn! Which is about when we took the taxi to the airport... <br> <br>Unforgettable stuff. <br> <br>hhp <br></p>
