    html: <p>John did a great job moderating that panel discussion, and I learned some important things, from Kevin especially*. The conference was killer, and I made some nice new acquaintances too. Don't miss it next time! <br> <br>* BTW, check out his essay in the current Eye. Now I really have to write up a formal rebuttal.  :-&gt; <br> <br>BTW, I was also lucky to be in Omonia square on the night of the Euro2004 final! Man, what an experience that was. Although it took two hours to get back to the hotel!  :-) <br> <br>hhp <br></p>
