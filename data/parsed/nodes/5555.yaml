    html: <p>Now that it's out there I'll have to check with Kevin to see if we can publish the full article at microsoft.com/typography <br> <br>Being in Greece for the football certainly added to the fun - the France win and the celebrations in Thessa were the highlight...  <br> <br><img src="http://www.typophile.com/forums/messages/30/40927.jpg" alt=""> <br> <br> ...but being on Santorini for the semi and for the final was special too - distress flares and kids running around wearing flags. Great stuff. <br> <br>Si <br></p>
