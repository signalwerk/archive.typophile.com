    html: <p>I sometimes work with Multiple Masters (I'm very sad that they are discontinued) on a PC and in InDesign. <br>As I use customized weight/width axes and optical axes (!) I need the possibility to set them. <br> <br>Am I right, that there is no way to do this without ATM deluxe? <br> <br>At the moment I have ATM deluxe and Suitcase on my system. I have to carefully look nothing gets wrong. <br>ATM light doesn't provide any setting MM-Instances. <br>Also InDesign doesn't allow setting except of using the optical axe in an automatic way. <br>Is there any plugin that allows setting of MM-Values in InDesign like in Illustrator? <br>Or is there a special version of ATM light that does allow to set MM-instances? <br> <br>Michael</p>
