  html: <p>I have these stupid Adobe Multiple Master fonts on my work computer installed left over from some Font Folio package.   <br> <br>I'm on a PC and we run Suitcase; and Suitcase will not recognize or run MM fonts.  You just get a "font activation error".   <br> <br>We're told the ATM version in the Font Folio package won't run on XP, so I can't run that either.  Plus you wouldn't run ATM and Suitcase anyway.  You'd pick one or the other, and my company runs Suitcase. <br> <br>We also don't have TransType ($100 SE/$170 Pro seems absolutely ridiculous for this software anyway) which *might* make the conversion--if we had it. <br> <br>So...is there some other way that anyone knows of to allow these to run?   <br> <br>Any help would be appreciated. <br> <br>Thanks!</p>
