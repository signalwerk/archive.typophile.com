    html: <p>Although Windows XP has native support for regular Type 1 fonts, you need ATM to enable MM support. There's ATM Deluxe, and ATM Light. You can install the latest ATM Light 4.1.2 (no charge download from Adobe.com), and that will do the trick, and still be compatible with Suitcase. <br> <br>T</p>
