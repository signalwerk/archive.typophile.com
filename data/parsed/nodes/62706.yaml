    html: |-
      <p>Thank you Ben, for your feedback.</p>
      <p>I have adressed the widths and altered the spine of the S, added some bulk to the tail of the J and made some changes to the weights of some diagonal strokes.</p>
      <p><a class="freelinking external" href="http://typophile.com/files/untitledroman2.pdf" rel="nofollow">new pdf</a></p>
      <p>Just to add; the feeling I'm going for is more classic than contemporary.</p>
