    html: |-
      <p>Dan, and all,</p>
      <p>Thanks very much for the advice and research. The project is a catalog and programmatic graphics for the early modernist artist Henry Fitch Taylor (1853-1925). I believe the curator is looking for something with a Vienna Secessionist feel. However, these faces tend to be decorative and unsuitable as text. I like Kabel, but it is too late (historically). I originally did comps in the Neutraface family, which I like and may be able to sell. But it is, after all, a contemporary family. Though I'd prefer sanserif, Belwe is indeed nice.</p>
      <p>I am considering Venus, Brittanic and Clearface, but I think they lack italics. Getting close, or, one hopes, just going with Neutraface.</p>
      <p>I wish I could get a copy of the "Schriften Atlas" for reference.</p>
      <p>Thanks again.</p>
    html_clean: |-
