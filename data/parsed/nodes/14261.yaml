  html: <p>I am looking for an elegant text font that was designed (and used) mid-20th century (c. 1910-1915). Sanserif is preferable. It would be nice if the font is a complete family (bold, book, italics, etc.) and in TrueType-- again, desireable, but not essential. Thanks very much.</p>
