    html: |-
      <p>I really get excited by pre-WWI types (late 1920s and 30s work is just too clean for me. I love Metro, Tiff, but its too good of a typeface to represent pre-war decadence, in my opinion. Or at least pre-first-world war decadence…).</p>
      <p>Here is a bunch of stuff I've found over the past hour. None of them probably fit perfectly. But hey. Type c.1912 was a bit odd.</p>
      <p>First is <a href="http://www.myfonts.com/fonts/astype/sveva-as-versal/" rel="nofollow">Sveva</a> by Andreas Seidel, who rocks. Just OpenType, just caps, just serifs, but also just too good to miss out on, in my opinion.</p>
      <p><a href="http://www.myfonts.com/fonts/solotype/marshall/" rel="nofollow">Marshall</a></p>
      <p>This is a good one: <a href="http://www.myfonts.com/fonts/typodermic/fenwick/" rel="nofollow">Fenwick</a></p>
      <p>Offenbach, Represent! Don't miss the <a href="/wiki/Ruhard%27sche%20Giesserei" class="freelinking" rel="nofollow">Ruhard'sche Giesserei</a>'s <a href="http://www.linotype.com/9641/eckmann-font.html" rel="nofollow">Eckmann</a> (Linotype has it in PC, but not Mac, TrueType)</p>
      <p>Likewise in PC TT (as well as Mac PS and PC PS, of course) is this neat little sans serif family, <a href="http://www.linotype.com/43516/britannic-family.html" rel="nofollow">Britannic</a></p>
      <p>Morris Fuller Benton's Clearface cannot be ignored. <a href="http://www.linotype.com/616/itcclearface-family.html" rel="nofollow">ITC Clearface</a> is the serif version, <a href="http://www.linotype.com/264/clearfacegothic-family.html" rel="nofollow">Clearface Gothic</a> the sans (Clearface Gothic, aside from PostScripts, and PC TT, is also available from Linotype in OpenType format!).</p>
      <p>How about <a href="http://www.myfonts.com/fonts/solotype/cognac/" rel="nofollow">Cognac</a>?</p>
      <p><a href="http://www.linotype.com/267/cochin-family.html" rel="nofollow">Cochin</a>, 1914. So French. <a href="http://www.linotype.com/90038/nicolascochin-family.html" rel="nofollow">Nicolas Cochin</a>, smaller x-height, more period acurate, I think, listed as coming from 1912 even though it is virtually the same as the above-named 1914 fonts… hmm.</p>
      <p><a href="http://www.myfonts.com/fonts/paratype/academy/" rel="nofollow">Academy</a>, from <a href="/wiki/Paratype" class="freelinking" rel="nofollow">Paratype</a>.</p>
      <p>Whatever you end up using, please tell us! What is the project, anyway?<br>
      __<br>
      <a href="http://www.typeoff.de" title="www.typeoff.de">www.typeoff.de</a></p>
