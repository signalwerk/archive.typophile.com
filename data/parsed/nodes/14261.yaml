      <p>What about <a href="http://www.linotype.com/1582/venus-family.html" rel="nofollow">Venus</a>? This is only available from Linotype in PostScript format, but we do have both Mac and PC PS.</p>
      <p>There is also Cheltenham (a Serif), News Gothic, Franklin Gothic, and Scotch (another Serif). These are probably all available in several versions from several foundries, most likely as complete families, and in TrueType format.</p>
      <p>Do check out this <a href="http://typophile.com/node/14173" rel="nofollow">other thread</a> on Souvenir, which is based on several elements from your period in question. Although at first glance, it might not be the right fit, I think that it could work out quite interestingly.</p>
      <p>__<br>
