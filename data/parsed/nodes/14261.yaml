      <p>Speaking of Kabel (which I wouldn't use here), I think that Erbar, even though it is also way out of the date range, might fit.</p>
      <p>I think that, like Lightline/News/Franklin Gothic, Erbar is a nice synthesis of what came before it. I see Kabel as a brilliant new invention, personally.</p>
      <p><a href="/wiki/Rudolf%20Koch" class="freelinking" rel="nofollow">Rudolf Koch</a> only got in one real typeface before WWI, the Deutsche Schrift. But I think that Neuland fits Art Nouveau decadence nicely, even though it was cut during the 1920s.<br>
