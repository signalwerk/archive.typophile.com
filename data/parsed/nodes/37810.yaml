    <p>I’ve been asked to create a <a href="/wiki/Tibetan" class="wiki">Tibetan</a> language font.</p>
    <p>Does anyone out there have any experience with creating fonts for this language? What would the best encoding be for this format? I know that many of the characters must be able to stack on top of each other in order to make sounds, would it be best to make all of these combined characters into ligatures and create an extensive liga set in opentype? This project is just beginning and I think I’ll have a lot of time to both draw characters as well as figure out the technicalities. I’ll probably have a million more questions as I start to get into this, so any help is appreciated.</p>
    <p>OK<br>
    RC</p>
