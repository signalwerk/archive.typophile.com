    html: |-
      <p>Do they use the same font for any other lettering? I might have a better chance with a couple more letters that are helpful for ID purposes. The ’a’ is the only sort of distinctive letter in this logo. If you do have more letters, you could try the new version of the <a class="freelinking-external" href="http://www.bowfinprintworks.com/SansGuide/sanssearch.php">Sans Guide</a> that lets you pick the shapes of key letters, and then it shows which fonts have those shapes. Having the ’a’ wasn’t enough for me to spot this one, although I tried.</p>
      <p>- Mike Yanega</p>
