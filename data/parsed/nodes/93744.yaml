    html: |-
      <p>It's a custom logo. The script portion was designed in 1957, with the swash "C", and has undergone numerous tweaking. Prior to that "Cardinals" was spelled out in non-connecting letters.</p>
      <p>You might find something similar enough for you at Mike Yanega's Script font ID guide:</p>
      <p>    <a href="http://bowfinprintworks.com/ScriptIDGuide.html">http://bowfinprintworks.com/ScriptIDGuide.html</a></p>
      <p>Don't think there's anything close enough here, but take a look:</p>
      <p>    <a href="http://www.fontshop.com/fontlist/genres/sports_script/">http://www.fontshop.com/fontlist/genres/sports_script/</a></p>
      <p> - Herb</p>
