      <p>Buffalo, NY August 1st, 2005</p>
    <p>P22 and the International House of Fonts introduce two new fonts, Larkin<br>
    and Numismatic. </p>
    <p>Larkin<br>
    ———<br>
    The Larkin font is based on the logotypes of the Buffalo, NY-based Larkin<br>
    Company that originated in the late 1800s as a soap company and grew into a<br>
    gigantic mail-order, chain store.  This lettering style is an unusual<br>
    combination of Germanic Blackletter and Romanized capitals with an Italic<br>
    slant. It is evocative  of “old world” craftsmanship and early 20th century<br>
    romanticism. </p>
    <p><a href="https://web.archive.org/web/20080829183604/http://www.p22.com/ihof/larkin.html" title="http://www.p22.com/ihof/larkin.html">http://www.p22.com/ihof/larkin.html</a></p>
    <p>Numismatic<br>
    —————<br>
    Numismatic was a font offered by the Devinne Press in 1905. It was based on<br>
    letters, Arabic figures and ornaments used by designers and engravers of<br>
    seals, coins, medals and inscriptions upon metal or stone during the<br>
    fifteenth and sixteenth centuries.<br>
