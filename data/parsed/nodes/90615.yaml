    html: <p>I think what you are missing is a vision of what you want the logo to do for you.  Why have a logo anyway?  What will it add to what you are already doing (and what is that anyway, I can't even guess with what you've posted)?  Once you have a clear idea of what the logo will accomplish, then you can define how it will accomplish that and start making choices about how to design it.  This is actually one of the more important parts of a designers job, to create a brief, a document that outlines what the goals of the project are, what needs it will fulfill and what messages it is communicating.</p>
