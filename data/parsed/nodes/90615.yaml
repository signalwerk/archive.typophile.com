      <p>Thank you Penn. Excellent advice, very good points. I know the companies image is strong. That's what I'm going to do, I'll chose a type face that I feel is consistent with my brand and put it at the top of the site.</p>
      <p>I've discovered threw years of practice the most detrimental thing I can do is let myself get bogged down by irrelevant details, especially when it comes to my business. My business has excellent customer service, and the image around the company is actually fairly established simply because I learned early on if I'm going to run a respectable business I need to keep my OCD tendencies in check, the only time my obsession serves me well is during clothing design time. </p>
      <p>Now as I'm taking my company online I'm forgetting my golden rule. Maybe it's cause I've recently found a LOVE for type and web design. Anyway thanks again for reminding me of good methods. If you'd like to check on the progression of my page, logo, etc, your more then welcome to at <a href="http://www.goodwinterclothing.com" title="www.goodwinterclothing.com">www.goodwinterclothing.com</a>. Right now the sites under construction, my projected launch date is beginning to mid april. </p>
      <p>K, now that I got my little rant out of the way I have another question. How much does it cost to higher a graphic designer to design a company logo? I know, I know, this question is ridiculously vayge (no idea how to spell that word, auto correct isn't even trying, VAY-GUH), but any sort of ball park for a professional with credentials would be appreciated.</p>
  - id: 497567
    user: 58010
    date: 2012-03-03T20:43:00
    date_raw: 3 Mar 2012 — 8:43pm
    votes: null
    html: |-
      <p>&gt; any sort of ball park for a professional with<br>
      &gt; credentials would be appreciated.</p>
      <p>It can vary tremendously, anywhere from a few hundred (probably a student) to several thousand (an experienced pro) to tens of thousands (a large design studio). The bad economy has impacted the businesses of many designers, though, and that might work in your favor.</p>
      <p>Keep in mind that the services you receive can vary tremendously. Someone with a low price may spend an hour coming up with a few top-of-the-head ideas, and then email you final art as a JPEG, and that's it.  </p>
      <p>A more expensive designer may meet personally with you (if they are local) several times, spend lots of time coming up with concepts and refining them based on your feedback, design your letterhead and business card and get printing estimates and review the printer's proofs, maybe help design your website, and in general do a much more thorough and professional job.</p>
      <p>If you're on a tight budget, hrant's idea of barter or a student might be a good idea.</p>
