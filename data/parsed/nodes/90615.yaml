    html: |-
      <p>I think you need to simplify your intentions for this logo. Don't think of it as something that will instantly give your business an image and a voice. You do that yourself with the way your brand talks and how you display and choose the clothes you sell. Especially since you aren't well versed in graphic design, I'd say you'll be better off creating a simple logotype that clearly communicates your brand name and hints at the style you're aiming for—even something as simple as typing out the whole name "good winter" in the same typeface that you have "good" set in up there. </p>
      <p>The best thing you can do for yourself is maintain consistency in everything you create. Keep things simple and in line with your vision. Once you can afford to hire a designer, you can work with them to create more of a complex voice and image for your brand—one that will probably have developed since your company has had time to grow and find its niche.</p>
      <p>Brand strategy aside, the mark you have isn't a bad start. The weight of the 'W' is too thick compared to 'GOOD' (or vice versa). I'm not sure, though, that abbreviating only the 'W' makes much sense. I would probably either use both the 'G' and 'W' to form some kind of monogram mark, with 'Good Winter' spelled out as a separate logotype, or simply only use the logotype.</p>
      <p>Hope that helps, and interested to see how things turn out.</p>
