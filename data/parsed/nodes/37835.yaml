    html: |-
      <p>Here's how I personally set up my Mac....</p>
      <p>/System/Library/Fonts/<br>
      I never touch these, they're core fonts for Mac OS X. Application developers generally expect these fonts to be present and active. The system will still function for some people if they remove some of these, but weird, hard-to-diagnose problems can result.</p>
      <p>/System Folder/Fonts/<br>
      This will only exist if  you have a PowerPC based Mac with a OS 9 System Folder. When OS 9 runs within OS X it is referred to as "Classic".  The minimal fonts for Classic are Charcoal, Chicago, Geneva and Monaco. I remove everything else. Intel Macs never have this, so people are quickly forgetting about it.  </p>
      <p>/Library/Fonts/<br>
      These fonts are technically optional. Personally, I remove most of them. Here are the fonts I leave behind: Times New Roman, Arial, Georgia, Verdana, Webdings. These fonts are commonly used on the web, and some applications seem to assume they will be present. If a website specifies Impact or Trebuchet, the browser will have to fall back to something else. The same thing will happen in other apps as well. </p>
      <p>/Users/*your username*/Library/Fonts/<br>
      This folder is empty by default. I keep it empty, although MS Office will install fonts here. </p>
      <p>On Helvetica: Mac OS X comes with a font called Helvetica, which resides in /System/Library/Fonts. If you need to use Helvetica, in my opinion the best thing to do on Mac OS X is to uses Helvetica LT Std from Linotype. It has an internal PS font name that is different from previous releases, so theres no chance that the system or any application will get the fonts confused.</p>
