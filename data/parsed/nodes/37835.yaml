    html: |-
      <p>From <a class="freelinking external" href="http://images.apple.com/pro/pdf/L311277A_FontTT_v4.pdf" rel="nofollow">Advanced Typography with Mac OS X Tiger</a>:</p>
      <p><em>Several system fonts are essential. Never remove them. Doing so will prevent the system from starting up and will likely require reinstallation of the operating system. They are:<br>
      • Geneva<br>
      • Helvetica*<br>
      • Lucida Grande<br>
      • Monaco</em></p>
      <p>* For optimal performance, leave the version of Helvetica that shipped with the system. However, you can replace it with another version if necessary. In doing so, some application layouts may be affected.</p>
