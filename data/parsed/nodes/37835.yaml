    html: |-
      <p>The best list (and only list I'd call 100% safe) is found on Apple's site: <a href="http://docs.info.apple.com/article.html?artnum=301332" rel="nofollow">Safe list to follow religiously.</a></p>
      <p> I use 2 font management software as I've found it is less problematic to control my system fonts through Font Book, while I manage all of my other fonts through Font Explorer Pro.</p>
      <p>First I turn FEX off so the changes I make will be reflected when I open it again. Then I open Font Book and make a new set adding the fonts which <em>can be</em> deactivated.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/canbedeactivated_5297.png"></div><p></p>
      <p>I then deactivate those fonts and re-open FEX where they have system folders by default. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/foldersbydefault_5621.png"></div><p></p>
      <p>But because I'm a control freak and want to see what I've done in Font Book reflected in FEX I create a new folder and two new sets adding the active system fonts to one and the deactive to the other. This also gives me numbers to compare if any new fonts get added next time I install software.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/mysets_6289.png"></div><p></p>
