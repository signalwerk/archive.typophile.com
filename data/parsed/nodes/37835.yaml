    html: |-
      <p>I'm not sure why some are having trouble with this above, but when you use Font Book and try to deactivate a font that the OS absolutely needs, Font Book simply gives you an alert that it is a system font and you're playing with fire if you mess with it. On that basis, you leave it alone and move on. This is what happens when you try to mess with Lucida Grande, for example.</p>
      <p>You can safely deactivate the Helvetica and Times .dfonts in Font Book, and enable alternate Postscript or OT versions, that's what I did. No sweat.</p>
      <p>Once all the system-installed .dfonts that CAN be deactivated have been, you have the "minimal" system configuration. For those .dfonts that have been deactivated, there's no reason to trash them--just leave them in the system/library/fonts directory "just-in-case." The few megabytes of storage they take up won't kill anybody in this age of monstrous hard drives.</p>
