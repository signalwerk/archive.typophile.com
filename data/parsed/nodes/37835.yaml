    votes: null
    html: |-
      <p>With CS 3, Adobe changed their font install procedure--and for the better in my opinion. They now install the design fonts into /Library/Fonts/ so they will be available to all apps. This is better than hiding them in Application Support. Secondly, it appears that the fonts that used to be in /Library/Application Support/Adobe/Fonts/Reqrd/, the "required" fonts, are now hidden inside the app bundle. So, they put the optional fonts in a standard, expected location and they hid the fonts you shouldn't mess with. This is good from a support/usability perspective. </p>
      <p>AFAIK, you can take the fonts out of /Library/Fonts/ and add them to your font manager if you wish. Some font managers will do this for you, but it's always nice to know where they come from and where they're going. They're wonderful fonts though, so some people like to keep some or all of them active at all times.</p>
