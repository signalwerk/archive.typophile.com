    html: <p>Interesting, because the face reminds one (or at least me) of the block lettering so commonly found on college sports uniforms (you could easily envision 'OHIO STATE' in this face). <br> <br>Seems fairly radical of GQ, who, it goes without saying, is a setter of ultra-fashionable trends in the world of men's clothing.  Not that the face is bad or anything.</p>
