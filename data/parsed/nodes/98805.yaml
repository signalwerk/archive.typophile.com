  html: <p>Anybody have a script to export all glyphs from Fontforge to .eps?</p>
  html_clean: <p>Anybody have a script to export all glyphs from Fontforge to .eps?</p>
comments:
  - id: 533730
    user: 18942
    date: 2012-12-11T04:18:00
    date_raw: 11 Dec 2012 — 4:18am
    votes: null
    html: |-
      <p>If you are on a Mac or on linux and if you want a fontforge script to execute from the command line, then save the lines</p>
      <pre>Open($1)
      SelectWorthOutputting()
      Export("eps")
      </pre><p>to some file, say <code>expglyphs.pe</code> and then the call</p>
      <pre>fontforge -lang=ff -script expglyphs.pe &lt;fontfile&gt;
      </pre><p>should give you one eps file for each glyph in the font.</p>
      <p>Else  you probably want a script to call from within FontForge using <code>File &gt; Execute Script &gt; FF</code>:  in that case, remove the first line from the script above. You could also select the glyphs to output using the user interface instead of a script; you then need only the line <code>Export("eps")</code> or simply type <code>Export("eps")</code> directly in the little window that appears when you select <code>File &gt; Execute Script &gt; FF</code>.</p>
      <p>Added: with the extension .pe, the script is properly listed when you click on ... in <code>Files &gt; Preferences &gt; Script Menu</code> and you can then easily add it to <code>Files &gt; Script Menu</code></p>
