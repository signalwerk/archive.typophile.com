      <p>- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - </p>
    <p>A lecture and exhibition at St Bride Library curated by Dr Paul Thirkell</p>
    <p><strong>FORGOTTEN HISTORIES: The Collotype print past and present.</strong></p>
    <p>Exhibition preview and opening lecture: Tuesday 24 January (details below)<br>
    Exhibition runs from Wednesday 25 January to Thursday 23 February</p>
    <p>- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - </p>
    <p>This exhibition aims to reveal the extraordinary quality and scope of<br>
    collotype printing (a technique that holds a distinguished place in<br>
    print history as one of the first photomechanical printing processes<br>
    invented).</p>
    <p>Although collotype has never been produced on the same industrial scale<br>
    as techniques such as the ubiquitous offset lithography, it was<br>
    consistently employed on a relatively small scale throughout most of the<br>
    twentieth century as a specialist medium for the highest quality book<br>
    illustrations and single sheet, fine art reproductions.</p>
    <p>Although its photographically accurate printing characteristics and<br>
    exceptional colour qualities remain (even in the digital age) largely<br>
    unparalleled, its economic viability was gradually eroded during the<br>
    latter half of the twentieth century by faster and cheaper methods of<br>
    print. Where, up until the 1960s &amp; 70s, there was an active network of<br>
    collotype ateliers scattered throughout England, Europe, America and<br>
    Japan, there are now only a handful of professional studios left<br>
    worldwide.</p>
    <p>This exhibition traces some of the techniques use from the late 19th<br>
    century to the present, featuring work from some of the long lost<br>
    companies such as the renowned Cotswold Collotype Company, Waterlows and<br>
    Jaffe. Also featured is a rare and intriguing round up of contemporary<br>
    artists original prints from the world’s last surviving studios.</p>
    <p>- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - </p>
    <p><strong>Exhibition preview &amp; opening lecture: Tuesday 24 January</strong></p>
    <p>We begin in the Exhibition Room with a preview of the exhibition from<br>
    5.30pm before moving upstairs to the Bridewell Hall for the accompanying<br>
    lecture at 7.00pm.</p>
    <p>Our speaker, Dr Paul Thirkell, is a Senior Research Fellow at the Centre<br>
    for Fine Print Research, University of the West of England. One of<br>
    Thirkell’s main areas of research is the reassessment (especially in<br>
    fine art printmaking terms) of high quality nineteenth century<br>
    industrial printing techniques. Besides working to reconstitute valuable<br>
    lost processes, his research has also led to the integration of digital<br>
    imaging techniques to create unique contemporary hybrids.</p>
    <p>Thirkell’s principal area of exploration has been through the collotype<br>
    process, ultimately bringing him into contact with what threatens to be<br>
    the last generation of professional master collotype printers. To foster<br>
    an international dialogue and exchange of knowledge at this crucial<br>
    point in collotype history, Thirkell hosted the second international<br>
    collotype conference in Bristol. Taking place early in 2005, it brought<br>
    together representatives from studios in Italy, Japan, the USA and the<br>
    UK to share their insights. He also runs a small collotype studio at the<br>
    Centre for Fine Print Research and has recently published a portfolio of<br>
    ten artists’ works that explore the dichotomy between original and<br>
    reproduction in fine art print.</p>
    <p>Entry to the lecture, £5 or £3 concessions, on the door.</p>
    <p>- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - </p>
    <p><strong>Exhibition: 25 January to 23 February</strong></p>
    <p>Exhibition Room,<br>
    St Bride Library,<br>
    Bride Lane, Fleet St,<br>
    London EC4Y 8EQ</p>
    <p>Telephone: 020 7353 4660<br>
    Hours of opening: Tuesday-Thursday, 12.30-5pm (9pm on Wednesday)</p>
    <p>We would recommend that you do call beforehand to check accessibility<br>
    to the exhibitions, especially if making a long trip.</p>
    <p>Entry to the exhibition is free.</p>
    <p>For further information, see: <a href="http://www.stbride.org" title="www.stbride.org">www.stbride.org</a></p>
    <p>- - - - - - - - - - - - - - - - - - - - - - - - - - - - - -</p>
