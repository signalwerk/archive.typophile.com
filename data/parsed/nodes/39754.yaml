      <p>&gt;kosher</p>
      <p>No, it’s “age of reason,” like Caslon. Being a Reform Jew, I’ve got a foot in each tradition, which is either strong or schizophrenic, depending on your point of view. </p>
      <p>&gt;no other doctrine beyond that</p>
      <p>I concede that there is a difference to this extent: the Crusaders killed in the name of God, whereas Stalin killed in the name of ’scientific socialism’. The justification for killing wasn’t atheism itself, but ’science,’ which supposedly led to the conclusion that if you killed enough people everything would be great. However, the positing of ’science’ in place of God as a source of certainty is “positivism” as defined by August Compte and as taken up by Marx. And positivism is a doctrine that has atheism as an key component. The key sin in my view is not theism or atheism, but rather being so certain you are right that it gives you license to kill. That’s fanaticism. </p>
      <p>If you want to detach atheism from doctrines that it has been part of, like Marxism-Leninism, that is fine by me. But then for consistency you have to do the same thing for theism, and then you can’t blame theism itself for any of the manifold sins of religious groups. Stalin killed in the name of a doctrine that had atheism as part of it. The Crusaders killed in the name of a doctrine that had God as part of it. God was crazy one excuse, and ’science’ another, for murdering innocents. But Hitchens’ views still go out the window, because the problem is fanaticism, not theism or atheism.</p>
