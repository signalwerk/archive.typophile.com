      <p>The story on Jews and proselytizing is rather long and complicated, as with everything in this nearly 4000 year long history. </p>
      <p>Hillel (about 30 BCE) said “Love all your fellow creatures and bring them near to the Torah.” This indicated a positive desire to convert others to Judaism. And the famous story of a non-Jew saying he would convert if Hillel could tell the whole Torah while standing on one foot also indicates a desire to proselytize. The statement in the New Testament about how far the Pharisees would go to make a convert is probably based on reality.   </p>
      <p>This changed with the destruction of the Temple in 70 CE, when the Romans forbid Jews wfrom proselytizing, under pain of death. Though this situation changed, the precariousness of Jewish security did not, and the policy became not to proselytize, and to warn any potential convert of the difficult conditions for Jews—while welcoming converts as full Jews, if they still wanted to convert. </p>
      <p>There it remained until after the holocaust and the establishment of the state of Israel. In Israel, with its tinderbox of religious conflict, I believe all proselytizing by any religion is forbidden. In the US it has been different. The US became very tolerant and accepting to Jews, and intermarriage has increased greatly. This is to the point where I have read that in the US there will soon be as many people with one Jewish parent as two. </p>
      <p>In response to this situation, in 1978 the then head of the Reform movement, the late Alexander Schindler, changed this traditional policy and urged “outreach” to the spouses of Jews, inviting them to learn more about Judaism, with bring them close to Judaism, and converting more of them. The invitation was also out to anyone not associated with a religious movement. </p>
      <p>So it is still true that Jews will not approach anyone who has another religious affiliation about converting, but the invitation is there to others by the Reform movement. </p>
      <p>There is an umbrella organization dealing with these issues, <a class="freelinking-external" href="https://web.archive.org/web/20081012143124/http://joi.org/">The Jewish Outreach Institute.</a></p>
    html_clean: |-
