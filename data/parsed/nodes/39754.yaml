      <p>&gt;But the actual derivation is up for grabs.</p>
      <p>Chanukah is a Hebrew word meaning ’dedication’ or ’inauguration’, and refers to the  re-dedication of the altar of the Temple in Jerusalem (in 164 BCE), as the song EK quotes says. The acronym is a fanciful “midrash” or interpretation. The root of the word is Chet Nun Kaf, and appears in other words meaning ’inaugurate,’ ’train,’ and ’educate’.</p>
      <p>That is your lesson for today. Now children, you can go back to your dreidel and chocolate coins :)</p>
