      <p>I guess I can’t see that anyone has the right to say their truth is “truthier” than anyone else’s, or that their path is any more righteous. Hence I find proselytizing basically abhorrent, whether it is to increase one’s numbers, to spread one’s word, or to tame the savages.</p>
      <p>It was shocking to travel to a remote village in Guatemala and see an enormous Seventh Day Adventist church that dwarfed every other building in the town. Heartening, in another village in Chiapas, Mexico, to learn that the Mayans had ejected the bishop and basically taken over the church for their indigenous religious rituals, into which they incorporated the left-behind saint figures, along with rose petals, incense, and soda bottles.</p>
