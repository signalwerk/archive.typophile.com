      <p>Tiffany, I was just more or less repeating what you can read are views common in many parts of the world. I was just using some of the vehement language—though a lot milder than what is actually said—to get across that this is a real life issue now, around the world, that people feel very strongly about, and are very divided on. </p>
      <p>I don’t agree with the anti-feminists, but my point is that relativism doesn’t get you anywhere in having a respectful discussion with those you disagree with on ethical principles. </p>
      <p>I do think you can get somewhere if you start with the premise that that are some universal principles, but we can’t be so certain about what they are in detail. We need to look not only what is declared, but what the consequences of beliefs are for the welfare or misery of society. If we can start by agreeing on that as some kind of test, then we can discuss with those we disagree with. But that’s not relativism. </p>
      <p>Some views are truer than others, but we can’t be so sure we are in possession of the truth, and the other person is wrong. It may be the other way round. That kind of humility is the best basis of tolerance, not relativism, in my view.</p>
