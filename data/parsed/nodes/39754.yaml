      <p>Fredo, here’s more follow up on atheism and Stalin. </p>
      <p>A key beginning is Francis Bacon’s doctrine of prejudice. (Bacon was a contemporary of Shakespeare.) This key idea was that the truth is obvious, and that only prejudice, which blinds us, prevents us from seeing it. (You can read the fuller story in Popper’s essay “On the sources of knowledge and ignorance” in his book “Conjectures and Refutations”.)</p>
      <p>The sources of prejudice were past authorities, both religious authorities and the ancient Greeks. Bacon’s idea that rejecting the past was the key to a brighter future help liberate thinkers to criticize past ideas, and that in many ways was hugely positive. It helped lead to modern science and liberal democracy. And it was a key ingredient in the tolerant “age of reason” in the 18th century.</p>
      <p>However, there is a small problem: the truth is not obvious, and human beings are highly fallible. What happened is that whatever seemed ’rational’ to a thinker was held as obvious, and everyone who disagreed was an enemy of progress. This arrogant version of rationalism became prominent beginning with Rousseau, and cut a bloody swath through history, beginning with the reign of terror in the French revolution. The persecutions in the French revolution were not exactly atheist, as most of them were deists. But they were definitely against traditional religion and violently anti-clerical. Later, with Marx, the idea became a militant atheism: that defeating religion, the “opiate of the masses” was essential to the progress of humanity. So atheism part of an aggressive, and in some hands, such as Stalin’s, a violent ideology.  </p>
      <p>The story is told most extensively, I believe, by Jacob L. Talmon, in the “Origins of Totalitarian Democracy.” I haven’t read that book, but I looked at it a long time ago, and believe it tells the story most directly.</p>
