      <p>David, I don’t have a problem with any level of observance of ritual, or with disagreements about what should be done. What I do have a problem with is being unethical, or violating your own standards in the act of pushing them on others. </p>
      <p>If they are so concerned with God’s name being thrown in the trash, then they shouldn’t send it to somebody who doesn’t ask, because that will certainly happen. The practice invites desecration by their own standards and so is bad by their own standards. </p>
      <p>That they do it as part of proselytizing—to other Jews to become Jewish their way—has a bad odor as they are violating their own standards, and not being respectful of others as well. It annoys me because I am being put upon. I have to either keep the calendar, which I don’t want (and has lousy graphic design!) or I have to throw it out, which I feel guilty doing because I do like treating genuine religious objects with respect. I have thrown them out anyway, for years, feeling like they are doing a mean trick—a kind of ’chilul hashem’ in itself. Fortunately, I didn’t get one this year. </p>
      <p>The Chabad people I have met I have found to be charming people. I always feel a sense of relief because they are authentically Jewish, even though not the way I would choose, whereas so many American Jews are sadly ignorant of their traditions.</p>
