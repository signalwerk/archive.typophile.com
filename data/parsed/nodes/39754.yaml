      <p>ps to my comment on the background to the link between atheism and communist violence. I agree with Lori and Psachya on the naïveté of Lennon’s song. It is a hymn to the utopian dreams of communist atheism, and completely ignores the bloody history of those who tried to implement this dream. </p>
      <p>I had a look at the wikipedia article on Chabad, and learned something important about the movement I didn’t know before. I had been baffled when one wing of the movement insisted that the late Rebbe was the messiah. It seemed to me that something must have gone very wrong in the movement for some followers to adopt such a view, which seems to me alien to Judaism. </p>
      <p>I had known that the founder of Chabad put study and learning back into Chassidism. In the wikipedia article it says further than he explicitly rejected the idea that a ’rebbe’ was an intermediary between a follower and God. This authoritarian element in Chassidism always struck me as its worst feature, and I was happy to read about what the founder of the movement had done. </p>
      <p>However, that late Rabbi Schneerson explicitly rejected the views of the founder, according to the article, and saw himself as having better access to God than his followers. Personally, I think that ridding Judaism of priests was was of the best things that happened to it, and putting back this authoritarian element is really a  backward step. Since it is Chanukah, it is good to remember that it was the Priests who wanted to turn Jerusalem into a Greek city, and betrayed the Torah.  </p>
      <p>We already had our reformation, so to speak, in the rise and dominance of Rabbinic Judaism over the priestly cult of the Temple. I don’t want to go back.</p>
