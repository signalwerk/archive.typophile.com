      <p>Actually I think hopeless is too kind. Misguided or worse in my opinion. I am sure that there are plenty of missionaries with only the best intentions - to help others find the true path to salvation, or whatever. But I think the impulse behind prosletyzing is not always so benevolent, it’s about power and fear and intolerance, just like the edict to procreate madly in order to up your numbers.</p>
      <p>Gentle persuasion, an attempt to spread your own version of the truth - the Dalai Lama speaking in Central Park for example - this I have no problem with. But a “mission” to convert, whatever the religion, feels like a first step towards “death to the infidels” and we know where that can lead and has led throughout history. </p>
      <p>I also believe that if more people made a point of learning about other religions rather than rejecting them, they would learn that they have more in common in terms of truth (if not in the details) than they expected.</p>
      <p>I do want to emphasize - lest I am in danger of offending anyone - that my distrust of fundamentalism extends to every religion including my own.</p>
