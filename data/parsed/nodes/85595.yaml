    <p>Hello,<br>
    I'm having no luck finding this font (or something similar). </p>
    <p>It's from the cover of 'The Firebird', a collection of Russian Fairy Tales from 1935 (I think). Here's a link to the full cover:- <a href="http://kuala06skylab.blogspot.com/2010/10/blog-post_8313.html">http://kuala06skylab.blogspot.com/2010/10/blog-post_8313.html</a></p>
    <p>Any help would be much appreciated.</p>
    <p>crssp</p>
    <p><img src="/sites/default/files/old-images/0011_3721.jpg"></p>
