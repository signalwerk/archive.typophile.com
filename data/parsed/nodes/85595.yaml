    html: |-
      <p>Unfortunately it looks to be hand-lettered - the slight differences between the /E/s and /R/s are a dead giveaway.</p>
      <p>The only typeface I've been able to find which mimics Old Church Slavonic (which is the writing system that's been inspirational here) is ParaType's <a href="http://new.myfonts.com/fonts/paratype/izhitsa/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Izhitsa</a>. Unfortunately it's not as good as the above ans shares few other characteristics.</p>
