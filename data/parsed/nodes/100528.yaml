      <p>hrant: "but it's just not enough of an "s" there, or in fact in virtually any Armenian design."</p>
      <p>As a native you would know better whether the letter cannot do double-duty or be designed to be more curvacious.</p>
      <p>percusse: "In the meantime I was also playing around with the integral sign for replacing the vertical of h with a kind-of s"</p>
      <p>You could also try the International Phonetic Alphabet letter "esh" used to denote an unvoiced post-alveolar fricative sibilant instead of the integral sign. There are different versions of this letter. One has an upright stem, whereas another has a backward-slanting oblique stem.</p>
