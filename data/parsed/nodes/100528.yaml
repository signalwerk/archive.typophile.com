      <p>Your appreciation alias percusse gladdens me. You are welcome to choose to show us a snippet of your result or progress. </p>
      <p>I may be responsible if not all of what I wrote was accessible to everyone. In a future post I may illustrate by further examples some of the points that I was explaining. But please forgive me if some technicality will be necessary for the sake of brevity in this post. I have much more to say, but which I omit for the mean time. </p>
      <p>I also liked to hear of the astute observations of Alan Munn that you sent us. I remark on his impressions forthwith.</p>
      <p>The same impression in the lowercase ligature has occurred to me. The lowercase ligature could be made to look less like the masculine and more like the feminine by extending the swash-like curve for the "s" leftwards from the stem, and perhaps slightly upwards without gaining the full height of an ascender, as, I tell you, it appeared in my original hand-drawn design sketches. There is leeway for variation, and font designers or typographers could adjust the proportions to preference. Whilst effort should be made to satisfy feminists, care should be taken to avoid unintentional connotations. Overt emphasis of the female gender to the exclusion of the male should be avoided as that would defeat the whole purpose of the ligature, which is to be gender-neutral or mutually inclusive. I hasten to add that no particular known identifiable individual person should be discussed by anyone else using a neutral pronoun, whether inanimate or animate.</p>
      <p>Although it may be true that all instances of an initial voiced dental or interdental fricative in the English language occur in "function words", this does not imply that all instances of initial unvoiced dental or interdental fricatives must by law occur in non-function words. According to the ever-trustworthy Wikipedia, ehem,</p>
      <p><a href="http://en.wikipedia.org/wiki/Function_word">http://en.wikipedia.org/wiki/Function_word</a><br><a href="http://en.wikipedia.org/wiki/Function_word" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://en.wikipedia.org/wiki/Function_word</a><br>
      "The following is a list of the kind of words considered to be function words:</p>
      <p>articles — the and a. In some inflected languages, the articles may take on the case of the declension of the following noun.<br>
      pronouns — inflected in English, as he — him, she — her, etc.<br>
      adpositions — uninflected in English<br>
      conjunctions — uninflected in English<br>
      auxiliary verbs — forming part of the conjugation (pattern of the tenses of main verbs), always inflected<br>
      interjections — sometimes called "filled pauses", uninflected<br>
      particles — convey the attitude of the speaker and are uninflected, as if, then, well, however, thus, etc.<br>
      expletives — take the place of sentences, among other functions.<br>
      pro-sentences — yes, okay, etc."</p>
      <p>So if adpositions are function words, then presumably prepositions, which belong to the set of adpositions, are function words. The word "through" is a preposition, but it is pronounced with an initial unvoiced rather than voiced dental or interdental fricative. Perhaps, however, one could disregard that as an anomaly because the initial phoneme is followed by a rhotic one, even though a rhotic phoneme would be voiced by default (although I would sometimes pronounce the word "rhotic" and certain other words of Greek etymology with a voiceless r, such as the letter "rho" itself in order to distinguish it from the otherwise homophonic words "row" and "roe"). But this is hardly tenable.</p>
      <p>Many phonemes have arisen historically by differentiation of allophones. This can happen by dialectal variation (such as the pronunciation of the initial phoneme of the words "which" and "whether" as unvoiced in contrast to voiced in their otherwise homophonic words "witch" and "weather". The pronunciation of unvoiced "wh" can still be heard today sometimes where I live, even though it would violate a rule that sonorant phonemes in English can no longer be unvoiced unless by allophonic variation); importation of foreign words (such as the French word "genre" into English); grammatical inflexion (such as generation of verbs from nouns by conversion of final unvoiced dental fricatives to their voiced counterparts, as in the verb "breathe", whose final phoneme is voiced, from the noun "breath", whose final phoneme is unvoiced. An example in which there is no other phonetic change is with the verb "loathe", pronounced with a voiced final, and the adjective "loath", with unvoiced codal phoneme); or by gradual change. For example, there is a tendency in historical linguistics for lenition by increasing sonority of unvoiced to voiced, especially intervocalically, that is, medially between two vowel phonemes. An allophonic pronunciation should be predictable from the context and is not contrastive, such that it is not responsible for the sole phonetic difference between any words or morphemes that differ in meaning. But once they become true phonemes, their pronunciations cannot necessarily be predicted from any prescriptive grammatical rule, though they would still of course be subject to allophonic mutation in accordance with the phonological context, such as assimilation with the voicing or lack of voice of adjacent phonemes, unless they are themselves the trend-setters.</p>
      <p>We should know that the unvoiced and voiced dental fricatives are phonemes in English because the unrelated words "thy" and "thigh" of different meaning differ in sound solely by their initial dental fricatives. You could argue that "thy" is a function word, but it might be that the dental fricatives are voiced in function words because they are old and have been used frequently such that they have become voiced by lenition.</p>
      <p>Excuse me if I do not know the full textual evidence, but as for the historical linguistic explanation, I would have thought that it can be debated whether the voiced and unvoiced versions were allophones rather than separate phonemes immediately before the introduction of our current orthography. We have no audio recordings of speech from hundreds of years ago. Let me argue by a hypothetical scenario as follows. If we today were to begin to re-introduce the Old English letters thorn þ and eth ð, and use them for respectively the unvoiced and voiced dental fricatives, as they used to be used, and if we further suppose that in some distant time in the future all audio recordings that we still have in our present time should be lost or destroyed, such as by planned obsolescence if your imagination calls for a reason, then it would seem reasonable that people of the future would infer from the textual evidence that would remain with them that what to them would be written as two separate phonemes used to be written as though they were a single phoneme pronounced the same way, by the single digraph, or two letters in combination, "th". Therefore, the people of the future would deduce that the two phonemes must have arisen by differentiation of two allophones of the same phoneme. The same kind of argument can be extended to our past. Regard much of this paragraph as somewhat tongue-in-cheek.</p>
      <p>What I am saying is to ponder whether it is possible that there were at some time in the past two phonemes, one voiced and the other unvoiced, but that the phonemic distinction was forgotten or lost to some extent because of the removal of the Old English letters thorn and eth by the Normans, who seemed to favour only the Latin alphabet (They also removed the two other non-Latin letters wynn and yogh that were useful). Consider the second verse stanza of the poem Beowulf. How else would you explain "syððan ærest wearð"; "oðþæt"; and "Þæt wæs god cyning" and all of the other examples?</p>
      <p>In summary, phonemes can arise from allophones, but they can also merge and be lost. The process happens both ways in the evolution of language, which is not constrained to obey any etymological rationalisation and theoretical categorisation. The deep lexical relationship that you raise may have been caused orthographically by Norman vandalism to the Old English alphabet.</p>
