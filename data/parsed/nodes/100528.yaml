      <p>I like Tristan's sideways S idea.  </p>
      <p>His other ligature made me wonder: Could it make sense to move the s inside the h, merging the top of the s with the arch of the h?  This would be tricky, I'm sure.  It might require measures such as raising the arch and thinning the s to create more space, and all of the lines would have to be drawn very carefully to preserve the sense that the ligature derives from both an s and an h.</p>
