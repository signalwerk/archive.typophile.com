      <p>You can certainly make a փ from scratch where the two arches look like an "s" laying down, but:<br>
      - What about the out-of-place descender?<br>
      - What's the rest of the Armenian font going to look like? The arch is our biggest building-block.<br>
      - It's really too much of a hack to insert an Armenian letter in Latin text like that.</p>
      <p>As for my descending "s" idea: allow me to emulate the State of Israel's official policy of ambiguity when it comes to possessing nuclear weapons... :-)  Seriously: I actually think explaining an idea leads to more discovery than showing it.</p>
      <p>hhp</p>
