      <p>Thank you all for your responses, this is a great discussion. Let me clear one thing; after seeing the comments here and in TeX.SE I think I'll just go with the "he" and don't bother with it unless somebody slaps me in a conference or something (I don't think anybody would read it anyway but you know how it goes right ?). </p>
      <p>Anyways the starting point for me was first checking the Unicode lists and look for gender related ones. I've found out that U+26A6 and U+26A7  (⚧ and ⚦) means in some context transgender and whatnot stuff. So I thought instead of this one can also find a nice ligature, as ∛ is much better than typing out cubic root all the time or ½ instead of 1/2 etc. </p>
      <p>Trust me I'm not after a Unicode revolution, I was just curious :)</p>
      <p>Again, thanks a lot!</p>
