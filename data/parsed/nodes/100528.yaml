      <p>dudefellow, I think U+0283 is really a great idea for sans-serif fonts. The integral-like one can still be used for the serif types too. </p>
      <p>I do agree with hrant on making the "s" a little more pronounced, but at the same time, I fear that it might make it too feminine. I guess there is a balance between where it becomes pompous/decorated and where it becomes a mistyped "he". I believe that it should also look neutral as much as its meaning. I don't know how to convert the ornament like circles to actual serifs. My attempts ended up being pretty ugly. I think I don't know enough typography to handle that. </p>
      <p>The Armenian letter looks indeed beautiful. For some weird reason, reminds me of Yves Saint Lorent logo. It looks horizontally a little too big though.</p>
    html_clean: |-
