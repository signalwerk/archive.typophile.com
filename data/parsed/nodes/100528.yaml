      <p><cite>Love the "$he" proposal, cebg--anyone can use it right away. </cite></p>
      <p>Ah, but there is a nuance -- associating the need for money with the female gender. The twin side of the women's movement. </p>
      <p>When I was a boy -- this was the 1950s -- there was never any talk of having meaningful work. The talk was about the responsibility to find work to support a family. Why my father, who was a research chemist, took a job in management. He loved research, but management paid more.</p>
      <p>Without "meaningful," which led to "enjoyable," I imagine we'd have fewer happy people, both men and women. On the other hand, we might have fusion power instead of 1,000,000 typefaces.</p>
      <p>Be careful what you wish for.</p>
