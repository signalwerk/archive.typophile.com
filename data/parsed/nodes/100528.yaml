      <p>For the mix: <strong><a href="http://www.urbandictionary.com/define.php?term=shim">Shim</a></strong> is a term I learnt several years ago while working with the queer community. At the time, it was a combination of “she” and “him” and was most often used to refer to individuals who identified as <a href="http://en.wikipedia.org/wiki/Intersex">intersex</a>, transexual, or transgendered. I found it somewhat cumbersome to use in parlance <em>and</em> print due to conflicting tense. Grammatically, you can say “She went to the store,” but you can’t say “Him went to the store,” so “Shim went to the store” is a bit clunky. Then again, this <em>was</em> ~10 years ago, so perhaps it has a radically different usage and meaning. Maybe it’s not even “correct” anymore. a quick Google showed me a few references to it being a derogatory term, as opposed to the “politically correct and inclusive” term I was originally exposed to it as.</p>
      <p>Fun facts!</p>
