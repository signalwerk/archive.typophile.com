      <p>There are many invented gender-neutral pronoun systems ("xe" and so on), and the problem with them is that they will never seem anything less than jarringly alien to a general audience. So, in practice, these are only ever used by people who identify outside the gender binary, and really only among each other.</p>
      <p>Instead, there has been a natural rise in acceptance of the singular "they", which has a lot more precedent in historical use than one would expect. Grammar prescriptivists may recoil, but it's how people actually talk.</p>
      <p>A good writer can skirt the problem entirely, rewriting sentences to employ "one", passive voice, a consistent plural, or second person, for example. With practice, it isn't very hard.</p>
      <p>But when you come down to it, is "he or she" really so ugly? Is it much more unwieldy than anything else in a technical document? Or does it just seem that way because it represents something you transparently resent?</p>
