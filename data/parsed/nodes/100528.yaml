      <p>I actually quite liked this one. I'm trying to replicate it in my thesis font now. Regarding your grammatical comments, I have to disappoint you that I can't follow the train-of-thought just due to my ignorance on the subject but our in-house linguist Alan Munn from TeX.SE also enjoyed the ligatures and commented as below. I'm including it here just to be able to reflect some thoughts on your proposition since I'm not able to provide.</p>
      <p>Thank you very much.</p>
      <p>Alan Munn : </p>
      <p><em> The ligatures are cute, although the lowercase one looks too much like he. The use of [θ] for the pronunciation will violate a deep lexical generalization about English: the voiced interdental fricative is only found in function words and the voiceless one in non-function words. There's likely a historical explanation for this, since the voiced and voiceless versions used to be allophones of a single phoneme. (I.e. they were two pronunciations of the same mental sound). </em></p>
