      <p>Well, this issue bothered me because it's written in English and I have no knowledge over it's contemporary status about these nuances. For once, I thought, it might a good idea to be a little more aware. </p>
      <p>Is it ugly to write "he or she"? My answer is yes. It shouldn't be a problem which pronoun I might have chosen. But it was there when I've arrived. Heh.</p>
      <p>Avoiding these pronouns seems more problematic to me because then you kind of accept the fact that this is a genuine problem which is not from my point-of-view.  I sincerely don't believe this would equate man woman inbalance. For me it's just childish complain to rant about "man on the moon" etc. especially people know exactly what the context is. But anyway, that's another story.</p>
      <p>Also I was thinking that this must have come up in a legal context and similar cases where every pronoun means something particularly important so "he or she" written consecutively n times should have pushed people to come up with a solution already but I guess not. </p>
      <p>If you are interested, alternating he/she automatically is possible for LaTeX users via a package written by Alan Munn. You can find the link in the TeX.SE question.</p>
