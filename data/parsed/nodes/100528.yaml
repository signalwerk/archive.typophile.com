      <p>We just set a book -- first proof going out tomorrow -- where the author(ess) decided that "Filipino" was unacceptable, and each instance should be "Filipina/o", with the plural "Filipinos/as". Notice the fairness , as the feminine form is first in singular, second in plural.</p>
      <p>Fine. Except the designer chose Arno to set the text in, and the kerning of the regular slash in Arno needs to be in keeping with normal usage. Slash_o has other uses -- as with either/or. And it's a long slash...</p>
      <p>Solution: make up a separate slash, name it slash.gender (keeps the code in the file correct), put it in a stylistic set, and kern it for Filipina/o (and Latino/a  + plurals, etc.) By the time it's all said &amp; done, 2 hours time, so charge the client $120 extra. A different font might have avoided this, but interior book designers don't usually think (that way).</p>
      <p>My earlier $he ain't so far off,  it seems. One has to pay for one's afflictions...</p>
      <p>Edit:</p>
      <p>I was working on arbitrary fractions for a font this morning, and saw/remembered another one. Someone decided to use the @ symbol for gender neutrality, as in  Latin@. Except to make a passable ligature, it had to be completely redrawn. Roman and italic...</p>
      <p>Let's call everybody "it."</p>
