      <p>hrant: "What about the out-of-place descender?"</p>
      <p>The descender intensifies the recognition or perception of the main stem as the slant between the two letters of the ligature. It also is a referent of the letter thorn; see my post of 6 Mar 2013 — 12:17pm in this topic.</p>
      <p>"What's the rest of the Armenian font going to look like? The arch is our biggest building-block."</p>
      <p>Surely, can the connection of the arch to the stem not begin closer to the middle of the stem than usual?</p>
