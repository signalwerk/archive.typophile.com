    <p>Hello everyone, </p>
    <p>I'm currently polishing my PhD thesis and my work involves human operators using robotic devices. I'm using a lot of "he or she", "s/he" or whatnot to obey the Political correctness police. I've summarized why I feel kind of sour about this issue on our TeX and friends Q&amp;A site TeX.SE. The link to my question is</p>
    <p><a href="http://tex.stackexchange.com/questions/97429/a-ligature-for-she-he">http://tex.stackexchange.com/questions/97429/a-ligature-for-she-he</a></p>
    <p>In one of the comments, I've been adviced to consult your expertise on this issue. I'm not replicating the thread here to keep this simple but I would like to ask about your opinion on how I should proceed. </p>
    <p>My excuses at the outset for my mediocre attempts :)</p>
    <p>Thank you, </p>
    <p>And using this opportunity, I invite you also join us and share your expertise on TeX.SE too </p>
    <p>(I hope you don't take this as a promotional statement but we have a quite friendly community and would love to have your answers about typographical issues with our documents.)</p>
