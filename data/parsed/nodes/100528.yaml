      <blockquote><p>A good writer can skirt the problem entirely, rewriting sentences to employ "one", passive voice, a consistent plural, or second person, for example. With practice, it isn't very hard.</p></blockquote>
      <blockquote><p>But when you come down to it, is "he or she" really so ugly? Is it much more unwieldy than anything else in a technical document? Or does it just seem that way because it represents something you transparently resent?</p></blockquote>
      <p>For me, the answer would be: Of course not.  If I resented inclusive language, I would just use "he".  No one is policing that aspect of my writing.  I do care about communication, rhythm, flow, and awkward phrasing, in addition to making all readers feel welcome.  (Sometimes the right typeface helps.)   I use rephrasing to avoid pronouns, I use "she or he", etc., but these methods involve tradeoffs, and sometimes are less than optimal.  I use "they", but don't like it, despite historical precedent.  Once in a while it's even ambiguous.  Any composition of standard pronouns such as "s/he" or "he or she" is not fully inclusive, either.  I agree that the novel pronouns are impractical outside of small communities, but perhaps that will change, eventually.   percusse asked an interesting typographical question, in any event; it seems worth exploring possible answers.</p>
      <p>I agree that the dollar sign in "$he" has potential to be inappropriately suggestive, although in multiple respects; what gets subtly suggested, if anything, will depend on the reader and context.  It's a simple solution despite this.  The he/she fraction may be better.</p>
      <p>(my 2/100 of a $)</p>
      <p>(When $^{\mbox{\scriptsize he}}$/$_{\mbox{\scriptsize she}}$ wants to use \LaTeX\ in a gender-neutral manner, the fraction method is readily available to  $^{\mbox{\scriptsize her}}$/$_{\mbox{\scriptsize him}}$, by the way.)</p>
