      <p>I think that integral-sign idea could be a good start, but for one thing it would have to be more curvy to sufficiently evoke an "s".</p>
      <p>David, I should love that idea (since there's a minute chance people will commission me to make that Armenian letter -and thereby of course complete Armenian extensions- for hundreds of fonts ;-) but it's just not enough of an "s" there, or in fact in virtually any Armenian design. However, you've given me an idea: what if the "s" is allowed to descend, leaving the "h" to -mostly- do its thing above the baseline?</p>
      <p>BTW, I wouldn't equate something that needs to work embedded in text -so essentially at the level of bona fide alphabetic letters- with something like the ampersand.</p>
      <p>hhp</p>
