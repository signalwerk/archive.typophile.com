    html: <p>I agree with some of the comments that there are various workarounds that one can use in some contexts, but sometimes nothing but a clearly inclusive pronoun will do.  For example, when I make handouts for students, I wouldn't want anyone to get a subtle message that they don't really count, and I want to implement that policy in every sentence--alternating won't do.   "They" works sometimes, but I want to encourage good grammatical usage too ....  There are a variety of proposed alternative pronouns (<a href="http://en.wikipedia.org/wiki/Gender-neutral_pronoun#Modern_alternatives_to_gender-neutral_pronoun">http://en.wikipedia.org/wiki/Gender-neutral_pronoun#Modern_alternatives_...</a>), but few of my students would have any idea what they meant.  I was the person who suggested typophile.com to percusse, and as you can see, I'm very interested in what folks her come up with.  Nice ideas, altsan.  Love the "$he" proposal, cebg--anyone can use it right away.  Then again, I'm not sure it will help communicate to students.</p>
