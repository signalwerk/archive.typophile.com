      <p>Why not use the Armenian letter Unicode 0583, which if I am not mistaken is supposed to represent an aspirated unvoiced labial plosive. It should be readily available for most people if they have not a custom ligature at hand (See image "ArmenianPiwrU0583JPEG", Sylfaen font). If we like it, then we all have no excuse not to get started on the new pronouns. I suppose that there could be several varieties of the ligature to be used, just as there are many styles of the ampersand, for example.</p><div class="imageWrap"><img src="http://typophile.com/files/ArmenianPiwrU0583JPEG_5999.JPG"></div><p></p>
