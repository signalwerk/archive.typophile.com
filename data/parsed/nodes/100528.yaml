    html: <p>My feeling about this issue of what pronouns to use is that in practice, there are subtle influences on our thinking that come and go and interact with other aspects of social life.  We can say that using exclusively male pronouns is meant to include women as well, and that is one tradition that has been handed down to us.  In practice, though, I think that this practice subtly or not-so-subtly influences cognitive processes so as to suggest that men count, men are included, and women aren't.  I think that when <em>I</em> read "he", what comes to mind is a man.  I think this happens to most people at least some of the time, and we don't even notice it.   I am not trying to please some "political correctness" police.  I think there is a real effect of using only male pronouns, and it helps support thought processes that views women as less able to contribute to society.  I don't think that that idea--that women are less able to contribute--is objectively true.  I think women and men can contribute equally, sometimes in different ways, on average, but sometimes in the same ways.   In addition that, there are people who are neither clearly male or female--that's who they are, and that's OK.  They should not feel less able to contribute either.  Society benefits from diversity of contributions.   So I'm in favor of gender-neutral pronouns, in the abstract.  As it happens, there is not an ideal solution for communication of gender-neutrality at this time.</p>
