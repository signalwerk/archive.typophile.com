      <p>My proposed solution to this now to be former problem is both linguistic and typographical conjointly.</p>
      <p>For my typographical solution, see image "DKheSheLigaturePictureTwoLineJPEG", which contains a ligature of the letters S and H, with the initial of the pronoun either lower case or capitalised as upper case. Since ligatures are often discretionary, this proposal should hardly be considered unconventional. The versions shown here are based on the Libertine open source font. To Original Poster, this font should be familiar to your TeX application.</p>
      <p>My linguistic solution, which I thought of several years ago, is to take the third person plural pronouns, which never specify gender, and convert them to neutral animate singular pronouns by changing the first phoneme from the voiced dental or interdental fricative in the plural pronoun to the unvoiced or voiceless dental or interdental fricative in the singular. </p>
      <p>But for the third person singular subject neutral animate pronoun, in addition its vowel could be pronounced the same as for the corresponding masculine and feminine pronouns "he" and "she", rather than as in the plural pronoun "they", in order to emphasize that it is to be singular rather than plural. </p>
      <p>Since the phonetic distinction between the voiced and unvoiced phonemes is not large, it would be acceptable to pronounce the initial phonemes unvoiced in the pronouns that I propose in ordinary speech without sounding too strange. Possibly, the listener would not even notice without paying attention, yet would still understand. I recommend that you may test this in conversation with your friends and colleagues.</p>
      <p>The reason that I base these third person singular neutral animate pronouns on the third person plural pronouns is that those plural pronouns are nowadays routinely used for gender-neutral contexts, even where to do so would be ungrammatical. Hence, to use my suggested pronouns instead would be in accordance with modern practice, yet would avoid being ungrammatical.</p>
      <p>Note also that the third person singular neutral animate pronoun should be conjugated with singular rather than plural verbs. </p>
      <p>The reason that I use the unvoiced rather than voiced initial phoneme is that the initial phonemes of the singular masculine and feminine pronouns are unvoiced or voiceless.</p>
      <p>The unvoiced dental or interdental phoneme can be represented in spelling using the Old English letter thorn þ, as I have shown in the table (see image "DK3rdPersonPronounsTableJPEG"). To use my linguistic solution in conjunction with the typographical approach, simply substitute that letter thorn by the ligatures that I have designed.</p>
      <p>In order to remind the reader to pronounce the initial phoneme of the singular pronouns unvoiced rather than voiced, it would be acceptable to design the lower case ligatures in such a way that they would have descenders to resemble the letter thorn þ. But the upper case varieties should not have descenders. I have also considered italic versions of the ligatures, and these would have a greater propensity to imply the forward slant as the oblique stem between the letters S and H. The italic version should also have a tendency towards becoming graphically symmetrical, but such a glyph would in my ideal system of writing denote a different phoneme than the unvoiced dental fricative.<br><img src="/sites/default/files/old-images/DKheSheLigaturePictureTwoLineJPEG_4924.jpg][img:sites/default/files/old-images/DK3rdPersonPronounsTableJPEG_3914.jpg"></p>
    html_clean: |-
