    <p>Thanks, everyone, for your input on my last typeface, Metron.  As promised, I'll be sending out finished-version copies soon to everyone who helped. <br> <br>Anyway, this is my second font-making foray, and though it looks at first glance like a geometric sans serif, the curves and nuances on this one are decidedly un-geometric. <br> <br>My inspirations were the Canon EOS logo and Oban (from this forum).  I wanted to make something solid and modern to be usable as a substitute for overused fonts like Handel Gothic. <br> <br>At this point, I only have the capitals and numerals.  I'm dissatisfied with a few letters, particularly the W.  Any help is appreciated. <br> <br><img src="http://www.typophile.com/forums/messages/29/4793.gif" alt="Epoch version 0.1"> <br></p>
