    html: "<p>Paul, your Polish <i>ew</i> (Lslash) is pretty good: the bar crosses the stem at just the right height and has a really good length. I would probably increase the angle off the horizontal just a bit more though. Since you've done such a good job with this diacritic letter, I really encourage you to do the rest of the Polish letters and extend the languagre coverage for the central European, Baltic and Turkish character sets. I think you would have a lot of fun doing this, and would increase the value of the font.</p>"
