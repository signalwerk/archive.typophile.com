    html: <p><i>I wanted to make something solid and modern to be   <br>usable as a substitute for overused fonts like Handel Gothic.</i>  <br>  <br>This is an excellent goal, Paul. You're on your way to   <br>achieving it.  <br>  <br>Cristian is right about the 'Y'. But I recognize your problem -   <br>you were obviously trying to keep the middle bar consistent   <br>on the 'Y' and 'R'. But the higher bars on the 'A' 'B' 'E' work  <br>fine so there is room to raise it on the 'Y'. Or, are you   <br>opposed to a descender?  <br>  <br>Consistent widths is a definite issue here. In addition to  <br>Cristian's comments, I'll add that the 'J' seems too wide and  <br>the 'H' too narrow.  <br>  <br>The 'H' also feels too straight with the flat ends. I wonder if  <br>there's a way to give them an angle as on the 'A' and 'N'.   <br>See if you can make it happen without a Hobo effect. <br> <br>The 'B' and 'S' look fine to me.</p>
    html_clean: <p><i>I wanted to make something solid and modern to be   <br>usable as a substitute for overused fonts like Handel Gothic.</i>  <br>  <br>This is an excellent goal, Paul. You're on your way to   <br>achieving it.  <br>  <br>Cristian is right about the 'Y'. But I recognize your problem -   <br>you were obviously trying to keep the middle bar consistent   <br>on the 'Y' and 'R'. But the higher bars on the 'A' 'B' 'E' work  <br>fine so there is room to raise it on the 'Y'. Or, are you   <br>opposed to a descender?  <br>  <br>Consistent widths is a definite issue here. In addition to  <br>Cristian's comments, I'll add that the 'J' seems too wide and  <br>the 'H' too narrow.  <br>  <br>The 'H' also feels too straight with the flat ends. I wonder if  <br>there's a way to give them an angle as on the 'A' and 'N'.   <br>See if you can make it happen without a Hobo effect. <br> <br>The 'B' and 'S' look fine to me.</p>
