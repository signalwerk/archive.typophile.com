    html: "<p>Hey, great stuff. <br> <br>The glyphs that bother me are: <br>K - The join looks funny. Maybe you should stagger the arms. <br>M - Looks too stiff. <br>W - Too closed and narrow. <br>X - Same problem as the \"K\", plus too wide. <br>7 - Try making the spine like the \"2\". <br> <br>Accents: the tilde is too big, the rest too small. <br> <br>There's also some color issues, like the \"N\" is too dark, and the Section too light. <br> <br>The Pilcrow rules. As for the Yen, you should ask a Japanese guy, but it seems too cramped - maybe reduce the bowl, or use one bar. The Euro I think needs longer bars. <br> <br>Keep it up! <br> <br>hhp <br></p>"
    html_clean: "<p>Hey, great stuff. <br> <br>The glyphs that bother me are: <br>K - The join looks funny. Maybe you should stagger the arms. <br>M - Looks too stiff. <br>W - Too closed and narrow. <br>X - Same problem as the \"K\", plus too wide. <br>7 - Try making the spine like the \"2\". <br> <br>Accents: the tilde is too big, the rest too small. <br> <br>There's also some color issues, like the \"N\" is too dark, and the Section too light. <br> <br>The Pilcrow rules. As for the Yen, you should ask a Japanese guy, but it seems too cramped - maybe reduce the bowl, or use one bar. The Euro I think needs longer bars. <br> <br>Keep it up! <br> <br>hhp <br></p>"
