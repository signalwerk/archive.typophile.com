      <p>I got this in my mailbox today, please someone attend for me: (I hope Ray doesn't mind me posting this here)</p>
      <p>Subject: Mini-Newsletter Burst Angel Fireworks Display - Ray Fenwick</p>
      <p>Hi,</p>
      <p>As mentioned previously, my Library I show opens tonight here in Toronto. Yeah! </p>
      <p>If you don't live in Toronto, you won't be able to manhandle the books in person with white gloves (stop laughing this is serious), which is a shame. You can, however, view every single page of every book online, right here:</p>
      <p><a href="http://coandco.ca/ray/library/" title="http://coandco.ca/ray/library/">http://coandco.ca/ray/library/</a></p>
      <p>You can also see the companion letterpress print here:<br>
      <a href="http://www.flickr.com/photos/rayfenwick/3528684628/" title="http://www.flickr.com/photos/rayfenwick/3528684628/">http://www.flickr.com/photos/rayfenwick/3528684628/</a><br>
      <a href="http://www.flickr.com/photos/rayfenwick/3528684902/" title="http://www.flickr.com/photos/rayfenwick/3528684902/">http://www.flickr.com/photos/rayfenwick/3528684902/</a></p>
      <p>That's it. Maybe my least outrageous email yet. All business, except for the subject line. </p>
      <p>Oh, if you do live in Toronto, come to the opening tonight at 1086 Queen Street West. It starts at 6. The show is a double show, the space being shared with Brooklyn artist Sto. (<a href="http://www.stoishere.com/" title="http://www.stoishere.com/">http://www.stoishere.com/</a>)</p>
      <p>Talk to you soon,<br>
      Ray Fenwick and his Brand Management Team</p>
