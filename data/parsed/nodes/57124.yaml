    <p>I notice that there are many typophiles in Toronto. I will be making a short trip to Toronto after I graduate at in mid-May; I don't know if you ever get together out there, but I would welcome the opportunity to meet while I'm there. I will be there from about May 15 to 19. </p>
    <p>I haven't been in Toronto in several years, so I'm not sure where a good place to go is anymore. I remember I used to go with friends to a place called Pauper's on Bloor West. This might be a good place to meet. Anyone interested/available to get together in May?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/toronto_typophiles_6153.gif"></div><p></p>
