  html: |-
    <p>I came across some type samples of two (possibly unrelated) typefaces used in <a href="http://blog.modernmechanix.com/publication/?pubname=MechanicsAndHandicraft" rel="nofollow">Mechanics and Handicraft</a> circa 1936–38. It looks pretty Futura-like, but I'm most interested in identifying the italic (though that uppercase G in the Roman is really lovely...).</p>
    <p>Can anyone help with identification or some similar fonts/faces?</p>
