    html: <p>Given their age and the fact that they are logos, these are both very likely made with custom calligraphy, not fonts. You might like <a href="http://www.fontshop.com/fontlist/families/ballantines/?affid=99346" rel="nofollow">Ballantines</a>, <a href="http://new.myfonts.com/fonts/parachute/pf-champion-script-pro/?refby=typographica" rel="nofollow">PF Champion Script</a>, <a href="http://www.fontshop.com/fonts/downloads/elsnerflake/itc_edwardian_script_ot/?affid=99346" rel="nofollow">ITC Edwardian Script</a>, or <a href="http://www.fontshop.com/fonts/singles/urw/urw_polonaise_bold/?affid=99346" rel="nofollow">Polonaise</a>.</p>
