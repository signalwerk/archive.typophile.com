    html: |-
      <p>Yes, in fact there is JS necessary to control it.<br>
      First of all the site has to check if user is on Mac at all, otherwise the font will appear very very thin and broken. Second on animated scenes text blocks will need no transparency in its background otherwise they also will not show correctly while animated (f.e. transparency transition).<br>
      So it seems you are right but on the other hand I love the idea of getting fonts more and more readable on screen devices. And the sub-pixel rendering in my eyes is big progress.<br>
      Did you make some experiences with your work? I would love to discuss it and see your results.</p>
      <p>PS<br>
      I recently observed that, yet, the results of sub-pixel fonts are far more consistent for what regards cross browser. Interesting to me. Because grayscale anti-aliasing show great differences on some browsers. Google Chrome is best here, Safari worse ecc. Meanwhile the sp fonts look nearly the same everywhere.</p>
