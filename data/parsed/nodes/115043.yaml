    <p>I am still captured by adapting monitor fonts for sub-pixel rendered environment. Two pics from my font meant to work in small sizes and in negative use white on black ground. To create a version that is similar in weight to the original one has to do a very much lighter character design like the one above in this pic.<br>
    But it’s worth while because sub-pixel fonts look so much neater and better!<br>
    To see it „at work“ here is my credit page part of my homepage: <a class="freelinking external" href="http://www.stefanseifert.com/Contact.html" rel="nofollow">http://www.stefanseifert.com/Contact.html</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/sub-pixel_version_5553.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Sf41_sub-pixel_4217.png"></div><p></p>
