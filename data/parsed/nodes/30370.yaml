    html: |-
      <p>A Mac font suitcase (labeled FFIL in OS X) can have a large number of either TrueType or NFNT resources in it. An NFNT is a Mac bitmap font originally known as "screen fonts." With PostScript Type 1 fonts, you need for each font both an NFNT (which also contains the kerning and other info) and a separate PostScript outline font file (originally called "printer fonts").</p>
      <p>(Note: The font suitcase is actually a special kind of file called a <em>resource file</em>. These are structured differently than ordinary computer files, and in fact cannot be read on other operating systems such as Windows and UNIX.)</p>
      <p>So, it is possible to put a large font family into a single font suitcase. However, this only works with Mac TrueType fonts. With PostScript Type 1 fonts, you could do the same thing with the "screen fonts," but you would still need a separate file for the outline portion of the font. If your Helvetica Neue font were PostScript Type 1, it would need at minimum 53 files--one for the font suitcase plus 52 outline font files.</p>
      <p>You're right that OS 9 and earlier allowed you to move fonts in and out of font suitcases easily in the Finder, the same way you can move files in and out of folders. For some reason, this facility was not carried forward to OS X. I think some of the font management utilities have this ability, though.</p>
