    <p>Hi all,</p>
    <p>First post here, so be kind!</p>
    <p>I work at a contract publishers in London and we’re taking on new magazines by the bucketload at the moment. We’re about to start initial designs for an A5 travel publication, and I’m looking at headlines and complimenting body copy. I’m thinking sans serifs for both, although I’m not averse to having a secondary headline font which we can mix and match.</p>
    <p>The client has specified they like clean, smooth, smart, modern fonts, they have been impressed with some other publications of ours that use Bliss and Franklin Gothic. I’m a big fan of Din but am finding it difficult to match a body copy or a secondary serif headline.</p>
    <p>We’ve got a large library of fonts that have already been purchased, but the list is a bit out of date. if anyone can recommend some old classics or sources of any freebies/trial downloads, feel free!</p>
    <p>If you want to see some of our work, visit <a class="freelinking-external" href="http://www.absolutepublishing.com">our website</a>. The site isn’t up to much visually, but the printed work is nice!</p>
    <p>Look forward to your thoughts!</p>
    <p>Chris</p>
