      <p>Darden Studio has a number of faces that are getting a lot of play in publication design.<br>
      <a class="freelinking-external" href="http://www.dardenstudio.com/typefaces/">Darden Studio</a>. I’m diggin’ Jubilat.</p>
      <p>Font Bureau also seems to be releasing some of their custom pub faces for licensing.<br>
      <a class="freelinking-external" href="http://www.fontbureau.com/magazine/fonts/">Magazine Fonts</a>. Popular, and Boomer Sans and Serif are nice.</p>
      <p>Of course <a class="freelinking-external" href="http://christianschwartz.com/stag.shtml">Christian Schwartz</a> has designed a lot of great typefaces.<br>
      Stag, Stag Sans.</p>
      <p><a class="freelinking-external" href="http://www.vllg.com/fonts/">Village</a> has a lot of great faces available.</p>
      <p>For a general workhorse body copy typfaces I would recommend <a class="freelinking-external" href="http://www.fontbureau.com/fonts/Whitman">Whitman</a>.</p>
