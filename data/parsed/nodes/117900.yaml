      <p>When an apostrophe is used to indicate a glottal stop, that is regarded as a separate letter and thus not an accent mark. However, a transformation of a consonant could be indicated by an accent, such as palatalization, so if there is such a thing as glottalization...</p>
      <p>Ah, yes, Wikipedia tells me that glotallic consonants are represented with an apostrophe in the IPA.</p>
      <p>U+0315 was added to Unicode in version 1.1, and is a combining diacritical mark. But I can't find the original proposal for adding it to Unicode.</p>
