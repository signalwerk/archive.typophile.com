    html: <p>The glottal stop, when so signaled using one fairly common orthography, uses the "raised comma," U+02BC. But remember, that's just one orthography. In Polynesian, the glottal stop is signaled with the turned comma, U+02BB, as in Hawai‘i. And in some languages, the glottal stop itself is used.</p>
