    html: |-
      <blockquote><p>...is it intended to represent the alternate form of the haček found in pairs like Ď ~ ď?</p></blockquote>
      <p>Yes. U+0315 is provided for compatibility with visual encodings that handled e.g. ď with a separate character from the normal haček. It's mostly useful these days as a component glyph for use in making diacritic composites for Czech and Slovak glyph sets. Note that although nominally a combining mark it actually requires an advance width, so is not usually handled with GPOS dynamic mark positioning.</p>
