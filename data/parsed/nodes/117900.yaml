  html: |-
    <p>I'm wondering if anyone know the intended use of U+0315, called COMBINING COMMA ABOVE RIGHT. Is this glyph intended to be used to represent ejectives/implosives in languages which use an apostrophe to indicate glottalization, or is it intended to represent the alternate form of the haček found in pairs like Ď ~ ď? While the former will always resemble the apostrophe, the latter can differ significantly depending on typeface, so I'm wondering which form should ideally be used.</p>
    <p>André</p>
