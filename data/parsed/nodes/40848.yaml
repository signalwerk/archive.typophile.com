    <p>Hi,</p>
    <p>Does anyone have any suggestions for a typeface for use in a logo for a community called ’booze free’? Its for young(ish) ’hip’ people who want to live life without alcohol. One idea I had was to use a font popular with the brewery / alcohol industry in a subversive stylee ;-)</p>
    <p>any ideas?</p>
    <p>thanks,</p>
    <p>Luke.</p>
