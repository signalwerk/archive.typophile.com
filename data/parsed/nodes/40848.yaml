      <p>I don’t know that you will find a font so recognized as being associated with “booze” that it will work for you. An homage to a particular label would be more likely to work visually.</p>
      <p>What I don’t get, in general, is defining a group in relation to something they don’t participate in. By the time you’ve named the group, and then strapped the members with a mark that recalls some alcohol product it would seem that you’ve put an almost obsessive emphasis on something you don’t have in common and maybe don’t want to emphasize. </p>
      <p>There is a Pabst font that you might consider.</p>
