  html: |-
    <p>I just went through a horrendous experience -- I was trying to make a pdf of one of the magazine pages -- and it kept bombing out QuarkXPress (yep the latest 7.3) two hours of hair pulling.</p>
    <p>I finallly went into the ads on the page and found one that had used NuevaMM -- and there was the culprit.</p>
    <p>So I figure I'd write to you and maybe save you some bald spots -- and let you know that -- it isn't nice to give a busy person an ad with an MM font in it... LOL</p>
    <p>Happy to say, Photoshop has flattened the PDF - no one but you guys will know - and now I can get the work out to the printer. You think I'm a little late? My September/October issue - which should be in folks hands right now -- will be uploaded to the printer...</p>
    <p>Whew and Good-night Grace.</p>
  html_clean: |-
