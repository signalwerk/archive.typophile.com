    html: |-
      <p>I keep a G3 around with OS 9.2.2 to make MM instances, and actually, to do most of my modification work in Fontographer and FontLab. The trick I've learned to port them over to anything that works on OS X is to compress them with Stuffit. If not, OS X rips out the resource forks. If so, when opened up in OS X, oh looky here, a PS1 font, how quaint.</p>
      <p>Typographically though, doesn't matter the format, good type is good type, doesn't matter if it originated in 1452 or 2007.</p>
      <p>Gerald</p>
