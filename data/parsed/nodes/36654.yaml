      <p>If I remember correctly Illustrator CS1 still had MM support with the palette that allowed you to alter them.</p>
      <p>And once it was altered those instances were available in the other Adobe CS1 programs.</p>
      <p>At the same time they included Myriad Pro, Nueva Pro and Minion Pro (perhaps others) in the CS1 release to ease the pain of MM dying. Myriad Pro does it pretty proficiently but certainly Nueva Pro was a less substantial release.</p>
      <p>At the time I was involved in a multi-year project that had Myriad MM specified for the identity. I was able to transition to Myriad Pro thanks to the free release of Myriad Pro with CS1. So thanks Adobe.</p>
      <p>Although I do miss MM - it seemed like a very good idea at the time…</p>
      <p>pbc</p>
