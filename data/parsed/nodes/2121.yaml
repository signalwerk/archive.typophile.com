      <p><img src="http://www.typophile.com/forums/messages/72/20768.gif" alt=""> <br> <br><img src="http://www.typophile.com/forums/messages/72/20769.jpg" alt=""> <br> <br><b>Fulfill your fine font craving with a FontFont Library CD</b> <br> <br>FSI FontShop International has lowered the price on the  <br>FontFont Library, giving struggling design firms what they  <br>need during hard times: more affordable font licensing. <br> <br>Do the math: <br>$12,900 / 2,442 typefaces = $5.28 per typeface. <br>$5.28 per typeface / 20 CPUs = 26 cents per typeface, per user. <br> <br>The new FF Library CD includes the entire FontFont Library </p>
