    html: <p>Hi Sam! Sorry I didn't have time to help you  <br>earlier on. That's why I quickly posted the link  <br>to the typewriters thread so you could already  <br>take a look for yourself. Now that I've had the  <br>chance to double-check the Vintage Type samples,  <br>it dawned on me that my previous post proved to  <br>be pretty pointless <i>(howzat for an alliteration? ;) )</i>.  <br> <br>I hoped you would find a match amongst them, but  <br>alas, no such luck. There must be more worn-out  <br>typewriter fonts, but once we get off the beaten  <br>path and enter the realm of free/shareware, it gets  <br>a lot tougher to locate the goods. <br> <br>Let's hope somebody else recognizes your sample...</p>
