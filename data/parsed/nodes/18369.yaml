      <p>I think it would be fair to say that at this stage your VI is heading in a very ’corporate’ direction. Is this something that you are seeking?</p>
      <p>You have some spacing issues which could be better resolved. The graphic in the first two ideations is floating and unattached to the type - there is a lack of unity forming here. Perhaps the type would fit better if the first line ’fityourmind’ almost slotted into the concave side of the graphic. The spacing of ’fit’ compared to ’yourmind’ is also somewhat uneasy due to its spacing. I would remove the space after the word ’fit’.</p>
      <p>The first option has somewhat more dynamics and horizontal movement making it feel slightly more energetic for a fitness trainer. </p>
      <p>I don’t feel that the third option is working particularly well. It feels very static, and spatially the ’colour’ of the negative and positive is unresolved.</p>
      <p>I hope this feedback has not been too negative and that my thoughts are of assistance. Good luck.</p>
      <p>-nic</p>
