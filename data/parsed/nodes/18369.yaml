    html: <p>You need to review the concept of the name itself. It makes no sense, its like an inside joke. The shapes make no sense for a retail audience and the colors are dead. Try this, make Personal Training Solutions the main focus and make the name small like a subhead. That way the average consumer will know what the business is about and then the name. This would also allow you to make a mark that emphsises “personal”</p>
