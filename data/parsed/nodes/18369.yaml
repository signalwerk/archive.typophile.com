    <p>Hi, i need some help on this logo im doing for a Fitness club named Fit yourmind<br>
    The moto ive been sticking to is either the idea of fitting into a certain box which is “yourmind”,<br>
    in other words, the ideia of working your body.<br>
    The other concept, the one used on both the 1st and the 2nd logo is the “mold” idea, stretching<br>
    your body applying movement to it in order to accomplish that same goal.</p>
    <p>The Type has a light and condensed feel, and i think it fits ok into the fitness whole idea.</p>
    <p>About the color, i’m gonna apply some light blue on both the logo and the word Fit.<br>
    Anyway, they’r still in gray scale.</p>
    <p>Thanks in advance</p>
