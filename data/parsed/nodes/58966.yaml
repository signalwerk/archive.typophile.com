      <p>Thanks for the vote of support!</p>
      <p>Yes my company knows I’m a font geek! Maybe that’s part of the difficulty because I don’t want to sound picky about something nobody else really notices. And if I was the designer I’d hate the client to jump into my territory.</p>
      <p>Illustration/logo stuff is not something I can do so I chose to get the agency involved. I really like their logo and the type is passable, I’m just not sold on the idea of the friendly rounded thing and the execution is slightly spotty (no optical correction).</p>
      <p>I suppose I could have a go, but there are nine or ten glyphs to create and I don’t know if I can do the right ’mood’ of font in the time given (a couple of weeks before our 2010 brochure gets finalised). I’ll have a go of course but I was really looking for a ready-made font or any opinions whether roundy ones are passé or appropriate. We are a whole lot more personal/organic/unique than Xerox!</p>
