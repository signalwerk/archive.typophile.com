    <p>Hello Typophiles,</p>
    <p>We’re having a new logo designed by a local agency and they’ve chosen to put our company name in a custom rounded sans. They said all the stuff you’d expect about a friendly, approachable, modern tone. I wasn’t immediately sold on the idea since many companies these days are opting for roundy sans serif fonts (like Xerox using FS Albert). </p>
    <p>So I got to thinking well hey maybe they’re right to choose this kind of font, even if everyone else is trying to be personable and informal, why shouldn’t we too?</p>
    <p>Anyway my two questions are:</p>
    <p>1   What fonts would you recommend that are slightly rounded, with simple shapes and a one-storey a? The company name is IMA International and I think they’re going to set it with the ima in lowercase and the INTERNATIONAL in uppercase below it.</p>
    <p>2   Am I over-worrying about choosing a style that seems to be everywhere or should I be happy that this kind of font does in fact represent our company values?</p>
    <p>As always, I look forward to anyone’s suggestions.</p>
    <p>Thanks :)</p>
    <p>PS Can’t post an image of their home-made type currently but will try to get the pdf from them.</p>
