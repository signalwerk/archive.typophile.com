    html: <p>Start with a pencil. <br>Scan your drawings. <br>Auto trace with Adobe Streamline or Fontscan. <br>Clean up in Illustrator or Freehand. <br>Copy and paste into Fontlab. <br>Work on shapes some more. <br>Space. <br>Kern. <br>Read the manual. <br>Good luck. <br> <br>-smc</p>
