    html: <p>All of the above seems true. There are good arguments for all these points. Everyone finds their own way that works best for them.  <br> <br>I think, as a beginner, drawing has more freedom and can help to identify clear objectives about what one may want out their design. Experienced designers might be able to draw directly on the computer because they know where points should land after having placed thousands of them. The beginner does not have this in their arsenal yet. So I still see scanning as a good way to start even if it is necessary to interpret these to accommodate for scanner distortion.  <br> <br>Is is necessary to draw every character perfectly before moving to the computer? No. But but defining clear characteristics of your design does seem important to me. After these characteristics, such as a serif for example, are discovered, defined, whatever it is easy to copy and paste these in the computer from glyph to glyph. But do not do this for everything. You don't want your "m" to be two "n"s stuck together. <br> <br>Henriko, however you start, start with the words "hamburefonts" or "handgloves".  <br> <br>Start with lowercase then move to the uppercase. <br> <br>-smc <br></p>
