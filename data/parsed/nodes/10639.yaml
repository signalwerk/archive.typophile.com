    html: <p>O.K. lots of people are going to disagree with me now, but anyway....  <br>  <br>I think a fundamental understanding of writing is needed before one can begin to design typefaces. Writing, whether with a calligraphic pen or other tools help establishing a kinesthetic understanding, or, a feel for proportions and flow. Writing with a broad-edge pen will help you to appreciate the principles behind thick-thin transitions, which is essential for designing serifed text faces. A good writing manual would certainly help. Edward Johnston's <i>Writing and illuminating, and lettering</i> might be a good place to start, or Gerrit Noordzij's <i>Stoke of the pen</i>, or other good calligraphy books. After getting to grips with the principles of writing, lettering could follow. Lettering could be seen as a liberation from writing, to free oneself from the bounds of the writing instrument, but still retaining a strong tie with the fundamental principles of writing. Experimentations and explorations could then follow. <br>  <br>FontLab is a very sophisticated piece of software for making cutting-edge digital faces, but as a design tool it's a bit counter-intuitive. I prefer working out ideas on paper first, scan it and take it from there.  <br>  <br>Of course I haven't talked about spacing and kerning yet! I have no idea... I just do it by eye. But I think I did learn a lot about spacing from doing calligraphy (again, I think it's a kinesthetic thing) and rubbing down Letraset! Oh yeah, look at Walter Tracy's <i>Letters of Credit</i>. Also <i>Twentieth century type designers</i> by Sebastian Carter will give you a lot of insights about how different type designers work and give you lots of inspiration!  <br>  <br>Hope this helps. Gook luck!</p>
