    html: "<p><i>Adding to my first post I would like to state that the more finished your drawings are from the start are the easier your life will be when you import them to a digital format.</i> <br> <br>This depends on how you intend to 'import' them to a digital format. I gave up on scanners several years ago, when I discovered that even quite expensive ones introduce distortions by compressing or expanding in one direction. These days, if I draw on paper at all, I only make rough drawings to get the shape down: then I prop the drawing beside my screen and use it as a visual guide to create the shape on the computer. It was only after I had been doing this for a couple of years that I read a comment by Hermann Zapf regarding the kind of drawings he prepared for a manual punchcutter, as contrasted with those prepared for industrial production. The drawings for industrial production needed to be very clean and precise, because the individual operating the pantograph, camera, Ikarus tablet or scanner (depending on the era) was neither qualified nor expected to <i>interpret</i> the design, only to reproduce it as exactly as possible. A good punchcutter, however, is an expert interpreter: able to take a designer's quite rough drawing and create a workable typeface from it, glyph by glyph, on the end of little pieces of steel. As a result, Zapf says his drawings for the brilliant punchcutter August Rosenberger, with whom he worked for many years, were much rougher than he needed to produce for mechanical production. I believe the same is true in digital type design, especially when one is making one's own outlines: it is not necessary to produce perfect drawings if one develops the ability to interpret rough drawings directly with the computer tools.</p>"
