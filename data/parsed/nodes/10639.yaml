  html: <p>Hi forumpeople, <br>I've recently bought FontLab 4.0 because of some good recomendations from other typophiles...  <br>But the thing is that I don't have a f*ckin' clue where to begin!! <br> <br>Can someone give some rookie-tutorials or just some hints to get me started ? <br> <br>I would really like to make my own sans-font. <br> <br>Thanks in advance <br> <br>/Henriko</p>
