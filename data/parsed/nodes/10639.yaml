    html: '<p>All of these are great suggestions Henriko. I would have to add that in my case, the lettering and calligraphy classes that I have been taking have added to my creativity and understanding of some letter forms. I am happy I have taken them. <br> <br>Adding to my first post I would like to state that the more finished your drawings are from the start are the easier your life will  be when you import them to a digital format. ( I should note on the contrary however that many designers never touch pencils. ) <br> <br>Another good book to take a look at would be <a href="http://www.amazon.com/exec/obidos/ASIN/0907259065/qid%3D1046881964/sr%3D11-1/ref%3Dsr%5F11%5F1/002-2435857-0064834#product-details"> Counterpunch: Making Type in the Sixteenth Century, Designing Typefaces Now</a>. <br> <br>-smc</p>'
