    html: <p>John, I design most of everything directly on screen generally without any sources on paper. <br> <br>But, my point is sometimes, some style can't be achieved directly on screen, you will lost too much time. I refer to "Script" forms who imitate writing and so on, generally all fancy lettering stuff. Just try to draw directly on screen something like Zapfino, ex Ponto, Sanvito, Caflish Script... <br> <br>The best, is to know perfectly the limitations of the tools you use (because you know them), and use the most adapted to your whishes rather than trying to do something with a tool who make your life more complicate. <br> <br>To comeback to non experienced designers. Generally is more easy to separate the learning of B</p>
