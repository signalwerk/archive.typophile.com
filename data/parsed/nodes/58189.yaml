  html: |-
    <p>A cousin of Galette, Tertre derives its inspiration from the French signage tradition. It is a display typeface with a wide range of applications from signage to menus and pricelists, branding and packaging or publishing. It is named after Place du Tertre, a square located at the top of Montmartre—a hill overlooking Paris, made famous by the artists of the 19th and 20th Century.<br>
    Alternate capitals with Art Nouveau flavor are provided, as well as Central European, Baltic and Turkish language support.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/tertre1_6163.png"></div><p></p>
    <p>Now available from <a href="http://new.myfonts.com/fonts/paragraph/tertre/">MyFonts</a>. A PDF sample <a href="http://www.paragraph.com.au/images/fonts/tertre.pdf">here</a>.</p>
