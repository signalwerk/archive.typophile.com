    html: <p>1. If you have large solid areas, always add a varnish -- metallics pick up fingermarks far more easily. (Think of  aluminum fridge doors..) <br> <br>2. Type knocked out of a metallic works far better than surprinting (in other words, the reader's situation is usually with the metallic reflecting a darker part of their environment, so metallics appear dark in usage). In particular, surprinting fine black type on a solid metallic is a bad idea, as it doesn "sit" very well on the surface. <br> <br>3. Always use coated stock -- uncoated can look ghastly. <br> <br>4. Straight silver can look a little uneven (it tends to pick up the slightest unevenness in the paper stock) -- splurge on the "mixed metallics" pantone book, and try some subtler effects -- more like "pewter".</p>
