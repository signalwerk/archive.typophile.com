    html: <p>Weight and quality of paperstock is criticial when using metallics. <br> <br>You need to be aware that metallics have a greater degree of opacity than standard inks. As a result, on lightweight or low-grade paper stocks the will tend to show through on the reverse side of the paper or even bleed through the paper itself. <br> <br>Your printer will generally advise on the minimum grade of paperstock you should be using.</p>
