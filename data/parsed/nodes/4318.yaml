    html: <p>"<i>3. Always use coated stock -- uncoated can look ghastly."</i> <br> <br>I think this is not as clear cut as it might seem. If you choose the right uncoated stock, you can mute the reflective quality for a more subtle effect (I've done this). However, for what you want to do, I'd agree with Nick.</p>
