    html: <p>Christos, <br> <br>The Pantone web site has some very good information on metallic  colours used in printing. Follow the links on this page.  <br><a href="http://www.pantone.com/products/products.asp?idSubArea=0&amp;idArea=1&amp;idProduct=316&amp;idArticleType_Products=0&amp;ShowNav=23" target="_blank">http://www.pantone.com/products/products.asp?idSubArea=0&amp;idArea=1&amp;idProduct=316&amp;idArticleType_Products=0&amp;ShowNav=23</a> <br> <br>You should also talk to your printer about what you want to do. <br> <br>gln</p>
