  html: <p>Hello <br> <br>i am preparing a broshure where i use 3 colors. Propably it will be 158 CV (orange), 539 CV (Dark Blue) and the metallic silver 877. I want to make compinations with those colors and also to use the silver 877 in tints to get tones in a picture.  <br> <br>I would appreciate it if you could give me any tips about printing metallic colors. <br> <br>christos</p>
