    <p>Hello Everybody!<br>
    I'm making polytonic greek in my font and thinking of small caps. In Greek fonts I saw monotonic small caps only, but Adobe Arno Pro has polytonic small capitals. I wonder if there a need for polytonic small caps? Does anybody in Greece use Arno Pro's ones? And if there other fonts that have it? Is it worth doing in a venetian typeface?<br>
    Thank you in advance!</p>
