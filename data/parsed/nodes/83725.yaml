      <p>When Greek ligatures fell out of fashion in the 19th Century, some people made an effort to document them for the benefit of typesetters who may be called upon to re-set Greek text that featured ligatures. So if you look at e.g. William Savage's <em>Dictionary of the art of printing</em> (1841) you will find a table of Greek ligatures with corresponding unligated forms (pp.300-301). I have a reprint edition of this book from 1966. There is a similar but shorter table in Théotiste Lefevre's <em>Guide pratique du compositeur et de l'imprimeur typographes</em> (1855; reprinted 1999).</p>
      <p>I strongly recommend that you take a look at Enschedé and Carter's <em>Typefounddries in the Netherlands,</em> which contains tables of two different sizes of Granjon Greek types with somewhat different ligature sets. These are important. What I find interesting is that the smaller size type has more ligatures that the larger size. Having looked at the way in which these different sizes were used in books, I've come to the conclusion that the ligatures were valued for space saving, and hence there are more of them in the smaller font that was used for foot and marginal notes in tight spaces.</p>
      <p><em>And do i understand right that there is an accent over the last letter in the diphthong ligature like in an unconnected diphthong pair? Does it mean that all the unconnected letters and letter pairs with accents keep their accents when they are in ligatures too?</em></p>
      <p>Yes. Ligation never suppresses accents. Note that some combinations of letters have more than one possible ligature form, and some forms are better suited to carrying accents than others.</p>
