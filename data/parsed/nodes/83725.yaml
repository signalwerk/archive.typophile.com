      <p>I'm inclined to say "go for it". Since polytonic Greek accents are used with ordinary capital letters, then, if small capitals are used in Greek text written in a polytonic fashion, it would seem as though it would be unnatural for the accents not to be available there.</p>
      <p>The only question remaining, though, is if small capitals are used in Greek typography at all. <em>That</em>, to me, would be the only issue. If Greek typography does not make use of small capitals, then having them in a Greek typeface is not really appropriate.</p>
      <p>But if small capitals have a place, since polytonic script is actually in fairly common use even now, despite not being the normal standard for modern texts, I would think that providing the accents for the small capitals is a very sensible thing to do.</p>
