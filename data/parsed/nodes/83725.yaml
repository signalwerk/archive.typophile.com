    html: <p>Basically, in any of those pairs if there is <em>any</em> mark on the first letter, then the second letter should get a dialytika when the mark is suppressed in all-caps/smallcaps. Since the convention of Greek diphthongs is that the marks are always written on the second letter, you know that if the mark is written on the first then you are dealing with something other than a diphthong, so the dialytika will apply. If you've got your monotonic  lookup working with the tonos, then it should be simple to extend the context to cover the other marks.</p>
