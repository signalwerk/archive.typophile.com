      <p><em>And how should it work for a situation when a user switches off calt to get all-caps or small caps setting with accents: should the accents stay the same (i mean without any contextual alternates) or should dialityka also be added for Iota and Upsilon (maybe by switching on some stylistic set) in the pairs like in calt?</em></p>
      <p>No, you don't need the dialytika in this situation, because the presence of the marks on the first vowel letter is sufficient to indicate that the pair is not a diphthong. The dialytika is only necessary when the other marks have disappeared.</p>
      <p>Ligatures is a whole new topic. Basically, you have three options:</p>
      <p>1. create ligature glyphs that include marks and have these form for sequences of letters and marks;</p>
      <p>2. allow letter ligatures to form regardless of the presence of a mark (set the OTL lookup process marks flag to NONE) and then apply marks to component letters of a ligature using GPOS anchor attachments;</p>
      <p>3. prevent letter ligature formation when marks are involved (set the OTL lookup process marks flag to ALL; probably also include post-sequence mark context to prevent ligation, although you could take a following mark and position it on the last component or above a diphthong ligature such as the traditional omicron_upsilon form).</p>
      <p>Note that any combination of these options could be used in a font. For example, you may find that some horizontally laid out ligatures will adapt well to approach 1 or 2, while some of the funkier Byzantine ligatures like the omicron_sigma really can't and should not form when marks are involved.</p>
