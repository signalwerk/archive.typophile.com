    html: |-
      <p>I've made them, and will continue to do so. Smallcaps have been used at times to emulate square uncial letters in the transcription of ancient manuscripts.</p>
      <p>With regard to Andreas' comment re. dropping of accent and breathing marks in all-caps (and hence smallcaps) settings, it should be noted that this is a recent convention. If you look at Greek language publishing from before the mid-19th Century, you'll see plenty of all-cap settings with marks in place <em>above the letters.</em> The placement of marks to the left of uppercase letters in mixed case, which led to their being dropped in all-caps, is also a recent development. It is the modern standard, but I've yet to find examples of it prior to the 19th Century; prior to that, marks were placed above capitals (the Byzantine norm), or even to the right of them in widely spaced all-caps settings.</p>
      <p>It should also be noted that the rules for marks in all-caps settings according to the modern convention is not so straightforward as simply removing them all, because there are circumstances in which a dialytika must be <em>added</em> to a cap Iota or Ypsilon to preserve correct vowel pronunciation.</p>
