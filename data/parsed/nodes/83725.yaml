      <p>Given that the convention for diphthongs is that any mark sits on the second letter, then I think it makes sense that if the mark -- even a breathing mark -- is on the first letter than this is not a diphthong, so the dialytika would apply.</p>
      <p>Yes, re. the mute iota. Some typefaces use a slightly shorter ‘prosgegrammeni’ (adscript iota) for allcaps and smallcaps, but that is a stylistic choice.</p>
