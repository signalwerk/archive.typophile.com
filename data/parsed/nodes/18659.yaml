    html: <p>whew! I think i figgered it out. i guess i was opperating under the dangerous assumption that FLab was doing everything for me, but the aalt feature seems to be the culprit. I assumed that this was built automatically by FontLab (and it seems that it is) as all i had to do to fix the problem was to write the aalt feature manually, including all the other substitution features.</p>
