  html: |-
    <p>Greetings fellow Typophiles,</p>
    <p>I am currently compiling a comprehensive survey of the career of Chicago lettering artist and type designer Oswald Cooper, designer of Cooper Black, for publication in an upcoming issue of IDEA Magazine. I am currently on the hunt to photograph rare pieces of Cooper's work that is neither in the Newberry Library's collection of Cooper's work nor in the lone monograph of his work, The Book of Oz. </p>
    <p>If you reside in North America and have a rare piece of Cooper's work that you are willing to share, I will be traveling through the U.S. and Canada at the end of the summer to photograph and document what work of Cooper's that folks are interested in sharing.</p>
    <p>Thanks for bending an ear.</p>
    <p>Best,<br>
    Ian Lynam<br>
    <a href="http://ianlynam.com" title="http://ianlynam.com">http://ianlynam.com</a></p>
