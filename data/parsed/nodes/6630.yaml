    html: <p>Tony, Is this from a professional sports team? <br> <br>If so that would explain (probably) why no one has ID'd it. Most pro team logos and lettering are custom font designs and may only have been lettered for those words, without necessarily developing a complete font. <br> <br>Let's see if anyone else knows, but that might explain the slow thread.</p>
