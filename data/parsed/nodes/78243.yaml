      <p>Keeping in mind that once monitors exceed ~300 PPI resolution will no longer be a significant concern. <a href="http://en.wikipedia.org/wiki/Visual_angle" rel="nofollow">Visual angle</a> will.</p>
      <p><a href="http://prometheus.med.utah.edu/~bwjones/2010/06/apple-retina-display/" title="http://prometheus.med.utah.edu/~bwjones/2010/06/apple-retina-display/">http://prometheus.med.utah.edu/~bwjones/2010/06/apple-retina-display/</a></p>
      <p>and</p>
      <p>Curcio, C. A., Sloan, K. R., Kalina, R. E. &amp; Hendrickson, A. E. (1990). Human photoreceptor topography. <em>Journal of Comparative Neurology</em>. 292, 497-523.</p>
