      <p>I just did a bit of scouting on Typekit's excellent new "paragraph" subdivision, and if you're looking for good text from there you just have to be a bit selective... or, two people can have completely different experiences/opinions browsing the same fonts, your choices.</p>
      <p>Nearly all the families in the&nbsp;subdivision&nbsp;have four styles that can do the job, with the rest being arguably a matter of taste.&nbsp;In the Adobe fonts e.g., in the selection of a regular weight, e.g., test Garamond Premier, over Adobe Garamond Pro.&nbsp;</p>
      <p>In the case of 6 to 8 style families, you need to avoid the lightest weight. In larger families you have to avoid the two or three lightest weights. These example choices are about survival of the roman weight in all windows browser shots you may wish to try.</p>
      <p>Now arise web typographers to your posts and no bickering! Bold and italic cross platform-safe selections await thee on lots of sites.;)</p>
