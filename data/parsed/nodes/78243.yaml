      <p>I killed a couple of weeks on just that.</p>
      <p>I went through pretty much all Sans fonts on WebFonts, WebType, WebInk, FontSpring/FontSquirrel, FontsLive, FontDeck and TypeKit. There is some overlap, but ultimately the choice for 11-13px text sizes is very limited. I was testing on Windows XP as you did, but with ClearType on. My take on this is that I will detect the lack of ClearType smoothing on the client and provide a safe fallback font like Verdana.</p>
      <p>In any case, here's the list:</p>
      <p>WebType:</p>
      <p>* Droid Sans<br>
      * Franklin Gothic<br>
      * Calibri<br>
      * News Gothic</p>
      <p>FontsLive:</p>
      <p>* Segoe UI<br>
      * Miramonte Pro</p>
      <p>WebInk:<br>
      * URW Grotesk Light<br>
      * Proxima Nova<br>
      * Tondo Light</p>
      <p>Also Delicious by Exjlibris.</p>
      <p>--</p>
      <p>FontShop has some nice ones (FF Scala Sans Web, FF Dagny Web Pro, FF Meta Web), <strong>but</strong> they only sell .woff and .eot (meaning no support for Firefox 3.x, which is a very big deal). They also would tell you they have an arrangement with TypeKit to host a font if you buy it from them. What they do NOT tell you right away is that you will need to get a paid TypeKit account -or- to display a TypeKit badge on your website. Sneaky.</p>
      <p>--</p>
      <p>In the end and after much deliberation I went with Calibri.</p>
