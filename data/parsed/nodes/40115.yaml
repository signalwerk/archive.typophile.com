    <p>Hi! I’m trying to make a new year’s card using the olympic rings to spell 2008.</p>
    <p>I’m looking for a font where the number 2 makes the first (blue) circle and the 2 last rings (red-green) make up the 8.</p>
    <p>It should look a bit like this</p>
    <p><a class="freelinking-external" href="https://web.archive.org/web/20080511151704/http://img90.imageshack.us/img90/8121/2008pi4.png">http://img90.imageshack.us/img90/8121/2008pi4.png</a></p>
    <p>Does anybody know about a font with a ’2’ like that?</p>
    <p>If there are any ideas out there on how to connect the red and green rings to make the 8 mor obvious, those are welcome too!</p>
    <p>TIA</p>
    <p>Peter</p>
