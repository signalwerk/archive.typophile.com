      <p>Take classes in formal calligraphy.<br>
      Firstly, basic exercises tighten up your form and give it a pleasing consistency.<br>
      Secondly, the joining rules turn writing into an intriguing game, because when it comes to writing an unusual word, or one that requires "notwithstanding" sub-rules, writing then becomes a process where the writer is trying to implement the rules correctly, and this engagement can impart an expressive personality to the writing. Or else it turns into a very "proper" style -- but either way it's an improvement.</p>
    html_clean: |-
