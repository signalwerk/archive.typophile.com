      <p>Lorenza makes a good point with her second question, somehow the aesthetic aspect of an handwriting expresses the relation between what its author innerly is and how he/she presents him/her self to others, how he/she would like to be treated and considered by them.<br>
      The graphic and plastic expression (a gesture is a sign that leaves traces in the memory and the actual sign is the visible trace of the gesture and it keeps the energy) is linked——rather than to an aesthetic sensibility——to a motional-sense form of the knowledge, towards the goal of giving a tangible consistence to the development of the inner side of man.<br>
      When the inner wealth, most of all, the creative wealth, goes together with an adeguate way of expression, there comes the harmony between the ideas and their happening.</p>
