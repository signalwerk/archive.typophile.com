      <p>What Hrant calls "faux type", we used to call type indication in the years before computers came to design. When you did a layout for a client to approve (before a job was sent out for typesetting), you drew the letters matching the typeface.  We got good at it too. Eight hours a day for 20 years will do that! :-)</p>
