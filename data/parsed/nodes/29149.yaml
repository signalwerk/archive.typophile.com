      <p>Good pen –&nbsp;not necessarily expensive just comfortable to hold and well balanced, bic biros are good for me, a gel version even better.<br>
      Don't hold it too near the tip, and don't lean too far forward, I find that when I am doing calligraphy I tend to move more from the elbow and keep the wrist steady but not tense.<br>
      Tim</p>
