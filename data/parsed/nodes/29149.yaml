      <p>Are you sure yourhandwriting really sucks? In which way? Can you show us a sample? Please?<br>
      I always think my handwriting sucks but some people love it for some weird reason.<br>
      I think maybe the problem is your hand. If you make only limited exercise with your hand (like repetitive movements typical of people that use computer all day) it tends to get rigid. If your hand is more flexible and relaxed it might improve the way you hold your pen and it may reflect on your handwriting. Try to play the piano or something. </p>
      <p>Trust me: I'm a doctor.</p>
