  html: |-
    <p>Hello everyone, i'am new to this site, i need some help on FontLab Studio, i and a friend just finished designing a typo on illustrator, and we are looking to export it as otf and ttf, i copied/pasted all my vectors, and when i try to generate the font it displays an open contours warning, our typography is based on a complex grid with lots of crossing vectors, there is always a circle in front of or in the letter.<br>
    When it exports, a weird F symbol appears on nearly every letter.</p>
    <p>Thank you in advance,</p>
    <p>Arthur</p>
