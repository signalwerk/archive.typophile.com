    html: |-
      <p>In addition to the "F" problem...</p>
      <p>Illustrator allows line segments and stray points to be scattered around, which works fine for most things that most people use Illustrator to do. Making a font, however, means adhering to a few more exacting expectations, like clean, closed contours that define filled shapes. FontLab has a few features that help facilitate clean-up chores under the Contour menu heading. If all your glyphs are riddled with these sorts of issues, though, you might have a job ahead of you that will require a large degree of manual fixing.</p>
