      <p>Bill, I sure agree with you about the 12x12 format. I am fortunate enough to have a very good stereo (part of my work is in the audio industry) and many, many LPs. The pleasure of sitting and reading liner notes while listening is such a comfort, and I have learned so much about music while doing this. The sense of comfort and edification is so absent when one holds a little 5x5 CD booklet.</p>
      <p>Paul, I still remember vividly the first time I heard <em>Terry Riley in C</em> when a friend lent me his record in 1970. Amazing how the music would have a certain mass and texture as all the musicians were momentarily making a certain set of notes, and then as soon as just one musician decided to go to the next figure, the entire personality of the music changed! Really fascinating and wonderful stuff.</p>
      <p>(For those of you who don’t know this piece, a small ensemble plays a series of figures [Is that what Riley called them? I think so.], really just a measure of notes. Each musician can start the figure whenever he/she wants, and plays it for as long as she/he feels like playing it. The rhythmic ins and outs and melodic echoes are fabulous. Probably not what you would put on to snuggle up to the Literary Lass on Nick’s album cover, though, unless she’s reading Ionesco or Apollinaire . . .)</p>
    html_clean: |-
