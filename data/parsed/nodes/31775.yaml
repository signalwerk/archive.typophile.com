      <p>Yes, Chet fan indeed. Of the many albums of his that I own, my favorite is <em>Let’s Get Lost,</em> (Novus label, 1989) from the very end of his life. It’s the soundtrack for a Baker documentary made by Bruce Weber. What I adore about Baker is his vulnerability, hesitation, the charged spaces between the notes. Miles is always penetrating and questioning, but in a more confident and definite way. Baker leaves more room for me to enter the conversation and feel my way around in there, whereas Miles leaves me more on the sidelines watching. Does that make any sense? Evans does this, too, in spades.</p>
      <p>The early recordings done by Baker and Mulligan out west in the early 50s are also most enjoyable. </p>
      <p>What a tragedy that drugs took such strangleholds on people like Baker, Bird, Anita O’Day, Evans. And yet ironically, many of the performances that we treasure were done while they were high as kites (O’Day’s performance during <em>Jazz on a Summer’s Day</em> for example).</p>
      <p>I like that Baker manages to speak so often with a lighter touch, the way foundry Diotima sits very delicately but solidly on a page. (There, on topic!)</p>
