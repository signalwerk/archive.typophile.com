      <p>(at the risk of drifting off-topic)</p>
      <p>James/Jim mentions <em>Waltz for Debby</em> which happens to be my all-time favorite jazz record. And Bill Evans my favorite musician in any genre. Which leads me to this: I just ordered a copy of Stephen Anderson’s <em>Remembering the Rain: The Music of Bill Evans</em> and it is superb. Gentle electric guitar (Gibson), very liquid-sounding, and wonderful. Very much in the same vein as Joe Diorio’s <em>To Jobim with love</em> of a few years ago. The Anderson CD is available direct from the publisher (<a href="http://www.artofliferecords.com" title="http://www.artofliferecords.com">http://www.artofliferecords.com</a>). Very, very nice for anyone who cares deeply about Bill Evans’s music. </p>
      <p>I wish I could give you guys a link for the equally fabulous Diorio disk but it’s on a very obscure Italian label (RAM RMCD4529, released 1995) and even when I was working as a music reviewer and thus had inside connections, it still took me months to actually buy and receive a copy. Maybe someone highly motivated could find it used.</p>
      <p>Finally, for any fan of Jobim’s music — in my view, the George Gershwin of Brasil — I think Morelenbaum2/Sakamoto’s <em>Casa</em> is a must-have. It doesn’t say this in the liner notes, but the album was recorded at Jobim’s beach house, using the piano on which he composed all of his wonderful tunes. Core musicians are piano, cello and voice (female, alto) with other musicians in places on viola, percussion. Spare, swinging, open, dreamy, languid, transcendent!</p>
    html_clean: |-
