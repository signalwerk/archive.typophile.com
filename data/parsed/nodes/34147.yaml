    <p>Hello all,<br>
    I'm trying to make a typeface which has GREEK historical references for the municipality of my town in Sicily. But it has to be practical as opposed to decorative.</p>
    <p>Does anyone know of any existing fonts that look greek-ish yet modern? And that include lowercase chars? I'm just looking for inspiration and haven't found anything interesting.</p>
    <p>Thanks for any suggestions.</p>
    <p>J</p>
