      <p>Mark and hrant, I don't quite understand what you are relating. An outlined (vector) font should scale up perfectly. I don't see that with Mark's showing. That looks exactly like a pixel font enlarged in a non-vector program. </p>
      <p>Any program that does not understand vector will create a fuzzy image. Therefore, create the image in a vector-based program first. Then convert to the pixel-based program. In that way, you can not go wrong.</p>
