      <p>Bitmap fonts (pixelfont or "hard") continue to flourish exactly because outline fonts do have rasterization problems. Essentially, outline fonts are a convenience, and are mismatched to the way they end up being rendered. In print the resolution is simply high enough that you don't notice the problem. But it's there.</p>
      <p>Furthermore, scalable fonts promote ignorance with respect to optical scaling.</p>
      <p>hhp</p>
