    <p>hi!<br>
    am a student of graphic design and have been keenly studying pixel fonts and have some fundamental doubts..have been reading up on the net but thought i could cross check just to be sure.<br>
    are pixel fonts also called bitmap fonts/raster fonts or do they mean seperate things??from all that i have read up on the net, people use them interchangeably and differently on each website. </p>
    <p>secondly, in todays context, are pixel fonts being used solely for usage on screens and not for print? (i understand that dot matrix printers are still in usage and the usage of pixel fonts for print is mainly restricted here.)</p>
    <p>in terms of function, do pixel fonts serve only where legibility at small sizes is required and in flash animations??(on web). where the intention is aesthetic of course it's a different deal, but otherwise is this largely the area they are utilitarian in?</p>
    <p>thanks!</p>
