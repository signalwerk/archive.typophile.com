    html: |-
      <p>Mikey, I buy into the look being too corporate; the crowns more of a brand than I need for a call card.<br>
      Sandro, I agree regarding the size of the package, I think I got carried away –as you surely know, the computer screen can be deceiving sometimes. The canvas size, and what I understand is the typical size for a card, is 2 X 3.5 in.<br>
      Also, it is important to understand that I have no intention of entering any graphic design field, thus I have no intent to offer, to potential employers, a flamboyant or overstated card. Originally I went with these crowns because they represent a return to an aged simplicity; a reaction to what I see as the all too spiffy and playful designs that frequent blogs like <em>Brand New</em>.<br>
      I still feel semi attached to the crowns because of this, Kirsten, but Im considering something to this effect.</p>
      <p><a href="http://upload.wikimedia.org/wikipedia/commons/9/90/Flygvapnet_roundel.svg" title="http://upload.wikimedia.org/wikipedia/commons/9/90/Flygvapnet_roundel.svg">http://upload.wikimedia.org/wikipedia/commons/9/90/Flygvapnet_roundel.svg</a></p>
      <p>The only problem I have with these crowns is that they are instantly recognizable as a Swedish 'brand' and I don’t want to be taken for an ambassador or something.</p>
      <p>The contact information would be on the back.</p>
      <p>So is the consensus that an overhaul is in order, maybe minus the Relato? How does the Regular – Bold combo work? I am also thinking of switching the name to a very legible fraktur? Thoughts? (disregard my heritage on this one folks)</p>
