    <p>I am just a kid about to enter school -not really sure what I would like to do just yet- I figure it wouldn't be terrible to have a calling card. It also wouldn't be terrible to have one that looks sharp, you know, first impressions and all that. This is a preliminary design. Tear it apart, just know that my hope for the final product includes these words: handsome, clean and simple.<br>
    Your input would be appreciated. </p><div class="imageWrap"><img src="http://typophile.com/files/Card Rough Draft_5084.jpg"></div><p></p>
