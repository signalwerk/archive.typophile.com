      <p>The crowns do not match the type. There are too black in color and styling is wrong. If you are going to use Relato I would like to suggest that you pick up some of the angles in Relato and use them in the logo/crowns. </p>
      <p>Also, the composistion of the crowns and the text with the regular weight and the bold weight feels very corporate—not personal.</p>
      <p>Additionally, put some contact information in your card so we can see how you’ll format that too.</p>
      <p><em>“I do not wish to come across as a know-it-all sonofabitch, kid. I want it to be courteous and clean.”</em> Relato is warm yet has some masculine angles in there too. Letterpress printing will seriously warm things up too.</p>
      <p>Mikey :-)</p>
