  html: <p>I'm working on logo and ad guidelines for a cargo company, and I was wondering if anyone could help me out on capitalization norms for Spanish. <br> <br>I'm referring specifically to slogans, by-lines, department names, that sort of thing.  I know that English usually capitalizes all words except pronouns and short prepositions; French capitalizes only the first word.  How about Espa</p>
