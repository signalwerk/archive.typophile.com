  html: |-
    <p>In a reply to a thread by RachelR</p>
    <p><a href="http://typophile.com/node/100739" title="http://typophile.com/node/100739">http://typophile.com/node/100739</a></p>
    <p>Karsten wrote:</p>
    <p><cite>Per each glyph, select the outline which you want to convert into a component and then choose "Contour &gt; Convert &gt; Selection to Component"</cite></p>
    <p>Which works, but... </p>
    <p>Take the eacute glyph in a font -- say an Adobe font --  where the combining diacriticals have not been done. At a later date, the combining diacriticals are made up. If the eacute (U+00E9) is now turned into components per above, the U+00E9 character somehow remembers that the "right" component for the acute as U+00B4 rather than U+0301 (the latter being the combining diacritic).</p>
    <p>Anyway on FontLab to get the correct accent components in these characters, aside from making them again, by hand?</p>
