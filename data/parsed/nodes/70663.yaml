    html: <p>I don’t know how familiar you are with latin type design, but you might be aware that a monolinear sans need lots of subtle optical corrections. For example, the eye of a binocular “g” almost always needs to be mathematically lighter to match the weight of the other letters. Likewise, joints, like where the curved part of “b” hits the stem or the two diagonals in “v” meet will often look to heavy, even if their weight is correct.</p>
