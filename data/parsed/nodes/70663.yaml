      <p>I see you. Last one is a bug: <a href="http://typophile.com/node/69087" rel="nofollow">(look at here)</a></p>
      <p>But about other heavy black spots: One of the most common paradigms in Arabic Calligraphy and type-design is making heavy marked text to seem Mono-Weight --&gt; so from a far enough distance, the whole text should look like a silhouette gray illusion (see below images). (I think kerning of Latin fonts is based on the same idea.)</p>
      <p><a href="http://29letters.files.wordpress.com/2007/05/arabic-letterforms.jpg" title="http://29letters.files.wordpress.com/2007/05/arabic-letterforms.jpg">http://29letters.files.wordpress.com/2007/05/arabic-letterforms.jpg</a><br>
      <a href="http://3.bp.blogspot.com/_v4maAoBsN18/SdSrLqguRdI/AAAAAAAAAKg/VWPi962_1ks/s320/thuluth.gif" title="http://3.bp.blogspot.com/_v4maAoBsN18/SdSrLqguRdI/AAAAAAAAAKg/VWPi962_1ks/s320/thuluth.gif">http://3.bp.blogspot.com/_v4maAoBsN18/SdSrLqguRdI/AAAAAAAAAKg/VWPi962_1k...</a><br>
      <a href="http://www.islamicity.com/mosque/ihame/aw62d.gif" title="http://www.islamicity.com/mosque/ihame/aw62d.gif">http://www.islamicity.com/mosque/ihame/aw62d.gif</a></p>
      <p>In order to simulate this behavior, i write an algorithm to decide about mark positioning and kerning pairs. but in some situation there is no way (that I'm aware of) to make the text mono-weighted, because of the nature of glyphs: in general they should be written by the Qalam (try to find Qalam's path on nowadays fonts):</p>
      <p><a href="http://de.academic.ru/pictures/dewiki/108/learning_arabic_calligraphy.jpg" title="http://de.academic.ru/pictures/dewiki/108/learning_arabic_calligraphy.jpg">http://de.academic.ru/pictures/dewiki/108/learning_arabic_calligraphy.jpg</a><br>
      <a href="http://farm4.static.flickr.com/3473/3257108503_f87b226321.jpg" title="http://farm4.static.flickr.com/3473/3257108503_f87b226321.jpg">http://farm4.static.flickr.com/3473/3257108503_f87b226321.jpg</a></p>
      <p>I try to design the font with same look --&gt; it seems to be a little inconvenience! but I'll try to solve the problem ...</p>
      <p>Thanks a lot.</p>
