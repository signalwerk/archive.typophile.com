    <p>Hi all,</p>
    <p>I finished my first font.</p>
    <p>I need your advices, my font have this features:</p>
    <ol>
    <li>supports all of languages using Arabic script (unicode range 0600-06FF and 0750-077F).</li>
    <li>Have 5553 kerning pairs.</li>
    </ol>
    <p>As an experienced designer, what's your opinion about my first typeface? it's based on XB Niloofar and Zar fonts. Some glyphs are scanned from printed papers of 1998 year, I could not find the original Zar font. (see attached pdf.)</p>
