    html: |-
      <p>The first impression when seeing the pdf samples (apart from the kashida problems and some clashes of marks with letters) is very positive.  The letter-shapes, proportions, details and sizes are very pleasant to look at.  I specially like the large harakat marks, thin verticals and elegent stroke taperings.  Purists might object to this or that point insofar as the letters might adhere to any given calligraphic tradition, but considered as a font everything in it works beautifully together. For some reason it reminds me of light hand-set text fonts used in the Palestinian newspapers فلسطين  and  الدفاع printed around 1950.</p>
      <p>Because it is a font with a limited number of ligatures, perhaps it is better not to have the initial 'ain (illustrated by frode in عهدتم above) start too high and slope down as it does. It looks a bit odd compared to the overwhelmingly horizontal spine of the other letters.  And as I have long advocated in Arabic font design:  make the dots (not the marks which are large enough here) larger for the sake of legibility. I know it is not traditional to do so, but on a screen and in small print sizes the dots tend to disappear and they carry very important information about which letter one is reading! Examples: ج ح خ   ب ت ث   etc.</p>
