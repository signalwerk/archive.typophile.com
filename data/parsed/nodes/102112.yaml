    html: <p>What is the purpose of this gradual change? If it is to be as smooth as possible, first make weights equal (check in Photoshop). Use fonts with comparable x-height, ascender, decender. Make sure your intermediate steps are "acceptable", that they have e.g. serifs or not, but not "something in between", maybe make a semi serif. Use one step per line. I bet it should work with very few intermediates, maybe only 3. I want to see your results.</p>
