      <p>Very good description of how MM could do that page rather differently. The Knuth page, uses a font with 27 "knobs", and I'm pretty sure MMing a 27 axis font would be, though not entirely impossible to make, impossible to use. </p>
      <p>The most recent technology that could easily manage the font styling was Chameleon. It could actually go beyond Knuth by using really good design poles.</p>
      <p>What it couldn't do, that Knuth could, was be "hooked up to" the composition system to automate the composition of hundreds of fonts in a row, following a pattern of style manipulation through the knobs.</p>
