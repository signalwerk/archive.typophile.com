    html: |-
      <blockquote><p>"Multiple Master fonts can do this with ease..."<br>
      Really?</p></blockquote>
      <p>Actually, since the MM technology has been phased out of Adobe's <em>own</em> software around a decade ago, not so easy ... <em>anymore</em>.</p>
      <p>PageMaker used to have a specific "MM" dialog, in which you could define any of the MM 'design axes' (the numerical parameters specifying weight, slant, width, and whatever the designer could think of). Nowadays, it's hard to even <em>find</em> a real MM font! Adobe's new "Source Sans" source file contain an MM source to generate the weights. Unfortunately it's a .vfb file (which is FontLab's internal binary format). I had to search hi and lo for a compiled .mmm format.</p>
      <p>The only software on my system that can use the different design axes seems to be Illustrator. Other than in older versions, I cannot "design" a font in mine; I can only select one of the presets (which, I'm told, are pre-defined and saved inside the font file itself). Here is an image with the 6 presets:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/mmdemo_5032.png"></div><p></p>
      <p>In theory, you would create a font 'instance' for each of these 14 characters, divided equally over the supported axis range -- "0WT" for the first character, "77WT" for the second, etc. to end up at "1000WT" at the end; or any smaller value for smaller steps. That would make the characters vary only slightly from one to another. But ... alas, I cannot test this, as I don't seem to have the proper software to create custom instances.</p>
      <p>You could probably create an MM font from scratch, and have your software interpolate from one font to another -- I don't know how much manual work that requires -- and then make as much "pre-sets" as you need.</p>
    html_clean: |-
