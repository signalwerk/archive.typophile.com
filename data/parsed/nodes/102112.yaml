    <p>Can somebody help me to find a way to change one font into another gradually throughout a text. In that way that you don't get a sudden change, but if you compare say the first alinea with the sixth, you see they have different fonts.<br>
    Any ideas ?<br>
    Does there exist any software for that ?</p>
    <p>Thanks a lot,<br>
    Thomas.</p>
