      <p>The only software on my system that can use the different design axes seems to be Illustrator. Other than in older versions, I cannot "design" a font in mine; I can only select one of the presets (which, I'm told, are pre-defined and saved inside the font file itself). Here is an image with the 6 presets:</p>
      <p></p><div class="imageWrap"><img src="/files/mmdemo_5032.png"></div><p></p>
