    html: |-
      <p>You could use a sans typeface with a large family of weights, in which the transition from one weight to another is almost imperceptible, e.g. Shinntype’s <a href="http://www.myfonts.com/fonts/shinn/sense/" rel="nofollow">Sense</a> (eight weights).</p>
      <p>Similarly, while still on a weight axis, you could juice the effect by adding a minute stroke value in InDesign.</p>
      <p>You can use the horizontal scaling and slant controls in layout apps similarly, to vary the axes of “condensed/extended” and “italicization” incrementally.</p>
      <p>These axes—weight, horizontal scale and slant—accommodate smooth incremental transitions, but morphing from serif to sans is a dodgier proposition that only a true metafont can accomplish. Consider the case of <a href="http://typographica.org/typeface-reviews/karloff/" rel="nofollow">Karloff</a>, which I analyzed for Typographica.</p>
