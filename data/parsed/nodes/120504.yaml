    html: <p>hmm. I’m not a fan of extending the term ‘stem’ to anything vaguely vertical, as I think it should be reserved for vertical, stressed strokes. A few terms already exist—I know the horizontal part of the ‘5’ is called the flag, but as far as I know nobody has ever named the other numerals’ parts. Here’s what I came up with?</p>
