    html: |-
      <p>I'd call the horizontal part of the 7 the arm, the "vertical link" in the 5 the stem, and the sections of the 8 the upper and lower bowls (they both enclose a counter). </p>
      <p>As for the 6, the part that isn't the bowl would be called the stroke.</p>
