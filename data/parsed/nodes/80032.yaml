    html: |-
      <p>It's not surprising that there is some confusion over what weight "Helvetica Medium" is because, historically, there were differences in the names of the weights between Linotype and Haas Foundry.</p>
      <p>Haas Name -- Linotype Name<br>
      Helvetica Light -- Helvetica Light<br>
      Helvetica Regular -- Helvetica<br>
      Helvetica Medium -- Helvetica Bold<br>
      Helvetica Bold -- Helvetica Black</p>
      <p><em>Source: The Type House (Minneapolis) Helvetica specimen booklet, c. 1975, which displays versions of Helvetica available for Linotype (hot metal), Foundry (hand-set metal), Linofilm (phototypesetter), and Typositor (VGC film headline setter).</em></p>
      <p>Linotype Helvetica Bold was a bit bolder than Haas Helvetica Medium because it was designed for smaller size ranges (6pt to 14pt and 14pt to 72pt, respectively, are shown in the booklet I have). For circumstantial reasons, the Linotype names are the ones that have predominated in the digital type era.</p>
    html_clean: |-
