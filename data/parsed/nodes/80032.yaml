      <p>Helvetica Medium = the standard roman version of Helvetica.</p>
      <p>Adobe's apps get their name info from other parts of the font than traditional Windows apps. And in fact for PostScript Type 1 fonts that Adobe has in their library, they have a table to look up the "correct" typographic name. So it doesn't necessarily match what you see in other apps.</p>
      <p>Regards,</p>
      <p>T</p>
