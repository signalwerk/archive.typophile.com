    <p>When I use the Adobe CS programs on a PC and I am trying to use Helvetica, what looks like the standard roman version of Helvetica is labeled as Helvetica Medium? But when looking to see if Helvetica Medium is a font that can be purchased online I cannot find it?<br>
    So what is Helvetica Medium? Where did it come from? and is it an actual font that can be purchased?</p>
    <p>And no, I'm not getting this confused with Helvetica Neue 65 Medium, I understand that they are separate typefaces.</p>
    <p>Any thoughts???</p>
