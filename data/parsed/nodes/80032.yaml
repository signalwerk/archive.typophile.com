      <p>There is a difference between Helvetica Medium and Helvetica Regular.  Helvetica Medium is actually a semibold face that achieved fame in the Modernist era where it was used as a display face over and over.  The regular weight is actually more of the text weight. Helvetica Medium was frequently specified for signage across the globe. The very early personal computers, sometimes would deliver Helvetica Medium" which was named by them as "Bold".  Part of this was a screen resolution issue since true bold would not resolve well on screen in the 80's.  To get the "True" weights of Helvetica, go to the Linotype site and see the originals.</p>
      <p>I take that back about the Linotype set.  They have since rearranged their naming system.  What was popularly known as Helvetica Medium when dozens of 20th Century design Standards were written  is seen by looking at the work of Rudy DeHarack Müeller-Brockmann, and certainly, Massimo Vignelli. Also see Paul Shaw's book on the New York Subway signage.</p>
      <p><a href="http://www.amazon.com/gp/product/026201548X" title="http://www.amazon.com/gp/product/026201548X">http://www.amazon.com/gp/product/026201548X</a></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Helvetica-Medium_5788.png"></div><p></p>
      <p>Here is a bad sample of the real Medium:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/BrockmannBook_6325.jpg"></div><p></p>
