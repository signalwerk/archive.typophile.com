  html: "<p>I'm currently setting up the \"visual communication\" <br>of a music label called SixtySix. Here comes their logo: <br><img src=\"http://www.typophile.com/forums/messages/4100/3105.gif\" alt=\"SIXTYSIX\"> <br>As you can see, they want a basic \"MOD\" flavor, and I was wondering <br>what typefaces are appropriated for this period. Think Lambretta, Quadrophenia.... <br>(PS: SixtySix are nice people, not clients with business preoccupations)</p>"
