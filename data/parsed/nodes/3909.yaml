    html: <p> I agree w/ the "cleaner" fonts that have been suggested such as universe or the monoline one. I might also suggest a classic - frutiger.  <br>Maybe the use of a clean and classic heavy serif font such as the clarendon is a great idea too if you are trying to stay "period" style. The logo - an awesome logo it is - is busy - so stay clean and clear with the supportive type. </p>
