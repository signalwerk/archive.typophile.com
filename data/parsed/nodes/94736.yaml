    html: "<p>The relationship of Hangul jamo, and hence syllables, to the articulatory positions of the human mouth is detailed in the <em>Hunmin jeong-eum haerye</em> of 1446, which is certainly close enough to the date of the invention of Hangul for it to be taken seriously as something other than a post facto rationalisation. I said I wasn't <em>wholly</em> convinced, but perhaps should clarify that I accept that there is a systematic relationship between classes of sign and classes of articulation; I'm not convinced that the actual shapes of the signs represent the shapes of the mouth or, at least, that the a different set of shapes wouldn't provide at least as good or better representation. Indeed, if the latter wasn't the case, Bell's 'Visible Speech' might look more like Hangul jamo than it does. And, again, I don't think there is any cognitive or graphical benefit to such a system: it has nothing to do with the activities of either reading or writing.</p>"
