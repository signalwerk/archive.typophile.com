    html: "<p>Seriously, if you want a good model of understanding writing systems I recommend the work that is now being done that directly maps the phenomena of writing to those of linguistics, finding both obvious parallels and, in the process, uncovering less obvious one that expand our understanding of the 'grammar' of writing. The key is that both language and writing are phenomenal: their is no uninstantiated text any more than there is uninstantiated speech. If you start going down the Platonist path with regard to 'ideas' of letters, you may as well go all the way down the 'philosophical language' rabbit hole, which is doubtless an entertaining journey but it doesn't tell you anything about the phenomenal world. The shapes of our letters reflect the shapes that have been made at particular places and times by particular people using particular tools working within text cultures that encouraged particular conventions according to criteria of competence and performance.</p>"
