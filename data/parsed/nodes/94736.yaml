      <p>@John Hudson:<br>
      <cite>There are many cultures in which people believe their writing systems to be uniquely scientific or rational</cite></p>
      <p>Yes, and users of simple alphabetic scripts like the Latin, Greek, and Cyrillic can point out that Korean requires more complicated typewriters.</p>
      <p>But since Alexander Graham Bell's "Visible Speech" shows it is possible to model letter shapes on the positions of the vocal organs, I see no reason to doubt the claim that this was also done consciously in the design of Hangul. I would have expected that if the forms don't have the claimed relationship, this would have been noticed, and the claim falsified.</p>
