    <p>I would like to know where certain Roman and Cyrillic glyph variants come from.</p>
    <p>In American cursive handwriting (Roman letters, naturally):<br>
    • the "f" looks more like a print "b" than a print "f";<br>
    • the "s" does not resemble any print letter at all;<br>
    • and the "r" looks like some kind of weird mutant print "n".</p>
    <p>In Russian cursive (Cyrillic letters):<br>
    • the "г" looks like a backward print Roman "s";<br>
    • the "д" looks for all the world like a cursive Roman "g";<br>
    • and the "т" looks like nothing so much as a cursive roman "m"!</p>
    <p>(The cursive forms for "г" and "т" are also used in italic.)</p>
    <p>As for "r" and "г", I wonder if the same principle is at work for both.</p>
    <p>I have seen some of the Russian "cursive" letterforms in print, in the credits for some episodes of "Nu, pogodi!"</p>
