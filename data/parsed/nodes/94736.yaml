      <p>Which of course explains how Armenia's ministry of culture, ISType and Reading University jointly paid for virtually all the expenses for my 9-day trip in June. Are they all ignorant too? Nobody has to agree with anybody completely (in fact that would be boring); but pretending somebody you disagree with on some things has absolutely nothing to contribute only makes you weaker. For example I'm quite unlikely to recommend Michael's fonts, but I would be quite unwise to ignore everything he says.</p>
      <p>John, since you're not an emotional spaz I have to think either I'm explaining my view poorly or you're being unduly and uncharacteristically intransigent. Or both! Let me try this: at their origins letters are made not by undirected movements of the hand, they come from a structure in the mind of the maker, a structure previously seen -or at least imagined- in the "real world". For example in Hangul the various elements are renderings of the mouth and tongue when making the given sound. And the ox that's supposed to be the origin of the Latin "A" was not made by a human hand! I'm not sure how anybody could logically limit the way letters look to a human's right hand (especially one holding a specific marking tool) instead of seeing the hand as simply one historically relevant factor in the end-result.</p>
