      <p>Hrant, I do understand what you're getting at , but a) I think you are wrong and b) as you might remember the shorter and pithier you try to make your pronouncements the more likely I am to respond grumpily. When you take the time to express your thinking, we all do better.</p>
      <p>The ox-to-A example you give seems to me a very good illustration of my point, which is that writing systems typically evolve in the phenomenon of writing (leaving aside 'conscripts', which are classified parallel to 'conlangs' and contra 'natural' or 'organic' scripts for good reason). There was no 'idea of an A as an ox' that gave shape to our letter. Rather, there was a drawing of an ox that symbolised an ox and later a phoneme associated with an ox, and which through being written many, many times, on particular substrates with particular tools, became the shape of our letter A. There is no process other than writing that explains the gradual rotation of the letter, or the gradual conventionalisation of its proportions and its modulation; indeed, the very gradualness of these evolutions is evidence of the lack of an 'idea' behind the shape. The idea of the ox is gone long before the letter A takes its conventional form, and there isn't any need to replace the ox with another idea because once writing is instantiated -- and there is no uninstantiated writing -- it is the thing itself.</p>
      <p>I've never sought to 'limit the way letters look to a human's right hand ... holding a specific marking tool', and I think type design even before the advent of digital outline formats had introduced a number of innovatory ways of both making letters and also thinking about letter shapes. <em>But</em> with few exceptions our writing systems are inherited, and they are inherited from writing, which is to say from an historical process that involves both invention and convention but that expresses both through an <em>act.</em></p>
      <p>If I had to summarise this disagreement, I would counter your statement that the shapes of letters begin as ideas by suggesting that letters are shapes to which ideas may be applied. As I think you know, I am a fan of a number of typeface designs of recent years that clearly involve the application of ideas to letter shapes -- Legato being only the most obvious; also several of Jeremy Tankard's designs (but not Fenland, which I take as evidence that the idea is not enough) --, but I think is it ahistorical to suggest that because we can approach letters in this way that this is how they evolved. The overwhelming evidence of palaeography is that writing systems evolve, unsurprisingly, through writing and are mostly shaped by tools, media and the practical considerations of text creation.</p>
      <p>___</p>
      <p>PS. I've never been wholly convinced by the relationship of Hangul shapes to the vocal system, nor do I think this rationalisation is either cognitively or graphically significant in terms of the evolution of the script. There are many cultures in which people believe their writing systems to be uniquely scientific or rational -- almost as many as believe their writing systems to have divine or magical origins --, whereas in my experience palaeography tells much the same story all over the world.</p>
