      <p><em>The "American script" forms that you refer to look the way they do as a result of tool, speed and ductus.</em></p>
      <p>And more specifically because of the point of connection between these letters and adjacent forms minimising lifts of the pen. So, for instance, the f connects at the x-height, so the writer needs to move from the bottom of the descending stroke back to the x-height, hence the characteristic loop.  The r, conversely, connects from the bottom, so the pen needs to come down before rising to the next letter, creating the overall n-like construction (but not really like an n in the same script).</p>
