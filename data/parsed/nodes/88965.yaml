    html: |-
      <p>Florian, some quick things I noticed on your layout, which, in general, looks good:</p>
      <p>TOC page. I don't understand the ratio of having different alignments (left and right). And, since the entire document is set asymetrically on left, why don't you try to also set (align) the table of contents on left?</p>
      <p>Sans typeface (Montserrat). Check the spacing between the words - they are too close, both in headlines and subheads.</p>
      <p>Page numbers. The minus sign before and after the number is unnecessary, in my opinion. Just put the mere number or, if you need a little graphical enrichment at the bottom of the page, try to insert the number inside squared brackets.</p>
      <p>Subheads. They look too big to me, try to set them at the same size as body text - the different typeface is enough to differentiate them from the boxy text. Also, try to define a better way to insert them before and after the body text: on page 2, for example, there's the same space before and after "I.2. Donec urna lectus", while there's should be more space on top.</p>
      <p>Those are some suggestions; others may have different opinions.</p>
