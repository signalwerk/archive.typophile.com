    <p>Hello dear community.</p>
    <p>I have a question – mainly – on font pairing (and I know about the <a class="freelinking external" href="http://www.google.com/#sclient=psy-ab&amp;hl=en&amp;site=&amp;source=hp&amp;q=typeface+pair+OR+pairing+OR+match+OR+matching+OR+combining+OR+combination+OR+tango+site%3Atypophile.com&amp;pbx=1&amp;oq=typeface+pair+OR+pairing+OR+match+OR+matching+OR+combining+OR+combination+OR+tango+site:typophile.com&amp;aq=f&amp;aqi=&amp;aql=&amp;gs_sm=s&amp;gs_upl=779l779l0l2219l1l0l0l0l0l0l0l0ll0l0&amp;bav=on.2,or.r_gc.r_pw.,cf.osb&amp;fp=17aa82c2bf337dfc&amp;biw=1229&amp;bih=662" rel="nofollow">available threads</a>).<br>
    In a document I use Cycles Eleven by Sumner Stone for body text and Montserrat (a Google Webfont freebie) for the headlines and subheadlines.</p>
    <p>If you could have a brief look at the document attached please and give me some feedback on:<br>
    • Do they work together?<br>
    • Do they work together at the chosen sizes?<br>
    • Is the headline and subheadline numbering ok?<br>
    • Is the table of contents design ok?<br>
    • Are the line spaces before and after headlines ok?<br>
    • Page number typeface in footer ok (Lato)?</p>
    <p>The questions cover the things I can change myself about the document design. The margins, the bodytext spacing and the bodytext font size is fixed. </p>
    <p>Thank you</p>
    <p>_____</p>
    <p>P.S.: Lining Figures were planned, it was a mistake in the style definition. Thank you.</p>
    <p>PSS: Updated Version online, just for reference, thanks again.</p>
