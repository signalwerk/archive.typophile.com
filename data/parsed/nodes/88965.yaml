    html: |-
      <p>"When fitting the subheads to the bodytext, do you take the x-height of the body text as a measure or the capital heights?"</p>
      <p>I'd say x-height, althought I don't have Monserrat and can't make a straight comparison myself. Anyway, if the typefaces don't stand on the same line, as in your case, I guess that you could set the sans the same size as the serif, or adjust its size - 0,5 or 1 pts more or less - by judging how it optically looks right to you. They look quite balanced in example 3, anyway.</p>
      <p>As for the TOC alignment, I understand what you're saying, but I usually set indexes that way, left aligned, with page numbers preceding chapter titles. Anyway, have a look at this excellent article by John D. Berry - very useful:</p>
      <p><a href="http://www.creativepro.com/article/dot-font-tables-of-contents" title="http://www.creativepro.com/article/dot-font-tables-of-contents">http://www.creativepro.com/article/dot-font-tables-of-contents</a></p>
