  html: |-
    <p>This may be old news to some of you, but there's some <a href="http://www.istartedsomething.com/20081030/improvements-to-fonts-in-windows-7/" rel="nofollow">new font improvements</a> in the works for Windows 7. Perhaps the best new feature is the ability to turn fonts on and off within the OS itself (no third party software needed). </p>
    <p>The site linked above also has some screenshots of <a href="http://www.microsoft.com/typography/fonts/font.aspx?FMID=1741" rel="nofollow">Gabriola</a>, a new script font for Windows. It says it has OpenType, so maybe that means MS Office will finally be able to take advantage those features. Can anyone confirm this?</p>
  html_clean: |-
    <p>This may be old news to some of you, but there's some <a href="http://www.istartedsomething.com/20081030/improvements-to-fonts-in-windows-7/" rel="nofollow" class="link-external">new font improvements</a> in the works for Windows 7. Perhaps the best new feature is the ability to turn fonts on and off within the OS itself (no third party software needed). </p>
    <p>The site linked above also has some screenshots of <a href="http://www.microsoft.com/typography/fonts/font.aspx?FMID=1741" rel="nofollow" class="link-external">Gabriola</a>, a new script font for Windows. It says it has OpenType, so maybe that means MS Office will finally be able to take advantage those features. Can anyone confirm this?</p>
