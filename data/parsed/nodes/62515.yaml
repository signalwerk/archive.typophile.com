      <p>Common usage is 'Latin Script', although 'Roman script' makes at least as much sense. </p>
      <p>Alphabets are language specific; scripts are culture specific.</p>
      <p>So I would understand 'Latin alphabet' to mean specifically the set of letters used to write the Latin alphabet, as distinct from e.g. the English alphabet, the German alphabet or the Wolof alphabet. All these alphabets are subsets of the same script, which is that which we inherit from the Romans.</p>
