      <p>The link given about the revival of the Jawi script in Indonesia was very disturbing in one aspect.</p>
      <p>Westerners, used to the Roman alphabet, assume that it is highly legible compared to some other writing systems in which the letters appear to be less distinct. Thus, it is assumed that when nationalists in Turkey changed over to a form of the Latin script, this partly facilitated the improvement in that country's literacy levels. That may be, however, just chauvinism on our part.</p>
      <p>But the fact that the one province in which Jawi now appears with Latin script did so <em>along with instituting Shari'a</em> is very distressing, as this will diminish religious liberty, and the equality of people of all faiths, for people who live there. It is up to the speakers of Malay what script best represents their language, but any political movement which represents a movement away from the tolerance for which Indonesia has been praised is, of course, profoundly harmful.</p>
