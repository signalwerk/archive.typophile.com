      <p>Hi guys:</p>
      <p>I am not sure this help. Since I am from Malaysia and deal with Malaysian clients all the time, allow me to provide some historical background, perhaps that can give a different perspective to the whole topic:</p>
      <p> "Malay is the main language of communication for the inhabitants of the Malay Archipelago, and it has been the lingua franca of the region for at least five centuries. The Malay script known as Jawi is derived from Arabic. Both Arabic and Jawi have been widely used for religious and secular manuscripts since Islam was established in the region. Jawi is a combination of Arabic and Persian scripts, with additional letters added as an adaptation to local phonetics. These additional characters are "pa", "nga", "cha" and "gha".</p>
      <p> "Jawi script has been through various orthographic improvements over the years, to make it compatible with Malay phonetics. In 1904 a committee was set up to produce a guidebook to change Jawi to Malay 'Rumi' orthography, which was known as 'Romanised Malay Spelling'. It was also known as 'Sistem Ejaan Wilkinson'. Zainal Abidin Ahmad, also known as Za' ba, rearranged Malay Rumi orthography in 1938, affecting the Wilkinson Malay Orthography System which has been used by school since 1904"</p>
      <p>(From "The Malay Manuscript: An Introduction", pg21, 26; Published by Islamic Arts Museum Malaysia (IAMM) )</p>
      <p>This "Romanised Malay Spelling" version of this Malay language later became the national language of Malaysia, which we called "Bahasa Malaysia" ('Bahasa' means language) The same "Romanised" malay language was also used in Indonesia which later became the national language of Indonesia- "Bahasa Indonesia", with slight differences due to local adaptation. </p>
      <p>Historically both Malaysia and Indonesia were located in the same region called "The Malay Archipelago" or "Nusantara". Both countries used the same language until the two countries declared independence. In fact, Singapore was also situated in the middle of this region and therefore Bahasa Malaysia is also the national language of Singapore due to historical reason. Though, most Singaporeans are more fluent in English and Chinese due to the education policy adopted by the Singaporean government after independence.</p>
      <p>( To divert a bit, that's why the 3 countries also share many cultural heritage. In recent months there have been many arguments among the 3 countries over the exclusive right of certain cultural practices, such as The batik, certain dances and foods, etc...)</p>
      <p>That is from historical point of view. Culturally, we local Malaysians often say "Romanised" Bahasa Malaysia instead of "Latinised" Bahasa Malaysia. </p>
      <p>It depends who are your audiences. If you are speaking to the local Malaysians, then to approach it both from cultural and historical point of view seems to be more appropriate.  Therefore, "Bahasa Malaysia uses the Roman alphabet" would be a better choice and it sounds better to the locals too.</p>
      <p>That would be my personal argument. And believe me, most Malaysian clients won't even know the difference, much less arguing about it. If they start to make noise over your choice of words, just quote the above excerpt I suggested to you to support your argument, and tell them that it's from IAMM. That would silent them. </p>
      <p>The curatorial department of IAMM is quite authoritative in regards to this. If they have any doubt, ask them to call IAMM, I can give you the numbers.</p>
      <p>All the best. : )</p>
      <p>(Aziz from Flower. Anything else to add?)</p>
    html_clean: |-
