      <p>There is an additional wrinkle that in classifying writing systems, 'alphabet' in the narrow sense has the technical definition of a script that has graphemes representing both consonant and vowel phonemes in a single system. It is by this criterion that the script used by the Romans to write Latin is properly called an alphabet, not by its descent from the Greek alphabet. The Phoenician script, from which the Greek alphabet derives, is not an alphabet in this sense because it records only consonant sounds (it is classified as an 'abjad'). There are true alphabets that are not derived from the Greek alphabet, such as hangul, the Korean alphabet.</p>
      <p>A looser linguistic definition of 'alphabet' includes any writing system with symbols for separate sounds rather than syllables or words. So Chinese logographs and Japanese kana are excluded, but examples like the Phoenician script are included. This seems to be how Wikipedia uses the term in its entries.</p>
