      <p>I was terribly confused. I thought we were talking about Indonesia.</p>
      <p>In Indonesia, Bahasa Indonesia is one form of Malay - according to Wikipedia, it is based on the Riau dialect, spoken around Sumatra. But the mother tongues of most Indonesians are other languages. Some are closely related to Bahasa Indonesia: thus, Javanese is a relative of Malay.</p>
      <p>I see that Balinese is also related to Malay; I had not realized that, thinking that it was a Dravidian language or a relative of Sanskrit. But I should not be too surprised; Tibetan is a relative of Chinese despite being written with a writing system derived from Devanagari.</p>
      <p>According to Wikipedia, Malaysian was officially Bahasa Malayu between 1986 and 2007, and now it's back to Bahasa Malaysia again. It is noted as being a second language for more members of Malaysia's ethnic minorities (18 million) than it is a first language for Malaysians in general (10 million).</p>
