      <p>The reason we speak of the Latin script and the Roman alphabet for the writing system which includes 26 letters, some of which are modern innovations, should be obvious. At least the Roman Empire and its Latin language are the <strong>source</strong> from which most of this alphabet came. If we called it the <em>English</em> alphabet, the Dutch and the French and the Germans and the Spaniards and even the Norwegians would feel we were appropriating ownership of the alphabet which they also use.</p>
      <p>Of course, since lower-case letters are such a prominent feature of the Latin writing system in current use, one could get really technical, and adopt as the standard term "the Carolingian script" - but if you started doing that, people would assume you were talking about paleography, rather than trying to use a technically accurate term for the writing system in <em>current</em> use.</p>
