    html: |-
      <p><cite>What’s the distinction between an alphabet and a script?</cite></p>
      <p>When SCRIPT means “a conventional system of a limited range of graphical characters to visually represent a language” then ALPHABET is *one kind* of script. To be more precise, the term “Alphabet” ought to be used for those scripts only which descend from Phenician (like Latin).<br>
      The so-called Latin (or Roman) alphabet common to us today is actually the English alphabet. The W was invented on the British isle, J and U are medieval additons, too. Even K, Y and Z are only lean-letters to the “Latin” alphabet (from Greek).</p>
      <p>The only genuin Latin letter is the G, which has been invented by a Roman scribe.</p>
