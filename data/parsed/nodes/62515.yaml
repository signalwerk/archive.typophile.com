      <p>Bendy, I think it is worth pointing out that 'Bahasa Malaysia' being wrong represents AzizMostafa's point of view and not necessarily the generally accepted practice. The Malaysian government has declared Bahasa Malaysia to be the national language or the 'Malaysian language' and so Bahasa Melayu has (implicitly) come to mean the Malay Language. I'm not sure whether Indonesia uses the term Bahasa Indonesia, which would parallel Bahasa Malaysia.</p>
      <p>You might compare this with English (parallel to b.melayu) which is divided in British (b.malaysia) and American English (b.indonesia).</p>
      <p>Of course, not everyone agrees with the government and since Malaysia is a heavily politicised country ...</p>
      <p>On the topic of older writing systems, the Dutch have left a legacy of dictionaries for various Javanese and regional languages other than Malay, which each have their own script. If you are interested, you might want to try to explore it through those sources.</p>
      <p>The language of the Malays in Malaysia has always been Malay, as far as I can tell. There are aboriginal people here, more about which can be found at <a href="http://en.wikipedia.org/wiki/Orang_Asli" title="http://en.wikipedia.org/wiki/Orang_Asli">http://en.wikipedia.org/wiki/Orang_Asli</a> .</p>
      <p>edit: oops, didn't realise I was talking to a Malaysian, so you're probably better aware of all this than I am.I just let it stand in case anyone might be interested.</p>
