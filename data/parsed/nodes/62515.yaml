      <p>Well, the term alphabet comes from alpha and beta of the Greek alphabet, of course, so it is not obvious that it should be applied retroactively to the Phoenician script either. If alphabet is taken to be a term comparable to abugida (from the Ethiopean name of the ge'ez script) or abjad (adapted from a name for the Arabic script), then it makes more sense to use all those terms as purely structural categories regardless of the origins of the specific examples.</p>
      <p>What would the proto-Canaanite script be, for instance? The Greek, Ge'ez, and Arabic scripts are all ultimately derived from it, after all. And as far as I've seen the most common use for the term abugida is for various Indic scripts, which have very little to do with Ge'ez. The names are best thought of as being taken from well-known examples of each category, and not meant to restrictive to scripts actually derived from the said examples.</p>
