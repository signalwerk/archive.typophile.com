      <p>‘Script’ is a tricky term, because it also comes with multiple meanings and sometimes requires explanation. It gets used a lot in contemporary font making, and also in text encoding and processing circles, to refer to writing systems e.g. ‘Latin script’, ‘Arabic script’, etc.. I'm as guilty of this as anyone.</p>
      <p>If I want to be very precise in this context, though, I use the term ‘writing system’ rather than script: the Latin or Roman writing system, the Arabic writing system, and so on. The nice thing about this term is that it doesn't have multiple meanings and it specifically references the system of signifiers and signifieds that make up that system, without reference to the forms of those signs. This also means that one can sidestep the classification issues of e.g. alphabet vs. abjad (which arise from the fact that there are almost no perfect abjads, and what seems to me the inevitable conclusion that an abjad is a subcategory of alphabet); ‘writing system’ can accomodate e.g. the use of <em>matres lectiones</em> (letters as vowels) in classical Hebrew or the rôle of the alif in Arabic.</p>
      <p>The biggest difficulty of the word ‘script’ is its use, both common and specialist, in labelling of specific styles of writing, e.g. the Carolingian Script (a stylistic category of the Roman writing system) or the Nas'taliq Script (a stylistic category of the Arabic writing system). The fact that these script styles were not developed by Romans or by Arabs only adds to the nomenclatureal fun.</p>
