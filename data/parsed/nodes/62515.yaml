      <p>In school, many years back, I was taught that Latin alphabet referred to the 26/52 alpha characters commonly used in English and their derivatives in related languages. Roman--cap R--meant inscriptional capitals circa first century. However, roman--lower case--referred to style of script developed in the vicinity/sphere of Rome in the 15th century and used to distinguish from venetian scripts of the same era, as well as separated from italic.<br>
      Western alphabet forces us to draw too many geographic demarcations, e.g. does German use the western alphabet--ß--or Swedish, or Czech?</p>
