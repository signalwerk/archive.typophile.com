      <p>&gt;In in the French alphabet the sound produced by “ch” is similar to the “sh” sound in the English alphabet and so the two alphabets are different while they use the same script.</p>
      <p>But an alphabet no more closely correlates with its phonemes than does its script. An alphabet is a set of letters in a particular order. The phoneme /ʃ/ is not represented by any symbol in either the French or English alphabets.</p>
      <p>I guess my point of discussion is: do we use the Latin *script* to represent the English *alphabet* or the Latin/Roman *alphabet* to represent the English *language*? I feel it may be both, in which case both Latin script and Roman alphabet are fully correct.</p>
