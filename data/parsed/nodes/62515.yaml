      <p>Oh, I don't see why we should <em>generally</em> prefer 'the Latin script' over 'the Latin alphabet'. The Latin script just happens to be an alphabet, and both names are unambiguous. You would prefer one over the other only in certain contexts, for example when you would want to emphasize the alphabetic nature of the script.</p>
      <p>Now, John Hudson makes a distinction that I think could be useful in many respects, but as far as I'm aware it's not one that's made conventionally. If I were to employ that distinction, I would explain it beforehand so the reader understands what I'm talking about.</p>
      <p><cite>Surely the Latin script is only represented by the Latin/Roman alphabet?</cite><br>
      John means that subsets of scripts derived from that originally used to record Latin ('the Latin script') may be used for different languages ('the English alphabet', 'the Welsh alphabet', 'the Vietnamese alphabet'). He would understand by 'Latin alphabet' only the collection of graphemes used for writing the Latin language. Again, a useful distinction, but probably too subtle for general discourse.</p>
      <p>In this case, 'alphabet' is one of these general terms that different people have adopted to use in a technical sense, but with different distinctions in mind. Linguists will care about the sense of having signs for consonants and vowels in the same system, while others will see the opportunity to use the term to describe each case where the same script is adopted for a number of different languages.</p>
