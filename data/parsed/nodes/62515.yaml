      <p>I would say English has its own alphabet which is encompassed by the Latin script. The classical Latin alphabet (according to wikipedia) originally consisted of ABCDEFGHIKLMNOPQRSTVXYZ. W was added later to represent sounds from Germanic languages and the distinctions between I/J and U/V were also later developments. So to my understanding, it would be incorrect to say that we use the Latin (Roman) alphabet to represent the English language unless you spell things like IVSTICE for 'justice' &amp;c.</p>
