      <p><em>I guess my point of discussion is: do we use the Latin *script* to represent the English *alphabet* or the Latin/Roman *alphabet* to represent the English *language*? I feel it may be both, in which case both Latin script and Roman alphabet are fully correct.</em></p>
      <p>The English alphabet is the set of Roman letters used to write the English language. The Latin alphabet is the set of Roman letters used to write the Latin language. The German alphabet is the set of Roman letters used to write the German language. The Wolof alphabet... etc.</p>
      <p>This really is the only sensible use of the term alphabet, because otherwise you are lacking a term to refer to the set of letters used to write individual languages, and left with multiple terms to refer to superset of letters that form a language-independent writing system.</p>
