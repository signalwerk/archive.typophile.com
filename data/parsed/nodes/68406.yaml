    <p>I created a logo for a sports cafe and I would like some critique please. Feel free to tear it apart, I have a strong stomach, LOL. I am not really liking the *DINE* part of it but I am not really sure what else to do with it. Thank you.</p>
    <p>I just added a second version that I like a bit better.</p>
    <p>The last three images are what I came up with for the second round. I realize the full version is a bit large so I added a version with just the name and just the initials. The client asked to have the initials *GTD* with the text *Game Time Dine* and *Sports and Fine Dining* underneath.</p>
