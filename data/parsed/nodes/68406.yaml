    html: |-
      <p>Personally I don't think 'Dine' is the right word to use. When I read out Game Time Dine it sounds pretty awkward. I would also connect the word 'dine' to a cheap restaurant not a café. Do you have other options or is the client set on 'Dine'?</p>
      <p>Agreed that the type for 'Dine' doesn't work. In the second version it's very crowded as well.</p>
      <p>The Connection between 'e' and 'T' seems awkward. I think I would separate 'Game' and 'Time' and shorten the part of the e that sticks out.</p>
      <p>Otherwise I like the typeface. I get a baseball feel from it which is suitable. The arch idea sound interesting that might work very well.</p>
