    html: |-
      <p>Thank you for all of the input and I apologize for my delayed response. After continuing to tweak the logo I ended up completely changing the logo. I set *Fine Time Dine* in one size using main script font. I then added the text *Sports and Fine Dining* in Bembo, tucked between a swatch that I added to the *e* of *Dine* and I enlarged the *G* of *Game*. I showed it to the client and I am going to start over from scratch. I might use the same script font although I think I will change it to go for a classier look. Unfortunately the copy that was supplied by the client and I am stuck with it. If anyone would like I can post the changes I made. I will be working on the logo this weekend so I can post the redesign I come up with too.</p>
      <p>Oh, and I got these fonts from <a href="http://www.letterheadfonts.com" title="http://www.letterheadfonts.com">http://www.letterheadfonts.com</a>. The main font is Ballpark Script and the font in the swatch is Tideway Script. Just in case anybody was wondering. I should also add that I quick whipped this logo up as a favor to a friend and I am not all that proud of it. I will put more effort into the next round :)</p>
