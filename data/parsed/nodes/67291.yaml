    <p>So I'm doing another logo for myself and want to create a brand that reflects the hand drawn or hand made quality of my design work. I like hand drawn typography but also screen print and sew occasionally.  For the logo I want it to be like a humble seal of quality. My last name is Hagadorn  so I plan on putting my name around or under the mark. </p>
    <p>This is an early-ish sketch, let me know what you think.</p>
