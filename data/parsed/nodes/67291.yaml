    html: |-
      <p>Keep cleaning up your loops paths to create a happy medium between an <em>H</em> and a <em>dP</em>. What I don't think you should've changed is the weight of the top and bottom <em>H</em> stems. Your O.P. is kind of reminisce of how pressure-sensitive Wacom styluses are, if you use one, and their illustration capabilities.</p>
      <p>My takeaway is keep rounding out the loops so they flow and form a nice crossbar, revert back to the old weight of the top and bottom <em>H</em> stems and try to retain the hand-drawn qualities beyond the mark.</p>
