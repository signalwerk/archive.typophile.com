    html: |-
      <p>Stephanie,</p>
      <p>I didn't realize how old this original post was. It may be a bit late, now... but here are some of my thoughts.</p>
      <p>I too like the simplicity of the design. But I also read it as a dp as well as an H. If you wish to lessen the confusion, it may be best to reduce the width of the loops, shown here. The reason they're reading as dp is that they are approximately the width of what those characters would be as compared to the cap H.</p>
      <p>Things to consider--<br>
      • Italicizing the H might lessen the likelihood of it reading as a dp.(bottom left)<br>
      • You mentioned hand written work, and sewing. Perhaps a more script looking H (bottom right)<br>
      • And finally, perhaps tying it all together by using the same design in your name below and/or choosing a typeface that mimics the look of the logo.</p>
      <p>Hope this helps.</p>
      <p>Rob</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/hagadornROB_5001.jpg"></div><p></p>
