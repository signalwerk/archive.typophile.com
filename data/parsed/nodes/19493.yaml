    <p>Congratulations to <a href="/wiki/Miguel%252BSousa" class="wiki">Miguel Sousa</a> for the recent appointment to the <a href="http://blogs.adobe.com/typblography/2006/01/job_opening_fon.html"> font devewlopment position</a> at <a href="/wiki/Adobe" class="wiki">Adobe</a>. It couldn’t have happened to a better candidate, IMO. Miguel is one of the most knowledgeable and helpful contributers here at typophile, and I’m sure I’m not the only one who appreciates that. I figured since he’s now in <a href="/wiki/San%252BJose" class="wiki-create">San Jose</a>, it’s safe to break the news. Let’s get a big round of applause, everyone!</p>
