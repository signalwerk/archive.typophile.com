      <p>The indented second line is a classic approach, it occurs to me that you could steal some leading and add some space between entries, possibly even a rule as well (in which case you wouldn't need to indent), the drawback with that would be a lack of aligning between columns, unless you could work a half line space in which might be too airy at the expense of useability.</p>
      <p>Tim</p>
