  html: |-
    <p>Hello everyone, </p>
    <p>I am in need of your suggestions. </p>
    <p>A little background is needed: the University where I work and study is using the Angel LMS. The biblical language professors are trying to find a font that could be standardized for both Hebrew and Greek.* </p>
    <p>What are our options, considering the following requirements:</p>
    <ul>
    <li>Unicode</li>
    <li>Must have support for Greek &amp; Hebrew (must point correctly in Hebrew)</li>
    <li>License: something that would allow us to upload to our own server and distribute to registered students only** / or system font (cross-platform compliant)</li>
    </ul>
    <p>*They're open to using separate fonts for Hebrew / Greek if needed.<br>
    [EDIT] ** Through a secure LMS.</p>
    <p>I'd appreciate your help. </p>
    <p>Dan</p>
