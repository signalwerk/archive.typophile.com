    html: "<p>Hi Rodrigo <br> <br>I like this serif! <br> <br>Here my critique <br>Many of this is a question of flaver ;-) <br> <br>lc 'a': Downstrok-serif is very heavy <br> <br>The angel of the dick/thin contrast seams to be very different. I like it in lc 'e' and 'c' but i.e. lc 'o' or lc 'g' has another angel. Also the Uppercase... but maybe u have to fix the  lc 'e' and lc 'c'. But as i just said I like the e and c more ;-) <br> <br>lc 'y': like eduardo said to weak and I also agree to the to heavy dieresis <br> <br>Also you should check the horizental lines. It seams that there are  many diffrences. <br> <br>Also check the lc 'g'. The h-lines seams also different weight. <br> <br>The Tail of the Q should end like the upstroke serif of the lc 'g' <br> <br>Greetings to you and go on! <br>Jens</p>"
