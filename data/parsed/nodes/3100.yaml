  - id: 24575
    user: 1250
    date: 2004-02-13T09:58:00
    date_raw: 13 Feb 2004 — 9:58am
    votes: null
    html: "<p>Pretty nice! And complex. <br> <br>You have a lot of variety in the serifs. Keep that divergence, but I think it needs a little bit of taming, like in the \"j\" I'd use the round/flat style (like in the \"f\") instead. The only glyphs that really don't work for me are the \"k\" (you need to terminate the leg much stronger) and the \"y\" (new tail). The \"g\" is great! <br> <br>The caps are really classy - nice going. The \"3\" needs weight. Your \"fi\"/\"fl\" ligs seem forced. <br> <br>Trapping is great, but it needs to be made consistent. Use Flower Power! <br><a href=\"http://www.themicrofoundry.com/ss_trapping1.html\" target=\"_blank\">http://www.themicrofoundry.com/ss_trapping1.html</a> <br> <br>BTW, your weight is slightly heavy for typical text. But your vertical proportions are great. <br> <br>Spacing: needs work, and is a hair loose overall (at least at that weight). <br> <br>This is a very promising design - I hope you take it all the way! <br> <br>hhp <br></p>"
    html_clean: "<p>Pretty nice! And complex. <br> <br>You have a lot of variety in the serifs. Keep that divergence, but I think it needs a little bit of taming, like in the \"j\" I'd use the round/flat style (like in the \"f\") instead. The only glyphs that really don't work for me are the \"k\" (you need to terminate the leg much stronger) and the \"y\" (new tail). The \"g\" is great! <br> <br>The caps are really classy - nice going. The \"3\" needs weight. Your \"fi\"/\"fl\" ligs seem forced. <br> <br>Trapping is great, but it needs to be made consistent. Use Flower Power! <br><a href=\"http://www.themicrofoundry.com/ss_trapping1.html\" target=\"_blank\" class=\"link-external\">http://www.themicrofoundry.com/ss_trapping1.html</a> <br> <br>BTW, your weight is slightly heavy for typical text. But your vertical proportions are great. <br> <br>Spacing: needs work, and is a hair loose overall (at least at that weight). <br> <br>This is a very promising design - I hope you take it all the way! <br> <br>hhp <br></p>"
