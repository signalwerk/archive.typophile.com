    html: "<p>This is indeed nice. <br> <br>I like all the detail you have put into it with the traps and attention to consistency. I agree with eduardo. <br> <br>I addition, I might focus my attention of the figures. Generally the color should fit somewhere between the caps and lower case. <br> <br>2: Modulation is wierd. <br>3: Modulation issues coming out of the waist (too thick too quick) <br>5: Modulation also odd. More horizontal emphaisis in the waist? <br>7: Light. Add some more to the taper at the bottom. <br>0: Dark. <br>1: Also, maybe a hair dark. <br> <br>fi: The terminal on the f is too much like a circle and doesn't flow naturally from the stem. <br> <br>Well done! </p>"
    html_clean: "<p>This is indeed nice. <br> <br>I like all the detail you have put into it with the traps and attention to consistency. I agree with eduardo. <br> <br>I addition, I might focus my attention of the figures. Generally the color should fit somewhere between the caps and lower case. <br> <br>2: Modulation is wierd. <br>3: Modulation issues coming out of the waist (too thick too quick) <br>5: Modulation also odd. More horizontal emphaisis in the waist? <br>7: Light. Add some more to the taper at the bottom. <br>0: Dark. <br>1: Also, maybe a hair dark. <br> <br>fi: The terminal on the f is too much like a circle and doesn't flow naturally from the stem. <br> <br>Well done! </p>"
