    html: "<p>Wow, very nice! <br>- E: unbalanced, top arm should be slightly shorter; <br>- F: the bar is too high; <br>- H: narrow; <br>- S/s: the middle looks too thin, and the bottom serif is too light; <br>- e: light; <br>- y: tail is weak; <br>- dieresis: heavy. <br> <br>Excellent work, Rodrigo. <br>Saludos!</p>"
    html_clean: "<p>Wow, very nice! <br>- E: unbalanced, top arm should be slightly shorter; <br>- F: the bar is too high; <br>- H: narrow; <br>- S/s: the middle looks too thin, and the bottom serif is too light; <br>- e: light; <br>- y: tail is weak; <br>- dieresis: heavy. <br> <br>Excellent work, Rodrigo. <br>Saludos!</p>"
