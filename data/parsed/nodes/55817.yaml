  html: |-
    <p>Is the consensus around here, when going through test edits with a newly exported font that the only way to ensure against corruption, and problems is to use some type of cache clearing program (such as FontNuke).</p>
    <p>I've run into some strange glitches such as missing glyphs showing up in my Illustrator glyph palette today… but I've also resisted clearing my cache every time and have just been deleting from FontExplorer X and re-importing…</p>
    <p>Is there a faster way than having to clear caches with either FontNuke, FE X, and restarting?</p>
    <p>Thanks,</p>
    <p>Mike</p>
