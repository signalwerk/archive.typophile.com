    html: <p>I've had no trouble with just outputting the new font version with another name. It doesn't matter what you call it while you're doing development testing, so I just append a revision number to the name, written out in English, and I haven't had any font conflicts that way. It also allows me to keep the earlier versions installed so I can easily make comparisons.</p>
