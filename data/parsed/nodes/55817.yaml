    html: |-
      <p>I find that as long as I get the naming right, and the Adobe apps don’t crash while I’m working, I don’t need to clear the caches at all. If you do find yourself needing to clear system caches and reboot, don’t load the test fonts in Fex, just output them directly to ~/Library/Application Support/Adobe/Fonts and restart the Adobe app to get the new fonts. If you have problems just delete the fonts, clear the application caches, and you won’t have to reboot. </p>
      <p>Obviously this strategy works better on a desktop with a fast drive than on a laptop where program loading is slower.</p>
