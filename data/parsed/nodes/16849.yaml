    html: |-
      <p>This is a nice use/creation of blank space, however, it seems to me that the sound seems to be coming out of the character rather than going to, partly because there is only one set of waves.<br>
      It is always worth considering possible uses a logo might be put to, for example, a music venue might have clothing and other merchandise alongside the main purpose of promoting the venue on posters, flyers and online – and when used on some items it will have to work with band/record label/sponsors logos/images, to do this it will need a strong presence, and be easy to pick out. To that end it is best to create a logo that works in one colour first and then develop it.<br>
      Tim</p>
    html_clean: |-
