    html: <p>The A is weak and comes out of nowhere compared to the other characters. It has no balance. You’d be better off just using an A from the font and making a symbol that goes with the type and could stand alone as a symbol. This is forced. Get away from the computer grab a marker and some paper and scribble. Then put the scribbles down go for a long walk come back and scribble again. Repeat this program until you get something that works.</p>
