      <p>Morten, I think this has character and presence. It has the required difference to stand in competition with other logos. The s and e look tilted which I feel is unecessary if that is the case. For the purposes of use and cleanliness the outline needs some work to remove some of the nicks and small bumps which are a) not going to reproduce at small size use and b) detract from the overall shape.</p>
      <p>David, I’m afraid you have misread the original logo for the r and the o is a diacritic å frequently used in scandanavian languages.</p>
      <p>Tim</p>
