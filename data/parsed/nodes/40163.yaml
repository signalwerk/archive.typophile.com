    <p></p><div class="imageWrap"><img src="http://typophile.com/files/2118718520_7b905daac8_5755.jpg"></div><p></p>
    <p>This 1991 episode from »Computer Cronicles« looks at the »fascinating and sometimes frustrating world of fonts« in the early years of desktop publishing. You can see the introduction of scalable fonts, the Adobe Type Manager, Multiple-Master, the TrueType technology and much more. See how you can change fonts on-the-fly! Fascinating! :-)</p>
    <p>Enjoy:<br>
    <a href="http://opentype.info/blog/2007/12/17/die-font-welt-anfang-der-90er/" title="http://opentype.info/blog/2007/12/17/die-font-welt-anfang-der-90er/">http://opentype.info/blog/2007/12/17/die-font-welt-anfang-der-90er/</a><br>
    (Be patient. May take a while until the video starts playing)</p>
