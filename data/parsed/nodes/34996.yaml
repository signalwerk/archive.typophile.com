    <p>I need help identifying the typeface of the corporate logo our company uses.  No one from our marketing communicaotins group knows the typeface or who developed it.  It’s been in use for over 20 years and it may well have been custom designed - but no one knows.</p>
    <p>The company is Medtox Labs - <a href="http://www.medtox.com" title="www.medtox.com">www.medtox.com</a> and our logo is posted their in several places.  </p>
    <p>Can any of you help?</p>
    <p><a href="mailto:cransom@medtox.com">cransom@medtox.com</a></p>
