      <p>Since Type 1 hinting is applied to stems, I'd assume these options control how FontLab identifies stems to be hinted. Features which are smaller than minWidth, larger than MaxWidth, or shorter than MinLength won't be treated as stems and thus will not be hinted. Features which fall within these parameters but which are outside of the stated aspect ratio presumably also won't be hinted.</p>
      <p>André</p>
