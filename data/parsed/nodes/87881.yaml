    html: |-
      <p>I'm not sure how 'Aspect Ratio' applies, so generally leave that at default. The others are fairly self-explanatory. Each is a setting that determines what the FL autohinter will treat as a stem for hinting purposes.</p>
      <p>MinWidth and MaxWidth respectively determine the narrowest and widest stems that will be hinted. Note that these are in absolute units per em, so if your font has a UPM of 2048, for instance, you'll likely want different values in here than if the font has a UPM of 1000.</p>
      <p>MinLength is the length of *straight* stem that will be hinted, so might be set to ignore very short segments. Note that the autohinter seems not apply this to curves, which are hinted or not based only on MinWidth and MaxWidth settings.</p>
      <p>In general, you want to set these values on a per font basis -- which is why the settings are part of Font Info and not an FLS options setting -- because they should reflect typical stem values in the font. You do not want to set the MaxWidth too large, because otherwise you will generate a lot of overlapping hints as FontLab. Obviously you want your MinWidth to be small enough to capture the thinnest stems that you want to be hinted, so in the case of a Light or UltraLight font this value will need to be small.</p>
