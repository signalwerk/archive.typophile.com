    <p>Mystified by the third box in the FontLab Hinting Settings section.</p>
    <p>There's only a single sentence about it that I could find in the FontLab manual.<br>
    I asked some folks at Adobe about this and, since they use tools developed in-house, they had no clue - not even an educated guess about what these settings do.</p>
    <p>In FontLab's Hinting Settings:</p>
    <p>- Standard Stems (T1 hinting)<br>
    - Additional hinting parameters</p>
    <p>This next one is the mystery:</p>
    <p> - T1 Autohinting</p>
    <p>(Gif image attached to this post and posted here, too: <a href="http://readableweb.com/rb/hintsettings/type-1-settings.gif" rel="nofollow">Type 1 Settings - FontLab</a></p>
    <p>It has one row for 'Horizontal' and another row for 'Vertical', with fields for:</p>
    <p>'MinWidth', 'MaxWidth', 'MinLength', and 'Aspect Ratio'</p>
    <p>Twardoch, anybody?  What do these settings do?</p>
    <p>I'm no stranger to trial-and-error experimentation, but a clue would be nice.<br>
    Besides, it's odd that there's nothing specific about it in the manual.</p>
    <p>Thanks.</p>
    <p>Rich</p>
