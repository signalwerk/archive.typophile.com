      <p>Hard to say, looks customized to me... They're using Gotham, Museo Slab and Vitesse on their website but I don't think they've started with one of these.<br>
      For what it's worth, I would probably go with <a class="freelinking external" href="http://new.myfonts.com/fonts/efscangraphic/folio-sb/extra-bold/" rel="nofollow">Folio Extra Bold</a>, skewing it around 15° and adding serifs to both /F and /X.</p>
