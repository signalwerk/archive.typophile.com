      <p>In case it helps your research, this type of serif is called “Latin”<br>
      (although often this includes serifs that don’t have totally sharp<br>
      ends, like Azuza*). BTW, a good example is Saracen: <a href="http://www.typography.com/catalog/saracen/index.html" title="http://www.typography.com/catalog/saracen/index.html">http://www.typography.com/catalog/saracen/index.html</a></p>
      <p>* See the description here:<br>
      <a href="http://www.myfonts.com/fonts/parkinson/azuza/" title="http://www.myfonts.com/fonts/parkinson/azuza/">http://www.myfonts.com/fonts/parkinson/azuza/</a></p>
      <p>Latin serif fonts were big in France in<br>
      the second half of the 19th century.</p>
      <p>hhp</p>
