    <p>Are there any typefaces that have 45 degree diagonal serifs like Zuzana Licko’s <a class="freelinking-external" href="http://www.emigre.com/EFfeature.php?di=105">Matrix</a>? I’d like to see the effect of this kind of serif on legibility before I start realising an idea which I want to excecute.<br>
    </p><div class="imageWrap"><img src="/files/MAT1_6592.gif"></div><p></p>
    <p>So far, the one’s I know of are:</p>
    <p>Matrix<br>
    Mitim</p>
