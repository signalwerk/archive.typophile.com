    html: <p>I would make the left stem of the A heavier and the loops a bit lighter. I'd also want both stems a bit closer at the top. I find that line inside the right stem a bit distracting. I associate an inscribed line like this with carving or etching, rather than the fluid line of a pen or brush.</p>
