    date_raw: 14 Feb 2011 — 10:42am
    date: 2011-02-14T10:42:00
    votes: null
    html: <p>I would make the left stem of the A heavier and the loops a bit lighter. I'd also want both stems a bit closer at the top. I find that line inside the right stem a bit distracting. I associate an inscribed line like this with carving or etching, rather than the fluid line of a pen or brush.</p>
  - id: 451952
    user_id: 45027
    user_name: Ed_Aranda
    user_path: null
    date_raw: 14 Feb 2011 — 2:29pm
    date: 2011-02-14T14:29:00
    votes: null
    html: |-
      <p>I read "Le" as well. I think if it were paired with the words, I would get it right away. But without context, it's reading wrong. </p>
      <p>I would try doing something different with the "loop" at the top of the left stem. To me, that is really what makes it look like an "L". Maybe have it curl in the other direction, or have it sweep in to the right, and taper toward the right stem as if it were going to join paths with the right stem.</p>
      <p>Its a pretty nice-looking mark though. Good luck.</p>
