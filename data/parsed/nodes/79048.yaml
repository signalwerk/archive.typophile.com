    votes: null
    html: |-
      <p>Dave I really like what you are doing but I'd like to keep my overall shape because of a few subtleties I have built into the design.</p>
      <p>The client works with weddings and by using the current form I'm able to reference two themes : a heart, and Infinity (both of which are indicative of marriage). </p>
      <p> The main concern is for it to look like an A, but these subtitles are important (even if they go unnoticed)</p>
      <p>So If there is a way I can tweak the current form to read "I'M AN A!" that would be great.</p>
      <p>Thanks so much for your input guys, it's really helping me out.</p>
