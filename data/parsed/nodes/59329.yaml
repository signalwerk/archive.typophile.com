      <p>Hi Arran,</p>
      <p>here’s a little list. Some of them have been designed before the 1920s.</p>
      <p>Venus<br>
      Berthold Akzidenz Grotesk<br>
      Aurora<br>
      Industria<br>
      Splendid Grotesk<br>
      Stempel Reform Grotesk<br>
      Berthold Block</p>
      <p>Monotype Grotesque<br>
      News Gothic<br>
      Franklin Gothic</p>
      <p>Issued rather at the end of the 1920s, popular in the 1930s:<br>
      Erbar Grotesk<br>
      Kabel<br>
      Futura<br>
      Neuzeit Grotesk<br>
      Gill Sans</p>
      <p>F</p>
