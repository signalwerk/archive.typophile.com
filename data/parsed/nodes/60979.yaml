    <p>Hi all.<br>
    I'm new here so please sorry if this question isn't related to this wonderful forum.</p>
    <p>I'm looking for a <strong>reasonably</strong> priced sans serif font (something like Frutiger or Myriad). I tried quoting for Segoe UI (<em>yes, I know that it's a reap off from Frutiger</em>) Ascendercorp who is responsible for providing licenses for it and they gave me price quote at $1500 per year for letting me distribute their font in my application. It's a bit too much for me - I'm trying to create a stylish application for personal home use and I'm doing only first steps to make it. I even didn't start selling it yet.</p>
    <p>So enough with my boring explanation. Does anybody know good Sans Serif font with license to distribute it in the commercial application with a price below $1000?</p>
    <p>Thanks in advance!</p>
