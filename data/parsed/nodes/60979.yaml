      <p>How exactly do you use the font in your application?</p>
      <p>Do you distribute it so that it gets installed like any regular font on the user's computer? Or do you embed it in your application so only the application itself can use it?</p>
      <p>And is it used interactively (the user can type in some text and it is displayed with the font), or non-interactively (only the application itself uses the font to display text)?</p>
      <p>If you answer these questions, it might become more clear what kind of licence you would need exactly.</p>
