    <p>I’d like to buy a t-shirt design from a typographer who knows what they’re doing because I like fonts, but I never buy font-only shirts at apparel outlets. It’s usually because their message is not original and the design is not original. Hopefully someone in this field of work can come up with a creative shirt to do with kerning, lorem ipsum, wingbats, or something that looks like a stylish tee for a typophile.</p>
