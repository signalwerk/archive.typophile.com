      <p>Anyone could type up Lorem Ipsum or the alphabet on an American Apparel shirt so I’m not going to pay Veer $20 a tee for them.</p>
      <p>I knew I would see some helvetica tees, but at least Khoi Vinh’s Hel-****-Vetica has a cool design. (not that I’d wear something with that language, but it’s still sold out anyways)</p>
      <p>That Ketchup And Mustard t-shirt is headed towards the art direction I like, but it looks familiar to me and do all typographers use condiments? ;)<br>
      I knew I’ve seen similar designs before.<br>
      <a href="http://www.threadless.com/submission/85700/Lorem_Ipsum_Dolor_Sit_Amet" title="http://www.threadless.com/submission/85700/Lorem_Ipsum_Dolor_Sit_Amet">http://www.threadless.com/submission/85700/Lorem_Ipsum_Dolor_Sit_Amet</a><br>
      <a href="http://www.threadless.com/submission/92057/Lorm_Ipsum_Dolor_Tubes" title="http://www.threadless.com/submission/92057/Lorm_Ipsum_Dolor_Tubes">http://www.threadless.com/submission/92057/Lorm_Ipsum_Dolor_Tubes</a><br>
      and I like this design better (but I’m not going to wear something that says “selfless” on it)<br>
      <a href="http://www.threadless.com/submission/73979/Selfless" title="http://www.threadless.com/submission/73979/Selfless">http://www.threadless.com/submission/73979/Selfless</a></p>
      <p>edit: After searching Threadless I came across what I think is the community’s best typography, <a class="freelinking-external" href="http://www.threadless.com/submission/10706/E_type/showmore,designs">“E”-type!</a>.</p>
