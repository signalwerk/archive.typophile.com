    html: '<p>Joel: The "response" symbol is used in church liturgies. The part spoken or sung by the pastor is called the "versicle" and is symbolized by ℣ (U+2123). The response, marked by ℟ (U+211F), is sung or spoken by the congregation. The "response" symbol is one up from what is called the "prescription take" symbol ℞ (U+211E).</p>'
