    <p>Wherre may I find a font that has a Bodoni style Rx for use on medical prescription forms?  I now create my own by placing a diagonal line through a Bodoni cap R, but would like to just use a single character.</p>
    <p>Is there a symbol font for medical caduceus available? (What is the plural of caduceus? Is it caduceuses?).</p>
