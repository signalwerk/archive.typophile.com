      <p>Hrant, it's one thing to have a conceptual critical framework, but its another to be so focused on it that one becomes blind to what is in front of you. Huronia is <em>not</em> a chirographic type design. It's stroke modulation patterns are sculptural rather than based on writing tools, and owe more to Dwiggin's approach than to anything Noordzijan. Go look at the illustrations again and examine closely the weight distributions and the transitions. It's one of the things that makes Ross a more interesting type designer than I am.</p>
      <p>The 'influence of the broad nib', as Nick characterises it, is limited to the fact that some strokes are thin and others thicker, which is reasonably novel in the context of Inuktitut, but several steps removed from the pen.</p>
