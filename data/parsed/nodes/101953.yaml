      <p>The chirographic nature of the Inuktitut italic did surprise me at first. But I presume that the Inuit do use their script for writing, and the italic script looked more like writing with a ball-point pen, as might happen in real life, than something that was dragged through hundreds of years of humanist scribal tradition in an attempt to obtain compatibility.</p>
      <p>Instead, the criticism I would direct at this font is that it costs money.</p>
      <p>In general, there's nothing wrong with the people who put forth the effort to design quality typefaces to earn a living from doing so. And, if the goal of this typeface is to enable government departments and major publishers and advertisers who wish to communicate with the people of Canada's First Nations in style, then there's nothing inconsistent with <em>that</em> goal and a price tag.</p>
      <p>However, it would be inconsistent if there were pretensions (there may not be; I may be getting that idea from the topic of the thread that led me to this one) of the typeface being in some way an attempt to contribute to the continued survival of indigenous languages. The speakers of which also tend to be impecunious, leaving them little in the way of resources for luxuries - except for a minimum of immediately gratifying ones to help them maintain their sanity in a grim situation of life - which is, of course, why their languages are in such great danger.</p>
      <p>But then, although it's better than nothing, how "alive" is a language that is only learned as a second language out of a sense of cultural obligation?</p>
