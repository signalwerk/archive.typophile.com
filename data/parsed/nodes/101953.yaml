      <p>I will point Ross here so he can clarify potential updates etc. We have a bit of a nomenclature mess with Huronia. His “Pro” (or Professional) is different from our “Latin Pro” and will be probably renamed. The first (Ross’ Pro) contains the full character set (incl. IPA, Greek, Can. syllabics, Cherokee, …), while the second (Rosetta’s Latin Pro) contains only Latin for European languages with all the typographic extras such as small caps, superiors, fractions etc.</p>
      <p>So far we released only Latin and Inuktitut as these are available in all styles. We will release the rest as soon as the other styles (non-Regular) are finished.</p>
      <p>Ross improved or had things improved in the European Latin part (e.g. ogoneks), and we produced the fonts again while subsetting them per script/language-region. The date on our web refers to release with us (2013), the PDF specimen (on our web too) states 2010–2013 which should be correct.</p>
      <p>David Březina</p>
