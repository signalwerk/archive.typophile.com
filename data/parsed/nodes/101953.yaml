      <p>Peoples are different. And there's no separating sociopolitical reality from good typographic decisions. Armenians are white, but we expect/need different things from our alphabet compared to Canadians for example. This sort of thing is hard to explain to people in power; you have to be threatened to feel it - you have to have kids who need convincing that learning their alphabet/language is important. There's nothing "academic" about that. What's academic is reveling in formalism for its own sake.</p>
      <p>You can't equate the Latin type scene with that of Inuktitut. The former is a 40-something guy still living with his parents (mommy calligraphy and daddy lettering). He goes on a non-committal date about once a year* and remains quite happy with his lot. The latter is about 10. Don't choose his spouse just yet.</p>
      <p>* There is an average of about one culturally progressive Latin type design per year. Considering the volume of Latin type design, all I can say is: whoop-de-doo.</p>
      <p>So to me Latin is indeed stuck, and I wouldn't want to see Inuktitut stuck next to it. Are there writing systems that are more stuck than Latin? When you factor in age, not that many. Maybe Chinese, with its chirographic ball &amp; chain. Arabic seems pretty stuck, but does enjoy a good deal of experimentation, largely out of frustration (which explains the generally poor results). Armenian is less stuck than Latin, because a greater proportion of Armenian fonts made today are culturally progressive. Take Arek for example (also at Rosetta).* Am I in love with it? No way - that Italic isn't my cup of tea at all. But it's part of us becoming less stuck. I believe in that enough to have a caused a rift between myself and a very prestigious Armenian type designer when I fought hard in support of Arek winning the Grand Prize at the Granshan 2010 competition. It would be nice to see a Native American fight for his script's future, not just its present.</p>
      <p>* <a href="http://armenotype.com/2010/10/interview-khajag-apelian/">http://armenotype.com/2010/10/interview-khajag-apelian/</a></p>
      <p>I'm not the only one who believes that Latin type is playing it too safe these days, generally content to ramp up the OpenType "arms race" rather than risk contemplating its cultural future. But for a threatened minority, the future is all we have.</p>
      <blockquote><p>this in itself will help promulgate variation</p></blockquote>
      <p>This is what I'm not sure about. Just like how many Cherokee think that any font that tries to improve on the archetype isn't really Cherokee, that it risks cultural dilution. This is because the original Cherokee design was such a powerful singularity - like a glass of dirty water in the desert. Luckily I think Huronia is far better than a glass of dirty water. But there remains the tinge of worry that people will follow the singularity that it is too blindly, making it harder to move beyond the chirographic illusion, notably when it wasn't even there before.</p>
      <p>Now, for anybody who doesn't see anything wrong with chirography in type, there's nothing to worry about - it's great to watch the little native dude drinking at the party.</p>
      <p>--</p>
      <p>Related: <a href="http://typophile.com/node/14818">http://typophile.com/node/14818</a><br>
      For one thing, the cultural magnanimity of Rimmer's Latin is inspiring.<br><a href="http://www.myfonts.com/fonts/rimmer/canadian-syllabics/">http://www.myfonts.com/fonts/rimmer/canadian-syllabics/</a></p>
      <p>hhp</p>
