      <p>I don’t think people will be responding to the fonts in an abstract, critical manner, but seeing them in the context of documents. And the designers of such documents will have an expanded palette to work with, enabling a more sophisticated kind of layout—for instance contrasting this face with a bold sans face such as Ross Mills has already designed—Pigiarniq. That capability raises the Inuktitut script to a par with Latin.</p>
      <p>Also, by stylistically harmonizing with a sophisticated Latin book face, more respect from the mainstream in formal kinds of bilingual documents.</p>
      <p>This is what I mean by eye opening—enabling native users of aboriginal languages to have a broader typographic vision at their disposal, and presenting a richer impression of aboriginal culture to Southerners.</p>
