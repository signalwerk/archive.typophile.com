      <p>Stuck? Latin is one of the least 'stuck' scripts I'm aware of. In any case, this verges on what in some circles might be called <em>white people problems</em>, or at best an academic discussion. In any case, if Inuktitut (syllabics) or Cree et al had 1/10,000th the variety available that Latin does, then I don't think there would be any complaints. As it stands, there is very little diversity, and the quality of typesetting and design has been very poor in general. Inuktitut does not have a huge number of users (both Latin-based and syllabic orthographies are used, so not all speakers use the latter), but has the benefit of being codified as the standard language of one Canadian territory, and fairly strong support in the communities who use it in Quebec. Cree has a comparatively large speaker base, but again many communities and areas opt to use a Latin orthography. There is little diversity in type for this and pretty much all other North American languages which don't use an orthography which happens to coincide with a European language.</p>
      <p>So, the issue for me at least is not worrying about whether the writing system or stylistic variation is stuck, but rather that options are made available that allow for better quality publishing and design overall—this in itself will help promulgate variation, be it more staid text faces or more exploratory display faces.  There is a contingent of mostly older individuals who do exhibit the attitude that Nick apparently encountered, in that their notion of what is acceptable harks back to the most prevalent publication of their youth, that being the bible, which was re-printed many times from the original 19th century version, and for many people for a long time was practically the only thing the saw in their own language. When new type was made, there was something of a lack of imagination, coupled with users' expectations that froze forms to more or less monolinear, plain forms (I don't think there have been too many fonts  where the forms were strictly geometric, but they may appear that way). Needless to say, most, if not all earlier digital fonts were not made by type designers, or anyone with more then a passing knowledge of type design, but rather were made by individuals whose motivation was more the necessity of simply having these languages show up on a computer screen.</p>
      <p>--<br>
      A couple of notes to clarify releases:<br>
      Any existing users with either the Standard or beta copies of the Tiro 'Pro' version will shortly receive updates from me that incorporate the changes made for this new release. Going forward, we will be making subset versions of the 'Pro' version along the lines of the Inuktitut-only font, so that users who only require support for a single language or small group of languages will have access to the font without being made to purchase the whole monster Pro version. Needless to say, there seem to be very few people who require the whole fonts, which support all languages of the Americas (along with most European languages, of course). We'll try and sort out nomenclature—Rosetta has a larger user base and has established their own general guidelines and naming scheme. Tiro's 'Standard' edition is more like others 'Pro' versions, but in this case there are not many licensees of the Tiro version of Huronia, so I don't think there should be much confusion for the existing user base.</p>
      <p>The subsetted fonts will be targeted to specific orthographies or groups of orthographies (eg. Salishian may be grouped into a single font) and will be made available at a reasonable cost, generally in the $10–$15 range. I don't have an exact list of what these fonts will be in addition to Inuktitut, Cherokee and Cree, as its a bit of a complicated subject in some cases.</p>
