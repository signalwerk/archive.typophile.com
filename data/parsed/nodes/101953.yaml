      <p>{Please see my third post of April 9, 2013.}</p>
      <p>Although I wouldn't call Inuktitut fundamentally geometric (at least not more than Latin could be) and Huronia does look enviably polished and tasteful, I also have to think that avoiding chirography can help scripts free of a chirographic background (of which sadly there are very few) leapfrog Latin into more promising territory; by the same token there is something vaguely backwards (so to me not "eye-opening") about making a chirographic Inuktitut font.</p>
      <p>An Inuktitut extension to Fenland would be awesome.</p>
      <p>hhp</p>
