      <p>Hrant, I think you're chasing your own tail, but that's not a judgement—I've seen others perfectly entertained doing this. I'm not in general disagreement with your sentiment, but I think the nature of your discussion is in conflict with what the priorities ought to be in the present and immediate future. </p>
      <p>Yes, it would be <em>nice</em> for a script's future to be fought for. However, the only thing that is going to enable that is the future of the language, so what would really be nice is a concerted fight for that language—and as far as it relates to a writing system this implies publishing. If anyone wishes to support the continued existence of the America's (or anywhere else for that matter) truly threatened, endangered languages, then first you should look to creating—or assisting to create—written material for those languages*. Otherwise, both the language and the novel writing system becomes nothing more then a anthropological curiosity. Then it truly is academic.</p>
      <p>In any case, this is a release thread. If more discussion on such subjects is wanted, perhaps a different thread should be used.</p>
      <p>*Of course, oral literatures are the foundation of American languages, and play an important part of continuing use, but we're talking about scripts and fonts, so are principally concerned with the transcription process and presentation of language. And, although literature of any sort is all well and good, the future of some languages may now be rooted in current modes of communication: kids texting in their grandparent's language.</p>
