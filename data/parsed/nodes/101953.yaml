      <p>So, Tiro will continue? For me, that's good news. I never know when a customer (I set type) will need a language supported, and often, neither do they, even with the manuscript in hand.</p>
      <p>Here's how it works after all the theorizing is done: An author "does something." Maybe a hacked together characters (syntactically inaccurate), or a code (\whatIwant), or something hand-drawn. The editor passes on the need, usually not expressed as a Unicode character. If I'm lucky, or the designer outright, I get a say in the typeface selection.</p>
      <p>BTW, first proof is usually due in three weeks. There are 20+ pieces of bad art to impove. There is the whole book to set, and probably several characters needed that were not mentioned, which we discover along the way.</p>
      <p>If there is a font available like Huronia, I'll buy it. As I have...</p>
