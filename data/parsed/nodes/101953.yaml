      <p>Interesting to see the inﬂuence of the broad-nibbed pen in the Inuktitut.</p>
      <p>I recall designing a wordmark for an exhibition of Inuit art in the early 1990s, and I thought it would be cool to harmonize Latin and Inuktitut by giving both a chirographic treatment (to match the organic quality of the exhibits). I forget the Latin face I was using, it wasn’t extreme—Palatino perhaps—and no serifs on the Inuktitut). However, this idea was nixed by the client on the grounds that Inuktitut script was fundamentally geometric.<br>
      (A topsy-turvy version of the argument that Greek is essentially chirographic.)</p>
      <p>Props to Ross for making it happen, and so nicely done.<br>
      This will open a lot of people’s eyes.</p>
