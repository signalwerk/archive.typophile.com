      <p>I don't see any inconsistency or pretense in this case. I suspect most use will be related to some project or another (publishing print material), and offering a font at a reduced rate would be no different then the printer offering their services at a reduced rate if they felt the project warranted it. In either case, the fact that a product costs money (not much, I might add) does not mean its not still contributing. </p>
      <p>It would be a slippery slope if we tried to universally associate product value to every market or economic segment, but even so, the price is in line with the difference in median income from aboriginal Canadians and non-aboriginal. This is why the fonts are $10–$15 instead of something like $20–$25. Those with little or no money should not be purchasing fonts, and when push comes to shove, I'm sure I'll still be giving away free licenses. It is not the poorest in any such community that is responsible for paying for the production of printed material, so I'm a bit confused by this assertion. In my experience, users are quite happy to pay a reasonable fee to get a quality font that properly supports their language, where other free fonts fall short. In most cases, those free fonts are still out there for those that need them.</p>
      <p>As far as Inuktitut is concerned, we already provide other fonts that are free to end users. I have actually attempted to have a development and release model that would allow for the font development to be funded and have free versions available by having government or other other organizations purchase a distribution license, which would subsidize the free version. Thus far, no one has taken me up on this for Huronia, and so we are left with a nominal license fee in place, which incidentally I can assure you is not going to net any profit in the scheme of things.</p>
