      <p>My search through Part 14 of the Guide came up with a VERY close approximation that is also a free font. It is called ’Dam’  by Matthew Austin Petty from <a>Disturbed Fonts</a>. In my opinion this would be a great substitute for the SpongeBob type you were looking for. It’s certainly closer than the one on that other site in my previous post. I hope this works for you.</p>
      <p>- Mike Yanega</p>
