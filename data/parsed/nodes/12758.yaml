    html: |-
      <p>I have a suspicion that the square SpongeBob type sample you showed is a custom font, since this is about as highly commercialized a cartoon as anything outside of Disney. My main reason for saying this is that searches for information about SpongeBob fonts have only led me to some vaguely similar styles, such as the free fonts at <a href="http://members.outpost10f.com/~lindax/spongebob/fonts.html" terget="new"> this site</a>.</p>
      <p>If that free font isn't close enough, be prepared to search through all the S fonts at all the free sites you know, for font names that start with Sponge or Square.</p>
      <p>For commercial designs that may have similar styles, I would look at Device fonts, Font Diner, Chank and Fonthead. </p>
      <p>Just in case, I am looking in <a href="http://bowfinprintworks.com/Script14Pg1.html" target="new">Part 14 (Strange, Distressed Scripts), of the Script Font ID Guide</a>, but I do not expect to find this font.</p>
      <p>- Mike Yanega</p>
