    <p>I think the following might be of some interesting to both type and web designers. </p>
    <p>The context is the appearance of @font-face embedded fonts on Windows with ClearType disabled, and Standard smoothing used instead. As you probably know this tends to make a few fonts look somewhat anorexic and illegible. After a bit of experimenting I found two simple CSS tricks that can help with this issue. Clearly nothing can be done about reshaping individual letters, but their appearance <em>can</em> be improved. Have a look:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/cleartype_5892.png"></div><br>
    <code></code><p></p>
    <p>From top to bottom:</p>
    <ul>
    <li>ClearType
    </li><li>Standard smoothing
    </li><li>Standard smoothing, CSS trick #1
    </li><li>Standard smoothing, CSS trick #2
    </li></ul>
    <p>Trick #1 is to place a semi-transparent copy of the text on top of the original. Here, for example, the opacity is set to 80%. Optimal opacity value seems to depend on the text color, the darker the color - the more transparent the overlay needs to be.</p>
    <p>Trick #2 is to use text-shadow with 0px blur radius and slightly lighter color. This is limited to every normal browser that supports text shadows, meaning that it won't work in the IE.</p>
    <p>Lastly, this can be combined with JavaScript detection of font smoothing to conditionally enable these tweaks depending on user's anti-aliasing setting. Again, on normal browsers it is possible to tell ClearType, Standard and no smoothing apart. On IE it is far more murkier. It has <em>fontSmoothingEnabled</em> variable, but it is effectively useless as the IE does not smooth fonts if ClearType is not enabled, and yet it would set this variable to <em>true</em>... erm, yeah.</p>
    <p>In any case, it's a curious hack that may come handy in some cases. Thought I'd share it.</p>
    <p><img src="http://swapped.cc/img/sig.png"></p>
