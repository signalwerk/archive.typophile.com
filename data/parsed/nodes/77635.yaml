    html: |-
      <p>@Sii Daniels</p>
      <p><em>Sadly the IE engineers report that it is not possible to detect the CT state.</em></p>
      <p>Er, really?</p>
      <p>See <a class="freelinking external" href="http://msdn.microsoft.com/en-us/library/ms724947%28v=vs.85%29.aspx" rel="nofollow">SystemParametersInfo</a>.</p>
      <p>SPI_GETFONTSMOOTHINGTYPE</p>
      <p><em>Retrieves the type of font smoothing. The pvParam parameter must point to a UINT that receives the information. The possible values are FE_FONTSMOOTHINGSTANDARD and FE_FONTSMOOTHINGCLEARTYPE.</em></p>
      <p><a class="freelinking external" href="http://mxr.mozilla.org/mozilla-central/source/gfx/thebes/gfxDWriteFonts.cpp#93" rel="nofollow">Code example</a>.</p>
      <p>The graphics API common to all browsers on XP is GDI and GDI explicitly allows content to be rendered with ClearType enabled, even if the OS-level setting is turned off.  That's what IE7/IE8 do for all fonts and that's what Firefox 4 does for downloadable fonts on XP. Such use does <strong>not</strong> alter the system-level default.</p>
      <p>John Daggett</p>
