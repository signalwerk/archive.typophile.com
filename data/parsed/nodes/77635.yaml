      <p>Hi,<br>
      I agree the trick #1 is too dirty.<br>
      In addition, I think web font rendering is an OS level issue.<br>
      Of course it is frustrating to look at your type (or the one chosen for your design project) poorly rendered on the web, but it is not a very good idea to alter the user’s environment and standard interactions, including font rendering.<br>
      Anyway the user will see <em>all</em> texts in a crappy way, so she/he will be used to it. And I’d even say if she/he keeps bad rendering settings or uses Windows based pcs ;-) , maybe she/he does not care at all about this issue.<br>
      If I’d was really concerned with on-screen text legibility, I’d approach the problem from the opposite side, checking which font sizes are rendered the best way for Windows platforms.</p>
