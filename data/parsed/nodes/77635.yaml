      <p>Just to clarify - I am not suggesting that this is an overly practical approach to improving font legibility, especially considering how distorted the actual letterforms are (see 'go' and 'e' in the above example). This is more a curious finding trying to deal with another problem - not being able to tell if the Internet Explorer visitor is using Standard or ClearType smoothing. </p>
      <p>Based on a couple of weeks of scouting TypeKit, WebFonts, WebType, FontSpring and other places there appears to be no fonts available for @font-face licensing that look decent with Standard smoothing. For this reason the detection of an exact smoothing method is essential to deploying @font-face designs in production (to provide a reliable fall back to web-safe fonts when the CT is off). It <em>is</em> a deal breaker.</p>
