      <p><cite>People are lazy, and so defaults are sticky.</cite></p>
      <p>Although that is true, often they simply don’t know, that they can profit from changing the defaults – and not only when they visit your website. You naturally cannot expect, that they install anything only because of <em>your</em> website. So I think, that it won't do any harm to teach them in a friendly and motivating way. And if the visitor ignores your before-and-after-images, it may be, that he either is not really interested in the content of your website, or he is contented enough with the actual look of your website. You could store some instructions on a central place of your website, how to improve the look (of your and other websites) with Cleartype. Not only with Cleartype, but with the Cleartype tuner, which I have installed on XP. From a certain point of view you support lazyness, if you contaminate the markup. It is comparable with the following: One of your friends does not wear gloves, when he changes the tyres of his car. And you give him your white shirt for cleaning his hands.</p>
