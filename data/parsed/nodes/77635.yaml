      <p>The advantage of using standard smoothing is that it consumes less CPU resources than ClearType. And turning off anti-aliasing completely uses less CPU resources yet.</p>
      <p>For a web site to attempt to subvert these user settings, so as to force its appearance to the originator's quality standards, regardless of the proportion of the viewer's CPU time that the viewer wishes to allocate to its rendering is not something that I would wish browser manufacturers or standards bodies to facilitate.</p>
      <p>At least people have a choice of whether or not they wish to install or enable Adobe Flash Player on their computers.</p>
