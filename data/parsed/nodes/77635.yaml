      <p>Setting the user’s browser rendering to CT when a user has aliasing set in the OS, is fine by me. Setting a user’s browser rendering to what you show, is the reason people are leery of letting web developers loose on rendering options. The OEMs making the None/CT smoothing decision for the user, have been doing so soundly, based on desktop performance from the given screen device. The web and @ff on the other hand, require descent to good anti-aliasing, or all the type looks either crusty from lack of aliased hinting, or bland from being forced to a skeleton by “good” aliased hinting. </p>
      <p>Your method functions poorly for text over a range of sizes and styles, and I don’t think you are helping reading, or readers transition to anti-aliasing.</p>
