      <p>Something needing to be tricked doesn't seem like an open alternative for web font rendering to color sensitive users or for web developers who need shades of a color from their type, as opposed to colors ala CT, when designing with type on color and photographic backgrounds. Even if you leave the million or so web designers out of it, color sensitive users are said to be 6% of 700,000,000.</p>
      <p>Even bigger than both of those mobs times four though, is the market perched on aliased fonts. And the best thing to lure them to a modern branch is with well hinted fonts for standard windows rendering, which are making their appearance as more fonts get hinted. It's a shame that it's not easily possible for web developers to combine such high quality font assets with CSS to more narrowly standardize the rendering across windows browsers and improve the user's web experience.</p>
