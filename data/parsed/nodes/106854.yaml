      <p>First: even with a <a class="freelinking external" href="http://www.tessamulford.com/web/uploads/NewYork.jpg" rel="nofollow">better sample</a>, wasn't able to identify it. May be another newspaper/magazine woodmark? Reminds me of <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/birch" rel="nofollow">Birch</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/mti/latin" rel="nofollow">Latin Condensed MTI</a> but that's far from being even loosely similar...<br>
      Second: 'The New York Times' woodmark, close to <a class="freelinking external" href="http://www.myfonts.com/search/Engravers+Old+English" rel="nofollow">Engravers Old English</a><br>
      Third: 'The New Yorker' woodmark, <a class="freelinking external" href="http://www.myfonts.com/search/New+yorker" rel="nofollow">New Yorker</a> is derived from<br>
      Fourth: 'NEW YORK POST' woodmark, see <a class="freelinking external" href="http://typophile.com/node/106792" rel="nofollow">latest discussion</a></p>
