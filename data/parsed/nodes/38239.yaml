    <p>Hi,</p>
    <p>This is a logo for a young company formed by students, who want to apply the theorical concepts they learned in the real world.</p>
    <p>They will do Accounting, International Commerce, Marketing, Business Communication, and Administrative Assistance and Translation.</p>
    <p>The logo should show the integration of young professionals in the business world. It should have a clean and corporate look too.</p>
    <p>This logo is still a draft, but what do you think?<br>
    Any comments will be very appreciated.</p>
    <p></p><div class="imageWrap"><img src="/files/logo-ije-20071019-02_6422.png"></div><p></p>
