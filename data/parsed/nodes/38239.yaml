      <p>The current left-adjustment of the three words on the right isn’t working well. First, the “i” in “júnior” is almost colliding with the “p” above. Second, the line space between the bottom two lines is optically larger than between the top two lines, because there’s no ascender in “empresa” and almost no descender in “júnior”.</p>
      <p>As a solution, I’d try shifting the words left and right a bit, until the line spaces appear somewhat evenly distributed.</p>
