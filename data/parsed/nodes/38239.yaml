      <p>I think “i” and “j” are a bit too close. Normally this kerning might be OK, but in this case the “arms” of the two letters are drawing prime attention, and the closeness is in sharp contrast to that between “j” and “e”. I’d recommend as much as doubling the distance between “i” and “j” (measured at the closest point).</p>
      <p>Also, I’d hate to sound bitchy, but I feel you’ve overdone it with the “r” — now it looks a bit to far to the left. I’m not quite sure with “p” and “r”, but “a” definitely looks more to the right than “r” to me.</p>
