    <p><strong><a href="http://www.sudtipos.com/downloads/Brownstone-Specimen.pdf" rel="nofollow">BROWNSTONE SANS PDF SPECIMEN</a></strong>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Brownstone-Specimen-typhop_3948.jpg"></div><p></p>
    <p>A few days ago we were very happy to announce the release of <strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000598" rel="nofollow">Brownstone Sans</a></strong> typeface. </p>
    <p>Now we are happy to introduce the <strong><a href="http://www.sudtipos.com/downloads/Brownstone-Specimen.pdf" rel="nofollow">Brownstone PDF Specimen</a></strong>. Usually we like to invite young illustrators, photographers, typographers to collaborate on some material to preview the new designs. (e.g. <a href="http://www.veer.com/download/pdf/businesspenmanship_specimen.pdf" rel="nofollow">Business Penmanship PDF</a>)</p>
    <p>The Brownstone Sans is a very special specimen for us because it was written and photographed by Jon Parker, a good and personal friend who actually lives on Brooklyn.</p>
    <p><strong><a href="http://www.sudtipos.com" rel="nofollow">Visit Sudtipos</a></strong>.</p>
