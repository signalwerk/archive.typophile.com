    <p>Now we are happy to introduce the <strong><a href="http://www.sudtipos.com/downloads/Brownstone-Specimen.pdf" rel="nofollow" class="link-external">Brownstone PDF Specimen</a></strong>. Usually we like to invite young illustrators, photographers, typographers to collaborate on some material to preview the new designs. (e.g. <a href="http://www.veer.com/download/pdf/businesspenmanship_specimen.pdf" rel="nofollow" class="link-external">Business Penmanship PDF</a>)</p>
