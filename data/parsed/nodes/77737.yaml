  html: |-
    <p>So I am currently performing an exhaustive search over the internet to find an internship calling my name in NYC. I'm a senior at the Savannah College of Art and Design and am looking for an internship over the Summer of 2011. I will do next to anything (my soul is up for bid on ebay as we speak) to further my passion for graphic design in NYC. I am very interested in web design, typography, logo design, and package design...but am willing to turn to the dark side (joke) :) advertising if I needed.</p>
    <p>Anyone have any advice I can take and run with? Or maybe even some comments?</p>
    <p>My portfolio: <a href="http://www.cargocollective.com/eew" title="www.cargocollective.com/eew">www.cargocollective.com/eew</a></p>
    <p>thanks a bunch, guys!<br>
    -Erik</p>
