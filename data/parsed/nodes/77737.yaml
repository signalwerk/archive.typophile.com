    html: "<p>For those seeking work in a city that they don't live in, especially if that city is NYC or LA: Recognize that many potential employers will reject you based on your online portfolio. Both the work in the portfolio and the portfolio itself as a design project of its own. It's very easy for experienced designers to notice the warning signs of a lazy designer. And people who look like they might be lazy designers — true or not — go straight to the discard pile.</p>"
