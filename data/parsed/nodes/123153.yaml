    <p>I am looking for sans-serif  fonts where the_R_ has a high waist and straight leg similar to Nathaniel Winter-Hébert's Simon Sans as shown in this specimen <img src="/sites/default/files/old-images/SimonSansAsRPEBHSMWX_5855.jpg"><a href="http://tendollarfonts.com/products/simon-sans">http://tendollarfonts.com/products/simon-sans</a><br>
    The font ID programs apparently do not check for this feature.</p>
    <p>Thanks<br>
    Don</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/SimonSansAsRPEBHSMWX.jpg" width="438" height="260" alt="">
