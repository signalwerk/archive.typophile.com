      <div class="comment-spam-body"><p>Thanks Riccardo, for the additions.<br>
      For the time being I am including fonts that are high-waisted in a less emphatic way than Simon-Sans and Baton, even though those are the prizes. </p>
      <p>A tricky factor is that the more the leg sticks out, the more it suggests a high waist _R_, even the bowl is not shifted higher than usual. So careful examination is needed to determine if these fonts are actually high-waisted.</p>
      <p>The additional fonts as samples for comparison:<br>
      Futura<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/FuturaBTAsRPEBHSMWX_6581.gif"></div><br>
      Galano Classic Medium<br>
      <div class="imageWrap"><img src="http://typophile.com/files/GalanoClassicMedAsRPEBHSMWX_4228.gif"></div><br>
      Riga<br>
      <div class="imageWrap"><img src="http://typophile.com/files/RigaAsRPEBHSMWX_4652.gif"></div><br>
      Alpha<br>
      <div class="imageWrap"><img src="http://typophile.com/files/AlphaAsRPEBHSMWX_4192.gif"></div><br>
      Steagal<br>
      <div class="imageWrap"><img src="http://typophile.com/files/SteagalAsRPEBHSMWX_5565.gif"></div><br>
      Don<p></p>
      </div>
