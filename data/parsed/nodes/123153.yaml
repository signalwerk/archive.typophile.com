    <div class="node-spam-content"><p>I am looking for sans-serif  fonts where the_R_ has a high waist and straight leg similar to Nathaniel Winter-Hébert's Simon Sans as shown in this specimen </p><div class="imageWrap"><img src="http://typophile.com/files/SimonSansAsRPEBHSMWX_5855.jpg"></div> <a href="http://tendollarfonts.com/products/simon-sans" title="http://tendollarfonts.com/products/simon-sans">http://tendollarfonts.com/products/simon-sans</a><br>
    The font ID programs apparently do not check for this feature.<p></p>
    <p>Thanks<br>
    Don</p>
