    html: |-
      <p>Thanks Riccardo, for the additions.<br>
      For the time being I am including fonts that are high-waisted in a less emphatic way than Simon-Sans and Baton, even though those are the prizes. </p>
      <p>A tricky factor is that the more the leg sticks out, the more it suggests a high waist _R_, even the bowl is not shifted higher than usual. So careful examination is needed to determine if these fonts are actually high-waisted.</p>
      <p>The additional fonts as samples for comparison:<br>
      Futura<br><img src="/sites/default/files/old-images/FuturaBTAsRPEBHSMWX_6581.gif"><br>
      Galano Classic Medium<br><img src="/sites/default/files/old-images/GalanoClassicMedAsRPEBHSMWX_4228.gif"><br>
      Riga<br><img src="/sites/default/files/old-images/RigaAsRPEBHSMWX_4652.gif"><br>
      Alpha<br><img src="/sites/default/files/old-images/AlphaAsRPEBHSMWX_4192.gif"><br>
      Steagal<br><img src="/sites/default/files/old-images/SteagalAsRPEBHSMWX_5565.gif"><br>
      Don</p>
