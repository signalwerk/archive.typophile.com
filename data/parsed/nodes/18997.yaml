      <p>I really, really like it. Very nice. Even as it is now it would already make for a nice lettering logotype.</p>
      <p><em>( The only things that would slightly bother me may be the bow / top loop of the 'h' and the 'or' combination. I think the 'problem' with the 'or' may be that it may seem / appear too thin, compared to the other connections. And the connection and 'loops' could be slightly 'smoother' as well. And something bugs me about the first 'e' but I cant really define what that may be. )</em></p>
      <p>Dav</p>
