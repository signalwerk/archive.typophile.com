    <p>I've been reading a lot on Typophile and usually learn a lot from all the experienced people posting here. So, now it's my turn to post for the first time.</p>
    <p>I'm working on a logo for a Norwegian incentive travel agency - Authenticore(.no) - which focus on the experience and personal development one get from authentic meetings between people - as opposed to luxurious 'vacations', which are the rule more than the exeption in the incentive travel world.</p>
    <p>I want to make a kind of 'signature', with a human touch. Not having much experience with handdrawing logos like this, I've come to a point where I have become quite blind, and therefor need some feedback. Thank you very much!</p><div class="imageWrap"><img src="http://typophile.com/files/Authenticore1.png"></div><p></p>
