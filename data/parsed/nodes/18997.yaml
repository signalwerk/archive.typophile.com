      <p>at first glance, it's a nice start. My personal opinion, and someone with greater knowledge cam come along and correct me later, is the A bar weight seems to be going in the wrong direction. It would seem to me that the left should be thicker as it's the start of the stroke and therefore more ink would gather there. The tail on the _u_ pulls away too far up and out for my liking. I haven't made up my mind on the _th_ combination and the counter in the second _e_ seems larger than in the first.</p>
      <p>Overall though I quite like it. I hope you get more insightful feedback.<br>
      Cheers!</p>
