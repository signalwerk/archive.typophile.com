      <p>Just for comparison have a look at <a href="http://www.myfonts.com/search?search%5Btext%5D=brody" rel="nofollow">Brody</a> or similar. The stress on the e is wrong, th should probably join from the bottom of the t's vertical to the top of the h rather than from the bar. Generally the letters seem to get lighter as the word goes on, adjusting the kerning should answer some of that. I would increase the x-height of the r to bring the vertical to the same height as the others, the 'or' ligature is too light. The A's uprights are a little bowed and have a start-of-the-stroke which isn't reflected in the other characters. I would also look at more horizontal bars on the t, presently it gives the feeling that the logo should raise up on the left, something that is exacerbated by the low stroke on the A.<br>
      Tim</p>
