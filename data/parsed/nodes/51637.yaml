      <p>I saw your posts and will respond, b"n.</p>
      <p>As administrator, I had to approve them first, before the posting was visible. A person could become a power freak.</p>
      <p>You wrote interesting things. I studied Metafont in the mid-eighties and thought it was brilliant. Sinclair QL even years earlier had an even more brilliant font technology that would put MetaFont to shame. It had no documentation, bo name, but was Sir Clive's toy for the QL.</p>
      <p>Do you knw the QL (Quantum Leap - though arrogant, it fit in the eighties: a Motorola processor like a Mac, a DOS interface, and Unix-like multi-tasking! Too bad the tape-based disk drie the size of a matchbox killed it. I regret I gave my nephew it.</p>
      <p>I once typeset a few chapters on Maimonides and transfered the data to CompSet typsetter, to the amazement of the Israeli distributor. Some guy in Israel made it work in Hebrew, too. Amazing.</p>
