      <p>It says there:<br>
      <cite>The first book printed entirely in Hebrew letters, Rashi's commentary on the Pentateuch was printed in Rome about 1470, only 14 years after Gutenberg printed his bible. Within a decade Hebrew printing had spread from Italy to Spain and Constantinople with the press of Gerson and Joshua Solomon at Soncin near Cremona being the most active.</cite></p>
      <p>Here are a few landmark dates and events in early Hebrew printing:<br>
      1475 - First dated Hebrew work is printed in Reggio di Calabria<br>
      1482 - First Spanish Hebrew book printed in Guadaljara<br>
      1492 - Expulsion from Spain and destruction of Hebrew books<br>
      1503 - David Nahmias begins printing in Constantinople<br>
      1512 - Beginning of Hebrew printing in Salonika<br>
      1475 - 1530 The Soncinos print in Mantua, Naples, Brescia, Cassal Maggiore, Barca, Fano, Pesaro, Ortona, Rimini and Constantinople<br>
      1513 - Press of Gershon Solomon Cohen in Prague prints prayer book<br>
      1520 - Daniel Bomberg of Venice prints the first complete Talmud edition. The Venice community sends a copy to Henry VIII of England as a gift<br>
      1533 - Hayim ben David Schwartz moves his press from Prague to Augsburg Germany<br>
      1542 - Beginning of censorship of Hebrew books by the Roman Curia<br>
      1550 - Giustiniani and Bragadini enter into competition with Bomberg in Venice<br>
      1554 - The burning of the Talmud at Ferrara and closing of the Venice printers<br>
      1556 - First edition of Zohar is saved in Mantua but Zioni commentary is burned<br>
      1565 - Printing resumes in Venice and first edition of Shulkan Aruch appears<br>
      1569 - Isaac ben Aaron of Prossnitz prints in Cracow<br>
      1578 - The Talmud begins to appear in Basel<br>
      1627 - Gutel the daughter of Leb Setzer prints in Prague<br>
      1627 - Menasheh ben Israel and Daniel De Fonseca begin printing in Amsterdam<br>
      1658 - Uri Phoebus begins printing in Amsterdam and in Zolkiev in 1692<br>
      1697 - Jacob Proops begins printing in Amsterdam</p>
