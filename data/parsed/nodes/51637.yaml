    <p>Italy has always been a key player in Hebrew type design, and also was the place of modern-day Hebrew printing.</p>
    <p>The landmarks of Hebrew printing are listed here: <a href="http://www.jerusalembooks.com/jap/bookb1.htm" title="http://www.jerusalembooks.com/jap/bookb1.htm">http://www.jerusalembooks.com/jap/bookb1.htm</a>.</p>
