    html: |-
      <p><em>That’s some serious overshoot on the apex of A in Modern Roman.</em></p>
      <p>That is the CAS version for signs. There is an alternate "A" in the extended range (137). The "A" in the DTP version is more of a traditional form. The CAS "A" is more in the tradition of the original Becker display from <em>Sign of the Times</em> magazine.</p>
