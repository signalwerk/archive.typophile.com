      <p>Hey,<br>
      The name of this font is "Hameashen Serif" (The smoker Serif) and it was designed by Danny Meriav AKA "HATAYAS" (the pilot), Who is part of a couple that call themselves "The Guild" or in Hebrew "Hagilda".<br>
      <a href="http://www.hagilda.com" title="http://www.hagilda.com">http://www.hagilda.com</a></p>
      <p>You can find the font in here on page 15:<br>
