      <p>pearlstreet:</p>
      <p>Anti-Pixel badges are easy to make. It’s 80x15 pixels, and people typically use the silkscreen typeface that it freely available online. As noted by Eben above, if you’re not careful, the font’s kerning will be ugly, but it is free after all.</p>
      <p>Eben:<br>
      I really like Pixen. I just wish that you could use type. There’s no support for glyphs, or even rudimentary type. A shame. It’s open source, so maybe we nudge someone like Raph to help them out with that :)</p>
