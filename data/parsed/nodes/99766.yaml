    html: <p>Is this really a spread that was printed in <em>Rolling Stone</em>? Not only was <em>surely</em> misspelled in the headline, but none of the apostrophes, em dashes, or en dashes output correctly. This would be unusually sloppy in any <em>Rolling Stone</em> article, but in an article about type design, it is, as Vizzini would say, inconceivable!</p>
