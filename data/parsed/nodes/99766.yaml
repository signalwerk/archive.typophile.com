    html: <p>It's not Miller. Compare Miller's <strong>F, W, e, R,</strong> and <strong>J</strong> with those in the sample. Miller is a Scotch Roman revival, with a fairly vertical stress. Even at such low resolution, it's apparent that the text in the sample is an Old Style face with an oblique stress, similar (but not identical) to Goudy's Californian type.</p>
