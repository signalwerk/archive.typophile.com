    date_raw: 17 January 2013 - 8:05pm
    votes: null
    html: <p>The only time I read <em>Rolling Stone</em> these days is in the barbershop, but if memory serves, they have a standard face that they use for the text of all their articles, regardless of the subject. It's an Old Style face, very likely a proprietary version developed just for <em>Rolling Stone</em>. The Goudy article loks like someone imitating the style of <em>Rolling Stone</em>, rather than actual published pages, so I'm not 100% sure the text face in this sample is the same one they use in the magazine.</p>
