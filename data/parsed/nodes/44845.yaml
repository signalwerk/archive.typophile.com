      <p>I’m pretty happy with the CSS3 Web Fonts draft. If only browsers would start to support it. </p>
      <p>Wishlist:<br>
      -automatic hyphenation (something like »language:de-at« in a CSS rule.The browser would then do the hyphenation according to the specified language)<br>
      -a CSS-based system for protecting commercial webfonts (limiting the use of a font to a certain domain)&lt;/<!--
