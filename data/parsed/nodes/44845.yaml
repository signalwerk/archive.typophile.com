  html: |-
    <p>We all know that <a href="https://web.archive.org/web/20080704191728/http://webtypography.net/sxsw2007/" target="external">Web typography sucks</a>, but it’s like the weather: everybody complains, but nobody does anything about it. Well, now <em>you</em> can. As a member of the World Wide Web Consortium’s CSS Work Group (the group the defines how styles work in Web pages), I recently took on the duty of advocate and editor for <a href="https://web.archive.org/web/20080704191728/http://www.w3.org/Style/CSS/current-work#fonts" target="external">CSS Fonts</a> (how fonts are displayed) and <a href="https://web.archive.org/web/20080704191728/http://www.w3.org/Style/CSS/current-work#webfonts" target="external">CSS Web Fonts</a> (downloadable fonts). These specifications define the core styles for Web typography.</p>
    <p>By and large the CSS specifications have not had a lot of input from designers, the very people who use them every day. Let’s change that! I’m working on the revised specifications to present at a CSS Work Group meeting in August, and I want your ideas on what we can do to improve typography on the Web. </p>
    <p>To participate, read my <a href="https://web.archive.org/web/20080704191728/http://www.webbedenvironments.com/blog/index.php/2008/04/29/web-typography-tell-me-what-you-want/">blog entry on webbedENVIRONMENTS calling for feedback</a> and then post your ideas on my blog or here in this Typophile Forum thread.</p>
    <p>Help me Typophile, you’re my only hope!</p>
