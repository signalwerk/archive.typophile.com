  html: |-
    <p>What are the most important/influential/outstanding/beautiful bound works in British Typography?</p>
    <p>(Consider, perhaps, Caslon, Baskerville, Gill, Johnston, Morison, Mosley, Harling, McLean, Spencer, Fletcher, Poynor and journals such as The Fleuron, Monotype Recorder, Penrose Annual, Typographica, Baseline, Octavo and Eye. Sorry if I omitted anything obvious.)</p>
