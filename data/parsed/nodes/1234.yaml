    html: <p>You don't really need any "technology" - you just need to choose your colors very carefully (assuming the font editor, not to mention the OS's font engine, allow colors) so that they render on the RGB lcd cells in a way that triples the horizontal resolution. <br> <br>hhp <br></p>
