    <p>Hi all,</p>
    <p>I'm looking for fonts similar to :</p>
    <p><a class="freelinking external" href="http://www2.wind.ne.jp/maniackers/232mksd.html" rel="nofollow">232MKSD Round Light</a></p>
    <p>Its for a military interface for a game set a decade or two in the future. 232MKSD has the right kind of aesthetic but I'm open to completely different suggestions.</p>
    <p>Plus's :</p>
    <p>Its compressed (always useful for game interfaces). The bowls are vertical, c, e etc. Its legible at small sizes and has large open counters. The stroke weight is even so it will reproduce well on screen.</p>
    <p>Minus's:</p>
    <p>Needs to be a slightly heavier weight. It is rounded which is too friendly for a military theme. I would like to try a more angular version like a condensed :</p>
    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/typodermic/jillican/" rel="nofollow">jillican</a>.</p>
    <p>Thanks in advance for any suggestions, this site is such a great resource for type.</p>
