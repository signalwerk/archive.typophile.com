      <p>Thanks all, those are excellent recommendations. CreativeNRG, your recommendations are all spot on though I didn't shortlist any because I think they would be a little less legible at the smaller sizes, it will get compressed a lot and the quality really deteriorates in game. United is a very good contender but I have a complaint about House Industries  site, its virtually impossible to sample fonts so makes it really difficult to evaluate against those from myfonts.com which have excellent sampling options.</p>
      <p>For your interest I think we've narrowed it to Quantico, Jillican, Milibus, CA Monodon, Coupe and Baksheesh from Myfonts.com, Blender Pro from Gestalten and United from House Industries. They're mostly condensed, octagonal and I think they have a military geometric aesthetic.</p>
      <p>Thanks again everyone.</p>
