    html: |-
      <p>Forget about colours for now. Stick to your habits inspite web times these days. Logos are still logos and are better made bootom up, than vice-a-versa.</p>
      <p>Anyway. I like the "ik" symbol, but would like to see it more squared.</p>
      <p>If the name is Infomaniak Network, than both words should be equally emphasized. If Network will be something "changeable", then I like tel light Helvetica version much much better, because it doesn't distract the logo. If Network is just as important as Infomaniak, than I'd use the logo with both words in the same type size. And same letter manipulation.</p>
      <p>But. I would write Infomaniak in lower case. Including "I", so it will make more sense to the logo symbol.</p>
      <p>One more observation: the modified "k" at the end of these words has a bit too wide top. Translation: right angled stroke goes too much to the right so it visually goes over the end of the bottom left slanted stroke. Can anybody translate this crap to english readable sentence? :)<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
