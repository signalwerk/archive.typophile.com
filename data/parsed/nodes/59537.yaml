    html: |-
      <p>I think it varies from font to font. For example the letters that are distinctive in Minion for me are acjty or MKQR5, whilst in Meta it's aegksy or CEGMS, or in Officina gimty or in Bliss bgyGW.</p>
      <p>On the whole I guess I look at:<br>
      lc: a, g, e, n, t, (+s)<br>
      uc: G, E, M, Q, S.</p>
