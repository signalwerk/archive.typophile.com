    html: |-
      <p>"hamburgefontsiv" is used a lot because it uses most of the shapes you need to build other letters.</p>
      <p>I would look at letters with terminals, like: 'S' and 'C', joins in letters like 'M' and 'A' and – since I need five of them – the question mark: '?'.<br>
      'R', 'G', 'Q', 'g' and 'a' are also often treated differently (and probably many others as well).</p>
      <p>Ooops. I cheated!</p>
