  html: <p>If you could pick just 5 letters, which would have the most distinguishing character? I heard the type designers often play with the 'Q's tail. Is that where I should start? I've seen 'hamburger" used in type samples. Are those the best?</p>
  html_clean: <p>If you could pick just 5 letters, which would have the most distinguishing character? I heard the type designers often play with the 'Q's tail. Is that where I should start? I've seen 'hamburger" used in type samples. Are those the best?</p>
