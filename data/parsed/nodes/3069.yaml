    html: <p> You can fool with the autotrace parameters, but I wouldn't use autotrace for such a geometric design anyway, because you're gonna waste a lot of time tweaking the different parts (like the stems) to have the exact same dimension. Do put the images in the background, but start tracing over them manually, and rely on copy-pasting the modular parts as much as possible. <br> <br>hhp </p>
