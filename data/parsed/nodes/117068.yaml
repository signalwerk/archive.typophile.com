    <p>Hi everyone!</p>
    <p>This is my first post! I've currently just started a course specialising in digital design and have an assessment that I need to get feedback on from other designers. I'm still very new to this but here goes nothing! </p>
    <p>The main objective for the assignment was to create a shirt and poster for the Salvation Army that can be ordered online; it should showcase their efforts to help and show compassion towards others. I designed my shirt to aim at a broader audience, whereas the poster is intended to show the effort the salvation army has made since 1865. </p>
    <p>Please! Any kind of negative/positive feedback would be greatly appreciated!<br>
    Thank you so much!<br>
    Ben. </p>
    <p>PS. I don't know how to change the size of the image, I know that it is too big to see so I have attached copies below.<br>
