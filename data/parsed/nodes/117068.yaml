      <p>Hi Ben!</p>
      <p>Welcome to Typophile.</p>
      <p>I am an in-house designer for The Salvation Army, at their headquarters in Melbourne, so I have a bunch of experience working on Salvo designs.</p>
      <p>Firstly, is your brief aimed at getting more donations? If not, what is the goal?</p>
      <p>In terms of Salvo style, it varies. Lots. Some things are very conservative, traditional etc, others are more progressive.</p>
      <p>For shirts, probably the best place to see some very popular designs is: Wardrobe at <a href="http://www.tsa-wardrobe.com" title="http://www.tsa-wardrobe.com">http://www.tsa-wardrobe.com</a> - those guys have engaged some super talented designers from a round the world to help with the shirts, so there is lots of great stuff there. </p>
      <p>Depending on what the goals of the assignment are, one of the popular slogans here in Australia for advertising etc is "Thank God For The Salvos", not that you have to use it or anything, but just so you are aware. </p>
      <p>In Australia we have two Territories, each with it's own website and communications department. </p>
      <p><a href="http://salvos.org.au" title="http://salvos.org.au">http://salvos.org.au</a> &amp; <a href="http://www.salvationarmy.org.au" title="http://www.salvationarmy.org.au">http://www.salvationarmy.org.au</a></p>
      <p>Take a look over the websites to get a feel for the current styles used for public-focused communications.</p>
      <p>In terms of your designs, I feel the historical image is not very engaging, maybe try finding a more contemporary way to communicate the idea of 'Earth's Angels" that relates to some of the current ways The Salvation Army is helping people. </p>
      <p>Good luck, I look forward to seeing how you progress with this :-D</p>
