    html: |-
      <div class="comment-spam-body"><p>Not to put you on a specific path, but if you're seeking to speak to a larger audience, why not take a modern approach? You can still use some old images to give it a nostalgic and perhaps even a euphoric feeling (I'm thinking of Monty Python, but less wacky), but perhaps you ought to think of it as a brand that needs to speak to a lot of people. The wings are quite specific in style and exclude a lot of people already, though I do like the idea of using wings. Be careful not to make it look pretentious though.</p>
      <p>A red background and a friendly looking sans serif (something like Gloriola perhaps) may put you on the right track. Certainly try to limit the amount of typefaces you use to two. Their logo also feels outdated, though perhaps you do need to refer back to when they were established, but I'm not sure you ought to do that with typography that is not of this time, as it excludes a lot of people.</p>
      </div>
