      <p>Welcome to Typophile.</p>
      <p>In my limited experience with the Salvation Army, my impression is that many of the volunteers are rather conservative and traditional people. So while I like that the t-shirt is taking a different approach, I'm not sure it would appeal to them, unless you are trying to attractive a different type of volunteer.</p>
      <p>Regarding the poster, I like vintage images, but are there any where the volunteers look happier? They look like they're on their way to a funeral. (I hate to admit this, but I've sometimes used the Liquify filter in Photoshop to make changes to people's expressions, like to give them a subtle smile. But I'd hate to tamper with a vintage photo that way.) </p>
      <p>Also I'm not clear what the poster is trying to do. Get donations? Volunteers? Increased public attention? I think it needs a call to action to clarify what you want folks to do. I might also experiment with combining the vintage photo with another image, maybe something more modern. I don't care for the type treatment, but I'd concentrate more on the concept at this point.</p>
