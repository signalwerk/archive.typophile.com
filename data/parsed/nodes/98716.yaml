      <p>cerulean and PabloImpallari, thanks for sharing your observations!  I had not thought about how slanting a circle results in an ellipse that is even steeper inclined.  I'm trying to work out some of the calculations behind the resulting slant, and had some questions:</p>
      <p>When you do the correction, do you always split the desired slant equally between a slant and a rotation?  For instance, Briem gives an example where a desired slant of 12.5 degrees is achieved through combining a slant of 6.25 degrees and a rotation of 6.25 degrees.</p>
      <p>When combining the slant and the rotation, where are the origins of those transformations?  Are they in the same place?  At the bottom left of the shape, or in the center?  Or do none of these things matter?</p>
      <p>Thanks!<br>
      Stephen</p>
