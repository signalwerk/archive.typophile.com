    <p>Hello everyone,</p>
    <p>So I have been working the last year or two on a Grotesk sans-serif, and have recently started on my italics.</p>
    <p>After referencing a few other grotesks, I've noticed that the slant angle is always about 2-3 degrees less on round characters like C, O, e, etc...</p>
    <p>So for instance, say on a roman weight of a sans the characters like I, L, H, N, etc.. have a slant of 12 degrees, it seems like 9 times out of 10, characters like C and O are only at a 9 degree slant.</p>
    <p>My question is, what is the reason for this, and is it a discretionary thing for the designer or something that is pretty well known as needing to be done in the type design world.</p>
    <p>Thanks!<br>
    Josh</p>
