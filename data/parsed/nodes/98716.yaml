    html: |-
      <p>When you slant a circle, what you get is a perfect ellipse, but the visual impression of the shape's tilt mostly comes from the focal axis of that ellipse (the line that corresponds to the 45° diagonal of the circle), making it seem more severely slanted than rectilinear glyphs at the same slant. Also, perpendicular to that axis is what we see as the ellipse's width, which makes it look too condensed. You'll also notice that the left extreme is very low and the right extreme is very high.</p>
      <p>A reduced slant may do the job, but ideally what you want to do is edit the shape, raising the left side and lowering the right side, to make a thing that is geometrically more complex but subjectively reads as a "leaning circle" as round as the original.</p>
