      <p>The closest trick i've seen to find is by rotating half the desired italic amount (so 6 if you want a 12 degree italic), then slant by the same amount (6 again), fix extrema, and the do little bits of weight tweaking. Not sure if that is proper or not, haha, but it seems to slightly do the trick. </p>
      <p>Italics can be hard for a newbie!</p>
