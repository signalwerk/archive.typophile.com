    <p>Its happened to me several times, thankfully in personal projects (self-branding) but I'm wondering... how do you avoid or double check that the logo your creating hasn't already been created or isn't too similar?</p>
    <p>I'm currently working freelance on a few logos and now I'm paranoid that there's possibly similar logos.. Any suggestions?</p>
    <p>Thanks in advance.</p>
