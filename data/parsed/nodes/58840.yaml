    html: |-
      <p>I came across <a class="freelinking external" href="http://www.logodesignlove.com/similar-original-logos" rel="nofollow">this article</a> not too long ago that you might find interesting. Looking at the examples of similar logos, you can see how some are too close for comfort, and some aren't. For example, I think the Sun Microsystems diamond very clearly has the word "Sun" in it, and the Columbia Sportswear is doing its own thing. To me, they are different enough. But someone is always going to think your logo is similar to someone else's, so why worry about it? As long as you aren't actually ripping someone off (especially <a class="freelinking external" href="http://www.davidairey.com/the-worlds-best-logo-designers/" rel="nofollow">these guys</a>), and have good reasons for the design choices you make, you should feel confident that your logo is unique enough.</p>
      <p>Although Jackson does make an excellent point about checking out the competition. If the Sun/Columbia companies were in the same industry, THEN I might think twice about their logos. </p>
      <p>I have a vague memory of a site filled with well-known logos, but I can't find it now. Perhaps it was just something I dreamed up.</p>
