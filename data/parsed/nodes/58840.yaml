    html: |-
      <p>A logo that manages to capture some of the essence of a company/organisation can’t be wrong, similar or not. Since this is so very, very hard to achieve, stumbling upon a look-alike may evoke the notion that your own design is too random.</p>
      <p>And yes, researching the clients competitive landscape is mandatory. Doing it too early in the process can obstruct the basic approach, though. Better to throw out all your favorite sketches later.</p>
