    html: |-
      <p>Large scans of full specimens are hard to come by, but some of these may be useful...</p>
      <p>A great resource, but not necessarily for high-res scans:<br>
      <a href="http://www.utexas.edu/cofa/rrk/specimens.php" title="http://www.utexas.edu/cofa/rrk/specimens.php">http://www.utexas.edu/cofa/rrk/specimens.php</a></p>
      <p>Hamilton Wood Type catalog, fairly high quality images:<br>
      <a href="http://www.unicorngraphics.com/wood%20type%20museum/hamilton14/hamiltonfourteen.asp" title="http://www.unicorngraphics.com/wood%20type%20museum/hamilton14/hamiltonfourteen.asp">http://www.unicorngraphics.com/wood%20type%20museum/hamilton14/hamiltonf...</a></p>
      <p>Links to online type specimens compiled by Ralf Herrmann, who posts on this forum (thanks, Ralf, for gathering these resources):<br>
      <a href="http://opentype.info/blog/2008/02/18/type-specimen/" title="http://opentype.info/blog/2008/02/18/type-specimen/">http://opentype.info/blog/2008/02/18/type-specimen/</a></p>
      <p>Random type specimens here:<br>
      <a href="http://dailytypespecimen.com/" title="http://dailytypespecimen.com/">http://dailytypespecimen.com/</a></p>
      <p>Various specimens<br>
      <a href="http://catalog.hathitrust.org/Record/008592297" title="http://catalog.hathitrust.org/Record/008592297">http://catalog.hathitrust.org/Record/008592297</a></p>
