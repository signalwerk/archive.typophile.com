      <p>Incidentally, while I don't know much about this area, I have read that the Unicode characters allocated to Burmese, while they are sufficient to represent the language using an advanced Unicode implementation, are insufficient - one needs more glyphs with distinct codes - for conventional software to handle it.</p>
      <p>But because there weren't a lot of computers in Burma back when, there weren't pre-existing standard codes with those glyphs defined, so unlike more economically important languages, Burmese got the full purist treatment from Unicode.</p>
      <p>So anyone aspiring to design a Unicode font for Burmese will need to know a lot about the writing system to properly implement support for the language - and the list of characters won't show all the glyphs you will need to define.</p>
