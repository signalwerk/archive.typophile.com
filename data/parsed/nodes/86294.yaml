    <p>Hi all,</p>
    <p>I'm likely to be working on some Burmese fonts for academic documents (dictionaries and textbooks) over the next 12 months as part of my Masters programme in Reading, and I'm just wondering if there's anybody here who I should be in touch with.</p>
    <p>I'm fully aware of the scarcity and quality of Burmese fonts currently available, which is one reason why I've chosen such an under-represented script. I will be doing research into the derivation and styles of the Burmese letterforms, the writing system, OpenType scripting, keyboard layouts, and the current and future challenges and needs of lexicographers and educators in Burma.</p>
    <p>Many thanks.</p>
