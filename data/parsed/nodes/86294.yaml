      <p>@John Hudson:<br>
      <cite>Burmese is no different in this respect than Thai, Khmer, Lao, or any of the many Indian scripts or Tibetan.</cite></p>
      <p>It is true that Thai has similar complexities - I remember seeing specific complaints about the treatment Burmese had gotten from the Unicode consortium, and I thought that Thai was more economically important and had a longer history of use with computers (i.e. there's a six-level TTY code for Thai that's been in use a long time) and so might have had a slightly easier time of it.</p>
      <p>But I also had read other comments that Burmese was just one example of the short shrift the less major languages had received - unlike even, say, Arabic - so I'm not surprised to hear it's a general complaint.</p>
