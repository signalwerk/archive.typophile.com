      <p>Right. I've installed Windows 8 on my desktop machine. Not enjoying the experience unfortunately, but I'll have a good explore with Myanmar Text that comes with it. At first glance, I'm seeing a lot of OpenType features I've never heard of before (rphr, psts for example) but after a couple of days' learning about how complicated the writing system is, I'm not surprised there's going to be a lot to learn.</p>
      <p>It seems I need to get really clear on the distinction between 'letter', 'character' and 'glyph'. There are some odd behaviours I hadn't counted on (unlike in Thai which I'm very familiar with). In Burmese, the 'a' vowel should have a tall variant when positioned next to certain initial consonants, but the tall variant also needs to be keyable directly and has a codepoint — no problem there (at least until you start on Karen which I understand uses the two characters to represent different letters!). By contrast, the 'u' under-vowels are sometimes contextually switched to tall variants (where there's already a descender in the way?) and in other cases it'll be interesting to figure out how to allow the user to choose them (perhaps even without a glyph palette) even when not actually necessary, when there isn't a codepoint. Challenges ahead. I'm really starting to see why proper Burmese fonts have taken so long to appear.</p>
