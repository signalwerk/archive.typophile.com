  html: <p>Bloke that I am, I just put two and two together and realized that Mr. Hudson is the same John Hudson who designed Manticore and Aeneas.  I keep samples of Manticore in a special directory along with other bits of my favourite fonts.  Neat-o. <br> <br>Paul</p>
