    html: <p>I never liked the Type 1 font format, even when it was still pretty much the only game in town (when there were no decent tools for making TT fonts). Two, three files to ship, maintain and support for each platform? &lt;256 character limit? No way to use ligatures without breaking text strings? Seriously, Type 1 is one stone-age technology whose demise is long overdue. <br> <br>Every Type 1 font I sell today is a potential customer service nightmare when operating systems and applications stop supporting the format. Every Type 1 font a customer uses today is a document encoding nightmare waiting to happen (and I have no intention of making, shipping or maintaining 'backwards compatible to 8-bit encodings' versions of Type 1 fonts). <br> <br>So I disagree that there is no damage in continuing to sell Type 1 fonts. <br> <br>1530 Garamond is one of our designs that is likely to be revised and made available in OT format (possibly with a set of Latin scribal contraction ligatures).</p>
    html_clean: <p>I never liked the Type 1 font format, even when it was still pretty much the only game in town (when there were no decent tools for making TT fonts). Two, three files to ship, maintain and support for each platform? &lt;256 character limit? No way to use ligatures without breaking text strings? Seriously, Type 1 is one stone-age technology whose demise is long overdue. <br> <br>Every Type 1 font I sell today is a potential customer service nightmare when operating systems and applications stop supporting the format. Every Type 1 font a customer uses today is a document encoding nightmare waiting to happen (and I have no intention of making, shipping or maintaining 'backwards compatible to 8-bit encodings' versions of Type 1 fonts). <br> <br>So I disagree that there is no damage in continuing to sell Type 1 fonts. <br> <br>1530 Garamond is one of our designs that is likely to be revised and made available in OT format (possibly with a set of Latin scribal contraction ligatures).</p>
