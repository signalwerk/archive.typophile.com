    html: "<p>&gt; [&gt;1530 Garamond is one of our designs that is likely to be revised and made available in OT format (possibly with a set of Latin scribal contraction ligatures). &gt; This is just fantastic, John. And on Type1: the 256 character limit applied even to Truetype. The large layout came with Truetype GX and now Opentype/Unicode. It's not such a recent and so widespread thing. I understand that for you, producing non-Latin and cutting-edge works in terms of technology also, Type1 may sould so old, but a huge amount of users and foundries will continue to use it. Personally I like the fact of having separate files for bitmaps, outlines and metric files. As I like having all in one with Opentype. I never liked so much Truetype for the additional points needed. I know they are way better for hinting, but not being into hinting (for now at least) I was pissed off when I needed to modify an existing truetype with the excess of points. Here, of course I'm speaking just for Mac. It's clear that if you need multi-platform faces you are forced to truetype. But it's amazing there are so many people using PC Type1 fonts. As far as I know Type1 was never a real standard under Windows.I also understand the \"potential customer service nightmare Type1 might present as operating systems and applications stop supporting the format, but why Type 1 represents a \"document encoding nightmare waiting to happen\"? Surely I'm missing a lot here. ]</p>"
