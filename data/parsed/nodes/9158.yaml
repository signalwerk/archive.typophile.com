    html: "<p>Jon, you could also pick up Ruari McLean's autobiography, which is the only other publication I've ever seen set in Manticore. I was rather chuffed last year, though, to see Manticore Titling used on the dustjacket of a book by one of my favourite poets, Czeslaw Milosz. The biggest problem I find with the face, apart from some technical problems in the outlines and the hideously small counter of the lowercase &lt;I&gt;e&lt;/I&gt;, is the excessive weight in the bracketing of the serifs: I was going for the rugged blackness that you see in early printed books, but now I think I overdid it a bit. Ironically, while this feature was too heavy, I now think the overall stem weight was a touch too light.  <br>  <br>Back in 1997 (probably the last time I had any free time for such things) I started redrawing Manticore, but didn't get very far with it. Here are the original forms, on the left, contrasted with the revised forms on the right. Seriously, I doubt if I'll ever finish this. Perhaps it will be a nice project for my retirement.  <br><img src=\"http://www.typophile.com/forums/messages/30/6514.gif\" alt=\"Manticore 1.0 and 2.0 comparison\"></p>"
