    html: "<p>All the reasons stated earlier in this thread: I'm not satisfied with the design; I don't have OpenType versions; I don't have time to make OpenType versions; I refuse to sell Type 1 fonts. Mainly, I'm not satisfied with the design. I consider Manticore 'juvenalia': it was useful to have done, I learned a lot, but I don't think it is representative of my skills or my ideas about type design any more.</p>"
