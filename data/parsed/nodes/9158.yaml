    html: <p><i>why Type 1 represents a "document encoding nightmare waiting to happen"?</i> <br> <br>Let's say I want to use the full range of standard f-ligatures in a document. With my Type 1 fonts, I'm getting the ligatures either from psuedo-standard Adobe expert set layout or from totally-non standard and widly diveregenbt hacked layouts used by different font foundries. Whichever layout I use, I am obliged to <i>change the text strings of the document</i> in order to display ligatures so that, for example the word 'office' ends up being spelled 'oWce' (using the Adobe expert set layout). The document can no longer be spell-checked, sorted or published to the web; changing fonts will likely result in corruption even of the display. Effectively, I've killed my document by typesetting it. <br> <br>In a couple of years, let's say the document is going to be revised, or even just looked at. In the meantime, my operating system has stopped supporting Type 1 fonts. That's okay though, because I've updated all my favourite fonts to OpenType. I open the document and what do I get? 'oWce' Every day users continue to employ Type 1 fonts is another day on which documents are broken and rendered unusable in the future. Simple documents without traditional quality typographic formatting will survive the transition because accurate semantic characters can be mapped between encodings. Documents with rich typographic formatting will not survive because, e.g. the ligature ffi has been encoded as the semantic character W.</p>
