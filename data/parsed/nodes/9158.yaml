    html: <p>&gt; [&gt;No, a Unicode cmap table was part of the original TT specification. Apple was one of the first companies involved with Unicode, and made the decision to base TrueType around the encoding standard even though it would be several years before applications were handling Unicode text strings. &gt; Sorry, John, my fault, I did not know. Thank you! And, yes, I guessed you were referring to the very smart ligature and contextual alternates handling of Unicode/Opentype when you talked about the problems arising in the continued use of Type1. Anyway, this is a real problem as long as you're a custom typeface developer such as you with Tiro. If I buy a face from Emigre or ITC today, let's say, and it's a Type1, it will be my problem to buy Emigre and ITC Opentype versions of it as long as they will be released, paying for the upgrade. So, as long as we have only MrsEaves at Emigre and, I think, none at ITC, you are simply forced to stick to Type1. If the foundry decides it will drop a face and not upgrade it to Opentype I will necessary have to buy it in Type1. So I agree with you about the need to help things occur, but unfortunately you are unable to predict what foundries will do, and if you need a particular face now, you need to buy it in Type1 and maybe re-encode it in Opentype, if you are able to do so.]</p>
