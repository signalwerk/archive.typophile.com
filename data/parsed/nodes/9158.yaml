    html: "<p>Thank you. Glad you like Manticore; I don't anymore, but that's true of most of my typefaces from before 1998. I'm probably going to retire them fairly soon, in large part because we don't want to support Type 1 fonts any longer but don't have time or much inclination to make OpenType versions of all our retail fonts. So that copy of Manticore may shortly be a rare item.  <br>  <br>Note that I only designed the digital version of Aeneas: it is based on lettering by the German calligrapher Werner Schneider. Werner and I have discussed making an OT version with an extended Cyrillic and Greek character set, but that's another project waiting for a few free weeks. I can't remember when I last had a few free weeks.</p>"
    html_clean: "<p>Thank you. Glad you like Manticore; I don't anymore, but that's true of most of my typefaces from before 1998. I'm probably going to retire them fairly soon, in large part because we don't want to support Type 1 fonts any longer but don't have time or much inclination to make OpenType versions of all our retail fonts. So that copy of Manticore may shortly be a rare item.  <br>  <br>Note that I only designed the digital version of Aeneas: it is based on lettering by the German calligrapher Werner Schneider. Werner and I have discussed making an OT version with an extended Cyrillic and Greek character set, but that's another project waiting for a few free weeks. I can't remember when I last had a few free weeks.</p>"
