    html: "<p><i>And on Type1: the 256 character limit applied even to Truetype.</i>  <br>  <br>No, a Unicode cmap table was part of the original TT specification. Apple was one of the first companies involved with Unicode, and made the decision to base TrueType around the encoding standard even though it would be several years before applications were handling Unicode text strings. <br> <br>The limitation you refer to was a limitation of operating systems and applications that could only access discreet 8-bit codepages, but any TT font could contain characters for multiple codepages using Unicode encoding.</p>"
    html_clean: "<p><i>And on Type1: the 256 character limit applied even to Truetype.</i>  <br>  <br>No, a Unicode cmap table was part of the original TT specification. Apple was one of the first companies involved with Unicode, and made the decision to base TrueType around the encoding standard even though it would be several years before applications were handling Unicode text strings. <br> <br>The limitation you refer to was a limitation of operating systems and applications that could only access discreet 8-bit codepages, but any TT font could contain characters for multiple codepages using Unicode encoding.</p>"
