  - id: 99821
    user: 1043
    date: 2005-12-13T07:14:00
    date_raw: 13 Dec 2005 — 7:14am
    votes: null
    html: |-
      <p>Congratulations and thank you Yuri and the FontLab team for bringing this great new tool to us Mac users.</p>
      <p>I do have one comment about a new feature which was (I believe) based on a <a href="http://72.14.203.104/search?q=cache:5wpiqxCvH-gJ:www.typophile.com/forums/messages/4101/10995.html%3F1088700935+site:typophile.com+resedit&amp;hl=en&amp;client=safari" rel="nofollow">suggestion of mine</a>...the "neighbors" feature.</p>
      <p>Would it be possible to make it just a bit more interactive? </p>
      <p>As it is, the "neighbors" are loaded when FontLab starts up from the file "neighbors.txt". If you want to see different neighbors next to a glyph, it seems that you must quit FontLab, alter the text file, and start FontLab up again. However, I did discover an undocumented feature (at least it's not mentioned in the manual): Control-clicking on a neighbor and choosing "Choose..." from the pop-up menu opens a "Choose neighbor" dialog box. Wonderful, except this choice only applies to the right-hand neighbor. There does not seem to be any way to choose a different left-hand neighbor.</p>
      <p>There ought to be an easy way to choose neighbors as you are working. The undocumented "Choose neighbor" function is close. Ideally, there would be two text fields at the top of the Glyph window or on a palette in which you could type the names of the two neighbors. </p>
      <p>The separate text file is a nice idea, but having a different semi-permanent pair of neighbors for every glyph is not really how I imagined something like this would work. For me, it would be better if there was a global pair of neighbors which remained the same as I go from glyph to glyph, especially if they could easily be changed as I worked. An external list could be used the same way as the metrics strings, where you can choose them from a pop-up menu.</p>
      <p>Anyway, this is not to diminish what a big step forward this new version represents, but I hope you think about my suggestion. There is a lot to like about this release. I've already purchased and installed the upgrade.</p>
    html_clean: |-
