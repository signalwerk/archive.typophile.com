      <p>I've been trying to continue working on an in-progress face using FLS5 Mac. I must admit that it is frustrating. It is such a huge change in interface from 4.6 that it is like a completely new program to learn. Mostly, I just can't find things without a search. I bought 4.6 about a year and a half ago and quickly learned it well enough out of the box to design a multi-lingual type family in 5 weights and italic. I am having more trouble with the transition from 4.6 to 5.0 than I did starting off on 4.6 cold. Is this just my post sedation induced stupidity or does any other Mac user who was not a beta tester have problems too? </p>
      <p>I would be curious to know from FL developers what rationale they used to overhaul the interface?</p>
      <p>A simple example: in 4.6 I could select a point and hit delete and the point and the 2 line segments on either side would be deleted. In FLS5, when I do the same only the points go away as if I had used the eraser tool on them in 4.6. Where is the eraser tool? How do I now delete line segments? Why is this better?</p>
      <p>ChrisL</p>
