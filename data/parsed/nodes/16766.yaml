    html: |-
      <p>Font Info button -- click into the little button top-right of the Glyph Window (right above the vertical scrollbar), then the Glyph Window's toolbar looks like in FL4.6. (I find the new bottom toolbar more logical though. I don't know the shortcut, but this may be another option to access it.)</p>
      <p>Same for the Metrics/Kerning Panel -- there's everything to "simulate" the FL4.6 interface. E.g. try the three buttons to the right of this window's top toolbar.</p>
      <p>It's worth consulting the manual. It may have some pages more, but is better than the former one. Also, it has very useful technical background information, like the information on unicode or recommendations for naming fonts, even many links to specifications.</p>
      <p>It took me quite a while to get accustomed to FLS5 too. Moreover, I used it first on a WinXP PC -- and the last Windows I touched was 3.1. That was rather horrific at first.<br>
      However, once you got it, you would not want to return to FL4.6, just as I never dreamed of going back from FL4.6 to Fontographer, or from OS X to OS 9, or from InDesign to PageMaker ... It's different worlds.</p>
      <p>Karsten</p>
