      <p>Adam Twardoch referred to this PDF in another thread:<br>
      <a href="http://www.twardoch.com/download/unicode2005_fontlab5.pdf" rel="nofollow">http://www.twardoch.com/download/unicode2005_fontlab5.pdf</a><br>
      Aside from information in condensed form, p17 shows Lucas de Groot's one-image manual for the Metrics/Kerning Panel. Very useful.</p>
      <p>About kerning in FLS5, see Adam Twardoch's posts to this recent thread:<br>
      <a href="http://typophile.com/node/16413" rel="nofollow">http://typophile.com/node/16413</a><br>
      Especially the description of three kerning modes -- search for "there are three kerning modes".</p>
      <p>For those who use it, this is about installing RoboFab with FLS5 Mac:<br>
      <a href="http://just.letterror.com/ltrwiki/RoboFab_2fFontLabStudio5?" rel="nofollow">http://just.letterror.com/ltrwiki/RoboFab_2fFontLabStudio5?</a></p>
      <p>Oh yes, it is dangerous to update anything if you have to finish something in time.<br>
      But it seems that both versions can be installed at the same time (I hope I don't tell nonsense), so you can draw and finish a job in FL4.6, and play with FLS5 at night or use it for generating fonts which is much easier than with FL4.6 -- and by the way find that FLS5 is much better.  :)</p>
