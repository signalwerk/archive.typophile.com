    <p>Fontlab Ltd. is proud to announce the release of the 12th (!) product this year. After TransType SE 2.5 for Mac and Windows, TransType Pro 3.0 for Mac and Windows, FogLamp for Mac and Windows, Photofont Start for Mac and Windows, Sigmaker 2 for Mac, Fontographer 4.7 for Mac and FontLab Studio 5 for Windows, we have just released FontLab Studio 5 for Mac, the long-awaited next-generation professional font editor for Mac OS X. </p>
    <p>Come and see:<br>
    <a href="http://www.fontlab.com/The-News/Announcements/FontLab-Studio-5/" title="http://www.fontlab.com/The-News/Announcements/FontLab-Studio-5/">http://www.fontlab.com/The-News/Announcements/FontLab-Studio-5/</a></p>
    <p>As Yuri Yarmola just put it: "What a crazy year!" </p>
    <p>Best,<br>
    Adam Twardoch<br>
    Fontlab Ltd.</p>
