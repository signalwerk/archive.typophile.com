      <p>Yep Bitfonter is quite a good way to do Photofonts. Quite good to make any bitmap font for that matter.</p>
      <p>On the Mac the simplest way to deploy a photofont is by using the installer that Apple provides for free. On Windows there's the Windows Installer if you can figure it out. :)</p>
      <p>Photofonts are a good idea, but a good idea without a real-world application right now. I have no doubt that there will be coming out something useful out of that corner.</p>
