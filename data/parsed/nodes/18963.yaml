      <p>Laura, </p>
      <p>Photofont Start is not a photofont. Photofont Start is a Photoshop plugin that lets you use photofonts. </p>
      <p>Photofont Start needs to be installed like a normal application (using the Apple installer), and it gets installed in the Photoshop plug-ins folder. </p>
      <p>The user can install photofonts in the plugin -- basically, the .phf file is copied to the correct folder. An Apple installer could just put the .phf file in the right location for you. </p>
      <p>A.</p>
