      <p>Frank,</p>
      <p>I'm just beginning to play with Bitfonter and Photofonts.  A few questions for you please:</p>
      <p>1.  What is the purpose of installing the font in the way you describe - using the Apple Installer?  I have installed it as a photoshop plugin and it does show up in the filter menu...what does installing it this way do for you?</p>
      <p>2.  You mentioned that you tried to sell photofonts but people only bought the case studies because there was no way to use them. Is it your experience that designers, who can use the fonts as plug ins, don't need them because they can just design what they want in photoshop anyway?  Is there not a market to designers who don't want to be bothered and want to use ready made colorful/image fonts?</p>
      <p>3.  You mentioned that there were good things to come technologically which could change things.  You said this back in April.  Can you elaborate on this?  Is there anything new you are aware of?</p>
      <p>I think it looks like a ridiculous amount of fun to design image fonts with photofonts/bitfonte, and I would like to do them to sell them.  Do you think there is no market for them yet?  What do you see the landscape to be in the near future?</p>
      <p>I would appreciate your thoughts.</p>
      <p>Thanks!<br>
      Laura</p>
  - id: 158566
    user_id: 1133
    user_name: twardoch
    user_path: null
    date_raw: 18 Sep 2006 — 4:27am
    date: 2006-09-18T04:27:00
    votes: null
    html: |-
      <p>Laura, </p>
      <p>Photofont Start is not a photofont. Photofont Start is a Photoshop plugin that lets you use photofonts. </p>
      <p>Photofont Start needs to be installed like a normal application (using the Apple installer), and it gets installed in the Photoshop plug-ins folder. </p>
      <p>The user can install photofonts in the plugin -- basically, the .phf file is copied to the correct folder. An Apple installer could just put the .phf file in the right location for you. </p>
      <p>A.</p>
