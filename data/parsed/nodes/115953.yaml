      <p>Definitely bespoke and according to their <a class="freelinking external" href="http://www.nationaletoneel.nl" rel="nofollow">css code</a> named 'Nationale Toneel' (Medium) copyrighted to Stephan Achterberg, co-founder of Van Lennep.<br>
      To me, that looks like a custom job based on Berton Hasebe's <a href="/wiki/https%3A/%252Fcommercialtype.com/typefaces/platform" class="freelinking" rel="nofollow">Platform</a> with main differences on /a, /k and /t.</p>
