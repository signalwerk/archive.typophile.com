    html: |-
      <p>According to this <a class="freelinking external" href="http://www.myfonts.com/WhatTheFont/forum/case/32999" rel="nofollow">post</a> on WTF Forum should be <strong>Letraset English Tudor</strong>, an open face blackletter with open areas filled in.</p>
      <blockquote><p>This sample is actually a typeface called English Tudor which was dewigned by Letraset in 1981 as dry-transfer lettering.<br>
      English Tudor was an open face black letter, the sample shown is someone filled in the open areas to make a solid version for the logo shown.<br>
      English Tudor has not been digitized as of yet, it could happen by having an open and a solid version.<br>
      You can find English Tudor in Letraset Graphics Manual (1981-1997).</p></blockquote>
      <p>May be having a look to <a class="freelinking external" href="http://moorstation.org/typoasis/designers/steffmann" rel="nofollow">Dieter Steffmann blackletter collection</a> might worth a shot.</p>
