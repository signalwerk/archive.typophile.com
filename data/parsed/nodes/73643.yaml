      <p>Not at all.</p>
      <p>ASCII is an <a href="http://en.wikipedia.org/wiki/Character_encoding" rel="nofollow">encoding</a>, a system where each character in a limited set is assigned an index number.<br>
      Due to unchecked growth, one is nowadays wise to ask "<em>What kind</em> of ASCII?" -- where possible answers range from 7-bit to ISO-8559, ISO Latin1, Windows Greek, Mac OS Roman, OEM (whatever that means -- it depends on the manufacturer), or any other 8-bit subset. (It just <em>might</em> be relatively safe to state 8-bit is closely linked to 'pure ASCII'.) Even EBDIC encoding, quite popular before ASCII became The Next Big Thing, exists in a few variants.</p>
      <p>Domain names are abstract data, and so is source code, valid in ASCII encoding but also for example in EBDIC or in Unicode -- it gets translated to a convenient data format when it's interrogated. (An upcoming change in domain names is allowing almost the full Unicode set.)<br>
      Email servers send their header data in ASCII because the mail: protocol says it must. If some mail program does not internally 'work' with ASCII, it will internally convert the data to whatever it uses.</p>
      <p>It's important for a 'coder' to know what kind of text files his compiler accepts (although some compilers may accept source files in different encodings). When fed with a text file with an unexpected encoding, the compiler will only see nonsense.</p>
      <p>Generally, software worldwide is written to be able to handle at least 7-bit ASCII -- but it's just because you have to have <em>some</em> basic convention. Anything above and beyond 7-bit ASCII (and, when taken the interpretation of character codes 0..31 into account, anything <em>in</em> 7-bit ASCII as well) may produce unexpected results on different platforms, with different software.</p>
      <p>Whatever ASCII is, it certainly is <em>not</em> a font, super or otherwise.</p>
      <p>A modern font type such as TTF consists of a list of enumerated glyphs, where each glyph index means exactly nothing at all. Tables in the font file allow a translation from the font glyphs to at least one and usually several common encoding schemes, which is the responsibility of the font creator.</p>
