      <p>It's certainly true that ASCII - and by that I mean the 7-bit code, not the 8-bit ISO 8859-1 - is what many computer systems were designed to work with. Originally, ASCII only was a 7-bit code, and computers in some European countries simply used a modified version of the 7-bit code, where less-used characters like { | } ~ were replaced by accented letters their languages needed.</p>
      <p>This meant they weren't using ASCII any more, but they were still compliant with the ISO 646 (or ECMA 6, or International Telegraph Alphabet No. 5) code because those characters were in "national use" positions, similar to what existed for the 5-level code.</p>
      <p>When the 8-bit code was developed, the first half matched the U.S. version of ITA 5, or ASCII, simply because that was the one in most common use. It's unfortunate that all languages can't have equal status, but Unicode, and the UTF-8 encoding of Unicode, have made it possible to use characters from other languages in many applications.</p>
      <p>URLs of web sites, though, ought to be something anyone can type in from any computer. However, just recently, it has become possible for Chinese web sites to have URLs in Chinese characters, due to the adoption of new standards.</p>
