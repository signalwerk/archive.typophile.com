      <p><cite>ASCII has letters and even ASCII art on the net uses fixed font.</cite></p>
      <p>You are confusing yourself, and everyone else, by using the terms ASCII and Font as if they are the same. There are plenty of fonts that Are Not ASCII at all.<br>
      "ASCII has letters" -- wrong. "ASCII defines a code for each character out of a limited set" -- better.<br>
      "ASCII art on the net uses fixed font" -- well, yeah. "ASCII art" is a term for a specific form of art, which <em>needs</em> a fixed font to be viewed properly, but other than its name is not inherently linked to ASCII. One can make "EBDIC art" as well (which, when viewed with an EBDIC aware editor, will look just like ASCII art). Presumably we'll going to see Unicode Art somewhere in the future.</p>
      <p><cite>Internationalised domain names e.g. <a href="http://idn.icann.org/#The_example.test_names" title="http://idn.icann.org/#The_example.test_names">http://idn.icann.org/#The_example.test_names</a> use punycode.</cite></p>
      <p>As said before, ICANN is looking into allowing (almost) any Unicode character in domain names. You'll have to wait for that. I hope you can live with the fact that the <em>actual</em> DNS name is still encoded in ASCII characters.</p>
      <p>Finally -- the crux of the heart of matter, so to speak:</p>
      <p><cite>I prefer having ASCII letter k/K to be another shape ..</cite></p>
      <p>ASCII characters don't have a shape. It's the <em>font</em> which you are using on <em>your</em> computer that dictates the shape of character for the Unicode U+004B (generally known as "LATIN CAPITAL LETTER K"). If you want to edit all of your fonts, replacing the glyph that defines the shape for the letter K with whatever you want.</p>
      <p>Oddly, this entire discussion seems to boil down to the fact that you do not grasp the <em>difference</em> between ASCII (a specific encoding, endorsed by anyone with half a brain), the letter K (which has nothing to do with "ASCII" in the general sense that it's only one of the 96 default characters in that encoding set), and fonts in general.</p>
      <p>As a footnote, I find the glyph घ (Devanagari letter Gha) vaguely disturbing. I feel like I'm sitting in a toilet bowl, looking up at just the wrong moment. Where can I protest against this glyph and request its removal from my computer?</p>
