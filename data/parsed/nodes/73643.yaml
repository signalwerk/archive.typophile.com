      <p>ASCII has letters and even ASCII art on the net uses fixed font.  </p>
      <p>I prefer having ASCII letter k/K to be another shape being क/क (there are height differences between lower and upper cases that can't be put by typing on this board software.)  </p>
      <p>Multilingual (not internationalised) domain names have not been possible so far as 2 or more language scripts are not allowed, e.g. http://www.booकs.com.  </p>
      <p>Internationalised domain names e.g. <a href="http://idn.icann.org/#The_example.test_names" title="http://idn.icann.org/#The_example.test_names">http://idn.icann.org/#The_example.test_names</a> use punycode.</p>
      <p>Latin/roman domain names use ASCII (not all) e.g. <a href="http://www.microsoft.com" title="http://www.microsoft.com">http://www.microsoft.com</a>.  </p>
      <p>A possible solution for having more than 2 language scripts in a domain name would be to also use punycode (different sort: punicode2) for latin/roman domain names.</p>
      <p>The words 'Multilingual' and 'Internationalised' with regard domain names have become confused and are used interchangeably.  This needs to be corrected.</p>
