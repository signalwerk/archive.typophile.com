      <p><cite>.. There is a super control / monopolistic aspect to ASCII system that can be seen by end users today.  </cite></p>
      <p>Correct. It's its one and big advantage -- it's called <em>standardization</em>. Without standardization (such as aforementioned ASCII protocol for e-mail headers), writing software would still be possible on a closed system, but communicating to other systems would be far more difficult.</p>
      <p>A historical point: before MS-DOS (utilizing ASCII encoding for storing file names on disk), CP/M ruled -- not one singular version, but just about every computer manufacturer wrote its own. One of CP/M's biggest drawbacks was inter-computer communication: a disk written on one computer could only be read by specially written software.</p>
      <p>Nowadays, with the World-Wide Web, computers need standards more than ever.</p>
      <p>What Sebastian says: nothing prevents you from taking a note book, draw all of the characters you need on it, and assign a unique number to each one. Then you write an OS (computer operating system) that uses your encoding to read and write data to hard disk and removable media. Still no problem -- an Open Source OS such as a Linux variant can be altered at wish. But if you are planning an e-mail client, you'll need to make a table that converts your encoding to ASCII, and the reverse. The same goes for storing data on external media: if you store a text file on an USB stick (utilizing your own file name scheme), any other computer will not be able to read it. Even if you write a tool to be able to access the files, you still would not be able to open and read your file with Word -- for that, you'd need yet <em>another</em> conversion tool.</p>
