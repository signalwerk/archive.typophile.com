    html: |-
      <p>Switch to the Index mode and use drag-and-drop, or use Glyph / Sort Glyphs. There, you can choose whether you want to automatically sort the glyphs by glyph name, by Unicode codepoint, or by the encoding selected in the Names mode. </p>
      <p>Cheers,<br>
      Adam</p>
