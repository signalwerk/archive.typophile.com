    <p>Hi!<br>
    I'm the guy that was restoring an archive of wooden typefaces from southern Italy.</p>
    <p>I have some new proofprints of some of our typefaces, please take a look if you have any clue on their ID!</p>
    <p>thanks<br>
    A.</p>
    <p>ps - I've built a proof press, soon I'll show you some pictures of it!</p>
