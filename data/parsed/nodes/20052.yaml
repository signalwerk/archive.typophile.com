      <p>I am customizing Garamond Premier Pro for a customer by adding several new glyphs (mostly underdot characters) using FL 502. There have been several issues with the kerning and small caps feature in the custom font.</p>
      <p>My export settings are good according to earlier items in this thread.<br>
      The program will generate an OTF-ps font with the additional glyphs, but it retains only it's original OpenType tables and features.</p>
      <p>My 1st concern is working through the kerning issues.<br>
      I have several problems with it working as it should.</p>
      <p>I have assigned the new glyphs to FL's kerning classes (e.g. the cap underdot T is in the same kerning class as cap T with cap T being the parent or key glyph of the kerning class).<br>
      When I enter the metrics window the kerning pair values are visible in the kerning fields for the original glyphs (cap T and lower case a for instance) but not for the new glyphs until I actually click into or activate the kerning field.<br>
      Have others seen this behavior?</p>
      <p>FontLab support has been reasonably responsive and advised me to subtable the kerning feature (a very tedious process in a font with 10,000 plus kerning pairs?). My most recent query to them said:<br>
      "I am having issues with subtabling the kerning feature"<br>
      Their response was:<br>
      This is a known problem with no easy fix. It's a problem (flaw in design) of the OpenType font format.<br>
      Do others concur with this statement?</p>
      <p>If I try to recompile the OT Tables after updating the kerning feature I get an error like: [FATAL]  GPOS feature 'kern' causes overflow of offset to a subtable (0x2c226).<br>
      Each time I manually add a new subtable to the kern feature (by keying in "subtable;" between 2 lines in the FL's OpenType panel) the subtable number in the error changes.<br>
      (And again, the new glyphs are not part of the updated kerning tables unless I have manually activated them in the Metrics window.)</p>
      <p>Can someone offer me some guidelines to subtabling? other than Adobe's and Microsoft's suggestions to "divide the class in half with a subtable command" until it compiles succesfully.</p>
