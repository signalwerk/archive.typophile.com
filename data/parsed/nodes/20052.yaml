    <p>Hi,</p>
    <p>I have reached the final stage in a type design project<br>
    for my degree and I seem to have encountered a problem with my kerning pairs.</p>
    <p>FL 5 seems to be ignoring my kerning classes and the values in<br>
    my (metrics) kerning mode window and using the basic metric set for kerning etc.<br>
    When I quicktest the typeface within FL it uses the kerning settings, but not when exported!?</p>
    <p>Has anyone encountered this problem before? I thought it might be an exporting preference that I have not selected but I think I have tried nearly everything.</p>
    <p>Any Ideas,</p>
    <p>MD</p>
