      <p>I am not sure what you mean -- does the FLS5 Metrics Panel (if in Kerning mode) not show any kerning values, or does the font which you generated not use kerning which you defined? Which font format are you generating, PST1 or TTF or OTF? If kerning is not recognized in an application using the font generated, which application is it?</p>
      <p>If it is the generated font only that ignores your kerning, then you might check the FLS5 Preferences(Mac)/Options(Win), last point "kerning" in the section for OpenType export (left column), therein the bottom option (something like: "generate/rebuild kern feature?") -- this should be checked.<br>
      Alternatively, you can use the Kerning Assistance and "update kern feature" manually.</p>
      <p>Sorry that this is more questions rather than answers ...</p>
