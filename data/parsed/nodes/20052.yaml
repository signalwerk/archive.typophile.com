    html: |-
      <p>&gt; <em>Do others concur with this statement?</em></p>
      <p>Yes. Each GPOS table has to be below 64K, otherwise you get that overflow error.</p>
      <p>Every time you use “subtable;” you're creating a new GPOS table. The downside effect of creating a new table is that classes that are only present in one of the tables, can't be kerned with classes in other tables.</p>
      <p>What you could try to do is to <em>save table space</em>. This can be achieved by decomposing any class-class entries into single pairs <code>pos</code>, when both classes are constituted by only one character/glyph. Example: Lets say you have the following classes</p>
      <p><code>_x_left: x'<br>
      _q_right: q'</code></p>
      <p>and that you kerned 'x' with 'q' by '-10'. When you hit "Update [kern] feature", FontLab will generate the following entry</p>
      <p><code>pos @_x_left @_q_right -10;</code></p>
      <p>Since this is expressed as class-class, it is starting to eat up some of the "precious" 64K without being really necessary, since you can express that pair simply as</p>
      <p><code>pos x q -10;</code></p>
      <p>and place it at the top of the <code>kern</code> feature, before class-class entries.<br>
      Unfortunately, FontLab won't do this for you, so you either have to do it by-hand, or write a smart Python macro.</p>
      <p>BTW, the original Garamond Premier Pro <code>kern</code> feature only makes use of <code>subtable;</code> twice. This avoids table overflow, and puts classes from different scripts in separated tables.</p>
      <p>[Edit: Some developer resources below]<br>
      <a href="http://partners.adobe.com/public/developer/opentype/index_table_formats2.html#PP" rel="nofollow">The Glyph Positioning Table</a>, aka <a href="/wiki/GPOS" class="freelinking" rel="nofollow">GPOS</a><br>
      <a href="http://partners.adobe.com/public/developer/opentype/index_tag7.html#kern" rel="nofollow">The 'kern' feature</a> (not to be confused with <a href="http://partners.adobe.com/public/developer/opentype/index_kern.html" rel="nofollow">The Kerning Table</a>)<br>
      <a href="http://partners.adobe.com/public/developer/opentype/afdko/topic_feature_file_syntax.html#6" rel="nofollow">GPOS rules/syntax</a></p>
