    html: |-
      <p>It should not matter if kerning values are positive or negative. If they are in the kern feature, they should go into the font and be recognized by Adobe apps.<br>
      (If you make PS-flavored OTFs, in "Options/Preferences"--"Generating OpenType &amp; TrueType"--"Kerning", you should only mark "Generate OpenType kern feature &amp;c". In the first section "Generating OpenType &amp; TrueType", bottom part, "Export OpenType Layout tables", "Compare feature definitions" and "Generate GDEF table" should be on.)</p>
      <p>Using classes may help you keep the number of kerning pairs smaller. In the middle of <a href="http://typophile.com/node/18452" rel="nofollow">this thread</a>, there was a bit more about kerning and classes.</p>
      <p>How do you space/kern your font? Normally, letterspacing should be done in metric mode entirely, by adjusting the spaces to the left and right side of each glyph. (This is still the old metal type model.) And only if this resulted in good letterspacing, then you switch to kerning mode and refine individual critical pairs, say, VA AV &amp;c. But this should be the very last step, and not affect too many pairs (at least in theory), if you don't want to get crazy!&nbsp;&nbsp;;-)</p>
      <p>Karsten</p>
