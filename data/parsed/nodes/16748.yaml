      <p>Hasn't it occured to you that the money making people <em>might</em>'ve used a font that's not simply available as a commercial typeface. Yaknow, like, to make forging money a <em>little</em> harder. ;^)</p>
      <p><em>And don’t feds have anything better to do then search forums for people who might ask what's that font's name ?</em></p>
      <p>Dude, you wouldn't know what we've been asked to identify in the past: type on passports, identity cards from various countries, bank cheques, credit cards, all kinds of serial numbers... It <em>does</em> leave you wondering what all these people need that information for. You'll have to excuse us for getting a little suspicious whenever we get such a request. Especially when the person requesting that infomation decides to stay anonymous and signs up as "zzzz"... No offense. :^)</p>
