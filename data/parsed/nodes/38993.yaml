  html: |-
    <p><strong>S U D T I P O S</strong> //// N E W S // F O N T - R E L E A S E /////</p>
    <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150123074738im_/http://typophile.com/files/bellastypophile_5477.jpg"></div><p></p>
    <p>When the brush of Angel Koziupa and the technical expertise of Ale Paul go face to face with the art deco aesthetic, you end up with a beautiful face like <strong><a href="https://web.archive.org/web/20150123074738/http://www.veer.com/products/typedetail.aspx?image=UMT0000299" rel="nofollow">Bellas Artes</a></strong>. The sensual curves provided by Koziupa become players in a game of equals, where there is no such thing as the better half. Both sides of the characters complement each other like lovers in a perfect romance.</p>
    <p>Bellas Artes is an excellent choice for packaging design, book covers, and music-related artwork aimed at the feminine demographic and classical tastes.</p>
    <p><strong><a href="https://web.archive.org/web/20150123074738/http://www.sudtipos.com/" rel="nofollow">Sudtipos</a></strong></p>
