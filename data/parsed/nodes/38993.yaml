  html: |-
    <p><strong>S U D T I P O S</strong> //// N E W S // F O N T - R E L E A S E /////</p>
    <p><img src="/sites/default/files/old-images/bellastypophile_5477.jpg"></p>
    <p>When the brush of Angel Koziupa and the technical expertise of Ale Paul go face to face with the art deco aesthetic, you end up with a beautiful face like <strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000299">Bellas Artes</a></strong>. The sensual curves provided by Koziupa become players in a game of equals, where there is no such thing as the better half. Both sides of the characters complement each other like lovers in a perfect romance.</p>
    <p>Bellas Artes is an excellent choice for packaging design, book covers, and music-related artwork aimed at the feminine demographic and classical tastes.</p>
    <p><strong><a href="http://www.sudtipos.com">Sudtipos</a></strong></p>
