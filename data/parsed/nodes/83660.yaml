      <p><a class="freelinking external" href="http://www.signographie.de/cms/front_content.php?idart=215" rel="nofollow">Andron Mega</a> is a Venetian Roman face designed to serve scientific publishing, in the fields of humanities and linguistics in particular.<br>
      By now Andron Mega Regular contains about 5500 glyphs, it comprises these writing systems:<br>
      – Latin<br>
      – Cyrillic<br>
      – Greek<br>
      – Coptic<br>
      – Gothic<br>
      – Runic<br>
      – Ogham<br>
      – Old Italic</p>
      <p>Exhaustive Unicode support is given for Latin, Greek and Cyrillic. Additionally, Andron Mega provides complete Unicode support for Phonetics and Hundreds of ligatures, fractions, numerals, abbreviations, currency signs, symbols and many other typographical fancies.<br>
      Candidates for an upcoming extension of Andron are most likely Hebrew, Armenian and Georgian; perhaps Arabic.</p>
      <p>More Roman fonts of the kind are to be find at the <a class="freelinking external" href="http://www.mufi.info/fonts/" rel="nofollow">MUFI site</a>.</p>
      <p>One of them has been upgraded recently: <a class="freelinking external" href="http://guindo.pntic.mec.es/~jmag0042/alphabet.html" rel="nofollow">Alphabetum</a> boasts with about 6300 glyphs and many writing systems.</p>
