      <p>Of course, multi-scripts fonts have a very specific market.<br>
      I see a number of scenarios where more than two scripts may be needed:<br>
      – Transnational corporations operating in various countries;<br>
      – University departments focused on History, Languages and multi-cultural issues;<br>
      – Works about Linguistics, History, Anthropology and similar areas;<br>
      – Reference books, as dictionaries and encyclopæedias;<br>
      – Material produced by international organisations (UN, FAO, WIPO, etc.);<br>
      – Software with wide language support;<br>
      – Turistic material.</p>
