      <p><cite>Is there any need for that?</cite></p>
      <p>Igor Freiberger has made some good points already for that. Additionally comes to mind:</p>
      <p>– the six main languages of the UN are Arabic, Chinese, English, French, Russian and Spanish. There you have 4 writing systems at once.</p>
      <p>– In Israel Hebrew, Arabic and Latin are in everyday use, not to forget Russian – 3 or 4 writing systems at once.</p>
      <p>– The major scripts of India count about a dozen or more.</p>
      <p>– In classical studies there is very often to deal with Hebrew, Greek and Latin on one page, even in the same sentence. Depending on the subject and period dealt with one is likely to additionally encounter Arabic, Phoenician, Syriac, Etruscan, Old Egyptian (3 systems only for that!), Linear A or B, Coptic, Ethiopic, Gothic, Glagolitic, Armenian, Georgian, Runic, … You can establish that situation for any region other than the Euro-Mediterranean: America, Asia, Africa.</p>
      <p>– The literal history of Azerbaidzhan comprises Arabic, Cyrillic and Latin. I’m curious how a written history of the land’s literal heritage may look like.</p>
      <p>– In user instructions for any technical device you often find the explanations in 20 or more languages, which means: Latin, Cyrillic, Greek, Arabic, Hebrew, Korean, Japanese, Chinese, …</p>
      <p>These are only few examples which come to mind instantly. In the age of ”globalization” the multiskriptive situation will rather increase than decline. Beyond the target of 3 or 4 scripts to be adjusted.</p>
