      <p><em>...the SIL fonts (Doulos, Gentium, Charis) also covers many scripts, but you don't get the same level of visual identity</em></p>
      <p>Actually, these fonts (esp. Gentium) have been designed with a great deal of visual unity between the scripts (Latin/Cyrillic + Greek in Gentium).</p>
      <p>There are a lot of different aspects to visual unity - harmonized sizing (which <em>doesn't</em> mean the same dimensions), perceived weight, consistent level of contrast, curve and terminal styling, etc. So while it's easy to unity Latin &amp; Cyrillic, it's more difficult to add a Hebrew or Arabic to the mix, but it can be done very well.</p>
      <p><em>It’s a monstrous perspective but: ONE decent font containing EVERYTHING in a harmonized fashion – this is the target.</em></p>
      <p>I used to think that, but in the last decade I've completely changed my mind. Browsers and devices these days are quite capable of using fonts specified for specific character ranges. Super Mega Pan Script fonts that try to serve many different scripts equally well are difficult to maintain, take huge resources, and are always a compromise. For example, you can't really do a good job in setting hinting control values or alignment zones when you have a dozen scripts.</p>
      <p>It would be much better to instead have an interrelated 'clan' of fonts where any one family only tries to serve scripts that are really visually related. Then multiple families could be used together (international documents, brand packaging...) with both fidelity to the script conventions and harmony to the 'clan'.</p>
