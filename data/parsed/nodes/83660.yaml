    <p>Hello everyone, </p>
    <p>I was wondering if someone could name me a few type super-families that offers maximum scripts or language support? I am not considering typefaces like Arial Unicode, they seems to me are different typefaces (at least their Indic fonts) compiled together. I was curious to know about the families that offer true companions such as Fedra Sans (Latin, Greek, Cyrillic, Arabic, Devanagari etc).</p>
    <p>Thanks!</p>
