      <p>I second Andron Mega. It is a wonderful font, with visual elements that compose a strong identity through all scripts supported.</p>
      <p>Another source is Rosetta foundry. Their fonts are also high quality products with multiple script support –although not so wide as Andron.</p>
      <p>Alphabetum and the SIL fonts (Doulos, Gentium, Charis) also covers many scripts, but you don't get the same level of visual identity. Another source is Unifont.org: the fonts available also covers many scripts (but again, without high quality design).</p>
