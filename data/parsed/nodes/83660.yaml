      <p>Arial Unicode MS, as Satya said, is basically different typefaces thrown together. Andron Mega, Fedra, and the typefaces I mentioned are multi-script families where the different components were designed to go together.</p>
      <p>If you're just looking for fonts that support multiple writing systems, a professional Japanese font may reasonably include hiragana, katakana, kanji, Latin, Greek, and Cyrillic, but the latter three will usually be existing designs chosen to match the specifically Japanese scripts. I know Korean fonts that cover all those writing systems and of course the Korean alphabet, but the same point applies. It is rare to see sizeable multi-script families where each component is designed from scratch to harmonize with one another, not just taken from an existing catalogue. I believe this is why Satya is asking this.</p>
      <p>Lots of popular designs like Gill Sans, Meta, Palatino, and Farnham that were not necessarily created to be multi-script families are later adapted to different scripts like Greek, Thai, and Arabic due to client demand.</p>
