  html: <p>Designed by <a href="/wiki/William%20Addison%20Dwiggins" class="freelinking" rel="nofollow">William Addison Dwiggins</a> for <a href="/wiki/Mergenthaler%20Linotype" class="freelinking" rel="nofollow">Mergenthaler Linotype</a> under the direction of <a href="/wiki/C.H.%20Griffith" class="freelinking" rel="nofollow">C.H. Griffith</a> starting 2/3/42 through 7/2/45. Also known as Experimental 269 in the drawing offices at <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>. Re-drawn by <a href="/wiki/David%20Berlow" class="freelinking" rel="nofollow">David Berlow</a>, <a href="/wiki/Tobias%20Frere-Jones" class="freelinking" rel="nofollow">Tobias Frere-Jones</a>, and <a href="/wiki/Thomas%20Rickner" class="freelinking" rel="nofollow">Thomas Rickner</a> at <a href="/wiki/The%20Font%20Bureau%2C%20Inc" class="freelinking" rel="nofollow">The Font Bureau, Inc</a> for Premiere magazine in 1994.</p>
  html_clean: <p>Designed by <a href="/wiki/William%20Addison%20Dwiggins" class="freelinking" rel="nofollow">William Addison Dwiggins</a> for <a href="/wiki/Mergenthaler%20Linotype" class="freelinking" rel="nofollow">Mergenthaler Linotype</a> under the direction of <a href="/wiki/C.H.%20Griffith" class="freelinking" rel="nofollow">C.H. Griffith</a> starting 2/3/42 through 7/2/45. Also known as Experimental 269 in the drawing offices at <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>. Re-drawn by <a href="/wiki/David%20Berlow" class="freelinking" rel="nofollow">David Berlow</a>, <a href="/wiki/Tobias%20Frere-Jones" class="freelinking" rel="nofollow">Tobias Frere-Jones</a>, and <a href="/wiki/Thomas%20Rickner" class="freelinking" rel="nofollow">Thomas Rickner</a> at <a href="/wiki/The%20Font%20Bureau%2C%20Inc" class="freelinking" rel="nofollow">The Font Bureau, Inc</a> for Premiere magazine in 1994.</p>
