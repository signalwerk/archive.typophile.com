  html: '<p>i’d like to convert some old fonts used on the geos operating system. has anyone done this sort of thing?  <br><br><span class="caps">GEOS</span> fonts: <br><a href="https://web.archive.org/web/20191002040623/http://www.funet.fi/pub/cbm/geos/graphics/fonts/" target="_blank">http://www.funet.ﬁ/pub/cbm/geos/graphics/fonts/</a> <br><br>I’ve found “Font-<span class="caps">TTF</span>-0.34” (Martin Hosken’s free Perl module for TrueType font hacking) which apparently converts cvt ﬁles. <br><br>are there any other utilities that i might be able to use in a windows environment? <br><br>cheers, <br>chris</p>'
