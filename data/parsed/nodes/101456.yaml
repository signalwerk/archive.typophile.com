      <p>Official statement: I love you both.</p>
      <p>The only problem there is is that while American Uncial has an international character set, Kelt Caps Freehand does not. I was specifically looking for a Spanish character set (whose only differences with the English one are the ÁÉÍÓÚ, the letter Ñ and the ¿ and ¡ symbols) but I think that with a bit of playing around with the font and having a look at my source material, I'll be able to make them.</p>
      <p>Again, thanks!</p>
