      <p>Wow, thanks! It certainly looks like it, even more when I look at number 5, which I also have a sample of.<br>
      I've looked at <a class="freelinking external" href="http://www.identifont.com/show?BDR" rel="nofollow">American Uncial (Mecanorma)</a>, following your suggestions, and I think it must be this one.</p>
      <p>So thanks again for having found it!</p>
      <p>Do you know if there is any version of it with the outlining? I know that the reflections were custom-made for TV, but the version I saw in the bar had exactly the same outlining, which isn't just in the outside borders of the font, but also in some inside parts (for example, A or T).</p>
