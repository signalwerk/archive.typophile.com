  html: |-
    <p>Great design, because it signals its anti-establishment cred with a Jamie Reid punk-style ransom note collage, playing off that culture-jamming cliché to engage the viewer into concluding that the letters are torn from Big Food packages.</p>
    <p>However, as an art director I’m aware how protective those companies are of any unauthorized commercial use of their trademarks, or part thereof, and suspect that this is a deception.</p>
    <p>So I’m engaged too!<br>
    Are you?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/15797397_6065.jpg"></div><p></p>
