      <p><cite>I suspect that one would have to dig deeper than specimen books to find the answers.</cite></p>
      <p>That is why I am starting with Akzidenz. As much as I would love to do all that research, I fear that it will not be possible with the resources available to me, particularly time. You make a good point about contemporary grotesques, and researching those would probably turn up a lot of useful information about their roots that could later lead to deeper research.</p>
      <p><cite>What do you mean by “significant”?</cite></p>
      <p>So far I have been thinking of significance in several ways, certainly too losely. I see that I need to reconsider what makes the typefaces significant, in terms of technical/aesthetic developments, history, and influence on descendents and derivatives. Ditching Meta, and even Helvetica, and focusing more on the types that stay closer to the late Nineteenth and early Twentieth century grotesques seems like a much better idea.</p>
