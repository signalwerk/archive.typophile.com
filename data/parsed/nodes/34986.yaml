    <p>I am starting a research project—hopefully to become my thesis—regarding the design of grotesque typefaces. My goal is to identify the commonalities in grotesque type as well as the individual quirks, flaws, and standout features, then use the knowledge gained to develop a neo-grotesque of my own. I think that ten faces will be enough, and right now I am still a little unsure about which ones to choose. Following are fonts I am looking at, I would appreciate your feedback.</p>
    <p>The Current Contenders:<br>
    1. Akzidenz-Grotesk: A great starting point, as it is the first grotesque to make the jump from jobbing to serious work. Also important as it was the starting point for the design of Helvetica.<br>
    2. Franklin Gothic: This appears to be the first significant American sans and has remained popular since it was introduced.<br>
    3. Trade Gothic: I am unsure about including Trade Gothic. While it appears to have enjoyed decades of popularity, the more I look at it, and into its history, the less reason I see to include it.<br>
    4. DIN/FF DIN: Important because of the historical signficance of the DIN organization in design and because I think that the narrower, more vertical design than its predecessors which has influenced the design of the neo-grotesques.<br>
    5. Monotype Grotesk: Again, this one seems much less significant as I move along—its only real significance seems to be that Arial is pretty clearly rooted deeply to the design of Grotesk 215 as well as Helvetica.<br>
    6. Univers: I’m pretty sure this one requires no explanation.<br>
    7. Helvetica: Honestly, there’s so much to pick at here that I would love to be able to leave it out for the sake of balance.<br>
    8. Neue Helvetica: I think that this one should at least be combined with Hevetica, if not dropped entirely. While the design does an excellent job fixing the flaws in the design of Helvetica and making it consistent across weights, from what I can tell, the high cost of complete sets has made it somewhat unpopular.<br>
    9. Arial: Do I include this one for the sake of its popularity, or just dismiss it as a fluke?<br>
    10. Meta: Historically Meta seems especially important as the first really popular neo-grotesque. Because Meta is so well designed, an examination of the features Prof. Spiekermann incorporated reveals a lot about its predecessors. </p>
    <p>I am also considering adding Verdana to the list, this seems justified as Verdana seems to be the most significant well-designed grotesques meant for onscreen use. It certainly seems like a better choice than Arial.</p>
