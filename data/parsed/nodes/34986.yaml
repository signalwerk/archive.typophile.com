    html: <p>James, one of the most helpful insights I learned about design history was from an very old show on PBS about antique furniture. The guy would put one chair or something on a pedestal, and go on rhapsodizing about it for a half hour—or maybe it was an hour. It was great. One of the things he always said was that if you want to understand an object, look at the period just before it. Every craftsman is reacting to what came just before, what he has grown up with. It’s true, and that’s the key. So I think concentrating on the original grotesques, and then going forward to look at modifications is a great idea.</p>
