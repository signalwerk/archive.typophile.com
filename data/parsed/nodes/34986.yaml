      <p>This seems to lack focus at the moment.</p>
      <p>Historically, there are a lot of variations of the grotesque, more than enough for learned library research; and there are huge lacunae surrounding the origins of the genre, and the origins of its lower case and italics. I suspect that one would have to dig deeper than specimen books to find the answers.</p>
      <p>At the other end of the scale, today there are many foundries doing “their” grot — OurType and Process spring to mind — and IMO these are more interesting extensions of the genre than widening it to include Meta etc. In fact, Meta has spawned its own genre.</p>
      <p>The Helvetica-ish category is presenterd in the recent FontShop promotion, and Stephen Coles amassed quite a few fonts for that.</p>
      <p>What do you mean by “significant”? certain forms of historical research could quantify that, eg the gross weight of foundry type sold, or the number of newspaper readers. In general I am extremely sceptical of that term, as it is used by authors to justify there own preferences, preconceptions, and prejudices. I’ve designed a couple of grots, with another on the way, all of which I consider extremely significant! — and for quite different reasons.</p>
