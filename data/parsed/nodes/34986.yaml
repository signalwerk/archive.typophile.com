      <p>Gill is sort of the grandaddy of humanist sans type, so it’s out. Metro and Futura are geometric sans, and even farther from what I want to get into than Helvetica/Univers. Gotham falls into some weird vernacular hybrid category (Along with Neutraface and other similar designs) that I’m not about to try categorizing. </p>
      <p>After thinking about this stuff some more, I see two options<br>
      1. Cut things off, stylistically, just before Helvetica/Univers. This way I get to focus more on grotesques with a more human quality than those with none. I also don’t have to worry about the grotesque/neo-grotesque categorization arguments. Design-wise, this sends me down the path of a traditional grotesque.</p>
      <p>2. Ditch my earlier notion of neo-grotesque and treat Univers and Helvetica as the origin of the neo-grotesque (which after a little reviewing last night I think is correct) and follow those developments up with the newer categories that come with the innovations of Meta, Verdana, etc.. This one is a little more appealing as it gives me reason to explore the definitions of new categories, and to create a contemporary design of my own.</p>
