      <p><cite>What makes Meta a Neo-Grotesque? (What is a Neo-Grotesque?)</cite></p>
      <p>I <em>think</em> that Neo-grotesques are designs that add humanist quirks to the old grotesque designs. IIRC the term appeared in <em>Revival of the Fittest</em> and may appear in <em>The Complete Typographer</em>. It’s a pretty rarely used term, so the whole notion is murky.</p>
      <p><cite>I would be interested in further research into earlier (earliest) grotesque designs and their precursors.</cite></p>
      <p>As would I, but that would require traveling to Europe to peruse old specimen books and other printed works, along with learning in German. It would be an excellent graduate thesis (or better yet, a PhD.), but it’s not doable with the time and budget I have for undergrad work.</p>
      <p>As for what fits under the mantle of a grotesque, I guess that it just depends on how loosely one defines the term. I should probably come up with some solid definitions for the categories I want to look at and figure out if they fit under my umbrella of grotesque or if I need to adjust my targets.</p>
