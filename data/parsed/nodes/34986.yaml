      <p><cite>I would be too - my understanding is that Akzidenz-Grotesk had come to stand for a whole bunch of 19c typefaces.</cite></p>
      <p>Akzidenz was a label applied to a handful of typefaces that the original H. Berthold AG bought up between 1890 and 1920. In 1957 and 1958 G.G. Lange redrew the whole line to fix a lot of the inconsistencies—although he left a few—and expanded the range. There are some really great threads that explore the history of AG. But it’s been over a century with two devastating wars and some serious economic and social upheavals since those old grotesks were folded into the AG name, so tracking down information is a pretty serious undertaking.</p>
