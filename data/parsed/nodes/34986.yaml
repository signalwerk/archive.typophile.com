      <p>Other true grotesques worthy of your consideration would include Jonathan Hoefler’s <a class="freelinking-external" href="http://www.typography.com/catalog/champion/index.html">Champion</a> / <a class="freelinking-external" href="http://www.typography.com/catalog/knockout/index.html">Knockout</a> co-family as well as his <a class="freelinking-external" href="http://www.typography.com/catalog/leviathan/index.html">Leviathan</a> display type, Eric Olson’s <a class="freelinking-external" href="http://www.myfonts.com/fonts/processtype/maple/">Maple</a>, David Berlow’s <a class="freelinking-external" href="http://www.fontbureau.com/fonts/BureauGrot">Bureau Grot</a> (based of Stephenson Blake models from the 1800s), and Frantisek Storm’s <a class="freelinking-external" href="http://www.myfonts.com/fonts/storm/dynagrotesk/">Dyna Grotesk</a>.</p>
      <p>Conrad Baur &amp; Walter Baum’s <a class="freelinking-external" href="http://www.myfonts.com/fonts/urw/folio/">Folio</a> and Günter Gerhard Lange’s <a class="freelinking-external" href="http://www.myfonts.com/fonts/berthold/imago-bq/">Imago</a> also come to mind.</p>
      <p>Also, if you are going to include Franklin Gothic, you should also include its sisters, <a class="freelinking-external" href="http://www.myfonts.com/fonts/urw/news-gothic/">News Gothic</a>, <a class="freelinking-external" href="http://www.myfonts.com/fonts/linotype/lightline-gothic/">Lightline Gothic</a> and <a class="freelinking-external" href="http://www.myfonts.com/fonts/urw/alternate-gothic/">Alternate Gothic</a>, and should probably include a look at <a class="freelinking-external" href="http://www.fontbureau.com/fonts/BentonSans">Benton Sans</a> as well.</p>
      <p>David Thometz</p>
