      <p>I don’t consider Meta or Verdana to be grotesques, neo- or otherwise. I prefer a new category for Meta, “Narrow Information Sans”, which derives from Orator, Trade Gothic, and other categories of type. Verdana? Not sure how you’re associating that with the grotesque category. </p>
      <p>I would be interested in further research into earlier (earliest) grotesque designs and their precursors. Helvetica is really quite removed from them in its antiseptic regularity. Showing that evolution I think is interesting. </p>
