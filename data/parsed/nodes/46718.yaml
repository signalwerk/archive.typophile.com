      <p>Hi Fruity,</p>
      <p>at the time when Schulbuch Nord/Süd have been designed, the standard font used in Germany was Akzidenz Grotesk.<br>
      The reason for producing a special version of AG exclusively for school books was a simple one: Some letter shapes (like the lc. a) were adapted to the ones of the “Ausgangsschriften”, standardised hand writings taught at primary school in Germany. The intention was to interlink (and therefore facilitate) the process of learning both to read and to write.</p>
      <p>Cheers,</p>
      <p>Günni</p>
