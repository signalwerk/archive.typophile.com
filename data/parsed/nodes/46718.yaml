    html: |-
      <p>Looks like someone’s been playing around with Helvetica Bold, strangely cutting the n and p, borrowing the lc. s from Akzidenz Grotesk Bold and adding a Schulbuch Nord-inspired lc. l.</p>
      <p>If you’re looking for a similar (but consistently designed) font I’d recommend Schulbuch Nord, which is a reworked Akzidenz Grotesk that has been designed for German schoolbooks. There’s also Schulbuch Süd (aka Schoolbook Alternate etc.), which has a slightly more Futura-like feel.<br>
      Please note that both Schulbuch Nord and Süd have the single storey a.</p>
