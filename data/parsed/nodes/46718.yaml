    <p>What is this font used on <a href="https://web.archive.org/web/20080829121933/http://img396.imageshack.us/img396/2586/splinteruz2.jpg">this 1999 album cover</a>? </p>
    <p></p><div class="imageWrap"><img src="/web/20080829121933im_/http://typophile.com/files/splinter-crop_5285.jpg"></div><p></p>
    <p>I’ve tried Identifont and WhatTheFont, but no luck. It seems to be Helvetica bold, but the <em>s</em> and <em>l</em> aren’t right. (Neither are the <em>p</em> descenders, but those might just be customized). </p>
    <p>Thanks for your help.</p>
