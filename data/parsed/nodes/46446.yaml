      <p>I love Kabel, and would agree that a reworking with some of the more quaint or mannered idosyncracies would benefit.</p>
      <p>Whild I love the W, i dont like the low cross bars on the E F H, and the short terminla on the j, the unusual g, and thet tall ascender of the t.</p>
      <p>The slanted bar on the e is important, but i wonder if the angle could be reduced and the balance of the letter improved greatly.</p>
