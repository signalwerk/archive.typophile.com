    <p>Hello, I have recently been reworking Kabel.</p>
    <p>The reason for this is that I never liked the cuts in the terminals, which put me off using it quite alot. Which is a shame as it's such a nice font.<br>
    Once I had leveled out all the angled terminals I began to see other things that I wanted to change aswell.</p>
    <p>Anyway, I have included my work to date so please give me some critique on it!</p>
    <p>Henry.</p>
