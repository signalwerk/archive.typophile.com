    html: |-
      <p>The Cambridge Fontworks rip-off, like all of theirs, still contains the PSFontName of what they simply renamed, in this case, all three of their Jetsam fonts contain the original Snyder fontnames.</p>
      <p>WSI produced some documentation with their fonts, usually indicating that a font was 'based on' or 'similar to' some other existing font. In the case of Speedy Marker, there is no such attribution. They DID actually create some fonts from scratch.</p>
      <p>I would hazard a guess that either WeatherlySystems  or Pat Snyder was the original digitization; and an even less-educated guess that there was no pre-digital version.</p>
      <p> - Herb V B</p>
