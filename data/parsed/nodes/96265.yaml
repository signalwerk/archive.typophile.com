    <p>Does anyone know the font used on this To Go sign for Famous Dave's. I believe it's the same font as what they use inb the logo, but I can't find it. It looks similar to Dom Diagonal, but it's slightly different.</p>
    <p>Any help is appreciated.</p>
    <p>Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/To-Go-Sign_5008.png"></div><p></p>
