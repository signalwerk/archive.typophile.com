    html: |-
      <p>The font in their logo (bellow) must be <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/mti/brophy-script/" rel="nofollow">Brophy Script</a></strong> </p><div class="imageWrap"><img src="http://typophile.com/files/FamousDaves_Logo_5319.jpg"></div><p></p>
      <p>The font in "To Go" sign can be found under a lot of different names/publishers:</p>
      <p>(1) <strong>Falkland</strong> - (C) 1994 Brendel Informatik GmbH<br>
      (2) <strong>Snyder</strong> -  Pat Snyder, 1797 Ross Inlet, Coos Bay, OR 97420 Shware $15<br>
      (3) <strong>Jetsam 1</strong>  - Cambridge Fontworks<br>
      (4) <strong>BrendalauerScriptSCapsSSK</strong> - Copyright 1995 Southern Software, Inc.,<br>
      (5) <strong>BlarneySCapsSSK</strong> - Copyright 1993 Southern Software, Inc.<br>
      (6) <strong>Speedy Marker</strong> - Copyright (c)1993,1996 Weatherly Systems, Inc.<br>
      (7) <strong>GE Quick Mark</strong> - Copyright 1999, Graphx Edge, all rights reserved</p>
      <p>Some of these publishers -at least (1),(4),(5) and (6)- are well known for their font forgeries, therefore I suggest to not use these fonts.<br>
      If somebody knows which is the original version/designer, please inform us.</p>
      <p>-----------------------------------------------<br>
      I found them using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
