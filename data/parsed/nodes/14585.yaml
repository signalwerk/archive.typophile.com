      <p>It's a very hard site to use. The javascript is sluggish and the page is too tall for my browser. So, I have to scroll down, click something, then scroll back up to see it.</p>
      <p>Also, the mystery-meat navigation is a bit arcane (but oh so typical on portfolio sites ;o) </p>
      <p>Also, some of the mystery meat bars are links and some aren't. Confusing.</p>
      <p>I'd suggest not using javascript, and make it a nice static site, or consider the flash option. But do put the navigation next to the actual images.</p>
      <p>BTW, very nice portfolio pieces!</p>
