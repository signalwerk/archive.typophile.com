    html: |-
      <p>I like that the site seems to be secondary to the work, which should be the focus of a portfolio site. The colors of your work really pop. Too many sites get in the way, visually.</p>
      <p>But, as others have noted, the navigation is a bit obtuse at first, and those first seconds of "now what do I do?" are so crucial. The striped image area could have your bio inside of it, since that's the focus at first, then you can move the portfolio navigation up closer to the images. You should probably differentiate between active and inactive items in the rectangle nav. Right now it looks like you designed a navigation that doesn't fit your content. Perhaps an outlined box?</p>
      <p>Then, I'd punch the heads up a bit. All of the type is a bit broken and light on my monitor (PowerBook 17"), so the heads should get a bit more weight/darkness to allow quicker comprehension of the site's structure.</p>
      <p>Nice work, by the way.</p>
