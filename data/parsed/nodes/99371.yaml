  html: "<p>Hello,</p>

    <p>My girlfriend is looking for a tattoo for a long time.<br>

    Now she wanted to have the words \"Ibu\" on her wrist.<br>

    Ibu means Mom, she wants to do this because her mom past a way 2 months ago.</p>

    <p>Now, She wants some curly letters, But not TO curly.<br>

    We are having a problem with the letter i in capital so I. We think this just looks to much as an J.<br>

    Now my question is if someone can help me, or making the letters, or to check out some fonts etc.</p>

    <p>Example we had in mind, we just don't like the I</p>

    <p>[IMG]http://i47.tinypic.com/wwelo9.jpg[/IMG]</p>

    <p>\x10I hope we can get some reactions,</p>

    <p>Jordie</p>"
