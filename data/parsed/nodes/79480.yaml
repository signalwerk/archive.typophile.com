      <p>I have no idea what art is.</p>
      <p>I've thought about this question for awhile now and tried to reply but every time I do I reach a point of no words. Crazy stuff considering I was raised up in a master's studio who's work is held in private and public collections around the world ...and was my father.</p>
      <p>Possibly, I think that art is nothing more than an expression and the quality of that expression can be measured. Which is also perplexing, considering that there are many different measuring sticks.</p>
      <p>I wanted to create a statement on modern day consumerism - so I created colored bacon. And after many millions of views later, many millions tweets, facebooks, interviews around the world - I still don't truly know what art is. </p>
      <p>I still think art is just an expression.</p>
      <p>I've played / designed in architecture, fashion, graphic design and nothing I've done can define 'art' as being nothing more than an expression. But having said that (whew) art has laws / rules / and regulations. No matter how 'natural' it may appear.</p>
