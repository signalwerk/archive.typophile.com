      <p>So far, I think Nick is closest to the truth. Hard to digest as it might be, one all encompassing theory (although not without its critics)  is the institutional art theory, as formulated by George Dickie. Basically, <cite>an object can only be(come) art in the context of the institution known as "the artworld".</cite><br>
      So anything can be art, as long as the context is legit. A typeface, a piece of poop.<br>
      That said I don't think it's particularly important for things I like/find beautiful and/or interesting to be art. </p>
