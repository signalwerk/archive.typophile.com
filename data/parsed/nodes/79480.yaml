      <p>@bowerbird:<br>
      <cite>anything beautiful created by human beings is art.</cite></p>
      <p>What about a baby?</p>
      <p>Of course, there, one can argue about the meaning of "created", and swiftly descend into theology.</p>
      <p>How about this as a closer attempt at a definition:</p>
      <p>Art is that which is designed, shaped, or crafted by human beings, with the intent of making it beautiful, expressive, or meaningful.</p>
      <p>That, at least, excludes that which exists due to human action, but the beauty of which is incidental to any human action involved - and allows for art that might be disturbing or shocking instead of beautiful, but which has "something to say".</p>
