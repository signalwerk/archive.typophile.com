      <p><em>John, your definition works within the boundaries of your culture and your culture's aesthetics. Other cultures or individuals might find no value aesthetically or otherwise in what you might call art.</em></p>
      <p>You're still not getting it. What I am calling art is the extra-utile quality of what humans make which appeals to the delight in beauty. Since this extra-utile quality of the made thing is, first and foremost, something that appeals to the delight <em>of the maker,</em> it is entirely irrelevant to the definition if someone else, whether from a different culture or the same culture, shares that delight.</p>
      <p><em>Of course that takes away some of the mysticism that artists like to robe themselves with.</em></p>
      <p>I'm all for taking away mysticism. Art is a quality of making, and while that quality has degrees -- including both failure and exceptional genius -- it is born of the same impulse in a painting as in baking a cake.<br>
      _____</p>
      <p><em>There was a show on a few days ago where guys were restoring a classic car and as they worked the body lines down to a smooth finish, they declared it art. Well, no. They are talented craftsmen, and there's a great skill and technique to it, but it's not art.</em></p>
      <p>See, I would say that there is art in the work, regardless of whether the object is something classed as art. There are elements in the original making of the car, and quite possibly in the restoration, that are extra-utile, that are unnecessary for the function of the object, but which appeal to sensory aesthetic delight. There isn't really another word for the quality of those elements except art.</p>
      <p>The class of objects called ‘art’ is something else, and I strongly recommend a distinction between art as a quality of objects and art as a category of objects. I would define objects as ‘art’ if either they lack objective function beyond their aesthetic enjoyment or their objective function is minimal relative to their aesthetic value. This invites a kind of holistic engagement with objects, because while something like an aboriginal mask might be appreciated only as an art object by a non-native observer, he can and should be aware that it also served a functional role in its original society.</p>
    html_clean: |-
