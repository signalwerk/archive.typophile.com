      <p>As Chris Dean was mentioning, art is one thing to us now and  another to us later, and quite another all together by the time we're dead. We always look back and say, "Well, yes, that was art." regardless of if the people then thought it was definitely not art.<br>
      It's constantly changing.</p>
      <p>So it is what we say it is in any given time and culture. However the distinction of fine art is usually that of having some loftier goals, a more theoretical or philosophical understanding that is trying to be conveyed. And it is for that reason alone I imagine they exist.</p>
      <p>Commercial arts may from time to time approach those values, but they are inspired by money alone.</p>
      <p>I think artists like to make money, and hope to, but their desire to create art is not driven by it.</p>
