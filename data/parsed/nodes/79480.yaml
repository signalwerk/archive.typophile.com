      <p>Bill: <em>I think the point of the "What is Art?" question, at least in philosophy, is to try to describe what is distinctive about the aesthetic experience, and the process of creating things or experiences that have aesthetic merit.</em></p>
      <p>I know philosophers who have written on and taught courses in Aesthetics, and as far as I can gather they don't bother with ‘What is Art?’ as a question. As one of them has said to me ‘Art is what artists make, and some of it is rubbish’, i.e. the question of what art <em>is</em> is independent of aesthetic merit. The philosophical question of Aesthetics is ‘What is beauty?’</p>
      <p><em>So John's description of art in terms of aesthetic experience, while sound, doesn't get at the issue.</em></p>
      <p>I talked about my personal experience, by way of example, when discussing art as a class of object, but I didn't use the term when describing what I think art is as a quality. I suppose we can only know that quality experientially, but I would have to consider that the quality of extra-utile beauty in a particular thing may be beyond my experience or, even, beyond the experience of anyone now living, but that such a quality may still be presumed and to have been experienced by the maker. Whenever we see evidently deliberately fashioned aspects of  a thing that are not explained by utility, we must, I think, presume that they may constitute art, even if we do not find them aesthetically pleasing.</p>
      <p><em>Nick's definition, though I'm sure useful for some purposes, doesn't address the question of understanding this dimension of human experience.</em></p>
      <p>Nor does it, as he suggested, end or bypass philosophical debate: it just shifts the grounds of debate from aesthetics or categories to socio-economics.</p>
