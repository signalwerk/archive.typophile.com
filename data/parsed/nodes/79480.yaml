      <p>People through out history have "made things" that later have been identified as being "Art".  There has never been a Litmus test for any of these "designations" or a way to prove the authority of any of those people who made the anointed judgments. Some of these are collected in museums, others are in peoples homes, some have been condemned by powerful conservative politicians and banished from public funded politically correct museumdom. There have been lists made of "surely these are art" and "surely these are not art."  If we confine ourselves to agreeing on objects that we consider art or not, we will never agree, even over time. The Sistine Chapel ceiling was, for many years, "dignified and deified" by having blue drapes painted over the naughty parts in Michaelangelo's original.  Centuries later, at great cost and with some damage, they were removed.</p>
      <p>I much prefer the original nonjudgmental method. Just "make stuff" and put it out in the world.  </p>
      <p>Those who can "make art" will, those that can't will judge, and those that hear the judgments will disagree or agree on their validity.  After that, others will ponder the collection of judgments in search of the definitive Litmus test and fail. This will be repeated ad infinitum.</p>
