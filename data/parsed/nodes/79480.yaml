      <p>With over 15 years of art college this horse is so dead the question doesn’t even come up any more. The end of the discussion is everything is art if you can contextualize/rationalize it. Just study 20th century art history. Some of my personal favorite include <a href="http://en.wikipedia.org/wiki/Artist%27s_shit" rel="nofollow">Artist’s Shit</a>, <a href="http://en.wikipedia.org/wiki/Bottle_Rack" rel="nofollow">Bottle Rack</a> and the <a href="http://en.wikipedia.org/wiki/International_Klein_Blue" rel="nofollow">IKB series. </a></p>
      <p>Two years ago, one of the graduating MFA’s from NSCAD University did absolutely nothing for his thesis. No work, no invitation for his exhibition, he didn’t even show up. And he got his degree. I saw an applicant to the department describe his thesis exhibition where in the gallery, he had his grandmothers bed to which he hot-glue gunned glass eyes and buttons. When you entered the room, you would trip an infrared wire which would make pubic hair fall from the ceiling. And he got a grant for it.</p>
      <p>Heck, even I have pulled this off. In my undergrad, for a performance, I showed up to class in my bathrobe and let them watch me make a cup of coffee. They even sat there as the kettle came to a boil. The coffee cup was on a piece of plywood which I had broken the ends off. Surrounding the cup were 16 steel rods which I had sharpened and driven into the board. The spoon was welded to one of the bars so it couldn’t be removed. It was to ”symbolize the importance of security and exclusion in a family unit blah blah blah.”</p>
      <p>I could go on for hours.</p>
