      <p>There was a soul-searching article in <em>Wired</em> a few years ago (around the time of the dotcom bust?) — imagining the ultimate challenge for an engineer: to build a clock that would last for aeons. The author's conclusion was that if that is the brief, then a social infrastructure to help maintain it should be considered part of the design.</p>
      <p>For fonts, however, it would probably be best to carve the code in stone and bury it in a pyramid tomb.<br>
      Or engrave it on a metal plate and dispatch it to Alpha Centauri.</p>
      <p>The point I'm making is that the shape of the letters (plus kerning and features), which is the pure the font (it's not a digitization of an analog artefact), exists independently of any particular output. It's code, like the "text" in books.</p>
