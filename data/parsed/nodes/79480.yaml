      <p>Nick, I think that in theory people who come out of art school can be paid for being artists even if what they produce isn't actually art, or at least art of any aesthetic merit. I do agree with John that there is an aesthetic dimension of experience that doesn't depend on whether you fit into the bourgeois box of the market for art labeled as such.  </p>
      <p>People could mistake something for art and pay for it out of their confusion. I think there's a certain segment of the art market that is distorted by speculators, and that kind of thing can happen. As you have pointed out, part of modern art has been stretching the notion of what art is. I suspect that in some cases it has been been stretched beyond being of aesthetic value, and in retrospect the market will be seen as a speculative bubble that bursts. Has this already happened?</p>
