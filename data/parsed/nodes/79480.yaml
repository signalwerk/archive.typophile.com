      <p><cite>the difficult question is "what makes something beautiful?"</cite></p>
      <p>What an absurd definition!</p>
      <p>Art is not necessarily beautiful. But if, would the explosion of a fusion bomb, which looks beautiful, be also art? Or a photo taken from the explosion of a fusion bomb? Neither nor! And if the main aspect of art is beauty, why is it relevant then, that it was created by a human? The question “Who has made it?” should be unimportant for the viewer/smeller/taster/listener/toucher. With regard to that question it’s enough, if you can affirm, that the questionable object could have been created not just by chance. In other words, if you run a computer program, that unintelligently creates one trillion images, from which one exactly looks like the Mona Lisa, it is as good as the Mona Lisa.</p>
      <p>In case of typefaces they mostly have the function to transmit concrete information. If these typefaces would be a kind of projection surface for mind and soul of the viewer, they would not be legible anymore. The very most typefaces are not art. But this does not mean, that the creative process of a typeface designer <cite>can</cite> be similar to the creative process of an artist.</p>
      <p><cite>My typefaces are art (I went to art school).</cite></p>
      <p><cite>Some typefaces have recently been "acquired" by the Museum of Modern Art …</cite></p>
      <p>That hopefully was a joke, because it sounds like: On TV they have said, that there are weapons of mass destruction in Iraq. And because they said it on TV, it must be true.</p>
