      <p>@ russellm</p>
      <p>So then- what is the function of a work of art?<br>
      If you want a portrait of a loved one, you could just snap a picture- or you could hire a portrait photographer. What would the difference be? I am saying that there is a gap between what is needed and what is a work of art.</p>
      <p>I have always self-identified as an artist, but I am paid to be a craftperson, so this issue has been quite pressing in my thoughts. If I am asked to provide the graphics for an ad with a fourty-five minute deadline- I will not be producing art, though what I provide will be servicable. Given a week, I might squeeze some art into the project. I think this distinction is important. Also, to make the point that art is not 'whatever I say is art', but some quality that transcends funtionality. Quality. I assert that insomuch as something is art, it has a quality that transcends its funtion.</p>
