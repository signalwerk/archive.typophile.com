      <p>I remember a conclusion arrived at through the history of modern art, and similar to Nick's--"art is what artists make."</p>
      <p>One can build a box and somehow it is not art. But if one builds a box and is reacting to the prior frivolities of say, Victorian or the like, then this puts it in context and can be considered art. </p>
      <p>I can never wrap my head around it. For one, wouldn't it seem that in this case the art is only art because it's based on something else we already define as art. As if, this new art has no intrinsic value in and of itself but only by way of that relationship?</p>
      <p>Two things I can think of have intrigued me lately on this question:<br>
      The 2007 Documentary "My Kid Could Paint That" as well as the recently Oscar-nominated, unfortunately not Oscar-winning (though that would be quite ironic and laughable) Banksy's "Exit Through the Gift Shop."</p>
