      <p>Nick, the institutional definition appears to work neatly as a categorisation of the class of art objects. I think it is actually too narrow, in that it locates the definition of art within a particular econo-cultural phenomenon, ‘the artworld’, and ignores the many other contexts in which people all over the world, individually or collectively, call things art. The pure nominalist definition -- art is everything that people choose to call art -- seems to me both more generous and more accurate.</p>
      <p>Again, though, these kinds of definitions work in terms of categorising art as a class of things; they don't contribute to an understanding of art as a quality that may be found in things that normally fall outside that class.</p>
