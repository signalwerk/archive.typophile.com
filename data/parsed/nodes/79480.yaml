      <p>No, I say, that it is not necessarily art. You are talking about the market. I am talking about quality. And if the quality is on a very low level, it is not art. I remember, that I saw a chromed metal plate on the wall in a museum years ago. There were wholes in the plate, which looked like bullet impacts. What was the intention? I could and can only imagine one intention: There were no wholes in the origin work. And then a reviewer came and shot at the work, because it only was worth to shoot at it. But it neither was art before the shot nor it was after. It was simply expensive uncompostable bullshit. Bullshit cannot become an artwork, only someone claims, that it is art. Let’s assume now, my interpretation of the artwork is the same as the interpretation of the artist. In this case the intention is not less banal.</p>
