      <p>Art is that aspect of a thing that is extra-utile, i.e. that is not functional but is the focus of our aesthetic sense, our delight in beauty and ideas. Art as a class of object, refers to things whose character is wholly or almost wholly extra-utile. Such objects, like anything else we make, require craft (skilled making) to be effectively realised: it doesn't matter how clever the artist's idea or how beautiful his conception if he can't realise it. Just as art requires craft, everything that human beings consciously make is tinged with some degree of art, some extra-utile quality. Humans are aesthetic creatures, and when we make judgements about how to form a thing, no matter how quotidianly functional <a href="http://www.britishmuseum.org/images/axe_l.jpg" rel="nofollow">the object</a> in question, we include aesthetic criteria. Some objects leave little room for art, of course, because their function really does define their form, but seldom is an extra-utile component entirely absent.</p>
      <p>[And if that sounds familiar, it’s because I copied and pasted it from the last time we had this conversation on Typophile.]</p>
