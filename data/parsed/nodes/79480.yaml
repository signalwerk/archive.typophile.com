      <p>I don’t think so, because the creative process is not absolute conscious. And as better you master your tools, as better you can make use of your subconscious, because you have not constantly and consciously to think about, what your hands have to do. In the creative process you switch between different states of mind. From this point of view you already are different persons in the creative process, creator and observer. At least that’s my personal experience. This probably varies from person to person. There is something, which is holy, in the creative process. Art is not in competition to nature, but an attempt to feel home in nature, while nature is the universe and art is part of the universe as even everything else. But this can be also valid for the creative process of design. The difference is, that design has a much more clearly defined function and design always must bow to the function. Design is surface. It is not less important than art, but it is not the same. If you have to bow, it is a bit harder to feel like God, the ultimate creator. (I don’t believe in God.)</p>
