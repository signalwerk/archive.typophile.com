      <p>&gt; fashion, graphic design, dance and whether<br>
      &gt; this disciplines can be considered to be art</p>
      <p>It's a complex subject and you'll hear different opinions. But in terms of graphic design, there is some overlap with the art world but there are also many differences, including the fundamental goals.  </p>
      <p>•&nbsp;The artist is concerned with self expression; the designer is concerned with communicating info on behalf of a client. </p>
      <p>•&nbsp;The artist often picks his (or her) own projects, but the graphic designer receives specific assignments from clients.</p>
      <p>•&nbsp;The artist usually works alone; the designer often works as part of a team with writers, photographers, illustrators, printers, etc</p>
      <p>•&nbsp;The artist doesn't want anyone tampering with their artistic vision; the designer routinely makes revisions based on client feedback. </p>
      <p>• The artist hopes their work will be saved and treasured; the designer's work is usually more short term and most things you design will end up in the trash after they're used. (In fact one of my professors liked to show a picture of a trash can and say, "no matter how good your work is, most of it will end up here, and if you can't live with that you're going into the wrong profession"</p>
      <p>• The artist can legitimately say that they don't care what anyone thinks of their art, but the designer's work is a failure (at least to some extent) if the intended audience doesn't understand the message they were hired to communicate.</p>
      <p>Now you can certainly think of exceptions to all of those points, and there are many graphic designers who are talented artists, but in general art and design are different in many ways.</p>
