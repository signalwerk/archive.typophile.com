      <p>John, your definition works within the boundaries of your culture and your culture's aesthetics. Other cultures or individuals might find no value aesthetically or otherwise in what you might call art. I agree that beauty and art are different subjects. Many things that are deemed artistic are disturbing and even abhorrent to some people. That still means that art is defined by the individual or the culture as an entity. Perhaps a more precise definition would be - that quality of a object which stirs the aesthetic and emotional sense of the viewer or viewers, possibly beyond the utility of its function (or lack there of.)</p>
      <p>Of course that takes away some of the mysticism that artists like to robe themselves with.</p>
