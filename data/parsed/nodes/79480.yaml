      <p>Shifting direction:</p>
      <p>I'm thinking now about art in the sense of a class of made objects, as distinct from the aesthetic quality of human-made things in general. I suspect that this class contains too many sub-classes of both medium and genre to be easily defined other than in a nominalist way: art is everything that people choose to call art. Even so, I think this class of objects can be broadly considered in terms of the marriage of that aesthetic quality discussed above to a function of mental -- intellectual and/or emotional -- engagement. When I think about my own most intense experiences of works of art -- an afternoon spent at the Rijksmuseum in Amsterdam, looking very carefully, for a long, long time at a small number of  Rembrandt and Vermeer paintings -- what I am aware of is two things -- the aesthetic qualities (composition, colour, brushwork etc.) and the intellectual/emotional qualities (subject, sympathy) -- and then a third thing: the way in which these two are married in the object. Obviously, for different genres and media of art objects -- including literary and musical -- the particular qualities will vary in kind, but this sense of marriage of aesthetic and intellectual/emotional qualities remains, I think, one of the hallmarks of successful art. TS Eliot wrote of the moment, in writing poetry, when the poem came right with the sense of a box clicking shut, a perfectly manufactured fit of parts. I think a similar sense is enjoyed by the reader of the poem, or the viewer of a painting or the listener to a piece of music.</p>
