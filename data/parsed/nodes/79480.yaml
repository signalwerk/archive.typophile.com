      <p>Didn't we just have a thread about the importance of a professional (expert) distinction between the meaning of "font" and "typeface"?<br>
      This discussion is decidedly quaint and amateurish.<br>
      But you might say, should the views of only those with professional qualifications or experience in art be taken seriously?<br>
      I would say yes—that's how it is with other disciplines.<br>
      Of course, everyone is entitled to their opinion.<br>
      And you might consider yourself an artist, even though you are not a professional artist.<br>
      Designers are not, de facto, artists (although a few are also artists).<br>
      When an artist says "this is art", and the art community recognizes it as such, it must be art.<br>
      It's absurd to argue otherwise—with abstract, philosophical generalizations about the veracity of "whatever I say is art, is art".</p>
