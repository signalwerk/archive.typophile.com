      <p>I greatly disagree with Nick Shinn's definition, which is a fairly universal one of you ask the top tier of art professionals - it places all the political power over the definition of aesthetics in the hands of powerful institutions, where art schools (and if not art schools then museums, galleries etc.) are the sole arbiters of what is art or not.</p>
      <p>There's a whole lot of different art definitions going on, the classic (and well-deservedly savaged) one of which is Kant's, who first made the distinction of Form (ie. Art) and Function being two different and opposing forces, thus art being what didn't add directly to function. By that definition, of course, graphic design is generally not art, and type design practically never is.</p>
      <p>My own take: art is an expression of a thought that cannot be expressed in words alone. If your idea cannot be described in speech, and it keeps eluding efforts to precisely pin it down with words, then it's art. :)</p>
