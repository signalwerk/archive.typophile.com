      <p><a href="http://de.wikiversity.org/wiki/Ann%C3%A4herung_an_eine_Kunstdefinition" rel="nofollow">Here</a> is a good approach to a definition of the art term. The article is in German.</p>
      <p>There is also a proposal for a short definition of the term. I think, there is much truth in that short definition, but if you don’t already have an idea of the meaning of the term, the definition does not help. But as longer I think about the short definition, as more I come to the conclusion, that it is precise. I am trying to translate it:</p>
      <p>Art aestheticises the antinomies of life without resolving them. It is ingenious objectivity.</p>
      <p>(“Kunst ästhetisiert die Antinomien des Lebens, ohne sie aufzulösen. Sie ist geniale Objektivität.”)</p>
      <p>The second phrase sounds a bit paradox, because there is probably nothing as subjective as ingenuity. But I already wrote in a former comment, that art is not any (“beliebig” in German) and that art is a dictatorship. It is objective, because humans are conflicting beings with regard to their evolutionary stage. On the one side they are conscious and intelligent. But on the other side they are inable to understand the origin and the sense of the world. Humans are intermediate beings. So art is the attempt to feel home with this conflict and to remind this conflict. And in contradiction to that design is the attempt, to forget the conflict by covering it with beauty or by adjusting objects to the human anatomy. Art is also an attempt to surmount the own mortality.</p>
