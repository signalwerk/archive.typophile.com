      <p>If modern art is not modern anymore, how is it called then? Formerly modern art? Or formerly art? Or art? Have I to wait, until modern art becomes art or have I to hurry up, before it is not art anymore?</p>
      <p>I give a **** on art, that primary wants to provoke, that wants to symbolize anything, that primary wants to animate dialogues between empty creators and “consumers” or that only wants to satisfy the conceitedness of artist or “consumer” – except it is good. If the artist exactly knows the meanings of his piece of art or if a piece of art needs a manual, there already is something wrong – except the piece of art is good. Artists are not necessarily more creative or more sensible than designers. It is better to be a good designer than a bad artist. So, if you are designer, be a good designer instead of wasting your time with thinking about the question, whether you are an artist. If your product is shit, it does not become better, if you call yourself an artist. <em>Artist</em> is probably the most cheap job title.</p>
      <p>I am more  interested in the question, how creative processes work, than in attempts to finally clarify, what art is.</p>
