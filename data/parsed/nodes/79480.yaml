      <p><cite> &gt; John Hudson - TS Eliot wrote of the moment, in writing poetry, when the poem came right with the sense of a box clicking shut, a perfectly manufactured fit of parts. I think a similar sense is enjoyed by the reader of the poem, or the viewer of a painting or the listener to a piece of music. </cite></p>
      <p>I agree with the first part of this - there is a moment of completion. But when someone reads something I've written I hope the opposite happens, that the box clicks open, and the reader can take his own journey. The same is true of the music I write. I try to leave a scent, not a bottle of perfume.</p>
      <p>pbc</p>
