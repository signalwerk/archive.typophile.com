      <p>James: <em>Personally, I find function to be artistic in it's own right. "Art" is a term which is completely subjective and impossible to quantify or qualify.</em></p>
      <p>You don't need to be able to quantify or qualify something in order to have a concept of its distinguishing characteristics and be able to talk meaningfully about it. I have suggested what seems to me a very sound definition of art as an extra-utile aesthetic quality of human creations. We don't need to know what percentage of an individual creation is utile and what percentage art, nor do we need to make judgements about whether it is good or bad art.</p>
      <p>When you say that you find function to be artistic, I think what you really mean is that there are elements of utility that you respond to aesthetically. I'm not saying that only the extra-utile is beautiful, I am saying that only the extra-utile is art. There is beauty in much that is not art.</p>
