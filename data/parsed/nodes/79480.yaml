      <p>Bill: <em>John, I think there's a problem in defining art as the non-useful part of something. Causing delight or enjoyment or interest makes something useful because we want those experiences. In economics "utility" would include aesthetic pleasures.</em></p>
      <p>In some branches of economics, yes, but that is because capitalism requires constant expansion of commodification: hence any experience, no matter how intimate eventually becomes a subject of economic activity. This kind of 'aesthetic utility' -- the ‘usefulness’ of providing aesthetic pleasure -- explains one aspect of the market for art objects (much of the art market, especially at the higher end, is clearly speculative investment), but it doesn't explain what art is as something that all human beings invest in the making of things, which is what interests me.</p>
      <p>Perhaps it helps if I refine my definition like this: art is that quality of made things that appeals directly to the mental faculty for aesthetic engagement, and hence is extra-utile to any other functions that the things may have. The important point, for my perspective, is that art is an observable quality of what humans make, even if what is made is intended for quite quotidian purposes.</p>
