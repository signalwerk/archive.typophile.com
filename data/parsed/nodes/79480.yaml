      <p>I read the whole episode differently. It isn't necessary to have <em>seen</em> the famous urinal in order to experience the ‘new thought for that object’. The art is not the object, but Duchamp’s performance, including the exhibition of the object, the invention of the artist Mr Mutt and, not least, the critical commentary (probably not written by Duchamp, but clearly orchestrated as part of the performance) that purports to explain the meaning of event. Beautifully done.</p>
