    html: |-
      <p><cite>His art is not only unaesthetic but also unethical.</cite></p>
      <p>And another one, who messes up beauty with aesthetics. With regard to ethics I would like to differentiate between a) the message, b) the material (inclusively beings capable of suffering) and c) the immediate tangible content / the first impression / the surface.</p>
      <p>a) If the conscious projected message dominates the creation, I would call it grandstanding or political <em>design</em>, dependent from the content. If the creator additionally and consciously tries to get attention by shocking people, the probability, that his creative resources are limited, is very high. And as I already said, I am interested in art, but not in artists. I don’t want to know about the personal antinomies of the artist, because I am not a psychiatrist, but I am interested in new perspectives of the antinomies of life – in profound aestheticised perspectives. The life of the artist is only interesting, because it is the basic requirement for continuing with making art. If the artist tries to catch up on his anal or urethral or prostatal or uteral phase with the help of me, I am mainly bored. I am really not fascinated by urinals, independent from their location and indepent from their hygienic condition. As I already told in a former message, my father’s urinal is just a by-product of his creativity. He simply invests his time in making art instead of cleaning his closet.</p>
      <p>b) If  beings capable of suffering are misused, the creative process is immoral, but not necessarily the object of art.</p>
      <p>c) If the portrayal of the violation of an tabu is superficial only without anything behind – if the violation of an tabu <em>is</em> the message, I am likewise bored or amused about the simplemindedness of the creator. But it is not immoral. The methods can be immoral, but not the artwork. The violation of tabus is often inevitable, but it is never the basic message of artworks. Creators with a message are suspicious, anyway. A message is already something, that is reflected, but I am not interested in the message of the creator, but in the impact of the creation. So, go and stick up your “message” to your ass, if your message amounts to nothing more than you. As Oscar Wilde wrote in the prologue of <em>The Picture of Dorian Gray</em>, “art is never morbid”. And I am very sure, that Oscar Wild was able to see the beauty in the colors and structures and subtlety of mould. He did know the difference between self purpose and artistic necessity.</p>
