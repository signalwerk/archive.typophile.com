    <p>Dear All,</p>
    <p>I'm a design student and today evening, while out with friends we had a discussion about fashion, graphic design, dance and whether this disciplines can be considered to be art and if so, then why? After all what is art? ¶A friend underlined that "everything around us is art"; while we are taught that a work of art not necessary has to have a function, nor it has to be understood. From another point of view can a gadget that was created for a specific task, without bearing aesthetics values be considered a work of art? Then again we have philosophers like David Hume who wrote that "beauty in things exists merely in the mind which contemplates them." ¶I'm in a dilemma and would like to know what are the attitudes of other creatives on this topic.</p>
    <p>Yours,<br>
    SB</p>
