      <p>Arno, the fact that culture and society are in the thrall of capital and corporations does not discount the Institutional definition of art.<br>
      We are social beings, and if our society says someone is an artist, that is the description we generally follow.<br>
      But if six, turned out to be nine, I don't mind.</p>
      <p><em>It is ridiculous to believe, that you are an artist just because you went to an art school.</em> </p>
      <p>True, you also have to make a living at it.<br>
      However, it's not just art schools, but many other institutions in society.<br>
      You probably won't be considered a proper artist if you don't exhibit or sell your work—you will be considered an amateur.<br>
      If you have academic qualifications but struggle with a career, you are in a strange limbo.<br>
      But an education—in any field—is no guarantee of the classic job role. Many fine art graduates work in the art industry as non-artists, such as management, teaching, or curation. Or go into related fields such as fashion, film, or rock and roll. I went into advertising and design. If you apply for institutional grants, a certain kind of career trajectory will be expected, including peer recognition, i.e. exhibiting in peer-reviewed exhibitions.</p>
