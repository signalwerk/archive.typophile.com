      <p>Nick, those are good questions. Note, however that I don't say that things are ‘art’ because they have aesthetic appeal; I say that art is that quality of things that has aesthetic appeal.</p>
      <p>In the case of elegance in mathematics, I think there are two phenomena to consider: the elegance that is inherent in what the math describes, which is not something that the mathematician has made and hence not art -- it is, rather, like the aesthetic experience of nature --, and the elegance in the expression of the description, which I would say is art. Having spent some time working on mathematical typesetting and talking with mathematicians and scientists, I think there is very definitely an aesthetic awareness, even an aesthetic culture, that responds to the fittingness of expression to concept in the same way that one responds to the fittingness of expression to idea in e.g. painting.</p>
      <p>In the case of beautiful athletic achievements, on the whole I would say that yes, the aesthetic quality may be a kind of art on the basis of practice and training. If I were somehow to succeed in placing a football in the net by throwing my legs over my head, that would be luck, and if it managed to be beautiful in the execution -- most unlikely! -- that would also be luck and, hence, its beauty would be the beauty of accident, not of intentional creation. Now the beauty of accident may accompany the beauty of art, and happy discovery may accompany painstaking craft in the making of anything, but for the artist -- and for the athlete as artist -- it is difficult to separate the momentary act from the months or years of preparation and experience. What may seem spontaneous might be the result of many, many hours of practice and training. I have a piece of calligraphy on my wall that took Gabriel Martínez Meave about five minutes to create, but its beauty is obviously the result of many years of practice and experience, so art is obviously not something that happens just within the act of creating an individual thing, but is built up over time so that it may be expressed in that thing; similarly, I'd say that the beauty we see in an athletic achievement may be the expression of developed skill. The fact that not all goals scored are beautiful -- some are merely functional; some may be clumsy or due to an fumble by the goalkeeper -- makes it clear that there can be an extra-utile, aesthetic quality to a goal, and insofar as this is the result of training and practice to be able to score goals in that way, I'd say it shows a kind of art.</p>
