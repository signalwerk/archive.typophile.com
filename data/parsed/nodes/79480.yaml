      <p><cite>See, I would say that there is art in the work, regardless of whether the object is something classed as art. There are elements in the original making of the car, and quite possibly in the restoration, that are extra-utile, that are unnecessary for the function of the object, but which appeal to sensory aesthetic delight. There isn't really another word for the quality of those elements except art.</cite></p>
      <p>I had a conversation like this about boxing. A friend said boxing was art because of the skill required and the finesse used. I said no, there is an art to boxing, but boxing is not art. Quality of execution doesn't automatically make something art.</p>
      <p>I design letters using my hands, it doesn't make me a calligrapher.</p>
      <p>Something being beautiful doesn't make it art either, and being art doesn't mean it's beautiful. Yes, there is great subjectivity is what one would classify as art, and time and context make a difference as well, but just because there is skill in the work doesn't make it art. That doesn't make an object any less worth while either, it's context. Artistic, skillful, quality, amazing, but not "art".</p>
      <p>It may be the conversation of art versus Art. Or art versus Fine Art. I'm protective of both. If some yokel painted a copy of a soup can label I designed and became famous for it, that'd just make me cranky.</p>
