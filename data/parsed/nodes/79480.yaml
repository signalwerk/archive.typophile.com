      <p>@ Nick</p>
      <p><cite>Duchamp removed aesthetics as a necessary quality of art.<cite></cite></cite></p>
      <p>Do you mess up aesthetics with beauty or picture and subject? Aesthetics are a necessary quality of art. If a self-appointed artist claims anything different, he only wants to cover his inaction and his vapidity.</p>
      <p>Example:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/003-Kazakhstan-Semipalatinsk-2008_4830.jpg"></div><p></p>
      <p>It is taken from <a href="http://didierruef.photoshelter.com/gallery-image/RECYCLE-Man-and-Waste/G0000Ugo_u9ciOJ8/I0000h1MO0mi3yuM" rel="nofollow">didierruef.photoshelter.com</a>.</p>
      <p>That’s probably more documentation than art, but with regard to the aesthetics it doesn’t matter. The image is beautiful, because it is very aesthetical. Because the photographer has taken the picture in that way. The image is very powerful and much more than beautiful. Assumed, it is not art – I am not sure, if it is – it doesn’t matter, because the effect would be exactly the same as if it would be art.</p>
      <p>In contradiction to that, this …</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/500x_licorne-atomic-blast_4499.jpg"></div><p></p>
      <p> … is pure beauty, although the event is likewise not beautiful. As beautiful it is, it already is decorative. Nothing against decoration, but art is more than decoration. The message amounts to nothing more than beauty. I think, art is always more than pure beauty.</p>
      <p>I think, it is unimportant, whether an object really is art. It is much more important, whether it could be art. Why? Because art does not need manuals. Art is speaking for itself, although it naturally makes use of the experiences of the viewers – as everything. Objects of art, that need their creators for interpretation, are suspicious. It is not the artist, that is important, but only the result of his work. Art does not exist for worshiping the artists, but their work. Art, that is satisfying the vanities of the artist only, is suspicious, because vanities are a interference factor already during the creation. It is not important, what the artist wants to say, if he wants to say anything, but the effect to me is important. Often people call themselves artists, just because the term sounds ennobling in their simple minds. But there is absolute no duty to believe in the claim to be an artist.</p>
