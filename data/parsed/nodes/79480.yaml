      <p><cite>When an artist says "this is art", and the art community recognizes it as such, it must be art.</cite></p>
      <p>Not really. There are many thousands of objects, that are called art by their creators and viewers, although they are banal. I just remember the guy with the doors on one of the last Documentas. Maybe his door construction was art (before it has crashed because of his inability and his defiance of statics), but it was banal. Maybe too banal for being art; it was pure shit, superfluous, a waste of material and a waste of energy for the transport. As I already said, if an artists explains, that he wants to <em>symbolize</em> anything, it is already suspicious. I am not interested, if someone wants to symbolize anything, but at most, if he symbolizes anything. On the other said – if you don’t know, whether a certain object is art, it is not necessarily art, <em>because</em> you don’t know, whether it is art. It is on you to classify the object, but not on a community. Art is not made for communities, but for the artist, although most artists want to have feedback. They don’t do it primary for you, but for themselves. Art is the deep need of artists, but not just pastime, in which you symbolize a bit, or a job. It is not a definition, if it requires other persons for the classification. The definition can not be “Ask somebody else”.</p>
