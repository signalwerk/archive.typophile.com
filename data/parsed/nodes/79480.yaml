      <p><cite>Why to paint sunsets instead of breaking tabus? A well broken tabu can be much better than a landscape.</cite></p>
      <p>Tabus should not be broken just for dragging attention. Break a tabu, if you are driven to break it, or, if there is an artistic necessity to break it. But if you break it, skilfully break it. Don’t break it, if you only envision potential reactions, which are not yours. And don’t bore with banalities like masturbating or pissing in public. Don’t bore me with your boredom and your artlessness. Don’t mess up art with exhibitionism. The exhibition is only the platform, on which you get the feedback regarding to your creation. The quality of your creation does not depend from public (except the public is your material or an important part of the motor for a happening).</p>
