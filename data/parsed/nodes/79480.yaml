      <p>Quoting Reynir: <cite>It's art if I say so.</cite></p>
      <p>The phrase is true for me, if I say it. And it is true for him, if he says it. The phrase summarizes, what I wrote about the dictatorship of evaluation of art. He was very right with that phrase. It is irrelevant, what the society says, because in my opinion there is nothing, where an own opinion is more important than in case of the evaluation of art. Really, it already begins, when I am turning on the TV and stumble in one of these superstar casting shows. <cite>And the next artist is …</cite> – you probably cannot imagine, how much all this rubbish makes me sick. <em>That’s</em> society. I give a **** on society with regard to the evaluation of art. Our society is a casting show.</p>
      <p>Let me tell you, what has happened to my father round about ten years ago. I have grown up in an artist household. My father is sculptor since 45 years – with education at art academies (with a studentship) and education to stonemason. His works are classical, but with an archaic, in the later years often with an utopical touch. I cannot explain it better, especially not in English and partly, because I always was more interested in two-dimensional art and in music. But I can see the high quality of his work. (My relationship to my father is troubled. I don’t have contact to him anymore.) One reason is, that there never was anything as important for him as his art – inclusively me. But he is a total DAU with regard to management. It begins with the condition of his toilette, which is unsuitable for potential buyers, and it ends with the inability to handle non-artificial paperworks without help. And so he did sell nothing for years. But he has offset the materials for his works or his atelier against tax. And then the taxman wanted to have a payment of tax arrears. Ground: „Because you did not sell anything in the last time, you are a hobbyist, but not an artist.“ And he lost the lawsuit. **** taxmen, **** Babbitts define, what art is. I remember, how I wondered, that he was relatively calm with regard to this infamy. If this had happened to me, I could have cut this **** taxman into little pieces and feed them to my cats. (Unfortunately I don’t have cats.)</p>
