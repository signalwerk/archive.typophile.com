      <p>There's a lost distinction between artist and artisan, which leads to confusion between art and creativity.</p>
      <p>There was a show on a few days ago where guys were restoring a classic car and as they worked the body lines down to a smooth finish, they declared it art. Well, no. They are talented craftsmen, and there's a great skill and technique to it, but it's not art. If everything is art, nothing is—like if everything is bold and underlined to stand out and be important, nothing stands out as important.</p>
      <p>In an interview with Moby several years back a question about whether DJs make music made a good point for how I see things. Paraphrased: "What DJs do is creative, it isn't music, but it is creative."</p>
      <p> Are many things creative? Yes. Does it take great skill and ability? Yes. It is art? No.</p>
