      <p>Marcin: <em>An object becomes the object of art, not only because of the decision of the artist, but also in the choice made by another person (so, not always skilled making but also choosing, vide your example of a stone tool).</em></p>
      <p>I disagree, but perhaps because we're talking about slightly different things. An object may be called ‘art’ for a variety of reasons -- one of which is that someone has put it in an art gallery --, but what I am talking about is art as a quality of the object: a quality of aesthetic <em>art</em>ifice, i.e. of its making.</p>
      <p>Re. the Olduvai stone tool: I don't think this is ‘art’, because its functional purpose is so obvious and overriding, unlike a painting. Rather, it is an object that demonstrates the extra-utile, asthetic quality that I think is seldom completely absent from anything that humans make.</p>
