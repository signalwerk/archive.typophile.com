      <p>@Bill: <em>I think the point of the "What is Art?" question, at least in philosophy, is to try to describe what is distinctive about the aesthetic experience, and the process of creating things or experiences that have aesthetic merit.</em></p>
      <p>That may have been true 150 years ago, but then along came Ruskin with the idea of social purpose, and 50 years later, Duchamp:<br>
      "Whether Mr Mutt made the fountain with his own hands or not has no importance. He CHOSE it. He took an article of life, placed it so that its useful significance disappeared under the new title and point of view—created a new thought for that object."<br>
      Duchamp removed aesthetics as a necessary quality of art. That was in 1917.<br>
      Many people felt that the cat should remain in the bag, but it was gone. </p>
      <p>**</p>
      <p>One of my favorite art theorist quotes (because of its typographic resonance) is by Hal Foster: "Each era is a palimpsest of emergent and residual forms."</p>
