      <p>Julian Stallabrass (<em>Art Lite</em>) was interested in this question, with regards to the sensational, Turner Prize winning "Brit Art" of Damien Hirst &amp;c., which, of course, defied the traditional descriptors (that, after all is what modern artists do, redefine art). He came to the conclusion that no objective descriptions were possible of the art/not art variety, and the only thing the art works had in common was that they were all created by people who had been to art school.</p>
      <p>My typefaces are art (I went to art school).</p>
