    <p>I need some advice pushing my design career into next level. I have an undergrad degree in Biochemisry and a grad certificate from Museum School (boston). I started as an intern in a small studio, and gradually became a full time designer for 2 years. Besides, I was taking courses at MassArt as well. As I have gained more experience and increasingly devoted myself to design, I desperately want to push myself, both conceptual and executional skills, into next level. I have huge passion in design. Now I am wondering what my next step should be. Should I go to grad school? If so, which school? (I have few in mind, ie SVA, RISD, or Portfolio Center.) Or should I just keep working in the real business world? Which experience is more rewarding? <br>I do have foundation skills in design and business interaction.</p>
