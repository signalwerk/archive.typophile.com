  - id: 15339
    user: 530
    date: 2003-11-03T15:46:00
    date_raw: 3.Nov.2003 3.46pm
    votes: null
    html: <p>Ling, I went to RISD for undergraduate school and had an amazing experience. However, my opinion of the grad students was not as good. My freshman year most of them seemed very intelligent and dedicated, however; by the time I was a senior, the new crop of them seemed uninterested in doing any work or learning anything, only in getting a degree (not all of them, if they are reading this and know where I live. Seriously). Overall, my opinion of the grad program there is mixed. If you're very dedicated to learning, and look for the teachers who will give you the best education, then it might be worth it. I hear Tom Ockerse is a great guy to work with. But I've heard that Yale has a better reputation as a grad school for graphic design and is very similar to the RISD undergraduate program. <br> <br>Yes, RISD is conceptual and will help you with your execution. But it really depends on how much you're willing to push yourself. The more practical stuff - such as learning computer programs, collaborating with clients and printers - isn't what they teach. At least, they didn't teach stuff like that for more than a day when I was there. There were seminars, but we were so overloaded with homework no one had time to go. But that kind of stuff is the kind of thing you learn with experience - the experience you probably already have.  <br> <br>Providence is a fantastic city with a great arts scene. I love Boston more, but I still miss little Rhody. <br> <br>I hope this helps. </p>
