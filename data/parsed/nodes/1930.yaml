  - id: 15341
    user: 2142
    date: 2003-11-03T17:28:00
    date_raw: 3.Nov.2003 5.28pm
    votes: null
    html: <p>A school is only as good as the instructors that are there at the time you attend. Do you have a specialty you wish to pursue, e.g., illustration, or typography? I'd shop around for people that are exceptional teachers in your specialty. A Masters degree would allow you to teach, but I'm not sure if that's what you're after.  <br> <br>There's a book out you might check out called "The Education of a Graphic Designer" by Steven Heller. <br> <br>Art schools focus more on concept in upper division classes. But that assumes you have the prerequisites of being able to draw well, have a good background in color theory and art history, cognitive skills, plus decent computer skills. And don't forget business classes, Lord know how many designers go under each year from poor business practices.</p>
