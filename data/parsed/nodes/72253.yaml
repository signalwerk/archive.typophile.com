    <p>Hi.  I checked out a book for my son from the library, and I really like the typeface in which it is set.  Unfortunately there is no information about the type.</p>
    <p>A picture can be found here: <a href="http://twitpic.com/24xmye" title="http://twitpic.com/24xmye">http://twitpic.com/24xmye</a></p>
