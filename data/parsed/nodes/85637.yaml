  html: |-
    <p>Greetings,</p>
    <p>I am trying to identify initials used in a 1905 book published near Philadelphia, PA.  They seem to be inspired by Will Bradley, but I can not confirm that.</p>
    <p>Thanks for any assistance in identifying them.</p>
    <p>I am having difficulty attaching an image, so I uploaded an image here:<br>
    <a href="http://www.yourantiques.com/LititzInitials.jpg" title="http://www.yourantiques.com/LititzInitials.jpg">http://www.yourantiques.com/LititzInitials.jpg</a></p>
    <p>Lee Jay Stoltzfus<br>
    Lititz, PA</p>
