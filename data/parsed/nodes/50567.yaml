    <p>I just wanted to post this shirt I designed. It’s set in Gotham and treated to look like cotton cotton plants. It’s printed on 100% organic cotton from American Apparel’s Sustainable Edition.</p>
    <p>I wanted to create a shirt with a clean, simple design and use it support sustainable cotton farms.</p>
