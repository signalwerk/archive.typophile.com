      <p>In my case, I was working with Word. If I remember correctly, there wasn't any way to convince Uniscribe that the space character could be anything other than the default, Latin space glyph. Oddly enough, I could write some gerry-riged OT code to get my Deva space to come up as a substitution some of the time in CS3 (I know, I know…). It is theoretically possible that you can't have alternate language-specific versions of punctuation yet.</p>
      <p>My solution in the end (with the space) was to make it slightly bigger than I had hoped for the Latin text, optically, and slightly tighter than I had wanted it to be with Devanagari text. Worst of both worlds, but no one will probably ever complain about it.</p>
