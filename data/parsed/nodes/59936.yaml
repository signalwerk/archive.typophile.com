    <p>Hello Everyone!</p>
    <p>I am having some issues with the localized (locl) feature for Devanagari. It doesn't seems to work properly in my case. I remember Dan Reynolds asking for a similar help long back but that was to do with the spacing I guess.</p>
    <p>Okay, I have two sets of punctuation marks for both Latin and Devanagari, and only the Latin punctuation marks has unicode assigned to them. I have created a "locl" feature using VOLT for Devanagari so that it takes the appropriate punctuation marks when Hindi is typed. </p>
    <p>Now the issues I am facing is:<br>
    When I type "comma" or "period"  while in Devanagari mode, it doesn't get replaced with the "dev_comma" or "dev_period". And because of that, the application thinks that I have switched to Latin and it converts all Devanagari marks to the Latin marks which is typed after comma or period. </p>
    <p>Has anyone encountered this issue before? If so, is there a way I can get rid of this? Hello John? Dan? </p>
    <p>Here is an image, just to show you what I meant:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TypophileFH_5516.jpg"></div><p></p>
    <p>Thanks!</p>
