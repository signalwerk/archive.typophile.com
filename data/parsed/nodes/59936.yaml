  - id: 358014
    user: 3085
    date: 2009-07-25T08:45:00
    date_raw: 25 Jul 2009 — 8:45am
    votes: null
    html: |-
      <p>Uniscribe itself is lower level library and does not have enough control over itemization and font matching decisions. On the level it is used by Word or Publisher or Internet Explorer it does not provide font matching functionality, so application is on its own to implement whatever algorithms it chooses. Since Vista/Office2007 it can help application to some extent by merging neutral items to adjacent strong characters. I’ve tried to make this logic to work in most general cases, but it still has its own problems. It may do better, however parameters available to Uniscribe at this stage lacks context in which text is being set. Uniscribe also have higher-level APIs used by Windows UI, such as menus or common controls. As you may see experimenting with notepad, text may show inconsistency in shaping same punctuation or space glyphs because they may be itemized to different scripts.</p>
      <p>Thanks,<br>
      Sergey</p>
