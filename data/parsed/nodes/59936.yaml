      <p>Satya, the problems you are facing are most likely due to layout engine decisions about how and where to divide glyph runs. It would take a while to figure out exactly what the issues are in different applications. I'm about the leave for TypeCon in Atlanta, so can't offer more detailed advice now.</p>
      <p>I suspect Sergey Malkin at MS can explain what is happening in the case of Word. Note also that this might depend on what version of Windows you are using: the latest Uniscribe rolls punctuation into glyph runs with adjacent text, but relies upon a system level wrapper that means this won't work in pre-Vista versions of Windows even if you copy the usp10.dll from Vista to an older OS.</p>
