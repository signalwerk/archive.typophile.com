      <p>Typophile Respect Survey</p>
      <p>1. Where do you live?<br>
      A. Europe.<br>
      B. East Coast USA.<br>
      C. West Coast USA.<br>
      D. Canada or elsewhere.</p>
      <p>2. What do you do?<br>
      A. Type designer.<br>
      B. Graphic designer.<br>
      C. Work for a large multinational company.<br>
      D. Foundry person.</p>
      <p>3. Do you own a computer?<br>
      A. No I own a pencil.<br>
