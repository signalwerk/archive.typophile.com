      <p>&gt; <cite>I find more people referring to me as Mr. Shinn, rather than Nick.</cite></p>
      <p>I've recently addressed Nick as Mr. Shinn. Why? Well, lots of kids in my community refer to adults by first name. Growing up, that's the last thing I'd have ever done. Mister was a sign of respect. It took a long time to get to be a dad, and by God, I've earned the rite to be referred to as Mr. Koppa, and I don't care what the rest of the parents say. I'll admit that Nick's <a class="freelinking external" href="http://www.askoxford.com/concise_oed/avatar?view=uk" rel="nofollow">avatar</a> does command some automatic respect, and that may be what triggered my impulse. But I did have a pirhanna named Mr. Chin when I was in college, which is also a contributing factor. Nevertheless, having been a member posting infrequently for only a couple months, I find Mr. Shinn to be respected, especially in light of his recent unprofessional comment about the Holiday Inn logo. And Mr. Vanderveen. I also like Mr. (Gerald) Lange. And just about everybody else, really. It's fun to be connected to everyone.</p>
    html_clean: |-
