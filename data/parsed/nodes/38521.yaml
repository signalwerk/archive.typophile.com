    html: <p>It could also be solved in another way. Like the rankings of ATP, or rather <a href="http://www.artfacts.net/index.php/pageType/artists" rel="nofollow">ArtFacts</a>. Combine number of typeface releases (and the general consensus regarding the quality of each release)  with years in the business. Add status within organizations such as ATypI/SoTA etc., articles, papers, lectures, exposure in correct design magazines. Different foundries will generate different amount of points (so a foundry ranking is also necessary). Of course context will matter, custom type for an international fashion magazine will beat custom type for a provincial news paper. Unless the latter is given proper exposure in a Correct design magazine. In contrast another factor will be numbers of licenses sold. Regarding the quality aspect this factor won't be as big as some other factors, but making fonts that sell well generates a certain respect within the community, so why not.</p>
