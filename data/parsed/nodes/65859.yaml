      <p>Same on my computer: FL crashes if I make <cite>any</cite> changes to the Kerning in an MM font using <cite>any</cite> method (entering numbers, dragging, etc.).</p>
      <p>The only workaround I found was to create single master fonts, kern them, export an AFM for each and re-import the kerning in the MM font.<br>
      Note that, when importing a single master AFM, only the currently active master is affected so you can update the kerning for individual masters.</p>
