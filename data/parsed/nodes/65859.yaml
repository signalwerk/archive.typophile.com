    <p>I'm a little bit confused and really don't know what happened the last two weeks.<br>
    I didn't open Fontlab since december 16th and yesterday i wanted to work again on a multiple master font which i created 2 months ago. Everything is working fine until the point where i want to adjust the kerning. When i change a figure in the kerning table, fontlag suddenly crashes.<br>
    This is just happening with MM-files, when i want to open a normal .vfb FontLab still works fine.</p>
    <p>Does anyone know this Problem.</p>
    <p>On my system there was just one change. The Installer wanted to update Java for Mac OsX.<br>
    I'm working with MaxOS 10.5.8.</p>
    <p>I really don't know what happened the last two weeks.</p>
