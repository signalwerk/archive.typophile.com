      <p>You should be able to use the font with Windows (XP and later). You need the .pfb and (sic!) the .pfm file. Right-click on the .pfm file and select "install" (IIRC).</p>
      <p>Andreas<br>
      PS: If you don't have the .pfm file you probably don't have a valid license to use the font.</p>
