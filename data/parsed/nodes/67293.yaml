      <p>@ Fontgrube</p>
      <p>Just for interest: Isn’t the "sic!" reserved for clarifying, that the author has correctly quoted a mistake?</p>
      <p>@ pairodocs</p>
      <p>If you also have the inf file, put afm, pfb and inf into the Windows Vista font folder. I don’t know, if it works under Windows Vista, but in case of Windows XP the pfm file will be automatically generated then. If you don’t have an inf file (that’s a small and simple text file only), have a look into the inf file of another font and create an inf file for your font.</p>
      <p>And use "ABF Rename PostScript Type 1" for the case, that there are disharmonies between the internal font names: <a href="http://fontworker.freeservers.com/abfr104.zip" title="http://fontworker.freeservers.com/abfr104.zip">http://fontworker.freeservers.com/abfr104.zip</a></p>
