      <p>The sic question is interesting. In Portuguese, sic is just used to indicate that the quoted/referenced text is that way in original and contains an error, obsolete or unusual expression. Here, sic is not used as a comment to one's our words.</p>
      <p><em>Addendum:</em> sic is not a short way for an expression, it's just the Latin word for thus/this way (assim in Portuguese, así in Spanish, ainsi in French).</p>
