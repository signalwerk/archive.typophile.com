      <p>'Just for interest: Isn’t the "sic!" reserved for clarifying, that the author has correctly quoted a mistake?'</p>
      <p><a href="http://pl.wikipedia.org/wiki/Sic" title="http://pl.wikipedia.org/wiki/Sic">http://pl.wikipedia.org/wiki/Sic</a> (via google translator:-)<br>
      - to indicate that the quoted text contains an error and comes from<br>
      a source that has been literally quoted without correction;<br>
      - reimbursement shall be placed on information that can be seen as false, as an error, etc., in order to emphasize that it really happened, took place;<br>
      - to indicate something strange, unprecedented, unexpected.</p>
      <p>FontForge is able to open .pfb [sic!, 1 file is enough!;].</p>
      <p>Installing FF in 3 easy steps:<br>
      1. go to <a href="http://www.geocities.jp/meir000/fontforge/" title="http://www.geocities.jp/meir000/fontforge/">http://www.geocities.jp/meir000/fontforge/</a> , download fontforge-mingw_2009_10_28.zip (ca 18 MB)<br>
      2. unzip it somewere<br>
      3. double click fontforge.bat and voila:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/fforge1_3492.jpg"></div><br>
      Fontforge has access only to the disk where "somewere" is. It could be even on memory card, no install process is necessary.<br>
      Edit: tested win2000 winXP<p></p>
