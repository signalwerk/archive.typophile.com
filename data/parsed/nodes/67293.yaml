    <p>Hello all,</p>
    <p>I need some help with converting font files. I have the .afm and .pfb files for the font Utopia, and am trying to covert it to a form I can actually use, preferably Open Type. I'm hoping to find way to convert them for free--I'd really rather not pay for a conversion program or anything.  Also, I'm running Windows Vista.</p>
    <p>Any help is greatly appreciated!</p>
