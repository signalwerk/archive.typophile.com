    html: |-
      <p>It sounds like what you have is the <a href="http://www.ctan.org/tex-archive/fonts/utopia/" rel="nofollow">Linux Type 1 version of Utopia</a> that was donated by Adobe to the TeX Users Group, which does not include the .pfm files needed by Windows. There are some utilities that can convert afm to pfm... Proxima's <a href="http://www.proximasoftware.com/afmtopfm/" rel="nofollow">AfmToPfm</a> might be one to try since it's free.</p>
      <p>Converting to OpenType could probably be done with <a href="http://fontforge.sourceforge.net/" rel="nofollow">FontForge</a>, if you're willing to invest the time installing it under <a href="http://fontforge.sourceforge.net/ms-install.html" rel="nofollow">cygwin</a> and poring through the documentation. On the commercial end, both <a href="http://www.fontlab.com/font-editor/typetool/" rel="nofollow">TypeTool</a> and <a href="http://www.fontlab.com/font-editor/fontlab-studio/" rel="nofollow">FontLab</a> can import afm files inside the metrics panel, and then generate an OpenType font.</p>
    html_clean: |-
