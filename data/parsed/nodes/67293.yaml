      <p>@ Fontgrube</p>
      <p>I had learned in Latin, that it means "So (vorgefunden)" in German. If it would mean both – "So vorgefunden!" and "So ist es richtig!" – it would be relatively senseless. As you said, "sic" is the short form of a whole term. Theoretically it could mean everything, from "So regnerisch!" till "So abgefahren!". However, if there was a teacher, in whose knowledge I in most cases were willing to trust, then it was my Latin teacher. Hehe, probably because the things, that I was not able to learn, were most impressive.</p>
