      <p>Many thanks Fivos. For a free font it works very well.<br>
      Update:<br>
      A well made Russian looking font that avoids silly features, like a reversed _R_ for _A_, and includes a correct Cyrillic alphabet that harmonizes well with the Latin letters.<br>
      This one goes in my favorites list.<br>
      Don</p>
