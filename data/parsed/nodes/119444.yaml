      <p>My apologies by advance if my words sound lazy/boring/dull/killjoy because everything I'm going to say has already been said and argued. But since it's stumped all type ID communities across the world, maybe it is time to definitely close and accept the evidence... SPICE GIRLS will never return and even if we identify the font.<br>
      To me, from what I could see from this CD covers is they're at least 2 different fonts (or 1 font and 1 lettering). /S from 'SPICE' woodmark has a horizontal transition not the one for text.<br>
      The text one looks like <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/europa-grotesque-rr" rel="nofollow">Europa Grotesque</a> (less is <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/california-grotesk" rel="nofollow">California Grotesk</a> mainly because of /a spur). That said it could be not so hazardous to accept the idea 'SPICE' would be a custom lettering, derived from Europa Grotesk (and very easy to recreate actually).</p>
