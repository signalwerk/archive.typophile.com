      <p>Just for the sake of completeness, and to corroborate what Rob (ralphsmouse) and Ryuk suggested, I will add that, according to MyFonts, the digital Europa Grotesque (2002?) is "based on [ATF's] Europa Grotesque series circa 1960".<br>
      So there could have been an early (more or less legit) digitalisation of it, and maybe the horizontal spine of |S| was in the original (or, au contraire, was introduced to get away with the knock-off).<br>
      Unfortunately, I'm unable to locate a pre-digital specimen (or any mention of it, for that matter: <a href="http://en.wikipedia.org/wiki/American_Type_Founders_%28list_of_types%29" title="http://en.wikipedia.org/wiki/American_Type_Founders_%28list_of_types%29">http://en.wikipedia.org/wiki/American_Type_Founders_%28list_of_types%29</a> ).</p>
      <p>Full disclosure: I never had willingly (or knowingly) listen anything by the Spice Girls.</p>
