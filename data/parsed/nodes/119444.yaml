      <div class="comment-spam-body"><p>Looking back at the discussion, and by casual visual comparison of the Spice Girls sample posted by rob nolan, to the digital Europa Grotesque and California Grotesque displays at Myfonts, I see the width of the logo as being closer to California Grotesque than Europa Grotesque and, the weight as being somewhere between California Grotesque Bold and California Grotesque Black.<br>
      Blend the two weights, edit the central portion of the _S_ diagonal to make it horizontal, drop the center line on _P_, open the space between the terminals on _C_ and you pretty well have what you want, what you really really want :) for the logo.<br>
      A similar process might also work for the other letters shown in the sample.<br>
      The track listing on the Spice Girls CD <a href="http://lonestarspice.com/singles/suyluscd.JPG" title="http://lonestarspice.com/singles/suyluscd.JPG">http://lonestarspice.com/singles/suyluscd.JPG</a> does not match the logo or the subheadings text in the posted sample, but does seem to match the smaller sized text. Note the diagonal on _S_ and sloped center strokes on _s_ and _a_ which are in the style of Europa.<br>
      The appropriate lowercase for a font matching the logo is pure speculation. IMO the Tempor model is more appropriate than Europa for letters such as _s_ and _a_.<br>
      Don</p>
      </div>
