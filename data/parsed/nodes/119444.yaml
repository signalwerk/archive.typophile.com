    <p>Greetings, fellow type enthusiasts!<br>
    A couple of years ago, I came across <a class="freelinking external" href="http://typophile.com/node/31682" rel="nofollow">a thread on Typophile</a> about the "Spice Girls font", a typeface I've been intrigued by ever since I first saw it in 1998. This font has been searched for by many, <em>many</em> people many, <em>many</em> times, but has never been found. The Typophile thread I mentioned did, however, yield a possible lead: the pre-digital typeface called Tempor. (Thanks, Mike F!) According to my (admittedly limited) research, a specimen of sorts was published in <em>The Solotype Catalog of 4,147 Display Typefaces</em> (on page 157 according to Solopedia -- though I might be wildly off there). Unfortunately I am unable to obtain a copy of this book at the moment, so I ask: if any of you could please be so kind to upload a scan of this specimen of Tempor, I would sincerely appreciate it. It's a mystery I would <em>love</em> to help solve.<br>
    Oh, also, if anyone has <em>any</em> information on it, such as the name/s of its designer/s, foundry, known digitizations, I will love you forever!<br>
    Thanks for reading. :)</p>
  html_clean: |-
