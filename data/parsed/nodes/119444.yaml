      <p>I'm thinking this typeface could be from a dormant/defunct early digital type foundry. From what I can tell, Spice Girls fans have been trying to figure out the origin of this particular typeface for ages. For that reason, I can't be sure if the typeface was ever widely known or distributed. It might have came on a type CD-ROM package (a very 90's way of distributing digital typefaces).</p>
