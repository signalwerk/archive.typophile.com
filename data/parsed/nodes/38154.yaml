      <p>I remember when I was in high school, we had a couple of exchange students from Germany, Spain and one from Argentina. All of them had the most fantastic handwriting. I also seem to recall that even though they came from 3 separate countries/cultures and two different continents, they were virtually the same. I theorized that penmanship was stressed more heavily outside of the US.</p>
      <p>I'm going to do my best to replicate the number 1 and maybe someone can provide a practice sheet of a matching style? (my apologies for the poor attempt) The reason I ask, I just believe it has far more character and flair to it. Guess it's the designer side of me coming out and trying to influence my son's handwriting style.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/number 1_4935.jpg"></div><p></p>
