      <p>The above samples are quite beautiful. One may have seen this type of handwriting in England perhaps 40 years ago. I'm not sure handwriting is still taught in Britain, as 25% of school leavers can neither read nor write, let alone write beautifully. The general standard here is abysmal.</p>
      <p>The countries of Continental Europe teach handwriting, English language and grammar better than schools here in Britain. I heard a recent report on the radio that British teenagers have a vocabulary range (in English) of about 250 words. </p>
      <p>Nick Cooke</p>
