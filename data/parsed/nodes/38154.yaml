      <p>Yeah, the figure 1 often has a hook –&nbsp;but not in North America nor the UK, where it is a simple stroke. I heard of a German exchange student who had to argue with her American math teacher: He read a 7 where the student had written a 1 – ‘European style’.<br>
      Then, we use a crossbar to separate a handwritten 7 from a 1. This habit seems to be so strange to Americans that they name this figure a ‘French Seven’, I was told. Have you heard this expressin, too?</p>
