      <p>wow, you have all been a great help, and it has been much appreciated.</p>
      <p>The client is not print magazine, and as it turned out, they do have purchase rights to the font Gotham Rounded. </p>
      <p>Consecutively as i was trying to track down an uncorrupted version of the font from the client, i phoned up Hoefler &amp; fere jones, and asked to purchase the font.</p>
      <p>Then 20 mins later, they had sent it to me.. all at a cost of course.</p>
      <p>So although it was comissioned for print magazine they obviously dont have exclusive rights to the font.</p>
      <p>cheers.</p>
