    html: <p>How about the entire Transitional category of type. Geometrically constructed on a grid, with precision and accuracy, could that not be what you are looking for? Pixel fonts might also be something too look at as a more recent development. Although, it seems you are referencing the Bauhaus, so try and dig up stuff on Renner, Frutiger, and the like.</p>
