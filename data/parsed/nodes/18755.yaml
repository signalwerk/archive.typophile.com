    <p>Hello everybody. I am new to this forum.</p>
    <p>I am thinking about a topic for a school project (visual communication). I am interested in fonts/logotypes that are made from modular forms or based on grids. I know about the constructivist types of bauhaus or destijl.<br>
    I have a vague idea of creating something like a toolkit for constructivist typedesigning or something like that. Providing different grids and shapes in an analog and digital way... (something like that: <a href="http://staff.lib.muohio.edu/~shocker/FemInv/patgifs/257630/01.jpg" title="http://staff.lib.muohio.edu/~shocker/FemInv/patgifs/257630/01.jpg">http://staff.lib.muohio.edu/~shocker/FemInv/patgifs/257630/01.jpg</a>). Or creating instructions how to find your forms for such a type.</p>
    <p>Does anybody have any inputs, ideas, links, font examples?<br>
    I am greatful for anything.</p>
