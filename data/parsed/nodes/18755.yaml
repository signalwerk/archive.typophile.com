      <p>Michael, this <a href="http://briem.ismennt.is/2/2.3.4a/2.3.4.01.exercise1.htm" rel="nofollow">link may be of interest.</a></p>
      <p>With regards to your idea of creating a "toolkit" for constructivist type design, I think it's important to be clear about what your aim is. Do you set out to exercise the creativity of type designers within extreme limitations? Or do you want to create a "toolkit" to introduce type design to newcomers as Briem has done in the site I linked above? </p>
      <p>Perhaps there needs to be a balance between limitation and freedom, if you place extreme limits in the "toolkit", the resulting designs could be bland. </p>
      <p>That said, I'm only a graphic designer with an unhealthy type obsession and I'm very interested in what type designers have to say.</p>
      <p>Good luck!</p>
