    html: |-
      <p>Well done. As a minimalist and functionalist I would recommend the following:</p>
      <p>1. Use a consistent baseline grid throug out<br>
      2. Letterspace the caps <em>ever</em> so slightly<br>
      3. Tighten the top margin by a few points<br>
      4. Try it without the line</p>
      <p>Kerning would be worth investigating, but that's rapidly approaching the law of <a href="http://en.wikipedia.org/wiki/Diminishing_returns" rel="nofollow">diminishing returns</a> (good enough is good enough).</p>
    html_clean: |-
