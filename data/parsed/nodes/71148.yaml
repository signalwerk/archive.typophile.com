    date_raw: 9 Jun 2010 — 6:58am
    votes: null
    html: |-
      <p>You don't need iOS 4 to view PDFs on an iPad. It can already do that. All they've done is added PDFs as a content source to iBooks in the next version. </p>
      <p>You can view PDFs in all sorts of ways--Mail, Safari, special reader apps, etc. If there are fonts embedded in a PDF, they are displayed. Same with the iPhone going all the way back to the first one.</p>
      <p>My guess as to why they haven't enabled @font-face for TTF and OTF: to reduce the amount of data needed for downloading a web page, both for speed and to conserve the limited amount of RAM in the devices.</p>
