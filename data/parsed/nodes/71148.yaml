    user: 44873
    date: 2010-06-14T08:33:00
    date_raw: 14 Jun 2010 — 8:33am
    votes: null
    html: |-
      <p>@mark, sii, and all:</p>
      <p><em>My guess as to why they haven't enabled @font-face for TTF and OTF: to reduce the amount of data needed for downloading a web page, both for speed and to conserve the limited amount of RAM in the devices.</em></p>
      <p>All the more reason for them to add a compressed format like WOFF at the earliest.<br>
      But, conservation as motivation doesn't make a lot of sense to me in that SVG data is bloated compared to the equivalent data sent as an OTF or TTF. And since the Apple rasterizer throws away the TrueType hints, the most sensical thing would have been for them to, at least, have allowed OTF CFF files if file size was the concern.</p>
      <p>I think the decision was more akin to a coin toss.</p>
