      <p>I like it as it is, even though about the figures I think 3 should be the same width as 5; also would be best to "spice" the alphabet with some additional alternates to choose from. Regarding the capital S, looks OK to me. Though I would love seeing an alternate Q with more distinctive tail. </p>
      <p>Posting a PDF is not a requirement, but sometimes it helps to see the design up close, in more detail. But some people prefer rounding off the design first...</p>
