      <p>I love the symbols. I think your S is quite nice; the fact that it is not fully as big and wide as the other caps is not as much of a problem as you imagine.</p>
      <p>As for the numerals, for practical use there should probably be more choices. Make a wide set in the LFs and a narrow set in the OSFs (an open-topped rectilinear 4 in the narrow set would be cool), and then users could mix and match them at their own discretion.</p>
