    <p>hi, everyone,</p>
    <p>my name is natasha, i'm a senior at the school of the art institute of chicago studying drawing along with "art &amp; technology"... which really doesn't have anything to do with type design but i really love doing this! i'm still learning a lot about it, and have made some things in the past that are pretty whack but this is going nicely, i think. i'd like some feedback on my latest font, "Dechenko," which is a kind of deco-futurist font i've been working on.</p>
    <p>some questions i have about it in particular:</p>
    <p>+ i've been having a lot of trouble with capital S. none of the ones i draw seem to fit. have you seen similiar fonts like this that i can use as inspiration for my s?</p>
    <p>+ the numbers are varying widths. i thought this might make uses where there are a combination of numbers look more dynamic. is this ugly? </p>
    <p>but feel free to say whatever you want. i've been lurking on this forum for about a year now so i know you guys are really critical and that's exactly what i need!</p>
    <p>(also, if you could tell me what the best way to go about this is, should i have posted a PDF? i see that others in the past have.)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Dechenko1_5262.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Dechenko2_5407.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/dechenko-alpha_5888.jpg"></div><p></p>
