    <p></p><div class="imageWrap"><img src="http://typophile.com/files/linotype_may3_3909.jpg"></div><p></p>
    <p>I had the chance to see a screening of the documentary "Linotype: The Film" a few months ago, and it was excellent! I thought it was better than the documentary "Helvetica," with the addition of some wit and charm. If you are in the Baltimore area, check it out on May 3rd! I hope to see you there!</p>
    <p><a href="http://bmorelinotypethefilm.eventbrite.com" title="http://bmorelinotypethefilm.eventbrite.com">http://bmorelinotypethefilm.eventbrite.com</a></p>
    <p>Baltimore, Maryland<br>
    Thursday, May 3, 2012 – 5:30pm to 9:00pm</p>
    <p>Baltimore Museum of Industry<br>
    1415 Key Highway, Baltimore, MD 21230</p>
    <p>Come see a Linotype in action! There will be refreshments and discussion about the impact of the Linotype before and after the film. All proceeds of the event to go towards the renovation of the Mergenthaler wall displayed in the main Gallery at the Baltimore Museum of Industry.</p>
    <p>Presented by: AIGA Baltimore, ASMP Baltimore, the Litho Club of Baltimore, the Production Club of Baltimore, and the PGAMA.</p>
    <p>Screenings in other cities:</p>
    <p><a href="http://www.linotypefilm.com/screenings.html" title="http://www.linotypefilm.com/screenings.html">http://www.linotypefilm.com/screenings.html</a></p>
