    html: |-
      <p>Saw the premiere in NYC. Recognized some big name type designers and other assorted typophiles in the audience, including several Linotype operators and people interviewed in the film. Had a wonderful time.</p>
      <p>Edit: I'm not sure I would say it was "better" than the Helvetica film. It was very good, certainly, and sometimes very funny and entertaining. But whereas "Helvetica" used a typeface as a metaphor (or window into) the much bigger issue of the importance of type throughout the world, "Linotype" really just told a collection of specific stories about specific people, and never seemed to resolve itself into making a point about anything larger. Which isn't necessarily a weakness, and perhaps when I see it again (of course I'm getting the DVD) I might feel differently.</p>
