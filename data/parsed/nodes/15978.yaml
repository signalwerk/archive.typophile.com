      <p>Thanks for your feedback, but it’s neither Old English or Cloister, I have both fonts and neither has the curly ‘e.’ </p>
      <p>We duplicate this font all the time using high-res scans, but it would be much more convenient to have it as a digital typeface. I should have specified that the line shading isn’t part of the typeface, but yes, you’re right, an added feature.</p>
