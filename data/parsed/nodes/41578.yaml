      <p>Three guys ( a sushi chef, a goldsmith, and a typographer) in a rowboat that begins sinking due to excessive weight. They decide someone must go overboard to save the ship. The goldsmith says it can't be me, my work is too precious. The typographer says, let's throw the sushi chef out, he belongs with the fishes! The sushi chef grabs the typographer, wraps him in seaweed and pitches him in the ocean. The goldsmith says, "Why him?" and the chef replies, "I was just getting the lead out."<br>
      The typographer was screaming insults towards the boat from the freezing waves. The Goldsmith turned to the Sushi chef and said, "What was that all about? The sushi chef replied, "Ah, he is just out of sorts."</p>
      <p>ChrisL</p>
