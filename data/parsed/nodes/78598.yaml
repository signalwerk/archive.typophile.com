    <p>Hi everyone, I wonder if anyone knows the primary face used in this cover of Mein Kampf. The question was asked on another forum and was never answered. The asker mentioned that the cover is a reproduction and that the face is probably available digitized. I'm specifically interested in the black letter face used for the styling of "Mein Kampf" in particular. <a href="http://new.myfonts.com/WhatTheFont/forum/case/302778/" rel="nofollow">Here</a> is the original post.</p>
    <p>And <a href="http://myfonts-wtf.s3.amazonaws.com/73/7317d38ba92eef99d598b599630b69dc.142799.png" rel="nofollow">Here is a link</a> to the image, which I am posting below as well.  </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/7317d38ba92eef99d598b599630b69dc_5373.142799.png"></div><p></p>
