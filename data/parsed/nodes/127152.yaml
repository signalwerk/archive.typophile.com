  html: |-
    <p>Hopefully not too spammy, but maybe some of you would enjoy our Instagram account '70s Movie Poster Typography'. We look at a different movie poster from the 70s every day, identify and discuss the typefaces (when possible), with a general emphasis on 70s ITC fonts, and a slight slant towards classic horror.</p>
    <p><a href="http://www.instagram.com/70smoviepostertypography/">http://www.instagram.com/70smoviepostertypography/</a></p>
