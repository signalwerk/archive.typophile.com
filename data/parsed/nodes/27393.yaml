    html: |-
      <p>If you’re working with CSS, then you should take advantage of the linespacing, size, and tracking options and go for typefaces that are common on most machines which are Arial, Times New Roman, Georgia, and Verdana. My advice is to avoid the first two fonts ;)</p>
      <p>If you’re using images as text spaces, then look into “screen fonts” or “pixel fonts.”</p>
