    html: |-
      <p>Palatino Linotype is also common (Windows XP), but be sure to provide alternatives and don’t make it too small. A hint: Book Antiqua and Zapf Calligraphic are nearly identical to Palatino.</p>
      <p>Web type is 99% about line spacing and widths of text blocks (if the contrast between background and the type color is already sorted).</p>
      <p>Be careful with Verdana, it has a much bigger x-height than other popular web fonts. If your type is set in 8px Verdana it will be less legible if a browser decides to display it in e.g. Arial. Verdana is found on both Windows PCs and Macs, so you won’t let down many of your viewers anyway. The biggest problem is Linux, but there you have “Bitstream Vera Sans” which also has a large x-height.</p>
      <p>Good use of Georgia: <a href="http://www.jasonsantamaria.com/archive/2006/06/25/letterpress_adventure.php">Jason Santa Maria</a></p>
      <p>Good use of Arial: <a href="http://www.sixapart.com/about/corner/">Six Apart</a></p>
      <p>Good use of Verdana: <a href="http://www.marksimonson.com/">Mark Simonson Studio</a></p>
      <p>Good use of Lucida Grande: <a href="http://www.haveamint.com/faqs">Mint</a></p>
      <p>Good use of Times New Roman: Can’t think of any…</p>
      <p>Good use of Palatino: <a href="http://blog.fawny.org/2006/06/24/failed3/">Joe Clark</a><br>
      (you’ll see it if you don’t have “Constantia”, “Rockwell” or “Serifa” on your machine)</p>
      <p>Good use of Comic Sans:<br>
      Never. Or, in some cases, 9px italic. Or not.</p>
      <p>There are also a few new kids on the block: Cambria, Constantia, Calibri, Corbel and Candara as well as the monospaces Consolas, but don’t count too much on them just yet.</p>
