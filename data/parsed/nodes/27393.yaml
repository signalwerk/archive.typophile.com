    <p>I’m about to create a weblog and thought I’d get some advice on type. I’m looking to ignore the 800 x 600 and going for a bigger 1024 x 768 design. This means more space - more type options.</p>
    <p>Anyone got any suggestions for web type or websites where type is good and well used? Type on the web can be pretty difficult I’ve read. Would appreciate any input for either weblog or type design. Thanks.</p>
