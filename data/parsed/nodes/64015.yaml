    <p>Does anyone know anything about the title type for James Cameron's forthcoming movie "Avatar"?</p>
    <p><a href="http://www.avatarmovie.com/" title="http://www.avatarmovie.com/">http://www.avatarmovie.com/</a></p>
    <p>I've Googled "avatar movie typeface Cameron"</p>
    <p>2/3 of the hits were for any site with "avatar," meaning someone's proxy.<br>
    Lots of hits for "typeface" and "movie" etc.</p>
    <p>A few hits specifically mentioned the font, calling it Papyrus. It's verrry similar to Papyrus, but there are a number of salient differences (and there are only four characters in the word "Avatar"). Perhaps it is Papyrus with these few differences:</p>
    <p>1. Crossbar of first A doesn't touch<br>
    2. Apexes of other A's don't touch<br>
    3. V has a calligraphic ending stroke on left leg<br>
    4. Crossbar of T is less curved than in Papyrus<br>
    5. Leg of R ascends above bowl. Bowl doesn't touch leg at the waist. Right leg of R has a different termination.</p>
    <p>Thanks.</p>
