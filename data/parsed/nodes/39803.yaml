      <p>The two volume set called Art in Theory is nice to have on the shelf...</p>
      <p>Art in Theory 1815-1900 An Anthology of Changing Ideas<br>
      <a href="http://www.amazon.co.uk/Art-Theory-1815-1900-Charles-Harrison/dp/0631200665" title="http://www.amazon.co.uk/Art-Theory-1815-1900-Charles-Harrison/dp/0631200665">http://www.amazon.co.uk/Art-Theory-1815-1900-Charles-Harrison/dp/0631200665</a></p>
      <p>Art in Theory 1900-2000 An Anthology of Changing Ideas<br>
      <a href="http://www.amazon.co.uk/Art-Theory-1900-2000-Anthology-Changing/dp/0631227083" title="http://www.amazon.co.uk/Art-Theory-1900-2000-Anthology-Changing/dp/0631227083">http://www.amazon.co.uk/Art-Theory-1900-2000-Anthology-Changing/dp/06312...</a></p>
      <p>On-line, try searching 'timelines' and you'll find brief looks at what happened when, like this... <a href="http://www.drleslie.com/Timeline/Timelines.html" title="http://www.drleslie.com/Timeline/Timelines.html">http://www.drleslie.com/Timeline/Timelines.html</a></p>
      <p>[edit] I just noticed that there is a third volume to the ones I use and mentioned above...</p>
      <p>Art in Theory 1648-1815: An Anthology of Changing Ideas<br>
      <a href="http://www.amazon.co.uk/Art-Theory-1648-1815-Anthology-Changing/dp/0631200649/ref=pd_sim_b_title_4/203-9785524-3556707" title="http://www.amazon.co.uk/Art-Theory-1648-1815-Anthology-Changing/dp/0631200649/ref=pd_sim_b_title_4/203-9785524-3556707">http://www.amazon.co.uk/Art-Theory-1648-1815-Anthology-Changing/dp/06312...</a></p>
      <p>Coolness! </p>
      <p>Hey Santa... !</p>
