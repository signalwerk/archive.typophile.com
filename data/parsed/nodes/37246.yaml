      <p>9. Have ya ever met a man with a real yardarm?</p>
      <p>8. Come on up and see me urchins.</p>
      <p>7. Yes, that is a hornpipe in my pocket and I am happy to see you.</p>
      <p>6. I’d love to drop anchor in your lagoon.</p>
