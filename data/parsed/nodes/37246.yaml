      (We came up with these in an effort to interest The Other Dave (Letterman) in TLAPD. His staff liked ’em, but alas, his show was”dark” the week of Sept. 19.) As seen on <a href="http://www.talklikeapirate.com" target="new">www.TalkLikeAPirate.com</a> —<p></p>
