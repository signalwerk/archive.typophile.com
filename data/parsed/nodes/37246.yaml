      <p>Q: What’s a pirate’s favorite aspect of computational linguistics?<br>
      A: PARRRsing sentences.</p>
      <p>Q: Of which concept shared by Jungian psychology and Northrop Frye’s literary theory are pirates especially fond?<br>
      A: ARRRchetype.</p>
      <p>Q: Who’s a pirate’s favorite member of the creative team behind “32 Short Films About Glenn Gould”?<br>
      A: Don McKellARRR.</p>
      <p>Q: Of all of Richard Harris’s many achievements in the performing arts, which is a pirate’s favorite?<br>
      A: “MacARRRthur PARRRk.”</p>
      <p>Q: What’s a pirate’s favorite alliance-creating diplomatic agreement from the Second World War?<br>
      A: The TripARRRtite Pact.</p>
      <p>Q: Which ancient Greek lyric poet do pirates like the best?<br>
      A: PindARRR.</p>
      <p>Q: If a pirate were to recite one of the Olympian odes by the aforementioned poet, which one would it be?<br>
      A: The XIth Nemean Ode, “To ARRRistagoras, the Prytanis of Tenedos, son of ARRRchesilaus.”</p>
      <p>Q: If that same pirate were then to recite a 20th-century poem about the nature of poetry, what would it be?<br>
      A: “ARRRs Poetica” by ARRRchibald MacLeish.</p>
      <p>Q: What if he went on to recite a poem by Sir Walter Scott?<br>
      A: “LochinvARRR.”</p>
      <p>Q: Why does that pirate keep reciting poetry, anyway? Is he some sort of Nancy-boy?<br>
      A: Aye, ’tis a Nancy-boy he be. Arrr.</p>
      <p>Q: Of the ghosts that appear to Ebenezer Scrooge in “A Christmas Carol,” which do pirates prefer?<br>
      A: Jacob MARRRley.</p>
      <p>Q: Can we replace that last one with something about Bob Marley, so we can have an additional gag about RastafARRRianism?<br>
      A: No.</p>
      <p>Q: Whom did the pirate vote for in the Haitian election?<br>
      A: ARRRistide.</p>
      <p>Q: Wait. Why did they let a pirate vote in the Haitian election?<br>
      A: Remember, the nation was taking its first halting steps toward democracy, and balloting procedures were rather chaotic. The pirate just slipped in somehow. Arrr.</p>
      <p>Q: I don’t buy it. Pirates care nothing for participating in the electoral process.<br>
      A: Look, can we finish this up soon? I’m having those phantom pains in my wooden leg.</p>
      <p>Q: A phenomenon first described in the 17th century by which important contributor to the field of amputation surgery?<br>
      A: Oh, this is getting ridiculous.</p>
      <p>Q: Just say it.<br>
      A: Ambroise PARRRé.</p>
      <p>Q: You can go now.<br>
      A: Arrr. Nancy-boy.</p>
