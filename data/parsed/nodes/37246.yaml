      <p>Arrrr!!!</p>
      <p>I just got a hilarious email from Oceana - contents pasted below:</p>
      <p>Ahoy, greetin’s,</p>
      <p>Batten down the hatches! Weigh anchor and hoist the mizzen! Shiver me timbers, Talk Like a Pirate Day is today. Aye today, gar. Ye best be on the ready if ye know what’s good for you, lest ye be fixin’ t’ hang from the yardarm by a necktie instead. Aaaarrrrgggghhhh!</p>
      <p>If ye think ye bra’e enough, blood-thirsty enough, black-hearty enough, well bucko, har be a list o’ phrases t’ be sure your pirate speak is shipshape. Use ’em far and wide, but use ’em wisely. The cap’n keelhauls bilge-suckin’ scallywags – ye may find yourself pickin’ barnacles from ye starboard knacker for a fortnight, savvy?</p>
      <p>Ahoy! – Hello!<br>
      A merry yarn – A good story<br>
      Booty – Treasure<br>
      Davy Jones’ Locker - fabled, mythical place at the bottom of the ocean where the evil spirit of Davy Jones brings sailors and pirates to die<br>
      Shiver me timbers – I’m scared, my legs be shaking.<br>
      Shocked to the very boney – That’s surprising.<br>
      Weigh anchor and hoist the mizzen! – Pull up anchor, let’s go sailing.<br>
      Yarr. – I agree.<br>
      Yarr! – I see your point, and mightily agree.<br>
      Yarr? – What did you say?</p>
      <p>Whether ye be an old salt or a landlubbin’ lass with a gust’ for guff, pay note: Today is a day t’ make merry and honor the briny deep. So come aboard, ye scur’y dogs, if ye have what it takes to be a pirate for a day. It’s by the board for the rest o’ ye rapscallions and off t’ Da’y Jones’ Locker with ye. Gar.</p>
      <p>Dead men tell no tales,<br>
      Second Mate Nikki “Parrot Got Me Eye” Smythe<br>
      Online Editor<br>
      Oceana</p>
