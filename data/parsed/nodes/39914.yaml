      <p>The grid (and the whole piece) is intentionally dull. I wanted to do a big publication project that felt more conservative and didn’t have gigantic headlines, pull-quotes, and images bursting out all over the place (as I usually tend to do). I also felt that understated typography might allow the intense images to pop out more, but I probably need to up the scale to make that work better.</p>
