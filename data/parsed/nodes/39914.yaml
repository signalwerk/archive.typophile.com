      <p>James, if it were me I would go to a decent art bookstore and hang around for as long as the staff will let you, flipping thru art books and taking note of layouts and design. You'll encounter more usable ideas there in the same amount of time as posting at typophile. Don't be afraid to borrow as long as borrowing is not the only thing you do.</p>
      <p>I would use a bit more leading in the main body; replace the dropped cap with a decorative cap (any decorative font that goes with the material and Iowan Old Style); do the TOC and picture captions in Iowan smallcaps; half-title and title pages in Iowan smallcaps; use hanging figures where appropriate (main body copy for example); use italics for inline quotes.</p>
      <p>How about some rubrication? It needn't be red. Try other colors, blue, cyan, orange. Rubrication makes a good alternative to pull quotes if you're averse to those.</p>
      <p>Iowan titling font has some nice ornaments you could use as embellishments to spice things up.</p>
      <p>Yes the manuscript has some serious problems which need to be rectified before your typography can make it "sing". The whole thing is overwrought, and the author can't handle an apostrophe, eg: <strong>Louis's oeuvre</strong> should be <strong>Louis' oeuvre</strong>. <strong>Joan Mira</strong> probably should be <strong>Joan Miro</strong>. Quite a few of the hyphens should be emdashes. Convoluted run-on sentences make it a cumbersome read. "Infused with a diaphanous jubilation," no, sorry, that's pure wankshaft, too desperate to be effective.</p>
      <p><em>non-aligning numbers</em></p>
      <p>You mean hanging or "old style" figures? The complete Iowan Old Style set has an OSF roman font and matching smallcaps and titling font.</p>
      <p>j a m e s</p>
