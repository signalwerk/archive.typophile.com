      <p>Does the body typeface you are using have non-aligning numbers and small caps? Check for old style figures, its just those dates look so big in body text, as do the abbreviations.</p>
      <p>Abreviations and dates like 1967 often appear to big when set in body text. Thats why we use small caps for abbreviation like : JFK plus.<br>
      Numbers like 1967 also look big. Good typefaces take care of this by using non-aligning numbers, much like our good friend Georgia here.</p>
