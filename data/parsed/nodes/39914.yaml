      <p>A few thoughts:</p>
      <p>- I wonder if the grid is dramatic enough.<br>
      - The artwork is beautiful but in so many instance so tiny.<br>
      - The opening title and half-title pages seem to lack something. (A more dramatic grid could help.) The location of the image for instance on the opening spread seems mechanical.<br>
      - In the opening you use a condensed sans and then when the text starts you aren't.<br>
      - Could there be more scale in the text?<br>
      - The use of a drop cap mid-body seems out of place. If you use a drop cap I'd think one would appear at the beginning as well. Or, if it does signal a different kind of text, then the text at the beginning should be treated differently.</p>
      <p>Great material to use. But I think you need more spice.</p>
      <p>I hope I haven't been too harsh. I mean everything only as crit.</p>
