    <p>Please crit my typography final, a book about American painter Morris Louis. All text is live text, and I have formatted titles and inserted special characters where necessary. Images relate to the text as much as possible, but captions do not include fig. reference numbers as I was not able to get hi-res versions of all of them. Types used are Iowan Old Style and News Gothic, both for the conservative look—for those who don’t know, Morris worked here in Washington, and it’s a stuffy town—and for their American heritage.</p>
    <p>There are two PDFs, one formatted as single pages and one with spreads. In order the spreads are:</p>
    <p>Half-title<br>
    Title<br>
    Contents<br>
    Chapter Opener<br>
    Four text spreads</p>
    <p>File uploads to Typophile appear to be broken today, so I am hosting the files on my server.<br>
    <a href="http://www.jpad.biz/pdfs/puckett.louisbook.spreads.pdf" rel="nofollow">PDF with spreads</a><br>
    <a href="http://www.jpad.biz/pdfs/puckett.louisbook.spreads.pdf" rel="nofollow">PDF with single pages</a></p>
