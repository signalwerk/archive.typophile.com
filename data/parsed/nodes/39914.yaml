      <p>Not that it really affects your design but this copy is poorly edited</p>
      <p>&gt;“…effusing paradisiacal mists-transparently clear in process…”<br>
      Should the hyphen be an em dash?</p>
      <p>&gt;“In this, his first series of Veil paintings, Louis’s pours of thinned acrylic paint soaked into the canvas…”<br>
      Where to start?</p>
      <p>rather than go through the whole text, I’d get somebody uninvolved with the project to proof it for you.</p>
      <p>Page 11 the measure seems a bit broad some of the lines are verging on too loose, this isn't helped by the comparably looser leading.</p>
      <p>In the third paragraph of page 12, which runs across the columns there are some short turnovers from the hyphens, in particular “…demonstra-ble—nor…” bothers me. </p>
      <p>Pages 14–15 the distances from caption to image vary. When a drop cap A is used I tend to pull the lines back to accommodate the slope. There are footnote numbers with no relating footnote (unless they are endnotes).</p>
      <p>You might want to consider small caps for the image titles rather than italic, and on the contents page, depending on the binding, I would rethink the image crossing a spread. I find the coloured drop caps rather gilding the lily.</p>
      <p>Tim</p>
