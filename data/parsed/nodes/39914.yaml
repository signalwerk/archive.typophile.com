      <p>I second much of what Tiffany said (and sorry not to chime in sooner, I only just noticed this thread).</p>
      <p>Type aside, I think you are short-changing the art by having it adhere so rigidly to the grid. Those pictures need to sing. There's nothing wrong with having one grid for the text and then letting your margins out for the images. His work is massive in scale, and in your book you get no sense of that, except for the chapter opener. I don't see the purpose of all that dead white space on the outer margin. Don't think the two pix work side by side on the last spread.</p>
      <p>Now the design/typography. I haven't given it the sort of close read the others have, here are a few comments in no particular order.</p>
      <p>Half title and title: The type looks very cramped, especially the title page. Also,  you never really would use the same image for both.</p>
      <p>Contents page: you don't need to list "contents" on the contents page. Also it's Foreword (I see someone else pointed that out) and Acknowledgments (no e after the g). I'm also not sure why you guttered the art here. Remember that you're dealing with an actual book here, not spreads on a computer. While it's quite common to run art across the gutter, I can't see why you did it here.</p>
      <p>Chapter opener: I don't think the various elements hang together all that well. I'd also make the chapter title consistent with the type on the title page. I'm not wild about the condensed type on the title page but if you're set on it, I think you should use it here too.</p>
      <p>Drop caps: I agree with Tiffany that they are distracting. Consider another device for the text breaks like a leadin, that you can also use for the opening paragraph.</p>
      <p>Page 14: not sure what the image is lining up with here. Either align the image or the caption with the text in the opposite column.</p>
      <p>And I just realized I am way too late on this - you have probably already gotten your crit. Oh well, I already wrote it so here you go.</p>
    html_clean: |-
      <p>I second much of what Tiffany said (and sorry not to chime in sooner, I only just noticed this thread).</p>
      <p>Type aside, I think you are short-changing the art by having it adhere so rigidly to the grid. Those pictures need to sing. There's nothing wrong with having one grid for the text and then letting your margins out for the images. His work is massive in scale, and in your book you get no sense of that, except for the chapter opener. I don't see the purpose of all that dead white space on the outer margin. Don't think the two pix work side by side on the last spread.</p>
      <p>Now the design/typography. I haven't given it the sort of close read the others have, here are a few comments in no particular order.</p>
      <p>Half title and title: The type looks very cramped, especially the title page. Also,  you never really would use the same image for both.</p>
      <p>Contents page: you don't need to list "contents" on the contents page. Also it's Foreword (I see someone else pointed that out) and Acknowledgments (no e after the g). I'm also not sure why you guttered the art here. Remember that you're dealing with an actual book here, not spreads on a computer. While it's quite common to run art across the gutter, I can't see why you did it here.</p>
      <p>Chapter opener: I don't think the various elements hang together all that well. I'd also make the chapter title consistent with the type on the title page. I'm not wild about the condensed type on the title page but if you're set on it, I think you should use it here too.</p>
      <p>Drop caps: I agree with Tiffany that they are distracting. Consider another device for the text breaks like a leadin, that you can also use for the opening paragraph.</p>
      <p>Page 14: not sure what the image is lining up with here. Either align the image or the caption with the text in the opposite column.</p>
      <p>And I just realized I am way too late on this - you have probably already gotten your crit. Oh well, I already wrote it so here you go.</p>
