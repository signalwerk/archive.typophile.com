      <p>A few points I'd raise are:</p>
      <p>- You seem to be lacking a lot of ligatures, if not all of them. I especially see a lack of fi-ligatures.</p>
      <p>- Try to use text figures, especially in the main body.</p>
      <p>- I think you mean ‘Foreword’ not ‘Foreward’</p>
      <p>- To me the typeface looks like it could really use the good, old slanted hyphen, instead of the straight one it’s maker has provided it. Try replacing the hyphens with some nicer ones. I'd suggest something like Adobe Jenson Pro.</p>
      <p>I'm a bit pressed for time right now, so I may come back with more once I get a chance to look more closely at it...</p>
