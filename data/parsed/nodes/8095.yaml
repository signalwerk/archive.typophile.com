  html: <p>I work with a graphic design studio in the middle east, and we have 8 designed and digitised ARABIC fonts.  <br>We have printed a flyer that shows thoe fonts and have presented them to a few clients.  <br>What do we do now? how do we register them? and how dp we protect ourselves? One client has already taken the proofs, digitised them and is planning on using them for a major Arab TV station. <br>Is their an international law that protects us? can someone help me with the steps and measures to take? <br> <br>Yara Khoury <br>Al Mohtaraf Assaudi, <br>Beirut, Lebanon</p>
  html_clean: <p>I work with a graphic design studio in the middle east, and we have 8 designed and digitised ARABIC fonts.  <br>We have printed a flyer that shows thoe fonts and have presented them to a few clients.  <br>What do we do now? how do we register them? and how dp we protect ourselves? One client has already taken the proofs, digitised them and is planning on using them for a major Arab TV station. <br>Is their an international law that protects us? can someone help me with the steps and measures to take? <br> <br>Yara Khoury <br>Al Mohtaraf Assaudi, <br>Beirut, Lebanon</p>
