    html: <p>This is a very sad story. <br> <br>Unfortunately, if they digitized a new typeface from your proofs, they may not have violated any laws in your jurisdiction. <br> <br>In font protection, it seems like every direction you turn, you run into a wall. In many countries, you can trademark the name of a font; but if they give your font a new name, then they aren't neccessarially violating your trademark. Font software can be copyrighted, too, but if someone make new software from an image of your font, then that doesn't violate software copyright law either, if they didn't use your actual computer file to make theirs. <br> <br>In many European countries, you can get a design patent on the visual design of a typeface. If you got a design patent in the EU, and this TV station broadcasts or does any buiness in the EU as well, you might be able to sue them in EU courts. That's the best that I can think of in terms of legal defense. <br> <br>I would try out Si's suggestions. Certainly write letters, make phone calls, and complain. Maybe you can at least prevent other designers from working with this company in the future</p>
    html_clean: <p>This is a very sad story. <br> <br>Unfortunately, if they digitized a new typeface from your proofs, they may not have violated any laws in your jurisdiction. <br> <br>In font protection, it seems like every direction you turn, you run into a wall. In many countries, you can trademark the name of a font; but if they give your font a new name, then they aren't neccessarially violating your trademark. Font software can be copyrighted, too, but if someone make new software from an image of your font, then that doesn't violate software copyright law either, if they didn't use your actual computer file to make theirs. <br> <br>In many European countries, you can get a design patent on the visual design of a typeface. If you got a design patent in the EU, and this TV station broadcasts or does any buiness in the EU as well, you might be able to sue them in EU courts. That's the best that I can think of in terms of legal defense. <br> <br>I would try out Si's suggestions. Certainly write letters, make phone calls, and complain. Maybe you can at least prevent other designers from working with this company in the future</p>
