    html: <p>Only a few good attorneys for type design are around. <br> <br><a href="http://www.martinezgroup.com" target="_blank">www.martinezgroup.com</a> / Frank Martinez / USA <br> <br><a href="http://www.kianispringorum.de" target="_blank">www.kianispringorum.de</a> / Nassim Kiani / EU -  <br>she spoke at Typo2004 Berlin <br> <br>1. You can register a trademark (fontname) worldwide. <br> <br>2. In some jurisdictions the design is protectable too.  <br> <br>3. The strongest protection is the font data itself - its software. <br> <br>You need a lot of money, time and patience. And even you have all done to protect you fonts, there is no guaranty for success. <br> <br>The best protection is, to be better and more known than your competitors.  <br> <br>Arabic script fonts need a lot of feature code stuff I think. Right? A script for low resolution, like TV has other technical needs as for print. So  if your client has not your experience - I'm sure in the long run you will win. Good Luck.</p>
