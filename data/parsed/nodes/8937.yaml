    html: <p>Most educational, thank you david for the translation. It's also a great story, I look forward to more of this kind of thing. <br> <br>If I may, I have some questions about the design of DIN, Mr. Pool, if you would be so kind. Can we assume that the decisions made in the design, very unique things like the comma and the at symbol, come from your research? Are the alternate characters, such as the circular period and single story 'a' also from varieties of the original?  Or are these things that you brought to the face to make it more versatile?  <br> <br>Just curious, thought I'd take the chance to ask, thanks for your time, <br>Aaron</p>
    html_clean: <p>Most educational, thank you david for the translation. It's also a great story, I look forward to more of this kind of thing. <br> <br>If I may, I have some questions about the design of DIN, Mr. Pool, if you would be so kind. Can we assume that the decisions made in the design, very unique things like the comma and the at symbol, come from your research? Are the alternate characters, such as the circular period and single story 'a' also from varieties of the original?  Or are these things that you brought to the face to make it more versatile?  <br> <br>Just curious, thought I'd take the chance to ask, thanks for your time, <br>Aaron</p>
