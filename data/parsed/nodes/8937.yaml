  html: <p>Hey Guys, <br> <br>I was wondering if anyone knew where I'd find infomation about the development of the DIN typeface. I know Font Shop redid a version of it in the 90's, but does anyone know anything else about it? Thanks again. <br> <br>Best, <br> <br>David Fung</p>
