    html: <p>From LinoType. <br><br>About <span class="caps">DIN</span> 1451 Font Family <br><br><br><span class="caps">DIN</span> stands for Deutsche Industrienorm, German Industrial Standard. In 1936 the German Standard Committee settled upon <span class="caps">DIN</span> 1451 as the standard font for the areas of technology, traﬃc, administration and business. The Committee chose a sans serif font because of its legibility and because its forms are also easy to write. This font was not foreseen for advertisements and other ‘artistically oriented uses’ and there were disagreements about its aesthetic qualities. Nevertheless, <span class="caps">DIN</span> font was seen everywhere in Germany, on signs for towns and traﬃc, and hence made its way into advertisements because of its ease of&nbsp;recognition.</p>
