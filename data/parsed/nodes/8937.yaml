  html: <p>Hey Guys, <br><br>I was wondering if anyone knew where I’d ﬁnd infomation about the development of the <span class="caps">DIN</span> typeface. I know Font Shop redid a version of it in the 90’s, but does anyone know anything else about it? Thanks again. <br><br>Best, <br><br>David&nbsp;Fung</p>
