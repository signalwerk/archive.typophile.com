    html: '<p>the original page is // <a href="http://www.sostav.ru/columns/dutch/2004/10/" target="_blank">http://www.sostav.ru/columns/dutch/2004/10/</a> <br><br>you can use this to correspond with the imagery. <br><br>//// <br><br><br>Dutch track on the German roads <br><br>4 already it got tired to be surprised so that everything which me here surrounds it possesses one or other degree or another of legendary nature. Here and this time, in guests visited the now famous former student Of kAVKi Albert- Jan ﬂoor (Albert- Jean Pool): <br><br><br>In those times, when Albert was here student in the 80th, under the management of one additional legend of Gerrit Of nordiya (Gerrit Noordzij) of department Type&amp;.Media yet there did not exist, but academy already became slowly incubator for the type designers. The group of talented young shriftovikov organized then the creative group Letters, into composition of which entered the future celebrities: Frank Blokland (Dutch Type Library), Petr Van Blokland, Jelle Bosma, Lucas de Groot, Bart de Haas, Henk Van Leyden, Peter-Matthias Noordzij (The Enschede Font Foundry), Marie-Cecile Noordzij-Pulles, Just Van Rossum and Peter Verheul. Children were gathered, by their “powerful heap”, discussed types, they shared experience — that still it is possible to make in the student companies… <br><br><br>1986 <br><br>But our hero after studies leaves for Germany, for Hamburg, where he begins to work ﬁrst in company Scangraphic, <br>and then also in <span class="caps">URW</span>++. For the latter it develops types <span class="caps">URW</span> Imperial, <span class="caps">URW</span> Linear, <span class="caps">URW</span> Mauritius. <br>Then Albert- Jan organizes in Hamburg his own design the studio, which now is called FarbTon (before — Dutch Type): <br><br><br><br><br><br>One of the most known works of its studio of steel type and the ﬁrm style of the network of gasoline pumps Jet: <br><br>First sketches… <br><br><br><br><br><br><br><br><br>Another, not less known work, type for Company Hein Gaz, designed together with designers <span class="caps">DTL</span>: <br><br><br><br><br><br>During the cold days — as into the warm. Hein Gaz For the more humane heat- <br><br>To man it is necessary a little heat. Hein Gaz For the more humane heat- <br><br>Then Albert- Jan ﬂoor obtains proposal from corporation FontFont (using the case, I congratulate it with the ﬁfteen-year period!) on the development of new type on basis the set of ﬁrst half of the century (of past) German commercial standard Deutsche Industrie Norm — <span class="caps">DIN</span>. <br>Albert- Jan with happiness agrees, after solving that work is not so complex, as it is interesting. However, after studying serious studies it reveals more than thousand diﬀerent it is type developed by <span class="caps">DIN</span>- institute during the period from the beginning on the middle of century… <br><br><br><br><br><br><br><br><br><br><br><br><br>including the early… <br><br><br><br><br><br>including by the way, and the cyrillic alphabet, developed in 1943… <br><br><br><br>besides, into these standards entered not only types, but also logotypes… <br><br><br><br><br><br><br><br>But also reveals a large quantity of inscriptions, which were preserved on the old buildings, those sometimes written multilayer, by diﬀerent types, and on the tables… <br><br><br><br><br><br><br><br>even children’s stencils for study and drawing of letters were described once in <span class="caps">DIN</span>… <br><br><br><br>After processing all this sea of type information, Albert- Jan ﬂoor produces to light <span class="caps">FF</span> <span class="caps">DIN</span> — perfect German type, created, ﬁrst of all, on base <span class="caps">DIN</span>-Mittelschrift of 1451: <br><br><br><br><br><br><br><br><br><br><br><br>Now this type became the integral part of Germany and is used for guide sign… <br><br><br><br>(here, by the way, last development in the region of “road” it is type from James montal’ban by the name ClearView) <br><br>for the advertisement and the periodicals… <br><br><br><br><br><br><br><br>Thus, Albert- Jan was one of the ﬁrst researchers, who turned upside-down the storages of the old <span class="caps">DIN</span>ovskix it was type. And theme proved to be such interesting that many type oﬃces already solved (but how much still they will solve!) in it to pokopat’sya: <br><br><br><br>Engschrift <span class="caps">DIN</span> 1421 by <span class="caps">URW</span>++ <br><br><br><br><br><br><span class="caps">DIN</span> Neuzeit By Linotype <br><br><br><br><br><br><span class="caps">DIN</span> 1451 By Linotype <br><br>Ilya <span class="caps">RUDERMAN</span> <br>She wrote down from the words of the author Julia&nbsp;bogatko</p>'
