    <p>Hello,<br>
    Wondering if any of your can recommend a hand lettering genius to help us create a signature logotype.  Was trying to work with Ale Paul from Sudtipos in Argentina, but he's about to go on vacation.  That's the kind of person I am looking for (i.e. in terms of the kinds of lettering he does).</p>
    <p>Any recommendations would be greatly appreciated.</p>
    <p>We are in San Francisco, but they/you/whoever doesn't have to be local.</p>
    <p>Thanks,<br>
    Peter.</p>
