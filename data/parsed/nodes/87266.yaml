  html: |-
    <p>New release font: Air Factory</p>
    <p>Air Factory was originally designed for a merchandise company, and ordered to design iconic but plain forms. Air Factory is a very simple and modern sans-serif font inspired by early 1900’s typefaces, like Futura, and consisting of 5 weights and stencil type(free). This contemporary typefaces would be good use for restaurant, retail, book, poster etc. Air Factory also features various ligatures, stylistic alternates, fractions, and languages as well.<br>
    AIr Factory is available @<br>
    <a href="http://new.myfonts.com/fonts/khaito-gengo/air-factory/" title="http://new.myfonts.com/fonts/khaito-gengo/air-factory/">http://new.myfonts.com/fonts/khaito-gengo/air-factory/</a><br>
    or<br>
    <a href="http://www.fontspring.com/fonts/khaito-gengo/air-factory" title="http://www.fontspring.com/fonts/khaito-gengo/air-factory">http://www.fontspring.com/fonts/khaito-gengo/air-factory</a></p>
