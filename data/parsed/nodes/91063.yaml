      <p>For an example of the difference between print and screen typography, consider Ikea’s change of corporate typeface from Futura to Verdana.</p>
      <p>Verdana is brilliant on screen, for which it was designed, but lacks sophistication in print, which is unfortunate for a design business like Ikea.</p>
      <p>Here are a couple of items that will give you a good idea of how designers can dislike a face in print (to the extent of it being the butt of an April Fool’s joke), which has long been extolled on screen:</p>
      <p><a href="http://idsgn.org/posts/verdana-and-georgia-grow-up/" title="http://idsgn.org/posts/verdana-and-georgia-grow-up/">http://idsgn.org/posts/verdana-and-georgia-grow-up/</a><br>
      <a href="http://idsgn.org/posts/apple-switches-to-verdana/" title="http://idsgn.org/posts/apple-switches-to-verdana/">http://idsgn.org/posts/apple-switches-to-verdana/</a></p>
      <p>More typically, the issue of screen/print portability is framed the other way around, with the main culprits being faces which have excelled for centuries in print having difficulty adjusting to pixellation.</p>
