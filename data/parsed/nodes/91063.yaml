      <p>Nick Shinn hit on an important topic which is seldom addressed in the print vs. screen debate, and that is transmission vs. reflection.</p>
      <p>Personally, I find looking at the screen for extended periods to be fatiguing: I take frequent breaks from the screen, simply to desaturate my eyeballs. If I don't, I can easily develop optical migraines—i.e., pulsating, jagged star-like phantoms in my visual field. If I encounter a lengthy article online which interests me, I am inclined to print it out, rather than torture my eyeballs for an extended period of time.</p>
    html_clean: |-
