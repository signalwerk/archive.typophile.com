      <p>@Hrant: “<em>but ~300dpi isn't even close to enough, even anti-aliased</em>.”</p>
      <p>Reference? </p>
      <p>I’m pretty sure this has been discussed, but from what I understand, based upon a few readings:</p>
      <p><a href="http://prometheus.med.utah.edu/~bwjones/2010/06/apple-retina-display/" rel="nofollow">A Jonesblog post about the Apple retina display</a><br>
      “<em>According to a relatively recent, but authoritative study of photoreceptor density in the human retina (Curcio, C.A., K.R. Sloan, R.E. Kalina and A.E. Hendrickson 1990 Human photoreceptor topography. J. Comp. Neurol. 292:497-523.), peak cone density in the human averages 199,000 cones/mm2 with a range of 100,000 to 324,000.  Dr. Curcio et. al. calculated 77 cycles/degree or .78 arcminutes/cycle of *retinal* resolution.  However, this does not take into account the optics of the system which degrade image quality somewhat giving a commonly accepted resolution of 1 arcminute/cycle.  So, if a normal human eye can discriminate two points separated by 1 arcminute/cycle at a distance of a foot, we should be able to discriminate two points 89 micrometers apart which would work out to about 287 pixels per inch</em>.”</p>
      <p>The article it references: Curcio, C. A., Sloan, K. R., Kalina, R. E. &amp; Hendrickson, A. E. (1990). Human photoreceptor topography. <em>Journal of Comparative Neurology, 292</em>(40), 497-523. doi&gt;10.1002/cne.902920402</p>
      <p><strong>Abstract</strong><br>
      “<em>We have measured the spatial density of cones and rods in eight wholemounted human retinas, obtained from seven individuals between 27 and 44 years of age, and constructed maps of photoreceptor density and between-individual variability. The average human retina contains 4.6 million cones (4.08–5.29 million). Peak foveal cone density averages 199,000 cones/mm2 and is highly variable between individuals (100,000–324,000 cones/mm2). The point of highest density may be found in an area as large as 0.032 deg2. Cone density falls steeply with increasing eccentricity and is an order of magnitude lower 1 mm away from the foveal center. Superimposed on this gradient is a streak of high cone density along the horizontal meridian. At equivalent eccentricities, cone density is 40–45% higher in nasal compared to temporal retina and slightly higher in midperipheral inferior compared to superior retina. Cone density also increases slightly in far nasal retina. The average human retina contains 92 million rods (77.9–107.3 million). In the fovea, the average horizontal diameter of the rod-free zone is 0.350 mm (1.25°). Foveal rod density increases most rapidly superiorly and least rapidly nasally. The highest rod densities are located along an elliptical ring at the eccentricity of the optic disk and extending into nasal retina with the point of highest density typically in superior retina (5/6 eyes). Rod densities decrease by 15–25% where the ring crosses the horizontal meridian. Rod density declines slowly from the rod ring to the far periphery and is highest in nasal and superior retina. Individual variability in photoreceptor density differs with retinal region and is similar for both cones and rods. Variability is highest near the fovea, reaches a minimum in the midperiphery, and then increases with eccentricity to the ora serrata. The total number of foveal cones is similar for eyes with widely varying peak cone density, consistent with the idea that the variability reflects differences in the lateral migration of photoreceptors during development. Two fellow eyes had cone and rod numbers within 8% and similar but not identical photoreceptor topography</em>.”</p>
      <p>And some quick web searching:</p>
      <p><a href="http://hyperphysics.phy-astr.gsu.edu/hbase/vision/rodcone.html" title="http://hyperphysics.phy-astr.gsu.edu/hbase/vision/rodcone.html">http://hyperphysics.phy-astr.gsu.edu/hbase/vision/rodcone.html</a></p>
      <p><a href="http://en.wikipedia.org/wiki/Photoreceptor_cell#Humans" title="http://en.wikipedia.org/wiki/Photoreceptor_cell#Humans">http://en.wikipedia.org/wiki/Photoreceptor_cell#Humans</a></p>
      <p>It seems that there simply a finite number of photoreceptors in the human eye. This is not a question of of good or bad science, but human physiology. You can cut an eye open, and count them. If there is something I am misunderstanding, please explain, as this is a topic I am quite interested in (sans line breaks please).</p>
      <p>And if the afore mentioned literature is correct, then obviously issues of rasterization and hinting are moot.</p>
    html_clean: |-
