  html: |-
    <p>I am proposing my thesis topic and could do with some feedback. My aim in the thesis is to critically look at typography in print and on screen, and examine the differences between them focusing on legibility and readability, and perhaps transferring a piece of visual communication in print to screen and see if it captures the viewer the same or creates a completely different feel. I am looking for as much information on the topic and to find professionals who may have applied theories to either print typography or on screen typography. I think it is fairly new topic with the rapid emergence of new technologies and how type can be treated on screen - kinetic type, 3 dimensional etc.<br>
    So if anyone has some opinions or links I can research, I'd really appreciate it.</p>
  html_clean: |-
