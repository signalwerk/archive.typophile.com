      <p>There are some of us for whom the electronic book will never replace the dead-tree versions—at least in our hearts. Unfortunately, this may be simply another example of “If wishes were horses, beggars would ride.”</p>
      <p>American consumer culture appears to be oblivious to the burden-shifting that has been going on with most media. Instead of free television over the airwaves, we pay for internet access to “free” content. Book publishers can forgo the expense of printing books through electronic distribution. And, currently, there’s a move afoot to absolve phone companies from the responsibility of maintaining landlines.</p>
      <p>Virtual reality indisputably has some good things going for it, but they ain’t cheap.</p>
