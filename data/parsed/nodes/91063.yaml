      <p>Here we will have to disagree. Flattening the type into a graphic changes the rasterization model to a graphical one, which leads to bolder type. It also eliminates hinting. At screen resolutions, particularly at smaller sizes, I find these to be objectionable effects.</p>
      <p>However, I'll be the first to concede that some folks prefer this look. But most do not.</p>
      <p>Cheers,</p>
      <p>T</p>
