      <p>"Do you think that highly size-specific rendering (basically simulating a bitmap font) is the way to go, at least for lo-res screens?"</p>
      <p>There is a best way to go, and there is a way to get somewhere, and they are not always the same. I think,the best way to go is to design and hint superpolateable fonts that render like Franky from super hints and can parametrically style for size, width and weight to compensate for everything from background color to dyslexia, but that's not yet the way to go. Clearer, I hope.</p>
      <p>@fontdesigner2 "That's the paradox I was talking about."</p>
      <p>I think that is a superficial paradox, with acdeeper issue being that Adobe font technology is just not engineered to optimize the appearance of every type design for both print and screen from  the same source.</p>
