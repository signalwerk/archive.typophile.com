    html: <p>If a font has poor hinting, it will look poor onscreen but look fine in print. Sometimes design applications change the way a font appears. Photoshop has four different anti-aliasing modes and each one changes the appearance of a font drastically. In Illustrator, if you create outlines, the font suddenly looks better, though it is thicker and darker when printed. Basically, when type is editable, that editablity seems to detract from its looks. The best looking type is the type that cannot be edited or selected or copied anymore. It's been flattened out somehow. Or printed.</p>
