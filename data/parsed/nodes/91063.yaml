    html: |-
      <p>So I finally got a chance to check out an iPad3,<br>
      and even with my 20/15 vision I was impressed.<br>
      Although I can detect a bit of strangeness in the<br>
      text rendering, since I don't expect most people<br>
      to curl up with it for hours and read a book* I have<br>
      to think it must be good enough. The fact that there's<br>
      a lot of real-estate means you can hold it at a decent<br>
      distance** and that makes the resolution effectively<br>
      much higher. So I'm guessing that for a large device,<br>
      above 250dpi is good enough.</p>
      <p>* The emissive nature of the screen is<br>
      still an obstacle I think. In contrast<br>
      e-ink is much kinder.</p>
      <p>** In fact the notable weight means you<br>
      have to rest it somewhere soon enough.</p>
      <p>There are other large devices with high resolution<br>
      already on the market, but my question now is: are<br>
      there any good analyses of when most people will<br>
      start seeing such screens in front of them most of<br>
      the day?</p>
      <p>hhp</p>
