      <p>Seems like an incredibly broad subject matter for a thesis. </p>
      <p>You asked for opinion: The primary differences are 1) resolution and 2) light source.</p>
      <p>As for 1) that's slowly but surely becoming irrelevant (e-ink, retina/high-density iOS devices, etc). As for 2) still a primary difference (reflective vs. projected light) though, again, e-ink is making that a bit less of an issue.</p>
      <p>I'd be interested in a thesis that perhaps looks forward a bit into the not-to-distant future to see where we're going.</p>
