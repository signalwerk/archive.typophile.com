      <p>Speaking of resolution:<br>
      <a href="http://www.flickr.com/photos/aegir/6845170968/sizes/o/in/photostream/" title="http://www.flickr.com/photos/aegir/6845170968/sizes/o/in/photostream/">http://www.flickr.com/photos/aegir/6845170968/sizes/o/in/photostream/</a></p>
      <p>Look at the "N", third line from the bottom. If that "N"<br>
      is large enough to read comfortably, it's also messed up<br>
      to the naked eye. So if you're going to render like a slob,<br>
      you need <em>much</em> higher resolution. You can get away with<br>
      coarser (I mean ~300) resolution if you're mindful of how<br>
      the pixels lay down. You can't have both, no matter how<br>
      many laymen (and rosy-eyed non-laymen) you fool.</p>
      <p>hhp</p>
