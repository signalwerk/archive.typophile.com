      <p>&gt; DTL Letter Modeler.</p>
      <p>DTL Letter Modeler: ah yes, thanks.<br>
      MakeOTF: how smart is it?</p>
      <p>Designing "metaglyph systems" is to drawing glyphs what drawing glyphs is to lettering. I think most people who prefer drawing glyphs over lettering would prefer making systems even more (if/once it's easy and powerful enough). A good litmus test might be: do you enjoy spacing a font?</p>
      <p>hhp</p>
