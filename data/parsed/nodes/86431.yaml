    <p>This has been brought up before, but I'm hoping to<br>
    wrap my head around the state-of-the-art of systems<br>
    that generate fonts [semi-]computationally.</p>
    <p>We have the LettError work, we have MetaFont*, and<br>
    we have this: <a href="http://www.yannickmathey.com/prototyp" title="http://www.yannickmathey.com/prototyp">http://www.yannickmathey.com/prototyp</a></p>
    <p>* <a href="http://typophile.com/node/73827" title="http://typophile.com/node/73827">http://typophile.com/node/73827</a></p>
    <p>Any others?<br>
    Any first-hand experience?</p>
    <p>hhp</p>
