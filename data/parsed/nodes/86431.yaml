    html: |-
      <p>Some more:</p>
      <p><strong>Publicly available programs</strong></p>
      <ul>
      <li><a href="http://www.kalliculator.com/" rel="nofollow">Calliculator</a></li>
      <li>FontChameleon (<a href="http://vimeo.com/groups/historicalfontapps/videos/14758983" rel="nofollow">video</a>) (<em>discontinued</em>)</li>
      <li>Metafont</li>
      </ul>
      <p><strong>Projects</strong></p>
      <ul>
      <li>
      <a href="http://tinkerhouse.net/lettersoup/" rel="nofollow">Lettersoup</a> (<a href="http://river-valley.tv/type-design-strategies-with-free-software/" rel="nofollow">video</a><a>).
      </a></li>
      <li>
      <a href="http://en.red-dot.org/2482.html" rel="nofollow">Type Generator</a> (<a href="http://existentialtype.net/2007/12/16/type-generator/" rel="nofollow">pictures</a>)
      </li>
      <li>
      <a href="http://web.archive.org/web/19990428123213/http://www.cs.huji.ac.il/~arik/LiveType/htmls/LTuseIdx.html" rel="nofollow">LiveType &amp; ParamTT</a> (also, author has written some papers about this)
      </li>
      </ul>
      <p><strong>Other</strong></p>
      <p>There are some papers about parametric/generative font design, usually written by non-designers two or three decades ago. Also, not surprisingly there are patents, and systems which I don't know where to put, such as PANOSE.</p>
      <p>These links are about latin parametric fonts for text. There may be some systems for experimental type that I didn't include and some interesting non-latin systems, I have to check my saved links.</p>
