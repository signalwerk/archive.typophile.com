    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Mittwoch-Poster_5409.png"></div><p></p>
    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/insigne/mittwoch/" rel="nofollow">Mittwoch</a> is an extended modern serif and a new companion to insigne’s <a class="freelinking external" href="http://new.myfonts.com/fonts/insigne/montag/" rel="nofollow">Montag</a> and <a class="freelinking external" href="http://new.myfonts.com/fonts/insigne/dienstag/" rel="nofollow">Dienstag</a> extended sans serifs. Mittwoch conveys a graceful air with its high-contrast letterforms and its ball terminals, but also includes some unique touches that are unexpected for modern faces. Mittwoch includes four different weights and 50 alternate characters, including swashes, more traditional modern letterforms and simplified characters for titling or when a more unique look is needed. For complementary companions, be sure to check out Montag and Dienstag, also available from insigne.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Mittwoch-Poster-2_4303.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Mittwoch-Poster-3_5890.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Mittwoch-Promo-Page_6421.png"></div><p></p>
