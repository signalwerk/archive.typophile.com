      <p>And answering my own question ... 17 for lowercase and 10 for uppercase works quite nicely.  But I’m still not quite decided on whether punctuation should be at the lowercase or uppercase angle.  I’m included to think lowercase so I’ll go with that for now unless it looks totally out of place.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
