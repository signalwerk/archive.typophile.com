    html: <p>Generally speaking I believe that old style italics have many different angles involved, and not just of upper and lower case. For example, in the original Caslon fonts the italic l is generally less sloped than the left leg of the ’n’—and the right leg is steeper than the left. And K is less sloped than the H and on and on.</p>
