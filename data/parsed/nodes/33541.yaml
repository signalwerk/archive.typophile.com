    <p>I’ve noted in a lot of my older Spanish texts the capital italic is less angled than the lowercase.  It’s an effect I quite like, but I’ll be damned if I can’t get it to look right in my own tests.  My lowercase angle is 17 degrees, and I first tried 12-13 for the uppercase, but it’s not different enough.  Going much straighter though and it doesn’t seem much different from an ever-so-slightly oblique of the roman.</p>
    <p>What are some successfull set ups y’all have found?  Should punctuation and symbols follow the same angle as the lowercase or the uppercase?  Also, do y’all think it’s a good idea if doing the differently-angled uppercase to include a stylistic set at the original angle for those who prefer everything to fall over the same?</p>
    <p>I could have sworn I’ve seen this talked about somewhere but neither google nor the forum search pulls up much for advice on this.</p>
