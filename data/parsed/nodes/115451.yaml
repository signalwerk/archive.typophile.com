      <p>Thanks! I did look at some of the pi fonts, but ones like you mention and ones like Symbol have prime marks that really don't fit well with a transitional roman... at least not Electra.  </p>
      <p>I've managed to find TWO fonts that may work, neither of which I own, Arno Pro and Lapis Pro. </p>
      <p>I'll have to keep looking...</p>
