    <p>I'm currently setting something using Electra and have a short passage with prime marks. </p>
    <p>I'm wondering if anyone has made a list of serif fonts with decent prime marks?</p>
    <p>So far I've tried Californian Pro, Palatino, Times... even Sim Hei Regular. Nothing seems to complement Electra. </p>
    <p>Any suggestions?</p>
