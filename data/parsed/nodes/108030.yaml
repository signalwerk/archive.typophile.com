    html: <p>I might be able to help, but I will need more details about the font (such as how the glyphs are named, what OpenType features you are trying to add, and anything else that may be pertinent), along with more details about what precisely doesn't work in MS Word. Also, I should point out that MS Word is a good example of poor heuristics, meaning that there are much better applications to use for determining whether you have a well-structured font. Adobe InDesign comes to mind, and I don't say that because I work at Adobe.</p>
