  html: <p>I generate my Japanese font in Fontlab Studio 5.2, with VOLT data, then open the font in VOLT, recompile it to get it to work in Word 2010. But then, I can't type any Japanese characters (kana and kanji) with my font, although all ligatures work well. I just added some minor changes into my font to ease my typing, not created in the first place, but it seems that I have to manually re-add the features in VOLT. That's an awful lot of work and a bloody pain. Is there anything else I can do to add OpenType features into a font and to get it to work in Word?</p>
  html_clean: <p>I generate my Japanese font in Fontlab Studio 5.2, with VOLT data, then open the font in VOLT, recompile it to get it to work in Word 2010. But then, I can't type any Japanese characters (kana and kanji) with my font, although all ligatures work well. I just added some minor changes into my font to ease my typing, not created in the first place, but it seems that I have to manually re-add the features in VOLT. That's an awful lot of work and a bloody pain. Is there anything else I can do to add OpenType features into a font and to get it to work in Word?</p>
