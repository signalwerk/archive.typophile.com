    date_raw: 7 Jan 2014 — 9:37am
    votes: null
    html: "<p>The font is originally an OpenType font that has the OTF extension and with TrueType outlines (and its name is Iwata Antic Std / イワタアンチックStd, if this'd help). Many special characters are mapped at the Private Use Area, so I wanted to add some \"code-like\" ligature features, something like shortcuts, to ease my typing. I'm not quite sure about how the glyphs are named: I opened it with FontCreator and they got no names, while Fontlab Studio names them somehow \"cid1, cid2, cid3,...\", maybe by their codepoints. As I told you, the font must never work if I just generate them from Studio (due to the lack of DSIG table), so I have to recompile it with VOLT. The ligatures work, but then, I can't type ANY Japanese characters like Kanji and Kana in Word. The damn program just use the default font (MSMincho) for these classes of letters. I can add a dummy DSIG table instead, but again there's another problem: the ligature feature works, but the vert feature doesn't, and I can't rotate the prolonged sound mark (ー). And I know Adobe programs support OpenType features very well, very very well indeed, and that's why I could never be sure if my fonts really work just using them. Adobe doesn't provide every software I need, so testing fonts on Word is the only way I can know if my fonts would work well with other softwares, non-Adobe softwares, I guess. I can send you the original font, the Studio file if you need, but would that violate any terms of use, or even worse, resource licensing?</p>"
    html_clean: "<p>The font is originally an OpenType font that has the OTF extension and with TrueType outlines (and its name is Iwata Antic Std / イワタアンチックStd, if this'd help). Many special characters are mapped at the Private Use Area, so I wanted to add some \"code-like\" ligature features, something like shortcuts, to ease my typing. I'm not quite sure about how the glyphs are named: I opened it with FontCreator and they got no names, while Fontlab Studio names them somehow \"cid1, cid2, cid3,...\", maybe by their codepoints. As I told you, the font must never work if I just generate them from Studio (due to the lack of DSIG table), so I have to recompile it with VOLT. The ligatures work, but then, I can't type ANY Japanese characters like Kanji and Kana in Word. The damn program just use the default font (MSMincho) for these classes of letters. I can add a dummy DSIG table instead, but again there's another problem: the ligature feature works, but the vert feature doesn't, and I can't rotate the prolonged sound mark (ー). And I know Adobe programs support OpenType features very well, very very well indeed, and that's why I could never be sure if my fonts really work just using them. Adobe doesn't provide every software I need, so testing fonts on Word is the only way I can know if my fonts would work well with other softwares, non-Adobe softwares, I guess. I can send you the original font, the Studio file if you need, but would that violate any terms of use, or even worse, resource licensing?</p>"
