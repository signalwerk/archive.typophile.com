    html: '<p>If you want to modify or add glyphs, the mergeFonts command-line tool in our <a class="freelinking external" href="http://www.adobe.com/devnet/opentype/afdko.html" rel="nofollow">AFDKO</a> would be the best way to replace or add glyphs in a CID-keyed font. Adobe Tech Note #5900, which is included in AFDKO, is a tutorial that includes coverage of the mergeFonts tool. There is a learning curve, but what you want to do is possible. I can do some hand-holding, if necessary, in terms of outlining specific steps you need to follow. The first order of business would be for you to install AFDKO.</p>'
