    html: |-
      <p>First and foremost, you should confirm that the font's license allows the end user (you) to modify the font for private use. I am familiar with Iwata's fonts, but I do not know the terms of their license.</p>
      <p>Anyway, assuming that modifying the font is allowed by the license, it seems that you're simply trying to add new substitutions, either to an existing GSUB feature or as a new one, to the 'GSUB' table. For this task, there is no need to completely open the font in a font editor. The font is CID-keyed, as evidenced by the glyph names that you see ("cid" followed by one or more digits), and very few commercial font editing apps are able to export such fonts correctly.</p>
      <p>The better approach, in my opinion and experience, would be to decompile the 'GSUB' table into an editable form, such as by using <a class="freelinking external" href="http://sourceforge.net/projects/fonttools/" rel="nofollow">ttx</a>. The process would be to decompile the table, which is in the form of an XML file, make the necessary additions, then recompile the XML into the original OpenType font. This invalidates the 'DSIG' table, so including a "stub" table, as you suggest, would be good.</p>
