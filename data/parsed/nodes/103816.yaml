    html: |-
      <p>Fuzzy image, serif details ambiguous. Anyway, it's a condensed Bodoni. Choice of several with minor variation in detail.  A well designed one is R.H. Middleton's <a href="http://www.myfonts.com/fonts/redrooster/bodoni-rr-campanile/" rel="nofollow">Bodoni Campanile</a> for Ludlow 1936 as digitized by Red Rooster, also available from Bitstream as <a href="http://www.myfonts.com/fonts/bitstream/modern-735/" rel="nofollow">Modern 735</a>.<br>
      Don</p>
