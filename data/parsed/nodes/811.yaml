  html: "<p>just thought I'd post about an annual con that happens in our hood...don't think it does get publicized much outside. anywho..there's a seminar -  Reconceptualizing typography - Presented by Prof. Ian Noble...never heard of him. hmmm <br> <br>Designthinkers 2003 - Oct. 2 to 3, Toronto  <br> Each year Designthinkers explores the influences and trends shaping the <br> role of design and branding in the marketplace. We look forward to <br> welcoming design practitioners, managers, educators and students, <br> marketing and branding executives and other buyers of graphic design <br> services to RGD Ontario's 4th annual conference on communications and <br> graphic design. The theme this year is Innovation. Innovation is a key <br> factor in business success. It's also at the heart of good design. Join <br> us as our speakers initiate a dialogue on the nature and process of <br> innovation.  <br> <br> Mornings - diverse experts address the entire audience of approximately <br> 500 delegates: <br> Paula Scher - Founding partner at Pentagram <br> Simon Waterfall - Creative director of British new media firm Poke <br> James P. Cramer - Editor of DesignIntelligence <br> Elsie Maio - corporate branding visionary who developed the concept of <br> SoulBranding SM <br> Dr. John Kao - serial innovator who wrote Jamming: The Art and <br> Discipline of Business Creativity <br> Roger Martin - Dean of the Joseph L. Rotman School of Management at the <br> University of Toronto <br> <br> Afternoons - interactive question and answer sessions with the above <br> speakers moderated by Pamela Young, editor of Applied Arts Magazine or <br> Best Practices presentations: <br> Reconceptualizing typography - Presented by Prof. Ian Noble <br> A survivor's guide to the design business - Presented by Jean-Pierre <br> Lacroix R.G.D. <br> New tips and techniques in Adobe software - Presented by Colin Smith <br> Trends in business reporting (Speaker to be announced) <br> The future face of the design world - Presented by Bill Buxton <br> Communicating design - Presented by Nancy Bernard <br> <br> Register on-line now! <br> To register on-line on a secure server , go to <br> <a href=\"https://www.hyperweb.ca/designthinkers.htm\" target=\"_blank\">https://www.hyperweb.ca/designthinkers.htm</a>. For more info, visit <br> <a href=\"http://www.designthinkers.com\" target=\"_blank\">www.designthinkers.com</a> &lt;<a href=\"http://www.designthinkers.com\" target=\"_blank\">http://www.designthinkers.com</a>&gt; .  <br></p>"
