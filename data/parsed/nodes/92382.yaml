    html: |-
      <p>I would use the leading that best suits the caption size, rather than try to align the captions and the text on the same baseline grid.<br>
      Here's why: The captions should have a stronger visual connection to the art or photos they describe than to the adjacent text column. Also, I would want the flexibility to scale and crop art and photos however they work best. I wouldn't want to have to scale or crop them to line up with the text baseline grid, just for the sake of aligning the captions.</p>
