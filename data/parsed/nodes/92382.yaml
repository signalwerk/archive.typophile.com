    <p>When placing a caption beside body copy what is the general rule of thumb? Should they both have the same leading? For example, my body copy is 7pt with 9pt leading should I set the caption to 6pt with 9pt leading? see attached sample. Thanks.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/cap-size1_4414.jpg"></div><p></p>
