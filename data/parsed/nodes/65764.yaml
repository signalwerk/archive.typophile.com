      <p>I always recall something a photography teacher used to say, paraphrased:</p>
      <p>"Composition is largely a value problem"</p>
      <p>And by value he meant the range of darks to lights. Your main issue here is that your background is so distracting, it's a heavily contrasted background that uses the same shapes, space, and value as the type; sure eliminating the background completely will also work but there's other approaches:</p>
      <p>- Redo the background color palette to use colors of closer value<br>
      - Enlarge the type<br>
      - Reduce the size of the background so that it appears as a tighter pattern<br>
      - Increase the stroke on the type and/or decrease the stroke on the background</p>
