    <p>I've been working on a personal New Years card, but seem to be stuck.<br>
    I started with a simple grid (which explains the bad kerning ;-)) &amp; did some custom type &amp; patterns. I'm quite happy with all the seperate elements, but have no idea what to do with them.<br>
    I like the custom type I did for 'the new year' but I obviously can't use it as it is 'cause it wouldn't make much sense on its own. I tried to spell 'Best wishes for the new year' but couldn't make it all look good together.<br>
    Since I liked the flipped 'Best wishes' I figured I could translate an ambigram I did of my name once to the same grid as a signature (so everything could be read upside down as well) but it seems unbalanced.<br>
    Any help would be greatly appreciated since I can feel the deadline breathing down my neck ;-)</p><div class="imageWrap"><img src="http://typophile.com/files/NY_6561.gif"></div><p></p>
