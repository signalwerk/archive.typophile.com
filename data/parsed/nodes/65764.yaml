      <p>I'm finding it hard to read, especially with the way you have the shape laid out behind "Best Wishes." I find because there's some whitespace in the middle of the W that I want to break the word there, and then again where the other breaks in the background are. I think you could use the background fill shape to help make the words more legible, by adding space in the background between the letters and keeping the background solid beneath the words. This could also work vertically on "the New Year." I think giving a bit more leading to the words there would help increase legibility.</p>
      <p>I understand the desire to make an ambigram work, but in this case, with the already tough to read lettering, I think an ambigram just adds a whole lot more confusion to the mix.</p>
      <p>I do like the type you've created, and I really like the backgrounds you've got going as well. I just think overall it's becoming a bit busy and confusing and working on stuff to help organize things, like the solid background shape, would help.</p>
      <p>Huh. Looking at the date on this, I'm thinking there's a chance you've already completed the project, but I thought I'd post my replay anyways.</p>
