  html: |-
    <p>Hello. This is my first post here, pardon for my bad english.</p>
    <p>I am working on a logotype for "the darth vader heritage foundation" (student project).<br>
    The brief talks about vader as a "tragic hero". This is most important guideline to build the logotype.</p>
    <p>I have built 2 versions of the word "anakin" (both were once garamond regular) - one for the more "formal" side of the institution and the other for the dark process vader had gone through to become the dark lord and become my tragic hero.</p>
    <p>Thank you for your comments.</p>
