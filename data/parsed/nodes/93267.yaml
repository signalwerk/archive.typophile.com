    html: |-
      <p>In the case of nouvelle vague the fonts are named after a film style. I think there is generally a difference between copying original names and copying names that borrow from something else, especially if your inspiration doesn't come from the other font. Similarly, one could call a font Flutter or Tilapia (which are tracks by Autechre) without any problems, but I'd be more cautious with calling it Maphive 6.1.<br>
      Karl Stange, I'm curious to know what track name's this person was thinking of. Nothing particularly fitting comes to mind. (Except maybe The Egg as an alt. name for Hobo.)</p>
