      <p>Trademark doesn't need to be registered and can be based solely on established usage in the marketplace, and note that marketplace in this instance doesn't imply commercial: a free font name can still be considered a trademark, since the purpose of trademarks is to avoid confusion of products and providers in the marketplace. So if you introduce a product with the same name into the marketplace, that may be considered trademark violation, regardless of whether the other product is commercial or free. Whether the maker of the free font would take the time and expense to defend the trademark by bringing a lawsuit against you is another matter. Perhaps more to the point though is that you might have trouble claiming the trademark for yourself, since there is established prior use in the marketplace.</p>
      <p>As a general rule: when in doubt about such a question ask a lawyer, not a bunch of typographers on the interwebs.</p>
      <p>[Disclaimer: I am not a lawyer, and the above is not offered as legal advice.]</p>
