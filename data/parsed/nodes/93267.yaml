      <p>The legality is likely to be an issue if the name has been trademarked but others here would be able to give you more feedback on that. A bigger concern should probably be confusion as you would immediately find yourself potentially losing focus on your typeface in favour of the other one available.</p>
      <p>I remember a comment made elsewhere on this site about the possibility of naming typefaces after Autechre track names and I think 65daysofstatic and Godspeed You! Black Emperor would be fertile territory for similar inspiration, just in the field of music; literature, art or a copy of the OED (or perhaps rather ADL) would prove just as inspirational. I am not suggesting that you should abandon your considered name but there are so many unexplored possibilities and something unique is likely to be beneficial in drawing attention to your font.</p>
