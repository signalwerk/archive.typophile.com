      <p>Karl’s advice is sound. Forget about legality: why muddy the water and create confusion for potential buyers? I know from personal experience—I recycled one of my own freeware font names and used it for a commercial release—that the process can produce a few unhappy campers.</p>
      <p>A quick Google search suggests that the name “Megawatt” isn’t being currently used for a typeface; use it—or something like it—instead. Same basic idea, lots more punch…</p>
