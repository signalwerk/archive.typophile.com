  html: <p>Im looking for some type to go with this logo i created in class. The company is a non profit for young adults to get more involved in science/research.  <br> <br>Im looking for fonts that are scientific, fun, or modern, or any combo thereof. I already have some ideas... but im always amazed at the type i discover thanks to this website, and the people on it.  Thanks for your help! <br> <br> <br><img src="http://www.typophile.com/forums/messages/4100/68172.gif" alt=""></p>
