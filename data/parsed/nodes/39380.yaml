  html: |-
    <p>I’ve recently noticed working in Illustrator that when using a text block from a font that contains components that overlap, eg. Ccedilla … sometimes when zooming in and out briefly you can see that the overlap space between shapes flash’s white, basically ’inverting’ the overlap shape.</p>
    <p>Is this just an occurence with overlapping components in Illustrator? Is there a step in the process to merge a component and glyph before or during export?</p>
