    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;:&nbsp;Century</strong></p>
    <p>Theodore Low DeVinne (1829—1914), printer of The Century magazine, designed a stronger, bolder and more readable face for the magazine and commissioned Linn Boyd Benton (1844—1932) of <span class="caps">ATF</span> to cut&nbsp;it.</p>
    <p><span class="caps">L.B.</span> Benton cut it on the newly invented Benton punch-cutting machine and in 1895 was christened Century Roman. Afterwards, a companion face was created for <span class="caps">ATF</span> by <span class="caps">L.B.</span> Benton: Century no. 2, later called Century&nbsp;Broad-face. </p>
    <p>This face became the basis for Century Expanded, designed by L.B.’s son, <a href="/node/13617" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Morris Fuller Benton</a> (1872-1948) in 1902. Over the course of three more years, the italic, bold and bold italics were&nbsp;developed.</p>
    <p>Then after a few more years, Morris Fuller Benton developed Century Oldstyle.<br>
    In 1915, redevelopment of Oldstyle face began and was renamed Century Book.<br>
    Soon after, <span class="caps">ATF</span> was approached by Ginn <span class="amp">&amp;</span> Co., the textbook publisher, with a request for a new typeface for schoolbooks. <span class="caps">M.F.</span> Benton began review of research done at Clark University on the relationship between the legibility of type and the eyesight of&nbsp;children.</p>
    <p>Consequently, Benton increased the space between letters, the x-height of each letter, and the weight of each stroke, and balanced the color of the type by opening up the counters. The result was Century Schoolbook, completed in&nbsp;1919.</p>
    <p>In 1964 <span class="caps">ATF</span> commissioned <a href="/node/add/wiki?edit%5Btitle%5D=Charles%20E.%20Hughes" title="Create node &quot;Charles E. Hughes&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Charles E. Hughes</a> to design a new proportion for Century Expanded… the result, Century Nova, which was more&nbsp;condensed.</p>
    <p>Under license from <span class="caps">ATF</span>, <a href="/node/13401" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Tony Stan</a> designed the sixteen weight <span class="caps">ITC</span> Century family between 1975 and 1980 for International Typeface Corporation. It has the characteristic large x-height of 70s era <span class="caps">ITC</span> fonts. Some differences from Century are the missing serif on the lowercase h, m, n in the <span class="caps">ITC</span>. One view of <span class="caps">ITC</span> Century is that its color is not good at smaller text sizes, but its light weight is excellent at larger text sizes (eg 14 pt), especially the&nbsp;italic.</p>
    <p>New Century Schoolbook was designed 1979-81 in the New York Lettering office of Merganthaler Linotype, based on Century Schoolbook. It was the second face, after <a href="/node/add/wiki?edit%5Btitle%5D=New%20Baskerville" title="Create node &quot;New Baskerville&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">New Baskerville</a>, that was digitized and expanded using <a href="/node/12225" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Ikarus</a> (digital technology). The <a href="/node/13429" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bitstream</a> version is a near exact copy, only being moved from a 54 unit to a 2000 or so unit design. <a href="/node/13520" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Matthew Carter</a> designed the Greek version of New Century&nbsp;Schoolbook.</p>
    <p>A recent, somewhat eccentric version of Century School Book is Grad by <a href="/node/17360" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Phil Martin</a>, digitized by <a href="/node/15527" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mark Simonson</a>.</p>
