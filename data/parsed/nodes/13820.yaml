    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Century</strong></p>
    <p>Theodore Low DeVinne (1829—1914), printer of The Century magazine, designed a stronger, bolder and more readable face for the magazine and commissioned Linn Boyd Benton (1844—1932) of ATF to cut it.</p>
    <p>L.B. Benton cut it on the newly invented Benton punch-cutting machine and in 1895 was christened Century Roman. Afterwards, a companion face was created for ATF by L.B. Benton: Century no. 2, later called Century Broad-face. </p>
    <p>This face became the basis for Century Expanded, designed by L.B.’s son, <a href="/wiki/Morris%20Fuller%20Benton" class="freelinking" rel="nofollow">Morris Fuller Benton</a> (1872-1948) in 1902. Over the course of three more years, the italic, bold and bold italics were developed.</p>
    <p>Then after a few more years, Morris Fuller Benton developed Century Oldstyle.<br>
    In 1915, redevelopment of Oldstyle face began and was renamed Century Book.<br>
    Soon after, ATF was approached by Ginn &amp; Co., the textbook publisher, with a request for a new typeface for schoolbooks. M.F. Benton began review of research done at Clark University on the relationship between the legibility of type and the eyesight of children.</p>
    <p>Consequently, Benton increased the space between letters, the x-height of each letter, and the weight of each stroke, and balanced the color of the type by opening up the counters. The result was Century Schoolbook, completed in 1919.</p>
    <p>In 1964 ATF commissioned <a href="/wiki/Charles%20E.%20Hughes" class="freelinking" rel="nofollow">Charles E. Hughes</a> to design a new proportion for Century Expanded… the result, Century Nova, which was more condensed.</p>
    <p>Under license from ATF, <a href="/wiki/Tony%20Stan" class="freelinking" rel="nofollow">Tony Stan</a> designed the sixteen weight ITC Century family between 1975 and 1980 for International Typeface Corporation. It has the characteristic large x-height of 70s era ITC fonts. Some differences from Century are the missing serif on the lowercase h, m, n in the ITC. One view of ITC Century is that its color is not good at smaller text sizes, but its light weight is excellent at larger text sizes (eg 14 pt), especially the italic.</p>
    <p>New Century Schoolbook was designed 1979-81 in the New York Lettering office of Merganthaler Linotype, based on Century Schoolbook. It was the second face, after <a href="/wiki/New%20Baskerville" class="freelinking" rel="nofollow">New Baskerville</a>, that was digitized and expanded using <a href="/wiki/Ikarus" class="freelinking" rel="nofollow">Ikarus</a> (digital technology). The <a href="/wiki/Bitstream" class="freelinking" rel="nofollow">Bitstream</a> version is a near exact copy, only being moved from a 54 unit to a 2000 or so unit design. <a href="/wiki/Matthew%20Carter" class="freelinking" rel="nofollow">Matthew Carter</a> designed the Greek version of New Century Schoolbook.</p>
    <p>A recent, somewhat eccentric version of Century School Book is Grad by <a href="/wiki/Phil%20Martin" class="freelinking" rel="nofollow">Phil Martin</a>, digitized by <a href="/wiki/Mark%20Simonson" class="freelinking" rel="nofollow">Mark Simonson</a>.</p>
