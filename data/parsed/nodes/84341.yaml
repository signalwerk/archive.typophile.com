    html: |-
      <p>Thanks, everyone, for the comments and criticism.</p>
      <p>First, allow me to clarify my experience when it comes to design and typography. I am not a designer by trade, but I have been involved in design work and the design process for many years. This has mostly been for my own record label, but the odd thing here and there for other people too. It's been trial an error learning.</p>
      <p>In all honesty, there wasn't much thought that went into the new design shown above - I simply put it there to gather some initial thoughts.</p>
      <p>JamesM - I hear you about shading etc. I wasn't really referring to cost. Just that I wouldn't like to 100% rely on shading or colour - somehow seems like a bit of a cheat or less purist or something. Will certainly consider it, though.</p>
      <p>Frode Frank - random chance? Not really. The current logo actually went through a design process and, were the company still focused on the same business activities, I'd still be quite satisfied with it. I'd maybe change the font and adjust some proportions, but fundamentally, it does and says what I want. The new logo - as I mentioned above - it was really just a starting point to see if it's worth continuing with the idea current logo, or whether I should go down a different route. Just sort of feeling my way at the moment. I would love to hire a designer I loved, even just to get another viewpoint, but we don't have the funds for that. (and to answer your question: no I don't pull in nitwits to handle our recordings, I do it all myself from recording to release.) However, despite design/type not being my official trade, I feel I am quite savvy to both and am happy to make a go of it myself - with a little help of people like you on forums such as this.</p>
      <p>Luma Vine  - yes, I've been giving the concept some thought. The genres of music on the label will become more diverse in the coming years, so that makes it hard to pin down a look. We're not really a gimmicky label, and not tied to one specific genre. The name still works for us - suggesting a faithful, natural representation of the original sound. An image alone is tricky. So many of the things that suggest "recording" have already been used by other labels. I have been experimenting with spirals, a reference to records/vinyl/CDs, and there may be something in that. Interestingly, though - almost all the labels I really admire don't have an image at all - <a class="freelinking external" href="http://www.ecmrecords.com" rel="nofollow">ECM</a>, <a class="freelinking external" href="http://www.nonesuch.com" rel="nofollow">Nonesuch</a>, <a class="freelinking external" href="http://www.runegrammofon.com" rel="nofollow">Rune Grammofon</a>, and the ones that do have logos, I think they're terrible designs. Perhaps it is because with simple text, it's easier to seem more generic? The logo is able to suit all the different types of music.</p>
      <p>Thanks again and keep the comments coming - it's really helping!</p>
