      <p>It sounds like we have different ideas as to what the design process is.  Here is my outline:</p>
      <p>Research &amp; briefing<br>
      Brainstorming<br>
      Sketching<br>
      Computer rendering</p>
      <p>That along with a heavy dose of feedback where you jump to a previous stage to work out new ideas.  But to me it sounds like you jumped to the last stage.</p>
      <p>I would definitely avoid trying to represent 'recordings'.  That is not what makes you unique, it is what makes you exactly like every one of your competitors, you all make recordings.</p>
      <p>A big question that needs to be answered in the brief is whether you are a recording studio or a record label.  Maybe there is some precedent, but I don't know of any brand that exists publicly as both.</p>
      <p>I do get the idea of covering many genres, but I think there is still something that ties it all together.  The last thing you want is to be generic.  This is where some good research and brainstorming are essential.</p>
      <p>Hope that helps.</p>
