      <p>My first reaction is that if you're going to put both words on one line with no break, you need to have a greater difference in style between the 2 words. I know you have a difference in weight, but to me it's slightly too subtle. Maybe putting one word in a different color or shade would help.</p>
      <p>Another option -- if you decide to keep the headphones -- is to make both words the same style but separate them by putting the headphones between them. Maybe a black or colored circle that's slightly bigger than the headphones with the headphones reversed out of the circle in white.</p>
