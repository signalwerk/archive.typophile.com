    <p>Hello,</p>
    <p>I was recently checking out how some companies' logos have <a class="freelinking external" href="http://designslounge.com/2011/07/corporate-logo-evolution-part-one/" rel="nofollow">evolved over the years</a>, and I'm starting to feel that perhaps we need a new logo. For the past 7 or 8 years, we have used this:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ns_current_3932.png"></div><p></p>
    <p>It has, essentially, remained exactly the same throughout the years. (Though, I think I changed the height of the headphones a couple of years ago.) It uses ITC Avant Garde Gothic Condensed, which I vertically shrunk down to 80% of original. The headphones are from Audio Pi and I shrunk the height of that also (75%).</p>
    <p>Anyway, a few minor kerning issues aside, I'm still rather fond of the logo and it has served us well for a good many years. However, I am beginning to feel it misrepresents the company's current activities. When I designed the logo, we were actually mostly known for our sampled instruments (VSTi), so it wasn't really a record label at all. Since then, the recording side of the company has really taken over and the sampled instrument side of things is dormant.</p>
    <p>The record label's catalogue is fairly diverse, but it is tied together by a common aesthetic of clean recording, attention to detail, and natural sound presentation. All our releases are of classical and acoustic music.</p>
    <p>In the current logo, I like that the headphones show that we are somehow music related, but I think it perhaps suggest that we are an dance/electronica label, especially coupled with a font like Avant Garde. Would you agree? Do you think a new logo would be a good idea?</p>
    <p>I'm currently toying with dropping the headphones, and have been endlessly searching for a new font. Thinking of this:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ns_new-idea1_4737.png"></div><p></p>
    <p>I don't want to completely lose the identity we have established with the old logo. I toyed with "natural" in a serif font and "studio" in a sans, but I think it looks a bit tacky. Also, thinking about "NSR", but that seems to generic.</p>
    <p>Any thoughts? I'm at the early stages here, so it would be great to get some feedback.</p>
    <p>Cheers,</p>
    <p>Douglas.</p>
