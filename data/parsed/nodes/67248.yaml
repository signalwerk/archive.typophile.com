    html: |-
      <p>The Cormack McCarthy book looks like honest-to-goodness woodtype blocks, probably flipped horizontally after photography. It's a whole bunch of different faces.</p>
      <p>The Michael Winter book looks like a font since the distress on all repeated letters is the same. It looks like there might be two different 'E's; one thick, one thin; so it might be OpenType enabled or even have uppercase letters in the lowercase set.</p>
      <p> - Lex</p>
