      <p>Poplar, HFJ Knockout &amp; HFJ Knockout are all good woodblock type fonts, but the above is obviously (hand made?) of several different typefaces, so you'll just have to experiment.<br>
      There are a lot of these typefaces out there, <a class="freelinking external" href="http://new.myfonts.com/search/woodtype/fonts/" rel="nofollow">here</a> are some.</p>
