    html: |-
      <p>The one for "IRISH WHISKEY" is their own corporate typeface simply called "<a href="http://typophile.com/node/97442" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Jameson</a>" and designed by Robert Stradling, Stradfonts.<br>
      Nameplate "JAMESON" is, as almost all (alcohol) woodmarks, a custom lettering. Some in the same vein: <a href="http://www.myfonts.com/fonts/parkinson/modesto" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Modesto</a>, <a href="http://www.letterheadfonts.com/fonts/hensler2.php" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Hensler 2</a>, <a href="http://www.myfonts.com/fonts/gatf/chipping/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Chipping</a>, <a href="http://www.myfonts.com/fonts/gatf/mexborough/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Mexborough</a>, <a href="http://www.myfonts.com/fonts/gatf/chipperly/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Chipperly</a>, <strong><a href="http://www.myfonts.com/fonts/itc/symbol/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Symbol</a></strong>, <a href="http://www.myfonts.com/fonts/berthold/agora-bq/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Agora</a></p>
