    date_raw: 12 Mar 2013 — 4:01am
    votes: null
    html: <p>I think the caps lettering "TRIPLE DISTILLED..." is the same font "Jameson" but the light style (looks like I can see some tiny serifs). If I have to replace it, I would probably go with <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/benton-sans/" rel="nofollow">Benton Sans</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/griffith-gothic" rel="nofollow">Griffith Gothic</a>, some Franklin Gothic with a vintage feeling.</p>
