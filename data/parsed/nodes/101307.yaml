    html: |-
      <p>The one for "IRISH WHISKEY" is their own corporate typeface simply called "<a class="freelinking external" href="http://typophile.com/node/97442" rel="nofollow">Jameson</a>" and designed by Robert Stradling, Stradfonts.<br>
      Nameplate "JAMESON" is, as almost all (alcohol) woodmarks, a custom lettering. Some in the same vein: <a class="freelinking external" href="http://www.myfonts.com/fonts/parkinson/modesto" rel="nofollow">Modesto</a>, <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/hensler2.php" rel="nofollow">Hensler 2</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/gatf/chipping/" rel="nofollow">Chipping</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/gatf/mexborough/" rel="nofollow">Mexborough</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/gatf/chipperly/" rel="nofollow">Chipperly</a>, <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/itc/symbol/" rel="nofollow">Symbol</a></strong>, <a class="freelinking external" href="http://www.myfonts.com/fonts/berthold/agora-bq/" rel="nofollow">Agora</a></p>
