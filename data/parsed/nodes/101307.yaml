    html: <p>I think the caps lettering "TRIPLE DISTILLED..." is the same font "Jameson" but the light style (looks like I can see some tiny serifs). If I have to replace it, I would probably go with <a href="http://www.myfonts.com/fonts/fontbureau/benton-sans/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Benton Sans</a> or <a href="http://www.myfonts.com/fonts/fontbureau/griffith-gothic" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Griffith Gothic</a>, some Franklin Gothic with a vintage feeling.</p>
