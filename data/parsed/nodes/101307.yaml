    <p>If anyone can help identify the fonts on this label I would appreciate it. I think the Irish Whiskey is a copperplate of some sort and maybe the 40% etc is Baskerville but the script and the Triple distilled… caps are beyond me.</p>
    <p>Thanks</p>
