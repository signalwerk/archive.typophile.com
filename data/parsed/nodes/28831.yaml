      <p>Just a further historical note: &amp; is a ligature (not an abbreviation) for e+t, long in use both for 'and' and as part of any other word, e.g. 'proph&amp;a'. It first became usual in late Roman cursive (ca 3rd cent. AD), but it really became something special in 8th- to 12th-cent. Caroline minuscule, when the many other old ligatures in existence were discarded except for that one. It then disappeared from 13th-cent. gothic scripts, only to be restored in 15th-cent. humanistic writing.<br>
      Yours &amp;c.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/perluet_6356.gif"></div><p></p>
      <p>PS I hadn't read the Adobe history of the ampersand page yet. Don't believe too much of what you read there.</p>
