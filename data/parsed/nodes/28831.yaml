    date: 2006-10-16T22:06:00
    votes: null
    html: |-
      <p>Never before have I heard someone call the ampersand punctuation (which may well be because I'm not really anglophone and because the meaning of <em>punctuation</em> is different from the German <em>Interpunktion</em>), but Google tells me that this interpretation isn't as abnormal as I would've thought.</p>
      <p>I'd agree, though, that the ampersand isn't a word and shouldn't be used as such.</p>
      <p>The ampersand is undoubtedly a ligature. A ligature without a surrounding word. Hence, I'd call it a standalone ligature.</p>
      <p>In terms of where to use it properly, I'd spontaneously compare it (loosely) to a titling "The" with Th ligature: in many typefaces too uncommon looking a ligature, IMHO, to be appropriate for running text, but nice to have for titles and logos (or wherever type bears a strong graphic aspect).</p>
      <p>In terms of intrinsic meaning, the ampersand is no substitute for an ordinary "and". I'd never use it like <em>"I was terribly jetlagged &amp; slept for thirty hours"</em> (much like I'd never use the + sign in text context). Instead, the ampersand is a way to express that things or persons are strongly linked and form a unity; it's used mainly in formal, soigné or festive context. (Personally, I wouldn't be overly hesitating to use a beautiful ampersand in "Merry Christmas &amp; a Happy New Year" if the words were set in a designed arrangement and not running text.)</p>
      <p>When the ampersand is used in corporate names (<em>"... introduced us to Mr. Frederick Fine from Fine &amp; Dandy..."</em>), it becomes, in my eyes, part of a (typo)graphic unit that shouldn't be disintegrated (into <em>"Frederick Fine from Fine and Dandy"</em>) without necessity.</p>
      <p>Please note that this is my German point of view. In other languages, the use of the ampersand might be different (although I can't recall to have seen the ampersand used in contemporary English or French as an arbitrary substitute for the word "and").</p>
      <p>jpg</p>
