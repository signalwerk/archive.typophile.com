    html: |-
      <p>On the other hand, since Latin doesn't have nearly enough symbols to begin with, it's much better if/when the ampersand doesn't look like E/e+t. Same with the @: the less the inside looks like an "a" the better.</p>
      <p>BTW, that wiki says the ampersand sometimes appears (more like used to appear) as the last letter of the alphabet, and that reminds me to mention that in Armenian the "yev" (a ligation of yetch and hyoun - the latter often called "bzdig vuh" = "little v") which means "and" is quite often placed before the last two letters of our alphabet. There are two reasons for this: the last two letters (oh and feh) were added later (to better accomodate foreign names); and it makes the number of letters divisible by three, which makes reciting the alphabet sound better. The bad news is that this -along with the timeless facilitative advantages of ligatures, and the fact that the yev is indeed elementally letters- causes many people to use the yev as actual letters in words. Imagine "h&amp;y" in English for comparison...  :-/</p>
      <p>hhp</p>
