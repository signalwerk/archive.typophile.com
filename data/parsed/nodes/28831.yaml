    html: |-
      <p>To add to the +: </p>
      <p>Nicole d' Oresme (1323-1382) may have used a figure which looks like a plus symbol as an abbreviation for the Latin et (meaning "and") in Algorismus proportionum, believed to have been written between 1356 and 1361. The symbol appears in a manuscript of this work believed to have been written in the fourteenth century, but perhaps by a copyist and not Oresme himself. The symbol appears, for example, in the sentence: "Primi numeri sesquiterti sunt .4. et .3., et primi numeri sev termini sesquialtere sunt .3. et .2." [Dic Sonneveld].</p>
      <p>The plus symbol as an abbreviation for the Latin et, though appearing with the downward stroke not quite vertical, was found in a manuscript dated 1417 (Florian Cajori).</p>
      <p>The + and - symbols first appeared in print in Mercantile Arithmetic or Behende und hüpsche Rechenung auff allen Kauffmanschafft, by Johannes Widmann (born c. 1460), published in Leipzig in 1489. However, they referred not to addition or subtraction or to positive or negative numbers, but to surpluses and deficits in business problems (Cajori vol. 1, page 128).</p>
      <p>Source:<br>
      <a href="http://members.aol.com/jeff570/mathsym.html" title="http://members.aol.com/jeff570/mathsym.html">http://members.aol.com/jeff570/mathsym.html</a></p>
      <p>Of course, the 'and' and the symbol + is used as a mathematical operation in these examples.</p>
