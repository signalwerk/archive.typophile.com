    html: <p>&amp; is a ligature for the French word et. Over time it became so popular that it spread into other languages; becoming a more general Latin language symbol. The difference is context - sometimes it just looks better to use &amp; than it does to spell out the word and. It is a somewhat conservative symbol; contemporary designers have begun replacing it with + here in the US, particularly when used with Sans Serif type.</p>
