      <p><em>The ampersand is frowned upon in body text unless citing such a proper name that normally uses one. Your use of the ampersand for your book title is totally sane and appropriate, but entirely optional.</em></p>
      <p>I agree. Satya, I was taught that the ampersand is ok to use if you're fighting for space in a title or headine that contains the word 'and'. The logic is that it's a contraction* so it takes up less (horizontal) space than three characters. In a body text situation, the convention is to spell words out in full, which is why Gill's using it throughout the text of the 'Essay on Typography' was so er, iconoclastic.</p>
      <p>*maybe this is the other reason for the iconic status of Lubalin's Mother&amp;Child masthead.</p>
