    <p>The topic is &gt;&gt;<br>
    What is the difference between "<a href="/wiki/ampersand" class="freelinking" rel="nofollow">&amp;</a>" and "and"_?</p>
    <p>It may be a silly question but i really don't know where to use what.<br>
    What is the main difference but_? I am working on a book publication and the title for that book is, "Design &amp; System". Now how do i write it_? Which way would be better and why_?</p>
    <p>Thanks,<br>
    Satya_</p>
