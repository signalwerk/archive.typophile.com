      <p>"And would you believe I got an invitation today to attend an alumni event? It was addressed to “Staff, Faculty, Alumni + Friends”? The current dean is an architect…."</p>
      <p>Hehe Linda, you have no idea how funny that strikes me at this particular moment. Aren't universities fun? .~ (to refer to another thread...)</p>
      <p>Here, though, we prefer to ALWAYS spell out our "and"... even when it looks cleaner and makes more sense to use &amp; ... </p>
      <p>I have also recently encountered the "I'm not a designer, but I think this would look better" administrative personnel. After a few days she stopped prefacing her comments with "I'm not a designer, but" and began simply dictating the details of the layout to me in emails that went along the lines of "what about if we moved this left, made that bold, centred that, put the fleurons on the other headers, and removed the "lines"?" Sure. No problem. (biting tongue to keep from saying those are paragraph rules, not lines.)</p>
      <p>K.</p>
