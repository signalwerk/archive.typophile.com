      <p>&gt; <em>we all tend to see what we expect.</em></p>
      <p>Which is particularly true in this case. With respect to Bleisetzer assumption that the "ct" ligature was an "Et" comes from where the type specimen placed it.</p>
      <p>Why is the "ct" not listed with it's companions "ch", "ck" and "c-swash k"?<br>
      Since it is placed prior to the actual "et" and "&amp;" it made it appear as if it truly was an ampersand.</p>
      <p>Interesting... eh?</p>
