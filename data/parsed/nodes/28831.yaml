    html: |-
      <p>Satya, are you asking when the usage of one or the other is more appropriate?</p>
      <p>The ampersand is more often used in business names or book titles, those that are comprised of a short list of product or proprietor names, such as "Dungeons &amp; Dragons", "Dewey, Cheatham, &amp; Howe, Accounting", or "An Jan Grain &amp; Feed".</p>
      <p>The ampersand is frowned upon in body text unless citing such a proper name that normally uses one. Your use of the ampersand for your book title is totally sane and appropriate, but entirely optional.</p>
