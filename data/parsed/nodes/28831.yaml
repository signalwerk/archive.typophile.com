      <p>Re: Please note that this is my German point of view. In other languages, the use of the ampersand might be different (although I can’t recall to have seen the ampersand used in contemporary English or French as an arbitrary substitute for the word “and”).</p>
      <p>&gt;&gt;&gt;Pick up Eric Gill's An Essay on Typography. The ampersand is all over the place in place of and. Here's an example from page 21 of the most commonly available facsimile (sorry Godine publishers, I love your books, but this edition has a terrible cover.)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Gill_6653.jpg"></div><p></p>
      <p>Gill: "The absurd rule that the ampersand (&amp;) should only be used in 'business titles' must be rescinded, &amp; there are many other contractions which a sane typographer should encourage."</p>
      <p>I should also say that Gill didn't like to wear underwear and that the last chapter on his advocacy of phonography is a bit looney...</p>
      <p>Geoffrey Dowding's Finer Points in the Spacing &amp; Arrangement of Type also makes a very passionate argument for the use of the ampersand in the actual text body.  </p>
      <p>Dowding gives as an example Manutius's Hypernerotmachia Poliphili:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Poliphili_4237.jpg"></div><p></p>
      <p>My apologies for the quality of the scans... parts of the images got smudged...</p>
