      <p>PPS The same for Wikipedia (pardon, Thierry). I'm not sure I would consider the image on the left an ampersand at all, more like just e and t close together, or let's say it's a late adaptation, but with a completely different structure from the old Roman ligature. </p>
      <p>As for the 'italic ampersand' (on the right), it's something else altogether, and much more recent: an Italian Renaissance creation, inspired I think by Byzantine calligraphy. (That's why the e and t are easier to recognise in it.)</p>
      <p>Not to mention the modern 'handwritten ampersand' illustrated which is obviously just a sloppy +.</p>
      <p>PPPS Senza offesa Alessandro. Actually, although it was born as a ligature, it has now become an abbreviation. &amp; buon app&amp;ito 2 U.</p>
