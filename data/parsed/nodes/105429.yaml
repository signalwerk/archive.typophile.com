    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Stanley_6170.gif"></div><p></p>
    <p>Hello - -curious to find out if there are any other fonts our there with similar forms to this lovely new face by Ludovic Balland... I am particularly interested in the sharply delineated junctions (brackets?) between stem and the serif, for example in the 'I'...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/StanleyIt_6617.gif"></div><p></p>
    <p>Thanks as ever for any useful tips!</p>
    <p>Matt</p>
