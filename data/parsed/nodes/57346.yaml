      <p>Bonjour Logan,</p>
      <p>Je crains que cette annonce Pub de TFI est fait sur mesure. Les formes des caractères-immeubles sont très rigides et géométriques, et franchement pas vraiment bien dessinées. Il existe des typos sans sérif assez carrées donc s’est possible de trouver quelque chose de similaire (et meilleur). En plus ces formes là sont très simples à dessiner soi-même.</p>
      <p>Que recherches-tu exactement dans ce caractère? Que penses-tu par exemple de <a href="http://www.fontshop.com/fonts/singles/creative_alliance/pl_fiedler_gothic_bold/&amp;sample_text=PUB&amp;sample_size=96">Fiedler Gothic</a>?</p>
