    html: |-
      <p>Hi Esteve, I too have designed a Bicyclist’s Kit. I have samples at my site. What I would change is make the main name on the front and back solid white. When your sprinting to the line at 30+ mph you need simplisity to be read at the line. The red is to close to the blue in the tonal range to be distinctive even with a white stroke.</p>
      <p>One other thought, its popular now to put the name on the back of the shorts. Its very visible especially if you have a dot com.</p>
