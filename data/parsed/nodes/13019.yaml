      <p>Hi Esteve,<br>
      I’m a bike-rider myself and I designed the jerseys too.<br>
      Honestly I don’t think it’s a good design, it not very clear, try keeping it simple, bigger typo maybe, probably better in white. Loose the globe, that’s no good.<br>
      To lower the cost I used plain blue shorts, which you can buy anywhere.<br>
      Take a look at this link, I used a The Mix from Luc(as) De Groot.</p>
