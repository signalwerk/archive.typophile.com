    <p>Dear Friends,</p>
    <p>We’ve just launch a new tote bag crowdsourced site, “Common Totes”, and we’d like to invite you to check it out!</p>
    <p>It’s a site calling for Graphic Design entries where anyone across the globe with a mean creative streak can submit designs for tote bags for the community to vote for a chance @US$300!</p>
    <p>The best designs get manufactured into actual tote bags for sale and each winning design will be awarded a prize of US$300 - there will be two winners monthly in this ongoing competition.!</p>
    <p>Check it out at:</p>
    <p><a href="http://www.commontotes.com" title="http://www.commontotes.com">http://www.commontotes.com</a></p>
    <p>We”d really appreciate you guys helping to spread the word to your designer friends and asking for their participation by submitting some of their designs.</p>
    <p>We look forward to seeing you on Common Totes, and if you have any feedback or comments, please feel free to email us at <a href="mailto:team@commontotes.com">team@commontotes.com</a>.</p>
    <p>Thanks and best wishes</p>
    <p>Damien<br>
    The Common Totes Team<br>
    <a href="http://www.commontotes.com" title="http://www.commontotes.com">http://www.commontotes.com</a></p>
    <p>Be our Facebook fan:<br>
    <a href="http://www.facebook.com/pages/Common-Totes/84670517779" title="http://www.facebook.com/pages/Common-Totes/84670517779">http://www.facebook.com/pages/Common-Totes/84670517779</a></p>
    <p>ps: Dear administrator, do let me know if this post should be moved to another section. Thanks!</p>
