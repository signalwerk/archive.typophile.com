    html: |-
      <p>Indeed your logo gives an air of professionalism and elegance. I like very much the Bembo for 'Italian' word, but when I read 'addiction' is like NOW something wrong is happening. It directs me to a law firm... Of course, addiction by its meaning is not a positive word, but I would see it as an image, literally an image, which would convey that you 'stick' to it, cannot get rid of it. Therefore, sans serif, for me at least, is not giving this notion to the word. I tried to make 'Italian" sans serif and 'addiction' serif, but I didn't like it. Somehow, you have to emphasize the notion of 'addiction'. I was thinking of a typeface that would look like being engraved in stone, which would highlight its strong power, 'of being addicted to something'. It would say: now I am engraved in stone, try to get rid of me... :)<br>
      In the image below I used fonts which I had (Trajan Pro), sorry for that! :( But the middle points are quite roman and in some way emphasize word's strength, especially when you try to read it. It makes you stop between the points. It is just a way of seeing it, not something that I propose. Maybe, the image will lead you to find some new techniques for your logo.<br>
      Have you tried making "Italian" calligraphic, without using any fonts, make it by yourself, an elegant script and "addiction" in lowercase, serif maybe?<br>
      And by the way, I used a line because you used one. It may be not necessary. But is not bad at all too.<br>
       </p><div class="imageWrap"><img src="http://typophile.com/files/Test1_4846.png"></div><p></p>
      <p>______<br>
      Will you share with me how to make an attachment instead of inserting the image? It saves space on the screen. Thanks!</p>
