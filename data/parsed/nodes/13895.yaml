    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Concepts" class="freelinking" rel="nofollow">Concepts</a></strong></p>
    <p>The practice of optimizing types for different sizes to produce the best result is most often called "optical scaling." These subtle alterations to <a href="/wiki/glyph" class="freelinking" rel="nofollow">glyph</a> shapes depending on the physical size. The most important such change is a thickening of thin strokes at small sizes which reduces the stroke contrast. Other common adjustments to smaller sizes include a slight widening, opening up of the <a href="/wiki/letterspace" class="freelinking" rel="nofollow">letterspace</a>, increase of the <a href="/wiki/x-height" class="freelinking" rel="nofollow">x-height</a>, and making <a href="/wiki/Counter" class="freelinking" rel="nofollow">counters</a> and <a href="/wiki/Aperture" class="freelinking" rel="nofollow">apertures</a> wider.</p>
    <p>In the days of <a href="/wiki/Metal%20Type" class="freelinking" rel="nofollow">metal</a>, all fonts were effectively optically scaled. Before the late 19th century, a <a href="/wiki/Punchcutter" class="freelinking" rel="nofollow">punchcutter</a> needed to sculpt each individual size separately, an extremely labor-intensive process. <a href="/wiki/Linn%20Boyd%20Benton" class="freelinking" rel="nofollow">Linn Boyd Benton's</a> <a href="/wiki/Pantograph" class="freelinking" rel="nofollow">pantograph</a> changed that, allowing a full range of sizes to be engraved from a single pattern plate. This turned out to be merely the first of many technological changes that had the potential to eliminate optical scaling, as it was now feasible to produce smaller fonts that were simply mathematical replicas of larger ones.</p>
    <p>However, the Bentons did not fall for this temptation, and worked out an ingenious system of adjustments for implementing optical scaling during the pantographic engraving process. The Benton matrix engraver had the ability to do <a href="/wiki/anamorphic%20scaling" class="freelinking" rel="nofollow">anamorphic scaling</a>, which was used to extend smaller sizes. More importantly, by controlling the relative sizes of the "follower" used to trace the pattern plate and the engraving tool used to cut the matrix, a stroke offset could be added or subtracted from the original outline.</p>
    <p>Thus, the Bentons were able to automate nearly all of the task of producing optically scaled fonts. They can perhaps be credited with pioneering the use of steam-powered "computational geometry". However, the other major approach to optical scaling was to create different pattern plates for different ranges of sizes. <a href="/wiki/Stempel" class="freelinking" rel="nofollow">Stempel</a> is reported to have used a standard three pattern plates, and analysis of <a href="/wiki/Monotype" class="freelinking" rel="nofollow">Monotype</a> fonts shows three or four to be typical. Of course, it is also possible to combine these two techniques, as was done for the <a href="/wiki/ATF" class="freelinking" rel="nofollow">ATF</a> <a href="/wiki/Garamond" class="freelinking" rel="nofollow">Garamonds</a>. This font used two pattern plates, one for text sizes to 12pts, one for display sizes 14pts and over, and used Benton optical scaling for the adjustments within the range.</p>
    <p>The advent of <a href="/wiki/Photocomposition" class="freelinking" rel="nofollow">photocomposition</a> dealt a serious blow to optical scaling. Being based on photographic magnification, the only way to acheive optical scaling would have been to provide a diversity of glyph shapes on "photomats". The labor-saving and somewhat crude esthetic of those days did foster the development of any optical scaling technology for phototype.</p>
    <p>Digital typography brought the potential for infinitely more flexibility, and while some early digital font technologies such as <a href="/wiki/Metafont" class="freelinking" rel="nofollow">Metafont</a> did implement optical scaling, the mainstream faithfully duplicated the limitations of <a href="/wiki/Phototype" class="freelinking" rel="nofollow">phototype</a>. Neither basic <a href="/wiki/TrueType" class="freelinking" rel="nofollow">TrueType</a> nor <a href="/wiki/Type%201" class="freelinking" rel="nofollow">Type 1</a> font technologies have support for optical scaling. Many attempts have been made to add optical scaling, including with <a href="/wiki/Multiple%20Master" class="freelinking" rel="nofollow">Multiple Master</a> fonts containing an "optical size" axis to complement the standard axes of weight and width. Unfortunately, Multiple Master has failed to become popular, and today its main use is as an in-house design aid.</p>
    <p>Even so, it has always been possible to fake optical scaling with phototype and its simpleminded digital successors, simply by choosing a different font for different sizes. Indeed, even in the metal days one can imagine, for example, that Michelangelo is a design optimized to blend seamlessly at larger sizes with Palatino text. For example, in 1990 <a href="http://www.itcfonts.com/fonts/detail.asp?sku=ITC6004&amp;AID=5671747&amp;PID=939805" rel="nofollow">ITC Bodoni</a> was released in sizes of Six, Twelve, and Seventy-Two. Today, with a resurgence of interest in fine typography, an increasing number of fonts are sold in optically scaled sets. The most prolific foundry is Adobe's Opticals series, with <a href="/wiki/Robert%20Slimbach" class="freelinking" rel="nofollow">Robert Slimbach's</a> <a href="/wiki/Garamond%20Premier%20Pro" class="freelinking" rel="nofollow">Garamond Premier Pro</a> as a monumental example.</p>
    <p>Of special note is <a href="/wiki/Sumner%20Stone" class="freelinking" rel="nofollow">Sumner Stone's</a> <a href="/wiki/Cycles" class="freelinking" rel="nofollow">Cycles</a>, which is one of the few modern examples of a font carefully crafted at each of the optical sizes. <a href="/wiki/Monotype" class="freelinking" rel="nofollow">Monotype</a> is also updating their library of classic fonts with some specific sizes, notably <a href="/wiki/Bembo" class="freelinking" rel="nofollow">Bembo</a> Book.</p>
    <p>The future of optical scaling is bright. The <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> font format has a "feature" identifying the intended size range of a font, and sophisticated typesetting applications will no doubt use this feature to automatically select glyph shapes for the intended size. <em>(Note to future editors: check if InDesisgn CS2 has this capability; CS1 did not).</em> The interest in fine typography, the effectively unlimited computing power available today, and the careful study of optical scaling techniques of the past, will all serve to motivate better tools, and of course more and more good optically scaled fonts.</p>
