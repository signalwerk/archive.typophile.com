    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/13962" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Concepts</a></strong></p>
    <p>The practice of optimizing types for different sizes to produce the best result is most often called “optical scaling.” These subtle alterations to <a href="/node/12748" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Glyph</a> shapes depending on the physical size. The most important such change is a thickening of thin strokes at small sizes which reduces the stroke contrast. Other common adjustments to smaller sizes include a slight widening, opening up of the <a href="/node/36037" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Letterspace</a>, increase of the <a href="/node/12028" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">x-height</a>, and making <a href="/node/12050" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">counters</a> and <a href="/node/13969" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">apertures</a> wider.</p>
    <p>In the days of <a href="/node/add/wiki?edit%5Btitle%5D=Metal%20Type" title="Create node &quot;Metal Type&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">metal</a>, all fonts were effectively optically scaled. Before the late 19th century, a <a href="/node/add/wiki?edit%5Btitle%5D=Punchcutter" title="Create node &quot;Punchcutter&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">punchcutter</a> needed to sculpt each individual size separately, an extremely labor-intensive process. <a href="/node/16219" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linn Boyd Benton’s</a> <a href="/node/add/wiki?edit%5Btitle%5D=Pantograph" title="Create node &quot;Pantograph&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">pantograph</a> changed that, allowing a full range of sizes to be engraved from a single pattern plate. This turned out to be merely the first of many technological changes that had the potential to eliminate optical scaling, as it was now feasible to produce smaller fonts that were simply mathematical replicas of larger&nbsp;ones.</p>
    <p>However, the Bentons did not fall for this temptation, and worked out an ingenious system of adjustments for implementing optical scaling during the pantographic engraving process. The Benton matrix engraver had the ability to do <a href="/node/add/wiki?edit%5Btitle%5D=anamorphic%20scaling" title="Create node &quot;anamorphic scaling&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">anamorphic scaling</a>, which was used to extend smaller sizes. More importantly, by controlling the relative sizes of the “follower” used to trace the pattern plate and the engraving tool used to cut the matrix, a stroke offset could be added or subtracted from the original&nbsp;outline.</p>
    <p>Thus, the Bentons were able to automate nearly all of the task of producing optically scaled fonts. They can perhaps be credited with pioneering the use of steam-powered “computational geometry”. However, the other major approach to optical scaling was to create different pattern plates for different ranges of sizes. <a href="/node/add/wiki?edit%5Btitle%5D=Stempel" title="Create node &quot;Stempel&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Stempel</a> is reported to have used a standard three pattern plates, and analysis of <a href="/node/add/wiki?edit%5Btitle%5D=Monotype" title="Create node &quot;Monotype&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Monotype</a> fonts shows three or four to be typical. Of course, it is also possible to combine these two techniques, as was done for the <a href="/node/13554" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">ATF</span></a> <a href="/node/12481" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Garamonds</a>. This font used two pattern plates, one for text sizes to 12pts, one for display sizes 14pts and over, and used Benton optical scaling for the adjustments within the&nbsp;range.</p>
    <p>The advent of <a href="/node/add/wiki?edit%5Btitle%5D=Photocomposition" title="Create node &quot;Photocomposition&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">photocomposition</a> dealt a serious blow to optical scaling. Being based on photographic magnification, the only way to acheive optical scaling would have been to provide a diversity of glyph shapes on “photomats”. The labor-saving and somewhat crude esthetic of those days did foster the development of any optical scaling technology for&nbsp;phototype.</p>
    <p>Digital typography brought the potential for infinitely more flexibility, and while some early digital font technologies such as <a href="/node/13885" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Metafont</a> did implement optical scaling, the mainstream faithfully duplicated the limitations of <a href="/node/add/wiki?edit%5Btitle%5D=Phototype" title="Create node &quot;Phototype&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">phototype</a>. Neither basic <a href="/node/13679" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TrueType</a> nor <a href="/node/add/wiki?edit%5Btitle%5D=Type%201" title="Create node &quot;Type 1&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Type 1</a> font technologies have support for optical scaling. Many attempts have been made to add optical scaling, including with <a href="/node/17216" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Multiple Master</a> fonts containing an “optical size” axis to complement the standard axes of weight and width. Unfortunately, Multiple Master has failed to become popular, and today its main use is as an in-house design&nbsp;aid.</p>
    <p>Even so, it has always been possible to fake optical scaling with phototype and its simpleminded digital successors, simply by choosing a different font for different sizes. Indeed, even in the metal days one can imagine, for example, that Michelangelo is a design optimized to blend seamlessly at larger sizes with Palatino text. For example, in 1990 <a href="http://www.itcfonts.com/fonts/detail.asp?sku=ITC6004&amp;AID=5671747&amp;PID=939805"><span class="caps">ITC</span> Bodoni</a> was released in sizes of Six, Twelve, and Seventy-Two. Today, with a resurgence of interest in fine typography, an increasing number of fonts are sold in optically scaled sets. The most prolific foundry is Adobe’s Opticals series, with <a href="/node/16060" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Robert Slimbach’s</a> <a href="/node/add/wiki?edit%5Btitle%5D=Garamond%20Premier%20Pro" title="Create node &quot;Garamond Premier Pro&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Garamond Premier Pro</a> as a monumental&nbsp;example.</p>
    <p>Of special note is <a href="/node/add/wiki?edit%5Btitle%5D=Sumner%20Stone" title="Create node &quot;Sumner Stone&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Sumner Stone’s</a> <a href="/node/add/wiki?edit%5Btitle%5D=Cycles" title="Create node &quot;Cycles&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Cycles</a>, which is one of the few modern examples of a font carefully crafted at each of the optical sizes. <a href="/node/add/wiki?edit%5Btitle%5D=Monotype" title="Create node &quot;Monotype&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Monotype</a> is also updating their library of classic fonts with some specific sizes, notably <a href="/node/12480" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bembo</a> Book.</p>
    <p>The future of optical scaling is bright. The <a href="/node/12420" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OpenType</a> font format has a “feature” identifying the intended size range of a font, and sophisticated typesetting applications will no doubt use this feature to automatically select glyph shapes for the intended size. <em>(Note to future editors: check if InDesisgn <span class="caps">CS2</span> has this capability; <span class="caps">CS1</span> did not).</em> The interest in fine typography, the effectively unlimited computing power available today, and the careful study of optical scaling techniques of the past, will all serve to motivate better tools, and of course more and more good optically scaled&nbsp;fonts.</p>
