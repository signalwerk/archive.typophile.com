      <p>It seems that Lucas de Groot made a version without rounded stems. When I read this on his website, I was a bit disappointed. I think Calibri would have looked better without the roundings.</p>
      <p><cite>De Groot drew a contemporary sans serif family with subtle roundings on stems and corners.  However, as the roundings seemed to suffer under ClearType rendering, De Groot redesigned the font, taking out the rounded corners. When submitting the proposal to Microsoft, he sent along a sample of the original version, adding: ‘I like the look of it, but as you see these rounded tops look real ugly in ClearType; don’t choose this.’ De Groot had in fact been critical of the ClearType rasterizer when he first saw it demonstrated. To his astonishment, Microsoft chose the rounded version. ‘As I soon found out, the rasterizer had indeed improved, and rounded tops and bottoms could be rendered smoothly now.’</cite></p>
