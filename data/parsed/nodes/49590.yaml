    <p>I feel like, if I had to pay $150 for Microsoft Office, I would tear open the packaging not excited for the Office Programs, but excited for the rights to the font(s) I just bought.</p>
    <p>Like I seriously am in love with Calibri: There's something about it that somehow makes it float above the (digital) page ever so slightly, and it's just very clean. Perhaps a near epitome of what it means to have a "Curvy" Sans-Serif font.</p>
    <p>But since the release of Microsoft's OpenType (?) fonts, few designers have brought them to mention. (None that I've heard at least). Are they scoffed at? Or do we just have too many other things to focus our attention on?</p>
