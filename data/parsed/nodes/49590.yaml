      <p>I quickly read the above comments and if I am not mistaken, the font is discussed only from "Latin" point of view. Yes, there are many other latin fonts, but when it comes to Greek language, esp. sans serif fonts, Calibri is beautiful, clear and quite rich. And this is a true challenge for type designers, to try to design not only a Latin version but also a Greek one, for example.<br>
      Calibri became very popular lately in Greece. Finally, Times New Roman is being set aside step by step.<br>
      The Capital letters are gorgeous in comparison with other Greek fonts, the numbers are great.<br>
