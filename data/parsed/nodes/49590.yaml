    html: |-
      <p>I never got the chance to look at Calibri that closely; I just printed one sample page a while ago. But I do like the design overall. Here are my very rough impressions (keep in mind that's what they are):</p>
      <p>Many of the design details Bill Troop pointed out as being too cute didn't bother me. The o doesn't strike me as being angular, maybe because I'm just so used to seeing square sans designs these days. The ascender-descender proportions look fine to me, although again that is perhaps because I'm so used to extremely minimal descender lengths of latin components of CJK fonts.</p>
      <p>I did notice the spacing problems with the single quotes that Bill mentionned, and I remember wondering what the rationale was. Possibly something to do with different quotation marks used for different languages... The design itself of the single and double quotes struck me odd as well, and I remember thinking it was maybe a screen font thing. It will be interesting to hear the designer's reasoning for these choices.</p>
      <p>The double-storey default <em>g</em> is too busy perhaps, but I'm trying to make my peace with double-storey <em>g</em>s in sans designs (they seem to be in fashion after all) and there is no real way to completely avoid a cluttered look with double-storey <em>g</em>s. I never got to look at the italic too closely, so I can't comment on it.</p>
      <p>Overall, I think because of what I'm used to seeing nowadays, Calibri looks quite neutral to me. I think there are definitely shifts in the sensibilities in typeface designs over time and maybe Calibri will be dated soon ("Look at those early-century square <em>o</em>s!"). But I'm not really sure it represents a drop in the level of typographic excellence as Bill stated, although if his point is mainly based on the punctuation marks, then I see his position. A default font used by millions should be held up to higher standards, after all.</p>
    html_clean: |-
