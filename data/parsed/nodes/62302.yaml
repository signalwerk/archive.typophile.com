    <p>Hi everyone,</p>
    <p>I will be getting married next year and my Fiancée and I are going to use an ambigram of our names as a kind of logo for the day.<br>
    So here it is so far, what are your thoughts?</p>
    <p>And before people ask, the tudor rose and thistle are there as references back to family roots.  ;o)</p>
    <p><a class="freelinking external" href="http://www.sj-creative.co.uk/FS_ambigram.jpg">http://www.sj-creative.co.uk/FS_ambigram.jpg</a></p>
