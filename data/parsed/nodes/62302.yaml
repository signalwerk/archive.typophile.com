      <p>I managed to read Fiona and Simon after a few seconds which is a good start, but I think it could be clearer. For me, it's the F that causes the problems. I think the top bar of the F needs to be closer to the vertical bar to help visually join the two. I've attached a couple of suggestions of what I mean and how I would improve it. Apologies in advance for the very crude butchery method i've employed to illustrate my ideas!</p>
