      <p>Definitely a customised ITC Avant Garde.</p>
      <p>The guys from Ipsum Planet tend to design their own typefaces and then gradually give them away free randomly every few issues or so. I’ve a about 20 (of varying low quality) at this stage — misspent wages from my free-and-easy magazine buying when I lived in Barcelona.</p>
      <p>I wouldn’t say they’ll give this one away too quickly though as they use it for their masthead etc.</p>
