  html: |-
    <p>TypeTogether is looking for an experienced font engineer in a part-time capacity. The expected working time is about 20h per week. This is a rare opportunity to join the TypeTogether family in a permanent position. We pride ourselves boosting strong inter-personal relations and encouraging a fun yet challenging working environment. </p>
    <p>Description of work:<br>
    1.  Font (desktop &amp; web) post production: development, revision and testing of font files: includes OpenType feature coding, metrics, header and naming tables, troubleshooting and software performance control.<br>
    2. Technical support: verify and fix reported issues about font performance.<br>
    3. Communication and reporting: Collaborate with the design and quality assurance team on the creation of procedures and processes to streamline font development.</p>
    <p>The applicant should be proficient in Fontlab and Glyphs with optional experience in Robofont, Python, VTT, VOLT.<br>
    Skills in type design drawing are desired but not required.<br>
    The applicant should speak good english and work independently and reliably in an international team of fun and motivated people.</p>
    <p>If interested please send you applications to <a href="mailto:info@type-together.com">info@type-together.com</a> including a resumé and salary expectations.</p>
    <p><a href="http://www.type-together.com/index.php?action=portal/viewContent&amp;cntId_content=3440">http://www.type-together.com/index.php?action=portal/viewContent&amp;cntId_c...</a></p>
