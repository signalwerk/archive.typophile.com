    date_raw: 9 Apr 2003 — 2:45pm
    votes: null
    html: <p>If Rand wasn't happy with it, then why dwell on it? Obviously he did not like it. And I would tend to agree with his opinion first. It was a poor decision for UPS to accept the first logo and similar dedcision making on this new one too. <br> <br>I don't care for the new one either, but the string HAD to go. When was the last time any of us saw a package with string? In the industry that UPS and FEDEX are in I can see how any reference to the "old" or "archaic" would be a bad thing. No matter how much we as designers may like the traditional. <br> <br>But I am interested to see how they translate the new logo to one color printing. Or even two color. That element of Rand's original that made the old logo so universal. <br> <br>I had also heard that the reason that UPS went with the color brown in the first place was legal. I forget the details I heard, but UPS was required (legally somehow) to "down-play" their presence. Can anyone recall this legal issue?</p>
