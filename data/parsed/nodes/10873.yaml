    html: "<p><i>Randy said: Of course I'm playing devil's advocate here. But in my opinoin, it could be a lot worse (Verizon). </i> <br> <br>Funny, FutureBrand claims fame to the Verizon logo. <br> <br>I think the bow and parcel concept and its reason to change, being \"outdated\" is retarded.  The string, bow and parcel weren't used in the first place because Rand or UPS beleived that's the way they delivered packages. Its because its a \"gift\" and relates to the emotional level of receiving a delivery. Saying it was outdated to logistics is like re-designing Col. Saunders head shot with a business suit and tie,  giving him plastic surgery because he looks old. Its all irrelevant, and ignores their corporate values.  <br> <br>(cleaned my cookies, lazy - going anon, but its me Tanya)</p>"
