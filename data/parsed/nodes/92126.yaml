      <p>hi guys thanks for the fast responses. It is for a logo. Company is called delta cycles and the premise is that delta cycles exists to promote cycling through a change to the norm. Principally they will be manufacturing bikes out of bamboo, which isn't entirely new, however it is different for the marketplace in Australia, where they operate.</p>
      <p>They have an icon which they are wedded to (see <a href="http://www.deltacycles.com.au" title="http://www.deltacycles.com.au">http://www.deltacycles.com.au</a>), however they would like a font for the name that will look as good on a bike as it does on printed material. The owner likes the look of the rapha logo (<a href="http://rapha.cc" title="http://rapha.cc">http://rapha.cc</a>) but doesn't want to rip them off as it will just look copy cat which he doesn't want.</p>
      <p>Hope this helps on the input front.</p>
      <p>Cheers<br>
      Dan</p>
