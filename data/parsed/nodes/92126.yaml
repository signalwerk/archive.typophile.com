    <p>Hi all,</p>
    <p>First time posting at typophile so am not 100% sure if this is the location. I don't have a specific font I am after I am only just starting to learn about typography and was hoping someone might be able to give me some ideas of fonts that convey a feeling of change or difference.</p>
    <p>It would be even better if they provide a sense of moving towards change, or moving to a 'different' place.</p>
    <p>Thanks in advance for the help, and feel free to bump to another thread if more appropriate.</p>
    <p>Cheers<br>
    Dan</p>
