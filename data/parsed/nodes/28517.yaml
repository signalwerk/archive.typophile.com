      <p>The Unicode codes below were found on an information page that came with P22's April's Fools Day font LTC Spacing Sorts.</p>
      <p><a href="http://www.p22.com/lanston/products/spacing_sorts.html" title="http://www.p22.com/lanston/products/spacing_sorts.html">http://www.p22.com/lanston/products/spacing_sorts.html</a></p>
      <p>Unicode </p>
      <p>U+0020 space<br>
      U+00A0 no-break space<br>
      U+2000 en quad<br>
      U+2001 em quad<br>
      U+2002 en space<br>
      U+2003 em space<br>
      U+2004 three-per-em space<br>
      U+2005 four-per-em space<br>
      U+2006 six-per-em space<br>
      U+2007 figure space<br>
      U+2008 punctuation space<br>
      U+2009 thin space<br>
      U+200A hair space<br>
      U+200B zero width space<br>
      U+202F narrow no-break space<br>
      U+205F medium mathematical space<br>
      U+3000 ideographic space<br>
      U+FEFF zero width no-break space</p>
