    html: <p>Design for communication is just that. It does not require the added universal beauty to make it communicate.  If you look at enlargements small text meant for tough situations like phone books, you will see designed ugliness in the inktraps and cuts needed to make the type work for it's intended purpose. If you look at Grunge types, you will see batterings and beatings that reduce legibility of reading but may increase communication of the intended message if used properly.  If you have an ugly message, just maybe, the type might reflect that.</p>
