      <p><strong>To the appetite: typophiles</strong><br>
      ————————————————————————<br>
      Emigre #28.<br>
      <em>Interview to Barbara Glauber. <a href="https://web.archive.org/web/20150124161502/http://www.emigre.com/ImagesLG/E28LG.JPG" rel="nofollow">Broadcast issue</a></em></p>
      <p>"E: Heller writes that he thinks a lot of current works is "driven by instinct and obscured by theory, with ugliness its foremost byproduct." He names Keedy and Fella as examples of this.I wonder if at the heart of this whole hubbub about "ugliness" is that it's difficult to understand that some designers sometimes want to reach a smaller audience instead of a larger, more homogenized audience. Or that we might want to push design to the "edge" and hopefully, move the whole practice along?</p>
      <p>BG: I know. A lot of people just completely miss the point that there actually can be joy in doing design, pushing the boundaries and exploring visual culture.<br>
      New things have to happen somehow and somewhere: otherwise what's the point of going on? If new desing is based in what was considered "good" in the past, what's the point? The models for "goodness" are inevitably going challenged and I'm not saying that this may be for everyone or to everyone's taste. Isn's this—and I think this is something you were asking me—about opening up your realm of influences and inspiration to other sources? I like to draw in my personal history, like comics and Letraset. I've had experiences common to a lot of other people, but not everyone is going to respond to the same things or the same way I do. My work often gets labeled as "cute", but can't work be a playful or funny? To be considered serious does it need to be stripped down, severe and universal? Everything would be so homogeneous.<br>
      I love to take "official" language and turn it upside down. Tehre's an expectation inherent in official language. It's not very interesting to look at and it's meant to be read quickly. But say you take an icon has was designed to be read internationally as a symbol for a restaurant, turn it into a bleeding plate and use it as an icon to mark where someone was murdered in a restaurant—now that's interesting to me. I were making stop signs, for instance, I'd do my job, and of course I'd make stop signs that could be read quickly. But I'm not making stop signs. We all know the difference between a stop sign and a poetry book, and we wouldn't design them is the same way. There's  an audience and a function for different things. You can't  have different interpretations with a stop sign, you must have an instant understanding. But a poetry book you understand within its context.<br>
      Heller speaks on behalf of a large chunk of design community who don't want a loose interpretation of design. The meaning doesn't have to be right there, so obvious, it can be open to many interpretations. But they're afraid we want all of design to look like that and it doesn't and it never will. It wouldn't be appropriate to its message.<br>
      You know  that essay by Joseph Giovanni, "Zero Degree of Graphics" in walker Art Center's <em><a href="https://web.archive.org/web/20150124161502/http://www.amazon.com/Graphic-Design-America-Language-History/dp/0810910365" rel="nofollow">Graphic Design in America: A visual Language History?</a></em> The difference between the function and audiences of <em>Harper's</em> magazine and <em>Metropolis</em> is never acknowledged. Sometimes you look and read, sometimes you just read. Sometimes looks what the "look" says is as important to me as what it says.<br>
      Design doesn't have to be so freaking uptight.<br>
      Polite design I rail against this stuff; it's so digestible, so slick, so pretty. But Gail, I'm really all talk about all that polite design stuff because there is a polish I myself can't give up. Ed has a name for making work less slick; he calls it "degreasing the wheels of design." I try to not grease my design and at least structurally, I´m working to corrode. I don't want my work to be like those coated pills you swallow—I want to start sticking in people's throats. (cough)"</p>
