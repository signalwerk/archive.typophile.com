    date_raw: 26 Sep 2012 — 1:27pm
    votes: null
    html: <p>When concerning great art, I really believe in the idea that the only thing that matters at all is the end product.  Process does not matter.  The amount of time it took to create doesn't matter.  The masters the artist studied under don't matter.  The technique the artist used doesn't matter. The success or failure of the artist in general doesn't matter.  The mood the artist was in when they created it doesn't matter. Indeed, to some extent, even the artists intentions don't matter.  What is there, at the end, that won't change, but is permanent--that is all that matters, and all that can ever really be judged.</p>
