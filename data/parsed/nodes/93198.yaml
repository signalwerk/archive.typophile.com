      <p>I’ve “upgraded” some of my earlier experimental types to the OpenType format.<br>
      For instance, one premise of Fontesque (1994) was to be irregular, and the OpenType format expanded that quality through the possibility of creating pseudo-randomness, with fonts that respond to text.<br>
      <a href="https://web.archive.org/web/20150124161502/http://ilovetypography.com/2011/04/01/engaging-contextuality/" title="http://ilovetypography.com/2011/04/01/engaging-contextuality/">http://ilovetypography.com/2011/04/01/engaging-contextuality/</a><br>
      Do experiments with contextuality create shocking forms that are perceived as ugly?<br>
      No, it’s not the kind of thing that suddenly puts creative power in the hands of outsiders, to overthrow the turgid establishment—that sort of situation doesn’t happen very often.</p>
