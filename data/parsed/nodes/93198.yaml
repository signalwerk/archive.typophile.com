      <p>First off, I doubt Pecina was even alive when that was originated.</p>
      <p>That was during a period when the pen was celebrated as a genesis tool and not derided, as it is oft times here. It was calligraphic in origin, true to a "regional style" and used correctly, as Chris said above, was very effective. Not to mention innovative on the manipulation/modulation front.</p>
      <p>Put it in chronological perspective first, before you call it ugly. 60 or 70 years makes a huge difference in taste.</p>
