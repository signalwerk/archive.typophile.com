    <p>Hello;</p>
    <p>The title of this topic is the title of a research that I am making about typefaces and typedesigners that, for some reasons, were lost in the history. Because of their designs or not, some typefaces are called UGLY by graphic designers (and other people), because they not follow the common  shapes of regularity. Texts like <a href="https://web.archive.org/web/20150124161502/https://www.typotheque.com/articles/cult_of_the_ugly" rel="nofollow">"Cult of the ugly"</a> are descriptions about the bad taste of this non-commercial flavor. </p>
    <p>When I listen the word "non-commercial" I always think in beautiful works; things like Zuzana Licko typefaces, Ed Fella, Jeffery Keedy and others alike. My search led me to things like <a href="https://web.archive.org/web/20150124161502/https://www.typotheque.com/images/articles/conceptual/italian.jpg" rel="nofollow">Calson Italian Grotesque</a>, <a href="https://web.archive.org/web/20150124161502/http://www.ipernity.com/doc/fbegnez/11629871" rel="nofollow">Jean Allessandrini type experiences</a>, <a href="https://web.archive.org/web/20150124161502/http://www.fpba.com/parenthesis/select-articles/p15_images/3_raffia.gif" rel="nofollow">Raffia Initials by Henk Krijger</a>, <a href="https://web.archive.org/web/20150124161502/http://www.identifont.com/samples/fontfont/BlockerDubLowSix.gif" rel="nofollow">FF Blocker</a>, <a href="https://web.archive.org/web/20150124161502/http://1.bp.blogspot.com/-zvT6pFGa9Vs/T3r6HGFg4_I/AAAAAAAAIhE/IaKr7TD4qAE/s320/photo-784237.JPG" rel="nofollow">"du chiffre" book of Jérôme Peignot</a>,  <a href="https://web.archive.org/web/20150124161502/http://www.stormtype.com/family-preissig-antikva-pro.html" rel="nofollow">Preissig Antikva</a> and some other examples.<br>
    I dont know what you think about this examples, but I love them,  and this experiences with type fill me with ideias that I want to put in my research.</p>
    <p>What I need [now] is that you fill this topic with this kind of experiences in type that I miss. I know that exist a lot of experiences in history of type design, but I need your help to find them all :). [Past Present and Future (if possible)]</p>
    <p>Best Regards<br>
    Fábio Santos</p>
