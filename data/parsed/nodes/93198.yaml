      <p>Fabiouser – it almost seems like divine intervention that I came across this topic today (as I just registered this morning). I am excited for the discussion your post will promote!</p>
      <p>"Cult of the Ugly" was one of the defining texts that inspired me to study at Cranbrook, where I am currently a second year student under the tutelage of Elliott Earls. Though much different than the McCoy-era Cranbrook of the 1980's (Keedy/Fella), the spirit of the academy is much the same in that the work we produce tries to challenge the conventions of contemporary design discourse and explore visual culture. That being said, with the disciplinary fragmentation caused by the internet, it has become increasingly difficult to create something "ugly," as most design seems generally accepted without much discussion or opposition.*</p>
      <p>Given the examples in your initial post, I believe that our taste and interest in type design is similar – an interest that has led me to enroll in the Summer Program in Type Design at Cooper Union with Jean François Porchez. </p>
      <p>If you haven't already, you should check out Elliott Earls' more recent <a class="freelinking external" href="https://web.archive.org/web/20150124161502/http://www.theapolloprogram.com/workCranbrookPosters.html" rel="nofollow">posters</a>. Though his early typographic works through Emigre have been immortalized in the canon of graphic design history, I think this work demonstrates a contemporary execution of the concepts you seem to be alluding to/are interested in.</p>
      <p>*Earlier this year I had the opportunity to meet and dine with Damon Murray of Fuel (UK). We spoke at great length about how design culture has slowly diminished as a result of most designers unwillingness to openly critique the work of their peers. Though seemingly obvious, that particular discussion has resonated with me for a while now; we need more "Cult of the Ugly," and conversely, need more challenging dialogue (see: Andrew Blauvelt's response to Heller, "The Cult(ivation) of Discrimination" in Emigre 31).</p>
