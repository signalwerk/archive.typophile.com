      <p><img src="https://web.archive.org/web/20150124161502im_/http://www.graphicdeclaration.com/images/mulligans_blockhead_3.jpg"></p>
      <p>Shown in the above image is the final layout presentation for a advertizing campaign I'm designing for a very prestigious florist. I am communicating with gestural line work and 3D items. In this image it is mirror glass composed in the shape of a human head with wings - basically speaking. Flowers are reflected within the human shape, becoming part of the abstract human shape.  Bespoke hand drawn lettering next to be added.</p>
      <p>The mirror is a machined element - machines produced it. The graphic lines are human produced. Together there is a 'conversation' taking place and each element compliments the other. This is my own personal style of communicating a sophisticated message, and is from a long long ongoing series I've been working on for quite awhile now.</p>
      <p><img src="https://web.archive.org/web/20150124161502im_/http://www.graphicdeclaration.com/images/DAY_font_3.jpg"></p>
      <p>These letter shapes were  done in the same manner for the same reasons.  </p>
      <p>Graphic design is an art form just as much as any of the fine arts - in my humble opinion anyways. Its just a matter of how raw you want to keep the delivery system intact.  </p>
      <p>So, back on point ... ugliness is a matter of taste. My work has been called ugly ... its been called a lot of things. But whatever it has been called, I feel it is because it has challenged boundaries. And it is those boundaries which we as designer must challenge to some degree in our time.  </p>
      <p>As for me, I don't truly understand the constructs of Ugly or Beauty. </p>
      <p>Thankfully I'm not that clever.</p>
      <p>n.</p>
