      <p>I believe it was Gunnar  who was quoted in Eye about the Cult of Ugly. As I remember it he called it a visual tourettes syndrome, design that says "f**k you" without really meaning it. </p>
      <p>When I co-anchored an AIGA event with Ed in New Orleans I found him to be out-of-touch, ignorant of contemporary talent and self-absorbed in his own little world of rebellion.</p>
      <p>Design does not have to be Xanax, but his brand of letter/design concept is beyond my tastes, and devoid of reality. More like puking paint on a canvas.</p>
      <p>Prior to the lectures he made the statement at the dinner table that all fonts should be free. I almost cold cocked him and several in the restaurant knew and agreed that this was ignorance on parade.</p>
      <p>P.S. It is ugliness! But I guess that is in-your-face contemporary spelling :-)</p>
