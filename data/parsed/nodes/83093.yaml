      <p>Mainly the parents of the kids will be reading the text. Mainly kids will learn to read when their school starts, during Kindergarten only few according to my knowledge will learn to read, reading is not taught in Kindergarten. In kindergarten kids ages vary from 3-6 years olds.</p>
      <p>The goal of using a custom typeface is to create a visual identity that has it's own characteristics starting from the simplest form in itself, letter. The custom typeface is meant to be both playful and stylish and is used also in the company's logotype without modifications.</p>
