    html: |-
      <p>My guess would be a mask layer was created and the stripes were drawn behind it. Basically, you have to copy the glyph outlines and adjust them to cover the entire "3d" area and then use that shape to define your clipping mask. </p>
      <p>At least that's what I did to make this: <a class="freelinking external" href="http://jtodddesign.com/graphic_design/images/acposter3.jpg" rel="nofollow">http://jtodddesign.com/graphic_design/images/acposter3.jpg</a></p>
