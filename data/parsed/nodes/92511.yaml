    html: |-
      <p>It looks like a pseudo 3D effect for the example shown. You can get a shape behind it with the blend tool in illustrator (with very small steps) or make the shape manually.</p>
      <p>I suspect the example was done manually, to get the words perfectly in line with the 'shadow' though.</p>
