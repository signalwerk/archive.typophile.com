    <p>Hello,</p>
    <p>I'm looking for a way to create striped drop shadows on typography in Illustrator, but haven't found a way to do it properly.<br>
    I've attached an example of what I'm trying to do. You'll notice that the stripes are always equally spaced end to end and always start on a full stripe.<br>
    The example is from Tiboro Design.</p>
    <p>Thanks!</p>
