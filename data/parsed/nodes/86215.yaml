    html: <p>You may also want to look into the MUFI character recommendation <a class="freelinking external" href="http://www.mufi.info/specs/" rel="nofollow">available online here</a>. It deals with many Latin abbreviations in typography. MUFI was responsible for encoding a number of them in the A720-block of the Unicode standard.</p>
