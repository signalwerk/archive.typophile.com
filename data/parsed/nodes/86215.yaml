  html: |-
    <p>Can anyone assist with some online references (scans of books are fine if that's what's available) regarding the Latin scribal abbreviations and typographic breviographs of the 16th to 18th C.?  I have found references for the scribal abbreviations of the early medieval period, though not particularly detailed ones, and the typographic usages in the 16th C. were very significant and not always the same at all.  For example the use of a macron over a terminal u to signify um or a symbol similar to a q; to indicate que.</p>
    <p>For an example of the types of works, see the scan on the right for this page of <a class="freelinking external" href="http://la.wikisource.org/wiki/Pagina:De_Nobilitate_et_Praecellentia_Foeminei_Sexus,_Agrippa,_1529.djvu/26" rel="nofollow">Heinrich Agrippa's De Nobilitate et Praecellentia Foeminei Sexus</a> or the same with respect to this page from <a class="freelinking external" href="http://la.wikisource.org/wiki/Pagina:Utopia,_More,_1518.djvu/67" rel="nofollow">Thomas More's Vtopia</a></p>
    <p>Ideally, I'd like to find a reference that goes into great detail as to all the variations.  In a pinch I'd take titles of books I might be able to find through a brick and mortar library or even order online, but I expect there are references that just aren't coming up in my searches.</p>
    <p>English references would be preferable, but German or French would be better than nothing.</p>
    <p>Gruß,<br>
    Doug</p>
