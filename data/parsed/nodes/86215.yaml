      <p>The standard work for palaeographic document study is Adriano Cappelli's <em>Dizianario di Abbreviature Latine et Italiane</em> and, for English documents, <em>The Record Interpreter</em> by Charles Trice-Martin. But these both deal with manuscript abbreviations, rather than typographic, and are illustrated by written forms.</p>
      <p>There is an electronic reference, based on Cappelli, if I recall correctly, but expanded and using blackletter type. It is called <a href="http://www.ruhr-uni-bochum.de/philosophy/projects/abbreviationes/index.html" rel="nofollow">Abbreviationes</a>. It used to be available as a Mac app, but now seems to be in more formats. There is a license fee.</p>
