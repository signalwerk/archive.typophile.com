      <p>#4: the green leaves are too heavy compared to the desired/implied light and airy effect of the cloud shape. they look disconnected. and the space where there are no seeds on the berry is distracting...why not just have the seeds all over the strawberry image instead of stopping the pattern around the cloud shape.  lastly, and most noticeably to me personally, is the chocolate drip. it does look unappetizing...i think the drip is to long...is there some way you could incorporate the cloud shape with the chocolate so that those 2 elements combine to make the chocolate covering? make sense? this would also help simplify the illustration. </p>
