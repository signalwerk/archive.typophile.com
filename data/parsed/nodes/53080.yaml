    html: |-
      <p>Just a few things that jump out:</p>
      <p>- The size of the text will be very small when the logo is used at smaller sizes<br>
      - Elements of the logo are not very robust, such as the outlines on the leaves, and the seeds, these too won't stand up at smaller sizes.<br>
      - Colour-wise fewer is better, so I'd lose the orange colour of the seeds and stick with a fresher green, a punchier red, and a richer brown.<br>
      - The execution needs to be more stylised, and more like an actual strawberry. The leaves could be a single shape incorporating a stalk rather than a lot of separate elements, and the fruit should be more heart shaped. Also the chocolate drip should be a lot more inviting, maybe it needs a little highlight to make it look glossy?</p>
      <p>Good luck with it!</p>
