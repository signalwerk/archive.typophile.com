      <p>@meister: I think some 'fonts' are simply letters cut for certain purposes and don't have digital equivalents, in the case of Andy Warhol's grave, that could be the case. A gravemaker's machine that sets type on film for sandblasting. But i couldn't tell you anything else. I simply don't know.</p>
      <p>This is a great thread, though morbidly interesting.</p>
