    <p>I'm looking for a companion text font for use with heads in Chalet Comprime. We're using Cologne 80 and MilanSixty weights in allcaps.</p>
    <p>It's for print, specifically a 30 pg booklet for starters. Type will be larger than a typical book.</p>
    <p>I'm just starting to look at possible combinations and would really appreciate any input.</p>
    <p>thanks</p>
