    html: |-
      <p>I really like these. They'd be really great on a voting website, as some Oscar party-throwers have.</p>
      <p>I'd stick to the script type for the titles and stick to red-black-gray; it's very classy (the green kind of sticks out).</p>
      <p>The help and extremely loud could use more work; they don't have the elegance of the other treatments.</p>
      <p>But, hey, doing logo sets is one of the rougher tasks in graphics.</p>
