  html: <p>Does this font exist from any foundry? I’m a production manager at an agency where naughty young designers have specified Frutiger condensed as part of a corporate identity, and now we’re fudging when we need Frutiger condensed italic. Is there another font that would pass for Frutiger cond ital?</p>
  html_clean: <p>Does this font exist from any foundry? I’m a production manager at an agency where naughty young designers have specified Frutiger condensed as part of a corporate identity, and now we’re fudging when we need Frutiger condensed italic. Is there another font that would pass for Frutiger cond ital?</p>
