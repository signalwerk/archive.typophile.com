      <p>Give Myriad Pro Condensed Italic a try. Myriad is also called the better Frutiger. - Frutiger itself dont loved the idea of a true italic, but the market demanded, so Linotype made it. Have a look to Linotypes Frutiger Next. They used the italic model of Myriad for their version, but not for the condensed ones.</p>
      <p>—<a href="http://www.astype.de" target="_blank">astype.de</a>—</p>
