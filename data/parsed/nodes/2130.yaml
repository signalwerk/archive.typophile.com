    html: <p>Pierre Simon Fournier had a similar hand script. Some  <br>digital interpretations include <a href="http://www.mvbfonts.com/html/fonts/chanson/pk_chanson.htm" target="_blank">Chanson d'Amor</a> and <a href="http://www.lineto.com/content.html?ID=161&amp;dir_id=66" target="_blank">Batarde Coulee</a>. <br> <br>And I should probably mention the quaint <a href="http://www.myfonts.com/fonts/linotype/fournier-mt/" target="_blank">Fournier Italic</a> itself.  <br>He must have been influenced by Moreau.</p>
