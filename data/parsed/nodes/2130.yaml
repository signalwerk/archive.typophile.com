  html: <p>I was just browsing through my copy of Fonts &amp; Logos, when my eyes lighted on reproductions of Pierre Moreau's  1644 script type (p.178 and elsewhere). Has there been a digital revival of it? My google searches only turned up links to book auctions selling samples of his work. I was thinking it might make a dandy of an italic. Anyone know? <br> <br>Thanks, <br>Randy</p>
