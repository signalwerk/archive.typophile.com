    html: <p>Good eye Yves! That sample is one of the old (i.e. small) ones in the Guide. E + F sells it as <a href="http://www.myfonts.com/fonts/ef/ballantines-script/ef-bold/testdrive.html?s=A.H.S.&amp;p=60" target="_blank">Ballantines Script</a>, and it has also been sold under the names  Diana and Goddess, according to Dan Solo's collection, and Dianna, according to the old Phil's Photo book. I don't doubt that there were other names,because this script shows up at various freeware sites with different names yet.</p>
