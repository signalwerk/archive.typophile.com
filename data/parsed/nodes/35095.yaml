  html: |-
    <p>I'm mainly working on the et since I think it receives a little more work, but what style is the commonly used in Irish?  Most of the examples I see all have a top that correspondes to a the top bar of a z, but from there there seems to be a range of finishing strokes:</p>
    <ul>
    <li>diagonal descender, the "lowered 7"</li>
    <li>diagonal finish at baseline, a "stubby 7"</li>
    <li>a long descender finishing curved leftward, like a j</li>
    <li>a normal stroke with or without serif, like an i</li>
    <li>a normal stroke with a rightward curl, like a t</li>
    <li>a diagonal finish at baseline plus rightward curl.</li>
    </ul>
    <p>Which of these would be most common?  The road sign examples I find on wikipedia are all sans serif, so while I like the appearance of the last one, I'm not sure how "readable" it would be, or weird-looking.  A lot of the other examples I can find online are all from the middle ages, and so not too much help for my font.</p>
    <p>I've inluded a document with article one of the UDHR in Irish, replacing agus with ⁊, and repeating it for each of the above described variants.  Any suggestions or other variants that y'all know of?</p>
