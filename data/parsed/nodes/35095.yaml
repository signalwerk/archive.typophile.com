      <p>It is normal for a diagonal or a perpendicular stroke to descend below the baseline. On the rare occasions when the vertical stroke doesn't descend below the baseline the entire character is reduced in size so that the horizontal element is proportionately smaller.</p>
      <p>Concerning the examples on the pdf:<br>
      1 is fine.<br>
      2 and 6 would be acceptable, but I'd shorten their horizontal strokes to maintain the overall proportions of the characters.<br>
      3 and 4 are unnatural. A short line is sometimes found at the bottom of the vertical stroke, but it doesn't take the form of a hook - rather it resembles a half serif.<br>
      5 is unrecognizable - if I had to guess I'd say it was a "j". Hooks are out, and left-facing hooks are completely out.</p>
