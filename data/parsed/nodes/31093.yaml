    html: |-
      <p>Are you intending for it to be an 'omni' alphabet? Because at the moment, you are using for example, the 't' in it's uppercase form, which makes it a bit less legible; the t bears resemblance to the 'r' right now. I also think the cutting of the 'u' doesn't really serve a purpose, while the cut on the 'n' is nice.</p>
      <p>Nevertheless, I think it's an interesting display font, especially if you add some weights to it. I really like the consistence in curves in 'a', 'e', 'n' and 'g'. I really like the quirkyness of letters like the bdqp, and the 'v' is amazing. </p>
      <p>edit; oh, and those numerals are very appealing!</p>
