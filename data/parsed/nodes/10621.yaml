  html: "<p>I have been trying desperately to find a method of converting a .FON file into a .TTF file, this is for the reason that it does not seem possible to use the installed .FON file in Flash. <br> <br>Fontlab doesn't seem to like the font either, not allowing me to import it: <br> <br><a href=\"http://www.tomasgriffin.com/stupiderror.JPG\" target=\"_blank\">http://www.tomasgriffin.com/stupiderror.JPG</a> <br> <br>(Yes, I do know how stupid the error message is!) <br> <br>If you guys have any suggestions or solutions, they will be much appreciated. <br> <br>Many thanks, <br>Tom</p>"
