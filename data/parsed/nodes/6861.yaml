    html: <p>It's not really a font, it's engraved lettering. I wouldn't be surprised if it were something like <a href="http://www.scottmachine.com/scott.htm">standard style</a> of a Scott Master Engraving Font. That said, I would be shocked if there weren't DTP fonts (probably free) around.</p>
