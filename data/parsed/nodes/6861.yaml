  html: "<p>Hola, folks. I'd appreciate a little assistance in trying to identify a certain font.  <br> <br><a href=\"http://www.shunn.net/mormon/terror/img/nametag.gif\" target=\"_blank\">http://www.shunn.net/mormon/terror/img/nametag.gif</a> <br> <br>The first line, not the serifed font below. <br> <br>I've looked it up on a font identifier, which told me Avenir and Arial Curved Bold, neither of which can actually work for this font, as their O's are round and larger than the average letter. I don't think it's monospaced, but I could be wrong. Here's another sample: <br> <br><a href=\"http://mikeli.image.pbase.com/u6/jhales/small/981811.John11701003.jpg\" target=\"_blank\">http://mikeli.image.pbase.com/u6/jhales/small/981811.John11701003.jpg</a> <br> <br>Thanks in advance.</p>"
  html_clean: "<p>Hola, folks. I'd appreciate a little assistance in trying to identify a certain font.  <br> <br><a href=\"http://www.shunn.net/mormon/terror/img/nametag.gif\" target=\"_blank\" class=\"link-external\">http://www.shunn.net/mormon/terror/img/nametag.gif</a> <br> <br>The first line, not the serifed font below. <br> <br>I've looked it up on a font identifier, which told me Avenir and Arial Curved Bold, neither of which can actually work for this font, as their O's are round and larger than the average letter. I don't think it's monospaced, but I could be wrong. Here's another sample: <br> <br><a href=\"http://mikeli.image.pbase.com/u6/jhales/small/981811.John11701003.jpg\" target=\"_blank\" class=\"link-external\">http://mikeli.image.pbase.com/u6/jhales/small/981811.John11701003.jpg</a> <br> <br>Thanks in advance.</p>"
