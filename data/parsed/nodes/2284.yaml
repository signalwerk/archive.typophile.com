  html: <p>Anybody spend an inordinate time looking at the type on Movie Posters? Video store, theater. Anbody go see movies? <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>I've seen some amazing type treatments lately, yet still, way too much Impact and Trajan. <br> <br>Anybody know of some good archives of old Movie Posters? New ones? <br> <br>two right away are movieposters.com and allposters.com. <br> <br>Anybody have any good stories about movie logotype creation or funny usage examples ?e.g. Scarface = Palatino. <br> <br>Post some stuff here. I'm going to note some good and poor examples that I see on my next visit to the video store. <br> <br> <br>This movie isn't out yet, but here's an example of a great opportunity missed, or maybe an inentional movie poster non-sequitir? <br> <br>The treatment didn't work for me. <br> <br><img src="http://www.typophile.com/forums/messages/30/2168.jpg" alt="fear.jpg"></p>
