    html: <p>What kind of organization is this, and what message are they needing to send to the audience?  Right now the style looks like an old game show, or a vintage cooking product.  I don't get faith and family from this treatment.  Maybe you could describe a bit more about what the brief demanded and how this fulfills it?</p>
  - id: 434181
    user_id: 18175
    user_name: Wesley.Bancroft
    user_path: null
    date_raw: 14 Oct 2010 — 3:26pm
    date: 2010-10-14T15:26:00
    votes: null
    html: |-
      <p>This is intended for a non-denominational Christian project. The message I was trying to send is a friendly one, with heavier, slightly rounded type without being to bubbly. I wanted to make it look slightly classic since the concept behind the project is that tradition drives family. The client also does not want to scream that this is a Christian logo, with crosses, beams of light and halos. </p>
      <p>I agree, the final does need to be cleaned up a bit with the center part locking the piece together. I like the idea of opening up the counters in the 'f' characters to make it look more like a staff with a cross in it, rather than the ankh symbol. What do you guys think, anymore suggestions? Should I try a version without the type treatment?</p>
      <p>@evanbrog My wife said the same thing once she saw it, but she is Egyptian so it makes sense for her to see an ankh rather than an implied cross. In all honesty the 'f's in the logo are an homage to The Artist Formerly Known as Prince. ; )</p>
