      <p>The f sort of reminds me of this Egyptian ankh symbol--which from my brief search has something to do with the sun.</p>
      <p><a href="http://wankh.com/images/ankh_symbol/ankh_symbol_385x261.jpg" title="http://wankh.com/images/ankh_symbol/ankh_symbol_385x261.jpg">http://wankh.com/images/ankh_symbol/ankh_symbol_385x261.jpg</a></p>
      <p>But considering the word faith, might I ask, is it relevant to associate the mark with Christianity? If so, the f could be prodded into a shape more reminiscent of the shepherd's staff (which it also reminds me of).</p>
