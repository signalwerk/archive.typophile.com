      <p>Overprinting is turned off? Dumb question but you never know.</p>
      <p>Stick with .ai in ID, it loves native files.</p>
      <p>Since you have tried so many formats already, it almost seems like the transparency has to be coming from ID. Make a new container box and re-place the file. You've probably already tried this but you never know…</p>
      <p>Your container box is set to Normal blending mode in the transparency palette?</p>
      <p>That's about all I can think of right now…</p>
      <p>Best of Luck!</p>
      <p>peace</p>
