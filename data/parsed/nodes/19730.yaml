    <p>Sorry if this is not typographic enough for the site, but I saw some more general questions being asked here as well. Also, I have only just started using ID, so apologies for ignorance in advance!</p>
    <p>I have placed a white Illustrator .eps logo file into ID CS1 in front of a dark red background, and the logo keeps appearing with a tint of the colour behind. It will just not appear white. I have also tried an .ai file, and even a rasterised Photoshop .eps with a clipping path, and the same thing happens. When I produce a PDF from the ID file it appears the same again. I just wondered if anyone could tell me anything that I am doing wrong that is obvious? I have gone through every menu I can think of re background, transparency, trapping, etc. I am at a loss!</p>
    <p>Any help gratefuly received!</p>
