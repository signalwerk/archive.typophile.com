  html: |-
    <p>Hey guys,</p>
    <p>Any one recognise this condensed sans serif?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/collider_4841.jpg"></div><p></p>
    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/capearcona/ca-normal/medium/" rel="nofollow">CA Normal Medium is very close</a> but doesn't have the slants on the top of the "L" and "I". That could of course just be a customisation, but the "O" is also different (hard sides on CA normal). Futhermore, the "C" and "R" seem to have slightly different proportions.</p>
    <p>Cheers,</p>
    <p>Dylan</p>
