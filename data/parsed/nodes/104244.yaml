      <p>Thank you very much for your help, Don. As disappointing as the answer might be, it makes much more sense now. And at least I know I'm not missing some obvious answer everyone else could spot in a second. </p>
      <p>It's for a Harlequin parody, so although I still need to match the font, I can work with what I have and cobble together a few names.</p>
      <p>Who'd have thought Harlequin Presents would be so crafty?</p>
      <p>Thanks again for the answer. You've saved me a lot of time!</p>
      <p>Sean</p>
