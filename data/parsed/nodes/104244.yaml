    html: |-
      <p>Your effort to post an extensive set of letters is appreciated.<br>
      I suspect this is a font the company uses for its brand image and would not wish to see it sold or elsewhere.<br>
      Copyright laws, at least in USA, suggest that if you did get a copy of the digital data for the font it would probably be unwise to use it.<br>
      As for the base font, i.e. before the swashes, one of our typophiles may identify a spot on match. So far I have not found a full match with the spurless C &amp; S, outbowed legs on K &amp; R, left cusp at the apex of A, and splayed M. Your letters have some resemblance to <a href="https://klim.co.nz/retail-fonts/tiempos-headline/" rel="nofollow">Tiempos Headline Bold</a>.<br>
      Don</p>
