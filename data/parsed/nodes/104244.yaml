    <p>I've been wracking my brain and searching my type books trying to identify the typeface regularly used on the cover of vintage Harlequin romance novels, but so far I've had no luck.</p>
    <p>The good news is I have an extensive sample character set:<br>
    <a href="https://dl.dropbox.com/u/17582217/FileChute/harlequin_sample.png" title="https://dl.dropbox.com/u/17582217/FileChute/harlequin_sample.png">https://dl.dropbox.com/u/17582217/FileChute/harlequin_sample.png</a></p>
    <p>It's not Tiffany, though some of the letters are clearly close. </p>
    <p>Does anyone have any guesses? This is driving me crazy!</p>
    <p>Thank you in advance for any help!</p>
