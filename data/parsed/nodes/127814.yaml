  html: |-
    <p>While there are many similar fonts, I can't seem find an exact match for this one, where the P and R are matched to the mid pin in the E and with a matching C as well.</p>
    <p>Anyone else recognise the exact font used for this metal lettering?</p>
    <p>I've tried my best to clean up the original photo and turn it into black on white, but of course it's supposed to be all clean and not “weathered”.</p>
    <p>And given that it's metal lettering on a wall, it may of course not even be a font, per se, but I thought I'd at least check if anyone here recognises this one.</p>
    <p>Cheers!</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/font-id/font-check_0.jpg" width="771" height="630" alt="Metal lettering on wall, font check" title="Metal lettering on wall">
