  html: |-
    <p>I spotted this faux bamboo brush lettering on the Survivor TV show for the tribe names Galang &amp; Tadhana.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/SurvivorTribesGalangTadhana_4756.jpg"></div><br>
    I was only able to find very small images. This is as clear as I can make the letters. I had more success with Galan than Tadhana, which has a dark background, which accounts for differences in the letters.<br>
    Does anyone have any information on whether Survivor used an existing font?<br>
    If there is not a known font, I would be interested to see any additional letters.<br>
    Thanks.<br>
    Don<p></p>
