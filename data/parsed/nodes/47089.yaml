    <p>Hi,<br>
         I don’t know if this is a really easy identification or not, but does anybody know which typeface was used for the early editions of James Joyce’s Ulysses?  Shakespeare and Company had it printed by Maurice Darantiere in Dijon, if that bit of information helps.  </p>
    <p><a class="freelinking-external" href="https://web.archive.org/web/20080828053526/http://www.sc.edu/library/spcoll/amlit/paris/utitle.jpg">Ulysses title page</a></p>
    <p>Hunting around I came across this <a class="freelinking-external" href="https://web.archive.org/web/20080828053526/http://www.typophile.com/node/33033 "> thread</a>, but the later American editions are set in something else.  </p>
    <p>Thanks,<br>
    James</p>
