    html: |-
      <p>Hi Eben</p>
      <p>Well I just googled "musee imprimerie nationale france" and got <a href="http://www.imprimerie.lyon.fr/imprimerie/" rel="nofollow">the local museum.</a> Although <a href="http://www.garamonpatrimoine.org/news.html" rel="nofollow"> this alternative site </a> might be more interesting.</p>
      <p>If you're in Paris and you like votive statuary and inscriptional type, the cemetery Pere Lachaise is what we might call ’dead good'! They have a <a href="http://www.pere-lachaise.com/perelachaise.htm" rel="nofollow"> nice site </a> too.</p>
