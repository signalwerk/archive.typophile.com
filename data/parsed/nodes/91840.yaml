    html: |-
      <p>Thinking though the glyphs have so far very much grown organically from the original g, they do not quite mix with it, as a significant (probably) important part of the g has been cut off.  and so, this..</p><div class="imageWrap"><img src="http://typophile.com/files/shear05_6504.png"></div><p></p>
      <p>I put up a rectangle across the glyphs of a matching height to what the g already had.  I had it suspended across the whole set at first, but that was too extreme, so I opted to keep it only over half of a  glyph.  Or maybe not at at, such as in 'a' and 'o.' Or a third as in 'm'.</p>
      <p>what do you think about the 'n'? I think i may remove the cross cut there as it makes the glyph look, rather like a small cap 'B' actually. Or perhaps an 'R'. Actually i think i will refer to this glyph as is when I get to the 'R.'</p>
