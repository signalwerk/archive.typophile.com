    <p>hey all, as im sure a lot of people here would be on the hunt for these books this might be a worthless post... but anyone have any ideas on places to look for the old photlettering books like the ones on <a href="http://photolettering.com/" title="http://photolettering.com/">http://photolettering.com/</a> ? i have the 2 thesauruses (thesaurusi?), but im on the lookout for some of the old smaller books like the ones piled up in the photo in the background.</p>
    <p>i assume there must be some around in nyc somewhere... but id prefer to not have to resort to gallaghers and pay 200 bucks a book.</p>
    <p>thanks for any help!<br>
    justin</p>
