      <p>Occasionally one will show up on eBay. Not often though. A copy of <em>Psychedelitypes</em> sold a few weeks ago. And there are several people looking for them on eBay.</p>
      <p>You can also use bookfinder.com and abebooks.com. Between the two they cover most of the online dealers in the U.S. and several in Europe. Do periodic searches for "photolettering" and "photo lettering."</p>
      <p>George<br>
      I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
