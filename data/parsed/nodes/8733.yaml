    <p>Aren't we visual communicators?  <br> <br>If we take the definition of artist, "a person whose creative work shows sensitivity and imagination", then yes I would say I'm an artist. But isn't it kind of loaded to use the term artist? Should communication come before art? I suppose you could say "communications artist" but that sounds loaded too. I would think that "sensitivity and imagination" is assumed of all people that are creative and part of the problem, err I mean reason, of why they persued a career in the creative world. I suppose this is my knee-jerk reaction to someone who says, "noooo, I am an artiste!"</p>
