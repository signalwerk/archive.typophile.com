    html: "<p>'art' or 'Art'? <br> <br>The difference is really one of intent and tradition. I'm sure we all know what the difference is.  When I make a painting, even a digital one, it is Art (or fine art (it doesn't have to be good to qualify)), the making of a fine peice of design is an art.  If your the making of your designs is an art then you are a good designer, if your paintings hang in a gallery you are an artist. <br> <br>John,  <br> <br>&gt;\"There is no grammar of visual imagery, there is no syntax, there are no rules of morphology: there is nothing in it that makes language language.\" <br> <br>I have to disagree with you.  Of course it all depends on the definition of the word language, but assuming it means something along the lines of a system of comunication that is agreed upon by the group of people that use it, then images certainly have a linguistic properties, with a full grammer and syntax. <br> <br>Taking line drawings as an example.  What does the line represent? In simple line drawings, it is commonly agreed (it's grammer) that a line represents an edge or division. This is arbitrary, it is a social construct.   <br> <br>Conventions of perspective are another grammer of imagery.  From full on renaisance three point perpsectives, to cubism, to simple drop shadow. They are all grammers necessary to show how objects ought to be arranged by our mind when we percieve the image. Perhaps analagous to word order in a sentance. <br> <br>I would go on to argue that nearly all qualities of images are subject to conventions such as these.  Even in photographs. Even the use areas of light or dark colours to show shadows and highlights. This is essentialy linguistic, in that they need to be agreed before being understood. <br> <br>Abstract painting is intersting in this respect, but I would say subject to the same rules.  Abrstact Expressionism seems to me to have been built on a fraud, at least as far as its emotional content is concerned. <br> <br> <br>Ed. <br> <br>ps.  I hope that makes sense.  I wrote my dissertation on this, but am several thousand kilometers from my books at the moment.  I've been a lurker for a while on these forums and have learnt a lot, but now I've decided to jump in...</p>"
