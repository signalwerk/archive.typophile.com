    html: "<p>more decon: <br> <br>like visual symbols, words are just signs that make reference to things and ideas without actually being connected to them in any way beyond the connections that we give to them. If you called me a gazelle, i'd hafta laugh, i'm not that fast; if you called me a cornflake i may be offended because i can be a bit flighty... one of the greatest features of symbols is that they don't mean \"exactly\" anything. there is a certain amount of \"play\" where a symbol can be more literal or more figurative. <br> <br>Words can be just as arbitrary as visual symbols. In a class on lanugage and culture the story was told of a fire that was started in a factory that all began when a sign was misread that said \"Empty Gas Drums\". Knowing the outcome, i'm sure you know what that meant, but those at the factory understood an entirely different meaning. <br> <br>John, i think it's humorous that you're championing language as a superior communicator of ideas in a thread that is basically an argument between the meaning of (verbal) terms. <br> <br>I am fascinated by verbal language. I believe there's good reason to call the study of it language arts. i think it's beautiful to be able to choose words as an artist would choose her pallette to convey different shades of meaning, but in the end it is the reader who decides what the text means, no matter what the author intended it to mean. <br> <br>that's why i think making a distinction between \"designer,\" \"artist,\" \"communicator,\" etc. is bunk. to me. these terms overlap but have slightly different meaning, but you could choose any one and i think i would get the general understanding of what you are trying to convey - so call yourself what you want.</p>"
    html_clean: "<p>more decon: <br> <br>like visual symbols, words are just signs that make reference to things and ideas without actually being connected to them in any way beyond the connections that we give to them. If you called me a gazelle, i'd hafta laugh, i'm not that fast; if you called me a cornflake i may be offended because i can be a bit flighty... one of the greatest features of symbols is that they don't mean \"exactly\" anything. there is a certain amount of \"play\" where a symbol can be more literal or more figurative. <br> <br>Words can be just as arbitrary as visual symbols. In a class on lanugage and culture the story was told of a fire that was started in a factory that all began when a sign was misread that said \"Empty Gas Drums\". Knowing the outcome, i'm sure you know what that meant, but those at the factory understood an entirely different meaning. <br> <br>John, i think it's humorous that you're championing language as a superior communicator of ideas in a thread that is basically an argument between the meaning of (verbal) terms. <br> <br>I am fascinated by verbal language. I believe there's good reason to call the study of it language arts. i think it's beautiful to be able to choose words as an artist would choose her pallette to convey different shades of meaning, but in the end it is the reader who decides what the text means, no matter what the author intended it to mean. <br> <br>that's why i think making a distinction between \"designer,\" \"artist,\" \"communicator,\" etc. is bunk. to me. these terms overlap but have slightly different meaning, but you could choose any one and i think i would get the general understanding of what you are trying to convey - so call yourself what you want.</p>"
