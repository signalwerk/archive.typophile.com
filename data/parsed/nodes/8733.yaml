    html: "<p><i>Aren't we visual communicators?</i> <br> <br>In application, that is often a very bogus term, since much of what graphic designers do is not communicative at all; it is at most evocative and even then tends toward the hopeful rather than the proveable: one hopes that the choice of colour and arrangement of elements <i>suggests</i> something to the viewer that will evoke the desired response. This is not communication. Communication is the transfer of an <i>idea</i> from one mind to another, measurable by the accuracy of the transmission. Despite the barrage of visual imagery in our society, the vast majority of communication is still linguistic, either verbal or literary. The only true 'visual communicators' are people who work with information design systems, which codify mental concepts using symbolic equivalents.</p>"
