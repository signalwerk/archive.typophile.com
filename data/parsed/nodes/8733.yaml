    html: <p>&gt;measurable by the accuracy of the transmission&lt; <br>Communication occurs whether it is measurable or not.  Just because it is easier to measure word transmissions does not mean they communicate any more effectively than visual transmissions.  As humans, we tend to give greater value to things we can easily measure.  We call this data so it sounds oh so scientific. We don't want to point out the shortcomings of the human race so we ignore things we have no data for.  One day when we are smart enough to figure out how to measure more abstract things, they will suddenly become valuable.  Until then we just focus on only the data we have been smart enough to collect.  Was it as easy to measure the communication that took place in the nonverbal video of the Rodney King incident? Not easy to measure.  Was there visual communication taking place? You dag gum betcha.</p>
