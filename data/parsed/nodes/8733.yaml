    html: <p>You should call yourself what you feel you are - and that's the most you <i>can</i> do. <br> <br>Nothing exists in a pure state - so nobody is totally an artist or totally anything. That said, it's highly useful -and necessary- to consider <i>concepts</i> as being pure. For example pure Art is when you create something motivated only by the need to express yourself - which of course never actually happens. But there is some Art in any act of design. The key thing though is that -for the act to cross a certain threshold into Design- this need to express has to be an unintended, or at least an undirected, force, emanating inescapably from your human-ness, sort of <i>in spite</i> of yourself. For example, if you make an upright Italic simply because you've "always wanted to", or if you believe that  design comes from the urge to create, then you're being mostly an Artist; mostly selfish. Design comes more from a desire to <i>serve</i>. <br> <br>&gt; we tend to give greater value to things we can easily measure. <br> <br>Very true. Especially in the West. <br>"If you can't count it, it doesn't count." <br>Totally bogus, duh. <br> <br>hhp</p>
