  html: |-
    <p>Hi all,</p>
    <p>Is there a way of simultaneously selecting a bunch of kerning pairs in a font (not all), e.g. in the Kerning Table, so that you could then modify them using the Adjust metrics command? I'm running FontLab Studio 5.0.4 on Mac OS 10.4.10.</p>
    <p>Sorry if this has already been addressed; my search of Typophile wasn't so thorough.</p>
    <p>Olli</p>
