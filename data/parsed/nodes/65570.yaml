  html: |-
    <p>[[http://www.microsoft.com/typography/links/News.aspx?NID=6427|An article about Verdana]] from Microsoft. Six paragraphs down in the last sentence you read:</p>
    <p>"…<em>In a 2005 study of legibility, comparing six commonly used text fonts, Verdana (especially in combination with Microsoft’s ClearType technology) was found to be the most legible</em>."</p>
    <p>Can anyone cite this study?</p>
