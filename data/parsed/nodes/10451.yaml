    html: <p>You could email <a href="mailto:stephensonandblake@btconnect.com">stephensonandblake@btconnect.com</a> which is some of the people from the late, lamented Stephenson Blake. <br> <br>They aren't doing cast stock alphabets, but they do very good CNC machining, we use them for high frequency welding electrodes. <br> <br>Address your enquiry to Neville Buckle.</p>
