  html: <p>Hi Guys and Gals, <br>here is my first attempt at making a font, I'm using fontographer 3.5 I had no idea how it worked when I started (although I do use llustrator and photoshop everyday), and I have only a little more now. <br> <br>I am completely new to the world of typography and font creation and this font has been created as a titling font for my boyfriends new comic (published late november). <br> <br>All comments welcome, it is meant to be quite quirky, but any technical criticisms may need to be explained as I haven't got all the terminology down pat yet. <br> <br>Anyway that's enough rambling let's get on with it. <br>be gentle. <br>Jen <br><img src="http://www.typophile.com/forums/messages/29/2956.jpg" alt="under"></p>
