    html: <p> Thanks mike 0 I think I'll move it back to around baseline. <br> <br>Mr Hrant, <br>Thanks for replying! Can you suggest any resources (online or off) where I might find this sort of information. I've heard a lot about kerning pairs without actually know what the pairs are, is this what you are talking about in relation to which letters i bump? <br>jen </p>
  - id: 28769
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 2 Nov 2002 — 12:46pm
    date: 2002-11-02T12:46:00
    votes: null
    html: "<p>Kerning pairs are meant to fix horizontal spacing anomalies (too much/little space between glyphs, like between the \"Ty\" pair), so they benefit from linguistics too (although arguably less); but kerning pairs are not inherently related to the \"bumping\" as far as I can think. <br> <br>A good source? Cryptanalisis/cryptography. I use some books I have, but here's the top Google hit for \"cryptanalysis digraphs\": <br> <br><a href=\"http://www.umich.edu/~umich/fm-34-40-2/\" target=\"_top\">http://www.umich.edu/~umich/fm-34-40-2/</a> <br>(Appendix A and on.) <br> <br>BTW, you can/should also look at the most frequent *words* (which will quickly show you the most serious problematic situations), and for the top 100 in English you can look at the far right of: <br><a href=\"http://www.themicrofoundry.com/s_quality.html\" target=\"_top\">http://www.themicrofoundry.com/s_quality.html</a> <br> <br>But frequency is only part of the picture. There are very many words that are not common but do cause unfortunate spacing - \"spikes\" in language; which is why most type designers use long premade/canned lists of pairs/words to check their work. I wouldn't worry about those for your \"bumpiness\" (since things have to average out anyway), but for the \"higher reaches\" of spacing (where adding a kerning pair doesn't hurt anything else) you need that too. <br> <br>hhp</p>"
