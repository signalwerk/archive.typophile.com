    html: <p> I would reduce the word spaces down to at least half what they are now.  <br> <br>Also, I think the baseline is unnaturally even for a style like this. I would let it vary about the same amount as the x-height. A good way to think about it is to imagine an invisible line about halfway up the x-height. The lowercase letters should appear to be bouncing slightly up and down from this line. Right now, it looks like they are all sitting solidly on the baseline which fights against the lively, unhinged quality of the font. </p>
