    html: <p> I think you went a bit too far on the bouncing effect, but the word spacing looks much better. I would tend not to bump letters up that are already tall (those with ascenders) or down for those that have descenders. You don't want to be too obvious about it either. Set lots of different words and adjust anything that calls too much attention. </p>
