    <p>I just bought this mysterious font family on MyFonts. <a href="http://www.myfonts.com/fonts/stawix/crique-grotesk/" title="http://www.myfonts.com/fonts/stawix/crique-grotesk/">http://www.myfonts.com/fonts/stawix/crique-grotesk/</a> (very cheap)</p>
    <p>What do you think of it? I'm looking forward to using this typeface in web/screen work, maybe in display sizes.</p>
    <p>Does it remind you of some other typeface? At first I ran into this font on the web and thought it was another copy of something else. It turns out to be a standalone typeface.</p>
    <p>Anyway, here's a quick specimen (attached). I like what I'm seeing thus far.</p>
