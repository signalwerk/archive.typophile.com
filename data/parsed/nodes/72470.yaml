      <p>Not much of a recommendation - just an observation.</p>
      <p>For a resume I don't think I would worry too much about the staying power - unless you plan on it taking quite a while to find a job :P. I would also suggest picking something that matches your own personal branding if you have any, rather than just picking an obligatory classic typeface etc.</p>
