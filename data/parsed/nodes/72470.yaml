      <p>I've not done my resume for a LOOOOOng tim now, but here goes:</p>
      <p>I'd use Helvetica for the single reason that it's 'invisible'. Your type selection won't get any attention and the employer-to-be will focus only on the information in it, which is what you're after (I guess). He can then dive into your portfolio, which should be chock-a-block full of interesting typeface choices.</p>
      <p>Hope it helps!</p>
