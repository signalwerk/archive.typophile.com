      <p>I appreciate my esteemed colleague’s plug for my site, but TV-interface fonts have to be hacked and dug out so much to be legible on NTSC it’s not funny. I don’t know of any off-the-shelf fonts that work well in those conditions, unless the fonts are huge, but that’s a different story. (So is HDTV.) Chyron etc. fonts are custom-mangled so they look vaguely legible onscreen.</p>
      <p>Can you tell us more about your application?</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
