    <p>Hi, i'm looking for typefaces for a television interface. Legibility is of course important but it's almost as important that it's a space saver for use in EPG:s (the table with different programmes in your digital tv interface).</p>
    <p>I have two so far that looks interesting and wanted to check if anyone out there has experience from something similar or just know faces that are optimized for (tv)screen-use.</p>
    <p>The one i'm the most interested in at the moment is Clearview that have some condensed styles.<br>
    <a href="http://www.terminaldesign.com/fonts/sets/?CID=4" title="http://www.terminaldesign.com/fonts/sets/?CID=4">http://www.terminaldesign.com/fonts/sets/?CID=4</a></p>
    <p>Monotype Screen looks ok as well but no condensed styles<br>
    <a href="http://www.monotypefoundation.org/ProductsServices/tv_fonts.aspx" title="http://www.monotypefoundation.org/ProductsServices/tv_fonts.aspx">http://www.monotypefoundation.org/ProductsServices/tv_fonts.aspx</a></p>
    <p>Cheers</p>
