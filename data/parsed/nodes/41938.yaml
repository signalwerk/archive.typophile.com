      <p>&gt;but TV-interface fonts have to be hacked and dug out so much to be legible on NTSC it’s not funny. </p>
      <p>Joe is correct. Unless you want to burn through a ton of cash I’d suggest going custom and working with a good local type designer who can readily get access to a test rig.  I was involved in an NTSC TV font project (practically no budget) a few years ago, and there was a lot of test and tweak, retest and tweak, rinse, repeat – having a designer available for site visits was invaluable. Basically we started by trying different weights of our fonts until we found the ones that performed best, then adjusted the spacing, character shapes and counter shapes until we got the best results. Finally applied some hints to edge out some artifacts.</p>
