    html: |-
      <p>The tricky part with poets is that half they do, they do for a reason, while the other half just follows from the software. Quite often, what they supply isn't really what they want but the closest they can get (think of people using spaces to make fake-tabs). The issue here is that you can't see what was done intentional or not. Often a change in typeface (which they don't own themselves, but you do) can solve for instance the need for different weights.</p>
      <p>But you can't find out without knowing what their intentions were, and well I can't expect you to go and contact 40 poets and sit down to finetune each of their project. The problem is that as a designer you set the text to readability or rhythm, while the poet (hopefully!) makes their choice based on the mood they want to get across. Of course that's typography as well, but without delving into the mind of the poet, you can't come up with a pretty solution.</p>
      <p>You can try to filter the software induced 'creative' typography from that which was done for a specific reason, and leave the first out. Otherwise you can always (if you are the editor) ask for certain restraints, or come up with a basic shape every poem has to fit, with each a few variables (such as tabs, etc) This of course limits the poet in what he can do, and is not favorable for the medium.</p>
      <p>Of course this all varies on the thoughts behind the book, do poets send in their work? Are they approached to make something?  It can be a pain to set, but the amount of customization of course also depends on the design of the book as a whole.</p>
