      <p>From your other posts, I'm assuming you're a designer who sets type, rather than a typesetter who occasionally designs (which would be me). I think Arthur gave a good answer, to the extent that your question was about lessening frustrations.</p>
      <p>If you are at typesetter, you are selling your skill and your time. The same for a designer, of course, but it is harder to quantify both time and skill in design. Limiting yourself to just the typesetting aspect, charge more money. I find that getting paid for my time usually lessens the frustration.</p>
