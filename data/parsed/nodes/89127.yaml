      <p>Thanks – much appreciated. </p>
      <p>The poets send in their work and if it's selected for inclusion then it's my job to set it – it usually comes in in word documents, a frustrating job of translating into our type style follows.</p>
      <p>This is spot on: "The problem is that as a designer you set the text to readability or rhythm, while the poet (hopefully!) makes their choice based on the mood they want to get across."</p>
      <p>"Typography exists to honor content" as Bringhurst would say, but what if the content is unpleasant typography?</p>
      <p>Ho hum. I'm glad I don't have to set poetry often.</p>
