    <p>Hi</p>
    <p>I put together a book on prose and poetry a couple of times a year – the poetry is causing a real headache to typeset. There's around 40 poems in each issue and the poets are supplying poems with their own 'creative' typography – open leading, bizzare tabbing, alternating weight etc. Is there a way of approaching this type of copy sympathetically? It's very frustrating.</p>
    <p>Thanks</p>
