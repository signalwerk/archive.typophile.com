    html: |-
      <p>It can be hard to tell if unorthodox formatting is deliberate or just a mistake. I often receive articles from clients that have weird formatting quirks that turn out to be just goofs. As Arthus said, you can't know their real intentions without talking to them, which is probably impractical. </p>
      <p>So perhaps the best approach is to just tell them up front that any poetry that's accepted will be formatted in your publication's standard poetry style, and maybe show an example of that style.</p>
