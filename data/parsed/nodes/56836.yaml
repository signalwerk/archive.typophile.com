    html: |-
      <p>This is known problem of Uniscribe shipped with Windows Vista and Office2007. If font forms a ligature consisting of letters on both sides of expected justification point, Uniscribe will ask kashida to be inserted after the ligature. </p>
      <p>Ther is no problem in VOLT, difference in behavior should be caused by different layout tables produced by VOLT and AFDK.</p>
      <p>Thanks,<br>
      Sergey</p>
