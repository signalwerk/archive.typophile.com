    <p>I have made an Arabic font. In Word 2007 when I apply low, medium or high justification the Kashidah i.e. the stretching line within the words sometimes appear at wrong places as shown by the red arrows in the picture below. Is it a font problem? what would be the solution ?<br>
    </p><div class="imageWrap"><img src="https://web.archive.org/web/20130311050431im_/http://typophile.com/files/Word 2007_4660.jpg"></div><br>
    When I tried in OpenOffice there appear three problems.<br>
    1). The kashida appeared at wrong places as indicated by green arrows in the 2nd picture below.<br>
    2). The Marks disappeared from the last letters of each line as indicated by red arrows.<br>
    3). The last marks of some words slipped forward from their respective places as shown by orange arrows.<br>
    Is there any solution for these problems ?<br>
    <div class="imageWrap"><img src="https://web.archive.org/web/20130311050431im_/http://typophile.com/files/OpenOffice 3_5537.0.jpg"></div><p></p>
