    html: |-
      <p>Actually it is a MS Word problem as described by Sergey. It is even Present in MS Word 2010. There are four levels of justifications in MS Word 2010.<br>
      1-Justify<br>
      2-Justify Low<br>
      3-Justify Medium<br>
      4-Justify High<br>
      In the first level no kashida is inserted, only the inter-word spacing is increased. This works fine with all the fonts. While the other three levels of justification destroy most of the text shape in Calligraphic Fonts. These levels work only with linear fonts.</p>
      <p>Thanks,</p>
