    html: |-
      <p>Eben, Word 2007 supports all the layout features necessary for Arabic shaping. It doesn't support purely discretionary features such as [dlig], but it supports all the required features and also those features such as [liga] and [calt] that should be on by default. The Uniscribe Arabic shaping engine takes care of all this.</p>
      <p>What Zuhair's screenshots indicate is a problem between certain states of the Word Arabic justification algorithm and some fonts. The fact that there seems to be a difference in behaviour between fonts with OTL tables generated by VOLT and those generated by FL/FDK certainly is intriguing.</p>
    html_clean: |-
