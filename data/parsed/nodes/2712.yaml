    html: <p>Actually - can someone enlighten me briefly as to what the dickens is a Adobe Sans multiple master. I know what a multiple master is but is the Adobe Sans version something that comes packaged in with Adobe products like Illustrator and InDesign? Sorry if this is a dumb question but I've never come across this beast in my typography travels.</p>
    html_clean: <p>Actually - can someone enlighten me briefly as to what the dickens is a Adobe Sans multiple master. I know what a multiple master is but is the Adobe Sans version something that comes packaged in with Adobe products like Illustrator and InDesign? Sorry if this is a dumb question but I've never come across this beast in my typography travels.</p>
  - id: 21610
    user: 1231
    date: 2004-01-14T21:33:00
    date_raw: 14.Jan.2004 9.33pm
    votes: null
    html: "<p>Adobe Sans and Adobe Serif are multiple master fonts that ATM (Adobe Type Manager) uses to match the exact proportions of fonts that are missing from files generated by Adobe programs, therefore causing no layout oddities even though the original fonts are not present. <br> <br>I guess the \"aaaaaaaaaaaaaarrrrrrrrggggggghhhhhhhs\" are because the font isn't exactly a beauty <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Edit: for clarity.</p>"
    html_clean: "<p>Adobe Sans and Adobe Serif are multiple master fonts that ATM (Adobe Type Manager) uses to match the exact proportions of fonts that are missing from files generated by Adobe programs, therefore causing no layout oddities even though the original fonts are not present. <br> <br>I guess the \"aaaaaaaaaaaaaarrrrrrrrggggggghhhhhhhs\" are because the font isn't exactly a beauty <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Edit: for clarity.</p>"
