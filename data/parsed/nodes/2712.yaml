    date_raw: 14.Jan.2004 12.20am
    votes: null
    html: <p>Aaaaaaaaaaaaaaaaaaaaaaargh!!!... <br> <br>Adobe Sans Multiple Master substitution font. So basically  <br>this is not a font, it's merely a replacement courtesy of  <br>SuperATM, in order to allow you to read the text without  <br>having the typeface installed. <br> <br>For further information on this unnatural phenomenon, <br>check my fine selection of rants and raves in <a href="http://www.typophile.com/forums/messages/83/3075.html#POST8270" target="_blank"> this thread</a>  <br>from just over a year ago.</p>
