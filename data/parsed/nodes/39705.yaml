    <p>Per Goran Soderstrom’s comment about nodes in the <a href="http://typophile.com/node/39661">Traffic System Typeface</a> thread about the quality of curves in a “terribly badly digitized” font, what constitutes a “bad curve”? Eg, if I’m comparing a professionally designed typeface to one by an amateur, what would tell you who did which font?</p>
