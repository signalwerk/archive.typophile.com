    html: <p>Blandness is a good thing with fonts. Normally fonts are a container of information, not a piece of art of themselves (I know this will be disputed by some). To condust their primary goal, of smoothly conveying information, they should not draw attention to themselves. (At least to the normal reader. A typographer will look at type in an altogether different way.)</p>
