    html: |-
      <p>A bad curve has bumps that stick out in like tumors in places they shouldn’t, usually because someone is using too many BCPs. Curves that do no smoothly transition to straight lines when they should can also be considered bad. This sort of stuff is often unnoticeable at text sizes, but in signage it can be pretty gross.</p>
      <p>The easiest way to understand this is to open a font by Christian Schwarz or Hoefler &amp; Frere-Jones and compare them with some of the crappier free fonts out there.</p>
