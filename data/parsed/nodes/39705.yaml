    html: <p>just an observation, but it’s interesting to read the opinion that pure curves are necessarily good. I feel that creating smooth curves in this way leaves me wandering what I am giving away, what I am letting myself being deceived into accepting as ’true’, precisely because they are clean. There’s a funny blandness to smooth bezier curves that inhibits drawing I feel. It takes a while to become confident enough to intentionally throw bumps into the mix. Or maybe that’s simply a case of understanding lettershapes better. I don’t think so. I spent several months painting letters with gouache, and when first drawing by computer, the technology naturally at first inhibited. In fact it did for a long time.</p>
    html_clean: <p>just an observation, but it’s interesting to read the opinion that pure curves are necessarily good. I feel that creating smooth curves in this way leaves me wandering what I am giving away, what I am letting myself being deceived into accepting as ’true’, precisely because they are clean. There’s a funny blandness to smooth bezier curves that inhibits drawing I feel. It takes a while to become confident enough to intentionally throw bumps into the mix. Or maybe that’s simply a case of understanding lettershapes better. I don’t think so. I spent several months painting letters with gouache, and when first drawing by computer, the technology naturally at first inhibited. In fact it did for a long time.</p>
