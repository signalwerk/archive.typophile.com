      <p>Perhaps so, though especially that Z would prevent me from using it at all. I like a bit of tension, especially in display use, but it doesn't seem a good idea to have this vertical cut which can't be found anywhere in the typeface. I suppose it's a matter of taste, but I feel K/OO/R/Z go completely against the core design principle of the font. I can elaborate on why I feel this is the case.</p>
      <p>I'm all for prominent and slightly "off" elements in a display font, but it shouldn't become obtrusive. And to be clear, obtrusiveness is inherently bad. You make it sound as if obtrusiveness is exactly what the fashion magazines are looking for but that is not the case.</p>
