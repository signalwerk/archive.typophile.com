  - id: 586957
    user: 52182
    date: 2014-08-30T18:11:00
    date_raw: 30 Aug 2014 — 6:11pm
    votes: null
    html: |-
      <blockquote><p>I winked.</p></blockquote>
      <p>Damn, even when specified in text I seem to be misunderstanding sarcasm.</p>
      <blockquote><p>That said, I do find most fashion (or fashionable) magazines’ typography obtrusive.</p></blockquote>
      <p>I wouldn't necessarily use the word 'obtrusive' here but I know what you mean. In most cases though there is logic behind the "obtrusive" details. I feel the OO ligature is nice on its own and it's a nice graphical element to use in fashion (the Gucci and Chanel logos basically do the same, and I've seen the double O in several fashionable typefaces) but it just doesn't fit the typeface. It's completely out of place. I feel the same about the Z as it has vertical cuts which are nowhere to be found anywhere else in the typeface. The horizontal cut on K/R is something I've seen in fashion before (Prada does it in their logo as well) but again it doesn't fit with the typeface at all. If you look at the letter shapes of the Prada logo you feel the horizontal cut in R is logical in a sense because the shapes are squared, there are sudden angles and the /A has an extended terminal. Without these aspects the horizontal cut on the leg of /R wouldn't work. Right now it's a bit obtrusive but coherent. With just the horizontal cut it would just be obtrusive. Similarly, I feel the alternates of Beausite lack logic and coherence while the typeface in general is brilliant and beautiful. I suppose I'm just puzzled.</p>
      <blockquote><p>And, it’s not that you need to use the alternates, anyway ;-)</p></blockquote>
      <p>I get that, and I wouldn't. I'm just surprised to see these alternates because I feel they go against the logic behind the typeface.</p>
