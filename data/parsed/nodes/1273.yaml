      <p>Dear Hrant, <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a> is not the inventor of "Hambergevons." However, because of your post, I asked him what he knew about it. He believes—quite credibly, I might add—that the word was created as a test at the <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a> foundry, before the Second World War. </p>
      <p>The "author" would then be <a href="/wiki/Dr.%20Rudolf%20Wolf" class="freelinking" rel="nofollow">Dr. Rudolf Wolf</a> (died 1942), who among other things was the designer of the Memphis type family. <a href="/wiki/August%20Rosenberger" class="freelinking" rel="nofollow">August Rosenberger</a> may have been involved as well. Rosenberger cut several of Memphis' weights, and would later cut designs of Hermann Zapf's, including Palatino.</p>
      <p><a href="/wiki/Otmar%20Hoefer" class="freelinking" rel="nofollow">Otmar Hoefer</a> addes to me that this was by no means a universal word. The "Americans" used to begin a typeface with the letters <strong>Hono</strong>.</p>
    html_clean: |-
