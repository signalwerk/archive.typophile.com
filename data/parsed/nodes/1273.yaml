    html: "<p>Something just hit me: any test string with \"Hamburg\" in it is unlikely to have originated from the Netherlands, for the simple reason that the Dutch have never been particulary fond of Germans, especially not after WWII. It must have come from a German font house, and considering that blackletter -which was used almost exclusively in Germany until about the middle of WWII- has very different control characters than roman, I'd guess that that famous test string is from the 1950s. In fact it also seems to me to be the sort of analytical stuff Zapf might have played a part in. <br> <br>hhp <br></p>"
