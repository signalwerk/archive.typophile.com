  html: |-
    <p>Hy everybody</p>
    <p>I am a design student, looking for some help for my next project. We have to do a book as an "hommage to typography" and it ocurred me that I wanna do a collectable piece, honouring the most beautiful designs of each letter. In other words, let me explain it like that: We all know, that Spiekermanns "Meta" has an especially fascinating lower case "g". I'm looking for the missing pieces of the alphabet. Which font, in your opinion, has the most beautiful sans serif lower case "o", for example? Or the most beautiful sans serif upper case "A"? I would be glad for your help and some inspirations. I'm looking exclusively for sans serif font, though the idea is to make a serie out of the books (most beautiful sans serif characters, most beautiful serif caracters, ect.) and it doesn't matter if lower- or upper case.</p>
    <p>Thanks in advance.</p>
    <p>Sandra.</p>
  html_clean: |-
