    html: |-
      <p>Maybe /A/ from a very bold weight of Univers? Though it might only seem beautiful for being clever, and only seem clever in conjunction with the other characters, as intended. This might be a problem with your concept because seeing the characters in context is very important.</p>
      <p>What about /A/ from Bell Centennial? Beautiful under the microscope, like an insect.</p>
      <p>Beauty… difficult to define. Fascinating, like Meta's g, perhaps easier to find, but then you might end up with an alphabet of quirky characters only.</p>
      <p>I am fascinated by sans serif /a/, it very easily looks jilted, pregnant, distended or over-biting.</p>
