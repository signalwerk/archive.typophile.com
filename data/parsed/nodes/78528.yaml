      <p>I certainly agree with that, and it crossed my mind to mention it here myself. However the beauty of individual glyphs is certainly a strong motivator in type design, even if one ends up taming (or outright dumping) an overly-attractive shape.</p>
      <p>BTW, that expression is much older than Feliciano. And a much better way to say it is: "A typeface is a beautiful collection of letters, not a collection of beautiful letter."</p>
      <p>And of beauty itself: that's not even the main point to begin with!  :-)</p>
      <p>hhp</p>
