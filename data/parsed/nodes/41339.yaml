    <p>I'm looking for a symbol/ornament font, which will produce guilloche ornaments (those fine  mostly endlessly repeating lines found on paper money or identity documents).<br>
    I already tried to find by the keyword "guilloche" but that wasn't successful.<br>
    Does anybody know of a font, which will build those patterns or at least quite similar?<br>
    (I know Hypnopaedia and similar, but that doesn't really fit. I need more linear patterns.)<br>
    Thanks for all hints!<br>
    best regards<br>
    Michael</p>
