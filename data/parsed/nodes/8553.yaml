    html: '<p> Congratulations - a superb execution of this type of thing. <br> <br>As for alternatives to your 5x5 grid: what if each letter is a 2.5D shape? Like the "O" would be a pipe (with some thickness). The math is of course much higher level (not to mention the rendering), but you could make an online interactive version of the cool stuff in that little "Dimensional Typography" book - you know it? <br> <br>hhp </p>'
