  html: "<p>here's something I did for my typography class looking at the intersections of type forms in 3 dimensions.  This is not an original idea, but I was really interested in making a tool to experiment with the concept.  Here's the link : <br> <br><a href=\"http://www.thesystemis.com/intersection\" target=\"_top\">http://www.thesystemis.com/intersection</a> <br> <br>need java 1.1, IE browser, non osX yet.... <br> <br>I'm a little bummed with 5*5 type and am looking at alternatives.  Right now, thinking of fonts which mix squares and triangles (like european train signs).  Any thoughts? <br> <br>thanks! <br>zach</p>"
  html_clean: "<p>here's something I did for my typography class looking at the intersections of type forms in 3 dimensions.  This is not an original idea, but I was really interested in making a tool to experiment with the concept.  Here's the link : <br> <br><a href=\"http://www.thesystemis.com/intersection\" target=\"_top\" class=\"link-external\">http://www.thesystemis.com/intersection</a> <br> <br>need java 1.1, IE browser, non osX yet.... <br> <br>I'm a little bummed with 5*5 type and am looking at alternatives.  Right now, thinking of fonts which mix squares and triangles (like european train signs).  Any thoughts? <br> <br>thanks! <br>zach</p>"
