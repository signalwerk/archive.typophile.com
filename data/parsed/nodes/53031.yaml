    <p>Clunic is released today on MyFonts.com.</p>
    <p>Clunic is a Blackletter font in the best traditions of Victorian Gothic revival—that is to say aesthetically marvelous but having no historical basis whatsoever. The design combines the perpendicular character of medieval manuscripts with modern legibility and a healthy respect for calligraphic principles.</p>
    <p>I think this banner gives a nice idea of the potential:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Clunic Poster Small_3841.png"></div><p></p>
    <p>Clunic can be found at <a class="freelinking external" href="http://www.myfonts.com/fonts/gatf/clunic/" rel="nofollow">http://www.myfonts.com/fonts/gatf/clunic/</a> or you can read more anbout it at our blog on <a class="freelinking external" href="http://gatf.wordpress.com" rel="nofollow">http://gatf.wordpress.com</a></p>
