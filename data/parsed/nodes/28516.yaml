      <p>Jonny, I don't in any way mean to be facetious, but if you keep the d and b in the current positions and use a typeface with ascenders any longer than are presently in use, you are in danger of having a logo that will be reminiscent of the male genitalia in a state of arousal!</p>
      <p>I noticed this only because I had a design student encounter something similar recently.</p>
