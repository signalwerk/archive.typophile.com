      <p>Thanks everybody! Interesting sample that Nick Shinn posted – this is indeed an <em>italic</em>, not just a slanted variant as it seems to have become standard for "prototypical" sans serif or "Grotesk" fonts (i.e. not humanist sans). The uppercase looks more like a slanted roman as in "LIFE DEPARTMENT", though.<br>
      I will keep looking and post what I can find. If anybody only had some more ideas where to look…</p>
