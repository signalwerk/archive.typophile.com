      <p>James, in general the type founders were the last to get hold of a style, after signwriters, lettering artists, architects, stonemasons and calligraphers had had their way with it.</p>
      <p>"Phantom" was one of the few display styles that were "type first", from the 1830s, because type founders used engineering tools.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Phantom_5714.jpg"></div><p></p>
      <p>For letter genres which originate with type, one should look to text type, although even here engraving played a strong role.</p>
