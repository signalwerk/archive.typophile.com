    <p>This may be a simple question, but I can't find an answer anywhere, including at typophile.<br>
    Does anybody have a clue of what was the first metal <em>italic</em> (or in fact <em>slanted</em> sans serif font?<br>
    My guess from the material that I could look into would be something in a field where many different typefaces are needed in one composition: map printing or the like (on the other hand, maps were seldomly printed from lead letters apart from trials by Raffelsberger and others, but either engraved or later lithographically reproduced from ~1800 on).<br>
    So any clues that could point into the right direction? Akzidenz Grotesk?</p>
