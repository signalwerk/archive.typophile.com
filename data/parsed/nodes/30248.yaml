      <p>Whatever it was, it probably wasn't AG as AG was cobbled together from other grotesks purchased by H. Berthold A.G.. </p>
      <p>The Berthold specimens from the 1960s on <a href="http://www.sanskritweb.net/forgers/#BERTHOLD" rel="nofollow">Uli's site</a> has italics (kursiv), these weights are not mentioned in the list of weights and releases up to 1958 published in <em>100 Jahre Berthold</em>, which suggests to me that either they were added by G.G. Lange when he redesigned AG in the late 1950s or that they existed previously and nobody cared enough to list them in what writings and specimen books  survive. Either way Lange would probably know.</p>
