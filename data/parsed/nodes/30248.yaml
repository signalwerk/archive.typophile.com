      <p>I'm no expert on specimen books, but for what it's worth, here is the earliest lower case sans serif type I've come across in use, which also happens to be italic, and there is no instance of a matching roman lower case. It's from an advertising leaflet for the Liverpool &amp; London &amp; Globe Insurance Comapany, bound into The Sunday Magazine, Oct. 1874, printed in London by Virtue &amp; Co.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Insurance_1874A_6230.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Tontine_5396.jpg"></div><p></p>
