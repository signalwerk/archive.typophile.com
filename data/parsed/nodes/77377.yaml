      <p>Thanks Riccard.  I agree with you - I'd like to distinguish it a bit from the ubiquitous Arial's and Franklin Gothic's of the world, but I wanted to be wary of overdoing the slanted strokes and thorned ear of the g.  The balance between convention and personality is pretty difficult to find, but I'm going to keep working at it!</p>
      <p>As for the different angles, I believe that's just a mistake - thanks for pointing it out.</p>
