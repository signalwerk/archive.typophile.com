      <p><em>Thanks Riccard. I agree with you - I'd like to distinguish it a bit from the ubiquitous Arial's and Franklin Gothic's of the world, but I wanted to be wary of overdoing the slanted strokes and thorned ear of the g. The balance between convention and personality is pretty difficult to find, but I'm going to keep working at it!</em> | There are other ways to differentiate your font than playing up its gimmick (not too seem cynical; it's just the right word here). I think what the font needs is to be taken back to the drawing board and reimagined holistically. Rather than "a sans-serif with slanted terminals," something like "an edgy sans-serif." Make the slants a symptom of the font's core attributes, not the reason for the font.</p>
      <p>That hotel is really close (and that the name is the same is unnerving, I'm sure) but that doesn't mean you should abandon this idea.</p>
