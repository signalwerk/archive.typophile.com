    html: <p>Phil _ Joe makes some valid points, but the *readability* question is hard to figure unless you tell us who is going to traffic traphik. <br> <br>If a 'graf' crowd is going there, then your logo is *too* readable. You probably know what I mean. If it's a general audience, then maybe the hi ligature needs to be explained, the A fixed, etc. <br> <br>I do like how the dot on the i has a sense of balance with the ear of the r. <br> <br>The best/clever part of the logo is the tread/traffic idea. You might strengthen that. <br>I pulled down some guides on the logo. I don't know, maybe pulling it into a grid might help it achieve a sense of balance.  <br> <br><img src="http://www.typophile.com/forums/messages/29/1734.jpg" alt="traph.jpg"> <br> <br>good luck, <br> <br>bj</p>
