    html: '<p> My Chinese horoscope sign Monkey, mister. I dangle good. <br> <br>Put simply: <br>Legibility depends on letterforms that are easy to decipher. Readability depends on letterforms that come together to form boumas (word shapes) that are easy to decipher. BTW, the "style" of decipherment depends on the reading state (contemplative versus immersive). <br> <br>A couple of real-world implications: legible fonts have bigger x-heights that readable fonts. Sans fonts are more legible but less readable. <br> <br>hhp </p>'
