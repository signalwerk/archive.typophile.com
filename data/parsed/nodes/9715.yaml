    html: "<p>Here's what NOT to do: go to <a href=\"http://www.stoutbooks.com/\">William Stout Architectural Books</a> at 804 Montgomery St. Last time I was there, I got Alan Bartram's <i><a href=\"http://www.amazon.com/exec/obidos/ASIN/0300090587\">Five hundred years of book design</a></i>, Peter Burnhill's <i><a href=\"http://youworkforthem.com/product.php?sku=P0226\">Type Spaces</a></i>, two of Keith Smith's binding books, and a huge whack of other stuff. They also have copies of the <a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0500019428\">full-sized edition</a> of the translation of <i>Hypnerotomachia Poliphilia</i> that  has to be seen to be believed. That place has been horrendous for my credit card. It's the best bookstore I've found for new design and architecture titles (although their selection of stuff on Daniel Libeskind is strangely deficient, given how much work he's done in SF). <br> <br>Gang of Four is playing the Fillmore the evening of the 2nd. If that's the night of your talk, you could go to the show afterwards! It's gonna be hot! <br> <br>Also, you should get some sushi. I suggest Takara in Japantown (with a stop at Kinokuniya to flip through the copies of Idea and Relax) or Ryoko's in the Tenderloin. Not as trendy as some of the other places people mention (Blowfish, Ebisu) but amazing fish. <br> <br>And you should check out some of San Francisco's bizarre little parks. My favorites are the south peak of Twin Peaks (i.e. not the one where all the tour buses go) and Golden Gate Heights. <br> <br>Really, I could do this all day. What are you looking to do?</p>"
