    html: "<p>As a design student/aspiring type designer in NYC, I am very interested in the topic of your talk, although unfortunately I cannot attend that or your summer class at Art Center. It would be wonderful if you could post the text or an outline afterwards. Some questions I have are: <br> <br>How important are traditional drawing skills? Would you suggest putting in lots of time tracing, hand-lettering, and learning calligraphy? <br> <br>How much do you need to learn about all the other typefaces out there, and the nuances of optical adjustments, etc. before you create your own? Just do it? What if you end up with something derivative? <br> <br>What technical knowledge is needed? Should we all become Python programmers? <br> <br>How do you make a living? Designing type on the side while working another job, or working for a foundry? <br> <br>It seems as if there is a continuum of type design: one end deals with technical computer stuff like coding for OpenType and the other is more traditional and craft-oriented, like creating beautiful hand-lettering. And then there is the curatorial side</p>"
    html_clean: "<p>As a design student/aspiring type designer in NYC, I am very interested in the topic of your talk, although unfortunately I cannot attend that or your summer class at Art Center. It would be wonderful if you could post the text or an outline afterwards. Some questions I have are: <br> <br>How important are traditional drawing skills? Would you suggest putting in lots of time tracing, hand-lettering, and learning calligraphy? <br> <br>How much do you need to learn about all the other typefaces out there, and the nuances of optical adjustments, etc. before you create your own? Just do it? What if you end up with something derivative? <br> <br>What technical knowledge is needed? Should we all become Python programmers? <br> <br>How do you make a living? Designing type on the side while working another job, or working for a foundry? <br> <br>It seems as if there is a continuum of type design: one end deals with technical computer stuff like coding for OpenType and the other is more traditional and craft-oriented, like creating beautiful hand-lettering. And then there is the curatorial side</p>"
