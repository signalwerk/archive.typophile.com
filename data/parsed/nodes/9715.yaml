    html: "<p>Sushi wise, I'm partial to Akiko's on Bush St., Ariake on Geary Blvd., and Murasaki on Clement St. (in the Inner Richmond district), but then Murasaki is my preferred neighborhood sushi place, being just down the street from my apartment. <br> <br>I suggest a San Francisco Typophile Dinner take place, maybe after your talk, or just during your visit. Who's game? I'll throw out a potential dining place to start things off: Korean Village Restaurant on Geary Blvd. in the Inner Richmond. Great Korean food, which I selfishly admit I can't get enough of right now.</p>"
