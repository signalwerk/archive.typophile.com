  html: "<p>Hi folks: <br> <br>I'm having an odd problem with Trade Gothic.  I have both Adobe and Linotype versions and the problem exists in both. <br> <br>First of all, it's related to Flash, but I've noticed something else... <br> <br>These fonts are always fine for print projects - no problems.  On screen, and I've noticed this in Fireworks, there is extra space added to the kerning behind A, W and T.  If I turn on the auto-kern setting the problem goes away.  Simple enough... <br> <br>However, in Flash the problem doesn't go away.  I can not use Trade Gothic in a Flash movie - the kerning, as described above, is off on a few characters.  I can't alter any settings...and pretty much all my other billion fonts work just fine. <br> <br>I don't think it's a font or Flash issue actually...I think it's my computer.  How...what...is there something I can do to try to get at this problem? <br> <br>BTW, I'm currently running OSX 10.3.7 if it matters - the problem did exist long before this version. <br> <br>Thanks, v <br> <br>PS: we got the last two spots at bolditalic in Gent to see Karel Martens speak - whoo!</p>"
