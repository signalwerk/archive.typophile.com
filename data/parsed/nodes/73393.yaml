      <p>Optically the bottom stroke of the O and E look a bit heavy. Also the waist of the R is looking a touch heavy as well. The V form in the M is also looking dark. The waist of the E is a matter of taste, but the shorter you make it the more 19th century the letterform becomes. The short waist is not helping the space between the E and R. In fact the VE, ER, RT and TI look too open when compared with the straight-to-straight spacing of the IM, ME.</p>
      <p>The O still has some problems at the tangent.</p>
      <p>Ed Benguiat first clued me in to the trick of lightening the bottom strokes of letters ever so slightly to compensate for the optical illusion of them appearing too heavy. It has to be a tiny move, maybe only a unit or two in FL. But it does make a difference.</p>
