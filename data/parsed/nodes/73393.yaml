      <p>Thank you, Alesandro! I think you can extend those beziers even further, but this is coming along nicely. Have you considered lifting the apex of your M up from the baseline? That way you could make it even narrower. It's great that you observe the weight issues with M. This is where optical  adjustments come in handy. It looks quite good now. The last optical thing I would adjust is the top bar of E. It could be slightly shorter, and I think it's the main reason it looks so wide to me.</p>
      <p>Honestly, I'm far from a pro. Take my advice with a barrel of salt.</p>
