      <p>Just checking Trade Gothic (and News Gothic, to which it is similar), I see that the O is rounder and wider. When you do the straight sides, that will affect the rhythm of everything else, so you can't just take widths of glyphs in Trade Gothic as a guide. Though, still, your E is too wide compared to the R there. Also in your first drawing, on the grid, your E and R are the same width.</p>
      <p>Not only width, but volume of whites matters... </p>
      <p>Also your idea, if I understand it rightly, that "more constructed" equals "more polished" is not sound, I think. Trade Gothic is actually very polished, and pushing it into a coarse grid makes it very hard, if not impossible, to keep the polish.</p>
