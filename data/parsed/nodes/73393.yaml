      <p>I think you have problems here with rhythm, because of the relative widths of different letters. The widths affects the amount of white within and between characters, and this needs to be more visually even to get a good look, IMHO. Normally, the R and T would be wider than the E. My impression is that the E is the odd man out, but probably everything needs to be adjusted relative to the O, if that's the width you want. </p>
      <p>I find it instructive to open other fonts--sans fonts in this case--and see what they do. Then try OOVOOEOOROOTOOIOOMOO IIOIIVIIEIIRIITIIMII, etc. and play with widths until you think it's all balanced. Since you're only doing these letters, not a font, theoretically it isn't needed, but you might find it helpful.</p>
