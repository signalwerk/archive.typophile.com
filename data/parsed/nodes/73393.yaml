      <p>Almost to reiterate terminaldesign, spacing this is utterly key, and since you are <em>drawing</em> the letters you actually have the opportunity to improve the spacing by adjusting things like the waist of the E, or apex of M. If you were spacing a font you'd eventually have to reach a compromise between a form and it's spacing but here you can really tweak it. Then know when to stop ;-)</p>
