      <p>This is a good start! Over time you'll probably learn that things rarely are what they look like in type. A perfect circle does not look "right" - someone more experienced can probably explain better exactly why - but this is apparent in your O and R. In O, the parts where straight edge meets curve needs to be smoother. You can try nudging your nodes and extending the vertical bezier handles to make the transition smoother and the half circles less perfect round (more of a slightly sqooushed circle). Try the same with your R, only horizontally.</p>
      <p>V, E and M are too wide compared to your other narrow letters (or the other way around). In this style, capitals tend to be rather uniform in width.</p>
    html_clean: |-
