    html: <p>Bubba Love seems to be one of the many great fontographer fonts which have completely disappeared. It's such a shame and I'm really glad I have them already. I wonder if anyone plans to bring them back... <br> <br>I would love to know the source of the sample - if it's vintage it may be very hard to find. If contemporary it's out there somewhere (unless it's in the fontographer vortex).</p>
