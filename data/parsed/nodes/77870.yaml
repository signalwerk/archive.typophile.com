      <p>It's nice. From what I recall it's better than any of the options you posted in the previous thread some time ago.</p>
      <p>For the 'EST. 1991' line I would loosen the tracking a bit and perhaps switch to small caps / old style numbers. Also, since there's such a large wordspace between 'EST. 1991', the space between 'F.D.' and 'STIL' looks rather small.</p>
