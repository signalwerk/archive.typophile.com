    html: <p>You'll have to customize here and there, but <a href="http://www.myfonts.com/fonts/linotype/optima/optima/testdrive.html?s=Project%20Time%26Cost&amp;p=48"> that</a>'s basically it. Negative tracking, remove dots on "i" and "j", and kern the "i" far too closely to the uppercase "T". <br> <br>Why do people <i>do</i> this, this insanely close kerning with uppercase T's? Chill out. Leave the character some room to breathe, please.</p>
