  html: |-
    <p>Hi all,</p>
    <p>I'm looking for a digital version of OPTI Majer Irregular, preferably one without the checkered past of OPTI fonts. It's the secondary font used for Curious George seen <a class="freelinking external" href="http://www.houghtonmifflinbooks.com/features/cgsite/" rel="nofollow">here</a> as the secondary headings.</p>
    <p>I know OPTI fonts are poor quality digitizations of fonts swiped from elsewhere, so if anyone has any clue as to the original typeface, that would be fantastic!</p>
    <p>Thanks,<br>
    David</p>
