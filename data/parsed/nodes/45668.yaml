      <p>Nuno, it looks good. I guess sometimes a tread takes a while to cause interest. Also, I suppose, or speculate, that one only get 75 hits on their postings when they are five year members of the Coliseo Tipográfico Mundial(e).<br>
      Can you give us some shots of the tilte page and other pages of your choice? That is not required :-), it is just a thought. I can see the cover, and it has proper margins, the construct of letters is interesting and accord to primary education or higher.</p>
      <p>Now off topic: I went to your website sometime ago, by the time you were asking something about letterpress in BCN. I found a email link there and sent you a email. I never got any answer. I suppose you are busy or did not receive the email (maybe it ended up in a junk box...).<br>
      And another thing: I spent two years in BCN, time enough to learn Catalá. Back then I thought catalan was too small of a language as to learn it. I had to decide if learn it or not. As a matter of choice I realized I could not afford giving time to it, and that was a mistake. If you can, learn catalán. I later realized that if you can speak catalan it causes a very good impression on catalan speakers, and that my friend, counts on your favor. I am sorry I did not do it, I was too busy...</p>
      <p>Salut e forza al canut! : That matters :-)</p>
      <p>Andreu</p>
