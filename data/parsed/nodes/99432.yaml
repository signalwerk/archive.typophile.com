    <p>Hi guys!</p>
    <p>So I'm a graphic design student, and I'm interested in designing Japanese Typefaces. Since I don't have the budget to purchase the Asian Fontlab (and since I foresee type design as a hobby versus a profession) I've been considering purchasing TypeTool so I can do basic type editing. I noticed that it has the option of using 65,000 glyphs, so I think it would probably serve my needs.</p>
    <p>My TypeTool question is, is it possible to make fonts in TypeTool that react to the usual input method of Japanese characters? For example, I don't want "k" to represent a single character- I want to type "ka" and have the corresponding characters か, カ, 火, 科, 家, etc etc appear. as options. I've been doing some researching, but I'm unfamiliar with the terms associated with this input method.</p>
    <p>Thank you so much!</p>
