    <div class="node-spam-content"><p>This is from the cover of _Character Strengths and Virtues: A Handbook and Classification_ By Christopher Peterson, Martin Seligman, Oxford University Press 2004</p><div class="imageWrap"><img src="http://typophile.com/files/_UnknownNarrowSerifOrig_4917.jpg"></div><p></p>
    <p>I cleaned up the letters </p><div class="imageWrap"><img src="http://typophile.com/files/_UnknownNarrowSerifSM3_4770.jpg"></div>and sent them to What The Font. Its closest suggestion was Bob Alonso's Fashion Didot <div class="imageWrap"><img src="http://typophile.com/files/FashionDidotAsChar_4934.gif"></div> <a href="https://www.myfonts.com/fonts/bagraphics/fashion-didot/" title="https://www.myfonts.com/fonts/bagraphics/fashion-didot/">https://www.myfonts.com/fonts/bagraphics/fashion-didot/</a> <p></p>
    <p>Close, but not a match.</p>
    <p>Any suggestions?</p>
    <p>Thanks Don</p>
