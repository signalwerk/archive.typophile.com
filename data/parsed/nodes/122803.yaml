    html: |-
      <p>I certainly would agree, Don. And the 69 fonts digitized thus far make it clear that nobody is racing to produce the more generic sans or serifs.</p>
      <p>I was just wanting to clarify for anyone accessing this thread in the future and wanting to use a font like this commercially that Filmotype isn't defunct; the legitimate rights belong to Stuart Sandler.</p>
      <p>By the way, I appreciate the fact that Sandler and colleagues are including the batch of alternates that most Filmotype fonts had.</p>
