      <div class="comment-spam-body"><p>Thanks Mike for the confirmation that the OPTI Racer is indeed based on a Filmotype font with the name of Racer.<br>
      As far as the fonts being created by Stuart Sandler's people from the Filmotype archives, I trust you will agree that the current rate of production is very slow -- only six fonts were released in 2014. <a href="https://www.myfonts.com/foundry/Filmotype/?sort=new" title="https://www.myfonts.com/foundry/Filmotype/?sort=new">https://www.myfonts.com/foundry/Filmotype/?sort=new</a><br>
      Don</p>
      </div>
