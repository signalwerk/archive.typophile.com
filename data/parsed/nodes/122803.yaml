      <p>Not much help, but I can confirm from Filmotype catalog showings that this was originally Filmotype Racer. I know of no other digital versions.</p>
      <p>Stuart Sandler bought the rights to the <a href="http://old.myfonts.com/foundry/Filmotype/" target="_blank" rel="nofollow">Filmotype collection</a> in 2006 and has since been having several fontmakers create digital versions <a href="http://old.myfonts.com/browse/foundry/filmotype/?PREFS_SET[ipp]=96" target="_blank" rel="nofollow">for sale</a>. No Racer yet, though.</p>
    html_clean: |-
