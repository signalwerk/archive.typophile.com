  - id: 598078
    user: 205259
    date: 2015-01-25T17:15:00
    date_raw: 25 Jan 2015 — 5:15pm
    votes: null
    html: |-
      <div class="comment-spam-body"><p>Mike, looking at the example of Racer, we have a design that Oxford University Press choose as the best way of expressing its title theme. I don't know whether OUP used the OPTI digital or a Filmotype analog source. </p>
      <p>I find the Racer typeface design superior to Fashion Didot for this purpose.</p>
      <p>Anyone trying something similar for a commercial project today would be stuck in the bind of using a digital font from OPTI -- an orphan foundry where there is no way of obtaining appropriate intellectual property permissions -- or making the font from scratch.</p>
      <p>I do hope that Stuart Sandler's digitization plan has Racer in the next batch.</p>
      <p>Cheers.</p>
      <p>Don</p>
      </div>
