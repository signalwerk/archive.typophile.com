      <div class="comment-spam-body"><p>Thank you. This is indeed an exact match.<br>
      According to the note for the OPTI font it was "Originally a phototype by Filmotype."<br>
      Unless there was a version with the same digital outlines by another fontmaker before OPTI produced OPTI Racer, this is presumably an original digital creation by OPTI.<br>
      Does anyone know of a matching digital font before the OPTI font?<br>
      I only ask because of of the notorious reputation of OPTI/Castcraft as a forger of unauthorized clones of digital fonts. A relatively small proportion of its fonts were original digital creations.<br>
      Don</p>
      </div>
