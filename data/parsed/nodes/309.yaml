    html: <p>What works very nicely -- at least it did for me -- is to use Isonorm Monospaced and add 10% weight to it FontLab or some tool like that -- by using the fully automated process. This rather weird process results in a very vernacular typeface that is strangely rounded and feels strangely un-designed.  <br>The only irritating thing about Lineto is the pricing in Schweizer Franken. I tried to contact Wendlin and Co about Euro pricings for Courier Sans, but to no avail... </p>
