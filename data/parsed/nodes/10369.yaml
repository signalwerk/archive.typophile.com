    date_raw: null
    votes: null
    html: <p>Ok, <br> <br>I attended the University of the Arts (pcad)  for 2.5 years. Funds ran dry. So now I am at Northern Kentucky. At UArts I had type design once with Inge Druckrey and once with someone else. So, I've had enough that I can probably, on my own, do o.k. But I want to do better than o.k.  <br> <br>I have to compete with the folks at D.A.A.P.  <br> <br>I actually haven't even sat down with fontographer or fontlab yet, I just was hoping that someone with experience in the Actual DESIGN of type would be willing to lend insight/mentoring/ in-progress critiques, God knows theres no one at my school that could remotely do it.</p>
