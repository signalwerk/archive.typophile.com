    html: <p>No, not necessary. Maybe you can just mention that a student of his recommended you to him. <br> <br>And he may not be able to help you, but I'm sure he could at least help with some recommendations of others in the area. He's a slightly eccentric guy, just to warn you, and is not super fluent with English (he's from Switzerland). <br> <br>I just remembered there is a Senior Designer at Landor Cincinnati that also has some experience in type design. I'm blanking on his name right now, but if I come up with it, I'll let you know. Maybe Heinz or one of the other UC professors knows his name. He's a DAAP grad if I remember.</p>
