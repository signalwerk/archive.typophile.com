    html: <p>"I have to compete with the folks at D.A.A.P. " <br> <br>I'll take that as a compliment (Graphic Design, '07) <br> <br>My recommendation is to contact Professor Heinz Schenker at UC/DAAP. He teaches most of the typography courses, including the intro class where you design entire lettersets. He is amazingly perceptive and helpful in type design. He more or less turned me into the typophile I am now.  <br> <br>The only thing I can warn you about is that he favors very traditionalist type design (i.e. I attempted to make a sans serif double-story lc g and he kinda balked at it) <br> <br>I hope that helps. I'd love to take a look at some of it if you get to a point where you'd like a third (albeit somewhat green) perspective.</p>
