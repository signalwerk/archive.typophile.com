    <p>Saul Bass's title sequence for the movie "Psycho" is compared with his interest in Josef Albers and other abstract painters:</p>
    <p><a href="http://www.designdrivethru.net" title="http://www.designdrivethru.net">http://www.designdrivethru.net</a></p>
    <p>You can also watch the movie clip on the site. I think Bass's early motion graphics were sort of abstract paintings that move. And it's clever of him to start slicing up type before Norman Bates even shows up on screen.  ;-)</p>
