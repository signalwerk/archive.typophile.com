    html: <p>It's been a while since my last visit, but I believe Kenn is refering to <a href="http://www.athenaeum.nl/"> Athenaeum Boekhandel</a> a bookstore with a very good magazine section in the building next door. Also there used to be an antique book market on Spui too, I think it was on wednesdays but ask around. And, like John said, don't miss Nijhoff &amp; Lee. They are responsible for a good part of my personal library <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>- jdf <br> <br>ps. are you going to be there for the Queen's Birthday? One of the craziest street-party weekends in the world!</p>
    html_clean: <p>It's been a while since my last visit, but I believe Kenn is refering to <a href="http://www.athenaeum.nl/" class="link-external"> Athenaeum Boekhandel</a> a bookstore with a very good magazine section in the building next door. Also there used to be an antique book market on Spui too, I think it was on wednesdays but ask around. And, like John said, don't miss Nijhoff &amp; Lee. They are responsible for a good part of my personal library <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>- jdf <br> <br>ps. are you going to be there for the Queen's Birthday? One of the craziest street-party weekends in the world!</p>
