    html: <p>This isn't so much a typography/graphic design thing, but if you can make it over to Rotterdam for a day, a visit to the Kunsthal would be worth it. I'm sure the exhibits are great, but it's the building that's amazing - by <a href="http://www.oma.nl/index_flash.htm" target="_blank"> Rem Koolhaas and OMA</a>. They also did the Byzantium Building in Amsterdam and part of the urban planning for the Amsterdam-Noord ferry.</p>
