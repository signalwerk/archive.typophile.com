    html: "<p>You must go to <a href=\"http://www.nijhoflee.nl/design/\">Nijhoff &amp; Lee</a>, the best design bookshop in the world (that I've visited). Be sure to ask to see the antiquarian section also: this is upstairs and you'll find many gems.</p>"
