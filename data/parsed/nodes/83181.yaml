      <p>You'll find that a lot of fonts have these two ordinals underlined, which maybe why /degree/ was resorted to. A typeface worth its salt will include at the very least a limited range of ordinals abdehilmnorst (or similar) which are not underlined. Some fonts will give you all 26 latin superiors, some will even give you them in upper case also.</p>
      <p>N</p>
