      <p>Liebe Nina,</p>
      <p>the little raised o (and a) is in every decent text font. On my German keybord I get it via alt-J<br>
      The use of the ° sign for this is a frequent poor-mens workaround, to be avoided whenever possible.</p>
      <p>Grüße Sie herzlich nach Basel!<br>
