      <p>Here in Italy, where ordinal indicators are used somewhat often (surely more often than degree signs), either you have access to a character palette or the only way to type something vaguely similar is using °. Not that the layman could even know (or care) it isn't a ordinal indicator. After all, it's right there on the keyboard.<br>
      The worst case happens when it's used in place of the feminine ordinal indicator too.</p>
