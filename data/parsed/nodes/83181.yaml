    <p>Hello all,</p>
    <p>I'm currently typesetting a (German-language) book related to (local) history, and have come across a source (original text is in German, published in Switzerland in 1798) that lists a few statements. Interestingly, the ordinal numbers don't use periods as they would in German today («1.», etc.), but some sort of ordinal-o-type character. In my direct text source that cites this text, degree signs were used, but I doubt those are correct. </p>
    <p>I don't have access to the original source. Does anyone happen to know what sort of symbol would historically have been used for this? Maybe I should use/make some sort of superscript lowercase "oh"?</p>
    <p>Here's how it looks currently, with degree signs:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/aufzaehlungsboelleli_6135.gif"></div><br>
    Thanks for any input!<p></p>
