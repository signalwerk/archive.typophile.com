      <p>I'd refrain from forcing embedded fonts onto the reader of an ebook. They are free to choose their fonts, line spacing, margins, etc to suit them. And because you do not control the screen size nor the resolution, choosing a font might make the ebook unreadable.</p>
      <p>Don't.</p>
