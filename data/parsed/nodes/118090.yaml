    html: |-
      <p>I wouldn't make that assumption because I've seen eReaders which don't (devices and apps).</p>
      <p>Building an eBook is like writing a website: you never know what system you're on and how good/bad a job the browser (or its version) does with interpreting your content's styling. If it supports the styling at all, that is. I'd keep it as simple as possible...</p>
      <p>And personally, I find nothing more annoying than an ebook which overrides my settings because whoever implemented it wanted to be fancy :-)</p>
