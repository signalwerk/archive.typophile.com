    html: |-
      <p>What I meant to say was that on most ereaders (Kindle, Nook, Sony, various apps) the user chooses a font and other visuals for the book. Often times the ereader's software (or an ebook app) is rather oblivious of the font that an ebook "ships" with, and overrides it, and different ereaders provide varying CSS support.</p>
      <p>Furthermore, forcing a font onto a user makes for a grumbling customer because they've already chosen the font that they're most comfortable with on their device. You never know how your font (and other visuals) will look on their display because you don't know the display size, resolution, render quality, etc. (I've even found that different fonts on different devices provide different sets of glyphs, so you may want to be careful with diacritics or ornaments or other fanciness.)</p>
      <p>I'd suggest to design an ebook with font, margin, line-spacing, etc as user-defined variables.</p>
