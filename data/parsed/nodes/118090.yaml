      <p>Which eReaders don't allow users to choose their fonts?</p>
      <p>Like most other web designers, I use specific font combinations on all the sites I design and then test on different devices and browsers to ensure performance. Yes, typography on electronic devices is a significant challenge but it our job as designers to take on this challenge. The Web would be very visually uninspiring if we all let browsers make typographic choices for us.</p>
      <p>I never suggested I want to be fancy, unnecessarily. The most important thing, obviously, is the text is readable. So I am looking for suggestions on a body font that is readable and display fonts that are readable and have the right personality. And, of course, can be used in eBook readers, etc., etc.</p>
