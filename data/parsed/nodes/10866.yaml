  html: <p> I'm wondering if anyone has information on this typeface. A few months back I found a specimen book for the United States Government Printing Office and under the Fotosetter faces for the Smithsonian is Monotone Gothic.  <br>Certainly a nice face, maybe a mix between extended versions of Akzi Grotesk, News Goth etc. <br>A month or so later I was flipping through GQ at the store and noticed what appears to be the same face. A custom job? Maybe. <br>Does this ring a bell with anyone? <br> <br>Best, <br>Eric </p>
