    html: <p>Eric, <br> <br>It is nice. FontShop's FontBook calls it a Berthold <br>BQ face, designed by Benton in 1908. I don't see <br>it available at www.bertholdtypes.com. One could <br>assume that FontShop offers it at www.fontshop.com.* <br> <br>For those who want to see what Monotone looks like <br>it could be best described as a face between Trade <br>Gothic and Trade Gothic Extended. Sort of a Trade <br>Gothic Semi-Wide.  <br> <br>(<a href="http://www.myfonts.com/FontFamily4454.html" target="_top">http://www.myfonts.com/FontFamily4454.html</a>) <br> <br> <br>*But I refuse to check. They've redesigned the site  <br>and added all the fonts they sell, but it's in complete  <br>disarray. Hopefully it's still under development,  <br>because at this rate it's lightyears behind www.fontfont.de  <br>which is fast, clear, and lacks silly frames. <br> <br>Stephen</p>
    html_clean: <p>Eric, <br> <br>It is nice. FontShop's FontBook calls it a Berthold <br>BQ face, designed by Benton in 1908. I don't see <br>it available at www.bertholdtypes.com. One could <br>assume that FontShop offers it at www.fontshop.com.* <br> <br>For those who want to see what Monotone looks like <br>it could be best described as a face between Trade <br>Gothic and Trade Gothic Extended. Sort of a Trade <br>Gothic Semi-Wide.  <br> <br>(<a href="http://www.myfonts.com/FontFamily4454.html" target="_top" class="link-external">http://www.myfonts.com/FontFamily4454.html</a>) <br> <br> <br>*But I refuse to check. They've redesigned the site  <br>and added all the fonts they sell, but it's in complete  <br>disarray. Hopefully it's still under development,  <br>because at this rate it's lightyears behind www.fontfont.de  <br>which is fast, clear, and lacks silly frames. <br> <br>Stephen</p>
