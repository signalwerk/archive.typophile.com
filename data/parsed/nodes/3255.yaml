    html: <p> Crane &amp; Company have been around a long, long time (they're just up the road from me). I can't recall how long they've been using this copperplate identity, but I wouldn't be surprised if it's a custom piece, perhaps even originally done in actual copperplate engraving (especially since I think that was their stock in trade at one point). <br> <br>I highly doubt you'll find an exact digital match. <br> <br>-- K. </p>
