    html: <p>Previous to specific cultural uses, such as the definition of a <em>lettera umanistica</em>, the basic meaning of humanism contrasted man with God. It seems to me that in the context here it visually contrasts man with machine, machine being represented by the letterpress type forms of grotesque and geometric. In that sense, any hand written or hand drawn sans serif may be considered humanist. Comic Sans, for instance. Or consider Eras -- not directly based on the old style, but with strongly organic, chirographic qualities.</p>
