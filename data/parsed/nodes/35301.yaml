      <p>&gt;A humanist sans face is a sans face based on handwriting. </p>
      <p>This is misleading. The proportions and modulation of humanist sans are, as Nick says in his piece, based on old style serif printers typefaces, with the serifs taken away. These typefaces in turn are based on hand writing, but a very special, formal hand: the revived Carolingian Miniscule with roman caps. The modulation of line in old style type is has many differences from the handwriting that it is based on.</p>
