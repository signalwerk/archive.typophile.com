      <p>These aren't going to get you far in terms of setting up or reifying style distinctions* and they may be possibly too obvious; but they certainly are a potentially important points of difference when choosing a font: </p>
      <p>- degree of Historical Resonance</p>
      <p>- greater or lesser comprehensiveness of glyph support ( all or partial Latin A, Latin B, Greek, Cyrillic, etc )</p>
      <p>- Italic vs. Sloped Roman or Other</p>
      <p>- availability of Number models: Old style, Lining, Tabular, Hybrid etc.</p>
      <p>- range of weights</p>
      <p>- Capital support: ( Small caps, All Caps)</p>
      <p>- Availability of pt size or use specific design ( display vs text vs small text - that sort of thing )</p>
      <p>- suitability ( or lack suitability ) to set text regardless of style label ( see Haas Unica vs. Helvetica or Arial ) rather than just titles or pull quotes etc.</p>
      <p>- suitability for a given type of reproduction: paper type, kind of printing, screen use etc.   </p>
      <p>- contextual, language specific, or other substitutions if it's Opentype</p>
      <p>- degree to which Notan seems to play a role in the design</p>
      <p>* The style distinctions which you are looking into are somewhat soft anyway...</p>
      <p>Also, there have been threads on Typophile which dissected the notion of the 'Humanist'. If you do a site search of typophile on google you may find useful comments that way.</p>
