      <p>Grotesque sans faces are the original sans faces. The strokes of these faces often appear close to being “Mono-width”, that is to say lacking tapers. This is not to say that there are no tapers, just that the tapers do not have the sort of personality in a humanist sans. These typefaces speak to mechanisation of production and the removal of elements considered extraneous.</p>
      <p>Neo-grotesques further the mechanical nature of the grotesque, stripping away all possible personality to create a neutral typeface that allows the content to stand out. Helvetica and Univers are the kings in this category. </p>
      <p>A humanist sans face is a sans face based on handwriting. These faces feature the subtlety of letters crafted by a calligrapher. Many people consider humanist faces to have more personality and human warmth than grotesque or geometric sans faces.</p>
      <p>Geometric sans faces are sans faces constructed from basic shapes. They may be purely geometric and mono-width or carefully and technically tapered and tweaked in the manner of a grotesque. Kabel is of the former, Futura the latter.</p>
      <p>There are also new sans categories appearing. Typefaces like Gotham and Neutraface are of some new category of vernacular sans types, based on letters used or created by people other than type designers. Work such as Erik Spiekermann’s typefaces—Officina, Meta, and Unit (with credit to Christian Schwarz)—have combined features of grotesques, neo-grotesques, and humanist types to spawn a new hybrid sans category.</p>
      <p>Try picking up <a href="http://www.amazon.com/gp/product/0131344455?ie=UTF8&amp;tag=onst-20&amp;linkCode=as2&amp;camp=1789&amp;creative=9325&amp;creativeASIN=0131344455" rel="nofollow">Will Hill’s <em>The Complete Typographer</em></a> or <a href="http://www.amazon.com/gp/product/1883915082?ie=UTF8&amp;tag=onst-20&amp;linkCode=as2&amp;camp=1789&amp;creative=9325&amp;creativeASIN=1883915082" rel="nofollow">Revival of the Fittest</a> for more details.</p>
