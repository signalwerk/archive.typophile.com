      <p><em>There are also new sans categories appearing. Typefaces like Gotham and Neutraface are of some new category of vernacular sans types, based on letters used or created by people other than type designers.</em></p>
      <p>It may be tricky to argue that distinction. James Mosley has <a class="freelinking external" href="http://typefoundry.blogspot.com/2007/01/nymph-and-grot-update.html" rel="nofollow">demonstrated</a>: "As for the Caslon ‘Egyptian’ type of 1816, or maybe a bit earlier, which was certainly the first sanserif printing type to be sold commercially, it was not as isolated or as novel as people sometimes make out. By that date Egyptians, or sanserifs, were everywhere, in books and engravings and lithographs, and on buildings and sculpture, and as I’ve said, even on maps." And Gill Sans started as letters for bookshop signage.</p>
      <p>(Sorry for nitpicking at your thorough and helpful answer to the original post!)</p>
