      <p>I really wouldn’t categorize the earliest sans typefaces as grotesques. They fit more into a proto-grotesque category, overlapping nineteenth century jobbing types, existing handwritten and carved letters, and painted signage. To me the grotesque category solidifies much later, when punchcutters had adapted the designs to the letterpress after several generations of type.</p>
      <p>I see the same happening now with these new faces. At some point designers whose ideas about what a sans face should be are influenced more by the fonts Gotham and Neutraface than by the vernacular forms that inspired them will produce the next generation. We can see this happening with typefaces influenced ny, or in what appears to be the case with Unit directly descended from, Meta.</p>
      <p>As an analogy, there are typefaces that straddle genres like the work of Beethoven. It starts out as classical, softens up and starts throwing in new ideas to become something else, and eventually becomes the foundation for the romantic movement in music.</p>
