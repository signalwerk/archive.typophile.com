    html: |-
      <p>J. J. Gibson<br>
      James Jerome Gibson (1904-1979)  American psychologist, considered one of the most important 20th century psychologists in the field of visual perception. In his classic work The Perception of the Visual World (1950) he rejected the behaviorism then fashionable for a view based on his own experimental work, which pioneered the idea that animals ’sampled’ information from the ’ambient’ outside world. He also invented the word ’affordance’: the interactive possibilities of a particular object or environment. This concept has been extremely influential in the field of design and ergonomics: see for example the work of Donald Norman who worked with Gibson, and has adapted many of his ideas for his own theories.</p>
      <p>This entry is from Wikipedia...sorry if this is “too much information!”</p>
