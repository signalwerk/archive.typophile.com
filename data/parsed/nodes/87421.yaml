      <p>I used to do that too, draw glyphs in AI and then copy them to FontLab. Unfortunately there's always some detail lost in the process and an extensive check of all glyphs in FontLab is absolutely necessary :-( At the time I wasn't familiar with FontLab at all, but I kept on trying. After many an hour I discovered that FontLab was the way to go. I found out that metrics and kerning are essential to the design. And that you can't apply any metrics or kerning in AI, so I decided to not design in AI anymore.<br>
      Now there's RoboFont, and the stories I hear about it are very promising. Supposedly it's way better then FontLab. You might want to check it out or at least compare the two programmes.<br>
      You could consider digitising the design in FL or RF yourself. That way you'll keep the design close. Mind you, it'll take quite some time, about as long as it took you to do the initial design. On the other hand you could outsource it. In that case you're in the right forum!</p>
      <p>Good luck!</p>
