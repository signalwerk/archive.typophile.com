    <p>I have been working on a display font for 2 years now and after countless hours of drawing, I have completed a 4 weight face consisting of over 1000 unique characters. Now, I have drawn each character in illustrator with the thought that at the end I would transfer these over to a font program and then complete the font there (Fontlab or Glyphs). But my knowledge of working with any font program is extremely low and Im getting really frustrated figuring out my final solution. Also at this point I have so many other side projects that finding time to craft the font in a software I dont know, seems extremely daunting. Any advice would be hugely appreciated!! What program to use? Maybe an option would be to outsource the final part, how much this would cost and where to find someone to do this?<br>
    Thank you!!!</p>
