  html: |-
    <p>TYPO is coming to the iPad. Check our very first digital issue for free. Download now at  <a class="freelinking external" href="http://itunes.apple.com/us/app/typo/id550415027?mt=8" rel="nofollow">App Store</a>.</p>
    <p>TYPO is a leading magazine devoted to typography, graphic design and visual communication.</p>
    <p>The magazine is aimed at professionals as well as beginning typographers, font designers, graphic designers, educators and marketing and visual communication specialists.</p>
    <p>Published regularly since 2002, TYPO regularly brings information about major events in the world of graphic design, features articles on information graphics, presents the work of young typographers and designers and publishes interviews with important figures in the field. There are reviews of new fonts, and news from important typography conferences.<br>
    And now TYPO is coming to the iPad. This allows us to add more illustrations, photographs and additional information to the articles printed in the magazine, and lets you view a number of images in exceptionally high detail and quality. Over time, the iPad version will also present the best articles from the magazine's decade-long archive especially updated for the iPad.</p>
    <p>The first issue is available free of charge; further issues will be accessible for a fee.</p>
    <p><a class="freelinking external" href="http://www.typo.cz/en" rel="nofollow">http://www.typo.cz/en</a></p>
