    html: <p>I'm with HD. There doesn't seem to be any problem-solving with your "directions." You're just making the "thread" in the green square thicker and changing the typeface. Have you come up with any new ideas? <br> <br>I also don't see the necessity of a redesign. Maybe you could add a more natural typeface to it and create a more elegant whitespace flow inside the box...I'd think about how the white-space "thread" flows inside the green box. It's too mechanical in yours, which is the problem I see with the original. That "thread" (white space in the box, whatever it's supposed to be, I think of a piece of thread for sewing) could flow into and out from the box better. If it's supposed to be a "V" then you can make it better. <br> <br>The type you have makes me think I'm about to walk into a state-of-the-art Oxygen bar or something. I don't know much about textile companies (feel free to give some more info), but this doesn't have the feel to me. <br> <br>What are you trying to say with this identity?</p>
