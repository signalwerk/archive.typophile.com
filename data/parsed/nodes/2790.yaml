    html: <p>The original mark is too straight, like plumbing pipes as Hrant identified. Even straight patterns in textiles have curves once you look up close. <br> <br>I would suggest that you do something to make this feel more human or fabric like. Not so vertical, horizontal, or straight. Make it flow. Push a more freeform, flowing direction, then if necessary, bring in some more gridded design to control the potential chaos. Am I making any sense? Some of the illustrations in the link below might help loosen you up a bit, but notice how alot of them maintain a controlled grid combined with free flowing forms. <br> <br><a href="http://www.chapter3.net/" target="_blank">http://www.chapter3.net/</a> <br> <br>Aloha! <br>Scott</p>
