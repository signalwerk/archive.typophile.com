    votes: null
    html: "<p>Hi Matjaz, <br> <br><i>I am trying (hard) to balance between a very trendy ID and something that would not become a bad design tommorow.</i> <br> <br>The problem here IMHO, is the type. I think this kind of lettering reaks of present trends: a monoline where the v=n e=a etc. It does so in the same way that photolettering smells of the 1970s and now looks dated. So be careful with this approach. <br> <br>One way to distance yourself from this problem might be to use more traditional forms, but keeping the monoline (eg Foundry Monoline). Or you could try a fresh take on an established genre (a neo grotesque, or humanist sans, or a semiserif). How about some of Storm's offerings: Teuton, Sebastian, John Sans, or Dyna Grotesque? Maybe contact Christain Robertson about using Pill Gothic! There's an idea. Good luck! <br> <br>Randy</p>"
    html_clean: "<p>Hi Matjaz, <br> <br><i>I am trying (hard) to balance between a very trendy ID and something that would not become a bad design tommorow.</i> <br> <br>The problem here IMHO, is the type. I think this kind of lettering reaks of present trends: a monoline where the v=n e=a etc. It does so in the same way that photolettering smells of the 1970s and now looks dated. So be careful with this approach. <br> <br>One way to distance yourself from this problem might be to use more traditional forms, but keeping the monoline (eg Foundry Monoline). Or you could try a fresh take on an established genre (a neo grotesque, or humanist sans, or a semiserif). How about some of Storm's offerings: Teuton, Sebastian, John Sans, or Dyna Grotesque? Maybe contact Christain Robertson about using Pill Gothic! There's an idea. Good luck! <br> <br>Randy</p>"
