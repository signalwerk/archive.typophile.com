    votes: null
    html: <p>I'm going to echo most of the other posts here, and say that the old logo isn't bad, just old. I think that Daniel's suggestions tap into a good new direction. There's still a lot there in the old Velana logo. It just looks a bit stuffy, IMO. <br> <br>I think the type should stay close to its original (in terms of the typeface), and maybe even a similar orientation of mark to type, particularly because it's quite known in Slovenia. Plus, if you keep the same rough proportions, it can be used in ways similar to the old logo. Don't be too eager to violate the brand equity. I do like your tweaking of the logo in the A examples. The B example looks nice, but starts to lose the 'V' quality of the old mark. The dip seems too shallow to me, if you're going to make the curves more exaggerated. <br> <br>Be sure to emphasize to your clients the difference between 'new and fresh', and 'disposable'.</p>
    html_clean: <p>I'm going to echo most of the other posts here, and say that the old logo isn't bad, just old. I think that Daniel's suggestions tap into a good new direction. There's still a lot there in the old Velana logo. It just looks a bit stuffy, IMO. <br> <br>I think the type should stay close to its original (in terms of the typeface), and maybe even a similar orientation of mark to type, particularly because it's quite known in Slovenia. Plus, if you keep the same rough proportions, it can be used in ways similar to the old logo. Don't be too eager to violate the brand equity. I do like your tweaking of the logo in the A examples. The B example looks nice, but starts to lose the 'V' quality of the old mark. The dip seems too shallow to me, if you're going to make the curves more exaggerated. <br> <br>Be sure to emphasize to your clients the difference between 'new and fresh', and 'disposable'.</p>
