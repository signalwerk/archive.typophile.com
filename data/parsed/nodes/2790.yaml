    votes: null
    html: <p>To Tiffany's point, the identies found in the interior design world (and much of what is associated with it) often uses extremely clean and simple geometry. Personally, I love that look as opposed to the alternative gaudy designs that I also find common in the industry, but it is also very refreshing when that norm is broken. <br> <br>I'm not sure that the resemblance of Tom's concept to cosmetics is such a bad thing. This indicates that it has a feminine appeal, which is very appropriate to the fashion and textiles industry. <br> <br>IMO, go with the "flow". <br> <br>Matjaz, I like the mark on your last posting better than the other ones, but I'm still not feelin' the type in combination with the mark. I know there's an awesome solution buried somewhere here�hopefully not too incredibly deep. <br> <br>Aloha! <br>Scott</p>
