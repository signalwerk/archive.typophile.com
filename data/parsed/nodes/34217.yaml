  html: |-
    <p>I’m back, but I am desperate. :-)<br>
    I have Perla alternate (lower case) as my logotype - first question, would it look too confusing and “messy” to pick another font for the word “Collections” and for the names of the collections, or should I go with Perla all the way? The problem is that it’s very hard to read it when it’s a smaller size and it has to be smaller than the first page on the web site. And secondly, would it be even more confusing to choose two different fonts for the two collections and keep the rest of the text in something neutral like “Century gothic” or something more “clean”? I’ve been thinking about this -after someone suggested it to me - and it is a good alternative to the fact that I didn’t managed to get symbols for the two collections. </p>
    <p>If I should just go for Perla all the way except for the rest of the text, can anyone suggest a font that would match? Thank you!!   :-)</p>
