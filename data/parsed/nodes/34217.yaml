      <p>It’s customary to keep a logotype reserved for “special” purposes only. So you could certainly go with another face for headings and subheads. There are many that would work with Perla. </p>
      <p>Storm’s Walbaum is a great choice, or Emigre’s Filosofia (I hear the spacing is improved). Both look nice on screen. Or a geometric sans like Proxi<!--
