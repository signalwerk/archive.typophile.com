      <p>Thank you for responding.<br>
      I’m pretty sure that it’s actually not Exocet, there are many small differences:<br>
      I not sure if I have all the terminology right, but:<br>
      The W in Exocet has horizontal ends to the terminals.<br>
      The middle bar of the E is shorter than in Exocet.<br>
      The ends of the C are vertical in Exocet.<br>
      The serifs are quite different on many of the letters.</p>
      <p>Do you think it is a modified version of Exocet?  If so, is there software I could use to try to attempt to duplicate it?  I’d hate to have to photoshop everything, there’s a lot more text to it than just this.  I really need a nearly identical font for the application I’m working on.<br>
      Any other ideas?</p>
