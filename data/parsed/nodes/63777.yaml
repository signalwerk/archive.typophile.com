  html: |-
    <p>Hello fine critics! </p>
    <p>I'm working on a wordmark for a boutique book-bindery, called Wings for Willkie - a nod to Wendell Willkie's 1940 presidential race. After thorough discussion with their brave founder we've settled on an 'inky war-journal' look for the wordmark: a handwritten script, marked by the formal ease of the habitual correspondent. </p>
    <p>I've attached my initial attempt - but I'm afraid I'm deeply unaccustomed to designing script. Especially a loose, handwritten script. Advice narrow or broad would be delightful! Deep thanks, </p>
    <p>Reed</p>
    <p>(a few notes: I know the double-story 'g' and the roman 's' are most irregular. But for legibility and my love of ornate 'g's I submit their plea - am I wrong?)</p>
