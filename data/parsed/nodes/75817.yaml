    <p>Hello,</p>
    <p>For a paper I am preparing about the creative inspirations behind the birth of a typeface, I would like to know the various reasons for their birth according to each one of you who have designed a typeface. </p>
    <p>Why do you design a typeface?<br>
    What makes you want to design a typeface?<br>
    What is the germ of inspiration?<br>
    Which are the points of departure?<br>
    and<br>
    What stages does typeface undergo from the initial concept to the final design?</p>
    <p>I would be grateful if I can draw upon your wealth of experience to arrive at a few generalisations. Any link, image, quote, paper, publication related to this theme would be a valuable input and would be credited.</p>
    <p>Thanks in advance.</p>
