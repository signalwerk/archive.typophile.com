      <p>Thanks for all the book suggestions. I will try and get a copy of these. The Creative Characters site is also an excellent source. </p>
      <p>I agree, some typefaces might often take birth by accident, without much thought. But if you look back may be you can find some reasons for their birth which is what I would like to find out. May be I should leave the marketing or promotional aspects (which only come much later) aside and focus only on their birth aspects.</p>
      <p>In my preliminary studies, I have made some generalisations. Do let me know if I am wrong or if you think otherwise. Some typefaces may belong to more than one category.</p>
      <p>Reasons for designing a typefaces can be any of the following:<br>
      1. Commissioning for a particular purpose say for newspaper text (Gaurdian, Melior, Utopia), as a corporate typeface etc.<br>
      3. Faithful recuts/ revivals for contemporary use ( many versions of Garamond, Baskerville, Caslon, Bodoni etc.)<br>
      2. Inspired revival of an old classic for contemporary use (Sabon, Farnham, Miller etc.)<br>
      3. Making the best use of the current technology (Swift, Charter, Lucida, Verdana, Georgia)<br>
      4. Accidental inspirations: a glimpse of hand lettering, street signs, inscription, elements in Nature, more...? (Optima, Trajan, etc.)<br>
      5. Adaptation/ amalgam of a few existing typeface concepts to create something new (Any names here?)<br>
      6. Self-expression: some typefaces are designed to satisfy the designer's urge to express. (Mistral, Zapfino, Caflish script etc.)<br>
      Do only (or all) the script fonts belong to this category?<br>
      Where do you slot the seemingly calligraphic fonts like Palatino, Photina, Baker Signet etc?<br>
      7. Designers in non-Roman scripts also have the thousands of successful Roman typefaces as their fountain of inspiration. (Helvetica Arabic?)</p>
      <p>Any suggestions?</p>
