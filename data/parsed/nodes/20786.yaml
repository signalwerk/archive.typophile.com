    html: |-
      <p><cite>I’m not a pro, but I think it is beautiful.</cite></p>
      <p>thanks fontplayer! you're absolutely right about the customer. besides, I figure they'll be looking for something new within the year anyway. I was just concerned about developing my own skills.</p>
      <p><cite>If it were me I would want a different enough concept to justify the work</cite></p>
      <p>quite true. I'd like to get it back to paper (where I'm more comfortable) for some more analysis. is there any pervasive quality you can put into words that screams Perpetua to you?</p>
      <p><cite>If you started with Perpetua’s outlines</cite></p>
      <p>actually I started with it on paper. I was trying to think through Gill's reasoning by drawing the characters exactly as he had first. I then went back and attacked it with Perpetua nowhere in sight. once I had a good selection of characters down, I went into FLS5 to get a feel for the digitization process.</p>
      <p>that was all mostly just an excercise, but it happened to fit the bill on this project.</p>
      <p>for this version, I picked-up my drawings and matched Gill's stem width (I liked their weight on the page). I then proceded to touch up my outlines and spacing for use around 40 points.</p>
