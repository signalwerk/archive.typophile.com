    <p>-- edit --<br>
    I've added a better sample, per Paul's comment.<br>
    --</p>
    <p>I've done a lot of typographic design, logotype lettering, and all that, but this is my first commissioned font. that said, you would hope I gave it plenty of incubation time -- not so. hopefully you'll be kind enough to give me some direction for beta release two.</p>
    <p>the type is for a consumer catalog, that averages around six products per page, and favors filling the space as much as possible with image. it was to replace a very good titling script that had become the scape goat for other issues. the brief was to create something that was more readable and economical than a script, and it was suggested that it not be anything too "wierd". the biggest hurdle was that I had about two weeks of "free-time" to complete one weight and style that would be put to immediate use. to assist in my expediency, I started with series of drawings I had been working on for educational purposes -- something quite traditional, fortunately.</p>
    <p>I completed the font on time, and to great acceptance by the decision-makers on the project. the trouble is, the quality is not what I would like it to be (especially in terms of spacing), so I've been doing a lot of hand-work in it's use.</p>
    <p>I have some time now to re-address the type, but I'd like some solid feedback before I start messing around. any opinions would be much appreciated.</p>
