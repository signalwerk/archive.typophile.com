    html: <p>Yes, retains too much of Perpetua. If it were me I would want a different enough concept to justify the work that will be needed to complete it--as well as a reason for others to use it rather than Perpetua. If you started with Perpetua's outlines, there may also be legal problems, as Monotype Imaging's EULA doesn't allow modification.</p>
