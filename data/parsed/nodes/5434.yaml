    html: "<p>As I continue tinkering with the design, I've got a couple other layouts I'd like to toss out for consideration and see what you all think. For both, I've added additional information in the main \"box\" (added a title and moved the phone number up from the bottom of the card) and tried aligning it both left and right. I added color to the title simply to break up the block of text a bit. I think it the color also serves to help to emphasize the individual's name without it dominating the studio's name (as in the initial mockups).  <br> <br>I also played around with the size and positioning of the logo. I left it in place (lower left) for the first design below (#3) but scaled it 125% and moved it into the color block on the left (version #4). I like the contrast of the colors, which makes the logo appear to \"pop\" a bit more, and it also makes visible the outermost dark grey ring on the logo (which more closely matches my presentation of the logo on my website - <a href=\"http://www.bainbridgestudios.com\" target=\"_blank\">http://www.bainbridgestudios.com</a>), but it does seem to shift the balance of the layout quite a bit -- it feels more \"top heavy\" and less anchored with the logo moved up. <br> <br>Of these two I prefer the first (#3) and am somewhere between the revised #1 (#1B -- previous post) and this one.  <br> <br><img src=\"http://www.typophile.com/forums/messages/29/39778.gif\" alt=\"\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/39779.gif\" alt=\"\"></p>"
