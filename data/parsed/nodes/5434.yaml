    html: "<p>Number one is closed to 'horror vacui' but the best of the two. Number two: I think it's too crowded around the 'B' ... I think the light grey and ochre elements says \"decoration without purpose\" ...  <br> <br>Generally I like your choice of colours. <br> <br>I think the 'B' in the circle is problematic. You have drawn it in perspective, haven't you ... but something is wrong in the bottom ... it looks warped. And the tiny dark grey background just under the 'B' (inside the circle) must be hard to print in small versions. <br> <br>-- <br>S</p>"
