  html: <p>I've been struggling for some time with a variety of ideas for a business card layout for my graphic design studio. I've settled into a basic logotype and color pallette that I like and that I've recently deployed across my company website (<a href="http://www.bainbridgestudios.com" target="_blank">http://www.bainbridgestudios.com</a>). What I'm looking for in my business card is something that blends well with the look of the website and that has a bit of punch to it (a style that won't just blend in with every other business card in a person's pocket, for example). I've whittled my way down through about 15 different designs to two that I like, but I'm a bit stuck at this point. I'd love to get some feedback on these two looks, including preferences, further edits, refinements, etc.  <br> <br>Right now I'm personally tending towards the first sample, as I feel that the rectangular look goes well with the headings on the website and because I think it's a bit of a different look for a card front. My main concern with it is that it may come off as being too busy (the second sample was a reaction to that particular concern, something with a bit more white space).  <br> <br>For either design, I'm planning on a fairly simple dark grey back with the website's URL. I'm likely going with a heavy white card stock in a matte finish.  <br> <br><img src="http://www.typophile.com/forums/messages/29/39666.gif" alt="Business Card Sample 1"> <br> <br><img src="http://www.typophile.com/forums/messages/29/39667.gif" alt="Business Card Sample 2"> <br> <br><img src="http://www.typophile.com/forums/messages/29/39668.gif" alt="Business Card Back"> <br> <br>Any feedback and critiques would be greatly appreciated! Thanks for taking the time to look and review my work. <br> <br>Regards, <br> <br>Tom</p>
  html_clean: <p>I've been struggling for some time with a variety of ideas for a business card layout for my graphic design studio. I've settled into a basic logotype and color pallette that I like and that I've recently deployed across my company website (<a href="http://www.bainbridgestudios.com" target="_blank" class="link-external">http://www.bainbridgestudios.com</a>). What I'm looking for in my business card is something that blends well with the look of the website and that has a bit of punch to it (a style that won't just blend in with every other business card in a person's pocket, for example). I've whittled my way down through about 15 different designs to two that I like, but I'm a bit stuck at this point. I'd love to get some feedback on these two looks, including preferences, further edits, refinements, etc.  <br> <br>Right now I'm personally tending towards the first sample, as I feel that the rectangular look goes well with the headings on the website and because I think it's a bit of a different look for a card front. My main concern with it is that it may come off as being too busy (the second sample was a reaction to that particular concern, something with a bit more white space).  <br> <br>For either design, I'm planning on a fairly simple dark grey back with the website's URL. I'm likely going with a heavy white card stock in a matte finish.  <br> <br><img src="http://www.typophile.com/forums/messages/29/39666.gif" alt="Business Card Sample 1"> <br> <br><img src="http://www.typophile.com/forums/messages/29/39667.gif" alt="Business Card Sample 2"> <br> <br><img src="http://www.typophile.com/forums/messages/29/39668.gif" alt="Business Card Back"> <br> <br>Any feedback and critiques would be greatly appreciated! Thanks for taking the time to look and review my work. <br> <br>Regards, <br> <br>Tom</p>
