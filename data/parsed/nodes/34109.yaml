    <p>Hi everybody,<br>
    I know there are a lot of posts dealing with kerning issues but I couldn't find an answer to my question there. So here it is:<br>
    I'm working on a font containing 670 glyphs. I made the class-kerning and got 1500 pairs. There are many pairs in there that don't make sense. So I expanded the kerning to a flat table, resulting in 20000 pairs. In the next step I threw 10000 away or rekerned special combinations.<br>
    So my question is, does it still make sense to go with pair-kerning? Is there any text-software that can't handle class-kerning? And what would be the barrier for a pair-kerned font. I read somewhere that 5000 pairs are a maximum. Ah yes and yet another question, what do you think of the compress feature in fontlab 5. If I compress my 10000 pairs I get 2500 "class-pairs" with exceptions. Would that be the apropriate way to go?</p>
    <p>I'm beginning to go insane about this and would appreciate any kind of help.<br>
    Thank you guys in advance. </p>
    <p>felix</p>
