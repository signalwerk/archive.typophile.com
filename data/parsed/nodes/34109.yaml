      <p>Class based kerning should be the rule in OT fonts and is more economic, however, single pair kerning is legitimate too. There was another thread with a similar question (class kerning vs single pair kerning in 'kern' feature) but I cannot find it ...<br>
      In my experience, 'Compress' does a good job. But make sure you have flagged your kerning classes correctly as leftside/rightside classes -- the checkboxes next to the class name in the classes panel. 'Compress' relies on these settings.</p>
      <p>AFAIK, the 5000-pair-maximum was meant for the 'kern' table (not the 'kern' feature), this was about the amount which e.g. XPress 4 could handle.</p>
      <p>Karsten</p>
