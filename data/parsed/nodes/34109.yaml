      <p>I think I am one of the few -- perhaps the only one -- who sits on the flat pairs kerning side. I have stumbled on too many problems with class-based kerning, among them my own ability to keep things straight.   In the old Type 1 days, we made up fonts of about 400 glyphs. Of course, only 254 could be encoded at once, but all the kerning was in the font.</p>
      <p>I would typically have from 1500 to 2500 kern pairs, a lot of them punctuation. You have to pay a lot of attention to sidebearings; sometimes you find yourself kerning a lower-case letter with 20 other lower-case letters, and that's often the sign of an error -- but not always (f comes to mind). Vowels with diacriticals may need side-bearing work.</p>
      <p>With OT, contextual alternates can help with awkward pairs, such as an alternate "f" with any vowels having a grave or macron accent. Frequently that "f" will work with a wordspace too. Or, with f-accented-vowels, I sometime make ligatures.</p>
      <p>I do use class-based kerning, esp. with things like any number followed by any numerator (with "arbitrary" fractions).</p>
      <p>Another issue is whether or not you plan to ever revisit your font. If not, figuring out what in the world you did six months or a year ago is less of an issue -- unless your customers are complaining too much.</p>
      <p>There are always compromises, and I suppose if you pick better ones, you can use more class-based kerning, carefully, and avoid some of the trains wrecks I see in the kerning of many OT fonts.</p>
