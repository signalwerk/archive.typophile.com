  html: |-
    <p>Afternoon,</p>
    <p>Just wondering what the views here are to an online library/catalog where work could be referenced and viewed in relation to it’s typeface (maybe by tagging in the meta-data), so that you could search for a typeface and see it in context as opposed to just as an alphabet list?</p>
    <p>Do you think this would have any useful application, possibly for students/academia?</p>
    <p>Really interested to see what you think.</p>
    <p>Thanks</p>
    <p>Chris</p>
