      <p>@ Miss Tiffany</p>
      <p>I think it would be a mix of open environment, allowing freelance designers, smaller studios and students to upload and catalogue work, and maintained so that I can hopefully get some of the bigger studios and design groups involved. I’m thinking I’d have to carefully monitor it though so as to make sure it doesn’t end up breaching any copyright.</p>
      <p>Thanks for the heads up on that one, maybe they’ll hold a copy at St Martins, I’ll have to give them a go next time I’m in.</p>
