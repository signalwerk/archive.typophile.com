      <p>Chris that would be very interesting. Do you think of it as an open environment where others can add pictures and tags?</p>
      <p>You  might be interested in the work Eric Kindel did as Central St Martins. <em>Typeform dialogues: a comparative survey of typeform history and description, compiled at Central Saint Martins College of Art &amp; Design.</em> It was never published, but it was set to be published at one time by Hyphen Press.</p>
