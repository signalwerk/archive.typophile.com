      <p>@ David R and Koppa</p>
      <p>Thanks for replying, I’m actually looking at it as part of my MA research, it’s involved with new and effective ways to catalogue and preserve type, but has stretched to looking at design in general and provide learning resources for students and teachers alike.</p>
      <p>I just want to see what sort of reaction the concept gets from the type/design community before I launch headlong into it!</p>
      <p>Any suggestions for what you would like to see included in such a tool would be greatly appreciated.</p>
      <p>Thanks</p>
      <p>Chris.</p>
