    html: |-
      <p>If you want your current outlines in the Mask layer, which is outline-based, then: Edit / Select All, Tools / Mask / Copy Outline to Mask, Edit / Lock Layers Mask. </p>
      <p>If you want your current outlines in the Background layer, which is bitmap-based, then: Preferences / Edit / Select All, Tools / Background / Create Background. Before you do that, you can set the background layer resolution in Preferences from the default 200 (which is quite low-res) to something like 2000.</p>
