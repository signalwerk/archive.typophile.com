  html: |-
    <p>When I'm going through my glyphs and reducing the number of nodes in them, it would be nice if somehow I could place a copy of the glyph with the extraneous points in a non-editable background layer somehow.  This is because a lot of times deleting extra nodes will change the shape of the curves and I usually can't remember exactly what those curves looked like.  So, placing a copy of the original behind the modified version would allow me to match the curves more precisely. </p>
    <p>I suppose I could load the font on my system and render out pics one by one in photoshop, but I wonder if there is an easier more direct way to do this in Fontlab?</p>
