      <p>Is /a/ too wide?</p>
      <p>Hook and crossbar of /f/ might need clearer definition somehow.</p>
      <p>The shapes of the whites in /S/ and /s/ are now better, but both letters look too thin in the spine to me.</p>
      <p>/K/ may be too close to /H/.</p>
      <p>/M/ looks backwards (flipped horizontally) to me.</p>
      <p>The figures look simpler than the letters - almost like a different font. At least consider adding a serify bump to the top terminal of /5/.</p>
      <p>The section mark looks too black. /#/ probably too. The copyright is terrific! I like the asterisk too.</p>
      <p>I agree that flipping the top serif of /d/ to the other side is worth trying.</p>
      <p>Keep up the good work.</p>
