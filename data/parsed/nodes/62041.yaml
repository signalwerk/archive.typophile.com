      <p>Wow. On it's way to sexiness. I like.</p>
      <p>This may be completely subjective, but I think the letter S is naturally one of the most sexy, appealing letters of all, in any typeface. Yours however feels a little too quirky and awkward, compared to what you've achieved in the rest of the face. The z, &amp; and $ might be in the same boat. I think you are closer in other triple-tiered miniscule letters (a &amp; e). Your "g' however is verging on fantastic!</p>
      <p>For what it's worth! I love where you are going with it. Keep it up, please!</p>
