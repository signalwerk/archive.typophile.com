    html: |-
      <p>Very good stuff.</p>
      <p>There are a few parts that are unexpectedly thin and could be thickened, like the joins of g, the curled terminal point of g and Q, and the crossbar of H.</p>
      <p>The key to improving s,S,z,Z may be to remember that the bottom does not have to be the same as the top.</p>
      <p>T is unique in its lack of softness. The bottom should probably be rounded. If you can't find a different solution to the straight flat top of T, you might distribute that flatness to a few other letters like L and Z so it is not alone. But E and F look good to me as they are.</p>
    html_clean: |-
