    date: 2006-12-11T13:21:00
    votes: null
    html: <p>I'm going to jump on the "don't go trendy" bandwagon. You'll just create something that looks like it was churned out by a grownup trying to look cool. You'll be much better off to come up with a strong concept that appeals to teens and then pick fonts that work with the concept. I think that's why the ”Truth” anti-tobacco ads work so well; they don't at all resemble most advertising that targets teens.</p>
