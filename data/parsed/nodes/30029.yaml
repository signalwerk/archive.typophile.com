    html: |-
      <p>Just a though: when I was a teen (not that many years ago) any attempt by anti-drug / sexual health / eat your veggies groups to be cool was decidedly un-cool. I think that appealing to the older end of your spectrum (at least design-wise) would be a good idea, since teens are always trying to act older than they are.</p>
      <p>Also, teens are very cliquey - the hip hop kids don't associate with the emo kids. Depending on what group you want to target, the design aesthetic will change. My suggestion is to look at popular album covers and try to replicate the look of Snoop Dogg or whomever the kids are listening to these days.</p>
      <p> - Lex</p>
