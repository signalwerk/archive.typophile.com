      <p>lol@ lex.</p>
      <p>Yes Omnes is quite nice and I'll keep it in the 'potential' list.</p>
      <p>Also, I think some of the 'trendier' campaigns are not really concerned with longevity, they just want something that appeals 'this year'. My favourite is the new (RED) campaign for AIDS, aside from that I have to agree that everything else is pretty played. </p>
      <p>The demographics don't lend well to using scripts, as part of it won't even appear in standard English alphabet languages.</p>
