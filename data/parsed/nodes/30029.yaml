    html: |-
      <p><strong>Circa 1985:</strong><br>
      "Well, kids these days like the band Poison. Let's use Hot Pink on Black and use a really Xtreme typeface! Then we can get a Longhaar wearing lipstick to pitch for us. The kids will dig it."</p>
      <p><strong>Circa 1995:</strong><br>
      "Well, kids these days like the band Nirvana. Let's use a really Grungey typeface and get a depressed looking Longhaar wearing flannel to pitch for us. The kids will dig it!"</p>
      <p><strong>Circa 2005:</strong><br>
      "Well kids these days like that Snoopy Dog rap guy. Let's use a graffiti typeface and get a really menacing looking black man to pitch for us. The kids will dig it!"</p>
      <p>Lesson? </p>
      <p>DON'T BASE YOUR DESIGN ON CURRENT FADS IN POPULAR MUSIC.<br>
      (Sorry Lex...)</p>
      <p>If your message is serious, then make the design appropriately. The last thing we need to see more of is an AIDS ad with graffiti and a menacing looking black man saying that we should practice safe sex just because someone thinks that Snoop Dogg is cool. </p>
      <p>Choose typefaces and and designs that clearly communicate YOUR message, not someone else's.</p>
