    <p>Hello everybody,</p>
    <p>I'm new on this forum as a registered user, but i read a lot of your topics during the development of my first typeface,<br>
    so, first of all, thanks!</p>
    <p>Second of all, i'd like to read your opinion about Claus, the typeface i'm trying to develop for about 2 months...</p>
    <p>I decide to develop a typeface as an exercise to understand how typography works...</p>
    <p>Any kind of critic is accepted..</p>
    <p>hope to hear you soon</p>
    <p>Silvio</p>
    <p>P.S. Obviously I'm posting a beta version....I hope through your suggestion I'll avoid a lot of mistakes</p>
