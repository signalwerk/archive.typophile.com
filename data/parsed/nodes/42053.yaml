    html: <p>Thanks Randy, I will try what you suggest, spacing and kerning are the most difficult things I think...</p>
  - id: 258677
    user_id: 7783
    user_name: Randy
    user_path: null
    date_raw: 13 Feb 2008 — 1:52pm
    date: 2008-02-13T13:52:00
    votes: null
    html: |-
      <p>You are welcome!</p>
      <p>Also, most of the letters are relatively narrow, which is fine. But with that in mind, some of the letters seem a little wide (VWXYZ, and u).</p>
      <p>Top right of the K is low.</p>
      <p>S spine needs attention</p>
      <p>The joins on your diagonals WVM etc seem too flat to me, but my preference is more of a point when possible.</p>
      <p>Take another look at your stem connections in letters like nmhbd etc. It seems like the arch stroke gets thick again before it joins the stem instead of tapering down until it joins.</p>
      <p>And yes, spacing is difficult. But like all parts of type design, it is mostly about training your eyes how to see. To see that something is wrong, and even harder to see what is making it wrong. It looks like you have good instincts for it, so keep going!</p>
      <p>Randy</p>
