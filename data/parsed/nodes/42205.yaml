    <p>Any suggestions on a serif that could paired with <a class="freelinking external" href="http://www.felicianotypefoundry.com/main/?page_id=10" rel="nofollow">Flama</a>? </p>
    <p>This is for a corporate identity program for a hospitality group that runs a chain of luxury business hotels. The serif would typically be used for body text in applications like their in-house magazine, menus etc. </p>
