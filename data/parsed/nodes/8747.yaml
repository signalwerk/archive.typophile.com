    html: <p>Yes, that helps. <br> <br>It's hand-drawn lettering, somewhat in the style of Ed Benguiat, but not as interlocked as the new House <a href="http://www.houseind.com/house.php?kit=EDFONT-FO&amp;sub=view" target="_blank">Interlock</a> font in their Benguiat set. <br> <br>Treacyfaces has shown some new fonts called Toreador, Safari and Picador, that seem to be based on the same stylistic look as the movie poster lettering, but their web site doesn't show them yet. I have only seen a sample of these in print ads that show very few letters. <br> <br>I can't think of any other fonts right now that have much of this feel other than some of <a href="http://members.aol.com/fontner/frontpage.html" target="_blank">Harold's Fonts</a> called Denney One &amp; Two and Ben's Gothic. Both are a bit 'rougher' than your poster lettering.</p>
