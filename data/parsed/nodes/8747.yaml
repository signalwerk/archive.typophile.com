    html: <p>Christine, the way this forum works is that you show us the image of the lettering you want us to identify (in .gif or .jpg format, or on a web site), and then we see if we can tell you what font was used. There have been many editions of the Sound of Music that have been issued on posters, video &amp; DVD, so we cannot know which one you want identified. <br> <br>Remember that the movie came out about 20 years before there was anything like the current digital fonts, and in the 60's  poster lettering was done using photo type, or hand lettering in most cases. <br> <br>In other words, the poster lettering may never have been digitized as a font. (Just to prepare you to possibly be frustrated.)</p>
