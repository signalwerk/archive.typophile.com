    html: <p>You may be embarking on a fool's errand. It was not uncommon for foundries in the 1800s simply to number their gothic typefaces—e.g., Gothic No. 7, Gothic No. 13, etc., or sometimes simply Gothic Condensed or Gothic XX Condensed.</p>
