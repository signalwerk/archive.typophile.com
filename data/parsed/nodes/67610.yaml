      <p>ah, yes. a look in the american typefounder's index:</p>
      <p><a href="http://www.aapainfo.org/atf/ATF.pdf" title="http://www.aapainfo.org/atf/ATF.pdf">http://www.aapainfo.org/atf/ATF.pdf</a></p>
      <p>scrolling down to the "gothic"s, we pages of them. no matter, it just gives me a better idea of what i'm looking for. i didn't really need to know this exact typeface— i'm just curious as to the story behind the gothics.</p>
      <p>brockfrench— i agree, the blocks, when dirty, are pretty, but i'm using them for printing, and if they're coated in congealed printing ink they don't work well. the texture that it produces when printed is nice, but is not for everything. besides, i can always dirty up the lead again if need be. a sample:</p>
      <p><a href="http://i50.tinypic.com/t4vdvm.gif" title="http://i50.tinypic.com/t4vdvm.gif">http://i50.tinypic.com/t4vdvm.gif</a></p>
      <p>eliason— it's 72 point type, if that helps. again, i'm not interested in this exact face. a minor curiosity is all.</p>
