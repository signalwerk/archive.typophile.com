    html: |-
      <p>Thanks for the advice John. I am having trouble using the pear within the logo and keep it as a balanced logo. It just does not feel right wherever i place it. And another thing is, like you were talking about, you want to quickly find out the flavor, but some people might not realize that it is a silhouette of a pear, but i don’t want to clutter up the bottle too much with a main type logo, then the pear, then text saying “pear”.</p>
      <p>I had tried using the fizz inside the U instead of outside, but i also ran into some problems with that. Since the U is open at the top, the bubbles made it look like the U had chicken pocks or something.</p>
      <p>One reason i disliked the original logo with the fruit to the left, was because it wrapped too much around the bottle for me, looking straight on at it, you lose either part of the fruit or the last letter or so. Making it smaller looks awkward, so i thought maybe vertical, which makes the type look good, but the fruit on it’s side looks weird.</p>
      <p>I am getting frustrated with this, because i have worked on it for a while, and when i think i am done, i start to notice things i want to chance, but i am not sure how to change them for the better, guess that is part of design that i will learn to overcome.</p>
      <p>Oh and John, do you have any suggestions for “sparkling fruit remedy”? I personally don’t think the kerning is too loose, but someone else had mentioned that to me as well.</p>
