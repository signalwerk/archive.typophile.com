      <p>Trying out all these suggestions has been a great exercise in exploration and comparison, but to be honest, I’m not convinced it has necessarily improved upon your original preferred workmark.</p>
      <p>In your first post, your gut was telling you that the option on the right was perhaps better than your first. I think your gut was right, as many here have said. However, I’m of the opinion that flattening the bottom of the “U” was unnecessary and has failed to make it a recognizable drinking glass. The (questionable) benefit of seeking out this resemblance is outweighed by how awkward this new “U” now looks beside the other letterforms. Looking at it, I was left wondering: Wouldn’t a convincing test tube be better than an unconvincing drinking glass? Haven’t we just inadvertantly turned it into a beaker? <a href="http://img.alibaba.com/photo/51184814/Beaker.jpg" title="http://img.alibaba.com/photo/51184814/Beaker.jpg">http://img.alibaba.com/photo/51184814/Beaker.jpg</a></p>
      <p>In the end, we get a sort of drinking glass/test tube hybrid. A compromise.<br>
      In my mind, the test tube connotation was much bolder, more intriguing and conceptually richer.  Your original preferred design achieves everything the latest version does, and is, in my opinion, the simpler and more elegant of the two.</p>
      <p>As for identifying the flavour, I think you’re on the right track using a combination of colour and icon. Keep Brian’s suggestion in mind, use text creatively and avoid being redundant.</p>
