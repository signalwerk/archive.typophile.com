    <p>I was just wondering if you guys might be able to check out this pdf and tell me if you like the left or right logo the best. It is for a package design project in my Communication Design 1 class. I created a sparkling fruit drink called “cure” and came up with 4 flavors, and have to create the actual bottle and 4-pack carton.</p>
    <p>I thought i was finished with my logo, but i started messing around with it again today, and came up with a new version (the logo on the right). I am leaning towards the new one, just because it seems a bit more universal, but i wanted a second opinion from you guys. I think if i choose the one on the right, i will have the little pear at the bottom of the bottle, maybe with a little text saying “pear” to distinguish the flavor. Oh yeah, this is just the “pear” flavor.</p>
    <p>Thanks!</p>
    <p>Josh</p>
