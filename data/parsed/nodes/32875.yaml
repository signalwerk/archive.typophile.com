    html: <p>I think you have a few issues to fix with the look of the logo. I don’t know if the “sparkling fruit remedy” should be kerned across the entire length of the word. It just seems too open. I’d almost like to see you still explore more with the U and the “bubbles.” I think there’s a better solution out there for that. Perhaps try using the circles inside the U – containing the fizz as the bottle is not yet open when it’s on the shelf. I would also think about the placement of the pear, as I find that is the strongest solution of the naming conventions displayed. Remember, at eye level you’re reading “cure” at the top of the bottle, you want to quickly find the flavor and not search for it at the bottom. Perhaps it’s right above or below the wordmark. I hope this helps –&nbsp;best of luck.</p>
