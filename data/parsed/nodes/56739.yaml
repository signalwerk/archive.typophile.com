    html: |-
      <p>What Allimac said.<br>
      Usually what I do (I love making maps) is draw the rough basis as a stroke, then duplicate the layer just to make sure, outline the stroke and manually edit the outlines (because depending on map style, a river especially might actually look better when it's not "mathematically correctly" growing in width).<br>
      But yeah, definitely do it in Illustrator. Hell, you could even do it in FontLab. ;-)</p>
