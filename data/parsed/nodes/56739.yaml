    <p>Dear Typophiles,</p>
    <p>I realise this is more cartography than typography but thought someone might be able to help. I have to redraw a map using InDesign (or Photoshop I suppose). It exists only as a flipchart with marker pen drawing.</p>
    <p>The map contains type and normal map icons such as hills and houses. There is a river on the map. I want to have the river growing in width as it nears the sea. I don't think a stroke can change width along its length so is there another way I can draw the line with a uniformly expanding width?</p>
    <p>Thanks in advance :)</p>
  html_clean: |-
