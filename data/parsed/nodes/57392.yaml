      <p>Gill Sans is a great typeface, I’d go with that. It’s even part of the logo.</p>
      <p>If you’re looking for something a bit more unique, <a class="freelinking-external" href="http://new.myfonts.com/fonts/suitcase/dederon-sans/">Dederon Sans</a> is also nice and friendly, and he/she can even purchase the <a class="freelinking-external" href="http://new.myfonts.com/fonts/suitcase/dederon-serif/">serif version</a> to go with it.</p>
