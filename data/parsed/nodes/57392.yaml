  html: |-
    <p>Im working casually on this logo.  ( casually  in very discounted rates because family / friend etc ) </p>
    <p>Im thinking about helping further with this by finding a suitable typeface to define the Branding with. ( am i too nice? )</p>
    <p>Something light and friendly. Gills Sans ( MT version used in logo ) and Myriad Pro are hight on my list right now.</p>
    <p>Im wondering if any typophiles might school me on these choices and/or  care to share feedback on the logo and use of cc spills.</p>
    <p>cheers people!</p>
