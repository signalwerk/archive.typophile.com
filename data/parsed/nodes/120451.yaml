      <p>Good find on the Linotype Dala – clearly another font with a similar background, inspired by the Dala painting tradition I linked to in the first post. But I do think this <em>is</em> type – because of the similar repeating letters, the layer-based drop shadow and the otherwise completely contemporary packaging:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/DSC_0051_4129.jpg"></div><p></p>
      <p>Note a more conventional fraktur in the "god jul" (Merry christmas) vectory faux-seal. Maybe more products will appear closer to the holiday season?</p>
