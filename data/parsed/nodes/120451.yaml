    <p>Spotted this type on a package of gingerbread dough at the supoermarket today. May well be proprietary – it's meant to evoke the kind of folksy blackletter-esque lettering that's found in <a class="freelinking external" href="http://www.nordiskamuseet.se/sites/default/files/styles/adaptive/public/public/amnen/mobler-boende/dalmalning_0198927.jpg?itok=aNthJBGR" rel="nofollow">traditional rural painting in Sweden</a> (almost rotunda-like, except on the other extreme of Europe) , and I'm not sure whether that's a commercially viable style. But on the off-chance it's available, anyone have any leads?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/pepparkaksdeg_3832.jpg"></div><p></p>
