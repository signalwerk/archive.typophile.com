      <div class="comment-spam-body"><p>Edited:<br>
      This round-script Fraktur lettering looks warm and inviting compared to the choppy forms of standard Fraktur.<br>
      Interesting options for uppercase letters include the flowing letterforms of some of the letters in OPTI's Modern Blackletter </p><div class="imageWrap"><img src="http://typophile.com/files/OPTIModernBlackletterAsSTOW_5840.jpg"></div><br>
      I suspect that this is one of the relatively few fonts that OPTI independently digitized. OPTI is a defunct operation and its fonts are now orphans. Deiter Steffmann pirated the font and called it Fraktur Moderne.<br>
      Look closely at the lowercase and you will see that behind the flowing curves of the script are the broken stroke letter-forms of the classic Frakturs such as<br>
      Wittenberger Fraktur<br>
      <a href="http://www.myfonts.com/search/Wittenberger+Fraktur/fonts/" title="http://www.myfonts.com/search/Wittenberger+Fraktur/fonts/">http://www.myfonts.com/search/Wittenberger+Fraktur/fonts/</a><br>
      Neue Luthersche Fraktur<br>
