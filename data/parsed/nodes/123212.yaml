  html: |-
    <p>From a book I typeset in the early 1980s using an Exxon Qyx electronic typewriter interchangeable wheel font, whose name I cannot remember.  Some of their fonts were well known but this one maybe a Qyx house font. Note that the typographers quotes and apostrophe in the attached sample were not on the wheel. They were made by typing, cutting out and pasting commas.  Thank you for any help.</p><div class="imageWrap"><img src="http://typophile.com/files/ExxonQyxfont_4448.jpg"></div><p></p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        Qyx's own so-called Boldface        </div>
            </div>
    </div>
    <div class="field field-type-userreference field-field-solvedby">
          <div class="field-label">Solved By:&nbsp;</div>
        <div class="field-items">
