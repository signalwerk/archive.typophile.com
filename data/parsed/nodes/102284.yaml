      <p>"Alex/Celebrate" is <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-1&amp;ffam=ANGEL%20TEARS%20-%20trial&amp;fid=22a0ea04b8e51b48d3a3b868b4b651f0&amp;fsize=60&amp;text=Alex%20Class%20Of%20%20Celebrate&amp;fit=1" rel="nofollow">ANGEL TEARS</a></strong> by Billy Argel (Free for Personal Use)<br>
      "SANDERS 2012..." is <strong>Captain Howdy</strong>  by Harold Lohner (1999)<br>
      "6:00 PM" looks like a modified <strong>Oklahoma</strong> by Harold Lohner (2006)</p>
