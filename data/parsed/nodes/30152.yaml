      <p>This has come up before .. but...</p>
      <p>The top looks like a typeface used by Duchamp for » La mariee mise a nu par ses celibataires meme « <a href="http://www.moma.org/images/collection/FullSizes/00093022.jpg" rel="nofollow">Link</a> recently re-brought to life by <a href="http://www.lineto.com/The+Designers/Jonathan+Hares/" rel="nofollow">Jon Hares</a> see also the SCHNITTPUNKT identity by Elektrosmog <a href="http://www.esmog.org" title="http://www.esmog.org">http://www.esmog.org</a></p>
      <p>The bottom is a modified version of the Tate typeface by <a href="http://www.practise.co.uk/work/2003/olafur-eliasson.html" rel="nofollow">Practise</a></p>
      <p>Not, that any of that gets you any closer to an alternative.. Especially if you want one not so modular / "tech-y", and not Moreys Frieze. Sorry.</p>
