    html: <p>Yes, you would use GSUB lookup type 3 (one-to-one-of-many) so you would map from the default glyph to an enumerated set of possible alternates. See the <a href="http://www.microsoft.com/typography/otspec/features_pt.htm#rand">&lt;rand&gt; feature description</a> in the OT spec for more details.</p>
