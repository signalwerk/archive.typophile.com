    <p>Hello,</p>
    <p>I'm creating an erotic magazine as a school assignment, and for the logo I'd like to use an extremely decorated font. I'd like it to be something like the following:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/22f0ded100261060ba8acbc3d148c0b7fc252905_m_2_5334.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/200px-Pulp-We_Love_Life_5974.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/porn-_4705.jpg"></div><p></p>
    <p>The thing is, I can't find any digitized versions of the like. I found out the guy that did the cover typography on Pulp's "We love life" is called Louis John Pouchée, but it seems like these decorated typefaces only exist as metal. I've tried Identifont and all the others, and also tried searching the forums, but so far nothing showed up.</p>
    <p>Any help on digital versions in this style would be greatly appreciated!</p>
    <p>Thanks,<br>
    Daniel</p>
