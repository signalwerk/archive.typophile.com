    html: <p>Tiffany, <br>This is where I labour in obscurity and with little apparent effect. Here presented in what the ID Manual says is most preferred to least preferred presentation. The idea is that where horizontal space is at a premium you stack it up. The Bodoni is hellish to deal with in web presentation no matter which layout is put to use. Also in example 2, the words 'Public Library' appear larger than the word 'Vancouver'. This is an optical illusion, in the artwork they are exactly the same size. I can't think of any where the logo or logotype is rotated 90 degrees which would be the other thing that occurs to me. Airlines for airplane livery? <br> <br><img src="http://www.typophile.com/forums/messages/4100/18092.gif" alt=""></p>
