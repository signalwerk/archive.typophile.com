    <p>No, the LA event* was not a one night stand!<br>
    We're a go for N-O: <a href="http://www.typecon.com/archives/400" title="http://www.typecon.com/archives/400">http://www.typecon.com/archives/400</a></p>
    <p>Bring your laptop, your skills and your guts. Hat optional (but it's a<br>
    great symbolic touch - just sayin'). There's a local street performer of<br>
    20 years giving me advice on etiquette and exactly where to settle in.<br>
    We're working on the portable chairs. Jackson Square is a quick hop<br>
    from the conference site. It doesn't get better than this. Big or small,<br>
    let me know if you're in** and we'll do this thing.</p>
    <p>* <a href="http://www.typecon.com/archives/69" title="http://www.typecon.com/archives/69">http://www.typecon.com/archives/69</a><br>
    <a href="http://www.flickr.com/photos/stewf/4911947563/" title="http://www.flickr.com/photos/stewf/4911947563/">http://www.flickr.com/photos/stewf/4911947563/</a></p>
    <p>** hpapazian at gmail dot com</p>
    <p>hhp</p>
