  html: |-
    <p>So I recently saw Moon (great movie, by the way). I kind of laughed when I saw that they used Eurostile in the film for "Lunar Industries" as well as signage and such on the moon base (the titles were Bank Gothic - another popular choice). Clearly this is a visual cliché, but II'm having a hard time remembering where else I've seen this. So I'm asking typophile - what other movies/tv shows can you think of?</p>
    <p>Preferably within the movie/series, but if it's used for titles that's okay too. I did look up Eurostile and Microgramma on Wikipedia, and came up with these:</p>
    <p>2001: A Space Odyssey<br>
    The Andromeda Strain<br>
    Gerry Anderson's Captain Scarlet and the Mysterons, Space: 1999 and UFO<br>
    Several Star Trek movies, and ST: Enterprise<br>
    BSG (main title)</p>
    <p>If there's enough of them I'll even make a video compilation (aka a <a href="http://waxy.org/2008/04/fanboy_supercuts_obsessive_video_montages/">supercut</a>).</p>
