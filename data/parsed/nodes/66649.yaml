      <p>James Cameron's Aliens is covered in Eurostile, although I can't find any stills online that show it. Two good examples from memory: as Ripley and the marines enter the medical centre for the first time, all the storage units are labeled with an in-line version of Eurostile; as the marines venture down to Sub-level 3 of the atmosphere processor, each floor has a big, glowing Eurostile name and number. </p>
