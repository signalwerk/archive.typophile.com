    html: |-
      <p>Welcome to Typophile, Holly.  </p>
      <p>I'd recommend you take a different approach to get a logo for your "AC Commons" project. A logo should be designed by someone who knows your organization, the image it is trying to project, it's goals, etc.  Asking for logo ideas on a website like this will get top-of-the-head ideas from people who know little or nothing about your organization.</p>
      <p>The best solution is to hire a professional graphic designer to work with you. If your budget doesn't permit that, perhaps a graphic design student at a local university would be willing to give free help in order to get a nice portfolio piece. And if you are a non-profit, you might find a professional designer willing to donate their services.</p>
