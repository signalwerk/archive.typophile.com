  html: <p>We have a large initiative at our organization.  We have purchased new Microsoft Office 365 and will be changing the way our business collaborates, connects, communicates, contricutes, and creates using the different  tools.  We will be using cloud hosted SharePoint, Yammer, Lync, Skydrive, and Office 2013.   We have selected a name "AC Commons" to represent a common place to do all of these things.  We were thinking a green color.  Does anyone have any recommendations for a logo design for this title?  Thank you!</p>
  html_clean: <p>We have a large initiative at our organization.  We have purchased new Microsoft Office 365 and will be changing the way our business collaborates, connects, communicates, contricutes, and creates using the different  tools.  We will be using cloud hosted SharePoint, Yammer, Lync, Skydrive, and Office 2013.   We have selected a name "AC Commons" to represent a common place to do all of these things.  We were thinking a green color.  Does anyone have any recommendations for a logo design for this title?  Thank you!</p>
