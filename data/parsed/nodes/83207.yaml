  html: |-
    <p>Hello Everyone,</p>
    <p>My plan is to show the best typograhy designs that were created in Hungary during the last century.</p>
    <p>A good source to see some Hungarian designs are these two sites:</p>
    <p><a href="http://www.varkonyigallery.com" title="http://www.varkonyigallery.com">http://www.varkonyigallery.com</a><br>
    <a href="http://www.plakatbolt.com" title="http://www.plakatbolt.com">http://www.plakatbolt.com</a></p>
    <p>They are both my sites, I'm a Hungarian vintage poster dealer. However, my aim here is not to sell my posters, but rather to show the quality of Hungarian graphic designers (mainly in the 60s &amp; 70s).</p>
    <p>Cheers,</p>
    <p>Adam</p>
