  html: <p>I'm applying for entry level finance and accounting positions and want to know what fonts graphics professionals would think best. From the previous posts I gather that serifs pair well with sans serifs and that layout is more important than design.  I am still wondering though, what fonts work best together for a traditionally conservative  field?  I would really appreciate any advice. Thank you in advance.</p>
