      <p>For a business resume I wouldn't stress too much about the font. The most applications and resumes (from non designers) I receive have been set with Verdana or Times New Roman and they do the job just fine for what it is. (Yes, I know Verdana is meant to be for web only)</p>
      <p>I would go for something neutral within the standard font packages like Palatino, Janson, Garamond etc and then maybe some 12 pt Helvetica for the headings. Just keep it simple.</p>
      <p>You should also consider that if you email a word document and the receiver doesn't have the same font on his/hers computer it will chance the layout. So always email a pdf rather than a word-document if you don't print it.</p>
      <p>I'm sure some of my fellow type geeks can give some great advise as to why a beautiful font like <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100017 " rel="nofollow"> Mercury</a> can make it more legible and elegant, but I really don't think it matters too much in a business resume – as long as you never use Comic Sans.</p>
