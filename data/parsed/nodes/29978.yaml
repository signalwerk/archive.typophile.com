      <p>My initial impression is that a falling (trust me, only MotoGP gods can get a bike over that far) logo might not be the right way to go for a motorcycle shop, the perspectives seem out for the various elements. I would also clean up some of the bumps caused by the outline, especially at the base of the M and N, at the top of the S and where the L meets the T.<br>
      Tim</p>
