    html: |-
      <p>As I see it there are two ways to go here. Either you design something entierly new without inheritance from earlier motorcycle logos or you go for the similarity...</p>
      <p>If you go for similarity the brands you mentioned above are (according to me) slightly more "modern" than for example Harley Davidson or Triumph. I would go for a fat and wide font like Annonce from Canada Type ore something like that. Something with impact. <a href="http://www.myfonts.com/fonts/canadatype/annonce/" title="http://www.myfonts.com/fonts/canadatype/annonce/">http://www.myfonts.com/fonts/canadatype/annonce/</a></p>
      <p>If you on the other hand wish to do something more classic you can always use a font like Euphonia from Sentinel Type or Maximo from Red Rooster. <a href="http://www.myfonts.com/fonts/sentinel/euphonia/" title="http://www.myfonts.com/fonts/sentinel/euphonia/">http://www.myfonts.com/fonts/sentinel/euphonia/</a> <a href="http://www.myfonts.com/fonts/redrooster/maximo-rr/" title="http://www.myfonts.com/fonts/redrooster/maximo-rr/">http://www.myfonts.com/fonts/redrooster/maximo-rr/</a></p>
      <p>Just some spontaneous suggestions...</p>
