    <p></p><div class="imageWrap"><img src="http://typophile.com/files/HDL-Logo-300x167_5726.jpg"></div><p></p>
    <p>Monotype’s Director of Words and Letters, Allan Haley, will Present “Typographic Master Lessons” on May 13, 2014, at 4:30 p.m., at the Hynes Convention Center. </p>
    <p>Allan’s presentation will offer sage advice, design solutions and typographic inspiration from some of the most highly regarded design teachers and mentors, including Gail Anderson, Kit Hinrichs, DJ Stout, Michael Osborne, Carin Goldberg, Sean Anderson and Erik Spiekermann.</p>
    <p>For more information on HOW Design Live, visit <a href="http://www.howdesignlive.com" title="http://www.howdesignlive.com">http://www.howdesignlive.com</a><br>
    For more information on Allan’s presentation, please read the press release here <a href="http://bit.ly/1ouSdFe" title="http://bit.ly/1ouSdFe">http://bit.ly/1ouSdFe</a> </p>
    <p>Allan will also be hosting a giveaway at the event for the following libraries:</p>
    <p><strong>Linotype Originals Library</strong><br>
    The Linotype Originals Library CD includes all of Linotype's prominent designs such as the <a class="freelinking external" href="http://fonts.com/font/linotype/helvetica " rel="nofollow"> Helvetica</a>, <a class="freelinking external" href="http://fonts.com/font/linotype/frutiger " rel="nofollow"> Frutiger</a> and Optima typefaces in addition to recent releases such as <a class="freelinking external" href="http://www.linotype.com/184368/morrissans-family.html " rel="nofollow"> Morris Sans</a>, <a class="freelinking external" href="http://www.linotype.com/3201/palatinosans.html " rel="nofollow"> Palatino Sans</a> and Generis. This collection is a valuable resource for just about any project. <strong>Street price: over $6,000.</strong></p>
    <p><strong>Monotype Library, OpenType Edition</strong><br>
    This comprehensive collection of over 2,400 Monotype typefaces offers more than 150 recent releases like <a class="freelinking external" href="http://www.fonts.com/font/monotype/neo-sans " rel="nofollow"> Neo Sans</a>, <a class="freelinking external" href="http://www.fonts.com/font/monotype/soho " rel="nofollow"> Soho</a> and <a class="freelinking external" href="http://www.fonts.com/font/monotype/mentor " rel="nofollow"> Mentor</a> in addition to all of Monotype's historic classics such as the complete <a class="freelinking external" href="http://www.fonts.com/font/monotype/gill-sans " rel="nofollow"> Gill Sans</a>, <a class="freelinking external" href="http://www.fonts.com/font/monotype/dante " rel="nofollow"> Dante</a> and <a class="freelinking external" href="http://www.fonts.com/font/monotype/bembo " rel="nofollow"> Bembo</a> families. <strong>Valued at about $3500.</strong></p>
