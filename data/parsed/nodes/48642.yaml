    <p>I am currently setting some copy for an exhibit display and had a question regarding the use of italic in quotes. </p>
    <p>Here is my example:</p>
    <p>The individual bits of material used to create a mosaic are called “tesserae.” Artist Emile Norman incorporated the following materials as tesserae in his endomosaic mural.</p>
    <p>I am setting all the copy in a regular weight, except for the word ’tesserae,’ which will be set in an italic weight. It will only be in italic once, and not when it appears again in the second sentence.<br>
    My question is: Do I set the quote marks and the period after the word in regular or italic? Or is just the word itself set in italic? </p>
    <p>Sorry if this is a bit basic, but just wanted to make sure I got it right.</p>
    <p>thanks!</p>
