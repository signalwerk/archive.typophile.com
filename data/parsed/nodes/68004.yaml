    <p>Hi.<br>
    I have this small problem in font production.<br>
    I have normal and stencil version of the font.<br>
    They share the same metrics and kerning.</p>
    <p>in indesign they are nicely over each other.<br>
    But problem is, when I print it to pdf from indesign, the fonts doesnt have the same position.<br>
    Please look at attachment.</p>
    <p>I already set alighnment zones and basic hinting (standard stems) but it didnt help.</p>
    <p>Thanks a lot for suggestions!</p>
    <p>Jan</p>
