    html: |-
      <p>what font are you using?</p>
      <p>you mean export to PDF from InDesign..<br>
      you have to make sure you include the fonts when exporting, because if you don't then InDesign creates a substitute.</p>
      <p>WORKAROUND<br>
      make a copy of your InDesign-document so that you still have your text editable and the font is still a font.<br>
      in your 2nd copy-document you select your text and choose "create outlines" from the menu.<br>
      This makes your text into an "object" and you cannot edit the text.<br>
      Then you export and everything will look okay and as you want it in the PDF.</p>
