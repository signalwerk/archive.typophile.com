    <p><strong><a href="http://www.veer.com/download/pdf/kewlscript.pdf">A Kewl Story</a></strong> was produced to illustrate the use of <strong><a href="http://sudtipos.com/fonts/112">Kewl Script font</a></strong>, one of the 2 new Sudtipos releases. All illustrations were specially done by the argentinian artist Catnez . Grab it!</p>
    <p><img src="/sites/default/files/old-images/kewl1_5955.jpg"></p>
    <p>Kewl Script is the result of being caught in the afterimage of one design project while conceptualizing another one. Just before finishing the final tests on Mrs Blackfort, the first of what became a long series of Charles Bluemlein fonts, some of the letters began morphing differently in my mind. The idea was to go on the heavier and more playful side, but with a South American sign letterer’s twist, rather than just good handwriting. I did some sketching, took some notes, then got busy with other projects. Some of that stuff eventually seeped into Candy Script and, to a lesser extent, the Whomp font. But it was only a matter of time before I got back to the original concept and finished it. Kewl Script is ideal for food packaging, book and music covers, magazines, and window splashes.</p>
    <p>///////////////////////////////////////////////////////////////////////////<br>
    A sweet release - Sugar Pie<br>
    ///////////////////////////////////////////////////////////////////////////</p>
    <p><img src="/sites/default/files/old-images/sugar2_3759.jpg"></p>
    <p>I called it <strong><a href="http://sudtipos.com/fonts/111">Sugar Pie</a></strong> because it has a sweet taste, quite similar to Candy Script, mostly because of its round-to-sharp terminal concept. This in turn echoes the concept of the clean brush scripts found in the different film type processes of late 1960s and early 1970s.</p>
    <p>While Candy Script’s main visual appeal counts on the loops, swashes, and stroke extensions working within a concept of casual form variation, Sugar Pie is artistically a straight forward packaging typeface. Its many ligatures and alternates are just as visually effective as Candy Script’s, but in a subtler and less pronounced fashion. The alternates and ligatures features of Sugar Pie contain quite a few nice variations on the main character set. Use them to achieve the right degree of softness you desire for your design.</p>
    <p>The <strong><a href="http://www.veer.com/download/pdf/sugarpie.pdf">Sugar Pie PDF</a></strong> specimen illustrates some possible uses of the font.</p>
    <p><img src="/sites/default/files/old-images/specimens_6332.jpg"></p>
