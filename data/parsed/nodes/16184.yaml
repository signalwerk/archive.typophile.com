      <p>Be careful, Berthold (now in US. This company is quite different from the original Berthold foundry in Germany) is said to be famous for sueing people who (they feel) copy their typeface designs or typeface names.</p>
      <p>Manfred Klein: Type &amp; Typographers (London: Architectural Design &amp; Technology Press 1991) has an article about Akzidenz Grotesk. There is a small reproduction of a 1899 specimen.</p>
      <p>In 'Typografische Monatsblaetter 2 2003' there are some interesting remarks about Akzidenz Grotesk, but unfortaunately only in German. And there are no reproductions of original specimen in it.</p>
      <p>According to Guenter Gerhard Lange (artistic director at Berthold - in Germany - from the mid-1960ies until it closed down) in Typografische Monatsblaetter, Berthold bought different smaller typefoundries, amongst it Ferdinand Theinhardt's foundry. Akzidenz Grotesk is a family of heterogenous typefaces of different origins. The basic set of Akzidenz Grotesk was cut by Ferdinand Theinhardt. Its original name was Royal Grotesk. </p>
      <p>In St Bride, London, there is a type specimen by Ferdinand Theinhardt's foundry from c. 1895 with a sans serif which looks like a (littlt bit clumsier) proto-version of Akzidenz-Grotesk, but this is not called Royal Grotesk but rather Breite Grotesque.</p>
      <p>If you find some other specimen, please let me know.</p>
