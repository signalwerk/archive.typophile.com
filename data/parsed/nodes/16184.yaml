    <p>I'm designing a simple grotesque based on Akzidenz. The problem is I don't know the original drawings - only the digital redesigns of Berthold Foundry.</p>
    <p>Anybody knows where I can find a type <strong>specimen of Hermann Berthold's 1898 original Akzidenz Grotesk design?</strong></p>
    <p>Cheers,<br>
    Pedro</p>
