      <p>Make is pleasant, lucid and unpretentious — without being dull. There’s already too much resumes that exhibit a lot of arrogance.</p>
      <p>The loaded words, clever sentences and cutesy, then, must be objected to the three qualities above.</p>
      <p>A good example would be Veer’s T-shirt text, “I draw pictures all day.” Flourish and swash? No. Brutally honest? Yes. Interesting? Definitely.</p>
