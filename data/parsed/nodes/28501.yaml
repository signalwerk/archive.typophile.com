      <p>I’m with Eric concerning the left-heavy-ness (not only is the main text-block way too far left, but the caption under your name-plate is also contributing to the pull leftward).</p>
      <p>Also, the whole thing feels a bit loose. There’s a lot of breeze flowing between your headings &amp; subheads, and between the subs and sub-subs, which is actually making the information clusters <em>less</em> easy to distinguish.</p>
      <p>Hopefully this won’t sound too harsh, but I suppose I’m wondering: if you’re a graphic designer, where’s the evidence in the design of the resumé? I’m not saying you should turn the thing into a full-colour, full-bleed poster, but while you’ve used a few distinctive fonts, the layout looks a bit like, well, an MSWord template, and the typography is riddled with bugs.</p>
      <p>For example: your work descriptions are sentences and sentences require periods. And, you’ve got small caps in your parenthetical dates, but not in the Awards listing (and track the small caps out a bit). And get rid of the italic on the parentheses, or at least kern in the right-parens. And change those hyphens in the dates to en-dashes. (To mention a few…)</p>
      <p>Also, I’d definitely get your contact info up top.</p>
