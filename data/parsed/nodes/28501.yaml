      <p>I usually pass on these threads.</p>
      <p>It has been a few years since I was reviewing CVs and hiring people. Before my type design life I was a publications design director in charge of too many magazines. Here are my thoughts…</p>
      <p>Drop the art work at the top. Its not very good lettering, and why start off with a less than fabulous impression. (I always threw away resumes that looked too designed).</p>
      <p>Flesh out your descriptions of your previous work experience. If you had a career spanning a few decades, it might make sense to sum it up briefly, but I would think the opposite is necessary in your case. </p>
      <p>Instead of the lettering, concentrate on the typographic details. Show in a subtle way that you have command of typographic organization and hierarchy. In CV 3 the heads are too large against the body type.</p>
      <p>Good luck,</p>
      <p>James</p>
