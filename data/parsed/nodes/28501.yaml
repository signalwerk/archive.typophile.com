      <p>You’ve had plenty of input here, which is great, and helpful, but also part of the problem. I would encourage you to delete the file(s) you’ve been working on and, without looking back, build a new version from the ground up (no re-using the stylesheets, etc.). What was good in the latest version will stick in your mind, and you may come up with solutions that are invisible while staring at the current attempt.</p>
      <p>And no input on the next (new) version. At the moment much of the work in the lastest version is not your own (it was suggested/directed). Scrap it and do it solo from scratch, so that when you hand it to a potential employer, you’ll know and feel good that what you’re handing them is yours.</p>
