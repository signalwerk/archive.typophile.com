    html: <p>To my mind, the attempt at doing something no one else has thought of is itself the form of naïve arrogance that ends up producing “clever.” I agree that some attempt must be made to be distinctive, but is needs to be grounded first and foremost in doing the thing (the resumé, whatever) <em>well,</em> rather than grasping for attention through setting “distinctive” as the goal. Don’t get me wrong, I agree with Datura, in that the thing that others haven’t thought of is simply doing the job well, but the drive to be different is too often viewed as the goal in itself. The phrase I use in class is “effective yet understated,” and I have to say it often because understatement seems to be a bad word.</p>
