    html: "<p>I used to be in management and my number one pet peeve was spelling errors on resumes. It gives a bad first impression (ex: “indpndent” under Thayer Academy unless that’s a funky title?) - plus if you do any production work, style of writing is as important as the typography. As a rule of thumb, when writing lists use the same tense, i.e. change “funding, faculty advisor, obtaining software, mission of class, curriculum” to something like “procuring funds, obtaining software, developing curriculum…”. I now work as in design and production and my most successful interviews were gleaned from targeted resumes. If I was targeting a corporation, I went more clean in my layout. If it was an interactive firm, I kept it brief on written and sent links to my url. Be sure to show your strengths - and you’ll get the call.</p>"
    html_clean: "<p>I used to be in management and my number one pet peeve was spelling errors on resumes. It gives a bad first impression (ex: “indpndent” under Thayer Academy unless that’s a funky title?) - plus if you do any production work, style of writing is as important as the typography. As a rule of thumb, when writing lists use the same tense, i.e. change “funding, faculty advisor, obtaining software, mission of class, curriculum” to something like “procuring funds, obtaining software, developing curriculum…”. I now work as in design and production and my most successful interviews were gleaned from targeted resumes. If I was targeting a corporation, I went more clean in my layout. If it was an interactive firm, I kept it brief on written and sent links to my url. Be sure to show your strengths - and you’ll get the call.</p>"
