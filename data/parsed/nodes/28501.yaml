      <p>Without discussing content, I think you should re-think how the resume looks. It is typically the first piece an employer sees of your work. It’s purpose is to interest the employer into wanting to see your portfolio (electronic or printed). To that end, this is your first chance to showcase your design skills. It should be as “design-y” as your website or your business card. </p>
      <p>Remember, any employer you send this resume to already has an active interest in graphic design and/or typography.</p>
