    <p>Hello:</p>
    <p>I am looking to get some help with identifying the typeface in the attached image. The image is a screen grab from Jean-Pierre Melville’s <em>Un Flic</em> and appears around the 17 minute mark (if anyone is interested in seeing the sign in context).</p>
    <p>My gut tells me that the sign is hand drawn and that there isn’t a typeface of such design. I’ll be happy with getting something similar as a foundation for basing my own hand drawn version on.</p>
    <p>Thanks in advance!</p>
    <p>- jacob</p>
