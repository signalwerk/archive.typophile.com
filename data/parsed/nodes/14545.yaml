    <p>Teardrop shaped terminal of a letter. </p>
    <p>Lachrymal Terminals taper into the stroke, as opposed to <a href="/wiki/Ball%20Terminal" class="freelinking" rel="nofollow">Ball Terminal</a>s, which join the stroke at an angle.</p>
