    <p>If anyone can help me figure out what font this is, that would be great. It really looks like Futura, but the M's verticals aren't slanted. This comic book was done by Chip Kidd - is there a certain typeface he uses?</p>
    <p>Here is a link to other covers so you can see it a bit larger: <a href="http://www.mycomicshop.com/search?TID=581861" title="http://www.mycomicshop.com/search?TID=581861">http://www.mycomicshop.com/search?TID=581861</a></p>
