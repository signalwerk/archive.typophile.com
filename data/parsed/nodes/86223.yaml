    <p>I'm sure these are all custom, but I'm currently working on a luxury project and I would love to know more about these marks. Who designed them? What typefaces are similar? What are they based on? Any information would be appreciated.</p>
    <p>Zara (2010)<br>
    <img src="http://www.klif.pl/files/galerie%20zdjec/wydarzenia_promocje/GDYNIA/ATRAKCJE_W_KLIFIE/zara-new-2010.jpg"></p>
    <p>While I'm at it, here are a few other luxury logos that caught my eye.</p>
    <p>Balmain<br>
    <img src="http://luxuryactivist.com/wp-content/uploads/balmain-logo.jpg" width="400px"></p>
    <p>Lanvin<br>
