      <p>Its stylistic suitability needs to be considered, but in terms of readability, it's rock solid. You do also have to worry about it having all the "parts" though - like the right kind(s) of numerals, smallcaps that work for you, and other things your text might need. But if you get the Adobe version you can always get me to make any mods you end up needing.  :-&gt;</p>
      <p>Concerning piracy, I'm actually a pragmatist, and a big believer in Good Intentions. I hope you know what I'm getting at without me having to spell it out... The good news is increasingly there are ways of trying out fonts without taking out a second mortgage, like SkyFonts.com - and they happen to have Mendoza!</p>
      <p>hhp</p>
