      <p>Related to that last question, if anyone knows of any books set in Mendoza that I could look at, I'd appreciate it --</p>
      <p>Hrant -- I've read your many comments about pirating, and though I'm not in your business I can understand your cause and support it --</p>
      <p>On the consumer end, and being a novice consumer at that, I must say that it's a challenge to figure out a lot about these fonts before I buy them (maybe I just don't know how to research well enough) -- the little bit that one can see in the window of fontshop or myfonts or whatever is just not enough for someone like me to know what a font is really going to look like -- In the last few months, I've spent quite a lot of money on fonts that ultimately I don't have a ton of use of for -- in large part, this is because there is no way for a basic person like me to know what different fonts look like set in a page of text, or whatnot -- I looove that fontsinuse website -- if there were a similar sort of site that gave examples of different fonts in use in books, it would be of huge use to us end users. </p>
      <p>Thanks again to all of you on this site -- I've learned a lot from it, and it's been amazingly helpful.</p>
