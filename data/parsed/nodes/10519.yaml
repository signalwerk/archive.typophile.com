    html: "<p>&gt;Although it is commonly said that these scripts are RTL, they are actually bi-directional. <br> <br>well, they become bidirectional when used with digits or LTR languages. its a royal pain. most programs make a giant mess of any multilingual text. 'Word' excels in that area greatly - it makes hell for my mom to write her work in Word, because some of the terms are in english and this screws up whole phrases.  <br> <br>&gt; Not a very satisfactory way to work: a kind of anti-design process in which all decisions are determined by the need to avoid similarities to existing designs.  <br> <br>i feel the same about my current work. im very touchy about it. i think hebrew in its current status gives less freedom in design then, for example, english. [thats just my hunch.] and for that im trying extra hard to squeeze original shapes from my hands. its too easy to make narkis-based fonts. so many movements and ideas sprouted on narkis' ground, and i feel its getting a negative side in the last few years. <br> <br>you've done a very good job with Helvetica Hebrew. the buttom of the nun is extraordinary. the shin and ayin are equally genuine. i didnt know you did that font. good to know :-) <br>and arial, by the way, isnt so good in the hebrew version.  <br> <br> <br>claudio: Zvika Rosenberg, the principal of masterfont, designed the font Rosenberg.  <br>hahah, i just heard from a friend he's selling a font to masterfont.. this is great. <br>say, 25% profit and losing the ability to sell the specimen for 10 years, is that considered a good deal to sign with a vendor? <br> <br>claudio, ive learnt so much from the net. allmost everything i knows come from it. and not only about typography. its just an amazing thing.  <br>what can i say.. if i'll be in the army, there wont be alot of time for fun.  <br> <br>israel isnt a good place to learn design too, if you ask me. many times im dissapointed from the works of academy graduates here. i looking forward to gather enough money experiance and courge to learn in europe.  <br> <br>masterfont never show good examples of their fonts, but you can check out single words set in narkis in their catalogue.  <br> <br>ah, and - <br>do you have Yontef's email, maybe? <br></p>"
