    html: <p>ha. bouma is a great word. i dont know how i managed to talk about type before i used it <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>claudio - i think Ezra &amp; his partner Michal Sahar are two very promising designers today. two of the most promising designers in Israel, perheps. <br>but i really dont understand the picking of TDC.  <br>are you guys familiar with the works of Yosef Iontef? he's really revolutionizing type here.  <br> <br>the real mystery is how Rosenberg has got his type all over the country, and good typefaces arent used. rosenberg only has his type used because he owns masterfont. his work is awfull.. the font he named after his last name is one of the worst hebrew fonts ever published, yet it is used constantly on everything i look at. in my humble opinion this is a severe case of monopoly.  <br>oh well, maybe i should stop before i break into tears.. <br> <br> <br>here are some examples using alernative mem's and alef's. i personally feel that making the alef asymmetrical gives it an old-fashioned look. it also means problems in the bold version. anyway, experimanting has never hurt me.  <br> <br><img src="http://www.typophile.com/forums/messages/29/7085.gif" alt=""></p>
