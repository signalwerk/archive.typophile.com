    html: "<p><i>(Narkis is more or less the equivalent of helvetica.)</i> <br> <br>A fact that caused me considerable difficulty when I was designing Helvetica Linotype Hebrew last year. It was tricky trying to make my design not look too much like Narkiss Tam, especially if I also wanted to avoid it looking like Arial Hebrew. Not a very satisfactory way to work: a kind of anti-design process in which all decisions are determined by the need to avoid similarities to existing designs. Given the constraints, I'm relatively pleased with the results. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/7105.gif\" alt=\"Helvetica Linotype Hebrew \"></p>"
    html_clean: "<p><i>(Narkis is more or less the equivalent of helvetica.)</i> <br> <br>A fact that caused me considerable difficulty when I was designing Helvetica Linotype Hebrew last year. It was tricky trying to make my design not look too much like Narkiss Tam, especially if I also wanted to avoid it looking like Arial Hebrew. Not a very satisfactory way to work: a kind of anti-design process in which all decisions are determined by the need to avoid similarities to existing designs. Given the constraints, I'm relatively pleased with the results. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/7105.gif\" alt=\"Helvetica Linotype Hebrew \"></p>"
  - id: 66291
    user: 1316
    date: 2003-03-02T10:36:00
    date_raw: 2 Mar 2003 — 10:36am
    votes: null
    html: "<p>Itay wrote: <br>\"heh, claudio, im not studying anywhere. im an auto-didact.. i learn from friends and books when i find some   <br>may i ask where did you start to learn design?  <br>im planning to get some proper education soon, if things go as i plan.\" <br> <br>I never started to learn graphic/type design. In fact I feel like I'm always \"starting\". I'm 33 by the way. <br>When I took my diploma in Telecommunications I was sure I would have left that behind. And so it's been. Being in Italy in the late 1980s meant \"no education in design available\". The thing has changed slightly, but Italy is a stagnant place for higher education when it cames to graphic design and type. <br> <br>My slow work of compromise has been to work part time in contigue fields (learning \"on the battlefield\", if we could say so) and cutting out a space for me to learn by myself. <br> <br>I don't know if this could work in Israel,  but since you're 17 and since now we have the web I wouldn't worry too  much. When the need arises find a job for a living but keep the necessary space to learn what's really important. <br> <br>John: that Helvetica Hebrew LT looks so darn good you could never tell it's an Helvetica, except for tiny details of Helvetica's monotony preserved you've chunked out a warm and beautiful face. A pity us latin-based guys have Helvetica always looming over us. <br>At least Arial is more friendly. <br> <br>Now I'm really curious to see Narkis! <br> <br>Hrant or Itay: who is Mr. Zwika? The principal of Masterfont, the designer of that typeface, Rosemberg? <br> <br>I hope to find a bit of time to write Yanek Yontef. Oded has praised him so much and I want to buy Yanek's Erica Sans. <br>But now I have to see that \"Masterfont\" vendor website. Speaking of the web: it's so precious but also so dissipating...</p>"
