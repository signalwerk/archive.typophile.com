    html: "<p><i>John: can you tell me why in occidental packaging (I do pack design, you know), the weight of the product, when expressed in arabic, uses the numerals in reverse order?</i> <br> <br>Numbers have pretty much always been written left-to-right in Arabic and Hebrew (I'm guessing that there might be some very ancient examples of RTL numbers, but I've never seen any). Although it is commonly said that these scripts are RTL, they are actually <a href=\"http://www.unicode.org/reports/tr9/\">bi-directional</a>.</p>"
    html_clean: "<p><i>John: can you tell me why in occidental packaging (I do pack design, you know), the weight of the product, when expressed in arabic, uses the numerals in reverse order?</i> <br> <br>Numbers have pretty much always been written left-to-right in Arabic and Hebrew (I'm guessing that there might be some very ancient examples of RTL numbers, but I've never seen any). Although it is commonly said that these scripts are RTL, they are actually <a href=\"http://www.unicode.org/reports/tr9/\" class=\"link-external\">bi-directional</a>.</p>"
