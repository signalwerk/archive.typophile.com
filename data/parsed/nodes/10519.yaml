    html: "<p>Good differentiation between gimel and nun; often quite difficult at small sizes. <br> <br>I would consider making kaf and resh one pixel wider, but perhaps this is because I'm used to the proportions of older types and manuscript styles (I've noticed that these letters are getting narrower in Israeli types). <br> <br>Mem seems a little pinched, and is probably the least well defined shape. This is traditionally one of the wider letters, so perhaps you could make it one pixel wider, and then lengthen the foot on the right? This is just a suggestion: it might easily end up looking too wide. You could also experiment with deepening the cut on the top. <br> <br>Is there any way to make the alef less symetrical?</p>"
