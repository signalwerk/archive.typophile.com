  html: <p>this I made half a year. i've made the final touchs today. <br>this is a strange hebrew bitmap font. the design is based on some sort of schematic geometric boumas i sketched once. i liked the contrast between the roundness of the pey,tet &amp; samech and the sharpness of the bet and het, it gives it a very akward character. <br>so far, i also added nikud (punchuation marks) for allmost of the letters.. and some currency signs. <br> <br><img src="http://www.typophile.com/forums/messages/29/7061.gif" alt="asa text example"> <br> <br>all critique welcome.</p>
