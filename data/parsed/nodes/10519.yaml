    html: <p>Speaking as a someone who has judged the TDC event, I think the 'judge's choice' selections do not necessarily represent what the individual judge thinks is the <i>best</i> overall entry in the competition. Rather, they tend to be some work with which the judge feels a particular affinity, or which otherwise strikes the judge personally. The year I judged the competition, I selected Vladimir Yefimov's Kis Cyrillic as my judge's choice. It is a very good design, but probably wouldn't have been my choice if my task had been to select the very best overall design in the competition; indeed, selecting an overall winner would have been very, very difficult. Rather, Vladimir's design struck me as an interesting and important project to which I wanted to draw additional attention and about which I appreciated the opportunity to say something extra in the TDC annual. Interestingly, the same year, Barry Deck and Kathleen Tinkel both used their judge's choice to make critical comments about designs. I don't know what Robert Bringhurst's reasons for selecting Maya were -- and I can't remember what he wrote about the design in that year's annual -- but the selection doesn't necessarily mean that he thought Maya was the best piece in the competition.</p>
