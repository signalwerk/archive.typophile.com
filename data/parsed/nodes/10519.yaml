    html: "<p>Itay, Yanek Yontef (that's the correct name I think) has been the type design teacher of Oded at the at the Bezalel Academy in Jerusalem. Maybe this explains all. I know too little about Yontef to appreciate his work in full.  <br>His Erica Sans is an *incredibly beautiful* hebrew version of Gill Sans and I'm intentioned to mail him and buy it.  <br>On the picking of Maya: well I'm surely not enough familiar enough with Hebrew letters to judge it properly. I tend to prefer other faces from Oded, but Maya seems good. Maybe Bringhurst (sorry I called him Gary!) picking Maya has the same problem of many of us latin-based guys. He's not a \"prophet\", even if his \"Elements\" has become a \"Bible\" for the old as well as the new \"Elite\". (this is a personal joke). But Oded submitted Maya only I think, so...  <br>BTW: Hey, that Narkis Mem is beautiful! Where do you find Narkis?  <br>  <br>On your Asa: Reverse also the question mark: we must challenge conventions if we wish to make more sense: if it's right-to-left, it's right-to-left. I agree with John on the Aleph. The Mem, well, I would like more one of the softer versions, since it becomes too uniform if you \"square it\" all along. Maybe it's just my taste, but I like variability in forms which are supposed to be similar. This helps the reader, too. <br>  <br>John: can you tell me why in occidental packaging (I do pack design, you know), the weight of the product, when expressed in arabic, uses the numerals in reverse order?  <br>(left-to-right)?  <br>Also, where I work in the mornings, I've recently typeset a series of cereal boxes in 16 languages and the translator provided us tiff images for Arabic, Hebrew, Japanese and Chinese. The energetic values in Arabic are written in Times, instead of using real arabic figures. I wondered why.</p>"
    html_clean: "<p>Itay, Yanek Yontef (that's the correct name I think) has been the type design teacher of Oded at the at the Bezalel Academy in Jerusalem. Maybe this explains all. I know too little about Yontef to appreciate his work in full.  <br>His Erica Sans is an *incredibly beautiful* hebrew version of Gill Sans and I'm intentioned to mail him and buy it.  <br>On the picking of Maya: well I'm surely not enough familiar enough with Hebrew letters to judge it properly. I tend to prefer other faces from Oded, but Maya seems good. Maybe Bringhurst (sorry I called him Gary!) picking Maya has the same problem of many of us latin-based guys. He's not a \"prophet\", even if his \"Elements\" has become a \"Bible\" for the old as well as the new \"Elite\". (this is a personal joke). But Oded submitted Maya only I think, so...  <br>BTW: Hey, that Narkis Mem is beautiful! Where do you find Narkis?  <br>  <br>On your Asa: Reverse also the question mark: we must challenge conventions if we wish to make more sense: if it's right-to-left, it's right-to-left. I agree with John on the Aleph. The Mem, well, I would like more one of the softer versions, since it becomes too uniform if you \"square it\" all along. Maybe it's just my taste, but I like variability in forms which are supposed to be similar. This helps the reader, too. <br>  <br>John: can you tell me why in occidental packaging (I do pack design, you know), the weight of the product, when expressed in arabic, uses the numerals in reverse order?  <br>(left-to-right)?  <br>Also, where I work in the mornings, I've recently typeset a series of cereal boxes in 16 languages and the translator provided us tiff images for Arabic, Hebrew, Japanese and Chinese. The energetic values in Arabic are written in Times, instead of using real arabic figures. I wondered why.</p>"
