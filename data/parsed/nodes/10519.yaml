    html: <p>heh, claudio, im not studying anywhere. im an auto-didact.. i learn from friends and books when i find some <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br>may i ask where did you start to learn design? <br>im planning to get some proper education soon, if things go as i plan.  <br> <br>I heard Yontef teachs in the Bezalel Academy in Jerusalem. I've been wondering how the man looks or talks, becuase unlike some of the other big names in the industry, i have never seen that dude. He is really a savior to hebrew type. I bet you my education he'll be written about in design books of the next decade.. <br>ah Rosenberg, he runs Masterfont. thats the biggest font vendor around. Masterfont owns all the great hebrew type, like Hadasa or Koren. In Masterfont Narkis has published his fonts. (Narkis is more or less the equivalent of helvetica.) <br> <br>you can see the font Rosenberg all over the Masterfont website, especially in titles. if you ask me, that font is disasterous. its a sign for the upcoming apocalypse. if i had a time machine i'd prevent rosenberg to make it. <br>there are plenty of things wrong with the masterfont foundry and mr.rosenberg and his infamous type, but this aint a gossip column, right? <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br><a href="http://www.masterfont.co.il/html/catalog1.asp" target="_blank">http://www.masterfont.co.il/html/catalog1.asp</a> <br></p>
