    html: "<p>Looking at the top line, I like the third alef (from the right, of course) best, and I really like the last mem although the top is a little unusual (more what I would expect for tav). I definitely think the mems with a strong angle on the lwer right are better than the ones with a pixel dropped. The second and third mems are also good. <br> <br>I'm always surprised when I see the Latin question mark in Hebrew text. When I'm following the text from right to left, I always expect to see it reversed: too much time looking at Arabic I guess.</p>"
