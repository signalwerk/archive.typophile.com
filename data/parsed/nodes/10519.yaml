    html: <p>&gt; hebrew in its current status gives less freedom in design <br> <br>Could you elaborate on this? <br> <br>&gt; is it because the type directors want to encourge the growth of these languages? <br> <br>Well, Smeijers essentially said (in the TDC annual) that he chose the Armenian becuase it was exotic (so not because it was a very good font). That's annoying in a type competition, but at least he's honest. I'm not sure why Bringhurst chose Maya - especially since he's such a fan of chirographic (hand-"painted") type - plus Hebrew doesn't really seem highly "exotic". <br> <br>Anyway, the good side is that minority scripts get exposure. But I wonder, was it like the misguided personal pleasure when giving a blanket to a homeless person? Did they perhaps do it to feel better about themselves, to offset (but in no real measure at all) the abuse dished out at "exotics" by western culture? <br> <br>hhp <br></p>
