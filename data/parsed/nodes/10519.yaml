    html: <p>Itay, I myself have a problem with some of Zvika's approach, but he's a nice guy (I met him in Rome) with a lot of experience.  Talk to him - see if you can get insight from each other. For one thing, type design relies heavily on the <i>customer</i> for many people, and you can't sell people things they don't want. On the other hand, I'm not the biggest fan of Maya... I think Bringhurst chose it for the same reason that Smeijers chose an Armenian a few years ago - but at least Smeijers admitted it (in print). <br> <br>&gt; written in Times, instead of using real arabic figures. <br> <br>If I remember correctly, some -but few- Arabic countries do use Latin numerals as the standard, but overall that's not a good idea. On the other hand, most Arabs can read Latin numerals (and some Persians might have a problem with the Arabic ones), so it's not a huge problem, I guess... But I think you should change them to Arabics. <br> <br>hhp <br></p>
