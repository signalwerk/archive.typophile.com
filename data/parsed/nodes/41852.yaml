  html: |-
    <p>Hello,</p>
    <p>what would be the typical ranges for (vertical) stroke width (expressed in fraction of the x-height) for thin, regular, demibold, bold etc.?</p>
    <p>(inversely you could state the x-heights expressed in vertical stroke widths)</p>
    <p>Primarily of interest is serif fonts.</p>
    <p>The reason for asking is, that some sketches I did (and intended as regular) look somewhat boldish-semiboldish, and I'm a bit uncertain.</p>
    <p>Thanks, guys!</p>
