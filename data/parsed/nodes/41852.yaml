    html: "<p>Sorry, you slightly misunderstood me. Varying stroke with is a clear concept. However, vertical strokes tend to be pretty much the same width within one font. I was asking for typical proportion ranges for the vertical stem : x-height, if anyone would have had at the top of their head. It'd be so much easier than checking with a font editor 30-100 different fonts... :-)</p>"
