    html: <p>Strokes don’t have typical proportions, varying proportions is an important source of personality, especially when it comes to serifs. What you need to do is identify the sort of values you want in existing typefaces, open them up in Fontlab, figure out what the proportions are, and compare your design to those numbers.</p>
