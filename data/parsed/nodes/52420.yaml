    <p>You know those distorted abominations of letterforms you have to decipher when you register for sites? I’m surprised I couldn’t find much interest for them within the typographic community. Has anyone entertained the thought of creating the CAPTCHA puzzle with found letterforms? I think it would be quite beautiful. A tag search for “oneletter” on flickr will reveal the amount of variety that could be used to fool the bots and still make it easy on the eye. I don’t know much about the technical capabilities, but my guess is that with enough creativity in photography by a dedicated public, we can defeat technology. Then again, I should never underestimate those like Google.</p>
