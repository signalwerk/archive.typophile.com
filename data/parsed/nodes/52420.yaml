      <p>I gave a talk at TypeCon 2007 about the work that I was involved in where we investigated how to make CAPTCHAs as easy to read as possible for humans and as difficult to read as possible for computer programs. It’s a difficult challenge because the computer programs can be right less than 5% of the time to make money for the spammers, while we want people to able to recognize them close to 100% of the time. We’ve written a few papers about our work:</p>
      <p><a href="http://research.microsoft.com/~kumarc/pubs/chellapilla_chi05.pdf" title="http://research.microsoft.com/~kumarc/pubs/chellapilla_chi05.pdf">http://research.microsoft.com/~kumarc/pubs/chellapilla_chi05.pdf</a><br>
      <a href="http://research.microsoft.com/~kumarc/pubs/chellapilla_hip05.pdf" title="http://research.microsoft.com/~kumarc/pubs/chellapilla_hip05.pdf">http://research.microsoft.com/~kumarc/pubs/chellapilla_hip05.pdf</a><br>
      <a href="http://research.microsoft.com/~kumarc/pubs/chellapilla_ceas05.pdf" title="http://research.microsoft.com/~kumarc/pubs/chellapilla_ceas05.pdf">http://research.microsoft.com/~kumarc/pubs/chellapilla_ceas05.pdf</a></p>
      <p>Cheers, Kevin</p>
