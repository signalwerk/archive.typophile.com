    <p>Hi!</p>
    <p>As a newcomer to Typophile I am not sure whether there already is a relevant thread. I am finishing, for the first time, a font withtwo scripts, Latin and Cyrillic. I cannot find how to add the Cyrillic script so that it would show in the OpenType Preview panel – so that I could choose a script.</p>
    <p>I am including a picture of how Adobe Minion shows the scripts; that´s what I´d like to get!</p>
    <p>With best wishe, Saku.</p>
