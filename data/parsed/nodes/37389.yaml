      <p>Dear Alan!</p>
      <p>Regarding » Grotesk « as German native speaker (as you may note my English skills are worst) I have a few additional remarks. </p>
      <p>In german we have (had) three modes to name a »Sans Serif«:</p>
      <p>Grotesk<br>
      Sans Serif<br>
      serifenlose (= Sans Serif) (Linear-) Antiqua </p>
      <p>The semantic origin of the term » Grotesk « is the French language of the 17th century. The term (grotesque) first was used in visual arts to express an unnatural combination of parts of humans, animals and plants. This term etymologically was borrowed from the Italian  » grottesco « = » part of a cave «, meaning antique cave paintings, antique cuneiform writing etc.</p>
      <p>In 1832 the London typesetter and type founder Vincent Figgins (1766–1844) created a typeface (only uppercase) called » Two-line Great Primer Sans-serif «. He was the first using the term » Sans Serif «. In the same year William Thorowgood published a typeface (uppercase and lowercase) which became known as » grotesque «.</p>
      <p>Arround 1880 the German Typesetter Ferdinand Theinhard created a four weights typeface called » Royal Grotesk « for publications of the » Königlich-Preußischen Akademie der Wissenschaften zu Berlin « (Royal Prussian Academy of Science Berlin). This was the moment when the » Grotesk « became popular in Germany. 1908 Herman Berthold took over the Theinhard Foundry and continued to sell the » Royal Grotesk « till the end of the monarchy in 1918. After that Berthold sold the » Royal Grotesk « as » Akzidenz Grotesk «.</p>
      <p>Vertex</p>
