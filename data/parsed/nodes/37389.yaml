    <p>Dear all</p>
    <p>Akzidenz Grotesk........ I am in the process of collecting a body of research relating to this pivotal sanserif,<br>
    I have used the info from a recent help request, so thanks to all who donated.</p>
    <p>I am still slightly confused over the name, the question I raise is,<br>
    1. Does Grotesk, in German mean sanserif, or just simply grotesque (Eng.), if so, this can be taken  to imply misshapen, malformed ugly etc. Its seem pretty regular to me and not at all ugly ?<br>
    An earlier thread I  had read ( in part ) seemed to indicate a meaning for Akzidentz which would convey a chance discovery.</p>
    <p>Any ideas or thoughts  will be greatly received.</p>
    <p>Alan</p>
