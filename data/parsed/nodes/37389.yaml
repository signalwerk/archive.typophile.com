      <p>Many, many thanks</p>
      <p>Sorry I haven’t replied sooner, work does tend to get in the way, annoyingly-!!<br>
      Endre, Interestingly I think I would go for Bertholds as well, but I have to ask myself why ?<br>
      Aesthetically you could argue the differences are minimal between several early Grotesks, so my choice is most likely based on<br>
      the originality of Bertholds AG, that said my research has revealed other foundries which also produced early SanSerifs could have also figured in the creation of this seminal face so one could argue (originality, whats that ?).<br>
      Its strange also that one of the names mentioned several times in various pieces of research is Vincent Figgins, he is credited with amongst others, Giza, an Egyptian style face (similar to Rockwell). I say strange because my family come from a part of London not far away from where he had his foundry and our names are similar.</p>
      <p>re the “Grotesk” meaning  I think Jan has hit the nail, so to speak ! I wonder if the idea was, this new face was so “modern” Berthold jokingly played along ?<br>
      A friend of mine who is taking typography degree intimated similar</p>
      <p>Many thanks to all who have contributed</p>
      <p>Alan</p>
