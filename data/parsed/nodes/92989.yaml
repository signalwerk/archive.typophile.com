  html: |-
    <p>In conjunction with the exhibition <a class="freelinking external" href="http://www.dexigner.com/news/24764" rel="nofollow">Graphic Design: Now in Production</a> at the Cooper-Hewitt National Design Museum in New York City, Ellen Lupton of the National Design Museum and Cara DiEdwardo of the Cooper Union will moderate a panel of type designers discussing the problems they have tackled. </p>
    <p>I am pleased that my font Williams Caslon Text is one of those in the exhibition, and I will be one of the panel discussing <a class="freelinking external" href="http://coopertype.org/curriculum/lectures/wicked-problems-in-type-design" rel="nofollow">Wicked Problems in Type Design</a> on June 18 at the the Rose Auditorium of Cooper Union. The others speaking will be: Philippe Apeloig, Hubert Jocham, Henrik Kubel, Jeremy Mickel, and Jesse Ragan.</p>
    <p>I'm really excited about the event, which I think is guaranteed fun for type fanatics.</p>
