    <p>Hi</p>
    <p>Anyone know what Design Assembly italic body copy font is on their site?</p>
    <p><a href="http://www.designassembly.org/" title="http://www.designassembly.org/">http://www.designassembly.org/</a></p>
    <p>For an extra two points can anyone explain how this is appearing as html text. I’m obviously a bit behind here. But I thought websites could only be set in the six or seven system fonts: Arial, Times, Verdana etc.</p>
    <p>Would appreciate it if anyone could clear this up.</p>
    <p>Marc</p>
