      <p>CSS was used to format this text. Here’s the line, copied from the source code of the discussed web page:</p>
      <p>font-family:Georgia, Times New Roman, serif;</p>
      <p>So your browser should select Georgia if you have it. If not, Times, etc.</p>
      <p>By the way, I don’t know of a way to check which font files your browser actually picked to generate the text. I think the only way is to judge by eye.</p>
      <p>Jurriaan</p>
