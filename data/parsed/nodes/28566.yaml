      <p>&gt; real 1200dpi monochrome output for under 500USD</p>
      <p>I recently went looking for exactly that, and found an HP for under $200! It's called the LaserJet 1022. They also have a two-sided-printing version for $400. But people say HP's PS emulation is not so good (although it sounds like outputting your fonts with hinting disabled overcomes the problem).</p>
      <p>One word of caution though, and the reason I haven't bought anything yet:<br>
      in the end 1200dpi is simply not good enough - you really need 2400dpi.<br>
      Ergo: Xante. Expensive.</p>
      <p>hhp</p>
