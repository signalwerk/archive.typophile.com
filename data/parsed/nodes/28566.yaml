      <p>There were praises for HP LaserJet 5000 in some old threads. My former job had it and I remember it had very sharp and clean output. I wonder if the 4000 is as reliable? It has smaller sheet size atleast but that's fine with me.</p>
      <p>I am on Mac and looking for real 1200dpi monochrome output for under 500USD. Speed doesn't matter. I am sceptical about brand new machines, but also afraid of coming across some compatibility issues with pre-USB/OSX-printers...</p>
      <p>I used to have some Minolta-Qms that had dirty output and I don't even know what the real resolution was. The manufacturers don't want us to know such things. </p>
      <p>No Linotronic for me either, this time atleast.</p>
      <p>Perhaps I should have posted on general discussion...</p>
