      <p>Hi,</p>
      <p>Had just the same question. I use a 600dpi printer which has a 1200dpi optimization, but I think this is just a printer specific 'hinting' thats going on inside the print engine. If I print 10pt size text, with normal paper, I can see the printer 'roping' and 'pixelating' things up. </p>
      <p>I was wondering if by using special paper / sheet material, proofreading could be enhanced. </p>
      <p>e-Baying a Linotronic is probably a step too far in my case...</p>
      <p>Sebastian</p>
