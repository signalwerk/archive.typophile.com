    html: |-
      <p>Depends on what you are "proofing" for. If it is for the color the type will have when printed offset, I don't know of any. Our old HP 8100 comes much closer than our newer Xerox 5500 (the 5500 is way too dark). But even the old HP is too dark; I use it to print out patch corrections when a publisher is preparing a new edition by shooting tearsheets. It is a pretty good match for this, which means the type  it prints is far too heavy to evaluate as type would appear when printed with direct-to-plate offset printing.</p>
      <p>On the other hand, if you are proofing for character fit, I guess the highest true resolution you can find would be best. I've given up on  laser printres for fine-tuning character fit (for fonts for offset printing).</p>
    html_clean: |-
