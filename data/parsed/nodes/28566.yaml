    html: |-
      <p>I've done really well with my cheap Konica-Minolta. HP laser printers are pretty much always classic, although I've never used the sub-$500 models. Xante printers have the best output I've ever seen, but lately they can't manage to keep up with the demand for toner.</p>
      <p>Paper makes a huge difference. I see the best laser output on crisp white smooth matte papers, which are of course the hardest thing to find. If you're just using generic copy paper or inkjet paper the tooth will still make 10pt and below look icky. </p>
      <p>Votopake paper makes any laser printer output look twice as nice, although it's really hard to find. I've been trying to find a small-quantity supplier lately, when I do I'll let you know.</p>
