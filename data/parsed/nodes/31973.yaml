      <p>A common device is to format the company's name in a distinctive manner each time it appears: bold, colored, or in a different font, for example. Doing that could alleviate your concerns about having the name at the beginning of a sentence.</p>
      <p>I'd go with consistency above all else, so I'd recommend using "naturalstudio" since you seem to largely employ that elsewhere. A number of people are opposed to innercaps like "NaturalStudio" (which is apparently why it's "Photoshop" and not "PhotoShop" -- one certainly looks classier than the other).</p>
