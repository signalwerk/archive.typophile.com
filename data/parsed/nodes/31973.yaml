    html: "<p>Interesting discussion.  I too have been frustrated by the criticism of our company name \"väsamed\".  Despite its stylized appearance in formal documents (see website <a href=\"http://www.vasamed.com\" title=\"www.vasamed.com\">www.vasamed.com</a>) the matter of dealing with the lack of the expected cap \"V\" in day-to-day correspondence has been \"educational\" to put it in as positive a manner as possible.  Frequently heard comments: What does it mean?  Why do you not capitalize the name?  What are the funny dots?\"  On and on.  One benefit I suppose is that these questions and comments equal attention and an opportunity for our team to engage in discussions with customers.  The fact that we are a medical company seems to create an urgent need on the part of our customer audience to want grammar and behavior conformance e.g. VasaMed, Vasamed, Vasa Medical, etc. As I said, we have grown to welcome most of the attention since it provides an opportunity to engage customers in a philosophical discussion of our name, its meaning and relevance to our product lines and tie to strategic mission.  Most of the time, they get it and like it so much that they advocate keeping it just the way it is. It's fun to hear some of them get into the artistic aspect of it and link it to their medical missions in life.  However none of the finance/audit types like our name, the lower case, the umlaut and insist it be changed to something \"meaningful and conventional\". This continues to be a challenge for us.</p>"
