      <p>CamelCase - I didn't know it had a name. When I first started the company in 1999 I used to use NaturalStudio almost exclusively, but I think it looks really dated now.</p>
      <p><cite>A common device is to format the company’s name in a distinctive manner each time it appears: bold, colored, or in a different font, for example. Doing that could alleviate your concerns about having the name at the beginning of a sentence.</cite></p>
      <p>Yes - I've experimented with that, but I guess you can't expect everyone to do that. For example, if a naturalstudio release was reviewed in the press, it's unlikely they'd use a specified colour, font or weight.</p>
      <p>Smallcaps doesn't quite work for me. Somehow it looks less creative. Also, I think the mix of smallcaps and lowercase doesn't quite work. And again, I expect not everyone would do it.</p>
      <p><cite>There is a fourth option that I think you should consider: Naturalstudio (and Naturalstudio Records).</cite></p>
      <p>I had considered this, but just thought it seemed a bit front-heavy. A bit imbalanced?</p>
      <p>The most important thing for me is consistency. Wherever the name "naturalstudio" appears (except the logo), I would like it to have the same format. I guess the only thing that I can expect all press/publishers to print is Naturalstudio or Natural Studio, right? At the moment, I reckon Naturalstudio &amp; Naturalstudio Records comes out on top...</p>
      <p>(It makes me realise what a touch of genius Apple's "iPod" idea was. It looks good in almost any font and has it's own branding.)</p>
