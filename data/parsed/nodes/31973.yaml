      <p>OK.</p>
      <p>So, it's definitely now between Naturalstudio and Natural Studio.</p>
      <p>There are many companies with the conjoined word plus initial capital approach - just looking around my house I can see Microsoft, Hotpoint, Silentnight, Airfix, Bodyform etc.. The good thing with this approach is that if you do a search in Google, you'll probably get what you're looking for - all the results are almost exlusively relating to my company.</p>
      <p>However, I think my current logo suggest two different words. Although they are conjoined, the difference in weight reads as natural studio. All the above mentioned companies use one font and one weight for their logos - hence the reason that is remains one word whenever mentioned in copy. I can't imagine my logo changing as it is already well established. If I did modify it, the essence of it would have to remain the same.</p>
      <p>The main down side of Natural Studio is that unless you put the words in inverted commas when doing a Google search there are thousands of unrelated links.</p>
      <p>Other than the Google issue - does anyone else have any negative thoughts about "Natural Studio". For some reason, it just seems cumbersome to me. Maybe because all my favourite company names are either one word...?</p>
      <p>Curious to hear your further thoughts.</p>
      <p>Douglas.</p>
