      <p>i'll weigh in with the opinion that it should remain lc throughout. good copywriting can avoid starting sentences with the name: </p>
      <p>naturalstudio gives their clients the best widgets available.</p>
      <p>can easily be replaced with</p>
      <p>When you shop naturalstudio, you can expect the best widgets available.</p>
      <p>that's what copy writers are for.</p>
      <p>you can also try the consistent formatting technique described above, or simply add the TM mark after the the word.</p>
