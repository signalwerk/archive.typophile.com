    <p>Hi,</p>
    <p>This post is just to ask your opinions on a connundrum I'm currently facing.</p>
    <p>The logo for my company is all lowercase (see it here - <a href="http://www.naturalstudio.co.uk" title="http://www.naturalstudio.co.uk">http://www.naturalstudio.co.uk</a>) and I'm having a bit of a hard time deciding how it should be represented in a normal body of text.</p>
    <p>1. naturalstudio<br>
    2. NaturalStudio<br>
    3. Natural Studio</p>
    <p>I am keen for it to be one word (to try and maintain some sort of branding), but the first one poses certain problems. For the past year or so, I have used the first option (naturalstudio) exclusively. However, it is very context dependent - unless someone is already familiar with the name of the company, because of the lack of capitalisation, it might simply look like someone has ommited a space.</p>
    <p>Also, it looks a bit clumsy when placed first in a sentence:</p>
    <p>As you see, it seems quite unatural. naturalstudio doesn't seem to work in this instance.</p>
    <p>Which leaves NaturalStudio. At least it has "a look" about it. However, I think it may be a bit tacky. What do you all reckon?</p>
    <p>The last option is Natural Studio, but somehow that just looks a bit uninspiring to me. Also, there is no branding there at all - just two separate, commonly used words.</p>
    <p>To put a spanner in the works, the record label division of the company is usually on album artwork as naturalstudio records (i.e all lowercase). But how should it be cited in text - naturalstudio records? NaturalStudio Records? Natural Studio Records?</p>
    <p>Any ideas?</p>
    <p>Looking forward to your thoughts.</p>
    <p>Douglas.</p>
