    <p>so i have a problem. fontlab 5.0.2 will no longer startup on my mac intel system. just started today. first time. it gets to the loading point where it says caching ATSUI fonts and then crashes out asking me to reopen or try again. something to that effect. i saw a previous thread about this but nothing ever seemed to be resolved. someone said uninstal problem fonts. well i deactivated all of them except the system fonts which i can’t change. </p>
    <p>please help? i just bought this program two weeks ago...</p>
