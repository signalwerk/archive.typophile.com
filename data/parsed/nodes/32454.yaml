      <p>well, to update my own post, seems like if anyone runs across this problem, just trash you fontlab preferences and restart the program. worked fine after that so far. there seemed to be a couple fontlab preference files. don’t trash the license one or youll have to dig up your serial number and retype that in on restart</p>
      <p>w|m</p>
