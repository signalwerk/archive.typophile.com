    <p>A typographic symbol in the form of a star*, occupying space between the <a href="/wiki/baseline" class="freelinking" rel="nofollow">baseline</a> and <a href="/wiki/ascender" class="freelinking" rel="nofollow">ascender</a> height, used as a reference mark for a <a href="/wiki/Footnote" class="freelinking" rel="nofollow">footnote</a> or <a href="/wiki/Endnote" class="freelinking" rel="nofollow">endnote</a>, as illustrated by this example for the word "star" in the first line of text.</p>
