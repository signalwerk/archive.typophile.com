  html: |-
    <p>No idea where we stand in the implementation of descriptive names for Stylistic Sets in applications.<br>
    But here's a question anyway:</p>
    <p>As far as I know there are no specs on where in the naming tables to put them. Any name table ID can be chosen.<br>
    Here I also see a major reason why no one bothers to implement them because they don't know where to look.</p>
    <p>Are there any conventions yet on ID ranges?</p>
comments:
  - id: 539449
    user: 8664
    date: 2013-01-22T04:43:00
    date_raw: 22 Jan 2013 — 4:43am
    votes: null
    html: <p>No conventions are needed because a Feature Table can point, via its FeatureParams field, at a specific name ID. See the <a href="http://www.microsoft.com/typography/otspec/features_pt.htm#ssxx" target="_blank" rel="nofollow">feature tag registry</a> which also mentions which name IDs may be used.</p>
  - id: 539457
    user: 24931
    date: 2013-01-22T05:45:00
    date_raw: 22 Jan 2013 — 5:45am
    votes: null
    html: |-
      <p>Okay, so given an FDK code snippet like below, will the FeatureParams field that you mentioned automatically point to the right name ID, given that in this code I don’t even point out name IDs?<br>
      In other words: Is this all code that is necessary?</p>
      <p><code><br>
      feature ss04 {<br>
      # Stylistic Set 4<br>
        featureNames {<br>
          name 1 "Alternate german lowercase sz";<br>
          name 3 "Alternate german lowercase sz";<br>
        };<br>
      }ss04;<br>
      </code></p>
  - id: 539460
    user: 8664
    date: 2013-01-22T06:40:00
    date_raw: 22 Jan 2013 — 6:40am
    votes: null
    html: <p>It is as simple as that.</p>
  - id: 540032
    user: 3320
    date: 2013-01-24T07:33:00
    date_raw: 24 Jan 2013 — 7:33am
    votes: null
    html: <p>Does anyone have any info on what applications display these name records in the UI?</p>
  - id: 540517
    user: 909
    date: 2013-01-27T20:55:00
    date_raw: 27 Jan 2013 — 8:55pm
    votes: null
    html: <p>I don't know of any that do, yet. Certainly not InDesign or the like. Anybody else know of one that does?</p>
  - id: 540714
    user: 9108
    date: 2013-01-28T04:20:00
    date_raw: 28 Jan 2013 — 4:20am
    votes: null
    html: '<p>Maybe in the [near] future; there is one Adobe font with human readable names: <a class="freelinking external" href="http://blogs.adobe.com/typblography/2012/08/source-sans-pro.html" rel="nofollow">Source Sans Pro</a></p>'
  - id: 541317
    user: 909
    date: 2013-01-28T20:52:00
    date_raw: 28 Jan 2013 — 8:52pm
    votes: null
    html: <p>I would not assume any correlation between the data being in Adobe fonts and support in Adobe applications. Adobe has had optical size data in OpenType fonts for over a decade now, and it is still unsupported by any Adobe application.</p>
