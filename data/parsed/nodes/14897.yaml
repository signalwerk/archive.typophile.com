    html: <p>Actually, the page on the <a href="http://www.linotype.com/213/carniola-family.html">Linotype</a> site says 1993 (12 years ago). The designer, aside from not liking the font very much, says, “Carniola is a pastiche of different type designs from the beginning of the 20th century, mostly American.” So your assessment of a Souvenir/Garamond love child is right on the money.</p>
