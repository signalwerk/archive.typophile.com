      <p>I really love this!!! A+++</p>
      <p>Here is something you need to be concerned about tho:</p>
      <p>Look at the negative space in the logo, you may have to correct the axes a bit especially at the top of the 8 and the a. All the axes should be completely vertical. Stroke smoothing in the lower part of a is necessary too.</p>
      <p>Good job!</p>
      <p>Mikey :-)</p>
