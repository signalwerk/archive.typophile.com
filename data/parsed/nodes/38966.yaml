    <p>Hi guys,</p>
    <p>I've been asked to create a logo for a relatively new music promotions company based in the UK. They are currently jazz-based but would like to branch out into other genres in the future. This logo must be used on stationery, web and be printed in small sizes (just the 'a8' ligature) on spines of CDs. </p>
    <p>Let me know what you think!</p>
    <p>Thanks,<br>
    Rich</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/a8ligature_3568.jpg"></div><p></p>
