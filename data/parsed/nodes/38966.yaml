      <p>very smart Rich! </p>
      <p>I've looked at it for 5 minutes and it's totally grown on me. if i cast my mind back 4 minutes and 50 seconds i'd have said that the 8 should be dropped down just slightly to give the vertical stroke of the "a" a chance to descend a touch further before becoming the bottom-most stroke of the 8. the "a" just looked a little disempowered to me at first. </p>
      <p>but that was my first impression. other than that, i love it. </p>
      <p>i also respect what versonova said, but i also know when you fall in love with a concept it can be really hard to listen to others!!</p>
      <p>nice work<br>
      Paul</p>
