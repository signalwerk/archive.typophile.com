    html: <p>Interesting use of fonts. - There must be a theory behind the characters used and a reason they are entwined - Consider alternate fonts for the word music they should give strength to and not distract from the theory/concept appearing above them. The current selection for music does not portray the seriousness of the logotype above it. Consider the maturity of the ligature and find a way to bring that maturity into the word music making them a stronger unit.  ---- versonova</p>
