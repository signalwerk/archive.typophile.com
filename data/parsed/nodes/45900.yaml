    html: |-
      <p>This is a tough one. The P has a small counter and the S serifs are blended. At first I thought some Garamonds have the same kind of W, and the S serif is similar, but the P was the problem.  The closest font I could find that seemed close to the W, P and S was <a class="freelinking-external" href="http://www.myfonts.com/fonts/adobe/rotation/">Rotation</a>, but it seems to have less bracketed serifs. Either squooshing (horizontally) or stretching vertically, would possibly increase the similarity. That’s the best I can suggest so far.</p>
      <p>- Mike Yanega</p>
    html_clean: |-
