    html: "<p> Hmm, this forum has a way of provoking people to dust off their old, partially developed fonts. More power to 'em. <br> <br>Nice font, by the way. I like it in general. The serifs seem to need a little work, perhaps. The serifs in certain instances seem slightly overbearing: at the apex of the UC A as well as the lc e, for example. <br> <br>Does the UC M seem a little timid? (Perhaps the middle should extend further down?) <br> <br>Cheers, <br> <br>//joe </p>"
