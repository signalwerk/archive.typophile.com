    html: <p> Thanks. Good analogy too. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)">  <br> <br>FWIW this was started in 1991 using nothing but Fontographer. I put it away for several years and started making some adjustments recently, but what you see here is hardly changed from what I had almost 10 years ago. </p>
