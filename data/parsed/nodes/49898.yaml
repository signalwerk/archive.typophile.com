    html: <p>The second edition presents the complete character sets of 333 blackletter fonts (80 of them newly added), plus Fraktur typesetting rules by <a href="/wiki/Friedrich%2520Forssman" class="freelinking">Friedrich Forssman</a>. Judith put quite a lot of work into the new edition. It’s so fresh – it even contains a few faces made with <a href="/wiki/FontStruct" class="freelinking">FontStruct</a>, which opened its doors only this April!</p>
