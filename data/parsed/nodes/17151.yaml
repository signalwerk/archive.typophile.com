    <p>Hello, </p>
    <p>I’m curious as to what charts and graphs looked like before computers were around to create them. I’m less interested in the how than in the style, or even if data was presented graphically at all. Could it be that we only have pie-charts because, all of a sudden, Xcel appeared and allowed us to do it? </p>
    <p>While there seems to be plenty of examples of pre-digital era typography, photography, cartography or any other kind of ‘-ography’, data design is almost non-existant (in my knowledge at least, I realise this could be my failing, not the graphic world’s) </p>
    <p>Does anyone have any examples of data graphics, or any kind of history of this aspect of graphic design? </p>
    <p>Ta,<br>
    Anthony</p>
    <p>(Sorry, I realise this isn’t typography as such, but is rather a related discipline.)</p>
