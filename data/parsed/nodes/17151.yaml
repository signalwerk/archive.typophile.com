      <p>If you are going to look at Tufte, you must view the other side and look at  <a href="http://www.nigelholmes.com/home.htm">Nigel Holmes</a>.<br>
      His website features his more up-to-date computer based work, but his work for Time magazine in the late 70s and 80s set the standard for modern illustrative info-graphics. Tufte has called him a chartoonist, and dismisses his approach, and you will have to speak with Nigel to get his opinion on Tufte. Still there is alot more of Holmes work out there in the work-a-day world than there is Tufte’s.</p>
