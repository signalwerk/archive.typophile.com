      <p>We did thousands of charts and graphs before computers. It took longer drawing the line work by hand (ruling pen and compass). We used Amberilth or Rubylith film to cut layers of color and tone separations for camera.<br>
      In those days, if someone came back with data changes, you charged them an arm and a leg so there was less of the hourly changes of data than there is today. Look mat any annual reports done pre 1986 and you will see.<br>
      The big difference was that because it was laborious, it was not overdone as it tends to be today.</p>
      <p>ChrisL</p>
