      <p>I think you've identified a real problem.</p>
      <p>But I don't see that there is a solution. Absent some fancy DRM system for fonts, a system of lending fonts out puts the value of product at risk. And doing so simply to deal with bureaucratic problems that their prospective customers ought to have straightened out on their own - it isn't a font foundry's fault if a company is badly organized and you need signatures from five levels to actually spend money on a font.</p>
      <p>That being said, there's another point of view, too: that while home computer users can use whatever font without being traced, businesses are visible, easy to sue, so in general they're trustworthy as far as obeying licenses is concerned.</p>
      <p>Worse yet, though, for type designers is the state of demand in the font market. Once people have the standards - Times Roman, Caledonia, Garamond, Lydian, Baskerville, Bodoni, Helvetica, Univers, Optima, Palatino, Copperplate Gothic, Eurostile, Clarendon - some well-known display fonts - Peignot, Hobo, Papyrus, Mistral, Ondine - and perhaps what is currently fashionable - Stone, Lucida - they're pretty much satisfied.</p>
      <p>Art departments at major publishers, advertising agencies, or companies, therefore, basically form the market that most of the typeface designers here are addressing. This is a very small market. And the people <em>in</em> that small market generally know their business... and probably don't need the help some sort of font lending system would give.</p>
      <p>So the real problem is to expand the font market; to give a broader section of corporate customers, at least, reasons to get more creative in their choice of fonts to license. Giving the ordinary consumer choices beyond what comes with applications and those "lousy font CDs"... might be a challenge likely to remain unmet, but it's another frontier.</p>
