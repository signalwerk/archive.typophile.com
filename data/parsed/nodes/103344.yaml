    <p>Basically, the situation is that I am in need of a programmer with the skill necessary to program fonts by integrating the calt OpenType feature into them.  I am more than willing to be taught these skills, as I will be creating multiple fonts utilizing this feature and possibly some other advanced ones.  If anyone is interested and believes they are capable of such a task, please contact me at <a href="mailto:thepcnerd7@gmail.com">thepcnerd7@gmail.com</a>.  I highly appreciate any advice or input, and thank you for your time and willingness!</p>
    <p>For His glory,<br>
    Austin M.</p>
