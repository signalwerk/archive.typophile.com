    html: <p> IMO I wouldn't use the bottome type. You've introduce a third "trick" by separating the type in two weights. Also, by separating your little icon from the type, this doesn't get rid of the contradiction between styles. In fact, I would think it would exaggerate it. Have you tried tweaking (ultra-technical term) the shapes of the other letters for better coordination?? One option could be (besides minor tweaking, ergo loosening up) thickening all of the letters to match the weight of the "H". </p>
