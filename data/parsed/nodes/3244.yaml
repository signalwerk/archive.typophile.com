    html: "<p> Matthew: Don't have any suggestions about color. To me brown suggests retro, offbeat, vintage, different. <br> <br>become logo: I think this would be helped by tighter spacing. Also, you have a lot of talents so what kind of services are you offering under the become umbrella? Perhaps there's something more telling than an arrow counter, maybe even a slash 0 or a Question Mark. When I see the logo, I want to make it into a question: What do you want to become? <br> <br> <br>getchatting: what is the company about? For some reason, flat edges seem more professional, rounded more fun and casual. <br> <br>There are some cool possibilities with the beginning and ending letters both being 'g' and the tti lig. <br> <br>You could also experiment with the size of the bottom loop of your bicameral g. <br> <br>good luck, <br> <br>bj </p>"
