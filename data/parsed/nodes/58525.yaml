      <p>Well, this is not a joke. It actually happend but it's funny and it envolves a font...</p>
      <p>A close friend of mine is a type designer (we will be refering to him as Al) met a nice girl at a party and started going out with her. She told him that she was moving to another city in a week so they shouldn't fall in love.  He agreed.</p>
      <p>A few days before she leaves I ran into Al and asked him how he was. I know he is the kind of guy who easily falls in love. He told me he was ok, that he is well aware of the girl's situation and that he is not in love with her.</p>
      <p>Two days after she left Al showed me a new font he was working on. </p>
      <p>I said to him: "Al, you are such a liar! I told you, she told you and everybody told you not to fall in love with her!!"</p>
      <p>"But I'm not in loved!" he replied. </p>
      <p>To what I said: "Al, you named your font after her..."</p>
    html_clean: |-
