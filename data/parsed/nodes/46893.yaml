  html: <p>so i'm looking on the net for the history of the font "runic condensed" cuz i'm a fan of the videogame series "final fantasy" and i can't find any mention of the rest of the font family. why is "condensed" the only style of "runic mt" to be digitized and what happened to the rest of the family??</p>
