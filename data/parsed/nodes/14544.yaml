    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Sort</strong></p>
    <p>Within a handset typecase each compartment is considered a sort. The term is also used to describe the contents of such compartment.</p>
    <p>Trivia: When a typesetter is missing certain letters needed to finish a job they are "out of sorts."</p>
