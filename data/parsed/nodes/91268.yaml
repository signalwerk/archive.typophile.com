      <p>Well, after working with the "knockoff" a little I've found that the baseline and kerning is kinda messed up compared to real Friz Quadrata. I could make it work, but it's not ideal.</p>
      <p>And if the terms really don't cover redistribution, that's a real problem.</p>
      <p>Why exactly must font licenses be so painfully inflexible? I understand the effort that goes into creating a typestyle and agree that the creators should be compensated for their work, but at the same time things need to be made as simple and cost-effective as possible for the customer, regardless if said customer is a monolithic company or a lone college student developer. If a license to distribute the font with the framework that also covered the works of developers using it was available and reasonably priced, I wouldn't hesitate to fork over the cash, but no such thing seems to exist. Perhaps I'm mistaken, but it feels kind of like the industry is still stuck in the early 90's.</p>
      <p>EDIT: I'd also like to add that the framework is intended for use with applications made by and for the fan communities of Blizzard games; for instance, one might use this UI framework for a World of Warcraft name generator or a Starcraft save game organizer.</p>
