    <p>Hello all,</p>
    <p>I am something of both a designer and Mac software developer who is need of a font for a project that I'm working on. To be specific, I am creating a Cocoa framework that mimics the UI look and feel found in Blizzard games for use by both others and myself. Part of that feel, obviously, is the font that Blizzard uses, which is mostly Friz Quadrata.</p>
    <p>While I would not mind buying a license for my own personal use, it is simply not feasible for myself as a college student to purchase a license that would allow me to distribute the font with the framework, as doing so would be prohibitively expensive, and expecting the users of the framework to purchase a font license in order to use it isn't exactly reasonable.</p>
    <p>That why I now come seeking the knowledge of the typography experts here at Typophile in my search for a free alternative. Do you have any suggestions for free fonts with an extremely similar look and feel to Friz Quadrata?</p>
    <p>Thanks for taking the time to read!</p>
