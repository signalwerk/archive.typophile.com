      <p><em>Why exactly must font licenses be so painfully inflexible? … Perhaps I'm mistaken, but it feels kind of like the industry is still stuck in the early 90's.</em></p>
      <p>At that time, pre-www, there were not so many different kinds of font licence.<br>
      Now, evolving with the variety of digital devices and business structures, font licensing has become much more sophisticated.<br>
      Licensing is precise, to cover a variety of different situations, rather than inflexible.</p>
      <p>Of course, this can be perplexing to the licensee, and some licences are more user-friendly than others, but IMO font licensing is at the cutting edge of digital culture, addressing the implications of technological change to intellectual property.</p>
