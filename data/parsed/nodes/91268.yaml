      <p>Kock off or not, free or not, the License says clearly</p>
      <blockquote><p>
      4. <strong>Embedding.</strong> You may embed the licensed fonts into any document you send to third parties. Such documents may be viewed and printed (but not edited) by the recipients.</p>
      <p>You may not under any circumstances embed the licensed fonts into software or hardware products in which the fonts will be used by the purchasers of such products. Such use requires a different license which may be offered by the Foundry through MyFonts. Please contact <a href="mailto:help@myfonts.com">help@myfonts.com</a> for further information.</p>
      <p>5. <strong>Modifications.</strong> You may import characters from the font as graphical objects into a drawing program and modify such graphical objects.</p>
      <p>You may not modify, adapt, translate, reverse engineer, decompile, disassemble, or create derivative works based on the licensed font itself without Foundry’s prior written consent.
      </p></blockquote>
      <p>Consequently, that font does not seem to fit the bill unless the software uses only (vector or not) graphics made using the font or else every user of the software downloads himself the font.</p>
