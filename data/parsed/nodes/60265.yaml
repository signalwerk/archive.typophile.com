    <p>Hi folks,</p>
    <p>This is a little non-paying side project for a friend who is incoming auditor of the DJ society of the local university. The brief is very loose, with simplicity important. I would be interested to hear thoughts on this concept… The execution is very rough at the moment.</p>
    <p>Uses will mainly include flyers, T-shirts and posters.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/dj_soc1_4362.png"></div><p></p>
    <p>Many thanks,<br>
    Ross</p>
