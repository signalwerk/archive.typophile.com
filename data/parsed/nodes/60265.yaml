    html: |-
      <p>Hi, there is a different hint!</p>
      <p>The jack entering from bottom left has some weight - in relation to the symmetry!<br>
      The "DJ" (LARGE LETTERS) have weight too - in realation of all letters.</p>
      <p>IF you let the jack entering from right top... and reachig to the same position like now... then it has TWO positive effects:<br>
      a) the jack could be interpreted as the arm of a turntable (in it's correct positon) - and<br>
      b) there will be no tight squeeze between jack and text...</p>
      <p>e.g.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/soc_test_5293.jpg"></div><p></p>
