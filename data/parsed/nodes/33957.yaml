      <p>caslon seemed right for the brief, I mean, the course tutors want to see historical background. The face has to relate to the timeframe of the text itself. Stevenson leaves an ambiguity about the actual date that the proceedings occured, when the date is mentioned he marks the year as “18—”, so it could exist anywhere whithin C19th.</p>
      <p>I read that Caslon was a widely used face during the 18th century, and from my samples it seems to work well for the subject matter. Baskerville seems to be a litte contrived, a fantastic face that fits the restrictions of the text, but I would like to be a little...different.</p>
      <p>What would you suggest hrant? Thankyou for the feedback. It is really appreciated.</p>
      <p>TomShep</p>
