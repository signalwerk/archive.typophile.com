    <p>A recent brief of mine asks for me to present the entire text from the book ’Dr. Jekyll and Mr. Hyde’, all 25,000 words of it. Of course, to present this in the context of a book would be a process of tedium and torment. we are encouraged to break the boundries of ’the form of a book’, so setting and binding a book is out of the question.</p>
    <p>I decided to display the book through a selection of decorative picture frames that I have either built, salvaged or bought from various charity shops. I need to consider size and printing costs.</p>
    <p>I intended on using Caslon for the entire body text. I realise that the content and era of the book are intrinsic to the piece. The book was released in 1886 in Victorian London, obviusly the type needs some kind of horror vibe. I realise caslon was created over 100 years previous to this date, but I understand it was widely used throughout the victorian era. I wanted to ask the following questions:</p>
    <p>I have both adobe caslon and caslon Old face, for the body text, which would be most    appropriate?</p>
    <p>Could you reccomend any ornaments/fleurons that would work well with the body text</p>
    <p>What would work well with Caslon as a headline text? Here is the crux of the problem. I need two fonts, both of them complimenting the body text, one for the respectable ’Dr. Jekyll’ and another for the tyrannical ’Mr. Hyde’. The fonts will need to be displayed together as the main headline, but would also be used for chapter headings. The faces really need to opitimise the eponymous character(s) in the book.</p>
    <p>Any feedback will be greatly appreciated.</p>
    <p>Thankyou</p>
