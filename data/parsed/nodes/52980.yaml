    html: |-
      <p>I was in New York this weekend and saw the issue. It struck me that the lettering succeeded in capturing the idiosyncrasies of those individual lives lived within a common framework, which was the typeface itself combined with our shared understanding of it (e.g. reading). Very moving work.</p>
      <p>Interesting to compare it to Shepard Fairey's graphically intensive <a class="freelinking external" href="http://www.time.com/time/covers/0,16641,20081229,00.html " rel="nofollow"> cover of Obama</a> for <a class="freelinking external" href="http://www.time.com/time/specials/2008/personoftheyear/article/0,31682,1861543_1865068_1867014,00.html " rel="nofollow"> Time's Person of the Year</a>, for example. Both aim to capture the spirit of and urgency of individuals but they do so in very different ways.</p>
