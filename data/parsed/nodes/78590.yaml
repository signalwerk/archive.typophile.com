      <p>Just a note -- running in small directions, such as "smiles," is conventional, whereas breaking even one word to a new line, a la the Yale style, is not. In fact, if a "direction" occurs in the middle of a speech, the whole thing is often run in.</p>
      <p>Many authors, and editors, prefer the run in style, esp. when the dialogue is short. My response is they're more comfortable in the armchair than in the working part of a theater.</p>
      <p>The flush &amp; hang too is more conventional -- you're using extra space along the left margin to signal a new speaker, rather than interlinear space. Either works to help you find your place. The more stage directions there are, the better flush &amp; hang. Same if each speech is short.</p>
      <p>As a general observation, the younger the playwright, the better off you are to stay "conventional." Editors can get rule-bound at any age . . .</p>
