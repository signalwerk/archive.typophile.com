    html: |-
      <p>Small caps for character names. Italics are for stage directions.</p>
      <p>Take a look at the Yale drama series for an interesting design. The speakers names are on a line by themselves, and the only place where there is space above. All stage directions are set in italic (conventional) and begin a new line. If you're reading a play as an actor -- or working sound or lights -- this is very helpful. All the spoken words are together, all the instructions are in italic and on a line(s) by themselves. As below, except I can't set small caps here.</p>
      <p>FRED:<br>
      Blah blah blah blah blah blah blah blah blah blah blah blah blah blah blah blah blah blah blah blah blah blah blah blah blah blah<br>
      <cite>smiles</cite><br>
      blah blah blah blah blah blah blah blah blah blah.<br>
      <cite>exits stage right, as ESMERELDA and her entourage enter stage left, trailing daffodils, and chanting an odd mixture of an Irish and Hawai'ian tune.</cite></p>
      <p>ERNIE:<br>
      Blah, blah, blah.</p>
      <p>This style (design) is a little harder to read at first if you are sitting in an armchair, but if you've ever worked in the theater, it is a delight.</p>
