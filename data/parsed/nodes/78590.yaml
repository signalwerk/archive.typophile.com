      <p>John,</p>
      <p>as with a quote -- run in means only a word space separates the item on either side, and it is signaled as different by some device -- quote marks for a quotation, parens and italics for a stage direction, etc.</p>
      <p>FRED:<br>
      Blah blah blah blah blah blah blah blah blah blah blah blah blah blah blah blah blah (<cite>smiles</cite>) blah blah blah blah blah blah blah blah blah blah (<cite>ESMERELDA and her entourage enter stage left, trailing daffodils</cite>) blah blah blah blah blah blah.</p>
