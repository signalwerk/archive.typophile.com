      <p>Dan, here is a quick screenshot from a book I typeset some months ago, featuring three plays. As Charles pointed out, small caps are usually used for character names, and I've also used italics are for stage directions. Another crucial element is the negative paragraph indent after the first line, which helps the reader keeping track of who's talking. Also, after the character name I put a double space before teh dialogue starts (sometimes, in other books I've seen, it is more spaced). Hope this is helpful.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/play_6233.jpg"></div><p></p>
