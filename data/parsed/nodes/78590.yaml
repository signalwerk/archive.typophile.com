    <p>Hello, I'm working on a literary magazine and there's the script for a theater piece. It's dialogue-based, with character names in front of each line. What's a good way to typeset this?</p>
    <p>(I was thinking about doing a faux movie script type of thing with the monospaced typeface, but it goes against the rest of the magazine and it's borderline passé).</p>
    <p>Can you point me towards some successful examples of dialogue typography?</p>
    <p>Thanks,<br>
    Dan</p>
