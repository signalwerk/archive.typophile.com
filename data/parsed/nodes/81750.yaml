      <p>While it's true that a typeface can centre a corporate identity, you shouldn't put the cart before the horse.<br>
      I would suggest you take a look at identities which play on humour, and get a feel for what you think is a successful tone that strikes the right balance between silly and serious. Here's one:<br>
      <a href="http://www.rubbercheese.com/" title="http://www.rubbercheese.com/">http://www.rubbercheese.com/</a></p>
