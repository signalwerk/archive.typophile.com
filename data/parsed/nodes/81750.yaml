  html: |-
    <p>Hi,</p>
    <p>I’m looking for a font for my new business.<br>
    It will be a consulting business with the main topics: callcenter &amp; help &amp; servicedesk.<br>
    I also want to reflect my personality in it.<br>
    I’m a positive thinking person who likes to help people.<br>
    My satisfaction comes from resolving problems of other people and that’s why help &amp; servicedesk is my passion.<br>
    I try to enhance the atmosphere at the workplace with my humor. This is very important to me. I also like to motivate people any way possible.</p>
    <p>This should all reflect in a font that i want to use through my site &amp; stationary.<br>
    Can someone help me?</p>
    <p>thx for your advice.</p>
    <p>Philippe</p>
