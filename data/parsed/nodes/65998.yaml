    html: <p>I don't like the suddenly rising baseline, and there are some legibility issues (Qelair? Qdair?) With a new and made-up (?) name like this, especially one that doesn't follow orthographic expectations (no u after q), I think you want to be pretty obvious with the legibility.</p>
