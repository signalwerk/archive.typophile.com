    html: <p>The first thing that came to mind was a Didone like <a href="http://www.fontshop.com/fonts/singles/paratype/standard_poster_black_ot/?sample_text=J&amp;sample_size=388" rel="nofollow">Standard Poster</a>, but Didone doesn't say "cool tat!" to me. Something more stylized like <a href="http://www.letterror.com/catalog/fed/index.html" rel="nofollow">Federal</a> or, if you're masochistic, <a href="http://www.myfonts.com/fonts/intellecta/paulus-franck-1602/" rel="nofollow">Paulus Franck 1602</a> might work. <a href="http://www.myfonts.com/fonts/grouptype/gotico-black/" rel="nofollow">Gothic</a> ... <a href="http://www.myfonts.com/fonts/efscangraphic/gotisch-sb/" rel="nofollow">blackletters</a> are a <a href="http://www.myfonts.com/fonts/bagraphics/steel-magnolias/" rel="nofollow">classic</a>. But if you really want to declare your font geekiness, why not take a 12pt bitmap of something like Georgia and enlarge it so you see the pixels, hinting and all? You can even have subpixel rendering! On your arm!</p>
