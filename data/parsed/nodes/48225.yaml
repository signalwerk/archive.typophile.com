  html: |-
    <p>I'm looking for capital and lowercase Js that you appreciate or find beautiful. I'm going to be flipping through my FontBook this weekend, but I'd love to see people's favorites, particularly from this self-selecting group of type- and visually-aware people.</p>
    <p>The reason: a tattoo I'm in the early planning stages of. It'll likely be on my forearm, and will probably be incorporated into a larger design that will find its form based on the J itself. The J stands for something*, but that something won't influence the look of the tattoo, so it's not relevant to the typeface choice. I'm leaning towards a single color, and that color is black.</p>
    <p>My inclination is towards the J as you see it here, rather than the script J as you'd see in, say <a href="http://www.fontshop.com/search/?q=bello&amp;x=0&amp;y=0&amp;sample_text=Jj" rel="nofollow">Bello</a> or <a href="http://www.fontshop.com/fonts/downloads/itc/itc_edwardian_script_std_virtual/?sample_text=Jj" rel="nofollow">Edwardian Script</a>, but I certainly won't rule out interesting glyphs on that basis alone.</p>
    <p>Many thanks for any suggestions.</p>
    <p>*No, not "Jesus".</p>
