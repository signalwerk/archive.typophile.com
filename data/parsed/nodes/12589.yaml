  html: |-
    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Software" class="freelinking" rel="nofollow">Software</a> : <a href="/wiki/Font%20Validation%20Software" class="freelinking" rel="nofollow">Font Validation Software</a> : The Font Inspector</strong></p>
    <p>Intriguing freeware tool for quality assurance and inspection of <a href="/wiki/TrueType" class="freelinking" rel="nofollow">TrueType</a> and <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> fonts from <a href="/wiki/Steve%20Hartwell" class="freelinking" rel="nofollow">Steve Hartwell</a>, downloadable from the Font Inspector <a href="http://stevehartwell.home.comcast.net/proj/fontinspector/" rel="nofollow">web site</a>. Versions for both Mac OS X and Windows XP. Allows users to browse the contents of font files, seeing how the font is drawn using various renderers, and allowing users to check that glyphs are properly named. Offers rudimentary support for font validation as well. As of writing at version 0.6.3 and still under active development.</p>
