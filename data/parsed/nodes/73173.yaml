    html: |-
      <p>One thing I should point out: Firefox 4 uses "private" CSS extensions, with the prefix <code>-moz-</code>, which is the way to do it before new aspects of CSS have been standardized. </p>
      <p>But the really good news is that an even more comprehensive mechanism for handling OpenType Layout features in CSS has been submitted for standardization at the W3 Consortium (I'm proud to say that I had a tiny little part in that). The current <a href="http://dev.w3.org/csswg/css3-fonts/" rel="nofollow">editor's draft of the CSS Fonts Module Level 3</a> specifies the "official" syntax, which is quite similar to that used by Firefox 4. Once the CSS3 Fonts draft is accepted, browser makers will be able to implement the official syntax. So things are on the way in the right direction. </p>
      <p>And of course, it would be useful to provide a <a href="http://www.mozilla.com/en-US/firefox/beta/" rel="nofollow">link to the Firefox 4 beta</a> which does all this! :) On the Mac, you can copy <code>Firefox.app</code> from the <code>.dmg</code> to a temporary folder, rename it to <code>Firefox 4.app</code> and then move it to the <code>Applications</code> folder. This way, you'll be able to keep the release version of Firefox 3 untouched. You won't be able to run both versions at the same time, but you can quit one and run the other.</p>
