    <p>Firefox 4 (beta 3) has added OpenType Layout support, controllable through private CSS extensions. It works on Mac OS X by default, while in the Windows version of Firefox 4, you need to open the URL <code>about:config</code> and set the <code>gfx.font_rendering.harfbuzz.level</code> option to <code>1</code>.</p>
    <p>This is quite an interesting opportunity for font developers, and especially Python scripters. You could produce complex HTML renderings of your fonts including OpenType Layout feature previews, right out of your font editor such as FontLab Studio. Combined with the fact that Firefox supports webfonts in OTF and TTF formats, it's trivial to generate a simple web page. </p>
    <p>The CSS property to use in <code>-moz-font-feature-settings</code>. The mechanism is <a href="http://hacks.mozilla.org/2009/10/font-control-for-designers/" rel="nofollow">documented</a> on the Mozilla Hacks blog. </p>
    <p>Firefox 4 uses HarfBuzz, an opensource OpenType Layout library which provides a similar functionality to Uniscribe. HarfBuzz supports user-controllable OpenType Layout features as well as complex-script shaping rules. This all makes it a lightweight environment to test your OpenType Layout features. Unfortunately, Firefox currently does not <em>print</em> using webfonts, so you won't be able to get a PDF with your font showings out of Firefox easily. </p>
    <p><em>Correction: Firefox uses harfbuzz-ng, a "next generation" version of the library, which does not yet integrate complex-script shapers. So FF4 is, for now, good just for testing user-controllable OT Layout features.</em></p>
    <p>Here's an example which renders "Hello small caps world!", in which "small caps" is rendered in OpenType small caps (with the "smcp" feature applied). </p>
    <p><code><br>
    &lt;!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN"&gt;<br>
    &lt;html&gt;<br>
    	&lt;head&gt;<br>
    		&lt;style type="text/css"&gt;<br>
    		&lt;!--<br>
    		@font-face {<br>
    		font-family:'TestFamily';<br>
    		src: url('MyTestFont.otf')  format("opentype");<br>
    		}<br>
    		--&gt;<br>
    		&lt;/style&gt;<br>
    		&lt;title&gt;&lt;/title&gt;<br>
    	&lt;/head&gt;<br>
    	&lt;body&gt;<br>
    		&lt;p style="font-family:'TestFamily';font-size:36px;"&gt;<br>
    			Hello &lt;span style="<strong>-moz-font-feature-settings:'smcp=1'</strong>;"&gt;small caps&lt;/span&gt; world!<br>
    		&lt;/p&gt;<br>
    	&lt;/body&gt;<br>
    &lt;/html&gt;<br>
    </code></p>
    <p>Enjoy!</p>
    <p>Best,<br>
    Adam</p>
