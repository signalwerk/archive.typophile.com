      <p>Looking closer at the issue after a few weeks with the latest beta, it seems that Firefox is messing up with the space character only – stretching it for smaller PPEM sizes, and shrinking it as PPEM size increases.</p>
      <p>For a type designer this is quite annoying. The width of space characters is part of the design and should be respected by the rendering engine.</p>
      <p>This was probably intended as a feature (optical spacing), but it should be optional and not activated by default.</p>
