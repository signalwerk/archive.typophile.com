      <p>I'm currently testing the latest beta of Firefox 4 (Mac). Overall good impression so far (faster, cleaner interface), but I've come across a problem:</p>
      <p>It seems that Firefox is doing some funky ppem-specific adjustment to spacing — automatically increasing tracking for bigger text sizes. (?)</p>
      <p>Is this behavior documented somewhere? Is there a way to turn this “feature” off?</p>
