  html: <p>I'm doing some prelim work/ research for a pro-bono client that's related to theatre. I'd like to draw some subtle inspiration from old playbills, broadsheets, etc. from the era of Shakespeare (which is around Gutenberg's time), but I'm willing to look at other pre-1900s eras that had interesting stylistic qualities. Everyone's so familiar with the strong graphic styles of the 20th century, but I want to see early work that did rely on graphics and colors as much. <br> <br>I'm looking for good resources (books or web) to peruse. I'd like to see the type itself, but how it was composed for the theatre and any decorative elements used to complement it are actually more of interest to me. I know this is vague, but the project's a little open-ended and I can't really get into it until we're close to completion. <br> <br>To be honest, I'm not even sure there's much to be found in the earlier time periods I described, so I'm really just looking for a few good samples. I plan on hitting the stacks later this week, but any leads would do me a world of good.</p>
  html_clean: <p>I'm doing some prelim work/ research for a pro-bono client that's related to theatre. I'd like to draw some subtle inspiration from old playbills, broadsheets, etc. from the era of Shakespeare (which is around Gutenberg's time), but I'm willing to look at other pre-1900s eras that had interesting stylistic qualities. Everyone's so familiar with the strong graphic styles of the 20th century, but I want to see early work that did rely on graphics and colors as much. <br> <br>I'm looking for good resources (books or web) to peruse. I'd like to see the type itself, but how it was composed for the theatre and any decorative elements used to complement it are actually more of interest to me. I know this is vague, but the project's a little open-ended and I can't really get into it until we're close to completion. <br> <br>To be honest, I'm not even sure there's much to be found in the earlier time periods I described, so I'm really just looking for a few good samples. I plan on hitting the stacks later this week, but any leads would do me a world of good.</p>
