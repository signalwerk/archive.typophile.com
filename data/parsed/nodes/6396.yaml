    html: <p>BTW, if anyone is looking for the Bradley font, it's on Dover's <a href="http://www.amazon.com/exec/obidos/tg/detail/-/0486999556/qid=1093649658/sr=1-1/ref=sr_1_1/103-4234994-7125408?v=glance&amp;s=books"> 24 Gothic Display Fonts CD-ROM and Book</a>, rather than the <a href="http://www.amazon.com/exec/obidos/tg/detail/-/0486999602/qid=1076285090//ref=sr_8_xs_ap_i1_xgl14/103-1448097-5990211?v=glance&amp;s=books&amp;n=507846">Celtic and Medieval one</a>. <a href="http://cgm.cs.mcgill.ca/~luc/fraktur.html">Luc's page</a> has the two mixed up.</p>
