      <p>//////////</p>
    <p></p><div class="imageWrap"><img src="/files/typo_cover_18.jpg"></div><p></p>
    <p>The 18th issue of the TYPO magazine is dedicated to British typographer<br>
    Matthew Carter, who recently celebrated the fiftieth anniversary since the<br>
    beginning of his career. The essay outlining Carter’s lifelong work was<br>
    composed by Margaret Re, American researcher of typography and a curator of<br>
    the exhibition Typographically Speaking: The Art of Matthew Carter. It also<br>
    includes an overview of all Carter’s typefaces composed since 1963.<br>
    On further twenty pages of the magazine, Carter was interviewed by our<br>
    Polish contributor Adam Twardoch, recapitulating his career, sharing his<br>
    intimate views on the work of a typographer, and even revealing personal<br>
    details from the life of this typographic star.  </p>
    <p>The TYPO magazine is published bi-monthly in English and Czech since January<br>
    2003. It contains 32-44 full color pages printed on high quality coated<br>
    paper of 250 × 310 mm format. Information on subscriptions at<br>
    <a href="http://www.magtypo.cz" title="www.magtypo.cz">www.magtypo.cz</a>. Contact: Linda Kudrnovska, editorial office manager<br>
    (<a href="mailto:linda@magtypo.cz">linda@magtypo.cz</a>).</p>
    <p>//////////</p>
