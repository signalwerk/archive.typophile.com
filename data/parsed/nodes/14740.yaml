  html: |-
    <p>Hello Stones Fans,</p>
    <p>Mick, Keith, Charlie and Ron kick off their world tour right here in Boston today. Nope, I won’t be there to see the kickoff, but on Tuesday, we’re rockin’ at Fenway Park.</p>
    <p>Looks like <a href="http://www.myfonts.com/fonts/ef/cooper-black/ef-bold/testdrive.html?s=Rolling+Stones&amp;p=36" target="new">Cooper Black</a> takes front and center at the Stones’ <a href="http://www.rollingstones.com/abiggerbang/" traget="new"><strong><em>A Bigger Bang</em></strong></a> media center.</p>
    <p>Oddly enough, it looks like <a href="http://www.myfonts.com/fonts/linotype/bodoni/roman/testdrive.html?s=A+Bigger+Bang&amp;p=48" target="new">Bodoni Roman</a> is being used on the video title… hairlines dropping away… just like the Stones themselves!</p>
    <p>—————————————————————<br>
    Yes, I’m old, but I still ROCK!</p>
