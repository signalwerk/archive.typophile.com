      <p>Are you looking for a monospaced or proportional font?  </p>
      <p>A few years ago I did <a href="http://www.altsan.org/creative/fonts/almvio_437.png" rel="nofollow">this bitmap font</a> (<a href="http://www.altsan.org/creative/fonts/almost_vio.gif" rel="nofollow">text samples</a>) which I use as my primary programming/editor font.  It's loosely based on one of IBM's old OS/2 system fonts for use in command prompt/terminal windows.  It's in an OS/2 specific bitmap format, and not Unicode, so it doesn't help you very much, but is the general design something like what you're looking for?</p>
      <p>I've occasionally wondered if I should find a way of converting it into BDF or something so non-OS/2 users can use it...</p>
