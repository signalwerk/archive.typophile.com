    <p>In the process of creating a mark for a new startup, which helps its clients’ in articulating business messages, through appropriate old and new media, rapidly and simply, using technology tools.</p>
    <p>I wanted something minimal looking, but at the same time readable, unique and got certain element of recall. Working alone, I felt maybe I should get some help/critique, before I venture fully resolving it as a mark, and thinking of its application elsewhere. </p>
    <p>This has to work well both in print and digital. I am already facing problem with this unit while I am reducing it to smaller sizes, which I feel need tweaking within particular sizes.</p>
    <p>I personally like the fact that at the first glance it isn’t decipherable fully but would get after a while (I hope so). Once the visual cue is solved, people would remember it long. Not sure whether—<br>
    1. I am on the right track, or whether i should completely ditch this idea and go for something else.(since its too abstract)<br>
    2. Typographically whether the letters and its proportions need to be re–looked? (I already had many iterations on the ’B’ part, also the fact, I do not want the counter spaces to be straight horizontals)<br>
    3. Will this last long or die faster as a fad?</p>
    <p>Will be very happy if someone could throw some light, and help me in decision making. Please feel free to comment everything and anything, even the gut feeling.</p>
    <p>Thank you - Shalin</p><div class="imageWrap"><img src="/files/zebu_3931.jpg"></div><p></p>
