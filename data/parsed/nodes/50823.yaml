      <p><cite>which helps its clients’ in articulating business messages, through appropriate old and new media, rapidly and simply, using technology tools.</cite></p>
      <p>That statement is so full of fluff and doesn’t actually say what they do.</p>
      <p>My initial reaction is, man that logo is going to have trapping problems at almost any size.</p>
      <p>If the company’s job is to make things clearer, which I think is what that statement was saying, then this logo isn’t anywhere near the mark. I’d almost go in the complete opposite direction. Thin, spaced out letters, something very pure and simple.</p>
      <p>What does ZEBU stand for, is that just another WEB 2.0 nonsense name? Or does it have some roots?</p>
