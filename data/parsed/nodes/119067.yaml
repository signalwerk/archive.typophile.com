  html: |-
    <p>I'm designing a serif typeface, and I'm wondering what's the acceptable amount of latinization for the mu (µ) glyph? I'm talking about the µ in the Latin-1 Supplement block—the one used for typesetting "µm" &amp; stuff, not the mu in the actual Greek block. Most fonts I've seen do the same for both glyphs, with no serifs, a curved spur and a blob at the bottom of the stem. But I don't know how well that blends when set next to a latin 'm'. I've seen many fonts where the microns just looked horrible. I guess the same issue comes up with the IPA lambda and phi.</p>
    <p>Is the following design acceptable?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screenshot 034_5306.png"></div><p></p>
    <p>Also how would you deal with the black spot at the intersection of the 'µ's bowl and the stem?</p>
