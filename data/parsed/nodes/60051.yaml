    <p>User Dominique Massot sent a storefront photo and flyer for the new shop OLIVARI at 8 rue Littré, 75006 Paris France, featuring one of my old free fonts: <a class="freelinking external link-external" href="http://www.1001fonts.com/font_details.html?font_id=2585" rel="nofollow">Bolonewt</a></p>
    <p></p><div class="imageWrap"><img src="/files/facade_small_4419.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="/files/flyer_verso_4616.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="/files/flyer_recto_6611.jpg"></div><p></p>
    <p>It works wonderfully on this shop sign, but Bolonewt is a font I made many years ago, and as proud as I was of it then, knowing what I've learned since then makes me think it looks like ass. </p>
    <p></p><div class="imageWrap"><img src="/files/bolonewt2585_5196.big.png"></div><p></p>
    <p>The curves don't blend into the straights right, and the "s" is frightening! So, I'm determined to fix it somehow.</p>
