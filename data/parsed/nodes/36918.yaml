      <p>I hope I can cover all the questions in one go... :)</p>
      <p>Traditionally, the KABK Open Day is from 10.00 till 17.00 and I don’t expect that the next one will be different. When you’re planning to come, please let us know by sending an e-mail.</p>
      <p>To find more examples of work and projects of (former) Type &amp; Media students I’d recommend to Google for 'type media kabk'. We hope to include more examples of work and projects on the official KABK website in due time, but luckily some of our former students have published their work on personal websites.</p>
      <p>The official language for the Type &amp; Media course is English, since the majority of students (90%) are from outside The Netherlands. During the last five years we’ve been host to more than 25 different nationalities. The KABK website has quite an extensive section with info for international students. Although this is aimed mainly at exchange students for the BA courses, most of it applies to Type &amp; Media too: <a href="http://www.kabk.nl/English/index.xml" title="http://www.kabk.nl/English/index.xml">http://www.kabk.nl/English/index.xml</a></p>
      <p>The tuiton fee for last year was 1519,- Euros for EU students. For more info about current tuiton fees, and fees for non-EU students I’d recommend to send an e-mail to the student administration.</p>
