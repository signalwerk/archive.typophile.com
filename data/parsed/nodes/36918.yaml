    html: |-
      <p>It is difficult to paint a typical profile, but we are looking primarily for demonstrable experience in document design, over lettering and typeface design: how existing typefaces are used, rather than how new ones are made. This reflects a strong view that typeface design is inseparable from its contexts, and that it is through these that one can best enter the discipline. In practical terms, a brief for a typeface is incomplete without some thought going into document types and genres, text modes, scales, and usage scenarios. </p>
      <p>We are also looking for evidence of visual skills, good working practices, and the ability to sustain a long project with fluid milestones. And the ideal candidate will be a thinking designer, interested in reflecting on the process of design as much as explaining it. Age and background are no issue, so long as the typographic skills and the intellectual curiosity are there.</p>
