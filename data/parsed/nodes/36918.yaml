      <p>Endre: <em>You’re right, however I’ve read in a different thread that it is focussed more or less purely on caligraphy. Is that true?</em></p>
      <p>No, that isn't a correct characterisation of the Hague programme. So of the instructors likely utilise Gerrit Noordzij's stroke theory in their approach, but that shouldn't be confused with calligraphy. I don't know very much about details of the the Hague programme, so can't speak in its favour or against it.</p>
      <p>I can, however, pretty unreservedly recommend the programme at Reading in the UK. Among other things you should note is that a remarkably high number of Reading graduates get jobs in the type business pretty immediately after graduation. Past graduates are currently employed at Adobe, Cannibal, Dalton Maag, Hoefler &amp; Frere-Jones, House Industries, Linotype, Monotype Imaging, Porchez Typofonderie, etc., and we're interviewing a couple of the current students for a job.</p>
