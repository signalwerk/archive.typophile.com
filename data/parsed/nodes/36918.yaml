      <p>Note also that the Swiss seem unwilling to let the English and the Dutch have type design education all to themselves!</p>
      <p>The Zurich College of Art and Design (now called the ZHdK) recently created a two-semester postgraduate certificate program in typeface design – <a href="http://weiterbildung.zhdk.ch/angebot.php?id=2211" title="http://weiterbildung.zhdk.ch/angebot.php?id=2211">http://weiterbildung.zhdk.ch/angebot.php?id=2211</a></p>
      <p>I don't know how far off the ground this is yet. It seems that they want to create a two-year MA program. Unlike Reading and KABK, the language of instruction in this program is German, but they explicitly state that they will accommodate French-speakers as well. I anticipate that this program may rise to become a central European juggernaut at some point. Who knows what the future will hold. There was a time when Reading and KABK were just the University of Reading and the Royal Academy of the Arts in The Hague, i.e., not yet international brand names in the niche market of higher education typeface design ;-)</p>
