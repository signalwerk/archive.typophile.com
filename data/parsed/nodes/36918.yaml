      <p>@FeeltheKern<br>
      It is hard to calculate exactly how much time is spent on calligraphic exercises during the first semester. Both Erik van Blokland and Peter Verheul cover it in their classes, but this is combined with exercises in drawing type on paper, exercises in spacing, contrast and more. These classes are not about mastering calligraphy, but about understanding the principles of type design by practicing and looking at calligraphy. I recommend looking at Gerrit Noordzij’s book ‘The Stroke’ if you want to know more about this subject. It’s widely available online, including <a class="freelinking external" href="http://www.amazon.com/Stroke-Theory-Writing-Gerrit-Noordzij/dp/0907259308" rel="nofollow">Amazon</a> and <a class="freelinking external" href="http://www.typotheque.com/books/the_stroke/" rel="nofollow">Typotheque</a>.</p>
      <p>These two classes combined take one day a week, and students can (voluntarily) attend Frank Blokland’s calligraphy classes as well. Considering the total amount of classes add up to four days a week, I’d say that calligraphy amounts to approx. 1/4 of the first semester. The second semester has virtually no classes in specific subjects.</p>
      <p>@Marilyn<br>
      Naturally, it helps when applicants have experience in designing type but it does not guarantee anything. And the same applies vice versa. Applicants need to show excellent design skills in general (a BA in a design discipine is highly recommended) with their portfolio. And next to that they need to be able to explain clearly the motivation for applying at Type &amp; Media.</p>
      <p>Portfolios and motivations can be sent by e-mail or regular mail to Jan Willem Stas, the Type &amp; Media coordinator. Or you can approach me (Paul van der Laan) or Erik van Blokland personally when you catch either one of us somewhere.</p>
      <p>Visiting the KABK Open Day on 26 January 2008 is highly recommended too.</p>
