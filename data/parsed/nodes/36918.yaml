      <p><cite>Paul, how large a written component is there in the Hague programme? At Reading, in addition to their type design projects, MA students also produce a research dissertation and a ’reflection on practice’ that documents their design process.</cite></p>
      <p>In the first semester students do a project where type history is involved and for this project a paper must be written. In the second semester – where students work on their graduation projects – they are required to document (and annotate) their design process. This project book (together with additional material required for the examinaton) must be presented at the graduation show.</p>
      <p>That being said, I do have the impression that the course in Reading puts a higher emphasis on the written part, whereas the Type &amp; Media course is more focusssed on the practical part of type design.</p>
