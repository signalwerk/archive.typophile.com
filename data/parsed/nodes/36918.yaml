      <p><em>does the Reading Program tend to favor working designers who have already designed some typefaces, or can one get in right out of an undergraduate program?</em></p>
      <p>They try to get a good variety of people at Reading, which seems to work out pretty well. Of the 14 of us graduating this year, I think only half had ever tried making a typeface before. We have a few people just out of undergrad programs, a part-time architect, and a lot of graphic designers with with different levels of experience looking to shift our careers into type design or just add it to the mix of what we do. There's almost a thirty-year age difference between the youngest and the oldest, too.</p>
