    html: |-
      <p>The Type &amp; Media course at the KABK in The Hague embraces the philosophy of ‘learning by doing’, and will very much appeal to people who are looking for a practical study. A number of tutors (Petr van Blokland, Peter Verheul, Erik van Blokland, Frank Blokland) are former students of Gerrit Noordzij and his theories about stroke and contrast are utilised in the course.</p>
      <p>The first semester is dedicated to learning the basics of type design and covers a wide variety of topics including letter sketching, Python programming, calligraphy, design philosophy, letter carving, type history and much more. The second semester is dedicated to the graduation project where students are guided individually by the tutors.</p>
      <p>The Type &amp; Media course is short, but very intense - students are required to attend the course for at least four days a week during the whole year. Next tot that visits to the Typo Berlin conference, Plantin Moretus museum in Antwerp, the Enschedé archive in Haarlem and other typographically interesting places are organised yearly.</p>
      <p>Former students of the course have found jobs in the type industry, won international awards, or have published typefaces since. For instance - Artur Schmal designed Parry for OurType, Pieter van Rosmalen runs his own CakeType foundry, Andy Clymer found a position at Hoefler &amp; Frere-Jones, Nikola Djurek designed Amalia (for OurType) and Porta (for Dutch Type Library), and Ian Party is a tutor in type design at the ECAL and runs the B&amp;P Typefoundry. Laura Meseguer won a TDC award for Rumba, as did Christina Bee for her typeface Olga.</p>
      <p>Concerning what type of students are admitted to the course, like Gerri already wrote for his course in Reading: it’s difficult to define a typical profile. Affinity, passion, sincerity, personality and skill are all important.</p>
