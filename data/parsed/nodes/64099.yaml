    <div class="info">Submitted by <a href="/user/27336" title="View user profile.">Roger S. Nelsson</a> : 10.Nov.2009 12.12pm </div>
      <p>This is not a regular newsletter with various reworked fonts, but a presentation of the first part of a large project of NEW fonts I’m working on. :)</p>
    <p>The “Geometry Pro” family has been designed to be the final word in purely geometric fonts, and this rounded “Soft” sub-family is the ultimate web 2.0 style font collection. ;)</p>
    <p></p><div class="imageWrap"><img src="/files/CheapProFonts_NEWS_09_03_450_4092.gif"></div><p></p>
    <p>Even though it is strictly geometric (as drawn with a compass and a ruler fixed to 90 and 45 degree angles) it is not slavishly modular: letters have differing widths, and the sidebearings, spacing and kerning has been finely adjusted to create smooth text.<br>
    The Soft family contains 3 weights each with 6 variants = 18 fonts + an additional FREE variant for you to enjoy!</p>
    <p>ALL fonts of course have our usual large multilingual character set.<br>
    CheapProFonts is dedicated to supplying high-quality OpenType and TrueType fonts for setting “foreign” languages (languages requiring more than the basic A-Z characters) for professional Mac and Windows users.<br>
    Check our site for constant new releases, and see you in the next newsletter!</p>
    <p>Roger S. Nelsson<br>
    —<br>
    <a href="http://www.CheapProFonts.com" title="http://www.CheapProFonts.com">http://www.CheapProFonts.com</a><br>
    High quality multilingual fonts at a low price - for professional (non-english) designers with a small budget!</p>
