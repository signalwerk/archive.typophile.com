    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Memphis</strong></p>
    <p>Classic <a href="/wiki/slab%20serif" class="freelinking" rel="nofollow">slab serif</a> typeface family, designed by <a href="/wiki/Dr.%20Rudolf%20Wolf" class="freelinking" rel="nofollow">Dr. Rudolf Wolf</a> during the early 20th century at the <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a> in Frankfurt am Main, Germany,</p>
    <p>Memphis was one of the most famous typefaces ever made available for the Linotype machine. During the mid-20th century, its design could be seen in newspapers all around the world.</p>
    <p>Today, Memphis is available in digital from from Linotype:<br>
    <a href="http://www.linotype.com/1224/memphis-family.html" title="http://www.linotype.com/1224/memphis-family.html">http://www.linotype.com/1224/memphis-family.html</a></p>
