      <p></p><div class="imageWrap"><img src="files/gap.png"></div><p></p>
      <p>The gap is the disconnection between the upper right side of the stem and the lower right side of the stem caused by the presence of the part of the outline forming the arch. Because of this gap, the top part of the stem will grid fit independently of the bottom part, which might cause misalignment at some sizes. There are two ways to address this in hinting. One is to apply the same hint structure from the left side of the stem to both point A and point B, as shown in this example. The other way to do it, an what I usually do in a case like this, is to apply a non-rounding horizontal hint from point A to point B, indicating that these two points should always be aligned.</p>
