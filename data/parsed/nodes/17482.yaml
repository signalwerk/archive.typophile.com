      <p>You could. In this case (Times UC ‘B’), points B and C are designed to vertically align (afaik), hence one way is as good as the other. That said, linking from B to C, as opposed to linking from A to C, may have a slight code size advantage (i.e. the resulting font file will be about 1 or 2 bytes shorter. This may add up eventually, which may or may not be important to you). The advantage comes from when you start using CVTs to control the weight of the stem: only the link from A to B needs a cvt number, the one from B to C won’t, and hence the savings. If, instead, you were to link from A to C, you’d need that same cvt number again, to make sure the upper portion of the vertical stem is controlled in much the same way as the lower portion.</p>
      <p>The situation is somewhat different at the bottom or at the top of the ‘B’. Again, you may wish to control the weight of the serif and the weight of the horizontal stroke using a cvt number. But now we’re controlling two different features (a serif and a stroke), as opposed to two different portions of the same feature. It would make sense therefore to link from the bottom of the glyph to the top of the serif and separately to the top of the stroke, using separate cvt numbers. In the illustration it looks like the two features have the same width, but this is merely a result of displaying what the glyph looks like at a small size and at low resolution, at which point the two features have the same minimal width of 1 pixel.</p>
      <p>The real problem is that when we look at a glyph like that, we can readily <em>see</em> the stems and strokes. However, these stems and strokes are sometimes made up of several “pieces of outline” with gaps inbetween. These pieces are not tied to one another until we link and interpolate them for that purpose.</p>
