    html: <p>The idea of ‘Example-Based Hinting of True Type fonts’ is that rather than having to manually hint every new font you can algorithmically apply hints from one font to another. Generally this has not been possible to copy hints from one glyph to another, let alone across fonts, unless the glyphs have identical point structures. What Geraldine and her collaborators were doing, if I remember correctly, is analysing what Peter Enneson would call role architecture to determine the corresponding sets of points in non-equivalent structures. In other words, the hint copying tool would identify e.g. the top of the bowl in two lowercase b letters, even if the point numbering in that region of the glyphs was totally different. This enabled them to copy the hints from one font to another. Obviously that isn’t the end of the job, but it is a big time saver. Some of the same analysis would presumably be useful in building an autohinter.</p>
