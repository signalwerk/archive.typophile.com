    html: |-
      <p>posting on behalf of Beat Stamm</p>
      <p>When the two other control points somehow are not rather directly “connected” to the linked ones, then one might call this a gap.</p>
      <p>Take e.g. a Verdana UC ‘E’, control points 0, 11, 8, 7, 4, and 3. They’re all designed to be at the same x-coordinate, but there is some kind of a gap between points 11 and 8, and between 7 and 4. (Likewise with the gap on the TNR lc ‘n’ where the arch joins the left stem, between points 28 and 0)</p>
      <p>Now, back to the Verdana ‘E’, if only points 0 and 3 are controlled in x (linked, interpolated, etc.), then it’s up to the rasterizer what happens with point 8. But once all three (0, 8, and 3) are controlled, then IUP[X] will take care of the remaining points (11, 7, and 4).</p>
      <p>Beat</p>
