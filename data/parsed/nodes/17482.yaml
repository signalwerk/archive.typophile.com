      <p>“Hmmm.”<br>
      The “Gap” in the n should be a rounded “mdrp” with 0 minimum.<br>
      The Stem Gap in the B between “B” and “C” should be “alignrp”, the fastest correct inst. assuming you mirp A-B, moving the reference point to B in the process.<br>
      Has anyone written a book on this yet?</p>
