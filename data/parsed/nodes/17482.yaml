    html: <p>The ethical question is in the use of the technology, not in the nature of the technology. The use of the data in one font in whatever way is subject to the terms of the license agreement. As Beat notes, the tool in question presumes that you already have hinting source code for one font, which generally implies that you have been involved with the development of that font or, in fact, own that code. It is conceivable that hint source code might also form part of the total package of an open source font, and so might be copied to another font within the terms of the open source license.</p>
