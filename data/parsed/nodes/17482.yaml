    html: |-
      <p>“What is idea behind that? how come (allowing…..another)?”<br>
      Hint transference is done by first having  good general Font Program and Pre-Programs that’ll work for most fonts. Secondly, a “universal” CVT is used, whereby all cvt tables have the same table position, for e.g. H stem, (not to be confused with B Stamm) even though the value itself varies from font to font. These CVT values are then filled in specifically for each font, based on a measuring expedition by man or machine. With this in place, the hint monger can use preexisting character stacks, and only needs tools or brains to change the point numbers that are being referenced, in a short time achieving hinted character groups that can then be quickly debugged.</p>
      <p>“the problem how to hint the O slash”<br>
      A sadly never removed artifact of metal, discrete non-overlapping shapes like this……unless there is some change at the intersections of bar and O, this Is best solved by compositing an O and a slash :-) Hint it after the overlap is removed and join the wasting as it reaches a thousand skilled hours since 1990 to achieve what is usually an inferior result.</p>
