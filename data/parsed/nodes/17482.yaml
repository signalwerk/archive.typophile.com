    html: <p>To decide the ethical question, I’d like to point out that Doug’s tool works on the <em>source code</em> of a font. Therefore I’m tempted to relate the question to that of the source code of any other computer program. If I were in the business of hinting (a.k.a. programming) fonts, and if I had already solved the problem how to hint the O slash for font A, then I would certainly apply this solution to font B. Doug’s tool automates this process. If, on the other hand, someone thinks I shouldn’t be in the possession of the source code of font A in the first place, then they may send the lawyers.</p>
