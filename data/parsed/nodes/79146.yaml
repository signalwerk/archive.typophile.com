    <p>You are looking for a contemporary upright script family?<br>
    Lignette Script is an elegant monoline font consisting of 535 glyps, with a wide range of languages covered (including greek) and 71 beautiful ligatures – please make sure to use applications that support OpenType features. Moreover Marcus Sterz created Lignette Deco to complete the graceful look with frames and ornaments.</p>
    <p>Right now it is on special sale on MyFonts<br>
    <a href="http://new.myfonts.com/fonts/facetype/lignette/" title="http://new.myfonts.com/fonts/facetype/lignette/">http://new.myfonts.com/fonts/facetype/lignette/</a></p>
    <p>Or visit our own website<br>
    <a href="http://www.facetype.org/family/lignette" title="http://www.facetype.org/family/lignette">http://www.facetype.org/family/lignette</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ft-lignette-590-01_4097.png"></div><p></p>
