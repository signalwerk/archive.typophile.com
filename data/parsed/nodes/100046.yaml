    <p>I know the logo is probably a custom font. Correct? Or is it actually Didot or Bodoni modified?</p>
    <p>Anyway the main font I really want to know about is the sans-serif font that they have in their magazine and all over the place. It's wide and reminds me of ITC Avant Garde but then the "R" looks much different and the overall appearance is not exactly the same. What font is it?</p>
    <p>Thank you.</p>
