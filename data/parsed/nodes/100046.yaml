      <p><a class="freelinking external" href="http://typophile.com/node/95928#comment-520460" rel="nofollow">Vogue Avant-Garde</a>, custom job based on Avant-Garde by <a class="freelinking external" href="http://www.terminaldesign.com" rel="nofollow">Terminal Design</a>.<br>
      The masthead is, as you said, most probably a custom job and Didot is probably the closest you could get. You can try <a class="freelinking external" href="http://www.myfonts.com/fonts/bagraphics/italian-didot/" rel="nofollow">Italian Didot</a> or one of the <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100004" rel="nofollow">Hoefler and Frere Jones'</a>.</p>
