      <p>To all those who helped me in my quest to find further information on the 'Forma' typeface — <a href="http://for.ma/blog/?p=108" target="_blank" rel="nofollow">Thank you so much</a>.</p>
      <p>After 'some' more extensive (re)search it seems I finally found that a digitalisation / digital version of 'Forma' actually may exist. Brendel/AQBF/(EF)TypeShop/SoftMaker currently 'distribute' a typeface named 'Formula', which seems to be based on 'Forma'.</p>
      <p>Typophile.<br>
      Making the world a more beautiful place.<br>
      One typeface at a time. ;)</p>
      <p>Dav(id)</p>
