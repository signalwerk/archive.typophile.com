      <p>Claudio, Hmm, Why do I like 'Forma'? I may as well admit that I don't really 'love it to death', but first of all, it sure may be because 'Forma' also is the name of a 'Design Bureau', I am currently establishing. ;) <em>(Forma/formlos)</em> And it's also a nice alternate to the known more or less 'neutral' Sans Serif types, like Helvetica, Akzidenz Grotesk, or Univers. <em>(Quite a mixture of influences. And maybe the 'lowest common denominator' of/in all these. ;)</em></p>
      <p>Dav(id)</p>
