    html: <p>"Liana" is not an original font, as I find is true of many of the ParaType fonts. This is an old photo-type that has been called '<a href="http://www.roostertypes.com/view_fullfont.asp?catalogid=19848&amp;issingle=yes" target="_blank">Lady Dawn'</a> (Type Revivals - in FontBook), <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000079" target="_blank">Mr Lackboughs</a> in the Veer revival of the Bluemlein Collection, 'Blue Skies' in the Phil's Photo 'Homage to the Alphabet' book, 'Lady Script' (Solotype, p. 96), and also 'Lucy Script' (Intecsas/David Rakowski) as well as many other names elsewhere on the web at shareware/freeware sites. <br> <br>This may not matter to you, of course, but I think the history of this oft-revived font, which ParaType says was based on 'Lainie' of Soft Horizonts (still another alias for this script), shows how some foundries will never need to design an original font.</p>
