    <p>I've been working with a demo version of TypeTool and now I'd like to buy it, but I don't know which platform to use. The Mac demo I'm using will generate font files for Mac or PC. Does the Windows version export fonts for PC and Mac? I have a Toshiba laptop I'd like to use simply for its portability, but I want to be able to create fonts for both platforms. Anybody know anything about this?</p>
