  - id: 13533
    user: 1977
    date: 2003-10-17T20:50:00
    date_raw: 17.Oct.2003 8.50pm
    votes: null
    html: <p>I never understood why PCs can't export resource forks and stuff.  If you take a PC formatted zip disk and transfer Mac files to it and then read them on a PC, the resource fork is listed as a separate hidden folder titled resource.frk.  I don't see why something like type tool can't just do that. <br> <br>I've tried Crossfont's PC to Mac export and it didn't work for me.  The fonts were screwed when I was able to test them on the Mac.  It compresses them into an hqx or bin file which keeps the resource data intact so it should've worked.  I've only tried it the one time, so I might've missed a setting or two.</p>
    html_clean: <p>I never understood why PCs can't export resource forks and stuff.  If you take a PC formatted zip disk and transfer Mac files to it and then read them on a PC, the resource fork is listed as a separate hidden folder titled resource.frk.  I don't see why something like type tool can't just do that. <br> <br>I've tried Crossfont's PC to Mac export and it didn't work for me.  The fonts were screwed when I was able to test them on the Mac.  It compresses them into an hqx or bin file which keeps the resource data intact so it should've worked.  I've only tried it the one time, so I might've missed a setting or two.</p>
