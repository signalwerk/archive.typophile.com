    html: <p>I know bugger all about Macs, but that seems kinda reasonable. AFAIK Mac files have a "resource fork" that PC files don't have (this is where the info is in a font file). I think that PCs can't write the resource fork - so they can't generate Mac fonts. But the opposite doesn't apply. <br> <br>[This is mostly a guess...]</p>
