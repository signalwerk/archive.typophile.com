      <p>There are books that contain beautiful examples, such as John Dreyfus’s book on Van Krimpen, as well as material by Van Krimpen himself. You will probably have to go to a research library to get examples of the original letter press version. </p>
      <p>The promised revival by <a class="freelinking-external" href="http://www.dutchtypelibrary.nl/">Dutch Type Library</a> has been going on for a long time, and they have an impressive PDF of it on their site, including some optical sizes. However, they don’t seem to have released it. I have no idea why. </p>
      <p>In the original metal it was one of the most beautiful types ever. As has been commented on by an number of observers, the sloped roman was a failure in that it is rather bland and flat. The evaluation by Walter Tracy in “Letters of Credit” is fascinating, a must-read if you are interested in Van Krimpen’s work. The associated formal script type, Canceresca Bastarda, was also really beautiful. </p>
      <p>I think that it would be much more usable if DTL would create a proper companion italic, based on structurally similar designs of Van Krimpen (such as the Haarlemmer, which they have already done). </p>
      <p>I would suggest e-mailing DTL. Let us know what you find out. </p>
      <p>Once in a while Frank Blokland comes on Typophile, so maybe he’ll comment.</p>
