      <p>thanx for the dutch library. i was on that site before and was discouraged by the language, but i found that pdf and it will be of great help. i don’t think i’ll be mailing them because my focus will be on the original thirties romulus type and it’s history.</p>
      <p>i saw a couple of books by and on van krimpen, but sadly there are no libraries in my country that have books like that. i tried finding some chapters on the web (earlier i found some gerrit noordzij on the net) but no luck.</p>
      <p>i found a neat van krimpen bio by years if someone’s interested: <a class="freelinking-external" href="http://www.amethystvisions.com/portfolio/jvk_booklet_final.pdf">http://www.amethystvisions.com/portfolio/jvk_booklet_final.pdf</a></p>
      <p>if anyone knows a recognizable logotype in romulus, that would be very useful too.</p>
