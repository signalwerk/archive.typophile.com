    html: |-
      <p>@ Toby</p>
      <p>For the future:</p>
      <p>1. Create a folder<br>
      2. Do one working step<br>
      4. Save vfb in the created folder<br>
      5. Close vfb<br>
      6. Copy the folder and give it a meaningful name<br>
      7. Open the vfb contained in the copied folder<br>
      8. Do the next step</p>
      <p>Then you have not only a protocol in the end, but backup files in the most cases. And even if you have 1000 folders in the end, disc space is not expensive.</p>
      <p>Unfortunately I actually cannot help. But maybe the FontLab people can help, if you send your vfb to them.</p>
