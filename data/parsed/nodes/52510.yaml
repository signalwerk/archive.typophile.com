      <p>Craig —</p>
      <p>There are two different variants that “caption” might conjure in this context. </p>
      <p>The earlier one is the sort of alternative italic, like the one that accompanies the digital version of Fairfield (not part of the original design, BTW). This approach and nomenclature is patterned after what Matthew Carter did for some custom work for <cite>National Geographic,</cite> where he created a more open, simplified italic for their use in captions, and thus called “Caption.” (This is many years back; not currently employed.)</p>
      <p>The other variant is the small optical size that Adobe calls “caption” in its typical suite of optical variations. This is what you’re referring to, I presume.</p>
      <p>I don’t know which Will is referring to.</p>
      <p>— K.</p>
