  html: "<p>Something I’ve been thinking about the past few days and figured would spark an interesting discussion.</p>

    <p>What features / styles / etc are most important in a font family to you?  Eg, list first the ones you absolutely must have, followed by ones that you would have to think twice about buying if not present, to ones that are really nice and useful, then ones that you think are nice but probably won’t use and lastly ones you find quite useless (edit: or add your own category of use-full/less-ness)</p>

    <p>So out of this in-no-particular-order list, which features are most important?  Least important?  What other features do you find particular useful/worthless?  In principle this question is more about text faces than display faces.</p>

    <ul>

    <li>italic</li>

    <li>reverse italic</li>

    <li>upright italic</li>

    <li>&gt;1 italic angle</li>

    <li>bold</li>

    <li>&gt;2 weights (light demi extra)</li>

    <li>reverse italic</li>

    <li>small caps</li>

    <li>multiple scripts (if so which)</li>

    <li>extra ligatures</li>

    <li>double struck</li>

    <li>outline/contour</li>

    <li>hinting</li>

    <li>arrows</li>

    <li>dingbats</li>

    <li>math symbols</li>

    <li>other symbols</li>

    <li>super-/subscript numbers</li>

    <li>super/sub-script letters</li>

    <li>script-script numbers/letters</li>

    <li>language-specific glyphs</li>

    </ul>

    <p>Edit: some other potential categories to fill in</p>

    <ul>

    <li>bold italic</li>

    <li>caption/text/display variants</li>

    <li>serif/sans in same family</li>

    </ul>

    <p>Also, to which extent should any of these glyphs (scripts / small caps) be spread out across the weights and inclines?</p>

