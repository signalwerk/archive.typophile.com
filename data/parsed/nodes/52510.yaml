      <p><cite>By “&gt;1 italic angle” do you mean (1) there is a font with an italic angle, and it is greater than one, or (2) there are multiple italic fonts, with different angles? Which ligatures do you consider basic, that “extra ligatures” are an addition to? By “hinting” do you mean that the alternative is an unhinted font? What the heck are “script-script numbers/letters”?</cite></p>
      <p>&gt;1 italic angle I meant having two or more distinct angles (say, 10 and 20º).  Basic ligatures would be the ones that more easily slide into the background like fi that correct for potential collisions etc, with the “extra” ones being of the more flashy ct/it/st style.  script-script would be a superscript to a superscript optimized form (some of the things I threw in the list like script-script, reverse italic and such I knew had very specific uses but I figured I’d open the field up as wide as I could).</p>
      <p>And re hinting, by including hinting I mean a designer going beyond what any font program’s autohint would provide.</p>
