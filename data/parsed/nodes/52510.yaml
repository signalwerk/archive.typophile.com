      <p><cite>It is interesting that this topic comes up just a few days after a topic has been started about type specimens</cite></p>
      <p>Actually, it was the other long long running thread(s) about what people want in licenses that inspired this (I didn’t see the specimen thread until just now).   After seeing what people wanted from a licensing perspective I figured I’d be interesting to see what people wanted from a design perspective.  Charles makes a good point that a font needs to be user-editable, and while that works well if you need a letter or two that’s not been doing or you need to make a customized letter that’s not otherwise expected or something, I don’t think most (any) people would take the default Times they get on their Mac and rework it to add in a full range of small caps and sub/superscript letters... that could be a week or two of work which ultimately makes it cheaper to just get a font that already has it.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
