      <p>I do often choose to add fonts to our type library based on the features they may include. That’s because I’m lazier than Charles and have never learned any of the font editing tools. So since modification is not an option for me, I must find types that have what I want. I have rejected some very nice faces because the font set lacked certain features.</p>
      <p>So my basic features list will include roman and italic small caps; true-drawn superior figures; a full range of f ligs (given all the work we do about Norway, I really need that fj lig for fjords); and good set of made fractions, along with all the elements to create piece fractions that match the made ones.</p>
      <p>I don’t want a bold, but I do want a medium, or a semibold or demibold, depending on what it is called and its color. I’d like the features listed above to be present in the medium also.</p>
      <p>I’m drawn toward the idea of a matching sans, but it is not of utter importance.</p>
      <p>I’ve never been interested in this critter known as the “caption” variant. I seem to do OK with italic or sans for captions. Old-school, I guess.</p>
      <p>True-drawn superior letters will be nice also.</p>
      <p>Given the nature of the work I have done, do now, and will likely do in the future, that about fills my needs.</p>
      <p>It is interesting that this topic comes up just a few days after a topic has been started about type specimens: <a href="http://typophile.com/node/52442" title="http://typophile.com/node/52442">http://typophile.com/node/52442</a>. It is a well-made specimen that allows us to see just what lives inside a font, and thus whether or not we should get a license for that font.</p>
      <p>powers</p>
