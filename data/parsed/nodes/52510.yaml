      <p>Here are my thoughts, based on the sort of books I’m used to working on.</p>
      <p>Essential (I won’t ordinarily pick a text face without them):<br>
      - italic<br>
      - small caps<br>
      - basic math symbols (the ones in MacRoman at minimum)<br>
      - semibold, or a bold that isn’t too heavy</p>
      <p>Very important (a text face with them is much more likely to be considered):<br>
      - multiple scripts (Polytonic Greek, Cyrillic): I regularly need polytonic Greek for the books I set; Cyrillic I don’t really use as much as Hebrew or Arabic, but Greek and Cyrillic are different in that their designs typically have enough relation to the Latin that the visual dissonance when they aren’t quite coordinated is unpleasant<br>
      - hinting<br>
      - super-/subscript numerals<br>
      - language-specific glyphs: either lots of them or, as Charles suggests, easy permission to modify the font<br>
      - multiple cuts (e.g. caption/text/display): most of the things I set have footnotes, and a page really does look better if the chapter head, the text, and the footnotes are not all generated from the same outlines<br>
      - extra ligatures: it depends on the meaning of “extra”; I’m assuming you mean anything beyond f_i and f_l</p>
      <p>Nice and useful (will be considered but probably not the deciding factor):<br>
      - super-/subscript letters<br>
      - &gt;2 weights<br>
      - arrows<br>
      - additional math symbols and other symbols</p>
      <p>The rest may be nice but not terribly useful to me; the only ones I would pick out as being really useless for me are reverse italic and upright italic. The multiple cuts need to be available for all the scripts; I’ve had Greek show up everywhere from footnotes to chapter heads. I can live without a regular-italic distinction for Greek, if the regular is fairly calligraphic.</p>
    html_clean: |-
