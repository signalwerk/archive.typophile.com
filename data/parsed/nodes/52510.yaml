      <p>Oddly enough, the most important feature for me is that it be relatively easy to obtain permission to modify the font. Modifications I’ll make would be (1) to add characters, esp. easy-to-create ones such as glyphs with diacriticals, extra ligatures, true-cut superiors, etc., and (2) to add or modify features, usually just to include the extra characters just made up — such as “extra” (but functional) ligatures (fb, fk, fh, f-with-accented vowels, etc.), angle brackets to swap out the greater &amp; less symbol when the text includes &lt; http &gt;, and on &amp; on.</p>
      <p>I don’t think it is possible for the font designer to include everything that will come up, and a text interior designer often doesn’t take into account what a font has before specifying it. The comp gets stuck with setting the text, and it is just easier to make the changes in the font than to make them in the file.</p>
      <p>Most text designers I know (which includes me) don’t purchase a font because of it’s features, we select it because we like it, or sometimes just because it fills a need. We might, with reluctance, rule it out because it lacks needed features or characters. Big things that might rule out a purchase (rather than a use for a particular title), include the lack of an italic, roman small caps, and both old-style and lining numbers. Most of the many other things needed can be filled out by someone who has only workman-like skill.</p>
