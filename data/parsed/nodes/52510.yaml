      <p>By “&gt;1 italic angle” do you mean (1) there is a font with an italic angle, and it is greater than one, or (2) there are multiple italic fonts, with different angles? Which ligatures do you consider basic, that “extra ligatures” are an addition to? By “hinting” do you mean that the alternative is an unhinted font? What the heck are “script-script numbers/letters”?</p>
      <p>That aside, here is a first take at some answers, from my personal POV as an end user of type, rather than as a type designer (nor in terms of Adobe’s priorities):</p>
      <p>Features should be present in all weight and inclines unless they really make no sense in that font.</p>
      <p>Must have:<br>
      - italic<br>
      - bold<br>
      - hinting</p>
      <p>Unlikely to buy without:<br>
      - small caps</p>
      <p>Really nice, useful:<br>
      - &gt;2 weights<br>
      - extra ligatures<br>
      - super/subscript numbers<br>
      - super/subscript letters</p>
      <p>Nice but won’t use much:<br>
      - upright italic<br>
      - arrows<br>
      - dingbats<br>
      - math symbols<br>
      - other symbols<br>
      - multiple scripts</p>
      <p>Not much use to me personally:<br>
      - language-specific glyphs</p>
      <p>Just plain silly:<br>
      - reverse italic<br>
      - double struck</p>
