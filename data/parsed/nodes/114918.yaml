    html: |-
      <p>Hi Ryuk, I also like the two Ronaldson based types as good similars to the serif.  I have admired the Canada Type version since it was first published. Some tinkering, such the addition of a Cheltenham style spur on the G would make it even closer.<br>
      Perhaps someone else has seen a digital font with the an italic R with a similar swoosh shaped leg?<br>
      Don</p>
