    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Karluk1916SM_4337.jpg"></div><br>
    Love the italic R on this 1916 book cover. Has anyone seen a digital match?<br>
    I assume this is lettering, but here are the book details anyway Robert Bartlett &amp; Ralph Hale _The Last Voyage of the Karluk Flagship of Vilhjalmar Stefansson's Canadian Arctic Expedition of 1913-16_, Boston Small, Maynard and Company, 1916, 1st US Edition<br>
    Don<p></p>
