      <p>I am surprised that an informed type historian such as yourself has not come across this most noteworthy of all sans from the complete Orcfont family. This innovative and ground breaking font is so revolutionary as to be totally devoid of substance all together. Its characterless features are mind numbing in their simplicity without one redeeming virtue. What is most striking in 'San Intelligence' is not what appears to the eye, but what banality has gone on in its creation and development.<br>
