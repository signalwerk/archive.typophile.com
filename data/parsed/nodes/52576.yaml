    <p>I heart trolls as much as the next bloke. The blighters add a level of entertainment and fun to the forum, and I’ve occasionally engaged in troll-baiting and border-line trollish behavior.  </p>
    <p>What unsettles me is when a troll takes on a fake ethnicity/geo-location, and proceeds to negatively exploit national/racial stereotypes. Does anyone else have a problem with that? Or is that just the way of the Web?</p>
