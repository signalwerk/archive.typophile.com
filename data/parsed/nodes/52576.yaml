      <p>As far as the ethnicity issue, I would mention that I recently fed a troll a Borat flavored morsel. I really see a similarity. I guess there are those that treat a board as a holy receptacle of knowledge where no sideways comments or anything that does not explicitly contribute to the discussion should be tolerated. Personally, I believe a well crafted digression can be a welcome contribution.</p>
