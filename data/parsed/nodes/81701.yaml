    <p>Hi everyone,</p>
    <p>I've red at multiple places that the <strong>font rendering on Mac OS-X should be the same on every browsers</strong>.</p>
    <blockquote cite="http://blog.typekit.com/2010/10/21/type-rendering-web-browsers/"><p>
    Mac OS X Browsers, </p>
    <p>We’ll kick this off the easy way. On a Mac, all web browsers use Core Text – the system default text rendering engine – and OS font smoothing settings. There are no browser preferences that affect the way type is anti-aliased. So, on a Mac, type looks the same no matter which browser you use.
    </p></blockquote>
    <p><a href="http://blog.typekit.com/2010/10/21/type-rendering-web-browsers/" rel="nofollow">Source : Typekit blog"</a></p>
    <p>Well, my personal tests didn't approve these results and I wanted to understand why.</p>
    <p>I've tested 2 web fonts : <em>Arial</em> and <em>FF Meta Serif Web Pro</em>, both at small paragraph size : 11px.</p>
    <p>Here is a sum-up of my <a href="http://cl.ly/6L9M" rel="nofollow">test results</a>.</p>
    <p>Whereas my rendering test only concerns OS-X, <em>Arial</em> looks different on Firefox 4, could someone explain me why ?</p>
    <p><em>FF Meta Serif Web Pro</em> looks different on Firefox4 / Chrome / Safari-Opera.</p>
    <p>Does the rendering differences concern the Hinting which is not equally applied by all browsers ?</p>
    <p>If the browsers layout-rendering engine rely on the OS rendering engine, where did the differences come from ?</p>
    <p>Thanks for your feedback :)</p>
