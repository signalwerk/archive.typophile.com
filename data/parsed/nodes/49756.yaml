      <p>I don't like the shield version because it's too wide compared to its height. Shields were normally differently dimensioned.</p>
      <p>Some sure things:<br>
      1. Don't pursue any more in the #1 and #2<br>
      2. Use the simple helmet as in the rest of logos.</p>
      <p>The only concern I have is that this symbol has been used many times. It depends how wide is this trademark going to be seen.</p>
      <p>My gut tells me to go with #3 with minor changes: Top of the symbol continues the light square. I'd make it rounded as the symbol goes. It looks very nice and strong. Type goes well with it and it will be capable of small size applications. But I don't know how are you going to make a BW version of it.</p>
      <p>___________<br>
      <em>Robert Koritnik</em></p>
