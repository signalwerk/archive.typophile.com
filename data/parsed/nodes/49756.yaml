    <p>First off, I would like to thanks all of you who have participated in my previous post for Centinella logo. This is the following up post. The world "Centinela" means "guard", client like a shield or perhaps a symbol to protrait trust, confident. So I stick with 2 of my old design (I know some of you did not like them) and made a new one out of a trojan head. I have one more version that I'm working on and I will post on here as soon as I finish. So here it is agian. Thanks you guys.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/centinela_2_6476.jpg"></div><p></p>
