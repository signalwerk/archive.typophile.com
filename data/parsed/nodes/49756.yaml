      <p>yes. lose the gloss/chrome looks - they're not adding anything.</p>
      <p>The centurian is a nice direction but I don't think it's working quite as well as it could. Its placement in the box/diamond isn't great. The first one seems to have a slight rotation upward which in my impression doesn't create the authoritarian pose it 'should' ... i.e, not much confidence. The diamond version doesn't work at all in my opinion, but the idea is nice.</p>
      <p>I don't mind the first one, but it didn't work in one colour from memory. Also ... if it's a shield, does the idea of the shield having been pierced by a sharp object create any unwanted stories?</p>
      <p>Forget the second one.</p>
