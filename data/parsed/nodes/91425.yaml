    html: |-
      <p>I'm not sure about this one, although in general I'm a huge fan of Jeremy's work and think he is consistently interesting and creative in how he thinks about letters. I understand what he is doing in Fenland, but it seems to be unevenly successful: some letters look great as a result of the system he has applied, but others seem to me awkward; some look like novel constructions of real strength while others look like distressed letters (in part, I suspect, because they end up reminiscent of postmodernist experiments of the 1990s; this is especially the case with B D E). The construction of the N  obliges this to become a very wide letter: the first thing that jumped out at me about the design.</p>
      <p>Overall, I think the lowercase is more successful than the caps, with which they don't seem to combine very naturally. I can't help feeling that the lowercase would work better alongside more 'normal' caps that don't draw so much stylistic attention to themselves. Or maybe the family would benefit from a distinction between display caps and text caps.</p>
      <p>Lowercase v w x y seem to me awkward and, like the caps, not entirely in keeping with the rest of the lowercase. They give the appearance of needing to be strangely constructed in order to fit with the programme, instead of having a shape that balances well with the other letters. The thought I'm left with is that systematic programmes of 'norm violation'—to use Peter Enneson's phrase in a situation in which I think it is particularly useful—need to be flexible when applied to letters whose inherited construction is itself outside of the norms of the rest of the alphabet.</p>
