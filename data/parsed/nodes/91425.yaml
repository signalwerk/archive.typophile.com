    html: |-
      <p>I think it is 'awesome' that people are thinking about how to create viable letterforms whose edge-to-edge relationships are other than those derived from writing tools, and are trying to do so in systematic ways that apply across entire typefaces. I don't think all the results are awesome, but I appreciate the thoughtful approach to this question in type design, and I think the results tell us important things even when, as in the case of Fenland, I don't personally think the results are wholly successful. Fenland seems to me to demonstrate the limits of systematic programmes—or at least of this systematic programme—, particularly with regard to certain letters. Among other thoughts, this is going to send me back to look at Legato to examine more closely how Evert adapted his own systematic approach to the letters comprised of diagonal strokes.</p>
      <p>I also think it is awesome, in the full sense of the word, that Hrant and Nick agree about something.</p>
