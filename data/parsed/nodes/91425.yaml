      <p><cite>But why is it awesome that he (quite skilfully) created letters that cannot be drawn with the pen?</cite></p>
      <p>One should mention that this typeface, though it's apparent divorce from conventional structure, still has a strong chirographic affinity. The ductual logic is just reversed.</p>
      <p><img src="http://www.fileden.com/files/2012/2/9/3262384/no.jpg" width="500" height="316"></p>
      <p>There are places where the designer deviates from this system, as can be seen in the circled area, at joints. Certainly, this is consciously designed to avoid black spots, and for that: "chapeau!".</p>
      <p>What bothers me is that, on the other hand, there are letters that seem not to follow any system at all (e.g. /t/, /N/), which was John's point. This is why I personally don't regard this as a very successful design, and also why I doubt Jeremy was concerned with notan (at all) as Evert was when designing Legato. What I like is what also John has already expressed best: I look at Fenland as an eye-opening way of thinking; inciting designers to assent to other kind of shapes different from those derived from the humanist hand.</p>
