      <p>'Systematically structured' is one of the adjectival phrases in the Fenland specimen, and perhaps the one I picked up on instinctively. Jeremy's list of 'further reading references is also instructive, citing both modernist texts and examples of prior efforts at systematic programmes in type design, notably Excoffon's Antique Olive.</p>
      <p>It is not that I am putting so much store on systemic consistency, but that it seems to me that Jeremy has, and I think sometimes too much, to the detriment of some letters and the relationship between the upper- and lowercase alphabets.</p>
