      <p>As JT says on his site: “The modern shapes are constructed and balanced to remove the adherence to the pen-written or calligraphic model. Yet still provide an alphabet that maintains a lively pattern when set in continuous text.”<br>
      (And, “The visual uniqueness of Fenland becomes apparent when it is seen at large sizes”.)</p>
      <p>That’s all that can be said, other than post facto rationizations.<br>
      I would imagine that he began with a vague idea of how an effect might be applied, in design and style, to the alphabet, according to the concept of divergent outlines, and then worked out what that would look like by a proceess of glyph-drawing. Trial and error, adapting each individual glyph to theme and sub-theme en masse, and redefining the themes too, in feedback loops. The hands-on practicality of a looping process that involves so much drawing would see to it that any “system” that emerged would have its inconsistencies.</p>
      <p>But why put so much store on systemic consistency? Beyond the initial concept, type design is an agglomeration of “cheats” to counteract various optical effects.</p>
