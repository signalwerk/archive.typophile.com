      <p>Ryan: <em>We have had hundreds of years of calligraphic inspired letters. Is there really that much left to explore in the genre? Seems to me that in order to make true progress we must leave the pen behind.</em></p>
      <p>Or, alternatively, pick up the pen again (or some other tool). Noordzij makes this point in <em>Types Best Remembers / Types Best Forgotten</em>: the freezing of letters in their typographic norms that took place in the second half of the 15th Century is an anomaly in the history of writing, in which the invention and proliferation of new styles is the norm.</p>
      <p>I'm interested in both approaches: how to design convincing types freed from tool derived models and the invention of new tool derived models. Oh yes, and after all these years I am also still interested in the old tool derived models.</p>
