      <p>I really like the concept! Glad to see someone stick their neck out a bit and design something with guts.<br>
      I have tried some of those things and know how both exciting and maddening it can be.  I will have to give it a while to simmer before I can comment because you need to realign your habitual vision a bit to be fair.<br>
      I am really rooting for Jeremy on this one!<br>
      At the moment, the counterforms seem to need to be pushed more in opposition to the norm to solidify the vision that this is a purposive departure.  I am sure Jeremy will get [and has gotten] plenty of notes of caution and requests to keep closer to traditional models. I hope he ignores all of it and follows his own vision.<br>
      He mentions abandoning pen based forms as a starting point. This is a good way to try to see the pure form without diluting it with tradition. That does not mean that I think "THe Pen" is wrong or even to be avoided.  It means to me that I prefer not to either reject totally or embrace totally any means.  To me, it means letting go of preconditioned axioms and having a visual dialogue with the forms in front of you and letting them each speak their own form of diction. Calligraphy has its own form of diction which has hundreds of years of evolution.  That does not mean it is either good or bad.  It is like the difference between French and German diction.  Neither one is wrong and neither one is right.  Each is a working system that differing peoples have arrived upon.  There is no need to stop looking for new diction as befits our current time.  The generations before us did not stop, nor should we.<br>
      You go Jeremy! Take your own Pinta, Niña,and Santa Maria to the New World!</p>
