      <p>"Lowercase v w x y seem to me awkward and..."</p>
      <p>I actually quite like the y and the v.  There are some brilliant moments here, for sure.<br>
      I think what put me off is that at book-size point sizes, it really looks just like a plain old regular sans.  You would have to look closely to notice anything was new or different about it.  Of course that probably wouldnt be said of the people who post here, as they are so intune with fonts and letters.  But I would think almost anyone else wouldn't even notice there was something new or unusual about this font at 10 point, and there is nothing that waves a flag and says, "come on, look closer."</p>
      <p>"But why is it awesome that he (quite skilfully) created letters that cannot be drawn with the pen?"</p>
      <p>Well now this is the future of fonts of course.  We have had hundreds of years of calligraphic inspired letters.  Is there really that much left to explore in the genre?  Seems to me that in order to make true progress we must leave the pen behind.</p>
      <p>"The hands-on practicality of a looping process that involves so much drawing would see to it that any “system” that emerged would have its inconsistencies."</p>
      <p>Yes. This makes me really want to start exploring Python with Fontlab.  It would be very interesting to design a system purely in code and have it tackle the letter shapes.  A font created 100% from the command line.  Very interesting, indeed.</p>
