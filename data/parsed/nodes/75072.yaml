    <p></p><div class="imageWrap"><img src="http://typophile.com/files/N!G_poster_01_mini_6678.jpg"></div><br>
    Retro-futuristic unicase with alternates and ligatures, specially designed for magazine headlines and cheerful logos.<br>
    Inspired by the art deco geometry and late 2000s trends in graphic design. Works well as text pattern.<br>
    It is better suited for large type sizes.<p></p>
