    html: |-
      <p>when creating PDFs, you are really emulating the print drivers.</p>
      <p>Web sites, when printed, aren't usually designed to look the same as they do on screen. This can be a good thing when done properly, afterall, screen and print are different mediums.</p>
      <p>By default, you won't see background colors or background images when printing a web site (to PDF or otherwise). If the web developer/designer so chooses, they can even completely redesign the layout for printing and that happens automatically when you print/convert to PDF.</p>
      <p>If what you want is a PDF of what it looks like EXACTLY on screen, then you need to do a screen shot. Note that you will no longer have a text-indexable PDF, though...if that is a concern.</p>
