    <p>Does anyone know how to convert a webpage into a pdf using the "create pdf from website" option in adobe acrobat. </p>
    <p>I tried saving it multiple times using various settings, but each time..the images and type did not stay in the webpage layout on the pdf. </p>
    <p>Any suggestions?  The links don't need to work or go to any other levels.<br>
    I could just simply take a screen shot and do all that stuff...but now this option has got me curious!</p>
    <p>If anyone could help I would appreciate it! Thank you :) </p>
    <p>-Cat</p>
