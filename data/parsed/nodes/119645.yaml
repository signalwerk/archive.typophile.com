    <p>Hi all!</p>
    <p>Im working in a project that uses FF DIN Pro in their identity logo lockup. They are going international and looking to translate their name onto different languages (Hebrew included). I can't find an Hebrew version of FF DIN Pro (or any other DIN). Im facing with the decision of finding an alternate typeface that could accommodate my needs. Please send help!</p>
