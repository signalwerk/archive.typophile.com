    <p>And one more MoG question. This regards the publisher's name on the cover of a 1946 volume. It looks a little like <a class="freelinking external" href="http://www.linotype.com/86761/AmericanaStdRoman-product.html" rel="nofollow">Americana Std</a>, but the G, for instance, is different.</p>
    <p>Thomas</p>
