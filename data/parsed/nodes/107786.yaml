    html: |-
      <p>Thanks George for spotting the Inland source.<br>
      Jaspert's _Type Encylopaedia (1970) shows Latin Antique from Monotype but the letters are narrower. It also mentions Stephenson Blake as a producer of the font.<br>
      So the1946 publication could well have used the BB&amp;S type inherited from Inland.<br>
      Latin Antique was in the 1897 and 1907 Inland catalog. Poster Latin Antique disappeared between the 1897 and 1907 catalog. I can't see much difference:<br>
      Here is Poster Latin Antique:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/PosterLatinAntique24ptInland1897_4472.jpg"></div><br>
      Here is Latin Antique:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/LatinAntique24ptInland1897_4048.jpg"></div><br>
      I agree that there is no digital version of the Inland design.<br>
      Don<p></p>
