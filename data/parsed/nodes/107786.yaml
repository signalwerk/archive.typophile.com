    html: <p>The font is Latin Antique, shown in Inland 1907 and later in BB&amp;S. DeVroye also has a page on his site from Inland showing the name as Poster Latin Antique but I don't know the date of his source. McGrew says Stephenson Blake also had a version available in the 50s/60s. A quick search did not turn up a digital version.</p>
