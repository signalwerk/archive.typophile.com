    <p>KICKOFF</p>
    <p><a href="http://en.wikipedia.org/wiki/Century_Gothic" rel="nofollow">Century Gothic</a></p>
    <p>Now is for real. No more 'friendlies' where points are not at stake and may bore the audience. What do you think or bet will survive and get to the finals?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/groups_4754.gif"></div><p></p>
    <p>Feel free to add your bet or hopes. Just add a related or unrelated font if you will.<br>
    As I write this it is 4 hours and 12 minutes to the kick off...</p>
