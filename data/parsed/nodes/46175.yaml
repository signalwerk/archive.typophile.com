      <p><cite>Spain 4 - 0 Russia had a lot of gols, Oléeee!</cite></p>
      <p>You mean Spain 4 - 1 Russia. So that's even more goals. Spain were mighty impressive, but one does feel bad about Russia having to play without Arshavin (suspended for first two matches) and Pogrebnyak (out injured), two of their best players who guided Zenit St. Petersburg to the UEFA Cup title.</p>
      <p>Russia have struggled internationally since the former Soviet teams all went their separate ways (with a few exceptions like Lev Yashin, most former Soviet stars were non-Russian), but I thought that for once they had a genuine pool of talent. I guess the only Cyrillic users among the Euro 2008 participants are too young and inexperienced. With Greece struggling as well, it's back to Latin-alphabet dominance in the European Championships.</p>
      <p>Pop quiz: when were the two times that a non-Latin-alphabet-using team won the European Championships?</p>
