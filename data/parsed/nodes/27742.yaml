      <p>I used the term 'scaleable grid' in an effort to succinctly express the idea of the em as the subset of the grid that is scaled during type sizing, but I agree that it is unclear and I tried to compress the idea too much.</p>
      <p><em>...and this “definition” says the glyphs are plotted on the UPM.</em></p>
      <p>No it doesn't. It says that UPM defines the number of units of a grid that is scaleable, and that the glyphs are plotted on that grid.</p>
      <p>At some point in this discussion, we might come to the conclusion that not everything can be given a definition that is different from a complex description, or that a more succinct definition isn't actually useful.</p>
