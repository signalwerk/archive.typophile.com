      <p>Nick, </p>
      <p>the built-in linespace of a font has nothing to do with em. </p>
      <p>The em is otherwise called UPM size and is always equal to the point size. In a typical Type 1 font, the UPM size, or the em, is 1000 units. When the font is used to set type, the em, i.e. the 1000 units, are scaled to the desired point size. This means that at 10 pt type, the 1000 font units are scaled to 10 pt. So if your uppercase H is 700 units high, it will be 7 pt high at 10 pt type. </p>
      <p>The built-in linespace of a font (linespace without extra leading) is typically the difference between Ascender and Descender. If the Ascender happens to be 750 and the Descender happens to be -250, then the built-in linespace is indeed 1000 units, so it corresponds to the em. But if the Ascender is 800 and the Descender is -300, the built-in linespace is 1100, so it’s 110% of the em, or 11 pt when 10 pt type is set. </p>
      <p>I’m sure you noticed that when you set different fonts at 10 pt in some applications, they get different default linespacing. They wouldn’t if the built-in linespacing were always equal to em. </p>
      <p>In OpenType and TrueType fonts, there are three different Ascenders and Descenders. Different applications and operating systems use different of these values. In Type 1 fonts, there just one such pair of values. But this is a technical detail in the context here. </p>
      <p>Some applications don’t use the font-internal Ascender and Descender values at all to determine linespacing but use point sizes instead. Indeed, 10/14 pt type will always mean 10 pt type set of 14 pt linespace. But a “120% leading” may mean either 120% of the point size (120% * 10 pt = 12 pt) or 120% of the default linespace of the font (which may be, as I said, 10 pt or 11 pt or anything else). </p>
      <p>Bringhurst is right and correct: “The em is a sliding measure. One em is a distance equal to the type size. In 6 point type, an em is 6 points; in 12 point type an em is 12 points and in 60 point type an em is 60 points.” </p>
      <p>This is not true: “An em [...] is defined in the terms of a specific typeface, and thus varies in length.” For each typeface set at 10 pt, the em will be always 10 pt. </p>
      <p>This is specifically NOT true: “An em is the width of the cap height.” The size of characters set at a specific point size (e.g. 10 pt) using different typefaces will be different. In many text typefaces used today, the height of the uppercase H equals 70% of the em, but that figure is only a convention and may differ between font vendors and between specific typeface styles. For example, in a font like Zapfino, the uppercase H is significantly smaller than 70% of the em. </p>
      <p>As I explained earlier, this is completely wrong: “This vertical space represents the distance the typesetting system will move when the next line below is located with no extra ‘leading’ between the lines of text.” In some typesetting systems, the linespacing is based on values relative to the point sizes (that is, to the em), while on other systems, it is based on various Ascender and Descender values embedded in the font, which do not have any relation to the em. They may, but only by convention of specific font vendors. </p>
      <p>Another issue is the issue of em space and em dash. </p>
      <p>The Unicode standard has a code U+2003 that stands for EM SPACE. This character should nominally have the width equal to the em (i.e. to the UPM size) — typically 1000 units. However, the type designer may include a glyph of any width there, and some designers feel that an em space should be actually a bit narrower than the full em. On the other hand, some applications may enforce the width of the character U+2003 to be equal to em, and may not use the uni2003 glyph from the font at all.</p>
      <p>Similarly, U+2014 is the character EM DASH. Traditionally, it was supposed to be a dash that takes the full length of an em, with no sidebearings. However, some type designers prefer to make the em dash a bit shorter and include some sidebearings. </p>
      <p>Regards,<br>
      Adam</p>
