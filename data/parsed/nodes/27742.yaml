      <p>John: "UPM = the number of units that define the height of the scaleable Cartesian grid on which the outline of glyphs in a font are plotted."<br>
      ...sounds utterly reasonable but it is utterly wrong because the em is a subset of the "grid" and this "definition" says the glyphs are plotted on the UPM.</p>
      <p>The Grid, is 16k something square defined in TT. If you make your EM 256 x 256, you can hang out "a lot". If you make your grid 16,000-somethingX2, you can't hangout at all. That's how that works, that's how that is defined.</p>
      <p>Without defining the relationship between the EM and the composition systems, you have no definition for The Em, or the subset of the grid that is defined by upm. Because we have a "definition" for "an em", some people think they know how to define the em back from that, which wrong, or at least it don't work in composition in several ways. </p>
      <p>If you read this, John:<br>
      <a href="http://www.microsoft.com/typography/OTSPEC/TTCH01.htm" title="http://www.microsoft.com/typography/OTSPEC/TTCH01.htm">http://www.microsoft.com/typography/OTSPEC/TTCH01.htm</a><br>
      It gives "my" definition of the em, nearly exactly. Now I'm not sayin' they're always right...</p>
