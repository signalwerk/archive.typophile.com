      <p>David, </p>
      <p>I think I now understand your point of making the difference between "an em" and "the em". Now, I think in the age of digital typography, or even in the time of fototypesetting, it was and is futile to try to link the em to any VERTICAL measure. The em should only relate to HORIZONTAL measures. Relating em spaces, half ems, quad ems etc. to point sizes makes sense, because that is the only reliable measurement that works across fonts and applications. Even with Microsoft's relative point sizes, and Quark's point switchable between "traditional" and "digital", 10 pt is always 10 pt on the same screen, or in the same publication. So a 10 pt em is always a 10 pt em, and a half em is always 1/2 of the em. </p>
      <p>On the other hand, vertical linespacing is just a mess. If creators of font formats were smart back in the 1980s, they would have only created one important measurement: the position of the baseline (on the em). If the em were 1000 units and the baseline were 250, then the ascender would be automatically implied to be 750 and the descender would be -250. And we would have the same reliable, "physically tangible" linespacing that we did in wood and metal. </p>
      <p>But unfortunately, font format makers have gone overboard and created hhea.Ascender, hhea.Descender, OS/2.WinAscent, OS/2.WinDescent, OS/2.TypoAscender and OS/2.TypoDescender. There are five redundant values in the font, and absolutely no control over how linespacing is applied in different applications.</p>
