      <p><em>So, that makes the EM a vertical measure.</em></p>
      <p>Internally to a font, that is its function. In typesetting it is also used, perhaps more commonly, as a horizontal measure. But it is agnostic about directionality really: you can measure in ems vertically or horizontally (certainly within CSS it is used in both directions). There is no a priori reason why it shouldn't be used as a diagonal measure.</p>
