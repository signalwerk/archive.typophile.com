      <p>Buck, there are some books which attempt to pass on the knowledge of typography to the current generation. Robert Bringhurst's 'Elements of Typographic Style', James Felici's 'The Complete Manual of Typography' and Mitchell &amp; Wightman's 'Book Typography' are three excellent books in this line.  </p>
      <p>And not least, now on Typophile there are some with long experience in typography, including the hot metal era, posting with their wisdom on the topics that come up. </p>
      <p>So welcome to Typophile, and I hope you will contribute your insights on the topics that come up here. And if you feel that the books above are seriously lacking in some area, I would love to hear about it, and I'm sure others on Typophile would as well.  </p>
      <p>[There is a typo in your post, where you wrote '6 points' instead of '12' to a pica. You can correct posts using the 'edit' link.]</p>
