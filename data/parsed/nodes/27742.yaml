    html: |-
      <p>Bieler wrote:<br>
      &gt; it has less to do per se with the visual size of the represented<br>
      &gt; typeface itself, since this differed</p>
      <p>It still differs. 12 pt Zapfino uppercase H is surely of different size than 12 pt Arial’s. </p>
      <p>David wrote:<br>
      &gt; So, that makes the EM a vertical measure.</p>
      <p>Well, sure, but one that cannot be easily meaured physically. 12 pt type means that some chunk of vertical space is 12 pt high. </p>
      <p>Onto that chunk of vertical space (em), some glyphs are drawn, but their physical size can be completely arbitrary -- only by a convention of some font vendors (first of all Adobe), in most of their text typefaces, the height of flat uppercase letters (e.g. "H") is 70% of the em. </p>
      <p>When lines of text are set, the distances between chunks of vertical space (ems) differ. If the linespacing is truly equal to one em (e.g. in CSS), then the distance between two consecutive baselines is indeed one em. Some professional typesetting applications also base the linespacing on the em. Other applications use different information to determine default linespacing, most prominently the OS/2.WinAscent-OS/2.WinDescent distance on Windows, hhea.Ascender-hhea.Descender distance on Mac OS, and OS/2.TypoAscent-OS/2.TypoDescent in some Adobe applications. </p>
      <p>John, </p>
      <p>you’re right that I objected to the term "body height". Since the "body" in digital fonts is not really palpable, I prefer not to use it. How about this: </p>
      <p>In digital typography, fonts are designed on a cartesian coordinate space. Outline point positions and all metric information are measured in so-called "units". A square on that space of a specific size (usually 1000 units) is referred to as an "em". When a text is set at a particular point size, the font is scaled so that the em is equal to the point size used.</p>
