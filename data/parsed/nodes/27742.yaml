      <p>“This vertical space represents the distance the ‘typesetting system’ will move when the next line below is located with no extra ‘leading’or ‘linespacing’ between lines of text.”</p>
      <p>I really have a problem with this definition. Many modern applications simply DO NOT use the em as the measure for zero-leading linespace. Instead, it uses the distance between Ascender and Descender. This distance often is different from the em. For any given font, the em at 10 pt will always be 10 pt, but the "built-in linespace" can be 9, 9.5, 10, 10.5, 11, or 10.235 pt. </p>
      <p>The question of LineGap is a fully different one. </p>
