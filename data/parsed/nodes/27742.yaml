      <p><em>...the position of the baseline (on the em). If the em were 1000 units and the baseline were 250, then the ascender would be automatically implied to be 750 and the descender would be -250. And we would have the same reliable, “physically tangible” linespacing that we did in wood and metal.</em></p>
      <p>That's a very Latin-centric approach to font metrics. Not all scripts have the same typical arrangement that makes those figures convenient for a large number of Latin typefaces. If you tried design an Arabic naskh type on such an inflexibly defined body, you would need to make it tiny in order to squeeze the deep descenders into that 250 unit space, and would end up with gigantic white space above the letters.</p>
