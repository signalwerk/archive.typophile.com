      <p>“A typographic unit of measurement with relative, rather than absolute value. It is a vertical space which represents the distance a typesetting system moves when progressing form one line of text to the line below, without the addition of extra leading.”</p>
      <p>I actually think that "linespace" is better than "leading", because leading can refer to either the gross leading (em + extra leading) or the added leading. So in 10 on 14, the leading can be either 14 or 4. If you're going to talk about "extra" leading, you're automatically assuming that base leading = em height.</p>
      <p>So another definition:<br>
      “A typographic unit of measurement with relative, rather than absolute value, equal to the built-in linespace of a font".</p>
