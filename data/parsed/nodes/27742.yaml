      <p>I also hope you post more!</p>
      <p>This issue was raised initially by me to correct the misconception in Wikipediadom that the em square has something to do with typesetting. </p>
      <p>I was seeking to clarify what the interface between type designer and composition system is, because most trustworthy typographic intelligence in between the type designer's em and the users capabilities is, as you say, gone. </p>
      <p>So, the last solid technical bastion of typography that remains in modern systems, upon which whatever quality is to be built, is the EM SQUARE of type design. It's probably still wrong 'n wikidom, but I don't care as long as there is at least one right em in modern fonts. ;)</p>
