      <p>No, you wouldn't. I'm not saying that the type would not be allowed to shoot over or under the body. Your glyphs could go as high as 2000 units or as low as -1000 units if you wished. But the linespacing would be controlled by just one value. Note that this is in fact how it is done today in high-end applications. In Adobe InDesign, if you specify leading in points, the OS/2.TypoAscender value is only used once — to determine the distance between the top of the frame and the first baseline. Then, each consecutive baseline is simply placed at the distance specified by the linespacing set in points. For example, if you set 10/14 using a font that has OS/2.TypoAscender = 760, then the first baseline will be placed 7.6 pt below the origin of the frame, and each next frame will be offset by 14 pt. What you set as TypoDescender or TypoLineGap doesn't really matter. </p>
      <p>Of course, many applications don't allow the user to specify lienspacing in any way, or rely on some sort of "default" linespacing. Of course, it is a nice thought that the type designer can set the default linespacing for a typeface. In the world we live today, very few applications actually use the "typographically default" linespacing set by the designer, since other values (hhea or OS/2.Win) are used which are actually supposed to be used for other purposes. </p>
      <p>But even if we at some point arrive at the point that all applications use the OS/2.Typo information (at least in the fonts with the OS/2.fsSelection field hacked accordingly), we will still face a complicated problem: </p>
      <p>The default linespacing will still differ from font to font, thus making it difficult to mix fonts in one document (without the user taking complete control over linespacing by specifying it explicitly in points). </p>
      <p>It is obvious that the wider the text column is, the more leading the text needs — the current system, and even the future system (based on OS/2.Typo plus fsSelection) have no knowledge of this. </p>
      <p>The OS/2.Typo-based system is and will be useless for purposes of multilingual computing. Linotype’s Helvetica World font that you designed and produced is the best example for this. No matter which Ascender and Descender fields the applications uses, the one-value-to-serve-all approach will never be sufficient. The default linespacing optimized for Western European languages will be to tight for Czech and far too tight for Vietnamese, but will be too loose for Cyrillic. </p>
      <p>The OpenType Layout system theoretically seems to have a provision for this. The <a href="http://www.microsoft.com/typography/otspec/BASE.htm">BASE</a> table specifies means to shift the baseline up and down depending on the script and language, and also allows you to define minimum and maximum "extents" for glyphs, depending on script and language. However, the specification does not explify how these extents should be used. Also, just as with the infamous OS/2.Win values, the specification seems to throw rasterization issues with linespacing issues together. </p>
      <p>When reading the spec, one has the overall impression that Microsoft engineers were obsessed with the idea that ideal linespacing is such that the descenders of the previous line touch the ascenders of the following line. </p>
      <p>Or maybe I'm just reading it wrong. </p>
      <p>A.</p>
    html_clean: |-
      <p>No, you wouldn't. I'm not saying that the type would not be allowed to shoot over or under the body. Your glyphs could go as high as 2000 units or as low as -1000 units if you wished. But the linespacing would be controlled by just one value. Note that this is in fact how it is done today in high-end applications. In Adobe InDesign, if you specify leading in points, the OS/2.TypoAscender value is only used once — to determine the distance between the top of the frame and the first baseline. Then, each consecutive baseline is simply placed at the distance specified by the linespacing set in points. For example, if you set 10/14 using a font that has OS/2.TypoAscender = 760, then the first baseline will be placed 7.6 pt below the origin of the frame, and each next frame will be offset by 14 pt. What you set as TypoDescender or TypoLineGap doesn't really matter. </p>
      <p>Of course, many applications don't allow the user to specify lienspacing in any way, or rely on some sort of "default" linespacing. Of course, it is a nice thought that the type designer can set the default linespacing for a typeface. In the world we live today, very few applications actually use the "typographically default" linespacing set by the designer, since other values (hhea or OS/2.Win) are used which are actually supposed to be used for other purposes. </p>
      <p>But even if we at some point arrive at the point that all applications use the OS/2.Typo information (at least in the fonts with the OS/2.fsSelection field hacked accordingly), we will still face a complicated problem: </p>
      <p>The default linespacing will still differ from font to font, thus making it difficult to mix fonts in one document (without the user taking complete control over linespacing by specifying it explicitly in points). </p>
      <p>It is obvious that the wider the text column is, the more leading the text needs — the current system, and even the future system (based on OS/2.Typo plus fsSelection) have no knowledge of this. </p>
      <p>The OS/2.Typo-based system is and will be useless for purposes of multilingual computing. Linotype’s Helvetica World font that you designed and produced is the best example for this. No matter which Ascender and Descender fields the applications uses, the one-value-to-serve-all approach will never be sufficient. The default linespacing optimized for Western European languages will be to tight for Czech and far too tight for Vietnamese, but will be too loose for Cyrillic. </p>
      <p>The OpenType Layout system theoretically seems to have a provision for this. The <a href="http://www.microsoft.com/typography/otspec/BASE.htm" class="link-external">BASE</a> table specifies means to shift the baseline up and down depending on the script and language, and also allows you to define minimum and maximum "extents" for glyphs, depending on script and language. However, the specification does not explify how these extents should be used. Also, just as with the infamous OS/2.Win values, the specification seems to throw rasterization issues with linespacing issues together. </p>
      <p>When reading the spec, one has the overall impression that Microsoft engineers were obsessed with the idea that ideal linespacing is such that the descenders of the previous line touch the ascenders of the following line. </p>
      <p>Or maybe I'm just reading it wrong. </p>
      <p>A.</p>
