      <p>Karsten, Chris, see this on-going thread for discussion of the national differences and what is preferable for the em-dash:  <a href="http://typophile.com/node/27727">http://typophile.com/node/27727</a></p>
      <p>David, reading this discussion I suspect there is no way to achieve your goal of a simple, single definition of THE EM that suits all output devices--old letterpress and digital-to-offset and screen--and all applications. So it may be simpler to define the 'the metal em' 'the digital em' etc.</p>
      <p>A bash at it: </p>
      <p>In metal foundry type the EM is the body size (height) of a piece of type in a font, and is also normally approximately equal to the width of a cap M. </p>
      <p>In digital type the EM is the square grid upon which glyphs are drawn and encoded. A glyph may overlap the em. The latin cap M with sidebearings normally is drawn to roughly this width, and the latin ascender plus descender roughly this height. </p>
      <p>When the digital typeface is printed this EM is used as a unit to scale the output. The side of the EM square in the computer drawing  equals the number of points specified in the application for printed output, each point being aproximately 0.0138 inch or 0.3527 mm. For screen output, size of a 'point' is not uniquely defined across applications and machines.</p>
      <p>[I don't know if this needs modification for bit map fonts.]</p>
