      <p>&gt; nominal body height</p>
      <p>For me not, because it doesn’t say anything. It presumes the knowledge what "body" means in typographic terms, and "nominal" suggests that some external entity defines a convention ("names" it). </p>
      <p>It is really very simple: the em is a unit of typographic measurement that is equal to the point size of the type used in the text. </p>
      <p>No more and no less. Linking the em to the linespacing is artificial, and only works in some limited context. It is true that the "built-in" linespacing of a font *sometimes* equals the em. But the point size *always* is the em, and that's the only thing that one can reliably say about it. </p>
      <p>:)</p>
      <p>A.</p>
