      <p>Nick, Adam's choice of the term 'zero-leading linespace' might have been inappropriate, but his basic point is sound: in user experience the distance between the baseline of one line of text and the next is most often not determined by the em (i.e. nominal body height). Only in professional page layout and design apps is linespacing specified, by default, in terms of leading. In word processing applications and in CSS driven websites it may be an option, but in almost all other apps there it is not even an opion. In text editors, spreadsheets, databases, and in the default behaviour of word processors and browsers, linespacing is determined by font vertical metrics, and that is not a standardised '20%' linespacing. On Windows, almost every application determines default linespacing by combining the OS/2 WinAscent and WinDescent values. Since these values were originally specified to define glyph extents (to avoid clipping), not to define linespacing, they are almost always larger than the em height and determined by the highest and lowest outlines in the font.</p>
      <p>So in a situation in which the linespacing most often encountered by users -- and by readers of wikipedia entries -- is determined by something other than the em, it seems misleading to equate the em to the distance between lines of text. David's suggestion is logical if one knows quite a lot about how fonts work, but it doesn't seem to me very helpful for a general reader.</p>
    html_clean: |-
