      <p>Just to complicate this discussion some more:<br>
      Monotype (and its licensees) used to do custom casting, eg a 11pt Bembo on a 13pt body (just an example!). That would make the em-value 13pt for that size of particular type (in the physical sense — the non-printing ems and ens and so on would be 13pt, 6.5 etc. wide — we're still talking about lead). So you can't really state that Em is inherently related to any measurement of any typeface.<br>
      (I remember this because quality typesetting in the Netherlands was mostly Monotype-based and a designer had to take in account these variables, because eg spacing caps for titles required the use of the various kinds of spaces and you needed to know the exact measurements for that.)</p>
      <p>But to simplify things I'm willing to go for the following definition: an Em is a horizontal measure equal to the bodysize of a typeface.</p>
      <p>The fact that webdesigners have seized the Em as a unit for their own wizardry is moot — that's a completely different kind of sport.</p>
