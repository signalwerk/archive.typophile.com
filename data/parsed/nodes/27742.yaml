      <p><em>But that’s not true. People (other than those in letterpress) don’t use ems for measurement...</em></p>
      <p>Actually, it is used quite extensively in CSS. One can design scaleable websites entirely in terms of em, which means that they scale relative to the size of the body text type size. One can also define linespacing in CSS in terms of em, e.g. 1.25 em. It is actually a very intelligent way to build scaleable websites, and it is all based on the em being equal to the nominal point size of the body text.</p>
