      <p>Thanks for all the input. This started with "numberous" aficionados pointing out that "all 12 pt types are not the same size anyway, so what's the points point?" I wanted to propose a "virus" that would scale all latin fonts so the Ascent was the y extrema of the H, and the descent was the y extrema of the p. Then, I decided to just to do it to my 10,000 favorite fonts, and see what broke on the MacMac Apps, then on WindowsMac Apps, and then on WindowsWindowsApps and then... I decided to go to the beach instead.</p>
      <p>But it's still raining, so I decided to finish this. It sounds like: the number of definitions of "point", sizing in general, and more confused interpretations of character widths needs to come up to "speed" with the near-voodoo appearance to THE EM, before we can say with certainty that all the science there was in type design has been removed, or at least argued into enough competing theories that it can no longer be taught (if that's the word for "teached"? not "tighted"?:). The good news is, this confusion-at-the-core certainly makes it easier to claim there was nothing, and introduce a whole new "science". </p>
      <p>But for the mean time, and assuming everyone knows now what "we" mean by "an Em" which is fine as a "sliding" or Pi-ing" or what-so-ever dez-finition, as long as the definition includes, "in the context of a point size", which is a context that all EM-containing word/word phrases, besides "the EM", should be in, I thunk.</p>
      <p>“The EM: This vertical space represents the distance the 'typesetting system' will move when the next line below is located with no extra ‘leading’or 'linespacing' between lines of text. In 'modern font formats', it is usually expressed as the Units Per Em, which is then formulated into font scaling with whatever the typesetting system is using to specify size of the type, to arrive at a font of the user's choice. The Em is also used by the type designer to define the sizing of the letters relative to the "no extra leading or linespacing movement" made by the typesetting system. (In the context of a particular point size, see also "An Em", Em Quad", "Em—Dash" and "Em Square".</p>
      <p>Clear, typographically?</p>
