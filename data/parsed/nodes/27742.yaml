      <p>David's correction to my formulation for UPM actually comes very close to defining the em:</p>
      <p><strong>The em is a vertical segment of the cartesian grid on which glyphs in a digital font are plotted, whose height is such that it matches the nominal point size of scaled type. From this is derived the em as a unit of proportional measurement in typesetting.</strong></p>
