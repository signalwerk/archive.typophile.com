    <p>I am continuing my Ambigram project. I want fresh eyes to overlook it. </p>
    <p>How to look at it:</p>
    <p>For those who don’t know about ambigrams. An ambigrams can be a word read one way and be rotated 180 degrees to be read as the same word or a different word. Therefore,</p>
    <p>Read this word (or type out the letters you see in order you see them) then look at the 180 degree rotation of the word and read it (or type out the letters seen in order seen)</p>
    <p>It is a fun little puzzle if you will for those who take the time to look at it. So have fun and give good feed back if you want. It would be appreciated.</p>
    <p>Hint: it is a first and last name</p>
    <p></p><div class="imageWrap"><img src="/files/ambipic_3445.jpg"></div><br>
    <div class="imageWrap"><img src="/files/ambipic2_3719.jpg"></div><p></p>
