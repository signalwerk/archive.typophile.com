  - id: 359281
    user: 4563
    date: 2009-07-31T21:42:00
    date_raw: 31 Jul 2009 — 9:42pm
    votes: null
    html: |-
      <p>It'd make a nice magazine cover typeface I think. I wouldn't bother so much about not being legible at small sizes. You might want to make it look amazing really big. The roundish, dropish terminal lends itself well for that.</p>
      <p>As far as shapes go, I'd check on the shapes of lowercase A, F (maybe the terminal not so geometrical half circle), R (same as f), S (s being the one I enjoyed the least - pretty hard to get right - spine might not make such steep directional change). Observe what you did with J lowercase, I think r, f should match that, looks good.</p>
      <p>The lower part of uppercase B seems a little too far to the left.<br>
      In the numbers, you may try to review 7, for one without the bar on the center.</p>
      <p>Cheers!<br>
      Rodrigo Saiani</p>
