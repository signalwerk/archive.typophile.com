    <p>Dear Typophiles!</p>
    <p>While pushing other projects I take a break and playing around with this little sans project - reminds me like kinda typewriter style with those slightly broadening, curly terminals. </p>
    <p>No boning effect was removed yet.</p>
    <p>What do you think of it? Do you like it/hate it? Is it boring or not so?</p>
    <p>Thanks for your comment and critique in advance!</p>
    <p>fab</p><div class="imageWrap"><img src="http://typophile.com/files/unalom_sketces_03_all_4895.jpg"></div><p></p>
