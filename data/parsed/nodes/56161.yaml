    <p>Jane Smith, MEd, RD, LD</p>
    <p>In my layout all of the above is <a href="/wiki/small%20capitals" class="freelinking" rel="nofollow">small caps</a>, but then they added the MEd to the layout and I don't know what the right thing is to do? This is a publication so I have to think about it being consistent with last issue also. Should i make only the d lowercase? make everything but the d uppercase?</p>
    <p>thoughts?</p>
    <p>thanks!</p>
