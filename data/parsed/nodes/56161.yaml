    html: |-
      <p>There are three things you can do.</p>
      <p>As it is a rare occurrence, a little manual work on the "d" is OK.</p>
      <p>1. Reduce the size of lower case "d", then increase its weight by applying a "Stroke" value.<br>
      2. Use a "d" from a smaller optical size, if your typeface has one.<br>
      3. Choose a "d" from a related font that has the appropriate weight at the size.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/JaneSmith_5630.jpg"></div><p></p>
