    html: <p>I FINALLY realized what you all are talking about. Frankly, I couldn't tell that was a font the first 4 or 5 times I looked at it and find it nearly impossible to read.  <br> <br>My suggestion is if you don't need a lot of characters, that you make your own. I think people spend way too much time on this forum looking for fonts that they could very easily create themselves and save time, money, as well as have something truly original.</p>
