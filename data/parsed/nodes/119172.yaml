    html: "<p>Yes, “faux” small caps can be used, styled with: (1) a minute amount of stroke, (2) tracked out slightly, and (3) a touch of horizontal scaling. It’s possible to play around with these parameters, as well as (4) height, till one achieves a satisfactory effect.</p>"
