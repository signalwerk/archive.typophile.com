  html: |-
    <p>I started out using Helvetica as a titling type, but it looks just a little too sterile and clean cut. Looking around for something more soft, I came across <a href="http://www.dafont.com/alte-haas-grotesk.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Alte Haas Grotesk</a> which looked better. Alas, it has no italic or small caps.</p>
    <p>The <a href="http://www.fontbureau.com/nhg/features/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Neue Haas Grotesk</a> does have an italic (oblique) but still no small caps. It's not quite as rounded either, unfortunately.</p>
    <p>Now I'm looking for something like Alte Haas Grotesk but with italic and with small caps. Any recommendations? <a href="http://www.tipografies.com/fonts/bulo-rounded/styles/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Bulo Rounded</a> perhaps?</p>
    <p>Thanks :)</p>
