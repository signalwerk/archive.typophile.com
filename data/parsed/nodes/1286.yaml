  html: <p><a href="http://www.atypi.org/40_conferences/28_Vancouver/40_timetables/view_presentation_html?presentid=58" target="_blank">http://www.atypi.org/40_conferences/28_Vancouver/40_timetables/view_presentation_html?presentid=58</a> <br> <br>The mask is off. If you hadn't guessed the identity of the mystery Adobe application being previewed at this year's ATypI conference, Thomas Phinney today confirms that it is a new Illustrator, complete with Unicode text support, OpenType Layout features, and reportedly the most advanced typography UI in any application. <br> <br>At 9:35 on Sunday, September 28th, Thomas will present 'the first public technology preview of this future version of Illustrator', exclusively for attendees of the ATypI conference. <br> <br> <br>John Hudson, conference programme organiser</p>
  html_clean: <p><a href="http://www.atypi.org/40_conferences/28_Vancouver/40_timetables/view_presentation_html?presentid=58" target="_blank" class="link-external">http://www.atypi.org/40_conferences/28_Vancouver/40_timetables/view_presentation_html?presentid=58</a> <br> <br>The mask is off. If you hadn't guessed the identity of the mystery Adobe application being previewed at this year's ATypI conference, Thomas Phinney today confirms that it is a new Illustrator, complete with Unicode text support, OpenType Layout features, and reportedly the most advanced typography UI in any application. <br> <br>At 9:35 on Sunday, September 28th, Thomas will present 'the first public technology preview of this future version of Illustrator', exclusively for attendees of the ATypI conference. <br> <br> <br>John Hudson, conference programme organiser</p>
