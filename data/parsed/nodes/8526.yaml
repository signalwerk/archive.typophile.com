    html: <p>For those foundries that have taken the trouble to register a vendor ID (for encoding in their TrueType and OpenType fonts) I have addresses... <a href="http://www.microsoft.com/typography/links/vendorlist.aspx" target="_blank">http://www.microsoft.com/typography/links/vendorlist.aspx</a> <br> <br>Not easy to search though - sorry.  <br> <br>But there are a few in and around Chicago - Ascender Corp, Monotype Imaging's Fonts.com team, Berthold Types, t-26, Thirstype, probably others.  <br> <br>Si</p>
