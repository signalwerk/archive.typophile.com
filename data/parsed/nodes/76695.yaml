    <p>shakespeare globe london 2010</p>
    <p>The font is a modern (probably custom) SANS serif (S and I?). I have looked on what the font? I guess what i am asking is does anyone have any font suggestions that look similar.</p>
    <p>if not just have a look, its alright.</p>
    <p>Its not the most beautiful project in the world but really cuts through the posters that are all over town. Funny how the oldest theatre has the most modern approach. </p>
    <p><img src="/sites/default/files/old-images/adamhayes-globe-bedlam_5860.jpg][img:sites/default/files/old-images/adamhayes-globe-boleyn_5461.jpg][img:sites/default/files/old-images/adamhayes-globe-henryiv1_5033.jpg][img:sites/default/files/old-images/adamhayes-globe-henryviii_6391.jpg][img:sites/default/files/old-images/adamhayes-globe-macbeth_6716.jpg][img:sites/default/files/old-images/adamhayes-globe-merry-wives_4657.jpg][img:sites/default/files/old-images/hayes-heraldry1_5780.jpg"></p>
    <p>It was designed by Ryan Ras and Julie Kim and illustrated by Adam Hayes.</p>
    <p><a href="http://mrahayes.blogspot.com/2010/02/shakespeares-kings-rogues.html">http://mrahayes.blogspot.com/2010/02/shakespeares-kings-rogues.html</a></p>
