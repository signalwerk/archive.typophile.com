      <p>I like the posters too, but I'm a bit worried to look into the source as I think it might actually be a dafont freebie and I'll lose a bit of respect for them.</p>
      <p><cite>Funny how the oldest theatre has the most modern approach.<cite></cite></cite></p>
      <p>I think it's based on an early 20th Century constructivist style but it matches the timber-frame construction of the theatre nicely, but I'm not sure if being a 1999 reconstruction makes it count as London's oldest.</p>
