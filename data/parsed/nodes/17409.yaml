  html: <p>This may be in the <a href="wiki/typowiki" class="wiki">wiki</a> somwhere, and I’ve looked through the <a href="wiki/sans_serif" class="wiki">sans serif</a> entry, but I’m wondering what the difference is between <a href="wiki/gothic" class="wiki-create">gothic</a> faces and <a href="wiki/grotesque" class="wiki-create">grotesque</a>. Or are they really the same thing? Just different names for what we now call sans-serif?</p>
  html_clean: <p>This may be in the <a href="wiki/typowiki" class="wiki link-lost">wiki</a> somwhere, and I’ve looked through the <a href="wiki/sans_serif" class="wiki link-lost">sans serif</a> entry, but I’m wondering what the difference is between <a href="wiki/gothic" class="wiki-create link-lost">gothic</a> faces and <a href="wiki/grotesque" class="wiki-create link-lost">grotesque</a>. Or are they really the same thing? Just different names for what we now call sans-serif?</p>
