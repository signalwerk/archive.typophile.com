    html: |-
      <p>&gt; American ATF inspired/derivative typeface from Akzidenz Grotesque.</p>
      <p>I don’t see how Franklin Gothic has much to do with Akzidenz Grotesque. Franklin Gothic has more thick-thin contrast, and the two story g, the s doesn’t close on itself, the top terminal of the c is fatter than the bottom, etc etc. </p>
      <p>Alternate Gothic is condensed, and, looking at my old edition of Jaspert,resembles the condensed versions of Akzidenz (Standard),except with the two story g. But the condensed versions of Akzidenz (Standard) don’t look much like the regular and wider versions of Akzidenz, which seem to be the basis for Helvetica. </p>
      <p>It may well be that Benton had German sources for Alternate Gothic. But Franklin seems to me very unlikely to have come from Akzidenz. More likely a redrawing of existing American faces, I would guess. </p>
      <p>Is there an historian out there who can give us the correct story?</p>
