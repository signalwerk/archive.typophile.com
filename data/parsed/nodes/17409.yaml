      <p>I don’t think this is an official distinction by any means, but I’ve sensed a trend to apply the term “grotesque” to old victorian and wood-type sans serifs (in the Railroad Gothic / Poplar / Champion / Knockout style), “gothic” to more refined versions of the same basic structure (Akzidenz, Alternate Gothic, Franklin Gothic, Lightline Gothic, News Gothic, Trade Gothic, et al) and “neogrotesque” to sans-serifs refined in the Swiss style (such as Folio, Helvetica, Univers and the like).</p>
      <p>Has anyone else sensed a similar distinction?</p>
      <p>David Thometz</p>
