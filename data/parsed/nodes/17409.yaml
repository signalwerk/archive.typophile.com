    html: |-
      <p>Mac McGrew 1986,<br>
      Gothic, the purists say, is Blackletter or what we more often call Old English. But the name is so firmly established in American usage as meaning a plan block letter without serifs or hairline, that we must accept that meaning. Also, it is part of many type names. But we prefer to go further, and reserve the term gothic for the traditional forms, and san serif for the modified forms orginating in Germany with the Bauhaus movement of the 1920s. Our preferrred general term is serifless.</p>
      <p>first portion of text from p. 155.</p>
