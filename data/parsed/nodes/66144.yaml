    html: <p>Sounds like something a mathematician might say. An 'orthogonal' as something that has nothing in common with an argument makes perfect natural sense to maths majors. I sometimes catch myself using mathematical terminology figuratively in everyday situations, which is sometimes complicated by the fact that mathematicians use everyday words like 'normal', 'closed', and 'complex' in specialized meanings.</p>
