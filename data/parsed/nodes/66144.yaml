    html: |-
      <p>And "orthogonal" is used in Hilbert space too, so in Quantum Mechanics one can say, for example, that a position eigenstate of a particle is orthogonal to a momentum eigenstate of a particle (the integral of the product of the two wavefunctions is zero), which means that Heisenberg's uncertainty principle applies directly in its simplest form to those two observables.</p>
      <p>From that usage, the figurative usage of "orthogonal" to mean independent or unrelated comes very naturally.</p>
