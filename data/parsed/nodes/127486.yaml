  html: |-
    <p>I posted this a few years ago and received two responses, Trade Gothic bold condensed No.20  and Alternate Gothic No.2, these two are close but neither the same font. See the curves of the R in particular. Would love to finally identify this font,</p>
    <p>Trade Gothic<br><a href="http://www.myfonts.com/fonts/adobe/trade-gothic/">http://www.myfonts.com/fonts/adobe/trade-gothic/</a></p>
    <p>Alternate Gothic No.2<br><a href="http://www.myfonts.com/fonts/linotype/alternate-gothic-lt/">http://www.myfonts.com/fonts/linotype/alternate-gothic-lt/</a></p>
    <p>Hope someone can help,</p>
    <p>If anyone knows the other font in all caps that would be great too. Bonus points :)</p>
    <p>Thanks everyone</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/font-id/Picture%201_462.png" width="854" height="606" alt="">
