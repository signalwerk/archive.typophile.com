      <p>Thanks!</p>
      <p>I've actually gone from using Akzidenz Grotesk to AG Old Face to Ad Grotesk looking for something more like the original non-digital cuts as used in the signage at the Barbican and/or as featured on the 'Marber Grid' Penguin titles from the 60s (I should post some pics). </p>
      <p>That's way specific, huh. I'm sure they are all different cuts of the same font but I kind of like the way Scangraphic separate their fonts into Body Types and Super Types (especially with the tight keaning), I'm also wondering whether or not I should buy any more of their fonts if the whole collection is soon to disappear into nothingness.</p>
