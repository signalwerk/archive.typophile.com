    <p>This is my first topic post so please be gentle with me...</p>
    <p>I was really just wondering if anyone knew what was happening to the Scangraphic Library and if the current talk about Scangraphic 'copying' (or 'reappropriating' or whatever you'd like to call it) typefaces from other sources is reason many of their faces seem to be disappearing. </p>
    <p>I ask mainly because I have been using Ad Grotesk recently and decided to buy a few more weights but can't find any instances of it anywhere. Paratype and FontShop seem to have removed the family from their catalogues. </p>
    <p>Could it be a similar case to the disappearence of Scangraphic's version of 'Unica' a few years ago?<br>
    Any news much appreciated.</p>
