      <p>This thread has been extremely useful to me, I too am considering a career in type design, but was having a hard time understanding what doing that full time would look like. JamesM, your insight was especially useful.</p>
      <p>I´ve designed the lowercase of one font (while I was still in school), which I aim to finish by next June. I´ve also done a fair amount of custom lettering for logos, etc. I´ll hopefully be enrolling in the new Master´s of Typography/Type Design at the Universidad de Buenos Aires in 2011 (fingers crossed!).</p>
      <p>So I guess my biggest question now is how to get started as a professional typographer/type designer. I would imagine it would be similar to self-promotion as a graphic designer, but it seems that you work with a much smaller niche of people, as it is such a specialized field. I understand that going to conferences and just networking in general can be a great way to start, but there´s got to more to it than that.</p>
      <p>Any insight?</p>
      <p>Thanks!</p>
