      <p>You and me both.</p>
      <p>I am pursuing a BFA in graphic design. A few weeks ago, I decided that type design is what I really want to do. I know that I have tons to learn, but I think I can do it.</p>
      <p>Considering the money (and I have), my plan is do keep being a graphic designer, meanwhile I'll be drawing letterforms and compiling entire type faces, reading everything I can in all the free time I have, and soon I hope to start selling my typefaces to foundries and type-sellers. When things start looking good, I'll make the switch.</p>
      <p>I haven't talked to too many people about this plan, so I am also wondering how plausible this is. I guess the good news is that my wife doesn't seem to be worried .. haha!</p>
      <p>I guess at the end of the day, do what you love.</p>
      <p>Good luck<br>
      Evan<br>
