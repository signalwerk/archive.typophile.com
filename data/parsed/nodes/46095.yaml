      <p>Since you're nearby in London, GT, take a look at the TypeMedia program in The Hague, an intense course yielding impressive graduation projects from international students...at the very least, you benefit from being close to Dutch type designers.</p>
      <p><a href="http://new.typemedia.org/" title="http://new.typemedia.org/">http://new.typemedia.org/</a></p>
      <p>The other point fascinating to me, as a type consumer, is how the logistics of launching a one-person foundry have changed: one master format, OpenType, and one very useful clearinghouse for marketing and sales, MyFonts. If you have high-quality goods it seems it's never been easier to bring them to an international market. Good current example: Ludwig Übele and his two serif families, Marat and Mokka, each launched on MyFonts recently as well as on his own site. Ludwig is a Type/Media grad; in fact Marat was his grad project there a year ago.</p>
