    html: |-
      <p>JamesP,</p>
      <p>My clients are designers and art directors. Rarely do I do any work that does not come from an AD or designer. In fact I can't remember ever doing a job like that.</p>
      <p>They contact me to do the typographic/lettering component of their jobs. </p>
      <p>This week I had a branding company asking for multiple versions of a logo for a product they were repositioning, along with a string of words they wanted to be rendered based on a piece of historical lettering associated with the brand (an upright connecting script). I created limited character set MM fonts in FL and offered them a cascade of weights to ponder.</p>
      <p>I also revised some book jacket lettering that I originally delivered to the client (and art director) last week. I also reviewed a bunch of old PS fonts for a Magazine that wants to update the kerning throughout their typographic palette. (again, an art director client)</p>
      <p>Last week, besides the jacket lettering I created a full-featured OT font from some old US Park Service photos I did that in 4 days, my record for Upper/lower/smallcaps/inferior/superior fonts with a few calts. Its a funky display design with some 30s overtones.</p>
      <p>Between doing this, I've been slugging away at a bold display italic of a large Scotch/Modern/Didot family with Optical sizes. I finished the roman and text italic months ago, but the display italic had to wait while I did client work.</p>
      <p>The week before that I was doing a OpenType conversion  for a large collections of fonts associated with a California university, and just delivered the finals a few days ago.</p>
      <p>It goes like that pretty much every week. Sometimes when it gets a bit slow I can focus more on my own font development, but I normally have to fit that font development in between my client work.</p>
      <p>And then there are the font sales from the website, and the customer service I provide when people who buy our font licensing need their hand held, or if a organization needs a formal proposal to be written so they can order our fonts.</p>
      <p>JamesM</p>
