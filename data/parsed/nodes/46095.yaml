    <p>Hello everybody.</p>
    <p>I've been wondering how possible it is to pursue type design as a career. Or more accurately; is it possible to earn a decent enough wage through designing type? If so would this only be if you worked for one of the major type foundries or is it possible through setting up your own tiny type studio? I know this sounds mercenary to ask only of the money, but it is a necessary part of living and I have to consider it.</p>
    <p>To be honest I haven't designed a typeface so I'm not exactly actively pursuing this career path. I've started a few designs but have ended up losing faith in their potential or seeing some major problem in my understanding of typeface construction. Hence I'm also  considering an MA course in the subject if nothing nothing else. </p>
    <p>I work in publishing and while I'm very lucky to be in a job that is largely creative I feel that it isn't necessarily what I'd REALLY like to be doing. I've been hanging around here (Typophile) for a coupla years now and the subject of type design i think appeals ot me a lot.</p>
    <p>Any information and experiences anyone could give me would be greatly appreciated.</p>
    <p>Thanks, </p>
    <p>GT</p>
