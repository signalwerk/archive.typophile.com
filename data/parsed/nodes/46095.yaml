      <p>I remember there was a conversation about this, in another place, at another time, (not on Typophile) and the consensus was that there were approximately 1000 people making a living via type design as a full time occupation. Defined a someone only doing type design and/or font development. My estimation is that it may be a little larger a universe than that, but probably not by much.</p>
      <p>So, yes it is possible, yes it is fun, and yes, it is difficult to do. But there is money to be made if you can do it.</p>
      <p>I would also add that the majority of type designers working today are largely self-taught, but with the success of programs like Reading, that surely will change.</p>
