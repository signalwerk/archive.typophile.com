    html: <p>GT, Cassandra, everyone. Firstly I question the 1,000 figure. Maybe 100 is close. I agree with Dezcom, work on type design a lot. Find what you like and do it and re-do it. I have been very fortunate in choosing to re-create type rather than strictly design it but then I always think of re-creation as legitimate as so many others have done it including Adobe, Bitstream, etc. Work from the original, re-create it, like Adobe Garamond for example, digitize it, and you have something essentially new. I have designed original fonts but have never been happy with them, although I have sold a few. I would certainly look at the school at the Hague as well as Reading. Read as much as you can, look at every type book you can, read, read and read some more. I have worked with and continue to use Fontographer, Type Tool, and FontLab Studio. I think I agree with Phinney, very few designers are making a median living, i.e., 60k. For me, type design or re-creation puts a loaf of bread on the table, not much more. But I love it. So do what you love. And yes, a plug from me for myfonts.</p>
