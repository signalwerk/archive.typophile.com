      <p><cite>Firstly I question the 1,000 figure. Maybe 100 is close.</cite></p>
      <p>It of course depends on the definition of what it is to make a living as a type designer, but consider who you may be leaving out. The world of type design is quite a bit bigger than what you may be able to sense through venues like Typophile or MyFonts. Custom type design is a world in itself that you don't hear often about.</p>
      <p>And don't forget other scripts. I don't have the numbers at hand, but as I recall there were around twenty type foundries in South Korea a few years ago. And you can bet that not all of them are single-designer outfits; these type foundries typically employ several people holding the title of type designers. The big three foundries employ huge teams of type designers to churn out fonts. Admittedly, the necessity of big teams is a feature unusually pronounced CJK type design, but that still means that the number of CJK type designers alone could easily be on the order of 100.</p>
    html_clean: |-
