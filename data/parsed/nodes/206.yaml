  html: <p>Hey guys - i'm searching for some fonts for a website - we're looking for some coney island/carnival/fair/summer fun type fonts - like we're using them to make logos for the events this summer and putting corny slogans with them such as "guaranteed fresh" and "test your strength" those type of things - so if any body has any good suggestions for "carny" type fonts please let me know - thanks guys <br> <br>and the "free-er" the better lol <br>thanks again <br>tom</p>
