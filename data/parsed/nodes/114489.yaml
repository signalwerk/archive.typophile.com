    html: |-
      <p>Didn't find all of these letters in a single font but here are two that have are similar to parts of the alphabet.<br>
      The S -- Bindlestiff NF, a revival of Schmallfette Binder-Style, by Nick Curtis  <a href="http://www.myfonts.com/fonts/nicksfonts/bindlestiff-nf/" title="http://www.myfonts.com/fonts/nicksfonts/bindlestiff-nf/">http://www.myfonts.com/fonts/nicksfonts/bindlestiff-nf/</a><br>
      The N and M -- Strassenbahn by Maximilian Huber </p><div class="imageWrap"><img src="http://typophile.com/files/StrassenbahnCharmapPart_4984.jpg"></div><br>
      <a href="http://hubermaximilian.prosite.com/81080/1093741/typefaces/strassenbahn-typeface" title="http://hubermaximilian.prosite.com/81080/1093741/typefaces/strassenbahn-typeface">http://hubermaximilian.prosite.com/81080/1093741/typefaces/strassenbahn-...</a> with a link to Ten Dollar Fonts at <a href="http://www.tendollarfonts.com/strassenbahn/" title="www.tendollarfonts.com/strassenbahn/">www.tendollarfonts.com/strassenbahn/</a> but the font is no longer at that site. I wonder what happened to the font.<br>
      Don<p></p>
