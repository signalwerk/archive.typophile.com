    <p>Hello dear Typophile</p>
    <p>I'm looking for a font a bit similar to the font marc jacob is using. it should be with wide letters, sans serif and a high middle line. I ve seen fonts like this often used for fashion labels and that's why im looking for this. it should fit in.</p>
    <p>thank you a lot for an answer<br>
    lovely greetings, aranel</p>
