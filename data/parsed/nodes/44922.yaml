      <p>There are invariably a couple of pre-TypeCon workshops about working with FontLab, as far as the technical aspects are concerned, at several levels. Getting into one of these can be a great jump-start on getting over that initial technical hump. </p>
      <p>But they fill up fast, so as soon as the website goes live and registration is open (soon, we all hope!) then you should jump on it.</p>
      <p>Inspiration and learning about all sorts of other things will come from going to presentations, talking to practicing type designers, and just hanging out with other typophiles.</p>
