      <p>Going to TypeCon is a fine idea as a starting point. It's probably too late to apply for the fall semester at any relevant school anyway.</p>
      <p>Both I (personally) and Adobe *corporately) have long been impressed with the MA Typeface Design program at Reading in the UK.</p>
      <p>I believe that they do an excellent job of teaching both the basics and some advanced stuff. The quality of the work that has come out of that program has been surprisingly good. Quite a few Reading grads have gone on to rewarding careers at leading type foundries (Adobe, Linotype, Hoefler + Frere-Jones, etc.), or started their own foundries. Some of them hang out here on Typophile.</p>
      <p>The other program worth mentioning is the KABK in the Netherlands, but I don't have as much personal experience of it, so I'd best let others comment.</p>
      <p>Regards,</p>
      <p>T</p>
