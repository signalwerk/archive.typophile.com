      <p>Most type designers  my age never studied formally, because there wasn't any way to study formally. We just started drawing type and looked long and hard for books and articles to help us along the way. I had the good fortune to take one of Ed Benguiat's Indicated Lettering classes at SVA in the late 70s, but that was about quick marker comp lettering, not type design. If you want to design type, just start drawing type and stop wasting your time looking for a formal program. The money you spend on a formal program is probably too much to justify, so why bother. Just draw type.</p>
      <p>I wouldn't recommend Chang's book, but who cares, right. </p>
      <p>Doyald Young's books are much better. Better to read a book by someone who can actually draw letters, no?</p>
