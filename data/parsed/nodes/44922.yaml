    <p>I'm wondering where one can go to learn about type design. I know there are a couple of university programs, but they seem to be really few and far between. I'm a graduating graphic design student, and I've taken a great interest in type design, but it seems like the resources for learning how to design properly are very limited.</p>
    <p>I'm working right now on my first font ever (<a class="freelinking external" href="http://typophile.com/node/44909" rel="nofollow">http://typophile.com/node/44909</a>, any feedback would be awesome!), and used Karen Chang's Designing Type as a guide. I know there are other books (I think I'm going to go buy the Font, Logo and Lettering Bible), but I'm interested in finding out where I can go to formally study it, as type design and hand lettering really interest me. Any programs (although I'm not looking to go back to university at this point) would be helpful.</p>
    <p>If there aren't too many suggestions for where to go to learn formally, how did everyone here learn to design type? I'd love to hear more about your backgrounds.</p>
    <p>Thanks!</p>
    <p>Cassie</p>
