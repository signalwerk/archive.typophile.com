    html: <p>It's color is interesting but my gut is that a new sketch would be a better place to start even if you were going to channel this feeling again. From my experience ( limited indeed ) and what I have been told it's often faster &amp; better to make a face well straight off than to fix 10,000 errors. Look at all the weight problems for instance. This is putting it a bit too simply perhaps. And it also depends on where you think you were then &amp; where you feel you are now. There is also the question of purpose. What purpose whould you be designing towards with this?</p>
