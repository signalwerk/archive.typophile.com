  html: |-
    <p>Hello Typophiles,</p>
    <p>I'm new to this site and even a bit new to typography in general. I do want to learn about it though. I'm an intern-student at a regional studio and I've really been having a frustratingly hard time designing with simple shapes and typography, while I'm quite good at illustration.</p>
    <p>Lately, I've been banging my head about a new corporate identity that features quite a lot of text. It consists of a name (3 words) and a subtitle (2 words, describing it's services and joined by an &amp; character). I'm not going to bother you with any details about the identity itself and have you guys indirectly designing it for me, I'd rather like to learn how to get there.</p>
    <p>Could anyone share any useful tips or resources with me when designing a logo/typographic logo with a long names? Are there elements there should be payed specific attention to?</p>
    <p>Finally I would like to know if there are any articles out there about choosing typography in general, since I often seem to choose wrong or unfitting typography. Actually, anything on the web a student should read about typography and logo design would be helpful.</p>
    <p>Cheers,<br>
    Hessel.</p>
