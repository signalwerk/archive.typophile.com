    html: |-
      <p>Books. Lots and lots of Books. Enter "Typography" on Amazon and see what comes up. Or just google "typography".</p>
      <p>As for logos with lots o' type, you can really go two ways:</p>
      <p>1) Use fantastic typography to make those words sing. Sometimes you can interconnect letters, words, etc. to achieve an interesting logotype. Play with negative space between the words.</p>
      <p>2) Design a fabulous Icon or illustrative Mark, and shrink the text down to be a sub-unit of the whole Logo... that is, the mark stands out on it's own, but appears with the words for "official" uses. Sometimes this will work with initials, too. I often take proper names and create a symbol from their initials, like "NL&amp;A" instead of "November Lazar &amp; Associates."</p>
