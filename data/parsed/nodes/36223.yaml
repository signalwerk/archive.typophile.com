    html: <p>For small caps you don't need capitalization. In OpenType fonts you have two different features to turn lowercase letters into small caps [smcp] and to turn uppercase letters into small caps [c2sc]. You may also have two different sets of small cap glyphs in a OpenType font, one to represent the lowercase as small caps, another for the uppercase.</p>
