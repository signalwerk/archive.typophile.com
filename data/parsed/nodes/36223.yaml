  html: |-
    <p>How do people deal with letters with no upper-case form, or where the upper-case is comprised of multiple glyphs?  Two cases I’ve seen on this board are the Greenlandic Kra (ĸ maps to K‘) and German Esszet (ß usually maps to SS, but a true capital ß has been proposed; see the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Capital_ß" rel="nofollow">Wikipedia entry</a> and the 2004 <a class="freelinking external" href="http://std.dkuug.dk/jtc1/sc2/wg2/docs/n2888.pdf" rel="nofollow">Unicode proposal</a> and its 2007 <a class="freelinking external" href="http://std.dkuug.dk/jtc1/sc2/wg2/docs/N3227.pdf" rel="nofollow">resubmission</a>).</p>
    <p>Where should software handle these distinctions?  Are the <a href="/wiki/small%20capitals" class="freelinking" rel="nofollow">small capitals</a> graphical variations on the minuscule or majuscule letters, and so where should the capitalization happen, in the typesetting program or in the font?</p>
