    date_raw: 19 Aug 2007 — 9:08am
    votes: null
    html: <p>The trouble (as I saw it) with small-caps de-ligaturization where the capital or small-caps form is not a ligature (as in ß ↔ SS, ﬁ ↔ FI, &amp;c.), is that the letter spacing becomes hard to adjust.  I wasn't aware of the [c2sc] feature in OpenType, though; the standard Unicode capitalization routines followed by [c2sc] are what I was hoping existed.  Thanks.</p>
