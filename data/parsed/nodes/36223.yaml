      <p>Many Linotype OpenType fonts that include small caps include small cap glyphs for ß fi fl and ij. In the case of ß, the glyph is two small cap s forms (SS). Same for the ligatures (FI FL IJ).</p>
      <p>I have heard that, even if a cap ß comes into use, recommended capitalization will still be SS. For one thing, you don't want pre-existing documents to reflow! Old documents will have to be edited to have the SS replaced with the capital ß; new documents will have to physically enter the capital ß in somehow, i.e., selecting a text with an ß in it and capitalizing that text completely will probably swap that ß with SS. Don't know how the user will actually type in the capital ß yet. There is always the glyph palette…</p>
