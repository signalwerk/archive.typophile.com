    <p>Where should software handle these distinctions?  Are the <a href="/wiki/small%20capitals" class="freelinking link-lost" rel="nofollow">small capitals</a> graphical variations on the minuscule or majuscule letters, and so where should the capitalization happen, in the typesetting program or in the font?</p>
