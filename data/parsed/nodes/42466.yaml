    html: |-
      <p>Ethics may be a problem if the agency has a different set of ethics. If the agency is doing pro life work and a right to life person is looking to work there, I can see clashes.</p>
      <p>The one thing you have to remember is that a junior is expected to do what she is told, not to make policy decisions. That said, you always have the option of leaving if the work assigned to you bothers you ethically.</p>
