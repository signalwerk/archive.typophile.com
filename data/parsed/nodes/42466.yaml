    html: |-
      <p><strong>Work placement</strong><br>
      In no particular order:
      </p><ul>
      <li>enthusiasm;</li>
      <li>initiative; and</li>
      <li>patience.</li>
      </ul>
      <p><strong>Junior designer</strong>*<br>
      All of the above traits, as well as being:
      </p><ul>
      <li>fastidious;</li>
      <li>punctual;</li>
      <li>articulate;</li>
      <li>thick-skinned;</li>
      <li>intelligent; and, of course</li>
      <li>creative.</li>
      </ul>
      <p>*A good knowledge of the usual industry programmes is a fundamental requirement.</p>
