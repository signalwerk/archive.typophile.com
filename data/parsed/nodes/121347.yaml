      <p>Qantas' ‘flying kangaroo’ retro-livery on its latest Boeing 737 to fly later this month<br><img src="/sites/default/files/old-images/QANTAS737RetroLivery_4261.jpg"><br><a href="http://www.ausbt.com.au/qantas-to-unveil-retro-livery-on-boeing-737">http://www.ausbt.com.au/qantas-to-unveil-retro-livery-on-boeing-737</a><br>
      Note the differences from the 1968 wordmark, here shown on a promotional ashtray<br><img src="/sites/default/files/old-images/QantasAshtray_5251.jpg"><br>
      New version seems to have less slope. Different length of tail on _Q_ may be due to horizontal stretching?<br>
      Don</p>
