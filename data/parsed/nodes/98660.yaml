  html: |-
    <p>Hello, I'm working on a few different beer logos. I'd love some feedback.</p>
    <p>The first, Miraculum, is a hoppy IPA with a viney &amp; floral hand drawn mark.<br>
    <a href="http://cl.ly/image/3k3f0b003501" title="http://cl.ly/image/3k3f0b003501">http://cl.ly/image/3k3f0b003501</a></p>
    <p>The second, Cadre, is a smooth brown ale, displayed as a curvy black letter.<br>
    <a href="http://cl.ly/image/1A423t2g0b08" title="http://cl.ly/image/1A423t2g0b08">http://cl.ly/image/1A423t2g0b08</a></p>
    <p>The third, Villain, is a red IPA that's shown in a minimalistic comic book style, similar to sin city.<br>
    <a href="http://cl.ly/image/1n160M0u142l" title="http://cl.ly/image/1n160M0u142l">http://cl.ly/image/1n160M0u142l</a></p>
    <p>The final mark, Grand Pryes, is a cream ale shown here in a reflective, half dressed, robust serif font.<br>
    <a href="http://cl.ly/image/3u0O2D2u2W2R" title="http://cl.ly/image/3u0O2D2u2W2R">http://cl.ly/image/3u0O2D2u2W2R</a></p>
    <p>- Any feedback would be greatly appreciated.</p>
    <p>Thanks,<br>
    Ben</p>
