      <p>Yes... for my dissertation, or other future scientific documents, I will be using Latex.  Fighting math in anything else borders on craziness. </p>
      <p>  I am on OS X.  Xetex is certainly interesting - I should really investigate that more.  </p>
      <p>As far as fonts in Latex, its just such a colossal pain in the butt to load new fonts in.  I'm using a script and lcdf tools to do most of the work, of which I barely understand :)  I've managed to get most things working the way I want, but once you get into greek, old style figures for text and lining figures for math, the proper accents, etc. it gets to be a real bear.  I've gotten most of this stuff worked out somehow in a manner that looks acceptable.  I did however have to give up on using the greek glyphs from Garamond Premiere Pro since I was having too much difficulty with accents (overbars, vectors, dots, and such) in math mode.</p>
      <p>I was really looking for a more forward looking system than TeX's 7 bit madness.  I'll look into XeTeX more as I should have done from the beginning.  Is it easy to use different fonts in the same XeTeX document (sans and serif)?</p>
      <p>Is there a suitable text driven interface into Indesign?</p>
