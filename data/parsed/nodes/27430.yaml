    <p>I'm new here, so if this is in the wrong forum, feel free to move it.</p>
    <p>I'm currently typing up my thesis.  As a student in physics, I've resigned myself to using LaTeX.  To be honest, up until this year when I started tinkering with fonts, I've been supremely happy with LaTeX.  I certainly wouldn't consider typesetting anything with mathematics in something else (unless a successor finally roles around).  I'm really charmed with the keyboard driven markup of things.  Less point and clicky.</p>
    <p>For other purposes however, LaTeX can be quite frustrating, especially while trying to access different fonts and their features.   One of the things that I really like about LaTeX is that I can work in my favorite text editor, type away, and then feed it into LaTeX after the fact.  At that point, I only have to tweak things.  For example, for an emphasis passage, I \emph{really like writing like this}.  I'd of course be willing to learn new markup if necessary - I just don't want to write in Word and vastly prefer writing and marking up in plain text.</p>
    <p>I have a copy of Adobe Indesign 2 (which I might upgrade to CS2 if it will help) and I'm certainly willing to write in XML or other markup languages if there is a path there.  So... can Indesign (2 or CS2) process some form of markup instead of just reading in Word files?  I'm sure it can... Is there a free and/or cheap way to do this?  Do I just need to read the manual more or upgrade to CS2?  Thanks for the help!</p>
