    html: <p>Hmmm, Metropolitaines is most definitely the <i>Official Paris Metro Font</i> (TM) and there are indeed many entrances to Metro stations in Paris decorated with signs set in this face or something very similar. <br> <br>However, it would seem that the font on Brad's picture is actually completely different and devoid of obvious Art Nouveau stylistics. <br> <br>No idea what it is though, I don't expect it's available in digitized form. Then again, it shouldn't be too hard to recreate this from scratch (especially if all you wanted was a sign saying [METRO])... <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
