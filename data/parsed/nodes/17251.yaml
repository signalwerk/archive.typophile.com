    <p>I just treated myself to Linotronic output of four of my fonts!<br>
    You just start to think your Laser printer is telling you the truth and pull the usual toner boner. LINO ROCKS!!!<br>
    Even the 6pt light weight looks clean and crisp. </p>
    <p>The reversed type just sings without a plug or a smear.<br>
    Wish I could do it more often than once a year :-/</p>
    <p>ChrisL</p>
