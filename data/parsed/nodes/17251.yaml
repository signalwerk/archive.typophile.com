    html: <p>Yo, Chris! What is “Linotronic”?</p>
    html_clean: <p>Yo, Chris! What is “Linotronic”?</p>
  - id: 104264
    user: 6470
    date: 2006-01-15T15:27:00
    date_raw: 15.Jan.2006 3.27pm
    votes: null
    html: |-
      <p>You, Kris!</p>
      <p>Linotronic is the brand name for a high-res (generally 2400-3600dpi)<br>
      imagesetter, which outputs to paper or film. They are slowly disappearing and being replaced by CTP (computer-to-plate) technology, which skips the intermediate step of output to film, which involves strippers in the process. And, no, they are not THAT kind of stripper...</p>
