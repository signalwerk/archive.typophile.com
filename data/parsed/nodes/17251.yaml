      <p>Kris,<br>
      When Linotronic was commonly used and was easy to find, output was about $25 per letter-sized page. Today, the trick is just to find someone who will do it! It cost me about $300 to have four 11” x 17” films made and 3 contact prints of each made.</p>
      <p>Wishing you well down under dude!</p>
      <p> ChrisL</p>
