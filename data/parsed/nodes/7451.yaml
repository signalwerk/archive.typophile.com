    html: <p>You are quite lucky. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> Other people get "c" instead of "a" sometimes. <br>Do you have an option "Automatically sort glyphs" turned on in Preferences/Type 1 Export? It is quite iportant for OS X. <br> <br>Johnych</p>
    html_clean: <p>You are quite lucky. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> Other people get "c" instead of "a" sometimes. <br>Do you have an option "Automatically sort glyphs" turned on in Preferences/Type 1 Export? It is quite iportant for OS X. <br> <br>Johnych</p>
  - id: 50731
    user: 1333
    date: 2004-11-03T07:42:00
    date_raw: 3 Nov 2004 — 7:42am
    votes: null
    html: <p>Yes, Johnych, the "Automatically sort glyphs" was turned on.  <br>I guess I had to turn on "Select encoding automatically". <br>Thanks</p>
    html_clean: <p>Yes, Johnych, the "Automatically sort glyphs" was turned on.  <br>I guess I had to turn on "Select encoding automatically". <br>Thanks</p>
  - id: 50732
    user: 4926
    date: 2004-11-04T03:44:00
    date_raw: 4 Nov 2004 — 3:44am
    votes: null
    html: <p>You have to set "Always write custom encoding" in Preferences, "1252 Latin 1" as a codepage and "Roman" as a Mac Script in Font Info/Encoding&amp;Unicode/Supported Codepages. <br> <br>Regards, <br>Johnych</p>
