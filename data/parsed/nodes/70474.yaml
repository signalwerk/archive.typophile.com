    <p>Hi,<br>
    I was wondering if there is anyway to turn on auto-justification for nastaliq kashida ligatures in Indesign CS5? I already have added lots of kashida ligatures, and now I am trying to make them "appear" automatically when space adjusted. So I read through opentype tags, and found  table which does the job. Unfortunately, it is limited to only init, medi and fina forms... :(<br>
    "The jalt table maps the initial, medial, final or isolated forms to their corresponding alternate forms"<br>
    <a href="http://www.microsoft.com/typography/otspec/features_fj.htm" title="http://www.microsoft.com/typography/otspec/features_fj.htm">http://www.microsoft.com/typography/otspec/features_fj.htm</a></p>
    <p>Also I have seen another rare feature called "Stretched Alternate". But I am not sure what tag it uses in opentype. Any suggetions? :)</p>
