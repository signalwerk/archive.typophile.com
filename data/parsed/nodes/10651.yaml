    html: "<p>This topic probably needs a new thread, but I'll briefly  <br>describe the project: TypeTracker is more than a  <br>database of font names, but a general reference   <br>directory of fonts, designers, foundries and resellers.   <br>Each of these 4 databases will be cross-referenced and   <br>searchable with links to font samples and other  <br>relevant pages on the web.  <br>  <br>The owners of each entity will be able to modify their  <br>entry a la the directory at <a href=\"http://www.briarpress.org/cgi-bin/briarpress/showdirect.cgi?db=direct&amp;uid=default&amp;sb=2&amp;view_records=1&amp;Category=Type%2Ffoundries&amp;view_records.x=10&amp;view_records.y=2\" target=\"_blank\">Briar Press</a>. (I've been hoping to   <br>speak with the creators of BP about working with me to   <br>develop TypeTracker, but I'm open to ideas and   <br>collaboration from other designers and database engineers.)</p>"
