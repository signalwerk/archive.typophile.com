    html: "<p><i>If this is made publicly available everyone who  <br>ever used Impact would kick themselves for not having  <br>waited for Tyson.</i> <br> <br>Thanks... I guess... <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br><i>The only think that bothers me is the quick end to the  <br>descending 'J'. Can't it be lengthened without spacing  <br>issues?</i> <br> <br>Spacing heavy type is a problem because of J,T,L,F and  <br>the other characters that create \"holes\". But I think this  <br>can be done here, yes. <br> <br> <br><i>Rodolfo - Make it unicase with lowercase-glyph  <br>alternates and you have a buyer here.</i> <br> <br>You know something? That's exactly what I had originally  <br>thought of doing - especially because I didn't want to  <br>make a full UC + lc sets -, but ended up doing an UC-only.  <br>I'll think of it. <br> <br> <br>About the Tyson B treatment (this sounds scary! ;) :  <br> <br><img src=\"http://www.typophile.com/forums/messages/29/7276.gif\" alt=\"Tyson\"> <br> <br>It's all done in Photoshop: the image of the blurred  <br>characters has its tonal range flattened (I used 20%  <br>to 80%) and spots of \"blurred tone\" (one \"master spot\"  <br>created with the airbrush tool), in the light and dark  <br>extremes of the full range, are applied in the  <br>appropriate places (this manual part, through copy &amp;  <br>paste, took only a few minutes - especially since many  <br>of the spots fall at the same heights). The tonal range  <br>is normalized (to the base image's values), it's loaded  <br>as a selection, converted to paths and ... voil</p>"
    html_clean: "<p><i>If this is made publicly available everyone who  <br>ever used Impact would kick themselves for not having  <br>waited for Tyson.</i> <br> <br>Thanks... I guess... <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br><i>The only think that bothers me is the quick end to the  <br>descending 'J'. Can't it be lengthened without spacing  <br>issues?</i> <br> <br>Spacing heavy type is a problem because of J,T,L,F and  <br>the other characters that create \"holes\". But I think this  <br>can be done here, yes. <br> <br> <br><i>Rodolfo - Make it unicase with lowercase-glyph  <br>alternates and you have a buyer here.</i> <br> <br>You know something? That's exactly what I had originally  <br>thought of doing - especially because I didn't want to  <br>make a full UC + lc sets -, but ended up doing an UC-only.  <br>I'll think of it. <br> <br> <br>About the Tyson B treatment (this sounds scary! ;) :  <br> <br><img src=\"http://www.typophile.com/forums/messages/29/7276.gif\" alt=\"Tyson\"> <br> <br>It's all done in Photoshop: the image of the blurred  <br>characters has its tonal range flattened (I used 20%  <br>to 80%) and spots of \"blurred tone\" (one \"master spot\"  <br>created with the airbrush tool), in the light and dark  <br>extremes of the full range, are applied in the  <br>appropriate places (this manual part, through copy &amp;  <br>paste, took only a few minutes - especially since many  <br>of the spots fall at the same heights). The tonal range  <br>is normalized (to the base image's values), it's loaded  <br>as a selection, converted to paths and ... voil</p>"
