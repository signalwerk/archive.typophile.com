  html: "<p><img src=\"http://www.typophile.com/forums/messages/29/7243.gif\" alt=\"Tyson\"> <br> <br>Tyson A is a rather conventional grotesque, really. It was done  <br><i>very</i> quickly and I'm thinking of leaving it somewhat 'uncorrected',  <br>and not tweak it very much, except any glaring problem that you see. <br> <br>About Tyson B: it wasn't my intention to make a 'distressed' version  <br>of the face (my interest in distressed type is very low). In fact it's  <br>an experiment: to create ink- and light-traps <i>through blurring</i>.  <br>How did I do it? <br> <br><img src=\"http://www.typophile.com/forums/messages/29/7244.gif\" alt=\"Tyson\"> <br> <br>Tyson looks tough but is quite delicate in fact. You can use  <br>it to set all sorts of artsy things.</p>"
  html_clean: "<p><img src=\"http://www.typophile.com/forums/messages/29/7243.gif\" alt=\"Tyson\"> <br> <br>Tyson A is a rather conventional grotesque, really. It was done  <br><i>very</i> quickly and I'm thinking of leaving it somewhat 'uncorrected',  <br>and not tweak it very much, except any glaring problem that you see. <br> <br>About Tyson B: it wasn't my intention to make a 'distressed' version  <br>of the face (my interest in distressed type is very low). In fact it's  <br>an experiment: to create ink- and light-traps <i>through blurring</i>.  <br>How did I do it? <br> <br><img src=\"http://www.typophile.com/forums/messages/29/7244.gif\" alt=\"Tyson\"> <br> <br>Tyson looks tough but is quite delicate in fact. You can use  <br>it to set all sorts of artsy things.</p>"
