    <p>Headland One is a text typeface designed to be highly legible and comfortable for screen reading<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Headland_4425.jpg"></div> I would like comments and critique as I want to develop a print version with a smaller x height and an italic and I also want to revisit Amarach elsewhere on this forum. I would like to thank Eben Sorkin of Sorkin Types for his input because without him frankly it would not have happened.<p></p>
