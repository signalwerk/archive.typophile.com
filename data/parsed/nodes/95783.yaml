    html: |-
      <p>I'm going to guess that this is custom and hand drawn. Look here:<br>
      <a href="http://www.downeast.com/about/downeastenterprises" title="http://www.downeast.com/about/downeastenterprises">http://www.downeast.com/about/downeastenterprises</a></p>
      <p><em>"Fifty-nine years ago, the slim first issue of a regional magazine appeared on selected newsstands throughout the length and breadth of Maine. On the cover, a stylized woodcut of a Maine harbor was topped by a hand-painted logo with the words “Down East” — a reference to the practice of sailing downwind to the east in order to reach Maine from Boston during the great age of sail. The new magazine, which was loosely modeled on The New Yorker, was the brainchild of a Mainer named Duane Doolittle."</em></p>
      <p><img src="http://www.downeast.com/files/images/DE%20First%20Cover.thumbnail.jpg"></p>
