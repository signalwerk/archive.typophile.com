    html: |-
      <p>The Techni-Process Lettering Catalog, which bowfin cites on his website, is an excellent journey through the world of ’60s typography. Large ad agencies keep libraries of their tear sheets, which they may be kind enough to allow you to peruse, and any large library will have, at least, microfiche copies of ’60s magazines and newspapers.</p>
      <p>Perhaps easiest to obtain, Amazon is selling a 4-DVD set that contains every page of every issue of <em>Rolling Stone</em>, including the ads, for $53.44. Yes, the magazine began publishing in 1969, but the seventies didn’t truly arrive until the dawn of disco:</p>
      <p><a href="http://www.amazon.com/Rolling-Stone-Cover-First-Years/dp/0979526108" title="http://www.amazon.com/Rolling-Stone-Cover-First-Years/dp/0979526108">http://www.amazon.com/Rolling-Stone-Cover-First-Years/dp/0979526108</a></p>
