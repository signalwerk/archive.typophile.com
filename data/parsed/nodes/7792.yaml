    html: "<p>Mike, <br>Thanks for the info. <br> <br>Daniel Weaver,  <br>I trust you are trying to be funny or at least vent your angst towards the current NHL situation.  Perhaps you could at least spell \"losers\" correctly if you aren't going to positively contribute to the thread? <br> <br>FWIW, I contacted the jersey manufacturer citing the \"Latin Wide\" type in my correspondence and they responded that I had \"a good guess\" and that the actual Illustrator font name was \"Latin Wid D\".  I did a couple searches for that particular font and came up with a few hits... but I'm not sure how the URW Latin Wide D differs from the following: <br><a href=\"http://www.myfonts.com/fonts/urw/latin/\" target=\"_blank\">http://www.myfonts.com/fonts/urw/latin/</a> <br> <br>Any guess, or is this the same thing as the URW one? <br> <br>Thanks for the super quick response, guys! <br> <br>Regs, <br>Jeff</p>"
