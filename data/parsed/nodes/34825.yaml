    <p>Hi all,</p>
    <p>[My apologies for cross-posting across forums.]</p>
    <p>At my urging, the organization I work for has agreed to choose just one color of red for their logo and branding materials (when I started here there were four different colors of red being used inconsistently).  </p>
    <p>I am working with CS2 programs on a Windows PC, Windows XP, Service Pack 2.  The majority of our materials are print, and we have a small website that basically supports our printed material (curriculum for nutrition education) and is not emphasized as a marketing tool (yet).</p>
    <p>The director has settled PMS 199.  The problem is, 199 in process is not the same color (at all).  So, I need to create a process swatch for our four-color print jobs.  When I choose 199 in the old Pantone Solid to Process color library (Pantone 199 PC), I get a process swatch.  When I chose 199 in the new Pantone Color Bridge Coated Color Library,(also Pantone 199 PC), it shows as a spot color.  Am I missing something?  The colors in Pantone Color Bridge, marked PC, should be the process equivalent to the cooresponding spot color, no?</p>
    <p>In Illustrator, I can manually change the color to process in the swatch dialog box, but is that really just a "faux" process, similar to a "faux" italic in type?  Will this make the printer hiccup?</p>
    <p>Am I better off just creating a process swatch and globalizing it? </p>
    <p>Also, are there pitfalls to either swatch solutions I should look out for or discuss with my printer?</p>
    <p>Thank you so much for any and all input.</p>
