      <p>Hi all,</p>
      <p>Thanks for the comments; I always appreciate them!  </p>
      <p>Unfortunately, PMS 199 is here to stay. It doesn't have any black in it so it screens back without getting greyish (although, of course, it goes pink!).  If you look at the color bridge swatch fan (not the screen -- I never chose colors based on what they look like on screen) you'll see that the spot color translates into process fairly well.  C =0, M - 100, Y = 65 (formerly 62) and K = 0.  It is a much better transition than, say, 1787 C.  </p>
      <p>My question is this: Why is the swatch 199 in Color Bridge color library showing up as a spot color and not a process color in my files?  Aren't the Bridge colors (PC and UP) process?  </p>
      <p>Thanks!<br>
      zoya37</p>
