      <p>I've got an older version that doesn't have the RGB values in the swatch book.</p>
      <p>I think you will need to spec a Pantone process color rather than the PMS color to get the process mix you want. If you let the software do the conversion of a PMS color each software will make its own conversion.</p>
      <p>My point was that you can make a better match than what the Bridge or Pantone to Process swatch books show. Get a Pantone process book and compare it to the Pantone formula guide. That will get a good match that can be refined more if you want.</p>
