      <p>I don't know the color bridge technology, but you should pic a solid that will convert well to process.</p>
      <p>The Pantone guide, to me, is odd. I can often produce a better match with a custom mix. What I look for is a good synergy where the process match doesn't have any particularly small percentages of any process color. For example, no process color below 10%. That ensures that even low end projects/printers will be able to hold the mix well.</p>
      <p>It helps to have a calibrated process proofing system with all your apps talking ICC. Still, you might even run your mix swatches out from different workflows (PDF, Photoshop, etc) and see how consistently the mix swatch renders.</p>
      <p>Other tips would be to stay away from black in the swatch mix so the printer can focus on the density of the black for the type without scewing the color.</p>
