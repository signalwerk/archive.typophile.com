      <p>Gio,</p>
      <p>Linotype offers two Thai typefaces, both in OpenType format, and each with a Regular and Bold weight. These typefaces were only recently upgraded to OpenType format and re-released. In the digital photocomposition days of about two decades past, these fonts were used by all sorts of Thai publications. I suspect that Thai readers are still quite familiar with them.</p>
      <p><a href="http://www.linotype.com/256569/sukothai-family.html" title="http://www.linotype.com/256569/sukothai-family.html">http://www.linotype.com/256569/sukothai-family.html</a><br>
      <a href="http://www.linotype.com/256576/sirichana-family.html" title="http://www.linotype.com/256576/sirichana-family.html">http://www.linotype.com/256576/sirichana-family.html</a></p>
      <p>By clicking on one of the fonts, you can surf along to a glyph map, and examine each letter in some degree of detail (like <a href="http://www.linotype.com/256572/sukothairegular-charactermap.html" rel="nofollow">this</a>. If you know the Unicode value for the ch, it shouldn't be too difficult to spot.</p>
      <p>It is my understanding that Adobe InDesign CS3 supports Thai OT fonts now, although I don't know if the software can offer correct hyphenation or spell check. Linotype's Thai OT fonts probably work as well as any others in basic Microsoft apps, too.</p>
