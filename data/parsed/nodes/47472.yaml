      <p>I did a pitch for monsoon wines who are  a thai wine company a while ago to help them launch into the UK market and we managed to find 2 thai fonts that were free I think one was called 2006_iannnnnnISO and the other was sefer_ah which both worked on macs</p>
      <p>I still have the sefer one if you want me to email it over.  We had no idea about thai type so I ended up spending a few days with my head in various thai design books which was interesting.  Ive attached the design that was intended to go on the inside of the wine box that you open up for you </p>
      <p><a href="http://img.photobucket.com/albums/v57/lazcook/Insideofboxartwork_webready.jpg" title="http://img.photobucket.com/albums/v57/lazcook/Insideofboxartwork_webready.jpg">http://img.photobucket.com/albums/v57/lazcook/Insideofboxartwork_webread...</a></p>
