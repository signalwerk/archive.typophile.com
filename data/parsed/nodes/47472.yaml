    <p>Hello,</p>
    <p>I am looking to know more about THAI fonts.<br>
    I have been doing some research and I have found some resources, but I am unsure of their quality.<br>
    Basically what I am looking is to see variations of the "ch" low-consonant, and also to see different designs of quality thai fonts.</p>
    <p>I know that my computer uses Thonburi, (as a system font for thai?)<br>
    but are they other thai system fonts on a Mac?<br>
    Are there any big OT fonts that include THAI characters?<br>
    Does anyone know of good THAI font or thai foundries?</p>
    <p>Thanks for any comments or thoughts you ay have.<br>
    Best,</p>
    <p>Gio.</p>
