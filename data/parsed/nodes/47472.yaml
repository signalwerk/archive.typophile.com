      <p>Hello Gio and Everyone,</p>
      <p>I'm new to this site and not a typographer but I'm a native Thai person.<br>
      There are a few resources of Open Source Thai Fonts but you can download them from a list below </p>
      <p>1. <strong>4 National Fonts</strong> at NECTEC's site (National Electronics and Computer Technolgy Center) : <a href="http://lanta.giti.nectec.or.th/drupal/?q=node/231" title="http://lanta.giti.nectec.or.th/drupal/?q=node/231">http://lanta.giti.nectec.or.th/drupal/?q=node/231</a></p>
      <p>2. <strong>10 Tep Club Fonts</strong> : <a href="http://lanta.giti.nectec.or.th/drupal/?q=node/233" title="http://lanta.giti.nectec.or.th/drupal/?q=node/233">http://lanta.giti.nectec.or.th/drupal/?q=node/233</a></p>
      <p>3. <strong>13 SIPA Fonts</strong> : <a href="http://lanta.giti.nectec.or.th/drupal/?q=node/234" title="http://lanta.giti.nectec.or.th/drupal/?q=node/234">http://lanta.giti.nectec.or.th/drupal/?q=node/234</a> (Read license inside the pack)</p>
      <p>4. <strong>ThaiFonts-Scalable Package</strong> : <a href="http://linux.thai.net/projects/thaifonts-scalable" title="http://linux.thai.net/projects/thaifonts-scalable">http://linux.thai.net/projects/thaifonts-scalable</a> (Available in free licenses both binary and source files)</p>
      <p>5. <strong>Decorative Fonts</strong> : <a href="http://f0nt.com/download/" title="http://f0nt.com/download/">http://f0nt.com/download/</a> (Free Download but I'm not sure about license)</p>
      <p>Hope this help.</p>
      <p>Gibbo</p>
