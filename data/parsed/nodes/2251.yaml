    date: 2003-11-30T16:27:00
    date_raw: 30.Nov.2003 4.27pm
    votes: null
    html: <p>Yves, I've come across a few Mecanorma fonts on the <br>Agfa-Monotype website, but it's just been by chance <br>(searching for something else) and Fonts.com offers <br>no way, really, to do a search for Mecanorma fonts in <br>general (i.e., searching under MN or Mecanorma won't <br>work). <br> <br>I did find <a href="http://www.agfamonotype.com/about/legal.asp" target="_blank"> an entry</a> in the copyrights/trademarks, though. <br> Check about 2/3 of the way down the page. <br> <br>MN Normalise DIN is one of several fonts that are listed <br>there, but not actually offered for sale. <br> <br>According to <a href="http://www.myfonts.com/foundry/mecanorma/" target="_blank"> this</a> MyFonts page, Monotype licensed and <br>digitized some Mecanorma typefaces, which explains <br>their listing on the Fonts.com site. Anyone know the Trip <br>Productions/Mecanorma status today? <br><br></p>
    html_clean: <p>Yves, I've come across a few Mecanorma fonts on the <br>Agfa-Monotype website, but it's just been by chance <br>(searching for something else) and Fonts.com offers <br>no way, really, to do a search for Mecanorma fonts in <br>general (i.e., searching under MN or Mecanorma won't <br>work). <br> <br>I did find <a href="http://www.agfamonotype.com/about/legal.asp" target="_blank" class="link-external"> an entry</a> in the copyrights/trademarks, though. <br> Check about 2/3 of the way down the page. <br> <br>MN Normalise DIN is one of several fonts that are listed <br>there, but not actually offered for sale. <br> <br>According to <a href="http://www.myfonts.com/foundry/mecanorma/" target="_blank" class="link-external"> this</a> MyFonts page, Monotype licensed and <br>digitized some Mecanorma typefaces, which explains <br>their listing on the Fonts.com site. Anyone know the Trip <br>Productions/Mecanorma status today? <br><br></p>
