    html: <p>The description embedded in the font file (probably written by Robert Norton)  <br> <br>&gt; 1965. Designed for the Stephenson Blake type foundry. A very heavy, narrow, sans serif face intended for use in newspapers, for headlines and in advertisements. Aptly named, this face has a very large "x" height with short ascenders and descenders. <br> <br>As one of the Microsoft 'Web Fonts' it's become very widely installed. It's preinstalled on Windows and Mac PC's and commonly installed with the other Web fonts by Linux users.    <br> <br>Si</p>
