    <p>Hello,</p>
    <p>I'm trying to install robofab into fontlab 5.1.<br>
    I am following this method : <a href="https://vimeo.com/36877594" title="https://vimeo.com/36877594">https://vimeo.com/36877594</a><br>
    but when I am trying to install the Font Tools package I get this message in the terminal in the middle of the install :</p>
    <p>unable to execute llvm-gcc-4.2: No such file or directory</p>
    <p>And when I am processing this command<br>
    from robofab.world import CurrentFont<br>
    in the macro window in Fontlab, instead of having a clear output window, I get this message :<br>
    "can't import dialogs_fontlab_legacy2"</p>
    <p>I read that I had to made a clear install of xcode, but nothing changed. I am stucked here as I am not an expert in the terminal.<br>
    If it can be of any help I join the terminal window of the install.</p>
    <p>thanks</p><div class="imageWrap"><img src="http://typophile.com/files/termi_5076.jpg"></div><p></p>
