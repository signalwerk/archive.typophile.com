    html: |-
      <p>Nothing looks better than Palatino + Optima, and you really can use them pretty much everywhere. Still, their formal, classical design might not be the ideal fit in a given context: for example, Modernism calls for a neutral or effectively invisible face like Helvetica, where Palatino and Optima have too much character to avoid drawing attention to themselves. High fashion calls for an artificial face like Bodoni, where Palatino is too old-fashioned, natural, and even friendly, and Optima is too classical. There are good reasons why Helvetica and Bodoni are such clichés in these contexts. ;^) And all of the above faces are too formal for folk art or "Arts and Crafts." Type is a vehicle, and you want to arrive in the right style for the party you're attending.</p>
      <p>That said, Palatino is a pretty safe choice, and I'd use it all over if it had better support for linguistics. (Gimme the full IPA, please!) Actually, that's a good point to elaborate upon... if you want to mix Latin and other letters in a harmonious multilingual style, you'll need a unified face, which severely limits your options -- you might be stuck with Times New Roman.</p>
