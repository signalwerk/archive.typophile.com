      <p>hrant, yes you are right I am a woman and my name does mean "high." :) As for the text, well I do have a lot of text, I'd say that in some areas such as the introduction and conclusion there is just text, whereas in other areas such as the precedents and context, the ration is about 60:40 (text:imagery). The design process part has more imagery, but it varies from one section to the other, so maybe 30% or 20%  is text in that chapter. The issue is that I have quite a few "styles" of imagery/illustration. I have photographs of workers (as part of a photo analysis); images of materials, my process, the prototypes (in a studio setting with a seamless background); and the final concept suit worn by a model in a desert setting. I also have illustrations. Illustrations of indigenous desert wear, drawn and then rendered and colored (filled in with fabric textures)  and fashion-style pencil sketches  - there are a lot of things going on but each section has one form/style of image and there is a progression from raw sketch to polished studio shot.</p>
