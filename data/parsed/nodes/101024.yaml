    html: |-
      <p>I don't know if it's "wisdom" - more like a combination of personal taste* and many years of paying attention: Palatino is neither neutral enough nor contemporary enough. Using it for this project is like casting a stage actor from the 50s in a gritty 21st century movie. Is there really a shortage of good movie actors that people can relate to in 2013? BTW, it's also not really a text face - Aldus is actually Palatino's bookworm sister.</p>
      <p>* Which means I don't think you "should dislike" anything just because I do.</p>
      <p>As for Optima, it's overused for so much hyper-feminine stuff, plus it's so incredibly gray... It's like one of those old women with purple hair. Avoid.</p>
      <p>BTW, I think re-kerning Papyrus was not at all a bad idea.</p>
      <p>hhp</p>
