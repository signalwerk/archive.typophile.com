      <p>Hello everyone,<br>
      Thank you hrant, jwchen, Té Rowan and jafo for your suggestions and comments. Avance and orpheus look good. Since you advised against Palatina and Optima, I will stay away from them:)What do you think of Matrix II, Scala, Eureka, Nexus or Fairplex? I looked at Adobe Caslon and Adobe Jenson, but they seem too somber that's why I thought maybe a slab serif would be better?</p>
      <p>I will try and give you more information about my thesis, so that you have a better picture. BTW the thesis is in English and will not include another language.</p>
      <p>In brief, the thesis deals with the problem of heat stress in migrant workers in Qatar by designing a concept suit that facilitates thermal comfort. The thesis/concept suit has two protagonists: pragmatic function and conceptual form. The function uses indigenous desert clothing systems, heat exchange mechanisms and the body's thermo-sensitive regions as well as current technical and smart materials to improve thermal comfort. The form borrows from fiction—superheros to be exact—to signify the importance, of the otherwise invisible migrant worker, to the Qatari economy. </p>
      <p>so basically, thesis elements are: indigenous, low tech, superheroes, masculine, science, fashion<br>
