  html: |-
    <p>I can't find ANY on the web!  All of the outline fonts are transparent in the middle.  I really need it to be solid white with a black border - preferably something similar to arial. <br> <br>However, when I look up subtitling fonts, it only shows downloads for things like DVD creation programs and games. <br> <br>All I want to do is be able to add text quickly to my powerpoint presentations and have beautiful photos as the background. <br> <br>Is there any way I can download a font for my computer that is solid white with black outline?  Thanks! <br> <br>Also, I don't have Adobe.  I do have paintshop pro 7 - if I could create my own font with that limited program, I'd do it.  TIA</p>
