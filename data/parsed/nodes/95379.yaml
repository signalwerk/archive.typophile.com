    <p>I am using Class kerning put I kern OAO and then use the macro to copy those values to AC, AG, AQ etc.</p>
    <p>It speeds the process up and ensures I don't miss pairs</p>
    <p>#Upper/UpperKern---------------<br>
    #<br>
    from robofab.world import CurrentFont<br>
    f = CurrentFont()<br>
    kerning = f.kerning<br>
    #<br>
    if kerning[('A','O')]:<br>
    	AO = kerning[('A','O')]<br>
    	kerning[('A','C')] = kerning[('A','G')] = kerning[('A','Q')] = kerning[('A','OE')] = AO</p>
    <p>if kerning[('O','A')]:<br>
    	OA = kerning[('O','A')]<br>
    	kerning[('D','A')] = kerning[('Q','A')] = OA</p>
    <p>… …</p>
    <p>Problem with this macro is it doesn't work with MM fonts. The value from one master is copied to the other.</p>
    <p>The value for 'AO' could be different across masters but the macro copies the same value to both masters.</p>
    <p>The Fontlab API KerningPair class says it's MM compatible but doesn't give any examples of how to use it.</p>
    <p><a href="http://e-font.de/flpydoc/" title="http://e-font.de/flpydoc/" class="link-external">http://e-font.de/flpydoc/</a></p>
    <p>Does anyone know how I could use FL's API to copy the value of kerning pairs to other pairs.</p>
