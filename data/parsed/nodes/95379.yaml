      <p>You are using Robofab for your macro, so you’d want to look at the Robofab docs rather than the FontLab API: <a href="http://www.robofab.org/objects/kerning.html" title="http://www.robofab.org/objects/kerning.html">http://www.robofab.org/objects/kerning.html</a></p>
      <p>I’m not sure if Robofab handles MultipleMaster VFBs.</p>
      <p>Another solution would be to simply put C, G, Q, Œ etc. in the right side kerning class for O ;)</p>
