    html: <p>There are not separate encodings for smallcaps since they are not their own letter, just a form of the encoded glyphs that are associated with them via the opentype feature code and classes. I would name your smallcap glyphs the same as the glyph they refer to plus an extension as you have shown above. I personally use ".sc" because it is brief yet clear to me. This way, I can see many more glyphs in a string than if I use something longer like ".small"--that is just my preference.</p>
