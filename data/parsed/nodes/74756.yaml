      <p>Various folks' comments and questions:</p>
      <p>&gt; Put your {calt} feature code for things you don't want on by default in a stylistic set.</p>
      <p>?  That would be 'salt' instead. 'calt' is for contextual/connecting alternates.</p>
      <p>Similarly, 'clig' is for contextual ligatures.</p>
      <p>&gt; As an aside, I wonder why Adobe 'broke' the ligature feature in InDesign when 'tracking' is implemented.</p>
      <p>Because when the text is tracked too much, typically the ligatures tend to start looking as if they are spaced incorrectly. It was Eric Menninga's idea, but I supported it. I think I ran it by the rest of the type team at the time, but my memory is a bit fuzzy. This was no later than InDesign 2.0 around summer 2002.</p>
      <p>&gt; You can -minus tracking all you want and ligature(s) or substitutions remain intact,</p>
      <p>Really? That is arguably a bug, but then again, when do you have minus tracking more than about -20 or so?</p>
      <p>Regards,</p>
      <p>T</p>
