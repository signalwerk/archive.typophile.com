    html: |-
      <p>As an aside, I wonder why Adobe 'broke' the ligature feature in InDesign when 'tracking' is implemented. You can -minus tracking all you want and ligature(s) or substitutions remain intact, but just try to +plus tracking (usually +20 to +30) and the ligature automatically breaks and reverts to individual keystrokes.</p>
      <p>In 'Illustrator' this doesn't occur, and in QuarkXPress you can adjust the parameters when ligatures revert back to keystrokes. I know the thinking at Adobe was that they are doing the right thing...after a word is tracked open too much the ligature looks 'odd' so they break the connection.</p>
      <p>But, really, this does us all a disservice and prevents us the 'type designers' and the 'font users' from controlling how they want the font to work? Yes/no?</p>
      <p>My problem now is that even if I use the 'dlig' feature table for all my letter combination substitutions, they will revert as soon as the copy is tracked more than (+20) or so. And, there is no way that I can prevent this or control the event.</p>
      <p>Any ideas?</p>
