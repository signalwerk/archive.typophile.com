    html: |-
      <p>Bdotaccent, Ddotaccent, Fdotaccent, Pdotaccent and Tdotaccent are used in traditional Irish typography. I'm not aware about Ldotaccent. There is Ldot, used in Catalan. L' is the correct form to represent Lcaron in Slovak.</p>
      <p>There is no way to control a feature on/off from the font code. This is an OT definition and would be implemented the same way by all apps.</p>
