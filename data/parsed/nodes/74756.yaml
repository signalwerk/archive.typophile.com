    html: |-
      <p>Alex, I'm developing a font with extended Latin support and faced similar difficulties.</p>
      <p>Probably, the best place to begin with is <a href="http://blogs.adobe.com/typblography/2008/08/extended_latin.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this post</a> from Adobe's Typblography. You may use these glyph lists as a reference, although you can freely mix glyphs from any Latin-N group.</p>
      <p>To add glyphs to your font in FL, use Ctrl+G and type the glyph names. If your base glyphs (let's say, A and acute) have anchors defined, FL will follow these marks to define diacritical position (when creating Á). Otherwise, it will centralize the diacritic. In view of this, a good practice is to define anchors to all plain glyphs and all diacritics before creating the accented characters.</p>
      <p>The pages mode will not include automatically the glyphs you need.</p>
      <p>About the ligatures, clig is a feature on by default in all ID versions. If you are creating special ligatures which your users may prefer not adopt, there is dlig (dscritionary ligatures). Usually, standard ligatures (like ff, fl and fi) are defined in clig feature, while more unusual ones (like ct, st, Th) are defined in dlig.</p>
      <p>You may also find useful <a href="http://www.microsoft.com/typography/otspec/features_ae.htm" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this link</a> about OT features definition.</p>
      <p>Specifically about language support, I did research in Wikipedia for each target language alphabet. Another good information on this is available <a href="http://diacritics.typo.cz/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">in this site about diacritics</a>.</p>
