      <p>Alex, I suggest you to download the PDF Unicode charts for Latin (and also other blocks your font would support, as combining diacritics or symbols). They are here: <a href="http://www.unicode.org/charts/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.unicode.org/charts/</a></p>
      <p>You can search for any character using PDF search field. Just note that Unicode charts does not uses the naming "Adotaccent". They adopt "A with dot above" as the glyph description. Anyway, you can find the glyphs easily in the Latin blocks (there are a total of seven blocks of Latin script).</p>
      <p>Probably late October we will have a new Unicode version available (6.0). Anyway, no relevant changes were proposed to Latin blocks (as far as I remember, there is just the inclusion of a pair of African special characters proposed).</p>
