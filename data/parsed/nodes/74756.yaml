    <p>I'm hoping that someone might be able to assist me with a few FontLab 'OpenType" feature questions:</p>
    <p>1) If I would like to expand my 'latin' base character sets to include all possible "Eastern European" accented character sets, do I just go by the 'code pages' set up in FontLab to create these various 'accented' sets? Examples would be, MacOS CentralEurope, ISO 8859-3 Tu, Gal, Esp, Latin 3 and ISO 8859-4 Baltic Latin 6. These are the 3 sets that I have created. But, looking at other 'Pro' fonts available for sale online, I see additional 'glyphs' offered such as: Aringacute, AEacute, Ldot, Oslashacute,  Wacute, Wcircumflex, Wdieresis, Wgrave, IJ, ij, among others (plus lower case for all these as well). Is there a 'universal' unicode list that I should be following instead? Why I'm confused somewhat, is that these additional 'glyphs' referenced above do not seem to appear in FontLab's 'code pages'. Please advise. Thank you.</p>
    <p>2) This particular series of typefaces will also incorporate hundreds of additional 'alternate glyphs' and letter combinations to create special visual combinations. I plan to use 'clig', contextual ligature feature table, in order to access all these alternates and combination letter forms. I guess this is the proper table setup to use? No other table setup in FontLab allows 'multiple' glyphs to be substituted by another 'glyph' except a 'ligature-table'. Right? Anyway, I've also noticed that when I create this Opentype font and test in InDesign the feature 'clig' table is automatically on as default. This may confuse some users who do not want to see glyph substitutions as they start to type. I see that you can 'toggle' the feature table, 'on' or 'off', but, is there a way to set this feature 'off' as a default, and allow a user to turn on if desired? I think this would be better solution. Or, should I create a separate font called 'plus' at the end of font name to offer all these additional expert sets? Any ideas or suggestions would be greatly appreciated. Thank you.</p>
    <p>3) And, final question: has anyone compiled an extensive 'latin' list of 'glyph' letter combinations. Example, double letter, triple letter, and so forth, letter combinations that could be substituted for artistic combinations? I've been using an online dictionary to lookup all possible letter combinations to build such a list. But, if someone has already gone through the effort why reinvent the wheel, so to speak. Much appreciated if you could point me to some such resource.</p>
    <p>Many thanks to everyone, in advance, for any advise on these topics.</p>
