      <p>I also use .sc for the same reason. And what dezcom described equally applies to petite caps, swashes, tabular figures or alternate design to given glyphs (if your font includes these sets).</p>
      <p>Correspondence between small caps and "normal" glyphs is made just through classes and OT features (c2sc and smcp).</p>
      <p>Be aware OT replaces glyphs according to its position in the class. So, your 15th glyph on a class will be replaced by the 15th glyph on the other class you are using –no matter if one is Eacute and other is Edieresis.sc.</p>
      <p>This becomes important because there are glyphs without corresponding lowercase or uppercase (German long s, G inverted comma above, Ezsett, etc).</p>
