    <p>Hi all,</p>
    <p>My letterpress co-conspirator and long time friend Richard Lawrence is running a fantastic course at St Bride near Fleet Street in London. They're not free, but he's worth it, as is St Bride Library – it's a national treasure and one of the best printing and typography libraries in the world!</p>
    <p>'Richard Lawrence has been printing for more than 30 years. Most of his work is ephemeral. He gives printing demonstrations and teaches practical classes for students and others. Richard also works with artists such as Stanley Donwood of Radiohead fame.'</p>
