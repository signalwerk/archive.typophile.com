    <p>My new book, <a href="http://parallelstrokes.com/" rel="nofollow">Parallel Strokes</a>, is available now via the <a href="http://parallelstrokes.com/" rel="nofollow">book website</a>. It isn't officially being released for a week, but I figured Typophile readers should have a chance before other folks. </p>
    <p>About Parallel Strokes:</p>
    <p><a href="http://parallelstrokes.com/" rel="nofollow">Parallel Strokes</a> is a collection of interviews with twenty-plus contemporary typeface designers, graffiti writers, and lettering artists around the world. The book is introduced with a comprehensive essay charting the history of graffiti, its relation to type design, and how the two practices relate in the wider context of lettering.<br>
    Interviews within include conversations with pan-European type design collecitve <a href="http://www.underware.nl/site2/index.php3" rel="nofollow">Underware</a>, Japanese type designer <a href="http://www.linotype.com/" rel="nofollow">Akira Kobayashi</a>, American graffiti writer and fine artist Barry McGee/Twist, German graffiti writers <a href="http://edfella.com/" rel="nofollow">Daim</a> and <a href="http://seakone.com/" rel="nofollow">Seak</a>, American lettering artist, graphic designer and design eductor <a href="http://edfella.com/" rel="nofollow">Ed Fella</a>, among others. Parallel Strokes is an enquiry into the history, context, and development of lettering today, both culturally approved and illicit.</p>
    <p>Full list of interviewees:</p>
    <p><a href="http://www.linotype.com/" rel="nofollow">Akira Kobayashi</a><br>
    <a href="http://www.underware.nl/site2/index.php3" rel="nofollow">Underware</a><br>
    <a href="http://edfella.com/" rel="nofollow">Ed Fella</a><br>
    <a href="http://www.deltainc.nl/indexdeltainc.html" rel="nofollow">Delta</a><br>
    <a href="http://jinscoe.com/" rel="nofollow">Jerry Inscoe/Joker</a><br>
    <a href="http://brandnewschool.com/" rel="nofollow">Jens Gehlhaar</a><br>
    <a href="http://daimgallery.com/" rel="nofollow">Daim</a><br>
    <a href="http://seakone.com/" rel="nofollow">Seak</a><br>
    <a href="http://reala.se/" rel="nofollow">Jonas Williamsson</a><br>
    <a href="http://handselecta.com/" rel="nofollow">Handselecta</a><br>
    <a href="http://taubaauerbach.com/" rel="nofollow">Tauba Auerbach</a><br>
    <a href="http://taubaauerbach.com/" rel="nofollow">Lady Pink</a><br>
    <a href="http://www.blackatelier.com/" rel="nofollow">She One</a><br>
    <a href="http://theseventhletterstore.com/" rel="nofollow">Eklips AWR/MSK</a><br>
    <a href="http://ezrali.com/" rel="nofollow">Eskae</a><br>
    <a href="http://www.graffiti.org/renos/index.html" rel="nofollow">Renos</a><br>
    <a href="http://www.mikegiant.com/" rel="nofollow">Mike Giant</a><br>
    <a href="http://www.kazemag.com/" rel="nofollow">Chaz Bojorquez</a><br>
    <a href="http://en.wikipedia.org/wiki/Barry_McGee" rel="nofollow">Barry McGee/Twist</a></p>
    <p>The result of six years of research in the combined arts of lettering, graffiti, and typeface design, Parallel Strokes is a collection of interviews some of the best letterform creators in the world today.</p>
    <p><a href="http://www.kazemag.com/" rel="nofollow">Chaz Bojorquez</a> talks about the origins of barrio graffiti in Los Angeles and the evolution of the craft. Fellow Angeleno, vernacular graphic designer E<a href="http://www.edfella.com/" rel="nofollow">d Fella</a>, speaks about his history in lettering and how he earned the title “The King of Zing” in Detroit design and illustration circles. Famed Japanese type designer <a href="http://linotype.com/" rel="nofollow">Akira Kobayashi</a> discusses Roman and Japanese letterforms while showcasing a lifetime of type design work. European graffiti writers <a href="http://daimgallery.com/" rel="nofollow">Daim</a>, <a href="http://seakone.com" rel="nofollow">Seak</a>, and <a href="http://deltainc.com/" rel="nofollow">Delta</a> share their thoughts on dimensional graffiti lettering while American graffiti writer <a href="http://mikegiant.com" rel="nofollow">Mike Giant</a> talks about vernacular lettering, typeface design, and the evolution of graffiti handstyles.</p>
    <p><a href="http://parallelstrokes.com/" rel="nofollow">Parallel Strokes</a> is richly illustrated throughout, featuring copious previously unpublished work by the interviewed artists, as well as supplementary illustrations and photographs detailing contemporary and historical trends in graffiti and type design.</p>
    <p>The first 100 orders come with a two color 17" x 20" Parallel Strokes poster printed using recycled paper and soy inks at Portland, Oregon's Pinball Publishing.</p>
    <p><a href="http://parallelstrokes.com/" rel="nofollow">Parallel Strokes</a> is 244 pages thick and available for <a href="http://parallelstrokes.com/" rel="nofollow">$20</a> with free shipping worldwide.</p>
