  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/real_vs_px_5388.png"></div><br>
    The image above shows a bold sans serif on the left, and a grid fitted version of the same typeface on the right. The latter is adjusted so that every stem lands on a whole pixel when displayed at 8px size. (One pixel = 125 units)<p></p>
    <p>Below, I’ve attached an image showing the rendering in OSX and Windows.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ff_vs_chrome_5228.png"></div><p></p>
    <p>At these sizes you have very little control over spacing and the shapes will look crude if the web user for some reason decides to resize the text. However, I can imagine designing for a bigger size might work quite well. You’ll get improved rendering at the intended  size, and with hinting you won’t lose much compared to other fonts if the user zooms in or out.</p>
  html_clean: |-
