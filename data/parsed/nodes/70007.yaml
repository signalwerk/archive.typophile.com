      <p>&gt;... but they are centered on a pixel. </p>
      <p>I go by Frutiger's theory of sharp left sides, and do not center the stem on a pixel. </p>
      <p>&gt;... all glyph widths (with sidebearings) adds up to the nearest pixel value</p>
      <p>I go by someone else's theory of whole-pixel widths unless under designed control. </p>
      <p>&gt; l’m also wondering about that ear. </p>
      <p>Not to worry. This is a fairly typical example of  what happens when clarity is presented. When I started this kind of demo, someone else was concerned that my fonts were not protected enough to look this good. ;)</p>
      <p>Cheers!</p>
