    html: <p>Frank, in FontLab's TrueType/OpenType generate options, there is an option to 'Autohint unhinted glyphs'. You should see whether this is checked; if it is, then FontLab will have first applied its PS autohinting and then converted these hints to TT instructions. For your purposes, you probably want to turn this option off.</p>
