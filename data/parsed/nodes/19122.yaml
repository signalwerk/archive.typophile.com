      <p>Thanks a lot. I am going to look at the things you have noticed, and try to correct  them. I have already tried some things you mentionned, and made some choices. I prefer the tops of the letter as it is here than parallel with the baseline, a possibility i have tested — i find it too rigid. The inside of the C has been a big problem, i have tested several possibilities, and i'm not happy with the current state, but i don't really know how to improve it… by making it rounder ? About the "k" leg, i had made it parrallel with the other vertical lines but it didn't work well, so maybe the problem is the angle is not different enough from the vertical lines one ?<br>
      Thanks a lot again, i'm working on it.</p>
