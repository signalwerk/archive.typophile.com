      <p>A couple of things I would look at are the inside bottom of the counter of the c, the angle of the leg of the k, and make the ba ligature a bit broader. I would also look at how the tops of the letters and the dot on the i look if they are parallel with the baseline. On the outlined version I would look at some of the nicks and bumps, especially at the bottom and the i.<br>
      Tim</p>
