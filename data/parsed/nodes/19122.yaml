      <p>Sweet. If I had to be critical I would say that the "k" is a bit too cap "R"ish looking. I think it also breaks up the flow a bit as it has a horizontal aspect to it in the center, that the rest does not. Idid a screenshot an explored the issue for a couple of minutes, this is a direction I would suggest trying, although I am not sure it would solve the issue of it looking "R" ish. It does however deal with the horizontal issue.<br>
