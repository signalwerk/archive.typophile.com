    <p>Hey guys,</p>
    <p>Just some simple advice needed here from Typophiles far greater than myself.</p>
    <p>I'll be rebranding a Bookshop soon that involves an interior revamp along with a new logotype that dictates a boutique, well known, approachable, fully servicing store with ties to the core of books, type and their history.</p>
    <p>It's called "The Bookshop at Caloundra" with emphasis being placed on the words "The Bookshop".<br>
    We're running away from the disjointed, unconnected feel of large chains and department stores for obvious reasons and want to connect with real book lovers.</p>
    <p>I've got Caslon Graphique OT on my mind, its a start but I feel like there's a lot more out there with a more refined but strong feel.<br>
    <a href="http://www.fontshop.com/fonts/singles/elsnerflake/caslon_graphique_ot/?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=48&amp;sample_text=The%20Bookshop&amp;ft=liga&amp;acs_pt=32" title="http://www.fontshop.com/fonts/singles/elsnerflake/caslon_graphique_ot/?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=48&amp;sample_text=The%20Bookshop&amp;ft=liga&amp;acs_pt=32">http://www.fontshop.com/fonts/singles/elsnerflake/caslon_graphique_ot/?&amp;...</a></p>
    <p>What typefaces have you got in mind? I wouldn't mind having an option that pairs well with a sans-serif also.</p>
    <p>Dan.</p>
