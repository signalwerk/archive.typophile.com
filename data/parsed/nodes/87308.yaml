    html: "<p>My take: why don’t you go for something really contrary to the usual identity programmes? I would explore an identity where the tagline ‘at Caloundra’ would be in a certain (fixed) typeface and the more important part ‘The Bookshop’ would vary all the time, rotating through a certain amount of different and distinctive typefaces. This way you can accentuate certain periods, certain genres, etcetera.</p>"
