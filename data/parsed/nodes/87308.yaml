      <p>I love the idea Bert, like the Typophile header hey? I don't think its feasible for the brief, it needs to be low maintenance and low involvement for me after the fact and of course, on a budget.</p>
      <p>Riccardo I think you're right. I'm sure it was the weight that sold it the first time, I would like to keep tradition and in fact use a font with some history, something that book and text lovers alike can relate to and also represent their experience and knowledge in the industry (although the industry is far removed from its traditions these days).</p>
      <p>Bezler love the Windsor in context video. I ended up spending the last 20 minutes clicking on related videos and I don't even like cats.</p>
      <p>I'm looking for something I can embellish with gold ink down the spine of the "B" for instance and accents on other characters.<br>
      Also I think its important to use sentence case although if the shoe fits...</p>
