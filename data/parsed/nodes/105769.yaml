    html: <p>The loop of the L looks hesitant and weak in comparison to the sharp quickness of the R. You should probably lose the loop and make the L of two strokes. This will make it easier to elongate the bottom stroke across the word to balance the other underline. Since they will be near each other, plump the end of the underline and shape it to look similar to the end of the L, rotationally.</p>
