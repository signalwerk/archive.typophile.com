      <p>My guess would be hand-drawn, because of the way the letters 'st' interact, and the general very casual style. When there are no repeated letters it's almost impossible to be sure, because OpenType fonts now have many ligatures and alternates that could be used. My other data point is that it doesn't look familiar, for whatever that's worth.</p>
      <p>- Mike Yanega</p>
