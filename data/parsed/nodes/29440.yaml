    html: <p>i like this quite a lot. what i like best is that it doesn't feel like a monowidth font when reading it. excellent! I find the sharp apex of the A distracting. Are those spurs in places supposed to be there? they feel a bit like they're there on mistake; I like them, but the seem inconsistent. Some of the accents (acute, grave and the lc caron) feel dimuitive to me. I think you did a good job on the eth, but i'm not a native Icelandic reader. Also, <a href="http://www.microsoft.com/typography/developers/fdsspec/uppercase.htm" rel="nofollow">the capital Eng</a> is the preferred shape for Hausa, but not for Sami (if that's important). more later...</p>
