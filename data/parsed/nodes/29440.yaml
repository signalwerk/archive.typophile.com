    html: |-
      <p>Wow...I'm really impressed. This is really pleasant, and with the details on letters like g, t, and v it even approaches friendly.</p>
      <p>I agree with Paul that I don't understand the logic behind the inconsistent use of the microserifs, especially in the uppercase (why on the top of the H but not the bottom? why on the lower arm of the Z but not the L? etc). I also think that the microserif on the r should be a little more blunt (like on the s). </p>
      <p>While I'm on the lc r, I would think again about removing the foot serif that I saw in Xavier Noria's screenshot; I kind of liked it and it helped fill in the whitespace a little bit. On the other hand, I understand your desire to keep it as sans-y as possible.</p>
      <p>Also, Is there a way to translate the subtle curvature of the lowercase diagonals to their uppercase counterparts to soften them up just a bit?</p>
      <p>I admire how you've paid attention to how this looks in various programming languages on screen, and not just in natural langauges on paper.</p>
      <p>David</p>
