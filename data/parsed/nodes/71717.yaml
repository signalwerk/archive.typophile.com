      <p>I'd definitely play with the first and third ones in the second column, the others are a bit simplistic and for some reason they seem horribly familiar to me somehow. I agree with the others  on the colours, the alternating colours on the text make the words jump, it's not very pleasing to the eye.</p>
      <p>(BTW, On a completely different note (is it the company with the current orange/green website with the bizarre font?) you might want to suggest to them that they make a definite choice between "1st" and "First" (I see you've used both) and stick with it, everywhere. It's their name, and as far as establishing that name and making it findable, it would be handy if they decided on one or the other.)</p>
