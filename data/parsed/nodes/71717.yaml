    <p>Hello, I am new to typophile and figured i would get my feet wet with a critique.  This is a logo I am working on for a mortgage company.  They are looking for an upgrade from their current identity and would like the new look to reflect power, and look new and clean.  The color pallet was chosen by the customer as well as the general look and imagery. He has a specific look in mind similar to that of "Nation's Plus".  I would appreciate and constructive criticism.  Thanks.</p>
