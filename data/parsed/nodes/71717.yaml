      <p>Lets start here: blue retreats and red comes forward. Your words are competing on alternating planes, and it's chaotic. That said, it's quite valuable to work strictly in black and white and finalize the design before adding color. </p>
      <p>Right now, none of them stand out. They're all too crowded and unbalanced. Keep simplifying. An old professor once said "you'll know you're done when there's nothing left to take away, and your message is still in tact."</p>
