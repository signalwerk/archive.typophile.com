      <p><em>I feel like one of the bottom corners of J should be rounded. I favor the left one, to make one of those leaf shapes.</em> | Heh. I was just thinking "not the left one; that would make a leaf shape, which would be weird." Best to just try it both ways. Maybe there's somewhere else to make a leaf shape so it's not the only one. I guess the /R/ has something close (that's a really well refined glyph, by the way)</p>
      <p>I agree with Miss Tiffany's comments, except about /X/. The counters look better in the outline version, though. Not sure why, but they seem to fit there. Maybe curve just the top left of the /S/?</p>
      <p>I'd love to see a set of Katakana/Hiragana in this face. I don't expect you to do it, but it would be awesome.</p>
