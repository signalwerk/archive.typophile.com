      <p>@Lex Kominek - <a class="freelinking external" href="http://new.myfonts.com/fonts/fontmesa/gille-classic/" rel="nofollow">Gille Classic</a> I believe is what this font <em>should</em> have been. However,<br>
      @Florian Hardwig - I believe you are right in pointing out <a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/madame/?testdrive=dock%3Dfalse%26size%3D72%26w%3D720%26src%3Dcustom%26text%3DgG4eE3nNuUiInNeE3%26fg%3D000000%26bg%3Dffffff%26goodies%3Dot.liga%26seed%3D23?refby=mfde" rel="nofollow">Madame</a>. Looking at a blown up version of the image I posted, the 'U' and the splits in the E's match <a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/madame/?testdrive=dock%3Dfalse%26size%3D72%26w%3D720%26src%3Dcustom%26text%3DgG4eE3nNuUiInNeE3%26fg%3D000000%26bg%3Dffffff%26goodies%3Dot.liga%26seed%3D23?refby=mfde" rel="nofollow">Madame</a> exactly.</p>
      <p>@NJMcLellan - That looks to be the font, just modified in height. Thanks for finding <a class="freelinking external" href="http://www.dafont.com/dream-orphans.font?nb_ppp=50&amp;text=Ogallala" rel="nofollow">Dream Orphans</a>.</p>
      <p>Lex, Florian, and NJ - Thank you very much for helping me!</p>
