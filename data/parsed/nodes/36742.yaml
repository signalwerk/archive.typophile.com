    <p>There is a PDF file showing its main characteristic features. </p>
    <p>cheers,</p>
    <p>Manuel Corradine<br>
    <a href="http://www.corradinefonts.com" title="www.corradinefonts.com">www.corradinefonts.com</a></p>
