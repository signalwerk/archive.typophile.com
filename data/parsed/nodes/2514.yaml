    html: "<p>This is pretty comprehensive. att.com web style. <a href=\"http://www.att.com/style/\" target=\"_blank\">http://www.att.com/style/</a> <br> <br>Here's ABB's. It looks like it only likes IE 6 as it seems to do some kind of Wizard thing. <br><a href=\"http://www.abb.com/global/gad/gad01638.nsf/welcome.html\" target=\"_blank\">http://www.abb.com/global/gad/gad01638.nsf/welcome.html</a> <br> <br>A suprising number of Universities have their ID/Graphics systems online. Use Google and Search <b>University Identity</b> and <b>University Graphic Identity</b>. These can be good when well done because they span disciplines, the sports teams etc. <br> <br>Here's Diebold: <a href=\"http://www.diebold.com/idmanual/\" target=\"_blank\">http://www.diebold.com/idmanual/</a> <br> <br>Here's a concise one from Wiley Canaada: <a href=\"http://www.wileycanada.com/WileyCDA/Section/id-3511.html\" target=\"_blank\">http://www.wileycanada.com/WileyCDA/Section/id-3511.html</a> <br> <br>Hope this helps. <br> <br>Jon</p>"
    html_clean: "<p>This is pretty comprehensive. att.com web style. <a href=\"http://www.att.com/style/\" target=\"_blank\" class=\"link-external\">http://www.att.com/style/</a> <br> <br>Here's ABB's. It looks like it only likes IE 6 as it seems to do some kind of Wizard thing. <br><a href=\"http://www.abb.com/global/gad/gad01638.nsf/welcome.html\" target=\"_blank\" class=\"link-external\">http://www.abb.com/global/gad/gad01638.nsf/welcome.html</a> <br> <br>A suprising number of Universities have their ID/Graphics systems online. Use Google and Search <b>University Identity</b> and <b>University Graphic Identity</b>. These can be good when well done because they span disciplines, the sports teams etc. <br> <br>Here's Diebold: <a href=\"http://www.diebold.com/idmanual/\" target=\"_blank\" class=\"link-external\">http://www.diebold.com/idmanual/</a> <br> <br>Here's a concise one from Wiley Canaada: <a href=\"http://www.wileycanada.com/WileyCDA/Section/id-3511.html\" target=\"_blank\" class=\"link-external\">http://www.wileycanada.com/WileyCDA/Section/id-3511.html</a> <br> <br>Hope this helps. <br> <br>Jon</p>"
