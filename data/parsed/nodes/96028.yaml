    html: |-
      <p>&gt;There are no word pauses in speech.<br>
      I've wondered about why we don't have any problem with no gap between words in speech, but I've got an idea When we read, we jump ahead to a certain chunk of space, which the fovea can capture. This may have one or more words or no word. And when we jump maybe the parafovea gives us an idea of where to jump. This eating of text in eye sized bites that may or may not isolate one word is probably why word space are so helpful. </p>
      <p>In listening, we have a wave of signal that progresses through time, and we can mentally cut it at the point it achieves 'wordness', and start listening for a new word. So it seems like the demands of the mechanics is quite different. </p>
      <p>Processing the visual signal seems to need a lot of parallel processing that maybe is different from listening. Maybe that's involved in dyslexia, to return to the topic.</p>
