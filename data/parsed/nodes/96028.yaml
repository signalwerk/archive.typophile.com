      <p>This is a tricky subject overall, prompting lots of controversy and research/claims of research.</p>
      <p>The application is worth considering, such as if information will be in print or on-screen. In both cases, context would of course also have a bearing on any face's overall readability. <a class="freelinking external" href="http://typophile.com/node/3413" rel="nofollow">This</a> was an interesting thread for screen use, touching on the rather controversial <a class="freelinking external" href="http://www.tiresias.org/fonts/index.htm" rel="nofollow">Tiresias</a>. <a class="freelinking external" href="http://www.readregular.com/english/intro.html" rel="nofollow">Read</a> was mentioned in a Michael Evamy/Lucinne Roberts book, although again, research is viewed as a little shaky.</p>
      <p>Some other threads that may be of interest are <a class="freelinking external" href="http://typophile.com/node/32656" rel="nofollow">here</a>, <a class="freelinking external" href="http://typophile.com/node/15667" rel="nofollow">here</a> and <a class="freelinking external" href="http://typophile.com/node/29434" rel="nofollow">here</a>. Hope that helps a little.</p>
