      <p>There are no word pauses in speech.<br>
      Except. For. Emphasis.</p>
      <p>Word spaces have semantic signiﬁcance.</p>
      <p>A written method that would stick closer to speech (i.e. prosody) might have utilized the “phonic disjuncts” of syllables. </p>
      <p>Per hap sat one sta gin the de ve lop men tof wri ting there were ex pe ri men tswith su cha me thod.</p>
      <p>But the need for anything like this would have been bypassed by silent reading, which is not the process of “silently sounding” the text to the homunculus within, although it might seem like that, as it occurs in the process of learning to read.</p>
      <p>The historic lack of written syllabic spacing might indicate that “silent reading” immersively accesses the meaning of words in a purely visual manner (although the reader can recreate the sound on demand).</p>
      <p>Does silent reading activate the speech centres of the brain?</p>
