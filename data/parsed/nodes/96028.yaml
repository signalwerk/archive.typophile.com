      <blockquote><p>I am guessing that from the beginning there were spaces or mid-dots.</p></blockquote>
      <p>Yoram Gnat made fonts for various ancient semitic scripts and used them in <a href="http://culmus.sourceforge.net/ancient/Dsamples.html" rel="nofollow">sample pdf files</a> that reproduce early documents. His first file on the top corresponds to proto canaanite, and words are not yet separated. On page 6 you can see on the right-hand side a reproduction of the original, and on the left a transliteration in Hebrew script (with  guessed vowels added). </p>
      <p>Six or seven hundred years later (around 1000 BC), on the <a href="http://en.wikipedia.org/wiki/Ahiram" rel="nofollow">Ahiram</a> sarcophagus, the inscription, written in Phoenician, used vertical bars  as word separators. So, separators appeared at least 3000 years ago. Yoram Gnat's second file reproduces and analyzes that inscription.</p>
      <p>Added: Also Ugaritic, a canaanite* language written with a cuneiform alphabet, used <a href="http://lila.sns.it/mnamon/index.php?page=Scrittura&amp;id=30&amp;cont=318&amp;lang=en&amp;PHPSESSID=fpxoeogttmuhz" rel="nofollow">word separators</a> in the 14-12th century BC.<br>
      *It seems there are reasons to distinguish Ugaritic from Canaanite: <a href="http://en.wikipedia.org/wiki/Northwest_Semitic_languages" rel="nofollow">wiki article</a>.</p>
