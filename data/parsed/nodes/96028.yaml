      <p>William, there might be a much simpler explanation: speech is much slower than [immersive] reading. You know those radio/TV commercials where the guy at the end says stuff like "side effects include sweating, death and constipation" so fast and with no pauses that you can't really listen? There you go.</p>
      <p>BTW, word spaces are in fact critical to the smooth operation of the parafovea - it's the least it can do. But my view is that the parafovea is in fact able to provide far more help than merely telling us where the words are. Why would it be stingy?</p>
      <blockquote><p>"Deeply typographic folk forget to think of words as primarily oral</p></blockquote>
      <p>Actually what would be nice to forget is linguists' persistent delusion that reading is strongly related to sounds.</p>
      <p>hhp</p>
