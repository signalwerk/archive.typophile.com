    <p>Anyone know of any research or have any suggestions for commonly used fonts that have the below attributes set out by Dr. Robert Hillier?</p>
    <p>[For]The majority of dyslexic readers tested it was the combination of handwritten style, uppercase forms, long ascenders and descenders, light weight, uniform strokes, perpendicular design and generous inter-word spacing that was preferred.p275 (Hillier, Dr. Robert ‘Sylexiad. A typeface for the adult dyslexic reader’ in Journal of writing in creative practice Vol. 1, Number 3. 2008. P275 – 288)</p>
