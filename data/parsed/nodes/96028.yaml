      <p>&gt; Paul Saenger, "Space Between Words - The Origins of Silent Reading".</p>
      <p>Better than... or see the book by Walter J. Ong -- Orality and Literacy: The Technologizing of the Word. </p>
      <p>"For anyone who has a sense of what words are in a primary oral<br>
      culture, or a culture not far removed from primary orality, it is not<br>
      surprising that the Hebrew term dabar means ‘word’ and ‘event’...</p>
      <p>"Deeply typographic folk forget to think of words as primarily oral, as<br>
      events, and hence as necessarily powered: for them, words tend<br>
      rather to be assimilated to things, ‘out there’ on a flat surface. Such<br>
      ‘things’ are not so readily associated with magic, for they are not<br>
      actions, but are in a radical sense dead, though subject to dynamic<br>
      resurrection...</p>
      <p>"In an oral culture, restriction of words to sound determines not<br>
      only modes of expression but also thought processes...</p>
      <p>"An oral culture has no texts. How does it get together<br>
      organized material for recall?..."</p>
