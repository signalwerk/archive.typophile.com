      <p>I'm the Faculty Advisor of the Shakespeare Press Museum on the campus of Cal Poly is San Luis Obispo, California.</p>
      <p>I realize that the post has been up a long time, but this information may be valuable:</p>
      <p>All of this looks very familiar to me. The cases, as already noted, were made by Hamilton Mfg. in Two Rivers, Wisconsin. Those were made into the 1960s, and these look quite nice.</p>
      <p>The cases you show open are called "California Job Cases" and they appear to be in good condition. The type is made (mostly) of lead, and depending on the machine that cast the type, small amounts of tin and antimony are added for hardness and shrink-prevention.</p>
      <p>The labels on the faces of the cases should indicate what the fonts are.</p>
      <p>The engravings you show are probably zinc or copper photoengravings. These were common up into the 1960s and early 1970s. There is nothing particularly valuable about them, except that they might have interesting images on them.</p>
      <p>They make nice collector's items.</p>
      <p>The type and the cases are quite valuable to any book arts printer, hobbyist printer or letterpress production printer. I recommend trying to sell them locally (or you could donate the entire thing to a museum in your area). Shipping lead is REALLY expensive, and it would be exceptionally difficult to pack the cabinet without taking the type out of the cases and packing it to prevent damage. The lead is quite soft, and will get hurt if it falls even a two inches to a hard surface.</p>
      <p>I suggest that it is much more valuable as a package of working type and cases. Don't sell it piece-meal, as that does no justice to the real value of a good collection of type in good condition. There are many people who would love to use this type!</p>
      <p>Your local historic museum might be interested in the engravings, as they may have local historic value. Otherwise the engravings are not worth much.</p>
      <p>Brian P. Lawler<br>
      Typographic Insomniac</p>
