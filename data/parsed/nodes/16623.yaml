    html: |-
      <p>Hmmm, yes... Bitstream also has a digital version called <a href="http://www.myfonts.com/fonts/bitstream/lucian/" target="new">Lucian</a>.</p>
      <p>But both digital versions are based on <a href="http://www.myfonts.com/person/bernhard/lucian/" target="new">Lucian Bernhard’s</a> design.<br>
      That would mean Baltimore Type also based their “Graphic Medium” off the metal version of Bernhard’s design.</p>
      <p>A note on David Berlow’s Belucian:<br>
      <em>In need of a distinctive display style, Smart magazine asked Font Bureau in 1990 to revise the work of Lucian Bernhard from 1925. David Berlow prepared Belucian Demi, now accompanied by Kelly Ehrgott-Milligan’s 1994 Demi Italic, added Book and Book Italic for text, and designed Ultra for dynamic impact in headlines.</em></p>
