    <p></p><div class="imageWrap"><img src="http://typophile.com/files/neutra slab_3587.jpg"></div><p></p>
    <p>It doesn't look like anyone's posted yet about the tiny sneak preview that <a href="http://www.houseind.com" rel="nofollow">House Industries</a> has released of its "forthcoming Neutraface Slab font collection." Four of their new <a href="http://www.houseind.com/index.php?page=accessories" rel="nofollow">products</a>, two pillows and two totes, are covered in an all-caps alphabet in what looks to be one of Neutra Slab's lighter weights. Aside from a few small preview images, information is scarce -- though the description for the large pillow states, "Type designers Christian Schwartz, Kai Bernau, Susana Carvalho, Ken Barber and Ben Kiel spent countless hours seated at their desks and toiling over our forthcoming Neutraface Slab font collection, so we designed this type-patterned pillow to remind their respective lumbar areas that typography can provide visual and physical comfort." Quite the type design team!</p>
    <p>Needless to say, I'm excited!</p>
