    html: |-
      <p><cite>Medium weight could be appropriate if you plan to print light text on dark background. Otherwise, instead of more presence you could risk to give less legibility.</cite></p>
      <p>I think you are assuming way too much here. </p>
      <p>One should choose a medium over a regular or book weigh if the typographic color of the medium is more appropriate for the job. </p>
      <p>Some mediums are bolder than others. Test the medium you are thinking about using against the regular. Which one do you like better? Which one has better color? Use that one!</p>
