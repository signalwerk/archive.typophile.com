  html: |-
    <p>When does one use the regular weight vs using a medium weight?</p>
    <p>Are there fonts with medium weights but without regular?</p>
    <p>Is one a better choice for long text?</p>
    <p>I'm going to be creating a 8-or-so page brochure. If I wanted to increase the size of the long text, to give it more of a presence, and look less boring, say somewhere between 14-18 pts--is either a better option for that?</p>
    <p>Could a medium weight at, I don't know, 14 point, accomplish what I might want a regular weight to do at 16? (which is to say, give more of a presence, but still come across as a weight meant for text)</p>
