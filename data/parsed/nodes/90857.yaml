  html: |-
    <p>So I need a display font that can be used in a logo and probably in the staple brand typography. I'd love to get something bespoke done, but there is no time and very little money, if it can, it needs to communicate:</p>
    <p>-Internationalism, as in have broad international appeal<br>
    -quality (of course!)<br>
    -ambition<br>
    -academic excellence<br>
    -prestige<br>
    -heritage</p>
    <p>-as an alternative to internationalism, London.</p>
    <p>Really, I am looking for people to pot-shot fonts that are distinctive, ownable (ie not a Helvetica or Dax type font that is used by loads of companies), something that can be used in typographical treatments that will have enough character to be recognisable and 'ours'.</p>
    <p>I realise this might sound a bit like doing the whole freakin job for me, but really, any thoughts or ideas would be greatly appreciated, I'm really intrigued to see what people think.</p>
    <p>Many thanks,</p>
    <p>Owen</p>
