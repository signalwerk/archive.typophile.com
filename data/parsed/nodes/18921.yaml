    html: <p>Ha ha ha - very funny - good suggestion Tim. I may end up going with an all lowercase. I just wanted to know if there were any good suggestions for making those two competing arcs not fight so much visually. As far as choosing a font by its name - I realize that isn't a methodology for choosing a typeface - just commenting on how the D-e pair looks ironically horrible - would think they would have given it a better name to show off the face.</p>
