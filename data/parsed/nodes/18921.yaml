  html: <p>I need a suggestion - and it may sound idiotic. What is the best kerning for a De pair? Because of the opposing curves it always feels too far apart when compared with the other letters (the entire word is Delta). I will be using a San-Serif which seems to compound the problem. Any suggestions fro a good sanserif typeface that will work? (Oddly enough I don't like the overall feel of the font Delta). Again I know this is a slightly ignorant question, but I am having a little trouble trusting my instincts on this one.</p>
