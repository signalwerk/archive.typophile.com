      <p>If it has to be uppercase D lowercase e, something condensed (because the verticals are more likely to be straighter than rounder) with a large x-height (so e doesn't tuck under the D) like<br>
      <a href="http://www.myfonts.com/fonts/agfa/trade-gothic/" title="http://www.myfonts.com/fonts/agfa/trade-gothic/">http://www.myfonts.com/fonts/agfa/trade-gothic/</a></p>
      <p>Tim</p>
