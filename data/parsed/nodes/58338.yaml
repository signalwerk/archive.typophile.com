      <p>First, this has nothing to do with using Superpolator or not, or what do you exactly mean James?</p>
      <p>Rene, do you have kern pairs in both (or more) masters that represents the same pairs?<br>
      Same amount of pairs also?</p>
      <p>They must be the same if they are going to get interpolated, and they must represent same pairs also. Otherwise the odd pairs will not be interpolated.</p>
      <p>When you say there are NO kerning pairs in your new MM font, what do you mean? Were you not taking out instances FROM an MM-font?</p>
