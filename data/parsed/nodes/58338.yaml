      <p><em>First, this has nothing to do with using Superpolator or not, or what do you exactly mean James?</em></p>
      <p>In my (very limited) experience using MM in Fontlab some little things alway goes wrong. Fixing those little things can add up to a good deal of wasted time. As someone who still has a lot to learn about type design this is especially irritating because I really need to focus on problems with my type and not problems with my software. But I have never had problems with Superpolator as long as my paths and nodes match up, which is pretty easy to do with the compare script that Erik provides.</p>
      <p><em>James, does Superpolator do the job correctly even if the kerning pairs and/or kerning classes don’t match?</em></p>
      <p>Superpolator assumes all missing pairs to be zero, so values still get interpolated.</p>
    html_clean: |-
      <p><em>First, this has nothing to do with using Superpolator or not, or what do you exactly mean James?</em></p>
