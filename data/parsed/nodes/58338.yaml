    <p>Hi guys,</p>
    <p>I'm finishing up a large font family and will make instances from my multiple master font of the weights inbetween my masters. This works just fine, but... it doesn't interpolate the kerning pairs. More than that, there are NO kerning pairs in my new MM font.<br>
    I've got about 900 kerning pairs in my masters. I did a class based kerning which looks just fine to me.<br>
    Peter Bruhn told me that the both masters should have exactly the same kerning pairs, otherwise no kerning is interpolated? Is this true? </p>
    <p>Does anyone know why the kerning date isn't interpolated and how to correct this? </p>
    <p>thnx,<br>
    ®ené</p>
