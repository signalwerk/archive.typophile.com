      <p>Extending a typeface's character set is generally considered to be type design.</p>
      <p>The difficulty is that "design" is an extremely broad term.<br>
      Type design is not like music, where composition, arrangement, and performance are quite distinct--although even in music digital culture has produced difficulties concerning the legitimacy of sampling.</p>
