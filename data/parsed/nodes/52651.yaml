      <p>Ten years ago, Sean Cavanaugh supplied the following legal explanations in a bulletin board as a reply to a question by a certain person called Phan:</p>
      <p><cite><br>
      From: Sean Cavanaugh<br>
      Date: Mon, 27 Jul 1998</cite></p>
      <p>Phan, I appreciate your comments, but labeling me a pirate or a thief is<br>
      unjustified (not to mention totally lame). Let me explain.</p>
      <p>  A couple of years ago I used to work for a company called SoftMaker,<br>
      Inc., which was later acquired by Kingsley/ATF and merged into a company<br>
      called SoftMaker/ATF. Prior to the merger, SoftMaker, Inc. developed and<br>
      sold a Type 1 font scaler for DOS applications (DOS!) such as Word and<br>
      WordPerfect. SoftMaker also licensed and sold a large number of URW<br>
      typefaces. SoftMaker, Inc.'s parent company, SoftMaker GmbH of Nurnberg,<br>
      had (and has, I believe) a close working relationship with URW's founder<br>
      Peter Karow.</p>
      <p>  Maybe some people will look down their noses at URW, but URW's<br>
      contribution to digital typography is undeniable. URW performed the<br>
      original digitization of many of today's popular fonts for a number of<br>
      leading foundries. The digitization wasn't cheap. When a foundry approached<br>
      URW to do the work, URW would say, "OK, we'll do the whole font for $X,"<br>
      (sound of foundry representative gasping), "Or, we'll do it for $X minus $Y<br>
      if we can retain the right to resell and re-license the outlines."</p>
      <p>  Well, in a great many cases, the foundries opted for Door #2. In other<br>
      words, they entered into agreements with URW. This isn't theft or piracy.<br>
      If you accuse URW of anything, accuse them of being shrewd. Or maybe accuse the original foundries of under-valuing their assets.</p>
      <p>  Back to SoftMaker. At the time of the "merger" with Kingsley/ATF, it<br>
      became apparent that Kingsley/ATF only wanted SoftMaker so they could get<br>
      back into the type business (ATF was defunct at the time) and basically<br>
      collect on overdue trademark license fees from companies that had been<br>
      using ATF trademarks for free.</p>
      <p>  None of that money went into the company, but rather into the pockets of<br>
      a handful of lawyers and businessmen. At that point I had been working<br>
      without pay for a couple of months, under the idea that the merger would<br>
      turn things around, and we'd all be one happy type company. (sound of<br>
      laughing lawyers)</p>
      <p>  I left the company disgusted, to say the least. I was then approached by<br>
      an agent to write a book about typography and design. I thought it was a<br>
      great idea, and being unemployed, I'd have plenty of time to spend writing.<br>
      And then a light bulb went off in my head: Instead of taking SoftMaker/ATF<br>
      to court for the thousands of dollars they owed me, I requested the company<br>
      grant me a license to distribute a number of the URW and ATF fonts from<br>
      their collection. I had no intention of starting a type company (and still<br>
      don't) -- I just wanted to include a companion CD of typefaces with the book.</p>
      <p>  And that's how Digital Type Design Guide was born, along with its<br>
      companion CD, and the follow-up CD to that, The FontSite 500 CD (which<br>
      contains the 220 fonts from the first CD, plus an additional 280 fonts).</p>
      <p>  It's a decent type collection. I've worked on many of the included URW<br>
      outlines, making improvements to hints, bitmaps, and in some cases metrics<br>
      and kern pairs -- that was my job, after all, at SoftMaker. I guess you<br>
      could say I'm proud of it, but still, if you look on page 166 of my book,<br>
      you'll find the following:</p>
      <p>  "My hope is that if you become sufficiently excited about the world of<br>
      type, you will migrate to some of the higher-end vendors such as Adobe,<br>
      Monotype, and Agfa."</p>
      <p>  See, the thing is, I'M NOT IN THE F*CKING TYPE BUSINESS, and I have no<br>
      plans of ever getting back into it. I absolutely despise the business end<br>
      of type -- both the practices of the foundry barons of yore and the lawyers<br>
      of today. I don't sell anything in stores or mail order or in any other<br>
      channels. I have my own website, and I will continue to promote my book and<br>
      the small collection of fonts I acquired from SoftMaker/ATF. I've almost<br>
      sold enough to pay for the site's expenses. After taxes, I'll be a f*cking<br>
      HUNDREDAIRE! Yippee!</p>
      <p>&gt; and Zapf (who goes into convulsions whenever he sees pirated designs)</p>
      <p>  You'll notice on my CD is a face named URW Palladio, which is a<br>
      knock-off, of sorts, of Palatino. But do you know who designed URW<br>
      Palladio? The same guy who designed Palatino -- Hermann Zapf! (You'll also<br>
      find Zapf's URW Antiqua and URW Latino on the CD) So you can spare me the<br>
      sermon on Zapf, who also happens to be a friend of Peter Karow.</p>
      <p>  To wrap this up (and sorry for the length, but you did ask for a<br>
      "justification"), I'm not in the same boat with snakes like Paul King of<br>
      SSI and their ilk, and I resent any implication otherwise. If you and Roy<br>
      want to take some bullshit high and mighty approach with me, I suggest you<br>
      do a little research first to find out what the hell you're talking about.</p>
      <p>  But thanks for asking, anyway. And I really do appreciate your concerns.<br>
      We're on the same side of the copyright issue. You have to keep in mind<br>
      that holding a copyright does not preclude one from entering into licensing<br>
      and distribution arrangements as many companies did with URW.</p>
      <p>- Sean<br>
      </p>
      <p>In my document about the FontSite outfit, I do not blame Sean Cavanaugh for distributing fonts. I only blame him for falsely claiming to be the "copyright owner" and the "trademark owner", which he is definitely not.</p>
      <p>If he removed the copyright notices and the trademark notices from the fonts and discarded the EULA, nobody could blame him for cheating.</p>
