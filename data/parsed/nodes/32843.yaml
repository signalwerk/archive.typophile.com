    <p><a href="http://typophile.bigcartel.com/product/typophile-film-fest-4-san-francisco" title="Punchcut's Typophile Film Fest 4"><img src="http://farm3.static.flickr.com/2052/1528997180_6945ddab10_o.jpg" width="558" height="242" alt="Typophile Film Fest 4"></a></p>
    <p><em><strong>UPDATE: <a href="http://typophile.bigcartel.com/product/typophile-film-fest-4-san-francisco">Sold Out!</a></strong></em></p>
    <p><em><strong>UPDATE:</strong> The San Francisco screening will include exclusive (never before seen) interviews and outtakes from Gary Hustwit's acclaimed documentary film</em>  Helvetica.</p>
    <p><strong><a href="http://www.punchcut.com">Punchcut's</a> screening of the Typophile Film Fest 4</strong> is best described as a three-hour party centered around a rare and unequaled selection of short typographic films. Hailing from Portugal, The Netherlands, Austria, Canada and the US, the films create a visual mashup of motion design, typographic animation and short stories. It includes broadcast motion design, documentaries and typographic eye candy from Trollbäck + Company, Strange Attractors, Heebok Lee, Nick Shinn, Juan Leguizamon as well as exclusive interviews and cuts from the acclaimed documentary film Helvetica. Thanks to <a href="http://www.fontshop.com">FontShop</a> for helping make this presentation possible.</p>
    <p>After the films, we'll keep the food, drinks and music going until Swedish American Hall kicks us out.</p>
    <p><strong>DETAILS</strong><br>
    Doors: 8-11pm<br>
    Screening: 8:30-9:30pm<br>
    Date: Thursday, October 25</p>
    <p>The Swedish American Hall<br>
    2170 Market Street<br>
    San Francisco, CA 94114</p>
    <p>The Swedish American Hall, upstairs from Café Du Nord, is located on the north side of Market Street, between Church Street and Sanchez Street. It is easily accessible by the F-Line bus stop at the corner of Sanchez and Market or the Muni N, M, L and J lines at the Church Street Station.</p>
    <p>Admission: $12</p>
    <p><strong><a href="http://typophile.bigcartel.com/product/typophile-film-fest-4-san-francisco">Sold Out!</a></strong></p>
    <p>//////</p>
    <p><strong>ABOUT PUNCHCUT</strong><br>
    Punchcut is a San Francisco-based user interface design company that specializes in improving mobile user experiences. To us, mobile is not a device, it is a lifestyle. We work with device manufacturers, operators and leading entertainment brands to design for people in motion. // <a href="http://www.punchcut.com">http://www.punchcut.com</a></p>
    <p><strong>ABOUT TYPOPHILE</strong><br>
    Typophile is an international collaborative community of visual designers, typographers and type designers. Typophile is driven by sharing and the idea that we’re always learning. Now in its seventh year, it is one of the oldest design communities online. Typophile is a Punchcut brand. // <a href="http://www.typophile.com">http://www.typophile.com</a></p>
    <p><strong>ABOUT FONTSHOP</strong><br>
    Erik Spiekermann, Joan Spiekermann, and Neville Brody founded FSI FontShop International in 1990 in Berlin, Germany. FontShop is the original independent font retailer, carrying over 100,000 fonts from more than 50 international type foundries, including FontFont, FSI’s own boutique label of innovative fonts for designers.  FontsShop’s US headquarters are located south of Market (SOMA) in San Francisco, at the heart of the Bay Area’s thriving design community. // <a href="http://www.fontshop.com">http://www.fontshop.com</a></p>
