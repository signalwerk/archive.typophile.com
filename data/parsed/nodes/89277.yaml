    <p>Peace Symbol Puzzle droppin' this Spring:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/peacepuzzle_unsolved_6431.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/peacepuzzle_solved_5406.jpg"></div><p></p>
    <p>...old skool <a href="http://en.wikipedia.org/wiki/Sliding_puzzle" rel="nofollow">sliding puzzle</a>.</p>
    <p>Within the packaging will be a letter press card talking about world peace, the peace symbol, and a nob to my friend <a href="http://luc.devroye.org/fonts.html" rel="nofollow"> Luc Devroye </a>(inglorious basterd that he is!) who came out with a font called Wahei (awesome peace symbol dingbat font), which I used here and once before in my World Peace graphic.</p>
    <p>It is my intention to have every peace org carry this puzzle, I'm going to approach every single one of them and see what's what.</p>
    <p>Thought I'd share.</p>
