  html: |-
    <p>One of the first type designs I made was done during my exchange study in Finland, almost ten years ago. It was inspired by the Finnish traffic sign type and covered only one font. Now I reworked and expanded it to a family, including a extremely thin and fat one.<br>
    Have a look <a class="freelinking external" href="http://www.ludwiguebele.de/item.php/Typefaces/Display/Helsinki/" rel="nofollow">here.</a> There is also a <a class="freelinking external" href="http://www.ludwiguebele.de/elements/fontPDF/53/fontPDF.pdf" rel="nofollow">PDF</a> available.<br>
    Hope you like it. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Helsinki_6039.jpg"></div><p></p>
