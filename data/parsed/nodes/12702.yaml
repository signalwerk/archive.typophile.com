    <p>Hy,</p>
    <p>For some weeks I'm looking for a robust text face look like Dolly but less curvy, a little more agressive, a bit more literary.<br>
    [article about dolly: http://www.creativepro.com/story/feature/21831.html]</p>
    <p>I want to replace fournier I´m using on this technology and art magazine - <a href="http://www.nada.com.pt" title="www.nada.com.pt">www.nada.com.pt</a><br>
    Fournier is too light and it has some problems.<br>
    Dolly its almost what I want...</p>
    <p>thank you,<br>
    granjam</p>
