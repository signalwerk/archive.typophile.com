    <p>Hey everybody,</p>
    <p>I’ve been searching for a while if there is a font from the example i’ve attached. This is a photo from a book with an old ad for CBS which says ha ha ha (maybe familiar to some of you). It’s probably the same font used for the cacharel logo. I love these letterforms. I do know it’s not one from the bodoni family, and some people say it has a lubalin vibe to it.</p>
    <p>thanks in advance for your replies,</p>
    <p>Thijs.</p>
    <p>example can be found at: <a href="http://www.thijsgadiot.nl/ha400.jpg" title="http://www.thijsgadiot.nl/ha400.jpg">http://www.thijsgadiot.nl/ha400.jpg</a></p>
