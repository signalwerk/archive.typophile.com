    html: <p>Original done by Lubalin’s studio (it’s in the <a href="http://www.amazon.com/gp/product/0931144280/sr=8-1/qid=1144875142/ref=pd_bbs_1/002-1976616-9685602?%5Fencoding=UTF8" target="new"><em>Herb Lubalin</em></a> book, most likely drawn by either Tony DiSpigna or Tom Carnase or maybe even John Pistilli). Rehashed several times by other. Pistilli Roman is very close (though not available in digital font).</p>
