    html: <p>This is actually (mostly) due to the sIFR Flash thing that formats the headings in a custom font. It doesn't seem to be able to handle anything outside simple ASCII. The fact that often when you post something (including topic titles) some auto-formatting takes place, converting dumb quotes to smart quotes and so forth, which sIFR can't properly display. I don't think this is inherent to the way sIFR works. Maybe it is.</p>
