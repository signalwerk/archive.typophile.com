    html: |-
      <p>sIFR can handle characters beyond ASCII, see its <a href="http://wiki.novemberborn.net/sifr/How+to+use" rel="nofollow">How to use</a> and <a href="http://wiki.novemberborn.net/sifr3/Tricks" rel="nofollow">Tricks</a> pages.<br>
      I am sure that the fonts featured in the header do contain an ellipsis, an em-dash etc., and also offer a decent language support.</p>
      <p>However – IIRC –, Typophile uses something different than sIFR (see <a href="http://typophile.com/node/35077#comment-213098" rel="nofollow">Christian Robertson’s comment here</a>).</p>
