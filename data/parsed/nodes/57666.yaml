      <p>You can get pretty close to ‘GRANT’ with Charles Borges’ new <a href="http://letterheadfonts.com/fonts/gloria.php" rel="nofollow">LHF Gloria</a>.<br>
      Check out <a href="http://www.fontshop.com/fonts/singles/mark_simonson/mostra_three_bold/&amp;sample_text=RUSSELL&amp;sample_size=74" rel="nofollow">Mostra Three</a> by <a href="/wiki/Mark%20Simonson" class="freelinking" rel="nofollow">Mark Simonson</a> for an ‘S’ as in ‘RUSSELL’.</p>
