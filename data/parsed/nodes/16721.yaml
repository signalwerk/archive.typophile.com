    <p><strong><a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Robert Thorne</strong></p>
    <p>In 1794 Robert Thorne purchased the foundry of <a href="/wiki/Thomas%20Cottrell" class="freelinking" rel="nofollow">Thomas Cottrell</a>, a former employee of the original William Caslon, which had been founded in 1757 when Cottrell and <a href="/wiki/Joseph%20Jackson" class="freelinking" rel="nofollow">Joseph Jackson</a> were fired in a wage dispute. By 1798 Thorne had replaced all of Cottrell’s types with his own designs and in 1801 was the first type founder to begin showing the fat face types. He went on to design many popular  display typefaces. He also moved the foundry to Fann St. renaming it the Fann Street Foundry.</p>
    <p>Upon Thorne’s death in 1820 the foundry was purchased at auction by <a href="/wiki/William%20Thorowgood" class="freelinking" rel="nofollow">William Thorowgood</a> using money he had won in a lottery though he was never involved in the type founding business. Subsequently many of the types identified as Thorowgood's are actually the designs of Robert Thorne.</p>
