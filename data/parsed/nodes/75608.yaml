      <p>Now lets examin some of the basic rules of sheva na and nach.<br>
      A sheva na continues a sound and a sheva nach stops the sound.</p>
      <p>1. A sheva under the first letter of a word will allways be NA<br>
      This sheva is instead of Segol so it sounds Like E<br>
      also logical it would be imposible to stop a sound right at the begining of a word.</p>
      <p>2. A sheva under a letter with a dagesh (any dagesh) Will be a sheva na.</p>
      <p>3. Two letters rhe same like bet bet or lamed lamed the sheva under the first letter of the same will be a NA.</p>
      <p>4. two shevas one after the other the first will be nach, the second na.<br>
      But if the two shevas are at the last two letters of the word then they both are NACH.</p>
      <p>5. A sheva after a Tenua Qetana Is NACH after Tenua Gedola Is NA.<br>
      here is where we have to know if a qamats is tnua gedola or qetana or in other words Qamats rachav Or Qamats Qatan.</p>
      <p>here mainly is where a Meteg comes in misuse.<br>
      Text use a meteg instead of a mafsiq so meteg is used also for this and also for mileeil and milera.<br>
      A qamats with a meteg should be rahav and the coming sheva a NA<br>
      with out a meteg the qamats is qatan and the following sheva is nach.<br>
      but this is not a ruling rule.</p>
      <p>all this about the qamats qatan is very much in general<br>
      we will examin qamats qatan more in depth later</p>
      <p>there are more rules with taamim<br>
      like uf i have a sheva with a taam maamid so even if before i have a tenua gedola the sheva is nach.</p>
