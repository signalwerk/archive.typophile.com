      <p>Bill,</p>
      <p>When I was a young yeshiva bachur, my teacher, the great Ger Tzedek from Auzzyland, Rabbi Shneur Zalman Gafni Shlita, commonly said:<br>
      "It's like water off a duck's back."</p>
      <p>Like we Americans regard spilled milk.</p>
      <p>For years, I asked myself, what does this mean?</p>
      <p>"It's like water off a duck's back."</p>
      <p>Then, I pictured it, "water off a duck's back." Oh, I get it.</p>
      <p>Fruitless. It's passed already. Like we Americans regard spilled milk.</p>
      <p>What was, was.</p>
      <p>Regarding lashon hara, everything you say is correct, especially the last point, which few remember.</p>
      <p>The sixth Lubavitcher Rebbe explains. "We say that words from the heart enter the heart. Hence, if we rebuke and fail, then the words were not said from the heart, or else the other person would have listened and changed. That means, every wrong-doing that this person does from now on is really your fault. For had the words of rebuke really came from your heart, then they would have been effective, ie. entered the person's heart.</p>
