      <p>Look, isreal, I did not fail, because i never bothered with it.<br>
      But lets take a try.</p>
      <p>A meteg can be used (besides SofPasuk) For mileeail and Milera or grammer issues.<br>
      the reason i did not bother with it is because I would assume that Meteg Like Other nikud are typed.</p>
      <p>For mileeil and milera, there are rules, but when in comes to the grammer it cant be done because it goes arround in circles.</p>
      <p>Befor any<br>
      יך,נו,ני,יני,ינו,ים,הו the letter before allways gets a meteg.<br>
      וח,יח with a furtive patah the letter before gets a meteg<br>
      now this comes befor anything else.<br>
      unlike sheva being checked form the begining of the letter, metegs must be checked back and forth.</p>
      <p>any segol befor a finalkaf (+qamats) the segol gets a meteg, a qamats before the finalkaf dows not get a meteg.<br>
      a sheva does not get a meteg because it acts mostly as a segol ans is sheva Na.</p>
      <p>after a sheva nach the next letter should get a meteg.<br>
      normaly a word with 3 letters the first gets a meteg, 4 leter the second gets a meteg<br>
      not talking about the above conditions, an we also have to take in consideration Otiiot Mekashrot Like vav bet kaf lamed mem, if they exist in the letter and there are not from the root so the meteg goes one the third letter, the second not counting the Otiiot mekashrot.</p>
      <p>Two segols one after the other the first gets a meteg (at a begining of a word).<br>
      qamats + qamats if on 3 letters the first gets meteg, if more the second gets the meteg.</p>
      <p>these rules generaly work, some of them are absolute others are not.</p>
      <p>then you have meteg that comes with a qamats gadol and dose not come with qamats qatan.</p>
      <p>again, if text comes with meteg why insert them, if not then you will find your self going in circles trying to figur-out in a lot of cases if a qamats is gadol followed by a sheva NA, or maybe its a qamats Qatan followed by a Sheva Nach.</p>
      <p>its possible also with text without teaamim and meteg to come to a high level of distinguish of qamats qatan and gadol, but all the cases Like PAALA you will never figure it out. </p>
      <p>if you do, please let me know.</p>
