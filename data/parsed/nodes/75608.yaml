    html: |-
      <p>Eli, to create a Hebrew grammar font, to use later in Volt, I would create a set of 22 extra glyphs. There are ten nikkud, and a dagesh.</p>
      <p>So, if add two more for every one that is there now, 11 + 22 = 33.</p>
      <p>They do not need Unicode values. Rather, they can simply be alternative glyphs for each nikkud Unicode value, and the dagesh Unicode value.</p>
      <p>If they are placed in the FontLab file in the existing place of a font imported into Volt, adjustments to the total number of glyphs need not be made to the project in Volt, or to the FontLab file.</p>
      <p>If they are placed in the FontLab file in the new locations of a font not yet imported into Volt, adjustments to the total number of glyphs need to be made to the project in Volt, and to the FontLab file.</p>
      <p>I suggest that the new graphic forms of the nikkud and dagesh symbols be intuitive. Their new form should be similar to their old forms. A kal version should be simply a hollowed version of the nikkud and dagesh; a chazak version should be simply an outlined version of the nikkud and dagesh.</p>
      <p>In the case of the already familiar kamatz katan, it should remain the same in its Unicode value location, but have the above appearance in the other locations in the font.</p>
      <p>Similarly, I created and placed in my fonts, graphic symbols for the shvah-na: a small floating asterisk used by Lubavitch/Kehos; a small floating rafe-like used by ArtScroll and others; I added the enboldened shva, used by many Sephardim; and the circled asterisk, used by Shai LiMorah publishers.</p>
      <p>But this is only for publishing purposes. But the shvah-na should have the above cited appearance in the other locations in the font.</p>
      <p>I believe we do not need to create anything more in the FontLab files.</p>
      <p>Generate a .ttf font, to use and edit in Volt.</p>
