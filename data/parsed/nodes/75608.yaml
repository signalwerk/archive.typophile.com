      <p>Eli, if the space is increased, and center part decreased, I think it should work.</p>
      <p>For the hollow forms, I created them in Fontographer very easily, by going to the fourth Element menu from the left, to the fourth entry, Selection Info, and selecting Contour and Fill Properties, and turning off Fill, and clicking Stroke Outline with a 2 setting for the ems.</p>
      <p>I could create them as filled outlines by redrawing them.</p>
      <p>For the outlined forms, I simply copy and pasted them upon themselves. Then, I picked the Element menu again, and the ninth entry Expand Stroke, and set the Pen Width to 40. Perhaps, it should be 60 or even higher.</p>
