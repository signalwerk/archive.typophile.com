      <p>Ok, So lets start from the begining.<br>
      what are the ingredients that we will need at the font level?<br>
      Israel, You are talking about 3 sets od glyphes<br>
      1. the normal sheva,qamats,dagesh.<br>
      2. shva-nach,qamats qatan, dagesh kal<br>
      3. sheva na, qamats qatan, dagesh hazak.</p>
      <p>We will need more than that.<br>
      first, a hataf qamats is always qatan, so we need another hatafqamats qatan.<br>
      second, in general the shevas of the hatafim are NA, so we need another set of hatafim that have sheva na'a attachet to them.</p>
      <p>Now will need another set of this glyphes<br>
      Sheva NACH, Sheva-NA, Qamats, Qamats Qatan, Dagesh Kal and Dagesh Hazaq<br>
      This set of glyphes we need for later use in volt not as mark glyphs but SIMPLE or BASE GLYPHES.</p>
      <p>The reason for this is, because i can't sub a mark with mark (shva nach to Na) with PROCESS MARKS = NONE<br>
      In cases i want to check words without mark sequence in the context section.<br>
      So First i sub the diacritics to their equivlent BASE GLYPHES then in the next lookup I sub the shva na to nach as base glypes<br>
      and finally switch them back NA-BASE to NA-MARK and NACH-BASE to NACH-MARK</p>
      <p>Until here is every thing clear???</p>
