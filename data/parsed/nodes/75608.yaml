      <p>Now why is this important????<br>
      building a project like this will take you to the limits of VOLT's Code block.<br>
      it is very important to know how to optimize your project with the least amounts of anchers, kerns, lookups and lines of context.</p>
      <p>most projects in other languages can be a bit dirty, they may become complex but do not reach volts limits (not realy Volt's foult but OT)</p>
      <p>specially when using context as dictionary.</p>
      <p>Word that are built around PAALA פעלה, have a pattern of<br>
      qamatsshevaqamats+he<br>
      in these cases you will never know if the qamats is qatan and the sheva is nach, or the qamats is gadol and the sheva is na.<br>
      unless i have a mapik at the last He or BACHLAM Letters before but plain you can never know.</p>
      <p>So.....<br>
      We build a dictionary for known cases<br>
      Chochma<br>
      Orma<br>
      Hogla<br>
      hozka</p>
      <p>and so on and so on.<br>
      doing this with PROCESS MARKS=ALL will jam the intier project</p>
