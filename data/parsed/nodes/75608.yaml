      <p>However, in a siddur, you have to employ at least 3 different systems depending on the source of the text, so if the source is from Tanakh, then we employ a different system of shva na, and if it's from the Amoraim, a different system for mileil (meteg). That's why I don't understand how on earth it will help to encode the grammatical rules within a font because the typesetter probably won't be knowledgeable enough to know the source of the different texts and which stylistic set to apply for each sentence in the Siddur.</p>
