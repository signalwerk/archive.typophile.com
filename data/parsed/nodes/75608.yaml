    html: |-
      <p>Lesson One<br>
      =======</p>
      <p>First, each nikkud and dagesh must be defined as a Glyph Group by itself.</p>
      <p>Second, each kal etc. nikkud and dagesh  must be defined as a Glyph Group by itself, and each chazak etc. nikkud and dagesh  must be defined as a Glyph Group by itself.</p>
      <p>Another dagesh symbol is required to represent a mappik. I suggest this is a dagesh outlined with two circles. It must be defined as a Glyph Group by itself, too.</p>
      <p>Volt processes earlier GPOS look-ups, and afterwards Volt processes later GPOS look-ups. So, the sequence or order of the GPOS look-ups is important. The order of the Glyph Groups is not important.</p>
