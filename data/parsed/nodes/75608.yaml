      <p>Raphael,</p>
      <p>My goal is to create a 2 different Hebrew grammar 'program's in Volt. </p>
      <p>The 'program's are identical to each other, except thar one 'program' includes only GSUB look-ups which mark the shvah-na, and the kamatz-katan. This a general purpose 'program'; the results are Volt-generated fonts, in any design, intended to be used commercially by anyone; only the shvah-na, and the kamatz-katan, are displayed, and printed.</p>
      <p>The second 'program' includes GSUB look-ups which mark every nikkud and dagesh. This NOT a general purpose 'program'; the results are Volt-generated fonts, in only certain designs, intended to be used educationally by achools (and perhaps publishers of educational books); every nikkud and dagesh, are displayed, and printed.</p>
      <p>===</p>
      <p>You write that there are two opposing factors why this may not work:</p>
      <p>1. There are a large number of look-ups which will 'crash' the computer, as every nikkud and dagesh must be compiled for substitutions.</p>
      <p>2. Except for Hadasa, Hebrew letters are too narrow to avoid collisions.</p>
      <p>Which it?</p>
      <p>It seems that these are two separate issues.</p>
      <p>The latter factor seems to an issue which can be addesed in planned out design. Hence, it is not an issue.</p>
      <p>The former factor is not substantiated by you, as you can not cite this MicroSoft document. Furthermore, my two Volt experts suggest that there is no upward limit to processing a Volt font in InDesign CS/x ME.</p>
      <p>Now, you say, "let us see".</p>
      <p>===</p>
      <p>&gt;&gt;  Regarding your ideas for hollow or outline nikud. I personally don't like this approach for 4 reasons:</p>
      <p>1) it's not used in any other typeface<br>
      2) it will be impossible to print<br>
      3) it's not intuitive as to what on earth it means<br>
      4) It could be useful in a book on Hebrew grammar with the specific words printed at 24pt, but for general purpose use, I'm not even sure the point of it.</p>
      <p>===</p>
      <p>&gt;  1) it's not used in any other typeface</p>
      <p>This is why exactly that I am not introducing any new design. A hollow or not filled-in letter is the same design that a person is used to see. But now, it is merely hollow or not filled in.</p>
      <p>&gt;  2) it will be impossible to print</p>
      <p>At small types, like 12 pt and below, this is true for desktop printers. At larger sizes, like 14 pt and larger, this is possible. Try and see for yourself. Highlight some text in InDesign, and apply the Swatches to it in white (paper) near the top of its pop-up window. Then, go to swatches and select the text outline, apply the .5 or .75 pt.. Then, go back to Swatches, and apply black to the text outline. Now print and see.</p>
      <p>&gt;  3) it's not intuitive as to what on earth it means</p>
      <p>I disagree. Let us not argue just for argument's sake.</p>
      <p>The design is exactly the same, but hollows for pronouncing or intending differently, or outlined for pronouncing or intending differently.</p>
      <p>&gt;  4) It could be useful in a book on Hebrew grammar with the specific words printed at 24pt, but for general purpose use, I'm not even sure the point of it.</p>
      <p>The Volt fonts intended for ue by everyone are not radically new. The shvah-na and kamatz-katan have been printed in books for over a 100 years, and used by anyone who prays during that time with those books.</p>
      <p>There are over 100,000 religious children today who pray daily. Most don't have an inkling how to pronounce differently a shvah-nach and a shvah-na. Isn't it time for something to be done?</p>
