    html: "<p>Unicode's mandate does not require them to take the initiative in researching and documenting all needs of all writing systems. They are an industrial standards consortium, and their mandate is to standardise character encodings. This means reviewing submitted proposals on a technical basis and either accepting, rejecting or requesting revisions to these and then, if accepted, publishing standard character properties for the proposed characters. But someone needs to make the proposals: that isn't Unicode's job.</p>"
