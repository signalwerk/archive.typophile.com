      <p>gohebrew: you implicitly asked my opinion on hollow letters. That is my opinion. You disagree. That's fine. Let's agree to disagree. It doesn't invalidate your opinion, it's just different from mine.</p>
      <p>&gt;"E-l lo ah<br>
      &gt;or<br>
      &gt;E-l lo ha - with emphasis on the last syllable, if the dagesh creates an indirect pronoun,<br>
      &gt;as in "his G-d" (if the reference is to the Creator, or to any false god, then it would<br>
      &gt; be "his god" "</p>
      <p>The stress is actually on the LO and it's "ah" with a pronounced "h". There are 3 situation when the patach is pronounced before the letter, chet, mapik heh and ayin. So it's poteach, tapuach, mizbeach etc. eloah, yehoshua' (since us Ashkenazim don't pronounce the ayin this is a grammatical curiousity)</p>
      <p>&gt; There are over 100,000 religious children today who pray daily. Most don't have<br>
      &gt; an inkling how to pronounce...</p>
      <p>and many religious adults too! </p>
      <p>I'm just curious. What is the market for this? Before working for Koren I was a commercial typesetter for many Jewish publishing houses in the States. People came to me for my expertise in certain in Hebrew/English typesetting. Whereas I had many requests for h dots, requests for the kamatz katan and shva na were far less. But when they were requested never were they so esoteric and I <em>never</em> had requests for dagesh chazak nor for the matter mileil (which is odd in my opinion). Further, I often typeset transliterated texts which was extremely interesting because it was clear to me that the publishers' Hebrew experts who did the transliteration didn't actually read Hebrew very well.</p>
      <p>When I did have requests, if there was an extra cost to the font development, (even to the tune of a few hundred dollars), suddenly it wasn't very necessary.</p>
      <p>I understand your mission with these fonts. The idea is great in principle. I doubt the ability to execute this, but putting this aside, what is the commercial point?</p>
