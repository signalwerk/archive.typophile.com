    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Filip Blažek</strong></p>
    <p>Filip Blažek (1974) works as a full-time graphic designer in his studio <a href="/wiki/Designiq" class="freelinking" rel="nofollow">Designiq</a> in Prague, <a href="/wiki/Czech%20Republic" class="freelinking" rel="nofollow">Czech Republic</a>. In 2000, he finished a degree at the Faculty of Philosophy and Arts at the <a href="http://www.ff.cuni.cz/awelcome.php" rel="nofollow">Charles University</a>. Apart from being a designer, he is a co-author of Praktická typografie (Typography in practice), published by <a>ComputerPress</a>, 2000, 2004. He is also a contributor to the professional periodicals in the field. He is a founder and a member of the editorial office of <a href="/wiki/Typo%20Magazine" class="freelinking" rel="nofollow">Typo Magazine</a>, which focuses on typography, graphic design and visual communication. He is an owner of the <a href="http://euro.typo.cz" rel="nofollow">Typo.cz</a> server, dedicated to Central and Eastern European graphic design and typography. Since 1999, he gives lectures dealing with type and corporate identity. He is the Czech deputy of the international organisation <a href="/wiki/ATypI" class="freelinking" rel="nofollow">ATypI</a>.</p>
    <p>Filip Blažek is the author of the <a href="/wiki/Diacritics%20Project" class="freelinking" rel="nofollow">Diacritics Project</a>, a web site where you can find all you need to create typefaces with correct accents.</p>
