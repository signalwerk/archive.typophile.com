    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Pic 4_edit_6452.jpg"></div><p></p>
    <p>World boxing champion Wladimir Klitschko is attempting to deal a knockout blow to illiteracy through a unique fundraising initiative – and Monotype is in full support. Klitschko has punched 26 letters to create a font, which is now available for free on Linotype.com. Monotype has optimized the fist-painted font to ensure clarity and quality. </p>
    <p>All proceeds from the voluntary monetary contributions will go to the Klitschko Brothers Foundation in partnership with German charity organization BILD’s “A Heart for Children” charity <a href="http://www.ein-herz-fuer-kinder.de" title="http://www.ein-herz-fuer-kinder.de">http://www.ein-herz-fuer-kinder.de</a> to combat illiteracy internationally.</p>
    <p>View and download the font for free: <a href="http://bit.ly/1dA1Cot" title="http://bit.ly/1dA1Cot">http://bit.ly/1dA1Cot</a><br>
    View video here: <a href="http://vimeo.com/87276571" title="http://vimeo.com/87276571">http://vimeo.com/87276571</a><br>
    For more information about the initiative, visit: <a href="http://www.klitschko-vs-illiteracy.com/" title="http://www.klitschko-vs-illiteracy.com/">http://www.klitschko-vs-illiteracy.com/</a></p>
