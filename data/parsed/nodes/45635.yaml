    <p>I make lots of fonts, but here's a problem I've had a few times and I can't figure out how to fix it.</p>
    <p>The problem is with Microsoft Word users on a Mac. I make a handwriting font<br>
    for 'em and they say it loads fine, and prints fine, but the tops of the tallest letters<br>
    and some of the bottoms of letters (descenders) are being cut off on-screen in Word.</p>
    <p>"When I type onscreen, the tops and bottoms of some of my loopy letters are cut off.  It does not print or email that way though."</p>
    <p>"When I use the font in Microsoft word it cuts off the top of the font visually on the screen. The 9 looks like a 4 and the R has no top horizontal line. Similar things happen for other letters and numbers. Funny thing is that it prints correctly.  It just doesn't look correct on the screen!?! (10.5.2 for OS X, WORD 2004 11.3.8)"</p>
    <p>So my question is...</p>
    <p>What's the best way to correctly set the ascender and descender values in my Fontlab files for fonts that I've already created?</p>
    <p>How many different ascender/descender values do I have to set to get it to display correctly in Word?</p>
    <p>-chank</p>
