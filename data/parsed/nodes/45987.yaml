    <p>What is the reasoning behind kerning class names in the manner of:</p>
    <p>_LAT_LC_a</p>
    <p>Is the “2” necessary here:</p>
    <p>_LAT_LC_a2_RIGHT</p>
    <p>...wouldn’t that interfere with alternates, eg:</p>
    <p>_LAT_LC_a2.alt1_RIGHT</p>
