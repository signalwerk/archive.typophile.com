      <p>Hi Leigh,</p>
      <p>I took a pragmatic approach when designing the freebie Lexia Readable (<a href="http://www.k-type.com" title="www.k-type.com">www.k-type.com</a>) - common wisdom in UK education regarded Comic Sans to be the choice of font by/for people with dyslexia. I decided to base Lexia Readable on the shapes and spacing in Comic Sans, to try to retain its accessibility and friendliness, but to add a more contemporary, adult feel and lose the comic kiddiness so that adolescent and adult dyslexics might not feel patronized. I used the internet to research the preferred x height, the advised non-symmetry of characters, and the use of the simpler, handwritten forms of a and g for instance. However, after talking to and exchanging emails with dyslexic people, professionals and university lecturers I too began to doubt whether a single font could ever be one full and worthy response to the wide variety of conditions covered by the umbrella term dyslexia.</p>
      <p>Enjoy the journey!</p>
      <p>Keith Bates, K-Type</p>
