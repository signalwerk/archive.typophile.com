  html: <p>can anyone help me? <br> <br>i am currently trying to research the field of dyslexia and the <br>typefaces available for dyslexic people. i was wondering if anyone <br>would know where i would be able to obtain any information on what <br>would be required to make the face more legible for a dyslexic <br>person... what the lengths of the ascenders and descenders should be, <br>for example, and how symetry effects the way the typrface is read. <br> <br>many thanks, <br> <br>leigh middleton.</p>
