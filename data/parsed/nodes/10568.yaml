      <p>Hi Keith,</p>
      <p>thanks for the advice. i have also since realised that one typeface is not going to solve all of the problems a person with Dyslexia would face. However, it is still my belief that there is a need for more legible typefaces that are well designed, that we can all use to set type in, but that are also specifically for Dyslexics. It is, unfortunately, a shame that i have been unable to continue with this project, as my tutor at Bucks decided two weeks ago that it was not an appropriate project for the course. A little frustrating as i am a huge type enthusiast and a typographer by trade. Plus i have two or three sketch books of research. But, it is undoubtedly something i wish to continue with after my studies. Maybe i will apply to the design council for funding to research the project further? Who knows, but i have included a lot about Lexia in my research, and it is a very interesting face.</p>
      <p>Thank you again,</p>
      <p>Leigh Middleton, UnitProDesign.com</p>
