    html: |-
      <p>Hey, just finished a thesis on this....</p>
      <p>There is quite a bit of information floating around on the internet, but what most people that try to approach this subject don't realize is that dyslexia is really just a blanket term for a wide variety of reading / writing disabilities. To really approach the problem, I would recommend narrowing your initial investigation to a limited number of manifestations of dyslexia (ie: letter-reversal, scotopic sensitivity, etc.). "Read Regular" for example really only addresses the issue of letter-reversal. And while there is little info available for the kinds of things you are looking for (x-height ratio, etc), I have found that the best method is still one-on-one testing with dyslexic individuals (in my case school children). I'm sorry that my thesis is not online yet, it should be once I solidify a distributor / publisher.</p>
      <p>Hope that helps. Let me know if you have any more questions!</p>
