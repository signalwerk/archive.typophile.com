      <p>I also fooled around with this for my Thesis project as well. What I found was that making certain characters different from each other in relation to shape (b, d, p, q, I, l, 1 for example) can help those with learning disabilities. Take a look at Spiekermann's ITC Officina and FF Info Display, as well as Clearview Highway, Parisine, Neuzeit, and even Thesis for some examples of this kind of idea. When I made my typeface for my Thesis project I made sure that all of the previously mentioned letterforms all had different shapes.</p>
      <p>Also, I would study Cyrillic alphabets as well, I believe they might offer some potential ideas.</p>
