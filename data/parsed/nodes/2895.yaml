  html: "<p><b>Hi!</b> <br>I've been following the discussions on this forum for a while now - and it has been very inspiring to see the work in progress here.  <br>I've been working on this font (working title: A1) for a couple of weeks and would like to have some critique. The missing glyphs of the l/c plus all of the u/c glyphs still need some (lots of) work, but I would like to hear your comments before I move along.  <br>The font is partly based on the <i>superellipse</i> (thanx to <i>Herman Zapf</i> and this discussion board for introducing me to the superellipse) and its stems and hairlines has the same width as <i>Helvetica Neue 55 Roman</i> - so the uploaded image is an example of A1 roman (regular). Other weights will perhaps follow. <br> <br><b>Tor</b> <br> <br><!---Attachment: font_a1.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">Font A1.swf<br><a href=\"http://www.typophile.com/forums/messages/29/font_a1.swf\"><b>font_a1.swf</b></a> (4 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
  html_clean: "<p><b>Hi!</b> <br>I've been following the discussions on this forum for a while now - and it has been very inspiring to see the work in progress here.  <br>I've been working on this font (working title: A1) for a couple of weeks and would like to have some critique. The missing glyphs of the l/c plus all of the u/c glyphs still need some (lots of) work, but I would like to hear your comments before I move along.  <br>The font is partly based on the <i>superellipse</i> (thanx to <i>Herman Zapf</i> and this discussion board for introducing me to the superellipse) and its stems and hairlines has the same width as <i>Helvetica Neue 55 Roman</i> - so the uploaded image is an example of A1 roman (regular). Other weights will perhaps follow. <br> <br><b>Tor</b> <br> <br><!---Attachment: font_a1.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">Font A1.swf<br><a href=\"http://www.typophile.com/forums/messages/29/font_a1.swf\"><b>font_a1.swf</b></a> (4 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
