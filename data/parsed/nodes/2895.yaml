    html: "<p><b>Hello Hrant</b> <br> <br>Thank you for the kind words. What exactly do you mean by \"free\"? <br> <br>I'm wondering if there isn't a problem with the arm of the l/c \"e\" - because of being parallel to the baseline it seems to \"hang\" under it - especially if followed by a round shape (the bowl in g or q). <br> <br><img src=\"http://www.typophile.com/forums/messages/29/2522.gif\" alt=\"A1.gif\"> <br> <br>And what about the \"a\" - it's the only glyph that has a terminal - that is maybe too exotic if its the only terminal in the whole face? <br> <br>By the way: FF Signa is drawn by danish designer <i>Ole Soendergaard</i> and I must admit that I admire that particular face quite a lot. This shouldn't be too obvious though ...  <br> <br><b>Tor</b></p>"
    html_clean: "<p><b>Hello Hrant</b> <br> <br>Thank you for the kind words. What exactly do you mean by \"free\"? <br> <br>I'm wondering if there isn't a problem with the arm of the l/c \"e\" - because of being parallel to the baseline it seems to \"hang\" under it - especially if followed by a round shape (the bowl in g or q). <br> <br><img src=\"http://www.typophile.com/forums/messages/29/2522.gif\" alt=\"A1.gif\"> <br> <br>And what about the \"a\" - it's the only glyph that has a terminal - that is maybe too exotic if its the only terminal in the whole face? <br> <br>By the way: FF Signa is drawn by danish designer <i>Ole Soendergaard</i> and I must admit that I admire that particular face quite a lot. This shouldn't be too obvious though ...  <br> <br><b>Tor</b></p>"
