    html: <p>The long s in Arial is especially strange. Minion Pro, Garamond Premier, &amp; Book Antiqua, Times New Roman on my Windows machine all have it. Myriad Pro doesn't. It wasn't part of the standard Type 1 encoding. You can even find it in Bickham Script Pro, but good luck reading it in a word.</p>
