      <p>Looking at the books of Harry Carter and Noordzij, among others, I think Michael is pretty much on target. Even though the forms of blackletter and roman are different the histories are related and intertwined, and I don't think you are going to be able to make a case that one has serifs and one does not. </p>
      <p>I'm sure others will be more accurate about this, but basically it is the designs that are different, not whether there are deliberate cross strokes or not. Those triangles at the bottom of black letter n etc are cross strokes. The key design difference of blackletter is, as the term "fraktur" indicates, that instead of round archs and circles of roman, there are broken straight lines. </p>
      <p>Historically, the serifs in Carolingian miniscule and in later Blackletter are, from what I read, both historically and mechanically related. And they all go back to various roman hands in antiquity, such as the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Rustic_capitals">Rustic capitals</a>, which also have serifs. The humanist hand, in which the Carolingian minuscule was revived and paired with the Imperial Capitals was, according to Stone's account, the immediate ancestors of the first Roman typefaces. In this 15th century revival serifs were made more symmetrical in the lower case, to pair better with the ancient Imperial Capitals.</p>
