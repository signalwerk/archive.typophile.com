    date_raw: 30.Oct.2009 10.16pm
    votes: null
    html: "<p>Remaining slightly off-topic: Jan, I think that the prevailing view nowadays is that in fact the serifs of the imperial Roman letter come not from the necessities of stone-carving but from the stroke of the brush. I'm certainly no expert in this area, but I believe the idea originates with (or was popularized by) Father Edward Catich's book <em><a href=\"http://www.amazon.com/Origin-Serif-Brush-Writing-Letters/dp/0962974013/ref=sr_1_1?ie=UTF8&amp;s=books&amp;qid=1256964826&amp;sr=1-1\">The origin of the serif</a></em>; Catich argues that the serif follows logically from the brush-stroke that was used to lay down the original lettering, which was then cut in stone with a chisel. One example I can find that may be of interest (though it doesn't explicitly confirm Catich's thesis) is Sumner Stone's <a href=\"http://stonetypefoundry.com/Resources/Pre-serif%20letter%20excerpt%208..pdf\">\"Transitions in the form of the pre-serif letter.\"</a></p>"
    html_clean: "<p>Remaining slightly off-topic: Jan, I think that the prevailing view nowadays is that in fact the serifs of the imperial Roman letter come not from the necessities of stone-carving but from the stroke of the brush. I'm certainly no expert in this area, but I believe the idea originates with (or was popularized by) Father Edward Catich's book <em><a href=\"http://www.amazon.com/Origin-Serif-Brush-Writing-Letters/dp/0962974013/ref=sr_1_1?ie=UTF8&amp;s=books&amp;qid=1256964826&amp;sr=1-1\" class=\"link-external\">The origin of the serif</a></em>; Catich argues that the serif follows logically from the brush-stroke that was used to lay down the original lettering, which was then cut in stone with a chisel. One example I can find that may be of interest (though it doesn't explicitly confirm Catich's thesis) is Sumner Stone's <a href=\"http://stonetypefoundry.com/Resources/Pre-serif%20letter%20excerpt%208..pdf\" class=\"link-external\">\"Transitions in the form of the pre-serif letter.\"</a></p>"
  - id: 376000
    user: 17243
    date: 2009-10-31T10:15:00
    date_raw: 31.Oct.2009 10.15am
    votes: null
    html: "<p>The renaissance was about overcoming the dark age. The designation says it all: renaissance = revival. Revival of the spirit of the past Roman culture. Part of that revival was replacing the blackletter letterforms with the Roman letterforms. The only examples of roman letterforms that had survived the dark age were those carved in stone. The first Roman typefaces (Venetian style) were more or less the Roman capitals with a lowercase added. Why or for what reason the Romans added serifs to their letters is not as important in this context as the fact (imo) that the venetian typefaces had serifs that were modeled after those carved in stone. That’s my point.</p>"
    html_clean: "<p>The renaissance was about overcoming the dark age. The designation says it all: renaissance = revival. Revival of the spirit of the past Roman culture. Part of that revival was replacing the blackletter letterforms with the Roman letterforms. The only examples of roman letterforms that had survived the dark age were those carved in stone. The first Roman typefaces (Venetian style) were more or less the Roman capitals with a lowercase added. Why or for what reason the Romans added serifs to their letters is not as important in this context as the fact (imo) that the venetian typefaces had serifs that were modeled after those carved in stone. That’s my point.</p>"
