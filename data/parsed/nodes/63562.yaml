      <p>They do not exist in your example... it is a contemporary adaptation, and an anecdotal sham on your part to try and prove a point. Serifs are, as you stated, BEGINNING and FINISH strokes, whether by pen or by chisel. They exist in the blackletter and rotunda  forms, much as they existed in the Roman.</p>
      <p>Script????  It is just as painstaking and precise as the Roman. Hence Textura Prescisus. It is not a copperplate or spencerian, a flowing form. </p>
      <p>"where the penstroke starts and ends is just more or less ductus, not a serif."</p>
      <p>No... ductus is direction and sequence. Has nothing to do with the existence or lack of serifs.</p>
      <p>Michael</p>
