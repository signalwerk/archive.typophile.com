      <p>So you do not agree that knowledge-by-having-read-something is worth more than knowledge-by-practice?&nbsp;&nbsp;;-)</p>
      <p>Btw, the question 'does blackletter have serifs or not?' is relativated by Noordzij's Ruit (including its name) whose feet are halfway between 'serif' and 'ductus'. In light of this, ironically, Jan Erdmann's textur sample of 28 October is much closer to having 'serifs' than your sample of the same day because in the former, the (imaginary) backward-movement of the pen is more excessive and creates a symmetry we would expect from baseline serifs. Also, it seems common to give stems marked endings in writing, irrespective of style. In textur this is very emphatic (Jan Erdmann's 'ductus') but has no other purpose than have curved endings or what we commonly consider as serif. Tapering of stems e.g. in Beorcana, since Florian brought it up, fulfills the same task. Whether one <em>calls</em> each of them 'serifs' or not is almost secondary.<br>
      And another btw, I consider serifs as too arbitrary to be relevant for type classification, construction and contrast being more important criteria.</p>
