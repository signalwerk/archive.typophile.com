    html: |-
      <p>Nick, I have compared quite a few bodonis with didots. I am just yet to figure<br>
      out the essence of a didot as against that of a bodoni. In many versions<br>
      the serifs of didots are very similar to a bodoni. I know the key charachter<br>
      differences, like the lowercase a and g are dead giveaways, but in capitals,<br>
      (used in magazine covers) at times I find it hard to tell if it is a bodoni<br>
      or a didot, especially when one cant really see if the serifs are flat or tapering.</p>
