    html: |-
      <p>|SONOS| is proving most difficult, mostly due to the angle of the terminals on the |S|. Didn’t find a spot-on match. It could be a modified version of one of these typefaces:<br>
      <a href="http://www.myfonts.com/fonts/linotype/kabel/" title="http://www.myfonts.com/fonts/linotype/kabel/">http://www.myfonts.com/fonts/linotype/kabel/</a><br>
      <a href="http://www.dutchtypelibrary.nl/Nobel_rdrct.html" title="http://www.dutchtypelibrary.nl/Nobel_rdrct.html">http://www.dutchtypelibrary.nl/Nobel_rdrct.html</a><br>
      <a href="http://www.myfonts.com/fonts/linotype/futura/" title="http://www.myfonts.com/fonts/linotype/futura/">http://www.myfonts.com/fonts/linotype/futura/</a><br>
      <a href="http://www.typography.com/fonts/verlag/overview/" title="http://www.typography.com/fonts/verlag/overview/">http://www.typography.com/fonts/verlag/overview/</a></p>
      <p>The subhead appears to be Parachute’s Handbook Pro:<br>
      <a href="http://www.parachute.gr/typefaces/allfonts/handbook-pro" title="http://www.parachute.gr/typefaces/allfonts/handbook-pro">http://www.parachute.gr/typefaces/allfonts/handbook-pro</a></p>
