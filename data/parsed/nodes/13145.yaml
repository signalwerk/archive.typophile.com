    <p>Aloha!</p>
    <p>This is my first time designing a logotype for self promo. most likely, i will be doing it on the website 1st and then print... wanted to design something seamless and yet simple-looking. Will be creating an animation for "Fruddy" in the later stage.</p>
    <p>The colors are not fixed yet but hoping someone here could help me see if the structure of "U" or any of alphabets is looking weird here. </p>
    <p>Would appreciate if typofiles here could provide me with critqs and comments. </p>
    <p>Thanks!</p>
