    html: |-
      <p>hi-</p>
      <p>you're idea of seamless and simple arent getting through to me. each letter, with the exception of the middle few, seem to be chopped up by little white lines or areas that seperate each letter as if it were on top or below the other letters. </p>
      <p>the color also weakens the idea of seamless and simple i think. the gradient you have going on is loosely depicting depth or dimension. this might not have been your intent but working with the seperation lines from letter to letter, this kind of seems to happen. i dont think using a gradient is going to reinforce your idea of seamless, i think making this one whole mark with no breaks will reinforce that idea better.</p>
      <p>also, the spacing between the R, U and first D is huge and forces the viewer to span that gap. it's a tough problem to deal with...maybe try pulling the top part of the leg of the R (can't remember what that is called) to the left vertical stroke. that will close that space up and  since you stretched the Y to become part of the D, why not pull the rounded part of the R into the empty space a little to close it up? not too much, but it might be worth a try.</p>
      <p>you might want to experiment with some a little less high and maybe a little longer. i'd say going thicker or going thinner would be worth trying too. the strokes seem very bland in weight right now and maybe bringing the cap-height down and increasing the width of the mark as a whole will emphasize your seamless quality you are trying to convey.</p>
      <p>i do like the fluidity of the shape in the Y though, although i think where it joins the D needs a little work. keep going though, i think it's a good start, i would just start from by losing the gradient and connecting it all together</p>
      <p>w|m</p>
