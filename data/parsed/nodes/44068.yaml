    html: |-
      <p>Hi Psachyah,</p>
      <p>yes, you can save your file as a Word Document (.doc) in TextEdit. That should do the trick.<br>
      Make sure to check the import options when placing your text in InDesign (‘keep formatting’ etc).<br>
      F</p>
