    html: <p>Is their a way to have it create style sheets based on the imported formatting?</p>
  - id: 271605
    user: 16911
    date: 2008-04-09T14:26:00
    date_raw: 9 Apr 2008 — 2:26pm
    votes: null
    html: |-
      <p>Yes, via scripts.<br>
      Check out <a href="http://www.hilfdirselbst.ch/foren/Mapping_mit_CS3_%28Win%29_P339435.html#339435" rel="nofollow">Peter Kahrel’s CharStyle</a>, <a href="http://indesignsecrets.com/plug-ins-and-scripts/" rel="nofollow">Dave Saunders’ PreserveLocalFormatting.jsx</a> or something similar.</p>
      <p><cite>Preserve Local Formatting: Dave Saunders wrote this cross-platform Javascript that can run through a selection of text (or the whole document, if nothing is selected) and replace locally-formatted bolds and italics (among others) with equivalent Character styles. The script adds the styles to the Character Styles palettes on its own,no need to create them yourself. Works in CS1 (change extension to .js), CS2, and CS3.</cite> — <a href="http://indesignsecrets.com" rel="nofollow">InDesign Secrets.com</a></p>
