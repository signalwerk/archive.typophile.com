      <p>Well, I don’t know whether to laugh or cry. I sent an email to Criterion asking about the font and here’s the response:</p>
      <blockquote><p>Thanks for your email and interest! Criterion uses Arial Bold for subtitles, and also a proprietary font used by one of the subtitle houses we work with that closely resembles Arial. I hope this helps! Please feel free to write again if you have any other questions.</p></blockquote>
