    <p>Can anyone recommend some good, professional Japanese pixel fonts? They are to be used for small screens, such as the ones found on cell phones and other wireless devices. Of course, the more complete the character set, the better.</p>
    <p>Thanks in advance,<br>
    Ricardo</p>
