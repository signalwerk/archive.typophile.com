    html: |-
      <blockquote><p>would any of those have substituted Ginga for Polonaise?</p></blockquote>
      <p>That's a very strong argument - in fact one I've used before myself. And to me pragmatism is more often than not a breath of fresh air.</p>
      <p>But the bottom line is that secretly profiting (which doesn't have to be monetary) from somebody else's work is simply not OK. At the very least you have to give credit; maybe even get an OK from the original designer, if possible. Whether you stand on the shoulders of dead or living people, admit it and be prepared to share the windfall. It's not about submission, it's about being fair. For example if the original designer is an unreasonable nut-job, to hell with him.</p>
      <p>Consider the "moral erosion" this sort of thing does to the craft - in the long term affecting users too. Behavior is contagious! Let's behave well.</p>
      <p>hhp</p>
