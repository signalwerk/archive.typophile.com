      <p>Is a derivative work "outline theft"? As of this post, Ginga has been downloaded  1,556,558 times. That doesn't prove or connote anything. But would any of those have substituted Ginga for Polonaise? I don't think so. This is not the same (IMHO) as piracy or outright theft.</p>
      <p>Go ahead and make the argument that Billy Argel should have paid royalties or a licensing fee. Or is that the subject of another thread?</p>
