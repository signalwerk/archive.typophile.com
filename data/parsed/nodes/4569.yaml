    html: <p>I would not attempt a gory image to go with my surname. But perhaps exploit its eccentricity.  <br> <br>I doubt many people would associate MANSON with gore and I would not even head in that direction. <br> <br>We do not plan to hire any other family members. Just me and my brother. Since we bounce and feed off each other with respect to design and marketting. <br> <br>Thanks for the feedback, I shall stew these responses and keep branstorming. <br> <br>take care <br> <br></p>
