    html: <p>If you're going for an eccentric angle, perhaps a near-minimalist logo would work nicely. The yin/yang idea is a good basis, but it's a pretty common reference.  <br> <br>You could use Hrant's literal idea and design a stylized man that tesselates with itself, either in the same size or in two complementary sizes (man &amp; son).</p>
