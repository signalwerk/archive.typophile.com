    html: <p>Hrant <br> <br>The "man" + "son" was somethng we were thinking of exploiting with regards to our brotherly competitiveness. Promotional material which illustrated that envy, jealousy, and immature brotherly habits (such as the border within the shared bedroom) played a large role in our individual stride to "out-do each other". <br> <br>We intend to target the "edgy" clientele despite which name we choose. But were concerned with regards to corporate identity. <br> <br>Do corporate identity jobs tend to be conservative clients? Would YOU be turned off by a surname?  <br> <br>We have constantly been asked throughout our lives about our surname. Resultng in us giving them the answer they were hoping for. Then it changed with Marilyn heading into the mix. <br> <br>I tend to be optimistic with regards to our name. And since we will also be striving into brandng/advrtising, it could make for a brilliant edge with promotional material. <br> <br>All your feedback has been great, spurred us both into further discussions and scenarios. I want to get this decided well before my institutional study ends. <br> <br>take care</p>
