    html: "<p>Vendetta. Brothers. Manson. What is this, an Emigre promo?  ;-) <br> <br>I think incorporating \"Manson\" would be great if the target clientele is \"edgy\" (like Chase says). The fact that your surname is indeed Manson means nobody can hold any allusions to criminality against you (at least not formally). And when somebody asks you if Charles's reputation had anything to do with your choice of name, you can tailor your answer depending on what kind of person is asking! It can help you create an atmosphere, an illusion, based on the needs at hand. <br> <br>Visually: I would try some kind of Yin/Yang opposition/unity thing (but not too literal a reference to the Yin/Yang symbol itself). Here's one of my most favorite logos (by Gahlord Dewald): <a href=\"http://www.thtfct.com/\" target=\"_blank\">http://www.thtfct.com/</a> <br> <br>BTW, note that \"Manson\" is \"man\"+\"son\"; maybe you can play the sibling aspect into that. Like maybe some kind of tree with two branches? <br> <br>hhp <br></p>"
    html_clean: "<p>Vendetta. Brothers. Manson. What is this, an Emigre promo?  ;-) <br> <br>I think incorporating \"Manson\" would be great if the target clientele is \"edgy\" (like Chase says). The fact that your surname is indeed Manson means nobody can hold any allusions to criminality against you (at least not formally). And when somebody asks you if Charles's reputation had anything to do with your choice of name, you can tailor your answer depending on what kind of person is asking! It can help you create an atmosphere, an illusion, based on the needs at hand. <br> <br>Visually: I would try some kind of Yin/Yang opposition/unity thing (but not too literal a reference to the Yin/Yang symbol itself). Here's one of my most favorite logos (by Gahlord Dewald): <a href=\"http://www.thtfct.com/\" target=\"_blank\" class=\"link-external\">http://www.thtfct.com/</a> <br> <br>BTW, note that \"Manson\" is \"man\"+\"son\"; maybe you can play the sibling aspect into that. Like maybe some kind of tree with two branches? <br> <br>hhp <br></p>"
