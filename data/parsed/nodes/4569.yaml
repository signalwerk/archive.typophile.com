  html: "<p>I need some advice about identity.  <br> <br>My brother and I are soon establishng our own Graphic Design busness (within a year). But are in two minds about the direction for our identity.  <br> <br>We have two ideas which I would like to put forward.  <br> <br>1 - Scratch Graphics (or) Vendetta Design : Focusing on graphic design within the creative industry, but also extending to brand/corporate identity. <br> <br>2 - Focusing our own identity on the fact we are brothers, therefore using our own surname and exploiting the brotherly LOVE/HATE relationship.   <br> <br>I guess what I am asking, is would we be limiting ourselves from prospective clients if we name ourselves SCRATCH GRAPHICS / VENDETTA DESIGN. We are trying not to jump into an identity too soon.   <br> <br>The more I think this through, the more I am looking at the BROTHER identity. But would appreciate feedback from anyone offering their profound knowledge and experience. <br> <br>Take care <br>kumbuniko <br> <br></p>"
