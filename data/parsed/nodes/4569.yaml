    html: <p>You're definitely creating a recognizable and memorable identity if you use your surname, especially if your main marque is something, for the lack of a better phrase, horrifying or scary. Like if your logo was just all-caps 'Manson Design' written in blood. <br> <br>But you certainly run the risk of repelling potential clients solely on the basis of your name� it isn't something that a jeweler or community centre would care to acknowledge a connection with.  <br> <br>So if you're focusing primarily on an 'edgy' industry like the music or design community, and if the clients are primarily young enough to make the association but not old enough to have been terrified by the slayings, you'd be okay. Otherwise, I'd choose Vendetta Design, because there are a wealth of opportunities associated with that, like using violin cases as portfolios/briefcases and showing up to client meetings wearing chalkstripe suits with fedoras <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
