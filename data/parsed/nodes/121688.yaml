  html: |-
    <p>Hello everybody!</p>
    <p>I want to download the Microsoft VTT tool, but I can't figure out how is it possible!<br>
    Right here, on <a class="freelinking external" href="http://www.microsoft.com/typography/tools/vtt.aspx" rel="nofollow">http://www.microsoft.com/typography/tools/vtt.aspx</a> it tells that I must <em>fax</em> them a copy of a signed agreement. First of all, come on, <em>fax</em> in 2014? And also the link to that agreement doesn't work.</p>
    <p>I've googled for it and couldn't find any solutions. I've seen some links to it on the FontLab forum, but they also do not work.</p>
    <p>Does anybody know how to get Microsoft VTT?</p>
