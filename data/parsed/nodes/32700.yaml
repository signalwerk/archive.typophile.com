    <p>i just bought a new 1G USB drive.  But I’ve been having trouble with larger illustrator files [10 MB+].  They go on the card fine, but then when I try to open them on another computer, I almost always get an error message or it opens only patially.</p>
    <p>I know I’m giving it enough time to load on, and I’m properly removing the drive, but is it defective?</p>
    <p>should I return it or am I missing something?</p>
