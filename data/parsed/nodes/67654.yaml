      <p>Update on this one: I've added a local Google search so you won't have to jump out to another browser tab.</p>
      <p>Look for the "Google Search" tab on the search page at <a href="http://typophile.com/search" title="http://typophile.com/search">http://typophile.com/search</a></p>
      <p>Or go direct: <a href="http://typophile.com/search/google/" title="http://typophile.com/search/google/">http://typophile.com/search/google/</a></p>
      <p>Also, 404 Page not Found errors will now initiate a Google Search, hopefully getting you closer to what you were looking for.</p>
