    <p>I just discovered, Sony Vegas Pro 8.0, my favorite software for video, audio and dvd creation, now supports OpenType features in the ProType Titler built in text engine. At first sight, it looks and works good, it also implements features not yet available in Adobe apps (petite caps 'pcap', unicase 'unic', ruby 'ruby'). I hope it will inspire other software vendors...</p>
