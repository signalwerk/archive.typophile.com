      <p><em>So reducing the choices UI-wise makes sense.</em></p>
      <p>No, because the UI is suggesting a list of features which is, in relation to any given font, arbitrary.</p>
      <p>Here is how the features should be shown, as they appear in FontLab's Preview panel: only the features that are in the font, no more, no less. (This is, I suspect, the way that the next generation of Type Testers at online retailers will work.)</p>
      <p>Followed by the way the same font appears in InDesign, with redundancy of [not available] features, and redundancy of faux and OT features.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Preview_3429.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Palettes_3977.jpg"></div><p></p>
      <p>Doesn't it make more sense to let type founders decide how to "reduce the choices" (if they consider it necessary), rather than have the application present the user with a generic list of features, many of which are redundant? </p>
      <p>Only a small class of serif faces are likely to have most of the features shown in the menu: Script fonts, for instance, might have swash and contextual alts, but not tabular figures, small caps, and subscript. Sans serifs are the other way round.</p>
