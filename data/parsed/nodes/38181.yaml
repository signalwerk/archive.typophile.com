      <p>Very interesting, thanks for the screenshot. Looking at it, isn't it time for Adobe/MS to publish some guidelines as regards the relation of OpenType UI options and features? Maybe just sum up what InDesign or WPF do -- since fonts produced so far have been made to work with these.</p>
      <p>A few examples: The screenshot shows that there are separate options for "Standard Swashes" and "Contextual Swashes" (both features called by "Swashes" in ID), or "Standard Ligatures" and "Contextual Ligatures" (both called by "Ligatures" in ID), or "Capital Spacing" is a special option (bundled with uppercase'ing in the "All Caps" option in InDesign).<br>
      AFAIK, the distinction between contextual and non-contextual versions of a feature is a mere technical, not a semantic one -- and I remember that earlier recommendations said, put ligatures in "Ligatures" and contextual ligatures in "Contextual Ligatures", plainly based on whether they involve context or not. Now this would have the effect that if a user activates "Ligatures" but not "Contextual Ligatures" he only gets half of what the designer intended to happen when clicking e.g. the "Ligatures" button.<br>
      And why is kerning made a separate <cite>option</cite>?</p>
      <p>It is great to see that more applications support OT features -- but as of now, with (more or less) different interface approaches take alone from Adobe and Apple (and are there any WPF-based apps already?), I fear that OpenType options will confuse designers rather than encourage them to actually use them. And maybe even apply features "wrongly" by activating them only partially ...</p>
      <p>Karsten</p>
