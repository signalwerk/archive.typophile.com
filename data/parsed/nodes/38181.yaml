    html: |-
      <p><em>I strongly disagree with Nick’s statement that features not present in the currently selected font should be made completely unavailable. </em></p>
      <p>To make a feature available, one applies it to a font which supports that feature.<br>
      Do people apply features to fonts that don't have them?<br>
      What is the point of applying "all small caps" or "proportional oldstyle" to a "Standard" font?</p>
      <p><em>what would the app display for OpenType features when the current text selection has multiple fonts?</em></p>
      <p>No different than now.<br>
      All features applied only to some fonts in some part of the text would be shown, but with a "dash" indicating that they are not globally applied.</p>
      <p><em>- as a user, I want to be able to..."</em></p>
      <p>Is that statement the result of surveys that Adobe has made of how people work with OpenType in InDesign etc.?</p>
      <p><em>Nick’s approach makes this difficult, and perhaps impossible.</em></p>
      <p>My proposal wouldn't stop anyone cycling through fonts.<br>
      You're assuming that a typographer would start with text in, say, Times Roman, and apply features to that text that are not supported by TR, then try out some fonts to see which look good and support the features.<br>
      Surely, if a typographer wants to apply a feature, and the font selected does not support that feature, they change the font -- they want to see what the feature looks like applied.</p>
      <p>I'm suggesting that the display of features should be font- and document-driven, not application-driven:</p>
      <p>- If a feature is applied in selected text, it should show up in the feature menu.<br>
      - If a feature is available in a font that is selected, it should show up in the feature menu.<br>
      - If a feature is applied in selected text, but not available in the font selected, it should be indicated by brackets (as it is now) or by being greyed out.<br>
      - If it is applied only in some of the selected text, it should be indicated by a dash (as it is now).</p>
      <p><em>in creating character and paragraph styles, I need to be able to select features regardless of what is supported by any given font.</em></p>
      <p>Again, I'm not going to select a font that does not support the feature I want. If I want superior figures and I have a Standard font selected, I will change the font, not apply the feature in "bracket" mode.</p>
      <p>I want to see immediately, clearly, and not on a buried menu, what OpenType features are present in the font of my selection, not be presented with a bewildering mixture of real and faux options, repeated options, and options in brackets.</p>
      <p>And, on the other hand, if the text I'm working with already has features applied, and I'm considering changing the font, I again don't want to have the GUI cluttered up with options that aren't applied in the text, and aren't available in the font selected.</p>
