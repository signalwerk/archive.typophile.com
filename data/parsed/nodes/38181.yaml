      <p>Hello Mr Menninga, thank you -- also for correcting my clig error, and for pointing out the dependency of cpsp on kern of which I was not aware. This is very helpful, and I like the categories.<br>
      (1) is a very sensitive one. For font developers it were nice to know that <cite>all</cite> application developers stick to this for sure, then ordering features/lookups at least for certain features were much less of an issue.</p>
      <p>Ralf Herrmann -- <cite>That's the reality right now!</cite></p>
      <p>Yes, but currently it's only very few applications which offer OT support, so it's still possible to guide the many others who plan adding OT support.&nbsp;&nbsp;:)</p>
      <p><cite>But I don't expect that the interfaces will ever get unified across applications. The needs of users of a word processor, layout or image procession software are much too different.</cite></p>
      <p>I do not expect <cite>identical</cite> user interfaces everywhere. Whether there are four checkboxes for the four numeral styles (InDesign) or 2x2 checkboxes (Apple, Sony Vegas Pro) -- both approaches are intelligible. And of course different kinds of applications may support different kinds of features. What bothers me are aspects (1) and (2) as mentioned by Mr Menninga.</p>
      <p><cite>What problem?</cite></p>
      <p>Hello Nick, offering a checkbox for every single feature may be too much, even a modest font may easily have 20 features minimum. So reducing the choices UI-wise makes sense. And some features need not even be exposed because they should just be on (kern, calt): they are essential part of the design, not options.</p>
      <p>Karsten</p>
