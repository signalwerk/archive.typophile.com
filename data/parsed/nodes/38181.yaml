      <p>The problem of how to present OpenType features to users consists of a few separate problems that InDesign has had to deal with:<br>
      1) Features that are mutually exclusive. For example, <strong>pcap</strong> and <strong>smcp</strong> probably shouldn't be applied to the same text. And <strong>dnom, sups, sinf, subs,</strong> and <strong>numr</strong> would be problematic when combined.<br>
      2) Features that make sense applied together. For example, it seems unlikely that anyone would need to apply <strong>case</strong> and <strong>cpsp</strong> independently.<br>
      3) Features that don't really need to be called out. For example, <strong>ccmp, locl,</strong> or <strong>rlig</strong>.</p>
      <p>To address (1), InDesign applies certain features based on mutually exclusive settings. For example, the numbering styles in InDesign become variations of <strong>pnum, onum, tnum</strong> and <strong>lnum</strong>.</p>
      <p>To address (2) InDesign groups some features together in "bundles" underneath some user applied attributes. Here are some examples.<br>
      <em>Discretionary ligatures</em> - <strong>dlig + hlig</strong><br>
      <em>Contextual alternates</em> - <strong>calt + clig</strong><br>
      <em>Swashes</em> - <strong>swsh + cswh</strong><br>
      <em>All caps</em> - <strong>case + cpsp</strong> (if the font's kerning is used)<br>
      Note: <strong>clig</strong> is applied with <strong>calt</strong>, not <strong>liga</strong>.<br>
      Question: should <strong>cswh</strong> be considered contextual or swash in nature?</p>
      <p>We have a couple examples of (3) where OpenType features are on and there isn't any way for the user to turn them off (outside of scripting): <strong>locl, mark, mkmk, ccmp,</strong> and <strong>rlig</strong>.</p>
      <p>eric</p>
