      <p>Thanks for the links Karsten.</p>
      <p>These documents are useful, especially for highlighting inconsistencies.</p>
      <p>One thing that struck me about the WPF document is the way that some of the typographic features are renamed in the code.<br>
      For instance, fractions are designated either "slashed" or "stacked", which makes perfect sense -- but does not correspond to the Feature Tags "frac" and "afrc" -- which is described elsewhere in the MS Feature Tag web page as "nut", with no mention of stacking.</p>
      <p>Similarly, the WPF document is correct in describing three of the four figure attributes -- "proportional", "oldstyle", and "tabular", in accordance with feature tag and application practice, but opts for "normal" instead of "lining" in the code, and refers to this as "standard" in the accompanying text.</p>
      <p>This kind of inconsistent naming is intended to be helpful, but in fact drives users up the wall as they attempt to understand concepts and principles in a wider context, by comparing their knowledge and experience in one area with that in another.</p>
      <p>It seems to me that the immutable part of all this is the feature tags. Perhaps these features are not all perfectly conceived and named, but rightly or wrongly we have to live with them, and turn their hard-and-fast nature to our advantage. These feature tags have a four-letter code name, and a "friendly name" -- clearly spelled out at the OpenType Layout tag registry. </p>
      <p>Why don't application developers follow the lead and use the code names in code, and the friendly names in their explanatory text and menus?</p>
