      <p>Wrong.</p>
      <p>I said:<br>
      "- If a feature is applied in selected text, but not available in the font selected, it should be indicated by brackets (as it is now) or by being greyed out."</p>
      <p>It could still be turned off, which is how things work now for features not supported by the selected font.</p>
      <p>Rather than have an arbitrary list of features in the application menu, the OpenType menu items that appear should be the result of text- and font-specific prompts:<br>
      (a) features that have been applied in selected text<br>
      (b) features that are available in the active font</p>
      <p>Surely this is a better method for an OpenType GUI, avoiding a list of options that is otherwise full of redundancies, and yet can never accomodate every feature.</p>
      <p>It would also put the onus on foundries to configure their features in such a manner to work efficiently (ie reasonably succinctly) in the menus, and this would encourage us to cut down on bloated lists of features that users may find offputting. For instance, there is little point in including "denominator" and "numerator" if you have a fraction feature.</p>
