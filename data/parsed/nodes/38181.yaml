      <p>When choosing names for WPF typography properties we asked people around how many of them know what "nut" fraction is. You can guess the result. Even if description in OT spec uses different word than WPF feature, interpretation is the same and not confusing. They should not be exactly the same. </p>
      <p><cite>Similarly, the WPF document is correct in describing three of the four figure attributes — “proportional”, “oldstyle”, and “tabular”, in accordance with feature tag and application practice, but opts for “normal” instead of “lining” in the code, and refers to this as “standard” in the accompanying text.</cite></p>
      <p>I agree in this case, "Default" looks better for me too. This value indicates that glyph forms will be default for this font. I do not remember exactly, but I think word "Normal" had been choosen to keep it consistent between different properties. They may have different names best describing default state, but developers should be able to quickly understand how to set property to "undefined" state. </p>
      <p><cite>Why don’t application developers follow the lead and use the code names in code, and the friendly names in their explanatory text and menus?</cite></p>
      <p>If you design a platform API, you still need to have descriptive names, because you have a user -- developer. Simple feature tags are not descriptive enough. WPF also tried to define some structured set of properties, grouping and naming features so application developer can't make errors like applying features proportional and tabular digits together.</p>
      <p>Out of three things Eric called out, WPF definitely addresses (1) and (3), because this would protect developer from making logical error. Representing typographic features in UI is completely different topic. We leave (2) to application, because assumption may or may not be true. For example, InDesign applies historical and discretionary ligatures together under one name, but other app may do it differently. App may use only first stylistic alternate or allow picking from the set. App designer may deside to organize, group or enable/disable them differently, based on his own understanding and target audience.</p>
      <p>Thanks,<br>
      Sergey</p>
      <p>P.S. Looking at Sony Vegas 8.0 system requirements (they include WPF) makes me wonder if it is actually using WPF to support OpenType features. Unfortunately, I can't find any information to confirm that.</p>
    html_clean: |-
