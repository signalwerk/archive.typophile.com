      <p>I strongly disagree with Nick's statement that features not present in the currently selected font should be made completely unavailable. We certainly considered that in the Adobe UI, and rejected it due to numerous problems:</p>
      <p>- what would the app display for OpenType features when the current text selection has multiple fonts?</p>
      <p>- as a user, I want to be able to select a block of text, turn on a bunch of features (which may not all be supported by a given typeface), and then cycle through a bunch of fonts. Nick's approach makes this difficult, and perhaps impossible.</p>
      <p>- in creating character and paragraph styles, I need to be able to select features regardless of what is supported by any given font.</p>
      <p>Cheers,</p>
      <p>T</p>
