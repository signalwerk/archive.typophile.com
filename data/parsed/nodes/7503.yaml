    user_name: Joe Pemberton
    user_path: null
    date_raw: 11 Jan 2003 — 11:42pm
    date: 2003-01-11T23:42:00
    votes: null
    html: <p>Glad to see you back, post honeymoon. This is exciting.   <br>This is a Typophile first. Dare I say an internet first?   <br>(Ahem, offering the actual face for download and testing.)   <br>I guess it shouldn't surprise me that it's coming from you.  <br>  <br>It was with this in mind that we created the "Build"   <br>critique in the <a href="http://typophile.com/needs/your/support/">"Ascenders" membership</a> class. The goal   <br>is to create an area where font files are made available  <br>for testing by trusted peers as faces get developed. </p>
