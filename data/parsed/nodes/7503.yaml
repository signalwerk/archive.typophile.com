    date_raw: 21 Nov 2001 — 4:30pm
    date: 2001-11-21T16:30:00
    votes: null
    html: "<p>^ It's very geometric, yet it has brush undertones. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/530.gif\" alt=\"factory3.gif\"> <br> <br>While I was building factory I started to manufacture fonts based on the factory template. I was thinking of all the small foundries that are doing retro/tech fonts. This exercise started out as a parody, but there's some super cool stuff. Some are more successful than others. In this case, the process interests me as much as the product. <br> <br>Click here for More &gt; <!---Attachment: factory3.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">factory3.swf<br><a href=\"http://www.typophile.com/forums/messages/29/factory3.swf\"><b>factory3.swf</b></a> (114 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
  - id: 146480
