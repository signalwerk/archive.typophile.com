    html: |-
      <p>I have a confession: Most of my fonts live only in illustrator. So <br>I dusted off fontographer, cussed a little as I tried to make it  <br>work in os x, and put together a type 1 font. I have polished  <br>up a little and tried to get some decent kerning, spacing etc.  <br>Here is the font suitcase of the caps only. <br> <br>Any suggestions will be welcomed. <br> <br></p>
