    html: <p>I like it a lot, Christian. It has a very Obey Giant feel for me, but that's not a bad thing at all. The   "Factory Serif Slim" is too Chank for me, however. The main face is pretty cool and I think you should go that route, very industrial, cyrillic-esque.</p>
