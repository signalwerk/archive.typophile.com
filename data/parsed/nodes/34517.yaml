    <p>Just curious if this MSN User Group is dead. I signed-up to it last week per Jim Gallagher’s recommendation toward Font Validator, and have yet to receive a notification.</p>
    <p>It appears this is the only way one can download the program - understandable, coming from MS.</p>
    <p>Unless anyone is aware of another validation tool? I use TTX.exe quite a bit, as well as TTFDUMP.exe, but to me these tools are not quite giving me the kind of feedback I’m interested in.</p>
    <p>And suggestions would be greatly appreciated.</p>
