      <p>It is NiceTry who wants the bells and Whistles. I was wondering what was meant by this as-well! Perhaps double s, alternative ampersands, Sans-serif fist?</p>
      <p>Unica Deux (because is closest to an archetypal form) is a development platform for me - so I'm using it to learn and try out ideas. My next task is to try out versions of the Cap R. This still bugs me. Even though the original is undoubtedly the correct way - there's no harm in trying alternatives and see if any do the trick.</p>
      <p>I also like Mercator - I have just ordered a type specimen to have a better look at it, as I have only ever seen it as its own title in a Berthold type specimen book form the 80's with no setting or character set. (ill drop a scan when I get it). </p>
      <p>Mercator really gives off 60's vibe and is really direct. Great for massive one word Poster headings. The cap M is really broad. Nice.</p>
      <p>My wish for what I want but cant have starts with Adonis by Stephenson Blake. It is a grotesk type which was made by filing off the serifs of a copperplate style font. The result is intriguing. Looking a bit like akzidenz buch extended but with something else??? I first saw an example when I was studying at Manchester, where there was a beautiful Purple and Blue specimen sheet. I should have xeroxed it! I have since found another sample, which I will put here in the future.</p>
