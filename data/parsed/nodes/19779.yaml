    html: |-
      <p>Hey Nina, I came back and looked at this the other day and saw I had kind of put a shopping list of "desires" together with @NiceTry's inspiration. As I have had a couple of goes at small caps now - this would make sense. I might try to do this without looking at the Unica Capitals and see where they end up. (Overlay was used for the lowercase). Actually I believe it is good practice to work on the more challenging small caps first (perhaps caps and small caps play off each other). I can't put a time scale on this yet as I have pressing matters to attend to like finish the MA thesis: 'Compact Typography: The design of typefaces conceived for small size applications.' </p>
      <p>Luckily Unica is timeless so waiting another bit longer won't hurt...</p>
      <p>Anyway. A while back I saw this in real life which I think someone mentioned in another thread:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Art_and_Language_5653.jpg"></div><p></p>
      <p> <a class="freelinking external" href="http://www.amazon.co.uk/Art-Language/dp/3905701561/ref=wl_it_dp_o?ie=UTF8&amp;coliid=I330T5GHLYJRD5&amp;colid=91K82JP8CXSN" rel="nofollow">A&amp;L Art and Language</a></p>
      <p>Close up it is not as true as I had hoped and there is a bold use of a dot on the i which kind of bugged me but is the style if the designers (whom I forget but I think are Swiss). Respect though - because the concept is perfect: offering typographic neutrality when discussing art (without perceived bias)!</p>
