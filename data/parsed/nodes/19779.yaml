  html: |-
    <p>Okay folks! Here are three of my favorites that you can't have. These are unreleased- and most likely, will never be released- fonts that rock my little typographic socks.</p>
    <p>Volvo Sans... used on all Volvo controls and switches. Its like Handel Gothic only more swedish-er.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/001_4215.jpg"></div><p></p>
    <p>Bloomindales... This swanky typeface has been strutting its stuff while the folks who made Chalet were not even born yet. [And no, Horatio doesn't cut the mustard]</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/header_bags_5019.jpg"></div><p></p>
    <p>Lumene Script from Suomi... This is my favorite handwriting font ever! Perhaps when Lumene Cosmetics will change campaigns will then we have access to this genius face. Think of it as Emma Script with less caffeine. Plz Script is a significantly less refined alternative however the up-and-coming Suomi Script would be fascinating.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Lumene_6099.jpg"></div><p></p>
    <p>But good news in 2011 we get access to Dereon... a luscious scotch face and in 2008 Parisine Office from Porchez. :-)<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Dereon_exemple_4263.gif"></div><p></p>
    <p>Do you have exclusive fonts that you wish you could have... post images, names, and foundries.</p>
    <p>Mikey</p>
