    html: <p>Sorry that was maybe a little cryptic. I went to a lecture by the husband and wife team, Massimo and Lella Vignelli, who did the Bloomingdales identity (in 1972) among their wide range of projects over the last 40+ years; Massimo Vignelli described the Bloomingdales logo as a simply customised Avant Garde. (In general they tend to use unadorned, tried and trusted classic and modern typefaces for identity and logo treatments - see also American Airlines, NYC subway signage, Knoll logo etc but occcasionally customise - they did their own Bodoni for example)</p>
