  - id: 379061
    user: 46071
    date: 2009-11-18T01:04:00
    date_raw: 18 Nov 2009 — 1:04am
    votes: null
    html: |-
      <p>I usually use millimeters to measure baselines.<br>
      You should adjust the starting point of the baseline in order to align it to the bottom margin. The exact measurements will depend on the paper height too.</p>
