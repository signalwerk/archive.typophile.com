    date_raw: 17 Nov 2009 — 3:39pm
    votes: null
    html: |-
      <p>Just for example, I start the baseline at 0pt from the top margin, with a 8pt/10pt type leading and 15mm margins. The last line of the baseline will only sit on the bottom margin if I adjust the bottom margin, but let´s say that I don´t want to change my margins values. Can you give me an example of a baseline grid with these measurements?</p>
      <p>Thanks a lot</p>
      <p>RC</p>
