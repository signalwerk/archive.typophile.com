  html: |-
    <p>Hi all!</p>
    <p>When creating a baseline grid in Indesign CS3, I noticed that the last line of the baseline does not sit on the bottom margin guide. Does anyone knows how to adjust this?</p>
    <p>Thanks!</p>
    <p>RC</p>
