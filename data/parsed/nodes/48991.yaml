    <p>Hi I am new here so please forgive me if I have made any etiquette mistakes by posting in the wrong area.</p>
    <p>i am sure you chaps must have covered this before although a search beared no suitable results.</p>
    <p>I am looking for a font very close to the C4 family (channel 4), really desperate to find a close match. My client did not like my first choices of Din, Aniverse or Museo - at this rate i'll be whipping out Comic Sans and hanging my head in shame.</p>
    <p>thanks thomas</p>
