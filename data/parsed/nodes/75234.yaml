    <p>The School of Visual Concepts in Seattle is hosting a two-day educational event called Type Americana. It includes 8 talks on American type history, a hands-on type design workshop with Sumner Stone and another workshop printing with blocks from the Hamilton Wood Type Museum. Speakers: Steve Matteson, Patricia Cost, Juliet Shen, Thomas Phinney, Paul Shaw, Shelley Gruendler, Sumner Stone, Jim Moran, Bill Moran. Registration includes tickets to the Seattle premiere of Richard Kegler's film, "Making Faces: Wood Type in the 21st Century," and a Q&amp;A session with Kegler. All 8 talks (incl. lunch), both workshops, and film admission: $275. Just the talks (incl. lunch) and film: $150. Workshops will be limited to 15 participants each, so register early! Program details and registration at <a href="http://www.svcseattle.com" title="www.svcseattle.com">www.svcseattle.com</a>. There is a hotel discount code.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TypeAmericana_6003.jpg"></div><p></p>
