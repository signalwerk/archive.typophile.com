      <p>I adore <em>Lubalin Graph</em> because of its delicate design: see the capital G and the capital Q.<br>
      Anyway, I am bias, I admire Herb Lubalin's style.<br>
      It's my favorite slab serif even though I enjoy <em>Ionic</em>.<br>
      I pair <em>Lubalin Graph</em> with <em>Avant Garde Gothic</em>.<br>
      For the record, <em>Rameau</em> takes its roots from <em>Le Romain du Roi</em> and <em>Fleischmann</em>.</p>
