    <p>Hello,</p>
    <p>I'm writing a short little "book" called "Essential Typefaces", where I state typefaces I either consider essential or downright beautiful. I have 4 categories: Sans-Serif, Serif, Script and Blackletter. I have 6 typefaces per page, and so right now I'm at the point where I need 2 more serif typefaces to fill the last page.</p>
    <p>I have pretty much every typeface in there that I want to have in there. So my question is, could you tell me your personal top 10 (or whatever number) serif typefaces? If I see enough typefaces I didn't put in there yet I will even consider adding another page.</p>
    <p>I won't be stating the typefaces I already have because it's too many. That's why I'm asking for a top 10, so there's a bigger chance to see a typeface I don't have in there yet. Also, it needs to be a typeface that is easily available. I'm not looking for typefaces you only find in obscure typography books. I already have too many of those in there...</p>
