      <p>I said I wouldn't state the typefaces I have, but on your request I will state 2 serifs of each page I have:<br>
      Albertina, Arno Pro, Caecilia, Clarendon, Fleischmann, Haarlemmer, Lexicon, Mrs. Eaves, Proforma, Roos, Thesis, Trinité, Walbaum.</p>
      <p>Those are just a few.</p>
      <p>As for criteria, I really don't want to state any free typefaces because they're often incomplete. Also, I want to keep fonts that are not well available and fonts still in development very limited. As this document is called "Essential Typefaces" I want to involve the "legendary" typefaces. I think I put in quite a few of those, but probably not all. Furthermore, I want some diversity. That's all the criteria I have. So just state some you like, regardless of whether they're considered original or unique or not.</p>
