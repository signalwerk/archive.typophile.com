    html: <p>I thought I'd check on that. Monotype News Gothic Condensed was too narrow, but looked very much like it. Bitstream News Gothic was too wide, and didn't have the distinctive capital Q. But Elsner and Flake, Linotype, and URW News Gothic all match.</p>
