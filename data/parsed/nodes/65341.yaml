    <p>Hello everyone!</p>
    <p>I was looking for the exact typeface that Scrabble uses on their tiles. I am aware that there are many variations, but this is the one I am looking for. From my search on whatthefont, the closest I came to was the Superbastone family.</p>
    <p>I am actually looking for the traditional typeface of the old scrabble. Unsure if the image posted is the one that I am looking for.</p>
    <p>Please help!</p>
    <p>Cheers.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/scrabble-letters-step-11_6356.jpg"></div><p></p>
