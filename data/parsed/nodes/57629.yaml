      <p>I require clients pay for a font (once!) because THEY are the one printing the work, not me. I’m simply designing for them, and they’re not paying ME for the font, they’re paying the type designer directly. If I were an in-house designer, the company would buy the font, right?</p>
      <p>As far as the book is concerned, I had no idea how to handle it. I simply didn’t want to be taken advantage of. I’ve had my work stolen so often that it’s extremely rare to have somebody ask permission beforehand. The book is on a very hot, historic topic and I expect it will sell very well. Seriously well, especially with an October release. </p>
