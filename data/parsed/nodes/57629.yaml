      <p>Accept!  Professors don’t really tend to make money off of their publications.  Most tend to be pretty short run (there are of course exceptions) with little to no profits.  In any case, if I understand you correctly, he’s wanting to put you in the canon, so to speak, which can be far more beneficial to you than a licensing fee.</p>
      <p>As for fonts... no.  Your poster is a finished work that you’ll probably be sending to him with the fonts outlined or otherwise rasterized, so licensing isn’t a concern.</p>
