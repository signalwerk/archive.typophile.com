      <p>A coffee table book is always a pretty, impressive book. In addition, you say it’s a major publisher, so it’s going to be (hopefully) everywhere and therefore it’s going to be watched by many people (free publicity, as James says). And your poster will be among other great designs. It’s like saying, “See?, this people think I’m good on my job, just as good as the other rockstars included here!”</p>
      <p>I’d go for it, for sure.</p>
