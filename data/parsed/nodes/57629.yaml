    html: "<p>If it’s a 186 poster book with 200 pages, there could easily be a solid 30-60 pages of writing, which could indeed be a pretty serious bit of writing.</p>

      <p>While when I write an academic work on literature I can easily reference multiple works citing only the most relevant part since presumably any major library at a research university will have them or can quickly retrieve them with ILL, pieces on visual works (especially posters which can be have very short public lives and may not otherwise be published in any other place),  illustrations are a necessity and may not be available in published form anywhere.</p>

      <p>I’d discuss the work some with the author, to see precisely how he wants to go about the work.  If it’s a mere collection, then you’ll likely want to ask for compensation, but (I think I lean more to this) if it’s a substantial work that requires illustrations to be meaningful, I don’t think it’s necessary.  Actually, just ask him to see a draft copy of the chapter he’s using your book and maybe the introduction too.  Contractual obligations with the publisher aside, he’ll probably let you take a look, and from what you read you can decide how to proceed.  Liberal arts publishing, at least from my experience in the literature world, isn’t quite as secretive as, say, science publishing.</p>

      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>"
