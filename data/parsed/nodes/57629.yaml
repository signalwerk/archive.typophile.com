      <p>[Alaskan] <cite>I always make clients license the fonts I use, even if it’s for a newspaper ad and they’ll never use the font again. So why wouldn’t this author be required to license the fonts? Can somebody clarify?</cite><br>
      [James] <cite>In most cases you only have to license a font once. If you already licensed the fonts when you created the poster, and aren’t sending the fonts along to use in the book, there’s no need to license to fonts again.</cite></p>
      <p>Approaching it from the other end:<br>
      The client needs to license fonts as soon as he is handed files (for InDesign, Illustrator, etc) which, for modification or printing or generating PDFs, require that fonts are installed on his computer.<br>
      But if the client receives files with text converted to outlines or rasterized, or receives PDFs with fonts embedded (please check the EULA for this point), he can modify or print or generate PDFs without fonts being installed on his computer, and in this case does not need to license them.</p>
      <p>[Alaskan] <cite>... but all the work I sell (publish or print) myself consists of outlined fonts when I submit the final file.</cite></p>
      <p>I assume that in the first place you get paid not for mere files but for design.&nbsp;&nbsp;:)</p>
