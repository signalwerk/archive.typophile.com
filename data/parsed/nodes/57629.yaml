    <p>I received and email from an art history professor who’s writing a book on poster design, and he wants to include one of my posters. He purchased one directly from me off the internet a year ago. I’ve never had such a request before, and I’m not quiet sure how to reply. </p>
    <p>He hasn’t offered any compensation, just asked for permission and a short bio to accompany the poster. He has a contract with a major publisher already, so I assume he’ll profit (off the work of several designers!)</p>
    <p>Should I reply with a payment request, or just allow him to use it for the PR?<br>
    Is he responsible for licensing the fonts I used in the poster?</p>
    <p>Has anyone else been published like this? If so, has it been beneficial or not?</p>
    <p>Thanks for any advice you can offer.</p>
  html_clean: |-
