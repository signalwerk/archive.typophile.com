      <p>Alaskan, maybe I can cite a couple of examples from the type community... First example: Tamye Riggs recently posted a request here (and <a href="http://www.facebook.com/group.php?gid=35678162623">elsewhere</a>) for work using certain typefaces considered to be classic, and <a href="http://www.rotovision.com/description.asp?isbn=978-2-88893-043-3">the book is due to be published in June</a>. The other example: When Leslie Cabarga was writing his <a href="http://www.lesliecabarga.com/products/logo-font-and-lettering-bible"><em>Logo, Font and Lettering Bible</em></a>, he sent out requests to designers he knew, and he got many illustrations for his book this way. Everyone received credit, and got some exposure in exchange. A win-win situation for all involved, I suppose.</p>
      <p>I think that this author has gone about things the right way — he’s written you in advance to request your permission to use your work. Of course, you don’t know this professor the way you might know Tamye or Leslie, but you could find out if he’s published other books — that might give you some reassurance as to his intentions. Or, as Matthew suggests, ask him if you can see a draft, a chapter, etc.</p>
