  - id: 597052
    user: 52182
    date: 2015-01-10T15:34:00
    date_raw: 10 January 2015 - 3:34pm
    votes: 0
    html: |-
      <blockquote><p>but as you can see, the result was not good - ’stacking’ feeling was lost and the whole shape became unstable.</p></blockquote>
      <p>I'm not sure the shapes are necessarily unstable. The counter space 01 sample could work well if you increase the spacing accordingly. But ultimately it seems you're not increasing readability so much as merely creating optical variants. Counter space 01 could be used at smaller sizes, and Counter space 02 even smaller than that. I don't feel like the readability changes drastically with the enlarged counter size. In fact, I think counter space 01 has the correct counter space for the size it's shown at, while I feel the current design works well at the larger sizes you showed in your original post, but doesn't work as well at the size you're showing now. The counters and spacing are just too tight.</p>
      <p>As for the readability in general, I think it's not too bad at display size. Like André (sim) implied, the typeface works quite well for "slow life". However, I just noticed you increased the tracking in that sample, which is why it's easier to read as well. I think the conclusion to draw here is that you current design works well at very large sizes, while for most display uses people probably require "Enlarged counter space 01" with greater spacing. By making optical variants you will greatly increase the application range of your typeface. Whether there's a need for it I don't know. You will have to decide for yourself.</p>
      <p>The last thing I want to say is that I think for this typeface ligatures should be avoided. In the third picture I can read "I'm" and "don't" and I think the first sample says "A 'n' D", but the rest I simply can't read. The shapes confuse me to such large extent that I can't even try to encode them. For display typefaces it can be fine if it takes people longer to read it, but with the ligatures in this design I feel it becomes impossible to read. Do note you're at the outer edge of several restrictions on type in general; you're somewhere at the most extreme width, you're using the highest weight and the smallest possible counters, the tightest spacing and if you think of the negative space between letters and in counters as a hairline stroke, depending on the size your typeface is used at you actually went beyond the outer limit of how small hairline strokes should be. If you work with so many extremes in type, it will be very risky to introduce ligatures as well. Just to offer some perspective, I've had a client who didn't want me to use discretionary ligatures in Calibri because they didn't understand it. Obviously ligatures are getting more and more common again, but don't make it unnecessarily confusing. Ligatures should be included predominantly to improve the reading experience. When they actually greatly disrupt the reading experience, you might have to rethink what you're doing.</p>
