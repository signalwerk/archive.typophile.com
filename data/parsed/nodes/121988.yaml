    <p>Hello Typephile members.</p>
    <p>I've released my typeface "BOXDON" which was especially designed for vertical layout. The typeface looks like boxes or playing blocks with minimal counter space to enhance 'stacked' feeling as much as possible.</p>
    <p>In general, Japanese, Chinese and Mongolian, etc. is well known as languages which can have vertical layout system. However, even in usage of Latin alphabets, we can see some examples of vertical layout as building signage and spine of books. Then I thought that we have possibility to design special typeface for vertical layout to dig out expansion of type design world.</p>
    <p>I hope this typeface gives spicy inspiration to your graphic design..</p>
    <p>BOXDON at <a href="https://www.myfonts.com/fonts/tydtyp/boxdon-titling/" title="Click to visit an external secure URL." class="freelink freelink-external_ssl freelink-external">MyFonts</a>.</p>
