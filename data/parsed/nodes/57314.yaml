    html: |-
      <p>PAGES in this case = 60-lb, acid-free natural or bright white (optional 50-lb, 70-lb, 80-lb, 30% PCW recycled)</p>
      <p>PERFECT BINDING = individual sheets of paper (not signatures), gathered, bind edge slightly scored/roughed, glued on the bind edge, cover drawn on to glued edge</p>
      <p>COST: The business I referred to is BookMobile (<a href="http://www.bookmobile.com/product.cfm?prod_id=101" title="http://www.bookmobile.com/product.cfm?prod_id=101">http://www.bookmobile.com/product.cfm?prod_id=101</a>). On the web site a quote can be gotten. One may have to sign in to get a quote; I'm not sure how it works for new users.</p>
      <p>They do not do one-offs. I know this is what the original poster asked about. But I was replying only to the general assertion that perfect binding of fewer than 20 pages was not possible.</p>
      <p>As far as short-run digital printing of books, BookMobile is among the best in the business.</p>
      <p>powers</p>
