      <p>Are the sheets imposed? The perfect binding process really requires signatures, ideally of 16 pages, but eights and fours are possible. I don't know how you could sew single sheets (two pages). I certainly wouldn't want to warranty pages against falling out with singles.</p>
      <p>That said, why not call a university library. Many university graduate programs require bound theses, and thus those places should (might) know where to get it done.</p>
