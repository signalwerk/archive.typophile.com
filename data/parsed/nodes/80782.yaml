      <p>Hard to tell from these samples, but most WPA posters were hand lettered. <a href="http://new.myfonts.com/fonts/mvbfonts/mvb-magnesium/?refby=typographica">Magnesium</a> is a decent match.</p>
      <p>BTW, I made <a href="http://fontstruct.com/fontstructions/show/wpa_gothic">a font</a> based on another WPA lettering style. I'll give you a good deal on a commercial license if you're interested. ;)</p>
