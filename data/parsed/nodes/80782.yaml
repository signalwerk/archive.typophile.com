    <p>Hi there,</p>
    <p>I'm doing some work for a client on WPA-esque style posters. He's provided me with Duarte for some of the other areas of the poster, but I need to find the font I've attached here as it has been used on previous posters and the client doesn't have it. I ran it through whatthefont but to no avail.</p>
    <p>Any ideas guys? Help much appreciated.</p>
    <p>Thanks.</p>
