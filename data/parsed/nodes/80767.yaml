  html: |-
    <p>The <a class="freelinking external" href="http://www.typesociety.org/" rel="nofollow">Society of Typographic Aficionados</a> has announced that the submission deadline for TypeCon2011 programming has been extended to <strong>Friday, April 8th</strong>. This includes programming proposals for both the <a class="freelinking external" href="http://www.typecon.com/archives/61" rel="nofollow">main conference program</a> as well as the standalone <a class="freelinking external" href="http://www.typecon.com/archives/62" rel="nofollow">education forum</a>.</p>
    <p>Additionally, they have also extended the deadline for <a href="http://www.typecon.com/archives/73" rel="nofollow">SOTA Catalyst Award</a> entries to <strong>Friday, April 8th</strong>. If you are under 30 years of age and creating original work in type design, type history, or other areas related to typography, please consider entering.</p>
    <p>More information is available on the <a class="freelinking external" href="http://www.typecon.com/" rel="nofollow">TypeCon</a> web site.</p>
