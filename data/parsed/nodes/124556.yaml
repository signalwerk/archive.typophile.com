    <p>Hi Typophiles!<br>
    Here is a free coloring page promoting my kickstarter book:<br><a href="http://csacreativestudio.com/book/Ahole_Coloring.pdf">http://csacreativestudio.com/book/Ahole_Coloring.pdf</a></p>
    <p>----------</p>
    <p>A-holes was inspired by the amusing double entendre of the phrase "A-holes"—the technical term for the negative space in a letter A (this space is actually called the "counter"). Letters' negative space might seem irrelevant, but it determines a lot about the character of a font. As the book shows, the shape of a hole can tell you if a font is a serif or sans serif, and it can tell you where elements like the stroke, crossbar or bowl are located. Holes are like a traceable pattern, giving you clues about a typeface without seeing it.</p>
    <p>Though I know his idea would make for a fun coffee table book, I also wanted it to be an educational tool for learning about type. I include sections on "A-hole Anatomy" (labeling the parts of a typeface) and "Historic A-holes" (a timeline of the negative spaces in fonts over the past 200 years).</p>
    <p>You can find the complete details here:<br><a href="https://www.kickstarter.com/projects/1713840944/a-holes-a-type-book">https://www.kickstarter.com/projects/1713840944/a-holes-a-type-book</a></p>
