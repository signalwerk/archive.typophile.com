    <p>Russell McGorman is a designer and artist, living and working in Toronto, Ontario, Canada.</p>
    <p>Upon graduating from the Ontario College of Art and Design, Russell worked for a time as a welder-fitter, capitalizing on his study of modern sculpture. His career in the graphics arts began as a silk-screen printer and production designer at Multiple Arts, a small shop in Toronto which specialized in close to everything. There he worked on a diverse range of projects, from POP displays to store fronts, to museum displays and prop graphics and signage for film sets, to control panels for oil rigs and power generating plants.</p>
    <p>After a couple of years of that, Russell accepted a position as a Signage and Special Products designer at GO Transit, a major regional public transit agency and then for Metrolinx, (of which GO Transit is now a division), where he still works as a Wayfinding Specialist.</p>
    <p>He also runs Our House Graphics, his part-time freelance design studio which is currently concentrating on the design of retail typefaces.</p>
    <p>Russell began designing and publishing typefaces in 2009. It began with the simple question, “How exactly do digital typefaces work, and how are they made?” and quickly progressed to designing and publishing his own growing catalogue of fonts, all of which are created with a passion for excellence and a love for the art and science of type.</p>
    <p>Retail typefaces (<a href="http://www.myfonts.com/fonts/ourhousegraphics">http://www.myfonts.com/fonts/ourhousegraphics</a>):</p>
    <p>Eighth Avenue<br>
    Eighth Avenue Italic<br>
    Eighth Avenue Stencil</p>
    <p>After 5<br>
    After 5 Italic</p>
    <p>Baro Black<br>
    Baro Black Condensed<br>
    Baro Black Italic</p>
    <p>Campcraft<br>
    Campcraft Base<br>
    Campcraft Fwd Pos<br>
    Campcraft Outline</p>
    <p>Kush Fat<br>
    Kush Shade</p>
    <p>Metro Bots Chromatic 1<br>
    Metro Bots Chromatic 2<br>
    Metro Bots Chromatic 3<br>
    Metro Bots Chromatic 4<br>
    Metro Bots Dieline<br>
    MetroBots Ultra</p>
    <p>Reo<br>
    Reo Rear</p>
    <p>Silex<br>
    Silex Black Italic<br>
    Silex Black Stencil</p>
    <p>Tynne<br>
    Tynne Italic<br>
    Tynne Shade Italic<br>
    Tynne Shade Medium</p>
