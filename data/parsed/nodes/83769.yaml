  html: |-
    <p>Hi everybody,</p>
    <p>I was wondering this: In a bold the x-height is often slightly increased to optically match the x-height of the regular. However, this will cause the ascenders to look shorter (compared to what they look like without increasing x-height). Shouldn't the descenders be made shorter too, to match the acsenders? Any examples/advise is much appreciated.</p>
    <p>Cheers,<br>
    Jasper</p>
