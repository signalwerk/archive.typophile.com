    votes: null
    html: '<p>Well, technically the ascenders not only <em>look</em> but actually <em>are</em> shorter when you increase just the x-height. So conversely, one might increase not just the x-height but also ascender height (and possibly cap height) plus descender depth as well, to keep extenders the same length. See for instance Adobe Caslon, example image in this thread: <a href="http://typophile.com/node/65057" title="http://typophile.com/node/65057">http://typophile.com/node/65057</a> (Shifting Vertical Metrics for Darker Weights)</p>'
