      <p>Jan beat me to it. This lettering can't be purchased. It's written by hand, not using a font. Here are some font ideas: </p>
      <p><a href="http://www.veer.com/partner/link.aspx?i=1048&amp;c=4&amp;p=products/typedetail.aspx?image=UMT0000267" rel="nofollow">Burgues Script</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/monotype/bickham_script_pro_ot/" rel="nofollow">Bickham Script</a><br>
      <a href="http://www.fontshop.com/fonts/singles/urw/polonaise_bold_ot_std_urw/" rel="nofollow">Polonaise</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/itc/itc_edwardian_script/" rel="nofollow">ITC Edwardian Script</a></p>
      <p>But the best way to emulate this look is to hire a good calligrapher.</p>
