    html: <p>i think myth is the wrong word. the fact that you lose serifs at a small size means you lose the initial integrity and styling of the face. the logic could be used that if you lose them, then why use them. the fact of the matter is that though older forms of typography may be beautiful in their original context they don't always translate well to new contexts (like broadcast). the common rule for broadcast legibility is; you should not use a serif for anything below 14pt.</p>
