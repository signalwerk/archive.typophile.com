    html: "<p>&gt; Is it even called antialising in TV terms? <br> <br>I did fonts for the original MS Web TV in Europe and the term for filters or anti-aliasing in TVs was commonly referred to as an 'anti-flicker filter'. In our set-top box there was a Windows CE based OS using anti-aliasing and an added filter to control 'white' which is technically illegal since it causes many problems. Ever notice on US TV a sports score in the corner with Black text on a white background. It will jump around and even sometimes make audible noise.  <br> <br>other things about TVs are: single pixels and fine things get lost in the scan lines and the fuzz of the filters and screen. You need at least two pixels of anything, stems, counters and inter-character spacing for it to be represented correctly. This is also why text is usually large. The filters are there to keep the guns in the TV from going completely ON to completely OFF, this causes noise and jumping of the image. Also in the fonts I created 'ink traps' and used TrueType hinting to open up counters so that when the filters blurred everything up the counters wouldn't completely collapse. Same principle as Carter's Bell and older newspaper fonts where the ink would spread with the porous paper. </p>"
    html_clean: "<p>&gt; Is it even called antialising in TV terms? <br> <br>I did fonts for the original MS Web TV in Europe and the term for filters or anti-aliasing in TVs was commonly referred to as an 'anti-flicker filter'. In our set-top box there was a Windows CE based OS using anti-aliasing and an added filter to control 'white' which is technically illegal since it causes many problems. Ever notice on US TV a sports score in the corner with Black text on a white background. It will jump around and even sometimes make audible noise.  <br> <br>other things about TVs are: single pixels and fine things get lost in the scan lines and the fuzz of the filters and screen. You need at least two pixels of anything, stems, counters and inter-character spacing for it to be represented correctly. This is also why text is usually large. The filters are there to keep the guns in the TV from going completely ON to completely OFF, this causes noise and jumping of the image. Also in the fonts I created 'ink traps' and used TrueType hinting to open up counters so that when the filters blurred everything up the counters wouldn't completely collapse. Same principle as Carter's Bell and older newspaper fonts where the ink would spread with the porous paper. </p>"
