    votes: null
    html: <p>I won't even call those things on Poppl-Laudatio 'half serifs'... they are simply flares. They are going to disappear at small sizes on the TV screen, for sure. The whole point of having these flares is to ensure the corners are sharp and not eaten away by phosphorous. They will show at large sizes though. <br> <br>"it is a good rule of thumb to not use serifed typography on screen unless at much larger sizes" <br> <br>This is a myth. It can't be more untrue. Early captioning at BBC used a slab-serif, which improves letter definition by reinforcing corners, much like what I said about flare serifs, so the strokes don't break up.</p>
    html_clean: <p>I won't even call those things on Poppl-Laudatio 'half serifs'... they are simply flares. They are going to disappear at small sizes on the TV screen, for sure. The whole point of having these flares is to ensure the corners are sharp and not eaten away by phosphorous. They will show at large sizes though. <br> <br>"it is a good rule of thumb to not use serifed typography on screen unless at much larger sizes" <br> <br>This is a myth. It can't be more untrue. Early captioning at BBC used a slab-serif, which improves letter definition by reinforcing corners, much like what I said about flare serifs, so the strokes don't break up.</p>
  - id: 2299
    user: 1250
    date: 2003-06-18T17:53:00
    date_raw: 18 Jun 2003 — 5:53pm
    votes: null
    html: "<p>Yes, those are best called flare serifs, and the way they render out in low-fidelity (like at smaller sizes on TV) is pretty interesting: they seem to make things blurrier, but since the curved parts of letters are unavoidably blurry anyway, they end up making for a harmonious whole. Plus they can break the monotony (like in the word \"million\"). <br> <br>As for \"full\" serifs, I agree that it's a matter of using them carefully, not avoiding them. <br> <br>hhp <br></p>"
    html_clean: "<p>Yes, those are best called flare serifs, and the way they render out in low-fidelity (like at smaller sizes on TV) is pretty interesting: they seem to make things blurrier, but since the curved parts of letters are unavoidably blurry anyway, they end up making for a harmonious whole. Plus they can break the monotony (like in the word \"million\"). <br> <br>As for \"full\" serifs, I agree that it's a matter of using them carefully, not avoiding them. <br> <br>hhp <br></p>"
