    html: "<p>You're right, Laudatio is too tight for smaller sizes, especially on-screen - you should track it looser. The great thing about it though is that it works well small or large: high legibility in the former, visual interest in the latter. And for large sizes you'd leave the spacing as-is. It's better to have a font that's too tight than too loose. <br> <br>As for terminology, I don't see a problem using \"anti-aliased\" and \"bitmap\" for TV use - although the lower the fidelity the less relevant bitmaps are. <br> <br>hhp <br></p>"
