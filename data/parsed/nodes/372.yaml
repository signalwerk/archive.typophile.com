    html: <p>"the logic could be used that if you lose them, then why use them." <br> <br>I think you've mistaken. If there are no "flares", the actual stems would be eaten away, so you'll end up having sans-sanserif! The 'spikes' help maintain the integrity of the essential forms of the letters themselves. So what you'll end up is a razor sharp sanserif. Matthew Carter's Bell Centennial was designed like that to withstand the poor quality typesetting and printing of phone books. It's the same idea with actual serifed type, only that you won't lose the entire serif. So things would still be razor sharp. Of course, by serif I mean slab-serif, not delicate typefaces like Garamond or Baskerville. <br> <br>My Arrival typeface has flares too because the same happens when you view type from great distances. That's why sign painters used to add 'flicks' at ends of their sanserif letterforms.</p>
    html_clean: <p>"the logic could be used that if you lose them, then why use them." <br> <br>I think you've mistaken. If there are no "flares", the actual stems would be eaten away, so you'll end up having sans-sanserif! The 'spikes' help maintain the integrity of the essential forms of the letters themselves. So what you'll end up is a razor sharp sanserif. Matthew Carter's Bell Centennial was designed like that to withstand the poor quality typesetting and printing of phone books. It's the same idea with actual serifed type, only that you won't lose the entire serif. So things would still be razor sharp. Of course, by serif I mean slab-serif, not delicate typefaces like Garamond or Baskerville. <br> <br>My Arrival typeface has flares too because the same happens when you view type from great distances. That's why sign painters used to add 'flicks' at ends of their sanserif letterforms.</p>
