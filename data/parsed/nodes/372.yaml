  html: <p>Hi, I am new to these forums. I am about to attempt to design a new font for television closed captioning.  I plan on experimenting with a bitmap font due to the low resolution (~560x420) of a standard television screen.  Anyway, I have never designed for a tv screen and am wondering what fonts read well on tv (for long periods of reading of course, not a display face). I would like to look at them for inspiration in designing an extremely legible television font. Thanks in advance.</p>
