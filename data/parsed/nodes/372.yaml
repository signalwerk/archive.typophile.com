    html: <p>i agree with hrant's post that tiresias is a good face for broadcast legibility. though i disagree with the suggestion of poppl-laudatio medium. though both these faces have large x-heights which help with legibility in general. the later has a half serif detailing, which are hard to make out on screen. it is a good rule of thumb to not use serifed typography on screen unless at much larger sizes.</p>
