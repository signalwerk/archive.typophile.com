    html: <p>PPEM covers every output resolution.  <br>(Pt size * resolution)/72 = PPEM <br> <br>There are two instruction MPPEM[] and MPS[] <br>Measure PPEM is better since you are dealing with the specific image. With Pt size the images will rary and the instruction isn't useful for conditional hinting.  <br> <br>You can't trust hinting to be used all the time. PostScript devices sometimes throw away hints.  <br> <br>The fonts I hinted for TV checked if they were in grey scale and then thickened up the stems to be two pixels, one black one grey, the grey on the left I believe since it was sharper on the TV, on the Right it was lighter.  <br> <br>Extra points were added to the crotch of the A, K, V, W, Y and those points were pulled out at small sizes.  <br> <br>I believe image of the V is in the RIDT98 document at the end.  <br> <br> <br></p>
    html_clean: <p>PPEM covers every output resolution.  <br>(Pt size * resolution)/72 = PPEM <br> <br>There are two instruction MPPEM[] and MPS[] <br>Measure PPEM is better since you are dealing with the specific image. With Pt size the images will rary and the instruction isn't useful for conditional hinting.  <br> <br>You can't trust hinting to be used all the time. PostScript devices sometimes throw away hints.  <br> <br>The fonts I hinted for TV checked if they were in grey scale and then thickened up the stems to be two pixels, one black one grey, the grey on the left I believe since it was sharper on the TV, on the Right it was lighter.  <br> <br>Extra points were added to the crotch of the A, K, V, W, Y and those points were pulled out at small sizes.  <br> <br>I believe image of the V is in the RIDT98 document at the end.  <br> <br> <br></p>
