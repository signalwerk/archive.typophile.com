    html: |-
      <p>Neither Century Gothic nor Lubalin Graph seem human and friendly to me. I’d suggest a less constructed typeface. If you’re looking for a slab, try Serifa or Salvo (grotesque-model) or Caecilia and the like for more humanist forms and proportions.<br>
      Or browse here: <a href="http://myfonts.us/td-vL12P2" title="http://myfonts.us/td-vL12P2">http://myfonts.us/td-vL12P2</a></p>
