      <p>Here’s the short explanation of what’s going on:<br>
      <strong>Resource Fork:</strong> The PC and Mac differ in the way they store files. On a Mac [Classic] each file can have two parts called forks. The <em>data fork</em> holds data (text, images, etc.). The <em>resource fork</em> holds resources (icons, fonts, menus, sounds, etc.). There are actually two files linked to one name in the file system. PCs only have one file linked to each name.<br>
      <strong>Fork:</strong> A fork is a stream of data associated with a file name in a file system. Macintosh HFS files have two forks. PC FAT and FAT32 files have one fork. NTFS files can have many forks.<br>
      <a href="http://www.asy.com/glossary.htm" title="http://www.asy.com/glossary.htm">http://www.asy.com/glossary.htm</a></p>
      <p>And here’s the long one:<br>
      <a href="http://en.wikipedia.org/wiki/Resource_fork" title="http://en.wikipedia.org/wiki/Resource_fork">http://en.wikipedia.org/wiki/Resource_fork</a></p>
