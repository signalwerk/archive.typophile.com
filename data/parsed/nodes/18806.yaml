    <p>Howdy,</p>
    <p>I’m looking for help with a font installation problem in OS X. </p>
    <p>I’m an editor currently doing a job in InDesign. The chapters are coming to me via ftp...no problems there. However, I don’t have some of the fonts I need. The designer (who’s also using OS X) has uploaded them to her ftp site, where each displays as a series of stuffed files and a few empty files (e.g., “0 KB”)</p>
    <p>When I download them and run them through Stuffit Expander, I end up with LWFN files which the computer refuses to recognize. They’re greyed out in Font Book’s selection window, so adding them that way doesn’t work. Dragging them to the various folders doesn’t work, either. I’m assuming I need FFIL files, but so far neither I nor my designer have been able to dig them up.</p>
    <p>Obviously, we’re doing something wrong, and it’s probably something pretty basic. But I have no clue what it is. I’d be eternally grateful for any advice anyone might have.</p>
    <p>Thanks!</p>
