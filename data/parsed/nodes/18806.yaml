    html: <p>Sounds like you’re using old OS9 fonts. Ask the designer to Stuffit the fonts before he/she uploads them. (This way the information contained in the resource fork of the font files won’t be lost when they are uploaded. Stuffing the files will temporarily transform their resource fork into a data fork ’format’, which other OSes can read. In other words, the files won’t show up having a zero KB size.)</p>
