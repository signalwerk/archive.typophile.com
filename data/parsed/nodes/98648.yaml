    html: <p>Don't think it's Cheltenham, even condensed. Some <a href="http://www.myfonts.com/search/caslon+condensed/fonts/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Caslon Condensed here</a>. Another option would be to go with <a href="http://www.myfonts.com/fonts/marksimonson/bookmania/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Bookmania</a> with tons of swashes and alternates. It could be a good font to base your work on (even if it looks far from your original sample).</p>
