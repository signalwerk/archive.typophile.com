      For "THOMAS OLIVER BAND", I think it's a customization of an existing typeface. If I have to reproduce it, I'd probably start with <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/linotype/adobe-caslon/" rel="nofollow">Caslon Bold</a>, slant it, rework all serifs (to make them pointy and geometric, <a class="freelinking external link-external" href="http://www.myfonts.com/search/latin+serif" rel="nofollow">latin serifs</a>), redraw /T and add some swashes and flourishes (have a look to swashes and ornaments through Adobe Caslon Pro OpenType features).</p>
