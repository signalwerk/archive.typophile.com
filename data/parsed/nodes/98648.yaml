    html: |-
      <p>"ZEBRA AND GIRAFFE" is a handlettring, entirely done from scratch, by <a class="freelinking external" href="http://www.behance.net/gallery/ZEBRA-GIRAFFE-T-SHIRT-DESIGN/4989625" rel="nofollow">Hylton Warburton</a> (sketch <a class="freelinking external" href="http://behance.vo.llnwd.net/profiles12/496251/projects/4989625/8a2586ae96402df0806bb12fe94a9b8a.png" rel="nofollow">here</a>) so definitely not-a-font.<br>
      For "THOMAS OLIVER BAND", I think it's a customization of an existing typeface. If I have to reproduce it, I'd probably start with <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/adobe-caslon/" rel="nofollow">Caslon Bold</a>, slant it, rework all serifs (to make them pointy and geometric, <a class="freelinking external" href="http://www.myfonts.com/search/latin+serif" rel="nofollow">latin serifs</a>), redraw /T and add some swashes and flourishes (have a look to swashes and ornaments through Adobe Caslon Pro OpenType features).</p>
    html_clean: |-
