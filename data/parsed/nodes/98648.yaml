    html: <p>Don't think it's Cheltenham, even condensed. Some <a class="freelinking external" href="http://www.myfonts.com/search/caslon+condensed/fonts/" rel="nofollow">Caslon Condensed here</a>. Another option would be to go with <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/bookmania/" rel="nofollow">Bookmania</a> with tons of swashes and alternates. It could be a good font to base your work on (even if it looks far from your original sample).</p>
