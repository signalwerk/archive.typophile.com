    <p>okay, so i guess no one else caught my post yesterday from <a href="http://typophile.com/node/13459">the original WikiBlast challenge thread</a>, so i’ll repost here:</p>
    <p><em>well, maybe only 6 or so months later… but we’re only 10 away from our goal of 1000 articles in the <a href="wiki/typowiki" class="wiki">typowiki</a>. maybe we’ll break it today!</em></p>
    <p>c’mon, just 8 more! if each person who logs on today writes 1 article (or updates one that needs fleshing out) i think we’ll finally surpass our goal. let’s do it!</p>
    <p>* * * * *</p>
    <p>hrant, your assignment (should you choose to accept it) is to touch on <a href="wiki/bouma" class="wiki">bouma</a> and <a href="wiki/hybrid figures" class="wiki">hybrid figures</a>.</p>
