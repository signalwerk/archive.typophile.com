    <p>It's Monday, and it's time for a Typophile favorite — the Type Battle!<br>
    What better way to refine your craft, than to get hands-on with it?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/zapf_dingbats_6298.png"></div><p></p>
    <p><strong> This week's battle: Draw 3 contemporary additions to the world's most ubiquitous dingbat font, Zapf Dingbats.</strong></p>
    <p>Winner take all, no holds barred. May the best designer win.</p>
    <p>THIS BATTLE ENDS: Friday, 28 February 2014 —&nbsp;Midnight PST </p>
    <p>// REQUIREMENTS</p>
    <p>- Solution must integrate seamlessly with Zapf Dingbats' design and contain three characters.<br>
    - Characters must be custom drawn. No use of existing fonts or clipart!<br>
    - Image size: 550 width x 400 height. 72 dpi*<br>
    - Color: Black and White<br>
    - Format: PNG, GIF or JPG (Preferred in that order. Make sure there are no spaces in the name)</p>
    <p>*Please try to keep your file sizes to a minimum! ~50k per file max.</p>
    <p>// ABOUT TYPOPHILE TYPE BATTLES</p>
    <p>This is your chance to flex your type muscles on a weekly basis. You have one week to create and submit your entry. Anyone may submit a design response to the challenge. You may enter as often as you wish. Post anytime. Critiques and comments are welcome throughout the game, from participants and spectators alike. Smack talk is encouraged.</p>
    <p>As with any street battle, there is no panel of judges and no prize — the community decides on merit alone, and you may win the ability to call yourself the best on the block for this challenge.</p>
    <p>Link directly to this battle: <a href="http://www.typophile.com/battle42" title="http://www.typophile.com/battle42">http://www.typophile.com/battle42</a><br>
    Link to the battle directory: <a href="http://www.typophile.com/typebattles" title="http://www.typophile.com/typebattles">http://www.typophile.com/typebattles</a></p>
