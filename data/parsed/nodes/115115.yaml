    html: <p>I suspect it's possible. Once I made dinner reservations at an upscale place that I hadn't gone to before. On the phone, it seemed odd that they asked me to repeat the spelling of my name. When we arrived the next evening and they seated us at our table, there was a shiny gold matchbook in the ashtray with my last name stamped in black foil on the cover. They wouldn't have had time to get a stamping die made (and the cost would have been prohibitive), so it seems likely they had a case of foundry type or Monotype, and were custom-stamping the matchbook covers directly from the type. (It's possible I asked the waiter about it, but as you can imagine from the fact that there was an ashtray on the table, this was a <em>long</em> time ago.)</p>
