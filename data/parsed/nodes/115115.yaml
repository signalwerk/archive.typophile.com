      <p>I was excited to see your post! I had been wondering exactly the same thing and did some research as well, last year.</p>
      <p>Two important variables to note, besides those mentioned on the page you linked:</p>
      <p>1) The required heat for hot foil stamping varies greatly depending on the material being stamped on. I have a saved PDF guideline doc somewhere.</p>
      <p>2) Hot foil stamping machines vary dramatically in how accurately/well they maintain an exact temperature. My Kingsley machine has a temperature gauge, but basically you manually twiddle a dial that may or may not result in any particular temperature, so holding a specific temperature is a bit of an art.</p>
      <p>My conclusions have been that I could do the stamping I want to do (foundry ATF type on book cloth or leather) with my machine, but there is a noticeable, albeit not hug,e risk of damaging the type. This is a bit perturbing to me as the font I want to stamp with is nearly irreplaceable.  :(</p>
