    html: <p>I've never done this, so I can't say definitively that it won't work, but I wouldn't expect it to. It has to do with, among other things, how the metal conducts and holds heat. I doubt lead has the right properties. Also, precisely because it is softer than brass and has such a low melting point, I wouldn't try it. But feel free to do so and report …</p>
