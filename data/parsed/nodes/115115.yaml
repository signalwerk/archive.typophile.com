      <div class="comment-spam-body"><p>I came across some good information from David S. Rose of Five Roses Press on the topic of Type for Hot Stamping and Foiling. His write-up provides a great overview of the 'types' of type.  I thought it very well done. Well, I will be trying the foundry type and have some confidence that it will work.  I will be cautious as I do not want to deal with the health issues of melting lead.  I will post the outcome.  I am hoping for a nicely stamped bookcloth cover and not a toxic paperweight.</p>
