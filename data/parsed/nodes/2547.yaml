    date: 2004-01-06T20:45:00
    votes: null
    html: "<p>Re: Bustle (nee: Babyfat or Baby Fat) <br> <br>If Mr Glaser did this one, then good on 'im. I've always known this face as the uncredited <b>Fat Shadow</b> from Letraset. (Here shown in a scan from my 1985 Letraset Product Manual) <br> <br><img src=\"http://www.typophile.com/forums/messages/83/23530.gif\" alt=\"Sample of Fat Shadow from a 1985 Letraset Product Manual\"> <br> <br>Additionally, my Photo-Lettering resources list Milton Glaser as the designer of the following typefaces not mentioned or shown above: <br> <br>Eightway (co-designed wth George Levitt) <br>Houdini <br>Filmsense</p>"
