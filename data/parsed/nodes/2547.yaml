    html: <p>The Photo-Lettering's "One Line Manual of Styles" (from 1971), besides the faces Grant mentioned, also lists Futura Stencil as being by Glaser, as well as confirm that Baby Fat is his too (see image below). I never knew there was a lowercase to this, very interesting. My previous attribution was based on something I saw in a magazine (the art director of "Fader" used Bustle for headlines, and in the colophon it was atributed to Glaser as its original designer). <br> <br><img src="http://www.typophile.com/forums/messages/83/23552.gif" alt="babyfat"> <br> <br> <br>While I was looking for the Photo Lettering book I came across these two faces from a sample book from Typographic Innovations Inc. They seem like derivatives of Babyfat to me. Note the different ampersand in Buxom (which seems like a version of Babyfat Black) <br> <br><img src="http://www.typophile.com/forums/messages/83/23553.gif" alt="buxom"></p>
