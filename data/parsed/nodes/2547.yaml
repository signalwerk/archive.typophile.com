    html: <p><img src="http://www.typophile.com/forums/messages/83/23492.gif" alt="Babyfat"> <br> <br>I don't know if this was done for PhotoLettering, but it is by Glaser. The face was originaly  called Babyfat, it now exists digitally as <a href="http://www.buyfonts.com/value_for_money/bustle.htm" target="_blank">"Bustle,"</a> (made by Font Bank).</p>
  - id: 20491
    user_id: 2585
    user_name: Alexander Tochilovsky
    user_path: null
    user_image: /files/pictures/picture-2585.png
    date_raw: 6 Jan 2004 — 12:26pm
    date: 2004-01-06T12:26:00
    votes: null
    html: "<p>I found a few other faces that Glaser had done, they are all from his book <a href=\"http://overlookpress.com/design/glaser.shtml\" target=\"_blank\">\"Art is Work\"</a>. I don't know if any of these were for PhotoLettering either. Most were custom jobs, but interesting nontheless. <br> <br>This one was done for Bruegger's, a company that makes bagels. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/23497.gif\" alt=\"Brueggers\"> <br> <br> <br>This one was a proprietary face for the Rainbow Room in NYC; It had two styles: wide and narrow. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/23498.gif\" alt=\"rainbow\"> <br> <br> <br>Einstein Bold was done for the album cover of  <a href=\"http://www.epinions.com/musc_mu-11672\" target=\"_blank\">Einstein on the Beach</a> by Philip Glass. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/23499.gif\" alt=\"einstein\"> <br> <br> <br>This one was called Kitchen. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/23500.gif\" alt=\"kitchen\"> <br> <br> <br>Another typeface called The Sesame Place, that was based on an earlier typeface of his called Houdini. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/23501.gif\" alt=\"sesame\"></p>"
