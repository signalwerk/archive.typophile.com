  html: "<p>continuing this thread: <br> <br><a href=\"http://www.typophile.com/forums/messages/83/13823.html\" target=\"_blank\">http://www.typophile.com/forums/messages/83/13823.html</a> <br> <br>Ran across some Baby Teeth usage and thought <br>I remembered someone asking about it. <br> <br>the lettering on the Dylan poster came first and <br>Glaser turned it into a complete typeface. <br> <br>I'd be curious to see any more of Glaser's PhotoLettering <br>faces if anyone has access.\\ <br> <br>bj <br> <br> <br> <br> <br><img src=\"http://www.typophile.com/forums/messages/83/23127.jpg\" alt=\"\"><img src=\"http://www.typophile.com/forums/messages/83/23128.jpg\" alt=\"\"><img src=\"http://www.typophile.com/forums/messages/83/23129.gif\" alt=\"\"></p>"
