    html: |-
      <p>Font Bureau has losts of narrow serifs on offer – for display, headlines, deck or bodycopy – since they do extensive work in the newspaper/magazine field.<br>
      Here is a <a href="http://www.myfonts.com/search/foundry%3A%28font+bureau%29+tag%3Aserif+tag%3Anarrow/fonts/?refby=i" rel="nofollow">quick search for “narrow serifs”</a> but there are many more suitable. Check the specimen on their website <a href="http://www.fontbureau.com/fonts/serif" title="http://www.fontbureau.com/fonts/serif">http://www.fontbureau.com/fonts/serif</a></p>
