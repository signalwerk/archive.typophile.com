    html: |-
      <p>I find a quick way to browse is to flip through a one-line specimen. But not every foundry produces one of these anymore. A printed Font Bureau one-line specimen can be requested. It’s also available for PDF download.</p>
      <p><a href="http://www.fontbureau.com/books/onelinespecimens/" title="http://www.fontbureau.com/books/onelinespecimens/">http://www.fontbureau.com/books/onelinespecimens/</a></p>
      <p>There’s a more recent supplement covering additions to the library since 2008:</p>
      <p><a href="http://www.fontbureau.com/books/onelinesupplement/" title="http://www.fontbureau.com/books/onelinesupplement/">http://www.fontbureau.com/books/onelinesupplement/</a></p>
      <p>but I don’t think that’s available for download yet.</p>
