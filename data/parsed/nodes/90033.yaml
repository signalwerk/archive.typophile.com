  html: |-
    <p>Hello everyone</p>
    <p>I'm currently looking for an ultra condensed serif typeface<br>
    to complement Akzidenz Grotesk bold condensed. </p>
    <p>This is to be used uppercase on a logotype and the intention<br>
    is to create an interesting and beautiful contrast between<br>
    old/traditional/delicate and modern and bold. </p>
    <p>Thanks very much</p>
