    html: |-
      <p>This is an interesting specimen Ben. On first blush it looks hand written as a result of the tones in the ink. But after close scrutiny it is a typeface... I just do not know what it is. What a wonderful ruse. The scribbling and the blot are the coup!</p>
      <p>I am so sorry that I cannot help you. But there are certainly people on this site that will come to your rescue!</p>
      <p>The fact that you thought it was a typeface is a tribute to you as I am a calligrapher and had to look twice. Yes it may have been obvious but I had to make sure!</p>
      <p>Michael</p>
    html_clean: |-
