      <p>Thanks Michael. </p>
      <p>Indeed it has been artfully done – and it's my wife, not me, who deserves the credit for recognising it as a typeface rather than a piece of lettering. Really it's an object lesson for anyone wanting to make something look handwritten while using computer software to generate the artwork... let's hope someone can solve this riddle.</p>
