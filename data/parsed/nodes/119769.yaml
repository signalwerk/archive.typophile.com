      <p>Lighthouse by Mans Greback/Aring Typeface comes awfully close (maybe they substituted a capital S for the more cursive lowercase s?):</p>
      <p><a href="http://www.myfonts.com/fonts/mawns/lighthouse/" title="http://www.myfonts.com/fonts/mawns/lighthouse/">http://www.myfonts.com/fonts/mawns/lighthouse/</a></p>
      <p>Though not an exact match by any means, Lobster Script (a free Google font), approximates the look:<br>
      <a href="http://www.google.com/fonts/specimen/Lobster" title="http://www.google.com/fonts/specimen/Lobster">http://www.google.com/fonts/specimen/Lobster</a></p>
