  html: <p>First time getting critiqued as well. <br> <br>The character set isn't complete, though all the capitals and lower case letters are done, as well as a first shot at the numbers. No kerning or anything yet, because FCP 2's kerning feature is extremely user-hostile. <br> <br>The text below (not the title) is set in 28 point. <br> <br><img src="http://www.typophile.com/forums/messages/29/24120.gif" alt="Brasspounder - Jackals *love* marzipan."></p>
