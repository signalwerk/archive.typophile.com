    html: <p>I rellly like this one, but i'm into victorian and blackletter faces and this one seems to sample from both those styles. swash caps would be very much in the spirit of victorian type and if yer real ambitious swash lc letters too. <br> <br>you really should download the demo version of FontLab from their website and convert your outlines to PS outlines just so you can see how much easier it is to work with beziers instead of pushing on- and off-curve points around - the difference is incredible! I started with font creator too it got me hooked on the whole font making thing. <br> <br>g'luck with this one.</p>
