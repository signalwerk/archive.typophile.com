    date: 2011-11-14T12:31:00
    date_raw: 14 Nov 2011 — 12:31pm
    votes: null
    html: "<p>Depressing how many backslant fonts are (or seem to be) just mechanically slanted obliques (especially non-script style ones): I imagine it would be an interesting exercise to try and work out what the cursive dynamics would be of writing right-way-round letters but from right to left (whereby the natural italic tendency would be backslant)...</p>"
