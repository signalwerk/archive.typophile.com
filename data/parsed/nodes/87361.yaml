      <p>Michael Twyman at Reading calls them “Contra Italics” and that’s how I’ve always called them ever since I’ve been there.</p>
      <p><a href="http://www.linotype.com/1410/Roemisch-family.html" rel="nofollow">Roemisch</a> and <a href="http://www.linotype.com/1582/Venus-family.html" rel="nofollow">Venus</a> both have italics and contra italics. I’m sure there’s more. Some of the fat faces by Figgins and other English foundries from the 19th century used to have contra italics as well.</p>
