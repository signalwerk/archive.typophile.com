    <p>Hello anyone,</p>
    <p>I am new to font and I am studying Graphic Design by DE.<br>
    I enjoy the course, however a fundamental understanding on how fonts/types are created is not covered in the degree program. </p>
    <p>Could someone please direct me to a book that is thorough about font creation? From paper to computer.</p>
    <p>Or if there are short courses in between semesters would be great. I'm based in Sydney, Australia so it would have to be local.</p>
    <p>Appreciate any assistance.</p>
