    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 29.Oct.2007 2.43pm </div>
      <p>Hey Friends!</p>
    <p>Grab your plastic pumpkins, put on your creepiest costume, and head on over to Font Bros where you’ll go Dingbatty for the latest additions to our site!</p>
    <p>Like a sack of candy corn we’re just sweet on dingbats so we decided to add even more of those sweet treats including 10 new dingbats from our friends at Outside the Line fonts! Dig in at: <a href="http://www.fontbros.com/otl.php" title="http://www.fontbros.com/otl.php">http://www.fontbros.com/otl.php</a></p>
    <p>Sweet not good enough? Then rot those teeth out of your skull with the largest collection of Dingbat fonts online! Check ’em out at: <a href="http://www.fontbros.com/dingbats.php" title="http://www.fontbros.com/dingbats.php">http://www.fontbros.com/dingbats.php</a></p>
    <p>Warm Halloween Wishes from the Font Bros!<br>
    Mike &amp; Stuart</p>
