  html: <p>When drawing an "o" in Fontlab, both circles get black / filled with colour. I can't find the command to make the inner circle white </p>
  html_clean: <p>When drawing an "o" in Fontlab, both circles get black / filled with colour. I can't find the command to make the inner circle white </p>
