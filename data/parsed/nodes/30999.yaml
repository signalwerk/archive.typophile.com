      <p>From the dusty bowels of my memory, I seem to recall that it is only a hinting issue and that it may be difficult to hint such curves properly. Once again my warning—the deepest dark corners of Chris’s mind may not recall as acurately as they should :-)</p>
      <p>That being said. I am surprised that FontAudit did not flag the above curve for missing extremma.  If you draw such a curve rotated so that there are no missing extremma points, you have the normal middle section of an “s” situation.  I often use this technique when drawing an s. I may later tweek it a tad by adiing a midpoint for more control but generally get as close as I can without the midpoint.</p>
      <p>ChrisL</p>
