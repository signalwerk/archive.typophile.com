      <p>The website, to me, feels a tad busy and flashy for something that's intended to be of clean, simple and print qualities. The gradient immediately takes me away from any sort of association with printed matter. </p>
      <p>Additionally, all the multicolored text elements (especially the twitter section), pictures, and subheads grab for my attention. Your hierarchy of elements on the page needs to be explored further.</p>
      <p>You're not far off, but you're not quite there yet either.</p>
