    html: |-
      <p>I like the idea of the two "half-names" meeting in the "O" – a whole made up of two halves, very fitting. And it looks yummy. But –and maybe this is just me– conceptually I find the "cracked" "O" a bit disturbing. It can easily read as a perfect whole (that circular "O") being broken/split, and not quite fitting together.</p>
      <p>Have you tried other treatments without the offset in the "O", but with different treatments of the two "halves"? Like, dunno, having "MAS + half an O" black on white, and the other half of the wordmark reversed out of black? Or maybe try using two different fonts (for your different personalities) that would however smoothly "fuse" in the "O"? Like maybe a sans and a slab that share the same proportions.<br>
      That way the "O" could become an image for your common, shared "focus", rather than the fault line between two slightly incompatible parts.</p>
      <p>Just my $.02. I don't think it <em>doesn't</em> work – I just wonder if it's the solution that best communicates what you need it to communicate.</p>
