    <p>Hi all, long time lurker.</p>
    <p>What do you guys think of the logo attached? My old logo was good but I felt it didn't represent me and my brother properly so I've re-designed a completely new one.</p>
    <p>I wanted something simple, to the point and typographic. There are two people involved with the portfolio and the split in the middle O represents this. I've kerned it as best I could but sometimes you just need fresh eyes to make sure every things proper and my brains numb from thinking of ways I could improve it.</p>
    <p><a href="http://masonio.com/temp/masonio.jpg" title="http://masonio.com/temp/masonio.jpg">http://masonio.com/temp/masonio.jpg</a></p>
    <p>Thanks for your help!</p>
