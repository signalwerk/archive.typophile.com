      <p>It's a lot clearer — I like it.</p>
      <p>I see a few things that might benefit from some tweaking:</p>
      <p>-the body text for each of the posts is red . . . all of the text everywhere is red. It might work better if the body text was a grey, or whatever one of your secondary colors is, to set it apart further from the headline.</p>
      <p>-that twitter section is a bit heavy. I don't really want to go over and read through that chunk of text. I would put only the most recent 'tweet' over there and then let people click through to your twitter page if they'd like to read more. Either that, or give each post more white space.</p>
      <p>-Something about the logo has been bothering me, and I think it's because of the drop shadow you have on it. What would it look like without that?</p>
      <p>-<br>
      penn</p>
