    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Carl Stephen Junge</strong></p>
    <p>Carl Stephen Junge, 1880—1972, was a type designer for <a href="/wiki/Barnhart%20Brothers%20and%20Spindler" class="freelinking" rel="nofollow">Barnhart Brothers &amp; Spindler</a> designing Caslon Italic Specials (swash letters) in 1924, and Swagger Capitals, 1925.</p>
