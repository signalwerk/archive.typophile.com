      <p>I think the spacing is not up to Christian Schwartz's standards. The W especially seems overkerned with the O. Looking at the sample of Amplitude Headline, the G here with its vertically sheared terminal looks quite different. Also the leg of R here seems to join the bowl further away from the stem than in Amplitude.</p>
      <p>Mike, did your search include free fonts? The G suggests to me the designer didn't quite know about stroke thinning at the spur.</p>
