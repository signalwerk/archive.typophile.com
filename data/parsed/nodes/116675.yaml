      <p>I personally don't like the UI on Font Explorer, and I do like Suitcase. I find that there's not enough real "management" options with FontBook.</p>
      <p>I tend to activate groups of fonts temporarily, or on a per-project basis, and Suitcase is well-suited to my way of working (it helps that I've used it for many years and it has nearly always worked this way).</p>
      <p>We use Universal Type Server at my current job, and it's basically Suitcase Lite (from the user's POV).</p>
