      <p>When I was preparing to leave Extensis a few weeks ago, I test drove font Explorer for a couple of weeks, to decide if I wanted to switch. I had a brand new laptop to configure.</p>
      <p>I liked Font Explorer's OpenType support, language info, and character map showings. Both it and Suitcase Fusion have plug-ins for current and recent Creative Suite/Cloud apps. Font Explorer supports more antique versions, though.</p>
      <p>In the end, what drove me nuts about Font Explorer was that its “family groupings” were only the style-linked groupings. No more than four members to a family. So a mega-family like Kepler would show up as 40+ families in Font Explorer, but I could show it as just one in Suitcase Fusion.</p>
      <p>So Font Explorer was just too unwieldy for me, based on that. I switched back to Suitcase Fusion. I may occasionally miss some FEX features, but at least I am not going crazy every single day.</p>
