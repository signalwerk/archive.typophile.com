      <p>I have experienced the same frustration with both Suitcase and Font Book. No matter what software you use, it's good to keep in mind that fonts can be very volatile to operating systems, especially in large numbers.</p>
      <p>That being said, you may want to test drive <a class="freelinking external" href="http://www.fontexplorerx.com/" rel="nofollow">Font Explorer</a> by Monotype.</p>
      <p>I've had to stress test and implement font management to a large team of artists in the past, and everywhere that Suitcase came up short, Font Explorer excelled. It seemed to handle large numbers of activated fonts a little better than Suitcase, and they have auto-activation plug-ins for many of the common Adobe products. As well, you really can't beat the depth of the program. It can even show you broken down character maps by language and the kerning pairs of different fonts. I think they just released the PC version about a year or two ago, so it's for either platform now, and it's well supported/updated (by Monotype).</p>
      <p>Best of luck in your search!</p>
