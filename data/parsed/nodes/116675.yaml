      <p>Keep your <strong>Suitcase Fusion</strong> and stay way from Apple's <strong>Font Book</strong> which only has limitations.<br>
      <strong>Font Book</strong> is not professional and the smart sets are terrible and fail to do their task.<br>
      It's a bland software for Microsoft users who type résumés and lessons on Word.<br>
      <strong>Suitcase Fusion</strong> has a powerful search fonction through QuickFind and QuickMatch and other options.<br>
      It's a treat to classify your library with it.</p>
      <blockquote><p>What font management would you recommend?</p></blockquote>
      <p>You have two choices: <strong>Suitcase Fusion</strong> or <strong>Font Explorer</strong>.<br>
      I use <strong>Suitcase Fusion</strong> from the first version and I'm satisfied with its version 5.<br>
      I used to move from <strong>Adobe ATM de Luxe</strong> to <strong>Suitcase Fusion</strong>.<br>
      <strong>Font Explorer</strong> has some 'terrific' OpenType features preview including ligatures (common, rare) activation, letterspacing, kerning, tracking. I wish they could include them on <strong>Suitcase Fusion</strong>.</p>
