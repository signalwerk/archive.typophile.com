    <p>I have been very frustrated with Suitcase (Fusion 5) for years and was wondering what people think about the latest version of Font Book from Apple.</p>
    <p>Just curious if anyone who is serious about type actually uses Font Book? Does the new auto-activation work as well as Suitcase? What font management would you recommend?</p>
    <p>Thanks!</p>
