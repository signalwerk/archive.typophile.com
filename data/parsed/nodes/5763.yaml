  html: <p>Hi everyone <br> <br>here i am posting a stencil type developed in a 2 day workshop with the guys of Büro Destruct in santiagop Chile. We went to a photo tour to "LA VEGA", a place were you can find any kind of fruit and vegetables, and also a lot of handmade and stencil fonts. <br> <br>after like 2 hours walking through LA VEGA i realize that a stencil type was painted in a lot of wood boxes. <br>here i send you the type and its inspiration. <br> <br><img src="http://www.typophile.com/forums/messages/29/41388.gif" alt="EL CHINO"></p>
