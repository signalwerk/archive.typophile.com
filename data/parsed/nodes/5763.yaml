    html: "<p>I think thats one rad stencil type.. <img src=\"http://www.typophile.com/forums/clipart/bigsmile.gif\" border=\"0\"> <i>Likeworthy..</i> <br> <br>What I especially love about it, is that its a 'soft' stencil.. <i>( It got a very nice organic, mellow, smooth and rounded look and feel to it.. )</i> <br> <br>There is only one, single, character that 'bothers' me, or that I dont think matches the other ones, that well.: The 'W'.. <i>( The middle part of the 'W' seems too bold, too dark.. ) <br> <br>I also seem to notice the ( heavy ) influence of Büro Destruct, as well, but maybe thats just me, and maybe thats a good thing, too.. <img src=\"http://www.typophile.com/forums/clipart/plain.gif\" border=\"0\"> <br> <br>Like John already stated, thats a whole lot of lovely found type photos, maybe you should submit them to the '<a href=\"http://typophile.com/gallery/foundtype/\" target=\"_blank\">Found Type Gallery</a>' at Typophile.?</i></p>"
    html_clean: "<p>I think thats one rad stencil type.. <img src=\"http://www.typophile.com/forums/clipart/bigsmile.gif\" border=\"0\"> <i>Likeworthy..</i> <br> <br>What I especially love about it, is that its a 'soft' stencil.. <i>( It got a very nice organic, mellow, smooth and rounded look and feel to it.. )</i> <br> <br>There is only one, single, character that 'bothers' me, or that I dont think matches the other ones, that well.: The 'W'.. <i>( The middle part of the 'W' seems too bold, too dark.. ) <br> <br>I also seem to notice the ( heavy ) influence of Büro Destruct, as well, but maybe thats just me, and maybe thats a good thing, too.. <img src=\"http://www.typophile.com/forums/clipart/plain.gif\" border=\"0\"> <br> <br>Like John already stated, thats a whole lot of lovely found type photos, maybe you should submit them to the '<a href=\"http://typophile.com/gallery/foundtype/\" target=\"_blank\" class=\"link-lost\">Found Type Gallery</a>' at Typophile.?</i></p>"
