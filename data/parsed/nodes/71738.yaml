  html: |-
    <p>Can someone please help me identify this font? It looks a lot like Aaux, but there are some slight but significant differences. The lowercase g has a different descender, and the logo font is a little more condensed. It also looks a little like Option Sans, but that's not quite right either.</p>
    <p>Thanks!</p>
