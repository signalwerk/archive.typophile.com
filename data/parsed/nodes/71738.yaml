    html: <p>Conduit and Informatic, while not being spot-on, would certainly provide good starting points for recreating the ‘g’. Maybe the letter has been drawn from scratch, although I doubt it. The ‘r’ perfectly overlays with the shapes of FF DIN. They rather changed the ‘c’, in which the counter appears to be slightly more closed, and the ‘i’, which has a lowered tittle.</p>
