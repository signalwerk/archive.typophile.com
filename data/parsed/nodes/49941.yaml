  html: |-
    <p>Hi.</p>
    <p>This is a logotype using the jos' Fontin Sans, for the Ancient Music Association of Nancy (Association de Musique Ancienne de Nancy) or "A.M.A.N". I've played with the "A" and the "M" of "Ancient" and "Music" to create a kind of old monogram with the Caslon, which is contrasted by the contemporary face of the Fontin Sans.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/aman01_5321.jpg"></div><p></p>
