    html: |-
      <p>Thanks for the feedback guys, much appreciated. Yeah after talking with the client, I think we both agree that sentence case is the way to go. The last one is "YELLING",  and counteracting the friendliness of the mark.</p>
      <p> I also feel like besides loosening up the type on the first version, there is still a balance issue on the stack...the relationship between the mark and the type doesn't feel "in the pocket" so to speak.  Does anyone have any ideas on why this may be? (weight, size, leading, etc) </p>
      <p>I've tried a lot of faces and the one chosen has the right mix of square/ humanist feel to me (a lot of square sans feel really harsh). Not sure how Pentagram can set Univers, making it look so classic (in the grant thorton example) - when I set it with my mark, it seems to look dated. (Ha)  </p>
      <p>Any other insight in pushing this to the next level is really appreciated. Thanks guys for taking the time :)</p>
