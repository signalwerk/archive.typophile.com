      <p>hi Hola,<br>
      Thanks for the feedback, appreciated. The client is an interactive designer, and art directed the mark - he wanted movement &amp; overlapping geometric shapes interacting. The "feeling evoked" was the most important aspect for him; in the same way the nike swoosh evokes motion but is not a conceptual mark.  The mark reproduction is vital and I understand that, but for his business the primary application is digital and 4 color reproduction...I'm not sure this is much more difficult to reproduce than this identity by Pentagram. Thoughts?</p><div class="imageWrap"><img src="http://typophile.com/files/grant_thornton_logo_6384.jpg"></div><p></p>
