      <p>digital reproduction is toss up or at least has been in the past. with the quality of new monitors &amp; smartphones screens i think you'll be alright. 4 color vs 1 or 2 pms colors reproduction is always going to be a challenge. variable such as ink/paper/printers will challenge the consistency of color for sure. But that happens with everything.</p>
