    <p>Hey everyone,</p>
    <p>This is my first post here &amp; I know I will get some good honest feedbacks.<br>
    This a logo for a technical exhibit that happens in my company once every year. Basically the logo is for the theme this year — iNewvation.</p>
    <p>The idea is to show that new ideas coupled with active efforts lead to innovation.<br>
    The logo is not something very hot .. basically trying to show “out of the box thinking” &amp; through some movement in the logo the act of breaking out of the box! </p>
    <p>I have some serious doubts about the kerning and the general feel of the logo though as I cant say I am very adept at that and it is my first attempt at something like this. Would love to hear your comments on this and improve it as much as I can ...</p>
    <p>Thank you all for the feedbacks already :)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TechfairLogo_3691.v1.jpg"></div><p></p>
