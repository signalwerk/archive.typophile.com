      <p>I'm not a huge fan of the super-smart wordplay either, but the logo concept is pretty cool. I'd lose the box though – too many stories in one logo.</p>
      <p>I'm not quite sold on the angles of the springy curve on top of the "A". The "incoming" angle is much flatter (and also looks like it's receding into the distance), so the sudden steepness of the "outgoing" curve seems unmotivated.<br>
      But maybe that's just me.</p>
      <p>In any case, it seems that the kerning could use some more love, especially around "VAT"; and you should really finalize that before doing much more work on the boingy line on top.</p>
      <p>Also, type-related:<br>
      - I agree that it looks too much like the "W" and "V" are really one letter. I'd try moving the "V" away, and also making the "W" a little narrower, so that it doesn't look like it's made of two "V"s.<br>
      - Have you tried making the middle apex of the "W" (and the joins of the "N") pointy as well, like the bottoms of "V"/"W"? Might give it more sharpness.<br>
      - Any reason for the "A"s lack of a crossbar? FWIW I don't think that's particularly fresh ("innovative") anymore (not that it needs to be bad – just asking).<br>
      - The tittle on the "I" needs to be a bit larger. And it's shifted left relative to the boingy curve.</p>
