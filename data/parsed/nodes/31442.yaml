    html: <p>They are very nice forms. To be fonts it would depends on the number of points - they would have to be truetype and in the past some complex fonts have used more than one glyph window for one character. I digitized some ornate Victorian typefaces a few years ago and had problems with them not printing or having bizarre lines develope. Your forms look to me like they will have to remain vector art - just too complex.</p>
