    <p>Hello Typophiles,</p>
    <p>Last night while experimenting with type, I came up with this idea of having a 3d wire frame typeface. Although its very graphic but can be used for some specific purpose, like in posters and the magazine headings. But the problem is that each glyph is becoming too heavy and dunno whether it will be possible to export them as a typeface or not. I have all the drawings in the vector format. What do you guys think_? Is it possible anyhow_? Anyone_??</p>
    <p>Thanks!<br>
    Satya_</p>
