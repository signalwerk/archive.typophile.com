      <p>I ain't worryin'. And yes I think you're ryte as usual, script lettering is a personal expressiveness type of thing. In effect I'm scaling the edge of readerability / readability while firing a shot into the trademark maelstrom to see what happens there.</p>
      <p>I always do research before deciding on a retail font's name, to find out how widespread prior use (if any exists) of the name has been in the public domain. A google search of "fonta" turns up soome fascinating prior uses of it as a trademark, none of them registered. So the Coke peeple, if they ever bother hassling me about this) will have to admit widespread prior use of the letter string "fonta" by numerous companies and private individuals, whose use of "fonta" as a business name / brand has not diluted Coke's registered Fanta trademark. If Coke go for similar wordmark conflict, well, we'll see about that. Their claim would have to include an argument for dilution of the Fanta wordmark, and that could take a long time to hammer out out-of-court. Meantime I get a free ride with my Fonta mark acting as the pivot for the Jabberwub branding communications scheme.</p>
      <p>For readers interested in prior use of "Fonta", here are some relevant links:</p>
      <p>Google: "fonta"<br><a href="http://www.google.com/search?hl=en&amp;q=fonta&amp;btnG=Google+Search&amp;meta=">http://www.google.com/search?hl=en&amp;q=fonta&amp;btnG=Google+Search&amp;meta=</a><br>
      bout 1,420,000 for fonta</p>
      <p>Fonta.org is the creation of an individual named Andrea Fontanesi<br><a href="http://www.fonta.org/Welcome.html">http://www.fonta.org/Welcome.html</a></p>
      <p><a href="http://www.fonta.com/">http://www.fonta.com/</a><br>
      Thank you for your interest in fonta.com.<br>
      This domain is for sale. Please visit the fonta.com auction page at Sedo.</p>
      <p><a href="http://www.robtex.com/dns/fonta.com.html">http://www.robtex.com/dns/fonta.com.html</a><br>
      fonta.com is a domain controlled by two nameservers. They are on different IP networks.</p>
      <p><a href="http://www.fonta-motor.com/">http://www.fonta-motor.com/</a><br>
      GUANGZHOU FONKWANG INDUSTRIAL CO., LTD, is specialized in production and sales of FONTA and FKMEO brand motorcycles.</p>
      <p><a href="http://fibresystems.org/cws/company/B400014626">http://fibresystems.org/cws/company/B400014626</a><br>
      Fonta Industries CO.,LTD is a professional company of fiber-optic components in HongKong, China.</p>
      <p><a href="http://www.who.is/whois-com/ip-address/fonta.com/">http://www.who.is/whois-com/ip-address/fonta.com/</a></p>
      <p>Heh! I love that "Fonkwang Industrial" tag. Apparently "Fonkwang" in Japanese translates to "Fonta" in queen's English. What a world :^)</p>
      <p>j a m e s</p>
