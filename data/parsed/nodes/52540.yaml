    <p>Hello!</p>
    <p>Now and then the odd type designer makes a truly spontaneous display type graphic designers find inspiring &amp; irresistable.</p>
    <p>Introducing -----<a href="http://www.myfonts.com/fonts/sentinel/jabberwub/">Sentinel Jabberwub</a>-----</p>
    <p><img src="/sites/default/files/old-images/jabberwub_fonta_poster_6525.gif"></p>
    <p>============begin news release==============</p>
    <p>A fresh new decorative display face bubbling with life &amp; spontaneity, Jabberwub belongs to a rare genus of creature fonts that type forgot—casual animated. A fun &amp; bouncy eye-catcher dancing a whacky line between discord &amp; rhyme, Jabberwub packs tons of fun into a state-of-the-art OpenType font loaded with 270 extra glyphs, including stylistic alternates, discretionary ligatures, word ligatures and capitalized ligatures, allowing creative typographers to achieve a custom hand-lettered look without all the mess &amp; spilt glue of a manual paste-up job.</p>
    <p>Jabberwub is ideal for whatever zany stuff springs to mind. It takes an outline with no problem-o, and you can squish &amp; squoosh it as the occasion takes your fancy. Optimal results are achieved by hand setting each individual glyph. Available in OpenType only.</p>
    <p>Jabberwub can be viewed and test driven now at Myfonts:<br><a href="http://www.myfonts.com/fonts/sentinel/jabberwub/">http://www.myfonts.com/fonts/sentinel/jabberwub/</a></p>
    <p>==============end news release==============</p>
    <p>j a m e s</p>
