  html: "<p>Hello, <br> <br>here are a few <b>technical terms</b> I am coming across which, although I have a vague idea what most of them mean, it would be nice to get some definitive meanings for: <br> <br>Glyph <br>Sidebearing <br>Advance Width <br>Black (width) <br>Outlines (as opposed to glyphs) <br>Bowl <br>Counter <br> <br>I think that'll do for now. Can anyone help?</p>"
