    html: |-
      <p>I don't know if it's based on a font, more probably a custom logo work. It looks too much modified/customized to me. The only letter that could be original is probably /A. You just need to spot a good Egyptian/geometric slab serif (<a href="http://www.myfonts.com/fonts/insigne/sommet-slab" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Sommet Slab</a>... and play with it. My choice would probably be to start with a Sans and add slab serifs, something from <a href="http://www.myfonts.com/foundry/Type-Together" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Type-Together</a> such as <a href="http://www.myfonts.com/fonts/type-together/soleil" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Soleil</a>, <a href="http://www.myfonts.com/fonts/type-together/karmina-sans" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Karmina Sans</a> or <a href="http://www.myfonts.com/fonts/type-together/etica" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Etica</a>.<br>
      For the rest, as "Worldline" baseline is set in <a href="http://vllg.com/Schwartzco/Stag" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Stag</a>, you could even start with this one.</p>
