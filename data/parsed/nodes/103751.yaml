    html: |-
      <p>I don't know if it's based on a font, more probably a custom logo work. It looks too much modified/customized to me. The only letter that could be original is probably /A. You just need to spot a good Egyptian/geometric slab serif (<a class="freelinking external" href="http://www.myfonts.com/fonts/insigne/sommet-slab" rel="nofollow">Sommet Slab</a>... and play with it. My choice would probably be to start with a Sans and add slab serifs, something from <a class="freelinking external" href="http://www.myfonts.com/foundry/Type-Together" rel="nofollow">Type-Together</a> such as <a class="freelinking external" href="http://www.myfonts.com/fonts/type-together/soleil" rel="nofollow">Soleil</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/type-together/karmina-sans" rel="nofollow">Karmina Sans</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/type-together/etica" rel="nofollow">Etica</a>.<br>
      For the rest, as "Worldline" baseline is set in <a class="freelinking external" href="http://vllg.com/Schwartzco/Stag" rel="nofollow">Stag</a>, you could even start with this one.</p>
