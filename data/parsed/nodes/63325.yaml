      <p>"Copy" and "format" are both nouns, therefore make sense even to those who don't get the jargon. "Remove" isn't a noun. I know you're saying that it's IT jargon (and I did know that) but the whole reason for creating a logo and a name is to reach the most number of clients. Using jargon isn't a good way to do that.</p>
      <p>I used to work in a university library managing a three-floor computer lab. I can only imagine the nightmare meeting I'd have trying to convince the board of directors that we needed to buy a product from "Intelligent Remove" aka "iTR." </p>
      <p>I stand by my opinion that the bad English in the name immediately reduces trust in the brand. Not all the people writing checks understand IT jargon.</p>
