      <p>"Quick format" with "format" being noun does not make any technical sense, I assume you know that. I don't think that twisting the name into correct English only to loose all technical sense is a good idea. If I am looking at three IT products - "Intelligent Removal", "Intelligently Remove" or "Intelligent Remove" - and I am choosing strictly based on name, third is the only choice. I am saying this as a professional software developer and former sysadmin, which is as IT as it gets. It <em>is</em> an OK brand as it is along the lines of what an average IT person expects from the product name.</p>
      <p>Having said that I agree that overall this is not a great name for the product, and it can be improved. But not because it is not grammatically correct, but because it is based on a jargon.</p>
