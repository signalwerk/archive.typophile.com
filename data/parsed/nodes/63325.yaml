    html: |-
      <p>On purely aesthetic grounds, I agree with the nudging proposal mentioned above<br>
       ( more than just visually centering the mark inside the containing box, it may be good to allow the eye to 'fill in' the left part of that 'T' ). </p>
      <p>You may also want to align the top of the line of type to the top of 'ITR' ( and probably do the same with the bottom, by moving the second line up, so that the bottom is again aligned ). Then perhaps leave as much 'apparent' negative space between the left edge of the type and the right edge of the containing box as there is space between the right edge of the ITR mark and that same right edge of the box. </p>
      <p>All of this should tighten things up nicely enough, and, along with making the second 'i' in 'intelligent' uppercase, produce an acceptable proposal. But I would then propose you then put this design aside as a backup option and start fresh. Not to disparage your solution - but hey, it was<em> your</em> gut that's been bugging you about this logo : ) </p>
      <p>A company name that includes the words 'intelligent' and 'remove' is too exciting a challenge to address by using illustrator's pre-made rounded rectangle, for one. I do like the idea of using negative space to suggest removal, but the idea needs to sell itself and not have any confusing T's in it. ( BTW, if your client is insisting to acronym the company ITR, tell them I said they're idiots. ) </p>
      <p>But I digress—Try looking at the iconography of removed or absent content ( in websites, corrupted software - or even the physical world ) Speaking of, perhaps incorporating the iconography of security or safeguarding is another avenue. Don't want to say more here.. Good luck, and don't give up. Hope this was helpful and/or timely..</p>
