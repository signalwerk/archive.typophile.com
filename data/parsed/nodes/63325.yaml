      <p>The name itself makes little sense. It sounds as if it was translated poorly. 'Remove' is a verb, and it can't be modified by an adjective (intelligent.) The parts of speech just don't fit; and this flagrant ignorance instantly reduces trust in the brand. </p>
      <p>To make sense in English, it needs to be "Intelligently Remove" (adverb, verb) or "Intelligent Removal" (adjective, noun.)</p>
      <p>If this was my client, this would be the first conversation I'd have with them before any logo development. Chances are, this company will eventually be forced to undergo a name change; better sooner than later.</p>
      <p>Oh, and I'm sure they'll have "reasons" for twisting English, but no reason is a valid argument for choosing to introduce oneself so poorly.</p>
