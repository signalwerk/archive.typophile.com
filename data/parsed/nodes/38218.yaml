  html: |-
    <p>I want to check an assumption - when you make an Ohorn ( U+01A1, U+01A0 ) it is necessary that the ’horn’ be joined with the O shape so that the O shape in the Ohorn cannot be a component. </p>
    <p>(Although the Ohorn shape can be a component of other Unicode glyphs.)</p>
    <p>Is this correct?</p>
    <p>Put another way though - I might ask. Will a composed overlapping shape create an unwanted white space the way that a temporary ( unconnected but overlapping) leg on an upper case R does?</p>
    <p>Thanks!</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/38187" class="topic-previous" title="Go to previous forum topic">‹ Dumb question</a> <a href="/node/38182" class="topic-next" title="Go to next forum topic">{ What does this error mean? } ›</a></div>
