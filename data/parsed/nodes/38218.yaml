    html: |-
      <p><em>...if somebody ever does an outline or stroke effect on the text. You really don’t want overlapping paths in that case.</em></p>
      <p>That’s why I weld (remove overlap) cedillas and ogoneks onto accented characters. Shipping a font with diacritics in component form only saves a few kilobytes in font file size and adds nothing to the quality of the product.</p>
      <p>Most fonts I’ve produced so far are display types, or semi-display-demi-text, and designers will inevitably render them in outline form. As long as your horn glyph, cedilla glyph and ogonek glyph exist stand-alone in their own cells with legit unidoce index numbers assigned, they can be components of diacritic characters combined on-the-fly by applications—-but you knew that already.</p>
      <p><em>Will a composed overlapping shape create an unwanted white space the way that a temporary ( unconnected but overlapping) leg on an upper case R does?</em></p>
      <p>The whitespace is generated in OT fonts with Type 1 outlines, but for some reason not in TT fonts with TT outlines.</p>
      <p>j a m e s</p>
