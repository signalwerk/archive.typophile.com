    html: |-
      <p>sushi whisker,</p>
      <p>After drawing the shape add the gradient mesh. Then you cold start by coloring all the edges with one colour, then add/change colours as needed. You also might need to add occasional mesh point. That quick one was done with 4 x 4 mesh and just three colours from the default pallette. I moved the points around a bit, too.</p>
      <p>Transparency of the elements is 70%.</p>
      <p>The middle bit has 9 mm feather in the edges and a basic radial gradient. It's also transparent (70%) and on top of everything.</p>
      <p>Hope this helps, good luck!</p><div class="imageWrap"><img src="http://typophile.com/files/mesh.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/radial.jpg"></div><p></p>
