      <p>I sketched out the basic idea for Proxima Sans (particularly the lowercase) around 1981. (I called it Zanzibar at the time, just because I liked the word. The name Proxima Sans came later.) In 1991, I was art director of a magazine were I was using Gill Sans. I liked it, but wanted something a bit plainer and more geometric. Taking this basic concept and the earlier ideas I had explored with Zanzibar, I began working on what would ultimately become Proxima Sans (1994). </p>
      <p>Many existing faces influenced the look of Proxima Sans. I wanted something with the general proportions and stroke contrast of Helvetica or Akzidenz Grotesk, but with construction principles and details borrowed variously from Futura, Kabel, the American gothics (Copperplate Gothic, News Gothic, Franklin Gothic, etc.) and the U.S. Federal Highway signage typeface (the same one that inspired Font Bureau's Interstate). The result was a hybrid; a face combining humanist proportions with a somewhat geometric appearance.</p>
      <p>The similarities between Proxima Sans and Gotham I attribute to zeitgeist. Avenir, which is even older, is also somewhat similar, except that its proportions are more like Futura. Given that Adrian Frutiger's aim was to redesign Futura, this is only natural.</p>
