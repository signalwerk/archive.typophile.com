      <p><em>"Akzidenz Grotesk and Franklin Gothic”<br>
      Maybe I didn’t understand Robert Bringhurst - “The Elements of Typographic Style” — page 132.</em></p>
      <p>I'm not sure what he means by "immediate ancestor." That makes it sound like one is based on the other, but I find it difficult to believe that was the case, and I've never heard of any such connection before. Maybe he meant it in the sense that they were released only a few years apart.</p>
      <p>Mac McGrew in "American Metal Typefaces of the Twentieth Century" describes Franklin Gothic as one of the first examples of Morris Fuller Benton's consolidation of various gothics from the foundries which were brought together into ATF. No mention of Akzidenz Grotesk.</p>
