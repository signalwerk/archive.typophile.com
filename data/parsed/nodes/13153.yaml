      <p><cite>Akzidenz means something like “standard” or “commercial.” (In fact, when Akzidenz Grotesk was imported to the U.S. in the 1950s, it was renamed “Standard.” That’s the name I first knew it as.)</cite></p>
      <p>this is incorrect. among german speaking printers akzidenz meant a print-job of small scale: folders, buisness cards, forms etc.. anything that isn't book, newspaper or magazine printing.<br>
      akzidenzien (plural) also meant headlines, it was used synonimous to display (engl.) - and from that root the font akzidenz grotesk was named. translated it would be something like display sans.</p>
