      <p>Quoting <a href="http://www.typography.com/catalog/gotham/features.html">H&amp;FJ</a>:</p>
      <blockquote><p>"Long before the emergence of a profession called "graphic design," there was signage. Up until the mid-twentieth century, the job of providing architectural lettering often fell to engineers or draftsmen, most of whom worked outside of the typographic tradition. The shape of facade lettering was often determined by the practical business of legibility, rather than any sort of stylistic agenda — although inevitably, even the draftsman's vision of "basic building lettering" was influenced by the prevailing style of the time."</p></blockquote>
      <p>I believe this type of lettering was also the inspiration for Simonson's <a href="http://www.ms-studio.com/FontSales/proximasans.html">Proxima Sans</a>, which is about to get the italic, condensed, OpenType <a href="http://marksimonson.com/article/118/proxima-sans-going-nova">treatment</a>.</p>
    html_clean: |-
