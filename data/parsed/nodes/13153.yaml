      <p>I have a soft spot for Helvetica; it was one of the first fonts I admired when I started really looking at fonts as a teenager. I moved on and became more interested in other fonts. I still like it okay, but it's been over-used.</p>
      <p>I don't think there is a direct connection between Akzidenz Grotesk and Franklin Gothic. Franklin Gothic came out of the American "gothic" tradition--mainly wood types. Akzidenz Grotesk has German roots. They were roughly contemporaneous. Similar stuff was being done in England at the time. Bureau Grotesque is out of that tradition. No doubt there was some cross-pollenation, but it wasn't like it is today.</p>
      <p>Akzidenz means something like "standard" or "commercial." (In fact, when Akzidenz Grotesk was imported to the U.S. in the 1950s, it was renamed "Standard." That's the name I first knew it as.)</p>
