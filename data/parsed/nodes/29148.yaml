    html: |-
      <p>The process is called tracking, the alignment is known as forced justified, it works okay(ish) in the first three lines but by the fourth there are too few characters and the tracking has left it with way too much space. If I <em>had</em> to do this I would look at taking the comma out of the measure so that RTY all aligned and slightly indenting the F to create a better vertical on the left and close up the bottom line and centre it under the others. For a clear reason to avoid it, compare the spaces in the first two lines. Unless you really want to upset your tutors I would avoid doing this altogether.<br>
      Tim</p>
