  html: <p>myriad? the letterspacing seems really easy on the eye. can anyone please explain what has been done to it, i know that it has had some tweaking but what kind? its not wholly justified is it? alligned i guess, but what kind.  i’m a student and at the beginning of the typographic learning process so please be patient.</p><div class="imageWrap"><img src="files/logo_6709.png"></div><p></p>
