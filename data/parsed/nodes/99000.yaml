    <p>I'm looking for the fonts used in this card, (especially the ampersand "&amp;" and the word "The".</p>
    <p>I want to make a wedding invitation as well, with a similar feel.<br>
    It 's a little retro, but not tooo much. It's romantic but not tacky and minimalist but not too artsy. </p>
    <p>So I really like this, though I do not want to copy it... I just like the way it feels,<br>
    The names of the fonts would be great.. but if you have any idea's on how I could obtain a similar look, that would be great ! </p>
    <p>Thanks a bunch !</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hd_4514b112cfb09cec5e2b85db99021452_4625.jpg"></div><p></p>
