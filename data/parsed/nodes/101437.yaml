    <p>Sorry if this topic has been discussed to death before.</p>
    <p>Typophile.com has a Type ID Board, which, I suppose, was designed to be the place to post Type ID Questions. Spam aside, that's largely what goes on there. There's also a General Discussion Forum and a Design Forum, where Type ID Questions appear rather frequently too. You can't blame the posters for that: the former Forum says 'Anything goes', and the latter deals with 'A to Z, and everything in between'. Still, to some – at least to me – Type ID Questions feel misplaced outside the Type ID Board.</p>
    <p>So how about moving the Type ID Board to the topmost place in the Forum Menu? That might be just the way – and an easy way too, I'd figure – to have most Type ID Questions ending up in the Forum they really belong.</p>
    <p>Best,<br>
    Bart</p>
