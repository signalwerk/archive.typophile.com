      <p>@John: Do you think people deliberately post their ID questions in another forum than the ID Board? That doesn't sound likely to me. If you have an ID question and you see there's a dedicated ID board, why not go there?<br>
      I can think of two probable reasons why ID questions end up in other forums: either the title Type ID Board is confusing, or the ID-forum is being overlooked altogether. Moving the ID Board to the top position of the forum menu would be an attempt to fix the latter problem. Renaming the ID Board, like others proposed, might solve the former.<br>
      Why not try both? Seems we already have some supporters of that idea.</p>
      <p>@Hrant:<br>
      </p><blockquote> Ax (or offload) the ID section. End of problem. </blockquote><p></p>
      <p>Are we addressing the same issue? I started this thread because it bothers me to find so many ID requests outside the ID Board (not only in the General Discussion Forum or the Design Forum, but also in the Critique Section). How would 'axing' the ID Section solve that problem?<br>
