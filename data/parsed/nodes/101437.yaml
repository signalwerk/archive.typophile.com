    html: |-
      <p>Making the ID section more prominent would make the whole of Typophile look more like a type ID service, harming non-ID activity.</p>
      <blockquote><p>it bothers me to find so many ID requests outside the ID Board</p></blockquote>
      <p>To me -and many others- occasional misplaced ID requests are a lesser problem than having too many ID requests (in the right place). One big reason is there's no easy mechanism for a user to shun the ID section.</p>
      <p>Typophile should not harm itself to be useful to people who would never consider being useful to Typophile. In fact it's worse than not being useful in return: IDing too often comes from and leads to piracy and the promotion of plagiarism. Even if we're wise enough not to crusade against those, it harms Typophile's image -hence future value to type design- to play along.</p>
      <p>To be fair, in the past few weeks things have gotten much better in the ID section, in terms of ethics. But it remains that the drawbacks of having an ID section outweigh the benefits, in my opinion. Based on my observations I have to conclude that the experiment (getting casual users to truly appreciate type via the ID "gateway") might have been worth a shot, but sadly it failed.</p>
      <p>Tourists aren't evil, but -due to the nature of most tourism- too many can very much ruin a city. I remember when I went to Moscow and Novosibirsk a few years ago: the latter is where I felt like I was in Russia.</p>
      <p>hhp</p>
