      <p>There are other worrisome signs, for example that very few people who frequent the ID section spend any time at all anywhere else on Typophile, and that many people who ask for IDs never look at anything else even in the ID section, much less try to help anybody else ID a font; sometimes they don't even check back on how their own threads are developing -for example if somebody points out a case of plagiarism- once they have the ID. This is nothing short of parasitic.</p>
      <p>Typophile's image has long been hurt by font IDs, and the belief that IDs are a way to introduce new people to the world of type is simply not borne out by what's happening on the ground. Overall I believe the ID section harms type design.</p>
