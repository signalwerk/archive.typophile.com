      <p>After all, people would still figure that only a few kind souls would bother to look at font ID requests, while posting in general discussion gives them a chance of getting everyone's attention.</p>
      <p>Now, if you could make it appear that this was <em>just</em> a type ID board, and hide the other discussion boards inside the type ID board in such a way that only people knowlegeable about type could find them... but, of course, that's not possible without seriously compromising the function of this discussion forum.</p>
