      <p>Unfortunately that's common at many forums.</p>
      <p>I used to help moderate another group and what drove me crazy was when people said "I don't have time to check back for replies, please email them to [address]". I'd delete the address and tell them that if they couldn't bother to check back then don't post questions.</p>
      <p>I think etiquette in general is in decline. I remember many years ago when one of my professors invited a well-known designer from New York to speak. That guy was a class act. Flew in from New York, arrived on time, suit and tie, a well-organized presentation that was obviously customized especially for us, friendly and polite to everyone, and the next day he FedEx'd a handwritten thank you letter to the professor. Unfortunately I can't recall the guy's name, but to this day I remember his style and manners.</p>
