    html: |-
      <p>To me the ID section is a necessary evil (at least on a relatively laissez-faire forum such as this) because otherwise <em>all</em> ID requests would end up in General Discussion... So putting it at the top seems to make sense. However from watching the ID section intently for the past few weeks I can attest that: it's so busy that it makes the rest of Typophile look secondary; there are often quite shady font recommendations, which we are not even allowed to confront...</p>
      <p>So I ask, what's worse: being mildly annoyed at seeing a misplaced ID request (and the ensuing awkward silence) which however a moderator -or other kind soul- can certainly help out with; or having IDs -and especially shady answers to them- take over Typophile (even more)?</p>
      <p>Here's my own "solution chain": if we can enforce a ban on ID requests across the board, let's do it. If we can't or don't want to: enforce higher ethical standards in the ID section* and/or annex it so that: people who have a high regard for type designer rights don't have to watch; and people looking don't think Typophile is for bottom-feeders.</p>
      <p>* Or at least allow people to have ethical discussions there.</p>
      <p>To be fair, most people who use the ID section do have proper respect for type design. But those who don't sadly have free rein of the place.</p>
      <p>hhp</p>
