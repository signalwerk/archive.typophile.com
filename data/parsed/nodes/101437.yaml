      <p>From Clive Thompson's 2009 <a href="http://www.wired.com/techbiz/people/magazine/17-04/st_thompson" rel="nofollow">Wired article on "Trolling"</a><a rel="nofollow">:</a></p>
      <blockquote><p>The world's top discussion moderators have developed successful tools for keeping online miscreants from disrupting conversation. All are rooted in one psychological insight: If you simply ban trolls—kicking them off your board—you nurture their curdled sense of being an oppressed truth-speaker. Instead, the moderators rely on making the comments less prominent.</p>
      <p>Patient Zero here is Slashdot, the tech site that pioneered one elegant way to police trolls: crowdsourcing. Slashdot has an automated system that randomly picks a handful of readers and gives them, for a day or so, the power to describe others' comments with terms like "funny" or "off topic." Those descriptions are translated into a score from -1 to 5. Readers can set their filters so they see only comments with high ratings—and trollery effectively vanishes.</p></blockquote>
      <p>Would such a system technically be possible on Typophile?<br>
      The article specifically discusses 'trolling'; for convenience I'm including 'Use The Type ID Forum!' in that as well.</p>
