      <p>@bartd:<br>
      <cite>If you have an ID question and you see there's a dedicated ID board, why not go there?</cite></p>
      <p>Well, the "why not" consists of a couple of reasonable assumptions.</p>
      <p>One is that people only visit the ID board if they're actively interested in helping others with type ID questions, since to do so requires an effort.</p>
      <p>The other is that many people who could help ID the font in question don't have this active interest, but might passively respond to an ID question placed before them if they knew the answer.</p>
      <p>If type ID questions could be charged for, like advertising, then at least putting type IDs in our face would help support the forum.</p>
