    html: <p> &gt; The hand delivers a fluidity that the eye didn't ask for. <br> <br>(Now I know what verse to put on Hrant's birthday card. :D ) <br> <br>This is really an intriguing face -- one of the most interesting experiemnts I've seen in a long time, and certainly one of the most successful at pushing the envelope of glyph shapes. <br> <br>You could almost call the "W" a "doubledoubleyou". <br> <br>I can't wait to see the full character set. Nice work. <br> <br>David </p>
