    html: <p> What's interesting is how naturally these  <br>letters come together in recognizalbe  <br>ways--even though they are contrary to the way  <br>we draw letters. You can imagine some  <br>otherworldly system where these work  <br>perfectly naturally. <br> <br>Take the K. It's the wrong way to draw a K.  <br>However, you've devised a system with the  <br>other letters that makes that K a very likely  <br>possibility. Contrast this with your "Kotica"  <br>which takes our common method of drawing a  <br>B, for example, and forces it into some  <br>geometry where it feels forced. <br> <br>Am I the only one who thinks this? <br> <br>Good luck with it. </p>
