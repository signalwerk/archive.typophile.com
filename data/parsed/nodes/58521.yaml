      <p>You have to redefine "even color" for yourself. Even color has to take into account the script and language to the extent that you are only lessening jarring to the reader without creating a homogenous blend of sameness. Think of even color as a movement in a symphony--it has life and speaks to you with variety and dynamics. Excessive even color is more like Muzak--the mayonnaise of elevator music that barely distinguishes a melody.</p>
      <p>ChrisL</p>
