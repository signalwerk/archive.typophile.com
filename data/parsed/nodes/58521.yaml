      <p>Aw. The 3D thing probably isn't good.</p>
      <p>To give another reason for why I'd like to prevent those crashes:<br>
      In German typesetting, as is commonly discussed with regard to f-ligatures, connecting ligatures are forbidden across more than one part of a compounded word. Thus, say in the word <em>aufleben</em> (to revive) –which is composed of the prefix <em>auf</em> and the verb <em>leben</em> (to live)–, since it's <em>verboten</em> to set that with an "fl" ligature, but the crash looks bad too, most typesetters will then track that "fl" combination out until nothing's touching anymore, which then (depending on the font) tends to cause large white holes.<br>
      And those CALTs up there could help with similar situations involving "r"-induced crashes, keeping eager mouse cursors away from InDesign's kerning/tracking palette. If people find the CALT feature, that is.</p>
      <p>I like your "lateral" idea too though, Craig.</p>
      <p>Chris: nice! I don't assume Eben's presentation is documented anywhere? Wish I could see that.</p>
