    user: 1551
    date: 2009-06-09T06:32:00
    date_raw: 9 Jun 2009 — 6:32am
    votes: null
    html: |-
      <p>&gt;I’m still very much learning to see</p>
      <p>I'm a few years more at this than you, but only a few, and I completely understand your frustrations, as I have had the same feelings for a long time. </p>
      <p>But I've come to the conclusion that the problem is not me, it's the alphabet :)</p>
      <p>By that I mean, there are some letters who design just does not permit the same kind of evenness of color across the word as the other letters. Almost all of the lower case letters are either narrow (i,l) or have a design that permits balancing in "four corners" in the x-height region. Those letters that can't be balanced in the same way are: r v w y. You can "cheat" the r by making it narrow, but if you go too far it also looses it's "r'ness".</p>
      <p>So I think that the same ideal of even color in the word just can't apply fully to these four letters as they are going to create "holes" of white space toward the bottom of the x-height area whatever you do. And so we have to go to a lesser standard. That's where I think Jost Hochuli's metaphor in Detail in Typography is useful. He says that 'light from above' is more effective than below. Another way of saying this is that on the lower case we give priority to the x-height spacing over the base line spacing. </p>
      <p>So after torturing myself over this stuff I have got to a "don't worry, be happy" place, where I am just looking to get the spacing to look right in the x height area, and not worrying about the lower "holes", other than by having the characters not too wide. </p>
      <p>In upper case you also additionally have problems with A F L T P. --Which if you add V,W,Y means that 8 letters, a third of the UC have unsolvable "problems!" The Carolingian Minuscule 'solved' those design flaws in those five Imperial Caps. But my feeling is that the Imperial Caps were never used in text anyway, but were display, used on signs and stone carving, and were wide and widely spaced to give priority to elegance of letter form. But acknowledging the inherent problems is to me reassuring because it explains why everyone who is sensitive to these issues feels a need to kern caps in display.</p>
    html_clean: |-
      <p>&gt;I’m still very much learning to see</p>
      <p>I'm a few years more at this than you, but only a few, and I completely understand your frustrations, as I have had the same feelings for a long time. </p>
      <p>But I've come to the conclusion that the problem is not me, it's the alphabet :)</p>
      <p>By that I mean, there are some letters who design just does not permit the same kind of evenness of color across the word as the other letters. Almost all of the lower case letters are either narrow (i,l) or have a design that permits balancing in "four corners" in the x-height region. Those letters that can't be balanced in the same way are: r v w y. You can "cheat" the r by making it narrow, but if you go too far it also looses it's "r'ness".</p>
      <p>So I think that the same ideal of even color in the word just can't apply fully to these four letters as they are going to create "holes" of white space toward the bottom of the x-height area whatever you do. And so we have to go to a lesser standard. That's where I think Jost Hochuli's metaphor in Detail in Typography is useful. He says that 'light from above' is more effective than below. Another way of saying this is that on the lower case we give priority to the x-height spacing over the base line spacing. </p>
      <p>So after torturing myself over this stuff I have got to a "don't worry, be happy" place, where I am just looking to get the spacing to look right in the x height area, and not worrying about the lower "holes", other than by having the characters not too wide. </p>
      <p>In upper case you also additionally have problems with A F L T P. --Which if you add V,W,Y means that 8 letters, a third of the UC have unsolvable "problems!" The Carolingian Minuscule 'solved' those design flaws in those five Imperial Caps. But my feeling is that the Imperial Caps were never used in text anyway, but were display, used on signs and stone carving, and were wide and widely spaced to give priority to elegance of letter form. But acknowledging the inherent problems is to me reassuring because it explains why everyone who is sensitive to these issues feels a need to kern caps in display.</p>
