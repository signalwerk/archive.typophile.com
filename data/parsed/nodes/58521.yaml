      <p><em>I do think it is a good exercise in learning feature code as well.</em></p>
      <p>Yes, and yes. As for the rn rm combos, it might make sense to add the right-facing serif on the bottom of the r, but also to firm up the word shape at the baseline. Otherwise in a word like "storm" you get three sticks in a row before the closing serif on the m.</p>
      <p>This alludes to some of the trickiness. I'm using my gut about what is needed, and I'm not sure I can trust my gut. It seems to be taking advantage of me in non-type matters! That said, my take is that at serifs help define word shapes by emphasizing its edges. And they also help define the counter space between the letters and inside the letters. That was my premise.</p>
