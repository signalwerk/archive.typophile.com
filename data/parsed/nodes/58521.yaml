    html: |-
      <p>Wow, thanks for the input.</p>
      <p>Re "relying" on the special effects ;-), honestly I don't think the crash in my example is horrid if it happens (like for Word users or whatever). I'd rather have the crash than a much-larger gap. That said, I think it's nice to be able to avoid the crash, sort of as a bonus. Dunno if that makes it gimmicky; but to be honest I don't quite get the purism. Should it really be better to generally make the spacing "too loose" just so the people without OT support won't see crashes? That strikes me as a more invasive measure that would also influence the nature of the design a lot more (as well, of course, as having differently shaped v/w/y glyphs).</p>
      <p>That said, thanks guys for pointing out the too-tight "rt". I'm about to sort-of finalize the lc spacing, but that one I hadn't really seen. (I know, suboptimal timing.)</p>
      <p><cite>"About the r in this thread: pull it back the arm of the r rather than bending it. I don’t think the change to the y is working."</cite><br>
      Oh. If you have the time, I'd of course be very interested to hear why it's not working for you.<br>
      FWIW, my main thought behind trying it this way round was that I don't want the "r" to lose any of its "r"-ness (which is kind of a fragile concept to begin with) by making it narrower; but on the other hand I don't think a "y" stops being readable as a "y" if it's missing a serif. So the idea is remove the clutter/noise that doesn't carry meaning, to make the bit that does carry meaning stand out more and give them more room. If that makes any sense.</p>
      <p><cite>"But the design and its purpose and then fitting of that design that should drive your choice rather than filling a list of possible features to add."</cite><br>
      *nod* That's also how this came along. I've been impressed with how much "feed-back" there has been from spacing back to the design of individual glyphs, like realizing some glyphs were very slightly too wide or something. With the "r" though, as I said above, I'd like it to keep its current width but am exploring possibilities to make it fit with the others. (Although I'm now thinking that I will probably space its right side a hair more loosely overall.)<br>
      Cheers :)</p>
