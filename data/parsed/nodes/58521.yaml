      <p>I would put the musical analogy of even color differently. I think even color is more like keeping a regular beat. Then the varied rhythm and melody play against that underlying regularity. I think 'spottiness' is a distraction, just as a drummer who can't keep the beat steady is, or player putting an extra beat in a measure would be. </p>
      <p>The "underlying beat" in type is illustrated by those Fourier transform pictures of text. </p>
      <p>Even color and an interesting dance of shapes are in tension, but not opposed. Great typefaces have both.</p>
      <p>This is not to say that the alphabet is ever going to have perfect evenness of color. But if you don't get *relatively* even color the "word image" or "bouma" doesn't come together properly. As Mario Feliciano said to me, "You want beautiful words, not beautiful letters." Relatively even color and rhythm is a big part of that.</p>
      <p>So, Nina, I would say your concern for even color is very healthy for producing good type, though it's only one of several dimensions of type design.</p>
