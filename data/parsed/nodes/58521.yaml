      <p>&gt;Is it not directly opposed to spottiness?</p>
      <p>Yes, that's the general concept.</p>
      <p>I don't think there is a strict definition. I think it has to do with *apparently* even density and rhythm, but no one has given a scientific definition. </p>
      <p>It's been more like Justice Potter Stewart's the famous definition of pornography: "I know it when I see it" :)</p>
      <p>My own way of testing for it is like Chris's, put your letters in words, and see if they hold together and read well. When in doubt, change something and see if it helps.</p>
      <p>For rvwy, etc, it is always a compromise between the letter looking more like itself and having a bigger hole or gap, so you decide what you like. I think with the caps, you go more with the letter looking like itself. With lower case, since most of it works to get even color, there's often more "cheating" by pulling in serifs, narrowing angles, tapering, etc.  </p>
      <p>Peter Enneson can actually read those crazy Fourier transform diagrams, and explained them to me once. It actually all made sense, but I don't think I could repeat it. But in any case all it tells you is that there is a rough convergence around certain frequencies, basically, twice the frequency of the width of an n. So even though 'nina' has one narrow letter, the two stems of the n, the i and the blacks of the two sides of the "a" cluster around the one frequency, with similar density.</p>
