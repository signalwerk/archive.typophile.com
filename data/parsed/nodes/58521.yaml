      <p>"Now I’m confused as to what even color actually *means*"</p>
      <p>This is the dilemma we all face. Though some of us may be more sure than others what it means to us individually, we should all share a healthy respect for the ambiguity that really exists there for all of us collectively. There is much to be said for the line, "neither a borrower nor a lender be" as a way to TRY to see. What I mean is, don't take away from one glyph more than it takes to be itself and don't give to another glyph more than would secure its identity.</p>
      <p>Personally, I can't see a use for blurring or distortion techniques. I would rather set some text then put it away for a while (perhaps long enough to not remember why) and just read it on a new day with as naive an eye as you can muster. You pass the test if you read through it without stopping to bitch at yourself for the pattern :-)  Also do this same thing for other type that is not your own--even quite revered type of the admired masters of the craft. You may find a surprise or two.</p>
      <p>ChrisL</p>
