      <p>I want to echo what Kevin is saying - the examples shown do seem mashed together. The combos rv rw ry will have a degree of gappiness even when you have done your best with them. In order to let the shapes be clear you need a space between r and the other letter. The rt  is too tight. </p>
      <p>Also, the w y &amp; v can be designed so they are more narrow and/or they can have curved strokes if you think the gap is a problem.</p>
