    html: |-
      <p>Nina wrote to me (thanks!) so I am going to reply here:</p>
      <p>I have been planning on posting something but MA at Reading is keeping me very busy and has changed my ideas a bit as well.</p>
      <p>The main idea I would like to put across is that for a text design for both technical and typographic reasons 99% of the time it is  going to be a bad idea to design a font so that it completely relies on special shapes and scripting. The same can be said about kerning. A design should be acceptable without kerning. Having designed and spaced things really well you can think about kerning. Having done the kerning you may actually be done. If not you may want to look at special shapes and CALT. But these shapes need to solve problems not achievable in some other way.</p>
      <p>However if your design is such that some combinations still seem overly awkward or just not as good as they could be - perhaps you have a wide f for reasons of style and want to support several languages- you may want to look at special contextual shapes. </p>
      <p>Let me address some of the combinations specifically: to begin with rn should simply work. If ro looks a little loose then so be it. CALT isn't always available. A good solution for rn should be your default. Refinements could be made for a r+o r+e and maybe another for r at the end of a word and or with some punctuation (eg r+. but not r+;).</p>
      <p>About the r in this thread: pull it back the arm of the r rather than bending it. I don't think the change to the y is working.</p>
      <p>Another example is f+ other letters. Combinations like fi , fl, fh are classics, but even tougher is få fà fā fä and then tougher still is fï fî and then perhaps the very worst is fì. </p>
      <p>But the design and its purpose and then fitting of that design that should drive your choice rather than filling a list of possible features to add. Whatever you do with special shapes should not be noticeable to a reader but should instead solve things so that a clash or gap that would otherwise be problem is avoided and reading is made easier. </p>
      <p>One of these days I will get round to making a list available but I after I have worked on them and can comment.  </p>
      <p>It is worth remembering that good letter design, spacing, and even good document design are all more important than this.</p>
      <p>There is more to say but I need to sleep!</p>
