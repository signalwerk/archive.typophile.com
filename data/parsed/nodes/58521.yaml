      <p>Thanks William. Truth be told, they're not frustrations. This is just me going down the rabbit hole – which keeps getting deeper and darker. Learning to design type has been an engaging exploration to strange and wonderful places, with rare animals along the way, and Typophiles as great travel guides. And sometimes one needs a machete to clear some serifs out of the way!<br>
      Come to think of it, Hrant's jungle metaphor was probably pretty good. :-)<br>
      Seriously, of course I've made certain steps (like trying to space that "r") five times instead of once. But all of that helps me to learn and to see, which really is the point of the exercise (well apart from making this font :-) ).</p>
      <p>It's an interesting angle that the Latin alphabet actively necessitates the presence of white holes. (It would be interesting to know if / how much these are even *helpful* for readability!) Makes me think of my first typography teacher at design school, who used to remind us to "learn to live with our God-given holes" (that of course never failed to crack us up).<br>
      It hasn't occurred to me before to connect that to Hochuli's light thing – interesting. (Another way to look at it would probably be that since the upper half of the x-height is more important in reading than the lower half, that might reinforce the importance of good spacing at the x-line, rather than the baseline.)</p>
      <p>However one sees the theories though, I suspect the most difficult step involved is learning to *see* the right amount of space, and I'm definitely not quite there yet. But I am beginning to think that cerulean was probably right when he said somewhere up there that I'm caring more for "even color" than I should.</p>
      <p>The rabbit hole continues…</p>
