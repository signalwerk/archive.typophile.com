      <p>Uh, yes a bit, but looking back on it now there are things to change. Here is a screenshot of a very simple comparison (sorry for the big image):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/multisemi_5729.gif"></div><p></p>
      <p>Middle column has the contextual subs. Mainly, the subs get rid of one serif in situations where there are serifs on adjacent letters. The sub that is relevant to your thread is a situation like rn and ry where the serif is missing on the second letter.</p>
      <p>Note, these letters are not all the same with serifs added or cut off. Sidebarings have been adjusted as well as glyph widths (adjusting internal counters) to harmonize the different types of glyphs, and yet, there is no kerning :-) The smallcaps are just for fun, and looking at them now, seem very similar to Sauna. Anyhoo, that is the end of the road on my hardrive. -- This would be a cool thesis project I think, were I in a program that is. Clearly there is a lot more that could be done.</p>
