    date: null
    date_raw: null
    votes: null
    html: <p>At least the mechanism they are using to add keywords to the various faces is following some sort of limited, controlled vocabulary. Allowing volunteers to simply make up words that seem to fit is a bit too whimsical a method to describe typefaces. I been through several iterations of brute-force metadata creation where two dozen people involved at an after work 'keywording-party' certainly filled in all of the blanks - but most of the keywords were either too esoteric or convoluted to be useful.</p>
