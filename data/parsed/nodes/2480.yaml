    date_raw: null
    votes: null
    html: "<p>Keywording is all about power. Who controls the marketing process and gets to decide what the product should be like. <br> <br>Getty uses keyword demand to develop product; the process is professionized in the hands of marketers, not the content creator or the end user. (And there is no independent \"keywords standards\" body representing all stakeholders.) I don't see type design getting that corrupted by keywording, but the writing is on the wall. <br> <br>The question is -- whose language, whose keywords are you gonna trust, whose are you gonna use? Whose decision on what is \"esoteric and convoluted\"? <br> <br>I provided a list of keywords for a font recently: Awesome, Badass, Ballin', Chill, Chronic, Dope, etc... which one of my distributors replaced, in my better interests of course. Without a \"no f\"\"k with the keywords\" clause in my contract, they can do that. Pity, I'm not sure the typeface in question was the right one to define the new niche, but still...</p>"
