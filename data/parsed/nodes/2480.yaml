  html: "<p>Re:  <a href=\"http://www.typophile.com/forums/messages/72/22518.html?1071613863\">Will work for Fonts?</a> <br> <br>I apologise if <a href=\"http://www.veer.com/\">my affiliated bias</a> is showing, but does anyone else find it rather humorous that FontShop has only just now discovered that <i>\"keywording fonts for sale online seems to have become a necessity now-a-days</i>? <br> <br>I mean, good on 'em for starting this project - it will do wonders for customer interaction and convenience. But it really is quite hilarious that it has only started being a priority at this point. <br> <br>How do the rest of you approach keywording your typefaces? Do you supply appropriate metadata like keywords, categories, descriptive text, etc. when you send typefaces off to distributors?</p>"
  html_clean: "<p>Re:  <a href=\"http://www.typophile.com/forums/messages/72/22518.html?1071613863\" class=\"link-lost\">Will work for Fonts?</a> <br> <br>I apologise if <a href=\"http://www.veer.com/\" class=\"link-external\">my affiliated bias</a> is showing, but does anyone else find it rather humorous that FontShop has only just now discovered that <i>\"keywording fonts for sale online seems to have become a necessity now-a-days</i>? <br> <br>I mean, good on 'em for starting this project - it will do wonders for customer interaction and convenience. But it really is quite hilarious that it has only started being a priority at this point. <br> <br>How do the rest of you approach keywording your typefaces? Do you supply appropriate metadata like keywords, categories, descriptive text, etc. when you send typefaces off to distributors?</p>"
