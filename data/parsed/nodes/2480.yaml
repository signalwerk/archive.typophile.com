    html: "<p>&gt; i{What ARE today's hot font keywords?} <br> <br>Nick, I don't believe it has to do with keywords being 'hot' or 'dope' or 'what's happening now'. What's missing from much of the keyword data supplied to us by designers is sometimes even the most basic typographic classifications and historical terms (eg: transitional, calligraphic, incised, condensed, etc.) If we could consistently receive these terms in conjunction with a few mood or aesthetic-based terms (eg: roughened, western, distressed, lively, casual, smooth, rounded, harsh, etc.) - it would make our job much easier. I certainly appreciate appropriately whimsical keywords, but not at the expense of more common descriptive terms.</p>"
    html_clean: "<p>&gt; i{What ARE today's hot font keywords?} <br> <br>Nick, I don't believe it has to do with keywords being 'hot' or 'dope' or 'what's happening now'. What's missing from much of the keyword data supplied to us by designers is sometimes even the most basic typographic classifications and historical terms (eg: transitional, calligraphic, incised, condensed, etc.) If we could consistently receive these terms in conjunction with a few mood or aesthetic-based terms (eg: roughened, western, distressed, lively, casual, smooth, rounded, harsh, etc.) - it would make our job much easier. I certainly appreciate appropriately whimsical keywords, but not at the expense of more common descriptive terms.</p>"
