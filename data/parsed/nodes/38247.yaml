    <p>I have a bet going with a friend as to what year this Coca Cola ad was painted. There are two ads painted over each other, we’re only interested in the Cocal Cola one.</p>
    <p>It’s on the corner of West Broadway and Canal Street in SoHo, Manhattan.</p>
    <p>Any ideas?</p><div class="imageWrap"><img src="/files/coke_4009.jpg"></div><p></p>
