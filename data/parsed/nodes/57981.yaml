  html: |-
    <p>I am working on a project for an information design class. For the project, we are to gather some data and design a positive piece that exhibits our findings.</p>
    <p>For my project, I’ve chosen postcards! I am really excited about the project. In order to gather some data, I’ve built a website. Check it out at:</p>
    <p><a href="http://www.onepostcard.com" title="www.onepostcard.com">www.onepostcard.com</a></p>
    <p>If everyone would be so kind as to take the survey and to upload some postcards.</p>
    <p>Thanks!</p>
