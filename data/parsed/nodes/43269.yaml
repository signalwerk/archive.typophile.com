      <p>I’ll second the suggestion of the Speedball book. It’s reprinted every few years so there are thousands floating around including new ones in bookstores. It’s not the only, or the best for models, but it does focus on this basic information. </p>
      <p>The thing you seem to want is models for alphabets, as well as correct stroke formation and order. Learn those basic things for several styles of alphabet and then, after gaining correct form and spacing, develop consistency and then speed. There are dozens of books out there, but very few offer a complete set of historical models of each style (Imperial caps, chancery, fraktur, schwabacher, rotunda, uncial, half-uncial, Carolingian lowercase, etc.). Those models will give you the foundation on which to build.</p>
      <p>I’d also look for direct sources rather than interpretations by the various authors of manuals. There ought to be clear images of historical manuscripts showing the original calligraphy, not just the instructor’s version of them. </p>
      <p>Excellent 20th-century calligraphers to observe: Hermann Zapf, F. Ernst Schneidler, Werner Schneider, Albert Kapr, Georg Trump, Rudolf Koch, Oldrich Menhart, Karlgeorg Hoefer, Helmut Salden, Imre Reiner, Martin Wilke, Alfred Linz, Friedrich Poppl, Gunnlaugur Briem, Julian Waters, Villu Toots, John Stevens, Michael Clark, Jovica Veljovic. There are many more, but I think it’s good to get a sense of the different styles. Some calligraphers have very conservative, classical style, some are more rough and visceral. Contrast Waters with Koch, and Hoefer with Toots. </p>
      <p>Keep in mind that all these calligraphers develop their styles from the foundational alphabets. It’s learning the rules completely that allows them to break them; they are able to make strong, individual works because they have mastered traditional calligraphic styles. I think the German calligraphers in particular exhibit the complete discipline that allows them to explore variations. There have been so many amazing German calligraphers, and so few of their caliber elsewhere.</p>
