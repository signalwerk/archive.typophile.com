  html: |-
    <p>Hello!<br>
    This is to let you know of my second font release called Silent Alternates.</p>
    <p>Silent Alternates born from the deconstruction of Silent Light, resulting in a most impressive typeface.<br>
    Ideal for use in large sizes, such as posters, titles and is an alternative to italics. It can be used to highlight some words in conjunction with Silent Light.</p>
    <p>Hope you like it.</p>
    <p><a href="http://new.myfonts.com/fonts/danieljusti/silent-alternates/" title="http://new.myfonts.com/fonts/danieljusti/silent-alternates/">http://new.myfonts.com/fonts/danieljusti/silent-alternates/</a></p>
    <p>Thanks for your time. Feedback’s apreciated.<br>
    Best regards!</p>
    <p>Justi<br>
    http://www.danieljusti.com</p><div class="imageWrap"><img src="http://typophile.com/files/2_4756.png"></div><div class="imageWrap"><img src="http://typophile.com/files/4_5824.png"></div><p></p>
