    html: <p> Dead on, widening the crossbars really made a difference. I think I'm keeping the 4 the way it is though. It does give me a slight uneasy feeling but I don't want to break any of the rules I set for myself when I made this, errr... about 8 months ago. There will also be a variation of it with diagonal lines (the bitmaps will render the same). </p>
