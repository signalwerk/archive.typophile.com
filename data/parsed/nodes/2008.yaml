    html: <p> I like this -- kind of a workhorse, retro look, useful for everything from dot-matrix printers to grocery receipts. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>If it is intended to be a monospaced font (as it appears to be), you might want to consider widening the serifs and/or crossbars of the lc "f", "i", "j", perhaps the "l", and the "t" by a pixel or two. <br> <br>I would also suggest trying the "4" with the crossbar lowered by a pixel. <br> <br>David </p>
