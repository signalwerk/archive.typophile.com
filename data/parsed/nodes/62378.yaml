  html: |-
    <p>I was just looking at some old work and found my 'sticky' Cooper Black Italic liagature/swash drawing from the <a class="freelinking external" href="http://www.typophile.com/battle04?page=1" rel="nofollow">old Type Battle</a>. </p>
    <p>I thought it could be interesting to make an otf of alt characters that you could just go through cooper black stuff and swap in swashy contextual alternates. A companion font, building on something good; updating rather than recreating.</p>
    <p>It would be only new, original glyphs. There would be no ascii characters, only OT alts, and no original Cooper Black characters. </p>
    <p>I see potential legal problems. What about releasing it free (maybe a creative commons license)? How about naming?</p>
    <p>What do you think? </p>
    <p>Thanks,<br>
    Aaron.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/doodle_sticky_5740.jpg"></div><p></p>
