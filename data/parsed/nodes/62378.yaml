      <p>At least in Europe, the design of Cooper Black is copyright free. I'm not sure about NY, but probably knockoffs like "Cupertino" (bundled with Corel Draw 3 [in words: three]) were available and legal there, too.</p>
      <p>IANAL, but AFAIK there will be trouble only if you use the actual name (Trademark) or some of the mathematical curve descriptions of an existing C B version. You could even add the ASCII characters if you traced them yourself.</p>
      <p>Andreas</p>
