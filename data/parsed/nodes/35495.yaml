    <p>I am designing the numbers to go over the glass on a few Victorian homes. One of them is the one I live in. I will be printing on gold foil and apply over the glass above the door.</p>
    <p>I would like to know if any of you has a source of “house number styles” that is organized by the date where the house was built.</p>
    <p>I appreciate any information and I will post the progress later.</p>
    <p>Thank you.</p>
