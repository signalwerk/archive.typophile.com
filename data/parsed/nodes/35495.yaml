    html: <p>ITC Bodoni Twelve or Seventy-Two (oldstyle figures only, of course) accurately recall the late 19th century without being too aggressive about it. Take a look. There are plenty of display faces for your period, but you may want a type family that can be used in print pieces about these buildings as well as signage.</p>
