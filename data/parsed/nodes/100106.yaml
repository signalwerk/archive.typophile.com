    <p>Hi all, just hoping you could help me out here.</p>
    <p>I'm making a type specimen book for my sophomore portfolio review and I'm trying to find distinguishing characters for twenty typefaces. I've been having some trouble finding information on some of the typefaces, so I turn it to you. I need at least 5 distinguishing characters for each, preferably in Roman or Regular, and why they distinguish the typeface. I'm thinking that I'm going to use Q in all of my designs, because almost every Q is different and special. I just need help with the why it is special and wording it appropriately.</p>
    <p>Typefaces I still need information for:<br>
    ITC Cheltenham<br>
    Berkeley Oldstyle<br>
    Interstate<br>
    Minion</p>
    <p>and a few others I haven't researched just yet, so not sure if there is or isn't information. Will update accordingly.</p>
