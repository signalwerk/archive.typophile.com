  html: <p>Anyone know what font is used for the logo of <a href="http://themify.me/" title="http://themify.me/">http://themify.me/</a>? I'm asking about the "themify" bit, not the handwritten looking part. I thought it was the same font as what vimeo uses (Black Rose?), but apparently not.</p>
