  html: |-
    <p>Hello Guys,,</p>
    <p>We know that finding the right composition for our typography project is time comsuming.</p>
    <p>I built typeface testing tool to save hours of design and type testing time every week.&nbsp;</p>
    <p><a href="http://fontpro.com" rel="nofollow"><img width="650" src="http://fontpro.com/img/fontpro-home.png" alt="Font Pro - Free Fonts and Web Fonts"></a></p>
    <p><a href="http://fontpro.com" rel="nofollow">Font Pro</a> is built to make easier to work with web type and hopefully make the web more beautiful and readable place.  </p>
    <p>We can start a new project with a blank canvas, and get some pretty detail options in minutes. </p>
    <p>Swap the fonts easily and apply some basic style such as font size, font style (italic, bold, underline), text color, background color, margin, and so on.</p>
    <p>Once we have done with your typeface project, download the html, css, and all web fonts we use for our project in at the push of button.</p>
    <p>This tool is still on beta stage, I am looking for feedback and suggestion.</p>
    <p>Thanks in advance,</p>
    <p>Best,<br>
    -------<br>
    Yudhis<br>
    Font Pro Founder</p>
