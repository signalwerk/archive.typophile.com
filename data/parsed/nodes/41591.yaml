    html: |-
      <p>Chris,</p>
      <p>If you install your version of Helvetica Neue in the user Fonts folder (/Users//Library/Fonts/), it will take precedence over the system's version. (Mac OS X's order of font precedence is documented here <a href="http://docs.info.apple.com/article.html?artnum=106417" title="http://docs.info.apple.com/article.html?artnum=106417">http://docs.info.apple.com/article.html?artnum=106417</a>).</p>
      <p>Once you do that, InDesign will start using your version. Photoshop and Illustrator will also use your version, but if the version you have is Type 1 format, then Ps and Ai will also make available the system's version in the font menus. This is because the system's version is TrueType and both Ps and Ai are able to distinguish the two families, even if the fonts have the same names. The app's font menu will display a red 'a' icon in front of the Type 1 version, and an icon with two blue 'T's in front of the TrueType version.</p>
      <p>Now, I would assume that FontExplorer is respecting the OS's precedence order, but I don't use FontExplorer or any font manager so I can't say for sure.</p>
      <p>BTW, this font conflict only happens with the Type 1 and TrueType versions of Helvetica Neue, since the fonts have the same names as the ones installed at the system level. The OpenType version of the Helvetica Neue family doesn't have this problem as the fonts have the string 'Std' in their names.</p>
