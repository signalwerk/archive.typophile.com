  html: |-
    <p>Hi there,</p>
    <p>I just installed Leopard (and I use Linotype FontExplorer X) which appears to have Helvetica Neue included as a system font. My full version of Helvetica Neue (larger family) is now conflicting when i activate it.</p>
    <p>It's good having it as a system font, but quite infuriating when It's also part of a separate, greater family.</p>
    <p>Is there a solution to this? I get 3 conflict messages every time I start up! Argh!</p>
    <p>Cheers</p>
