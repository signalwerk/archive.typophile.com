    html: <p>Judging from the "I" and the "G", I'd say it looks awfully close to Monotype's Arial Monospaced (<a href="http://www.fontshop.com/fonts/downloads/monotype/ariala_monospaced_bold/?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=36&amp;sample_text=DESIGNER&amp;ft=liga" title="http://www.fontshop.com/fonts/downloads/monotype/ariala_monospaced_bold/?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=36&amp;sample_text=DESIGNER&amp;ft=liga">http://www.fontshop.com/fonts/downloads/monotype/ariala_monospaced_bold/...</a>). The "D" has a bit more of an Adobe DIN Mittelschrift look to it but the letters above look pretty similar to the Monotype font.</p>
