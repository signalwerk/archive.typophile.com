      <p>Perfect match is <strong>Google Spies</strong> by HypeFonts . Looks like some sort of post-treated <a class="freelinking external" href="http://www.myfonts.com/search/compacta" rel="nofollow">Compacta</a> with a custom /G (borrowed elsewhere?).<br>
      I prefer not linking directly to the font as many HypeFonts look like roughened versions of commercial typefaces. Clearly not sure everything's completely legal over there...</p>
