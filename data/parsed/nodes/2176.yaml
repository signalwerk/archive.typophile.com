    html: "<p>One very valuable book here is \"Pause and effect: an introduction to the history of punctuation in the West\" by M B Parkes (thanks to John Downer for mentioning it on the TD list a while back). I once copied some short sections of it - here's some stuff: <br>- The exclamation mark first appeared in the second half of the 14th century. <br>- The book doesn't give a firm date about the first appearance of the question mark (except to say that the Castillian practice of a leading inverted question mark started in the 18th century), but it seems to imply that it was during the middle ages. <br>- An interesting aside: there was once a special question mark for rhetorical questions - one flipped horizontally (\"facing\" right instead of left). <br> <br>Also, I remember some Typo-L members once pointing out that the exclamation comes from the two cap letters \"I\" and \"O\", while the question mark comes from \"Q\" and \"O\"? Not sure. <br> <br>-- <br> <br>Dyana, that book sounds interesting! <br> <br>hhp <br></p>"
    html_clean: "<p>One very valuable book here is \"Pause and effect: an introduction to the history of punctuation in the West\" by M B Parkes (thanks to John Downer for mentioning it on the TD list a while back). I once copied some short sections of it - here's some stuff: <br>- The exclamation mark first appeared in the second half of the 14th century. <br>- The book doesn't give a firm date about the first appearance of the question mark (except to say that the Castillian practice of a leading inverted question mark started in the 18th century), but it seems to imply that it was during the middle ages. <br>- An interesting aside: there was once a special question mark for rhetorical questions - one flipped horizontally (\"facing\" right instead of left). <br> <br>Also, I remember some Typo-L members once pointing out that the exclamation comes from the two cap letters \"I\" and \"O\", while the question mark comes from \"Q\" and \"O\"? Not sure. <br> <br>-- <br> <br>Dyana, that book sounds interesting! <br> <br>hhp <br></p>"
