  html: <p>I am doing some research for an article on punctuation, more specifically on the question mark and the exclamation mark.  <br> <br>What I know so far is that the question mark first appeared on some manuscripts as early as the seventh and eighth centuries. I have also seen a printed sample from the 15th century (1495) that has a small question mark. I am also aware that by the end of the 18th century the rules of modern English punctuation were more or less established.  <br> <br>What I am really interested in finding out is if the original use of the marks was the same as it is today, and how the shape of the marks developed. (In some ways the shape of the question mark is similar to an inverted semicolon, a mark, seen in the 8th century, used to mark a pause halfway between the comma and semicolon.) <br> <br>I was wondering if someone could recomend sources, or possible places to start researching the origin of the shapes of these marks and the original meaning they might have had.</p>
  html_clean: <p>I am doing some research for an article on punctuation, more specifically on the question mark and the exclamation mark.  <br> <br>What I know so far is that the question mark first appeared on some manuscripts as early as the seventh and eighth centuries. I have also seen a printed sample from the 15th century (1495) that has a small question mark. I am also aware that by the end of the 18th century the rules of modern English punctuation were more or less established.  <br> <br>What I am really interested in finding out is if the original use of the marks was the same as it is today, and how the shape of the marks developed. (In some ways the shape of the question mark is similar to an inverted semicolon, a mark, seen in the 8th century, used to mark a pause halfway between the comma and semicolon.) <br> <br>I was wondering if someone could recomend sources, or possible places to start researching the origin of the shapes of these marks and the original meaning they might have had.</p>
