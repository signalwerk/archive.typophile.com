      <p>&gt;references are more diverse than just making a facsimile of Lino Caslon.</p>
      <p>As far as letter forms I am following more the original Caslon--and departing from it too--but I trying to capture the effect of 19th &amp; 20th century letter press. The 18th Century, pre-Baskerville stuff is much heavier and more irregular--an undesirable 'antique' effect as far as I'm concerned.</p>
