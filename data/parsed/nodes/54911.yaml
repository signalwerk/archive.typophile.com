    html: |-
      <p>Nick:</p>
      <p>Can we consider Bulmer &amp; Dante here? If I'm following right, they can be considered "twentieth-century" faces. Both have survived well the transition to current-generation fonts. &amp; you know I all but abandoned use of digital versions of metal faces years ago; so few came up to the mark.</p>
      <p>I use Bulmer quite a bit, and I am happy with its dense color on the page. Usually I do not care for the results when a metal face has had weights and other bells and whistles added. But with Bulmer I find the semi to be a useful addition. &amp; some of the added-on sorts in expert and alternative fonts help me use that face. I was happy to see this when it came out, for I was not happy with the Alphatype Bulmer, which was all we had for a while, if I recall right. &amp; even the lead Monotype Bulmer was difficult to make look good at times.</p>
      <p>I do not use Dante myself, but it appears to have survived also.</p>
      <p>I have no idea what the source material was for making these renditions. Maybe someone here does. I do recall that Monotype made a rather elaborate brochure about the "new" Bulmer in the early 90s. Don't ask me where my copy has gotten to, though.</p>
      <p>Monticello is quite well done, I agree.</p>
      <p>I rarely use Caslons, but I'm eager to see what Berkson comes up with.</p>
      <p>powers</p>
