      <p>Charles Nix's Nix Rift is a warts-and-all revival of Dwiggins's Eldorado with emphasis on rich letterpress-style color. David Berlow's revival of Eldorado was also undertaken without specific reference to the original drawings, if I recall. DB's digital revival of Juliana (which is on the docket for upcoming retail release this year) also referenced specimens.</p>
      <p>Matthew Carter's restoration of Monticello started from ancient digital data (which presumably came direct from drawings at some point in the evolution) but was reworked considerably specifically to get back the feeling of the letterpress Oxford and Linotype Monticello. There was a nice poster produced comparing the three versions when digital Monticello was released. </p>
      <p>(Of course, you could argue that the original Oxford was not 20th century, and so it's progeny don't qualify for your survey.)</p>
      <p>-- K.</p>
