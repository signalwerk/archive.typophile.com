    <p>The older faces such as Garamond and Bodoni, for which there are no extant working drawings, have of necessity been digitized with reference to printed specimens. Ironically, more recent better-documented designs such as Electra and Fairfield have perhaps suffered through not being digitized in this manner.</p>
    <p>Which are the 20th century faces that have been digitized from printed specimens, with the attempt to create, in high-res offset output, a facsimile of letterpress typography?</p>
