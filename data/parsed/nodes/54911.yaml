      <p>I started working on a digital adaptation of ATF Garamond from printed samples. It's useable but I never finished it. Fyris fonts also made a multiple master version which I believe was based on scans of printed materials, but they don't seem to be around anymore. I'd attach a PDF of my work, but it seems that only works for thread originators. The capitals are not perhaps not faithful in structure to the original, but the lowercase letters are, and both of them have some pretty realistic ink squash happening.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/garamont_5468.gif"></div><p></p>
      <p><a class="freelinking external" href="http://www.levien.com/type/myfonts/" rel="nofollow">Raph Levien</a> made a few digitizations from the ATF specimen book, so these should qualify as well.</p>
      <p>Carter's digitization of Monticello is sweet; I'd like to be able to buy it someday.</p>
