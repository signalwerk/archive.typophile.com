  html: |-
    <p>Dear friends,</p>
    <p>Boldoni is like a caricature: it brings with itself exaggerated elements of the modern typefaces, that has as main names Giambattista Bodoni and François-Ambroise Didot. Boldoni takes to the egde its width and serifs, causing a ultrafat type feeling, and its styles causes a monochromatic effect that remember the colors Black, Gray and White. Some of uses are titles, initials, drop caps, lettering, posters and vertical writing.</p>
    <p>You can see it on pdf attached and T26 site,</p>
    <p><a class="freelinking external" href="http://www.t26.com/fonts/Boldoni" rel="nofollow">http://www.t26.com/fonts/Boldoni</a></p>
    <p>Comments are welcome!</p>
    <p>Jarbas Gomes<br>
    <a class="freelinking external" href="http://www.fortetype.com" rel="nofollow">ForteType.com</a><br>
    --</p>
