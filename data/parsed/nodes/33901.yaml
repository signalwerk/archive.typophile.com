    html: |-
      <p>Hmmmm, it's not bad but...</p>
      <p>I think it's conceptually problematic because there is no such such thing as fluorescent black as the logo so clearly shows in all its normal black and dirty mustardness.</p>
      <p>Fluorescent Black as a name feels like you're trying to hard to be clever in some post modern kind of way.</p>
      <p>I sort of get it, but just how is a lightning cloud symbolic of fluorescent black?</p>
      <p>The cloud could be better. The left bulge feels too big and some curves just look like parts of circles. The bottom curve eats into the lightning's space.</p>
      <p>The lightining is dwarfed by the cloud, looks cramped and might be better if the middle 'stroke' didn't have 2 angles. At small sizes the lightning may get lost and the whole logo could look more like a cartoon speech/thought bubble.</p>
      <p>I like the font, but I would join the first 'o' to the 'n'. The f is a bit lost and maybe more could be done with the fl ligature. Maybe the terminals of the f and r could end more sharply to echo the lightning.</p>
      <p>Sorry. I'm feeling rather picky today.</p>
