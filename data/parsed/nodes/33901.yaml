      <p>One other thought on the type. Usually, trying to transform and italic into a connected script is problematic. In this case it's giving you a zig zag effect that works well with the lightning. The same kind of thing going on here:</p>
      <p><a href="http://www.milwaukeetool.com/" title="http://www.milwaukeetool.com/">http://www.milwaukeetool.com/</a></p>
      <p>The cloud gives the design a playful feeling, whilst the type suggest a more understated approach. Not knowing your combined styles, it's hard to make a recommendation on type. I do think drawing the type from scratch in a more bolder and more lively style (think Calcite or Fakir) would unify the design.</p>
      <p>And one other thing: consider connecting fluo and noir as in the *noi* join rather than two separate words. It would enhance the lightning rythm in the italic.</p>
