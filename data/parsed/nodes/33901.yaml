    <p>Hi everyone,</p>
    <p>Another freelance Graphic Designer &amp; I have decided to associate,<br>
    and here is the logotype we've vcreated for our collaborative work.<br>
    "fluonoir" means "fluorescentblack" in French.<br>
    Please feel free to criticize it (pros and cons).</p>
    <p>Thx a lot. Virginie</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fluonoir_4321.jpg"></div><p></p>
