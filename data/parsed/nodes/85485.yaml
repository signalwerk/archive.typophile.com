    html: <p>The graphic looks a bit Wizard of Oz to me, which I think is a dated concept and probably won't resonate with todays younger market. Why not change the graphic to something like the top of a monkeys head (from the nose up) and have him wearing some old style pilots glasses. The other alternative is make you graphic smaller and rely on the wording to be evocative. I would definitely loose the camera, it looks a bit amateurish.</p>
