    html: <p>I love Jeremy Dean's Crackhouse but it was very hot in the mid 1990s. All products sold in those those years were extreme. In order to convey to the buyer that their products were sufficiently extreme, distressed fonts were used. Years later, Crackhouse use went down because new products were not even close to being as extreme as their mid 1990s equivalent. Teenagers now consume nachos which fail to set their hair on end or even produce a mild grimace. Even today's most extreme curly fries would induce a coma in yesteryear's teens.</p>
