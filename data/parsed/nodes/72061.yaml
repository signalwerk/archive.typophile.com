    html: <p>According to <a class="freelinking external" href="http://en.wikipedia.org/wiki/Diacritic" rel="nofollow">Wikipedia</a>, Lithuanian uses the acute, grave and tilde in dictionaries to indicate stress types in the language's pitch accent system. If the accent is not part of the normal orthography but is a secondary mark, one could see how the i would retain the dot. This is conjecture, of course. Do you spot dottedigrave and dotteditilde as well?</p>
