    html: |-
      <p>Theunis: not such a char in Unicode. In practice, one uses either a direct sub "iacute" --&gt; "idotacute" or a composition "i" + "dotcomb" + "acutecomb" if we count only good solutions. <em>The Unicode Standard. Versio 5.2</em> reads:</p>
      <p><em>In Lithuanian typography for dictionary use, an “i” retains its dot when a grave, acute, or tilde accent is placed above it. This convention is represented in Unicode by using an explicit combining dot above, occurring in sequence between the “i” and the respective<br>
      accent. (See Figure 7-2.) When case folded using the default case folding algorithm, strings containing these sequences will still contain the combining dot above. In the unusual situation where case folding needs to be tailored to provide for these special Lithuanian dictionary requirements, strings can be preprocessed to remove any combining dot above characters occurring between an “i” and a subsequent accent, so that the folded strings will match correctly.</em></p>
      <p>Frode: I guess so. The only time I saw that char, was in some transcription(s) (also, "uringacute" and other comb.). It's not even in MUFI 3.0.</p>
