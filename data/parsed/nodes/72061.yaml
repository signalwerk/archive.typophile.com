    html: |-
      <p>Convention in dictionaries, grammars, etymologies etc. -- "i" and "iogonek" when tone-marked preserve their dots -- sometimes not followed for obvious reason.</p>
      <p>The "i with dot and acute" is also present in Verdana, Georgia and Comic Sans. No other necessary glyphs are present, though. At least not in versions installed on my system.</p>
