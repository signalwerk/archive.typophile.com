    html: <p>The completion of <a class="freelinking external" href="http://www.ccny.org/buildingtour" rel="nofollow">this church</a> predates Herb Lubalin and Tom Carnase's design for the Avant Garde font by some 20 years. A more likely inspiration for this lettering is Lucian Bernhard's <a class="freelinking external" href="http://www.myfonts.com/fonts/spiecegraphics/bernhard-gothic-sg/" rel="nofollow">Bernhard Gothic</a> (1929).</p>
    html_clean: <p>The completion of <a class="freelinking external link-external" href="http://www.ccny.org/buildingtour" rel="nofollow">this church</a> predates Herb Lubalin and Tom Carnase's design for the Avant Garde font by some 20 years. A more likely inspiration for this lettering is Lucian Bernhard's <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/spiecegraphics/bernhard-gothic-sg/" rel="nofollow">Bernhard Gothic</a> (1929).</p>
