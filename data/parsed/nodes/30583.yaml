    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Baskerville 1757</strong></p>
    <p><a href="/wiki/Lars%20Bergquist" class="freelinking" rel="nofollow">Lars Bergquist</a> (John Baskerville), 2003(?)</p>
    <p>Baskerville 1757 is an attempt to re-create <a href="/wiki/John%20Baskerville" class="freelinking" rel="nofollow">John Baskerville</a>'s original type such as it was really meant to look – on paper, and not in some sanitized universe of ideal shapes. This means that the proportions of the text sizes have been preserved, and the tendency to pare down hairlines and to prettify serifs and other detail work has been firmly resisted. Also, this version contains only what Mr. Baskerville himself wrote: Roman, italic and small caps– no anachronistic boldface.</p>
    <p>Figures are lowercase or 'ranging' text figures of course. Those who occasionally need uppercase or 'lining' figures will however find them in the small cap font . Roman and italic ligature fonts are available, as the period design makes these not only desirable, but actually necessary.</p>
