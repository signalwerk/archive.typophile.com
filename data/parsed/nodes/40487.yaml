      <p>Hmmm, I didn’t pay attention to that when I saw the triangles for the A and F. It seems obvious that Novel Gothic was used in making this font. Have you searched the Sans fonts at Dafont.com?  Such a ’mutilation’ is most often the sort of thing that find its way into the free download sites. Start with a known font, and alter the outlines (the top stroke of the F has been cut off at an angle too), and voilá you have a ’new’ font.</p>
      <p>- Mike Yanega</p>
