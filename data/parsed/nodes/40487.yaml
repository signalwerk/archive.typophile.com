    html: <p>Thanks for the quick response, Mike, but none of the fonts mentioned on the other thread are an exact match.  The most noticeable difference is in the flat tops of the capital A and M, whereas Novel Gothic has pointed tops.  The incline in the foot of the capital L is also very unique.  I have at one time found this exact font somewhere on the web, but I’ve forgotten the name.</p>
