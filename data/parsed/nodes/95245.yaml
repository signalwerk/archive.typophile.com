      <p>Along with their other faults, the SWFTE people didn't know how to spell. The font is named Mexacali, not Mexicali! (And it came in assorted condensed and extended versions as well).</p>
      <p>Other equivalents include these two ripoffs of each other ;)<br>
        Riccio Display Script (Softkey/SSI/SSK)<br>
        Grebe (anonymous, came with an old "Expert Softare" CD </p>
      <p> - Herb</p>
