    html: <p>The font used was SWFTE's Mexicali. SWFTE was a notorious ripoff font seller - but Mexicali was simply a crude modification of Hermann Ihlenburg's 1882 typeface 'Bijou'. Fontbank digitized 'Bijou' as 'Bangle'.</p>
