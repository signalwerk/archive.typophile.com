    <p>Long time anonymous browser, first time poster.<br>
    I'm trying my hand at vectorizing some brush lettering for a friend, and can't seem to get an even weight through the whole mark. I think it's the "r"s? Does the "y" look too upright? That last "s" is super weird, right? Any suggestions on how to fix anything would be much appreciated! I'm finding that you have to make a lot of very purposeful decisions in Illustrator that you wouldn't notice while drawing everything an inch high in pen.<br>
    Thanks so much!<br>
    Jenna</p>
