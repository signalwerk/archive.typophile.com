    html: |-
      <p>I would consider losing the "ears" at the top of the "e"s. I assume you put it in as it reflects the one in the "o", but an "e" is not drawn like an "o", with the stroke rising and then reversing counterclockwise to complete the letter. I think the overall logotype would look a little cleaner and less busy if you take them on the out on the "e"s.</p>
      <p>I agree that the berry should come off the logotype. It looks very odd having this little detailed drawing dangling off this bold smooth flowing text. I think using it as an apostrophe would be lovely, if you can find a way of abstracting it a bit so it's more a shape than an illustration.</p>
      <p>The "homemade" font is bugging me. It looks very severe and static compared to the type above it. I get the retro feel that you're going for, and I think it's appropriate, it just needs a bit more warmth to it. Maybe going from black to bold would soften it a bit?</p>
