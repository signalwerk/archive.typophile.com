    html: <p>I'm fairly certain the font is Cheltenham. It was designed in the late 1890s and made available commercially around 1903, just in time for Heins &amp; LaFarg, the architects of the new subway system, to incorporate into their designs. There is considerable variation in the typeforms in the subway mosaics based on Cheltenham, but the giveaway are the cap A, the cap G, the cap R and the cap S.Significant variants in the font based on Cheltenham are the cap E and the cap S. Doesn't matter. It's genius all the way around.</p>
