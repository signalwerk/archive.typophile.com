    html: |-
      <p>I expect that the letters were made from templates that were done for NYC Transit Authority, and not based on a specific typeface. Those E's certainly don't look like anything I've seen before, except on those subway signs (I'm originally from NYC myself).</p>
      <p>As for anything similar, Cheltenham or Cushing are styles that I think are old-ish. You could search for 1900s serifs at MyFonts. I suspect you could make a lot of fonts look right if you put them in the mosaic frames and backgrounds.</p>
      <p>- Mike Yanega</p>
