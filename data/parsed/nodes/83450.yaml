    <p>Can any one ID the serif fonts used in the old NYC subway mosaics? I realize that each mosaic has a slightly different version of a serif font but if you know anything about any of them, I would greatly appreciate it. Even if you just know of a similar serif font, that would be great, too. Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/86thstreet_3850.480.jpg"></div><p></p>
