    html: <p>Pierre, try working with a work that is in Public Domain. I suggest Alice's Adventures in Wonderland. Its abstract enough for you to go wild with your creative imagination and create a new spin on an old look.</p>
    html_clean: <p>Pierre, try working with a work that is in Public Domain. I suggest Alice's Adventures in Wonderland. Its abstract enough for you to go wild with your creative imagination and create a new spin on an old look.</p>
