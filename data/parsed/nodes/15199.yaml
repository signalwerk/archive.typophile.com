    html: |-
      <p>You might even try a long poem such as T.S. Eliot's "The Love Song of J. Alfred Prufock," or a series of shorter, concise poems like hiakus or something. If it's portfolio work, you probably don't have to choose something in public domain, but the comment above is a good one. If you plan to reproduce the work, publish it on the internet or sell the work in any way, be very careful of copyright laws. You might read <a href="http://www.templetons.com/brad/copymyths.html" rel="nofollow"> 10 myths about copyright explained </a> by Brad Templeton.</p>
      <p>ChuckGroth</p>
