  html: |-
    <p>Hi,</p>
    <p>I'm trying to add pieces to my portfolio but I don't really have any idea. I'd like to edit a small book with images to show my illustration, design and typography capabilities but I just have no idea what to work on. If any of you have any idea of texts that would be nice to edit I'd be very interested.</p>
    <p>Thanks a lot,</p>
    <p>Pierre-Luc</p>
