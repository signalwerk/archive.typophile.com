  html: <p>Greater Albion Typefounders has just published previews of it's next two releases, Mellin Sans and Svengali Roman.  They can be viewed on our <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>, as usual.  Pop by and have a look at what's coming.  In the meantime, our current new release is the decorative 1920s Roman family, Bonnin, currently offered on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/bonning/ " rel="nofollow"> MyFonts</a> at a 40% discount.</p>
  html_clean: <p>Greater Albion Typefounders has just published previews of it's next two releases, Mellin Sans and Svengali Roman.  They can be viewed on our <a class="freelinking external link-external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>, as usual.  Pop by and have a look at what's coming.  In the meantime, our current new release is the decorative 1920s Roman family, Bonnin, currently offered on <a class="freelinking external link-external" href="http://new.myfonts.com/fonts/gatf/bonning/ " rel="nofollow"> MyFonts</a> at a 40% discount.</p>
