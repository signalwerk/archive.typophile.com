  html: |-
    <p>The newest version of the OpenType font format specification, 1.6, has now been published on the Microsoft website:<br>
    <a href="http://www.microsoft.com/typography/otspec/" title="http://www.microsoft.com/typography/otspec/">http://www.microsoft.com/typography/otspec/</a></p>
    <p>Of particular interest, I think, will be the new mechanism for naming of Stylistic Sets<br>
    <a href="http://www.microsoft.com/typography/otspec/features_pt.htm#ssxx" title="http://www.microsoft.com/typography/otspec/features_pt.htm#ssxx">http://www.microsoft.com/typography/otspec/features_pt.htm#ssxx</a></p>
    <p>and the new Character Variant features<br>
    <a href="http://www.microsoft.com/typography/otspec/features_ae.htm#cv01-cv99" title="http://www.microsoft.com/typography/otspec/features_ae.htm#cv01-cv99">http://www.microsoft.com/typography/otspec/features_ae.htm#cv01-cv99</a></p>
    <p>For other additions and revisions, see the change log<br>
    <a href="http://www.microsoft.com/typography/otspec/changes.htm" title="http://www.microsoft.com/typography/otspec/changes.htm">http://www.microsoft.com/typography/otspec/changes.htm</a></p>
