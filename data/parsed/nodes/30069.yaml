      <p>heron2001 said: <em>It was also declared that a minimum of three letters could be changed and a new face would be born - but it had to be a new name.</em></p>
      <p><em>I was an Alphatype shop at the time. It is why our Helvetica was called Claro, our Optima was Musica, our Times Roman was English, etc. Most of Alphatype fonts had the capital R, the asterick and one other letter (I can never remember which one they picked on) different from the original drawings.</em></p>
      <p><em>Things really haven’t changed that much.</em></p>
      <p>One difference between now and then: People using Alphatype equipment could not use Helvetica even if they bought the font from Linotype. Fonts were tied to specific brands of equipment. The formats were proprietary and incompatible. The competition back then was between machines, not fonts. Manufacturers copied the most popular fonts from other equipment to focus customers' attention on the features and benefits of their machine. Fonts definitely played a part in the marketing of equipment, but were not usually a deal-breaker as long as comparable fonts were available.</p>
      <p>Today, practically speaking, there is only one kind of typesetting machine: a personal computer and an output device. Also, for practical purposes, there is only one kind of font: the kind you can use on personal computers. True, there are different formats (PostScript, TrueType, OpenType), but you can use them all at the same time on the same machine.</p>
      <p>Claro did not compete directly with Helvetica in the old days. But today, a Helvetica look-alike competes directly with Helvetica. In this sense, things have changed.</p>
