      <p><cite>But breaking an EULA – that must be illegal, or? If the EULA says that no editing is allowed of this perticular font etc.</cite></p>
      <p>Anything question involving EULAs is only likely to be answered correctly by a lawyer, and there's a very good chance that the answer will be that there isn't any good precedent yet. EULA issues are still pretty new, and the courts have yet to do a good job sorting out whether or not a EULA is actually a binding contract, and if so, what sort of penalties one faces for violating the terms. It also doesn't help that a font EULA creates interesting question where precedent is involved, because a font may or may not be considered a program, which could have a big impact on what other cases affect it. Worse still, judges generally don't know or care much about computers, so there's a pretty good chance that nobody would ever get a sane ruling out of a EULA-related case anyway.</p>
