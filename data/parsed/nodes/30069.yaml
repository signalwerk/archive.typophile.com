      <p>Goran, </p>
      <p>It doesn't matter if you believe it or not -- it is what we lived through in the 1980s.</p>
      <p>Meanwhile - I wanted to share another piece of typography history. When fonts were first being digitized for personal computers and Macs -- they came with very lengthy Agreement statements. Bitstream did not allow you to do any manipulation -- just bringing one of their fonts into Illustrator to outline, fatten, bend, etc. was just illegal to do. Adobe on the other hand were encouraging designers to do just that - but they owned Illustrator - made perfect sense. And neither "foundry" would allow you to collect your fonts to hand over to a printer to have your job come out looking just like you wanted it.</p>
      <p>As a typographer at that time - I ended up having to purchase many different foundry fonts - just so I could run them on the imagesetter. Bitstream fonts were always wider - and would not allow a substitution of another manufacturer's font. Linographics, Compugraphic (later Agfa-Compugraphic), and the other old typesetters -- all had very similar weights -- and Adobe could be substituted...sometimes.</p>
      <p>Meanwhile, I remember when I purchased the URW library. (Talk about much better drawings for fonts, they even tackled some of the old problems from cold type that were found in the ITC font drawings.) URW understood that a designer work should remain in tack. They were the first to allow the designer to include their font to a printer to print the job.</p>
      <p>I think I'm rambling on at this point. What I think I'm trying to point out is -- many of the rules were made by the manufacturers. Sure, they have matured, but still - they are not all the same.</p>
    html_clean: |-
