      <p>Fascinating.  This thread is amazing.  I have really enjoyed reading this history.  </p>
      <p>@Curioustype </p>
      <p>I disagree with your choice of the word "piracy", since that word has lately been used largely to target personal uses of legally purchased copyright material, but the context implies  your primary concern is protecting your work against commercial copyright infringement, which can be more clearly referred to as "bootlegging."  That said, I agree that the responsibility lies with the rights holder, rather than with dafont, which serves a valuable service to both designers and the public.</p>
      <p>You should understand that pdfs are not anywhere close to being "invulnerable to extraction."  If a bootlegger wants to bootleg it, there is nothing you can do other than go after them once they've bootlegged it.  If they want to, they will.  </p>
      <p>(Adobe pdf software is in fact constantly subject to both spyware and malware attacks, so can actually prove to make your computer insecure.)</p>
