      <p>don't ask how i ended up on this old thread, but i have to respond to this:</p>
      <p>"...it was just an example to illustrate my opinion on how sites like Dafont should act in order to prevent piracy."</p>
      <p>I'm going to have to disagree here. I have typefaces for sale, and have one on dafont as well. And as far as I'm concerned, sitting around and expecting dafont or any other free-fonts site to be the guardians of anyone's intellectual property is akin to feeling like you should be able to have a 24/7 bodyguard for free. Preventing piracy is first and foremost the responsibility of the designer wanting to prevent being pirated. There are some steps that can be taken - for example, learning how to produce attractive pdf specimens that are invulnerable to extraction - but to expect others to be your own personal police force rings of elitism.</p>
