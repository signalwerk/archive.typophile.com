      <p>One thing about Alphatype - I guess you didn't catch it in my other note - when they were bought out by Berthold - and for the last few years of their existence - Alphatype shops had the real, true Helvetica -- and it was beautiful. Claro was our Helvetica up to that point, but the letters never quite fit, no matter how much time and attention we spent on kerning - it was actually a flaw in the drawings of each letter. For an Alphatype shop pre-Berthold -- Claro was Helvetica -- and our customers accepted it as Helvetica, just as they accepted Eurogothic for Eurostile, Musica for Optima... etc., etc., etc. And for every type shop with different manufacturer's equipment -- their versions of these beloved fonts were in direct competition with each other -- how -- because our customers depended on us giving them the "real" thing...and yes, our typesetting competitors would try to let all our customers know -- they had the real thing...</p>
      <p>I don't know if you realize it, but there are still countries "setting type" with our old equipment -- and there is still a fully functional hot metal typesetter in New York. They are still producing and for them it is most affordable (and productive). True, no where the amount of shops that we saw in the '70s and '80s (I understand Boro recently gave up their Alphatype equipment - the last in NY City) but in third world countries and small pockets of poor areas you'll find them...</p>
