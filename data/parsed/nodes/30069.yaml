      <p>I think you can look at it this way:<br>
      you will find lots of fonts on the commercial sites (Linotype, ITC,...) that have the same name, but are designed with a slight difference.<br>
      What are the differences between a real Helvetica and Sun Microsystem's Helmet ?<br>
      Almost nothing but very similar.<br>
      see <a href="https://web.archive.org/web/20150124143712/http://tophy52.free.fr/forum/dafont/Helvetica_Helmet.gif" title="http://tophy52.free.fr/forum/dafont/Helvetica_Helmet.gif">http://tophy52.free.fr/forum/dafont/Helvetica_Helmet.gif</a></p>
      <p>According to this, i don't see why anyone couldn't <strong>create</strong> a font that look like a commercial font, with some differences, as long as the designer doesn't call it the same name and/or make it stand for the commercial one, or try to sell it as the commercial font.<br>
      (You can't design fake rollex watches,<br>
      write rollex on it and sell it for a rollex, that's called "bad money").</p>
      <p>To answer Sii, there is nothing to be afraid of with lawyers, when we had to deal with Playboy lawyers asking to all free font websites to retreive the "PlayToy" font, We just did it, no problem, no hassle.<br>
      And it's not the only exemple.</p>
      <p>Each font submitted to Dafont is compared, analysed because there are so many fonts now that it's easy to pass by an existing one.</p>
      <p>Tophy52</p>
