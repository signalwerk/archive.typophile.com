    html: |-
      <p>Do any of you have any knowledge "for real" about dafont.com?</p>
      <p>Not only do they know fonts - I, who was a typographer in New York City for 20+ years have learned from them...</p>
      <p>When a font is a "rip-off" and noted - it is removed IMMEDIATELY from dafont. They, [Rodolpho] really care what they put on their website.</p>
      <p>I use to believe that if someone is selling a font commercially - then there should be no rip-offs of it. However, learning that some of these fonts were designed in the 1800s or early 1900s - and in some cases the FREE font was the first digitized version out there - then, by all means - it belongs out there for the public to use. </p>
      <p>Linotype, Berthold, Alphatype, Mergenthaler, Compugraphic, etc. got enough of our money to keep them in business. The advance of computers for all - did them in. They were so busy selling our customers -- ah, new money - new greed... they forgot about the typesetters that kept them going for 100+ years.</p>
      <p>The example that comes to mind immediately (because it was recently on WTF) is Lainie Day digitized 1993 and was for FREE.  Lady Dawn and a Mr. Lackboroughs showed up in 2004 for PROFIT - designed by Charles P. Bluemlein prior to 1943 (Thank you Mike F.). Yes, Soft Horizon was known for cloning... and Sudtipos seems to have digitized most of Bluemlein's fonts -- but this is a case of the chicken or the egg folks.</p>
      <p>There are so many out there - that were designed before copyrights came into effect or family estates demanded rights. </p>
      <p>I am sorry dafont no longer has a board to communicate with. The majority of their moderators were extremely knowledgeable -- and most were type designers themselves.</p>
      <p>Yes, there are a lot of sites out there that are giving blatant not only rip-offs - but original commercial fonts for the taking... You may stand on your Sunday soap box at Hyde Park and complain about them.</p>
      <p>But before you speak up about Dafont -- I suggest you get to know them a bit better.</p>
      <p>Oh, and mas bien sur -- practice up on your French! </p>
      <p>And P.S. Before you go on about how great commercial fonts are - stop for a moment. I own most of OPTIFonts fonts - and they are out-and-out LOUSY. All commerical, all paid for. Hey, any of you have the original Adobe library, like I do? I still have the MAC disks - where Adobe sent me their "REVISIONS" on a regular basis... shall we go on... and on... and on...</p>
      <p>And to Russell - many type designers throughout the world have donated to that site. Every designer is listed -- including their website when available. Each font that is submitted is welcomed to be submitted with a "READ ME" - not all the fonts there are free - many shareware/charityware even some drinkware...</p>
