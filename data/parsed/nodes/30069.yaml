      <p>"Question; If I open up a font in FontLab, apply the automatic bold effect, move a few nodes on every letter and then make the whole font italic. Is this “legal” according to Dafont?"</p>
      <p>AFAIK, and IANAL, that is legal according to US IP law. </p>
      <p>From my understanding, letterform shapes can not be trademarked at all.</p>
      <p>Font names can be, and specific font outlines can be patented, but anyone can retrace/redraw a font and be in the clear in terms of IP laws.</p>
      <p>Whether it's morally right or wrong is a different debate, of course, and I have no idea what the laws are in different countries (or if my understanding of US font legal issues is even 100% correct...so someone jump in and correct me if needed!)</p>
