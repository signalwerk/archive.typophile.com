      <p>When we left hot metal type for cold computerized type - there was a case that was brought up before a Federal judge (talking in the States now). I don't remember the case -- but I'll never forget the TANY meeting about it.</p>
      <p>It came down to a judge saying he could not tell the difference between fonts. It didn't matter if it was a serif font or a san serif. What came out of that ruling was that the drawings themselves could not be copyrighted but... the programming onto the disk could be. </p>
      <p>It was also declared that a minimum of three letters could be changed and a new face would be born - but it had to be a new name.</p>
      <p>I was an Alphatype shop at the time. It is why our Helvetica was called Claro, our Optima was Musica, our Times Roman was English, etc. Most of Alphatype fonts had the capital R, the asterick and one other letter (I can never remember which one they picked on) different from the original drawings.</p>
      <p>Things really haven't changed that much.</p>
