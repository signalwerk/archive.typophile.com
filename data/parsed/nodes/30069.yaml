      <p><cite>If you looked at the font closely, you would probably realise it was not a “copy” but a similar one, with enough differences that made it a new creation, as i said above.</cite></p>
      <p>Question; If I open up a font in FontLab, apply the automatic bold effect, move a few nodes on every letter and then make the whole font italic. Is this "legal" according to Dafont?</p>
      <p>Another question; If I download a PDF specimen sheet and from that generate a Truetype font that is similar, either I redraw the curves or use an application to "steal" the curves. Finally I make a font out of this and publish on Dafont. Is this legal according to Dafont?</p>
      <p>Don‘t get me wrong, I dont mean to prosecute Dafont, I just want to encourage the people who runs the site that they should check the sources better before publishing the fonts on the site. Not after it’s been spotted as a copy by the owner or a foundry – before it’s even published.</p>
