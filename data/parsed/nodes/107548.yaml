  html: |-
    <p>Dear typophiles,</p>
    <p>I'd like to debut my last typeface called Mayonez, a serifed family that attempts to balance seriousness and friendliness. This type was thought for headings and big applications. I hope you like it.</p>
    <p>Take a closer view at <a href="http://www.behance.net/gallery/Mayonez/12663083" rel="nofollow">Behance</a> or purchase it on <a href="http://www.myfonts.com/fonts/sardiez/mayonez/" rel="nofollow">MyFonts</a> and save 50% until January 5, 2014.</p>
    <p>Best wishes,<br>
    Sergio Ramírez</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typo_poster_4649.jpg"></div><p></p>
