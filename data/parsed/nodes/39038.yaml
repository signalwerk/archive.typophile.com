    html: <p>Is Bell Centennial proprietary? If it is, there is good ol’ Bell Gothic. I’ve used it on maps, and one good thing is that it wraps around curves nicely. That is handy because unless you are doing a street map of Manhattan, roads do tend to curve.</p>
