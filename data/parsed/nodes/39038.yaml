    <p>Hello, </p>
    <p>I’m currently working on a map and I was wondering if you had any ideas about super elligible fonts for use with very small sizes for a map with street names.<br>
    Some thoughts though:<br>
    – TazzerText? from Lucas<br>
    – Cordid Condensed? from Lucas too<br>
    – Fago from FontFont?</p>
    <p>Thanks in advance.</p>
    <p>Nicolas</p>
