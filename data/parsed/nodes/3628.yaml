      <p>As Charlie Brown would say: AAUGHH! The stuff in the word balloons in Asterix comics is LETTERING not FONTS or TYPOGRAPHY. *sigh* (One of my pet peeves is the way people refer to any kind of letter style as a “font,” regardless of whether it is actually a font or not.)</p>
      <p>I do enjoy the way they use different lettering styles in Asterix to indicate what language is being spoken. Clever.</p>
