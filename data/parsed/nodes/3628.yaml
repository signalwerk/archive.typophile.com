    date_raw: 17.Mar.2004 3.46pm
    votes: null
    html: <p>I got a couple of the French editions as gifts in the late sixties when I was learning French in school. They were given to me by a collegue of my dad's from Denmark who stayed with us a few times when he was in the U.S. on business. I still have them, though they are very tattered now. A few years ago I started buying more of them (a few in French, mostly in English) to read to my daughter. We both love them. Astérix Légionnaire, the first one I ever saw, is still my favorite.</p>
