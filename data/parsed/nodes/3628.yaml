    html: "<p>My mother collected the complete series. She bound  <br>them into handy hardcover volumes of five or six  <br>albums each. The great thing is you can read them  <br>on so many levels: for kids it's very funny slapstick  <br>and situation humour, but as you grow older and  <br>reread them you start noticing the subtle word plays,   <br>the celebrity cameos, the references to history,  <br>politics, social issues, cultural preconceptions...  <br>they're just great.</p>"
