    html: "<p>There's something <i><b>really</b></i> weird with this one. It's  <br>full of inconsistencies. <br> <br>Note the hairline stems of the 'N' and 'W', they  <br>appear to be way too thin in comparison with the  <br>'M'. Both the spine of the 'S' and the tail of the  <br>'R' look cramped. The serifs on the 'C' are much  <br>thinner than on the 'S'. The lower left-hand serif  <br>of the 'R' is too heavy, and the bracketing of the  <br>serifs is all over the place: from fairly rounded  <br>on the 'N' to almost straight on the 'M'. And the  <br>aforementionned lower left-hand serif of the 'R'  <br>even seems to jump upwards at the edges. <br> <br>Could this be... *gasp*... Mary Shelley's typeface  <br>of Frankenstein? Arghh... the horror!</p>"
