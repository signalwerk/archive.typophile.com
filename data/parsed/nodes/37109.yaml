    <p><a href="http://www.craigoldham.co.uk/ongoing/handwrittenletterproject/" rel="nofollow">Details of the project</a><br>
    <a href="http://www.craigoldham.co.uk/ongoing/letters/" rel="nofollow">The outcome</a></p>
    <p>I thought I give the blog a go, seems more like writing messages on bits of lead and throwing them in the nearest spring, still – this project shows the letterheads of some agencies and the handwriting of some designers raises all sorts of questions like ‘why did they think that was a good idea?’ and ‘call that handwriting?’ and ‘why would anyone over the age of 11 use a rainbow pencil?’</p>
    <p>Tim</p>
