  html: |-
    <p>I found this on a random free font page as "BAMBOO.TTF" (see attachment). It's very similar to Castaway. No author info or other details were provided. I haven't been able to find it elsewhere under any name containing the word "bamboo", so it's possible that the filename is misleading.</p>
    <p>I'd like to confirm that the font is free, or buy it if not. </p>
    <p>Thanks for your time!</p>
