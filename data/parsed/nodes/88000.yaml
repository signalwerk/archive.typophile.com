    html: |-
      <p>Mmm... The Castaway’s source seems indeed the same of this one (minus the ropes) and whoever did this probably didn’t have a complete specimen (not one that contained X anyway). So I think it’s more like an autotrace of an old typeface than a rip-off of an existing font.<br>
      Anyway, you could ask Castaway’s author (<a href="http://rotodesign.com/contact.html">http://rotodesign.com/contact.html</a>) about the origin of the design.<br>
      A similar (albeit in my opinion less vibrant) take on the genre would be House Industries’ Tiki Palms (<a href="http://www.houseind.com/fonts/tikitype/viewfonts">http://www.houseind.com/fonts/tikitype/viewfonts</a>).</p>
