    <p>My wife’s freelance PR business is taking off and she wants me to work on a logo for her. There are a few typefaces I am considering using but I don’t own them all. I am considering Tartine Script bold and Village’s Galaxie Cassiopeia Bold (not Basic Bold). If anyone has these, can they type out the word “son” in all lowercase at 72pt and email me the Illustrator outlines to david dot nix at dfs dot com? Thanks in advance.</p>
