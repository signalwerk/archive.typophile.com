    <p>WhatTheFont didn't turn up an exact match but it does look like Lorimer No.2 with a more egg-shaped lower-C and quite a different R. The differences are not subtle enough to convince me this is modified from Lorimer No.2 and I've never seen anything like it plus this is a Japanese publication so I'm guessing what else it could be. Perhaps a Japanese foundry?</p>
    <p><a class="freelinking external" href="http://leyline-publishing.com/arc/arc15号" rel="nofollow">http://leyline-publishing.com/arc/arc15号</a> Click on the book cover to see it enlarged. I'm referring to the font used in "arc/15".</p>
