    <p>Greetings,</p>
    <p>I was wondering if anyone knew this specific blackletter typeface.</p>
    <p>The sample comes from Lord Hobo, a beer hall located in Cambridge, MA (which is in Boston for anyone who does not know) near the campus of the Massachusetts Institute of Technology. I have looked through reams of blackletter on MyFonts but have yet to identify it precisely. I have also posted it on WhatTheFont.</p>
    <p>The website I pulled this sample from is: <a href="http://lordhobo.com/" rel="nofollow">http://lordhobo.com/</a></p>
    <p>Thanks all.</p>
    <p>Aa</p><div class="imageWrap"><img src="http://typophile.com/files/logo_60_4215.jpg"></div><p></p>
