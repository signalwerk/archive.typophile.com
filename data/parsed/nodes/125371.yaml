    html: |-
      <p>Theunis, thank you for the question.</p>
      <p>I am a Web developer and I want to speed up loading of font files on my websites. So it would be nice if, instead of bulk files with thousands of glyphs, files containing only the needed glyphs were provided by the server.</p>
      <p>Creating these font files manually is not an option, for website content changes constantly. Today, for example, an article with Greek letters could be added, and tomorrow it could be removed from the site, and Greek script glyphs will no longer be needed until the next time.</p>
      <p>On my websites, OpenType features are extensively used, especially the ligatures, small capitals and figure styles (e.g. onum + pnum for inline numbers, but lnum + tnum in tables). Ideally, I would be satisfied with a tool that programmatically traverses all the content and, in some magic way, finds out what particular glyphs are needed to render all pages correctly, and then creates the subset of a font with these and only these glyphs.</p>
      <p>But this solution would require too much black magic, so I am looking for something more simple. I can programmatically get the list of all codepoints currently used in site’s content, and I wish the tool to find all glyphs that can correspond to these codepoints. I.e. if U+0031 DIGIT ONE is on the list, let the tool include all glyphs representing “1” into the resulting subset. Ideally, again, the “fi” ligature glyph should be included only if “fi” substring is found somewhere in the content, but it would be enough if the tool includes all ligatures for given letters. I.e. if U+0066 LATIN SMALL LETTER F is on the list, let the tool pick all ligatures containing “f” (fi, fl, ffj etc.).</p>
