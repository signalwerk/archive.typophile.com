  html: |-
    <p>I am looking for a tool (maybe software or a Web service) that can create subset of a given font containing glyphs for chosen characters only.</p>
    <p>All the solutions known to me lack one crucial feature: they don’t know anything about OpenType features (ligatures, figure styles, alternates etc.). I.e. if I request a subset containing “ABCabc123”, the software creates a font with 9 glyphs—without, for instance, small-caps for these letters or sub/superscript for these figures. Requesting a subset of “f” and “i”, I get no glyph for “fi” ligature in resulting font, and so on.</p>
    <p>Do you know a tool that can subset font together with all OpenType features for chosen characters?</p>
