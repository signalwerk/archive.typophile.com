      <p>If you ask for a subset of 'f' and 'i', do you want just 'fi' and 'ffi' ligatures, or - "ALL OpenType features related" - the ligatures for 'fj' and 'ft' as well? Minding that regular software will *not* be able to access these characters, because you will not be able to use a 'j', since it's not in your font.</p>
      <p>And what about OpenType kerning? Do you want *every* character included that kerns against your chosen character?</p>
      <p>What is the purpose of your subset font?</p>
