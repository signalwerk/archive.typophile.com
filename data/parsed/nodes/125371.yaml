      <p>Let's be clear. Who are you? There is no name of gender attatched to your post. </p>
      <p> And also, if You request a subset containing “ABCabc123”, and that's it, why should a subsetter include glyphs of features you did not request? I think subsetting tools are there to make the font smaller, so making decisions behind the user's back that make the font larger would be hard to use. Thus, smart subsetting tools require you to name the glyphs and/or the features you wish to be in the font, explicitly.</p>
      <p>Hope that helps.</p>
