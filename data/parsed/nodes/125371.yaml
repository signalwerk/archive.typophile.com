      <p>I think it is pretty self-evident that if a client wants a specific characters subset, with related kerning and OT features, then the default delivery would be:<br>
      - those characters, their variants, and ligatures whose inputs are *all* among the aforementioned glyphs<br>
      - kerning for those pairs (and triplets etc) whose constituent glyphs are *all* in the newly defined subset</p>
      <p>Of course, one would verify that with the client, but that would be the obvious answer. Some of Theunis' suggestions seem deliberately twisted to me, but maybe it's just me.  :)</p>
