  html: |-
    <p>A while ago I wrote a post on Unzipped analysing the design and typography of the Flemish poster campaign for the current European and regional elections, <em><a href="http://www.fontshop.be/details.php?entry=384" rel="nofollow">The typography of politics</a>.</em></p>
    <p>To my surprise I learned yesterday that this post has made its way -- via the Facebook profile of Geert Lambert, head of the SLP party -- to <a href="http://www.deredactie.be" title="www.deredactie.be">www.deredactie.be</a>, the news site of the Belgian national television. Their translation is dodgy and they misunderstood some details, but it still nice to see a focus on typography in the mainstream press. :)</p>
    <p><a href="http://www.deredactie.be/cm/vrtnieuws/ookdatnog/1.534657" rel="nofollow">SLP have already won the elections…</a></p>
