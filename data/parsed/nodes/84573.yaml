    votes: null
    html: <p>Thanks!  I don't think the spelled out script is right for this project, unfortunately.  It needs to be a good bit less ornate to work with the architecture.  Although it is not classic mission or prairie style, so something strictly Arts &amp; Crafts proper is not necessary either.  It is not really a historic restoration so being true to the era is a loose parameter.  I really love those ligated numerals!  That is the kind of thing I was thinking, but I didn't have quite the right search terms.  There really are not many examples of that.  I was looking at P22 Dard Hunter &amp; ITC Rennie Macintosh, which do offer a good starting point.  I was hoping to bring more specific designed relationships between the adjacent numbers than a font could afford, and ligatures was how I was thinking about creating that feel.  Thanks for the responses!  Off to sketching...</p>
    html_clean: <p>Thanks!  I don't think the spelled out script is right for this project, unfortunately.  It needs to be a good bit less ornate to work with the architecture.  Although it is not classic mission or prairie style, so something strictly Arts &amp; Crafts proper is not necessary either.  It is not really a historic restoration so being true to the era is a loose parameter.  I really love those ligated numerals!  That is the kind of thing I was thinking, but I didn't have quite the right search terms.  There really are not many examples of that.  I was looking at P22 Dard Hunter &amp; ITC Rennie Macintosh, which do offer a good starting point.  I was hoping to bring more specific designed relationships between the adjacent numbers than a font could afford, and ligatures was how I was thinking about creating that feel.  Thanks for the responses!  Off to sketching...</p>
