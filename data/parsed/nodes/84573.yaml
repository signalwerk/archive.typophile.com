  html: <p>I am working on a custom house number, and I am having trouble finding some interesting examples.  Are there any neat examples of number ligatures?  Or really anything that uses numbers in an interesting way beyond just interesting individual numbers combined.  To be more specific, nothing too ornate, a kind of 1910s craftsman/foursquare/arts &amp; crafts style.  I was thinking of something that could be made as a single piece of material instead of mounting each number individually.  Just looking for inspiration and ideas at this point.</p>
  html_clean: <p>I am working on a custom house number, and I am having trouble finding some interesting examples.  Are there any neat examples of number ligatures?  Or really anything that uses numbers in an interesting way beyond just interesting individual numbers combined.  To be more specific, nothing too ornate, a kind of 1910s craftsman/foursquare/arts &amp; crafts style.  I was thinking of something that could be made as a single piece of material instead of mounting each number individually.  Just looking for inspiration and ideas at this point.</p>
