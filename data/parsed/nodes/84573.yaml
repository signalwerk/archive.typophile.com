    html: <p>I hired John Downer to hand paint numbers for my house sign. The house has an Arts &amp; Craft style exterior. The numerals on the sign are based on John's Iowan Oldstyle type, which fits nicely with the style of the house and gate, but we tested variations of weight and proportion to get the best legibility and impact when the sign is seen from the road.</p>
