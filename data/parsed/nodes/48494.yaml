      <p>@auricfuzz<br>
      A ’thoughtful’ preview pane? please expand on that!</p>
      <p>but yes, something along the lines of extensis suitcase (but with more functionality in the classification/grouping/searching) is probably on the cards. (though the auto activation plugin stuff might be beyond the time i have available. for me just a decent categorisation would be beneficial)</p>
      <p>“activation” is easy it seems having a look at the APIs. weirdly enough there is no functions for determining font names from a file and that’s going to have to be hard coded, reading the file format.</p>
      <p>@Hallock </p>
      <p>&gt;How will this be different from Linotype Font Explorer?</p>
      <p>i won’t delete the software from the net :) I’ve not tried it as they pulled it. No dates, no real indication that they are carrying on with it, let alone a projected release date. Seriously if me just hacking something together forces the hands of one or more other developers then hooray. i just can’t take looking through loads of fonts or having to manually stick things in groups anymore. this kind of software is not rocket science.</p>
