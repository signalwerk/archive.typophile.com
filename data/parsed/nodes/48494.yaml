      <p>If your idea includes a nice, thoughtful preview pane and activation, I am already drooling at the thought. We poor Windows users are rather out of luck as you said. </p>
      <p>I currently use Extensis Suitcase for Windows, which is leaps and bounds better than my previous program, MainType. But Suitcase, though functional, does seem rather barebones, especially in being locked into the folder methodology rather than the more metadata-style approach you are using.</p>
      <p>You probably have already seen it many times, but <a href="https://web.archive.org/web/20081122063122/http://www.myfonts.com/">MyFonts</a> has what seems to be the best tagging system out there, though with so many typefaces available, it can be hard to find something really suitable for a query. You might want to contact Nick Sherman from MyFonts; he’s done some work trying to figure out how to organize and classify type, which you can get an overview of <a href="https://web.archive.org/web/20081122063122/http://www.nicksherman.com/degreeproject/index.html">over at his site</a>.</p>
      <p>And if, far down the line, you want anyone to test the software, look me up<br>
      :-)</p>
