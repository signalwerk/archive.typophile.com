    <p>...because I am fed up with there not being anything decent available for finding/classifying</p>
    <p>was thinking of a tag based system of classification, e.g. a font could be tagged</p>
    <p>“sans-serif 1970s funky curly bold narrow bodytext” or anything you like just to make things easier to find.</p>
    <p>the power would be in people sharing their databases online - export to a text file and stick it online so others can merge with their own databases. Of course some agreement would need to be reached over generic tags but really anything is better than nothing.</p>
    <p>this would be free (and probably open source later)</p>
    <p>comments?</p>
