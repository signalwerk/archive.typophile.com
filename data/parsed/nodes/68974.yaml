    <p>Hi,</p>
    <p>In latin alphabet languages, aligning text to the left is the norm, right-align (in brochures, websites etc) is unconventional, but not incorrect.<br>
    Is the situation similar (but reversed) in Hebrew, or is left-align actually incorrect.</p>
    <p>Similarly, in a web form, placing the labels to the right of the form fields would be unusual, but acceptable. What's the situation in Hebrew?</p>
    <p>Thanks<br>
    Steve</p>
