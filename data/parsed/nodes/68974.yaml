    html: |-
      <p>Right-align is the norm for RTL scripts such as Hebrew, also Arabic, Syriac, etc.</p>
      <p>This affects all layout, not just line alignment, so yes the norm for a form would be for labels on the right. In software, the entire user interface is normally flipped for such languages.</p>
