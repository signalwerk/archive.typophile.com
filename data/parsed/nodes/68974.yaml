    html: |-
      <p><em>Yes, I realise right align is the norm (as is left align in western latin alphabets), but what I'm trying to get at is how much offence or difficulty would be caused by having text left aligned. (It's unusual but not totally unacceptable for text to be right aligned in latin alphabets).</em></p>
      <p>It is <em>very</em> occasionally seen for a short piece of text in a display setting to be right-aligned in a Latin-based alphabet. It is virtually never seen for continuous text to be set in this way, nor is it acceptable. You lose the predictability of line-start position, which slows reading and results in more line-skip errors. The same is true for left-aligning RTL writing systems.</p>
