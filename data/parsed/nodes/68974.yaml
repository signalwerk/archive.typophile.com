    html: |-
      <p>Hi,</p>
      <p>Thanks for your replies.</p>
      <p>Yes, I realise right align is the norm (as is left align in western latin alphabets), but what I'm trying to get at is how much offence or difficulty would be caused by having text left aligned. (It's unusual but not totally unacceptable for text to be right aligned in latin alphabets).</p>
      <p>The context is that I've built a website for a client which currently works in 12 languages (all European), but they want to add four more languages, including Hebrew.</p>
      <p>The user selects a language and then each page loads a language file so that markers in the page are replaced by the translated text from the language file.</p>
      <p>Adding a Hebrew language file is no problem, but if I then have to go through the entire site adding code to say that if the user has selected Hebrew the alignment needs to be reversed, then that's going to be a whole lot more work, and I need to reflect that in my quote. I suspect that they're going to ask if this step is necessary and I'd like to have some informed opinions ready in order to reply to that question.</p>
      <p>The site is mainly functional, but obviously needs to look good too. They are making the effort to provide the site in many languages, so they obviously take localisation seriously, but I don't know if they're going to want to pay for a full site-wide alignment fix for the benefit of a single language - unless they really need to.</p>
      <p>The audience are software company sales staff.</p>
      <p>Thanks<br>
      Steve</p>
