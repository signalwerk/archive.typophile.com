    html: |-
      <p>Hebrew should begin on the extreme left, which is G-d's right, running from right to left. Hence, it is in the center.</p>
      <p>English should begin on the extreme right, running from left to right; hence, it ends in the center.</p>
      <p>The English reader continues and learns what the words are in Hebrew. The beginner in Hebrew continues and learns what the words mean in English.</p>
      <p>Hence, the Koren erred big time.</p>
