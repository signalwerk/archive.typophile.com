    html: |-
      <p>&gt;the extreme left, which is G-d's right</p>
      <p>Israel, if the Holy One is everywhere, there is no divinely privileged right or left. </p>
      <p>You've got a point about continuing to a translation, but only if sentences end on the inner margin, which often they don't. I like Koren's layout of Hebrew on the left page, English on the right, as with hanging indents it pulls stuff away from the gutter. Also English normally has the first page on the right, and Hebrew the first page on the left. Still I don't see any knock-out argument one way or the other.</p>
