      <p>The Romm Talmud was an outgrowth of the earlier Shlavita Talmud of the late 18th century, printed in Poland by two brothers, the sons of a very great Chassidic rabbi. It was originally financed by the Baron Gansbourg, himself a reknown Chassidic Jew, and extremely wealthy.</p>
      <p>The Romm family itself were also extremely wealthy, and thought that they did not need any benefactor to produce the first edition of the Talmud. </p>
      <p>The first edition of the Talmud took seven years to produce before the the Romm family went totally bankrupt, and had their dream of producing a Lithuanian Talmud absolutely shattered. The Romm family did not know what to do. The Talmud was not completed, and they became paupers.</p>
      <p>The Romm family then consulted with the sons of the Vilna Gaon and the great Rabbi Akiva Eiger, the Vilna's Gaon's brilliant son-in-law, and Rabbi Chaim Halevy, the Voloziner (not to confused with his grandson, Rabbi Chaim the Beis Levy of Volozhim, later known simply as the Grach). They advised to approach the greatest and richest benefactors, particularly my great-grandfather's great-father, Rabbi Boruch Halevy Zeldovich zatzal, Mr. Horenstein zal, and Rabbi Gurary zatzal, even though they were Lubavitchers and members of the hated Ket, or cult.</p>
      <p>Gurary paid for the binding, and distribution. Horenstein and others finished paid for the typesetting. And Zeldovich who had a massive wood and paper enterprise sold the Romm family an exclusive contact for all their future paper needs, with a 100 year payment plan. In exchange for a graphic dedication depicting two lions, representing Boruch and his brother Rabbi Dovber Halevy, Zeldovich shipped to the Romm family the best possible paper, representing about 60% of the Romm family's overall cost to produce the Talmud.</p>
