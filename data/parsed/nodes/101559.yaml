      <p><a href="http://printingthetalmud.org/essays/10.pdf" title="http://printingthetalmud.org/essays/10.pdf">http://printingthetalmud.org/essays/10.pdf</a></p>
      <p>The “Vilna Shas” and East European Jewry<br>
      by Michael Stanislawski </p>
      <p>I N 1880 the first volumes of an extraordinary edition of the Babylonian Talmud were<br>
      published in Vilna, the center of rabbinic learning in eastern Europe for almost half a<br>
      millenium. Known colloquially as the “Vilna Shas”<br>
      (the latter term an acronym for shishah sedarim, literally the six orders of the Mishnah, but<br>
      used since the late-sixteenth century to refer to the entire Talmud), </p>
      <p>this edition, published by the firm<br>
      of “The Widow and Brothers Romm” and completed in 1886, has been used to this day throughout<br>
      the Jewish world as the authoritative, traditional edition of the Talmud and its commentaries.1</p>
      <p>1. The most important<br>
      study of the history of the<br>
      publication of the Talmud,<br>
      including the Slavuta and<br>
      Vilna editions, remains<br>
      Raphael Rabbinovicz,<br>
      Maamar al Hadpasat ha-<br>
      Talmud (Munich, 1877).<br>
      This was supplemented<br>
      by the posthumously published<br>
      memoir of the director<br>
      of the Romm Press, in<br>
      Yahadut Lita (Jerusalem,<br>
      1960), which also contains<br>
      the editor’s bibliographical<br>
      citations of other twentieth-<br>
      century studies on the<br>
      Romm Talmud. Very valuable,<br>
      too, is the entry on<br>
      “Romm” in the Russian-<br>
      Jewish encyclopedia, Evreiskaia<br>
      Entsiklopediia (St.<br>
      Petersburg, n.d.), vol.13, pp.<br>
      602–603.</p>
      <p>The Vilna Shas followed the classic layout of the printed Talmud, with the text of the Talmud—<br>
      both the Mishnah and the Gemara—in the center of the page, and with commentaries running<br>
      down the length of both margins. Within these margins and at the back of the volumes of each tractate<br>
      there appeared an unprecedented number of rabbinic exegeses, glosses, and interpolations to<br>
      the ancient text, ranging in time and place from tenth-century Kairouan, Tunisia, to mid-nineteenthcentury<br>
      Posen, Germany. Thus, although the Talmud is usually spoken of as having been completed<br>
      (or “sealed”) in the sixth century, it in fact remained the site of a continuing conversation<br>
      among Jewish scholars lasting to our very times, most recently aided and abetted<br>
      by new computer technologies that were inconceivable even a decade ago.2</p>
      <p>2. See for example, www.<br>
      e-daf.com, which allows<br>
      one to access any page of<br>
      the Talmud in its original<br>
      format, as well as an English<br>
      translation of the page.</p>
      <p>The story of how the Vilna Shas appeared, the controversy surrounding it, and the<br>
      history of the Romm publishing house as a whole, is but one crucial episode in the<br>
      long and fascinating history of the printing of the Talmud—a tale full of mystery<br>
      and intrigue, as well as remarkable scholarship and piety. The inventiveness and<br>
      ingenuity of the fifteenth-century German Catholic Johann Gutenberg and his successors<br>
      made possible a reality that the leaders of rabbinic Jewry in earlier centuries<br>
      had only dreamt of in their wildest dreams—the spread of talmudic study not only<br>
      among the learned elite, but also to the broad spectrum of the (male) laity of Jewish<br>
      society. With the advent of printing, the rabbinic dictum, “ve-talmud Torah ke-neged<br>
      kulam” (conventionally interpreted as “the study of Torah is equal to all the other<br>
      commandments”), was now within the reach of multitudes of Jews throughout the<br>
      world, including the lands of eastern Europe, which from the sixteenth century on<br>
      constituted by far the largest Jewish community in the world.</p>
      <p>The Jews of eastern Europe were also the most politically secure Jewish community<br>
      in Christendom, enjoying the support of the Polish monarchy against pressures<br>
      both domestic and foreign, including the attacks on the Talmud from the Vatican<br>
      and, by extension, the Polish Catholic Church. Thus, the papal assault on the Talmud<br>
      that began in 1553, and which led to the burning of the Talmud in Rome two years<br>
      later, was responded to in Lublin by the publication of a new edition of the Talmud<br>
      in 1559. This enterprise lasted a decade and a half, but resulted (for reasons we do<br>
      not know) in only two tractates being issued. To the best of our knowledge, in the second half of the<br>
      sixteenth century, Polish-Lithuanian Jews were, like their brethren in other lands, using the several<br>
      excellent editions of the Talmud published in Salonika and Constantinople, far outside the orbit of<br>
      the Roman Catholic Church.</p>
      <p>Yet these editions were soon outdone by the first east European publication of the entire, and<br>
      unexpurgated, Talmud, issued in Cracow in 1602–1605, with a second edition published in 1616–<br>
      1620. This milestone of east European Jewish publishing history remained in use throughout the<br>
      world, even as its homeland was devastated. At precisely this time, the region experienced wave after<br>
      wave of violence, culminating in the 1648 Cossack uprising led by Bogdan Chmielnicki in which<br>
      hundreds of thousands of Jews and Poles were slaughtered. This was followed by multiple invasions<br>
      from Russia, Sweden, and other powers. In these di¥cult decades, known in Poland as the “Deluge,”<br>
      it is not surprising that there were no new editions of the Talmud published in eastern Europe, as<br>
      opposed to the relatively more peaceful west, which produced the important Amsterdam (1644–<br>
      1648 and 1714–1719), Frankfurt-am-Oder (1697–1699), and Frankfurt-am-Main (1720–1722)<br>
      editions of the Talmud. These printings were in large measure based on the earlier Cracow editions,<br>
      and thereby obviated the need for a new, east European edition.</p>
      <p>By the turn of the nineteenth century, the twin dynamics of Talmud printing came into play once<br>
      more. There was the need for an intersection of a su¥cient body of new commentaries deemed<br>
      authoritative (and all-but canonical) to be included either on the margins of the Talmud text itself<br>
      or in appendices to the main text. Equally crucial was the existence of economic, political, and religious<br>
      realities that made a new publication of the Talmud possible. Thus, right at the<br>
      start of the nineteenth century, a new edition of the Talmud was printed in Slavuta,<br>
      Ukraine, in 1801–1806, 1808–1813, and 1817–1822, and a competing edition in<br>
      Vilna in 1835.3</p>
      <p>3. My remarks on the Slavuta<br>
      Press and its Talmud follow<br>
      Shaul Ginzburg’s essay, “Tsu<br>
      der geshikhte fun der yidisher<br>
      drukvezn,” in his Historishe<br>
      Verk (New York, 1937), vol.1,<br>
      pp. 48–62. His popularized<br>
      series on the subject, published<br>
      in the late 1930’s in the<br>
      Forverts, has recently been<br>
      translated into English as Saul<br>
      Moissevich Ginsburg, The<br>
      Slavuta Drama, translated<br>
      from the Yiddish by Ephraim<br>
      H. Prombaum with introductory<br>
      and concluding remarks,<br>
      glossary, and suggested readings<br>
      (Lanham: University<br>
      Press of America, 1991).<br>
      Although clearly an act of<br>
      filial piety by a descendant of<br>
      the Shapira family, this translation<br>
      is a further popularization<br>
      of an already popularized<br>
      text, and should be used with<br>
      this in mind.</p>
      <p>Behind these raw facts, however, there lies a compelling and to some extent mysterious<br>
      drama. First and foremost, by the time the Slavuta Talmud first appeared,<br>
      the political conditions that had existed for the previous centuries were no longer<br>
      extant. The Polish-Lithuanian Commonwealth was destroyed by its three powerful<br>
      neighbors, Russia, Austria, and Prussia, in the partitions of Poland of 1772, 1793,<br>
      and 1795. Thus, the area in which approximately a million and a half Jews resided<br>
      was now annexed to the Russian Empire, the Habsburg Empire, and the growing<br>
      Prussian state. This political change, and especially the fact that now the largest<br>
      and most rapidly growing Jewish population in the world was under the control<br>
      of the Russian tsars, was to have far-reaching implications on all aspects of Jewish<br>
      life, including the history of Talmud publishing. At the very same time, the internal<br>
      life of east European Jewry was utterly transformed by the religious and spiritual<br>
      revolution brought about by the rise of Óasidism, which spread rapidly from its<br>
      origins and base in the Ukrainian lands to all other regions of eastern Europe,<br>
      including Congress Poland, Belorussia, and Lithuania. As is well known, even the<br>
      bans of excommunication levied against the òasidim by the rabbinic leadership of<br>
      Lithuanian and Belorussian Jewry, including the greatest talmudic authority of the age, Elijah Gaon<br>
      of Vilna (1720–1797), ultimately had little e√ect.</p>
      <p>Paradoxically, perhaps, the victory of Óasidism is evidenced by the fact that its opponents now<br>
      came to be called mitnagdim (opponents) by both groups, the clear implication being that Óasidism<br>
      was in late-twentieth-century parlance the default position of east European Jewry.4 </p>
      <p>4. This was entirely parallel<br>
      to the adoption, several<br>
      centuries earlier, of the term<br>
      “Protestant” by those who<br>
      rebelled against the Roman<br>
      Catholic Church. They were<br>
      first derided as those who protest—<br>
      the protestants—and<br>
      then came to call themselves<br>
      by this very same term.</p>
      <p>To what extent<br>
      Óasidism’s many theological and sociological innovations derived from or caused a diminution of<br>
      the role of Talmud study in traditional Jewish life has been a subject of scholarly analysis and debate<br>
      for more than a century.5 </p>
      <p>5. See the excellent collection<br>
      of articles on Óasidism<br>
      edited by Gershon Hundert,<br>
      Essential Papers on Hasidism:<br>
      Origins to Present (New York:<br>
      NYU Press, 1991).</p>
      <p>What seems clear is that two processes were taking place simultaneously,<br>
      which appear at first to be contradictory but were in fact actually complementary. On the one hand,<br>
      it is indisputable that the core of òasidic theology in its many manifestations and permutations<br>
      regarded mystical experience and theosophical teachings as the highest stages of religious life, leading<br>
      to the greatest goal of all, union with, or cleavage to, the divine. Most revolutionary was the possibility<br>
      that this salvific state could be reached by ordinary (though once again, only male) Jews, and<br>
      not simply by the elite that had throughout Jewish history studied not only the Talmud and other<br>
      halakhic works, but also mystical and esoteric Jewish texts. However, the rabbinical elite through the<br>
      centuries had clearly understood the danger posed by mystical exegeses of the Bible and other sacred<br>
      texts. Teachings that asserted that the meaning of a word or the fulfillment of a commandment were<br>
      to be found not in their obvious definition or performance, but rather in their esoteric interpretation<br>
      or motivation, could undermine the very foundations of rabbinic civilization, leading to nonnormative,<br>
      and even antinomian, behavior. Therefore, they limited the study of Kabbalah and the<br>
      performance of mystic rites to those already ensconsed within the talmudically-trained elite. Even<br>
      then further guidelines were established permitting access to this realm of knowledge only to those<br>
      who were, among other things, married and over forty years old. Thus, the very core of the òasidic<br>
      revolution, the popularization of kabbalistic study and mystic observance, not only departed from<br>
      previous traditions, but also invariably led to a diminution of traditional talmudic study in òasidic<br>
      Judaism. “Talmud Torah,” as previously understood, hardly remained “ke-neged kulam.” This displacement<br>
      of the ontological status of Talmud study has often been misunderstood or deliberately<br>
      mischaracterized as a “democratization” of Judaism. Not only was the concept<br>
      of democracy unknown to the leaders of Óasidism (and extraordinarily di¥cult,<br>
      if not impossible, to conceive of in regard to women), it was also utterly belied by<br>
      perhaps the central tenet of Óasidism. This core sociological innovation was the<br>
      belief that there was a special type of Jew, the tzaddik, who by divine selection was<br>
      empowered with extraordinary supernatural powers and wisdom unobtainable to<br>
      the average man. Indeed the role of the tzaddik was precisely to serve as spiritual<br>
      master to ordinary Jews, who were charged with emulating, as far as was possible,<br>
      their master’s teachings and actions. Crucial was the fact that these teachings did<br>
      not need to be, and generally were not, based on talmudic or other rabbinic texts<br>
      expertly interpreted. Many òasidic masters were not, and never pretended to be,<br>
      talmudically trained; and many were never ordained as rabbis, as opposed to their<br>
      charismatic status as “rebbes.”</p>
      <p>As Óasidism spread and conquered vast segments of east European Jewry, it became as much a<br>
      part of the “establishment” of east European Jewry as rabbinic Judaism, and not surprisingly, its<br>
      more radically kabbalistic and anti-intellectual trends were significantly muted. Indeed, the appearance<br>
      of the Slavuta Talmud in 1791 already signaled the possibility of the intersection of Óasidism<br>
      and Talmud study. Not only was Slavuta located in the heart of the overwhelmingly òasidic Ukraine,<br>
      but the founder of this press, Moses Shapira, was the son of the great òasidic master, Rabbi Pinòas<br>
      of Korets (1726–1791), who himself hailed from the more rationalist north but soon became one of<br>
      the most devout and enthusiastic adherents and masters of the new movement. It was only natural<br>
      for the Slavuta press to publish, alongside the Talmud and other halakhic, homiletic, and liturgical<br>
      works, hundreds of òasidic titles, covering the entire spectrum of òasidic genres, from simple (or<br>
      seemingly simple) tales of rebbes to the most arcane and esoteric mystical texts, including the Zohar.<br>
      This extraordinary publishing e√ort contributed, in turn, to the popularization of òasidic beliefs<br>
      and practices, including the acceptance by a large proportion of east European Jews of the so-called<br>
      Lurianic liturgy (Nusaò ha-Ari), spread through the publication of prayerbooks. In and of itself,<br>
      this liturgical departure from the centuries-old traditions of Polish-Lithuanian-Ukrainian Jewry was<br>
