      <p>There is a historical account of how the previous Talmud was produced by the Romm family in ~Vilna, Lithuania, during the early 19th century.</p>
      <p>This is published at the end of the 20th volume in the Hebrew language, known appropriately as the "Acharit Davar", which means "The Latter Matter".</p>
      <p>Recently, scholars by their own perception have suggested a fantasy account of these matters which contradicts those which are reported by the children of the publishers themselves in the English language. These so-called scholars assume that their readers do not study the Talmud in its original, not even read Hebrew. As a result, they advance their nonsense as if were a great work of scholarship.</p>
      <p>In my view, these so-called scholars harm both the stature of modern scholarship, and their very intelligent readership.</p>
      <p>I think the very first step of true scholarship about the history of the printing of the Talmud in Vilna, Lithuania, is read the writings of the account printed by the Romm family, in the Romm Vilna Talmud.</p>
