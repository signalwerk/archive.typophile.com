      <p><a href="http://www.yivoencyclopedia.org/printarticle.aspx?id=2210" title="http://www.yivoencyclopedia.org/printarticle.aspx?id=2210">http://www.yivoencyclopedia.org/printarticle.aspx?id=2210</a></p>
      <p><a href="http://www.yivoencyclopedia.org/article.aspx/Romm_Family" title="http://www.yivoencyclopedia.org/article.aspx/Romm_Family">http://www.yivoencyclopedia.org/article.aspx/Romm_Family</a></p>
      <p>Romm Family</p>
      <p>When Yosef Re’uven died, his eldest son, David (1825–1860), inherited the business, though the title pages continued to use the phrase “In the Printing Shop of Yosef Re’uven Romm.” In 1858, publication of a new edition of the Talmud was begun by the Shapira family in Zhitomir; a year later, David Romm also began publication of an edition of the Talmud. The Zhitomir edition was completed in 1864; the Romm edition in 1866. Sales of the latter proceeded slowly. After David’s death, his widow, Devorah (d. 1903), began to manage the company, assisted at first by her scholarly father, Yosef Betsal’el Harkavy (d. 1864). The company’s income was divided among Devorah, who received 40 percent, and David’s brothers, Ḥayim Ya‘akov and Menaḥem Gavri’el, who each received 30 percent. (Menaḥem also took over the Russian-language printing business when the Russian authorities demanded the separation of the Russian and Hebrew printing operations, for purposes of taxation and so that the government could more easily control the number of books published.) From 1871, the title pages of books published by the company carried the words “The Printing House of the Widow and the Brothers Romm” (see image at left).</p>
      <p>Alexander II rescinded the limitations on Hebrew printing in 1862: in exchange for an annual tax of 20 rubles for every manual printing press, the industry was open to all. (For rapid, steam-driven presses, the price was 120 rubles for a small press, 240 for a large one.) Three former Romm employees thereupon opened their own, rival press in Vilna together with Shemu’el Fuenn. Fuenn wanted to print Haskalah literature, but the production of daily and holiday prayer books—in direct competition with the Romms—proved more lucrative. In response, the Romm house, which was on a firm financial footing, lowered the prices of their books almost to their cost. Thus, the price of the prayer book Korban Mosheh was reduced from 2.5 rubles to 0.5 rubles. Romm also began to print Haskalah books, but these generally had poor sales.</p>
      <p>Competition with rival printers in Vilna, however, did less harm to the Romm firm than an internal rivalry that broke out in 1866 between the brothers and Devorah. Eventually the business was divided among them, and it dwindled considerably in importance. Devorah turned to Feigenzohn in 1867 and asked him to take over management of the firm. He worked to resolve the differences among the owners and simultaneously to overhaul and modernize the technologies and procedures. Feigenzohn introduced stereotype printing, the process by which pages are cast in sheets of lead, making it possible to preserve editions of books and reprint them rapidly if demand arose without having to set the text in type again. He traveled to Berlin to buy the new machinery and hired professionals to operate it. A six-week strike by typesetters, alarmed at the prospect of losing their jobs, was resolved by means of an increase in their salary.</p>
      <p>Feigenzohn also worked to overcome the obstacles posed by the censor—at that time, the convertIakov Brafman—by providing him with a regular “salary,” in exchange for which Brafman would examine every book intended for publication before it was printed. Feigenzohn introduced the policy of proofreading material three times to ensure the accuracy of the texts. Books were redesigned to attract buyers, and a policy of acquiring exclusive rights to publication was put in place.</p>
      <p>Feigenzohn directed the project of what came to be known as the Vilna Talmud, a production characterized by scrupulous proofreading and the addition of many variant readings and commentaries. At his behest, manuscripts held by various libraries were copied in order to add early, previously unpublished commentaries to the new edition. At the height of its production, more than 100 printers and 14 learned proofreaders were involved in the project.</p>
      <p>There was a substantial response to the appeal for subscribers in the fall of 1879. Demand for the new edition was so great that 22,000 copies of the first volume were sold in the first year (1880). Sales were hindered by pogroms in southern Russia the next year and by fires that damaged the plant and books in the warehouses. A decline in the number of subscribers and sales ensued, but there were still 13,000 subscribers when the final volume was printed in 1886.</p>
      <p>Menaḥem Gavri’el transferred management of the Russian-language press to outside administrators in 1901. When the new managers gave printing materials to revolutionaries, the authorities became aware of the practice. Badly frightened, Menaḥem Gavri’el sold the Russian part of the business for a pittance.</p>
      <p>After Feigenzohn left the printing house in 1888, it had gone into a period of decline, producing just a single new edition, the prayer book Kolbo (1895). Subsequently, Feigenzohn resumed management of the firm in 1903, the year of Devorah’s death. At the time of his return, the printing house held thousands of folio pages of the most important canonical works in stereotype, 15 presses were still in operation, and the firm held the rights to print classics of Jewish literature. What it lacked was capital.</p>
      <p>A small investment came from Bentsiyon Aharonovitsh, who financed the printing of several orders of the Mishnah, but more than his assistance was needed. At a meeting of Jewish leaders in Saint Petersburg, the rebbe of the Lubavitch Hasidic movement, Shalom Dov Ber Shneerson, horrified at the prospect of the closure of the Romm house, persuaded Baron David Gintsburg to rescue the shop, and Gintsburg invested 75,000 rubles. Feigenzohn paid the debts of the firm, but additional backing dissolved when Gintsburg died in 1910. World War I caused a further decline in the firm’s fortunes, and it passed into the hands of its creditors, who operated it until 1940. - this needs a proven source because it contradicts many established facts.</p>
      <p>The importance of the Romm press in the cultural history of the nineteenth century cannot be overstated. During its existence, the Romm printing house published more than 1,400 books in both Hebrew and, to a lesser extent, Yiddish, in a variety of literary genres. Books devoted to Kabbalah andhalakhah appeared alongside the novels of Avraham Mapu and the stories of Ayzik Meyer Dik. Romm published Yitsḥak Ber Levinzon’s prolegomenon, Igeret ha-besorah (1824), to his extended program for the reform of Jewry, Te‘udah be-Yisra’el (1827, 1856). ‘Azaryah dei Rossi’s sixteenth-century translation into Hebrew of the Letter of Aristeas (Greek, second century BCE) was printed in 1818 and entitled Haderat zekenim. Translations from world literature into Hebrew and Yiddish soon followed. The first of these was a translation of the journal of a seventeenth-century Dutch traveler to the Far East, W. Bontekoe, into Hebrew, apparently by Menaḥem Mendel Lefin, Oniyah so‘arah (1823), published together with a translation of one of Joachim Heinrich Campe’s works, Masa‘ot ha-yam, byMordekhai Aharon Gintsburg. The latter’s translation of Campe’s Masa‘ Kolumbus was published the same year, but the name of the publisher did not appear on the title page. A year later, Romm published Gintsburg’s Yiddish translation of the same work.</p>
      <p>Romm published Sefer ha-berit by Pinḥas Eliyahu Hurwitz (1765–1821) in 1818. This was an idiosyncratic, encyclopedic work combining philosophical and kabbalistic topics with reports on scientific discoveries. It was an important source of scientific information for many readers who knew only Hebrew and Yiddish. Much farther from normative literature was the introduction to algebra,Mosde ḥokhmah by the maskil Ḥayim Zelig Słonimski (1834). Much of the Haskalah literature failed to find a wide market, often remaining unsold.</p>
      <p>The Romm house continued to print rabbinic literature alongside works calling for reform. Several collections of the teachings of Eliyahu, the Gaon of Vilna, were printed as well as a number of editions of Ḥaye adam (1810, 1819, 1834), the popular halakhic work by Avraham Danzig. All this was in addition to canonical works such as the Talmud and the Shulḥan ‘arukh, prayer books, and Pentateuchs.</p>
      <p>Romm printed some Yiddish books as well, including Eli‘ezer Paver’s Gdulas Yoysef, which they reprinted several times (1817, 1822, 1833). Tkhines were published in Tikun shelosh mishmarot(1833). A complete list of Romm publications would reflect well the trends and cultural developments of East European Jewry in the nineteenth and early twentieth centuries.</p>
