      condemning the òasidim as obscurantist and dangerous fanatics. Indeed, in the second quarter of the<br>
      nineteenth century it was often di¥cult to distinguish between mitnagdim and maskilim, and this<br>
      confusion was especially important in the realm of access to printing presses and publishers.<br>
