    <p>The ancient Talmud is as old as the Jewish Bible. According one of the greatest thinkers of all times, the Talmud actually corresponds to the Bible, and explains to us the meaning of the very words and innuendos.</p>
    <p>Maimonides writes this in the Introduction to his final work, called: משנה תורה, which means a concise review of everything found in the Torah, or Bible.</p>
    <p>During his generation, Maimonides was cast as a heretic for suggesting that his work could an easy to read summary of the encyclopedic Talmud. Later, all his writings, from medical, philosophical, mathematical, and Talmudic, were recognized until this very day as truthful, unrefutable, and utterly amazing. Few humans that have walked this earth can compare to Maimonides, including, Jesus, Einstein, and contemporary Jewish leaders.</p>
    <p>Getting back to the Talmud, the Talmud is consideration the most profound wisdom of the Jewish people, being comprised of the writings and teachings of the most brilliant 1% of Jewish leaders of all times.</p>
    <p>Even the very great reconstructionist, reform, conservative, or even modern Orthodox have never made it into the Talmud. They simply are not great and profound enough to fit into the ranks of the Talmud's greatest 'stars'.</p>
