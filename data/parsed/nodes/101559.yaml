      existing Hebrew presses in the Empire as a means of better controlling the obviously fractious Jewish<br>
      population. The monopoly on Hebrew (and Yiddish) publishing was then assigned to two publishing<br>
      houses, one in Vilna and one in Kiev, to service the mitnagdic-cum-maskilic north and the òasidic<br>
      south.6 </p>
      <p>6. On this decision, as well<br>
      as the overall policy of the<br>
      Russian government regarding<br>
      the Jews, see my Tsar<br>
      Nicholas I and the Jews: The<br>
      Transformation of Jewish<br>
      Society in Russia, 1825–1855<br>
      (Philadelphia: Jewish<br>
      Publication Society, 1983).</p>
      <p> These monopolies were to be funded by a bidding process in which the winning firm would<br>
      agree to pay a stipulated tax to the government, raised from the already existing candle and koshermeat<br>
      taxes, as well as by tari√s on Hebrew and Yiddish books imported from abroad. Since the<br>
      reading audience of east European Jews was enormous—the population grew from one and a half<br>
      million in 1800 to approximately six million by the end of the century—obtaining these monopolies<br>
      was a guarantee of very substantial income. Not surprisingly, the Vilna monopoly was successfully<br>
      bid for and obtained by the Romm family. However, all was not well for this family, as their plant<br>
      burned down (for reasons unknown) in 1840. Nevertheless, the brothers Romm (now led by Yosef<br>
      and then by his son David) persisted and rebuilt an even larger and more modern publishing house.<br>
      David Romm died in 1862, and his place was taken, rather remarkably for this patriarchal society,<br>
      by his widow Deborah. The name of the firm changed to the “Widow and Brothers Romm.”</p>
      <p>Meanwhile, in the south, the site of the one legal Hebrew publishing house was<br>
      quite sensibly moved by the government from Kiev, which at this time had a very<br>
      small legal Jewish population due to the restriction of Jewish settlement in the<br>
      city. It was moved to Zhitomir, which was far more central to the huge Ukrainian<br>
      Jewish population and, not coincidentally, the site of the second governmentsponsored<br>
      Rabbinical Seminary (the first was in Vilna). Given this de facto connection<br>
      between the Rabbinical Seminary and the projected publishing house,<br>
      the prospect of entering into a formal relationship with the Russian government<br>
      was anathema to the òasidic leaders. The Seminary’s book publishing needs were su¥ciently met<br>
      by the Hebrew presses across the various borders in Warsaw, Lemberg, and Czernowitz, where new<br>
      editions of the Talmud were printed as well.</p>
      <p>However, none of these editions could compete with the Vilna Shas, which soon added commentaries<br>
      that only increased its centrality to traditional Jewish learning across the world. The last<br>
      edition of the Vilna Talmud was published in 1897—the year in which the Zionist movement was<br>
      founded in Basle, Switzerland, and the Jewish Labor Bund was founded in Vilna. Clearly, eastern<br>
      European Jewry had entered a new phase of its history, during which traditional Judaism, whether<br>
      mitnagdic or òasidic, had to fight an uphill battle against the forces of modernity. After the death<br>
      of the “Widow Romm” in 1903 and the emigration of three of her sons to New York, the Romm<br>
      press continued to function. The remaining heirs had no interest in continuing in the publishing<br>
      business, however, and the press was sold in 1910 to Baron David Guenzburg, the learned scion of<br>
      the richest and most powerful Jewish family in the Russian Empire. For the next three decades the<br>
      firm still called “The typography of the Widow and Brothers Romm” continued to publish Hebrew<br>
      and Yiddish books, both traditional and modernist, until it was destroyed in 1940 in the Soviet<br>
      occupation of Vilna.</p>
      <p>Through these turbulent times, as the Romm Talmud’s plates and templates were transferred both<br>
      to the Land of Israel and to the United States,7 </p>
      <p>7. See Yahadut Lita (n.1 above).</p>
      <p>the Vilna Shas retained its centrality throughout the<br>
      Jewish world, still referred to and honored by its original site of publication, the<br>
      “Jerusalem of Lithuania.”</p>
