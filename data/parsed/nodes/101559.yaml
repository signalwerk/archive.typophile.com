      <p>Note: Many hundreds of different editions of the classic Babylonian Talmud were published over the years since the conclusion of World War II.</p>
      <p>The largest in size is known as the "Chosen Shas", named after the very old custom for the father of the bride to gift a large beautiful set as a wedding gift to his new son-in-law. There are many other smaller sets used by yeshiva students, and other adults in their Talmud studies. Not all of these smaller sets have included the "Acharis Davar", written by the Romm descendents, cited earlier.</p>
      <p>Perhaps, in their jealous research, this important document was neglected by honest error, and not by intentional rewriting of history, as I earlier suspected.</p>
      <p>I found most questionable in this information presented as factual is that much of it, if not all of it, is composed and published long after the events occurred. If so, are they not theories and speculations, and not actual facts?</p>
