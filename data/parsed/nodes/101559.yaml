      European Jewry, from Vilna in the north, Warsaw in the center, and Odessa in the south. Of these<br>
      Hebrew publishers, only one dared to confront the Slavuta press on its most prestigious turf, the<br>
      publication of the Talmud. In 1789, the Romm press was founded in Grodno (its actual plant was<br>
