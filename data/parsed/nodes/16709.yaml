    <div class="info">Submitted by <a href="/user/1085" title="View user profile.">dan_reynolds</a> : 9.Dec.2005 12.20am </div>
      <p><strong>Linotype’s LinoLetter for December 2005 – What to give a Type-Lover this Christmas</strong></p>
    <p>Check out the full version of this month’s newsletter at the Linotype website: <a href="http://www.linotype.com/8-38-8-19120/issue200512.html" title="http://www.linotype.com/8-38-8-19120/issue200512.html">http://www.linotype.com/8-38-8-19120/issue200512.html</a>.</p>
    <p><em>Content Preview:</em> Giving gifts is easy and fun! Presenting a special edition of our newsletter, just in time for Christmas. Inside this month’s issue, you’ll find a list of fonts, t-shirts, and other design-oriented gems that are sure to fit under any Christmas tree. Additionally, this is the season to get acquainted with two typographic treats: the all-new Palatino nova, a long awaited 21st Century version of Prof. Hermann Zapf’s Palatino, and Candice, a “groovy” font in the party style of the 70s.</p>
    <p><em>Just Completed:</em> The Linotype OpenType Library! Equip yourself and your computer with over 2500 top-of-the-line OpenType fonts, and be prepared for any design task the<br>
    future holds.</p>
    <p><a href="http://www.linotype.com/8-38-8-19120/issue200512.html">Read the rest of the Linoletter at Linotype.com!</a> </p>
    <p>Or, <a href="http://www.linotype.com/webshop/newsletter.php">subscribe to the Linoletter</a>, and get the information delivered every month directly to your mailbox.</p>
