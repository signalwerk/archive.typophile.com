    html: |-
      <p>It has a <a href="http://www.linotype.com/13775/itcfranklingothicbookcondensed-font.html" rel="nofollow">Book Condensed</a> weight. Maybe that is light enough for you? Are you looking for a lighter weight to pair with that?</p>
      <p>Here is a link to the whole ITC Franklin Gothic family, which has 20 parts: <a href="http://www.linotype.com/655/itcfranklingothic-family.html" title="http://www.linotype.com/655/itcfranklingothic-family.html">http://www.linotype.com/655/itcfranklingothic-family.html</a></p>
      <p>Quite similar to that is <a href="http://www.linotype.com/89881/lightlinegothic-family.html" rel="nofollow">Lightline Gothic</a>, also originally by <a href="/wiki/Morris%20Fuller%20Benton" class="freelinking" rel="nofollow">Morris Fuller Benton</a>. It looks both Light and Condensed to me. Maybe it'd hit the spot?</p>
