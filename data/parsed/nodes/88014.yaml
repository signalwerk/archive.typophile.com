      <p>"Firefox mobile on Android now supports WOFF fonts for @font-face"<br>
      <a href="http://hacks.mozilla.org/2011/06/firefox5/" title="http://hacks.mozilla.org/2011/06/firefox5/">http://hacks.mozilla.org/2011/06/firefox5/</a></p>
