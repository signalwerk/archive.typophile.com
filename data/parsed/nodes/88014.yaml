  html: |-
    <p>1.<br>
    I refer to <a href="http://en.wikipedia.org/wiki/Web_Open_Font_Format" title="http://en.wikipedia.org/wiki/Web_Open_Font_Format">http://en.wikipedia.org/wiki/Web_Open_Font_Format</a>.   I am not getting the Web Open Font Format on my Android O/S mobile when I visit sites using Dolphin HD browser, Google browser or Opera Mini. The WOFF enabled font is not showing at the sites? </p>
    <p>2.<br>
    Also, UTF-8 feature is invisible (non-existent?) at these browsers except at Opera Mini though it requires a semi-code / semi-GUI instruction  <a href="http://www.google.com/support/forum/p/android/thread?tid=472dfbe3b320e8b5&amp;hl=en" title="http://www.google.com/support/forum/p/android/thread?tid=472dfbe3b320e8b5&amp;hl=en">http://www.google.com/support/forum/p/android/thread?tid=472dfbe3b320e8b...</a><br>
    "(1) Type "config:" in the address bar and then press "Go"</p>
    <p>(2) Turn "Use bitmap fonts for complex scripts" to  "Yes""</p>
    <p>Should not UTF-8 be the standard and default in all browsers because internet is meant to be global and should span other languages?</p>
  html_clean: |-
    <p>1.<br>
    I refer to <a href="http://en.wikipedia.org/wiki/Web_Open_Font_Format" title="http://en.wikipedia.org/wiki/Web_Open_Font_Format" class="link-external">http://en.wikipedia.org/wiki/Web_Open_Font_Format</a>.   I am not getting the Web Open Font Format on my Android O/S mobile when I visit sites using Dolphin HD browser, Google browser or Opera Mini. The WOFF enabled font is not showing at the sites? </p>
    <p>2.<br>
    Also, UTF-8 feature is invisible (non-existent?) at these browsers except at Opera Mini though it requires a semi-code / semi-GUI instruction  <a href="http://www.google.com/support/forum/p/android/thread?tid=472dfbe3b320e8b5&amp;hl=en" title="http://www.google.com/support/forum/p/android/thread?tid=472dfbe3b320e8b5&amp;hl=en" class="link-external">http://www.google.com/support/forum/p/android/thread?tid=472dfbe3b320e8b...</a><br>
    "(1) Type "config:" in the address bar and then press "Go"</p>
    <p>(2) Turn "Use bitmap fonts for complex scripts" to  "Yes""</p>
    <p>Should not UTF-8 be the standard and default in all browsers because internet is meant to be global and should span other languages?</p>
