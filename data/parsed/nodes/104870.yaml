      <p>To me, looks like a custom job based on <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/handel-gothic/" rel="nofollow">Handel Gothic</a> (/e eye closed, /o redrawn from /d bowl and the all thing slightly extended then slanted). <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/handel-gothic" rel="nofollow">ITC</a>] has a version with italics but /a is off.<br>
      More alternatives: <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/ff-trademarker" rel="nofollow">FF Trademarker</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/domyouji" rel="nofollow">Domyouji</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/aspirin-advance" rel="nofollow">Aspirin Advance</a>, <a class="freelinking external" href="http://fonts.gestalten.com/category/display/traffic-wide.html" rel="nofollow">Traffic Wide</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/shyfoundry/sf-hypocrisy" rel="nofollow">Hypocrisy</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/zekton" rel="nofollow">Zekton</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/korataki" rel="nofollow">Korataki</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typeinnovations/axion-rx-14" rel="nofollow">Axion RX-14</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/snasm" rel="nofollow">Snasm</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/forgotten-futurist" rel="nofollow">Forgotten Futurist</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/vipnagorgialla" rel="nofollow">Vipnagorgialla</a></p>
