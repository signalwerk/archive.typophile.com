      <p>Hrant,</p>
      <p>Your thoughts have taken on a much larger scope than I was expecting! I'm caught agreeing with many of your assesments while simultaneously learning about them.</p>
      <p>An "I never thought about it that way before" sort of thing.</p>
      <p>As for trying to pass off gray pixel fonts as 1-bit fonts and vice-versa, that's not really my intention. I simply mean to say that creating a line of gray pixel fonts that take just enough edge off to improve themselves over their 1-bit cousins, while remaining true to their sharp, aliased roots might turn out to be an appealing solution for a big portion of the pixel font buying market.</p>
      <p>It is my intention to sell any gray pixel fonts I build for a higher price, and to differentiate them from my other product lines. This is why it is good for me to get any feedback I can on the prototypes. I want them to offer an increased value that will justify a higher price.</p>
