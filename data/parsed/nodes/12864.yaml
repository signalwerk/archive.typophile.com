    html: |-
      <p>Hrant,</p>
      <p>Thank you for giving such a thorough review of my samples. It's funny, the confusion you speak of concerning keeping track of shades and their *usage* is even lower for me than for you, which is one of the reasons why I've been trying to keep my grays to a minimum.</p>
      <p>Another reason, is due to the questionnaire feed back I've been getting. As you probably know, I offer free fonts in exchange for pixel font market feedback. There are many interesting trends I've discovered over the last year, and one of them is that an alarming number of people have said they would NOT purchase gray pixel fonts from MT should it start rolling them out.</p>
      <p>This says to me that designers are divided in what a pixel font's main purpose ought to be: clarity above all, or sophistication for small typefaces.</p>
      <p>So I've been trying to develop a style that would set my work slightly apart from the other gray pixel font artists, in that I'm trying to take "the edge" off of my pixel fonts while making them as reminiscent of "hard edged" pixel fonts as possible.</p>
      <p>It's a funny sort of line I'm trying to balance on in an effort to please everyone. I really don't have to, if you think about it, because I continue to develop so many traditional pixel fonts. Still, I like the idea of trying to create a series of gray fonts that will look gray to those looking for gray fonts, and black and white to those looking for black and white fonts.</p>
      <p>As for publishing, I simply meant that I've built these fonts in Fontlab and "exported" them to mac tt and pc tt and tested them in Flash and Photoshop. I don't have immediate plans to sell them, as a new web standards compliant MT store is on its way, and I see no point in investing any more energy into the existing Flash store.</p>
      <p>However, I am experimenting with my own production workflows for gray pixel fonts in light of UltraFonts recent shift in its stance over "ownership" of the technology. For that matter, I've been in recent talks with Jose, and it appears that new UF developers are low on his priority list. His system (as it exists now) won't work for many of my fonts anyway. I have some pretty big fonts.</p>
      <p>If you know more about UF's market position than I do, please feel free to let me know. The last written dialog I had with Chris was actually here on these boards, where he said that UF no longer laid claim to the technology, and was shifting its model to working with designers to further the technology as a whole.</p>
      <p>I design on the mac, and everything looks pretty good on my end. By that, I mean that they render successfully in Flash and Photoshop.</p>
      <p>It's pretty easy, really, to build them in Fontlab, but right now it's pretty time intensive, because I'm doing everything my hand and experimentation.</p>
