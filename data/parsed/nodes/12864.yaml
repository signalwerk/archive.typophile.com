      <p>Hey Tyler. Nice to see you venturing into such "bookish" territory!</p>
      <p>This is quite a light touch. Frankly I think a bit too light to justify the "technology difference" for the typical user. On my Windows setup there <strong>is</strong> an improvement compared to the 1-bit version, but it's at the textural level: it has a subtle softness, unlike the quite harsh 1-bit rendering. But on a Mac even that will be lost (since the gamma is flatter). So I would suggest moving a bit more towards stronger gray usage; in my experience it has to look a <strong>hair</strong> too blurry on Windows for the font to work optimally in the overall. That said, the basics of the design (especially the proportions) are well done.</p>
      <p>As for number of shades, I've found that there's only one reason to limit the number of shades used: controlling confusion on the designer's part! More than about 8 shades and I for one start forgetting what shade I'm supposed to use for what "task"*. But -as far as pixelfonts are concerned- there's no real reason to. If you're making embedded bitmaps though and you're worried about filesize, then you'd either go 2 shades (plus b&amp;w), or all the way to 6. In fact I think a bit depth of 3 might not even be supported (robustly), so your choice above 2 might be 14.</p>
      <p>* A bit hard to explain, that.</p>
      <p>BTW, when you say "publish", may I ask what channel you're using? I don't see this design on Ultrafonts. Are you using BitFonter to deliver "real" bitmap fonts (as opposed to pixelfonts)? If so, have you gotten that to work on MacOS? Or maybe you've figured out a custom way of (reliably?) rendering out the desired grays in a pixelfont, and are selling it yourself?</p>
      <p>hhp</p>
