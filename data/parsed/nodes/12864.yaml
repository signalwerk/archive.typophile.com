      <p>Yeah, I'm at a bit of a loss as to why Fontlab has gone to the effort to produce Bitfonter without really setting it apart in function from Fontlab.</p>
      <p>As it stands, I believe that Fontlab 4 with the Python pixel editor is a far more powerful, flexible system for building pixel fonts; especially when you consider the price difference (or lack thereof) between the two products.</p>
      <p>I agree that they should make Bitfonter either: a) more powerful that Fontlab when it comes to pixel font creation, metadata management, and file export flexibility, or b) cut the price quite a bit.</p>
      <p>And this is coming from someone who owns both programs. : )</p>
      <p>My copy of Bitfonter is collecting digital dust, whereas my Fontlab is shiny and well-worn.</p>
