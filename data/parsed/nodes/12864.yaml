    html: |-
      <p>Yes, there certainly are a lot of viewpoints out there, some of them quite strange! On one extreme you have the bitmap purists who like to stick to the ideology of Work With The Medium - a fine sentiment, as long as it doesn't become a barrier to improved functionality; and the Medium, after all, does support shades of gray! On the other extreme you have the print-centric artistes who don't care how goddam blurry it looks as long as it's "my darling Futura" or whatever their pet font (or flavor of the week) is. But there are also a whole swath of people (I think the majority) who simply need to be provided with: good quality products; and good examples of the new benefits. If you leave it to their imagination to decide if something new is useful or not, they'll just revert to their favorite little ideologies to strike down something new, and thereby feel more in control. There are few people out there who know in advance that there's room for improvement, and are willing to give new things a try with little prompting.</p>
      <p>So in this design you're trying to deliver grays sort of under your clientele's radar? I guess that's better than nothing. But I think a thorough exposition of the benefits of grayscale pixelfonts -which has yet to be done- would convert a chunk of people, at least among those who don't feel smugly confident (read: insecure) about their pre-existing design decisions/philosophy. But always remember: just like in the outline font realm, there are mass-market fonts, and there are fonts that can only appeal to an astute minority. The latter are willing to pay more for greater quality, and this is where you can make up the smaller number if cutomers. And this is why -or at least one big reason- grayscale pixelfonts sell for more money. In contrast, it's much harder to sell 1-bit pixelfonts (all things being equal). My hunch is that something in between will end up appealing to neither group, or at least not appealing in the right way to make money; after all, you can't charge more for the people who realize the benefits of grayscaling!  :-)</p>
      <p>As for UF: things have changed (again, and in more than one way) since Chris wrote that on Typophile... But in any case I'm not privy to the inner working of UF.</p>
      <p>hhp</p>
