    html: |-
      <p>The two closest typefaces I can think of would be Verona (Stephenson Blake, 1948 - but based upon a 1904 typeface) and Motto (Morris Fuller Benton, 1915).</p>
      <p>Verona is the best, but the only digital version I'm aware of was made by Mike Allard back in 1992. His fonts are <a href="http://www.moorstation.org/typoasis/designers/denada/dn1.htm" target="_blank" rel="nofollow">collected at TypOasis</a>. Unfortunately, when he sent his fonts to TypOasis, he seems to have forgotten his version of Verona - which he called RomeoDN ("I think that’s all I've released... I haven’t been keeping good track!").</p>
      <p>I'll send a copy of RomeoDN to Petra, who owns TypOasis. Hopefully, it will appear there before long.</p>
      <p>There are two versions of Motto that I'm aware of. One is <a href="http://www.moorstation.org/typoasis/designers/lloyd/index.htm" target="_blank" rel="nofollow">Paul Lloyd's</a> Queen Empress. The other was digitized by Dan Solo and is available as Motto on the Dover <a href="http://store.doverpublications.com/048699502x.html" target="_blank" rel="nofollow">24 Calligraphic Display Fonts CD</a>.</p>
      <p>Lastly, there's Ray Larabie's <a href="http://www.myfonts.com/fonts/typodermic/mikadan/" target="_blank" rel="nofollow">Mikadan</a>. This is sort of a hybrid of the two typefaces. The advantages are that Mikadan is technically better made than the rest and more readily available.</p>
