    votes: null
    html: |-
      <p>This U is not a letter per se but a german abbreviation for pound. it's form is derived from lb (the abbrebiation of librum (latin for pound)).<br>
      as in Germany the non-metric units were banned in the 70's you can find this sign no more.<br>
      but I remember it well fom my school days.</p>
