  - id: 188003
    user: 12428
    date: 2007-02-27T14:31:00
    date_raw: 27 Feb 2007 — 2:31pm
    votes: null
    html: |-
      <p>As soon as you say it is an lb ligature suddenly it leaps<br>
      out at me. I had thought it overturned because as an N it<br>
      has a peculiar one-sided serif on the right foot, this<br>
      looked more natural to me as the left beak of a U. </p>
      <p>Frege used overturned characters extensively. There are<br>
      overturned f's and d's with hooks attached, e's and c's with<br>
      a kind of spur on top, and an overturned A denoting the<br>
      paradoxical Russell set -- the set of all sets which are<br>
      not members of themselves.</p>
      <p>Thanks everyone for the comments.</p>
