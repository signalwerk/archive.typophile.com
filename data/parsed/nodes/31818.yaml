    <p>Hi all -- any ideas about this fancy U from (at latest) 1895?<br>
    It was originally used rotated as notation by Frege in his<br>
    Grundgestze der Arithmetic (Jenna, Germany).</p>
    <p>Thanks, Jim</p>
