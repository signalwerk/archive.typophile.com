    votes: null
    html: |-
      <p>When I invert the image it looks like an N. Upper case N's in some 19th century typefaces did look like large cursive/italic n's. I did find one typeface with a recurved swash on an N, but it didn't go through the letter like this. I didn't find any U's that were like it at all.</p>
      <p>- Mike Yanega</p>
