      <p>It could be a "script" letter.</p>
      <p>In Mathematics, script letters have particular meanings, like script L for Laplace transform or script H for Hamiltonian operator. See <a href="http://www.unicode.org/charts/PDF/U2100.pdf" title="http://www.unicode.org/charts/PDF/U2100.pdf">http://www.unicode.org/charts/PDF/U2100.pdf</a> for some examples. I couldn't find any script N, though.</p>
  - id: 187900
