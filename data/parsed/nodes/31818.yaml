  - id: 188893
    user: 16548
    date: 2007-03-03T11:38:00
    date_raw: 3 Mar 2007 — 11:38am
    votes: null
    html: |-
      <p><cite>"this looks like an antiquated version of the “pound” sign. unicode ID # 2114. also known as the “number sign”. as in #."</cite><br>
      Ch, This symbol is actually called an Octothorp, otherwise known as the numeral sign. It has also been used as a symbol for the pound avoirdupois but this usage is now considered archaic. It's name derives from its cartographic use as the symbol for a village (eight fields surrounding a square) as it literally means 'eight fields'.</p>
