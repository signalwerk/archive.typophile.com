      <p>Yes, it was used upside down (rotated 180 degrees), with the<br>
      upper left beak looking like a right serif on the right<br>
      foot. As used, the feet descended, but the bowl reached only<br>
      to x-height.  It may have been a lower-case letter at a larger<br>
      point-size, but my guess is that it's a capital.</p>
  - id: 187852
