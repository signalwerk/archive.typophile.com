      <p>I'm a bit dubious about the solution the original poster came to, using a bitmap font. This has at least a couple of issues:</p>
      <p>- the bitmap will be RGB-only (no spot colors or CMYK)</p>
      <p>- it won't be color-managed</p>
      <p>- being pixel-based, it won't scale well to arbitrary high resolutions, so not so great if somebody needs to get something professionally printed.</p>
      <p>Cheers,</p>
      <p>T</p>
