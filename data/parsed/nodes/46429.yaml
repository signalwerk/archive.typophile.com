      <p><em>there are too many sites selling it for it not to work</em></p>
      <p>Yes, but notice that <a href="http://www.signature-fonts.com/logo_fonts.asp" rel="nofollow">they say</a>:</p>
      <p>"Logo Fonts are Easy to use:</p>
      <p>- Select the font name from your program's font menu<br>
      - Assign any point size (large or small) for a truly scalable signature<br>
      - <strong>Assign any color to your logo (as your program allows)</strong><br>
      - Type in your pre-selected keyboard strokes to place your logo in your document<br>
      - Can also be used in most graphics-based programs"</p>
      <p>So the user still has to select the color. And they have even <a href="http://www.signature-fonts.com/logo_font_instructions.asp" rel="nofollow">more specific instructions</a>:</p>
      <p>"Multi-Color Logo Font Usage:</p>
      <p>1. Once the font has been installed, open the program you intend to use the logo font in, such as a word processer or graphics program.<br>
      2. When you have come to the place in the document or image in which you wish to place the logo, select ANY font other than your logo font and type in the numbers 1 thru 7 (1 2 3 4 5 6 7 -- do NOT include spaces). Assign a point size of "120 points" for your first test. There are 7 different color elements in this particular color-logo-font, and we need assign a different color to element (number) that you typed.<br>
      <strong>3. Highlight each character one at a time and assign a different color to each one. Once all 7 numbers have been assigned a color, hightlight all 7 numbers by dragging your curson across them.</strong><br>
      4. Once the 7 numbers are highlighted, open the font selection tool and scroll down through the list of fonts until you find "YourLogo", and then select.<br>
      5. Your multi-color logo will now appear in your document."</p>
