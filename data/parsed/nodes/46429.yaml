      <p>10. One can store as many versions of a logo localized for international uses, brand uses or to address design-branching uses in a single font-based logo.<br>
      9. One can store as many versions customized for color, size and use, etc., in a single font-based logo.<br>
      8. Font-based logos can be sized to automatically scale, space and locate vertically to any one, or more type font(s).<br>
      7. The contours of font-based logos are available directly to users, to modify 'inking' options for print and screen.<br>
      6. Nearly all apps that allow skewing, rotation, perspective, etc., yield superior results with font-based logos, important for planners.<br>
      5. The font-based logo font name is usually 'CompanyName'Logofont, making detection simple to all.<br>
      4. Font-based logos, (when used outside of ClearType), deliver a single (virgin) rendering from contour to a bitmap localized for a client's  or client's client's display space. No bitmap or other double rendering can compare for fidelity.<br>
      3. Font-based logos are a manageable database from which one can make sub font-based logo fonts.<br>
      2. One can take advantage of all the possibilities listed above, chuck it all, and make an image file with the font-based logo for any reason at any time.<br>
      1. or one can combine the options above and store, what would be a pile of image-based  logos, instead, in documents of all kinds, from CAD to HTML, in the form of keystrokes and application treatments.<br>
      0. You can hint a font. </p>
      <p>It's up to the use and user. If: lemonade stand for siss, eps. If Else: beware.</p>
      <p>Cheer!</p>
