    html: |-
      <p>Easier than zero width is to have all on same width and build kerning tables to pull the parts together. That way, by turning off kerning, you can more easily select the individual elements for coloring; then turn kerning back on to pull the pieces together into the composite logo.</p>
      <p>(This technique depends upon inputting the individual elements in a consistent order, or else covering all possible combinations in the kern table.)</p>
      <p>-- K.</p>
    html_clean: |-
