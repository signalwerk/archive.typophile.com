  html: |-
    <p>Type designer Chank Diesel and yours truly will be taking part in the "Cross Talk" event held at the Minneapolis Institute of Arts this Thursday (Jan. 12, 2012) at 6pm. </p>
    <p><a class="freelinking external" href="http://www.artsmia.org/index.php?section_id=9&amp;ev_id=4276" rel="nofollow">Here's a link to the MIA event page</a> with more information.<br>
    And <a class="freelinking external" href="http://chank.posterous.com/crosstalk-what-fonts-say-at-mia-on-january-12" rel="nofollow">here's the cool poster for the event</a> designed by Anne Ulku. Tickets are available online, or at the event.</p>
    <p>Chank will be talking about his own work and I will be quickly surveying the sources of inspiration for type design over the centuries. Then most of the time is devoted to an unscripted conversation and q-and-a about type following our presentations.</p>
    <p>I'm looking forward to it, and I hope to see a few of you there!</p>
