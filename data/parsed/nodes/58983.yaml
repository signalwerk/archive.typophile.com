    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Proofing_Press_Beauty_Makeover_6231.gif"></div><p></p>
    <p>The two engraving proofing presses previously written about (here) are going up to Alexandria, LA for a beauty makeover.</p>
    <p>While John (hubby) and Ken (friend) work on the presses tomorrow in Ken's shop, I will be going back over to James Gabour's printing facility in Pineville.  Meeting us there will be the new archivist from the LSU AgCenter in Alexandria.</p>
    <p>James senior may have to close the plant and— as much as possible—I (we) want to help preserve the contents and printing history in his shop.</p>
    <p>The AgCenter can only take records (paper), no ephemera, no equipment and there is plenty of everything.  Loyola University New Orleans graphic design department is interested in taking some, VERNA, a local letter press shop  will probably take the letter press equipment and types, there loads of wood type as well.  Jeff Pulaski, graphic design professor up in Witchita, may also help with the dispensation of the rest.  Here are links to the good folk who are helping:</p>
    <p><a href="http://cmfa.loyno.edu/faculty/daniela-marx" title="http://cmfa.loyno.edu/faculty/daniela-marx">http://cmfa.loyno.edu/faculty/daniela-marx</a><br>
    <a href="http://www.1dayofart.com/content/tag/daniela-marx/" title="http://www.1dayofart.com/content/tag/daniela-marx/">http://www.1dayofart.com/content/tag/daniela-marx/</a><br>
    <a href="http://vernapress.com/peter.html" title="http://vernapress.com/peter.html">http://vernapress.com/peter.html</a><br>
    <a href="http://www.outofsortspress.com" title="http://www.outofsortspress.com">http://www.outofsortspress.com</a><br>
    <a href="http://nancysharoncollinsstationer.wordpress.com/" title="http://nancysharoncollinsstationer.wordpress.com/">http://nancysharoncollinsstationer.wordpress.com/</a></p>
