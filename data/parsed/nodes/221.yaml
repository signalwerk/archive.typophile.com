    html: <p>In general, Andreas, I think they do have the correct flavor. I think they need some spacing work. I'd say that all of the "boxes" need to be the same dimension. They feel hand-drawn, which is nice, not overly type-ified. No. I wouldn't call them trash. I think they have potential. <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
