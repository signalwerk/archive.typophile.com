    html: <p>1 point for cash, thanx Tiffany. <br> <br>To the spacing issue, him, I only had a single glyph usage in mind, like initials truly designed for. You can set words too, but then you get the "Art Nouveau" feeling.  <br> <br>Someone said to me, "It`s worse enough for a t-shirt."  <br> <br>Hope some other readers have opinions too, so please punish me! ;-)</p>
