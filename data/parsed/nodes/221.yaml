    user_name: Miss Tiffany
    user_path: null
    user_image: /files/pictures/picture-108.png
    date_raw: 23 May 2003 — 12:54pm
    date: 2003-05-23T12:54:00
    votes: null
    html: <p>In some of the characters, if they are in fact authentic, they seem derivative from the Art Nouveau, and in some instances William Morris. I suppose what comes around goes around and perhaps that might be my eyes seeing them in that way. However...</p>
