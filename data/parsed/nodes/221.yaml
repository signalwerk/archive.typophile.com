    html: <p>Yes, Schade. But why develop/release a dead thing? The font is ready like on the sample.  <br> <br>Sources, J.J.G.Alexander have written some nice books about medieval typo &amp; art. His work is available in german and english too. <br> <br>For ornamental stuff have a look for old specimen books around 1900, and earlier. For true native stuff you have to study old handwirtten scripts. </p>
