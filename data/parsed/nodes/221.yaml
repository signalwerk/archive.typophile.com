    html: <p>Before I talk about the sources (they come from different ones) I like to hear some opinions. <br> <br>They are drawn as a initials for a script face. But I have some reason to reject it from this project.  <br> <br>The concept was not to add historical true "14th" initals, but initials look a like. I dropped away all the floral, pictural &amp; oranmental stuff.</p>
