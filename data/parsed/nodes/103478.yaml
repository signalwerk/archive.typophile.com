      <p>Originally a Wagner &amp; Schmidt type first cast around 1905, once known as Stanley. Jan &amp; Mike have posted links to Amsterdam's 1926 version, Hercules, and Wagner's 1927 revision, Titan.<br>
      Don't miss the alts with bunny ear ascenders [&amp; descenders]. Not on the rio grande sign, but an entertaining art deco splash!<br>
      Don</p>
