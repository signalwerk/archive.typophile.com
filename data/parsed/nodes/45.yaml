    html: <p>Now that we've built the "Downloads" section, (<a href="http://www.typophile.com/downloads" target="_top">http://www.typophile.com/downloads</a>) we'd be happy to include your bitmap typeface for Typophile users who'd like to download it for free. <br> <br>We're not interested in becoming another foundry, though we are thoroughly impressed with the talent that are frequently these forums.  <br> <br>We've got some ideas on how to help get critiqued designs fine-tuned and available to a foundry. Stay tuned, we'll soon have a process in place on this front.  <br> <br>In the meantime, if you'd care to offer your typeface for free download, let us know and we'll include it on the downloads page.</p>
