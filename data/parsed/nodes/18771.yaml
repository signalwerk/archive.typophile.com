      <p>Not all “cuts” of fonts with the same Postscript name are the same. In the case of Futura, see this thread:<br>
      http://typophile.com/node/18710<br>
      and this article<br>
      <a href="http://www.spiekermann.com/iblog/C61720386/E1641366970/index.html">http://www.spiekermann.com/iblog/C61720386/E1641366970/index.html</a></p>
      <p>That’s why Suitcase’s FontSense technology is critical. For auto-activation purposes, it can tell the difference between different fonts of the same name. Solutions from major font foundries will likely be oriented around re-licensing.</p>
      <p>Fonts from independant foundries are likely to have unique names. So, I would encourage you to support them by buying their products. Fonts are software. So, this is particularly important for unique design projects. </p>
      <p>In Suitcase, you can chose Tools -&gt; Find Duplicates, which identifies fonts with dupe Postscript names. It cannot tell you which version is better however. Often, people favor the most recent version from a given foundry.</p>
      <p>New OpenType versions of fonts provide new features and real advantages over previously issued typefaces. In those situations, the fonts almost always have unique names which separate them from previous products.</p>
