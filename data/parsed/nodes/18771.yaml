    <p>I have recently moved all my fonts into suitcase fusion after years of using various font managers and find myself quite happy now. However I have many fonts that have over the years been given different suitcase names by different foundries and what not, and now I currently have far too many multiples of the same fonts, with slight deriviation of name (EX. “font” and “fontAB”). Normally I could just delete all the duplicates, however some have a variation the other does not, such as a italic bold or something unique.</p>
    <p>I really am just looking for a suggestion on how to clean these all up and get them into one group with just the proper name, but you cannot change a fonts name in fusion. Any suggestions would be appreciated.</p>
