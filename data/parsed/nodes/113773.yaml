    <p>Can anyone help me identify the typeface used in this website's navigation bar?<br><a href="http://www.notonthehighstreet.com/">http://www.notonthehighstreet.com/</a><br>
    The ampersand is particularly distinctive, but unfamiliar to me. (As seen in 'prints &amp; art')<br>
    (Also slightly horrible kerning on 'valentine's' makes me wonder if it's some kind of bespoke adaptation?)</p>
