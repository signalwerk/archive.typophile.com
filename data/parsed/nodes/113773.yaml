  html: |-
    <p>Can anyone help me identify the typeface used in this website's navigation bar?<br>
    <a href="http://www.notonthehighstreet.com/" title="http://www.notonthehighstreet.com/">http://www.notonthehighstreet.com/</a><br>
    The ampersand is particularly distinctive, but unfamiliar to me. (As seen in 'prints &amp; art')<br>
    (Also slightly horrible kerning on 'valentine's' makes me wonder if it's some kind of bespoke adaptation?)</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        NOTHS Sans No2 SemiBold        </div>
            </div>
    </div>
    <div class="field field-type-userreference field-field-solvedby">
          <div class="field-label">Solved By:&nbsp;</div>
