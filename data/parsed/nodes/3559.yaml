    html: <p> I'm a big fan of constructism myself - And overall, the face feels right. It definately works better in large sizes. The counterspaces get lost in the small sizes.  <br> <br>The balance of some letters seem off. Letters like "A" seem perfectly symmetrical when others like "W" or "P" feel like the right stroke is heavier than the left. <br> <br>Could you elaborate on your statement of  "going for something more modern?" I'm curious as to what you meant by that. </p>
