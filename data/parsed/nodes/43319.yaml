  html: |-
    <p>A friend of mine asked:</p>
    <p><cite>Off the tops of your heads, can you recommend a good OpenType sans serif text font that has a wide variety of fractions in it's glyph sets, or allows InDesign to convert keyboarded fractions into "real" fractions?</cite></p>
    <p><cite>I'm designing and typesetting a cookbook and need more fractions than just 1/2, 1/4, and 3/4. I selected Adobe's Avenir initially, until I ran into this problem.</cite></p>
    <p>I don't know sans serif fonts very well, but there is a lot of experience with this among the Typophile people. I would assume she prefers "real" (e.g., arbitrary) fractions rather than using one of those programs that simply scales down &amp; repositions the lining numbers of a font.</p>
    <p>Anybody got suggestions?</p>
    <p>TIA,</p>
    <p>Charles</p>
