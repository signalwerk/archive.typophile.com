      <p>Besides Open Type, there are plenty of font sets that include expert collections which let you compose your own fractions, such as the FF Meta family or the Thesis fonts, or House Industries Neutraface. These fonts contain complete sets of numerators and denominators. </p>
      <p>I come across this problem a lot, since I design primarily art books and cookbooks.</p>
      <p>Alternately,  you can create character style sheets for numerators (I usually make them 3 to 3.5 points smaller than the regular size shift them up 2 1/2 or 3 points. Sometimes I go up a weight if the family has enough subtlety) and denominators (also 3 points smaller but no baseline shift). Just remember to use the opt+shift+1 character for the slash.</p>
