    html: |-
      <p>As far as I'm concerned, the only sane way is to have numerators, denominators and the fraction character all properly kerned, have the numerators also kerned with full-size numbers (oldstyle and lining) and a fractions feature set up. That way, the InDesign-tagged-text file can have a code around the fractions, and when that file is imported, everything is done.</p>
      <p>Of course that doesn't work if you don't use OpenType.</p>
