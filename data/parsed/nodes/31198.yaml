    html: |-
      <p>This topic has been discussed at our 'cousin' group of <a href="http://www.myfonts.com/WhatTheFont/forum/viewthread.php?threadid=45805" rel="nofollow">WTF Forum</a>, over at MyFonts. They concluded that it was 'not a font' on the shirts (supposedly based on a statement from L.I.G. folks). However, I think the site that Conor linked shows that a similar styled font was generated to make the site captions.</p>
      <p>I have no doubt it would be proprietary, since that is a big part of their brand 'look'.</p>
      <p>- Mike Yanega</p>
