    html: |-
      <p>As I've said before, the alternative is to have a parallel document that simply communicates the desires of the font maker to the buyer. It does not make any demands. It does not threaten. It treats the person bothering to read it as what he is: a friend. For example it might say "please let me know if you'd like modify the font", or "if you give the font to a service bureau to print your files, please ask them to delete it afterwards". I know it sounds strange, but it makes more <cite>human</cite> sense than any form of EULA ever can.</p>
      <p>But you don't just not have a EULA, because you need it to keep nasties (usually large corporations) at bay (even though the bigger lawyer army still wins). However, you also don't try to make it "kind" - that's hopeless. Conclusion? You make a second document, and one that simply <cite>communicates</cite>.</p>
      <p>I just need to find a name for the thing...  :-)</p>
      <p>hhp</p>
