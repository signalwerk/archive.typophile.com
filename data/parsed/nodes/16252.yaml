    html: |-
      <p>You can use FontExplorer X to preview any font in the Linotype Font Store. That includes Sabon, Sabon Next, and six different Garamonds (including ITC Garamond…).</p>
      <p>You can make the sample text any size you like. You can drag and drop the generated images (or left click "Export Image") to your desktop: they can be save in any image-based media format (bmp, jpeg, gif, etc.). You can't get at the outlines through the program, though.</p>
      <p>The string will be wider than what appears in your preview window if the type is that big… so no matter what, you should get your whole string that way.</p>
    html_clean: |-
