    <p>Epochal. </p>
    <p>This is a word I randomly ran into today while looking for synonyms to the word periodic. I was extremely intrigued by it and decided to play around. At first I felt like I was heading in a direction I liked... a lot. I started with some Saul Bass and Simplicissimus images for inspiration and went from there.</p>
    <p>I want something bold and a little bit retro... but I also want something original. I am going to try and base a web project on this word now and really want it perfected before I move on. I am pretty happy with where the logo itself is right now, but not at all happy with the color combinations. I like red, yellow, and black... but I feel like that is nothing new.</p>
    <p>Any comments or suggestions would be greatly appreciated.</p>
    <p>Also: def - extremely important, significant, or influential. [ep-uh-kuhl</p>
