      <p>First off -- you're creating an identity for yourself, so what should you have in mind? Obviously, the client demographic. Your personal icon should be distinct, original, and really get the message across that you're a designer.</p>
      <p>Right now, its cliche -- I cant count how many brands, shirts, logos, or products use the exact same styling, and that just works against you. You're not designing a cool t-shirt, you're trying to create a corporate (or personal) identity - remember that. </p>
      <p>The color palette is definitely solid, but the skewing and style just make it look amateurish. You should consider going back to the drawing board (physical - not the computer) and just brainstorm. Drain a pen, it always helps.</p>
      <p>Definitely on the right track with the classic typefaces for the description and contact info, though, it gives it a much more solid and professional feel.</p>
      <p>btw 253 krew HOLLER.</p>
