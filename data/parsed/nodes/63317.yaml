      <p>I know my last comment was kinda harsh, so I wanted to show you a simple illustration of why skewing text looks so bad compared to professional lettering. This is done with the font <a class="freelinking external" href="http://www.myfonts.com/fonts/doyald-young/home-run/" rel="nofollow">Home Run.</a></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/script_3868.jpg"></div><p></p>
      <p>If you wanted to make the perspective even more extreme, the best way to do that is by typing it out normally, then scaling down each letter one by one. Skewing is unnatural.</p>
