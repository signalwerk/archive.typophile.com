      <p>Hi,</p>
      <p>I think the whole piece has a pretty vintage 1900's kind of feel to it, which is cool. Was this your intention? I think the calligraphy looks pretty good (although I get strong Coca-Cola feelings with it, but maybe that's just me). I think the word 'brand' is not in the right place, it feels like an afterthought to the calligraphy. I think you should try to integrate it more with the calligraphy. The 'designs...' texts could be moved a bit further away from the calligraphy. Give it a bit more air. And you might want to look into the colors a bit, as I feel they are not completely matching.</p>
      <p>Good luck! </p>
      <p>Jeffrey<br>
      <a class="freelinking external" href="http://www.infraordinaire.com/wordpress" rel="nofollow">infraordinaire</a></p>
