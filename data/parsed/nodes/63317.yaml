    <p>I've recently come across some excellent fonts and accordingly, am trying to build some sort of identity for myself, being a freelance graphic designer and all.</p>
    <p>I fear I'm being too critical of my work, so I figured what better place to have people critique it then here.</p>
    <p>What does everyone thing of this? Are the fonts too busy? I feel like the entire thing is rather dense, but like i said before, maybe it's just me.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bcard_3423.png"></div><p></p>
    <p>Thanks guys!<br>
    R//R<br>
    <a href="http://web.me.com/kyleleitch" title="http://web.me.com/kyleleitch">http://web.me.com/kyleleitch</a></p>
