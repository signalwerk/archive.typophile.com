      <p>There's a lot going on. I'd lose "brand" and "coming soon".</p>
      <p>it definitely has a very old-timey look to it. If that's not the kind of work you're going to be pursuing or doing, yu might want to consider another approach.</p>
      <p>For me, the treatments on the two fonts don't work well together. You name has a simple (green?) drop shadow behind it, and the rest has a very modern (or maybe more like 1990s) 3D feel to it. I think if you could give the same treatment to both of them, it would be a lot more cohesive.</p>
      <p>The red in your name doesn't pop well on the black background. Maybe try brightening that up?</p>
