      <p>I don't think you're being overly critical at all. It's unrefined. </p>
      <p>The script looks like it's been squashed and stretched; frankly, VERY tortured. Skewing and distorting text is <strong>the</strong> mark of an amateur. </p>
      <p>The contrast is uneven and the yellow-ish outline makes it worse. The angle of stress is inconsistent; most glaring in the arm on the K and the whole swash underneath. The perspective on the swash is totally out-of-sync with the lettering, making the wide left side look like it's reaching out directly at me, and the Kyle is a few feet behind it. Look at some videos on YouTube about how to write calligraphy, then pay close attention to natural the angle of stress and contrast.</p>
      <p>The colors don't bother me, but the background gradient doesn't match the era. The green shadow is just odd.</p>
      <p>I could go on, but I'm starting to feel mean. I hope I helped without hurting your feelings!</p>
    html_clean: |-
