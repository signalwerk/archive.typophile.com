      <p>I agree with a lot of the previous comments.</p>
      <p>If you go with this style, definitely up the quality of the lettering (i.e., don't simply skew a font).</p>
      <p>I would consider going back to the conceptual stage of your branding process. A specific mark or font is secondary to what you convey with your presentation as a whole.</p>
      <p>At the top of the list of things to convey should -- in my opinion -- be technical proficiency. So I think it would be better to simply use a standard font like Helvetica with the right size and spacing. Of course, my immediate follow-up advice would be to, if possible, convey some personality (which might rule out Helvetica).</p>
      <p>But proficiency should always come before originality. That is, if you want to make $$.</p>
