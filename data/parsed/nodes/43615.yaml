      <p>A bit more background from Leeds:</p>
      <p>"In 1901 Emery Walker and Sydney Cockerell designed the famous ‘Subiaco’ fount for the Press, which was based on the Sweynheym-Pannartz typeface that Morris had once used as a model for a typeface he never finished. The fount was eagerly received by Hornby, who had been greatly influenced by Morris’s principles of good printing through an inspiring afternoon spent at the Kelmscott Press in 1895."</p>
      <p><a href="http://www.leeds.ac.uk/library/spcoll/virtualtour/side_private.htm" title="http://www.leeds.ac.uk/library/spcoll/virtualtour/side_private.htm">http://www.leeds.ac.uk/library/spcoll/virtualtour/side_private.htm</a></p>
