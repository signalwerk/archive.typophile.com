      <p><cite> I’m pretty sure the ra and ta combinations in the Ashendene Subiaco are ligatures</cite></p>
      <p>Me too. :-) </p>
      <p>I found one more example from this time period. It a book printed in 1469, by Johann ( and maybe Wendelin too  - I am not 100% sure about that ) of Speyer (de Spira). It's not something I am sure about like this but I am reasonably confident. I will make separate thread for that.</p>
      <p>There is also is slight possibility that there is a Jenson - which would be pretty wild I think. I am not holding my breath on that one but he was working at the same time and I seem to recall his sort of taking over the de Spira business or something. Anyway - there was I think a real relationship of some kind. That one has a thread already.</p>
      <p><a href="http://typophile.com/node/43627" title="http://typophile.com/node/43627">http://typophile.com/node/43627</a></p>
      <p>I would appreciate any help you guys can muster in finding better images for these 3 examples!</p>
      <p>Thanks!</p>
