      <p></p><div class="imageWrap"><img src="http://typophile.com/files/3or4_4714.a.shapes.sm.jpg"></div><p></p>
      <p>Here is a sample. This is from a photo repro-specimen, not an original. So it is quite a soft image. Note the variety of "a" shapes maybe a total of 4. There are two "t" shapes as well. I am not sure I have found all the contextual variations yet.</p>
      <p>The type that inspired this font is in fact from the 15th century - printed at Subiaco in Italy in 1465.</p>
      <p>I am looking for good images of those original types now as well as better images of the Ashendene type called Subaico.  This type is a transition from blackletter to roman. Conrad Schwenheym and Arnold Pannartz moved from Germany to Italy.</p>
      <p>"Originally from near Mainz, Germany, Sweynheym with Arnold Pannartz established (c.1464) in the monastery of Subiaco the first known printing press in Italy. Sweynheym and Pannartz first used Greek type there in 1465. They moved to Rome in 1467."</p>
      <p>Some people think that that "Sweinheim/Sweynheym worked at Eltville with Gutenberg in 1461-64."</p>
      <p>And look! Tiff wrote about it too</p>
      <p><a href="http://www.typophile.com/node/34038" title="http://www.typophile.com/node/34038">http://www.typophile.com/node/34038</a></p>
