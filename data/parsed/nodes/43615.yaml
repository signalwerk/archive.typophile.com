      <p>Paul Shaw says that </p>
      <p><cite> the face was based on the type of Conrad Schwenheym and Arnold Pannartz used in the books they printed at Subiaco in Italy in 1465. It was cut by Edward Prince. </cite> </p>
      <p>Edward would have cut it around 1902 or therabouts I think. My sample image ( i will post it soon) was printed in 1909.</p>
      <p>Thanks Paul!</p>
