    html: <p>1902 — Edward Prince had previously cut William Morris’s Golden Type and later on worked on a roman for Count Harry Kessler's Cranach-Presse. The Subiaco type seems to have been used in the Ashendene Press edition of Dante’s <cite>Inferno</cite> in 1902.</p>
