      <p>Eben, I'm pretty sure the ra and ta combinations in the Ashendene Subiaco are ligatures, but that's just a practical method for implementing the shape variation relationship in the metal type; if Prince were working with OpenType, he might well choose to take the contextual alternates approach.</p>
      <p>Ross was very interested in both the original Sweynheym and Pannartz faces and the Ashendene version. I'll draw his attention to this thread.</p>
