  html: |-
    <p>Yet another student.</p>
    <p>I have to redesign a mag of my choice, good, bad, ugly, whatever. I wanted to do something which wold challenge me more than the norm, and I had the idea of separating text and image in an architectural magazine. This would allow articles to perhaps become bigger, without taking any importance away from the images which are separated. </p>
    <p>Architecture, with art follows movements and styles, from Bauhaus to Deconstructivism, as does typography. So reflecting the nature of the article and thus images in the typographical layout for each spread, but then we have no images - so more white space to contend with. And then - maybe - the lack of continuity throughout. </p>
    <p>This is a brief from two tutors, one of which I speak to alot, and he’s happy for me to be as experimental as i want as he believes i will learn more. </p>
    <p>I just wanted to hear your thoughts.</p>
    <p>I understand there could be alot of problems, and I think i maybe ’screwing’ myself over by doing this as the following is bothering me even though ive yet to start;</p>
    <p>too much white space<br>
    not enough continuity</p>
    <p>Trying to figure out how I could navigate to and from these separations is interesting me - i also thought of using thumbnails  or maybe just a portion of the image in each layout. </p>
    <p>attempt, or stay away?</p>
