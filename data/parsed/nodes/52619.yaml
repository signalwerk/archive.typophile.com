  html: |-
    <p>I’m using ITC New Baskerville at 11 points for the body of a bible-related study guide.  I want this guide to have a fresh, clean, professional look.  Originally I was torn between Mercury and ITC New Baskerville, and eventually opted for the latter when I saw it effectively used in a book.</p>
    <p>Now I need a good sans-serif font to be used for headers to compliment this work.</p>
    <p>I’ve been working in Word and was originally using Arial Black at 20 points.  But lately I’m totally turned off by the Microsoft licensed fonts.</p>
    <p>A professional logo was recently created for this work, and the designer used Neue Helvetica 73 Bold Extended in all caps for the logo.  So originally I investigated that font using both lower and upper case letters.  The headers in my book will use mixed case.</p>
    <p>The width of Neue Helvetica 73 Bold Extended is nice.  But the white space in some lower case letters (like a, e, and s) is unsatisfactory.  I read the thread regarding Helvetica and Univers, and it seems the latter is favored by designers (<a href="http://typophile.com/node/33301" title="http://typophile.com/node/33301">http://typophile.com/node/33301</a>).  After comparing Univers 73 Black Extended with the former I agree that Univers is superior to Helvetica.</p>
    <p>All that being said, I’m not married to any header font at this point.  The extended fonts seem to contrast nicely with ITC New Baskerville.</p>
    <p>The qualities I’m looking for are:<br>
    1. High contrast<br>
    2. Readability<br>
    3. Clean professional appearance</p>
    <p>Please recommend some fonts that you think would compliment ITC New Baskerville. Thanks.</p>
