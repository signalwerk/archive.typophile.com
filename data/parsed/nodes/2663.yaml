    html: <p>The Solotype Catalog Tamil differs from the logo image in several ways. <br>I'd post a scan, but I bet Mike Y is working that up right now. <br> <br>Thought I'd mention, though, that Dieter Steffmann digitized the Black and <br>Outline variants of Tamil under the name <a href="http://www.moorstation.org/typoasis/designers/steffmann/samples/t/tobago.htm" target="_blank"> Tobago Poster</a> (Win TT/T1 only). <br> <br>The Catalog shows 6 weights of Tamil, Light through Heavy, and I think <br>Herr Steffmann chose the nicest and most potentially useful of them to <br>digitize. <br><br></p>
