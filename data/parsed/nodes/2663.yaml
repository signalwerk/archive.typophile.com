    html: <p>This resembles Tamil (p.158 in Solotype catalog published by Dover Books). The showing is incomplete, so I can't see enough letters to confirm it.  <br> <br>I cannot find a showing of it online, mainly because Tamil is also a language, with it's own fonts. <br> <br>However, closer investigation shows Tamil to be a more square typeface than this. It has very similar serifs though.</p>
