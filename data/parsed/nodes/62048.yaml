  html: |-
    <p>Apparently it is essential that we have a 'handwritten' style font to use on a diary page for the mag I work for and at the moment we've got some awful piece of free rubbish that offends my eye. Can anyone recommend a half-decent, professional looking 'handwriting' font please?</p>
    <p>It just needs to be something fairly informal and legible.</p>
    <p>Thanks for your help, </p>
    <p>G</p>
