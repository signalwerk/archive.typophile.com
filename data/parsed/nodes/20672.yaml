    html: |-
      <p>Nothing special, except for № (Numero sign)</p>
      <p>It is better if your typeface would contain all Windows 1251 encoding characters, not only 33 russian letters.<br>
      <a href="http://www.microsoft.com/globaldev/reference/sbcs/1251.mspx">http://www.microsoft.com/globaldev/reference/sbcs/1251.mspx</a></p>
      <p>Check out also this thread:<br>
      <a href="http://typophile.com/node/20508">http://typophile.com/node/20508</a></p>
