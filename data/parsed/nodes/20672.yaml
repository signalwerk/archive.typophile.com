    <p>I’m need to make a typeface of Russian handwriting. The font needs to contain both Latin (26) and Cyrillic (33) letterforms. What I need to know is what punctuation marks are essential to Russian other than those found in Latin?</p>
    <p>Any help would be appreciated.</p>
