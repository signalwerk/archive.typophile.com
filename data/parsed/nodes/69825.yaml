      <p>I did a Google search on the term <a href="http://www.google.com/#hl=en&amp;source=hp&amp;q=Identity-H+encoding&amp;aq=f&amp;aqi=&amp;aql=&amp;oq=&amp;gs_rfai=&amp;fp=4f910945c1ee36d4" rel="nofollow">"Identity-H encoding"</a>, and basically it seems to mean double byte font encoding, which is used for extended character sets. It's not obvious to me why that should affect the way the font is displayed. Maybe one of our Adobe experts can help you.</p>
      <p>- Mike Yanega</p>
