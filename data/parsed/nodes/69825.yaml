    html: <p>I have no idea about that "Identity-H encoding". On the other hand, the original pdf was produced with InDesign that allows <a href="/wiki/squoosh" class="freelinking" rel="nofollow">squoosh</a>ing text i.e. applying a fixed factor on the width of each character in the text to make it more condensed. I think that is what was done to get those more condensed characters in the original text.</p>
