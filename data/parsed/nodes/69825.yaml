    <p>Hello all,<br>
    I'm very interested in this font so I have analyzed the PDF document and discover that the font is "Plantin" "Identity-H encoding" (what does it mean ?)<br>
    I have this font but the visual aspect is not the same ! the original is smooth seems to be more condensed character. Do you know how I could have the same visual aspect ? is it the encoding that produce this effect ? or is it another font ?</p>
    <p>I ish you could help me...</p>
    <p>here is the original pdf (the font in which I'm interested is the text corpus)<br>
    <a href="http://www.analog.com/library/analogdialogue/archives/38-06/capacitive_loading.pdf" title="http://www.analog.com/library/analogdialogue/archives/38-06/capacitive_loading.pdf">http://www.analog.com/library/analogdialogue/archives/38-06/capacitive_l...</a></p>
    <p>here is my font with the same text (first paragraph) with different font sizes :<br>
    <a href="http://img260.imageshack.us/img260/9279/sanstitre.pdf" title="http://img260.imageshack.us/img260/9279/sanstitre.pdf">http://img260.imageshack.us/img260/9279/sanstitre.pdf</a></p>
    <p>regards</p>
