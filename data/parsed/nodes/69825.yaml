      <p>My amateur's guess is that your version of Plantin is not the same as they used. The way they are shown in the Properties&gt;Fonts window is not the same. Yours is PS1, I think, and theirs is [F], whatever that is. Either a different font format, or a different version of Plantin than the one you used.  </p>
      <p>Maybe a PDF expert will help us out.</p>
      <p>- Mike Yanega</p>
