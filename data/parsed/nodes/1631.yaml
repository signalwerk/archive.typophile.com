    html: <p>Yeah. We're all really lawyers.  ;-) <br> <br>Maija, like Tiffany said it depends on the particular font house, so be sure to ask them*. MS is the only one I know of that prevents any modifications for any purpose, but most font houses are happy if everybody using the font in any form has paid once for it. Some small foundries (like Tankard for example) try to insist on doing all modifications themselves, but to me that sort of thing is more of a personal decision on your part rather than "professionalism" or something. The more you support type designers the better for type in the long term, but you have to worry about yourself too. <br> <br>* On the other hand, if you feel their position is unreasonable (not to yourself, but in the overall), I personally advise taking things into your own hands. That's how society really works, although "officially" they'll never admit that... <br> <br>hhp <br></p>
