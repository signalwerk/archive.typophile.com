    html: <p>&gt;Finally, do you have a link to an official &gt;source that lists the requirements for  <br>&gt;rendering Latvian? <br> <br>I doubt that one exists, but I can try and find out. There's the general thing that we have 11-13 non-standard characters in our alphabet (two of them aren't used anymore and as such are optional) and there are some common rules how to create them worked out by few old educated folks and followed by some others like me. Nothing complicated, but I'm not that good in therminology to explain more details. <br> <br>Why are you interested? <br> <br>The general problem is, there's no education specifically in type design here, moreover, there's no education in graphic design at all, so all we poor people can do is to grab all the tidbits that fall off the great and educated folks like you here <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">... Or purchase books at amazon.com (I'm currently waiting for my copies of Elements of Typographic Style and Type in Use.. exciting! :P).  <br> <br>&gt;you obviously don't spend much time reading  <br>&gt;font licenses ;-)  <br>Oops, that's something I should've done in the first place. Will have to take a look. <br>The general part about EULA's is - if you don't like a clause there but still must have the product - is there an option to have that clause removed? Nope, and you have to "license" to use the stuff anyway. So no wonder people don't read them - if they need the product, they "Agree" and that's about it.</p>
