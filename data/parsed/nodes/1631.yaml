    html: <p>Hi Maija,  <br> <br>Something you may have missed is that you don't generally 'buy' fonts, you 'license' them. So any rights to modify and further distribute the modified font would be documented in the font's end user license agreement (EULA). <br> <br>Most, but not all, font vendors prohibit modification. Those that allow modification require that the recipient be a licensee of the original font.  <br> <br>Finally, do you have a link to an official source that lists the requirements for rendering Latvian? <br> <br>Cheers, Si <br></p>
