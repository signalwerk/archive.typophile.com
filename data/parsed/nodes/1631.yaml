    html: <p>I have mixed opinions about this. On the one hand, I expect to be able to approach a foundry and say "hey, I really need to add East European support to one of your fonts I've already licensed; you already own all modified versions by virtue of their being derivative works, so you can sell my results to a new market and claim all resulting profits." In some cases this may prove a good idea; in others, I can see how a foundry would not want to keep track of which characters are available in all the third-party-modified fonts that result, to say nothing of quality control or phone support in God Knows What Language. Then there's the matter of getting phone calls from service bureaux cos this or that third-party version of this or that font is clogging a RIP.  <br> <br>Expanded character set support is nice to have and will be much easier to implement because of things like FontLab and OpenType. But you have to respect the costs that foundries have to bear once such modifications are introduced. I would encourage you to keep such considerations in mind when approaching a foundry about modifying their fonts, and think of ways to make it easier for them. I wish this were simpler, but it's not.</p>
