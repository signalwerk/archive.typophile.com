    html: <p>When foundries start paying for the right to license formats I'll start paying attention to the claims they make against modifying fonts I have "licensed" from them.  <br> <br>Fontographer never got the rights to allow modification of certain Microsoft TrueType fonts that contain a certain kind of kerning, since they could not provide support for this. One would think that they must have secured rights from other major suppliers of formating to allow their own software to be used by their customers without concern for liability. So it you modify via Fontographer, and I assume FontLab, there must have been certain rights secured that circumvent any claims additionally made by piggie-back foundries?</p>
