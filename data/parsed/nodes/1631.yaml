    html: "<p>You're right, Simon - I guess my defence is that I have more interesting things to read! On the other hand, a while back MS* was indeed the only one to prohibit any mods outright, no? But you're right, of the first three EULAs in that Google result, Bilak's <i>seems</i> to allow \"internal modification\" (it's really ambiguous, maybe on purpose), while the other two don't. I think the latter stance is stupid, because all it does is reduce trust between seller and buyer. Telling people they can't do something they'll do anyway can only serve to reduce your authority. It's much better to look the other way, and follow the other road you mention: \"Those that allow modification require that the recipient be a licensee of the original font.\" And when anybody asks me, I'll advise against buying fonts from such a control-freak font house: if you have to go to the original designer for an <i>internal</i> mod on something you've paid for**, you're opening yourself up for delays and extortion. And a font house that gains one extra commission by forcing the modification to revent to it is losing more than one commission by tricking the customer (with an unexpected clause in the EULA) into buying something with hidden fees. <br> <br>* Which you could say was a special case, since OS functionality was involved. <br> <br>** To me the difference between buying and licensing is just legalistic trickery. <br> <br>hhp <br></p>"
    html_clean: "<p>You're right, Simon - I guess my defence is that I have more interesting things to read! On the other hand, a while back MS* was indeed the only one to prohibit any mods outright, no? But you're right, of the first three EULAs in that Google result, Bilak's <i>seems</i> to allow \"internal modification\" (it's really ambiguous, maybe on purpose), while the other two don't. I think the latter stance is stupid, because all it does is reduce trust between seller and buyer. Telling people they can't do something they'll do anyway can only serve to reduce your authority. It's much better to look the other way, and follow the other road you mention: \"Those that allow modification require that the recipient be a licensee of the original font.\" And when anybody asks me, I'll advise against buying fonts from such a control-freak font house: if you have to go to the original designer for an <i>internal</i> mod on something you've paid for**, you're opening yourself up for delays and extortion. And a font house that gains one extra commission by forcing the modification to revent to it is losing more than one commission by tricking the customer (with an unexpected clause in the EULA) into buying something with hidden fees. <br> <br>* Which you could say was a special case, since OS functionality was involved. <br> <br>** To me the difference between buying and licensing is just legalistic trickery. <br> <br>hhp <br></p>"
