  html: "<p>All the legal issues guru's here, could you please advise me on a following question: <br> <br>I live in a tiny country with it's own language that has several letters in its alphabet that have accented characters which you don't get in a standart font (with macrons, mitigations (is it a term?) et al).  <br> <br>So, in order to use a font I have bought from a foundry (assuming that it is not one of the few already adapted fonts distributed by our only local foundry) I have to open it up in Fontographer, edit the letters - add the missing parts and place them in the right places in the character table to work with our standard keyboard - and export the font. <br>  <br>The question arises when a pal/friend/colleague of mine wants to get the same font. What would be the right way to arrange it so that he would not have to do the job I've already done (ie open-&gt;edit-&gt;export-&gt;use), but still would own the font legally? Is it legal that he buys a copy from the foundry and then pays me to edit it and I give him the edited version I already have?</p>"
