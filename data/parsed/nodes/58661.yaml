    <p>Very excited about the release of my first font in a very long while. In almost every way I am indebted to Typophile. It started as a <a href="http://typophile.com/battle28">Type Battle entry</a> and progressed with <a href="http://typophile.com/blog/7783">blog feedback</a>. You can find out more about it at my website: <a href="http://www.aquatoad.com">www.aquatoad.com</a>. If you like what you see, head on over to the <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000436#specimen">good people at veer</a> and take it for a spin!</p>
    <p>Thanks Typophile!<br>
    Randy Jones<br>
    Aquatoad Design<br>
