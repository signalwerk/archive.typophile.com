  html: |-
    <p>My comrade, sculptor Ernest Hilsenberg, sent me this wonderful sign from his recent travels in Costa Rica. This has pretty much everything I covet in a piece of art. Texture, mystery, distress, elegance. And instructions for what you can and cannot do. Look at the exquisitely wrong letter spacing between the u and the m, the caprice of the flourished N, the vapor of smoke. Not to mention the shimmering ghost of the silver cigarette and the restrained iconography for "no."<br>
    More on <a href="http://www.alphabetroadtrip.com" title="www.alphabetroadtrip.com">www.alphabetroadtrip.com</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Smoking_4099.jpg"></div><p></p>
