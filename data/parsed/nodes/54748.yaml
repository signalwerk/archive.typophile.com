  html: |-
    <p>Recently citroën has redesigned its identity. I believe to have achieved some innovation, though "Créative technologie" removes the french accent out of the brand (on purpose?)... But I'm interested in finding out what is the corporate typeface, that seems to work very well with the logo's typeface and personality of the brand.</p>
    <p><a href="http://www.citroen.fr" rel="nofollow">www.citroen.fr</a></p>
    <p>Thanks.</p>
