  html: <p>Can anyone suggest a good compliment for Helvetica Neue Medium Extended. The use will be in small to medium doses of copy in a brochure and workbooks (fill-in-the-blank type). I need at least a book and bold weight with italics and prefer to have small caps if possible. Any thoughts would be greatly appreciated. Thank you in advance.</p>
