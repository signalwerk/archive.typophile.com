      <p>1. I would agree with your idea that the ligature should be placed over the “u” and “n”. That’s the unique word (travel isn’t) and it’s the one that’s consistent throughout your site iterations.</p>
      <p>2. As for color, are you intending to use this orange on black? if not, upload it on different background colors such as paper or an alternate color you’d like to use for your identity. That way we get a better feel for how well the main orange color will work across a variety of placements.</p>
      <p>penn</p>
