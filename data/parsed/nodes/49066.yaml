      <p>well, when I first saw your logo I had no idea what that curvy thing on the “r” and “a” of travel was and why it was there. Is it the top of a mosque? Regardless of what it is, I don’t think it fits there. It could easily be mistaken for a leaf or a wishbone.</p>
      <p>I don’t think the period delimiter makes it look more like a website than “bedouin travel”. In fact, take that period and place it above the “i” — or just get rid of it. Right now it looks like you’re trying to be “l337” like uber.pwnage or h0t.d0gs</p>
      <p>your “b” has a straight cutoff on the bottom left corner, however, your “d” does not. </p>
      <p>it sounds like you’re on a tight deadline. Try to find a muslim influenced script in place of your serif font. That way there’s no need for motifs if you already establish the muslim or middle eastern feel you’re going for. If that sounds too cliché then go get a nice serif font and try making some of the changes above. I think it will lessen some confusion.</p>
