      <p>Right, have had a bit of a think on this one and I seem to be losing myself in options:</p>
      <p>could chnage the dome ligature by:</p>
      <p>1.	moving it onto the right stem of the u and the left stem of the n (hopefully without the n getting confused with an h)<br>
      2.	moving it to above the i<br>
      3.	replacing the o with a dome<br>
      4.	leaving it where it is</p>
      <p>then I guess I could see whether logo reflection can remain by:</p>
      <p>1.	making it 5-15% grey on a white background and 35-50% lighter than when on a black background<br>
      2.	making the outline a ’ghost’ one<br>
      3.	giving up and doing away with it together</p>
      <p>paralysis by analysis I fear!<br>
      Saqib</p>
