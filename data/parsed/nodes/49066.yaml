    <p>Hello to all you esteemed experts out there,</p>
    <p>I need some practical help with finishing my logo for an independent travel operator for the British market specialising in the travel to the authentic middle-east like Jordan, Syria and Oman among others.</p>
    <p>As a new start-up and completely inexperienced in commissioning these things, I had the logo designed last year way before I had even a vague idea about how it would be used. Consequently, aside from a slight change to the shape of the dome and colours of the logo, I signed off on something that looked good but suffered on legibility when I began to ’road test’ it.</p>
    <p>I’ve attached the original, and also where I am right now with it, key changes are:<br>
    1. Removed the reflected line as that was doing anything but enhance name recognition!<br>
    2. Change the Uppercase B in Bedouin.travel to a lowercase b so that it read more like the web address (bedouin.travel)it was meant to.</p>
    <p>The company is not far off commencing trading and I need to get on with nailing the logo and print letterhead, compliment slips and business cards (for starters!) in a way that where its appearance is consistent across all three.</p>
    <p>I have a few questions to the logo in its current form:<br>
    1. Given that my websites are going to be bedouin.travel, bedouintravel.me, bedouintravel.hu and finally bedouin.aero, I’m wondering whether the dome ligature might work equally, if not better, on the u and n of the word bedouin.<br>
    2. Can’t quite get the right colour for the logo, was thinking a bright vibrant orange as reminiscent of the heat of the desert rather than a washed out yellow of desert sand. If you can show a colour with pantone that you think works better&lt; I’d appreciate it.</p>
    <p>OR</p>
    <p>3. Does someone have an idea, even a sketch, that blows the current logo away?</p>
    <p>Even though funds as a yet to launch start-up are limited, I’m willing to pay something if need be for any suggested major redesign or amendment that I wish to pursue, wouldn’t want anyone to think I’m putting this out there to save money, it’s more for the increased scrutiny/eye for design/refinement of the typophile community that I just couldn’t find ANYWHERE else.</p>
    <p>Many thanks for your assistance<br>
    Saqib</p>
