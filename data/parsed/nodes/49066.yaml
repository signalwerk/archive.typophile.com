      <p>Dear Penn and MrK,</p>
      <p>Thanks for your comments, Penn - your first point is what I too was thinking as I have no Graphic Design skills I will perhaps wait and see if someone comes up withsomething better before getting a designer to try it so I can have a look see. As for the background colour, I guess it needs to work with White firstly, and then if possible, with Black too, the text colour though has to be something evocative of the desert.</p>
      <p>MrK, I don’t want to make the dome any more overt as a great many of my customers will not be muslim and I don’t want them to necessarily feel excluded. Interestingly those that have been coming to the business with an islamic eye have tended to spot it quicker than those not looking at it from that angle.</p>
      <p>Am open to moving the period around but I did quite like the idea of keeping it all as a web address though I didn’t understand the ’1337’ comment. As for the bottom of the b, I can see why you thought that, I though it too and it was the first thing that I pointed out in the amendment though surprisingly it didn’t look as good somehow.</p>
      <p>Thanks for taking the time so far...</p>
