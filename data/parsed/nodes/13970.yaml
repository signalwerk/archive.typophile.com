    <p>Sampo Kaasila is a Finnish technologist with many contributions to digital typography. Probably his greatest impact has been the design of the <a href="/node/13679" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TrueType</a> font technology at Apple in the late 1980s. Since then, he founded <a href="/node/add/wiki?edit%5Btitle%5D=Type%20Solutions" title="Create node &quot;Type Solutions&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Type Solutions</a>, which has created a number of tools (including the basis of the <a href="/node/13964" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">hinting</a> tool Microsoft’s <a href="/node/12587" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Visual TrueType</a>), and a new rasterizer, <span class="caps">T2K</span>. <a href="/node/13429" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bitstream</a> acquired Type Solutions in 1998, and now markets the technologies under its own&nbsp;name.</p>
