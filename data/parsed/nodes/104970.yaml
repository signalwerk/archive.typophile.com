      <p><a href="http://typophile.com/node/84025" title="http://typophile.com/node/84025">http://typophile.com/node/84025</a><br>
      <a href="http://typophile.com/node/89876" title="http://typophile.com/node/89876">http://typophile.com/node/89876</a><br>
      <a href="http://www.typophile.com/node/92747" title="http://www.typophile.com/node/92747">http://www.typophile.com/node/92747</a><br>
      <a href="http://www.typophile.com/node/99592" title="http://www.typophile.com/node/99592">http://www.typophile.com/node/99592</a></p>
      <p>There has been discussion in the past about the use of small caps. In your specific case, I would say if it looks better then use the small caps.</p>
      <p>You probably want to use a font where the small caps are bigger than the x-height. I'm not sure if the Caslon types do this or not.</p>
      <p>Another approach is no small caps at all, just use a font where the height of the regular capital letters is less, such as Gentium, Greta Text, Malabar, or others. This is my preference, to keep it simple.</p>
