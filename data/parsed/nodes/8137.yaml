ly more legible and usable than those in OS X.  <br> <br>2) Font kerning problems: This problem REALLY confuses me. Partly because of the lack of quality control on Apple's end, but also because I haven't heard people complain about this in the past. Take for example <img src=\"http://www.typophile.com/forums/messages/30/55758.jpg\" alt=\"Horrible kerning issues under Mac OS X\"> this screenshot. Taken in Safari, Courier New, 14pt (blue and underlined because it's a link). Being a monospaced font, I would expect the space between the first square bracket and the 't' to be the same as the space between the 'p' and the closing bracket. Also, the underline extends beyond the closing bracket, and there is no space between the underline and the text. <br> <br>So, are these \"bugs\" or are they \"features\"? What does everyone think about this? Are Mac OS X fonts pretty but unusable? Are they ugly? Are non-antialiased fonts better at screen resolutions (72dpi) for programming/scripting than anti-aliased ones? Is this a problem with the fonts themselves or the implementation of the renderer?</p>"
