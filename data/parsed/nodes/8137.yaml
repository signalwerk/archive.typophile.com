    html: <p>I'm not going to argue that OS X does a nice job of font rendering, and you certainly point out some particularly weird things. But among those there are a couple of points that need clarification/correction. <br> <br>There are two definitions of "kerning," neither of which is applicable here. Monospaced fonts generally don't have (either kind of) kerning, and certainly Courier doesn't, regardless of version. I'm pretty sure what you mean is spacing, not kerning. <br> <br>"and there is no space between the underline and the text." <br> <br>Generally, the underline is below the baseline, but above the descender line. That's the case here. Yes, it cuts across the descender on the "p." Sad. <br> <br>Regards, <br> <br>T</p>
