    html: <p>Since I switched to Mac in August, one of the things I've really missed is the way that Windows renders text.  I don't expect Postscript fonts to render super crisp on screen, but I do Truetype fonts, and to me, on OSX, all fonts look like they're Postscript by the way they render. <br> <br>Text on windows is just so much clearer, and with Cleartype enabled it's just so much more pleasing aesthetically.  Apple should licence the rendering tech MS uses for Windows because it is just far superior. <br> <br>And what's the deal with the different AA modes in OSX?  Maybe it's me but I can't see any difference in the way text looks with them.</p>
