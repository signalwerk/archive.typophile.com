    html: '<p>my two cents: <br> <br>� Lucida Grande is the ONLY font working well with the osX "grey fuzziness". I hope apple works on delivering improved webfonts for osX, or an improved osX for webfonts. <br> <br>� MS ClearType antialias is far superior to osX font antialias. <br> <br>� Quick solution: antialias really makes sense for font sizes &gt;12px, so go to Appearance in your Preferences pane, and disable antialias for fonts under 12px/pts. The small fonts kerning will be better, also.</p>'
