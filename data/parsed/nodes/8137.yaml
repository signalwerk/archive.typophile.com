    html: <p>No argument there, that the OS X rasterizer could improve. As I understand it, Apple has been making an ongoing effort to improve their font rendering - as in, it has already changed at least once within the OS X era - and I expect that to continue. <br> <br>Certainly choosing a font that works as well as possible with the current rendering tech will help, but if you really don't like the current rendering, you may be pretty limited in how much you can improve things through font selection. <br> <br>Of course, as noted elsewhere in this thread, you can also set the size at which anti-aliasing kicks in on OS X, which may help. <br> <br>I must admit that the advent of OS X made me particularly glad that Adobe's own applications generally use their own rendering system, independent of the OS. <br> <br>Regards, <br> <br>T</p>
