    html: <p>Try using Courier instead of Courier New as your default font in BBEdit. Courier New is much lighter than Courier and this results in it looking quite light in OSX text rendering.  <br> <br>You might also try using my free <a href="http://www.ms-studio.com/FontSales/anonymous.html" target="_blank">Anonymous</a> font. At 9 and 10 points it renders without anti-aliasing in BBEdit on OSX, and, since it is large for its size, 9 and 10 point are closer in size to 11 and 12 point Courier.</p>
