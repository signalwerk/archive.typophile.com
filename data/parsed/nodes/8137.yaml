    html: "<p>Note also that BBEdit has an option in the preferences to turn of anti-aliasing at up to 12 point (see the \"Editing: General\" panel in the BBEdit Preferences). I don't know if EditingPad Pro has a similar option, but you can also make this change system-wide in the Appearance panel of the System Preferences. <br> <br>For what it's worth, Courier is the default OSX monospaced font and comes from Apple. Courier New is an optional font which usually comes from Microsoft and was probably installed when you installed a Microsoft app for cross-platform document compatibility with Windows which doesn't have Courier (without the \"New\").</p>"
