  html: |-
    <p>Dear Typophiles,</p>
    <p>Can you identify the attached font?  It was used as the title in the main menu of the first network enabled, multiplayer 3D cyber space video game entitled “SPECTRE”.  This game was developed by Peninsula Gameworks for the Macintosh in 1990 and published by Velocity in 1991.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/SPECTRE logo (from original game main menu)_5104.png"></div><p></p>
    <p>We are developing an updated version for the iPhone and cannot locate the original font resources in our archives.  None of us remember the font name (it's been 20 years!).</p>
    <p>Also, it is not necessary that we find a version with the chrome type of fill, as solid black would suffice.  </p>
    <p>Thank you for your time and interest.<br>
    Best regards,<br>
    Craig Fryar, President<br>
    Peninsula Gameworks</p>
