      <p>I suspect Steile Futura was the basis for |ROSSINI-RESPIGHI|; a modern digital substitute could be Great Escape, by Typodermic:<br><a href="http://www.myfonts.com/fonts/typodermic/great-escape-rg/">http://www.myfonts.com/fonts/typodermic/great-escape-rg/</a></p>
      <p>|BALLET MUSIC| is tougher. With a little bit of editing, Cachet might work:<br><a href="http://www.myfonts.com/fonts/mti/cachet/">http://www.myfonts.com/fonts/mti/cachet/</a></p>
      <p>|BOUTIQUE| does not seem to have a digital equivalent. Some options that could be customized to come close:<br><a href="http://www.myfonts.com/fonts/woodentypefonts/doric/">http://www.myfonts.com/fonts/woodentypefonts/doric/</a><br><a href="http://www.myfonts.com/fonts/storm/traktoretka/">http://www.myfonts.com/fonts/storm/traktoretka/</a><br><a href="http://haroldsfonts.com/portfolio/oaktag/">http://haroldsfonts.com/portfolio/oaktag/</a> [Fill version]</p>
