    <p>hello again!</p>
    <p>i've now entered the realm of decca - and it is not starting out nicely…</p>
    <p>the ansermet recording of the boutique fantasque must have been rather popular at the time as there is a plentitude of covers for lxt2555 out there;<br>
    on this colourful edition "rossini respighi" &amp; "ballet music" show distinct similarities with renner's 'steile futura' (u.s. marketing name would be 'topic')<br>
    G-maj. does lack the horizontal bar though (a retouche perhaps)<br>
    M, U and C-maj. are very different however<br>
    the C-maj. has more similarity with the infamous DECCA C-maj.<br>
    M-maj. with Erbar or Futura<br>
    U-maj. is bejond my abilities</p>
    <p>the second font is a slab serif which i couldn't identify.</p>
    <p>specimen attached; not the best quality though</p>
    <p>cheers!<img src="/sites/default/files/old-images/1111_5265.jpg][img:sites/default/files/old-images/2222_5506.jpg][img:sites/default/files/old-images/3333_6450.jpg][img:sites/default/files/old-images/4444_4976.jpg"></p>
