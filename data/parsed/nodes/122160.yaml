      <p>i already tried with Bauer Topic - "rossini-respighi" works nicely (the g might just have been retouché)<br>
      i am quite convinced though that "ballet music" is just the same font as in the top line (there is a third line - not depicted here - with the same font just a little smaller)<br>
      i'd love to see a complete font here but i suspect that the C-maj. is actually an O-maj. with cut-outs in the style of the decca-C.<br>
      if one looks closely the U-maj doesn't seem to belong at all - top is in line; bottom too low compared with the other letters;<br>
      same with the M-maj. - a futura with a little bit of editing.</p>
      <p>"la boutique" would be quite a disappointment if not available and or identifiable. reminds me a lot of remaining local 50s shop-signs</p>
