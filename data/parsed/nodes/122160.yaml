      <p>I agree that "BOUTIQUE" lacks a digital version. This is a creation from the photolettering/dry transfer era in which the harsh triangular serifs from a nineteenth century font called "Latin" <img src="/sites/default/files/old-images/LatinNotWide_4862.jpg"><a href="http://www.castletype.com/html/tipoteca/latin-not-wide.html">http://www.castletype.com/html/tipoteca/latin-not-wide.html</a> are pasted on a base font with vertical strokes having parallel sections and a thick and thin _U_.<br>
      Compare to Doric which has softer curved triangular serifs which do not quite match.<br>
      Or "BOUTIQUE" could be made by taking a slab serif font with vertical strokes having parallel sections and a thick and thin _U_, and converting most of the serifs to triangles.<br>
      Don</p>
