      <p>&gt; As a font designer - how do you KNOW when somebody is using your fonts without paying for them?</p>
      <p>I consider font piracy to be when someone buys a font, strips any protection that it might have, even if only the copyright notice, and then sells it for free.</p>
      <p>The practise of cloning the work of others, by copying the work of others, is a long established tradition in typography. I can remember using English Times and Helios on Compugraphic machines, because Linotype owned the names Times Roman and Helvetica. If I recall, the boss even listed them with the Linotype names on the font sample sheets.</p>
      <p>If modifying the work of another is not allowed, then we are all in a lot of trouble, because the ghost of Claude Garamond will be after us.</p>
