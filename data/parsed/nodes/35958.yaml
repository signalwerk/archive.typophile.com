      <p>The time I'd think it would be most helpful to know sales volume would be when deciding which company/ies to distribute your font through. As a designer, you know that you're rolling the dice every time you create a font. So you want as much information as possible. </p>
      <p>For example: my Olduvai is not on the hot list at Veer, and generally sells around 5 - 10 licenses per month (oops did that slip out?). What would Olduvai's sales look like if I went with FontShop instead? Or if I hadn't done an exclusive agreement at Veer and used multiple outlets? Should I change that now? For the record, I've been pleased with Veer, who have given Olduvai a decent amount of exposure in their catalogue over the years.</p>
      <p>I have limited experience shopping my fonts around, but I think companies are more forthcoming as a part of the negotiation process. I imagine, Kris when you signed on with Village, Chester gave you some idea about what might be possible for Feijoa by looking at Corundum or Dolly and how they've been marketed. If not, it would have been a reasonable question.</p>
      <p>All that to say, I'm not surprised that foundries don't post numbers, but it's possible to feel out the situation (where relevant) in a private setting... either dealing directly with the foundry, or with designers who've used that foundry.</p>
      <p>Ok, back to the little gem I'm working on called Deer Sarai.</p>
      <p>Randy</p>
