      <p><cite> I would like to see how I stack up on a “New York Times Bestseller List” of fonts though (even if I’m a long way from the top).</cite></p>
      <p>But what would that prove? One one hand, a bestseller list is just that—top sales. It typically bears little correlation to quality, and could be bolstered by a huge license for a corporation which is dictated by their designer. Meaning that out of 501 licences, 500 could be the corporate license for Germany and 1 could be for J. Smith in Timbuktu. Whereas 300 licenses split many people internationally means that that more are using it for what it is, rather than by Brand Dictation. Y'know what I mean? On the other hand, it may be interesting to see how many people jump on the bandwagon of top-sellers, "oh, it's selling really well—that must mean it's good!" mentality. </p>
      <p>Either way, it seems like an ego thing to want to be in the Top Whatever!</p>
      <p>—K</p>
