      <p>&gt;&gt;Here’s my theory: All type designers secretly worry that anyone can design type as well as they can, and that if people knew what their sales were like that they would instantly create knockoffs of such quality that the original designs would no longer sell.</p>
      <p>Hmmm, I'm not going to knock that theory because I'm a designer too and, while I work hard and am confident in what I do...from a subjective, outside standpoint...what's the REAL incentive in paying GOOD money for that for thousands of business owners who fail to see the forest for the trees and stay afloat anyway?</p>
      <p>I'm not a typographer but can certainly appreciate the hard work and talent it takes to create typefaces. I don't have the talent to do it so I don't.</p>
      <p>But, as a consumer...I don't see that there's a lot of incentive on a wide-scale for another consumer who is NOT a real part of the design community to pay $200+ for a font that looks and operates a lot like a $20 knock-off at myfonts.</p>
      <p>I wasn't a print design major in college and up until my 3rd or 4th year working full-time I was always under the impression that a $20 simply wouldn't technically function for print. Then it did.</p>
      <p>Bottom line: until you can legally protect a font name but not a font LOOK, there's no real incentive for people NOT to rip it off and sell it for $20 other than being shunned by the design community, and there's no reason to pay full price for it other than ethically feeling wrong about driving down the price of good design. So why even bother compiling numbers?</p>
      <p>I don't buy $20 fonts at work for the same reason I don't shop at Wal-Mart. But millions of people do.</p>
