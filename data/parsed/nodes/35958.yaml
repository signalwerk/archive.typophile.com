      <p>One of the maxims of marketing is that you find what you are #1 at and sell the hell out of it. For instance, Veer's recent Typecon presentation clearly shows what they are #1 at, and they were doing a damn good of convincing me that if I needed a script face, I know who to go to.</p>
      <p>The opposite is also true. You don't market what you're not the best at (Unless that's your gimmick. We're #27 in font sales worldwide!). Perhaps a smaller font distributor has lower-ish sales volumes, but makes up for it in higher quality typefaces at higher prices. Volume in terms of units sold then would not matter when compared to another foundry that sells tons of cheap crap.</p>
