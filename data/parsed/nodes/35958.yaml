      <p><cite>Here’s my theory: All type designers secretly worry that anyone can design type as well as they can...</cite></p>
      <p>Given what type designers go through to design a good typeface and the limited financial compensation for the work, your theory pretty much falls apart right there. </p>
      <p>Album and movie sales are publicly tracked because there is a finite amount of space available to them, so distributors and resellers need to know what is doing well to plan how to use that space (Actually the numbers aren’t even publicly announced in most cases, they’re published in trade journals and get republished by the mainstream media). In the case of fonts, space is essentially infinite due to tiny file sizes and relatively low sales volume—it’s not like anyone is keeping a hundred thousand boxed fonts in warehouses—and thus irrelevant. There is no need to worry about how many screens a movie gets, or how many copies of the new hot album will clear out before the next shipment arrives. So it makes more sense for everyone to keep their numbers secret to the detriment of competitors.</p>
    html_clean: |-
