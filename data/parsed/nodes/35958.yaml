      <p>Maybe a comparison to the fashion industry is useful:</p>
      <p>The fashion leaders (aka couturiers) (re)invent clothing a couple of times a year.<br>
      Fashionistas (rich ladies or true fans) buy the expensive products of these events.<br>
      Fashion followers take the commercially viable 'inventions' and adapt them for the next group of followers…<br>
      Early adaptors buy these.<br>
      Middlemarket firms fashion their own versions to sell to the millions.<br>
      These millions buy those rags.<br>
      Meanwhile the whole rigamarole is already in phase two of the next season.</p>
      <p>Meaning: if you, as a designer, wait for the next big thing to get cheaper, you're bound to be a lame follower of fashion.</p>
      <p>___<br>
      Bert Vanderveen BNO</p>
