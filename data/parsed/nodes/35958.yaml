    html: |-
      <p><em>how do you KNOW when somebody is using your fonts without paying for them?</em></p>
      <p>If you are a foundry selling through distributors, it's impossible to know, because they don't report who bought your fonts.<br>
      The most forthcoming of mine provides an email address of the purchaser; they used to give more info, but I believe they stopped doing that and adopted the general practice of not passing on sales information, so that their suppliers would be unable to form lists and market directly, bypassing the retailer.</p>
      <p>(Suppliers may have the right to occasionally audit the sales records of distributors, but in practice that doesn't happen much.)</p>
      <p>So in this aspect of font sales, don't blame the foundries for secrecy, blame the distributors.</p>
    html_clean: |-
