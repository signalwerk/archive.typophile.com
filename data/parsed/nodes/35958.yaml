      <p>I'd say that there is a standard in the font industry exactly the same as platinum records, namely sales. It's just not public. I'm sure that people have their reasons for not publishing the numbers, though.</p>
      <p>One difference might be that with music and movies, you want to see what everyone else is seeing. When using a creative asset, though, you might not want to use the same one as everyone else (unless you are a modernist; then you have to make sure your type looks exactly the same as the whole world ;). There is less motivation to publish the numbers for your font. You want your consumers to think, "Wow, I just discovered the most amazing script font that only I know about. I'm going to use Cezanne on everything!"</p>
      <p>In the case of MyFonts, though, there is so much garbage to sift through that sales volume is used as a filter. The number of sales ends up being a motivator for purchase. The same can be said of the music and movie worlds. The consumer is asking, with so much garbage out there, what should I watch? The box office sales numbers tells them what other people find interesting.</p>
      <p>Another motivator for sharing numbers in the case of the Movie industry is that when people know how huge your movie is, they are more likely to fund your next project. For TV, ratings mean ad sales, so the more public the ratings on the top shows the better. Even in the record business, there is the concept of record deals. If everyone knows you are a multi-platinum artist, you are going to get a better contract next time. These motivations for sharing numbers aren't present in the type industry.</p>
