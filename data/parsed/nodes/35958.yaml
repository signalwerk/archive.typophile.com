    <p>It seems like that in other creative industries people are all too happy to advertise how well their products are selling. The music industry has their charts. Box office sales are all newspapers talk about in the summer. TV likes to talk about its ratings. </p>
    <p>Why then are type designers so shy? Here's my theory: All type designers secretly worry that anyone can design type as well as they can, and that if people knew what their sales were like that they would instantly create knockoffs of such quality that the original designs would no longer sell.</p>
    <p>What does everyone think? Are you shy about giving out your numbers, or do you like to brag about your top sellers? If not, why?</p>
  html_clean: |-
