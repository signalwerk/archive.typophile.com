      <p><em>What if “your” font is retweaked as a free or $10 download somewhere and that’s what this person’s used? How do you keep track of that?</em></p>
      <p>There are some (although not great) legal protections and tweaking anyones font and reselling them is just asking for potential legal problems. We have found knockoffs and dealt with them accordingly. Modifying an existing font is generally known as a derivative work and is generally not allowed by anyones EULA. Keeping track is not easy, but if found, it could be a major problem. I have two words for anyone who feels it is OK to take a commercial font and blend it with another (or just tweak it a bit) and resell it or give it away: <a href="http://www.martinezgroup.com/" rel="nofollow">Frank Martinez</a></p>
    html_clean: |-
