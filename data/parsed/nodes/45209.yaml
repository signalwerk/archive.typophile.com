    <p>Hi guys,</p>
    <p>I am looking for a typeface similar to Neo Sans from Agfa monotype. (<a href="http://www.monotype.co.uk/neosans/" title="http://www.monotype.co.uk/neosans/">http://www.monotype.co.uk/neosans/</a>) The reason why I am not able to use Neo Sans is because it does not have a Cyrillic alternative and so I am forced to find something similar.</p>
    <p>If any of you have suggestions, that would be appreciated.</p>
    <p>Thanks.</p>
    <p>Vlad</p>
