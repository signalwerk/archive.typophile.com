    html: |-
      <p>If you’re on a Mac and FL5 then go to Library&gt;Application Support&gt;FontLab&gt;Mapping and open the standard.nam file and save a copy of it. Don’t change it as FL allows you to have custom files elsewhere. Open the copy in a text editor and you’ll see a Unicode list in the format “0x000 glyph name”. For example: “0x0120 Gdotaccent.”  Make your list in the same format by adding to the copy. Be sure and change the header to reflect that it’s a new file and save it as plain text under a new name with the extension .nam. Then put it in (User Name)&gt;Library&gt;Application Support&gt;FontLab&gt;Mapping. When you start FL it should reflect the additional names.</p>
