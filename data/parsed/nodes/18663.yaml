  html: |-
    <p>I’m not sure if Adam’s around, but maybe someone else might have an idea on this one. I’d like to add some custom Unicode codepoints to FontLab’s Unicode list so that rather than entering the codepoints for each individual smallcap glyph I can use the Glyph &gt; Glyph Names &gt; Generate Unicode command. I use Adobe’s values listed in their <a href="https://web.archive.org/web/20081013185744/http://partners.adobe.com/public/developer/en/opentype/glyphlist.txt" target="_blank">Glyph List</a> and I’d like to add all the smallcap glyph names and codepoints to FL’s list so that they’re available to the Generate Unicode command. So, my question is, where does FL store it’s Unicode list and can it be edited/added-to?</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20081013185744/http://typophile.com/node/18749" class="topic-previous" title="Go to previous forum topic">‹ Quick questions about Type-1 Unique IDs</a> <a href="/web/20081013185744/http://typophile.com/node/18718" class="topic-next" title="Go to next forum topic">Font Agent Pro Workgroup Edition ›</a></div>
