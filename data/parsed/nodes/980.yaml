    html: <p>I used the Sans Serif Font ID Guide and found a sample that seems to meet the shapes of the M, G and S pretty well. It is FF City Street East Bold. (<a href="http://bowfinprintworks.com/SansIDPage03.html" target="_blank">http://bowfinprintworks.com/SansIDPage03.html</a>) shows East Regular, but you could check the FontFonts site to see a better sample with more letters.  <br> <br>That's my vote.</p>
