      <p>I stay away from silver ink now unless it is a large swath - It just ends up looking white or gray. Silver foil, however, is wondeful. But I don’t white see how it applies to this design and foil is a lot more expensive.</p>
      <p>The idea about printing on metallic stock seems like the best one here.</p>
      <p>I’ve seen text with spot varnish over it - it’s a nice effect but it definitely affects the legibility. In looking at this layout it doesn’t seem like legibility is your first concern (no offense intended). It will be tough to get perfect alignment on all this text, especially the thinner deco typeface.</p>
      <p>Best of Luck!</p>
