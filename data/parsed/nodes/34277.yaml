      <p><cite>Hide secret messages printed only in the varnish.<br>
      How much would this affect the legibility of what’s underneath? Would the secret text have to be really big to be readable?</cite></p>
      <p>It would certainly have to be larger than ordinary text, and heavier, but not too heavy. I woldn’t suggest going smaller than a 12pt medium weight. And there of course would have to be a significant step between the varnish gloss and the paper finish. </p>
      <p>You could also add texture with thermographic embossing, using the clear varnish as glue for the powder (instead of ink as is usually done). I’ve seen this done on packaging before. It’s a pretty neat effect.</p>
    html_clean: |-
      <p><cite>Hide secret messages printed only in the varnish.<br>
      How much would this affect the legibility of what’s underneath? Would the secret text have to be really big to be readable?</cite></p>
      <p>It would certainly have to be larger than ordinary text, and heavier, but not too heavy. I woldn’t suggest going smaller than a 12pt medium weight. And there of course would have to be a significant step between the varnish gloss and the paper finish. </p>
