    <p>I’m designing an 20’s style art deco-ish cd and I’m thinking about using either silver ink or spot varnishing, but I’ve never really done something like this so I come to you guys for advice.</p>
    <p>The cd for a musical based on the life of Peter Lorre. The cover art concept I was given is a play on an old grayscale poster of one of his movies with a dash of red thrown in. Since this was all we had at the beginning, I’ve been thinking about printing it in Black, PMS135 &amp; Silver ink and have done my design so far in a way that could be converted to that. I posted <a href="http://farm2.static.flickr.com/1357/533386131_54a522a53a_o.png">a sample spread</a> (in progress! don’t critique too much!) </p>
    <p>I was inspired by the <a href="http://www.amazon.com/Spider-Fly-Mary-Howitt/dp/0689852894/ref=pd_bbs_2/102-0806386-0929754?ie=UTF8&amp;s=books&amp;qid=1181143938&amp;sr=8-2">The Spider &amp; the Fly</a>) children’s book which states it was printed in a black &amp; silver duotone, but I’m not sure quite what I’d want to do with it.</p>
    <p>When I went back to look at this book again, the effect wasn’t as impressive as I thought. This got me thinking about spot varnishes. The look we’re going for in the booklet is very rich black, lots of gradients multiplied over gradients, angular, art deco.</p>
    <p>So it’s kind of just me doing this, at least on the art direction side and since I’ve never done “special inks” I’d like to get other ideas or experiences. If we go with silver, would it be worth it? How noticeable would it be? If I do spot varnishes, where would I do them? The song titles? The black boxes? In different boxes to add another layer of fun confusion? What sort of spot varnish treatments have you loved? I really want this to look great and not just like some black ink on paper and I’m really flying solo in all these ideas because none of the other people I’m talking to/working with can envision it...so thank you all in advance for at least letting me bounce ideas off of you.</p>
