      <p>Brian: to get paper samples fast, talk to your printer. They probably have a cabinet full of samples and swatchbooks. (Or check your local paper merchant.) They’ll also know if any of the papers are readily available. I don’t know why they wouldn’t be available to you. Shine is a product of Reich Paper, headquartered in Brooklyn. Wausau Paper is headquartered in Wisconsin. They both have websites (www. company name including the word “paper” as one word .com for both) but I find getting a feel for paper off a website is very difficult.</p>
      <p>Tim: I used Metal F/X for the dust jacket of a photography book. Design was a very large photograph letterboxed with a fifth color (a warm grey) chosen to complement the palette of the photo. Client decided, at the last minute of course, to change the fifth color to their corporate color (basicly reflex blue with bit of magenta). I didn’t like the new color combination and was bitching to the printer, who suggested that Metal F/X would bring the tonal range of the photo and the corporate color closer. It worked great as a compromise. Photo-Boy was okay with metallic sheen and changed color palette of his photo. Client agreed the metallic sheen was pretty, even though it wasn’t his corporate color anymore.</p>
      <p>Lex: Sorry, buddy. Didn’t realize you were into paper. I’ll let you know next time.</p>
