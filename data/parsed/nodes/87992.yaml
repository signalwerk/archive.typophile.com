    <p>I designed this typeface for a class assignment in school and would be grateful if you'd let me know what you think of it. I call it an experiment because of its rigorous construction principles: among other constraints, only vertical strokes are allowed to be thick, all angled strokes have one determined direction (N-E) and so on. I realize that such rigidity will never result in a highly legible typeface, but I was curious to see what comes out of it nevertheless.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/asdf_resize_3561.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hexa_kant-01_resize_5300.jpg"></div><p></p>
