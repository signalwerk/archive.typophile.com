      <p>Very nice work! I'm generally not a fan of such modernized blackletters but I think this one works very well in print—especially with the vertically textured paper you used.</p>
      <p>As for the 'r', I very much like the r_e ligature but with combinations like r_d I don't think it works well. I was actually about to suggest using a rotunda r inspired solution but Andreas mentioned that already.</p>
