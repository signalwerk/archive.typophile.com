    html: <p>Thanks a lot for your suggestions, hrant. The reason for not introducing more gaps was in fact closely related to the abundance of ligatures. As in most cases the 'r' (and sometimes the 'f') combines with its neighbour creating such a gap, having the characters already 'gapped' would generate serious diffculties. These compromises are, by the way, what I meant by 'far from optimal'. I should add though, that creating <a href="http://dl.dropbox.com/u/30959735/340946_2130063092044_1259990333_31838426_992141830_o.jpg" rel="nofollow">ligatures</a> was a fun part.</p>
