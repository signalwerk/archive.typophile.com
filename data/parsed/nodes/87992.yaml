    html: <p>Thanks for your kind words, Andreas. I certainly agree with you regarding the problematic points, most of all the case of 'r_e'. In fact, because of the huge white spot the 'r' creates in running text, I ended up design a ligature for every 'r-' combination, which is admittedly far from an optimal solution :)</p>
