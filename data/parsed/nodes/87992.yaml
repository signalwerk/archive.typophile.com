      <p>I think this is well beyond the stage of experiment. It looks like a very worthwhile exploration to me. It has not only merits as such but also high potential for an actual typeface. The legibility is perhaps better than one would suspect.<br>
      There are some witty ideas for details (s, k, ß), yet some tricky bits as well (accents, r_i, z).<br>
      I hope you’ll go on with it!</p>
