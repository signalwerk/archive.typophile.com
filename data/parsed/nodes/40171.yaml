  html: <p>This is about packaged files that I received from my art director. When he packaged the font DIN and I open it, the info says that it is 0 kb and there is no file extension. I can't load it in Fontbook or Suitcase. Any suggestions? Thank. Oh and if this is posted somewhere else please let me know. I am new on this board and haven't really browsed around too much.</p>
  html_clean: <p>This is about packaged files that I received from my art director. When he packaged the font DIN and I open it, the info says that it is 0 kb and there is no file extension. I can't load it in Fontbook or Suitcase. Any suggestions? Thank. Oh and if this is posted somewhere else please let me know. I am new on this board and haven't really browsed around too much.</p>
