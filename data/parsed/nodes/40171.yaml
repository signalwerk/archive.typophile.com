    html: <p>If they are Mac suitcase files, then, most likely, the resource fork (part of the file) was lost. In Mac font suitcases, this is where all the data is stored, which is why the files are 0 kb. This can happen if the files were transfered to some non-Mac file system. Non-Mac file systems cannot "see" the resource fork and it doesn't get copied.</p>
    html_clean: <p>If they are Mac suitcase files, then, most likely, the resource fork (part of the file) was lost. In Mac font suitcases, this is where all the data is stored, which is why the files are 0 kb. This can happen if the files were transfered to some non-Mac file system. Non-Mac file systems cannot "see" the resource fork and it doesn't get copied.</p>
  - id: 247369
    user: 1043
    date: 2007-12-18T09:50:00
    date_raw: 18 Dec 2007 — 9:50am
    votes: null
    html: "<p>One other thing: If the font suitcases were emailed, you can lose the resource fork that way, too. The best solution, if the fonts are to be transfered over the internet, is to compress the files using StuffIt or use OS X Finder's \"archive\" feature to create a .zip file containing the fonts. When the fonts are uncompressed on the receiving end, the resource forks will be intact. (This is all assuming the computer on the receiving end is also a Mac.)</p>"
    html_clean: "<p>One other thing: If the font suitcases were emailed, you can lose the resource fork that way, too. The best solution, if the fonts are to be transfered over the internet, is to compress the files using StuffIt or use OS X Finder's \"archive\" feature to create a .zip file containing the fonts. When the fonts are uncompressed on the receiving end, the resource forks will be intact. (This is all assuming the computer on the receiving end is also a Mac.)</p>"
