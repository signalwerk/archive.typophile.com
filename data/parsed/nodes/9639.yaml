  html: <p>I think the logo is most likely done by hand, but the text used on the packaging of the game is not. I was wondering if anyone could ID this font. The sample contains the logo, but the ID is for the text underneath (unless someone IDs the logo as a font). <br> <br><img src="http://www.typophile.com/forums/messages/83/66823.jpg" alt="Neverhood Text"> <br> <br>Thanks again!</p>
