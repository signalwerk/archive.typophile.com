    html: <p>You're right, the Logo looks hand-drawn, since no two letters are identical. <br> <br>However, the lettering underneath that is a font, although as Lex suggested, this may be a personal font, since fonts based on hand printing are so cheap to make. <br> <br>If this is a font I have collected I would most likely have put it in <a href="http://bowfinprintworks.com/Script14Pg1.html" target="_blank">Part 14 (Strange, Distressed scripts) of the Script Font ID Guide</a>. Part 12, that he pointed you to, is also a possibility, if you don't see it in Part 14.  If you don't see it in either of those places, my advice is to pick something similar. I don't have time right now, or I would help.</p>
    html_clean: <p>You're right, the Logo looks hand-drawn, since no two letters are identical. <br> <br>However, the lettering underneath that is a font, although as Lex suggested, this may be a personal font, since fonts based on hand printing are so cheap to make. <br> <br>If this is a font I have collected I would most likely have put it in <a href="http://bowfinprintworks.com/Script14Pg1.html" target="_blank" class="link-external">Part 14 (Strange, Distressed scripts) of the Script Font ID Guide</a>. Part 12, that he pointed you to, is also a possibility, if you don't see it in Part 14.  If you don't see it in either of those places, my advice is to pick something similar. I don't have time right now, or I would help.</p>
