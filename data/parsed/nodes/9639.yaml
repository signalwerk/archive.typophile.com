    html: <p><a href="http://www.fontifier.com/" target="_blank">Fontifier</a> will let you download a template, print your letters in it, scan and upload it, have the font produced and download it -- all for $9 (US). It's hard to beat that deal, although for a while they were doing it for free when it was a new service. I think if you're quick the whole process can take just minutes.</p>
