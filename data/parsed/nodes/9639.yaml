    html: <p>Do you need to find the exact font or just a similar looking one? In any case, I would suggest <a href="http://bowfinprintworks.com/Script12Pg1.html" target="_blank">Mike Yanega's Guide</a> as a starting point. <br> <br> - Lex <br> <br>P.S. There is a ton of fonts out there that look similar to this, and you can get one made for under ten dollars, so this may be custom.</p>
