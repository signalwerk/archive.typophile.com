    html: <p>Thanks for the help guys. I wanted to get the actual font for nostalgia's sake, but I think you're right in that it would've been a personal one. Anyway, thanks to those links I can find a similar one anyway. Although, if anyone manages to find the actual one, please let me know. <br> <br>Also, I live in Australia, so would any of you know any places or links, that would help me in purchasing fonts or getting someone to make one of my own professionally? I wanted to get some handwriting made into a font. Wondering if it's possible for me here in Australia. <br> <br>Thanks guys.</p>
