    <p>Hi there!!</p>
    <p>I was testing my fonts in CorelDraw x13 and had a big surprise! I couldn't find anywhere to acess opentype features such as stylistic alternates and discretionary ligatures... actually, when I searched the help in Corel, I didn't find anything related to "opentype" or "open type". In the section of font formats, in help, OT doesn't even appear. Too weird...</p>
    <p>My AFTER fonts (<a href="http://www.myfonts.com/fonts/bytype/after-headline/" title="http://www.myfonts.com/fonts/bytype/after-headline/">http://www.myfonts.com/fonts/bytype/after-headline/</a>) have lots of special ligatures that aren't encoded, so I can't even acess them in the INSERT SPECIAL CHARACTER box because the software only shows encoded gliphs :/ dammit Corel!!</p>
    <p>Is Corel indeed like this or someone knows how to solve this?</p>
    <p>thks!!<br>
    Fabio</p>
