    html: |-
      <p><cite>with no unicode assignment at all?</cite></p>
      <p>Well, it depends.<br>
      The bad thing about insertig PUA characters is, that you will mess up the text. You cannot change the typeface, without having wrong characters, spell checking won't work and so on.<br>
      But if you design a display typeface this is not so much of a problem. And if you know your customers will use CorelDRAW you may rather do the wrong thing ... and make your customers happy.</p>
      <p>Ralf</p>
