    html: |-
      <p>Using PUAs in retail fonts is generally a bad practice, so you should avoid it.<br>
      <a href="http://www.typophile.com/node/16858" title="http://www.typophile.com/node/16858">http://www.typophile.com/node/16858</a></p>
      <p>FYI, Adobe has abandoned the practice of assigning PUAs on new fonts:<br>
      <a href="http://blogs.adobe.com/typblography/2006/05/eliminate_priva.html" title="http://blogs.adobe.com/typblography/2006/05/eliminate_priva.html">http://blogs.adobe.com/typblography/2006/05/eliminate_priva.html</a></p>
