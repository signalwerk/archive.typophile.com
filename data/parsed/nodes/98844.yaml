      <p>Hrant, one of the things that makes laying out a book challenging is that one is generally forced to work with tools that one did not make oneself, and which may be limited in various regards. A complex text is indeed a challenging thing to work with, without the relative freedom of creating one's own typeface to fit. I spent much of the past four years working on the Brill fonts, but I never forgot that my challenges derived from the challenges that Brill's typesetters had struggled with for 325 years of scholarly publishing.</p>
      <p>Whether this means that 'nothing is as challenging as laying out a book', I'm not so sure. My wife is a firefighter.</p>
