      <blockquote><p>What i was initally asking was if i technically could, and from usability view should exchange the old style figures if i activate all caps in indesign.</p></blockquote>
      <p>Technically, it's possible to add whatever rules you want; functionally, changing the figures from oldstyle to lining is one of the <a class="freelinking external" href="http://www.microsoft.com/typography/otspec/features_ae.htm#case" rel="nofollow">recommended effects of the <code>case</code> feature</a> (though, of the few fonts that I tested, only Garamond Premiere Pro seemed to support it).</p>
      <p>Re: case changing— InDesign's All Caps function doesn't change the case of the underlying text (in IDML, it simply adds the parameter <code>Capitalization="AllCaps"</code> to the enclosing element). I think Sebastian's point was that the effective change in case is handled by the application, rather than the OpenType features that also get triggered by activating All Caps.</p>
    html_clean: |-
      <blockquote><p>What i was initally asking was if i technically could, and from usability view should exchange the old style figures if i activate all caps in indesign.</p></blockquote>
      <p>Technically, it's possible to add whatever rules you want; functionally, changing the figures from oldstyle to lining is one of the <a class="freelinking external link-external" href="http://www.microsoft.com/typography/otspec/features_ae.htm#case" rel="nofollow">recommended effects of the <code>case</code> feature</a> (though, of the few fonts that I tested, only Garamond Premiere Pro seemed to support it).</p>
