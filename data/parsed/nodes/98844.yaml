    <p>Dear readers,</p>
    <p>i'm wondering how the "ALL CAPS" formatting in Indesign (not the "Change Case &gt; Uppercase" function) should behave.</p>
    <p>What i can see from testing in CS5, it applies the CASE feature (with positional changes) if found in the font, and it exchanges lowercase to upper case letters in a hard-coded way (independent from the font). Is this all it can do, or is there possibility for more if done in a smart way?</p>
    <p>In specifics, i'm wondering if a font with default oldstyle figures should/could change them to lining figures when the formatting is applied, and if it's possible to let this happen with otf logic.<br>
    To compare: for the small caps button, the SMCP feature is applied, and if the otf font is set to exchange the figures in this feature along with the letters, they are changed too. So is it possible to do something similar with the All Caps button, or is this just and only old-school hard coded indesign?</p>
    <p>thanks for your ideas<br>
    Sebastian</p>
