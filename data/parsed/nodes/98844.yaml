      <p><cite>However if you were ever to make a font, especially a text font, especially one that other people would pay good money for, you'd probably change your mind.</cite></p>
      <p>Mirror thinking, hhp. I have fixed fonts that people offer to pay good money for, but that's not permitted, usually. I have given the fixes to the designers -- some of the names might surprise you -- and seen them incorporated in new releases.</p>
      <p>As for making a tool, the biggest challenge in type design today -- my point of view -- would be making up a font family that isn't a rip-off of exiting fonts. Just look at the comments on these forums.</p>
      <p>Most of your <cite>tools</cite> haven't been tested before being rushed into the marketplace. The practice goes all the way back to early photocomp &amp; continues today in the digital era. How can anyone design a (purported) text font without seeing how it prints on several kinds of papers?  Yet that's the exception, rather then the norm. More testing seems to be done with web fonts, which seems passing strange, since most web systems don't yet support typography.</p>
      <p>We have more than enough "raw material" tools. Just very few finished ones that actually work well.</p>
      <p>Finally, I look at money as a battery or a capacitor. It's a way of storing energy. If you have enough, getting more "money" becomes  a religious matter, and that's not my religion.</p>
