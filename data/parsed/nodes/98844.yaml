      <p>Mr Nagel -- and others:</p>
      <p>I think you have the wrong notion about what OT features accomplish. What I see here is the notion that type will look as you, the type designer, want it to look.</p>
      <p>Well, the glyphs, yes, sort of. Nothing else. What features do is to save handwork for the person who actually uses type. We say "thank you" for everything that can be automated through features, right up to the point where you add a routine that does something we really don't want.</p>
      <p>At that point, we have to stop using the feature at all, meaning all those "thank yous" disappear. Instead, we curse you for making handwork out of what use to be automatic.</p>
