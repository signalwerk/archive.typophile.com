      <p>For marks, I make alternate glyphs for the case feature.<br>
      As I design lining ﬁgures to work in a mixed case setting, they are generally too much like lower case glyphs to work in an all-cap setting, so I do a separate set of “.case” ﬁgure glyphs.<br>
      Sometimes it’s necessary to do two complete sets, one proportional and one tabular, but often I try and make do with the default set as tabular, and only /0, /1, and /7 proportional and kerned.</p>
