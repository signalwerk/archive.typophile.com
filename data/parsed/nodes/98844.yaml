      <p>Sorry for picking on that email from Extensis, Thomas, I just happened to get it the same day as this thread. No font distributor is immune to slip-ups, not to mention foundries.</p>
      <p>However, the issue here does not have a technical solution.</p>
      <p>In the ﬁrst place, it’s careless copywriting to begin a sentence with a number (unless spelled out)—it creates too many typographic problems. It could have been written  “THE YEAR IN REVIEW”, after all, what year other than 2012 is likely to have been the topic?</p>
      <p>Secondly, if the font chosen has OSF as default—even if it were a “real” web font with a supported “case” (All Caps) feature—there is nothing other than typographer savvy to guarantee lining, cap-height ﬁgures. This is because (a) all-cap text may be typed with the shift key rather than the caps lock key, and (b) the “all caps” feature might only have been applied to the letters, not the numbers—they not being caps!</p>
      <p>Thirdly, many fonts with lining ﬁgures as default have only three-quarter height and weight, and are not a true match for capitals.</p>
      <p>Of course, there is always this fail-safe option:<br>
      MMXII: THE YEAR IN REVIEW</p>
      <p>Perhaps the only technical salve to this issue would be a prompt <strong>in the layout application</strong> that called attention to mismatched heights in text with adjacent all-cap/ﬁgure characters.</p>
      <p>Typographers/Compositors—can’t do without ’em, eh Charles?!</p>
