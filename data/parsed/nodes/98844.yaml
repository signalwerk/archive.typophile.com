      <p><cite>Typographers/Compositors—can’t do without ’em, eh Charles?!</cite></p>
      <p>Well, even though Nick's tongue is likely a bit bloody and sore -- especially if he had a laughing fit -- that's my position. It should probably be noted there are a few people like Kent Lew who are type designers, book designers, and *real* compositors, all rolled into one person. I only design and set books, I have absolutely no interest designing type. Now fixing type's another matter. Fixing type's kind of like Sudoku. Nothing is as challenging as laying out a book though, with compromises on every page.</p>
      <p>* * *</p>
      <p>Nick brings up a good point. Full-height lining figures should be available. More than one use/need for them.</p>
      <p>Sometimes, as with Matthew Carter's Miller, they already exist, but for some reason were not included in the basic font. (Same is true for os figs in Miller, too.) Well, that's probably because Carter &amp; Cone only sold Type 1 fonts, but you could get them as a supplemental font(s) for $50 or so if you knew to ask.  Don't know if FB has the same policy, esp. as they've made up OT versions of Miller... </p>
      <p>For those designing fonts for multiple uses, make 'em available. Charge more if you want. I'd gladly pay, it takes me over a hundred dollars in my time to make up both sets of os figs, especially the 2, 3, and 7. More if you really do justice to the tabular os figs.</p>
      <p>Finally with respect to figures, I'm coming around to the point of view that small cap figures should be available too, if you include small caps in a font. Keep running into acronyms with numbers in them. Nothing else looks right in that case. I've yet to find a need for tabular small cap figs.</p>
