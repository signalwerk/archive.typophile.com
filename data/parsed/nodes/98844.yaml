      <p>John, laying out a book is inherently a compromise. Spreads should align. Widows and orphans should be banished. So do you run a page short? Even with running feet? Do you make/save a line &amp; affect the word spacing? How does that affect the next spread?</p>
      <p>Etc.</p>
      <p>Editors add their own limits to available compromises, usually with the mistaken notion it is "better" typography. Don't hyphenate the last word on a page, or the last word in a paragraph. Not hard, but where do they think the space comes from to achieve that? From the word spacing, of course.</p>
      <p>Or the designer specifies "all chapters start verso" with the understanding by the editor there will be no blank rectos...</p>
      <p>And editors have this silly notion that the comp shouldn't rewrite the text...</p>
      <p>Then there are editors who let an author call 3-4-5 tables or figures right before a new subhead. Basic thinking is tables &amp; figures should be placed after their callout (or on the same spread at least), but before a new section (subhead).</p>
      <p>All this before the (interior) designer mucks things up -- like you said -- by choosing a typeface inappropriate to the work, (&amp; just here, I'll reserve "inappropriate" for the character compliment of the font itself). Last week, we had a book where there were a lot of italic superscripted numbers. That was the author's requirement. The font chosen by the designer? Quadraat... Good luck finding Quadraat serif italic lining figures for those superiors...  </p>
      <p>But yes, firefighting's probably harder. Certainly more dangerous.</p>
