      <p>charles_e, i'm with you – as a type designer i can't control everything what i would do as type user (what I am to a large extend).</p>
      <p>What i can't deliver as a type designer today is a set of lead with no further settings – there is always a "default" behavior – my spacing, my kerning, my decision for default figures, etc.  also, the software we are using, has default behaviours, for example, Indesign by default exchanges "abc" to "ABC" when i hit the all caps button.</p>
      <p>What i was initally asking was if i technically could, and from usability view should exchange the old style figures if i activate all caps in indesign.<br>
      The type user wants capital setting, but indesign only delivers this for letters in a hard-coded way (which is good for some fonts) – except i tell indesign that my font is capable of something more, that is likely more desirable from the users point of view. (or do you prefer to manually set the figures to lining right *after* you have already hit the all caps button?)<br>
      Its the same with capital spacing ... i have one default behaviour for capitals – to work with minuscles well. If the user hits the all caps setting, what he wanted is to have a line of capital letters and he'll get that the one or the other way. As a type designer i can give him an arbitrary one, resulting from the spacing with minuskels, or a better one with adjusted spacing. He can still decide to override this manually, but what i try to do is make it  – by probability – a little bit easier, doing less overrides.</p>
