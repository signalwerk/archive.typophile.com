    html: <p>Christian, I just upgraded to a Mac Book Pro laptop. But I use it more as a desktop machine. Meaning it mostly stays plugged into a large monitor and USB keyboard, plus a speaker system and ethernet. When I want to get away, I just unplug and go. It’s the best of both worlds.</p>
