  html: |-
    <p>Hi,</p>
    <p>I have been drawing sketches of typefaces for a long time and I would like to learn to turn my ideas into digital fonts. I currently own a laptop running Ubuntu. I haven’t searched seriously, but I doubt there a lot of interesting tools for typographical design on Linux. (Prove me wrong if you wish!)</p>
    <p>So I am considering getting a new mac. My question is this: what components of the computer should I consider for the specific task of designing typography? For example, </p>
    <p>- Does designing a typeface on a laptop somehow affects the working habits of a designer?<br>
    - Is a large screen essential to perform this task? Can you get away with a 15” or 12” screen?<br>
    - Are the type-design softwares typically hungry for RAM or processor speed?</p>
    <p>So basically, I am asking for advice to put together a nice and effective workstation for type design. </p>
    <p>Thanks!</p>
    <p>Ch.</p>
