    <p>No, this doesn't mean we have a mime for an auctioneer although that does have a certain appeal.</p>
    <p>As posted at <a class="freelinking external" href="http://typophile.com/node/45994" rel="nofollow">http://typophile.com/node/45994</a><br>
    During the conference we will be auctioning off some unusual items such as metal type matrices, letterpress broadsides &amp; books, a deluxe BluRay version of the Helvetica film and even a one-of-a-kind ceramic vase by Zuzana Licko. A list is being compiled but additional items are welcome. All items will go home with the lucky (or skillful) high bidder. Donations are tax deductible and can be brought to TypeCon or mailed in advance. All proceeds go towards future SOTA &amp; TypeCon activities.<br>
    <a class="freelinking external" href="http://typecon.com/" rel="nofollow">http://typecon.com/</a></p>
