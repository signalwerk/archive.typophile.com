      <p>The best pdf specimen I’ve seen lately is Jeremy Tankard’s <a href="http://www.typography.net/type/font/kingfisher">Kingfisher</a>. It contains a 12-pages essay about the concept and development of the typeface set on spreads (double pages), so if you print it you can have a real example of text setting.<br>
      I also like the specimens made by students at the <a href="http://www.typefacedesign.org/2008/">Reading University</a></p>
