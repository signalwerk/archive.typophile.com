      <p>Since all I ever deal with (well, 95%) is text types for books, I’d like to see type specimens that look like books. That is:<br>
      **  full paragraphs,<br>
      **  24-26 pica line length,<br>
      **  a combo of justified and ragged,<br>
      **  all the figures,<br>
      **  all the small caps and other specials (but I don’t need to see all the accented sorts),<br>
      **  all the weights (of course, I’ll use only text weight, a semibold, and a display weight),<br>
      **  and, as Nick mentioned, a variety of size and leading,<br>
      **  smalls and italic set within the roman to see how compatible their weights are.</p>
      <p>Go to a library with a good printing section, and see if you can see the 3-volume specimen set from Kingsport Press circa 1960. Monotype Baskerville is a good example of how they show a book face. There is a single page that shows the roman and italic sorts at 6, 7, 8, 9, 10, 11, and 12 point. These pages also show the character-per-pica count and the roman alphabet length. Following each of the full-alphabet pages we see the face set at  6 solid, 6/7, 6/8; 7 solid, 7/8, 7/9; 8 solid, 8/9, 8/10; 9 solid, 9/10, 9/11; 10 solid, 10/11, 10/12, 10/13; 11 solid, 11/12, 11/13, 11/14; 12 solid, 12/13, 12/14, 12/15. At a line measure of 22 picas justified. The paras show italic, smalls, and all caps.</p>
      <p>Specimens such as these were an immense help to designers. Since type was not at all mutable, such data as the cpp count and roman alpha length were set. Therefore, with all this info, a good designer could cast off a book to a very accurate degree. </p>
      <p>I realize this is an unattainable goal these days; economics are against it. But something approaching this is a help.</p>
      <p>So is an offset-printed specimen. I purchased an expensive font family from a small foundry a while back. I based my purchase on what I saw on screen, and on laser proofs I had to badger the foundry to send. I found I did not like the look of the face quite so much when I printed a book with it.</p>
      <p>Perhaps the possibility of seeing acceptable specimens of book faces is why I have slowed down adding types to the library of late. I hate to do it, but I want to know pretty well what I’m getting.</p>
      <p>powers</p>
