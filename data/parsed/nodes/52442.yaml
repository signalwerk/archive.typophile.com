      <p>I second the comment made by genericboy regarding Quincunx’s specimens. Effective and clean yet still acutely artistic. Not to mention another important aspect of his specimens: they’re well-protected from extraction. I love to see that and wish it would be some kind of unspoken ordinance for designers ... a dream that seems to continue falling on the deaf ears of those unaware of how prevalent pdf extraction is in the piracy community. </p>
      <p>If you don’t know how to prevent such extraction, FIND OUT before ever beginning your first specimen. Every time I open a .pdf I go to the properties menu and check which fonts are used in the file ... a reflex I developed after seeing a specimen of a font someone called something like “Tamara” in the speciment text but according to the properties listing had called “superbitch” when saving it. Even though having milk come out of your nose is unpleasant, seeing something so funny has resulted in my catching all kinds of interesting things regarding names, etc. Regardless, it only takes an extra 17 seconds to employ this kind of protection and I’ve yet to hear a reasonable argument against it. Even if piracy did not thrive on pdf extraction, why not just take the extra measure anyway?</p>
