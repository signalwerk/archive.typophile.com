      <p>I quite enjoyed the Specimen PDF that came with <a href="http://www.yanone.de/cgi-bin/download.pl?file=kaffeesatzpdf">Yanone Kaffesatz</a></p>
      <p>I also have enjoyed the various settings and graphics for <a href="http://www.adobe.com/type/browser/landing/hypatia/hypatia.html">Hypatia Sans</a></p>
      <p>For some fun Specimens from Underware check <a href="http://www.underware.nl/download/auto/pdf/auto-press-announcement.pdf">Auto</a>, <a href="http://www.underware.nl/download/sauna/pdf/sauna.pdf">Sauna</a>, and <a href="http://www.underware.nl/download/bello/pdf/bello.pdf">Bello</a></p>
      <p>As for what I think makes a good specimen?  One that shows off the typeface in an environment that makes the typeface look the best it can.  Here’s a simple checklist of the basics:<br>
      <em><br>
      - does it show off all of the characters in the set</em></p><em>
      <p>- does it show the typeface properly set</p>
      <p>- does is include imagery that matches the typeface (if any imagery at all)</p>
      <p>- does it use a variety of contrasts to show off the typeface (colour, size etc etc)</p>
      <p>- does it include the typeface set in a realistic way somewhere so they can see what it will honestly look like when they go to use it for some mundane setting</p>
      </em><p><em>- does it make you want to buy the typeface all over again<br>
      </em><br>
      I hope this helps, and for the record we’re a bright cheery helpful community here, enjoy your stay!</p>
