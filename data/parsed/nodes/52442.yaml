    <p>What makes a good type specimen document?<br>
    What are the required basics.<br>
    What kind of extras are popular.<br>
    Should they be completely serious?<br>
    Should it include gallery style images of the use of the type in question?<br>
    Does anyone have links to those specimen documents they find exceptional?</p>
