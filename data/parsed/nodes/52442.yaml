      <p>Whether print, PDF-printable, or online interactive, I prefer type specimens that refer to the genre of type specimens, rather than being faux versions of other kinds of document.</p>
      <p>For print specimens, it’s important to show what the typeface looks like at specific sizes, as this is the most help for typographers in imagining how it will look in use. Sure, these days we have wysiwyg, but all the more reason to have a printed specimen to elucidate the distinction between a laser-print made in one’s studio, and “real” typesetting as printed by offset lithography.</p>
      <p>The new MyFonts “type tester” interface is awesome, but there are other ways that testers can show type uniquely—I especially like how Darden and Dalton Maag foundries allow comparison of types of the user’s choice, side by side. For my site/type tester, I tried to get the feel of a large page with lots of white space, not boxing in the type.</p>
