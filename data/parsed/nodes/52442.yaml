      <p>Actually, seeing Jelmar (Quincunx) posting here has reminded me that <a href="http://www.typehigh.nl/">his own type specimens</a> were recently pointed out in one of the battle threads as being particularly good. In particular, check out the <em>sixtypound</em> specimen under <em>type design</em>.</p>
      <p>I don’t have a huge mental repository of type specimens like many Typophiles seem to, so I can’t really point to any specifics other than the one above. That said, as a designer, I find that the typefaces I purchase on impulse are ones which have a really strongly designed specimen like this. As Tom said, I think it really helps to see instantly how somebody has actually used the face. To a designer at least, typography is only partly about actual letterforms - the context they’re used is obviously of immense importance.</p>
      <p>Hope this is of some small help!</p>
      <p>Take care, Andi</p>
