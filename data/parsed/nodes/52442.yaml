      <p>&gt; <em>Not to mention another important aspect of his specimens: they’re well-protected from extraction.</em></p>
      <p>I think I actually just converted the fonts to curves, which is not really the ideal solution for type. It does indeed prevent people from ripping the PDF, but it also removes all the hinting and such. But I decided to do it anyway (since the specimen in question contain mostly large text sizes).</p>
      <p>But there are also ways to secure a PDF, in a way that prevent you from placing the PDF in InDesign, opening it in Photoshop or ripping it through Distiller. Though, I don’t know if it prevents extracting fonts too, since I have no idea how that is done.</p>
