      <p>Oh my ... given the nature of the crowd here, phrostbyte, I offer you my pre-emptive sympathy and implore you not to allow subsequent posts - if there are any - to bring you down or discourage you. I’m only hoping one of this site’s real champions manages to find his or her way over to this thread and can provide you with their valuable insight.</p>
      <p>My less-valuable insight: I’ve always been rather impressed with specimens that manage to visually match the theme of the font itself without going hideously overboard. For example, if your typeface is a circus-themed display face, you could perhaps as a background use a collage of circus visuals (pictures, paint, etc.) with an especially dominant center (clown, perhaps?), sepia-tone it, set it at maybe 15-percent transparency and then display your font. </p>
      <p>If you prefer something even more conservative, consider using a cut-out ferris wheel as a cover with the font’s name inside it and all-white background, and just put in the bottom right corner of the following pages a stand-alone clown or other circus icon, perhaps with a slight bevel or shadow. You have your own artistic sense, so you can do it. I just feel matching the font’s theme works well. I’ve seen several gorgeous specimens for book/text-engineered fonts that incorporate pictures of opened books shot at various extreme angles and set on an all black background with the type displayed in white.</p>
      <p>As for basics, you will likely hear several different opinions. Already I can hear one you’d almost certainly have received if I didn’t just mention it here: it depends on for whom it’s being created. Yeah, thanks buddy - ’preciate the educated response. My opinion is a bit more streamlined: create 2-4 specimens of varying size but make sure they all match (in color, use of graphics, art, etc.) Make a single page with just the type’s name and perhaps a sentence or two describing who you are, and why it was created. Then make one a few pages larger and include a basic character set. After that go even larger and include full-page presentations ... meaning, cover, character set,  pretty third page with your font in action but not splattered all over the page, and a purely artistic final page. Then at the end make a big mondo-sized specimen and blow that sucker up. I’ve seen some specimens with a single letter per page! I think if you keep the theme the same, making multiple specimens would be easier and would certainly keep you prepared for anything you might encounter or need. It may be you never use two of the four. Or maybe you send the big daddy only to prospective vendors, etc., and use No. 2 on a sale page.</p>
      <p>As for the rest, there are tons of links out there to specimens, which you can find rather easily if you have advanced knowledge of Google.</p>
      <p>Good luck.</p>
