      <p>Hey there, Josh,</p>
      <p>While I like the variations 1a through f very much, still I feel they are not the potentially iconic mark the salon looks for. Maybe that's because of the ornamented treatment you use. Correct me if I am wrong, but isn't iconicity rather related to visual simplicity? In that sense, the 'sixteen O nine' sketches do a better job. The O could be the very icon you are looking for.</p>
      <p>You say the salon wants it's quality and attitude reflected, so maybe a bold choice for a very simple mark might be the thing. To my eyes the ornaments have a hip feel, but will they be as hip three years from now? Using a relatively simple logo and allowing some time for it to be filled with meaning may be a much better choice.</p>
      <p>Still, I enjoy looking at the ornaments... :-)</p>
      <p>----------------------------------------------------<br>
      My work is a game. A very serious game [M.C. Escher]</p>
