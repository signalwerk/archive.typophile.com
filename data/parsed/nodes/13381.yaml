      <p>formlos- Danke sehr fur dein Vorschlag. Ich habe dieses Variation gemacht und es schaut sehr schwerfallig. Ich habe die "6" und "9" Charakter ein bisschen gedreht, aber habe ich kein Gluck.</p>
      <p>dan - I am not really a big fan of script faces. If they are in some kind of vogue, i would have to see the application to decide. For this project the client and I believe on creating a strong presence, that has some visual mass with a bit of elegance. </p>
      <p>In the three block area there are a variety of places to get you hair cut. Some are cheapo chains, the other look retro 80's, to the harmonious Aveda look. Seemingly its is always about blending in the salon industry. </p>
      <p>We are trying to punch it up a little bit. Though not known as agressive or anything the client really want to be closer to Nylon than Elle. They aren't cutesy and to retain the small male clientele base they have, they want to have their service be known, not a bias toward sexes. Script has a definite slant toward women. I know its not all very feminine and its very classic, but its a direction that does not fit the client.</p>
      <p>Eric -  I think you mean with less contrast or maybe i don't fully understand the meaning of contrast, but a thinner weight in commoner terms. Gotcha.</p>
