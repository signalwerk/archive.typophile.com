    <p>Well, i don't know if have broken any boundaries, venturing away from the uniformity of salon identities that seem to be all similar.</p>
    <p>Thats why i pose the question here.</p>
    <p>1609(yes its the address)is the new name of this salon. This place had existed for the past 11 years under a different name, but had to rebrand for reasons you can make a reasonable guess, but which i won't disclose.</p>
    <p>When the name turned over, so did the ownership or at least the person who's name is listed as such. So physically they are the same staff, management and service, but under a  different name.</p>
    <p>Well...i don't know how many of you have done jobs where a number was the name, but it is not an easy feat. Generally, i avoided drawing figurative aspects of the business into the mark. Since they are a "salon &amp; spa" they offer a wide ranges of services that cannot be wittled to wavy locks or leaves. With them being one of the hipper places in the city to get your hair cut, the goal(with the client's vision)was to find a strong solution that has the potential to be an iconic mark, that symbolizes the attitude and quality of this salon.</p>
    <p>Im just going to get out of the way and let you go at it.</p>
    <p>jp</p>
