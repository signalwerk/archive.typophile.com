      <p>Of them all, I most like the T-shirt design which alludes to the scissors handle -- call it "3b?" BUT, I think some might read it as "sixteen nine" rather than "sixteen o nine." </p>
      <p>The first series actually confused me. I though "1c," which adnix describes as "the towel-headed girl" was a finger/fingernail with some fancy polish design. The good thing is that whether its a towel head or a fingernail, they both just happen to work for a salon. Did you plan it that way? Am I the only one to interperetet as such?</p>
      <p>Back to "3b." Both "6" and "9" offer an opportunity to show the scissors handle concept. I would experiment with that. I think you can push this a lot further. I like Dan W's suggestion to incorporate a "Salon &amp; Spa" line, and in a contrasting face. If your going to produce ephemera (t-shirts, etc) you don't want people not knowing it's a Salon. Other than "3b," I see the design on a t-short and be like 'hmm, what's sixteen o nine? At least if Salon and Spa was there I would know what to tell information when trying to find a phone #.</p>
      <p>I used to not be too keen on script faces myself, but you can do wonderful things contrasting a clean sans with a script. Think about it. Keep sketching. Looking forward to the next iterations. One last thing, a lot of people mentioned a thinner stroke for the sans, I agree.</p>
