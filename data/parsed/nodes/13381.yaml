      <p>Well. Now that i know typographers all have dirty minds(haha)i can rest easily. I think we should keep that on the DL about how close it sounds to sixty nine. Just imagine. Way to ruin the day, Adnix.</p>
      <p>I met with some fellow designers today and they were not really discouraged by some of the marks, but more of my selling the idea. So i included some new and older marks with some new approaches above(see t_shirts)as applied hypothetically to a t-shirt. Not everyone knows a good mark when they see it alone and that the sense i am getting with my client. So im going to apply it and see if one can be sold in his mind.</p>
