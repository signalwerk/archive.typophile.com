      <p>Thanks for the new comments since my last post. It get a bit difficult to see ones work with fresh eyes and i appreciate you all looking.</p>
      <p>Since the last post. The iconic, flourishes number mark is out. Though i did have some attachment to them, they are pursuing the forementioned(by other users)work mark ala "sixteen O nine". </p>
      <p>I have been a fan of the wordmark since its conncoction. Though it all must be pretty pretty in the end, the interesting part of this solution is the way the number is said. Naturally as humans we are lazy at times and often give a "zero" an "oh" treatment when we speak. So this solution naturally evolved. Hopefully I can strike a balance with the traditions/similarities of salon branding and interjecting some fresh, yet sturdy typography to create a mark with equal longevity.</p>
      <p>jp</p>
