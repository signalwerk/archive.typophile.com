      <p>It's sort of hard to say which one works the best. Salons and spas have a personality and that's what needs to be portrayed with the logo. If the salon is traditional and conservative then the identity needs to reflect that. If they're hip and edgy then some of these are working.</p>
      <p>As far as design goes I think the third one down in the first file is the best. The mark is great but it doesn't say "O" it looks like it says sixteen nine.</p>
      <p>More work and I think you'll nail it.</p>
