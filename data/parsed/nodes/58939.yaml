    html: |-
      <p>Font names in CSS declarations must be enclosed in quotation marks if they include a space character, hence <code>font-family: Franklin Gothic</code> is illegal (though browsers quite likely would accept it and do what you intended).</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
    html_clean: |-
