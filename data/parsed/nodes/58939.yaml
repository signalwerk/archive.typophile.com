    html: |-
      <p>Good work! You're providing a really good summary of what fonts are available where and multiple different options for font-stacks. The one thing I would really like to see are examples of the fonts in titling and body copy, since some stacks sit better in one or the other. </p>
      <p>One of the things that I have noticed with these font stacks are that the fonts often set wider or heavier than one another, even at the same font size, so being able to predict those differences would be useful. Here are some more sites that I've found useful: </p>
      <p><a href="http://www.sitepoint.com/article/eight-definitive-font-stacks/" title="http://www.sitepoint.com/article/eight-definitive-font-stacks/" rel="nofollow">http://www.sitepoint.com/article/eight-definitive-font-stacks/</a></p>
      <p><a href="http://unitinteractive.com/blog/2008/06/26/better-css-font-stacks/" title="http://unitinteractive.com/blog/2008/06/26/better-css-font-stacks/" rel="nofollow">http://unitinteractive.com/blog/2008/06/26/better-css-font-stacks/</a></p>
      <p><a href="http://unitinteractive.com/blog/blog-images/BetterFontStacks.pdf" title="http://unitinteractive.com/blog/blog-images/BetterFontStacks.pdf" rel="nofollow">http://unitinteractive.com/blog/blog-images/BetterFontStacks.pdf</a></p>
      <p>But overall, it looks good!</p>
