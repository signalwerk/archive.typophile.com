    html: <p>U and W look a bit out of place to me but it would be difficult to give them the same bottom right turn that most others have. Having said that C and G seem to fit the rhythm. I think what it is is that most of the letters have a slightly hand painted look which I like. They could have all been painted with single strokes of a wide brush. However the U and W look sharper with more geometric precision.</p>
