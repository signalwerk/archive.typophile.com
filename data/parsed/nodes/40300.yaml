      <p>Welcome in here and thanks for posting.<br>
      I think your logo looks like it could very well represent the kind of firm you are describing.</p>
      <p>Is there any reason for the "C" to overlap the "W"? I ask because the curve on the "c" that tangent the line in the "W" do not look to good. If it's not important for the design I'd recommend fixing that. Should be easy to fix if you decide so.</p>
