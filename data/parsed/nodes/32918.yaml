    html: |-
      <p>Duncan,<br>
      would you like to add some pictures of lead Helvetica, Folio and/or Walbaum?</p>
      <p>The standard of lead what was and is used by the foundries:<br>
      5-6 Sn<br>
      28-29 Sb</p>
      <p>But Monotype used less Antimon:<br>
      8,5-9,5 Sn<br>
      18,5-19,5 Sb<br>
      And therefore Monotype types look "cheap".</p>
      <p>Sn (Stannum) Zinn<br>
      Sb (Stibium) Antimon<br>
      Pb (Plumbum) Lead</p>
      <p>So the Walbaum of Berthold from 1922 looks much more better the Monotype one does:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/walbaum_5980.jpg"></div><p></p>
      <p>And D. Stempel AG used more Antimon for Helvetica (and Lithographia) to make it harder and more metallic looking:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/helv_3733.jpg"></div><p></p>
      <p>Georg</p>
