    html: <p>Some weeks ago it was the 50th birthday of Helvetica. A lot of very famous type designers were there and agreed that the original form of the Helvetica medium (the Haas Helvetica) was really missing because of a poor digitalization. It's kinda interesting because you can easly find some old letraset of this Haas Helvetica and I do own a lot of them. There are some little differences between the Haas and the Lynotype version like the non parallelism of the endings, a better lowercase a bowl and a lot of other detalis that makes it look better than the actual one. I wanted to digitalize it by myself but for the moment I don't have the time and the experience to do so. I hope someday the Haas Helvetica medium will come back!</p>
