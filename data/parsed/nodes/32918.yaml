      <p>This is in response to kuroneko – I too personally believe that the initial cut of Die Neue Haas Grotesk by Max Miedinger has (or had) a certain charm that the following designs simply failed to carry, for whatever reason – technical or otherwise.</p>
      <p>Here’s a compilation of the letter pair “ca” of Helveticas I’ve come across and spent some time examining. Please note that I haven’t included versions of Monotype Imaging (CG Triumvirate), ParaType (Pragmatica), Bitstream (Swiss 721) and many many more. Corrections/modifications/additions welcome!</p>
      <p>To me, Christian Schwartz’ Haas Neue Grotesk is the hottest thing ever, which TOO is now controlled by Linotype.</p>
      <p>RG<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ca_4042.JPG"></div><p></p>
