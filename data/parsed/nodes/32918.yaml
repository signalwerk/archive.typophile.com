    html: <p>Thanks for sharing this, Duncan. There's a lot of Helvetica bashing going on on this site &amp; although I have to admit it's probably the most common &amp; overused font, I'm still a big fan. It's been around for 50 years &amp; there has to be a reason for that... After 50 years it still doesn't look one bit outdated &amp; you just have to admire its neutral appearance. Sure, it might be a little "misused" in terms of an easy answer for any kind of design, but that's exactly where its beauty lies; it càn't really be misused in any design because it's so universal. Great font, great link!</p>
