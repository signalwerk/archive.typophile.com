      <p>Toby,</p>
      <p>there are several rules, which you can follow:</p>
      <p>1. look for good equipped typefaces, type families (who have sans &amp; serif cuts)<br>
      2. the mixed fonts should be different enough to be recognized for the untrained eye<br>
      3. try to avoid mixing a sans with another sans, or a serif with another serif<br>
      4. try to match fonts which have a almost similar x-height, so that a mixture in body copy doesn’t look to strange and fit harmonious<br>
      5. look what good typographers do, because there are as many opinions, as designers<br>
      6. use the search function here on typophile (could be the first rule)<br>
      7. look for the links at the and of this thread: <a class="freelinking-external" href="http://typophile.com/node/38882">http://typophile.com/node/38882</a> </p>
      <p>Derya</p>
