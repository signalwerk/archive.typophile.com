    <p>Hi Everyone,<br>
    I’m currently working with a property company, who use Eurostile in their logo, and I’m designing some marketing material for them. I was wondering if anyone had any suggestions on what font might go nicely for the body text? I dont want to use eurostile on in everything.</p>
    <p>Also, I was interested in general, to what criteria anyone used when deciding what font to use with a brand,that wasn’t used as part of their idendity, and how many different fonts to use with a brand?</p>
    <p>Thanks in advance!</p>
    <p>T</p>
