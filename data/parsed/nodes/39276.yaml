      <p>...what font might go nicely for the body text?...</p>
      <p>Maybe you could get a long with other fonts created by Aldo Novarese (the designer of Eurostile)</p>
      <p>ITC Fenice <a class="freelinking-external" href="http://www.myfonts.com/fonts/linotype/itc-fenice/">http://www.myfonts.com/fonts/linotype/itc-fenice/</a><br>
      Central <a class="freelinking-external" href="http://www.myfonts.com/fonts/agfa/central/">http://www.myfonts.com/fonts/agfa/central/</a></p>
      <p>...and how many different fonts to use with a brand?...</p>
      <p>One font would mean that you have chosen a good font (family), which is for example capable of being flexible enough to be used in different matters.</p>
      <p>Two fonts would mean that you weren’t there when somenone has decided for the first one (like in this case)</p>
      <p>And three fonts would mean, that you are not a very good designer/typographer<br>
      ;-)</p>
      <p>Derya</p>
