    html: |-
      <p>Being Dutch myself, hopefully I can shed some light on this. The Dutch are known to find new and elegant solutions for problems of all sorts, not only in the world of design. Over the years several Dutch typedesigners added their piece to 'Dutch type', such as flat shoulders (Unger), lively and calligraphically inspired (Noordzij, Smeijers, Ourtype), completely geometrical (Crouwel) and surely I've forgotten some. To me, 'Dutch design' is recognizable in it's concept. In the world of typography the Dutch have been at the start of many trends. I would even argue that the current 'back to personality, away from coldness' was set in motion by the types of Fred Smeijers, Gerrit Noordzij, Buivenga, Ourtype, Lucas de Groot and probably more. </p>
      <p>I guess what I'm trying to say is:<br>
      Dutch design cannot be recognized by certain characteristics. It's recognized by it's innovative and smart concepts.</p>
      <p>The above might seem like a praisal to Dutch design from a dutchman, but it's not. IMO the ideas of Crouwel might have been revolutionary, but completely rediculous. Choosing absolute geometry over legibillity is completely pointless if you ask me. I admire the ideas of Smeijers and Bram de Does, but their works just lack esthetic perfection IMO. I could go on like this for a while...</p>
