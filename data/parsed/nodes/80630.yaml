    html: <p>This looks very English to me. The sans has some of the flavour of Gill Sans, that most English of sans serif types, and the slab serif is one of the key vernacular Victorian forms. What it doesn't look is particularly Bath-like. Bath is a Georgian city, not a Victorian one, and these types are lacking any obvious sympathy with Bath's <a href="http://www.flickr.com/photos/46284315@N03/4525538082/" rel="nofollow">justifiably famous street lettering</a>.</p>
