      <p>It's a good start, but the article has in-body links, which is not appreciated on wikipedia. It's basically a linklist now, and it will most likely be deleted if it stays that way. It would be better if you remove the links from the article itself, and place them at the bottom under a 'external links' bit instead. See <a class="freelinking external" href="http://en.wikipedia.org/wiki/Wikipedia:External_links" rel="nofollow">WP:External links</a> for more info. Another option would be to make footnotes next to the school names that contain the links to their websites (which would place the links at the bottom automatically).</p>
      <p>Or you could make it a 'list of...' article - which basically it is - instead of a regular article, since other rules apply to those. If you want it to be a regular article, it needs more encyclopedic information on type design education in general.</p>
