      <p>There's Wikipedia, and there's the Typophile Wiki: <a href="/wiki/Education" class="freelinking" rel="nofollow">Education</a><br>
      Missing on your list: the type design education at HGB Leipzig, supervised by <a href="/wiki/Fred%20Smeijers" class="freelinking" rel="nofollow">Fred Smeijers</a>. A book about their venerable history (100 years of type design education in Leipzig this year) will be released soon. Two prize-winning type families by  recent Leipzig graduates: <a href="http://fontfeed.com/archives/tdc2-2009-the-text-faces/" rel="nofollow">Lirico</a> by Hendrik Weber, <a href="http://www.roman946.de/news.php" rel="nofollow">Sung New Roman</a> by Roman Wilhelm.</p>
