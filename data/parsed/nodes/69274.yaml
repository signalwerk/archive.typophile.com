    <p>I've started up an entry on Wikipedia about type design education. It is basically a list of schools where type design is taught.</p>
    <p><a href="http://en.wikipedia.org/wiki/User:Jandorp/Type_design_education" title="http://en.wikipedia.org/wiki/User:Jandorp/Type_design_education">http://en.wikipedia.org/wiki/User:Jandorp/Type_design_education</a></p>
    <p>Please contribute. This is a beta page that will be made live as soon as it starts to make some sense. Type design only please (no typesetting, book typography, logo design or pure calligraphy courses).</p>
    <p>If you don't want to register at Wikipedia please leave info here.</p>
    <p>BTW -- with such a vibrant and active community of typophiles, how come the Type Design article on Wikipedia is still so poor?</p>
