      <p>An interesting book for those interested in thinking through this question with more than anecdotal evidence from friends and colleagues (though that info is pretty important) is Galen Cranz's <em>The Chair: Rethinking Culture, Body, and Design</em> (Norton, 1998/paper, 2000).</p>
      <p>Cranz makes a point of showing the utter uselessness and even harmfulness of many of the "designed" chairs (think Bauhaus, Eames, etc.), and the bad consequences of designing general office furniture for uses other than allowing us to assume a healthy posture while we do stationary work. Almost invariably the furniture in an office reflects and reinforces our (in America, anyway) nearly Puritan prejudices about what it means to be and look "at work." (Hmm . . . it seems I've heard many on this site make many similar comments about typefaces that reflect concerns about idealized or preconceived notions of beauty, balance and symmetry, contrast, and so on, rather than legibility and readability. Rotis, anyone?) One irony I remember from the book: the typical "executive" chair is more poorly designed than the typical "task" or secretarial chair.</p>
      <p>Cranz also discusses how what is "comfortable" for many, perhaps most people seems instead to be what we <em>imagine</em> to be comfortable, what we "know" to be comfortable prior to or regardless of our experience (cushiness, low back supports, curved spaces for buttocks, and so on). It turns out a lot of that is mythology (though different people have different bodies, and there are exceptions to practically everything you can say about ergonomics and healthy bodies).</p>
      <p>For what it's worth--and not to naysay those who have testified on behalf of Hermann Miller here--Cranz thinks the Aeron is about as good as it gets for a chair of its type, but it still perches the sitter with her legs and torso at 90 degrees. About 135 degrees is a better position, she echoes physiognomists in concluding, and when the torso is upright with the legs at that angle, the muscles at the front and back of the abdomen can work together to hold the sitter up. (Of course, you also need a high and inclined work surface before you, too, so as not to have to pull your head and shoulders down to your work. I have yet to figure out how to combine that with a computer.)</p>
      <p>Again for what it's worth, she has many good things to say about Peter Opsvik's designs, most notably the balans Variable--the original with the rocking base, not the cheap flat-bottomed knockoffs. (You can see and lust after the whole dearly-priced Opsvik ouevre at Opsvik's website, <a href="http://www.opsvik.no/index.asp?page=home&amp;ver=6" title="http://www.opsvik.no/index.asp?page=home&amp;ver=6">http://www.opsvik.no/index.asp?page=home&amp;ver=6</a>.) My partner (a yoga teacher) and I are in the process of testing her ideas; I've just managed to pick up a pair of Variables (thank you, eBay!) for about 2/3rds of their normal $320 (each) price tags. </p>
      <p>Fair warning: Cranz drifts into some well-meaning but treacly utopianism about the ideal office towards the end of the book. Still, you can breeze through that stuff pretty easily. It's well worth a look for people thinking about how to set up their offices and homes for better health. I know I was sold on many of her ideas--or, at least, many of her complaints resonated in my own experience, and the one thing that I (a political theorist) have in common with the designers, typographers and typesetters, and software engineers on this forum (besides a love of type) is that I spend a lot of my professional life on a chair at a desk.</p>
