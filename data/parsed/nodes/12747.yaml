      <p>When I hurt my back, I asked my neighbor the occupational therapist<br>
      for advice on my chair and computer set-up. She gave me some pages<br>
      that were very helpful, and my back hasn't hurt since. She said that<br>
      the main thing is for the chair to be adjustable, and then to adjust<br>
      it right. </p>
      <p>If I remember rightly here are some points: The back should lean back<br>
      slightly - past 90 degrees between your upper leg and torso; your<br>
      upper leg should be parallel to the ground or slightly elevated (I<br>
      don't remember which) and feet should be forward of your knees and<br>
      rest on the ground or on an angled foot rest. Your upper arms should<br>
      be forward from your body. Forearm should be parallel with the<br>
      ground, and wrist and hand in line with it, with curled fingers<br>
      resting on the keyboard. </p>
      <p>I want to get one of those fancy Aeron things, but with all of the<br>
      correct adjustments my standard issue Office Depot inexpensive chair<br>
      is quite comfortable and no back problems from sitting in it.</p>
