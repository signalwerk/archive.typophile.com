    <p>Hi everybody,</p>
    <p>Once i heard about Gerard Unger´s Chair and it´s comfort to spend hours in design development.<br>
    I don´t know if it´s a common matter of discuss but i think it is. Do you think the same?</p>
    <p>I like one chair in particular, well 2: The Egg and the Swan (Arne Jacobsen) but i can´t afford them since they are very expensive (us$5.000 and up). They look both comfortable and with style. I dont know much about chair design but maybe there are a way to build them cheaper. I ask to a locar industrial designer here and he told me that those chair patents where finished..that´s pretty interesting if i find a model as a guide to build.</p>
    <p>Maybe some of you love comfortable modernist furniture too but the price its always unable to afford. On internet i only fond this sold out book: <a href="http://www.digmodern.com/go/book/4079" title="http://www.digmodern.com/go/book/4079">http://www.digmodern.com/go/book/4079</a></p>
    <p>Anyone know where i can find something more?</p>
