      <p>I'm hooked on the <a href="http://www.hermanmiller.com/CDA/SSA/Product/0,1592,a10-c440-p8,00.html" rel="nofollow">Herman Miller Aeron chair</a>. Adobe is kind enough to supply these for all employees, and they are truly wonderful.</p>
      <p>I have occasional lower back problems from an accident many years ago. Not only have I had far fewer back problems since I started using the Aeron (despite having gained weight during that time), I also find that when I am having back discomfort, sitting in the Aeron is the best thing I can do - even better than lying down. A couple of years after I started at Adobe I had a recurrence of back trouble, so I went out and bought one for home as well. Since then my back has been almost trouble-free.</p>
      <p>Aerons are expensive (I see them at $400-500 used, $550-800 new), but if you can scrounge the money, they're worth every penny. They have a 12-year warranty as well.</p>
      <p>Regards,</p>
      <p>T</p>
