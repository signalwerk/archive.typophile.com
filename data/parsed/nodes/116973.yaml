      <p>Macedonians are somewhat nationalistic today. This comes of being told they can only call themselves the FYROM, in order to avoid annoying Greece. At one time, Macedonian was alleged to be merely a dialect of Bulgarian, rather than a Slavic language of its own.</p>
      <p>So I would suspect that even if the Bulgarian glyphs were used for Macedonian in the past, in the present they would follow the mainstream Cyrillic glyph tradition, like Russian. However, a brief web search did not turn up suitable examples of Macedonian printing including lower case.</p>
      <p>Ah, wrong search term. <a class="freelinking external" href="http://alati.org/font/" rel="nofollow">http://alati.org/font/</a> should do to answer your questions.</p>
      <p>Well, maybe not. Mak Hebar uses the Bulgarian k but the Serbian/Russian T (of course, they too use m in italics), while most of the other faces there seem to follow Serbian and Russian. So maybe the Macedonians haven't made up their minds.</p>
