  html: "<p>I'm making a sans serif with Bulgarian and Serbian glyphs available via locl feature. I've got a question here: since Macedonian before 1945 was considered a Bulgarian dialect, should it use Bulgarian glyphs? Or it is closer to Serbian?</p>"
