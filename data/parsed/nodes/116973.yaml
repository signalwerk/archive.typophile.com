      <p>Thanks George, but that's not exactly what I'm talking about.<br>
      The thing is­—in Russian and Bulgarian and Serbian there are exactly the same letters (not all though), but there is tradition for different glyphs for same letters. For example the Russian "т" and "к" would be the Bulgarian "m" and "k". There are more differences like these. I'm curious ­— to which glyph tradition does the Macedonian language below.</p>
