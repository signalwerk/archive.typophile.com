    <p>Hi!</p>
    <p>I'm currently working on my portfolio, so some constructive opinions will help me very much.<br>
    The dimension is 20x20cm and it's meant to be printed. Here's a preview:</p>
    <p><a href="http://issuu.com/petar_pavlov/docs/portfolio" title="http://issuu.com/petar_pavlov/docs/portfolio">http://issuu.com/petar_pavlov/docs/portfolio</a></p>
    <p>Some of the fonts appear darker than they are at this preview.<br>
    I would like to know what do you think about the overall layout - is it engaging enough or it looks dull; size of the fonts (mind that one page is 20x20cm); and quality of the work.<br>
    The headers and footer are still not applied, as well as the front page. There are more projects that I'm planning to include, so this is just a sneak-peak preview :)</p>
    <p>Thanks in advance! and be harsh :)</p>
