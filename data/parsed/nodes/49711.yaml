      <p>Hi,</p>
      <p>Overall I think it's good, it shows your work large, which is what a portfolio should do. The text is brief which is also good.</p>
      <p>I noticed a big typo on the third spread </p>
      <p>"Threat the words..."</p>
      <p>should read </p>
      <p>"Treat the words..."</p>
      <p>You don't want to threaten words, they can be very powerful!</p>
      <p>good luck.</p>
