  html: |-
    <p>I'm too excited about this not to post it.</p>
    <p>I recently installed <a href="http://www.ipodlinux.org" rel="nofollow">Linux</a> on my iPod Nano. Now it plays <a href="http://video.google.com/videoplay?docid=6663282946491117841" rel="nofollow">video</a>, <a href="http://video.google.com/videoplay?docid=4032841114584378958" rel="nofollow">Doom</a>, and the <a href="http://yorgle.cis.rit.edu/Hardware/nanomame/" rel="nofollow">arcade games</a> I used to play as a kid. Why would I ever want to boot into Apple's standard iPod OS after getting a taste of this?</p>
  html_clean: |-
    <p>I'm too excited about this not to post it.</p>
    <p>I recently installed <a href="http://www.ipodlinux.org" rel="nofollow" class="link-external">Linux</a> on my iPod Nano. Now it plays <a href="http://video.google.com/videoplay?docid=6663282946491117841" rel="nofollow" class="link-external">video</a>, <a href="http://video.google.com/videoplay?docid=4032841114584378958" rel="nofollow" class="link-external">Doom</a>, and the <a href="http://yorgle.cis.rit.edu/Hardware/nanomame/" rel="nofollow" class="link-external">arcade games</a> I used to play as a kid. Why would I ever want to boot into Apple's standard iPod OS after getting a taste of this?</p>
