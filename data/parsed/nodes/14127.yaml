    html: |-
      <p>I have made some trys. If you export your pdf directly form InDesign all Type1 &amp; OpenType CFF fonts will be included CID encoded. The "spacing" (glyph wide) will be set to zero or around zero.<br>
      There is a tool around - and some acrobat versions too, with the ability to extracting these data. But its hard to add an OpenType header to it. So in the end, the user gets the CFF encoded data and with the right tools he can import the glyphs into FontLab. But everything, mapping, spacing, kerning, OpenType features are lost. In case of a large OpenType font like Zapfine Pro, you must be a really informed font developer to get some usage out of it. </p>
      <p>So its cheaper to license the fonts. But all depents on the method of how a pdf will be generated. Some people made it with the default distiller functions and the encoding will be preserved. This happens a lot on simple Type1 fonts.</p>
      <p>In general I recomend setting up nice specimen files, but to avoid the showing of whole alphabets or to made special bitmap renderings of these pages and include these pages into the "normal" pdf.</p>
      <p>But you have to generate the pdf files without these full alphabet pages, since you can delete a page afterwards, but the font data will be untouched.</p>
      <p>Example:<br>
      specimen file showing samples on page 1 and all glyphs on page 2.</p>
      <p>1. Generate the pdf from InDesign.<br>
      2. Print page 2 as Bitmap file into a new pdf.<br>
      3. Generate the same pdf file without the last page showing all glyphs (page 2)<br>
      4. Attach the bitmap pdf to the last generated pdf (Step 3.)</p>
      <p>So you have a nice printable specimen file but without all the glyphs in it. </p>
      <p>But its just a suggestion to made it real hard.</p>
      <p>Back to the flash issue, its a matter of time if this tool or any other is spreaded over the net, and its an easy click and save to TrueType function, not possible today for pdfs. But even this can change.</p>
      <p>--<a href="http://www.astype.de" target="_blank" rel="nofollow">astype.de</a>--</p>
