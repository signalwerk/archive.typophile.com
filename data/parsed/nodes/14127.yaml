      <p>Yes, I know that embedding fonts like this can be seen as a security risk, but there are steps to be taken to secure the fonts and pretect copyright abuse. The guidelines <a href="http://wiki.novemberborn.net/sifr/show/Protecting+Commercial+Fonts" rel="nofollow">here</a>, show 1) how to someone "prevent somebody from downloading the .swf file and using it on their own PC and potentially taking the font file", and 2) restrict someone using the .swf file from a different domain. </p>
      <p>I'm not sure how water-tight these steps are. But I'm sure circumventing them is a lot harder than going to the wrong places and downloading the whole of the Adobe library (for instance). I don't think this method is less secure than posting a sample PDF is it?</p>
      <p>I'll look into the security side of things over the next couple of days and report back.</p>
      <p>Thanks for the comments,</p>
      <p>Ed</p>
