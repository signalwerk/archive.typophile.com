    <p>It was a slow weekend, I had an idea and so Texter was born. Texter is a web-based tool to allow the previewing of typefaces and I hope it will be some use to people here. Try it <a href="http://www.bombsites.co.uk/texter/" rel="nofollow">here</a></p>
    <p>It runs on Javascript and Flash with most of the hard work being done by <a href="http://www.mikeindustries.com/sifr/" rel="nofollow">sIFR</a> there is no server-side programming used. It is a light and simple alternative to the likes of Mudtyper*.</p>
    <p>It is not a massively complicated system, so I'm not going to ask for money to licence Texter, but instead I would like to provide Texter licences in return for font licences. I hope this is a fair system, let me know what you think. </p>
    <p>It's early days with this yet, so all and any feedback would be appreciated. More information on <a href="http://www.bombsites.co.uk/index.php?id=17" rel="nofollow">my website.</a> </p>
    <p>Thanks,</p>
    <p>Ed</p>
    <p>*It has been pointed out to me that Mudtyper supports kerning, unfortunatly Texter can't as dynamic text in flash doesn't support kerning.</p>
