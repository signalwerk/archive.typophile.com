      <p>Thanks for the suggestions Andreas, I'm not worried about the .fla file, as sIFR is opensource, just peoples font outlines. </p>
      <p>I'm not a good enough coder to start playing with complicated scripts, this was just meant to be a simple alternative for displaying fonts made from readily available components. I wanted something like this for myself and had an idea how to make it happen.</p>
      <p>As a summary, I guess putting (or allowing people to put) any font into a public flash file clearly has risks. Some people are prepared to take those risks, some aren't. These risks are obviously highlight for type designers. It is however much better to know about this than not.</p>
      <p>If anyone would be prepared to risk putting their outlines in a flash file and thinks they could make use Texter let me know. It's been made now.</p>
      <p>Thanks for the all the comments.  </p>
      <p>Ed</p>
