    <p>It runs on Javascript and Flash with most of the hard work being done by <a href="http://www.mikeindustries.com/sifr/" rel="nofollow" class="link-external">sIFR</a> there is no server-side programming used. It is a light and simple alternative to the likes of Mudtyper*.</p>
