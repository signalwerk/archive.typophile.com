\"? Sure. Could they produce those actual memos? Impossible. <br> <br>5) Of course Adobe's HQ is in San Jose. I am at our Seattle offices. <br> <br>6) I've done this solely on my own time. Adobe as a company takes no position on the memos (or the election). <br> <br>That's about it for now. Here's the first visual aid I produced (attached), along with the original memo for comparison. <br> <br>Cheers, <br> <br>T</p>"
