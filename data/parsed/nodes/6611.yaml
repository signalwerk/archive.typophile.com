  - id: 46363
    user: 909
    date: 2004-09-14T16:22:00
    date_raw: 14 Sep 2004 — 4:22pm
    votes: null
    html: "<p>1) As a courtesy, I'm going to give ABC News and my blogging writer friend Jules Siegel first shot at showing the \"visual aid.\" I'll post it within another day or so after they've had their chance. <br> <br>2) No, all I care is when the lines end, what letter is above/below what. The cumulative effect of the advance widths. This is practically immune to the issues of distortion from repeated copying. <br> <br>It's possible that the font is something other than Times or Times New Roman. If so, it exactly matches the advance widths of Times/TNR, and it's an interesting coincidence that virtually all the letterforms are close enough that differences could be attributed to degradation from repeated scanning/copying (like being faxed, then being scanned and having the scan dropped to ~120 dpi). <br> <br>Here's the short version of my analysis: <br> <br>SUMMARY <br> <br>The incredibly bad reproduction of the memos makes it hard to state many things definitively. But one thing that is not degraded by the reproduction is the simple question of relative line lengths. Where does each line end, relative to the lines above and below it? <br> <br>Given proportionally spaced fonts, and a large enough sample (as these four memos are), these line breakings offer a sort of digital fingerprint of the widths of the font used. The memos precisely match current digital versions of Times (and previous phototype and hot metal typesetting versions), but they do not match the IBM Composer fonts (1), or do they match any version of the IBM Executive (2). <br> <br>DETAIL: <br> <br>This is not overly surprising, since the number of possible character widths was much more limited for the Composer (all characters were 3-9 units wide) and the Executive (all characters were 2-5 or perhaps 2-6 units wide). <br> <br>It is worth noting that the digital versions of Times available today are all based on an earlier 18-units-relative-to-height (\"to the em\" in font-geek-speak) system, with common characters being 5-17 units wide. So while they have relatively discrete widths for common characters, these widths are at a \"finer grain\" than early typewriters or low-end typesetters of the 70s such as the Executive and the Composer. <br> <br>Today's digital versions of Times have widths that descend from those used in Linotype's phototypesetting and earlier hot metal versions. Monotype had previously had a (more original) version with different widths, but when Microsoft licensed Monotype's version, they wanted it to be compatible with Adobe's, so the widths were changed to match the Adobe/Lino versions. Thus all the main digital versions of Times used today have the same widths. <br> <br>(1) The IBM Composer proportional fonts all had the same relative character widths, regardless of font design. Thus there is in essence only one \"fingerprint\" for the Composer fonts. Times matches the memo fingerprint, but not the Composer fingerprint. <br>   Contrariwise, I made a digital version of a Composer font (since I have the widths info). This allowed me to do \"virtual Composer\" simulations and prove in the reverse direction, that the relative line lengths set with the virtual Composer are quite different. (Note: My Composer simulation font was accurate to the nearest 1/1000 of the point size for each letter.) <br> <br>(2) The IBM Executive did not offer switchable fonts, so you literally had to buy a different typewriter to get a different proportional font. None of them is particularly close to Times. <br> <br>Special Thanks to all the people who have helped me in my research: <br>- Gerry Kaplan on the IBM Composer <br>- Norm Aleks on the IBM Executive and the Composer <br>- Frank Romano and Jack Powers on other possible devices <br>- a retired Adobe person who verified the origins of the Times metrics <br>- Jules Siegel for pointing me at many blogs and arguing with me enough that I realized how visual I needed to make things <br> <br>And thanks also to Carol Wahler for putting Newsweek in touch with me and Adobe PR for putting the Washington Post onto me. <br> <br>I am of course solely responsible for my opinions and conclusions, which are not necessarily the same as anybody else's, and do not reflect any particular views of my employer. <br> <br>Although I don't feel any need to promote my personal political views, those who know me well will be well aware that my politics obviously had no influence on this analysis.</p>"
