      <p>Incidently, in light of the fact that a lot of us here, I'm sure, are not big fans of Bush, I'm reminded of this joke: <br> <br><br>
      </p><blockquote>Three people were going to the guillotine, and the first was a lawyer who was led to the platform, blindfolded and his head put on the block. The executioner pulled the lanyard and nothing happened. To avoid a messy lawsuit, the authorities allowed the lawyer to go free. <br> <br>The next man to the guillotine was a priest. They put his head on the block and pulled the lanyard, and nothing happened. The blade didn't come down. They thought it must have been divine intervention, so they let the priest go. <br> <br>The third man to the guillotine was an engineer. He waived his right to a blindfold, so they led him to the guillotine and put his head on the block. As he lay there, he said, "Hey, wait. I think I see your problem."</blockquote><p></p>
