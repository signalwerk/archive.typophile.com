    html: "<p>It only took me a couple of hours to make my \"Virtual Composer\" font. This was quicker than tracking down somebody locally who owned one. <br> <br>The only real *typewriter* that anybody has identified with proportional spacing is the IBM Executive, which as I said previously isn't even close on several levels. <br> <br>There are three typewriter-like typesetting machines that were around at the time: the IBM Selectric Composer (NOT a regular Selectric), the AM Varityper 1010 and the Friden Justowriter. None of them make much sense for typing internal memos, but the folks who want the memos to be authentic seem to be immune to probabilistic arguments. So I thought I'd use pure logic and spacing info. <br> <br>Cheers, <br> <br>T</p>"
    html_clean: "<p>It only took me a couple of hours to make my \"Virtual Composer\" font. This was quicker than tracking down somebody locally who owned one. <br> <br>The only real *typewriter* that anybody has identified with proportional spacing is the IBM Executive, which as I said previously isn't even close on several levels. <br> <br>There are three typewriter-like typesetting machines that were around at the time: the IBM Selectric Composer (NOT a regular Selectric), the AM Varityper 1010 and the Friden Justowriter. None of them make much sense for typing internal memos, but the folks who want the memos to be authentic seem to be immune to probabilistic arguments. So I thought I'd use pure logic and spacing info. <br> <br>Cheers, <br> <br>T</p>"
