s also to Carol Wahler for putting Newsweek in touch with me and Adobe PR for putting the Washington Post onto me. <br> <br>I am of course solely responsible for my opinions and conclusions, which are not necessarily the same as anybody else's, and do not reflect any particular views of my employer. <br> <br>Although I don't feel any need to promote my personal political views, those who know me well will be well aware that my politics obviously had no influence on this analysis.</p>"
