  html: <p>Apparently there's some to-do about whether the 60 Minutes documents about Bush's National Guard service (or lack thereof) are fakes. <a href="http://www.cnsnews.com/ViewPolitics.asp?Page=%5CPolitics%5Carchive%5C200409%5CPOL20040909d.html">This article</a> has quotes from John Collins &amp; Alan Haley saying it resembles Times New Roman on MS Word more than a memo from 1972 ought to.  <br> <br>Does anyone else think <a href="http://www.cbsnews.com/htdocs/pdf/BushGuardmay4.pdf">the memo</a> looks like a fake? It really looks like MS Word to me, trying to bloody be helpful with the auto-superscript, but I'm no expert.</p>
