    html: <p>Actually, to be fair to Hailey, it's not at all clear that he has read a full version of my analysis, or even that it was my analysis in particular that he was criticizing. If he's just going by what he read in the Washington Post, then he doesn't have a very detailed analysis to respond to--by anybody. <br> <br>That being said, his belief that (for example) the "t" shows considerable wear is based on it initially matching his typewriter font. The supposed "wear" alters it so it looks remarkably like... the "t" in Times. It's a much simpler explanation. <br> <br>All that being said, the best defense anybody has mounted so far is the possibility that these documents were reproductions, created by the TexANG's own scanning and OCR of the records, then printing out again. Of course, it would require considerable manual intervention to do that and retain signatures that overlap the text. And no other records that have been produced match the dubious records in terms of the font used. <br> <br>Cheers, <br> <br>T</p>
