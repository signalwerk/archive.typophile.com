    date_raw: 6 Oct 2004 — 10:03am
    votes: null
    html: "<p>You can download the PDF of the document from the IMRL, and that works fine. <br> <br>Unfortunately, Hailey's artice reflects a poor understanding of fonts. He identifies the font as one dating to 1905 called \"Typewriter,\" and then shows an example--of a monospaced font! It's not \"the same\" font if it has been adapted to proportional spacing and the letter widths have been dramatically altered. Hailey dismisses my arguments with attacks on my starting with Times New Roman--but admits he isn't an expert on widths, and indeed it's apparent to me that he doesn't understand my argument. He makes arguments about how certain kinds of inconsistencies couldn't possibly be caused by scanning degradation--but obviously he didn't run the right kinds of tests, because when I ran tests using Times and involving faxing, then scanning back in, using the resolutions in the posted CBS docs, I got results that looked very much like the CBS docs, including things like the cupped serifs. <br> <br>Finally, his close matches to the actual memos were achieved by taking his (unclear what version, unclear on what basis he chose widths) typewriter font and condensing it (unclear what method). Guess what: proportional-spacing typewriters in 1972 didn't have a special button for \"Condensed\" like you can do in Word. He'd have to find an actual font that matches, not invent one from whole cloth. <br> <br>Gotta run, must do some real work. <br> <br>T</p>"
