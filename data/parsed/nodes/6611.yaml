    date: 2004-09-15T12:59:00
    date_raw: 15 Sep 2004 — 12:59pm
    votes: null
    html: "<p>I'm glad to see someone articulately describe the line length argument. This was one of the first things that stood out to me. Obviously, the letterforms themselves are mangled beyond recognition, but the cumulative effect of the metrics is much more apparent. Even the slightest differences in character widths when multiplied by hundreds of characters will affect copy flow. Ask any middle schooler who has typed a paper: choose the right font, and a nine page paper becomes ten--and for the most part, your teachers will still think any serif font is Times New Roman (along with most of the members of the press). Obviously the the differences here are more subtle, but the principle is the same. It's really tricky to match copy flow exactly without the exact type, because the metrics will vary slightly, even from vendor to vendor for a particular face. Some notable exceptions are \"parasitic\" fonts specifically designed to replicate metrics, such as Arial, allowing for substitution without changing copy flow. <br> <br>I still had some doubts about the forgeries with all of the old Selectric Composer guys coming out saying \"typewriters could do anything computers can as early as 1492\", but my suspicions were confirmed when I started to see accurate descriptions of Composer metrics. I commented on this over at Typographica. (By the way, what's up with typophile going down the weekend typography was being discussed in every news venue?) <br> <br>Tangent: Didn't Adobe do some stuff with \"universal fonts\" at one point that would replicate font metrics to replace document fonts without changing copy flow/document layout?</p>"
