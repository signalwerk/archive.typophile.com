    html: "<p>The documents look like pretty blatant forgeries, but that has not yet been proven absolutely. What *is* absolutely certain is that they were not produced on the IBM Selectric Composer or the IBM Executive, the two machines most often touted as possibly producing the documents. I have done experiments that prove this beyond any reasonable doubt (while simultaneously supporting but not proving forgery). <br> <br>See this morning's Washington Post: <br>http://www.washingtonpost.com/wp-dyn/articles/A18982-2004Sep13.html <br> <br> <br>Clarifications I sorted through last night to my bit of the article: <br> <br>1) Adobe did the digital version of Times Roman from which the Microsoft/Monotype Times New Roman borrowed its widths to use with the Monotype design. Adobe got said widths from Linotype. I did mention the various other players, but what can you expect when an entire interview is boiled down to a couple of sentences? <br> <br>2) Although certainly a run-of-the-mill Selectric could not have produced the memo, more importantly I eliminated the IBM \"Selectric Composer\" (often just called an \"IBM Composer\"). This was an actual typesetting device based on typewriter-like technology, which has frequently been touted as the likely source of the memos. <br> <br>3) The IBM machines used fonts of different widths than the font used for the memos. The font used for the memos is a perfect match for Times. The IBM machines were not capable of producing a perfect match to those widths. Times is based on a system of widths of 5-17 units (at 18-to-the-em). The Composer uses a system of 3-9 units, and the Executive a system of 2-5 units. <br> <br>4) The reporter didn't tell me of Glennon's statement, so it's funny to say that I disputed it. Indeed, I won't dispute that the IBM machines could produce results \"similar\" to the disputed memos. But they cannot reproduce the exact relative line lengths, which is what I measured. Can they do something \"similar\"? Sure. Could they produce those actual memos? Impossible. <br> <br>5) Of course Adobe's HQ is in San Jose. I am at our Seattle offices. <br> <br>6) I've done this solely on my own time. Adobe as a company takes no position on the memos (or the election). <br> <br>That's about it for now. Here's the first visual aid I produced (attached), along with the original memo for comparison. <br> <br>Cheers, <br> <br>T</p>"
