      <p>Great question Sebilar! I am always anxious to know what people are listening to, in general. Personally, I love to listen to music while I work and design (and admittedly, I have never designed a full out typeface although I have lots of designs in progress). When I have to do grunt/production work, I tend to listen to Rock music - something with a heavy beat. It seems to help me concentrate on the tasks at hand and puts me into a regimented, structured frame of mind. When I am creating and sketching and ideating, I tend to listen to lighter music: anything from classical to jazz to pop music.</p>
      <p>Speaking of music, this question reminds me of something I read in Heller’s book: The Education of a Typographer. It had to do with music and keeping an open mind and I think it was written by Terry Irwin. “Josef Müeller-Brockmann said he believed that, as we get older, our scope of acceptability narrows — it is simply human nature. But, he maintained, as designers, we must resist this at all costs, lest it handicap us as professional communicators. He described how each day, he would take some time to put on his Walkman and listen to rap music because he absolutely hated it. He wanted to keep looking at what was new and fresh out in the world and remain willing to step out of his comfort zone.”</p>
