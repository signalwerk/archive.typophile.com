    <p>Dear forum members,</p>
    <p>I was just wondering what others think about this:</p>
    <p>When working on your typefaces, are you listening to music (or not)?<br>
    Does it influence the work?<br>
    Is it distracting or beneficial?<br>
    What kind of music do you listen to?<br>
    Is it different from your usual listening habits?<br>
    In what phase of design do you listen to music (or not): conception/drawing, elaboration, programming/production, marketing?<br>
    Are there any other aspects I forgot to ask?</p>
    <p>For me, i listen to music in elaboration process and marketing, and I usually choose more or less meditative stuff like Sigur Rós, Kraftwerk, Múm, Kante (german band), Django Rheinhard or sometimes even Einstürzende Neubauten (later phase), The White Stripes and Tool. Criteria is that it works “in background”, and I don’t have to concentrate on structur or text of the music necessarely, but can concentrate on the letters.<br>
    This kind of music is part of my usual listening habit, but there are much more other bands and genres I listen to when not working on fonts.<br>
    Maybe I should try what happens if I listen to something in the conceptional phase of a design; until now I don’t think there has been influence on the design because of listening to music besides.</p>
    <p>Thanks for sharing your thoughts<br>
    Sebilar</p>
