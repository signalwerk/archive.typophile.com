    html: |-
      <p>Add one of these 5 symbols to the Humanist 521 BT Unicode font.</p>
      <p>0298 LATIN LETTER BILABIAL CLICK<br>
      029D LATIN SMALL LETTER J WITH CROSSED-TAIL<br>
      0270 LATIN SMALL LETTER TURNED M WITH LONG LEG<br>
      01BE LATIN LETTER INVERTED GLOTTAL STOP WITH STROKE<br>
      01BB LATIN LETTER TWO WITH STROKE</p>
      <p>Added that code to Add these characters and/or character ranges. For example: 8364, $FB50 - $FBFF, $FFFC.<br>
      $0298, $029D, $0270, $01BE, $01BB</p>
      <p>Clicked the OK button.</p>
      <p>Selected 5 incomplete glyphs.</p>
      <p>Clicked Complete Composites.</p>
      <p>Clicked the 2 with stroke.</p>
      <p>Finished the 2 with stroke.</p>
      <p>Finished the small j with cross tail.</p>
      <p>Finished the small turned m with long leg.</p>
      <p>Finished the bilabial click.</p>
      <p>Finished the inverted glottal stop with stroke.</p>
      <p>There is a bilabial click, a small j with crossed-tail, the small turned m with long leg, the inverted glottal stop with stroke and the digit two with stroke.</p>
      <p>Download the font from Rapid Share:<br>
      <a href="http://rapidshare.com/files/177914686/Copy_of_Humanist_521_BT__2_.ttf.html">Humanist 521 BT</a></p>
