    <p>This font is edited with FontCreator 5.6 Demo Version.</p>
    <p>This font includes the Euro Currency, the rupee, the lira, the naira, the mill, the German penny, the peso, the hryvnia, the guarani, the austral and the cedi.</p>
    <p>There is also a ₤, copied from the pound sterling.</p>
    <p><a href="http://typophile.com/files/Humanist 521 BT.ttf">This Unicode font</a></p>
