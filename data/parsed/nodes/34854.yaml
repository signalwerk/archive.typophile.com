    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Technical%20Info" class="freelinking" rel="nofollow">Technical Info</a> : Language Coverage</strong></p>
    <p>This article is designed to list which languages are supported by corresponding <a href="/wiki/Unicode" class="freelinking" rel="nofollow">Unicode</a> blocks. The rule used here to list languages is to list under scripts that have either official status or are still in popular usage, ie. Azerbaijani officially uses the <a href="/wiki/Latin" class="freelinking" rel="nofollow">Latin</a> script, but many Azerbaijanis still use <a href="/wiki/Cyrillic" class="freelinking" rel="nofollow">Cyrillic</a> extensively.</p>
    <p><strong>Latin-1:</strong></p>
    <p>Albanian<br>
    Danish<br>
    Dutch<br>
    English<br>
    Faroese<br>
    Finnish<br>
    Flemish<br>
    German<br>
    Icelandic<br>
    Indonesian<br>
    Irish<br>
    Italian<br>
    Malay<br>
    Norwegian<br>
    Portuguese<br>
    Scottish Gaelic<br>
    Spanish<br>
    Swahili<br>
    Swedish<br>
    Tagalog</p>
    <p><strong>Latin Extended-A:</strong>*</p>
    <p>Afrikaans<br>
    Basque<br>
    Bosnian<br>
    Breton<br>
    Catalan<br>
    Chichewa<br>
    Cornish<br>
    Croatian<br>
    Czech<br>
    Esperanto<br>
    Estonian<br>
    Fijian<br>
    French<br>
    Frisian<br>
    Greenlandic<br>
    Hawaiian<br>
    Hungarian<br>
    Latin<br>
    Latvian<br>
    Lithuanian<br>
    Maltese<br>
    Maori<br>
    Moldavian<br>
    Navajo (Also requires some Combining Diacritcal Marks)<br>
    Polish<br>
    Provençal<br>
    Rhaeto-Romanic<br>
    Romanian<br>
    Romany<br>
    Sámi, Inari<br>
    Sámi, Lule<br>
    Sámi, Northern<br>
    Sámi, Southern<br>
    Samoan<br>
    Serbian<br>
    Slovak<br>
    Slovenian<br>
    Sorbian<br>
    Turkish<br>
    Welsh</p>
    <p><strong>Latin Extended-B:</strong>*</p>
    <p>Azerbaijani (also requires some glyphs from Latin Extended-A)<br>
    Croatian<br>
    Livonian<br>
    Pinyin (Mandarin Romanization)<br>
    Sámi, Skolt</p>
    <p><strong>Latin Extended Additional:</strong>*</p>
    <p>Coast Tsimshian<br>
    Guarani (Also requires some Combining Diacritical Marks)<br>
    Kwakʼwala (Also requires some Combining Diacritical Marks)<br>
    Nisghaʼa<br>
    Sanskrit Transliteration<br>
    Tlingit (Also requires some Combining Diacritical Marks)<br>
    Vietnamese<br>
    Welsh</p>
    <p><strong>IPA Extensions:</strong>†</p>
    <p>International Phonetic Alphabet</p>
    <p><strong>Greek:</strong></p>
    <p>Greek, Monotonic</p>
    <p><strong>Greek Extended:</strong>**</p>
    <p>Greek, Polytonic</p>
    <p><strong>Cyrillic:</strong></p>
