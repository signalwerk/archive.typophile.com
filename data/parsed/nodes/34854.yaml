    <p><strong>Cyrillic Supplement:</strong>‡</p>
    <p>Aleut<br>
    Chukchi<br>
    Chuvash<br>
    Enets<br>
    Itelmen<br>
    Khanty<br>
    Komi<br>
    Kurdish<br>
    Mordvin<br>
    Tlingit</p>
    <p><strong>Phonetic Extensions:</strong>¶</p>
    <p>Uralic Phonetic Alphabet</p>
    <p><strong>Phonetic Extensions Supplement:</strong>¶</p>
    <p>Uralic Phonetic Alphabet</p>
    <p><strong>Cyrillic Extended-A:</strong>§</p>
    <p>Russian combining marks</p>
    <p><strong>Cyrillic Extended-B:</strong></p>
    <p>Old Church Slavonic</p>
    <p><strong>Hiragana &amp; Katakana:</strong></p>
    <p>Japanese</p>
    <p><strong>CJK Unified Ideographs:</strong>¨</p>
    <p>Chinese<br>
    Japanese<br>
    Korean</p>
    <p><strong>Notes:</strong><br>
    * Also requires Latin-1.<br>
    ** Also require Greek.<br>
    † Also require Latin-1 &amp; Greek.<br>
    ‡ Also require Cyrillic.<br>
    ¶ Also require IPA.<br>
    § Also require Cyrillic Extended-B.<br>
    ¨ Also require Hiragana &amp; Katakana.</p>
    <p><strong>Sources:</strong><br>
