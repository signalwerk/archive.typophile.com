    <p>From Lost Type Co-op:</p>
    <blockquote><p>We are building a font at this very moment in San Francisco, and we are live blogging it in real time.</p>
    <p>Various members of the Lost Type team (who have worked on our fonts and promotional materials in the past) have flown to San Francisco for a 4 day marathon to create a typeface inspired by the iconic city.</p>
    <p>You can follow us in real time, in words and photos, here (<a href="http://www.fieldtripsf.com/" title="http://www.fieldtripsf.com/">http://www.fieldtripsf.com/</a>).</p></blockquote>
