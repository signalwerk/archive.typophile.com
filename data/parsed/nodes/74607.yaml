  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typeshow_6707.png"></div><br>
    Dear type founders,<p></p>
    <p>if you run a website to sell your fonts, you have probably considered providing one of those try-before-you-buy font testing widgets to your potential customers.<br>
    We have recently built a piece of software for this purpose: <a class="freelinking external" href="http://typeshow.net" rel="nofollow">TypeShow</a>.<br>
    Type something, pick a font and a style, and TypeShow will render it. That’s it.</p>
    <p>TypeShow’s front end is a jQuery plugin that easily integrates with most existing websites.<br>
    We have focused on simplicity and worked hard on interface details to give your website visitors the best possible user experience.<br>
    You can upload your fonts and completely customize the appearance through a dedicated admin interface.</p>
    <p>TypeShow runs on almost any web server, since it only requires PHP 5.2+, GD &amp; Freetype—unfortunately this means that there is no support for OpenType features, and there’s not much we can do about it at this time.</p>
    <p>We have released <a class="freelinking external" href="http://typeshow.net" rel="nofollow">TypeShow</a> as free software under the terms of the GPL, which means that may download, install, use, and modify the code to your liking at no charge.</p>
    <p>Learn more about TypeShow here: <a class="freelinking external" href="http://typeshow.net" rel="nofollow">http://typeshow.net</a></p>
    <p>I’m looking forward to your comments and feedback.</p>
    <p>Best,<br>
    Frank</p>
