  html: "<p>DESIGN AND ADVERTISING CALL FOR ENTRIES <br> <br>You are invited to submit work to the most prestigious juried competitions <br>for graphic design and advertising: Communication Arts magazine's 43rd <br>Design and Advertising Annuals.  If selected, your award-winning pieces will <br>be reproduced in Communication Arts magazine, either the November Design <br>Annual or December Advertising Annual. Over 74,000 copies of each Annual <br>will be in circulation worldwide, providing outstanding exposure to both <br>potential clients and colleagues. <br> <br>Deadline: June 14, 2002 <br> <br>Guidelines and FAQs can be found at: <br><a href=\"http://www.commarts.com/CA/magazine/comp/\" target=\"_top\">http://www.commarts.com/CA/magazine/comp/</a> <br> <br>To download an entry form go to: <br><a href=\"http://www.commarts.com/CA/download/da_02.pdf\" target=\"_top\">http://www.commarts.com/CA/download/da_02.pdf</a></p>"
