    <p>I was doing some Christmas shopping yesterday and spotted this at the local B&amp;N:</p>
    <p><a href="http://www.oreilly.com/catalog/9780596102425/index.html" rel="nofollow">Fonts and Encodings</a>, by Yannis Haralambous.</p>
    <p>The French edition has been out for a while, and I was looking forward to an English edition. Apparently, it has been out since September. </p>
    <p>This book is really amazing, and a must-have for font developers.</p>
