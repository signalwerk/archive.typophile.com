      <p>I've only had the book since yesterday, so I haven't read the whole thing. But, from what I have read and looked at, it appears to be very thorough and lucid. The writing style is engaging with a bit of subtle humor (even sarcasm at times), which can be illuminating in its own way.</p>
      <p>What attracted me to this book is the way it gathers a huge amount of information into one place. Sure, you can find all of it (and more) on, for example, Microsoft's, Apple's, and Adobe's websites, but it's nice to have it summed up in one book, and from a (presumably) more objective observer. And if you do need further information, links are included to the relevant documents on the Web.</p>
      <p>What other books are comparable?</p>
