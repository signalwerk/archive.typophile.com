    html: |-
      <p>I can't say how the French edition is, but the English edition is just riddled with errors. Most are typos and the like, but some of the errors are pretty serious. For example, in the introduction it claims that the standard em square is 1024 x 1024 for PostScript fonts, and 4096 x 4096 for TrueType fonts. Of course, the correct values are 1000 x 1000 and 2048 x 2048 - and that difference between 1000 and 1024 is important, because it means that the TrueType norm is not a simply multiple of the Type 1 ("PostScript") norm.</p>
      <p>It's a shame, because it is a wonderfully ambitious book and covers an amazing amount of ground. A second edition that corrected the errors could be a truly great book.</p>
      <p>Regards,</p>
      <p>T</p>
