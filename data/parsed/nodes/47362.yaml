    <p>Dear Typophiles,</p>
    <p>Can you help me identify the font used for the word LIMFJORDS·PORTER on the attached picture? The beer is my absolute favorite. The kerning on the label looks a bit odd, but the taste (of the beer, not the label) is top-notch.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/LFP_4617.jpg"></div><p></p>
    <p>Best regards,<br>
    Emil Hedevang</p>
