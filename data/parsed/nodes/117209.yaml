      <p>Ryuk suggested some modern alternatives. You could also look at three fonts by Michael Hagemann reviving 19th century typefaces:  Cowboy Western<br><img src="/sites/default/files/old-images/CowboyWesterInUseAsIvorySoap_6243.jpg"><a href="http://www.myfonts.com/fonts/fontmesa/cowboy-western/">http://www.myfonts.com/fonts/fontmesa/cowboy-western/</a><br>
      Miss Scarlett, which is a Tuscan<br><img src="/sites/default/files/old-images/MissScarlettInUseAsIvorySoap_5416.jpg"><a href="http://www.myfonts.com/fonts/fontmesa/miss-scarlett/">http://www.myfonts.com/fonts/fontmesa/miss-scarlett/</a><br>
      and Tenderfoot, which has terminals on the _S_ that are very similar to the ones in the Ivory Soap Trademark if they are rotated 90 degrees <img src="/sites/default/files/old-images/TenderfootInUseAsIvorySoap_4688.jpg"><a href="http://www.myfonts.com/fonts/fontmesa/tenderfoot/">http://www.myfonts.com/fonts/fontmesa/tenderfoot/</a><br>
      Don</p>
