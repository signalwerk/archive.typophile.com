    html: |-
      <p>Late 19th or early 20th century artwork in the form of a trademark. The most interesting features are the median spurs, the terminals on _S_ and the leg on the _R_.<br>
      Median spurs were usually used on Tuscan, i.e. split or fishtail terminal fonts, rather than ones with flat terminals.<br>
      A font in the latter style was digitized by Dan X. Solo under the name Cavalcade.  <img src="/sites/default/files/old-images/CavalcadeSoloDoverCircusAlphabetsBookAsIvorySoap_4344.jpg"> Unfortunately the only legitimate way to get this font is by purchase of a new or used copy of "24 Circus Display Fonts (Dover Electronic Display Fonts) (CD-ROM and Book)"<br>
      Previous discussion of a median spur non-Tuscan font <a href="http://typophile.com/node/116784">http://typophile.com/node/116784</a><br>
      The trademark could be expanded to make an attractive font, pehraps with plain and rimmed variations.<br>
      Don</p>
