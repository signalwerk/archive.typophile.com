      <p>Gavin - When you post something like this here, it is often helpful to tell us the source and, if known, date.</p>
      <p>In this case, a very old Proctor &amp; Gamble product with two O's that are <em>very</em> different makes it clear that this was a hand drawn label. No font involved. Ryuk had provided modern alternatives.</p>
