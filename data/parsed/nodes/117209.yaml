      <p>Ryuk suggested some modern alternatives. You could also look at three fonts by Michael Hagemann reviving 19th century typefaces:  Cowboy Western<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/CowboyWesterInUseAsIvorySoap_6243.jpg"></div> <a href="http://www.myfonts.com/fonts/fontmesa/cowboy-western/" title="http://www.myfonts.com/fonts/fontmesa/cowboy-western/">http://www.myfonts.com/fonts/fontmesa/cowboy-western/</a><br>
      Miss Scarlett, which is a Tuscan<br>
      <div class="imageWrap"><img src="http://typophile.com/files/MissScarlettInUseAsIvorySoap_5416.jpg"></div> <a href="http://www.myfonts.com/fonts/fontmesa/miss-scarlett/" title="http://www.myfonts.com/fonts/fontmesa/miss-scarlett/">http://www.myfonts.com/fonts/fontmesa/miss-scarlett/</a><br>
      and Tenderfoot, which has terminals on the _S_ that are very similar to the ones in the Ivory Soap Trademark if they are rotated 90 degrees <div class="imageWrap"><img src="http://typophile.com/files/TenderfootInUseAsIvorySoap_4688.jpg"></div> <a href="http://www.myfonts.com/fonts/fontmesa/tenderfoot/" title="http://www.myfonts.com/fonts/fontmesa/tenderfoot/">http://www.myfonts.com/fonts/fontmesa/tenderfoot/</a><br>
      Don<p></p>
