    <p>Hi everyone,</p>
    <p>Citibank has recently rolled out a new campaign with the slogan "Let's get it done". It seems like Citibank is also using a new font(?). It's not the OCRK Bold Square everyone was talking about. For example...</p>
    <p><a href="http://www.citibank.com/us/d.htm" title="http://www.citibank.com/us/d.htm">http://www.citibank.com/us/d.htm</a><br>
    The font of the words "Banking/Credit Cards/Lines &amp; Loans/Investing/Planning" near the top.</p>
    <p>OR</p>
    <p><a href="http://www.youtube.com/watch?v=RFOQrOd9E2g" title="http://www.youtube.com/watch?v=RFOQrOd9E2g">http://www.youtube.com/watch?v=RFOQrOd9E2g</a><br>
    The font at the end of the slogan "Let's get it done".</p>
    <p>What is the font?</p>
    <p>Thanks!!</p>
