    html: "<p>The logo for Isaac Mizrahi was designed by Tibor Kalman, with Douglas Riccardi in 1990. It seems it was drawn using Bodoni as a model, with a few alterations, note the distinct shapes of the R, Z, C, as well as the M. <br> <br>Here's an excerpt from \"Tibor Kalman: Perverse Optimist\" <br>\"...The M&amp;Co redesign drew from the whimsical functionalism of Mizrahi's fashion, taking the designer's name in Bodoni and \"screwing with its proportions,\" as Kalman put it, \"intentionally taking something elegant and replacing it with human hands.\" <br> <br>Mizrahi also adds; \"It's just Bodoni with a splayed \"M\" that he [Kalman] invented.\"</p>"
