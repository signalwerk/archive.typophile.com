  html: <p>One of our art directors is trying to match this type face found on an embossed, letter-pressed invitation for a Mizrahi event. Any guesses or suggestions for a digital font that has the same "feel". <br> <br>The sample was about 8 point type so the scan is rather rough. <br> <br><img src="http://www.typophile.com/forums/messages/83/32874.gif" alt="Mizrahi"></p>
