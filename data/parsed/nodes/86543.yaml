    <p>I know three methods for determining the optical center of a figure (on the vertical axis):</p>
    <p>1) given by Harold Evans (after V. Steer) in <em>Newspaper Design</em> (1973);<br>
    2) proposed by Albert A. Sutton in <em>Design and Makeup of the Newspaper </em> (1948);<br>
    3) "just trust your eye".</p>
    <p>Each of them gives, let's say, quite different results. Common to these methods is that the optical center lies slightly above the geometric center of the figure (I don't mention my students claim the optical center is located right in the middle).</p>
    <p>The question is:<br>
    do you know other methods, formulas or have links to similar issues which would help to clarify or form an opinion on the matter?</p>
