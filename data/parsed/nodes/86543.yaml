    html: <p>I agree with Riccardo, but the important thing in designing a typeface is to make the divisions work *in conjunction with other letters*. All of these could work, depending on the design. I'm sure you can find the cross bar on the H at all of these levels in good fonts. That's why the vertical alignment always is a matter of the eye, looking at, and deciding on, the whole design.</p>
