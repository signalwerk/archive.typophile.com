      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_4616.jpg"></div><p></p>
      <p>Let's scope on the simplest example, because we all are aware of slight differences caused by interaction of more complicated shapes, like letters.<br>
      I am not interested in optical centering itself - it's not my life's goal - but lastly I am really curious of what causes we need to place something that "has to be in the middle" at least a tad ABOVE. Is it related to - I don't know - neurophysiology (like anticipating an event, eg falling object)?<br>
      The Evans' rule seems to be linked with the golden ratio; it creates strong diagonals feeling, while Sutton is probably more an "optical tricker".<br>
      Maybe the relation among the four examples is rather culture- or design-driven thing?</p>
