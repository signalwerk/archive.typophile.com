      <p>I haven't heard of an "optical center" other than on the horizontal axis, for spacing purposes. That was championed by David Kindersley. I think there is something to his idea, but he never really nailed it down to a formula that worked consistently. </p>
      <p>Vertically, when you divide a space vertically such as e or E, the visually equal division is somewhat above the geometrical center. But I suspect that that apparently equal division will vary with the design of the rest of the figure. So, eg the crossbar of the H and A will be in different places. So there isn't one single number for a "vertical center."</p>
