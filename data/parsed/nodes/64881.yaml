      <p>Hi Gustavo, </p>
      <p>The font corruption checking engine is consistently updated, so it's important for us to know which version of Suitcase Fusion they are using. </p>
      <p>The most current release, Suitcase Fusion 2 (v13.2.1), adds FontStruct fonts without issue. We are constantly improving our font corruption checking technology, so it is possible that a previous version was identifying FontStruct fonts as corrupt due to . </p>
      <p>Sparkie7, what version of Suitcase Fusion are you using?</p>
      <p>Gustavo, any more specific feedback that you have would be welcome.</p>
      <p>Jim Kidwell<br>
      Extensis<br>
