    html: |-
      <p>How many rules do you have in your font?</p>
      <p>You may try to group your mutually exclusive rules by prefixing the group of rules with some tag. e.g. if you have 5 rules</p>
      <p>rule1<br>
      rule2<br>
      rule3<br>
      rule4<br>
      rule5</p>
      <p>and you know if rule1 is fired then there is no need to check the other rules. You may prefix these rules (name these in VOLT) like </p>
      <p>group1\rule1<br>
      group1\rule2<br>
      group1\rule3<br>
      group1\rule4<br>
      group1\rule5</p>
      <p>I am unable to find the documentation but you may see sample font for reference.</p>
