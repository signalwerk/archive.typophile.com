    html: |-
      <p>The problem might be due to cursive attachment among all letters. Higher the number of cursive attachment letters, slower will be the font.</p>
      <p>You may test it. Just remove the cursive attachment lookups from the project and then test the font in the software. Though it will disturb the whole font and letter shaping but I am suggesting it just for testing purpose to confirm that the slowness is created by cursive lookups.</p>
      <p>Thanks,<br>
      Z.A</p>
