    <p>Hello,</p>
    <p>I am working on a an open type chracter based Urdu Unicode Nastaliq Font named 'Mher e nastaliq'. The problem is that the font rendring speed is too much slow, even when I type one line in my font the typing process becomes too much slow.. But when I starts a new paragraph, the first few words are typed correctly and then the same problem occures when i reached at the end of line... !</p>
    <p>Please help me, and suggest me the solution to overcome this problem..!</p>
    <p>I am using MS. Volt for making Open type tables, and my system specifications are as under:.<br>
    Core 2 due 3.0 GHZ processer 64 bit<br>
    Windows 8<br>
    4 GB ram</p>
    <p>I needed your help urgently, please guide me in this regards..</p>
    <p>Thanks in advance!<br>
    Muhammad Zeeshan Nasar</p>
