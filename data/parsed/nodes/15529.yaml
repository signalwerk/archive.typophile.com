      <p>»Gravur Condensed« has rounded tips. The logo you link to does not have rounded endings.<br>
      The logo font is much more like a »DIN 1451« or a variation thereof. In fact, it is not DIN, however, it is so close as to call it a variation of DIN.<br>
      The upper bowl of the capital B is smaller on the logo. DIN’s capital B has identically sized bowls both upper and lower. Also, the endings on the capital S finish with a straight edge on the logo, whereas DIN’s capital S does not have such a feature.</p>
      <p>More searching is needed.</p>
      <p>For a DIN example of this company name, see:<br>
      <a href="http://flickr.com/photos/luxuryluke/3081004809/" title="http://flickr.com/photos/luxuryluke/3081004809/">http://flickr.com/photos/luxuryluke/3081004809/</a></p>
