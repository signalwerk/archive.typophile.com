    <p>Hello,</p>
    <p>I am designing a logo for a photographer friend of mine.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/gros_5369.jpg"></div><p></p>
    <p>We ended up with a Futura Bold based logo and I am finding it hard to find a good <strong>serif</strong> based companion typeface for use on his business cards etc.</p>
    <p>Any help is greatly appreciated.</p>
    <p>Thanks.<br>
    Demetre</p>
