  html: "<p>Hi, <br> <br>my name is Oskar. I am 19 years old and lives in Sweden. I run the site <a href=\"http://www.otechdesign.com\"> www.otechdesign.com</a> (sorry guys, it's only in swedish) and I freelance as a graphic designer. I've mostly done print works, such as record covers, posters, flyers etc. But you can also see some logotypes, illustrations and websites on my site. <br> <br>Here are some of my work: <br> <br><a href=\"http://www.otechdesign.com/print_fronda_brostpansar_tshirt.php\"> T-shirt print for the rapartist Fronda (SWE).</a> <br> <br><a href=\"http://www.otechdesign.com/print_fronda_album_1.php\"> This is the front and back of the 24 page booklet for the rapartist Frondas third solo album \"Livet genom en pansarvagnspipa / Life through the barrel of a tank\".</a> <br> <br><a href=\"http://www.otechdesign.com/print_fronda_album_14.php\"> The cd-label to the same album.</a> <br> <br><a href=\"http://www.otechdesign.com/print_fronda_singel_1.php\"> The first single named \"Million indians\".</a> <br> <br><a href=\"http://www.otechdesign.com/print_fronda_flyer.php\"> Flyer to the same album.</a> <br> <br><a href=\"http://www.otechdesign.com/print_gwfcb_vinylcover_1.php\"> Here is a vinyl cover that I've made to two swedish hardcore bands. Nice red vinyl =)</a> <br> <br><a href=\"http://www.otechdesign.com/print_helvetica_gunboy.php\"> Three illustrations made by only letters and numbers fron Helvetica Neue =)</a> <br> <br><a href=\"http://www.otechdesign.com/logotype_svu_2.php\"> A logotype for a swedish hiphop magazine on the internet.</a> <br> <br><a href=\"http://www.otechdesign.com/logotype_lolibaloli.php\"> A logotype for my girlfriend.</a> <br> <br><a href=\"http://www.otechdesign.com/illustrations_pandor.php\"> A illustration I made for fun =)</a> <br> <br>Here are some websites that I've done: <br><a href=\"http://www.fronda.se\"> www.fronda.se</a> <br><a href=\"http://www.barangafilm.com\"> www.barangafilm.com</a> <br> <br>And there is a lot lot more on my website <a href=\"http://www.otechdesign.com\"> www.otechdesign.com</a> =) Check it out! <br> <br>This is my first post on typophile! How are you?</p>"
