    date: 2004-10-16T09:43:00
    date_raw: 16 Oct 2004 — 9:43am
    votes: null
    html: "<p>As far as I know, all you need to do is insert \"subtable;\" every once in a while. One of these every 100 lines or so should do it. This just helps break up the kern feature. I agree with Adam, this is a pretty pointless limitation, but fortunately there is an easy workaround. <br> <br>So your kern feature might look like this: <br> <br>pos T a -50; <br>pos T c -55; <br>subtable; <br>pos T e -55; <br> <br>... etc. Don't forget that semicolon at the end of each line. <br> <br>Alan</p>"
    html_clean: "<p>As far as I know, all you need to do is insert \"subtable;\" every once in a while. One of these every 100 lines or so should do it. This just helps break up the kern feature. I agree with Adam, this is a pretty pointless limitation, but fortunately there is an easy workaround. <br> <br>So your kern feature might look like this: <br> <br>pos T a -50; <br>pos T c -55; <br>subtable; <br>pos T e -55; <br> <br>... etc. Don't forget that semicolon at the end of each line. <br> <br>Alan</p>"
