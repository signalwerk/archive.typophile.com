    html: <p>are there any ill effects of adding subtables to the kern feature? I was trying to follow along with the discussion on the OpenType mailing list a couple weeks back and got lost. can anyone explain this concisely?</p>
    html_clean: <p>are there any ill effects of adding subtables to the kern feature? I was trying to follow along with the discussion on the OpenType mailing list a couple weeks back and got lost. can anyone explain this concisely?</p>
  - id: 133741
    user: 8664
    date: 2006-07-11T12:08:00
    date_raw: 11 Jul 2006 — 12:08pm
    votes: null
    html: |-
      <p>Very short: (a) If some of your kern classes have overlapping content, FLS5 automatically inserts subtable breaks but will warn you that some pairs may never be accessed. (b) If you insert "subtable" manually to cope with too many kerning pairs and if the order of kerning pairs isn't right, then some kerning pairs may not make it into the font -- and you don't even get a warning.<br>
      The most complete description is in Adobe's <a href="http://partners.adobe.com/public/developer/opentype/afdko/topic_feature_file_syntax.html#6.b.iii" rel="nofollow">Feature File Syntax</a> document.</p>
    html_clean: |-
      <p>Very short: (a) If some of your kern classes have overlapping content, FLS5 automatically inserts subtable breaks but will warn you that some pairs may never be accessed. (b) If you insert "subtable" manually to cope with too many kerning pairs and if the order of kerning pairs isn't right, then some kerning pairs may not make it into the font -- and you don't even get a warning.<br>
      The most complete description is in Adobe's <a href="http://partners.adobe.com/public/developer/opentype/afdko/topic_feature_file_syntax.html#6.b.iii" rel="nofollow" class="link-external">Feature File Syntax</a> document.</p>
