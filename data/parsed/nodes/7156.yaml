    votes: null
    html: |-
      <p>Yes, at best you create separate classes for first-glyphs-of-a-pair and for second-glyphs-of-a-pair -- even if they would contain the same glyphs:<br>
      _z.1: z' zdotaccent<br>
      _z.2: z' zdotaccent<br>
      Whatever suffices you actually choose to indicate that a class is intended to be first or second of a kerning pair, I'd precede it by underscore or better by period. This makes it easier to spot suffices and maybe to search/replace them. Just in case.<br>
      _z.1 then will be marked as leftside pair, _z.2 as rightside pair either in FLS5's Classes panel or Kerning Assistance panel.</p>
      <p>This however addresses only overlapping of kerning classes' content (a), but not excessive kerning (b) ...</p>
