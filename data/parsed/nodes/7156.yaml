    html: <p>I've noticed other mistakes in the FontLab opentype kern feature preview. It comes up when I'm using opentype classes. If this is my 'kern' feature... <br> <br>feature kern { <br>  pos [B] @_kernO2 16; <br>  pos [A] @_kernO2 -12; <br>  pos @_kernO1 @_kernI2 -12; <br>} kern; <br> <br>and this are my classes... <br> <br>@_kernI2 = [B D E F H I K L P R]; <br>@_kernO1 = [D O Q]; <br>@_kernO2 = [C G O Q]; <br> <br>I'd expect the space between A and C to get smaller but instead it gets larger when I activate the 'kern' feature in the opentype preview. The kern occurs correctly in illustrator though, which is terribly frustrating because taking a round-trip to illustrator to check my class based kerning is not acceptable, but this seems to be the only way to check if I've coded my kern feature correctly.</p>
