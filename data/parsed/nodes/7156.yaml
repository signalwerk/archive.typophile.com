    html: <p>Aha! <br>I've wondered about this myself. Very helpful. <br> <br>On a related note, has anyone ever noticed that while previewing <br>class based kerning in the OT preview window, FontLab will <br>apply a small amount of kerning to a glyph within a class even <br>if kerning has not been defined for the glyph? For instance, <br>the "ta" pair within the OT preview window will appear to have <br>kerning even though I haven't applied kerning to "ta". I have <br>however defined a kerning class for "a" and related accents. <br>If i generate the font and check it in InDesign the kerning <br>for the phantom pair of "ta" doesn't appear. This appears <br>to happen with any of my kerning classes within the OT <br>preview window. Hope this makes sense.</p>
