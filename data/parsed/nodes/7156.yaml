      <p>Looking at <a href="http://typophile.com/node/7156#comment-49196" rel="nofollow">Alan's post above</a>, I just noticed that his example will generate a 'bug'. A font with his code will compile, but the last pair (<code>pos T e -55;</code>) won't be accessible (and FontLab or the FDK won't warn you about this).</p>
      <p>The thing is, all pairs that start with the same LEFT class, must be all contained within the same subtable.</p>
