  - id: 304785
    user: 31866
    date: 2008-10-04T18:01:00
    date_raw: 4 Oct 2008 — 6:01pm
    votes: null
    html: |-
      <p>Ok figured it out eventually. I'll put the solution here.</p>
      <p>The deal and how I got there. Too many sub tables cause I did the kerning not in the correct order. Do the classes then the sub classes then the singles. Don't mix and match. </p>
      <p>That was problem Number 2. Reading Adobe's site it alludes to the fact that more than 6 subtables is a point of diminished returns. It does not say it will not compile. More than 6 you will get GPOS errors. Doing things not in the correct order maybe needlessly be generating subtables when they may in fact not be necessary. Why I got there was when I was using the font and noticed a kerning error I just fixed it so it would not go unrepaired. I thought I may never find it again or forget it ever existed. Avoid that habit at all costs.  Write it down and just kern the classes. Check later and see if it is still there and fix it then only.</p>
      <p>Problem Number 1.. Too many class kerns. I experimented to find out what is the max possible and still get it to compile. 15,000 is the magic number. Could be slightly higher but it will not compile 16,000. I had over 32,000..</p>
      <p>What to do, what to do.... Gave up, started again. I readjusted the matrics to eliminate as many pairs as possible then re-kerned the font. I ended up with many more kern classes but fewer overall kerned pairs when I was done, less than 15,000 now.  It compiles, not a single error. This is a hand kerned font. There is no auto kern with this one. That was a lot of work to toss away.</p>
      <p>It's actually not a Fontlab problem, but there is a lack of understanding of it  so there is a lack of documentation on it. Fontlab uses Adobe's system to compile the font. The error is being generated by the Adobe part. </p>
      <p>I asked Fontlab and there answer was we don't also get why that error comes up.</p>
      <p>There is one more thing I didn't get. I figure who cares so you got more than 32,000 class kerns just set it to only export so many pairs.. Nope, if you have that many pairs in the source it will not compile don't matter if you set it to export only two single pairs. You have to have 15,000 or less before that other part of the program even kicks in.</p>
      <p>I'm pretty sure if you kern the font in the correct order you will only have two subtables. Single pair kerning then a subtable for sub class kerning then a subtable for class kerning in that order.   </p>
      <p>And now you know.</p>
