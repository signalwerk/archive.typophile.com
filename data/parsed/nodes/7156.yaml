  html: "<p>Hello, <br>I'm using fontlab 4.6 on winXP. <br>I would like to make a font that support latin script, CE, greek and cyrillic, with some Ot features. <br>I have a lot of kernings pairs and the \"kern\" feature has several problems, that sometimes allow me to generate the font, but finally my font have no kernings at all... <br>I have kern classes, but I have also tried to expand them. Actually I cannot generate the font because of this : <br> [FATAL] &lt;thesans-light300wtwt&gt; GPOS feature 'kern' causes overflow of offset to a subtable <br> <br>I guess this feature is too big, and I have read something about subtables, but I still don't know how to use them. <br> <br>Did someone has already generated an OT font that support three scripts with all the kernings (correctly <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> )? <br> <br>Maybe I have to change the tool? <br> <br>Thank you for your suggestions, <br> <br>Lucia</p>"
