    html: <p>When you introduce your submission as the second generation of your personal portfolio we are expecting to see a "portfolio". No one has said you are a bad designer. We have questions based on what your wrote and then showed us. If you put something up for a critique you are bound to read questions or statements you don't like or agree with. But they are meant to help and guide you. This site is a tremendous resource, with wonderful, insightful people. Read other posts you'll see that at times the feedback can be confusing, different people may make suggestions that conflict with each other. That's what's great about art, there are so many different approaches. However if most everyone is asking (to borrow from an old ad campaign) Where's the beef? That's your constructive comment. Want feedback on your portfolio? post an actual portfolio! Or did you want criticism on your logo? Then post just that. And if you're only looking for someone to say "that's fantastic, you're amazing" only show your work to your mother.</p>
