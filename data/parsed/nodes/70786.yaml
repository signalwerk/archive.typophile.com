      <p>@DavM, Well I come from a programming background and not a artistic one, so I coded the backend to be completely dynamic, so no matter how the grid is made or looks it is just as easy to fill. All I do is add new images to my database through my backend, so that is not really a problem. The main reason I didn't just do a grid is 1) I have done it before 2) It is such a standard shape 3) A lot of people do it. So I thought I would try to be original.</p>
      <p>Ok, so people are no longer confused.</p>
      <p>The home page is 1 image the "ZNET" logo that fades every 10seconds to have a new FILL</p>
      <p>The Works page is a 5x5 grid that is mirrored across the X axis from a randomly generate 3x5 strip, at the time of writing it only has 1 image in it because I am debugging.</p>
