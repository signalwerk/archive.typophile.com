    html: <p>Eos, I believe most of the comments wanting to see more of Nub's work is so we can see if the design makes sense with his overall style of art. Is his portfolio entirely comprised of space theme images? Is he marketing himself to do strictly that kind of work? Is he focusing on a small sample that could cause others to view him as a one-trick pony? Is the space theme appropriate for the work he'd like to be doing? Why the space theme? Was it just a neat idea he had and wanted to see if it worked? These are all legitimate questions that would be asked regarding any project. It's like asking for feedback on a dinner menu after telling us mustard that will be on the table. What else is being served? Mustard could be fine, or it could be awful. Asking for more information is not an attack. Especially since it was billed as a "second gen of my personal portfolio".</p>
