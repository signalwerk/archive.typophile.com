    <p>I have been wanting to make myself a porfolio for sometime. I have gone thourgh many many many designs for myself. And after looking at louie mantia's work and site I decided to go for simple.</p>
    <p>So here is the second gen of my personal portfolio, so far I just have the general design done for the home page, with my newly pixeled logo. So, I am look for critique to make it the best I can.</p>
    <p>So here it is, <a href="http://zachnet.inkincdesign.org/site2/" rel="nofollow"> My Site, ZNET</a></p>
    <p>Please do comment.</p>
    <p>Oh, small thing about the Works page. Basically the idea is that it is a gallery of projects/art I have done. Now when you click the Works tab I wrote a small algorithm that will randomly generate a space invader styled pixel art. Each grey box will be filled with a work in due time, and when a work is clicked a lightbox like effect will happen to bring up a large version of the image along with a project description, title, date, and maybe some other info. Ideas/thoughts on this will be appreciated, hopefully I will have a working demo in a day or two.</p>
