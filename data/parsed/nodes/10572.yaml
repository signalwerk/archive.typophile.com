  html: "<p>Even the version at the designer's own download site (<a href=\"http://moorstation.org/typoasis/designers/westwind/exotica.htm\" target=\"_blank\">http://moorstation.org/typoasis/designers/westwind/exotica.htm</a>) has this anomaly. Since West Wind specializes in historic typefaces, it might simply be an all-too-authentic replication of a defect in the original model. <br> <br>To find out, you could email the designer at: <a href=\"mailto:west_wind@mailandnews.com\">west_wind@mailandnews.com</a>.</p>"
