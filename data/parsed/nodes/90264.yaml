    html: |-
      <p>Do you mean personal computers or computers in general?<br>
      In the case of the former, they were dot-matrix printers*,<br>
      and I suspect the same was true for earlier computers.<br>
      Although the very first ones were probably mechanical<br>
      typewriters "hotwired" to work with computers...</p>
      <p>* I had a Star 1080.  :-)</p>
      <p>In terms of fonts, the main choice one had (for low-end<br>
      printers) was wide ("10 pitch" = 10 characters per inch)<br>
      versus narrow ("12 pitch") often called "Elite", maybe<br>
      because they looked classier (narrow = classy). These<br>
      were sans designs with visible gaps between the dots.</p>
      <p>Speed: If memory serves the bidirectional models printed<br>
      at about 1 second per line, so maybe around a minute for<br>
      a full page. Just a rough estimate.</p>
      <p>hhp</p>
