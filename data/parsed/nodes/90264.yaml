      <p>I've just been working on a font to simulate the dot-matrix output of an Epson MX-80 9-pin printer from the mid 80s.</p>
      <p>I wasted much of my youth creating fonts using a package called GEAP on the TRS-80 to try to print blackletter on that particular dot matrix printer.</p>
      <p>Check out <a href="http://en.wikipedia.org/wiki/Dot_matrix_printer" title="http://en.wikipedia.org/wiki/Dot_matrix_printer">http://en.wikipedia.org/wiki/Dot_matrix_printer</a> as well.</p>
