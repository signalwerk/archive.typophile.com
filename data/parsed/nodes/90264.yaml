      <p>For the few that remember CP/M, its design assumed paper tapes and teletypes as the only available I/O devices.</p>
      <p>When you read tales of old computers, the name <a class="freelinking external" href="http://en.wikipedia.org/wiki/Friden_Flexowriter" rel="nofollow">Flexowriter</a> appears often. It was a particular brand of teleprinter.</p>
      <p>But, come to think of it, maybe this chipchat belongs in General instead of Design…</p>
