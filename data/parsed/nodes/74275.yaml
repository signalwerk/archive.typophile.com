    html: |-
      <p>Wow. This is the first time I've checked the thread since posting my questions and I'm completely blown away by the amount of responses. Thanks so much for all your input guys, it's incredible.</p>
      <p>I would like to respond to everyone individually but that seems a bit daunting, some of you pointed out some interesting things though:</p>
      <p>eliason - Proxima Nova is perfect for the body font, and it's also a font used on Type Kit. Brilliant! That's that problem solved.</p>
      <p>Kristian Sics - Aztlan looks great, I love the way they use it in the pdf. Although I think it's a bit too bold and overwhelming for what I'm going for.</p>
      <p>dezcom and frode frank - I agree with both of you that a hand drawn face might be better, but for this particular brief my client is more interested in aligning the brand within the contemporary fashion market, and I've been explicitly told not to 'over do it' and to keep it as clean as I can but still reference the American element of it. The thing is - their website is full of photographs of moccasins and fringed suede boots, so the whole hand made and natural side of it is more than apparent. It seems like stating the obvious if I were to do a hand rendered logo, which is why I'm leaning towards using a typeface as it would sit more unobtrusively on the website, allowing the products to speak for themselves. Although I do agree the typeface should be soft and naturalistic. Thinking of a brand like <a class="freelinking external" href="http://www.innocentdrinks.co.uk/" rel="nofollow">Innocent Smoothies</a> - the simplicity of the logo type gives room for the playfulness of the logo mark and other brand imagery. Which I think is the same kind of effect I'm trying to go for. Having said that... I might try a fairly restrained / controlled hand rendered type.</p>
      <p>frode frank - Those links to the hand lettering are beautiful, especially this <a class="freelinking external" href="http://www.google.no/imgres?imgurl=http://typophile.com/files/Numbers_5227.JPG&amp;imgrefurl=http://typophile.com/node/47313&amp;usg=__fwBE8Y64AflAKayGj8dlT3lYdhw=&amp;h=583&amp;w=751&amp;sz=136&amp;hl=en&amp;start=5&amp;sig2=evjsub9oj7I0F4cQ_HIwAg&amp;zoom=1&amp;um=1&amp;itbs=1&amp;tbnid=KOS3PsoiXT4JxM:&amp;tbnh=109&amp;tbnw=141&amp;prev=/images%3Fq%3Dnative%2Bamerican%2Blettering%26um%3D1%26hl%3Den%26client%3Dsafari%26sa%3DX%26tbs%3Disch:1&amp;ei=4pWSTJW4MYiLswbVhrGFCQ" rel="nofollow">cursive one.</a> Thanks for pointing those out man.</p>
      <p>aarhaus - Kabel is very good contender, cheers for pointing that one out.</p>
      <p>paul d hunt - tiptoe is also a good one. Although there's something about it I'm not so sure about, can't put my finger on what though.</p>
      <p>Nick Shinn - You're absolutely right, although as said before, client is looking to align the brand in a high fashion context and over stereotyping could just lead to it looking like a cliche. I think my original post wasn't clear and I wasn't sure quite what to ask for, but this thread has definitely helped me to think about what to do with the logo. I know I'm looking for something simple and contemporary, but to have some humanistic elements to it - a subtle nod towards the natural and native side of the products. </p>
      <p>aluminium - I agree with you, that was my first thought when I chose to use it. But the company I'm rebranding are a UK distributor for the original American brand. And for a UK audience, to have a body font like Gotham is enough (when put into context of the surrounding brand elements) to give a sense of where the products come from. Also the Moccasin, when originally brought to the consumer market in the early 20th century, was sold as a souvenir item. And it was your white middle class families on vacation that bought them - since then the moccasin has become a relaxed, casual, house ware shoe (in America especially or so I'm told), so the idea of referencing white America is now just as much apart of its history as its natural, native counterparts. For us Brits at least anyway.</p>
      <p>I may come back when I've got some logo designs to show you guys.</p>
      <p>Thanks so much for all your help, keep them coming if you think of more.</p>
