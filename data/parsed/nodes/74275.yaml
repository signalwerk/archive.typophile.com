  html: |-
    <p>Hi guys,</p>
    <p>I'm currently redesigning a website for a shoe company who sell moccasins and Native American looking boots. I've been asked to design a new logo as well and finding it difficult to create something that is suitably clean and simple, yet with the subtle flavour of a native American style.</p>
    <p>I was also using Gotham for all body and heading text (for it's American vernacular assosications) but just discovered Hoefler and Frere-Jones don't allow their fonts to be used via @font-face on websites (which is what I'd like to do).</p>
    <p>So a couple of questions for you:</p>
    <p>1) Does anyone know any fonts I could use as a starting point for the logo? I'm not looking for something over the top, or with too much character. I'd quite like to keep it simple and fresh, for a fashion brand, but with a touch flair and Native American style.</p>
    <p>2) Does anyone know any fonts similar to Gotham? I'm particularly fond of the full bodied roundness of it.</p>
    <p>Any help or directions you could point me in would be massively appreciated.</p>
    <p>Cheers guys!</p>
    <p>Jordan</p>
