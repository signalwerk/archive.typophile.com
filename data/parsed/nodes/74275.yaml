      <p>In Edmonton, the buses carry advertisements for an employment training service offered to status and non-status persons of First Nations ancestry.</p>
      <p>As there really is no satisfactory authentic typeface reflecting Native American culture, and Kabel didn't come to mind, and those Playbill-like faces that suggest cowboys and the old west were too stereotypical... they played it safe and used a typeface that suggested exotic cultures in a politically-correct way that was readily at hand.</p>
      <p>Papyrus.</p>
