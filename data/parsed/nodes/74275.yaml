      <p>In reality there really isn't a specific 'Native American' (USA title, or preferred to be called First Nation/Aboriginal to the rest of the world) style font, if it is, typically its really cliche and straight cheezy. Anyways the main font used before, used to be Papryus till every designer in North America OVERUSED it on everything cultural/ethnic, and now its just not a good looking font anymore, it was nice if used in a small title like way, but its life span is now over.</p>
      <p>So a similar version to Papryus I found was <a class="freelinking external" href="http://www.windowfonts.com/fonts/fine-hand-let-plain-1-0.html" rel="nofollow">Fine Hand LET Plain:01</a> it kind of has a rustic look to it, with its fabric like edges, this would be good for a small title/headline, and nothing more than that.</p>
      <p>But in most cases, I just prefer to use what I typically use for any other headline/title and body text, suitable for the main target audience (young, old, edgy, conservative, playful, grand, excitement etc.) and use the logo and design aesthetics to show the First Nation theme, as that is my design specialty, considering I am of First Nation's ancestry, from the Pacific Coast of British Columbia, Canada.</p>
      <p>Good luck! &amp; show us your finished logo after!</p>
