  html: <p>I'm looking for a font similar to Hoefler &amp; Frere Jones' Forza (<a href="http://www.typography.com/fonts/font_overview.php?productLineID=100041" title="http://www.typography.com/fonts/font_overview.php?productLineID=100041">http://www.typography.com/fonts/font_overview.php?productLineID=100041</a>) but available in a web font. Linotype's Eurostile is very close, (though the lower case letters are smaller in x-height when compared to Forza) and there aren't the variety of weights available in Eurostile that make Forza so versatile. Anyone have suggestions?</p><div class="imageWrap"><img src="http://typophile.com/files/forza_06_6709.png"></div><p></p>
  html_clean: <p>I'm looking for a font similar to Hoefler &amp; Frere Jones' Forza (<a href="http://www.typography.com/fonts/font_overview.php?productLineID=100041" title="http://www.typography.com/fonts/font_overview.php?productLineID=100041" class="link-external">http://www.typography.com/fonts/font_overview.php?productLineID=100041</a>) but available in a web font. Linotype's Eurostile is very close, (though the lower case letters are smaller in x-height when compared to Forza) and there aren't the variety of weights available in Eurostile that make Forza so versatile. Anyone have suggestions?</p><div class="imageWrap"><img src="/files/forza_06_6709.png"></div><p></p>
