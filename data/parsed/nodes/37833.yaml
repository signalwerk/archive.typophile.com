    <p>I’m getting some strange glyph transformations when importing Word docs into IDCS3. It’s changing all single quotes, double quotes, apostrophes, en dashes and em dashes to various other glyphs. </p>
    <p>The text is set in TNR in the Word doc and I’m applying a paragraph style set with Californian. I end up having to do a Find/Replace with every import. </p>
    <p>Does anyone know how to solve this issue?</p>
