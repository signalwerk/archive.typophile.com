      <p>Hi,</p>
      <p>Thanks for your comments, Nick and Kirsten. I fully agree with you. The arrow version is a simple yet very effective solution. My contact at the client's office told me on the phone that they "didn't like" that version, however, without giving any details.</p>
      <p>My guess is that they somehow feel attached to their <a class="freelinking external" href="http://www.nord-event.de" rel="nofollow">old logo</a> (the "dancing children") in combination with the company name set in "Nimbus sans" (their "corporate typeface"). However, I feel that Nimbus sans (which is actually derived from Helvetica) lacks the character to turn it into a unique word mark.</p>
      <p>On Tuesday I have a meeting with the entire project team. So let's see how it goes.</p>
      <p><a class="freelinking external" href="http://www.designbits.de" rel="nofollow">Webdesign Hamburg</a></p>
