      <p>Just an idea for adding some character to the text: what about adding a little arrow or "circumflex" above the "N". (playing off the direction and the look of a compass.) You'll probably want to make sure that it's not intended to simply be an accent mark on the "N" but an added mark for illustrative purposes. You could do that by making it the same color as "Event" or maybe red (some compasses have red north arrows). Just tossing an idea out there . . .</p>
      <p>As far as spacing goes, you need to tighten the space around the "o" (between the "N" and "r") and between the "e" and "n" in "Event". Maybe also  a little between the "n" and "t".</p>
