    <p>Hi,</p>
    <p>I am currently redesigning the <a class="freelinking external" href="http://www.nordevent.de" rel="nofollow">website of a German event management firm</a>. </p>
    <p>Along the way, the client decided that their logo will need a facelift as well, at least in the long-run. The client wants to get rid of the stickmen in their current logo and prefers a simple word mark instead. They really like the typeface of the current logo (Nimbus sans), however I think it lacks some character. That's why I decided to come up with this:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ne_logo_4406.png"></div><p></p>
    <p>Unfortunaly though, I'm not a logo designer by profession and would need some other opinions before presenting it to the client. Any ideas on how it could be improved further? How about spacing etc.?</p>
    <p>By the way, "Nord" is German for "North". </p>
    <p>Thanks for any input in this matter...</p>
