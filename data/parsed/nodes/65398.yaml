      <p>Uli seems to be saying that Adobe is claiming copyright ownership of the embedded fonts, and that the copyright year it uses is dynamically set to whatever date the user's computer's clock is set to. </p>
      <p>The Adobe copyright appears to refer to the PostScript code that embeds the font. That code is generated at the time you export or save as a .ps file. It's not actually part of the PDF. The same thing happens when you do "print to PostScript" on any document using Adobe's print driver. Whether this dynamically generated copyright notice is a false claim or not, I think probably not since it applies to dynamically generated PostScript code.</p>
      <p>My point is that the Adobe copyright claim(s) in a .ps file that Uli is calling attention to are not referring to the embedded fonts, and that Uli has either deliberately or through ignorance taken PostScript code out of context in his examples, leaving out a very relevant line of code just before the Adobe copyright notice.</p>
