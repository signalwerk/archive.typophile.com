    votes: 0
    html: |-
      <p>Also, FWIW, I don't really know why Adobe assigns the year dynamically to the copyright notice. I agree that it seems odd. But that's a side issue and has nothing to do with your assertion that they are claiming copyright ownership over other peoples' intellectual property. </p>
      <p>The copyrights are clearly for portions of the PostScript code, just as there are copyright notices for the embedded fonts, which are also portions of the entire file (and also PostScript code). The idea that a .ps file can somehow legitimately contain only one copyright notice is absurd.</p>
