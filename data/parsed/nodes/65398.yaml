      <p>Yes, the notices are false. The dates of first publication are, because they are being dynamically created, often incorrect. This alone is enough to render the notices false.</p>
      <p>"Copyright 2525 Hubert Q. Fake."</p>
      <p>That's a false notice, whether it is affixed 61 times a page to a copyrighted work the rights of which are not held by Hubert Q. Fake, or whether affixed to Hubert Q. Fake's autobiography, first published in the year 2524. We'll have to wait until 2525 to see if it can possibly be made valid.</p>
      <p>But unless Hubert Q. Fake was aware that those notices were false when he affixed them AND did so with fraudulent intent, the conditions of § 506 c have not been met. </p>
      <p>What Uli is demonstrating is (1) a computer bug, and (2) lacks a showing of fraudulent intent.</p>
