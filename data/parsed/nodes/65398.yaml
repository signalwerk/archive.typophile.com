      <p>Whether it was Uli's point or not, to satisfy § 506 c of Title 17, you need (1) a false copyright notice + (2) knowledge that the copyright notice is false + (3) fraudulent intent. </p>
      <p>There are many ways in which a notice can be false. The attribution could be correct, for example, but the year could be wrong (as it is in this case). However, absent a showing that Adobe knows about the falseness of this notice, OR absent a showing of fraudulent intent, the requisites of that $2,500 criminal fine would not be satisfied.</p>
