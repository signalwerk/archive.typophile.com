    <p><strong>The Dynamic Font Copyright Year Method</strong></p>
    <p>In the US Copyright Law in section § 506 c (Fraudulent Copyright Notice) we read:</p>
    <p><cite>"Any person who, with fraudulent intent, places on any article a notice of copyright or words of the same purport that such person knows to be false, or who, with fraudulent intent, publicly distributes or imports for public distribution any article bearing such notice or words that such person knows to be false, shall be fined not more than $2,500."</cite></p>
    <p>In the funny font forging industry, two methods of forging the year of copyright are applied:</p>
    <p><strong>1) Static Font Copyright Year Method</strong></p>
    <p>This method means that the font forger usually provides the entire font forging collection with the same static copyright year. See for example the following document:</p>
    <p><a href="http://www.sanskritweb.net/forgers/megafont2.pdf">www.sanskritweb.net/forgers/megafont2.pdf</a></p>
    <p>This document proves that Martin Kotulla forged the copyright notices of no less than 5835 fonts at the same time by always inserting automatically the year "2002" as "year of first publication".</p>
    <p>This Static Font Copyright Year Method is "old hat", i.e. well-known, to most Typophilers. At my website, I documented this static method by numerous documents.</p>
    <p><strong>2) Dynamic Font Copyright Year Method</strong></p>
    <p>This dynamic method will be new to most Typophilers. Therefore I will explain it in more detail so that you will understand, how it works.</p>
    <p>As an example for experimentation, I downloaded the following Font Bureau specimen file mentioned today in another Typophile thread.</p>
    <p><a href="http://www.fontbureau.com/pdf/FB_David_Berlow_Specimens.pdf">www.fontbureau.com/pdf/FB_David_Berlow_Specimens.pdf</a></p>
    <p>If you start Acrobat Reader and look at the PDF "Documents Properties", you will see that this PDF was created on the 20th of May in 2008. Note that this was in last year. Today's date is 16th December 2009, one year later.</p>
    <p>Now dump this PDF to a PS file with the help of an appropriate printer driver. If you open this PS file with a text editor and search for "Interstate-Black" you will see this copyright date:</p>
    <p><cite>%%Copyright: Copyright 2009 Adobe System Incorporated. All rights reserved.<br>
    12 dict dup begin<br>
    /FontType 1 def<br>
    /FontName /FJAAAA+Interstate-Black def<br>
    /FontInfo 7 dict dup begin<br>
    /Notice (Copyright (c) The Font Bureau, Inc., 2003. All rights reserved.) def</cite></p>
    <p>You see that Abobe System Incorporated inserted the copyright year of 2009 for this Interstate Black font, although Adobe obviously is not the copyright owner of the Interstate font. But what is more: Adobe inserted the copyright year 2009, although the PDF file was created in 2008.</p>
    <p>Now search for "KisDisplay", and you will see this:</p>
    <p><cite>%%Copyright: Copyright 2009 Adobe System Incorporated. All rights reserved.<br>
    /WDEAAA+FBKisDisplay-Roman 12 GetGlyphDirectory<br>
    58 &lt;001C60D8A8C9B65062EA780BF59CFC71C99F536F132A402E5A18AF09378A<br>
    09EDE4803C7AE18A10CB9C1A2097B65740A3853796F5C8504B9D62CB62D91B89<br>
    ED5C2A86C975B949C23761309D5A5F7C2FBCF5040F1B72E9F9FA250CAD328D08<br>
    FF879FF83929439E6D836068A8BB7FA64DAB4D4981A383E3A5489D7E0B9C604F<br>
    2612792FCB7C15D8224ED3BD251B3CD5B5FB7A5DE2E0DA53CA2B59CF8E4F7CEE<br>
    2BA39914F4EE40D7CA796E979657ACF599AD571EB09E5EB5BC60C9C62F5B1990<br>
    6AA11B8E26832FD8338FDA4AA49C49E4A49A4AB25DDDE07746D9197365F70680<br>
    5027&gt; |</cite></p>
    <p>Here, Adobe System Incorporated claims to be the copyright owner of the glyphs and that Adobe acquired the copyright to the glyphs of KisDisplay in the year 2009. This is also impossible, because the PDF file containing the glyphs was created in 2008.</p>
    <p>If you have a Windows PC, switch to DOS mode and change today's date to the year 2011. Back in Windows repeat the above experiment. Now you will see this:</p>
    <p><cite>%%Copyright: Copyright 2011 Adobe System Incorporated. All rights reserved.<br>
    12 dict dup begin<br>
    /FontType 1 def<br>
    /FontName /XKLAAA+Interstate-Black def<br>
    /FontInfo 7 dict dup begin<br>
    /Notice (Copyright (c) The Font Bureau, Inc., 2003. All rights reserved.) def</cite></p>
    <p>%%Copyright: Copyright 2011 Adobe System Incorporated. All rights reserved.<br>
    /TPDAAA+FBKisDisplay-Roman 12 GetGlyphDirectory<br>
    58 &lt;001C60D8A8C9B65062EA780BF59CFC71C99F536F132A402E5A18AF09378A<br>
    09EDE4803C7AE18A10CB9C1A2097B65740A3853796F5C8504B9D62CB62D91B89<br>
    ED5C2A86C975B949C23761309D5A5F7C2FBCF5040F1B72E9F9FA250CAD328D08<br>
    FF879FF83929439E6D836068A8BB7FA64DAB4D4981A383E3A5489D7E0B9C604F<br>
    2612792FCB7C15D8224ED3BD251B3CD5B5FB7A5DE2E0DA53CA2B59CF8E4F7CEE<br>
    2BA39914F4EE40D7CA796E979657ACF599AD571EB09E5EB5BC60C9C62F5B1990<br>
    6AA11B8E26832FD8338FDA4AA49C49E4A49A4AB25DDDE07746D9197365F70680<br>
    5027&gt; |</p>
    <p>Now, the copyright year claimed by Adobe System Incorporated is the year 2011. This means, that Adobe has dynamically forged the year of copyright by the Dynamic Font Copyright Year Method.</p>
    <p>Remembering the song "In the Year 2525" by Zager and Evans, I switched again to DOS Mode and changed today's date to the year 2525. Back in Windows, I repeated the experiment. I would have expected that Adobe now inserts the copyright year 2525. But here I was wrong. The result was this:</p>
    <p><cite>%%Copyright: Copyright 1980 Adobe System Incorporated. All rights reserved.<br>
    12 dict dup begin<br>
    /FontType 1 def<br>
    /FontName /XKLAAA+Interstate-Black def<br>
    /FontInfo 7 dict dup begin<br>
    /Notice (Copyright (c) The Font Bureau, Inc., 2003. All rights reserved.) def</cite></p>
    <p>%%Copyright: Copyright 1980 Adobe System Incorporated. All rights reserved.<br>
    /TPDAAA+FBKisDisplay-Roman 12 GetGlyphDirectory<br>
    58 &lt;001C60D8A8C9B65062EA780BF59CFC71C99F536F132A402E5A18AF09378A<br>
    09EDE4803C7AE18A10CB9C1A2097B65740A3853796F5C8504B9D62CB62D91B89<br>
    ED5C2A86C975B949C23761309D5A5F7C2FBCF5040F1B72E9F9FA250CAD328D08<br>
    FF879FF83929439E6D836068A8BB7FA64DAB4D4981A383E3A5489D7E0B9C604F<br>
    2612792FCB7C15D8224ED3BD251B3CD5B5FB7A5DE2E0DA53CA2B59CF8E4F7CEE<br>
    2BA39914F4EE40D7CA796E979657ACF599AD571EB09E5EB5BC60C9C62F5B1990<br>
    6AA11B8E26832FD8338FDA4AA49C49E4A49A4AB25DDDE07746D9197365F70680<br>
    5027&gt; |</p>
    <p>The Dynamic Font Copyright Year Method was programmed by Adobe System Incorporated such that it reverts to the year 1980 for future centuries. Probably, the in-house lawyers and legal advisers of Adobe System Incorporated thought that even a dimwitted court judge would not be so extremely gullible as to believe that Adobe System Incorporated acquired the copyright to the Font Bureau fonts in the year 2525.</p>
