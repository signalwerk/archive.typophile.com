      <p>Look, if you generate the .ps file from the same PDF with a different driver, say the one that Apple includes with OS X, the Adobe copyright notices all vanish! All 4883! Amazing! Could it be that Apple is deliberately trying to thwart Adobe's plot to claim copyright on every document known to man???</p>
      <p>Of course not. It's because your claim is absurd.</p>
      <p>Clearly, the Adobe copyright notices refer to PostScript code dynamically generated by the Adobe PS driver, NOT the contents of the PDF document, or even the .ps document. The PostScript code is necessary to output the content to a PostScript-compatible output device. Only the content appears in the output. You will not see any Adobe copyright notices magically appearing in the output from the device because they have nothing to do with the content. The PostScript code is merely a means to an end, and it is obviously the means that Adobe is claiming copyright on, not the end. Otherwise you would see Adobe copyright notices on every page printed from an Adobe PS device.</p>
      <p>I feel like I'm trying to explain to a child that there are no little people inside the television set. And the child keeps saying, "But look! Little people!"</p>
