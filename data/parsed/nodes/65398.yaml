      <p>Mark Simonson:</p>
      <p>1.</p>
      <p>&gt; Really, do you know anything about how PostScript code works?</p>
      <p>Here is a specimen:</p>
      <p><strong>% Adobe's Whyte Christmas<br>
      /Schrift {/h exch def<br>
        /Serifa-Black findfont<br>
        h scalefont<br>
        setfont} bind def<br>
      150 Schrift<br>
      20 200 moveto<br>
      (ADOBE) true charpath clip newpath<br>
      6 Schrift<br>
      .5 setgray<br>
      -200 0 moveto<br>
      40 {gsave<br>
       20 {(Whyte Christmas ) show} repeat<br>
       grestore<br>
       4 10 rmoveto} repeat<br>
      showpage</strong></p>
      <p><a href="http://www.sanskritweb.net/temporary/Whyte-Christmas.pdf">www.sanskritweb.net/temporary/Whyte-Christmas.pdf</a></p>
      <p>2.</p>
      <p>&gt; The copyrights are clearly for portions of the PostScript code</p>
      <p>Copyright notices must not be affixed to portions, but only to works<br>
      (see § 401 US Copyright Law).</p>
      <p>None of the four thousand eight hundred eighty-three lunatic copyright lines was affixed to a work.</p>
