    html: <p>Maybe we need to get to four thousand eight hundred and eighty eight posts on this subject before Uli will understand that Adobe is only copyrighting the Acrobat Postscript and not the included fonts, photographs or any other content placed by the user in the generated PDF file. PostScript was the basis for the founding of Adobe and for a number of years the company's best income generator - today Adobe has branched out in a variety of directions and PostScript and fonts  are no longer as important as they used to be.</p>
