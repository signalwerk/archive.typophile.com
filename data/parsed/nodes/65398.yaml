      <p>Mark Simonson:</p>
      <p>I looked at the PS file in more detail:</p>
      <p>The Font Bureau PDF file FB_David_Berlow_Specimens.pdf has exactly 80 pages, and if I set the date of my PC e.g. to the year 2037 and dump the entire 80-page PDF file to a PS file, this PS file will contain exactly 4883 (four thousand eight hundred and eighty-three) copyright lines, i.e. 61 copyright lines per PDF page, with always the same wording:</p>
      <p>"Copyright 2037 Adobe System Incorporated"</p>
      <p>Since ONE copyright line refers to ONE copyrighted work, this means that Adobe System Incorporated claims that this PS file contains 4883 copyrighted works owned by Adobe System Incorporated.</p>
      <p>By these thousands of "copyright 2037" notices embedded into this PS file, Adobe System Incorporated wants to make believe that it is the copyright owner of thousands of copyrighted works, which had been created (past tense) in the year 2037 (future tense).</p>
      <p>From the psychiatric point of view, this is highly interesting: I guess, if a lawyer or a legal adviser at Adobe System Incorporated wrote a book, it would consist of nothing but thousands of copyright notices, i.e. 61 copyright lines per printed book page.</p>
