      <p><a href="http://www.copyright.gov/title17/92chap1.html">http://www.copyright.gov/title17/92chap1.html</a></p>
      <p>In particular...</p>
      <p>§ 103. Subject matter of copyright: Compilations and derivative works</p>
      <p>[...]</p>
      <p>(b) The copyright in a compilation or derivative work extends only to the material contributed by the author of such work, as distinguished from the preexisting material employed in the work, and does not imply any exclusive right in the preexisting material. The copyright in such work is independent of, and does not affect or enlarge the scope, duration, ownership, or subsistence of, any copyright protection in the preexisting material.</p>
