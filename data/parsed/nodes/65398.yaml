      <p>The Adobe copyright notice immediately follows what it refers to, "ADOt1write":</p>
      <p>%ADOt1write: (1.0.24)<br>
      %%Copyright: Copyright 2037 Adobe System Incorporated. All rights reserved.</p>
      <p>In the code above, the font has already been defined, and this line just requests it:</p>
      <p>/XKLAAA+Interstate-Black findfont dup</p>
      <p>In your original post, here is where an embedded font actually starts, and note that it includes a proper copyright notice:</p>
      <p>12 dict dup begin<br>
      /FontType 1 def<br>
      /FontName /XKLAAA+Interstate-Black def<br>
      /FontInfo 7 dict dup begin<br>
      /Notice (Copyright (c) The Font Bureau, Inc., 2003. All rights reserved.) def</p>
      <p>Really, do you know anything about how PostScript code works?</p>
    html_clean: |-
