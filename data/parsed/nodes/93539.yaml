    html: |-
      <p>When I was in high school Eurostile was everywhere, especially on institutional publications (yearbooks, annual reports, etc.). I don't remember associating it with technology, but it seemed to embody all the qualities that I, as a nerdy teenage boy, aspired to: Masculine, cosmopolitan, modern. If it were a fictional character, it would have been James Bond: A tough guy in a tux.<br>
      I don't use it much anymore, probably because of all that adolescent emotional baggage I have attached to it.</p>
