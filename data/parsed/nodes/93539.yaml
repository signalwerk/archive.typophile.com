      <p>I see a lot of people wearing bell bottoms again.<br>
      I dislike berating a face just because it's fallen "out of style."<br>
      Reminds me of my old by-line: "Yes, I'm old, but I'm back in style."<br>
      As for Aldo Novarese, he spoke of a revised cut of Eurostile family (late 1980s/early 1990s) if Agfa could license. I don't think that ever happened, but his last typeface was with Agfa.</p>
