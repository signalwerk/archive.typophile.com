    <p>I Love Eurostile is a (parody) tribute to the typeface Eurostile. The inspiration comes from the over usage of the typeface by industrial designers and Hollywood blockbusters. <a href="http://iloveeurostile.com" title="http://iloveeurostile.com">http://iloveeurostile.com</a></p>
    <p>What's your take? Are you sick of seeing Eurostile? Do you think it's a good typeface? How about Bank Gothic? ;)</p>
