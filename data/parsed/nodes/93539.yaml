    html: |-
      <p>I love Eurostile but I can't imagine a situation where I might use it now. Like Mojo I first came across it when I was no'but a lad. It was a trendy, modern face when I was an apprentice comp. in the sixties and I longed to work for a company that had such faces available. I loved—and still do love—that a; there's something very pert and insolent about it, especially in the extended variants.</p>
      <p>It was around the same time that I bought a second-hand leather arm chair for my first 'pad'. It cost thirty shillings. I still have it. The leather is scuffed and split and crudely patched but I could no more consider throwing it out than I could consider cutting off an arm.</p>
      <p>It was in that chair I sat and also read almost everything that Asimov wrote.</p>
      <p>Whilst I understand the point you make Nick, I don't feel that any of those examples are in the same league; but I would probably use them for the reasons you suggest.</p>
