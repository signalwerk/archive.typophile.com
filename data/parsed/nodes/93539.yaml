    html: |-
      <p>Hrant,</p>
      <p>It’s only nostalgia if you think that the old stuff was, somehow, better. My wife is an awful lot like that: I am having a hell of a time convincing her to give up on a chair that we bought at Sam’s Club for sixty-five dollars twenty years ago, and at least give a new one a try at the local La-Z-Boy showroom. She will have none of it. Consequently, I am thinking about shaving off my mustache and moving with her to Amish Country. At least then, we’ll be living in a century she seems inclined to feel more comfortable with.</p>
      <p>Nick Shinn is quite correct that it’s a magnificent design, and was very up-to-the-minute when it was first released. As a result, it was immensely popular—at least, to the <em>cognoscenti</em>—and got a lot of exposure.</p>
      <p>Just the right amount of ice cream is heaven; too much ice cream is brain-freeze hell—and worse, down the digestive tract. In instances when the typeface matches the timbre of speech which it enunicates, it’s still a no-brainer choice.</p>
    html_clean: |-
