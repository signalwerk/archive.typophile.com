  html: |-
    <p>I've been wracking my brain checking all of the big foundries trying to ID this font. I uploaded the image to 'WhatTheFont' and posted to the WTF Forum without any luck. The Temsamani site appears to be from Vienna, Austria so I have a gut feeling the font may be from a foundry in Europe.</p>
    <p>Any help with an ID very appreciated.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/temsanami_4259.jpeg"></div><p></p>
