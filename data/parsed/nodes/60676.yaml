    html: |-
      <p>Thanks so much Nick... You nailed it!</p>
      <p>I searched through the G-Type collection and felt Houschka was close but mistakenly thought the A, M, N and R in the logotype were standard characters. I've learned a good lesson today. With all the extra glyphs in the Pro versions (Houschka Pro has 853 - Wow!) it certainly makes font ID of logotypes a bit tricky when designers replace standard characters with a glyph or slightly modify others.</p>
      <p>Keep up the great work.</p>
    html_clean: |-
