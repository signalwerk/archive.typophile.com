    html: |-
      <p>The mystery has been solved after an email to the company. They sent my message to the designer who was kind enough to send the following feedback.</p>
      <p>---------- snip ------------<br>
      We are very happy to learn that you like the typeface of our client's logo. Unfortunately the typeface which you are interested in is currently not available, as it is a corporate typeface created for the branding of Temsamani Couture. But the typeface might get released through <a href="http://www.ydt-fonts.com" title="http://www.ydt-fonts.com">http://www.ydt-fonts.com</a> in the near future.</p>
      <p>All the best,<br>
      Yvonne Diedrich<br>
      ---------- snip ------------</p>
      <p>After some research I discovered Yvonne also designed:</p>
      <p>– <a href="http://new.myfonts.com/fonts/letraset/eplica/overview.html" rel="nofollow">Eplica</a> (Published by Letraset in 2001. It was among the winners of the (<a href="http://www.tdc.org/news/2001Results/Eplica.html" rel="nofollow">2001 Type Directors Club Type Design Competition</a>)</p>
      <p>– ITC Dyadis (Published by ITC and Linotype in 1998)</p>
