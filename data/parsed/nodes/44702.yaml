    html: |-
      <p>It's my first post here on Typophile so hello to everyone.</p>
      <p>I'm really glad I stumbled upon this topic cause I've been thinking and discussing it a lot with my friends lately. I have rather web-design background so some of the stuff I'll say may seem irrelevant to some of you.  I've been struggling to come up with a good logotype and portfolio design for a few months now. I finally made it—at least I hope so—but the whole process was a pain in the neck. Here is what I realized:</p>
      <p><strong>Have a clear idea of what you're design should be like</strong><br>
      It may be so obvious, but many people find themselves acting to make a design not having even a slightly organized thoughts on it.. I see a lot of guys launching their design tools and trying to come up with some cool instant prototypes. Seeking inspiration is crucial here.</p>
      <p><strong>Make no deadlines</strong><br>
      Of course, you have to have a deadline when delivering a project, but if you can afford to wait—do so, don't rush it. Bad, fast decisions can cost you a lot.</p>
      <p><strong>Stick to the idea, but starting from scratch isn't always that bad</strong><br>
      Initially I wanted to design myself a nice graphic/web-design portfolio with some extensive usage of Helvetica, somehow I ended up having a vintage-like design full of sans-serif typefaces. I'm glad I changed my mind in the middle of the designing process cause I'm pretty much satisfied with the result, but abandoning work on half-finished project is not what everyone can do.</p>
      <p><strong>It's awful unless you really think it's beautiful</strong><br>
      If your not satisfied with a button or a small element of the whole you may want to work on it but if you're having second thoughts on the whole design line you should consider changing it. That's what I did with the Helvetica-based theme.</p>
      <p>I hope you'll find some of these useful if not obvious.</p>
      <p>Kind regards,</p>
      <p>Piotr</p>
