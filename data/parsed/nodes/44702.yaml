      <p>My design is much better when I work for—and with—others. That’s something that’s always hurt me in school; I probably should not have enrolled at a fine art school where so much revolves around individual “genius” and the students have little interest in working together. It doesn’t help that I have little interest in editorial matters or self expression; if I wanted to collect piles of text and image to arrange I’d be in journalism, if I wanted my feelings on a canvas I’d paint. I’m looking forward to getting back into a studio where I can brainstorm with people who aren’t convinced that their minds are the fount from which will spring human reality.</p>
      <p>Interestingly, though, I have no trouble doing type or lettering for myself. I can sit around drawing letters all day and not even notice the time slipping by, and I have plenty of ideas to keep me busy when I’m job hunting in the next few months.</p>
