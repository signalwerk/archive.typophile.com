      <p>I think you are not alone, Eric. Most of my design school buddies, and even some designers I worked for after I graduated, either had the same problem or made knowing jokes about it. For example, there is an old Spanish saying, "En casa de herrero, cuchillo de palo." An English equivalent would be, "The mechanic's car never runs." (The Spanish phrase translates as "In the blacksmith's home, the knives are made of wood.") </p>
      <p>It took me forever to come up with my own letterhead and business cards, after many false starts. And like other designers, I was never happy with the solutions I came up with for myself! </p>
      <p>There's a lot of truth in everything kidcranium says... Approach the problem as if it were for a third party -- list the clients' objectives, try to put down in writing what "their" design philosophy is, etc. Giving myself a deadline has worked for me as well. Also, I show my comps to fellow designers, to try to get some objective criticism. You will always have blind spots when you design for yourself... It's good to have another designer look at things with a cold eye.</p>
