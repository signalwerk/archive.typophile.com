    html: <p>I've found you have to work twice as hard if not more, and twice the timeframe. It helps to step away from your work and give yourself distance and time for reflection, more so than with typical client work. It does help to give yourself the same style of brief a client would give yourself and treat the process similarly. Clear objectives, a list of key attributes to define, an outline and some level of constraints are important to consider as well. (Although it's easy to abandon any structure when it's your own work/project)</p>
