    html: |-
      <p>@Ricardo &amp; mili: same in portuguese! We say “em casa de ferreiro, espeto de pau”, which means “at a blacksmith's house, the spit is wooden”, but since it's understood, we end up just saying the first part, “em casa de ferreiro…”. That's pretty interesting! Though probably it shouldn't be that amazing; it would probably be really amazing if we found something similar in an asian or african culture.</p>
      <p>Anyways, yes, definitely, totally, designing for ourselves is tough. I have no suggestions and I like – and have tried – some of these, but they're really hard to follow. As a designer, we kind of have the totally unrealistic job of summarizing entire personalities into one little piece. We rarely fully achieve that, but we still keep on doing it.<br>
      It's a lot easier when it's all about someone else, as it is a lot easier to give advice to others than to make decisions about our own lives. It's a bit about perspective. It's also about us not wanting to oversimplify ourselves and our lives – as someone already mentioned –, since we, human beings, like to think of ourselves as quite complex, and that's really a good thing. I think that we should probably try working for ourselves much more often, and I think that the day you fully understand yourself, your own thoughts and ideas, your personality, what you think matters, what you really want… that day you become a MUCH better designer and, more importantly, a much better YOU (in a sense that you'll probably become much more yourself than ever). Which I think is also rare. :P<br>
      I think that's the ultimate challenge. This is actually an internal fight between the person we truly are and the person we would like to be and/or the person we would like others to think we are. It's really us trying to choose what's more important: appearances or true essence. And that's probably the only time we realize that, when we do stuff for other people, we are, in fact, putting this dilemma aside in exchange for money.</p>
      <p>So, heck! This should be hard! No suggestions for you! :P</p>
      <p>ruD</p>
