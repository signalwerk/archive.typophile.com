    html: <p>This topic has been on my mind a lot lately. I've been trying to come up with a new identity for my company for the last two or three months now. I'll get a new logo I like, design business cards, website, etc., and then a week later I'm not happy with it. I think I've probably come up with 3 or 4 new looks for myself, but nothing sticks. I'm working on a new one now and I think I'm just going to draw the line here and go ahead with it. It sure is frustrating though...</p>
