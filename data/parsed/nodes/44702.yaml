      <p>I like designing for myself  but I agree that it's a challenge. Being your own client means that you have no one to blame if the result is  not as good as  you want it to be. A few times I have designed the logo and the corporate identity for the design studio where I have been employed. It's a good opportunity to push yourself forward and to show your clients how great a designer you are, but at the same time it's a place you really don't want to do something mediocre. For a graphic designer the business card has a quite unique marketing value. A space where you can and should show what you can do. That is probably why so many designers think it's difficult and a bit scary.<br>
