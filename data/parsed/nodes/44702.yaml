      <p>Design is always easier when you know who you're talking to. So imagine a scenario whereby Prospective Client A says to Delegating Authority B, "I think I've found a designer." Delegating Authority B is going to say, "Oh really? Who?" Design all of your own materials to impress Delegating Authority B.<br>
      Or, said another way, every prospective client has somebody they want/need to impress; when you are designing your own identity that somebody is your real target audience.<br>
      And knowing that you are addressing a fictitious, harried, socially higher-ranking third party who is responsible for the decisions and actions of subordinates and who's daily function is to stand as a symbol of their own skills in coordinating the work of others should make things a whole lot easier.</p>
