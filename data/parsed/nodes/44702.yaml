      <p>I don't like designing for myself, and I'm rarely happy with the result for more than two weeks, if even that long.</p>
      <p>The Finnish proverb related to those mentioned by Ricardo is "Suutarin lapsilla ei ole kenkiä." That is Cobbler's (Shoemaker's) children don't have shoes. I've heard it so many times by various designers, they just say "shoemaker's children..." and shrug their shoulders and roll their eyes.</p>
      <p>I try to have a fairly strict colour and font system and do something that feels right and maybe looks like me. I ask my family's opinion and if possible, some other designers' thoughts. Christmas cards are usually done in last minute, so there's no time to dwell on them too long.</p>
