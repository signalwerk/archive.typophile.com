    html: |-
      <p>Firstly, excuse for my poor English but here is what I have to say.</p>
      <p>I think it's easy to analyze and give solutions for someone else's project than ones' own to design. Usually you are your own worst critic or client. When a client may reject your idea or have a different point of view, you usually can back up with good reason from principles and reasons that is the basis of your idea. It's hard to do it for yourself because the dialog is less back and forth, it's more jumbled in your head as both personalities in your mind come from the same person.</p>
      <p>I have had many problems trying to do my own site and it is embarrassing to tell people. My site hasn't been updated for the last 7 years, and it's beginning to hurt now in my freelance. I have been lucky that I get referrals so delaying my own promotions was too easy to push aside.</p>
      <p>With the recent lack of clients in the last few months it's been a very good lesson for me. It's very humbling to look back and know how lucky I have been and appreciate security when I had it. </p>
      <p>So finally, I have pushed myself to "define" myself through a website, a new business card because I just moved and all this worry and small pain has been humbling... </p>
      <p>Maybe all this delay is that I am don't have the personality to promote myself. I always believed that my work says more than what I have to say for myself to new clients and friends. However when you don't have work coming through you realize it is not about being brave to let the work speak for itself... it's more about getting people's attention that you are around in their minds.</p>
      <p>1. List the reasons why you are doing what you "need" to do for yourself in order to get your work out there..<br>
      2. Stick to that agenda and give yourself a deadline.<br>
      3. Promise yourself a reward if you do complete it on time.</p>
      <p>We are all perfectionists but how perfect can we be when it never gets done?</p>
