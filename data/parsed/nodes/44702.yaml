    <p>Hi all.</p>
    <p>Been away a while. I have the hardest time designing for myself. Does anyone else have that problem? I'll like it, for like 2 seconds, and it's gone. The creative juices flow when I'm working on project for other people, just not myself, to show my work (ie a portfolio site showcasing my work). </p>
    <p>What's your secrets? Fellow designers...</p>
