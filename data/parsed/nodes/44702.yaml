      <p>I had a client that grew up under me and really dominated my time. That went on for many years (like eight!) and nothing I did for them really was interesting—blah, blah, blah. When it came time to do cards and web and all the pieces associated I did some illustration just to inject a bit of myself and add some flavor to the whole thing. It was my attempt to say, yes I've helped these clients achieve what they wanted, but I am capable to doing something more interesting as well.</p>
      <p>I've always avoided having a signature look or style because I thought it would be in and then go away. I also see so much same. Now I really question that. Who knows? Looks like I'm about to move so I'll have a chance to rethink everything again.</p>
