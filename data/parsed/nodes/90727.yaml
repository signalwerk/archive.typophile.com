  html: |-
    <p>Hi,</p>
    <p>I'm helping organise a small festival of walking experiences taking place around Birmingham later this month and wanted to let you know about one of our events:  <a class="freelinking external" href="http://stillwalking.org/sw12/marshall/ " rel="nofollow"> Birmingham Graphic DNA</a></p>
    <p>Geraldine Marshall will lead a guided tour of the ad hoc lettering of the Digbeth area, reflecting on Birmingham’s history of type design and the ever-evolving relationship between lettering and typography. </p>
    <p>This links in with her research asking if the lettering and typography of the city has a regional accent analogous to that of spoken word.</p>
    <p>Saturday 24th of March, tickets are £4 each (+ booking fee).<br>
    <a class="freelinking external" href="http://stillwalking.org/sw12/marshall/" rel="nofollow">http://stillwalking.org/sw12/marshall/</a><br>
    <a class="freelinking external" href="http://stillwalking.org/2012/03/01/birmingham_graphic_dna_digbeth_found_fonts/" rel="nofollow">http://stillwalking.org/2012/03/01/birmingham_graphic_dna_digbeth_found_fonts/</a></p>
    <p>Thanks,<br>
    nikki</p>
