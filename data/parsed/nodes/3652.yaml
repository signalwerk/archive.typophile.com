  html: <p>Hi everyone. I am designing a poster for a school project. The poster is in the Art Deco style  &amp; I am limited to the fonts I have installed on my computer (Type Classics for learning.) Calcite Pro &amp; Chicago are 2 I like best. What do you think? OR ... do you have a better suggestion? </p>
