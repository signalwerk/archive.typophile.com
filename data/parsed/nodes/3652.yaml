    date_raw: null
    votes: null
    html: "<p>No disrespect to John, but you should figure this out: the Art Deco period was mainly during the 1920s and 30s (with a revival c.1970), and characterized by geometric shapes. So categorize the typefaces you have accordingly, and you will come up with a hardcore, authentic choice. <br> <br>You can find out the dates of the typefaces at the Adobe.com/type website.</p>"
