      <p>To get back on track a bit, Carter &amp; Cone’s Monticello is a sort-of-scotch roman &amp; much better rendered than the various PostScript Caledonia’s &amp; Linotype Scotch Roman for setting text.</p>
      <p>Princeton commissioned the digital Monticello (non-exclusive). I believe you can buy it from Linotype as well, but in the early days at least, it didn’t have the full character compliment that the fonts from Carter &amp; Cone had. Besides, one should support the small foundries.</p>
      <p>If if bothers you that Monticello is derived from a Binney &amp; Ronaldson (i.e., American) typeface, then use one of the horrible PostScript Scotch romans — just remember that B&amp;R were good thieves, so I’d say it is a “name thing.”</p>
