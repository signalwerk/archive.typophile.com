      <p>Like others who frequent these boards I have feelings about type the way most people do about other people. </p>
      <p>Not very rational but: </p>
      <p>ITC Garamond I actually think can look good in display, though it is bad in text. I think Tony Stan drew type well, including American Typewriter and Berkeley. So kill me. </p>
      <p>Souvenir I think is all around a very good face. It just has a softness that is out of fashion—or it it coming back?</p>
      <p>Korinna I don’t know. </p>
      <p>University Roman they should kill and put a stake through its heart, before it can extend its evil tendrils further :)</p>
      <p>Edit: Nick, looking at the numerals, I see they don’t suffer from the truly ungainly proportions of the rest.</p>
