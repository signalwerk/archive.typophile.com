      <p>Actually, University Roman is neither a Victorian face nor a 70s face. It’s based on a face called Stunt Roman, from the Speedball Textbooks by Ross George, which appeared in several editions from the 1920s on. In the 13th edition (ca 1938, the earliest I have), it looked like this...</p>
      <p></p><div class="imageWrap"><img src="/files/Stunt-Roman_5109.gif"></div><p></p>
      <p>By the 20th edition (issued 1960; reprinted 1965 &amp; 1972), a number of the quirks had been smoothed out, and it looked alot more like the face we’ve come to know as University Roman.</p>
    html_clean: |-
