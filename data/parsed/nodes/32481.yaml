      <p>This makes sense—sort of—as lettering. Since the letterer can alter the swashes and proportions at will, they perhaps can make the ’stunt’ work for a few words.  </p>
      <p>The ’stunt’ is to have extremely wide round letters and extremely narrow straight letters. Ungainly proportions. Then throw on the swashes.  </p>
      <p>I don’t think it ever worked as a font.</p>
