  html: |-
    <p>Is there any way to cycle quickly through weights within a family from the Glyph Window?</p>
    <p>Basically, if I have glyph 'A' of Example Bold open and make an edit is there a command to quickly switch to Example Light in the same Glyph window to make the same edit and continue on through the family without closing the window?</p>
    <p>Thanks,</p>
    <p>Mike</p>
