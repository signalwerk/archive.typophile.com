      <p>apologies if my post implied that Leah had not contributed to the Fed Ex logo. But saying she 'drew' the Fed Ex logo probably wasn't accurate either.</p>
      <p>out of curiosity, I emailed Lindon Leader and he was kind enough to reply so...</p>
      <p>Leah Hoffmitz' contribution will now be burnished into the record.</p>
      <p>Leader:</p>
      <p><cite>Once I had the general concept of the logo conceived, including the hidden<br>
      arrow, I engaged Leah--one of the best type designers anywhere--to advise on<br>
      the reconstruction of the letterforms to best accommodate the arrow, which<br>
      she did admirably. However, because I had asked Leah to work with Futura<br>
      Bold, I was still not satisfied with the distinctively smaller Futura<br>
      x-height, the very tall ascender of the lower-case "d"  or the relatively<br>
      even Futura strokes. It was then that I decided to explore the possibility<br>
      of marrying Futura Bold with Univers 65. The result is what you see today.<br>
      Leah is indeed to be credited with an important contribution to the success<br>
      of the FedEx identity program.</cite></p>
