    html: |-
      <p>Beejay's kerning over nikon logo is more like it. Sand/water between letters is the way majority teaches kerning. Also upside down reading helps, because you're not disturbed by the meaning of letters but rather look at shapes.</p>
      <p>As you pointed out yourself: it's not geometry and calculation. It's visual balance. And Beejay's version is balanced. Pixel too wide or not, it's better.</p>
      <p>I'm not commenting on Brixton because my mind today is not at its best for such sophisticated lettering.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
