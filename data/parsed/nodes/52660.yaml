    html: |-
      <p>Yeah, the ko is too tight. And the stuff about sand between the letters is a helpful idea, but can't be taken too seriously either. If you try it with very well kerned type, you will see that it's not really true. It does need to be visually even in color, but nobody has a complete formula, though some out there are pretty good. </p>
      <p>When you have difficulty spacing something, I think it is often a problem with the letters themselves. I suspect your o or k may be too wide compared to the n, and that is giving you problems. </p>
      <p>For me the black letter with the wood-cut look characters don't work together.</p>
    html_clean: |-
      <p>Yeah, the ko is too tight. And the stuff about sand between the letters is a helpful idea, but can't be taken too seriously either. If you try it with very well kerned type, you will see that it's not really true. It does need to be visually even in color, but nobody has a complete formula, though some out there are pretty good. </p>
