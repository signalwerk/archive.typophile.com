    html: |-
      <p>also, although everyone has a different method for kerning, here is mine</p>
      <p>stare at the word without intentionally focusing on any one letter or its surrounding white space (kind of like what you do with those old magic eye posters). keep adjusting until no one letter comes to focus (if the word isn't kerned well, the offending letter will often come to focus no matter how hard you try not to focus on it.</p>
      <p>it sounds complicated but it's the method that's always worked best for me</p>
