    <p>Hi guys, below is the typeface that I designed for a particular project of mine and I am really appreciate if you guys can give me some comments and suggestions. I designed my typeface by modifying a few san-serif typefaces. Also, I am trying to incorporate pensil sketch with vector to create this typeface. I experimented with two different colors, yellow and light brown.</p>
    <p>Chriswong</p><div class="imageWrap"><img src="http://typophile.com/files/u_5339.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/u1_4587.jpg"></div><p></p>
