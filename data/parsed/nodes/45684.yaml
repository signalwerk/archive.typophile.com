      <p><cite>I designed my typeface by modifying a few san-serif typefaces.</cite></p>
      <p>I don't recommend that. For experimental purposes or for reference to learn something out of it, fine, but if you are going to create your own typeface, create it from scratch. That's when you really learn a lot and become a better type designer from that. Also, it gives your face something that is a necessity: <em>originality</em>.</p>
