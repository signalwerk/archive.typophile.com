      <p>The thing that seems to stand out that could use some tweaking is the scribbled lines that are part of curves, like in the C, D and G. I wish they would follow the curve better, they seem a little stiff, especially for scribbles. I might also suggest instead of the scribbling, you try hatchmarks and cross-hatchmarks, something a little more refined and consistent.</p>
      <p>I agree with Stephen; tis a fine poster.</p>
