    html: <p>If you go with sampling an array of magazines over a time period, the next question is what will count as an instance of one font. Magazines will use a specific font for text over the course of a few years, as part of its style, but advertisements for a product may use an array of fonts, depending on the campaign. Would you count each year that a magazine uses one font as an instance of usage, even though it's one continuous use?</p>
