      <p>Wow, that would be an amazing and ambitious project! And you are absolutely right that it is the presentation that is the easy part. </p>
      <p>Hmm, I guess some questions to ask to get the ball rolling would be:</p>
      <li>Should font usage data be limited to a certain country or should it be international?
      </li><li>Should we look at specific types of media? Ads? Books? Packaging? Signage? Movie credits?
      </li><li>What about more emphemeral and mundane things like hang tags on clothes, instructional manuals?
      </li><li>And what about new types of media that have come into use only recently, like the Internet?
      </li><li>Should we only chart one medium to see how font usage has changed in one context?
      </li><li>Or should we chart differeint media, ads and web alike, to see how font usage has been affected by context?<br>
      </li>
