      <p>I was thinking of selecting a range of 20 or so publications that actaully span a decent length opf time. Quite a wide range too, trade mags, professional mags as well as pop mags. Then, go through each, page by page and write down everything. I'm not sure if that's a good means of getting a sample, but it seems pretty good right now. Any ideas about how to effectively hone a sample group? I was envisaging this being a group effort in terms of the actuall analysis, it would take AGES!!<br>
      It would be worth perhaps making the spread of info display not only type, but when and where (country/media) too. This means film, swing tags etc. To get the ball rolling, a focus in the interim on magazines might be the go? It has to start somewhere...</p>
