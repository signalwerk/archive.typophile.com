    html: |-
      <p>Good idea! In addition to Danas first comment I suggest that the survey should also be split into groups of fonts – e.g. serifs/sans etc. - for ease of use both in data accumulation and in readibility of the "output". There are several web pages that give the front pages of daily newspapers, I once categorized the ~400 "logo heads" (i.e. the newspaper titles) for a day into several groups of typefaces (sans, serif, typewriter/egyptienne, blackletter, non-latin, plus Caps in those categories) and country/continent. It was somewhat restricted to the pictures I could accumulate through automated downloading w/ wget, but it showed quite a lot of different uses of type in different regions. It was a heck of work, and I lost it after not making a backup copy.<br>
      I imagine one could combine such an approach with the question of unique type faces and think that such a survey could help quite a lot both in identifying typefaces from a certain period of time and in designing new stuff.<br>
      One more question that comes to my mind: What about combinations of typefaces? I think that these contribute to the appearance of a designed product and should not be forgotten (although that would further complicate the survey).</p>
