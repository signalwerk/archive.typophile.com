    <p>I have noticed that there are a quite a few posts that deal with what fonts were used and when (posted by myself as well).<br>
    As part of this section, I am proposing a typographic survey that charts font usage by year. For instance, when was Helvetica REALLY big etc.<br>
    I don't really know how the info would be collected, and validated. The presentation is the easy part (for me anyway).<br>
    Conceptually it would look like this: <a href="http://www.babynamewizard.com/namevoyager/lnv0105.html" title="http://www.babynamewizard.com/namevoyager/lnv0105.html">http://www.babynamewizard.com/namevoyager/lnv0105.html</a></p>
    <p>Thoughts, ideas, suggestions?</p>
