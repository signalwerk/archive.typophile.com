    html: <p>Tanya, <br> <br>a good specimen book of handwritten scripts from the pre letter press time is the PROBA CENTUM SCRIPTURARUM from Leonhard Wagner from the early 1600 century. The German Insel Verlag has printed a very nice facsimile in the 70`s. Every good typographic university library should have a sample of it.  <br> <br>Sadly I don�t know a good digital typeface touching the spirit of these scripts. <br> <br>In general a good calligrapher should be able to write something more authentic. He can use roman versals, rotunda, textura and of course antiqua letter forms. <br> <br>ps. Maybe I misinterpreted this thread - you look for letters of the native peoples? In this case you have to use native symbols - but this way could lead into a trivial, trashy, common thing.</p>
