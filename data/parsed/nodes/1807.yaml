    html: <p>I've been involved with Native American publications since the late 80s. <br> <br>Since there is no true Native type free from European influence, you should concentrate on good design choices for any historical museum exhibit. The Native and European text should feel equal. Any self-conscious treatment of the Native languages will get you no closer to a true Native typography, and may appear to some to be condescending and racist. So, handwritten, distressed, or otherwise quirky fonts should be ruled out unless you are also using them for the French/English. <br> <br>I agree with John Hudson about trying italic &amp; roman to differentiate between the cultures. The odd word or two needing to be "italicized" in blocks of italic text should be set in roman. If you weren't tied to using period faces, a carefully selected serif / sans serif combination would work well. Again, nothing quirky. <br> <br>There's such a wide variety of styles in Native American art. I wish we could see the exhibits you are designing for.</p>
    html_clean: <p>I've been involved with Native American publications since the late 80s. <br> <br>Since there is no true Native type free from European influence, you should concentrate on good design choices for any historical museum exhibit. The Native and European text should feel equal. Any self-conscious treatment of the Native languages will get you no closer to a true Native typography, and may appear to some to be condescending and racist. So, handwritten, distressed, or otherwise quirky fonts should be ruled out unless you are also using them for the French/English. <br> <br>I agree with John Hudson about trying italic &amp; roman to differentiate between the cultures. The odd word or two needing to be "italicized" in blocks of italic text should be set in roman. If you weren't tied to using period faces, a carefully selected serif / sans serif combination would work well. Again, nothing quirky. <br> <br>There's such a wide variety of styles in Native American art. I wish we could see the exhibits you are designing for.</p>
