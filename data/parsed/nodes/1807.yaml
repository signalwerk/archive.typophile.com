    html: "<p>I know I can't truely represent the writing systems of the First Peoples (of North America...Upper Canada, US. Quebec, and all first peoples in those regions in existance through to 1812.) But I really do need something that would express some elements of their style ect,  (not in a cheesy way, (I ain't talking snowcone type) and yes, trying desperately not to be artificial, I can go very very subtle) and maybe a handwritten face isin't the greatest idea...hmm <br> <br>I got close proximity and comparison going on in the content between First Peoples and the French and have to consider that its all written in the 1st person. <br> <br>The typographical style and faces of this whole project follows through chronologically from the section I'm working on (beginning) all the way to present day (which I'm not really working on) This idea was already established long ago and I'm finding that I got hit with the hardest section...mine should follow the rest of the place considering its the first section the public will travel, grr <br> <br>doing the italic/roman thing per culture is interesting I'd love to attempt something experimental but even if I could get away with it and break the typo/history theme of text,  there are still many levels of text heiarchy of which will need proper formatting or the curators and editors would have my head. If editors decide to use italic for italic reasons and then Euro is italic too, things might get confusing. <br> <br>So, YES...if there were a font that was created by someone of native background at least from the 1800s or a modern face that showed influence from the archives that followed latin characters I'd be all over it...but my search bore no results...would be super happy if you or someone could suggest one? and yes, I need a soft copy. <br> <br>Update: I think I might have a replacement through Nick Shinn that maybe more appropriate...we'll see. Extra super nice of him to suggest considering its not released..so I won't talk about it more until he does.  <br> <br>Still to hear any other comment on this would be great. Its a typographical nightmare right now. <br> <br> <br></p>"
