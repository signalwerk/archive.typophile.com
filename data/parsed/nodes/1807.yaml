    html: <p>all the display faces for my part, be it english, french or to native context are distressed or will look antiqued. <br> <br>See, if we dumb this down - I wonder if the general public would understand and see the difference in italic use for native content. When  things like native-esque styled Olympic icons, and the Aboriginal Television network logo are going, the public gets it, and nobody's said they were condescending.   <br> <br>See, I was thinking the other way around. My opinion was that if the rest of the place has matching period faces and mine dosen't that that would be condescending to the point where some might suggest there was little to no understanding or consideration of their styles. By using a European face we are showing that their words are only heard through our voice, and that's especially bad when its written in the 1st person. <br> <br>This is why I thought of using a handwritten face, because it would show a difference in lifestyles at least - one that had machines, has type, letterpress ect....and one that used their hands. But in a hand written face....it would have to be free of any obivous Euro flourishes, and cursive forms <br> <br>I'll consult the team and ask what they think about the italic/roman thing. </p>
