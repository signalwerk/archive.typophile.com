    html: <p>The problem with trying to find an authentic "Native style" is that there is none. Even if public opinion isn't a concern, any attempt to find one is likely to be contrived. It's not a matter of political correctness. Even if someone is overly sensitive to what Natives will think, it'll still end up "fake" if they try too hard to find something Native. <br> <br>So, the real problem for this museum exhibit is finding two clearly contrasting faces which go well together and fit the time period covered. The Native aspect is a bit of a red herring. <br> <br>I was overreacting a bit when I suggested staying away from handwritten forms. It's just that I've seen people choose primitive looking styles when trying to "be native". In general, the writing samples I've seen from literate Natives are in the handwriting style of their era. Cursives are not unauthentic. I have seen child-like writing from barely literate Natives, but it is no different than what you would see from poorly educated Euro-Americans from the same era.</p>
