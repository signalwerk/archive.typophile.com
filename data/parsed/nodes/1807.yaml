    html: "<p>well of course the Euros would have some poor writting skills too. I was talking about the big picture and representing the \"communication\" logistics of an entire culture.  <br> <br>Basic facts: Euros having the printing press in full action versus the first peoples who communicate with hand written (carved what-have-you)  As well, considering we're talking \"First Peoples\" and the very first interactions between Euros and natives - I don't think that cursive hand writting is what happened next...basic letterforms, sticks and circles perhaps.  <br> <br>Either way I sometimes think its strange that we've become so politically correct that no one thinks it would be proper to use those faces that we may refer to as child-like or whimsical letterforms for the first peoples when that's excatly what they probably looked like wihen the first colonized groups tried to learn how to write latin characters.  <br> <br>And if we want to show a written piece that's more evolved than that, we call it cheesy and perhaps offensive to show any latin form that tries to give back any teeny bit of credence. <br> <br>I can see where if it were about preserving a culture how it would be offensive, but this is about the colonization of north america - The first nations getting their rights and lands back happens in *this* century not 14-1500s.   <br> <br>Is being politically correct really just trying to hide facts of what was done in order to promote happy origins all over? Is it about  saving confusion among the idiots who can't see what the problems were.  <br> <br>I would never think that examples of Native writting in latin forms had any basis to exist per say, but it was part of an evolution...You can't ignore that it did happen. Some how, some way - the first peoples did learn to write in english and french language using latin forms. There were some steps before perfecting the latin forms that I would suspect had lingering elements of various native structures - but I guess its offensive to represent those steps and see any kind of merge? <br> <br>a modern (latin) face with native elements (considering evolution worked the other way around): wouldn't the resulting kitch be the highest form of flattery, and show a very respectful appreciation ,...without all the PC crap, if you look at it this way the recipients could be humbled by such attempt. Perhaps we all hate the idea simply because we see it as an assumption of style, when we are the style masters.  <br> <br>anyway - that's my tangent of the day. <br></p>"
