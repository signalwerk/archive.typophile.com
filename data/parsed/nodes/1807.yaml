  html: <p>Racking my brain over typefaces for an exhibit...so its gotta be display faces here. <br> <br>I need a script/cursive/handwritting-esque face that would suggest the First Peoples of North America...because the content refers to them "speaking"  or a letter written by them.  I'd hate to have their words set in anything European. I'd love to be true blue and use the real language glyphs but for some reason the general public has to read it or something..haha. <br> <br>So far I'm using Kwikfont just because I can't find anything else, but I really have to change it. - something with super basic letterforming I think. help. <br> <br>And then to be displayed right along with that another face that is representative of the French and English invasion at that time. I found that Regula Antiqua does hold proper historical elements for them, so I'm gonna stick with it. - I think. <br> <br>However, I would really appreciate any suggestion or comment over this. Picking out these faces is getting mega stressful as its for a big new museum. I can hear the critisisms already.</p>
  html_clean: <p>Racking my brain over typefaces for an exhibit...so its gotta be display faces here. <br> <br>I need a script/cursive/handwritting-esque face that would suggest the First Peoples of North America...because the content refers to them "speaking"  or a letter written by them.  I'd hate to have their words set in anything European. I'd love to be true blue and use the real language glyphs but for some reason the general public has to read it or something..haha. <br> <br>So far I'm using Kwikfont just because I can't find anything else, but I really have to change it. - something with super basic letterforming I think. help. <br> <br>And then to be displayed right along with that another face that is representative of the French and English invasion at that time. I found that Regula Antiqua does hold proper historical elements for them, so I'm gonna stick with it. - I think. <br> <br>However, I would really appreciate any suggestion or comment over this. Picking out these faces is getting mega stressful as its for a big new museum. I can hear the critisisms already.</p>
