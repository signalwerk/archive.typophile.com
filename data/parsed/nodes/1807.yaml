    html: "<p>Tanya, the vast majority of Amerindian peoples north of Mexico had no writing systems at the time of contact, so I suggest you give up trying to find something that conveys 'First Peoples': it would be just one more imposition of artificial, non-Native preconceptions on Native culture. Also, consider that Native peoples do not consider themselves to be a homogenous mass: they belong to different ethnic groups, tribes, civilisations, and to what, in post-contact parlance, they came to identify as different nations. So you should consider which Native people are referred to in the exhibit, and consider with whom they were in contact. Then you might well find that using a contemporary European typeface might be the most appropriate choice: one of the significant achievements of many colonised peoples around the world has been to take the script and language of the colonial power and to redeploy it with their own messages. <br> <br>Here is a thought: in English language typography it is conventional to use italics for words in foreign languages. So you could play on the accepted conventions of the people attending the exhibit, and put the messages of Native peoples in roman type -- i.e. make it the norm -- and the European text in italics.</p>"
