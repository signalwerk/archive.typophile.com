    <p>In most classical sheet music, directions for “volume” (called “dynamics” in music lingo) are indicated with expressions like “mezzoforte,” “sforzando,” and “pianissimo” (abbreviated “mf,” “sfz,” and “pppp,” respectively). These expressions are usually in some sort of bold italic Modern/Transitional Didot/Bodoni face. Here’s a sampling of these expressions (and numerals) in Coda’s “Maestro” font:<br>
    </p><div class="imageWrap"><img src="/web/20081120091431im_/http://www.typophile.com/files/musicexpressions.gif"></div><p></p>
    <p>In my own composition work, I’d like to use a similar font for all spelled-out musical expressions. Do you have any recommendations?</p>
