      <p><a href="https://web.archive.org/web/20081120091431/http://www.myfonts.com/fonts/linotype/adobe-caslon/bold-italic/" target="_blank">Adobe Caslon Bold Italic</a> is probably as close as you will get to the letters, although <em>if</em> an electronic version of L&amp;C Caslon 223 Black Italic were available, it might be closer.</p>
      <p>The numbers, however, are not italic, so you will need a different typeface for them, probably an extrabold or heavy antique serif, although no examples spring to mind.</p>
