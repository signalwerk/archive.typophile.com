      <p>The best solution is to prepare your own kerning. I believe there are plug-in programs that lets you write pairs for InDesign. Here is one:</p>
      <p><a href="http://indesign.pluginsworld.com/plugins/adobe/287/knowbody-aps/knowbody-cool-kerning.html" title="http://indesign.pluginsworld.com/plugins/adobe/287/knowbody-aps/knowbody-cool-kerning.html">http://indesign.pluginsworld.com/plugins/adobe/287/knowbody-aps/knowbody...</a></p>
      <p>It may not be as useful as one would like, see:</p>
      <p><a href="http://www.typophile.com/node/7608" title="http://www.typophile.com/node/7608">http://www.typophile.com/node/7608</a></p>
      <p>The other way is to go into the font itself and modify the kerning. I believe the Monotype/Linotype conglomerate's EULA prohibits that, at least if you're using OpenType. Practically, speaking, how would anyone know if it were done in the font, or done outside it?</p>
