      <p><em>Whats the best solution?</em></p>
      <p>Quark XPress, with custom font kerning tables.</p>
      <p>**</p>
      <p>I have had issues with over-enthusiastic kerning in Gill Sans, but that was 20 years ago, and IIRC more recent versions are better.<br>
      Are you using an old version?</p>
