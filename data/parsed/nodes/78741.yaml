  html: <p>We have one client that primarily uses Gill Sans for their type. The problem with it is that with certain letter combinations, the spacing gets pretty far off. Ideally we would have a custom made font with custom letter pair spacing, but I don't really know how to do that. The biggest issue is with a period followed by letters like V, W and T. So ". V" or ". T" They tend to run very tight, and we have to manually go in and add spacing. It mostly an issue in InDesign, and it doesn't really matter if the character spacing is Optical or Metric. Anyone deal with this? Whats the best solution?</p>
