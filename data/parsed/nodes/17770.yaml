    html: |-
      <p>Have you seen the <a href="http://en.wikipedia.org/wiki/4AD">Wikipedia entry</a> for <strong>4AD</strong>? It says, in part: “It was originally formed as Axis Records, but this was quickly changed to 4AD when it became apparent that the name Axis was already being used by another music company. The 4AD logo is a spoof of the AAD Audio CD process designation.”</p>
      <p>Don’t know whether this is true or not. However, there is a lengthier, very detailed history of the label (cited in the Wikipedia entry) on a site called <a href="http://www.fedge.net/ftww/index.html">Facing the Wrong Way</a>. Go to their Features section and you will find the history of the label.</p>
      <p>You might also try your luck searching in Rick Poynor’s book, <a href="http://www.amazon.com/gp/product/1861540728/qid=1139374971/sr=1-23/ref=sr_1_23/002-3207693-3888066?s=books&amp;v=glance&amp;n=283155">Vaughan Oliver: Visceral Pleasures</a>. </p>
      <p>Another good bet is an older book, <a href="http://www.artbooks.de/v23/trr.html">This Rimy River</a>, which is the catalog for a v23 exhibition.</p>
      <p>Last but not least, and hard to find: <a href="http://www.emigre.com/EMag.php?issue=09">Issue 9 of Emigre magazine</a> had interviews with Vaughan Oliver and Ivo Watts-Russell (4AD’s owner, at least back then)...</p>
    html_clean: |-
