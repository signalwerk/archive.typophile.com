    html: |-
      <p>Regarding the origin of the 4AD label name, as far as I know it was a play on the words “1980 FORWARD” which appeared on an early flyer. As mentioned by Ricardo, the original label was called AXIS, but they had to change it because some other company already had the name. However, during the first year of the record company they had already put out a couple of records under the AXIS name. An AXIS flyer they had produced in order to advertise these releases (which were put out in 1980) had the following play on words printed on it:</p>
      <p>1980 FORWARD<br>
      1980 FWD<br>
      1984 AD<br>
      4AD</p>
      <p>From what I know, Ivo and Peter (the founders of 4AD) were scrambling for a new name for the company and took “4AD” from this flyer. </p>
      <p>In any case, I’m getting a tattoo of the label in a couple of weeks so this is why I brought it all up to begin with!</p>
