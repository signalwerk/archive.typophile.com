    <p>In addition to doing many other things, Vaughan Oliver designed most of the 4AD record covers (for bands like Cocteau Twins, Modern English, This Mortal Coil, etc). I assume that he is also the person who designed the 4AD logo *itself* (which I’m trying to attach here and which in any case can be easily seen at <a href="http://www.4ad.com" title="www.4ad.com">www.4ad.com</a>). However, I do not know for absolute certain that this is true. Does anyone know for sure who designed the 4AD logo? Thanks!</p>
