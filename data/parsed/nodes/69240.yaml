    html: |-
      <p>I'm quite surprised. The didone was my first instinct, but I started to turn against it because I felt it was a predictable choice for fashion and luxury and quite staid for a store that was going to be selling purely online. </p>
      <p>The slab felt right to me. Maybe I've been reading too much Esquire, <a href="http://www.wmagazine.com/w/blogs/editorsblog" target="blank" rel="nofollow">W</a> and pretty much just about everywhere. Slabs feel bold, current, even slightly brash (or had an immediacy which I felt was suitable for the online target audience). </p>
      <p>But I was worried that it might be faddish. And I started having second thoughts when I saw the Burger King logo. It became hard to justify using such a sporty kind of face for the brand.</p>
      <p>I wonder if anyone shares my opinion about<br>
      1) the didones being predictable, safe and staid for luxury fashion? It's far too sameish.<br>
      2) that the slab is more suitable than the didone, because despite being chunky and pedestrian (on its own), the overall brand still comes across sophisticated because of the colours used?</p>
      <p>Aluminium: funny you should say that. In some parts of the brand application, I actually lean towards dropping of the d. But in the nascent stages of the brand development, we will want to use the DL monogram as much as possible. The squirrel looks very good on its own though, scurrying across the bottom of a letterhead. </p>
      <p>J Tillman: Yup, that's the client's pick as well. The first two were the options provided (one radical and one safe). And the third one was the clients request, based on Georgia's proportions!</p>
      <p>Nick Shinn: Yes, this is purely for the sake of discussion. I'm curious to see if there is a big difference between designers (who think about type a lot) and lay people (who judge type on instinct). As it stands now, there does not seem to be much of a difference. Most people prefer the second option and the client likes the third one. Between the second and the third, I prefer the second option because the proportions are more "display" compared to the third one which just looks like enlarged bodytext.</p>
      <p>I do need to work on the alignment, and any tips here would be most appreciated.</p>
