    <p>Here's a logo that we designed for a client who's going to be selling luxury goods online. Since the main thing was "luxury" we wanted to use a mink to create a kind of "monogram" with the D. </p>
    <p>As it turned out, minks aren't very pretty so we kept using a squirrels as reference. When it was done, it looked nothing like a mink anymore, but we had all fallen in love with it, so it's staying.</p>
    <p>What I am really curious about is what you guys think about the choice of typefaces. The client is a big believer of polls and I want to see if there is a difference between his results and mine. Just for fun. </p>
    <p>Please tell me which of the three options you like best. I'm hoping to get as many votes as possible so that there's a halfway decent sample size. Thanks!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/options_4527.jpg"></div><p></p>
