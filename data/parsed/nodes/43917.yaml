    <p>Hello, I’m working on a font family for a class project that captures a moment passing. The forms for the fonts are based on a video of smoke being blown into soap through a straw and how the bubbles rise to the surface. This is my first attempt at typeface design and I was hoping for some feedback or critique</p>
    <p>&gt;&gt;&gt;&gt;Thanks in advance, any feedback would be really appreciated!</p>
    <p>You can view the spec poster here: <a href="http://flickr.com/photos/afarhat/2393880515/sizes/l/" title="http://flickr.com/photos/afarhat/2393880515/sizes/l/">http://flickr.com/photos/afarhat/2393880515/sizes/l/</a><br>
    There are also some other images of the font progress in my photostream.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/43925" class="topic-previous" title="Go to previous forum topic">‹ Learning Chinese Typography</a> <a href="/node/41657" class="topic-next" title="Go to next forum topic">Muralista Font ! I hope you enjoy! ›</a></div>
