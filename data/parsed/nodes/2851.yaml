    html: <p>After buying the new CS package I have to say I was <br>a little surprised by the way each program supports OT. <br> <br>From a type designers standpoint the &lt;salt&gt; feature is <br>very helpful. Alternate letters are actually not that  <br>uncommon so why not put them all into in a single file? <br>Old news of course, but what is the best way to do it <br>without leaving InDesign users out of the picture?</p>
