    <p>After following the Cyrillic Small Caps thread below, I got <br>to wondering about OT support between applications. <br>For instance, Illustrator CS supports Stylistic Alternates  <br>while InDesign CS doesn't. (they can be manually added <br>via the glyph pallete but it tends to be clunky compared <br>to the ease with which Illustrator CS can do it) <br> <br>Any thoughts? <br></p>
