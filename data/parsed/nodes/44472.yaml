    <p>I just posted a <a class="freelinking external" href="http://betatype.com/node/50" rel="nofollow">beta of a new geometric</a> I have been playing with. For now I'm calling it Aperture, but I'm open to suggestions. Also, keep in mind that this is an early beta so it's still pretty rough; I only started the thing three days ago.</p>
