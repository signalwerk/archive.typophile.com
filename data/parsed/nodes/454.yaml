    html: <p>�&gt;don't know what you mean precisely  <br>&gt;with 'file restoration',  <br>&gt;but Quark has an automatic back-up feature  <br> <br>ID automatically saves and rebuilds the last change in your files every time you change the page or do some other stuff, very practical stuff. The Quark feature wasn't too reliable, sometimes the backups were too old or didn't open at all.  <br>But mainly I was talking about Freehand, which has no such feature at all -- argh.  <br> <br>One thing... ID has multiple UNDO. At least QXP 4 doesn't have that - and I think that multiple Undo is very important when you just start experimenting with your page design. You can work more freely when you know that the last 100 things you do are always un-doable. </p>
