    html: <p>I have heard that the pretty big Publicis company in France Switched to Indesign. <br> <br>As John Hudson pointed out ,couple of months ago, Quark guys came a day to Unicode conference to say they will never support this silly Unicode stuff. How stupid how they are! I really don't know how they will manage xml in the future without Unicode. <br> <br>At my own little user experience, I have used xml import for dictionnary layout in Indesign, it worked correctly (not perfect, but more because the xml wasn't set up correctly and because I lack of experience), mainly a set up of Style sheet, et voil�. <br> <br>Anyway, as past Adobe Indesign prefered designer two years ago, I'm indeed strongly in favour of Indesign. At everyday level, for fonts, its wonderful tool to test finally complete character sets on booth Mac or Windows with exactly the same file without any problem. <br> <br>Indesign 1, 1.5, 2 work here on the 9, then on X without problems at all. Just too slow on 9, with the 2 when you launch a print out, no problems on X. <br> <br>I have done complex layout for my catalog No 3 in 2001, Ambroise specimen same year, Sabon next specimen last year (as "assistant" to Muriel Paris), and some others job with great pleasure. <br> <br>And, with Indesign, what is great is that you can open roughly all various version of Xpress files when you can't with Xpress itself. <br> <br>What a pain, when I need to test a font on my old Xpress 3.32 on my old grey G3! <br> <br>Its clear also, that when you started to use an OT font and all the features (SC, OsF and so on), its quite difficult to comeback to good old PS fonts. <br> <br>The only critic I have is that the French localization for all typographic features vocabulary is more than a big "MERDE." <br> <br></p>
