    html: <p>The downside of the file restauration management of ID (which, at least partially was already one of the nicer features of Pagemaker) is that whenever I work in Quark or Freehand I forget that THEY DO NOT HAVE something along those lines. So you experiment more, save less often inbetween, and when it crashes, it's gone for good. No prob with ID, but on Freehand you have no chance of retrieving your designs. FH, even in the MX version, sucks compared to Indesign.  <br>Photoshop could use somthing like this as well, especially as they DO save intermediary files on your harddisk, so restoring them after a crash should be rrrrrelatively simple to program. </p>
