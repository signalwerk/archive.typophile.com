    html: <p>I finally downloaded a trial copy of inDesign a couple of months back and I've never opened quark since. Aside from being vastly more intuitive than quark, the type setting and style sheet features are top notch. Also, no more bitmapped fonts. Precise letterspacing and kerning were impossible on screen in Quark because of the terrible display of most T1 fonts. ID does a much better job. Finally, the collect for output features of ID are a thousand times better than Quark, though perhaps a topic of disagreement among type designers. ID actually collects your fonts upon your request. (You do get a dialog box warning you that you may be in violation of copyright by doing so) And if you don't want to send your fonts, you can convert them to outlines. Another ID only feature. <br> <br>Needless to say, I'm sold. I hate to see the market dominated by a goliath such as adobe, but as long as quark keeps developing such an inferior product, adobe it shall be.</p>
