    html: "<p>&gt;How can I be sure InD can do  <br>&gt;No one uses InDesign. <br>I always wonder about designers who are so inflexible that they don't wanna switch to a new, better tool. �I know all the keyboard-shortcuts by heart.� Yeah great -- I always wonder just how innovative these folks are in design with that kinda mindset. ID gets the job done better and faster... everything else is just annoying habits. And while I do not think that some piece of software makes you a better or worse designer, I always wonder that sticking to and by standards is exactly NOT what being a designer is all about. Working with the standard machine -- a mac -- and the standard software -- Quark -- not because its best but because its the standard, well... that doesn't feel good to me. If tomorrow a little firm publishes a good alternative to Photoshop, I'm SO there. I even use Photobrush, a 49-bucks-tool for some stuff the Shop cannot do. I somehow feel weird when I stick stick to the road most traveled. :-).  <br> <br> <br>&gt;everything that Quark can? <br> <br>It can :-D.  <br> <br>I've been working with ID since 1.0 (which was gruesome, okay). I've done everythin from straight literature books, posters, CD-Booklets, a 300-pages art expo catalogue with massive bells and whistles, the soundscapes brochure with has various special inks, partial varnishing, fold out-pages in different directions and was a HELL of a job that would 've driven me crazy in Quark. I've done a whole f***ing book of 140 pages with Photos in EIGHT hours overnight. I've done a very photoshop-layer-heavy job that profited from the direct integration of photoshop, I've done leporellos and business cards and stationery and even screen design templates... and.. well, you get it... anything, you can imagine.  <br> <br>You can do everything in Indesign.  <br> <br> <br> <br>&gt;&gt;No one will output InDesign files. <br>Two words: PDF. (Well, one actually. Not even a word, okay...) <br> <br>And Adobe being a monolith -- yeah, I see that problem. But a) they seem to still be flexible even when they are a monpol. Photoshop is an example of that, imo. And b) Print is only a splinter of what the market will be with interactive screen and online tools being there as well. I'm more concerned with what Macromedia does (or rather, does not) do with Flash because they HAVE the monopol in that area. </p>"
