g a monolith -- yeah, I see that problem. But a) they seem to still be flexible even when they are a monpol. Photoshop is an example of that, imo. And b) Print is only a splinter of what the market will be with interactive screen and online tools being there as well. I'm more concerned with what Macromedia does (or rather, does not) do with Flash because they HAVE the monopol in that area. </p>"
