    html: <p>I will cast a blind eye to any Quark development in the future. Quark let me down over 5 or 6 years ago and I've been forced to use them because of their stranglehold on the industry, but Adobe InDesign has given me a taste of freedom, and have given page layout the overhaul that Quark has needed since the late 90's. <br> <br>I'm still learning the finer points of InDesign, but nothing will distract me from it. Adobe has proven its commitment to the design community over and over for years. Plus, Adobe most of the other application I use in my print work. Why switch to another system, another GUI, another product, to hold it all together?</p>
