  html: <p>I haven't even upgraded to QXP5... I work with InDesign Full-Time now, whenever a client forces me to use QXP, my price goes up because it just takes THAT much longer to get things done right. ID has very few flaws left while Quark more and more feels caught between the weight of old age  and the massive lack of innovative ideas. Integration, reliability, creativity, speed... ID is my first choice in Layut and even in smaller stuff I once did in Freehand. What Photoshop has become in terms of Imageediting, ID has become in terms of designing pages...</p>
