    html: <p>Keith, I use InDesign and Acrobat Distiller -- it's a perfect combination Exported PDF works okay (better than any otheer direct-to-PDF-export, the EPS-Export is also nice), but Distiller still is the safest and most flexible way to do it. Since I work with InDesign and on Win-based workstations, I have preferred PDF for well over five years now, when most printersor film-outputters didn't even accept them. Thanks to Computer-to-plate that has changed. PDF is the best way to get your data to the outputter and InDesign+Distiller is a Killer combination. </p>
