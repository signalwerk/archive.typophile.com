    html: <p>Yeah, that is one big minus. Although I mostly found workarounds with mixing Cyan and Magenta or something and using those channels for the seperations, it would be nice to have fully mixable Pantone spot colours with accurate screen preview.  <br> <br>I also wish that they would include some option to change the size of indivudal spaces, at least the pagewidth -- that would be good for fold-up-pages and Leporellos. ALso, it would be nice to have an option that makes the table borders and cells visible even if you do not have an outline (and the handling of adding outlines to the cells could be a bit easier, imo).  <br> <br>The shift key thing I'm used to from FH, so that never bothered me at all. I also took the time to synchronize my keyboard shortcuts in FH/Shop/ID, which makes life THAT much easier afterwards.  <br>:-D. </p>
