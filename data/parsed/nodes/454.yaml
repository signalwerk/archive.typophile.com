    html: <p>Man, I hope more people switch to ID. Although OpenType isn't the most democratic format right now, the upsides of the format are just dandy with me, text-setting hasn't been as much fun in years.  <br>And as Adobe and URW and Lino and some other companies are making the switch to OTF and others, like House and Emigre sloooowly trying their hands at the extended possibilities of that format as well, I think Quark will either include OTF or involuntary give Adobe a marketing bonus.  <br> <br>Quark only survives because people are so used to it. I have worked with both systems and as of ID 1.5 Adobe has far surpassed Quark in my opinion.  <br> <br></p>
