    html: <p>Yes, I had also tried (at MyFonts) with Palatino too. But had thought especially the "s" and the "t" to be not so close... But, taking this set which Mark Simonson posted, it does match! (Except for the "H" width, indeed, really curious...) And, as a matter of fact, I think this post of Mark's even just solved another <i>mystery</i> for me. As there was an other font which I was wondering about, because of its <i>funny</i> "e" and, there it is, right that one in that version of Palatino Regular! So here goes a double thank you to you, Mark Simonson, thank you indeed! :-) Thank you both for all help. :-) </p>
