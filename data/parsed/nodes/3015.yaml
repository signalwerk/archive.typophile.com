  html: <p>Still here's an other font which keeps puzzling me. (I only hope I'm not abusing with all the many fonts I ask about? It's kinda hard to help from feeling that I am...) <br> <br><img src="http://www.typophile.com/forums/messages/83/25826.gif" alt=""> <br> <br>This one had been identified as being <a href="http://www.myfonts.com/fonts/itc/galliard/" target="_blank"> Galliard</a>. Yet, and even considering the uppercase letters to be Galliard Regular, and the lowercase ones Galliard Italic, still there are quite some evident differences, the "k" to point the most obvious... <br> <br>Then again, and myself, hum, the closer I got so far (if any close at all) was eventually <a href="http://www.myfonts.com/fonts/letraset/aquinas/" target="_blank"> Aquinas</a>, yet not too close either (particularly the "M" and the "F", and also the "t", are definite non-matches, and as well the serif is rather different and the outline of the letters doesn't look as smooth... also, and accordingly to the info on MyFonts about it, this font is said to have been designed in 1989, whereas the sample I posted is from 1984)... :/   <br> <br>So, if anyone can give a hint on this one, again I'd be most grateful, thank you.</p>
  html_clean: <p>Still here's an other font which keeps puzzling me. (I only hope I'm not abusing with all the many fonts I ask about? It's kinda hard to help from feeling that I am...) <br> <br><img src="http://www.typophile.com/forums/messages/83/25826.gif" alt=""> <br> <br>This one had been identified as being <a href="http://www.myfonts.com/fonts/itc/galliard/" target="_blank" class="link-external"> Galliard</a>. Yet, and even considering the uppercase letters to be Galliard Regular, and the lowercase ones Galliard Italic, still there are quite some evident differences, the "k" to point the most obvious... <br> <br>Then again, and myself, hum, the closer I got so far (if any close at all) was eventually <a href="http://www.myfonts.com/fonts/letraset/aquinas/" target="_blank" class="link-external"> Aquinas</a>, yet not too close either (particularly the "M" and the "F", and also the "t", are definite non-matches, and as well the serif is rather different and the outline of the letters doesn't look as smooth... also, and accordingly to the info on MyFonts about it, this font is said to have been designed in 1989, whereas the sample I posted is from 1984)... :/   <br> <br>So, if anyone can give a hint on this one, again I'd be most grateful, thank you.</p>
