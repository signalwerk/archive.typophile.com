    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Ri-XingLetterCastingFirm_p3_6072.jpg"></div><p></p>
    <p>I recently became aware of the <a class="freelinking external" href="http://rixingtypography.blogspot.com/" rel="nofollow">Ri-Xing Letter Casting Firm</a> (日星鑄字行), what must be one of the last remaining traditional Chinese typefoundries in the world.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Ri-XingLetterCastingFirm_p1_3905.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Ri-XingLetterCastingFirm_p8_4077.jpg"></div><p></p>
    <p>You can read a bit about them in English at <a class="freelinking external" href="http://wandering-taiwan.blogspot.com/2009/11/ri-xing-type-casting.html" rel="nofollow">this blog</a>, from where the above photos were lifted.</p>
    <p>There is an effort underway to preserve and digitize many of the designs. The foundry is located in Taipei, and welcomes visitors and volunteers.</p>
    <p>Their blog (in Chinese) is here: <a href="http://rixingtypography.blogspot.com/" title="http://rixingtypography.blogspot.com/">http://rixingtypography.blogspot.com/</a></p>
