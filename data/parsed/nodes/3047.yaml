    html: <p>Lets assume Shaun's hands are tied and he must use this, somewhat as is. Shaun try a script or an italic for the 10th anniversary and place in the elongated O. Another thought is use the Roman Numeral X for 10 and Something in all caps for Anniversary in a Chunky Serif to contrast with the logo, ala Super Bowl look. Along the same line look at the X as in OSX from Apple its very stylizied and might be a direction for you to look into.</p>
