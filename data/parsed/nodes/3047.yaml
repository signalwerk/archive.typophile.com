    html: <p>Stretched type... a typographic sin.  <br>Kerning needs some work.  "Y" should be optically centered between "O" and "P. Consider the space (between "O" and "P)  <br>in volume, not distance when centering.  "Group" should be centered under "leadership". Best advice....Hit delete and start over....</p>
