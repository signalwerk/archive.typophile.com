      <p>Hrant:</p>
      <p>Ideological? How so?</p>
      <p>James:</p>
      <p>Well I admit I do like the face for sentimental reasons. But perhaps that's because it worked so well to begin with. Perhaps I haven't read enough bad Palatino. The Linotron version used by Puffin Books in the mid-80s was quite charming and very sturdy. And in recent years digital Palatino has become even more useful (for those who want it) with the addition of some nice extras.</p>
      <p>We know that Zapf didn't intend for Palatino to be used as a text face, but it seems to work. And although Aldus might be more suited to text at smaller sizes (below 10 points), it certainly lacks the charm and elegance of Palatino. </p>
      <p>I guess people have simply seen too much of it over the years.</p>
