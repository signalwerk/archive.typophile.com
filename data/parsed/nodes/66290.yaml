    <p>I read a lot of Palatino (mostly Linotron) as a kid. Maybe it's just my over-familiarity with the face that's made me so comfortable with it, but what is really wrong with it? I don't mean Palatino Nova, but good old digital Palatino from Linotype. Last year I purchased a license for one of their Palatino family packs and I've been experimenting with it. </p>
    <p>It seems to perform quite well at 11/13 points with with 10-12 words per line, printed at 1200dpi on somewhat thicker, creamy paper. The colour is nice and dark and the spacing seems fine. The italics in particular look great. It might not be designed especially for text but it seems to work. It's an amazingly readable face. At the very least, it doesn't seem to suffer from the problems characteristic of metal types translated to digital form. </p>
    <p>Am I missing something?</p>
