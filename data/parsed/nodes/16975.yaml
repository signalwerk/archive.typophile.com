    html: |-
      <p>I agree. You have a symbol and logotype(wordmark). Below the logo is the signature.</p>
      <p>AIGA has a PDF of their identity guidelines here: <a href="http://www.aiga.org/resources/content/1/0/5/1/documents/ID_Guidelines.pdf">http://www.aiga.org/resources/content/1/0/5/1/documents/ID_Guidelines.pdf</a></p>
      <p>Look at page 6 where it explains how to use the various signatures.</p>
      <p>Great logo by the way. I love bi- and multilingual identities.</p>
