    <p>A logo for an embroidered patch that was sent to me. Luckily it’s somewhat hi-res. But that doesn’t excuse the insane amounts of swirls. </p>
    <p>I’m sure it’s a font (not necessarily all the swirliness). But if anyone can give me some insight on the base font it would be much appreciated. I’ve tried other outlets like whatthefont and identifont, but to no avail.</p>
    <p>*cracks knuckles*</p>
    <p>I guess i should start tracing in illustrator.</p>
