  html: |-
    <p>Hello Everyone,</p>
    <p>I'm new to Typophile and would really appreciate any feedback or recommendations you have on finding a similar font to the attached script.  I'm a stationery designer and the script face on these wedding invitations looks to be hand-calligraphed (that said, if you recognise it, please step forward!) but if someone knows of a similar font I would be truly grateful.</p>
    <p>I regularly scour both Veer and Sudtipos and have a pretty big collection of their calligraphy fonts from Charles Bluemlein and Ale Paul, but I'm yet to see anything quite right.  Does anyone know of a script that is both curly and whimsical, but still a little retro casual at the same time?</p>
    <p>Thoughts, anyone?</p><div class="imageWrap"><img src="http://typophile.com/files/Script Font_6372.jpg"></div><p></p>
