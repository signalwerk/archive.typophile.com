    html: |-
      <p>What I like about this is that through this work it has become rather easy to see how all these accents work in ‘real life’. On the other hand, I also found some things that are somewhat questionable (in my opinion, being Dutch).</p>
      <p><strong>Dutch language</strong><br>
      <em>jè</em><br>
      I am afraid that I’ve never seen that word. Google tells me that it may occur in ‘jè t’aime’, but that is a typo of ‘je t’aime’. Which may occur in Dutch texts, but ‘je t’aime’ is not Dutch, it is French for saying ‘I love you’.</p>
      <p><em>chambéryzomer</em><br>
      That seems to be a typo. Could be Chambery zomer (‘Chambéry summer’, could be an offering of a travelling agent, alternatively to ‘Chambéry spring’. But that does not turn Chambéry into a Dutch word. Chambéry is a place in France.</p>
      <p><em>eénvandaag</em><br>
      Similar to chambéryzomer. Could be ‘één vandaag’ (one for today). But that does not make it a sample for the occurrence of eén in Dutch. I have seen éen in Dutch but never eén.</p>
      <p><em>matthäus</em><br>
      As far as I know, Matthäus is not an official Dutch word, it is the German way of writing Mattheus (the evangelist). Shure one can find ‘Matthäus’ in a Dutch text, but that alone does not make it a Dutch word. </p>
      <p><em>köppen</em><br>
      My Dutch dictionary does not list that word and I would not know what ‘köppen’ might mean. Köppen might occur in Dutch text as the name of the German author who wrote several books on color models. But in such a case Köppen is written with a capital K.</p>
      <p><em>luïciüs</em><br>
      Google tells me that this is probably derived from the family name ‘van Stipriaan Luïciüs’. I only found 9 entries with that name, they refer to two people, a father and his son who lived around 1900. How Dutch is that? Or more serious: Is that really relevant to the Dutch language?</p>
      <p><em>sébastien</em><br>
      Not a Dutch word, but a French name: ‘Sébastien’. The Dutch would write ‘Sebastiaan’.</p>
      <p>Anyway, I could not find mistakes like this in the German section, so maybe the quality of the Dutch section is just an exception. Still I hope that Ondrej will find some time to check and correct it.</p>
