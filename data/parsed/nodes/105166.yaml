    html: |-
      <div class="comment-spam-body"><blockquote><p>The capitalized version of één ('only one', emphatically) is Eén</p></blockquote>
      <p>This is a bit of a different matter but I need some verification. What do you think of Één? In lowercase it's supposed to be één and yet with a capital letter I mostly see Eén. I always assumed that's a mistake considering it's a bit less obvious for some how to add an accent to the capital letter, and as far as I can reason now this and 'überhaubt' are the only cases in the Dutch language where a capital letter might get a diacritic — unless the whole word is capitalized of course.</p>
      <p>I think Eén looks better, but it's logically inconsistent.</p>
      </div>
