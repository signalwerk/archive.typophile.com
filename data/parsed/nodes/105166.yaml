      <p>A-J. wrote</p>
      <blockquote><p>I have seen éen in Dutch but never eén.</p></blockquote>
      <p>The capitalized version of <em>één</em> ('only one', emphatically) is <em>Eén</em> -- note the missing acute on the capital. Maybe Ondrej examined case-folded data, as evidenced by your other examples.</p>
      <p>Nevertheless, very good work and a welcome reference!</p>
