    html: <p>Hi, David, nice to hear from you again. <br> <br>I've been comparing my fonts in some older font utilities and I notice that a character in my font appears to sit noticeably higher in the bounding box than the same character from Arial TTF or Arial Rounded BT Type 1. In applications, all sit properly on the baseline. <br> <br>This suggests to me it has something to do with the baseline or math related to the baseline or position of the glyph in the box. I've looked at the metrics of dozens of fonts in Fontographer and FontLab, but I see nothing unusual when compared with mine. <br> <br>Such a mystery to me. I hope someone can help. <br> <br>Charax</p>
    html_clean: <p>Hi, David, nice to hear from you again. <br> <br>I've been comparing my fonts in some older font utilities and I notice that a character in my font appears to sit noticeably higher in the bounding box than the same character from Arial TTF or Arial Rounded BT Type 1. In applications, all sit properly on the baseline. <br> <br>This suggests to me it has something to do with the baseline or math related to the baseline or position of the glyph in the box. I've looked at the metrics of dozens of fonts in Fontographer and FontLab, but I see nothing unusual when compared with mine. <br> <br>Such a mystery to me. I hope someone can help. <br> <br>Charax</p>
