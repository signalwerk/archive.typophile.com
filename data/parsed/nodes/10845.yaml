  html: "<p>I've tried posting this question to the Fontographer and FontLab mail lists with no answers. I'm hoping someone here can help! <br> <br>In testing my font in HTML, the overline does not appear as expected. In the image at <a href=\"http://parthia.com/fonts/images/overline_error.gif\" target=\"_blank\">http://parthia.com/fonts/images/overline_error.gif</a> you can see the problem: each character of the properly behaved overlined Arial font is followed by the \"collapsed\" overlined font character of my sans serif font, Numismatica. The same is illustrated for TNR. <br> <br>What design defect causes the collapsed overline, and where should I begin in order to correct the problem? I want my font to mesh seamlessly with Times New Roman, including overlines and underlines in the same line of HTML text. <br> <br>I've been searching the specs and studying the tables, but haven't figured this out. Please help if you can! <br> <br>Thanks, <br> <br>Charax</p>"
  html_clean: "<p>I've tried posting this question to the Fontographer and FontLab mail lists with no answers. I'm hoping someone here can help! <br> <br>In testing my font in HTML, the overline does not appear as expected. In the image at <a href=\"http://parthia.com/fonts/images/overline_error.gif\" target=\"_blank\" class=\"link-external\">http://parthia.com/fonts/images/overline_error.gif</a> you can see the problem: each character of the properly behaved overlined Arial font is followed by the \"collapsed\" overlined font character of my sans serif font, Numismatica. The same is illustrated for TNR. <br> <br>What design defect causes the collapsed overline, and where should I begin in order to correct the problem? I want my font to mesh seamlessly with Times New Roman, including overlines and underlines in the same line of HTML text. <br> <br>I've been searching the specs and studying the tables, but haven't figured this out. Please help if you can! <br> <br>Thanks, <br> <br>Charax</p>"
