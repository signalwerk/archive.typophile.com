    html: <p>I don't know the answer to your question, but I will suggest a couple of things. <br> <br>Underline and overline are different.  The TT file contains information about the underline position and thickness, and FontLab has a dialog box where you can set this information.  There is no comparable overline feature. <br> <br>So the web browser must be doing something like analyzing the highest character in the font and putting a line at some distance above that.  What I'd do is compare your font and Times and Helvetica.  Open up each and make note of a) the cap height b) the ascender height) and c) the top of accents over capital letters.  Fonts also contain additional vertical metrics information, which you can see in FontLab.  I'm not an expert in this but even by comparing the three fonts you may be able to get an idea of what is happening.  You might also try an HTML experiment using capitals with acccents--do they get overridden by the overline?  <br> <br>I hope that somebody who really knows will give an answer, but clearly the browser must be reading some piece of information from the font.  The FontLab manual has some information about the various vertical metrics which might be helpful. <br> <br>David</p>
