    html: <p>David was right on target. <br>  <br>After troubleshooting the font and comparing my font with structure of well-behaved fonts, I discovered that not having a high-positioned character like Yacute caused the problem. It is the top of the Yacute's accent -- well above the ascent line -- that evidently sets the position for the HTML overline. By drawing a 1-pixel square with its top at the same height as the capital acute accent in TNR and Arial, the problem disappeared. <br>  <br>Many thanks for the help. <br>  <br>Charax </p>
