    <p>Every year I sit down with the CA Illustration Annual to take a look at all of the amazing talent and every year I wish I'd paid more attention in my drawing classes. Page by page I see people telling stories or explaining articles in ways that I can't. I get jealous. This year was no different. There really are some--scratch that--a huge amount of amazingly talented illustrators out there. </p>
    <p>This year after about 45 minutes of "oooh" and "aaaah" and "woooowww" I arrived at the end feeling, once again, stupid for not paying attention. Flipping a few more pages I came across and ad for Veer with a fellow Typophile, Armin Vit, proclaiming in 60 pt Avenir bold that he couldn't draw. I was lifted and humored all at the same time. :^) Thanks, Armin! You rock!</p>
    <p><em>By the way, Edel has several illustrations in there that prove his skill is more than, what some of you thought, trite cliche. Nice work Edel.</em></p>
