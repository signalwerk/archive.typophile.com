      <p>Probably the same feeling I get when I look at a type book.  </p>
      <p>Illustrator's always discuss if designers are still into illustration, so it's nice to hear this.  There seems to be a lot of use of stock photo or straight type in design.  Maybe it has to do with schools and how they separate illustrators from designers sometimes.  I've always thought the two should work on more projects together in school, it would be good for everyone and sets a good foundation.</p>
      <p>David, have fun with the class, use what you know already with type, there can be a lot of overlap.</p>
      <p>Thanks Tiffany for the public display of affection :-)  </p>
      <p>ER</p>
