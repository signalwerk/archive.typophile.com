    <p>This is an typeface I tried to work on pauses during drawing of an another font that's soon gonna be traced. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sensor_preview_4584.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/sensor_preview2_5413.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/sensor_preview3_4546.jpg"></div><p></p>
    <p>So far I did only all upper and lowercase + "."<br>
    Still without proper metrics done.</p>
    <p>I'd call this rather only preview to decide whether is it worth to continue or not.</p>
    <p>Any comments on this?</p>
    <p>- Dusan</p>
    <p>P.S. - Don't pay attention on proportions if it's possible, it's still far from good.</p>
    <p>P.S. 2 - I still have a couple of doubts about some shapes... for example with /S/ and /s/, should they have "eaten" part of to be without it... and so on.</p>
