    <p>Hello, </p>
    <p>I'm working on a legacy mark to commemorate the 25th anniversary for a St. Louis arts organization. Out of several options, here's the direction my client picked. It's loosely based on Bodoni and Benton Modern.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/25th_logo_4210.png"></div><p></p>
    <p>If anyone could offer some input on how to improve the curves, I'd really appreciate it. Some areas don't feel quite right yet, particularly in the way the swashes above and below cradle the shapes of the numbers.</p>
    <p>Feedback much appreciated.</p>
