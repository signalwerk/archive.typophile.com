      <p>What kind of a lounge is it? That's the first question. </p>
      <p>The logo itself looks awkward. The line &amp; star underneath "room" does not connect in any way to the rest of the logo. I would get rid of the line/star, and only concentrate on the words "stardust room", and perhaps incorporate the stars as you did between the "a" &amp; "r" and the "o" &amp; "m".</p>
      <p>"Stardust" and "Room" look like they're written in 2 different typefaces. Did you hand-draw this word mark? I think the "m" in room needs to have a point on some corner like in the "u". And the relationships between the letters in "room" needs to be fixed. They need to relate or connect somehow. Definitely revise the o's. They should not be perfect geometric circles. They should be rectangular in some way like the rest of the letters. Narrower or with a point on an edge or two. Experiment and see what fits best with both words.</p>
