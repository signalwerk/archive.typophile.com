      <p>Try o's with a similar shape to the loop on the d.</p>
      <p>I really don't like the light blue squares. I find them distracting. I also think perhaps the tail of the biggest star should end in a similar curve to the edges of the stars. The current steps plus those blue squares make the design look too much like coloured-in graph paper.</p>
      <p>The darker blue, orange and sandy tones work really well together.</p>
