      <p>Fair enough. Reminds me of when Andy Crewdson decided to print some shirts featuring a Gill quote. Lines &amp; Splines readers were invited to vote for a quote and of course one about the dog got the most votes. At which point Andy stated that he wasn't going to print that quote. </p>
