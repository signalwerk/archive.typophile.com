    html: |-
      <p>Lyric by a contemporary of Gill's:</p>
      <p><strong>Experiment</strong><br>
      <em>by Cole Porter</em></p>
      <p>Before we leave these portals<br>
      to meet our paramortals,<br>
      there's just one final massage I would give to you.</p>
      <p>We all have learned reliance<br>
      on the sacred teachings of science,<br>
      so I hope through life you never will become,<br>
      in spite of philistines, defiant,<br>
      to do what all good scientists do.</p>
      <p>Experiment.<br>
      Make it your motto day and night.</p>
      <p>Experiment.<br>
      And it will lead you to the light.</p>
      <p>The apple from the top of the tree<br>
      is never too high to achieve.<br>
      So take an example from me.</p>
      <p>Experiment.</p>
      <p>Be curious,<br>
      though interfering friends may frown.</p>
      <p>Get furious,<br>
      at each attempt to hold you down.</p>
      <p>If this advice you'll only employ,<br>
      the future can offer you infinite joy<br>
      and merriment.</p>
      <p>Experiment,<br>
      and you'll see.</p>
