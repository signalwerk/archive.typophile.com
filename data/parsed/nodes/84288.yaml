    <p>Hey everybody,</p>
    <p>The release of my first serious typeface is still too far away to start thinking about marketing, but I just want to get a rough idea of what I can expect.</p>
    <p>1. What are the ranges of sales figures for a well designed commercial font?<br>
    2. If you're a typedesigner, how large is the part of your income from single weights compared to typefamilies?<br>
    3. Do cheap fonts sell better? Around where is the market equilibrium?</p>
    <p>Honestly, I have no idea at all. Just a rough idea is much appreciated. I know that prices and sales can vary hugely, depending on trends, size of Character Set, and the range of weights. So, for the sake of clearness, let's say, a well designed humanist sans serif with 12 styles and a Complete Latin Character Set.</p>
    <p>Thanks in advance,<br>
    Jasper</p>
