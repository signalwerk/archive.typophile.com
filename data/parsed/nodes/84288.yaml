      <p>1. It is completely unquantifiable. Some families are popular and sell a large amount generating a healthy income, whereas others that you'd hope to be popular are not and shift hardly any units.</p>
      <p>2. Don't know.</p>
      <p>3. I wouldn't go down the cheap route if I were you. From what I've seen of your stuff you are producing original non-derivative quality products.</p>
