      <p>Pan-European would include Greek and Cyrillic, rather different than "Complete Latin" (whatever that might mean).</p>
      <p>The range of $$ values of sales is immense. Fonts are kind of like books or movies in this regard. Most do not make enough money to justify the time spent making them. A few give a decent return, and a very few are runaway hits and make a fair bit of money.</p>
      <p>Besides pricing and font quality, how you distribute and promote the fonts is also very important.</p>
      <p>T</p>
