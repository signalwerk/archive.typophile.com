    <p>I suspect the jpg might be a bit clearer to look at: <a href="http://goodeveningeurope.com/fonts/1959title.jpg" title="http://goodeveningeurope.com/fonts/1959title.jpg">http://goodeveningeurope.com/fonts/1959title.jpg</a> </p>
    <p>These examples are from the year 1959, a show in France. I am not sure if that helps.</p>
    <p>Thanks very much in advance for your help. If you need some more samples of this font do let me know.</p>
    <p>Is the font available online? Can I read about it and its designer anywhere?</p>
