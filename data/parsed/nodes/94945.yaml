    html: |-
      <p>Yes, AFAIK when drawing with the pen/drawing tool and simply clicking, the points end up with “in point BCPs” (i.e. BCPs that have the same coordinates as the node). I learned this the hard way. :-\  I’m not sure if there is a way to use the pen tool and not get these so I’ll listen in, too.</p>
      <p>As for remedying it in existing points: If this is the same thing that I had, then alt-click-dragging – which would usually extend a BCP – will instead move the node and reveal the BCP below. You can do that, then delete the BCP, then move the node back to where it was. Alternately, upon right-clicking the node the context menu should have something like “retract BCPs”.</p>
