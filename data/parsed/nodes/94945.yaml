      <p>I have used CorelDraw since version one, so the way it works makes perfect sense to me. Consequently, the way virtually every other drawing program works does NOT make sense to me.</p>
      <p>However, from my experience, I think it is universally true is: if a program is doing something which annoys or puzzles you—simply DON’T DO the thing that annoys you. If you can possibly help it.</p>
      <p>Like with CorelDraw 6, which was a total cl*sterf*ck, which worked pretty well until you hit “SAVE,” at which point, the program crashed and you lost ALL your work. On the bright side, you could EXPORT your work just fine, and re-import, no problem. So, no problem? Well, after you learned the workaround, no; otherwise, yes.</p>
      <p>Boy, SOME beta testers STILL deserve a swift kick for overlooking THIS minor annoyance…</p>
