    html: |-
      <p>No, best practice is to have no dead-BCP (as I call them) points. This is because automatic conversion (like to TT-style quadratic beziers) can get messed up (just like with a missing inflection point).</p>
      <p>If you Alt-Shift-Click on a "half-dead" curve FL will bring the dead BCP to life and adjust the other end accordingly - although the resultant approximation to your original will rarely be close enough - you need to tweak it.</p>
      <p>hhp</p>
