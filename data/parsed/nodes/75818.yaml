    html: |-
      <p><cite>How do you tell ID to «loop through» character styles?</cite></p>
      <p>Here is how to do it with four fonts:</p>
      <p>•&nbsp;Set up your repeating characters as if they are words separated by spaced, eg. “AAAA BBBB CCCC”<br>
      •&nbsp;Create four character styles, one for each of the fonts<br>
      •&nbsp;Create a paragraph style and nest in each of the four character styles. One, two, and three operate “through 1 characters”, four “through 1 words”, and then add a final style to “repeat through last 4 styles”.</p>
    html_clean: |-
