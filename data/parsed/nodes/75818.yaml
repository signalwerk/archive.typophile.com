      <p><em> But maybe it's just my difficulty to use automated methods… :)<br>
      ... I would add that his type family (if it’s the one I think) was not drawn through interpolation, but independently weight by weight. </em></p>
      <p>Hello Claudio! Indeed I am extrapolating to six weights the Latin glyphs of the two weights of the Arabic AlQuds family. Your generous and careful craftsman-like revision of my two Latin fonts (added to the revisions by another kind volunteer) is anything but automated. And yes no MM interpolation was used. I will revise the capital Thorns thanks.</p>
      <p>I now understand that Autopsy (which wins the prize for the most gruesome logo for an excellent software, after the original roadkill logo of Irfanview ! :)) and Prepolator are OK for Arabic since they only compare individual glyphs not text strings. Everything considered I think I will just use the method I outlined above (graphic pun intended) and a similar method using layers in Illustrator to compare the glyphs. Thanks to all.</p>
