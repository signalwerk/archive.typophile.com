    html: <p>Comparing all the outlines is going overboard. When you check everything in Prepolator just make sure that the example interpolation works. Then eyeball comparisons on paper by formatting the fonts with a nested paragraph style that loops through character styles and repeats at the beginning of a word. If the masters are drawn correctly there shouldn’t be anything strange going on that you won’t see on paper, and it’s easier to see what’s going on with solid shapes than with a pile of outlines.</p>
