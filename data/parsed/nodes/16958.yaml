    html: |-
      <p>It's pretty easy to spot a type design like this one:</p>
      <p>First -- determine what "classification" the design falls under.<br>
      "Is it serif or sans?"<br>
      It doesn't matter since either way its MONOSPACED.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/mono-space.png"></div><p></p>
      <p>Second -- Myfonts.com is one of several font search sites that you can browse by classification.</p>
      <p>Third -- Determine if there are any particularly unique characters or characteristics about the typeface, then start browsing.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/myfont_mono.png"></div><p></p>
      <p>Total search time: 2 minutes, if even that.<br>
      Give it a shot next time. Eventually it becomes easier to do. :-)</p>
