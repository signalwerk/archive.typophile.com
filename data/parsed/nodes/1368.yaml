    html: <p>Great!, the irregualrity gives the font a human look. It's more like a humanistic interpretation of those very rigid forms. The difference between the light &amp; bold is good; it makes the typeface diverse, and interesting to watch. It gives the typeface a certain personality. <br> <br>I love those capitals;the S &amp; K are beautiful. <br> <br>I think the next step is to transform it to a typeface. Spacing, Kerning etc... <br>&amp; designing al the other elements; all the punctuations etc. <br> <br>the typedesigner 'Peter van Blokland' designed in the early eighties the font 'vijfzeven'. Look at it at "<a href="http://xml.petr.com/buro/products/vijfzeven//nl" target="_top">http://xml.petr.com/buro/products/vijfzeven//nl</a>" <br>or try finding at "http://www.petr.com" There are a lot of similarities between his and your design. Though his font is more cleaned up (as what bj suggested), I think you should try to keep it more rough. <br> <br>Making it clean is easy, keeping it rough, but also usefull is the tricky part. <br> <br>good luck <br> <br>&amp; try to do what you think is best <br> <br>(it's your design, in the end)</p>
    html_clean: <p>Great!, the irregualrity gives the font a human look. It's more like a humanistic interpretation of those very rigid forms. The difference between the light &amp; bold is good; it makes the typeface diverse, and interesting to watch. It gives the typeface a certain personality. <br> <br>I love those capitals;the S &amp; K are beautiful. <br> <br>I think the next step is to transform it to a typeface. Spacing, Kerning etc... <br>&amp; designing al the other elements; all the punctuations etc. <br> <br>the typedesigner 'Peter van Blokland' designed in the early eighties the font 'vijfzeven'. Look at it at "<a href="http://xml.petr.com/buro/products/vijfzeven//nl" target="_top" class="link-external">http://xml.petr.com/buro/products/vijfzeven//nl</a>" <br>or try finding at "http://www.petr.com" There are a lot of similarities between his and your design. Though his font is more cleaned up (as what bj suggested), I think you should try to keep it more rough. <br> <br>Making it clean is easy, keeping it rough, but also usefull is the tricky part. <br> <br>good luck <br> <br>&amp; try to do what you think is best <br> <br>(it's your design, in the end)</p>
