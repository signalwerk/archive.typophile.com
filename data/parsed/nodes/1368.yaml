    html: "<p> Nathaniel - favorite forms: the lc 'a' and 'e' <br> <br>least favorite 's' and 'k' <br> <br>this could be a usable specialty face, but in my humble opinion it could be improved. <br> <br>you wanted gentle but honest criticism, so the main thing: <br> <br> I would clean up the face. Spraytrix light looks like a mishmash of diff. circular shapes but none of them look clean. The repeated shape could be a circle, square, star, whatever, but clean and uniform seems like it would work better than misshapen. <br> <br>it's not a bad first attempt so keep on trying new stuff, <br> <br>bj </p>"
