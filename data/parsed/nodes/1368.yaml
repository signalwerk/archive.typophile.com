    html: <p>The irregular dots thats due the the spray paint <br>i used to create the grid. Its based on this  <br><img src="http://www.typophile.com/forums/messages/29/1688.jpg" alt="SprayGrid.jpg"> <br>Here are some new versions of the lc 's' and 'k' <br>The lc 's' in the original looks that way because <br>the others i tried were starting to look like the number five. <br><img src="http://www.typophile.com/forums/messages/29/1689.jpg" alt="Newsk"> <br>The light was the original but it didn't work <br>so well large so i made it heavier. Bold versions <br>are just to add a bit of versitility. I like fonts you  <br>can overlay to get 3D/misregistered styles. <br><img src="http://www.typophile.com/forums/messages/29/1690.jpg" alt="Styles"></p>
