      <p>I've been thinking about the existing and new versions of Greek glyphs. Putting aside the issue of their design merits for a moment, I'm curious whether you (Vangelis) intend the new version to complement the existing one or to replace it.</p>
      <p>I think both styles of Greek have their uses. In fact, I think maybe three different styles of Greek glyphs are necessary for full versatility.</p>
      <p>Let me explain. Who needs the Greek glyphs in a multilingual open source font like DejaVu Serif? I think most users will fall under one of three categories:</p>
      <p>1. Greek speakers.<br>
      2. Scholars who deal with Ancient or Mediaeval Greek.<br>
      3. Those who need the odd Greek glyphs now and then for technical symbols.</p>
      <p>As you implicitly suggested, each category has its own rules of what is acceptable in the design of the Greek glyphs. It is possible to have a single set of Greek glyphs for all those purposes, but perhaps what is needed is a different approach in designing the glyphs for each case.</p>
      <p>Many of the glyphs you designed will be inappropriate for use as symbols in technical contexts. In an English-language mathematics book , it would be useless to have an alpha that can be confused with a single-storey a, or a chi that is identical to x. International readers who have been taught just those canonical Greek letterforms (in most cases just a subset of the whole alphabet) will surely be left confused and clueless.</p>
      <p>And as you mentioned, different styles of Greeks are appropriate for setting something like the Septuagint and the latest Greek newsmagazine.</p>
      <p>So my thinking is that a multiscript font that aims for full versatility should offer up to three different styles of Greek to suit each need, maybe as Opentype stylistic sets.</p>
