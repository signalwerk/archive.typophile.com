      <p>The issue of cultural authenticity is hyper-complex, and it's not surprising to find large differences of opinion even among people who care about nurturing it. In my book simply caring about it is already a big deal. Even people who violate it aren't necessarily bad, as long as they know they're doing it - it's the total oblivion to it, which is sadly very common, that makes me angry. For example in type design when somebody copies formalistic attributes from one script to another for the sake of "consistency" with no regard -or even disdain- for much else, that's Bad.</p>
      <p>&gt; most often such an intention finds the easy expression in<br>
      &gt; the avoidance of any similarity with the product of another<br>
      &gt; ‘threatening’ culture.</p>
      <p>Indeed, and this is a poor substitute for the intelligent preservation of cultural identity. But your placing of "threatening" in quotes can be seen as dismissive of very real threats out there, sometimes in fact documented (such as with Benjamin Franklin, who actively thought of ways to assimilate Jews into US culture) but much more often covertly, or "subliminally".</p>
      <p>&gt; the fact that such a style of Greek type is widely<br>
      &gt; accepted as standard for Greek speakers is enough<br>
      &gt; to accept it as culturally authentic.</p>
      <p>Conscious public perception is undoubtedly a huge element in cultural autheticity, but since so much (I would say half) of our reality is subconscious I think this attitude is superficial. It's really much more complex than that, and we shouldn't succumb to the allure of over-simplifying it.</p>
      <p>Also, I personally think that authenticity can be over-played. As I said I'm not a conservative, so to me more important that what's been authentic is what should be authentic. Anything out there plays a part in the future - and that's where we're headed! In the end it's not a culture itself that's important, it's the users of that culture, and the richness they contribute to life.</p>
      <p>&gt; have never found a non-Greek who approved of it</p>
      <p>Although I certainly agree that the "classical burden" is out there (especially for Greeks) and is unjust, this is still no excuse for knee-jerk reactions (e.g. blind Latinization) like we saw in the 90s against Modernism (reminding here that I can't stand Modernism). Also, there certainly are non-natives who approve of Latinization, like Ludwig right here and Jan van Krimpen more famously. And if you read Morison's intro to Schonfield's book about reforming Hebrew, you might share the shiver in the spine that I felt.</p>
      <p>I also don't agree with the them-us dichotomy. We're all part of this world, and everybody is at least a tiny bit Greek. We should all care what happens.</p>
      <p>hhp</p>
