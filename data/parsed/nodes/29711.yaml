      <p>Well, I fear everyone of us falls victim of stereotyping here and there, if we are not careful. I agree with you that maybe the cultural considerations over type design are carried to an excessive extent, when people argue about "autenticity", because we can't deny what historically has been the development of typography. The first Greek and Arabic types were cut in Italy. Most of Arabic typography is still strongly tied to calligraphy. It would have happened probably in a similar way with Latin letters if Arabic had been the language spoken all over Europe during all these centuries.<br>
      Of course, Hrant is entirely right about this way of applying serifs to greek capitals (and even the weight modulation): it seems arbitrary but is adopted often by Greek designers as well.</p>
