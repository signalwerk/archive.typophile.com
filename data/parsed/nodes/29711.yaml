      <p>piccic — Yes, he is. I do like his clear-cut opinions, and he seems to be one of the few to have opinions for his own at all. But they do are stereotypes sometimes, especially when he conforms to capitalist logic and pomo rhetorics about cultural identity (which perfectly fit together, by the way).</p>
