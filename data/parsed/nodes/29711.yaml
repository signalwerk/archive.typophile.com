  - id: 170246
    user: 1250
    date: 2006-11-26T07:28:00
    date_raw: 26 Nov 2006 — 7:28am
    votes: null
    html: |-
      <p>&gt; I’m not sure whether it’s just a trend or whether the real reasons<br>
      &gt; behind it are more practical (e.g. saving up some space and<br>
      &gt; simplifying letterforms when typesetting in very small sizes etc.)</p>
      <p>Trends happen. Yes, it's important to be aware of them, but even more important is: recognizing and supporting the ones that are actually good; and seeing the limits of style in the domain of text faces.</p>
      <p>Saving space is a good thing, usually. It's just another factor.</p>
      <p>Simplfying: now there's the bugbear. Way too often it ends up resulting in empoverishment, and not much else. I wish it was just another factor, but usually it's too dominant. A symptom of Modernism.</p>
      <p>And what usually gets dropped from the equation is cultural and functional insight and sensitivity. This can only lead to an icrease in the size of the pointless gray blob consuming (intentional choice of  term, that) the world.</p>
      <p>&gt; what one considers latinocentric (formalised in stead<br>
      &gt; of chirographic forms), really is the essence of type</p>
      <p>This is exactly the sort of cultural hubris that leads to the demotion of minorities. And it is the disease of Modernism that has drawn a veil over the former and made the latter actually seem like a <cite>positive</cite>!  :-/</p>
      <p>In essence, anything not part of the dominant<br>
      culture is an "unnecessary redundancy"...</p>
      <p>--</p>
      <p>Seeing chirography and latinization as opposites may seem historically<br>
      valid, but in essence it's an illusion. I for one am firmly against both.</p>
      <p>hhp</p>
