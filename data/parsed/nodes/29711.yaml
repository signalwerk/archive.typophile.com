      <p>&gt;  I also don’t agree with the them-us dichotomy. We’re all part<br>
      &gt; of this world, and everybody is at least a tiny bit Greek.</p>
      <p>And this is precisely why I think there is no such thing as latinisation, but, instead, as I explained above, one common characteristic of type, deriving from its use as moveable, printable and reusable letterforms. The more a typeface design has this formal characteristic, the more it is type in the true sense. The Latin alphabet has this characteristic more than any other alphabet, not because Western culture is superior, but simply because the development of the Latin alphabet was influenced by its use in print more than any other alphabet.</p>
      <p>I feel a bit Greek, yes. Because I may happily take part in the inheritance of the great and universal contributions Greek culture has made to mankind's culture—amongst which… the alphabet.</p>
      <p>I have the impression you postmodernists are the ones who continually hammer on the them–us dichotomy: them, the bad, imperialistic Westerners, with their holistic ideology, against us, the oppressed minorities whose culture is taken from them.</p>
