      <p>I've been sketching a Latin lc set that is subordinate to Greek lc, trying (from my limited Latin POV) to reverse the approach. I'm pretending Greek is the standard and that I'm unfamiliar with Latin. Hrant, I wish I could see Nour/Patria (I can't find it on your foundry pages).</p>
      <p>As Brian points out, there are different uses for Greek glyphs. There are different applications for type; if a Greek newspaper or book needs to refer to some Latin-based text, of course you don't want the Latin to visually clash with the Greek, but visual harmony is not the same as identical texture, color, etc. in every detail.  Why would we consider it important to harmonize different scripts unless there were technical constraints? Hopefully we try to overcome those constraints whenever possible? </p>
      <p>In setting multilingual documents in multiple Latin-based languages, the challenge is always to differentiate the material in the different languages, or at least organize the layout so a reader can follow one or the other language. Doesn't the different look of different languages, and different scripts, help this? </p>
      <p>I can't think of a real functional reason to latinize a Greek typeface.</p>
