      <p>Vangelis, I like the changes you made. Specifically in the lowercase, the chi is more dynamic, the descenders look better without serifs, and the letterform for beta is more in accordance with the rest of the alphabet.</p>
      <p>The lowercase theta needs to resolve some dark spot issues, perhaps by making the middle stroke a touch thinner.</p>
      <p>Hrant, you say it's not about conservatism but sensitivity. I share those reasons, so I guess our differences in opinion (I don't find the supposed latinization in the design of Greek minuscules as offensive) come from different ideas of cultural authenticity.</p>
      <p>Attending to cultural needs is important, but most often such an intention finds the easy expression in the avoidance of any similarity with the product of another 'threatening' culture. A good topic that gives many fascinating examples is orthography reforms in European alphabets, for example in Czech where differences from Polish orthography were deliberately introduced to emphasize cultural difference. This tendancy is not a bad thing in itself, but if it becomes prescriptive so that any resemblance to a product from a threatening culture becomes reason enough for its rejection, then you're overdoing it.</p>
      <p>I think Hrant won't accept what he perceives as latinization to be culturally authentic. For me, the fact that such a style of Greek type is widely accepted as standard for Greek speakers is enough to accept it as culturally authentic.</p>
      <p>By the way, I've seen Greeks who don't like the 'latinized' style (especially oversees Greeks), but have never found a non-Greek who approved of it (not that I've seen that many people express an opinion on this matter). I think it just goes to show that Westerners judge Modern Greek culture with the huge expectations coming from idealized notions of Classical glory, and tend to label anything that fails to conform to such notions as devaluations. This is an unfair burden for Greeks. I'd rather trust them to do what they choose to do with what is in fact <em>their</em> culture and not hold them to unreasonable expectations based on what we think they should do.</p>
