      <p>...had a bad day "rcc"?<br>
      I can take all the criticism in the world, I LOVE constructive criticism. But i can hardly see any real criticism on your posts nor do i feel that you essentially offered any real input. I shall therefore not consider these posts any more seriously than<br>
      you considered mine. Just for the record, without being a "self-respecting typographer", but definitely considering myself a self-respecting reader, you need to be reminded that we do need to typeset other texts as well rather than...the Bible or the Battle of Marathon, in Greece. Regardless of your nationality then, your stay for as much as a quarter of a century in the country should have offered you a couple of looks on some newspapers at least. Garamond's or Didot's designs were wonderful, the Slimbach and the Greek Font Society's revivals are magnificent, still there are people who need to typeset texts that simply do not look OK with the "retrospective touches" typefaces like these have. Oh, and by the way, my sincere apologies for hurting your eyes. </p>
      <p>Dear Hrant, Ludwig M. Solzen and crossgrove sincere thanks for your comments. Now, that's real food for thought. Indeed, i still have a lot of work on the curves and lots of research to carry out. To be honest, i was expecting to hear that it looks too latinized and was more than sure that the remarks about the latin "chi" and "eta" would immediately pop-up. I've kept these glyphs like that after some consideration though. I'm not sure whether it's just a trend or whether the real reasons behind it are more practical (e.g. saving up some space and simplifying letterforms when typesetting in very small sizes etc.), but chi's and eta's without descenders are something that more and more appears in contemporary Greek typefaces (a big percentage of typefaces designed and used inside Greece); you might want to consider that. Also, you might not be aware of that or like it, but another "trend" is a latinized zeta or final sigma and I'm not speaking about just a couple of typefaces for specific uses here. I'm speaking about typefaces used by the biggest newspaper/magazine publishing companies. The only contemporary typeface that managed to be a real exception to all these "trends" without looking "old-fashioned" (don't misunderstand my point here, please) is, to my eyes, P. Bilak's "Fedra". Now, it was after some thought that i chose my pathway; i wanted to attempt a design that, while it might not be so academically consistent, it might actually turn out usable by people who simply don't want the classical touches of already existing, beautiful serif typefaces, some of which are already offered as freeware. Moreover, to my eyes, an overall too curvy and "calligraphic", too-"traditional" (e.g. Garamond-like since "rcc" mentioned it) design of the Greek glyphs could easily end up leading DejaVu to a "typeface-within-a-typeface" problem, namely, Greek glyphs side by side with Latin glyphs looking as if they actually belonged to different typefaces. A too-Latinized version, as you nicely pointed out for my design, is on the other edge, though. And upon this i should do some more research indeed. </p>
      <p>For the Armenian component of the DejaVu you might want to contact the team running the project? </p>
      <p>All the best, </p>
      <p>Vangelis</p>
      <p>PS: Dear Ludwig, yes, polytonic support is going to be added as soon as the glyphs forms are finalized.</p>
