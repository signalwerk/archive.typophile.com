      <p>The concept of latinisation is wrong. Western script originates from its Greek ancestry, which in its turn derives from the Phoenician alphabet, which in turn, &amp;c. Alphabetical script forms one insoluble whole, as opposed to syllabic or pictographic scripts. The differences between the diverse sets (Latin, Greek, Cyrillic) are in the letterforms, their skeletons that is, not in the way they are stylistically rendered. This derives from the tools and the intended use.</p>
      <p>Printed scripts are formalised because of the way in which they were and are produced, and because of their use with composing and printing machines. Printing was invented in Western Europe (forget about the Chinese and Koreans for a moment), where Latin script dominated. The letter forms that were taken as a model were already heavily formalised, becoming even more so as printing faces. So, what one considers latinocentric (formalised in stead of chirographic forms), really is the essence of type (printing type, that is), not an exclusive particularity of Latin script.</p>
      <p>Greek script never came loose from chirography, likely because it was introduced already too late in print, or because those who commissioned the first Greek types attached too heavily to the exotic Greek manuscripts of their days. Anyhow, the fact that for centuries Greek has been set with cursive types, makes that all Greek fonts look the same, i.e. there is but one style that is deemed proper for it, while Latin script has evolved over the centuries and can look back at a rich variety of styles. I strongly support type designers to give Greek (and Cyrillic) script a similar richness of style. This doesn't mean that proper glyph shapes are to be rejected (such as in Serbian or Bulgarian); chirographic idiosyncrasies (such as the pleade of Greek script ligatures), though, should be removed as unnecessary redundancies.</p>
