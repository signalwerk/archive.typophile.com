      <p><cite>I’ve been sketching a Latin lc set that is subordinate to Greek lc</cite></p>
      <p>I have toyed around with the idea. In fact, I've thought about a <em>Greek uppercase</em> set that is subordinate to Greek lowercase. No matter the weight of tradition and the lack of alternatives, I find the combination of latinate Greek uppercase and fully traditional Greek lowercase forms too strange to belong to the same script.</p>
      <p><cite>I can’t think of a real functional reason to latinize a Greek typeface.</cite></p>
      <p>One practical reason I've encountered for making Greek glyphs that are essentially part of the extended Latin alphabet is the International Phonetic Alphabet. Instead of having independent Latin and Greek scripts, one has a single script that uses Latin and Greek glyphs among others side by side. The question might then become whether that counts as designing Greek glyphs or extended Latin glyphs, but either way, one should make a 'latinized' Greek for the purpose.</p>
