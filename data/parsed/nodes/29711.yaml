      <p>vank — Really not bad at all. And the fact that you're designing for an OpenSource project has my full sympathy. I also strongly support your choice in favour of letter shapes that comply to what a typographical typeface should be, i.e. that what some consider "latinocentric". That choice is seconded by authorities in type design such as Jan van Krimpen and Eric Gill. However, some suggestions:</p>
      <p>Α: cross bar too low<br>
      Β: too wide; cross bar too low<br>
      Γ: too wide (= arm too long)<br>
      Δ: foot stroke too thin (match it with the left slanted stroke)<br>
      Ε: cross bar too high<br>
      Η: cross bar too high<br>
      Θ: cross bar too high; serifs too big (long), which clutters the counter<br>
      Ξ: cross bar too high and too thin, serifs to big (cfr Θ)<br>
      Ρ: (bowl) too wide<br>
      Σ: the diagonals shouldn't have the same thickness; either the upper one is the thicker (following the translation of the pen), or the lower one (as in Z)<br>
      γ: you should choose between these alternates (I prefer the first one)<br>
      ζ: you should choose between these alternates (I prefer the second one)<br>
      η:  perhaps making a descender from the second stroke would be one concession you could make to the misolatinists (and would better match the μ)<br>
      ν: you should choose between these alternates (I prefer the second one)<br>
      ξ: you should choose between these alternates (I prefer the first one while is the most latinised)<br>
      ς: you should choose between these alternates (I prefer the first one)<br>
      υ: you should choose between these alternates (I prefer the second one)<br>
      ΰ: acutus too low in regard to the trema</p>
      <p>Did you plan to add polytonic glyphs as well? (Having been a classical philologist, I deem this ablosutely necessary for a Greek font.)</p>
