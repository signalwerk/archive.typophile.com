      <p>Just a note: I'm almost sure Monotype Gill Sans Dual Greek is not by Eric Gill. Maybe Gill can't be considered an "authority" as a "sophisticate" text type designer. Surely he did know what he was doing. A thing a good 50% of people doing "fonts" today don't. :)</p>
      <p>The more recent Gill Sans Hellenic was designed by Cannibal Fonts' Hector Haralambous.</p>
      <p>Ludwing: Hrant may have a taste for provocative words, but surely he's not acting as a stereotype. Plus, he's quite lovable, more or less like Astro Boy (鉄腕アトム a.k.a. Tetsuwan Atomu for cultural purists). :)</p>
