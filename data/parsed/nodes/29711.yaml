      <p>Vangelis, first of all it is great that you are contributing to the DejaVu project. A lot has been said in this thread that I could comment on, but let me just add my opinions about the font for now.</p>
      <p>First the lowercase letters:</p>
      <p>Of the variant forms of letters (gamma, zeta, nu, ksi, finial sigma, upsilon), I like the first ones in all the cases. Breaking the symmetry helps letter differentiation. I agree that the curves have to be touched up in alpha, and also in the zeta, ksi, and finial sigma. The upper-left serif of eta needs thinning.</p>
      <p>I think I might prefer the theta opened up on the left, although it might be a challenge to keep a clean look in that form. The chi might work better with semi-serifs for the thicker diagonal. I am curious about the decision to shape the tau like you did, with the foot slightly dipping below the baseline and diverging from the forms of iota and pi.</p>
      <p>Maybe you could make the angle of the acutos steeper when it combines with the trema. Right now the combination isn't completely happy.</p>
      <p>As for the uppercase:</p>
      <p>I agree that the crossbar of the alpha is too low, but I'm guessing that comes from the latin cognate forms from DejaVu Serif. Still, you could make the Greek forms subtly different from the latin. The serifs of the middle horizontal strokes of the theta and the ksi are a bit too prominent.</p>
      <p>Overall, the text setting looks good, though I'll have to print it out to form a better opinion. Please keep posting improvements.</p>
