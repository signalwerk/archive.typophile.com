      <p>Hi everybody and thank you for your contributions. </p>
      <p>Hrant I totally agree with you, one should be aware of the trends and recognize and support the ones that actually are good. That’s why I did not choose a Latinized zeta or a Latinized final sigma on the design. Many thanks anyway. :-) </p>
      <p>Brian, my sole intention has been to design a version for use as is. Whether the project members will eventually decide upon the replacement of the existing version or not is a whole other subject, yet I am definitely not designing something from which certain glyphs would be taken and compiled with existing to constitute the Greek version of DejaVu. </p>
      <p>&gt;Let me explain. Who needs the Greek glyphs in a multilingual open &gt;source font like DejaVu Serif? I think most users will fall under one &gt;of three categories:<br>
      &gt;1. Greek speakers.<br>
      &gt;2. Scholars who deal with Ancient or Mediaeval Greek.<br>
      &gt;3. Those who need the odd Greek glyphs now and then for technical &gt;symbols.</p>
      <p>Now that’s great input! Sincere thanks for it. I have to admit that, so far, I was considering mainly the first category. It was good being reminded I should consider the third as well. Still, Greek glyphs to be used as technical symbols should almost always be italics, hence they should be separately designed. It's on purpose that I don’t refer to the second category by the way. There are already wonderful, freeware typefaces that perfectly serve such needs; the releases of the Greek Font Society. On the other hand, I, myself, was aiming on a general purpose contemporary Greek design that would be to some extend usable in a variety of applications, from on-screen reading to typesetting one’s thesis.  </p>
      <p>Regarding some other posts on the thread, I feel that there’s a tendency to forget that Greek language is not a museum exhibit; it’s a “living language” and, as such, subject to changes and novelties. Discussion on whether Greek glyphs should have serifs or not, is, to my eyes, equivalent to asking whether glyphs with accentuation marks (“tonos”) or lc should be included; were they used in classical Greece? No. Why use them now then, they were “novelties” introduced later on. In a similar manner, what’s the point of discussing on whether “eta” should have a descender? It could have yes, it could as well not have. Both forms can be seen in Greece nowadays with the latter (no descender) being way more common in typefaces designed by Greek designers. So, who knows if both alternatives will still be used in 30 or 50 years (I bet they will be)! So what? Today, is a an eta without descender equally or even more usable than an eta with descender in Greece? Most probably yes. Do we have open type? Can we include both etas? Why don't we and let one choose what they like?</p>
      <p>The current version is the one shown<br>
      <a href="http://osmosisnet.com/vkarag/DejaVuSerif_new2.pdf" rel="nofollow">here</a></p>
      <p>Quite some changes have taken place. I might have displeased someones with my "xi". I eventually chose a more "consistent" form, compared to the previous version. Some other glyphs have changed as well. The result is definitely far from being considered all smooth and fine-tuned, but i think it starts getting there.</p>
