      <p>&gt; conforms to capitalist logic</p>
      <p>?!</p>
      <p>Gill: what Carl seems to be alluding to (for example the fact that he <cite>never did any of the spacing)</cite> has great relevance. But I still think he had a supreme talent applicable to type design which put him above most every "de facto" type designer. Nonetheless, we're talking about non-Latin type here, and there's a qualitative difference: you either have nativity, or you need to develop it, and many people don't (even if they realize its importance, which I think Gill did). Others, like JvK, simply can't develop it because they're cultural bigots (and maybe worse), and no matter how nice their "native" type designs are they can never get over producing non-Latin fonts that are essentially crap.</p>
      <p>hhp</p>
