      <p>Funny, I was gearing up to soften things up when I read that last bit!<br>
      Before I forget: RCC, what's your actual name?</p>
      <p>My problem is I'm not even close to being an expert in Greek...<br>
      But I can offer the following, based on my general ideas about type:<br>
      1) It's too latinized. Too many serifs for one thing, and I'm guessing you've matched up the vertical proportions WRT the Latin. Please read my article in the 2005 edition of Hyphen (the Greek typographic journal). Or for starters: <a href="http://www.themicrofoundry.com/ss_rome1.html" title="http://www.themicrofoundry.com/ss_rome1.html">http://www.themicrofoundry.com/ss_rome1.html</a> _<br>
      Specifically in the lc for example, the eta and chi are fully Latinized. They're not Greeks, they're tourists.<br>
      2) There is a general malformation of curves. A quick look at the alpha indicates there's a lot of work to be done...</p>
      <p>All this said, I think with research, thought, sensitivity and persistence you can and will arrive at something good enough. And try to be happy even for the negative opinions: it means people care. Also, you have something very valuable going for you: nativity. The fact that you've been (I presume) exposed to Greek since childhood means you have the invaluable but elusive cultural sensitivity in you - you just have to get to it, by effort, but also by knowing what elements from Latin type to throw away instead of blindly replicate.</p>
      <p>BTW, I noticed that* DejaVu has an Armenian component.<br>
      I'd be curious to see that, and there I could help you guys for real.</p>
      <p>* I'm asssuming it's the "Arev" set mentioned in that wiki - which is<br>
      pretty clever, since it's the reverse of "Vera", and it means "sun"!</p>
      <p>hhp</p>
