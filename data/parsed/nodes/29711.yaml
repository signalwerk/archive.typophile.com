      <p>Don't call Eric Gill an authority in type design. He was nothing of the sort. He was a lettercarver with occasional forays into type design. I don't think he was the designer of the Greek sets to his own types. </p>
      <p>Vangelis, you might want to get Gerry Leonidas' document on Greek Type Design. It's very thorough in explaining various conventions of Greek type design. Though you might want more sources, this is a valuable document for what you are doing.</p>
