      <p>At least in Latin, the lowercase letters were given uppercase-style serifs, giving the two cases some visual harmony despite the disparity in letterforms.</p>
      <p>On the other hand, I am still not fully comfortable with seeing Greek lowercase letters with added serifs, although this is exactly the kind of change that the Latin lowercase went through to be matched with the uppercase.</p>
      <p><cite>One key to this puzzle however might be… uncial.</cite><br>
      That makes sense. As a theoretical exercise, we could go back to the point when the combining of combining uncial-derived minuscules with the traditional Roman majuscules was introduced, and think of a different solution to making the cases harmonize. Maybe I would have preferred that the minuscule letterforms dictate the combining majuscule forms, not vice versa, so that the resulting alphabet would have more of an uncial flavour.</p>
