      <p><cite>1) Why not reduce them in the Greek UC?</cite><br>
      An idea I had as well, and probably lots of others who have thought about this. I just wonder why we don't see that type of a solution more</p>
      <p><cite>2) Does “this is exactly the kind of change that the Latin lowercase went through to be matched with the uppercase” really make sense? The lowercase arose by writing the UC forms more quickly; the two cases didn’t exist in parallel until much later, and the lc had serifs all along.</cite><br>
      The Latin minuscule had serifs, that is, in strokes and exit strokes that made sense when writing the forms quickly. But it gained inscriptional-style symmetric serifs to harmonize with majuscule forms. An uncial-based m might have just the in stroke and the one exit stroke, but an m with majuscule-style serifs has those foot serifs on all three feet. That's what I meant.</p>
