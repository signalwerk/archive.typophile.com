      <p>The Greek script is very much a living thing, and so is Latin. I myself have proposed reforms to the Latin script. So at least for me it's not about conservatism. But it is about sensitivity, to things beyond the whims of personal expression and mere style. So for example when you ask "what's the point of discussing on whether 'eta' should have a descender?" I would say that the point is to know the effects of such a decision, not least concerning the health of Greek culture as well as the readability of the resultant design. Also, you can't blindly do to Greek what people typically do to Latin - not just because there are structural differences but because the users of Greek and Latin need different things, hence the scripts need different things. The case with Greek isn't so dramatic, but for some scripts -like Armenian- the danger of eventual total assimilation into larger cultures is a very good reason to be extra careful and not give in to expressive whims, instead channeling one's expression to help one's culture, not to mention make something functional, not just abstractly pretty.</p>
      <p>hhp</p>
