    <p>Has anyone digitized Eric Gill's lettercut in Hoptonwood stone published by John Hogg in 1925? </p>
    <p>I am looking for Roman Capitals similar to this work. I do not wish to use the common Trajan font but something a little more obscure. </p>
    <p>Any suggestions?</p>
