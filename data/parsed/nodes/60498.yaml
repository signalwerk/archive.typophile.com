      <p>The caps from Monotype's Gill Facia display font might be close to what you're looking for, although I think they lack the grace of Gill's better stonecutting.</p>
      <p><a href="http://new.myfonts.com/fonts/agfa/gill-facia-mt/regular-display/" title="http://new.myfonts.com/fonts/agfa/gill-facia-mt/regular-display/">http://new.myfonts.com/fonts/agfa/gill-facia-mt/regular-display/</a></p>
      <p>Ignore the lowercase.</p>
