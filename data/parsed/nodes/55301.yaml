    <p>I celebrated my birthday recently and my brother bought me a copy of Felici's Complete Manual of Typography. Add that to Bringhurst and I'm officially started on my typography library.</p>
    <p>My wife and I are working on self-publishing a few niche books, so it is good for me to have some instruction on doing things the right way!</p>
