      <p>£10 off each weight of our new font family, Effra, till the end of Oktober: <a href="http://www.daltonmaag.com/discount/EFFRAOCT" title="http://www.daltonmaag.com/discount/EFFRAOCT">http://www.daltonmaag.com/discount/EFFRAOCT</a></p>
    <p>Bis Ende  ist auf Effra ein Discount von £10 pro Schriftschnitt erhältlich: <a href="http://www.daltonmaag.com/discount/EFFRAOCT" title="http://www.daltonmaag.com/discount/EFFRAOCT">http://www.daltonmaag.com/discount/EFFRAOCT</a></p>
    <p>1) Named after a river in South London</p>
    <p>Swiss typographer Jonas Schudel began development of this new font family during a type design workshop many years ago. Finally, we are ready to release Effra in five weights...</p>
    <p>More: <a href="http://www.daltonmaag.com/news/95.html#S1" title="http://www.daltonmaag.com/news/95.html#S1">http://www.daltonmaag.com/news/95.html#S1</a></p>
    <p>1) Ein Fluss in Südlondon als Namenspatron: Effra</p>
    <p>Der Schweizer Typograf Jonas Schudel hatte vor einigen Jahren während eines Design-Workshops mit dieser Schrift begonnen. Jetzt ist die Effra in fünf Schnitten verfügbar geworden...</p>
    <p>Mehr: <a href="http://www.daltonmaag.com/news/95.html#S1" title="http://www.daltonmaag.com/news/95.html#S1">http://www.daltonmaag.com/news/95.html#S1</a></p>
    <p>2) East meets West</p>
    <p>Designing our first Arabic font was a challange to say the least. But we enjoyed every second of it, particularly as we also designed a Latin with a strong family resemblance...</p>
    <p>More: <a href="http://www.daltonmaag.com/news/95.html#S2" title="http://www.daltonmaag.com/news/95.html#S2">http://www.daltonmaag.com/news/95.html#S2</a></p>
    <p>2) East meets West</p>
    <p>Der Auftrag, eine Arabische Schrift zu designen, war gelinde ausgedrückt eine Herausforderung. Aber wir genossen jede Sekunde davon, parallel eine Lateinische und arabische Schrift zu einer ausdrucksstarken Schriftfamilie zu entwickeln...</p>
    <p>Mehr: <a href="http://www.daltonmaag.com/news/95.html#S2" title="http://www.daltonmaag.com/news/95.html#S2">http://www.daltonmaag.com/news/95.html#S2</a></p>
    <p>3) Font property</p>
    <p>Contemporary and commanding, distinctive and traditional, smart and sophisticated: these are just a few attributes that needed to be expressed in this display font for Knight Frank...</p>
    <p>More: <a href="http://www.daltonmaag.com/news/95.html#S3" title="http://www.daltonmaag.com/news/95.html#S3">http://www.daltonmaag.com/news/95.html#S3</a></p>
    <p>3) Knight Frank</p>
    <p>Modern und dominant, markant und traditionell, smart und anspruchsvoll: das sind ein paar Attribute des Displayfonts für Knight Frank...</p>
    <p>Mehr: <a href="http://www.daltonmaag.com/news/95.html#S3" title="http://www.daltonmaag.com/news/95.html#S3">http://www.daltonmaag.com/news/95.html#S3</a></p>
