    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/add/wiki?edit%5Btitle%5D=Companies" title="Create node &quot;Companies&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Companies</a>&nbsp;:&nbsp;Macromedia</strong></p>
    <p>Macromedia was a software company based in <a href="/node/30526" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">San Francisco</a> California that published the popular <a href="/node/12387" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Type Design</a> application <a href="/node/12024" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fontographer</a>. The company was acquired by <a href="/node/13428" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adobe</a> in&nbsp;2006.</p>
    <p>Macromedia was a On May 9 2005 <a href="/node/add/wiki?edit%5Btitle%5D=FontLab%20Ltd." title="Create node &quot;FontLab Ltd.&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">FontLab</a> announced the licensing of the full <a href="/node/12024" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fontographer</a> product line from Macromedia Inc. and its further&nbsp;development.</p>
    <p><span class="caps">UK</span> designer <a href="/node/14015" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Neville Brody</a> has received notoriety in part due to his graphic design systems, including custom <a href="/node/add/wiki?edit%5Btitle%5D=type%20desgn" title="Create node &quot;type desgn&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">type desgn</a> and <a href="/node/12026" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typography</a> for Macromedia during the&nbsp;1990s.</p>
