    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Companies" class="freelinking" rel="nofollow">Companies</a> : Macromedia</strong></p>
    <p>Macromedia was a software company based in <a href="/wiki/San%20Francisco" class="freelinking" rel="nofollow">San Francisco</a> California that published the popular <a href="/wiki/type%20design" class="freelinking" rel="nofollow">type design</a> application <a href="/wiki/Fontographer" class="freelinking" rel="nofollow">Fontographer</a>. The company was acquired by <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a> in 2006.</p>
    <p>Macromedia was a On May 9 2005 <a href="/wiki/FontLab%20Ltd." class="freelinking" rel="nofollow">FontLab</a> announced the licensing of the full <a href="/wiki/Fontographer" class="freelinking" rel="nofollow">Fontographer</a> product line from Macromedia Inc. and its further development.</p>
    <p>UK designer <a href="/wiki/Neville%20Brody" class="freelinking" rel="nofollow">Neville Brody</a> has received notoriety in part due to his graphic design systems, including custom <a href="/wiki/type%20desgn" class="freelinking" rel="nofollow">type desgn</a> and <a href="/wiki/typography" class="freelinking" rel="nofollow">typography</a> for Macromedia during the 1990s.</p>
