    <p>This is an example of how the new “Supply Your Own Font” license plates are expected to look like. The fee is $25 above the normal personalized plate fee.</p>
    <p>The font must be supplied on non-returnable standard media (CD preferred) and must be a bold weight. No “grunge” fonts will be accepted. </p>
    <p>The example shown uses Big Top by Shamrocking Fonts.</p>
    <p>For more information contact your local DMV.</p><div class="imageWrap"><img src="/files/bigtop.jpg"></div><p></p>
