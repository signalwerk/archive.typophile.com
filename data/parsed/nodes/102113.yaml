    html: |-
      <p>So they're not actually licensing the font, right? They just want to pay you to use a logo made with the font. Which I presume makes the Typoteque reference moot.</p>
      <p>Satya, many font EULAs don't require any special permission for that sort of thing* but let's assume Eli's does. So, how much to charge? I think a beginner should think of it this way: if you ask too little, you just lost some money; if you ask too much, you just lost some highly valuable exposure, including a chance for more business from the client. Also keep in mind that big companies got that way by not wasting money. How unique is your font? Remember, there's no copyright protection for actual font designs. If it costs them less to start from scratch, using somebody who's already on salary... The work for Disney that I once used to do (before they had to tighten their belts) always involved fixing a mess made by an in-house "type designer" (using the term loosely); whenever I pitched the idea of a custom font they looked at me funny.</p>
      <p>* Which however doesn't stop some companies from insisting on paying you something for some sort of official agreement, so you can't sue them later.</p>
      <p>BTW please do share your results here!</p>
      <p>hhp</p>
