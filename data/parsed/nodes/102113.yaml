    votes: null
    html: |-
      <p>I don’t charge extra or require a special broadcast license either. Same for logos. </p>
      <p>I sort of get why people do it, that one should treat fonts like stock illustration or photography, that fonts should cost more when they are central to a design or product. But it seems shortsighted. </p>
      <p>I strongly believe that prominent use of a font is the best ways to create demand. Therefore, I <em>want</em> people to use my fonts in logos and on TV shows and movies. Why would I risk discouraging that by charging more? I don’t believe I’m “leaving money on the table” in the long run.</p>
