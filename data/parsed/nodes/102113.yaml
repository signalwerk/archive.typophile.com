    <p>Hello Typohphiles,<br>
    I am pretty new as a contributor to the font world and was hoping some more experienced members could point me in the right direction. I recently released a font which has gleaned a lot of attention and now a major US broadcaster is requesting to license it for use as a logo for a television show, for US audience only, for one season for now.</p>
    <p>I really have no idea how I should be calculating licensing fees for something like this, or what is appropriate. I neither want to overcharge nor undersell myself on this. The only point of reference I have found is the broadcast license <a class="freelinking external" href="http://www.typotheque.com/licensing/broadcasting" rel="nofollow">calculator on Typoteque</a>, which feels high to me, but at the same time I am sure the broadcaster is dealing with huge budgets.</p>
    <p>Can anyone provide insight, or point me in a direction with more info on licensing and fees?</p>
    <p>Thanks so much!</p>
