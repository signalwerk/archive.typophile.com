    html: |-
      <p>I have not come across many (if any) foundries specifying broadcast licensing, so the Typotheque example is intriguing. In a lot of cases licensing outside of predictable and well understood environments varies greatly between foundries, at least partly as a result of the font data often being distributed with the content it is being used to display. I am not familiar with the technology used to generate broadcast typography and whether this puts the font data at risk, so perhaps it comes down to a matter of exposure? House Industries take an approach to logo usage that considers the gross revenue of a company or of a movie that the font is used to promote:</p>
      <blockquote><p><em>Logo Usage and Product for Sale</em></p>
      <ul>
      <li>There is no additional charge for companies under $5 million (US Dollars) in annual gross revenue. If the logo has a specific application for a business within another company, then use the estimated gross revenue for that venture. For example a logo for a major motion picture would be priced on the movie gross, not the studio gross.</li>
      <li>$5 million to $10 million: $5000</li>
      <li>$10 million to $50 million: $10,000</li>
      <li>$50 million and over: $15,000</li>
      </ul>
      </blockquote>
      <p><a href="http://www.houseind.com/fonts/licensing/pricing" title="http://www.houseind.com/fonts/licensing/pricing">http://www.houseind.com/fonts/licensing/pricing</a></p>
