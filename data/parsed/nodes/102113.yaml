    html: <p>Yes, I still don't quite understand the intricacies of licensing. From what I have read on the forums here, whatever price is paid for the EULA should allow the font to be used to produce unrestricted any sort of printed product, so long as the font software itself is not distributed with the product. With that said though, I recently had a large music publisher approach me to license this same font for use on an album cover for a significantly greater price (of their own naming) than the typical EULA cost. The licensing was not for multiple users or anything like that, but pertained specifically to the font's use on the cover of this album, which makes me wonder if this is common practice for large corporations?</p>
