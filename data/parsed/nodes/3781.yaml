    html: <p>The biggest problem you might face is in the registration. Even if the registration misses by one dot you will have a colored glow. Yeah, maybe only slight, but that is why I would use a pantone black and then a gloss varnish on top (or of some sort). If then the reg is off with this it won't glare near as much. <br> <br>The opposing lines/angles is jarring, but this is not necessarily a bad thing for some people.</p>
