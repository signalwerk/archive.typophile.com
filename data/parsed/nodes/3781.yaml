    html: <p>My thoughts, which are not what you want to hear (but you did post the pdf) are that you could work a bit more on this challenging your design decisions, such as the box -- for example -- that disrupts the flow of the lines and adds an unnecessary element. Why not a box without the lines -- lines without a box? Is a box necessary? Flush right type? Why? I see only blue and black, why this color combo? Personally, I think typography alone could carry the day for you. Of course it would have to be just the right face, impeccably set. Hope this helps.</p>
