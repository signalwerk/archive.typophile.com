    html: |-
      <p>I know, that's clearly not an answer but in only 1 word, 3 different /S... Why not "giving up" and simply considering it as handwritten, not a font? </p>
      <p>EDIT: some very (very...) loosely similar: <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/mister-earl/" rel="nofollow">Mister Earl</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/chank/coffeedance/" rel="nofollow">Coffeedance</a> (my choice), <a class="freelinking external" href="http://www.myfonts.com/fonts/letraset/etruscan/" rel="nofollow">Etruscan</a>, <a class="freelinking external" href="http://www.ffonts.net/Pea-Mary-Katie.font" rel="nofollow">Pea Mary Katie</a> (also <a class="freelinking external" href="http://www.ffonts.net/Pea-Mary-Katie-Skinny.font" rel="nofollow">Skinny</a>)<br>
      Try also the "More font like [...]" function at MF (start for instance with <a class="freelinking external" href="http://www.myfonts.com/morelike/1593/" rel="nofollow">Coffeedance</a>).</p>
