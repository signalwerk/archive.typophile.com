    html: <p>If all you care about is the rendering control (and not encoding and layout features), then the big advantage of TrueType was that you could get relatively consistent results in terms of bi-level bitmap patterns regardless of the OS and TrueType rasterizer - whereas Adobe was in the habit of "improving" the output of the PostScript rasterizer. Obviously that changed big time with OS X, Freetype and ClearType.</p>
