    <p>John Daggett from Mozilla, who is the editor of the <a href="http://dev.w3.org/csswg/css3-fonts/" rel="nofollow">CSS3 Fonts Module</a>, will be in Los Angeles for a few days preceding this year's <a href="http://www.typecon.com/" rel="nofollow">TypeCon</a> conference. I'm working with John and the TypeCon organisers to hold a briefing/dialogue session on web typography in CSS3 on Wednesday 18 August, at the <a href="http://www.typecon.com/hotel.php" rel="nofollow">conference venue</a> in LA.</p>
    <p>The purpose of this session is for John to explain the new typographic features in CSS3 — including access to a large number of OpenType Layout features — and to get feedback from font developers and from typographically aware web designers. This is a good opportunity for members of the type community to help improve the CSS3 Fonts Module standard. Previous criticisms of the draft standard from font developers have noted that the terminology used in the specification differs from that commonly used by type designers and typographers, and hence is confusing, so one thing that could be achieved at this session is review of that terminology. As other browser makers will be present in LA for the preceding W3C Web Fonts Working Group meeting, there may also be an opportunity to discuss CSS3 implementations</p>
    <p>I'm currently thinking in terms of a half-day session, most likely in the afternoon, but this plan has not been finalised. In order to determine logistics for this event, the TypeCon organisers need to get a sense of how many people to expect. If you are interested in attending this session, please indicate so in this thread or, if you prefer, contact me at tiro[at]tiro[dot]com.</p>
    <p><strong>Please note: this session is not for discussion of web font formats or licensing. There will be at least one session devoted to web fonts during the main conference programme. This session is focused on CSS3 typography.</strong></p>
    <p>Please also note that this session will take place at the same time as some of the pre-conference workshops. Please be aware of a possible conflict if you have signed up for a workshop or are planning to.</p>
    <p>The intention is for this session to be free, but for planning purposes we really do need to know in advance if you are planning to attend.</p>
