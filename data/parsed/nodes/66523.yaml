      <p>&gt; Just curious I dont see any links to copy someones message and quote it on here</p>
      <p>I tend to highlight the text I want to quote, and then copy. Paste into the comment box.</p>
      <p>Oh, you wanted something simpler?</p>
      <p>I prefer this system, as the easier ways result in over-quoting. People will tend to just quote the bits that are relevant. Worst case systems automatically quote everything, and after five or six messages you wind up with 100s of line of quotes message, and then get down to a one line answer.</p>
