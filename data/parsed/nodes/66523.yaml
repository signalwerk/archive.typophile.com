      <p>I like to enclose quoted passages within cite tags</p>
      <p><cite>which results in text like this</cite></p>
      <p>but isn't precisely clear as to its purpose, nor does it refer to the original poster. It's as good as we have right now.</p>
      <p>There are pros and cons to a more automated, feature rich quotation system as already noted. I'm hesitant to go around requesting new features after the madness of the last upgrade (which has thankfully died down). I am partial to the way Fark.com handles the situation, though it requires vigilance on the part of the writer to keep it from getting muddled.</p>
