    <p>Just curious I dont see any links to copy someones message and quote it on here :(</p>
    <p>I've wanted to quote a image someone posted without just having to repost the image. Right now there is no way to quote a post and have it link back to the original post, unless it was the 1st message. I could browse the sourcecode and do it, but that is too clunky I think.</p>
    <p>Maybe this could be added in the next upgrade of the forums.</p>
