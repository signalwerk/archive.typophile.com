    html: |-
      <p>What you have observed is a compromise.<br>
      The size and weight of the ﬁgures you describe are somewhere between capitals and lower case.<br>
      Therefore, they are not overpowering in upper and lower case text, yet still function fairly well in all-cap settings.</p>
      <p>However, now that we have the OpenType format that permits thousands of glyphs in a font, it is possible to include many different ﬁgure (number) styles in a font, each designed to work in a certain kind of setting.</p>
      <p>My current practice is to make the default ﬁgures “three-quarter” height, lining, and tabular.<br>
      The old style and proportional variants are accessible in the ﬁgures section of the OpenType menu in applications such as InDesign, while there are variants for small caps that are activated in the Small Caps feature, and variants for all-cap setting that are activated in the All Caps (case) feature.</p>
      <p>Here is how I proliferated the ﬁgures in Scotch Modern:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/figs_6304.png"></div><p></p>
      <p>A good overview of contemporary ﬁgure-ing in fonts:<br>
      <a href="http://fontfeed.com/archives/figuring-out-numerals/" title="http://fontfeed.com/archives/figuring-out-numerals/">http://fontfeed.com/archives/figuring-out-numerals/</a></p>
