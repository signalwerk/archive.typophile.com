      <blockquote><p>Lining (modern) figures are monospaced, even when the other glyphs are not.</p></blockquote>
      <p>? Lining vs. ranging and tabular vs. proportional are two separate issues which are not necessarily related. </p>
      <p>What Nick said about compromising to more-or-less work with both case settings is the most important rationale for shorter figures. Making them a different height than caps also disambiguates some: a zero and an O will be more distinct.</p>
