    html: |-
      <p>Type designers often choose not to align numerals with cap height or lowercase ascenders. If the user disagrees with the type designer's decision, he or she can manually adjust the height of the numerals, or use a different font.<br>
      I hope that's a helpful answer. Maybe your question has more to do with what informs a type designer's decision to make the numerals taller or shorter, or to make the stems thicker or thinner, and I'll have to leave it to other Typophiles to answer that question.</p>
