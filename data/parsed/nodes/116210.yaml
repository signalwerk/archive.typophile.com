    html: <p>The standard  numerals in most fonts are designed to fit optimally in tabular matter, and don't always fit well in paragraphs of text or headlines. When combining numerals with text, choose a font that has old style figures, like Georgia. When setting numerals in a headline of all caps (e.g., CELEBRATING 100 YEARS), use lining (also known as modern) figures and increase the size by a point or two to match the cap height.</p>
