  html: '<p>Hi all, <br>I am looking for the font used for "regret" in the bottom right-hand corner here: <a href="http://www.mediacampaign.org/mg/print/ad_present.html" target="_blank">http://www.mediacampaign.org/mg/print/ad_present.html</a> <br> <br>There are many of these Anti-Drug ads so I imagine that it is actually a font and not hand-drawn.</p>'
