    html: "<p>I seem to recall that we may have had this question once before, but I hunted anyway. I searched all of <a href=\"http://bowfinprintworks.com/Script11Pg1.html\" target=\"_blank\">Part 11</a> and <a href=\"http://bowfinprintworks.com/Script12Pg1.html\" target=\"_blank\">Part 12</a> of the Script Font ID Guide. I found a number of very similar styles, but didn't see an exact match in over 500 samples. <br> <br>Now it's time for my 'standard' reply about such questions:  basically, it is so simple and cheap to make a font like this, that any agency that wants a unique look, just needs a pen, a scanner or fax machine and a computer. For $9 you can send a sample of your printing and have a font made.   <br> <br>This means that looking to identically match fonts like this is generally a waste of time. You are better off to look through samples at any of the sites that have hand-printed fonts (mine are samples only - no font downloads - you look up the source in my Reference List and get them from the supplier), and find something similar to the one you are trying to match.</p>"
