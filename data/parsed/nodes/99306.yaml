    <p>Hi all,</p>
    <p>The font Europa Arabesque was originally licensed by Monotype from FontHaus, as evidenced by this (very old) trademark PDF over at fontwise.com:<br>
    <a href="http://www.fontwise.com/PDFs/Trademarks.pdf" title="http://www.fontwise.com/PDFs/Trademarks.pdf">http://www.fontwise.com/PDFs/Trademarks.pdf</a></p>
    <p>However, it doesn't seem to be commercially available any longer, but is available on at least one free site:<br>
    <a href="http://www.fontsner.com/font/EuropaArabesque-49394.html" title="http://www.fontsner.com/font/EuropaArabesque-49394.html">http://www.fontsner.com/font/EuropaArabesque-49394.html</a></p>
    <p>Anyone know of any alternate cuts or who the original designer might be?</p>
    <p>Thanks,<br>
    David</p>
