    html: <p>Hmm. So what do Windows users use their left hand for? ;-) <br> <br>Seriously, I've got a three-button mouse (with scroll wheel) on my Mac. The scroll wheel is the thing I most appreciate. I can never remember what the middle button is programmed to do, and it takes relatively difficult contortions to press it anyway (probably a connection there). The right button is nice, but control-click is just as easy. Sometimes I accidentally hit the left button while holding down the right button, a mistake that can't happen with a one-button mouse. In general, I find the multi-button mouse a bit less comfortable to use since you have to hold it with the thumb and two fingers instead of the thumb and three fingers, and the remaining two fingers must be more precisely placed. But I'm totally hooked on that scroll wheel. <br> <br>The idea that a one-button mouse is for those with half a brain is ridiculous. If anything, it would engage both right and left sides of the brain more fully, since you need both hands for certain mouse operations. I'm not saying it's necessarilly better, but it's not necessarilly worse, either. Just different approaches with advantages and disadvantages on both sides.</p>
