    html: "<p>Windows has (typically) 2 mouse buttons, as well as control, shift and alt keys. <br> <br>After left-click, and double-click, right-click is probably the next most common windows trigger. <br>(Double-right click is a much underused feature!) <br> <br>After that, there are control-click, and shift-click. <br>Typically, in a list of options, control-click will multi-select non-consecutive items, while shift-click will select all the items between two selections. <br>These have other uses, in non-list situations. For example, in many graphics apps, where click replaces a selection with a new selection, control-click removes from the original selection, and shift-click adds to it. <br>Now you come to mention it, alt-click isn't used much (and maybe Macs have an alt key too), so maybe the equivalents are: <br><b>Windows</b> <br>Left-click <br>Right-click <br>Control-click <br>Shift-click <br>Alt-click <br> <br> <br><b>Mac</b> <br>Left-click <br>Control-click <br>Option-click <br>Shift-click <br>??? <br>But what about the command(?) key on Macs.? <br>What does that do? <br></p>"
