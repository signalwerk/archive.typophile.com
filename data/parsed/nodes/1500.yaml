    html: <p>AT this time, I feel OSX and XP are both pretty ugly. I have switched from Mac to PC when Apple was still Steve-Job-less and never looked back, but the new OSX-Look would have driven me away for sure. And even on XP, you can't really like the look unless you switch off a lot of effects, hack the bootscreen, change the icons, the colours and basically make th system look the way you want it. On Win2000 I used WinBlinds to customize the look, on XP I just hacked it a bit and that is quite enough. The simpler the better. I argue that an Operating System for professionals (not the Home-versions, mind) should be as lean and efficient and most of all customizable as possible. XP and OSX are overloaded.  <br> <br>Hrant -- the logi Mouses do work on Mac. The MX 700 is the best mouse available at the moment. While the one-button-g4-Mouse looks great, it just isn't any good at all, except maybe writing letters. The only worse mouse was that awful idiotic  round iMac Mouse :-D. </p>
