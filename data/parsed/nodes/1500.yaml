    html: <p>for the Mac, &lt;command click&gt; is used for non- <br>consecutive selection (but, shift serves this function in  <br>the Classic Finder). &lt;option click&gt; serves various useful  <br>functions depending on the application, but in the  <br>Finder it allows you to close the preceding window as  <br>you open the next. &lt;control click&gt; is the equivalent of  <br>Windows right-click. &lt;shift click&gt; allows for non- <br>consecutive selection in the finder and consecutive  <br>selection elsewhere (why this happened, I don't know). <br> <br>the &lt;option&gt; key on Mac keyboards is the equivalent of  <br>&lt;alt&gt;, and on some keyboards (possibly all now) it  <br>actually says &lt;alt&gt; in smaller type.</p>
