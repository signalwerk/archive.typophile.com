    html: <p>Being a lefty I found my left hand was too stiff and precise to control a mouse. So I started mouseing with my right hand and never looked back. <br> <br>Trust me, flipping the mouse and pad to the left side got really old after about 3 seconds. <br> <br>By the way, this thread reminds me of another situation I think parallels this discussion. <br> <br>After years of wearing glasses, I finally decided to give contacts a try and let me tell you they have as many drawbacks as their older cousin does for as many reasons as I've been influenced to switch. Reading all the dialog about Mac vs PS made me think about my current situation. <br> <br>I feel as attached to my old glasses as I do to a Classic Mac OS or Fontographer. . . <br> <br>Since FLAB is the future, so is OSX and contact lenses. . . <br> <br>So let me state for the record while I am adjusting to three significant transitions in my life (digital and analog) there is no better or worse, just more options to frustrate yourself with. <br> <br>Stuart :D</p>
