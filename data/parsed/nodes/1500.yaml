    html: <p><i>Which scrolly mouse has one button?... </i> <br>  <br>None that I know of. As I said, I'm using a multi-button mouse with a scroll wheel. The scroll wheel is the thing I miss when I use a regular Mac mouse, not the extra buttons. I wouldn't mind a one-button mouse with a scroll wheel. Even better would be if I could also use it to scroll horizontally. It's really annoying when I get to one of those oddball sites that scrolls horizontally and I have to scroll using the scroll bar. ;-) <br> <br>Interestingly, Apple recently got a patent for a mouse with a dial on it that can scroll both directions. <a href="http://www.macobserver.com/columns/devilsadvocate/2003/20030425.shtml" target="_blank">http://www.macobserver.com/columns/devilsadvocate/2003/20030425.shtml</a> <br> <br>My complaints with Apple's current lozenge-shaped mouse are that the click is too stiff (even at the lowest setting), the top end of the mouse where you click is too large (at least for me--I have smaller than average hands), and it's trickier to pickup and move the mouse in the middle of a drag operation since nearly the whole mouse is a button. Plus, it doesn't have a scroll wheel. :-)</p>
