  - id: 12090
    user: 1043
    date: 2003-09-28T11:58:00
    date_raw: 28 Sep 2003 — 11:58am
    votes: null
    html: <p>I don't care which OS people use. I was talking about mice (or is it mouses?). <br> <br><i>&gt; simply hold down the control key  <br>  <br>Which I already alluded to in my post.  <br>But you call that intuitive?! It's plain bad design. </i> <br>  <br>It isn't any less intuitive than the right click. Both are learned behaviors. Both behaviors become second nature in a short time and the method you aren't familiar with will always seem counterintuitive. <br> <br>In my experience with the one-button mouse, my left hand was already poised over the shift, option, and command keys anyway, ready to modify whatever the right hand was doing with the mouse, so adding the control key into the mix to activate contextual menus was no big deal. <br> <br>It took me a couple of weeks to get used to having a right mouse button and "unlearning" the control-click behavior to get to the point where I didn't need to think about it. I had expected a big productivity boost, but, when it comes down to it, I can't do anything that I couldn't do before (except maybe propping up my head with my left hand while sifting through tedious discussion forum threads).  <br> <br>My basic point is that the one button mouse system is not as brain-dead as some people seem to think. In terms of usability, the two approaches are not that different. <br> <br>Now, the scroll wheel is another story... </p>
