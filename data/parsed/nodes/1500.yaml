    html: <p>I'm not talking about the OSes themselves - like I  said (or tried to say), they both mostly suck. My complaint is with the companies behind them, specifically Apple in this case. It's annoying that they portray themselves as visually and "intuitively" sophisticated, while in reality it all looks childish, and is typographically wannabe. <br> <br>It's what's inside that counts, and there both OSes are about the same. I just wish people would stop salivating over superficial crap, which is what Apple concentrates more on to sell their wares. While they were worried about getting the right sheen on their titanium toys, they failed to apply ClearType technology which they invented! <br> <br>hhp <br></p>
