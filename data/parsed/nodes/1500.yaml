    html: <p><b>What can chrome do for you?</b> <br> <br>Like many, I've long been enamoured of Apple's industrial design, UI, advertising, et al. They are one of the few companies in any sector that consistently realizes the potential of design as a differentiator. You can buy a dell for 1/3 to 1/4 of what a Apple desktop will cost you, but who wants to look at it -- on or off! Apple gets the design = value equation like few others. <br> <br>That said, they seem to have joined the ranks of the great unwashed in their race to create the puffiest logo. <br> <br><img src="http://www.typophile.com/forums/messages/4100/17363.jpg" alt="Uglies"> <br> <br>We should have seen it coming with the proliferation of glowing, pulsing jelly bean buttons, drop shadows, liquid animations, I guess. Design at Apple is now treading a dangerous line between innovation and novelty. This new logo can only be seen as the latter. It's an indulgence of Apple's new material fetish and has nothing to do with design, communication, or signalling any kind of real or positive change. It's insecure, trendy, and destined share the fate of Disney's Tomorrowland.</p>
