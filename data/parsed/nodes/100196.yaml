    html: <p>Admirable! Something bothers me about the extrabold w, though. I don't object to the basic structure; I think it's that the second stroke seems to have a mismatched slope. Capital W doesn't have this problem, but the way the top of the middle stroke flares from (or tapers toward) the join may be conspicuous.</p>
