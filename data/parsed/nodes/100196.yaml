    <p>Hello typophiles. I'm watching this discussions for a while and now decided to put my very first typeface here. </p>
    <p>I've started with type design and this typeface on Summer workshop Tipobrda 2012 in Slovenia. It went through many changes and ideas, many times thrown in trash, many times totaly redesigned.  I would like to stop at some point and do the rest of the design process. Still I'm not sure about this stage it and that's why I'm posting it here. </p>
    <p>Here is simple latin alphabet. Texts, diacritics and greek are in attachments. Also I put there one older stage of design. </p>
    <p>I'll be very gratefull for any comments and especialy critique.</p>
    <p>Anje Hairline:<br>
    <img src="http://jancharvat.cz/projects/type%20design/own/anje/data/anje%20hairline.png" width="600px"></p>
    <p>Anje ExtraBold:<br>
    <img src="http://jancharvat.cz/projects/type%20design/own/anje/data/anje%20extrabold.png" width="600px"></p>
