      <p>Thank you for your finds. I can see the trouble with /w now. The thing with proportions bothers me from beginning. On the first sketches they were even more narrow. But then I was unable to match the lowercase with them. I'll try make uppercase bit wider. Is there any common connection between capitals and lowercase in terms of proportions? </p>
      <p>Thanks Jan</p>
