    html: |-
      <p>I've bee thinking whole afternoon about the crossbar thing and came up wih two solutions. At first I tried to apply more eccentric style to every crossbar, but there I was tightend with xtrabold cut, so it hasn't moved so much further. Then I made visually centered one. In comparision the eccentric one is more distractious then the normal one. What do you think is better?</p>
      <p><img src="http://jancharvat.cz/projects/type design/own/anje/data/anje crossbar test.png" width="600"><br>
      more text here:<br>
      <a class="freelinking external" href="http://jancharvat.cz/projects/type design/own/anje/data/crossbartest1.jpg" rel="nofollow">http://jancharvat.cz/projects/type design/own/anje/data/crossbartest1.jpg</a><br>
      <a class="freelinking external" href="http://jancharvat.cz/projects/type design/own/anje/data/crossbartest2.jpg" rel="nofollow">http://jancharvat.cz/projects/type design/own/anje/data/crossbartest2.jpg</a></p>
      <p>In the begining there was some idea of making a font it with few differences. After nearly half a year they all dissappeared. Now looking backward I can see they were probably in most cases inappropriate. But I'm bit worried it's falling to ordinary, booring box of fonts...</p>
      <p>Thank you for your time.<br>
      Jan</p>
