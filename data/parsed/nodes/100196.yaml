    html: <p>I agree with Dave, I think a firm and clear decision needs to be made whether the crossbars are to be "normal" or "eccentric." Right now hairline /E/F/H/ look much more stylized than hairline /A/, and also more than any of the corresponding extrabold letters.</p>
