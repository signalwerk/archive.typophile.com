  html: |-
    <p>Einaudi Garamond Pro is the text typeface currently used by Italian publisher Einaudi. Of course, it is a custom typeface, not available to the public. But I really love it!</p>
    <p><a href="http://www.einaudi.it/var/einaudi/contenuto/extra/978880621249PCA.pdf" title="http://www.einaudi.it/var/einaudi/contenuto/extra/978880621249PCA.pdf">http://www.einaudi.it/var/einaudi/contenuto/extra/978880621249PCA.pdf</a></p>
    <p>Can you suggest a commercial typeface similar to this jewel? At the moment the only alternative I know is Simoncini Garamond.</p>
    <p>Thanks<br>
    M.</p>
