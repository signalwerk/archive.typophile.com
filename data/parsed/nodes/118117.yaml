      <p>Manosk, since you can't license Einaudi Garamond, I guess the best commercial version you can have today is the one by Elsner and Flake (named "Garamond Simoncini EF"), which features the old style numerals - but only in the roman weight, not finely spaced and not even OT-supported - and some of the inktraps which were so typical in the original metal version, and which are slightly noticeable in the quick screenshot comparison I made (top: Adobe, bottom: EF):</p>
      <p><a href="https://farm6.staticflickr.com/5565/14714849382_f61a377cb4_o.jpg" title="https://farm6.staticflickr.com/5565/14714849382_f61a377cb4_o.jpg">https://farm6.staticflickr.com/5565/14714849382_f61a377cb4_o.jpg</a></p>
      <p>By the way, what is curious is that the rights to the original typeface designed for Einaudi in 1961 by Francesco Simoncini and Wilhelm Bilz from Ludwig &amp; Mayer (known as "Garamond Antiqua") are owned today by Neufville.</p>
    html_clean: |-
