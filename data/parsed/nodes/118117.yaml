      <p>Even if I narrow my search to "Jannons", the only similar typeface is Simoncini Garamond... Unfortunately SG is a typeface a bit neglected by Adobe/Linotype: no pro, only three weights, limited kerning...</p>
      <p>In fact the usage of Simoncini Garamond (and its many custom versions) as text font is really widespread among Italian book publishers. In Italy it is probably the most successful typeface of the twentieth century, but the only beautiful digital version is, in my opinion, the custom typeface currently used by Einaudi.</p>
