  html: |-
    <p>A legal document has a "cut-and-paste" one name change in management.</p>
    <p>I believe all 15 pages of the original document, prepared in 1983 is in Cambria or Century, Microsoft Word on a PC.</p>
    <p>The inserted name is in a similar font but some capitalized letters look slightly narrower, perhaps done 2009 on a Mac.</p>
    <p>Is anyone interested or technical enough to help analyze this? It's important.</p>
    <p>Contact: <a href="mailto:jhgewalt@gewaltonline.com">jhgewalt@gewaltonline.com</a></p>
