      <p>"f this is a legal matter the court would want to see the original signed document, not a photocopy or new printout."</p>
      <p>I've dealt in a lot of cases like this, and have seen the original available well less than half the time. Forgers are usually smart enough to "not have" the original for one reason or another.</p>
