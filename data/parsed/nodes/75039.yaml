    <p>How was your summer?? What did you do? I did this...</p>
    <p><a href="http://www.google.ca/search?client=firefox-a&amp;rls=org.mozilla%3Aen-US%3Aofficial&amp;channel=s&amp;hl=en&amp;source=hp&amp;q=Colored+Bacon&amp;meta=&amp;btnG=Google+Search" title="http://www.google.ca/search?client=firefox-a&amp;rls=org.mozilla%3Aen-US%3Aofficial&amp;channel=s&amp;hl=en&amp;source=hp&amp;q=Colored+Bacon&amp;meta=&amp;btnG=Google+Search">http://www.google.ca/search?client=firefox-a&amp;rls=org.mozilla%3Aen-US%3Ao...</a></p>
    <p><a href="http://www.google.ca/images?client=firefox-a&amp;rls=org.mozilla:en-US:official&amp;channel=s&amp;hl=en&amp;q=Colored%20Bacon&amp;um=1&amp;ie=UTF-8&amp;source=og&amp;sa=N&amp;tab=wi&amp;biw=1280&amp;bih=860" title="http://www.google.ca/images?client=firefox-a&amp;rls=org.mozilla:en-US:official&amp;channel=s&amp;hl=en&amp;q=Colored%20Bacon&amp;um=1&amp;ie=UTF-8&amp;source=og&amp;sa=N&amp;tab=wi&amp;biw=1280&amp;bih=860">http://www.google.ca/images?client=firefox-a&amp;rls=org.mozilla:en-US:offic...</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ColouredBacon_plateportrait_6118.jpg"></div><p></p>
    <p>I'm the first ever to colour bacon! And in the process I created a bacon colour wheel! Cooks just like ordinary bacon, taste just like plain bacon too, rainbow bacon has arrived :). </p>
    <p>After interviews in NYC, LA, with AOL (the best interview!), BBC, CBC, Toronto Star, etc., and turned down a whole bunch more, I'm just now beginning to recover and look back at the impact I had on bacon nation. Met some really great people, some loves the coloured bacon, some kinda sorta, and some not so much. All-in-all great responses, it's all good, every single last bit of it!</p>
    <p>Oh ya, in the process I also created a little something called bacon-on-a-stick. Two strips of coloured bacon with a white chocolate filling wrapped in white chocolate, all on a popsicle stick!</p>
    <p>Incredible stuff - what a ride.</p>
