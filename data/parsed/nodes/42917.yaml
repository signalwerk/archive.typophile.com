      <p>You’re right, Mike, they belong to the same category — typefaces inspired by lettering found in copper engravings and etchings from the eighteenth century.<br>
      Linotype Nicolas Cochin is a quite faithful revival of Deberny &amp; Peignot’s Cochin family (circa 1912-1914), whereas Bitstream Cochin is based upon a 1917 Monotype recutting (by Sol Hess) of the same face.</p>
