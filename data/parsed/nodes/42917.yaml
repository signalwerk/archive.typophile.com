    date: 2008-03-08T22:05:00
    date_raw: 8.Mar.2008 10.05pm
    votes: null
    html: <p>The Cochin carried by Adobe for years should always have had oldstyle figures but was digitized early on without. The pre-digital version did include oldstyle figures somewhere in its original design program, but OSFs were just blown off in early conversions. Why the license holder can’t go back and fix that, I cannot imagine. Guardi is another Renaissance-feel face that obviously needs oldstyle figures—probably the reason it is not more popular, because otherwise it’s excellent. This is one of the continuing scandals in our field today, something that should be solved as an industry-wide standard, along with the problem of families released without bold and/or bold italic, or families whose fonts cannot be keystroke-linked.</p>
    html_clean: <p>The Cochin carried by Adobe for years should always have had oldstyle figures but was digitized early on without. The pre-digital version did include oldstyle figures somewhere in its original design program, but OSFs were just blown off in early conversions. Why the license holder can’t go back and fix that, I cannot imagine. Guardi is another Renaissance-feel face that obviously needs oldstyle figures—probably the reason it is not more popular, because otherwise it’s excellent. This is one of the continuing scandals in our field today, something that should be solved as an industry-wide standard, along with the problem of families released without bold and/or bold italic, or families whose fonts cannot be keystroke-linked.</p>
