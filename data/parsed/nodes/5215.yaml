  html: '<p>I am using FontLab 4.6 to create versions of existing OpenType fonts. <br>When attempting to generate the font files I am receiving the following error. <br> <br>"ERROR: There was a problem while compiling OpenType font. Final .otf font is not saved. Please, check OpenType features definition for errors". <br> <br>I receive this message even if I make no changes to the font. <br> <br>Thanks</p>'
