    html: <p>Try to generate the font into another folder or with different file name. This happens when you test your fonts - the system sometimes locks the file even if it is not activated.</p>
    html_clean: <p>Try to generate the font into another folder or with different file name. This happens when you test your fonts - the system sometimes locks the file even if it is not activated.</p>
  - id: 37795
    user: 2900
    date: 2004-06-17T03:47:00
    date_raw: 17.Jun.2004 3.47am
    votes: null
    html: "<p>Seth, <br>It happens when you have syntax error in OTF features. It can be virtually everywhere, so it is difficult to guess where it is exactly. But when you try to compile OTF features first, compiling stops on the first line with error and if you know OTF feature syntax, you will easily find it. <br>In my case it is typically missing semicolon at the end of line. <br> <br>I bet you have tried to open an Adobe OTF in FL. There is a problem with frac feature because Adobe uses chaining contextual substitution (GSUB Type 6) like this: <br>sub [zero zero.taboldstyle]' [slash fraction]' [zero zero.taboldstyle]' [zero zero.taboldstyle]' by [perthousand perthousand]; <br>which is (according to my knowledge) wrong (or at least it is not implemented in FL4.6). <br>You can get the same result using GSUB lookup type 4: <br>sub [zero zero.taboldstyle] [slash fraction] [zero zero.taboldstyle] [zero zero.taboldstyle] by perthousand; <br> <br>Hope it helps. <br>Regards, <br>Pavel <br></p>"
