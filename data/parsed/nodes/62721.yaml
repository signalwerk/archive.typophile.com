    <p>Does anyone else have a hard time creating personal work? Well, I do, and I'm still trying to decide what the visual identity of my small art company, which I've had since high school, should look like. I've bounced between numerous hand drawn logos and fonts but I've never felt certain about anything.</p>
    <p>Anyways, here's something I'm working on that seems to fit alright with me. I especially like how I can easily turn this into a stamp for biz cards and what not. </p>
    <p>They are both Ziggurat but I've added cuts into the 2nd one. BTW - I'm trying to go for a playful industrious look that looks modern.</p>
