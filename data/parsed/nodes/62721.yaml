      <p>It's your logo so the debate between the true vector version and the hand drawn will probably have to be solved internally. </p>
      <p>I think you might try out different ways of making the logotype relate to your artist's handiwork. Perhaps show a version that keeps the original outlines but uses the rough ink typically seen in a lot of silkscreen (see image). <a href="http://www.birminghamprintmakers.org/images/silkScreen.jpg" title="http://www.birminghamprintmakers.org/images/silkScreen.jpg">http://www.birminghamprintmakers.org/images/silkScreen.jpg</a></p>
      <p>Personally I thought the tilting of the O was a clever addition, but the space between the R and the O is really bothersome. I think you should try and create a ligature of the two letterforms to bridge that gap.</p>
