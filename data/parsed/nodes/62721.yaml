      <p>Ya that's a good idea Kate! I definitely want it to look playful but not like it belongs on a Fisher Price toy if you get my drift.</p>
      <p>Eggroll Industries is an independent gig I've had since high school. The name comes from my nickname "Eggroll" that my friends gave me a long time ago b/c I'm half asian. I started the company with one of my friends silkscreening and airbrushing skateboards for a lot of people. Then, it evolved to silkscreening tees. Four years later, today, I'm still highly passionate about art but haven't really tried to sell anything. So, I'm designing and developing an online store (I also make websites), that will sell nearly everything I create. If people buy it, awesome, and if not I will still have a massive online portfolio. However, I'm trying to shift from freelance web design to just focusing on my art so the branding it pretty important to me. </p>
