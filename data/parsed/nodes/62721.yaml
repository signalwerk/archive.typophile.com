      <p>I really like the playful/indie style you've got going on, MrKikkoman! Love the name. The traced vector approach looks cool, though I am reminded of an ancient beer brewery or something—but, regardless, it's strong and doesn't take itself too seriously. In your latest sketches, I really dig #3's "R" since it looks like a big grin, and the whole thing is simply imaginative.</p>
      <p>I think, if you're going to try a completely different direction, keep in mind your targeted audience. I don't think you should fuss too much about kerning or other concerns corporate identity work might need to address since this mark you're making is so personal.</p>
