    <p>Qiltray™ font family is good example of how handwritten fonts can be made for using them in long texts. Clear and readable letters are good recommendation to apply Qiltray in any kind of publications. With Cyrilic support also includes CE character set.<br>
    Available, for now, only in Condensed Regular weight.</p>
