    <p>Urgent because if there's not any solution, i would be obliged to choose something else. I'm wanting to use Mayo dingborders (<a href="http://www.fountain.nu/catalogue/mayo.asp" title="http://www.fountain.nu/catalogue/mayo.asp">http://www.fountain.nu/catalogue/mayo.asp</a>) for the subtitles, in a layout, and xpress get me in trouble. Mayo form words into borders and pressing space norùally create a blank border; but in xpress, it does not, putting instead a normal space... is there a solution* to force the log to use the font settings in the mayo formed words ?</p>
    <p>*Other than using Indesign. I would have prefered a lot, but xpress was installed in the computer when i arrived for the job, and the paper is too poor to buy Indesign only to please me and my ideas of opentyped fool titles and good typography.</p>
