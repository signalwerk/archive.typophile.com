    html: <p>Hmm. Have you tried using option-space instead? In most fonts, this is identical to the space, except how it is treated by applications. Some programs assume that the regular space character is blank and only use the width. I'm not sure why. In these cases, the non-breaking space (option-space) may work.</p>
