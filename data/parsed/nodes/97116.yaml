    html: |-
      <p>I searched a few categories at Dafont, with no luck, because I thought it might have had a 'freebie' feel about it. Then I searched through some of the fonts of the lettering artist, the late Bob Alonso, and found <a class="freelinking external" href="http://www.myfonts.com/fonts/bagraphics/alonso-flair/" rel="nofollow">Alonso Flair</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/bagraphics/crescent/" rel="nofollow">Crescent</a>. Neither of these is exactly the same, but they have a similar feeling, I think.</p>
      <p>- Mike Yanega</p>
