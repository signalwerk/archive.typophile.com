      <p>Yes, R. and the font was done by <a class="freelinking external" href="http://www.haroldsfonts.com/crazy.html" rel="nofollow">Harold Lohner</a> based on a typeface by the same name shown in "Modern Display Alphabets" by Paul E. Kennedy (Dover Books, 1974). </p>
      <p>I wonder if Harold meant for this to be a free font?</p>
      <p>- Mike Yanega</p>
