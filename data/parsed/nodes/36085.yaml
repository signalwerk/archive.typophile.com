  votes: null
  html: |-
    <p>Hi, I was wondering if it is possible to fashion a monoline font that does NOT scale in thickness when you change its size. Eg the line thickness of a 24 pt glyph would be the same in 35 or 67 or 128 (etc.). Or, to state it differently: I would like to set the stroke for a whole block of text, independent from the glyph sizes…<br>
    And then some more: I would like to be able to set the stroke in my design applications.<br>
    And to make it even more complicated: how about being able to change the line ends (rounded, square, etc.) as one can in Illustrator, FreeHand, cum suis?</p>
    <p>My reasoning: when mixing type sizes in headlines and subs (using a monoline) the effect (and the ’colour’) would be a lot better if the stroke thicknesses did not scale.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/36032" class="topic-previous" title="Go to previous forum topic">‹ Feijoa gives error in EPS</a> <a href="/node/29008" class="topic-next" title="Go to next forum topic">FontLab "Expand Strokes": parameter missing ›</a></div>
