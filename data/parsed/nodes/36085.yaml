      <p><em>“I was wondering if it is possible to fashion a monoline font that does NOT scale in thickness when you change its size”</em><br>
      It is possible several ways. One would need to know if the font was going to appear as a mathematical monoline or an apparent monoline, an optically scaling mathematical or apparent monoline, and the precise sizes and resolutions required. With this, the best way could be specified.</p>
      <p>Cheers!</p>
