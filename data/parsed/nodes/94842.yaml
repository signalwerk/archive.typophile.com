      <p>Hrant,</p>
      <p>You are close. It IS a Cooper, but not Oz; rather, it is Fred G. Cooper, a predecessor and—AFIK—no relation. Letterer, illustrator and former Art Director for Life Magazine—in case you're interested.</p>
      <p>The other Nick—and there are a lot of them—does not quite "get" the FGC vibe. Okay. Strokes for folks. I even make allowances for Canadians: they are people, too.</p>
      <p>I get Fred. I like Fred. If you do to, check this out…</p>
      <p><a href="http://www.myfonts.com/fonts/nicksfonts/mrs-bathhurst/" title="http://www.myfonts.com/fonts/nicksfonts/mrs-bathhurst/">http://www.myfonts.com/fonts/nicksfonts/mrs-bathhurst/</a></p>
      <p>Dundee Brewing Company liked the typeface so much, they have—at least, in the past—used the typeface for their beer bottle labels. Cool, retro and quite affordable.</p>
      <p>The preceding has been a commercial message by a guy who could use a few extra bucks in the till.</p>
      <p>If you catch my drift…</p>
