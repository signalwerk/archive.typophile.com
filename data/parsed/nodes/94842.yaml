      <p>Nick,</p>
      <p>You do so? I do not recall saying "do not" unequivocally. I distinctly remember saying "does not <em>quite</em>," which gives you some benefit of the doubt. Which, you being Canadian and all, you deserve. Which I mean in a good way. Canadians get multiculturalism, and celebrate diversity as a positive thing. Unlike Americans, who like everything homogenized and pasteurized. Why has worked out SOOO well, don't you think?</p>
      <p>Another brief irony break here…</p>
      <p>So, Nickster: are we cool?</p>
      <p>Anyhow, Leslie Cabarga did a book on Fred G. Cooper, which is well worth reading…if you can get it cheap. Hand-drawn stuff, quite honestly, does vary in quality, but FGC was one wild and crazy guy…once you get to know him.</p>
