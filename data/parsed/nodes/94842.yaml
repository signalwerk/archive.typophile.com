    <p></p><div class="imageWrap"><img src="http://typophile.com/files/FoodPoster_5909.jpg"></div><br>
    Five out of six ain't bad (sorry, I'm a big fan of wheat and meat), but I love this poster. By technical standards the handlettering isn't even very good (the <strong>s</strong>'s are particularly egregious). But the artist had a natural eye for good composition, and rendered the letterforms with a playful energy that invites you to read them, and softens the stern austerity of the message.<p></p>
