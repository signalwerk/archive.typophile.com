  html: |-
    <p>Good day all . . . </p>
    <p>I'm about to buy one of the Palatino Nova packs from Linotype, to be used primarily for history/classics related papers. It will be a Garamond replacement, and hopefully good enough to replace the classical digital version of Palatino.</p>
    <p>I must confess, however, that I have a fondness for the classic Palatino that we've had up until the Nova series. I understand it wasn't quite suitable for modern printing, but I grew up reading that style of Palatino (Linotron) and I've used the font quite happily. But if Palatino Nova is supposed to be what Zapf always intended, then so be it. It looks good and as a lover of Palatino I think I should be using it. And besides, I'm a sucker for beautiful, quality fonts. </p>
    <p>I'm a bit confused, however, when it come to the weights. </p>
    <p>Here, we've got Light and Medium:</p>
    <p><a href="http://www.linotype.com/255812/palatinonova1-valuepack.html" title="http://www.linotype.com/255812/palatinonova1-valuepack.html">http://www.linotype.com/255812/palatinonova1-valuepack.html</a></p>
    <p>Which is the book/Roman face? I've used Palatino Roman, so Im not sure if it resembles the Light variant or the Medium variant.</p>
    <p>To add to the confusion, we have a Regular and Bold here:</p>
    <p><a href="http://www.linotype.com/255812/palatinonova1-valuepack.html" title="http://www.linotype.com/255812/palatinonova1-valuepack.html">http://www.linotype.com/255812/palatinonova1-valuepack.html</a></p>
    <p>I'd appreciate any help. </p>
    <p>Cheers.</p>
