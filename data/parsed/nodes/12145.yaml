    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12157" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Books</a>&nbsp;: Elements of Typographic Style,&nbsp;The</strong></p>
    <p>By <a href="/node/12144" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Robert Bringhurst</a>, published by <a href="/node/12148" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hartley <span class="amp">&amp;</span> Marks</a>. There are many references to typography in English, but there is only one <cite>Elements of Typographic Style</cite>. Less a how-to guide, manual, or textbook than a distillation of several hundred years’ worth of wisdom on the typographer’s craft. No less an authority than <a href="/node/12150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hermann Zapf</a> has proclaimed it as a natural candidate to become “the <a href="/node/12146" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typographer’s Bible</a>”. It encompasses a list of typographic relations analogous to Strunk <span class="amp">&amp;</span> White’s <cite>Elements of Style</cite>, but goes on to outline the basics of humanist book design, and includes a lengthy and valuable overview of classic and useful typefaces (which is as revealing for what it omits as well as what it includes). It also includes several encyclopedic reference sections of special extended Latin and non-Latin characters as well as perhaps the most useful illustrated glossary of typographic terms available. While there is much this book will not teach you, it is an education in itself, and nearly impossible to&nbsp;overvalue.</p>
    <p><strong>Comments on this&nbsp;Title</strong></p>
    <p>Anyone relatively new to typography and eager to learn needs to have a copy of Bringhurst’s Elements… I often say about that book that I wish I’d never read it, so that I could read it again for the first time. It single-handedly exploded my interest in typography. And once you’re done with that book, simply hit the bibliography at the back as a guide to other books to take a look at.<br>
    The thing with Bringhurst is that he does a very good job of outlining what to look for in a font; not just if you “like” it, but what a good font needs to have in its arsenal.<br>
    –Jason&nbsp;Dewinetz</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/28541">The Elements of Typographic&nbsp;Style</a></p>
