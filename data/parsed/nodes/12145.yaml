    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Books" class="freelinking" rel="nofollow">Books</a> : Elements of Typographic Style, The</strong></p>
    <p>By <a href="/wiki/Robert%20Bringhurst" class="freelinking" rel="nofollow">Robert Bringhurst</a>, published by <a href="/wiki/Hartley%20%2526%20Marks" class="freelinking" rel="nofollow">Hartley &amp; Marks</a>. There are many references to typography in English, but there is only one <cite>Elements of Typographic Style</cite>. Less a how-to guide, manual, or textbook than a distillation of several hundred years' worth of wisdom on the typographer's craft. No less an authority than <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a> has proclaimed it as a natural candidate to become "the <a href="/wiki/Typographer%27s%20Bible" class="freelinking" rel="nofollow">Typographer's Bible</a>". It encompasses a list of typographic relations analogous to Strunk &amp; White's <cite>Elements of Style</cite>, but goes on to outline the basics of humanist book design, and includes a lengthy and valuable overview of classic and useful typefaces (which is as revealing for what it omits as well as what it includes). It also includes several encyclopedic reference sections of special extended Latin and non-Latin characters as well as perhaps the most useful illustrated glossary of typographic terms available. While there is much this book will not teach you, it is an education in itself, and nearly impossible to overvalue.</p>
    <p><strong>Comments on this Title</strong></p>
    <p>Anyone relatively new to typography and eager to learn needs to have a copy of Bringhurst’s Elements… I often say about that book that I wish I’d never read it, so that I could read it again for the first time. It single-handedly exploded my interest in typography. And once you’re done with that book, simply hit the bibliography at the back as a guide to other books to take a look at.<br>
    The thing with Bringhurst is that he does a very good job of outlining what to look for in a font; not just if you “like” it, but what a good font needs to have in its arsenal.<br>
    --Jason Dewinetz</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/28541" rel="nofollow">The Elements of Typographic Style</a></p>
