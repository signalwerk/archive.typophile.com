      <p>Hi Patty</p>
      <p>FontCase under Mac OSX 10.5.8. Plenty of options for your own organisation, good interface seems to understand how anal we might be about this kind of thing, and includes customisable options for pangrams and body copy for comparison purposes (I seem to recall that you do a lot of text setting). I bought my copy in 2009, have never looked back, and would recommend it to any other Mac-using typophile. More details <a href="http://www.bohemiancoding.com/fontcase" rel="nofollow">here.</a></p>
