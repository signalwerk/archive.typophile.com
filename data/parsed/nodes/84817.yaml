    html: <p>On a PC, your options are even more limited.  At work I use FontNav, which doesn't even support OpenType, and at home, I just install everything in Windows (7) which might go some way to explaining why my computer keeps crashing all the time!  In terms of organising them, I don't.  I think the best method is to hang around Typophile day in day out until you can recognise every single font ever made, and you'll always have the perfect font for any job stored in your brain ;)</p>
