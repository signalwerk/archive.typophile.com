      <p>If you want to name a font Milo in the privacy of your home, go nuts. But you shouldn't be putting a font out in public with the same name as a published font. Even if it's just a working title. Even if your font is still in development. Leaving aside the legal &amp; trademark issues&nbsp;— this is basic good sportsmanship.</p>
