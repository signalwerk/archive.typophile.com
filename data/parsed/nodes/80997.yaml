    <p>Hello everybody,<br>
    I’m designing a sans-serif and wonder if I might get any input from the pro’s.<br>
    It’s got more or less two weights right now, and you can test it in this typetester here:</p>
    <p><a class="freelinking external" href="http://www.doubletwo.net/MiloTest/Index.html" rel="nofollow">http://www.doubletwo.net/MiloTest/Index.html</a></p>
    <p>I would be very pleased if you got some feedback for me.</p>
    <p>lec</p>
    <p>And please ignore the name "Milo", I know there is a typeface out there with that name. This was the first came into my mind so it’s a kind of workingtitle.</p>
