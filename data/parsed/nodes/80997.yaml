    html: |-
      <p>Good-looking stuff generally. I would definitely have a look again at the /g/ in the black version - considering your carefully-crafted colour correction (maybe on the verge of being too thinned) on the /N/, that ear is way too heavy, and the link feels a bit weak. </p>
      <p>I'd also have another look at the various white sections, again problematic in /g/ but also feeling a bit weird in many other bowled letters in the black. In the /e/, for instance, it looks optically futher left than the tail. In the /b/ and /d/ it feels diagonally leaned.</p>
      <p>One thing you seriously need to go through, in both weights, is the baseline appearance - some letters (notably thin /t/) have too much overhang, while others, like thin /O/, have too little.</p>
