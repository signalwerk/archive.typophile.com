    html: |-
      <p>You can also just write your own custom encodings (= sorting lists) in a text editor.</p>
      <p>Go to Library &gt; Application Support &gt; FontLab &gt; Encoding &gt; and then choose therein one of the existing .enc files to open.<br>
      Rewrite its content and edit the header; you must give a new number and name in the first row.<br>
      This is the beginning of such a file:<br>
      ________<br>
      %%FONTLAB ENCODING: 10029; <strong>MacOS Central Europe</strong><br>
      %%GROUP:Type 1 non-Western (Mac)<br>
      %%Source: FontLab 2005-02-26 codepage release with AGLFN 1.3<br>
      %%Release: 2005-02-26<br>
      %%Changes: notequal -&gt; Dcroat 173<br>
      %%Changes: partialdiff -&gt; dcroat 182<br>
      %<br>
      space 32<br>
      exclam 33<br>
      quotedbl 34<br>
      numbersign 35<br>
      ...<br>
      _  _  _  _</p>
      <p>Note that the part set in Bold here will be the identification line in the glyph sorting menu.<br>
      You can omitt all the %% lines except the first one. You can also omitt the numbers behind the glyph names. In the list, you can insert technical entities like ••• or [–] or whatsoever which you may wish to use as a kind of rubrication (they will show up as glyph cells but you don’t need to furnish them).</p>
      <p>Save the new encoding file under a new name with the .enc suffix. The file must be stored in one of the &gt; Library &gt; Application Support &gt; FontLab &gt; Encoding places so that FL can draw on it.</p>
      <p>Very convenient way, i.m.o.</p>
