    html: |-
      <p>If you switch to Index mode, you can sort them manually via drag and drop.</p>
      <p>Or you can write a Python macro to build an Encoding file following your preferred sorting rules, and then use the menu command Glyph → Sort Glyphs → By Encoding.</p>
