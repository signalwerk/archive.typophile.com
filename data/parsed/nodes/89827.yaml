  html: |-
    <p>Is there a way of organizing glyphs in the font window according to suffix? I just sorted glyphs and all alternate versions of numerals, small caps, etc are now all mixed up and difficult to work with:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/mixed_3964.JPG"></div><p></p>
