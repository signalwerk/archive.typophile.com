      <p>According to <a href="http://www.creativereview.co.uk/cr-blog/2013/november/riposte" title="Click to visit an external URL." class="freelink freelink-external freelink-external">creative director Shaz Madani</a></p>
      <blockquote><p>The title typeface is “a very slight alteration” of Gerard Unger’s <a href="http://www.myfonts.com/fonts/bitstream/amerigo" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Amerigo</a>, which has also been used throughout the first section of the magazine. “We’ve removed some of the curves on the tapered strokes for sharper, more chiseled like serifs… This has been balanced with a softer more friendly sans serif. I love this sans font for all its small quirky imperfections that give it so much personality,”</p></blockquote>
