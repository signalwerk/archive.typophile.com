    html: <p>Looks to me like a synthesis of <a href="http://www.myfonts.com/fonts/linotype/helvetica/bold/testdrive.html?s=OneToughMother&amp;p=48">Helvetica</a> and <a href="http://www.myfonts.com/fonts/ef/fette-gotisch/gotisch-ef-bold/testdrive.html?s=OneToughMother&amp;p=48">Fette Gotisch</a>. Very cleverly done.</p>
