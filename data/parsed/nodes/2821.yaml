    date_raw: null
    votes: null
    html: <p>It's a good idea...I'm not entirely sure it was as well executed as it might have been. <br> <br>I think for titling I'd have created a "Mo" ligature, more like "To". <br> <br>I work a lot with sign making software, and I'm used to the odd lumps and bumps that get created when you combine or weld shapes together. Sometimes they may be geometrically correct, but visually, they've often gotta go. Like the small "blip" top left on the "g" and the small white space mid left on the "M". <br> <br>Like I said, I like the idea, I just think it would have benefited from a bit more polish. <br> <br> <br> <br></p>
