    html: <p>This is fun. Reminds me of Emigre's <a href="http://www.emigre.com/EF.php?fid=180" target="_blank">Fairplex</a> and a bit of Font Bureau's <a href="http://fontbureau.com/fonts/font_frames.tpl?cart=106756109210270117&amp;fontname=meyertwo" target="_blank">Meyer Two</a>.  <br> <br>The 'A' -- the interior apex is too high (for my eyes) <br>The 'M' -- the join is to square and flat. <br> <br>Nice color. I've been wanting a bolder version of Meyer Two.  <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
