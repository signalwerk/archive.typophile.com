    html: <p>Ashton. I'll agree with Grant, I love how much more dressed-up it is. More "painted lady" and less "ghost town". Your 'M' is much better. Could the serif coming out of the 'G' (top) be a little more convex, alluding to the larger convex shapes you now have? I also like the 'R', but would hope for an alternate version that isn't quite as swashy. And the sharp points might be better to have the a tiny flats. NIce!!</p>
