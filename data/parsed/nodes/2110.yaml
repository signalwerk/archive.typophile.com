    html: <p>hmm, Mr Bluett I presume?  ; ) Welcome my friend, <br>your participation is long overdue!  <br> <br>I'm not convinced about the squared "D", it is a little  <br>too symmetrical along the horizontal axis for my taste. <br>The crossbar of your "H" is too high, and I would open <br>up the bowl of the "P" for I find it too square and too <br>small as it stands. Have you tried playing with the  <br>serifs, because they all look cut and pasted, a spot <br>of variation wouldn't go amiss my good man.  <br> <br>What did you think of the vega party? pretty good huh! <br>sigh. no longer a student, just an unemployed designer!  </p>
