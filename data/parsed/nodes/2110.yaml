    html: <p>&gt;<i>The 'A' -- the interior apex is too high (for my eyes)</i> <br>&gt;<i>The 'M' -- the join is to square and flat.</i> <br>  <br>I really don't mind the extended apex, but it probably would work better within the context of the other characters if the treatment were used in other glyph - like the cap M for instance. Changing the angle of the inner slopes of the M to match an inverted A shape might help bring the detail together. <br> <br>Nice start.</p>
