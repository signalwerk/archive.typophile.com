  html: <p>Dr. Peter Karow Award for Font Technology &amp; Digital Typography <br> <br>At the third DTL FontMaster Conference on the 18th of November 2003 in Castle Maurick in the Netherlands, the first Dr. Peter Karow Award for Font Technology &amp; Digital Typography will be presented. This prize will be awarded yearly to people with extraordinary and innovative achievements in the field of font-related technology and consists of a certificate, a facsimile of the 42-line Gutenberg bible and DTL FontMaster for Mac OS and Windows. The first award will be received by Dr. Peter Karow himself. <br> <br>Peter Karow was born as a farmer</p>
  html_clean: <p>Dr. Peter Karow Award for Font Technology &amp; Digital Typography <br> <br>At the third DTL FontMaster Conference on the 18th of November 2003 in Castle Maurick in the Netherlands, the first Dr. Peter Karow Award for Font Technology &amp; Digital Typography will be presented. This prize will be awarded yearly to people with extraordinary and innovative achievements in the field of font-related technology and consists of a certificate, a facsimile of the 42-line Gutenberg bible and DTL FontMaster for Mac OS and Windows. The first award will be received by Dr. Peter Karow himself. <br> <br>Peter Karow was born as a farmer</p>
