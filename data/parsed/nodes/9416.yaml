    html: <p>Windows has a darker default gamma setting (2.2) than Macs (1.8), so middle tones look relatively darker on Windows, relatively lighter on Macs.  <br> <br>This can have noticeable effects on the appearance of antialiasing created for one platform viewed on the other. Windows antialiasing looks washed out when viewed on a Mac, Mac antialiasing looks heavy and blurry when viewed on a Windows machine.</p>
