    html: "<p>&gt; grayscale pixfonting is the way to go. <br> <br>Yyyup. <br>BTW, I recently discovered another advantage of grayscale fonts over b&amp;w pixelfonts: they're more harmonious with the large type renderings in a composition (like titles, logos), which are always anti-aliased. And yeah, they're not horridly blurry - like here: <a href=\"http://www.catalanadetipos.com/\" target=\"_blank\">http://www.catalanadetipos.com/</a> Click on \"Castellano\", choose one of the top two links, and drown in the blur... <br> <br>It's tricky to make them because the TT outlines have to look quite funny for the rendering to actually come out reliably on different platforms, applications, etc. For example between Flash and Photoshop. The Ultrafonts boys have spent a lot of time and brains figuring it out - they even have an automatic converter! Also, you should know that the trick is patented (the problematic prior art issue turned out to be a subset of it). <br> <br>As for your concern of \"just using it once\": <br>- If your client wants exclusivity, he should pay extra for it. <br>- If it's not exclusive, nothing should stop you from using the nice resultant fonts on other projects, or even selling them (probably through Ultrafonts). <br> <br>That said, I don't think any of the existing Ultrafonts will work for you here. But be warned, it's quite hard to get the hang of it. If you need help, and have the budget, I can do it for you. <br> <br>hhp</p>"
    html_clean: "<p>&gt; grayscale pixfonting is the way to go. <br> <br>Yyyup. <br>BTW, I recently discovered another advantage of grayscale fonts over b&amp;w pixelfonts: they're more harmonious with the large type renderings in a composition (like titles, logos), which are always anti-aliased. And yeah, they're not horridly blurry - like here: <a href=\"http://www.catalanadetipos.com/\" target=\"_blank\" class=\"link-external\">http://www.catalanadetipos.com/</a> Click on \"Castellano\", choose one of the top two links, and drown in the blur... <br> <br>It's tricky to make them because the TT outlines have to look quite funny for the rendering to actually come out reliably on different platforms, applications, etc. For example between Flash and Photoshop. The Ultrafonts boys have spent a lot of time and brains figuring it out - they even have an automatic converter! Also, you should know that the trick is patented (the problematic prior art issue turned out to be a subset of it). <br> <br>As for your concern of \"just using it once\": <br>- If your client wants exclusivity, he should pay extra for it. <br>- If it's not exclusive, nothing should stop you from using the nice resultant fonts on other projects, or even selling them (probably through Ultrafonts). <br> <br>That said, I don't think any of the existing Ultrafonts will work for you here. But be warned, it's quite hard to get the hang of it. If you need help, and have the budget, I can do it for you. <br> <br>hhp</p>"
