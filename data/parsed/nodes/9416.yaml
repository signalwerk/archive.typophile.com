    html: <p>hi! <br>- After a few days solid pushing greyscale pixels (I nearly went insane) and lots of testing, I can say that it's a lot easier to design a font from scratch than to try to adapt an existing one. Univers has many very characteristic features, and they are hard to transpose to a 9x6 pixel grid. When I stay too close to the original typeface, the most obvious weaknesses are in fact the typical Univers features. Take them out and keep working, and it becomes an okay-looking grayscale pixel font with absolutely no particular style. Which is actually worth pursuing, I think, but it's not my original idea. I've been studying the optical illusion (or psycho-visual effect... or whatever it could be called) of shading, it's quite fascinating! <br>I use Windows on a high resolution, haven't tried viewing my work on a Mac yet, only on my cellphone, and I'm aware there will be a lot work to find the right shades (I think each font has its own perfect values).</p>
