      <p>is it an option to change the font size for some of the rows? if so, that will help with the consistency (per row) when reading it. another suggestion is to have the lines 'fit' within each other better. right now it looks a bit alphabets soup-ish. there is no flow as your design stands right now. one example that comes to mind that i'm thinking of is a poster designed by paula scher: <a href="http://3.bp.blogspot.com/_uNMNLJmJwfw/TUOgyxRom-I/AAAAAAAABT4/2QrIsvE15b8/s1600/medium_paula_scher_htl.gif" title="http://3.bp.blogspot.com/_uNMNLJmJwfw/TUOgyxRom-I/AAAAAAAABT4/2QrIsvE15b8/s1600/medium_paula_scher_htl.gif">http://3.bp.blogspot.com/_uNMNLJmJwfw/TUOgyxRom-I/AAAAAAAABT4/2QrIsvE15b...</a><br>
      hope these suggestions help a bit. please post what you end up doing. good luck!<br>
      nikki in oh.</p>
