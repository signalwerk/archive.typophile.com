    <p>This is another alice in wonderland related issue, i am trying to make it look like the text has been crammed in on the page, as in the book alice suddenly grows 9 feet high and finds herself getting crammed in the hallway. I am having trouble putting this across digitally, i have been working on something (below) but i dislike it as i feel it's slightly illegible and doesn't really get my point across. I was wondering if anyone can give me some tips on this as i feel that it's looking a bit shitty atm and i have to take this to my lecturer on tues.</p>
    <p><a href="http://s750.photobucket.com/albums/xx145/sl_jones/?action=view&amp;current=Picture10.png" target="_blank" rel="nofollow"><img src="http://i750.photobucket.com/albums/xx145/sl_jones/th_Picture10.png" border="0" alt="Photobucket"></a></p>
