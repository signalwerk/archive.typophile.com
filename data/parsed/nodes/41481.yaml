      <p>Hello Florian,<br>
      well - I own approx. 16 kg of it. Packed 1976 by Sellner, a dealer of used lead letter fonts. They were pros like I am. And if they wrote Sirius, there is a real chance, it is a font called Sirius.</p>
      <p>Yes, I checked (my own) Seeman handbooks (and all others from the big foundries, I have). The only Sirius I could not find an example from was the Berthold one. So I tried to look for an posted print anywhere in the Internet, but I failed.</p>
      <p>Its no beautiful Grotesk. Its heavy, its old and with exception of a full character set I gave it back to lead (melted it again).</p>
      <p>But you know: There are the types... so of course I have to know its name, understand? :)<br>
      A lead font without name, roundry, year of first production AND artist, who designed it, is only some kilo of lead, nothing else. To identify an unknown lead font gives it back zu life...</p>
      <p>Tomorrow I’ll make some pictures of the character set and post it. May be someone has an idea. I thought, Mike Yanega might own an old Berthold font book and he’ld help...</p>
      <p>Georg<br>
      _______________________________________________<br>
      „Ich bin ein Preuße, kennt Ihr meine Farben...“</p>
