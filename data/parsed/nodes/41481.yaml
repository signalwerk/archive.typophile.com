    <p>All what I can say:</p>
    <p>Its a lead type font.<br>
    It is NOT Sirius from Genzsch &amp; Heyse, Schriftguss or J. John.</p>
    <p>It might be Sirius from Berthold (1911), but I do not own a sample.</p>
    <p>Its a Grotesk bold condensed with only capitals, digits and... Punkturen (I don’t know what it means in english, sorry).</p>
    <p>Does someone know, if the Berthold Sirius is a Grotesk condensed type?<br>
    Or does someone have a sample and can upload a quick scan, just to see it once?</p>
    <p>Thanks in advance,</p>
    <p>Georg</p>
