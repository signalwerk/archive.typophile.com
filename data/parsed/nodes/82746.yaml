      <p><a class="freelinking external" href="http://www.lineto.com/" rel="nofollow">Lineto</a> has some grid-based typefaces on offer, for example Alpha Headline, Regular or Replica.<br>
      More regular and legible: <a class="freelinking external" href="http://new.myfonts.com/fonts/fontbureau/stainless/?refby=n" rel="nofollow">Stainless</a>. Personally I like <a class="freelinking external" href="http://new.myfonts.com/fonts/fontbureau/clicker/?refby=n" rel="nofollow">Clicker</a> but that’s less squarish.</p>
