    <p>I am looking for a typeface that is similar to Gridnik, but more rounded. </p>
    <p>It should be clean and legible (using for signage) have the same "feel" of gridnik, but a little softer and more rounded.</p>
    <p>Any recommendations for typefaces that might fit these specs?</p>
    <p>thanks so much!</p>
    <p>:)</p>
