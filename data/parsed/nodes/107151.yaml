    html: |-
      <p>This is the design used in the Random House, New York, first edition of 1974.<br>
      At that time New York publishers often used photo-typositing  fonts from Photo Lettering or one of it's competitors. These were often photo manipulated versions of various fonts.<br>
      Perhaps not digitized. Some checking of the photo lettering catalogs may produce a match. The kind of font that was produced by designers such as Herb Lubalin and Tom Carnese.<br>
      Don</p>
