    <p>I thought this one would be really easy but unfortunately I am a bit lost. I cannot find anyone suitably narrow and the shape of the serifs.</p>
    <p>Best bets: ITC Milano<br>
    Sequoia (not terribly loving it)</p>
    <p>Others I looked at: Caslon Graphique, Carousel, Annlie, Fat Face, Pistilli, FC Didoni.</p>
    <p>Any help is greatly appreciated.</p><div class="imageWrap"><img src="http://typophile.com/files/IMG_5719_4853.jpg"></div><p></p>
