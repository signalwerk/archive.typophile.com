      <p>Thanks Ryuk, for confirming my suspicion that this was a Photo-lettering font delivered to Random House, New York.<br>
      Photo-lettering provided its fonts in a range of widths, including the one used for _Myron_. Apparently only the regular width has been digitized.<br>
      For an exact match to the book cover here is the correct width of Caslon Benguiat:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/CaslonBenguiatCond_4946.jpg"></div><br>
      Bonus:A link for a digital version of Carnase's Milano Roman ITC by BA Graphics<br>
      <a href="http://www.identifont.com/show?2K2" title="http://www.identifont.com/show?2K2">http://www.identifont.com/show?2K2</a><br>
      Don<p></p>
