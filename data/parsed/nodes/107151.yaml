    html: <p>Can't name it either. As you both said, close to <a class="freelinking external" href="http://e-daylight.jp/design/fonts/type/m/milano-roman.html" rel="nofollow">Milano Roman</a> and the work of Tom Carnase. It mixes influences from <a class="freelinking external" href="http://e-daylight.jp/design/fonts/type/t/toms-roman.html" rel="nofollow">Tom's Roman</a> (Carnase's again), <a class="freelinking external" href="http://e-daylight.jp/design/fonts/type/t/trooper-roman.html" rel="nofollow">Trooper Roman</a> and <strong><a class="freelinking external" href="http://www.photolettering.com/" rel="nofollow">PLINC Caslon Benguiat</a></strong>, Benguiat's version of Caslon, digitized by Christian Schwartz and available through House Industries Photo-Lettering catalog (possibly the closest shamelessly squooshing it).</p>
    html_clean: <p>Can't name it either. As you both said, close to <a class="freelinking external link-external" href="http://e-daylight.jp/design/fonts/type/m/milano-roman.html" rel="nofollow">Milano Roman</a> and the work of Tom Carnase. It mixes influences from <a class="freelinking external link-external" href="http://e-daylight.jp/design/fonts/type/t/toms-roman.html" rel="nofollow">Tom's Roman</a> (Carnase's again), <a class="freelinking external link-external" href="http://e-daylight.jp/design/fonts/type/t/trooper-roman.html" rel="nofollow">Trooper Roman</a> and <strong><a class="freelinking external link-external" href="http://www.photolettering.com/" rel="nofollow">PLINC Caslon Benguiat</a></strong>, Benguiat's version of Caslon, digitized by Christian Schwartz and available through House Industries Photo-Lettering catalog (possibly the closest shamelessly squooshing it).</p>
