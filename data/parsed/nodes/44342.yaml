  html: |-
    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 16.Apr.2008 4.42pm </div>
      <p>Ascender Corp announced that Mac users who don’t have Office 2008 for Mac<br>
    now have a source to acquire a legal copy of them:<br>
    <a href="http://www.ascendercorp.com/pr/pr2008_04_17.html" title="http://www.ascendercorp.com/pr/pr2008_04_17.html">http://www.ascendercorp.com/pr/pr2008_04_17.html</a></p>
    <p>Office for Mac 2008 includes the Microsoft ClearType Font Collection - 24<br>
    fonts including Calibri and Cambria. To ensure compatibility between Office<br>
    suites, later this year Microsoft will release an update to Office 2004 for<br>
    Mac with a free license for the fonts for use in Office 2004. But Mac users<br>
    who don’t have Office and want the fonts for use in Corel, QuarkXPress and<br>
    Adobe Creative Suite for design and publishing now have a way to license and<br>
    download them. </p>
    <p>More info on the Microsoft ClearType Fonts can be found here:<br>
    <a href="http://www.ascendercorp.com/ctfonts.html" title="http://www.ascendercorp.com/ctfonts.html">http://www.ascendercorp.com/ctfonts.html</a></p>
