  html: "<p> the lettering below was created for the visual identity project of an economy/administration insitute. the client, which wanted to have a mixed signature of his company (symbol + typography), liked the type so much that decided not to use the symbol. <br> <br>/image{ideagavea.gif} <br> <br>i liked the result a too, and am starting to think about drawing the whole alphabet, just as an exercise. <br> <br>here are some characters that i already sketched: <br> <br>/image{idea.gif} <br> <br>i want to create a version with less weight, a 'normal' version of this 'bold' font. can anyone sugest some literature on this matter - generating differente weights of the same typeface? it would be of great help... <br> <br>thanks in advance, sorry for the not-so-good english... <br> <br>gustavo. </p>"
  html_clean: "<p> the lettering below was created for the visual identity project of an economy/administration insitute. the client, which wanted to have a mixed signature of his company (symbol + typography), liked the type so much that decided not to use the symbol. <br> <br>/image{ideagavea.gif} <br> <br>i liked the result a too, and am starting to think about drawing the whole alphabet, just as an exercise. <br> <br>here are some characters that i already sketched: <br> <br>/image{idea.gif} <br> <br>i want to create a version with less weight, a 'normal' version of this 'bold' font. can anyone sugest some literature on this matter - generating differente weights of the same typeface? it would be of great help... <br> <br>thanks in advance, sorry for the not-so-good english... <br> <br>gustavo. </p>"
