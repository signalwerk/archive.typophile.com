      <p>Thanks for the good questions :-)</p>
      <p>&gt; First off I think you need to explain what image you want to project of yourself</p>
      <p>When i came up my first attempt:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/mallmus-logo5.gif"></div><br>
      I was really going for this fun approach, at the time i was working with a friend but she unfortunately quit :'( the idea was a fun easy-going company that small local bands could approach for their printing and web needs -- I felt this version looked too much like a sun; so i progressed it further into what i have now -- Thoughts?<p></p>
      <p>&gt; What does this wheel symbolise?</p>
      <p>I wanted the wheel to symbolize two things, 1) a speaker or perhaps a drum, my long term goal is to specialize and focus on the music scene, and i thought having something which (i hope) looks related to that would be good. 2) overall the wheel, i feel, appears complete and clean, appealing -- Thoughts?</p>
      <p>&gt;  then a feeling of typeface and mark may present itself from there.</p>
      <p>What does everybody thing of the typeface i decided to use -- to me it has a 'stage-show' feel to it...</p>
