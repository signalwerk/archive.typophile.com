      <p>I find Revue has a dated appearance, then again maybe it is time to revive it like Avant Garde (although this doesn't have the same potential use). The AD ligature is a bit cramped you might want to increase the space between the lines and try to make a smoother transition. The wheel motif reminded me more of a tape sprocket (after I read of your interest in design for musicians), initially I was thinking of automotive design.<br>
      I think you have the basis of a logo but need development to both elements.<br>
      Tim</p>
