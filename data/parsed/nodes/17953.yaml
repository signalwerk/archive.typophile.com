    date_raw: 20 Feb 2006 — 8:11am
    votes: null
    html: <p>Mallmus, the typeface you've chosen looks dated to me. That may be because I'm old enough that it has a historical reference that you may not have. Anyway, style is a tricky thing, and certain typefaces are brought around again in a fresh new way, but this isn't pushing it enough to me. I would really explore some other type options, and think about your "ideal" clients and what will connect with them. If you want to do a lot of work with local bands you have a lot more creative latitude to be more expressive, maybe even have a series of logos. Remember bands are always looking for something that will make them look "cool."</p>
