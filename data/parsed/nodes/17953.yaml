      <p>Your original symbol does resemble an old tape or film sprocket, but until tim mentioned it, I couldn't guess what it was. I just had a feeling that I'd seen it before. You don't want to be too obvious but you don't want people scratching their heads forever trying to figure your logo out. I actually thought it resembled a steering wheel.</p>
      <p>That said, I think the difference in line weight between the outer ring and the inner spokes is too much. They don't have to be the same weight, but right now there is too much contrast and I fear you'll lose the inner detail at smaller sizes.</p>
      <p>It's an okay concept, but I agree with tim about the typeface and the ligature. Nail down your logo before trying to find a typeface.</p>
      <p>As for the other concepts, they don't work.</p>
