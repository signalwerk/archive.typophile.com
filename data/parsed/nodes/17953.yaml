    <p>Hi there,</p>
    <p>I'm new around here, and I've quickly become addicted; the help and suggestions i've been reading seem great! -- I've recently decided to have a crack at doing some freelance work in and around the city i live; I've got a couple of qualifications up my sleeve, one on the computer side of things, the other on the media-publishing. I'm intending on specializing in doing websites, posters and flyers for local bands or the general music scene in the city, but at the moment I'm taking all the jobs that come my way.</p>
    <p>I've been playing around with ideas for my logo, i decided not to use my name for the freelance, but a pseudonym, Mallmus -- I feel the logo is clean, and robust; although perhaps a bit too corporate.</p>
    <p>This is the current logo i've decided to use, but i'd like some feedback, suggestions and criticism:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/mallmus-logo.gif"></div><p></p>
    <p>This is what i call the Mallmus Wheel:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/mallmus-wheel1.gif"></div><p></p>
    <p>And these are other ideas that i played around with, but i decided were not right:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/mallmus-logo1.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/mallmus-logo5.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/mallmus-logo2.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/mallmus-logo3.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/mallmus-logo4.gif"></div><p></p>
