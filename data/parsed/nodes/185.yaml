    html: <p>It's a nice idea, Tiffany, but I think the addition of italic type adds a "third dynamic" - I'm not sure how else to describe it - that weakens the design overall. <br> <br>Even having Grupo and Repolho in different colours threatens to do this, but the larger Repolho in green helps balance the design.  <br> <br>Adriano's original design at the top seems to have the most poise (type choices aside). It reminds me a lot of the BP logo. The business cards are perfect, too, with the olive colour keeping the emphasis on the logo. <br> <br>Paul</p>
