    date_raw: 18 Jun 2003 — 9:21am
    date: 2003-06-18T09:21:00
    votes: null
    html: <p>Hello Adriano, <br> <br>First of all I would like to say I like the logo.  <br>But second I have to say I agree with John Hudson. The logo works for me too much as 'healthy', 'reform', 'nature', etc.  <br>You can use the gag of designing the logo for a mechanical company like that in a very 'nature shop'-kind of way. But if you do that, the typography is very important.  <br>You have to remember that it is a mechanical company. Maybe a straight forward kind of typo is better. Helvetica sounds good to me. <br> <br>Perhaps changing the colour is a help. You could do that for the differtent specialities within the company, thereby creating sub-logos. At least you take the edge of the 'nature-look'. <br> <br>Regards, <br>Ren</p>
