  html: <p>Hi, <br> <br>here's another logo I've been working and will present it to the client next week. This is tricky one. The name of the company is called GRUPO REPOLHO. It's the portuguese name for "cabbage group" where repolho is the family name of the owners. The company is a big group of transportation, construction, machine rental and landscape/nature recovery related. <br> <br>On my first ideas I realized the logo needed a "motion" look like a wheel (machine rental also added this wheel idea). Now the name REPOLHO (cabbage) was also a starting point, altough it's a kind of strange name for a company like this. <br> <br>So the task was to do a cabbage brand that has some motion and that looks cool. I came out with a logo that I personally like a lot, and I'm showing it here for your advises on the type/font i should use along it. <br> <br> <br>1. Here's a photo of a repolho <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">  <br><img src="http://www.typophile.com/forums/messages/29/10990.jpg" alt=""> <br> <br>2. Here's what I got after several sketches.  <br> <br><img src="http://www.typophile.com/forums/messages/29/10991.gif" alt=""> <br> <br>3. A preview on the cards, I'm thinking on having the logo "embossed" on the papper, so the back of the card has the brand on papper with the negative emboss simmulated by the tint color...  <br> <br><img src="http://www.typophile.com/forums/messages/29/10992.gif" alt=""> <br> <br>The font I used is Adobe Myriad Pro which falls under the "Overused fonts". Anyone has a suggestion on a typeface that match the mood of the brand/icon? Thanks in advance.</p>
