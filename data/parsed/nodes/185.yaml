    html: "<p><i>The company is a big group of transportation, construction, machine rental and landscape/nature recovery related.</i> <br> <br>Unless the client really wants to stress the latter aspects of their business, your logo might be a bit too organic looking. Perhaps you could try the same shape only more regularised? Or, perhaps you could provide two versions of the same form, for use by different businesses within the Grupo Repolho: so they could have a more mechanical looking version for their transport and machine rental and a more organic version for use with their more environmental businesses.</p>"
