    html: |-
      <p>You’re definitely being too open. Each DVD player manufacturer will choose whatever typeface they want for their players. Generally it will be a Grotesk like Helvetica, though I’ve seen Arial and Futura used too.</p>
      <p>As for mobile phone OS fonts - they will usually be proprietary to the phone company, e.g. Nokia Sans and its bitmap counterpart designed by Erik Spiekermann.</p>
      <p> - Lex</p>
    html_clean: |-
