    html: |-
      <p>Eben,<br>
      When you write:<br>
      <cite>“Why can’t she be asked to think this question through a bit better?”</cite><br>
      I think you mean:<br>
      “Why can’t she be ARSED to think this question through a bit better?”</p>
      <p>I have heard a few non-English people mistake the UK term “arsed” for the southern English pronunciation of “asked”. It was first brought to my attention when I lived with a Greek man who tried to pick up local expressions.</p>
      <p>So, If she can’t be ARSED - then neither can you, right?</p>
      <p>Arsed is from arse (ass, bottom, buttocks, posterior - whatever)</p>
      <p>“I can’t be arsed” doesn’t actually make much sense but that’s the correct term. It means “I can’t be bothered”, I once heard that it comes from “I can’t be bothered to get up off my arse to ... [whatever]” but I don’t really know and I can’t be arsed to Google it.</p>
