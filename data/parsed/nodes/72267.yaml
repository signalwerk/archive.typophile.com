      <p>This may be an odd suggestion: "Smart Casual" by Scholtz.<br>
      <a href="http://new.myfonts.com/fonts/scholtz/smart-casual/" title="http://new.myfonts.com/fonts/scholtz/smart-casual/">http://new.myfonts.com/fonts/scholtz/smart-casual/</a></p>
      <p>The designer's description is "relaxed elegance," suitable for party invitations and such. But to me, it looks modern yet slightly exotic. The designer often does African-inspired fonts, maybe that's why. It seems to fit no pigeonhole. I bought this on impulse, but haven't yet found the perfect use for it.</p>
