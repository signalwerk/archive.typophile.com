    <p>Hi there,</p>
    <p>I'm looking for a font to use for a design job. The client sells handcrafted designer products, bought from small artisan workshops, family businesses, flea markets, designers and craftsmen around the world. Things like handmade candles, wicker, leather chests, fragrances, etc. Modern versions of very traditional products.</p>
    <p>So, I'm looking for a font to use that is mostly modern, but with a slight hint of something exotic.. something reminiscent of Tintin books, the Orient Express, romantic adventures in far off lands, possibly a bit North African...?</p>
    <p>Sorry if that's pretty vague! Hopefully someone here can help, I've been searching high and low.</p>
    <p>Thanks so much,<br>
    Nick</p>
