      <p>Hello again. The explanatory diagram I mentioned earlier? I've no idea where it is – I may even have been referring to something I saw in Karen Cheng's book (in which case, you will know it already Duncan). But I did come across this on p.154 of Leslie Carbarga's <a href="http://www.logofontandlettering.com/" rel="nofollow">Logo Font and Lettering Bible.</a></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Koch-_capitals_3735.jpg"></div><p></p>
      <p>Rudolf Koch's system for determining proportions, based on quartering a square, for Kabel, c.1926. Maybe not a <em> great</em> typeface, William, but certainly much better than many that came after it.</p>
      <p>There is of course also <a href="http://www.octavo.com/editions/trychf/" rel="nofollow"> Geofroy Tory's Champ Fleury</a> which really goes to show that this is an idea that just won't go away. Book Two is where he describes classical letter proportions one by one. I hear there are misgivings about the digital format material that Octavo is putting out, so I would advise you to get hold of the 1967 Dover facsimile of the original Grolier Club edition of 1927.</p>
