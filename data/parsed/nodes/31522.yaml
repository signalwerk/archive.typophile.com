      <p>The proportions of the classic Roman capitals fall into groups. My memory fails me but generally, I believe it is that there are groupings that most letters fall into (but there was always optical compensation). There were the circular letters or O group. Circular is not meant exactly, much compensation was made. While the D, C, and G, were in the group with the O and Q, they were actually a stroke width narrower (as becomes quite obvious when drawing them). The middle width was the N, H, A, V, and T (later U). The so-called half-width group was the, S, R, P, E, and F--keep in mind that they were neither exactly half nor exactly the same width as the eye was the final arbiter. The wide letter M and W were wider than O but not twice as wide as N. Overlapping two Vs a bit gives you the W and a V with arms gave you the M. Again, this is not micrometer exact measurement. Just as we today optically adjust, so did they--I wonder what the Roman word for overshoot was :-) The capitals I and J were clearly odd balls and pieced from the strokes and partial curves of the rest. The Trajan column letters are not exactly the same width even with the repeated letters. You must admit that those old codgers did one hell of a fine job anyway though!<br>
      The classical proportions (being clear groups of widths) are more often used to describe the difference between early times and more modern times when the width of letters became closer to the same optical width. Modern letters are still not perfect measures since this would make for some ugly type. Even the Bauhaus could not make the crazy things exactly geometrically and god knows they tried.</p>
      <p>ChrisL</p>
