    <p>Can anyone out there tell me if there is someplace (website, book, etc.) that I can find a clear definition and explanation of what Classic Proportions in type are?</p>
    <p>I have a few books that discuss it, but in them the information seems to be spread out in small pieces. I would really like to find a document that explains Classic Proportions visually, verbally and totally.</p>
    <p>Thank you for any help you can provide,</p>
    <p>Duncan</p>
