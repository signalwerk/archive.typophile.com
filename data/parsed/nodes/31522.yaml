      <p><em>The Form of the Book: Essays on the Morality of Good Design</em> by Jan Tschichold has a chapter on exactly the subject that you're looking for.</p>
      <p>There's also light coverage in Robert Bringhurst's <em>Elements of Typographical Style</em>.</p>
      <p>Bringhurst's is not as in-depth as the former, but easier to find. For the Tschichold one, find a good library. I actually talked the library at SUNY New Paltz into aquiring one while I was a student there. I know of a link to the text of the specific chapter that I'm referring to, but I'm not sure if it would be outside of the typophile rules so I won't be posting it. I can imagine that making such content available is against copyright regulations, even if the book is out of print. </p>
      <p>I'm sure you'll get some great recommendations from others as well, these are just two that I've read myself.</p>
