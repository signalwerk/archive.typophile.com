      <p><em>clear definition</em></p>
      <p>1.618, the golden mean.</p>
      <p>I don't know if there are any analytical treatises on this in type design.<br>
      However, I just did some measurements on the cap and lower case "O" in Adobe Garamond, and the relationship between the height of the two is golden, within 1%.</p>
      <p>Claude Garamond would most certainly have used this ratio, but did he calculate it? Probably not, IMHO, as if you're living in a culture where everything of merit follows those proportions, they would be second nature.</p>
