      <p>While I was reading Chris' post I started to realize that the books that I have read and have been reading do explain these proportions, after all. I probably lost the connection due to my reading in small chunks when I can find the time. Really this is why I hope to either find or create some sort of chart that explains these concepts. That way I could refer back to it and have all the information in one place. </p>
      <p>So far I understand:</p>
      <p>That the groupings are general and that optical adjustments by the designers mean that there are/were not so hard and fast that for example one could say, "In all Classic proportioned typefaces the O is a perfect circle."</p>
      <p>Classic Type Proportions generally fall into set groups of widths that are more or less designed around a square. </p>
      <p>Modern Type Proportions are generally designed around a similar optical width.</p>
      <p>The best books I have read so far that have helped my understanding on these styles and proportions are:</p>
      <p><a href="http://www.amazon.com/Designing-Type-Karen-Cheng/dp/0300111509/sr=8-1/qid=1171899789/ref=pd_bbs_sr_1/104-0796813-5734315?ie=UTF8&amp;s=books" rel="nofollow">Designing Type</a><br>
      by Karen Cheng</p>
      <p>and</p>
      <p><a href="http://www.amazon.com/Elements-Typographic-Style-Robert-Bringhurst/dp/0881792063/sr=1-1/qid=1171900026/ref=pd_bbs_1/104-0796813-5734315?ie=UTF8&amp;s=books" rel="nofollow">Elements of Typographic Style</a><br>
      by Robert Bringhurst</p>
      <p>I am really interested in David Hamuel's suggestion of "A Constructed Roman Alphabet." </p>
      <p>While I realize that no great typeface rigorously follows hard lines of geometry I still keep coming back to the ideas of how geometry and type design interact.</p>
