      <p>&gt;the cap and lower case “O” in Adobe Garamond</p>
      <p>One of the difficulties in thinking about 'ideal' proportions is that you can compare the h-ascender to the x-height, the overshoot heights of the O and o, the h ascender to the o overshoot height. So if one of the ratios hits 'golden' exactly,the others won't. </p>
      <p>So in the end, as I suppose Nick would agree, you just have to look and see what you find pleasing in the given design.</p>
      <p>You get a similar issues with text and page blocks.</p>
