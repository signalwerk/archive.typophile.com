    html: <p>I'm constantly surprised to find myself drawn to objects that appear built on the golden section (hence the avatar), from type with ascender-to-x ratios of roughly 1|1.618, to cars, to household items, to people; but perhaps it's just that I've spent too much time with books and thus everything else has been infected. As Bringhurst has suggested, Peter S. Stevens' book <em>Patterns in Nature</em> is an interesting text to have a look at on this front.</p>
