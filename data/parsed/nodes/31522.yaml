      by Karen Cheng</p>
      <p>and</p>
      <p><a href="http://www.amazon.com/Elements-Typographic-Style-Robert-Bringhurst/dp/0881792063/sr=1-1/qid=1171900026/ref=pd_bbs_1/104-0796813-5734315?ie=UTF8&amp;s=books" rel="nofollow" class="link-external">Elements of Typographic Style</a><br>
      by Robert Bringhurst</p>
      <p>I am really interested in David Hamuel's suggestion of "A Constructed Roman Alphabet." </p>
      <p>While I realize that no great typeface rigorously follows hard lines of geometry I still keep coming back to the ideas of how geometry and type design interact.</p>
