      <p>Hi Duncan. The explanatory diagram you are searching for does exist (it's just that at the moment it's in my office on a bookshelf and I can't remember which book it's in...)</p>
      <p>Someone else on typophile is likely to give you an improvement on what I set out here, but briefly; it's all about the respective widths of key characters in the uppercase.</p>
      <p>Classic proportions for typeface designs are those based on Roman inscriptional lettering (eg. <a href="http://www.linotype.com/8565/trajanregular-font.html" rel="nofollow">Trajan</a>)where the uppercase O is oval, the M is slightly wider than the square of its height, and the uppercase N is approximately half of this M width. The 'narrow' letters of the uppercase alphabet E,F,L and S etc. all follow the width of the N.</p>
      <p>The renaissance designers followed this model for proportion in their various Oldstyle/Garalde designs. The proportions were overhauled and rationalised about three centuries later with the arrival of the Modern/Didone proportions in which uppercase O is circular (wider than its predecessors), M is narrower and N is square – having a significant roll-on effect on the proportions of the rest of the uppercase (E,F,L and S all becoming much wider). Its effect was to regularise the widths of the letters.</p>
      <p>In sans serif designs, the early (19thc) grotesques (eg. <a href="http://www.linotype.com/13428/monotypegrotesqueroman-font.html" rel="nofollow">Monotype Grotesque</a>) often vestigally followed Oldstyle proportions, while the later 20thc rationalisations of this style – the neo grotesques (eg. Helvetica, Univers <em>at al</em>) were drawn up to modern proportions.</p>
      <p>Hope this helps.</p>
