      <p>We have had some similar questions before, and I think the answers are usually that they are custom fonts. One suggestion was to simulate this look by adding white stroke to reduce the thinner stems to hairlines. A Bodoni or Didot would be a good starting place.</p>
      <p>- Mike Yanega</p>
