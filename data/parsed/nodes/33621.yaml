      <p>Frederick Goudy's book refers to Bodoni and his students (apparently, he had a famous school of type design), and their involvement in the creation of type used to ptoduce the classic Jewish books.</p>
      <p>Interestingly, the design of the Romm family typeface designs, based upon ancient Sephardic drawings resembled Bodono's unique design style making one wonder who influenced who?</p>
