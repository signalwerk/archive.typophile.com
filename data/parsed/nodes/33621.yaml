    <p>I'm doing a research pape on <a href="/wiki/Giambattista%20Bodoni" class="freelinking" rel="nofollow">Giambattista Bodoni</a>. I was wondering if anyone knows information about him of what tools he used to make his type. Also, more about his life for instance if he had children and other things. I've found a couple pages of info, but I feel like i'm missing a lot of data.</p>
    <p>thank you</p>
