    html: <p>I hope your experience of writing an essay has sparked an interest in Bodoni. If you can its a great experience to visit the Bodoni Museum in Parma italy. You will have to ring to make an appointment and when I went in February last year it was freezing cold as the heating was off. I had the chance to hold Bodoni's punches in my hand (as there were only two of us visiting) and they looked as if they had been cut yesterday.</p>
