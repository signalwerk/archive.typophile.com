      <p>Dave: most of the books about type history, especially the anthologies like Lawson’s <cite>Anatomy of a Typeface</cite> or Updike’s <cite>Printing Types</cite> have informations on Bodoni. Some of them are listed <a href="http://typophile.com/books/typedesign-history" rel="nofollow">here on Typophile</a>, I would recommend to check with your school library if they have any available. </p>
      <p>There’s also a great deal of information available on the man, depending how deep you want to go in your research. Unfortunately most of what I’ve found so far is available only in Italian (but that’s an advantage for me since that’s my first language!). For example, <a href="http://www.aiap.it/libreria.php?ID=335" rel="nofollow">issue #9 of <cite>Progetto Grafico</cite></a>, one of Italy’s leading graphic design journals, has a substantial section about Bodoni’s types and derivative works.</p>
