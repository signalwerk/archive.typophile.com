      <p><em>Typographic Milestones</em> by Allan Haley has a good article on Bodoni and his background. He was married, but I don't recall if he had children or not. </p>
      <p>U&amp;lc also had a Bodoni issue when they released the ITC Bodoni, and the out of print FMR magazine had an article on the Bodoni museum in Parma including pics of his punches and tools. I believe it was just files and gravers like most type cutters of the time.</p>
      <p>George<br>
      I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
