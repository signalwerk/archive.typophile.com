      <p>I'm pretty certain it stands for 'publishing' as the C in a circle stands for Copyright.  I'm not sure what you mean by the question as to whether it caught on.  I've done a fair few CD designs (including my own latest album recently) and I've always included this symbol, and I'm sure nearly all my CDs have this symbol, so I'm surprised you haven't seen it.</p>
      <p>JH</p>
