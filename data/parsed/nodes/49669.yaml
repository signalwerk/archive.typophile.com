  html: <p>A few years ago, the <a href="http://en.wikipedia.org/wiki/Sound_recording_copyright_symbol" rel="nofollow">Sound recording copyright symbol</a> or Phonogram symbol wormed its way into our hearts or at least into Unicode 2117. Did ℗ catch on? I've never seen a single ℗ in use yet I keep makin' em . . . like a ℗ machine pounding out ℗ after ℗, week after week.</p>
  html_clean: <p>A few years ago, the <a href="http://en.wikipedia.org/wiki/Sound_recording_copyright_symbol" rel="nofollow" class="link-external">Sound recording copyright symbol</a> or Phonogram symbol wormed its way into our hearts or at least into Unicode 2117. Did ℗ catch on? I've never seen a single ℗ in use yet I keep makin' em . . . like a ℗ machine pounding out ℗ after ℗, week after week.</p>
