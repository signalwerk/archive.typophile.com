    html: |-
      <p>I guess so. It does have some cachet with designers who don't have a lot of formal typographic background and like the "neutrality" of the grotesque genre. Also they may prefer it as being "the neutral sans for left-brain PC users", if they identify Helvetica as being the Mac/right brain equivalent</p>
      <p>However, isn't it also true that a lot of sales of Arial are for purposes of corporate standardisation, to fill out peripheral sectors of a business' licensing requirements, where Arial is not available bundled, although it has become the corporate face due to being bundled for the business' core requirements? That too would constitute a "get it because we have to" scenario, rather than "get it because we like and prefer it".</p>
      <p>Further on the Helvetica Clone/Spot the Difference meme: the same exercise could be carried out with a lot of faces, eg Frutiger and Myriad, with similar effect for the lay person. </p>
      <p>IMO Robin Nicholas' design of Arial is informed by the Grotesque genre in general, and what most draws it into direct comparison with Helvetica is the fact that it has the same (or very similar?) metrics; and Akzidenz Grotesk is not so well known.</p>
      <p>As has been pointed out at Typophile before, Arial looks a bit ropey at display sizes: any plans for an Arial Next, Allan?</p>
