    html: |-
      <p>It's common, not popular.<br>
      "Popular" implies an element of attraction and appreciation, but Arial is merely the default sans serif, having been bundled by Microsoft.</p>
      <p>Arial is not a clone of Helvetica, in fact Helvetica is a much closer derivation of Akzidenz Grotesk.</p>
