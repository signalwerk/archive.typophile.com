    <p>Hello everybody,<br>
    I’m a design student from Potsdam (Germany). Currently I am working on a research project about Arial and it would be great to hear some expert opinions about this strange typeface.<br>
    I have already read <a class="freelinking external" href="http://www.ms-studio.com/articles.html" rel="nofollow">this</a> great article by Mark Simonson. It would be very nice if some of the typedesigners in this forum could help me and write a few words. Thank you!</p>
    <p>Regards,<br>
    Georg</p>
    <p>p.s.: Please excuse my bad english.</p>
