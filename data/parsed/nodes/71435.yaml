    html: <p>One of the good aspects of Microsoft's ambition for world domination is their shop which produces fonts for every script in the world, and the fullest sets of characters. So whatever you think of Arial—and personally I agree with Mark—it has a mind-blowingly complete set of glyphs and compatible forms in other scripts. Perhaps in competition, though, Linotype now has a World version of Helvetica.</p>
