    <p>We are giving away full commercial licences of Adelle Bold absolutely free. All you need to do is sending us samples of your work where our typefaces are used. In addition to getting Adelle Bold in return, we will handpick and publish some of the projects in our Type In Use section, crediting the designer and linking to his or her website.</p>
