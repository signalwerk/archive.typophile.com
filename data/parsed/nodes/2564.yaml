    html: <p>If I may be more precise, the one on the bottom is Clearface Gothic. This reminded me of a recent fascinating <a href="http://www.typophile.com/forums/messages/83/21890.html" target="_blank">thread involving Phil Martin's Agenda</a>, which was a Clearface Gothic spinoff/enhancement, but I don't think it's the answer to this post. <br> <br>After consulting with the Sans Serif ID Guide I came up with <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdisplay&amp;packagefontid=0&amp;displayfontid=FF.10269.4.13&amp;view=single&amp;searchID=0&amp;searchby=keyword&amp;searchletter=A&amp;searchstr=Dax&amp;totalrecords=105&amp;startrow=1&amp;records=20&amp;currpage=1" target="_blank">FF Dax</a>, which I think is your mystery font.</p>
