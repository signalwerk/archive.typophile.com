    <p>hello</p>
    <p>for reasons unkown, my client wants to replace the typeface <strong>just</strong> on the word "THE" to a script face. I am not all too familiar with using scripts in the first place, but pairing one with a condensed sans serif seems, well, impossible. Any thoughts or examples would be greatly appreciated, especially in these early morning hours.</p>
    <p>best,<br>
    B</p>
