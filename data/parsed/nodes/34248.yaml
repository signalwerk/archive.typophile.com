    html: |-
      <p>This is just an idea, and there's a million different script fonts out there to check out (I used <a href="http://www.p22.com/ihof/imperialscript.html" rel="nofollow">P22's Imperial Script</a>). I'm guessing they're looking for a design like this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/thehil_5258.gif"></div><p></p>
      <p>Also be wary of the stair-step effect you get when copy/pasting to create that 3D Block Shadow on The Hil. If you aren't aware, check out Leslie Cabarga's "Logo, Font &amp; Lettering Bible" page 181 will show you how to get rid of that effect. Plus he describes how to achieve a plethora of 3D effects.</p>
    html_clean: |-
