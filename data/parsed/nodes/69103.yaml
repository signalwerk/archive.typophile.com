  html: <p>Hi, I am new to typophile but I do have an issue that has been killing me. I am designing a typeface almost ready to be screen printed. However, the letter "S" has been killing me! Any tips, tricks, or some sort of dark magic to conjure a good "S." Any sort of help would be neat-oh.</p>
