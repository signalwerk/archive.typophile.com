    html: "<p>I'm in a time crunch, so I'll just jot some bullet-point ideas. I'm sure you've got most of this already, but here it goes: <br> <br>- Concrete poets <br>- Bauhaus <br>- Dadaists <br>- Comics <br>- Maps <br>- Advertising <br> <br>I realize these are very general, but they come to mind for me when you speak about word and image. Really, this relationship is one of the pillars of graphic design. Fundamentally, they all center around the mutability of words and images, the contrast of image and verbal communication/meaning, words as images, images as language, etc. <br> <br>Also, for some weighty academic flourish, <a href=\"http://www.popcultures.com/theorists/derrida.html\">Jaques Derrida</a> is probably someone that should at least be given a nod (particularly from the 'word' perspective). At least that's what I've heard...</p>"
