    html: <p>The running joke back when I went to high school was that this was a symbol for Roubles. On the keyboards of Yamaha computers we had in a computer lab the symbol sat between $, £ and ¥, so it implied it was a currency sign. And since the lab together with the high school was in Russia, it was only natural to assign the symbol to the Roubles :-)</p>
