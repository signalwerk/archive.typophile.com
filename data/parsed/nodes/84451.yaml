    html: <p>Not really Klavika-like but I once tried <a href="http://new.myfonts.com/fonts/fontfont/good/?refby=i">FF Good</a> for Cyrillic. Also there is <a href="https://www.fontfont.com/fonts/sero/">FF Sero</a>, or <a href="http://new.myfonts.com/fonts/samuelstype/maya-samuels-pro/?refby=i">Maya Samuels</a>, <a href="http://new.myfonts.com/fonts/aviation/autobahn-pro/?refby=i">Autobahn</a> or <a href="http://new.myfonts.com/fonts/parachute/pf-square-sans-pro/?refby=i">PF Square Sans</a>. Probably <a href="http://new.myfonts.com/fonts/parachute/pf-din-display-pro/?refby=i">PF DIN Display</a> comes closest but you can browse yourself by <a href="http://new.myfonts.com/search/text%3Acyrillic+text%3Asans+text%3Asquarish/fonts/?refby=i">searching for</a> “cyrillic” and “sans” (plus other tags like “squarish” on MyFonts for example.</p>
    html_clean: <p>Not really Klavika-like but I once tried <a href="http://new.myfonts.com/fonts/fontfont/good/?refby=i" class="link-external">FF Good</a> for Cyrillic. Also there is <a href="https://www.fontfont.com/fonts/sero/" class="link-external">FF Sero</a>, or <a href="http://new.myfonts.com/fonts/samuelstype/maya-samuels-pro/?refby=i" class="link-external">Maya Samuels</a>, <a href="http://new.myfonts.com/fonts/aviation/autobahn-pro/?refby=i" class="link-external">Autobahn</a> or <a href="http://new.myfonts.com/fonts/parachute/pf-square-sans-pro/?refby=i" class="link-external">PF Square Sans</a>. Probably <a href="http://new.myfonts.com/fonts/parachute/pf-din-display-pro/?refby=i" class="link-external">PF DIN Display</a> comes closest but you can browse yourself by <a href="http://new.myfonts.com/search/text%3Acyrillic+text%3Asans+text%3Asquarish/fonts/?refby=i" class="link-external">searching for</a> “cyrillic” and “sans” (plus other tags like “squarish” on MyFonts for example.</p>
