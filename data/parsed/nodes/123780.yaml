      <p>Thanks, donsho! I don't know how I skipped over Clarendon — somehow I tried Century and didn't make that jump to Clarendon.</p>
      <p>Erasmus has a nice optimistic stoicism to it with the angled terminals.</p>
      <p>Bookman always feels like the 70s to me, but maybe that's just the outsize influence of the ITC version.</p>
      <p>Globe Gothic is a good thought, but I dunno, the digitized version looks so...digital.</p>
      <p>Anyway, thanks for all the help, y'all! We're hoping to send this thing into production next week and you've helped me get there. Look for it soon in your local purveyor of smart, funny gifts for smart, funny people.</p>
