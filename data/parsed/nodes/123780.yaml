      <p>Or you could simply use a typeface that suggests reliability, integrity and stability, such as Clarendon Text <a href="https://www.myfonts.com/fonts/canadatype/clarendon-text/">https://www.myfonts.com/fonts/canadatype/clarendon-text/</a><br>
      This would contrast with the swirly thoughts in the sky impression conveyed by your lettering.<br>
      Don</p>
