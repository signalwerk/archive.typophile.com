    <p>Hi folks,</p>
    <p>I made this piece of lettering, and I need a typeface pairing for the captions. I've been using Bodoni MT Black for its rational construction and stroke contrast, but my boss thinks it's too high-contrast, and also wants me to try some lowercase.</p>
    <p>Any suggestions? Note that this will be 21" wide.</p>
    <p><a href="http://imgur.com/QCTvqJJ" rel="nofollow"><img src="http://i.imgur.com/QCTvqJJ.png"></a></p>
