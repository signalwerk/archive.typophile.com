      <p>One option would be to echo your Tuscan terminals in a restrained low contrast text typeface such as Zilvertype <a href="http://www.myfonts.com/fonts/canadatype/zilvertype-pro/">http://www.myfonts.com/fonts/canadatype/zilvertype-pro/</a> or Erasmus <a href="http://www.myfonts.com/fonts/redrooster/erasmus-rr/">http://www.myfonts.com/fonts/redrooster/erasmus-rr/</a><br>
      More fonts with similar semi-Tuscan treatment <a href="http://typophile.com/node/119951">http://typophile.com/node/119951</a><br>
      Don</p>
