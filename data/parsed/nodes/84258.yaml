    <p><strong>Monotype Imaging Announces the Rotis II Sans Typeface Family</strong></p>
    <p><strong>New Addition to Fonts.com Extends the Versatility of the Classic Rotis Design</strong></p>
    <p>Monotype Imaging Holdings Inc., a leading global provider of text imaging solutions, has released new fonts that expand the Rotis® suite of typefaces, one of the company's best-selling designs. The <a class="freelinking external" href="http://www.fonts.com/findfonts/searchresults.htm?kid=Rotis+II+Sans" rel="nofollow">14-font Rotis II Sans family</a>, the latest addition to the Monotype® collection and available from <a class="freelinking external" href="http://www.fonts.com" rel="nofollow">Fonts.com</a>, introduces improvements that extend the versatility of the original Rotis design. </p>
    <p>Created by Robin Nicholas, head of typography at Monotype Imaging's U.K. office, and typeface designer, Alice Savoie, Rotis II Sans imbues the aesthetic quality of the initial Rotis fonts, designed by the late Otl Aicher of Germany and released in 1988. With Rotis II Sans, the classic look of Rotis extends into new weights and enhancements, such as the addition of case-sensitive punctuation marks and a new set of numerals. </p>
    <p>"Robin and Alice have brought Rotis into the 21st century," said Allan Haley, director of words and letters at Monotype Imaging. "Rotis became popular soon after its introduction, and it's still chosen for a wide variety of works including books, magazines, newspapers, labels, posters, packaging, billboards and signage. Over the years, graphic designers have asked for more Rotis weights, especially in the sans serif range. Rotis II Sans answers this request, while bringing the design to a whole new level." </p>
    <p>The original Rotis family was one of the first to employ matching subfamilies, which included Rotis Sans Serif, Rotis Semi Sans, Rotis Semi Serif and Rotis Serif. All share common weights, heights and proportions, enabling graphic communicators to leverage built-in consistency when combining Rotis fonts. However, today Rotis can be seen as falling short when compared to the diversity of new family releases, which often include additional characters, a wider range of weights and corresponding italics.<br>
    "Each weight of Rotis II Sans includes matching italics. This improvement alone extends the versatility of the design," said Nicholas. He and Savoie also optimized the outlines of the original typefaces, made subtle adjustments to the proportions of several characters, added new characters and modified overall spacing and kerning — all reflected in the Rotis II Sans family. </p>
    <p>Rotis II Sans comprises seven weights ranging from light to black, each with a companion italic. The fonts are available as OpenType® Pro fonts, which include typographic features such as the ability to automatically insert ligatures and alternate characters. Pro fonts offer an extended character set to support most Central European and many Eastern European languages. </p>
    <p><strong>Availability</strong><br>
    The newest additions to the Rotis suite of typefaces may be purchased and downloaded from <a href="http://www.fonts.com" title="www.fonts.com">www.fonts.com</a>, <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a> and <a href="http://www.itcfonts.com" title="www.itcfonts.com">www.itcfonts.com</a>. In addition, the new fonts are available as Web fonts for webpage design at Fonts.com Web Fonts.<br>
    Customers may contact Monotype Imaging in the U.S. toll-free at 800-424-8973 or in Europe at 44-1737-765959 (U.K.). Linotype may be reached at 49-6172-484-418 (Germany). Customers from other parts of the world may dial 1-781-970-6020 (U.S.). </p>
    <p><strong>About the Monotype typeface library</strong><br>
    Established more than a century ago and influenced by British design, Monotype is a Monotype Imaging brand that represents classic, high-quality typefaces for brand managers, publishers and content creators. Many of the world's most widely used typefaces are part of the Monotype library, including the Arial®, Times New Roman® and Bembo® families. Today, typefaces are continuously released into the Monotype collection from some of the world's most talented type designers. In addition, the Monotype Studio design team has created typefaces for global brands such as Barclays, British Airways and Dyson. </p>
    <p><strong>About Monotype Imaging</strong><br>
    Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, navigation devices, digital cameras, e-book readers, digital televisions, set-top boxes and consumer appliances. The company also provides printer drivers and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 14,000 typefaces from the Monotype, Linotype® and ITC® typeface libraries — home to some of the world's most widely used designs, including the Times New Roman, Helvetica® and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
    <p>Monotype and Rotis are trademarks of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Arial, Times New Roman and Bembo are trademarks of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain other jurisdictions. Linotype is a trademark of Linotype GmbH registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Helvetica is a trademark of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. ITC is a trademark of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic is a trademark of International Typeface Corp. and may be registered in certain jurisdictions. OpenType is either a registered trademark or trademark of Microsoft Corp. in the U.S. and/or other countries. All other trademarks are the property of their respective owners. ©2011 Monotype Imaging Holdings Inc. All rights reserved.</p>
