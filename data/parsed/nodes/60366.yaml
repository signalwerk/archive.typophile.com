      <p>It's similar to Futura Display / Tasse.</p>
      <p>Mark Simonson recently released a <a href="http://ms-studio.com/FontSales/refrigeratordeluxe.html" target="_blank" rel="nofollow">Deluxe version</a> of his Refrigerator font with some alternates that could get you close to this (use the 'W' upside-down as the 'M').</p>
