      <p>Joe, this is not some long-lost typeface you've rescued from oblivion.<br>
      It doesn't need research and a "definitive article" to have its worth attested -- it's a very obvious part of Toronto's graphic heritage, one that any Toronto resident remotely interested in typography can't help but be aware of and impressed by.<br>
      Designers often notice these things, you know, without prompting by writers! </p>
      <p>I have a great deal of respect for your advocacy in trying to preserve the integrity of the TTC design, and like you am appalled by the piecemeal liberties that have been taken to "update" the design of parts of the transit system.</p>
      <p>However, whether the type system is corrupted or not, a large amount of the original signage remains, and this is typographically relevant and a suitable subject for a type design project, with or without your contribution. Making "found" lettering into typefaces is a commonplace for type designers. For instance, I was greatly inspired by the old lettering on the downtown Toronto post office (now the Air Canada Centre), in the design of Fontesque. I have considered publishing a version of the TTC typeface in the past, for example, as something for the goody bag at Typecon 2002. And there is Gotham, which I also didn't mention in my original post, but which was quite instrumental in shaping my ideas for this project: font with lower case to match cap industrial signage. </p>
      <p>Jonathan Hoefler's notes on his revival of the Fell types, when he showed that there are several ways to interpret a revival, and Oz Cooper's demonstration of different ways to overdo the revival of an Incunabula face, have both reinforced my interest in the multiplicity of possible revivals/interpretations.</p>
      <p>I was also looking to move away from the type design courses I have taught in the past, where the emphasis I felt had been too much on individual expression. So you see, there are many reasons I came up with this project, none of which have anything to do with a certain pundit.</p>
      <p>Certainly, you are responsible for publishing the original drawings online, but I didn't actually tell my students those drawings existed, and I had never seen them. I had wondered whether any of them would work from the signage directly (rubbings, drawings, or photos), or go to the TTC offices and find source material, but thanks to the Internet and Google, they discovered the scans of the original drawings online, and so they all took the straightforward route and worked from those. I didn't have a problem with that, although I would have been extremely impressed if someone had worked more immediately from the image in the wall tiles, trying to capture some of the quality of that medium.</p>
