      <p><em>Were they instructed to start with an existing typeface or did they naturally find that to be the most accessible entry point?</em></p>
      <p>They were instructed to digitize the upper case exactly, then design a matching lower case that adopted the same formal vocabulary as the capitals. Despite such strict constraints, there was still plenty of room for interpretation, for instance in the the choice of x-height. I think they did a pretty good job of keeping things "geometric", with the exception of one who just had to have a grotesque "a".</p>
      <p>So in this respect, it's a similar idea to Gotham, with "given" capitals and a lower case up for grabs.</p>
