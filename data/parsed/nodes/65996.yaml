    <p>Last year I taught a one-semester course in type design at Humber College in Toronto, as part of the Graphic Design Advanced Diploma (GDA 3-year). Four hours a week in class, plus homework.</p>
    <p>The project I gave students was to make a TTC (Toronto Transit Commission) font.</p>
    <p>Background: In the 1950s, Toronto built a subway system, with comprehensively modernist architecture. As part of the program, a geometric, all-cap typeface was designed (anonymously), for use in signage.</p>
    <p>The course began with digitizing the original drawings, to introduce the technicalities of font production in FontLab, and then proceeded with students producing their own designs for a matching lower case.</p>
    <p><a href="//www.shinntype.com/TTC_Fonts_09.pdf" rel="nofollow">Here</a> are the results.</p>
