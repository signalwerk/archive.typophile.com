    html: <p>Wow, I didn't know the Whitney Sans had been released. Where was I when this was announced?  <br> <br>I first noticed Whitney when Matthew Carter selected it for his Critic's Award in the first <i>Critique</i> competition back in 1998. I was under the impression that it was created for the Whitney under the auspices of the Font Bureau, so I'm a little curious that Tobias is now able to release it through H&amp;F-J. <br> <br>-- K. <br></p>
