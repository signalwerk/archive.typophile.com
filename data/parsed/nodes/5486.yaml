  html: <p>Just curious, but what are everyone's impressions of  <a href="http://www.typography.com/catalog/whitney/" target="_blank">Whitney</a> by Hoefler and company? I've been eyeing the face since they recently announced availability, and from what I can tell it seems like a very clean, versatile face that could offer a refreshing (though not entirely different) break from Meta, Fago, Avenir, and other similar faces. But is it distinctive enough? I'm considering getting the basic / small caps families and was curious what others thought.</p>
  html_clean: <p>Just curious, but what are everyone's impressions of  <a href="http://www.typography.com/catalog/whitney/" target="_blank" class="link-external">Whitney</a> by Hoefler and company? I've been eyeing the face since they recently announced availability, and from what I can tell it seems like a very clean, versatile face that could offer a refreshing (though not entirely different) break from Meta, Fago, Avenir, and other similar faces. But is it distinctive enough? I'm considering getting the basic / small caps families and was curious what others thought.</p>
