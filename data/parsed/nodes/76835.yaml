    html: |-
      <p>The Archimedes palimpsest is something different, as the vertical direction was erased, not meant to be read. Parchment was expensive, and they figured, this old stuff is not as important as another prayer book. So they scratched off the letters on an old parchment, rebound it at right angles and re-used it to write something else, in this case a prayer book. In 1908 a scholar figured out that the scraped-off letters were the only surviving manuscript of Archimedes' original account of how he made his discoveries. It is mind-blowingly brilliant and innovative, and probably the greatest discovery in history of science. Now, with infra-red photography, I think they are able to read the whole thing.</p>
      <p>Michael: great idea. I have a feeling we are going to see some more of these from you—at least I hope so!</p>
