    html: <p>They don't seem to mention it there, but postage fees were the reason for this. You can see the stamp on that first sheet. Back in those days postage was very expensive and was charged per sheet sent. So that method of bi-directional writing was developed to reduce what, at that time, was a significant expense.</p>
