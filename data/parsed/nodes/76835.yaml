      <p>Thank you guys very much. There are 4 of them, with clock works stuck in the middle of them. I did a series of over 20 clocks in the early part of the decade. These 4 were some of my favorites, simple, lots of texture, fun and they seemed to get past the usual reaction of: oh, they are only letters.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/time_4753.png"></div><p></p>
      <p>If they weren't so anemic they would probably make great tiles.</p>
      <p>This one is called time and the previous was Alphabet.</p>
