  html: |-
    <p>I've made some updates to Impallari's Font Testing Page.</p>
    <p>Mainly changed the header style, labels on/off, color chooser.</p>
    <p>I'm not quite done but you can fork my version here: <a href="https://github.com/andreaslarsen/Font-Testing-Page" title="https://github.com/andreaslarsen/Font-Testing-Page">https://github.com/andreaslarsen/Font-Testing-Page</a> (it's the theme-chooser branch) and run it in localhost with "cd" to the folder and then "php -S localhost:8000" in terminal.</p>
    <p>I'm afraid I need to rewrite a lot of the styling to make it perfect (currently grey + dark background doesn't look good when saved as pdf) but let me know what you think and it me with other ideas/suggestions.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/1_3760.png"></div><br>
