    html: <p>Nice font. <br>I agree with Paul about the angled serifs, they need to be thicker for the smaller sizes. When I look at "t" at small size the serif and the crossbar seem too close. Less angle as Paul suggested? <br>I love the "ch" ligature. <br> <br>The uppercase "G" could use a more rounded botom to meet the stem. (like the lower case "g") That would keep uniformity. <br> <br>Can you set some copy in small size? PDF? I just want to see how the serifs work. <br> <br>very nice face overall. ;) <br> <br>Bren <br> <br> <br> <br> <br></p>
