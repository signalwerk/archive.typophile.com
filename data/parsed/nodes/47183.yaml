    html: <p>I don't think it's very old. It's part of a logo for a local rock products company. I'm not sure how long they've been around. I have a hard time believing a company like that would have custom lettering in their logo, but I guess anything is possible. I ended up redrawing the letters using the sample above, and I used Palatino Bold for the subcopy.</p>
