    <p>Hi! </p>
    <p>I'm trying to find the ID/name/designer of this typeface. Honestly, I'm a bit unsure of weather or not it even exists outside of this context, or if it was costumed for this LP, considering the odd combo of lowercase and small caps, and seeing as this image is the only source i can find on it?</p>
