  html: |-
    <p><a href="/wiki/Gudrun%20Zapf%20von%20Hesse" class="freelinking" rel="nofollow">Gudrun Zapf von Hesse</a> designed the Diotima type family for <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a> during the late 1940s and early 1950s.</p>
    <p><a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a> set their wedding invitation in this face, instead of in <a href="/wiki/Palatino" class="freelinking" rel="nofollow">Palatino</a>. What more could attest to its inherent quality?</p>
    <p>A digital version of the face is available today from <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>. Click here to see <a href="http://www.linotype.com/335/diotima-family.html" rel="nofollow">all of the Diotima weights on the Linotype website</a>.</p>
    <p>Zapf von Hesse designed wo sets of titling capitals to harmonize with Diotima: <a href="http://www.linotype.com/54/ariadne-family.html" rel="nofollow">Ariadne Initials</a> and <a href="http://www.linotype.com/1485/smaragd-family.html" rel="nofollow">Smaragd</a>.</p>
