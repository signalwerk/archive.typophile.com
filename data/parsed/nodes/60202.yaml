  html: |-
    <p>Greater Alion Typefounders has just released it's next family of faces.  Gildersleeve evokes the spirit of the Arts and Crafts movement of the 1920s. Think of a hand-cut Roman display face, with loving care lavished over each serif and letterform.</p>
    <p>Gildersleeve is offerered in the classic combination of a regular face, a bold face, an italic and an italic bold. Any of them are ideal for poster or cover work, as well as for chapter and section headings in a longer document, in combination with a text face such as Vertrina or Clementhorpe Text.</p>
    <p>You can see some examples of Gildersleeve in use on our <a class="freelinking external" href="http://gatf.wordpress.com "> blog</a>, or try it out for yourself at <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/gildersleeve/overview.html "> Myfonts.com</a>.</p>
    <p>In the meantime, here's an example of Gildersleeve in action:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Gildersleeve_Gallery4_3432.png"></div><p></p>
