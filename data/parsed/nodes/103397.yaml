    <p>Hello,</p>
    <p>I'm designing a font family of nine weights and when I try it on MS Word here comes the problem. I know MS Word isn't the best typographic program but there are some people that use it and deserve quality on fonts.<br>
    The problem happen only in the thinnest style and consist in the following:</p>
    <p><img src="/sites/default/files/old-images/Problema Alianza Slab 100_5543.png"></p>
    <p>As you can see in small sizes the MS Word expand the character shapes and the real proportions aren't showed.</p>
    <p>If anybody can help me I apreciate it very much.</p>
    <p>Thank you in advance,</p>
    <p>Manuel</p>
