    html: |-
      <p>DIN could be used as a substitute but others are closer. Note DIN has spurred _G_, _W_ has vertex that goes to top not half way etc. Trump Soft Pro <a href="http://www.myfonts.com/fonts/canadatype/trump-soft-pro/" title="http://www.myfonts.com/fonts/canadatype/trump-soft-pro/">http://www.myfonts.com/fonts/canadatype/trump-soft-pro/</a>  is closer but is still not a match.<br>
      Another similar Van Condensed Light <a href="http://www.myfonts.com/fonts/rsantos/van-condensed/" title="http://www.myfonts.com/fonts/rsantos/van-condensed/">http://www.myfonts.com/fonts/rsantos/van-condensed/</a><br>
      Don<br>
      Might be a Westjet corporate font.<br>
      Don</p>
