      <p>Thanks for the info and comments.</p>
      <p>"Most people would not notice the difference if you used Ostrich Sans"</p>
      <p>I often cannot tell subtle differences between fonts. Here I can. WestJet has less artifice and is more graceful than Ostrich Sans, the TA kerning notwithstanding.</p>
      <p>But if I needed a font in that style, I might consider Ostrich Sans if nothing closer showed up. Thanks again.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/untitled2_4125.jpg"></div><p></p>
