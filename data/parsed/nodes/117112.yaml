      <div class="comment-spam-body"><p>Most people would not notice the difference if you used Ostrich Sans<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/OstrichSansSM_3457.jpg"></div><br>
      <a href="https://www.theleagueofmoveabletype.com/ostrich-sans" title="https://www.theleagueofmoveabletype.com/ostrich-sans">https://www.theleagueofmoveabletype.com/ostrich-sans</a><br>
      Drop the vertex on _W_ by narrowing the letter, lower the center stroke on E and tinker with the _S_ and you have a pretty good match. Even has the same rounded ends.<br>
      Don<p></p>
      </div>
