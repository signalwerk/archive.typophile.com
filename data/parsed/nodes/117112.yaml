      <p>I note that the strokes of these letters come together in an animated video <a href="http://www.youtube.com/watch?v=mAiXnVjNrYY" title="http://www.youtube.com/watch?v=mAiXnVjNrYY">http://www.youtube.com/watch?v=mAiXnVjNrYY</a><br>
      Makes me wonder if this is actually a font or animated artwork.<br>
      However, if a font exists it would be interesting to see some more letters.<br>
      WestJet makes a big splash about how it listens to its customers. I wonder how they would respond to a request asking how the video was made? Perhaps the video maker would be happy to share information on the font used, or the fact that it was not a font, with a curious viewer.<br>
      Don</p>
