      <p>Adobe Hebrew does not support cantillation, only vocalisation.</p>
      <p>The current release version of SBL Hebrew does not include Latin characters, only Hebrew. The next version (v2.00) will include Latin characters from the SBL BibLit to provide accurate codepage support. But depending on the style of Latin you are looking for and the kind of relationship to the Hebrew, you might be able to find a good companion font for the current version of SBL Hebrew.</p>
