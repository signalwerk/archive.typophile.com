      <p>Actually $5K is quite cheap if the font really does what gohebrew says it does.</p>
      <p>Fontbit's Livorna trop was developed for me for a project that I started some years ago and is near completion (not for Koren). The collisions have to be handled though with external scripts (latest incarnation is harbs' glyph mover).</p>
      <p>Masterfont can sell you Koren Tanakh Bold with correct nikud positioning (well correct according to me :-) ) which handles 99% of situations, but due to limitations in Volt, there will still be the occasional tweaking. But the price is in the same range as gohebrew.</p>
      <p>Sorry folks, but these kind of fonts are very expensive for commercial use, but I must reiterate, DavkaWriter does a very good job and is a small fraction of the price, but is a different target audience to those with a budget of $5K for a typeface.</p>
