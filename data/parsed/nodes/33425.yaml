      <p>Raphael: <em>SBL Hebrew is also a direction, but for a refined eye on trop, it's not really the answer, but this depends on the use.</em></p>
      <p>I'd be interested to know what you consider the shortcomings or limitations of appropriate use of SBL Hebrew to be. I am aware of some problems with spacing of adjacent letters with multiple dots, which is not optimised in the current versions of the font. I started work on a different approach to these situations, but have not had time to pursue it.</p>
      <p>In general terms, SBL Hebrew seeks to provide mark positioning that corresponds to expectations of scholars working with various editions of the masoretic text, in particular those based on the Leningrad Codex (the German Bible Society BHK and BHS, and Professor Dotan's BHL). I've also cross-referenced with the JPS Tanakh.</p>
