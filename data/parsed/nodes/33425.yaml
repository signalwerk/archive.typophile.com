      <p>It depends to what level of positioning of Hebrew diacritics that you want. </p>
      <p>The best suggestion that has been made is actually DavkaWriter. It exports pdf and there should be no problem with commercial printers (from my experience).</p>
      <p>Obviously if you want a much higher level of typography, then it's not going to be cheap or easy. Even the Koren typeface is only 99% automatic (VOLT couldn't compile any more code) and you'll need extra software for that 1% (we had some created for in-house use and is in alpha).</p>
      <p>SBL Hebrew is also a direction, but for a refined eye on trop, it's not really the answer, but this depends on the use.</p>
      <p>Fontworld has made some progress, but from their website images, the positioning is no better than SBL Hebrew (not that this is a bad thing, but it's at that level).</p>
      <p>The best solutions are customised I'm afraid and not just out of the box.</p>
