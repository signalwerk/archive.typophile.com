      <p>J.Hudson, Let me clearify.<br>
      2 basic problems with your positioning.</p>
      <p>A. the diacritics should always be in place and the Taam after it, only when absolutly necessary you move back or forth the nikud so the nikud and taam work.</p>
      <p>B. Nikud and teamim are secondary, you should never insert thin spaces or wide spaces to solve dibukim. doing so results devision of word in to two words.</p>
      <p>C. also your basic positioning of single nikud or single taam are ton accurate in some cases.</p>
      <p>D. Taam Mukdam should come befor the letter and not alligned to the right of the letter, but that is less important</p>
      <p>C. PATAH GANUV should be optional and not forced. </p>
      <p>E. the font does not destinguish between holam male and haser.</p>
      <p>Comments A&amp;B are my main critiques on the SBL_Hebrew font.</p>
