      <p>&gt;not more commercial fonts including hebrew. </p>
      <p>There are tons of commercial Hebrew fonts. As I said there are many fonts from MasterFont, FontBit, and indivivual designers like David Hamuel and John Hudson. Also sets of fonts, both Hebrew and Latin that come with both Davka Writer and Dagesh. What is harder to come by is those fonts that do not just nikud (vowel points) but also the cantillation marks. Since this is only used in Bible texts, it is more specialized. However, Davka Writer and Dagesh both have the capacity to put in cantillation marks. </p>
      <p>As to what Latin to match to what Hebrew, that is more or less a creative decision you will have to make. </p>
      <p>Also I am not clear when you say 'recite' Bible texts whether you meant 'chant' using cantillation marks, as I had supposed, or simply read out phonetically, in which case just the vowel points (nikud) will do, and many Hebrew fonts have these. MasterFonts, for example, has 50 opoen type fonts that they say will perfectly place Nikud. John Hudson's and David Hamuel's fonts will also do this very well.</p>
