      <p>Thanks for the comments re. SBL Hebrew, Eli. These are useful criticisms.</p>
      <p>I expect some differences of practice based on different user communities: SBL Hebrew was primarily made for scholars who are either Christians or otherwise working within an academic tradition that has certain expectations based on previous editions and typography (BHK, BHS, etc.), and I do see more movement of vowel+accent combinations as units in that than in Jewish publications.</p>
      <p>With regard to some specific points:</p>
      <p><em>B. Nikud and teamim are secondary, you should never insert thin spaces or wide spaces to solve dibukim. doing so results devision of word in to two words.</em></p>
      <p>The method used to avoid mark collisions in the current release versions of SBL Hebrew is indeed crude, and I've never been very happy with it. I've started work on a more refined approach, involving more precise contextual kerning adjustments. In cases where, for instance, two narrow letters both have marks below and these crows each other, what would you consider the preferred solution?</p>
      <p><em>C. PATAH GANUV should be optional and not forced.</em></p>
      <p>It is active by default in the OpenType lookups, but can be turned off by selectively disabling the Contextual Alternates OTL feature in e.g. InDesign. There's no way to turn this off in Microsoft apps, but since this typographic feature is standard in the texts the SBL users are most commonly working with, it is expected to be on by default.</p>
      <p><em>E. the font does not destinguish between holam male and haser.</em></p>
      <p>It does. See page 16 of the <a href="http://www.sbl-site.org/Fonts/SBLHebrewUserManual1.5x.pdf">SBL Hebrew user manual</a>.</p>
