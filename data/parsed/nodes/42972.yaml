  - id: 264696
    user: 19493
    date: 2008-03-09T10:20:00
    date_raw: 9.Mar.2008 10.20am
    votes: null
    html: <p>It looks like those OpenType files are direct (automatic maybe?) conversions of&nbsp;Type1 families, in&nbsp;which experts sets were often named incorrectly for technical limitations and basic styles/weights were also named that way for consistency in&nbsp;font list. Try to look at those fonts in&nbsp;Font Book or&nbsp;other font manager which will give you extended info about names etc.</p>
