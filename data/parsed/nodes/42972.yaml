  html: |-
    <p>So I’m having this issue, where I just installed a typeface, but instead of every weight being nested within one typeface family, every weight has it’s own name within the character menu of both indesign, and illustrator. The result is I end up having a long list of fonts from the same typeface instead of just the family name, so it gets all mucked up, and I want it to be organized correctly. I took a screenshot of what I’m talking about.</p>
    <p>So does anyone have a solution to this problem, or is there any software out there that can fix it?</p><div class="imageWrap"><img src="/web/20080706083746im_/http://www.typophile.com/files/myproblem_6641.jpg"></div><p></p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20080706083746/http://www.typophile.com/node/43270" class="topic-previous" title="Go to previous forum topic">‹ FL5 Class kerning pop-up grey always?</a> <a href="/web/20080706083746/http://www.typophile.com/node/43101" class="topic-next" title="Go to next forum topic">How do I shake the blues? (in FontLab) ›</a></div>
