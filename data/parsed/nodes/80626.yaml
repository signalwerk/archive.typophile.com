    html: |-
      <p>Nycgraphiste,</p>
      <p>without a high-level font editor such as FontLab Studio, it can be quite tricky. Especially with OpenType PS (.otf) fonts which rely on the compression of the CFF table through subroutines. </p>
      <p>It's possible, using the FontTools/TTX Python toolkit, but it requires quite a lot of low-level knowledge of the OpenType font format. </p>
      <p>One solution might be to try compiling FontForge as a Python module (which unfortunately I haven't been able to do on a Linux server), and/or use the UFO/GLIF format to exchange the glyph data. </p>
      <p>It's not trivial. But yes, it can be done.</p>
