      <p>Thanks, but that's not what I was asking about. I guess, I wasn't clear. I'm not talking about replacing glyphs via Fontlab. </p>
      <p>I want to be able to replace specific glyphs in already generated OTF from a different OTF that are in the same folder for example. I know that if I apply a script I can change f f l to a ligature ffl in one particular font. But is it possible to control a font with a script from within a different font,.. being able to replace, let's say, a lowercase "g" from one font with another "g" from a different font? I hope this explains. Thanks.</p>
