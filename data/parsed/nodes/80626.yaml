    <p>Hi everybody, I have a question. I know I can replace glyphs in the same OpenType font. </p>
    <p>However, is it possible to replace glyphs in one OpenType font to glyphs from another OpenType font. Is there a python script available for that? Or is there some other way to achieve that? Thank you in advance.</p>
