    html: |-
      <p>Twardoch,</p>
      <p>I meant doing it in Fontlab Studio. So how is it possible to do it via FS? Is it rather complicated or not to attach such a script to a font that would work on other fonts, because I'm not an advanced (or intermediate) scripter?</p>
      <p>The issue here is that there is a specific OpenType font created for a particular brand. The concept is to use different fonts (in publication materials) alongside the custom font but some of the glyphs (characters in the brand name) will always be replaced with the corresponding glyphs from that custom font. Cheers.</p>
