      <p>It’s very impressive. It reminds me of the feelies that Infocom used to include with their games.</p>
      <p>I don’t know enough about 19th century Russian pamphlet and business card printing to discuss any anachronisms, but I did notice that on your business card you have “von Habsburg,” while in your case file it says “von Hapsburg.” Also, on the business card, I thought that “von” was spaced too far from “Habsburg.” To me it looks like:<br>
      Dr. Heinrich von _ Habsburg [underscore added because Typophile was automatically removing the extra space].</p>
      <p>edit: It also says “Sain Petersburg,” which I assume should be “Saint Petersburg?”</p>
