    html: <p>I’m seeing some anachronistic typefaces—Times New Roman (1930s), Palatino (1950s), Adobe Garamond (1990s). More appropriate to the 19th century would be something like Monotype Modern or Nick Shinn’s new Scotch Modern, or perhaps Ronaldson. However, I don’t know if any of these would be appropriate for Cyrillic for that period. Apart from that, the designs are beautiful.</p>
