      <p>Thank you for the kind works and wonderful critiques.</p>
      <p>Justin:<br>
      1.Habsburg is certainly misspelled, though I’d probably let it stay as the catalog is meant to be written rather sloppily (as indicated by the amount of corrections already in place)<br>
      2.I’ve no idea how I’ve missed that extra space though.<br>
      3.Sain Petersburg is just sloppy, thanks for pointing it out, my eyes just glanced over it for some reason.</p>
      <p>Mark:<br>
      1. I agree on the type choices, although I reasoned that using modern revivals of historic faces would be a pretty minor offense. I might rethink my choices once I get a few fonts that are more appropriate (if I can convince some clients to get them for their projects first :))<br>
      2. The choice of Palatino was a bit forced as it’s the only thing I currently have that has extended Cyrillic support for outdated letters as well as a good range of Latin ones.<br>
      3. Did I use Times NR somewhere?</p>
      <p>Katharina:<br>
      1 The funny thing is, I had a Capital F there originally, but then somehow became convinced it should’ve been a lowercase one. I’ll get that fixed.</p>
      <p>Viktor:<br>
      1. I need to have a recognizable depiction of the fools tower as part of the plot, a clue to the underlying mystery. I agree that it might warrant a redrawing though.<br>
      2. Thanks for the tip about the address!<br>
      3. 1866 actually fits quite nicely.<br>
      4. That G wouldn’t be a problem if the top line was actually a cliche, as these scripty things often tended to be. Just a regular type-height block shaped like an L, extending to the base of the second line.</p>
      <p>Jelmar:<br>
      /bows</p>
      <p>BTW The display type on the cover was my first attempt at type design. I think the inexperience shows, although these sort of graphics were often somewhat wonky.</p>
      <p>Thanks again everyone, I might post some improvements and a few new pieces as things develop. Though I still haven’t the foggiest what is it all for.<br>
      _____________________________________________<br>
      Personal Art and Design Portal of Ivan Gulkov<br>
      <a href="http://www.ivangdesign.com" title="www.ivangdesign.com">www.ivangdesign.com</a></p>
