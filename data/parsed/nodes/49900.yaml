    html: |-
      <p>nice project. looks like fun!</p>
      <p>some notes on the business card:<br>
      the illustration with those black shadows smells like late 20th century.<br>
      and besides, would a doctor have a picture of the hospital he is working at on his business card? i’m not sure, but i don’t think so.<br>
      would he have titles – in addition to his academic grade – written on the card?<br>
      you bet!<br>
      what was Habsburg’s position at the hospital? the card would certainly tell that.<br>
      also, the address is very minimalistic. no Klinik, Station, Ambulanz or Abteilung?</p>
      <p>the “1090 Wien” tells us that the card was not printed before the late 1960s when four-digit postal codes were introduced in Austria. (before that it would have been “Wien IX”)</p>
      <p>and: Währinger Gürtel is the location of the New General Hospital (Allgemeines Krankenhaus), built during the 1970s:<br>
      </p><div class="imageWrap"><img src="/files/AKH-Bild_4273.jpg"></div><br>
      the Narrenturm depicted on the card is located near the corner Spitalgasse/Sensengasse. as a psychiatric clinic it was in use until 1866. later it served as a museum.<p></p>
