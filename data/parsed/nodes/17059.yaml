    html: |-
      <p>This is a known issue which is <a href="http://www.adobe.com/type/browser/OTReadMe.html#Anchor-WindowsIssues" target="_blank" rel="nofollow">documented here</a>, scroll down to the section <em>Fonts do not map correctly in documents transferred from Mac OS to Windows</em>. (Thank you Miguel!)<br>
      The problem is that Mac and Windows Word documents are not really cross-platform compatible when it comes to identifying fonts. The Mac version identifies fonts by name ID18/Mac if present, else by name ID4/Mac, while the Windows version identifies fonts by name ID1/Win.<br>
      I would consider this as a bug in Word. At least, the developers didn't care for document exchange from Mac to Windows. Smart applications identify fonts by name ID6.</p>
      <p>For font developers:</p>
      <p>With larger font families, this can be (partially) worked around -- see Thomas Phinney's TypoTechnica <a href="http://blogs.adobe.com/typblography/typotechnica2007/Font%20names.pdf" rel="nofollow">presentation on font naming (PDF)</a>, page 15.*<br>
      But <em>even then</em> a Word for Mac user needs to select only the base font of a style-linked sub-family from the font pulldown menu and then apply Bold/Italic buttons. With some luck, fonts are recognized when opening the document in Word for Windows. If, instead, a Word for Mac user selects italic etc styles from the font pulldown menu <em>directly</em>, most likely (s)he will get Courier when opening the document in Word for Windows ...</p>
      <p>* Unfortunately, I was not aware of <em>how</em> important ID18/Mac is in style-linked families until yesterday when Bas Jacobs told me that something must be wrong with my Font Naming PDF. In a future update I will point out that<br>
      [1] name ID18/Mac should be present in larger, style-linked families<br>
      [2] name ID18/Mac should be identical with name ID1/Win in the base font ('Regular' style) of each sub-family (identified by a common name ID1/Win).<br>
      (Thanks to Thomas for clarifying this in his above-mentioned presentation!)</p>
      <p>Translating name IDs to FLS5 FontInfo tags:<br>
      <em>name ID1/Win</em> -- 'Family Name'<br>
      <em>name ID4/Mac</em> -- 'Full Name'<br>
      <em>name ID6</em> -- 'PS Font Name'<br>
      <em>name ID18/Mac</em> -- 'Mac Name' in 'OpenType-specific names' page, below of 'OT Family Name' and 'OT Style Name'</p>
      <p>Karsten</p>
