      <p>Hello Thomas, I tested in OSX 10.3 and 10.4:<br>
      Identification is still by name ID18 if present, else by name ID4/Mac.<br>
      10.5 not tested.</p>
      <p>[DISCLAIMER: JUST MUSING!] Couldn't we just forget about name ID18 and, by default, create name ID4/Mac by the rules that apply to name ID18, i.e. abbreviate this name if required? This because <em>if</em> name ID18 is present, then ID4/Mac is ignored by applications anyway. Such an abbreviated name ID4/Mac may even go into the CFF table's FullName since this too seems to be ignored. But this also means that then name ID4/Mac rather than name ID18 must meet the condition that it be identical with name ID1/Win in each base font.</p>
