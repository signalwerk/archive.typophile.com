      <p>It may actually be even worse than this - name ID 18 was used prior to OS X, but I gather OS X apps are largely no longer using it and instead use name ID 4 Mac, meaning that there's no reasonable way to get consistent cross-platform menu name mapping AFAICT.  :(  At least, if my understanding is correct this is so.</p>
      <p>If Windows were to move to using name IDs 16 and 17 then we could manage it, but I wouldn't hold my breath for that.</p>
      <p>T</p>
