    <p>Hi,</p>
    <p>I created an OpenType font using FontLab Studio on MacOSX. I'm using the ccmp OT class to create composite characters such as "uni004B1D420313" composed of glyphs from U+004B, U+1D42 and U+0313. On OSX with TextEdit the characters compose properly and everything looks OK. When I install the font on WinXP, and use Word 2003, the characters don't appear to compose properly. I was using the 'insert symbol' dialog in Word to enter the glyphs. Some characters, such as a Ccaron, will compose...but I don't believe it's based upon the ccmp code and rather something related to UniScribe. Do I need to install another bit of software on Windows?</p>
    <p>Again, I'm pretty new to this and still reading the big book on Unicode.</p>
    <p>Thanks for any insight...</p>
