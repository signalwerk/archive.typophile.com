      <p>I solved my problem of odd behaviors with some diacriticals (for instance U+004D U+0323) by creating a composite with a codepoint of 1E42. However, have I made things worse by doing this? I'm trying to understand whether it is better to have all of the composite characters as non-codepoint composites...for instance uni004D0323...or have them point to a Unicode codepoint such as Mdotbelow. </p>
      <p>The follow-on question is for subsequent characters, such as U+0043 U+030C U+0313, should I create an intermediate codepoint of 010C or use a composite of uni0043030C with no codepoint? What I've currently done is create a ccmp 'sub Ccaron commaabove by uni0043030C0313'. The alternative would be 'sub uni0043030C commaabove by uni0043030C0313'.</p>
      <p>Hope I've phrased this right...I'm a novice and still trying to understand UniCode and OpenType. What I want to ensure is the best solution for spell-checking that is cross-platform. If I understand what you're explaining, then UniScribe will decompose a compsite and enter the codepoints for the separate glyphs. Does this happen in MacOSX? If not...it might seem better to not use codepoint composites as decompisition does not occur on the Mac and will support better cross-platform compatibility.</p>
      <p>Thanks,</p>
