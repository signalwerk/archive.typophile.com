      <p>[I'm a bit confused by your example, because U+0313 is a combining comma above, not a caroncomb]</p>
      <p>Test your keyboard in NotePad. Word has some key combinations hard coded as hotkeys, so will not accept character input from them. You may also find that RichEdit apps gets confused if you enter characters that are part of an 8-bit codepage but your font does not support that codepage: the app may switch fonts on your during inputting, which is extremely annoying. NotePad will give you a better indication of whether your keyboard layout is working.</p>
      <p>NotePad will also indicate what Uniscribe is doing, without the layers of application API decision making that Word imposes.</p>
      <p>If your font contains an encoded precomposed diacritic character such as U+010C, Uniscribe will make a character level substitution for U+0043 + U+030C, because this is the canonical decomposition for the former. It is faster for Uniscribe to do this at the character level than to process glyph processing lookups in the font. If, for some reason, you didn't want U+0043 + U+030C to result in the glyph encoded at U+010C, e.g. because you wanted to always use GPOS mark positioning, you would actually need to decompose U+010C -&gt; U+0043 + U+030C in the ccmp feature.</p>
    html_clean: |-
