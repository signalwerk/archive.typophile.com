      <p>I agree with hrant that the crosshair in the O has possibilities, although I'd try reversing it out (white crosshair in a solid black O).  It needs to be fairly bold; in a couple of your crosshair layouts the crosshair seems way too small. A circular O might indeed work better if you try this approach.</p>
      <p>Another approach might be to create a separate logo symbol, rather than using a typographic logo.</p>
