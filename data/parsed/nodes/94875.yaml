      <p>I know you didn't like the suggestion of a stopwatch, but I just want to mention that a stopwatch doesn't say precision to me. Exercise generally isn't about doing something in a precise unit of time (unless it's a race).</p>
      <p>A more appropriate graphic to me would be a target. Yes it's a cliche, but perhaps there's a way to suggest it in a subtle way. Another thing that suggests precision is a grid.</p>
      <p>Also your tag line is too small and light for situations where the logo is reproduced small (which is how logos are sized in most uses).</p>
