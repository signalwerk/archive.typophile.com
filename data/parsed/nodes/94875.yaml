      <p>I think you should focus on the middle "I" and leave the other one alone (unless highlighting the word "ON" somehow makes sense, in which case I'd stylize the righthand one and leave the middle one alone).</p>
      <p>I like the "I" that looks like a one, although that's more of a destination thing and not a journey thing. I also like the colon approach, especially since it would lend itself very well to animation (in case you might ever go there) but it's not enough of an "I"... Maybe make the dots much taller (or cut dots out of an "I"). I think the "Oh" with the cross could work, but might be much better with a totally circular "Oh". I like the one with the middle "I" slanted, because besides implying motion it also makes it look like a formula, like something that needs to be balanced for optimal performance.</p>
      <p>BTW, I'm not so sure about your "S" - it might need more polish to make the spine look right. And you might check out the "S" in Pill Gothic*, at least for inspiration.</p>
      <p>* <a href="http://www.myfonts.com/fonts/betatype/pill-gothic/" title="http://www.myfonts.com/fonts/betatype/pill-gothic/">http://www.myfonts.com/fonts/betatype/pill-gothic/</a></p>
      <p>hhp</p>
