    <p>Hi everyone!</p>
    <p>I'm new here and was looking for some feedback on the logo I'm working on at the moment. I have hit a wall and I'm no longer sure I'm on the right track. Hang it to dry please! Need some perspective here :)<br>
    Have a look here <a href="http://www.behance.net/gallery/PRECISION-feedback-seeking-%29/4577977" title="http://www.behance.net/gallery/PRECISION-feedback-seeking-%29/4577977">http://www.behance.net/gallery/PRECISION-feedback-seeking-%29/4577977</a></p>
    <p>About me, as is rude not to introduce myself, I'm a graphic designer living and working in London UK but I'm from Madrid. I work in the fashion industry at the moment and to keep the juices flowing I get to do some side projects in my spare time. </p>
    <p>Any comments welcome and much appreciated!</p>
