      <p><cite>Frankly it sounds like you might be too concerned with appearing sophisticated to other designers, at the expense of finding a logo that will actually bring customers to your client... I say this because I see it happen all the time - but hopefully I'm wrong in this case.</cite></p>
      <p>@hhp<br>
      Ouch! That hurt!!! :-) ! I don't care much about being or appearing sophisticated to others designers or not,  but if that was the case it's something unconscious.<br>
      What I dislike about the stopwatch is giving more importance to the goal than to the process that leads you to the goal, something my client is all about. I will probably give it a go though, just to play with the idea as I discarded it from the beginning and may be i shouldn't have, "try everything" is a good way to go. And I will try that typeface you recommend although I don't really like it, but again "try everything, there's nothing to lose!"<br>
      What I like about the font is that is solid, the narrowness, the fact that is constructed with very straight strokes appearing quite strict but softened with nice round angles. It has quite a presence without being too heavy on the eye. Hope this makes a bit of sense :)</p>
      <p>@HVB<br>
      I see..he he he! In many ways exercise is physical therapy, isn't it?<br>
      My client is mostly concerned about the corners being interpreted as "cutting corners" which as a Spaniard is an expression I haven't ingrained in my brain so it doesn't pop as that but I understand his view and wanted to have more english speakers' opinions.<br>
      @JamesM<br>
      I agree that a stopwatch is not as much about precision as it is about goals and the client is more keen in emphasizing the journey opposed to the destination if that makes sense. That's why i didn't play with that idea although it obviously came to mind.<br>
      I sketched the target and also showed a blueprint-like logo and another one built on a grid. All of them rejected. This one was chosen and that's where I get stuck as there isn't a very solid idea or concept behind it. I will upload my sketches maybe there is a way of developing one of them further and I can propose something else.<br>
      I'll have a look at the tagline, I printed it with 1cm height for the whole thing and it was readable, I'll doublecheck that again.</p>
      <p>Thanks to all of you for your very useful ideas &amp; comments, all taken onboard. I have a few things to try now so I don't feel as stuck. Please keep commenting!<br>
      Irene</p>
