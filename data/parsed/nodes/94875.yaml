      <p>Frankly it sounds like you might be too concerned with appearing sophisticated to other designers, at the expense of finding a logo that will actually bring customers to your client... I say this because I see it happen all the time - but hopefully I'm wrong in this case.</p>
      <p>Of course you don't want something like a big honking stopwatch illustration in there - it's all about subtly evoking an idea... but there has to be an idea there (not just abstract graphical manipulation) and an idea that the potential customers can related to. The only people interested in trying to read the obscure thoughts of a graphic designer are other graphic designers. And they're not exactly your client's target demographic.  :-)</p>
      <p>The font: what do you like about it?</p>
      <p>hhp</p>
