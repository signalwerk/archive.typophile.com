      <p>'Cutting Corners' has a VERY NEGATIVE connotation in English. It means to do things on the cheap; to bypass necessary steps; to use the cheapest raw materials, doing less than a thorough or complete job, etc. </p>
      <p>The origin of the term was probably from horse-drawn carriages, literally making a very sharp turn at an intersecti0n, illegally going over the pedestrian path.</p>
      <p> - Herb</p>
