      <p>Except for the nice narrowness, it doesn't seem to be saying "precision", or "sports", or "measurement", or "personal"...</p>
      <p>It's a cliché, but I think it works: try slanting the letterforms; but keep them narrow, and rigid.</p>
      <p>You could also try replacing the "E" with ruler marks (which we've actually seen done on Typophile) or the "O" with [something that evokes] a stopwatch.</p>
      <p>Another thing that might work is giving this a bitmapfont (or seven-segment) flavor (maybe just for the "PT", or the "E" or "O") which would evoke the electronic equipment typically used in high-end physical training.</p>
      <p>hhp</p>
