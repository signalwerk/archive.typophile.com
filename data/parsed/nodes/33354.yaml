      <p>I see a few ways to approach it:</p>
      <p>1) as them if they'd be interested in seeing some 'massaged' versions of the logo to best fit in to the overall designs you are coming up with. Be prepared from them to just say 'no' and let it be. </p>
      <p>2) Propose the adjustments as you've made them and see what they say. Be prepared from them to just say 'no' and let it be.</p>
      <p>3) Change it, and don't tell them. Maybe they won't notice. If they do, be prepared from them to just say 'no' and let it be.</p>
