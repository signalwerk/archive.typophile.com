      <p>Thanks a lot for your input, everyone. I think I'll just bite the bullet and leave it be, then.</p>
      <p>Lex, my "drawing" is just a quick trace of the pre-existing one. I wasn't aiming for absolute perfection; my goals were just to get rid of Bank Gothic, the bottom dots and bar, and round some of those hard angles a bit. But I'm not saying this because you've hurt my pride or anything. Your comments were (and are) more than welcome.</p>
      <p>Linda, the question about the colours is really difficult to answer. The first image is just a quick reduction of the TIFF file the client gave me, so it's probably closer to what had previously been used in stuff sent to the printer. But the colours in mine are, numerically at least, those prescribed by the previous designer. But then you have all those colour calibration issues, and in any event it's practically impossible to find a printer here that will use some kind of colour standard and produce consistent colours every time.</p>
