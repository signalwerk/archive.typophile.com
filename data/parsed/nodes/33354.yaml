    html: <p>I like your improvements to the logo. I would tell them now is the perfect time to change it because it is so new. I would almost downplay the changes, so they don't feel like they're making a drastic change, which they really aren't. Try to keep it a positive experience for them - saying things like "The designer had a real good start with this, but there are some adjustments we can make which will really polish it off..." Keep it POSITIVE, and you may be able to pull it off. If they are resistant, try to find out why, and address those concerns. You also should be able to present a good rationale behind the changes you've made.</p>
