    html: |-
      <p>While I think yours is an improvement over the one they currently have, I don't feel it's the place to be offering them a revised version right after they commissioned a new one. I'm sure we've all worked with logo's we'd rather do over, I have, but that's not what they hired us for. </p>
      <p>Don't let the logo drag your own work down, a good design should stand on it's own even if you put a grey box where the logo should be. When I do roughs I always just box things out, images, logo's and text areas, at least the structure will be solid even if the visuals are less than desirable.</p>
