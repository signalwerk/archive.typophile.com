    html: <p>Your design is easier on the eye for sure but designing a new logo when you haven't been asked is a bit cheeky. They have also invested a little bit of cash in the brochures and cards. Depending on the company this might or might not be a BIG deal. If the new ID has been around for a while now the chances of their wanting to mess with it will be much lower. If it's just been a few weeks then the iron may be hot. In any event DO NOT do this to make your life easier if they don't pay your suitably for the fix. And by this I mean 25-50% of the cost you would charge for a brand new logo design or you are selling yourself and your fellow designers down the river. After all it's just one job and you should keep your self respect. Also if you don't get to change the logo - work with the existing logo design not against it. Working with constraints is part of being a graphic designer.</p>
