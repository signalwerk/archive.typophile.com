    <p>A heavy machinery rental company, whose main offerings are excavators and backhoes, has just hired me to do some design work (website and some collateral). As luck would have it, they'd recently commissioned a new corporate identity from someone else and expect me to work with it. (Before retaining my services, they'd already had business cards and some brochures made with the new logo.)</p>
    <p>I'm having some trouble designing around the existing logo (first image below) and thought of proposing a slightly modified version (second image) to my client which I feel may be easier to work with. I would be interested in hearing what you have to say about the advisability of introducing such changes while the corporate identity is being established. Comments on whether you see any improvements that might justify the trouble are also welcome.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_4018.png"></div><p></p>
    <p><code> </code><br>
    <code> </code></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_alt_4629.png"></div><p></p>
    <p><code> </code><br>
    <code> </code></p>
    <p>P.S.
    </p><ol>
    <li>Ignore differences in colour. The first image comes from a TIFF file I was given; the second was generated with Illustrator using the colours prescribed by the previous designer.</li>
    <li>Please don't go into the issue of why my new client didn't just get the previous designer to do the work they've hired me for. I'm not about to turn them down and say 'go back to the other guy'.</li>
    <li>'Ditch the whole thing' is not a helpful piece of advice because that's not an option.</li>
    </ol>
    <p></p>
