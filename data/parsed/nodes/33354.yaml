      <p>Honestly, the existing logo is better drawn. Your curves are lumpy, especially on the sun, and your square isn't, well, square.</p>
      <p>I'd say just use their old one, but fix the lump where the horizon meets the straight line. This kind of thing probably won't go into your portfolio anyway, so just do the monkey work and get paid. And who knows - maybe the owner of RetroFort has a friend who needs a full corporate identity package. No sense in burning a potential bridge over something small like this.</p>
      <p> - Lex</p>
