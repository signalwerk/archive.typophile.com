    html: |-
      <p>I got this reply from Agata Wycichowska, the designer of the gorgeous font:</p>
      <p>- - - - - - - - - - - - - - - - - - - - -</p>
      <p>Hi Kay,</p>
      <p>Happy to hear you like the mag!<br>
      We're changing design teams so March issue will be the last use for this typeface.</p>
      <p>(1)<br>
      The font is called <strong>Dazedface</strong>, and was used in editorial features, fashion stories and covers. (The example jpg is an editorial opener).</p>
      <p>(2)<br>
      Designed and built inhouse by me.</p>
      <p>(3)<br>
      It's currently not distributed, but we might look into foundries if anyone is interested.</p>
      <p>thanks,<br>
      Agata Wycichowska</p>
      <p>- - - - - - - - - - - - - - - - - - - - -</p>
