    <p><a href="http://www.whartonwomen.org/wp-content/uploads/prtm_logo.jpg" title="http://www.whartonwomen.org/wp-content/uploads/prtm_logo.jpg">http://www.whartonwomen.org/wp-content/uploads/prtm_logo.jpg</a></p>
    <p>[I really only need the font used to spell out "PRTM" identified, please.]</p>
    <p>So, I saw a font that I'd like to use on my own site, but when I attempted to contact the company regarding what font they used, they responded with an email telling me they had been bought out and simply had no record of the font used on what used to be their logo and had no way to contact the designer who made their logo.</p>
    <p>If anyone can identify this font, you'd be my personal hero. I managed to find the old logo posted online here: </p>
    <p><a href="http://www.whartonwomen.org/wp-content/uploads/prtm_logo.jpg" title="http://www.whartonwomen.org/wp-content/uploads/prtm_logo.jpg">http://www.whartonwomen.org/wp-content/uploads/prtm_logo.jpg</a> </p>
    <p>I'm trying to identify the font that's used in the characters PRTM. I'm a first time user of this site, so please, bear with my incompetence. Thanks so much for any help in advance!</p>
    <p>(I've also uploaded the image, but I cut out the text I don't need identified. Thanks again to everyone!)</p>
