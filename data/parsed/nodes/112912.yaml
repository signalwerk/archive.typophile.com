    <p>It's possible that this subject has been covered before, but...</p>
    <p>In a folder full of fonts, when I select any size icon from the View drop-down menu, some icons display the actual typeface, and other display math symbols. I have tried unchecking Mathematical Operators in FontLab's supported codepages list, but it doesn't seem to do any good.</p>
    <p>Any ideas?</p>
