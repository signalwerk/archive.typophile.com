      <p>Your font is <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=HaroldsFonts%20%2F%20%28Commercial%29&amp;ffam=Artistamp%20-%20Medium&amp;fid=545a412172f3ffb90796e346438e7c04&amp;fsize=60&amp;text=Planlos&amp;fit=1" rel="nofollow">Artistamp (Medium)</a></strong> by Harolds Fonts. The text set is "Planlos" and if you embolden it a bit it will match your sample better (smaller white spots).<br>
      PS: You probably haven't tried all automated ones, you should also try <a href="http://www.FindmyFont.com" title="www.FindmyFont.com">www.FindmyFont.com</a> ;)</p>
