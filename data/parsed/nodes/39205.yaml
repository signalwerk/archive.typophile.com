      <p>Grattis Toby! Yes, it is Floris by Luc(as) de Groot.</p>
      <p>The original name was ‘Lucas’, later de Groot re<a href="http://www.fontshop.be/details.php?entry=259">named it after</a> his <a href="http://www.fontfabrik.com/jpg/floris3.jpg">son</a>.</p>
      <p>And yes, Floris is kind of a continuation (see <a href="http://www.typophile.com/node/6256#comment-44170">this old thread</a>) of Folha. </p>
      <p><cite>As typographic director at MetaDesign Luc(as) was responsible for many typographic projects over a period of 4 years. As part of the redesign of the Brazilian newspaper Folha de São Paulo, he created an exclusive series of fonts.</cite><br>
      <a href="http://www.fontfabrik.com/fofawor1.html">[FontFabrik – see also for a PDF sample of Folha]</a></p>
      <p>Floris is used by the French newspaper Le Monde.<br>
      <a href="http://a1692.g.akamai.net/f/1692/2042/1h/medias.lemonde.fr/medias/pdf_obj/020113hor.pdf">[PDF]</a> </p>
      <p>What <a href="http://www.typophile.com/node/31427#comment-186143">Hrant said about Floris</a>:<br>
      <cite>superb […] serious but attractive, and very French in my eyes</cite></p>
      <p>Apparently, Floris isn’t exclusively licensed to Le Monde, as the Berlin based newspaper <a href="http://jungle-world.com/seiten/2007/28/10243.php">Jungle World</a> uses it (in an enhanced version), too.</p>
      <p>The samples that I’ve showed in the beginning had been taken from this headline:<br>
      </p><div class="imageWrap"><img src="/files/floris_5705.gif"></div><p></p>
      <p>Your turn, Toby!</p>
