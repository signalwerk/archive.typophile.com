      <p>¡Felicitaciones, Marcelo! Yes, it is Romeral by Juan Pablo de Gregorio over at <a href="http://letritas.blogspot.com">Letritas</a>, which is now celebrating its two-year anniversary.</p>
      <p>This glyph is the really funky alternate “f” (which interestingly looks very similar to the alternate “t”), also found in his new award-winning commercial release <a href="http://typographica.org/001143.php">Los Niches</a>.</p>
      <p>Maybe Lex knew the answer and refrained from saying, since a search for Romeral on Typophile after I posted turned up he posted the inline version almost exactly one year ago on this Expert Type Quiz. If he did know, I’m glad he let someone else figure it out, though I’m sorry that I deprived him the opportunity to participate fully. I do recommend to those following me that they do a quick Google search to make sure that this doesn’t happen to them – though it turned out well enough in the end.</p>
      <p>Your turn!</p>
