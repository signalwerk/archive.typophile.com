    <p>I am looking for help identifying or matching the font in the heading of this poster from the Warsaw Ghetto in WWII: <a class="freelinking external" href="http://www.inminds.com/img/warsaw-deportation-notice.jpg" rel="nofollow">http://www.inminds.com/img/warsaw-deportation-notice.jpg</a>.</p>
    <p>My purpose is for use in a concert poster for an upcoming performance of Schoenberg's "A Survivor from Warsaw."</p>
    <p>Thanks,<br>
    Hagen Hottmann</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        Block Berthold (Extra Condensed)        </div>
            </div>
    </div>
