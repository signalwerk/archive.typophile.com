      <p>Thank you all so much for your insight.</p>
      <p>Based on your replies, I feel I should clarify my position.  We have no intention of letting this guy buy us out.  He is a bully and is trying to force us to sell, but he has no legal availability to force us out.  </p>
      <p>I had read some things that seemed to give precedent to the fact that I would own the logo, et cetera.  It would give us very much the upper hand in negotiation were this true.  Anyway, I'm not really interested in receiving compensation for the work per se.</p>
      <p>Thanks again for your help!  I really do appreciate it. :)</p>
