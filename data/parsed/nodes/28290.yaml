    <p>I designed the logo and created the brand (letterhead, business cards, signage, advertising, etc.) for my husband's company.  I did this for free and there are no contracts of any sort involved.  </p>
    <p>His business partner is trying to buy him out of the company.  Currently, most of the company's worth is in the brand that I have created.  </p>
    <p>My question is, who owns the designs?  Do I own them since I received no compensation and did not sign anything to release them?  Would it be assumed that they were created for use by the company and thus belong to the company?</p>
    <p>I would appreciate any guidance you could offer.  Thanks!</p>
