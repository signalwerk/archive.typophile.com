      <p>I think you'll find that the identity work is an asset of the company, the value of which should be taken into account in the partner's offer price. As it appears you provided the work to the company free of charge I can't think you're entitled to any compensation related to the sale of the company. </p>
      <p>However now that the company is being sold, I'd suggest invoicing for the work completed based on your hourly rate and time put into it. I don't think you're going to get more than that even though you feel the company's worth is is mostly in the logo. Look at Apple - the guy who drew the logo got nothing, he's not even on Steve's Xmas card list :-(</p>
