      <p>The design will always be your intellectual property. In court, however, you will have to be able to prove that you designed the logo &amp;c. (dated sketches, mails). Just to make sure, you could have had your designs registered, and probably should still do so. Also, one could still assume you at least silently agreed with the use of your design (which you did), what possibly might be an argument in favour of the firm's right continuing to use it.</p>
      <p>I'd suggest you come to a personal accord with your husband's business partner. Make an estimation of the brand's value, that is, what you would charge if you were to make the designs now, in a strict business relation. The design is only part of the brand's value, since its renown probably is more the result of the company's business activities and merchandising. (Remember the CocaCola logo precedent.)</p>
