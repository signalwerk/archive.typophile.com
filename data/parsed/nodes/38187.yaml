    html: |-
      <p>Difference blending mode, simply creates the inverse value, if the underlying image isn’t truly black or white the result will look gray.</p>
      <p>You can achieve the effect in photoshop.</p>
      <p>Create text on a new layer above the photo or image.<br>
      Set the text layer mode to ’difference’.<br>
      Rasterize your text layer and and create a selection from that layer.<br>
      Select the photographic layer with the selection still active, increase the contrast of the photographic layer ( will only affect the area beneath the text).</p>
      <p>That should do it.</p>
      <p>If you’re not familiar with photoshop, these instructions may seem a bit cryptic, be warned.</p>
