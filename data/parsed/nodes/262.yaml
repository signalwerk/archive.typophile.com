    html: <p> Ole -- I agree with Richard about the shadow, though cool, distracts from the killer type treatment. <br> <br>I would add a smidgen of breathing space at the top and bottom of the company name. <br> <br>The curly O is nice as is the HE lig. <br> <br>the Ms are nice too, but might benefit from lighter diagonals; they seem a tad bit dark. <br> <br>Nice work. <br> <br>BTW, what kind of construction firm is it? It seems more upscale than your basic general contractors with hardhats. </p>
