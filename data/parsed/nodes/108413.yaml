      <p>Oops, I did say it, but perhaps not clearly enough. With readers like the Kindel Fire (7-inch), the iPad 10-inch, and even the Android &amp; iPhones, Charis is just fine.</p>
      <p>I don't know what the resolution of these screens is, but it is 2-3-4 times higher than a typical computer monitor. Again, for my money, Charis works just fine, the better hinting of the new Charter isn't needed.</p>
      <p>I'm currently working on a long-term project to use pdfs for ebooks. The plus, of course, is the designer retains complete control over the presentation, including things like margins, word spacing, type size, &amp; on &amp; on. </p>
      <p>The downside is you can't do just one pdf to fit all the different screen sizes. That's been the argument for ePUB ebooks all along. But no one ever asked a <strong>compositor</strong> what made sense. We have, over the years, developed a workflow where you can set a book from a MS Word (or Libre, or OpenOffice) file in a few hours. A fair bit built into that workflow, but we have it, and anyone could develop something similar.</p>
      <p>With 3-4-5 stock templates and an efficient workflow, I can redo an existing book (change only the size, lead, margins, etc.) in a couple hours. So, I can do multiple pdfs <strong>cheaper</strong> than the time it takes to make an ePUB2 ebook. </p>
      <p>...Right up until there are images or other complexities where the 4-inch phone screen versus 10-inch tablet screen size gets in the way. There will be ways around this, too, &amp; that's where our work is going (InDesign's liquid layout being one good starting point).</p>
      <p>Back to your question: if your ebook is aimed at the readers &amp; phones of today, Charis will work just fine. I'll allow I've spent time working over the fonts for letter fit and drawn up some extra characters. On that point, I don't know if Charter is a better starting point. As I almost always work over fonts (for ease &amp; speed of production as well as appearance), I'm not a good source about whether the Charter or Charis is better from the foundry.</p>
      <p>¿Esta claro, mi amigo? </p>
      <p><cite>Edit:</cite></p>
      <p>I don't know how the folk at Typophile would feel about it, but if it's OK, I have a pdf (161K) of the first 18 pages of Sherlock Holmes <cite>Scandal in Bohemia</cite> (public domain text &amp; one public domain image), set in with Charis and Alegreya (both open source) I'd be happy to attach to this thread.</p>
      <p>Set 9/13.5 Charis, with (approximately) 2.75 pica left &amp; right margins with a 3-pica head margin. Actual sizes will change just a bit depending on the device and the app used.</p>
      <p>This one aimed at 7-inch Android devices, esp. a Kindle Fire (download the pdf to "documents," then import into a pdf app -- I like Aldiko, but whatever... )</p>
      <p>Let me know.</p>
      <p>Actually, this entire <cite>Adventure</cite> is only 210K, and could then be compared with similar texts from Project Gutenberg... Again, not my place to decide what's appropriate for Typophile. Somebody in charge chime in, please.</p>
