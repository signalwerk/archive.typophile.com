    <p>I was looking for the Charter font from Matthew Carter and discovered that there are multiple versions.<br>
    I wonder if  someone can tell me what are the differences between the 3  listed here (in terms of design, not concerning the rights to sell) : </p>
    <p><a href="http://www.myfonts.com/fonts/linotype/itc-charter/" rel="nofollow">ITC Charter (Linotype)</a> (ITC Charter Regular - $35)<br>
    <a href="http://www.myfonts.com/fonts/linotype/itc-charter/" rel="nofollow">ITC Charter (ITC)</a> (Charter Regular - $29)<br>
    <a href="http://www.myfonts.com/fonts/bitstream/charter/" rel="nofollow">Charter BT (Bitstream)</a> (Charter Regular - $24.75)</p>
    <p>Thanks for your help</p>
