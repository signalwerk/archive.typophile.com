    html: |-
      <blockquote><p>I'll try to read the rest later.</p></blockquote>
      <p>That's Hrant. <strong>Fire!</strong> followed somewhat later by ready,  aim.</p>
      <p>Aurélien, if it hasn't occurred to you yet, asking people who make fonts for a living sometimes occasions a knee-jerk reaction -- always negative -- to the notion of free fonts. The only free fonts Hrant seems to like are those with an Apache license. You'll have to read his posts to find out why, I'm not going into that.</p>
      <p>Burried in that 30 years of book design reamark is the following -- much other work is working as a compositor with some of the best book designers in the U.S. These were/are book to be read, not the AIGA coffee-table books typically found in the "50 Best books" shows.</p>
      <p>We learned together what can be done, from the days of metal, early photocomp, and on to today. The degree of control -- the ability to make minute changes -- has steadily increased, and while the nature of spatial relationship hasn't changed, what can be done has, and that should inform the theorists. It will take a while, I suppose.</p>
      <p>Here's a place to think about, to look, rather than just theorize: For the fun of it, go look at books set after 1910 and before, say 1990, when leading was often 2 points. (i.e., nominally 10/12). Look esp. at fonts with significant extenders. Now look at the word spacing, and see if it doesn't look about right. Not theory, use your eyes, and <strong>read</strong>. Now notice that spaceband values of the time were typically a 5-t0-em as the smallest used (actually, 4 units on an 18-unit em), with 5 units being "ideal." </p>
      <p>Take the same type, same text, and set it with a current fashion, say 14-point of leading (10/14). All of a sudden, that word space value can get smaller. Do you know why?</p>
      <p>Maybe that's why wordspacing in fonts has dropped to a 5-to-em space -- sometimes less -- as ideal. The new Adobe Text Pro Regular font comes as published with a space value of 213. That's about 4.6-to-em space. Using the stock InDesign justification parameters of 80-100-whatever, that's almost a 6-to-em space allowed as the smallest. And that kind of thinking is new, and has nothing to do with the letterforms, which are quite conventional.</p>
      <p>Similar things apply to both to letterforms and their internal spacing, and kerning.</p>
      <p>For example, before kerning a font, I set up a string of works, with a period in it. Say</p>
      <p>The fol. lost many things</p>
      <p>I first adjust the right side bearing of the period (after "fol" in this example) to get the spacing of that string that I want. Not too much, not ersatz "French spacing." Not too little, so the small dot dissappears into completely even spacing. I'll confirm that value with a few capitals following the period, as well (not just the lower-case "l"). Same with the comma, and quote marks. Then the left side bearing of the quoteleft(s). Colon, semicolon, question and exclamation mark come into play, though as less common, the values aren't weighted as heavily. </p>
      <p>In other words, I start by getting the space between words that I want, with or without punctuation. Everything else keys off that.</p>
      <p>Etc. To me, spacing a font is a mater of words, at text size, for books, for for people who read, not admire letterforms. Don't care about museum walls when working with type.</p>
      <p>I'm sure Massimo Vignelli is a master of all the trades he practices; I'll allow I'm not aware of reading a book set according to his designed.</p>
