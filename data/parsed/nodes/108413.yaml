      <p>The problem though is that the ideal font choice also depends on the "page", because a font's vertical proportions, color and spacing (not to mention character, in terms of being a "supportive" design choice) are tied into any "macro" decisions; if you're having to change the margins, word spacing, type size, etc. then a change of font is probably in order too. Ergo: Charis, Alegreya, or whatever else cannot ideally serve more than a relatively narrow range of situations.</p>
      <p>hhp</p>
