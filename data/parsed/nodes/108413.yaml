      <p>Charis is a little heavier than Charter. Sometimes that's good, sometimes not. It is also a little bigger for a specified size, but that's a trivial matter of scaling. I tend to use Charis more for books to be printed offset at 2,400+ dpi.  Though if, for whatever reason, the type size to be used is to be a bit larger, Charter picks up enough weight to print quite well whereas Charis becomes a little clunky.</p>
      <p>It's with the devices in the 100 dpi region (computer screens) where Charter might show an advantage. With, say, 9-point on a newer 7-inch Kindle fire, Charis works very well indeed. Someday -- I imagine not far off -- computer monitors will be high resolution too.</p>
      <p>Always helps to know your tools, and usually, type is a tool.</p>
