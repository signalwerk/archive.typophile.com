      <blockquote><p>The problem though is that the ideal font choice also depends on the "page", because a font's vertical proportions, color and spacing (not to mention character, in terms of being a "supportive" design choice) are tied into any "macro" decisions; if you're having to change the margins, word spacing, type size, etc. <strong>then a change of font is probably in order too.</strong> <cite>emphasis added</cite></p></blockquote>
      <p>No. Thirty years of book design has not shown me this. Given a page (trim size) and someone's requirements on the number of characters that fit on a page, one might have to change the typeface. This works esp. against fonts that set fewer characters per pica in an acceptable size (which is not the case for either Charis or Alegreya, but that's another story).</p>
      <p>Now adding pages costs money in print editions -- though as "pages" are purchased as a part of signatures, not as directly as one might think. I can come up with examples where it is cheaper to have *more* pages -- and that's why some books have blanks at the ends.</p>
      <p>AFAIK, adding pages in a digital edition does not significantly affect the cost. Therefore, a requirement about a certain number of character per page isn't really expected.</p>
      <p>The only reason a typeface like, say, Charis, would be unsuitable for a digital edition would be the, what, "affectation?" of the type itself -- I wouldn't particularly want to set love poetry in Charis. Or Times Roman, or even Minion, for that matter. Yes they will work, but it's like setting a Raymond Chandler mystery novel in Palatino.</p>
      <p>Typefaces that work only in a very small size range are almost always the result of poor type design. There is something about the spacing of the elements in the font that keeps things from working. Most often, that's is from poor letterfit. Sometimes simply changing the word space value helps, but that is both easy and not usually a fix. Sometimes the spacing problems come from the letterforms themselves, which is the hardest to fix. And all too often, more than one factor is at play in a font.</p>
      <p>Finally, there usually is a limit in which any single-master typeface (as are almost all digital typefaces) can be sized to work well. The internal spacing of the characters just won't take a setting beyond X, or less than Y. For example (in print), a lot of fonts called "text" fonts start to break down around 12-point setting, or less than 8-point. But this as nothing to do with "Charis" it is a phenomena of any single-master-size type. design.</p>
      <blockquote><p>A fixed-layout EPUB would allow that but is only really effective when you have target devices in mind that will compliment your layout.</p></blockquote>
      <p>Yes. Though just as type is scalable in a small range, so too is a layout. You can't, I think, have a layout that works for a 7-inch tablet an also for a 4.5-inch phone. But you probably can have one that works for a 7 &amp; 8.25 inch (diagonal) tablet, and another that works for either the 4.5  &amp; 5.5 inch (diagonal) phones. </p>
      <p>You probably need four sizes to cover all devices if offering a fixed layout product. I think I can design and execute that as cheaply as I can execute a good ePUB2, with similar features. It will look far better, and won't <strong>break</strong> depending on device and app, as epub so often does, esp. when you add anything fancy. </p>
      <p>&amp; that's the real question.</p>
    html_clean: |-
      <blockquote><p>The problem though is that the ideal font choice also depends on the "page", because a font's vertical proportions, color and spacing (not to mention character, in terms of being a "supportive" design choice) are tied into any "macro" decisions; if you're having to change the margins, word spacing, type size, etc. <strong>then a change of font is probably in order too.</strong> <cite>emphasis added</cite></p></blockquote>
      <p>No. Thirty years of book design has not shown me this. Given a page (trim size) and someone's requirements on the number of characters that fit on a page, one might have to change the typeface. This works esp. against fonts that set fewer characters per pica in an acceptable size (which is not the case for either Charis or Alegreya, but that's another story).</p>
      <p>Now adding pages costs money in print editions -- though as "pages" are purchased as a part of signatures, not as directly as one might think. I can come up with examples where it is cheaper to have *more* pages -- and that's why some books have blanks at the ends.</p>
      <p>AFAIK, adding pages in a digital edition does not significantly affect the cost. Therefore, a requirement about a certain number of character per page isn't really expected.</p>
      <p>The only reason a typeface like, say, Charis, would be unsuitable for a digital edition would be the, what, "affectation?" of the type itself -- I wouldn't particularly want to set love poetry in Charis. Or Times Roman, or even Minion, for that matter. Yes they will work, but it's like setting a Raymond Chandler mystery novel in Palatino.</p>
      <p>Typefaces that work only in a very small size range are almost always the result of poor type design. There is something about the spacing of the elements in the font that keeps things from working. Most often, that's is from poor letterfit. Sometimes simply changing the word space value helps, but that is both easy and not usually a fix. Sometimes the spacing problems come from the letterforms themselves, which is the hardest to fix. And all too often, more than one factor is at play in a font.</p>
      <p>Finally, there usually is a limit in which any single-master typeface (as are almost all digital typefaces) can be sized to work well. The internal spacing of the characters just won't take a setting beyond X, or less than Y. For example (in print), a lot of fonts called "text" fonts start to break down around 12-point setting, or less than 8-point. But this as nothing to do with "Charis" it is a phenomena of any single-master-size type. design.</p>
      <blockquote><p>A fixed-layout EPUB would allow that but is only really effective when you have target devices in mind that will compliment your layout.</p></blockquote>
      <p>Yes. Though just as type is scalable in a small range, so too is a layout. You can't, I think, have a layout that works for a 7-inch tablet an also for a 4.5-inch phone. But you probably can have one that works for a 7 &amp; 8.25 inch (diagonal) tablet, and another that works for either the 4.5  &amp; 5.5 inch (diagonal) phones. </p>
      <p>You probably need four sizes to cover all devices if offering a fixed layout product. I think I can design and execute that as cheaply as I can execute a good ePUB2, with similar features. It will look far better, and won't <strong>break</strong> depending on device and app, as epub so often does, esp. when you add anything fancy. </p>
      <p>&amp; that's the real question.</p>
