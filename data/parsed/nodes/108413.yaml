      <p>Another thing you should know is that Bitstream made the original Charter fonts available as OpenSource. Check the TeX sites. There was some initial confusion over the license, but as thing now stand (and as I understand it), the fonts are free, free to use in any form, free to modify, and free to distribute.</p>
      <p>There have been non-Carter-drawn characters added by some TeX folk. As always, they vary in quality.</p>
      <p>So. I don't find it difficult to draw up os figs or small caps. As we set books (and occasionally pdfs <strong>only</strong> for some high-res mobile devices now out -- Kindle, iPad, phones. etc.), I don't care about the improved hinting. </p>
      <p>So the free-to-modify part of the open license is very valuable to me, as is the ability to use the fonts in pfs without incurring further costs. BitStream is now owned by Monotype, &amp; if I understand things aright, you just can't do anything with their fonts without paying ever more money.</p>
      <p>Worth a close look, depending on your needs.</p>
      <p>FWIW.</p>
