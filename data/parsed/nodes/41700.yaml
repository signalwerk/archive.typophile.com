      <p>I did try trimming at the baseline, but the result looks confused, as though the f belongs to a different family altogether. It kind of kills the 'lively' in it. The descender, even trimmed flat, still contributes grace and movement. Here is the trimmed version in (partial) context. It feels right to me.  </p>
