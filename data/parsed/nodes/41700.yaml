    date_raw: 4 Feb 2008 — 3:31pm
    votes: null
    html: |-
      <p>Yeah, the recognizable part of a typeface (glyphs in this case) is the upper part. There is a classic test, where they cut off either the bottom half of a line of type or the upper half. ANd then let people read these lines.<br>
      Most of the recognition aspects are in the upper parts.</p>
      <p>Personal opinion: cut off at baseline does it for me.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
