  html: |-
    <p>I need to trim the tail from an italic lowercase f using monotype modern bold italic ('original' below). It isn't my preference to do so, but it is the lesser of 2 evils on a project with a fast-approaching deadline. Which of these do you think works? Do you think it should taper at all? Or should it be the same width right to the bottom?</p>
    <p>Here are pics for the original, 1 (some), 2 (less), 3 (less still).</p>
    <p>Alternately, could anyone suggest a lowercase f that doesn't have a tail that would match this?<br>
    thanks in advance!<br>
    Jennifer</p>
