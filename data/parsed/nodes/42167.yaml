    <p>I was in a clothing store called <a class="freelinking-external" href="http://www.uniqlo.com/us/stores/ny_soho_store.html">Uniqlo</a> with some friends today. As we were leaving, I noticed a T-shirt that said “The quick brown fox jumps over the lazy dog.” in something like Bodoni Poster Italic. We had to go, but I noted that there were some other T-shirt designs next to it and that brand of these shirts was World Typographers. Some of them look cool.</p>
