    votes: null
    html: |-
      <p>OK Dan, that gets the ball rolling. Let me clarify a bit, the gallery is not in the university. It is in a medical building in the arts district in a different city than the university. Now, as far as defining artspace, I think I know what you mean. One issue is that the current show is the first. The space may be used for dance. It may have many uses, but what those uses are is an issue for the curatorial department of the university. I’ve said previously in the thread that I am confined a bit in what I can do. I’ve not chosen to show options that have been rejected thus far. So here’s a bit of context.</p>
      <p>The original logo design. I don’t know the designer on this.<br>
      </p><div class="imageWrap"><img src="files/Original.gif"></div><p></p>
      <p>Here is my first proposed rework.<br>
      </p><div class="imageWrap"><img src="files/Attempt.gif"></div><p></p>
      <p>Without too much detail, I am confined to using the name as it is. Given that I’m not going to vary much from the long wordmark, I’ve arrived where I have.</p>
      <p>Oddly U&amp;lc has been a favorite. Maybe I have ignored the development in some ways in favore of simple, thoughtless computer solutions. I tend to think in this case though that I’m not going to change certain imposed limitations. I know I’m dissapointed that I’ve not been able to direct the gallery toward a stronger mark, but I also feel I’m improving what exists, and providing some long term free support. I’m assembling a small type pool to cover wall labels and other unknown needs. Take a look at the attached PDFs to get a larger feel for the direction. I’ll attach them to the original message.</p>
