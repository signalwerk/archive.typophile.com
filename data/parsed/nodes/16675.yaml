      <p>Hmmm… I like the Formata, but I’m not so sure about the ‘artspace’ face, it looks a bit too old-fashioned, I think because of the curves on the bowls of characters. Maybe (I’m guessing this is custom, but there must be something similar…) try and find something similar to the one used on the Guardian masthead. It’s got a nice feel and would complement the Formata.</p>
      <p><a href="http://www.guardian.co.uk/theguardian">http://www.guardian.co.uk/theguardian</a></p>
      <p>I like White Pepper’s idea of leaving the ‘artspace’ in a space, but I don’t think those initials would be helped by doing so (might make the UNT thing more noticeable).</p>
      <p>Hope this helps!</p>
      <p>P.S. Am now disappointed Hrant’s not a Scouser…</p>
