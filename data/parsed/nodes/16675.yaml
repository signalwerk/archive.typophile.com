      <p>^<br>
      I think that’s Hrant’s hillbilly homage to Fort Worth.</p>
      <p>Tom, that’s Formata SC. I’ve looked at several weights. The light seems to have more contrast than I want but I’ve been comparing, and will keep working with it.</p>
      <p>Simon, your point is taken, but like all great minds you’re not the first to figure this out. Here’s a funny question: when North Texas State University changes to the Universtiy of North Texas, what do you do with the call letters for the radio station KNTSU? All that is to say, I’m not able to vary on the name. Previous version of the mark featured “artspace“ more but it was requested that I preserve the name order. Spray away.</p>
      <p>What do you call a Zoroastrian hillbilly? Hellbilly?</p>
