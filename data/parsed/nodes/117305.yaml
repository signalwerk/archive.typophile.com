  html: |-
    <p>Hi,</p>
    <p>can anyone comment on the usability of the "Core Sans" family by S-Core? </p>
    <p>The "N" (= neutral) version is on discount at the moment (for example here <a href="http://www.myfonts.com/fonts/s-core/core-sans-n/" title="http://www.myfonts.com/fonts/s-core/core-sans-n/">http://www.myfonts.com/fonts/s-core/core-sans-n/</a>), and I would like to hear about how it works for large amounts of text like in books. </p>
    <p>Has anyone ever mixed the different members of the family, "N" with "G" for example? Are small caps included? I once saw that there’s an extra "SC" font available …</p>
    <p>Thanks!</p>
