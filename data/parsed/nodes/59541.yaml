      <p><em>Gill Sans - Early 20th Century England</em><br>
      <a href="http://www.saab.com/#/" title="http://www.saab.com/#/">http://www.saab.com/#/</a></p>
      <p>You could address it more directly: a typeface suited to the Romani language.<br>
      In the manner that, for instance, Peter Biľak’s types accomodate Slovakian, with its profusion of accents.<br>
      Or you could make it decorative, using graphic themes from Romani art: there was a thread here last year or the year before, about type and Maori culture, with some type along those lines.<br>
      Or you could transpose data that relates to the Roma directly into type forms, that would be the most contemporary approach.</p>
