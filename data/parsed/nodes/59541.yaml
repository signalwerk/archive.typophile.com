    html: <p>The Romany are very mixed racially and tend to be nomadic. Maybe you could investigate the cloth signpainters’ sample books that traveling signpainters would carry to show customers when they arrived in “your town”. I think this was a common custom in the 19th century in France, maybe it was more widespread and if so, there might be some Romany signpainters out there. The lettering styles are very decorative and seem also to fit into the visual culture of the circus. More nomadic connections there.</p>
