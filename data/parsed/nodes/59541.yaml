      <p>Touché with the Saab call Nick. I like your three ideas - especially the one suited to the language, that could prove to be an interesting approach. Thing is - this is just half of my final project; the other half is part of the International Society of Typographic Designers (ISTD) brief which set up parameters that I felt could help me present the Roma in an authentic // balanced // interesting way. ISTD brief is to publish under the title ’10 things you should know about...’ using one of the following 10 categories:</p>
      <p>Science // Sport // Hobbies/Crafts // Gardening // Famous battles // Games // Travel // Plays // Artists // Authors.</p>
      <p>I’m choosing Travel. My tutors said it’s a pretty broad requirement and i can basically twist it to 10 things you should know about Ethnic Minorities, or Ethnic Groups of Europe or something along those lines.<br>
      The main aim for this book (aside from the 10 things) is to show the way typography can be used to create an interesting visual publication.</p>
      <p>So one part type design that is to be used in this second part - the book I’m going to design too. At this stage I imagine it’s going to be a standard alphabet but adding characters that are key to Romani language could be an interesting twist, enough to start on at least. I’ve been checking out the music aspect as much as you can from a tiny island in the south pacific. All very inspiring comments so far by the way. Thanks so much for helping me narrow the field down.</p>
      <p>Oh and I’m not fully certain Paul - but I believe my Grandmother said Hungarian Roma? Im about 90% sure.</p>
