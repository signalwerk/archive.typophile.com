      <p>Then you remember the old man from the video I posted - he died in the video you mentioned, what a touching funeral. Where the Road Bends is fabuous - I have it on Tivo at home and watch it every once in a while. Latcho Drom is the story of the Roma told completely in music - starting in India and continuing on through the hot jazz clubs etc. It is a beautiful movie but I have never seen it on DVD, just video.</p>
      <p>Drom means road I believe, something the Roma know well.</p>
      <p>There’s also a Spanish movie called Vengo which is set in the south of Spain amongst Roma flamenco musicians. It’s fictional but there is some great music in it.</p>
      <p>Cheers to the Romani!</p>
      <p>pbc</p>
