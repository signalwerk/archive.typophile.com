    <p>Hey team. I’m 4th year at a Design School in New Zealand, doing my final major project this year - the prep was first semester (Feb to June) and now the execution is coming up (July to November).</p>
    <p>So a few years ago I found out that I had some Gypsy ancestry and I thought it might be interesting to base my major research topic on the Gypsy (now known as ‘Roma’) culture as an excuse to learn more about the people and discover some of my own cultural heritage.</p>
    <p>I felt that not only did it offer a unique starting point to my project; it also made it more of a personal statement. Research in my first semester led me in very interesting directions – areas I didn’t really think of exploring and wot-not. From this little acorn of an idea I now have this idea of ‘cultural representation through typeface design’ to run with.</p>
    <p>So where I’m at now is I’m currently checking out some good examples where typeface has reflected the culture (Fraktur - Nazi Germany // Gill Sans - Early 20th Century England) and seeing how it works, what was the background etc and try and pull out some good parallels that run between them all that I can use to influence my proposed typeface.</p>
    <p>So can anyone think of some other good examples? - Maybe more contemporary? I thought Gotham by Hoefler &amp; Frere-Jones could be a good example of this kind of contemporary American zeitgeist we are in now-days, but dunno - just rambling here.</p>
    <p>Please be kind, I’m just a youngin’</p>
