    html: <p>kris <br> <br>I think a hairline is a hairline at no matter what point size. Basically half-a-point, maybe a quarter-point, can't remember, most likely a half. Rule (lines) were cast at a minimum of one-point but the printing surface could be much narrower. <br> <br>I've printed cat whiskers. Real cat whiskers. Very nice gradation!!! <br> <br>Gerald</p>
