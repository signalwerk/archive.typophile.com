  html: <p>I am curious about the usage of the term 'hairline' in  <br>in reference to (or so i think) the thinner strokes on <br>letterforms. Icame across the term in an essay by <br> Stanley Morrison,and have heard the term thrown <br> about in 'type' class  without any concrete reason for it's  <br>use. It occured to me that it may have come about <br>because they literally look line hairlines when printed <br>at smaller pt sizes.  <br> <br>I would love some clarification!  </p>
