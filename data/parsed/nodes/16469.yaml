      <p>The "GA", "RA"s and "CA" create patterns out-of-character in their<br>
      distractiveness. Also: the stem-to-stem (and diagonal-to-diagonal) tightness is dysfunctional; the "T" is too narrow; and the middle bar of the "F" is too long (except in that "FO"). I would also make the "U" wider and give the "P" a bigger head... Although not as big as that of people who would use AG for more than one word at a time... maybe.</p>
      <p>You know what makes me happy? That I'm not about 10<br>
      years older: I might have ended up actually like this stuff...</p>
      <p>hhp</p>
