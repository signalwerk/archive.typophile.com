      <p>'When I looked at the lettering there was a feeling that I only remember having once before in my graphic lifetime, and that was when I designed the 'Mother and Child' logotype. I knew the Avant Garde logotype would stand the test of time and remain avant garde for a long time. It was a subconscious or intuitive feeling that you get only occasionally — a feeling that you have created some thing that cannot be made better — by anyone.'</p>
      <p>The logo was the basis of the typeface design we know today as 'Avant Garde'.</p></ul>
      <p>Now, obviously, Herb "prettied-up" his tale about how "Avant Garde Gothic" came into existence for marketing purposes. Basically he would have said, "<em>Jeez, Ralph... quit your f*?king whinning and use the goddam mother-f#@king logo and stop being such a big a@#hole!</em>"</p>
      <p>Meanwhile, time passes, and Aaron is scratching his forehead thinking "<em>How are we</em> [ITC] <em>going to make money with all these half-drawn designs from PLINC?</em>" or something like that.</p>
      <p>"<em>I know, let's get all of our friends and design buddies MAKE them popular by using them in high-visibility ad campaigns! Hmmm, and the logo that Herb did for Ralph, some folks have been asking what font they used... well, let's quickly make it a typeface so we can license it to Linotype, Monotype and Compugraphic! I'm sure they might stay popular for a couple of years while we start building new designs.</em>"</p>
      <p>Truth is always better than academic posturing. =o</p>
