    html: <p>In addition to the 'Rename Glyphs by Scheme' script to which Claus pointed, Adam also made a 'Rename Glyphs by Regex' (Regular Expressions). I don't know if this is available anywhere at the moment, but it is very useful. Regular Expressions allows one to apply complex name changing rules, targeting not only the end of name, but also the beginning, and various wildcards.</p>
