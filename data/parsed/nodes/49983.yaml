      <p>I've always liked that H &amp; M logo. It is somewhere between a fairly restrained script and a traditional sign painters casual. A few others you might like which are closer to the latter category:</p>
      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/eckhardt-speedletter/" rel="nofollow">Eckhardt Speedletter</a><br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/bagraphics/cedar-key/italic/" rel="nofollow">Cedar Key Italic</a><br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/efscangraphic/dom-casual-sh/bold-italic/" rel="nofollow">Dom Casual Bold Italic</a><br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/letraset/challenge-bold/plain/" rel="nofollow">http://www.myfonts.com/fonts/letraset/challenge-bold/plain/</a>Challenge Bold]]<br>
      <a class="freelinking external" href="http://www.houseind.com/index.php?page=showfont&amp;id=23" rel="nofollow">http://www.houseind.com/index.php?page=showfont&amp;id=23</a>|House Industries Sign Painter Collection]]</p>
      <p>What is the second image you posted? Is that the Ikea showcard font? If so that is something else I've always admired. I think it is a custom font of theirs.</p>
