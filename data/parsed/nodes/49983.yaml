      <p>I've always liked that H &amp; M logo. It is somewhere between a fairly restrained script and a traditional sign painters casual. A few others you might like which are closer to the latter category:</p>
      <p><a href="http://www.myfonts.com/fonts/jnlevine/eckhardt-speedletter/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Eckhardt Speedletter</a><br><a href="http://www.myfonts.com/fonts/bagraphics/cedar-key/italic/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Cedar Key Italic</a><br><a href="http://www.myfonts.com/fonts/efscangraphic/dom-casual-sh/bold-italic/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Dom Casual Bold Italic</a><br><a href="http://www.myfonts.com/fonts/letraset/challenge-bold/plain/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.myfonts.com/fonts/letraset/challenge-bold/plain/</a>Challenge Bold]]<br><a href="http://" title="Click to visit an external URL." class="freelink freelink-external freelink-internal">http://</a>|House Industries Sign Painter Collection]]</p>
      <p>What is the second image you posted? Is that the Ikea showcard font? If so that is something else I've always admired. I think it is a custom font of theirs.</p>
