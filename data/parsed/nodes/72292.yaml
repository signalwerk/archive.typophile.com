    <p>Hi Everyone</p>
    <p>I am very interested in the early work of Jan Tschichold. I recently started reading up on Die neue Typographie and many of the other guiding principles behind Tschichold's work. Does anyone have any good online referances for more info on Tschichold, perhaps even some info not too well known or documented. </p>
    <p>Secondly there is a typeface designed by Tschichold called Saskia. Does anyone know if there is a digital version available?</p>
    <p>Thank you<br>
    Gustav</p>
