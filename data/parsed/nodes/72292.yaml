    html: |-
      <p><em>Jan Tschichold, Posters of the Avantgarde</em> (Martijn F. Le Coultre, Birkhäuser, 2007) documents in detail the series of posters that JT designed for the Phoebus Palast in 1927. The posters are fascinating in their simplicity and reduction: often they needed to be designed and printed in only one or two days using the uppercase wooden letterforms that were available.<br>
      <em>Jan Tschichold – Master Typographer: His Life, Work &amp; Legacy</em> (Cees W. De Jong, Thames &amp; Hudson, 2008) shows a range of early work and reproduces the type specimen of Saskia issued by Lettergieterij Amsterdam in 1932.</p>
