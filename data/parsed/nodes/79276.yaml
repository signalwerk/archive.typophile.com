    html: |-
      <p>A problem (for me) with your sample is that there are no upper case letters. Using the structural features of the a, b, e, g and y there were 109 serif families that were potential matches. Many are obviously not close, but because there are many fonts based on old types some could be close, but without seeing the upper case letters (especially E, J, K, M, R, U and W) it is not easy to eliminate many of them. </p>
      <p>Assuming you have a sample that shows many of those, you can use the <a href="http://bowfinprintworks.com/SerifGuide/serifsearch.php" rel="nofollow">Serif Font ID Guide</a> to see if any fonts are close to your sample.</p>
      <p>- Mike Yanega</p>
