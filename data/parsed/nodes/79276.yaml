    html: |-
      <p>I don't think Binney OS is the answer. The tail of the 'y' in Binney is too short, for one thing. Binney isn't old enough, for another, since it was designed in 1908.</p>
      <p>I think Caslon is a reasonable choice, and Caslon has the right Q also. It has been one of the most widely used typefaces for at least 150 years. Caslon was designed in 1725.</p>
      <p>- Mike Yanega</p>
