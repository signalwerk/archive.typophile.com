    <p>I'm looking for help identifying the font used in the introduction to this 1898 book published by George Bell and Sons.  I tried WhatTheFont and didn't find anything close.  I also tried Identifont and it suggested Fleischman BT Pro Bold, which is in the right ballpark but not quite right.</p>
    <p>This should be a link directly to the first page of the introduction:</p>
    <p><a href="http://babel.hathitrust.org/cgi/pt?id=nyp.33433066623293;page=root;view=image;size=100;seq=15;num=v" title="http://babel.hathitrust.org/cgi/pt?id=nyp.33433066623293;page=root;view=image;size=100;seq=15;num=v">http://babel.hathitrust.org/cgi/pt?id=nyp.33433066623293;page=root;view=...</a></p>
    <p>And the whole book is available from Google: <a href="http://books.google.com/books?id=olgCAAAAYAAJ" title="http://books.google.com/books?id=olgCAAAAYAAJ">http://books.google.com/books?id=olgCAAAAYAAJ</a></p>
    <p>Any help you can give me would be appreciated.  Even if you can't help, if anybody has any advice about how to approach a historical question like this one, that would also be helpful as well.</p>
    <p>Sample:<br>
    <img src="http://typophile.com/files/Lower res.jpg"></p>
