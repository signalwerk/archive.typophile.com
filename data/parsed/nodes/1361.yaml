    html: <p>I've been testing some different kinds of fonts in FlashMX 2004 and it looks like the filled-in-counter problem has been fixed! This means that all the various techniques that have been developed to get Flash to behave with pseudo-bitmap fonts are no longer needed (except if you use earlier versions of Flash). This will greatly simplify the creation of such fonts.</p>
