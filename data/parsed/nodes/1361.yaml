  html: <p>I tryed atomicmedias tut to make flash pixel fonts but it didnt work. For the past 1 year ive been making pixel fonts for flash another way which is explained here. <a href="http://www.ex-ess.s-p-a-c-e.co.uk/PixelFonts/" target="_blank">http://www.ex-ess.s-p-a-c-e.co.uk/PixelFonts/</a> <br> <br>But i would like to know how FFF makes their fonts and how they prevent fill in.</p>
