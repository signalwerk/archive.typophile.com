    html: <p>Darryl <br> <br>Test your fonts on the trial of Flash MX 2004, then select your text and push the ALIAS TEXT button, you can edit the grid to 1x1 px to draw with pixels direct on flash too... finally export your swf. <br> <br>mh.</p>
