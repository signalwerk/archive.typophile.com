    html: "<p> Pemberton said: 'Hmm, typographic activism.'  <br> <br>I say: not at all. (Substantive) typographic activism is a whole other thing entirely. <br> <br>----- <br> <br>It's funny to think of Comic Sans as an \"amateur font\". Of course it is far from that, having been produced in and distributed by one of the largest corporations in the world. Run it through TTX and then tell me if you still think it is \"amateur\". <br> <br>I'm not going to argue that what typeface people use to do their typography doesn't matter, because that is a naive and reductive argument. It matters certainly -- up to a point. <br> <br>But really what this comes down to is a foolish exercise that doesn't accomplish anything. If you are motivated to spread the gospel of rational and diligent typography, then you should direct your efforts to something more constructive than deleting fonts on public computers. It's a childish, wannabe-guerilla, watered-down-Adbusters sort of thing to do.   <br> <br>Instead of wasting time with little web sites and clandestine font deleting, why not read some books and then discuss typography in a critical, engaged (and engaging) way? Then you can begin to form a plan of action for promoting typographic progress, right? </p>"
    html_clean: "<p> Pemberton said: 'Hmm, typographic activism.'  <br> <br>I say: not at all. (Substantive) typographic activism is a whole other thing entirely. <br> <br>----- <br> <br>It's funny to think of Comic Sans as an \"amateur font\". Of course it is far from that, having been produced in and distributed by one of the largest corporations in the world. Run it through TTX and then tell me if you still think it is \"amateur\". <br> <br>I'm not going to argue that what typeface people use to do their typography doesn't matter, because that is a naive and reductive argument. It matters certainly -- up to a point. <br> <br>But really what this comes down to is a foolish exercise that doesn't accomplish anything. If you are motivated to spread the gospel of rational and diligent typography, then you should direct your efforts to something more constructive than deleting fonts on public computers. It's a childish, wannabe-guerilla, watered-down-Adbusters sort of thing to do.   <br> <br>Instead of wasting time with little web sites and clandestine font deleting, why not read some books and then discuss typography in a critical, engaged (and engaging) way? Then you can begin to form a plan of action for promoting typographic progress, right? </p>"
  - id: 142144
    user: 1160
    date: 2002-11-05T13:24:00
    date_raw: 5 Nov 2002 — 1:24pm
    votes: null
    html: "<p>First, I take the 'ban comic sans' site for what it is,  <br>humor. It's on the same order as poking fun at Hobo or  <br>creating a mockumentary of Cooper Black. (Although,  <br>using Connare's picture is in poor taste.) <br> <br>This isn't a question of whether Comic Sans has  <br>integrity as a typeface. It's a commentary on fonts in the  <br>hands of amateurs--students, professionals and lay  <br>people alike. This problem isn't new either. How many  <br>times have we seen Apple's Chicago in print (eww). <br> <br>Connare's own comments hit the nail on the  <br>head... (The link I posted earlier was broken.) <br>Read the <a href=\"http://www.microsoft.com/typography/links/news.asp?nid=2648\" target=\"_blank\">article on Microsoft's Typography site</a>. <br> <br>And an excerpt: <br> <br>I have seen Comic Sans used well - Disney has used it in some advertising - and I have seen it used poorly - An English coach line uses Comic Sans as its logo font painted on the side in half meter lettering. I am too personally amused when I go to restaurants and have to read it off the menu. <br> <br>--Vincent Connare <br> <br>In the end, I agree with 'Your Mother.' Deleting fonts on  <br>public or private property isn't going to educate  <br>anybody about good typography. Your energy could be  <br>spent in more productive ways.</p>"
