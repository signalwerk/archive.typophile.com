    date: 2002-11-06T00:58:00
    date_raw: 6 Nov 2002 — 12:58am
    votes: null
    html: "<p><i>&gt; can i use scoles' \"lack of sleep\" excuse?</i> <br> <br>Sure, Isaac! Toss in that excuse whenever you need  <br>it. It sure comes in handy. I think I'll use it now: I  <br>wrote the following on far too little sleep... <br> <br> <br>There are a lot of assumptions being made as to why  <br>the \"Ban Comic Sans\" campaign began. But the  <br>website lists no reasons. No manifesto is posted.  <br>So remember that most of what people here are  <br>responding to is Isaac Stanfield's <i>interpretation</i> of  <br>what the sticker campaign is about. <br> <br> <br>That said, I'm learning a lot from this thread. <br>Two things I do know: <br> <br> <br>1.  If the creator of the campaign intended to <i>incite  <br>dialog</i> about... <br> <br> a. the merits or demerits of Comic Sans <br> b. misguided typeface selection, or <br> c. what signs point to amateurish design <br> <br>...then he succeeded. He's definitely generated a <br>discussion, and that is often the purpose of a  <br>grassroots campaign. <br> <br>Mostly I just think it's funny. People who don't might  <br>have a different sense of humor, but they also might <br>be taking this far too seriously. <br> <br> <br>2. A font's location in the font menu can have an  <br>influence on the user's selection. I know it because <br>I've seen it - more than once. People who don't care <br>or are short on time, rush to the first font that agrees  <br>with them. A font near the top of the menu has a <br>good chance of getting picked. I'm not talking about  <br>designers here, I'm talking about people who do not  <br>earn a living using type. They are people with an  <br>immediate need, whipping out a flyer or sign. Their <br>contribution is still important - these people produce <br>a pretty big part of what the world sees.</p>"
