    html: <p> It's funny, the synchronicity. I work in the graphic design studio at my school and today my professor asked me to delete Comic Sans off of all the computers. Which is something I'd be more than happy to do. I don't think he is aware of the ban comic sans campaign, but I know he is sick of seeing it in his student's work. <br> <br>It's not funny how little my peers think about typography. Most of them think "Typography? That's words, right?" and then they arbitrarily pick a typeface. And these are people who are going to graduate in a month. </p>
