    html: "<p> &gt;&gt; i think because it's closer to <br>&gt;&gt; the beginning of the font menu. <br> <br>&gt; I think this is an asinine reason. <br> <br>It's a bad reason, but it's also true. The same thing at the other end: when a user is looking for a font but runs out of choices, he often chooses Zapf Chancery. <br> <br>&gt; wouldn't a more appropriate solution be to simply educate the students <br> <br>I agree that education is the \"main way\". But deleting is not useless; fewer choices (especially the absense of \"fall-back\" choices) promotes clearer thinking. <br> <br>&gt; it was never meant to be included in the font pack for the public. <br> <br>Hmmm. It's strange how this seems to be a standard excuse or something. John Hudson has said that Sylfaen (which is included with Office2000, but has flawed Armenian and Georgian components) was never supposed to actually ship... <br> <br>-- <br> <br>Tiffany, there is merit to the argument that how you *use* a typeface is central, especially from the viewpoint of a *user* of type. But from the perspective of a *maker* of type, there is very much a good and bad to it (even if it's subjective) - just like you can use a font well or poorly! For example, the letterspacing in Helvetica is *bad*. <br> <br>hhp </p>"
