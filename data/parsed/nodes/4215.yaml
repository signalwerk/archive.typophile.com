    html: "<p> &gt; most people at my school who  <br>&gt; are clueless prefer comic sans,  <br> <br>Isn't being clueless subjective? How do you know that these people aren't trying to target an audience who might appreciate this typeface? It doesn't bother me personally that you do not like it, I just think your reasoning needs a little more work. <br> <br>&gt; i think because it's closer to  <br>&gt; the beginning of the font menu.  <br> <br>I think this is an asinine reason. Do you really think people outside of \"the world of typography\" have no desire to make a statement or visually communicate to others? Isn't that a bit judgmental? <br> <br>&gt; so it's one amateur  <br>&gt; font at a time. <br> <br>Another asinine remark. <br> <br>&gt; today my professor asked me to delete Comic Sans off of all the computers <br> <br>This is one solution to this \"supposed\" problem. But wouldn't a more appropriate solution be to simply educate the students about the typefaces which are not to be used (along with sound reasoning as to why). <br> <br>&gt; students who use it because it's \"cute\" <br> <br>But, if this is the reason they are using it, maybe they feel it communicates cute. Again, subjective. <br> <br>&gt; More interesting is the aviary connection: canard/mapgpie.  <br> <br>Really? :-D How bizarre. <br> <br>&gt; It's funny to think of Comic Sans as an \"amateur font\"... <br>&gt; I'm not going to argue that what typeface people use... <br>&gt; But really what this comes down to is a foolish exercise... <br>&gt; Instead of wasting time with little web sites and clandestine font deleting... <br> <br>Well spoken. <br> <br>&gt; Anybody who strikes down ComicSans based on technical merit is a retard. <br> <br>:-D Totally agree. <br> <br>&gt; aesthetic/cultural <br> <br>What about the fact that this says a lot about the break-down (read: total failure) of the educational system. When I have taught typography/design classes I always give the students a week or two for experimentation. Then when they bring in roughs set in a typeface that is meant for the viewing on a computer, I show them and explain to them why their selection isn't sound. I have had a few students insist they chose the best face and to them I would smile and nod. I cannot design for them, I can only help in the process. It is, after all, their portfolio. <br> <br>&gt; no amount of discussing or proseletyzing <br> <br>This is sad, but true. <br> <br>&gt; but to other students and designers lack of effort and care when they use it <br> <br>For those that do choose poorly their typefaces, well it let's those of us that supposedly \"know\" what we are doing truly shine. (Tongue in cheek) Kinda separating the, ahem, men from the boys. <br> <br>--- <br> <br>When I was in England, Vinnie actually showed me this site. He thought it was hilarious. He knows the font was developed for a children's computer application and it was never meant to be included in the font pack for the public. As Joe pointed out and I've experienced first hand, finding the typeface used in odd situations is a game for Vinnie. <br> <br>I think the ban should be on \"bad communication\" not the poor little unassuming typeface. Typography in the end isn't, as Yer Momma has stated, about the typeface. I think it does play a part. Certainly a typeface can communicate and imply many things. Comic sans is not, perhaps, the most appropriate choice for an airline company. <br> <br>I personally think more time should be spent educating ourselves and helping those that truly do want help. Not wasting energy and time on the details that really don't matter, such as banishing a typeface that doesn't need banishing. <br> <br>Maybe a bit wordy. In the end, it comes down to education and that makes me sad. Sad that instead of trying to educate we are simply becoming boring and dogmatic. Leave poor comic sans, and helvetica for that matter, alone. </p>"
    html_clean: "<p> &gt; most people at my school who  <br>&gt; are clueless prefer comic sans,  <br> <br>Isn't being clueless subjective? How do you know that these people aren't trying to target an audience who might appreciate this typeface? It doesn't bother me personally that you do not like it, I just think your reasoning needs a little more work. <br> <br>&gt; i think because it's closer to  <br>&gt; the beginning of the font menu.  <br> <br>I think this is an asinine reason. Do you really think people outside of \"the world of typography\" have no desire to make a statement or visually communicate to others? Isn't that a bit judgmental? <br> <br>&gt; so it's one amateur  <br>&gt; font at a time. <br> <br>Another asinine remark. <br> <br>&gt; today my professor asked me to delete Comic Sans off of all the computers <br> <br>This is one solution to this \"supposed\" problem. But wouldn't a more appropriate solution be to simply educate the students about the typefaces which are not to be used (along with sound reasoning as to why). <br> <br>&gt; students who use it because it's \"cute\" <br> <br>But, if this is the reason they are using it, maybe they feel it communicates cute. Again, subjective. <br> <br>&gt; More interesting is the aviary connection: canard/mapgpie.  <br> <br>Really? :-D How bizarre. <br> <br>&gt; It's funny to think of Comic Sans as an \"amateur font\"... <br>&gt; I'm not going to argue that what typeface people use... <br>&gt; But really what this comes down to is a foolish exercise... <br>&gt; Instead of wasting time with little web sites and clandestine font deleting... <br> <br>Well spoken. <br> <br>&gt; Anybody who strikes down ComicSans based on technical merit is a retard. <br> <br>:-D Totally agree. <br> <br>&gt; aesthetic/cultural <br> <br>What about the fact that this says a lot about the break-down (read: total failure) of the educational system. When I have taught typography/design classes I always give the students a week or two for experimentation. Then when they bring in roughs set in a typeface that is meant for the viewing on a computer, I show them and explain to them why their selection isn't sound. I have had a few students insist they chose the best face and to them I would smile and nod. I cannot design for them, I can only help in the process. It is, after all, their portfolio. <br> <br>&gt; no amount of discussing or proseletyzing <br> <br>This is sad, but true. <br> <br>&gt; but to other students and designers lack of effort and care when they use it <br> <br>For those that do choose poorly their typefaces, well it let's those of us that supposedly \"know\" what we are doing truly shine. (Tongue in cheek) Kinda separating the, ahem, men from the boys. <br> <br>--- <br> <br>When I was in England, Vinnie actually showed me this site. He thought it was hilarious. He knows the font was developed for a children's computer application and it was never meant to be included in the font pack for the public. As Joe pointed out and I've experienced first hand, finding the typeface used in odd situations is a game for Vinnie. <br> <br>I think the ban should be on \"bad communication\" not the poor little unassuming typeface. Typography in the end isn't, as Yer Momma has stated, about the typeface. I think it does play a part. Certainly a typeface can communicate and imply many things. Comic sans is not, perhaps, the most appropriate choice for an airline company. <br> <br>I personally think more time should be spent educating ourselves and helping those that truly do want help. Not wasting energy and time on the details that really don't matter, such as banishing a typeface that doesn't need banishing. <br> <br>Maybe a bit wordy. In the end, it comes down to education and that makes me sad. Sad that instead of trying to educate we are simply becoming boring and dogmatic. Leave poor comic sans, and helvetica for that matter, alone. </p>"
