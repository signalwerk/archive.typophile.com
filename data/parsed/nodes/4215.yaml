    html: "<p> here's the deal. i didn't mean to sound like that was my web site. i didn't make it, and i don't know who did. i'm just a believer. my passion for hating comic sans is a healthy (i hope) blend of satire and frustration. i'm a design student, graduating in december, and i'm completely bewildered by other students who use it because it's \"cute\" or whatever reason they give. like, lewis, i think it's just an arbitrary decision on their part, as if typography is some kind of minor detail they slap on their project at the last minute. that offends me. here's a funny story from school: i was in the library looking for a specific book for my typography class and couldn't find it. i went to ask the person at the desk (ostensibly a librarian, but...) to help me find a book on typography. she said (and this is an exact quote), \"a book about typing? let's see...\". typing? typography! gee my krug! anyway, like lewis' prof, i just get so tired of seeing it when there are so many other options.  a lot of my message also goes to the administartive offices at school. i don't know if they think we like it or what, but there are always notices and announcements on the bulletin boards set completely in comic sans, and sometimes they get fancy and go with corsiva. <br>fonts i like? that's a huge can of worms, as you can imagine. my first love was univers (don't laugh) just because it's so simple and consistent through all of it's weights. i dig a lot of zuzana licko's stuff, and local heroes thirst have some cool stuff. btw, be on the lookout for ex-thirst designer patricking's new font next year. he gave me a sneak peek at it a while back. it's based on some herbert bayer sketches, so obviously it's going to be, y'know, bayerish, but i love it so far. also, some of the fonts i've seen in the critique boards here have blown me away. off the top of my head: review beta by jared benson and pill gothic by christian robetson. <br>i feel like hrant with this ultra-long post. so bj, i hope you don't think i'm going to assassinate vince. i really am a nice guy. if you're ever in chicago i'll prove it. you can stay at my place if you need to (sorry, not in my bed. my wife has that spot), or i'll just make you some cinnamon rolls or something. </p>"
