    html: <p> such passion, everyone! so, due to my laziness and the fact that i had to catch a train, i didn't properly express myself. <br> <br>&gt;TYPOGRAPHY IS NOT ABOUT FONTS. TYPOGRAPHY IS NOT ABOUT COMIC SANS. TYPOGRAPHY IS NOT ABOUT YOUR PRESENTATION ABOUT THE HISTORY OF SANS SERIFS. <br> <br>of course i don't think typography is about my piddly presentations, i was juxtaposing the passion some people have for learning as much as possible about type and others who couldn't care less about the difference between times new roman and helvetica. <br> <br>&gt;&gt;students who use it because it's "cute"  <br> <br>&gt;But, if this is the reason they are using it, maybe they feel it communicates cute. Again, subjective. <br> <br>again, my laziness. i forgot that you all haven't seen it in the contexts i reference. comic sans on a hip hop cd cover? i reckon not. i've inquired as to the use of this font during critiques, and generally the answer is, "it's cute", or, "i just thought it worked." so there really isn't any attempt to communicate any sort of feeling or vibe, it was just there. <br> <br>&gt;&gt;i think because it's closer to  <br>&gt;&gt;the beginning of the font menu.  <br> <br>&gt;I think this is an asinine reason. Do you really think people outside of "the world of typography" have no desire to make a statement or visually communicate to others? Isn't that a bit judgmental?  <br> <br>i was referencing fellow students, not the public at large. recent sightings of projects using comic sans include the above mentioned hip hop cd cover, a menu for a fancy restaurant, as part of a personal logotype (hey, it's your logo), and as body copy in a magazine mock-up. appropriate? <br> <br>&gt;&gt;so it's one amateur  <br>&gt;&gt;font at a time.  <br> <br>i admit, that was an asinine statement. can i use scoles' "lack of sleep" excuse? <br> <br>in the end, my fun little steam-letting-outing sticker game served as a poor introduction to people whose abilities and opinions i have come to respect as i've been perusing these boards. maybe the all powerful moderators can just delete this whole thing i can start again. <br> <br>tiffany - asinine? i haven't been called that in ... well, at least a couple of days. but i agree with you anyway. </p>
