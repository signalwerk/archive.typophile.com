    html: <p> &gt;why not read some books and then discuss typography in a critical, engaged (and engaging) way? <br> <br>there is nothing i would like more in the world than to do just that, and that's why i love this website and have a deep appreciation for those who created it and run it. i can't speak for anomonis (is that supposed to be anonymous?), but that is a big part of the reason i'm frustrated. hrant is right when he says people who actually like and have a knowledge of type generally do not use comic sans. discussions in my typography classes generally boil down to me, the instructor, and one or two others actually participating and the rest of the students staring with mouths agape. once i gave a brief (20 minutes) presentation on the history of sans serif fonts and the class was bored to the point of insanity. maybe it was me. as far as the deletions, i agree with hrant and anomonis both. there is an ethical problem anytime you take someone's agency away, but at the same time, my experience has shown me that no amount of discussing or proseletyzing (and i've done tons of both) can change someone if they don't want to be changed. deleting offensive fonts may be the only recourse some people see. and when i say offensive, i'm referring not only to my opinion of the aesthetics of it, but to other students and designers lack of effort and care when they use it. i love typography, and when someone shows it so little respect, i get offended. <br> <br>btw, my participation in the sticker campaign is mostly just a lot of fun. </p>
