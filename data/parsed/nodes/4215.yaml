    html: "<p> But Isaac, you don't seem to see the point. Bluntly: TYPOGRAPHY IS NOT ABOUT FONTS. TYPOGRAPHY IS NOT ABOUT COMIC SANS. TYPOGRAPHY IS NOT ABOUT YOUR PRESENTATION ABOUT THE HISTORY OF SANS SERIFS. You are not seeing the forest for the trees.  <br> <br>And Hrant said: \"Come on, large corporation mess up typography all the time.\" <br> <br>Hrant, you missed my point. I was responding to the person who said Comic Sans was an AMATEUR font. It is as far from AMATEUR as you get. You may think the letters in the font are ugly, but that is another thing entirely. It was made by a guy who was PAID to DESIGN TYPE. </p>"
