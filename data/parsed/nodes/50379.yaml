    html: |-
      <p>You know, when I started out, I thought “tabs are for typewriters, we have computers now” and I used to try to work with paragraph indents in styles. But that just led to a population of multiple parent/child paragraph styles. Not to mention the fact that I was constantly having to remove the tabs that copywriters and editors were putting in their copy (silly editors ;-). And then applying all these multiple paragraph styles. </p>
      <p>Needless to say, it didn’t take long to see the error of my ways. Fancy-schmancy; simple is better.</p>
      <p>Now, on the off-chance that I get a manuscript without tabs, all I have to do is search for paragraph breaks and replace with  para break + tab. Then remove the few that come after a heading. Not too onerous.</p>
      <p>— K.</p>
