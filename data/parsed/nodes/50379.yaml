      <p>I’d second what Kent says. Been doing it that way for 25 years, seems to work fine.</p>
      <p>You can set the tab position in your paragraph style(s), so each time you hit the tab, you will get the indent. And of course, with different paragraph styles, you can have a different indent value. I frequently use 1 pica for a text paragraph indent, but 1 em (further) for an extract paragraph indent.</p>
