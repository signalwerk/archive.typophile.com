      <p>Hi Žydrius,<br>
      as far as I know, the answer is no. Maybe there’s something new in CS4?</p>
      <p>I use a little workaround that is almost as fast as having only one style:</p>
      <ul>
      <li>set up two paragraph styles: one without indent (#1), one with indent (#2)</li>
      <li>within the style options for #1, set the ‘next’ parameter to ‘#2’</li>
      <li>select all your text and ‘apply paragraph style #1 and then next’*, via a right-click (control-click) in the paragraph style palette</li>
      </ul>
      <p>*) I don’t know how the exact wording is in the English version<br>
      F</p>
