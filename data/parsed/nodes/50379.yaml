      <p>The simplest way to achieve this, in my opinion, is the good old-fashioned way. One paragraph style for your basic text style. Include a tab position at the first indent. Use a tab at the beginning of every paragraph except the first one. Seems unsophisticated, I know. But after years of trying to be fancy about it, I realized that simplest is best. </p>
      <p>— K.</p>
