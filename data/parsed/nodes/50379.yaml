      <p>The above works fine as long as you have simple text: no subheads, no spacebreaks, no extracts where the following text does not begin a new paragraph, no lists with the same as above, etc. etc. Which is why Kent &amp; I &amp; others use the tab.</p>
      <p>If you only had one paragraph per chapter to fix, I can’t shed many tears.</p>
      <p><cite>There should be timesaver for good typography:)</cite></p>
      <p>It has been my experience that most “timesavers” actually hinder good typography. Those time savers make assumptions that might fit one person’s needs, but get in the way of others. YMMV.</p>
