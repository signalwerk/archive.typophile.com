    <p>I am proposing a single weight typeface for an identity I have designed and have drawn the alphabet in illustrator.</p>
    <p>The intention is to learn fontographer (very quickly) to allow us to use the typeface for the project.</p>
    <p>The question is then, how difficult is fontographer to get going without any help or time to understand the ins and outs of the program. I realise this is in some respects a silly question. I just need someone to be honest with me with regards to whether this is going to work out. I’ve got about a week before something goes to print.</p>
    <p>Cheers,</p>
    <p>Marc</p>
