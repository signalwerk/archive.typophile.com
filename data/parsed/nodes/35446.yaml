      <p>I have jumped into fontographer and managed the basics, a tip – when transferring the glyphs from illustrator to fontographer is to have a box of the same size around each character (probably based on cap M with ascender and descender heights and slightly larger), otherwise fontographer will scale each character, remember to delete the boxes after importing. Good luck, I’m sure that more qualified users will be able to help with most problems, especially in the Build forum.</p>
      <p>Tim</p>
