    html: <p>If the initial item going to press doesn’t require a lot of text using this font (a couple of short lines, maybe), you could just place the Illustrator images of the necessary letters in your layout and kern by shifting their boxes. Of course you’ll still want to make a proper font of it, but this might be a quickie method to meet your press deadline for the moment.</p>
