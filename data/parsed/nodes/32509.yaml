    <p>So in school they teach us how to set type, but they dont teach you how to use the programs.</p>
    <p>Cut the rambling short, what is the base line grid, and what do I use it for? </p>
    <p>Ive scoured the internet which brings up a bunch of crap. </p>
    <p>Im sure most of you typophiles out there know how to utilize it. I would love any insightful information. </p>
    <p>Cheers</p>
    <p>James</p>
