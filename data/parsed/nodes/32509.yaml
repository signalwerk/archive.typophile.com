    html: |-
      <p>Rather than the position of the baseline being determined in relation to a text box, baseline grid determines it in relation to the page, and, when it's on, overides any leading value applied within text boxes.</p>
      <p>It's a good way to get the type in adjacent columns to line up with one another.</p>
      <p>If you set 9/10, but the grid is 14, you get 9/14. If you set 9/14.5, you get 9/28.</p>
      <p>A good trick is to set the grid to half your leading. That way you can do stuff like applying extra between-paragraph leading with a value equal to the baseline grid.</p>
