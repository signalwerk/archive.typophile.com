    html: |-
      <p>(James, it's quite debatable whether you are actually being taught to set type if you're not being taught to use the baseline grid functions for either Indesign or QuarkXpress). </p>
      <p>Here are a couple of screenshots from some classes I've done.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Indy-grid_5635.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/QXD-grid_6323.jpg"></div><p></p>
      <p>The second example (from a magazine I worked on in the early 1990s) demonstrates both the second and the last points that Nick makes above – the standfirst paragraph at the top has a leading value that takes the text baselines to every <em>other</em> line of the baseline grid. The adjacent column baselines at the bottom of the picture align perfectly at top and bottom of the column height.</p>
      <p>I also often suggest that commonly-recurring negative spaces within a publication (e.g. picture box runarounds, column gutter values and inter-paragraph spacing) are best worked out as multiples of the baseline grid/main text leading value.</p>
      <p>There is also a rather scant mention of the baseline grid in a downloadable .pdf tutorial from Computer Arts at<br>
      <a href="http://www.computerarts.co.uk/tutorials/2d__and__photoshop/editorial_type_design" title="http://www.computerarts.co.uk/tutorials/2d__and__photoshop/editorial_type_design">http://www.computerarts.co.uk/tutorials/2d__and__photoshop/editorial_typ...</a></p>
