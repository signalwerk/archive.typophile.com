    html: |-
      <p>Is it any help at all that Molling used flatbed printing? Probably not.<br>
      By the way, there is a Merz picture entitled Merz Mosaic of Quartered Ornaments (now at the Sprengel), dating from 1924, a grid-based composition made up of letterpress blanks. Isabel Schulz suggest KS made this while working on Merz 7, and a variation of the picture is to be found in Merz 7 itself:<br>
      <a href="http://sdrc.lib.uiowa.edu/dada/merz/7/pages/70.htm" title="http://sdrc.lib.uiowa.edu/dada/merz/7/pages/70.htm">http://sdrc.lib.uiowa.edu/dada/merz/7/pages/70.htm</a><br>
      - it's difficult to imagine the blanks came from anywhere else than Molling.<br>
      It has also been suggested that Schwitters used lithographic stones from Molling to produce the Merz Mappe, or Merz Portfolio, of 1923. Sorry this doesn't answer your question, but its easy to get diverted with Schwitters...</p>
