    html: <p>Yes, I do know this fantastic work. It is somewhat possible it was made at Vogt, though, since that is where they typset Die Scheuche. But Molling is very likely too given the date. Edel Sheridan-Quantz has done a great deal more research on Molling in the mean time. Do you know her work? She published an article in the KSUK newsletter about Schwitters and Molling.</p>
