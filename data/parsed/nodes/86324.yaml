  html: |-
    <p>Can anyone help me to identify the fonts used by Kurt Schwitters for the covers and inserts of his Merz journal? I'm interested not only in the font he used for the title (which has been a previous topic on this forum in 2008, though unsolved) but also the fonts used for the 5 and the 7 (below) and the ARP MAPPE subheading.</p>
    <p>I am fairly certain he printed from wood type. And I know that he, and that he printed this Merz portfolio at the A. Molling print shop in Hannover, also affiliated with the typesetter Paul Vogt in these years (of PEUVAG Druckerei).  </p>
    <p>Even if the fonts can't be identified exactly -- any insight into what typefaces Molling's shop might have had on hand? And where were they likely cut? </p>
    <p>Thanks</p>
