      <p>This is a really interesting question, which I hadn't thought about up to now. Later Schwitters used Paul Renner's Futura, but the Arpaden date from 1923, I think, so far too early for that. You could try mailing the Schwitters archive at the Sprengel Museum in Hannover (Dr Isabel Schulz is the contact) and asking there. Please keep me updated on this and I'll seee if I can't do a bit of research myself.<br>
      Regards,<br>
      Gwendolen Webster</p>
