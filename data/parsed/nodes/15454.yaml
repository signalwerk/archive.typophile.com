      <p>Robin Kinross has compared Mrs Eaves to a loose bicycle. My own favorite comparison involves a beautiful woman with a serious speech impediment. One shameful thing is to have coupled such superb letterforms with such horrid spacing. Another shameful thing is that so few designers who use it are paying attention.</p>
      <p>hhp</p>
