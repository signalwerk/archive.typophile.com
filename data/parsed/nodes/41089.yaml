    date: null
    date_raw: null
    votes: null
    html: |-
      <p>I sent the following message using the FDA's feedback form. We'll see if it gets anywhere:</p>
      <blockquote><p>Just thought I'd alert you to an error on your "Examples of Revised Nutrition Facts Panel" page. You rightly recommend Helvetica Black for the headline font, but the one used in your example is the poorly designed Arial Black. Here are examples of the two typefaces:</p></blockquote>
      <blockquote><p><a href="http://shurl.org/nutrition-facts-helvetica" title="http://shurl.org/nutrition-facts-helvetica">http://shurl.org/nutrition-facts-helvetica</a></p></blockquote>
      <blockquote><p><a href="http://shurl.org/nutrition-facts-arial" title="http://shurl.org/nutrition-facts-arial">http://shurl.org/nutrition-facts-arial</a></p></blockquote>
      <blockquote><p>I'm a professional typographer and I'm happy to typeset new example images for your page if you wish.</p></blockquote>
