    html: <p>They say "Helvetica Black or Franklin Gothic Heavy", but the font used for "Nutrition Facts" is Arial. Whoops!</p>
    html_clean: <p>They say "Helvetica Black or Franklin Gothic Heavy", but the font used for "Nutrition Facts" is Arial. Whoops!</p>
  - id: 252862
