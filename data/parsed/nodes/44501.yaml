    <p>Hi, I’m just starting my final major project in my art and design course at college and I’m at a blank for ideas. Everyones work is gong to be put up for exhibition in a few months time and I would really like to do something that is eye catching and interesting even to people that don’t really have an interest in typography. If anybody could give me some ideas it would be greatly appreciated as I’m really struggling and I’ve got to send off a statement of intent in a few days. Thankyou in advance to anyone that replies.</p>
