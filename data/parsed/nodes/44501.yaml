      <p>If you want to show off both your own skill and the potential for good typography you could work on existing, well known, but poor examples of typography and improve them.</p>
      <p>This would serve to both to be interesting in it’s own right and to be accessible to non-typographers as they would have a point of reference from which to start.</p>
