      <p>Typerror and Bert both make good points...and I would suggest you definitely check your kerning on GUERRIZMO. I would also maybe bump up the weight of the rest of the text, because it looks mighty thin compared to your heavy type logo. For the G on the back, have you thought about using the same type as you have on GUERRIZMO? Throwing in a third typeface, like you have done, really separates the card into a Front and Back, instead of seeing this card as one complete unit.</p>
      <p>Good luck!</p>
