      <p>Twer it me typedog, I would standardize the spacing between the letters (give them some air), and then I would futz with the "counters," or interior spaces (open them up!!!), to reflect the spacing. That may counter the unfortunate double r's and z which unfortunately bring quite a bit of space to the equation. What I am saying is that there needs to be some daylight! You could probably heavy up the horizontals of the z's a tad also.</p>
      <p>Michael</p>
