    html: |-
      <p>Well lets see, the original languages were Hebrew, Aramaic and Greek.</p>
      <p>Since then it has been translated into many languages.  Latin was common for western civilization and many monks spent years illuminating latin bibles.  Gutenberg printed bibles in german, which have been compared in quality to existing german manuscripts (in blackletter) so I imagine after that german manuscripts became popular as well.</p>
      <p>I think by the time the english bible came into existence, the era of hand-written manuscripts was over.</p>
      <p>What did the pages look like: where they all text, or did they have colour or illustration on them.  I think of the Book of Kells first when you said this.</p>
      <p>A blackletter bible would also be easy to recognize because of the unique script used.</p>
