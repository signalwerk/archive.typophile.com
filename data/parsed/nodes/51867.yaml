  - id: 315702
    user: 14604
    date: 2008-12-01T13:49:00
    date_raw: 1 Dec 2008 — 1:49pm
    votes: null
    html: |-
      <p>I feel like doing a long post. ;)</p>
      <p><em>Lowercase:</em></p>
      <p><strong>a:</strong> Left side of top terminal has a strange bulge on it. Could use smoothening. I also don't like the bowl. Consider making the top part of the bowl more like how the bowl on the b joins the stem (i.e. bending slightly downwards and slimming down). The a is currently the only character that has such a bowl. Also the only top terminal that is diagonal.<br>
      <strong>b:</strong> I would lose the bottom serif on the b aswell.<br>
      <strong>c:</strong> The top terminal of the c is also bothering me a bit. Consider changing it so that it doesnt bend down as much as it does now (so make the top more like the bottom, but with a serif). Terminal serif maybe a bit short?<br>
      <strong>d:</strong> The bottom join of the bowl to the stem needs some more space, exactly like you did on the u.<br>
      <strong>e:</strong> It looks like the e is slightly rolling to the left. It probably only needs a tiny bit of tweaking here and there to counter this. I'm also not sure about the vertical cut-off on the bottom terminal, although it doesn't really break style or anything like that.<br>
      <strong>f:</strong> Try to bring the crossbar to the x-height. I understand why you placed it lower (I've done it too), but I don't think it's necessary in this case. Could it also have a similar top terminal as a and c?<br>
      <strong>g:</strong> Interesting shape, I do like it, but it needs some polishing. Eliason is probably right; it might be a bit too interesting for this typeface.<br>
      <strong>h:</strong> Might be slightly too narrow.<br>
      <strong>i:</strong> See 'u'<br>
      <strong>j:</strong> See 'u'<br>
      <strong>k:</strong> Top stroke is too heavy. Bottom one should be heavier than top one. I also think the k is too wide.<br>
      <strong>m:</strong> Might be slightly too narrow.<br>
      <strong>n:</strong> Might be slightly too narrow.<br>
      <strong>p:</strong> Bottom serif on the side of the bowl could be longer (to the right) This makes the letter stand stronger on it's 'feet' (your r has exactly what I mean).<br>
      <strong>q:</strong> Use it as reference for the b.<br>
      <strong>r:</strong> The ear is way too long. It needs to be at least 50% shorter.<br>
      <strong>s:</strong> The spine (the middle, diagonal part) needs to be heavier. It has to have the same optical (not mathematical) weight as your heaviest available stroke.<br>
      <strong>t:</strong> Crossbar, see f. Also the vertical cut-off again on lower right, looks kind of harsh.<br>
      <strong>u:</strong> The pointed tops of the u extend above the x-hight (overshoot). Yet, you don't do this on the i, j, m, n, p and r. Probably better to make that consistently the same. It can probably use some overshoot, judge by eye.<br>
      <strong>v:</strong> I can't really decide, but it looks like it might be slightly too wide. Also a bit of balance, i.e. it leans to the right.<br>
      <strong>w:</strong> Can't judge it well, can't seem to find any in the lipsum texts. Middle apex might be leaning to the right.<br>
      <strong>x:</strong> Looks pretty good, although the lines crossing each other needs to be optically corrected. See <a class="freelinking external" href="http://typophile.com/node/51421" rel="nofollow">this thead</a> for what I mean.<br>
      <strong>y:</strong> Also pretty good, although the tail is quite fragile.<br>
      <strong>z:</strong> Is a bit heavy, because of the horizontals.</p>
      <p><em>Uppercase:</em></p>
      <p><strong>A:</strong> The left stroke is heavier on the top than on the bottom (it flares). Also the crossbar may be a bit too high. It does not need to be the same as the e etc., make it optically right. I feel it should be a bit lower. Look at weight of crossbar.**<br>
      <strong>C:</strong> Compared to the O and Q, the D might be narrow.*<br>
      <strong>D:</strong> Compared to the O and Q, the D might be narrow.*<br>
      <strong>E:</strong> Look at weight of crossbar.**<br>
      <strong>F:</strong> Look at weight of crossbar.**<br>
      <strong>G:</strong> Compared to the O and Q, the D might be narrow.*<br>
      <strong>H:</strong> Can't judge it in context, but it looks a bit narrow. Look at weight of crossbar.**<br>
      <strong>K:</strong> Same critiques as with the lowercase k. Top arm a bit too heavy. Character width needs looking at.<br>
      <strong>P:</strong> Maybe it looks better if the bottom part of the stroke - where it joins the stem - slightly thins down. Also the heavy part of the bowl seems to be on the bottom right, while for the rest the weight is mostly vertical.<br>
      <strong>R:</strong> I would probably attach the leg/tail directly to the 5-o-clock position on the bowl, instead of making it come from the stem (so bascially an edited P with a leg/tail).<br>
      <strong>S:</strong> Too much weight on te shoulders (the two parts that look like hooks :p ), the weight should be on the spine. See lowercase s comments.<br>
      <strong>V:</strong> See lowercase v comments.<br>
      <strong>W:</strong> Much too narrow. Proportion the V and W to each other like you did with the lowercase.<br>
      <strong>X:</strong> See lowercase x comments.<br>
      <strong>Z:</strong> See lowercase z comments. Look at horizontals.**</p>
      <p>* If you want classic proportions.<br>
      ** Should probably be optically the same weight.</p>
