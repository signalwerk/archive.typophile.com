      <p>This is working well. Suggestions:</p>
      <p>I'd raise your t's crossbar.<br>
      Maybe widen the h (and perhaps u/n)?<br>
      Looks like X wound up a touch short.<br>
      The g is attractive but might be a little too bouncy in character for this crisp font.<br>
      The S looks almost monoline - I would make its thins thinner. R gets too thick in the middle, too.<br>
      r seems a little heavy, and s seems a little light.<br>
      The top terminal of c and r need some work.<br>
      Consider losing, or changing, the bottom serif of the b.</p>
      <p>Hope that helps.</p>
