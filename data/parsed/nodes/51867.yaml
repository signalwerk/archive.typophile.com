    <p>This is my first attempt at a serif text typeface. This is by no means anything super original (in fact, it seems to have some similarities with Alex Heilmair's lovely Paulista Serif a few posts below). I just wanted to try doing something that actually looked like it might be able to hang out at a fancy party with Garamond and Charter and not run home crying because it's not classy enough. </p>
    <p>After looking at it closely, I see several problems, and I'm hoping you can point out anything else that looks weird or inconsistent (either within the typeface or with common practice).</p>
    <p>• The curves in the "S's" seem a  bit heavy<br>
    • The "B" and the "R" need some refinement in the curves<br>
    • the lowercase "a" looks a little weird. This was my first attempt at a two story "a" and something just doesn't seem right, but I'm not sure what.<br>
    •&nbsp;this was also my first attempt a lowercase "g" and it looks pretty good, except I'm thinking that maybe the stroke in the bottom half is a little thick</p>
    <p>thanks!</p>
    <p>Jonathan</p>
