  html: <p>Thanks for glancing at this. Our current logo is a bit complex so we're trying to transition to a simpler high-contrast idea, also we'd like to migrate from the full name (new life campus fellowship) to just the letters as a standalone name. It's a inter-denominational university church if that helps. <br> <br>Here's a few first rough steps in freehand, I'd love your input on how I should get started. My inspiaration is 50's countertop modernist retro feel. <br> <br>How do I keep it from being too comical? <br> <br><img src="http://www.typophile.com/forums/messages/29/35014.gif" alt="FIRST WAVE"></p>
