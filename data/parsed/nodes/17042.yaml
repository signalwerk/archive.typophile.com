      <p>I like the notion of making one logo combining the feeling of the old but ugly "Intel Inside" mark withe the basic intel logo to create one brand.  I actually like the new type except for the "e" which looks like straight AG and does not marry well with the rest.  I do miss the dropped positioning of the e but wonder if it would work in that new configuration.<br>
      The big thing is that, branding speak aside, I don't think it shows any "change in direction" or any of the tired old "feeling of movement".<br>
      It seems like in today's world, you "rebrand" every 30 days whether you need it or not--kinda makes the Vice President for Marketing feel very important.</p>
      <p>ChrisL</p>
