      <p>i think it is time for some of these executives to get their heads out of their asses and start opening their minds to the kinds of things that innovative design consultants have to offer these days. there is so much talent in the design community and some of the biggest, most influential companies are letting their indentities go down the toilet with these tired, overused design clichés. i am totally blown away and left with a feeling of great disappointment.</p>
      <p>i recently reviewed the threads here and on Speak Up regarding the AT&amp;T (or at&amp;t) rebrand and although <em>that</em> was controversial, this brings us to a new low. i'm sorry, but the fact that a company like this will go for something this bad is bad for us all.</p>
      <p>Chris– i agree about the fact that ego plays a huge role in most of these re-brands. i just hope that some of these corporate big wigs start to realize that good strategy and good business are more important things to take pride in.</p>
      <p>------------<br>
      nc</p>
