    <p>Intel has announced a new logo. This is a page with an example.</p>
    <p><a href="http://abcnews.go.com/Technology/wireStory?id=1454402" title="http://abcnews.go.com/Technology/wireStory?id=1454402">http://abcnews.go.com/Technology/wireStory?id=1454402</a></p>
    <p>And this is the Intel CEO saying "When Eric asked me if I had any sacred cows, I said no. He asked, what around the dropped "e"? And I said if it makes sense, it's time to do it. He was given pretty free rein to change. </p>
    <p>And when I saw [the new logo], it just jumped out at me. It reflected that change, where we want to go. There's a feeling of movement around [the new logo], and the tag line "Leap Ahead" certainly reiterates that."</p>
    <p><a href="http://www.businessweek.com/magazine/content/06_02/b3966009.htm" title="http://www.businessweek.com/magazine/content/06_02/b3966009.htm">http://www.businessweek.com/magazine/content/06_02/b3966009.htm</a></p>
    <p>And there you have over 30 years of brand equity and recognition swooped away.</p>
