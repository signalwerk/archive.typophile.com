    html: <p>'Leap ahead' seems to me a most unfortunate tag line. 'Ahead' suggests a highway warning of some kind, that one is going to encounter something ahead if one keeps going. And what is one going to encounter? A leap. What kind of leap? A leap over something? Alarming, but presumably survivable. Or a leap into something? An abyss perhaps.</p>
