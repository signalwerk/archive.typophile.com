      <p>definitely not american typewriter.<br>
      actually, this seems to be more special than it looks like. first off, i thought of some kind of bold condensed clarendon for the lowercase t has a classical appearance (chamfered top and upward ending). but the “stiftung warentest”-font has much less stroke contrast.<br>
      maybe, this one is a custom-built logo typeface. but let’s hear other members’ opinions.</p>
      <p>// alex</p>
