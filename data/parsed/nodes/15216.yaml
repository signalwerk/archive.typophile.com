    <p>Hello,</p>
    <p>me as well as WhatTheFont keep failing on this one. It seems it is *not* American Typewriter Condensed Bold, what else could it possibly be? The logotype represents the german Stiftung Warentest (<a href="http://www.test.de" title="http://www.test.de">http://www.test.de</a>).</p>
    <p>Any help appreciated :)</p>
    <p>Thanks in advance,</p>
    <p>Victor</p>
