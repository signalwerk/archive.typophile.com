    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Jawi Workshop_3476.jpg"></div><br>
    Jawi has been an integral part of the Malay culture since the dawn of Islam in the Malay Archipelago region. It shaped the identity and distinction of the Malays in the past. Jawi also acts as a link between culture and religion as the Arabic letters are being used in the Holy Quran.<br>
    However, Jawi has been losing its relevance due to the modernisation of culture and the introduction of the Romanised Bahasa Melayu (Rumi). Thus, let us now take baby steps to recognise Jawi rekindle our love for this art.<br>
    Conducted by brother Hazrin Mohamad, founder and creative director of HAZWORKZ, the Art Of Jawi Workshop aims to explore a more contemporary aspect of Jawi where the idea of Jawi calligraphy will be introduced. Besides that, basic reading and writing of Jawi will be taught as well. You can visit Haz Workz fb page to his works and art. Its Facinating!!!<br>
    So, what are you waiting for? Come on down and join us to grab this "exclusive" chance towards rediscovering our heritage as well as the revival of Jawi!<br>
    Details<br>
    PROGRAM ITINERARY<br>
    10.00 am – 11.15 am Introduction of Jawi Alphabets &amp; History<br>
    11.15 am – 12.00 pm Break (Short Brunch)<br>
    12.00 pm – 12.45 pm Introduction of Jawi Calligraphy<br>
    12.45 pm – 13.00 pm Short Break<br>
    1.00 pm – 2.00 pm Continuation of Calligraphy<br>
    2.00 pm End of event<br>
    PURCHASE OF TICKETS<br>
    RSVP on our event page (<a href="https://www.facebook.com/events/731627836933067" title="https://www.facebook.com/events/731627836933067">https://www.facebook.com/events/731627836933067</a>) and email your details directly (full name and contact number) to <a href="mailto:mcms@mymail.sim.edu.sg">mcms@mymail.sim.edu.sg</a>. We will then get in touch with you on how to proceed with payment<br>
    Should there be any enquiries, you may leave a direct message to our FB page or contact Bro Faiq at 9684 2660.<br>
    Location:<br>
    Singapore Institute of Management HQ, 461 Clementi Road Singapore 599491<p></p>
