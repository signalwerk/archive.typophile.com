    date: 2012-09-12T20:35:00
    date_raw: 12 Sep 2012 — 8:35pm
    votes: null
    html: |-
      <p>I can't be sure that missing the 'MSVCR100.dll' is the only problem, but it is a sufficient problem. The issue is that the FDK is compiled with an older version of the Microsoft compiler tools, in order to be compatible with Windows XP.  Windows 7 no longer includes this library.   I thought I had solved this, by compiling this library into the autohint program, but this is obviously not the case. You can work around this by downloading the file, and copying it to:<br>
      C:/Windows/system32/</p>
      <p>You can just google "MSVCR100.dll download"<br>
      but it can certainly be downloaded from:<br>
      <a href="http://www.microsoft.com/en-us/download/details.aspx?id=5555" title="http://www.microsoft.com/en-us/download/details.aspx?id=5555">http://www.microsoft.com/en-us/download/details.aspx?id=5555</a><br>
      Please download and install this file, and then let me know if you still have a problem</p>
