      <p>I see that you have installed the new FDK scripts for FontLab macro's, and I assume that you also updated the shared script files under Macros/System/Modules - in any case, if you used the script 'FDK/Tools/FontLab/installFontLabMacros.py' the installation will be correct.  In this case, I do not know of a reason to have the problem you report. Would you be willing to  post your vfb file for me to look at? You could perhaps make a small subset font to make it easier to send. If so,  send me a zip file at <a href="mailto:rroberts@adobe.com">rroberts@adobe.com</a>. Please rename the extension to 'adobe' - that helps avoid problems with the firewall.</p>
      <p>Also, what version of Python  of FontLab, and which OS ( Mac or Windows) are you using? </p>
      <p>- Thanks,  Read</p>
