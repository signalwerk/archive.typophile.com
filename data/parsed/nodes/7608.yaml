    html: |-
      <p>Hello Mr Ellertson, indeed class kerning's merits are at the same time its downsides. It is on the type designer to make good use of the possibilities which the technology offers, e.g. to care for diacritic. (This is best addressed in two ways: by defining exceptions to class kerning where necessary, and by designing diacritic marks such that they do not require too much space and so avoid collision at least in some cases.)<br>
      Personally, I would not dare touch an OpenType font's kerning information because I do not know the logic by which classes are made. </p>
      <p>(As regards document reflow: I have spent some thoughts about how an InDesign implementation might look like. I can think of a solution which does not not change the kerning if the according user-defined kerning preference file is not present. And I think the way these kerning pairs are defined can be done more comfortable than in XPress' and Cool Kerning. The latter, however, does a very good job, because it only uses existing interface elements, and also avoids document reflow in case that the plugin is absent.)</p>
