      <p>AFAIKT Adobe *is* <em>eager to make their product even better</em>, and all input towards that is welcome. But, this thread didn't start as a <em>customer suggestion</em>, neither your revisitation of the topic sounded like one. But I agree that it is turning into a customer suggestion, for which I'm thankful that you brought it up.</p>
      <p>My replies were simply my interpretation of why a kerning tables feature isn't available in InDesign, and certainly do not express the reasons behind what went into the decision of not adding it. (FWIW, InDesign has been around longer than I've been working for Adobe)</p>
      <p>Having said that, I think it's time for all of us to steer this thread into the right direction (or start a new one), and contribute constructively for the discussion.</p>
      <p>Thanks!</p>
