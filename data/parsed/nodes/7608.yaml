      <p>I wouldn't hold my breath for such feature. I understand that this was an important add-on back in the day when fonts were constrained to a limited number of kerning pairs, but nowadays?!...<br>
      If the font is lacking an obvious kern pair, or is kerned too tight, you can almost certainly call it a bug. And the job of layout applications is to provide the fonts "as is"; layout applications are not the right tools to fix fonts.</p>
