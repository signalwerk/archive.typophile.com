      <p>A few thoughts on this:</p>
      <p>Spacing/kerning should be as perfect as possible in a font. However, there are limits to this requirement:<br>
      First, spacing/kerning always expresses the 'philosophy' of the type designer, while the typographer's spacing/kerning 'philosophy' may be quite different.<br>
      Second, it is impossible to care for <cite>all</cite> possible glyph combinations. The larger fonts get, the harder this is to achieve. (In old 256 glyph fonts, it was a possible maximum of ca 65000 pairs to kern, or check at least; in recent 1000-2000 glyph fonts, this is 1-4 mio. pairs to kern, or check.)<br>
      With every font I kern I wonder <cite>what</cite> to kern. I mean: beyond the usual stuff. Letters with numerals? 'T4' or 'A4' can both be pretty ugly combinations. Quotation marks with all kinds of math symbols or miscellaneous glyphs? One may refer to them in a text and surround them by quotes ...<br>
      E.g. in some fonts I noticed kerning pairs for .’ and ,’ (in English), but not for ’. and ’, (in German). Or fonts that only kern uppercase with following punctuation marks, but not the other way round -- which may occur in email addresses. Not very useful, from a typographer's point of view.</p>
      <p>Since there is the Cool Kerning tool (at a reasonable price), need to implement this functionality into InDesign is not <cite>that</cite> pressing.</p>
      <p>However, I think it <cite>could</cite> be a useful addition to InDesign.<br>
      Alongside the current kerning box (for kerning a particular glyph combination at a particular place) and the tracking box, I can imagine another kerning box for kerning of a particular glyph combination <cite>whereever it appears throughout a the document</cite>. Yet it's not that easy, because: does the value apply to this particular font only (i.e. style)? or to this font family? or to all fonts in a document? Moreover: only in this document or in others too?<br>
      I just watched the Cool Kerning demo. Its approach to create font groups illustrates that the issue is more complex than just additional box -- it requires some more options.<br>
      [Edit:<br>
      Now I think these user-defined kerning pairs are additions/corrections to the <cite>font</cite>, not to a single document alone. Since CS is a suite, the kerning pairs saved in one app could be available in the others too.<br>
      So, when entering a kerning pair in this additional box, this would be added to a special preference file read by all CS apps.]</p>
      <p>As Mr Ellertson says, modifying metrics in OTFs is really tricky and may even break other feature functionality in fonts (FLS does not import <cite>all kinds</cite> of features when opening an OTF/TTF).<br>
      So an option to do this in the layout application maybe is not the worst scenario.</p>
      <p>(I speak of 'fonts' here since I refer to the technical side.)</p>
      <p>Karsten</p>
