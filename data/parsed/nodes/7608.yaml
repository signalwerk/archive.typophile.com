      <p>Will, it can be a problem. The way Quark worked was to read in those kern pairs already in the font, then let the user add to them -- or remove them, if that was your preference.</p>
      <p>The way we worked, on a PC with TeX, (where TeX made use of the AFM to make up a TFM for metrics), was simply to edit the AFM itself. Nothing was perfect, if you used Fontographer for your kerning, and if you had characters (as they were called in those days) above character number 256, Fontographer would mess up the character names in the kerning -- so you had to learn work-arounds.</p>
      <p>But OpenType is different, with its class-based kerning, which I imagine is tables within tables. And just when kerning is applied could also get in the way -- if you are substituting glyphs with other features, kerning obviously has to wait until all such substitutions have been made. Since I'm not a programmer, this seems like a tougher nut to crack than the simple Quark approach to Type 1 fonts. I would also worry that Adobe might farm the programming of this one out, as it appears the exception dictionary was farmed out, with similar results.</p>
      <p>The more I work with OpenType, the more I'm against class-based kerning, on the grounds that creates more problems than it solves.</p>
    html_clean: |-
