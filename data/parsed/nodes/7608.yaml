    html: |-
      <p>Karsten,</p>
      <p>In theory, I've no complaints with an approach where kerning modification is external. In practice, it depends on how it works. I never used Quark, so what I don't know is if, once read in for a job, the kerning was always with a file, or you had to remember to read it in each time you opened a file.  For example, books go through a cycle of proofs. You finish the first proof &amp; ship it off to the customer. Six weeks or so later, proof is returned &amp; you make corrections. If the first proof used the external kerning program but you forget to read it in for second proof, all your line ending will change -- or In InDesign, lines where the "wax" is disturbed. The problems due to the bugs with InDesign's  exception dictionary that can be made a part of the file come to mind.</p>
      <p>Whatever, it would be an improvement on the current situation.</p>
      <p>As to class based kerning, yes it is an aid in dealing with the increased character set of OpenType, but in practice, it all to often seems to be a token effort. Much kerning involves vowels, which take diacritics. Frequently the class for a vowel simply includes the vowels with all the diacritics, and unfortunate kerning results. And since the original "kerner" tends to deal with shapes rather than meaning, it is wasteful in a way; "Gamma" will never (rarely?) occur with "e" in a word, the characters are from different alphabets.</p>
      <p>Having said all that, I confess I do use a little class-based kerning, but always feel a little guilty, as the values entered are usually a compromise I think I can get away with.</p>
