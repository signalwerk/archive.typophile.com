      <p><cite>if the font is lacking an obvious kern pair, or is kerned too tight, you can almost certainly call it a bug.</cite></p>
      <p>Then (pardon my vent), every font Adobe has issued is buggy. Try setting "quotedblleft" plus "quoteleft" -- and of course, "quoteright" "quotedblright".</p>
      <p>Or footnote calls (superiors) following a quote(dbl)right -- or following a period -- or comma -- or an f or g or or r, t, v, w (sometimes x) or y -- etc. How about fractions, particularly the one.numr sort -- following any number? The reason for having arbitrary fractions is so if/when you have to set 11/32, you can. That stops any strategy of using an unnaturally large left sidebearing on the numerator to get the needed space.</p>
      <p>Etc. In any event, a bunch of kern pairs are omitted; others are too loose or too tight bye my eye.</p>
      <p>I sort of agree though, that kerning should be in the font. The user should be able to fix the kerning, IN THE FONT. To it's credit, Adobe's EULA permits this. But man, is it hard taking apart the kerning of an OT font &amp; re-doing it. It can be so frustrating that I often go back to our Type 1 fonts &amp; make OT versions of them. Today was spent on Adobe Caslon (Type 1 to OT). Of course I have Adobe's Adobe Caslon Pro -- it came with some software -- but for good kerning &amp; character naming, it is easier to start over, even if I miss kerning Tcommaaccent with everything else. I, anyway, set a lot fewer Tcommaaccents than I do footnote calls, fractions, and quotes within quotes.</p>
      <p>Charles Ellertson</p>
