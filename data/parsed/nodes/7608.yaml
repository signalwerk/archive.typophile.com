    html: |-
      <p>Charles Ellertson -- <cite>The more I work with OpenType, the more I’m against class-based kerning, on the grounds that creates more problems than it solves.</cite></p>
      <p>Somehow I like the idea that an application, or suite of applications, allows to do "font modifications" externally to a font. Whether by modifying an AFM file ("semi-external") or adding to a kerning preferences file. Doing these things externally, it does not matter at all whether a font's kerning is class based or not. Simply enumerating pairs is simple, but highly unproductive as regards font-internal kerning. External modifications can (should?) work without classes, irrespective of how the font is built internally.<br>
      The only issue I can imagine is when kerning gets contextualized.&nbsp;&nbsp;;-)</p>
      <p>Other pluses of adjusting kerning externally to a font are (legal) avoiding EULA issues, and (usability, typographer's p.o.v.) avoiding different versions of a typeface on the HD.</p>
      <p>hrant -- <cite>Huh, ease? You want less work?! Actually I’ve personally become quite happy that InDesign doesn’t support the addition of custom kerning, because I just got a contract to respace a font that’s being used in an InDesign document. :-&gt;</cite></p>
      <p>So here speaks the type designer, not the typographer?&nbsp;&nbsp;:)</p>
