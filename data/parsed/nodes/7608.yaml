      <p>&gt; how does the client license the re-kerned font?</p>
      <p>The EULA will tell you. Usually if the EULA allows modification the client just needs to own a copy of the original. Sometimes the person modifying it needs to own a copy too, but not always, for example if the work is technically (certainly not necessarily physically) in-house, or if you remove the font from your own computer once the work is complete. Many licenses are transferable, in which case as long the font is only present at one "entity" at a time you're legally OK with just one copy.</p>
      <p>hhp</p>
