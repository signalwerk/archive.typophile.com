    html: <p>I'm reviving this thread because it's three years and two upgrades later... but I can't seem to find a way to change the kerning tables permanently for a font in InDesign. It's quite easy in Quark but none of the help topics or the InDesign book I own seem to explain how to do this in InD. I'm using Perpetua and for some reason the italics are kerned way too tight around quote marks. I'd like to adjust this globally for the font rather than on a case by case basis. Does InDesign allow you to do this? If so, how?</p>
