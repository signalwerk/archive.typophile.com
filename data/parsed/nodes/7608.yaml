      <p>I don't get it at all - why NOT provide designers with a valuable tool to help us control the appearance of type.</p>
      <p><cite>That sounds like it would be better to have fonts with no kern at all; this way the user would kern as needed. As a font developer, I’d certainly wouldn’t mind that… at all!</cite></p>
      <p>No offense but this is patently absurd. Then why not go for monospace? I would think font designers would want to create the best possible appearance for their font. But kerning is subjective, and just like there is good design and... not so good design, the same holds true for kerning tables. I'm not asking InDesign to make these decisions for me (altho it seems to want to) but to provide me with the tool I NEED to make these decisions for myself.</p>
      <p><cite>or the most part what’s in the font ought to work for most people, no?</cite> </p>
      <p>and comic sans works for a lot of people too. Does that make it good? Are you trying to appeal to designers or the lowest common denominator?</p>
      <p>It's a great application, but this is a glaring omission. Your attitude, again no offense, seems pretty shortsighted. You really need to wait for "thousands of users" before you add a feature? If you're gonna ignore the needs of designers who care about kerning then I'm gonna stick with Quark.</p>
      <p>(edited for tone)</p>
