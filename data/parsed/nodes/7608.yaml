      <p>Actually, I believe the optical kerning routine won't do this at all. I set quoteright-quotedblright in InDesign, and switching on optical kerning. Nothing happened -- there were still three "raised commas" all together. No change in the note call spacing, either. Maybe I did something wrong. &amp;BTW, the space between a quotedbl(left or right) and a quote(left or right) is about half a word space, optically.</p>
      <p>I don't mind having to kern some things by hand, in the file. In fact, our rule-of-thumb is all display type has to be hand-kerned, because what's right depends on the setting size, how many words there are in the line, etc., etc. Text is another matter -- we had one comp that who had to spend 4 hours extra on a job hand-kerning all the note calls that followed a close quote, and finding all those bloody places where the open quotes were kerned back into a word space (this kerning was in the font), where something like an "f" preceded the word space. A number of times, the "f" was closer to the open quotes than the open quotes were to the letter that followed, even though technically a word space intervened. Customers would mark such proof "P.E.--add word space."</p>
      <p>Anyway, four hours work &amp; a grumpy comp.</p>
      <p>Oh -- Bill, I don't really call myself a designer. I can design when needed, but I'm only a compositor -- what AIGA calls a "tradesman."</p>
