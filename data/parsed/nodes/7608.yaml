      <p>What I find interesting about this thread is that it sounds like all of sudden people realized that they're using a tool (assuming that they're using InDesign) that does not have a kern table editing feature, when in fact it's been like that forever. I mean, I'm all in favor of giving more power to the users (see <a href="http://typophile.com/node/32683">Who wants/needs a Glyph Palette in Photoshop?</a>, for example), but it's the first time I hear so many voices complaining about the lack of such feature.</p>
      <p>If nothing else, I truly wish that this thread helps you all get what you want. I'm a big fan of InDesign, and if it turns out that this feature has been on your wishlist for a long long time and hasn't been added yet, then speak up; our combined forces will hopefully make their way to the right people. (But again, what blows my mind is that from 2004, when this thread was started, until now, I don't recall anyone raising this issue. Therefore, thanks to Patricia for resurrecting this discussion.)</p>
