      <p><cite>I understand that this was an important add-on back in the day when fonts were constrained to a limited number of kerning pairs, but nowadays?!…</cite></p>
      <p>Just because a font can have a lot of kerning pairs does not mean that they will be applied well, nor does it mean that the pairs will be appropriate for all, or even most, situations.</p>
      <p><cite>If the font is lacking an obvious kern pair, or is kerned too tight, you can almost certainly call it a bug.</cite></p>
      <p>Call it a bug to whom? The font designers? The myriad of fonts with crap kerning pairs for numbers shows just how many font designers don’t really pay too much attention to the users on this issue.</p>
      <p><cite>And the job of layout applications is to provide the fonts “as is”; layout applications are not the right tools to fix fonts.</cite></p>
      <p>Now you are just being absurd. Typesetting needs change dramatically for a number of reasons and layout software should offer users the flexibility to cope with those changes. Kerning is not fixing a font, it is a method of adapting spacing to a situation. Being able to do this globally would be a boon to Indesign users—especially Indesign users who have purchased font licenses that do not allow modifications.</p>
