      <p>Miguel - I don't agree that we should be constrained by the font "as is" or be forced to kern each pair manually. Even some beautiful fonts have kerning problems. When I have "metric" kerning turned on in InD, I can see the kerning pairs but can't change them globally. I would think that an application created to help designers and typesetters do their job as best they can wouldn't just dismiss a tool that was so useful in Quark.</p>
      <p>Nobody is asking the application to fix the fonts, but typesetting is an exacting discipline (if it's to be done well) and why not provide a valuable tool to help the designers do that? It would only improve the software. I'm actually considering starting this job over again in Quark in order to finesse the kerning.</p>
