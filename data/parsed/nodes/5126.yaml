    html: "<p>   Totally agree, Vonnes is very similar to Venus Extrabold Extended, like Dave Jeffery says in this  <br><a href=\"http://www.transdiffusion.org/emc/september/granada/\" target=\"_top\">article</a> about fonts in Granada Television: <br> <br> <br>   \"There is, however, a very visible variant of Venus (including Venus Bold Extended) in use by Macromedia for their corporate identity. It is called �Vonnes�, and was especially designed for them by Font Bureau. All �Vonnes� really is, is Venus with angular cuts on the letter endings. Being a corporate commission, Vonnes is not available to the public.\" <br> <br> <br>What I don't understand is that these lovely typefaces, Venus Bold &amp; Extrabold Extended, that were very used and popular in the 50's and  the 60's are not digitized in the right way for public purchase. <br>I tried to find them one year ago for a job and no way, finally I got Annonce Grotesque (very similar to the Extrabold weight) and you know what, now it looks nor even this one is <a href=\"http://www.myfonts.com/Article4978.html\" target=\"_top\">available any longer</a>... !?</p>"
