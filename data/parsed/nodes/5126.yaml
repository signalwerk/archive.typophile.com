    html: <p><i>...Soo Extended.</i> <br> <br>Ha! I forgot about that one. I'm into model railroading somewhat and remember running across that once. As I recall, that was done by Rick Johnson, who often does these amazing technical illustrations for <i>Model Railroader</i> magazine. Not the most faithful version I've seen of a  font, but it does have a full character set and decent spacing (not usually true of free fonts).</p>
