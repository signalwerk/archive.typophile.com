  html: "<p>It's hard to tell, but the letters on the photos look a bit like Venus Bold Extended. Unfortunately, I don't know of a digital version of this, but it's the basis of one of Macromedia's custom corporate fonts, so you can get an idea what it looks like from there ads, etc. <br> <br>Here's a scan from an old type specimen book: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/37780.gif\" alt=\"venusBoldExt\"></p>"
