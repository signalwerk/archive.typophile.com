    html: <p>Yeah, Venus is an old favorite of mine. I used to get it in Format (cut out lettering sheets) and Letraset sheets. I did one my early business cards with it, although I didn't really know how to use it correctly at the time (way too tight). It used to be you could only get the extended weights and condensed weights, now you can only get the others.</p>
