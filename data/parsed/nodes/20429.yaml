      <p><em>But will it work? What could actually happen if these settings are not “optimal”? Will the font be unstabile? What problems will the user have?</em></p>
      <p>Lets say I have a carefully formatted Word document (or an Excel spreadsheet, or a Powerpoint presentation...) that I have created on Windows and which uses default linespacing as determined by the font metrics. I send it to a colleague who will add a couple of graphics in the spaces I have left for him to do so, and then print the document for distribution. He receives the file, opens it in Word on the Mac, and because the font has incompatible OS/2 and hhea table metrics, the linespacing is completely different from my original. All the formatting is messed up. The spaces for the graphics are no longer the correct size. The page breaks are in the wrong places, etc.</p>
      <p>Now a smart user will control the formatting in such a way that it will not be screwed up by an incompatibility in font metrics, but as you specified, we're talking about 'standard users'.</p>
      <p>That's the compatibility issue.</p>
      <p>The other issue is clipping. If the OS/2 Win values are too small, any part of a glyph that extends beyond those values will be clipped in many apps and on some printers.</p>
      <p><em>Finally – take the font Zapfino with it’s long swashes going way above the ascender – if I understand correctly: The Bbox size in this font, is WAY to small for the glyphs. So Zapfino is in other words not an optimal font?</em></p>
      <p>The Apple version of Zapfino is an unusual font in a number of ways, but those long extenders actually do fit within the vertical metrics. I can't remember the exact values, and Apple fiddled with the font after delivery (setting a low upm value to increase the relative size of the font).</p>
