      <p>Sorry, to pick an old topic here, but I want to “get down” and learn all this — for real now.</p>
      <p>These are my impression after reading different articles and asking people:</p>
      <p>• Regarding the vertical metrics:<br>
      Knowledge that has to do with the TypoAscender/Descender/hhea.Ascender/Descender/OS/2.winAscender/Descender etc, is not really any “final bank” of knowledge.</p>
      <p>Why? As an example, I read the "vertical metrics how-to" and it seems that a little bit of that and a little bit of this, actually works. And if not set optimal – it doesn’t mean that the font will be corrupt or will not work, am I right? The how-to article is updated a lot of times, changing it’s mind so to speak :)</p>
      <p>Is it that these things are more of a very advanced expert discussion going on, similar to which sparkling water has the most optimal bubbles :)</p>
      <p>QUESTION:</p>
      <p>Will, or will not, an OpenType font work fine (for standard users – not extreme typohpiles) in both Windows and OSX even though these OS/2/hhea/win values do not exactly match? Maybe it’s OK if it differs a little bit from plattform to plattform in the total height when used, since the designer for sure anyway will set his optimal values.</p>
      <p>But will it work? What could actually happen if these settings are not "optimal"? Will the font be unstabile? What problems will the user have?</p>
      <p>The reason I ask is that I think it's rather strange that the leading program FontLab’s recommended settings (Calculate Values Automatically) actually _creates_ a problem like this, and also that it doesn’t seem as if there is a straight answer anywhere to be found.</p>
      <p>Finally – take the font Zapfino with it’s long swashes going way above the ascender – if I understand correctly: The Bbox size in this font, is WAY to small for the glyphs. So Zapfino is in other words not an optimal font?</p>
      <p>OR… are these values “just numbers” that have to be set correctly — and then we don’t think more about it? :)</p>
      <p>(Phew…)</p>
      <p>PS. Sorry for a long post, but I’m having problems understanding all this, especially the more I read.</p>
