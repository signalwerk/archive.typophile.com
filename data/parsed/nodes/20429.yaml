      <p>As to possibly different line distances in different applications, or squashing, or clipping of glyphs -- sometimes it's not possible to avoid all of them. E.g., if your font has <cite>a few</cite> glyphs with very large ascenders, then you may accept that these get squashed or clipped in some applications, to make sure that default line distance will not be too much. In some way, it is you who has to set priorities. (In some applications, clipping behavior even seems to differs depending if the font is PS-OTF or TT-OTF ...)</p>
      <p><cite>not really any “final bank” of knowledge</cite></p>
      <p>This is true for vertical metrics, but also for font family naming and a couple of other issues. There are too many factors involved, like, will you make PS-OTFs or TT-OTFs, will your family follow Microsoft's example and have exactly four styles, or will it have more styles (or less, which can turn out to be as problematic), or do you want to use your PS-OTFs down to OS9 (even more restrictions)? Unfortunately, this contradicts the compatibility claim made for the OpenType font format.<br>
      That OpenType is still 'under development' (see the Vertical Metrics How-to: 'Update to the update' near the bottom) doesn't make things easier too. Be prepared to make updates regularly.<br>
      Never expect definitive answers, or a "final bank of knowledge". They don't exist.&nbsp;&nbsp;:)</p>
      <p>Karsten</p>
