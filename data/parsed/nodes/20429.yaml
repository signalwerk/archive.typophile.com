    <p>I just moved the font I'm working on into fontlab 5 and after generating an .otf file I get this warning in the output box:<br>
    [WARNING]  The feature file OS/2 overrides TypoAscender and TypoDescender do not sum to the font bbox size!<br>
    I did a google search for the warning message and came up with a few pages but nothing that explained what was happening in a way that I could understand. Can anyone explain this in a way that I can understand? Should I be concerned about the warning?</p>
