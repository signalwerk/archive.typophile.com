      <p>Jess,<br>
      I had the same problem with fonts started in 4.6 and moved to FL5. I actually the FL5 version makes more sense even though it is less forgiving than the old 4,6  If you look at the OS2 numbers, check to be sure that they jive with the actual font metrics--and your typo ascender/desender sums to 1000. You will probably see some pair of numbers not matching and prompting the error.</p>
      <p>ChrisL</p>
