  html: |-
    <p>Hi there, I have found a site hosting some reproductions of several original Monotype  metal typeface specimens; it is a letterpress printing service by Michael &amp; Winifred Bixler in Skaneateles, NY, using classic English Monotype book faces. I guess lot of people here could be interested in seeing them.</p>
    <p>The specimens:<br>
    <a href="http://www.mwbixler.com/specimens.html" title="http://www.mwbixler.com/specimens.html">http://www.mwbixler.com/specimens.html</a></p>
    <p>And the homepage:<br>
    <a href="http://www.mwbixler.com/" title="http://www.mwbixler.com/">http://www.mwbixler.com/</a></p>
