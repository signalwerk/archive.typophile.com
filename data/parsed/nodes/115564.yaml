      <p>I am not certain what you mean by "packaging with a devilish slant." This could range from a cute Valentines' day devil to a heavy metal like Graveblade <a href="http://www.myfonts.com/fonts/typodermic/graveblade/" title="http://www.myfonts.com/fonts/typodermic/graveblade/">http://www.myfonts.com/fonts/typodermic/graveblade/</a> -- which is definitely an attention grabber and not too "decorative" in the swirly sense of Helena. Another option is a script like Excalibur <a href="http://www.myfonts.com/fonts/scholtz/excalibur-scf/" title="http://www.myfonts.com/fonts/scholtz/excalibur-scf/">http://www.myfonts.com/fonts/scholtz/excalibur-scf/</a> -- pointy in a casual way.<br>
      If you don't mind making letters, you could apply a motif like this  <a href="http://www.shutterstock.com/pic-56239237/stock-vector-devil-icon.html?src=vVNCXtoJFAkQruigYqN8Dw-1-9" title="http://www.shutterstock.com/pic-56239237/stock-vector-devil-icon.html?src=vVNCXtoJFAkQruigYqN8Dw-1-9">http://www.shutterstock.com/pic-56239237/stock-vector-devil-icon.html?sr...</a>  to the initial letter of your logo from an uncomplicated "friendly" font of your choice and leave the rest unchanged.<br>
      Don</p>
