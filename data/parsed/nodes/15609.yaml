    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indicies" title="Create node &quot;Indicies&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indicies</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: Frutiger&nbsp;Next</strong></p>
    <p>Adrian Frutiger’s <a href="/node/13517" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Frutiger</a> typeface has been an extreme success since its initial release in the 1970s. In 1999, it was revised and updated by Adrian Frutiger himself (together with <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>) to include true italics among other features. This typeface is called <a href="/node/15609" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Frutiger Next</a>.</p>
    <p>The <a href="http://www.linotype.com">Linotype</a> website has overview pages showing all the weights of the <a href="http://www.linotype.com/469/frutiger-family.html">original Frutiger type family</a> and <a href="http://www.linotype.com/53781/frutigernext-family.html">Frutiger Next</a>.</p>
