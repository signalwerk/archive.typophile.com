    <p><strong><a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Frutiger Next</strong></p>
    <p>Adrian Frutiger's <a href="/wiki/Frutiger" class="freelinking" rel="nofollow">Frutiger</a> typeface has been an extreme success since its initial release in the 1970s. In 1999, it was revised and updated by Adrian Frutiger himself (together with <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>) to include true italics among other features. This typeface is called <a href="/wiki/Frutiger%20Next" class="freelinking" rel="nofollow">Frutiger Next</a>.</p>
    <p>The <a href="http://www.linotype.com" rel="nofollow">Linotype</a> website has overview pages showing all the weights of the <a href="http://www.linotype.com/469/frutiger-family.html" rel="nofollow">original Frutiger type family</a> and <a href="http://www.linotype.com/53781/frutigernext-family.html" rel="nofollow">Frutiger Next</a>.</p>
