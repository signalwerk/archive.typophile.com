    <p>Hi there,<br>
    Somehow I locked the metric window and now I can't edit side bearings manually (only using the table). The kerning sections also is locked. I tried checking and un checking every button in the Layers panel and it does not solve the problem.<br>
    I also changed the workspace and this didn't help either.<br>
    I am going Crazy. Any idea on how to unlock it?<br>
    Thanks in advance.</p>
