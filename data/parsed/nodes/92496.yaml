    html: "<p>Definetly. If you plan nesting letters, there should be no ligature here. The double ł appears in few foreign words like <em>mułła</em> (mullah) or the above mentioned Lithuanian names. The only exception are forms of the past tense and conditional mood of one verb, <em>mleć</em> (to grind), which seem to be a linguistic ballast, and aren't practically used in daily language. There, in plural, the łl appears. It appears to mark a difference between masculine and feminine forms: <em>-łli</em> -&gt; m., <em>-łły</em> -&gt; f. So nesting the second letter there, would be a bit misguiding. But in the case of the suffix <em>pół</em> (half, <em>półlegalny</em> = semi-legal) - where one probably can create much more compound words than those few \"łl's\" we are familiar with - crossing the boundary would be purely distructive.</p>"
