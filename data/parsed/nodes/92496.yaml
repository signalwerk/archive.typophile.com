      <p>Thanks everyone for the feedback.</p>
      <p>Just to clarify, the ligatures I'm dealing with are uppercase, not lowercase, and this is a sans display face rather than a script face. I'm basically nesting one L above the other in an attempt to reduce whitespace.</p>
      <p>At least in English, the result isn't terribly satisfying when it occurs across morpheme breaks (e.g. in compounds). Do all of the Polish examples of ŁL given above involve morpheme boundaries? The face I'm working on has *lots* of interacting glyph variants, so the addition of any ligature actually involves creating numerous new glyphs. If these examples are restricted to morpheme breaks, I might opt not to include it. If they occur within a single root, then I'd want to include them.</p>
      <p>André</p>
