    html: |-
      <p>Polish <em>ł</em> used to be pronounced [ɫ] or [lᶭ], i.e. a velarized or ‘dark’ [l]. This sound is found in North American English dialects in words like ‘ball’ [bɑɫ] and ‘built’ [bɪɫt]. In Polish the lateral [l] part was gradually lost, leaving only the velarization as a voiced velar approximant [ɰ]. Labialization came along at some point, producing [w]. (The [w] sound is not produced with a single gesture, but is instead actually both a bilabial and a velar approximant, i.e. [ɰʷ].) Apparently the letter <em>ł</em> developed back when it was still a lateral sound and hence was paired with the letter <em>l</em> representing the ordinary voiced lateral approximant [l].</p>
      <p>Because some Native American languages distinguish a voiced and voiceless lateral sound, the Polish <em>ł</em> letter was borrowed to indicate the voiceless lateral. Thus Athabaskan languages like Navajo use <em>ł</em> to represent their voiceless lateral fricative sound [ɬ], <em>tł</em> to represent the aspirated affricate [tɬʰ], and <em>tłʼ</em> to represent the ejective affricate [tɬʼ]. In handwriting the Native American <em>ł</em> is distinctly different from the Polish <em>ł</em>, even though both are similar in print. Handwritten <em>ł</em> in Native American orthographies usually appears as a looped <em>l</em> with a crossbar, similar to a cursive <em>t</em>. In such hands people tend to write cursive <em>t</em> without a loop. In non-cursive hands the <em>ł</em> is often still written with a loop, but unconnected to neighbouring letters. Some people write it more like the IPA ‘belted l’ symbol ɬ instead, with the crossbar connected by a loop to the upright; this style of handwritten <em>ł</em> is where the IPA symbol came from. Finally, it can also be written in unconnected hands with a simple vertical stroke like <em>l</em> but with a slanted crossbar, very similar to the usual sans-serif appearance of <em>ł</em>. I would attach some examples but I don’t have a scanner handy. Maybe I’ll post some tomorrow.</p>
      <p>In Native American languages it’s not impossible to encounter sequences of two <em>ł</em>s in a row, but it isn’t exactly a common thing. Representing them as a ligature would be confusing to most people, however. The only thing that might be advisable to do would be to ensure that the two crossbars don’t overlap.</p>
