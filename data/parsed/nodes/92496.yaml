    <p>Hello,</p>
    <p>A font I'm working on contains an L_L ligature, and I've also opted to add Lslash_Lslash. I'm unclear, though, on whether I also require L_Lslash or Lslash_L. I was unable to find these pairs in a cursory examination of a few Polish newspapers, but since I don't speak Polish I don't want to take this as evidence of their nonoccurrence. Do any polish words contain the sequence LŁ?</p>
    <p>thanks,<br>
    André</p>
