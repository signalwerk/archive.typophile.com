    html: <p>I’ve found some problems with the UN Declaration of Human Rights. Finding sections of text that show every diacritical found in a large character set can be real pain, especially because some mark/letter/position-in-a-word combinations only seem to turn up in names of people and places. Many languages have a low ratio of marks to total text, requiring a lot of text to be proofed, so using the declaration eats up lots of time and paper and introduces lots of opportunities to miss over a problem after the fifteenth language out of thirty. It’s a good source for testing actual text settings in a lot of different languages, but for general use I find something more stripped down works better.</p>
