      <p>The Preamble in Polish has probably a "slight" statistic overrepresentation of aogoneks due to the use of certain forms of style and grammar and word repetitions.</p>
      <p>PS: I would advise changing two or three instances of the word ZWAŻYWSZY to lowercase. Both forms contain important letter pairs.</p>
