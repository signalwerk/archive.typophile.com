    html: |-
      <p>I'm disturbed about this pangram listed on Wikipedia:</p>
      <p>"Quartz glyph job vex'd cwm finks."</p>
      <p>Which, it says, is an abbreviation for:<br>
      "The act of carving symbols into quartz irritated ruffians from a Welsh river valley."</p>
      <p>Unless, of course, "fink" is synonymous with ruffian in Welsh.<br>
      In early and mid twentieth century American English slang, fink meant a snitch, a tattle-tale - in gangster parlance, a "rat". And now ruffian, too?</p>
      <p>A fine and noble surname, smeared!</p>
