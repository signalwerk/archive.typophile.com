    html: |-
      <p>You don't have to go beyond the first paragraph of the Preamble in Polish to get plenty of ogoneks and l-slashes, and get a feel for what the overall look of the language is.</p>
      <p>The Declaration is prose, not isolated words. When you copy a text string from the Declaration and set it in bundled Adobe/Microsoft faces (which generally have full CE support), then you see how the language looks in different styles—and this will give you an idea of how to execute the accented characters in your typeface. How much weight to give to the ogonek, for instance, and how low it should hang.</p>
