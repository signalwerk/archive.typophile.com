      <p>When I interviewed for this job 9.5 years ago, one question was "What kind of computer do you work on and what software do you use?" My immediate answer, given with no hesitation was "I work on a Macintosh and use Quark. But I'll learn whatever machine/software you folks use here." I did know that my predecessor used used Windows and Quark [InDesign was just a glimmer then].</p>
      <p>I had never even sat at a Windows machine. But I knew I was smart enough and nimble enough to make the machine switch. And I wanted the job: the type of work, the added money, the new responsibilities, the shorter commute.</p>
      <p>These are the sort of things you should think about. They are not asking you to switch religion [I hope], or to get rid of your dog and get a cat. It is just a damn machine.</p>
      <p>Think through what you really want. Machines and software can be mastered.</p>
      <p>powers</p>
      <p>PS: I was offered the job. Before the offer was made, the Managing Editor talked with other book designers and found that Mac / Quark was the preferred combination. On the day she asked me to come to work here she also said "Give me a Macintosh shopping list." So in the end I had not to make the switch. But I was ready, and I like to think that honest willingness to shift was a factor.</p>
      <p>Still using Quark.</p>
