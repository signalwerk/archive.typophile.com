    html: <p>I use Quark 6 on a mac, but use Indesign CS2 on a PC with newer versions on Illustrator and Photoshop so I have to switch between mac and pc all day.  I don't know PC's as well as macs but have to say I much prefer working on the mac, dragging whatever you want into the icons is so much handier than using menus to open stuff every time, along with everything else that's handier on a mac, but I am new to PC's so I may have some more to learn there. Quark 7 is close enough to indesign if they have that, don't know if it's selling well mind you, I could count the quark 7 files I received so far on one hand, PDF's produced are OK but still not as good or as small as those from indesign...you shouldn't have too much trouble with quark if you know indesign but you will have more work to do, especially on a PC, which are a lot cheaper than macs, but I have to say they feel a lot cheaper too....take the job and if it doesn't work out I'm sure you'll find another one anyway.</p>
