  html: |-
    <p>I've been offered a new design position at a worldwide company. This would require relocating a few hours away, which is fine, and they've offered me nearly 30% more than I make now. All good yes, but the problem with said job is........... they only design on PC's and use Quark. Being a person who has only designed on Macs and is mostly familiar with InDesign, the thought of this scares me. </p>
    <p>The idea of working on a PC is making me about 95% sure I don't want to take this job. </p>
    <p>What would you do?<br>
    New job, more money, PC, Quark<br>
    Old job, less money, Mac, InDesign</p>
