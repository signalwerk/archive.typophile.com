      <p>There is enough of Mac vs PC here to help you make your decision - but I think you need time to decide on other matters.<br>
      With which company will you feel you have job security? Which company has room for growth, promotion, salary increases, benefits, understanding of time off for family emergenicies?</p>
      <p>Meanwhile, always before considering a job, find out from the company who had the job before you. Why do they no longer have it? Did they move up the ladder? Did they leave cursing up a storm? How long did they have the job - how many people have had this position?</p>
      <p>Always check out if the employees of a company you are considering are happy working there and are well treated.</p>
      <p>Then make the decision that is best for you and your future. </p>
      <p>Good luck.</p>
