      <p>I just did the "switch" to mac due to a new job... I worked on macs while being at university, then "returned" to windows (XP) because it still felt more natural to me (it's all about being used to a system), and now I returned to OSX again...<br>
      I did Indesign, xPress, Illu, Photoshop, HTML-Coding, making books, marketing material, fonts and everyday work on the system, and it was very reliable and in 5 years there were no compatibility issues with printing services, fonts, or when exchanging data with other windows- or osx-machines. So: it works.</p>
      <p>After one week on OSX, I am at about lets say 60% of my usual working speed, but I am slowly getting used to it, adjusting the system and getting used to it. I've learned that one has to tweak OSX as well as one has to tweak Windows, out of the box both of them are hard to get used to if you compare it to a machine fully adjusted to your needs you used before. So if you give Windows a chance, it's possible to work with, but don't be frustrated in the beginning...</p>
