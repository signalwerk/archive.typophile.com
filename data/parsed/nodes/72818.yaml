    <p>OpenType ist the standard font format of these days. But even 14 years after its introduction, many users don’t really know what the term OpenType implies and how it differs from other font formats. Since I use the domain opentype.info for my weblog, I thought it is time to shed some light on this confusing subject …</p>
    <p><a href="http://opentype.info/blog/2010/07/31/opentype-myths-explained/" title="http://opentype.info/blog/2010/07/31/opentype-myths-explained/">http://opentype.info/blog/2010/07/31/opentype-myths-explained/</a></p>
