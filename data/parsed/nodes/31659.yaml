    html: |-
      <p>I'll second the recommendation for Adobe Type Basics, OpenType Edition. There's a lot of overlap with the fonts that came with CS2, but you still get a few additional complete families. For instance, Basics includes the Palatino Std 1 package, but Basics is the same price as Palatino Std 1: $99. Go figure. With Basics you get more families and also a smattering of display and novelty fonts.</p>
      <p>Another somewhat cheesy route to take is to find a used copy of Corel Draw or the Corel graphics suite. Corel bundles, or at least used to bundle, some version of the complete Bitstream font catalog. This contains about 1,200 fonts, including many digitized versions of classic text fonts such as Plantin, Bembo, Sabon, Granjon, a couple Garamonds, Univers, Electra, Caledonia, Melior, Frutiger, Cheltenham, a few Bookmans, a few Bodonis, etc.</p>
      <p>The Bitstream catalog is a much better collection than the "1,000 font for $5" CDs which are just freeware fonts pressed onto a CD. However, compared to top-notch Adobe fonts, these old Bitstream fonts aren't quite as nice since they often do not include small caps or old-style figures. I think the bundle included both Type1 and TrueType versions of each font. You can still use these fonts on a Mac if you have a font manager. (I use FontAgent Pro.) I don't know about Windows.</p>
      <p>Or you can buy the current CorelDRAW Graphics Suite X3 which apparently has an upgraded type catalog -- it offers 1,000 OpenType fonts. I don't have any experience with this though. See</p>
      <p><a href="http://www.corel.com/servlet/Satellite/us/en/Product/1150981051301" title="http://www.corel.com/servlet/Satellite/us/en/Product/1150981051301">http://www.corel.com/servlet/Satellite/us/en/Product/1150981051301</a></p>
      <p>It's US$379. Heck, maybe you should consider buying the software just for the font collection.</p>
