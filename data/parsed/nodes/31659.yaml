    html: <p>Stephen-I am surprised...it sounds like fewer people know about Unifonts than I had thought. Honestly I can't even remember how I found them, but I have known about them for several years now so they are not new. Some of their typefaces are geared more toward display, but from what I can tell they are all original...I don't think any of them came from old photolettering. There type designs are somewhat unique. They have some nice serif and sans-serif faces that can offer someone a fresher alternative to the standard workhorses. The catalog is worth having. It's pretty straight forward in it's layout, but the samples are easier to see than on the website.</p>
