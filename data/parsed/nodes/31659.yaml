      <p>I think Adobe CS comes with a few fonts, but I'm not sure.</p>
      <p>Some people recommend establishing about ten good workhorse fonts for everyday use. You could start by picking two or three from each category, choosing a "formal" and "informal" typeface from each of these categories: sans-serif, serif, display, script.</p>
      <p>You most certainly will want robust type families, so look for families with lots of weights. It'll cost more up front, but you'll be glad you did.</p>
      <p>Or you can try these sites to get started:<br>
      <a href="http://www.adobe.com/type/collections.htm" title="http://www.adobe.com/type/collections.htm">http://www.adobe.com/type/collections.htm</a> -<br>
