  html: |-
    <p>I'm fresh out of college and starting out into the freelance design world. Is there some resource for getting some sort of essential typeface starter pack? I'm looking for solid typefaces for multiple occasions, something that might act as a base for my type library. Of course, I'm on a limited budget, but I'm realizing that the free font sites out there don't offer the sort of "nuts and bolts" essential typefaces I need. </p>
    <p>Any thoughts? How can I get my type library essentials without breaking my [tiny] bank?</p>
    <p>Thanks!</p>
