    html: |-
      <p>I recently came across the <a href="http://onelook.com/" rel="nofollow">OneLook online dictionary</a> which combines numerous online dictionaries and word lists to provide a wild-card searchable dictionary European languages and Asian transliteration. Just be careful as it is case-sensitive. </p>
      <p><a href="http://dunwichtype.com/pdfs/diacritical_words.zip" rel="nofollow">This link</a> goes to list of diacriticals at the beginning of, inside of and at the end of real words. It includes every position I could find using online dictionaries and lists of place names. It does not show a breakdown by language (although you could probably cook up a screenscraper to compile that) but none of them are from obscure languages (although some place names are obscure). The character set I use is a subset of one of the pan-european FontLab on Steroids encodings without Esperanto characters or the dot accents for the old Irish words.</p>
      <p>The list does include some transliterated words from Asian languages, but if those don’t concern you they aren’t hard to spot.</p>
