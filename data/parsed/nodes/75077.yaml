  html: |-
    <p>Does anyone know of a resource that has information about where in words in various languages accented letters are possible (or most likely) to appear? Alternatively, lists of words in different languages would help me work it out myself.</p>
    <p>For example, as far as I know, Ñ and ñ never fall at the start or end of a word in any language. So, if I'm making alternate glyphs that are meant only to be used at the start of end of a word, there is no reason to make such alternates for those two characters.</p>
    <p>The "easy" thing would be to proceed as if every accented character could appear in any position in any word in any language. My problem is that the font I'm working on has a large number of alternate characters, and adding accents to all of them will increase the glyph count dramatically, a big chunk of which may not ever be used or may not even be possible to use in a normal word. I don't want to include glyphs like that if I can help it.</p>
