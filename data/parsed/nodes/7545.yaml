  html: '<p>Project : To design a logo that corresponds to the words : modern, stylish and simple. The client is a hosting company with some recognition in my country. They were somewhat steadfast about the changing of their old logotype, but after some persuasion they inclined to modify it. <br> <br>Old logo : <img src="http://www.typophile.com/forums/messages/29/52952.jpg" alt="old"> <br> <br>New logo suggestions : <img src="http://www.typophile.com/forums/messages/29/52953.jpg" alt="new"> <br> <br>Sincerely, <br>Galin Krasimirov</p>'
