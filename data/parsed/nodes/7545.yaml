    html: <p>Galin, you would do yourself a big favor to work with other professionals, like marketing people. They could rationalize creating one name idenity. I would take the approach of tiering the idenity, like Resound a division of ReNet. This allows the consumer a heirarcy of understanding. What your client is asking is to create a blivit. Ten pounds of s_ _ _ _ in a five pound bag.  <br> <br>If your client won't listen to professional advice then they don't respect you and you will make tons of hours of work and you won't get paid. <br> <br>Tanya Rules!</p>
