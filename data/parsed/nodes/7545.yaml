    date_raw: 8 Nov 2004 — 1:07am
    votes: null
    html: "<p>To Tanya : I am sorry to have abused your penchant for monochrome. If you don't like what are you seeing on the screen, then you can just ignore this topic.  <br>Nevetheless, I cannot believe what you have posted, Tanya. Have you got a quarrel with somebody and you just couldn't resist to castigate ME.  <br> <br>&gt;&gt; How many times have we all said it?  <br>&lt;&lt; This line implies that you have said something and most probably you have directed it to me. This is untrue, Tanya. You haven's said anything.  <br> <br>&gt;&gt; Why does everyone insist on using them? <br>&lt;&lt; Am I a collective image of everyone? I don't think so. Everybody is unique and has the right to stay that way. If you think that you are better than \"these ignorant people you are addressing\" - I don't believe this is the right place to manifest it. <br> <br>Even though you said \"sorry Galin don't mean to direct this to you\", it doesn't make me less insulted. <br> <br>Note : I use colorful versions of the designs, because simultaneously they are given to the client and like every client he/she likes to see in color.  <br>Please comment on the variations I gave you. If you like monochrome versions just say so.</p>"
