  - id: 51317
    user: 549
    date: 2004-11-08T11:13:00
    date_raw: 8 Nov 2004 — 11:13am
    votes: null
    html: <p>I don't think there was anything offensive in Tanya's post. She was simply stating a principle many of us learned in design school and is relevant to your post - if it doesn't work in B&amp;W its not going to work in colour so work out the black and white version first. That makes it much easier to see the balance and shape of the design as well as the spacing.</p>
  - id: 51318
    user: 2236
    date: 2004-11-08T11:30:00
    date_raw: 8 Nov 2004 — 11:30am
    votes: null
    html: <p>Galin, I don't think Tanya meant anything personal. Those of us who were trained pre-internet typically have a different perspective on rules and traditions of design. I used to feel pretty strongly about making designs work in black and white too, in fact, I still work that way most of the time; however, with the advent of the internet, there are businesses that exist soley online that have virtually no printed media support. With this understanding I have compromised my stand on the black and white approach to those types of businesses. <br> <br>The real disappointment comes when there is no preliminary thinking on paper (concepting, sketching). My current mindset is that if the concepts are worked out on paper first, then the black and white approach has been applied sufficiently. <br> <br>As for gradients</p>
  - id: 51319
    user: 1250
    date: 2004-11-08T11:45:00
    date_raw: 8 Nov 2004 — 11:45am
    votes: null
    html: <p>Galin, like many of us Tanya is simply <i>passionate</i> about design, so she expresses herself* strongly, but not necessarily directly at individuals. If you can manage to put that in context, you'll benefit more from good advice. BTW, looking in your profile I see that your personal quote is "Express yourself"!  :-) <br> <br>* Although Typophile used to enjoy more of it from her! <br> <br>hhp</p>
  - id: 51320
    user: 1019
    date: 2004-11-08T12:27:00
    date_raw: 8 Nov 2004 — 12:27pm
    votes: null
    html: <p>*aww shucks thanks Hrant - been too busy lately that's all. <br> <br>Anyway - won't bother defending my comments as most of you have done nicely already.  <br> <br>I have nothing against gradients per say - just gradients in a corporate identity. So least I explain why a bit further. <br> <br>Beyond the fact that most times they are a cheap effect with little to no purpose in relation to the company, they are also hard to reproduce or very expensive for the company to reproduce in various media's and materials. Automatically you can't make a stamp, it won't be clear on fax coversheets and will lose detail on photocopies. Vinyl cuts (for the neon sign or office storefront) will be difficult and expensive. The logo itself won't be the same in reverse for say if the logo is being placed in a newspaper or magazine ad on a black background...ect ect. there are many reasons why this has been a general rule of thumb - and some people do break them but you should have a very, I repeat very strong reason for doing so. It is intrinsically related to the company - this effect? Is the company rich enough to reproduce it well? If not ...your going to get upset the day you see your logo basterdized or poorly displayed.  <br> <br>If all one care's about is its' display on screen because it's an internet thing well your design won't last come the day (if it comes) when your client goes public. I'd plan for your clients future in order to help them succeed - cause well...that's our business.  <br> <br>just some thoughts.</p>
