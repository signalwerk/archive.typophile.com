    html: "<p>Well, #2 is right out, since it changes the company's name! Of the others, I like #4 best, and #5 the least (although it could work for a lighting company).</p>"
  - id: 51306
    user: 2236
    date: 2004-11-06T11:19:00
    date_raw: 6 Nov 2004 — 11:19am
    votes: null
    html: "<p>Galin: <br> <br>I am confused. The name is \"resoundnet\", right? Why all the emphasis on RE-NET? <br> <br>You couldn't be doing them a bigger favor by talking them out of their existing logotype. <br> <br>Modern, stylish and simple? You seem to be working in the right direction. Which definition is the word \"resound\" referencing? An echo or being filled with sound? Have you considered any clever ways of incorporating one of those definitions? I guess I'm just not sinking my teeth into any of your current solutions yet. I am interested in seeing where you take this design. <br> <br>Aloha! <br>Scott</p>"
  - id: 51307
    user: 5011
    date: 2004-11-06T14:41:00
    date_raw: 6 Nov 2004 — 2:41pm
    votes: null
    html: "<p>Thanks for your expeditious replies. <br> <br>To Steve : If you may notice on their original(primordial <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> logo they use the same ambivalence in their logo name. It is rather confusing how to read it. On #2 I tried to give another vision of their old \"design\".  <br>You are right about #5. It surely is like a lighting company, but the effect was rather pleasant, so I used it just to bulge the number of variations. <br> <br>To Scott :  <br>&gt;&gt; The name is \"resoundnet\", right? Why all the emphasis on RE-NET?  <br>&lt;&lt; Yes, that is the correct name of the company and the way they want it to appear. The emphasis on Re-net is connected with their company policy. I don't know what exactly it means, but it is a Must. <br> <br>&gt;&gt;Which definition is the word \"resound\" referencing? An echo or being filled with sound? Have you considered any clever ways of incorporating one of those definitions? <br>&lt;&lt; I am delving into the sounds right now and trying to incorporate another form, because this radio waves are trite nowadays. On most of the variations I tried to use it, because I knew that it was going to correspond to the client more delicately. <br> <br>&gt;&gt; I guess I'm just not sinking my teeth into any of your current solutions yet. <br>&lt;&lt; I will post some new design after day or so. <br> <br>Note : The client's expectations are not so high, so I guess something simple will do the trick. <br> <br>If you want to comment more on the variations, which I posted so far - feel free to do it.</p>"
  - id: 51308
    user: 5011
    date: 2004-11-07T04:01:00
    date_raw: 7 Nov 2004 — 4:01am
    votes: null
    html: "<p>Another variation. Emphasis on the three forming letters.  <br> <br><img src=\"http://www.typophile.com/forums/messages/29/52996.jpg\" alt=\"rsn\"> <br>I am considering the \"R\", \"S\", \"N\" morph. So the next variation probably will be connected to the morphing of the threesome (R,S,N). <br> <br>Note : The height of letter \"S\" in variation #7 is intentional and the purpose is to put up with the client's requirements. (the \"R\" and \"N\" contrasted to the \"S\".</p>"
