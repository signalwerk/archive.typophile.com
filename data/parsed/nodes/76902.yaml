  html: |-
    <p>Me and my friend have come across this typeface a lot on Tumblr (blog website) as it's used in a lot of page themes.<br>
    Shares similar qualities to the Lobster font, but it's slightly different.<br>
    He has sent me this screenshot he took, but you can also find it on thisisnthappiness.com as the logo on the left.<br>
    Does anybody know the font name?<br>
    Thanks.</p>
