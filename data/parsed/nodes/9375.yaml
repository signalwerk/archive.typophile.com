    html: <p>It's a bit ridiculous to talk about 'fonts' when you are looking at some sort of metal castings.  The point is that not EVERYTHING is from a computer font. There was lettering for hundreds of years without digital fonts, and obviously every form of lettering has not been digitized. So much lettering was done by hand, and will never be re-created. <br> <br>Chris, it would be nice if you would give us a break, and post one image at a time per thread, and try to consider whether asking about a 'font' for manufactured lettering is a reasonable request. <br> <br>Can I ask what your reason is for these shotgun style ID requests?</p>
