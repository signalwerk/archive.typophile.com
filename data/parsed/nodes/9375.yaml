    html: <p>Well first I would like to say thanks for everyone�s input in trying to identify these various typefaces.  <br> <br>As mentioned in a previous thread I am trying to identify these letterforms for part of my university course.  <br> <br>The point of it is not necessarily to identify the exact typeface contained within the image but instead just to make an attempt. I realise that for some of these images this may be extremely difficult, as the lack of letterforms within each picture would make a narrowing down of the typeface a difficult task.  <br> <br>I never assumed that the metal cast typographical form was of the digital kind but assumed someone might have had an idea what it could have been based on and therefore I don�t see this question as a ridiculous one. I believed that the point of this forum was to stimulate debate about letterforms and typography.  <br> <br>Am I in the wrong place?</p>
