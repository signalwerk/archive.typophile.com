    <p>Hello everybody,<br>
    I am looking for the closest variant of this font:</p>
    <p><img src="/sites/default/files/old-images/few_3985.jpg"></p>
    <p><img src="/sites/default/files/old-images/many_5821.jpg"></p>
    <p>I am making a cash register application and I need to find the closest match for this font. Closest I was to this font was MS Gothic or perhaps this one: <a href="http://www.whatfontis.com/Hypermarket-Cond-Light-green-type.font?text=JOBCODE:%20Restaurant">http://www.whatfontis.com/Hypermarket-Cond-Light-green-type.font?text=JO...</a><br>
    but its noot good enough.</p>
    <p>Maybe there is a possibility it isnt even a real font and its the printer internal font, or whatever you call it?</p>
    <p>I greatly appreciate any help,<br>
    Thank You in advance</p>
