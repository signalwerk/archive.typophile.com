      <p>on a side note:<br>
      there is a type that I would say is very close to myriad that I am continually seeing in the younger demographic aimed ads and print. i would say its a mixture of helvetica, myriad, futura and arial. what really gives it away is the capital R. the closest thing I’ve found to it is called SF Old Republic from dafont.com ( <a href="http://www.dafont.com/sf-old-republic.font" title="http://www.dafont.com/sf-old-republic.font">http://www.dafont.com/sf-old-republic.font</a> ), but it’s not exactly it. is there a more “commercial” version of this out there?</p>
