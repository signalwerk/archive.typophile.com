      <p>I think Verdana falls into the “bad, generic typeface that tells others you aren’t brave enough to change your default” far more than Myriad does (or ever will).</p>
      <p>Myriad is a lovely typeface. The fact that there are so many weights gives it a huge advantage over many other families, and the condensed versions are very readable, which makes it a good choice for things like manuals when the condensed versions of Helvetica, Univers, and New Gothic aren’t doing it for you. But yeah, due to its popularity in the mid 90s, it can look a little dull and dated. But if it works, it works.</p>
