      <p>It seems to me that Myriad is far more visible today than it was in the ’90s. Maybe I’m just noticing it more, but I see it <em>everywhere</em> these days.</p>
      <p>I miss multiple masters. Myriad is an excellent design of course, but the fact that one could originally “dial up” whatever weight and width they needed was a tremendous bonus.</p>
