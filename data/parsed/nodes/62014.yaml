    <p>I guess I’ve gotten tired of Helvetica, Verdana, Georgia and Trajan.</p>
    <p>I’ve found myself going back to Myriad... which I have always thought of as the “bad, generic typeface that tells others you aren’t brave enough to change your default.”</p>
    <p>What’s wrong with me? Haha.</p>
