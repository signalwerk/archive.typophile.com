      <p>If it's for “the older generation,” make sure than whatever font you choose has a large body set and x-height. My personal favorite—as an older generation guy, mind you—is Poppl Laudatio…</p>
      <p><a href="http://www.myfonts.com/fonts/berthold/laudatio-be/" title="http://www.myfonts.com/fonts/berthold/laudatio-be/">http://www.myfonts.com/fonts/berthold/laudatio-be/</a></p>
      <p>However, a complete set of this face would be mighty pricey. IMHO, Farnham appears to be an acceptable alternate (old broads <em>can</em> be hip, too, you know). Plus, the swash italic options are quite ladylike, without being too girly…</p>
