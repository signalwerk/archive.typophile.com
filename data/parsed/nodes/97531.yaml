  html: |-
    <p>I am designing the latest issue of one of my magazines. The font we use is Kepler as headings and body copy mixed with Verlag as title headings. I am not loving the font Kepler and want to change it but not too dramatically - any advice much appreciated on which alternative font I could use that would mix well with Verlag. I have looked at Farnham but fear it may be too trendy for the magazine. It is a womans magazine, but for the older generation.</p>
    <p>Thanks in advance</p>
