    <p>Hello all,</p>
    <p>First I want to say I'm honoured to have an opportunity to join this community, this is a fantastic place.</p>
    <p>This is a logo I'm currently working on, based on a chosen concept. It's not polished but already been through many revisions.</p>
    <p>I'd be really grateful for any knowledgeable input from you before showing it to the client.</p>
    <p>Please be aware that it's my first attempt at designing type, so I'm kind of nervous, but then don't pull any punches, I want all of it!</p>
    <p>First off, is this legible enough?</p>
    <p>Then I have a problem with the 'a':<br>
    The entire logo is slanted, but you rarely (if ever?) see a 2-storey 'a' in italics (true italics anyway).<br>
    That's why I prepared a 1-storey version. I do like the 2-storey 'a' better though, but I wanted to confirm if it doesn't conflict with any sorts of typographic principles or is just a plain 'wrong thing to do' before deciding on it.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/jcc_kali_0815_02-2story_4049.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/jcc_kali_0815_02_1story_5211.png"></div><p></p>
    <p>Thank you in advance for any comments!</p>
    <p>PS. I'm planning to balance the 'o', I'm also thinking of making the whole thing less slanted, however I'm worried that 'z' would become less legible.</p>
