      <p>I quite like it, but agree that there are major legibility issues. I don't think the 't' works connected to the 'z' and 'r' at the bottom definitely looks too much like a 'y'. </p>
      <p>I'd be tempted to beef up the weight of the letteforms and give them some more space. I think the C formed from the bottom of the J needs to be closer to the rest of Choir.</p>
