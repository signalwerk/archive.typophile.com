  html: |-
    <p>Hello type people!</p>
    <p>I am working on a design for a client running an online business selling GPS navigation units for Audi &amp; Volkswagen. There a few issues me and my client are having:</p>
    <p>1. Can't decide which of these logotypes are appropriate for the market. His competitors are doing a terrible job establishing an aesthetic, so we have to make a new one. The trouble is in what fits a business dealing with medium-high range luxury vehicles (said from an average income perspective of course:)</p>
    <p>2. Can't decide on layout decisions, my client is having a great deal of trouble choosing, so am I since my clients are usually very opinionated.</p>
    <p>Thanks guys,</p>
    <p>Typophile's interface makes you want to really join the community! (y)</p>
    <p>&lt;3 to all type lovers.</p>
    <p>oh and i understand that most of the work you see here is not design for print.</p>
