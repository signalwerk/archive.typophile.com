    html: <p>I agree with eliason. I like the top right logo. But I assume "vag" is supposed to stand for Volkswagen Auto Group. In all lowercase, it looks less than V-A-G than it does a word that's slang for, well, a word that starts with "vag." I wonder if you could create a logo in the spirit of that one, but in all caps (at least for the VAG part of it).</p>
