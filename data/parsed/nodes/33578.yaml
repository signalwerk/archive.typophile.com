    html: <p>According to the Baines/Haslam <a href="http://www.amazon.com/Type-Typography-Phil-Baines/dp/0823055280/ref=pd_bbs_sr_1/002-0092307-4095208?ie=UTF8&amp;s=books&amp;qid=1178825147&amp;sr=8-1" rel="nofollow">Typography</a> book, Tuscans are classified as such based on whether or not their serifs fork. The passage goes on to say that toward the end of the 19th century, Tuscan stems began to aquire "bulges" (from which one would guess the diamond-shaped embellishments evolved).</p>
