      <p>I belief the "diamond thingies" described here are typical Tuscan embelishment arising out of 19th century woodtype design. I'm no type historian so identifying the "first" example is beyond my brain.</p>
      <p>What's cool about this is that it combines the tuscan element with an industrial feeling geometric slab. The result is a very hip mashup.</p>
      <p>BTW following is a digital font I'm pretty sure, the serifs are off but the basic slab, and diamonds are right on.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/western_4452.jpg"></div><p></p>
      <p>This also is in the same veign, but a sans:<br>
      <a href="http://www.myfonts.com/fonts/woodentypefonts/gothic-tuscan-round/" title="http://www.myfonts.com/fonts/woodentypefonts/gothic-tuscan-round/">http://www.myfonts.com/fonts/woodentypefonts/gothic-tuscan-round/</a></p>
