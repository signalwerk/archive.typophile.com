    <p>I am submitting a file to a printer who does not do trapping and I know very little about it. I’m wondering if I can get advice from anyone out there about how to manually set a trap. I’m using Adobe Illustrator. Basically, I’ve got a cmyk blue knock-out square adjacent to a 100% black knock-out square. There’s small reversed type in the black square, so I want to leave it 100% black. Is the solution simply putting a thin overprinting blue stroke (same cmyk values as the blue specified above) right where the colors touch? Any advice would be appreciated.</p>
