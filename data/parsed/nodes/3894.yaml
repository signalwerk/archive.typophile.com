    html: '<p> BJ: Cool article.  I keep wanting to keep the campy sci-fi-esque "tron" at the end, so my current favourite candidate is "Megatron".   <br> <br>Kyle: Thanks for the f suggestion.  I was afraid to have a low crossbar, but that might be better than making the letter extra tall. <br> <br>Alejandro: I had great difficulty making a nice N using curved strokes on both sides like the M does.  Using only straight lines would make the N too "normal" for this typeface, I think. <br> <br>Paul </p>'
