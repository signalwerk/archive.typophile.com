  - id: 29085
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 29 Nov 2002 — 10:41am
    date: 2002-11-29T10:41:00
    votes: null
    html: "<p> Pretty nice! The lc is improving fast. <br> <br>The biggest problem to me is an uncomfortable conflict between round and flat. For example compare the lc \"a\" and \"c\". This is less obvious in the UC as a whole, for some reason. <br> <br>The other \"global\" thing that bugs me is optical: at smaller sizes especially, things like the descender of the lc \"g\" and the top of the counter of the numeral \"6\" seem to be \"splaying\" at uneasy angles, disturbing the otherwise wonderful serenity of this design. It's an illusion, and since this is a display face you might just ignore it; or there might be a trick (like turning in the last tip of the flat part) that might help. <br> <br>Some glyph-specific stuff: <br>- Consider giving the UC \"I\" bars. <br>- I know the UC \"M\" is one of your \"mother glyphs\" here, but I think it needs a small mod: take the middle \"v\" lower. <br>- The UC \"Q\" still needs work: the inside is a little bit too strong now; the bottom-right is messy: what about this - make the corner a total 90-degree angle, and the \"tail\" go into it. You'll need some optical compensation. <br>- The UC \"X\" seems a bit too smooth. <br>- The diagonal of the UC \"Z\" is too wavy. Make it more like the \"X\" - three clear segments connected with abrupt curves. <br>- Lower the bar of the lc \"e\" a bit. <br>- The \"f\" and \"j\" are malformed. <br>- That lc \"r\" is going to be a spacing fiasco. <br>- I think the lc \"t\" does need a curl. <br>- The BP currency is strange. <br> <br>Keep it up! <br> <br>hhp </p>"
  - id: 29086
    user_id: 1258
    user_name: capthaddock
    user_path: null
    date_raw: 29 Nov 2002 — 11:47am
    date: 2002-11-29T11:47:00
    votes: null
    html: <p> Whew, I have my work cut out for me. <br> <br>I think I'll have to tackle the "round vs flat" issue with the lowercase letters first.  Then I'll work the other problems and repost.  I'll keep reading here for further suggestions.  Thanks, folks! <br> <br>Paul D </p>
