    date_raw: 1 Dec 2002 — 8:05am
    date: 2002-12-01T08:05:00
    votes: null
    html: <p> the original Q is way better. just my opinion, but i couldn't let it go. the second X is more distinct as well. although by itself the m is interesting, it does seem a little out of place with the middle stroke breaking the baseline. i like both S's, but the original was making my day. nice and squareish, but not square. for the t, maybe a tiny little tail ala din or meta. the first one was stronger than the second. the 3 seems a little top heavy to me. maybe a little assymetry would help. v.0.2 "?" is good. the original S and B were great. i think that's the way to go. you can see how personal preference shows up in these critiques. interesting, eh? oh yeah... the counter in the first D was bowing the vertical stroke inward. the second D is much more succesful. also, the G stands out, but not in a good way. something to do with hrant's "round vs flat"* issue. anyway, time for church. i look forward to seeing more of this. <br> <br>*copyright hhp </p>
  - id: 29088
    user_id: 1258
    user_name: capthaddock
    user_path: null
    date_raw: 3 Dec 2002 — 4:44pm
    date: 2002-12-03T16:44:00
    votes: null
    html: "<p>Here's another update: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/3157.gif\" alt=\"Metron version 0.4\"> <br> <br>Isaac, I'm begining to see what you mean about personal preference showing up in these critiques.  I'm still grateful to be able to draw on the instincts of experienced type designers, though. <br> <br>I've resolved the round-vs-flat conflict by making the lowercase letters all roundish on top.  It's a little more divergent from the uppercase that way, but I think it still fits, and the lowercase characters have more character. <br> <br>I'm still unsure about the f.  I think I'll leave the 6 for now; I like its shape despite the optical splaying. <br> <br>Paul D</p>"
  - id: 29089
    user_id: 1160
    user_name: Joe Pemberton
    user_path: null
    date_raw: 3 Dec 2002 — 6:12pm
    date: 2002-12-03T18:12:00
    votes: null
    html: "<p> Paul wrote: <br> <br>&gt; There seem to be a lot of knowledgeable and/or  <br>&gt; opinionated folks here. <br> <br>Hah. A worthwhile distinction. <br> <br>Overall, it's farily even but I question the g and y. Why  <br>not take them to the baseline? They sit slightly above  <br>and add to the jumpiness. <br> <br>Oh, and I like the x suggested by Eka Prasetya earlier. </p>"
