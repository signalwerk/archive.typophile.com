    date_raw: 28 Nov 2002 — 10:56pm
    date: 2002-11-28T22:56:00
    votes: null
    html: "<p>Thanks a ton for the comments, everyone.  Here's a revised version: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/3107.gif\" alt=\"Metron version 0.2\"> <br> <br>I've made the Q a little more quirky without puncturing the baseline.  I've modified the D, the S, the X, the Z, and a few others according to suggestion.  I'm still not happy about the t; I may have to give it a tail.  Eka, your X suggestion was a little to wild for this face, but I've given the glyph some curve. <br> <br>I've also begun the extended character set.  Aligning diacritics on the a is a challenge.  I'd like to hear opinions on the edth, too. <br> <br>Hrant, I think I like the double-barred yen better, at this point. <br> <br>Paul D</p>"
