    date: 2002-11-26T08:30:00
    votes: null
    html: "<p> It's a bit like Bronzo as a grown-up: much smoother, but with some new individualistic traits. I like how there's enough organicity to give it a much richer character than something entirely mechanical; and it's not formally straight-laced, which is great (like the killer divergence between the UC \"M\" and \"N\"). The only UC glyphs that bug me are the \"D\" (too square), and the \"Q\": do something drastic with it, although since the font is so nice in all-caps I wouldn't ruin the line with a strong tail (except maybe as an alternate), so do something inside the bowl instead, like maybe cut straight from the bottom-left of the bowl to the (inside) top-left of the tail? <br> <br>The lc isn't nearly as convincing. For one thing, I think this design needs body, so make the xheight as large as you can. The \"m\" is great and the \"ae\" is smart, but the \"f\" and \"t\" are especially weak. The numerals are really nice, except the \"4\" needs more presence. The peculiars: try a single bar on the Dollar and Yen; lower and lengthen them (towards the inside) in the Euro. The \"?\" needs more presence too. The rest are pretty nice! <br> <br>Also: <br>1. This design needs at least one darker weight. But don't bother with an italic. <br>2. The rounded corners are a nice professional touch. <br>3. The name is right on. <br> <br>Go all the way with it! <br> <br>hhp </p>"
  - id: 29078
    user_id: 1258
    user_name: capthaddock
    user_path: null
    date_raw: 26 Nov 2002 — 12:32pm
    date: 2002-11-26T12:32:00
    votes: null
    html: "<p> Thanks folks.  I've never seen Bronzo, and I'll refrain from looking at it now so as not to pollute my own intuitions here.  I'll take all your comments into account for version 0.2. <br> <br>Bj harvey: thanks for rectumfying your quarrel that that Armenian troublemaker.  I'm not sure about the E and F, but I will try a different S. <br> <br>Hrant: Thanks for the tips.  You're right, I've been too conservative with the x-height.  Your comment on a darker weight is interesting, because I designed this font on paper for a much heavier weight, but thought it would be easier to start light and make the heavier afterwards. <br> <br>I don't plan on an italic, but I'd like to do other character sets. <br> <br>The rounded corners were inspired by FS Albert.  I thought they made it look more refined. <br> <br>Paul Davidson* <br> <br>*A good Scottish name.  If it's not Sco'ish, it's crrrap! </p>"
