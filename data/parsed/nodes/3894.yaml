    date_raw: 14 Dec 2002 — 6:03pm
    date: 2002-12-14T18:03:00
    votes: null
    html: '<p>A good article on naming...by Emily King...@ typotheque... <br> <br><a href="http://www.typotheque.com/articles/gorilla.html" target="_top">http://www.typotheque.com/articles/gorilla.html</a> <br> <br>from the article: "With colleague Matthew Butterick, (Tobias) Frere-Jones invented a system for the naming of successful typefaces: the name must have three syllables; the stress must be upon the second syllable; the name must end with a vowel, preferably a." <br> <br>Metrona? blah. <br> <br>Metronica might be too ravy. (rave-y) <br> <br>bj</p>'
