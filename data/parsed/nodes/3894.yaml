  html: <p><img src="http://www.typophile.com/forums/messages/29/3080.gif" alt="Metron version 0.1"> <br> <br>This is my first font.  It is not yet complete, but I'd like to get the opinions of the people on this forum.  There seem to be a lot of knowledgeable and/or opinionated folks here. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>For this font (tentatively titled Metron), I wanted to create an attractive, slightly futuristic sans serif typeface for display, corporate logos, and short lengths of text.  I also wanted to stay away from the super-geometric look that makes so many fonts gimmicky and unreadable.  The capitals were designed first, with the lowercase something of an afterthought (and still unfinished). <br> <br>The typeface was built around a sketch I made of an uppercase M.  I'm happy with it so far, but the N and the 7 have been problematic.  Also note that I haven't done any kerning yet. <br> <br>I welcome any help I can get.  Go ahead and be as nitpicky as you want.  I'll offer free copies (once it's done) to anyone who posts something helpful here. <br> <br>Paul D</p>
