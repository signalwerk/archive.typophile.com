    html: <p> The problem at this x-height is that the descenders on the g and y would go lower than the ascenders go high. <br> <br>Paul </p>
  - id: 29091
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 12 Dec 2002 — 8:06am
    date: 2002-12-12T08:06:00
    votes: null
    html: '<p> Looking good! I think the curve/flat issue is mostly resolved - maybe a few tweaks here and there. <br> <br>Nitpicks: <br>K: too curvy <br>L: too wide <br>S: something wrong <br>V: narrower base <br>Cedilla: simplify <br>f: still ungainly <br>m: wider <br>r: shorter beak <br>s: more open <br>t: more "timid" <br>v: narrower base <br>oe: "o" wider <br>eszet: narrower top <br>4: too open <br>diaeresis: dots <br> <br>Otherwise, very shmoove. <br> <br>hhp </p>'
  - id: 29092
    user_id: 1258
    user_name: capthaddock
    user_path: null
    date_raw: 12 Dec 2002 — 12:33pm
    date: 2002-12-12T12:33:00
    votes: null
    html: "<p>Hrant: I agree that the K is too curvy (I've yet to fix it), and I've reworked the S. I'd be interested in knowing why you think the v's need narrower bases.  My cedilla was an attempt at a compromise between the simple French cedillas and the curvier Portuguese. <br> <br>I'm including here a little test image that uses text blocks of the font.  It gives you a bit more of an idea how the letter shapes fit together.  They worked better than I expected, I think, given some of the odd shapes.  Seeing it in the text, I'm more confident about the t now.  That could just be my inexperience talking. <br> <br>By the way, those little dingbats are part of Metron Ornaments, a companion font. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/3264.gif\" alt=\"Metron text\"> <br> <br>Paul</p>"
  - id: 29093
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 12 Dec 2002 — 1:04pm
    date: 2002-12-12T13:04:00
    votes: null
    html: "<p> This is too suave! <br>Just the spacing is too tight, especially where sequences of \"i\"s and \"el\"s are clotting like crazy. <br> <br>The \"v\": look at \"Jovian\" on the third line: it's more like \"Jouian\". But the \"t\" doesn't seem as overpowering in text, although I still think it needs to be pulled back a little. On the other hand, I'm surprised how well the \"r\" works! But now I think the \"e\" needs a slightly smaller eye. <br> <br>Your single biggest eyesore is the \"f\" though: it's ruining almost any word it's in. <br> <br>BTW, the Space angle is right on! <br> <br>hhp </p>"
