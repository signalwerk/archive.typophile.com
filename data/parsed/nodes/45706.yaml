  html: |-
    <p>Mário Feliciano's Merlo looks like a very useful set of fonts. Unfortunately, the Feliciano website seems to be down. The one time I got to it, I believe it showed 10 fonts in the family, for about $320 US. Merlo is also offered by Village for $120 the family, but the family is four fonts --  though the two "expert" fonts do include os figs &amp; small caps.</p>
    <p>Anybody know what else comes with the family from Feliciano? In principle, I'd prefer the designer get all the money, but the iffy website is a problem.</p>
    <p>TIA, Charles</p>
