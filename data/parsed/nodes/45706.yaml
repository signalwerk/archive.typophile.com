      <p>Charles, my impression from the Village web site is that Village is more of a cooperative than most foundries, and so each gets a bigger cut of the sales. That may be why Feliciano's web site has not been kept up so much. </p>
      <p>From the site:</p>
      <p>"We are the union of eleven young type foundries who have decided to go it alone, together. vllg.com is the information channel and boutique storefront for this group of equals."</p>
