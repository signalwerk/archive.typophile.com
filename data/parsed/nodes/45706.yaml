      <p>I recently purchased Merlo.</p>
      <p><a href="http://typophile.com/node/44367" title="http://typophile.com/node/44367">http://typophile.com/node/44367</a></p>
      <p>The version from Vllg is actually better than the version Mario actually sells. It has more ligatures, dingbats, and several other important features like fractions.</p>
      <p>There also differences in the vertical bearings and kerning:</p>
      <p>vllg:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/vllg_5649.png"></div><p></p>
      <p>felliciano:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/felliciano_3949.png"></div><p></p>
      <p>However the version that he sells has alternates in the italics that I really love:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/merloalts_5447.png"></div><p></p>
      <p>Also, Mario tells me there is an opentype version on the way soon. Hopefully all the features will be united.<br>
      Until then, buy the Vllg version then request from Mario the version he has.</p>
      <p>I really love using it. Next on my list from him is Rongel. I really love his work.</p>
      <p>All my best,</p>
      <p>Mike Diaz :-)</p>
