    <p>I’m sure we all agree that web font embedding is awesome and long-welcomed. </p>
    <p>But since House Industries and HF&amp;J are not yet on board, I’m looking for similar alternative. Oh hivemind, can you suggest some alternatives to Neutraface or Verlag?</p>
