    html: |-
      <p>If it doesn't need to be hosted by typekit, how about:<br>
      <a href="http://www.fontspring.com/fonts/hvd-fonts/brandon-grotesque" title="http://www.fontspring.com/fonts/hvd-fonts/brandon-grotesque">http://www.fontspring.com/fonts/hvd-fonts/brandon-grotesque</a></p>
      <p>Strangely enough Typekit offers some other Hannes von Döhren fonts.</p>
  - id: 443164
    user: 103
    date: 2010-12-11T02:23:00
    date_raw: 11 Dec 2010 — 2:23am
    votes: null
    html: |-
      <p>Brandon is a good suggestion, but test it on Windows first. HVD’s other fonts aren't <a href="http://static.typekit.com/render-waterfall-56738-ie7-windows-xp.png" rel="nofollow">hinted for XP rendering</a>.</p>
      <p><a href="http://www.webtype.com/font/agenda-medium-family/" rel="nofollow">Agenda</a> and <a href="http://www.webtype.com/font/apresre-family/" rel="nofollow">Apres</a> (for small text) have some similarities.</p>
  - id: 443166
    user: 7285
    date: 2010-12-11T03:47:00
    date_raw: 11 Dec 2010 — 3:47am
    votes: null
    html: <p>That's interesting Stephen - I always wondered how used Windows users are to sub-par font rendering, so whether it is something they notice or not.</p>
  - id: 443187
    user: 103
    date: 2010-12-11T09:21:00
    date_raw: 11 Dec 2010 — 9:21am
    votes: null
    html: <p>They usually see fonts like Georgia, Arial, and Verdana that were optimized for Windows, so it hasn't been a big issue until now that <a href="http://typographica.org/2010/on-typography/the-webfont-revolution-is-over-let-the-evolution-begin/" rel="nofollow">new webfonts are available that aren't always optimized</a>.</p>
