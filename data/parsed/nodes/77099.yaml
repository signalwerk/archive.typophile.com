    html: <p>They usually see fonts like Georgia, Arial, and Verdana that were optimized for Windows, so it hasn't been a big issue until now that <a href="http://typographica.org/2010/on-typography/the-webfont-revolution-is-over-let-the-evolution-begin/">new webfonts are available that aren't always optimized</a>.</p>
