  html: <p>David Pankow has been for many years the curator of the Melbert B. Cary, Jr. Graphic Arts Collection, also known as the <a href="/wiki/Cary%20Library" class="freelinking" rel="nofollow">Cary Library</a>, at the Rochester (New York) Institute of Technology. Pankow also teaches a class at RIT on "The History of the Book," and was for some years the editor of the American Printing History Association's journal, "Printing History."</p>
  html_clean: <p>David Pankow has been for many years the curator of the Melbert B. Cary, Jr. Graphic Arts Collection, also known as the <a href="/wiki/Cary%20Library" class="freelinking link-lost" rel="nofollow">Cary Library</a>, at the Rochester (New York) Institute of Technology. Pankow also teaches a class at RIT on "The History of the Book," and was for some years the editor of the American Printing History Association's journal, "Printing History."</p>
