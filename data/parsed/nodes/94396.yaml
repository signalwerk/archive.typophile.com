  html: |-
    <p>Once again the sensibility of Paolo Roversi inspires me drawing my letters. These photos are from an old Ferretti ad campaign (1998 I think). The characters are from my „Webadvanced“ font. A thicker but meant to be elegant character which I’d love to keep some elegance and liveliness even in the smaller sizes on monitor. What a hard way to go!<br>
    I am listening to the beautiful semiclassical music of William Orbit.</p>
