      <p>Harry Chester is "the designer primarily responsible for for the introduction of cheezy monster type into our shared collective cultural subconscious."</p>
      <p>"I've never found any typefaces that look remotely like this. The closest I've found was a family of typefaces called Interlock marketed by Typositor. The most well-known offspring was called Ad-Lib."</p>
      <p><a href="http://new.myfonts.com/fonts/bitstream/ad-lib/" title="http://new.myfonts.com/fonts/bitstream/ad-lib/">http://new.myfonts.com/fonts/bitstream/ad-lib/</a></p>
      <p><a href="http://www.houseind.com/fonts/edbenguiatfonts/viewfonts" title="http://www.houseind.com/fonts/edbenguiatfonts/viewfonts">http://www.houseind.com/fonts/edbenguiatfonts/viewfonts</a></p>
