    <p>1) I am seeking a consistent and clear method for naming the various fonts in my latest face. I have one face, three cuts, and four styles of each. Should I include the cut name in the OT Family space, or in the OT style space? In the Pre-OT naming fields, I have to include the cut in the Name space?</p>
    <p>2) If a typeface includes an oblique version, but not a true italic, is it appropriate to refer to it as an italic in the older naming systems, for backwards compatibility in applications that will otherwise try to render a fauxitalic effect? In the notes and filenames it is referred to as an Oblique.</p>
