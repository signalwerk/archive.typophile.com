      <p>Thanks, Adam. Based on that reasoning, since it is rather common that one might be using Adobe CS apps and other apps on the same windows machine, it seems that consistency would be the best route to take. So the Cut should stay inside the name.</p>
      <p>Does anyone know if the behavior of Windows Vista is different (specifically, using OT naming methods) from previous versions of Windows?</p>
      <p>As far as the Italics, I understood that I was limited in the style names that would be acceptable in the old-style applications. I am curious- what do others expect with fonts that have an oblique but no italic. In MS Word, would you rather the "<em>I</em>" button turned on the oblique and called it italic, or that it rendered a faux italic from the regular? If the former, would you then be confused if the Apple/Adobe apps called it Oblique instead of Italic?</p>
