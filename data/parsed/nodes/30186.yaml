      <p>Regarding font menu names and Vista:</p>
      <p>Microsoft's new Windows Presentation Foundation (WPF) handles font names in a completely new way, based on trying to shoehorn them into families that fit within the CSS spec's ideas of how family members can differ. WPF is an optional install with Vista, and will also be made available for XP.</p>
      <p>Here are the slides from my presentation on the topic: <a href="http://blogs.adobe.com/typblography/atypi2006/CSS%20&amp;%20OT%2015.pdf" title="http://blogs.adobe.com/typblography/atypi2006/CSS%20&amp;%20OT%2015.pdf">http://blogs.adobe.com/typblography/atypi2006/CSS%20&amp;%20OT%2015.pdf</a></p>
      <p>Cheers,</p>
      <p>T</p>
