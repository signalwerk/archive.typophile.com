    html: |-
      <p>Choz, </p>
      <p>for OpenType (PS or TT) fonts, you can use arbitrary styles names in the OT (preferred) Style Name field (which is used in the Adobe and Apple font menus) but you should not use any name except the standard four ("Regular", "Italic", "Bold", "Bold Italic") in the normal Style Name field (which is used for the Windows style-linked groups in typical Windows applications). </p>
      <p>In the OpenType preferred naming, you could have wither the family name or the style name including the cut name, i.e. it would be "Cunningham Soft"-"Oblique" or "Cunningham"-"Soft Oblique". It really is a matter of how you want to present the fonts in the Apple/Adobe menus (three entries in the family menu with 4 subentries for styles, or one entry in the family menu with 12 subentries for styles). </p>
      <p>Since Windows style-linked groups can only have up to four members, putting the cut name into the family field may be a better idea because then you can use the same naming for both the Windows and the Apple/Adobe menus. </p>
      <p>A.</p>
