      <p>May I interject and give the opinions of a web developer and Mac user:</p>
      <p>As a user I like Family names to be atomic, and Style ("Sub-family") names to be diverse. This way I get a shorter font menu with names such as "Univers", which if selected gives me the Regular style. If I then want to choose a variation of Univers, I can select "47 Condensed Light" from the submenu. Contrast this with how Arial displays. I have four Families listed for this one font! Arial (r,b,i,bi) Arial Black (r,i) Arial Narrow (r,b,i,bi) and Arial Rounded MT Bold (r). I can't for the life of me understand how Monotype managed to screw up that last one so much!</p>
      <p>As a web developer, I recognise that the CSS properties (font-family, font-style, font-weight, font-variant) are very crude. How does one reliably select "Univers 47 Condensed Light"? But I have found the solution is also very simple, use the Postscript name as the font-family!<br>
      html { font-family: 'Univers-CondensedLight', 'Univers', sans-serif; }<br>
      The above works on all the browsers I have to hand, but obviously I can't vouch for WinIE.</p>
      <p>Looking through Thomas' presentation (thanks!) I see that how Vista handles Fonts will be very similar to how the Mac has handled them for the past decade. This is great news as it seems to be converging on what I like (more styles, fewer families).</p>
      <p>Lastly, I implore you to use Oblique for an oblique font, and Italic for an italic font, and not to mix the two—firstly it hinders the education of non-typophiles, secondly it looks bad to people who know about type, and third, as you have pointed out, you can't subsequently add an italic style if the name has been used up. You can use the head &amp; OS/2 style linking bits to get QuickDraw and Windows 3.1 to understand them without compromising the nice style names. CSS explicitly distinguishes between regular, italic and oblique—please support this and don't make things more difficult for browsers/OSes or us web developers :-)</p>
    html_clean: |-
