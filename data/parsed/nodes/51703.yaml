      <p>The tool is merely the extension of the mind and the interface between thought of form and rendition of form. I see no advantage in discarding any past or future tool or way of working if it helps you get the desired result. Condemning or ridiculing someone else's way of working is a waste of time. None of us knows what will shape the next good result in type forms. Use whatever you can or want to but there is no need to control what others may use. </p>
      <p>Make type, not noise.</p>
      <p>ChrisL</p>
