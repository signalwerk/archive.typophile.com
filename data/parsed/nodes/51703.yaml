      <p>Save the hostilities for never.</p>
      <p>&gt; Hrant, Nick, what new tools are you guys using to replace pens, pencils &amp; their electronic equivalents?</p>
      <p>Tools are and always have been improving all the time. It's interesting that you see a computer as an equivalent to the pen. I'm not even sure when a pen became a pen and stopped being a stick.</p>
      <p>First, maybe I'm being naive when I say this but, the fact that certain letters are certain shapes is, for me at least, nothing more than an 'accident'. You can see this by the way two (phonetic) written languages with similar sounds may have completely unrelated shapes to describe them, e.g. Hebrew and Latin.</p>
      <p>Next, I think therefore that the skeleton of an individual letter (I'm not talking about stress or serifs or angularity or anything else) is arbitrary; that is to say, it ought not to make a difference if it had been initially described with a stick, with a pen or with another (equally) effective method of leaving a mark on another material.</p>
      <p>It logically does not follow to say that the best method of designing a character must be driven by what someone's pen (or stick) did hundreds and thousands of years ago on a sheet of wax/papyrus/paper/a tree/a cave wall or whatever. That would be like saying to an aeroplane designer, don't forget that one of the first methods of crossing a large expanse of water involved carving out the trunk of a non-porous tree (forgive me if my nautical history is hazy). Technology is continually evolving. Don't try to tell me that Boeing think that several logs tied together with twine is even remotely useful when designing the next generation of hyper-efficient airliner.</p>
      <p>An A is A-shaped. That the 'pen' was responsible for the skeletal shape itself is like attributing the <em>content</em> of this post to the 'personal computer'. On one level, of course, it's perfectly true but not very meaningful.</p>
      <p>So answer me this, which came first; writing or the pen?</p>
      <p>Hrant, don't go! Surely not even you are saying that an A can be a different shape from an A. That's what an A is!</p>
