    html: |-
      <p>Nick, I haven't left; Graham -and Michael- have left for me.</p>
      <p>&gt; the skeleton of an individual letter ... is arbitrary</p>
      <p>In fact, there is no skeleton! The reason for this is simple: when it comes to the <em>purpose</em> of type (not necesarily the same thing as why a given person makes type), which is to be read, we don't read the black bodies, we read the contrast between black and white. A tool that marks the black imposes a dysfunctional design constraint: a relationship between the two sides of the black; the relationship should be only between the black and the white - we must design the border, not the body. This is true even if one is "minding the white" when making the black; the pointless constraint remains, no matter how hard we try. In the worst case -like a font made directly from calligraphy- it becomes a master-slave situation; in the best case it's still an unequal marriage, thus non-ideal.</p>
      <p>The shedding of the illusional "skeleton" concept is the key that lets type be more than merely where it came from - which btw is not just the pen, but a host of other marking methods, some much older than the pen. The pen is simply what has come to look prettiest to the greatest number of people, becoming crushingly mainstream, and thus elevated to a mythical stature, holding us back. We are worshiping a corpse.</p>
      <p>Somebody who refuses to see this (which is not the same thing as making non-chirographic fonts - I myself am still stuck on the black!) is generally simply afraid of what it implies about his body of work, or maybe of what it implies about his adored teachers.</p>
      <p>hhp</p>
