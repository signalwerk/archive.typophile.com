      <p>&gt; The pen, in all its manifestations, is the source of letters.</p>
      <p>That's like saying the source of music is the (insert whichever musical instrument came first). The source of anything 'creative' is surely the mind: we're just imitating God (made in his image). The tool that was first used to produce it is merely coincidental. It doesn't have to inform how things are now best done, or how they will be done better tomorrow using different tools. I guess someone wrote with his/her finger in the dust of the ground prior to any pen being made. According to your logic, it could be argued that the source of letters is some Neanderthal's hand with or without a rock in it. </p>
      <p>If I have understood you correctly, I think you would also say that the 'source' of domestic lighting is fire. However, today's best and brightest lights today have nothing to do with fire. Hrant may or may not be the Thomas Edison of typography (only time will tell - it's said that it took Edison more than a thousand attempts before he got a bulb that worked). I admire Hrant for wanting to break new ground, that takes character and resolve, it's what enterprise is all about. I would be very wary of being the person who witnessed Edison's penultimate light bulb experiment and branded him a complete waste of time and space.</p>
      <p>I'm not sure why you push your pen argument so aggressively. Does it matter that much where letters came from? If so, why, please help me understand? Have you ever thought, even for a moment, there may be better ways of making letters than with your pens?</p>
      <p>Hrant, please show us what you've got so far. I and probably more than a few other are  intrigued.</p>
      <p>Sorry I haven't got a clue about that big A but DB may have nailed it!</p>
