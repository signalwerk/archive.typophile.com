      <p>&gt; The point is that everyone is right within themselves as long as they let their own means drive them to valuable ends.</p>
      <p>Chris: I love your peaceable approach but who decides what are 'valuable ends'? In my opinion some very bad men have fully justified their ends as valuable 'within themselves' and been objectively very WRONG.</p>
      <p>That said, Hrant may turn out to be justified that what he is concerned with is very valuable, indeed more valuable than supposedly informative handwritten forms; who is to say what people will say of him in 500 years' time and good luck to him? </p>
      <p>I admire anyone who can draw a beautiful form with a pen. I admire Hrant because of his enterprise and boundary-pushing. If Thomas Edison walked into a bar, most of us would want to buy him a drink. Even if Hrant never has a breakthrough like that, one can't criticise him for his ennui with the pen. The guy is restless, eager to innovate and just got bored with it all, that's all. OK so maybe he's a little churlish to keep saying, "Michael, I'm bored with the very thing that you cherish."</p>
