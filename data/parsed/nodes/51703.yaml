    html: <p>Hrant, are you seriously suggesting that the traditional, received form of, for example, a letter A, is based on the remainder of the white space once it's been 'adulterated' by black? I always thought it was to do with 3 straight lines, to a greater or lesser degree. (I am open to being persuaded otherwise, by the way.) I'm not sure I warm to my methods of construction (whether or not they were influenced by the pen) being described as illusional (delusional?) but I do like your willingness to get out of the box that you perceive and to challenge the way people think if you sincerely think they've been hoodwinked, as long as it's not because you just don't like people, which is how it sometimes comes across to me at least.</p>
