    html: <p>Nasa is a little rare because you read it like a word,  acronyms such as International Business Machines (IBM)  or What you see is what you get (WYSIWYG)  don't pronounce as words so well. <br> <br>I would simply use the same conventions used for all other acronyms in the piece.  and if you choose to kern or vertically adjust the baseline I would bring to your attention another point Bringhurst makes. <br> <br><i>Kern consistently and modestly or not at all. </i> (page 32)</p>
