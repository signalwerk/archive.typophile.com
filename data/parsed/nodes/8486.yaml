    <p>I'm a self taught graphic designer who is still learning every day. I have been reading Elements of Typographic Style by Robert Bringhurst and The Complete Manual to Typography. <br> <br>My questions are, if parantheses are suppossed to be shifted so that they are optically centered with the text they enclose, how come they aren't just designed that way in the font programming? Are there instances where the parentheses need to be below the baseline? <br> <br>On the same line of thinking, how come the proper apostrophe character isn't the default, as well as the proper close quote character when you hit shift? Shouldn't dumb quotes be optional characters instead of the defaults. I know there are ways to reprogram your computer to do this, but why haven't the companies that sell fonts corrected this in the font coding itself? <br> <br>The answers are probably in the books I'm reading, but to a beginning typophile like myself, they are a bit, ahem, dry reading. <br>Thanks.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/8537" class="topic-previous" title="Go to previous forum topic">‹ Merry Christmas redux</a> <a href="/node/8530" class="topic-next" title="Go to next forum topic">Taboo: Good type slutting/distorting/enveloping plugin for illustrator? ›</a></div>
