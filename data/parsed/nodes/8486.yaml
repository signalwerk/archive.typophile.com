    html: "<p>\"Dumb\" quotes have become the norm. (It's a dumb old world, innit?) <br> <br>Curly quotes tip off average readers that the text is too difficult for them (or the product advertised too upscale). Or that it's historical usage. <br> <br>The demise of the curly quote makes sense -- why complicate typography with unnecessary alternate glyphs for the same character, whose usage is determined by arcane contextual conventions? <br> <br>There is a parallel: the long \"s\" was a similarly deployed alternate form abolished during a period of rapid typographic modernization, c.1800. <br> <br>P</p>"
