    html: <p>The answer to the first question is that parentheses are usually designed to fit well primarily with lowercase characters and/or mixed case characters. I suppose all caps with parentheses is less called for as a rule. <br> <br>The answer to the second question is that computer character sets are descended from those used by teletype terminals which were in turn descended from typewriters. To keep the number of keys to a minimum, the straight quote mark was invented for typewriters. True typographic quote marks were added to computer character sets later when computers were adapted to set type.</p>
