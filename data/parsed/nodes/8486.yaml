    html: <p><i>to a beginning typophile like myself, they are a bit, ahem, dry reading</i> <br> <br>hmmm... maybe i'm just weird, but i loved reading <i>Elements</i>. I need to read it again... <br> <br>Most punctuation is designed to work best with the lowercase. One of the great features of OpenType is that if you set something in an all-caps setting, OT savvy programs can adjust the punctuation accordingly on the fly. nifty eh? <br>In the same respect, most typesetting applications do the same thing with quotemarks - automaticaly replacing (in most cases) the appropriate quotes for the job. Not all applications do this, resulting in my pet peeve of typography - the ugly, stray prime mark as an apostrophe. <br>Even though good applications should be able to do as much of this kind of thing as possible without you having to do a lot of tweaking, you should be aware of these kinds of things so that you can make sure that these auto replacements are in fact doing what you want them to and not just messing up your text setting.</p>
