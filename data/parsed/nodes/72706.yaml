  - id: 429344
    user: 29994
    date: 2010-09-12T16:45:00
    date_raw: 12 Sep 2010 — 4:45pm
    votes: null
    html: |-
      <p>Okay, that was fun :-)</p>
      <p>Here is a link to the script I wrote for Illustrator CS4 (it might or might not work for any other version): <a href="http://www.jongware.com/binaries/monolinetext.v1.0.zip" rel="nofollow">monolinetext.v1.0.zip</a>. It's a Javascript for Illustrator, and you can put it into the regular Illustrator Scripts folder to see it appear in the "Scripts" menu, or somewhere else (and you'd have to browse for it each time).</p>
      <p>It shows a little tiny dialog (on which I spend <em>most</em> of the time) where you can enter a size in "points" (relative to the 29 units high Hershey characters) and enter some text. Use Shift+Enter to insert a 'Hard Return', or enter as much text as you want. The text is then drawn out in monoline characters in the center of the screen.</p>
      <p>The script is intelligent, in that you can change a previously drawn text by simply selecting it and running the script. Note, however, that stuff like manual scaling and changed attributes (stroke width, color) will be lost. If that's important to you, I might look into it ...</p>
      <p>It only supports a small subset of the Hershey Simplex set -- just ASCII, space up to tilde. (And it draws traditional K shapes.)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/monolinetext_5597.png"></div><p></p>
