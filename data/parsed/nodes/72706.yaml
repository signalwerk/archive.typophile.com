    html: |-
      <p>Type 3 fonts supported almost anything you could do in PostScript, except for color and some other things that were added later. This would include stroked paths. Letterror's Beowolf font, which randomly moved points around each time you printed, is an example of the sort of thing that was possible with Type 3. You could even make a "clip art" font that included different shades of gray, etc.</p>
      <p>The problem is that this format is obsolete, as far as I know. If there is still software that supports it, I'm not aware of it. Of course, old software still supports it, if you can find it and run it.</p>
    html_clean: |-
