    html: |-
      <p>A big problem with stroke fonts is that you need some way to express modulation of that stroke, or else you get pretty cruddy results. For example, it's important to be able to have thinning where a round stroke meets a separate curved stroke (as in the lowercase "d"). The reason that there aren't many formats around that support them is that unless one makes the format super-complicated, they produce rather poor results.</p>
      <p>Cheers,</p>
      <p>T</p>
