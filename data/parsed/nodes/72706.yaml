    html: |-
      <p>Thomas: While you are correct that the results may not look that great without modulation, these sorts of fonts are used when there are hardware limitations based upon the output device.</p>
      <p>If you have an old-fashioned pen plotter, in most cases you simply can't modulate the stroke. In other situations, you may have to physically fetch another tool, and you will have a limited set of tool sizes available.</p>
      <p>When I'm making printed circuit boards, my CAD software uses a font like this. It is not a very pretty font, but it is fine for the kind of short single words you use.</p>
      <p>Looking at the other responses here, it seems that there isn't a way in Illustrator to do this, am I correct?</p>
      <p>I could easily imagine a plug-in or a separate app that generated the outlines and let you paste them into Illustrator, but I haven't found one yet.</p>
