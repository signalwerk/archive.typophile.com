      <p>The monoline <a href="http://idlastro.gsfc.nasa.gov/idl_html_help/About_Hershey_Vector_Fonts.html" rel="nofollow">Hershey Fonts</a> have a quite liberal license (correct me if I'm mistaken on this ;-) ), and it really shouldn't be hard to write a Javascript that allows you to input text into a dialog, then draws that string using single line paths only.</p>
