  html: |-
    <p>I have a need to create artwork for use with a CNC router that incorporates type. My router-guy wants it drawn with a monoline font like people use with AutoCAD for use with pen plotters. I'm talking about a font that builds letterforms from a single vector that goes down the center stroke of the letterforms. </p>
    <p>I'm under the impression that Postscript/Opentype/Truetype are not capable of defining fonts that are built in that manner. I've googled around and I am pretty sure I am correct but I'm wondering if any of y'all can verify. I'm designing in Adobe Illustrator. </p>
    <p>Thanks!</p>
  html_clean: |-
    <p>I have a need to create artwork for use with a CNC router that incorporates type. My router-guy wants it drawn with a monoline font like people use with AutoCAD for use with pen plotters. I'm talking about a font that builds letterforms from a single vector that goes down the center stroke of the letterforms. </p>
    <p>I'm under the impression that Postscript/Opentype/Truetype are not capable of defining fonts that are built in that manner. I've googled around and I am pretty sure I am correct but I'm wondering if any of y'all can verify. I'm designing in Adobe Illustrator. </p>
    <p>Thanks!</p>
