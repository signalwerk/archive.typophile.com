    html: "<p>I recognize myself in your description. I did an intern in a small office where I spent most of my time redrawing logo’s. They offered me a job &amp; hesitantly I agreed thinking I’d keep my eyes open for a more creative job. Now my job description has expanded to -mostly making the layout for dull advertisements in cheap papers/magazines- &amp; every now &amp; then (whenever we get a more “creative” task) designing a logo or housestyle. I have to say that in my case I’ve changed my opinion of what I want to do &amp; now actually enjoy dull assignments. When I graduated from high school I was very excited about finally going to art school, but everything about it disappointed me to a level that I stopped drawing for a couple of years (I used to draw manually &amp; wanted to become a cartoonist ever since I was a kid). At that point, I was getting some recognition for my comics, but I wasn’t able to do anything with it ’cause I lost the will to draw. Currently, I’m constantly drawing in my spare time &amp; LOVE the fact that you don’t have to make any compromises. You’re your own best judge &amp; personally I always have trouble communicating about my designs with people who know *** about it. I keep my dull job just to escape from the risc of losing my hobby. I don’t know if this makes any sense to you at all, but let me put it this way: if you really enjoy being creative, no job will stop you from doing so except maybe one that requires you to be creative and compromise in your designs. A lot of people here will probably disagree with me, but my advice is: don’t mix business with pleasure!</p>"
