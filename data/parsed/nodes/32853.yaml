      <p>I hear you, Asvetic. Been there, felt that. Comfort is the enemy!</p>
      <p>One way I got out of that was by switching jobs, but since you can’t do that just yet, I have a few suggestions:</p>
      <p>If there is some specific area of design that you’ve always been particularly keen on and want to get into in Philly, start preparing for that now by giving yourself assignments to do in your spare time. You can also look at it as a portfolio-building endeavor.</p>
      <p>Another way would be to sign up for a design-related workshop or class — something that would get you in touch with like-minded individuals, teachers, etc., who could offer you a fresh perspective on design. Since you are here on Typophile, I suggest a letterpress class, but it could be anything that would get you out of the box you are in. (Maybe you could even do some informational interviews at other studios where you now live.)</p>
      <p>Also, just remind yourself that you won’t be in that job forever, and that things aren’t hopeless.  :-)</p>
