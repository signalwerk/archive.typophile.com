      <p>I don’t want to do what I love for a living. What I love has to be protected at all costs.</p>
      <p>When I was a professional musician it fundamentally changed my relationship to music and it took me years to repair that after I changed careers.</p>
      <p>So I’m a musician at heart and I design for a living.  It’s a very good compromise for me. I really like design and take it very seriously, but when someone tells me to move the logo a quarter inch to the right, it’s annoying but it doesn’t hurt my heart…</p>
      <p>In the meantime back in my bedroom I can play whatever I want whenever I want.</p>
      <p>peace</p>
