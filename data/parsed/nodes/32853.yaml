      <p>It is easy to think a “dream job” will just visit you one day soon and all will be well. The truth is, any job is work and much of it is not fulfilling and creative. Dream jobs rarely happen and some of those dreams evolve into nightmares. This is not a design career issue. It is an any career issue. You get paid to do the things someone else either can’t or does not want to do. Much of it is not fun, all of it is work. You are already planning a change which is good. Realize that wherever you go, it will never be like school again. You pay them to go to school—they pay <!--
