      <p>Yep, my first Fiction writing teacher told us that he decided, when he realized that what he really wanted to do with his life was write, that he needed to find a job that would not be satisfying, and not use any of his creative juices so that he would be motivated to write, have the creativity to do it, and keep his ambitions of writing. </p>
      <p>He worked on train gangs up north, but that left him too exhausted to write, so he ran away from there and became a taxi driver. He wrote his first novels that way. </p>
      <p>But of course, that approach removes the comfortable living.<br>
      I can relate, too. I’m in a job with no hope of going anywhere better, and I am rapidly running out of things to learn, but it pays the bills and so I’m not entirely motivated to shake up my world right yet. </p>
      <p>K.</p>
