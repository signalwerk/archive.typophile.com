      <p><cite>...I lost the will to draw.</cite> </p>
      <p>In a nutshell... yes! </p>
      <p>I remember in college, I was such a cocky jerk about design. I had a lot of my profs in my pocket. I was outspoken and made a point to comment on everything any chance I got. I found most of the design projects were “easy” and I wouldn’t put as much effort as I could/should have. After school I felt I was OWED a job in a well established design house, oh the reality hit me VERY VERY HARD! My father actually found me a place in his company and for the last 3 years the confidence I had in college slowly suffocated under the shear boredom of my work. I’m not under-appreciated for my talents, but I’m not necessarily challenged either.</p>
      <p>I know a lot of people would kill for my position, and I shouldn’t complain, but I have this feeling I’ve “sold out” and not in a good way.</p>
