    <p>I’m currently in designer’s limbo. It’s not that I’m not designing, but I’ve become very stodgy with my designs. </p>
    <p>I work as an in-house designer for a very dry consulting firm that deals with the Navy. Most of the stuff I do is very formulaic. I create a template and then adjust it slightly for every iteration of a project. I get to do a lot of things but nothing is really experimental or even remotely creative.</p>
    <p>The worse thing about it is, I’m truly the only creative energy in the office, I art direct myself with the little input I have from the project heads. I remember in college the creative energy was so strong, like a giant forest blaze. Here it’s like a nitelite. </p>
    <p>Ultimately, I’d really like to move on. I have friends and family in Philadelphia, and I understand the opportunities are exponential. I can’t make the move right now for personal reasons unrelated to design, but maybe later this year. </p>
    <p>My concern is I think I’ve become pessimistic to design. I no longer find it appealing, and I think it’s because of my current environment. I’m in a funk and I think it’s going to disrupt my chances of moving into the next stage of my career. I like the company I work for, and I can’t deny the comfort of my current life. But, I know I’ve made artistic sacrifices for it. </p>
    <p>Am I doomed, has anyone been in my position before? Is it a stage we all go through? How can I be re-motivated and inspire myself to seek a better creative outlet?</p>
