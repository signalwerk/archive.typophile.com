  html: "<p>Hello. <br> <br>I am trying to find a match to the attached pixel font, the font image is taken from the Group94 site. <br> <br>I have looked at all the major screen font sites (Atomic Media, FFF, Pixietype, Ultrafonts etc.) but have had no luck. The closest match so far is Craig Kroeger's (miniml.com):  Standard 09_56, which has a similar l/c 'a', not quite the same height though. <br> <br>If anyone had any leads, it would be much appreciated. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/41477.jpg\" alt=\"\"></p>"
  html_clean: "<p>Hello. <br> <br>I am trying to find a match to the attached pixel font, the font image is taken from the Group94 site. <br> <br>I have looked at all the major screen font sites (Atomic Media, FFF, Pixietype, Ultrafonts etc.) but have had no luck. The closest match so far is Craig Kroeger's (miniml.com):  Standard 09_56, which has a similar l/c 'a', not quite the same height though. <br> <br>If anyone had any leads, it would be much appreciated. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/41477.jpg\" alt=\"\"></p>"
