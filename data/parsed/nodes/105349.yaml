    html: <p>I think the most sensible solution would be to slide the s behind the k. Similarly to how you did in the very top option (from the first post), but with a smaller gap. Then, if you look at that option, it lacks the self-consistency due to rounded corners that you added. I'd consider ditching them and just go with the original shapes (or at least changing them in a way that preserves angular appearance). I think tucking the s behind the k is enough to shape the wordmark.</p>
