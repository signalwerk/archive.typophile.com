  html: |-
    <p>I'm working on customizing Myriad Semibold for a suite of products for my organization. One place I'm having difficulty is with the word "Talks," specifically the way the foot of the k bumps into the s when spaced tightly. (Myriad Semibold with -25 letterspacing is the base for all the wordmarks, which I've then modified.)</p>
    <p>Here are some attempts at resolving the k/s pair.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/talks_5292.jpg"></div><p></p>
    <p>The one I've been leaning towards the most is the last one - I like the way the k bumps into the s and suggests script or a serif, but only on the bottom. I don't like the way the s' tail (terminal? finial??) ends above it, so I've tried a few things. But it's proving tricky and downright unsatisfactory:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/talks_ks0_5096.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/talks_ks1_3569.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/talks_ks2_5334.jpg"></div><p></p>
    <p>Maybe the top two have the most potential; although I felt that the way the k suppresses/cuts off the s was antithetical to the nature of the product (lectures for students).<br>
    Any tips, possibilities or references to ks ligatures would be much appreciated!</p>
    <p>Lisa</p>
