    html: |-
      <p>I suspect that the bottom half of the shin is too wide. Probably in a heavy weight, the white spaces close up more on the bottom, and look more balanced. When you go to a lighter weight, sometimes you have to change shape to keep the rhythm of counters the same. </p>
      <p>In latin type we have that kind of problem working with weights with the aeg, where there are three strokes to work with in a small space; that's similar to the shin problem.</p>
