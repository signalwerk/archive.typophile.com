      <p>The middle vertical stroke of the shin, and as Bill points out the left vertical stroke of the ayin are very straight and mainly of a single width.</p>
      <p>They stand out because of this, and therefore seem odd.</p>
      <p>Also, as a result, their is less rhyme and rhythm to text set in it. The music of text is its movement seen in its letters' shapes.</p>
