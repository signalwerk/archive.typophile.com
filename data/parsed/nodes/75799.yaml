    html: |-
      <p>Eli,</p>
      <p>This is very nicely made. I never thought I'd see a Hebrew based on Lombardic letters, but I have now! This will make a very good type for children's books, I would think. As the father of two daughters, age 26 and 5, I have seen my share of children's books for girls, and I have a feeling this will be a success in that realm, perhaps for products, as well.</p>
      <p>If you follow the Lombardic manner, you might try adding that serifed foot on both sides. Here's an American example of well-carved Lombardic letters, from the Cathedral of St. John the Divine, in Harlem, New York City.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/lombardics25_4993.jpg"></div><p></p>
    html_clean: |-
