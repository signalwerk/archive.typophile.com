    html: |-
      <p>Eli,</p>
      <p>I reviewed Nadav Ezra's Tehila from FontBit. A traditional font with an unusual shin.</p>
      <p>After carefully looking at your Pnina El, your design is very provocative, as it conjures up a whole slew of styles.</p>
      <p>I particularly liked the serif spitz on the lower left of the shin. It subtly moves the eye forward leftward after the straight vertical middle bar of the shin. In addition, it creates more weight to the lower left side of shin, to better match the weight of the other letters. Plus, it's a stylistic uniqueness that makes this a special font.</p>
      <p>Clearly, you are a very talented designer.</p>
    html_clean: |-
