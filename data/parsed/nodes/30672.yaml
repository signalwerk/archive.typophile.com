      <p><em>Very Nice Nick - where do they come from -</em></p>
      <p>Originally, from Samuel Welo's <em>Studio Handbook</em> (1926); what you see is from an EPS file that's been sitting around on my hard drive for a couple of years, waiting for me to do something useful with it.</p>
      <p>Also worth looking at is the work of <a href="http://www.nga.gov/cgi-bin/psearch?Request=S&amp;imageset=1&amp;Person=68200" target="_blank" rel="nofollow">Paul Manship</a>, perhaps my favorite Art Deco sculptor (below, yet another piece of art without a home...)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/dancer_6365.gif"></div><p></p>
