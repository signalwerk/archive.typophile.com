  html: |-
    <p>1. I wonder how does one create a logo like Silverlight?<br>
    2. How should a strict BW version (not grayscale bit pure BW) look like ie. for vinyl cutting?<br>
    3. Which tools to use to create a scalable version of it other than creating a huge version in Photoshop?<br>
    4. Should logos like this be placed on a strict grid or are they more soft flexible (therefore harder or impossible to reproduce from scratch)?</p>
    <p><a href="http://silverlight.net/" title="http://silverlight.net/">http://silverlight.net/</a></p>
