      <p>&gt; 2. How should a strict BW version (not<br>
      &gt; grayscale bit pure BW) look like ie. for<br>
      &gt; vinyl cutting?</p>
      <p>I think the logo's designers would probably say that the logo was intended to always be reproduced in color or grayscale, and that BW non-grayscale versions were not allowed.</p>
      <p>&gt; Which tools to use to create a scalable version<br>
      &gt; of it other than creating a huge version in Photoshop</p>
      <p>Well, for the original logo art there's nothing wrong with using a big Photoshop file, if Photoshop seems like an appropriate tool for creating your art. Designers work with big files all the time. And only the original file will be huge, because copies for distribution will be saved as small EPS files, JPEGs, etc.</p>
