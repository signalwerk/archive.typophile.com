    html: <p>My guess is that this logo was created at a high resolution in a 3D program and is scaled down using Photoshop plugins that maintain the image quality better than built-in methods. You could try drawing it manually in Illustrator and then covert the gradients to steps of solids, but it probably won’t work well.</p>
