    html: |-
      <p>Well, I must say that when I first saw the typeface announced in the T-26 newsletter, I immediately noticed all the similarities, especially in the name Tirana which was displayed quite big.</p>
      <p>Of course this is an original font, but it borrows heavily on shapes, curves and design motifs as seen in Sophisto. This is not the first time this happens BTW — <a href="http://www.sudtipos.com/fonts-kautiva.htm">Kautiva</a> also suffers from this, albeit to a lesser extent.</p>
