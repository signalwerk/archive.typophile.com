    html: |-
      <p>Swift was designed by Gerard Unger in 1985, and is more than capable of performing the task to which you have assigned it.</p>
      <p>For the header, another design by Unger would certainly recommend itself. You may want to consult <a class="freelinking external" href="http://www.gerardunger.com/allmytypedesigns/allmytypedesigns01.html" rel="nofollow">a list of all his typefaces</a>.</p>
      <p>If for some reason you desire a Modern face, both <a class="freelinking external" href="http://www.gerardunger.com/fontstore/store-coranto.html" rel="nofollow">Coranto</a> and the earlier <a class="freelinking external" href="http://www.dutchtypelibrary.nl/Paradox_rdrct.html" rel="nofollow">Paradox</a> are drawn in this style. </p>
      <p>Caranto as well as <a class="freelinking external" href="http://www.gerardunger.com/fontstore/store-capitolium-news.html" rel="nofollow">Capitolium News</a> both have specific Headline variants.</p>
      <p>For a sans serif that is meant to be used for headlines, there is always <a class="freelinking external" href="http://www.gerardunger.com/fontstore/store-bigvesta.html" rel="nofollow">Big Vesta</a>.</p>
      <p>These fonts and others can be <a class="freelinking external" href="http://www.gerardunger.com/fontstore/store-howto.html" rel="nofollow">ordered directly from Gerard Unger</a>.</p>
