      <p>Here is a nice example of a mathematically perfect type area according to the golden section as used in old books:</p>
      <p><a href="http://www.sanskritweb.net/temporary/golden.jpg" title="http://www.sanskritweb.net/temporary/golden.jpg">http://www.sanskritweb.net/temporary/golden.jpg</a></p>
      <p>Example: If the vertical height (or depth) of the type area on the right-hand page is measured from the first top-right word "autem" to the bottom-right catchword "mente", and if the resulting measured height is divided by 1.618, you will get the mathematically exact line width. Contrariwise, if you measure the line-width of e.g. the first line on the left-hand type-area (i.e. "ptis ... iudica-") and multiply the resulting measured width by 1.618, you will get the mathematically exact height (or depth) of type-area (from top-right "iudica-" down to bottom-right catchword "In-"). Note that the catchword is included into the type-area of old books.</p>
    html_clean: |-
