    html: <p>Keep in mind that if you're designing a book that will be perfect bound and won't open flat, you'll lose quite a bit of page space in the gutter. That has to be taken into account in designing a layout and grid. Also, in a book with a reasonable page count, the pages "feather" on the outside, making it look as though the outside margins are wider.</p>
