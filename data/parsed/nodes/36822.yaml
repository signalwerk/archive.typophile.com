      <p>hey thanks guys, this is really useful stuff *makes mental note to start compiling an advice text-file*.</p>
      <p><cite> If you can get familiar enough with the information the content will lend itself to a grid automatically. </cite> good point, totally agree, but the spectre of budget is always hanging over my head in this small pub. company, I would love to let content determine layout but often it's a cost thing. for example I would love to employ generous margins on more text-booky works to use it for photos and call-outs but while it obviously looks better and works better it does feel a bit luxurious -- that said I haven't ever tried it on to see how it goes down...</p>
      <p>Generally I do allow for a generous gutter and have never had problems but I've never tried a double-page photo spread, so Gary, your trick is worth remembering. I've read that your outside margin should be the same size as your gutter</p>
      <p>Interesting Patty, that you know your page count before you begin laying up the text, who decides this? Wouldn't this force your hand in terms of deciding your margins? Oh BTW I dream of laying out a cookbook :) I love a well-designed cookbook</p>
      <p>Hey Uli, that's really cool stuff! I like that the golden section is used but in an internal way, it really is pleasant to look at and the margins here do not seem excessive. On a side point, interesting to note as many as four hyphens in a row and that the show through is inconsistent (unless that's a printing rather than a setting issue)</p>
      <p>I prob. would use the dummy on more complicated layouts, I think fairly simple book settings of one text block per page are probably OK to be resolved on screen or with print-outs. On another side point, as horribly ugly as it would be, as a reader I would love to see spiral bound bindings for everything, my kingdom for books that lie flat and don't need hands or mobile phones or shoes to keep them open...</p>
      <p>thanks everybody again so much for the advice</p>
