    html: |-
      <p>As Patty and others have indicated, the Golden Section is not always that useful for today's books. I've never found the oft-cited formula, à la Tschichold et al., applicable. Publishers find those margins excessive and wasteful these days. Plus, there are too many other parameters either predetermined or otherwise constrained.</p>
      <p>That said, I have on occasion made use of the 1.618 proportion. It's pleasing, and when it works, great. </p>
      <p>More important is the concept of Proportion in general (of which the Tschichold diagram is but one example). Deliberate and pleasing relationships between trim size, margins &amp; text block, type size &amp; leading, location of running heads &amp; folios, etc. These are all important and work together to create a whole.</p>
      <p>One important thing that you need to keep in mind is that a book is a three-dimensional thing. Gary mentions one aspect, which is that there is a very real consideration for the inside gutter depending upon binding method (and even different binderies). Whenever possible, take your sample pages, trim them up and stick them inside a dummy book. If you can't get a blank bound dummy with the same dimensions, page length, and stock as your final will be, then try to find a published book with specs as close as you can, and stick your pages in that.</p>
      <p>Something unique happens to a design when it curves into a binding and you perceive it in the context of a book's dimensional form in space with thickness and volume. I frequently mock up several pages and put them into a dummy in sequence, so I can get a proper perception of pacing. This is particularly useful with the front matter, since pacing is most evident in the beginning sequence.</p>
      <p>Hope this is useful.</p>
      <p>-- K.</p>
