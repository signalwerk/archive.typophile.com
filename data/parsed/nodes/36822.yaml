    <p>G'day peeps,</p>
    <p>I'm new to page design and layout and I'm looking for a few pointers on laying out the grid (especially for books). When I read advice on page layout, the golden section is frequently mentioned in reference to the size of the text block on the page; but I've just tried this and there seems like a lot of space around the text (as in too much, especially the bottom margin) and I'm concious that I don't come across many books which reflect this process; does anyone actually use the golden section for book design? Are people using a tweaked version based on similar principles?</p>
    <p>I feel like the GS would work well for art books and books with lots of marginal notes but it seems very excessive for a paperback or a cheap short-run A5 lecture series (just ... you know, like for example :) So what do you use? Also, do you have systems for deciding where to put the page numbers/running heads?<br>
    thanks for any trouble</p>
    <p>Nick</p>
