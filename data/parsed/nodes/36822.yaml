    html: |-
      <p>I was lucky enough to learn how to design books before the computer (and equally lucky to have the computer come along when it did!) and back in the day we actually drew up the grid and moved the elements around by hand before we settled on a look we liked. I learned to try to "see" the page before I started.</p>
      <p>For text-only books it's often driven in part by the cast-off. Once I choose my font and leading, then I do a cast-off (number of words in the document divided by page count) to determine how many words per page. Then I set up my margins in order to achieve that. Whether you give it more space on the top or on the sides is a matter of choice.</p>
      <p>Art/illustrated books present more of a challenge. Some books call for (or have room for) a more open design, some call for a flexible design where you can accommodate lots of different page-layout options. I'm working right now on a photography book where the pictures are very formal and have a strong horizon (landscape photos). I chose to lay out the text pages with a low sink so that the page has a "horizon" as well.  I want the text design to take a back seat to the pix so I'm keeping it really clean. </p>
      <p>Sometimes you want a varied, dynamic, asymmetrical page. I've done cookbooks and interior design books that have sidebars, notes, different types of text, large and small pix where I would do a two or three column design that can work these various elements in. </p>
      <p>But again, it helps to try to visualize the look of the book before you start or your head can start to spin with all the different options. I have never even considered the "golden section" in any of my book designs.</p>
    html_clean: |-
