      <p>&gt; Also, in a book with a reasonable page count, the pages “feather” on the outside, making it look as though the outside margins are wider.</p>
      <p>If they do, then a prepress person should be fired. On a sewn book, this is not a problem, as the folios are usually 16 or 32 pages and very little creep will happen. On a saddle stitched book of 120 or so pages, then this is a major issue, as the outside pages will have to wrap around the thickness of the spine, while the inside ones will not. But this is usually compensated for in prepress.</p>
