  - id: 225097
    user: 19337
    date: 2007-09-06T11:29:00
    date_raw: 6 Sep 2007 — 11:29am
    votes: null
    html: <p>When photos or maps span a spread in a perfect bound book, layout can be particularly tricky to avoid having part of the graphic hidden  in the gutter. What I do in cases like this is create left and right "halves" of the graphic, actually more than halves, because I make some overlap in the middle, sufficient that when the book is bound, the graphic seems visually complete. It's not a perfect adjustment, but if you get it right, it comes close to appearing a single uninterrupted image. As Kent mentions, nothing beats experimenting with a bound book (dummy or real), taking into account the location in the book (front, middle, end).</p>
