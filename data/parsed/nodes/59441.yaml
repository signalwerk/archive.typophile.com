  html: |-
    <p>From playing with some older typo shapes made beginning this year, I decided to try to make a my first calligraphic font. Honestly, I think about myself as a poor calligrapher with basic knowledge learned during studies, actually my last contact with calligraphy was in Calligraphy class, a couple of years ago.</p>
    <p>I made only a couple of letters (uppercase), and I was thinking if anyone could give me some constructive comments, am I on right direction, does this seems interesting to you etc...</p>
    <p>I made quicky version with "serif", take it as an attemption. :)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/WindWagon_5650.jpg"></div><p></p>
    <p>Thanks</p>
