  - id: 363821
    user: 1250
    date: 2009-08-25T07:20:00
    date_raw: 25 Aug 2009 — 7:20am
    votes: null
    html: |-
      <p>&gt; I would prefer to leave the letters untouched. The designer of the<br>
      &gt; typeface clearly spent his time making sure all the characters<br>
      &gt; belong to the same family.</p>
      <p>1) Everybody makes mistakes.<br>
      2) That person was making a font, not a logo! Big difference. Some people even believe that leaving a font alone when making a logo is a sin of sorts.<br>
      3) You already modified the "i". And SKEWING?! :-)  Plus you seem be open to modifying the vertical proportions, which affects a "font" (which like I said this no longer is anyway) massively.</p>
      <p>Now, if you prefer it like that, leave it alone, sure.</p>
      <p>&gt; As for the “p” I could agree but shouldn’t “h” be shortened accordingly?<br>
      &gt; If so, shouldn’t the dot of the “i” be lowered too?</p>
      <p>Well, I'm looking at how this thing is using the space, as well as letter confusability issues. Unless you remove the tittle (which I wouldn't advise) the ascender space is being used anyway and the "h" should take advantage, especially since its ascender keeps it from looking like an "n"; in contrast the "p" is sort of wasting the space below, and a short descender doesn't make it look like any other letter. BTW, even looking at this as a font I'd say the descender space is too much (because of letter frequencies in real text). In my book making the descenders exactly the same length as the ascenders (which looks like might be the case here) is a Modernist simpletonism.</p>
      <p>&gt; The name PrintHouse is written as one word</p>
      <p>Ah, but look at the useful capitalization (which you're not using). If they like it all-lc they might still be missing the fact that decipherability might suffer -if only slightly- when it's output in one color with no shading. But I'm really only talking about the absolute thinnest of wordspaces.</p>
      <p>hhp</p>
