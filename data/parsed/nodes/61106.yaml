      <p>Don't worry altaira! I just test it to see how it works out, and only if I agree with a suggestion :) I made more versions of the “s” and the above seemed to look OK. Skewing the glyph so that the spacing was good enough looked as if the “s” was becoming regular in between italic letters. I'll show other options too and hope for more comments :)</p>
      <p>Hrant, as for the “t” I don't know - I think it is consistent with other letters. Or did you refer to something else? I like this warm and brush-stroke-like character of the typeface and while I agree to correct kerning and other optical problems I would prefer to leave the letters untouched. The designer of the typeface clearly spent his time making sure all the characters belong to the same family.</p>
      <p>As for the “p” I could agree but shouldn't “h” be shortened accordingly? If so, shouldn't the dot of the “i” be lowered too?</p>
      <p>The name PrintHouse is written as one word in all company's communication, as opposed to other print houses out there.</p>
      <p>Thanks.</p>
