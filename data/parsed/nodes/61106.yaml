    <p>Hi,</p>
    <p>I'm putting finishing touches to a logotype and have a small question regarding two letters in it. I'd like to ask you to have a fresh look at it and let me know if my thinking is right :)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/phc_liga_before_6319.jpg"></div><p></p>
    <p>Because of tight kerning the serif of the 'i' is very close to the 'r' and I'm not fond of the look of it. So I connected the glyphs (in small sizes the gap disappears anyway), trying not to destroy the shapes of the font (Malaga):</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/phc_liga_after_4184.jpg"></div><p></p>
    <p>Do you think it works? Can you think of a better solution maybe?</p>
    <p>Thanks,<br>
    Aleksander</p>
