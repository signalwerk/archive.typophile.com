    html: |-
      <p>thanks for your detailed comments!<br>
      we feel really honored.</p>
      <p>as you both mentioned, a bolder version for the typeface would be great. timo and me we started with the lighter weights to avoid problems in the nooks of the alternate letters, but anyway we have to find an solution for bolder weights :-)</p>
      <p>to nick shinn's position about mixing the alternate letters right into the plain appearance: this would be great – i agree, currently not every user now how to add alternates or has the tome to give his text an nice mixture of plain and alternate letters.<br>
      We are not so familiar with programming <em>faux randomism</em> to simulate an always unique mixture of the three alphabets.</p>
