    html: |-
      <p>Great!<br>
      We need more experiments, and this is very focused, unique, and typographically quite profound.</p>
      <p>But I would have made one of the runic variants the default, not the plain sans, which is OK but not a particularly desirable typeface, given its lack of a lower case, and the number of well-established deco/geometric styles already available, many with greater weight range, as noted.</p>
      <p>I also wonder how much work typographers are prepared to do in playing around with inserting alternates manually.<br>
      Perhaps a few more stylistic sets that offered settings somewhere between the two extremes.</p>
      <p>OK, make that a "lightly spiced" style as the default, with plain retro and total weirdness as the alternates?<br>
      After all, that is the style you show on the specimen cover as representing the face.</p>
      <p>However, I could be wrong, and your strategy of making the plain font free may be effective!</p>
