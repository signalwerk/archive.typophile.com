    html: |-
      <p>well, if you have <em>bought</em> this font, you should have "tj evolette Light", "tj Evolette Hairline" etc. — variants like "TJEvoletteA-_ss1","TJEvoletteA-_ss2" and "TJEvoletteA-_ss2" are for our private process only (we use them at <a href="http://www.26plus-zeichen.de" title="www.26plus-zeichen.de">www.26plus-zeichen.de</a>, because there are not much opentype features working for sure in the web. in this version the font-files are containing just one stylistic set, so just 1/3 of all glyphs, and they are named all equal. this might cause the problem.<br>
      but as already mentioned these files are not for sale …</p>
      <p>if you have bought the normal TJ Evolette via Myfonts or YouWorkForThem, all alternative glyphs (ss0, ss1, und ss2) are included in one font file, like "light". so you do not have to install one weight tree times at once.</p>
      <p>for me all features are working in photoshop-cs5 - but not as "stylistic sets", cause these can be interpreted by InDesign only — did you took a look on <a href="http://26plus-zeichen.de/wp-content/uploads/TJ-EvoletteA_how-to-use.pdf" title="http://26plus-zeichen.de/wp-content/uploads/TJ-EvoletteA_how-to-use.pdf">http://26plus-zeichen.de/wp-content/uploads/TJ-EvoletteA_how-to-use.pdf</a> ? there it is explained how to the access to the different letters in the adobe creative suite.</p>
      <p>anyway you should send me your font files, so i can may solve the problem.</p>
      <p>best,<br>
         jakob</p>
