    <p><img src="http://www.id84.de/tj_evolette_a_specimen_400px.jpg" alt="TJ Evolette A - Specimen"></p>
    <p><a href="http://www.evolette.26plus-zeichen.de" title="www.evolette.26plus-zeichen.de">www.evolette.26plus-zeichen.de</a> </p>
    <p>An interpretation of Art Déco meets straight lined shapes of ancient runes – the experimental type design from Timo Titzmann and Jakob Runge is available right now. It goes hand in hand with a specimen fresh from the press.</p>
    <p>The geometric constructed all-case grotesque comes along with two additional integrated extravagant stylistic sets for the whole alphabet and some astonishing special characters as well. The plain linear-antiqua with classical proportions offers numerous combination possibilities between the ordinary alphabet of TJ Evolette A and the two alternate alphabets. This variety encourages unusual and extroverted creation in editorial and poster design.</p>
    <p>The font contains seven closely graded weights (form hairline to bold) to keep all options open while designing with the font. All common character sets of Central and Eastern European as well as Western Europe are supported. By Open Type features all 446 glyphs can be used optimally.</p>
    <p>One weight <a href="http://new.myfonts.com/fonts/26plus/tj-evolette-a/light/" title="http://new.myfonts.com/fonts/26plus/tj-evolette-a/light/">http://new.myfonts.com/fonts/26plus/tj-evolette-a/light/</a> TJ Evolette A is free for non-commercial usage or testing purposes. Moreover, the completely font family is available free of charge for student projects.</p>
    <p>The specimen, printed monochrome on a Traditional Colour offset press, contains a 59,4 × 84,1 cm poster, which can be fold to a DIN A 4 booklet.</p>
    <p>Font styles: Hairline, Thin, ExtraLight, Light, Book, Normal, Bold<br>
    Designer: Timo Titzmann &amp; Jakob Runge<br>
    Foundry: 26+ <a href="http://26plus-zeichen.de/en/" title="http://26plus-zeichen.de/en/">http://26plus-zeichen.de/en/</a><br>
    Release: 2011</p>
