      <p>Really lovely, Tiiimo. Very elegant proportions and some inspired alternate characters. Comment, if I may: it seems to me that as a family, it would benefit from one or two heavier weights. Something really substantial, to offset the lighter weights.</p>
      <p>(Love the specimen book, too ... )</p>
      <p>K.</p>
