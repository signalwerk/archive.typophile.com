  html: |-
    <p>It seems to me that Typophile is being hit by spammers lately posting blogs full of nonsense generated text and probably dodgy links. They usually give themselves away by their strange titles, so I could ignore them, but they really annoy me, and I hope you can do something about it! Thanks :)</p>
    <p>I guess I could have sent this to the admin as well, but I guess it's good to warn all beforehand.</p>
    <p>Jeffrey<br>
    <a class="freelinking external" href="http://www.infraordinaire.com/wordpress/">infraordinaire</a></p>
