      <p>So I got my hands on "Typographic Years". First: it's really<br>
      quite well set, in Monotype Baskerville - very sharp, sans any<br>
      letterpress fetish. Anyway. There's a chapter on Emerson, and<br>
      it's pretty interesting, but: not much on its origins, although<br>
      he does say he traced over enlargements of Jenson, Baskerville<br>
      and Bodoni, if only to familiarize himself more with classics;<br>
      and nothing on the hybrid numerals. But the book does reveal<br>
      that the punches, matrices, proofs etc. of the original version<br>
      of the design (Spiral) are at RIT's Carey... It also mentions<br>
      that Victor Hammer thought it was the best Roman in town.<br>
      Oh, and that he made virtually no money from it. But I think<br>
      it's a really nice design, worth reviving much more than<br>
      Garamond yet again (although with a new Italic).</p>
      <p>BTW, John, I got the Bennett book you mentioned as well.<br>
      Isn't the chapter set in Emerson so utterly convincing?</p>
      <p>hhp</p>
