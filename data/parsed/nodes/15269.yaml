      <p>Interesting Wikipedia article.</p>
      <p>The first use of Emerson - or perhaps Spiral - was in publishing a private-press edition of Ralph Waldo Emerson's essay Nature, in 1935, but that had been published before (in 1908, and perhaps earlier). Somehow, I think, the wording should be made explicit on this point, to avoid leading people to think that the font was first used for the initial publication of that work.</p>
      <p>Speaking of Wikipedia articles, there is a beautiful and detailed article entitled "Linotype Machine". But there was only a paragraph describing how Monotype machines work in one of the articles about the history of the Monotype corporation. I created an article, but it's far from complete, entitled "Monotype system", if this news might reach anyone interested in doing it properly!</p>
