      <p>Hrant</p>
      <p>Beatrice Warde (with additions by John Dreyfus in 1984) did an analysis of the various Monotype text typefaces in, I think, the Monotype Recorder (1960s?). I have a copy of Monotype Composition Faces that was put out by Harold Berliner's Typefoundry that, as far as I can understand it, replicates the Warde work. </p>
      <p>It gives a bit of information about the origins, history, and use of the various faces, showing text settings using a page from The Crystal Goblet as a template. Each page has a sidebar of microtypographic showings (likely the Dreyfus contribution). </p>
      <p>Emerson is included. To quote, "one of a number of 20th-century faces which have been designed especially to meet the demands of modern printing processes and paper surfaces." This was a concern promoted by Warde in her later writings. There were a number of her studies, published in fugitive sources, that have never been compiled.</p>
      <p>Gerald</p>
    html_clean: |-
