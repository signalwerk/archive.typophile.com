      <p>So thanks to Gerald I got a good specimen of Monotype Emerson.<br>
      Here's the charset at 10 point:</p>
      <p><a href="http://www.themicrofoundry.com/other/Emerson.gif">http://www.themicrofoundry.com/other/Emerson.gif</a></p>
      <p>Nothing as exhilarating as the "a", but the "AE" has a feature I think is as nice as it is rare: the middle stem <cite>slightly</cite> tilted leftward. And the "U", although not very uncommon, is rare enough to single out for praise. Negatives: a descending "J" but a non-descending -if decent- "Q"; although in the Italic the "Q" is exactly the sort I like. Another thing about the Italic is that Monotype's typical uniwidth (generally called "duplexed") approach has NOT been applied - which however makes me wonder why it still looks a bit brutish. The smallcaps are too small to me (although the main caps are too big).</p>
      <p>The numerals (as I mentioned above, but it's worth mentioning again) are hybrid (and I just noticed, monowidth too) which is pleasantly surprising to see as far back as the 1930s. I wonder if Blumenthal was in fact the first...</p>
      <p>hhp</p>
