      <p>Stronger serifs and terminals could indicate fresher type. Monotype would typically be cast fresh for each setting, but long runs might get more worn toward the end. Handset foundry type would be more likely to exhibit affects of wear and tear, depending upon the printer’s practices.</p>
      <p>I can’t explain the smaller shorter g of the Wells specimen. I don’t think Monotype was in the habit of making short/long-descender versions. That was more a Linotype practice, due to certain constraints.</p>
