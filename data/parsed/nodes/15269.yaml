    html: |-
      <p>I was at Wells last summer and got to take a monotype class from Mike Bixler. But I also picked up a copy of Victor Hammer and the Wells College Press which has this passage at the end of the book:</p>
      <p>Spiral Type, 14 point Roman, approximately 200 pounds. Donated to Victor Hammer by Joseph Blumenthal.*</p>
      <p>* This is most likely the only existing Spiral Foundry Type in existence as only 1000 pounds was cast. Blumenthal gave 200 pounds to Hammer and eventually melted down the remaining 800 pounds. That Wells has this much Spiral and the original Emerson type is a tribute to the devotion of Father Thomas J. Collar, a printer who live in Aurora, and friend of Victor Hammer. This type was pied in the many moves and nearly totally lost. Father Collar spend countless hours setting the pied type back on its feet and tying and wrapping it so that it could be easily relayed and used. Without his almost heroic effort, this type would certainly be lost forever.</p>
      <p>I suppose I should have used it in the specimen book I printed there. But presumably that's the foundry version then. I have a picture of the front of the California cases that say Spiral, but that's not so interesting.</p>
