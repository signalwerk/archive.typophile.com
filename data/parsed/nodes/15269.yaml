      <p>A Google search let me find the website and get their PDF specimen. It does seem like the x-height line isn't even, although I saw that with some examples of the "real" Emerson as well. Other than that flaw, which should be easily correctable if it is real, the digital version did not look terrible to me - and I'm glad one exists.</p>
