    html: |-
      <p>I've finally had the chance to look at a scan Dan Rhatigan sent through to me a while ago, from the MT archives. I don't feel I can post it here, but I've compared the original foundry version with the MT version.</p>
      <p>My observations of the changes:</p>
      <ul><li>Overall the MT face is lighter. Odd perhaps, wouldn't both versions have used the same kinds of ink in the presses?
      </li><li> Round letters (CDOQ especially) are considerably lighter.
      </li><li> HMNPS were made narrower. (To fit the 18-unit system?)
      </li><li> Terminals on CGS were trimmed down.
      </li><li> Lowercase extenders were brought in.
      </li><li> Arched counters on m and n were raised. Similar with the a. Crossbars of f and t thinned.
      </li><li> Zero was changed from round to narrow form (still oldstyle, both have same modulation). </li>
      </ul><p>I think the last is the only stylistic change, the other adaptations seem to have been made for practical reasons.</p>
      <p>I'm afraid my observations are sadly not quantified due to the low-ish resolution images I have, but I'm hoping to make some high resolution scans fairly soon, and see what else the MT archives hold.</p>
