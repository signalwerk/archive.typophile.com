      <p>Hi Neven,</p>
      <p>I really like your idea as well as the execution. I prefer the second version because it shows more of the dirty background texture and it has a better colour balance. Even so, I'm not sure about the horizontal blue stripe. It seems to me that it doesn't do any work in terms of symbolism and a second colour (the first being the author's name if we take the rest as different degrees of grayscale) is just too much.<br>
      Also, if you have access to a printer you should see how they look covering an actual book. At least, this usually helps me a lot.</p>
      <p>Keep up the good work,<br>
      á</p>
