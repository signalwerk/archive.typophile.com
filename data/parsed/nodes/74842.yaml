      <p>Thanks for your comment, akos! I also prefer the second one. :)</p>
      <p>I would leave the blue line, though, because it symbolizes the sea - here's a quote from wikipedia revealing some of the plot:<br>
      "Realizing that they will not survive another winter in their unspecified original location, the father leads the boy south, through a desolate American landscape along a vacant highway, towards the sea, sustained only by the vague hope of finding warmth and more "good people" like them"</p>
