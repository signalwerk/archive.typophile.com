    html: |-
      <div class="comment-spam-body"><p>Checked Tempo, an R. H. Middleton design from 1930-42 and found it very similar, but note that it has a splayed M and straight leg R. Stempel Sans/Neuzeit Grotesque by C. W. Pischner (1928) might be a match, including the leg on the _R_ in the version "Neuzeit Book -S." Other versions have a different leg on the _R_.<br>
      But this is three years after the publication date. Perhaps an earlier design by Pischner? More digging needed.<br>
      Don</p>
      </div>
