      <p>I looked at <a class="freelinking external" href="http://www.bauhaus-shop.de/media/images/popup/malerei_fotografie_film_q1.jpg" rel="nofollow">some</a> <a class="freelinking external" href="http://www.jaddesignsolutions.com/thesis/moholynagy.jpg" rel="nofollow">extremely</a> <a class="freelinking external" href="http://photobibliothek.ch/Photo012/Moholy04.jpg" rel="nofollow">low-res</a> <a class="freelinking external" href="http://www.geh.org/fm/amico99/m199006930001.jpg" rel="nofollow">pics</a> of the original german edition, and the typeface looks to be entirely different. </p>
      <p>With that in mind, I'm going to reaffirm the guess that this is Univers, with the publication date significantly later. No need to overthink it.</p>
