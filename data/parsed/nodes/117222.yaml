    <p>I'm doing a research about Lazlo Moholy- Nagy's, "Malerei Fotografie Film", the Bauhaus book n° 8, 1925. I can't find what fonts he uses. For the text there are a serif and a sans (maybe Futura?) and a sans for the titles(all in uppercase). There is anybody that can help me?<br>
    Thank you a lot!</p>
    <p><a href="http://3.bp.blogspot.com/_Fh2aCkgfh6Q/TEqoWtIAjQI/AAAAAAAAA70/-Dgr4EIFWd8/s1600/2.jpg" title="http://3.bp.blogspot.com/_Fh2aCkgfh6Q/TEqoWtIAjQI/AAAAAAAAA70/-Dgr4EIFWd8/s1600/2.jpg">http://3.bp.blogspot.com/_Fh2aCkgfh6Q/TEqoWtIAjQI/AAAAAAAAA70/-Dgr4EIFWd...</a></p>
