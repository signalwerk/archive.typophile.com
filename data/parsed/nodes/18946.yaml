      <p>I like the idea of thin, elegant and sophisticated.</p>
      <p>Perhaps "new", "forward thinking", or simply "open", as opposed to "old" and "closed" or "traditional." Maybe that's the key. Don't ask what it should be... ask what it shouldn't be.</p>
      <p>I like the idea too, of ultra thin Helvetica, or something along those lines. A cover? Lately I've been a huge fan of Bernhard Fashion - in an all caps setting though. Take something from Avant Garde ligatures too maybe? Voila.</p>
