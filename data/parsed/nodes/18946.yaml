    date: 2006-04-08T11:15:00
    votes: null
    html: |-
      <p>Maybe what is confusing some people is the title of the forum. No: I am NOT looking for a font that "looks gay" but for a typeface that can contribute to the spirit of the project, which is to emphasise DIVERSITY and "OTHERNESS" (That's for you fontplayer!). I appreciate the input, William Berkson, but fonts like "hairspray" for example, is not what I had in mind, I'm afraid. That would be a huge stereotype.<br>
      What I could do is to play with 2 different fonts, like using a classic one and then insert something completely different to subvert it a little, like insert something hand-made to give it a human touch...dunno...would that give the idea?</p>
