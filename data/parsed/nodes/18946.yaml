  html: |-
    <p>I am currently working on the design of a photography book on gay parades.<br>
    All photos are black and white and all photos are portraits of gay men (from the drag to the handsome boy and the big guy with piercing and moustache...).<br>
    The cover should be mainly black and white and I am currently experimenting with different typefaces.<br>
    It should not be to "sombre", too dramatic or to circensian, also not too grotesque...<br>
    I'm trying to find the perfect typeface, one that evokes celebration but it's sober at the same time...and one which reflects the context (gay, diversity, celebration...)but not in an obvious way...<br>
    Any suggestion? Please?<br>
    Thanks!!</p>
