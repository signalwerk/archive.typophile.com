      <p>Having done a bit of work with gay publications, I'll say that it matters not. What is more important is the relevence to the project. BUT... </p>
      <p>If you were to force me to answer (c'mon, make me!)... I'd say for gender ambiguity/shifting/borrowing, I've always liked Bodoni (or anything closely related) because of the contrast in line, the Masculine/Feminine, the sort of posed-ness of it. </p>
      <p>If you're addressing both lesbians and gays, I really like Rockwell because it is playful and hits both crowds well.<br>
      <a href="http://www.amazon.com/gp/product/1932360247/sr=8-1/qid=1144707093/ref=sr_1_1/104-6563224-0867125?%5Fencoding=UTF8" rel="nofollow">Kings and Queens</a></p>
      <p>It may work really well for a parade book, too.</p>
