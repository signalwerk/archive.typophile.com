      <p>I was working on some materials for a pride organization a while ago and ran into a similar dearth of options. While some faces might be historically appropriate (based on designer, philosophy, or geographics) they didn't communicate what was needed. The creative director eventually settled on something futuristic because it fit our mission statement of "looking forward," though it wasn't to my personal liking, so I won't recommend it here.</p>
