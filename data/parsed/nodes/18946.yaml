      <p>my two cents:</p>
      <p>I agree with dan_reynolds. I think that choosing a face that "looks" gay might be the worst thing you could do. I am a believer in connecting the text or content with the look of the type, but, I do believe that the gay community has far too many stereotypical labels as it is. You might accidentally irritate one that you were unaware of. In choosing a typeface that was designed by a gay designer, you could debut this somewhere cleverly, by citing the designer, and relating a little about his life as a "gay" typographer. I suppose that many people would not find this, or they would not care, but I think this subtler approach at connecting content with type is far better then choosing something that "looks" gay.</p>
