      <p>Maybe it's because I don't see the upper part, but I fail to see an inherent logic in the placement of the date (except perhaps that the column starts where the other ends). Because it seems a bit crowded, you could try to flush it with the right margin? In general, I think it lacks some breathing space as well as contrast. Both could be achieved with more generous spacing between the details and the body (if possible) or a different face.</p>
      <p>Use proper quotes in the text. Use a dash for ranges, not a hyphen.<br>
      What's with the slanted exclamation marks?</p>
      <p>I agree with the comment regarding the drop capital and the first linebreak.</p>
    html_clean: |-
