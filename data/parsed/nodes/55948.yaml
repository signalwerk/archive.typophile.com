    html: |-
      <p>I'd lose all of the superscript: 53rd, 1st and 7.00–8.30 PM (with PM in small caps after a space and an en dash instead of a hyphen).</p>
      <p>53 doesn't need to be in italic. Instead I would put the title What Matters Most in italic and lose the double quotes.</p>
      <p>Are these proper small caps or fake ones? I can't tell with the resolution of the image. If they're fake I would use a mixture of upper- and lower-case or all-caps in the title instead.</p>
      <p>Former Presidents doesn't need initial caps. "Late" is also probably superfluous.</p>
      <p>Why NYTimes? Do you mean The New York Times or are you only referring to the New York Times website. This could be more specific.</p>
      <p>Modern-day renaissance man can lose the small-caps and the exclamation marks. I would lose the renaissance man completely anyway: it suggests that he has a wide range of talents in diverse fields whereas this person seems to be very successful in one field.</p>
      <p>Good luck.</p>
      <p>Ed</p>
