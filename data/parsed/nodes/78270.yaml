    html: "<p>Usually end-grain wood engraving. Wood engraving was most popular for several reasons- one reason being that the wood engraving could be set with the type. (Which would then be used to make the plates for mass printing.) Metal engravings are printed on a completely different kind of press- meaning: on separate pages, often on a different kind of paper.</p>"
