      <p>Incidentally, I did a search for this book, and found that while this particular book is not on Google Books or the Internet Archive, several other books by this author are. Instead of being a teacher, he was a mathematician; he had written several books about the history of mathematics, as well as other textbooks for more advanced grades.</p>
      <p>In fact, he was the compiler of one book that was still being reprinted into the 1960s: <em>A Source Book of Mathematics</em>.</p>
