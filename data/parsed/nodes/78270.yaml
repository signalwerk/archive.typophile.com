    html: |-
      <p>I believe that nut fractions were the default for the modern style at the time, if not for all styles.<br>
      At any rate, I made nut fractions the default in Scotch Modern, which is my version of the face shown here.<br>
      However, I only did the basic fractions—half, thirds, quarters, eighths—in pre-composed form (with arbitrary fractions in slash form), as I couldn't get anything more complex to work across the board in layout apps.<br>
      If this typographic layout were to be attempted today, it would be best done in an app which handles complex maths, probably in the Computer Modern typeface.</p>
