    <p>Some scans from a book I picked up recently (for 25¢). Printed in 1904.  </p>
    <p>Interesting just to see how the type is set; complex fractions (all are all nut—no virgules to be found), the @ symbol for per-item cost, page structure, impressive engravings for illustrations, and the thoughtful mix of typefaces. Quite a complex project for metal type. All for the kids.</p>
