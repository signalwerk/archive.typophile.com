      <p>The Current title reminds me of a famous poster of dutch designer Wim Crouwel, back from 1966. Can't find a good online picture, but in the upper right corner of <a href="http://webpages.marshall.edu/~bruggemann1/national_visions_within_a_global2.htm" rel="nofollow">this page</a> you see a small version.</p>
