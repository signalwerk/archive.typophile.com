    html: <p>The typography seems more oriented towards looking cool than being readable in some cases (on the front page particularly) but it's consistent and clean. The site seems organized and thought-out, and the Helvetica is fine for me stylistically. Not particularly unique, but I see the aesthetic they're going for.</p>
