    html: <p>I use Mark Simonson's tab method, but adjust the weight of the underscore by changing the font used -- after setting the tab, the underscores can be selected and the font changed like any other text character. In your example, you could use Futura Light, for instance.</p>
    html_clean: <p>I use Mark Simonson's tab method, but adjust the weight of the underscore by changing the font used -- after setting the tab, the underscores can be selected and the font changed like any other text character. In your example, you could use Futura Light, for instance.</p>
