    html: |-
      <p>Mark's is an elegant solution. If you want more control over the weight and style of the rule, scrap the Leader and style your tabbed text with an Underline which can be fine-tuned via the "Underline Options" in the Character Palette's popup menu.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/underline-options_5213.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/InDesignScreenSnapz002_4583.jpg"></div><p></p>
    html_clean: |-
