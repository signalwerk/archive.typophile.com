    html: |-
      <p>You can also paste rules into the text and adjust the length and weight and the baseline it sits on, you can also use word space to separate the rule from the text. </p>
      <p>btw in your sample there are some spacing issues between colon and rule and text and colon, from a personal aesthetic I would remove the colons and use a word space to separate.</p>
      <p>Does the underscore method survive ripping etc? I would have guessed that a slight gap could appear in some fonts if they weren't drawn precisely</p>
      <p>Tim</p>
