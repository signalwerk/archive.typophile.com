    html: |-
      <p>I'd suggest that you reconsider using "extremist" and the grenade. Though memorable they have a lot of negative connotations.</p>
      <p>To a lesser degree, "freelance" can also have some negatives, for two reasons -- 1) It's vague. Are you a freelance screenwriter? Journalist? Programmer?  2) "Freelance" can conjure up an image of someone working out of their bedroom, which might not matter if you're just working for other designers, but if you want to develop your own clients in the business world I think it's better just to call yourself a designer.</p>
    html_clean: |-
