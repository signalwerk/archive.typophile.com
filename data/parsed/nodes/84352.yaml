    <p>I wish I had discovered this forum before I "completed" my work.  The Freelance Extremist logo is not only the identity of the designer but also the first design for the portfolio.  I have been interested in graphic design for a long time and I have finally decided to start doing freelance work since no one will ever hire me w/o a portfolio.  In this logo I wanted to convey my dedication to the profession by using elements of extremism.  </p>
    <p>I would love to get some criticism on my first piece of work, thank you.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/FINAL-01_5165.png"></div><p></p>
