    html: |-
      <p>"Your logo should deliver a message. Always keep that in mind"</p>
      <p>BUT...don't read that as a literal rule. A logo can be literal, but more often than not, it makes sense for it to not be a literal representation but more of an emblem. It simply represents your company...not necessarily defines it. The logo represents the brand more so than it creates it.</p>
      <p>I agree with many in here. I think it's time to do some more brainstorming...start back at the name. Come up with some more ideas. See where that takes you.</p>
