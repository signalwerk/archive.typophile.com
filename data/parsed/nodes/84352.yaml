    html: |-
      <p>Want to learn from some of my heroes?</p>
      <p><a href="http://www.behance.net/LeGarconBleu" title="http://www.behance.net/LeGarconBleu">http://www.behance.net/LeGarconBleu</a></p>
      <p><a href="http://www.behance.net/Bitencourt" title="http://www.behance.net/Bitencourt">http://www.behance.net/Bitencourt</a></p>
      <p><a href="http://www.behance.net/rogeroddone" title="http://www.behance.net/rogeroddone">http://www.behance.net/rogeroddone</a></p>
      <p><a href="http://www.behance.net/maximalist" title="http://www.behance.net/maximalist">http://www.behance.net/maximalist</a></p>
      <p><a href="http://www.behance.net/robinssoncravents" title="http://www.behance.net/robinssoncravents">http://www.behance.net/robinssoncravents</a></p>
      <p>What did I learn from them?</p>
      <p>• Think before you sketch and sketch before you ever touch your mouse.<br>
      • People subconsciously like symmetry and math. So reason your design. Use grids but, but don't overdo it.<br>
      • Your logo should deliver a message. Always keep that in mind!<br>
      • Practice, practice, practice.</p>
      <p>Hope this helps.</p>
      <p>Good Luck!</p>
