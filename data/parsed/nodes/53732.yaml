    html: <p>Allyson, you might enjoy the work of the Czech typographer Oldřich Hlavsa, if you can find it. His book <em>Typographia</em>, my edition 1976, was like a revelation to me. He was, to my mind, the best in combining type with illustrations. Good luck.</p>
