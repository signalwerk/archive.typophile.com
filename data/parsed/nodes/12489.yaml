      <p>Dan I think a number of us still have Letraset catalogues that date from that time… but mine’s currently buried in a packing crate! Last time I saw a Letraset catalogue for sale it was $2 - invaluable!<br>
      To hazard a guess I think these characters might come from the old Helvetica Condensed Black (not the NeueHelvetica) or possibly one of the Condensed Grotesques (Monotype? Stephenson Blake?) that Letraset had licensed. Looks like there’s a slight fattening in the strokes.</p>
