    html: |-
      <p>The trouble with old Letraset is that it dries out and is very difficult to apply you might be better served by scanning  a rubbed down letter (as greyscale, so final size is about 1200 dpi) and manipulating them in Photoshop to get the size and position. I expect most Letraset catalogues got thrown out in the 80s with the rubylith and snopaque, so finding one could be tricky.<br>
      Tim</p>
