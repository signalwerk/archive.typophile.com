    <p>Hello everyone!</p>
    <p>My name is Dan, and I am trying to ID some fonts and symbols from a movie prop. I have reliabe information that the prop maker used Letraset fonts and symbols. I’ve attached an image of the symbol. It appears to be a “D” and a “V” with the “D” rotated 90 degrees clockwise with a colon off to the right. </p>
    <p>I thought the letters might be Impact or Haettenschweiler, but they are not quite right.<br>
    I appreciate any help!</p>
    <p>FYI- The time period would have been between 1978-1980. I also have a couple other symbols I’d like to identify, Letraset again, but I don’t know what kind of reception my intial inquiry will get. If there are any vintage Letraset typophiles out there, I could use your help! </p>
    <p>Thanks again!</p>
    <p>-Dan</p>
