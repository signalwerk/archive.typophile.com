      <blockquote><p>Where does everyone get their display typefaces?</p></blockquote>
      <p>Usually from freefonts sites.</p>
      <p>That said, Veer used to have a curated collection (used in the sense that they stopped adding new fonts to it).<br>
      You Work for Them has some of varying interestingness.<br>
      You could want to check independent font sites for news about last releases. Some examples:<br>
      <a href="http://typographica.org/" title="http://typographica.org/">http://typographica.org/</a><br>
      <a href="http://ilovetypography.com/" title="http://ilovetypography.com/">http://ilovetypography.com/</a><br>
