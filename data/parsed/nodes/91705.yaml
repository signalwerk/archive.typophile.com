      <p>I almost always start with <a class="freelinking external" href="http://www.myfonts.com" rel="nofollow">MyFonts</a> and then also try to search out designers and foundries directly. Of course, many of them do sell through MyFonts, so I frequently end up back there. <a class="freelinking external" href="http://http://typographica.org/" rel="nofollow">Typographica</a> is a good way to keep up with new font releases and locate some designers/foundries.</p>
      <p>Tim</p>
