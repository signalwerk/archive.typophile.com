    html: |-
      <p>“Smaller” foundries licence their fonts either directly or through a reseller, or both.<br>
      The big resellers are MyFonts, Fonts.com, Veer, and FontShop.<br>
      So you can find plenty of uniqueness there.<br>
      Likewise with T-26 and Village, which could be considered smaller resellers.<br>
      The “small” foundries that only sell their own work direct from their site are quite few, e.g. H&amp;FJ and Terminal.</p>
      <p>To learn more, consult these books:<br>
      <a href="http://shop.gestalten.com/type-navigator.html" title="http://shop.gestalten.com/type-navigator.html">http://shop.gestalten.com/type-navigator.html</a><br>
      <a href="http://www.p22.com/indiefonts/indie3.html" title="http://www.p22.com/indiefonts/indie3.html">http://www.p22.com/indiefonts/indie3.html</a><br>
      (Also vols. 1 &amp; 2)</p>
      <p>Type Navigator explains very well how the industry works.</p>
