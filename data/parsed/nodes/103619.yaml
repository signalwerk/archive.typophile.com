      <p>Filthy: <a class="freelinking external" href="http://typophile.com/node/76822" rel="nofollow">bespoke typeface designed by filthymedia</a>, very influenced by Times and Caslon (no. 224) Black Italic. Alternatives: <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/dutch-801/extra-bold-italic" rel="nofollow">Dutch 801</a> (Bitstream version of Times), <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/nimbus-roman/d-extra-bold-italic" rel="nofollow">Nimbus Roman</a> (URW verison), <a class="freelinking external" href="http://www.myfonts.com/fonts/softmaker/thames-serial/heavy-italic" rel="nofollow">Thames</a> (Softmaker version), <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/caslon-no-224" rel="nofollow">Caslon no. 224 Black Italic</a>, <a class="freelinking external" href="http://marketplace.veer.com/font/Cabernet-Complete-JBT0001003" rel="nofollow">Cabernet</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/ef-typeshop/riccione" rel="nofollow">Riccione Xbold Italic</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/basilia" rel="nofollow">Basilia Black Italic</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/type-together/abril" rel="nofollow">Abril Fatface Italic</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/dstype/velino-text" rel="nofollow">Velino Text Black Italic</a><br>
      CHIRON: most probably one among <a class="freelinking external" href="http://www.myfonts.com/search/engravers+gothic" rel="nofollow">Engravers Gothic</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/mti/sackers-gothic" rel="nofollow">Sackers Gothic</a>/<a class="freelinking external" href="http://www.myfonts.com/search/blair" rel="nofollow">Blair</a></p>
