      <p>Adam, thanks for the link to that thread, it explained a lot!</p>
      <p>André, after a lot of experimenting I can conclude that you were right. For some reason, FontLab decided to discard the Unicode index from my renamed glyph each time I exported an OpenType font, and instead insert the "space" glyph (of all things) in that position. (Probably some other problems arose behind the curtain, since the OpenType features stopped working at the same time.) I solved the problem by right-clicking on the glyph and selecting "More&gt;Remove Unicode", then reapplying the Unicode index to the glyph that was meant to have it.</p>
      <p>Thanks to you both for all support and suggestions.</p>
      <p>Måns</p>
