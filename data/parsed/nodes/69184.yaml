    <p>Hi all,</p>
    <p>I tried asking this question over at the FontLab forum, but there doesn’t seem to be very much activity there, so I’m trying here as well. Apologies in advance if this question has been asked before – at any rate I have not been able to find an answer in the archives.</p>
    <p>I am developing a font which includes a large number of glyphs in the Private Use Area. For these I would like to use my own names, primarily because many of them have alternate forms accessible through aalt, stylistic sets etc. Coding would get much easier if I could use semantic names rather than “uniExxx”, especially in case I want to change the Unicode index of a glyph (each time I do that, I have to track down every reference to that glyph in the code and change the name).</p>
    <p>Problem is, when I use my custom names the OpenType features stop working, and InDesign gives the glyph names as &lt;null&gt;.</p>
    <p>Is there any way to get custom names to work? If this has been answered before, kindly point me in the right direction. I read somewhere a comment to the effect that “sometimes it works, sometimes it doesn’t, but I don’t know why”.</p>
    <p>Oh, and I know custom characters should not always be in the PUA. Suffice to say, I want them there in this particular font.</p>
    <p>Yours,</p>
    <p>Måns</p>
