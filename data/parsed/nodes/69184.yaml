      <p><cite> Coding would get much easier if I could use semantic names rather than “uniExxx”, especially in case I want to change the Unicode index of a glyph (each time I do that, I have to track down every reference to that glyph in the code and change the name). </cite></p>
      <p>When you change the name of any glyph in fontlab you're given the option of changing the name in all code and classes as well (there's two checkboxes in the glyph names dialogue that you'll need to check).</p>
      <p>Your choice of names should have no bearing on how your opentype features work (compiled features refer to GIDs alone, not unicode values or glyph names) so I suspect whatever is causing your features to not work properly is a separate matter.</p>
      <p>I'd use whatever names you want while developing the font and then change them to follow the proper naming format once the font is completed.</p>
      <p>André</p>
