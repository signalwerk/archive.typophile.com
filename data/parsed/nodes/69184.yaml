      <p>Ps. You MAY add PUA codepoints into your non-Unicode glyphs, i.e. you could do: </p>
      <p>0xE005 !B.alt1<br>
      0xE006 !B.alt2<br>
      0xE007 !B.alt3<br>
      0xE008 !B.medi1<br>
      0xE009 !B.medi2<br>
      0xE00A !B.ss01<br>
      0xE00B !B.ss02<br>
      0x0042 B </p>
      <p>Or something like that (the PUA codes you assign are arbitrary, I've just chosen some -- but you're really free to occupy the space between 0xE000—0xF8FF). If that's what you really want. Of course, you'll still need to write OpenType Layout features, but you'll get an additional access method to those glyphs, through "cmap", using PUA codepoints. This access method is not recommended, but if you want those glyphs to be accessible in application that do not support user-controlled OpenType Layout features, this may be a sensible scenario for you. </p>
      <p>Best,<br>
      Adam</p>
