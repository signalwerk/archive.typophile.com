    html: |-
      <p>Mans, </p>
      <p>"uniE000" or "uniE000.ANYTHING" will map back to U+E000.<br>
      "anything" or "anything.ANYTHING" will map back to an unknown glyph. </p>
      <p>So if you employ your own encoding scheme (say, for a private language), you typeset some text in a text editor, produce a PDF, copy the text from PDF and paste it again into the text editor, you will get the same text (without alternates or formatting, but at least the text) if you use the glyphnames "uniE000" or "uniE000.ANYTHING", but you MAY get a string of undefined characters if you use the glyphnames "anything" or "anything.ANYTHING". </p>
      <p>The reason why I wrote "MAY" rather than "will" is explained in detail in this thread:<br>
      <a href="http://typophile.com/node/29469#comment-404691" title="http://typophile.com/node/29469#comment-404691">http://typophile.com/node/29469#comment-404691</a><br>
      (PDF-compatible glyphnames is the magic term). </p>
      <p>Adam</p>
