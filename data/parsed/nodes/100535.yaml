    html: |-
      <p>There are dozens of existing fonts with varying degrees of brushiness.  They include<br>
      Aerobrush (Scriptorium)<br>
      Azuki (Jess Latham, BV Fonts)<br>
      CC Monster Mash (Comicraft)<br>
      CK Paintbrush<br>
      Flood Std (Adobe)<br>
      Mukokuseki Kitchen (Futaba)<br>
      Olivia Brush (Alan Walden)<br>
      Wet Paint (Johnathen Smith)<br>
      My own favorite is Freestyle, unfortunately created for the exclusive use of NCL.<br>
      You can find even more by using Google or Bing Images and looking for Brush Fonts.</p>
      <p> - Herb</p>
