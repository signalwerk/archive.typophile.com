  html: <p>Hi everyone. I'm looking to make a hand drawn, brush font that retains the textures and qualities of a thin ink, like a watercolour stroke. Specifically, I like the way the colour tint shifts and changes. Does anyone have any recommendations for the best way to approach this type of font?</p>
