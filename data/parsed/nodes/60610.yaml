  html: <p>Greater Albion Typefounders have just announced a surprise new release on their <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>.  The surprise reldease is Cullion, which we're calling a modern unicase blackletter.  If you want to see what one of those looks like you can try it out on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/cullion/ " rel="nofollow"> Myfonts.com</a> or see it in action on our <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>.</p>
