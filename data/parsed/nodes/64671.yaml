  html: |-
    <p>Limited edition wall calendar featuring twelve original illustrations by Post Typography. Each month presents a different interpretation of the number "2010" through a wide variety of inventive, meditative, and eye-popping lettering treatments and illustrations. More fun than those other boring type calendars out there, and even non type/lettering nerds can appreciate it.</p>
    <p>We've got fewer than 100 copies of this left... once they're gone that's it.</p>
    <p><a href="http://www.posttypography.com/site/index.php?action=capital&amp;id=795" target="_blank" rel="nofollow">http://www.posttypography.com/site/index.php?action=capital&amp;id=795</a></p>
    <p><a href="http://www.posttypography.com/site/index.php?action=capital&amp;id=795" target="_blank" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.posttypography.com/site/index.php?action=capital&amp;id=795" target="_blank" rel="nofollow"><img src="http://typophile.com/files/PostTypography_2010_calendar_big_4712.jpg"></a></div><p></p>
    <p>PS- Yes, we know the illustrations are not technically "typographic", but it's just easier to describe that way. Cool?</p>
