      <p>Mid-1980s means the magazine was probably phototypeset and the font would almost certainly have been provided by the manufacturer of the equipment. I’m only familiar with some of the Compugraphic machines from that time. I don’t know if they had their own version of Baskerville, but I wouldn’t doubt it. Compugraphic was swallowed by Agfa, which was then taken over by Monotype, if I recall my consolidations correctly.</p>
      <p>Skyfonts.com has four different Baskervilles you can try out for free if you join the beta programme. (Have your specimen sheet template ready beforehand; they’re only free for five minutes at a time.)</p>
      <p>David</p>
