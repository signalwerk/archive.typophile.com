    <p>I'm choosing a typeface for a magazine, and I've decided that Baskerville is the one for me. The magazine is meant to have a sober, timeless feeling to it, without being intimidating or stuffy, and I feel that Baskerville hits all the right notes in that regard.<br>
    Now the problem becomes, which one? I'm choosing between several versions, including Linotype, URW++, Monotype, ITC, and Storm's Baskerville Original Pro. </p>
    <p>We're printing on both uncoated and coated stock, usually at 9pt size. I've found that the first version I bought, from URW, tends to look too thick, and doesn't quite have the level of readability and lightness that I want. Of course, I could buy them all and experiment, but we're a small independent magazine, and the budget's not there for that.</p>
    <p>I'd love to hear if anyone has an opinion about their favorite version of Baskerville, and why. Thank you!</p>
