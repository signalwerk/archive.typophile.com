    html: "<p>Jayson, maybe I'm late to the party, but: Monotype's and Storm's are at the opposite sides in terms of darkness and readability, the former being the lighter and the latter being the heavier. I'm not sure that Monotype's digital version would be the best choice for a magazine setting. Fountain's revival is an elegant rendition but maybe a bit too stiff for my taste; it also lacks the lining figures in the italics and doesn't have a bold (which could be limiting in a magazine). Storm's version looks like a more faithful rendition (compared to others), but I see its design more appropriate for books with a classical feel rather than contemporary magazines. For what is worth, I think that ITC New Baskerville, in its apparent averageness, is still the best Baskerville option for a magazine text setting. The sample you posted - fake italics apart - seems set in ITC's to me.</p>"
    html_clean: "<p>Jayson, maybe I'm late to the party, but: Monotype's and Storm's are at the opposite sides in terms of darkness and readability, the former being the lighter and the latter being the heavier. I'm not sure that Monotype's digital version would be the best choice for a magazine setting. Fountain's revival is an elegant rendition but maybe a bit too stiff for my taste; it also lacks the lining figures in the italics and doesn't have a bold (which could be limiting in a magazine). Storm's version looks like a more faithful rendition (compared to others), but I see its design more appropriate for books with a classical feel rather than contemporary magazines. For what is worth, I think that ITC New Baskerville, in its apparent averageness, is still the best Baskerville option for a magazine text setting. The sample you posted - fake italics apart - seems set in ITC's to me.</p>"
