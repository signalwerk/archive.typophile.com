      <p>I’m pretty sure it’s something by <a href="http://moorstation.org/typoasis/designers/shyfonts/shy01.htm">ShyFonts</a>. <em>Intellivised</em> is pretty close.  Too bad you can’t see previews of the different fonts on that page.</p>
