    html: <p>Not with the intent to undercut Fontshop or E&amp;F, but both of their websites credit Brendel Typestudio with the design of this typeface. I thought I’d mention, then, that it can be had from the current Web face of Brendel Informatik, <a href="http://www.qbf.de/tceng.htm" target="_blank">The Quick Brown Fox</a>, for nearly $10 less. It goes by the name there of, simply, Digital. No promise of equal quality, though.</p>
