    <p>ok, so designing while half asleep isn't the greatest! But I need to show the client something in the morning. I know there's spacing things and kerning I need to fix up. But I'm just wanting some feed back on the general concept to start with, then we can get into the kerning :)</p>
    <p>The Brief:</p>
    <p>Client is building a site to show video of different atheletes to industry type folks. I'm not completely sure on all the details. Basically they are thinking they need an identity mark something like the nike, adidas, puma style logo. The client is a fan of <a href="http://www.31three.com" rel="nofollow">this designer </a> as am I. The main thing about this of course is establishing their own identity. It's probably too big of a job for me to figure out in a couple nights, but here's start and I'm hoping that someone can help me as to which direction to go and possible enhancements I can make before handing in the first draft. </p>
    <p>Thanks for the help and understanding!</p>
