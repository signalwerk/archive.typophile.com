    html: |-
      <p>I think you can reject the bottom three logos immediately. There are many questions that need to be answered, first is what does the client do, why do industry types (what industry?) want to see video of athletes, does he/she make videos or perhaps offer athletes for sponsorship or draw more people to athletics? I know you say you are unsure of the details but you need to find out some details, you seem to be implying you need an athletic-type logo but why would that appeal to industry types? Without answers you are left with type responses and geometric shapes, that being so I think the top left and middle left offer potential.<br>
      Hope this is not too discouraging, but for your sake and your client's try and get some details.<br>
      Tim</p>
