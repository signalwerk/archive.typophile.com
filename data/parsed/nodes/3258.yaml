    html: "<p>Interestingly, I can get a real Verdana thorn using the OS X Character Palette (always available in the menu bar). Here's what it looks like in TextEdit: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/2722.gif\" alt=\"1\"> <br> <br>Unfortunately, couldn't get it to work with the text entry field in Explorer. I don't know for sure, but I think full language support only works in Cocoa apps. System level functions &lt;i&gt;do&lt;/i&gt; have support, so even in Explorer, you can insert foreign characters (Cyrillic, Chinese, Greek, whatever) into a file name field when saving a file.</p>"
