    html: <p> MacOS Roman character encoding doesn't support Icelandic. Windows 1252 does. There is a separate encoding, MacOS Icelandic, for Icelandic on Macs. Newer Unicode TT and OT fonts should work, though you might have to install keyboard drivers to get to the characters on older MacOS versions. <br> <br>Now could someone else please explain to me why MacRoman and 1252 include Lslash, lslash, Scaron, scaron, Zcaron and Zcaron? What language uses those without using other accented characters not present in MacRoman or 1252 encoding? I've never gotten an answer on this. Totally stumped. </p>
    html_clean: <p> MacOS Roman character encoding doesn't support Icelandic. Windows 1252 does. There is a separate encoding, MacOS Icelandic, for Icelandic on Macs. Newer Unicode TT and OT fonts should work, though you might have to install keyboard drivers to get to the characters on older MacOS versions. <br> <br>Now could someone else please explain to me why MacRoman and 1252 include Lslash, lslash, Scaron, scaron, Zcaron and Zcaron? What language uses those without using other accented characters not present in MacRoman or 1252 encoding? I've never gotten an answer on this. Totally stumped. </p>
  - id: 25401
    user: 1043
    date: 2002-09-14T06:54:00
    date_raw: 14 Sep 2002 — 6:54am
    votes: null
    html: <p> These characters are normally inaccessible in Mac programs (although OS X can access them). I think the reason they're in MacRoman is a Fontographer thing. When you select MacRoman as the character set, Fontographer designates many of the first 16 character slots to characters that are part of the Windows 1252 character set. I've always assumed this was to make it easier to do font development for Mac and Windows at the same time. <br> <br>As to why they were included in 1252, I have no idea. </p>
