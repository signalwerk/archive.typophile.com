      <p>Thanks for being candid. You could've done it there too. :-)  Seriously, there's nothing better for cultural progress than public challenge.</p>
      <p>I admit that comparing the shape of the dot to no dot at all isn't entirely fair. But the shape does matter:</p>
      <blockquote><p>too subtle to be significant</p></blockquote>
      <p>This is frankly surprising to hear from a text face designer. Maybe I've misunderstood this aspect of your approach to type design all these years.</p>
