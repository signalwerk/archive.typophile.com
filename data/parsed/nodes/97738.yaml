      <p>I meant to subtle to be significant in itself to readers. Within the design, it is significant in formal terms, but as a single detail it is too insignificant to carry the weight of cultural implications that you want to load on it. I think there is often an odd disconnect between the grandness of your ideas and a kind of timidity in their application.</p>
      <p>As for naff, I was referring to your Carter Sans illustration. At that size, the dots are far from subtle.</p>
      <p>I too saw the large amount of Ottoman building lettering in in Arabic script in Istanbul (and also purchased a book on the subject that I have given to Tom Milo), but other than representing an official policy to preserve historical record I didn't see any indication that the script is important for modern Turks <em>who cannot read it.</em> I wouldn't even call the influence of these artefacts 'decorative'; I don't think there is an influence. I saw huge amounts of modern Turkish signage, and no trace of any connection to the older Ottoman cartouches.</p>
