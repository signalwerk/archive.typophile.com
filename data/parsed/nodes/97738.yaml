      <blockquote><p>for which there is no nostalgia.</p></blockquote>
      <p>I hate nostalgia. It's not my intent to leverage such a base emotion.* My angle is cultural preservation, especially in the context of possible admission into the European Union. And anybody who thinks Arabic has no relevance to Turkish culture is simply fooling himself. Walking around Istanbul completely confirmed this for me. I sent Alessandro some photos showing how engrained Arabic remains to Turks (for publication in his "mini interview" thing) but I won't show them here lest I steal his thunder. Calling the influence "decorative" is a convenient superficial escape.</p>
      <p>* Although I do think that Turks who lean more towards Islam are more likely to yearn for the "good old days". And remember that -at least among some Muslims- the Qur'aan is only "official" in Arabic.</p>
