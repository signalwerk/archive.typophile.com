    html: |-
      <p>@John Hudson:<br><cite>I didn't see any indication that the script is important for modern Turks who cannot read it.</cite></p>
      <p>Well, the Tagala abugida is of interest to some Filipinos who can't read it.</p>
      <p>Also, the overwhelming majority of Turks are Sunni Muslims, and I think this means that the Quran is only 'official' in Arabic for <em>them</em> - thus, while Turkey has mass literacy in the Latin script for the Turkish language, I would expect Arabic literacy to still be widespread in that country.</p>
      <p>Even Muslim clergy of liberal political inclinations would need to engage in Quranic scholarship - in order to defend their positions.</p>
      <p>@hrant:<br>
      I know this <em>should</em> go in an E-mail or something...</p>
      <p>I see you've designed an Armenian-language keyboard layout, based on traditional typewriter layouts. I happen to have <a href="http://www.quadibloc.com/comp/kybint.htm" title="Click to visit an external URL." class="freelink freelink-external freelink-external">some familiarity</a> with what has been done with typewriter layouts in the past, and thus I have the temerity to make some suggestions for improvement:</p>
      <p>1) As you must resort to a third shift for the digits, due to the number of letters in Armenian, there is no good reason to keep them on the top row. As some Katakana layouts <a href="http://www.quadibloc.com/comp/images/kbkana.gif" title="Click to visit an external URL." class="freelink freelink-external freelink-external">have done (image link)</a>, you should place them on the home row (ASDFGHJKL;).</p>
      <p>2) Also, as this gives the AltGr third shift a very high degree of prominence in the Armenian keyboard, as opposed to keyboards like Canadian French or Brazilian Portuguese, where it is simply used for less-common accented letters or additional special characters and punctuation, you should offer the option of a reassignment of certain additional keys on the keyboard:</p>
      <p>Left and right Ctrl keys -&gt; AltGr<br>
      Caps Lock key -&gt; Ctrl<br>
      Right Alt key -&gt; Caps Lock</p>
      <p>For those who prefer to keep Caps Lock where it is, just moving the Ctrl key to the right Alt key could be another option.</p>
      <p>EDIT: I <em>have</em> sent an E-mail now about this to the appropriate party, Michael Everson.</p>
