    html: |-
      <p>I never like curtailing speculation, but it's probably high time already:<br>
      It sort of has to do with chirography, in that this is about Arabic, and Arabic is conservative that way. But chirography per se is actually circumstantial here. Basically this query stems from an idea I got from Onur Yazıcıgil's presentation at the New Orleans TypeCon*, an idea that I elaborated in my ISType talk** in June: in order to express the glorious Arabic past of Turkish writing (something admittedly not all Turks are crazy about, but I think it's a key way of defending Turkish culture in a Western world) a nice subtle trick would be to make the tittles diamond-shaped. This would also extend to giving any Latin setting a gentle Arabic vibe.</p>
      <p>* <a href="http://onuredy.wordpress.com/2011/05/20/hello-world/">http://onuredy.wordpress.com/2011/05/20/hello-world/</a></p>
      <p>** <a href="http://www.istype.com/?p=776">http://www.istype.com/?p=776</a></p>
      <p>During my talk I showed the following image that proposes a quick mod to Carter Sans Italic for setting Turkish:<br><img src="/sites/default/files/old-images/cartersans2_6096.gif"><br>
      Quite contrary to the view of some Turks that evoking Arabic would be backwards, my view is that doing it subtly would in fact be... sophisticated.</p>
      <p>BTW one "cosmic" thing that happened in Istanbul was that <em>immediately</em> after my talk Fred Smeijers started his own presentation and he was using Meran for the text!  :-)</p>
      <p>hhp</p>
