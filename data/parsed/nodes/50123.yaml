    <p>My ongoing search for a good Graphic Design program within a university has lead me to the following schools:</p>
    <p>RMCAD, Denver, CO<br>
    <a href="http://www.rmcad.edu/" title="http://www.rmcad.edu/">http://www.rmcad.edu/</a></p>
    <p>University of North Texas, Denton, TX<br>
    <a href="http://www.art.unt.edu/course-listings.html" title="http://www.art.unt.edu/course-listings.html">http://www.art.unt.edu/course-listings.html</a></p>
    <p>If there are any alumni from either school on Typophile, I'd like to know what you think about the curriculum, difficulty, etc...</p>
    <p>I'd also like to know what other people think of the schools whether they've attended or not. </p>
    <p>Thanks.</p>
