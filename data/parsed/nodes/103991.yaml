    html: <p>The browser support is very uneven. What works most of the times is a flat kerning table, but expanding the class kerning can add significant weight to the font files.</p>
    html_clean: <p>The browser support is very uneven. What works most of the times is a flat kerning table, but expanding the class kerning can add significant weight to the font files.</p>
