    html: |-
      <p>... like Frode said. </p>
      <p>However, for some browsers, you can get kerning by applying the text-rendering: optimizeLegibility; property in your css.</p>
      <p>There's some more info here:<br>
      <a href="/wiki/https%3A/%252Fwww.typotheque.com/articles/opentype_features_in_web_browsers_-_tests%2523kern" class="freelinking" rel="nofollow">https://www.typotheque.com/articles/opentype_features_in_web_browsers_-_tests#kern</a><br>
      although you have to realize this is a moving target right now.</p>
