  html: |-
    <p>Hi all</p>
    <p>I have a few fonts I would like to use online.</p>
    <p>I have used font squirrel web font generator <a href="http://www.fontsquirrel.com/tools/webfont-generator" title="http://www.fontsquirrel.com/tools/webfont-generator">http://www.fontsquirrel.com/tools/webfont-generator</a></p>
    <p>The fonts have class kerning that works in all applications but the fonts from the web font generator don't seem to have any kerning.</p>
    <p>Am I missing something, is it possible to have kerning in web fonts.</p>
