      <p>Here’s how I do it. Start from your Italic outlines. Since the point placement and structure will be pretty much the same, you’ll be in a much better starting position.</p>
      <p>I put a copy of the original Italic in the template/mask/background (different terms, same thing, depending upon your software) of the Bold Italic, to compare with. I also keep open a glyph window from my Bold, with a copy of the Regular in the template/mask/background. </p>
      <p>Using visual comparison, the relationships between your Bold Italic and Italic should be similar to the relationships between your Bold and Regular. </p>
      <p>So, for example, you might center a Regular ’o’ behind the Bold ’o’, and then you’ll have a guide for how much weight to add to your Italic ’o’ and how much you should add inside and how much outside. </p>
      <p>You can keep shifting the relationship to check different aspects. For instance, I will usually position the ’n’ centered on the counter and compare, then aligned on the right side of left stem and compare again.</p>
      <p>This is how I use the Bold for visual reference. I believe it is essentially the same kind of thing that David is talking about.</p>
      <p>— K.</p>
