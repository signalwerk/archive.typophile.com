      <p>” So, I wonder which way is the best one: start from the italic and drawing the bold weight or start from the roman bold and draw the bold italic.”<br>
      Both actually. One normally is using the contours from the italic, and information from the Bold to make the bold Italic. But I do not think, once one has an italic, that one should go back to the bold contours for anything but a visual reference.</p>
