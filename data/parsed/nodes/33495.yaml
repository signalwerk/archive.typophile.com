    <p>I hope I’m in a good section.</p>
    <p>I’m looking for tips, suggestions or your knowledge to draw my second weight of my <a href="/wiki/italic" class="wiki">italic</a> typeface. So far, I drew the roman in thin, light, regular, bold and black. I also drew the regular italic. So, I wonder which way is the best one: start from the italic and drawing the bold weight or start from the roman bold and draw the bold italic. </p>
    <p>Thank you to share your experiment.</p>
