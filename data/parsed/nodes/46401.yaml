      <p>Look out for the new ‘Studio Lettering’ collection, soon to be released by <a href="/wiki/House%20Industries" class="freelinking" rel="nofollow">House Industries</a>!</p>
      <p>It consists of three styles, <a href="http://www.tdc.org/news/2008Results/Slant.html" rel="nofollow">Slant</a>, <a href="http://www.tdc.org/news/2008Results/Sable.html" rel="nofollow">Sable</a>, <a href="http://www.tdc.org/news/2008Results/Swing.html" rel="nofollow">Swing</a>. </p>
      <p>All of them feature <em>vernacular alternates</em>, which can be toggled via stylistic subsets in OpenType. <a href="/wiki/Ken%20Barber" class="freelinking" rel="nofollow">Ken Barber</a> got the idea to this when he saw the variation of the umlaut in Swedish sign-painting and handwriting. See also some photos by <a href="/wiki/Peter%20Bruhn" class="freelinking" rel="nofollow">Peter Bruhn</a>: <a href="http://www.flickr.com/photos/fountaineer/1079101663/in/pool-779590@N22" rel="nofollow">[1]</a>, <a href="http://www.flickr.com/photos/fountaineer/446192970/in/pool-779590@N22" rel="nofollow">[2]</a>.<br>
      F</p>
