      <p>When I was learning Swedish, the textbook had examples of postcards and such as part of its illustrations. One feature I noticed about the mimicked handwriting on them was that the dots of the letters ä and ö were not properly separated but replaced with something resembling tildes, so that they looked more like ã and õ. So I figure the improper dots must be a feature of at least some Swedish handwriting or must have been at some point in time. After all, in Swedish there is no risk of confusion to be had by not indicating the dots properly.</p>
      <p>Is this something that's found in Finnish handwriting at all? Or have you seen it at all in Finland-Swedish handwriting? I have no idea how common this is.</p>
      <p>It must be unusual to see such an informal feature associated with handwriting on a type/lettering design like on that Ex Libris.</p>
