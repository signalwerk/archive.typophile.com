      <p>In languages where there is no danger of confusion, the double dots of the printed umlaut often look like double acute accents, tildes or macrons.</p>
      <p>This is natural, just a question of writing economy :-)</p>
      <p>Some decorative typefaces take on this feature, however this limits their usability in other languages.</p>
      <p>Szabolcs</p>
