    <p>I found this Ex Libris in a book  I bought from a high quality second hand bookshop in Helsinki. It's in an apparently second edition J. B. Priestley's Angel Pavement from 1930, published by William Heinemann Ltd, London. It was obviously purchased by Mr. Starck in 1932, and it was no. 604 in his library.</p>
    <p>Mr. Starck seemed to have been Karelia minded, as the two swords suggest – eastern and western. The same theme is in a label of a popular Finnish beer, Karjala (Karelia).<br>
    Karelia is in the border of Finland and Russia, in 1930 it was still totally in Finland, now part of it belongs to Russia.</p>
    <p>The K in Starck is pretty interesting as well as the Ö without proper umlauts.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Exlibris_3744.jpg"></div><p></p>
