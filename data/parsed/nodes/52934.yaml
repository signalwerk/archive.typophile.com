      <p>Tell us about your thinking:<br>
      How will you sell this idea to your client? Why a folded corner?</p>
      <p>Technically: the scale between left and right seems off to me. Also the lockup seems very uncertain. I don't think you need the rules. I'd try something bolder on the right, or maybe a white box around the right. But more importantly, the idea.</p>
