    <p>Hi,</p>
    <p>my client is a Franco-German auditing firm consisting of three people. The company is based in Paris and works for German, Austrian, and Swiss companies operating in France.</p>
    <p>The logo they are after should be a very simple wordmark containing their company name ("ABTF") as well as a brief description of what they do (literally: "Audit, Bookkeeping &amp; Tax in France").</p>
    <p>Unfortunately, I was only able to come up with one idea:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_5917.png"></div><p></p>
    <p>I am planning to color this logo in the colors of the French flag.</p>
    <p>Please let me know what you think of it and how it could be improved. Thanks a lot for any input!</p>
