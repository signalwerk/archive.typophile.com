    html: |-
      <p>I think you could re-create this using the Nick’s Font you found and Jim Spiece’s <a href="http://www.myfonts.com/fonts/spiecegraphics/quaint-gothic-sg/" target="new">Quaint Gothic</a>, which would only need some serifs removed from the A, N and R. With a bit of clipping of Nick’s G, I think you’d have it.</p>
      <p>Bottom line: Carolina Golf could be a customized mix of these two fonts.</p>
      <p>- Mike Yanega</p>
