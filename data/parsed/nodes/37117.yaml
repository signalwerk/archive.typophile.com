    html: <p>I notice many web sites have a search function tht says "search powered by Google". So there must be some way of automatically incorporating the Google search capability, probably some scripting available from Google, and probably free. Perhaps the Punchcut folks could look into this. Not much point having a search function if it doesn't get results. Typophile threads are a valuable resource on typography and design. Anyone visiting the site should be able to search it effectively without having to figure out that you need to use Google.</p>
