    <p>I check this site quite frequently, just to see what discussions are going on, usually just browsing through the homepage articles to see what people are talking about.</p>
    <p>The other day someone had a Type ID question about the Miller High Life logo. ( <a href="http://typophile.com/node/37023" title="http://typophile.com/node/37023">http://typophile.com/node/37023</a> ). I chimed in with a suggestion (which is rare) and today wanted to check back on the thread to see if anyone had come up with anything else.</p>
    <p>Thinking it would be faster I typed in "high life" in the search box, which was in both the title and body text of the post, but got no results (i tried both with and without quotes around "high life"). Then I tried searching for other words that appear in the post that I remembered typing "old stock" "neighborhood"... but the post never came up.</p>
    <p>I finally found the post, by browsing through the type id forums - but kept trying to see if I could get the post to come up through the search box - mostly on principle. It seemed like if I couldn't find a post by searching for text that I knew I had typed - what's the likelihood of finding the results I want when using keywords to search for a topic I'm researching.</p>
    <p>Is there something I'm missing here? Thanks!<br>
    Connal</p>
