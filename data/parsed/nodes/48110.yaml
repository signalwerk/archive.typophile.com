  html: |-
    <p>Will you be going to see Jovica Veljovic at the SF Public Library? I will be!</p>
    <p>If you don’t already know, Jovica is a famous Calligrapher and Type Designer. </p>
    <p>“A slide lecture by Jovica Veljovic, calligrapher, printmaker, teacher and word-renowned type designer, from Hamburg, Germany. Cosponsored by the Book Arts and Special Collections Center.”</p>
    <p>August 28th</p>
    <p>5:30 reception<br>
    6:30-7:30 presentation.<br>
    ( Lower level, Koret Auditorium )</p>
    <p>For more info: contact Susie Taylor at The SFPL rare book room.</p>
    <p>(415) 557-4560</p>
    <p>More info about the great resource that is the SFPL rare book room<br>
    <a href="http://sfpl.org/librarylocations/main/bookarts/bookarts.htm" title="http://sfpl.org/librarylocations/main/bookarts/bookarts.htm">http://sfpl.org/librarylocations/main/bookarts/bookarts.htm</a><br>
    <a href="http://sfpl.lib.ca.us/librarylocations/main/bookarts/prestianni.htm" title="http://sfpl.lib.ca.us/librarylocations/main/bookarts/prestianni.htm">http://sfpl.lib.ca.us/librarylocations/main/bookarts/prestianni.htm</a><br>
    </p>
