    html: <p>i guess this font probably just needs some kerning (which i'm guessing is currently missing). the "it" combination was the only real troublesome gap i noticed in your set text. "ij" was also a problem in your initial image as were "uv". it seems like the serifs/strokes or whatever they are are a bit too large in places, but that is part of what gives this such great character. maybe the design needs to be regularized a bit to reduce this problem? contextual alternates might be another way to solve some of these spacing issues. or again, maybe it's just kerning...</p>
