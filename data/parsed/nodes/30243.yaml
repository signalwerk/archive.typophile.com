    html: |-
      <p>This is a great design that just seems to smile up at you! Where characters in Agara really fit together well it looks great; t followed by h, i followed by n.</p>
      <p>Here are my nitpicks:</p>
      <p>There's a big gap showing up between l followed by a or d, and the space after the apostrophe is pretty distracting, especially with the spacing before the apostrophe being to tight. It seems like theres a much bigger gap following h and n than there is following m, it might just be an optical trick.</p>
      <p>I'm also not to hot on that z dipping under the baseline. It's a pretty letter, but I could see a lot of designers redrawing it just ao that it doesn't stand out. I wouldn't get rid of it, but it would probably be a good idea to have an alternate that fits better with everything else.</p>
    html_clean: |-
