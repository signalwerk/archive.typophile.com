    html: |-
      <p>This is my first test balloon. I am working on a manuscript written in German and Italian language (though for the second one I will need help).<br>
      It treats about designing my typefaces not meant for daily use in rough publishing or commercial area. In a sense they are artistic researches on the symbolic search for female beauty.<br>
      I inspire myself with photographers as Paolo Roversi or recently I go back to Renaissance painters.<br>
      The manuscript shall as well contain technical aspects as also poetic views on my everyday wondering of what is beauty all about.<br>
      I love to express myself with the letters of the alphabet.<br>
      And for the future I hope that someone will enjoy this ride with me through thoughts, feeling and shape.<br>
      I am working on it.</p>
      <p>Thanks<br>
      Stefan</p>
