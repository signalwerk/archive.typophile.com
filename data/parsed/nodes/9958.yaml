    html: <p>Hello, <br>The font was custom-designed for the Bouroullec project by Julien Gaillardot, a former student from the University of Art <span class="amp">&amp;</span> Design Lausanne. Now he has his own graphic <span class="amp">&amp;</span> type design studio in Avignon, France. The design is based on Bouroullec design shapes and exists in 2 weights. Julien will release a new typeface family on Optimo this&nbsp;spring.</p>
    html_clean: <p>Hello, <br>The font was custom-designed for the Bouroullec project by Julien Gaillardot, a former student from the University of Art <span class="amp">&amp;</span> Design Lausanne. Now he has his own graphic <span class="amp">&amp;</span> type design studio in Avignon, France. The design is based on Bouroullec design shapes and exists in 2 weights. Julien will release a new typeface family on Optimo this&nbsp;spring.</p>
