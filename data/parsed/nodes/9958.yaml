  - id: 148914
    user: 1203
    date: 2005-03-31T23:43:00
    date_raw: 31 Mar 2005 — 11:43pm
    votes: null
    html: <p>Hello, <br>The font was custom-designed for the Bouroullec project by Julien Gaillardot, a former student from the University of Art &amp; Design Lausanne. Now he has his own graphic &amp; type design studio in Avignon, France. The design is based on Bouroullec design shapes and exists in 2 weights. Julien will release a new typeface family on Optimo this spring.</p>
