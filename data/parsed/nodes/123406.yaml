      <div class="comment-spam-body"><p>Good point. No disputing that the typeface verges on Frankenfontism. The most striking feature is the pregnant _S_ and _s_, but this is not reconciled with other features such as the Louvainesque feature of making the thicks and thins meet at an angle, the German single story _g_, the Didotesque _y_ with the plumb drop vertical descender, and some of the quirky touches in the styles of Grasset, Bewick Roman and Graybar Book.<br>
      However, perhaps it was appropriate for a press that dealt with topics that were far from conventional.<br>
      Don</p>
      </div>
