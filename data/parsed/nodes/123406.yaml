      <div class="comment-spam-body"><p>I think Louvaine, designed in 1928 and issued in 1929, but did not last long enough to appear in the 1934 ATF catalog, is closer than Grasset. Consider Louvaine Medium:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/LouvaineMed@McGrew204b@30pct_5365.jpg"></div><br>
      Comments by Jaspert: "...designed by M.F. Benton, based on a Bodoni model, but with the peculiarity found in a number of modernistic types of making the thicks and thins meet at an angle. This is especially noticeable in the O and the S. The g and y have cursive tails...."<br>
      Comments by McGrew: "LOUVAINE series was designed by Morris F. Benton for ATF in 1928. It is an adaptation of Bodoni (the working title was Modern Bodoni), and many of the characters are identical. Only g and y are basically different; otherwise the distinction is in the more abrupt transition from thick to thin strokes in this series. In this respect, Ultra Bodoni has more affinity to Louvaine than to the other Bodoni weights. The three weights of Louvaine correspond to Bodoni Book, regular, and Bold. This series did not last long enough to appear in the 1934 ATF specimen book, the next complete one after its introduction. "<br>
      Digital bold weight -- no Medium or Light -- from Bulldog <a href="http://www.fontshop.co.uk/a_to_z_listing/id/21999" title="http://www.fontshop.co.uk/a_to_z_listing/id/21999">http://www.fontshop.co.uk/a_to_z_listing/id/21999</a><br>
      Don<p></p>
      </div>
