      <p>I agree with Nick. I hunted in all my books and Graybar/Louvaine are the closest I could find. A problem is that Lescaret may have used an existing (but obscure to us) French typeface. I don't know about you guys, but my collection of information about European types is pretty sketchy. (I searched McGrew's book, in case it was an American type, but I didn't see it.) Then I suppose there is also the possibility that he may have developed his own typeface, but if he did he escaped the notice of Luc Devroye. That makes me suspect he used something that was available to him, but perhaps from an obscure foundry.</p>
      <p>- Mike Yanega</p>
