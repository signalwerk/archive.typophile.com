      <div class="comment-spam-body"><p>It's very strange to me that the content shown in the image would appear in a "collected works" volume, even more so because Mr. Crosby did not write the content shown. </p>
      <p>Aside from that, if it is only the /A that is critical, why not use Grantham and ask someone to modify the /A for you, or download FontForge (free font editor) and do it yourself? Since Grantham is a free font, I'm sure the license will allow you to do that if you don't plan on redistributing the font.</p>
      <p>I agree with Don that perhaps the font in question was never a commercial font.</p>
      </div>
