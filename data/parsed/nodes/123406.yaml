      <div class="comment-spam-body"><p>Are you certain the book was published by Black Sun? It is not listed in their body of works. Mr. Crosby did own a copy of the first English translation of Krafft-Ebing's "Psychopathia Sexualis", Rebman, London 1905, but I see no evidence he ever reprinted it. Frankly its content does not fit within the scope of what they normally published.</p>
      <p>All that being said, you still want to know the font. Knowing where it was published and by whom might make identification a bit easier.</p>
      </div>
