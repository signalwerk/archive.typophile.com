      <div class="comment-spam-body"><p>The production runs were very short, so I believe that this is a letterpress font rather than something that meets the technical specs for a typecasting machine like Linotype. So I wouldn't rule out bespoke.<br>
      Private presses in the early 20th century with aspirations to uniqueness sometimes made the effort to have a unique typeface. Recall for example the Doves Press. In these cases vanity trumped profitability.<br>
      Might be worth a search of the books on private presses to see if there is anything on Black Sun Press.<br>
      for example Hugh Ford's _Published in Paris: American and British writers, printers, and publishers in Paris, 1920-1939 [1975]_ <a href="http://www.amazon.com/Published-Paris-American-publishers-1920-1939/dp/0855112123" title="http://www.amazon.com/Published-Paris-American-publishers-1920-1939/dp/0855112123">http://www.amazon.com/Published-Paris-American-publishers-1920-1939/dp/0...</a> I trust there are others. For more leads Google "Paris private presses black sun" or visit a good university library and check their holdings for LOC classification Z321 and nearby.<br>
      Don</p>
      </div>
