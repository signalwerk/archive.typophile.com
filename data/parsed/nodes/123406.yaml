      <div class="comment-spam-body"><p>Mr. Thomas, I assure you that Harry Crosby wrote the material in the photograph. It is from his book Chariots of the Sun (<a href="http://www.poemhunter.com/poem/psycopathia-sexualis/" title="http://www.poemhunter.com/poem/psycopathia-sexualis/">http://www.poemhunter.com/poem/psycopathia-sexualis/</a>). I apologize because I inadvertently used the photograph of that page thinking that it was from his book Sleeping Together. Both use the same typeface. My assistant took the photo and I forgot that I had instructed her to photograph all prose poems that were not included in Sleeping Together. (See: <a href="http://www.amazon.com/The-Collected-Poems-Harry-Crosby/dp/B004CULP6M" title="http://www.amazon.com/The-Collected-Poems-Harry-Crosby/dp/B004CULP6M">http://www.amazon.com/The-Collected-Poems-Harry-Crosby/dp/B004CULP6M</a>.)</p>
      <p>Information from everyone has been extremely helpful. I was hoping that the typeface would be commercially available. Looks like it was a minor early 20th century typeface that was probably not used for much bookwork since Lescaret did not primarily focus on books. If I want to use that typeface for my press, I'll have to make alterations to an existing similar typeface that has an open license. All those leads above on similar typefaces are very helpful and I again thank Mr Thomas and Don for their expertise.</p>
      </div>
