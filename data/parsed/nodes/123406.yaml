      <div class="comment-spam-body"><p>Might be a lead in this account of the Black Sun Press:</p>
      <p>---start quote---<br>
      Started in 1927 by Harry and Caresse Crosby ... young expatriates living in Paris, the Black Sun Press was created to publish its founders’ ... attempts at verse in beautifully bound, hand set books. ...  the Crosbys found Roger Lescaret, a "master printer" whose previous works had been primarily funeral notices, to print Harry’s poems in a fine edition. They were so delighted at the result, Red Skeletons, with illustrations by their friend Alastair [the professional name of Hans Henning von Voight], that they decided to found a press. In a typical combination of high ideals and deflating humor, it was first called Éditions Narcisse – after their black whippet, Narcisse Noir.<br>
      ---end quote---<br>
      <a href="http://www.english.illinois.edu/maps/poets/a_f/crosby/blacksun.htm" title="http://www.english.illinois.edu/maps/poets/a_f/crosby/blacksun.htm">http://www.english.illinois.edu/maps/poets/a_f/crosby/blacksun.htm</a><br>
      So perhaps a bespoke typeface for or by Roger Lescaret.<br>
      Don</p>
      </div>
