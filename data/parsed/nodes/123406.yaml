      <div class="comment-spam-body"><p>OK, here's what I can find....</p>
      <p>The font in the picture has not been identified. It does, however, have many quirky characters which the old metal face Grasset (Deberny &amp; Peignot, 1898; ATF, 1904; and Monotype, 1912) has in common. The overall look is very similar.</p>
      <p>I suspect the font in the picture is based on Grasset -- or the other way around. Grasset is not available in digital form under that name that I could find, but there are two digital versions under other names.</p>
      <p>Octavian, at <a href="http://www.myfonts.com/search/octavian/fonts/" title="http://www.myfonts.com/search/octavian/fonts/">http://www.myfonts.com/search/octavian/fonts/</a> (not a very good version -- look at the lowercase /t -- it is way over-size)</p>
      <p>Grantham, free download at <a href="http://www.moorstation.org/typoasis/designers/lloyd/grantham.htm" title="http://www.moorstation.org/typoasis/designers/lloyd/grantham.htm">http://www.moorstation.org/typoasis/designers/lloyd/grantham.htm</a>. This appears to be a pretty good version and should at least give you the appearance you are looking for.</p>
      <p>Unless, of course, you are wishing to digitize the font in the picture. If that is the case, you still have to identify it and find a usable specimen of it.</p>
      </div>
