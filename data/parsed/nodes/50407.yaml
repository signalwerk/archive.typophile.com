    <p>I’m hoping some of you out there have been involved in the beta testing of FAP 4 for Windows.</p>
    <p>I’ve just installed the RC1 and all went smoothly. EXCEPT now, while correctly listing all my fonts in their various Libraries and Sets, FontAgent Pro shows them ALL as being INactive.</p>
    <p>I’m guessing I did not follow some correct order of steps during the install.</p>
    <p>Any aid here?</p>
    <p>Jim</p>
    <p>PS - I had this posted over in “Build” but no one had anything to say.</p>
