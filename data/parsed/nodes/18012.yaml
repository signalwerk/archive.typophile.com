      <p>I'm afraid the title page is not going to be the best way to say what the book was set in. It looks to me like there is more than one typeface on the title page, and often titling faces are not the same as the text faces used inside the book. Do you  have a sample page with text, or were you asking what was on the title page?</p>
      <p>- Mike Yanega</p>
