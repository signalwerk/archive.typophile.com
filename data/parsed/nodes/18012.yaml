      <p>Yes, that's the one. Thanks, Lex.</p>
      <p>Sorry, Patty. I guess it was naive of me but I actually did think that someone would know this off the top of her head. I even had a sample page on hand that I could have posted with my question, and I likely spent more time deciding not to post it than I would have spent posting it. In retrospect, I must have reasoned my assumption from the principle: <em>The object of my immediate concern must necessarily be the center of the universe for everyone</em>…which is really just too embarrassing to think about. </p>
      <p>Sheepishly,</p>
      <p>Tim</p>
