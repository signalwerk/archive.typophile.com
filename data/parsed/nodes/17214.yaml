      <p>You’re not going to easily find info about Chicken. That rare beast was part of David Carson’s Ray Gun-era body of work. Chicken was only briefly available through GarageFonts, and is now ancient history. David and his colleague Betsy Kopshina Schulz have been out of GF for years. Betsy is super busy these days with her design business and family. David is, as you would expect, busy with myriad projects and his own family.</p>
      <p>Betsy’s website is at <a href="http://ww.adesigngarden.com" title="http://ww.adesigngarden.com">http://ww.adesigngarden.com</a>. DC’s website is at <a href="http://www.davidcarsondesign.com" title="http://www.davidcarsondesign.com">http://www.davidcarsondesign.com</a>. Contact info for both is available on their sites. You could try asking them a few very specific, well-thought-out questions after you do all possible research about Ray Gun and Carson’s design aesthetic. There are a couple of good books on the subject, and tons of info on the web.</p>
      <p>I’m curious - do you actually have a copy of Chicken, or are you working from a printed specimen?</p>
      <p>Good luck!</p>
