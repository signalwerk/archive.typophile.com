      <p>Typotheticals, </p>
      <p>what you need to do in FontLab Studio is (1) Autohint all glyphs, (2) Automatically calculate alignment zones in Font Info, (3) Automatically calculate standard stems in Font Info. Just autohinting won't correct the problem. </p>
      <p>A.</p>
