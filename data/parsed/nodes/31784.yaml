    html: |-
      <p>Postscript Autohinting is far away from perfect. If you take a look at some other fonts you notice that these kind of problems are almost always there, more or less anyway.</p>
      <p>I’ve experimented a lot with this lately and found out that if you only autohint the vertical stems, it can sometimes can work very good – you get sharper appearance on screen but this typical horizontal distorsion is not there (when letters jump up and down).</p>
      <p>Take a look at this thread for more hinting stuff.</p>
      <p><a href="http://typophile.com/node/31448" title="http://typophile.com/node/31448">http://typophile.com/node/31448</a></p>
      <p>/ Göran</p>
      <p>PS. <cite>Just to give you more examples:</cite> I also spotted the same issue on another thread lately that don’t really speaks about hints, but as an example – look at the "t", "u" and "e" on Freight Micro Bold on this thread:</p>
      <p><a href="http://typophile.com/node/31816" title="http://typophile.com/node/31816">http://typophile.com/node/31816</a></p>
    html_clean: |-
