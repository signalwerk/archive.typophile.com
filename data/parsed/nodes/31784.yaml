      <p>Mr Twardoch<br>
      Thanks for your observations and suggestions. I got home and went to fix up the original font file here with your suggestions, and got absolutely nowhere. I followed your steps four times and the problem persisted every time.<br>
      Whipped out Fontographer and autohinted. Problem still slightly there so started over with Fontographer. 1. automated vert align zones then 2 . Autohinted. Problem cleared up. Could be just this font of mine, but confused an out of date program fixed the problem while Fontlab seems to stutter on it.</p>
      <p>Out of pure stubborness, took the corrected font and in Fontlab, followed your steps again. It recreated all the visual problems in the corrected font.</p>
      <p>?</p>
