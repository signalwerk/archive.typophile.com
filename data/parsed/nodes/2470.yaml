  date: 2003-12-18T16:27:00
  date_raw: 18 Dec 2003 — 4:27pm
  votes: null
  html: <p>I've been lurking here for over a year and posting for a little less than that, and I've got to say I've learned quite a bit from just watching the discussions here, and am constantly impressed by some of the work posted here... and even when there are arguments, those are almost always handled in such a respectful manner that makes certain design boards seem like a war zone (BJ and Hildebrant know what I'm talking about). <br> <br>I think it's about time Typophile had its own appreciation thread - as a (sort of) newbie, I'd like to thank all you guys and girls for making this board so great.</p>
