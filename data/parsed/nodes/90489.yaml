      <p>I will not mention the family names, but there are at least 2 versions<br>
      of the font by well known font forgery companies:<br>
      Brendel Informatik GmbH and Southern Software Inc.</p>
      <p>There are also another 2 cuts:</p>
      <p><strong><a class="freelinking external" href="http://moorstation.org/typoasis/designers/steffmann/" rel="nofollow">Domino</a></strong> by Dieter Steffmann (FontShop, 1999)</p>
      <p><strong><a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/idle-fancy-nf/" rel="nofollow">Idle Fancy NF</a></strong> - (c) 2007, Nick Curtis.</p>
      <p>The first one is the best match to your image.</p>
      <p>----------------------------------------<br>
      I found them using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
