      <p>The thing that strikes me most about your design is not the line spacing but the hierachy; 'geese' which i am assuming is the important bit plays second fiddle to the 'I "club"'.  The descending sizes as you go down the page are also slightly reminiscent of an eye test poster which is a little odd.<br>
      With the spacing of the last line have you considered not having the 'for "diamond" "diamond"' below the main body of the line as to my eyes it throws the whole thing off balance.<br>
      Hope this helps.</p>
