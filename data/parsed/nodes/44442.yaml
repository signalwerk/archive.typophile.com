      <p></p><div class="imageWrap"><img src="http://typophile.com/files/20080420-geese_puppies_5344.png"></div><br>
      I like having the top line smaller. I had tried making the bottom lines one before and hadn't liked it, but I like it now. This may be partly because there is clearer contrast between the two parts of the sentence now that the first two lines are the same size. Here's a version with two lines at the bottom in case anyone wants to compare.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/20080420-geese_puppies-twolines_3793.png"></div><br>
      I used a slightly darker color for the second part of the sentence in the version where the second part of the sentence is one line because I was copying it from another version that had a slightly darker color. Now that I've tried it, I actually like it slightly darker; are there any guidelines about whether or how much to make small text darker?<p></p>
