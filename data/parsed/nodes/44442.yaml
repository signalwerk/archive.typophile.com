    <p>I can't really tell how the lines should be spaced, especially the spacing between "geese" and the next line. I'd also appreciate critique of the kerning.</p>
    <p>I had originally planned on using animals whose names happened not to have descenders, so I had to change the design a bit when <strong>g</strong>eese suddenly became funny at my school. I sort of like the descender, but I feel like I need to fill some of the space to its right.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/20080419-geese_puppies-grey50-different_red-lores-white-proof_3485.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/20080419-geese_puppies-grey50-different_red-lores_3926.png"></div><p></p>
