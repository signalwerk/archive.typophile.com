    date_raw: 8 Jun 2005 — 8:50am
    votes: null
    html: |-
      <p>The ideas in the covers aren't bad as designs on their own, and I'm a sucker for elegance/simplicity. However, many of the layouts feel like first passes, rather than finished ones. Plus, as Dan said, the hierarchy isn't working yet, which is often harder than one expects with only 3 elements on the page. Overall, I prefer the black designs to the white ones. I like the blue and red arrows in 'Tactica', too.</p>
      <p>Generally speaking, sales people love pop, sizzle, sexiness, and any other poorly articulated term for a lot of stuff going on and crazy visual effects. In that sense, your designs my not strike the target audience where it counts, so that's probably why your client didn't like them.</p>
      <p>Again, not bad, but could be better.</p>
