      <p>Maybe way off here, but Mário Feliciano's <a href="http://www.myfonts.com/fonts/t26/escrita/principal/" target="_blank">Escrita</a> has a hand-drawn-swash look. It also includes  <a href="http://www.myfonts.com/fonts/t26/escrita/" target="_blank">two fonts</a> for first and last characters.</p>
      <p>Rob Leuschke's <a href="http://www.myfonts.com/fonts/gideon/carattere/regular/" target="_blank">Carattere</a> is less rough, but still looks hand drawn.</p>
