    <p>In my never-ending quest to entertain you all, can anyone shed some light on what this font might be? This style of lettering is fairly typical of prison tattoo work. (Obviously, since it's a prison tattoo, it's definitely hand-lettered!!!) But perhaps you could suggest something that's reasonably close to it. Perhaps some of you forum members who are currently behind bars might have a unique insight!<br>
    Thanks, DK~</p><div class="imageWrap"><img src="http://typophile.com/files/tattoo.jpg"></div><p></p>
