      <p>I've watched Ed Benguiat scratch out incredible word doodles in psuedo Edwardian Script using just a ballpoint pen without even spilling his beer!</p>
      <p>Both Tom Carnase and Tony Di Spigna weild mighty quills penning impromtu ornate scripts as well. The beauty of these pieces are that the flourishes are integrated within the characters and words used, which is virtually impossible to create using a type font.</p>
      <p>You can get close using the swirly <a href="http://www.myfonts.com/fonts/linotype/itc-edwardian-script/edwardian-scr-itc/index.html" target="new">ITC Edwardian Script</a>.</p>
    html_clean: |-
