    html: |-
      <p>&gt; Carter &amp; Cone Big Caslon?</p>
      <p>It isn’t Big Caslon, I am 99.9% sure this is a custom Caslon based on Caslon 540*. See attached image for comparsion, the glyph widths of your sample matches Caslon 540.</p>
      <p>If you’re looking for an exact match, I think you’re out of luck. I think Big Caslon would be a great alternative if you’re after a Caslon for display. But if you need to match the width of the glyphs exactly, I’d go with Caslon 540. </p>
      <p></p><div class="imageWrap"><img src="/files/casloncomp1.png"></div><br>
      * The hairlines appear to be thinner but this could be attributed to the pixel-faires but the numeral 4 is distinctive in your sample.<p></p>
