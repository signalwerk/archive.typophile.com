    <p>Hello Typophiles,<br>
    I'm searching a font without closed counters for a quite weird laser-cutting project. In particular, I need something like the <a class="freelinking external" href="http://www.dafont.com/fortunata.font" rel="nofollow">Fortunata</a>  font by Balint Erdosi but in a Sans Serif style. Can you suggest any?</p>
    <p>I have to laser-cut a quite large amount of ID plates and our CAD/CAM program is forcing us to manually remove the counters from each and every closed letter (P, Q, B, etc.). This is a slow and painful task even in a regular project but in this case it could kill the entire project because our plates are serially numbered: we would have to repeat the same manual clean-up for each and every plate of a virtually infinite sequence of plates. As a consequence, we do have to find (or create...) a font that does not require this manual clean-up.</p>
    <p>Unfortunately, Fortunata is not the right font for us because we need a highly-readable San Serif one (as usual for ID plates).<br>
    Even worse, we cannot use one of our usual stencil fonts, like Boston Traffic or Stencilla, because the text has to be cut away from its original metal sheet and soldered to another support, where it must appear as embossed (raised) to resist to paint, grease, dirty and so on.</p>
    <p>We will use capital letters and numbers, only. No need for lowercase letters, italics or anything else.</p>
    <p>Any suggestion? Any easily readable font for such a project?</p>
    <p>Thank you in advance</p>
    <p>PS: My problem is quite similar to the one faced a few years ago by Grant Dunlop and explained by himself in this post: <a class="freelinking external" href="http://typophile.com/node/20375" rel="nofollow">http://typophile.com/node/20375</a>.</p>
