    html: |-
      <p>@riccard0: yes, I think this is a good description of our needs. We need to have each glyph in a single piece. Actually, we would like to have the whole text in a single piece, by sitting the individual glyphs on a common baseline. More precisely, we would like to have our 3D CAD project cleanly split between a single-piece foreground (the plate text) and a disposable, single-piece background (the mask with the empty space and the counters). This would ease our work a lot.</p>
      <p>A possible example is <a href="http://www.dafont.com/kenteken.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Kenteken</a>. Look at the open-counters O and R, for example. Unfortunately, Kenteken still has closed-counters letters (B, D and Q, for example).</p>
      <p>BTW, we tried with a few common stencil typefaces (like: <a href="http://www.dafont.com/stencilla.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Stencilla</a>, for example) and they did not do the job. </p>
      <p>As you noted, in a stencil typeface the text is usually composed by the cuts (or holes) that you make in a mask (the stencil itself) and each glyph is composed by a variable number of separated elements. This would be a big problem for us because we would be forced to re-assemble each glyph from it parts on the new support and solder each fragment of each glyph to the common support individually. A painful puzzle for our installers.</p>
      <p>At the moment, we are also looking at <a href="http://www.dafont.com/iarnold.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">iArnold</a>. As you can see, all of the text sits on a common baseline that act as the linking element but, still, we do not have a single-block mask. The counters are still separated elements. We would have to open each closed counters before using this typeface, not mentioning the fact that we would also have to convert it from its outline style to a solid (or "filled") one before using it to generate solid metal parts.</p>
      <p>Thanks for your time and your attention</p>
