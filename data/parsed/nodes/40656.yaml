    <p>Hi everybody,<br>
    I'm looking for the typeface used in the image below.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/domarne_5543.jpg"></div><br>
    It's from a magazine masthead, I have no other letters.<br>
    The magazine has been around since 1987, but I don't know if the masthead has been set in that face since then or if it has been redesigned later. It has been set in that face surely since 2002 till present.<br>
    The similar I found is Rhode Black Condensed, which actually isn't.<br>
    I know it could be a custom design.<br>
    Any hint is welcome, no need to tell you.<p></p>
