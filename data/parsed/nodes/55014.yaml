      <p>On the TDC Facebook page--before this arose here--James M. raised this question about TDC type winners vs commercial success. I asked whether maybe there was a bias for novelty. James posted a reply that he had often heard judges say "I've seen that before" as a reason not to choose a face.</p>
      <p>The example Stephen gave above of FF Netto I think tends to support this. Soft sans generally are popular and familiar now. For example, my local Giant Food store has just redone its identity in Cronos. (It has gone from Benguiat to Meta to Cronos over the years.) One corporate logo after another seems to be coming out in a soft sans. FF Netto is a soft sans, and it also uses the 'stemless' look of Dax and others. So you could say, "I've seen that before." But it seems to me that Netto is one of the best of this class, having softness and charm without being weak or cute. Should it have been rewarded for its excellence of execution, even if its look is not that original?</p>
      <p>I'm not saying that there should be any rule, but it might be that graphic designers are more concerned about the best in a class, rather than what is most original in look, whereas type designer judges tend to go a bit the other way. </p>
      <p>I know there is something like this difference in popular vs academic writing. In academic writing the main thing is originality. It's an explicit requirement for PhD dissertations, for example. But in popular writing having an enjoyable read is the main thing. And originality is only important in so far as it interests the reader--it doesn't need to be actually original, just new to the reader. For example, Malcolm Gladwell's books are reports on others' academic research. They would not be accepted by academic journals or get a PhD, but they wildly outsell almost everything academic.</p>
