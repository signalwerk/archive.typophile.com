      <p>Re. 'commercial success': it happens that the graphic design business, on account of the kind of material that it produces and the way it produces it, accounts for a sizeable portion of the retail licensing font market. I don't think anyone really knows just how large a portion, or how large the retail licensing font market is relative to the overall market for fonts including OEM bundling, custom font commissions, etc., either in terms of number of units moved or in terms of income.</p>
      <p>As a full-time type designer who had not had anything to do with retail font licensing for almost a decade, that market -- and the graphic design business in particular -- is practically irrelevant to me. So I'm pretty glad that the TDC competition does not seek to honour 'commercially successful' types; indeed, I'm not sure how such a criterion could be fairly judged it it were based on retail licensing figures, since the 'success' of OEM bundled fonts in terms of units moved is so much higher.</p>
