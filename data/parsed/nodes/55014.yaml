      <p>I'm not how sure how commercial success should be brought into type design competitions (this one, or others). The TDC2, for example, does not require that submitted designs already have been released. I guess that some winners might never get released… that is at least a theoretical possibility. </p>
      <p>Moreover, since the contest is supposed to be blind, should judges really consider how successful a typeface may have already been? When you submit your PDFs to the contest, you don't include the designer's name, typeface name, or foundry name in the layout. So you couldn't well write "Dear judge, this typeface has already sold xxx copies! Love, foundry y."</p>
      <p>Now, I guess that individual judges could look at a design, and try to guess how successful a design might be. But that is a slightly different question. Also, I suspect that "success" is defined differently at each foundry. I also think that each foundry has—to an extent—its own unique customer base. The customers that really like a certain kind of typeface may always drift to foundry A, while foundry B gets customers who like their popular typefaces a bit better.</p>
      <p>Like Stephen Coles, I've been involved with submitting designs from a foundry to this competition for five years now. I also can think of several designs I think were submitted to the contest this year that did not win, and of course I wish that they would have. But I am sure that this year's judges had good reasoning for their choices. I am honored to be on the list of those designers whose typefaces were selected for recognition. When we all read the published TDC annual that comes out later in the year, we can read what the judges had to think about this year's entries and this year's competition.</p>
    html_clean: |-
