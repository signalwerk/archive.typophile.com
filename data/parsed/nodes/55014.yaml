      <p>It seems as if there are three things people are talking about, combining two if they want to bolster their argument. Specifically, 1) design recognition, 2) use by graphic designers, and 3) commercial success. Farquart complains that 1 and 2 don't correlate, and Stewf chimes in that plenty of 3s that were not 1s. </p>
      <p>I wonder how much graphic designers go for something "timeless" in their designs, which might involve using (as farquart notes) something with a more neutral personality. Witness the continuing usage of Helvetica. </p>
      <p>On the other hand, commercial success for a font publisher often involves convincing graphic designers that last year's typeface is now passe and needs to be replaced with the hottest, latest typeface. "You don't want to use Fnorkle Script for Shazbat, Inc., because Blah Industries used it in their ad campaign last year." Nevermind that both the Shazbat and Blah logos are Helvetica.</p>
