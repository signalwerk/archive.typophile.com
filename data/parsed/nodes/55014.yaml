    date: 2009-02-22T09:30:00
    date_raw: 22 February 2009 - 9:30am
    votes: 0
    html: <p>it strikes me that the winners of the competition are types that have very strong personalities... i would think most graphic designers are drawn to more neutral looking designs... allowing the designer to put their personality on the work rather than fight with a type with such strong personality... the fact that mr sowersby's designs were commissions and the most neutral looking of the winners may bear this out...  also mr paul's beautiful script faces have won a few times, they are very beautiful, but how many graphic designers actually use script fonts in their work? maybe a few times in their career... i know that veer's and most other on-line resellers point to scripts as their most popular sellers, but the question has to be asked... who is licensing these designs, and how come they turn up so rarely in general commercial work... are they more objects than tools?</p>
