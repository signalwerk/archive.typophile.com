      <p>I have been talking about this for several years. </p>
      <p>I don't think it is a criticism of the competition or the TDC at all. </p>
      <p>I do think there is a different point of view between type designers and graphic designers, and when Farquart posted his/her comments I thought they were valid.</p>
      <p>As posted here, the competition is not one about commercial viability, it is about what a group of judges pick to be the best on a given day. On another day the results may be different. What that means for the commercial success of any given design is meaningless.</p>
      <p>I do think that most graphic designers play follow-the-leader when it comes to type selection. What fonts are "The Handful of Influential Designers" using, and there you go, everyone else follows suit.</p>
