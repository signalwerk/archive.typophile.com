  - id: 390677
    user: 24940
    date: 2010-01-22T13:36:00
    date_raw: 22.Jan.2010 1.36pm
    votes: null
    html: |-
      <p>The name of the typfaces is Bradford. If you download the Patrick Frey pdf here <a href="http://www.swips.ch/downloads/Vorschauen/patrick_frey_09.pdf" title="www.swips.ch/downloads/Vorschauen/patrick_frey_09.pdf">www.swips.ch/downloads/Vorschauen/patrick_frey_09.pdf</a><br>
      and open it in acrobat it tells you that the name of the fonts embedded. Also its nice if you want to get a closer look at the typeface.</p>
      <p>To me it neither looks very alike Palantin or Galaxie Copernicus. But it feels a bit like dtl Fleischman, with its very smooth outlines (if you take a look at the vectors in the pdf you can see that most corners ar rounded) which gives the typfeace a nice soft texture.<br>
      Since I haven't been able to find any information about it on the net, I also guess that its an unreleased typeface. I personaly doubt that it is designed by Elektrosmog, since it has a rather different look from the typefaces they usualy make.<br>
      I think it looks more like a revival of a baroque typface which is based on prints, so the lettershapes are smoother and rounder. But thats just a guess.</p>
      <p>Anyway thanks for your help, as always typophile members have been very supporting</p>
