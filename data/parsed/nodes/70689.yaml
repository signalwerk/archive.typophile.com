      <p>I would hazard that, with those awfully fast CPUs and loads of memory, game designers take the easy road and just add the FreeType library to their code. That's an Open Source package, so there are no software limitations (other than acknowledging its use); but it <em>does</em> mean the game also has to include original, unmodified outline fonts.</p>
      <p>At least two games I own come with complete TTFs; one of them is WarCraft 3, with the instantly recognizable Friz Quadrata. Of course, these files are more-or-less shielded against blatantly installing them into the user's system (they are packaged into larger data files), but at least for me it was no problem at all extracting the font. (That was just "to prove a point", as I was wondering if it <em>indeed</em> was an original TTF. It was. I dunno what sort of license Blizzard used.)</p>
      <p>FreeType is a 21th century solution, as it depends on a fast computer with a rather high resolution (and ideally, a true color display) -- then again, surely you are not talking about 8x8 bitmap fonts anymore? Fat chance anyone can even tell the difference between Times and Helvetica with such dimensions ...</p>
