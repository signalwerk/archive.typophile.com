      <p>Bitmap fonts still have advantages over outline fonts when it comes to performance in console games. I'm not aware of any commercial font EULA* that allows for the creation and distribution of derivative bitmap fonts, so typically you'd need to get those rights from the type designer. Although I’m sure there are game developers that don't always get the rights they need, but I think the major players will usually do the right thing – pay for the additional rights or use freeware fonts. </p>
      <p>In terms of licensing the bitmap-rights cost is typically less than rights to ship the TTF. These days though the game itself tends to be the easy part, there's the Web version, packaging, manuals, translation and localizations.</p>
      <p>*Exception may be the new FontFont EULA, but that also has restrictions.</p>
