    html: "<p>1. If you are doing manual TT hinting, then you should definitely maintain two source files, one for PS and one for TT. If you are letting FL automate the TT hinting, you can do this from the PS source, since the autohinting works by converting PS stem hints into TT instructions. <br> <br>2. A TrueType font can have any UPM value you like, so it is possible to maintain a single PS source with a UPM of 1000 and output a TT font with the same UPM. Microsoft recommends using a power of 2 for TT UPM, with 2048 as the most common. Smaller UPM values are sometimes used for East Asian fonts to reduce the font size; larger UPM values are used for designs with very fine details. Greg Hitchcock at Microsoft reports a very tiny improvement in rasterising time when you use a power of 2, but unless you're licensing fonts to Microsoft this needn't be a concern and you can safely use 1000. <br> <br>3. An OpenType font can contain either PS CFF outlines or TT outlines, with appropriate hinting. Generally, the choice is expressed this way: if you are designing type primarily for print media, CFF outlines and hinting are easy to work with and maintain; if you are designing type that will be heavily used in low resolution media, e.g. reading on screen, then you generally want the extra precision of TT hinting. <br> <br>4. Sorry, I don't know enough about Flash to help you with this question.</p>"
