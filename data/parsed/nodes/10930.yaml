  html: <p>I recently made the jump to FontLab from Fog and have a few questions. I may be completely wrong on some of the assumptions Ive made as Im still trying to get my head around the software... <br> <br>1. FL hints PS1 and TT fonts in different ways. Should I keep a seperate FL file for each format? (I guess that FL doesnt store hinting data for PS1 and TT in the same file, but instead converts it.) <br> <br>2. I recently read that TT fonts should use 2048 UPM and PS1 fonts should use 1000 UPM. Again I suppose I should have seperate files for TT and PS versions of a font? <br> <br>3. If, sometime in the far future, we will all be publishing our typefaces as OpenType fonts should the hinting be PS1 or TT? I was always under the impression that TT is PS1s poor relation but TT hinting is much more advanced, so I guess TT is more future proof? <br> <br>4. I have a number of flash pixel fonts to publish. In the past I have published from Fog with no hinting to get the best results. How should I approach this in FL? <br> <br>Thanks for your help!</p>
