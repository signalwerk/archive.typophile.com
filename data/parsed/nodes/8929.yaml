    html: <p>I like the design a lot. The light blue looks like a potential pitfall, but it's definitely doing what you want it to. <br> <br>On the the orange side, the word balloon seems to be going the wrong way. Shouldn't it be around what Heike says? <br> <br>As for the logo, I like it, but the the word balloon looks just a bit off from the side of the square, perhaps make it parallel or more angled, so it looks less like a mistake. The balloon's stroke is automatically applied by Illustrator/freehand, right? The point at the end looks off to me, as though the stroke is too thick and deep where the two sides meet (probably from the overlap. I'd recommend drawing it as an actual shape, rather than a stroke, so you can control the finer details. <br> <br>As for the face thing, I like it, but it probably won't work that well for most people (not all of us look like Heike). But if ooni's willing to take decent photos, I think it's fun and personable. <br> <br>And, just for fun, here's a <a href="http://www.underconsideration.com/speakup/archives/002193.html#002193">not so good word balloon logo</a> (scroll down), in my opinion.</p>
