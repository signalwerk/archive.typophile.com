    html: <p>"<i>Do you mean the blue is a pitfall, when working with white type? Please expand. </i>" <br> <br>Yes. The blue looks sharp on screen, but I'm worried that whatever pantone it is will not give you what you expect on a card stock. However, I've learned the hard way that many inks go darker rather than light in printing, so... take it as you will. Also, a photocopier/fax would not be able to transmit this business card (if it's attached to a document, etc.). <br> <br>Having seen Vicente Arregui's post of ICU, perhaps that's an even better reason to veer from the blue. It's such a good idea (the general look/concept) that it's not a surprise multiple designers have hit on it.</p>
