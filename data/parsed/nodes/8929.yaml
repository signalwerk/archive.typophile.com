    html: <p>Here was a proposed print ad <br> <br><img src="http://www.typophile.com/forums/messages/29/64393.jpg" alt="maciek"> <br> <br>Elementally as discussed before, the triangular shaped element is carried through here, but upon another glance is it needed?  <br> <br>This is also a different tagline pitch with the thinks, bleeds, etc. line. <br> <br>Hrant-I was trying to have a balanced approach in terms of gender. These would be the instructors or people like them. Yes they are quite handsome and cute, but who knows if they would be this cute. <br> <br>Scott- I think you may be right about breaking into space. It seems a bit too tight as a composition and breaking some lines would not stray far from the feeling and mission. <br> <br>My teachers were never this way either. Though the thought is to have younger staff that have other interests and can incorporate that into the class. They also don't have a huge age gap either. Allows me to slightly justify the chosen colors. <br> <br>If you didn't really notice it, the german phrase is answered on the back of the card. Thus a person can look back and begin to understand the language  immediately.</p>
