    html: <p>Thanks guys for the comments. The mark could use a little more refinement. It has bothered me also, so thats why I put it up here to get some feedback. <br> <br>As for the colors, I was trying to be the complete opposite of competitors. They are dull and uninspired. This is the language school for the MtV generation. Trying to modify the methods of language acquistion, so that this is as appealing as after-school sports and other activities. Not that any of them are this bright(see Mtv reference)and it maybe a tad too extreme, but it is supposed to feel energetic and fresh. <br> <br>Do you mean the blue is a pitfall, when working with white type? Please expand. <br> <br>The pictures put faces in an organization. Potential customers aren't numbers, they're people and we want you to know we are "physically" there. <br> <br>After going through the rounds of German teachers to learn the language, the vision I have is less of a teacher and more of a friend. <br> <br>Insert other optimistic rhetoric here. Still in the post graduation phase.</p>
