    <p>Hi Typophiles!</p>
    <p>I’m currently “working” on a table for easy typeface–finding and I need some help putting it to the test. I’ve looked at different faces and set them up in my table, but I need some extreme examples (stuff that does not usually happen). So I’m asking for your help in looking for some faces that:</p>
    <p>A) Have VERY high x-ascender ratio<br>
    B) Have VERY low x-ascender ratio</p>
    <p>Just a couple of faces of each should be enough (I don’t want to steal much of your time).</p>
    <p>I’ll post the table as soon as I have something interesting to show, as it’s in its early stages.</p>
    <p>Thanks in advance!!</p>
