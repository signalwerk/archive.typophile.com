    html: <p>Very cool Mike, I suspect we almost have to ask a little more about each sample. I made a logo for Credit Suisse's 50th anniversary of doing business in the US and if I were to scan it you might be fooled by the font because the printing process we used on the promotional materals were engraving, stamping and embossing and offset printing. Each process changes the appearance of the finished work.</p>
