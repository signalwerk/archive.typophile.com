    html: <p>Dan, I agree it would be good for people to give us more information, particularly the age of the material it was scanned from. Does anyone know if the 'instructions' for this Board tells them anything like that? (Judging from the  'What is this font?' titles, I can see not many people read the instructions, but still it would be nice to have them try to help us along.) <br> <br>On the other hand, the questions are usually asked (I think) from the perspective of someone wanting a (digital) font that can look like their sample. I doubt many want to go out and invest in engraving equipment. That's why I usually take the direction of saying how I could re-create the same look, whether that's how the original was created, or not.</p>
