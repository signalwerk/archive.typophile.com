    html: <p>Mark, the reason I ask is because alot of samples lately seem to have the same response that a stroke has been placed on the type, what I'm thinking is some of the samples are pre digitalized and are hot metal stamped envelopes and the process of stamping changes the appearance of the letter width. Then add a bad scan.</p>
