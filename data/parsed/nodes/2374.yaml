    html: "<p>Mark &amp; Dan, you might be interested in this quote from an e-mail I recently received from a long-time graphic designer: <br> <br>\"Yes, old engraving companies in Washington DC still use the pantograph for <br>engraving. The process is very simple: the alpahabet was machined on heavy <br>steel plates: upper and lowercase; numbers and all the other stuff <br>(ampersands, etc.). I wrote out the copy backwards in pencil on a long <br>continuous paper tape. For each letter of each word and punctuation I would <br>trace it from the steel plate. There was a little gauge where I set the <br>leading. To find the middle of the plate I used dividers (which is the <br>reason I don't measure for anything -- I just find the middle and divide in <br>half) -- okay so while I'm tracing the letters and moving the steel plate to <br>each letter another thing, the stylus is etching the letters lightly on <br>coated steel or copper plate. There was something I used to size the letters <br>to, probably another lever. It was a contraption for sure. After the plate <br>was etched it was dropped briefly into a vat of acid. The brown stuff wash <br>away and there was a light line for the engraver to follow. So the engraver, <br>a very old man, popped the loop onto his eye, grabbed his engraving tools <br>and carved the steel or copper plate. Then the plates would go downstairs to <br>the plate stamping machine. They would strap the plate to the bottom of this <br>huge shaft that probably weighed a ton, and let it mash down on the paper. <br>Voila: engraving. These men I worked with were absolutely great titans of a <br>long lost age: skilled, patient, accurate beyond the beyond. They taught me <br>my work ethic.\" <br> <br>She also worked for years with Compugraphic film type setting equipment.  I was amazed to learn we both attended the same high school in Queens NY for at least one year at the same time (1961), so I guess that tells you neither of us is a 'Spring chicken'.</p>"
