    html: "<p>I was wondering the same thing [referring to Daniel's post]. Engraved printing can look a bit heavy compared to a digital font. The example here and also the one I identified as Serlio in another thread are shown in an engravers catalog I happen to have, and they do look more like the scans people are posting for identification. The names don't correspond with the digital fonts (Serlio = Bold Architect Roman, Sackers Roman = Light Artchitect Roman) but they are clearly the same styles. Here's a scan: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/22281.jpg\" alt=\"gravenimage\"></p>"
