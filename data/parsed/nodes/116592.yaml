      <p>Very familiar thin angular design. I thought I had it with House Industries United Sans Regular Thin <a href="http://www.houseind.com/fonts/unitedcollection" title="http://www.houseind.com/fonts/unitedcollection">http://www.houseind.com/fonts/unitedcollection</a> or Octin College Thin <a href="http://www.myfonts.com/fonts/typodermic/octin-college/" title="http://www.myfonts.com/fonts/typodermic/octin-college/">http://www.myfonts.com/fonts/typodermic/octin-college/</a> but the J does not have the upper serif shown in your image and there are a few other minor differences.<br>
      Don<br>
      Edit<br>
      After posting saw the self-solve of Foundry Gridnik.</p>
