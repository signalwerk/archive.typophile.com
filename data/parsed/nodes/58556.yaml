      <p>On a letter ’e’ in Helvetica the terminals are flat, on the Letraset ’e’ they’re at a slight angle, the same with the terminala on the letter ’a’ and ’s’. </p>
      <p>It’s the same kind of small difference you see between some letters in Arial v Helvetica, but the logo isn’t Arial (that has a far different letter ’t’)</p>
