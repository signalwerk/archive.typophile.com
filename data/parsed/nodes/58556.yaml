    date_raw: 2.Jun.2009 10.17am
    votes: null
    html: <p>I did say, “close as you can get in a digital font”. It’s quite possible that Letraset altered it somewhat when they did their “cut” of Helvetica for transfer lettering. However, they credit the source as Haas. Looking at an old Letraset catalog, the “e” in their Helvetica does have that slight tilt, whereas the “e” in the Helvetica shown in a metal foundry type catalog has it perfectly horizontal, or nearly so. While Nimbus Sans Bold D is an accurate digital version of the original Haas foundry cut, it looks like the Letraset “cut” of Helvetica may be a lost typeface.</p>
    html_clean: <p>I did say, “close as you can get in a digital font”. It’s quite possible that Letraset altered it somewhat when they did their “cut” of Helvetica for transfer lettering. However, they credit the source as Haas. Looking at an old Letraset catalog, the “e” in their Helvetica does have that slight tilt, whereas the “e” in the Helvetica shown in a metal foundry type catalog has it perfectly horizontal, or nearly so. While Nimbus Sans Bold D is an accurate digital version of the original Haas foundry cut, it looks like the Letraset “cut” of Helvetica may be a lost typeface.</p>
