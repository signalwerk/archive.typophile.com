      <p>This is the old display version of Helvetica, derived from the larger sizes of the original metal foundry type. Most digital Helveticas are descended from Linotype’s version, which was designed for 18-point and smaller (machine setting). URW’s Nimbus Sans Bold D (D=display) is about as close as you can get in a digital font.</p>
      <p><a href="http://www.urw.de/cgi-bin1/dalcgi/source/schnellsuche.htd?searchchar=nimbus+sans" title="http://www.urw.de/cgi-bin1/dalcgi/source/schnellsuche.htd?searchchar=nimbus+sans">http://www.urw.de/cgi-bin1/dalcgi/source/schnellsuche.htd?searchchar=nim...</a></p>
