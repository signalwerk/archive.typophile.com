      <p>Yep, along with belleisle advice there’s lots of ways to achieve the neon glow effect in Photoshop.</p>
      <p></p><div class="imageWrap"><img src="/files/GlowLines_4921.JPG"></div><p></p>
      <p>One real simple way is to use the Pen tool to create your shapes and on a new layer above it fill with colour and set the blending mode to Color. You could copy your shape to a new layer below it and apply to slight gauss blurr to achieve a diffused effect. In my example I just used two layers on a black bg. </p>
      <p>clauses, groovy linkage. Check out camera tossing on Flickr: <a href="http://www.flickr.com/search/?q=camera+tossing" title="http://www.flickr.com/search/?q=camera+tossing">http://www.flickr.com/search/?q=camera+tossing</a></p>
      <p>__________<br>
      Hiro</p>
