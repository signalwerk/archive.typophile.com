      <p>or if you are not a purist.</p>
      <p>Import or scan your base ’type’ design.<br>
      Needs to have a photographic background or similar to work, like in your example<br>
      Copy the ’type’ layer in Photoshop four/five+ times.<br>
      Blur each layer to different amounts, nudge them about a bit, alter the colours, impose different blends on each color dodge/screen/overlay.<br>
      Basically experiment to you find what you are looking for.</p>
