    html: |-
      <p>Well obviously this will lead to greater "MySpace-ification" of the web when it comes to pages generated or customized by amateurs, which is nothing new. Now the lameness no longer is restricted to themes and imagery, but also to type. Prior to this, type on the web was generic, which is arguably better than this (at least generic type such as Times and Verdana are legible). But the point is that designed pages and sites will be designed and non-designed pages will be non-designed. What @font-face does is allow the designed pages to look even better and even more geared towards the audience and message. I don't know why typographers are so appalled, if anything this *increases* the difference in quality between designed and undesigned pages and makes design that much more valuable.<br>
      Whining about @font-face is like whining about people being able to make hand-lettered posters (for a missing dog, or a party promotion) and stick them on poles, walls and columns in the offline world; and I've seen many typographers whine about that. </p>
      <p>Too many typographers and designers tend to want to educate the masses about graphic design, but I think that's just a sign of insecurity, because the power of graphic design works whether the audience is aware of it or not. The only people that need to know why a certain alternative or approach is better than another is your clients.<br>
      Too many designers want to "cure the visual disease", they want to make everything look good, e.g. the entire web, but the only thing you have to make look good and make it communicate the right messages is your client's graphics. </p>
      <p>Besides, suppose you're designing a social website, you can set restrictions and guidelines on what can be styled or customized in personal pages (e.g. profile page) kind of like Facebook does (unlike MySpace).</p>
