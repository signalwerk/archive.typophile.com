    html: |-
      <p>@all<br>
      I didn't read all the reviews of Gutenberg's bible when it was first published but I'm sure the font was attacked as a bad knockoff. Some monk somewhere probably sued.<br>
      Anyway, writing as a web developer, the significance of font linking goes beyond cosmetics.<br>
      Until now, web designers have faced a problem that's almost impossible for those in the print trades to even imagine: the font has been a variable rather than a constant.<br>
      I guess the closest analogy would be leaving the choice of fonts to a service bureau. "Come as close to this as you can", would be about all you could say.<br>
      In other words, so many design decisions that normally would be based on the metrics of the font have been impossible to make because, when you don't know what font is going to be used with any level of certainty, you can't make them.<br>
      An intolerable situation for sure. And one which, because of the large files sizes involved, could not even be addressed until broadband became the norm rather than the exception.<br>
      The very beginings of web typography are where we are at now. And it effects everything - layout, the need to scroll or not, everything needs to be looked at freshly.</p>
      <p>Anyway, right now, the uglier it is, the better I like it.</p>
      <p>Regards,<br>
      Rich</p>
