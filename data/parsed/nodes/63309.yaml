      <p>"lack of precision and predictability are virtues"</p>
      <p>Building with flexibility is virtue. This is the first time in human history that flexibility has even been an <em>option</em>, let alone a necessity.</p>
      <p>It's all about the end user, and designing with flexibility in mind. Because, like it or not, the end user is going to override your finely wrought design somehow. Wrong browser, wrong viewport, wrong type size, wrong whatever.</p>
      <p>I build websites precisely and predictably knowing that someone is going to not be able to see it the way I see it, and that's ok because they have different needs and circumstances than me.</p>
      <p>As to the subject of @font-face, I think it's great. But I will not rely upon it until the performance issues are handled.</p>
