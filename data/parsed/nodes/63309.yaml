      <p>@william berkson<br>
      <em>"Also at large sizes, the tracking should be tighter, and I suppose browsers don’t do that."</em></p>
      <p>On their own, browsers do what they do, depending upon the font. There is a default behavior.<br>
      Beyond that, web authors have as much control over tracking as can be gotten in any program - at least as far as screen display is concerned. (Not when the web page is printed out.)<br>
      Tracking instructions can be set at the pixel level. Cascading Style Sheets (CSS), is the "language" that browsers use to control presentation - spacing between glyphs being a part of that.<br>
      Inter-word spacing, too.<br>
      But instead of pixel units, I recommend using em units for tracking and kerning in CSS, for a variety of reasons.<br>
      One of them is that, within the font, the em unit is very finely subdivided (which, as a type designer, you know). On LCD screens, one result of this - at least in Windows with Cleartype - is that you can get the sub-pixels of the X-axis working for you, too.</p>
      <p>However, right now, web authors usually don't fuss with typography on this level.<br>
      Viewed historically, there are understandable reasons for this. While browsers have had this capability for quite some time, in a world of CRT screens where everything looked crappy anyway, it just didn't pay.<br>
      Things change. Usually for the better. It takes time for new capabilities to sink into people's heads.</p>
      <p>But then there are those who share the philosophy of DanGayle - that somehow lack of precision and predictability are virtues.<br>
      They aren't. They were just the consequences of web browsers and HTML being a young and very incomplete technology.<br>
      (I've run into this before. Many, many times.)<br>
      I don't believe this attitude will survive in the long term.</p>
      <p>ciao, rich</p>
      <p>*Occurred to me there's an example of exactly the kind of fine adjustment I'm talking about on my web site, <a href="http://readableweb.com" rel="nofollow" class="link-external">Readable Web</a>. I'm using @font-face to bring in the font for the logo type. The font/windows/browser decision about spacing between the R and e immediately following, and the W and e immediately following that, were too wide. I adjusted it - call it tracking, kerning, as you will - using CSS. I haven't checked it on a Mac but in Safari on Windows it's OK, too.</p>
