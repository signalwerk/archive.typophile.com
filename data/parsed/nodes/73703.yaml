    <p>Well obviously, I'm a designer, and I've heard about this site from boxden.com which is a forum I am active on, as well as officialpsds.com, and grahamphisher.com.</p>
    <p>This seems to be a bit different from forums I am on currently... but I'm passionate about design, and am very... VERY weak at typography, and want it to be my strong point. I asked around and I was told this was the place to start.</p>
    <p>Soooooooo.... lol</p>
