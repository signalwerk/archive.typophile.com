    <p>i am tempted to use scala as the main body text for a small magazine fashion supplement, but what would be a good sans for headlines? would verlag work with scala? or should one stick to tried and tested combinations like verlag and miller? any suggestions...?</p>
    <p>cheers</p>
    <p>Girish</p>
