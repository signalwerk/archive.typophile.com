    html: |-
      <p>Actually less fashion, more lifestyle supplement for a small politics and culture magazine. I would have wanted to try and test, but this one has to happen in a week's time - an experiment more like.<br>
      Besides, I have access to very few new typefaces. I see scala used really nicely in Theme magazine. <a href="http://www.thememagazine.com/" title="http://www.thememagazine.com/">http://www.thememagazine.com/</a>. Would have liked to use Verlag or something similar for headlines, though I am also trying combinations like Fedra Sans Display and Greta Text; Cholla for display with Fedra Text.</p>
      <p>cheers</p>
