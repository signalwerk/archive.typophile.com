    html: <p>Jos -- I think the italic lc_g is too small. Does the italic lc_l rest on the baseline or fall below? It looks like it is resting on the baseline. I think it needs to drop down. Is the italic lc_o resting on the baseline? Is the uc_O a little to narrow in the roman? <br> <br>It could be the PDF, but any shape that rests on the baseline generally needs to fall lower to compensate to visual balance. If I'm wrong, about the PDF ... I apologize.</p>
