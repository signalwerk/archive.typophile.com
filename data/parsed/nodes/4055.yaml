  html: <p>Hi Typophiles, <br> <br>When I started my font in 1994 I didn't know very much about typography. I liked the Meta (not Plus at that time) from Spiekerman and the Scala from Majoor. I was amazed by some glyph forms of both fonts. From that moment I started drawing characters and decided to create my own font. I have completed my font in 1996. (I called it Delicious after Golden Delicious, an apple name, because I've worked on a mac since 1992). Now when the OpenType font format hopefully is taking over the world, I would like to add some extra's to it (ligatures/smallcaps etc.) and maybe make some necessary changes. Any comments are welcome. Excuse me for my bad English writing, spelling and grammar and greetings from the Netherlands. <br>  <br><img src="http://www.typophile.com/forums/messages/29/32409.gif" alt=""></p>
  html_clean: <p>Hi Typophiles, <br> <br>When I started my font in 1994 I didn't know very much about typography. I liked the Meta (not Plus at that time) from Spiekerman and the Scala from Majoor. I was amazed by some glyph forms of both fonts. From that moment I started drawing characters and decided to create my own font. I have completed my font in 1996. (I called it Delicious after Golden Delicious, an apple name, because I've worked on a mac since 1992). Now when the OpenType font format hopefully is taking over the world, I would like to add some extra's to it (ligatures/smallcaps etc.) and maybe make some necessary changes. Any comments are welcome. Excuse me for my bad English writing, spelling and grammar and greetings from the Netherlands. <br>  <br><img src="http://www.typophile.com/forums/messages/29/32409.gif" alt=""></p>
