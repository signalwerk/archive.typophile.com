  html: |-
    <p>Hi, I’m relatively new to publishing and not as expert in typography as I’d like.</p>
    <p>I’m attaching a few pages from a forthcoming book, which I would love to have critiqued — please tell me how bad it looks, and what would make it better :)</p>
    <p>The book is currently set in 10.5pt Adobe Garamond (AGaramond), with initial letters of chapters in 20pt Christensen Caps.</p>
    <p>The book is an epic fantasy novel originally published in 1825.  It currently runs about 450 pages.  I’d like a font that’s easy on the eyes over a span of 450 pages, but not one that ends up swelling the book to 500+ pages.  </p>
    <p>Any help is much appreciated!</p>
    <p>— Jay</p>
