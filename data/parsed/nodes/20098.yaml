    html: |-
      <p>hmm.. i’m not sure about this but is that the original proportionate size of the book? i have issues with the grid &amp; paper size. eg. maybe a little too much white space, if both left and right sides of the book are placed together, it looks akward. </p>
      <p>typewise, adding ligatures would help. For the initials, try enlarging them, maybe up to 27.5pt, 34pt or maybe even 72 pt.</p>
      <p>my little two cents.. hope it helps and good luck.</p>
