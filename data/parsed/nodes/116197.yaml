    html: |-
      <p>To me, that's not a font rather a custom job based on a commercial one. I'd probably start with some neutral sans like <a class="freelinking external" href="http://www.myfonts.com/search/Avenir" rel="nofollow">Avenir</a> or <a class="freelinking external" href="http://www.myfonts.com/search/Futura" rel="nofollow">Futura</a>, keeping /B, /e and /s (the only letters I think that are still untouched) and customized all the rest.<br>
      Out-of-the-box alternatives: <a class="freelinking external" href="http://www.houseind.com/fonts/chalet" rel="nofollow">Chalet</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/all-round-gothic" rel="nofollow">All Round Gothic</a>, <a href="/wiki/https%3A/%252Fwww.fontshop.com/fonts/downloads/fountain/dessau_pro" class="freelinking" rel="nofollow">Dessau</a></p>
