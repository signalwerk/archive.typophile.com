    <p>Good morning - we’re designing a plaque with the E. Braun logo (see attached) and the words “Est. 1893”.  I’m 99% sure this was hand-drawn, so I’m looking for something to match roughly - the first design had an era-appropriate serif, but apparently they want a script.  Any thoughts?</p>
    <p></p><div class="imageWrap"><img src="/files/ebraun_5356.png"></div><p></p>
