    <p>Background information: This is from National Geographic’s Jan. 1929 issue, from an article that covers the adoption of the Latin alphabet in Turkey. </p>
    <p>At the time, these posters were distributed widely, posted in shop windows and on the streets so everyone would grow accustomed to and learn the ’new letters’ quickly.</p>
    <p>I’ve searched most online sources but couldn’t identify them (neither the serif nor the script). I guess a human element is needed here. I’ll be so happy to hear any suggestions. Thanks a lot in advance.<br>
    </p><div class="imageWrap"><img src="/files/yeniABC_6491.jpg"></div><p></p>
