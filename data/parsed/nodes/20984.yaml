      <p>those Puma (?) shirts with that all-lowercase font are horrible, and with every other team using them it just makes it all the worse.</p>
      <p>Sweden's is a daring choice, but it doesn't fit at all and it's barely legible. no idea what Stephen is talking about it being stuck in the 70s though.. that font looks pretty futuristic to me, and not in a 70s type of futuristic way either.</p>
      <p>call me a traditionalist, but i like Mexico. Mexico and football seems to equal triline/biline fonts (just look at the art for when they hosted the tournament). classy and retro-cool.</p>
