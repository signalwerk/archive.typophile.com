    <p>Hi everyone, this is not a commercial release but I just finished my website where you can have a look at the typefaces I drew this year (Ororo, Mixo, Facio, Pandoro, Goldino, Futuro).</p>
    <p><a class="freelinking external" href="http://matthieucannavo.fr/" rel="nofollow">http://matthieucannavo.fr/</a></p>
    <p>Below are some samples but you can find a lot more on the website.<br>
