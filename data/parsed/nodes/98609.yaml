    html: |-
      <p>I don’t think there is any alignment information in the font which is directly useful.<br>
      However, you may be able to calculate how much of a baseline shift is required for each letter, and program that into the web site.<br>
      Alternatively, use a lining typeface—either all caps or unicase.<br>
      Here are a couple of mine:<br>
      <a href="http://www.myfonts.com/fonts/shinn/panoptica/" rel="nofollow">Panoptica</a><br>
      <a href="http://www.myfonts.com/fonts/shinn/parity/" rel="nofollow">Parity</a></p>
