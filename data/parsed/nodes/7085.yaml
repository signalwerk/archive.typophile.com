    html: <p>i feel there is some sort of 'hurry up and slow down' effect happening in some of these letters. almost like my eyes don't know which direction to move. (the best example i can see from what you provided is the e and r combo in over) the lc 'o' also pushes me off the line i'm looking at. i'm doubting the characters are kerned but that may have something to do with the feeling of unsteadiness and random direction. i find my eyes wandering when the letters are far apart and close together. BUT, i feel a lot of energy and rigidity in what i am seeing. like my eye is kinda riding down a bumpy road and feeling all the irregularities. i think the uc A is a little small...width and height....i couldnt get the pdf to work real great for some reason. i'm sure it's just my outdated version of acrobat, but i really like the irregularity and imperfect forms in their own way. i'd say if you could bottle it and make it work as a uniform characteristic you have something interesting and a little off-center. i sorta feel in the current state it's so-so for readable type but alot of the problems are easily solved, i'm sure. take care <br> <br>will</p>
