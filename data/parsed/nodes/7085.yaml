    html: <p>I think the lowecase is quite ok, despite some details (the 'a', the exaggerated 'x', the bowl of 'g' is too big and the connection between the bowls is weak) that can be improved. <br> <br>But looking at the other characters, I think you need to impose some consistency to your glyphs. Irregularity can certainly help legibility in text, but you need balance.</p>
