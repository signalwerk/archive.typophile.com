    <p><a class="freelinking external" href="http://xkcd.com/993/" rel="nofollow">http://xkcd.com/993/</a></p>
    <p>I have a question for typophiles: when you see this cartoon, do you place yourself in the cartoon world? Does your brain translate the hand-drawn words with a modern typeface? If so, I'd say your brain is justified, because the context of the whole piece seems to translate a wide range of typefaces into cartoon script. </p>
    <p>But I'm wondering if there are brains out there that work a little differently, and instead interpret the new branding as "from now on, every product will be branded with hand-written letters that look like a child drew them."</p>
  html_clean: |-
