    html: <p>I've often had this thought myself. It would be fantastic to do a line of products with just the basic name of the product printed in black in Times Roman on a white paper bag or box or can. They would look very suspicious, but certainly eye-catching. Imagine one in the kids' cereal aisle, amidst all the cartoony packages. This is, in fact, an extreme example of the approach taken by healthfood/organic cereals to differentiate themselves from the typical junky cereals.</p>
