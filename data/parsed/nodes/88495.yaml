      <p>The <em>President’s Choice</em> brand (that name wouldn’t fly in the US!) is a Loblaw’s (Canada) house brand.<br>
      With close cropped product shots on a white package, and plain all-cap sans type, it has a minimalist look, but not generic or cheap. The discreet logo, the small size of the type and the nice art direction (photographed on white with vignetted shadow) give it sophistication.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/pc-appetizers_5133.jpg"></div><p></p>
      <p>Loblaws still carries the <em>no name</em> brand, so the contrast between all lower case and all caps serves to differentiate the brands, as does the choice of colour, which comes into play much more in this kind of pared-down layout. </p>
      <p>There is also the<em> Blue Menu</em> house brand:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Presidents-Choice-Thin-Bagels-300x300_6429.jpg"></div><p></p>
      <p>Would be even simpler without bilingualism.</p>
      <p>(Note that there is no typographic styling to help shoppers tell the languages apart :-)</p>
