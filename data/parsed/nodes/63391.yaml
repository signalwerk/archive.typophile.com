    <div class="info">Submitted by <a href="/user/3095" title="View user profile.">billdavis</a> : 22.Oct.2009 2.35pm </div>
      <p>Ascender Corporation, a leading provider of advanced font products, announced today a license agreement with ParaType Inc. to distribute its extensive collection of Cyrillic and multilingual fonts. </p>
    <p></p><div class="imageWrap"><img src="/files/paratype-01_5360.jpg"></div><p></p>
    <p>ParaType Inc. was established in California in 1998 as a successor of the Type department of ParaGraph International in Moscow, Russia. ParaType is directed by Emil Yakupov, who leads their multilingual type development efforts.</p>
    <p>The ParaType fonts add to Ascender’s extensive collection of high quality multilingual fonts. The ParaType library includes original and historic fonts developed by the ParaType type design team and popular typefaces licensed from a variety of foundries including ITC and Bitstream. ParaType has enhanced many of these popular fonts with Cyrillic and multilingual character sets.</p>
    <p>The ParaType fonts are available in TrueType and OpenType formats for purchase and immediate download from the <a href="http://www.AscenderFonts.com" title="www.AscenderFonts.com">www.AscenderFonts.com</a> website. In addition Ascender is licensing the ParaType font library to software developers, hardware manufacturers and digital content developers. </p>
    <p>For more information visit the AscenderFonts.com website: <a class="freelinking-external" href="http://www.AscenderFonts.com/foundry/paratype/">www.AscenderFonts.com</a></p>
    <p>About Ascender<br>
    Ascender Corporation is a leading provider of advanced font products. Ascender’s founders are font industry experts and have been involved in developing many of the most important and influential fonts used in computers, mobile devices, consumer electronics and software products. Ascender provides multilingual, custom font development for a wide range of customers including creative professionals, enterprises, software developers and hardware manufacturers. Ascender also provides an extensive collection of TrueType &amp; OpenType fonts for download to graphic designers and consumers through its font websites, including <a class="freelinking-external" href="http://www.AscenderFonts.com">www.AscenderFonts.com</a>.</p>
    <p>Contact:  Bill Davis, Vice President<br>
    Ascender Corporation<br>
    25 Northwest Point Blvd, Suite 225 Elk Grove Village, IL 60007 USA<br>
    Phone: (847) 357 0730<br>
    Fax: (847) 357 0731<br>
    Web: <a class="freelinking-external" href="http://www.ascendercorp.com">http://www.ascendercorp.com</a></p>
