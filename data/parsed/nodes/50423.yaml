  html: |-
    <p>Is it possible through Opentype programming to have 3 or more types of character sets in a single Opentype font (even if these character sets not supported by any Unicode page)?</p>
    <p>Could anyone tell me if it is possible (theoretically or actually) through Opentype programming to have access in Indesign to 3 or more types of character sets such as:</p>
    <p>1. TypefaceNameContemporaryStyle<br>
    2. TypefaceNameOldStyle<br>
    3. TypefaceNameArchaicStyle</p>
    <p>And all the above to be included in a single Opentype font (without resolving to alternates and such) ? Is it possible and if it is, how could it be done?</p>
