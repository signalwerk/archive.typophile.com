    html: |-
      <p>Yes, you can do it, but not quite the way you describe. The best way to implement such a scheme would be by using Stylistic Sets 0 through 20. The downside of this is that you can’t give the sets names, and support is fairly limited. At present, the only apps I know of that support Stylistic Sets are Adobe InDesign and Mac OS X Cocoa-based apps. </p>
      <p>However, unless you foresee the three different styles as likely being used together in the same word (i.e., with the three styles kerning with each other), you would be better off making them separate fonts.</p>
