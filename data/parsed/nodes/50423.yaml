      <p>Thank you jasonc, could you please let me know where I could find more about the TrueType Collection Files (ttc). Are they supported by Indesign?</p>
      <p>the TTC file is just a single file that functions as multiple truetype files. In fact the user will see all components of the TTC as if they were separately installed fonts. But, that’s a limitation, they’re going to have to switch between styles just as if they were separate fonts.<br>
      For that reason, I don’t think this will help you much. </p>
      <p>If you don’t mind reading spcs, there’s info about it about 1/2way down this page:<br>
      <a class="freelinking-external" href="http://www.microsoft.com/typography/otspec/otff.htm">http://www.microsoft.com/typography/otspec/otff.htm</a></p>
