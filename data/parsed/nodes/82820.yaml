    html: <p>Some words are just very difficult to make into an ambigram.  If you are set on the idea, I would start with a lot of sketching, and work out some ideas of how each letter will transform into the other, and what style will both enable readability and communicate the right brand themes.  What you have now feels very rigid and is almost entirely unreadable.  Have you explored something more script based?  And maybe try a reflected ambigram rather than a rotational one?  Hope that helps!</p>
