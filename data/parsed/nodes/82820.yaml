    <p>i am currently designing a logo/ID for myself. i already have a base of a logo under a different name but i wanted to try something insorporating my name. </p>
    <p>i have been trying for weeks to create a ambigram piece that i like, but have not yet come up with something i have grown fond of. i have experimented with different fonts but all i seem to be doing is creating more things that im not too keen on.</p>
    <p>i was hoping someone could help me to create something that is fluid and easy to work out, yet still have a sense of modern design. i am willing to use and fonts/styles.</p>
    <p>i'll start with a blue peter moment, here is one i made earlier:</p>
    <p>ps. the name i am using is LOWE.</p>
