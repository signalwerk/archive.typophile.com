      <p>Well, fortunately none of that is true, of course. Most graphic designers want to make graphic design, <em>period</em>. If you are provoked by those who balance between art and design, well, they do it because they can. If a brand or an art institution pay them to gather friends to perform a relational esthetic piece, what will differ in the arts/design department is not what actually goes on but on who's paying and how it is referred to. Context.<br>
      Design needs to work. Art doesn't need such limitations. That's not to say the artist avoids certain limitations. And typography won't help you (see <a class="freelinking external" href="http://en.wikipedia.org/wiki/Lawrence_Weiner" rel="nofollow">Lawrence Weiner</a>, <a class="freelinking external" href="http://en.wikipedia.org/wiki/Jenny_Holzer" rel="nofollow">Jenny Holzer</a>, <a href="/wiki/lhttp%3A/%252Fwww.barbarakruger.com/" class="freelinking" rel="nofollow">Barbara Kruger</a>.) In the end what matters is context and purpose.</p>
