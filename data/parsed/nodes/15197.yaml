      <p>&gt; <em>It isn’t all today’s designers who are at fault, it is the whole business, clients and all</em></p>
      <p>Yes, that's very true, Chris. It is the nature of the beast now to have as little time and as few people involved in getting a project out today. </p>
      <p>It is also the current nature of the business world whose attention span goes no further than a few bulleted slides in PowerPoint.</p>
      <p>For a period of time I was very lucky having a very unique position of Creative Director at Agfa/Compugraphic' s Type Division. My principle task was to make all type output on all ads and collateral rival the quality of any manufacturer of typesetting equipment.  If the type didn't look good, then it was impossible to sell typesetting equipment to the high-end type houses.</p>
      <p>With millions of dollars of equipment and type sales on the line, I had the power NOT to go to print unless the type and typography looked its best. Not all work got the same amount of attention, but every piece of literature that went out was up for criticism by the typographers and type directors around the world.</p>
      <p>I don't yearn for the "good ol days" but I'm sad to see an era of professional craftsmanship fade into the past.</p>
