      <p>Graphic Design is more aptly called visual communication design. The point is visual problem solving of the client's communication issue. To me, anyone who uses art skills to arrange things to look nice on a page is not a designer, they are a "Layout Artist". Anyone who just is doing work to please themselves and not solve a clients problem, is just a prima donna Bull S**t artist. Typography, illustration, photography, communication strategy, symbol development, etc. are skills required by graphic designers.  There is no certification in the field so anyone with a computer and CS Suite can call themselves a graphic designer (or a typographer).  The proof is in the pudding. Hrant over-generalizes by unfairly putting his "Artiste" label on all designers. There certainly are some out there that deserve that label but there are many who don't.  This is true of many professions of course. Design is completely unregulated and good designers take the heat for what the bad ones have done. Regulation would not help any either so the buyer must beware. In the mean time, instead of beating up on designers whom you don't even know, perhaps just looking at portfolios, interviews, and recommendations will help sort the wheat from the chaff.<br>
      ChrisL</p>
