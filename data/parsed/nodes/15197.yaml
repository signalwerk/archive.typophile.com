      <p>A useful analogy on art vs graphic design might be background music in a movie, vs a popular song. Writing background music is a servant art: it must serve the story and drama of the movie. This doesn't make it less challenging or important. Famous screenwriter William Goldman said that music is one of the 5 things that are make-or-break for a movie being good. But the success of it as 'underscoring' will be judged by how well it enhances the movies. In the case of the song, it has its own story, and is judged on its own, not by how well it serves something else. </p>
      <p>Graphic design is largely a servant art also. It has to serve the publisher and author, or the building or signage it is on. </p>
      <p>And just as with movies, part of it may succeed judged independently from its original context. But that's generally not the point of it. </p>
      <p>&gt;leave craft to the thinkers</p>
      <p>No leave craft to the craftsmen.<br>
      And the best craftsmen have both thoughtfulness and artistry. </p>
      <p>[By "craftsmen", I include the women designers as well, of course.]</p>
