      <p>What I was trying to say is that the 'client' argument falls totally short of a working distinction between Designer and Artist. Artists have always had clients, and most often briefs and deadlines. Problems to address and solve, economical and spatial considerations to take into account.</p>
      <p>It's the market you are working on, the discourse you are addressing, the institution that founds your creative exploration, that 'defines' you as 'artist' or 'designer'.</p>
      <p>To be an artist does not equal creation in isolation. You can do that for a hobby, a way to meditate, or for sublimation. But that doesn't mean you are an 'artist'. Just as writing letters doesn't make you a calligrapher.<br>
