      <p>Some really good points made there. When d says "nobody ever thinks something is done," that's accurate on one hand, but the reverse is also true: many people think something is done immediately, because they're looking at a digital rough instead of a tissue or marker comp. "Looks good to me!" "... But I haven't worked out the kerning or lea..." "Looks good to me!"</p>
      <p>I'll join in and say I don't really miss the old days. Technological advances have allowed for more freedom -- typographically and creatively -- than we ever had before, but it has come at a price. </p>
      <p>Typographic excellence becoming extinct? I don't think so. At least I hope not. I believe there are still many people who strive for excellence in type, design, and all the other aspects of the field. The hardest part is getting the client to recognize and expect excellence.<br>
      I was bidding on a logo design job for a fairly large midwestern company, and when I quoted my price, the director coughed and said (this is absolutely true), "What?! My nephew has a computer. I can get him to design the logo for $50." What do you say to that? If the client has no idea of the difference, no amount of convincing by a designer is going to enlighten him. We do the work and fight the good fight where we can.</p>
