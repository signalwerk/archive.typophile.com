      <p>Back to topic --<br>
      <em><strong>Graphic Designer vs Typographer</strong><br>
      If a graphic designer should arrange type well, as well, what is the difference between a graphic designer and typographer.</em></p>
      <p>Last thoughts before I go to bed --<br>
      The problem is in the construction of the question.<br>
      The graphic designer must incorporate (not necessarily create) ALL individual elements that comprise a project into an integrated piece (ad, brochure, package, etc.).</p>
      <p>Those individual elements can be block text, headlines, illustrations, graphics (graphs, diagrams, etc.), photos, and so on.</p>
      <p>Currently photographers, illustrators, copywriters, layout artists, art directors, graphics designers, graphic artists, pre-press/production artists, retouchers (digital), lettering artists, cartoonists, and type designers are still contracted or employed in the graphic arts. Who contracts a typographer for a project anymore?</p>
      <p>On highly professional projects:<br>
      When you need photography done you get a photographer.<br>
      When you need copywriting done you get a copywriter.<br>
      When you need custom type or special heads done you get a type designer or lettering artist.<br>
      When you need pre-press files done you get a production artist.<br>
      OR you get a talented and skilled graphic designer to do all of it.</p>
      <p>All of the above are still professions with real people you would call.<br>
      Typography is no longer a profession and typographers have no listings in the Yellow Pages:</p>
      <p><em>Search results for Typography from Verizon SuperPages</em><br>
      Matching Categories ~ 6 listings in 3 categories  (More Info)<br>
      All categories related to "typography" in New York NY<br>
      <strong>Media &amp; Communications</strong><br>
      Printing Services (1)<br>
      <strong>Arts &amp; Entertainment</strong><br>
      Visual Arts<br>
      Commercial &amp; Graphic Arts (3)<br>
      Commercial &amp; Graphic Artists (2) </p>
      <p>Ladies and gentlemen, boys and girls, this is NEW YORK CITY we're searching. </p>
      <p>So what's the difference between a graphic designer and a typographer?<br>
      Answer: you can't find typographers in the phone book.<br>
      TYPOGRAPHY IS NO LONGER A PROFESSION! Get it? Get over it!</p>
