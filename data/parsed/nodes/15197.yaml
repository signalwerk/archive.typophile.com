      <p>It is all about speed now (and last second changes). Projects took longer in that era.  There was no instant gratification of seeing how something would work right before your eyes but there was time between phases of a job.  You had to wait for galleys to come in and be proofed by the client.  You had to wait for corrections to come back. Delivery was not instantaneous as it is now.  This time allowed for a step back (and work on other jobs) and made planning ahead a real necessity.  Spec-ing type took time but if you screwed it up, it was an AA on you and you had less time to do the job.  Now, nobody ever thinks something is done.  You can putz and change right up until press time.  Sure, it was a pain to do all that handwork but people (clients) let go of a job sooner because it cost a fortune to make changes and took too long for the deadline to be met.<br>
      I don't know about Norbert, but I wouldn't go back to it.  There was good work done then which is easy to remember.  There was crap too which we all try to forget.</p>
      <p>I had some great typesetter to work with and found some bad ones too.  Like Norbert says, you dumped them quick.</p>
      <p>There may be a difference between the U.S. and Europe regarding typographers.  In Europe, a typographer was a designer who used type as well as being a typesetter.  In the U.S., the Art Directors and Designers spec-d type and typographers followed their specs (making great improvements which many art directors never noticed).  I was teaching at Ohio State when Will Kunz was there teaching as well.  I would consider him to be a typographic designer in the European mould I mentioned. He was an ultimate craftsman and typographic designer but would not call himself a graphic designer.  I think that was a European thing.  Here, it was different.  Typographers rarely got that kind of freedom here in the U.S.--it was an art director's world with the stroke of a marker pencil on tissue overlays.<br>
      It isn't all today's designers who are at fault, it is the whole business, clients and all (armed with cell phones and Blackberries).</p>
      <p>ChrisL</p>
