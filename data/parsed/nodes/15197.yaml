      <p>Basically we are stuck with "left over" terminology for professions whose lines have blurred (and in some instances, become obsolete).</p>
      <p>"Graphic Arts" pertain to items produced by or involving such reproductive methods as those of engraving, etching, lithography, photography, serigraphy, woodcut, silkscreen, etc., and/or relating to the art of printing in the broadest sense, incorporating both fine and commercial art.</p>
      <p>"Commercial Artist" is a lost term which was meant to differentiate between "fine artists" (individuals who produced ojects of no value but to itself) and individuals who produced illustrations, designs, adverts, etc. for strictly commercial purposes.</p>
      <p>Somehow "graphic artists" started appearing on the scene during the sixties and were a little higher in the food chain than "commercial artists" but not as revered as "Graphic Designers." (You can look at old classified ads and college program descriptions to note the genesis.)</p>
      <p>Meanwhile, printers were always printers, and more often than not apprenticed descendants of the "guild." Typesetters, typographers, pressman, composers, makeup, proofreaders were all participants of the same trade: PRINTING.</p>
      <p>Type designers and punchcutters WERE the professional equivalents to fine jewelry designers and diamond cutters, rarefied and highly skilled, since it typically cost foundries hundreds of thousands $ to produce and distribute a new hot metal typeface.</p>
      <p>Once photo offset lithography and phototype came into their own, the traditional print trades got skewed (screwed?). Typesetters now worked for type houses (commercial typesetting) and typographers started working in either ad/design agencies, type houses or publishers.</p>
      <p>Buying galleys of phototypeset copy was an expensive proposition, so generally, type was "spec-ed" by trained individuals. Since so many professionals used to be quite sophisticated in type knowlege, the trade knew Sh*t from Shinola. Everyone had their purpose under the sun.</p>
      <p>With the technological explosion of the last twenty years the medical profession (from doctors to technicians) has become highly differentiated into fields of expetise, but somehow the "Graphic Arts" workforce had a meltdown.</p>
      <p>Basically, business graphic programs began to corrupt the gene pool, and production teams were swept out with "Desktop Publishing."</p>
      <p>If you don't know (and I mean TRULY KNOW) typography, then how the hell can you even fathom the beauty and complexity of type designs.</p>
      <p>But you know what, somehow music still seems to survive and delightfully surprise from time to time. I guess we have to be content that there may be a dozen or so people out there who can truly understand what you do.</p>
      <p>p.s.&gt; I'm tired of definitions... I'd rather just see good work produced.</p>
      <p>OK, end of rant.</p>
