      <p>Dinosaur Kristin reporting for duty!</p>
      <p>I am a real-live typographer. I am paid to create beautiful type for advertising. I don't deal with art, photos or other such "fine art" nonsense (kidding). I concentrate on the type alone. I take what I've learned from 34 years in the craft to create a typographic product that stands above the rest.</p>
      <p>We actually have had up to seven full-time typographers here but are down to a mere four at present. We used to have time to create fonts and/or alter existing fonts. With the cutbacks, we now hire outside vendors (thank you, Mark Simonson!) to do our font creation so that we can concentrate on producing beautifully crafted type.</p>
      <p>This subject is near and dear to my heart, obviously. I wish there was an easy way to communicate our craft to students and graphic designers in general. I look to fellow craftspeople, such as Ilene Strizver at [[http://www.thetypestudio.com/]The Type Studio], who are making great efforts to pass on our traditions.</p>
      <p>Of the 100 or so typesetters I have known over the years, only a few are still crafting type for a living.</p>
      <p>Kristin</p>
