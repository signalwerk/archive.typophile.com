      <p>I have been searching for information on legibility testing, grading, and standards for printed material.   You folks are keen on good design.  Some of you may know where I should be looking.  If you do, please read on and e-mail me at <a href="mailto:gfmueden@verizon.net">gfmueden@verizon.net</a></p>
      <p>My old eyes were offended by chairmen's letters that had been gussied up more as monuments to the designers ego than to help convey the message. So this is an effort to find, or if necessary create, legibility standards and ways of testing and rating the legibility of printed matter. My search has found but two standards: for material State sends to the President and for labeling the aircraft wiring. </p>
      <p>My Internet search first produced little but how to produce good legibility. This has been covered extensively in college psychology departments and Lighthouse International, APHB, etc., and is not what I am after; I want to know the legibility of the finished product, (1) what proportion of the reading population can read it without difficulty, (2) where it stands on a legibility scale. If no such scale exists, I will try and create one.   I have been given, by low vision professionals, scholarly reasons for abandonning this effort, but I feel that even an imperfect scale would be better than none.    It is as if they feel that I am trying to rain on their parade, "not invented here".</p>
      <p>Actually some work is being done in the education field under the title of Universal Design, having tests printed legibly, but, so far as I know, it has not had widespread introduction.</p>
      <p>===gm===</p>
