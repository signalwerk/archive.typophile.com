    <p>The Ultimate Deathmatch...</p>
    <p>No. I've been confused lately, among the confusion with certain people about typographer vs. type designer. </p>
    <p>What I've gathered is a <a href="/wiki/Type%20Designer" class="freelinking" rel="nofollow">Type Designer</a> is one who designs type, while a <a href="/wiki/typographer" class="freelinking" rel="nofollow">typographer</a> is one who arranges type. Now. If a <a href="/wiki/graphic%20designer" class="freelinking" rel="nofollow">graphic designer</a> should arrange type well, as well, what is the difference between a graphic designer and typographer.</p>
    <p>Thankyouverymuch</p>
    <p>Eric</p>
  html_clean: |-
