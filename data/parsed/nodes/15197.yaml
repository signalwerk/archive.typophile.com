      <p>Interesting question.</p>
      <p>Both typographers and graphic designers must be able to use composition and space for any given shape, folio or bottle. I think they cross-over too often to separate them and would like to think that most people would rather be able to have all the tools necessary to answer their clients needs.</p>
      <p><em>"Without typography, graphic design is merely fine art."</em> -- I wonder if there is a little something missing from your, Kyle, initial quotable catchphrase. I, personally, refuse to think of graphic design as fine art. Fine art implies the wrong sort of thing. It implies a world lacking any sort of balance as the customer opinion only occurs after the piece is completed, because the customer is buying what the artist has created. Designers on the other hand always has -- whether we want it or not -- the clients opinion to act as a sort of guide. Artists are self-guided. We, designers, are guided by our clients' needs.</p>
      <p>I always say, "Without typography, graphic design is merely superficial decoration." I suppose it is because decoration, for me, implies that a client is still involved.</p>
