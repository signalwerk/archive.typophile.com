      <p>I don't think any of us working now can shoulder the blame for the current state in the field. I would like to think that there will always be good design to come. It is easy to look back at past times and see the good examples that remain to represent the time. The crap ends up wrapping the garbage and is never seen again. There was plenty of real crap in the 50s and 60s too, just like today. All we can do as individual designers/typographers (insert your label of choice here) is do the best work we can in our own small worlds and let the future generations decide what was good. I don't really care what critics think of my work. I care about my clients and their audiences but I am my own toughest critic.<br>
      There is a potential for a future in our field but it can only be realized with our own sweat and fortitude. Just keep working, the future isn't written by projection.  It is written by people actually doing in the ever-moving present.</p>
      <p>ChrisL</p>
