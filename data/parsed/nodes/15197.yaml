      <p>Up until the demise of phototypesetting companies before the turn of the century (yes, we are in the 21st century), typographers and type directors were the sentinels of quality typography.</p>
      <p>All of the top phototypesetting houses had one or more typographers reviewing, marking up and refining output for key clients. A type house's reputation was based on the consistency of quality typesetting. </p>
      <p>Art directors, creative directors, graphic designers would do general type specing, but the tiny nitty-gritty stuff was the typographers' responsibilities. Type houses would lose clients if the quality wasn't consistently top notch, and typographers could lose their job if they were not up to standards.</p>
      <p>Now the type houses are gone and the type sentinels with them, placing the entire burden on the designers, who are generally too maxed out to go that last 10% . It's a problematic situation that is mostly resolved by lowering the bar.</p>
