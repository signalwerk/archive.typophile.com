    <p></p><div class="imageWrap"><img src="http://typophile.com/files/focus_5234.jpg"></div><p></p>
    <p>This is taking me forever to ID. It seemed like a ITC Caslon 224 Black Italic but the drops of the "f" and "s" are more "Caslon Graphique or Caslon Black" flavored that don't have italics or even Thorowgood EF. Anyone knows this? I need it to rebuilt a logo.</p>
    <p>Thanks!<br>
    adriano</p>
