      <p>I’m not quite sure if I understand what you hope to gain from the classification. Do you wish to sort the typefaces you have licensed according to suitable use?</p>
      <p>Is there even a clear definition of neo grotesque? (I tend to think of them as normalised grotesques – as opposed to the “funky” execution of for example Maple) If anything, they should sort <em>under</em>, and not next to, grotesques.</p>
