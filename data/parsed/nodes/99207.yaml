    html: |-
      <p>@hrant... very useful leads... if I can reduce this down to a root observation: the task is partially about "classification" and partially about "utility" ?  Meaning, book publishing tends to lean more toward the serifs, but there is a "feel" to publishing in Minion or Arno or even Bodoni (for, say, a Jane Ayre novel) which might not be appropriate for publishing a newspaper (say, Greta or Periodico), or for business reports (say, Kepler or FF More Pro)...<br>
      I once saw Orwell's 1984 published using Franklin Gothic which was, I thought, fitting for the stark subject matter...</p>
      <p>Anyway... the journey continues...</p>
      <p>Thanks...</p>
