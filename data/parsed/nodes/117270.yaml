    html: |-
      <p>Sorry, it sounds probably helpless and lazy but to me, this logotype has nothing really distinctive. You could re-do the same starting with any standard/neutral/basic sans of your choice, simply editing it a bit. The only thing you need to keep in mind is /k design. You could start from <a class="freelinking external" href="http://www.myfonts.com/search/helvetica+neue" rel="nofollow">Helvetica Neue</a> to <a class="freelinking external" href="http://www.myfonts.com/search/myriad" rel="nofollow">Myriad</a>, <a class="freelinking external" href="http://www.myfonts.com/search/trebuchet" rel="nofollow">Trebuchet</a> or <a class="freelinking external" href="http://www.myfonts.com/search/arial" rel="nofollow">Arial</a>...<br>
      My choice here, Trebuchet Bold, 15 min reworked<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_4691.png"></div><p></p>
