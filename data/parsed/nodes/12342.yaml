  html: |-
    <p>Hi typophilers,</p>
    <p>This is a message for the older typophilers. I haven't been around for a while, but I'm back. And as I'm evolving in my life I felt I needed a new screenname. I'm currently rounding up my own website (<a href="http://www.characters.nl" title="http://www.characters.nl">http://www.characters.nl</a>) so I've decided to change my name into 'Characters', so that it fits to what I'm about right now.</p>
    <p>So in some time Luciddream will be gone and I will be know as Characters. Just that you know who is talking...</p>
    <p>®ené</p>
