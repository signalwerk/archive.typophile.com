    html: |-
      <blockquote><p>
      is there an .ttf or .otf file which can be downloaded to reproduce the same on my PC?
      </p></blockquote>
      <p>Not that I know of. The LaTeX package <code>skt.sty</code> uses Type 1 PostScript fonts.</p>
      <pre>skt8.pfb     PS Type 1 font file for skt font at 8pt upright.
      skt9.pfb     PS Type 1 font file for skt font at 9pt upright.
      skt10.pfb    PS Type 1 font file for skt font at 10pt upright.
      sktb10.pfb   PS Type 1 font file for skt font at 10pt upright bold.
      sktf10.pfb   PS Type 1 font file for skt font at 10pt upright feint.
      skts10.pfb   PS Type 1 font file for skt font at 10pt slanted.
      sktbs10.pfb  PS Type 1 font file for skt font at 10pt bold slanted.
      sktfs10.pfb  PS Type 1 font file for skt font at 10pt feint slanted.
      </pre><p>(the list above is a copy-paste from the <a href="http://mirror.its.dal.ca/ctan/fonts/ps-type1/sanskrit/README" rel="nofollow">README</a> file).</p>
      <p>For instance the file <code>skt10.pfb</code>, Wikner Sanskrit 10pt Upright, contains 222 glyphs that, put together, can give a nice looking pdf output. To put those 222 pieces together in order to produce a final Sanskrit text from an ASCII input file, a preprocessor whose source is contained in the file <code>skt.c</code> (coming with the texlive 2012 distribution) needs to be used.</p>
