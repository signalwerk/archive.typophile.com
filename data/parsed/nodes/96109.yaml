      <p>Michel, your work is close to that of Ulrich and it's interesting. Based on his findings I collected <a href="/wiki/https%3A/%252Fwww.dropbox.com/s/0k3uuodvksltjxq/Stiehl2007-color.pdf" class="freelinking" rel="nofollow">https://www.dropbox.com/s/0k3uuodvksltjxq/Stiehl2007-color.pdf</a><br>
      For some ligatures like sla with Siddhanta you show 2 variants, but visually I can't find a difference. What do you mean by them? Or there was a difference in the books you quote, but none in Mihas font?<br>
      How did you tel TeX to show different ligatures of the same sounds? I'm not familiar with Unix-like Nagari fonts, is there an .ttf or .otf file which can be downloaded to reproduce the same on my PC? .pdf is good for looking, but bad for working with it further. I'm working on compiling a list for a Sanskrit Reader. I made a concordance based on 14 Sanskrit Grammar's and it shows more than 1046 yours and more than 807 Ulrich's. As Ulrich's algorithm is not open source, one will have to do it once again, to check his words.</p>
