      <p>The file above is part of the  documentation that comes with the <a href="http://www.ctan.org/tex-archive/language/sanskrit/ps-type1" rel="nofollow">LaTeX Sanskrit</a> package. For the full documentation, see the file <a href="http://ctan.mirror.rafal.ca/fonts/ps-type1/sanskrit/sktdoc.pdf" rel="nofollow">sktdoc.pdf</a> of the link above that should answer your questions.</p>
      <p>That table had been referred to by John Hudson <a href="http://typophile.com/node/95460#comment-521153" rel="nofollow">4 Sep 2012 — 6:45pm</a> in the thread <a href="http://typophile.com/node/95460" rel="nofollow">Adobe Devanagari Font</a> that Uli Stiehl had started in Aug 2012. I should have added a back reference, <a href="http://www.typophile.com/node/95460?page=1?from=0&amp;comments_per_page=50#comment-521244" rel="nofollow">http://www.typophile.com/node/95460?page=1#comment-521244</a> to provide the context. The table was put here for technical reasons.</p>
      <p>*Edited the back link to add the page number for it to work.</p>
