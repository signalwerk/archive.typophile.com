      <p>Stephen:<br>
      This has been discussed numerous times. The EULA offered by the vendor to the buyer is the EULA that the buyer agrees to: if you enter into an agreement with Adobe, it's Adobe's terms you've agreed to, not Linotype's. </p>
      <p>That's a major reason to buy from Adobe: they often have better terms than the original foundry.  Take MVB Celestia™ Antiqua: license it from Adobe, and you can embed it for print and preview (see <a href="http://www.adobe.com/type/browser/legal/embeddingeula.html" rel="nofollow">this list</a>); get it from MVB themselves, and "if you have purchased a Basic License, you may distribute a PDF containing the subset-embedded Font Software to not more than five (5) computers at your one geographical location." See more <a href="http://www.mvbfonts.com/html/info/contents/eula.htm" rel="nofollow">here.</a></p>
      <p>Major players like Adobe and Microsoft manage to negotiate more favourable terms for their clients: that's why you can find editable embedding versions of fonts in Microsoft products that, if purchased from another vendor might not allow _any_ embedding. That's how Simon Daniels explained it to me.</p>
      <p>See <a href="http://www.adobeforums.com/cgi-bin/webx?14@@.3bc319b0/0" rel="nofollow">this </a> very recent thread on Adobe's forums.</p>
      <p>And, unless the EULA has a clause saying that the agreement is subject to future unilateral alterations (and, sadly, such EULAs _do_ exist!), the agreement you made when the money changed hands is the agreement you have.</p>
      <p>It pays to shop EULAs!</p>
      <p>Now can you modify Adobe's Helvetica? Well, that's one for the lawyers! Maybe it is easier to go with one of your alternates.</p>
