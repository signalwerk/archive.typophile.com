    <p>I just modified an Adobe font for a client for their in-house use. But then they asked me to work on two weights of Helvetica. Of course I said I think that's not allowed &amp; sure enough that's right. So then I asked my fine pals at FontShop about this &amp; they told me that; yes, almost everybody wants to either prohibit that now or do that work themselves - which is their perogative. But I still have this client &amp; I am bound to ask on their behalf: </p>
    <p>- If they bought the font before the EULA changed and can prove it, where am I?<br>
    - Can you think of a Helvetica-alike with at least two weights whose EULA is more Adobe/Shinn type like? I would prefer they used an indie font anyway.<br>
    - What if they buy various Helveticas from Adobe? Does the Adobe EULA apply?</p>
    <p>Certainly if there is no legal way to do they work I will refuse and refer them to Mono-Lino.</p>
    <p>But if there is a legal/ethical way to get this done I would like to do that.</p>
    <p>Thanks!</p>
