      <p>I guess it's obvious how much I know about typography classification and terminology- I wasn't even classifying Archer as a slab serif- just a serif with ball terminals. I think of Lubalin Graph and Rockwell when I think of a slab serif. </p>
      <p>Nick, I am in agreement with your statement. That is why I've rarely used archer in all caps- there's never enough of those lovely ball terminals to leave me satisfied. </p>
      <p>It's the way I see archer bold used that bothers me but this is probably a personal preference of style.</p>
      <p>Bree is nice but a little feminine for my taste. </p>
      <p>So are most of the people in here typographers/aspiring typographers?</p>
