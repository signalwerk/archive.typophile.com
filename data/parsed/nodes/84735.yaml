      <p>So happy to have received quick responses! </p>
      <p>Frank, I'm not crazy about the way Sentinel reads when used in sentence and paragraph form. I'm sure there is a technical word for that but you will have to excuse me as I am a self-taught designer with an English Literature degree.</p>
      <p>eliason . . . Bodoni Egyptian. That's it. I never thought about looking for a slab serif with a feminine side. I've always been drawn to slab serifs for their clean and simple lines. But I never thought one could look so good in paragraph form. I like the fact that it is slightly condensed, as I feel like I am often in need of a more condensed font in order to lend more of my beloved white space. And equally important, it doesn't come across as an archer knock-off. </p>
      <p>The lightest version is especially nice. Thank you, thank you!</p>
