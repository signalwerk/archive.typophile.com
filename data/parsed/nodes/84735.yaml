      <p><cite>It is lamentable how widespread Archer's use is becoming.</cite></p>
      <p>The problem is not the amount of use but amount of entirely inappropriate usage. Archer is fine for the many places where a cute and quirky slab serif is called for. But it can look ridiculous when used outside of those places. Two insane uses that spring to mind were a tank-themed Cheetos web campaign and the new identity for Wells Fargo retail banks. Archer is far from the only misused fonts, it just seems that way because H&amp;FJ's great marketing efforts make it easily identifiable.</p>
