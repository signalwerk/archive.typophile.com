    <p>Howdy! In going through the archives of the <a href="https://web.archive.org/web/20081007182941/http://www.yaledailynews.com/">Yale Daily News</a>, I came across this sans used for headlines in the mid- and late-1950s. It seems to me to be a mid-century humanizing step in the evolution of grotesques, following the example of <a href="/web/20081007182941/http://www.typophile.com/wiki/Morris%252BFuller%252BBenton" class="wiki">Morris Fuller Benton</a>’s News, Trade, Franklin, and Clearface gothics, but I could definitely be misguided. As always, any help or directions for further research would be very much appreciated. (And sorry for the so-so images; they’re the best my camera phone can do :-) )</p>
