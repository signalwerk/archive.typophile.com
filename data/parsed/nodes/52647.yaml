      <p>Hi Adam,</p>
      <p>The program does not "use" Opentype features -- you cannot 'test drive' a font, switching options on and off to see what happens.<br>
      At the mo', I'm not interested in actually <em>rendering</em> OpenType, but more in how the features are written. That's what the program attempts to display.</p>
      <p>(I could take a look at the HarfBuzz code though, check how the hideously difficult bits were done.)</p>
