    <p>For your delight &amp; entertainment: a Font Viewer. "Not another one!" I hear you cry. Well, this one I wrote especially to examine OpenType features. Drag any font onto it and it will tell you if it found an OpenType substitution table. If so, a mere press of the F5 key pops up a window where you can browse the features at leisure. It uses FreeType to display glyphs, so it should be able to load just about any file type there is; however, I've dismembered it to read only PFB, TTF, OTF and TTC (first font only for that one).</p>
    <p>Download the tiny zip (282K) from <a class="freelinking external" href="http://www.jongware.com/binaries/seefont_1_0.zip" rel="nofollow">my website</a> and start a-draggin' those fonts onto it.</p>
    <p>A few caveats follow right after these pretty pictures.</p>
    <p>The main screen. Move Cursor to see all glyphs, with glyph names if available, AGL names if not, unicode point if there isn't one, and glyph id as last resort.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/seefont1_5081.PNG"></div><p></p>
    <p>Press F5 to browse through OpenType features. Those numbers "#188" and so on are glyph ids (this is Calibri, which doesn't contain names).<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/seefont2_4934.PNG"></div><p></p>
    <p>Press F2 to see which Unicode blocks are covered (partially) by the font.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/seefont3_5427.PNG"></div><p></p>
    <p>Okay, here come the caveats.</p>
    <ul>
    <li>It works just fine on my old Windows machine. Do not try on a Mac. I'm not sure about Vista.</li>
    <li>No GPOS support. Difficult to program in. Check your kerning and spacing case somewhere else.</li>
    <li>Not all substitution types are supported, specifically Contextual ones. A pity, because these are always interesting to check out, but it is <em>hideously</em> difficult.</li>
    <li>Some fonts take <em>ages</em> to load. Arial Unicode, for example, takes many many seconds. Apple's LastResort.ttf takes a quarter of an hour. Really!</li>
    <li>Some fonts are displayed at what seems double size, mostly CJK fonts it seems. I have ta think about that.</li>
    <li>At startup it tries to locate the Windows/Fonts folder for its interface font: Calibri, if not found Arial. If neither is found, you don't have text in the main view.</li>
    </ul>
    <p>The good news is you can also use it as a font browser: press Page Up and Page Down to browse the folder the last font was found in (i.e., <em>first</em> drag any font onto it, <em>then</em> browse). You can also right-click a font file once (not in the Windows' font folder), select "Open With..." and browse once for the proggy. That'll insert it in the font type's "Open With" list. Don't set it as default -- I can't imagine what'll happen. Perhaps your hard disk will be erased.</p>
    <p>If you are browsing, you can press F4 to see a list of all supported font files in the current directory. Don't press F1 -- it does not supply help (who needs that anyway) but pops up an old dialog I forgot to take out :-). Press F3 to sort by Glyph Id; as mentioned before, press F5 for the OpenType features. Press Control+G to jump immediately to a glyph number; press Control+F to find a glyph by name.</p>
    <p>No worries. No problem. No guarantees.</p>
