    html: |-
      <p>I checked it via “Inspect element” in Firefox and it’s “Myriad Set” specifically.</p>
      <p>From wikipedia:<br>
      Adobe's most recent version of Myriad is Myriad Pro, which has some additional enhancements and character set extensions, but is not significantly changed in design.<br>
      ↓<br>
      Myriad Apple, a modification produced by Galápagos Design Group, incorporates minor spacing and weight differences from the standard varieties, and includes Apple-specific characters such as the company logo.<br>
      ↓<br>
      In 2006, Myriad Apple was superseded by Myriad Set, which contains extra ligatures and other minor changes.</p>
