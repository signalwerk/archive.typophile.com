    html: <p>Most probably a custom logo work by <a class="freelinking external" href="http://dnco.com/carlton-sw1.html" rel="nofollow">dn&amp;co</a>. Looks like they mixed <a class="freelinking external" href="http://www.myfonts.com/search/avenir" rel="nofollow">Avenir</a> (mainly because of /C and /R) and <a class="freelinking external" href="http://www.myfonts.com/search/futura" rel="nofollow">Futura</a> (/S looks pretty dead on) then beveled it. This <a class="freelinking external" href="http://www.carltonsw1.com/downloads/CarltonSW1_Brochure.pdf" rel="nofollow">PDF</a> embeds the original woodmark as vector, no font.</p>
