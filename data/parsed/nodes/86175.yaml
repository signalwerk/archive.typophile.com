    <p>Hello, 'ello,</p>
    <p>I was hoping somebody could identify this widely set sans serif from <a class="freelinking external" href="http://vimeo.com/29756738" rel="nofollow">this little video directed by Rimantas Lukavicius</a>:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/InfinityWater_4198.png"></div><p></p>
    <p>I really like the simplicity of it, particularly the "R".</p>
    <p>Many thanks in advance,</p>
    <p>Dylan</p>
