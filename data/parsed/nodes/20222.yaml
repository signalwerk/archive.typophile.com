      <p>and to mark simonson, 13 months late:</p>
      <p>i did get royalties for 15 years, then letraset's exclusive contract with me ended. by then technology put a wrench/spanner in the exclusivity works and all hell broke loose. </p>
      <p>i've made other fonts but the world will not miss not having seen them, although i like them. </p>
      <p>there is a ton/tonne of type design talent out there today.</p>
      <p>dean</p>
