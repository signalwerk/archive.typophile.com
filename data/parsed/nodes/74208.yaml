    <p>Hi there, my names Christopher and I have what my wife describes as an unhealthy obsession with type. You may probably understand this. I have recently started a new blog about all things typographic, especially about the type that surrounds us that most people don’t see. I have begun to share my observations about my home town of King’s Lynn in Norfolk, England and of the other places I go with my camera and my TypoRadar™ turned up to thirteen. </p>
    <p><a href="http://www.mytypeof.wordpress.com" title="www.mytypeof.wordpress.com">www.mytypeof.wordpress.com</a> </p>
    <p>I’m trying to get others involved in the project by sharing their own observations of the typography and lettering where they live; ordinary, unique or historical, official or illegal, old or new, sublime or substandard. It’s the stuff that informs us everyday without being celebrated, unlike all the great new rebrandings, logos and posters that fill all the usual typographically biased websites. This part is called ‘my type of…place’</p>
    <p>There is other stuff on there too: printed ephemera from my own collection – not rare and valuable stuff to make others jealous, but things I have acquired over the years because they have made me smile, or think, or just go ‘ooh!’ You probably know what I mean… Maybe you have some interesting stuff that you’d like to share with others too. This part is called ‘my type of…stuff’</p>
    <p>I also plan to begin a section called ‘my type of…people’ where the less prominent typographers, designers and letterers of all kinds will feature. Maybe you have a particular interest in someone who is less celebrated than the usual (type)faces, or know someone who is doing their own thing typographically, or still doing it all the old way. You may feel that you yourself could be featured here too. Who knows?</p>
    <p>Have a look and see what you think; it would be great if other Typophile members were to get involved. There is some information to download for anyone who may wish to contribute at the top of the blog, and maybe you could pass on the link to others who may be interested.</p>
    <p>Please feel free to add your comments to any of the current materials. Enjoy.</p>
    <p>Thanks for reading,</p>
    <p>Christopher Skinner</p>
