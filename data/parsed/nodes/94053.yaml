    <p>Hello:</p>
    <p>I've developed an app called Typism for type enthusiasts, on the Android platform.  Typism could be of use to artists, designers, or anyone who loves type.</p>
    <p>Here's the Android Market URL, where you can download it and look at screenshots: <a href="https://play.google.com/store/apps/details?id=com.augmentedmind.fontwhatever" title="https://play.google.com/store/apps/details?id=com.augmentedmind.fontwhatever">https://play.google.com/store/apps/details?id=com.augmentedmind.fontwhat...</a></p>
    <p>I'd be grateful for suggestions about what might be needed or just be cool to have, and feedback about what I have so far implemented.</p>
    <p>As of now, the user can:<br>
    	▪	display samples of all font files on the device ending in .ttf or .otf, with the exception of fonts located inside other application bundles.  This does include the system fonts.<br>
    	▪	display the contents of the font file's "name" table (see <a href="http://www.microsoft.com/typography/otspec/name.htm" title="http://www.microsoft.com/typography/otspec/name.htm">http://www.microsoft.com/typography/otspec/name.htm</a> or <a href="https://developer.apple.com/fonts/TTRefMan/RM06/Chap6name.html" title="https://developer.apple.com/fonts/TTRefMan/RM06/Chap6name.html">https://developer.apple.com/fonts/TTRefMan/RM06/Chap6name.html</a>). This contains copyright, licensing, designer, manufacturer, and other information.<br>
    	▪	grow or shrink the sample text and apply bold, italic and underline styles to it.<br>
            ▪	font display is multi-touch aware; i.e., you can pinch-zoom to change font size<br>
    	▪	choose text and background colors including alpha, either with sliders (seekbars) or through direct entry of hex color values<br>
    	▪	download font files of interest into a local collection. A custom, integrated browser eliminates the need to use a file manager.  Zip archives are handled transparently and effortlessly. A bookmark list is implemented and pre-loaded with a few font sites I know of.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/device-2012-05-16-204811_4757.png"></div><p></p>
