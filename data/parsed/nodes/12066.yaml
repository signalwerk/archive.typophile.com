    <p><strong><a href="/wiki" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TypoWiki</a>&nbsp;: Font&nbsp;Retailers</strong></p>
    <p>Font Retailers sell fonts from several, and in some cases, many different <a href="/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundries</a>. Many foundries also sell their own fonts directly and sometimes in addition to selling through a&nbsp;retailer.</p>
    <p>Many of today’s font retailers also carry their own font collection, such as <a href="/node/12009" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Veer’s</a> Umbrella Collection, FontShop’s <a href="/node/13594" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontFont</a> foundry and Phil’s Fonts with <a href="/node/add/wiki?edit%5Btitle%5D=Garage%20Fonts" title="Create node &quot;Garage Fonts&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Garage Fonts</a>. In other scenarios there are large foundries that have spun off a retail arm, such as <a href="/node/13429" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bitstream’s</a> <a href="/node/12184" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">MyFonts</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Monotype" title="Create node &quot;Monotype&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Monotype’s</a> <a href="/node/13938" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fonts.com</a>. </p>
    <p><a href="/node/27728" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Font Bros</a><br><a href="https://fontbundles.net" title="Click to visit an external secure URL." class="freelink freelink-external_ssl freelink-external">FontBundles.net</a><br><a href="/node/116196" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fontever</a><br><a href="/node/13426" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontHaus</a><br><a href="/node/12019" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontShop</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Fontspring" title="Create node &quot;Fontspring&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Fontspring</a><br><a href="/node/13938" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fonts.com</a><br><a href="/node/12184" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">MyFonts</a><br><a href="/node/13437" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Phil’s Fonts</a><br><a href="/node/36038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">T-26</a><br><a href="/node/12009" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Veer</a><br><a href="/node/14129" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Village</a></p>
    <p>Before adding retailers to this list, please consider whether the entry you’re adding is better listed under <a href="/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundries</a>.</p>
