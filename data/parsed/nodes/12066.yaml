    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : Font Retailers</strong></p>
    <p>Font Retailers sell fonts from several, and in some cases, many different <a href="/wiki/foundries" class="freelinking" rel="nofollow">foundries</a>. Many foundries also sell their own fonts directly and sometimes in addition to selling through a retailer.</p>
    <p>Many of today's font retailers also carry their own font collection, such as <a href="/wiki/Veer" class="freelinking" rel="nofollow">Veer's</a> Umbrella Collection, FontShop's <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a> foundry and Phil's Fonts with <a href="/wiki/Garage%20Fonts" class="freelinking" rel="nofollow">Garage Fonts</a>. In other scenarios there are large foundries that have spun off a retail arm, such as <a href="/wiki/Bitstream" class="freelinking" rel="nofollow">Bitstream's</a> <a href="/wiki/MyFonts" class="freelinking" rel="nofollow">MyFonts</a> and <a href="/wiki/Monotype" class="freelinking" rel="nofollow">Monotype's</a> <a href="/wiki/Fonts.com" class="freelinking" rel="nofollow">Fonts.com</a>. </p>
    <p><a href="/wiki/Font%20Bros" class="freelinking" rel="nofollow">Font Bros</a><br>
    <a href="/wiki/Fontever" class="freelinking" rel="nofollow">Fontever</a><br>
    <a href="/wiki/FontHaus" class="freelinking" rel="nofollow">FontHaus</a><br>
    <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a><br>
    <a href="/wiki/Fontspring" class="freelinking" rel="nofollow">Fontspring</a><br>
    <a href="/wiki/Fonts.com" class="freelinking" rel="nofollow">Fonts.com</a><br>
    <a href="/wiki/MyFonts" class="freelinking" rel="nofollow">MyFonts</a><br>
    <a href="/wiki/Phils%20Fonts" class="freelinking" rel="nofollow">Phil's Fonts</a><br>
    <a href="/wiki/T-26" class="freelinking" rel="nofollow">T-26</a><br>
    <a href="/wiki/Veer" class="freelinking" rel="nofollow">Veer</a><br>
    <a href="/wiki/Village" class="freelinking" rel="nofollow">Village</a></p>
    <p>Before adding retailers to this list, please consider whether the entry you're adding is better listed under <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a>.</p>
