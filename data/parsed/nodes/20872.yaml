    <p>I was hoping that someone can help me out as I am in need of a modern clean looking typeface. </p>
    <p>I am looking for something that resembles : Telenor (<a href="http://www.telenor.com/" title="http://www.telenor.com/">http://www.telenor.com/</a>)</p>
    <p>The clien lines , stable and works great in an identity as well as body copy.</p>
    <p>Could anyone please recomment something please.</p>
    <p>Thank you in advance for all the help.</p>
    <p>Cheers</p>
    <p>Lukas</p>
