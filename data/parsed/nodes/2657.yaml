    html: <p>This is actually not so exotic if you think about it. Every image has a histogram. I suspect they feed in a set of functions that approximate various currency histograms (and you can do these in RGB, LAB, CMYK or who knows how many models) and if the approximations fit closely enough, Photoshop won't let you do it. <br> <br>There would have to be other factors as well to keep someone from putting a big lump of color next to the bill to throw off its historgram. Fascinating stuff! <br> <br>The easy way around this is open source software like the GIMP. The scary thing is requiring these tests to be done at the hardware level. I'd be surprised if the latest scanners from the leading brands didn't all have similar routines in their hardware. Once that happens, your problem is getting the image into the program. <br> <br>Then there are the printers. I'd bet they're targeting those as well. Especially the cheap disposable CrapJet printers where all the RIPping is done in the OS printer driver. <br> <br>Perhaps a clever dumpster diver could salvage one of the unprotected models before they all go Big Brother. <br> <br>It would also have been interesting if Adobe had only protected US currency and not the Euro. That way they could (literally!) manipulate the world currency market. Counterfeit Euros would be very healthy for the US economy right now. :-/</p>
