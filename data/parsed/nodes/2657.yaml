  - id: 21204
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>If you're wondering how this works, Photoshop CS looks for the <a href="http://www.cl.cam.ac.uk/~mgk25/eurion.pdf">"EURion Constellation"</a> hidden in modern currency from Canada, Europe, Britain, Germany, the US and elsewhere. No fancy histogram checks, no image content recognition. Just a simple pattern detection algorithm. <br> <br>New versions of JASC Paint Shop Pro and Ulead PhotoImpact also contain this currency detection algorithm. A current proposal will require this of all image editing software. <br> <br>There are ways around the system. Opening it in Photoshop 7, hiding the layer and then re-opening it in Photoshop CS works. Or you can scale the image larger than 150% or smaller than 75%. The Treasury Board also said they will give out electronic versions which do not contain the protective pattern if you ask nicely. <br> <br>I'm curious to see the result of adding this pattern to an original artwork. Will it still open in Photoshop CS? Does Photoshop look for more than just the EURion Constellation when determining what is a bank note?</p>
