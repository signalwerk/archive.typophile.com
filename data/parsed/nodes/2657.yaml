    html: <p>It's not really the fact that Photoshop won't let you open pictures of banknotes that gets to me, it's the fact that Adobe never mentioned this (and from what I know, they still haven't). <br> <br>Even so, if I recall correctly, the US laws say you can use images of banknotes provided they are either 50% or 150% the actual size... so what if I need to open a picture of a $100 bill to shrink it down to the desired (and legal) size? <br>It won't stop counterfeiters either, as they will simply go back to Photoshop 7 or some other image manipulation program.</p>
