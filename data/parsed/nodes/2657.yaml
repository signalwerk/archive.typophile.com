  html: <p>According to <a href="http://boingboing.net/2004_01_01_archive.html#107357638950469017">BoingBoing.net</a>, "Photoshop CS automatically detects images of US currency and prevents the manipulation, copying and pasting of same." <br> <br>The article is linked from a <a href="http://slashdot.org/article.pl?sid=04/01/08/0111228&amp;mode=thread&amp;tid=152&amp;tid=185">Slashdot article</a>, which links to the Adobe <a href="http://www.adobeforums.com/cgi-bin/webx?128@251.aTiabueoSP3.265295@.2ccf3d27">forum</a> on the subject. <br> <br>Interestingly, it prevents users from engaging in what the US government defines as legal usage of currency images. This is both depressing and scary. Apparently, it's restricted to only certain denominations, but isn't restricted to just US currency. Also, there are many caveats to what exactly will and will not open. Does anyone else know anything about this?</p>
  html_clean: <p>According to <a href="http://boingboing.net/2004_01_01_archive.html#107357638950469017" class="link-external">BoingBoing.net</a>, "Photoshop CS automatically detects images of US currency and prevents the manipulation, copying and pasting of same." <br> <br>The article is linked from a <a href="http://slashdot.org/article.pl?sid=04/01/08/0111228&amp;mode=thread&amp;tid=152&amp;tid=185" class="link-external">Slashdot article</a>, which links to the Adobe <a href="http://www.adobeforums.com/cgi-bin/webx?128@251.aTiabueoSP3.265295@.2ccf3d27" class="link-external">forum</a> on the subject. <br> <br>Interestingly, it prevents users from engaging in what the US government defines as legal usage of currency images. This is both depressing and scary. Apparently, it's restricted to only certain denominations, but isn't restricted to just US currency. Also, there are many caveats to what exactly will and will not open. Does anyone else know anything about this?</p>
