    <p>Hello typophilers, </p>
    <p>it's been a long time since my last post<br>
    and i missed being around the block.</p>
    <p>So, here I come up with a series of posters<br>
    I did for a small exhibition of unpublished<br>
    works of mine created during the last<br>
    5 years.If your way happento cross<br>
    Thessaloniki you could contact with me<br>
    to visit the exhibition. It will be open<br>
    untill midof November (maybe it will<br>
    last even more).</p>
    <p>About the posters, I used two layers:<br>
    a constant one with the information<br>
    in handmade lettering<br>
    and the background layer<br>
    which is changing, taking different<br>
    photos I shot around the city or<br>
    in friends' houses.  </p>
    <p>The posters are not trying to describe<br>
    the exhibition. They are a theme<br>
    by themselves, though, inevitably<br>
    they give a hint of my graphic style,<br>
    which is what you are going to watch<br>
    in the exhibition. </p>
    <p>By the posters I wanted to address<br>
    to people who live in the same (urban)<br>
    environment as me. The photos present<br>
    this environment, which at this point<br>
    is filtered by my eyes. So, actually<br>
    I state my existence in this place<br>
    we share. </p>
    <p>christos</p>
