    html: <p>Up here in Vermont I never made anything close to 35K, even as the art director of a magazine, actually about 10K less. But that was 10 years ago. More recently I made about 21K as a designer for a magazine, a salary not an hourly wage, and that meant working about 50 to 60 hours a week. As you say you are a recent grad I suspect your debts, especially if you owe on a student loan, are substantial. Given that I would strongly suggest you and your friends and anybody else read Anya Kamenetz's excellent book "Generation Debt." Her site is <a href="http://www.anyakamenetz.blogspot.com" rel="nofollow">here</a> The book might be a bit depressing but it is certainly honest I think and points to where we might be going if we can't manage to rein in debt and do something about the cost of college education in this country.</p>
