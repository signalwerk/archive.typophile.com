      <p>"I don’t think that designers right out of school have quite so much power as that to dictate their starting pay, but maybe i’m out of touch."</p>
      <p>I hear that a lot from design managers. Years ago at a AIGA student portfolio event, I offered up a question to the panel about that and was basically brushed off with the same response. I think that's bad advice. We all didn't spend money and time going through college JUST because we love design. We aimed to make money doing it.<br>
      g<br>
      My first real job interview, after the portfolio review, the owner of the company came out and said 'so, what were you expecting salary-wise'. Being a student I really had no idea so blurted out a number. He said "OK". I, of course, said a number that was way low and it took me a year to get the courage to ask for a raise of 5k or so. Once again they said "OK".</p>
      <p>So, my point is that you really do need to seriously think about salary and absolutely do NOT be afraid or intimidated of asking for more than you think you are worth. If the company has gotten to the point where they are actually willing to talk salary with you, they're not going to just say "that's too much, get out" when you answer. They'll either be happy to pay you what you want or will counter offer.</p>
