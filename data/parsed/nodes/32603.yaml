      <p>"they list the average salary for an entry-level designer in the midwest as ranging from 30,000 to 33,000"</p>
      <p>The midwest is fairly large, though, and I'd guess that Chicago would be a bit higher.</p>
      <p>30k seemed to be the starting back in late 90s, though. Is the economy still that slow?</p>
      <p>"so I should look for at least $30,000?"</p>
      <p>You should as for MORE that you want. Pick a price, then add 5k or so to it.</p>
      <p>Odds are that either a) they'll give it to you or b) they'll negotiate back down to your base price anyways.</p>
