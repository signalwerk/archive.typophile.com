    html: |-
      <p>here's the advice i give to a lot of students:<br>
      look for a salary you're comfortable with.</p>
      <p>you have to weigh a lot of factors. how badly do you want that "first job"? what size organization do you want to work for? how creative is the position? what are your expenses, and how much will you require to meet them? of course, you don't want to be underpaid, but think about these factors on sliding scales. for instance, you might say, "Primo are offering me 29,000. Acme down the street are offering 31,500. but Primo is a studio i think i'd feel comfortable, and the work is more in line with what i'm interested in."  in that case, the lower salary might be better overall, in terms of your chances to grow, do some interesting portfolio building and fit in.  </p>
      <p>in the end, if you're getting a paycheck and you don't FEEL like you're being taken advantage of, then you're doing okay.</p>
