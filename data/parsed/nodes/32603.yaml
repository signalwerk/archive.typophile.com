      <p>I have to agree with Chuck here. Find out what you'd feel comfortable making. As a side note $30K seems to be standard these days unless you're in a small town or a huge metropolis. I started out at $28K in a smaller city in eastern Canada.</p>
      <p>I know the Canadian survey will break it down into some of the major cities as they tend to skew the mean a bit. The last job I took I gave a range of what I was expecting and literally got laughed at, but in a good way, they countered with substantially more than what I was expecting. Granted I think I make about the same now because I got bumped up a tax bracket.</p>
