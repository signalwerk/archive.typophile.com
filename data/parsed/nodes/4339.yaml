    html: "<p>After looking through Part 10, I would have to say that I still don’t recognize this, but rather than <a href=\"http://www.myfonts.com/fonts/ihof/p22-ruthie/\" target=\"_blank\"><span class=\"caps\">P22</span> Ruthie</a>, which is very ‘greeting card-ish’ (but nice), I would say this most resembles the new <span class=\"caps\">ITC</span> Christoph’s Quill (below): <br><img src=\"http://www.typophile.com/forums/messages/83/33749.gif\" alt=\"Christoph's Quill sample\"></p>"
