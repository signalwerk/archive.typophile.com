    html: <p>I collect script fonts, and this one looks unfamiliar to me. The major problem with ﬁnding handritten or printed fonts is that they are so easy and cheap to make. I will be watching this thread too, in case someone knows this one, but I made searches for anything to do with Einstein and typefaces or fonts or handwriting. There were no samples clear enough to say that this is even based on his handwriting, although this might make you want to suppose  it is. I have also scanned through all the everyday handwriting fonts in the <a href="http://bowfinprintworks.com/Script09Pg1.html" target="_blank">Script Font <span class="caps">ID</span> Guide, Part 9</a> without ﬁnding anything much like it. I will also check Part 10 (Antique Handwriting) in case I might have put it&nbsp;there.</p>
    html_clean: <p>I collect script fonts, and this one looks unfamiliar to me. The major problem with ﬁnding handritten or printed fonts is that they are so easy and cheap to make. I will be watching this thread too, in case someone knows this one, but I made searches for anything to do with Einstein and typefaces or fonts or handwriting. There were no samples clear enough to say that this is even based on his handwriting, although this might make you want to suppose  it is. I have also scanned through all the everyday handwriting fonts in the <a href="http://bowfinprintworks.com/Script09Pg1.html" target="_blank" class="link-external">Script Font <span class="caps">ID</span> Guide, Part 9</a> without ﬁnding anything much like it. I will also check Part 10 (Antique Handwriting) in case I might have put it&nbsp;there.</p>
