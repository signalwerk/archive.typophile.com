    html: "<p>I have the impression I haven't made myself entirely clear about  <br>what exactly I meant, so please bear with me while I try to explain  <br>it in a better way. From the Illustrator Help File: <br> <br>When dragging objects, the Snap to Point command helps you  <br>align your cursor with anchor points and guides in the document  <br>window. Snapping occurs when the cursor is within 2 pixels of  <br>the point or guide. <br><i>Important: Snapping alignment depends on the position of the  <br>cursor, not the edges of the dragged object.</i> <br> <br>To snap to anchor points and guides: <br> <br>1. Choose View &gt; Snap to Point. A check mark indicates that  <br>snapping is turned on. <br> <br>2. Select the object you want to move. <br> <br>3. Position your cursor on the exact point you want to align with  <br>anchor points and guides, and hold down the mouse button. <br><i>For example, if you want to align the corner point of a rectangle  <br>with a guide, click down exactly on the corner point.</i> <br> <br>4. Drag the object to the desired location. When your cursor  <br>comes within 2 pixels of an anchor point or guide, it snaps to  <br>the point. <br><i>The pointer changes from a filled arrowhead to a hollow arrowhead <br>when a snap occurs.</i></p>"
    html_clean: "<p>I have the impression I haven't made myself entirely clear about  <br>what exactly I meant, so please bear with me while I try to explain  <br>it in a better way. From the Illustrator Help File: <br> <br>When dragging objects, the Snap to Point command helps you  <br>align your cursor with anchor points and guides in the document  <br>window. Snapping occurs when the cursor is within 2 pixels of  <br>the point or guide. <br><i>Important: Snapping alignment depends on the position of the  <br>cursor, not the edges of the dragged object.</i> <br> <br>To snap to anchor points and guides: <br> <br>1. Choose View &gt; Snap to Point. A check mark indicates that  <br>snapping is turned on. <br> <br>2. Select the object you want to move. <br> <br>3. Position your cursor on the exact point you want to align with  <br>anchor points and guides, and hold down the mouse button. <br><i>For example, if you want to align the corner point of a rectangle  <br>with a guide, click down exactly on the corner point.</i> <br> <br>4. Drag the object to the desired location. When your cursor  <br>comes within 2 pixels of an anchor point or guide, it snaps to  <br>the point. <br><i>The pointer changes from a filled arrowhead to a hollow arrowhead <br>when a snap occurs.</i></p>"
