    html: <p>Now point 3 is utter bollocks when it comes to text anchor points.  <br>When I want to have the anchor point of the text snapping to an  <br>anchor point of an object, I click the text object anchor point,  <br>drag it till it snaps to that anchor point. One would assume that  <br>both text anchor point and "snap-to point" are then positioned  <br>perfectly on top of each other. BUT when I enlarge it appears  <br>that this is <i>never</i> the case, even if I try at 6400%! <br> <br>If I try it the other way round and drag an object by its anchor  <br>towards the anchor point of the independent text object, it does  <br>not snap. So this means text anchor points have completely lost  <br>their "magnetic" abilities! For what reason? It worked fine and it  <br>was a really helpful feature. <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"></p>
    html_clean: <p>Now point 3 is utter bollocks when it comes to text anchor points.  <br>When I want to have the anchor point of the text snapping to an  <br>anchor point of an object, I click the text object anchor point,  <br>drag it till it snaps to that anchor point. One would assume that  <br>both text anchor point and "snap-to point" are then positioned  <br>perfectly on top of each other. BUT when I enlarge it appears  <br>that this is <i>never</i> the case, even if I try at 6400%! <br> <br>If I try it the other way round and drag an object by its anchor  <br>towards the anchor point of the independent text object, it does  <br>not snap. So this means text anchor points have completely lost  <br>their "magnetic" abilities! For what reason? It worked fine and it  <br>was a really helpful feature. <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"></p>
  - id: 141933
    user: 2277
    date: 2004-04-02T06:34:00
    date_raw: 2 Apr 2004 — 6:34am
    votes: null
    html: <p>I did some reading on this in Adobe's forums. <br>Other people are pretty upset about it too and <br>it doesn't seem like there is much of a fix yet. <br> <br>The way it works is that the arbitrary place in <br>which you click your cursor inside an object is <br>the spot that snaps to guides, not the outside <br>bounds of the object itself. So, short of <br>grabbing as close to the edge of an object or <br>text unit as you can, there isn't much you can <br>do with Snap to Guides. <br> <br>Try turning on the Snap to Grid. That is the only <br>way I could get what you are attempting to work.</p>
    html_clean: <p>I did some reading on this in Adobe's forums. <br>Other people are pretty upset about it too and <br>it doesn't seem like there is much of a fix yet. <br> <br>The way it works is that the arbitrary place in <br>which you click your cursor inside an object is <br>the spot that snaps to guides, not the outside <br>bounds of the object itself. So, short of <br>grabbing as close to the edge of an object or <br>text unit as you can, there isn't much you can <br>do with Snap to Guides. <br> <br>Try turning on the Snap to Grid. That is the only <br>way I could get what you are attempting to work.</p>
