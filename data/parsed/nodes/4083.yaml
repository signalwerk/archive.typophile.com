  html: <p>There's something in Adobe Illustrator CS that drives me  <br>absolutely freakin' <i>NUTS</i> and that's the fact that text anchor  <br>points seem to have lost their "snap to" ability. I hope this is just  <br>a setting and not due to the completely reworked type engine. <br> <br>I often have short bits of text as independent units (without text  <br>box) and used to snap the anchor point to corner or center  <br>points of objects. Now this doesn't seem to work anymore. <br>Anyone knows what happened? I've looked in the preferences  <br>and couldn't find any setting that might be responsible for this.</p>
  html_clean: <p>There's something in Adobe Illustrator CS that drives me  <br>absolutely freakin' <i>NUTS</i> and that's the fact that text anchor  <br>points seem to have lost their "snap to" ability. I hope this is just  <br>a setting and not due to the completely reworked type engine. <br> <br>I often have short bits of text as independent units (without text  <br>box) and used to snap the anchor point to corner or center  <br>points of objects. Now this doesn't seem to work anymore. <br>Anyone knows what happened? I've looked in the preferences  <br>and couldn't find any setting that might be responsible for this.</p>
