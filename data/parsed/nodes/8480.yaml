    html: "<p>Pretty good; transforming Hebrew into a grotesque is not an easy task. <br> <br>Points to consider: <br> <br>Keep in mind whether you're going for a flat or rounded top <br> <br>The samech could use a rounder bottom stroke to better differentiate it from the final mem. <br> <br>The extra lip looks good on some of the letters, but falls kind of flat on the feys. <br> <br>Also, the hey needs to be tightened up; there's more whitespace inside the letter than there is between it and the vav.</p>"
    html_clean: "<p>Pretty good; transforming Hebrew into a grotesque is not an easy task. <br> <br>Points to consider: <br> <br>Keep in mind whether you're going for a flat or rounded top <br> <br>The samech could use a rounder bottom stroke to better differentiate it from the final mem. <br> <br>The extra lip looks good on some of the letters, but falls kind of flat on the feys. <br> <br>Also, the hey needs to be tightened up; there's more whitespace inside the letter than there is between it and the vav.</p>"
  - id: 56132
    user: 1551
    date: 2005-04-08T10:47:00
    date_raw: 8 Apr 2005 — 10:47am
    votes: null
    html: <p>I agree that the traps on the feys are not working.  <br> <br>The roundness of the tops is a nice idea, but the way the curves on the tops of the letters flatten toward the left is currently awkward; you need to tweak this, though maybe not much. I agree about the top gap above the 'leg' of the hey - also the kof. Is the beit to wide? Would just slightly narrowing the verticals help or hurt?  <br> <br>I am not that knowledgeable on Hebrew, so take this all with a grain of salt. I would compare your letter proportions to other successful 'sans' style Hebrew faces.</p>
