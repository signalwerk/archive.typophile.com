      <p>The rounded tops of the letters are the "key" to your font - it's a smart thing to choose which letters will get the rounded feature and which won't, but you still have a small problem with consistency. I would advise turning to FrankRuhl and observing the differences between letters like Dalet and Resh.</p>
      <p>You have a very gracious Samekh... That's it, I don't think I have any more to add to the previous comments posted... Good luck!</p>
