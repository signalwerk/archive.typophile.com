    date: 2005-04-28T21:30:00
    date_raw: 28 Apr 2005 — 9:30pm
    votes: null
    html: "<p>I like the round tops, Hebrew characters tend to be excessively boxy. You have flat tops on a few letters and I wonder why those particular letters: delet and quf for instance. Does the font look bad if all the letters are rounded? <br> <br>The final tsadeh looks uncomfortable. <br> <br>However I think it's good that you differentiate the heh from the het by exagerating the white space in the hey. In some Hebrew fonts these two letters are almost identical. <br> <br>In smaller sizes, the \"lip\" on top left of the het, mem, samech, peh and tav is almost invisible. Maybe you could make it more pronounced. <br> <br>It would be nice to see a page of text - or at least a few sentences with some punctuation. <br> <br>Mike</p>"
