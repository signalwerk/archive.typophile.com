    html: |-
      <p>Disclaimer: I'm an old dude and clearly not in your target market. </p>
      <p>I am a graphic designer, though, and based on my experience, nobody--not even cutting-edge, next-generation people--likes to read whole sentences or paragraphs in all caps, so I'd advise against B, C, and D. </p>
      <p>E and F are fine for a logo, but too hard to read for a whole sentence or paragraph. But maybe that's the effect you're aiming for: something that looks like a secret code that only the cool kids can read, and their parents (me) can't read.</p>
