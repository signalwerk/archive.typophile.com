    <p>I'm trying to find a font to use in everyday: emails, text and documents for a Live performing business bringing a new type of Immersive audio visual live shows.</p>
    <p>I'm searching for a futuristic font with square lines  to transmit the following messages: Futuristic, forward thinking, cutting edge, fresh, next generation.</p>
    <p>Doing a quick search; I came up with the following fonts (see attached image)</p>
    <p>A- Anita semi square<br>
    B- Capella extra condensed<br>
    C- Nextwave condensed<br>
    D- Nano Low<br>
    E- Radio space<br>
    F- 5th Agent</p>
    <p>Which one do you think could suit best ?</p>
    <p>Have you got an advice for a better font ?</p>
