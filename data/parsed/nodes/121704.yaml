    html: |-
      <p>&gt;  emails, text</p>
      <p>Won't work. Emails and texts use fonts the recipients have on their computers/tablets/phones. If you use an unusual font which those folks don't have, it will appear in a different font on their devices.</p>
      <p>An alternative for email might be to send the message as a graphic or PDF to preserve the fonts and appearance. Keep in mind that some folks (mostly on cell phones or tablets using data plans) don't download graphics automatically so they won't go over their bandwidth allotment, which may reduce readership. </p>
      <p>Another option is to include a link to a web page.</p>
