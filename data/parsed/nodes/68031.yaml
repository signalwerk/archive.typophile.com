      <p>Uau!!</p>
      <p>I was away for a few days and now I'm back I see so many tips.<br>
      Thank's to all.</p>
      <p>I may not explain myself clear.<br>
      I'm not looking for an informal font, or for a kiddie look.<br>
      I'm trying to silently change the panel exhibits from Comic Sans to a more serious font.<br>
      The earlier designer before me used Comic Sans and the client accepted.<br>
      But now that I'm designing new panels and material for the exhibit I would like to evolute to a bit more serious font.<br>
      If I radically change the font the font, the client may not like.</p>
      <p>From all your suggestion, FF Duper OT Bold may be the one that is more close to what I look for (if there exists...).<br>
      For now I decided to use Chalkboard, that is very close to Comic Sans, but the ascenders and stems are not so curvy.</p>
