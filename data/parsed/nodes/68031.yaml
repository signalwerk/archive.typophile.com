  html: |-
    <p>Hello.</p>
    <p>I'm designing some panels to an exibit.<br>
    The previous designer used MS Comic Sans for the photo descriptions.<br>
    I don't want to design the new panels much different from the existing ones, but I refuse to use MS comic Sans.<br>
    Is there any similar font, very close to Comic Sans but a little bit more formal?<br>
    A font that the client may not notice the difference at a glance.</p>
    <p>I found Chalkboard to be very close to Comic Sans, but it is still to informal.</p>
    <p>Thank you.</p>
    <p>jrsilva</p>
