    date: 2004-02-16T07:06:00
    date_raw: 16 Feb 2004 — 7:06am
    votes: null
    html: "<p>Hello T, <br> <br>I really like the concept of this typeface. <br>I'm not sure about the proportions... your ascenders and descenders seem to short at a quick look. You should print some samples on small sizes to check it out. <br> <br>Some details: <br> <br>1 The hairlines of 'a' and 'e' are too thin. This will cause the character to break at text sizes. You should make it the same constrast as in 'n'. <br> <br>2 The 'a' needs work to me. It's curves don't seem to match with the rest of the font. <br> <br>3 The 'r' can be narrow. <br> <br>4 The upright diagonal of 'x' can be thinner. <br> <br>If you work more on the constrast of individual charcaters, having 'o' and 'n' as references, your typeface will be more even. <br> <br>Keep up the good work! <br> <br>Fabio H <br></p>"
    html_clean: "<p>Hello T, <br> <br>I really like the concept of this typeface. <br>I'm not sure about the proportions... your ascenders and descenders seem to short at a quick look. You should print some samples on small sizes to check it out. <br> <br>Some details: <br> <br>1 The hairlines of 'a' and 'e' are too thin. This will cause the character to break at text sizes. You should make it the same constrast as in 'n'. <br> <br>2 The 'a' needs work to me. It's curves don't seem to match with the rest of the font. <br> <br>3 The 'r' can be narrow. <br> <br>4 The upright diagonal of 'x' can be thinner. <br> <br>If you work more on the constrast of individual charcaters, having 'o' and 'n' as references, your typeface will be more even. <br> <br>Keep up the good work! <br> <br>Fabio H <br></p>"
