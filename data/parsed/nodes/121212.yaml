    html: |-
      <p>The original must be <strong>Basilea</strong> a font designed by Markus Low at 1965.<br>
      The closer digital I can find to your sample is an old <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Image-Club-Graphics%20%2F%20%28Commercial%29&amp;ffam=Basilea%20-%20Regular&amp;fid=750338b9fdf4307825b960f9cbf562d1&amp;fsize=60&amp;text=SWINBURNE%20UNIVERSITY%20OF%20TECHNOLOGY&amp;wrap=2" rel="nofollow">Basilea</a></strong> version by Image Club Graphics [1992] but it's probably not available anymore.</p>
      <p>It was also digitized by OPTI Castcraft as <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=OPTI-Castcraft%20%2F%20%28Freemium%29&amp;ffam=OPTISusan%20-%20Regular&amp;fid=fdd1d3df5110e540841a7e55a9514c8c&amp;fsize=48&amp;text=SWINBURNE%20UNIVERSITY%20OF%20TECHNOLOGY&amp;wrap=2" rel="nofollow">OPTI Susan</a></strong> but you must be very careful when using OPTI orphan fonts in a commercial project (OPTI is a defunct company and almost all of their fonts were clones of other designs).</p>
      <p>Once upon a time there was also <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Letterhead%20%2F%20%28Commercial%29&amp;ffam=Kellie%20Ann%20LHF%20-%20Normal&amp;fid=9bd752d5bbfcef03aa6a6a7e64acf6de&amp;fsize=60&amp;text=SWINBURNE%20UNIVERSITY%20OF%20TECHNOLOGY&amp;wrap=2" rel="nofollow">Kellie Ann LHF</a></strong> by Letterhead Fonts [2002] but I can't find it anymore in their official site.</p>
      <p>Finally, there is <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/northernblock/markus-low/" rel="nofollow">Markus Low</a></strong> by Jonathan Hill [The Northern Block, 2010] a font named after the original designer, which is available, but it's not so close to your sample.</p>
