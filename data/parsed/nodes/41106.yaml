      <p>Sounds like a great job! That's the kind of magazine I would read. </p>
      <p>I think any of those slabs I mentioned would do nicely, but if you want to go the more traditional route and use a serif, have a look at these threads which list a few contemporary options:</p>
      <p><a href="http://www.typophile.com/node/41087" title="http://www.typophile.com/node/41087">http://www.typophile.com/node/41087</a><br>
      <a href="http://www.typophile.com/node/37569" title="http://www.typophile.com/node/37569">http://www.typophile.com/node/37569</a></p>
      <p><a href="http://www.fontshop.com/features/newsletters/nov2007_a/" rel="nofollow">FF Meta Serif</a> is also ideal for this project, and because it was co-designed by Christian Schwartz, the creator of Stag, there's some of the same DNA in there.</p>
