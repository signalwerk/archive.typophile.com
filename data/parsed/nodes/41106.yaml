      <p>Good questions Stephen.</p>
      <p>The magazine is focused on cities and ideas to solve problems in a sustainable way. The core reader has been urban planners, architects and highly educated academic types (mostly middle aged, white and male). The goal of the design is to broaden and attract a more diverse female reader and shift from being perceived as a trade journal and more as a newsstand title for a more casual audience.</p>
      <p>The copy needs to feel sophisticated and approachable. The content is also very people-focused with lots of interviews, profiles and user information.</p>
