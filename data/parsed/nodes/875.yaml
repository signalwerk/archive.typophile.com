    html: <p> Sorry Stephen, I disagree. I think it *is* a good thing. But, I see more Nobel in it than Gill.  <br> <br>At first, the upper bowl on the lc 'g' seemed <br>squashed, but after reading through the paragraph <br>it doesn't seem too squashed, only just a bit. And from the preview, the down-stroke on both the lc 't' and the lc 'a' seem a bit heavy. Also, the join between the stroke and the arm on the lc 'r' is too heavy? All questions. Not facts. <br> <br>I love it in general and the figs are v. nice. Other weights? </p>
