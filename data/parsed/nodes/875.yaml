  html: <p>Hi guys <br> <br>now I found time to improve my StandUp font for presenting it in this forum. At <a href="http://www.screentypo.org/standup/" target="_top">http://www.screentypo.org/standup/</a> you will see it. I draw it directly at the computer whit a digitzer with FontLab4. Every letter is individuall. <br> <br>The developing is going (special the numbers arent realy good) I made a little forum. You can click inside of the Flashmovie to make a remark for detail. <br> <br>So tell me what you think! <br> <br>Greetings Jens</p>
