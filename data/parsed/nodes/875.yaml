    html: "<p> for the Flash-feedback: okay, okay I will make a little tutorial and some improvements (i.e. controling the zoom for Details) And what Hrant sad resizing the circle (hope i really can do this...) <br> <br>to Stephen: Yes i could be there is the a little bit Gill in my font, but that wasnt my inspiration. The types get a very classic stile. But there is greater \"wechselzug\" than in Gill. (dont found the right english word) <br> <br>to Tiffany: I will check it. The Problem is that a view on screen dont show all details and problems. Maybe that is the problem. But I dont really know.  Recently I tryed to make the lc 'g' smaller but i think this version is better.   <br>the down-strok of the a is stil very small. The a need a smaller downstroke (I learned it in this way...)! But there are many problems with the down-stroke width (you will see it at least on paper). <br>Im recently start to draw and digitize a italic version. But first i need to improve the numbers and developing the special sign, improving punctuation, accents or emphasize?  <br> <br>so long :-) <br>Jens </p>"
