      <p>Christian, I have to disagree with you. I think that this could be a very interesting project. If Rodrigue removes "typeface selection" from his design equation, he is left to make his work with a wider open playing field for all of the other factors.</p>
      <p>I am reminded of two Northern California residents:</p>
      <p>Steve Jobs wears the same outfit all of the time: Black mock turtleneck shirt and jeans. And you have to admit that his creative talents as CEO of Apple and Pixar have led both of those companies to great heights.</p>
      <p>Rudy vanderLans worked for years in Ready,Set,Go!, a basic page layout program. I remember reading a statement from Rudy which I will paraphrase: The program wasn't able to rotate text or do a lot of other things, so I was left to make the design interesting within those limits. (Apologies to Rudy for completely slaughtering his words.)</p>
      <p>And I agree with Adam that it's not the quantity of typefaces which is at issue, it is their quality. I am guilty of much bad work, some mediocre work, and some good work. But I have yet to produce anything truly Great with a capital G. 100 years ago, it was such a massive undertaking to bring a new typeface design to market that only the strong made it. (Objectively.) Now, it's extremely easy to self-publish type, but the number of Great designs released has not increased proportionately.</p>
      <p>So, to get around to the question: no, so many fonts aren't "necessary", but the increase in numbers still results in the good and Great stuff percolating to the top.</p>
