      <p>Christian, </p>
      <p>of course what I said "I could imagine a party where each woman is wearing either dress model A or dress model B or dress model C, period", I was kidding. The human nature knows two trends: unification and individualization. They co-exist in a ying-yang<br>
      way. If I were Desmond Morris, I'd say humans are just herding animals. We like to develop "individualized groups" -- one army usually has uniforms of some sort but they should be different from the opponent's uniforms. One corporation likes to use the same corporate typeface (color, graphic element) in all their communication and that typeface (color, graphic element) should be different from the competitor's. </p>
      <p>That's just one point, pretty obvious. The other point is specific to typeface design: I do believe there is still room for improvement in typeface design, even in the Latin writing system, although I kind of doubt that a whole lot of invention can happen in the formal language of the typeface. But the form is only one of the elements of a font. The extensiveness -- or perhaps should I say, completeness -- of character sets is another one, the quality and consistency of spacing is yet another. </p>
      <p>I recently spoke with a friend who does book layout in Poland, mostly scientific publications and fiction. His studio designed and typeset around 1,000 books so far, and he's still unhappy with the small set of workhorse typefaces he's working with. He can produce large lists of errors that are included in the leading foundries' "Pro" OpenType fonts. (If you ever design a "workhorse"-type OpenType font suitable for typesetting Central European languages and would like to have some critique from the utilitarian point of view, let me know and I'll get you in touch.) </p>
      <p>To me, a good font has three components that can compete: the stylistic component, the linguistic component and the technical component. Many designers like to compete in "form" because they see typefaces as means ofartistic expression. Many of them compete only in the area of glyph design, which is even a subset of the stylistic component. Things like letterspacing, linguistic quality and technical quality are often considered secondary -- although things changed a lot in the last years. My personal campaign "make your ogoneks right" is of course only an exemplification of this thinking. </p>
      <p>A.</p>
