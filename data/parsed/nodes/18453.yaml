      <p>I think what Rodrigue is getting at is pretty simple, and a very good point: type selection should be guided by a strong design sense. I think that's the whole issue. How many fonts there "are" makes no difference. Whether you like to hang out and get to know just a few pair, or if you prefer to scan through scores at a time to pinpoint a few that you like this week-- that makes no difference. You need the knowledge and good sense of typographic design either way, if you hope to get to type nirvana. I am reminded of an essay by Philip Meggs, "The Obscene Typography Machine" way back in 1994:</p>
      <p>"Unfortunately, the ease of computer use puts potent graphic capabilities into the hands of people who are devoid of any aesthetic sense about typography and have little or no understanding of the most basic principles of design. Powerful new software programs... give the designer (or moron, as the case may be) the power to flip, rotate, stretch, or bend typography with the click of a mouse button. This permits some of the most obscene type forms ever devised or imagined." (160)</p>
      <p>(in <em>Looking Closer: Critical Essays on Graphic Design</em>, pub. Allworth 1994, the first of two "Looking Closer" books and highly recommended)</p>
      <p>And, I think it's important to remember that good design sense, accompanied with healthy curiosity and a half a brain, is what leads people beyond the limited palette of the very popular but visual cliche Arial, TNR, Brush Script, and Comic Sans. Imagine if you applied the principle of limiting one's palette (like in painting class, where you work in monochrome before tackling color) to THOSE. I mean, hey, they offer very obvious workhorse examples of sans-serif, serif, "decorative," and "informal." Perfect, right? NOooooo...</p>
      <p>- Jay</p>
