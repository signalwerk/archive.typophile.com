    html: <p>javi2307 - clearly you need a spanking. Seriously, though-- that's a perfect example of how design know-how trumps adherence to a system every time. I like the pattern -- it's a right-pointing triangle, and the variation is consistent throughout, i.e., there are dramatic shifts in typeface, but the shifts occur in a patterned way. It wouldn't make the same point, in fact, if there were only three variations, instead of a variation at nearly every letter. That's what I'd tell my students, anyway. Although, even that kind of thing becomes cliché eventually.</p>
