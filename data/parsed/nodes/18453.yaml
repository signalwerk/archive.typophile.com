    html: |-
      <p>We've visited the "Too Many Typefaces" several times before, some with quite insightful replies, and some with delightful remarks.</p>
      <p><a href="http://typophile.com/node/8706" target="new" rel="nofollow">If you could only use 5 typefaces...</a><br>
      <a href="http://typophile.com/node/14904" target="new" rel="nofollow">Please help with information on Massimo Vignelli</a></p>
      <p>One of my own smirky remarks:<br>
      <em>Limitation... good,<br>
      exclusion... bad!</em></p>
      <p>Setting yourself a limited palette, selection or tool set in order to learn/express higher or deeper aspects is an age old exercise, and even more valid as an exercise today.</p>
      <p>It will never matter if there is too much, too many or not enough of anything, as quantity of selection has nothing to do with aesthetics.<br>
      For those who don't know what they are doing, limiting their font selections will not necessarily prevent them from inflicting visual harm on others.</p>
      <p>Some people can wear the same color shirt every day, some can't.<br>
      I'm sure if I had to eat steak and lobster alternately every other day, there would come a point where I'd be sick of them. Luckily I haven't reached that point by a long shot.</p>
