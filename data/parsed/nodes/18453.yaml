      <p>Actually, I think *so* many fonts are not necessarily needed. The problem is that there aren't too many good fonts — so if people design many typefaces, there are chances that every now and then a new *good* one is created. But altogether, master Frutiger’s point is valid: Are so many wines necessary? You can think of less exquisite goods — how about clothing? Are so many dresses necessary? I could imagine a party where each woman is wearing either dress model A or dress model B or dress model C, period. But I guess the women wouldn’t like this vision :)<br>
      A.</p>
