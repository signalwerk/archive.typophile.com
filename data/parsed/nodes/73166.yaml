      <p>Thanks Craig!</p>
      <p>The spacing closely relates to the proportions of the letters (especially to the proportions of their counters). It follows the letters’ space saving (economical) qualities in the Regular styles. The heavier the weight gets the relatively narrower the letters are and so is the spacing.</p>
      <p>All styles can be used without any tracking modification in text sizes. In headline sizes and on big signage some minus tracking gives all styles a stronger appearance and is therefore recommended.</p>
