    <p>I have a flush left, ragged right text box. I want to make the paragraph more square without justifying the text but I feel like I have no control. If I decrease the word spacing, tracking, or kerning the 'who' only moves up the the previous line when things are far too close together and even then there is ample room within the text box for breathing room. </p>
    <p>I'm so frustrated!</p>
