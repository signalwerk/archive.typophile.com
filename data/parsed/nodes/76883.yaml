    html: |-
      <p>By the way, and with all due respect, you're using fake small caps in your example. You may want to use an OpenType font that has real small caps built in or a family that has a set of real small caps in a separate font file.</p>
      <p>No idea what I'm talking about? Fake small caps are computer-downsized capital figures that look lighter/thinner than the surrounding characters. Real small caps are the same weight and proportion to the rest of the characters in the font file.</p>
      <p>Hope this helps...</p>
