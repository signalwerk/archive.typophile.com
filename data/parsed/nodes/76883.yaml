    html: |-
      <p>Another point I would like to make: app. you use the standard InDesign-settings for H&amp;J — where letterspacing is allowed. That is an absolute no-no for serious typographers. </p>
      <p>Justification can be found as an option in the Paragraph-pallette. Change the settings here:</p>
      <p>Word Spacing: depending on the typeface — I mostly use around 80% Minimum, 90% Desired, 100% Maximum<br>
      Letter Spacing: 0% overall<br>
      Glyph Scaling: is considered a BAD thing, but I will allow 1% either way (99%, 1005, 101%). </p>
      <p>Auto Leading is also BAD when set to anything else than 100%. You want to be in control.</p>
      <p>This is also where you can reset the Composer microspective talks about.</p>
  - id: 442273
