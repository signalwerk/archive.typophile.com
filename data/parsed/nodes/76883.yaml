    votes: null
    html: |-
      <p>You could always just break the lines in that paragraph manually instead of letting InDesign choose where to break them.</p>
      <p>Use a forced line break (Shift-Return) rather than a paragraph break (Return), so InDesign will know you're not starting a new paragraph. You may need to manually break several lines since InDesign may reflow other lines above and below when you insert a manual break.</p>
