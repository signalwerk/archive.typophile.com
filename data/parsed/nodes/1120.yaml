    html: "<p>This is really useful. I mean really. <br> <br>You can add a lot of stuff, but start with the basics, like you have. I'd have to think what non-alphanumeric characters to add (eventually), but some quick observations for now: <br>- Have a regular alphabet setting too (at least a-z). <br>- Use the cap height as a secondary vertical measure, instead of using it to determine the percentages. <br>- Show the percentage of \"internal leading\" too. <br> <br>And on subsequent pages you might have: <br>- Some key words (like \"the\") set large. <br>- Width calculations. <br>- Many other wonderful things!  :-) <br> <br>&gt; spanish linguistics on type design improvement. <br> <br>Hey, there's really nothing written about that for <i>English</i>. You've got yourself a superb topic. <br> <br>hhp <br></p>"
