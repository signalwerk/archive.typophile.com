  html: <p>I am going to start studing some type faces so I made a specimen wich groups main glyphs by familiar shapes, shows the vertical proportions and three different paragraph settings, one of them helping to measure type space efficiency (do = 1000 glyphs). <br> <br>I would like to have some commentaries about how could I improve this tool for the study of a type face. The lower case glyphs are about 2 picas height and the upper case about 3.I</p>
