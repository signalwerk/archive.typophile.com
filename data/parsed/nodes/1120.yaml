    html: <p>&gt; width measurements <br> <br>The simple one is lc alphabet length. <br>But a smarter one takes letter frequency into account, but then that gets language-specific. <br> <br>Internal leading is the sum of the space above the ascenders plus below the descenders, and it's a big determinant of the face's apparent size (for a given point size). In some designs (mosly script faces with small x-heights) it can actually be negative! But usually it's about 10%. <br> <br>hhp <br></p>
