    <p>Greetings.</p>
    <p>I was hoping maybe one of you could identify the typeface used in this title. I've seen these characters elsewhere , but nothing current. They've all been old print ads , and of course , the video title.</p>
    <p>Does anyone recognize this? I'm assuming it hasn't been digitized , but any information you could give is greatly appreciated.</p>
    <p>Thanks in advance.</p><div class="imageWrap"><img src="http://typophile.com/files/bsss_300_title_resize_6685.jpg"></div><p></p>
