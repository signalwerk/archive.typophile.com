    html: <p>It's pretty much in the hands of Monotype, which owns the rights to all the Letraset fonts. I wouldn't hold my breath. There are lots of classic ITC faces (which they own the rights to as well) that they've never released digitally. They are sitting on some real gems, if you ask me.</p>
