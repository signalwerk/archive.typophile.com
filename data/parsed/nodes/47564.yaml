    <p>I read in this months Grafik about Builds' album cover for Flying Lotus in collaboration with Commonwealth and Timothy Saccenti. It explained the various methods of constructing the images used but what I found intriguing was the explanation of where the type came from. It says the type was custom drawn by Mr Place from an old letraset catalogue. It goes on to say that the typeface was Pinball. </p>
    <p>I'm curious to find out more about old letraset and its uses today. Anybody know where I could get my hands on some of these?</p>
