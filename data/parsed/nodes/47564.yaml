      <p>Font forgeries of old Letraset fonts are sold by Canadatype (i.e. by Rebecca Alaccari and Patrick Griffin) and other font forging outfits.</p>
      <p>If someone needs high-quality scans of old Letraset fonts such as this one</p>
      <p><a href="http://www.sanskritweb.net/temporary/goudy-fancy.tif" title="http://www.sanskritweb.net/temporary/goudy-fancy.tif">http://www.sanskritweb.net/temporary/goudy-fancy.tif</a></p>
      <p>cf. <a href="http://www.fonthaus.com/products/fonts/view.cfm/sku/CT10129.cfm" title="http://www.fonthaus.com/products/fonts/view.cfm/sku/CT10129.cfm">http://www.fonthaus.com/products/fonts/view.cfm/sku/CT10129.cfm</a></p>
      <p>in order to track down such forgeries as shown above, he may contact me.</p>
      <p>For instance, in 2006 I analyzed the above forgery "Goudy Two Shoes" which turned out to be a font forgery of the Letraset font "Goudy Fancy".</p>
      <p>Rebecca Alaccari also forged fonts made by Gustav Jaeger whom I know:</p>
      <p>see <a href="http://www.typophile.com/node/40705" title="http://www.typophile.com/node/40705">http://www.typophile.com/node/40705</a></p>
      <p>!!! Warning !!!</p>
      <p>Do NOT visit the Rebecca Alaccari website</p>
      <p><a href="http://www.canadatype.com" title="http://www.canadatype.com">http://www.canadatype.com</a></p>
      <p>because this hacker website secretly installs spyware on your PC.</p>
