  html: <p>Applications are now being accepted for Type@Cooper Condensed. This program is an integrated intensive 5 week program with Sumner Stone, Sara Soskolne and Andy Clymer. The program runs from June 20 thru July 21 and is held at Cooper Union's campus in the East Village, Manhattan. The program will include lettering, typeface design, font production. Very special guests will come to teach workshops, lecture, and give critique including Ken Barber of House Industries. Application deadline for summer 2011 is February 28th. No more than 15 students will be chosen to attend. More information about the Condensed Program at <a href="http://coopertype.org/condensed/" title="http://coopertype.org/condensed/">http://coopertype.org/condensed/</a></p>
