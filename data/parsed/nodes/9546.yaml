  html: <p>I've read (in Malcolm Parkes's book on the history of punctuation) that the modern quotation mark is a descendent of an older punctuation called the 'double comma' � an archaic mark that was used to emphasize sentences of special importance. Does anyone know when this changed � and a complete quotation mark was cast in metal as a single character? I didn't know if letterpress printers (for example) still put two commas together (inverted) to make quote marks.</p>
