    html: <p>One foundry where this became a pivotal issue was ATF. Because many of their fonts had very short descenders (making it impossible to simply flip sorts 180), and because the pantograph facilitated flipping while in the past it was easier to rotate the punch/matrix/sort 180-degrees, ATF introduced "rationalist" quotes (towards the beginning of the 20th century, with their Bodoni I think), which were flipped-99 and 99, instead of the traditional 66 and 99. And those ATF quotes were necessarily cast separately. <br> <br>hhp</p>
