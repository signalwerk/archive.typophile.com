    html: <p>Karen <br> <br>Don't know when the quotation mark first appeared in metal but both single and double quotes were not uncommon in foundry cast fonts. Monotype could also be ordered with single or double quotes though Monotype "foundries" tended to furnish only single quotes with fonts. The use of inverted commas didn't always work, it depended upon the typeface. The unit settings for Monotype did not often allow for a proper look to double quotes that were, in actuality, composites (of single quotes). <br> <br>I haven't read the Parkes book but I have read or heard that the "long comma" (a thought divider that looked like a slash or double slash) was an early manuscript form from which most other punctuation was later derived.</p>
    html_clean: <p>Karen <br> <br>Don't know when the quotation mark first appeared in metal but both single and double quotes were not uncommon in foundry cast fonts. Monotype could also be ordered with single or double quotes though Monotype "foundries" tended to furnish only single quotes with fonts. The use of inverted commas didn't always work, it depended upon the typeface. The unit settings for Monotype did not often allow for a proper look to double quotes that were, in actuality, composites (of single quotes). <br> <br>I haven't read the Parkes book but I have read or heard that the "long comma" (a thought divider that looked like a slash or double slash) was an early manuscript form from which most other punctuation was later derived.</p>
