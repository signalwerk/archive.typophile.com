    html: |-
      <p>Nick, I have the greatest respect for you too, but let me clarify.<br>
      I saw a beautiful picture posted here on typophile years ago. I tried to find it in the search bar to show what I was talking about but it did not come up with anything :( Anyways It showed a dimensional lettered sign that said "GLORIA" I thought that would make a cool font so I made my version of it. Its not a revival. I drew the letters. BTW if you place my letters on top of the photo it will be different as I did not trace the letters. In other words I made the font myself. Being a lettering artist has its advantages :)<br>
      What this guy did was he went to Letterhead fonts and printed out the sample page. There are no numbers or punctuation on the sample at LHF. He then took Futuras numbers and made a font out of it. That is pretty low in my book. Now, if I  found this in a specimen sheet from the 30's or 40's I would think it would be free reign, but since I drew the letters myself I find it to be theft. Nick, you may think otherwise but to each his own.<br>
      @Nick Shinn, you nailed it!</p>
