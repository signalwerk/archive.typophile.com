    html: |-
      <p>Reminds me of this:<br>
      <a href="http://typophile.com/node/93171" title="http://typophile.com/node/93171">http://typophile.com/node/93171</a><br>
      In the end they arrived at some mutually-satisfactory agreement. On the other hand -unlike with Veneer and Wisdom Script- Duce possibly adds <em>nothing</em> of value so is not worth cutting any slack for. I'm not counting the cheesy Photoshop-redundant distressing effect.</p>
      <p>Charles, I assume Gloria is not closely based on any pre-existing design?</p>
      <p>BTW:<br>
      - This is one great reason to be on MyFonts: if you're with them they're much more likely to honor your take-down requests. It also makes it much easier to get some/all of the money from sales of the offending font.<br>
      - Much of the work from Machalski/Borutta seems to suffer from the same sort of plagiarism. In fact the numerals in Duce look like they're swiped from Futura. Assuming there is that much plagiarism, MyFonts should definitely dump him/them, and try to figure out how to get any proceeds into the right hands.</p>
      <p>Related:<br>
      <a href="http://typophile.com/node/56010" title="http://typophile.com/node/56010">http://typophile.com/node/56010</a></p>
      <p>New idea: If MyFonts can't get any money back from a dishonorable foundry they should ideally confiscate the fonts and keep selling them, giving the money to the right people, or at least a good cause, like TypeSnitch. Legally however that's probably not workable (and you most probably can't put clauses like that in the contract) so realistically the offended parties will have to deal with the offenders directly.</p>
      <p>hhp</p>
