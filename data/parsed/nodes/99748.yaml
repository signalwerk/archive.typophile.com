    html: |-
      <p>I suspect the plagiarist’s mistake was to assume that Gloria is a typeface revival, rather than an original by a living designer working in an historical genre, derived from various lettering sources.</p>
      <p>There are a lot of distressed fonts, such as the very successful Veneer, closely modelled on old typefaces, so this practice is otherwise quite acceptable—as long as it is done from scans, rather than by “point piracy”.</p>
