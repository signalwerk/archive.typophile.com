      <p>This must be <strong><a class="freelinking external" href="http://myfonts.us/td-VAFxxi" rel="nofollow">Book Jacket</a></strong> by Ursula Suess, Patrick Griffin (Canada Type, 2010) and the capitals |T| &amp; |P| are set in <strong>Book Jacket Swash</strong><br>
      The original design by Ursula Suess goes back to 1972 and it was published by Image Club Graphics.</p>
      <p>-----------------------------------------------<br>
      I found it using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
