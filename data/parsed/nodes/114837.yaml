      <p>Mainly because of /M and even if /R leg is wrong, I would have started with <a class="freelinking external" href="http://www.myfonts.com/search/Eurostile" rel="nofollow">Eurostile</a>, adding a leg to /P to recreate /R, moving /E crossbar downward and cutting the whole thing with a horizontal bar.<br>
      Interesting alternatives: <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/francker" rel="nofollow">Francker</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/ff-qtype" rel="nofollow">QType</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/clonoid" rel="nofollow">Clonoid</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/philatype/olney" rel="nofollow">Olney</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/talbot/kursk-105" rel="nofollow">Kursk 105</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/geom-graphic" rel="nofollow">Geom Graphic</a></p>
      <p>EDIT: ...Or you rely on Fivos' expertise... Definitely Borg 9 which actually looks definitely coming from Eurostile.</p>
