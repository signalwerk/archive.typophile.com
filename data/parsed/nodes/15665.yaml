  html: <p>In 1976, <a href="/wiki/Victor%20Caruso" class="freelinking" rel="nofollow">Victor Caruso</a> revived <a href="/wiki/Rudolf%20Koch" class="freelinking" rel="nofollow">Rudolf Koch</a>'s 1927 <a href="/wiki/Kabel" class="freelinking" rel="nofollow">Kabel</a> for <a href="/wiki/ITC" class="freelinking" rel="nofollow">ITC</a>. The design was a significant departure from the original, with a massive increase in x-height. See the Typowiki <a href="/wiki/Kabel" class="freelinking" rel="nofollow">Kabel</a> entry for more information.</p>
  html_clean: <p>In 1976, <a href="/wiki/Victor%20Caruso" class="freelinking link-lost" rel="nofollow">Victor Caruso</a> revived <a href="/wiki/Rudolf%20Koch" class="freelinking link-lost" rel="nofollow">Rudolf Koch</a>'s 1927 <a href="/wiki/Kabel" class="freelinking link-lost" rel="nofollow">Kabel</a> for <a href="/wiki/ITC" class="freelinking link-lost" rel="nofollow">ITC</a>. The design was a significant departure from the original, with a massive increase in x-height. See the Typowiki <a href="/wiki/Kabel" class="freelinking link-lost" rel="nofollow">Kabel</a> entry for more information.</p>
