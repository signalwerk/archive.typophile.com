    <p>I recently grew from a freelance ad art director to a real agency. I’m in the midst of reworking an old identity and the logo is giving me fits. One of those things where I’ve been at it so long I can’t think straight about it anymore.</p>
    <p>Here are some of the things going on:</p>
    <p>1. Since the same is a bit odd, I wanted to go with a simple type-only logo.<br>
    2. I wanted to increase the readability of the name by visually separating “Eureka” from “ville”.</p>
    <p>I’m down to these. Some I like, some I’m not sure about. I’d like your comments and thoughts. Don’t be kind, if they suck, let me know (I have not kerned these yet). </p>
