    <p>Ciutadella was originally commissioned by Mario Eskenazi’s studio. It is a versatile geometric sans serif, a simple, clean and direct family. Its power resides in an overhaul simplicity that reflects an "open" personality, easily suitable to be used across a wide range of applications, from identity systems to publications...</p>
