      <p>&gt; Mem – Liquid – massive – chaos – Literal meaning: Water there are two mems</p>
      <p>(Questions: how is mem related to massive and chaos?)</p>
      <p>This is a novel interpretation of the Hebrew letter, mem, the thirteenth letter of the Hebrew alphabet. Its gematria or numerical equivalent is 40. </p>
      <p>Mem is suggestive of the Hebrew word for water, mayim, for the name of this letter, mem, has two letters, just like mayim. </p>
      <p>This also alludes to the two kinds of water which existing when the world was created, as described briefly in the book of Genesis. </p>
      <p>When the 'fimament' was created in the sky, the waters were separated into two parts, the upper waters above the firmament, and the lower waters below the firmament. Therefore, the word in Hebrew for waters, mayim, has two mems.</p>
      <p>Much is discussed in Jewish mystical writings about this topic of the significance of the two mems and the relationship between the upper and lower waters.</p>
      <p>First, there was only a single body of water, for the waters were separated later by the creation and placement in the sky of the fimament (whatever that is). As a result, the lower waters cried many tears after becoming apart from the upper waters.</p>
      <p>Our ancient Jewish sages explain this is an analogy of a huband and a wife. They were originally a single entity, and later separated into two different bodies. Then, at the time of their wedding, they are reunited admidst great happiness, celebration, and dancing. So, too, this reoccurs each time during intimacy.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Mehms_5557.jpg"></div><p></p>
      <p>Three kinds of the letter mem, from 3 different popular Hebrew fonts.</p>
