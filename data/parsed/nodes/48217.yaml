      <p>On a more complex level, we explained that the form of the alef comprises three letters: two yuds and a vav. </p>
      <p>The gematria of the yud is ten-two yuds being twenty. A vav is six; the sum of all three totaling twenty-six. </p>
      <p>One of the great names of G-d is the Four Letter Name Y-H-V-H (yud, hei, vov, hei), the Tetragrammaton, or Ineffable Name. The gematria of the Yud (=10), the Hei (=5), the Vav (=6) and the Hei (=5) totals 26, the same as the yud-vav-yud of the alef. Through the connection of their respective gematrios, the alef represents G-d's Ineffable Name.</p>
