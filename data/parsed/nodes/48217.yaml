      <p>Aziz,</p>
      <p>&gt; Rewording: Does Hebrew have Synonyms?<br>
      BTW: Arabic virtually has not.</p>
      <p>Actually, Hebrew has no synonyms. </p>
      <p>Depending upon your definition of a synonym, words which have similar meanings, in Hebrew each word is unigue in meaning.</p>
      <p>Although the word in Hebrew for a man has four types: such as, adam, eesh, ehnosh etc. Each word is special, both in its etymology and its significance. </p>
      <p>Adam refers to his source, being created from adamah, earth, or aleph-dam, the mixture of a G-dly soul and blood, for a person is a combination of G-dly spirit and flesh &amp; blood. The significance of this word in particular is to the intellect, as the term adam is in reference to man's loftiest state.</p>
      <p>Eesh, on the other hand, refers to the emotions, and not to the intellect.</p>
      <p>So, we see that even words which seem like synonyms are very different from each other.</p>
      <p>I think that this is due to the make up of all Hebrew word roots, where the first letter dominates its meaning, combined by the second letter which modifies it, and the third letter further pinpoints its meaning.</p>
      <p>Therefore, since words with similar meanings are spelled differently, it follows that the deeper meaning of each word is different from another. Hence, there can be no synonyms.</p>
