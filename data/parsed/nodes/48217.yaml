      <p>The Meaning of Aleph<br>
      ====================</p>
      <p>The seventh Lubavitcher Rebbe explains that the alef has three different meanings. </p>
      <p>One is aluf, which means a master or a chief. </p>
      <p>The second is ulfana, a school of learning or teacher. </p>
      <p>The third meaning is reached by reading the letters of the word backwards-pela (pronounced peleh)-wondrous.</p>
      <p>===</p>
      <p>Aluf's definition is "master." </p>
      <p>This lets the world know that there is a Creator; that G-d is the Master of the universe, and that there is an Eye that sees, and an Ear that hears. The universe did not simply emerge by itself; there is an omnipotent Force that actually forged the firmaments ex nihilo, from nothing to something. Thus G-d is the Aluf, the Master of the universe.</p>
      <p>Ulfana means "school" or "teacher." </p>
      <p>Not only do we introduce G-d as the Creator of the universe, but also as the Teacher of all mankind. G-d's role as teacher is revealed with His introduction of Torah to the Jewish people. The Torah, with its 613 mitzvos or laws, teaches us what we should do, and what we shouldn't do. Through the Divine wisdom of His book, G-d establishes Himself in the world on the level of the ultimate Teacher.</p>
      <p>Finally, we have the third meaning of alef: peleh, "wondrous." </p>
      <p>Peleh represents the esoteric or mystical level of Torah-Kabbalah and the teachings of Chassidic thought. Known as the "teachings of Mashiach," these secrets of Torah comprise its greatest level.</p>
      <p>from "Letters of Light" by Rabbi Aaron L. Raskin<br>
      <a href="http://www.sichosinenglish.org/books/letters-of-light/02.htm" title="http://www.sichosinenglish.org/books/letters-of-light/02.htm">http://www.sichosinenglish.org/books/letters-of-light/02.htm</a></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Aleph_Torah_3735.jpg"></div><p></p>
      <p>The traditional design of the Aleph, from the "Torah Scroll" font - a design dating back over 3,000 years.</p>
