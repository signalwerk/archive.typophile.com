      <p>And guess what.  Within one month we did get our Torah……some people that did not go to our shul died (two of them) and somehow money was given to us because of them!</p>
      <p>Baruch HaShem!</p>
      <p>I will always love the pomegranate and when the opportunity came for me to really have my own business I had to have the pomegranate for a name.</p>
      <p>Crown is a play on words as this is what the pomegranate is for the Torah.  In my business I try to always point to G-d in wording and product.</p>
      <p>I hope you are still awake!?………..;o)</p>
      <p>Thank you for letting me share with you.  I hadn’t thought of these things for awhile and this has blessed me all over again.</p>
