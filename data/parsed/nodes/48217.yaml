      <p>Sheker is made up of three letters, from right to left: 1) Shin, 2) Kuf, and 3) Reish.</p>
      <p>These letters are for the most part "unsteady" and not solid in their design. Shin is the first unsteady letter, showing its falsehood at the beginning. Kuf is somewhat sturdy in its design, for every falsehood has some truth behind which to hide. Reish is a false-like letter, not having a solid foundation, like most lies with are clearly false at the end.</p>
