      <p>Aziz,</p>
      <p>&gt; A terrible death </p>
      <p>As is said: "You are a tough cookie."</p>
      <p>&gt; 1. Will you sacrifice yourself for your religion?</p>
      <p>Rabbi Joseph Isaac Shneersohn obm wrote about difference between the great Rabbi Akiva and our common forefather Abraham </p>
      <p>Rabbi Akiva sacrificed himself to the Roman occupiers. He even yearned for this, to finally show G-d that he was ready to set aside his own body to be G-d's servant.</p>
      <p>In contrast, Abraham did not yearn for this at all. Rather, Abraham and his wife Sarah, resttled near Beersheva in order to host, feed, and teach travelors about the existance of G-d, and His being the Master of the Universe, in charge of the workings of the world. He was ready to set aside his own soul to be G-d's servant.</p>
      <p>Rabbi Shneersohn concludes that Abraham's path to be G-d's servant was greater than Rabbi Akiva.</p>
      <p>&gt; 2. Where does Man go after death?</p>
      <p>Many people never die at all. Rather, they live in different worlds, as this material world that we know is only a stage in this cycle. This is detailed at length in Jewish mystical literature at length.</p>
      <p>Other people are "cut off" due to actions in this material world (although it would seem that this possibility exists also in other worlds). This is called: "koret hanefesh".</p>
      <p>Similarly, due to other wrongful things and attitudes, some people's bodies are not resurrected at the "end of days", and experience death forever.</p>
      <p>The human body (after the resurrection) in the next world is physical and nourishes the soul, unlike today that the life of the body depends upon its being nourished from the soul. However, the human body of the next world is very unlike our bodies today which age and decay.</p>
      <p>&gt; 3. Does it make difference to die easy or hard?</p>
      <p>Death for some is a movement from one world to another. Death for others is final,</p>
      <p>To die easy for some is a blessing, without pain and with even a smile on the face. Great people knew this event was imminent, and prepared, having no remorse.</p>
      <p>Although many great people died painfully, or hard, this sort of sad ending is viewed ordinarily as a curse. </p>
      <p>There are exceptions, such as dying "al peeh keedush Hashem", giving up for one's live to show people that the person prefers death to disobeying G-d, such as the Jews of the Inqusition, or to show people that they prefer to remain Jewish, like the Jews of the Holocaust, or to protect the lives of other Jews, such as soldiers of Israel.</p>
      <p>In this exceptional case, the victim's souls are automatically forgiven any sins, and enter "gan eden", the world of the soul's reward, directly, with no interuption of punishments.</p>
      <p>Nasrallah however will be the kind that dies with a curse. The merit of his anscestors he lost, and now shall only deserve maximum punishment.</p>
      <p>As they say in Mexico, "Adios."</p>
