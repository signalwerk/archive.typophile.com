      <p>Interesting information; having Jewish heritage on my father's side, Hebrew has always fascinated me. </p>
      <p>I think, though, that you really need to worry about *not* worshiping the created rather than the Creator. Creation is great, but the Creator is greater. Regardless of how you feel, I hardly think it necessary to view Hebrew as a primitive in God's creation; after all, He excels in taking what man has made and using it to work His divine plan. God's Word doesn't need to be limited by human language, which is so provably fallible and mutable (I mean no respect to any language, least of all Hebrew - I love the system of consonantal roots). </p>
      <p>Also, as a linguist, you're not going to get me to buy your origin of the Hebrew aleph-bet; the relation to other alphabetic forms is too strong, and in any case the Hebrew people weren't chosen until God spoke to a man of Ur named Abra(ha)m. </p>
      <p>Another thing you might want to watch is your claims about Christianity. I'm a Christian, and you offended me when you claimed/insinuated that we Christians believe in a devil who is God's equal or in some way diminishing to His power. We do not, or at least I and those of my faith do not; that is known as dualism and is rather antithetical to Christianity. </p>
