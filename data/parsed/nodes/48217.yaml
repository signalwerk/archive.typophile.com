      <p><em>Who has kamatz katan besides Shay Lemorah?</em></p>
      <p>The ISO10646/Unicode proposal documentation for qamats qatan, submitted by Mark Shoulson &amp; Michael Everson, included scans from three publications displaying this form of qamats in a manner visually distinct from qamats gadol. These were</p>
      <p>Riahi, S. M., ed. ספר תהלים סימנים. Jerusalem: Feldheim Press, 2001.</p>
      <p>Shiovitz, Jeffrey, ed. B’kol Echad בקול אחד. New York: United Synagogue of Conservative Judaism, 2001.</p>
      <p>Tal, Shlomo, ed. סדור רנת ישראל: נוסח אשכנז. Jerusalem: Keter Press, 1976.</p>
