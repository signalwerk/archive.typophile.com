      <p>William,</p>
      <p>&gt; I’m having a hard time seeing what these midrashim have to do with the design or use of Hebrew letters.</p>
      <p>The discussion is around the topic of the shapes and the design of Hebrew letters. </p>
      <p>So far, we've basically two types of examples: </p>
      <p>a) the first regarding the letter aleph, and how it is formed from three elements, two letters of the yuhd and one other letter the vov.</p>
      <p>b) the second regarding the difference between the chet and the hei: the chet only having one opening, symbolizing limited acceptance of G-d, and the hei having multiple openings, symbolizing great flexibility and a willingness to accept G-d.</p>
      <p>I think the fact the design of Hebrew letter forms is the subject of analysis clearly shows us that this is significant, to better understand how to correctly form and use Hebrew letters.</p>
      <p>&gt; Also the midrash about matzah and chometz to me seems a little silly. I’m all in favor of being open minded and not arrogant, but it has nothing to do with eating with bread. After all, we eat bread the other 51 weeks, so should be we arrogant except on Pesach?</p>
      <p>You raise a good question. I recall that in yeshiva, this question was raised also.</p>
      <p>The act of eating fluffy bread or flat bread is not the issue. Arrogance and humility result from how we relate towards others, and the manner of importance we reserve for ourselves.</p>
      <p>However, our Jewish sages apply to the act of Jewish people not eating bread on Passover, and eating only matzah, this meaning and symbolism. Kabbalistic yeachings add another dimension.</p>
      <p>When we eat only matzah and rid ourselves of chometz during the eight days of Passover, this accumulated "bittul" lasts all year around, enabling us to eat chometz (the symbol of arrogance) during the rest of the year, and not be affected by it.</p>
      <p>Does this answer your concern?</p>
