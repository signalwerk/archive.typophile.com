      <p>In kabbalistic language, this "flatness" is called: "bittul", while "leavened" is called: "gaavah".</p>
      <p>Bittul allows more to come in, because it thinks less of itself. Gaavah refuses Above (G-d) to enter, because it thinks so much of itself.</p>
      <p>Since we should think more about G-d at Passover, and the miracles that He did for us which we describe at the Seder, we are then required to rid ourselves and our property of chometz, and eat only matzah.</p>
