      <p>Hmmm. In Pirkei Avot (Chapter 5) you have the statement that a lot of miraculous stuff in the Torah was created in twilight before Sabbath of the first week of creation. This includes writing, the stylus, and the actual inscribed Decalogue on rock, siting there since creation for Moses to find. This idea is an effort to solve the problem that the Rabbinic Sages accepted the Greek idea of the Cosmos, or nature according to orderly law. Thus they were uncomfortable with miracles that went against the laws of nature. </p>
      <p>Personally, I find it a charming and clever solution, but quite unconvincing. In any case what engraved that was engraved on the sacred tablets is unlikely to have been the Aramaic script that Judaism adopted after the Babylonian exile--as the sages themselves recognize. Thus I find it a stretch to ascribe, even by Mishnaic standards, sacred status to the shapes of the current Hebrew alphabet, derived from the Aramaic rather than even the ancient Hebrew one. And Moses and the Israelites may well have been using another dialect.  </p>
      <p>Of course, if you go to mystical ideas, you can get anything--or not. I find the Hebrew aleph-bet rather magical, but also the Roman alphabet, which is derived from the capitals of the hated Romans. All scripts in long use have something mysterious and charming about them, in my view.</p>
