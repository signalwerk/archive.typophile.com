      <p>&gt; Reysh – a person – the head – the highest – Literal meaning: Head of man</p>
      <p>Reysh is the name of the twentieth letter of the Hebrew alphabet. Its gematria or numerical equivalent is 200. There are 22 letters (chaf-beit ohti'yot), plus 4 final letter forms. There are also 4 more letters which have "dotted" forms, indicating a different pronounciation. In addition, the 21st letter has a left-dotted and right-dotted form.</p>
      <p>Reysh also alludes to the Hebrew word for head, "rosh". The rosh or head is the highest part of the human body, housing the loftiest part, the brain.</p>
      <p>Rosh is also used in Hebrew to describe the beginning of the year, known as the High Holy Days of Rosh Hashana, the "head of the year" (literally).</p>
      <p>For this reason, a great significance is attributed to the reysh, as Crown Pomegranate demonstrates.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Reish_4523.jpg"></div><p></p>
      <p>Different designs of the reysh from various different Hebrew fonts.</p>
