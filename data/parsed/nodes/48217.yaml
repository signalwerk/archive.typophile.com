      <p>William,</p>
      <p>&gt; Of course, if you go to mystical ideas, you can get anything—or not. I find the Hebrew aleph-bet rather magical, but also the Roman alphabet, which is derived from the capitals of the hated Romans. All scripts in long use have something mysterious and charming about them, in my view.</p>
      <p>I agree that letter forms are in deed very deep representations of something beyong our understanding.</p>
      <p>Kabballistic literature call letters like rocks. When you assemble them together, like putting stones together to form a house, letters joined together make words. When the words are arranged together in a logical sequence, the sentences carry intelligence.</p>
      <p>Assembled Hebrew letters and words carry with them not only intelligence, but some much higher than intelligence. For example, certain sentences in Hebrew also contain acrostics of other key words in the first or last letters of the words. Sometimes, these acrostics even form one of the very names of G-d, or the name of the author of the poetic prayer. Also, the gematria (numerical equivalent) of all the letters in the sentence equals the values of the gematria of significant concepts. Thos can only be done in Hebrew, even if there os great beauty and intelligence in letterforms, such as Roman/Latin, Georgian, Arabic/Urdu, Armenian, etc.</p>
