      <p>William B.,</p>
      <p>&gt; Jewish mysticism is not adhered to by all Jews, including Orthodox Jews. I am not Orthodox, but you can be Orthodox and reject Jewish mysticism...</p>
      <p>Although William you are clearly have a broad base of knowledge, but I beg to very firmly disagree with you.</p>
      <p>The most basic belief of Judaism is in the absolute unity of G-d with one Torah, one People, and one Land.</p>
      <p>This means that the teachings of the Torah (not the Torah scroll, but the entire body of Torah knowledge) can not be divided into: "this part I fathom, I accept", and the esoteric part "this part I can not fathom, I reject".</p>
      <p>No Orthodox Jew, or even an intelligent less-observant Jew, can reject Jewish mysticism. The Vilna Gaon is universally accepted leader of non-Chassidic Orthodox Jewry. He himself was a great kabbalist. He rules for all generations that one could not be a rabbi who rules on matters of halacha without having a thoriygh understanding of the kabbalistic implications of his rulings. If non-Chassidic Jews rejected Jewish mysticism, then there would be no way to fulfill the Vilna Gaon's ruling.</p>
      <p>&gt; and also the distinctive doctrines of Chassidic Judaism.</p>
      <p>All Chassidic sects follow the teachings of Jewish mysticism, known as Chassidus, or in particular Chabad Chassidus.</p>
      <p>The Chassidus developed in depth by the Lubavitcher Rebbes are not on a plane by themselves, subject to be accepted or rejected, like flavors of ice cream.</p>
      <p>For example, among the Satmar branch of Chassidism, Chabad Chassidus is regularly studies. The Kausenberger Rebbes, like most other Chassidic leaders, learn it too, though not as in depth as the Satmar Chassidim. I can cite many examples.</p>
      <p>Among non-Orthodox or non-observant Jews, there is a very high rate (99.9%) lacking in background in knowing well Torah observances and lifestyles.</p>
      <p>I think that this is why Chabad Houses have had unbelievable success in reaching out to many non-Orthodox or non-observant Jews, and even to non-Jews, and after calmly and presenting Judaism is a positive limelight, the response is not rejection, but acceptance. All people relate to kindness, good deeds, morality, and decency. (Chabad's secret formula for success.)</p>
