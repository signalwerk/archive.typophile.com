      <p>The opposite word in meaning to "Sheker" is the Hebrew word, "Emet". Emet means truth. Like Sheker, the Hebrew word, Emet, is also made of three Hebrew letters, 1) Aleph (the first letter of the Hebrew alphabet), 2) Mehm (the middle letter of the Hebrew alphabet), and 3) Taf (the last letter of the Hebrew alphabet).</p>
      <p>Each letter of Emet is sturdy in its design, with a strong foundation, like something truthful and long lasting.</p>
      <p>Ley's look carefully at the letters of the word Emet.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Emet_Torah2_3657.jpg"></div><p></p>
      <p>We see the very meaning of the word, Emet, truthfulness, in the order of the Hebrew letters.</p>
      <p>Aleph is the first Hebrew letter, indicating that truth must show its truthfulness from the beginning.</p>
      <p>Mehm is the middle Hebrew letter, indicating that truth must always be true, throughout everything we do.</p>
      <p>Taf is the final Hebrew letter, indicating that just as things began with the truth, and were true through and through, they too must end up being true.</p>
