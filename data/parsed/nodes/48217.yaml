      <p>Sadly, you can't take the trouble to read what I wrote. And your rudeness is breathtaking. I just take comfort that here you belittle everyone who disagrees with you; it's not just me. </p>
      <p>My point was exactly that Avot doesn't refer to any specific letter forms, Hebrew or otherwise. What you are accusing me of being ignorant of is exactly the point I was trying to make. </p>
      <p>On the translation. The phrase in Avot is "haketav, vehamikhtav (or vehamachtav--the original has no nikud), vehaluchot". The classic translation of Hertz has it, "the writing on the tables, the instrument of writing, and the tables of stone." My translation is "the script, the stylus, the tablets." According to Alcalay, "script" is one translation of "ketav". For example, "ketav rashi" is "rashi script". If my translation is a mistake I would like to correct it, but I first have to hear why it is wrong. It has been checked by one who knows Mishnaic Hebrew very well. Perhaps David would have a view. </p>
      <p>As to the Rabbis being aware that the square script was not likely to be engraved on the Tablets of the Ten Commandments, I see a reference to a discussion where they considered that they may have been written in ancient Hebrew script. This is in the Jerusalem Talmud: Meg. 1:11, 71c. And as I said the rabbis also do refer to current square Hebrew script as 'assyrian' or 'chaldean', i.e. aramaic. </p>
      <p>As you will see by looking at the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Hebrew_alphabet" rel="nofollow">wikipedia article on the Hebrew alphabet</a> the shape of the original Hebrew script--Paleo Hebrew--is very different. For example the aleph does not have the shape you refer to above, and so the midrash you give would not apply.</p>
      <p>So the point is that the your midrashim do not apply to what was written on the Tablets of the Ten Commandments. Clear? </p>
