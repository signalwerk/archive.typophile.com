      <p>i didn't read the entire thread, i'm sorry, it's too long, but i wanted to say several things.</p>
      <p>on the archeological meening of the letter aleph:<br>
      first discoveries of hebrew's origin came out of an archeological dig in "Serabit el-Khadim", located at the sinai peninsula. a few "hieroglyphs" written on the walls of a cave belonged to a script we call proto sinaitic or proto canaanitic, which was influenced by the egyptian hierogliphs. the inscription said "to baalat", which meens a kind of sacrificial to "baalat", the feminin version the canaanite god baal. </p>
      <p>letter <a href="http://www.ancient-hebrew.org/3_al.html" rel="nofollow">aleph</a>, as we know it, was a representation of a the first syllabel of the word "ox" (or in canaanite and ancient hebrew - "aluf", which also means strength).<br>
      the letter <a href="http://www.ancient-hebrew.org/3_bet.html" rel="nofollow">"bet" </a> represents the first syllabel of the word "house" (or in hebrew "bait") and it's proto sinaitic origin is really shaped like the floorplan of the Hebrew nomad's tent found in archeological digs.</p>
      <p>therefor, by the Jeff Benner's lecture, the hebrew word for father - "av" which is composed of two letters - "aleph" and "bet", have a symbolic meaning. it is the "strength of the house".</p>
      <p>i really recommend on <a href="http://www.ancient-hebrew.org/" rel="nofollow">jeff benner's</a> site containing a free audio lecture about the ancient hebrew letters, and much more info.</p>
