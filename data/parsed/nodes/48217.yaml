      <p>Some scholars have suggested that the aleph is Phoenician in origin, and have linked its meaning to that of the ox, suggesting that its form looks like that of an ox.</p>
      <p>Jewish tradition, based upon earlier kabbalistic teachings, reject this view. Instead, a very different significance is attributed to the shape and design of the aleph.</p>
