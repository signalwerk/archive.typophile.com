      <p>Crown Pomegranate,</p>
      <p>I really don't want to discuss Jesus' life with anyone.</p>
      <p>It is clear that as a Christian your view and my view differ a great deal regarding Jesus' status, role, and stature. </p>
      <p>Plus, we live in a benevolent Christian land (although the founding father clearly desired it to be home for all peoples), so I think it unwise to argue the host's faith. Rather, the Jewish attitude is both national pride and patriotism, and to respect adversity.</p>
      <p>To clarify one point that you made though, about the status of the Oral Tradition in normative Judaism, now, then, and since Mt. Sinai (and from even earlier), is that all Jews share one single view. The Torah is one, the writings of the Hebrew explanations, the Oral Tradition, later recorded in the Talmud, Medrash, Kabbalistic books, and elsewhere.</p>
      <p>Jews do not pick and choose, what parts they accept and believe in, or what parts are too difficult for them to observe, or even accept.</p>
      <p>Those who reject parts of the Torah, such as the Oral Tradition are not considered Jews. Thw Karraites are an example of this. (Jesus was not a Karraite.)</p>
      <p>Even Conservative and Reform Jews, who reject parts of Halacha in everyday practice, or concepts that they feel are no longer applicable, are not considered rejected or not Jewish. A Jew is always a Jew. Rather, they fall under the heading in Jewish law, known as "tinuk sh'nishba", a Jewish child who abducted and raised non-Jewish. This explains why his or her attitude is not in compliance with the teachings of Torah.</p>
      <p>So, no one today opposes Torah anymore. We see that even Muslim and Christians are moving closer to improvement of relationships, limited acceptance, and much greater cooperation.</p>
      <p>I truly believe that the more a person learns about the beauty of Judaism, the more they seek to come closer to G-d, and life in accord with the lifestyle that the Torah teaches, be in the life of Torah and mitzvahs, or the Noahide laws.</p>
