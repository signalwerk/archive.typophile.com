      <p>continued</p>
      <p>The Baal Shem Tov once entered Mashiach's heavenly chamber and asked, "Mashiach, when are you going to come?" </p>
      <p>Mashiach responded, "When the wellsprings of your teachings (i.e., the teachings of Chassidus) spread forth throughout the entire world." </p>
      <p>Thus, only when the level of peleh-this level of wondrous esoteric thought-has permeated the world, will the arrival of Mashiach be imminent.</p>
      <p>This can also be connected to a fundamental concept in the Talmud. </p>
      <p>The Talmud tells us that G-d created the world to exist for 6,000 years. The first two thousand years are called Tohu, or chaos. This is followed by two thousand years of Torah. And the final two thousand are the days of Mashiach.</p>
