      <p>Yaronmius-Maximus,</p>
      <p>&gt; the torah or ten comandments were given oraly from god to moses to the people and priests. i’ve searched in the bible and it says nothing about god giving the entire torah book to moses (and nothing about god dictating it to moses). in Exodus 31:18 god gives the ten commandments and other commandments to moses.</p>
      <p>According to Jewish tradition (I guess that its recorded then un the Midrash), Moses transcribed the second set of the Ten Commandments in Heaven before he descended down a second time Mt. Sinai. The first set of the Ten Commandments were also transcribed and miraculously engraved in Heaven prior to Moses' first descent down Mt. Sinai.</p>
      <p>According to Jewish tradition (I guess that its recorded then in the Midrash), Moses transcribed the orally-given instructions of the Torah in thirteen copies of scrolls, given to each tribe, and one copy was preserved in the portable ark.</p>
      <p>The entire Torah existed only in the form of oral discussions. Many of them existed before the times of Mt. Sinai, among the Levites and the scholars of the various tribes. Josepf for example studied these oral discussions with his father, Jacob. Similarly, even earlier, Isaac went to study in the Shem and Aver's school. Likewise, certain kabbalistic-like teachings were given in book-like form to Abraham from an angel. Even much earlier, Adam was given a text in a book-like form from another angel.</p>
      <p>Many generations later, much od this was transcribed first in the Mishnah, and later in the Talmud and other post Talmudic hand-written books, as detailed by Maimonides. Kabbalistic literature was first transcribed in the the very unclear Zohar, but most explanations remained unwritten.</p>
      <p>So, clearly the origins of Hebrew preceded the scholarly discoveries mentioned earlier.</p>
      <p>Although these are great discoveries and fascinating theories, in the end these ancient statements from Jewish tradition always prove to be accurate, although it sometimes takes some time.</p>
      <p>Like Darwinism, the end of these non-traditional theories is just a chapter in history.</p>
