      <p>jupiterboy,</p>
      <p>&gt; So this lifting up of sparks, and lighting of the lamp—how do you interpret these?</p>
      <p>They are two distinct things.</p>
      <p>The "lifting of sparks" is a kabbalistic concept. Basically, the world which know fell down, like all the other worlds above ours (kabbalistic literature describes our physical world the lowest one, of three other non-physical worlds above it), causing "holy vessels" to be shattered. Hence, there are sparks or pieces of these broken vessels which need to be raised, so they ascend back to the place from whence they came. When we do "mitzvahs", various good acts, we cause these sparks to be raised. As a result, the ordinary physical objects we use are transformed into sacred objects.</p>
      <p>A lighting of a lamp is to illuminate the darkness. When this lighting is done for a sacred purpose, like to light the Sabbath candles, or to kindle the Chanukah lights, then those ordinary physical objects are transformed into sacred objects.</p>
      <p>I hope that this is clear.</p>
      <p>Even though the Hebrew letters illuminate and contain sparks, I don't think these discussions can be considered about the meaning of the shapes and design of the Hebrew letters.</p>
