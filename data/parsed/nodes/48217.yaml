      <p>CP,</p>
      <p>&gt; Also I have about 16-20 HF Hebrew fonts...in mirror image...this is a pain.</p>
      <p>These are known as "mirror fonts", made to use in Quark XPress. I innovated this approach to Hebrew fonts in the early ninties on the Apple Macintosh, when Quark was not yet popular.</p>
      <p>Quark allowed the user to flip the text box. Then, Hebrew text could be entered from left to right, but it would look like right to left, as long as you used mirror fonts. The idea was stolen, as were many Hebrew fonts hacked, flipped in Fontographer and sold by pirates or given away.</p>
      <p>I decided to only serve the high end and professional publishers, as there was no income in the low end of everyday users, such as teachers and students.</p>
