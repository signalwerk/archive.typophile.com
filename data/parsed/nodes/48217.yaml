      <p>William,</p>
      <p>&gt; Further, the article cites the fact that the Talmud itself (San. 21a) ascribes the introduction of the Aramaic (called Ashurit, Assyrian) script for writing the Torah to Ezra, seven or eight hundred years after Moshe. </p>
      <p>There is a difference of opinion what "Ashurit" refers to. It is not clear that block script is Ashurit. At that time, the composition of a Torah Scroll could be done in a form of Ancient Greek as well.</p>
      <p>&gt; Hence it is very unlikely that the quotation from Avot 5 that I mentioned earlier, which says that God created ’the script, the stylus, the tablets’ </p>
      <p>"the script" refers to the Hebrew transcribed by Moses on the second set of Tablets;<br>
      "the stylus" refers to the egraving by G-d Himself in the first Tablets;<br>
      "the tablets" refers to the very Tablets themselves.</p>
      <p>&gt; was referring specifically to the square script you are discussing. </p>
      <p>I am unsure of this. I don't think if we date their being used much later, preclides them being used now. Until we are forced to conclude thusly, we can logically presume that this square script was used before hand.</p>
      <p>&gt; The Sages were quite aware that the original Hebrew script was quite different from the then-used square script, which we still use today.</p>
      <p>There is a discussion that a certain script for everyday use, and another script was reserved for sacred texts. You say that the square script was used for everyday use.</p>
      <p>Perhaps, the sacred script was that which we use today in our Torah Scrolls.</p>
      <p>The difficulty with this view, is that mosy kabbalistic analysis that I've seen presents the traditional square script.</p>
      <p>Rabbi Yitchok Ginsburgh of the Gal Einai Institute (<a href="http://www.inner.org" title="www.inner.org">www.inner.org</a>) has a fascinating book on the kabbalistic significance of the Hebrew letters, called "Hebrew Letters". He portrays the Hebrew lettersusing the script we are familiar to see in the Torah Scroll.</p>
      <p>Others do this as well in very recent books.</p>
      <p>Perhaps, these letter forms are in deed ancient, but were not used in books from earlier generations, because these letter forms are not supposed to made into a typeface and used for mundane or profane purposes, due to the holiness of the "taggim", the decorative symbols attached to the tops of certain Hebrew letters.</p>
      <p>There is a great significance to these "taggim" symbols, that Moses cried when he saw Rabbi Akiva give a lesson about their significance, which he failed to comprehend. Only after G-d consoled him, that Rabbi Akiva derived these teachings from the Torah which Moses taught, did Moses stop crying.</p>
