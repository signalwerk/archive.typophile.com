      the letter <a href="http://www.ancient-hebrew.org/3_bet.html" rel="nofollow" class="link-external">"bet" </a> represents the first syllabel of the word "house" (or in hebrew "bait") and it's proto sinaitic origin is really shaped like the floorplan of the Hebrew nomad's tent found in archeological digs.</p>
      <p>therefor, by the Jeff Benner's lecture, the hebrew word for father - "av" which is composed of two letters - "aleph" and "bet", have a symbolic meaning. it is the "strength of the house".</p>
      <p>i really recommend on <a href="http://www.ancient-hebrew.org/" rel="nofollow" class="link-external">jeff benner's</a> site containing a free audio lecture about the ancient hebrew letters, and much more info.</p>
