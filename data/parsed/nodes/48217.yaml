      <p>Shalom GoHebrew,</p>
      <p>You said:<br>
      [Is ’pomegranite’ an allusion to the Talmud’s praise of the rimon, pomegranite? The Talmud compares even the simplest most unlearned Jew to a pomegranite. The pomegranite is packed full of seeds like even the simplest most unlearned Jew is packed fulled of merits and good deeds, mitvahs.</p>
      <p>Even if he or she knows very little about the 613 mitzvahs, or the details about the messiah, nevertheless G-d views him or her in a cherished way.</p>
      <p>As we have seen throughout thousands of years of challenge, and even pain and death, at the hands of other religion’s zealots, these simple Jews stay true to their faith, and reject other avodah-zarahs.]</p>
      <p>What you shared is beautiful.  I remember the fist time I opened a pomegranate.  I was stuck with the beauty of the hundereds of little jewels.  Little riches.  Humm.</p>
      <p>Have you ever experienced a time or a season when G-d is teaching you or showing you something and it keeps coming to mind, showing up in the oddest ways and you are so compelled to search it out?  That happened to me three years ago with the pomegranate.  I hope you have time for this?</p>
      <p>I was unemployed and needed a job.  Having this new found free time on my hands I was creating patterns, and doing drawings that I made cards with.  One was of a pomegranate with the seeds spilling out. A friend of mine said I should go into business.  </p>
      <p>When I listen to people talk I usually visually picture what is being said.  I was at shul and our Rabbi was talking about G-d.  In his talk awesome messages were developing in my minds eye.  He was talking about the clouds when they are full and heavy and dark and very close to earth.  </p>
      <p>Well, it is like G-d is even closer to us at those times and it can be a very intimate time with HaShem, like we are being invited in to His chambers into the private rooms of His home.  (The chambers reminded me of the pomegranate again.)</p>
      <p>Our Rabbi also shared a dream where he was fishing and the fish were so large he was scared.  (He doesn’t fish.)</p>
      <p>So the things that stood out in my mind that day were: Water…Heavy…Big…fish……door….intimacy ….room.</p>
      <p>When I got home ‘pomegranate’ would not leave my mind and had to find out more about the pomegranate and what it meant in a Hebraic way.</p>
      <p>First I found out how it was spelled in Hebrew:  Rimmon is what I came up with online.</p>
      <p>Then I needed to know what each of the letters meant:<br>
      Reysh – a person – the head – the highest – Literal meaning: Head of man<br>
      Mem – Liquid – massive – chaos – Literal meaning: Water  there are two mems<br>
      Noon – Activity – life – Literal meaning: fish dart through the water</p>
      <p>I knew this finding was important and G-d was showing me something…..I didn’t know quite what but my heart had picked up the pace with anticipation and feeling near to HaShem.  I knew it also had to do with what the Rabbi had spoke of???</p>
      <p>So with further study on line I found this:</p>
      <p>1.  The pomegranate is given the unique distinction of being closely linked to the House of G-d – not once, but twice. The first time is when the Tabernacle is set up under Moses’ direction in the wilderness and secondly at the building of Solomon’s Temple</p>
      <p>When Moses is given instructions in the wilderness on how to prepare the vestments of the High Priest, he is told to decorate them with pomegranates</p>
      <p>Then, later on, when Solomon builds the first and what most Bible scholars consider to be the most magnificent house of the L-RD ever, the pomegranate once again plays a significant role. The two main pillars at the entrance to G-d’s house, which are named Yachin and Boaz, are heavily decorated with pomegranates.</p>
      <p>Furthermore, whenever His blessings are upon Israel, they are always manifested by fruitfulness and abundance. Our G-d is a G-d of ever expanding life and the pomegranate is the symbol He has chosen to represent this.</p>
      <p>2.  And in Song of Songs Rabbah (6:11) it is written, "Children sitting in a row studying Torah are compared to the compact kernels of a pomegranate." Thus, the pomegranate seems like the perfect adornment for the hem of the High Priest's robe. It is as though the sound of the bells would be alerting the congregation to the blessings that the pomegranate signifies. </p>
      <p>Since the Middle Ages, this popular pomegranate design continues to be used for ornaments covering the staves on which the Torah scroll is rolled. Usually made of silver, these ornaments are called rimmonim or pomegranates, even when they have different designs, such as towers with bells. These silver rimmonim connote remembrance as well as mitzvoth, Torah, study, beauty, and fertility. </p>
      <p>Why Frames?  Because they teach us to quest for what we need. Because they serve as a trigger for us to recall what is inside. The heart of the matter is that frames create borders that we must transform into open doors.</p>
      <p>Frames cause us to remember, just as the gold-framed stones of remembrance, upon which were engraved the names of the sons of Israel, link us to recall our continuity to the children of Israel, our ancestors, and with a sacred remembrance of our one G-d. So, too, the silver forms of the pomegranate on top of the Torah rollers serve as a memorial.</p>
      <p>TORAH!  I LOVE TORAH.  This is what G-d Himself, Bless His Holy Name, was showing me!  I was so excited.  It wasn’t about me getting a business or anything it was about His Torah!</p>
