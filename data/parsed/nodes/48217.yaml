      <p>With all due respect to my Jewish brothers -- Abraham, 'our father in faith' -- a great many peoples have ascribed divine origins to their writing systems. I take this as evidence of the extraordinary, culture-changing nature of writing, which has seemed miraculous to so many. Recently, I had a good chuckle over a book that proposed to reveal the mystic significance of the English alphabet.</p>
      <p>Note that not all the cultures who ascribed divine origin to writing did so unambivalently. The ancient Egyptians believed writing was an invention of the ibis-headed god Thoth, who is always depicted as a scribe. When he presented his invention as a gift to King Thutmose, the ruler responded that writing would encourage people to be forgetful because they would write stuff down instead of exercising their memories. Socrates relates this story in Plato's <em>Phaedrus,</em> in which he goes on to liken the carefully prepared speeches of the Sophists to written texts and contrasts these with dialogue.</p>
      <p>[PS. Greek mythology associates the pomegranate with the fruit that Persephone ate in the underworld, which obliged her there to spend a third of each year, hence winter.]</p>
