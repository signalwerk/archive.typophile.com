    <p>According to ancient kabballistic literature, both the very origin and shapes of the Hebrew language and alphabet are unique and have special significance.</p>
    <p>Origin<br>
    ======<br>
    Without trying to sound chauvinistic, or holier-than-thou, Hebrew has its origin not like all other human languages, which are men-made, Hebrew is made in Heaven. Hence, it has divine aspects, higher than human intellect.</p>
    <p>We see, simply then, that there may be things about Hebrew which are difficult to understand, but with much effort we can have a better insight into those things. </p>
    <p>Design<br>
    ======<br>
    Hebrew letter forms are attributed with many special truths or explanations, which reflect both their particular shape, their very meaning (of that letters particular name), their 'gematria' or numerical equivalent, and grammatical significance.</p>
    <p>FOR EXAMPLE, one observation of the fact that Hebrew's origin is celestial is its direction from right-to-left. Actually, Hebrew is from left-to-right in its celestial source. This is known from the Medrash, a collection of books featuring various explanations of Biblical topics, phrases, episodes, and events. G-d showed a person a little of life above. The person noticed that writing of Hebrew below is a reflection of how it's done above. So, the opposite or reflection of left-to-right is a reflection of right-to-left.</p>
    <p>There are two other strong indicators that the origin of Hebrew is not simply a man-made creation, but spiritual.</p>
    <p>First, sacred Hebrew text, like the text of the Bible in Hebrew contains an unusually high percentage of "meaning-patterns" because of the Divinely inspired nature of the very text. The arrangement of its letters not only contain a surface meaning when we read the text at face value. </p>
    <p>This special arrangement contain hidden meanings too. Books have written based on serious research discovering that this text has meanings layered beneath the face value of the words. If a certain number value is applied in a pattern between the words, like every 50 letters, then a name or word perhaps is spelled out in these increments of 50 letters. Then, we look at the subject of the text, where the name or word appears very most frequently, and we find that the topic reflects the name or word.</p>
    <p>Similar studies were performed in other large texts in other language, such as Shakespeare, the telephone book, or Encyclopedia Britanica. However, no such patter could appear appear in a way which was a statistical impossibility. This indicates that not only is the text of the Hebrew Bible pre-arranged to include special messages, but the very letters can be used in this super-human manner.</p>
    <p>Second, there is a computer-language-like quality to Hebrew, where the language is structured according to very fine and tight rules of logic, higher than human reasoning.<br>
    For example. Hebrew words are derived from two letter root sources, which are either doubled into a pattern of four letters, or into three letters (with a third letter added to the two letters preceding it). The meaning of the word is related to this two letter root source, with the meaning modified by the second letter, and further modified by the third letter. Verbs are simply these root sources arranged in one of seven manners. The same with adjectives and nouns. The whole system defies our thinking in that it is too perfect and logical. We understand it, we appreciate it, but we see that we would be foolish to attribute it to human intelligence.</p>
