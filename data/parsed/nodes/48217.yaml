      <p>David,</p>
      <p>Shay Lemorah has it all: shva-na, kamatz katan, hataf kamatz katan (because the publisher is in deed a recognized scholar), except for the furtive patach (Koren publishers and Feldhein publishers [recently] has it). The shva-na is a shva with an aterisk above the letter with a circle closely around it.</p>
