      <p>There is a great significance to these "taggim" symbols, that Moses cried when he saw Rabbi Akiva give a lesson about their significance, which he failed to comprehend. Only after G-d consoled him, that Rabbi Akiva derived these teachings from the Torah which Moses taught, did Moses stop crying.</p>
