      <p>Gematria<br>
      ========</p>
      <p>Every letter of the Hebrew alphabet has a numerical value, known as a "gematria". </p>
      <p>The gematria of alef is one, representing the one (or oneness of) G-d, as we say in the famous prayer: "Hear, O Israel, G-d is our L-rd, G-d is One."</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/shma sample_4769.jpg"></div><p></p>
