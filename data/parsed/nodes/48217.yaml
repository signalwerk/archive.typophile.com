      <p>&gt;the curses at the end of the story of Adam and Eve don’t speak to original sin, I don’t know what does.</p>
      <p>The curses are of work, death, and pain of child birth. There is no curse of inherited sin, which has to be removed--that is the distinctive thing in Christianity. That is Saint Paul. It's not overtly in the story; it's Saint Paul's interpretation--or rather misinterpretation.</p>
      <p>As the Encyclopedia Judaica says, in the Hebrew Bible "Satan", in so far as he becomes an individual personality, is "in no sense a rival to God." In Christianity he is a rival to God, though not a fully equal one. This is decisively different. Before you go on telling me and other Jews more about how we don't understand our Hebrew Bible (which many of us can read in the original), I suggest you read something other than the Christian interpretations. </p>
      <p>Abraham probably didn't speak Hebrew, but Aramaic, as he came from present day Iraq, not  further West, where Canaanite--the ancestor of Hebrew, I believe--was spoken. These are all related semitic languages (including Arabic) but are somewhat different. (I saw on TV that there are still Aramaic speaking villages in Iraq.) </p>
      <p>By the way, with regard to Israel's comment that the Dead Sea Scrolls are in script similar to modern Hebrew, that is true. However, that is 1200-1300 years after Moses, and 500-600 years after the exile in (Aramaic speaking) Babylonia. So what script was written on the Tablets of the Ten Commandments is an open question.</p>
