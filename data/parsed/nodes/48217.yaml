      <p>Michael,</p>
      <p>On one hand, seemingly you objected to the condescending tone of the post with your "ethnocentric" observation, but judging from your interest, your overall response, and profile (your quote in particular), you seem attracted to the notion that the shape of letters and their meanings are related to the ways they are used in words. This is an idea unique to Hebrew, as far as I know. </p>
      <p>&gt; I've never heard the tee-pee or bubble junk. Is that something contrived by you? It is almost as if you are demeaning Latin forms to elevate your own.</p>
      <p>Actually, I never heard them either before I read them from the book, "Letters of Light", by Rabbi Aaron Raskin, posted on the Internet at <a href="http://www.sichosinenglish.org/books/letters-of-light/02.htm" title="http://www.sichosinenglish.org/books/letters-of-light/02.htm">http://www.sichosinenglish.org/books/letters-of-light/02.htm</a>.</p>
      <p>Statements about the origins and outstanding significance of the Hebrew language and its letters appear to demean Latin and other forms just to elevate the status of Hebrew. This ia shallow observation, ignoring the greater perception to behold.</p>
      <p>Throughout history, animosity towards the Jewish people and our status as the "Chosen People" has been misconstrued for arrogance, condescendence, and an attempt to demean other peoples. </p>
      <p>The Talmud even observes that "hatred was created at Mt. Sinai". This is a play on words between the Hebrew word for hatred, "seen'nah", and between the name of the mountain where the Torah teachings were given by G-d to the Jewish people, Sinai. </p>
      <p>The basis of those teachings are that the role of the Jews is different than those of other peoples. The Jews are a "chosen people". Unlike the way that most people misconceive, the purpose of this title is not to degrade other non-Jewish people. Rather, the purpose is to emphasize the responsibility of Jewish people who were chosen to follow the 613 directives or mitzvahs of the Torah. Other non-Jewish peoples must follow the seven Noahide laws.</p>
      <p>So, too, here. By stating the Divine origins of the Hebrew language and significance of its letters, the listener can either focus his or her attention positively or negatively.</p>
      <p>Saying this is ethnocentric, arrogant, condescending, and demeaning, is negative. It misses the more important point.</p>
      <p>Instead, one should focus upon the ideas behind what's being said, and learn from them.</p>
      <p>Regarding the Aleph and A, the link to the form of the ox is a popular notion. Jewish tradition rejects this being the source for the Aleph. Instead, we learn that the Aleph like all other Hebrew letters is actually linked to the Yuhd, the tenth letter, as explain in that blog.</p>
      <p>Israel</p>
