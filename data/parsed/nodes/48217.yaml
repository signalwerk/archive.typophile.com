      <p>Let's clarify a basic truth unlining historical dating.</p>
      <p>There two aspects to consider:<br>
      1) The ideas and concepts of a certain account, teaching, or belief;<br>
      2) The transciption of ideas and concepts etc.</p>
      <p>These will likely have two dates of origin.</p>
      <p>There are ideas and concepts of a certain account, teaching, or belief that preceded their transcription, which occurred many decades or centuries later.</p>
      <p>When I refer to kabbalistic though, I refer not to the Zohar. </p>
      <p>Similarly, Rabbi Judah the Prince is attributed to transcribing the Mishnah. This was first main attempt to transcribe many teachings of the Oral Law. Nobody suggests that the ideas and concepts recorded in the Mishnah are original. Nobody suggests that the ideas and concepts recorded in the Mishnah did not exist prior to this composition.</p>
      <p>Jewish tradition suggests that the Oral Law existed at the time the Torah (the Written Law) was transmitted by G-d to Moses, as I mentioned earlier regarding Joseph reminding his father Jacob that he didn't forget the last lesson they learned together, and symbolized this by sending the specific gifts prior to their meeting.</p>
      <p>Actually, the Oral Law existed even before this, as the Fifth Lubavitcher Rebbe, Rabbi Shalom DovBer of Lubavitch, explains in his pamphlet "Kuntres Eitz Chayim" (recently translated in English by Kehot Publication Society <a href="http://www.kehotonline.com" title="www.kehotonline.com">www.kehotonline.com</a>) that the Mishnah in a condensed version of older version of the Talmud (the names were obviously different, but the discussion are the same). The older Talmud is a oral explanation of an older Mishnah, a collection of laws about what to do in specific situations.</p>
      <p>Eventhough Kumran was much later than this (the old Mishnah and old Talmud), among the Dead Sea Scrolls were found a somewhat different composition of practical laws, mimicking many of the decisions presented in the Mishnah and Talmud.</p>
      <p>Although I am a Chassidic Jew and obviously Orthodox, I grew up with a Reform background. </p>
      <p>Many (not all) educated Reform Jews are narrow-minded, and refuse to learn a different perspective than their own. In Orthodoxy, we learn that the more you learn, the greater you realize that you know so little, compared to the enormity of what there is to learn. Only when one accepts that there is much more to learn, can one learn more.</p>
      <p>William, I found the story of the feminist at the Rabbi's Shabbat table not anti-feminist; maybe off-color. Clearly, it was not politically correct.</p>
