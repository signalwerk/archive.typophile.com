      <p>"What is an alef? </p>
      <p>... Every aspect of the alef’s construction has been Divinely designed to teach us something. Contrast this with a child learning to read English for the first time. He is never taught why a capital “A” looks like a teepee and a small “a” looks like a soap bubble stuck to a wall." </p>
      <p>Bless your religious hierarchy for making mystical the formation of the letter. I think though that, for lack of a better word, you are being ethnocentric.</p>
      <p>Sadly most in the West are not interested in the genesis of the A or any other letter. It is purely a calligraphic yearning. But I have never heard the tee-pee or bubble junk. Is that something contrived by you? It is almost as if you are demeaning Latin forms to elevate your own. </p>
      <p>As I teach children the origin of the Latin Alphabet, I explain to them it is the contortions of the East/West "ductus shift" that brought the Latin A from a "Phonecian oxen" (aleph [a pictogram]) to a Latin phonogram. There is a reason for its shape, form and stance! As substantial and significant as yours.</p>
      <p>There are those who maintain the Latin was divinely inspired. Cut away the bottom half of the Trajan caps and find any letter that is duplicated in its top form. O and Q maybe, but put them in word text and it is obvious which they are. Minute differences differentiate letterforms. Even now with the J incorporated it has a longer serif on the left that the I, the L longer on the right... etc. Pretty G-dly in my estimation. Is that not divinity shining through? </p>
      <p>Michael</p>
