      <p>CP,</p>
      <p>If you liked the SIL, perhaps you'll like John Hudson's SBL-Hebrew font. It's for free, for non-commercial users. It's advanced OpenType. I have a sample posted on the lower part of the blog called "Hebrew Type Designs". Also, check out "David".</p>
      <p>Gaining a religious lifestyle later in life helps us contrast the alternative. Many times, aerson appreciates something he or she has after realizing what it's like not to have it.</p>
      <p>It's sad that your great-grandfather parted ways with his brother. Are you in contact with his descendants, your cousins?</p>
      <p>As you may know, Judaism defines a Jewish person by maternal descent or a valid halachic conversion. To be designated Jewish, your maternal ascent must be born Jewish, or converted according to halacha. That means, your mom, her mom, and her mom. Three generations. If that is certain, then you are certainly Jewish.</p>
      <p>If, however, your dad was Jewish, but not your mom, or your maternal grandfather but not his wife, or your maternal grandmother's dad but not her mom, then you are not Jewish in your soul, but you have a lot of "blood" and genes that are Jewish.</p>
      <p>Unlike many other religions, Judaism allots great significance to non-Jews who conduct their lives according to what's known as the Seven Noahide Laws, including eternal reward. In fact, to a certain degree, it is of greater significance to be a Noahide than to be Jewish in that the messiah can not arrive until non-Jews have a choice to become Noahides, just as G-d did not give the Jewish people the Torah until Jethro, Moses' non-Jewish father-in-law converted to Judaism.</p>
