      <p>According to <a class="freelinking external" href="http://www.jewishencyclopedia.com/view.jsp?letter=A&amp;artid=1308" rel="nofollow">this account in the old Jewish Encyclopedia</a>, the pen-written Aramaic script didn't exist until the fourth or fifth century BCE. Hence it couldn't have been used, with understanding, on the tablets that Moshe got at Mt. Sinai.</p>
      <p>Further, the article cites the fact that the Talmud itself (San. 21a) ascribes the introduction of the Aramaic (called Ashurit, Assyrian) script for writing the Torah to Ezra, seven or eight hundred years after Moshe. Hence it is very unlikely that the quotation from Avot 5 that I mentioned earlier, which says that God created 'the script, the stylus, the tablets' was referring specifically to the square script you are discussing. The Sages were quite aware that the original Hebrew script was quite different from the then-used square script, which we still use today. </p>
      <p>In addition you say that the Kabbalistic sources are "ancient". But according to the Encyclopedia Judaica, scholarly opinion is pretty much unanimous that the Zohar, at least, was written in the middle ages, in the 13th century, and only pseudonymously ascribed to Shimon bar Yochai of the first century. And Isaac Luria, the great Kabbalist whom you refer to,  lived in the 16th century. </p>
      <p>Your views here thus seem to be contradicted by both the Talmud and modern scholarship. </p>
      <p>Now you are of course perfectly entitled to accept Kabbalist explanations, and say that Moses de Leon, thought to be an author of the Zohar, was channeling Shimon bar Yochai or whatever. But I am surprised that you think people here will simply accept these views of Hebrew script without discussing alternative views. If you want to convince us,  you will need to address the historical record. </p>
      <p>Also, I must say your dreadful anti-feminist story doesn't help your case. </p>
      <p>However, in any case I would be happy to read the Kabbalistic accounts of the Hebrew letters. Can you cite the references, so we can look them up?</p>
