      <p>William Berkson,</p>
      <p>&gt; Hmmm. In Pirkei Avot (Chapter 5) you have the statement that a lot of miraculous stuff in the Torah was created in twilight before Sabbath of the first week of creation. This includes writing, the stylus, and the actual inscribed Decalogue on rock, siting there since creation for Moses to find. </p>
      <p>I don't think that this refers to writing, as writing certainly existed before Moses' time.</p>
      <p>What does it say (Avot 5:6)? Ten things were created on the Sabbath evening, at twilight...the writing...</p>
      <p>Our sages tell us that this refers to the writing of the Second Tablets. Although if we peruse the face value of the words, it says merely, "haketav" or the writing, so we would think that it refers to writing in general. However, Jewish people believe in the explanations of their predecessors, and don't take things at face value. </p>
      <p>&gt; This idea is an effort to solve the problem that the Rabbinic Sages accepted the Greek idea of the Cosmos, or nature according to orderly law. </p>
      <p>I think that the Rabbinic Sages had much greater insights into knowledge and reality than their Greek counterparts. Why then did so many brilliant minds from among the Greek sages jump ship, and like Ben Hay Hay and Ben Bagg Bagg in Avot (5:21) and become Jewish? If Greek wisdom was to be admired, why was it rejected, and Jewish wisdom prefered?</p>
      <p>&gt; Thus they were uncomfortable with miracles that went against the laws of nature.</p>
      <p>The Talmud, which was the basis of the thinking of the Rabbinic Sages, is filled with accounts of miracles that went against the laws of nature. To rationalize everything was  attempted by the Maskilim in the nineteenth century, but failed. The Rabbinic establishment at the time made every effort to reject this approach. Although Talmudic Judaism appreciates the logic and rationale in the laws of nature, we accept that at times G-d intervenes into nature and does perform miracles, even more often than we recognize.</p>
