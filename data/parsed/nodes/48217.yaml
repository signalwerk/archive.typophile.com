      <p>Funny meeting you here... :)</p>
      <p>&gt; a great many peoples have ascribed divine origins to their writing systems</p>
      <p>It is not logical to conclude that since this claim is untruthful elsewhere, it must also be untruthful here.</p>
      <p>Let me illustrate my point with the following episode, as a logical proof to my argument, and even more.</p>
      <p>The Roman elite enjoyed engaging the wise Jewish sages, relates the Talmud, in dialogues to prove their points of view. </p>
      <p>Later, the early Catholic priests, write the early redactors of Jewish law, known as the Rishonim, that Christianity must be the true religion, and Judaism should be rejected, because most human beings accept the teachings of Jesus, and relatively very few accept the teachings of Torah.</p>
      <p>They argued that even the Torah concludes that the majority rules. Hence, the teachings of Jesus are true, and the teachings of Torah are false.</p>
      <p>Similarly, you argue (or 'chuckle') that Hebrew can not have divine orgins, because many other scripts claimed divinity and were proven non-holy. Hence, Hebrew too can not be holy. After all, majority rules.</p>
      <p>The Rishonim answered this simply. See the sun, moon, and sky. They are in the heavens. If you, and most of the people in the world claim that the sun, moon, and sky, are not in the heavens; they are on the earth below, then the Torah concludes the majority doesn't rule. Because I see the truth.</p>
      <p>So, too, a little over 3,200 years ago, we Jews saw G-d give us the teachings of Torah. We heard thunderous His voice. It was an experience that we relive every year.</p>
      <p>====</p>
      <p>Once, Maimonides was asked how he could know for certain that G-d created the world. The person asked, and left the return, only to return in a short time.</p>
      <p>In the meanwhile, Maimonides took a nearby quill, ink well, and piece of parchment, and drew a beatiful scene. He then tipped the ink well on its side, and placed the quill beside it. The person returned.</p>
      <p>The person asked: "Who made the beautiful picture? Was it you?"</p>
      <p>Maimonides answered, "Oh, the ink-well must have fell over, and created it by accident."</p>
      <p>"Nonsense," said the peson, "things don't happen by chance."</p>
      <p>"Ah, hah," exclaimed Maimonides. "So, too, it is with this beautiful world that we live in. It wasn't created by chance."</p>
      <p>I believe," answered Maimonides, "that G-d created the world, and its creation did not happen by chance."</p>
      <p>===</p>
      <p>The same thing here, John. It is G-d, creator of heaven and earth, who gives us the teachings of Torah each year, it is He that taught us Hebrew. Not some ox, golden cow, or descendants of apes... :)</p>
