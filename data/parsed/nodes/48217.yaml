      <p>from "Letters of Light"<br>
      <a href="http://www.sichosinenglish.org/books/letters-of-light/02.htm" title="http://www.sichosinenglish.org/books/letters-of-light/02.htm">http://www.sichosinenglish.org/books/letters-of-light/02.htm</a></p>
      <p>Design<br>
      ======</p>
      <p>What is an alef?</p>
      <p>... Every aspect of the alef's construction has been Divinely designed to teach us something. Contrast this with a child learning to read English for the first time. He is never taught why a capital "A" looks like a teepee and a small "a" looks like a soap bubble stuck to a wall.</p>
      <p>But Hebrew is different. The design of an alef is actually made up of three different letters: the letter yud or dot above; a yud or dot below; and a diagonal vav, or line suspended in between.</p>
      <p>the letter yud</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Yuhd_Torah_5216.jpg"></div><p></p>
      <p>the letter vov</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Vov_Torah_3818.jpg"></div><p></p>
      <p>The yud above represents G-d, Who is above (or beyond) our comprehension. In comparison to His true essence, our understanding is a mere dot.</p>
      <p>The yud below represents a Yid or Yehudim-Jewish people who dwell here on earth. The only way that we can grasp G-d's wisdom-to the extent that a person is capable-is by being humble. When we realize that we are but a dot or a speck compared to the All-Mighty and All-Powerful G-d, we become a vessel to receive His Divine wisdom.</p>
      <p>The diagonal vav represents a Jew's faith-which unites him with G-d.</p>
      <p>There is another teaching that posits that the suspended vav represents the Torah. Since the Torah is what unites a Jew and G-d, the alef represents this unity between mankind and G-d. This is the design, or form, of the alef.</p>
      <p>We can see that every stroke of the alef (and every other letter as well) has a special purpose, and that there is much more to learning the alef-beis than just mastering its sounds.</p>
