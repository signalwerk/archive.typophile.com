      <p>Clearly, these glyphs representing important Hebrew rules are becoming more and more widespread as they become standard parts of encoding standards and Hebrew typefaces.</p>
      <p>Feldheim Press of Jerusalem, Israel/Monsey, NY and Keter Press of Jerusalem, Israel are two very large and significant Orthodox Jewish Publishers, third and fourth to ArtScroll/Mesorah Publishers of Boro Park, Brooklyn, NY and Kehot Publication Society of Crown Heights, Brooklyn, NY/Kfar Chabad, Israel.</p>
      <p>Keter's prayerbook, סדור רנת ישראל: נוסח אשכנז, is one of the most popular prayerbooks, used by close to a hundred thousand Jews. Maybe much more. Orthodox do not submit to census.</p>
      <p>United Synagogue of Conservative Judaism's prayerbook is used by even more Jews.</p>
      <p>I was told by Rabbi Sue Ann Wasserman that the appearance of the kamatz katan is a standard part of Reform Judaism's prayerbook as well. She writes: "the [new] Reform Siddur Mishkan Tfilla and the Revised Plaut Torah Commentary differentiate between a kamatz katan and a kamatz gadol".</p>
      <p>However, only the smaller Shay Lemorah Publishers of Jerusalem feature also the hataf komatz katan.</p>
      <p>The largest Jewish publishers, ArtScroll/Mesorah and Kehot, employ the shva-na symbol, joined also by Shay Lemorah.</p>
