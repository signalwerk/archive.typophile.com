      <p>William,</p>
      <p>&gt; Thus I find it a stretch to ascribe, even by Mishnaic standards, sacred status to the shapes of the current Hebrew alphabet, derived from the Aramaic rather than even the ancient Hebrew one. And Moses and the Israelites may well have been using another dialect.</p>
      <p>You raise a very valid point, apparently.</p>
      <p>Seemingly, the modern-day Hebrew letter forms do not hold the same significance as drawings which were found inscribed in stones, which we attribute to early versions of Hebrew script (or derived from Phoenician script, as it appears from a design viewpoint). If so, since these Hebrew designs are not similar, certainly then Moses and the Israelites were using another dialect that we know as Hebrew.</p>
      <p>I disagree with this, though like much of which you presented, they make good tales.</p>
      <p>The ancient Dead Sea Scrolls contain hand-scribed Hebrew letter forms very much resembling those of modern Hebrew letter forms. </p>
      <p>The Phoenician-like truncated set of Hebrew letter-forms found from stone engravings indicate two things: a) the letters are a limited set, closer to the language used by the Phienicians, and b) the designs do not contain curve-like attributes, and designs most conducive to enraving in stone. Hence, they are not indicative of what Jewish people have commonly used as ink on parchment.</p>
      <p>Furthermore, the Talmud relates that a special Hebrew letter form was reserved for holy scripts, like in a Torah scroll, tefillin rolls, or a mezuzah parchment (used to this very day).</p>
      <p>Our understanding of the shape and design style of the modern-day Hebrew letter forms are actually not very modern-day at all. Many of the block or square letter forms were thought by most secular scholars to be related to the advent of the printing press over 500 years ago. They were unaware that drawings of hand-scribed Hebrew books featuring block or square letter forms existed prior to the invention of the printing press. </p>
      <p>In fact, these thick square letter designs resembled very old drawings of Sephardic origin. Other ancient drawings, similar to the famous Koren type design, created by the late seventies Israeli type designer, Eliyahu Koren. (This is similar to the popular designs of the late Israeli type designer, Tzvi Narkiss, which stringly resemble the hand-drawn posters created in the Warsaw Ghetto of sans serif font designs - something which was not thought to have existed for Hebrew in the forties.)</p>
      <p>So, clearly we see that "new" Hebrew designs appear to have been created recently, but in truth are derived from similar drawings of Hebre letter forms from very earlier periods, and perhaps back even to the times of the Bible. This brings into serious question of the historical validity of the ancient letter forms engraved in stone. Perhaps, they are a derivative of the Phoenician script which they resemble?</p>
