      <p>This is all interesting. My perspective, as weak as it is, has always been that the mystery schools used folk maps of the CNS, and that the real application had to do with combining various branches of what we now call psychology with initiation to create more fully functioning people. For example, through the study of various archetypes and through initiation the aspirant learns to become all possible minds within the collective human mind and to move with purpose from state to state. This tends to over-write the base level personality and give tools to get around certain limitations that nature and nurture impose. The convoluted nature of the system keeps the knowledge secret to anyone that is not properly instructed and initiated, as the practitioners and keepers tend to believe strongly that they have increased their powers of influence and want to keep these powers concentrated with those that are trusted.</p>
      <p>The encoded geometry, in my mind, is very similar to other methods that are designed to exhaust the mind and eventually create a receptive state for the actual experience of learning how the mind can direct the electro-chemical activities in the physical body.</p>
      <p>Q: Would the script be a component of a model like the tree, or would the tree be a secondary ideation that incorporated the script?</p>
