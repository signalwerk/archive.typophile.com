      <p>I mentioned earlier about the signicance and meaning of the first letter of the Hebrew alphabet, the aleph.</p>
      <p>A graphic of the Hebrew letter, aleph, from the Torah Script font (the Sans version, without the "taggim", or decorative "crowns" or ornaments which appear at the top of certain Hebrew letters):</p>
