      <p>The Shape and Design of the First Hebrew Letter: Aleph<br>
      ======================================================</p>
      <p>The first letter of the Hebrew alphabet is the letter "Aleph".</p>
      <p>Aleph is shaped, according to kabballistic literature as a combination of two other letters, the vov and the yuhd. </p>
      <p>Vov is a tall narrow letter. In forming the aleph, the vov is tilted over, slanying with the top of it closer to the left, and the bottom of it at the baseline further to the right. There is an appriximate 60 degree angle.</p>
      <p>Yuhd is a small fascinating letter, with much of its own significance, to be discussed later. In forming the aleph, two duplicates of yuhd are attached to the tilted vov. One yuhd is attached at the top right-hand side, rotated clockwise to attach to the upper third of the right-hand side of the vov. The other yuhd is attached at the lower left-hand side. The lower yuhd is almost upside-down, but corresponding to the angle of the upper yuhd. </p>
      <p>Significance of This Shape<br>
      ==========================<br>
      Vov symbolized a connection and relationship of the above, the spiritual realm of the heavens, and the below, the material reality in which we dwell. Vov is also representative of "him-shach-chah", "drawing down", from above to below, or "ha-al-lah", "lifting up", from below to above.</p>
      <p>Parenthetically, vov is actually composed of a yuhd, with an extension from the upper body to the baseline. Actually, all Hebrew letters, relates Kabballistic literature, are  derived from the yuhd.</p>
      <p>The two yuhds (two parts of the 'yid') symbolize the two halves of every person. Each person has a heavenly part connected to an earthly part. The goal of the lower earthy part of the person is to draw down and become influenced by the lofty heavenly part (, and as a result become elevated and lift up their being to the heights of the spiritual part).</p>
      <p>Beginning of Creation<br>
      =====================<br>
      Rhe Medrash (a collection of books featuring various explanations of Biblical topics, phrases, episodes, and events) relates that G-d sought a justification for beginning the text of the Hebrew Bible with a certain letter (as we said earlier about the uniqueness of Hebrew which the meaning of every word is most influenced by its first letter). G-d asked then each Hebrew letter to present its case, starting with end of the alphabet.</p>
      <p>Each letter tried and failed to present a winning argument. It cited complimentary words that began with that letter. But in counter-argument, a negative word was also sighted. This continued for each letter.</p>
      <p>Finally, it was beis' turn, the second letter of the alphabet. He argued that he should be chosen, because the word, "boruch", "blessed", bergins with a beis. And living a life is a blessing like creation itself. Well, it was a convincing argument.</p>
      <p>Poor aleph didn't even have a chance to plead its case. G-d noticed how dejected aleph looked, and consoled him. "Don't fret, Aleph," said G-d, "you'll start the Ten Commandments." With hearing that, aleph was happy agasin.</p>
      <p>The Solid Stance of Aleph Shows Truth<br>
      =====================================<br>
      The shape of each Hebrew letter is either sturdy and strong, or unbalanced and weak, from a physics standpoint. When a Hebrew letter is shaped sturdy and strong, this is called "emet", or "truthful". Similarly, when a Hebrew letter is shaped unbalanced and weak, this is considered "sheker", or "falsehood".</p>
      <p>The aleph stands up in a balanced manner, sturdy and strong. It is considered a true letter, and even begins the Hebrew word for truth, "emet".</p>
