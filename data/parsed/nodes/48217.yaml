      <p>&gt; my words were neither untrue...</p>
      <p>Overview of the Composition of Jewry on Earth<br>
      =============================================</p>
      <p>Jews are divided into two categhories: affiliated and unaffiliated.</p>
      <p>Although they are one one people, Jews are different from each other, like every human being is unigue.</p>
      <p>There are however differences and groups.</p>
      <p>The largest categhory are unaffiliated Jews. If you add up the membership of all groups of affiliated Jews, there are much more unaffiliated Jews.</p>
      <p>Among the largest group of affiliated Jews in number in the United States are Reform Jewry. Second are Conservative Jews. In an embarassing third spot are the Orthodoxy.</p>
      <p>Outside of America, be it South America, Europe, Africa, the Middle East, and the Orient, both the Reform and Conservative are very very small, barely significant.</p>
      <p>I am reminded of a secular Israeli's comment why he went to an observant synagogue in Israel on Yom Kippur, when he himself was not observant. Why didn't he just drive to then lone Reform temple in Israel? He replied that if he went to the synagogue once a year, he wanted to get it right.</p>
      <p>So, in Israel, like in most places of the world, unaffiliated Jews perceive "real" Judaism as the beliefs of those follow in the ways of Torah. The rest is just compromise, or even worst, fake.</p>
      <p>Among so-called Orthodoxy, there are many sects, larger and smaller in number, but divided differently in terms of signacance and influence.</p>
      <p>Quantity versus quality.</p>
      <p>In general, these Jews are divided into the Chassidic Jews (the followers of the Baal Shem Tov), and non-Chassidic Jews. In the last twoi hundred years, the Chassidim are becoming a dominant force in Judaism, and the other groups, whether non-Chassidic, or even non-Orthodox, are dwindling in size.</p>
      <p>With the next fifty or 100 years, with the factors of assimilation, population growth, and increased communication, only the group of Chassidic Jews will remain among the affiliated, and the unaffiliated will decrease or assimilate.</p>
      <p>That's the harshe reality, William.</p>
      <p>Among Chassidic Jews, everyone are followers of the holy Baal Shem Tov. They are divided into two branches: the intellectual of ChaBaD (now only the Lubavitchers remain), and ChaGaT, the other groups of Chassidic Jews.</p>
      <p>What does ChaBaD and ChaGaT mean, how are they different?</p>
      <p>There are ten spheres in the Divine chemestry of everything created by G-d. They are:</p>
      <p>1. Chochmah - literally, wisdom; or the first and highest sphere. Like the human body has intellectual parts in the brain, and emotive parts in the rest of the body (modern science says everthing is located in the brain), in the intellectual process, chochmah is the initial stage of the intellect, conception of an idea.</p>
      <p>2. Binah - literally, understanding; or the second and decisive sphere. In the intellectual process, binah is the next stage of the intellect, the break-down and analysis of an idea.</p>
      <p>3. Daat - literally, knowledge; or the last and most important sphere. In the intellectual process, daat is the next stage of the intellect, the practical application of an idea.</p>
      <p>Chabad then is symbolized by this acronym of the three parts of the intellectual process.</p>
      <p>ChaGaT is an acronym for the next three spheres, the first three parts of the emotions.</p>
      <p>Basically, they represent two valid manners to live life as G-d desires.</p>
      <p>The Chabad way is much more difficult and demanding than Chagat in terms of living life practically. Chabad however is much richer, more rewarding, and has the ability to become integrated into unaffiliated Jewish society, not be influenced (to the amazement of other Orthodox Jews), and rather make amazing inroads. </p>
      <p>Thousands of unaffiliated Jews have joined the ranks of Chabad in the last few decades. Chabad Houses have sprung up around the globe in greater number recently, than even during the lifetime of their leader. Chabad is at fore front of disseminating knowledge of Judaism at <a href="http://www.chabad.org" title="www.chabad.org">www.chabad.org</a>, even among non-Jews.</p>
      <p>It is not without exaggeration to claim that if we consider the huge numbers of "Friens of Lubavitch" (which now number many hundreds of thousands, including heads of state, unaffiliated Jews, and a growing part of the masses), Chabad is most dynamic force in Judaism today.</p>
      <p>As the first Lubavitcher Rebbe prophezed in the days of the Vilna Gaon: "Yad hachassidim al haelyona". In the end, the Chassidim will prevail!</p>
