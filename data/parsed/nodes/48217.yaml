      <p>Wow, a lot of posts in a row. </p>
      <p>So I'm not Catholic; I'm Christian. And original sin has nothing to do with sex unless you're Constantine. But we're off that subject, so let's get back to letterforms.</p>
      <p>It's actually pretty easy to trace the lineage from pictoral-initial systems like hieroglyphics to the Hebrew characters. The general idea is that, as an outgrowth of ideographic/logographic systems, characters came to stand for the initial sound of the words they depicted. Aleph, for instance, and not to pick on this thread, is believed to come from a depiction of an ox: <a href="http://en.wikipedia.org/wiki/Aleph" title="http://en.wikipedia.org/wiki/Aleph">http://en.wikipedia.org/wiki/Aleph</a><br>
      Of course, the exact histories are obscure and uncertain, but historical records give linguists good clues as to the origin of writing systems where the language is known. </p>
      <p>This goes back to my point about God being greater than physical limitations; if He wants to put special meaning behind writing, He'll work it out. There's nowhere in Scripture where God teaches Moses the aleph-bet for writing the Torah; it's the message that counts. That's what makes hidden meanings all the more miraculous.</p>
      <p>On another note, gohebrew, you said the following:<br>
      "Sound is related to the meaning of the shapes of Hebrew letters, as discussed in Jewish mystical literature. The shape and movement of the mouth is the basis for particular shapes and sounds of Hebrew letters. Does this exist is other languages as well?"</p>
      <p>Yes, it is known to happen, although I don't really think Hebrew falls into this category. Writing systems where letterforms are based on phonetics are called featural codes. The prime example here is the Korean writing system, Hangeul (<a href="http://en.wikipedia.org/wiki/Hangeul" title="http://en.wikipedia.org/wiki/Hangeul">http://en.wikipedia.org/wiki/Hangeul</a>). Each character that represents a sound does so based on phonetic criteria, or so they say.</p>
      <p>Of course, this story is contested as well, but that's another story. In any case, Hangeul is hardly Hebrew.</p>
      <p>By the way, have you read about the possibility that the numerical values of Hebrew letters given for a description of a vessel (For us, it's I Kings 7:24) shows that the ancient Israelites actually had a very close approximation of the value of pi, the ratio of a circle's diameter to it's circumference? I find that incredibly cool.</p>
      <p>Peace,<br>
      JT</p>
