      <p>David,</p>
      <p>About the intentional neglect of use of the vov (and the yud) in words which have nikkud is certainly the custom in most modern Hebrew text. In Jewish liturgy, from the booklet on Birkat Hamazon, the grace after meals, to the Siddur, the traditional prayerbook, inclusion of the vov (shuruk, or holam) always appear. </p>
      <p>The exceptions, as I understand it, in intentional, to teach an important lesson, as in Biblical literature.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/nikkud_vov_4528.jpg"></div><br>
      .<br>
      .<br>
      Regarding the dagesh in the peh of ulfana, the author did not place this either. I figured that perhaps in Aramaic, a dagesh does not appear here. So, I did not include it.<p></p>
      <p>As the original text was all in English, I was unsure if the word ended in a hei oran aleph.</p>
      <p>Regarding the dagesh in the gimmel of geula, you might be right. Although you know, most dagesh is missing in modern Hebrew with nikkud, except for the beit, kaf, peh, and taf. The dagesh in other letters is merely grammatical.</p>
