      <p>This argument is guaranteed to go nowhere, because if different folks take different, contradictory texts--Jewish, Christian, and Islamic--as the authoritative answer, then each ends with their own belief, end of story. </p>
      <p>Aziz, there is no direct reference to democracy in the portions you quote, and I know other Muslims think that democracy is compatible with the Quran. And there are many Muslim countries explicitly devoted to ideals of democracy. And Googling, here is one such discussion of the issue: <a href="http://www.4islamicschools.org/images/Democracy%20in%20Islam%20Final-Yasmeen%20Qadri.doc" title="www.4islamicschools.org/images/Democracy%20in%20Islam%20Final-Yasmeen%20Qadri.doc">www.4islamicschools.org/images/Democracy%20in%20Islam%20Final-Yasmeen%20...</a>  </p>
      <p>As I indicated earlier, even within Jewish tradition, I think that claim that the letter shapes of the current Hebrew script is sacred is problematic. The statement in the Mishna (Pirkei Avot, chapter 5) is that God made the stylus, the script, and the tablets (of the Ten Commandments). It does not say what script, and I believe the sages of the Talmud somewhere discuss that the script on the tablets would not have been the current square, pen written script. The sages were well aware that it was not the original Hebrew script, and the tablets may well have been inscribed with an Egyptian script, which Moses and other Israelites who were literate would have understood at that time.</p>
      <p>The point of the Talmud 'word play' discussions is to make a moral or theological point, and not that the form of the script is sacred. The message that the text is giving is what is supposed to be sacred, not the form of the script itself. </p>
      <p>The midrashim on the letter shapes that Israel cites are I believe relatively late. One of the links given by Israel quotes the founder of Chabad Chassidism, which Israel is a follower of. And he is late 18th century. The Zohar, the basic Jewish mystical work, is 13th century. These are recent inventions, as Jewish history goes, being 2000 or more years after Moses. </p>
      <p>Also, in the view of almost all scholars, the Zohar is pseudepigrapha, meaning it is falsely attributed to someone else, in this case a sage who lived a thousand years before it was written. For a rationalist like myself, this seriously undermines its credibility.</p>
      <p>I want to learn from the mystical tradition, but I take it with a huge amount of salt, because as an historian of ideas, I know that it is a mish-mash of eclectic sources. A primary source of the ideas about God in the Zohar is Plotinus, the Neo-Platonic Greek philosopher. He, not the Torah, is the source of ideas about 'emanations' of God creating the world. Isaac Luria, in what is the most original idea in Jewish mysticism that I know about, reversed this and said that God created the world by withdrawing from part of it. </p>
      <p>This is all interesting, but much of Kabbala to me is capricious and even heretical by older standards in Judaism. And there are many others who are of the same opinion.</p>
