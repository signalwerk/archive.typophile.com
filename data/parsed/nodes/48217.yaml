      <p>The Hebrew Letters of Daled and Reish<br>
      =====================================</p>
      <p>There are two letters in the Hebrew alphabet, daled and reish, which are similar in both design and meaning.</p>
      <p>In the visual examples reproduced at the bottom of this post, you can see how the two letters are similar in design.</p>
      <p>But how do we see how these two letters are similar in meaning? In the following passage from the well-known discource known as "Basi L'gani", an explanation is presented about their similarity in meaning, too:</p>
      <p>"...daled and reish are similar not only in their form but also in their meaning.</p>
      <p>"The letter daled is related to the word 'daloot', which means "poverty".</p>
      <p>"In the spiritual realms, it refers to the Sefirah of Malchus, "that has nothing (d'les lah) of its own" [i.e., it merely receives and transmits the downward flow of Divine beneficence].</p>
      <p>"In the realm of the soul, this state [of poverty] is reflected in the power of speech, that merely receives and articulates [lit., "enclothes"] the spiritual faculties that are above it.</p>
      <p>"For example, in the expression of intellect or emotion [speech contributes nothing].</p>
      <p>"The letter reish is similarly related to the state of poverty, as is evident from the verse that says (Proverbs 10:15): "The ruin of the poor is their poverty." Likewise, -- "[Give me neither] poverty nor riches." "</p>
      <p>   -Basi L'Gani, ch. 6 (Sichos In English)<br>
         <a href="http://www.sichosinenglish.org/books/basi-legani/09.htm" title="http://www.sichosinenglish.org/books/basi-legani/09.htm">http://www.sichosinenglish.org/books/basi-legani/09.htm</a></p>
      <p>[Question<br>
       ========</p>
      <p>&gt; For example, in the expression of intellect or emotion [speech contributes nothing].</p>
      <p>I understand about emotion, that does has physical expression or feelings (internal physical reactions in the body). </p>
      <p>But how is intellect (which are non-physical thoughts or brain waves) any different than speech (which are also non-physical words or sound waves)? Isn't intellect also "poor" like speech? ]</p>
      <p>A picture of the Daled (left) and Reish (right). </p>
      <p>See how they are similar in form.</p>
