____________ <br> <br>Get to know our new, attractive Affiliate Program: Become <br>our partner and receive the chance to earn money with our <br>many renowned and successful typefaces. In contrast to <br>affiliate programs offered by others, our membership <br>process has been streamlined, so joining is easy. <br>Participation is free-of-charge, and you may place your <br>link to us wherever you wish. Of course, there are further <br>valuable advantages to partnering with us. <br> <br>Check them out here: <br><a href="http://www.linotype.com/16841/linotypepartnerprogram-doc.html" target="_blank" class="link-external">http://www.linotype.com/16841/linotypepartnerprogram-doc.html</a> <br> <br> <br>____________________________________________________________ <br> <br>2.  Frutiger Next Central European: New typographic <br>    possibilities for Eastern European languages. <br>____________________________________________________________ <br> <br>It has become impossible to imagine typographic life <br>without the Frutiger family of typefaces, masterpieces that <br>come from the world famous type designer Adrian Frutiger. <br>Linotype Library is pleased to offer Frutiger Next for a <br>couple of years now, which is the most complete and modern <br>version of this classic family. Now all weights of the <br>Frutiger Next family are available in Central European font <br>format as well. With one mouse click, you will be able to <br>set text in the Eastern European languages with this <br>timeless typeface. Frutiger Next Central European belongs <br>to the Linotype Library</p>
