      <p>============================================================ <br>LinoLetter 06/04 <br>============================================================ <br> <br>! Welcome to the sixth issue of the LinoLetter in 2004 ! <br> <br>INTRODUCTION: <br>As welcome to summer, Linotype Library is offering a few <br>new and interesting novelties to our customers, along with <br>our traditional product line. <br> <br>First off, we are pleased to announce our new Affiliate <br>Program; all interested webmasters may participate in this <br>new business opportunity. <br> <br>To celebrate the ascension of the 10 new EU-member states, <br>Linotype Library is now specially offering all 18 weights <br>of Frutiger Next in Central European font format. With this <br>stroke, one of our most famous typefaces can now be used to <br>set all Eastern European languages.  <br> <br>Our latest Value Pack offers the five best fonts from the <br>Sassoon family, a real typographic treat. The Value Pack <br>offers an attractive price, making this a good opportunity <br>to give this timeless, beautiful, and flexible type family <br>a spin. <br> <br>Lastly, we would like to invite you to experience the <br>"Roaring 20s" once again, specifically its exciting, <br>constructivist typefaces. <br> <br>Have fonts of fun! <br> <br> <br> <br>------------------------------------------------------------ <br> <br>IN THIS ISSUE: <br> <br>1.  Linotype Affiliate Program: Earn money with your <br>    homepage! <br> <br>2.  Frutiger Next Central European: New typographic <br>    possibilities for Eastern European languages. <br> <br>3.  Sassoon Value Pack: Five fonts from the renowned <br>    Sassoon family of typefaces. <br> <br>4.  Constructivist Type: A review to the "Roaring 20s" and <br>    its typefaces. <br> <br> <br>____________________________________________________________ <br> <br>1.  Linotype Affiliate Program: Earn money with your <br>    homepage! <br>____________________________________________________________ <br> <br>Get to know our new, attractive Affiliate Program: Become <br>our partner and receive the chance to earn money with our <br>many renowned and successful typefaces. In contrast to <br>affiliate programs offered by others, our membership <br>process has been streamlined, so joining is easy. <br>Participation is free-of-charge, and you may place your <br>link to us wherever you wish. Of course, there are further <br>valuable advantages to partnering with us. <br> <br>Check them out here: <br><a href="http://www.linotype.com/16841/linotypepartnerprogram-doc.html" target="_blank">http://www.linotype.com/16841/linotypepartnerprogram-doc.html</a> <br> <br> <br>____________________________________________________________ <br> <br>2.  Frutiger Next Central European: New typographic <br>    possibilities for Eastern European languages. <br>____________________________________________________________ <br> <br>It has become impossible to imagine typographic life <br>without the Frutiger family of typefaces, masterpieces that <br>come from the world famous type designer Adrian Frutiger. <br>Linotype Library is pleased to offer Frutiger Next for a <br>couple of years now, which is the most complete and modern <br>version of this classic family. Now all weights of the <br>Frutiger Next family are available in Central European font <br>format as well. With one mouse click, you will be able to <br>set text in the Eastern European languages with this <br>timeless typeface. Frutiger Next Central European belongs <br>to the Linotype Library</p>
