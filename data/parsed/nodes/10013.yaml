    html: "<p>\"has the accessibility symbol\" <br> <br>That's not an accessibility symbol. It's a 'handicapped' symbol or 'wheelchair accessible' symbol.  <br> <br>accessibility &gt; physical disability. I'd seriously consider trying to come up with your own if you can. Check out what Apple use's for their icon.  <br> <br>I co-opted it for a quick icon on our site: <br><a href=\"http://www.courts.state.mn.us/\" target=\"_blank\">http://www.courts.state.mn.us/</a> <br> <br>Now, if you're trying to design a sign for handicapped parking, then it makes a lot of sense, but for accessibility in general, not so much.</p>"
    html_clean: "<p>\"has the accessibility symbol\" <br> <br>That's not an accessibility symbol. It's a 'handicapped' symbol or 'wheelchair accessible' symbol.  <br> <br>accessibility &gt; physical disability. I'd seriously consider trying to come up with your own if you can. Check out what Apple use's for their icon.  <br> <br>I co-opted it for a quick icon on our site: <br><a href=\"http://www.courts.state.mn.us/\" target=\"_blank\" class=\"link-external\">http://www.courts.state.mn.us/</a> <br> <br>Now, if you're trying to design a sign for handicapped parking, then it makes a lot of sense, but for accessibility in general, not so much.</p>"
