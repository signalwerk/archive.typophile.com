    html: "<p>&gt; <i>What happened to that classy Baskerville Old Face mark?</i> <br> <br>You mean this beauty? Oh, it still gets kicked around the various hallways of bureaucracy. The Baskerville mark is basically the government's happy, shiny corporate logo, whereas the Helvetica Neue treatments are departmental identifiers. You can get your fill of Canadian government logos, symbols, word marks, and assorted style guides here: <br> <br><a href=\"http://icnet.ic.gc.ca/publication/\" target=\"_blank\">http://icnet.ic.gc.ca/publication/</a> <br> <br><img src=\"http://www.typophile.com/forums/messages/83/24878.gif\" alt=\"Government of Canada word mark\"></p>"
