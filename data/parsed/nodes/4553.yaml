    html: "<p><i> 1. find an optimal (soft) bubble, given the contrains and inititials; <br>2. optimal bubble defines basic spacing in that two bubbles sit touching each other; do I under you idea correctly?</i> <br> <br>Yes, this is correct. When my computing capabilities are back to normal (recovering from a hard drive crash at the moment), I'll try to find time to post some examples. <br> <br><i>3. there are likely to be some conflicts, by nature, given constrained input, so a solution like kerning may still be needed;</i> <br> <br>Possibly, although I'm not sure that there actually would be conflicts. Kerning already presupposes that there is an ideal, non-contextual relationship between pairs of letters. What I'm talking about is a different method at arriving at that relationship. Since the desired relationship is determined by the shape of the letters themselves, I have trouble imagining conflicts in a spacing system that is also based on the shape of the letters. The trickiest thing I've come up with so far is trying to make bubbles that ideally space both uppercase-to-lowercase and uppercase-to-uppercase, but then most default spacing/kerning for uppercase-to-uppercase is already a tight compromise, and with appropiate postive tracking I don't think the bubble spacing for uppercase sequences such as AV would be disproportionately tight. <br> <br><i>4. in any case, the result shall be transferable to rectangular box+kern paradigm.</i> <br> <br>Yes, this is a thought I had a few days ago when looking at Ross' latest tests. The bubble approach doesn't necessarily have to be implemented in layout applications in order to be useful: it could represent a device- and format-independent way to specify and store desired spacing, which could then be optimally converted to sidebearings and kerning pairs by font software, as appropriate to particular formats.</p>"
