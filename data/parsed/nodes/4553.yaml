    html: "<p>Gerald L wrote, in response to my comment that 'fine typography can look after itself': <br> <br><i>Not without the tools to do so. As much as I'd like to agree with the rationale of your argument I do believe that Gerald has a very strong point here.</i> <br> <br>This is perverse. I'm the one talking about the need to make fonts with good quality basic spacing  <i>and</i> with smallcaps, ligatures and other tools of textual articulation. Gerald G is the one saying that fonts for 'fine typography' don't need any kerning, because the fine typographer is obviously going to do all the spacing himself. Gerald G's definition of fine typography seems to be 'that which is made by fine typographers'. On this we basically agree, and my point is that fine typographers are going to do fine typography, one way or another, while everyone else is going to do the typography that you give them the tools to do, and most of the time the tools are going to remain on the 'factory settings'. Hence, if you care about anything other than what fine typographers get up to, those factory settings are important. Since I've only met a handful of fine typographers in my life, and many thousands of 'font users', I'm not inclined to trust that the majority of type is going to be finely set.</p>"
