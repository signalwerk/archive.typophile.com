    html: <p><i>That's in effect the Kindersley approach.</i> <br> <br>The idea of spacing envelopes that relate directly to the shape of the letter is not at all similar to Kindersley's approach. Kindersley's approach is based on identifying the optical centre of the letter and aligning to it the mathematical centre of what is still a rectangle. The sides esablished by Kindersley's method, as applied by him, are parallel, vertical sides. I'm not sure whether locating the optical centre is of practical use in defining a spacing envelope, but I suspect not. The purpose of a spacing envelope is to define the minimum distance between any given point on the outline and the nearest part of an adjacent glyph. This requires a different kind of analysis from that used by Kindersley to identify the optical centre and measure from it a fixed amount to a vertical sidebearing.</p>
