nd anybody with decent eyesight can in fact see the difference. But you choose to forget he said that... <br> <br>Metal is limiting. Half point sizes are useful. This is obvious to anybody with half a brain, and the objectivity to use that half properly. Face it, move on. <br> <br>(John, your post requires some thought, so I'll get to it soon.) <br> <br>hhp <br></p>"
