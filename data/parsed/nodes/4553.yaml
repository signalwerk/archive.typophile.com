t- this sort of thing applies to Latin too. For example the fact that metal kerns could break off (causing expense) caused some people to make them more modest, or avoid them altogether. <br> <br>&gt; Metal has been part of humanity for a long time. <br> <br>Not compared to wood it hasn't. So let's use wood instead. Or maybe bone. <br> <br>&gt; Hrant feels calligraphers are inferior. <br> <br>Pure distortion - although certainly a useful coping mechanism... <br> <br>&gt; are they planning to make all type <br>&gt; just one size in this new technology? <br> <br>What about you? <br> <br>-- <br> <br>Gerald, it strikes me that your main problem is that you're not separating fonts from their use, specifically by third-parties. Maybe because you are such a fine printer yourself, and you can use your own fonts to great effect - but as a rule a font isn't used by its creator (at least not for like 4 centuries now). Without this separation you can't think about this properly. <br> <br>---- <br> <br>&gt; please ignore Hrant's lies. <br> <br>You seem like such a frustrated little boy. <br>It would be useful if you apologized. <br> <br>hhp <br></p>
