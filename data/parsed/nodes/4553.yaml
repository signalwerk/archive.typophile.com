    html: "<p><i>Had not professional typographers got involved with digital type, and forced the way...</i> <br> <br>Yes, but again my point is that they did get involved, and their involvement isn't any kind of surprise. This is precisely what I mean by fine typography looking after itself or, less abstractly, fine typographers looking after fine typography. Gerald didn't wait for someone else to start making digital fonts the way he wanted them: he started making them himself. There is a DIY culture in fine printing that is very admirable, whether it is rebuilding presses from spare parts, machining new parts to repare casters, or hacking digital font layouts to include ligatures. Fine typographers generally need less help than the majority of font users.</p>"
