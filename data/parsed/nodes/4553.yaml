    html: "<p>John, your idea is very interesting, mathematically. I think of it as a contrained optimisation. Suppose you draw a rough intitial bubble -- optimisation needs something to start with -- for each character; and define contrains  to be a well spaced set of words -- the more, the better, especially some tough pairs which I have only a slight idea of what they are. Then, plausible goals might be: <br> <br> 1. find an optimal (soft) bubble, given the contrains and inititials; <br> 2. optimal bubble defines basic spacing in that two bubbles sit touching each other; do I under you idea correctly? <br> 3. there are likely to be some conflicts, by nature, given constrained input, so a solution like kerning may still be needed; <br> 4. in any case, the result shall be transferable to ractangular box+kern paradigm. <br> <br>I was thinking of a soft bubble that can grow/shrink depending on size/tracking. It might be handy. The real difficulty, in my thinking, should be defining the representation of the bubble, and how two bubbles interact during the optimisation. <br> <br>Well, that's my perspective without any type design experiance.</p>"
