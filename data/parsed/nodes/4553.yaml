    html: "<p>Thomas wrote: <br> <br><i>What we really want to do is make optically even spacing by roughly equalizing the total amount of space between letters. If you stick an envelope on a shape like \"O\" and you stick two O's together, they end up a little too far apart (at least in my experiments).</i> <br> <br>That's not my experience. The edge of envelope closest to the horizontal extremes of the O would be the same distance as a typical straight sidebearing on the same letter, so why should the envelope space two Os any further apart than sidebearings? <br> <br>The illustration below shows the relationship of outline and spacing envelope, and also the relationship of the latter to typical rectangle sidebearings for the same letter. There would be no difference between spacing two Os with sidebearings or with the envelope; the difference would be when you put O next to K,V,W,X,Y. Such combinations would need kerning in the sidebearing model, but not in the envelope model because it would conform to their shape and allow them to nestle closer to the O. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/35428.gif\" alt=\"Spacing envelope for O\"> <br> <br>[The terminology is awkward, because we're falsely distinguishing the sidebearing approach from the envelope approach; sidebearings define an envelope: a rectangular envelope. Laurence used the term 'spacing outline' for what I am calling the envelope; something like this might be better, because the envelope does not necessarily envelope the letter shape: if it produces good spacing, parts of the letter can extend beyond the envelope (the example I used above was the outer tips of the serifs on the v).]</p>"
    html_clean: "<p>Thomas wrote: <br> <br><i>What we really want to do is make optically even spacing by roughly equalizing the total amount of space between letters. If you stick an envelope on a shape like \"O\" and you stick two O's together, they end up a little too far apart (at least in my experiments).</i> <br> <br>That's not my experience. The edge of envelope closest to the horizontal extremes of the O would be the same distance as a typical straight sidebearing on the same letter, so why should the envelope space two Os any further apart than sidebearings? <br> <br>The illustration below shows the relationship of outline and spacing envelope, and also the relationship of the latter to typical rectangle sidebearings for the same letter. There would be no difference between spacing two Os with sidebearings or with the envelope; the difference would be when you put O next to K,V,W,X,Y. Such combinations would need kerning in the sidebearing model, but not in the envelope model because it would conform to their shape and allow them to nestle closer to the O. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/35428.gif\" alt=\"Spacing envelope for O\"> <br> <br>[The terminology is awkward, because we're falsely distinguishing the sidebearing approach from the envelope approach; sidebearings define an envelope: a rectangular envelope. Laurence used the term 'spacing outline' for what I am calling the envelope; something like this might be better, because the envelope does not necessarily envelope the letter shape: if it produces good spacing, parts of the letter can extend beyond the envelope (the example I used above was the outer tips of the serifs on the v).]</p>"
