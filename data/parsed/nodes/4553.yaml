    html: "<p>On the subject of kerning/spacing: three sytems have been discussed: <br>1. sidebearings <br>2. envelopes <br>3. optical centres <br> <br>None of these are, when automated, sufficiently multivariant. Kerning (ie manual over-rides) is always necessary for the type designer/typographer to exercise a subtler understanding of the way the typeface works.  <br> <br>The first two propose that it is the purpose of spacing to create even color, and that this can be achieved by averaging out the contiguous white space between the perimeters of glyphs. <br> <br>The idea of optical centres is slightly different, in that it takes account of the positive \"mass\" of the glyphs. <br> <br>However, in my experience designing type, there are many variants that have to be assessed: <br> <br>-The rhythm of vertical (and to a lesser extent diagonal) stems <br>-The closest distance between near-points of adjacent glyphs <br>-The amount of \"penetration\" a glyph makes of its neighbor's territory  <br>and of course, <br>-The contiguous space between glyphs. <br> <br>Then, no matter how comprehensive the system in the font, it can never satisfy the demands of every setting. Type size and tracking affect kerning, as do the idiosyncracies of specific words. <br> <br>These variant factors interact. Design is a discriminating process which makes judgements about how to balance their often conflicting demands. <br> <br>No matter what technology is used to set type -- metal, photo, digital -- there must always be a place for \"manual kerning\" which over-rides the default, because spacing is a question of proportion, and there is no such thing as an ideal proportion that will please everybody. <br></p>"
