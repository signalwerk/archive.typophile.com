If you are seeing something as you say you do it may be the following. As I remember Monotype England sold digital laser printers and systems to the newspaper industry. What you may be seeing is the evils of "early digital technology". And John and others are blaming it on "hot metal technology". <br> <br>I wish to avoid falsehoods getting foisted upon the unknowingly by pretenders. <br> <br>Furthermore I am not stupid, or "commercially evil" as one member has indicated. I know you and Adobe often suffer from similar abuse. <br> <br>But before I go I must thank you for the opportunity to clarify matters about the Monotype System. <br></p>
