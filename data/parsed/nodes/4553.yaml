    html: <p><i>But letterspacing "requires individual attention". Sorry that is just a fact. To presume the professional is incapable of fine tuning his or her display matter is rather more than a little arrogant.</i> <br> <br>But I <i>never</i> -- not even once -- suggested that professionals were incapable of or should be prevented from fine tuning spacing. I value the precision of manual kerning options in professional page layout software very highly, and if I were handsetting metal type I'd probably be one of the guys getting in there with the file and the hair spacing. But the majority of text that is going to be set today is not being handled by professional typographers. As a maker of fonts, I see it as my contribution to ensure that as much of that text as possible looks decent and is readable. Since I can't rely on the average 'typesetter' to kern it well, I have to make sure that the factory kerning is as good as it can be.</p>
