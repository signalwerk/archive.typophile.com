    html: "<p><i>The first two propose that it is the purpose of spacing to create even color, and that this can be achieved by averaging out the contiguous white space between the perimeters of glyphs.</i> <br> <br>Actually, the envelope idea -- or 'spacing bubble' --, as I conceive it, does not presuppose a particular purpose in spacing: it is a mechanism to achieve spacing, not a model of how things should be spaced. The spacing that results is determined by the shape of the bubble, which in turn is determined by the designer, who may or may not focus on 'averaging out the contiguous white space'. What I like about the bubble idea is that the ability to control the shape of the bubble and, hence, the interaction of the bubbles of different letters allows one to directly address two of the crucial aspects of spacing that you identify: the closest distance between near-points of adjacent glyphs, and the amount of 'penetration' a glyph makes of its neighbor's territory. At the moment, these can only be addressed by kerning: effectively we have default spacing (rectangles) and exceptional spacing (overlapping or spaced-out rectangles). The bubble allows the designer to address what we now implement as kerning as an aspect of default spacing. <br> <br>Ross and I spent some time testing the bubble approach recently, and I'm very impressed by the results. The one area that is troublesome is when parallel diagonals are in proximity, e.g. VA, in which case there is a tendency for the spacing to be too tight unless the bubble includes non-intuitive spikes above the x-height. Such features are why I think this approach is only practical if a computer program handles the bubble definition algorithmincally while the designer simply spaces letters: actually designing optimal bubbles is difficult, although not impossible.</p>"
