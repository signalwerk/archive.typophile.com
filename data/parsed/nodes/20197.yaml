      <p>There is something about the S getting narrow in your photo example that seems to work better than the slow slope you are using. It's wacky looking to do what they do in the photo- in a way - but also strangely orthodox too. It seems to read more smoothly. It's hard to say way I feel this way but I do.</p>
      <p>BTW I don't mean copy what they did - but maybe riff on it.</p>
