      <p>The lowercase s is very odd indeed, but thats what I think gives the face it's unique character - and attracted me in the first place - it is not academic, optically sound &amp; logical... but it conveys a sense of the street vernacular I am getting more interesting in, and I think it's important to bring this sensibility to type design. Perhaps I could do another version with a more predicatable s, something that designers like yourself may feel more comfortable with. Thanks for the feedback!</p>
      <p>--<br>
      RD Granados<br>
      Stereo Type Haus</p>
