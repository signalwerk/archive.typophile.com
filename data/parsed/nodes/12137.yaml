    <p>MISSALE consists of the typefaces INCANA and LUNEA. </p>
    <p>MISSALE INCANA is a fine <a href="/wiki/calligraphic" class="freelinking" rel="nofollow">calligraphic</a>, two stroke <a href="/wiki/Roman" class="freelinking" rel="nofollow">Roman</a> versal typeface based on <a href="/wiki/Herbert%20Thannhaeuser" class="freelinking" rel="nofollow">Herbert Thannhaeuser</a>s Erler Versalien.</p>
    <p>MISSALE LUNEA is a new designed <a href="/wiki/calligraphic" class="freelinking" rel="nofollow">calligraphic</a> <a href="/wiki/Uncial" class="freelinking" rel="nofollow">Uncial</a> typeface with a feminine note.</p>
