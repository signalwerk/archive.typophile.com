    <p>Here is the 2 solutions our client like best from a choice of 18. At this stage<br>
    our client is having problems choosing which one is best so any input would<br>
    be greatly appreciate.<br>
    Client background: Dr.Torrington is a Los Angeles based doctor specializing<br>
    in helping cure people with drug addition. His approach is pharmaceutical<br>
    in nature. The Snake Icon has 3 main segments representing Biology, Psychology<br>
    and Sociology (elements that relate to the well being of a patient and the<br>
    path to curing addiction)</p>
