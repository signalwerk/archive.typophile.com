      <p>The fonts used were Eidetic and Clearview. Both slightly modified.<br>
      Clearview was a custom weight (by hand) with a slightly lowered crossbar on the "H", and the serif Eidetic was modified by adding a larger shoulders on the "R"'s.<br>
      A lot of custom type design, as well as icons were created on previous versions that were<br>
      not picked by client, but these were the final two and at this stage these are the only two<br>
      I will be showing, so we can get the project finished and implemented. To give proper credit, the icon and the positioning of the type was created by my business partner Bradley Bishop.<br>
      I picked the type faces and did the final modifications and re-traced the icon.</p>
