    <p>hi there,</p>
    <p>I'm a newbie to the this board and need some advice from you Typography gurus.</p>
    <p>I need an elegant, cursive and organic font for a Floral Designer.  He's looking for a free-flowing, modern font that would have some kind of  floral feel to it.  </p>
    <p>His target clients (Donna Karan, Dior, Giorgio Armani, Barney's NY, etc) would be found in magazines such Martha Stewart Weddings and W Magazine.</p>
    <p>He creates the Floral Arrangements for high-profile clients events such as weddings and events.</p>
    <p>Thanks a million...</p>
