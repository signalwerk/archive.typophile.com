  html: <p>Does anybody know the font used at the movie "I robot"? <br>At the advertisments and website there are several fonts in use. I mean the font at the end of the movie showing the credits.</p>
  html_clean: <p>Does anybody know the font used at the movie "I robot"? <br>At the advertisments and website there are several fonts in use. I mean the font at the end of the movie showing the credits.</p>
