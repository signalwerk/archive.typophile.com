    html: <p><span class="caps">OCR</span>-B comes close, but not quite, though it has the characteristic straight ends in contrast to the other <span class="caps">OCR</span>’s that are even more monoline and have round ends. <br>I did a search for Printed Circuit Board (<span class="caps">PCB</span>) software, but the two available programs available for <span class="caps">OS</span> X did not include fonts like the one I mean… (one used Chicago, the other a sticktype of premade&nbsp;artwork).</p>
