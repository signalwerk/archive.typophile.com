    html: <p>OCR-B comes close, but not quite, though it has the characteristic straight ends in contrast to the other OCR's that are even more monoline and have round ends. <br>I did a search for Printed Circuit Board (PCB) software, but the two available programs available for OS X did not include fonts like the one I mean... (one used Chicago, the other a sticktype of premade artwork).</p>
