    html: "<p>Look inside your computer… It’s the type they use on the boards like video-cards and such. The S is a giveaway. It’s a lot like the type generated by the ‘titling machines’ you could fasten onto your drawing board in the ‘old days’, eg build up out of straightish segments. <br>I went to see the movie today&nbsp;; ) and the credits sequence animation is like circuitry builing up et cetera. <br>For the font itself: I guess a circuitry drawing program would probably include (a) similar font(s) or you could try speciﬁc&nbsp;sites.</p>"
