    html: |-
      <p>Can't identify it but it's a font for sure (more samples on their <a class="freelinking external" href="http://www.savora.pt" rel="nofollow">website</a>). Could be bespoke and exclusive for the brand. Reminds me of <a class="freelinking external" href="http://www.myfonts.com/fonts/typefolio/petala-pro" rel="nofollow">Petala</a>. Pro version has a single storey /<a class="freelinking external" href="http://www.myfonts.com/fonts/typefolio/petala-pro/bold/glyphs.html#glyphs/593980/306" rel="nofollow">a</a> and /<a class="freelinking external" href="http://www.myfonts.com/fonts/typefolio/petala-pro/bold/glyphs.html#glyphs/593980/286" rel="nofollow">g</a> available as alternates though OpenType features which should get you pretty close (only remaining top small spike). Other option, out-of-thebox but less close to me: <a class="freelinking external" href="http://www.fontshop.com/fonts/family/flex_bold_monday" rel="nofollow">Flex</a> (backslanting italic /a and /g)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_4329.png"></div><p></p>
    html_clean: |-
