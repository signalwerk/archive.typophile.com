    html: |-
      <p>Well, they’re not hot metal in the usual sense: that term normally applies to slugs cast on Linotype/Monotype/Ludlow machines.</p>
      <p>And they have nothing to do with ASCII art. Generally speaking, “cuts” (the illustrations and/or decorative elements you see in these specimen books) were cast from stereotypes (otherwise known as “matrices,” or “mats”), and mounted on wood bases.</p>
