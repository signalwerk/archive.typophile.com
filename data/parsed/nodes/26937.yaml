  html: <p>hello folks.  i am trying to finish a cd label that will function as the cover of the cd as well (we aren't going to print a cover...just the cd in a clear jewel case).  i'd like to use a small font that can be clean and clear at a small size.  arial narrow and verdana seem to be logical choices, but i have been looking at small pixel fonts, and wondering if they would come out well in print.  one font that i like (and would like to find an equivalent) is craig kroeger's  "standard" font (www.miniml.com).  if anyone could recommend similar "simple" fonts that look good small in print, please let me know. <br> <br>best future, <br>john <br><a href="http://www.johnhudak.net" target="_top">http://www.johnhudak.net</a></p>
