    html: |-
      <p>top right:<br>
      the grey-dot-name has same colour as the background bar, therefore belongs/has a relationship with it. The bar bar is curved (here only in one end) and it could be understood as being a 'slice' of a massive dot.</p>
      <p>Black bar with grey name:<br>
      was an earlier stage. And experimenting with the dot, as a dot only. And a thought that missing letters rarely is an obstical in reading, one often 'fill in' the missing parts in order to make up a meaning.</p>
      <p>Black dot:<br>
      just as it is, using same process as above.</p>
      <p>Next 3:<br>
      Playing with the negative space in the d. And funny enough.. placed behind it, and moved a bit - it's an door opening inwards for the viewer. A nice welcome I thought, maybe not appropriate... U know.</p>
      <p>Last 4:<br>
      the grey ink-dot could on all items produced be placed at a different position. The Biz card might have the dot below the name, the letterhead above, the comp-slip behind it and so on... managing the dot in reality. I made it 'ink-like' to create a contrast to the typed out name, to add life and emotion/excitement.</p>
      <p> : )   roger over</p>
