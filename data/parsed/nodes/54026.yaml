      <p>Also...</p><div class="imageWrap"><img src="http://typophile.com/files/DotsInOrder_5905.jpg"></div><br>
      it is intersting to know that the size/distance of a space between items is what makes our brains group them together.<br>
      Again this could be used to reflect the ability to manage 'things'.<br>
      I'm very fascinated by perception. The eye sees, but it transmits different information to the brain. One kind of information is the info about size, shape, colour and alike. The other is orientation, where it's placed and it's position in relation to other objects.<br>
      That's is why illusions confuses us.<p></p>
