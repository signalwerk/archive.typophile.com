      <p>And here's the full character set from the index:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/FiedlerBaroqueGothic9-fullset_5564.jpg"></div><p></p>
      <p>By the way, those nicks in the letters in the top row I don't think are part of the design, just production glitches. The full character set samples are tiny, about 6 pt. size.</p>
      <p>(Man, I'd get a lot more fonts made if I only had to do that many characters.)</p>
