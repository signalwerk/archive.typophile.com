    html: |-
      <p>Thanks Mark.<br>
      I did some web checking. Apparently all Photo-Lettering published in the way of specimens was a big book of one line phrases, each composed in a different design, that regular purchasers could use to order from.  Also, I seem to recall seeing such a book in a university library a few years ago.<br>
      This is just a guess, based on the 1963 book cover and your comment, that a Fox-tail Gothic design inspired by Fiedler Baroque Gothic 9 would use fox-tail terminals for:<br>
      •   2 3[top and bottom] 5 6 6 9<br>
      •   C[top and bottom] G[top] J Q S[top and bottom]<br>
      •   a c[top and bottom] e f j q r[book title shows ball terminal but I find it discordant] s[top and bottom] t y.<br>
      •   $[top and bottom] &amp; ?<br>
      Does any of this look out of place? Did I miss some -- perhaps K k R?<br>
      Don</p>
