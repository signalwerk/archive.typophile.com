    html: |-
      <p>Many thanks Mark!<br>
      I appreciate your effort in producing a clean scan of the 6 point character set -- which omits only a few characters which seem seem generally obvious to predict.<br>
      This is gold to my eyes.<br>
      It's great to be able to confirm analytical design expectations and to discover where they erred.<br>
      The book title was misleading on the relative presence of foxtail and ball terminals. It showed only one ball or semi-ball terminal -- the r -- but I now see that there are actually quite a few of them.<br>
      Don</p>
