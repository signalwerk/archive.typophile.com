      <p>Sylf, your question is a bit cryptic. I'll also be cryptic. There is in Brill Italic the substitution</p>
      <p>    sub \uni043D by \uni043F.Serbian ;</p>
      <p>where I would have expected <code>\uni043F</code> on the left hand side. Here are the roman and the corresponding italic obtained with XeLaTeX.</p>
      <p><img src="/sites/default/files/old-images/brill_serb130613_6659.png"></p>
      <p>Added later on (I guess it is now less cryptic).<br>
      Also XeLaTeX does not accept selecting the Serbian language for the font family Brill; after calling<br><code>\setmainfont[Script=Cyrillic,Language=Serbian]{Brill}</code><br>
      XeLaTeX does not give the Serbian italic when using <code>\textit</code>, probably because Serbian is not defined for the regular. I had to declare a separate font for the italic to get it above. I don't know if this is a XeLaTeX bug or not but Arno has Cyrillic/Serbian also for the roman, avoiding such a problem (and giving a different looking output for cyrillic small letter p and cyrillic small letter n).</p>
      <p><img src="/sites/default/files/old-images/arno_serb130616_3776.png"></p>
