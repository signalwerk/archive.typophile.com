      <p>Sylph, I do not work with Serbian glyphs. But let me reference an older thread about PDFs made in Word 2010. The problem was that with Opentype Postscript flavor fonts, MS Word always converted to curves when going to PDF, regardless of the embeddability of the font.<br>
      I do not know (but I would like to know) if this was fixed in Word 2013. I do not know what Word version you are using. I do not know if this is related to what you are seeing. Glad I could help!<br>
      <a href="http://typophile.com/node/72404" title="http://typophile.com/node/72404">http://typophile.com/node/72404</a><br>
      Read what Si_Daniels has to say in the middle.</p>
