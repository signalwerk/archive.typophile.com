  html: |-
    <p>In my pursuit of finding the typefaces that correctly render both <strong>the combining diacritics</strong> and Serbian versions of Cyrillic italics letters I've just checked how does <em>Brill</em> fare. Weirdly, it only fails to convert one letter properly, but what is weird is that even though the letters appear correctly in <em>Word</em>, they do not when one creates a PDF.</p>
    <p><img src="http://s23.postimg.org/vsyn320ln/sshot_71.png"></p>
    <p>Why does it happen?</p>
    <p>The only typefaces that manage to do these things correctly are two SIL ones, even ALPHABETUM, which seems to have the most complete set of characters, does not have the correct italics.</p>
