      <blockquote><p>
      As for Brill: why would a Cyrillic <em>n</em> in italics produce a correct Serbian cursive Cyrillic <em>p</em>?
      </p></blockquote>
      <p>Because the Unicode character <code>043D</code> is </p>
      <p>043D	CYRILLIC SMALL LETTER EN</p>
      <p>and the substitution rule in Brill as extracted above from the italic using FrontForge says to substitute uni043D, i.e. cyrillic small letter en, with uni043F.Serbian i.e. the Serbian variant of Unicode character 043F, namely </p>
      <p>043F	CYRILLIC SMALL LETTER PE</p>
      <p>That is how Unicode fonts work. The font contains substitution tables to apply for given scripts and languages. </p>
      <p>How that particular substitution appeared that way in Brill is a bit mysterious to me.</p>
