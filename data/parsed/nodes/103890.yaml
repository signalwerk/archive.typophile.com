    html: |-
      <p>Definite bug in the OTL GSUB code for the Serbian pe. The VOLT source has a typo and the lookup currently reads<br>
      <code>c.en -&gt; c.pe.Serbian</code><br>
      when it should read<br>
      <code>c.pe -&gt; c.pe.Serbian</code></p>
      <p>Thanks for catching that. I'll get a fix to Brill a.s.a.p.</p>
    html_clean: |-
