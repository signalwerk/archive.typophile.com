    <p>Dear all,</p>
    <p>I'd like to create an OpenType font. I know there are some programs to do this, but I'd like to do it the hard way:-) Moreover, I'd like a student to work on this as part of a project.</p>
    <p>I'd appreciate any pointers to find information about OpenType font files and how to generate them. Ideally, I'd like to create the font files using some Java library. If there's any Java library that you can recommend then please let me know.</p>
    <p>Thanks in advance for your help.</p>
