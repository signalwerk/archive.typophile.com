    html: |-
      <p>Using Javascript (which is not Java), I created <a href="http://typophile.com/node/94235" rel="nofollow">IndyFont</a>. It uses outlines the user draws with InDesign, so I didn't have to write a font <em>drawing</em> program. The script gathers outlines, converts them into Type 1 instructions, adds a OTF wrapper around it and dumps it into a file.</p>
      <p>I already had extensive experience with the <a href="http://partners.adobe.com/public/developer/en/font/T1_SPEC.PDF" rel="nofollow">Type 1 font format</a>, the OTF part came from <a href="https://www.microsoft.com/typography/otspec/" rel="nofollow">Microsoft's Typography site</a>.</p>
      <p>That's all you need to get started -- well, that and ~3 months of continuous (nights only) work. It took me that long to write something to export an InDesign-drawn rectangle as a working font. YMMV.</p>
      <blockquote><p>Ideally, I'd like to create the font files using some Java library.</p></blockquote>
      <p>That's not really "the hard way" is it?</p>
