    <p>We wedding photography and we need a font to write the bride and groom's name and we need to have a elegant and understated font. </p>
    <p>We like Corinthia, Lily wang, Olicana smooth, Dear joe, Satisfaction, Affable and Passions conflict.</p>
    <p>We would like your opinions on these and if you have a better font suggestion please let us know. Thank you.</p>
