      <p>Corinthia and Olicana are far and away the best quality of the typefaces you mention. Be sure to set the bride and groom's names in the online sampler and I think you'll find the connections on the other fonts are not so good.</p>
      <p>You might also like <a href="http://www.fontshop.com/fonts/downloads/font_bureau/avalon/" rel="nofollow">Avalon</a>, <a href="http://www.fontshop.com/fonts/downloads/font_bureau/biscotti_ot/" rel="nofollow">Biscotti</a>, <a href="http://www.fontshop.com/fonts/downloads/sudtipos/la_portenia/" rel="nofollow">La Portenia</a>, <a href="http://www.fontshop.com/fonts/singles/sudtipos/oxida_ot/" rel="nofollow">Oxida</a>, <a href="http://www.fontshop.com/fonts/singles/borges_lettering/enchanted_regular/" rel="nofollow">Enchanted</a>, <a href="http://www.fontshop.com/fonts/downloads/sudtipos/brisa/" rel="nofollow">Brisa</a>, <a href="http://www.veer.com/partner/link.aspx?i=1048&amp;c=4&amp;p=products/typedetail.aspx?image=UMT0000387#specimen" rel="nofollow">Kewl Script</a>, and <a href="http://www.veer.com/partner/link.aspx?i=1048&amp;c=4&amp;p=products/typedetail.aspx?image=UMT0000149" rel="nofollow">Ministry Script</a>.</p>
