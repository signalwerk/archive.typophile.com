    html: |-
      <p>what i see is that you could take the glyph you have and move towards turning it into an abstract object representing something from childhood - I see a jack in your object.</p>
      <p>If it was to be a community concept -  then consider moving away from symmetry and see if the elements when overlapping make a more unified form. just don't use four overlapping hands...  ;)</p>
      <p>Remember A good logo Identity mark should also make sense when sent with a fax machine... also the use of color should not be the only source of unity between the glyph and the text elements. . . Mimic the fonts style in the glyph exaggerate a character in the name to be the repeating element in the glyph...</p>
      <p>You will find that if you have at least three elements that unify the two parts of the logo you will have a solid design that your client would be proud to pay you for.</p>
      <p>just my thoughts . . .</p>
