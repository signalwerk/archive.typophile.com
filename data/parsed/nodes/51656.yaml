      <p>The type looks decent, but I feel that the mark is too generic.  To me it communicates nothing, and the closest I get to a meaning is 'community', but that's because shapes in a circle make me think of Ubuntu.</p>
      <p>Do you have any other graphic ideas?  I'd love to see some other ideas explored.</p>
      <p>What is your strategy?  What 2 or 3 words are you trying to communicate with the logo (knowing that let me see how well you're achieving your goal when I see it)</p>
      <p>Either way, best of luck, keep going at it!</p>
