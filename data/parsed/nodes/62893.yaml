    html: "<p>In my humble opinion, the linking part (name?) is either too thin on the S or too wide on the t (in other words : either linking too much on one side, not enough on the other). Have a look at Parisine plus for a good example of how to solve that problem - there might even be a Parisine Plus Italique/Italic.</p>"
