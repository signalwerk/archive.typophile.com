    html: <p>I think this logo would be far stronger without the ligature. It's a bit forced and unnecessary and Caecilia has enough interest on its own without the modification. My compliments on your typeface choice. Just keep it simple and concentrate on the symbol/imagery surrounding the logotype.</p>
