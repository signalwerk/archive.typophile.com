    html: <p>Kaizer, one place to visit is the Empire State Building and the Crysler Building (nice Art Deco), also visit Central Park. When you get into Central Park (on the park drives) and want to know where you are look at the light poles, they give you the nearest cross street, like W7201, West 72nd street number 1 light pole.</p>
