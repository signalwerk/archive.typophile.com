    html: <p>When will you be there? July 20-24 is TypeCon which would certainly satisfy your type/design itch. At the TypeCon planning meeting there was talk of organizing some typographic tours. Grolier club, Subway, Press shops etc. Even if you aren't in NYC during typecon, check out their calendar for ideas, they may also have "things to do and see" info. <br> <br><a href="http://www.typecon.com" target="_blank">www.typecon.com</a></p>
