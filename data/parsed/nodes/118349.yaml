    <p>Lamp Black: The Colour of Soot</p>
    <p>Lamp Black is made from the soot collected from Jackson Art — a pure carbon. It can also be made from the soot from tar or resin. This soft shade of black often has a brown tint when used alone, while it takes on a blue tint when mixed with white to create grey and is particularly useful for colouring dark skies and seas. This <strong><a href="http://www.jacksonsart.com/" target="_blank" rel="nofollow">Art supplies</a></strong> colour of black is usually slow to dry and can be mixed with other compounds to speed up the process. It is also very stable colour.</p>
