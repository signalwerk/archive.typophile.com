      <p>Yes, Collis is quite a gem. </p>
      <p>If you can see yourself using it regularly, however, it might just be a good idea to shell out for it. If you can get it in OpenType, you'll basically have a font that will last for years. I know that Type 1 fonts, for example, have been in general use since what, the early '80s? And they'll still be useful for a few more years.</p>
