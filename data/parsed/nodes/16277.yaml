  html: |-
    <p>I need a font for a booklet in which space is a rare good. So I am looking for a font with the following attributes:</p>
    <p>1) Well readable at 9pts<br>
    i.e. comfortable for long-distance reading</p>
    <p>2) Condensed</p>
    <p>3) Typographic workhorse<br>
    the whole nine yards: medieval, tabular, smallcaps, ligatures, weights, etc.)</p>
    <p>4) Serif</p>
    <p>I know this asks much, but the project is like that. I'd be very grateful for your suggestions.</p>
