    <p></p><div class="imageWrap"><img src="http://typophile.com/files/daxion_3782.jpg"></div><p></p>
    <p>I didn't had any jobs this afternoon so I thought I would be giving a try at <a class="freelinking external" href="http://fontstruct.fontshop.com/" rel="nofollow">FontStruct</a>. This is what I came with and I'm quite happy, but I would love to hear your comments about it. I'm making it freely available at <a class="freelinking external" href="http://fontstruct.fontshop.com/fontstructions/show/daxion" rel="nofollow"> Daxion font at FontStruct</a> and you can use it for commercial projects if you find its 178 characters suitable.<br>
    I hope you like it, cheers!</p>
