    <p>Please help me identify the font used in the Wacom logo.<br>
    My client's logo is using the exact same font. Notice the open, double storey "a". Other items to note are the "w" and the "m" which are just flipped.</p>
    <p><a href="http://wacom.com/index.html" title="http://wacom.com/index.html">http://wacom.com/index.html</a></p>
    <p>and my client's logo: <a href="http://www.kammeraadfinancial.com/" title="http://www.kammeraadfinancial.com/">http://www.kammeraadfinancial.com/</a> </p>
    <p>Thanks in advance!</p>
