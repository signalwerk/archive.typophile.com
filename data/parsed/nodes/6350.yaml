    html: "<p>Paul: <br> <br>This last post is a huge improvement. There is definitely a difference between \"3-D\" and \"cheesy 3-D\", and this last post is not \"cheesy\". You have a much better use of your positive/negative space. <br> <br>Before seeing your last post, my main comment was going to be that I usually see brands on a more vertical plane (on the side of cattle). I didn't immediately think brand when seeing your graphic. I realize that the branding iron would probably be seen this way, but there is no handle/pole coming from the brand to identify it as the iron. <br> <br>Aloha! <br>Scott</p>"
