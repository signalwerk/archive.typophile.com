    html: <p>Hi Paul <br> <br>...well this is the best thing to communicate with designers all around the world. I could never meet i greek who designs a logo for a ranch. <br> <br>Anyway my view is that you need to make less lines and more tight composition. I would propose to keep dark the width of the letters (as in your last proposal) and if possible to avoid the inner light of the fire so the flames can just be black and describe the shape of the letters. If you sure need to keep the inner parts of the fire you could maybe use them dark and the outer shape with a fat and calligraphic outline. <br> <br>I realy had a hard time to explain in english what i mean and hope you understood. If not is reasonable why. <br> <br>christos</p>
    html_clean: <p>Hi Paul <br> <br>...well this is the best thing to communicate with designers all around the world. I could never meet i greek who designs a logo for a ranch. <br> <br>Anyway my view is that you need to make less lines and more tight composition. I would propose to keep dark the width of the letters (as in your last proposal) and if possible to avoid the inner light of the fire so the flames can just be black and describe the shape of the letters. If you sure need to keep the inner parts of the fire you could maybe use them dark and the outer shape with a fat and calligraphic outline. <br> <br>I realy had a hard time to explain in english what i mean and hope you understood. If not is reasonable why. <br> <br>christos</p>
