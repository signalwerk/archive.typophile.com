    html: <p>Paul I'm not a big fan of the 3D effect. With Adobe Illustrator CS You are going to see alot of cheesy 3D so you might not want to go there. I love the flames though. I'm not in love with the campy cowboy HX Brand type, its 2004 not 1864. Loose it, just my suggestions</p>
