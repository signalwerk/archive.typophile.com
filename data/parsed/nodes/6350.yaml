    votes: null
    html: "<p>Scott, <br> <br>i was waiting for you to comment. ;^) <br> <br>Maybe i should clarify a bit better. My whole concept with this logo plays off the word \"brand.\" Yes, this HX mark is my family's brand as in branding iron, but i acutally want to take the mark from the meaning it had in 1864 to the present meaning: \"a trademark or distinctive name identifying a product or manufacturer\"-- Websters (not necessarily a big hunk of metal) That said i want to keep some of the symbolism of the branding iron - thus the flames and the rust-colored HX in the first post. So no one really needs to \"see\" a brand as in a hunk of metal on a post, but i want it to be \"felt.\" does that make any sense? <br> <br>oh and thank you for the \"not cheesy\" comment. i feel much better now.  <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
    html_clean: "<p>Scott, <br> <br>i was waiting for you to comment. ;^) <br> <br>Maybe i should clarify a bit better. My whole concept with this logo plays off the word \"brand.\" Yes, this HX mark is my family's brand as in branding iron, but i acutally want to take the mark from the meaning it had in 1864 to the present meaning: \"a trademark or distinctive name identifying a product or manufacturer\"-- Websters (not necessarily a big hunk of metal) That said i want to keep some of the symbolism of the branding iron - thus the flames and the rust-colored HX in the first post. So no one really needs to \"see\" a brand as in a hunk of metal on a post, but i want it to be \"felt.\" does that make any sense? <br> <br>oh and thank you for the \"not cheesy\" comment. i feel much better now.  <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
