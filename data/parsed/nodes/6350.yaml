  html: "<p>okay, so here's a little something i've been trying to put together for myself. i'm a native Arizonian and my people are cow-punchin' ranch folk and the \"brand\" in this logo is my family's actual brand - like they put on cattle 'n' such, so it's got a bit of sentimentality behind it. i tried to develop the concept that was bouncing around in my head and here are the results. now i need some help ironing (no pun intended) out the kinks and generally making this hold together. anyhow, any help would be greatly appreciated.  <br> <br>here goes nuffin... <br><img src=\"http://www.typophile.com/forums/messages/29/47475.gif\" alt=\"with tag\"> <br><img src=\"http://www.typophile.com/forums/messages/29/47476.gif\" alt=\"plain: sans stripes\"> <br><img src=\"http://www.typophile.com/forums/messages/29/47477.gif\" alt=\"with color\"></p>"
