    html: "<p>thanks for your comments thust far. let me take a bit of time to respond <br> <br><i>I'm not a big fan of the 3D effect. With Adobe Illustrator CS You are going to see alot of cheesy 3D</i> <br>darnation! this was my concept before i hoped on illustrator and even knew you could do this 3D thing... maybe i should use my \"3-D\" sketches but i wanted this to be really clean. is 3D really that cheesy? any other opinions? the main thing is that i wanted to give the HX mark some weight when set on an angle, i don't want them feeling flimsy. what would be a good alternative to give weight to the mark? i guess i'm not married to this design, it's just the strongest concept i've come up with so far, but i can do some more brainstorming... <br> <br><i>I'm not in love with the campy cowboy HX Brand type, its 2004 not 1864</i> <br>i was actually shooting for comtemporary but maybe this is too 70s? 2000? instead of 2004. Again I'm not wedded to this type, i just stuck it in there to comp the feel of having a tag there in that spot. i'm not sure if it helps or hinders there. Maybe i'll try to draw some beautiful slab letters like <a href=\"http://fontbureau.com/fonts/font_frames.tpl?cart=109345214610152766&amp;fontname=Dispatch\" target=\"_blank\"> FB's Dispatch</a> for the tag. <br> <br>Christos: <br>Is this what you meant? if so it's genius! but maybe you had something even more genius in mind. let me know what you think. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/47533.gif\" alt=\"revised B&amp;W\"></p>"
