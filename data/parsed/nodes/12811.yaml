    html: <p>Hi Noah. First thing I notice is that all of your vertical strokes are too heavy. The -o- is too thin, as is the -c- and the bowl of the -d-. The -e- fills in on the left side. Perhaps instead of thinning the vert strokes you could thicken the thinnest areas of all of the letters. The exit curve on the -c- seems too thin. The bowl on the -b- seems too small, this could be because there isn't a solid base. Curves on the -m- seem too angular in comparison to the curve on the -n-. The bowl on the -p- seems to be squashed at the top right. The -c- also seems to be leaning backwards. What is your resource? From where is your inspiration coming?</p>
