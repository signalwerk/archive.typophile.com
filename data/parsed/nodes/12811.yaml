      <p><strong>It seems I made an unfortunate mistake a few weeks ago when I posted a sample of Frimbo and claimed that the kerning was the result of Igino Marini's excellent kerning software <em>iKern</em>. It was not. This error arose not from malice but carelessness on my part. To perform the kerning Mr Marini requested the font be in TrueType format. Since I work with Type1 outlines I decided to export the metrics and kerning from the file Mr Marini returned to me and import them into the original postscript formatted file. Somewhere along the line I made a mistake. I'm still trying to determine exactly what I failed to do, regardless the error is mine entirely and <em>iKern</em> did not produce the results that I claimed it had. I am deeply sorry for this mistake. I know how hard Mr Marini has worked on this project and the results, the true results, of his efforts are breathtaking, one need only examine the fonts he offers free of charge on his own site to see power of his program. It is my sincere hope that my accidental misrepresentation of <em>iKern</em> has not tainted anybody's perception of this incredible software. The fault is entirely mine, the rough spacing mistakenly attributed to <em>iKern</em> came from my own incompetence. I only hope that Mr Marini and, indeed, the members of this community can forgive my error.<br>
      Sincerely,<br>
      Noah Feldman</strong></p>
