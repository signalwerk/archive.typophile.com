      <p>magnus_gaarde, thanks for the additional feedback. I took your suggestions to heart and attempted to implement them. Overall I believe the font is improved, however I'm certain there are many more modifications I need to make and continued feedback is not only welcome but highly desired. Please note that the uppercase is complete but imperfect as of yet. I'd like to read any suggestions, criticism, praise, or objurgations from anyone willing to take the time to examine the <a href="http://www.grodworks.com/temp/frimbosample2.pdf" target="_blank" title="another sample of frimbo" rel="nofollow">samples</a> and the energy to reply.<br>
