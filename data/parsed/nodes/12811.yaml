    html: "<p>Interesting, thank you. I'm surprised at the Palatino resemblance, I've never looked at Palatino Italic, I'm pretty sure I've never used it for anything. Concerning the <strong>A</strong>, I tried it with swashes on both sides in sort of chancery style but it felt to calligraphic (well, duh) and I wanted the uppercase to be closer to a slanted roman than to a script -- Hmm, just took a look at Palatino Linotype Italic, I like the <strong>z</strong>. -- I'll work on regularizing some of the stem widths and cleaning up that <strong>y</strong>. I'm not certain what I'll do with the <strong>A</strong>. I don't feel constrained by history or convention and will happily mix styles and influences but if the result is crap I'm not going to stand back and call it art. I think I'll treat this face like a coherence set, as long as it is internally consistent it is true :-) (you are a philosophy major, right? hmm, but in Canada, you guys tend to be more interested in Being than epistemology)... thanks for the feedback, you've given me a lot to reconsider. Did you ever reach a conclusion re: wunky (isn't the word \"wonky\") color in the roman?</p>"
