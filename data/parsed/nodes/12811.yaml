      <p>I like how your caps turned out! They are really nice.</p>
      <p>Overall, I still think this font is bit rumpled, if not quite "wunky" as I misspelled earlier. But perhaps that is what effects its unique character! For persons familar with different typefaces, it is interesting to see the different influences, e.g. a, f and r are so Bembo, while s is so Palatino. (I am actually surprised that you say the italic has nothing to do with Palatino, since there is such a strong resemblance.) And although these elements, among others, are familiar, the overall effect is so unusual that I really don't know how to judge it! Anyway, congratulations on sticking with it and trusting your own taste. I look forward to see more of your work!</p>
