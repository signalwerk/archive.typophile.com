    html: |-
      <p>&gt; on average what is the tightest kern I should make?</p>
      <p>Wow, that sounds tough... What does "average tightest" mean? :-/  Do you mean the max negative value you should use? I can't think how anybody could come up with a number... But -12 seems like way too little. I personally use values over 50 often, and I know I'm not alone.</p>
      <p>Anyway, don't worry about the numbers too much, worry about the color. Once you arrive at a spacing that can't be improved without kerning, you're very close to the color you want, and you kern to bring errant pairs in line. This is sort of simplified, since the <strong>eventual</strong> avilability of kerning should be taken into account in the base spacing (and even the black letterforms), but in the real world it's 95% there.</p>
      <p>&gt; How do you deal with the optical, um, illusion(?) of spacing?</p>
      <p>I think the only way must be by applying experience<br>
      to (via acquiring experience from) carefully crafted<br>
      tests you carry out.</p>
      <p>But looking at your latest sample, I would say that your overall* spacing is slightly too loose for the vertical proportions and color of the face. And once you make the spacing slightly tighter, I think you can shoot for around 11 point setting - just great for text (although I personally prefer darker color). You won't really be able to go as low as 6 though; maybe 8.</p>
      <p>* I say overall because it's still a bit too irregular - like look at "adjusted. But I think it's almost there.</p>
      <p>hhp</p>
