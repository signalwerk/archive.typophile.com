      <p>Hi Grod</p>
      <p>As Tiffany noticed the 'o' and 'c' look too thin. But also the 'd' and the 'b' look like the curves are just a bit too thin. Try making them a little bit thicker than the stem width.<br>
      To me it also looks like the 'o' is tilting too much to the left. It could just be me but the 'd' having the same tilt as the 'o' also looks a bit like it wants to take off to the left.<br>
      I think you should try to stick to one type of serif on that 's'. I like the top one.<br>
      The right legs of 'n' 'h' and 'm' looks thinner than their left ones. And the hairline in those letters also looks very thin.<br>
      The serif on the 'q' is weird. It should be longer to the left than it is to the right. </p>
      <p>I have probably repeated some of Tiffany's words here but I still think the contrast in certain letters needs work.</p>
      <p>I look forward to see more of this font.</p>
      <p>magnus</p>
