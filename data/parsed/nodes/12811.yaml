      <p>nepenthe, tell me how you feel about the font <a href="http://www.grodworks.com/temp/frimbosample3.pdf" title="another sample" target="_blank" rel="nofollow">now.</a> It is not meant to be Bembo, nor a revival, nor an homage, nor an interpretation. I drew on the proportions of Bembo, it is true, but I also drew on a variety of other sources and my own ideas. If the result is a drunken Bembo, then this is a failure. <a href="http://www.grodworks.com/temp/frimbosample3.pdf" title="another sample" target="_blank" rel="nofollow">Here is another sample.</a><br>
      <strong>EDIT: 2 hours later</strong><br>
      So I just wandered over to <a href="http://www.fedex.com/us/officeprint/main/" title="for those unfamiliar with Kinko's" rel="nofollow">Kinko's</a> and paid their absurd $.20/min to use a computer and nearly 1$/page to print a sample of frimbo on heavy weight, blindingly bright, laser printer paper. The Xerox printer had a maximum setting of 1200dpi, which I employed. The result, a crisp, sharp, very black (for a laser printer) printout. Looking at it now, I find that it is far from "wunky" and has an even, readable quality to it, at least at decent resolutions. While I'll continue to tweak, I think it rather extreme to label the frimbo with the epithet, "wunky."</p>
