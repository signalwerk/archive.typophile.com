      <p>I had a quick look at some of the roman pdf samples (using Acrobat reader 7.0 on Linux), but I have not printed any. Some of the uneven stroke widths in smaller sizes look like hinting artifacts to me. They do not appear to such an extent in the largest sizes. Zooming in alters the effect. I get a slightly different effect using gv on Linux, which uses the Ghostscript font rasteriser.</p>
      <p>I have seen this effect in some badly hinted Type1 fonts. For example, omitting or misplacing a vertical stem hint can grossly thicken the stroke on screen, but it is OK on a high resolution print.</p>
      <p>I wonder if you have some real (but fairly small) irregularity in the stroke widths, or some other problem, that is confusing the automatic hint generation.</p>
