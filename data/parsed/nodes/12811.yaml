      <p><strong>edit</strong> <em>nepenthe</em>, heh, figures. I post a reply to magnus_gaarde only to discover that, while I'd been composing my reply, you'd commented. First, thank you for the honesty of your crit. Now that you point these inconsistancies out to me many of them are painfully obvious. I think my main rationale is that I don't want to make Bembo, but I do want to be influenced by Bembo. Perhaps the randomness is due to fear of influence. Regardless, I can see I have a lot more work than I'd initially thought. Thanks for your observation, while somewhat frustrating, I find I mostly agree. Now to figure out what to do about it.</p>
