    html: |-
      <p>I really don't have too much time, which is why I haven't commented, but since you're on the edge ;) ...</p>
      <p>The Italic:</p>
      <p>Stem widths aren't consistent. For one example, check the n against the r. The r looks noticeably thinner than the n. Also, the n is thicker on the left than it is on the right. If anything, it should probably be the other way around, but only by a couple of units. </p>
      <p>You have a swash serif on the A in a place that doesn't make sense.</p>
      <p>Some of the uppercase letters have both adnate and abrupt serifs. This doesn't make sense either.</p>
      <p>The y looks bent out of shape. </p>
      <p>The weights of the numerals seem fairly inconsistent to me. Problems here are similar to the LC.</p>
      <p>It's good that you made the ascender serifs more horizontal than the exit serifs. </p>
      <p>The leg on the R and the K should be more similar than they are now.</p>
      <p>As this italic seems mostly influenced by Palatino and the roman is influenced more by Bembo, I'm not so sure they work well together. But perhaps if you even out the colour of the glyphs it will be OK. In terms of overall stems, italic and upright seem to match fairly well, but the italic is too loose.</p>
      <p>I have to get back to work now, but good luck with it!</p>
