    html: <p>In the spirit of honest critiques, this looks to me like Bembo if Bembo were a lush! I'm afraid I simply don't understand the rationale for the modifications you've made to Bembo; them seem altogether arbitrary. As the others have pointed out, the colour is just plain wunky as a result. The relationships between thicks and thins across letters are not consistent. For example, the bowls of the p, d, b, and q are the similar, but not in the relevant way, viz stroke axis. More importantly, they don't match up well with those of a, m, n, h, and r, especially where they meet the stems.. Keep in mind that Bembo is of calligraphic heritage. You have kept the proportions from this face, while basically abandoning the calligraphic strokes and axes. I think you should probably either keep the calligraphic style, or change the proportions altogether if this design is to make sense.</p>
    html_clean: <p>In the spirit of honest critiques, this looks to me like Bembo if Bembo were a lush! I'm afraid I simply don't understand the rationale for the modifications you've made to Bembo; them seem altogether arbitrary. As the others have pointed out, the colour is just plain wunky as a result. The relationships between thicks and thins across letters are not consistent. For example, the bowls of the p, d, b, and q are the similar, but not in the relevant way, viz stroke axis. More importantly, they don't match up well with those of a, m, n, h, and r, especially where they meet the stems.. Keep in mind that Bembo is of calligraphic heritage. You have kept the proportions from this face, while basically abandoning the calligraphic strokes and axes. I think you should probably either keep the calligraphic style, or change the proportions altogether if this design is to make sense.</p>
