    <p>We are looking for a Design Development Associate (this means a designer who has management skills as well, and can contribute to business development) to work out of our partner company Merson Sign Design in Surrey, UK, and the University of Reading. The designer will working alongside the MSD team to develop their expertise in the field of multi-script airport wayfinding and sign design; there is also a brief to broaden the skills and knowledge within MSD, and to explore Middle East sales opportunities and management methods.</p>
    <p>The post is for two years, with further potential at the end of that contract. Full details here:<br>
     <a href="http://www.jobs.ac.uk/job/ABW333/design-development-associate/" title="http://www.jobs.ac.uk/job/ABW333/design-development-associate/">http://www.jobs.ac.uk/job/ABW333/design-development-associate/</a></p>
