      <p>As of CS3, InDesign doesn't have native support for Armenian hyphenation.</p>
      <p>There's documentation at <a href="http://www.adobe.com/devnet/linguisticlibrary/" title="http://www.adobe.com/devnet/linguisticlibrary/">http://www.adobe.com/devnet/linguisticlibrary/</a> if you want to develop a plug-in.</p>
