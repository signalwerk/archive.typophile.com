      <p>&gt;Kevin, you’re mistaking the user’s degree of satisfaction with a professional service for actual professional expertise in providing satisfaction.</p>
      <p>Nick, your analogy is not sound. Kevin reports that "reading speed" peaked at 11 point. This is not a subjective self-report of satisfaction, but an objective measure. In science, the results of objective tests are the authority. They trump scientists' opinions and your opinion and mine. </p>
      <p>A closer analogy would be to Doctors' opinions of the effectiveness of a procedure and the results of objective and extensive double-blind tests of the actual impact on patients. The results are more authoritative than the opinions. Of course there can be bias, poor methodology, and cheating in the tests. But these can be checked  for by repeating experiments.</p>
