      <p>I wish I could start this thread over and re-phrase my question. </p>
      <p>Yes, point size is a meaningless number. Let's be specific-- I'm currently working with Adobe Garamond pro on a book about Napier New Zealand-- I was told to use 12 point by editors-- but it looked huge and awkward, no room for white space, everything looked cramped on the A4 size pages-- </p>
      <p>I also have to put in  photos and captions. When I reduce the point size down to 10 on 13 Garamond-- the two page spread looks so much better. (9pt looks even better) </p>
      <p>As for audience -- it's not the visually impaired, or the elderly, or children-- its meant for a very general audience ages 20-40.</p>
      <p>So, if you want to do a test--- a typical spread (two A4 size pages) in this book has 1100-1300 words, with 4 photos with captions 40-60 words. There is a title, subtitle. Try designing a good looking spread (two A4 pages)-- with 12 point Garamond-- then do it with 10 pt -- see which one looks horsey. See which one is easier to read.<br>
      (What you are going to find is that on spreads with 1300 words with 12 pt type you will have to reduce the leading to get all the words on the page- it begins to look amateurish).</p>
      <p>But aesthetics aside....<br>
      -- The whole point of my post-- really, is to find out if there has been any study that body copy set to match the size of  12 pt garamond is not easier to read than type set to the size of  9 or 10 pt Adobe Garamond pro. (for people who are not vision impaired, over the age of 60 or under the age of 8.)</p>
      <p>I would love to know if there is a<br>
      test similar to the test on this site (which is on legibility of web fonts)<br>
      on type size.<br>
      <a href="http://psychology.wichita.edu/surl/usabilitynews/81/legibility.htm" title="http://psychology.wichita.edu/surl/usabilitynews/81/legibility.htm">http://psychology.wichita.edu/surl/usabilitynews/81/legibility.htm</a></p>
