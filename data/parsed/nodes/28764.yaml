  html: |-
    <p>Does anyone know of any studies done on <a href="/wiki/legibility" class="freelinking" rel="nofollow">legibility</a> that show that<br>
    Body copy larger than 9, 10, 11 pt (like for instance 12 point Helvetica)<br>
    are actually harder to read? (I prefer reading text that is between 8-10 pt),</p>
    <p>If I am designing a layout to a book or magazine I would use 8 pt if<br>
    editors/clients would let me. Leaving more room for photos, captions, to<br>
    breath. I've recently been forced to use 12 point type and it  looks so<br>
    horsey to me.</p>
    <p>My theory is if its body copy is larger than 11pt its actually harder<br>
    Read because as your eyes sweep over the lines of text you can’t see<br>
    As many words at one time. I also think it might be harder to read<br>
    Larger body copy because when its too big you start seeing individual<br>
    Letterforms instead of words.  (They say that speed readers see 5 or 6<br>
    Words at a time). </p>
    <p>(I am hoping there has been a test that confirms this<br>
    —aesthetically working with larger sizes<br>
    of body copy always makes the over all layout look clunky— I want to<br>
    be able to tell people that the idea that larger body copy is easy to read<br>
    is a fallacy.</p>
