      <p>Miles Tinker ran many studies investigating optimal type sizes. For most typefaces he found that reading speed peaked at 11 point and was slower when you used smaller or larger text. For some fonts (I believe those with larger x-heights) reading speed peaked at 10 point. See Tinker’s book Legibility of Print for more details.</p>
      <p>This assumes a reader with normal visual abilities. With some vision impairments, it is not possible to read 8-12 point text sizes and larger text is required. While reading is impossible without a much larger size, it does accompany a loss in reading speed. Optimal text size is a natural consequence of the density of photoreceptors in the fovea (part of the retina used for reading).</p>
      <p>Cheers, Kevin</p>
