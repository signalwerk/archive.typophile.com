      <p>As one with a little experience in book design for the New Zealand market, I feel compelled to say that the designer's 'authority' is (unfortunately) a moot point in this context. </p>
      <p>Your editors, Jasper, are telling you to use the 12 pt Garamond because they've previously had a good experience with that particular spec. and they're just going with what they know. If you try and railroad them into accepting your preference - with or without some other authority - it's likely to be counterproductive.</p>
      <p>You don't mention the other attributes of the spec. but notice how everyone else does; without the associated values that make up the rest of the appearance of the text block, arguing about 12pt or not is a little abstract.</p>
      <p>I can suggest three possible approaches; </p>
      <p>1. Offer them options; do a truckload of comparison settings (whole pages) with variations of line length (set width), leading and tracking. Dig out the rule-of-thumb reminders about optimum line length and leading values. Be prepared to make minute variations and annotate everything so you know at a glance what the variables are. Don't forget to consider paragraph indentation and/or spacing and how many lines you'll achieve for each page. Sit down with the editors and discuss the results as openly as possible.</p>
      <p>2. Do a word count and work out the average page yield. Calculate the overall extent of the book at 12pt. Do the same calculation based on your preference for the smaller type size; then try doing it again for an interim value between the two. Try and figure out if it makes a difference in terms of the print production costs associated with the book.</p>
      <p>3. Research other titles on Napier, preferably by competitor publishing houses here in NZ. Are they using 12pt Garamond too? Try and find examples of whatever won last years NZ book awards. What will be this title's point of difference from all the other books?</p>
      <p>Good luck with it.</p>
