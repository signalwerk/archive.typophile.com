      <p>If I go to a baker &amp; tell him that I have proved with some sort of test that 'Brioche is the best bread &amp; here are my 3 variables I tested on' I will be laughed at. And rightly so.</p>
      <p>Bakers don't need scientist to tell them how to make bread. Of course Science can be used to find out lots of interesting things about bread. But before a scientist studies bread they should get to know bread from the Bakers point of view. As far as I understand it that 'getting to know' the subject hasn't happened with type studies - yet. The tests have been too naive. MUCH too naive. That could change and I would like it to change. But until it does there is is no point in waiving 'science' &amp; 'tests' around to impress us. A little more meekness would go a long way. Nick's examples of variables to think about are excellent. No doubt there are even more to consider. </p>
      <p>In the end it never going to be a good idea to ask 'tests' what bread you should eat or what type you should use. Rather, it's always going to be a good idea to feel your way into it, thinking about the situation as whole, and experiemening for yourself, and when you can; allowing your decision to be informed by whatever science can offer at the time. These choices are always going be partly a cultural excercise too. The pure consideration of efficiency and or effectiveness will never be a complete guide to practice. </p>
      <p>I think that people who are beating down these proclimations of 'fact' are not against science at all. I think they were interested and then disappointed by what they found. Maybe I am just gerealizing my own case. </p>
      <p>Ceratinly there are always people who rather than working at looking &amp; seeing better ( for themselves ) would like to rely on someone else's rules to justify what their choices. Designers and Clients. But that's just hiding from reality. It's weak. No matter what science may get around to showing in time it's always going to be a good idea to keep your eyes open &amp; mind open. That's just good science.</p>
      <p>I am not going to to go so far as to say I'm right about any of this. But this how it looks to me today.</p>
