      <p>Nick wrote:<br>
      “Why do we need authorities to justify our decisions? Isn’t the designer the authority?”</p>
      <p>Nick, I think the reader is the authority. For physiological, emotional, and experiential reasons, some designs are better than others. One designer may choose to use 9/10 Garamond while another uses 10/12. If the goal is to make it as quick as possible for readers to read this information, can both designs be equally optimal?</p>
      <p>Reading tests shouldn’t be banal or used to justify anyone’s decisions, but rather to learn more about how people read. This knowledge can be used to improve designs. Test do not replace the role of the designer in any way. Testing can only be used to study existing reading conditions, but improving the experience beyond what already exists takes creativity. All design involves creative problem solving which cannot be automated.</p>
      <p>Miles Tinker ran many studies investigating optimal type sizes. For most typefaces he found that reading speed peaked at 11 point and was slower when you used smaller or larger text. For some fonts (I believe those with larger x-heights) reading speed peaked at 10 point. See Tinker’s book Legibility of Print for more details.</p>
      <p>This assumes a reader with normal visual abilities. With some vision impairments, it is not possible to read 8-12 point text sizes and larger text is required. While reading is impossible without a much larger size, it does accompany a loss in reading speed. Optimal text size is a natural consequence of the density of photoreceptors in the fovea (part of the retina used for reading).</p>
      <p>Cheers, Kevin</p>
