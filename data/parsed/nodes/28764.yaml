      <p>I think the most important point (!) is that point size alone means very little. </p>
      <p>First of all x-height tells you more about legibility, as mentioned. But also length of line and leading makes a crucial difference. Also sans vs serif. </p>
      <p>I know some people get in their heads that point size is everything. I think the only way to disabuse them of that idea is to show them several side-by-side versions of type actually set in a paragraph. </p>
      <p>That being said I think that the most common mistake of those who don't work with type is that "Make It Bigger" (title of Paula Sher's book) solves all problems. On the other hand, I do think that graphic designers sometimes make the opposite mistake. Because they want the overall page to look nice, they make the type too small or low contrast (colors, reversed, etc.) for good readability. You can definitely sin in both directions.</p>
