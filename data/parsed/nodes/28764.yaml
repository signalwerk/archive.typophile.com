      <p>ChrisL wrote:<br>
      &gt; Tinkers studies are not very recent.</p>
      <p>Tinker’s legibility research program was huge, carried out over 4 decades (1920s through the 1950s) on many thousands of readers. It would be great if someone would undertake the project to retest his most famous findings to see if anything has changed since Tinker’s time. My guess is that the text size finding hasn’t changed because it’s a result of photoreceptor density, not personal experience. In one of the Tinker &amp; Patterson books they reports on a survey of typographic variables like point size and leading used in different kinds of publications (novels, newspapers, textbooks, etc.). I was surprised at how common it was to see text sizes as small as 6 point.</p>
      <p>ChrisL wrote:<br>
      &gt; On another readability issue, much has been made of eye movements as a<br>
      &gt; measure of good readability but I have a problem in the translation from percent<br>
      &gt; of difference of eye movement to percent of enhanced or decreased readability.</p>
      <p>Eye tracking measures are similar to reading speed measures, but provide additional detail such as the amount of time spent fixating on each word and the frequency of regressive saccades. Most studies look for a difference either in reading speed or comprehension. When measuring reading speed, the material used is simple enough that readers will understand it with full comprehension and comprehension questions are used to confirm this. Else more difficult material is used and the amount of time spent reading is controlled (e.g. you are given 5 minutes to read an article). This style of reading test is frequently used in U.S. college admission tests. Combinations of reading speed and comprehension are rarely used because they the scores need to be combined, and debated if it better to read an article in 4 minutes with 80% comprehension or 5 minutes with 90% accuracy?</p>
      <p>David wrote:<br>
      &gt; We did a preference study at the Poynter Institute more than 10 years ago that<br>
      &gt; showed readers preferred type set in newspapers that was designed for setting<br>
      &gt; between 8.5 and 11 pt., and set at those sizes, not smaller or larger.</p>
      <p>I’m not necessarily surprised that people said they preferred smaller text sizes for newspapers. It wouldn’t be unreasonable at all for people to desire a smaller text size than the one that allows for fast reading. Many people read newspapers by only reading the front page of each section. By asking for smaller text sizes, the readers asking for more information on that first page. I don’t see this as being in conflict with the reading speed data.</p>
      <p>Cheers, Kevin</p>
