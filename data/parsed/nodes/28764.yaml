      <p>Peter wrote:<br>
      &gt; Kevin, my impression is that in the end Tinker and Patterson’s<br>
      &gt; cumulative results confirm the typographical intuition that the<br>
      &gt; optimization of readability is a multi-dimensional exercise</p>
      <p>Absolutely, Chapter 11 of Legibility of Print looks at some of the combinatorial effects of the factors they studied. It’s a bit of an oversimplification, but I think they found that reading speed is reduced if any of the typographical variables they studied were set very differently from what was found optimal in the single variable studies.</p>
      <p>When you reference bigger is better, I don’t think you mean that someone said that larger text sizes are always better (though that might be somewhat true for visual impairment)? Instead I think you’re asking if it’s always better to have faster reading speeds? I would argue that as long as comprehension is kept constant, that faster reading speeds are always better. I would guess that more than half of the time spent reading is not spent on word recognition, but spent trying understand the meaning behind the string of words. I would also assume that improved legibility makes it easier to recognize words, but has little effect processing the meaning of a sentence. I see no reason to not try to improve the efficiency of word recognition as much as possible. If content is difficult, reading speed will slow to allow more time to process the meaning of the sentence and shouldn’t ever need slower word recognition speeds to help it out. (Peter, you may be interested in Fodor’s argument of modularity in Modularity of Mind)</p>
      <p>Peter wrote:<br>
      &gt; Efficiency of eye movements and sustainability of immersion with<br>
      &gt; comprehension might be better indices of readability in typographic<br>
      &gt; terms than reading speed.</p>
      <p>I think reading speed is an approximation of efficient eye movements. Fast reading speed means some combination of reduced fixation time, reduced regressive saccades, and longer saccades. Reading speed does not get at sustainability of immersion. Understanding what immersion means and how to measure it is an interesting area of research. I would humbly point to my article in Typo for one idea on that topic.</p>
      <p>Cheers, Kevin</p>
