      <p>I agree completely with William’s comments about objective measures. Repeatable objective measures are more interesting that individual opinion. As Chris points out, it was once people’s subjective opinion that that the world was flat. But it’s difficult to rectify this theory with objective data that the sun rises earlier and falls earlier in New York than Los Angeles. I don’t think there is any objective data that supports that flat world theory.</p>
      <p>I think there are other possibilities for measuring the reading experience, including William’s proposal and a measure that I proposed at ATypI Helsinki (which will be published soon); but I would claim that reading speed is the primary measure of legibility. If I’m given the choice between reading an article with two typographic treatments and told that I’ll read one version 5% faster without a loss in comprehension, I’m going to choose that version.</p>
      <p>Cheers, Kevin</p>
