      <p>&gt;For most typefaces he found that reading speed peaked at 11 point and was slower when you used smaller or larger text. </p>
      <p>That agrees with my intuitive feeling, if we take an average ascender to be 1.6 bigger than the x height, and the type to fill 95% + of the body size.</p>
      <p>Kevin, I think that you could refine these numbers if you would use my suggested measure of reading comfort: rate of decrease in comprehension with time :).  You could also measure boldness (% of black to white), presence of serifs and amount of leading--all of which I think will have a measureable influence. And letter spacing and measure. Those are 6 variables, and though a lot would tell us most of what we need to know. </p>
      <p>For what it's worth, I do think that below 11 point Adobe Garamond Pro is less readable, as it has a small x-height. However, it will probably require less leading at 11 or 12 point, so it may end up being economical enough for you.</p>
