      <p>There is the popular perception of ease of reading and the plebeian monolinear logic that bigger is better; there are the confirmed realities of reading speed, eye movements, user satisfaction, sustainability of immersion--with comprehension and engagement--varying with font selection, type size, leading and line length, illumination, paper stock or type of screen; and there is the accumulated craft-wisdom of the typographical clerisy that optimization of readability is a multi-dimensional exercise, and the generation of an gestural atmospheric <em>plus value</em> a benefit.</p>
      <p>Kevin, my impression is that in the end Tinker and Patterson's cumulative results confirm the typographical intuition that the optimization of readability is a multi-dimensional exercise and that their results are probably mis-applied when recruited to support a monoliniar logic (of bigger is better for instance) or binary choices (between serif and sans serif for instance) or an intrinsic antagonism between functionality and aesthetics.</p>
      <p>Efficiency of eye movements and sustainability of immersion with comprehension might be better indicies of readability in typographic terms than reading speed. No one typographical factor controls this. </p>
      <p>I suspect there is an optimal <em>range</em> of reading speed where sense following is robust. Too slow, and effective sense-following is jeopordized; too fast, and sense-following deteriorates. All good type has to do is work within this range. Higher reading speeds does not mean more legible or readable, all it means is more functional in circumstances where speed of recognition is of the essence, like in highway signage. Type faces aren't readable. Text is. <em>Writing</em> can be legible or illegible. It's not the brute or base-level legibility of a typeface that we should be talking about, because it is rarely in question in fonts designed for extended text use. We do need to talk about the discrimination affordance of words and letters in type X under conditions Y and Z (speed, size, illumination), or the ability of a font to stand up under degradation because of screen or printing conditions.</p>
