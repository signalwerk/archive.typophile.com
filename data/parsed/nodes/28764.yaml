      <p>Eban Sorkin wrote:<br>
      &gt;In the end it never going to be a good idea to ask ‘tests’ what bread<br>
      &gt;you should eat or what type you should use.</p>
      <p>Agreed. But as you point out, science is being quite extensively by cooks. Many cooking magazines, led by Cook’s Illustrated, regularly use the scientific method to improve their recipes. They do not test if brioche the best bread, but rather attempt to optimize the preparation of a certain recipe. They regularly make 20 different versions of a recipe, manipulating one variable at a time, in their search for the best preparation. They ask several people to taste each version of the recipe and rate how good a recipe tastes. Testing is being used here as a useful tool to help the chef.</p>
      <p>At a different level, Harold McGee has written several interesting books explaining how different cooking techniques impact foods at the molecular level. Our understanding of the effects of cooking preparations on food is better than our understanding of legibility (though certainly not perfect). This information is useful for understanding the health impact of different foods and preparations. If a chef is interested in making healthful food, it would be useful to pay attention to this kind of information. Similarly, if we understood the mental processes for recognizing words, this information could be used to make more legible typefaces. Of course if a type designers purpose had nothing to do with legibility, this information could be safely ignored.</p>
      <p>There has been a misunderstanding about science in this thread. Science is not a topic, but a method for learning. Not all statements are scientific just because they are about topics closely associated with science like chemistry, physics, or the natural world. Science is defined by the scientific method, a process for making observations about the world and conducting experiments to test the accuracy of proposed theories. Claiming that ships could go missing because they fell off the edge of the world is not a scientific statement, but a post-hoc explanation of an event. A repeatable scientific experiment that could support the flat earth theory would be to demonstrate that the sun rises and falls at the same time in Seattle and Los Angeles. The best theory is the one that supports the most evidence.</p>
      <p>Cheers, Kevin</p>
