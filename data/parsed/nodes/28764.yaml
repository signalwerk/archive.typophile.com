      <p>Returning to the topic of type size, I thought it might be valuable to print the Table of Contents from Miles Tinker’s book Legibility of Print:</p>
      <p>1.	Introduction<br>
      2.	Methodology and Definitions<br>
      3.	Legibility of Letters and Digits<br>
      4.	Kinds of Type<br>
      5.	Size of Type<br>
      6.	Width of Line<br>
      7.	Leading and Relationship of Leading, Type Size, and Line Width<br>
      8.	Spatial Arrangement of the Printed Page<br>
      9.	Color of Print and Background<br>
      10.	Printing Surfaces<br>
      11.	Cumulative Effect of Combining Nonoptimal Typographical Arrangements<br>
      12.	Newspaper Typography<br>
      13.	Formulas and Mathematical Tables<br>
      14.	Special Printing Situations<br>
      15.	Illumination for Reading<br>
      16.	The Hygienic Reading Situation</p>
      <p>I am quite impressed by the breadth of topics that Tinker studied, and am surprised that many typographers are not familiar with his work. It has been mentioned in this thread that some researchers understand little about typography. This does not apply to Tinker. He spent his entire  career studying typography and working with printers.</p>
      <p>In this book you can find studies of size effects on different type faces in Chapter 5, studies looking at the interaction of leading line length and size in Chapter 7, studies of size in the context of Newspapers in Chapter 12, and the interaction of size and illumination in Chapter 15.</p>
      <p>Cheers, Kevin</p>
