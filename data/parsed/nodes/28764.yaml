      <p>Kevin,<br>
      Tinkers studies are not very recent.  The nature of both printing, type design, have gone through several changes since then.  What readers today have gotten accustomed to reading has also changed.  There is a lot more smaller type being read than their used to be. I don't pretend to know if any of this changes Tinker's conclusions for today's reader but I sure would like someone to test it.<br>
      On another readability issue, much has been made of eye movements as a measure of good readability but I have a problem in the translation from percent of difference of eye movement to percent of enhanced or decreased readability. I have yet to see a comparative measure which gives me a usable comparison in reading speed and reading comprehension. An example might be using today's Garamond Premier Pro at 9 point vs. 10 point with the same characters per line and same proportion of leading, how much faster in pages per hour and how much more comprehension (however you can really measure that) am I gaining or losing by changing the point size one point?<br>
      This will tell me something to help make design decisions.  If the difference is so small that it is inconsequential in a given reading situation then why not opt for the more efficient use of space?  Readability is always paired with efficiency in the decision making process.  The readability that interests me is when it affects the exact situation it is being used in, not just a more generalized "bigger is better" or "serif is better" thinking which gets seized upon rather than what the actual studies conclusion intended.</p>
      <p>ChrisL</p>
