    html: |-
      <p>You are absolutely right. When type becomes too large, the number of words on each line becomes too small. This  means that the eye has to spend a lot of time jumping from line-end to line-start instead of actually reading. Also, almost  all (i can't think of any who don't) typefaces have a limited range of size in which they work well. Typefaces for body text usually don't work well when set too large, they tend to become unelegant and too low-contrast (when using a serif typeface). The opposite is the case when setting titling typefaces too small – the small details become too small and may disappear in print.</p>
      <p>But when it comes to determining the "ultimate body copy" size, that's just impossible. If you line up a variety of typefaces in the same size, say 11pt, they will all look different in size due to their different x-heights.</p>
      <p>good luck on convincing your editors :-)</p>
      <p>alex</p>
