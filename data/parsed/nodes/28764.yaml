      <p><em>Nick, I think the reader is the authority. </em></p>
      <p>Kevin, you're mistaking the user's degree of satisfaction with a professional service for actual professional expertise in providing satisfaction.</p>
      <p>For instance, you may have a subjective opinion of whether a doctor's treatment has effected your health, but this does not make you an authority on medicine.</p>
      <p><em>Optimal text size is a natural consequence of the density of photoreceptors in the fovea</em></p>
      <p>That doesn't even make sense. There is no such thing as optimal text size, because there is no way to measure text size. It is quite simply not a scientific concept. The best that can be determined is that easy-reading text should be between 8 and 12 pt size, which is so vague and useless a statement as to be a self-evident platitude, like saying gloves should not be too tight or too loose.</p>
      <p>It is not physiology which best determines the text size for a particular setting, but a typographic understanding of the many variables involved in reading it, such as the reader demographic, the paper stock, the publishing genre (which affects the reading environment), the document page size, language, author, paragraph length, and of course the many typographic variables other than size, such as typeface, leading, measure (line length), tracking, alignment style, gutter and margin width.</p>
