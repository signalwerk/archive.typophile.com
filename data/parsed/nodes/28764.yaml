      <p>" Is relying on a typographers opinion better than relying on a well conducted study?"<br>
      Opinion of What? Study of what? In my opinion, if you have both pertaining to your problem, it's best, (especially if they agree:). But if you have to choose between typographic practice, and a study of something else, other than what you need a study of, well, I'd go with the practice. And on the other hand, if I had a study of what I was looking for, and typographic practice of something else, well, then, I'd go read the study carefully to make sure, because one bad move in a study can muddy the results beyond belief, so to speak.</p>
      <p>"Does anyone know of any studies [of] legibility that show...Body copy larger than 9, 10, 11 pt [] are actually harder to read? (I prefer reading text that is between 8-10 pt)"<br>
      We did a preference study at the Poynter Institute more than 10 years ago that showed readers preferred type set in newspapers that was designed for setting between 8.5 and 11 pt., and set at those sizes, not smaller or larger. Not all of the types we tested were designed for such use, and those did not win, but they did better than expected. All of the subjects were expecting "newspaper text", (the paper being a dead giveaway), and they were all adults, so it wasn't a test of ALL LEGIBILITY, or even all fonts, or all users.</p>
      <p>But the results allowed us to see how to draw some very readable faces, for print, that if sales are any indication, which I'm sure they are not, are very readable, i.e. beyond legible perhaps. We are planning now to do the same thing for screen types, building a test-bed of fonts, and sending them home with users to try out. I'm arguing for both obtrusive and non-obtrusive recording of the choices, but we'll see. It's all very expensive, and you need to get it right from initial input to the final adjustments of claims. Just like typeface design, if everything isn't right, it useless.</p>
