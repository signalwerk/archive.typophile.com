      <p>[Adding to the above]</p>
      <p>To be impertinent: I agree with Nick. Referring to uni-varient tests of reading speed as 'legibility research' is an insidious misnomer.</p>
      <p>1) We need to know how typographical factors interact under variable conditions of use relative to other scales than reading speed. 2) We need to inform ourselves about what's important and why, rather than what to do and by how much. We need empirico-scientifically grounded frameworks for intelligent action rather than direct prescriptions for immobile specifications.</p>
      <p>Are tests of reading speed useless? no!!</p>
