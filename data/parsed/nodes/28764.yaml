      <p>I'm going to grossly misquote Gill and say that "familiarity is everything." Europeans don't seem to have nearly as much trouble with sans type, because they're used to it. People who only read cheap paperback novels don't have any trouble with eight-point type. Those with bad vision have no trouble with 14+ point type because its all they ever see. Many of my friends are lawyers, and they whinge about reading anything that isn't set in 12 point Times New Roman with with double-spaced lines and extra spaces after periods.</p>
      <p>Don't worry about studies or rules for type size. Worry about what your audience is expecting and how you can use their expectations to manipulate them.</p>
