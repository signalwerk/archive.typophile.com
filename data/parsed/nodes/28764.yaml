      <p>You're not the first to ask for the results of "readability" tests to satisfy a client (or oneself). it must be one of the most-asked questions on Typophile.  Why do typographers and their clients need to be reassured by some banal tests made by scientists who have no feeling for typography that they know what they're doing? We all know the tests are meaningless (note Alessandro's sample). Whose eyes are we pulling the wool over? The more this goes on, the more we dig our own grave. If we let our clients (or ourselves) buy into this bullshit that the the quality of typography can be measured, they won't need typographers, but will get everything set in Arial or Comic Sans (whatever is "proved" most legible) in the "optimum" setting. Why do we need authorities to justify our decisions? Isn't the designer the authority? What is the point of developing a refined sensibility if no-one trusts it? If that's the case, the typographer is a low-grade technician who can soon be replaced by a piece of software.</p>
      <p>However, why not prepare a few variants, and test them on a suitable focus group? That's much better than relying on vague generalization.</p>
