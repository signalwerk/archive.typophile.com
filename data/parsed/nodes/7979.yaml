    html: <p>The odd thing about GQ's use of Miller is that it almost looks they're using the display weight for body copy. You can't really tell from the scan Jason posted, but in print it looks lighter than the everyday text weight of Miller I use. The spacing is looser than you'd expect, too.</p>
