    <p>Hi there,</p>
    <p>I have been looking for a nice bold extended font for a couple of weeks now and have had no luck at all. I might have to start looking at editing a font after I have converted it to outlines.</p>
    <p>Attached is a sample of eurostile which I like to get some comments on: Is the Characters, kerning etc all in order?</p>
    <p>And the second sample is me squashing forza which I like (will need adjustment if I was to buy it).</p>
