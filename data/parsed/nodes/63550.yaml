  html: |-
    <p>Hey Everyone,<br>
    I was wondering if you know what the font is that is used in fortune magazine's title.<br>
    I love the magazine's high end business appeal and am trying to achieve this look in some of my work.<br>
    Any help would be awesome.<br>
    Also any suggestions of other type that have this mature financial feel would be awesome.<br>
    Thanks!</p>
