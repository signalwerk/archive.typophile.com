      <p>I think Bob's answer will be more helpful than what I see so far at the MyFonts forum. However, if you are looking for something similar, Monotype's <a class="freelinking external" href="http://new.myfonts.com/fonts/agfa/mentor/" rel="nofollow">Mentor</a>, by Michael Harvey, seems close, except that the stress on the O is not angled.</p>
      <p>- Mike Yanega</p>
