      <p>This goes back a few posts to</p>
      <p><cite>In English, in some contexts ‘killing’ and ‘died’ is indeed use jocularly, as in ‘I just about died laughing’.</cite></p>
      <p>Kill is also used in slang to mean <em>to finish</em>, <em>to end</em>, <em>to turn off</em> or <em>to do away with</em>. For example, when someone says “I gonna kill this beer, then grab another.”, or “kill the lights.” So perhaps <cite>killing widows and orphans</cite> could be read this way.</p>
      <p>We also say things like, “Did you see the Super Bowl? The Clots killed the Bears.” and “Wilco killed when they played a few months ago in San Antonio.”</p>
      <p>Does this really have to be read as overtly violent? Maybe I am just another desensitized young man of the post-punk/video game generation.</p>
