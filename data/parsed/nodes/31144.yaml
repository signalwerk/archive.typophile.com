      <p><em>I guess this reads differently in the US. First, we are in a war in which a lot of widows and orphans are being created, and others being killed. This is a grim and horrible reality we see every day on the news.</em></p>
      <p>I think it’s a matter of context: our soldiers are dying in Afghanistan, but I don’t think the overwhelming majority of Canadians are as obsessed with it to the point that anything that even has a whiff of exploitation automatically sends up a red flag and generates excessive hand-wringing.</p>
      <p>Saw the ad you mentioned: we thought it was actually pretty funny until he threw the rock, but the real nadir was the guy walking past at the end giving the groggy guy a low five.</p>
      <p>At that point, we both looked at each other, shrugged, and said “it figures….”</p>
      <p>I’m not disagreeing with you in that there does seem to be a real “I’ve got mine, screw the rest of you” attitute in marketing in the U.S. these days, but if you think about it, Bush and his neocon buddies got elected with pretty much the same attitude.  </p>
      <p>Since it “sold the product” then, is it surprising that some copycat marketer figures it’ll work for beer too?</p>
