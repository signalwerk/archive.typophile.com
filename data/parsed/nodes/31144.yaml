      <p>I guess this reads differently in the US. First, we are in a war in which a lot of widows and orphans are being created, and others being killed. This is a grim and horrible reality we see every day on the news. </p>
      <p>Secondly, let me give you the flavor of the ads we see. Here is one from the Superbowl yesterday. </p>
      <p>The premise of this series of beer ads is that their beer is so good that people will do anything to get it. In this particular ad there is one bottle left in the cooler as two young guys come up to it. Guy one says “shall we do ‘rock, paper, scissors” for it?” “Ok,” says guy two. Then guy one counts one two three, and guy two flashes out a flat hand, while guy one simultaneously makes a throwing motion and guy two falls straight to the ground, knocked out.</p>
      <p>He says to the others at the party, who look at him, “he threw paper, I threw a rock”, and walks off with the bottle of beer. We see guy two waking up and moaning as guy one walks off. </p>
      <p>This one is extreme—it was even mentioned in today’s Washington Post , but the tone and style are often seen.</p>
