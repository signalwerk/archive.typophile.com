      <p>In English, in some contexts ‘killing’ and ‘died’ is indeed use jocularly, as in ‘I just about died laughing’. But ‘do you like killing widows and orphans?’ is not one of those contexts. That is the device of the point of the ad: to catch your attention with an apparently statement of horrible cruelty, only to turn out to be the most innocent of activities: tweaking the look of type on a printed page.  </p>
      <p>I guess I’m tender-hearted as I have never found any of this stuff funny. I’m glad to see for a second day in a row that the Washington Post has slammed the Superbowl ads, though. Today they refer to them as having ‘sophomoric violence’. So maybe there’s hope that this stuff will go out of fashion. I do think, as Linda wrote, that the bullying attitude of Bush has something to do with the fashion, and maybe the country turning massively against him will help change the mood.</p>
