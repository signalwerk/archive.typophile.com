      <p>Thanks, David, for the link to the program, which I listened to. </p>
      <p>When people calling in—not the host or the guests from marketing—raised the ethical issues, the response was revealing. </p>
      <p>“We see gray, and it’s up to the public to tell us when they see black and white.” They made it very clear that ethics only enters their thinking in so far as it may alienate someone they want to sell to. </p>
      <p>So the bad news is that because they have no sense of moral responbility as far as affecting the public, they will continue to test any attention-getting device, whether it is degrading and corrupting or not. </p>
      <p>The good news is that if people don’t buy, it will stop. So while in a desire to get attention ‘marketing’ is quite willing to be degrading and unethical—“it’s just business” as the mafia people say in ‘The Godfather’—they will do it ethically if they think it will sell.</p>
