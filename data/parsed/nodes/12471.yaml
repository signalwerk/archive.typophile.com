      <p>Hi Dan,</p>
      <p>All I can suggest is:</p>
      <p>1. Look anywhere for clients.<br>
      We have found that some of our best clients have come from the strangest places.</p>
      <p>2. I assume that you're a designer first and a businessman second. Most of the people you deal with will probably be business people first. This means that:</p>
      <p>100% of your clients will be honest, likeable individuals when you discuss their initial requirements.</p>
      <p>40% of your clients will need two or three reminders before they remember to pay up.</p>
      <p>25% of your clients will have a book keeper or accountant who goes on holiday for three weeks whenever you submit an invoice.</p>
      <p>One or two of your clients will just refuse to pay.<br>
      (If the legal system in the US is anything like it is here in the UK, don't waste your time chasing debts. Either write the debts off, or hire someone big &amp; scary)</p>
