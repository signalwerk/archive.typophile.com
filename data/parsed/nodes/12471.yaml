      <p>well, it sounds like you're looking for a low cost way to get going (much like I was when I was in LA). here's a few techniques: get to know local businesses, join an active chamber of commerce (eg City of Industry, Long Beach, LA), make contact with every agency and studio you can find, and pass out lots of business cards. oh yeah, and never stop making phone calls -- you never know who you're going to find.</p>
      <p>and a few other thoughts: I found Craig's list tends toward the low-ballers of the world. then again, I haven't looked in a while. CreativeHotlist might be a good spot for getting in touch with other agencies or corporate contract jobs. and AIGA LA might prove to be a strong resource (I hate designer socials, so I didn't try).</p>
      <p>best of luck to you. your work is quite good, and the writing on your site should win over any sensible business person.</p>
