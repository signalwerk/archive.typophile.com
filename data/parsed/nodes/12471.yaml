      <p>There are a lot of great published resources on marketing, promotion and getting new clients out there, including:</p>
      <p>BRAG! The Art of Tooting Your Own Horn Without Blowing It, by Peggy Klaus</p>
      <p>Designers’ Self Promotion: How Designers and Design Companies Attract Attention to Themselves, by Roger Walton</p>
      <p>Get Noticed!, by Sheree Clark</p>
      <p>HOW Magazine’s Annual Self-Promotion and Business issues - the regular issues of the magazine focus a lot of the business and marketing aspects of the industry</p>
      <p>Off The Wall Marketing Ideas, by Nancy Michaels &amp; Debbi J. Karpowicz</p>
      <p>Self Promotion Online, by Ilise Benun</p>
      <p>Self-Promotion for the Creative Person: Get the Word Out About Who You Are and What You Do, by Lee Silber</p>
      <p>The Graphic Designer’s Guide to Creative Marketing: Finding &amp; Keeping Your Best Clients, by Linda Cooper Bowen </p>
      <p>The Business of Graphic Design, by Ed Gold</p>
      <p>The Business Side of Creativity, by Cameron Foote</p>
      <p>The Creative Business Guide to Running a Graphic Design Business, by Cameron Foote. </p>
      <p>The Graphic Designer’s Guide to Clients: How to Make Clients Happy and do Great Work, by Ellen Shapiro</p>
      <p>Someone else already mentioned Creativepro.com as a resource.  A few other good online resources are <a href="http://www.creativelatitude.com" title="www.creativelatitude.com">www.creativelatitude.com</a> (especially the "Articles" section), <a href="http://www.creativebusiness.com" title="www.creativebusiness.com">www.creativebusiness.com</a> and <a href="http://www.creativepublic.com" title="www.creativepublic.com">www.creativepublic.com</a>.</p>
      <p>Good luck! - J.</p>
      <p>Jeff Fisher :: Engineer of Creative Identity<br>
      <a href="http://tinyurl.com/5y8bm" rel="nofollow">Jeff Fisher LogoMotives</a></p>
      <p>Author: <a href="http://tinyurl.com/5o7ud" rel="nofollow">Savvy Designer's Guide to Success</a> from HOW Design Books</p>
