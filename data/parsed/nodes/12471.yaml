    <p>Well now, a little off the subject of fonts, but lots of you guys here are graphic designers and lots of you guys run your own shows.</p>
    <p>I've been freelancing as a graphic designer (print+web) for two years and I've gotten most of my work through word of mouth (in addition to working at firms). But I've recently moved to LA and I want to do my own work full-time.</p>
    <p>Easy enough, set up a website,</p>
    <p><a href="http://whoisdan.com/" title="http://whoisdan.com/">http://whoisdan.com/</a></p>
    <p>But how do you get the clients?</p>
    <p>Thoughts? Opinions? Criticism?</p>
