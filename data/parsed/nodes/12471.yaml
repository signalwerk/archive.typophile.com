      <p>I started my company by purchasing 40 white pocket folders at Staples Office supply, printing different 5 samples of my work 40 times off my Commodore Amiga &amp; b/w Canon bubblejet printer, putting a cover letter and price list into the folder with the samples, and then mailed it out to the 40 closest printshops in my area.</p>
      <p>I had NO CLUE as to what I was doing.</p>
      <p>After three months, I got a call from one printshop who picked out a line off my cover letter that read - we have (we meaning me, myself &amp; I) over 70 (wow!) different typefaces.  They had to replace a line of text in a job, and didn't have the font Romic. </p>
      <p>Neither did I, but that didn't stop me!  I bought the font from Letraset on a Mac disk, paid $40 to have it transfered to a PC disk, and used a PC to Amiga disk reading program to get it onto the Amiga.  Then I converted it to an Amiga font with a PD utility (Amiga's had a utility for ANYthing back then) and I typeset the line of text they needed. </p>
      <p>That was 1992.  Today, we do over $20k a year business with that same (my very first) client.</p>
      <p>Moral of the story...</p>
      <p>Getting business means solving people's problems.  You are never loved or needed more then when you are solving a problem for someone.  All you need to do is let the world know what problems YOU solve.  *HOW* you do this is the subject of many, many marketing and business books, but once people know you can solve *their* problems, they will come to you.  The first step is letting them know you exist.</p>
