      <p>Dan,</p>
      <p>Congrads on going out on your own in a new city. big challenge.</p>
      <p>All the advice is good - most of it can be summed up as make lots of noise and eventually momentum will begin to work in your favor.</p>
      <p>Can I suggest that you take a little more strategic approach?</p>
      <p>Sit down and figure out what your position in your marketplace should be - based on who you are, capabilities, where you succeed, what kinds of clients are you successful with and what do these clients look for in a design firm - that is for starters.</p>
      <p>Anyway, figure out what you can deliver on and who is an ideal fit. That fit needs to include who is able to appreciate your value and is willing to pay for it. Once you have a profile of the ideal client start researching your market to identify actual companies that fit your target. Create a database of these potential clients - call them, ask for who buys your type of service there - get name, title and phone number. no need to talk to them yet, just get info at this point.</p>
      <p>OK - now that you have an idea of your perfect client, a list of potential perfect clients and some free time on your hands ... begin to work out what value these clients are looking for - NOT what you have to offer, but what value they want. (If this does not click, get some books out on value oriented marketing etc.) Figure out that value - it may be different for each one or all the same. You gotta figure it out. if it is different for each, you may have been too broad in identifying your target. Keep it tight for starters - you can always broaden once you have some success under your belt.</p>
      <p>Now, you have your value identified, create a message around that value - tell them how you offer the value they want. this is your mantra. hammer it home. Any contact you have with them should communicate this value - phone calls, direct mail .etc.</p>
      <p>You have a number of references here on self promotion and marketing, so I will not go through a step-by-step on that. The key here is:</p>
      <p>Identify your target based on fit<br>
      Identify the value your target wants<br>
      Create messaging around that value</p>
      <p>March out your marketing machine. Unleash your campaign - and don't just rely on a one-off effort. Soften them up with a post card, make a phone call, get a portfolio review, send off a white paper that you wrote (make sure it is value oriented!) and book orders, baby!!!</p>
      <p>Also, key - I am begging you not to sell on price. You live by price you die by price. No need to step on their neck and take advantage - that is wrong and bad business. but, charge a fair rate and get paid for the value you offer.</p>
      <p>Gasp ... one last thing, I do not agree regarding earlier comments about business people not wanting to pay and 25% of them screwing you over. That may be someone else's experience, but it is like marriage and divorce - rarely is it just one side's fault. I *rarely* have a client that does not pay - rarely. We work with great people and we do great work. We deliver and they pay. Everyone is happy. Out of a million in sales this year I am out about $1,200 and that is because the company went under. Not bad odds if you ask me.</p>
      <p>Ok, enough outta me - all the best Dan!</p>
      <p>--<br>
      Mike</p>
