    html: <p>Usually when we run into a wall like this, it's because it's a custom design (not likely in this case), it's an obscure freeware font that even Mike F doesn't know, or it's not a single font. That would explain why the K is so wide compared to the other letters. <br> <br>For example, I could use the H, A, L, S, P, T and R from Chalet Comprime (incl. alternates), the K and N  from Neutraface or Futura (with some N squeezing) and I could re-create it. The Neutraface option keeps it all in one foundry, but Futura is widespread. <br> <br>I know you guys/gals could think of other fonts that would supply the necessary letters.  <br> <br>Sometimes the answer might be in thinking 'outside the font folder', so to speak. I know many of you are gagging right now. Sorry.</p>
