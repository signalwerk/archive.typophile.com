  html: |-
    <p>This is a 'bout of trying to create a logo for my design business. Please, ignore the exceedingly stupid 'slogans' under the three ideas I have, they're in place for the purpose of taking up where a slogan will/could go.</p>
    <p>Questions I have off the bat:<br>
    Are any of them balanced?<br>
    Would a different font be better?(I'm using PhrasticMedium right now)<br>
    Does it look elementary?<br>
    Too cluttered/busy?<br>
    Would different layouts all together be better to aim at?<br>
    Would you(personally) even want to look into a business with any of these logos?</p>
