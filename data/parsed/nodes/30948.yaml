    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Paul van der&nbsp;Laan</strong></p>
    <p>Paul van der Laan is a Dutch type designer working under the foundry name <a href="/node/30953" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Type Invaders</a>. Van der Laan is a speaker at the <a href="http://www.22ft.de/">22. Bundestreffen Forum Typografie</a> conference.</p>
    <p><strong>Typefaces</strong></p>
    <p><a href="http://www.linotype.com/1118/linotyperezident-family.html?PHPSESSID=62266609d0ee7ce51990853ef8f209c5">Linotype Rezident</a>. The typeface was originally created for a friend of his named Leon which is also the name of a character in the game <em>Resident Evil</em>. Resident also refers to The Hague, residence of the parliament of the&nbsp;Netherlands.</p>
    <p><a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=FF%20Kievit"><span class="caps">FF</span> Kievit</a>, with <a href="/node/16448" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Michael&nbsp;Abbink</a></p>
