    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Paul van der Laan</strong></p>
    <p>Paul van der Laan is a Dutch type designer working under the foundry name <a href="/wiki/Type%20Invaders" class="freelinking" rel="nofollow">Type Invaders</a>. Van der Laan is a speaker at the <a href="http://www.22ft.de/" rel="nofollow">22. Bundestreffen Forum Typografie</a> conference.</p>
    <p><strong>Typefaces</strong></p>
    <p><a href="http://www.linotype.com/1118/linotyperezident-family.html?PHPSESSID=62266609d0ee7ce51990853ef8f209c5" rel="nofollow">Linotype Rezident</a>. The typeface was originally created for a friend of his named Leon which is also the name of a character in the game <em>Resident Evil</em>. Resident also refers to The Hague, residence of the parliament of the Netherlands.</p>
    <p><a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=FF%20Kievit" rel="nofollow">FF Kievit</a>, with <a href="/wiki/Michael%20Abbink" class="freelinking" rel="nofollow">Michael Abbink</a></p>
