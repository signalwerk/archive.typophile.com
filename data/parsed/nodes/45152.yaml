  html: |-
    <p>In the general info section of a type 1 or opentype font (the only font types that I've messed with) there is a number for the italic angle. In Font Forge you can reset this value, presumably to a more accurate value — at any rate the original value changes. Something is being gotten wrong here, and I tend to trust FontForge to get this right. Do any programs actually read the italic angle info in the font and what do they use it for? I'm curious, given that it often seems to be wrongly set.</p>
    <p>Thanks</p>
