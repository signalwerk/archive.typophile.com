    html: <p>I looked at that Mike... and yes, it’s kinda close, but the terminals on the “3” are perfectly horizontal on the saample. I suspect it’s something that someone has mangled and tortured. I was thinking that it might have been originally a condensed black of some font that has been super s-t-r-e-t-c-h-e-d (hence the weird weight differences). But thanks anyway!</p>
