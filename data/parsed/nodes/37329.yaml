      <p>I’m glad (or bitter) that you got to go to the House AIGA presentation. :-)</p>
      <p>My train leaves to Albuquerque this Saturday. I’ll be there for 2 weeks. I wonder if any House stuff will still be there on display.</p>
      <p>I have noticed the a “textual” trend at House too. Display faces are one trick ponies and go out of fashion much faster than a text face. Their new text systems are fabulous. Paperback, Neutraface, and Luxury all seem like the forerunners of this new trend and look like they have lots of longevity to their design.</p>
      <p>Mikey :-)</p>
