      <p>&gt; what kind of effect to try?</p>
      <p>Photoshop. The most basic:<br>
      1. Type the word etc; convert to shape.<br>
      2.  Layer Styles Blending Options dialog: Advanced Blending 35%; Blend Mode: Multiply<br>
      3. Apply Layer -&gt; Layer Style &gt; Stroke / Inner Glow/ Outer Glow etc etc etc </p>
      <p>If it does not work check the electrical wall outlet  :^)</p>
