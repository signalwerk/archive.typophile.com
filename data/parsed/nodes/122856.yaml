    <p>How would you classify Bodoni and Didot? What's the narrowest classification? Many sources label them only as modern. Like here:<br><a href="http://graphicdesign.spokanefalls.edu/tutorials/process/type_basics/modern.htm">http://graphicdesign.spokanefalls.edu/tutorials/process/type_basics/mode...</a></p>
    <p>But "modern" is a quite wide classification. Today many new fonts are inspired by Bodoni and to label them all as modern is just blunt.</p>
    <p># Sorry if this question already exists in the forum, but there is no advanced search function so I can't find any matching thread.</p>
