  html: <p>I have a client who wish to use a specific ornament from a book dated back to 1920 as his mark in his logo. My question is if I can just simply use this straight out of the book as my client wishes, or can I tell him that I will have to design a unique ornament inspired by the one in the book? I obviously prefer to design a unique mark!</p>
