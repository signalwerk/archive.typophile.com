    <div class="info">Submitted by <a href="/user/1085" title="View user profile.">dan_reynolds</a> : 9.Feb.2006 1.52am </div>
      <p><strong>Linotype’s LinoLetter for February 2006 – Undiscovered Font Charms and a New Font Catalog</strong></p>
    <p>Check out the full version of this month’s newsletter at the Linotype website: <a href="http://www.linotype.com/8-38-8-19293/issue200602.html" title="http://www.linotype.com/8-38-8-19293/issue200602.html">http://www.linotype.com/8-38-8-19293/issue200602.html</a></p>
    <p><em>Content Preview:</em> This issue of the LinoLetter opens with a view toward a vigorous and well-received text type family: Bohemia™. Following this is our lighter side – a special cartoon font section. Here we will introduce you to a few clever comic-style fonts. Peer in a bit deeper to discover the extraordinary script face Bergell™, whose mesmerizing elegance and dynamism set it apart from day-to-day fonts. But we’ve saved our best treat for last: our new “Complete Typeface Catalog, A–Z.” Hot off the press, this book is now the standard reference guide for fonts in the Linotype library, presented in a beautifully bound form.</p>
    <p><a href="http://www.linotype.com/8-38-8-19293/issue200602.html">Read the rest of the Linoletter at Linotype.com!</a> </p>
    <p>Or, <a href="http://www.linotype.com/webshop/newsletter.php">subscribe to the Linoletter</a>, and get the information delivered every month directly to your mailbox.</p>
