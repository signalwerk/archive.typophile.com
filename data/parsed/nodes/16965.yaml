    <p>I’m designing a business card and want to use a Bodoni. I love the <a href="http://www.myfonts.com/fonts/linotype/bauer-bodoni/roman-small-caps-and-oldstyle-figures/">Bauer Bodoni sc&amp;osf</a>, but I don’t like the Bauer Bodoni roman. I do like the <a href="http://www.myfonts.com/fonts/agfa/bodoni-mt/">Monotype Bodoni roman</a>.</p>
    <p>Do you think it would be in bad taste to pair the Monotype Bodoni roman with the Bauer Bodoni osf?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/17162" class="topic-previous" title="Go to previous forum topic">‹ Similar, complimentary font to Gill Sans</a> <a href="/node/17155" class="topic-next" title="Go to next forum topic">logo &amp; typography ›</a></div>
