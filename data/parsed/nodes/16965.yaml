    date_raw: 28.Dec.2005 8.47am
    votes: null
    html: <p>Depending upon the pt size of the type, the serifs on the Bauer Bodoni — and eventually if too small on the Monotype Bodoni — will disappear. You might consider using <a href="http://www.myfonts.com/search?search%5Btext%5D=ITC+Bodoni">ITC Bodoni</a>, incorporating the various sizes. This would, I would guess, answer your needs and give you the options without having to mix and match from two different families.</p>
