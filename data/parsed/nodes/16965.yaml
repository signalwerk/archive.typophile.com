    html: |-
      <p>I just finished a letterhead biz card job in Berthold Bodoni 2 weeks ago.  As Nick says, it has all the bits.</p>
      <p>Bauer Bodoni is quite lovely but does not hold up in small sizes.  I always wondered if when Bauer was digitized, it was drawn as it was for hot metal where the hairlines would build up with ink-spread.  No letterpress, no ink-spread. Bauer still looks luscious as a display face though.</p>
      <p>ChrisL</p>
