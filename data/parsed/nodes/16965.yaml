      <p><em>I always wondered if when Bauer was digitized, it was drawn as it was for hot metal where the hairlines would build up with ink-spread.</em></p>
      <p>More likely that a larger size of the type was used as a master.<br>
      A reasonable decision, considering that the Bauer foundry type Bodoni was the most exquisite version of the face, so if you’re digitizing it, you keep that “brand” quality.</p>
      <p>But enough of Bodoni. Haven’t seen him at TypeCon recently and rumor has it that he’s no longer with us.<br>
      Why not check out the new-fangled way of doing things, as selected in <a href="http://typographi.com">Our Favorite Fonts of 2005</a> at Typographica?<br>
      Lots of lovely new serif designs, with all the bells, whistles, gongs and glockenspiels you could ever wish for.</p>
