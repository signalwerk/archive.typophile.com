    html_clean: |-
      <p>The surest way to kill a joke is to analyse it, I suppose.</p>
      <p>Still, I work in production, not design, and I get to look at author manuscripts and then (fingers crossed) improved typeset copy all day (and just occasionally I'm able to nudge dodgy usage in a better direction, as in "please do not break ‘analysis' after the ‘l'" or "please do not add hyphens to this URL at a line break"), and I got a chuckle from this &amp; forwarded it to my colleagues. Of course we wouldn't dream of <em>actually</em> using it, but the fun is in imagining using it: and therefore the supposition is that there's such a lot of poor or non-existent kerning about that you'd need a lot of stickers for that. (Hey, it got my boss to look up ‘kern'!)</p>
      <p>Ever since I chose to block pop-ups, my toaster's stopped working.</p>
