      <p>&gt; <em>Fine as an “in joke”, where they probably would have kept it, (if not for the publicity).</em></p>
      <p>To set the record straight, I lured them out. :^P</p>
      <p>As for "making people feel good about other people’s bad design", I really don't get your point.</p>
      <p>I printed out the Visual Enforcement Kit, passed it around in the studio and we all had a good laugh. I didn't apply any sticker on anybody else's work and prolly never will. The thought never even crossed my mind. I think – no, I'm convinced – that's what most people will do, and that's how it should be. Why always assume the worst?</p>
