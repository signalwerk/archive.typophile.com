    html: |-
      <p>I'm afraid my command of written English fails me here : in my opinion, these so-called stickers are obviously not meant to be used at all, even for fun. The joke (of Monty Pythonesque proportion, I would dare to say) here is the SUPPOSITION that they simply COULD exist — and that there would be morons to use them. Not a sane mind would even THINK about using them — so they are a way to poke fun at typographic ayatollahs, which implies a healthy dose of caricature (hence the multiple "Kern this!" provided on this FICTITIOUS "toolbox").<br>
      I'm a teacher myself and I wouldn't use this stuff on my students' work — but, as already told, I shared the joke with them and they did find the whole thing ludicrous AND funny.</p>
  - id: 255370
