    html: |-
      <p>"“Kern This!” is precisely the kind of comment a tight-sphinctered typographer would make AGAIN AND AGAIN"</p>
      <p>Perhaps a tight-sphinctered typographer who's already inserted his head up the anatomy in question would repeatedly shout, "Kern this!", and think it was funny, over , and over, again... But, the tight-sphinctered typographer with his head bent on typographic improvement says, "Kern this 2 units tighter", or  "Kern this 2 units looser", sticker, or not. See the difference? Really, I'm not trying to strenghten your point for the time when it'll be an easier insertion for you. If you don't believe me, go ahead and repeatedly shout, just the "Kern this!" sticker, at a bunch of student projects. My guess is, they won't even laugh a little, the first time. :-o</p>
      <p>Cheers!</p>
