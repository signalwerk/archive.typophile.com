      <p>We need all the eyes we can get on matter set in type. Including ADs' eyes and designers' eyes and typesetters' eyes. But do only the most obvious corrections yourself. Query all others on proofs and make sure you get answers from them what wrote the stuff in the first place. </p>
      <p>You are all hereby deputized into the "Word Police" force. Go forth and do good work.</p>
      <p>powers</p>
