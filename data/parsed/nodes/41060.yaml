    html: |-
      <p>"In the repeating row of “Kern This!” stickers, is the first “Kern This!” sticker more or less ’funny/educational’ than the eighth, “Kern This!” sticker? If one were not supposed use them, then one would need but one of each, Sherlock."<br>
      Sorry, Mr Berlow, but I disagree with you again on this one — I think the repetition of certain instructions is definitely part of the joke : "Kern This!" is precisely the kind of comment a tight-sphinctered typographer would make AGAIN AND AGAIN (we are all a bit obsessed by that, aren't we ?).<br>
      I tend to think you're strenghtening my point, here.</p>
  - id: 255099
