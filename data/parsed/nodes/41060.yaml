    html: <p>David, I think that Stéphane's point is that finding objectionable kerning will happen more often as you look over designs than the others so it's natural that there should be more of them and that you would locate them on a page together. Not as you have it that you would either use ( or shout ) kern this repeatedly one after another.... Still, as you have no doubt deduced I could not condone use except among consenting adults.</p>
