      <p>Personally I feel that the pride I put in my work entitles me to be disheartened when I see sloppy, lazy typography. And I will accept criticism whenever I blunder. Humour is a healthy way to deal with these feelings. The day we won't be allowed to poke fun anymore at something that irks us will be a sad day indeed.</p>
      <p>Peace.</p>
