    html: <p>Hi Jim. Sorry for the confusion. It's true that "all" is incorrect there, and we'll change the text. Some of Adobe's fonts, including Penumbra, have been kept out of Typekit (and any web licensing) due to licensing complications here at Adobe. We are actually working on a solution to that right now, but I can't give you any timetable or promises about that.</p>
