    <p>Probably shouldn't be surprised, but it's the firs time it's happened. Working with a typeface across a new brand (in this case, several cuts of Penumbra) and go to try and extend the licence to web usage. And I can't find the option anywhere. Myfonts don't allow webfont purchase for Adobe fonts, same on Fontspring, but when I look on the Typekit (which according to the Adobe site: 'All of Adobe's fonts are now available on Typekit.com as part of the Typekit subscription library'), it's nowhere to be found.</p>
    <p>Is that 'All' a mistake? Should that not include Penumbra? Should I be looking somewhere else? Or is it time to start looking for webfont alternatives? Thanks.</p>
