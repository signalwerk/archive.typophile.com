    <p>I know Brill is the name of  publishing house. What I didn't know-- though I suppose most of you did -- was it was also the name of William's lead ship when he invaded England.</p>
    <p>From Wikipedia:</p>
    <blockquote><p>With a Dutch army, William landed at Brixham in southwest England on 5 November 1688. He came ashore from the ship Brill, proclaiming "the liberties of England and the Protestant religion I will maintain".</p></blockquote>
