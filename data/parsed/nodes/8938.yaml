    html: <p>What John said. <br> <br>My only other route would be, if you have a whole bunch of .swsh02 alternates for different letters, and these share something in common, it would make sense to use the "stylistic sets" feature instead. So you'd have a default swash, and then use 'ss01' on top of that to access the alternate swashes. Or 'ss02' for a different set of alternate swashes. (All assuming that there was something that these swashes had in common.) <br> <br>T</p>
