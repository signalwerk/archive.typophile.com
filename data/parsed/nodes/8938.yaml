    html: <p>Yay, I got it to work! (I couldn't access the alternates through the glyph pallette the way I had them set up before. The glyph would show in the pallette, but not insert) I set the swsh feature so that it would "sub A by A.swsh" and then set the salt feature so that it would "sub A from [A.swsh A.swsh02]. I Thought of making a stylistic set, but I don't know how to access them in InDesign CS (is it possible?)</p>
