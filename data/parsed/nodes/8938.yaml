    html: "<p>You have run up against two limitations in InDesign: there is no support for one-to-one-of-many substitutions, and there is no support for the &lt;salt&gt; feature. In your situation I would make the subsitution as you originally had it <br> <br>sub A from [A.swsh A.swsh02] <br> <br>because this will make the font ready to work in future, when one-to-one-of-many substitutions are supported. For now, you will have to rely on the glyph pallette to access the second set of swashes. You could hijack another feature, of course, but I don't recommend this.</p>"
