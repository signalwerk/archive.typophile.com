    <p>Ok so I have a font with multiple swash alternates and I can't figure out how to make both of them available in InDesign. For example, I have A.swsh and A.swsh02. Originaly i had the swsh feature set up so that it would "sub A from [A.swsh A.swsh02]" And that only gives me the first alternate, the second shows up in the glyph pallette, but will not insert, I only get the first. Then I tried setting up the swsh feature so that it would "sub A by A.swsh" and the salt feature so that it would "sub A.swsh by A.swsh02" but when i did this, I would only get the regular A when i selected the A.swsh02 glyph from the pallette. Is there any way to get it to do what i want? maybe it's in the glyph naming? Any help would be appreciated. Thnx.</p>
