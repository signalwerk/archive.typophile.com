      <p>My initial impressions; I couldn't tell that was a person in the background, a little too vague with just a circle on top of a box. Also, is there a reason for the green "o" at the end of "cresco?" Conceptually, is there a better symbol or group of symbols that will more effectively communicate these sustainable habits? I see soooo many leaves and the color green on all these eco-friendly, sustainable this-and-that logos that they all start to melt together. Green noise, if you will.</p>
      <p>Again, just an initial impression, and I'm very interested to see if anyone has ideas regarding alternative ways to communicate the whole "green" concept.</p>
