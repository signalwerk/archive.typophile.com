      <p>Hi Typophiles :)<br>
      My logo was awarded the first prize in the school competition, and is currently used by the Cresco no profit organization.<br>
      I would like to thanks all the users which contributed in making my design progress with their criticism.</p>
      <p>This is how it looks like at the end, after a direct confrontation with the client.<br>
      • <a href="http://img175.imageshack.us/img175/7505/picture3q.jpg" title="http://img175.imageshack.us/img175/7505/picture3q.jpg">http://img175.imageshack.us/img175/7505/picture3q.jpg</a><br>
      Do you think the type got (at least a little bit) better?</p>
      <p>Also, I would like to hear some suggestions about another version of the logo they asked me to design for them.<br>
      The text they require is "isola cresco" (cresco island) and it's like a ''medal'' they would give to cities which are parts of the project.<br>
      They want to retain the same graphic symbol but they were thinking of having the text running around in a circle.<br>
      I don't think it would work, but I dont think either that having the same symbol and a different text would work.<br>
      I fear it would only create confusion with the main logo, especially because on its first period.<br>
      What do you think?</p>
