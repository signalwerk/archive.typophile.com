      <p>It's a start, and it shows you're thinking which is a great start.</p>
      <p>While I agree about the greenwashing/use of leaves is done to death, I'm going to leave that.</p>
      <p>What you've got just isn't friendly in any way. Sustainability (in this capacity) is about people making a difference, changing the way they behave, consume and ultimately their impact on the environment.</p>
      <p>The mark you currently has feels totally sterile and clinical. </p>
      <p>Sure lowercase letters can (in general) give the impression of a more relaxed and casual organisation ... but type choice still affects the response - so pay attention.</p>
      <p>We say it over and over, but we can't say it enough. Sketch your ideas (with pen and paper) new avenues will pop up, they always do. Develop the idea and go from there.</p>
      <p>----------<br>
      <strong>Paul Ducco</strong><br>
      <a href="http://www.solid-creative.com" rel="nofollow">Graphic Designer</a> - Melbourne</p>
