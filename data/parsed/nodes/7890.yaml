    html: <p>Hi Tamara, <br> <br>Wow $40 per font, you can buy almost anything (from us at least).  <br> <br>My first recommendation, if you like Sabon NEXT, would be the original Sabon. They are two different designs, but the original Sabon was designed by Jan Tschichold, and is pretty comprehensive. Sabon has many, many weights, and separate Small Caps sets available, so you certainly can get a bold italic. You can even get a bold italic small caps/osf font! All weights cost 22 Dollars or Euros, plus tax. The regular weight is even availble as an OpenType font�so the small caps and old style figures are already in there. What a value &amp; savings!  <br><a href="http://www.linotype.com/1436/sabon-family.html" target="_blank">http://www.linotype.com/1436/sabon-family.html</a> <br> <br>Sabon is based on Garamond. Jean-Fran�ois Porchez, when he designed Sabon NEXT, wanted to make Sabon more like its Garamond roots, I think. So you should look at some Garamonds, too. The prettiest Italic weight in any Garamond is hands down Stempel Garamond's. Stempel Garamond has 13 different fonts, including that bold italic small caps/osf! Each one costs 22 Dollars/Euros <br> <br><a href="http://www.linotype.com/1500/stempelgaramond-family.html" target="_blank">http://www.linotype.com/1500/stempelgaramond-family.html</a> <br> <br>There are lots of other Garamonds on the market. You can comparison shop (both price and style) by using MyFonts.com <br> <br>Also, you might want to consider another font from Jean-Fran�ois. A good text face might be his Le Monde, which is the typeface used to set the French Newspaper Le Monde. Check out some of the other faces there, too. I don't know if you can buy these as individual weights or not, though. Try asking him. <br> <br><a href="http://www.typofonderie.com/alphabets/view/LeMondeJournal" target="_blank">http://www.typofonderie.com/alphabets/view/LeMondeJournal</a> <br> <br>And, if none of these do it for you, let me know and I will try again</p>
