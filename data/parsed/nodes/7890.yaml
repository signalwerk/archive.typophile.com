    html: <p>That depends on which Agenda you mean. On MyFonts.com, I found two very different looking typefaces named Agenda. The sans serif Agenda from Font Bureau would still pair well with Sabon, I think. The other Agenda from URW++ I'm less sure about. That might call for a more robust serif face? <br> <br>BTW, Avenir NEXT has a semibold condensed weight of its own. The revised/expanded Avenir NEXT is a much better family than the original Avenir, but it might be out of your budget range�</p>
