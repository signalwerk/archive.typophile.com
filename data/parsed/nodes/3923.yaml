  html: '<p>I work on a movie project and I have to produce clean subtitles/captions for it. <br>So does someone know which typefaces are the most used for subtitling? Which sizes work best? What do I have to know? <br>Thank you. <br> <br>I have already found these resources: <br>.ITC <a href="http://www.itcfonts.com/fonts/detail.asp?sku=ITC9194" target="_blank">Tabula</a> was originally conceived to be used in film subtitling. <br>.A useful article by Joe Clark <a href="http://www.joeclark.org/uksubs.html" target="_blank">"Comments on U.K. </a></p>'
