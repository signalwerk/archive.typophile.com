  html: "<p>Fontworks Newsletter | January 2003 <br> <br>The longest, darkest month is over and along with it, I expect, is your New Year commitment to drink/eat/smoke/spend less, quaff 10 litres of water a day, go organic, take up Tai-Chi and squeeze in that 2 mile jog before work which you've heard will make you more productive in your job. Which just leaves that promise you made to update your type collection and freshen up your corporate image. Which is where Fontworks comes in... <br> <br>- NEW LINOTYPE eCDs: GREAT COLLECTIONS FOR IMMEDIATE DOWNLOAD <br>Why pay for shipping when you can download instead? Fontworks now offer classic CD products such as Neue Helvetica, Frutiger and Zapfino from Linotype Library as bundled electronic entities to buy and download online. Click below for a full product and contents listing. <br><a href=\"http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/fwks/products/lino_ecd_index\" target=\"_blank\">http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/fwks/products/lino_ecd_index</a> <br> <br>- FREE PDF DOWNLOADS: LINOTYPE PLATINUMS, TAKETYPE etc <br>Juergen Weltin's 'Finnegan' is featured alongside 'Gianotten' (Antonio Pace's Bodoni revival), 'Syntax' and 'TakeType' in a series of illustrative PDFs just added to our Linotype Library \"Display Case\" page. Includes an informative guide on how best to work with Hermann Zapf's ground-breaking 'Zapfino' script face. <br><a href=\"http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/fwks/demo/lino/linotype\" target=\"_blank\">http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/fwks/demo/lino/linotype</a> <br> <br>- MANNA FROM MANCHESTER! TWO NEW FOUNDRIES SIGN UP <br>Fontworks have added two budding new type stars to the stable, both residents of Manchester. DARREN SCOTT (senior typo at McCann-Erickson M'chr) has releases for T-26 and FUSE to his credit and his Darren Scott Typographics vehicle provides him with the perfect platform to develop his passion for visible language. New release 'Nitrogen' could rival 'Mechanic Gothic' in popularity before long. View samples and purchase DS fonts: <br><a href=\"http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/scan/se=Darren_Scott/mp=1\" target=\"_blank\">http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/scan/se=Darren_Scott/mp=1</a> <br> <br>PlayStation, Manga and motor racing are just some of the healthy interests behind the debut collection by Anthony Roberts, director of blossoming Manchester design agency, FATHOM. And the purpose? An attempt to discover where letterforms lose the will to live! Judge for yourself: <br><a href=\"http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/scan/se=Fathom/mp=1\" target=\"_blank\">http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/scan/se=Fathom/mp=1</a> <br> <br>- ADOBE SPECIMEN BOOK OFFER; GET IN QUICK! <br>Very limited edition sets of 'Adobe Originals' type reference books are on offer at 45 GBP per set (RRP 200 GBP). Includes Minion, Utopia, Tekton, Lithos and Caflisch Script. Check the full listing on our site and place your order by following this link: <br><a href=\"http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/fwks/products/books/adobe\" target=\"_blank\">http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/fwks/products/books/adobe</a> <br> <br>- MOREY AND BARNBROOK TYPOGRAPHY MASTERCLASS <br>Creative Review host a type event on February 19th featuring Julian Morey (Club 21), Robin Nicholas (Monotype) and Jonathan Barnbrook (Virus), to be held at Pentagram. All tickets have now been sold but those who've missed out can seek solace in viewing and purchasing Club 21 and Virus fonts from our type.co.uk website. Morey's 'Rock and Roll' christmas card designs also adorn CR's Feb cover. <br>View and buy Club 21 fonts: <br><a href=\"http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/scan/se=Club_21/mp=1\" target=\"_blank\">http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/scan/se=Club_21/mp=1</a> <br>View and buy Virus fonts: <br><a href=\"http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/scan/se=Virus/mp=1\" target=\"_blank\">http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/scan/se=Virus/mp=1</a> <br> <br>- TRAVELLING TYPOGRAPHER #10 <br>Adland's senior typos and creatives are jostling for exposure in 'our Neil's' monthly column. Who comes under the spotlight this time? <br><a href=\"http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/fwks/TravTypo/310103\" target=\"_blank\">http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/fwks/TravTypo/310103</a> <br> <br>- HOUSE INDUSTRIES RELEASE 'NEUTRAFACE' <br>Deceased architect Richard Neutra is immortalised by the release of 'Neutraface' from House Industries, a new 30 weight family including display and text versions inspired by Neutra's famous sign lettering. Contact our sales dept. (020 7226 4411, <a href=\"mailto:sales@type.co.uk\">sales@type.co.uk</a>) for further details, pricing etc. <br> <br>An online version of this newsletter and archived newsletters can be found here: <br><a href=\"http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/fwks/news/newsletter/index\" target=\"_blank\">http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/fwks/news/newsletter/index</a> <br> <br>//Ends.  <br> <br>~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ <br>++ DISCLAIMER ++           ++ DISCLAIMER ++            ++ DISCLAIMER ++ <br>~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ <br>You have received this eMail because you are a subscribed member of the  <br>Fontworks NewsLetter. If you wish for any reason to stop receiving this <br>Mail then please take note of the address that this message was sent to <br>and then proceed to the following location: <br> <br>   <a href=\"http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/fwks/subscribe\" target=\"_blank\">http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/fwks/subscribe</a> <br> <br>Regards, <br> <br>Fontworks NewsTeam   |   <a href=\"http://www.type.co.uk\" target=\"_blank\">http://www.type.co.uk</a>   |  <a href=\"mailto:NewsTeam@type.co.uk\">NewsTeam@type.co.uk</a> <br>~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ <br>  Fontworks UK Limited, 202 - 208 New North Road, London, N1 7BJ, UK</p>"
