    html: <p>Right click in the Font Window and select 'Append Glyphs'. This will paste the copied glyphs into the new font without overwriting any existing glyph cells. If glyphs already exist in the font that have the same names as appended glyphs, the latter will have a number added to their name, e.g. /glyph.001/.</p>
