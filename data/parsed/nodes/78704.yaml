    html: |-
      <p>"Use Paste Special" but don't start on a coded glyph.  Go to the end of the coded glyphs in your new window.</p>
      <p>A better way is to copy all the glyphs you want to paste into a text editor.  Then select "Search and Replace"  replace each "slash" with a space.  Use this edited text to paste into the window of "Generate New Glyphs" window.  It will then generate the same naming order of glyphs as in your list.  After that, copy the glyphs from your original file, then select all the newly created alternates and paste into the window.</p>
