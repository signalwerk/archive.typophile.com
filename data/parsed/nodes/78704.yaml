  html: |-
    <p>Hello,</p>
    <p>I am trying to copy several alternate glyphs from one window font to another one (which not have alternate glyphs in it). I first select my alt glyphs (about 80) in my font window, copy, go to the other font window and paste.<br>
    But I get this annoying message saying : "You have dropped glyphs at the places used by the glyphs with names listed below…" CANCEL or REPLACE. </p>
    <p>The thing is that I named all my alternate glyphs "xxx.alt" and I have no such glyphs with that names in my new fontwindow. In fact the alert window says that the glyphs to be replaced by the alt glyphs are common ones (space, one, two, etc.). I really don't get it. Even with a new font window it does not create the extra glyphs but just replace some existing ones. Do I do something wrong (I guess so…). Is it because my alternate glyphs have name but no unicode numbers ? Any help would be much appreciate ! Thanks.</p>
