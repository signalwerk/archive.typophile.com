    html: |-
      <p>The message is not annoying: it's telling you that you're going about this process in the wrong way.</p>
      <p><em>The thing is that I named all my alternate glyphs "xxx.alt" and I have no such glyphs with that names in my new fontwindow.</em></p>
      <p>Precisely the problem. There's probably a way to script this process, BUT what you need to do is to create glyph slots in your new font window for your alts. Select Names mode, then find a glyph slot that is normally blank--I usually use the one immediate to the tight of "oe"--and double-click. Then right-click/shift-click for the Properties dialog, and enter your first alt.glyph name. When you hit "Apply," the box will relocate itself with its new name. Repeat the process for each new alt.glyph you want to add. When you're done, open your alt.glyph font and minimize it. Then select Tools &gt; Merge Fonts, and apply. FontLab will do all the cutting and pasting for you, without any "annoying" messages, and all your glyphs will be where you want them to be.</p>
