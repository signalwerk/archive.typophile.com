    date_raw: 17 Feb 2004 — 1:35pm
    votes: null
    html: <p>It seems there isn't a huge amount of text. This means you have more leeway in terms of sacrificing a bit of readability. So a sans -a good one- might be fine, although it's not easy to find a texty sans with enough character to "carry" a book about a pop artist. Look at Quadraat Sans, or maybe some of Storm's fonts. <br> <br>Proforma will not be very happy when set small, since it's a bit narrow and has a modest x-height. But it's actually the kind of font that can support a 5% width increase, and if you choose a darkish weight and track it looser it might work out very well. For a companion, look at FB's Amplitude. <br> <br>hhp <br></p>
    html_clean: <p>It seems there isn't a huge amount of text. This means you have more leeway in terms of sacrificing a bit of readability. So a sans -a good one- might be fine, although it's not easy to find a texty sans with enough character to "carry" a book about a pop artist. Look at Quadraat Sans, or maybe some of Storm's fonts. <br> <br>Proforma will not be very happy when set small, since it's a bit narrow and has a modest x-height. But it's actually the kind of font that can support a 5% width increase, and if you choose a darkish weight and track it looser it might work out very well. For a companion, look at FB's Amplitude. <br> <br>hhp <br></p>
