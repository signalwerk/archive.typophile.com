    html: <p>It seems there isn’t a huge amount of text. This means you have more leeway in terms of sacriﬁcing a bit of readability. So a sans -a good one- might be ﬁne, although it’s not easy to ﬁnd a texty sans with enough character to “carry” a book about a pop artist. Look at Quadraat Sans, or maybe some of Storm’s fonts. <br><br>Proforma will not be very happy when set small, since it’s a bit narrow and has a modest x-height. But it’s actually the kind of font that can support a 5% width increase, and if you choose a darkish weight and track it looser it might work out very well. For a companion, look at <span class="caps">FB</span>’s Amplitude. <br><br>hhp <br></p>
    html_clean: <p>It seems there isn’t a huge amount of text. This means you have more leeway in terms of sacriﬁcing a bit of readability. So a sans -a good one- might be ﬁne, although it’s not easy to ﬁnd a texty sans with enough character to “carry” a book about a pop artist. Look at Quadraat Sans, or maybe some of Storm’s fonts. <br><br>Proforma will not be very happy when set small, since it’s a bit narrow and has a modest x-height. But it’s actually the kind of font that can support a 5% width increase, and if you choose a darkish weight and track it looser it might work out very well. For a companion, look at <span class="caps">FB</span>’s Amplitude. <br><br>hhp <br></p>
