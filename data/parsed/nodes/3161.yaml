    html: <p>What is David Hockney about? <br>What is the target demographic/usage of the book? <br>What’s the format? Length, page size, paper stock, illustration ratio, etc. <br>How important is readability versus aesthetic expression? <br><br><span class="caps">BTW</span>, of those four Serifa and Scala Sans have inadequate readability (for book-length work); Proforma could work if the point size is big enough or the paper a bit rough; and Eidetic is mannered but functional. <br><br>hhp <br></p>
