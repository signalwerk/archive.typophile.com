    html: <p>Daniel.. i agree.. the only thing is... this is for a class called "book typography" so I chose to make the book less about his art and more about his life so that I would have a little more wiggle room with type, thats why im pushing really hard to select some really good faces that might not be as well known as what the other kids are using (garamond, univers, gill sans etc.) <br> <br>I'm thinking I should crack open my Indie Fonts books and find something to use for chapter openings/headers.</p>
