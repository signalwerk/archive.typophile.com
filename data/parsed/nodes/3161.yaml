    html: <p>the book is basically a retrospective on the work of hockney… one of the most famous pop artists. the book will be square.. 8.75” in each direction. About 64 pages and the illustraion to text ratio will be about 30% tops favoring text.  <br><br>well i originally wanted to go sans serif.. but maybe serif will be better in the long run and allow me to match it up with a nice sans for the headers etc.  this is a school project that i will probably be putting in my portfolio and will be output on an inkjet so the face will have to be a bit forgiving. Would proforma do well for this book as a text face? So far it is the face I am leaning to. It will be used at 8, maybe 9 point. Also, what would you recommend for a face that will work well with it for&nbsp;headers? </p>
