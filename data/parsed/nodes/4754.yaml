  html: <p>i'm curious to know what typophile readers find to be the most elegant and stylish typefaces, and why. also, what makes a typeface elegant? and, is elegance intrinsic or conferred upon? maybe it is a lot to answer. mostly i'm interested in readers at least listing what typefaces they find to be the most elegant.</p>
