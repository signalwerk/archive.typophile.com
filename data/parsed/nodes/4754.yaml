    html: <p>Interesting question. I wouldn't combine elegant and stylish though, because to me the former has austerity while the second has flair. <br> <br>What makes for elegance? Narrowness seems to be the strongest factor, but also conservatism, rigidity and smoothness. Like Times is a very elegant face, actually (which is why it's really a display face and not a text face - at least in digital). <br> <br>hhp <br></p>
