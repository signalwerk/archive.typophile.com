  html: |-
    <p>Hi folks!</p>
    <p>I was just wondering how you guys arrange all your fonts on your system?<br>
    My setup is Font Explorer on Mac and I've divided things into Foundries, Workhorses (most used) and Clients.</p>
    <p>Perhaps you're going all in with Serif, Sans, Handwritten etc. etc. ?</p>
    <p>Thanks and take care :-)</p>
    <p>/s</p>
