      <p>Khaled: ‘<em>With the risk of this turning into this does and that does</em>’<br>
      &nbsp;<br>
      Basically that is the point of discussion now, but before I further elaborate on the differences in functionality between FF and OTM, let me underline here that I consider FF to be a very powerful and highly useful program for professional font production. The by designers often discussed X Windows interface of FF is probably not the most sophisticated one, but with scripting much can be done in FF without having to look at the interface anyway. And with some tweaking the FF auto-hinter is one of the best I have seen so far. So, although I prefer (not surprisingly) DTL FontMaster, FontForge is a serious competitor in my opinion.<br>
      &nbsp;<br>
      That being said, although there is obviously an overlap in functionality, there is a big difference between FF and OTM when it comes to editing OpenType fonts and OT layout features. Prior to editing, the FF user has to convert a font to FF’s proprietary format and after editing the font has to be newly generated again. The outcome (besides the changes) will never be identical to the original font, unless this was generated with the same version of FF too, I reckon.<br>
      &nbsp;<br><img src="/sites/default/files/old-images/OTM_FV_TTF_3839.jpg"><br>
      With OTM the font is not converted and one can edit the character set, glyphs and tables directly, i.e. the font itself becomes the ‘database’. OTM runs natively under Mac OS and Windows and the latter makes side by side editing with for instance MS’s Font Validator easy (see the illustration above).<br>
      &nbsp;<br>
      With the upcoming <em>KernMaster 2012</em> we will focus even more on the font-as-database approach; KM 2012 can space and kern OT fonts and merges the outcomes with the original font data. Output options include a features ﬁle, of course.<br>
      &nbsp;<br>
      FEB</p>
