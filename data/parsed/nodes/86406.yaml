    html: <p>From the screenshots of Arno above, those are kerning classes not contextual kerning. Kerning by classes can be very compact (and may be more efficient) when you have lots of similar glyphs that kern identically; 10 A-like glyphs and 10 V-like glyphs, that is 10×10 kerning pairs to edit, but only one pair of kerning classes. I find FontForge's UI for kerning classes very informative and makes editing and reviewing kerning classes as simple as it goes.</p>
