      <p>If you have FL504, just save the kern feature by  saving the Opentype Feature file (click the little folder icon at the top left of the OT panel and select "save features").  You can open the feature file (.fea) in a text editor.  The kern feature is usually first.</p>
      <p>Each opentype file has a Language  and script declaration.  That is what you have shown above in your first post.</p>
