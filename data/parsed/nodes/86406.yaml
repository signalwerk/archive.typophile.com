    <p>Greeings All,</p>
    <p>Trying to understand the OT kern feature as well as trying to pick up some glyphs from a client's existing OTF.</p>
    <p>Opening a few existing OTFs in FontLab (5.0.4) things seem to make sense, they use the pos command with pairs of characters. The clients font, however, has only this in the kern feature:</p>
    <p><code>feature kern { # Kerning<br>
     # Latin<br>
    lookup kern1 {<br>
    } kern1;<br>
     language FRA ; # French<br>
     language ITA ; # Italian<br>
     language AZE ; # Azeri<br>
     language TRK ; # Turkish<br>
     language MOL ; # Moldavian<br>
     language ROM ; # Romanian<br>
     language CRT ; # Crimean Tatar<br>
     language DEU ; # German<br>
     script DFLT; # Default<br>
    lookup kern1;<br>
     script grek; # Greek<br>
    lookup kern1;<br>
     script cyrl; # Cyrillic<br>
    lookup kern1;<br>
     language SRB ; # Serbian<br>
    } kern;</code></p>
    <p>I can recreate any necessary kerning for the few glyphs I need to pick up, but I'd like to understand things better.</p>
    <p>I can see there is kerning in the font by setting in InDesign and changing from "Metrics" to 0 so I'm thinking that FontLab may just be reading the OTF incorrectly?</p>
    <p>I've tried using Kerning assistance to expand and/or compress both of which mark all the glyphs as if they've been changed, but then upading the kern feature I get only:</p>
    <p><code>feature kern {<br>
    } kern;</code></p>
    <p>Any enlightenment would be most appreciated.</p>
    <p>All Best,<br>
    Ken</p>
