      <p>Khaled: <cite>Indeed FontForge deassembles and then reassembles the font, so it is not really suitable for some tasks where this is undesirable</cite></p>
      <p>Even then, FontForge can be useful. Last summer, I made a font with AAT tables for the Macintosh. I found no way to get with fontforge a ttf output that would work correctly on OS X 10.5, so I used the fontforge python module to generate the appropriate mif file (6770 lines) and then used ftxenhancer. All the precomposed glyphs had been generated with a fontforge script. However,  after seeing some outputs on the screen, I realized that some diacritics in the precomposed glyphs needed to be moved. Modifying the font  with fontforge and generating anew did not work and ftxenhancer was much too slow for my taste. So, here is what I did: I opened the working AAT font with FontForge, reencoded in the glyph order, modified the glyphs to my taste, generated a new ttf font and then extracted from it the glyf table using ttx and merged the resulting .ttx file into the original AAT font. That worked nicely, and fast. So, with fontforge and ttx, you can do things with fonts that fontforge does not understand completely.</p>
