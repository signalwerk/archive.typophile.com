    html: |-
      <p>I just had a closer look at Arno's GPOS kern table. Using the AFDKO command</p>
      <p>spot -t GPOS=6 ArnoPro-Regular.otf &gt; ArnoPro-Regular.afm</p>
      <p>you can get a huge file in afm format containing all kerning pairs for all the scripts (it takes a few minutes). The first lines are</p>
      <p>Comment Begin Script DFLT Language dflt<br>
      StartKernPairs 997900<br>
      KPX A A 29<br>
      KPX A A.a 34<br>
      KPX A AE 29</p>
      <p>There are thus 997900 pairs which, after converting to GPOS pair kerning, overflows by a few hundred times the maximum allowed. </p>
      <p>In particular, in subtable 2, the left class number 34 contains 330 characters and the right class number 26 contains 254 characters; by specifying that the kern of each left character in class number 34 with each right character in class number 26 is -4 (which gives just one pair with class kerning), 330 × 254 = 83820 pairs are required in the afm file: that single pair would already cause an overflow with pair kerning.</p>
      <p>Michel</p>
