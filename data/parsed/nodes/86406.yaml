      <p>Michel: ‘<em>One can do the same with FontForge. Just right click in the GPOS pannel and save.</em>’<br><img src="/sites/default/files/old-images/Features_1_4669.jpg"><br>
      In OTM one can do this by selecting the <em>Export…</em> option from the <em>File</em> menu, but actually the emphasis in my line was on the second part: ‘<em>[…] and (after editing) compile the features again […]</em>’<br>
      &nbsp;<br><img src="/sites/default/files/old-images/Features_2_6424.jpg"><br>
      OTM cleverly compiles features without the necessity that the imported layout features are covered by the character set. It will ‘simply’ generate a subset of the applicable features (and shows this in a listing). At DTL we use a sort of ‘all covering’ <a href="http://www.fonttools.org/downloads/OTMA/features_2.1_New_OTM.fea"> features ﬁle</a>, which I update and enhance from time to time.<br>
      &nbsp;<br><img src="/sites/default/files/old-images/Features_3_4395.jpg"><br>
      By the way, exported features <em>may</em> be edited, but also can be compiled again without doing that, generating things as they were.<br>
      &nbsp;<br>
      FEB</p>
