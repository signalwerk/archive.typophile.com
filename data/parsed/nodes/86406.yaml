      <p>Michel: <cite>Some names are lost but the tables are there.</cite></p>
      <p>lookup names are purely cosmetic, they don't get output in the final font (unless you ask FontForge to output its private table where it can keep such information for later use). When FontForge opens a new font it will generate lookup names based on the feature they are attached to. Feature files have restrictions on table names, so the ones exported by FontForge differ slightly from the ones used originally in the UI.</p>
