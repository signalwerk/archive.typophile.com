               \uni1EAE \uni1EB0 \uni1EB2 \uni1EB4 \uni1EB6] &lt;0 0 29 0&gt;;</code></p>
      <p>Am I correct in my assumptions and what is that first thing?</p>
      <p>Oy, and thnks again for everyone's time.<br>
      Ken</p>
