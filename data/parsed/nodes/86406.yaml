      <p>Khaled: ‘<em>I read "proprietary" here to just mean its own format […] FontForge can read IKARUS (or at least it claims to, I don't have such files to test).</em>’<br>
      &nbsp;<br>
      Yes, that is what I meant. The proprietary format of the IKARUS system has been publicly documented too (as far as I know, for the ﬁrst time in the late 1980’s).<br>
      I did not know that FontForge does support the IK format and so far I have not been able to open IK ﬁles in FF, by the way. I know that FontLab Studio supports the IK format in a limited way. Although it is quite some time ago when I tested this, I was able to open some IK ﬁles in FLS.<br>
      &nbsp;<br>
      James: ‘<em>[…] expecting the feature labeled “'kern' table viewer” in a program […] to show me OpenType kerning.</em>’<br>
      &nbsp;<br>
      As you know, OpenType fonts come in two ﬂavors (CFF and TTF) and there are two ways to include kerning into OpenType fonts, namely as ‘ﬂat’ kerning in the <a href="http://www.microsoft.com/typography/otspec/kern.htm">‘kern’ table</a> (only in TTF) and as ‘advanced’ kerning in the <a href="http://www.microsoft.com/typography/otspec/gpos.htm">‘GPOS’ table</a> (TTF’s can contain both tables). You probably meant the ‘GPOS’ table when you mentioned ‘OpenType kerning’, I reckon.<br>
      &nbsp;<br>
      FEB</p>
