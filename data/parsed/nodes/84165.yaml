  html: |-
    <p>I am working on a project to design two sets of religious books. One set will be meant for travel, and one set would be meant to be used at home. Each set will contain 5 or 6 books, with an eclectic combination of prose, poetry, scripture, and artwork.</p>
    <p>Does anyone have examples they can share of well-designed books of this sort? I have seen some books designed by <a href="/wiki/Bruce%20Rogers" class="freelinking" rel="nofollow">Bruce Rogers</a>, and I love his clean style and generous use of white space.</p>
    <p>More information:</p>
    <ul>The most important feature for both sets is reading comfort.</ul>
    <ul>These books are meant to be read several times each day.</ul>
    <ul>The travel set needs to be very compact and relatively inexpensive.</ul>
    <ul>The home set can be very ornate and expensive.</ul>
    <p><a href="http://www.unostiposduros.com/?p=1004" rel="nofollow"><br>
    <img src="http://www.unostiposduros.com/wp-content/gallery/rogers/genesis.png" width="300"><br>
    </a></p>
    <p>Thanks!<br>
    Neil</p>
