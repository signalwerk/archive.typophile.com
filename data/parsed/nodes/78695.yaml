    <p>This font appears on several sources that have nothing in common, so i am sure that it is an existing font :</p>
    <p>1- In the title on top of a page inside of a French book about the Monty Pythons published in 2010 :<br>
    <img src="http://typophile.com/files/8493bacb3e5d2960b2ce6468129cfe71.701875.jpg"><br>
    The book is <a href="http://www.cherche-midi.com/theme/Le_grand_livre_des_Monty_Python-_MONTY_PYTHON_-9782749116952.html" title="http://www.cherche-midi.com/theme/Le_grand_livre_des_Monty_Python-_MONTY_PYTHON_-9782749116952.html">http://www.cherche-midi.com/theme/Le_grand_livre_des_Monty_Python-_MONTY...</a> but the font doesn't appear on the cover.</p>
    <p>2- On the cover of an album from the Scottish band “The Tannahill Weavers” “The Mermaid’s Song” released in 1992 :<br>
    <img src="http://typophile.com/files/10_ms.jpg"><br>
    <a href="http://www.theballadeers.com/scots/tw_d20_ms.htm" title="http://www.theballadeers.com/scots/tw_d20_ms.htm">http://www.theballadeers.com/scots/tw_d20_ms.htm</a><br>
    So the font is not a brand new creation.<br>
    Somebody posted on the wtf forum a cleaner sample of some letters from the title of this album but he deleted the arrows because he believed that they were a customisation of the font whereas they are certainly part of the font :<br>
    <img src="http://typophile.com/files/5ddffc343d25e8905253dcba8d2a8d2a.631993-RVB.jpeg"></p>
    <p>3- Someone posted a picture using the same font (without specifying its source) on the wtf forum but you must ignore the "A" that is obviously from another font and the "S" that is different from the scottish CD and was probably manually created by using the top of a “R” (the person that created this Argonauts title probably ignored the font and didn't have all the letters required) :<br>
    <img src="http://typophile.com/files/88cb7e3ba55e16a41b972c5008be6ba2.16241.png"></p>
    <p>I first saw this font on the Monty Python book when I was shopping for Christmas and later I saw it again at the myfonts wtf forum but without identification :<br>
    <a href="http://new.myfonts.com/WhatTheFont/forum/case/338858/" title="http://new.myfonts.com/WhatTheFont/forum/case/338858/">http://new.myfonts.com/WhatTheFont/forum/case/338858/</a><br>
    <a href="http://new.myfonts.com/WhatTheFont/forum/case/81977/" title="http://new.myfonts.com/WhatTheFont/forum/case/81977/">http://new.myfonts.com/WhatTheFont/forum/case/81977/</a><br>
    <a href="http://new.myfonts.com/WhatTheFont/forum/case/352072/" title="http://new.myfonts.com/WhatTheFont/forum/case/352072/">http://new.myfonts.com/WhatTheFont/forum/case/352072/</a></p>
    <table id="attachments" class="sticky-enabled">
     <thead><tr><th>Attachment</th><th>Size</th> </tr></thead>
    <tbody>
     <tr class="odd"><td><a href="http://typophile.com/files/8493bacb3e5d2960b2ce6468129cfe71.701875.jpg">8493bacb3e5d2960b2ce6468129cfe71.701875.jpg</a></td><td>44.75 KB</td> </tr>
