  html: |-
    <p>This is a new letter form our group designed for an assignment in Typography I. This letter form is shown in both upper and lower case and presented in Baskerville Old Face. </p>
    <p>This letter form is a substitute for the "-ing" sound as found in, "shoppING" or<br>
    "goING".</p>
    <p>Enjoy.</p>
