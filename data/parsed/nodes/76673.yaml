  html: <p>Working on an identity project and the logo uses <a class="freelinking external" href="http://www.insignedesign.com/Typeface.aspx?FamilyName=Aviano%20Sans" rel="nofollow">Aviano</a>. I'm looking for a sans or serif font I that will pair nicely with it for some high end food product labels. I was thinking of using Gotham but it's somewhat overused but it seems to work well with the wide characters of Aviano.</p>
  html_clean: <p>Working on an identity project and the logo uses <a class="freelinking external link-external" href="http://www.insignedesign.com/Typeface.aspx?FamilyName=Aviano%20Sans" rel="nofollow">Aviano</a>. I'm looking for a sans or serif font I that will pair nicely with it for some high end food product labels. I was thinking of using Gotham but it's somewhat overused but it seems to work well with the wide characters of Aviano.</p>
