      <p>Dan — I think you’re probably right. They are all very close in chronology. I always have to look it all up to sort them properly.</p>
      <p>But I think of Kis as a development out of the Dutch tradition, because he was trained in Amsterdam (Voskens, if memory serves) but then went on to evolve independently, and his later work seems to share more in common with Fournier (in my eyes), making his types more of a stylistic bridge to neoclassical and modern (again: my personal take on it, not any historical truism).</p>
      <p>Caslon is said to have been imitating Dutch models. If not Fleischmann, then precursors to Fleischmann. Maybe more Voskens or Van Dyck. Again, I think of Caslon as a development coming out of the Dutch style — influenced by, but then evolving into its own. </p>
      <p>But I often create my own history. ;-)</p>
