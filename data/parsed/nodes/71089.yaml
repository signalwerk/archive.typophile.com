      <p>Yes, I think "Barock=Antiqua" from <a class="freelinking external" href="http://de.wikipedia.org/wiki/DIN_16518" rel="nofollow">DIN 16518</a> maps onto "Réales" from <a class="freelinking external" href="http://fr.wikipedia.org/wiki/Classification_Vox-Atypi" rel="nofollow">Vox/ATypI</a>, which is the category that is most often rendered as "Transitional" in English. </p>
      <p>The term "Transitional" may be what's complicating matters here. I'm actually currently writing a piece exactly on that subject.</p>
      <p>On another note, my understanding is that "oldstyle" would usually encompass baroque types rather than be distinct from them, at least as the term was used originally to separate "modern" (didone) styles (and sometimes "transitional" styles meaning fonts like Baskerville's) from previous romans. But I guess you take it to mean Venetian/French pre-baroque styles only?</p>
