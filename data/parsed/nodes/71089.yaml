      <p>Interesting to see those flat double hyphens. Hmm.<br>
      For some reason it looks like («normal» whiteletter) fonts that support U+2E17 tend to have it at an angle (see <a href="http://www.fileformat.info/info/unicode/char/2E17/fontsupport.htm" rel="nofollow">here</a>), except when they have strange wiggly designs (I wonder where that came from).<br>
      Looking at Dan's examples, I can't help but feel the angle on the doubled one is really really nice, also when the single is flat. Maybe also because it's closer to the blackletter form, where this character is so much more common; and because it's less similar to an equal sign, so less like anything else.<br>
      Craig, I wonder, is it the angle you don't like – or is mine just a bit to, dunno, stiff or something? (I realize now it's probably a bit high.)</p>
