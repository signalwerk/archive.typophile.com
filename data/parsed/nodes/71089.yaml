      <p>FWIW, I don’t consider Fleischmann or Rosart to be Transitional. They are Dutch Oldstyle, in my view. The sort of thing that leads to Caslon and Kis. I might be inclined to call this period Dutch Baroque, because of mixed stress and idiosyncratic terminals (and because I am musically minded).</p>
      <p>I would say that, with Newzald, Kris has introduced a little Neoclassical quality to his interpretation of the underlying style, with more regularized upright stress and greater sense of symmetry and balance. In that sense, Newzald is more Transitional, perhaps, than its inspirations.</p>
      <p>But we probably don’t need to go down the classification rabbit hole here.</p>
