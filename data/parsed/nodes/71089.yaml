      <p>I am not really up on this level of scholarship, I must admit. But I have been told that, in academic texts, old texts being discussed are now transcribed, not translated or converted. So in the case of medieval Latin or older German (in Fraktur, to boot…), at text will be transcribed exactly from the image into the same typeface as the article (or whatever typeface the author/editor/typesetter/etc) have chosen for transcription. This means that the font(s) for the article/book/etc must have every glyph that needs to be transcribed. I guess that (certain?) scholars view the double-hyphen as being unique. Certainly Latin abbreviations are not written out when you transcribe.</p>
      <p>I hope to have images of the project I'm talking about by the end of the month. I'm sort of interested to see how it all worked.</p>
