    html: |-
      <p>I think this is an interesting question. Also because these old texts would include both character and grammar that is different from the current one. The long s for instance is not being used anymore except for the ligature ß. Would you keep the long s or use the modern version. Is Historical/period accuracy the most important or the current relevance of the text (using the text but updating the grammar and the form). My opinion is that it is nice to take into account the fact that a text is historical, but one shouldn't take it too far. In my view the content is the most important thing, and the form can help to make the content more understandable/readable. Using old text from the same language is a bit the same as using foreign language texts: it needs translation to be understandable for most readers.</p>
      <p>As for the short answer: I would use a single hyphen, as it does not structurally alter the content of the text, and minimizes the confusion a double hyphen might cause.</p>
