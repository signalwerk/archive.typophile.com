    html: |-
      <p>Does <a class="freelinking external" href="http://www.linotype.com/90672/avenirnext-family.html" rel="nofollow">Avenir Next</a> somehow skimp on weights? Gotham has a couple more, but mostly additional light weights. </p>
      <p>Gill almost never worked in any kind of mechanistic idiom. Gotham overtly features mechanistic, industrial features. H+F-J acknowledge the "Mathematical reasoning of the draftsman" in their exclusively American models, rather than the sensibility of a calligrapher and stonecarver (which Gill was first and foremost). Gill's lettering has always held a very specifically British style, a tradition he learned from stonecarvers and calligraphers in the UK. His background and output were very regional, and continue to be very recognizable. Not sure how you can make a very clear connection between Gill and Gotham. I think you may have stumbled on the only commonality: The M. </p>
      <p>One thing to point out about Avenir: Adrian Frutiger has a very recognizable tendency to draw a wide, flat-footed, cap A with a low crossbar. In all his sans and most of his serif designs this wide shape appears. Along with his also typical wide a, it can push Avenir stylistically away from the highly proportional style of Futura (its predecessor) towards more of the wide, square style of Gotham (and Proxima, and Slate, somewhat).</p>
