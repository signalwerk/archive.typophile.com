    date: 2008-02-26T12:16:00
    votes: null
    html: |-
      <p>I see Futura, Avenir and Gotham as being something of a continuum of geometric sans design. The middle of that continuum (Avenir) is the sweet spot for being unobtrusive and the best of the three for text. Futura is more geometric and sterile-feeling, while Gotham is more humanistic but also more quirky.</p>
      <p>In the same vein, Futura has lengthy ascenders/descenders while Gotham has really short ones.</p>
      <p>Cheers,</p>
      <p>T</p>
