    date: 2008-02-22T05:16:00
    votes: null
    html: |-
      <p>On the caps your samples are significantly different. Gotham follows the 19th century pattern of relatively equal widths to the caps, whereas Avenir follows more the classical roman model, following being more influenced by Futura, which it is a an variation of. The lower cases of the two are more similar--and both are similar to Futura, though with shorter extenders in the case of Avenir, and much shorter in the case of Gotham. One of the points of Avenir vs Futura was to have the two story a, which Gotham also has. </p>
      <p>I suspect that if  you look at the lower cases of all 'geometric' sans, the differences are going to be even more subtle than is usually the case between typefaces.</p>
