      <p>Well, after a few days of chatting and arguing, it seems that the answer is not as clear as it sounds and the opinions are different. I wish I could have a word about this with Tobias Frere-Jones and Adrian Frutiger, maybe they would have the final word about this discussion.</p>
      <p>As of myself, I think H&amp;FJ arrived to a fairly similar typeface using quite different ways, especially with the capitals, but I wouldn't think the same way about the lower case letters, they really share way too many characteristics. Anyway, both typefaces are brilliant and have enough singular characteristics not to be called "rip-offs" or something. I like them both, i'd use them both. And I will write two separate articles about them in my upcoming book.</p>
      <p>thanks to all the contributors (I mean, those who had something else to say than "no").</p>
      <p>dr</p>
  - id: 261810
