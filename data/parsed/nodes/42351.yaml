    html: <p>I see Gotham as responding to the fashion now for Gill-derived letterforms, especially the cap M whose center stops short of the baseline. Both families are very stylish and legible; the only problem with Avenir is its perverse refusal to go all the way on weights, whereas Gotham does cover the weight range properly. But if I had to choose just one to buy, it would be Avenir, the single most stylish and legible sans serif on the market.</p>
