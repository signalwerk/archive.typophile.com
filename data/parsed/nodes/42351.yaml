      <p>I don't think H&amp;FJ should be singled out and criticized for what is a widespread practice, certainly not if they're following in Adrian Frutiger's footsteps! </p>
      <p>A "subtle distinction": Gotham's lower case, mining a well-worked vein from the 1920s (consider it public domain), is nowhere near an issue for a sleazy industry where blatant design plagiarism is widely condoned--and has been for centuries with little ethical progress-- where the producer of a revival is called its designer, and where only the novice appropriator gets called to task--more for callow ineptitude than bad intent. If you're a big corporation or have something of a reputation, then your professional nuancing of other people's work, or stuff you developed that ended up looking a bit like someone else's work, won't raise much of an eyebrow. </p>
      <p>The sameness is fostered by what the market asks for, which is retro, retro, and more of the same.<br>
      And typophiles who harp about how glyphs that "draw attention to themselves" will compromise readability.<br>
      And typophiles who like nothing better than to discuss good old Garamond and Helvetica, rather than anything, God forbid, designed in recent memory. (This thread an exception.) </p>
      <p>**</p>
      <p>Clients often give me the opportunity to be unethical.<br>
      That's not the same as asking me to do unethical things, of course.</p>
      <p>Presently I'm working on a commission for an agency that wants a unicase version of a well-known typeface for its client. The art director hasn't commissioned this kind of work before, and more power to him, but he needs advice on the legal technicalities, which is what I'm here for, among other things. So I said he could check out the EULA, contact the foundry, and see if they could do the job, and that I could do it too -- except that I would adapt one of my fonts to be "similar to", because point piracy and a verbatim copy is illegal. But there wouldn't be a problem, as it's a pretty generic typeface anyway.</p>
      <p>Of course, I would have preferred if the agency had contacted me upfront before they pitched their client, and said "Nick, we need a unicase a bit like so-and-so", which would have given me more design space, but that would have invested too much in what was, no doubt, one of several different creative approaches they were presenting. </p>
      <p>**</p>
      <p>Even those foundries and publishers which produce a lot of new designs also publish some work that is straight-up derivative.</p>
      <p>As well as criticize conservatism and plagiarism, it's good to big up the interesting new work -- so props to Stephen Coles and his ongoing "top new fonts" projects at FontShop.com and Typographica.</p>
