      <p>Hi PedoneRosso,</p>
      <p>It sounds to me that what you're looking for could be "Avant Garde" (<a href="http://www.myfonts.com/fonts/itc/avant-garde-gothic/" title="http://www.myfonts.com/fonts/itc/avant-garde-gothic/">http://www.myfonts.com/fonts/itc/avant-garde-gothic/</a>).</p>
      <p>If necessary, use the "sample text" to look at the regular "M", "T", and "a", not the stylistic alternates. (Avant Garde has a lot of those, with a slanted "M" alternative, for instance.)</p>
      <p>In the realm of the non-typographically obsessed, Futura and Avant Garde get confused a lot.</p>
