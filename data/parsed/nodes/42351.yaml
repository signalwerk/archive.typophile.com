      <p>David, <a class="freelinking external" href="http://www.linotype.com/90672/avenirnext-family.html#" rel="nofollow">this summary from the paragraph</a> on Avenir Next is pretty revealing. Evidently Frutiger's 'brief' was to "humanize" Futura, which involved introducing a bit of contrast between horizontal and vertical, as well has the "a". </p>
      <p>&gt;Art Deco-ish inscriptions of those buildings were direct derivations of Futura</p>
      <p>Bert, this is not correct. Visually the NYC stuff that was the basis for Gotham is more 19th century (not Art Deco), having the equal width caps. IIRC, think there is little, if any of the early stuff on buildings with a lower case. Paul Shaw, in a tour of NYC lettering I went on, organized by the TDC, explained that there were architect's books with models for lettering on buildings, which were done by sign painters and stone carvers. That's why the similarity of lettering which became the basis of Gotham. But a lot of it pre-dates Futura. </p>
      <p>Also Futura really has the wide (square) and narrow (half square) proportions of Trajan caps, so that can't be the model for Gotham caps. </p>
      <p>Now looking again at the samples here, you can see that Gotham lower case follows the model more of Futura, as the vertical stems are thicker in comparison. The greater modulation may be why Patty sees Avenir working better in text, but Gotham as having more punch.  </p>
      <p>Edit. <a class="freelinking external" href="http://typography.com/fonts/font_history.php?historyItemID=1&amp;productLineID=100008" rel="nofollow">Here</a> in the essay on the origins of Gotham, Frere-Jones says that there was traditionally no lower case. He says that his models only go back to the 30s. But in any case the even width style of Caps is 19th century, not Futura.</p>
