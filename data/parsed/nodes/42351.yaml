      <p>Gotham in blue, Avenir in pink.</p>
      <p>Of course, I NEVER meant to say that these types are 'the same' or to imply fraud etc. I love Gotham, I really do, and I understand they are two different typefaces. Though, they share a lot in the design, and considering their two very different influences (frutiger claimed being influenced only by Futura, and Frere-Jones claimed being influenced only by the vernacular inscriptions of New York buildings), it is a subject of curiosity for me, on which I wish to have your point of view - I hope that for some of you, it will be a little bit longer than a two letters word.</p>
      <p>thanks,<br>
      dr</p>
  - id: 260749
