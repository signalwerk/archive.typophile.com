      <p>Cerulean,<br>
      im not saying that at all. A designer can take ANY face and do whatever he/she intends to do with it, even if it defeats the original intention of the type-designer, as long as it works. But if you have a clearly defined purpose for the face, then all these things affects the actual design of it...In other words the intention affects the type design.</p>
      <p>Sort of like how a graphic designer starts an identity without considering the audience, environment, history etc. I hope I'm making sense here.</p>
