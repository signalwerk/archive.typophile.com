    html: <p>Whats the intention of this typeface? What is it categorized under? How many weights? Lots of questions to answer before starting a typeface. A lot of people design faces for the purpose of having it in their "portfolio" and thats no way to start a typedesign project.</p>
  - id: 113200
    user_id: 8675
    user_name: Pierre-Luc Auclair
    user_path: null
    user_image: null
    date_raw: 17 Mar 2006 — 8:51pm
    date: 2006-03-17T20:51:00
    votes: null
    html: |-
      <p>Well, since it's my first one I didn't really have a purpose for it in the first place other that I wanted to have something readable, mainly for setting medium lenght texts. I know I should have something clearer, a "real" purpose but I just don't think I have something that can be qualified as such.</p>
      <p>I think where I'd like to lead it is something fresh, lively, that could be effectively used in a real text at about 11 or 12 with space to breath. I'd like some nice "funky" lines while staying subtle, clean.</p>
      <p>What it is categorized under, I couldn't say.</p>
      <p>Wheights, well, I'd like something clear, light-weight. What I have for now I would describe as the normal "roman" weight. I'll start with this weight for now, but eventually would like to develop a bold version and a true italic of the roman if it turns into something acceptable.</p>
      <p>That's not for portfolio (well not for now), but exploration solely.</p>
