    <p>Hey,</p>
    <p>I'm trying to do a typeface, first one actually. I usually do graphic design so I'm not pretending to be good at designing typefaces, but for some reason I got stuck with the idea of a "g" and really had to draw it on some piece of paper, I kind of liked it so I digitized it and then it grew up to this in the last few days. I actually kind of like it, so I thought I'd show what I have for now. It's not even a complete first draft of the lowercase, and I'm unsure about a few parts but so far I like it. I tried a bunch of words and I also think it reads well, pretty much what I intended in the first place. </p>
    <p>So, what do you think about it?</p>
