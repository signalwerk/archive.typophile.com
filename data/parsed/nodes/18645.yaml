      <p>Doesn't a typeface sort of communicate its own intent? People will use it for whatever they feel it is appropriate for. I see a quaint casual organic face. Do you expect him to say, "I was aiming for a stark, sterile geometric font suitable for headlines in a business newspaper," so you can say "Whoa, you got that <em>all</em> wrong!" and what would that accomplish?</p>
      <p>Anyway, my critique: I think the i/j dot should be much higher, and a different shape. Round, or a small vertical line, or possibly even a ring.</p>
