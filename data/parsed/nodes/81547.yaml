      <p>Or you can add manually the appropriate page number, as in  <a href="http://www.typophile.com/node/81129?page=1#comment-461794" title="http://www.typophile.com/node/81129?page=1#comment-461794">http://www.typophile.com/node/81129?page=1#comment-461794</a> ; notice that it is "page=1" and it is page 2 (it is always one less). The timestamp should indeed contain the page number (I added a blank before the semicolon for the link to work).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/oneless_6051.jpg"></div><p></p>
