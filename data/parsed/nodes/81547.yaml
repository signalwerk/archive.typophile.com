  html: |-
    <p>Not too long ago Typophile added the useful ability to link to specific comments within threads. Clicking on the timestamp of any comment will produce the link.</p>
    <p>I have noticed that this doesn't seem to work when the comment to be linked appears on a page beyond the first in a multi-page thread. The link doesn't insert the required "page=n&amp;" into the address, so following the link just goes to the top of the first page of the thread.</p>
comments:
