      <p><cite>Is that a user-adjustable setting?</cite><br>
      No, at the moment not. But it has been adjusted globally in the past</p>
      <p>Also, there is the (unlikely) possibility that you want to link to comment no. n+1 (n = maximum number of comments per page), and later on, an older comment gets deleted, making the one in question the n-th.</p>
