    date: 2011-04-25T13:29:00
    votes: null
    html: <p>I just counted (in fact, I wrote a script to count) the number of comments for each page of <a href="http://www.typophile.com/node/123" title="http://www.typophile.com/node/123">http://www.typophile.com/node/123</a> and I get 90 comments per page for page 1 to 7, and then less than 90 comments on page 8. What does the number 5000 then represent in <code>comments_per_page=5000</code> ?</p>
  - id: 461820
    user_id: 16911
    user_name: Florian Hardwig
    user_path: null
    user_image: /files/pictures/picture-16911.gif
    date_raw: 25 Apr 2011 — 1:35pm
    date: 2011-04-25T13:35:00
    votes: null
    html: <p>This number overrides the default maximum number of comments per page (yes, 90 – <em>at the moment</em>) . You can also enter a different value. But with a value as large as 5000, you practically request a thread with all its comments, as a single page.</p>
