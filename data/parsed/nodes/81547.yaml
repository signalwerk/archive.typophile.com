    html: |-
      <p>And I think the clean solution is a link like this:</p>
      <p><a href="http://www.typophile.com/node/123?page=5&amp;from=0&amp;comments_per_page=90#comment-348557" title="http://www.typophile.com/node/123?page=5&amp;from=0&amp;comments_per_page=90#comment-348557">http://www.typophile.com/node/123?page=5&amp;from=0&amp;comments_per_page=90#com...</a></p>
      <p>that specifies the page number but also the current number of comments per page, namely 90. You are then linked to the right page (and not to a single page thread) and even if the number of comments per page ever changes, the link will still be valid.</p>
