    <p>Hi,</p>
    <p>I've tried but had no luck finding any references for what I'm trying to do: combining contextual gsub with gpos.</p>
    <p>I know that the following code example doesn't work but it should illustrate what I'm aiming for.</p>
    <p>feature calt {<br>
       # if a is followed by by b, shift a 100u y direction<br>
       sub a' b by pos a &lt;0 100 0 0&gt;;<br>
    } calt;</p>
    <p>Does anyone have a hint if/how this can be done.</p>
    <p>Thanks,<br>
    Martin</p>
