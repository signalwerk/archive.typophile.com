    html: |-
      <p>Yes, like in VOLT you can add a separate lookup to the kern feature, but need to compile with either the new AFDKO (not from within FLS5) or OTMaster.</p>
      <p>&nbsp;&nbsp;&nbsp;feature kern {</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;lookup kern_jumpingGlyphs {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;pos a' &lt;0 100 0 0&gt; b;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;} kern_jumpingGlyphs;</p>
      <p>&nbsp;&nbsp;&nbsp;} kern;</p>
      <p>The marked glyph is the input glyph to be repositioned, and the value record needs to follow immediately.</p>
      <p>But you need to be careful: Substitution can be executed only once on an input glyph (after substitution it does not exist any more in the glyph string). But if you reposition the same glyph again in other lookups, all of these adjustments will add up.</p>
      <p>Karsten</p>
