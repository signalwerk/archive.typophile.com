    html: <p>For the most part, your character weights seem relatively consistant. However, some of them aren't. The 't' and 'i' for instance. They seem too light. The bowl (loop) of the 'g' seems too small and too light. If the consistancy were more irregular, almost as if you were righting on a cheap 24# text weight with a ballpoint that is running out of ink. Or fix those characters that seem out of place. I agree with Jared's comments as well. Oh, the 'b' seems too light also, and the cross-stroke on the 't'. <br> <br><i>Hi John!</i></p>
