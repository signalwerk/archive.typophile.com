    html: "<p>It definitely feels quirky, and the jumpy rhythm makes for an interesting face. Its irregularities make it appear handwritten - it's not immediately apparent this is a font, which is a good quality.  <br> <br>After scanning it a few times, three letters  jump out at me: \"a\" ,\"R\". and \"g\". The \"a\" feels too tall, the \"R\" feels out of case, and the bowl of the \"g\" is much too small. See \"wavelength\" <br> <br> </p>"
