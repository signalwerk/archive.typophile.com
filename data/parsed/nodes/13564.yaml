    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12011" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Education</a>&nbsp;: Cooper&nbsp;Union</strong></p>
    <p>The Cooper Union for the Advancement of Science and Art<br><a href="http://www.cooper.edu/">http://www.cooper.edu/</a></p>
    <p>A university-level accredited school for Art and Architecture in New York City. Considered one of the best art schools in the world, all Cooper Unions students pay no tuition; they are all on full scholarship! (the scholarship does not normally include room or&nbsp;board)</p>
    <p>The Cooper Union <a href="/node/add/wiki?edit%5Btitle%5D=Herb%20Lubalin%20Study%20Center%20for%20Design%20and%20Typography" title="Create node &quot;Herb Lubalin Study Center for Design and Typography&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Herb Lubalin Study Center for Design and Typography</a><br><a href="http://www.cooper.edu/art/lubalin/">http://www.cooper.edu/art/lubalin/</a></p>
    <p>An excellent resource for type history at the Cooper&nbsp;Union.</p>
    <p><a href="/node/29251" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">James Craig</a> is a professor for typography at the Cooper&nbsp;Union.</p>
