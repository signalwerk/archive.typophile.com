    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Education" class="freelinking" rel="nofollow">Education</a> : Cooper Union</strong></p>
    <p>The Cooper Union for the Advancement of Science and Art<br>
    <a href="http://www.cooper.edu/" rel="nofollow">http://www.cooper.edu/</a></p>
    <p>A university-level accredited school for Art and Architecture in New York City. Considered one of the best art schools in the world, all Cooper Unions students pay no tuition; they are all on full scholarship! (the scholarship does not normally include room or board)</p>
    <p>The Cooper Union <a href="/wiki/Herb%20Lubalin%20Study%20Center%20for%20Design%20and%20Typography" class="freelinking" rel="nofollow">Herb Lubalin Study Center for Design and Typography</a><br>
    <a href="http://www.cooper.edu/art/lubalin/" rel="nofollow">http://www.cooper.edu/art/lubalin/</a></p>
    <p>An excellent resource for type history at the Cooper Union.</p>
    <p><a href="/wiki/James%20Craig" class="freelinking" rel="nofollow">James Craig</a> is a professor for typography at the Cooper Union.</p>
