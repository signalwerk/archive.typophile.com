      <p>Perhaps the eye (since it acts like a camera) can absorb the light data or image but I would think "perceive" makes more sense since the eye does not interpret meaning, the brain does that.  I don't buy the "move along a line" thing.  It implies some smooth linear path.  Since we know there are saccades as well as regressions and have theories on what may happens there, I don't see how "move along a line" helps a definition--it may harm it though.</p>
      <p>Readability may describe the relative ease a reader has in pursuing the task of reading a given text sample, I don't know if we should include comprehensibility in this though since I am not sure comprehension and all the myriad of variables that surround it, should be included in the definition.  If we are using the term "readability" as a trait regarding the form of typography, comprehension might make it more confusing since there are so many factors surrounding comprehension which have nothing to do with typographic presentation.</p>
