    html: <p>Ralf, I'm still having trouble understanding what you are trying to achieve. You've made some very nice graphics, but why is it an onion model of legibility instead of e.g. a sandwich model or a cake model? That is, I don't see the grounds on which you've built the model you have made instead of a different model. I can produce a theoretical model of legibility that is quite different from yours, and yet be no more convinced that my model is correct than I am that yours is. You say that now, having made your model, it is possible ‘to easily talk about different aspects of reading and legibilty’, but if the model is wrong then all you've done is made it easy to talk <em>erroneously</em> about legibility and reading. I'm not saying that I think the model is wrong, I am saying that I don't see the grounds for building this particular model, I don't see the foundation, and I hope you won't be offended if I say it looks like you are begging the question at every stage of your process.</p>
