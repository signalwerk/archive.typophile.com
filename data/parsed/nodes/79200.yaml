      <p>Kevin, thanks for the references. I will have a look, though I'm not sure how quickly I can get to it.  </p>
      <p>I don't get why you restate that Kohonan networks are another model of parallel distributed processing. My point is that it may be what is normally going on in reading, and not interactive activation. And with such processing it may be that collections of letter parts in a word are processed together in such a network, without routine resolution into separate letters, as Peter has argued. My point was that interactive activation is routinely accepted without testing against rival models of parallel processing. I accept that parallel processing is going on, because whole words can be recognized, as I understand, in roughly the same time as individual letters. The question is what kind of parallel processing.</p>
