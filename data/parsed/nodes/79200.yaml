    html: <p>A good attempt, Craig, but I am not convinced. Distinguishability and recognisability seem to me so closely linked in reading that I can't see grounds to separate them at the reading model level. Yes, they can be conceptually differentiated, as you demonstrate, but distinguishability is relative recognisability, and since, outside of glyph legibility testing, we are always seeking to recognise signs in context of other signs, relative recognisability is the normal circumstance of legibility. In your illustration, the numeral eight provides the context that enables you to differentiate distinguishability from recognisability in the two sixes. But what if you add an old Welsh letter V (U+1EFC) in the style of Ambicase Modern to the illustration? Suddenly both sixes have comparable distinguishability problems.</p>
