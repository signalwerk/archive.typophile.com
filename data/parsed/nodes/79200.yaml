      <p>Hrant, "readability" is ambiguous as it can refer both to a quality of the writing and a quality of the set type on screen or paper. But I think that is usually clear from context—whether you are discussing type and layout on one hand, or rhetoric, on the other.</p>
      <p>I don't think it should be presumed that time and comfort are equivalent. I don't think they are. I think you can push yourself to read something quickly, even when it is more taxing. The comfort shows itself over time as fatigue sets in and comprehension will go down. My proposal has been to use SAT reading tests, over long enough an interval for fatigue and diminished reading comprehension to set in. Then comparing different fonts and settings will differentiate greater and lesser readability, including both comprehension and speed as measures.</p>
