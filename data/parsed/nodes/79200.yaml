      <p>“Readability was coined to recognize [...]”</p>
      <p>Nick, what is your basis for saying this? From conversations with Bill, I'm convinced he has found the source for the introduction of the term readability into typographic discourse. I'm not going to spill the beans, but I'm not sure your claim about why readability was coined is well-founded.</p>
      <p>Kevin, I think the <em>decoding</em> / <em>comprehension</em> schematization has some merit. It might be useful to note that in the Hoover and Gough formula you play off of the R is <em>reading comprehension</em>, the D is <em>decoding</em> and the C is an L, for <em>linguistic comprehension</em>.</p>
      <p>In my own ‘functional ontology’ of reading I use <em>sense-following</em> and <em>rapid automatic visual word-form resolution</em> to describe the two foundational components of reading. Sense following presupposes the capacity for linguistic comprehension, and rapid automatic visual word-form resolution might be considered a dimension of decoding specific to continuous reading of extended texts.</p>
      <p>Hoover and Gough call their scheme The Simple View of Reading, but they don't mean to deny that each of these components and the way they interact is complex.</p>
      <p>Skilled decoding for Hoover and Gough is “efficient word recognition: the ability to rapidly derive a representation from printed input that allows access to the appropriate entry in the mental lexicon, and thus the retrieval of semantic information at the word level.”</p>
      <p>“Deriv[ing] a representation from printed imput” is another way of capturing what my <em>rapid automatic visual word-form resolution</em> specifies. The parallel letter recognition scheme is a theory of what this entails. But even parallel recognition schemes are forced to accept that performance at affordance plateaus or peaks is different than performance at affordance thresholds. A Sheedy study Kevin was involved with demonstrates a letter-superiority effect at thresholds of affordance. Meanwhile it is well-known that at plateaus of affordance a word-superiority effect emerges. And we have reason to believe that what Ralf calls <em>unterscheibarkiet</em> plays differently at these thresholds than at peaks. These differences at thresholds and at plateaus alone could motivate a distinction between legibility and readability.</p>
      <p>Rather than brush everything that relates to decoding under one terminological carpet, typographers and type designers might be better served by exploring the decoding domain in richer ways than til now has been done, and hang their terminological hats on what will emerge from this rather than leaving the terms floating in the air.</p>
