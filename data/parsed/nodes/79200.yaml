      <p><cite>A letter-wise word recognition model … favours this simple conflation of concepts that you are keen to differentiate</cite></p>
      <p>How so?<br>
      As Kevin Larson explained decoding and comprehension are connected, but very different things. I used slightly different terms, but this is exactly my point. </p>
      <p><cite>And when you explicitly call something ‘the onion layer model of legibility’ you are strongly suggesting that there is something meaningful and applicable about this relationship of layers. </cite></p>
      <p>I meant, I am not claiming this is the only way to show the relations of these terms, but I certainly think the way I drew it IS meaningful.<br>
      A legibile typesetting is necessary to be able to decode letters. That's why it is the outermost layer. If the character spacing is way too small or the constrast to the background too weak, there is nothing to decode, no matter which typeface we choose.<br>
      The letters of the typeface need to have a shape that can be decoded (recognisability). A high level of letter differentiation (distinguishability) is important in certain situations, but not a real requirement for decoding (see my example of one-story a vs. two-storey a). Reading comfort is again an additional/optional feature, that requires recognisability and distinguishability of the letter design, but is in turn no requirement to the outer layers … And so on. So the visual relations in this model are all intentional and the terms are not just put somewhere. </p>
      <p><cite>Your headline example involved both legibility and recognisability. So why are you insisting on these two being separate phenomena? </cite></p>
      <p>Mind my differentiation between typographic layout and typeface features. I embedded the recognisability of letters within legibility. So I don't consider them to be different.</p>
