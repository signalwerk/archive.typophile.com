      <p>Ralf, here is a pretty careful definition: "'Legibility' is based on the ease with which one letter can be told from the other. 'Readability' is the ease with which the eye can absorb the message and move along the line."--from Types of Typefaces, by J. Ben Lieberman, 1967.</p>
      <p>These meanings are somewhat established. For example, Tracy uses them the same way in his Letters of Credit. I think the terminology was developed in the '40s, by a scientist hired by Linotype, but I haven't nailed it down yet. </p>
      <p>Basically, I think your "reader friendliness" is just "readability" in English. I'm not sure whether there is a need for a separation between "recognizability" and "distinguishability," as so long as you know it's supposed to be a letter, it amounts to the same thing. The time factor is important, which is covered by Lieberman's "ease" terminology.   </p>
      <p>So I don't see the need introduce a third term beyond the readable/legible distinction. Note that legibility refers to letters and readability to words. It might be useful to distinguish readability in individual words—such as on signage—and readability in extended text. Ultimately, the viability of such distinctions will depend on demonstrating their reality in experiments.</p>
