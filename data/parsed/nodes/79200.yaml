      <p>Ralf: <em>As Kevin Larson explained decoding and comprehension are connected, but very different things. I used slightly different terms, but this is exactly my point.</em></p>
      <p>I didn't see anything in your explanation that corresponds to what Kevin means by comprehension. It seems, rather, that you are trying to subdivide aspects of decoding as they relate to letter design. I'm not convinced that recognisability is something distinct from legibility, though, and since reading always involves relative recognisability, i.e. recognisability in context, I'm not convinced that distinguishability is significantly distinct from recognisability. Yes, it is possible to conceptually subdivide these phenomena of decoding, but I don't see that you gain anything much beyond simply referring to legibility of text. Your categories could be further subdivided -- as you do by listing different factors that you consider part of legibility (size, spacing, figure-ground contrast) -- and I don't see the rationale for considering recognisability of letterforms as distinct from either their size and spacing on the one hand or from distinguishability from other letterforms on the other hand. There are too many arbitrary ways to cut this onion.</p>
