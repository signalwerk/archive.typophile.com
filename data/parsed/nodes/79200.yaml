      <p>“Distinctive” has gained a different sense than “distinct” — the former tends to imply a unique stylistic quality, as opposed to mere differentiation: <em>“The Galliard Italic lowercase ‘g’ is quite distinctive.”</em></p>
      <p>That is to say, it is possible for something to be distinct from others of its class without necessarily being distinctive.</p>
      <p>So, in my opinion, if you were to forego “distinguishability” (which works rather well for me, frankly), then I would recommend “distinctness” over “distinctiveness.”</p>
