      <p>Kevin, thanks for the link. I see a great deal in it on how to set up an operate a machine network that operates by interactive activation. However, I see no testable predictions as to how the human brain should operate, particular in reading, if and when it operates by interactive activation. I don't see discussion of actual experimentation using human subjects, based on predictions from the machine models, which is what would be needed. Can you give some examples of the successful and unsuccessful predictions that have been checked in human subjects? </p>
      <p>In particular, what I am looking for is crucial tests that would distinguish the interactive activation model from other learning networks, such as Kohonen or self-organizing maps. I discussed this issue with a programmer who has worked with artificial intelligence involving both interactive activation and Kohonen maps, and he thinks that it is likely that interactive activation is a better model for reflective thinking, and Kohonen maps more likely as a primary mechanism in reading and other pattern recognition.  </p>
      <p>Further it is likely the Kohonen maps would work more like Peter Enneson has described, or the "matrix resonance" model that I have elaborated from Enneson's analysis. </p>
      <p>It is when you have tests of one model against another that you get really informative results. And to do this, both have to be well specified not only how they operate in a machine, but also their hypothesized relation to the way the human brain operates.</p>
