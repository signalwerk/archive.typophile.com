      <p><cite>'Legibility' is based on the ease with which one letter can be told from the other. 'Readability' is the ease with which the eye can absorb the message and move along the line.</cite></p>
      <p>Sure, that is fine by itself, but these terms are also used differently in other areas. For example, some weeks ago I read Romedi Passini's great books about wayfinding and he talks about the legibililty and readability of floor plans, buildings  and whole cities!<br>
      So I rather use a broad definition of legibility and readability that work across different disciplines and then I explain the details in type design and typography. I figured that works better than starting off with terms everybody might understand differently. </p>
