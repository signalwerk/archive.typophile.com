      <p>Terms that are difficult to define (or have much argument about their definition) are so because they are not concrete enough to be agreed to. The speed of sound or even light can be measured and agreed upon.  They are external forces.</p>
      <p>Readability is a very fuzzy little munchkin which is sure to bring debate at the mention of it. We perhaps can agree that sighted humans can observe certain forms and agree that they are indeed signs which can be configured as words and sentences. Science has measured the physical motions of human observers in this process. We "know" the eye moves in saccades instead of a smooth line. We know that regressions have been observed and the number and frequency of regressions is a variable from person to person and text sample to text sample. We know that the amount of time a given individual will continue to read text can vary with conditions as well as with individuals.</p>
      <p>We know also that after reading a given text, it is possible for the reader to achieve some level of comprehension of what the author intended. We know there is great variation possible in comprehension depending on what the variables are and the individual. I am glad that some scientists are attempting to define, within reasonable tolerances, which variables can be controlled enough to measure and how to go about this. Out of this research may come something of value in the arena of glyph form and presentation of material to reader.</p>
      <p>However, we live and read in a world where we are limited in what we control and who the readers and writers may react. As typographers and type designers, we "know" within some fuzzy tolerances when something is "Readable Enough" to serve its purpose.  We certainly do not agree on the exact point or even what is inhibiting enough to matter. We probably don't but probably should agree that there are cases when factors that impede decoding of presented signs can also be more valuable in the communication of the intended or even unintended message.  This can be recognizing a loved-ones poor handwriting and carefully taking the time to thoroughly read and understand it compared to instantly trashing a perfectly composed and typeset page of text with optimum line length font, and leading because we "know" we are not interested in what it has to say.</p>
      <p>There are times when a reader is "interested enough" to continue reading even if the presentation is not perfect.  If a person has purchased a book, it stands to reason that they are interested enough to read it. When tax forms come to be read,we may dread the idea of doing so but eventually complete the dreary task anyway. If a person takes a newspaper, he may read only what interests him and ignore the rest. Enter the world of advertising and persuasive communication:</p>
      <p>What happens when, as an author, you wish to have your message attended to by people who have no interest in it? It can be as perfectly set as the Lord Bringhurst can manage but remain unattended to.  It can also be presented in such a way as to entice a fair number of people to give it a look. This is what much of the communication industry is tasked to do. The unwilling reader is targeted, not those who are already onboard. The type shops of the world are loaded today with thousands of fonts that will never read as well as a Garamond or a Caslon but may just be the right tool to get a second look from the uninterested reader. Sure, we still need fine book faces and clear signage faces and readable tax forms, but there is a point where we "know enough" to know what will read well enough to do the job at hand.</p>
      <p>Even fine books are subject to the effects of production costs and therefore are more likely to take a chance on a reduction in type size that will reduce the expense and put the book at the desired pricepoint to succeed.</p>
      <p>As a type designer, I have much more interest in a typeface reading well enough for the job it was intended as well as being attended to in the first place, than I have in endless debates on reading terminology which will never achieve a thing usable in my life time. But with that,"Lay on McDuff," may those who wish to pursue that path continue as they wish.  Until then, a rose by any other name.</p>
