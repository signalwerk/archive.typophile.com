      <blockquote><p>So I don't see the need introduce a third term beyond the readable/legible distinction. </p></blockquote>
      <p>I can see a value in the further distinction. Take these sixes, for example:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Picture_5341.png"></div><br>
      The Helvetica bold six is, I would argue, more recognizable (to stick with Ralf's original terms) than my Ambicase Modern swash six, which has an unconventional open counter.<br>
      But with its smaller aperture, the Helvetica six might be more easily mistaken for an eight (as squinting at it, or viewing it from across the room, might confirm).<br>
      So Helvetica's six has relatively higher recognizability but relatively lower distinguishability than Ambicase Modern's swash six.<p></p>
