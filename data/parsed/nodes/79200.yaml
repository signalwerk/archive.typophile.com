      <p>I agree with the view that there are two distinct Reading components, but I would label them Decoding and Comprehension. These components are independent; it is possible to have one of these components but not the other. There are children who can name (decode) any word put in front of them, but not understand what is being read. Likewise, many people have perfect understanding of text that is read to them (comprehension), but are not able to decode a word. Both components are necessary to be a competent reader. R=DxC</p>
      <p>Hoover, W.A. &amp; Gough, P.B. (1990). The simple view of reading. Reading &amp; Writing, 2(2), 127-160.</p>
