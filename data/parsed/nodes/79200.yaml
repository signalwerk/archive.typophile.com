      <p>The terms Readability and Legibility are type terms, related to the distinction between text and display type.</p>
      <p>Or you could say they are design terms, related to the distinction between function and tone.</p>
      <p>Both these distinctions are useful in collaborative design work (i.e. between client and supplier), to critique work which is wrong in tone or function, and in typography, settings which look inviting or impressive but are hard to decipher, or which are easy to read but unattractive.</p>
      <p>In these practical circumstances, "readability" does not refer to the mechanical process of decoding, but is a humanistic, cultural term, fuzzy and soft in meaning.</p>
      <p>Readability was coined to recognize that the be-all-and-end-all of type is NOT ONLY to be clear and easy to decipher (and sometimes not even that), but also to engage readers' pleasure centres enough to get them reading in the first place, and to hold their attention.</p>
      <p>Perhaps researchers could measure dopamine reactions to typefaces?</p>
      <p>A recent post in the Release section referred to a typeface as being "gorgeous", and that is certainly how I think of settings that impress me.</p>
      <p>Typographic "readability" isn't that much different from "friendliness", a word often used to promote fonts.<br>
      You know, like "reader-friendly" and "user-friendly".<br>
      How do you measure friendliness?<br>
      This reality is not recognized in Kevin's reduction of reading to a process of Decoding and Comprehension.</p>
      <p>It doesn't make sense to try and interpret this quality in mechanistic terms.<br>
      To do so is to interpret the term too literally.<br>
      It is an attempt to appropriate and redefine a typographic term.</p>
      <p>Enough already with the numbers. More pleasure, less performance!</p>
