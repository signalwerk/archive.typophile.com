      <p>John, the issue here is that the methodology in experimental psychology, including reading psychology, tends to be too much what my teacher Popper called "inductivist". What that means in practice is that you expect theory to grow out of experiment, to come later. What happens in reality, in the absence of vigorous theorizing, is that you have a lot of experiments whose results don't fit together to make any coherent picture or broad, testable theory. People then make do with general interpretative frameworks—like interactive activation—that are loose enough to interpret the data, but not specified enough to make specific predictions that researchers could check, and see whether they are borne out or not.</p>
      <p>If you have have bold, imaginative theories that make testable predictions, then you can seek experiments as tests, and you get results they are extremely informative on what picture of the reading process (in our case) is correct. </p>
      <p>Historically, as I documented for one story in my first book—on the development of field theory in physics—in the hard sciences you generally have this pattern of testable theories and testing. In softer sciences, like psychology, you've had more the inductivist methodology, based on the mistaken view that that's what the hard sciences have succeeded with. The result of the weak methodology is very slow progress, or stagnation. </p>
      <p>By the way, when I told my views to my friend Nancy Nersessian, former president of the Cognitive Science Society, she emphatically agreed with me that there's not enough theorizing in experimental psychology.</p>
