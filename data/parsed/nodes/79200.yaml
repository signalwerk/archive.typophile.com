      <p>Ralf: <em>It is even worse in German where legibility and readability are usually mixed under one term: “Lesbarkeit”.</em></p>
      <p>But, see, to assume that this is ‘worse’ is begging the question, because quite a lot of the cognitive psychology literature on reading uses the term legibility for most of the stuff you are talking about, and doesn't talk about readability at all, except sometimes in reference to higher level document criteria including prose style, vocabulary, document layout (macrotypography). A letter-wise word recognition model, as now accepted on the basis of experimentation -- rightly or wrongly -- by most psychologists studying reading, favours this simple conflation of concepts that you are keen to differentiate, because they must consider legibility of the letter unit as the whole key to word recognition. And until someone produces an experimental result that <em>cannot</em> be explained in the context of the letter-wise word recognition model, I think most psychologists are going to take Occam's razor to concepts of readability distinct from legibility.</p>
      <p>[I'm anticipating someone pointing to the ‘word superiority effect’ as such an experimental result, so remind you that this is precisely a phenomenon observed in <em>letter</em> recognition tests.]</p>
      <p><em>I certainly agree that the used layout (or onion structure) is not something that is really inherent to these terms. It just developed in this way while I was working on it.</em></p>
      <p>Which is what I reckoned. But diagrammatic structures suggest relationships, and an onion structure suggests encompassed layers. And when you explicitly call something ‘the onion layer model of legibility’ you are strongly suggesting that there is something meaningful and applicable about this relationship of layers. But there is nothing in your explanation that suggests to me an onion layer relationship of the phenomena you are describing and labelling. Is recognisability something that is somehow <em>within</em> legibility and itself, in turn, encompassing distinguishability? Your accompanying text doesn't suggest such a relationship: you just happen to have drawn it this way. I suggested sandwich or cake models as alternatives, since what you have represented as encompassing layers could just as easily and equally validly be represented as stacked layers. Or, indeed, one can imagine the cookie model in which each of the distinguished and labelled phenomena are quite distinct objects sitting together on a plate and not layers at all. And your conclusion remains the same: sometimes you only need to eat two cookies, sometimes you need to eat the whole plateful.</p>
      <p>Which brings me to my final observation that, in your illustrative conclusion you have not shown any typographic circumstance in which legibility alone is a requirement. Your headline example involved both legibility and recognisability. So why are you insisting on these two being separate phenomena? Doesn't your model work equally well if legibility and recognisability are assumed to be the same thing? Then, as I wrote in February, while recognisability and distinguishability can be <em>conceptually</em> differentiated, in practice distinguishability is relative recognisability since, outside of glyph legibility testing, we are always seeking to recognise signs in context of other signs: relative recognisability is the normal circumstance of legibility and hence of reading.</p>
