      <p>Ralf, my project has been to try to find functional-ontological grounding for type-critical terms within the cognitive-scientific and perceptual-psychological domains. </p>
      <p>A consequence of this might be to relate both <em>Erkennbarkeit</em> [recognizability] and <em>Unterscheidbarkeit</em> [distinguishability] to categorical perception. Categorical perception is the psychological tendency to accommodate an specific instance of a form to a base-level category we are familiar with, like for instance the letter a, even though the specific instance has it's own individuality. </p>
      <p>Using this strategy it becomes apparent that recognizability relates to within-category membership and distinguishability to between-category differences. Discernability of within-category membership and the magnitude or gradient of between-category differences go hand-in-hand.</p>
      <p>On the within-category membership front we are confronted with issues of role-architectural conventionality or prototypicality and role-architectural norm-violations. On the between-category differences axis we confront issues of perceptual distances between optically-grammatically or role-architecturally related items. Perceptual distances are gauged by confusion matricies.</p>
