    html: <p>I'm not looking to reproduce the catalogue itself, though, or even pages from the catalogue or any of its layout. Just 8 or 9 fonts from a collection of 300 from the one section in the catalogue that deals with font transfers, just the A-Z 1-0 characters, nothing else on the page. Copyrightwise, wouldn't they be classified more or less as "underlying work" in an anthology, as it were?</p>
