    html: <p>Won't you be infringing copyrights when you publish on the internet...? Don't get me wrong, I like the idea of making it available to the public domain, but you'll probably need approval from Mecanorma/designers/foundries. Having said that, I would love to see them! I'm a big fan of old-style Mecanorma and Letraset type.</p>
