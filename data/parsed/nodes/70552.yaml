    html: <p>I don't really know, that's the problem. Is an image of a font a font or an image? If someone posts a scan of a complete character set to WhatTheFont and asks me what font it is and where they can buy it, which has happened in the past few days, and I tell them what font it is, and that's it's not digitally available but it was designed by so-and-so in the year such-and-such, what has actually happened in that exchange that would differ from me posting a complete character set to a blog and saying "Hey, I like this font, it was designed by so-and-so in the year such-and-such, shame it hasn't been digitised." Would either of us be infringing copyright? Should I refrain from doing that? I'm not even really that worried that people/foundries would jump on me for copyright, but that someone would take the image and run with it and do a Creampuff, as it were, and that that would be my fault.</p>
