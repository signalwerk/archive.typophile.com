    <p>Hi, </p>
    <p>I'm new to this forum and I wanted to ask a question of the more experienced typophiles out there. I was recently involved in a discussion over at MyFonts, where a font was identified as Pinto Inline, an undigitised font by Graphic Systems (that's what it says in my catalogue anyway).</p>
    <p>A user asked for the full set of characters, which I subsequently scanned, badly, from a Mecanorama catalogue I had lying around, and uploaded to my Photobucket account. </p>
    <p>Now I'd really like to scan that font properly, along with a few other obscure, not digitally available ones from that catalogue, and upload them just for the reference of those font lovers out there who'd like to see them, many of them have been identified at WhatTheFont from scans, logos and the like, but I'm worried that I might be inviting trouble. One the one hand, I think they should be seen, but on the other hand I don't want unscrupulous folks coming in, digitising them and running away with the credit. The catalogue itself isn't even dated, some of the fonts are credited to people or foundries, some aren't, I assume Mecanorama owned those, though I'm not sure. Should I scan and share with as much credit and copyright info as I can, or should I leave them in my bookcase to gather dust, just in case? I feel kind of bad having this record here on my coffee table and not being able to share it with anyone, but on the other hand, I don't want to be doing anything that verges on illegality.</p>
    <p>I'd welcome any advice. Thanks.</p>
