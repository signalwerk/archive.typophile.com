      <p>It looks like a heavy/bold weight of Futura like e.g. <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Berthold&amp;ffam=Futura%20BQ%20-%20DemiBold&amp;fid=2ac4215f0756be144108c5af278a0551&amp;fsize=60&amp;text=MAIDEN%20ENGLAND%20'88&amp;fit=1" rel="nofollow">Futura EF (Heavy)</a></strong><br>
      The "dust &amp; scratches" effect is probably added later (same letters contain different scratch patterns).</p>
      <p>-----------------------------------------------<br>
      I found it using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
