    <p>hi people...</p>
    <p>i am currently researching dyslexia, and the ways in which typography can contribute to helping dyslexics read with more clarity.</p>
    <p>does anyone know of any good sites or projects of a similar nature?</p>
    <p>i have seen the basics, bda etc... but am looking for some info from designers or typographers with knowledge of this particular topic.</p>
    <p><a href="http://www.unitprodesign.com">www.unitprodesign.com</a> shows an interesting reasearch based project, but there doesn't seem to be a typeface along with it!</p>
    <p>all help is greatfully welcomed.</p>
    <p>john b.</p>
