      <p>John, I'm wondering if Gerrit Noordzij's <a href="http://www.letterror.com/noordzij/stuff/Kind und Schrift.pdf" rel="nofollow"><em>Das Kind und die Schrift</em></a> can be of use.</p>
      <p>Underlying some of my conclusions about perceptual processing in reading are a few studies by Gad Geiger and Jerome Lettvin relating lateral masking and dyslexia. I wonder what you and your partner might think of them, and if they might spark some ideas.<br>
