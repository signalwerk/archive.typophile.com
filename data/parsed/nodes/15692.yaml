      <p>There is no lack of people exploring, investigating, inventing and proposing reform in spelling and <a href="/wiki/writing%20systems" class="freelinking" rel="nofollow">writing systems</a>.</p>
      <p>Just for an interesting perspective on many current and older attempts at spelling reform, alphabet reform, new and invented writing systems can be explored on:</p>
      <p><a href="http://www.omniglot.com" target="new" rel="nofollow">Omniglot -- Guide to Written Languages</a><br>
      A dizzying array of <a href="/wiki/abjads" class="freelinking" rel="nofollow">abjads</a>, <a href="/wiki/alphabets" class="freelinking" rel="nofollow">alphabets</a>, <a href="/wiki/syllabic%20alphabets" class="freelinking" rel="nofollow">syllabic alphabets</a>, <a href="/wiki/con-scripts" class="freelinking" rel="nofollow">con-scripts</a>, etc., and even including Matt Groening's <a href="http://www.omniglot.com/writing/futurama.htm" target="new" rel="nofollow">Alien Alphabet for Futurama</a></p>
      <p><a href="/wiki/Bradbury%20Thompson" class="freelinking" rel="nofollow">Bradbury Thompson</a> <a href="http://www.pbtweb.com/alpha26/alpha.htm" target="new" rel="nofollow"><em>Alphabet 26</em>.</a></p>
      <p><a href="http://www.langmaker.com/neographies.htm" target="new" rel="nofollow">Neographies</a> (new or invented writing systems)</p>
      <p><a href="http://www.omniglot.com/links/writing.htm" target="new" rel="nofollow">Writing Systems Links</a> from Omniglot</p>
      <p>There are just too many people inventing and designing glyphs for all sorts of reasons. As a typographer, I just might experiment with one of the con-lang (constructed language) glyph systems, since one aspect of typography is really about arranging glyphs.</p>
