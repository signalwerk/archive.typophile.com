    html: <p>Have you seen <a href="http://www.readregular.com/english/intro.html" target="blank" rel="nofollow">this</a>? It's a typeface specially designed to help dyslexics read. The theory is that the letterforms are asymmetrical making it easier for word / character recognition.</p>
