      <p>We did have some discussion on reading disorders, low vision, dyslexia, in a <a href="http://typophile.com/node/14660" target="new">previous thread</a> with some useful links.</p>
      <p>As Simon mentioned, Dyslexia is a "blanket" term. Here an extract from my post to the above mentioned thread:</p>
      <p>"I believe your mention of learning disabilities (inclusive of dyslexia, dyscalculia, dysgraphia, dyspraxia, and visual processing disorder) involves a completely different area of research not fully dependent on character recognition itself.</p>
      <p>By no means do I understand the issues related to such disorders, but one of my business partners is heavily involved with <a href="http://www.edvocacy.org/prob2.htm" target="new">Edvocacy.org</a>, a not-for-profit organization dedicated to establishing a national early recognition program for children with dyslexia. (Visit the link and take the little decoding test to give you a sense of what dyslexic readers go through.)</p>
      <p>My wife also happens to work for <a href="http://www.landmarkoutreach.org/res_e_faq.htm" target="new">The Landmark School</a> which is one of the best known private educational facilities for children with reading and learning disorders. Of what I know of their mission is that they are training the students to decode and reprocess information encountered in their daily lives."</p>
