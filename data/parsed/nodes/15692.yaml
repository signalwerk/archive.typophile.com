      <p>Apparently there is less dyslexia in Italy, attributed to fewer phonemes and fewer alternate phonemes for the same glyph.</p>
      <p>Spelling reform is surely a more fruitful area of research than typography.</p>
      <p>But I don't think you have to do it for everyone. Perhaps just a variety of alternate "logicalized" spelling systems for the different kinds of dyslexia, and a software program to translate.</p>
      <p>However, I do believe that "non-transformable" glyph shapes are inherently more legible than those which can be transformed into other characters simply by rotating or flipping. Which gives serifed type the advantage.</p>
