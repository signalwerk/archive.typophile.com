      <p>Luciano Perondi has participated in some very interesting recent experiments concerning the relative readability, and the nature of the difference in readability, between Italian and English. The findings concerning the relative ease/difficulty of reading "non-words" for example are worth paying attention to.</p>
      <p>&gt; Spelling reform is surely a more fruitful<br>
      &gt; area of research than typography.</p>
      <p>At first glance, yes. But when you realize that typography can be improved through the subconscious channel, while spelling reform can't, and only a good king can carry through conscious reform, and we don't got many good kings now, then spelling reform is pretty hopeless.  :-(</p>
      <p>hhp</p>
