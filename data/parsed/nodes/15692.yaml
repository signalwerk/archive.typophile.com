      <p>There is no lack of people exploring, investigating, inventing and proposing reform in spelling and <a href="/node/12260" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Writing Systems</a>.</p>
      <p>Just for an interesting perspective on many current and older attempts at spelling reform, alphabet reform, new and invented writing systems can be explored on:</p>
      <p><a href="http://www.omniglot.com" target="new">Omniglot -- Guide to Written Languages</a><br>
      A dizzying array of <a href="/node/12262" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Abjads</a>, <a href="/node/12248" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Alphabets</a>, <a href="/node/12267" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Syllabic Alphabets</a>, <a href="/node/add/wiki?edit%5Btitle%5D=con-scripts" title="Create node &quot;con-scripts&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">con-scripts</a>, etc., and even including Matt Groening's <a href="http://www.omniglot.com/writing/futurama.htm" target="new">Alien Alphabet for Futurama</a></p>
      <p><a href="/node/add/wiki?edit%5Btitle%5D=Bradbury%20Thompson" title="Create node &quot;Bradbury Thompson&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Bradbury Thompson</a> <a href="http://www.pbtweb.com/alpha26/alpha.htm" target="new"><em>Alphabet 26</em>.</a></p>
      <p><a href="http://www.langmaker.com/neographies.htm" target="new">Neographies</a> (new or invented writing systems)</p>
      <p><a href="http://www.omniglot.com/links/writing.htm" target="new">Writing Systems Links</a> from Omniglot</p>
      <p>There are just too many people inventing and designing glyphs for all sorts of reasons. As a typographer, I just might experiment with one of the con-lang (constructed language) glyph systems, since one aspect of typography is really about arranging glyphs.</p>
