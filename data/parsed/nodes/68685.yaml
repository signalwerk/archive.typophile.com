      <p><em>I’m looking a python macro for automatically calculating position and creating top and bottom anchors in FontLab.</em></p>
      <p>I'm not aware of any macro to do this within FontLab, and am not sure that it is possible. <a href="http://www.sakkal.com/" rel="nofollow">Mamoun Sakkal</a> offers a service for automatic mark positioning that some of my clients have used. He uses proprietary software to analyse and calculate mark positioning, and provides the result as a VOLT GPOS lookup .vtl file.</p>
      <p><em>another problem: anchors of FontLab 5.0 are not generated when outputting ttf file…</em></p>
      <p>Yes, this is a limitation of the current FontLab. It relies on Adobe FDK code for OpenType Layout, and uses an earlier FDK that did not support GPOS anchor attachments. This is one of the reasons why VOLT remains the preferred tool for Arabic font development. I understand that FontLab Studio 6.0 will support this feature.</p>
      <p><em>your name is not Iranian or Armenian, but your icon in site is in Nastaliq Style; do you read Farsi?</em></p>
      <p>No, I do not. I design make fonts for lots of different writing systems -- sometimes in collaboration --, and can't learn all the languages involved. My icon was a gift sent to me by a colleague: my name written by a calligrapher. I liked it so much, I made it my Typophile icon.</p>
