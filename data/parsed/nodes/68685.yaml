    <p>Dear all,</p>
    <p>This is my first post on this site. I’m beginner in designing <a href="/wiki/Arabic" class="freelinking" rel="nofollow">Arabic</a> fonts.<br>
    For a long time I was looking for a design guide for Arabic fonts on internet for accomplishing my own design of nastaaliq-shekasta, but didn’t find ANYthing else than a few companies that just sell their products. I have many troubles with Arabic OpenType features especially mkmk, mark and kashiada[?].<br>
    *Could you introduce me a free guide or handbook about Arabic fonts, or a complete OpenType features guide?<br>
    * How can I learn about mkmk and mark? could you help me?<br>
    * Which programs you are using to design OTF tables?<br>
    * Can I ask some more questions here? or this forum is just for experts?</p>
