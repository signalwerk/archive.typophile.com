      <p><em>I have own that book! I design shekasta ligatures by scanning its pages and converting they to Bezier curves.</em></p>
      <p>I strongly encourage you to consider not making ligature glyphs but, instead, breaking them down into smaller components that can be contextually substituted and arranged using the 'curs' feature. This will make your font much smaller and more flexible.</p>
