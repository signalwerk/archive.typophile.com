      <p>Soroush, you might find the Typophile <a href="http://typophile.com/forum/366" rel="nofollow">Arabic forum</a> a useful place to ask such questions.</p>
      <p>Also check out the <a href="http://forum.fontlab.com/microsoft-visual-opentype-layout-tool-volt-b24.0/" rel="nofollow">MS VOLT tool forum</a>. VOLT is the preferred tool for building OpenType Layout tables for most Arabic font development.</p>
      <p>Do you read Persian? The best book on the writing of Persian styles is <em>Ta’lim-e Khatt</em> by Habib-ollah Fazāeli. This is a calligraphy manual, but does a better job than most of describing the grammar -- the rules and permitted variations -- of the nastaliq and other styles, and understanding the grammar of a script style is the first step in being able to faithfully represent that style typographically.</p>
      <p>The OTL mark and mkmk features are fairly easy to understand, I think. These features dynamically position combining marks such as vowel signs to letters (mark) and to other marks (mkmk). This is done by defining anchor attachment points on the mark and on the base letter or mark. This can be done in VOLT.</p>
