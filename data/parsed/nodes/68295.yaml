      <p>Hi Jean. There’s a lot of nice stuff going on here. I particulary like the d/b/p/q curves. They do, however, not fit all that well with the rest of your letters. It’ll probably be easier to see once you add some weight. Helvetica (your starting point) is a (neo) grotesque: see how the curve of the n starts low on the first stroke and forms a 180 degree half circle, how the terminals of letters like s/e/c/a closes up following the same (or a similar) half circle shape. The main characteristics of your design doesn’t share much with Helvetica. Perhaps that is a good thing (I think so), but you need to be consistent. If you’re sticking with open humanist forms like the e/s, the same openness should be evident in the rest of your letters.</p>
      <p>Also, remember to consider overshots (round shapes look lower than flat shapes, a sharp v/A apex also needs to descend or ascend ever so slightly) and optical adjustments (ex: the u look too wide when it’s as wide as the n). Trust your eyes more than the numbers :)</p>
      <p>I’m far from an expert, so please take my advice with a grain of salt.</p>
