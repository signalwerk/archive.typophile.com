    html: |-
      <p>Thanks for your input Claire and Frode!</p>
      <p>I think I wasn't clear when I said I'm using Helvetica as basis for this new design. It is certainly not my intention to copy Helvetica or parts thereof. I just like the general feel of Helvetica Light Extended; it's so clean, clear and crisp, yet over-used and not quite readable in smaller sizes because of it's lack of openness. It's my intention to recreate that same feel, but more open to optimise readability.</p>
      <p>I myself am quite pleased too with the curves on /b/, /d/, /p/ and /q/. It's nice to know you two agree. These glyphs will be my startingpoint for others. I started out with stemless /n/, /m/, /r/, /g/ and other glyphs and I am going to keep them as alts, since you like 'm! </p>
      <p>Thanks for your sharp insight on the apexes, Frode! I'll check them again and take a closer look at overshoots and /u/.</p>
      <p>And Claire, maybe I'll keep my first draft of /G/ as an alt as well. </p>
      <p>Finally, and I think this goes for most amateur type designers, I want to create a font that isn't boring, perhaps with a little bit of quirkyness and fun, yet useable as body text. It's hard...</p>
      <p>Thanks again Claire and Frode! I'll keep working!</p>
