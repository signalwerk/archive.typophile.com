      <p>Good idea with this, it's looking promising.</p>
      <p>I agree that overall it doesn't share too much with Helvetica and I also think this is a good thing. The curves on the letters Frode mentioned are really nice: clean and elegant. A good direction to go in. </p>
      <p>I do kind of miss the earlier /g/ - it was quite quirky and the top and bottom loops created an interesting balance. I can see how the new one would probably work better though in general use, maybe keep the previous one as an alt? Seems a shame to lose it.</p>
      <p>Like Paul mentioned in the other thread, the simplicity of the previous /G/ is very nice with its lovely smooth curve. I'd be curious to see how that idea would work with this new width.  </p>
      <p>I much prefer this new /Q/ the tail seems much more comfortable. I also like the /K/ more this way than the earlier treatment. While an interesting idea, it seemed to me a little out of place. The /r/ is also much better.</p>
      <p>Nice work so far! Looking forward to seeing it progress.</p>
