      <p>Until the 16th Century, most Roman type used in England was manufactured in the Netherlands. English printers were beginning to make their own Roman type in Shakespeare's time, but they were still using Dutch type as their model. (In the 17th Century, England enacted laws severely restricting the press, which sent English printing into a temporary decline.)</p>
      <p><a class="freelinking external" href="http://myfonts.us/td-Sx7pBj" rel="nofollow">1669 Elzevir</a> is a modern re-creation of the type that inspired the early printers of Shakespeare.</p>
    html_clean: |-
