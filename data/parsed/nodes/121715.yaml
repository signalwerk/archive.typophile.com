      <p>Shakespeare's First Folio is well before Caslon, as as people have noted. Yet as Caslon was using models from the previous century, and giving his personal interpretation, they retain quite a bit of the feeling of the earlier types. </p>
      <p>In 2011 the Folger Shakespeare Library did an exhibition on Shakespeare's First Folio, and did a book, <em>Folio Mania! Stories Behind Shakespeare's Most Important Book</em>. Bruce Kennett designed the book to the same proportions and some of the same layout as the First Folio, and used Williams Caslon Text (Font Bureau) for the text and running heads, which like the First Folio were in italic with swash caps. The book also used fine Vellum paper. I was delighted see my typeface used so beautifully—Thanks Bruce! I thought it succeeded pretty well in getting the feel of the old book, without being fake antiquarian.</p>
      <p>   <img src="/sites/default/files/old-images/FoliomaniaCataloguePagespread_5395.jpg"></p>
    html_clean: |-
