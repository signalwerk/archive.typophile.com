      <p>It is very interesting to learn of the typefaces of Pierre Haultain. So this face dates from 1570, and while one revival was done, it was not made generally available.</p>
      <p>Incidentally, as it does very strongly resemble Caslon, and it was formerly thought to be a typeface of Dutch origin instead of French, I'm wondering if the discovery of the font's origins will have an impact not just on Shakespearian study, but on the history of type in general - in that Caslon resembles this more than, say, Plantin.</p>
    html_clean: |-
