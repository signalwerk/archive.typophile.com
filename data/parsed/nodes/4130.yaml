  html: <p>I'm working on this project that is coming up very nicely and it uses Courier New (sorry if I offended anyone) ;) <br> <br>I wanted to tweak the apostrophe and comma because they seemed too thick so I changed them a little in Fontlab. I started from a .ttf file and saved as Type 1 (Set as bitstream). My modifications worked fine but when I print, some letters seem to have thickened a little (u, r, and n especially.) <br> <br>There is no such change on screen, only when I print it (using an inkjet printer). What could cause this? Is there another way to save that will keep it from doing this? Is it a matter of bitmaps or something? <br> <br>I'm not really used to FontLab yet and font editing software overall so detailed explanations would be very nice! =) </p>
  html_clean: <p>I'm working on this project that is coming up very nicely and it uses Courier New (sorry if I offended anyone) ;) <br> <br>I wanted to tweak the apostrophe and comma because they seemed too thick so I changed them a little in Fontlab. I started from a .ttf file and saved as Type 1 (Set as bitstream). My modifications worked fine but when I print, some letters seem to have thickened a little (u, r, and n especially.) <br> <br>There is no such change on screen, only when I print it (using an inkjet printer). What could cause this? Is there another way to save that will keep it from doing this? Is it a matter of bitmaps or something? <br> <br>I'm not really used to FontLab yet and font editing software overall so detailed explanations would be very nice! =) </p>
