    html: <p>It's more accurate to say that when our fonts are supplied with Microsoft products their use is governed by the product EULA. In the case of the old Web fonts, they have their own EULA which as Adam points out is even clearer...  <br> <br>Limitations on Reverse Engineering, Decompilation, and Disassembly. You may not reverse engineer, decompile, or disassemble the SOFTWARE PRODUCT, except and only to the extent that such activity is expressly permitted by applicable law notwithstanding this limitation. <br>�	 Restrictions on Alteration.  You may not rename, edit or create any derivative works from the SOFTWARE PRODUCT, other than subsetting when embedding them in documents. <br> <br>Emilie has hit on one of the main reasons we prohibit modifications - using off the shelf tools chances are you're going to break the font when you modify it - the hinting, the metrics or other data - if this font gets passed on and users experience problems - document reflow or bad rendering - they'll come to us and complain. Chances are they won't go back to the person who modified the font.  <br> <br>Cheers, Si <br></p>
