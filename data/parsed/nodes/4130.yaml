    html: <p><i>Apart from the presence of Courier New in Microsoft Windows as a system component, the font has always been part of the Microsoft Core Fonts for the Web package, which was covered with a separate EULA.</i> <br> <br>True, but you would have to check the version number of the font to confirm whether you were dealing with the OS version or the web package version, since the former almost certainly leapfrogs the latter (if it hasn't yet, it is almost certain to in Longhorn, for which MS are updating all the core system fonts).</p>
