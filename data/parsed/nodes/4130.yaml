    html: "<p>I'm not aware of any books that cover this stuff, and to date I've resisted the tempation to write one. For good information on TrueType hinting, I recommend the following links and the pages that follow from them: <br> <br><a href=\"http://www.microsoft.com/typography/tools/trtalr.htm\"><i>The raster tragedy at low resolution</i></a> by Beat Stamm, lead developer of the Visual TrueType hinting tool. [Beat's description of a screen as 'a regularly spaced grid of black and white dots' doesn't take into account either greyscale or RGB rendering, but he's focusing on the difficulties of rasterising clean b/w bitmaps.] <br> <br><a href=\"http://www.microsoft.com/typography/TrueTypeHintingIntro.mspx\">TrueType Hinting overview.</a> (Microsoft) <br> <br><a href=\"http://www.microsoft.com/typography/hinting/tutorial.htm\"><i>Basic hinting philosophies and TrueType instructions</i></a> by Vincent Connare.(Microsoft) <br> <br><a href=\"http://www.truetype.demon.co.uk/tthints.htm\"><i>TrueType Hinting</i></a> by Laurence Penney. [The tools discussion in this article is rather out-of-date, but the basic discussion is good and still relevant.]</p>"
