    html: <p><i>In the same line of conversation, what can be the consequences on things like hinting or other technicalities in software if I set my type size to an "in-between" (i.e. 6,25 points instead of 6)? How is it handled?</i> <br> <br>Hinting affects pixel sizes (measured in ppem, i.e. pixels per em), not point sizes, so fractional point values are handled exactly the same way as full point values. The rasteriser calculates the relationship of point size and resolution to determine ppem size. At low resolutions, there may be no visible difference between close point values, e.g. 6pt and 6.25 points, since ppem sizes are whole numbers so the rasteriser always rounds to the nearest ppem size.</p>
