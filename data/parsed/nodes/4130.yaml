    html: "<p><i>BTW, I think Courier New is covered by the MS font EULA, which prohibits font modifications of any kind, even if it's just for \"internal\" use. But I personally recommend ignoring such clauses in EULAs</i> <br> <br>There is no MS <i>font</i> EULA: the core system fonts are covered under the terms of the <i>operating system</i> license, according to which opening and modifying the font would count as decompiling a system component. I'm willing to consider arguments of this kind regarding retail font licenses, because there is room for debate in what is 'normal' for such licenses, but core system fonts are a different kind of thing, developed, paid for and provided to users under a completely different model from retail fonts.</p>"
