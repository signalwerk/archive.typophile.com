    html: "<p>Probably the hinting is being thrown off (especially since you're switching from TT to T1). Hints are \"extra\" instructions embedded in fonts to help them render more consistently in low resolutions*. It's something you can tweak yourself, but it's a lot of work to do right. On the other hand, it's possible that Fontlab's auto-hinting will do a decent job for you. Your best bet is to keep the font as TT, and possibly tweak the hinting just for the characters you're modifying. <br> <br>* Normally this affects screen rendering most, but for smaller point sizes even laser printers can exhibit funny artefacts. <br> <br>The other possibility I can think of is a counter direction issue. Contours that are turning the wrong way will render slightly darker - although I'm not sure why only some of your glyphs would exhibit the problem. Also, proper contour direction for TT is opposite that of T1! You can check everything manually: T1 contours have to be counter-clockwise for black bodies, and clockwise for white (like the inside of the \"o\"); or you can use FontLab's automatic process. <br> <br>BTW, I think Courier New is covered by the MS font EULA, which prohibits font modifications of any kind, even if it's just for \"internal\" use. But I personally recommend ignoring such clauses in EULAs, although I might advise you not to publicize it too much.  :-) <br> <br>Bonne chance... <br> <br>hhp <br></p>"
