    html: '<p>John Hudson writes: "There is no MS font EULA: the core system fonts are covered under the terms of the operating system license, according to which opening and modifying the font would count as decompiling a system component."  <br> <br>I believe this is not completely accurate. Apart from the presence of Courier New in Microsoft Windows as a system component, the font has always been part of the Microsoft Core Fonts for the Web package, which was covered with a separate EULA. The package is available, among others, from:  <br><a href="http://prdownloads.sf.net/corefonts/courie32.exe" target="_blank">http://prdownloads.sf.net/corefonts/courie32.exe</a> <br> <br>The EULA that accompanies the product defines, among others, that: "you may reproduce and distribute an unlimited number of copies", " provided that each copy shall be a true and complete copy", "you may not reverse engineer, decompile, or disassemble" the fonts "except and only to the extent that such activity is expressly permitted by applicable law notwithstanding this limitation", and finally "you may not rename, edit or create any derivative works".  <br> <br>So, editing Courier New is not permitted.  <br> <br>Adam</p>'
    html_clean: '<p>John Hudson writes: "There is no MS font EULA: the core system fonts are covered under the terms of the operating system license, according to which opening and modifying the font would count as decompiling a system component."  <br> <br>I believe this is not completely accurate. Apart from the presence of Courier New in Microsoft Windows as a system component, the font has always been part of the Microsoft Core Fonts for the Web package, which was covered with a separate EULA. The package is available, among others, from:  <br><a href="http://prdownloads.sf.net/corefonts/courie32.exe" target="_blank" class="link-external">http://prdownloads.sf.net/corefonts/courie32.exe</a> <br> <br>The EULA that accompanies the product defines, among others, that: "you may reproduce and distribute an unlimited number of copies", " provided that each copy shall be a true and complete copy", "you may not reverse engineer, decompile, or disassemble" the fonts "except and only to the extent that such activity is expressly permitted by applicable law notwithstanding this limitation", and finally "you may not rename, edit or create any derivative works".  <br> <br>So, editing Courier New is not permitted.  <br> <br>Adam</p>'
