    <p>Hello,</p>
    <p>I'm hoping you can help. A collegue of mine has been trying to find this font for quite some time. Google research seems to have turned up very little, but maybe some of you typophiles might know.</p>
    <p>It's from the Famous Five TV show screened during the 70's, hopefully this image will help with identification. </p>
    <p><img src="/sites/default/files/old-images/enid-blyton-the-famous-five-dvd_5276.jpg"></p>
    <p>Just for clarification, it's the "Famous Five" text rather than Enid's singnature :)</p>
    <p>Thanks in Advance,</p>
    <p>Sam.</p>
