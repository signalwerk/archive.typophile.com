      <p>Similar, but not the same: <a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-2&amp;ffam=Monkey%20-%20Regular&amp;fid=eb8e994ee6bd69e21643024c246ab334&amp;fsize=72&amp;text=PHAIDON%20CENTURY%20ATLAS%20OF%2021&amp;wrap=2" rel="nofollow">Monkey</a> by Tommy Ettinger</p>
      <p>Ricardo is right it could be a plotter vector font (a constant stroke-width font, designed to be drawn by a plotter marker).<br>
      If this is the case, there could be no equivalent  TrueType / OpenType font to use on your computer</p>
      <p>-----------------------------------------------<br>
