  - id: 590806
    user: 15340
    date: 2014-10-18T06:58:00
    date_raw: 18 Oct 2014 — 6:58am
    votes: null
    html: |-
      <p>You can either append the full pathname to the file after checkoutlines... or cd to the directory then just append the filename.<br>
      e.g. on OS X:<br>
      checkoutlines ~/Documents/Foundry/fred/fred.otf<br>
         or<br>
      cd ~/Documents/Foundry/fred/<br>
      checkoutlines fred.otf</p>
