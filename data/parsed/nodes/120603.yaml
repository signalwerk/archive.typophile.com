    html: |-
      <p>I should add two caveats:</p>
      <p>- Folks using some Wacom tablets may find that they need old drivers for the tablets to work properly with FontLab Studio (and with assorted other apps), but that the old drivers are not compatible with Yosemite.</p>
      <p>- We have one report that while they still work, UFO export scripts (both from Robofab and UFO Central) seem to be surprisingly slow under Yosemite. I'd be curious to hear if more people have experienced this slowdown.</p>
    html_clean: |-
