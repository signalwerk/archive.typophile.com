      <p>I've noticed a problem. </p>
      <p>Randomly I lose certain keyboard or cursor key functions. I was just editing a glyph and selected the tool to draw a circle from the toolbar. When I pressed 1 to return to the pointer tool nothing happened. I also lost the z and x zoom ability. Also lost was the delete key function and the command x for cut. These functions continued to work when selected via menu. When I pressed the ` key for high rez preview the preview remained after I released the key. Cursor keys continued to function.</p>
      <p>On other occasions I have lost cursor key function. It is all appears to be random. I will pay closer attention to see if I can identify a pattern.</p>
