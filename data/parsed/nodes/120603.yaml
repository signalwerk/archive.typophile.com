      <p>I've found in general things work as well under Yosemite as they did under Mountain Lion. However, today I did have Fontlab crash on me a few times in a row. A glitchy font file might be to blame here, I'll have to see if it happens again with a different font. In using my Wacom tablet, I find the screen scrolls up by a couple of inches whenever I put pen to tablet, but it's done that since Snow Leopard, so I'm not too concerned (though I'd love to have a fix for this).</p>
      <p>Cheers,</p>
      <p>Oliver</p>
