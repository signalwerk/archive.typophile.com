    <a href="http://typophile.com/node/18487" rel="nofollow">Spacing &amp; Kerning Classes</a><br>
    <a href="http://www.typophile.com/node/31506" rel="nofollow">Kerning Pairs</a><br>
    <a href="http://www.typophile.com/node/30960" rel="nofollow">Brute Force Testing</a><br>
    <a href="http://www.typophile.com/node/29545" rel="nofollow">Kerning List</a><br>
    <a href="http://typophile.com/node/67749" rel="nofollow">Kerning!</a></p>
