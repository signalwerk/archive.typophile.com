    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Kerning</strong></p>
    <p>Kerning involves closing up or opening out letter pairs where the letter shape results in uneven <a href="/wiki/letter%20spacing" class="freelinking" rel="nofollow">letter spacing</a>.</p>
    <p><strong>See also</strong><br>
    <a href="/wiki/kern" class="freelinking" rel="nofollow">kern</a><br>
    <a href="/wiki/Kerning%20How-To" class="freelinking" rel="nofollow">Kerning How-To</a></p>
