      <p>"Sacred cows make great hamburgers." --Mark Twain</p>
      <p>Seriously, though (and to rescue this thread from the Flame War Dustbin), I agree that the FedEx logo is pretty genius -- arrow or not. If I remember right from design magazine articles of the time, the client specifically wanted to get "Federal" out of the name, encountering resistance in other countries (especially Latin America). The original design included an animation suggestion where a large yellow arrow (larger than the space in between the "e" and the "x" flew in from the left, then settled into the space while fading away. It was never used, largely because of what Chris said above -- half the time on any mode of transport, it's pointing the wrong way.</p>
      <p>From a typographic standpoint, I believe the designer said he started with Futura, but used the counters from Univers (which seems to have taken over as their corporate font, website graphics in Frutiger notwithstanding).</p>
      <p>See all their current branding at once <a href="http://www.fedex.com/us/about/today/companies/index.html?link=2" rel="nofollow">here</a>.</p>
      <p>(<em>Nota bene</em>: A crucifix is a cross with a <em>corpus</em>, an image of the crucified Christ, on it. In other words, all crucifixes are crosses, but not all crosses are crucifixes. Please pardon my splitting hairs, but it's the name of my order, after all.) :-)</p>
    html_clean: |-
