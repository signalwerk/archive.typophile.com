      <p>The arrow isn't what was important about the re-branding, it was the natural capitualtion to the direction of the masses. Everybody called them 'Fed Ex' when their legal &amp; (&amp; brand) name was 'Federal Expresss'. This discontinuity got in the way. It was haming the brand. So it was a good idea to rebrand on that basis alone. Their old logo wasn't in tune with the age they were in either. It was weak compared to their competion. Making a stonger ID meant that they could capitalize on the growing confidence they were enjoying vis a vis their competitors. I think Landor did a solid job but that in a way it was a cake walk of a job because the job needed to be done so very badly at the time. The fact that the logo is still fairly strong is proof that the work they did was solid work. And making their own letters was smart. But NIVEA made their own letters too. Making your own letters wasn't a new idea. </p>
      <p>To me the the question is how long until it needs to be redone? As it stands it is full of the 70s-80 culural adoption of mid centuruary modern ideals. At some point that will seem outdated and quaint. And their recent rebranding of Fedex Kinkos is hesitant and weak I think. There is a thread about that here on typophile. Find it iof you wish. Search is on the upper right of the page. Here's a sample though.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/fxks_logo_5415.gif"></div><p></p>
      <p>But to Hrant's points ( as best I can make them out. It isn't easy to see your point other than 'these guys are show offs &amp; so we should not like them'...) </p>
      <p>-&gt; <em>Is the arrow for for ad agency buddies?</em> : I don't know - maybe. But I don't think it's important anyway. It neither makes nor breaks the ID. It's a sideshow; not the main event.</p>
      <p>-&gt; <em>Was the rebranding as a whole for other ad agencies as an audience?</em>: No. In fact, no f***ing way. It was inevitable and obvious and very very needed for pure and basic business reasons. And put in Mr. Leader's place I bet you or I would have done something pretty similar. The real core of rebranding has to do with making the name change &amp; changing the type. </p>
      <p>That said, I might have even thought the arrow was fun once I saw it. And I probably would not have wanted to make a big deal out of it even if I allowed it to emerge in the text. Maybe I am making the classic mistake of seeing genius as 'easy' or 'obvious'. But I don't think so. I think it was just solid work in the right place &amp; right time.</p>
      <p>Feel free to help me see the light if you disagree. But you had better have some compelling arguements!</p>
    html_clean: |-
      <p>The arrow isn't what was important about the re-branding, it was the natural capitualtion to the direction of the masses. Everybody called them 'Fed Ex' when their legal &amp; (&amp; brand) name was 'Federal Expresss'. This discontinuity got in the way. It was haming the brand. So it was a good idea to rebrand on that basis alone. Their old logo wasn't in tune with the age they were in either. It was weak compared to their competion. Making a stonger ID meant that they could capitalize on the growing confidence they were enjoying vis a vis their competitors. I think Landor did a solid job but that in a way it was a cake walk of a job because the job needed to be done so very badly at the time. The fact that the logo is still fairly strong is proof that the work they did was solid work. And making their own letters was smart. But NIVEA made their own letters too. Making your own letters wasn't a new idea. </p>
      <p>To me the the question is how long until it needs to be redone? As it stands it is full of the 70s-80 culural adoption of mid centuruary modern ideals. At some point that will seem outdated and quaint. And their recent rebranding of Fedex Kinkos is hesitant and weak I think. There is a thread about that here on typophile. Find it iof you wish. Search is on the upper right of the page. Here's a sample though.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/fxks_logo_5415.gif"></div><p></p>
      <p>But to Hrant's points ( as best I can make them out. It isn't easy to see your point other than 'these guys are show offs &amp; so we should not like them'...) </p>
      <p>-&gt; <em>Is the arrow for for ad agency buddies?</em> : I don't know - maybe. But I don't think it's important anyway. It neither makes nor breaks the ID. It's a sideshow; not the main event.</p>
      <p>-&gt; <em>Was the rebranding as a whole for other ad agencies as an audience?</em>: No. In fact, no f***ing way. It was inevitable and obvious and very very needed for pure and basic business reasons. And put in Mr. Leader's place I bet you or I would have done something pretty similar. The real core of rebranding has to do with making the name change &amp; changing the type. </p>
      <p>That said, I might have even thought the arrow was fun once I saw it. And I probably would not have wanted to make a big deal out of it even if I allowed it to emerge in the text. Maybe I am making the classic mistake of seeing genius as 'easy' or 'obvious'. But I don't think so. I think it was just solid work in the right place &amp; right time.</p>
      <p>Feel free to help me see the light if you disagree. But you had better have some compelling arguements!</p>
