      <p>I think I'm reaching the limits of the English language (maybe even written communication) to dispel this illusion... :-/ But I'm also starting to feel like I owe people/Typophile more than cryptic drive-bys, and if I do a good job and keep track of this thread I could even simply point to it whenever a "So guys, how cool is the arrow in the FedEx logo!" crosses my path (assuming the link stays live) - the Snog Blog thing is clearly not cutting it.</p>
      <p>--</p>
      <p>&gt; I don’t think that the “subtle” arrow is being “flaunted”</p>
      <p>No, it's not that the arrow is being flaunted - it's not, and it couldn't be - because it's the <cite>subtlety</cite> that's being flaunted. Wanting to self-validate graphic design and by the same token appeal to other graphic designers -who are however of no concern to the client- is distracting from the ideal.</p>
      <p>&gt; if the client doesn’t care that there’s an arrow in there, why should we?</p>
      <p>1) What kind of client doesn't care about every detail in its logo? Not the FedEx kind.<br>
      2) Do you really mean to say that The Customer Is Always Right? I couldn't agree less.</p>
      <p>If the design studio put the arrow in there on purpose (see below - and above, twice, for that matter) then one would assume they told the client about it. If they didn't tell the client, that just validates my point more. So let's assume they did; at that point if the client didn't like the idea, they would have asked for it to be removed (in favor of the original letterforms, presumably) - they wouldn't have thought "what the heck, these designer dudes really want it in there, let's just humor them". Chances are they thought (probably because that's exactly what they were told during the pitch) what many people here have been saying: that hey, it can't hurt, it can only help. I think that deep down it does in fact hurt, because the <cite>intent</cite> is misaligned with what the client really needs, so the result is necessarily non-ideal. Somewhere, there was a better solution, but it would have required the designer to not suffer from Overkilled Subtlety Flaunting Disease - you can't get there from here.</p>
      <p>The further the intent is "off", the less the results can approach the ideal.</p>
      <p>&gt; was the designer supposed to then edit the arrow out of the logo,<br>
      &gt; just so that the typeforms would return to being "pure"?</p>
      <p>This is getting into the mechanics of how design studios operate, and relate to their clients. I know little about that, but I do believe there's a lot of variance, so for example one studio might work on a bunch of proposals and show the client only a handful of them, another might work on a bunch and show them all, another might work on only two and show those, etc. And then there's the client culture, which might love or hate a given approach.</p>
      <p>But I would say that ideally there would be enough effort on the part of the studio and enough clear, iterative communication between the studio and the client that you'd never end up in a position of removing a subtle arrow and reverting to original letterforms - you'd have done one with the original forms to begin with, and ideally shown that version to the client no later than the subtle-arrow one, and in fact alongside a not-too-subtle arrow one (because the arrow is a Concept, not a happy accident). But of course the real world never works so elegantly.</p>
      <p>--</p>
      <p>But guys, you know what? This arrow business really isn't so bad. There are worse things in the graphic design field - in fact I think there are worse things in the type design field, so please stop thinking that I hate all graphic designers or something - it's just that I think some fields, through historical precedent, plain circumstance, the pressures put upon it by society and capitalism, or whatnot, are further from some form of an ideal than others. Like how very many people think politicians are opportunistic low-lifes, and most people -among those who know we even exist- think that type designers are harmless idealistic freaks, I'd say that graphic designers are somewhere between those two (although much closer to the latter). Now <cite>photographers</cite>...  ;-)</p>
      <p>hhp</p>
