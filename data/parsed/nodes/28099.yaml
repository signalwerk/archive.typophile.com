      <p>I like the FedEx logo. Always have, probably always will. I admit that I didn't see the arrow at first, but the logo doesn't need the arrow to function. Most of its success, in my opinion, is its clarity, distinct &amp; quick read, and the way it's used by FedEx. The arrow just adds another nice layer to the whole thing that gives it depth. Plus, if the arrow is too overwhelming, it can be a liability (pointing backwards, etc.).</p>
      <p>I believe that any shortcomings it has are more subtle than that arrow.</p>
