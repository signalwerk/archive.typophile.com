      <p>Having an element in a logo which does not become evident at first glance aids in the branding process. It makes another pocket of memory to associate the logo in.  It also causes discussion among those who saw it and those who did not, further increasing brand awareness.  There was no trick and no hidden agenda, no more than making adjustments to a text face so that it reads better at text sizes.  Creating overshoot is also a "trick" to "fool" the eye--I guess that is pretty sinister stuff those damn type designers do. Don't talk about ink traps or thinning horizontal strokes either.  Those are really dirty tricks that type designers do just to impress each-other.  It is their underlying unspoken intent to snicker at readers who are not in the know about such things. There is going to be a tell-all expose on 60 Minutes this week where Mike Wallace has a hidden camera in Matthew Carter's studio looking for such dirty schemes as he pulled off for Ma Bell. Graphic designers are just pikers at this sneaky business ;^{</p>
      <p>ChrisL</p>
