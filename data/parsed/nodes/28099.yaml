      <p>&gt; they are just being themselves</p>
      <p>But what are the people who put that arrow there being?</p>
      <p>&gt; We are the same when it comes to fonts…</p>
      <p>Many of us indeed are, like when some type designers insist a font must be chirographic to be accepted by the reader. But I personally try not to appreciate only things that fulfill my own prophecies.</p>
      <p>One interesting extension to this parallel is the difference between display fonts and text fonts, and that's related to my valuation of the proper application of subtlety in design. My essential complaint is that the way the arrow ended up being in the FedEx logo is bad design - that's all. Opinions like "the new logo is much better than the old one" and "it's OK if most people don't notice the arrow" are completely beside my point. And I won't let this go because I'm trying to counterbalance all the "ohmmm, the arrow is divine, ohmmm" delusion that I constantly run into.</p>
      <p>&gt; they are just fooling themselves</p>
      <p>1) Which can influence their own work negatively.<br>
      2) The people who put such an arrow there are also fooling the client.</p>
      <p>&gt; Why do you care about the chatter of the GD?</p>
      <p>The material side of me cares because graphic designers buy fonts, and it's harder to sell them my fonts since there's a mismatch in the characterization of useful subtlety. The ideological side of me cares because it hates to see deception and delusion, not least of the self (screw the client). So I guess I have two reasons.  :-)</p>
      <p>hhp</p>
