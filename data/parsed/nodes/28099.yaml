    html: |-
      <p>I think this thread has ceded ground to Hrant which needn't be - not just yet anyway. </p>
      <p>I think that he thinks ( I could be wrong) that the arrow is just a token gesture made to be self agrandizing at the expense of the message/client. That the arrow is either a) useless or b) negative in it's impact on the design. </p>
      <p>I don't think there is any basis for supporting these ideas. So why does Hrant think this? A: Maybe he is just utterly type-centric. A sort of type bigot if you will. I can't condem him for that if it's the case. Type is pretty great. But the point is: the opposite feeling is needed in Graphic Design. Type is there to play a role. Sometiomes it's key. Sometimes it ain't. </p>
      <p>I think that instead c) the arrow works for the client.  </p>
      <p>I think the arrow is positive because when someting catches &amp; holds attention it is working for the logo ( as long as the are no negative associations &amp; so on). There are lots of ways of doing this. In the case of the FedEx logo attention is caught by the tension between the immediate resolution of the letterforms as 'FedEx' and then the <em>potential</em> resolution of the arrow. That tension takes time to resolve. So there is more eye-time for the logo. More attention. Put another way the arrow plays the role of a brain/eye magnet. If you resolve the arrow or not isn't the point because it's the tension that holds your eye &amp; so it works. This tension does not dissappear when you have 'seen' the arrow either. You still go back &amp; forth from one recognition to the other. Sort of like the classic old woman and girl image. Except that in the case of the logo the text is clearly dominant whereas in the classic illusion they are balanced.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/fig3_4998.gif"></div><p></p>
