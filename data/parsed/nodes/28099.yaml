      <p>Sometimes while exploring shapes and letterforms during the process of logo design, one can "accidentally" discover forms that contribute meaning -- that is the happy accident I was referring to. Usually they must be refined to reach full potential, just as Leader did with the letterforms.</p>
      <p>I've read all of the links, Hrant, and I still can't help but think that all of this is harmless.</p>
