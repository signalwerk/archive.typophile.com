      <p>Cool, I like it. I just think that you could have used something else instead of "a word". Would be nice to see more letters, not necessarily all animated. Just moving along the edges with the camera is nice; we can see the type from a completely new perspective (and dimension).<br>
      Also, I think the video lacks a "finale". It builds up the expectations but then the end is too quiet. Add some "Carmina Burana" power to it! :)</p>
