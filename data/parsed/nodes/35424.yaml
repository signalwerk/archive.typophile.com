      <p>The video is fun, but it doesn't show off the face as much as a simple image would. </p>
      <p>Also, every page with sound should have a volume control, and it's even more important on pages that play sound immediately. When this page loads it immediately assaults me with very loud sound -- this is because the Flash is set to play at maximum volume (even though my system volume is set very low). Ordinarily when I encounter a page like this I close it quickly, if I don't see a way to pause the video or turn down the volume right away.</p>
