      <p>»(fette) Steinschrift«. There's a couple of digital versions out there. Akzidenz Grotesk Condensed is pretty close, too.</p>
      <p>see <a class="freelinking external" href="http://www.identifont.com/list?3+Neue%20Steinschrift%20OSF+0+IPM+7+IPL+4+IPN+4+4FU+4+EE5+4+GE5+4+G8K+4+CG7+3+A4F+3+8W8+3+1D1+3+G70+3+C3W+3+A3B+3+ABS+3+8RX+2+1WC8+2+I82+2+8V7+2+HTJ+2+KS+2+3M2+2+H1I+2+H1J+2+9C9+2+MK9+2+JEK+2+J42+2+IPT+2+I7D+2" rel="nofollow">here</a>, <a class="freelinking external" href="http://www.typophile.com/node/19482#comment-122177" rel="nofollow">here</a>, and <a class="freelinking external" href="http://new.myfonts.com/fonts/berthold/akzidenz-grotesk-be/bold-condensed/" rel="nofollow">here</a>. Dieter Steffmann has a (non-condensed) fette Steinschrift as a free download <a class="freelinking external" href="http://moorstation.org/typoasis/designers/steffmann/samples/f/fettestein.htm" rel="nofollow">here</a>.</p>
