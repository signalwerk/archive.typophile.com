    html: <p>Thanks lindenhayn, I agree it has a lot of similarities to the early grotesks but riccard0 is correct.  I have been on this for a while... Unless I totally missed something I am quite sure it is sitting in the back of some technical manual or sign painting book that I do not own.  Also has some similarities to early versions of DIN Engschrift if that helps anyone.</p><div class="imageWrap"><img src="http://typophile.com/files/Engschrift_5992.jpg"></div><p></p>
