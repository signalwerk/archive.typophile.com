  html: <p>I was wondering if anyone can ID this font for me.  I see it hidden all over Berlin, always painted by hand, and almost always in pre-war industrial settings.  The letter forms change from sign to sign but the proportions are generally all the same. There is no digital version to my knowledge. Maybe someone can point me to an old industrial sign painting manual?</p>
  html_clean: <p>I was wondering if anyone can ID this font for me.  I see it hidden all over Berlin, always painted by hand, and almost always in pre-war industrial settings.  The letter forms change from sign to sign but the proportions are generally all the same. There is no digital version to my knowledge. Maybe someone can point me to an old industrial sign painting manual?</p>
