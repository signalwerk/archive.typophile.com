    html: <p>The Flickr stream of fellow typophile Nina Stössinger (<a href="http://www.flickr.com/photos/ninastoessinger/" title="http://www.flickr.com/photos/ninastoessinger/">http://www.flickr.com/photos/ninastoessinger/</a>) has scans of some pages of german lettering manuals, while fellow typophile Florian Hardwig's stream (<a href="http://www.flickr.com/photos/hardwig/" title="http://www.flickr.com/photos/hardwig/">http://www.flickr.com/photos/hardwig/</a>) has several examples of berliner lettering.</p>
