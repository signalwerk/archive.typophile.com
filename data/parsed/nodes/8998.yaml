      <p>From Brian Bonislawsky:  <br> <br><br>
      </p><blockquote>
      <hr size="0"><!---quote-!--><b>quote:</b>
      <p>A very nice tattoo, unfortunately not mine.  I would agree with the <br>other posters that it has a Tolkien script/Runic style feel, although <br>those scripts are more open and non repetitive like this script is. <br>Perhaps, however, it is some hand drawn version of Scriptoriums Rheismol <br>- <a href="http://fontcraft.com/scriptorium/arcana/" target="_blank">http://fontcraft.com/scriptorium/arcana/</a>  - as they seem to share <br>pretty similar letterforms, except in a less rigid/more fluid form.<!---/quote-!--><br>
      </p><hr size="0"><!--!-/quote-!--><p></p><!--!-quote-!--></blockquote>
