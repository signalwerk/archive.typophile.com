    html: |-
      <p>You could also use the titl - Titling - feature, though that’s probably not as Kosher as a Stylistic Set, but it would be supported by Illustrator and Photoshop. (Stylistic Sets are presently only supported by InDesign CS2.) </p>
      <p>As long as your alternate ampersand is named “right”, you shouldn’t have problems. The correct form would be ampersand.alt (or ampersand.James, or something like that, but I would stick with .alt.)</p>
      <p>Another alternative might be to have a separate version of the face with the “basic” ampersand changed to the Jamesian ampersand, and use that font for all James quotations.</p>
