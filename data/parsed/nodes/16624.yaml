    html: |-
      <p>Yes, thanks. I was thinking that the appropriate use of sets is</p>
      <p>“Function: In addition to, or instead of, stylistic alternatives of individual glyphs (see ’salt’ feature), some fonts may contain sets of stylistic variant glyphs corresponding to portions of the character set, e.g. multiple variants for lowercase letters in a Latin font.”</p>
      <p>There aren’t going to be multiple variants, but I suppose this is a case of whatever works.</p>
