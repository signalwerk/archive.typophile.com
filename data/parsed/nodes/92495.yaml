      <p>@rs_donsata Ohh yes, that interest is what I'm honing now. I quite like everything, but living in the Poconos sort of limits me to nature shots. As you can imagine, there aren't many cityscapes here in the woods. I did wish I had some access to them, because one of my favorite thing to take pictures of is the city at nightfall. These settings are really what I'm most excited about. I did a brief covering of them back in High School with a film SLR, but it's been so long. I have a basic knowledge, but I'm hoping to improve that by going and renting books from the local library and doing some online research. </p>
