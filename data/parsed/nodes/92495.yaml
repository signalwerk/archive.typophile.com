  html: <p>Hello all! I know photography is pretty popular with creative types (see what I did there?), so I figured I'd start a topic. I just recently got my first DSLR! I'm pretty excited. <a href="http://www.flickr.com/photos/77647883@N04/7114477769/" rel="nofollow">This</a> is the first picture I ever took with it, which wasn't very thought out. It was cold, I felt nervous even holding it (my other camera was a dinky point and shoot), and it was also cold. I mainly just wanted to gawk at the quality. My point and shoot had 5 megapixels, so the same as my iPhone. It was an upgrade of momentous proportions. So, is anyone on here into photography?</p>
