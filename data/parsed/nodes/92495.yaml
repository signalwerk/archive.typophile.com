      <p>My ﬁrst digital camera (RDC-7) cost $1300 in 2001, IIRC, and was 3.3 megapixels.<br>
      It was awesome, especially the close-up feature.<br>
      Now I have a Pentax DSLR, but it is so cumbersome I rarely use it.<br>
      Shooting with an older Pentax in the 1970s was a much better experience.<br>
      It was smaller, lighter, easier to focus, and more responsive.<br>
      It was better designed in general, without the featuritis this new one suffers from.<br>
      I spent a long time looking for a simple but adjustable high-res digital camera, but couldn’t ﬁnd one.<br>
      Is there nothing between point-and-shoot and these over-designed clunkers?</p>
