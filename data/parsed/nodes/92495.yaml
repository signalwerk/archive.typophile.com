      <p>A friend of mine is a professional photographer. He normally doesn't use an UV lens just for protection as he feels each additional lens can degrade the image, but he feels that for an amateur the added protection may be a good tradeoff. </p>
      <p>The tripod rs-donsata mentioned is good advice. There are also telescoping monopods available (one leg); not as stable as a tripod but easier to carry and less obtrusive. A pocket-sized beanbag can also be useful; set it on a rock or railing or whatever and brace your camera against it.</p>
      <p>Nick, I agree with you about the featuritis of new cameras. I've never figured out all the settings of my Nikon;   sometimes I miss the simple Mamiya Sekor I used back in the 1980s.</p>
