      <p>Sorry guys, but if a subject does not interest you, you CAN skip it and don’t react…</p>
      <p>@OT: I know what you experienced: a lot of the joy is in the instruments you use. Even though the experts tell us nowadays that pixels do not count, there is a correlation between pixels, price and lens quality. Always go for the best ‘glass’!</p>
      <p>My GF (who is a pro fashion photographer) has been enamored by the Pentax 6*7 system and shot with these heavy analog cameras for most of her career. I gave her a Sony CyberShot T-model in 2005 and that cinched it: the first series she shot with it (kind of “let’s try it, I have a fall back”) was published in Grazia (Italian magazine), with no one noticing any lack of quality. After that she sold of the Pentax stuff and went all digital.</p>
