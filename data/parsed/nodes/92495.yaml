      <p>When people start into photography the first most common concern is to get a good camera, then many realize it is more important to have a good lens, then some realize it is more important to have good lighting, and then you get old professional photographers toying around with plastic cameras... jejeje.</p>
      <p>My point is that in the end the most important thing is for you to be passionate and to think a lot about the photos you take. That way you will develop an area of interest (landscape, birds, portrait, fashion, abstracts, erotic, candid, textures), a style, technical competence and an eye for it.</p>
      <p>Having a DSLR is a big step, it will help you gain control over your photography. Experiment a lot with speed and aperture. Learn about light. Having a fast lens (F 2.8), a tripod and a polarizing filter are the three greatest additions to a photographer's kit.</p>
      <p>Now I do mostly snapshooting.<br>
      <a href="http://www.flickr.com/photos/hectormunoz/" title="http://www.flickr.com/photos/hectormunoz/">http://www.flickr.com/photos/hectormunoz/</a></p>
