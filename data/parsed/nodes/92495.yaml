      <p>Well if we want to relate this topic to typography, you could use your new camera to document interesting typography in signs, statues, grave markers, house numbers, and so forth. Photos like that get posted at Typophile occasionally.</p>
      <p>You'll find your DSLR to be a big step up from your point-and-shoot camera. I used to be seriously into photography and sometimes did my own darkroom work in the old days, but unfortunately I just don't have as much free time as I used to and my Nikon mostly sits on the shelf. </p>
      <p>Regarding the number of megapixels, it's certainly a consideration but their importance is sometimes overemphasized (unless you're making a lot of big enlargements, in which case they'll make a big difference). But much of the improvement in quality you'll notice in the DSLR is due to the superior quality of the lenses.</p>
