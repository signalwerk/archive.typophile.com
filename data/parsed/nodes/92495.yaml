    html: <p>I agree JamesM. Megapixels definitely aren't everything, but megapixels weren't the only real issue. It was just the quality in general (I know the sensor plays a huge part in that as well). My iPhone takes better pictures, to put that into perspective. Sometimes the shots it took looked kinda neat, like in <a href="http://i392.photobucket.com/albums/pp6/CanwllCorfe/boats_by_canwllcorfe-d2zp4ca-1.jpg" rel="nofollow">this case</a>, which made the scene far more moody than it actually looked, but the quality is obviously quite bad. Then there's the fact that instead of trying to keep everything in focus, I can actually have depth of field now! But one of the biggest things is that I can take night shots now, which is something I've wanted to do for quite some time. I bought a tripod for my point and shoot, thinking that would help. Nope.</p>
