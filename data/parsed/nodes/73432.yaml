    html: |-
      <p>Graphic designers often use the term "cool gray" because we frequently use the Pantone Matching System (PMS) to specify ink colors, and "cool gray" is the term that Pantone uses for grays with no saturation. The PMS system is also built into programs like PhotoShop and InDesign, along with RGB, CMYK, etc.</p>
      <p>For example, "PMS Cool Gray 5" is a solid ink color that's equivalent to a 50% screen of black.</p>
