      <p>My making up a purpose for the design, it makes the job a lot easier. That way can show how you're able to use your abilities and it will actually be a lot easier to come up with something. You don't have to put that much thought into the purpose. For example: you're making a cover for a drinks menu for a gay night club called Mood. Now you can imagine the types of colors used at such a club. What kind of atmosphere it has. What the clientèle would be into. Maybe it's a self titled post rock album by a band called Mood. Maybe a subway poster for Mood jeans.</p>
      <p>Those projects will also show what you can do with Photoshop with the bonus of having focus and showing that you can put your talents to use.</p>
      <p>As for the design you showed:<br>
      The spraypaint splatter thing has been over for many years and you used dead gray (zero saturation). Never, ever use dead gray.<br>
      Even though it feels like the design is attempting to be trendy, the palette doesn't seem to correspond to current color trends. If you were going for 1989 retro, the yellow doesn't seem right unless you pair it with purple and maybe teal. It feels like a bunch of colors someone made up in Photoshop, to be honest.<br>
      The way you're using that counterless font feels a bit like 2007.<br>
      Diagonal lines as a decorative element isn't due for a comeback until the 2020s, especially when used with spray paint. Need for Speed Most Wanted used that kind of look in the menu interface in 2006 and it already felt a few years out of date.</p>
