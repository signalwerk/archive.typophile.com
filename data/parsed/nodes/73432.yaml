      <p>&gt; This one has only the objective to be sort of eye pleasing ...</p>
      <p>Pierluigi, thanks for the additional info. But if you're going to make the word "mood" the focal point of the illustration, employers will assume it's an example of what you might draw if they asked you to make an illustration on that subject.  </p>
      <p>I'd suggest making the entire composition say something about "mood". For example, if the mood was "angry", what font would you use, what color would the word be, and what would the background elements be? What if the mood was "happy" or "sad"? Or what if the word was "Moods" (plural), how could you illustration a variety of moods in a single composition?   </p>
      <p>Whatever word or meaning you pick, make sure the composition communicates a strong message or feeling. That will make a much stronger impression with employers. Design isn't about just drawing pretty pictures; it's all about communication.</p>
