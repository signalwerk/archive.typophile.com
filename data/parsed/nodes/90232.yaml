      <p>Hi Gorgoyle,</p>
      <p>I'm no expert, also currently working on my first effort at a typeface :)</p>
      <p>My first impression is that there are some unexpected widths in the uppercase, see /R/S/T/U. What sort of grid did you use?</p>
      <p>The lowercase feels more consistent, although the bottom right corner of the bowl of the /e is bugging me, and I think should be square.</p>
      <p>I can see that you have carried the same corner radius from /D into the /E, but to me it feels like this has reduced its optical width slightly too much.</p>
      <p>Agreed the 2 and 5 need work.</p>
      <p>Good luck with it - I realise how much stamina is required in this process!</p>
