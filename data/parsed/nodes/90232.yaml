    html: |-
      <p>OK I see I need to explain how font is derived, designed, whatever.</p>
      <p>Here:<br>
      <a href="http://i43.tinypic.com/s6k7bs.png" title="http://i43.tinypic.com/s6k7bs.png">http://i43.tinypic.com/s6k7bs.png</a> - Hi res image<br>
      Save in your computer and see better in image viewer!</p>
      <p>Grid: 1000pt hight,<br>
      Capitals: 570pt,<br>
      lowercases: 400pt,<br>
      ascender: 570pt,<br>
      descender: 570pt<br>
      width: how I decide to optically be OK</p>
      <p><a href="http://i39.tinypic.com/amwcar.png" title="http://i39.tinypic.com/amwcar.png">http://i39.tinypic.com/amwcar.png</a></p>
      <p>Also basic idea for font was to be designed pretty and as possible with optical good "look and feel" and to be modular in same time. All glyphs to be modular... but that's impossible, so I got another font project which will be only modular with less optical balance in glyphs design.<br>
      Also basic idea for font is to be "rounded and squared" design, combination of Quad and Circle.</p>
      <p>I agree that X is maybe too narrow. I'll redo when I get some time... now I just posted to explain my font concept and last final version of letters and digits how they are at the moment.</p>
      <p>Idea for Zero was to make it different from Capital O letter, so I had to cut zero to "nothingness". I like both versions of Zero digit but I think uncutted Zero will make much more confusion than it looks nice, so for better functionality is better to pick cutted Zero digit.</p>
