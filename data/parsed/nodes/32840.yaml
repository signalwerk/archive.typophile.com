    <p>This <a href="https://web.archive.org/web/20081007161338/http://www.sfgate.com/cgi-bin/article.cgi?f=/n/a/2007/04/05/entertainment/e112626D88.DTL">AP piece</a>...</p>
    <p>“Today, Helvetica is the most widely distributed typeface in the world, if you discount Arial,” says Otmar Hoefer of German company Linotype, which now owns the design.</p>
    <p>Wonder if he intended to say “if you include Arial” - as surely Times, Verdana or even Comic Sans are more widely distributed?</p>
