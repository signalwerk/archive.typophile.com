    <p>Hi all,</p>
    <p>I've created the new .enc file which covers Latin, Greek, and Cyrillic and others.<br>
    I have three questions about the file and how Fontlab behaves when generating a glyph.</p>
    <p>1. I have smallcaps with the suffix .sc but the Fontlab does not assign Unicodes when I generate them.<br>
    Is there any way to manually assign Unicode values beforehand?</p>
    <p>2. When I generate Cyrillic A with the default encoding tables, Fontlab automatically pastes Latin A to them (which is good for me). However, it doesn't work for my encoding file. Does anybody know how to make it work?</p>
    <p>3. Similar to Q2. When I generate fi ligature or aacute for example, it automatically puts correspondent components. However, it pastes decomposed Latin A when I generate Greek A (I want it as a component). Again, could you tell me how it works and how to change it?</p>
    <p>Thank you.</p>
