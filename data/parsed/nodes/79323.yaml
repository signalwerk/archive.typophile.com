    html: |-
      <p><cite>Is there any way to manually assign Unicode values beforehand?</cite></p>
      <p>There are no unicode values for stuff like small caps. That’s why we process them with suffixes and Opentype Scripts. But yes, you can encode unicode points and names in the encoding file. Read the manual or look at the included encoding files.</p>
      <p><cite>However, it doesn't work for my encoding file. Does anybody know how to make it work?</cite></p>
      <p>You probably need to make sure that your encoding file is using the same names Fontlab is checking for in aliases.dat. Or edit aliases.dat. Again, read the manual (or just look at the file, the syntax is fairly obvious).</p>
