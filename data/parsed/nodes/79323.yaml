    html: |-
      <p>IPA small cap glyphs are used in a specific linguistic context and thus earned their Unicode slots. Ordinary typographic small caps are considered stylistic variants and therefore not granted separate Unicode positions. IPA small caps are also likely to be designed differently than the normal variety, as they are meant to harmonize among lowercase letters rather than as whole words or sentences on their own.</p>
      <p>Adobe used to assign small caps to a portion of the Public Use Area, but that practice has been deprecated.</p>
