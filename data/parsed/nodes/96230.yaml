      <p>Most of them -if not all- look like custom lettering, not fonts: if you look at the same letters (/a's, e's, l's, O's) they are all different.</p>
      <p>"elastica" Similar: <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Berthold&amp;ffam=Brush%20BQ%20-%20Regular&amp;fid=8b9a6615e5548f889ddd9de161c44b24&amp;fstyle=i&amp;fsize=60&amp;text=elastica&amp;fit=1" rel="nofollow">Brush BQ</a></strong> by Berthold</p>
      <p>"Dirty Looks" similar: <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Linotype&amp;ffam=Smack%20LET%20-%20Plain&amp;fid=3adf5a1a1b65726a386825be7420f996&amp;fsize=60&amp;text=Dirty%20Looks&amp;fit=1" rel="nofollow">Smack LET</a></strong> or <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Linotype&amp;ffam=Ruach%20LET%20-%20Plain&amp;fid=38516a3373a245a4615ce8d2a680dcb1&amp;fstyle=i&amp;fsize=60&amp;text=Dirty%20Looks&amp;fit=1" rel="nofollow">Ruach LET</a></strong></p>
      <p>"SCANDAL" similar: <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Google-Web-Fonts&amp;ffam=Permanent%20Marker%20-%20Regular&amp;fid=6e5dfd5d33820344a5e284fe5bc66afe&amp;fstyle=i&amp;fsize=60&amp;text=Scandal&amp;fit=1" rel="nofollow">Permanent Marker</a></strong> by Font Diner (Google Web Fonts)</p>
