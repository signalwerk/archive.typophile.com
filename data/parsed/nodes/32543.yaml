    <p>I was wondering if anyone recognized the type used in the Day of Silence logo, available at (available at <a href="http://dayofsilence.org/img/top_right.jpg" title="http://dayofsilence.org/img/top_right.jpg">http://dayofsilence.org/img/top_right.jpg</a> ).  I feel like I’ve seen that S, here, before, but can’t seem to find the post.  It’s close to Adigo-Bold Two ( <a href="http://www.myfonts.com/fonts/primetype/adigo/bold-two/" title="http://www.myfonts.com/fonts/primetype/adigo/bold-two/">http://www.myfonts.com/fonts/primetype/adigo/bold-two/</a> ), but the S and Y are wrong.</p>
    <p>Thanks,<br>
    Andrew</p>
