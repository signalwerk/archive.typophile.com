      <p>In the case you cite, there isn't any logic to it, but the explanation that it's an accident makes sense.</p>
      <p>Certainly companies selling software sometimes give away older versions of the program for free because the features are no longer competitive, and it will get people interested in getting the current version.</p>
      <p>With fonts, it is seldom that there would be a comparable value increase in a newer version, but it's certainly possible that the difference between the old version and the new version might be the same as that between a 'basic' version and a 'pro' version, and the pricing could reflect that.</p>
