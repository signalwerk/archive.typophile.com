    <p>I'm a bit curious if there is a business logic to a designer selling older versions of their fonts rather than their newest version. Of particular note is Canada Type. Today, as an example, Fonts.com updated the Canada Type library, but a substantial number of the typefaces being sold are older versions, such as Trump Gothic and Dutch Mediaeval, which now is version 2, with 886 characters, but on Fonts.com, youworkforthem.com, and fontbros.com, what is being sold is version 1 with 600 characters. Fonts.com &amp; youworkforthem character info tables:<br>
    <a href="http://www.fonts.com/font/canada-type/dutch-mediaeval/regular" title="http://www.fonts.com/font/canada-type/dutch-mediaeval/regular">http://www.fonts.com/font/canada-type/dutch-mediaeval/regular</a><br>
    <a href="https://www.youworkforthem.com/font/T0198/dutch-mediaeval" title="https://www.youworkforthem.com/font/T0198/dutch-mediaeval">https://www.youworkforthem.com/font/T0198/dutch-mediaeval</a></p>
    <p>I've actually emailed Canada Type, and their excuse was that it was the distributors fault. But 3 different distributors selling the same old fonts just doesn't make a great deal of sense to me. </p>
    <p>I'm not trying to pick on Canada Type, they certainly are not the only foundries to sell older versions of their fonts (FontBureau and Elsner+Flake also sell older versions of their fonts via distributors such as fonts.com, etc.) </p>
    <p>Is there some business logic for this?</p>
