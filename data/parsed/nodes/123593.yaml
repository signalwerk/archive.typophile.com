      <p>I can’t speak for other foundries, but as a general answer: if you have a lot of fonts and sell them through a lot of channels, updates take a reeeeeally long time. There are usually no automated processes for that. It’s all arranged manually with each reseller. That takes time. And if you push out your 2.0 release and customers downloading it find a new bug, you need to start all over again for the 2.0.1 release. So it isn’t surprising that foundries either postpone the reseller updates, or just don’t do them at all and keep the older versions there which have shown to work without problems.<br>
      If you find that you have an older version from a reseller, just email the foundry and they will usually send you the update.</p>
