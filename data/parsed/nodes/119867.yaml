    <p>Hello Everyone,<br>
    I have been a member of Typophile for a long time now and wanted to promoted my typographic artwork on this forum. Please let me know what you think of it and it's concept.</p>
    <p>I design the visible relationship between typeface, landscape and culture (architecture, philosophy, art movements, politics).</p>
    <p>Typography is to visual language as maps are to topography.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Ferrybuilding_Fnt_5578.jpg"></div><br>
    I am a pioneer in the land of topographic typography ( Check my work out <a href="https://www.kickstarter.com/projects/omarsandoval/topographic-typographyworld-geography-thru-visual" title="https://www.kickstarter.com/projects/omarsandoval/topographic-typographyworld-geography-thru-visual">https://www.kickstarter.com/projects/omarsandoval/topographic-typography...</a> ). I seek to shed light on typeface design, to generate insight, and to delight by setting my favorite cities in a face whose historical echoes and associations that harmonize with the forms they belong to. I paint by numbers, letter forms, and a palette of analphabetic symbols that have the same character, spirit and personality of each location.<p></p>
    <p>Topography: originated in ancient Greece as the description of a place (topos, "place" and graphia,"writing"). This meaning is less common in America where it is synonymous with relief and elevation contour drawings. (Wikipedia)</p>
    <p>Typography: also originated in Greece (typos, "form" and graphia, "writing").</p>
    <p>Historical Interlude.</p>
    <p>Typographic history mirrors topography such that it is the study of the  relationships of human culture: politics, philosophy (structuralism, post-structuralism), architecture, and art movements (Renaissance, Baroque, Neoclassical, Romanticism, Realism, Geometric Modernism, Lyrical Modernism and Post Modernism).</p>
    <p>I believe Typography is architecture on a page; typefaces are buildings, leading floors, columns walls, tracking rooms, kerning furniture, letter forms bricks and the grid mortar.</p>
