    html: |-
      <p>I am working on a technical looking typeface called ISOGLYPH.</p>
      <p>Website:<br>
      <a href="http://www.fontgroup.com/isoglyph/" title="http://www.fontgroup.com/isoglyph/">http://www.fontgroup.com/isoglyph/</a><br>
      Datasheet:<br>
      <a href="http://www.futureparc.com/fontgroup/pdfs/FontGroup_ISOGLYPH_Specimen.pdf" title="http://www.futureparc.com/fontgroup/pdfs/FontGroup_ISOGLYPH_Specimen.pdf">http://www.futureparc.com/fontgroup/pdfs/FontGroup_ISOGLYPH_Specimen.pdf</a></p>
      <p>I am not German per-se, but am an admirer of the Modern German aesthetic.<br>
      The attitude of ISOGLYPH is about humanising the somewhat geometric forms of DIN and ISONORM whilst retaining the performance (high words per line ratio) and open letterforms for clarity of type used at small sizes and for signage.It is designed so it can also be used as text.<br>
      Current font is bold in nature to be able to accomplish the above and has a thinner Titling Alternative inside the OTF.<br>
      Contact me direct if you are interested.</p>
      <p>Michael Hernan</p>
