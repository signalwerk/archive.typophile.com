    html: "<p>It's pretty tricky, especially if all the entry isn't there as you have it, ie it goes: <br> <br>1 Jared <br>2 <a href=\"mailto:Benson@.\">Benson@..</a>. <br>3 hello <br> <br>or <br> <br>1 jared <br>3 hello <br> <br>or if it's in a different order. <br> <br>I would personally go down the route of creating a calc field, trying to delimit that data appropriately, then export it and import to a new database - perhaps use a relationship/lookup to populate fields in the old database. <br> <br>FM's text processing is pretty poor, so don't bother yourself trying to script it to parse text. <br> <br>You could try it via AppleScript, but I think the calc method would be better.</p>"
    html_clean: "<p>It's pretty tricky, especially if all the entry isn't there as you have it, ie it goes: <br> <br>1 Jared <br>2 <a href=\"mailto:Benson@.\">Benson@..</a>. <br>3 hello <br> <br>or <br> <br>1 jared <br>3 hello <br> <br>or if it's in a different order. <br> <br>I would personally go down the route of creating a calc field, trying to delimit that data appropriately, then export it and import to a new database - perhaps use a relationship/lookup to populate fields in the old database. <br> <br>FM's text processing is pretty poor, so don't bother yourself trying to script it to parse text. <br> <br>You could try it via AppleScript, but I think the calc method would be better.</p>"
