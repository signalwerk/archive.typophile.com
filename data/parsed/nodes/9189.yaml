  html: "<p>What filemaker gurus do we have here? Does anyone want to help us streamline our Typophile back-end database? <br> <br>I need to know how to use Filemaker to parse text out of one field into multiple fields, as shown: <br> <br>A field containing: <br> <br>1. Jared Benson <br>2. <a href=\"mailto:benson@typophile.com\">benson@typophile.com</a> <br>3. Hello <br> <br>Would parse into: (field names are shown in bracketts) <br> <br>[Firstname] Jared <br>[Lastname] Benson <br>[Email] <a href=\"mailto:benson@typophile.com\">benson@typophile.com</a> <br>[Quote] hello <br> <br>It would seem that there'd be a way to select text between \"1.\" and \"2.\" and then use the Copy/Paste scripts to paste into the appropriate field.  <br> <br>Any help?</p>"
  html_clean: "<p>What filemaker gurus do we have here? Does anyone want to help us streamline our Typophile back-end database? <br> <br>I need to know how to use Filemaker to parse text out of one field into multiple fields, as shown: <br> <br>A field containing: <br> <br>1. Jared Benson <br>2. <a href=\"mailto:benson@typophile.com\">benson@typophile.com</a> <br>3. Hello <br> <br>Would parse into: (field names are shown in bracketts) <br> <br>[Firstname] Jared <br>[Lastname] Benson <br>[Email] <a href=\"mailto:benson@typophile.com\">benson@typophile.com</a> <br>[Quote] hello <br> <br>It would seem that there'd be a way to select text between \"1.\" and \"2.\" and then use the Copy/Paste scripts to paste into the appropriate field.  <br> <br>Any help?</p>"
