    <p>EAU CLAIRE, WI – November 16, 2006 Font Diner, Inc. (<a href="http://www.fontdiner.com" title="www.fontdiner.com">www.fontdiner.com</a>), a leading retro typography design firm, has announced the revival of the historic Filmotype, Inc. font library created in the 1950s and 1960's. </p>
    <p>Filmotype initially manufactured a simple manual phototype machine utilizing display typeface designs on 2-inch filmstrips. Additional films were sold to start-up typesetting companies in order to increase their product selection. Font Diner will create new digital versions of the Filmotype collection, recreating it to meet today's graphic design standards.</p>
    <p>Stuart Sandler, President of Font Diner, Inc., intends to release the Filmotype library in OpenType format so the original designs can be fully realized with a dynamic feature set including alternate glyph forms and automatic substitutive ligatures. "We are pleased and proud to reintroduce this unique font collection to an entirely new generation of graphic designers," says Sandler.</p>
    <p>"I have seen a disturbing trend in our typeface design industry," he notes, "as more fonts are being poorly digitized from vintage specimen showings. I believe it is important to protect and preserve the future of this historically important collection, numbering well over 500 unique designs."</p>
    <p>Graphic designers and the worldwide font community can order the newly designed typefaces at: <a href="http://www.filmotype.com" title="www.filmotype.com">www.filmotype.com</a>. An illustrated history of the classic Filmotype brand has been carefully researched and is currently being written by Sandler. His work will accurately re-tell the evolution of the Filmotype Corporation, its founders and the significant contribution of Filmotype™ to the typographic industry.</p>
    <p>Font Diner, Inc.</p>
    <p>Stuart Sandler launched the Font Diner (<a href="http://www.fontdiner.com" title="www.fontdiner.com">www.fontdiner.com</a>) foundry in 1996 and has become a major resource for retro design software products. He has created more than 400 original typefaces for the graphic design industry and established a reputation as the premier retro display typography designer inspired by 1950s popular culture. Sandler added a second division to the Font Diner umbrella in 2004 (<a href="http://www.misterretro.com" title="www.misterretro.com">www.misterretro.com</a>) that features Machine Wash Image Filters™ and Snappy Hour™ vector images. Earlier this year he expanded his corporation again thru a joint venture as publisher of high quality display typefaces (<a href="http://www.fontbros.com" title="www.fontbros.com">www.fontbros.com</a>). Filmotype is a trademark of Font Diner, Inc.</p>
