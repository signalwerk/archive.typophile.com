    <p>I once read an article that had a relatively small list of words one should never hyphenate. The hyphenated word became two entities so far removed from the topic that they should be avoided at all costs.</p>
    <p>Anyone know that article?</p>
    <p>What words can you think of that would fit this bill?</p>
