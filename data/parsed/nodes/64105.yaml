      <p>The classic example of a word presenting a hazard in hyphenation is "therapist".</p>
      <p>In Don's story, it may have been the traditional Jewish way to censor "G-d", and the system used the present hyphen as a line break. An en dash might be more appropriate, but I imagine it wouldn't prevent the problem!</p>
