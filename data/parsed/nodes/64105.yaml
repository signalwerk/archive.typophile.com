    date: 2009-11-11T19:40:00
    date_raw: 11 November 2009 - 7:40pm
    votes: 0
    html: <p>I know this is off-topic since the words can be hyphenated, but the "hyphenation routines" in some computer systems have given a few real howlers. My wife reported "cow-orker" (for co-worker) long ago, and InDesign gave her sono-fabitch, in a book written, apparently, by one of Wyatt Earp's descendants. A "cow orker" sounds a bit gross, but "sono fabitch" has a nice sound.</p>
