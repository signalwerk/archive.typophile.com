    <p>It’s <a class="freelinking external" href="http://www.typecon.com" rel="nofollow">TypeCon Week</a>, which in the land of type geeks, means days and nights filled with typographic inspiration, scholarship and debauchery. Unless, like me, you’re not going to TypeCon this year. As my social media feeds fill with the hashtags, the inevitable filtered shots of Portland signage and the local typographic faux-pas, I’ll be watching enviously and refreshing my browser incessantly from the sidelines. For those of you who are about to embark on your TypeCon voyage, here is some unsolicited advice on what to do (and not to do) from a six-time offender.</p>
    <p><em>On what to pack</em></p>
    <p>DO: Pack a sweater. The temperature of the hotel conference hall is inversely proportional to the number of ampersand tattoos in the room. Bonus points if it’s a <a class="freelinking external" href="http://marketplace.veer.com/merch/Kern-Zip-up-VPR0001260" rel="nofollow">KERN zip-up</a>.  </p>
    <p>DON’T: Pack pajamas. I’m pretty sure that sleep is not a part of the full TypeCon experience, so you won’t really be needing them. If parenting has taught me anything, it’s this: sleep is an optional activity in life and at TypeCon.</p>
    <p><em>On how to make friends</em></p>
    <p>DO: Hang out in the hotel lobby or bar to make friends. If you don’t know anyone at TypeCon, just listen for the folks foaming at the mouth about <a class="freelinking external" href="http://en.wikipedia.org/wiki/William_Addison_Dwiggins" rel="nofollow">W.A. Dwiggins</a> and mumble something about the tension of the curves in Electra. You'll have yourself some instant BFFs.</p>
    <p>DON’T: Spend every break / lunch hour face-down buried in your phone thumbing through tweets. Starting a conversation with a random stranger is totally awkward but it’s in PORTLAND. This is your chance to MAKE IT WEIRD.</p>
    <p><em>On presentation attendance</em></p>
    <p>DO: Wake up early — oh wait, you didn’t really sleep, right? TypeCon organizers tend to cluster interesting presentations in the early morning hours, so set that alarm, inject some caffeine into your bloodstream and grab a seat up front. </p>
    <p>DON’T: Skip out on late afternoons or Sunday. Let’s face it: everyone needs a break now and then but don’t make the mistake of missing some quality presentations either. Take advantage of those well-timed coffee breaks and the luxuriously long lunchtimes to get some fresh air, check out the city and let your loved ones know you’re alive.</p>
    <p><em>On deciding where to eat</em></p>
    <p>DO: Eat lunch and dinner with other attendees. Some of the strongest relationships forged at TypeCon happen over food and drink. Find some folks in the lobby who look indecisive, check out the <a class="freelinking external" href="http://www.typecon.com/download/typecon_restaurant_guide_2013.pdf" rel="nofollow">TypeCon restaurant guide</a> and ask to join them. Most people at TypeCon are overwhelmingly friendly. And hungry.</p>
    <p>DON’T: Skip a meal before the Type Quiz / Saturday night festivities. Just trust me on that one. </p>
    <p><em>On signing up for the Type Crit</em></p>
    <p>DO: Sign up for the Type Crit on Sunday. One of the highlights of my first TypeCon (2004) was the crit with John Downer, Akira Kobayashi, and Matthew Carter. I was a young grad student new to type design and knew *no one* at TypeCon before I got there. They were all extremely graceful and the experience proved to be highly useful, even if my stomach was in my throat while showing my in-progress work. That’s what crits are for.</p>
    <p>DON’T: Wimp out. You’ll regret not trying. Also, don’t steal the Type Crit sign. Not cool. </p>
    <p>For those of you not attending this year, how do you survive the week? Live precariously through the <a href="/wiki/https%3A/%252Ftwitter.com/search%3Fq%3D%2523typecon" class="freelinking" rel="nofollow">hashtag</a>? Watch Helvetica on Netflix? Cry into your pillow at night? </p>
    <p>Happy week, TypeCon! Make me jealous that I’m not there.</p>
