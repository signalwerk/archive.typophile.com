      <p>Go to your favorite non-profit and ask if they have a project you can do pro-bono. Make sure they undersand you're doing it on your own time-line, so you have time to experiment &amp; make mistakes. Once you get it done, you have (a) experience, (b) a nice warm feeling, and (c) a decent tax-deduction if you fill out the paperwork correctly. (You can get the tax break in the States, anyway. No idea if (c) applies in Oz)</p>
