    <p>Hi, </p>
    <p>I have been designing for a few years now and have recently started using InDesign CS2 which from what I know about it is a great program, with a lot of untapped potential.<br>
    I really want to get to know this program thoroughly but am restricted in the jobs I have been working on.<br>
    I have always have a love and I feel an eye for typography and sensibilities of type but feel slightly restricted in what I know about this program.<br>
    I am after adivce from anyone on great ways to learn InDesign, to work in it as quickly and proficiently as possible.<br>
    Maybe if I had a project like say and annual report I would get a good grasp on things because I have to but at the moment I have basically been working on ads and low page number documents.<br>
    I hope I have made some sense hear. I really want to take this program seriously as I think it is the major tool in<br>
    my career as a designer.<br>
    I would love to here anyones experienced advice or anything that they think may help. I am in Australia if anyone knows of great short courses etc.</p>
