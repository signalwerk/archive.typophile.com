      <p>The best book I've seen for getting up to speed on using InDesign as a production tool is Olav Kvern &amp; David Blatner's <cite>Real World InDesign CS</cite>. It's missing the new features in CS 2, but its emphasis on real-world use has been invaluable for me. Its chapter on InDesign's typographical features is short but thorough, and that, at least, hasn't changed much between the last two versions.</p>
      <p>It also explains how to design long-form documents in InDesign, but be warned -- although InDesign is better for designing books than Quark XPress (he said understatedly), it's not as powerful as the old FrameMaker or Ventura Publisher were. There are aspects of dealing with books that are pretty unwieldy in InDesign.</p>
    html_clean: |-
