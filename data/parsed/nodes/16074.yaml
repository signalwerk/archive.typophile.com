    html: |-
      <p>I have been using InDesign CS for over a year now, and just recently switched to CS2. I feel I know the text aspects quite well, but I simply haven't touched images and nifty design stuff. </p>
      <p>I started by converting a 24 page saddlestitch book into ID, fiddled with headers and subheaders, etc, then created some pamphlets. Probably real hack jobs, but good for learning. I now edit a 600 page course calendar in InDesign. Frustrating and tedious at times, but that's just the learning process, and it has been well worth the effort. </p>
      <p>Give yourself a project to do in your off time -- replicate the layout of a book you like using the fill feature to create lots of text, and then manipulate. Or find a writer friend and get them to let you layout a story or novella of theirs.</p>
      <p>The only way you're going to figure out how the program works is by trying to do specific things with it, but that's my opinion. You can "know" the functions, but will not be able to work efficiently until you've used them a few times. </p>
      <p>I found following the sample "projects" in books not very helpful, but then, the examples were never geared to the kinds of problems I was having or the work I was doing. I do have a copy of Real World, and refer to it when I'm stuck, but I also find the help menu handy, as well as the Adobe online forums. Generally, I learn best by beating my head against a wall until it clicks. (Just something I enjoy, I guess.)   </p>
      <p>Good luck!<br>
      Kristina</p>
