      <p>I studied with Hiebert for 3 years while he was teaching at CMU (1963-1966) and had a 2 week typography class with Weingart and Hiebert together in 1988.<br>
      I found their teaching to be excellent and their assignments quite valuable.<br>
      When I was a young student at CMU, it took a month to understand what Hiebert was talking about but after I learned enough Basle-Speak, I began to understand. Hiebert, at the time, was an awe-struck disciple of Ruder and Hofmann.  When I saw him again in the late 80s, he had become much more himself. I would say that without a doubt, he was the most influential person for me not only in my design education, but in my design career.  </p>
      <p>ChrisL</p>
