      <p>"Maybe it’s not the fault of the publishers or the schools???"</p>
      <p>I would speculate that much of the bad type we see is not done by trained designers. When Desktop Publishing came in 20 years ago, the typesetting craftsman began to be replaced by some folks who learned how to use PageMaker and Quark (but didn't understand typography). Many "Three Day Wonder" software courses are available today so I am sure the old typesetting craft with real masters of type are being priced out of the "faster/cheaper" labor market to this day.</p>
      <p>ChrisL</p>
