      <p>Norbert, you <em>are</em> all alone :-)</p>
      <p>As far as actual exercises, I've described a part of one assignment I've given in The Education of a Typographer, under Teaching Typography (compiled by Claire Hartten), and have another I've revised with Ilene Strizver for her forthcoming edition of Type Rules!. The first is an exploration of forms and counterforms (for the design of a 2- or 3-letter monogram), the second is an investigation of readability in terms of typeface, pt. size and line length. </p>
      <p>In another discussion, I suggested the following (more advanced assignment):<br>
      - Can you compare a display design like Big Caslon by Matthew Carter with Carol Twombly's Adobe Caslon, or consider ITC Founders Caslon by Justin Howes and Ed Benguiat's ITC Caslon 224? What are the differences among the designs in terms of letter shapes, rhythm or proportion, stress, and stroke contrast? Where do they borrow from Caslon's types and what do they add or reinterpret? And for what purposes, such as tight setting or lengthly text? </p>
      <p>Putting aside typeface design, how might you teach typographic layout? I know some teachers encourage their students to choose the text and format, while others determine both the words and the page size for first semester classes. How might you critique their work, and to what desired result? Are the exercises of Weingart or Hiebert valuable or too personal for students to learn from other teachers?</p>
