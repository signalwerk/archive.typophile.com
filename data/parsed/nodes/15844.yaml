      <p>I'm in a design school RIGHT now, just entered my specialization- w have 2 years of foundation, and 2 and a half years of specialization in design. Last year, in foundation studies, we did a basic course in type and layout. It consisted primarily of understanding, what different types feel like. Can Jokerman be used for the caption of a picture that has a serene tree in it? Things like that. It included taking a quote, and using one typeface, whatever layout we please, as long as the type and the layout re-enforced what the quote meant.</p>
      <p>This semester is completely to type. We just finished 3 weeks of classical type, we created makeshift quill pens, and wrote with reed pens, the quill pens, wrote in rustica, serifs and created a san serif font, wrote in our vernacular scripts (India is a treasure grove of scripts), and developed a matching typeface (to our san-serif) in our vernacular script. It was all about developing sensitivity to detail, and at the same time understanding how it works at a macro level. In our next (present) course, from what I hear, we'll be developing a book of typefaces. I'm not sure what the output is. </p>
      <p>So far, it seems good! If anyone's interested in getting a sneak peek of the final presentation for last week's course on letterform design, it's up on my blog!</p>
