      <p>I'm reviving an old thread here. :)</p>
      <p>I just completed a 3-yr degree two years ago (Bachelor of Design (Visual Communication)), there was only one typography course, aptly named "Typography". I was astounded to find out that it was <cite>an elective</cite> and that many of the design students hadn’t chosen it.</p>
      <p>The course consisted of;</p>
      <p><strong>Typography basics</strong> ~ Anatomy of a typeface, classification and a quick history of typography.</p>
      <p><strong>Typesetting</strong> ~ (most of it by hand) The lecturer was rather old fashioned so we were forced to draw layout mockups by hand (widths by pica measurement). We had to work out how many characters the copy consisted of and use a type specimen sheet accordingly to work out how many characters would fit on a line. We also had to kern/lead by hand which was very time consuming. </p>
      <p><strong>Type design</strong> ~ We had to design an intricate floral initial letter. We were also given the option to digitise it in Illustrator.</p>
      <p><strong>Research</strong> ~ Select a type designer and research the typefaces he/she designed.</p>
      <p>This course went on for only 13 weeks. Do you think this is sufficent education for a graduating graphic designer?</p>
      <p>I think this raises some questions as I know many graphic design degrees in Australia lists typography as an elective course.</p>
