      <p><em>This course went on for only 13 weeks. Do you think this is sufficent education...?</em> and<br>
      <em>...I know many graphic design degrees in Australia lists typography as an elective course.</em></p>
      <p>To put a positive spin on it, some training in typography is better than none...</p>
      <p>Typography as an elective sounds a bit ridiculous for training professionals, but there are plenty of courses that combine type with graphic design. My guess would be that accrediting organizations in various countries have struggled with this, and probably decided to leave it up to the specialists or the institutions. I don't know Australia's system for insuring that a Bachelor's degree has some basis in the area it claims.</p>
      <p>FWIW, walking through one of the larger bookstores in NYC and seeing some of typography books gave me a contrary thought: with all these well-intentioned books on typographic design, why is there so much poor type? Maybe it's not the fault of the publishers or the schools???</p>
