      <p>The typography class at Arizona State University was well done. The first two years were heavy on typography. They started with making a square, rectangle, triangle, and circle of black. Each shape was designed to find optical correctness. </p>
      <p>We also carved lead pencils into chiselled tips and drew lines the first year and the roman alphabet the following year. We made improvements within the context of a form of lorem Ibsom. The letters were organized I H A B E R and so on lending an organization to the design of the alphabet. Designing each letter, space, and kerning. We also designed rustica, uncial, Phoenician, and Greek letters. We were instructed and guided in the design process to make them optically correct. We learned to use the broad tipped pen.</p>
      <p>We designed san serif letters as well with plaka, ruling pens, and brushes. </p>
      <p>These studies are directly out of Swiss practice. My instructors had all worked with Weingart, Armin Hoffman, and such. They also came out of RISD. Rob Roy Kelly taught at ASU until he passed away R.I.P. He gave severe critiques in class with good point. My schools education designed with his strong pedogogical influence:<br>
       <a href="http://www.rit.edu/library/archives/rkelly/html/03_ped/ped_tea1.html" title="http://www.rit.edu/library/archives/rkelly/html/03_ped/ped_tea1.html">http://www.rit.edu/library/archives/rkelly/html/03_ped/ped_tea1.html</a></p>
      <p>If a typographer's education does not have these skills they are definately at a loss.</p>
      <p>We had two classes on graphic design history, a design history class, and constant references to typographic history, ideas, and personas in class. We had several classes where we did research of 30 designers. </p>
      <p>We spent Junior year reading Robert B.'s phenomenal book and taking quizes on it every week. We also read Tufte's works and books on information design and the design process. Our projects were inspired by these works.</p>
      <p>Retrospectively, these studies were definately the most essential studies. </p>
      <p>We learned color correction, how to get your screen and printed results to match, and prepress practices.  We did more than this. I am listing things as I recall them.</p>
      <p>I am amazed at what we covered in 4 years. At the end of it I only had one website design class. I feel that was rather unfortunate in our times. There is only so much time in a day. Believe me, we used it too! I had no free time during those four years. It was intense.</p>
