      <p>Just saw this thread...</p>
      <p>"seeing" -- I think this is the function of experience, combined with education, talent, etc. Can't be directly taught, evolves over time.<br>
      "proof is in the pudding" -- no argument here either, but again you're talking about the end result.</p>
      <p>I'm currently teaching typography to design students, mainly sophomores and juniors. I try to mix a combination of technical foundation skills, aesthetic sensitivity-teaching, and conceptual assignments -- but can't do it all in one semester by any means. So it comes down to what I think is most critical, given previous student learning and the particulars of how departments structure their classes and curriculums.</p>
      <p>Recently I spoke with another typography teacher who pointed out that the pitfall of an overly structured curriculum (all sans serif the first semester, no-justification-only-FL/RR kind of orthodoxy) can be stifling for student growth. But I came out of that appreciating the many kinds of typographic aesthetics, if only through partial resistance.</p>
      <p><strong>My 2 cents</strong><br>
      I vote for technical skills, combined with aesthetics training first. What is leading? Why do you need to control it a point or often fraction at a time for the appearance and function of text type? What are serifs (in some types) and counters in roman typefaces? How do they work? What happens when you change the scale of type from text to display? How does white space interact with typographic layout, etc. I think exercises that teach these, and how to both visualize and execute them are basic Type I kinds of assignments.</p>
      <p>I'm also guilty this semester of not critiquing composition weak spots as much as I might like, in emphasizing grid or page formats for multipage or system applications. It's a trade-off, but in this case they're learning communication, by synthesizing/formalizing their work on the computer so they can present and explaining their ideas to others. That's obviously design, when it's practiced well; and sometimes incomplete gibberish when understood poorly.</p>
