      <p>The good bits are actually in the external links I included in the article, e.g. Clearview. I didn’t want to repeat anything that has already been written. It’s a window to some of the lesser known typefaces used in applications some might take for granted. I did not mean it to be some kind of scientific paper.</p>
      <p>Any typeface is a good typeface as long as it can be used effectively somewhere. I despise wannabe type experts who make childish claims like “Arial sucks”, “Who uses Rotis?”, “avoid Helvetica”. They obviously have no clue to make such fashionable comments.</p>
      <p>Anyway it’s my first post in these boards so I thought I start off with a bit of contribution. Sorry if wasn’t to your liking.</p>
