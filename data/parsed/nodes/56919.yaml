      <p><cite>Typefaces like ClearView and Interstate can work beautifully for road signs but will not work so good at for instance hospital wayfinding. Therefore it is difficult to compile a list of typefaces that will work under all conditions.</cite></p>
      <p>In which way do you think the type design should differ between traffic signs and hospital signage? Sure there are some specific problems like retroreflectivity of road signs and limited space on hospital wall, but in general I think the problems and solutions are pretty similar. You want the information to be readable as soon as possible, even if the letters are small/far away (which has the same effect). If you have a typeface that achieves this, it should work in almost every signage situation (with a little tweaking of maybe spacing and stroke width).</p>
