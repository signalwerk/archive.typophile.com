      <p><cite>BTW: James, do you know why bright text on dark background is considered “positive” contrast when in comes to traffic signs in the US? Usually in graphic design “positive” and “negative” would be used the other way around. And also in Europe when it comes to traffic signs.</cite></p>
      <p>Ralf,</p>
      <p>When we were first confronted with this terminology we were quite confused. As far as I can tell, from what traffic researchers tell me, is that it has something to do with the number one gets when calculating the reflection of the image. A positive contrast yields a positive number, negative contrast yields a negative number.</p>
      <p>When we were naming the different ClearviewHwy fonts, Phil Garvey, one of the researchers suggested that we use W to indicate White letters, and B to indicate black letters, rather than use Positive or Negative in the actual name.</p>
