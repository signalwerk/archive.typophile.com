      <p>I am not ashamed at all. For the last 2 years I travelled all over Europe to research this topic and to gather my own images. It took me a lot of time and money to collect all those images. If I let AenTan use it, it’s likely gonna get linked and re-blogged by others and soon the source will not even be known anymore. I can’t let this happen and it is my right to do so, whether you like the image or not.<br>
