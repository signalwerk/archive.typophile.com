      <p>@jabez Thanks for the mention, appreciated!</p>
      <p>@AenTan Thank you for creating an article about signage typefaces. When it comes to designing signs using type you must make a difference between its surroundings in which the signs/wayfinding systems will be placed. Typefaces like ClearView and Interstate can work beautifully for road signs but will not work so good at for instance hospital wayfinding. Therefore it is difficult to compile a list of typefaces that will work under all conditions.</p>
      <p>From my findings, these are (some of) the characteristics of a good signage typeface:</p>
      <ul>
      <li>Usage in a clear and straightforward design</li>
      <li>Easy recognizable letterforms</li>
      <li>Large x-height</li>
      <li>Positive letter spacing to enhance the visual appearance</li>
      <li>The typeface includes a package of many different weights</li>
      </ul>
