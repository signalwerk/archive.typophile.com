      <p>There is a limit to how large exterior signage for hospitals, office complexes, etc. can be. These sizes are established by right of ways and city governments. These laws are not generally waved even for hospitals. Highways have only the restricions set by the governing body of the highway which are not answerable to city government or codes.</p>
      <p>The most important consideration between archiectural wayfaring signs and highway signs (beyond scale) is speed. Because you only have a limited amount of time between reading a sign and taking action on a highway, visual distance is much more important. I don’t do 60+ mph in hospital corridors.</p>
