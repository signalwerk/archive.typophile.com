      <p>James, a couple of things. </p>
      <p>First, as I noted, I think other designers can benefit from the superb work what you and Meeker did. The bit I found most interesting, because somewhat surprising, is that a medium weight is more legible at a distance than a bold one. The ’reading’ of more white in the counters is more important than a heavier stroke.</p>
      <p>Second, what is a better example depends on what you want to exemplify. The airport is more like the highway, because the way many—not all—are designed, you need to see signs at greater distances. The hospital less so. That’s why I said it seems to me you have more leeway in a hospital situation—less need for legibility at a distance. </p>
      <p>I once was in the El Paso airport, and its signage is all in FB Eagle Bold or Black, including very bold and eccentric lower case. Somehow in that context it looks Tex-Mex and wonderfully lively and expressive. It is all legible at the distances you need to view it in that small corridor-style airport. But it would be rotten on highway signs.</p>
