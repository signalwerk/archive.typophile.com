      <p>&gt;in general I think the problems and solutions are pretty similar.</p>
      <p>Ralf, I’m surprised you say that. The problem of reading road signs at night is a pretty special problem, not shared by hospital corridors, which are generally well lit, at least in richer countries. </p>
      <p>Reading a sign at night, whether it is reflective or not, is an added problem because of low light. The eye just doesn’t work as well at low light, particularly for older drivers. As I remember this was the main ’brief’ for James M’s Clearview: it had to work better than alternatives at night for older drivers. </p>
      <p>Also in a hospital you can just move closer to a sign. You don’t have to worry about missing an exit, so there isn’t the same degree of demand for clarity at a distance.</p>
      <p>I would think that for hospital signage there would be much more leeway on readability under adverse conditions.</p>
