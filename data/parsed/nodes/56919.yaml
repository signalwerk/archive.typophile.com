      <p>&gt;if there should be different design decisions made for road signs and hospital signs</p>
      <p>Basically, I think the hospital situation is a lot less demanding in some ways, and so has a lot of scope for variety. You’re not flying down the corridor at 60 miles an hour, so you don’t have to make a decision before you get close to the sign. And you’re not looking at the sign with a flashlight at night, at a distance. </p>
      <p>For the specific demands of the highway see the <a class="freelinking-external" href="http://www.nytimes.com/2007/08/12/magazine/12fonts-t.html?pagewanted=1">New York Times article</a> and <a class="freelinking-external" href="http://clearviewhwy.com/ResearchAndDesign/index.php">The Clearview Highway web site</a>. </p>
      <p>I do think there are lessons that can be carried over for other signage from what Meeker &amp; Montalbano did, but I doubt they are really a requirement for successful signage in less demanding situations.</p>
    html_clean: |-
