      <p>You might not be flying down a corridor at 60 mph in a hospital, or airport terminal (a much better example), but you would still want to be able to read a sign at a proper and reasonable distance. Nothing about the research we did had anything to do with speed. It was all about viewing distance. Now if you are traveling at 60 mph and you can read a sign at a greater distance, you will have more time to react, but it is all about increasing the viewing distance.</p>
      <p>What is a more or less demanding situation? I dunno, but some airport terminals I’ve been in are a helluva lot more dangerous than some roads I’ve driven down.</p>
