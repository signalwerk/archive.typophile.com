    votes: null
    html: |-
      <p>I like the new type much better. Nice and clean. The green, IMO, needs to be just a bit darker and richer - less yellow and closer to grass - fall grass, not spring. </p>
      <p>I might try adding the little flag to the first stem of the H; in both the name and the monogram? In the monogram, the crossbar break is distinctive, but it needs refinement. The remainder of the crossbar looks too short, and as a result, the break feels too big. Right now, the space is vibrating rather than reaching over the bridge. </p>
      <p>Some of these issues could be resolved with color -- right now, the green and gray aren't balanced - they're different values. It's not a bad thing, contrast can work well, but I find equal values work best in clean Swiss-style design. It's easier to show you what I mean....in this example, the matching grays are simply desaturated (in photoshop) versions of the corresponding green. I rather like the #5 pair, personally, but all our monitors show slightly different shades -- which is another reason matching values is a good idea.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/colors-golf_5687.jpg"></div><p></p>
