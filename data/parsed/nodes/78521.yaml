    <p>Hello,</p>
    <p>Looking for some feedback on a logo for a new client.</p>
    <p>It's a finnish golfer by the name Henri Lipsanen. The client wanted something simple and I don't have much time to do this so simple it is. He also wanted a monogram of the letters HL and the colours grey and green.</p>
    <p>This is my first version. Some simple type modification of Insignia with a monogram that is supposed to remind you of a golf course.</p>
    <p>Any feedback appreciated.<br>
    Peter</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hl_logo_v1_3416.jpg"></div><p></p>
