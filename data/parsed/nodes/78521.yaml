      <p>Thanks,</p>
      <p>I think the typeface works. Golf is a very disciplined game and that's why I chose a simple sans-serif with some structure and symmetry. To me golf really doesn't say curves and widths variation at all.</p>
      <p>Removed the connections between the letters, which are default on the Insignia typeface.</p>
      <p>Also made a new A and S.</p>
      <p>Added a simpler monogram.</p>
