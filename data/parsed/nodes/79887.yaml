    <p>I collect <a class="freelinking external" href="http://www.katranpress.com/stamps_about.html" rel="nofollow">postage stamps by type designers</a>, and a colleague recently suggested that the artist <a class="freelinking external" href="http://www.childsgallery.com/artist.php?artist_id=1580" rel="nofollow">Bernard Brussel-Smith</a> designed a typeface, but I've not been able to confirm this. I've found <a class="freelinking external" href="http://arago.si.edu/index.asp?con=1&amp;cmd=1&amp;tid=2039175" rel="nofollow">one US stamp he worked on</a>, and I know he did a great deal of lettering, but I've not been able to find reference to his work as a type designer. Is anyone out there able to confirm that he was, in fact, a type designer?</p>
    <p>Many thanks.</p>
  html_clean: |-
    <p>I collect <a class="freelinking external link-external" href="http://www.katranpress.com/stamps_about.html" rel="nofollow">postage stamps by type designers</a>, and a colleague recently suggested that the artist <a class="freelinking external link-external" href="http://www.childsgallery.com/artist.php?artist_id=1580" rel="nofollow">Bernard Brussel-Smith</a> designed a typeface, but I've not been able to confirm this. I've found <a class="freelinking external link-external" href="http://arago.si.edu/index.asp?con=1&amp;cmd=1&amp;tid=2039175" rel="nofollow">one US stamp he worked on</a>, and I know he did a great deal of lettering, but I've not been able to find reference to his work as a type designer. Is anyone out there able to confirm that he was, in fact, a type designer?</p>
    <p>Many thanks.</p>
