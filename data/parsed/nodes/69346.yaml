      <p>I think this is also the font used in the old Nortel logo, but I don't know what it is. Here are some more letters:</p>
      <p><a href="http://www.seeklogo.com/images/N/Northern_Telecom-logo-DD45F26B02-seeklogo.com.gif" title="http://www.seeklogo.com/images/N/Northern_Telecom-logo-DD45F26B02-seeklogo.com.gif">http://www.seeklogo.com/images/N/Northern_Telecom-logo-DD45F26B02-seeklo...</a></p>
      <p>Notice how neither logo contains upper case letters. Perhaps they weren't offered with the font.</p>
      <p>I also started a FontStruction based on this a long time ago. I'd like to find out what this one is as well so I can complete it :-)</p>
      <p> - Lex</p>
