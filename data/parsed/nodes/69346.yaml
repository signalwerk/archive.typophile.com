      <p>I think Florian is right about custom work, although this could surprise us by being a freebie -- geometric 'techno' looks are favorites in that realm.</p>
      <p>Don't know if you are interested in alternatives, but I looked for some single-story techno styles and have some suggestions (without links, sorry, but all at MyFonts): Coconut, Griffin, Honcho, Popgod, Dynamo and Gno.</p>
      <p>- Mike Yanega</p>
