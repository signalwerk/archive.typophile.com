    <p>Hi,</p>
    <p>I am new to this program and I am wondering does anyone have ideas dividing fonts in sets,<br>
    beside regular serif and sans divison.</p>
    <p>I tought dividing it to classical ones ( helvetica, frutiger, univers... for example) and modern ones...</p>
    <p>Anyone have advice and share with us their Suitcase name and way of organizing and naming sets.</p>
    <p>THANKS.</p>
