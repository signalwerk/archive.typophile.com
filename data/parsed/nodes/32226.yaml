    html: |-
      <p>Hi gardenize,</p>
      <p>Our corporation uses Suitcase. Our experience has been that the less fonts loaded in Suitcase, the better. </p>
      <p>We create our sets by project. For instance, when I’m working on a brochure, I create a folder on my hard drive that contains only the fonts used in the brochure and name the folder: brochure fonts. I load that folder into Suitcase, where it becomes a set, and activate it while I’m working on the brochure. When I’m done, I pull the set out and Suitcase is empty (except for system fonts) again.</p>
      <p>The advantage to this method is that all fonts must be deliberately added to a project, rather than automatically opening via Suitcase. This may not be a preferred method for your organization.</p>
      <p>Kristin</p>
