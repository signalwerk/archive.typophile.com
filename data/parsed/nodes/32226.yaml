    html: |-
      <p>I use Font Explorer but it must be similar. My sets are:</p>
      <p>antique/distressed<br>
      calligraphic/uncial<br>
      classic serif w/expert<br>
      condensed - this is both for sans and serif fonts<br>
      cool (this one is way subjective!)<br>
      dingbats<br>
      display/initial caps<br>
      funny<br>
      grunge<br>
      handwriting<br>
      nouveau/deco<br>
      retro (mostly 50s style here)<br>
      sans<br>
      script<br>
      slab<br>
      techno</p>
      <p>I also have a few sets for foundries. But my basic purpose for sets is to browse the categories. Unlike Kristin, I keep all my fonts loaded in Font Explorer so having the sets avoids my needing to scroll thru literally thousands of fonts to find something that grabs me. It took awhile to set all this up but then it’s a snap to maintain - when I add a new font I just dump it into the relevant category(s).</p>
      <p>I used to create job or project sets, but since Font Explorer activates automatically when you open a file, that doesn’t seem necessary anymore.</p>
