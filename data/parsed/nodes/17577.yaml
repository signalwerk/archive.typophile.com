    html: |-
      <p>The font is called Novel Gothic. I have it in an old collection of PhotoLettering fonts that was published in an Expresiv Fonts collection in 1994 by Tiger Direct, Inc.  I suspect it is being circulated on the web under a variety of names.  You can see it in the Dover Solotype Catalog on page 164.</p>
      <p>Precision Type used to carry this font in the Font Company collection. Font Factory (<a href="http://www.fontfactory,com" title="www.fontfactory,com">www.fontfactory,com</a>) now seems to have this collection and asks you to write to them if you are interested.</p>
      <p>- Mike Yanega</p>
