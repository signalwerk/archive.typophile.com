    html: |-
      <p>Seeing as how the Font Factory most certainly does not own the rights to this old typeface, I'll point you to the other versions of Novel Gothic (specifically, Bold) that I'm aware of.</p>
      <p>There's WSI's Trimble, Fontbank's <a href="http://www.buyfonts.com/value_for_money/nonce_bold.htm" target="_blank" rel="nofollow">Nonce Bold</a>, Brendel's <a href="http://www.qbf.de/tceng.htm" target="_blank" rel="nofollow">Napoli Extrabold</a> and Brendel's <a href="http://www.qbf.de/dceng.htm" target="_blank" rel="nofollow">Nimrod</a>.</p>
      <p>WSI's font is likely a ripoff of one of the others. As such, I'll not post a link to it. In any case, only Nimrod is a match for your (as in the original) 'i' and 'g'.</p>
