  html: <p>I have been using an online image creation site for several years, mainly due to their excellent selection of fonts. Well, last month they closed up shop and have left me hanging. I have been using this one font for my company logos and such and need to find it ASAP! They called it Manhattan, but all searches for that name show a totally different font. See and example image at <a href="http://www.cfmagic.com/font/list_new.gif" title="http://www.cfmagic.com/font/list_new.gif">http://www.cfmagic.com/font/list_new.gif</a> and more are available if needed. This very distinctive font uses lots of triangles, like for the dot on the i and the lower slash on the f. Anyway, any help would be great! Thanks in advance!</p>
  html_clean: <p>I have been using an online image creation site for several years, mainly due to their excellent selection of fonts. Well, last month they closed up shop and have left me hanging. I have been using this one font for my company logos and such and need to find it ASAP! They called it Manhattan, but all searches for that name show a totally different font. See and example image at <a href="http://www.cfmagic.com/font/list_new.gif" title="http://www.cfmagic.com/font/list_new.gif" class="link-external">http://www.cfmagic.com/font/list_new.gif</a> and more are available if needed. This very distinctive font uses lots of triangles, like for the dot on the i and the lower slash on the f. Anyway, any help would be great! Thanks in advance!</p>
