      <p>This error generally occurs because the contents of the kern feature lookups overflow the size limit of the GPOS subtable. The way to fix it is to break up the kern feature into a number of smaller subtables. This can be done manually in the feature code, but for best results I recommend licensing Karsten Luecke's excellent <a href="http://www.kltf.de/kltf_otproduction.htm">KLTF Make Kern Feature</a> script, which analyses your kerning data and generates the most efficient kern feature code with appropriate subtable breaks.</p>
      <p>See also <a href="http://www.kltf.de/downloads/KLTF-MakeKernFeature.pdf">http://www.kltf.de/downloads/KLTF-MakeKernFeature.pdf</a></p>
