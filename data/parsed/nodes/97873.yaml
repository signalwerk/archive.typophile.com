      <p>For most of the scripts I work with, contextual kerning is a requirement, not an option. This is even the case in Latin fonts that support GPOS mark positioning. Consider that the kerning of the glyph pair <em>Te</em> is unlikely to be appropriate if the <em>e</em> is carrying a combining mark glyph above it. I'm also mostly working with glyph sets in which class kerning is essential to handle the number of glyphs involved; it isn't unusual for flattened kerning to be &gt;65,000 pairs in one font.</p>
      <p><em>As far as the name, I call it what MS documentation calls it "the kerning table".</em></p>
      <p>Ah, you mean the Kerning table.</p>
