    <p>Hi all,</p>
    <p>I was looking at using Garamond for a project, but then I got so confused by the sheer amount of garamonds out there that I don't know which is the best one to use. I'm looking for a versatile version, that could also work when used in small sizes. What are the pros and cons of the different versions? </p>
    <p>Another question related to this one is: which sans-serif font works well next to garamond? I'm doing a map related project, so possibly a font that can take a beating; by being used in small sizes and still be legible.</p>
    <p>I hope you can help me with this one!</p>
    <p>Thanks, Jeffrey<br>
    <a class="freelinking external" href="http://http://www.infraordinaire.com/wordpress" rel="nofollow">infraordinaire</a></p>
