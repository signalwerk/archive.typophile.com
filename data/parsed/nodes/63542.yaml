      <p>Jeffrey, this matter has been raised before in this forum - you can see a few links to Garamond related threads here: <a href="http://typophile.com/node/12481" title="http://typophile.com/node/12481">http://typophile.com/node/12481</a> (see bottom of page) - keep in mind that there have been dozens of different interpretations of Garamond typefaces.</p>
      <p>As a personal taste, I'd go with Adobe Garamond Pro or Sabon Next, both well done and working digital typefaces.</p>
      <p>But there can also be some interesting alternatives, like Epic <a href="http://www.typetrust.com/font/epic" title="http://www.typetrust.com/font/epic">http://www.typetrust.com/font/epic</a> or Augereau <a href="http://new.myfonts.com/fonts/abramslegacy/augereau/" title="http://new.myfonts.com/fonts/abramslegacy/augereau/">http://new.myfonts.com/fonts/abramslegacy/augereau/</a></p>
      <p>By the way, lists of Garamond-ish typefaces can be found here:</p>
      <p><a href="http://new.myfonts.com/search/garamond/fonts/" title="http://new.myfonts.com/search/garamond/fonts/">http://new.myfonts.com/search/garamond/fonts/</a></p>
      <p><a href="http://www.identifont.com/find?font=garamond&amp;q=Go" title="http://www.identifont.com/find?font=garamond&amp;q=Go">http://www.identifont.com/find?font=garamond&amp;q=Go</a></p>
      <p><a href="http://www.fontshop.com/search/?q=garamond&amp;x=0&amp;y=0" title="http://www.fontshop.com/search/?q=garamond&amp;x=0&amp;y=0">http://www.fontshop.com/search/?q=garamond&amp;x=0&amp;y=0</a></p>
      <p>A sans compatible with Garamond should be a Humanist Sans, I guess. Syntax is the first that comes to mind.</p>
