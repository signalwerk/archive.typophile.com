      <p>I have mixed feelings about Garamond Premier Pro. Yes, it has optical sizes, and yes, it is historically more accurate than Slimbach's previous Garamond (Premier also has a wide range of glyphs and languages). But I find it too delicate, with its very detailed strokes; Garamond Pro seems more "strong" on the page, if you know what I mean (pardon my lack of technical competence). What I like in Premier, instead, is its economy - compare Premier (abobe) with Pro (below), and see how the text block looks more tight in the first paragraph.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/garamond_adobe_5704.jpg"></div><p></p>
    html_clean: |-
