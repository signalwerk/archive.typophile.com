  html: |-
    <p>On the special interest group dealing with Hebrew, there is a topic with most<br>
    of the replies being off-topic! The topic began as a mostly historical review of Hebrew font faces, but was frequently high-jacked by grammarians. There are over 300 replies and<br>
    (to me) about 200 of them are off-topic...</p>
    <p>Is there a way of printing or saving selected replies?<br>
    Mike</p>
