  html: <p>Hello fellow typophiles. Does anyone care to critique this invite I've made for my mother's birthday. It's 210 x 130mm, both sides shown, and I'd like it printed on something like 350gsm uncoated cartridge stock. I looked in foil-blocking, but that's proving too expensive and time-consuming, bearing in mind I need to get these printed ASAP. If anyone knows a way to make it a little special without costing the earth (e.g. metallic pink - that's here favourite colour). Colour used at the moment is Pantone 214, with a tint of its complement which is a process green. Any help would be appreciated. Thanks.</p><div class="imageWrap"><img src="http://typophile.com/files/Birthday_Invite_4341.jpg"></div><p></p>
  html_clean: <p>Hello fellow typophiles. Does anyone care to critique this invite I've made for my mother's birthday. It's 210 x 130mm, both sides shown, and I'd like it printed on something like 350gsm uncoated cartridge stock. I looked in foil-blocking, but that's proving too expensive and time-consuming, bearing in mind I need to get these printed ASAP. If anyone knows a way to make it a little special without costing the earth (e.g. metallic pink - that's here favourite colour). Colour used at the moment is Pantone 214, with a tint of its complement which is a process green. Any help would be appreciated. Thanks.</p><div class="imageWrap"><img src="/files/birthday_invite_4341.jpg"></div><p></p>
