    html: |-
      <p>Overall, I enjoy the design and aesthetic. I think the "is turning" needs some tuning. Make it more simple, and let "Buffy" and "seventy" stand out more. Remove the styling on the "s," make the "r" more normalized (like in "Picture"), and consider turning the "I" back to lowercase, as it's the only instance in the whole design where you're substituting uppercase for lowercase. Also consider moving the swash on the "B" in a bit as it hangs out a little too far, and instead of having the "n" in "seventy" just drooping, try drawing it over to connect to the tail of the "y."</p>
      <p>The back spread looks nice. You could probably reduce the leading on the date/gallery title as well.</p>
