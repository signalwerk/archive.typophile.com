    html: |-
      <p>Actually, the real Times Roman is from Monotype. Linotype's version can most easily be distinguished from it by looking at the shape of the lowercase italic z; the Monotype version has two straight crossbars, the Linotype one has the lower bar curved.</p>
      <p>However, the Linotype version in metal type seemed to me to be just as good in quality as the Monotype version.</p>
      <p>Even the authentic versions from the major foundries, though, don't seem to look exactly like the metal type versions. One reason is that they follow the common practice of being based on very large sizes of the typeface - which was optically scaled.</p>
      <p>The typeface Times Ten might be worth your consideration.</p>
