    <p>Hi, </p>
    <p>I have a question about Times Roman. I read the old history, and the new history of the typeface. I also read that Apple licence the Linotype version of Times, and in addition they licence Times New Roman from Microsoft who in turn licence it from Monotype.</p>
    <p>My question is this: I want to obtain the very best Times. I have an Apple. Is the Times on my Mac the same as the Linotype Times  offered for sale by Linotype? In other words, is the system font 'Times' the same and as high quality as the 'Times offered by the major typeface foundries?</p>
    <p>I know there are other alternatives. I have Lido, Nimbus Roman, and plan to buy Starling. </p>
    <p>But if anyone can point me in the direction of the most beautiful 'Times' [and I realise this is an oxymoron for some, as I've read the forum on the pros and cons of Times] then I'd appreciate it.</p>
    <p>With apologies for loving 'Times' ;-)</p>
    <p>Thank you.</p>
