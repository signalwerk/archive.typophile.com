      <p>Here's what Allan Haley of Monotype told me about Times New Roman:</p>
      <p><cite>The spacing and design of the OpenType version of Times New Roman set at 12 point (and the alphabet length) is virtually identical to 12 point Times New Roman set in metal. There are, of course, differences in individual character-pair spacing in some instances, due to improvements made to the general spacing in OpenType fonts and the addition of kerning pairs not possible in hot metal. Overall, though, the spacing is virtually the same. The two versions clearly color out the same. … If you use the PostScript Windows version of Times New Roman, however, the alphabet length is markedly shorter than the standard Times New Roman – and character designs had to be modified to accommodate the new spacing requirements. This is because the design was forced on to the widths of Times Roman from Linotype (the version that Adobe chose to use). “Times New Roman PS” matches the Linotype character widths and spacing, while just “Times New Roman” is true to the original design.</cite></p>
      <p>In addition to Starling, also look at Tiempos Text and Plantin.</p>
