    <p>Hello Tyophiles.</p>
    <p>I have tried (and failed) to identify the two sans serifs on this Bluenote cover</p>
    <p>the typeface used for the artists names seems similar to Trade or Franklin gothic – but the "G"  is clearly different</p>
    <p>I can't find any match for the the fat bold type..</p>
    <p>Many thanks!  </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/JohnPatton_LetEmRoll_6551.jpg"></div><p></p>
