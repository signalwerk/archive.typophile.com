    html: |-
      <p>For the artists names, I'm probably wrong and even if it sounds weird, I see Arial, distorted a bit. For title, I'd have said something close/like Alternate Gothic but many details are off and mainly /J over curved terminal. Best one I could get is <a class="freelinking external" href="http://www.typography.com/fonts/knockout/overview" rel="nofollow">Knockout</a> (from No. 66 to 68) using the alternate /R (as seen <a class="freelinking external" href="http://www.typography.com/fonts/knockout/characters/knockoutno-68fullfeatherweight" rel="nofollow">here</a>). Still searching.</p>
      <p>EDIT: Seeing now Kevin took the same track with Knockout so probably not so bad. But nothing about Arial...</p>
