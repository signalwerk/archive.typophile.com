      <p>Alternate Gothic is a good modern revival of this style.</p>
      <p>Closest matches I can come up with are:</p>
      <p><a href="http://www.fontbureau.com/fonts/Vonness/" title="http://www.fontbureau.com/fonts/Vonness/">http://www.fontbureau.com/fonts/Vonness/</a> [you'd have to edit the angled terminals]<br>
      <a href="https://commercialtype.com/typefaces/giorgio/sans" title="https://commercialtype.com/typefaces/giorgio/sans">https://commercialtype.com/typefaces/giorgio/sans</a> [Heavy; edit the spur on the G]<br>
      <a href="http://www.typography.com/fonts/knockout/styles/" title="http://www.typography.com/fonts/knockout/styles/">http://www.typography.com/fonts/knockout/styles/</a> [68 Full Featherweight; edit the R]</p>
