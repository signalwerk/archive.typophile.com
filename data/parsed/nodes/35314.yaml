    html: <p>I am wrapping up my second design internship, and in my previous career I had interns of my own. From what I can tell, most internships are not great, nor are they very interesting, but that’s not the point. At the most basic level, and internship is just a window into the working world, especially the white-collar office world, for kids who would otherwise have no job experience save retail and restaurants. By bringing interns in businesses are doing a favor as much to other businesses as they are to interns, because it creates a large pool of young workers who will not show up for the first day of work and be completely clueless.</p>
