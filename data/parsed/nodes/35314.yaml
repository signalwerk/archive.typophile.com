      <p>I just finished an alright internship. I live in Toronto and it’s almost impossible to get hired right out of school. I think agencies are nervous to hire noobs in case they can’t handle the stress. There are almost no paid internships here. Only one of my peers from school is getting paid in hers, and she had to move to newfoundland for 3 months.</p>
      <p>Honestly I was a little annoyed near the end at not getting paid. I was lucky to be in a shop where they let me do real work and pitch to clients. Until I started winning the accounts, and made my agency thousands of dollars which I saw none of. I don’t think I’m hot stuff or anything, but it would have been nice to have a little tiny bit of compensation. I didn’t really need the first time real world experience since I freelanced through school, I needed to put an internship on my resume which impressed real employers and got me several good offers. So all and all it was okay. </p>
      <p>When I grow up and have my own agency I will pay the interns.</p>
