      <p>I went to a part time design school, where the idea was, that one should work (paid, but not very well) at the same time. So it was lessons in the morning, late to work for 6-8 hours (in my case first window displays and shop ads in a department store and later in an advertising agency, cut and paste daily ads, a regular entry job back then), then back home to do the school homework till late. It was very educational but hard, no worries about what to do with the non-existant free time.</p>
      <p>I find a system where you work unpaid unbelievable. I doubt whether anyone would agree on working for free in Finland (not counting in charities and voluntary work here).</p>
