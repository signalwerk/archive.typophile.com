      <p>I had a fantastic internship and am often (justifiedly) suspicious of folks in our trade who have not. I learned far more in two years of actual practice than I did in college, and am very thankful I had that apprenticeship / internship experience.</p>
      <p>Personally, I feel that a true apprenticeship with an experienced typesetter is often a better education than most undergraduate programs can possibly hope to offer. It’s just a sad reality, in what I have seen of undergraduate design education in the United States.</p>
      <p>My own experience was with a blue-collar job printer and typesetter who had ink and machine oil in every pore and knew the ins and outs of every single piece of letterpress or litho equipment in use from the turn of the century to the mid 1980s when I worked with him. He did get cigar ash in the hellbox so my daily chore of distributing all that type was not a pleasant one, but he was a helluva guy and an inspiration to me. It wasn’t until I took a class or two with typographer and pressman Lee Engdahl many years later than I met someone else who inspired me the same way.</p>
      <p>I was lucky enough to be very young - still in high school - during this time, and living with my parents, but I can understand it would be a big risk to go without pay for a period long enough to have some value. However, if young people interested in book arts have the opportunity to study with folks like Lee, Jim Sherraden at Hatch, Peter Koch, David Goines, the folks at Arion or Yolla Bolly, etc. - I say live like a monk and do it, as you’ll have skills that nobody else of your generation will have, and you will be much in demand for them throughout your life.</p>
      <p>Joshua</p>
