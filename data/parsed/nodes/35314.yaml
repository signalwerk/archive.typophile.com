    <p>anyone ever have a great internship?</p>
    <p>Right now I’m interning at a small clothing label I like, and while I like the clothes they make, and the designs they do.....</p>
    <p>I work on various things like linesheets and stuff.  Its really loose and open ended, and too much I think.  I’m going in two days a week, and the other day I went in, sat down to work for two hours, and then left when there wasn’t anything else to do.</p>
    <p>I really like the guy who runs the brand, but I’m not too inspired or influenced by the designers I’m actually working with?</p>
    <p>I’m not getting paid, and sometimes, I just ask myself, what am I doing?</p>
    <p>Am I mistaken that there’s awesome internships out there?</p>
    <p>Am I mistaken that structure is overated.</p>
