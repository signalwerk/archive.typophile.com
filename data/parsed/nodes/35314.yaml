      <p>I’m glad to say my 2 internships were interesting, informative, and paid. They were special opportunities that came about due to where I was going to school, and the connections that were made and strengthened during the internships were as important as the technical and workplace experiences I gained. If the recessions of the 90’s hadn’t come along, I might have gone back there to work after graduation.</p>
      <p>One thing that probably looks worthless to a recent grad is the whole aspect of office interaction; professional behavior, I’ve realized, is not necessarily a given even at the most prestigious film studios, ad agencies or publishing houses. And learning to navigate the office politics and to behave professionally are skills you simply can’t pick up in school. So while it might seem dreary to work for peanuts and do uninteresting grunt work, as with anything in life, You get out of it what you put in. </p>
      <p>Ask questions, act interested, keep your eyes open, listen to people talk. Ask yourself questions and see what you find out. One thing everyone likes is initiative, so if there’s nothing going on, ask for more work, see if something on the back burner can get done, organize the library, improve a process, help out any little way. It’s likely to make a good impression.</p>
