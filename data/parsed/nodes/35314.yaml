      <p>Although i am a designer now, my internship was in a painting studio (i have to give a shout out to my mentor, Kent Williams). I can attest that it was one of the most rewarding experiences i ever had. I learned more about design watching him paint for a month, than i did in all of my college education combined.</p>
      <p>I highly disagree that people MUST be monetarily compensated for their work, because education costs SO much more than $14/hour, and for the most part, i think an internship is more valuable than any other type of education. If your internship sucks, at least you know where not to work, which is in itself far more valuable than money.  Dedication to a career or craft isn’t about being a wage slave - if i thought like that i never would have gotten into a creative field! </p>
