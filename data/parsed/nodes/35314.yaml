      <p>I’ve never interned, but... here’s my two cents’ worth:</p>
      <p>You are there to learn, not just work for free. So I think that you will get out of it what you put into it. I don’t think it’s too much of a stretch to say that if you ask people there questions, they will be willing and happy to give you answers. </p>
      <p>If they sent you home early that day, that’s one thing. But if it was your decision to leave early, well, you also could have decided to walk around and ask if you could sit and watch the designers doing their job. Or other workers. You can learn about lots of different jobs there, and get an idea of the bigger picture. You can’t get that kind of knowledge at school, or from books.</p>
      <p>I’ve had to do things I wasn’t too crazy about in my life, but each one of them was an experience that let me gain some knowledge... I’m sorry if I sound like a boring old fart! ;-) Design school was like that, too... What I got out of it was directly proportional to what I gave it.</p>
