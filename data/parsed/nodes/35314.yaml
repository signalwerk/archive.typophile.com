      <p>I generally agree with Paul: work should be paid for. But there’s also there’s a question of when you do your internship (work experience in the UK) and how long for.</p>
      <p>I did 2 weeks in a graphics studio when I was 18, it was in school time and therefore I didn’t expect to be paid (I think they bought me lunch and bus fare). I did a lot more shadowing than actual work, although was pretty annoyed when they never sent me a copy of the leaflet I’d contributed logos to. They were upfront that they couldn’t keep me busy all day and I was encouraged to use their materials and facilities for my own project.</p>
      <p>After university (architecture) I was looking at the TV/film production industry and realised it was a case of working for nothing for many months, possibly a year or two - only an option for those with other ways of keeping themselves afloat. Classmates were doing the same in architecture - admittedly it was a recession - it was assumed if you were keen enough you’d do it and live somehow. I recall one guy working part time as a bricklayer building Phase 1 of a project, and part time drawing Phase 2. Still the same situation, at least in film/TV.</p>
      <p>For me, it all boils down to whether it is really an indefinite junior job or a fixed term educational programme. Junior workers need somewhere to live and food to eat.</p>
