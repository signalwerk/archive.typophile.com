      <p><em>the people who make decisions there do not have that attitude, it’s obvious in their choices.</em></p><em>
      </em><p><em>And that is the nature of the educational beast.</em></p>
      <p>Paul-<br>
      The problem is (in my view) that the nature of the beast has changed recently, because of new pressures to feed the beast.</p>
      <p>Academia is not running most higher education (US or Europe); bottom-line accounting is dictating — to the detriment of education — faculty, curriculae, course offerings and even grading. Since ancient Greece, higher education has held a place separate and above the fray of commerce, but that has changed in recent years. We’ll have to see where we end up.</p>
      <p>As for evilfran’s concerns that we aren’t addressing the question: I think we are <em>precisely</em> addressing the question. But to make it more clear: look for an internship (and it may be this one) where you feel challenged. Look for an internship where you feel you are —despite your inexperience — respected, at least on some level. Look for an internship where the contacts you make and the experience you gain is the most valuable thing you take away from your stint (regardless of pay) and you feel richer for the experience.</p>
