      <p>Sam, let me put Chuck’s sentiment in a bit different way: the complication is that there is more than one customer. One key group of customers in the case of state-supported schools is voters and tax payers, who pay the biggest bill. They want students to come out as responsible and productive citizens. Another set of customers are the parents who pay tuition. Another set are the students. These don’t necessarily want the same things. </p>
      <p>Some students, for example, mainly want to get drunk. Is it then the job of the school to give them free beer?</p>
      <p>In particular the idea that students know best what the curriculum should be is wrong. If they already knew they wouldn’t have to study. </p>
      <p>I have been through the student power protests and arguments in the ’60s. The sound thing is that students should have a voice in college governance, especially in matters affecting student quality of life. But  they should not have a dominant voice, and they should not determine the curriculum. They are only one constituency, and often they don’t know better than the others what is best for the educational mission of the University.</p>
