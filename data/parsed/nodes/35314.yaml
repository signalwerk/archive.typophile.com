      <p>I had a thoroughly enjoyable work experience working with <a href="http://imdb.com/name/nm0354691/">John Halas</a> on a Leonardo da Vinci film – I would be given a brief on a scene and left to design it, sketch, draw up backgrounds and cells, write up dope sheets – the full process of animation with regular discussions and directions (not immediately apparent how useful this was for my subsequent career but the process is very similar). Not everyone in my year had great experiences but the general concensus was that the more effort they put into it the better the result for them, it seems to me you are looking for more than you are prepared to give. If there isn’t anything else to do – look for something yourself, identify an area that you think you can improve on, do some work and ask for a crit or ask to visit a supplier learn how a job progresses from design, artwork, through to print and finishing. (btw I didn’t want inspiration or influence when I was at college –&nbsp;I got it, but I didn’t seek it – put it down to youthful arrogance.)</p>
      <p>Tim</p>
