      <p>Just remember this is home of the entertainment industry. The most “glamorous” and “happiest” place on earth.</p>
      <p>People have no idea what it’s like until they are in it, so it is highly desireable. So you go to Cal Arts and study film with the dream of being a director and you end up being a tech working 80 hour weeks for 2-3 months and then being out of work, sitting in your apartment drinking and thinking about your next big movie.</p>
      <p>Everyone east of the Mississippi goes to NYC to get abused and everyone west comes here, where we are just as “friendly”.</p>
      <p>I don’t think there should be such a thing as an unpaid internship, I think it should be illegal. Of course since Congress started this practice I guess the idea of a law being passed is pretty slim.</p>
      <p>I don’t use interns but I will hire inexperienced designers (school or no school) if I like their porfolio and more importantly, them. They are on “probation” for 3 months, at the end of which they are evaluated and given a performance review. That’s more how I think it should work. </p>
      <p>I feel lucky that I came up before business adopted the insane idea that people should work for free…</p>
      <p>pbc</p>
