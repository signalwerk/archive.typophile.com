    html: |-
      <p>Short Metaflop-update:<br>
      We completed our MetaFont <a class="freelinking external" href="http://www.metaflop.com/metafonts/adjuster" rel="nofollow">Adjuster </a> to T1 (ec-encoding) that covers 256 characters supporting many european languages with latin writing. Thanks to fujito we also embedded a new script mf2outline.py. The script enables us (and everybody that works with Metafont) proper transformations of specific MF drawing modes (draw, fill and penstroke) to outline curves and OTFs. You can get the script here:<br>
      <a href="https://github.com/metaflop/metaflop-www/tree/master/bin" title="https://github.com/metaflop/metaflop-www/tree/master/bin">https://github.com/metaflop/metaflop-www/tree/master/bin</a></p>
