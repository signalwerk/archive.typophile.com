    html: |-
      <p>Wow this looks great! I guess that there was quite a lot of work behind this project.</p>
      <p>Some congratulations:<br>
      - "bespoke" seems to be very well designed with much regard to metaness<br>
      - the modulator is the first kind of GUI I have ever seen for METAFONT</p>
      <p>Some questions:<br>
      - is there a chance for an offline program version of the modulator (please say yes)?<br>
      - is "bespoke" just a side product of the modulator or vice versa or will you develop them both further on?</p>
      <p>Some suggestions:<br>
      - if you are using mf2pt1 you might consider a change to the simpler combination metapost&amp;fontforge. Just look <a href="/wiki/https%3A/%252Fgithub.com/khaledhosny/punk-otf/blob/master/tools/build.py" class="freelinking" rel="nofollow">here</a> how Khaled Hosny used this combination for "Punk Nova" . It should work perfectly for your METAFONT-designs (unfilling may sometimes be problematic but you do not seem to need unfilling commands) (Oh and if you will add kerning you can also use a <a href="/wiki/https%3A/%252Fgithub.com/hanwen/mftrace/blob/master/tfm.py" class="freelinking" rel="nofollow">Python module for the TeX-Font-Metrics</a>)<br>
      - the character "k" of "bespoke" is suboptimal constructed (the forward looking diagonal sometimes begins under the upright stem)<br>
      - consider writing an article in TUGboat, I think many TeX-related people will be interested in your project.</p>
