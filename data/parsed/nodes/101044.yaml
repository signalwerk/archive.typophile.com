    <p><a class="freelinking external" href="http://www.metaflop.com/" rel="nofollow">Metaflop</a> is a web based platform for experimental fonts and type related projects using metafont. metafont is a programming language for creating entire families of fonts from a set of dimensional parameters and outline descriptions.</p>
    <p>The <a class="freelinking external" href="http://www.metaflop.com/modulator" rel="nofollow">Modulator</a> is a GUI to play around with a simple pen based Metafont, lots of fun</p>
