    html: |-
      <p>Hello wei and fujito</p>
      <p>Thanks for putting Metaflop on this forum. And thanks for the inputs. there are still many ideas we haven't realized and worked out properly – including extended ec-glyph range, optical corrections and kernings for our Metafonts. The interface is partly working well but far from being complete. At the moment its for experimental use and works as an application in type education. We hope to get closer to more redefined fonts (with keeping maximum metaness) and interface.</p>
      <blockquote><p>Some questions:<br>
      - is there a chance for an offline program version of the modulator (please say yes)?</p></blockquote>
      <p>We have no plans for the near future to create an offline application of Metaflop. It would be too much work to reimplement the server and browser-part as we have it at the moment. Further considerations are also:<br>
      1. which platform should be targeted first<br>
      2. we can reach a wider audience with the online version<br>
      3. a web application has many advantages: easy application updates, platform independence, no installation required...</p>
      <blockquote><p>- is "bespoke" just a side product of the modulator or vice versa or will you develop them both further on?</p></blockquote>
      <p>MF Bespoke and the modulator were developed simultaneously. Metafont as an early and existing parametric type system needed a GUI. A second font MF Adjuster was added a bit later. We would be happy to make the modulator more independent and publish other Metafonts on it.</p>
      <blockquote><p>Some suggestions:<br>
      - if you are using mf2pt1 you might consider a change to the simpler combination metapost&amp;fontforge. Just look here how Khaled Hosny used this combination for "Punk Nova" . It should work perfectly for your METAFONT-designs (unfilling may sometimes be problematic but you do not seem to need unfilling commands) (Oh and if you will add kerning you can also use a Python module for the TeX-Font-Metrics)</p></blockquote>
      <p>Thanks a lot! We don't use unfill in Bespoke or Adjuster. The current fonts work with "penstroke/penpos" or "draw". We'll definitely have a look at the proposal and consider it for further adaptions of our tool chain.</p>
