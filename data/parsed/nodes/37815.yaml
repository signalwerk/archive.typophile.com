    html: |-
      <p>You've done a very nice job.</p>
      <p>The only thing is that you should work more on your strokes weight consistency. Letters such as χ (chi), ψ (psi), ν (nu), γ (gamma), τ (tau), λ (lambda), ι (iota), υ (upsilon), ω (omega) seem quite thin to me (compared to the rest). Υou should work more on both the spacing and the kerning of the typeface too (eg. Γε and Συ look weird). Finally, check on the stroke weight relations between your uppercase and lowercase letters.</p>
      <p>Congratulations once again.<br>
      Please, upload the final version as well.</p>
      <p>George Triantafyllakos - backpacker.gr</p>
