    <p>This is the digitised and redesigned version of the historical Greek newspaper Estia.<br>
    The original typeface was only available in printed form and was taken from newspaper sheets kept in archive. The newspapers printing method at that time was linotype.<br>
    I scanned the letters one by one, retouched them by hand firstly, then digitised them using ScanFont and at last edit them with FontLab.<br>
    This was done for my MA project in the Masters department of Vakalo School of Art and Design, Athens, Greece. My proffesor during this project was Hector Haralambous.<br>
    Please give me some feedback on the result.<br>
    Thank you<br>
    Sergios Hatzinikolas</p>
