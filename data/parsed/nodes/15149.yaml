  html: |-
    <p>TTHmachine is a new tool for applying hinting instructions to True Type fonts.<br>
    It is a Windows based IDE with glyph rendering ability.<br>
    This release is a free beta download and is still under development, so any feedback is welcome.<br>
    <a href="http://www.cr8.netfirms.com" title="http://www.cr8.netfirms.com">http://www.cr8.netfirms.com</a></p>
    <p>Thanks<br>
    Allan Murray</p>
