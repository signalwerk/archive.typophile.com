    date: 2002-08-31T10:02:00
    date_raw: 31 Aug 2002 — 10:02am
    votes: null
    html: '<p> &gt;I think it rises to a new level. <br> <br>I disagree entirely. "design is a good idea" is a pun. The double meanings are: 1) that it is a good idea to design things and that, 2) the term design can be defined as the execution of "a good idea." <br> <br>Whereas: "kerning is a good idea" simply means that it is a good idea to kern. The pun is lost. Worse, the idea and the design for the shirt is ripped-off making the attempted parody an awkward and embarassing imitation of a superior original. It lacks any sensitivity or understanding of the original concept. </p>'
  - id: 22682
    user: 1019
    date: 2002-08-31T11:15:00
    date_raw: 31 Aug 2002 — 11:15am
    votes: null
    html: <p> homage to me relates to something someone did as a gift or show of respect in your own way not imitation. <br> <br>Charles Demuth's painting "I saw the figure five in gold" payed homage to his friend William Carlos Williams's the poet who had a poem by the same name. <br> <br>Albers and his 'homage to the square' series showed his respect in his way (to make visual) geometry, color, and mathematical representation before concept. <br> <br>homage does not mean copy </p>
  - id: 22683
    user: 1250
    date: 2002-08-31T11:20:00
