    html: <p> yay. another Demuth fan. I payed homage to Demuth focusing on his visual, altering the fonts, simplying the painting and inking it black on my shoulder. only 1 lady, about 60yrs old at a folk cafe has ever recognized it, walked by said, 'I love Demuth too' and left.  <br> <br>again homage means you can appreciate and do not, absolutely would not, even think of, imitating it. to borrow someones concept for any other purpose (advertising typophile in this case) is almost an insult not a parody. <br> <br>it smells of those Microdot (for microsoft) and other knock-off t-shirts in the head shops. </p>
