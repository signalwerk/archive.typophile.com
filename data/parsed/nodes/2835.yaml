    html: "<p>Naah. Wes Wilson, poster for The Association.  <br> <br><a href=\"http://www.olsenart.com/bg018.html\" target=\"_top\">http://www.olsenart.com/bg018.html</a> <br> <br>The book cover is a relatively crappy attempt to combine this poster with Milton Glaser's Dylan poster (with psychedelic hair). The tee is a much better homage (although it loses out on what Wilson, Moscoso, and Albers knew so well about color vibrations).  <br> <br>And it IS homage: I don't think that this design is trying to fool us into thinking this is something altogether new, but referencing a strong work of design history.</p>"
