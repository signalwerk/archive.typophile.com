    votes: null
    html: <p> &gt; "kerning is a good idea" simply means that it is a good idea to kern. <br> <br>No, the whole point is the context of the "original" version! Maybe you just don't enjoy parody? <br> <br>hhp </p>
  - id: 22684
    user: 577
    date: 2002-08-31T13:11:00
    date_raw: 31 Aug 2002 — 1:11pm
    votes: null
    html: <p> I remember the first time I saw the Demuth that Tanya is referring to. I was in the Met and I was literally frozen in my tracks. A Williams fan, I recognized the reference even before reading the title. It's such a masterful and tasteful visual interpretation of verse. A true homage. <br> <br>I don't think the "kerning is a good idea" submission even begins to approach that same level of sophistication. And I disagree that the whole point is the context of the original. It's just another example of designers failing to really appreciate the power of the written word. Unlike "I Saw the Figure Five in Gold" which sensitively captures the color and rhythm of Williams' verse, the "kerning" example merely parrots the look of its predecessor.  <br> <br>Literacy is the first skill of a good designer. Without it we're merely aimless decorators. </p>
  - id: 22685
    user: 1250
    date: 2002-08-31T13:54:00
    date_raw: 31 Aug 2002 — 1:54pm
    votes: null
    html: "<p> &gt; the \"kerning\" example merely parrots the look of its predecessor. <br> <br>Dude, have a sense of humor - that's not a parrot, that *is* in fact a sophisticated \"inside joke\": the font at hand is Base Nine (Bold) - do you forget that a big deal was made about it not having any kerning? They even made a poster saying \"blah blah blah NOWHERE NEAR KERNING\". Get it? <br> <br>Or are you perhaps overly sensitive to anything that parodizes Emigre, or maybe parodizes the value of Design (expressed in the original)? Do you like The Onion, or do you think it's unpatriotic or something? <br> <br>hhp </p>"
