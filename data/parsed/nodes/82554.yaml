    <p>I'm about to start designing a novel and would like recommendations for a sans-serif font for reading.<br>
    So far I've been using ITC Garamond but I'd like to try a few options - I'm also not sure what type size/leading is best for reading.</p>
    <p>Thanks in advance for your help.</p>
