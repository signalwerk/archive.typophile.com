    html: |-
      <p>"10 point type on 12 point leading is standard, or maybe even a little smaller, for novels."</p>
      <p>That's a questionable statement, from my point of view. An optimal size and leading ratio differs from one typeface to each other, and depends, among other things, by the instrinsic traits of each typeface. I mean, setting a text in Miller on 10 points will give you a *very* different result than, say, a text set in Adobe Garamond in the same size. Instead I would say, from my limited experience, that 11 points is a better readable size for novels, esays or poems. So the first advice is: do some layout tests with serifs with different qualities and features, print the pages and then proceed with gradual adjustments.</p>
