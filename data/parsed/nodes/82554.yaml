    html: |-
      <p>There are many, many serif faces that work well for novels.* (ITC Garamond, I would say, is unfortunately not one of them.) The choice is an artistic as well as a practical one. Choose something that speaks subtly to the feel of the novel that you are trying to capture in your design. The same goes for size and leading — that's the art of typography, and as the designer you should feel confident to trust your instincts and use your visual judgment. That said, as a starting point, 10 point type on 12 point leading is standard, or maybe even a little smaller, for novels. And just to give you some possible leads, from several different styles and periods: Minion, Garamond Premier, Electra, Palatino, Baskerville, Jenson, Dolly, Stone, Caslon, Quadraat, Mrs Eaves, etc. etc. etc. </p>
      <p>* I think you meant serif, not sans.</p>
