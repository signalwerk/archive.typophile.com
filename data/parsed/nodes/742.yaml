  html: "<p>THE FONT BUREAU announces the retail release of Whitman,  <br> a new typeface from book designer Kent Lew. Drawn in the tradition of Dwiggins (whom Lew recently lectured on at Type Con 2003), Whitman serves as a very functional text type. The four-style font family includes both Oldstyle and Lining figures. Whitman was awarded a Certificate of Excellence in Type Design and a Judge's Choice by the TDC in 2002. <br> <br>In Kent Lew's words \"When I started Whitman I personally had no fondness for most Moderns or Scotches (I've since come to appreciate Caledonia and especially Matthew Carter's Miller, but I still don't like Bodoni or Didot. Respect? yes; like? no.) \v <br>  <br>view Whitman at: <br><a href=\"http://www.fontbureau.com\" target=\"_blank\">http://www.fontbureau.com</a>  <br>  <br>For a press kit or more information, please email <a href=\"mailto:info@fontbureau.com\">info@fontbureau.com</a>  <br>or call Harry Parker or Robb Ogle at 617 423 8770.</p>"
