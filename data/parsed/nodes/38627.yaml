    html: |-
      <p>Ahhh National. I have to say I am rather sad to have it released after having it all to my self for about a year. I was testing this baby from before it even had a percent glyph, kerning, rounded punctuation or even the subtle ink traps. It seems strange how a typeface can grow like that.</p>
      <p>I think the first thing to draw me to National was the extra bold weights, I thought they were slightly mad. I loved using the heaver weights in titles, headings and as such (and I loved how the tail of the lowercase 'a' remains from book to extra bold).<br>
      So I loved using National in larger text settings.</p>
      <p>But now I'm appreciating the regular weights a lot more, National hides really well in longer text, but still has that warmth in the character to make the read interesting.<br>
      It works better in text than I thought it could.</p>
      <p>So its become my studios little work horse. Always does its job as long as you treat it well (correct line length, 'actual' superiors nice rag and so on...), so look after it!</p>
      <p>Good stuff Sowersby, make some more cool type! Go on.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/National-1_4395.jpg"></div><p></p>
