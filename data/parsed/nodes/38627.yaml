      <p>Thanks you all for your very kind words! A few answers:</p>
      <p><cite>Does National represent the Village encoding standard?</cite></p>
      <p>I am not too sure about that. I know Chester has an extensive encoding for his own work, and that is being added to &amp; refined. I basically use whatever is his latest. </p>
      <p><cite>1. The capitals are small and light compared to the older sans…more like a 19C sans</cite></p>
      <p>Yeah, some interesting observations there. The National blurb says it "travels through, and touches on, a lot of historical material, it is designed to thrive in our modern typographic climate." I really wanted a sans that was relatively contemporary, not a slavish revival, with anachronisms like enormous, dark capitals. That might also explain the 'l' tail as well!</p>
      <p><cite>But why separate OT fonts for small caps?</cite></p>
      <p>Everything is in one font file, believe me! As a user, I cannot stand to have separate font files. I think Chester has done this to show that there are small caps for all styles. </p>
      <p><cite>Yeah, esp considering the Dollar is at an alltime low vs the Euro ; ). 250 USD = 173 EUR.</cite></p>
      <p>I quite like the quip at the top of the vllg.com site that says "our dollar is weak but our types are strong!".</p>
      <p><cite>Best thing from NZ since the Chills. Well done!</cite></p>
      <p>Woah! That is an enormous compliment Fredrik—not too sure if it is entirely justified, but thanks all the same!</p>
