      <p>Major props, Kris, a huge achievement.<br>
      And congratulations to Chester Jenkins and Village as well, for the "big league" vision of what a typeface can be, in the styles, weights, features and languages that it supports.<br>
      Does National represent the Village encoding standard?<br>
      I note that H&amp;FJ have an encoding standard, Latin-X™.<br>
      It seems that with the graphic elements, National could be WGL4, with Cyrillic and Greek added.</p>
      <p>Some observations:</p>
      <p>19th-century flavour, certainly, but two some distinction:<br>
      1. The capitals are small and light compared to the older sans faces: if National's caps were increased in size to ascender height, that height conformity, and the added weight contrast with lower case it would create, would be more like a 19C sans. In this respect, National follows the "Helvetica" paradigm of a smoothing out of cap/lc contrast.<br>
      2. The tailed "l" is, AFAIK, a 20th-century trend in sans faces. Interestingly, its curvyness harmonizes well with the rounded forms in National's "geometric" stylistic alternate, where one might have supposed that a straight l would be more minimally geo. </p>
      <p>With regards to the stylistic alternate included: I wonder at what point a separate style emerges, both from a categorical perspective, and from a product perspective. Recently, Neutra has been extended to create Neutra 2, by changing a few characters. yet Hypatia and National, for instance, incorporate the alternate face as a Stylistic Set (or so I deduce from the National PDF) within one typeface, with the grotesque as the default and the geometric as the alternate.</p>
