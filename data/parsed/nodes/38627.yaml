    <p>Kris Sowersby just released a major type family through Village, the neo-grotesque "National" sans family.  It is destined to be a real workhorse sans with plenty of weights and features to take on all sorts of work. It looks pretty solid to me and I am sure others will take it out for a spin as well.</p>
    <p><a href="http://vllg.com/KLIM/National/mudTyper+Weights/" title="http://vllg.com/KLIM/National/mudTyper+Weights/">http://vllg.com/KLIM/National/mudTyper+Weights/</a></p>
    <p>ChrisL</p>
