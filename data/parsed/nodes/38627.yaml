      <p>Congratulations to Kris!</p>
      <p>I prefer National to other recent types I have seen that aim at reviving the flavor of 19th century English and American grotesques. The others are often too quirky looking to my eyes. National has the human feel and charm of the old grotesques, with more balance. Franklin Gothic, also a regularization of 19th century grotesques, is also not quirky and is well balanced, but is more formal. So National offers a contemporary, alternative with a nice charm and balance.</p>
