      <p>Pricing is always tricky. At what point does the volume increase overtake the individual profit margin? Developing decent type is quite time consuming work and not guaranteed to return the initial investment of time. What does it take to determine the market saturation point of a given face and divide it into the cost of production? There is quite a bit of speculation involved. It is truly a gamble. Like playing Bingo, your odds of winning increase with the number of cards you purchase to play--as does your investment in the game. It isn't just the value of the individual typeface in the market but the marketing power of the vendor. A large established entity with plenty of market inroads will have a much easier time of getting their work even noticed.  The small outfits and newcomers with no track record have to bleed the most to get a bandage. This same group has the least capital to invest so they are between a rock and a hardplace. They have to spend more on marketing and lower their pricepoint to get the attention of the buyers. Nick's concept with MyFonts is a perfect example. His logic is spot on with the MyFonts sales model. You have to tread water long enough to be there for the feeding.</p>
      <p>ChrisL</p>
