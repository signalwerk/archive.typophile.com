    <p>Looking at the Adobe/Monotype/Linotype pricing structure, it appears that they have all standardized on $24 for Postscript and $29 for Opentype fonts, whether it be on Myfonts, Adobe, Fonts.com, FontExplorer, whatever.</p>
    <p>I'm curious what others in the industry think about this. On the one hand, it's not a horrible price to be paying for quality cuts of beef from the mega foundries. But for independent type foundries, do you feel that it sets the bar too high? Or too low?</p>
    <p>Do you think that standardizing the cost of fonts along these lines would level the playing field so that only the best designs stood out? </p>
    <p>Imagine we're talking about Myfonts, and they adopt this pricing scheme. All fonts are $24/$29. Which version of Garamond do you want? They're all the same price, so obviously you're gonna pick Premier Pro or Sabon instead of some knockoff Jannon. Or you'll pick Storm's Baskerville over the Monotype version. </p>
    <p>It all depends upon the design, not the price. That would make the quality of the type the determining factor. (Ruling out a lot of the crap fonts, since no one is going to pay $29 for Black Chancery. Yeah buddy, I totally just went there.)</p>
    <p>Silly? Smart? Insipid? Inspired?</p>
