      <p>I know that some complain about not being able to license one single font from some foundries. The way I think about it is two-fold. </p>
      <p>- "Is this font <em>the</em> best for the project?"<br>
      - "Will I be able to use again in the future, even many times?"</p>
      <p>If I (you) can say "yes" to both you will get your money back. It might take a project or two, but you'll get it back. </p>
      <p>Also consider that the time you spend trying to find something close is costing you money too.</p>
      <p>Perhaps consider only charging your client for the one font and then when you use the next font in the pack charge another client for that one.</p>
      <p>Fonts are tools that we use in our work. I couldn't buy part of a computer even if that was all I could afford. So I buy the whole computer knowing I'll get my money back eventually. I have a well-stocked toolbox and know that I will get my money out of them. </p>
      <p>Also consider not even charging your clients for the fonts. I don't. It goes back to the toolbox analogy. I'm not giving the tools to my clients when I'm done. I'm giving them the final product. I keep the computer and the fonts to use another day.</p>
    html_clean: |-
