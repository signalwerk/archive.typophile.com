      <p><em>... loaded with philosophy, and our reward is a tepid sales rate</em></p>
      <p>Not quite how I would have phrased it.<br>
      Certainly, I'm not interested in catering to popular taste by concentrating on retro scripts and distress.<br>
      But making original designs is nonetheless a viable business model, given the nature of the market -- huge and long-term.<br>
      So if a foundry builds up a catalogue of products, and has good retail distribution, every one of its fonts will be licensed by someone somewhere, occasionally: Long Tail theory. And that adds up, even if you don't crack the Myfonts best seller list. (It should be noted that such charts are consumer-oriented, rather than corporate-oriented, as they are based on unit volume, not dollars, so the sale of a multi-font family with a multi-user license, for thousands of dollars, counts as a single sale and doesn't dent the chart, whereas if the value of the sale were divided by the typical cost of a single font, it would register as a big hit.)</p>
      <p>I'll be releasing some low-cost fonts soon. Tranching down.</p>
