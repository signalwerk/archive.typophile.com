      <p><em> But for independent type foundries, do you feel that it sets the bar too high? Or too low?</em></p>
      <p>As an indie font maker* the big guys have set their standardized prices about right for me. I am able to match it, and in fact better it with low-end font products at budget prices. Primex is a simple font but it's cheap and useful, and designers buy it for those reasons. That's something any indie font maker should be able to do with just a dash of imagination.</p>
      <p><em>Do you think that standardizing the cost of fonts along these lines would level the playing field so that only the best designs stood out?</em> </p>
      <p>The font market really doesn't work that way. The best designs stand out on the basis of merit, including a fair price.</p>
      <p><em>Imagine we’re talking about Myfonts, and they adopt this pricing scheme. All fonts are $24/$29.</em></p>
      <p>Very hard to see that ever happening. The whole concept of Myfonts is based on an open supermarket plan; independent vendors set their own prices, and the roach-baited font-buying public make their choice, based on the apparent quality of font products, features offered, perceived value for money, rival font products, and market trends. Myfonts has a ranking system that ensures all the good stuff (fonts people are buying) filters to the top, and the rubbish nobody buys filters to the bottom. </p>
      <p>Stephen is quite right in saying that quality already is the determining factor.</p>
      <p>*I have never once called my operation or anyone else's "foundry". Only Myfonts literature refers to Sentinel Type as a "foundry", but I don't complain---life's too short.</p>
      <p>j a m e s</p>
