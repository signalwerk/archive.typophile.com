      <p>I think the biggest problem of font pricing with some of the independent/boutique foundries are the ones that refuse to allow a-la-carte pricing of individual weights and styles (e.g., HFJ). I understand the rationale behind the pricing strategy, but to me, it is a significant hurdle to purchasing more licenses. </p>
      <p>As for the 24/29 thing, seems like the Type 1's are overpriced. No one seems to want them anymore, Adobe won't even cut them--so shouldn't the price be a lot LOWER? After all, to get most of the glyphs in a fully-fleshed-out OT typeface, but in Type 1 format, you need to license at least three fonts (standard, caps and OsF) and perhaps even more (LF, TF, foreign language...)</p>
      <p>The market has grown accustomed to the "roughly $20-$30" price for an individual font, so the OT price seems about right.</p>
