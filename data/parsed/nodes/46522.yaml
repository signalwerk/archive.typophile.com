      <p>Another similar one is <a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/fire-down-below-nf/" rel="nofollow">Fire Down Below</a> from Nick's Fonts.</p>
      <p>I've just tried out the previously suggested Popups.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ANSWER_6140.gif"></div><p></p>
      <p>It doesn't look quite as sharp but is otherwise a very good match. Perhaps they used Popups but re-drew it to look sharper?</p>
      <p>Although looking at both, neither seem to have got the prismatic effect to work on the W properly!</p>
    html_clean: |-
      <p>Another similar one is <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/nicksfonts/fire-down-below-nf/" rel="nofollow">Fire Down Below</a> from Nick's Fonts.</p>
