      <p>Hrant,<br>
      I never thought you would be the only one with your opinion--only that you would be the most vocal in expressing it :-)</p>
      <p>"...For me at least, great technique doesn’t overcome using inadequate tools."</p>
      <p>The Great Pyramids, the Parthenon, the Trajan Column, and the Stradivarius Violin were all created with inferior tools yet great technique prevailed.  Matisse, during the latter years of his life, was crippled to the point that he could only barely use crude scissors yet managed great works of art using his inadequate tools and less adequate hands. With all the computer driven knowledge and high-tech laser tools available today, there has never been a violin created to rival the 17th Century Italian masters.</p>
      <p>I much prefer greater-than-adequate skill and talent to the greatest set of tools imaginable.</p>
      <p>If someone were to give me the most amazing surgical tools on Earth to use, I am sure you would not be willing to have me perform surgery on you.  The result would surely be Grotesque (pun intended :-)</p>
      <p>ChrisL</p>
