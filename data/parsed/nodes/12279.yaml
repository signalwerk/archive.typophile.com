    html: |-
      <p>Tiff,</p>
      <p>I love Massimo's work. He uses a typeface as a neutral tool and makes the page come to life with his use of space, alignment, and tension.  The typeface does not do the work, Massimo does.  To that end, Helvetica is a good choice (though I much prefer Univers).<br>
      Massimo's work would still be the same had he replaced Helvetica with either Univers or AG. I don't mean to say that it would have been better.  I am just trying to say that he chose a small set of tools and used them to their fullest.  That was just his way of working.  I would much rather have a Vignelli piece (all done in Helvetica) hanging on my wall than any lesser designers work with all of my favorite type faces used.<br>
      Massimo is a Helluva' master (and he mastered Helvetica to boot).</p>
      <p>ChrisL</p>
