      <p>thanks for the replies.</p>
      <p>I initially set the Tschichold essay in Sabon, but then discovered on further reading that 'A New World View' was taken from <em>The New Typography</em> where he argues against serifs and for asymmetrical typography (including sans serif faces). Sabon was designed after he decided the views expressed in <em>The New Typography</em> were a little too radical and that serifs weren't so bad after all. (All the Penguin books are set in a serif, as per his detailed instructions).<br>
      So not sure whether that reflects the content as strongly. I guess ideally it would be set in the same face as <em>The New Typography</em> but I don't have it to hand to check what it's set in! It would be quite ironic to find it set in a serif...</p>
      <p>Will try helvetica and futura for the Vignelli - at the moment I'm thinking about Hevetica Neue as Vignelli is arguing for a revival/continuation of Modernist thought and a re-worked version of a Modernist face would be quite apt for this. Although so would Futura...I didn't realise this would be so tricky...! Thanks again.</p>
