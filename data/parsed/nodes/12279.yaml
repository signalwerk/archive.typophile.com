      <p>"Which of course is exactly his problem."</p>
      <p>Actually, it is not his problem, it is exactly his solution.</p>
      <p>Imagine "Jack" was a builder in the 1950s and only had a few hand tools to work with but he was able to make sturdy, yet beautiful buildings anyway.  Jack did good work because he was a master builder, not because he had a full range of tools. Let's say that we give someone of mediocre skill and talent (call him "Bob") a complete set of the finest power building tools our modern era can produce and have him build a house.  Would you rather have the house that Bob built or the house that Jack built?</p>
      <p>ChrisL</p>
