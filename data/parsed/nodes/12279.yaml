    <p>Hello,<br>
    As part of a project I've been asked to set a series of essays; two of these are on Modernism. However, each essay has to be set in a different face that echoes (or re-inforces) the topic it is speaking on. I wonder if anyone would be able to make any suggestions, as I'm having quite a difficult time selecting suitable faces!</p>
    <p><em>Long Live Modernism!</em> by Massimo Vignelli<br>
    currently set in Gill Sans, which is an issue - Italian-American author set in an English face, not too great a choice on my behalf. This is the one I'm having major issues setting.</p>
    <p><em>The New World View</em> by Jan Tschichold taken from <em>The New Typography</em><br>
    currently set in Univers. I'm pretty settled on the setting for this one, as I feel Univers reflects the content and authorship of the essay.</p>
    <p>Any suggestions / critiques of my choices would be very helpful.</p>
