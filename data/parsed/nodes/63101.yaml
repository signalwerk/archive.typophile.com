      <p>Hi,</p>
      <p>I like the design process and the thinking that went behind this. Definitely a tough task at hand..</p>
      <p>Personally, #1 has the best typography, clean and crisp. The razor-blades of the Y-A: nice and rebel-sexy too. (Perhaps a 'y' (compared to 'Y') with that right legtail slant is better to balance A's right leg?)</p>
      <p>An infinity-symbol is almost a prerequisite with a name like 'infinity'. No surprise. Where to incorporate it? #2 is too overpowering. </p>
      <p>Something subtle like fujitsu's would do better, but how do we make that unique..?</p>
      <p>One suggestion is to optimise the 'ini' and 'isi' in the name itself. Perhaps, putting the infinity symbol in between a stacked infinity and advertising could work. Not sure the balance and weight, though and the kerning would be another bugbear..?</p>
      <p>Just my two cents,<br>
      nagfa</p>
