      <p>I'm finding this a little too much show and tell with the word infinity and the infinity symbol. I recently drew a similar infinite ligature for a client with the word "ETERNALS" in the RN slot. At the end of the day we chucked it for the same reason, though I think here even more so. It is the obvious solution and what does that say about a creative services company?</p>
      <p>If you do decide to keep the infinity symbol (you know your client best), I'd make the word advertising way less emphasized. Infinity is the interesting part of this. I might try and italic where the f is "infinite". Also, consider making any infinite ligatures the only modified letters. eg The VE lig is not helping in the slab version above.</p>
      <p>How else can you illustrate infinity? How can you push your client to be more creative?  The IA marks also may have legs.</p>
