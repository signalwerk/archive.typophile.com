      <p>MrKikkoman —&nbsp;you are right, I worked on the kerning. Thanks for that observation. (: I feel what you mean about the A's stem being so extreme and I'll give a shot at shortening it.</p>
      <p>Simplicious — thank you for the feedback. Which symbol are you referring to? The IA in the circle? Anyways, I worry about spacing out the letters in "Advertising" because after resizing, it will all but disappear underneath "Infinity." I kerned all the letters when they were at the same size and then resized Advertising to go under Infinity. Could this be creating a problem?</p>
      <p>And yeah, #2 was actually a very fast experiment using a thick loop I had originally tried to make as the disembodied, floating infinity symbol. It does look super conflicting, but by itself, I was going after a serpentine quality. Reasoning behind a poorly prepared concept, hah.</p>
      <p>A part of me believes there is a simpler, more minimal approach to all of this hiding somewhere still. It's not a big firm. In fact, it's very new. I feel this absolute need to reflect a certain amount of freshness about it, and so far the strongest inclination I've had has been to pair it down to the essential "IA" and nothing else. Perhaps I could keep the IA but compliment it next to a different kind of logotype where appropriate.</p>
      <p>Thank you everyone for the feedback thus far.</p>
