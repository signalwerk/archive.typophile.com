      <p>Alright, here's an idea, and before you say anything, I know it looks horrible, there's no real form to the lettering, no contrast, mismatched termini, bad kerning, and who knows if Univers is a good match at this early stage, but... first time doing custom script with my new Wacom. Biggest question in my mind: is this a concept worth pursuing and perfecting?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/screenshot-1_4439.png"></div><p></p>
      <p>Bear in mind, this is my first time doing something freeform like this. In the past it's always been about altering fonts slightly, getting tricky with the pathfinder, et cetera, but this, I feel, is a very slick direction, but it's something I need to learn more of.</p>
      <p>I want to exaggerate the loops on the I and Y a little more so that the eye connects them. There's a buttload of refinement needed for this concept if I go for it. Needs so much contrast and stroke work...</p>
      <p>EDIT: Ah, very good observation, Randy. Have to admit that I did not even mean to go for a "perspective" with those points. Now you have me thinking "warp speed" and stuff. And as far as what the client intends with "Infinity"... you know, that was never disclosed in the brief. Realizing that the ball is very much in my court.</p>
      <p>Since it's so relatively new and their first project is still being produced, I'm not sure if I can give away anything about this company. But I can say that it's brand new and it aims to be a contender in NYC. I think I suggested that it be an umbrella company, tying together different firms and divisions devoted to different sorts of advertising. And I know the loop is soooo obvious, but the idea of making connections (between consumers and businesses) prevailed in my mind, yet advertising is a never-ending process (thus the loops in my concepts have ends that never meet, but look as if they are about to).</p>
      <p>Conceptualizing a meaning behind the name, now. This is getting very interesting.</p>
