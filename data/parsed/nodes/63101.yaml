    <p>But he also wants a stylized infinity loop—which seems like a no brainer, but it's been one of the most difficult things to make unique... and I am trying to integrate it somehow with the logotype so that it doesn't seem so disconnected. I'm currently frustrated at how hard it is to put a loop anywhere on the logo without it seeming unbalanced or weird.</p>
