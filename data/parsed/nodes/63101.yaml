    <p>An idea struck me for making the loop play between the Y and A, so I attempted it first with a hand-made slab serif type in #3. Then I tried out different weights and finally a more sans-serif variant (but I'm afraid that the ultra thick weight of #6 along with how geometric it is makes it look too constructivist/soviet). I actually like #3 the most since it doesn't have the connecting bar.</p>
