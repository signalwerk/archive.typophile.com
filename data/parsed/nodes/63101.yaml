      <p>At this moment, I'd like to retry the ligature/y&amp;a loop thing soon. I've already come up with a new rough sketch... the problem now is replicating it in Illustrator without spending hideous amounts of time on something that may not ultimately work. Right now, it looks like an eloquent, slightly-decorative type (not all uppercase this time) with drops/foilage on various termini. Think "Zag" made by FontFabric, only italicized. The y&amp;a ligature looks highly attractive and readable in such a style if I do say so myself.</p>
      <p>As I was sketching, I also came up with a way to integrate a lowercase, double-decker "a" with an infinity loop and the result is very exciting—it's one of those things that needs a whole lot of refinement, though it feels like a brand new idea.</p>
      <p>The only disturbing thing about these ideas is that I feel they're both far from being "razor-sharp." Perhaps with more fine-tuning. I will try and put up some scans tomorrow.</p>
