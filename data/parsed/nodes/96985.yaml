    html: |-
      <p>You could live-trace in illustrator, give it a little clean-up of rogue points and drop that into fontlab as a mask (Cmd-M) and then draw it correctly.</p>
      <p>Otherwise, FontLab <strong>seems</strong> to render raster backgrounds differently depending on the zoom level and resolution of the object.</p>
