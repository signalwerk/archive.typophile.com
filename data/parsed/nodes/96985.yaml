    <p>Hey ,</p>
    <p>While trying to create a glyph for a particularly tricky character( namely G), I faced infinite trouble as i can not get it to look just like my sketch. So i though i would scan it and place it as a BG image over which i can trace, but unfortunately when i am placing the scanned image(after increasing the contrast in PS) i am only getting a grey box with very little detail.<br>
    So, i was wondering if there is another way to make a template layer (Like illustrator: take a photo and dim it down and lock it) with the scanned image?</p>
    <p>Regards<br>
    T</p>
