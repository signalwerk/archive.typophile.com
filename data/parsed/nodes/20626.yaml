  html: |-
    <p>When I set type in Akkurat using Indesign, it looks incredibly odd on screen. Glyphs<br>
    such as o, d, e, c, u appear to drop strangely far beneath the baseline, and the copy in<br>
    general looks quite pixelated and 'bitty'. When I zoom in both these effects dissapear. </p>
    <p>When I print type below 13 point on a high quality inkjet printer, the strange baseline<br>
    and bitty appearance are still apparent, but significantly less so than on screen. </p>
    <p>Is this the same for other people who use Akkurat, or can anyone think of any reason<br>
    why this would be?</p>
    <p>Thanks,</p>
    <p>Phil</p>
