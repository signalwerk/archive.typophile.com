    html: <p>This is a result of poor <a href="/wiki/hinting" class="freelinking" rel="nofollow">hinting</a>. The font will do fine in offset or laser printing, but there's not much you can do about the onscreen appearance short of emailing Lineto and urging them to up da hint factor.</p>
