      <p>So I brought up the "g" thing in class, and it was a general consensus that that should be fixed, if possible. Here's my solution, which I think has much nicer Gestalt, anyway. I agree that the letters don't need to be über-recognizable, but I'd like to keep some nuances of them, if possible. Thoughts on this one? Better? Worse? Ways to improve it? Is the center too strong of a focal point (I kinda feel like it detracts from the nice flow of the outside of the shape...)? I know I'm into the final tweaking, but any suggestions are helpful.</p>
