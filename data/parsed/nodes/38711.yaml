    votes: null
    html: |-
      <p>Jarrod,<br>
      Yes, it is for personal stationery. It is representative of my general style of work, and it is constructed out of letterforms—a nod toward my love of type. It is also my initials. And it shows type more as image than as type, which is a great interest of mine.<br>
      As it is a personal mark, it is very difficult for me to explain its communicative value as I would any other mark. I guess the above is as good as I can do, without revisiting all the "who is the brand called Cassie" stuff I figured out before starting on this mark... it's so true that designing something for yourself is the hardest thing to do as a designer.</p>
