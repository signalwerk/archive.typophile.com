    html: "<p>Of the ones mentioned so far, I think Lingua and Amplitude deserve special attention because they break new ground. <br> <br>-- <br> <br>John, some of the features (like the linkage variations) in that Arabic font system are very nice. <br>I'm wondering if: <br>1) There's some missing kerning? Like look at the big gap in \"'amrihi\" (4th word of 2nd line). <br>2) Does the font fully support the vertical floating aliph? \"'aLaahi\" (second word) certainly shows it, but some words (like \"rahmaan\" - 3rd word - and \"�aalika\" - penultimate word on 3rd line) are supposed to use that instead of the normal (slanted) floating aliph, because it's pronounced like a long-aliph but is not fully marked. <br>3) I think this setting at least is underusing the kasheeda, which when applied well can greatly amplify the airy elegance of Arabic setting. <br> <br>hhp <br></p>"
    html_clean: "<p>Of the ones mentioned so far, I think Lingua and Amplitude deserve special attention because they break new ground. <br> <br>-- <br> <br>John, some of the features (like the linkage variations) in that Arabic font system are very nice. <br>I'm wondering if: <br>1) There's some missing kerning? Like look at the big gap in \"'amrihi\" (4th word of 2nd line). <br>2) Does the font fully support the vertical floating aliph? \"'aLaahi\" (second word) certainly shows it, but some words (like \"rahmaan\" - 3rd word - and \"�aalika\" - penultimate word on 3rd line) are supposed to use that instead of the normal (slanted) floating aliph, because it's pronounced like a long-aliph but is not fully marked. <br>3) I think this setting at least is underusing the kasheeda, which when applied well can greatly amplify the airy elegance of Arabic setting. <br> <br>hhp <br></p>"
