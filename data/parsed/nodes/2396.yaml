    html: <p>Oh, I think that <a href="http://www.linotype.com/15525/optimanovaredesign-doc.html" target="_blank"> Optima Nova</a> was released this year. I've always admired Optima in signage, but in small sizes I thought it suffered by its color being too grey and dull. The new version solves the problems of weight and spacing, and adds a true italic. I don't know if this counts as new, or a revival. I am happy that Zapf had the opportunity, with his collaborator, to improve this classic design for the digital age.  </p>
