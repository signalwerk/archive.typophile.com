    html: "<p>A correction: the Cyrillic Emigre typefaces were developed at <a href=\"http://www.paratype.com/\"> Paratype</a>. <br> <br>--- <br> <br>More 'the best of 2003': <br><a href=\"http://www.typeproject.com/AXIS/sample.html\"> Axis</a>, designed by Isao Suzuki and Akira Kobayashi. <br><a href=\"http://www.fontbureau.com/fonts/specimen.tpl?fontname=Prensa\"> FB Prensa</a>, an Electra-esque face by Cyrus Highsmith. <br> <br>--- <br> <br>&gt; Mana is The Force, dude. ;-) <br> <br>:-) <br> <br>&gt; Actually my use of it comes more from \"mano\"  (Spanish). <br> <br>Hehe, in Portuguese 'mana' usually means 'sister'. I guess it comes from the Spanish 'hermano'/'hermana', simplified here to 'mano'/'mana'.</p>"
