    html: "<p>Re. Arabic Typesetting in response to Hrant: <br> <br><i>1) There's some missing kerning? Like look at the big gap in \"'amrihi\" (4th word of 2nd line).</i> <br> <br>Quite probably. This is the only text sample I had on hand, a PDF that was prepared by Mamoun and Paul for the TDC annual early this year, and the font was not quite finished. <br>  <br><i>2) Does the font fully support the vertical floating aliph? \"'aLaahi\" (second word) certainly shows it, but some words (like \"rahmaan\" - 3rd word - and \"�aalika\" - penultimate word on 3rd line) are supposed to use that instead of the normal (slanted) floating aliph, because it's pronounced like a long-aliph but is not fully marked.</i> <br> <br>I believe that's an encoding issue: the vertical alif mark used in <i>aLaahi</i> is a different Unicode character from the fatha. I'm not sure whether Mamoun entered this text himself, or used an existing electronic text, in which case the encoding of marks is inherited. <br>  <br><i>3) I think this setting at least is underusing the kasheeda, which when applied well can greatly amplify the airy elegance of Arabic setting.</i> <br> <br>Yes, there is very little kasheeda use in this example. There would automatically be more if the text were justified, I believe, although I agree that justification is not the only reason to use kasheedas. <br> <br>Not obvious from the sample above, perhaps, are two of my favourite features of the font: contextual differentiation of similar letters by modifying tooth length, and the cursive connection feature that gradually raises preceding letters off the baseline: <br><img src=\"http://www.typophile.com/forums/messages/30/22401.gif\" alt=\"Arabic Typesetting contextual and cursive\"></p>"
    html_clean: "<p>Re. Arabic Typesetting in response to Hrant: <br> <br><i>1) There's some missing kerning? Like look at the big gap in \"'amrihi\" (4th word of 2nd line).</i> <br> <br>Quite probably. This is the only text sample I had on hand, a PDF that was prepared by Mamoun and Paul for the TDC annual early this year, and the font was not quite finished. <br>  <br><i>2) Does the font fully support the vertical floating aliph? \"'aLaahi\" (second word) certainly shows it, but some words (like \"rahmaan\" - 3rd word - and \"�aalika\" - penultimate word on 3rd line) are supposed to use that instead of the normal (slanted) floating aliph, because it's pronounced like a long-aliph but is not fully marked.</i> <br> <br>I believe that's an encoding issue: the vertical alif mark used in <i>aLaahi</i> is a different Unicode character from the fatha. I'm not sure whether Mamoun entered this text himself, or used an existing electronic text, in which case the encoding of marks is inherited. <br>  <br><i>3) I think this setting at least is underusing the kasheeda, which when applied well can greatly amplify the airy elegance of Arabic setting.</i> <br> <br>Yes, there is very little kasheeda use in this example. There would automatically be more if the text were justified, I believe, although I agree that justification is not the only reason to use kasheedas. <br> <br>Not obvious from the sample above, perhaps, are two of my favourite features of the font: contextual differentiation of similar letters by modifying tooth length, and the cursive connection feature that gradually raises preceding letters off the baseline: <br><img src=\"http://www.typophile.com/forums/messages/30/22401.gif\" alt=\"Arabic Typesetting contextual and cursive\"></p>"
