    html: <p>The rather boringly named but very beautiful and useful 'Arabic Typesetting', designed by Mamoun Sakkal and Paul Nelson for Microsoft. It isn't shipping yet, so far as I know, but it was completed this year and was one of the winners in the last TDC type design competition. <br> <br><img src="http://www.typophile.com/forums/messages/30/22349.gif" alt="Arabic Typesetting"> <br> <br>Full disclosure probably requires that I mention that I designed what I think is a competent and attractive Latin for this typeface, but it's really all about the Arabic which is not only a fine design but also an incredibly complex and clever piece of OpenType work.</p>
    html_clean: <p>The rather boringly named but very beautiful and useful 'Arabic Typesetting', designed by Mamoun Sakkal and Paul Nelson for Microsoft. It isn't shipping yet, so far as I know, but it was completed this year and was one of the winners in the last TDC type design competition. <br> <br><img src="http://www.typophile.com/forums/messages/30/22349.gif" alt="Arabic Typesetting"> <br> <br>Full disclosure probably requires that I mention that I designed what I think is a competent and attractive Latin for this typeface, but it's really all about the Arabic which is not only a fine design but also an incredibly complex and clever piece of OpenType work.</p>
