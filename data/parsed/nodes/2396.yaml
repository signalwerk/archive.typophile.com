    html: <p><a href="http://www.fontbureau.com/fonts/font_frames.tpl?fontname=Amplitude" target="_blank"> Amplitude</a> and <a href="http://www.fontbureau.com/fonts/font_frames.tpl?fontname=Whitman" target="_blank"> Whitman</a>, both from FontBureau, are just wonderful. <br> <br>Amplitude, a sans with 'traps' used as decorative elements is very widely usable, I think, but has a fresh and unique look, fascinating to the eye. <br> <br>Whitman, a serifed text face, manages to be calm, graceful and crisp at the same time. Influenced by Dwiggins, but fresh and different. I hope it will turn out to be a favorite for books. <br></p>
