    html: <p>I haven't seen it used, but there is something about the aesthetic of Prokyon I don't like; it seems slick and emotionally cold at the same time.  <br> <br>Locator, while influenced by Frutiger, like tons of others, manages to have its own look while being very neutral. And it is extremely well done.  <br> <br>I agree with Hrant that Lingua and Amplitude are very original. I just think that Lingua is too odd looking to be very widely used, whereas Amplitude looks to be very adaptable in spite of its quite original look - quite an achievement.  <br> </p>
