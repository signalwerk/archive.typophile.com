  html: <p>What typefaces came out this year that could be called "The Best of 2003?" I'm not suggesting we repeat which faces won awards (but don't rule them out either). Just tell us which faces deserved our attention. <br> <br>_ Make sure it was released in 2003. <br>_ Post images if you have them. <br>_ Say which category it's in (revival, text, display, etc.) <br>_ Tell us why. <br>_ Post a URL to the site or foundry.</p>
