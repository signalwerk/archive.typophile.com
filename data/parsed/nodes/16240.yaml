    html: |-
      <p>Yea! After searching for Vogue for several years, I happened upon “Am Sans” at daFont yesterday. Volker Busse digitized the font (using a few characters from Futura). I’m really pleased since I was beginning to think this font had been lost forever. Volker’s font used a few of the special no. 2 characters and, unfortunately, a Futura question mark. I’m really pleased to find this gem! Here’s the link at daFont: <a href="http://www.dafont.com/am-sans.font">http://www.dafont.com/am-sans.font</a></p>
      <p>Bill</p>
