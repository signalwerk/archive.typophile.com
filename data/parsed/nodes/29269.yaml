      <p>So far I have confirmed in the 'Homage to the Alphabet' book that this is 'Modula Extra Bold'. I have also found that Opti Fonts had this under the name of Ogden, but I can't find it online. A lighter weight (bold?) was once distrbuted by NovelFonts under the name of Obbsidda.</p>
      <p>That's all I have been able to find through my notes. Maybe Mike F. has more info on digital versions?</p>
      <p>- Mike Yanega</p>
