    html: |-
      <p>As a matter of fact, Mike ...</p>
      <p>Other digital versions of Modula XB that I'm aware of are:</p>
      <p>1) <a href="http://www.moorstation.org/typoasis/designers/casady_greene/j_p.htm" target="_blank" rel="nofollow">Kasse FLF</a> from the defunct Casady &amp; Greene folks. The download includes equivalents to Modula Light, Bold and XB (there was a medium weight to Modula too).</p>
      <p>2) <a href="http://fontsfordesign.com/previews/modular.html" target="_blank" rel="nofollow">Modularity</a> from <a href="http://fontsfordesign.com/preview.html" target="_blank" rel="nofollow">Doug Olena/Keystrokes</a>.</p>
      <p>Neither matches the image exactly, but it's the image's characters that have been altered from Modula - especially the c and C - not the fonts.</p>
      <p>Oh, and <a href="http://www.castcraft-software.com/homepage.html" target="_blank" rel="nofollow">Castcraft</a> likely still will sell you their version, but their customer service, er, lacks enthusiam, shall we say?</p>
