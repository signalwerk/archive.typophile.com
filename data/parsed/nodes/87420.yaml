    <p>The OERT project is offering expert type design review service for US$100+ as part of its fund raising efforts to publish some great educational resources for type designers :) </p>
    <p><a href="http://www.kickstarter.com/projects/cosgaya/oert-open-educational-resources-for-typography" title="http://www.kickstarter.com/projects/cosgaya/oert-open-educational-resources-for-typography">http://www.kickstarter.com/projects/cosgaya/oert-open-educational-resour...</a></p>
    <p>Here's the description:</p>
    <p>"This project aims to make high quality learning resources on typography and type design available to every student in the world.  The resources will be completely free and open, like Wikipedia.</p>
    <p>[VIDEO]</p>
    <p>We are teachers of typography at FADU/UBA, the Faculty of Architecture, Design and Urbanism from University of Buenos Aires. This is a free public university, one of the most important universities in Argentina and it has the largest number of students. This year is UBAs 190th anniversary.</p>
    <p>Since the Graphic Design degree began here, Typography has been considered one of the most important subjects of the curriculum. We belong to Cátedra Cosgaya, a teaching team that delivers typography lessons to over 500 students each year.</p>
    <p>To deliver the course, we have been developing and refining booklets to support our curriculum since 1994. We are seeking funding and support to pay for our expert tutors to spend time away from their freelance design practice and update these booklets so that they stand on their own, no longer tied directly to our teaching programme. </p>
    <p>After thoroughly updating  them, we will professionally translate the resources from Spanish into English. We will bring this knowledge to the web under the Creative Commons Attribution Share Alike license so it can be further translated.</p>
    <p>The booklets are currently organized into three sections:</p>
    <p>* Theory<br>
    * History<br>
    * Practical exercises</p>
    <p>We plan to work on each section under a specific Kickstarter project. This is the first, for producing the Theory of Typography. We plan to run two more Kickstarter projects, so that we can learn about the Kickstarter model as we go.</p>
    <p>If you love typography and would like more people to understand why typography and type design is important, and how to do it well, please support our project!</p>
    <p>Part 1: Theory </p>
    <p>[VIDEO]</p>
    <p>The first part of the project provides a theoretical framework to understand the attributes of a font family and introduce the skills involved in typeface design: what ‘structure,’ ‘stroke’ and ‘counter’ mean in this field, what kerning and tracking are all about, how to deal with details and serifs. It also describes how fonts can be used appropriately with a repertoire of approaches to typography for different sorts of publications, from music CD inserts to books, newspapers and magazines.</p>
    <p>Open Educational Resources for Typography will launch in late December 2011. It will be edited, enhanced and improved with the input and assistance of anyone who is interested. We hope your collaboration will help us move the world’s typography forward!</p>
    <p>Thank you!</p>
    <p>(Please note that this project’s funds will be paid to the TeX Users Group (<a href="mailto:office@tug.org">office@tug.org</a>), a USA-based 501(c)3 non-profit organization that is kindly running a ‘Libre Font Fund.' This enables us to receive the funds in Argentina, since Amazon Payments will not usually work outside the USA.)</p>
    <p>Thanks to Diego Levy for helping us to create the videos for this project!"</p>
    <p>And here are the pledges:</p>
    <p>PLEDGE $1 OR MORE<br>
    Join the OERT mailing list, and receive status updates on the progress of the project!</p>
    <p>PLEDGE $5 OR MORE<br>
    All of the above + we'll add your name to the credits sections of the project, both in the footer of each wiki page and in the front of the E-books!</p>
    <p>PLEDGE $10 OR MORE<br>
    All of the above + we'll make your credit a link to your website!</p>
    <p>PLEDGE $15 OR MORE<br>
    All of the above + we will send you a special edition of the final OERT Part 1 in a PDF file designed for printing when the project launches!</p>
    <p>PLEDGE $25 OR MORE<br>
    All of the above + we will email you an exclusive, early review copy of OERT Part 1 in a high quality E-book PDF, and we will look forward to hearing your feedback!</p>
    <p>PLEDGE $50 OR MORE<br>
    All of the above + we will add your logo and link to the Wiki’s Patrons sidebar section, and place it prominently in the front matter of the E-Book!</p>
    <p>PLEDGE $100 OR MORE<br>
    Is there a font you love, or love to hate? For a $100 contribution, you'll get all of the above + one of the expert typographers from our elite faculty will analyse your chosen font for you in depth - as part of the OERT project!<br>
    Estimated Delivery: Feb 2012</p>
    <p>PLEDGE $300 OR MORE<br>
    For type designers, this is a rare opportunity to have your own type design fully tested, reviewed, analyzed and critiqued by one of our experts - all feedback being strictly private and confidential!<br>
    Estimated Delivery: Feb 2012</p>
    <p>PLEDGE $400 OR MORE<br>
    For serious type designers, all the above, plus another of our experts to give your font another deep review a month or two later, so you can substantially improve the quality of your work over time!<br>
    Estimated Delivery: Apr 2012</p>
    <p>PLEDGE $500 OR MORE<br>
    All the above + join the OERT editorial board and contribute to the project at a high level!</p>
