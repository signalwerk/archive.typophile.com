      <p>Hi, Richard. Thank you for your interest in the project OERT and your questions.</p>
      <p>We (Marcela Romero, Natalia Pano and I, who are promoting this initiative) have convened to work with us to young typeface design graduates and digital foundries members. Also, we will provide them a form of analysis for the work easier. We will soon to announce their names. </p>
      <p>The project originates from the collection of typography booklets distributed (in Spanish) among students of the <a class="freelinking external" href="http://www.catedracosgaya.com.ar" rel="nofollow">chair of typography</a> which I coordinate at the University of Buenos Aires. These booklets contain an introduction to typeface design and design criteria for the use of fonts on publishing projects (newspapers, magazines, books).</p>
      <p>The project is intended to edit the content and translate it into English. Since then, may be enriched with the contribution of the whole type-community, which you can access it as free.</p>
      <p>I wish I write and spoke English, but I can only do so thanks to Google Translate ;-)</p>
      <p>I remain at your disposal for any further questions.</p>
      <p>Thanks!</p>
