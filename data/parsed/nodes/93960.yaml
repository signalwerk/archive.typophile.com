    html: |-
      <p>A lot depends on how you want the Hebrew text to appear relative to the basic text, and that probably depends on the context. If you're talking about the Hebrew words, it might appear differently than if you were just including a Hebrew expression much as you might a common French expression.</p>
      <p>The Davka family of Hebrew fonts probably has a sufficient inventory all in one place to give you as many options as you might need.</p>
      <p><a class="freelinking external" href="http://www.davka.com/cgi-bin/product.cgi?product=568" rel="nofollow">http://www.davka.com/cgi-bin/product.cgi?product=568</a></p>
      <p>Scroll down until you can follow the links to the sample images (they're small, but should be adequate).</p>
      <p> - Herb</p>
