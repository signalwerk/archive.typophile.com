    html: |-
      <p>First off, your link should be <a href="https://www.kickstarter.com/projects/omarsandoval/topographic-typographyworld-geography-thru-visual" title="https://www.kickstarter.com/projects/omarsandoval/topographic-typographyworld-geography-thru-visual">https://www.kickstarter.com/projects/omarsandoval/topographic-typography...</a></p>
      <p>Second, I'm not sure this is the best place to promote your kickstarter page, but I'm new here.</p>
      <p>About the concept itself... For me, I like your idea of matching typography with topography, but I'm not convinced that the final prints as shown on the page, are the best way to represent this idea. The main problem is the use of typography as the medium for the art. I like the concept of type as medium, but it feels forced when one particular font is used which could never represent everything in a city. You are trying to give equal weight to a typeface and a city- the city will win every time. I think the concept works better if there's a focus on particular person/building/etc. (see <a href="https://www.behance.net/gallery/vader/698371" title="https://www.behance.net/gallery/vader/698371">https://www.behance.net/gallery/vader/698371</a> ). In that case, the typeface isn't relevant but the type tells a story. </p>
      <p>Right now they feel a bit "ASCII art"-like to me and I sense you have the ability to go way further. I'd like to see you persist with the concept. Best of luck and never stop designing.</p>
