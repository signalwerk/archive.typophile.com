    <p>We've had the thread: <a href="http://www.typophile.com/node/31976">Brush Scripts c 1940s movie poseters</a>, but I'm more interested in the horror genre. There might be a thread, but my advanced search (using google) doesn't show anything on the first 5 pages. </p>
