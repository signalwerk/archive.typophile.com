  html: |-
    <p>We run OS 10.3.9 on an older Mac (family use). I’ve installed various fonts via Fontbook.<br>
    – In Mail, I can access all fonts.<br>
    – In TextEdit, I see “Baskerville” only in the font’s palette while the text gets rendered in some Helvetica (?).<br>
    The more odd, the proprietary Mac fonts palette appears differently in both applications:<br>
    .<br>
    </p><div class="imageWrap"><img src="/files/mac_fonts_6031.jpg"></div><br>
    .<br>
    Does anyone have a clue to this?<br>
    Any help is much appreciated.<p></p>
