      <p>The problem with the top ones (th3 girls) is that you're mixing small caps with lowercase. It also looks like you have 'the' scaled back, so the contrasting weights of the strokes don't mesh well either. </p>
      <p>If you did want to explore that direction further I'd say you would need to go all small caps. I would also set the type on the same line. That way might be rather simplistic (possibly boring) but I think Eplica gives enough flavor to the characters, that it might work. And of course if additional flavor is needed, you can always edit the characters to your liking.</p>
      <p>I do like the lower experiments here with mrs. eaves. You're right about the italic working the best too. The one issue that may (or may not) become a problem will be that people might read it as 'the 3 girls'. Good stuff though.</p>
      <p>Yeah, dots not workiiing.</p>
      <p>--<br>
      <em>penn</em></p>
