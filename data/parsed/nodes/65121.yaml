  html: |-
    <p>Hi all, I'm working on a rebranding of a trio of female photographers, they were previously "random grouping of initials" photography and want to develop a more distinct identity to stand out in a crowded marketplace, and after some soulsearching have decided to go with simply "the girls" since that's how they're often referred to anyway.</p>
    <p>They wanted to avoid the standard photography cliches of camera, lens, scripty typeface, etc., and wanted something feminine but not overly feminine that had a bit more of a fashion feel to it. I did some research and liked the idea of using a symbol that represented the 3 of them, and after running across a diagram of an exposure triangle I found interesting I developed this mark. To me it leans feminine and evokes a flower shape without being explicitly floral, has the abstrat photographic reference of the exposure triangle, could be used with or without the type, and should apply well across a variety of media. The typeface is Proxima Nova (please forgive the pixelation, using a screengrab as I haven't purchased the typeface yet). Thoughts?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/girls02_bw_6530.jpg"></div><p></p>
