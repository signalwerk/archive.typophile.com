      <p>In any case, unfortunately, the client isn't totally on board. They're not opposed to integrating the idea of three somehow (dots, lines, etc.) but the very stylized serif idea just didn't work for them (the exact comment was that they "thought that was a cool idea, but we're still drawn to the straight, simple, modern font (i.e. sans) similar to what we showed you"). In other words, something in the almost purely typographic sans arena.</p>
      <p>So I'm debating...I've been looking at some slightly stylized sans (Tondo or Bree were possibilities) but I'm worried it's going to be tough to convey a lot of personality in a really simple sans. Another thought was something like the example, combining the "3" idea with a nicely compatible sans (Mr Eaves) and letting that be the focus of the logo. I don't know that this quite works (definitely kerning adjustments needed) but I think the idea is on the right track. Thoughts? (penn, I'm going to play with the teardrop thought, interesting idea.)</p>
