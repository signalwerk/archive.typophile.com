      <p>First was the "TH3" idea. I tried it in several different typefaces and didn't really find anything I loved. I felt like these with Reminga, Eplica, and Meta Serif were the best of the group but I don't love any of them, definitely need to work with the weights if I went this direction.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/th3girls_4720.jpg"></div><p></p>
      <p>The "3irls" idea I actually found a lot more success with. After running through a number of different typefaces I found that Mrs Eaves has an attractive 3 that really lent itself well to work as a g, then a bit more playing revealed that it's actually a absolutely beautiful italic character (I'm really liking the bottom choice).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/3irls01_5435.jpg"></div><p></p>
      <p>And a look at it subsituting the dots as the i, which is ok but doesn't say much to me. I feel like this could have some potential, may do some more sketching/playing with it.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/girls_dot_5451.jpg"></div><p></p>
      <p>Any thoughts? Thanks.</p>
