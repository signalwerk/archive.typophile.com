  html: <p>Anyone know the name of <a href="http://payload109.cargocollective.com/1/4/154243/4494305/blue1.jpg" rel="nofollow">this</a> typeface? The uppercase legs remind me of <a href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Simple/" rel="nofollow">Simple</a>, but it's not quite the same. Anybody have a clue?</p>
  html_clean: <p>Anyone know the name of <a href="http://payload109.cargocollective.com/1/4/154243/4494305/blue1.jpg" rel="nofollow" class="link-external">this</a> typeface? The uppercase legs remind me of <a href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Simple/" rel="nofollow" class="link-external">Simple</a>, but it's not quite the same. Anybody have a clue?</p>
