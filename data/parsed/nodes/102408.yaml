    html: |-
      <p>It’s a version of <a class="freelinking external" href="http://lineto.com/The+Fonts/Font+Categories/Headline+Fonts/Lutz+Headline/" rel="nofollow">Lutz Headline</a>, with elements of <a class="freelinking external" href="http://lineto.com/The+Fonts/Custom+Typefaces/Alpha+Headline/" rel="nofollow">Alpha Headline</a>, probably reserved for proprietary use by its designer, Cornel Windlin.</p>
      <p>See also here:<br>
