      <p>Armenian: largely because we have a floating emphasis mark that can be placed on any vowel we don't need Italic nearly as much; it's much more acceptable to have an Armenian font without an Italic. Another Armenian "issue" with Italic is that the script <em>normally</em> likes to be slanted...</p>
      <p>Color: I remember John Hudson saying that Ethiopian uses red like Latin uses Italics.</p>
