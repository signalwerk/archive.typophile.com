      <p>As Chris Harvey said, in Korean you can use dots above the letters. However, this is rather old-fashioned, and you hardly ever see it nowadays.</p>
      <p>There is a rather specialized way of emphasis where a different style is used for foreign terms. This is similar to how foreign terms are italicized in English, except that in Korean, foreign proper names are also given this treatment.</p>
      <p>The style of the basic Korean text face, the equivalent of a serif roman, is a brushy serif known as 'myeongjo' or 'batang'. In my earliest elementary school textbooks, I remember that foreign terms were set apart by the use of the 'sunmyeongjo' style, which uses the Chinese 'Song' style serifs. In many contemporary Bibles, foreign terms are set in sans serif, like this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/proverbssample_6216.gif"></div><p></p>
      <p>In older bibles, where the text is set vertically, you may see single or double lines to the right of the terms, in the vertical analogue of the underline.</p>
      <p>However, the practice of setting foreign terms apart stylistically is very rare and I don't recall seeing it outside of those two examples. Korean uses so many foreign terms nowadays that it would be really impractical to mark every single instance.</p>
      <p>I haven't made a statistical analysis, but I'd say using bold (most often mechanical bolding) is the most common way of emphasizing nowadays. Other schemes are seen, such as switching to sans serif, changing colour, underlining, even mechanical slanting (shudder). I suspect this mostly has to do with the options provided by the word processing software, and no universally accepted standard has emerged. In practice, in many if not most serious books, you would hardly see any instance of visual emphasis of specific words or passages at all.</p>
