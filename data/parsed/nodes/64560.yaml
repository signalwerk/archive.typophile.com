  html: |-
    <p>Most languages seem to be okay with the use of weight (eg. bold) to call out specific words or passages within body text. Italic seems to be more problematic for languages like Japanese and for say Arabic. Anyone aware of any other language-specific conventions? For example is color commonly used in some languages, or switching style (switching to sans-equivalent within serif-style body text), perhaps underlining, size changes, reversing-out, yellow highlighter etc., etc.,? Any specific examples would be appreciated.   </p>
    <p>Thanks! Si</p>
