      <p>In Japanese novels and magazines, those dots are indeed the most common way of adding emphasis. In manga and comic strips, katakana (the syllabary with the more angular-shaped characters) is more likely to be used as emphasis. In fact, the use of katakana parallels italics in English in many ways — emphasis, foreign words, scientific plant and animal names, etc.</p>
      <p>On websites, brochures, signs, and other informal materials, Japanese quotation marks are often added for emphasis. The translation agencies I work for often want to carry these over into translated materials, and I have to explain that English quotation marks are purely quotational rather than emphatic and give the text an ironic effect if used unnecessarily.</p>
