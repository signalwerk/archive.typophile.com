      <p>The Tai Viet script of SE Asia (used for the Tai Dam language and others) has an interesting typographic tradition. Instead of bold or italic, emphasized words are written larger, with an increase in 'x-height' and more compressed. This is reasonably common practice when writing the script. it occurs even within a paragraph, but here's a good sample of a heading.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/TDHead_6005.png"></div><p></p>
      <p>When creating a 'bold' variant of our font, we considered creating a different 'emphasis' style altogether instead. The problem is that once the B and I buttons appeared on our word processors, the world got this idea that every font had to have a heavier-weight bold, a slanted italic, and (shudder) a sometimes terrible bold italic. We had limited time to choose what the 'bold' would look like, so we took the faster, easier, and more accepted modern choice - we added weight to the regular. </p>
      <p>So while there are some interesting and useful written traditions for emphasis using style variations, I'm afraid they are dying out rapidly.</p>
      <p>v</p>
