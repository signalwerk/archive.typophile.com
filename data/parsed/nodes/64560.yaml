      <p>Good question! This might not be the best place for an elaboration but I'll answer it here because it might be useful for other scripts. (Plus I don't know where else I'd do it...)</p>
      <p>I try to balance authenticity and functionality, and the furthest I've taken this is in the "multilateral" Nour&amp;Patria* system:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/NP-System_5097.gif"></div><p></p>
      <p>* <a href="http://themicrofoundry.com/ad/CR.pdf" title="http://themicrofoundry.com/ad/CR.pdf">http://themicrofoundry.com/ad/CR.pdf</a></p>
      <p>Modernists hate the complexity, but I maintain that the "dialog" between scripts is necessarily complex (and you guys know what I think of Modernists :-). So basically the Armenian is slanted (because that's a good thing), the Latin's Italic is slanted the same degree, and each script has a subordinate for the other script. The Latin's subordinate Armenian is upright; it has too many serifs and the x-height is too big*. The Armenian's subordinate Latin is slanted, but it's not Italic; I actually love it, and I have a feeling it can be used to set quite long text (not too small though) but I also have to admit that it's idiosyncratic. The subordinates are "flawed", but it's actually in a way that helps them serve their master design well. This system of both parallels and hierarchies handles a very wide range of typesetting challenges. Fonts that have one cut for Latin and one cut for Armenian are almost always culturally inauthentic for one of the scripts, plus they're one-dimensional in terms of solving typographic problems.</p>
      <p>* Sadly the crushing majority of Armenian fonts are like this.</p>
      <p>Now, it would be nice to have an "Italic" for the Armenian. But people shouldn't see that as remotely equivalent to the need for an Italic in Latin.</p>
      <p>The main thing I think is not to overly damage authenticity by forcing a script to adopt the typographic conventions of another script.</p>
      <p>hhp</p>
