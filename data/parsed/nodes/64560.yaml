      <p>We're veering away from style differentiation, but hey.</p>
      <p>Uncial: one thing I'd love to see is a font where the caps are uncial, as opposed to the conventional Ancient Roman.</p>
      <p>Hugh Schoenfield: the caps business is useful, but overall his results were pure freak-show. Not to mention that they suffered from a serious cultural inferiority complex (aided by a nice strong shove from an apparently deeply chauvinistic Morison, in the introduction to the book).</p>
      <p>Caps in a Semitic language: I've seen one very nice proposal for Arabic, where each letter has sort of a "roof" added to it (but a nicely executed, flowing structure).</p>
      <p>hhp</p>
