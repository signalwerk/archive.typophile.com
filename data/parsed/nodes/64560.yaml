      <p>•Slanted (first two lines in orange)<br>
      •Sans-serif (Leo Huberman’s name)<br>
      •Angled brackets (throughout, both single and double)</p>
      <p>Interesting that you bring up the angled brackets. The single and double angled brackets are something of a remnant from vertical typography that is finding new life in a more specialized use.</p>
      <p>The angled brackets 『…』 and 「…」 are identical to the forms that were used for vertical typography, except rotated 90 degrees counterclockwise. (Korean was traditionally written vertically, but in the last century has switched to writing horizontally, with the last holdouts—newspapers—making the transition in the last couple of decades.) In addition, there are also the forms 《…》 and 〈…〉 that are becoming quite common in horizontal typography (the Korean Wikipedia uses these).</p>
      <p>These used to be just quotation marks, interchangeable in horizontal typography with “…” and ‘…’. But since the different forms are available, it is only natural that they have adopted different functions. Increasingly, “…” and ‘…’ are used to mark speech and quotation, while 『…』 and 「…」 or 《…》 and 〈…〉 are used to mark titles of works, in the same way italicization and quotation marks are used in English (e.g., <em>Macbeth</em>, “Hey Jude”). In the past, the same set of quotation marks were used for both quotations and titles of works, but the availability of different forms of quotation marks has made the new distinction possible.</p>
      <p>In the link Chris Harvey provided above, the angled brackets are all used for titles of works. These days, it is very rare to see angled brackets used for anything other than titles of works, which wasn't necessarily the case even a couple of decades ago. You would probably never see angled brackets to mark quotations in a Korean text produced today in South Korea.</p>
