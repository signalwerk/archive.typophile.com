      <p>It is true that there are still some general things one can do in choosing fonts in very different languages. As noted, there are Chinese fonts that are built from plain geometric lines, in addition to the conventional ones that are based on the traditional means of writing Chinese characters with the brush.</p>
      <p>While I have seen a specimen of a Chinese font designed to have serifs like a Roman font, though, in general one would not manipulate a Chinese font to more closely match a Roman font. Chinese fonts, unlike Armenian ones, do not have an x-height to tamper with.</p>
      <p>I wasn't trying to say that taste should not govern one's choice between valid typefaces for each of the languages used, so that the two might harmonize in style. Rather, I was noting that the more a script differs from the Latin script, the less there is a temptation to modify that script in ways inappropriate to that script in order to make it look more like another script, as in the example of Armenian above.</p>
