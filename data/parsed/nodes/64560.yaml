      <p>Maybe related: As Fraktur typefaces rarely have a bold companion (and hardly ever an italic), the preferred practice of emphasis was tracking. Also common: style-switching (e.g. Fraktur with Bastarda).<br>
      In Textura typefaces, tracking was rather unusual. A bigger point size was used for emphasized passages.<br>
      All-caps was a no-no, for obvious reasons. But capitalizing the first two letters was an accepted method – not only in ‘GOtt’.</p>
      <p>C.f. Friedrich Forssman: <em>Satzregeln für gebrochene Schrift</em> [Blackletter typesetting rules], in Forssman/de Jong: <em>Detailtypografie</em> (also to be found in J. Schalansky: <em>Fraktur Mon Amour</em>)</p>
