      <p>Andreas, if by "incorporate" you imply making the scripts equal in presence (with the higher goals of authenticity and functionality) I personally believe the most one should do for Armenian and Latin is what I've done with the master designs of Nour and Patria. For other scripts you can safely get closer, but for others (think of Arabic and Latin for example) there are even greater limits.</p>
      <p>What I'm saying is I don't believe in using formal geometric congruence as a basis for multi-script families; things like uniform x-heights can be great for display work, but not for immersive text. Scripts simply have different needs, and enforcing vertical proportions etc. in effect causes each script in a font family to have different uses! Very dysfunctional for a typographer. Look at Sylfaen for example: the Latin is a decent text font, but the Georgian is like an equivalent to Quadraat Headliner!<br>
      <a href="http://www.fontfont.com/shop/view_product.ep?id=12464" title="http://www.fontfont.com/shop/view_product.ep?id=12464">http://www.fontfont.com/shop/view_product.ep?id=12464</a></p>
      <p>The problem with what I'm saying is that the necessary design effort goes up exponentially with the number of scripts in a system... But good design is very rarely quick &amp; easy.</p>
      <p>*<br>
      **<br>
      **** (ON-TOPIC ALERT! :-)<br>
      **<br>
      *<br>
      Victor, interesting. And you've reminded me about Georgian: although I don't actually know if this is any kind of convention, Georgian has one case, but two styles - one with extenders and one lining; and the latter is sometimes used for emphasis in a body of the former (which is naturally more texty).</p>
      <p>&gt; line up their baselines and the tops of their ascenders</p>
      <p>That doesn't always work...</p>
      <p>John, as you can probably tell I agree with your general view, however it <em>is</em> possible to be more discriminating: there <em>are</em> ways that two scripts can fruitfully match up, like color, and hopefully apparent size. I've tried to do that in Nour&amp;Patria.</p>
      <p>&gt; “t-height”</p>
      <p>I call it "ւ-Հասակ" (pronounced "hyun-Hasag") = "yiwn-Height".  :-)</p>
      <p>hhp</p>
