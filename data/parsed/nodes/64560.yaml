      <p>On the topic of making one language look like another...</p>
      <p>I remember reading that our present lower-case alphabet is the result of a mistake made by (those working on behalf of) Charlemagne. They assumed that the uncial writing in current use was a faithful representation of a Roman hand.</p>
      <p>We now have authentic specimens of Roman uncial, in which a few additional letters (like N) looked like their upper-case counterparts. Given all the bold and strange things type designers do nowadays, a typeface in which "Charlemagne's mistake" is undone would not seem particularly bizarre.</p>
      <p>But to go even farther... as we know, lower-case, with descenders and ascenders, is more legible than all upper-case.</p>
      <p>In web searches, I did find the novel script devised for Hebrew by Hugh J. Schoenfield, author of "The Passover Plot", which provided an upper-case and a lower-case.</p>
      <p>Other than that, though, I couldn't find a less radical approach to that which I thought would have occurred to someone. The original Phoenician alphabet - or the early forms of Hebrew writing that closely resembled it - was written with parts of the letters functioning as ascenders and descenders, so it could serve as a lower-case script in partnership with the existing square script as the upper case. (Presumably in a sans-serif version that tries to look like Helvetica or Univers.)</p>
      <p>Has this already been done?</p>
