      <p>If you don't want to subordinate one script to another, clearly you don't have to. If Chinese or Arabic are quoted in an English text, one doesn't seek to find a Chinese or Arabic font that somehow matches with a Roman font.</p>
      <p>This is usually true even in the case of, say, Gujarati, or Ethiopic, where one could, if so inclined, try with reasonable effort to make a matching font.</p>
      <p>So one could take an Armenian font designed without reference to Latin, a Roman font designed without reference to Armenian, line up their baselines and the tops of their ascenders - and not worry even about the descenders being different, let alone trying to match "x-heights" (in the case of Armenian, the term is really a misnomer, and not just because it should be "t-height" - the visual function of that space is fundamentally different in that script).</p>
