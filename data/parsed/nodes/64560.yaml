    html: "<p>All official documents of the United Nations are routinely published in six languages: Arabic, Chinese, English, French, Russian and Spanish (German is the seventh, unofficial, language). Their formatting is cross-language-consistent, although different typographic features are used to interpret the structure and the hierarchy of the texts in different language versions of the same documents. Roman, italic and bold styles are used in English, French, Russian and Spanish. Upright, [back]slanted and boldface are used in Arabic. In Chinese language versions Song, Kai and Hei styles play the role of the Western roman, italic and bold, respectively. <em>Note</em>: bold italic, underline, double underline, outline, shadow, small caps, redline, and strikeout styles are [normally] not used in the formatting of the UN documents.</p>"
