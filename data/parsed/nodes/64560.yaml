      <p><a class="freelinking external" href="http://typophile.com/user/33839" rel="nofollow">Chris_Harvey</a> wrote: <cite>Korean and Japanese (and presumably Chinese) use dots above the character instead of italics.</cite></p>
      <p>The use of this technique in Chinese is practically non-existent, apart from the stray case where the book in question was translated from the Japanese. In Chinese, terms that require special emphasis are normally marked off with quotation marks 「」 like this: 「這一樣」。You will frequently encounter books printed in Chinese without a single variant in either weight or style.</p>
      <p><a class="freelinking external" href="http://typophile.com/user/50554" rel="nofollow">quadibloc</a> wrote: <cite>If you don’t want to subordinate one script to another, clearly you don’t have to. If Chinese or Arabic are quoted in an English text, one doesn’t seek to find a Chinese or Arabic font that somehow matches with a Roman font.</cite></p>
      <p>This statement is patently false if we are speaking not of necessity but of expediency. The fundamental problem of combining type (Which Roman with which Italic? Which Serif with which Sans-Serif? Which display face with which book type?) does not change when we are also combining languages on the same page and especially on the same line (as in the case of a "quote").</p>
      <p>In the case of Chinese and Japanese, for example, quite evidently a Roman Sans-serif/Grotesk typeface can be justly combined with a Gothic[黑體] face, and a Serifed face should best be combined with a either a Ming [明體] or standard script [楷書] typeface.</p>
      <p>The solution however it not always so easy, and requires that one know how to set type in both languages independently before attempting to combine them together!</p>
