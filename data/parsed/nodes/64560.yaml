      <p>Ideally, yes, one designs with the right frame of mind. This requires, as a most basic precondition, familiarity with the typographic conventions and fashions of both languages involved.</p>
      <p>My emphasis was on not trying to do too much if one is not starting from this position. If one is mixing two languages, and one is not familiar with what is acceptable or readable in one of those languages, then it is reasonable to say that one shouldn't do violence to the font used for that language in pursuit of a visual harmony between the two languages.</p>
      <p>Readability of both of the texts should take precedence over artistic goals.</p>
      <p>Of course, the balance involved is very different depending on the application. One can distort fonts that are appearing in 48 point in an advertisement to be striking and noticeable - and so that two different languages will match - and thus creating, say, an Arabic version of Kabel or Stop or Neon is entirely reasonable there - whereas if one is typesetting an academic paper with foreign-language quotations, then of course one just takes the routine standard fonts for each language involved, with no attempt to engage in any funny business.</p>
    html_clean: |-
