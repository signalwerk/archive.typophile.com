      <p>(Sorry Simon - I think I won't take this any further now...)<br>
      To emphasize words you use the floating emphasis mark. For citations you use quotes (guillemets). The tricky thing is emphasizing more than one word at a time. Historically people have used a different font for this purpose (certainly not very nice) but one reason is that besides missing italics Armenian fonts rarely had more than one weight. And that brings me to how I think text should generally be emphasized, even in Latin: a demi weight! Not dark enough to wrest attention from the reader, but dark enough to be noticed one saccade away. Typo magazine does this (still, I hope) to great effect. So I make my fonts with finely gradated weights (and my Bolds tend to be pretty light).</p>
      <p>hhp</p>
