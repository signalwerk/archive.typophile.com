      <p>I have a suspicion that the Gothic [黑體] varieties of Chinese characters were developed specifically to be like the roman sans serif. The the normal printed characters, which are a dialectic combination of carving and brushing, appear to correspond to the roman serif typefaces, and so the development of a sans serif counterpart seems to have emerged in the early republican period in China (ie after 1911). I don't recall having seen any woodblock printed texts with gothic/hei characters. Missionary presses in Shanghai would be a good place to look, although I don't know what the situation was in Japan. Of course nowadays, books basically use a light or medium weight of Ming or less commonly fangsong for body text. Heads are done in either a heavier ming or heiti. Kai is never used for body text, but for emphasis or quotations. </p>
      <p>If the publication is in a roman font, then probably a ming would be safest for cjk glyphs, choosing a weight that matches the color of the English font. The Harvard Journal of Asiatic Studies did pretty well even back in 1945 (although the glyphs should be lowered to approach but not reach the depth of the descenders): </p><div class="imageWrap"><img src="http://typophile.com/files/hjas_5531.png"></div><p></p>
      <p>Now (2009) it uses arno pro and adobe mingstdlt:</p><div class="imageWrap"><img src="http://typophile.com/files/hjas3_6290.png"></div><p></p>
      <p>Here the characters look a little light, could be lowered, and need more space between the glyphs and roman letters. My thinking on baseline alignment and overall page color can be explained with this next image. The red rectangles need to be about the same height:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/hjas4_5690.png"></div><p></p>
      <p>What I have in mind is something like this: </p><div class="imageWrap"><img src="http://typophile.com/files/hjas5_5748.png"></div><p></p>
      <p>The characters may seem a little low at first, but the consistency in page balance will win you over shortly...</p>
      <p>Disclaimer: this may be a tangent.</p>
