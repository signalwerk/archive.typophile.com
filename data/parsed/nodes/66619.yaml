    html: <p>There is indeed no unanimity in Canadian English about hockey jersey (cf. “third jersey”) vs. hockey sweater (cf. classic animated short film <cite>The Sweater</cite>). I think material of construction is important. Classic Canadiens jerseys are really sweaters. 1990s Phoenix Coyotes sweaters, which were an absolutely amazing example of 3D graphic design, were really jerseys.</p>
