  html: |-
    <p>Hi all Typophiles,</p>
    <p>Having just released my first three commercial fonts at <a href="/wiki/Veer" class="freelinking" rel="nofollow">Veer</a> as part fo their <a href="/wiki/Umbrella" class="freelinking" rel="nofollow">Umbrella</a> Type Library. I thought I celebrate it (other than drinking beer) by giving a little teaser here. The fonts are Navelfluff, Trentor and Trentor Script.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/veer_releases_4378.jpg"></div><p></p>
    <p>More of the fonts can be seen at my studio’s webpage, <a href="/wiki/Autodidakt" class="freelinking" rel="nofollow">Autodidakt</a> or at Veer.</p>
    <p><a href="http://www.autodidakt.se" title="http://www.autodidakt.se">http://www.autodidakt.se</a></p>
    <p>Currently I’m working on several other projects, which hopefully can be spotten in the near future aswell.</p>
    <p>Thanks all you guys who helped me with all my stupid questions I had along the way, producing these fonts :)</p>
    <p>Cheers</p>
    <p>Göran Söderström</p>
