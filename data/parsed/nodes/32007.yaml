      <p>I'll add my voice to those who recommend considering the structure of the font, as Robert Bringhurst advocates in <em>The Elements of Typographic Style.</em></p>
      <p>Consideration of the structure involves looking at such characteristics as:<br>
      <strong>art/design movement</strong> (renaissance humanist and neohumanist/lyrical modernist forms [Venetian, Garalde, etc.], baroque/rococo form, neoclassical/"transitional" form, romantic/"modern" form, realist form [Victorian, clarendon &amp; Swiss gothic forms], geometric modernist form [such as Futura, Memphis and the like], various postmodernist forms, etc.)<br>
      <strong>aperture</strong> (degree of openness or closedness of forms such as "c", "e", "a", "s", etc.)<br>
      <strong>direction of axis</strong> (humanist [oblique], rationalist [vertical] or variable),</p>
      <p>Other characteristics less relevant to structure, but still worth considering when choosing compatible fonts, include:<br>
      <strong>stroke</strong> (modulated or monolinear),<br>
      <strong>terminal shape</strong> (pen-formed, modeled, lachrymal [teardrop-shaped], round [ball-shaped]</p>
      <p>A great place to start in choosing compatible typefaces is to choose serifed and sans-serifed fonts with basic structural characteristics in common, such as:</p>
      <p><em>Geometric modernist fonts:</em> Beton, Candida, Marathon, Memphis, Rockwell or Stymie, etc.<br>
      <em>or romantic/"modern" fonts:</em> Bodoni, Bulmer, Didot or Walbaum, etc.<br>
      <em>paired with:</em> Avenir, Futura, or Kabel, etc.</p>
      <p>Or, <em>Realist-structured fonts:</em> Belizio, Clarendon, Glypha, Serifa, Volta, etc.<br>
      <em>paired with:</em> Akzidenz-Grotesk, Folio, Helvetica, Imago, Univers, etc.</p>
      <p>Or, Renaissance-based <em>humanist and neohumanist fonts:</em> Albertina, Aldus, Bembo, Berling, PMN Caecilia, Chaparral, Dante, Garamond, Golden Cockerel, Joanna, Minion, Palatino, Plantin, Poppl-Pontifex, Scala, or many others,<br>
      <em>paired with:</em> Frutiger, Gill Sans, Myriad, Linotype Projekt, Scala Sans, Syntax, etc.</p>
      <p>As has been said already, these cannot be hard-and-fast rules. Even within similar structures, some pairings will work better than others, so use your own creative and critical judgement. However, once you have a good grasp of <em>similarly-structured</em> font pairings, you will be better-equipped to try your hand at effectively pairing fonts with <em>contrasting</em> structures.</p>
      <p>David Thometz</p>
