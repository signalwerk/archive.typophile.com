    html: |-
      <p>"Some types which don’t seem to work together at similar sizes may work fine when one is much larger than the other."</p>
      <p>Yes. Often, you will be able to nudge one font up or down several points in size to compensate for different apparent sizes or x-heights/body sizes.</p>
      <p>You can also find surprising compatibilities between otherwise dissimilar types. For example, Joanna (a neohumanist slab-serifed font) looks beautiful when set with Fournier Italic (a neoclassical/transitional font). And the expressionist Post Mediaeval Italic makes a nice companion for Marathon, a more geometrically structured expressionist roman. And Centaur Roman (or Jenson) works beautifully with the blackletter San Marco used as a contrasting type for emphasis. The pen script El Greco, with adjustments made for size, makes an interesting italic companion for Raleigh, and so forth.</p>
      <p>Experiment and try new and unexpected combinations, but do it as knowledgeably as you can for the best results.</p>
      <p>David Thometz</p>
