      <p>This question often arises and I hope I don't sound like a robot as my answer is always the same: don't worry so match about compatible typefaces. Nearly any two types can work together. Pick typefaces that fit your subject and audience. If they are right for the project, they are right for each other.</p>
      <p>An exception: when using two distinct typefaces within a single line or paragraph, try to match general proportions (asc/descender length and x-height). Or, pick a <a href="http://www.fontshop.com/virtual/newsletters/jun2006_b/" rel="nofollow">font suite</a>.</p>
