    html: |-
      <p>There was a time when I would have called Belwe ugly too -- back when it was so overused as to make a designer cringe at the very sight of it. But now I see it as it is -- a very late Arts-&amp;-Crafts-era (1926) type that was designed as a creative interpretation of Jenson, and revived in the 1970s when such styles were popular again. As such, it can be a useful choice for period work.</p>
      <p>It may not be fashionable right now, but I wouldn't call it ugly, any more than I would call other Arts &amp; Crafts or Art Nouveau styles ugly. It's all in how they're used in a design.</p>
      <p>Believe it or not, young designers, there will come a time when many of today's stylish types will be derided by a new generation. :)</p>
      <p>Having said that, however, I wouldn't have thought of pairing Belwe with Helvetica. The two have some definite structural incompatibilities, although the x-heights and proportions work together better than I would have guessed.</p>
      <p>Instead of the Swiss neo-grotesque Helvetica, I might look to other Arts-&amp;-Crafts-era grotesques, such as Monotype Grotesque, Venus, AG Old Face, or Akzidenz Grotesk. Or, since Belwe has a relatively open, somewhat geometric structure, look to other geometric sanserifs like Kabel or even Peter Bruhn's Mercury to pair with with Belwe (those stylized lower-case "g"s look like they were made for each other). Barmeno, Legacy Sans or other Jenson-derived sanserifs might be other options.</p>
      <p>David Thometz</p>
