    html: |-
      <p>Looking at the structure of the typefaces is another (related) method of choosing typefaces. For instance, Bodoni is very geometric and has a very vertical stress that matches well with the grotesques and neo-grotesques like Helvetica. </p>
      <p>But neither of them match something like Galliard because of it's diagonal stress and humanist shape.</p>
      <p>That's one reason to look at the period in which a typeface was designed, because the era greatly influenced the methods and/or structures on which the letters were built.</p>
