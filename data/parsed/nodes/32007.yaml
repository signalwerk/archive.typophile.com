    html: |-
      <p>The best advice, in my opinion, it that of SUF, which is to say, find examples you like. Take them apart and see how they work. For instance, if you think Frutiger is a perfect marriage for Caslon, then you know you can always invite them together to the party. But try to understand for yourself WHY you think they belong together, and you can apply this to other faces.</p>
      <p>I would avoid any advice that says,"This face and that must never be used together," or "These two faces are perfect together," or even "Just combine faces by that designer."<br>
      Designing with type has to be a reflection of your own tastes, not prescribed rules.</p>
