    html: |-
      <p>This topic recently came up with a colleague of mine who was trying to find a good supplementary face to work with Bembo. At the same time I was designing a new edition in a series, and the publisher had supplied me with a PDF of a previous edition in that series, which I thought was problematic. Here's what I responded with, which may be useful here:</p>
      <p><em>General typographic principle is that serifs don't mix well with other serifs. (For instance, my "problem" with the supplied PDF sample was the combination of Warnock [for body copy] and a clearly Modern type [used for display] -- mixing Renaissance and Romantic proportions = bad news).</em></p>
      <p><em>Such a combination is like mixing a contemporary rendition of classical Italian architecture with some Victorian gothic furniture. Some might call this "eclectic," but to my mind it's just a mess. Thus, in looking for a secondary face for a serif, my instinct (based on the typographic theory that I've read and absorbed) is to go for a sans face (which is what I normally do for supplementary copy [notes, etc.]).</em></p>
      <p><em>But, it can't just be any sans, of course. In my redesign of the series I've stuck with Warnock for the body copy, and selected Quadraat Sans as the second face, because both share similar proporations and also make use of some unconventional hooks and beaks. For instance, here's a comparison of a few glyphs from each where you can see the distinctive "hooks" in a few letters. (The fact that Quadraat will be used at a smaller size [for notes, etc.] will balance the fact that it is quite a bit darker than Warnock.)</em></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Warnock-Quadraat_6621.gif"></div><p></p>
      <p><em>In [my colleague's] case, you're working with Bembo, another classic Renaissance font, yet one that has become somewhat faceless due to over use. That said, it does have some distinctive shapes to it, and is based on classical proportions, so what you want is a sans that has the same. For my money, if I want to find a partner for something like Bembo (or Garamond or Jenson, etc.) I head straight to Legacy Sans. Here's a glance at Bembo &amp; Legacy:</em></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bembo-Legacy_5126.gif"></div><p></p>
      <p>&nbsp;<br>
      <em>Note some if their similarities, such as a connector of the "g," the bracketed crossbar and curled tail of "t," the understated "J" and "Q". These are just a few glyphs scrutinized, but from here you can see that the two have enough in common to likely work well together.</em></p>
      <p><em>Now, you may not be a fan of Legacy, but this sort of process tends to help for me. I just make a sample (like above) and plunk in a few possibilities to go with my body type, then look to see if they have anything in common both in terms of proportions and quirks.</em></p>
