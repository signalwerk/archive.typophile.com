    html: |-
      <p>A few "rules" of things not to do.</p>
      <p>a) don't choose faces that are "too similar" like Helvetica and Univers, for instance.</p>
      <p>b) don't choose faces that are "too different" like a very fine body text (sans) with a super heavy fatface heading -- basically, you don't want the fonts to fight each other. Different slants on the italics can also do this, if there will be a lot of italics happening.</p>
      <p>c) Don't mix your focus ... using a grunge heading with a formal script body, for instance. (Unless this is the statement you are trying to make)</p>
      <p>Set your samples with the options you like ... then put them away for 48 hours. Come back to them and the bad ones will probably stand out and say "Ick".</p>
