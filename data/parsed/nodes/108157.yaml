  html: |-
    <p>I'm looking for fonts (similar to H&amp;FJ's Cyclone) that feature cap-height lowercase alternates, as shown here: <a href="http://www.typography.com/fonts/cyclone/features/cyclone-alternates" title="http://www.typography.com/fonts/cyclone/features/cyclone-alternates">http://www.typography.com/fonts/cyclone/features/cyclone-alternates</a></p>
    <p>If the fonts are stylistically different to Cyclone, but still feature the cap-height lowercase alternates, I'd still like to hear about them. I'm not at all fussed about the inline-style that Cyclone happens to feature. </p>
    <p>Apologies if wrong section. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screen-shot-2014-01-07-at-6_4747.01.16-PM.gif"></div><p></p>
