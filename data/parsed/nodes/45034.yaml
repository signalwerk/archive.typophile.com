    <p>I’m designing a short publication of one of the work done in one of my classes this semester and thinking about having it wire bound. It probably won’t exceed 40 pages so I’m thinking that a perfect binding will just fall apart, and I want it to lay flat so I can talk about it in interviews without having to hold it down. So I want to have it spiral bound. </p>
    <p>My book-arts friends think I’m just some sort of lazy monster, and are trying to convince me to do some wacky stitched binding or some other crazy thing, and say spiral bindings look cheap. Do designers really look down on spiral bindings, or are my friends just being snotty because they want to see everything hand bound from five kinds of paper with printed vellum tip-ins?</p>
