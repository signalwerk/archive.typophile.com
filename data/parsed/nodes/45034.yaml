      <p>Every binding system has its advantages and disadvantages.</p>
      <p>1) Perfect-binding requires a minimum thickness to be effective. I doubt your 40 pages, even if printed on cardstock, will be thick enough. (And if printed on cardstock will probably tear the binding apart.)</p>
      <p>2) Coil or Spiral bindings look nice and come in many colors and sizes. But, because of the nature of the spiral, opposing pages of spreads do not align. One side of the spread will always be lower than the other side. Only a problem if you've got crossovers.</p>
      <p>3) Wire-O bindings are slightly more complex than Spiral (looks somewhat like a wire version of Cerlox), but allow opposing pages of spreads to align. Also comes in many sizes and colors. As Chris mentioned, Coil and Wire-O bindings do not add structural strength to a book, so they tend to be floppy. Using a heavy card back cover to add strength is common.</p>
      <p>4) Saddle-stitching could work, depending on your page size. If doing the stitching yourself, you'll need a stapler that can accommodate the width of your printed page.</p>
      <p>5) Rivets &amp; grommets also come in a variety of colors and sizes. Two options available: a single rivet will make a fanbook (think Pantone swatchbook); a couple rivets in line will seal one side of the book but this uses a lot of space. Anywhere from a half-inch to an inch of each page of your book will become inaccessible to the reader (this is easy enough to design around by adding additional space to each inside margin).</p>
