      <p>If your book art friends think you're a lazy monster, probably some others will too. It's human nature to look down on everyone who uses things not to their liking, and designers, as a generality, are all too human.</p>
      <p>Here's a thought: In a town the size of Washington D.C., there has to be a number of people who teach classes in hand binding. Even in Durham, North Carolina, there are a couple. My wife took a couple of these courses, and most of the projects involved binding books of less than 40 pages. Anyway, for a fee, one of the teachers would probably bind your project for you, with nice covers.</p>
      <p>On a more general note, if you don't mind the art-book people looking down on you for a bit, your schoolwork gets you your first job. You get your second job based on what you achieved in your first job -- You won't be showing your schoolwork during your interviews for the second job. For the second &amp; subsequent jobs, even the school itself is less important than what you've achieved at work. I'd hire a good, productive person who had gone to the local community college over a RISD grad whose professional work wasn't quite as good.</p>
