      <p>It's like using Helvetica ... can be smart .... or cheap. Depends on how you use it. IMO there are are a lot of spiral bindings looking ugly. I hate the plastic bindings but I like the metal spiral binding. A very simple method to make it look less ugly in the eyes of your "book-arts-friends" is to make a hidden spiral binding. You add as last "sheet" to bind no "sheet of paper" but a simple cardboard with the width of approx. 4 times the width of your papersize plus the width of the spine (??correct term??). The cardboard is four times ??channeled/scored??. After binding you can fold the cover.</p>
