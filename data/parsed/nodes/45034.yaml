      <p>Speaking from a user's point of view rather than a designer's point of view, why oppose a far more practical solution because of aesthetical preferences?</p>
      <p>Spiral bindings are probably underappreciated because the coil binding spines are made of plastic instead of traditional materials like leather or paper. The association with cheap spiral-bound notebooks doesn't help either. The difficulty of utilizing the spines for displaying the title of the publication, making identification difficult when shelved, must be another reason it is not used for more expensive projects--they would be harder to display in bookstores and the like.</p>
      <p>I think that's a shame because there are lots of situations where one needs a lie-flat binding, and spiral bindings are hard to beat there. Not only do they lie flat, you get 360-degree rotation at any position in the book. From my own experiences, dense mathematical texts can often benefit from being spiral-bound as one often has to have them open at a single page and take several minutes studying the material on that page, all the while taking notes or solving problems using the page as a reference.</p>
      <p>Using hard covers takes care of the slouching when placed on bookshelves should it become a problem. If the book is really thick, the pages will follow the curve of the coils when closed rather than line up neatly, but that won't be a problem with 40 pages.</p>
