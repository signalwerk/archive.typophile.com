    <p>Hi everyone,</p>
    <p>I am turning to you all as my typophile saviors on this one.  A former employee created an address sign's artwork (for our studio).  As the years have gone by, files were lost, fonts deleted.  Time has come to remake it.</p>
    <p>Any thoughts on what this might be?  The "1" is similar to Century Gothic Bold, but the 2 differs to some degree.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Chadwick_addressSign_sm_6143.jpg"></div><p></p>
    <p>ANY help would be great!!!</p>
    <p>Best<br>
    Daniel</p>
