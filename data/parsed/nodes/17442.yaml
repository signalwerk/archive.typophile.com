      <p>Regarding Unicode: As Chester notes you should use the precomposed diacritic character codes where possible. However, if you are supporting OpenType layout for combining mark characters, either through GSUB in the 'ccm' feature or through GPOS in the 'mark' anchor positioning feature, then you should include glyph variants of the combining marks for uppercase and smallcap letters as appropriate. So, for instance, you might have three glyphs for the combining acute accent. The default form is the lowercase, which is encoded as U+0301; the other glyph variants are unencoded, but are instead accessed using OpenType Layout features. They would be named something like this:</p>
      <p> acutecomb<br>
       acutecomb.cap<br>
       acutecomb.sc</p>
      <p>If you are using the 'ccmp' feature to map from sequences of base letter plus combining mark(s) to precomposed, unencoded glyphs in the font, e.g.</p>
      <p> Adiaresis acutecomb -&gt; Adiaresisacute</p>
      <p>then you don't need the variant combining mark glyphs for such sequences. But you obviously need them if doing GPOS mark positioning, and it is useful to have them in the font even if you are supporting precomposed diacritic glyphs, since some user may employ some combining mark sequence for which you have not provided a precomposed glyph. You might have a precomposed glyph for /Adiaresisacute/, for instance, but not have one for the sequence</p>
      <p> A dotbelowcomb acutecomb</p>
      <p>in which case you want to ensure that the combining acute that follows the capital letter is the correct form and height, even if you have not refined the horizontal positioning using GPOS mark positioning.</p>
      <p>To do this, you need to use a contextual lookup to substitute the cap variant combining mark glyph when it follows an uppercase letter. Since this is a contextual alternate substitution, you may consider using the 'calt' feature, and I think this would be valid. However, since this is probably not something that you want to be turned off by the user along with stylistic contextual substitutions, I recommend putting this lookup in the 'ccmp' feature.</p>
