      <p>Sebilar, you are flying in the face of convention. When one makes special versions of accents for majuscule letters, the habitual solution is smaller/more compact marks, so that a line of all-caps - or several lines of all-caps - stay as compact as possible.</p>
      <p>Also, you should just use the Unicode index for each of the accented majuscule letters. If you want to have the large accents AND an additional set of compact accented caps, you can name them things like Aacute.alt or something, then write a SS01 feature to swap out the one with the other. (Since you already have Titling variants.)</p>
      <p>And in the case of Titling versions of majuscules, you can name them Aacute.titl etc. and assign them Unicode indexes from the PUA (Personal Use Area). Without indices, they can only be accessed through the application of an OT feature; with indices they can be accessed using the Character Palette or InDesign's glyph palette.</p>
