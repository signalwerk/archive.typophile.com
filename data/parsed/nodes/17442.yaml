      <p>I can see why this might be appropriate on a sans serif face.</p>
      <p>But if you flatten the angle of the accent for the cap (or squash down the circumflex), and drop it a bit closer to the letter, then the difference won't be so obvious.</p>
      <p>And those things are important to do, because otherwise any setting other than with lots of leading will result in collisions with descenders.</p>
      <p>The convention is to change the angle for cap accents, to improve leading, rather than change the weight to improve color, which makes leading worse. </p>
      <p>In fact, flattening the angle of accents does make them visually bolder, because horizontal lines are perceived as thicker than vertical lines of the same weight!<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Es.jpg"></div><p></p>
