    <p>Hi,</p>
    <p>I am using FontForge.<br>
    I have a feature while there the rligs are sorted by the number of combinations.<br>
    Glyphs with higher combination comes at the top and the one with less combination goes down in the list.</p>
    <p>When I am merging the feature file using File -&gt;Merge Feature Info, merging happens fine but when I check the Lookup, I find that the sort order is lost.</p>
    <p>There are few thousand ligatures. Its an Arabic Font. </p>
    <p>How do I keep the order of feature file?</p>
    <p>Please help.</p>
    <p>Regards,</p>
