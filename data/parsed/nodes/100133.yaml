    <p>Hey Typophilers,</p>
    <p>It has been a few years since jumping on here, but I am in need of your help. Could you typographers give me any criticism on this rebranded wordmark that I have been developing. It is for the people search engine, known as Spokeo and is supposed to encompass a product that searches social media content to criminal records. There is a lot of brand strategy and thought that went into this wordmark, but rather than include that I want to include a simple neutral greyscale version rather than a sales pitch.</p>
    <p>Here is a brief rundown of what the brand is trying to encompass:</p>
    <p>· A company with all the tools to allow you to search for people and connect with them.</p>
    <p>· A company that exhibits integrity and transparency and is trusted by consumers.</p>
    <p>· A product/tool that aggregates content (not originates) allowing users to reunite and find joy in their connections.</p>
    <p>· A company that is seen as friendly, but not in a cutesy/kiddish way - Neutral.</p>
    <p>· A premium product available at an affordable price.</p>
    <p>· A proactive technology company pushing boundaries and using technology in a positive way.</p>
    <p>· A company with employees that participate in it’s enjoyable lifestyle, rather than just being employees.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Logo-White_5085.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Logo-Black_4594.jpg"></div><p></p>
