      <p>It seems very tight. Are you sure this will work in smaller size? I mean this tight? Or is this a "display" sized version?</p>
      <p>But apart from that I'm pretty sure that /e/ doesn't work. It doesn't complement other letters by its design style. Maybe just an idea as people are so different from each other, there's so much variety what if you'd put an italic transitional serif /e/ here? Maybe even breaking the top and bottom margins? it might complement the other geometric letters better than current /e/...</p>
