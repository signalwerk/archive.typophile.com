    html: <p>Most type design software is user friendly; it’s just that type design is so complex that until you know what you’re doing the software won’t make much sense. Anyway, if you need something free, try the <a href="http://schriftgestaltung.de/glyphs/about.html" rel="nofollow">free Glyphs beta.</a></p>
