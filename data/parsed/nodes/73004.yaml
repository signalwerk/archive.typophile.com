      <p>FontForge is free and very powerful, but it's hardly user-friendly. I still highly recommend it if you're up to the challenges of installing it and climbing a rather steep learning curve. It's worth it just for the Spiro drawing mode.</p>
      <p><a class="freelinking external" href="http://fontstruct.fontshop.com/" rel="nofollow">Fontstruct</a> Is a fairly simple web-based application for font creation, but it is specialized for making modular designs.</p>
