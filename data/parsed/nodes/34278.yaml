    html: <p>The most prolific 1920–40's typefoundry was the American Type Founders Co. Because of the onset of text machine setting the foundry concentrated on display typefaces to fend off several bouts with bankruptcy. Type such as Parisian, Broadway, Bernhard Gothic, etc.</p>
