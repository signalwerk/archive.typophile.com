      <p>Héctor, I don't think your objectives are completely at "cross purposes". I've seen a few groovy, giveaway, uncoated paper, small format magazines with the look and feel you're aiming for. One of my favourites is Stranger Mag...</p>
      <p><a href="http://www.stranger-mag.com/">http://www.stranger-mag.com/</a></p>
      <p>You can view the mag online, but obviously you don't get the 'feel' of it. With some images they achieve a very nice pencil on paper effect, and the overall feel is much more pleasant than large glossy magazines.</p>
      <p>If you keep the Total Ink Limit under 260% and reduce the Screen Ruling (maybe as low as 120lpi) you should be able to print 'cleaner' images with a fuller tonal range. Reducing those values would also speed up drying time on uncoated paper.</p>
      <p>However, finding the exact values to get the best results depends upon many things specific to your print job. Paper, ink type, press type, press settings, ambient temperature etc. etc. can all have an effect on the final image quality.</p>
      <p>General 'rules' won't always work. The thing to do is build a good relationship with your printer, consider other options they can suggest, keep track of all those variables and adjust them until you get the result you're after.</p>
