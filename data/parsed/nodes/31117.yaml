      <p>The images are probably printing muddy because you are not using a coated paper and the ink is bleeding, which results in excessive dot gain.</p>
      <p>If it's being printed litho with a halftone screen then maybe try lowering the screen ruling to an lpi (lines per inch) something closer to what newspapers would use.</p>
      <p><a href="http://en.wikipedia.org/wiki/Halftone">http://en.wikipedia.org/wiki/Halftone</a></p>
      <p>You could try printing a CMYK image with a very low screen ruling for a groovy Roy Lichtenstein style effect :)</p>
