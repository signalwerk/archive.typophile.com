    <p>I started working on a very small magazine in size (13.2 x 21 cm) and contents (32 pages) which is being printed on bond extra white paper. The thing is that the pictures came out slightly “muddy”, a bit dark, fussy and wased out.</p>
    <p>What kind of adjustments would you suggest to improve the appearance of these photos?</p>
    <p>Thanks!</p>
    <p>Héctor</p>
