      <p>I would surmise that, if you are printing on bond paper, you are NOT printing CMYK, but single-color photos, which is another kettle of fish entirely. However, the diagnosis of the problem as dot gain is correct. In order to reproduce the photos better, you will need to flatten the tonal range somewhat, especially in the shadows.</p>
      <p>The easiest way to accomplish this in Photoshop is to create a new layer and flood it with white, then set the blending options to Screen. At this point, you will need to generate some test photos to see which percentage of layer opacity yields the best results. Start with a setting of 10%, flatten the image, and save it under a unique name (e.g., test_10pct.tif); undo the flattening,then try 15%, 20% and 25%, saving each one. The example below shows the original phot on the left, and a 10% white overlay on the right. Assemble and label your test photos on a single page in Quark or InDesign, label them with their titles, and have the sample page printed on the same paper you will use for the final product. If you find that one photo is a little too dark and the next step is a little too light, choose an intermediate value, and use it in production. The chosen value may not work optimally in all situations, but the results should be better than doing nothing at all.</p>
      <p><img src="/sites/default/files/old-images/dot_gain_4081.jpg"></p>
