    html: <p>If this is one-color your darkest black should proabably be around 90%, or maybe even 87% to compensate for dot gain. Use curves in photoshop to do this. You will also need to open up the midtones, (less ink) and probably boost the contrast a bit. Ask your printer for some help on this. They may be able to provide some specific ink levels for you to work with.</p>
