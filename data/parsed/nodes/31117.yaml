      <p>If the images are full colour (CMYK) you can also try reducing the overall amount of ink that is used to print them by using Gray Component Replacement or Under Colour Removal in Photoshop.</p>
      <p>Menu &gt; Edit &gt; Color Settings &gt; Working Spaces CMYK &gt; Custom CMYK...</p>
      <p>Under Separation Options - Separation Type select either GCR or UCR and then reduce the Total Ink Limit percentage.</p>
      <p>You may want to speak to your printer about the best adjustments to make.</p>
      <p><a href="http://en.wikipedia.org/wiki/Grey_component_replacement">http://en.wikipedia.org/wiki/Grey_component_replacement</a></p>
      <p><a href="http://en.wikipedia.org/wiki/Under_color_removal">http://en.wikipedia.org/wiki/Under_color_removal</a></p>
