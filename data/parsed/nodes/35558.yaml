      <p>Hello everybody. Thank you all for your advices. I really appreciate the fact that you spend time to see my work and advice me. </p>
      <p>Derya: About the font,I was not so sure for my choice. I mean i know i want a rounded font but maybe it won't be this one. Thank you for the links.<br>
      About the logo, you are right about the shape (caravans are squared with rounded corners, only some few very old models are rounded) but it looked better that way in the center of the ''rainbow'' or ''target''.<br>
      About the tracking and the spacing u are absolutely right. I will correct it!<br>
      I had few others ideas but i'm not sure if i should show them yet.<br>
      Thank you again, you've been very helpfull!</p>
      <p>Hola: Yes, you are right, i need to make smaller the word center. About your idea with the ''center'' below the ''caravan'' I try it and i did'nt like it.But I didn't try the below and right justified idea. I will.<br>
      Thank you so much!<br>
      p.s. I visited you website. Your work is really good.</p>
      <p>patricking: I'm glad you liked it, and more glad that you smiled when you saw it!  I wanted a happy logo.<br>
      1) and 2)  i made it that way because i wanted also to be like a half target (except a rainbow) and the caravan to be in the center.  Maybe i should try it again like you said.<br>
      3) hahaha, you are right my friend! I'll fix it!<br>
      Thank you for your comments. </p>
      <p>I' ll make some changes and i'll be back again.<br>
      Thank you all!</p>
