      <p>Hi tilboy,</p>
      <p>Font-Choice: I think there are many rounded well executed fonts which are far better than the ancient VAG Rounded used in your draft. I can recommend<br>
      Gotham Rounded<br>
      (<a href="http://www.typography.com/catalog/gothamrounded/index.html" title="http://www.typography.com/catalog/gothamrounded/index.html">http://www.typography.com/catalog/gothamrounded/index.html</a>) or<br>
      Chevin<br>
      (<a href="http://www.veer.com/products/typedetail.aspx?image=GTT0000003" title="http://www.veer.com/products/typedetail.aspx?image=GTT0000003">http://www.veer.com/products/typedetail.aspx?image=GTT0000003</a>). </p>
      <p>Logo-Appearance: The first thing that came into my mind, is that the rainbowish forms look like a tunnel/cave or is picturing sending out a signal. Also I think that the square form with rounded corners is more Caravan like.<br>
      If it should be the rainbow form, you can maybe use the C or c to build the caravan rainbow. </p>
      <p>The tracking for the word Caravan is to loose and the tracking for center to tight. Also I would correct the space on the right and left side of the v. Also the space between r and a is to loose.</p>
      <p>Are there other ideas/variants/drafts?</p>
      <p>Derya</p>
      <p>p.s. I like the second draft, but the word center looks bigger than the word caravan.</p>
