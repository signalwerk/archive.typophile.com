      <p>Thanks again. I am looking forward to curling up with some good type books this holiday season. I was unable to get the Rhyme &amp; Reason: a Typographic Novel. Erik Spiekermann but several others are already on their way from Amazon.</p>
      <p>I am just developing “my style” but I am starting to think that I am one of those people that likes to work with only 5-10 fonts but really, really get to know them well and I hope these books can help me with that. Right now I am obsessed with Whitney not only because it is “museum-like” but also because it has an amazing array of weights which for my publication work is a godsend. It also seems sort of like a classic in the making which I love.</p>
      <p>Do You have long term “favorite” fonts or do you switch all the time?</p>
