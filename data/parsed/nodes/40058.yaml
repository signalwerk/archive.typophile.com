  html: |-
    <p>I need a book about how to compose type. But I don’t want to read any more books about the history of type, what an ascender is, etc. I would like a book that explains line length, leading, tracking, but not what they are, but what the rules are for using them and how to best break them.</p>
    <p>thanks!</p>
