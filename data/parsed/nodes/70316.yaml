    html: |-
      <p>It seems the authorities are testing the proposed design in a real environment. The Transport Company is silent about it, which is understandable. If the public would be allowed to discuss it, the vox populi would say: keep the old signage, we like it, it is good. I guess that's why they picked one of the less frequent stop in downtown for the experiment.</p>
      <p>I am looking forward for the change as the signage today is rather bad and inconsistent. I hope all the bugs will be solved and Prague metro won't be a shame compared to other European cities.</p>
