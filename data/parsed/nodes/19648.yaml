    <p>Heya all,</p>
    <p>I'de love all your criticism/advice on development of this logo.</p>
    <p>"Eight Three Nine" is a small DTP business that predominantly typesets display ads for Melbourne's "The Age" Newspaper.  At the minute, the website is horrible!  It looks like something from the dot com era.  It was set up over-night (as was the business, which was orignially 'something on the side').</p>
    <p>The business is going well, and with a view to have it as my only income i'de like to overhaul the whole thing.</p>
    <p>At this stage, i've kept it mono, colour to come later.  (colour will be really important in the end, but right now i'm looking at concept)<br>
    Text is Minion Bold Condensed (small caps).</p>
    <p>I'm trying to capture that 'old book' feel, you know, with the classic old text-faces and ornamentation etc.</p>
    <p>I'm not sure that Minion is a good choice of face.  Maybe i need something a bit more rustic?  any suggestions?</p>
    <p>Ornaments 'can' look great, but I dont want it to be pretty or prissy.  Something is'nt right, it just looks a bit too nice/lovely/feminine(?).  Not really fitting for a business i dont think.</p>
    <p>Not sure exactly what direction to head next.  Stay with this concept, or perhaps a whole new direction?</p>
    <p>I could easily do the really clean website with the latest trendy typeface, but thats exactly what i'm trying to avoid.  I dont want to just copy the latest thing.  It would be great to see what i think is a good idea through to completion.  But right now i'm struggling!  Any help greatly appreciated.</p>
    <p>Cheers!</p>
