      <p>Cheers Jupiterboy - Pabst looks really good.  I think it will work well.  Although it looks like i'll have to drop the small-caps, but thats okay, its probably a bit overdone anyway.  Pabst's lanky Caps and small x-height lower cases look really elegant.</p>
      <p>Some of the ornament style already comes from Lanston's Granjon Fleurons.  I like Lanston!</p>
      <p>I'm still a bit concerned its going to look a bit twee though.  might end up looking like a brass fitting on the outside of a Victorian cottage, which is not really what i'm looking for.</p>
      <p>The rest of the design will become really important if this is to work.  At the moment, i'm thinking of the sort of style seen in old scientific journals, probably around the 40's and 50's in America.<br>
      Maybe i'd be better off cutting the ornaments down to just a few fleurons and using something bookier, maybe Lanston's Kennerley? <a href="http://www.p22.com/lanston/products/kennerley.html" title="http://www.p22.com/lanston/products/kennerley.html">http://www.p22.com/lanston/products/kennerley.html</a></p>
      <p>What do you think?</p>
