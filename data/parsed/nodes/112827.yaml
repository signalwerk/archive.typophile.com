    <p>This <a class="freelinking external" href="http://whatacharacter.info" rel="nofollow"> website</a> presents typefaces in a new and interesting way. Showing individual characters, of typefaces designed by type master Georg Salden, in large size, the focus is on the beauty of the outlines and their details, rather than on the entire alphabet. Of course, you can see the rest of the characters as well …</p>
