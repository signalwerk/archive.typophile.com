      <p>i am interested in the 'personality' of a given font. where does it come from? what determines it? what are those characteristics that make it unique? and so on. i love thesis, but i wonder why. my idea was, that by manipulating some of the forms, i might get closer to it.</p>
      <p>ultimately, i agree, i should start designing from the scratch. which has always been a big dream of mine and i hope i will find the guts to do it. it just seems a bit like preparing a risotto if you have never cooked rice.</p>
      <p>please don't be too harsh with me - i didn't want to steel anything from anyone. i have never and will never use it for anything else than my personal experiments.</p>
