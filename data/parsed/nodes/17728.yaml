      <p>I hate to rain on your parade, but "a manipulation of ff thesis" is not "My 1st font", it's one of Luc[as] de Groot's fonts which you have given wonky corners.</p>
      <p>Addition to original post: I don't mean to sound like a mean aßhole, but authorship of typeface designs is a pretty touchy subject, especially with those of us who are trying to earn our living as type designers. There are many ways to learn about type, and one of them is to study, and even muck about with, great typefaces in order to see how they're made, and perhaps uncover some of the secrets of their success. But don't claim ownership of someone else's design, having done minor tweaking or even major overhaul. It's simply not cricket to build typefaces from other people's typefaces. (You can borrow from yourself; that's okay.)</p>
      <p>Most "My 1st font" efforts are absolutely awful. I don't think you'll find a designer who didn't start by making ugly geometric/constructed/grunge - depending upon their age - fonts, and thinking at the time that they were pretty good. Like any skill or craft, type designing develops over time and involves loads of trial-and-error. Speaking for myself, I have been designing fonts for around 15 years, and have only recently started to understand what I'm doing and am finally making some type which is not completely awful. (A contention which is open to debate.)</p>
      <p>I applaud your interest in getting into type design, but urge you to take your time, learn about the craft, and keep posting experiments here for comments. Publish when you're ready and when you have original designs.</p>
      <p>So... About your logotype... I'm not sure that squaring off the corners of Thesis are doing the type any favours. There is a difference between modifying a letterform to better suit your needs, and simply changing it for the sake of change.</p>
