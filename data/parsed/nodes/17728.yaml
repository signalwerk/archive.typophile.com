      <p>chester, thanks for your comments. i understand what you are saying about the copying issue, and i'm very aware of it. actually now i know, that the title of my posting was misleading - as it's not a font but rather <cite>'minor tweaking or even major overhaul'</cite>. more specifically, it's not a font at all, as it is all done in illustrator. i'm far away from trying to <cite>'claim ownership of someone else’s design'</cite> and never thought about <cite>'publishing'</cite> anything. it's a mere learning exercise.</p>
      <p>so are you condemning such efforts, morally? is there any better way of learning about type design than experimenting with very skillfully made fonts by experienced designers?</p>
      <p>to me, this seems a little bit strict.</p>
