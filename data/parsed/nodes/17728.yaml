      <p>In my experience, moving someone else's points and outlines around will never teach you as much as actually drawing by hand and onscreen yourself. By experimenting with existing fonts, one may be able to discover new forms (although this rarely happens), but one will not come to the understanding of WHY the designer drew the original forms the way he did. That sourt of understanding takes a long time to develop, and only comes through direct experience.</p>
      <p>Yes, drawing your own letters from scratch is hard. It takes years sometimes before the letters will be any good. But it will be worth it when you reach that point.</p>
      <p>I don't think that chester is being strict at all, by the way. Luc[as] de Groot is a living designer, who just designed Thesis a few years ago. One should respect his time and his work, especially if one is working in the creative industry, too.</p>
