    html: <p>Filoug, I'm sorry if I sounded harsh or strict. I'm not advocating a "hands-off" approach; it can be illuminating to get inside a typeface and see how it's constructed, where the nodes and BCPs are, how a designer describes curves, etc. As Dan points out, one learns more by drawing and making letters, and I would encourage you to start your "international aquaculture" exploration on paper.</p>
