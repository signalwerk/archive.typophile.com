    <p>I am currently wanting to do an editorial piece, but in a typographic form. I am having problems with the subject to base it on. I have thought of the following themes I thought would help using experimental typographic layouts.</p>
    <p>* Conversations on something controversial<br>
    * Art movements<br>
    * The word 'black'<br>
    * The word '1st'<br>
    * Film posters but typographically<br>
    * The letter G<br>
    * Funny useless facts<br>
    * Fonts (but developing a humorous story behind them all and creating pretentious character etc)<br>
    * Numbers</p>
    <p>I'm having problems. It's making me crazy. Any feedback and advice welcome. Thanks.</p>
