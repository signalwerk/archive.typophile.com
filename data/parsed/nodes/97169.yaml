  html: |-
    <p>Hello,</p>
    <p>For my study application which includes a portfolio of my best work I am looking for a nice sans-serif.</p>
    <p>Firstly, I thought it has to be a neutral typeface just like Helvetica and so on, so that it fits to my photography work<br>
    as good as to my futuristic poster (just to give an example).<br>
    But I felt that I want a typeface which has more personality, wich has a (subtle) nice, warm and friendly feeling without being too decorative.</p>
    <p>One typeface I have found is Pluto Sans. It looks nice to me, but the description reads that its best used for screens<br>
    (<a href="http://www.myfonts.com/fonts/hvdfonts/pluto-sans/" title="http://www.myfonts.com/fonts/hvdfonts/pluto-sans/">http://www.myfonts.com/fonts/hvdfonts/pluto-sans/</a>). So, would you suggest me to use it for print?</p>
    <p>Also, if you have any other suggestions I like to hear them.</p>
    <p>Kindly regards,<br>
    Dennis</p>
