  html: |-
    <p>I am looking for a new typeface to use for an existing line of quote t-shirts...and I am having a hard time. It is simply a quote printed at approx. 60pt. type...two or three lines of text...on various colored t-shirts...usually a front print. The existing font that has been used is Book Antiqua bold. These shirts are sold in a family of nostalgic general stores. Here are some basic guidelines for what I am looking for: </p>
    <p>Not too modern...or too cliché in terms of old-fashioned typefaces.</p>
    <p>Something that wouldn’t be completely inappropriate in an old general store.</p>
    <p>Neutral enough to appeal to men, women, and children of all ages. </p>
    <p>Easily distinguishable from previous typeface.</p>
    <p>Easy to read from a distance.</p>
    <p>Any suggestions? Thanks.</p>
