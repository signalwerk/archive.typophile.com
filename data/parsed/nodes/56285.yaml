  html: |-
    <p>I was traipsing around the internet recently and came across <a href="http://www.flickr.com/photos/ultrasparky/3218770932/" rel="nofollow">Daniel Rhatigan's picture of an old Monotype specimen on Flickr</a> and his mention of an <a class="freelinking external" href="http://typophile.com/node/28292" rel="nofollow">older thread here.</a></p>
    <p>Tiffany says that it looks like the italic for Renner's Steile Futura, which is the starting point of another massive discussion <a class="freelinking external" href="http://www.typophile.com/node/18227" rel="nofollow">here</a> (which I confess I missed at the time). And I agree with her – the two faces are startlingly close, but Daniel's date for the Monotype specimen pre-dates Steile Futura by at least a decade.</p>
    <p>At last I have got off my arse and done something about it (outlines in progress below), but the question I want to ask now is <em>"Is Monotype Condensa an (English) knock-off of the (German) Steile Futura Italic?"</em></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Condensa_outlines_5483.jpg"></div><p></p>
