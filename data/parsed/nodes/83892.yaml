    html: |-
      <p>The line weight and bracketing are different on Avant Garde (namely, Avant Garde has it and your sample does not.)</p>
      <p>Looks a lot like Century Gothic (or upon closer inspection, the <a class="freelinking external" href="http://new.myfonts.com/fonts/urw/gothic/" rel="nofollow">URW++ version</a>, given the f), modified so that the e is similar to the slant on <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/itc-kabel/" rel="nofollow">Kabel</a>.</p>
