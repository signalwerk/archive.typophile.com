    html: "<p>I have my fonts organized in multiple ways (even though FontAgentPro -- the best resource IMHO -- is not the easiest way to do this):  <br>First, in Libraries according to origin (eg Adobe, AgfaType, MonoType, etc. etc.) -- I do this when importing them.  <br>Second, in Sets -- Display, Serif, Sans, Slab-serif, Script, Pi, in the way FontShop's FontBook does (you do need a reference!) -- and also in Sets for each Client or Project. <br>It took me a couple of weeks to get everything in shape, but then I had a fifteen year legacy (I had to troubleshoot a lot of fonts).  <br>You may have an easier job.</p>"
