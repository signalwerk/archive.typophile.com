  html: <p>first, sorry if this thread is a retread...I searched the forum first but didn't find anything similar. I'm looking for suggestions for a straightforward org. scheme for their fonts.  <br> <br>Unfortunately I've been asked to standardize the organization for every computer in our dept. Sorting by foundry led to a user revolt, and sorting by alpha (while the best option so far) means I have to pick through the Adobe Font Folio and throw out the duplicates that Suitcase flags.  <br> <br>Finally, we also have a folder of "fonts that we have somehow but are of doubtful legitimacy (or we can't remember) and which we pay for when we use them if not sooner." Unfortunately most of these are of the Castle/SoftSeek/SSi variety of which some are Type 3s, but that we keep around in case someone should send us a file that has experienced a "250,000 Font Explosion" if you catch my drift. <br> <br>thanks for your help, <br>Enrico</p>
  html_clean: <p>first, sorry if this thread is a retread...I searched the forum first but didn't find anything similar. I'm looking for suggestions for a straightforward org. scheme for their fonts.  <br> <br>Unfortunately I've been asked to standardize the organization for every computer in our dept. Sorting by foundry led to a user revolt, and sorting by alpha (while the best option so far) means I have to pick through the Adobe Font Folio and throw out the duplicates that Suitcase flags.  <br> <br>Finally, we also have a folder of "fonts that we have somehow but are of doubtful legitimacy (or we can't remember) and which we pay for when we use them if not sooner." Unfortunately most of these are of the Castle/SoftSeek/SSi variety of which some are Type 3s, but that we keep around in case someone should send us a file that has experienced a "250,000 Font Explosion" if you catch my drift. <br> <br>thanks for your help, <br>Enrico</p>
