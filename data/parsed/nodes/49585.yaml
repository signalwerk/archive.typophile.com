      <p>On that matter, what WOULD a capital Thorn, Wynn, and Yogh look like in blackletter.  I've not seen an example of either.  I've seen Thorn only in one other black letter font, but it was one where the P's bowl was high.  Unfortunately I'm not sure if there's a standard way of differentiating P, Ƿ, and Þ and I'm not familiar with good sites to browse for facsimile editions of old English books.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
