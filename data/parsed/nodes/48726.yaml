    <p>I am having a really hard time nailing down a font.  I know almost nothing about fonts so I'm lost like last year's easter egg.  Anyhow, I'm into train modeling and consider myself a stickler for the details.  I have a reprint of a 1913 Southern Railway Standards book about trackside signs.  I have chosen to reproduce some of these signs for my railroad and I have everything but the font.  After asking for help in railroad forums I have decided to try here.  Some of the letters match certain fonts but then the rest don't match and vice versa.  Sorry for the bad quality photos I'm sure they aren't the best for this.  Any help would be greatly appreciated and thank you in advance.</p>
    <p>-Mike<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/DSCN0774_6576.JPG"></div><div class="imageWrap"><img src="http://typophile.com/files/DSCN0776_6485.JPG"></div><div class="imageWrap"><img src="http://typophile.com/files/DSCN0777_4586.JPG"></div><div class="imageWrap"><img src="http://typophile.com/files/DSCN0778_6588.JPG"></div><div class="imageWrap"><img src="http://typophile.com/files/DSCN0780_4087.JPG"></div><div class="imageWrap"><img src="http://typophile.com/files/DSCN0781_6568.JPG"></div><p></p>
