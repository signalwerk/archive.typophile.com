    html: <p>I could probably do that.  The reason I was hoping to get a font was so that I could get an unmounted rubber stamp made.  These signs were cast out of iron and the letters were raised.  The font would help me define the height for scale reasons and the rubber stamp would make the letters raised.  The original sign is being made out of wood with the rubber stamp letters so I can make a silicone rubber mold and cast several signs in polyester resin.  If that makes sense.</p>
