      <p>It's unlikely that you'll find a font to match exactly. What you're seeing here are not fonts, but lettering templates to be used by sign makers. Fonts were not used to make signs back then the way they are today. </p>
      <p>Why not simply scan these into your computer instead of using a font?</p>
