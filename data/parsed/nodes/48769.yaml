    date: 2008-10-22T07:26:00
    date_raw: 22 Oct 2008 — 7:26am
    votes: null
    html: <p>Ned, Ned, Ned...Constructionally speaking, this is absolutely outrageous and makes no sense at all. So I have to ask the question, why do I have such a broad grin on my face every time I look at this bad boy? There are some crazy curves in it that I would never have chosen in a million years. That said, you're most definitely on the edge of something very, very cool. Maybe I want clearer rules to be established across the font, for example the R has an ink trap on its counter that the B doesn't have. Why? And yet, it's a thing of beauty and very different. Is it pure self-indulgence on your part or do you have a 'use' for it (other than bringing a smile to people's faces, of course)?</p>
    html_clean: <p>Ned, Ned, Ned...Constructionally speaking, this is absolutely outrageous and makes no sense at all. So I have to ask the question, why do I have such a broad grin on my face every time I look at this bad boy? There are some crazy curves in it that I would never have chosen in a million years. That said, you're most definitely on the edge of something very, very cool. Maybe I want clearer rules to be established across the font, for example the R has an ink trap on its counter that the B doesn't have. Why? And yet, it's a thing of beauty and very different. Is it pure self-indulgence on your part or do you have a 'use' for it (other than bringing a smile to people's faces, of course)?</p>
  - id: 308233
    user: 16370
    date: 2008-10-25T11:54:00
    date_raw: 25 Oct 2008 — 11:54am
    votes: null
    html: |-
      <p>hah, nick..</p>
      <p>It's the first font I've really ever spent much time building. So what your seeing is a series of mistakes, luck, an appreciation for history + the midwest, with a touch of bare-bones (typography 101 represent) intuition from a 23 year old kid out of college.</p>
      <p>Yeah, i see what your saying with the ink trap. I really wanted to build this font to have a certain small town charm, extra character if you will, but still work as a system. It does have hic-ups, things that come from no where (i.e. the A).. but aesthetically speaking I feel like it mostly holds together (the X has been troublesome).</p>
      <p>How would you suggest I proceed from here? Really want to make this thing mint.</p>
