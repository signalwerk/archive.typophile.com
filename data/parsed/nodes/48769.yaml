    date_raw: 1 Nov 2008 — 2:35am
    votes: null
    html: |-
      <p>Some minor points: The crossbar on the small-cap a seems too wide. The top of the small-cap b seems too thick, and I agree with Nick that both Bs need ink traps like the P and R. I'd like to see punctuation. You might experiment with making a few of the glyphs wider, like the N, R, X and K -- right now it's almost monospace with wide M and W. </p>
      <p>I particularly like the flair on the top of the B, the diagonal crossbar of the A and H, the ink traps, and the punched-out detail in the lower right. In general I think this is great and nearly ready for prime-time. </p>
      <p>-matt</p>
