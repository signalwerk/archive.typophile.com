    <p>I would appreciate your recommendation for a typeface for a resume for a freelance management consultant that is well hinted for Mac and Windows, I might end using it for my reports too if it can be embed in Word. Currently I am using Georgia+Verdana for screen and document sharing as it is “standard” but I am considering investing on something more “exclusive”.</p>
    <p>Thank you for your expert advice.</p>
    <p>Regards, Carlos.</p>
