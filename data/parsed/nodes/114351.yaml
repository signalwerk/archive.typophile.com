      <p>Hi Carlos. </p>
      <p>All the web fonts from Monokrom are hinted by hand, optimized for ClearType and the rendering engines that follows ClearType on Windows. </p>
      <p>The “Screen” stuff is also drawn to perform especially well in low resolution environments. Unfortunately, we haven’t thought of the possibility that people might be interested in using hinted fonts outside of the web, so our web licenses only cover online use (and mockup). Maybe this kind of usage should be part of what we now call an App license (seeing that these are also hand-hinted TrueType fonts), or maybe we should considering a hinted TT option for the Desktop license. In any case, we’d be happy to discuss an arrangement if you are interested in licensing any of our typefaces.</p>
      <p>That’s what we have to offer, but there are surely others that deliver high-quality text type for screen. The RE series from Font Bureau come to mind, Typotheque’s Screen series, Commercial Type have a very nice way of showing the rendering under various systems directly on their website, anything that crossed the desk of Tiro Typeworks (obviously), Letters From Sweden, FontFont, I’m guessing Dalton Maag walks the extra mile (judging by their recent job openings and current staff), Just Another Foundry is another foundry that takes the screen seriously, and I know first hand Mário Feliciano offers well hinted stuff.</p>
