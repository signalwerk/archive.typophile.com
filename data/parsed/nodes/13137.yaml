      <p>I realized this morning that the issue simply is not an issue. I thought that a character in a pixelfont that has a non-pixel-integer width would cause subsequent glyphs to get misaligned... but they don’t! So it turns out hinting is not even necessary. BTW, I also noticed -more like was reminded of- something else: apps like Photoshop use only the pixel-integer values from the bitmaps/rendering (not the actual em values) to place glyphs, while Word for example does use the underlying “true” width value (resulting in occasional unsightly gaps, but accurate line ends/breaks).</p>
      <p>hhp</p>
