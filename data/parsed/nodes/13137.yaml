  html: |-
    <p>I’m making a (grayscale) pixelfont of an existing outline/print font.</p>
    <p>Although the bitmaps of the glyphs can only occupy integer pixel<br>
    widths, I need to assign to each glyph the non-pixel-integer set<br>
    width from the outline font, which will (assumedly) be additioned<br>
    cumulatively by the typesetting application, causing an occasional<br>
    extra pixel shift, in order to match linebreaks/the_right_rag with<br>
    the equivalent setting in the “source” outline/print font.</p>
    <p>I assume the only way to do this is by assigning width adjustments<br>
    to each glyph via hinting. I’m wondering if anybody can offer help<br>
    in how best to do that, and what to worry about.</p>
    <p>hhp</p>
