      <p>Question: When the hinting is applied it will need to be in whole pixel width increments - no? If that’s the case maybe you can’t match the source - you just have to improve the pixelfont directly. Or are you using some kind of substition of alternative greyscale bitmaps for sets of common combinations of characters...</p>
      <p>I am probably missing something since I haven’t even seen a greyscale font in use yet ( that I know of ).</p>
