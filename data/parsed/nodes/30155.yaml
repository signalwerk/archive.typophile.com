    html: |-
      <p>This looks to me like a customized version of Trade Gothic, News Gothic, Benton Sans, Franklin Gothic, etc. But if you're looking for a face that has some of the distinctive characters already included...</p>
      <p>Akkurat has the curved l but not the one-story g.<br>
      <a href="http://lineto.com/" title="http://lineto.com/">http://lineto.com/</a></p>
      <p>Flama has the curved l and one-story g, but DIN-like construction.<br>
      <a href="http://vllg.com/Feliciano/Flama/mudTyper+Weights/" title="http://vllg.com/Feliciano/Flama/mudTyper+Weights/">http://vllg.com/Feliciano/Flama/mudTyper+Weights/</a></p>
      <p>Foco has the desired features but adds a hint of calligraphic construction.<br>
      <a href="http://www.daltonmaag.com/browse/fonts/dama/foco" title="http://www.daltonmaag.com/browse/fonts/dama/foco">http://www.daltonmaag.com/browse/fonts/dama/foco</a></p>
