    <p>Years ago, I found a free typeface called "Ardenwood Demo." It's still available all over the 'net—here's one link:</p>
    <p><a href="http://www.dafont.com/ardenwood.font" title="http://www.dafont.com/ardenwood.font">http://www.dafont.com/ardenwood.font</a></p>
    <p>I think this is outstanding. The trouble is, one can't use it as it is—the letters are all lowercase, and all those ornaments crash into each other.</p>
    <p>What I'd love is a completed version of this font. (Most of the glyphs besides the lowercase letters are blank.) Does anybody know who designed it, and if there is indeed a completed version available?</p>
