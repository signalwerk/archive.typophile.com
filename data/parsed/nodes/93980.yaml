    html: <p>Nalle's DEMO fonts are intended ONLY to see what the font looks like. They're most often incomplete, have super-wide space glyphs,  have missing letters (usually a vowel or three), and are otherwise intentionally unusable. The full version of Ardenwood demo doesn't have these flaws.  However, it IS lower case only. The glyphs in the upper case haves the ruffles and flourishes, while those in the lower case are much plainer.  You can test the full font and look at all of its glyphs at the link provided by riccardo above.</p>
