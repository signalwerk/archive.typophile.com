    <p><strong><a href="http://marketplace.veer.com/font/Poem-Script-Pro-SDT0000231?skeywords=type" rel="nofollow">Poem Script</a></strong> is a mixed collection of interpretations conjuring a late nineteenth century American pen script style. Though not an actual Italian letterform, this style was called "Italian Alphabet" stemming from an old penman's term for an alphabet where the stress or shades are opposite their normal placement. The American variant followed from the late eighteenth century British hand also confusingly called "Italian Hand," which itself evolved from some seventeenth century French batarde scripts.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophilepoem_5623.jpg"></div><p></p>
    <p>It showcases the phenomenal control and mastery of hand skills required to create such ornamental and lively letters centuries ago. Producing the shaded strokes in reversed positions such as this required holding the pen in a position horizontal to the baseline, or the letterforms would have to be written backwards or by rotating the paper at peculiar and extreme angles to achieve the effect.</p>
    <p>Exotic, elaborate and very attractive, <strong><a href="http://marketplace.veer.com/font/Poem-Script-Pro-SDT0000231?skeywords=type" rel="nofollow">Poem Script</a></strong> contains plenty of variations on each letter and comes with hundreds of calligraphic ornaments.</p>
    <p><strong><a href="http://marketplace.veer.com/font/Poem-Script-Pro-SDT0000231?skeywords=type" rel="nofollow">Poem Script</a></strong>  received a Certificate of Excellence at the Type Directors Club NY.</p>
    <p>:::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::</p>
    <p>We celebrate this release with 2 wonderful specimens.</p>
    <p>A <strong><a href="http://vimeo.com/24681562" rel="nofollow">Video Specimen</a></strong> directed by Santiago Idelson</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophilepoemvideo_6062.jpg"></div><p></p>
    <p>Typeface design by Ale Paul<br>
    Directed by Santiago Idelson<br>
    Music performed by Rachel Grimes</p>
    <p>:::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::</p>
    <p>And also a <strong><a href="http://www.sudtipos.com/downloads/Poem-Script-Photonovel-Specimen.pdf" rel="nofollow">Photo-novel Specimen</a></strong> (8,82mb PDF) photographed by Sergio Recabarren</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophilepoemphoto_4844.jpg"></div><p></p>
    <p>More about Poem Script &gt; <a href="http://sudtipos.com/fonts/148" rel="nofollow">sudtipos.com/fonts/148</a></p>
    <p>We hope you enjoy this release as much as we did!</p>
    <p><a href="http://www.sudtipos.com" rel="nofollow">www.sudtipos.com</a></p>
