    html: <p>i am a former student of UFMG and i have to say that i don't think the logo will work for the institution unless it's all uppercase. by capitalizing the U you're implying a hierarchy which makes the word "Universidade" more important than "Federal de Minas Gerais" and as Rodolfo has said, it's not the correct way to treat an acronym. <br> <br>i would also recommend making the mark stronger. the symbol is very small and quiet now, it doesn't say "fire" to me at all nor it represents the University as a strong academic institution. it's a very nice abstraction but i think it's lacking some strength. <br> <br>as for the type solution i would agree with a condensed grotesque. <br> <br>some study of the university's architecture might inform the drawing of the mark as well. i don't know if you've done that or not.</p>
    html_clean: <p>i am a former student of UFMG and i have to say that i don't think the logo will work for the institution unless it's all uppercase. by capitalizing the U you're implying a hierarchy which makes the word "Universidade" more important than "Federal de Minas Gerais" and as Rodolfo has said, it's not the correct way to treat an acronym. <br> <br>i would also recommend making the mark stronger. the symbol is very small and quiet now, it doesn't say "fire" to me at all nor it represents the University as a strong academic institution. it's a very nice abstraction but i think it's lacking some strength. <br> <br>as for the type solution i would agree with a condensed grotesque. <br> <br>some study of the university's architecture might inform the drawing of the mark as well. i don't know if you've done that or not.</p>
