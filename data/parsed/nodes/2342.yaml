    html: <p>One thing to be careful about in Syntax is its very slight slant (1/2 degree), which can cause some artifacts in lo-fi situations (like the screen, or even small text on a laser printer). In which case Foundry Sans* might work better - it's essentially a Syntax sans any slant. <br> <br>* <a href="http://www.on-idle.com/foundry/foundry_sans/sans.html" target="_blank">http://www.on-idle.com/foundry/foundry_sans/sans.html</a> <br> <br>hhp <br></p>
