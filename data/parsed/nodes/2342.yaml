    html: "<p>Ok. Once again Thank you all for your sugestions.  <br> <br>This week we had a meeting and we decided to go back to the all UC option. That Upper-lowercase option was a try to avoid a plain vanilla word mark but then we figure it could bores after awhile. <br> <br>We need a simple and timeless word mark but not ordinary. <br> <br>BOLD OR LIGHT: Well. The branding project includes several attachments to UFMG logo. Those will be faculties names, course, departments and events. The UFMG has to stand out from this second name. <br> <br>COLORS: Navy Blue is the old logo's color. The council love it but they agreed with us that it's difficult to keep the same pantone in all prints. So our proposal is to use cyan as an option to yellow or red (our first proposals, both reproved). Cyan provides an easy reproduction in all medias and still could stand as the \"blue fire\". <br> <br>SLABS-SERIFS-MODERNS-HUMANIST-SANS?: As you see our option is going toward the sans, some overused sure, but neutral and nice. If we find a way to customize it a bit. <br>the sans also represents a historical link to UFMG since they start to be developed at late 19th and early 20th century. <br> <br>[Some modern faces are really beautiful and work corporative branding but didn't fit (in our opinion) the UFMG glyphs] <br> <br>SO: THESE are the fonts we are working on, the black ones are ours handpicks. With akzidenz and avant garde we have try something different putting together U and F. What do you all think of that and also of the other fonts? <br> <br>Really thanks. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/22267.jpg\" alt=\"\"></p>"
    html_clean: "<p>Ok. Once again Thank you all for your sugestions.  <br> <br>This week we had a meeting and we decided to go back to the all UC option. That Upper-lowercase option was a try to avoid a plain vanilla word mark but then we figure it could bores after awhile. <br> <br>We need a simple and timeless word mark but not ordinary. <br> <br>BOLD OR LIGHT: Well. The branding project includes several attachments to UFMG logo. Those will be faculties names, course, departments and events. The UFMG has to stand out from this second name. <br> <br>COLORS: Navy Blue is the old logo's color. The council love it but they agreed with us that it's difficult to keep the same pantone in all prints. So our proposal is to use cyan as an option to yellow or red (our first proposals, both reproved). Cyan provides an easy reproduction in all medias and still could stand as the \"blue fire\". <br> <br>SLABS-SERIFS-MODERNS-HUMANIST-SANS?: As you see our option is going toward the sans, some overused sure, but neutral and nice. If we find a way to customize it a bit. <br>the sans also represents a historical link to UFMG since they start to be developed at late 19th and early 20th century. <br> <br>[Some modern faces are really beautiful and work corporative branding but didn't fit (in our opinion) the UFMG glyphs] <br> <br>SO: THESE are the fonts we are working on, the black ones are ours handpicks. With akzidenz and avant garde we have try something different putting together U and F. What do you all think of that and also of the other fonts? <br> <br>Really thanks. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/22267.jpg\" alt=\"\"></p>"
