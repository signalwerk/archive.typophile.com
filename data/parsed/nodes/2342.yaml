  html: "<p>Hello everyone,  <br>this is a work in progress I've done for a public university in brazil. <br> <br>The original logo, created in 1927, had one main element: the fire. The council behind it established it as the \"knowledge fire\", the fire that burns eternally. Almost 80 years later the university wants a new logo but with the same concept. They want a stand alone, strong and simple symbol. <br> <br>After 2 months, this is where I am. The symbol is quite closed because it merges the national with the states flag, what represent literaly the name Universidade Federal de Minas Gerais - Federal university of (the state) Minas Gerais. And subjectively keep the symbol fire really simple. <br> <br>I'm not happy with the type options and I'd appreciate your help and comments. Basically I've chosen glypha, franklin and corporate because the \"g\" creates a support for the symbol. Univers as an option is merely a practical issue. The name is easy to remember for those who will handle the quotidian of the logo: the 40000 people in academic community. <br> <br>Let me know your opinions and suggestions.  <br>Thank you all. <br> <br>Helder Araujo <br> <br><img src=\"http://www.typophile.com/forums/messages/29/22023.jpg\" alt=\"\"></p>"
  html_clean: "<p>Hello everyone,  <br>this is a work in progress I've done for a public university in brazil. <br> <br>The original logo, created in 1927, had one main element: the fire. The council behind it established it as the \"knowledge fire\", the fire that burns eternally. Almost 80 years later the university wants a new logo but with the same concept. They want a stand alone, strong and simple symbol. <br> <br>After 2 months, this is where I am. The symbol is quite closed because it merges the national with the states flag, what represent literaly the name Universidade Federal de Minas Gerais - Federal university of (the state) Minas Gerais. And subjectively keep the symbol fire really simple. <br> <br>I'm not happy with the type options and I'd appreciate your help and comments. Basically I've chosen glypha, franklin and corporate because the \"g\" creates a support for the symbol. Univers as an option is merely a practical issue. The name is easy to remember for those who will handle the quotidian of the logo: the 40000 people in academic community. <br> <br>Let me know your opinions and suggestions.  <br>Thank you all. <br> <br>Helder Araujo <br> <br><img src=\"http://www.typophile.com/forums/messages/29/22023.jpg\" alt=\"\"></p>"
