    html: |-
      <p><cite>Would you write like that?</cite></p>
      <p>Not me. But Americans do. Check out the <a href="http://www.flickr.com/photos/hardwig/2342221253/" rel="nofollow">‘S’ in American Cursive</a>.</p>
      <p><cite>it’s too ornate to be done by hand no?</cite></p>
      <p>I agree. Still, (a lot of) kids in the US have to learn writing like that. Apart from the minsucule ‘e’ with the mirrored 3 shape – which is another American speciality – , the sample exhibits the same ductus as the cursives taught in school there.</p>
