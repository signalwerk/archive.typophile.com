    html: <p>Hmmm... reminds me of <a href="http://www.myfonts.com/person/benson/john/" target="_blank"> John Benson</a>'s <a href="http://www.myfonts.com/fonts/linotype/alexa/alexa/testdrive.html?s=It%27s%20my%20pleasure&amp;p=96" target="_blank"> script</a> <a href="http://www.myfonts.com/fonts/linotype/caliban/caliban/testdrive.html?s=It%27s%20my%20pleasure&amp;p=96" target="_blank"> package</a>  <br>for Adobe. There's some <a href="http://www.myfonts.com/fonts/letraset/bronx/plain/testdrive.html?s=It%27s%20my%20pleasure&amp;p=48" target="_blank"> Bronx</a> in there, although that  <br>one's semi-connected. Or some <a href="http://www.myfonts.com/fonts/letraset/rapier/rapier/testdrive.html?s=It%27s%20my%20pleasure&amp;p=96" target="_blank"> Rapier</a>, which is too slick. <br> <br><a href="http://www.myfonts.com/fonts/itc/skylark/skylark/testdrive.html?s=It%27s%20my%20pleasure&amp;p=96" target="_blank"> ITC Skylark</a> is similar in atmosphere, it has the same energy.  <br><a href="http://www.myfonts.com/fonts/linotype/arid-itc/arid-itc/testdrive.html?s=It%27s%20my%20pleasure&amp;p=96" target="_blank"> ITC Arid</a> is too loose. <br> <br>I also think it's handlettered, BTW.</p>
    html_clean: <p>Hmmm... reminds me of <a href="http://www.myfonts.com/person/benson/john/" target="_blank" class="link-external"> John Benson</a>'s <a href="http://www.myfonts.com/fonts/linotype/alexa/alexa/testdrive.html?s=It%27s%20my%20pleasure&amp;p=96" target="_blank" class="link-external"> script</a> <a href="http://www.myfonts.com/fonts/linotype/caliban/caliban/testdrive.html?s=It%27s%20my%20pleasure&amp;p=96" target="_blank" class="link-external"> package</a>  <br>for Adobe. There's some <a href="http://www.myfonts.com/fonts/letraset/bronx/plain/testdrive.html?s=It%27s%20my%20pleasure&amp;p=48" target="_blank" class="link-external"> Bronx</a> in there, although that  <br>one's semi-connected. Or some <a href="http://www.myfonts.com/fonts/letraset/rapier/rapier/testdrive.html?s=It%27s%20my%20pleasure&amp;p=96" target="_blank" class="link-external"> Rapier</a>, which is too slick. <br> <br><a href="http://www.myfonts.com/fonts/itc/skylark/skylark/testdrive.html?s=It%27s%20my%20pleasure&amp;p=96" target="_blank" class="link-external"> ITC Skylark</a> is similar in atmosphere, it has the same energy.  <br><a href="http://www.myfonts.com/fonts/linotype/arid-itc/arid-itc/testdrive.html?s=It%27s%20my%20pleasure&amp;p=96" target="_blank" class="link-external"> ITC Arid</a> is too loose. <br> <br>I also think it's handlettered, BTW.</p>
