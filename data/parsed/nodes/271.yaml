    html: "<p>Here's Misa's sample: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/11352.gif\" alt=\"sample\"> <br> <br>There are a couple of subtle differences between the two s's and the two e's that make me think it's handlettered. <br> <br>A great commercial font in a somewhat similar vein, though noticeably different, is <a href=\"http://www.myfonts.com/fonts/agfa/spring/\">Spring</a>: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/11353.gif\" alt=\"spring\"> <br> <br>I do love this style of handlettering, though, especially when it's done in (or paired with) watercolor. See <a href=\"http://www.art.net/Studios/Visual/Jillbell/portfolio.html\">this page</a> of Jill Bell's portfolio. She's fantastic.</p>"
    html_clean: "<p>Here's Misa's sample: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/11352.gif\" alt=\"sample\"> <br> <br>There are a couple of subtle differences between the two s's and the two e's that make me think it's handlettered. <br> <br>A great commercial font in a somewhat similar vein, though noticeably different, is <a href=\"http://www.myfonts.com/fonts/agfa/spring/\" class=\"link-external\">Spring</a>: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/11353.gif\" alt=\"spring\"> <br> <br>I do love this style of handlettering, though, especially when it's done in (or paired with) watercolor. See <a href=\"http://www.art.net/Studios/Visual/Jillbell/portfolio.html\" class=\"link-external\">this page</a> of Jill Bell's portfolio. She's fantastic.</p>"
