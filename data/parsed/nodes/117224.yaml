    html: |-
      <p>Futura is good start but too many details look way off to me (/R, flat /G right side, /G and /S angled cut terminals...). Unfortunately, can't either name it or state if it's a custom lettering. Some alternatives I gathered during my search: <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/agenda" rel="nofollow">Agenda</a> FB, <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/mixage" rel="nofollow">Mixage</a> ITC, <a class="freelinking external" href="http://www.typography.com/fonts/whitney/overview" rel="nofollow">Whitney</a> HTF, <a class="freelinking external" href="http://www.myfonts.com/fonts/bagraphics/swank-gothic" rel="nofollow">Swank Gothic</a> BA (not bad), <a class="freelinking external" href="http://www.myfonts.com/fonts/mvbfonts/mvb-solitaire-pro" rel="nofollow">Solitaire</a> MVB, <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/hoftype/equip" rel="nofollow">Equip</a></strong> HT (far too recent but possibly the closest)<br>
      Quick'n'dirty' job, a retracing of the signage<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_4097.png"></div><p></p>
