    html: |-
      <p>You have to create glyphs in fontlab and insert the Open Type tables (Unicode values, characters substitutions, ligatures, marks positioning etc.) through MS Volt. Fontlab is unable to handle all Arabic lookups. Microsoft has also provided a sample Arabic Naskh font (named as Arabic Typesetting font) with Volt project file. It contains almost all the required features and lookups needed for an Arabic font. If you open this font in Volt and look through this font features and lookups you can learn how to use ligatures. </p>
      <p>Here is the sequence</p>
      <p>1- create glyphs in Fontlab and generate a font file.<br>
      2-open the font in Volt and insert OT features and lookups (or use the <strong>Import Project</strong> command if you already have a saved Volt project file to use it with this font file).<br>
      3-use <strong>Ship Font</strong>  command in Volt to create the final font containing Open Type tables.</p>
      <p><em>Note:</em> Be careful, before shipping font always use the <strong>Export Project</strong>  command to save the volt project as a separate file or you will lose all your volt work. Later you can use the <strong>Import Project</strong> command to open your work with any font file in Volt.</p>
      <p>Along with Typophile forum you will also get a great help from <a class="freelinking external" href="http://forum.fontlab.com/microsoft-visual-opentype-layout-tool-%28volt%29/?PHPSESSID=54680a4dfe4b5fc0a4a8efd2849ec6a7" rel="nofollow"> Volt forum</a></p>
      <p>Regards,<br>
      Z.</p>
