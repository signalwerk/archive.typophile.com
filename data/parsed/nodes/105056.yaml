    <p>Dears Typophilers,<br>
    I'm new in the typography design.<br>
    I did an arabic font with Fontographer 5 but I didn't finish because I need some help.</p>
    <p>I need to know how I can create Open type standard ligatures feature with Fontographer 5, font lab or Volt.</p>
    <p>or I need to know how I can create ligatures feature.. when I type some letters together the glyph replaces.. for example AL-JALALAH WORD (ALLAH), in some fonts if you type LAM LAM HAA it will have specific shape.</p>
    <p>any tutorials, lessons or hints will be very helpful.</p>
    <p>Regards,<br>
    Mohammed<br>
    <a href="mailto:mohammed.faqier@gmail.com">mohammed.faqier@gmail.com</a></p>
