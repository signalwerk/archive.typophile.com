    html: |-
      <p>Hello,</p>
      <p>I mostly follow the same steps outlined by brother Zuhair.</p>
      <p>You will first need to add "Arabic"language in VOLT (first pane towards left).<br>
      Then add "rlig" features under Default item.<br>
      Next, add  substitution lookup namely RLIG for "Allah" ligature (middle pane).<br>
      Open the lookup by double clicking it.<br>
      Set "Process Marks" to NONE and choose RTL where it says LTR (far right)<br>
      Then drag that lookup on the corresponding feature.</p>
      <p>Save, Compile, Export Project and Ship font (don't forget to save the font with different name eg. don't overwrite your original TTF or OTF file).</p>
      <p>Best of luck.</p>
      <p>Moiz.</p>
