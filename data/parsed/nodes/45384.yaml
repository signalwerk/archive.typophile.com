      <p>Dear AGL:</p>
      <p>Thank you for bookmarking my blog, I post about once a week.</p>
      <p>Well, I can not say with any degree of honesty that this was fun, but, it was satisfying.  The two LSU graphic design students working with me were great, it was more like an old fashioned sewing bee than anything else. </p>
      <p>The process was very interesting,; after a full academic year of intense thought, research and teaching, it was very rewarding to be making something again.  The tiny stacks of finished pieces were a delight to see.  But fun, well, not exactly fun.</p>
      <p>The booklets are beautiful and ship, on time, tomorrow.  I will post the final shots (below).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/05_3456.15.08.4.typo.jpg"></div><p></p>
