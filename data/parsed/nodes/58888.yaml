      <p>Yes, the A, M, and O are all perfectly square – the remaining letters are varying degrees of rectangular.</p>
      <p>I can see that the B isn't quite right, but I'm not sure how to go about fixing it. Do you think it doesn't have enough weight where the bowls meet?</p>
      <p><cite>The G is giving me a strangely strong “that’s from Helvetica” vibe, and I think it might be because a G without a spur would fit the style better.</cite></p>
      <p>Good eye. I used Helvetica's G as a visual reference. I didn't take any actual parts from it (stealing is bad), but styled mine after it. I think you're right though; it might jive better without the spur.</p>
