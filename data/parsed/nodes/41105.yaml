      <p>All righty! Finally some progress. <a class="freelinking external" href="http://typophile.com/files/agamemnon36-12ptsample.pdf" rel="nofollow">"agamemnon36-12ptsample.pdf"</a> is up on top. The character set is entered in the order they appear in Unicode. I included excerpts from Wikipedia in the four major scripts as well as a section in Anglo-Saxon to draw out some of the more exotic Latin characters. This is set at 12pt with normal line spacing. It seems I've tackled the growth factor that the stacked accents brought in. Somewhere along the line the alignment of some accents shifted. That needs to be corrected.</p>
