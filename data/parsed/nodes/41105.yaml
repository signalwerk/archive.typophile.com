      <p>I know you're looking for comments on other things, but your the interpunct in L· and l· is quite large.  I've found that sizing it to be the same as a period or an umlaut dot works better.  I think it'd be distracting in a word like «Col·lecció / COL·LECCIÓ» but give it a try and see how it looks.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
