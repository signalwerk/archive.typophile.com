      <p>By the way, the Greek typedesigners usually keep width of the oval shape of Omega at the same size as the oval of the Latin letter 'O'. There are deviations from that of course and we can make the Omega a bit wider, but this happens rarely. </p>
      <p>Also, note that the horizontal bar at the baseline of Omega is always the same sroke width as in the letters 'Xi' and 'Sigma'.</p>
