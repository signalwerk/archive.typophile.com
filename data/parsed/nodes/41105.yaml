      <p><cite>I would agree that IPA is not used by many people, but as a linguist, I don’t find the glyphs obsolete.</cite></p>
      <p>There are obsolete IPA glyphs too (glyphs that have now been replaced by different forms, especially at Kiel 1989) and I think they are in Unicode for backward compatibility with prior 8-bit encodings. They should probably be included in any font that has the IPA, though, because it may be necessary to set documents created using earlier versions of the IPA.</p>
