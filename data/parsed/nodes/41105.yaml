      <p>I agree that gothic was a wrong choice of words. I should have said it looked "arcane". Anyway, my point is this: the font you've developed has a progressive look that is not only a feast for the eye but it will help promote the learning of the language in general. If a writing system is to exist in fifty, a hundred years - it will have to evolve just as the spoken language has to change.</p>
      <p>I would say keep the DO just as you have it. Although it threw me for a couple of seconds, it is (as you pointed out) how it is in the earlier chart.</p>
      <p>In an earlier post, I mentioned that I've read many, many examples of the hand written language. And during these readings, you would be amazed at how creative the elders were with some of the symbols by putting their own little creative twists to them. I remember watching my father practice his hand writing and when he was finished - the end results were almost calligraphic. Folks would comment about how pretty his writing was.</p>
      <p>Again, my point is this:  Finish your font. It's different and fresh. I, for one (and again, I'm no spokesperson for either tribe), am not so closed minded or afraid of change that I would want to stick with the same old tired "Offical" font. I would use your font, if nothing else than just to be different. It's useable and readable.</p>
