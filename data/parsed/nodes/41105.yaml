      <p>I checked out the new touches to your CWY font. I LIKE IT! It's really a clear departure from the same old same old. In fact, I believe that learners of the language would probably have an easier time in learning this font because it's different and dynamic.</p>
      <p>I believe I mentioned that I'm a teacher of our language and I'll be teaching two more classes starting next month. I teach Cherokee for the Cherokee Nation and the United Keetoowah Band of Cherokees.</p>
      <p>Anyway, I'm not sure what kind of expertise I have in the work that you are doing in creating fonts but I have been reading and writing in the language most of my life and I've seen alot of different ways of making the symbols in the system. So what you are doing is okay by me. Though I'm no spokesperson for either tribe. However, I am a sixth generation descendent of the original Sequoyah and I believe he would like what you are trying to do. Keep it up and let me know when you are ready to show it off a bit. I'll use it in my classes.</p>
