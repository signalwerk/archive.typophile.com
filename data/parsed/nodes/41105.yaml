  - id: 298137
    user_id: 23037
    user_name: Ross Mills
    user_path: null
    date_raw: 27 Aug 2008 — 6:11pm
    date: 2008-08-27T18:11:00
    votes: null
    html: |-
      <p>Determining acceptable variation is going to be somewhat of an experimental process. As I mentioned in the other thread, knowing what reader's perceptions are likely to be is a guessing game until you can find someone familiar with reading and writing Cherokee that can provide the sort of feedback that will be helpful. In the development stage, its best to analyse what few examples are available, keeping in mind that there are very few that would constitute strong typographic tradition, so cues also should be taken from the hand drawn models as well. Keep in mind that using this methodology does not guarantee that users will like what you do, but it is at least a starting point—it may not let you know what "the symbols are supposed to be", as we don't have much of an evolution of glyph form to draw from, so many of the finer details are up to the type designer. Some of the more core variations can be seen by looking at the various fonts, as there were some changes from the first (1827) to the second (1835) font and then various other mutilations occurred generally in the 20th century interpretations, most of which are not terribly instructive as to how things should look typographically, although they do inform expectations, as these are what people are used to in varying degrees. I think that handwritten examples may be more informative then many of the modern fonts.</p>
      <p>A historical timeline such as the following is useful:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/E_chart_4746.jpg"></div><p></p>
      <p>I think there is something to be said for at least thinking about how to separate some forms from their (apparent) Latin counterparts. The environment in which Cherokee is learned now is almost certainly different then it was 150+ years ago, and I imagine most all learners will already be literate in English and so will be biased as to glyph shape—probably less of a hurdle to overcome for young students then for older ones.<br>
      In the most basic approach, analyse "shared" forms: does the "<em>i</em>" need to look like the uppercase "T"? and what can be done to modify it away from that form while maintaining its legibility? Of course, the first metal types used an existing "T" (smallcap Didot) rather then contriving something new. Looking to Sequoyah's first for-print model, he drew several wedge-terminals as having open counters, which is a clue to one or two alternate approaches, as terminal treatments in Sequoyah's model actually have some semantic meaning, rather then just being stylistic goo-gahs.</p>
      <p>FYI, the Plantagenet sample above is version 1 from several years ago—many of its deficiencies have been or are being addressed for version 2.</p>
