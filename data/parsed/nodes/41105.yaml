      <p>Progress report:</p>
      <p>Among things I've said before, I'm nearly ready to show another progress sample. I'm having a problem getting some of the Greek characters to appear properly, notably Delta and mu. I think it's because they are both duplicated or referred to at other points in the Unicode space, and something with Mac OSX 10.4 isn't cooperating somehow.</p>
      <p>Anyway, the Latin section is pretty firmly set apart from spacing issues and problems with stacked accents affecting the line height. The Cyrillic set is much improved from my previous version, but still limited to basic characters and may only be suitable for Russian right now. The Greek has significant changes which could make it at least legible, but I don't really know. It is quite literally all Greek to me. There are some big changes to the Cherokee too, in light of our recent conversations.</p>
      <p>Also I've made a quick and dirty light weight of the basic Latin characters, but that still needs tweaking.</p>
      <p>Any preferences on who wants to see what first?</p>
