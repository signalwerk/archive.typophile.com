    html: |-
      <p>Eh, I'm not expert in Catalán, I've just seen some signs here and there.  </p>
      <p>Here are some samples of dots in a variety of fonts (quite a variety in fact).  Each line is lowercase U with umlaut, lowercase I, period, precomposed lowercase L with interpunct, a second lowercase L, and then a middle dot (used normally for inputting it).  I'm generally of the line of thinking that the two Ls should be kerned normally just with a dot in between them.  </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/umlaut_i_period_catalan_double_l_interpunct_6001.png"></div><p></p>
      <p>Here's an excerpt from a <a class="freelinking external" href="http://www.tug.org/TUGboat/Articles/tb16-3/tb48vali.pdf" rel="nofollow">detailed paper</a> on the subject of Catalonian typographic conventions:</p>
      <p><cite>The present proposal consists of deﬁning the character as a digraph formed by two letters, with a middle dot as diacritic mark. The middle dot has to be located between the two letters and equidistant from their stems. In order to facilitate reading, the middle dot has to be centered at half the height of uppercase letters. This is due to the fact that the digraph only appears between vowels. Moreover, between the two letters there has to be the same distance as there is between the two letters when they are not written with a middle dot, in order not to break continuity of words containing the digraph. There seems to be no deﬁnitive need for the middle dot to be smaller than a period, contrary to the proposal in Mestres (1990). Boldface fonts are the only ones out of 27 standard TEX fonts where a smaller middle dot would be, to the author’s taste, aesthetically more pleasant. As a matter of fact, most (if not all) old and modern printed representations of the digraph share the fact that the middle dot and the period have the same size. <cite></cite></cite></p>
      <p>However, he's discussing exclusively TEX fonts, and admitingly not in the design field at all.  <a class="freelinking external" href="http://femfum.com/PDF/ElaGeminada/LletraDeConvitPerLaElaGeminada.pdf" rel="nofollow">This other fella</a> presents far more background and I believe based on my rudimentary knowledge of Catalonian actually works as a designer.  I'll try to trudge through it more.</p>
      <p>It may be of note that <a class="freelinking external" href="http://wwwa.urv.net/centres/Departaments/fcatalana/TipografiaDeQualitat.pdf" rel="nofollow">this paper</a>&nbsp;which discusses the ideas of "quality typography" (and is a bit easier to read than the second article I mentioned) has a l·l with a dot significantly smaller than the period.  While he is a not a designer by trade, his article is quite well written and could easily be confused with a designer (of course, I might just be seeing a different guy with the same name on google, but who knows).</p>
      <p>Also, while I like your bold and italic capital Q, the normal one seems just a little too.... Thai-like for me.<br>
      <em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
