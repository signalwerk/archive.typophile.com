      <p>I welcome any comments I can get, especially when it comes to things of which I have no firsthand knowledge.</p>
      <p>You are quite right. Though the Unicode manual says that the interpunct in L· and l· is to be composed with the periodcentered character, that is a bit heavier than the dotaccent in this font. The umlaut dot may be even smaller. I'll try some variations and apply that which works best in the next revision. I'd rather go with the opinion of someone expert in the relevant language than the "rules" in a book any day, but being familiar primarly with English I'm pretty clueless with what to do with all these diacritics and I have to go by whatever information I can get.</p>
