      <p>Although the YI might be confused with O, it's still different. But this is one of the things I like about your font.</p>
      <p>Ga, De and Du are always confusing to the novice. But after they really start getting into it they begin to tell the difference between the three.</p>
      <p>So, Quo and Yi are the only ones that might be thought of as really different but I don't believe it will cause that much trouble.</p>
      <p>As I said, they are all readable. I can hardly wait until you deem your font finished.</p>
      <p>However, there is one thing about me that you should probably know. I'm sort of a maverick in teaching our language. You would think that people around here would all know how to speak in our own language, but such is not the case. All three tribes are scrambling to teach the language to the younger generation, hence the language classes sponsered by the tribes. But where other classes teach reading and writing right off - I've always believed that the folks needed to speak first. So that's what I begin with. I teach my students how to say words and phrases first before I get them into reading and writing. I don't believe other classes do this. They go straight into reading and writing. So in this matter, I'm... kinda different from other teachers of our language. Which might explain why I look forward to your release of your font. I believe the new look will spark a desire in the youth to learn how to use the syllabary and ultimately learn their own language.</p>
