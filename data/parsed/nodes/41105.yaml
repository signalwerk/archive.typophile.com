      <p>I wish I could test it in more and different ways. It's a weak excuse, I know, but I'm constrained by my tools. I'm a touch too broke to upgrade my software, so the only thing I have to  display the whole font without crashing on Character Pallette input is Text Edit. </p>
      <p>As for its purpose, it's a bit too massive for an everyday text font, though it has features that should make it highly readable. It's a bit clunky with those wavy slabs.</p>
      <p>There are not a lot of Cherokee fonts out there, as far as I can tell. Many of them are really poorly designed, like that "official" one I showed above, but are still considered usable by those who use them. In my opinion Plantagenet is the most thoughtful and best looking example of a Cherokee font I've ever seen, but even Ross Mills concedes that it is deficient in its current form. I have done scarcely any research on the matter, in comparison, and I consider it high praise that anyone with even casual expertise commends my efforts.</p>
