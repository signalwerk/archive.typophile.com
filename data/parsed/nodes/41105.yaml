    html: <p>That's the troublesome thing about the Cherokee symbols. Many, especially the ones apparently derived from the Latin alphabet, are virtually identical to each other, distinguished only by the style of the stroke terminals or some ornament feature (as seen from a Latin context). The most obvious error I made in that regard was placing hook terminals in many places where there should be balls. I did notice those triangular wedge serifs on some of the characters in Sequoyah’s model. I did exaggerate the serifs in my own font where they appeared, compared to similar Latin letters, but I may go even further, perhaps as much as the Cyrillic spike descenders (not shown in my current sample, but greatly enlarged in v31). I don't know about opening them, though; that might make too much visual clutter, at least at small sizes. Could be worthwhile to include in display weights, though.</p>
