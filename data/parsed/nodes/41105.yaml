      <p>Okay, I'm sorry. The above post was my first reaction to the great work you're doing. But after I really pondered over your latest chart there are a couple of things that I should mention. Nothing great - just a few observations.</p>
      <p>1 - the first symbol should be down at the last of your chart. (unless you did this for a purpose) It's part of the vowels.</p>
      <p>2 - the "doh" symbol threw me for a second. It's downside up. I'm cool with that but that leads me to the third thing.</p>
      <p>3 - The Keetoowah and some elder Cherokees are very traditional and though I see nothing wrong with creating a font such as yours, some of the people will not go for it because it's so different (which is what I like about it). They are very weary of change. It usually takes a while for new things to catch on with them. However, at the same time, if they see the young people taking to it - the elders will let it slide because the younger generation is accepting it. One of the things that's going for your font is the fact that it looks gothic (sorry but I just had to say it - but hey! gothic Cherokee, cool). And our young people will like that.</p>
      <p>Again, I like what you're doing. I'd like to see it finished.</p>
