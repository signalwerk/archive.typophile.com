    <p>Agamemnon began as an experiment I did on Fontographer years ago. I revived it over a year ago and began discussing it here on Typophile. <a class="freelinking external" href="http://typophile.com/node/28862" rel="nofollow">That original thread is here</a>, but has become long and unwieldy, potentially frightening off new critics trying to wade through the history of revisions. I've since moved development of this font to FontForge. The ability to edit with Spiro curve technology has been invaluable!</p>
    <p>The font could be categorized as transitional and slab serif. The serifs and horizontal strokes are cupped and curved, creating a visual texture that should maintain legibility at small sizes and great distances. The current weight, though, is a tad awkward; too heavy for a book weight, but not quite a bold.</p>
    <p>Over time I have expanded the character set. Once started with a basic MacRoman, I have since expanded it to include most of the Unicode Latin codepages, as well as basic Cyrillic, Greek, and Cherokee, plus Latin small caps, tabular oldstyle figures, fractions, stylistic alternates, special Icelandic ligatures, and a whole lot of currency and miscellaneous symbols.</p>
    <p>And the snark, uppercase eszet, ruble sign, <em>&amp; al.</em></p>
    <p>The PDF files attached here are all development version numbered, beginning with version twenty-nine. Earlier revisions are documented in the original thread linked above. The most recent one will have the highest number. Files with the same number are different settings of the same version.</p>
