      <p>Jason, you use FontForge, yeah?</p>
      <p>Element -&gt; Font Info... -&gt; OS/2 -&gt; Metrics.</p>
      <p>Take the non-accented file and uncheck "Is Offset" by all of those fields.  Those are the numbers you'll want to manually input to your accented file if you want the accented one to have exactly the same line height (this will cause overlap of course with some combinations).</p>
