      <p>Okay, I'm sorry. The above post was my first reaction to the great work you're doing. But after I really pondered over your latest chart there are a couple of things that I should mention. Nothing great - just a few observations.</p>
      <p>1 - the first symbol should be down at the last of your chart. (unless you did this for a purpose) It's part of the vowels.</p>
      <p>2 - the "doh" symbol threw me for a second. It's downside up. I'm cool with that but that leads me to the third thing.</p>
      <p>3 - The Keetoowah and some elder Cherokees are very traditional and though I see nothing wrong with creating a font such as yours, some of the people will not go for it because it's so different (which is what I like about it). They are very weary of change. It usually takes a while for new things to catch on with them. However, at the same time, if they see the young people taking to it - the elders will let it slide because the younger generation is accepting it. One of the things that's going for your font is the fact that it looks gothic (sorry but I just had to say it - but hey! gothic Cherokee, cool). And our young people will like that.</p>
      <p>Again, I like what you're doing. I'd like to see it finished.</p>
  - id: 300608
    user_id: 14556
    user_name: cuttlefish
    user_path: null
    date_raw: 10 Sep 2008 — 10:06am
    date: 2008-09-10T10:06:00
    votes: null
    html: |-
      <p>Thank you, this is exactly the sort of advice I need. As a teacher of the language, you necessarily have a deeper technical understanding that even native speakers and writers may lack, so I certainly consider you to be an expert. I'll give more weight to your opinions than many other peoples research. On to your points:</p>
      <p>1. Indeed you are correct, and in checking my materials I understand why I did it like that and why you are right.<br>
      For some reason the V (shaped like "i") appears first in Plantagenet Cherokee when entered from the character palette. In Agamemnon, it appears sixth on the character palette, which is still incorrect, but that is where it is in the Unicode sequence. At least it appears after A (D), E (R with hook), I (T), O (Ꭳ), and U (O with horn), which are all the open vowels without consonants, so they belong on the same row together. For some reason Unicode has them at the beginning, rather than the end, which you suggest is correct. A logical argument could be made to put them either at the beginning or the end, but I'll go with your advice on the customary position when I produce my next sample.</p>
      <p>2.  DO is "V" shaped in the official font, and I will adjust mine to reflect that in adherence with custom. I gave it the "Λ" shape because it appears that way both in the Plantagenet font and in this scan of an early sketch of the syllabary attributed to Sequoyah:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Syllabary_6129.JPG"></div><br>
      But doesn't the V shape of DO sometimes lead to confusion with TSE?<br>
      I also noticed that the "A" shaped GO has a vertical stroke on the crossbar in this sample, not seen on other examples, but that is why I included it on mine.<br>
      I also expect my design of YI might be controversial.<br>
      DE has confused me, since it is one of several "S" shaped symbols, which looks just mangled in the official font and is distinguished from DU only by a twisted serif and half a line across the middle. In my DE I tried to make that cross stroke suggest a reversal, as if a "c" were drawn above a reversed "c" in a single motion, rather than as an "S". Does this sound reasonable to you?<p></p>
      <p>3. I'm not sure what to say about this. In the scripts of most languages, there is a lot of room for stylistic variation and decoration, but it's generally an issue of aesthetic preference unless you go so far with the design as to get something actually "wrong". With the CWY it's hard to tell what right and wrong even is, so I appreciate the assistance you've given me and any more you give in the future. The only connection I have with the language is that my parents went to Sequoia High School in Redwood City, CA, and the place was most likely named after the tree.</p>
      <p>I'm always cautious using the term "Gothic" around here. It has at least two nearly opposite meanings in typography which have little to do with the architecture, fashion/lifestyle trends, or Germanic tribes sharing that name.</p>
