      <p>The cyrillic looks good.  I agree with the choice of darker descenders.  I wonder if maybe on л you might want to pull the left leg in a little bit.  Also, the accent on И seems a bit too far to the left.  Or actually that might just be the ` as it's pretty far on the left on the E too.  </p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
