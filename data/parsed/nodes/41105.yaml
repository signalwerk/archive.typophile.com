      <p>I had to make this shot larger than the one for the Cherokee since some details didn't show up smaller. I tried to maintain the vertical contrast that the other scripts in the font have, but I'm afraid it has made some of the letters appear awkward. Rounding the serifs seems to have helped soften the lower case without creating too much disharmony, and radical redesigns from previous versions have improved legibility, but to what extent I'm not sure.</p>
