      <p>Russell, the question of volunteer vs. paid (not really vs. full-time) administrators is a common one in online fora. And my answer is I don’t really care; I just want results. “We’re all just volunteers here” is really an excuse for half-assed work. Why not improve the existing volunteers’ skills, or find new ones?</p>
      <p>The only sites I know with paid admins are MetaFilter and Slashdot. (I’m not referring to people who do nothing but respond to terms-of-service-violations complaints, which many, many sites have.) It helps, but it’s so rare that it doesn’t scale as a solution to the problem. Skills are the solution. One can learn those without a paycheque and in one’s spare time.</p>
