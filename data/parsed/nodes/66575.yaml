      <p>Joe, I agree with a lot of your points, but I think they would be better-received if you were an actual contributing member of this community and not someone who only writes criticisms of this forum and its posters. When was the last time you made a post that provided a valuable contribution to a thread's content?</p>
      <p>Please stop your 'sperging, and let this forum be. I agree that this forum could use improvements, but I also think that the number-one improvement that could be made to this forum is to get rid of "gimmick" posters like you and Uli who have become caricatures of themselves.</p>
      <p>MetaFilter is not the only good forum on the internet, and not every forum should be modeled after it. You insist that Typophile is a web forum first, but I think that you are wrong. Typophile is a community first, with a web forum that supports that community.</p>
      <p>EDIT: When I was in middle school I posted to a forum about Iron Chef. It was a very enjoyable experience, posting with like-minded people about a mutual interest. Then Iron Chef America aired, and fans of Iron Chef America came in, and the forum just turned into one giant argument over which show was better. These arguments were fun, because arguing over the internet is fun, but the novelty soon wore off. Typophile works for what it is — a place for people who share a passion about type to share healthy discussion and education about type. I have gained so much valuable type education from these forums, and in the past few months it has become less useful because nearly every thread is taken over by either your criticisms of how the forum is run or Uli's questionable legal advice. I know you think that you can help this forum, but the biggest way you can help it is to stop posting about how you can help the forum.</p>
