      <p>Hi there. I Jibran is off to a good start. A couple of suggestions:<br>
      -Drinking coffee is a warm and comforting thing, as is suggested by the name “hugamug”. Although your new logo may express this in a more subtle way than the original logo, I believe it is an important message to get across. Perhaps the choice of typeface will convey some of this warmth.</p>
      <p>-For the gift card, I am assuming it will be double-sided so I would find out if you need to leave room for any of the following:<br>
      (bar code, disclaimer, URL, contact info, etc)</p>
      <p>Good luck.</p>
