      <p>What’s wrong with their use of Maiandra? Univers is WAAY too bland for a company with a name like that. You trying to turn them into Starbucks or something? </p>
      <p>The first thing in a re-design shouldn’t be, “What can I scrap,” it should be, “What should KEEP.”</p>
      <p>Before scrapping the old idea completely, try re-configuring the usage of the old tyepface. Perhaps matching that really loose typeface with something tighter, but cleaner. I’m thinking something like Cronos Pro from Adobe. Something clean, but with some of the edge taken off.</p>
      <p>Or go the opposite direction, and bump up Maiandra up to the black weight. Black=coffee? You’ll certainly have a unique identity that is warm and huggable.</p>
