      <p>“I’ll be first working on improving the logo, then helping to choose some fonts they will continue to use in their marketing materials”</p>
      <p>I think that’s a good way to go about it. It’ll probably be more meaningful if you were to post images of the reworked logo/options and then seek suggestions on the brand typography. Otherwise you’d be getting somewhat generic type recommendations.</p>
      <p>“To finish things off, here’s a recent gift card idea I’ve started to play around with. I like the overall design so far...I can use all the help I can get”</p>
      <p>The colours look nice, but I feel you’re doing too many things with type - variations of font, weight and colour. I’d drop the Extended and Extra Condensed versions of Univers and work with just the regular one. </p>
      <p>Btw what is the idea behind the blister sort of effect?</p>
