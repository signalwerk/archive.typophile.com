      <p>“I think that’s a good way to go about it. It’ll probably be more meaningful if you were to post images of the reworked logo/options and then seek suggestions on the brand typography. Otherwise you’d be getting somewhat generic type recommendations.”</p>
      <p>I realize I’m jumping the gun a bit, as I’m not very far along myself in the development stages.  I’m kind of testing the waters as it is, and hopefully will start to get some more ideas up very soon. I’ll plan to post up some sketches as well as some initial designs in the next day or so, in order to kind of give everyone a better idea of what I’m thinking of.</p>
      <p>“It helps to know what size the card is. As it is the colours look nice, but you’re doing too many things with type - variations of font, weight and colour. I’d drop the Extended and Extra Condensed versions of Univers and work with just the regular one.”</p>
      <p>Sorry, the card is going to be digital only, probably in sizes between 125px and 500px, which is also the reason for the ’blister sort of effect’.  The client showed me some images that he liked, all of which included this effect, so I included it.  I definitely agree with the variations of the font, I’ll narrow that down and post up some future versions of that as well.  Unfortunately, the client wants the gift card available as soon as possible, therefore before we revamp the identity stuff, so I need to kind of plan ahead for that before I can spend much time on the logo.</p>
      <p>I really appreciate the comments, I should have some new images up soon.</p>
      <p>Thanks!</p>
      <p>- Jibran</p>
