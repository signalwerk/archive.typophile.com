    <p>Alright!</p>
    <p>So, I’ve started working on this project with <a href="http://www.hugamug.com" title="www.hugamug.com">www.hugamug.com</a>, an online coffee company who is preparing to revamp their webpage, and would like to work on improving their identity at the same time.  The logo is rather outdated, and there is very little printed material they use.  I’ll be first working on improving the logo, then helping to choose some fonts they will continue to use in their marketing materials.</p>
    <p></p><div class="imageWrap"><img src="/files/hugamuglogo_4595.jpg"></div><p></p>
    <p>This is their current logo, and as you can see, they’re using the same font, <a href="http://www.myfonts.com/fonts/galapagos/maiandra">Maiandra</a> for their other places on the webpage.  I’d like to change the font to a more simple sans serif font, and first suggested Univers, in a variety of weights, for their marketing materials, however the client finds Univers too neutral, and would like something that is more unique to the brand, as well as has more ’personality.’</p>
    <p>Ultimately, the question in more simple terms; what’s a good alternative to Univers that has more personality.  The client also uses <a href="http://www.1001fonts.com/font_details.html?font_id=466">Air Millhouse</a> in print, and would like to continue using this.  I like the font in some applications, but need to find some other fonts that compliment that as well..</p>
    <p>I realize I’ve been a bit longwinded here, and possibly a bit confusing.  I’m not sure how much help I’ll be able to receive here, and I really appreciate any responses here.</p>
    <p></p><div class="imageWrap"><img src="/files/GiftCard1_3812.jpg"></div><p></p>
    <p>To finish things off, here’s a recent gift card idea I’ve started to play around with.  I like the overall design so far, and would like to keep this kind of feeling throughout more designs. Feel free to comment on the layout and such here, as I can use all the help I can get. =P</p>
    <p>Thanks so much to anyone who replies, I really appreciate the help!</p>
    <p>- Jibran</p>
