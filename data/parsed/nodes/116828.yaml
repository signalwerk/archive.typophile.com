    html: |-
      <p>If you've got Indesign, you could try IndyFont, which is a script for indesign, with which you can quite easily create working OT fonts. (really!) It has some limitations, for instance no kerning, but it could serve your purpose, as it is quite inexpensive, and easy to work with. You can find it here: <a href="http://www.indiscripts.com/category/projects/IndyFont" title="http://www.indiscripts.com/category/projects/IndyFont">http://www.indiscripts.com/category/projects/IndyFont</a></p>
      <p>Another alternative is Glyphs Mini, which can be bought from the AppStore for 40€. It is quite friendly to work with for beginners, has some automated OT features, class kerning.  </p>
      <p>I have both (I am not a pro type designer, but I do create fonts form time to time for personal projects) and both of these might work for you as well.</p>
