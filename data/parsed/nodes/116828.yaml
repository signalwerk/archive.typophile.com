    html: |-
      <p>I can't really recommend IndyFont. It is like using an InDesign plug-in to cook dinner for you: the fact that it works is genuinely amazing, but it is simply the wrong tool for the job. A bizarre hack that makes one wonder why....</p>
      <p>Glyphs Mini and our own TypeTool are fine starter choices. If you don't care about your operating system’s UI conventions, and/or are on a tight budget, and/or love libre software, there is also FontForge.</p>
