    html: <p>All of the font producing software can use SVG files as source material. FontLab, Fontographer etc. On a basic level it would be cut and paste each glyph into the font program and refine from that and then generate the font. Least costly program is TypeTool from FontLab, but remember all of these programs do take a bit of time to learn.</p>
