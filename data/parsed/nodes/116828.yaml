      <p>I see you point Thomas, Indyfont is no real replacement for a font editor, but it does provide some easy to use tools for non-professional typedesigners. The functionality is limited, but it does work.</p>
      <p>I was quite dissapointed by TypeTool, especially when compared to glyphs mini. The interface was rather dodgy to use, even if I had some experience with fontlab. It feels outdated. Will there be an updated version any time soon?</p>
