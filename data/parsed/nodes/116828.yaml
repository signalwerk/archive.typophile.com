  html: |-
    <p>Hello,</p>
    <p>I am a graphic designer and I am currently working on a project. I am using a vector graphics program with some custom letters that I created for titling on publications for a company. I have the whole alphabet, uppercase and lowercase, all on the same SVG file. I don't have a lot of experience with creating font files and I was wondering if there was any way or software to create a font from these letters at it would be easier than having to copy and paste the letters to manually create the words?</p>
    <p>Thanks!</p>
