    <p>Hello -</p>
    <p>I try to add some characters (with FontLab®) into an existing .TTF font (eg. “çÇ”, …).</p>
    <p>In fact it’s a font with many separated weight (each weight is a .TTF file) .<br>
    When I export each file (after formated it as OTF table) everything goes well. <br>
    But, when All the fonts are installed, well only see one of them into Adobe® Illustrator® font menu.</p>
    <p>How is that possible?</p>
    <p>NB. I checked all the fonts with FontDoctor®, and No font problems were diagnosed! </p>
    <p>Thank you, have a nice day…</p>
    <p>- Dimitri <a href="http://www.thebend.be/" title="http://www.thebend.be/">http://www.thebend.be/</a></p>
