    html: |-
      <p>I haven’t seen a thread that deals with this, but here’s my workflow:</p>
      <ol>
      <li>Initial symbol sketches.</li>
      <li>Get the basic dimensions right in relationship to the UPM and the vertical metrics (and the context in which it will be used).</li>
      <li>Consider the intended size. Symbols needs to be simplified, exaggerated and unitized to work at small sizes in low resolution environments. Some “hacking” (and by that I mean deviating from a strict pixel grid) is helpful in reducing blur. A <a href="http://frodehelland.com/icon/" rel="nofollow">test page showing a range of sizes</a> is helpful in this process.</li>
      <li>Study how the various rasterizers interpret negative shapes, positive shapes, overshots, diagonals. Keep in mind medium resolution displays like Apple’s Retina.</li>
      <li>Convert curves to TrueType.</li>
      <li>Windows dependes on TrueType hinting. In addition to that,  I often find my self correcting adjustments done for other platforms (#4) with TrueType hinting. This might be the biggest hurdle.</li>
      <p> (Autohinting does not work well enough for my standards.)</p>
      <li>Encoding. Encoding an icon as another glyph breaks one of the fundamental rules of the web. You should ideally find an equivalent in Unicode, or use the PUA area. What happens if someone doesn’t have the font? What will they see then?</li>
      <li>Exporting: FontSquirrel is helpful in generating correct files, and getting vertical metrics right across multiple browsers. If the icon is intended to be displayed large, you might want to consider Postscript outlines (go back to #5). FontSquirrel can’t handle WOFF’s with Postscript outlines, so then you need to use another tool for exporting.</li>
      <li>Serving: How heavy are the final files? Too heavy for a website? Can I reduce the file size?</li>
      </ol>
    html_clean: |-
