    <p>Hi there, </p>
    <p>I am looking for sources and suggestions on creating a font consisting custom icons. It will be for an e-commerce web site. Approx. 30, site specific artworks have to be drawn and executed as a webfont. The icon webfont seems a clear solution for the developers who think to use the full advantage of a leaner CSS. </p>
    <p> I am using Fontforge since I have started to draw my own projects with it. But I just can't make any sense on the baseline for artworks. The glyph proportions and icon proportions seem to differ greatly. </p>
    <p>Any suggestions or threads directing me to a solution are highly appreciated!</p>
    <p>Thanks,<br>
    Ayse</p>
