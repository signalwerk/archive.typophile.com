      <p>I really appreciated your advice on the workflow Frode! </p>
      <p>Thank you so much. We did a test page already. I edited the font file saved as .ttf then my colleague worked on converting it via fontsquirrel to webfonts then created an html sample to display the set. But what struck us were how large pix size we need to use for the icons in order to keep the appearance consistent with our Photoshop comps. </p>
      <p>Immediately we decided to work in context with our webfonts (Proxima Nova Soft) and re-test it with the content blocks from the site.</p>
