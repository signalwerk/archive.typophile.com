    <p>I'm looking for a font family of san serif and sans which would look great for a scientific book design. It will be on string theory. Any suggestions would be great. </p>
    <p>The fonts I like are:</p>
    <p><a class="freelinking external" href="http://usfonts.gestalten.com/t-star.html" rel="nofollow">http://usfonts.gestalten.com/t-star.html</a><br>
    <a href="/wiki/https%3A/%252Fourtype.com/%2523/try/pro-fonts/fakt/" class="freelinking" rel="nofollow">https://ourtype.com/#/try/pro-fonts/fakt/</a><br>
    <a class="freelinking external" href="http://usfonts.gestalten.com/blender-pro.html" rel="nofollow">http://usfonts.gestalten.com/blender-pro.html</a></p>
    <p>But I need to use a type with a sans serif and serif version rather than using two typefaces.</p>
