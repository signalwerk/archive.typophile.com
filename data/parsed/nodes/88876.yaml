    <p>Hey typophile…&nbsp;pretty simple request. Looking for a good ri ligature in a Didone such as Didot and the like. (More Didot or Bodoni than Museo or Egyptienne.) Also open to condensed faces, too. </p>
    <p>This is for logotype design so even if your suggestion doesn't fit the bill, anything helps for inspiration as I may end up drawing the ligature myself. </p>
    <p>Thanks—</p>
