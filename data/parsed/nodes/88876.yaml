      <p>I am constantly reminded about how many variables there are worth accounting for!</p>
      <p>I'm am specifically looking for something where the tittle of the 'i' and the shoulder (terminal?) of the 'r' are the same/united. Riccard's example is not quite on the mark. I admit that in the traditional style of didones, this may be sacrilege but who knows. </p>
      <p>Also wanted to say that I wasn't able to find a metal sample of Cheltenham, (though there are some half-decent flickr pictures up, but nothing of substance.)</p>
