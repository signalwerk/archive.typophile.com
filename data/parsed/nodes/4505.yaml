    html: "<p>Here is a link to Yannis's Baskerville article: <br> <br><a href=\"http://omega.enstb.org/yannis/pdf/article-gut99.pdf\" target=\"_blank\">http://omega.enstb.org/yannis/pdf/article-gut99.pdf</a> <br> <br>He used text figures in text as well as in maths. Flipping through a copy of <i>G. Polya'</i>s famous book -- <i>How to Solve It</i> -- also shows that Baskerville with text figures was used; my copy was the Princeton University Press version from '88. <br> <br>My question is: Does anyone know why Baskerville was used quite frequently in older textbooks in mathematics?</p>"
