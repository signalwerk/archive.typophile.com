    html: "<p>Hi Matt, <br> <br>There are not many choices for fonts with loads of mathematical symbols. Check these (TeX oriented) for some discussions: <br> <br><a href=\"http://www.ntg.nl/maps/pdf/21_18.pdf\" target=\"_blank\">http://www.ntg.nl/maps/pdf/21_18.pdf</a> <br><a href=\"http://home.vr-web.de/was/mathfonts.html\" target=\"_blank\">http://home.vr-web.de/was/mathfonts.html</a> <br><a href=\"http://www.yandy.com/products.htm#fonts\" target=\"_blank\">http://www.yandy.com/products.htm#fonts</a> <br><a href=\"http://www.micropress-inc.com/fonts.htm\" target=\"_blank\">http://www.micropress-inc.com/fonts.htm</a> <br> <br>Thierry Bouche had some examples of using text figures in maths here: <br> <br><a href=\"http://tex.loria.fr/fontes/maths/cartan-english.html\" target=\"_blank\">http://tex.loria.fr/fontes/maths/cartan-english.html</a> <br> <br>It's an attemp to reproduce the look of an older mathematical book which was set in Baskerville with text figures. Donald E. Knuth's <i>Concrete Mathematics</i> was also set with a mixture of text figures and lining figures for different purpose. The other bit was that DEK used different fonts: his CM Concrete for text and Zapf's Euler for maths. Yannis Haralambous wrote an artilce (in French) on how he used Baskerville for maths -- the like is currently down for me, cannot confirm. <br> <br>I have started trying to set my current writing with text figures. The pages look quite nice with Minion, New Baskerville, and Euler in different run of course. Cronos+Euler looks quite handsome on a projector.</p>"
    html_clean: "<p>Hi Matt, <br> <br>There are not many choices for fonts with loads of mathematical symbols. Check these (TeX oriented) for some discussions: <br> <br><a href=\"http://www.ntg.nl/maps/pdf/21_18.pdf\" target=\"_blank\" class=\"link-external\">http://www.ntg.nl/maps/pdf/21_18.pdf</a> <br><a href=\"http://home.vr-web.de/was/mathfonts.html\" target=\"_blank\" class=\"link-external\">http://home.vr-web.de/was/mathfonts.html</a> <br><a href=\"http://www.yandy.com/products.htm#fonts\" target=\"_blank\" class=\"link-external\">http://www.yandy.com/products.htm#fonts</a> <br><a href=\"http://www.micropress-inc.com/fonts.htm\" target=\"_blank\" class=\"link-external\">http://www.micropress-inc.com/fonts.htm</a> <br> <br>Thierry Bouche had some examples of using text figures in maths here: <br> <br><a href=\"http://tex.loria.fr/fontes/maths/cartan-english.html\" target=\"_blank\" class=\"link-external\">http://tex.loria.fr/fontes/maths/cartan-english.html</a> <br> <br>It's an attemp to reproduce the look of an older mathematical book which was set in Baskerville with text figures. Donald E. Knuth's <i>Concrete Mathematics</i> was also set with a mixture of text figures and lining figures for different purpose. The other bit was that DEK used different fonts: his CM Concrete for text and Zapf's Euler for maths. Yannis Haralambous wrote an artilce (in French) on how he used Baskerville for maths -- the like is currently down for me, cannot confirm. <br> <br>I have started trying to set my current writing with text figures. The pages look quite nice with Minion, New Baskerville, and Euler in different run of course. Cronos+Euler looks quite handsome on a projector.</p>"
