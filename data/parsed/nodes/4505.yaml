  html: "<p>Hi all, <br> <br>I'm looking for fonts with extensive sets of mathematical notation. Know of any? <br> <br>Also, I've been trying to decide if text figures are a good choice for mathematical/technical texts. For example: <br> <br>y = 3x <br> <br>I'm so used to seeing titling figures used in this situation that when I try using text figures, it looks very strange. I think having a height difference between numbers and variables is a good way to visually distinguish them. Also, the convention is to seperate mathematical formulas from the rest of the text, sort of the way you would a block quote. If you accept that convention, none of the arguments about titling figures disrupting the even texture of a block of text apply.  <br> <br>This leads me to consider mixing text figures and titling figures; test figures for numbers in blocks of text, and titling figures for formulas, but this looks inconsistent. How do others deal with this issue? <br> <br>Any good texts that cover mathematical typography? <br> <br>Matt <br> <br> <br> <br></p>"
  html_clean: "<p>Hi all, <br> <br>I'm looking for fonts with extensive sets of mathematical notation. Know of any? <br> <br>Also, I've been trying to decide if text figures are a good choice for mathematical/technical texts. For example: <br> <br>y = 3x <br> <br>I'm so used to seeing titling figures used in this situation that when I try using text figures, it looks very strange. I think having a height difference between numbers and variables is a good way to visually distinguish them. Also, the convention is to seperate mathematical formulas from the rest of the text, sort of the way you would a block quote. If you accept that convention, none of the arguments about titling figures disrupting the even texture of a block of text apply.  <br> <br>This leads me to consider mixing text figures and titling figures; test figures for numbers in blocks of text, and titling figures for formulas, but this looks inconsistent. How do others deal with this issue? <br> <br>Any good texts that cover mathematical typography? <br> <br>Matt <br> <br> <br> <br></p>"
