    html: <p>Excellent work. I really like the over look. The Kk in particular and also the French ampersand are quite nice. Here some comments. I find the lower bowl of the g too small, that letter should have more “personnality”. At my point of view it's seems too timid. It could be a bit larger. The top of the G could be a bit wider, the S would be more open on the top or the drop is too low, Finally, overall the typeface are slightly condensed, but some letters (B, R, K, S) looks a bit extended compare too other T, M, N, V, W). Keep going.</p>
