      <p>I love this! Really elegant and charming! The ampersand and numerals are especially delightful!<br>
      I'm sorry you've reduced the drippy terminals on the C and G, which I think were really lovely and I think perhaps the balance of the forms is a bit lost (G especially looks a bit bottom heavy).<br>
      F may be a little wide? And maybe S too?<br>
      Descender of j could maybe have a tighter curve on the right side?<br>
      1 looks a little light?<br>
      Delicious! Looking forward to seeing this continue :)</p>
