      <p>So I got a response from the designer Laurenz Brunner, and this is what he had to say:</p>
      <p><cite>The typeface used for the book is custom made, based on a vintage metal serif font. I'm considering [publishing] it on <a href="https://web.archive.org/web/20190930194226/http://www.lineto.com/">Lineto.com</a> some time but I'm not sure yet.</cite></p>
      <p>You can reach him through Lineto if you want discuss it with him.</p>
      <p>Horton<br>
      Founder, <a href="https://web.archive.org/web/20190930194226/http://www.thisdayintype.com/" target="_blank">This Day in Type</a></p>
