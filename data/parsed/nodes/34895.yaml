      <p>The book was really designed by a couple of emigrant Dutch designers with a Basque editor from a Swiss publisher (the legend continues...). There is just something strange going on with the a — while the d, c, e and and s feel continuous. I'm pretty curious about this one, so I've hunted down one of the designers and sent him an email. We shall see!</p>
      <p>Horton<br>
      Founder, <a href="http://www.thisdayintype.com" target="_blank" rel="nofollow">This Day in Type</a></p>
