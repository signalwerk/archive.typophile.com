    html: |-
      <p>This book have been awarded one of "The most beautiful swiss books" and the font is called "Bradford" in the catalogue<br>
      But the font is also known as Römische Antiqua, Haddonian or McFarland<br>
      The capitals were designed by A. Anklam and the lower cases by Heinz Koening for Genzsch &amp; Heyse in 1888<br>
      (and not in 1988 as written in Jaspert, Berry &amp; Johnson, Encyclopedia of Type faces)<br>
      (image found @ typefoundry.blogspot.com)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Unknown_5555.jpeg"></div><p></p>
