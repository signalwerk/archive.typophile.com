    html: |-
      <p>2 fonts actually:</p>
      <p>"Familie" must be <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Linotype&amp;ffam=Zapfino%20Forte%20LT%20Pro%20-%20Regular&amp;fid=8dd132e50c94970f9d4b7c49db32a69b&amp;fsize=60&amp;text=Familie&amp;fit=1" rel="nofollow">Zapfino</a></strong> by Linotype - probably Zapfino Extra</p>
      <p>while the smaller text ("Tina", "Daniel", etc) looks like <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Bitstream&amp;ffam=Amazone%20BT%20-%20Regular&amp;fid=b34ea6e4cdd617101fed842bdadba46c&amp;fsize=60&amp;text=Tina%20Daniel%20Endre%20Tobias%20Alt%20fordi&amp;wrap=2" rel="nofollow">Amazone</a></strong> by Leonard H. D. Smit (1958) available from Linotype &amp; Tilde<br>
      (The latter was also digitized by Dan X. Solo as "Amapola")</p>
      <p>------------------<br>
      I found them using "Find my Font": <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
