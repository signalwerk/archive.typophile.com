      <p>Ricardo has a point with respect to the rate at which the media can be consumed. I hardly ever buy media, instead using my local library’s usually adequate hold/request network to borrow things that I’d like to watch/read/listen to. A lot of other people do this, though, so the waits for certain items can be quite long. </p>
      <p>Yes libraries are usually free, and used media outlets are usually cheaper, but they are rarely more convenient than the illegal methods. And besides cost, convenience is probably the most important factor in all of this. </p>
