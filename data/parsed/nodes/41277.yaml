      <p><em>Exactly. So, if I buy a digital file, and I want to share it with someone, can I? Should I?</em></p>
      <p>Well, as I pointed out later in the post you’re quoting, you can “share” a book you buy, yes, but there are limits to that sharing. All you have to do is turn to the copyright notice of almost any book to find something along these lines: <strong>“No part of this book may be used or reproduced in any manner without written permission from the publisher, except in the context of reviews.”</strong></p>
      <p>That notice hasn’t stopped pirated editions of books from being published in the past (before personal computers). But MOST people abide by the law... With digital media, suddenly it’s very easy to make a copy of something... so easy that a lot of people don’t consider it stealing.</p>
      <p>But the law is still there. It’s a convention that everyone agrees on. That’s what laws are. <strong>Rules we all agree on to be able to live in society and get along.</strong> You don’t HAVE to stop at the red traffic light... It’s just a man-made rule... right? (Of course, if you get run over by another car while crossing that red light, don’t blame anyone else.) Just because you CAN do something, you don’t just go and do it.</p>
