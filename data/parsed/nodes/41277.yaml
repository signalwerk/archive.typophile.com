      <p><em>There’s also a difference in price: the “institutional/educational” DVD of Helvetica is $350. (I know because I ordered it for my university.)</em></p>
      <p>Thanks for pointing that out, Eliason. I thought of that only after I’d finished my post. I remember that back in the days of VHS, replacing a customer-destroyed VHS tape from a rental store cost a lot more than usual.</p>
      <p>But I think that makes sense... A lot more people are going to get mileage out of that one DVD, or VHS, or book. It’s not all that different from paying more to a foundry or software maker if you are using their product on several machines as opposed to just one computer.</p>
      <p><em>Yes libraries are usually free, and used media outlets are usually cheaper, but they are rarely more convenient than the illegal methods.</em></p>
      <p>What about quality? How good can an illegal, online version of a movie be? Or a DVD sold on the street while the movie is in theaters, for that matter? Is it going to be high-res? Will the picture be as crisp as on a DVD? Will the bonus material be there?</p>
      <p><em>Another interesting angle to consider are used media stores such as used CD, Book, DVD, and Video Game stores.</em></p><em>
      </em><p><em>They’re actually making a profit selling media that the original artist does not get a share of.</em></p>
      <p>Those stores are selling used media, and therefore the price is cheaper (if the item is not rare or out-of-print, that is) than for a new copy. Besides, when someone buys a (new) book or DVD, it’s theirs, and if they want or need to sell it to someone else who will give them some money in exchange, well, they are entitled to do that. The original author of the product already made money from it. Why should s/he get a profit from it again?</p>
      <p>On the other hand, buying a book or DVD does not give the purchaser the right to make copies of it and sell the copies for personal profit. And the fact that a book is available, whether in a store or library, does not give anyone the right to copy passages from it and publish them as their own.</p>
      <p>Intellectual property theft is not new... What’s new are the means by which it is being done nowadays...</p>
