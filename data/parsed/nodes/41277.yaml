      <p>Watching a movie or listening to music is a passive act of sensory intake. Sharing it is so others can enjoy seeing or hearing it is still copyright infringement if a copy is made. Fonts and software are tools. Sure some people just like to look at them, but they are interactive tools and components of other creative work. If music was shared and then inserted into a TV commercial that takes the infringement to the level of unlicensed font usage. Fonts are made to be actually be used (except perhaps a few conceptual P22 fonts and some Fuse fonts) because of this, I feel the sharing or less euphemistic term of stealing is more offensive for fonts than music. Not to downplay it or be a hypocrite, I annoy friends when i turn down their offers to burn me some music CDs.</p>
      <p> I think Ehague hit the nail on the head <em>piracy is not only a product of greed or a false sense of entitlement but of laziness.</em></p>
