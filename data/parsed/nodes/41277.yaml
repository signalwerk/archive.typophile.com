      <p>Gary I think the comment you posted on your site was very provocative. I suppose I find it to be that way mostly because I’m not in your position (or the position of other foundries). I don’t have anything to share. Personally, and from some of my research into pirating, I really do not think you will generate a significant amount of sales by sharing it. I’ve watched television shows on the station sites because I’ve missed them on TV. I watched them because I like the shows and didn’t want to miss them. But, would I buy them if that wasn’t available? No. Maybe this isn’t a good analogy. But I really question offering a full-length version (lo-res or not) to get others to buy it. </p>
      <p>Everyone else. I know we all mean well, but I get sick even seeing those shareware sites name mentioned here. You mention the name and you might just be educating someone who didn’t know about it. Yeah I realize people can find out about it anyway, but why do they have to learn about it here? Let’s keep Typophile clean of stuff like this. If you have links which you’d like to report you can email one of the moderators. I personally have contact with many foundries and would gladly send along the information to them. Thanks.</p>
