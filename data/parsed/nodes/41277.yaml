    html: |-
      <p>Trying to get torrents taken down, only to have someone upload it again the next day, is sort of a waste of effort at this point. I’d like to make more films, not spend my days writing cease-and-desist emails. </p>
      <p>The Google video issue was different since it was instant access to the full film for anyone who wanted to click, no special software or overnight download needed. And since it was on Google, I think most of the design-blog-reading public assumed it was legitimate. The idea of letting the public watch a small-window, low-res version of the entire film to increase awareness is something we’ve talked about (not just for Helvetica, but with all the films Plexifilm releases). And it’s something we might still do. Watching Helvetica rocket to the #1 watched video on Google was sort of flattering, I guess. </p>
      <p>The question is still this: does free access to a low-res version of a full film, and the increased web attention that can bring, actually help sell more DVDs and merchandise?</p>
      <p>Cheers,</p>
      <p>-Gary</p>
