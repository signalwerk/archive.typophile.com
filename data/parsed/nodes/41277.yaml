      <p>I liked what you said on the film’s website, Gary — namely,</p>
      <p><em>“My biggest issue is that it should be the artist’s decision whether to release their work for free. I don’t think it’s fair that someone else can decide to give my work away, and profit from it.”</em></p>
      <p>If I didn’t already own the DVD, I would get one even if it were available online 24 hours a day. I’m the kind of person who would rather have a record (vinyl or CD) than a low- or medium- quality MP3. And for me, having the CD or DVD includes the packaging, the cover, the booklet. (Yes, I have songs on my computer. I admit that it’s convenient. But I still like having “the real thing.”) Before music was available in a digital format, I would often tape my friends’ records, and even then I would end up buying certain records — the ones I liked a lot — anyway. Tapes tend to break after a while, and the sound quality is never as good as the original record. But I realize that not everybody acts or feels this way.</p>
      <p>Getting back to design-related documentaries, the other day I noticed that Hillman Curtis’s films of graphic designers are <a href="http://www.amazon.com/Hillman-Curtis-Designer-Series/dp/B000K15WL6/ref=sr_1_1?ie=UTF8&amp;s=dvd&amp;qid=1201373198&amp;sr=1-1">available on DVD</a>. Apparently, the DVD was released in October of 2006, but until now all I knew was that they have been online, mostly on <a href="">Hillman Curtis’s website</a>. So am I going to buy the DVD? Damn straight. I can’t compare these shorter films to a feature-length film like <em>Helvetica</em>, but I wonder if having his films online has hurt sales of the DVD. Or if the DVD has material that is not available online. Ultimately, though, it is Curtis who has posted the films on his own website, so in this case the artist is making that decision.</p>
