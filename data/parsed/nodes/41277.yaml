      <p>Darrel (aluminum), that’s an interesting point you bring up. DVD rental stores are in a similar (though not free) situation to public libraries.</p>
      <p>Aside from the legal/socially accepted difference, there is another, perhaps more important difference: with libraries or DVD rentals, you have one or maybe a few copies of the movie on loan to individuals at any given time (when not on the shelf). But with a bit torrent, you have the possibility of many, many individuals accessing the film at the same time — and all over the world, not just in one neighborhood or city.</p>
      <p>And don’t forget that libraries and rental stores have to purchase a copy of the film before they can loan or rent it.</p>
