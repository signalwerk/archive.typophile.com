    <p>According to <a class="freelinking external" href="http://blogs.reuters.com/trail08/2008/06/23/obamas-presidential-seal-was-for-one-time-use/" rel="nofollow">this article</a> the quasi-Presidential seal that showed up at an Obama event was roundly criticised and removed from the campaign the next day. </p>
    <p>The graphic design saga of Obama's campaign has been covered extensively. </p>
    <p>The Washington Post a week ago or so reported that Obama had reservations about the original O logo, finding it a bit too corporate, but went along with it, deferring to his advisors on this. David Axelrod seems to have commissioned it. </p>
    <p>The 'presidential seal' thing was so close to parody that I wonder why they thought it was a good idea. I'm curious as to whether the different designers did the original O (great qualities, but a bit too cartoonish, IMHO), the superb "Change we can rely on" in Gotham, and then this misfire.</p>
