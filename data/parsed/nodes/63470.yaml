      <p>The size relationships within your type hierarchy looks odd to me. Very clunky and amateurish.</p>
      <p>Your name at the top is too big. The all caps section heads are also too big as are the main titles of your employment history.</p>
      <p>Everything seems a bit loud, as if it is talking too loudly for the room. Also all of that sans serif type gets a bit boring. No contrast.</p>
