      <p>Very nice. I would make the underlined text in the gray bar on the right, bold instead, perhaps the same font you used on the right in dark gray. There are no other underlines in the resume, the line under the name isn't an underline.</p>
      <p>The language and computer skills seem to almost be bullet points but since they aren't I would use commas on them.</p>
      <p>Skills and Interest shouldn't be centered, all the text on the right should line up (left), even the stuff in the gray with its padding.</p>
      <p>I think the rest is very solid.</p>
