    html: |-
      <p>• Lose the underlines. If you really want this effect, use rules set farther from the letters and with a weight that relates to the letters.<br>
      • Put dashes in date ranges, not hyphens.<br>
      • Track out those tight capital settings.<br>
      • Fix the rule sticking up next to “REFEREE”<br>
      • Don’t use quotes around the word spin<br>
      • HTML/CSS is not a language skill<br>
      •&nbsp;Use semibold for the grey bold subheads.</p>
