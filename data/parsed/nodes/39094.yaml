      <p>I’m not sure what you mean by “kinetic identity system”.  What you’re showing is pretty static and singular.  Do you intend multiple versions?  Subbrands that vary through color or other relationship?  </p>
      <p>What you’ve shown so far are only 2 very simple iterations.  If I were your teacher, I’d expect to see considerably more work.  Now, maybe you’ve done that and are only showing us your most promising directions. If that’s the case, then you need to push yourself harder.  I get the concept of the arches, but I don’t see a unique expression that relates to Flint.  Maybe that’s why you’re looking for something more tangible, like materials, to bring into the system.  That’s a fine idea, but you’ve got to nail down the graphic expression first.  Explore what can make this identity unique to Flint and you’ll be a bit closer to a better logo.</p>
