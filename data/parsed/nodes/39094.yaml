    <p>I am currently working on a kinetic identity for a non profit org in my vis com class and I have chosen ’flint club’.<br>
     This organization basically promotes prosperity and connecting people in the downtown flint/michigan area by hosting various events. </p>
    <p> The logo itself depicts an arche. There are seven arches that had been erected in the early 1900s that covered different streets in the downtown area that also lit the roads at night. They are iconic and i have decided to exploit them in the logo. </p>
    <p>I almost want to approach this logo in a more tangible form to better relate to the kinetic identiy system, some type of material i can use to enforce the idea of the hard working/blue collar, grounded city. I just cant think of anything, help? comments?</p>
    <p>many thanks!</p>
    <p>- JR</p>
