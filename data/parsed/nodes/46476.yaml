      <p>hi logy,</p>
      <p>&gt; Im looking to find a font that will compliment Times New Roman.<br>
      &gt; Its for a clients brochure and they make furniture. They preferably<br>
      &gt; would like a sans serif...</p>
      <p>as already suggested I agree that Univers (preferably in the condensed version) is a reasonable solution.</p>
      <p>However, if you could get your hands on some old books from "Severin und Siedler Verlag" designed by Otl Aicher solely using Times, you'll see, that this much-maligned typeface doesn't even need a complementing sans, but is strong enough to support a remarkable, fresh and modern design on its own.</p>
