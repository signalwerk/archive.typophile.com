    html: |-
      <p>Why perverse? </p>
      <p>Also, what happens with type is that you always have to make small adjustments. </p>
      <p>I suggest that you work from a med to a bold or a bold to the med &amp; then go to a light. The chances of the medium being really good based on the design that arrives from a interpolated light &amp; bold seem small. </p>
      <p>But to be fair I don’t know this per se. I haven’t done it yet myself. But type process are not direct - they always need tweakage.</p>
      <p>I am sure other folks here can say more about it.</p>
