  html: |-
    <p>Perhaps the knowledgeable could verify my thinking.</p>
    <p>I have a sketched vision for a new typeface. On paper it’s quite ’plump’, so I could easily start with a bold or black design in FontLab. It’s my understanding (mainly from other threads) that to easily interpolate a family I should make a bold and a light. This design may well suit that. Is this an appreciable intention?</p>
    <p>Until now I’ve not really been able to visualise things that aren’t a medium/in-the-middle weight. Working from the outside in sounds a bit perverse!</p>
    <p>Any thoughts warmly appreciated.</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20080709015339/http://www.typophile.com/node/44469" class="topic-previous" title="Go to previous forum topic">‹ Merge Font Families Into Single Suitcase</a> <a href="/web/20080709015339/http://www.typophile.com/node/44305" class="topic-next" title="Go to next forum topic">Font Family Menus? ›</a></div>
