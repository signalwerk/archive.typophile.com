    html: |-
      <p>If you feel comfortable with it then designing from the outside in is okay. You will probably find out that the interpolated regular needs some corrections.</p>
      <p>The other problem, however, is that during the process of making test printouts and modifying your font(s) you will probably end up making the “same” corrections to the bold and the light, especially when you are testing your regular, so you have double the work. This has happened to me and I have wasted lots of time. That is the only reason why I now tend to develop the regular first.</p>
