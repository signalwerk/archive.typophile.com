    <p>Hi </p>
    <p>I´m choosing a typeface to design a signage system. It is a Gallery of Art founded by John Ruskin and, I am looking at Humanists typefaces such as Johnstons, Eric Gills and Frutiger as well. They are easier to find.</p>
    <p>My favourite choise is Bliss designed by Jeremy Tankard, do you think that I could just buy one of his typefaces and use a stroke in Illustrator to create a bigger weight if need it? This project is just to be presented at my degree. </p>
    <p>Sorry for my grammar mistakes! and Thank you for any feedback</p>
    <p>Laura</p>
