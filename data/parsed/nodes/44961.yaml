      <p>Thanks Miss Tiffany,</p>
      <p>yeah it is for a student project and I cann´t afford to buy the type though i´ve mention Bliss and Arrival on my research development.</p>
      <p>The Gallery shows Fine Art and Illustration work. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/B (4)_6653.JPG"></div><div class="imageWrap"><img src="http://typophile.com/files/IMG_0787_4863.JPG"></div><p></p>
      <p>Well, as you can see. They use New Gothic Font. The Wayfindin to Ruskin Gallery is just "doesn´t exist". The whole university started as "School of Art" in 1858 but, just recently has changed its name to Anglia Ruskin University. </p>
      <p>This is one of the reasons for what I thought to give it a more personal look to the signage would be appropiate it.</p>
      <p>At the moment, I´m trying to simplify this idea, make it more contemporary but with a hint of the Arts &amp; Crafts Movement.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Signage 1-A·3_3906.png"></div><p></p>
      <p>Thanks for your time :)</p>
