      <p>Laura, I would never suggest using a stroke on a typeface to add weight. In doing so you are ruining the original curves. Of course, some have done this for affect and it does work, but in this instance I think there are plenty of weights available that you might not need it.</p>
      <p>I forget is this for a student project or work? Too lazy to go back to email. ;^)</p>
      <p>Bliss is a more refined (non-derivative), some might say, version of Gill Sans. Can you show us some of the work used in the exhibit or tell us more about the space, colors to be used, etc?</p>
