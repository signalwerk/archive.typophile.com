    <p>I just noticed a peculiarity on the fonts.com site (Monotype) that could end up making you pay more than you need to for a font. The site figures out what country you're in and displays the prices in the appropriate currency. But currencies fluctuate relative to each other, and this pricing apparently isn't live.</p>
    <p>For example, I'm in Canada, and a font was displaying $43 CAD. Switching the display to U.S. currency, I found the price is $35 USD. But the two currencies are about equal now. It should be about $35 CAD as well.</p>
    <p>Bottom line: check the exchange rates and compare with other currencies. You might save money buying in something other than your home currency. Not a problem paying by credit card: the credit card company will convert it to your own currency on your bill.</p>
    <p>I've emailed Monotype about this; will post their response when I receive it.</p>
