      <p>I had a reply from Monotype about the currency matter, and they're looking into it.</p>
      <p>Don--I didn't go far enough through the checkout to see if they actually billed everything in USD, as I wasn't purchasing the font. I should have experimented with that. Still, if they're going to have prices visible in different currencies for the convenience of customers, they should be reasonably close to reality.</p>
      <p>Jackie--I do book work too, and it has been a real hassle up here in Canada with the exchange rate changing so much in the last few months. I don't print a price on books in cases where I have the say--the stores can put their own sticker on.</p>
