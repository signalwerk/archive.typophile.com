      <p>Agreed with the above statements. This does look it would only attract a certain type of clientele so their work needs to back up the unique look of the logo. </p>
      <p>It would be nice to see a few examples of what they’ve done to see if the logo would match. </p>
      <p>Also I would thicken the weight of the type. I don’t think it’ll lose anything in doing so. </p>
      <p>I dig the colors and the possible variances is nice.</p>
