    html: |-
      <p>Thanks for all the feedback.</p>
      <p>They do interiors, and the logo is a bit to modern and cutting edge for most of their work, but they are at a point where they start getting more young designers working for them, and if the designers can´t be in front who is supposed to be? I just have to mention that the other direction for this logo is a straight Aksidenz Grotesk Black or, only typo(nothing to show you at this point). </p>
      <p>They do mostly restaurants and cafés. You can have a look at their old <a class="freelinking-external" href="https://web.archive.org/web/20081012141247/http://www.rissdesign.no/">website</a>, which I´m going to redesign, and that´s the reason for changing the logo. They are not quite satisfied with their old logo and the website is not updated since 2004 or something, have a look for yourselves<!--
