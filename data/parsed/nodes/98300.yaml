    html: |-
      <p>Try to get a copy of the venerable Typografischen Monatsblätter article about news faces.</p>
      <p>BTW the New York Times is a good choice because relatively recently they commissioned Matthew Carter to do a full revival of Cheltenham; it's pretty well-documented* and you might even be able to swing interviews with the people involved.</p>
      <p>* Real quick:<br>
      <a href="http://idsgn.org/posts/know-your-type-cheltenham/" title="http://idsgn.org/posts/know-your-type-cheltenham/">http://idsgn.org/posts/know-your-type-cheltenham/</a><br>
      <a href="http://www.nytimes.com/2003/10/21/business/media/21PAPE.html" title="http://www.nytimes.com/2003/10/21/business/media/21PAPE.html">http://www.nytimes.com/2003/10/21/business/media/21PAPE.html</a><br>
      <a href="http://typophile.com/node/55803" title="http://typophile.com/node/55803">http://typophile.com/node/55803</a></p>
      <p>hhp</p>
