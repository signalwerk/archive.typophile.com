    html: |-
      <p>Hey Gang,</p>
      <p>Sorry you're all off-base . . . Firstly, I have no dreams on making another Identifont, not even close . . .</p>
      <p>TypeSnitch is simply a tool for font foundry owners to find 'freely' distributed versions of their commercial for sale only fonts floating all over the internet that shouldn't be there and automates the task of getting them removed via automated or manually executed take-down letters, DCMAs, etc and building relationships with site owners who didn't know the fonts were there to get them removed and generally doing what the service can to assure the top search results for a font name yield ACTUAL retailers of the fonts first and not free downloads of the fonts.</p>
      <p>TypeSnitch is a tool and nothing more and one that I think myself and a lot of font designers really need to preserve the value of their libraries. I'd much prefer to make fonts and negotiate licenses than troll the internet and send take-down letters all day and figured there must be a way it could be automated if such a tool was built for this task, so I got in touch with a developer who agreed the idea made sense and if it could be funded would be built .</p>
      <p>I'm pleased with how quickly it received funding which means lots of folks support the idea and as the funding increases, it gives the developer more capital to make the service better. To be absolutely clear about this, while I'm a primary driver of the effort, I haven't and won't ever receive a dime of the funds donated, they 100% go to the developer and PayPal who takes their cut to accept the funds.</p>
      <p>I suspect over time, the cash I donated to fund the effort will be easily returned in legitimate font sales of my works and it gives me peace of mind that I'm doing something to assure the sites that shouldn't have 'em don't. The fact that I opened up the project so other font designers could participate was because I knew it was a tool others needed, just as I do and to be more than fully funded in under 3 weeks proves that.</p>
      <p>Lastly, I must point out the ONLY comparison to Identifont was made as a suggestion by Hrant just above in this thread about what the service COULD be and I'm honestly puzzled how quickly the wheels fell off the train with Stephen and Nick's posts since nothing I'd ever posted suggested TypeSnitch would be an Identifont type service.</p>
      <p>And Nick, I'm not sure what you're getting at but you are welcomed to e-mail me offline at (diner at fontdiner dot com) if you have some dirty laundry you feel the need to air and FWIW, I think you have a wonderful library and respect your work but honestly have been deeply perplexed by your need to give it away freely and presume it will retain any value, perhaps I'm mis-understanding your intentions.</p>
      <p>Calm heads everyone please, I do feel like I just broke up a lynch mob . . . Please ask questions rather jumping to conclusions so the wrong information isn't being communicated carelessly.</p>
