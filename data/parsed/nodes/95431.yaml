    <p>Hi All!</p>
    <p>For those of you who missed my talk at Typecon, I was pleased to announce a collaborative new project I'm participating in called TypeSnitch. Please take a look at the site and participate, donate and help spread the word: <a href="http://www.typesnitch.com" title="http://www.typesnitch.com">http://www.typesnitch.com</a></p>
    <p>Best,<br>
    Stuart</p>
