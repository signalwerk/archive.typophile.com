      <p>@ Herb - Indeed saw this article a few days ago and my sense is that it would definitely improve the service since it would make it possible to simultaneously submit a takedown e-mail and send Google a copyright violation notice, especially in cases when the site owner is non-compliant. The service is still very much needed since the work to locate all infringing instances is better automated than manual.</p>
      <p>@ Dave - Absolutely! The idea is to generate populated e-mails that foundries can send from the site and move towards fully automated e-mails quickly. The dream is to make this a fully automated service rather spend time manually ticking through work that can be automated. Right now, it's a one time buy-in fee specific to the fonts you're looking to find and remove.</p>
      <p>@ Bendy - When the font is renamed or 'cribbed', one need only add a new font name to the service and start looking for that one as well.</p>
      <p>Also, we're at 78% now, nearly there but we still have a bit to go, please encourage any others you know who would benefit from this service but haven't donated yet to do so.</p>
