      <p>You basically upload a list of font names and it performs a search for those names and reports the sites that offer those fonts for free download and grants you access to a report and a pre-popluated e-mail you can send to the download site to have the offending fonts removed.</p>
      <p>The basic concept is to make sure folks Googling for a font will find authorized retailers before they find free downloadable versions.</p>
