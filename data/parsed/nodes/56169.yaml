    html: |-
      <p>When you add a bitmap strike to a fontforge file, you can specify the desired bit depth. For example, adding 19@8 to the list of strikes will produce a 19 pixels bitmap with 256 shades of gray.</p>
      <p>BTW fontforge allows to generate various bitmap formats, not just BDF. I actually think TTF with embedded bitmaps may be better for your purposes.</p>
