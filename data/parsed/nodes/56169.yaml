  html: |-
    <p>Hello,</p>
    <p>I would like to create a script "font", based on a really nice handwriting. </p>
    <p>The pencil created a unique texture which I would like to keep. This, to my understanding, prevents me from using outline font formats.<br>
    Monochrome bitmap fonts (e.g. bdf don't recreate that texture all to well, so I would like to know, <em>how could I create a grayscale bitmap font</em>, compatible with most applications.</p>
    <p>Fontlab's <a href="http://www.photofont.com/" rel="nofollow">Photofont</a> does what I want and more (e.g. full color), but it requires plugins, as it is a non-standard format.</p>
    <p>Please excuse my ignorance. <em>Fontlab doesn't seem to support grayscale fonts</em> (only monochrome bitmaps), is that correct?</p>
    <p>Thank you,<br>
    a typographic grasshopper</p>
