  html: |-
    <p>I’m looking at one typeface where the bold is 44% thinker in a vertical  stroke on an uppercase letter that the same stroke on the regular weight and another where the difference is 5%. At 5% of difference between the bold and regular, it’s hard to tell they are different when they aren’t next to each other.</p>
    <p>Is there a <em>normal</em> range of difference between a weight called “regular” and one called “bold”?</p>
    <p>thanks.</p>
