    <p>Hey people,</p>
    <p>I have been asked to suggest a couple of typefaces for setting the book that is being published by my art and design school for this years graduating students. The students that are designing it, were thinking about using FF DIN for it. But they sort of asked me as ’type consultant’ to give them some alternatives.</p>
    <p>I want to suggest a few typefaces that have a similar square and mechanical look, but with a more humanistic touch, so to speak.</p>
    <p>I’m thinking about typefaces like <a class="freelinking-external" href="https://web.archive.org/web/20080821152510/http://www.felicianotypefoundry.com/main/?page_id=10">Flama</a> and <a class="freelinking-external" href="https://web.archive.org/web/20080821152510/http://www.vllg.com/Thirstype/ApexNew/mudTyper+Weights/">Apex New</a>. They have a similar feel, but are less rigid. So typefaces like Klavika are too square.</p>
    <p>I have a few others in mind, but I’m hoping you guys can point me to some typefaces I might otherwise overlook.</p>
    <p>Thanks!</p>
