    html: <p>It all looked a bit grim, until you mentioned that every user has a license to these fonts obtained directly from Adobe. Adobe’s font EULA is quite liberal and their licensing FAQ even more so. Have your attorney take a look at those documents and they should be able to determine if the proposed modification, charges and distribution are okay.</p>
