      <p>@Jens: I must add that I like my home brew Avant Garde more. Not complaining, just saying... :) Appreciated though, sure saved me a lot of work.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/savant_4880.png"></div><br>
      It's good to have these issues sorted out. It's not the first time I've thought of modifying typefaces for customers. I think the point is that if the license state that you can alter the font for personal use, you can also hire someone to do the modifications. See <a class="freelinking external" href="http://www.adobe.com/type/topics/licenseqa.html#q25" rel="nofollow">http://www.adobe.com/type/topics/licenseqa.html#q25</a> for example. Hope I've got the meaning of  "personal use" right in this context.<p></p>
