  html: |-
    <p>I've been doing some layout work for an organisation. Most of the material produced by this organisation is in the Sami language which use characters as Čč Đđ Ŧŧ Ŋŋ Šš Žž...</p>
    <p>Most of these glyphs can not be represented by any version of ITC Avant Garde or Helvetica Neue I've found, and those are the official typefaces as dictated by the spanking new graphical profile that was handed to me. Kind of odd that this didn't occur to whoever designed the profile. I'd certainly want my money back... but that's not my problem.</p>
    <p>I'm just about sawwy enough to produce my own variants of these fonts so I can draw the glyphs without too much trouble, but what I'd really like to do is make templates so that my customer can produce simple letters without having to contact their favourite design bureau. This obviously involves  spreading derivatives of typefaces licensed by the mighty adobe. </p>
    <p>What legal considerations are there? Am I correct to assume that I can charge for providing a variation of a typeface, and that it is up to whoever uses it to acquire licence to use the base typeface?</p>
