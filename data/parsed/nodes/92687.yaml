    <p>Hi everybody,</p>
    <p>I'm looking for the font used in "The Running Man" opening titles:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Police Generique Running Man_4686.jpg"></div><p></p>
    <p>I believe this font was also used in "The Terminator" Opening titles, and in the movie as the font used by the T-800 internal screen.</p>
    <p>Thanks a lot for the one who'll find it.</p>
    <p>Best Regards,<br>
    Hal</p>
