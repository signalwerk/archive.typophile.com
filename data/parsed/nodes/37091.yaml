    html: |-
      <p>#1 - I like it. Very classy, but the fire adds some edge. Make sure you align things optically, not geometrically - The ’C’ in CREATIONS should stick out a bit to the left of the ’B’. I’d tighten up the tracking in everything just a bit. I’m also worried that the diamond will get lost at small sizes, so you may have to play around with the scaling of the flames vs. the stone.</p>
      <p>#2 - Not really a logo. Think of how this would be reproduced in a one colour setting (such as a photocopy or fax). I think it’s too cartoony as well, but depending on who the target market and what kind of price this jewellery has, it might be appropriate.</p>
      <p>Old logo - This guy might not know how to market himself properly... hopefully you can help him.</p>
      <p> - Lex</p>
