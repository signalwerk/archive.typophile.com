      <p>I think that #1 has very good potential to become a very nice logo. The major problem that I see with it is the difference between the fire and the the diamond. You’ll have to make them more even so they don’t look like two images glued together but as one image. A symbol of the whole logo. Fire stylization is very very likeable and nice...</p>
      <p>Build on that. Make the diamond a bit bigger and bolder to complement the fire and you’ll be closer to what you’re looking for. Maybe the diamond should be the source of the fire? Or maybe vice a versa. Don’t get distracted by the real fact...</p>
