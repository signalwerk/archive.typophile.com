      <p>If I saw these without the explanation, I don’t think I would get to jeweller, while fire and heat might be required to create jewellery they are not what most would think of, I would look at the product rather than the process to influence/dominate the mark. Obviously it is not necessary (or even possible) for a logo to represent everything about the person/organisation it is supposed to represent. </p>
