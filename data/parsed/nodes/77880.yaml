  html: |-
    <p>Hello Typophiles:</p>
    <p>Just wondering if anyone knows the history of any proposals that may have been made in the past to systematize a universal "x-factor" for typefaces that would allow easy calculation of ideal body text sizing? (Searching the forums didn't reveal any hits...)</p>
    <p>***************************************<br>
    For example:<br>
    If we just hypothetically used Helvetica 55 as the universal standard yardstick (since it's so ubiquitous), we could give this font an "x-factor" of 1.000 and then assign an x-factor to all other fonts based on the ratio of their x-heights to Helvetica's (using 1000 UPM measurements).</p>
    <p>Helvetica:<br>
    714 (ascend) + 286 (descend) = 1000 UPM<br>
    517 = x-height</p>
    <p>Times New Roman:<br>
    717 (ascend) + 283 (descend) = 1000 UPM<br>
    461 = x-height</p>
    <p>So, the "x-factor" of Times New Roman compared to Helvetica would be:<br>
    517 / 461 = 1.122.</p>
    <p>Therefore, if you regularly set Helvetica at 10 points, then you would set Times at 11.25:<br>
    10 * 1.122 = 11.25 (rounded to nearest 1/4 point)</p>
    <p>If this x-factor number were published with fonts, it might make it easier to help non-techie and non-designer font users make better sizing choices instead of resorting to naming solutions like "Baskerville 10" to show intent at 10-point size...</p>
