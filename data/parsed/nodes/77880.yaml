    votes: null
    html: |-
      <p>Not practical.</p>
      <p>Leading, x-height and copy-fitting are co-dependent.<br>
      If you equalize x-height by bumping up the size of the smaller x-heighted face, then it will become too tightly leaded (fitting the same amount of copy in the same space) or will require more space (with the same proportion of leading). </p>
      <p>Try it with Helvetica and Futura.</p>
