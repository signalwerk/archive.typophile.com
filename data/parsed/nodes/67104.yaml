      <p>Are the uppercase and lowercase stem widths identical? I think the uppercase looks too light.</p>
      <p>The curves in "ghmnpqr" look bumpy. "s" is malformed, too wide and fat. "w" is to wide and fat. Both X-es need some modulation. "4" crossbar too high.</p>
