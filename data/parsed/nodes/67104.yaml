    html: |-
      <p>Extremely tight letterspacing (see lMmNn) seems to be quite the fashion among young (?) designers these days. My awkward feeling towards it comes from the fact that inevitable gaps with the slanted strokes of v, w, x, k etc. stand out even more. Also r and t in this font. The word "Inappropriate" looks unbalanced to me with its white space.</p>
      <p>Andreas</p>
