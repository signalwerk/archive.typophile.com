      <p>ATF released these typefaces in 1912:<br>
      Antique Shaded<br>
      Bodoni<br>
      Cheltenham Bold and Extrabold<br>
      Rugged Roman<br>
      Venetian</p>
      <p>You can check other foundries’ releases here:<br>
      <a href="http://www.klingspor-museum.de/Schriftgiessereien.html" title="http://www.klingspor-museum.de/Schriftgiessereien.html">http://www.klingspor-museum.de/Schriftgiessereien.html</a></p>
