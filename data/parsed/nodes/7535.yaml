    html: "<p>here's version #4 <br> <br><img src=\"http://www.typophile.com/forums/messages/29/53227.gif\" alt=\"doyald script 4\"> <br> <br>I think this is the direction I want to move in; I preferred the original D, with 2 seperate strokes, and I like having more of a flourish to it. I think it balances out the flourish on the other side, which extends past the lc \"d\" <br> <br>I think the y is improved; the angle is more consistent with the other letters and the right arm transitions better into the flourish. <br> <br>The a is pretty good, looks much more like an a than an o, and the weight on the right side is more consistent with the d. <br> <br>Not sure about the l. I tried to straighten the left stroke and bulge out the right one. I liked that about the Hobart l. I think the bulge on the right size echoes the ascender of the d as well. I still wanted the l to connect to the a, though. <br> <br>The D could probably still use some finessing. Overall, though I think this version is close to what I am going for. <br> <br>whew...time to go to class. keep comments coming, though because I plan to keep working on it.</p>"
