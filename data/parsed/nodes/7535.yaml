    votes: null
    html: "<p>Hi Eric, <br> <br>As a matter of personal taste I actually prefer the original post. It's unusual to see a low(er) contrast, formal script. <br> <br>Looking at formal scripts that include swashes and flourishes, is seems the lower case in particular is pretty locked in it's modulation axis. The caps have a bit more variation as needed, and the flourishes often vary considerably. <br> <br>For example in your 11/7 2:59 post, the flourishes seem to follow the axis of the roman too much yielding too much up and down motion. The original brings more horizontal push which is nice. Also in this example, the one-sided a and one-sided l look week in combination. <br> <br>Basically, I'd go back to your original drawing, and focus on: <br>1. Getting the D to feel comfortable. <br>2. The y wider, as in later versions, but make sure the right is thin (!) swelling smoothly, but quickly at the end to finish (more like the teardrop, just finishing in a point) -- I'd keep it at x-height too). <br>3. Working on the l. Understanding that the orignal style is quite different that what I'm about to point too, I still think this form could work (<a href=\"http://www.myfonts.com/fonts/linotype/hogarth-script/hogarth-script/testdrive.html?s=Doyald&amp;p=72\" target=\"_blank\">Hogarth</a>). Note how it doesn't actually connect as yours does, it begins higher. <br> <br>One other note, I think generally, the thicks in your flourishes should be slightly thinner than the thicks in the text. Put the emphasis on the word. See Bickham for example. <br> <br>Oh, and I agree that the second flourish is a little busy. Keep pushing! I applaud you for sticking to a pencil and your brain. It lets an idea remain an idea and not straight jacket you into a bad idea because it looks \"final.\" <br> <br>R</p>"
    html_clean: "<p>Hi Eric, <br> <br>As a matter of personal taste I actually prefer the original post. It's unusual to see a low(er) contrast, formal script. <br> <br>Looking at formal scripts that include swashes and flourishes, is seems the lower case in particular is pretty locked in it's modulation axis. The caps have a bit more variation as needed, and the flourishes often vary considerably. <br> <br>For example in your 11/7 2:59 post, the flourishes seem to follow the axis of the roman too much yielding too much up and down motion. The original brings more horizontal push which is nice. Also in this example, the one-sided a and one-sided l look week in combination. <br> <br>Basically, I'd go back to your original drawing, and focus on: <br>1. Getting the D to feel comfortable. <br>2. The y wider, as in later versions, but make sure the right is thin (!) swelling smoothly, but quickly at the end to finish (more like the teardrop, just finishing in a point) -- I'd keep it at x-height too). <br>3. Working on the l. Understanding that the orignal style is quite different that what I'm about to point too, I still think this form could work (<a href=\"http://www.myfonts.com/fonts/linotype/hogarth-script/hogarth-script/testdrive.html?s=Doyald&amp;p=72\" target=\"_blank\" class=\"link-external\">Hogarth</a>). Note how it doesn't actually connect as yours does, it begins higher. <br> <br>One other note, I think generally, the thicks in your flourishes should be slightly thinner than the thicks in the text. Put the emphasis on the word. See Bickham for example. <br> <br>Oh, and I agree that the second flourish is a little busy. Keep pushing! I applaud you for sticking to a pencil and your brain. It lets an idea remain an idea and not straight jacket you into a bad idea because it looks \"final.\" <br> <br>R</p>"
  - id: 51266
    user: 4688
    date: 2004-11-08T19:28:00
    date_raw: 8 Nov 2004 — 7:28pm
    votes: null
    html: "<p>Eric <br> <br>The D in the 8:31 post looks much more dignified now. <br> <br>Hrant is right about the 'a' and 'o' becoming too similar. However, I think flattening (or cutting diagonal) the top of the a's stem while bringing the point slightly closer would fix it. I'm looking at your first drawing which doesn't seem to have the problem. <br> <br>I'm not sure why Randy doesn't like the 'y' going above x-height. It increases the y's character, in my opinion. I'd even suggest raising the left side too. But you do need to carry a thicker stroke out of the arm of the 'y' so the left side arm runs into the right side. <br> <br>I like Randy's suggestion for the 'l.' It does look more standard than the other letters. <br> <br>As for the 8:42 post: the D is so much more original to me. I was thinking that besides straightening the stem, the first D would do better to not have the top wrap in on itself. I know everything else is more round, but it becomes much more recognizable if the top of the D goes back straighter, with only a slight curve. <br> <br>The D is definitely worth another try or two. <br> <br>My preference is still for the second flourish and the 8:42 post is intriguing to me. That post is also a good reminder of why kerning is so important with scripts. It reminds me of the <b>Walg reens</b> I have to pass everyday on my route to work. But that's for the Critique Board. <br> <br>Well, we're coming at you from all angles here. I'd be more willing to give up the second flourish if the original D, with changes, slipped back into the picture. To my eyes, with the work you're basing this off of, the thins increase Doyald's elegance.</p>"
    html_clean: "<p>Eric <br> <br>The D in the 8:31 post looks much more dignified now. <br> <br>Hrant is right about the 'a' and 'o' becoming too similar. However, I think flattening (or cutting diagonal) the top of the a's stem while bringing the point slightly closer would fix it. I'm looking at your first drawing which doesn't seem to have the problem. <br> <br>I'm not sure why Randy doesn't like the 'y' going above x-height. It increases the y's character, in my opinion. I'd even suggest raising the left side too. But you do need to carry a thicker stroke out of the arm of the 'y' so the left side arm runs into the right side. <br> <br>I like Randy's suggestion for the 'l.' It does look more standard than the other letters. <br> <br>As for the 8:42 post: the D is so much more original to me. I was thinking that besides straightening the stem, the first D would do better to not have the top wrap in on itself. I know everything else is more round, but it becomes much more recognizable if the top of the D goes back straighter, with only a slight curve. <br> <br>The D is definitely worth another try or two. <br> <br>My preference is still for the second flourish and the 8:42 post is intriguing to me. That post is also a good reminder of why kerning is so important with scripts. It reminds me of the <b>Walg reens</b> I have to pass everyday on my route to work. But that's for the Critique Board. <br> <br>Well, we're coming at you from all angles here. I'd be more willing to give up the second flourish if the original D, with changes, slipped back into the picture. To my eyes, with the work you're basing this off of, the thins increase Doyald's elegance.</p>"
