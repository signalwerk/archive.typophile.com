  html: <p>Hi, <br> <br>This is being done as a class assignment where we choose a word and draw it, using a modified existing face. <br> <br>I decided to just start something from scratch, and since I don't often use scripts, I thought this would be a nice opportunity to explore a script face. <br> <br><img src="http://www.typophile.com/forums/messages/29/52916.jpg" alt="doyald script"> <br> <br>I picked the name "Doyald" becuase I wanted to explore some of what Doyald Young does in his work. <br> <br>I need to refine this drawing for the final, so let me have it. <br> <br>as critical as you want to be...</p>
