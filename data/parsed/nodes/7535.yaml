    html: <p>Personally, I prefer the second floating swash (if anyone knows a name more proper, please inform my ignorance of it).  <br> <br>I was just wondering if you couldn't use the shape of the D from the first picture to drop down into that swash. <br> <br>However, the first picture does have more focus on the word itself. The second one has such a repetition of that curved right line that it motivates your eyes into its direction. It reminds me of sound waves. <br> <br>If you don't like the effect, try cutting the fat out of the bottom. Those swashes are much thicker than the top letterforms. <br> <br>Also, the back of the "a" should technically be thicker. I believe it would fall on the wider angle of the pen, and follow through slightly into the ligature between the "l." I could be mistaken, though. <br> <br>Either way, I still prefer the extra swash. And I like the extreme thick thin difference.</p>
    html_clean: <p>Personally, I prefer the second floating swash (if anyone knows a name more proper, please inform my ignorance of it).  <br> <br>I was just wondering if you couldn't use the shape of the D from the first picture to drop down into that swash. <br> <br>However, the first picture does have more focus on the word itself. The second one has such a repetition of that curved right line that it motivates your eyes into its direction. It reminds me of sound waves. <br> <br>If you don't like the effect, try cutting the fat out of the bottom. Those swashes are much thicker than the top letterforms. <br> <br>Also, the back of the "a" should technically be thicker. I believe it would fall on the wider angle of the pen, and follow through slightly into the ligature between the "l." I could be mistaken, though. <br> <br>Either way, I still prefer the extra swash. And I like the extreme thick thin difference.</p>
