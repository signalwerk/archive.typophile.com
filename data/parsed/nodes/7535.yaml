    html: "<p>That's a huge improvement. And it was excellent to start with. <br> <br>So here are my two bits: <br> <br>The first D is sloped too far. It looks to me like it's being forced out of the way by the y's swashing tail. Which isn't very nice. It also very closely resembles an infinite symbol. Try straightening the stem a bit and raising the intersection point.  <br> <br>Also, I have to point out just how phallic the D in your first effort is. You might want to save that for a more provocative typeface. Perhaps titled \"ID\" or \"Freudian Thoughts.\" <br> <br>The bottom of the bowel of the second \"d\" begins to thicken too soon and too fast compared to the \"a.\" <br> <br>Maybe thicken the second arm of the \"y.\" <br> <br>Gorgeous script. <br></p>"
