    html: "<p>Hi Eric, <br> <br>Beautiful and ambitious! I like it. The style seems consistent and  <br>for the most part well done. I'm also a large admirer of Doyald  <br>Young's work. A few comments: <br> <br>1. Overall I think the general swash shapes are working,  <br>Consider adding a second swash element that begins in the loop  <br>below the D, parallels the other, the crosses to curl into the  <br>white space below the ld to improve balance. Make sense? <br> <br>2. The D. I'm not fond of the top curling in and the bowl curving  <br>in also. Consider trying the bowl crossing over the stem and  <br>connecting to the stems tail (echoing the y).  <br> <br>3. The y is too narrow and poorly spaced between the o and a.  <br>(tough to kern a pencil drawing -- exacto!). Not sure the ball  <br>terminal fits. Nice detail in the slight bulge on the right side. <br> <br>4. The modulation in the l is uncertain. Actually, the modulation  <br>in general is a little inconsistent, but not incredibly so. It's the  <br>danger of drawing a script with a pencil. You have to know  <br>exactly how you'd draw it with a pen or brush. I know Young  <br>uses a pencil for his scripts, as did Benguiat when he drew  <br>Edwardian Script. I don't have this expertise, but something  <br>seems off. Try to picture the draw of the nib as you apply  <br>pressure down and release going up, and the angle that your  <br>wrist can feasibly make, will it take one or two strokes etc... Did  <br>you have a model you were working from? Kinda sounded like  <br>you chose not to. Even if it's not close look at something to sure  <br>up your modulation.  <br> <br>5. Maybe wrap the top of the d a little more to echo the swash tail. <br> <br>There are some flat curves in here, but that can be remidied. <br>This kind of thing is really tough. I'm impressed. I notice you are  <br>in LA, is this a class for Doyald? Looking forward to seeing the final. <br> <br>Randy</p>"
