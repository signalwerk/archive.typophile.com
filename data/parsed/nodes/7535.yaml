    html: <p>Eric <br> <br>I love it. My eyes just float around and around it, like a roller coaster. <br> <br>I'm glad you stuck with the D. The angle of its stem no longer bothers me and it fits so much better with the rest of the script. <br> <br>The real problem is that 'l.' The thick side needs to curve more. It's too straight compared to the 'd' and the flourishes. <br> <br>That is a simple solution. <br> <br>I'd also like to suggest to you a more drastic change with the 'l.' The first example I found was <a href="http://www.myfonts.com/fonts/bitstream/roundhand/"> Roundhand</a> by Mr. Snell and Mr. Carter. <br> <br>Of course, that's not the best example for this script, but if the 'l' became just a simple solid curve, matching the 'd' but slightly flatter, I think it would compliment your script. <br> <br>I think you're doing a wonderful job of taking suggestions from us while finding solutions of your own. <br> <br>DeWitt</p>
