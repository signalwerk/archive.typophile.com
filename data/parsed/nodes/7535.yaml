    html: <p>thanks for all the comments from everyone. even though I'm not sure I agree with everything (nor do the different opinions agree with each other), it has given me a lot to think about and try. I'm going to try at least one more version before my class today at 5:30. I'll try to do 2 if I can. <br> <br>I really like the simplicity of just one flourish beneath the word; I've tried adding a second one two seperate times, and I wasn't happy with it, so I'm going to stick to one. Also, I think I prefer the original D, or some modification of it. Since I'm not truly designing a font here (more of a logo, I guess) I think I can take certain liberties with the characters.  <br> <br>I should have another version in an hour or 2 <br> <br>eric</p>
