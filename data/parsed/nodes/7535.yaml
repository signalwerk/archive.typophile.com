    html: <p>thanks for the feedback <br> <br>here's my next try, taking into account your comments. <br> <br><img src="http://www.typophile.com/forums/messages/29/53036.jpg" alt="doyald script 02"> <br> <br>Still some issues, but on the right track? I definitely agree that the "y" was too narrow, and as much as I liked the teardrop terminal, that was one thing identified in class as not being quite consistent with the other characters. <br> <br>hence, I've tried to widen the y and I've added a spiky swash terminal. The left arm of the y still feels a little heavy, and something about its conection to the o isn't quite right. <br> <br>I've tried to pay attention to modulation, and the thick/thin contrast. The area where the "a" connects to the "l" feels light now... <br> <br>I'd love more suggestion on how to keep improving my piece. The final is due tuesday, but I will keep refining it beyond that point. <br> <br>the class is not for doyald young, but I'm supposed to meet him this month sometime, and I'd like to show him this piece, so I need it to be bulletproof...</p>
