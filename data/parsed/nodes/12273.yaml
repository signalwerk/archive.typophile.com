    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : František Štorm</strong></p>
    <p>František Štorm was born in 1966 in Prague, Czech Republic. 1985–91 he studied at the Academy of Applied Arts, Prague, in the School of Book and Type Design under Prof. Jan Solpera. He went on to work as assistant to Prof. Solpera until 1995. </p>
    <p>In 1993 founded the <a href="/wiki/Storm%20Type%20Foundry" class="freelinking" rel="nofollow">Storm Type Foundry</a>, and today is a freelance type-designer, photographer, xylographer and howling computer programmer. In 2000 Storm’s Biblon type earned the “Excellence in Typography Award” from the Type Designers Club, New York.</p>
    <p>Besides type and graphic design he occupies himself with wood engraving, etching, landscape photography, and letterpress printing.</p>
    <p><a href="http://www.stormtype.com/" title="http://www.stormtype.com/">http://www.stormtype.com/</a></p>
