    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: František&nbsp;Štorm</strong></p>
    <p>František Štorm was born in 1966 in Prague, Czech Republic. 1985–91 he studied at the Academy of Applied Arts, Prague, in the School of Book and Type Design under Prof. Jan Solpera. He went on to work as assistant to Prof. Solpera until&nbsp;1995. </p>
    <p>In 1993 founded the <a href="/node/12193" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Storm Type Foundry</a>, and today is a freelance type-designer, photographer, xylographer and howling computer programmer. In 2000 Storm’s Biblon type earned the “Excellence in Typography Award” from the Type Designers Club, New&nbsp;York.</p>
    <p>Besides type and graphic design he occupies himself with wood engraving, etching, landscape photography, and letterpress&nbsp;printing.</p>
    <p><a href="http://www.stormtype.com/">http://www.stormtype.com/</a></p>
