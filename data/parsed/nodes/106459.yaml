      <p>Well, you asked for it! It's a local history book focusing on Gastonia, a small town in North Carolina that was the center of the US textile industry until the 1980s. The boom years were in the first quarter of the 20th century, but the town was quite prosperous into the 1960s. Today, textiles are long gone and the town (which is in the orbit of much, much larger Charlotte) is trying to redefine itself. The book was commissioned by the chamber of commerce, so there is a definite focus on the business community, with the intent to show that there is more to the place than just the death of an industry.</p>
      <p>The content is a couple of essays, with around 125 historic images, with as I said above, some contemporary photography -- mainly as a "then and now" kind of thing. All of the images will have captions of 100-150 words. So, typeface-wise, I want something that has a bit of a vintage, American feeling without being distracting or calling a lot of attention to itself, and is very flexible and capable in terms of layout. There will be at least one map, a double spread detail map of the downtown area based on a <a href="http://en.wikipedia.org/wiki/Sanborn_Maps" rel="nofollow">1922 Sanborn Fire Insurance map</a>, with thumbnails of some of the still-standing buildings and image locations plus abbreviated captions. </p>
      <p>I should also mention that in addition to the design and production work on the book, I am also researching and writing it. It has been in the works for nearly a year, with a publication date of February 2014. So I am just all *kinds* of invested in the project!</p>
