  html: <p>I am in the midst of choosing typefaces for a book, and I just need to get out of my own head for a bit! The book is a fairly large-format (9x12), with good production values. The subject matter is largely historical, with many vintage photographs along with a smaller number of new images. There are a few sections of text, along with extended captions for all the images. So I want highly legible, not too compressed, slight vintage feel, with lots of layout flexibility, and possibly/probably paired with Avenir Next (mainly in some maps or other graphics). I keep coming back to Sentinel -- a slab serif seems like a good sort of spiritual fit with the subject matter, and Sentinel works better for me in text than something like Bodoni Egyptian, and looks a little more sober and less trendy than something like Archer. Opinions?</p>
