      <p>Here is the keyboard layout from the LT Devanagari manual. I have scanned the whole thing, but the PDF is &gt;5 MB.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/LTDevKeyboard_4927.jpg"></div><p></p>
      <p>From this illustration, you can see clearly the technological influence of the Linotype hot metal composing machine on Indian typography. Consonant conjuncts are mostly represented using so-called half-forms, rather than as ligatures, and even many full form letters are represented as half-form plus short a vowel sign. So, for example, to enter the Hindi letter <em>pa</em> प you would need to hit two keys in sequence: 17 and 1.</p>
