    <p>I had a vision of setting type characters in a virtual space, and I wonder if there's a model for a 'fully functional' virtual movable type machine, where you'd have to set all of these voxelous type characters for fauxpress...</p>
    <p>and then I thought there should be an entire virtual library of 'liveable' virtual experiences encompassing a range or rare and antiquated production techniques of all kinds.</p>
    <p>and now I'm thinking about eating some fruit.</p>
