      <p>I've been interested in this, too, and have also considered a sort of virtual shop of virtual typesetting machines.</p>
      <p>I was reading up on how Linotype machines really worked (in detail), and wondered whether someone had written a simulator. I couldn't find one, so spent some time writing a very basic text-only simulator (in the Ruby language). I found I could easily code up the basic operations: a keyboard, a magazine, a spaceband box, an assembler, and a caster. The complications arise as you get closer to the physical nature of the machine, which is really several machines running at once, linked together via some complex timing.</p>
      <p>Having just taken a short Monotype compositor workshop last weekend, I'm now thinking of coding a simulator for that machine, just for fun.</p>
      <p>So I think there's some promise here, but it depends on whether you're just trying to codify essentially a mathematical model of a machine, or a full simulation with lots of moving parts.</p>
      <p>--John</p>
