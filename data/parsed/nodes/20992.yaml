    <p>Hello all, does anyone know of a font that looks as if its on continuous line that makes up the letters? Sorry if that wasn't a very good description and the only example I can find is off this SKY HD ad. I guess its kinda like a neon sign or like if you made words up by roughly stitching them.</p>
    <p>Cheers!</p>
