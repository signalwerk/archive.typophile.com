      <p>Deja-vu. Here is an old post from a "research questions" discussion thread from a type facebook group I have. If you'd like to join you can find me at facebook.com/readthetype. The group is "invisible" to give people a little more privacy.</p>
      <p><strong>1. Downstyle</strong></p>
      <p>Down style means capitalizing only the first word and proper nouns, typically applied to titles. For example:</p>
      <p>This is a title in down style — Microsoft Word calls this "sentence case"</p>
      <p>This Is A Title In Up Style — Microsoft Word Calls This "Title Case"</p>
      <p>Here is a paragraph set in up style:</p>
      <p>Don't You Find This Annoying To Read? Imagine An Entire Book Written This Way. I Highly Doubt That You Would Finish It, Unless Of Course you Were Some Sort Of Typographic Masochist. Perhaps There Is Something Written In Robert Brownjohn's Book Sex And Typography About Typographic Masochism. I Think I Have Made My Point.</p>
      <p>Here is the same paragraph set in down style:</p>
      <p>Don't you find this annoying to read? Imagine an entire book written this way. I highly doubt that you would finish it, Unless of course you were some sort of typographic masochist. Perhaps there is something written in Robert Brownjohn's book Sex and Typography about typographic masochism. I think I have made my point.</p>
      <p>Notice how the the beginning of sentences, the title of the book, it's author and the personal pronoun "I" are more salient?</p>
      <p>Typographic convention, and I stress the word *convention*, gives us the following reasons why down style is preferable to up style.</p>
      <p>a) 80% of the time words appear set in lowercase letters resulting in a more familiar word shape (bouma).</p>
      <p>b) Proper nouns like Your Name get a little more prominence and stand out as the proper nouns that they are.</p>
      <p>c) It leaves less chance for a title that breaks on to two lines to be misinterpreted as two separate titles.</p>
      <p>d) You don't have to play the "should I capitalize of, it, and, or, the &amp;c ?" game.</p>
      <p>There may be others that I am not aware of. I do know however from my time working with bilingual government clients that down style is a common convention used in French.</p>
      <p>In cLOsIng, tHIS ArTIcLe aBoUT MiXed CASe MigHt hAVe sOmEthINg TO sAy:</p>
      <p>BEsNer, dErEk (1989). ON thE rOlE of oUtliNe shApe aNd woRd-sPeciFIC vIsUaL pATern in ThE idENtIFicatIOn OF fUNCTtiOn wOrdS: nONe. <em>tHE qUaRteRly joURnaL of EXPErimEntal PSYchOLOgy a: HUMAn exPErImeNtal PSYChoLOgy, Vol 41(1-A)</em>, Feb 1989. pp. 91-105.</p>
      <p>———</p>
      <p>Additional reading:</p>
      <p><a class="freelinking external" href="http://www.microsoft.com/typography/ctfonts/WordRecognition.aspx" rel="nofollow">The science of word recognition</a> by <a class="freelinking external" href="http://typophile.com/user/4431" rel="nofollow">Larson</a>.</p>
      <p>Bouma, H. (1973). Visual interference in parafovial recognition of initial and final letters of words. <em>Vision Research, 13</em>, 762–782.</p>
      <p>Hailstone M., &amp; Foster J.J. (1967). Studies of the efficiency of drug labeling. <em>The Journal of Typographic Research, 1(3)</em>, 275–284.</p>
      <p>An old typophile thread <a class="freelinking external" href="http://typophile.com/node/61626" rel="nofollow">Why do CAPITAL LETTERS so annoy us?</a></p>
