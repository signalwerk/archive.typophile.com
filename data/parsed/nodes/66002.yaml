      <p>All very well Christopher but when you are typesetting a 4-5 word headline (even less if I can manage it), word recognition is not an issue. What is an issue is what words you want to emphasize, like your example of I and proper names. So you do that by case, or color, or different weights, there are many methods.</p>
      <p>It's not scientific but it works.</p>
      <p>No one in their right mind would use "title case" for extended text.</p>
      <p>pbc</p>
