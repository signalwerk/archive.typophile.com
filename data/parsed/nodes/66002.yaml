    html: |-
      <p>It all depends on the words, what you are trying to say and especially what you want to hear.</p>
      <p>This Is a sample of Title Case</p>
      <p>This is a Sample of Title Case</p>
      <p>This Is a Sample of Title Case</p>
      <p>I like the way the first one sounds, although I would have to know what the message was before I could decide.</p>
      <p>I feel the same way about punctuation, unless something is utterly incorrect, and even that can work. Commas are like rests in music, do you want the person to pause, or not? The worst copywriters in my experience are usually English majors, who know all the rules and cannot break them.</p>
      <p>pbc</p>
