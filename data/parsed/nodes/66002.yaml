    <p>Someone asked for an 'authoritative' statement on the preference of sentence case in headings:<br>
    This is a sample of sentence case</p>
    <p>as opposed to the use of title case:<br>
    This Is A Sample Of Title Case</p>
    <p>As a UK typographer, the rule is sentence case, and has near enough been a given in typography. I wonder if anyone can point me in the direction of an authoritative source that a friend can use in an argument.</p>
    <p>The argument is between US and UK style, I think.</p>
    <p>Tom</p>
