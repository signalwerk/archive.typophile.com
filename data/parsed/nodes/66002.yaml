    html: |-
      <p><cite> &gt; If the first is Title case, what is the second, which is what I would prefer to see in a title, with smaller words of low import in lower case.</cite></p>
      <p>Don, the first is an example of title case as generated by a machine, which can't tell a pronoun from a preposition from an article. Your second example is closer to proper title case (<em>aka</em> headline style).</p>
      <p>Proper headline and title writing in upstyle follows rules for which words get capitalized. Generally, prepositions and articles do not get capitalized. Style guides will vary on a few details. Some of the "rules" are admittedly arbitrary and not logically rigorous.</p>
      <p>But generally, it has less to do with length of word and more to do with function. Thus, your second example would usually have the <em>is</em> capitalized by most editors I know: "This Is a Sample of Title Case."</p>
