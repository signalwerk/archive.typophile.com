    html: |-
      <p>Hi Chris</p>
      <p>"CAROLE SMITH" is <strong>Felix Titling</strong> by Monotype<br>
      <a href="http://new.myfonts.com/fonts/agfa/felix-titling/" title="http://new.myfonts.com/fonts/agfa/felix-titling/">http://new.myfonts.com/fonts/agfa/felix-titling/</a></p>
      <p>The script is a bit more tricky as it can be found under the following names:</p>
      <p>OPTICarmella HandScript<br>
      Julia-HandScript<br>
      Carpenter Script<br>
      Hemingway<br>
      CarpenterICG</p>
      <p>Multiple rip-offs?<br>
      I don't know which one is the original design.<br>
      They are all very similar and very close to your logo</p>
      <p>Fivos</p>
