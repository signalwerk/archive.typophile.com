    <p>The Houghton Library blog invited me to contribute a piece on my type history research about labels for type designs. </p>
    <p><a class="freelinking external" href="http://blogs.law.harvard.edu/houghton/2010/05/22/etruschi/" rel="nofollow">Etruschi</a> is about different names for sans faces, including "Etruscan" which I hadn't encountered until my research at that library last month. </p>
    <p>Comments welcome there or here.</p>
