      <p><cite>have you encountered this kind of use of "etruschi" before?</cite></p>
      <p>I'm afraid, I haven't. But keep in mind that I'm a product of the desktop publishing revolution, which, in Italy, wiped out almost all the traditional specialised nomenclature trough bad or inexistent translations.<br>
      Maybe Antonio Cavedoni (<a href="http://typophile.com/user/8976" title="http://typophile.com/user/8976">http://typophile.com/user/8976</a>), which I gather have a vastly greater historical knowledge than mine, could give you some further insight.</p>
      <p>By the way, it would be interesting to know if the term was used in later Nebiolo specimens.</p>
