      <p>Candidate # 2: Patron (free for personal use)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/patron_6294.png"></div><p></p>
      <p><a href="http://www.myfonts.com/fonts/vesturbaer/patron-alt/" title="http://www.myfonts.com/fonts/vesturbaer/patron-alt/">http://www.myfonts.com/fonts/vesturbaer/patron-alt/</a></p>
      <p>Of course neither of these is really satisfactory! Yes, they have the "sigma" E, and some of the streamlined feel, but little else. The R seems closer to Gill Sans or Humanist 521. And the B reminds me of Savigny. I wonder if this was based on a single typeface, or is a deft combination.</p>
      <p><a href="http://www.myfonts.com/fonts/adobe/gill-sans/" title="http://www.myfonts.com/fonts/adobe/gill-sans/">http://www.myfonts.com/fonts/adobe/gill-sans/</a><br>
      <a href="http://www.myfonts.com/fonts/bitstream/humanist-521/" title="http://www.myfonts.com/fonts/bitstream/humanist-521/">http://www.myfonts.com/fonts/bitstream/humanist-521/</a><br>
      <a href="http://www.myfonts.com/fonts/insigne/savigny/" title="http://www.myfonts.com/fonts/insigne/savigny/">http://www.myfonts.com/fonts/insigne/savigny/</a></p>
      <p>Edit: I just sent the question to Mark Sloan, the designer, who is based in Amsterdam. If he answers it, I'll post it here.</p>
