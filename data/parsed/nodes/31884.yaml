      <p>But Kepler has something like 170 different variants from optical size to compression/expansion to weight. You sure you couldn't find something in that range to use effectively as a subhead without having to jump to a sans?</p>
      <p>Aside from that, Kepler is a "modern" style typeface. Why not go for a grotesque instead of a humanist sans? It would match the proportions of the Modern better.</p>
