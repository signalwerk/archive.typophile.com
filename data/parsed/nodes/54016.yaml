    <p>Hello everyone,</p>
    <p>My friend and I have been racking our brains over this one for a while. I haven't been able to find any official documentation from Beaurepaires regarding their new logo either. It's a more geometric, less human version of Helvetica with horizontal and vertical terminals.</p>
    <p>Any ideas?</p>
    <p>Vincent</p>
