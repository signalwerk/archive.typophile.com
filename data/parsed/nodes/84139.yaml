    html: |-
      <p>Did you try the raw TrueType fonts? Does it work there? Are you sure the small caps are now in the font and accessible via OpenType?<br>
      I think with the Font Squirrel generator you would need to completely turn off subsetting, because the other options don't let you keep them. </p>
      <p>As alternative, you can use the Font Squirrel generator to create a second font that has the small caps in place of the standard latin characters by choosing »Small Caps« in the OpenType options.</p>
