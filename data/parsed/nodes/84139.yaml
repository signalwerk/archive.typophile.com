    html: |-
      <p>Sir Herrmann, you are terrific! Thanks for your insight. You were absolutely right—the font subsetting on FontSquirrel was the culprit. Even with custom subsetting which (I thought) included all advanced typographic features, apparently some things are removed, and small caps seemed to be one of them.</p>
      <p>My plan now is to use the Mozilla hack AND CSS3 specifications simultaneously, so the site is ready when CSS3 becomes fully supported. I'll remove the hack code thereafter.</p>
      <p>Thanks again!</p>
