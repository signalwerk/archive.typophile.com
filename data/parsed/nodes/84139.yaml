      <p>Update: apparently, the CSS3 specification that allows fonts to access their advanced glyphs apparently isn't fully implemented yet, even in Firefox, which is setting the standard for compliance. But Firefox has a hack built in, which is supposed to allow you to preview the ability of the browser to access these glyphs: <a href="http://hacks.mozilla.org/2010/11/firefox-4-font-feature-support" title="http://hacks.mozilla.org/2010/11/firefox-4-font-feature-support">http://hacks.mozilla.org/2010/11/firefox-4-font-feature-support</a></p>
      <p>I tried the Mozilla-only workaround, thinking it would be nice if it worked in at least one browser. But the workaround never loaded any small caps at all. I've updated the test page to reflect that problem—look at the entries 2.1, 4.1, and 6.1: <a href="http://www.utcolmus.org/test.html" title="http://www.utcolmus.org/test.html">http://www.utcolmus.org/test.html</a></p>
