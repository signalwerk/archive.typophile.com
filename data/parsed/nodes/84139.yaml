      <p>There is no cross-browser support for this yet. That's why some webfont services and subsetting tools let you choose to subset the whole font (well at least the latin part) with small caps to give you a chance to use them. </p>
      <p>In Firefox you can use small caps by calling the OpenType feature itself:<br>
      <a href="http://opentype.info/blog/2010/08/14/better-web-typography-with-opentype-features/" title="http://opentype.info/blog/2010/08/14/better-web-typography-with-opentype-features/">http://opentype.info/blog/2010/08/14/better-web-typography-with-opentype...</a></p>
