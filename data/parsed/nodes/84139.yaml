    <p>Hi everyone,</p>
    <p>I'm having a problem implementing OpenType features in web fonts. No matter what typeface or browser I use—and I've tried several of each—I can't get the CSS font-face property to listen to font-variant:small-caps. In every case, the browser synthesizes its own small caps by scaling the full caps, which of course looks terrible.</p>
    <p>The typefaces I've tried with this are all open-source advanced fonts: Cabin, Cardo, Lato, and Sorts Mill Goudy, all of which support small caps at least in their roman, regular-weight face. I've used Firefox 5, Opera 11.5, and the latest build of Iron (Chrome without Big Brother), all to no avail.</p>
    <p>It's worth mentioning that other properties of advanced web typography, such as automatic ligatures (as well as the font-face property itself), are all working.</p>
    <p>You can see my test page at <a href="http://www.utcolmus.org/test.html" title="http://www.utcolmus.org/test.html">http://www.utcolmus.org/test.html</a> , and the CSS file at <a href="http://www.utcolmus.org/main.css" title="http://www.utcolmus.org/main.css">http://www.utcolmus.org/main.css</a>. Any help would be greatly appreciated!</p>
    <p>Thanks,<br>
    Bram</p>
