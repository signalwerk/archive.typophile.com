  html: |-
    <p>Hello,</p>
    <p>I need to design some bitmap fonts to be used in applications for mobile phones. These will be images, so they can utilize multiple colours, which will be useful for anti-aliasing or simulated anti-aliasing.</p>
    <p>Does anyone have experience designing type for mobile phones, or any thoughts which I should consider for this project?</p>
    <p>Thanks!</p>
