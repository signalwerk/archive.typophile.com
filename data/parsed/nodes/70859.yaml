    <p>Does anyone recognize the typeface used in the titles for the new Robin Hood? While I know that designers of titles and credits for the movies will often create their own, I'm quite sure I've seen this one before.</p>
    <p>Only caps and small caps are used. One of the variant forms includes a capital R with an exceptionally long leg, which sometimes forces a smaller version of the letter following it; and inside the O is a dot, which to my eye looks diamond-shaped. So I thought of Adobe Jensen, which uses diamonds in its dotted punctuation marks, and the D and the H are similar, though in the titles the H looks taller, narrower. And there are no variations of the R or O that have those special features. In the closing credits, I also noticed a variant M, in which the three legs were roughly parallel but the tops were rounded, and sloped downward to the right -- a distinctly medieval form, though it wasn't used frequently in the credits.</p>
    <p>There are illuminations in some of the bowls, though I assume this was done by hand rather than it being a regular feature of the font.</p>
    <p>I've attached a screen grab of the title, but couldn't find any photos of the credits, where most of the variation took place. Does it look familiar to anyone?</p>
