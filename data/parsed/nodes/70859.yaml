    html: <p>indeed the typeface is custom, very loosely based on bembo, a couple of characters from mason, then customised throughout with diamonds in the o's extending the r etc, in particular a custom ligature for every combination of letter involving an r. the typeface on screen was hand painted, then flourishes were added by hand.</p>
