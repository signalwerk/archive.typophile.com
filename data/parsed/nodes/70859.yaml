      <p>I have been spending some time searching antique serifs and found one font with center diamond-ish marks (<a href="http://new.myfonts.com/fonts/typefetish/brogue/" rel="nofollow">Brogue</a>), but almost nothing else about it seems even similar. The font <a href="http://new.myfonts.com/fonts/glc/1592-glc-garamond/" rel="nofollow">1592 GLC Garamond</a> seems to have a similar overall feel, except for the diamonds. It seems the R could be made using one of the Q tails, but I think it's not too likely we will find the exact font, because I have a feeling that they mixed and matched from several fonts and then customized with noise, squooshing and antiquing tricks.</p>
      <p>Usually when I get nowhere at the commercial sites, I check Dafont to see what the amateurs have done, and found a remarkable bargain (how can you beat free?) by Igino Marini called <a href="http://www.dafont.com/im-fell-types.font?nb_ppp=50&amp;text=ROBIN+HOOD" rel="nofollow">IM Fell Types</a>, a 16-font family based on old English typeforms. There seems to be about 3 or 4 basic typefaces and at least one or two include SC versions. This ought to have enough variants to work with.</p>
      <p>Bottom line: I don't think this is a single font that you'll be able to find, because I think it was cobbled together for this purpose. If you just want to make something that looks similar, that should be easy enough.</p>
      <p>- Mike Yanega</p>
