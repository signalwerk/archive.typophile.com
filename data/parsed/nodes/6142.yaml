  html: <p>Is there any reason why a font cannot be priced according to industry segment?    <br>   <br>For example, if I wanted to release a font with three price tags (say, free for non-commercial use, $whatever for commercial companies and $outrageous for industries I do not wish my work to be associated with (nuclear, oil, military, whatever) to act as a deterrent.   <br>   <br>Is there anything to stop this? Other than issues of enforcing it?</p>
  html_clean: <p>Is there any reason why a font cannot be priced according to industry segment?    <br>   <br>For example, if I wanted to release a font with three price tags (say, free for non-commercial use, $whatever for commercial companies and $outrageous for industries I do not wish my work to be associated with (nuclear, oil, military, whatever) to act as a deterrent.   <br>   <br>Is there anything to stop this? Other than issues of enforcing it?</p>
