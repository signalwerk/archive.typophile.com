    votes: null
    html: "<p>Tiered pricing does already exist, and I actually think it can work. But it opens up a world of complexity, and most of all if you discriminate against a very narrow -and subjectively arbitrary- segment, you'll be seen as \"unprofessional\". Even among potential clients who share your dislike for the segment you're discriminating against, you will generate a certain degree of uneasiness, to say the least. The overarching unwritten rules of capitalism go against such personal choice. In effect, personal choice is limited to the <i>consumer</i>. <br> <br>Plus that type of thing could be illegal/non-binding in certain jurisdictions. <br> <br>BTW, enforcing is actually less of a problem the larger the client: following the letter of the law is in their blood. <br> <br>hhp <br></p>"
