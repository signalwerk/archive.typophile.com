    html: <p>well, the full idea is probably even more "offensive" to those unwritten rules, Hrant. The intention is to donate the different between the two license prices to lobbying or activist groups against those industry segments.  <br> <br>So if a Commercial license was $15, and a license for the nuclear industry was $300, then $285 gets donated to Greenpeace, etc.</p>
