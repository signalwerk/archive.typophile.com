    html: <p>But Hrant, all early tyeface designs were based upon calligraphy. I've heard some historians claim that all type had origins in calligraphic forms well up until Bodoni really abstracted the forms toward a new direction of what design has become with the early moderns. Garamond is obviously based upon calligraphic forms. Transitional faces became more intelectualized maybe but the forms still have root in the way one writes a Latin majuscle and all italics of this period are based in humnist miniscule. Surely you can't deny a link, even if we have ventured farther from it as time has gone on.</p>
