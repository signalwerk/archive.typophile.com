  - id: 36996
    user: 3553
    date: 2004-06-21T07:19:00
    date_raw: 21 Jun 2004 — 7:19am
    votes: null
    html: '<p>You have a good memory Mr. Tim Daly! <br>How old are you? <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br><a href="http://www.estovest.net/tradizione/yinyang_en.html" target="_blank">http://www.estovest.net/tradizione/yinyang_en.html</a> <br> <br>+ <br> <br>These (graffiti rupestri) are also called "graffiti", <br>but as you know they are from thousands years before: <br><a href="http://www.cun-italia.net/dipinti-graffiti/dipinti-graffiti.htm" target="_blank">http://www.cun-italia.net/dipinti-graffiti/dipinti-graffiti.htm</a> <br><a href="http://www.bresciainvetrina.it/bresciaturismo/valcamonica_arterupestre.htm" target="_blank">http://www.bresciainvetrina.it/bresciaturismo/valcamonica_arterupestre.htm</a> <br> <br>Like this path "la strada megalitica," for instance, <br>by the the sea near Genova (it was relaxing warm and fresh). <br>Anna found a very nice stone. <br>That path is special, it was a magic path, it leads to a bunch <br>of stones used to do something, he hee, what an explanation! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br>Well, those stones face a small mountain, the path is about 2400 <br>years old and it is related to 21 June (funny posting!), this day, <br>when the sun sets, the rays are straight on the path. <br>I got to know that Indians had this form of art where they made <br>a path on the ground and from the sky above you can see that those  <br>lines/paths are in a form of an animal figure. <br>Scientists say that when the indians walked along those paths <br>they could "see" or comprehend or feel the animal it was... <br>horse, whale etc. <br>So walking along a path is also a spiritual experience a way <br>we can make ourselves to relate to the nature, universe and ourselves... <br>I wish la strada megalitica my spiritual path... <br><img src="http://www.typophile.com/forums/messages/30/38841.jpg" alt="La Strada Megalitica"></p>'
    html_clean: '<p>You have a good memory Mr. Tim Daly! <br>How old are you? <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br><a href="http://www.estovest.net/tradizione/yinyang_en.html" target="_blank" class="link-external">http://www.estovest.net/tradizione/yinyang_en.html</a> <br> <br>+ <br> <br>These (graffiti rupestri) are also called "graffiti", <br>but as you know they are from thousands years before: <br><a href="http://www.cun-italia.net/dipinti-graffiti/dipinti-graffiti.htm" target="_blank" class="link-external">http://www.cun-italia.net/dipinti-graffiti/dipinti-graffiti.htm</a> <br><a href="http://www.bresciainvetrina.it/bresciaturismo/valcamonica_arterupestre.htm" target="_blank" class="link-external">http://www.bresciainvetrina.it/bresciaturismo/valcamonica_arterupestre.htm</a> <br> <br>Like this path "la strada megalitica," for instance, <br>by the the sea near Genova (it was relaxing warm and fresh). <br>Anna found a very nice stone. <br>That path is special, it was a magic path, it leads to a bunch <br>of stones used to do something, he hee, what an explanation! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br>Well, those stones face a small mountain, the path is about 2400 <br>years old and it is related to 21 June (funny posting!), this day, <br>when the sun sets, the rays are straight on the path. <br>I got to know that Indians had this form of art where they made <br>a path on the ground and from the sky above you can see that those  <br>lines/paths are in a form of an animal figure. <br>Scientists say that when the indians walked along those paths <br>they could "see" or comprehend or feel the animal it was... <br>horse, whale etc. <br>So walking along a path is also a spiritual experience a way <br>we can make ourselves to relate to the nature, universe and ourselves... <br>I wish la strada megalitica my spiritual path... <br><img src="http://www.typophile.com/forums/messages/30/38841.jpg" alt="La Strada Megalitica"></p>'
