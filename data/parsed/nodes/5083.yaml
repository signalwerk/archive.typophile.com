    html: <p>As far as my faulty memory goes, graffiti was the  <br>scratching of political slogans, election promises and  <br>general advertisements on public buildings/tombs in  <br>Rome. Guess that the hook reference comes from the  <br>tool used for the job. Still it would be frowned on by the  <br>patricians (the rich class in Roman society) mainly  <br>because the tombs were their family members (plebs  <br>being thrown into the Cloaca Maxima, Tiber or dungheap). <br>Tim</p>
