    html: "<p>&gt; i just thought it would be fun <br> <br>My own apportionment of illegal activity leaves no room for graffiti at the moment, sorry.  :-) <br> <br>&gt; lets not get too theoratical. <br> <br>? <br> <br>&gt; give me an example of a rule in graffiti. <br> <br>How should I know? But that doesn't mean I can believe there are none. For example, isn't \"coding\" broad a rule? Sure, it can be broken, but that's true in any field. Then there's the stylistic rules mentioned. <br> <br>&gt; were do you think graffiti and typography DO overlap?  <br> <br>A nice theoretical question.  :-) <br>They overlap at the level of individual black forms. But typography is different because of its abstraction - like \"default\" spacing; while lettering is different because of its contextualization - like doing something special when you have an \"LA\" sequence (although increasingly typography is engulfing this). And what lettering and calligraphy share (which typography doesn't have) is that the forms are \"heuristic\", not predetermined*. Calligraphy and typography share very little. And there's something else: of the three, only typography can be truly immersive, the other two are essentially display-centric (although in some instances -like a well-penned manuscript- it's hard to see that). <br> <br>* \"Random\" fonts are deceptive - because of what Johnny von Neumann said. <br> <br>&gt; do you think a typographer can become better in typography after seeing graffiti? and vice versa?  <br> <br>Yes. <br> <br>hhp <br></p>"
