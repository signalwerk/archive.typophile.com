    html: <p>&gt; or maybe its rap? :]  <br> <br>On a related note (athough a really late response) the new Beastie Boys record has a typographic reference...  <br> <br>"So watcha' want, so watcha' need, I got the fonts, you wanna read."  <br> <br>Only the Beastie Boys would boast about something like that... I love graffiti. But I actually find that it loses a lot of character when its all spruced up for a publicly sanctioned project. There are a lot of those in DC. And while quite wonderful, I always imagine the artists just trying to get it over with... Sort of like when a band such as Green Day puts out a record that is supposed to be "punk", but it sounds too good to be anywhere near the vicinity of punk. Let alone the fact that their records are deemed "appropriate" or "acceptable". Well, I suppose one could say it's not really graffiti anymore when it's commissioned... <br> <br>Anybody know the origin of the word "graffiti" ?</p>
