    html: "<p>Not only is calligraphy (better: \"chirography\") at the source of virtually all historic type designs, it's still the largest \"school of thought\" in contemporary type design! I'm certainly not denying its relevance (and usefulness in terms of formal analysis), but I do think that in the realm of theory the actual overlap is minimal. Gutenberg for example imitated scribes in order to \"trick\" readers into buying his stuff. To me that says nothing about the true nature of typography, of what it <i>needs</i>. <br> <br>hhp <br></p>"
