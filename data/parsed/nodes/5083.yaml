    html: <p>To counter Gerald, I have to say that there are definitely  <br>occasions (in some parts of SF's Mission District to name one)  <br>where graffiti is the only urban renewal an area can hope to get. <br>There is even sanctioned (commissioned may be the wrong  <br>word) graffiti in these areas with the hope that people won't <br>tag over it. <br> <br>The real difference is between graffiti and tagging. Tagging <br>is usually scrawled quickly and is very often ugly. For example, <br>the stuff posted by Christian Acker on Saturday, June 12, 2004 -  <br>11:35 am is tagging and is interesting to study, but only makes <br>the urban landscape ugly. <br> <br>The stuff posted by Itay K on Saturday, June 05, 2004 - 11:28 am <br>is the stuff I'm talking about.</p>
