    html: <p>&gt;I think the important thing is not to get too wrapped up in your expressive abilities/desires, otherwise you're moving towards selfish art.  <br> <br>Oh Hrant, you disapoint me, we were so close and you seemed to have made an abrubt left turn. I thought you were starting to see the value in graffiti. Selfish is bad art for sure, but all art starts with a personal interprative starting point, even design, even typography. No matter your opinion on Carson, he champions an important idea- Legibility does not equal communication. <br> <br>My wife is an actress, and one of the similiarities I find between our training and our professions is that we are both communicators. For sure, the audience must be able to understand our message, but to move your audience as an actor is more than just speaking loudly and clearly, I feel the same for my work as a designer. The appropriate choice of type within a given project is like an actor being able to convincingly speak in a given accent. It can add great depth to the audiences' perception of the content, or it can ruin it. <br> <br> <br>&gt; you have to study what people have done  <br>before and you can</p>
