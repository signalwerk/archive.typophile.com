    html: <p>Well, I am sorry to disappoint you. But I wasn't leading you on or anything. <br> <br>I just think that most people benefit more when a person uses his abilities to improve communication between others (like in typography) than when he merely shares his personal expressions (like painting his name on a wall). But if a graffiti artist lends his skills to expressing some important social commentary, then I personally think that's great. <br> <br>Now, I do believe that Art is an integral part of life, and no human can or should try to supress his expression, but when that becomes the <i>objective</i>, the world gains very little. It's wasteful. On the other hand, people have different natures, and you can't force somebody to be very useful to many other people, at least not without making him miserable - and misery is contagious. <br> <br>&gt; Legibility does not equal communication.  <br> <br>Of course. But ignoring legibility is anti-design. Carson for example is an artist. I think the world needs more "servants" now, not more looking in the mirror. <br> <br>hhp <br></p>
