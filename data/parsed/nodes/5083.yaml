    html: "<p>&gt;the funny thing, nick, is that ive met some writers who think alot like you. they belive that graffiti should be legible all the time. <br> <br>Itay, if they think that graffiti should be legible at all times, they are most definitely NOT thinkin glike me. <br>I was merely pointing out that graffiti and typography are very very different. <br> <br>Remember you started the thread with: <br>&gt;i think graffiti is a peak in typography and caligraphy's history.  <br> <br>I'm just saying that graffiti has nothing to do with typography, and to claim that it is a wonderful part of typography is absurd. In fact, it's the opposite of typography! <br> <br>As many people have pointed out in the thread (Alessandro most  eloquently) they are differsnt -- graffiti is more like WORDMARKS and LOGOs. <br> <br>Typographic design is about a system of glyphs that can be combined in different sequences. <br> <br>Calligraphy has this in common with type: both used for long text.  <br> <br>You would be more accurate to claim that graffiti is a peak in PAINTING's history -- it's more Jackson Pollock than Matthew Carter. <br> <br>However, I can imagine that in the future, digital type could enable more fluid, bio-mimetic forms of expression which would bring it closer to graffiti, and allow for that influence.  <br> <br>For instance, Frank Jonen's type with \"bit depth\", enabling the tonal variety of calligraphy, fused with some kind of LettError datastream-driven Knuth meta-font, could better capture the vitality of graffiti, which is presently killed by the media at the typographer's disposal.</p>"
