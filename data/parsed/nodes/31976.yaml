    <p>i apologize if this has been asked before, but i searched and couldn't find anything.</p>
    <p>i know that these were all hand lettered, but i am wondering if anyone can suggest a modern digital font that is similar to the brush lettering used in the titles on any of these posters. </p>
    <p>thanks</p>
