    date: 2005-11-14T12:50:00
    votes: null
    html: <p>First what is Human Global Media. That is a meaningless statement. You will have to have explanitory copy or a tagline to make it work. I agree the lowercase e in the red Media looks like a mistake. Look at a unicase typeface, something from Emigre comes to mind. I don't understand the kick e In the black media. It seems out of place and doesn't have any apparent meaning. The red dot over the i is meaningless, either make it black or eliminate the dot. Its a good start keep going</p>
  - id: 95436
    user_id: 2942
    user_name: ebensorkin
    user_path: null
    date_raw: 14 Nov 2005 — 11:24pm
    date: 2005-11-14T23:24:00
    votes: null
    html: <p>Yes, keep going. This one isn't sure of itself. What's the business? This logo reflects nothing. It looks superficially like a logo but it won't do the work of a logo. A logo can only work if it has a task to perform. Define that task &amp; you have a chance to make something decent.</p>
  - id: 95438
    user_id: 3771
    user_name: jason
    user_path: null
    date_raw: 15 Nov 2005 — 12:13am
    date: 2005-11-15T00:13:00
    votes: null
    html: "<p>I don't mean to be harsh, but this one is off on all sorts of levels. The two primary fonts are in conflict, rather than providing contrast; that is, the \"style\" of each of these fonts simply aren't working together (you've got a neoclassical serif with a geometric sans, which are more or less on diametrically opposed sides of the fence). Then the kerning is pretty much broken: the \"g\" here seems more associated with \"media\" than the \"h,\" and all of the main letters have too much letterspacing goin' on. The red dot is disproportionate to the letter \"i\" and is thus too obvious a gimmick. The \"e\" in the primary \"media\" looks to have been rotated for no real reason other than to be \"different,\" which is compounded by the fact that the \"e\" in the tagline \"media\" ISN'T rotated (plus the weight issue mentioned above). Then there's a proximity issue in that the tagline is too conveniently shoved in to align with the descender-line of the \"g\". And then there's that floating trademark that isn't really aligned with anything. Again, I don't mean to be a jerk, but this design seems to be ignoring all of the basic principles of typographic design, even by good old Robin Williams' rules (see \"The Non-Designer's Design Book\").</p>"
  - id: 95615
    user_id: 2172
    user_name: Chris Rugen
    user_path: null
    date_raw: 15 Nov 2005 — 2:32pm
    date: 2005-11-15T14:32:00
    votes: null
    html: <p>I agree with Jason on many counts, particularly the mismatching of the fonts. Also, type shouldn't have that much of a size contrast in a logo, when it gets small, the 'human global media' will turn into little red dots.</p>
  - id: 96850
    user_id: 7208
    user_name: Brian_
    user_path: null
    date_raw: 22 Nov 2005 — 9:33pm
    date: 2005-11-22T21:33:00
    votes: null
    html: <p>Neoclassical &amp; a geometric sans can have a lot in common. Moderns, though, are even further engineered and would probably match best. Most importantly whatever you choose should serve a specific purpose.</p>
