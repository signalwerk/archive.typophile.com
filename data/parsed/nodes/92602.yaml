    html: |-
      <p>Of course, there are open-source typefaces that closely resemble <em>old</em> Helvetica. Something so close that it's closer to Helvetica Neue than it is to Helvetica is perhaps not reasonable to hope for.</p>
      <p>Incidentally, other than an imitation of Helvetica, or Arial - which is basically Monotype Grotesque altered to have the same metrics as Helvetica - or Akzidenz Grotesk (also known as Standard), or Mercator... I've just come across another typeface which, although not an imitation of Helvetica, would stand as a legitimate alternative to it.</p>
      <p>I came across it when searching for more information about Egizio, as it is by the same designer - Forma.</p>
