    <p>Hi,</p>
    <p>Just wondering if anyone can please recommend a close alternative to Helvetica Neue on <a class="freelinking external" href="http://www.google.com/webfonts" rel="nofollow">Google Web Fonts</a> please?  Open Sans seems close, but we're needing a fairly light (300) weight font, and we're wondering if there are any other alternatives you can recommend please?</p>
    <p>Thank you.</p>
    <p>VWD.</p>
