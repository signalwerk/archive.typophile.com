      <p>Hi gerald , thanx for your very informative and helpful view </p>
      <p>I have started by looking into the origins and at the moment I am following the lines of the enlightenment and the line perused by Robin Kinross that much of the origins stemmed from Moxons guide of how he wrote in his book that he found it easier to separate into size, from there the French alphabet which led to the point size, that is as far as I have gotten so far.</p>
      <p>I have found much information on  Brighurst and Catherine Dixon, but very little on the actual systems themselves and the only one which I have found a substantial amount of info on is vox’s so for now much of my work is based around this.<br>
      I am not sure exactly which avenue to travel down at the moment as I really need to speak to my tutor to make sure I am going in the right direction, my initial plan is to start with my interest in it followed by a brief history run down, then a detailed look at vox’s system and how it has withstood the changes such as you mentioned in the post and see at which point it was that it started to fail if it ever truly worked form the start.<br>
      From there I hope to look at the calls for a change and current efforts such as Dixon’s and thoughts and suggestions made and to look at whether there is enough support for it and if it is feasible to expect a new system to be workable and welcomed.</p>
      <p>Sorry to warble on and please excuse my write as I talk style, I am not quite as academically minded as many of my colleagues (I am an older student and have come to uni after a 15 yr gap), I can grasp the ideas its just then writing it and structuring it that I struggle with but that will be worked on,<br>
      If anyone can think of any texts or book that might be of any use or even just any thoughts I would love to hear them, thanks for your time and your replys,<br>
      Lou</p>
