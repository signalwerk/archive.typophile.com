    <p>There have been calls over the last 20 yrs for an updated or new <a href="/node/30088" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">typeface classification system</a>, the most common within the UK seems to be vox, s standards. </p>
    <p>Now I would love to pick your brains on this subject as there are questions that I have which I don’t believe can be answered easily or even agreeably for that matter.<br>
    I am struggling to make decisions and form opinions on this, and as a very inexperienced student I would appreciate your opinions and knowledge on the subject. I am aware of this subject being covered before but it hasn’t seemed to touch on the questions or answers I have been looking for.<br>
    I am will be writing on this subject for my dissertation so please just fire away with anything you may feel is relevant.<br>
    Below are a few questions that would be most helpful so I can get an idea of just what typographers in the real world feel, thanks Lou</p>
    <p>Do you feel there is a need for and updated or new system?</p>
    <p>Do you feel a typeface classification is help or is too restrictive?</p>
    <p>What system do you use?</p>
    <p>Do you prefer to come up with your own system?</p>
