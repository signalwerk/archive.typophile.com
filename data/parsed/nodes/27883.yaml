      <p>A typeface classification in terms of keywords is often a tricky thing since it is heavily subdued to subjectivity (except for the obvious standard serif/sans, different kind of serifs,... classifications). E.g. unless you're talking about a digitilized version of an original 60's font, you could dispute whether a typeface is really retro or not.<br>
      I divided a bunch of my fonts in personal subcategories (mostly based on the graphic work it would suit well), but even being the single judge, I find that it still has its flaws.<br>
      The overall problem nowadays is probably the same as in music; too many subcategories are mixed in the creative process which might result in more original fonts, but also makes it a whole lot harder to catogorize them (a great example of this is Linotype's Konflikt - <a href="http://www.linotype.com/10110/linotypekonfliktregular-font.html">http://www.linotype.com/10110/linotypekonfliktregular-font.html</a><br>
      I do find the tags on <a href="http://www.myfonts.com">www.myfonts.com</a> quite good, but you can hardly add up to 30 tags to every font for every keyword that pops into your head. And just labeling everything a little different as a display font is not a solution either.<br>
      More choice often presents you with more doubt &amp; problems.<br>
      Less is more, but might not really do the trick in subcatogorizeing things anymore.</p>
