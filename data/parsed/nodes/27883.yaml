      <p>skellysgirl</p>
      <p>The first thing to do, I would think, is to investigate the history of type classification systems. They begin about mid-twentieth century. That's sort of a clue.</p>
      <p>I was asked by Adobe Systems, pre-Bringhurst, to do a classification system of their offerings for their magazine (can't recall the name), but I ignored it. Mainly, I think the theory of classification systems, per se, is nonsense as it is based on a flawed premise.</p>
      <p>Bringhurst, for instance, bases his system on cultural historical developments. The problem with this is that it was only in the mid-19th century that type revivals began and they began in earnest in the late-19th century only because of the availabilty of film for photography. Without the ability to reproduce historical specimens there are no historical specimens. Bringhurst ignores such technological developments as influence.</p>
      <p>The explosions in type design: the development of wood type, the wholesale ransacking of the recent past (19th-century) as the result of photoengraving, the early twentieth century revivals (one a pseudo revival, another a serious revival), the switch over to photo-offset composition in the late 1950s, the switch-over to digital in the 1980s; all of these are far more significant events than what is proffered by a systematic rethinking of historical continuum.</p>
      <p>An then, of course, every classification system I've ever seen has this garbage can at the bottom where everything that doesn't fit anywhere else, is just thrown in. </p>
      <p>Are classifications systems useful? well, yes, but only if you have an understanding of THEIR development and purpose. I guess I should ask. How useful is a knowledge of Garamond's development in terms of a typographic designer's concern when it was previously not known (shown) prior to the twentieth-century?</p>
      <p>Gerald Lange<br>
      The Bieler Press<br><a href="http://BielerPress.blogspot.com">http://BielerPress.blogspot.com</a></p>
