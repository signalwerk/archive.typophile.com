      <p>You need to have a restricted purpose and a criterion to serve in order to create a practical classification. Otherwise it's a useless task.</p>
      <p>There are already some popular classification systems for historical study purposes (Vox and Bringhurst), other for practicual purposes (display, body, decorative, etc...)</p>
      <p>Why do you need to clasify typefaces?</p>
      <p>Héctor</p>
