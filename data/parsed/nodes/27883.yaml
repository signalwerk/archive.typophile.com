      <p>&gt;<em>Do you feel there is a need for an updated or new system?</em></p>
      <p>No.</p>
      <p>&gt;<em>Do you feel a typeface classification is helpful or is too restrictive?</em></p>
      <p>Too restrictive! </p>
      <p>There have been several great classification discussions here on Typophile. Somewhere is super post from John Hudson, where he references an old Chinese classification system for animals.</p>
      <p>Ca. 1993, Emigre published an article with Jonathan Hoefler about typeface classification. He pointed out that one of the results of classification was that designers sought out all of the holes or border areas of the system, and designed virtually unclassifiable faces for those slots. </p>
      <p>This will only continue. I think that classification always runs after type design. Its like trying to put the whole ocean into a hole in the sand on the beach…</p>
