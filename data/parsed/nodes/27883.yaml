      <p>I had an article published something maybe 15 years when I was a bit more concerned about the development of classification systems. I will look it up tomorrow and scan you a copy if you like. I think you can contact me direct by clicking on the icon, or go to the blog.</p>
      <p>As far as I can recall the Vox was the first or, at least, it was the first significant attempt. I've done some study on Moxon and have written a book that I have not yet completed the printing of. Hopefully, by year's end. He was quite an amazing fellow. I'd read him everynight. Sometimes he was boring beyond belief, other times humorous, and, occasionally amazingly insightful. Mechanick Exercises is a phenomenon; and it paved the way (unfortunately, not in his lifetime).</p>
