      <p>Unfortunately, while I think that Monotype Greek 90 is a beautiful typeface, I have to agree that calling it the most beautiful one of all time is hyperbole. It reminds me of some generic Scotch Roman face.</p>
      <p>However, at least it doesn't impose the upright capitals, italic lowercase convention of Porson Greek...</p>
      <p>But I would hold Times, Palatino, and Artemisia to be superior, for example.</p>
