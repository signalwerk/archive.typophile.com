    html: <p>Monotype series 90 was the best seller of all Monotype Greeks. The 11-point size sold 950 sets of matrices. That figure testifies to its popularity in Greece; but in academic use in England it is rarely seen in comparison to series 106 Porson and series 192 New Hellenic. Neither Cambridge University Press nor Oxford showed it in their  specimens, although Cambridge substituted the upright caps of this series for the inclined ones of Porson.  Some further details about Monotype Greeks, especially New Hellenic, and a specimen of some other Greek types not often seen, may be found in my book <em>The Greek types of the Jericho Press</em> (2014; just published). More information is at <a href="http://www.jericho-press.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.jericho-press.com</a>.</p>
