    html: |-
      <p><cite>It reminds me of some generic Scotch Roman face.</cite></p>
      <p>Considering what Haralambous says about it, and what I find on the site of the <a href="http://www.greekfontsociety.gr/">Greek Font Society</a>, I have to induce that the font is based on a 1805 design by Firmin Didot which thus predates Scotch Roman. That design was  revived in 2006 by George D. Matthiopoulos  for a project of the Department of Literature in the School of Philosophy at the University of Thessaloniki and is available as <a href="http://www.greekfontsociety.gr/pages/en_typefaces19th.html">GFS Didot  Classic</a> (with surprisingly heavy capitals). The Greek Font Society also distributes a more modern design by Takis Katsoulidis, digitised by George Matthiopoulos, <a href="http://www.greekfontsociety.gr/pages/en_typefaces20th.html">GFS Didot</a> (that comes with <a href="http://www.tug.org/texlive/">TeX Live</a> and <a href="http://www.tug.org/mactex/2011/">MacTeX</a>).</p>
