    html: <p>&gt; not very sharp specially on web. <br> <br>I guess you mean that it looks bad on the computer screen? This is a tricky issue even with Latin. You either have to learn how to "Hint" your fonts (an extra step in font design where you add "guidelines" for low-resolution rendering to look better), or turn on anti-aliasing for all sizes and live with the resultant blurriness. <br> <br>hhp <br></p>
    html_clean: <p>&gt; not very sharp specially on web. <br> <br>I guess you mean that it looks bad on the computer screen? This is a tricky issue even with Latin. You either have to learn how to "Hint" your fonts (an extra step in font design where you add "guidelines" for low-resolution rendering to look better), or turn on anti-aliasing for all sizes and live with the resultant blurriness. <br> <br>hhp <br></p>
