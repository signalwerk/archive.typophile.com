  html: '<p><a href="http://perso.ensad.fr/%7eensadtypo/" target="_blank">http://perso.ensad.fr/%7eensadtypo/</a> <br>My group of student started to design a typeface together 3 weeks ago. We hope to finish a final font around the end of May. Each friday, I post online couple of comments and bunch of images reporting where they are now. Click on the efojalict image to access to the current stage. Or start with that first one: <br><a href="http://perso.ensad.fr/%7eensadtypo/travaux/cookerblack.html" target="_blank">http://perso.ensad.fr/%7eensadtypo/travaux/cookerblack.html</a> <br> <br>Despite its in French, English comments are welcome via the "commentez" link. <br> <br><a href="http://erik.letterror.com/cgi-python/tm/cooker" target="_blank">http://erik.letterror.com/cgi-python/tm/cooker</a> <br>The subject started his life with the Erik van Blokland TypeCooker (thanks to this list for the announce of it), so, naturally the working name was Cooker Black. <br></p>'
  html_clean: '<p><a href="http://perso.ensad.fr/%7eensadtypo/" target="_blank">http://perso.ensad.fr/%7eensadtypo/</a> <br>My group of student started to design a typeface together 3 weeks ago. We hope to finish a final font around the end of May. Each friday, I post online couple of comments and bunch of images reporting where they are now. Click on the efojalict image to access to the current stage. Or start with that first one: <br><a href="http://perso.ensad.fr/%7eensadtypo/travaux/cookerblack.html" target="_blank">http://perso.ensad.fr/%7eensadtypo/travaux/cookerblack.html</a> <br> <br>Despite its in French, English comments are welcome via the "commentez" link. <br> <br><a href="http://erik.letterror.com/cgi-python/tm/cooker" target="_blank">http://erik.letterror.com/cgi-python/tm/cooker</a> <br>The subject started his life with the Erik van Blokland TypeCooker (thanks to this list for the announce of it), so, naturally the working name was Cooker Black. <br></p>'
