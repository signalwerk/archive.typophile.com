    html: <p>Hello All, <br>I am new in this filed. I am designing fonts for Urdu and Punjabi languages, writen in persio-arabic based right to left scripts. I have designed a font. <br>But I am facing the problem that it is not very sharp specially on web. I need help in this regards. <br>Thanks in advance. <br>Abbas Malik</p>
