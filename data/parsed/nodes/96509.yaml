      <p>In college I worked at the school paper and we had weekly arguments with our printer due to their inability to consistently print the masthead in the proper specified color.</p>
      <p>We finally threw up our hands and decided "Fine,  the masthead will now be 100% cyan and nothing else".</p>
      <p>So, this reminds me of that. ;)</p>
      <p>Good or bad, though, I did stare at this for a good 5 minutes the other day when buying coffee. I can't say I ever looked at the front page of USA Today for that long ever before in my life, so in terms of getting my eyeballs to look at their paper, I guess it's a success. Not sure that's a good measure of success, though.</p>
