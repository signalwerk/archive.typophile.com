    html: |-
      <p><em>…it isn't a symbol of the brand…</em></p>
      <p>It is, despite its dubious quality as a copyrightable trademark.</p>
      <p>New media rules are different.<br>
      For instance, many of the patented features of digital device OS interfaces would be nothing special if they were part of a web site design.</p>
      <p>It’s funny that a specially conﬁgured shape in static media is copyrightable, yet a specially configured animation sequence is not. And yet that is the migration of typographic interest, from subtleties of static form to the use of default static forms (classic typefaces, primary geometric shapes) that are manipulated in time-based media, or across multiple media. </p>
      <p>This kind of new media design occurs in the space between old media, which leaves its iteration in any particular previous media instance high, dry, and underwhelming.</p>
