    html: |-
      <p>So, tight-but-not-touching = ’60s, overlapping = ’70s.</p>
      <p>However, the ﬁrst USA Today logo, using Futura, was designed in 1982.<br>
      Futura was big then, I recall many ads with huge all-cap headlines set in Futura Bold, often italic, Barbara Kruger style. So the choice of Futura all caps was very contemporary, and they’ve stuck with that.</p>
      <p>On closer inspecting the type of the revised logo:<br>
      1. The Y has been changed from the typeface, with a deeper apex.<br>
      2. It looks like a slightly bolder version than the standard font.</p>
      <p>It isn’t a tight-but-not-touching setting; critical is the space between A and Y.<br>
      A TBNT setting would have been much closer.<br>
      Wolf Olins has decided to deal with the problematic space between A and Y by adjusting the shape of the Y, and keeping its spacing quite open there, and really, it has to be, to balance the space between T and O. </p>
      <p>In the 1920s, the instigators of the graphic disc were Lissitzky, Moholy-Nagy and Tschichold:<br>
       </p><div class="imageWrap"><img src="http://typophile.com/files/Poelzig_4213.jpg"></div><br>
      They did stacked all bold caps too.<p></p>
