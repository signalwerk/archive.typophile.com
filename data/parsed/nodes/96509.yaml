    html: |-
      <p>It makes a certain sense if one watches the <a href="https://www.youtube.com/watch?feature=player_embedded&amp;v=cMD7GeYptos" rel="nofollow">video</a>, and in that context it clearly is anything but old fashioned, simplified or stuck in the 1960s. It's not a big blue dot after all: its a big dot that can be any colour and can also represent anything from a financial graph to a building lot to a baseball to a golf green. In the context of what I presume will be new colour coding of the physical newpaper sections and the possibilities of animation in the various electronic delivery formats, its a fairly clever solution and a means to tie the identity of the different media together while making the most of the different capabilities of each. </p>
      <p>What it isn't is a logo in the traditional sense: it isn't a symbol of the brand, but an active and adaptive component within the brand. I don't think much of it visually, but it does seem to be truly contemporary design firmly situated in digital media.</p>
      <p>Or rather, that is clearly what it was designed to be: it remains to be seen whether USA Today will use it as creatively as the designers intended and illustrated in the video. The beta website does nothing clever with it yet, just sticks it in the upper left corner as a static element in a single colour regardless of the colour of the subsection.</p>
