      <p>I have been using Corel since the version 3 and I can say it had its ups and downs. Not mentioning version 6 that was a pain in the ass - especially the Czech translation, I had no major problems with Corel. It is true, that until the version 10 it was almost impossible to "snap to objects". Also version 10 and 11 used so many system resources, that my CPU ran on 95% almost all the time. Right now I am using the version 12 and I am very satisfied. I can do any graphics in no time. I've tried probably all other DTP programs (even the Linux ones :) just out of curiosity (always looking for something better :), but everytime I switched back to Corel. It just suites me better. It's easy, intuitive and doesn't force me to do things the way I don't want to.</p>
      <p>I think that it is not a graphic program that makes a goot graphics designer. I could show you my old man's designs he did in Corel 3 and you could say if you were able to do it in the latest releases of the best DTP programs.</p>
