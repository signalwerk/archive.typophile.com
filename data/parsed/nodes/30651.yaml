      <p>I have Corel Draw and Photo-Paint 11 on my Mac. It came in a $99 bundle with Bryce 5, Toon Boom Express and a bunch of Bitstream fonts. It has gotten me over a hump while I've been unable to afford my Adobe upgrades, but the damn thing explodes if I try to enter anything from the character pallette.</p>
      <p>Why Corel abandoned further revisions on the Mac I don't know. It would seem that the merger of Adobe and Macromedia (with the death of Freehand) would be a window of opportunity for them. Did they really expect that they would instantly sell more than 3-10% the copies for MacOS than they do for Windows, when another company dominated that market segment and there are only 3-10% Macs out there anyway?</p>
      <p>At least Corel is still porting Painter. *sigh*</p>
