  html: <p>So I've been following this forum for a while and I've noticed little to no talk of Corel's DTP programs. Are they not that useful or has Adobe's product simply become the new standard? The reason I ask is that I would like to get a decent DTP package and Corel is way more affordable, especially with their special pricing for non-profits.</p>
