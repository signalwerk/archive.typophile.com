      <p>I use Corel Draw, simply because I've been using it since version 8, and every time I try to use Illustrator, I get frustrated by little details (e.g. keyboard shortcuts) that are different.</p>
      <p>I hate Corel for its lack of support of OpenType features. If you want to use any ligatures, etc., you have to insert them manually. It's a pain.</p>
      <p>If you're starting from scratch, don't go with Corel, or at least wait until they support OpenType properly... which might be a while.</p>
      <p> - Lex</p>
