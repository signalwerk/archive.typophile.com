      <p>I'm trying to make the switch to Adobe after using Corel Draw and Ventura Publisher for the past 17 years. Any Mac-head will tell you that Adobe is far superior. Advice: don't listen to them. They've never used Corel so they don't know. I'm amazed at how much InDesign lacks when compared to Ventura Publisher. Here's just a few examples:</p>
      <p>• Corel Ventura can vary the widths of individual column within a frame. Column widths within a frame must be of identical value with InDesign. This is an unbelievable fact to me.</p>
      <p>• Paragraph breaks. Corel allows for 'No Break' paragraphs meaning that entire paragraphs can sit side by side within the same text frame. This eliminates the need for columns or threaded frames in Ventura (it's still available, just not needed). Surprisingly this feature dramatically streamlines your work.</p>
      <p>• Document navigation is far better in Corel Ventura. Ventura embeds chapters into one vp file and lists the chapters in it's navigator window.  A simple click takes you to that document. InDesign requires a separate document file for each chapter. (Ugh - a MAJOR disappointment).</p>
      <p>• Interface. Corel relies heavily on dynamic context menus/pop up windows. This removes a lot of the clutter found with the InDesign interface. Additionally, Ventura let's you edit several paragraph styles without having to close and re-open another dialog box. </p>
      <p>• Ventura is considerably faster with long documents.</p>
      <p>CS3 is far better with color, especially spot colors. Ventura has a hard time with spot color bitmap files. A huge turn-off for print shops.</p>
      <p>Corel's biggest mistake is the fact that it's only on Windows. Since the vast majority of graphic designers are Mac based, Corel automatically reduced their fair share of the market thus eliminating any consideration as a competitive graphics package. A real shame seeing how much has gone into that program.</p>
      <p>If you're looking for something easy (actually kinda fun) with lots of features, then Corel is your answer. Well worth the value. Adobe has room to grow and I'm sure a lot can be expected of them in the next few years.</p>
