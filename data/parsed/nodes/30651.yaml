      <p>I used to work on Corel Draw for vector graphics and light layouts but since I switched to an employee position (with macs which don't run Corel) a year ago I have been usind Illustrator. I have started to like Illustrator a bit more than Corel but I still think that Illustrator might learn a couple of things from Corel such as:</p>
      <p>* Selection of objects can be done in the Illustrator way (being touched by the frame) or the Corel way (being inside the frame only) you switch by depressing a key only. Sometimes it's a real pain to select objects in Illustrator.</p>
      <p>* BCPs are so tiny and hard to select in Illustrator it really desperates me. Corel has a better way of selecting and editing BCPs.</p>
      <p>* Corel has graphic handles for tracking, word spacing, kerning and leading in the artistic text mode so it's very easy to adjust logos, headlines and type tricks.</p>
      <p>* Corel has a very practical way of joining and breaking apart paragraphs, sentences, words and glyphs so it's ver easy to play with type as well.</p>
      <p>* Corel has a much more practical way of handling vector objects than illustrator's pathfinder.</p>
      <p>* Shortcuts are better in Corel.</p>
      <p>* Lining, arranging and grouping objects seemed easier in Corel to me.</p>
      <p>On the other hand transparency sucks, paragraph type control is hard, no open type support, it crashes a bit more and bitmap effects are bad. However being the economical situation in México as it is, Corel remains a very popular program and many respectable designers use it.</p>
      <p>Corel Ventura, I've never tried it.</p>
      <p>Héctor</p>
