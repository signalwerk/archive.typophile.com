      <p>Corel Draw has some fans out there, but Corel burned users with horribly buggy releases for so long that many people just don't care anymore. For several versions it was not possible to draw a solid 45 degree line! I'm pretty sure that angry users even filed a class action over Corel Draw 5. Anyway, Illustrator and Freehand got so busy trying to outdo each other that most people pretty much forgot about Corel Draw. </p>
      <p>As for Ventura, I've never heard of anybody actually using it, and never seen it on the list of formats that most printers accept. Given how much trouble designers have just getting printers to accept the latest Quark and InDesign files you might want to talk to your regular printer and find out if they can even use Ventura files.</p>
      <p>If you're only getting it to save money, just bite the bullet and get the Adobe Creative Suite. Between the fonts and the software, it's worth every penny.</p>
