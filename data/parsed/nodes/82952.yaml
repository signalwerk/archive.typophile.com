  html: |-
    <p>I was sent a sample from an old book from the Thirties that turned out to be Middleton's Tempo Medium Italic from about 1930. It's a sans typeface (shown in the Jaspert Encyclopaedia of Type Faces), but it has baseline serifs on a number of letters (a, d, h, i, l, m, n and t) only for this weight and the light weight.</p>
    <p>The only Tempo digitizations I can find that use the name 'Tempo' are the grunged <a href="http://new.myfonts.com/fonts/redrooster/tempo-rr/" rel="nofollow">Tempo Medium</a> from Red Rooster, which is the Roman only, and the <a href="http://new.myfonts.com/fonts/agfa/tempo/" rel="nofollow">Heavy Condensed</a> version from Monotype/Agfa.</p>
    <p>I'm wondering if anyone knows of a digitized version of the italic in the lighter weights?</p>
    <p>Thanks, </p>
    <p>- Mike Yanega</p>
