      <p>The Tempo italic is quite distinctive due to the baseline serifs. The person who sent the ID request was hoping to locate a digital version. Mark's post on the 10490 thread shows this (thanks Riccardo. I had forgotten that thread, which I posted in.)  Futura, while similar in other ways does not have that design.</p>
      <p>I guess I will accept that it's not (yet) in digital form. Bummer!</p>
      <p>- Mike Yanega</p>
