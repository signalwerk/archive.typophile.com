      <p>WE prefer the first one it gives a 'high-tech' impression if that is what you want.  I like it because at one time I used  letters-in-a-cube for my own logo (now disused) - even made a wood sculpture of a 3-letter-cube once.  A selling point is that the company can make small cubes for key-chains etc. as giveaways!</p>
      <p>The first one's colors are beautiful but too subtle and as mentioned above will not appear properly in a photocopy.  Experiment with black and white or grayscale versions and see how it appears at different magnifications and settings.<br>
      The second is nice but reminds too of the Volks-Wagen logo.  Good luck deciding.</p>
