      <p>Ari, I think both are rather smart solutions for a two-letter name.</p>
      <p>One thing giving me pause is the double, overlapping Vs that make up the W in the second version--I find that overlap distracting, Also, the W doesn't intersect with/get cut off by the bounding circle as much as the e, which also throws things out of balance a bit. </p>
      <p>Refine the second version, and you've got two solid choices.</p>
