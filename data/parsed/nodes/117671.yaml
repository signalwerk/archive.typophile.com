    <p>Hi!</p>
    <p>I've designed a couple logos for an accelerator called "WE". For some reason I've been struggling with how short the term "WE" is.</p>
    <p><a href="http://imgur.com/oP23REa" title="Click to visit an external URL." class="freelink freelink-external freelink-external">The first logo</a> is based on an isometric grid. I don't know how legible it may be.<br><a href="http://imgur.com/rTZdvzQ" title="Click to visit an external URL." class="freelink freelink-external freelink-external">The second one</a> is much simpler.</p>
    <p>What do you think? Which one should I go with? What should I change?</p>
    <p>Thanks in advance.</p>
