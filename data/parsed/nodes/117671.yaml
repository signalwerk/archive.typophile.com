    <p>Hi!</p>
    <p>I've designed a couple logos for an accelerator called "WE". For some reason I've been struggling with how short the term "WE" is.</p>
    <p><a class="freelinking external" href="http://imgur.com/oP23REa" rel="nofollow">The first logo</a> is based on an isometric grid. I don't know how legible it may be.<br>
    <a class="freelinking external" href="http://imgur.com/rTZdvzQ" rel="nofollow">The second one</a> is much simpler.</p>
    <p>What do you think? Which one should I go with? What should I change?</p>
    <p>Thanks in advance.</p>
