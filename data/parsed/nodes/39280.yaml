  html: <p>People interested in the background story of the development of <a href="/wiki/FF%20Meta%20Serif" class="freelinking" rel="nofollow">FF Meta Serif</a> can read about it on <a href="http://www.fontshop.be/details.php?entry=239" rel="nofollow">Unzipped</a>. I was really fortunate to be able to talk to all three designers, receiving production drawings <em>and</em> transcripts of e-mail communications.</p>
  html_clean: <p>People interested in the background story of the development of <a href="/wiki/FF%20Meta%20Serif" class="freelinking link-lost" rel="nofollow">FF Meta Serif</a> can read about it on <a href="http://www.fontshop.be/details.php?entry=239" rel="nofollow" class="link-external">Unzipped</a>. I was really fortunate to be able to talk to all three designers, receiving production drawings <em>and</em> transcripts of e-mail communications.</p>
