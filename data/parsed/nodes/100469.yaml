      <p>Tips on choosing a name for your cloned font:</p>
      <ul>
      <li>Look in the dictionary for another word that begins with similar letters (<a class="freelinking external" href="http://www.myfonts.com/search/aachen/fonts/" rel="nofollow">Aachen</a> -&gt; Aardvark)</li>
      <li>Keep only the consonants and replace the vowels (<strong><a class="freelinking external" href="http://www.myfonts.com/search/bembo/fonts/" rel="nofollow">Bembo</a></strong> -&gt; Bambi)</li>
      </ul>
