      <p>Dick, thank you for removing the reference to the plagiarized font; no need to pretend nothing was going wrong. And I've edited my post accordingly.</p>
      <p>I'm not sure what you mean about "tracking a designer's life work". When I saw the font you linked to, I immediately had to suspect plagiarism. I did a few minutes of research, and my suspicion was reinforced enough to issue the warning. And I've been like this for 44 years, not 13.</p>
      <p>As for Dafont being an "authentic source", I really have no idea how somebody could think that... And there's no way I'm wasting time trying to convert bottom-feeders.</p>
