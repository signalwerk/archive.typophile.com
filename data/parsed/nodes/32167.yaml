      <p>Mark, there are a couple of very cogent reasons why Gill Sans has gone unmentioned on this thread until now. For all that you might like it, it's simply not a good choice for form work. </p>
      <p>Carls observation that Helvetica and Univers Condensed are simply what we are habituated to is a good one – it contradicts my earlier post and rightly so. There are many, much better, vaguely humanist, highly legible sans serif designs to be had nowadays. Gill Sans isn't one of them.</p>
