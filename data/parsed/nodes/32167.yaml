  html: |-
    <p>Lately, I've been designing forms (diagnosis, patient information, surveys, etc.) for the healthcare industry. I would like to start purchasing fonts (complete families in both serif and sans) that would be well suited for this kind of work. As you can imagine, they must be able to read well at small sizes and multi language support. Any suggestions would be helpfull.</p>
    <p>IM</p>
