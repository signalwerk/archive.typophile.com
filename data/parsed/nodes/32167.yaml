      <p>I would definitely seek fonts that allow embedding into a PDF. There are enough really big libraries available that do, so you won't be shorting yourself in ignoring the ones that have restrictive licenses.</p>
      <p>As for font types, look for sans serifs, which work well at small sizes. A large x-height is also useful. Look for those fonts with Bell in the name ... they were designed for the phone books, and as such work well in small sizes.</p>
