      <p>At this point Helvetica and Univers condensed are not appropriate choices because their usefulness for forms has been superseded by a host of new designs that are easier to read in the same settings, and as a side benefit, are probably more economical. Choosing them now means that you have them sitting around, and it's easy because we're all used to seeing them on forms and we don't question that. Being habituated to their use doesn't make them the best choice. </p>
      <p>Freight is terrific but probably wrong for forms. The whole slew of vaguely-humanist, somewhat condensed info sans designs would be easy to mine for something appropriate. Consider Amplitude, Fago, Page Sans &amp; Serif, Strada Condensed, Zwo, Slate Condensed, the Mentor family (serif and sans), Zemestro, etc. Lots of new options including superfamilies, width variants, and finely-tuned weights.</p>
    html_clean: |-
