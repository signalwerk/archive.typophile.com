    html: <p>I would look at faces that stand up well to poor printing and photocopying. If they are pdfs, they will inevitably be printed out on a lo-res laser printer at some point. And forms will almost certainly be photocopied. I would also look at faces with distinct numerals. I would suggest Officina (sans or serif), Meta, or maybe FF Strada (which according to the fontfont blurb is intended for forms). They are robust enough to stand up to abuse. I would steer clear of any width of Helvetica, because at small sizes, poorly reproduced, the numerals can look very similar (3=8=9 etc) which is tiresome.</p>
    html_clean: <p>I would look at faces that stand up well to poor printing and photocopying. If they are pdfs, they will inevitably be printed out on a lo-res laser printer at some point. And forms will almost certainly be photocopied. I would also look at faces with distinct numerals. I would suggest Officina (sans or serif), Meta, or maybe FF Strada (which according to the fontfont blurb is intended for forms). They are robust enough to stand up to abuse. I would steer clear of any width of Helvetica, because at small sizes, poorly reproduced, the numerals can look very similar (3=8=9 etc) which is tiresome.</p>
