    html: |-
      <p>&gt; That’s my point I want to use a font that hasn’t been used heavily.</p>
      <p>There's a red flag. Why wouldn't you want to use something that works well, just because others have used it? Don't think that a designers job is to make things that are unique ... it is to make things that are usable. A form is a case where utilitarianism is probably the key requirement of a job. If you want to put your personal stamp on the project, then do so in the header and other elements of the form. </p>
      <p>Keep the body of the form (labels, etc.) as clear and simple as possible. Your clients will love it if your work minimizes mistakes and omissions, and will completely ignore whether it looks unique.</p>
      <p>One thing, while Freight Sans does look nice don't try to physically compress it ... this usually spoils the readability of a font.</p>
      <p>And don't reject Helvetica Condensed because "real designers don't use Helvetica." It is Helvetica that is over used, not Helvetica Condensed.</p>
    html_clean: |-
