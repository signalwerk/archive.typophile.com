    date_raw: 25 Jun 2008 — 4:25pm
    votes: null
    html: <p>If you don't need something very close, consider looking at the caps in your roman fonts. Often the regular caps, spaced out a bit, can serve very nicely as titling. Vendetta Light, Legacy Serif, Jenson, Iowan Old Style, Albertina, Perpetua, Adobe Garamond, Celestia Antiqua, Trajanus, Deepdene, Michelangelo, and Optima Titling have lovely sets of caps.</p>
