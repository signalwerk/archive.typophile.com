      <p>Nice, I like it.<br>
      Although I think some of the glyphs of the old version, had character as well. Maybe you could add the 'M' of the previous version in the new one as an alternate or something? Same for the 'Q'.<br>
      The caps are quite small, or the ascenders of the lc quite short, I see that this is on purpose, but words starting with an initial caps look kinda odd in my opinion. Seperately it looks fine.</p>
