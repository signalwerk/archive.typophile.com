    <p>Tobacco is based on some stuff I posted a long long time ago. Hrant gave me an advice there and now I want to implement it that I could use this font for a school project where I have to design some cigarette packages. Thats why I call it Tobacco. Some letters are not finish yet but I wanted to show it to you before I go to bed :)</p>
    <p>Here is the old thread with the old stuff. I think it looks completely different now.<br>
    <a href="https://web.archive.org/web/20150123232051/http://typophile.com/node/17284" title="http://typophile.com/node/17284">http://typophile.com/node/17284</a></p>
    <p>And then the new one:</p>
    <p>Hope you like it</p>
    <p>So, best wishes and good night: Steven</p>
