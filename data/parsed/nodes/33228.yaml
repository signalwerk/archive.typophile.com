    html: |-
      <p>I like it too, especially for setting all capitals.</p>
      <p>It's definately an improvement on the old version, but I agree with Quincunx in that some glyphs (particularly the M) from the old one would make good quirky alternates.</p>
      <p>I think I would like the U&amp;lc more if the caps were just a little bigger. Maybe the same height as your i or t which I would also make the same height as each other.</p>
      <p>I think the tall ascender and short descender combination works well.</p>
      <p>The W could be slightly wider. It's 'feet?' on the baseline seem a bit close together.</p>
      <p>A non grungy version would probably look good too. Maybe without the angled top edges that are on the E F H I L N T U V W and the top of the lc vertical stems, but then it may lose a lot of its character.</p>
      <p>It's a work in progress, so I guess you havn't worked on the kerning yet, because that's a very lonely A :)</p>
      <p>Looking forward to seeing it progress.</p>
