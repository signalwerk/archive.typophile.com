      <p>This is quite charming I think. The finish on the letterforms is really nice. The only thing that strikes me as needing obvious correction are the dots on the "i" and "j": they're too low; maybe put their bottoms at the cap height. That and the blankspace is too big.</p>
      <p>When this is done, make a much darker (and somewhat wider) weight too!</p>
      <p>BTW, consider calling it Tabac instead - classier, and sounds better.</p>
      <p>hhp</p>
