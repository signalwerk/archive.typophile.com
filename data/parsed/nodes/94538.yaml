    html: |-
      <p>I would agree with Herb about the G looking a like a C, but I don't think you should rule out the Tuscan effect just quite yet - I feel like it would've been the cowboy half of the typeface. Right now, for me, it feels like the digital version is about 98% space themed. Maybe if the slabs were dramatically heavier than the stems it'd feel more letterpress/western poster?</p>
      <p>I think as long as you carry on the asymmetric weight / deconstruction of forms, mixed with high contrast geometric shapes, you'll still have a spacey typeface that looks like it's from the west. If you added the Tuscan effect that is.</p>
      <p>I like the idea though for sure, and I think it will really come together when paired with that space cowboy imagery.</p>
