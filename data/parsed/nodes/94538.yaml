      <p>I REALLY like the overall effect. I think it evokes exactly what you're trying for.<br>
      If you hadn't said that the word was GALILEO, I'd of thought it was CALILEO. It just doesn't look Geeish.</p>
      <p>The thin-lines version isn't suitable for white-on-black use. The thin lines almost disappear in the large size, and everything disappears in the sub-text.</p>
      <p>The sketches with the Tuscan effect completely lose the space-modern feeling - glad you decided against them!</p>
      <p>    - Herb</p>
