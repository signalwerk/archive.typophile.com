    <p>Hello.<br>
     Need your advice/criticism<br>
    This is a school project and the concept of the project is a boutique hotel with a space-cowboy theme.<br>
    Wild West meets intergalactic. I want to come up with a typeface for the logo.<br>
    The thing that seemed logical for me to do is design a futuristic looking slab serif. The slab serifs that are usually<br>
    associated with wood-type letter-pressing.<br>
    So let me show you what I've got so far and let me know what you think or any suggestions. Thank you very much once<br>
    again typophiles.<br>
    Oh yeah, the name of the hotel is 'Galileo'.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/options_3540.jpg"></div><br>
