    html: <p>Almost everything here was lettered by hand, standard operating procedure for this type of poster at the time. The sans serifs are mostly based on Futura (Paul Renner, 1927) and Kabel (Rudolf Koch, 1927). The blackletter-like alphabets are based on Fraktur, which is not one font but a family of fonts that were popular for German printing until the Nazis banned their use in 1941.</p>
