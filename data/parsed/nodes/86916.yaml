    <p>Hi! I'm working on a school project which consists of a catalogue with Nazi Propaganda Posters and the info about the font used. I know that various types of Fraktur were used a lot until 1941, and then Antiqua (Roman) letters were the standard. Altough, I need some help on identifying the fonts from the posters below (some may be handmade, so if there is any similar font please help me).</p>
    <p>If you know any other poster and font from the Nazi era propaganda, that helps too. I need a minimum of 18 fonts identified. Even if they are similar (like various blackletter font faces). Thank you a lot in advance.</p>
    <p>The posters are the following (sorry if the image is too big). Every poster has a number in white or black to help identify the font. Example: Poster 15 - Typeface name.</p>
    <p>Thanks again! :D</p>
    <p><img src="http://i240.photobucket.com/albums/ff280/Laguna_/NaziPropaganda-1.jpg"></p>
    <p><a class="freelinking external" href="http://i240.photobucket.com/albums/ff280/Laguna_/NaziPropaganda-1.jpg" rel="nofollow">Full View</a></p>
    <p>If you need to see a larger version of a specific poster please inform me, and I will try to provide it.</p>
