      <p>Hi Telmo,</p>
      <p>get your hands on a copy of ‘Blackletter: Type and National Identity’, by Peter Bain and Paul Shaw. It is available via <a href="http://incipit.com/linkrefs.html" rel="nofollow">incipit.com</a>.</p>
      <p>In addition to what Victor (Mojo) wrote:<br>
      Rethink the aim of your project. What is gained by listing typeface names, when most of these posters were made without the use of typefaces? Just because Fette Fraktur is a blackletter does not make it similar to the styles used here.<br>
      Wouldn’t it be more interesting to point out the various types/groups of letterforms, their combinations, and applications? You could then continue and describe the special characteristics of some of the most striking letter styles. Alternatively, you could pick one poster, and research its background (designer, year, purpose …) – e.g. #11, with its Faux-Hebrew.</p>
