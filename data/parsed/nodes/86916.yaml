      <p>It is not that no typefaces were used in the Third Reich propaganda, just not (so much) on posters. You could, for example, identify and research the typefaces used in a certain publication, like a newspaper or a magazine. See <a href="http://www.paulshawletterdesign.com/2011/07/from-the-archives-no-24%e2%80%94german-printing-trade-magazines-in-the-1930s/" rel="nofollow">this article by Paul Shaw</a>, about the typefaces used in <em>Archiv für Buchgewerbe und Gebrauchsgraphik</em> (1934) and <em>Druck und Werbekunst</em> (1937). More related online articles from Shaw: <a href="http://www.paulshawletterdesign.com/2011/04/from-the-archives-no-18%e2%80%94satz-und-druck-musterheft-1938/" rel="nofollow">From the Archives no. 18—<em>Satz- und Druck-Musterheft 1938</em></a> and <a href="http://www.paulshawletterdesign.com/2010/09/what%e2%80%99s-online-no-2-german-propaganda-archive/" rel="nofollow">What’s Online no. 2: German Propaganda Archive</a>.<br>
      In <a href="http://www.amazon.com/NSCI-Andreas-Koop/dp/3874397688/" rel="nofollow">NSCI</a>, Andreas Koop presents an overview of the typefaces that were advertised in <em>Gebrauchsgrafik</em> between 1936 and 1943/44.</p>
