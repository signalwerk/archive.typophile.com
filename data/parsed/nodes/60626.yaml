    html: |-
      <p>Hi Lathen,</p>
      <p>no fonts involved, this was all done by hand.<br>
      Check out <a href="/wiki/Mark%20Simonson" class="freelinking" rel="nofollow">Mark Simonson</a>’s <a href="http://www.ms-studio.com/FontSales/mostranuova.html" rel="nofollow">Mostra Nuova</a>. It has a number of alternates, including the circular ‘G’ with horizontal bar, and the ‘Q’ with the centered vertical cauda.<br>
      For ‘Normandie’, <a href="http://www.fontshop.com/fonts/singles/red_rooster_collection/block_gothic_bold_condensed/?&amp;sample_text=NORMANDIE" rel="nofollow">Block Gothic</a> is the closest font I could find.<br>
      F</p>
