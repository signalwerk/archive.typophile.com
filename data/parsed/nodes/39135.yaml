      <p>Stringent proof that the abolition of the Blackletter had nothing to do with a connotated jewishness might not be easy to find, although this seems to be a valid point of view.</p>
      <p>I have never looked deep into this subject (I can't tell you anything you don't already know), but what came to my mind when I read your question is the 'script decree' by Martin Bormann (who then was Director of the NSDAP party headquarters) from January 1941. It says that the Gothic script had wrongly been considered German and that it actually was composed of 'Schwabacher Jew letters' and hence not to be used any longer, especially not by authorities, in school books or in German magazines and newspapers that already were or planned to be syndicated outside of Germany. Hans Heinrich Lammers (head of the Reich Chancellery), who passed the decree on, described its rationale slightly differently (without a reference to an alleged 'jewishness'): the use of the (wrongly named) Gothic script would disservice German interests, as many aliens in and outside of Germany who could understand German could not read Blackletter.</p>
      <p>When Hitler displayed an aversion against the Gothic script at the 1934 Reichsparteitag (Nuremberg Rally), he argued that once German had become the language of Europe, it would be easier to learn for other peoples when written in Latin script. AFAIR, he made no connection between Gothic script and 'jewishness'.</p>
      <p>I only scanned it quickly, but the PDF linked to by Tim (<a href="http://www.peterrueck.ch/pdf/sprache%20der%20schrift.pdf" title="www.peterrueck.ch/pdf/sprache%20der%20schrift.pdf">www.peterrueck.ch/pdf/sprache%20der%20schrift.pdf</a>) seems to be a qualified and exhaustive disquisition of the 1941 Blackletter ban.</p>
