      <p>On page 48, from the book <a href="http://www.amazon.com/Blackletter-National-Identity-Peter-Bain/dp/1568981252/ref=sr_1_1?ie=UTF8&amp;s=books&amp;qid=1195155547&amp;sr=8-1" rel="nofollow">Blackletter: Type and National Identity</a> there is a letter printed on the Third Reich's letterhead with a translation that states:</p>
      <p>"It is false to regard or to describe the so-called gothic script as a German script. In reality the so-called gothic script consists of Schwabacher-Jewish letters. ..."</p>
      <p>It continues on to discuss how the roman is to be used from then on.</p>
      <p>It is a letter from 1941.</p>
