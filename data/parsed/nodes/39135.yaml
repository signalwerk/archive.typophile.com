    html: <p>Sorry i never have been very good at making myself clear so this dissertation is doomed from the start lol anyway what i meant was that my dissertation is centered around the use of blackletter within german propaganda and why it was abolished when it appeared so parallel with the german national identity. I have read many sources stating that the true reason was that conquering nations were having trouble with its legibility but this seems unlikely when you consider that it had been a political issue since the early 1900's and it been brought before parliament to make roman type the standard in 1911 and failed. I guess what im asking for really is if anyone knows a source that gives a contrasting view prehaps that 'judenlettern' or jewish arguement or maybe theres another view that i am not yet aware of? or an account that seems to give a realistic study and outcome?</p>
