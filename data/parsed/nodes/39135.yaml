      <p>Currently the best source of answers is Silvia Hartmann's dissertation <cite>Fraktur oder Antiqua: Der Schriftstreit von 1881 bis 1941</cite> which includes an exhaustive section of facsimiles from primary sources, including dozens of argumentative letters in 1941 between the BfdS and the Reich authorities, featuring a depressingly escalating appeal to antisemitism from both sides as the BfdS's desperation increased. Really, it's breathtaking how absurdly all-consuming the antisemitism became in every piddly policy spat. The Jews were just a disposable excuse to justify every single random whim inside a growing autocracy that fostered and rewarded magical thinking.</p>
      <p>(The closer one looks at this, the more prophetic Franz Kafka's writing seems.)</p>
      <p>Blackletter was a minor casualty compared to the countless humans. That it should needlessly remain a casualty, however, is nonetheless sad and absurd. The evil men in charge first embraced this beautiful art form that had evolved over centuries and claimed it as their own, only to destroy it, just like they did the same to Germany itself and a great portion of its rightful citizens.</p>
