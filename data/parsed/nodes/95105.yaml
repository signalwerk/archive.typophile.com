      <p>Sorry for resuscitating (and derailing!) this thread – I came across it while researching some of Fleischman’s early faces. </p>
      <p>Hrant, is the picture you posted from the original French version of “Typefoundries in the Netherlands” (the Enschedé history, by Charles Enschedé)? Or is this something else?</p>
      <p>John:<br>
      <cite>“Enschedé then purchased the Wetstein types in 1743, and much later in 1799 bought the earlier types that Fleischmann had cut for Uytwerf (which in the meantime had been owned by Ploos van Amstel).”</cite><br>
      Except that Fleischman cut six faces for Uytwerf, and it looks like only three of them ended up at Enschedé. There was a Small Pica/Dessendiaan that I think had already been lost before the PvA/Enschedé merger, but I haven’t (yet) been able to find out what happened to the Roman that originally went with the No. 47 Italic. Ploos van Amstel had it, then it seems to have disappeared. Scrap metal, I fear.</p>
