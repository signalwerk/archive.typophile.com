      <p>It's certainly true that the custom typeface for, say, the Houston Chronicle, based on an oldstyle model, postdated Times Roman.</p>
      <p>And that the faces such as Ionic No. 5, Ideal, Paragon, Corona, and so on, while designed specifically for <em>newspapers</em> by Linotype and Intertype, weren't made for just one particular newspaper.</p>
      <p>Given the great expense of having a set of custom matrices made, it is not impossible that Times Roman was the first face made specifically for the body copy of one particular newspaper - even though I am far from confident that this is so.</p>
      <p>On the other hand, <em>magazines</em>, being printed on better paper, placed a higher value on their typographic appearance, newspapers being disposable. Thus, for example, Century Magazine commissioned the typeface "Century", which is important because it was the ancestor of Century Expanded, Century Schoolbook, and Century Oldstyle, all three of which are still in fairly common use at the present day (the last as a substitute for Alexander Phemister's oldstyle).</p>
