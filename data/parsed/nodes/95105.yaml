      <p>Hrant, re. Enschedé: you are misreading the chart. The chart details the types held by Enschedé in 1908, but not necessarily originated by them, and the 'customer' column as you call it actually identifies the original foundry for whom the types were cut. Enschedé purchased the punches and/or matrices, sometimes many decades after the types were originally cut, often after they had already passed through other hands. So, for instance, Hermanus Uytwerf was a bookseller and typefounder who hired Fleischmann to cut types between 1729 and 1732. Fleischmann was Uytwerf's employee, being paid a weekly wage. For a period starting in in 1732, Fleischmann went into business for himself -- lui-même --, but then sold his business includes these types to another type founder, the Wetsteins, for whom he then cut a number of other types. Enschedé then purchased the Wetstein types in 1743, and much later in 1799 bought the earlier types that Fleischmann had cut for Uytwerf (which in the meantime had been owned by Ploos van Amstel). Directly for Enschedé, Fleischmann cut two types in the mid-1740s and four quite late in his career in the early 1760s. Most of his types were cut for the Wetstein foundry. His name is associated with Enschedé because they ended up owning pretty much everything he ever made, but during his life he cut types for at least eight different foundries, plus his own. This is what is recorded in the chart in the big Enschedé book, not commissioning customers.</p>
      <p>[I've only checked the details on Fleischmann's roman types; there were also blackletter types produced under similar circumstances for various foundries.]</p>
