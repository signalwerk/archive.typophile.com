      <p>Well, it turns out that I do have that article transcribed. But, for some reason, I did not include the precise citation information with the file. If memory serves: I’m pretty confident that this was written by Robert Nicholson for <cite>Linotype News</cite> (or some other Linotype house publication), circa 1950s.</p>
      <p>Here is a relevant excerpt:</p>
      <blockquote><p>Why is it that out of the thousands of type faces available, most newspapers are set in one of the five legibility faces?</p>
      <p>It all began in the Governor’s suite of New York’s Roosevelt Hotel, early in the summer of 1923. The occupant of the suite, then a former governor, was Martin H. Glynn, publisher of the Albany (N. Y.) <cite>Times-Union</cite> from 1905 to 1924. His guest was C. H. Griffith of the Linotype company. [&nbsp;.&nbsp;.&nbsp;.&nbsp;]</p>
      <p>Governor Glynn was one of the first American publishers to become interested in the physical improvement of the newspaper. He realized that at that time newspaper readability had reached an all-time low and he hoped to enlist the aid of the Linotype company in doing something about it.</p>
      <p>[&nbsp;.&nbsp;.&nbsp;. <em>historical interlude about developments in newspaper printing technology and consequent decline of typeface performance</em> .&nbsp;.&nbsp;.&nbsp;]</p>
      <p>It was at the depth of this condition, in the early ’20s, that Governor Glynn and C. H. Griffith sat down to discuss a remedy. The governor envisioned the necessity of getting away from the small body types then in vogue, and developing a new face of such merit that publishers would not hesitate to sacrifice spatial economy for something easier to read and more attractive to the eye. He suggested a type of darker texture and less contrast in thick and thin lines.</p>
      <p>[&nbsp;.&nbsp;.&nbsp;. <em>discussion of subsequent exploration and development of Ionic No. 5</em> .&nbsp;.&nbsp;.&nbsp;]</p>
      <p>Before the new face was fully developed, Governor Glynn died. Nevertheless, the groundwork for a revolutionary movement, which was destined to sweep over the newspaper world, had been established through his initiative and wise counsel.</p>
      <p>Finally, in March, 1926, the Mergenthaler Linotype Company announced the introduction of Ionic. [&nbsp;.&nbsp;.&nbsp;.&nbsp;] Almost as soon as the first advance proofs of Ionic were shown, the Newark (N. J.) <cite>Evening News</cite> adopted it, becoming the first newspaper to use the new face. </p></blockquote>
      <p>I don’t know if this meets your criteria for “commissioned” or “custom.”</p>
