    html: <p>Thanks for the critiques. As for the bumpy curves, it's probably because I haven't finalized the ampersand design yet. I am planning to smooth it out a bit more. Also, I'm on a search to find a better font for the Rs. I will work on the stuff you guys mentioned and try to come up with something better.</p>
