      <p><cite>I believe Arno means, and I agree, that the top and bottom parts of the &amp; should be closer to the same size in keeping with the common properties of an hourglass.</cite></p>
      <p>Yes, that’s, what I meant.</p>
      <p>And in the actual example I would say, that the first R should be dragged slightly (one or two pixel) to left.</p>
      <p>You also could try to horizontal mirror the left R, drop the ampersand and creating an hourglass in the negative shape between the R and the mirrored R. I mean, this cries for symmetry.</p>
