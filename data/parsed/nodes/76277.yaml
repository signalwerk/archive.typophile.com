    html: |-
      <p>After trying a search for a new typeface for the R's, I tried playing around w/ the serifs of the existing R's and came up with something that I feel better harmonizes w/ the ampersand.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/rnr2_5841.jpg"></div><p></p>
      <p>I also aligned the bottoms of the Rs and the ampersand.</p>
      <p>The ampersand still might have some slight irregularities but I'm planning on fixing everything when I vectorize it.</p>
      <p>Also, Arno, do you mean the counters of the R's should have the same amount of space as the space in the bottom portion of the ampersand/hourglass? I feel they are quite similar unless you are referring to something else?</p>
