    html: "<p>Yeah I guess I don't NEED an exact match - but if I could find that it would be great - but yes suggestions are very helpful as well - I was just trying to determine if I was going to have to customize a font to get that \"swooshing\" O or if there was a font out there as rad as this... <br> <br>And I'm still very open to any more ideas for California/West Coast 70s/80s surfer fonts...just to give you guys an idea of what I'm working with so far a few of the favs I've been using are: <br>Debussy, Opal, Answer, Rollerguide, Plush,Cookie/Cooper, Grease, Frankfurt, Hobo, and I even used Black Rose for one logo that turned out pretty sweet - I did find some others I'm planning to snag soon - LazyBones &amp; the Tango font...so any more suggestions along these lines PLEASE hook me up! <br> <br>Thanks guys... <br>The Danger</p>"
