    html: "<p>I am just new to fontlab and just starting to working on my spacing, so this topic also interests me.</p>

      <p>My understanding of the measurement line is to help you space your sidebearings correctly. You can move it up and down and whereever it falls on the glyph on both sides of it it will measure out to the sidebars. So if you had a flat side and a fat side like a capital H, you could give it equal distance on either side right in the glyph editing window without going into the metrics (although i find it easier here)\x03</p>

      <p>Maybe there is more to it, i am not sure, but looking forward the responses from others :)</p>"
    html_clean: "<p>I am just new to fontlab and just starting to working on my spacing, so this topic also interests me.</p>

      <p>My understanding of the measurement line is to help you space your sidebearings correctly. You can move it up and down and whereever it falls on the glyph on both sides of it it will measure out to the sidebars. So if you had a flat side and a fat side like a capital H, you could give it equal distance on either side right in the glyph editing window without going into the metrics (although i find it easier here)\x03</p>

      <p>Maybe there is more to it, i am not sure, but looking forward the responses from others :)</p>"
