    html: |-
      <p>A couple of additonal comments:</p>
      <p>I make most use of the measuring line within the metrics window, where you can turn it on and set values relative to stems and bowls just as you would relative to extremes.</p>
      <p>Note that in the Glyph Properties panel, two sets of horizontal metrics are shown for the selected or open glyph: actual sidebearings from extremes and also sidebearings at the measuring line height.</p>
