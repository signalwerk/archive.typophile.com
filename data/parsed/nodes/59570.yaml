      <p>I have done several bilingual and a couple trilingual books. I agree with the people who say the typefaces should be the same, the color the same, etc.</p>
      <p>Too often, graphic design seems to fall into the trap "anything different must be signaled by a different graphic treatment." But that's not usually true. If the difference is apparent to a reader, that is sufficient.  In this case, with a two-column treatment, the different languages will be readily apparent as you read.</p>
      <p>Now, if you enter the book in a *design* show, as opposed to a *book* show, you might get slammed. I have noticed that, depending on the jurors, books selected for a design show can be terribly hard to read.</p>
    html_clean: |-
