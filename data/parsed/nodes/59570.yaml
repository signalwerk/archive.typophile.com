      <p>I agree that the application depends on the project itself as well as practical constraints. Like Michel said, French for example is usually longer than English, so the text arrangement needs to work around this and make it work for the layout without either language looking out of place or more important. If one of your texts is noteably longer than the other, rather than forcing each to fit in the same amount of space, you might try putting them one after the other, for instance, and differentiating by a slight colour change (grey/black for instance). </p>
      <p>On the other hand, I also like the idea of not separating at all; I wrote a English-French book and both languages are on the same page with the English simply running into the French, intriguing the reader as suddenly he doesn't understand anymore or vice versa. The point of this though was to reflect the way I speak easily mixing both, so it really does depend on the individual project.</p>
      <p>Claire</p>
      <p><a href="http://www.op45.com" title="www.op45.com">www.op45.com</a></p>
