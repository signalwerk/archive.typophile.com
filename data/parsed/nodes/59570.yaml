    <p>Hi everyone!<br>
    I'm starting a book for a commemoration of 100 years of a company. The book will have lots of images and a text in Portuguese and English.<br>
    I want to learn with the typophiles here what would be the best combination for "the separation" of text (Portuguese vs English).<br>
    1- Color of typeface?<br>
    2- Real color of typeface? I mean black vs gray?<br>
    3- Roman vs Italic? (the text will be set in minion)<br>
    4- None? Expect that the Portuguese identifies language and the English his...<br>
    5- Serif vs Sans?<br>
    Any good examples that someone care to share I would love to see them...</p>
    <p>Thanks in advance for all comments.<br>
    António</p>
