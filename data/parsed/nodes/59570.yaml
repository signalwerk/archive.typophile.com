      <p>If you can, try to find any of the number of books on grids or type that are written in English &amp; German (and often French or another language) to see how they do it. Some examples that come to mind are Typographie or anything by Müller-Brockmann. You might try poking around <a href="http://www.youworkforthem.com/list.php?cat=40" title="You Work For Them">You Work For Them's</a> book collection (with internal screen shots) if you can't get access to the books yourself. </p>
      <p>As far as I have seen, simply being in different languages and a bit of spacing tends to be enough separation to differentiate different portions, but it depends on the project and particular style you are aiming for. </p>
      <p>Personally, I would make both the English and Portuguese versions as clear and legible as possible in their own right, but separate from one another and de-marked in some way. How that actually applies really depends on the project itself.</p>
