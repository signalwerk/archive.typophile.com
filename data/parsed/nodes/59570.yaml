      <p>I am not in the business but it is my feeling that part of the choice may depend on practical constraints: for instance, we have bilingual French-English publications in canadian planes and trains that are set in a two column format, one column for French (usually a sans), the other for English (usually a serif). See for instance the <a href="http://www.viarail.ca/en/useful-info/onboard-train/via-destinations-magazine/june-2009-july-2009/">VIA destinations Magazine</a>. If you pay attention, you realize that the French side has more characters than the English side: on page 59 (for which the characters are embedded) I get as much as 14% more characters on the French side (including blanks); French just requires more characters. Choosing the same font on both sides would have caused problems.  My guess is that choosing a serif and a sans somewhat hides the fact that the French side is more cramped than the English side. If someone knows of another reason, I'd like to be told.</p>
      <p>Michel</p>
