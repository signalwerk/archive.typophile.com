      <p>Here in Belgium everything is also in two, sometimes three, languages and usually the fonts stay the same as Don mentioned. In some books you do often see different colours used as I mentioned; done well I think it's readable but obviously the colours have to be picked carefully. For instance, if you used two different shades of grey and make sure they're both readable, the lighter one could go first to make sure it doesn't come across like that language is less important than the other.</p>
      <p>I do agree though that the fact that it's two languages is enough a differentiation but it can be an interesting element to play around with.</p>
      <p>Claire</p>
