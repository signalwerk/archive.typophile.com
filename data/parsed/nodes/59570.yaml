      <p>IN GENERAL I agree with those who say that type in bi- or multilingual books should be set the same face, size, color, etc. But I offer some suggestions.</p>
      <p>**  A book such as the one described by the originator of this thread could very well support the two languages being set in different faces and/or in different colors. This book seems to be a piece of corporate promotion, not a novel, not a philosophy text, not a history monograph. I imagine that "design" will have a much larger role in such a book than in most instances of books made by publishing houses for the general mass of readers. So long as the two languages are set so they have equal "visual weight" on the page, use of two colors and/or two faces (serif and sans) would be fine. If this even-ness in "weight" is achieved, I do not think there will be any imputation of preference or importance.</p>
      <p>**  There may be instances when one face is used for all languages in which very slight size differences may be needed. Ojibwe has very long words and many instances of doubled vowels. Within those vowel-heavy words there are relatively few descenders. Setting a bilingual Ojibwe/English book, I was not happy with the way page spreads were working. I ended up setting one of those two languages larger by .25-point. It made all the difference; the languages appeared to be in better balance. I am sure not a single reader noticed this. This was some years ago, the files are filed away, and I cannot recall which language got the boost in size.</p>
      <p>powers</p>
