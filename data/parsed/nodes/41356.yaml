    <p>Designed by <a href="/node/add/wiki?edit%5Btitle%5D=Practise" title="Create node &quot;Practise&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Practise</a> <span class="amp">&amp;</span> <a href="/node/add/wiki?edit%5Btitle%5D=James%20Goggin" title="Create node &quot;James Goggin&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">James Goggin</a> 1994-2001</p>
    <p>Published by <a href="/node/14102/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Lineto</a></p>
    <p>courier sans was originally designed in 1994 during the first year of my graphic design degree in order to circumvent the college’s tyrannical “courier only” rule of their pseudo-basel ‘basic typography’ exercises. by taking the generic macintosh system font and cutting off all the serifs, a pleasantly anonymous and functional, yet somehow stylish sans serif was created. i received a third for the exercise, but was able to refute accusations of rule-breaking with the answer: “ah, but you see: it’s courier <span class="caps">SANS</span>!”</p>
