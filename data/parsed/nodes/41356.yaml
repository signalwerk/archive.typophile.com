    <p>Designed by <a href="/wiki/Practise" class="freelinking link-lost" rel="nofollow">Practise</a> &amp; <a href="/wiki/James%20Goggin" class="freelinking link-lost" rel="nofollow">James Goggin</a> 1994-2001</p>
    <p>Published by <a href="/wiki/Lineto" class="freelinking link-lost" rel="nofollow">Lineto</a></p>
    <p>courier sans was originally designed in 1994 during the first year of my graphic design degree in order to circumvent the college's tyrannical "courier only" rule of their pseudo-basel ‘basic typography’ exercises. by taking the generic macintosh system font and cutting off all the serifs, a pleasantly anonymous and functional, yet somehow stylish sans serif was created. i received a third for the exercise, but was able to refute accusations of rule-breaking with the answer: "ah, but you see: it's courier SANS!"</p>
