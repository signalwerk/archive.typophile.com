      <p>I think it’s <a href="http://www.emmanuelrey.ch/" rel="nofollow">Euclid</a>. (Click the “Type Design” tab and then click “List of fonts” on the bottom. You’d see Euclid on the third line from the top.)<br>
      Though <a href="http://swisstypefaces.com/fonts/euclid-bp/all-styles/" rel="nofollow">the retail version</a> is a little bit different. (Have a look at the y and the s.)</p>
