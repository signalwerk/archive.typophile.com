  html: |-
    <p>I'm working on a lovely job to design a brochure for an architectural practice who have designed a buiding for an eye hospital. The brochure will act as a showcase for the project and is aimed at their clients and the wider architectural community. The finish size will be 210 x 210mm and very image-led. </p>
    <p>I was wondering if anyone has any ideas for a typeface that might be appropriate. I was thinking that one designed with good legibility in mind might be a place to start – or is that too much of a cliche given the subject of the brochure?</p>
    <p>Many thanks in advance.</p>
  html_clean: |-
