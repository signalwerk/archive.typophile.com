      <p>I would think a modern sans would work best for an architecture firm. FontShop has a good string to look at—perhaps <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;font_categories_search=font_name_search&amp;searchstr=FF+Kievit+Pro&amp;image.x=0&amp;image.y=0" rel="nofollow">FF Kievit Pro</a> or <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=FF.11312.0.0" rel="nofollow">FFBau</a> if you need a more tame one.<br>
      Also, Mark Simonson’s geometric sans <a href="http://www.ms-studio.com/FontSales/proximanova.html" rel="nofollow">Proxima Nova</a> would be a good choice.</p>
      <p>ChrisL</p>
