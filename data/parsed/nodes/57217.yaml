      <p><cite>James, this is fundamentally different because the song you have on your computer is not public. The font on a web site is.</cite></p>
      <p>So the big difference between the proposed font situation and the existing situations with other media that it’s easier for font designers to sue a pirate because the infringing font is on a public server? Because a few font vendors claim that they have the time, money, and inclination to try and recover money from pirates via lawyers does not justify the inevitable DMCA (or other law outside the USA) violation lawsuits that arise when a software is released without the DRM system and font vendors decide that it constitutes a circumvention device. It doesn’t justify the resources programmers will waste coding an ineffective DRM system into their work to avoid getting sued. It doesn’t justify the hoops end-users will have to jump through when the DRM fails to work properly. </p>
      <p>Font vendors who choose to pursue font DRM do so at their own peril, because in the end it’s just going to end up pissing a lot of people off. That “**** THE FOUNDRIES” post was just a start—think about what will happen when somebody sues a Linux distro that includes DRM-free web browsers and web font creation and editing tools. Font vendors are eventually going to have to realize that the only solution to the problem is accepting that some piracy will always happen and finding ways to exploit it to their advantage.</p>
      <p><cite>Tal Leming has weighed in on this. Is his proposal the same as Berlow’s?</cite></p>
      <p>It sounds like it, but only Dave can say for sure.</p>
