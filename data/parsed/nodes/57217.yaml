      <p>Ralf, I may have got it wrong what Tal and David envisage, but my impression is that the point of such a table is to have fonts that are defined for the web, and can be licensed as such. </p>
      <p>The defacto situation now for print fonts is that if someone uses an unlicensed font for personal use, or at least not published widely, they don't have much of any risk of prosecution. But if it is for big commercial use, then they run a risk, and have a motivation to license beyond just wanting to be honest.  </p>
      <p>I think that the goal should be to have something like that for web fonts, and I thought that is what David and Tal are after.</p>
