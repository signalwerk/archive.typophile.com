      <p>William&gt;2. Once some kind of table is in existence, how is type put on the web, and who has to do more work to get it on the web?</p>
      <p>William, FontLab makes a table writer, the table is editable in FL, it's written in the fonts, we and our licensees are covered and can go on. (FL is suddenly claiming to have made the table for release soon, but it is still called EEULAAHA, so I'm dubious because; a. FL can't get the end point to attach to the start point, b. "End Users" are not involved in the legal or linking issues of web fonts, and c. FL doesn't license many fonts to web users, so they are likely to be under-clued as to the needs of such a table. We are writing our own for these and other reasons.</p>
      <p>Thomas &gt;Not defined. There are many different possibilities here.</p>
      <p>There are not many different real possibilities here, though I'd love to here you stretch it. I have proposed discussion of a solution that is entirely, 100% self contained in the font industry. Anything that expects anyone else to do anything is not a proposal to count on. </p>
      <p>&gt;Browser makers are burdened by the need to deal with more info in fonts,</p>
      <p>No actually they are not. I put Permissions Tables in my fonts, site and link to them, the browser's OS displays them on the user's machine and no browser has to do anything. It's already done today, and that's how I know. </p>
      <p>&gt;and by possible legal risk under the DMCA (they are at least afraid of this, whether justifiably so or not).</p>
      <p>And this is 50% of the point of my proposal for discussion. Browser makers will no longer be at risk, the situation passes to be between linker and founder. No other legal is solution is available with no work by anyone else. </p>
      <p>Cheers!</p>
