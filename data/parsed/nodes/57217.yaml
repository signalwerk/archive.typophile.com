      <p>James, I think David's concept is that web crawlers or spiders can be used to find fonts put on a server, when the site owner hasn't bought a license. They could be easily caught if they change just the permissions table, but not the name. </p>
      <p>If they changed both the table and name it would be harder to do automatically, but people might report them if it's public, and also there's the 'what the font' matching software stuff. </p>
      <p>Being a crook and using the web is a very risky undertaking for the crook, as it seems the new "Dr. Jeckle and Mr. Hyde" in Boston has just found out.</p>
      <p>The main thing is that if you put it on the web, it's very public, and so a big risk if there is serious enforcement. Of course, with countries that allow crookedness on the internet, you aren't going to be able to get at them. But other places you will.</p>
