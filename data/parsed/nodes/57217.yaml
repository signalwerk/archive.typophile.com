      <p>Another thing worth noting is that while fonts are fundamentally different from other media formats, DRM is not. The differences between the proposed simple font DRM systems and the convoluted encryption and watermarking systems used for music are not relevant to DRM’s pernicious impact on the freedoms of programmers. Once a font DRM system is in place, it becomes illegal to circumvent it in some countries. This opens programmers up to civil and/or criminal suits for writing an application that renders text. I’ll admit that nobody is asking for the kind of control that media conglomerates have attempted to emplace. But there are still a few litigious screwballs, not to mention overzealous prosecutors, who could really ruin somebody’s day.</p>
      <p>Further, I want to reiterate something that came up when this debate was had on the ATypI list last year. A vendor does not need any kind of font DRM system in place to crawl the web for license violators. As long as a vendor has a list of web domains with a legitimate license, he can still go after anyone using the fonts without a license. If the ability to catch violators is important, that can be had today, using @font-face, sIFR, EOT, Typeface.JS, and Cufón.</p>
