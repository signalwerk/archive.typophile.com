      <p><cite>what would be your web hosting costs if your clients get many millions of hits per year?</cite></p>
      <p>The license costs would depend on the number of hits, just as any webhosting provider might charge you more when your traffic exceeds a certain limit. </p>
      <p><cite>Technically, hosting a web font would allow you to track the number of hits for different client websites. Is this an issue (I assume it can be)?</cite></p>
      <p>Good point. The webfont service provider would have to ensure that those data is not misused. But again: We're not inventing something new here. Including external services is common practise in webdesign (e.g. page counters, news applets, feed services and so on.)</p>
      <p><cite>3) What will be a font vendor liability if, for whatever reason, a font can not be served to a client website visitor, and the content layout is broken as a result?</cite></p>
      <p>I don't think that's an issue nowadays. The service should be based on a reliable server (Amazon S3, Google App Engine et cetera) and the website layout cannot be "broken", since fallback fonts will always be around, because users will always have the chance do deactivate font-embedding on the client side.</p>
