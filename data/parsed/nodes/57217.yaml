      <p>Disclaimer: I work for Monotype Imaging, the information presented below is my opinion only and may not represent the official Monotype Imaging position.</p>
      <p>Tal wrote:<br>
      "The only change to the OpenType specification that I’m proposing is a single addition of a bit to fsType in OS/2. That’s a backwards compatible change that doesn’t require any support from font managers, applications or OSes. The only things that would need to understand this bit would be browsers ..."</p>
      <p>I am afraid this is exactly the reason why adding a new fsType bit, or a whole new table wouldn't accomplish anything. What type designers and font vendors want is that web fonts can not be easily copied from the web (or browser cache) into OS font folder and re-used in other applications. Adding a bit that is ignored by all existing OSes and applications would do nothing to stop this.</p>
      <p>Font vendors do not want raw Truetype / OpenType fonts be served on the web to prevent font piracy. Luckily, web masters do not want to serve raw fonts either (you can find many embedded fonts discussions on <a href="http://www.webmasterworld.com" title="www.webmasterworld.com">www.webmasterworld.com</a>). They need compressed fonts beause they want to minimize the amount of data transmitted from a web server to reduce traffic, and web designers want to speed up webpage download times. I understand that EOT domain locking mechanism may get in the way and be an obstacle when web content is staged on different servers, but EOT also employs lossless font-specific compression (MicroType Express (MTX), developed by Monotype) that, on average, is 30% better that zip. </p>
      <p>I believe that if web fonts are just served compressed using MTX, this would be a win-win situation for both font vendors and web developers. A browser would have to simply decompress the file to use a font for rendering. An MTX compressed font file can not be used "as is" in OS applications and because the compression is not generic, it would at the same time work as the obfuscator to create a barrier for font piracy. Yes, I do realize that soon enough we'll see decompressor tool available on the web, and that there is nothing font vendors can do to stop people who are determined to steal a font. MTX will minimize web traffic (which is even more important for slow connections) and will prevent casual misuse because the compressed font can not be simply copied from a browser cache and used elsewhere. I do believe that 99% of users will not knowingly seek a tool that would allow them to rip the font from the MTX-compressed file.</p>
      <p>Monotype Imaging has agreed to provide MTX compression free of charge on W3C royalty-free terms. So far, browser vendors oppose to implement it, they say it's to much work even though the source code implementation is readily available as part of the MTX spec (<a href="http://www.w3.org/Submission/2008/SUBM-MTX-20080305/" title="http://www.w3.org/Submission/2008/SUBM-MTX-20080305/">http://www.w3.org/Submission/2008/SUBM-MTX-20080305/</a>).</p>
      <p>-Vlad</p>
