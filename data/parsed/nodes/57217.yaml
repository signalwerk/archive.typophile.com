      <p>@Tal: "David is proposing changes for multiple font formats that are much larger in scope than what I’m proposing."</p>
      <p>How so? He doesn't go into much detail, but his brief mention of adding a new set of embedding bits doesn't seem "larger in scope" to me. Different, but not larger in scope than adding URLs and scrambling the beginning of the file. Arguably smaller in scope than Sampo's proposal which you are backing.</p>
      <p>BTW, Dave B lists four font formats. But two of them aren't font formats at all (FreeType and CoolType), and the distinction between TrueType and OpenType is rather razor-thin. Windows TrueType has evolved into OpenType. I suppose Apple probably maintains their TrueType spec, though.</p>
      <p>Dave B also has the wrong target: it would be easy to get something like this added to the OpenType/OFF spec. The difficult hurdle is getting it accepted by the W3C. Sampo's proposal was already rejected by quite a few W3C members.</p>
      <p>Then again, maybe the most effective thing to do is to get the info into the font spec(s), and then press the browser makers to respect those specs. Getting them to do *anything* more than raw desktop fonts on web servers on their own has been a lost cause to date.</p>
      <p>Cheers,</p>
      <p>T</p>
