      <p><cite>I don’t know what solution is good, but I do know that the current situation of producers not getting paid is not sustainable.</cite></p>
      <p>You’re correct, but that’s not the issue at hand. This isn’t about giving fonts away, it’s about selling fonts. Font designers need to focus on selling fonts to the thousands of web designers who want to buy them instead of worry so much about the people who will steal the fonts. Yes its offensive that after months or years of work on a typeface people will pirate it without thinking about it. But intellectual piracy is a force of nature. Waiting for someone to find a way to stop that is like sailors sitting in port all day waiting for the open ocean to calm. </p>
      <p><cite>W3C ignoring the needs of font designers…</cite></p>
      <p>I really don’t think that’s the case. The W3C has heard the desires of the font designers (I saw desires because font DRM is a desire, not a need). But the W3C has to balance it against the legal, ethical, and commercial disasters that are the history of DRM so far. Unlike the groups that have overseen DRM in the past, the W3C is not a corporate entity with bottomless pockets and legions of lawyers and lobbyists. Asking them to implement a font DRM system is like asking them to smear themselves with blood and hop into a shark tank. It makes much more sense for them to just wait for younger font designers to start licensing for the web and then watch the old guard cave or die.</p>
      <p><cite>That whole thread with it’s comments makes me really not like certain aspects of the FOSS community</cite></p>
      <p>Now imagine what its like for the people sitting on the W3C.</p>
