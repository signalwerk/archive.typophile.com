      <p><cite>I wonder if it would be possible for type vendors to host the font files on their own server, and then license links to the files as a web extension, or web-only license? </cite></p>
      <p>I am proposing this idea for some time now. See my webfonts survey and my comments:<br>
      <a href="http://opentype.info/blog/2008/04/19/font-face-survey-results/" title="http://opentype.info/blog/2008/04/19/font-face-survey-results/">http://opentype.info/blog/2008/04/19/font-face-survey-results/</a></p>
      <p>Such a service is not hard to set up. I will do it myself if I would ever find the time. </p>
      <p>Still, I would consider this a promising market, but an additional market. The majority of today's users still want a regular way of licensing, which means: Pay once and get the font files (to be uploaded on their own server). And we cannot change this system just because of our security issues.<br>
      We also experimented with ways how OT/TT files could be manipulated so they will work in the browser, but not in the user's OS. There are several ways to achieve this. So this DRM-lite is already possible. If there will be a standard way of doing it in the future, that's fine with me. But we will not wait for this to happen and start selling webfonts rather sooner than later, probably later this year, when Firefox 3.5 will have @font-face support in their regular version. </p>
      <p>Some people seem to doubt that "users" would pay for webfonts at all. But professional webfonts are probably not for private users with a MySpace page (they have plenty of Dafont and open source fonts to choose from). Professional webfonts are licensed through professional design studies. Especially for webdesign studios it is very common to license software for a project, for example a Content Management System or an E-Commerce solution, or even just a tiny plugin for those systems. Those packages usually come with a per-domain license. The design studio will purchase that license and bill it to the client. Those packages are not protected in any way, but if a second client wants that same system the studio would license it again for this new website. So such a procedure is nothing new and licensing webfonts in this way would be no problem.</p>
