      <p>Thomas, the PDF embedding bits serve a different purpose than web fonts and are deployed differently. Not many fonts disallow embedding, and while many disallow embedding into editable documents, I don’t get the impression that many people are creating editable PDFs using fonts other than common system fonts. I don’t see a big desire on the part of users to get their hands on collections of fonts that allow PDF embedding. Given this I don’t think that the example of PDF embedding bits is an accurate analogy to how users might react to permission bits in fonts.</p>
      <p>A better analogy might be the DRM-extra-light system that Adobe uses to protect its software from piracy. Just a simple serial number and a registration system that phones home for some products. Any before any Adobe product makes it to retail, thousands of people are already using cracked copies and monitoring every outgoing nework port on their machine for attempts to contact Adobe. Because unlike PDF with editable content, people are actually interested in getting Adobe software for free. </p>
      <p>I think that there are many, many more people who want to embed fonts in web pages than in editable PDFs. And I think that there would be quite a demand for cracking tools and cracked, just as there is for DVDs or software keys. But I also believe that, as with software, most of the demand for pirate fonts comes from people who would not buy the fonts anyway, and they probably aren’t really worth worrying about.</p>
