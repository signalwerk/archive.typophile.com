      <p>randy-</p>
      <p>i'm right here in left field with you,<br>
      wondering the same thing, so thanks<br>
      for asking the question.  i assume there<br>
      might be some problems with _latency_,<br>
      but that wouldn't be a killer per se, as it<br>
      could be solved with enough resources...</p>
      <p>***</p>
      <p>thomas said:<br>
      &gt;   Bowerbird or anybody else new to the discussion:<br>
      &gt;   Yes, there is plenty of demand from both web<br>
      &gt;   designers and organizations/people with web sites.</p>
      <p>so go make yourself some happy customers.<br>
      that's all i'm saying...</p>
      <p>&gt;   There’s also plenty of evidence that even minor<br>
      &gt;   barriers to piracy will stop most users from pirating.</p>
      <p>all the more reason to make yourself some customers.</p>
      <p>you gotta expect zero individuals will bother paying,<br>
      and write off any "piracy" they do as "good publicity".<br>
      use it as a selling point: "people love our fonts, see?"</p>
      <p>at the same time, very few _businesses_ would pirate,<br>
      even without d.r.m. of any sort, simply because such<br>
      an action would be dirt-simple to detect, and therefore<br>
      expose them to an obvious, direct, and immediate risk.</p>
      <p>&gt;   We know that some people are going to pirate regardless,</p>
      <p>and still more reason to make yourself some customers.</p>
      <p>&gt;   putting even strong DRM on web versions of fonts won’t stop that...</p>
      <p>it's so good to hear people say things that resonate to the real world.</p>
      <p>&gt;   meaning there’s no point to strong DRM on web fonts.<br>
      &gt;   But most piracy can be deterred by “DRM Extra Lite,”<br>
      &gt;   so that’s all that’s really needed.</p>
      <p>thomas, you were doing _so_ well, right up to this last little bit...</p>
      <p>this idea that "a little d.r.m." will "do the trick" is so pervasive<br>
      that it almost becomes persuasive, which is ludicrous because<br>
      it's so wrong wrong wrong.  d.r.m. is impossible, and it's just as<br>
      impossible to do "d.r.m. extra lite" as it is to do any d.r.m. at all.</p>
      <p>but somehow our minds fall for the trick that "a little d.r.m."<br>
      should be easy to accomplish, and -- since it would do _so_<br>
      much good, by keeping "honest people honest" -- that it's<br>
      a good path to pursue on a cost-benefit basis.  but it's not...</p>
      <p>it's _not_.</p>
      <p>because, just like a "little" d.r.m. is _impossible_ to accomplish,<br>
      it's also the case that a "little" d.r.m. doesn't do much deterring.</p>
      <p>it ends up that a flimsy lock is usually worse than no lock at all.<br>
      because anyone with any intention of breaking the lock will carry<br>
      a hammer big enough to smash it.  so the only people who get<br>
      "locked out" are the people who never carry around a hammer,<br>
      that is, the "honest" people, who you also know as "customers".</p>
      <p>and so, too, it is with "d.r.m. extra lite".  the _only_ people who<br>
      are adversely effected by it are customers, present and future...</p>
      <p>and those adverse effects often occur when your d.r.m. backfires;<br>
      it's _your_ fault it acts inappropriately, but your customer suffers.</p>
      <p>not only that, but the lock is a symbolic indicator to the customer<br>
      that you do not _trust_ them, and this rankles an honest person...</p>
      <p>ends up honest people don't need anything to "keep" them honest.<br>
      they just _are_.  the most you might need is a nice polite request...</p>
      <p>if i were you guys, i would do this.</p>
      <p>i would go to the browser people, and say "we want you guys to<br>
      use our fonts, so tell us how we can make it easy for you to do."<br>
      and then do what they say.  let them know that you are looking<br>
      to get paid, maybe relative to how often your fonts are used, and<br>
      work it out with them to make it happen to everyone's satisfaction,<br>
      and forget all this stuff about permission tables and d.r.m. stuff...<br>
      nobody needs it.  it doesn't deliver any benefits.  it just adds costs.</p>
      <p>otherwise, you're gonna spend a whole lot of time and energy to<br>
      build a cash-register, but no one is gonna walk into your store...</p>
      <p>in a phrase:  forget piracy and maximize sales instead.</p>
      <p>-bowerbird</p>
