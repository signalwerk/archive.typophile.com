      <p>WB wrote:</p>
      <p><cite>Count me confused. Thomas says that this has to be accepted by the W3C. David says no.</cite></p>
      <p>Well, let's put it this way. Putting it in the OpenType or TrueType spec doesn't *do* anything in and of itself. It needs to get respected by browser makers. Arguably that could happen without W3C approval, I suppose.</p>
      <p><cite>I confess I don’t understand how these proposals—Tal, David or Sampo—are supposed to work.</cite></p>
      <p>There is no distinct Tal proposal: he's backing Sampo's proposal.</p>
      <p><cite>1. Who has to do what? Is it Microsoft and Abobe that have to move on open type specifications? Who else?</cite></p>
      <p>Anybody who cares can have input to the OpenType / Open Font Format (OFF) spec. I'd suggest that somebody who cares get the OFF ad hoc group to examine both proposals and implement something for OpenType 1.7 / OFF</p>
      <p><cite>2. Once some kind of table is in existence, how is type put on the web, and who has to do more work to get it on the web?</cite></p>
      <p>Not defined. There are many different possibilities here.</p>
