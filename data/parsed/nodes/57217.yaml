      <p>The type industry already have over a decade's worth of evidence that "DRM Extra Lite" can work reasonably well, in the form of embedding bits for print usage. Some vendors don't allow such embedding, or allow it for view and print but not editable embedding. They set their fonts appropriately. Most users who run into restrictions due to the embedding bit settings don't hack their fonts to get around this, they just accept it. Would it be easy to hack the fonts? Sure. Do a large percentage of people do it? No. If they don't like the restrictions, they learn from the experience, and maybe they license different fonts.</p>
      <p>So, you're saying a nearly identical mechanism wouldn't work for the web, because...?</p>
