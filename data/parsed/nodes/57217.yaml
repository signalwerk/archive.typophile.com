      <p>I like what Tal is saying, but I don't think it really resolves the bigger issues. As stated, it really doesn't make it difficult to circumvent and, as such, doesn't really do much to actually protect the type designer via any technical method (which is par for the course in the world of DRM).</p>
      <p>I appreciate the want of the type industry to somehow manage how fonts are used on web sites. I don't have a solution, though. And I don't think DRM will ultimately be a solution either. </p>
      <p>It seems that the issue can be distilled down to the following:</p>
      <p>Type designers...<br>
       - don't want people freely copying their fonts<br>
       - (some) would like additional $$$ for use on web sites (and PDFs)</p>
      <p>Web designers...<br>
       - would like to use fonts they purchase online just as they do on paper<br>
       - don't want to deal with another layer of technology to get it to work (DRM)</p>
      <p>Ultimately I don't think there is a solution that will appease all of the above bullet points. So, there'll likely be some EULAs that favor the web designer and some that favor the type designer and we'll have to see where things end up in a few years.</p>
