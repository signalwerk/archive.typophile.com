      <p>Define "enforcement" first.  :)</p>
      <p>Browsers would need to respect the new info, for starters. But beyond that, dealing with hacked fonts, it would be no different than dealing with fonts stuck on web servers today. There could be several different ways of doing so, but most minor infringement will get ignored.</p>
