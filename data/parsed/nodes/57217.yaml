      <p>@dberlow</p>
      <p>David,<br>
      I am trying really hard to understand your proposal. So far, I see that you propose a permission table be added to a font, and that this font can be served on the web if:<br>
      - web use is permitted by the font license (and this permission is reflected in the permission table), and<br>
      - your licensee can then link the raw font to his web content.<br>
      Am I right?</p>
      <p>What I don't see is how this information will protect the font from being misused. What if million of copies of the font end up being installed on the machines that were used to access the website you licensed it to? How the permission table will prevent this? How will it protect your copyright owner rights if no application will ever be able to access the information in the permission table? And how is the permission table different from just encoding a link to the text of the EULA where all the rights granted by the license are spelled out in details (something that has been done for years)?</p>
      <p>David, you and I are in the same boat here, its not about my proposal vs your proposal. I am trying to find a way to enable web fonts and to protect font IP at the same time. It's not just about our IP, it is also about all those type designers who trust us to license their fonts and to pay them royalty for every copy of their fonts being distributed and to protect their IP rights.</p>
      <p>Regards,<br>
      Vlad</p>
