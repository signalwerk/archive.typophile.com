    html: |-
      <p>Thomas,</p>
      <p><cite>@Tal: "David is proposing changes for multiple font formats that are much larger in scope than what I’m proposing."</cite></p>
      <p><cite>How so? He doesn’t go into much detail, but his brief mention of adding a new set of embedding bits doesn’t seem "larger in scope" to me. Different, but not larger in scope than adding URLs and scrambling the beginning of the file. Arguably smaller in scope than Sampo’s proposal which you are backing.</cite></p>
      <p>From what I understand, David is proposing a new table to be added to the OpenType (and therefore OFF) and TrueType (does anyone even maintain the TTF specification anymore?) specifications. This table would be, and I'm guessing based on his vague statements here, similar to EEULAA. He is proposing that everything should immediately start honoring the bits in this new table.</p>
      <p>The only change to the OpenType specification that I'm proposing is a single addition of a bit to fsType in OS/2. That's a backwards compatible change that doesn't require any support from font managers, applications or OSes. The only things that would need to understand this bit would be browsers, theoretical web authoring tools that work with web fonts and, of course, new font editors. Those applications are in the early stages of developing web font support, so this won't require a big change. The second thing my proposal does is to offer support to Sampo's idea for a web specific font format. The differences between this format and the OpenType format (the root table and the first 100 bytes) would not be rolled back into the OpenType specification and this new format would require only changes from applications that are still in the early phases of supporting web fonts.</p>
      <p>My point is that the time that it will take to get a new table out of the concept stage and get it approved for inclusion in the OpenType specification will likely be longer than the lifespan of the working group that will decide the direction of web fonts.</p>
      <p>bowerbird,</p>
      <p><cite>is this about _respect_? or _cash_?<br>
      never mind, it’s a rhetorical question.</cite></p>
      <p>For me, it is about respect first. It's disheartening when I spend a year designing a typeface and then have someone explicitly or implicitly tell me, "I can do what I want with this and you can't do anything about it!" The "_cash_" part you mentioned only comes up when I need to pay my bills. If you seriously think that anyone becomes a professional type designer in order to get rich, you are quite mistaken.</p>
      <p><cite>there’s that "want to use" phrase again...</cite></p>
      <p>I'm sorry, but I don't want to engage in a philosophical discussion about conflicting human desires. That's above my pay grade.</p>
