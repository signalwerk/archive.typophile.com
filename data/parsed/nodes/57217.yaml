      <p>Re: hosted webfonts and bandwidth insanity</p>
      <p>Seems this is the biggest question: What happens when the hits go nuts and bandwidth skyrockets?? </p>
      <p>Seems like the foundry could offer a basic web license that would guarantee a certain amount of bandwidth (impressions) that would be adequate for 95% of websites. When you get to people like Amazon or Wikipedia, or any site really where bandwidth would be crushing, this is a different kind of client entirely. They have already solved their bandwidth issues. License them to use the fonts on their own servers for a higher fee.</p>
      <p>OR</p>
      <p>Somebody starts a company that services the foundries and builds a robust enough back end to handle it. We're talking small font files not video. The load wouldn't be THAT crazy.</p>
