    html: "<p>I have recently tried the demo for FontLab. I really like the cut-and-paste from Illustrator. Jim Harrison and I are of the same opinion about it's \"yucky interface\". But it seems to have a good community backing it. Which I am sure being a newbie I will need to take advantage of numerous times. While I usually get a bad vibe from bad UI judging from the demo I can deal with what I've seen. <br> <br>Mac OS is probably most near and dear to me. But not OSX yet. Most of my Mac contact is at my fulltime job. I have a really good XP system at home which is where I will probably do most of my development and design in Illustrator. And I like FL tool set much better than FOG. <br> <br>So I am leaning toward purchasing the PC FontLab for those reasons. But I will want to provide my type for both platforms. Thus my heavy interest in OpenType. <br> <br>Couple more questions: <br> <br>1) Is FL now more predominant than FOG in the Type Design community? <br> <br>2) Has anyone developed Mac fonts on a PC FL and experienced any problems?</p>"
