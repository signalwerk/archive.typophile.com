  html: <p>I have been designing some fonts and now I am getting ready to buy my building software. For ease of use and quick learning curve, should I go with FontLab or Fontographer? Is there another option out there? <br> <br>I would like to make OpenType versions of my fonts available which is why I leaning toward FontLab. All my type designs will be from Illustrator. From both the Mac and PC. <br> <br>Just looking for some suggestions/horror stories while I consider my purchase. <br> <br>And is there any advantage to building fonts on the Mac or PC? I use both at work and at home. Just want to decide which platform to buy the software for.</p>
