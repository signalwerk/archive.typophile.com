    html: <p>Depends on the nature of OpenType Font you like to build. Heavy feature code &amp; glyph rich OpenType Fonts are easier done with FontLab and cut &amp; paste works great with Illustrator. Since Fontographer developing is dead - its a good practice to use FL.  <br> <br>But if you have an old copy of Fontographer or get a chance to take a cheap one - it should work too. Even every other editor capable to build Type1 Fonts. Use the free Adobe OpenType FDK to build your OpenType Version. For a newbee it`s the hard way, but you will learn more. <br> <br> <br></p>
