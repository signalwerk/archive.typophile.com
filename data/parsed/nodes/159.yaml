    votes: null
    html: <p>I've always found FontLab far too much like hard work - just a yucky interface. If you have used FOG in the past, then probably you should stick with it. If you really are going to make OpenType fonts - then the only choice is FontLab, as fully integrated tool. <br> <br>As to platform, use what you feel more comfortable with. My recollection is that the advantage of MacOS is that it's more tolerant of loading and unloading fonts - so that they don't get cached (useful when trying to debug a font). But that may not apply any longer with later versions of Windows and MacOS X. <br> <br>Take a look at <a href="http://www.supportandmore.com" target="_blank">www.supportandmore.com</a> some info about FOG going forward.</p>
