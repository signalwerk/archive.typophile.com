    html: "<p>If you work on Windows, you can take advantage of two free tools from Microsoft: the Font Validator, which is very helpful at catching problems with fonts, and VOLT, which adds OT features to TT fonts.  VOLT can do a few things with OT that Fontlab and the Adobe FDK can't.  If you are planning fonts with large character sets (i.e., for multilingual use), be aware that current versions of Word can access only 256 characters in a T1 or CFF-flavored OT font.  I don't know if this has been fixed in the new version of Office that is currently available in beta.  Fontlab also has _much_ better Unicode support than Fog, which is important if you want to support languages other than English and other western European ones.  FL also includes the FontAudit feature, which can help you prevent problems.  It's been a long time since I used Fog but I don't recall anything similar. <br> <br>David</p>"
    html_clean: "<p>If you work on Windows, you can take advantage of two free tools from Microsoft: the Font Validator, which is very helpful at catching problems with fonts, and VOLT, which adds OT features to TT fonts.  VOLT can do a few things with OT that Fontlab and the Adobe FDK can't.  If you are planning fonts with large character sets (i.e., for multilingual use), be aware that current versions of Word can access only 256 characters in a T1 or CFF-flavored OT font.  I don't know if this has been fixed in the new version of Office that is currently available in beta.  Fontlab also has _much_ better Unicode support than Fog, which is important if you want to support languages other than English and other western European ones.  FL also includes the FontAudit feature, which can help you prevent problems.  It's been a long time since I used Fog but I don't recall anything similar. <br> <br>David</p>"
