    html: <p>Much of the opinions given on this subject here and elsewhere appear to focus on interface issues. It seems that those who are used to FOG find FLab an uphill struggle as they come to terms with a new interface and ways of working. <br> <br>I believe it to be primarily a case of people being comfortable with what they are used to - just as many of us will find alternatives to Photoshop bizarre to deal with, and indeed how PC users feel initially when they move to Mac (or the other way round of course). <br> <br>Thats not to say that FLabs interface does not need improvement, but it is hardly suprising that a package with so many more advanced technical features than FOG will suffer in comparison to its rival. The important thing to remember here is that FLab is a developing package and will get better. Can anyone claim this of FOG? <br> <br>Go with FLab, dont get intimidated by the interface, and invest in the future. There is little point learning FOG anymore. OpenType forever! <br></p>
