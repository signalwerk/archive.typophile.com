    votes: null
    html: <p>If you plan to use Mac OS X, <a href="http://www.font.to/cgibin/at.cgi?a=227536" target="_blank">FontLab</a> is the way to go as  <br><a href="http://www.macromedia.com/software/fontographer/" target="_blank">Fontographer</a> (FOG) for Mac works only with Mac OS 9. <br>(Not sure if FOG works with latest versions of Windows.) <br> <br>If you want to buy software from a developer committed to  <br>developing the app, go with FontLab. <br> <br>The new support offering from Support and More is  <br>promising, but it doesn't represent a commitment to  <br>enhancing the app itself. <br> <br>That said, Fontographer will be cheaper to acquire and  <br>there are lots of savvy, helpful users and good tutorials <br>around. <br> <br>But, if you're going to start out and learn something, <br>why not invest in learning something that has a more  <br>predictable future (i.e. FontLab)?</p>
