      <p>If I wanted to play devil's advocate I'd ask: Think about *why* you make these letters by hand and don't use an existing font – and then try to give them a unique quality, a concept of your own, that can't be found in similar fonts out there. What's your vision, what's the "feel" you want this to have? That should make formal decisions like "to round or not to round" easier.</p>
      <p>That said, I think this has been improving quite rapidly. Here are some comments (take with salt, I'm not the most experienced type designer on the planet… :o) )</p>
      <p>I think the "t" is still falling to the left (although the shape of the "c" helps it) – its foot feels rather unstable. The "g" is somewhat off-balance too.</p>
      <p>Look at how you terminate strokes: "r", "c", "t", and "g" are all cut at different angles. Might be distracting.</p>
      <p>Oh and, I think the dot on the "i" is too small, unless you're shooting for a deliberately postmodern look.</p>
      <p>There are some curve details that look potentially problematic, but are hard to tell for sure without having a PDF: Things like the maybe slightly wonky stem-to-curve transition in the "r", or the join in the "d" that might want some thinning. </p>
      <p>Also overall, look at your overshoots both on the x-line and the baseline (making the curved characters slightly reach over/under the lines: as it is now, the "r" looks shorter than the "i" at least to my eye – but it might just be a rasterization issue).</p>
