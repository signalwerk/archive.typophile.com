      <p>good designer--i think i am. but a strong typographer? probably not so much. plus, i'm not so great with terminology (something i really need to fix). however, allow me a more intuitive response:</p>
      <p>my feeling is that the logotype suffers from stressing the angle of each letter in too many directions.</p>
      <p>to me, the r &amp; e seem as if they're stressed to the right. yet, the c and t lean towards the opposite direction. And finally, the counterspace on the d calls too much attention to itself for being too different.</p>
      <p>what bothers me about the letterforms sloping one way or the other is that having them do both is contrary to the name itself--a directed edge should have letterforms that all feel like they're going in the same direction.</p>
      <p>-evan</p>
