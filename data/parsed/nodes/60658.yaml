      <p>David, what I meant about the dot of the "i" is in this case simply a question of optical balance – it looks like it's the same width as the stem mathematically, so it looks smaller optically – which seems strange in an otherwise monoline treatment.</p>
      <p>I think this is much improved otherwise! The slight rounding seems quite nice.<br>
      Agree the shorter descender is better; have you tried not making the "t" full-height?<br>
      And I'm beginning to wonder about the "e", if it really needs *that* much contrast. I think the bolder parts of it might actually be a smidgeon too heavy, compared with other glyphs. You might try to balance it out a bit more… Try squinting: The "e"s jump out a bit now. Or maybe I need more coffee. :-)</p>
