      <p>If you are working directly in Photoshop (as opposed to creating in a vector program and importing it), there will be an option in the character pallette that has 2 a's with a button next to it which says either none, sharp, crisp, strong or smooth, with your type selected you can change that option, the difference will be most noticeable if you are viewing at 100% (The 2 a’s pallette also appears in the top bar when in the type tool).</p>
      <p>Tim</p>
