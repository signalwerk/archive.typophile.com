      <p>Reminds me a bit of <a class="freelinking external" href="http://typophile.com/node/108315" rel="nofollow">this previous case</a>. Anyway, can't identify it either. If I have to recreate it, I'd probably start with <a class="freelinking external" href="http://www.myfonts.com/fonts/fort-foundry/industry" rel="nofollow">Industry</a> Black, <a class="freelinking external" href="http://www.myfonts.com/fonts/suitcase/purista" rel="nofollow">Purista</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/oxide-pro" rel="nofollow">Oxide</a> mainly because of closer x-width and even if it means more work to do: recreating /A (upside-down /U) and /Y (/U bottom half + vertical stroke), chopping off some terminals from /S (+ making spine horizontal or completely redrawing it starting a /O quarter) and /G (+ double sided crossbar).<br>
      Adding some more alternatives to the list: <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/refrigerator-deluxe" rel="nofollow">Refrigerator Deluxe</a> (playing with alternates like /<a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/refrigerator-deluxe/heavy/glyphs.html#glyphs/655805/33" rel="nofollow">A</a>, /<a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/refrigerator-deluxe/heavy/glyphs.html#glyphs/655805/94" rel="nofollow">G</a>, /<a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/refrigerator-deluxe/heavy/glyphs.html#glyphs/655805/189" rel="nofollow">S</a>, /<a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/refrigerator-deluxe/heavy/glyphs.html#glyphs/655805/229" rel="nofollow">Y</a>), <a class="freelinking external" href="http://www.antreposhop.com/product/public-gothic-font-family" rel="nofollow">Public Gothic</a>, <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/unionthug.php" rel="nofollow">Union Thug</a>, <a class="freelinking external" href="http://www.losttype.com/font/?name=outage" rel="nofollow">Outage</a> and <a class="freelinking external" href="http://losttype.com/font/?name=onramp" rel="nofollow">Onramp</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typerepublic/mecano" rel="nofollow">Mecano</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/insigne/quarca" rel="nofollow">Quarca</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/home-room" rel="nofollow">Home Room</a></p>
