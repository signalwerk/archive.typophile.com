    html: <p>Thanks, Ryuk! Industry has been at the top of my list since my search started, but you found a bunch of others that I didn't see before... Outage, Onramp, and Refrigerator are really good. A few of the ones you mentioned have a wider selection of glyphs with the rounded A and non-slabbed? S. Thanks, Don! Not just the weight, but the kerning looks better on Industry, which would save a ton of time. If I can't find the exact font, I'll probably end up needing to use two different ones to achieve the look I want. Still looking, but this helps a lot for Plan B! Still hoping to hear back from Aaron, but think he would've responded by now.</p>
