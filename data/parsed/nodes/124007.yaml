      <p>The most peculiar character is the |G|, most unusual in a style which tends to enclose all letter in a boxy shape.<br>
      One of its inspirations could be the lettering of the old WPA posters. See, as references:<br>
      <a href="http://fontstruct.com/fontstructions/show/wpa_gothic" title="http://fontstruct.com/fontstructions/show/wpa_gothic">http://fontstruct.com/fontstructions/show/wpa_gothic</a><br>
      <a href="http://fontstruct.com/fontstructions/show/wpa_gothic_deco" title="http://fontstruct.com/fontstructions/show/wpa_gothic_deco">http://fontstruct.com/fontstructions/show/wpa_gothic_deco</a></p>
