  - id: 601435
    user: 205259
    date: 2015-03-23T13:46:00
    date_raw: 23 Mar 2015 — 1:46pm
    votes: null
    html: |-
      <div class="comment-spam-body"><p>I forgot to mention that this style is sometimes called gas-pipe. The link posted by Riccardo reminded me of this.<br>
      As for the letters in the image this could be lettering rather than a font as such. It would not be out of place as a US WPA poster from the 1930s. Also note from the Chank Diesel interview that this style was popular among signmakers because it was so easy to execute. I recall seeing many such signs in my rambles across North America years ago that had these general features. Most of these are now gone, replaced by chain brands of little artistic character.<br>
      IMO Liquorstore is a good choice for a substitute.<br>
      Don</p>
      </div>
