      <p>Yup... Michael Clark did our logo. A pleasure to work with I might add. I think I basically said "I want something that looks like this (Underware's logo) and this (Veer's logo)". Sometimes it's not necessary to reinvent the wheel when someone has already figured out how to make it turn.</p>
