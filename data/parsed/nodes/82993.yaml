    html: <p>There are some clear differences between the two, and in many cases I'm not sure I don't prefer Apolonia's treatment, so I certainly wouldn't simply dismiss it as a copy.  To what extent inspiration was drawn from Laudatio I'm not sure, nor am I familiar with the particular university's precise requirements around original work in a PhD, but I certainly see it as a different design with merit which goes beyond Laudatio.</p>
