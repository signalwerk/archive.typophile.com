    <p>Hi,<br>
    I have found a very interesting case which might be interesting.<br>
    There is a free font which is based I gues on one of Berthold's fonts. One of graphic designers from Poland is claiming to design a new typeface as his Ph. D. thesis.<a class="freelinking external" href="http://translate.google.pl/translate?js=n&amp;prev=_t&amp;hl=pl&amp;ie=UTF-8&amp;layout=2&amp;eotf=1&amp;sl=pl&amp;tl=en&amp;u=http%3A%2F%2Fwww.polskalitera.pl%2F&amp;act=url" rel="nofollow">http://translate.google.pl/translate?js=n&amp;prev=_t&amp;hl=pl&amp;ie=UTF-8&amp;layout=2&amp;eotf=1&amp;sl=pl&amp;tl=en&amp;u=http%3A%2F%2Fwww.polskalitera.pl%2F&amp;act=url</a><br>
    Looking at the project closely it seems to be a modified copy of Berthold's font  - Laudatio BQ Light designed by Friedrich Poppl.</p>
    <p>There is a big discussion on Polish graphic designes blog. <a class="freelinking external" href="http://translate.google.pl/translate?js=n&amp;prev=_t&amp;hl=pl&amp;ie=UTF-8&amp;layout=2&amp;eotf=1&amp;sl=pl&amp;tl=en&amp;u=http%3A%2F%2Fstgu.pl%2F2011%2F05%2Fapolonia-czy-arogancja%2F&amp;act=url" rel="nofollow">http://translate.google.pl/translate?js=n&amp;prev=_t&amp;hl=pl&amp;ie=UTF-8&amp;layout=2&amp;eotf=1&amp;sl=pl&amp;tl=en&amp;u=http%3A%2F%2Fstgu.pl%2F2011%2F05%2Fapolonia-czy-arogancja%2F&amp;act=url</a><br>
    Is it original or a copy? What is your opinion?</p>
