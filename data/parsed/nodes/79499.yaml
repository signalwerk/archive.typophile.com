      <p>Font EULAs frequently do not allow format conversion, but as said above the .TTF and .OTF fonts are cross-platform on modern systems. </p>
      <p>FontForge can read nearly all font formats, including some of the strange ones the Mac system fonts come in (I think it requires BinHexing the resource-fork TrueType fonts, I'd have to read through the manual again to be sure) and generate new fonts in other formats. Some special features might get munged in the process, though. Like I said, most font EULAs do not allow this, and many expressly forbid it. Contact the foundry for further information if you're not sure in any particular case.</p>
