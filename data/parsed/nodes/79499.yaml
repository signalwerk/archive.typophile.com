    <p>Hi,</p>
    <p>I have been a longtime user of Linotype's Font Explorer X on the Mac. I have bought a new Windows 7 (x64) PC and see that there is no current version of Font Explorer X for Windows. I am looking for a comparable replacement. I would like the software to have the ability to activate/deactivate fonts and some Adobe CS5 integration as I use CS5 a lot in my work. Can anyone make any recommendations?</p>
    <p>Also on a side note, How do I transfer my existing font library to Windows, I know there has to be some sort of conversion any help would be great.</p>
    <p>Thanks</p>
