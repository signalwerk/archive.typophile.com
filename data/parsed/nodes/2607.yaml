    html: <p>1985 - Slightly younger than most of the mix tapes I made in high school. <br> <br>Mark, I had almost completely obliterated the last remaining evidence of ReadySetGo! from my brain. Thanks a lot. The really weird thing? ReadySetGo! is still developed and supported. <br> <br><a href="http://www.diwan.com/ready/prsg.htm" target="_blank">http://www.diwan.com/ready/prsg.htm</a> <br> <br>And speaking of Quark, my first experience with a Quark application was using WordJuggler on my then girlfriend's Apple IIe, in all its 80-column, green phosphor glory. If you think a CompuGraphic 7200 had arcane keyboard commands for text formatting, then you never used WordJuggler.</p>
