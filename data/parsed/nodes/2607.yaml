    html: "<p>I was a PageMaker user from the earliest Mac version. I tried using version 1.0 to do pages for the <i>Utne Reader</i>. I was obviously crazy. Version 1.x actually stored documents as Mac resource files, a really inadvisable idea, as it turned out. It lead to very fragile document files. I was constantly losing work. Aldus wisely abandoned that approach in 2.0. (Also, it wouldn't have worked on Windows if they hadn't.) <br> <br>Some things I remember about PageMaker 1.0: <br>- No kerning or tracking <br>- No auto-hyphenation <br>- You couldn't resize text blocks except by changing the column guidelines and reflowing them <br>- You couldn't work in spreads (you could preview them, though) <br>- 16 pages maximum <br>- No spell-checking <br>- Auto-leading only <br>- No font menu (only a dialog box) <br>- No left and right justified text <br>- No style sheets <br>- You had to insert your \"key disk\" in order to run it <br>- It was about ten times better than MacPublisher or ReadySetGo! <br> <br>I got Quark 1.0 as soon as it was released. On paper it ran circles around PageMaker. It seemed like a dream come true: kerning, auto-hyphenation, run-arounds. In fact, it was a buggy nightmare. My analogy at the time was that PageMaker was a dull but reliable sedan, and Quark was a temperamental sports car that was in the shop most of the time.  <br> <br>I ended up switching back to PageMaker for most stuff until Quark 3.0, which finally lived up to its promises and overtook PageMaker as the professional choice.</p>"
    html_clean: "<p>I was a PageMaker user from the earliest Mac version. I tried using version 1.0 to do pages for the <i>Utne Reader</i>. I was obviously crazy. Version 1.x actually stored documents as Mac resource files, a really inadvisable idea, as it turned out. It lead to very fragile document files. I was constantly losing work. Aldus wisely abandoned that approach in 2.0. (Also, it wouldn't have worked on Windows if they hadn't.) <br> <br>Some things I remember about PageMaker 1.0: <br>- No kerning or tracking <br>- No auto-hyphenation <br>- You couldn't resize text blocks except by changing the column guidelines and reflowing them <br>- You couldn't work in spreads (you could preview them, though) <br>- 16 pages maximum <br>- No spell-checking <br>- Auto-leading only <br>- No font menu (only a dialog box) <br>- No left and right justified text <br>- No style sheets <br>- You had to insert your \"key disk\" in order to run it <br>- It was about ten times better than MacPublisher or ReadySetGo! <br> <br>I got Quark 1.0 as soon as it was released. On paper it ran circles around PageMaker. It seemed like a dream come true: kerning, auto-hyphenation, run-arounds. In fact, it was a buggy nightmare. My analogy at the time was that PageMaker was a dull but reliable sedan, and Quark was a temperamental sports car that was in the shop most of the time.  <br> <br>I ended up switching back to PageMaker for most stuff until Quark 3.0, which finally lived up to its promises and overtook PageMaker as the professional choice.</p>"
