    html: <p>It was released in July 1985. At that time, it was the first program that would not run on the original 128k Mac. You needed the 512k model and two disk drives because the program took up 275k--most of a 400k floppy--leaving little room for system files and fonts. You needed the other drive for your document files.  <br> <br>Hard drives were not really an option on those early Mac models. (There were a few in the 5-10MB range starting at about $2000.) Things got better by 1986 when 800k floppies and more affordable hard drives started becoming available.  <br> <br>Looking back, all that stuff was incredibly expensive compared to today, especially when you take inflation into account. I think I spent $1400 on 2MB of RAM in about 1987. That would be like paying about $2400 for 1GB, about the relative equivalent amount of RAM nowadays.</p>
