    <p>Hi there,</p>
    <p>I'm creating a series of posters incorporating examples of famous or well designed typeface samples/promotion/teasers (not sure what the correct term is). For example, </p>
    <p>Helvetica: </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/helv_6512.png"></div><p></p>
    <p>Avant Garde (I realise this wasn't designed to purely show off the typeface, but it still fits my idea):</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/avant_4406.png"></div><p></p>
    <p>Black Slabbath:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/slabbath_5384.png"></div><p></p>
    <p>It's for a student project - promoting a typography exhibition. There will be classic type exhibits as well as events launching new faces etc. The samples will be used in a similar theme to this (still work in progress):</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fdg_4057.png"></div><p></p>
    <p>Any other examples of good design specifically to show off a typeface (particularly for serifs) would be very helpful.</p>
