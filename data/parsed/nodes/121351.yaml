    <p>It's a common question to ask what your favorite typeface is but I usually get stuck because there are so many typefaces that are amazing in different ways, it's difficult to select any and exclude others. I have an extensive collection of pictures of typefaces on my computer so I know what's around generally speaking. However, at least once a year a typeface is released that's so clever and so well done it makes me realize there is a lot more to do in type design besides emulating old classics.</p>
    <p>So now I want to ask you if you could name typefaces that are absolutely impressive to you when it comes to the design from an aesthetic and technical point of view. This time I'm not interested in hearing what typefaces work best for you or which have the most features or best spacing or whatever. This time I'm mostly curious in the quality of the use of lines.</p>
    <p>So in short, which typefaces are you most impressed by when functionality and application are not considered?</p>
  html_clean: |-
    <p>It's a common question to ask what your favorite typeface is but I usually get stuck because there are so many typefaces that are amazing in different ways, it's difficult to select any and exclude others. I have an extensive collection of pictures of typefaces on my computer so I know what's around generally speaking. However, at least once a year a typeface is released that's so clever and so well done it makes me realize there is a lot more to do in type design besides emulating old classics.</p>
    <p>So now I want to ask you if you could name typefaces that are absolutely impressive to you when it comes to the design from an aesthetic and technical point of view. This time I'm not interested in hearing what typefaces work best for you or which have the most features or best spacing or whatever. This time I'm mostly curious in the quality of the use of lines.</p>
    <p>So in short, which typefaces are you most impressed by when functionality and application are not considered?</p>
