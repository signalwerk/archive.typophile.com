    html: |-
      <blockquote><p>I suspect we all think that way, which is why I asked to leave practicality and application out of the consideration. I think you're somewhat evading the question.</p></blockquote>
      <p>You asked us to name impressively designed typefaces while only considering aesthetics and technical proficiency. My short answer is that I have none. My longer answer is that I have none because it would be similar to saying that I was impressed by the design of a car without considering whether or not it even ran.</p>
      <p>Maybe your question was less about design and more about judging form in the absence of function. Even then, though, I don't think it's really possible to judge only form and technique in typography without viewing it through the lens of whether or not it actually functions as such. Function is part and parcel to what typography is, and without considering function we're really just judging the degree to which purposeless shapes tickle our fancy.</p>
