      <p>I'm sorry if my views on this are frustrating, but they are what they are.</p>
      <p>Let me respond from another direction. I'm so familiar with Western typography that I find it impossible to divorce its form from its function. I automatically see familiar letters and not simply aesthetically pleasing shapes. If the letter doesn't fit within the sideboards of typical convention for that letter, it influences my opinion, even though it might be a very nice shape and work well with the shapes around it.</p>
      <p>On the other hand, I'm not especially familiar with southern Asian typography. I really don't know what the glyphs are or what they're supposed to look like. Instead, I just see positive and negative shapes, rhythms, balances, proportions and the other various elements of design and composition. In other words, the glyphs don't pass through my filter of biases and expectations that have built up over a lifetime of exposure to Western typography.</p>
      <p>With that in mind, I find the following aesthetically impressive, but I haven't a clue whether or not it's part of a well-designed typeface.</p>
      <p><img src="http://sanpitch.com/junk/bengal1.png"></p>
