      <div class="comment-spam-body"><blockquote><p>My longer answer is that I have none because it would be similar to saying that I was impressed by the design of a car without considering whether or not it even ran.</p></blockquote>
      <p>Yes, and I don't accept that as an answer to my question because I'm asking you to disregard the notion whether it ran. Certainly you can say something about just the aesthetic design of a car, without knowing if it is a functional car at all. Does a car stop being a car when it doesn't move? It stops being a functional car, but you can still say something about the perceived beauty.</p>
      <blockquote><p>Function is part and parcel to what typography is, and without considering function we're really just judging the degree to which purposeless shapes tickle our fancy.</p></blockquote>
      <p>Not at all [regarding the second part of your statement]. We're still viewing the typefaces as type designers. As such we can be impressed by the way a type designer handled the line work and structure, without making a consideration of its application and function. Beauty can be viewed independently.</p>
      <p>Besides, what purposeless shapes? I said nothing about typefaces without function. I'm saying this time I don't want to hear which typefaces are being selected most often because the considerations to use a specific typeface could be many which are not necessarily linked to its quality. This time I want to hear which typefaces impress you most in terms of quality and originality. That would for example lead me to name a typeface like Trinité, even though I never actually used it. In fact, I may not necessarily find the typeface to be aesthetically beautiful (though I do), but the typeface sure does impress me due to the subtle details the typeface features. That latter bit is essentially what I'm asking. I'm not asking what you find most beautiful, but what has impressed you the most. I feel like you're saying typefaces can't impress you until you see how it's used. I find that to be a nonsensical statement.</p>
      <p>If I were to turn my question around I would understand your answer, because if I were to ask which typefaces you find most impressive from a functional point of view, then you should also make a consideration of its application and how the functionality relates to that. There is certainly a relation between aesthetics and application as well, but we can simply see typefaces as objects of beauty and disregarding application for a moment.</p>
      <p>Are you saying there is nothing to be said about the quality of lines if the typeface isn't functional? Are you implying you couldn't give criticism to a starting type designer's work until he made it into an actual font, or could you tell him his design is bad before it's a working typeface or even before knowing what the target application is? The target application is an extra consideration to rate the quality and functionality of a typeface, but it's certainly not a requirement to say anything about the aesthetics of a typeface at all.</p>
      <p>Also, I'm not asking what typefaces you consider to be most beautiful (although equally, I don't see how you can't say anything about a typeface's beauty) but which typefaces you find technically most impressive when looking at the flow of lines. How does its application relate to what I'm asking in any way? I feel you're stuck in the consideration of what a typeface should be,  but that's not what I'm asking.</p>
      <blockquote><p>You asked us to name impressively designed typefaces while only considering aesthetics and technical proficiency. My short answer is that I have none.</p></blockquote>
      <p>How could I ask my question in such a way that it becomes a question you have an answer to?</p>
      </div>
