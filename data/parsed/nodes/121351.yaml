      <p>Martin Silvertant wrote: <em>"So in short, which typefaces are you most impressed by when functionality and application are not considered?"</em></p>
      <p>It's difficult for me to look at typography that way. Judging a typeface without considering the context of how it might be used seems a bit like judging an automobile without considering how well it runs. In other words, if it has trouble getting me from point A to point B, it's not especially impressive — despite whatever aesthetic beauty it might have.</p>
      <p>There's certainly a place in the world for art existing simply for the sake of art, but I have trouble looking at typography that way. Aesthetics play a big part in good type, but it's a supporting role that aids type's real purpose, which is helping to communicate a message.</p>
    html_clean: |-
