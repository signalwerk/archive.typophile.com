      <blockquote><p>There's certainly a place in the world for art existing simply for the sake of art, but I have trouble looking at typography that way.</p></blockquote>
      <p>I suspect we all think that way, which is why I asked to leave practicality and application out of the consideration. I think you're somewhat evading the question.</p>
      <p>What I'm looking for are typefaces that inspire me as a type designer. Typefaces that are so well executed I wish I would have designed them. Typefaces that feature a highly sophisticated use of line and structure. Typefaces that set a new standard in quality. Certainly you've seen typefaces like that. I don't think you need to consider application necessarily to just appreciate a typeface from a technical and aesthetic point of view. This is not the usual "name your favorite typefaces", as one might ask to a graphic designer, but really "what typefaces thoroughly impress you as a type designer?". As a graphic designer we have to consider application, but I'm sure the type designers among us have many inspirations and admiration.</p>
