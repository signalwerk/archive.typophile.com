    html: '<p>Hrant: Interesting. <br><br>I am working on compiling a complete list of the typfecase included with Mac <span class="caps">OS</span> X. So far, I’ve investigated 10.0, 10.1 and 10.2. I’ve still got Panther to go. <br><br>What’s curious, is that I haven’t bumped into “Chalkboard” yet. Comic Sans <span class="caps">MS</span>, however, is still included. <br><br>I remember when I beta-tested Panther, that the <span class="caps">MS</span> web fonts were not installed when once chose to disable Internet Explorer in the installation. Perhaps they included Chalkboard instead, then…If it’s there, I’ll ﬁnd it… <br><br>What do you mean by “mass-oﬀerings” of fonts, by the way? I think most of the fonts included with <span class="caps">OS</span> X are of exceptionally high quality, and licensed from respected vendors such as Zapﬁno and Optima from Linotype. And Apple’s own <span class="caps">AAT</span> fonts, such as Apple Chancery are pretty nice too, aren’t they? <br><br>Speaking of Comic Sans <span class="caps">MS</span>…Apple Casual is sort of similar in its style. What is your opinion on that typeface? (Sample below, and in the article). It is only used by Inkwell. <br><br><img src="http://www.typophile.com/forums/messages/30/52272.png" alt="Apple Casual sample"></p>'
