    html: '<p>&lt;font class=”dontLookLikeCrap”&gt;Actually, I wrote about 90% of it, over the course of a month or so. I’m really happy you like it! It’s been well-received all over the typography web, it seems. <br><br>It still has some incomplete sections, but it is rapidly approaching the suggested maximum length of Wikipedia articles. I plan to complete the remaining bits and apply to have it featured on Wikipedia’s ﬁrst page (nominate it to become a so-called “featured article”). <br><br>It has really awakened my interest in typography. I’m by no means an expert, but I’ve made sure all my claims are carefully supported in the references section. Naturally any professional input that you people can add is _greatly_ appreciated. Also, consider helping me identify the font used in Apple’s forgotten and ancient logo on the font identiﬁcation board: <br><br><a href="http://www.typophile.com/forums/messages/83/52251.html?1098964709" target="_blank">http://www.typophile.com/forums/messages/83/52251.html?1098964709</a> (I tried posting <span class="caps">HTML</span>, but the <span class="caps">URL</span> still&nbsp;showed…Sorry.)&lt;/font&gt;</p>'
