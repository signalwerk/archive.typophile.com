      <p><em>Style cannot obliviate technique.</em></p>
      <p>Style is part of that to which technique is applied, and hence the <em>results</em> of the techniques will differ according to style, which is what Nick's spacing comparison of Times and Perpetua demonstrates. Within each family, the techniques of optical sizing and spacing have parallel progression, but the results compared across typefaces differ because the style -- the characteristics of their forms -- enables them to differ.</p>
