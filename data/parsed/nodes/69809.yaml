      <p>&gt;6–24 pt? The extremes of the range might be okay, because 24pt is into display size and the ruggedness of an enlarged 6pt type might be considered a stylistic feature. [I'm reminded of Luc's description of the ‘punkish radiance’ of monospaced coding fonts used at display sizes.] It's at the intermediate text sizes that things will fall apart badly.&lt;</p>
      <p>What you say is at odds with the direction the type design industry has taken since phototype. The primnary design goal of 99.9% of all phototype (and digital) text masters is to produce a text face that is acceptable (not funky) at 6 and 24 points, and optimal at either 12 points (Lino and nearly everyone else) or 9 points (much of Berthold photo and digital type). Over forty years, the industry has been quite successful in that the results have been embraced by nearly every publisher. Every major foundry effort to sell size-specific masters to the printing industry has failed. All of this occurs at the cost of absolute quality. As you are discovering, </p>
      <p>&gt;I'm designing a text face that needs to work well at two specific sizes: 9 and 11 cicero points (slightly larger than postscript points), within known inking tolerances on known paper stocks, and with as many press tests as I want. It's just about the ideal condition in which to be designing a typeface, but that two-point spread of sizes has a massive impact on the x-height and stem weight requirements. [Spacing is less of a concern, because the smaller size can be tracked slightly if necessary.]</p>
      <p>optimum design even between 9 and 11 points requires radical tinkering, and few publishers today are interested. As you get deeper into the project, I'm afraid you'll see that spacing will be more of a concern than you now think it is. Tracking in the end never works because it applies the same value, in proportion, to each sidebearing. What you will find is that each class of letter (o, straight, various others, and same for caps) will require a quite different amount of correction. Most publishers simply gloss over such fine points, but where specific typeface designs are being made, so, also, should specific spacing be made. Dave Farey once asked Matthew Carter at what point in the typeface production he does spacing. Carter's correct reply was, 'When I'm designing the letter.'</p>
