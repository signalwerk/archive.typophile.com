      <p>&gt;Tracy's 60% rule. Is this based on historical evidence, empirical data, academic studies etc.?</p>
      <p>A lot of classical book typefaces are around this ratio, but they do vary by optical size—which in those metal foundry days was the same as size, period.</p>
      <p>I expect David would say that the x-height should be suited to the intended use, and therefore should vary according to the brief. That would be my view too, except that for ideal reading comfort, period, I like Tracy's rule. When you cram more type on the page than is ideal, then the x-height needs to grow, in text size. On display type, I don't think there are any general rules, as it depends on the overall design of the page. On this issue, I admit it's hard for me to disentangle the aesthetic and readability sides of the question.</p>
