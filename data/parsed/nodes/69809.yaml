      <p>Bill: <em>...for a digital typeface that should look acceptable at anywhere from 6 to 24 points, that pretty well implies a reasonably high x-height, because otherwise the small point sizes won't look at all good.</em></p>
      <p>6–24 pt? The extremes of the range might be okay, because 24pt is into display size and the ruggedness of an enlarged 6pt type might be considered a stylistic feature. [I'm reminded of Luc's description of the ‘punkish radiance’ of monospaced coding fonts used at display sizes.] It's at the intermediate text sizes that things will fall apart badly.</p>
      <p>I'm designing a text face that needs to work well at two specific sizes: 9 and 11 cicero points (slightly larger than postscript points), within known inking tolerances on known paper stocks, and with as many press tests as I want. It's just about the ideal condition in which to be designing a typeface, but that two-point spread of sizes has a massive impact on the x-height and stem weight requirements. [Spacing is less of a concern, because the smaller size can be tracked slightly if necessary.]</p>
