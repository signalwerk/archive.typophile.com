    html: <p>Yes. I would imagine that 'Text' is intended for relatively small text. And I remember that Robert admired the metal era use of Times by the Encylopaedia Britannica. And who knows? Maybe the x-height will change on the optical axis? I belong to the Mono metal school of thought, which suggests that x-height increases as size of the design gets smaller. But there is the postwar Lino theory that display faces should have very high x-height and that small text faces need a low x-height -- handily illustrated by the Palatino/Aldus/etc. group of fonts. I've never known what to make of that. Perhaps it was Zapf's influence?</p>
