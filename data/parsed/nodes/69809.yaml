      <p>On readability and the x-height, I think this is a very difficult issue to pronounce on, because reading comfort of a text block is influenced so much by type size, measure, and leading. I do think that in book type settings, with wide measures, short ascenders are sub-optimal. But in short measured, tightly leaded columns common in newspapers and magazines shorter ascenders seem to work all right. But you could also argue that these settings are sub-optimal for the sake of economy. </p>
      <p>The most insightful comment on this I have read on this is Walter Tracy's. He wrote that "for my own taste, if x to h is a proportion of about 6 to 10, a face will look refined and be pleasant to read. If the x-height is much less than that, the face may be stylish, but will be unsuitable for long text. A larger x-height is conducive to dullness." (Letters of Credit, p. 51) </p>
      <p>I think that current fashion for large x-height is often overdone. For optimal setting, large x-height may not really gain you anything, as you end up needing more leading for a given point size. But the need for leading also is influenced by how dark the type is, so I don't know of any hard and fast rules on this.</p>
      <p>By the way, the Irish didn't invent word spaces, but at best revived them or introduced them into Latin. They are in the dead sea scrolls, many centuries before.</p>
