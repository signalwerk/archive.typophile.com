      <p>&gt;X-height is a very loaded subject. One reason is that sociological factors are seldom absent from the discussion.</p>
      <p>Bill, I think that your comments were both insightful and correct. It seems to me though that part of this argument can be traced to conceptual differences, viz. what the typographer envisions when they are thinking of <em>extended text</em>. It wouldn't surprise me if most of the resistance to the notion of high x-height emanates from typographers who think of text primarily in terms of books. Walter Tracy was certainly thinking of books when he made his comment about preference. Nonetheless, most printed matter today are not books, and Tracy's 6 to 10 proportions may very well backfire (readability wise) if they are applied into a column setting.</p>
      <p>We do after all already apply, implicitly or explicitly, one set of typographical heuristics for book setting, and another for say magazine work. Therefore, perhaps some of these typographic "common sense" rules/slogans should be rephrased accordingly. Thus, let us not say that a "large x-heights is not conducive to the readability of extended text" but rather "large x-height may reduce the readability of text in a book setting."</p>
      <p>A great deal of disagreement would dissipate if we increase the contextual and semantic precision of our intentions, otherwise we may be arguing about apples and oranges. </p>
      <p>I hope this makes sense.</p>
