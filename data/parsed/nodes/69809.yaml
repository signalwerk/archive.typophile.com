      <p>Kent, I'm afraid I did mean metal Caledonia - - shocking as the confession may seem! When I say I like 60%, what I really mean is that I like 62 or a little higher. Could just that little bit extra of height in Caledonia be what is upsetting me? I'm not saying there's anything the matter with it, I'm just saying that for me, it is no longer comfortable to read Caledonia, or some of the other generously proportioned Linotype faces. I don't have the problem with Monotype metal; not even with Bembo. What I'm finding is that I'm just not comfortable with some of the Lino metal ascenders, in a way that I would not have been aware of even 5 or 10 years ago. Speaking of Lino ascenders, Charles Ellertson had the very generous idea of producing a public source Janson, and I have been doing a little clean digitization for him as I can. One thing I noticed when looking at various cuts is that Lino Janson PS descenders are slightly higher (by about 1.5%) than Lino Janson metal. I found this additional ascender height very annoying. Kent, it's difficult to write this is it goes against everything we learn and respect, but it is the way I feel now.</p>
      <p>Another factor: as a general rule, for a digital typeface that should look acceptable at anywhere from 6 to 24 points, that pretty well implies a reasonably high x-height, because otherwise the small point sizes won't look at all good. I'm not saying that's a good thing, of course: nobody believes in size-specific type as much as I do.</p>
