      <p>Bill, I think the relative proportions of Palatino to Aldus have more to do with fashions in display typography than what was ‘thought best for larger sizes’.</p>
      <p>The steps necessary to achieve optimal readability at various smaller sizes are to a large extent determined by optics and output medium. At display sizes, what one does is more a matter of style. The lighter, smaller x-height display types to which are refer are a particular, elegant or classical style of display typography. Palatino is something more rugged and when used as intended -- not least in Zapf's own books -- always manages to evoke the 1950s for me. And then, of course, there are Koch's display types, which demolish any notion of linear relationship of proportions across increasing sizes.</p>
    html_clean: |-
      <p>Bill, I think the relative proportions of Palatino to Aldus have more to do with fashions in display typography than what was ‘thought best for larger sizes’.</p>
