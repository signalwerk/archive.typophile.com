    <p>I noticed that the Adobe Typblography, has announced the new font bundling scheme for CS5.</p>
    <p>The details are available here:</p>
    <p><a class="freelinking external" href="http://blogs.adobe.com/typblography/2010/04/useful_details.html" rel="nofollow">http://blogs.adobe.com/typblography/2010/04/useful_details.html</a></p>
    <p>It appears though that there is a new Robert Slimbach font that Adobe intends to release (as a registration incentive), called Adobe Text.</p>
    <p>Does anyone have any additional information available regarding this particular family. From the little information available on the Adobe type blog, it would appear to support Latin, Greek, and Cyrillic, and I assume that it would contain the full Adobe range of optical sizes. Nonetheless, it would be nice to have someone (possibly from the Adobe team) provide us with some insights into what else we may expect.</p>
