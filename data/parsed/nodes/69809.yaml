      <p>Hrant, you come out against the so-called "we read best what we read most" mantra, yet that mantra is fully consistent with the way our brain and mind functions and perceives. We <em>always</em> perceive best what we perceive most. Our brains are designed to operate in certain environments and to adapt to the specific features that may be unique to that environment. If I take a subject and force them to view the world up-side-down (through the use of a binocular device that flips the incoming signal), such a subject would, after a while, become fully adapted to the new image of the world and will literally come to see the world correctly. Similar effects have been demonstrated for other senses too, such as hearing. This "mantra" merely draws on what we already know about our cognitive faculties, and there is no reason to believe that the reading process is any different.</p>
      <p>As for the proposition that alphabetic systems with few or no extenders are less readable (since they lack a proper bouma); in the absence of any (even anecdotal) data that demonstrates that Hebrew, Chinese, and various Indian scripts (to name a few) are less readable than a mixed case Latin script, or alternatively, that Latin script readers are more efficient and nimble readers than others—such a proposition could be seen to be a form of script chauvinism.</p>
      <p>Extending on this "chauvinism" theme, the claim that the Irish invented word space is simply incorrect. As william had already mentioned, the Dead Sea Scrolls were written with word spacing (150 BCE ~ 70 CE). What I think that what I can add to his comment, is that word spacing was most likely imported into Hebrew sometime during the Babylonian Captivity period (i.e. sometime after 597 BCE), from a probable older source or tradition.<br>
      We have a general tendency in the West to view the world through the narrow prism of a specific historical narrative, often forgetting that throughout history the various cultures of the world came into direct and indirect contact with each other, cross-pollinating each other with ideas.</p>
      <p>The bottom line is that I would like to propose that the "common sense" rule which states that a large x-height reduces readability, is overreaching. It may be true for a certain typeface, but untrue for another (I am not referring to extreme cases though, extremes by definition are rarely conducive to anything), and there are many other design factors that influence readability much more than x-height.</p>
