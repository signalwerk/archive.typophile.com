      <p>&gt;Tracy's 60% rule. Is this based on historical evidence, empirical data, academic studies etc.?</p>
      <p>It is someone's theory based on common practice at the time. What  is normal workflow to achieve economy of printing combined with reasonable readability was more an issue of typical trade practice than anything empirical.<br>
      I find issue with taking away the other variables.  Sans serifs today typically have shorter ascenders and descenders than a typical roman book face so it stands to reason that we would lead them more to find the sweet spot in leading.<br>
      To me, the only fair comparison is to measure efficiency with readability. An example would be to have a constant page size, margins, and line length but make the number of characters on a page the same.  This would level out the efficiency or economy of a typeface but allow the tester to set point size and leading in any way that would yiield the same density of text per page. It would be possible to set as an example, Helvetica at 9pt on 13 leading with Garamond at 10.5 pt on 12pt leading (assuming this would be even on efficiency)  and compare the two from an ease of reading standpoint.</p>
