      <p>Hrant, I have a slight problem with the assertion that x-height bears any relevance to the readability of text. Perhaps we subjectively believe that we read typefaces of modest x-height better, because those are the typefaces that we are most accustomed to. </p>
      <p>If extenders were important in facilitating the reading process, would it not follow that alphabetic systems that have no extenders or very few extenders (e.g. square Hebrew), would inherently be less readable?</p>
      <p>As for the argument that all-caps are harder to read, that may be true for the modern reader who is not accustomed to reading text in all caps to begin with. I doubt though that the Romans were slow readers, and it would seem logically reasonable to expect that training someone for a certain period of time, to read in all caps could, in theory, yield reading speeds similar or identical to lowercase reading, for that individual. Although I will check the research literature later today to see if there was any empirical research done on this particular subject.</p>
      <p>Interestingly, I have just finished a book set in Plantin (which isn't shy on x-height), and found it to be very readable and inviting.</p>
