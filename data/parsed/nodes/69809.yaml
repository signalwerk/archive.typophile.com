      <p>&gt; How would you vary attributes such as color, letterspacing,<br>
      &gt; and vertical proportions, between the two?</p>
      <p>Color, letterspacing and x-height are all inversely proportional (although not linearly) to intended point size. So darker color and looser spacing go hand-in-hand with a larger x-height (which, together, target smaller text sizes). This BTW is why Helvetica and Mrs Eaves are not really text faces: the former (ignoring its lack of serifs for the sake of argument) is too tight for its large x-height (the weight however one can vary nicely) while the latter (ignoring its village-idiot spacing for the sake or argument) is too loose for its small x-height. And adjusting tracking is no magic bullet, since it ruins "boundary conditions", like the right side of the "r" (especially in the uneven Mrs Eaves).</p>
      <p>BTW, this is not a "theory" - it's common practice among the top foundries, past and present. And it's not due much to fashion, but very much how humans see and read.</p>
      <p>hhp</p>
