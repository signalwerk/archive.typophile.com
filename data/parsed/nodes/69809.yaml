      <p>Well, John, when I say 'thought best' that is shorthand for Lino's promotional material, and of course you are right that fashion is a factor. But - - - Palatino evoking the 50s ? ? ? Zapf thought his designs were for eternity (perhaps, even, deriving from the wellsprings of eternity!), and quite beyond dating to a specific decade, much less a century. He would be very angry indeed! Nevertheless, I think you are right. I don't see Palatino as you do, but I certainly see Optima as pure early 60s - - modernity's last innocent expression of belief in itself, the UN when it was still supposed to work, and before bloat. Does your view of Palatino embrace its many variants, such as Hunt and Zapf Renaissance? Doesn't Aldus have an earlier feeling? Anywhere from Thomas Mann . . . back to Ronald Firbank? </p>
