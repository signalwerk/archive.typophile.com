      <p>The scientific literature on legibility is sparse and does not seem to have attracted any towering intellects. The most important modern achievements in legibility are not theoretical, but practical: the typefaces Verdana and Georgia. These were produced empirically and instinctively.</p>
      <p>There is nothing absolute about Tracy's 'rule', which might just as well have been 55% or 65% or 70%, depending on the decade.</p>
      <p>X-height is a very loaded subject. One reason is that sociological factors are seldom absent from the discussion. High x-height is considered crass and commercial. Low x-height is considered refined, classical, tasteful, etc. This unproductive dialectic has been going on since long, long before the class (whoops, I mean x-height) wars of the 1960s. It will continue for the simple reason that paper has always been too expensive for publishers, and less paper can be used when smaller, higher x-height typefaces are employed.</p>
      <p>The class-taste war elements of the discussion are what account for the over-emotional feelings of those on the side of lower x-heights. Indeed, it is always the low x-height people who are emotional. The high x-height people just laugh their way to the bank. </p>
      <p>The only people who discuss x-height are people opposed to high x-height. The reason is that learning about x-height has been an important part of their aesthetic development. One of the great truths we learn as we become cultivated persons knowledgeable about type is that high x-height is bad, low is good. It is an article both of fact and faith.</p>
      <p>It's all so damned silly! </p>
      <p>&gt;"profoundly utilitarian" sounds very useful if you are looking for a hammer, but of limited use otherwise.</p>
      <p>Then I take it you regard a hammer to be a tool of limited use? Others would disagree. Nietzsche, for example, liked to philosophize with a hammer. Indeed, he even wrote a how-to guide anent.</p>
