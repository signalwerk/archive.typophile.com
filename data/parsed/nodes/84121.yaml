  html: |-
    <p><strong>Thread</strong> aims to collect the secret buttons from the user's FL. Called the "<em>secret</em>" because it is not listed in the "help" and "Keyboard short cut". The button may be found by chance as I did (works on windows). At least four buttons is very helpful to me:)</p>
    <p>The following keys work in glyph mode:</p>
    <ol>
    <li>[z] = zoom out (press as needed)</li>
    <li>[x] = zoom out (press as needed)</li>
    <li>[tab] = Quick search the nearest glyph index based on the preview</li>
    <li>[tilde &amp; grave] = Quick preview with fill outline (press and hold). Usually the buttons right below the "Esc" windows keyboard</li>
    </ol>
    <p>Please put your experience too (please ignore if this is considered obsolete:)</p>
    <p>Best Regards</p>
