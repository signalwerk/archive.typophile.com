    html: |-
      <p>On Mac:</p>
      <p>Metrics WIndow, Shift Command P changes filled glyphs to outline. Particularly useful in the metrics window when working with a connecting script. Works in the Glyph Window as well.</p>
      <p>Shift Command N shows and hides nodes both in the Glyph Window and the Metrics Window</p>
      <p>In Metrics WIndow, Command ] advances the character to the next on in the Index order. Command [ reverses this.</p>
    html_clean: |-
