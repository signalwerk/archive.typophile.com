    html: <p>Nearly every sans serif text typeface in the <a href="/node/13594" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontFont</a> library has lining and text figures included, with text figs as the default style. Many of these FontFonts are listed in the thread Paul linked, but <a href="http://www.fontshop.com/search/?q=FontFont+sans+-ot+-purchase&amp;site=d&amp;start=0&amp;num=100&amp;sample_text=0123456789&amp;sample_size=48">here's a handy search of FontShop.com with the figures from all the sans FFs displayed</a>.</p>
