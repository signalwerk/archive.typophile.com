    html: |-
      <p>To the best of my knowledge, the first sans with lower case numbers was Futura. </p>
      <p>The first digitization was by Sacks and Quay, The Foundry Architype Renner. </p>
      <p>The first modern sans serif superfamily was the seminal Today Sans Serif, Volker Küster for Scangraphic, 1987, with OSF, small caps, all f-ligs, all weights, two optical sizes, etc., and available from a number of distributors.</p>
      <p>Many poorly known but excellently implemented (by among others A-J Pool) URW sans serif families come with OSF and SC -- including News Gothic if memory serves. These are, again if memory serves, in the URW 'Design Collection', a relatively inexpensive collection of competent goodies. </p>
      <p>I imagine Font Bureau is a good source for sans serifs with osf.</p>
