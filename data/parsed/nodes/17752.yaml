    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Faux Formatting</strong></p>
    <p>Faux formatting is formatting automatically done by computers to <em>fake</em> <a href="/wiki/style" class="freelinking" rel="nofollow">styles</a> of fonts such as <a href="/wiki/bold" class="freelinking" rel="nofollow">bold</a>, <a href="/wiki/italic" class="freelinking" rel="nofollow">italic</a> (sloped roman), <a href="/wiki/small%20capitals" class="freelinking" rel="nofollow">small caps</a>, or <a href="/wiki/squooshed" class="freelinking" rel="nofollow">condensed</a> from a single font that either is not linked to or does not contain <em>true</em> versions of these types of formatting.</p>
    <p>Links:<br>
    <a href="http://www.fonts.com/AboutFonts/Articles/fyti/Style+linked+fonts.htm?ovmkt=JK0U0JDQ41GITSE926AMILP7V8" rel="nofollow">FYTI: Style-linked fonts</a></p>
