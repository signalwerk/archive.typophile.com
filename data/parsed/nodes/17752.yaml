    <p>Faux formatting is formatting automatically done by computers to <em>fake</em> <a href="/node/14704/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">styles</a> of fonts such as <a href="/node/31067/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">bold</a>, <a href="/node/12463/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Italic</a> (sloped roman), <a href="/node/12027/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">small caps</a>, or <a href="/node/33713/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">condensed</a> from a single font that either is not linked to or does not contain <em>true</em> versions of these types of&nbsp;formatting.</p>
