    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;: Faux&nbsp;Formatting</strong></p>
    <p>Faux formatting is formatting automatically done by computers to <em>fake</em> <a href="/node/14704" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">styles</a> of fonts such as <a href="/node/31067" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">bold</a>, <a href="/node/12463" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Italic</a> (sloped roman), <a href="/node/12027" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">small caps</a>, or <a href="/node/33713" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">condensed</a> from a single font that either is not linked to or does not contain <em>true</em> versions of these types of&nbsp;formatting.</p>
    <p>Links:<br><a href="http://www.fonts.com/AboutFonts/Articles/fyti/Style+linked+fonts.htm?ovmkt=JK0U0JDQ41GITSE926AMILP7V8"><span class="caps">FYTI</span>: Style-linked&nbsp;fonts</a></p>
