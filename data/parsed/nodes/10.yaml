    html: |-
      <p>I love how integrated all the features are — I just assumed I could reference my wiki entry for <a href="wiki/sans serif" class="wiki">sans serif</a> from my blog, and it just worked! Awesome! I also can’t wait to see how the wiki and the forums tie together in practice; my hope is that the number of rehashed threads will drop precipitously as more FAQ-type material migrates to the wiki.</p>
      <p>I could use a little less flash to the interface and a little more functionality, though. The wiki’s still a little flaky in some respects and the UI could stand to be streamlined a bit. That said, this is a huge improvement and the new architecture seems ready to grow in ways that the old just never would have. Good work!</p>
    html_clean: |-
      <p>I love how integrated all the features are — I just assumed I could reference my wiki entry for <a href="wiki/sans serif" class="wiki link-lost">sans serif</a> from my blog, and it just worked! Awesome! I also can’t wait to see how the wiki and the forums tie together in practice; my hope is that the number of rehashed threads will drop precipitously as more FAQ-type material migrates to the wiki.</p>
