    date_raw: null
    votes: null
    html: |-
      <p>I was very impressed when I first saw the redesign, generally still am, it is beautiful. But looking at this forum, after actually using it, wish to share these opinions. </p>
      <p>1. Lack of visual contrast and cues<br>
      I think the old layout may be more visually clear. Now, because all posts share the same gray background and especially the username/posting date line’s close proximity along with its lack of strong visual contrast with the actual post, it makes the page harder to scan, when scrolled the page seem to gel into one gray mass with less visual cue to differentiate between posts. The old alternating gray / white rows, avatar together with the user’s post length seems clearer and might help users remember post positions on a page better.</p>
      <p>2. Text color, size and contrast<br>
      Also the text is dark grey, small and on a gray background, I think it hampers prolonged reading a little because of lesser overall contrast.</p>
      <p>3. Why so grey?<br>
      The whole grey color scheme makes this forum seem a little solemn maybe, somehow less fun then the old one.</p>
      <p>4. Smilies are fun, would be nice to have back …</p>
      <p>Just my 0.02 cents.</p>
    html_clean: |-
