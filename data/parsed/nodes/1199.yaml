    html: <p>Why would you want an SUV in Europe? You can drive as fast as you want in Germany, You can go over 90mph regularly without some stupid fat bloke with a gun waiting to make some money for the state, and you can break 115mph on the long trips. You can have lots more fun in Europe in a old Mini than you could ever have in a new SUV in America. I love my old Rover Metro K reg while at uni in Reading and it was great buzzing all over south England from Gillingham to East Anglia, to Richmond to Bournemouth.. etc. SUV are usually driven by mom's, that's why they put mirrors on both side now. In the old day trucks if they had a mirror under the visor it was on the passengers side not both. And that's a fact jack. And we pay a lot more and drive a lot less. </p>
