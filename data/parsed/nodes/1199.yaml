    html: "<p>David, funny! <br> <br>I wish LA had [real] public transport. I mean, I love driving a good car, but over here the traffic and cops take all the fun out of it. The buses are unreliable and not cheap, while the metro is just plain ridiculous: you have to be rich to afford it, plus you have to drive to get to a station... The gas lobby just uses public transport to make people like their cars more. <br> <br>I get around in my old BMW convertible - falling apart, like me. But the best transport -especially in LA with all the traffic and great weather- has gotta be a motorcycle - a Japanese screamer. I had a Yamaha 700, it got stolen. <br> <br>hhp <br></p>"
