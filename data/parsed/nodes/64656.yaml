      <p><cite>"...it isn’t as if the character of the design changes over time due to over use. Look at the thing itself, not at your associations and perceptions of it..."</cite></p>
      <p>Of course the character of the design will change with overuse. The perception of a typeface is created by its design, and if one perceives something to be ubiquitous then that will naturally become criteria when judging it. You cannot honestly say when you see and then consider Helvetica you don't remember where it has been used before?! </p>
      <p>You can try to be objective but I would argue that ignoring your perception and association is impossible whether you think you're doing it or not.</p>
