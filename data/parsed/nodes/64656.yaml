    html: |-
      <p>In typography, any typeface may be matched with any other.</p>
      <p>However, if you must use Helvetica, it is usually best to use nothing but Helvetica, despite its shortcomings as a text face.<br>
      This is because such neo-grotesque types express the idea/myth that typefaces should be neutral, which adding a contrasting face undermines by introducing a typeface-centric dialogue.</p>
      <p>Nonetheless, if one designs with an awareness of historical modernism, it is possible to reference other ideas, such as the origins of typeface modernism and the grotesque typestyle in the early 19th century, or Post-modernism.</p>
      <p>Then again, one may choose to ignore all cultural associations, and just consider pure form--in which case it may be best to just experiment in your layout, with an open-minded attitude, trying every serif face on your hard drive and seeing how you can optimize each combination.</p>
