      <p><em>A font’s spacing is integral to it.</em></p>
      <p>I said most versions of Helvetica were badly spaced. The original Haas foundry version wasn't, so that it the spacing that I would consider integral to the design, as opposed to integral to particular fonts. Helvetica was respaced for unitised widths, so can just as easily be respaced for better fit. I respaced Helvetica World (although I now think that spacing a bit too tight: more appropriate for subheads than text).</p>
      <p>Over use isn't a criteria for judging a design. It may be a reason to avoid using a type, but it isn't as if the character of the design changes over time due to over use. Look at the thing itself, not at your associations and perceptions of it.</p>
    html_clean: |-
