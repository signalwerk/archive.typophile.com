    html: |-
      <p>Hrant, whom do you imagine that I am 'appeasing'?</p>
      <p>I have spent time working with the Helvetica design, and I am making comments about the quality of that design based on intimate knowledge of it. And one of the points I have made about Helvetica a number of time, contra your 'homogenized Helveeta', is that this is actually a quite idiosyncratic design with many oddities of construction, ultimately only understandable as a reduced contrast romantic type, which makes its associations with modernism all the more ironic.</p>
      <p>I'm talking about the design, not about its use, over-use or appropriateness for any given purpose. Back before I worked on Helvetica Linotype (now Helvetica World), my opinion of Helvetica was largely the same as yours: a negative reaction to an overused, badly spaced font with, to me, unpleasant associations. Since working on it, I've been forced to acknowledge that the design itself is really quite brilliant, not least in its figure-ground relationships, i.e. its notan. It is still overused, and most versions are still badly spaced, and it still has unpleasant associations, but it is also a very clever bit of work that deserves to be acknowledged as such.</p>
      <p>Here's an idea for you: why not spend some time making an Armenian Helvetica? I wonder if your appreciation of the design might increase, as mine did when I worked on new Cyrillic and Greek versions.</p>
    html_clean: |-
