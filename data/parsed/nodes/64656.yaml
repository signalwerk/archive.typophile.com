      <p>Well thanks to all.<br>
      I was already working with Utopia and Century. Egyptienne it really has an interesting harmony with Helvetica to me.<br>
      But I get the point of view of Nick about modernism drive origins of typeface so I choose Utopia with his cleanliness and optical sizes: "Utopia, created by Robert Slimbach and presented by Adobe in 1992, was intended to solve a number of typographic problems related to office correspondence. This demanded versatility, so Slimbach created a font family with cuts for text, for titles, extra bold for headlines, small caps, all caps with numerals, old face numerals, fractions, ligatures and scientific markings. Not just its forms, but also its aesthetics make the balanced, elegant Utopia suitable for any use." (Linotype)</p>
