      <p>Hrant: <em>You might ask John Hudson what he thinks. Let’s not pretend that there are no expert typographers who avoid those fonts like the plague.</em></p>
      <p>I not only don't avoid Helvetica, I've even designed Helvetica (Greek, Cyrillic and Hebrew). I do avoid Times New Roman though.</p>
      <p>I used to dislike Helvetica, but after working on it pretty intimately, I came to the conclusion that it is rather more interesting and worthwhile than either its modernist fan club or its detractors suggest. Most versions suffer from very bad spacing, due to inheritence of unitised matrix widths, but the actual design rewards study.</p>
