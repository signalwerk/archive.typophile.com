      <p>Except in signs, I don't see Helvetica that often, and I have to admit that in my opinion Helvetica is more attractive than Univers - or Gill Sans; which doubtless exposes my lack of taste. (And my opinion of Times Roman is that it will stick around as long as Caslon did.)</p>
      <p>But I don't think that Helvetica and Times Roman go well together (unless they're very different in size, so the issue of the stylistic clash arises less). Times Roman's appeal comes partly from its very sharp serifs, which shouldn't really be on the same line as no serifs. Clarendon - and most of the other suggestions made here - are much better.</p>
