    html: <p>I really like the bottom left v2, I think it is a very strong mark that says “Government” to me. The type as well as the flag work very well together. The color is also nice, although Red &amp; Government seem kind of scary together. My first instinct is that it should be green or blue, but I really like the red.</p>
