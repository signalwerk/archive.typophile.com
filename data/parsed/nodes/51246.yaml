    votes: null
    html: |-
      <p>Thanks so much Sharon, Paul, &amp; Lex!  Glad to have any feedback.<br>
      It’s “six-of-one, half-dozen of the other” for me... but I would like to make a decent departure from the original and go with the <a href="http://typophile.com/files/logotype-explorations-v2.gif">bottom-left on v2</a>, or either on <a href="http://typophile.com/files/logotype-explorations-v2b.gif">top at v2b</a>.</p>
      <p>The fonts are Union, Demos Bold, and FF Clan.  Maybe switch the FF Clan to Praxis Bold... then fiddle ’til it looks good.</p>
      <p>Wrapping the “flag stripes on a globe” (US Government... travel... get it?) was the idea for the spherical treatment of the mark in v2b, without making it look like a barber-shop pole.  Though users saying “<em>even their logo is a lemon!</em>” would be bad too — as they’re getting hammered on usability of the site (that’s the next task).</p>
      <p>I could even <a href="http://www.logolounge.com/articles/default.asp?ArticleID=638">animate that globe</a>, but I’m trying to be somewhat simple and classical and <a href="http://www.logolounge.com/articles/default.asp?ArticleID=607">not trendy</a>.</p>
