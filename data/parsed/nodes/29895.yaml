    html: |-
      <p>Hell, I even design the typefaces to be used on my resume Cheryl! That's how good I am!</p>
      <p>But seriously, I must admit I was pretty clueless for many years after I had left college, and it's only now that I'm no spring chicken any longer that I feel I know what I'm doing.</p>
      <p>You should see some of the crap I churned out when working on Prima magazine (yes! knitting patterns, bake your own advent scene, etc – that Prima) Or maybe not.</p>
      <p>The above comment was just a slight dig at people who use Typophile as a resource for 'I can't be bothered thinking of anything – I'll let some other sucker do it for me, and just copy what they do'.</p>
      <p>Sorry if you were offended. It's not bad to seek inspiartion. Plagiarism is the bad thing.</p>
      <p>Nick Cooke</p>
