      <p><em>Baskerville Old Face</em> come bundled with Office 03 and 07 on a Windows PC (and <em>Baskerville</em> with OSX and Office 04 on a Mac). Perhaps matching it with <em>Franklin Gothic Medium</em> (Windows, Office 03 Win, Office 07 Win) could work? <em>FG</em> wouldn't be available on a Mac, but Office 04 has News Gothic which is very similar. </p>
      <p>I have more suggestions, but as long as I don't know anything about the conference it's hard to know what might be suitable.</p>
