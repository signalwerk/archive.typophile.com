    <p>I am trying to revamp a standard PC word template that is used for name badges. Currently, the font combination used is Times New Roman italic for participant titles and institutions (smaller type), while the name is in a larger Verdana bold. (Name legibility is the most important feature. Does anyone have any other classic font combinations that would be compatible with standard PC fonts? (It has to be standard PC fonts because the computers used are basic rentals every year, in a different city, and the template has to be accessible by all conference employees. It’s very limiting, but any suggestions would be helpful!</p>
    <p>Thanks</p>
