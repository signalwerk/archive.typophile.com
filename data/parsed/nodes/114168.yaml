    html: |-
      <p>Except for the fact that the French keyboard layout has a mu character, the fact that it's an AZERTY layout is not an issue: i.e. characters in fonts aren't accessed by keyboard scan code. (If they were, you'd have to put A in the Q position, and Z in the W position.)</p>
      <p>Now, what happens when a user types a "mu" on such a keyboard?</p>
      <p>U+00B5 is the position in official Unicode; it is <em>not</em> one of the unofficial Windows characters which were in the positions of the control characters from U+0080 to U+009F. You definitely do not use U+03BC, the position of the regular Greek letter mu, because that key will generate the "micro" symbol, not that letter.</p>
