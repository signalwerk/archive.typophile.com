  html: |-
    <p>I recently received a request for customization of an existing font by adding a logotype to the font. The end user is French and uses the AZERTY keyboard layout. </p>
    <p>I checked with the user about placing the logo in the mu slot, and he said that would work for him. My question is, will placing the logo in the mu position in a 1252 codepage set-up achieve the results I am after, or does the mu character need to be placed elsewhere?</p>
