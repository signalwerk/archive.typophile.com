  html: <p>The new and improved Monotype Classic Library catalogue is now available. <br> <br>Boasting many new releases, the library is a wonderful typeface resource for the design community. All the fonts in the library are drawn to high standards and crafted to technical specifications second to none. <br> <br>European designers, to order your free catalogue just email us at <a href="mailto:enquire.europe@agfamonotype.com">enquire.europe@agfamonotype.com</a> or ring us on +44 (0)1737 765959.</p>
