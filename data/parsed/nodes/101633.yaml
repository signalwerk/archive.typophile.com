  html: |-
    <p>It's weird. It doesn't happen all the time but enough to be really frustrating. When I paste a string of latin text into the metrics window, about 30% of the time that text will paste in as a string of chinese text instead. </p>
    <p>I am using FL 5.1.2 on a mac running OS 10.6.8. This never happened in the older FL version. </p>
    <p>Does this happen to anybody else? Can I make it stop??</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/chinese_6525.png"></div><p></p>
