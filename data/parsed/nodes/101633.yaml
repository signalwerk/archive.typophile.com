    html: <p>My guess is that you are pasting 8-bit encoded text into a 16-bit environment. Hence each sequence of two single byte character codes are being interpreted as one double byte code, which happens to result in Chinese characters.</p>
    html_clean: <p>My guess is that you are pasting 8-bit encoded text into a 16-bit environment. Hence each sequence of two single byte character codes are being interpreted as one double byte code, which happens to result in Chinese characters.</p>
