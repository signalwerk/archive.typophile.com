    <p>Friday 10 September 1:10pm</p>
    <p>Dublin Castle</p>
    <p>A translation of two metaphysical treatises by an 18th-century Moroccan Sufi, Ibn Ajiba, was launched at this year's ATypI conference. The book has been designed and set by Robert Bringhurst with support of Tom Milo, both of whom were speakers at the conference. Robert and Tom have shown how to solve the problem of placing Arabic text on facing pages with the English translation in a style faithful to the classical Arabic.</p>
