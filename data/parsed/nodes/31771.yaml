      <p>You're right, there are rarely hard rules when it comes to making information easy to read, but there are basic rules about which part of a phone number is 'area code' and which part is 'subscriber number'.<br>
      A London number has a three-digit area code and an eight-digit subscriber number.<br>
      Most towns have a four or five-digit area code and a six or seven-digit subscriber number.<br>
      Some small towns have a six-digit area code and only a four-digit subscriber number.</p>
      <p>Nothing like keeping it simple ...</p>
      <p>As long as you keep your UK mobile phone 'area code' together (07816 or 7816 for international), it wouldn't really matter how you arrange the subscriber number;<br>
      xx xx xx would suit some numbers more than the more usual xxx xxx.</p>
      <p>it may have been a typo in your post but you only need one '+' to denote an international number</p>
