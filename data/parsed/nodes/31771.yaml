      <p>From the Ofcom Telephone Numbering Plan (via that Wikipedia link above):<br>
      "It is very common to see the + notation being misused — +44 (0)xxx xxx xxxx is not an uncommon occurrence even in official documents. For international callers the number between the brackets is dropped. For callers within the United Kingdom the +44 is dropped and the number between the brackets used. Calling +44 0xxx xxx xxxx will not work from most operators, and the +44 (0)xxx notation is incorrect and should not be used. The correct usage of the + notation in this example of the three-digit geographic code is +44 xxx xxx xxxx."</p>
      <p>As more people start to use mobile phones as their primary telephone, it makes sense to use the correct international number – no (0) – so that you can dial it from anywhere in the world without having to add or remove digits. If you dial +447816111111 on a mobile phone it will work in the UK as well as globally.</p>
      <p>I noticed that some pages on the Ofcom site – including the contact page of the Welsh language version – use the numbering scheme: (+44) (0)20 7981 3033 so it's clear that these are only guidelines and even the regulators can't stick to them.</p>
      <p>I don't think it really matters if you prefer to use the (0) but I was glad to read that it is unnecessary as I always found it cluttered and a little ugly.</p>
      <p>More information here:<br>
      <a href="http://paulm.com/how_to/write_a_phone_number.html" title="http://paulm.com/how_to/write_a_phone_number.html">http://paulm.com/how_to/write_a_phone_number.html</a></p>
      <p>My initial comment<br>
      <cite> but not<br>
      +44 (0)7816 111 111</cite></p>
      <p>was really in response to maxack's request for the 'correct' way. I was working on the assumption that it's good to know the rules so that you can break them well ...</p>
      <p>(sorry for the rambling essay, I need a cup of tea)</p>
