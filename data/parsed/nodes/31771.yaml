      <p>Tim, </p>
      <p>I understand your dilemma. I would (almost) always defer to the client in these circumstances. When they hear but disregard my opinion there's nothing left to do.</p>
      <p>If you are keen to drop the (0), I guess the best thing to do is find a broad range of high-end firms who don't use it and use them as examples. That may not be an easy task but here are two probably-evil, large companies who drop the (0):<br>
      <a href="http://web.worldbank.org/WBSITE/EXTERNAL/COUNTRIES/WBEUROPEEXTN/0,,contentMDK:20792347~menuPK:2436959~pagePK:64168445~piPK:64168309~theSitePK:268437,00.html " rel="nofollow">The World Bank UK Offices</a><br>
      <a href="http://www.personal.barclays.co.uk/BRC1/jsp/brccontrol?task=articleFWgroup&amp;value=3660&amp;site=pfs" rel="nofollow">Barclays Bank</a><br>
      and a couple of not-evil but still large organistaions:<br>
      <a href="http://www.foe.co.uk/feedback.html" rel="nofollow">Friends Of The Earth</a><br>
      <a href="http://www.panda.org/about_wwf/where_we_work/europe/where/uk/index.cfm" rel="nofollow">WWF</a> (linked page contains an embedded autoplay video of parrots and rainforest destruction ... just in case that sort of thing is NSFW where you are)</p>
      <p>It would be a lot easier if the powers that be just dropped the leading zero <em>or</em> (a cheaper option) if international numbers retained the zero. I'm not sure why it has to be removed anyway ...</p>
