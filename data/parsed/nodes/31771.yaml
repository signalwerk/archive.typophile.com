    html: <p>One alternate way to write this would be +44 (7816) 111111. While not so useful for mobile numbers, it becomes useful when using geographical (+441XXX_, +442X_) numbers in some applications like Microsoft Outlook. I specify the national access code as '0' and the international code as '00' (so area codes should be, for example, '121' and not '0121'). This method makes it crystal clear the international, national and local parts of the number.</p>
