    <p>Hello,</p>
    <p>How do I correctly split British mobile phone numbers for easier reading? And how long is the code for the carrier? </p>
    <p>I am with Orange, so do I split it like this (no, this is not a real number):</p>
    <p><strong>0781 61 11 111</strong></p>
    <p><em>or</em></p>
    <p><strong>07816 11 11 11</strong></p>
    <p><em>or</em></p>
    <p><strong>?</strong></p>
    <p>Thanks!</p>
