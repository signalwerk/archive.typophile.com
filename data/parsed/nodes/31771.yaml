      <p>How are my citations "dubious" ... the links I gave were specifically to illustrate <em>international</em> standards for <em>UK</em> numbers. So, for all the reasons you point out, those links were good examples of that. The fact that some sites used different standards for national calls is probably to avoid the confusion you mention in you post* and the phone numbers for other countries may follow the numbering conventions specific to each country.</p>
      <p>Those were not links in an attempt to prove that "I'm right", just links for Tim if he felt like he needed examples to back up his designs for a specific client.</p>
      <p>I have no agenda here. I am happy to concede that the most common way to format international numbers in the UK is +44 (0)... but I was only pointing out that while the (0) is a convention, it is not necessarily correct.</p>
      <p>*I chose the FOE link precisley because it used both +44 20 and 020 numbering. The aim of contact details are usually to make the information clear and easy to understand; sometimes dual numbers for local and international customers is easier to understand than one hybrid number that is correct for neither.</p>
      <p>Crumbs! I feel like I am on the defensive about telephone number formats ... I am (thankfully?) not an expert, I was only trying to help.</p>
      <p>I'll get my coat.</p>
