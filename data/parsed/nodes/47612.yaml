    html: |-
      <p>Varies by issue from what I can see (at <a href="http://www.newseum.org/todaysfrontpages/" title="http://www.newseum.org/todaysfrontpages/">http://www.newseum.org/todaysfrontpages/</a>)<br>
       but - Heads are Minion - Subheads and captions are Poynter - body text is NimrodMT<br>
      Line below masthead is Poynter except for Star which is Hartford Pi<br>
      UPC code is MefcoOcrb<br>
      Most boxed items at bottom of page are Poynter for text sizes with Minion Subheads</p>
