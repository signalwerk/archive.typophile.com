    <p></p><div class="imageWrap"><img src="/web/20080906232259im_/http://www.typophile.com/files/bergenskirken_logo_3820.jpg"></div><p></p>
    <p>Hi. This is a logo for a church. It’s a young pentacostal church founded four years ago and consist of students and young families, mainly aged 25-30 years. They strive hard to not grow older - thus the logo is aiming a bit lower.</p>
    <p><strong>Brief:</strong><br>
    Øystein: “Strong, but still nice and caring. You know, like my two meter tall grandfather with the worlds kindest eyes”.<br>
    Per Olav: “It should maybe express fellowship?”<br>
    Øystein: “Hey, be creative!”<br>
    Per Olav: “Yeah. We don’t really want our people to love it at first. We want to get responses like ’this is really challenging me’ from the church.”<br>
    Øystein: *grin*</p>
    <p><strong>Some of my thoughts:</strong><br>
    Church identities have a long tradition of graphic misery.<br>
    It should not try to say “everything” (with crosses, doves, hands and perhaps some architechtual drawings filtered into each other).<br>
    It needs to be a bit tough.<br>
    It has to be very simple.</p>
    <p>I’m presenting it tomorrow.<br>
    Shoot!</p>
