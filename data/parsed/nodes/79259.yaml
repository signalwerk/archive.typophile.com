    <p>Dear members,</p>
    <p>I would like to submit a kind request. We are a family owned company and we are looking for a custom made font that can satisfy the criteria below:</p>
    <p>1) appear as handwritten (fountainpen strokes)<br>
    2) feminine aesthetic<br>
    3) 18th or 19th century look<br>
    4) supporting greek latin and cyrillic languages</p>
    <p>Please use the contact form to send me samples of your work.</p>
    <p>Regards<br>
    Prometheus</p>
    <p>P.S. We apologize for using the forum for posting a job, however we thought that perhaps this is an efficient way to reach font designers and calligraphers.</p>
