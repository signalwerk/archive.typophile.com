  html: |-
    <p>I recently designed a logo with a word mark and have had some problems with the font Felix Titling (Open Type). When it's printed on a laser printer the font becomes broken and difficult to read.</p>
    <p>I am trying to offer a solution to the client, however they really like the font and want to keep it in their logo.</p>
    <p>Any suggestions as to why the font is not printing clearly on laser printers?</p>
    <p>Thanks!<br>
    Jackie</p>
