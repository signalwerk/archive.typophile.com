    html: |-
      <p>The mechanical screen halftone was preceded by several other mechanical manual "multi-dotting" tools.<br>
      I don't know whether they were stamps, or rollers, or both.<br>
      You can see these effects on old postcards.</p>
      <p>Prior to mechanical halftones, tonal reproductions of photographs could be printed by collotype--IMO the most superior of the early photo-reproduction printing methods.</p>
      <p>Prior to photography, don't forget a ground of etching powder on metal, and the texture of stone on lithography, both of which may be manipulated by hand to achieve graduated tonal effects. </p>
      <p>Dressmakers use a little spiked wheel for perforating a line into paper patterns.</p>
