      <p>Perhaps the term you are looking for is "duotone" Green and Black (with an enlarged halftone dots). </p>
      <p>Actually it should properly be called a fake duotone because the green is merely a flat color and not tonal in any way.</p>
      <p>Now in these days of cheap 4-color printing it is a little used 2-color effect, but it certainly can be done in photoshop</p>
