      <p><cite>Does that cause what you’re referring to?<cite></cite></cite></p>
      <p>That could be the problem if there is a conflict between your ligature and duplicate T classes, or if you accidentally put a T into another class entirely. It might be worth copy/pasting those classes into text edit and looking at them blown up. I sometimes miss syntax problems in my classes because I have a hard time reading the tiny text in the class window.</p>
