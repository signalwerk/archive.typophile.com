  html: <p>Just wondering if the bottom margin is meant to be bigger than top generally and the right one more than the left on a single pg. They are going to be double pg spreads and the right margin will be the one nearer the centre of the pg of a double pg spread. Approximately how many mm is the average to work with when it comes to margins for an annual?</p>
