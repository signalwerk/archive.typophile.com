    html: |-
      <p>The answer is 42 ;) (you just need to figure out in which measuring system)</p>
      <p>... The <a href="http://en.wikipedia.org/wiki/Canons_of_page_construction" rel="nofollow">Wikipedia page on page construction canons</a> might be helpful for you. </p>
      <p>In general, when you are working with page spreads, making the outer margins wider then the inner margins is practical, as it lets the reader hold the pages at the sides while making the content of the facing pages appear as a cohesive unit.</p>
      <p><a href="http://www.amazon.com/gp/product/0823059642" rel="nofollow">Xerox Publishing Standards</a> may be interesting for you.</p>
