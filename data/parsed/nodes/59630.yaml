      <p><em>“TTF/OTF linking is already starting to happen - it’s not going to go away.”</em></p>
      <p>TrueDoc started to happen, and it went away (heck, the whole Netscape browser as it then was went away). I expect several startup web font services like TypeKit and Kernest will start to happen and then go away. Raw TTF/OTF could easily be replaced by a format that is as easy to implement and with no greater obligations of digital rights management on browsers, but which would include numerous optional gates between using fonts and giving fonts away. I think TTF/OTF linking happened because nothing else was happening, the non-MS browsers didn’t want EOT, and they went for the easiest option, in part to force the issue. Okay, the issue is forced. W3C is possibly interested in defining a standard, let’s start making some proposals. But <em>not</em> as additional formats alongside raw TTF/OTF linking. I think we should be totally clear that raw TTF/OTF linking is unacceptable <em>even for fonts with unrestrictive licensing</em> because font formats should resolve technical and usage problems, not licensing discrepancies. If a difference in licensing requires separate font formats, you know there’s a basic error in thinking. A font with unrestrictive licensing might have open gates, but it should still have the same gates as another font. There is no need for multiple formats. [And if there were to be multiple formats, the one associated in users’ minds with unrestricted licensing or ‘free fonts’ shouldn’t be the TTF/OTF format. That is just inviting every TTF/OTF in the world to be uploaded onto the new filesharing — sorry, web publishing — system.]</p>
