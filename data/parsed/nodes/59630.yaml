      <p>@all</p>
      <p>I’m glad to hear Thomas Phinney getting the same vibe as I do - that a solution is within reach.<br>
      All the more important that font-makers come together, and soon.<br>
      I chose to use the analogy of a labor dispute because it highlights that <strong>this is a quid-pro-quo negotiation</strong>.<br>
      Those browser-makers with reservations about a web-specific font file format are looking to font-makers for assurance that web fonts will get the time and attention that they deserve. Just offering up print fonts for web use is not going to get the job done. (I’ve done a lot of testing. Taking the bulk of fonts as they exist today, and readying them for the screen will require work, and lots of it.)</p>
      <p>And these fonts will need to be accompanied by simple, plain-English EULAs and reasonable pricing.</p>
      <p>Actually, I <strong>do</strong> think of the font-making community in the same way as I do, say, professional baseball players. When the pro ball players go out on strike there’s no replacing them; there <strong>is no</strong> professional baseball, period.<br>
      And I think some of the folks involved in the discussions at the W3C have come around to sensing the issue in this light as well: that without enthusiastic and active participation by the pros, a dark cloud is cast on the future of typography on the web.<br>
      Now, one ideologically thorny flaw in the analogy is that the business model for fonts looks to copyright and not strictly to pay-for-performance as in sports.<br>
      So, as I said to Vlad Levantovsky on another thread, “Stop waving the EULA flag”. Stop going on about your “rights”. Not because you’re wrong, but because it’s counter-productive.<br>
      On the web, the extent of your rights, as well as your opportunities, will be defined not by legalities, but by a file format implemented through an agreement among the major browser-makers.<br>
      And these browser makers, web authors, and the browsing public sorely need and have a right to expect performance in exchange for this file format insofar as it provides reasonable protections against unlicensed distribution.</p>
      <p>And so the bottom line question that many await an answer to is this: <strong>if</strong> you are given these protections, will you perform?<br>
      That’s the deal, yes or no?</p>
      <p>@dberlow</p>
      <p>As per Sii’s suggestion we can ad hoc ’til the cows in Georgia all come home, but politically, I think your proposal stands the same chance at the W3C as a snowball in hell.<br>
      It’s similar in some respects to Thomas Lord’s proposal, which many, myself included, find reasonable and intriguing.<br>
      However, there is clearly no interest in making this new font file format into an experimental poster-child for a new labeling/wrapper scheme. There is a clear preference for a timely solution targeted narrowly at the problem at hand.<br>
      I think your horse is dead, and the time to stop flogging it is soon. (Don’t mean to be snide, it’s just the way I see it. I don’t think I’m alone.)</p>
      <p>Respectfully,</p>
      <p>Richard fink</p>
