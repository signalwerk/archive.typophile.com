      <p>Any kind of mandatory credits feature is a bad idea as things tend to pile up and become unmanageable. The free software world ran into trouble with this early on when all the little code snippets that required credit ended up creating huge lists of contributors that had to be dealt with and people got sick of it really quickly. Complex web sites would have to credit themselves, the CMS system, the plugins to the CMS system, the Flash stuff that powers their image zooming, fonts, images, etc. and the list would never end. </p>
      <p>And nobody is going to use web fonts if it involves the users seeing a popup and a clicking through licenses. People hate that kind of annoying interaction. Remember when Microsoft had to put a popup block in IE, hampering it’s own popup ad network?  Even if they do, the users won’t read the licenses anyway; they’ll just install some plugin that automatically agrees to them without displaying them.</p>
