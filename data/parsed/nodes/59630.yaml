    html: |-
      <p>John: Speaking plainly, yes. I think selling web fonts means kissing rents for desktop use (ie, print publishers) of those fonts goodbye, for all but handful of loyal print designers who WANT to send type designers money, and are lucky enough to still be in business. Perhaps this will be more than offset by the money made selling web fonts. Maybe it won’t, and like everyone else in this depression, type developers will be earning significantly less money in 5 years time. </p>
      <p>Personally, I think that all this talk about “fence posts” seems like wishful thinking about how the world really works, and in a couple of years these 200-emails-in-a-day discussions are going to be looked back on as a total waste of time that was costly and counterproductive. I mean, the guys who run thepiratebay.org got a jail sentence, and the site is still up. </p>
      <p>Tom Lord and I spent a lot of time talking over this issue 9 months ago, and we really think that the best win-win-win situation for font developers, free software developers, and users  is something like his MAME proposal - something to get people reading licenses. </p>
      <p>People who love fonts really need to know what the license terms of the fonts they are downloading are. If the licenses are not <a href="http://river-valley.tv/ingimp-a-smorgasbord-of-usability-adaptive-uis-and-visually-arresting-graphic-design-for-2009/">made available in a way people actually pause to read</a> - which is possible as that link demonstrates - then they will be ignored. </p>
      <p>CORS has a precendent in Firefox, and no one objects to it. Compression is a good idea, Jonathan Kew’s ZOT is a fine free implementation, and no one objects to it. Neither of these things will stop the deflation of the print font market as I’ve described. More than these things isn’t going to work in the real world - except better licensing visibility.</p>
      <p>This does NOT mean machine-readable licenses - that invite DRM features in programs and DMCA-style lawsuits. I think that hammering out the details of how to do this is the only discussion that is good value for time/effort long term.</p>
