      <p>@ Richard: “this is a quid-pro-quo negotiation.”</p>
      <p>I’m not at all convinced of that. The browser vendors aren’t really giving up anything, have nothing at risk really. Any change is good for them. The font vendors are worried about losing their entire livelihoods.</p>
      <p>@Chris Fynn: “TTF/OTF linking is already starting to happen - it’s not going to go away.”</p>
      <p>It’s not going to go away, but it isn’t a huge deal until/unless Microsoft starts to support it in IE (on top of the other browsers doing it).</p>
      <p>The converse is also true: any other solution needs to be supported by at least MS/IE and Mozilla/Firefox (and arguably Apple/Safari) to become a real standard in the practical sense, which sees people using it widely.</p>
      <p>@ abattis: “I think selling web fonts means kissing rents for desktop use (ie, print publishers) of those fonts goodbye”</p>
      <p>If everybody will have the font, why won’t they use it for web use as well? It seems to me inescapable (with any of the options being discussed) that if it destroys the retail market for desktop fonts, it stifles any such market from even emerging for web fonts. What am I missing here? </p>
      <p>@ John Hudson: “Håkon (’twas he) may be bluffing or simply mistaken in his concerns about DMCA”</p>
      <p>I believe that some of the Mozilla/Firefox folks expressed similar concerns. Not saying those concerns were justified, just that they had them.</p>
      <p>Cheers,</p>
      <p>T</p>
