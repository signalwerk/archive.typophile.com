      <p>@thomas phinney who wrote:</p>
      <p>“<em>The font vendors are worried about losing their entire livelihoods.</em>”</p>
      <p> Firstly, do you know if 401K’s will be exempt from this? Or are web fonts going to wipe those out, too? After all, for those planning on a forced retirement due to web fonts, this is important information! (Just a little gallows humor, Thomas. My Israeli friends are getting inside my head.)<br>
       I’d like to know if you agree with this assessment:<br>
       If it is anyone’s firm belief that Web Fonts will bring about a world where, because of unrestricted access to font files on web servers, font makers will no longer be able to get paid for their work, then it’s important to realize that the process has already begun and there’s no stopping it. It’s a process that can be influenced and modified, but not reversed.<br>
       IE has supported @font-face using EOT files for many years. I can already convert any TTF file into an EOT and it will display in IE. I can use “free” fonts, retail fonts, it doesn’t matter. And as long as I’m willing to ignore copyright considerations I can do anything I like. And those that believe that font makers will no longer be able to get paid are implicitly acknowledging that I can do what I like and get away with it.<br>
       Otherwise, why the worry?<br>
       Plus, I can pick up the retail fonts I need at no charge on the darknet. No money down.<br>
       Now, recently, Safari and FireFox have both begun supporting font-linking as well, but they support linking to “raw” font files that I don’t have to pre-process to use.<br>
       So you would figure that I’m all ready to roll. Time to start using web fonts today. Not quite.<br>
       The one thing that’s stopping me is lack of @font-face support in older versions of FireFox and, to a lesser extent, Safari. If I want to get a uniform result across browsers, I have to wait the couple of years for enough FireFox users to upgrade to version 3.5 to bring my expectation of cross-browser uniformity to an acceptable level.<br>
       But once that threshold is reached, web fonts are a completely practical proposition.<br>
       So, if there is a firm, rational basis for the worry, then it would be wise to start looking for a way to replace that lost income starting today.</p>
      <p>Right?</p>
