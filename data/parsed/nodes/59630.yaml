      <p>Some measure of font piracy is built in to DTP and the promiscuous font formats that we’ve been using for over 20 years, during which time the present digital font industry has grown and diversified, especially during the last few years. </p>
      <p>In professional circles it is endemic, due to the peripatetic nature of design employment, and yet “above” a certain level, legit companies also form the best clients/customers.</p>
      <p>As long as there is some indication of what is allowed and not allowed, there will be a variety of legal and non-legal font use.</p>
      <p>Recently in science news, it has been noted that virtuous behavior in one area of a person’s life may be compensatory for transgressions elsewhere. And vice versa, which could be called the Spitzer Effect.</p>
      <p>So the sky isn’t falling, but at the same time we have to send a clear message, create a magnetic field against which people can set their moral compasses, whatever course they choose to take.</p>
      <p>No doubt we are clothing our self interest in the garb of ethics, but that’s the way everyone plays the game.</p>
