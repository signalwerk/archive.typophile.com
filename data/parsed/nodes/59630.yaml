      <p>Here’s a random idea out of the blue that may have merit or may be ridiculous, but I’ll toss it out there...</p>
      <p>What if the browser manufacturers implemented some sort of colophon feature? It’s long been standard in pro web design to have a copyright block at the footer of the page. What if the browser, itself, rendered such a block in, say, the browsers bottom status bar?</p>
      <p>The web site author could use a copyright tag, perhaps:</p>
      <p>[copyright]All Contents (c) 2009 megacorp[/copyright]</p>
      <p>And then perhaps the browser, supporting @font-face would know how to grab the font’s copyright data from the file itself (provided such a tag would exist in the font file format).</p>
      <p>So in the browser’s status bar, something like this could be displayed:</p>
      <p>Site: All Contents (c) 2009 megacorp; Fonts: Font X (c) 2008 Adobe Systems, Font Y (cc) 2007 freebie font corp.</p>
      <p>(or maybe it could be rendered in a slide-down panel ala Firefox’s pop-up blocker or password remembering windows)</p>
      <p>On top of that, perhaps the browser could intercept any call to a font file directly with a pop-up dialogue window that also explains the copyright info. Something like:</p>
      <p>You are about to access a font directly: [font-name] [copyright] [brief license overview] OK/CANCEL</p>
      <p>The basis of the idea is to ensure licensing/EULA information is communicated (in the name of educating the naive) rather than burdening the web devs and/or browser devs with various forms of DRM or DRM-lite/esque features. </p>
      <p>Just a thought...</p>
