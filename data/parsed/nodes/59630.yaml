      <p>I’m not going to quote you, but, I can read that you are misinformed. You think e.g. people “love” their User Agents more than they “love” their fonts;  Do you know how much bigger the revenue stream is for fonts than for W3C-compliant User Agents? (come to think of it, you think they are jealous?).</p>
      <p>“Print people” license if they need to, “web people” will license if they need to. Your opinion seems based on a misunderstanding of the place of IP in developing unique visual identities, (a force much more powerful than the web).</p>
