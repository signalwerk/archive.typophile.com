      <p>@john_hudson<br>
      “<em>We’ve already been told on the W3C list, by a representative of the W3C, that the only opinion that counts is that of the browser makers and everyone else’s is ‘pragmatically irrelevant’ except insofar as as it influences the browser makers.</em>”</p>
      <p>I didn’t see this anywhere. I, too, would like the source of that quote.<br>
      But outside of it’s harsh phrasing, essentially true, I would suppose.<br>
      And that’s why I wrote:<br>
      “<em>On the web, the extent of your rights, as well as your opportunities, will be defined not by legalities, but by a file format implemented through an agreement among the major browser-makers.</em>”<br>
      This pretty much sums up the situation for anybody wishing to present anything on the web. That’s why the standards movement started up in the first place. If the browser doesn’t support the format you need on the client side, you’re screwed.<br>
      So the mission becomes: influence the browser makers.</p>
      <p>As far as David Berlow’s permissions table:<br>
      “<em>The proposal doesn’t ask anything of the W3C: its a font table that expresses specific license permissions in a font. It ain’t the W3C’s remit.</em>”</p>
      <p>Wrong. What the browser makers choose to support is very much their remit, as we’ve just established. You can’t have it both ways. You can add ten tables, but what are you going to do if the browser makers choose to ignore them on implementation?<br>
      You are most definitely asking something of the browser makers, certainly, even if there is no formal spec from the W3C, otherwise the table is an exercise in pointlessness. You are asking them to display, or act upon, the table.<br>
      So, please, by all means ask them if they want to be bothered with it at this time?</p>
