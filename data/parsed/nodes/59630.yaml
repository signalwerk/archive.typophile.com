      <p>Well, it looks like we’re siding with it being more of a ’ridiculous’ idea, and I really don’t disagree. ;o)</p>
      <p>But I guess that does still leave me scratching my head a bit as to what kind of solution the industry is looking for. </p>
      <p>But maybe there isn’t ’one’ solution that the industry is looking for.</p>
      <p>It seems like there are maybe a few camps:</p>
      <p> - those that think @font-face means that all people will just download the fonts they want from various web sites and never ever pay for another font again as long as they live.</p>
      <p> - those that want/hope for a DRM system that somehow—unlike every DRM system before—will actually work as intended and not annoy the paying customers</p>
      <p> - those that are going with the flow and just see it as another venue for both sales and illicit use</p>
      <p> - those that want some sort of web font format that is compressed, subsetted, and slightly munged. Not DRM, but definitely a different file format.</p>
      <p>Seems like the last 2 are the likely scenarios going forward, eh?</p>
