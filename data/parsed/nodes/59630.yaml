      <p>@all</p>
      <p>By all means, get the technical issues out on the table. They can all be well-explained in non-techie, plain English.</p>
      <p>But I’d like to repeat here what I posted on<br>
      <a href="http://typophile.com/node/59489" title="http://typophile.com/node/59489">http://typophile.com/node/59489</a></p>
      <p>Font-makers as a group need to swiftly move towards a consensus and begin to speak - at least publicly - with one voice on this issue.<br>
      Those who don’t quite understand the technical barriers to unlicensed use need to defer to trusted colleagues who do.<br>
      Just as in a labor dispute - say, the Writers Guild of America strike a few years ago that stopped TV and Film production - fragmentation is enemy number one.</p>
      <p>Just my humble, but informed, opinion.</p>
      <p>@john hudson</p>
      <p>“XOR a few bits” refers to the obfuscation (scrambling) scheme that EOT uses. Part of the EOT spec that’s been derided as “DRM”.<br>
      As far as compression, ZOT seems to give the most impressive results so far. Vlad Levantovsky of Monotype has suggested a combination of MTX and ZOT, I believe. Another algorithm, LZMA has also been discussed.<br>
      It’s been demonstrated that compression will result in much smaller file sizes and therefore faster page load times; or at least that’s the goal. Expecially important for fonts going into mobile devices.<br>
      Compression would also, today, have a barrier effect to unlicensed use in that no operating system would recognize the compressed font file. Someone who downloads the file wouldn’t be able to just pop it into the Windows font folder, for instance, and use it. But that’s part and parcel of what developing a web-specific font file format is all about.</p>
