      <p>The second draft has gone to tool developers. The third will be posted by TypeConTime.</p>
      <p>&gt;Alternately perhaps you could organize an ad-hoc session at TypeCon.</p>
      <p>I wish, and I thank you for the idea, but my goal here is to do the best possible presentation of as much knowledge as I can, to the most powerful people in the path of this thing. That means my lawyer, my tool developers and the committee to re-elect OT/OFF president and dictator for life. Besides which I have 3rd degree burns on my fingertips from unknowingly stepping into ad hoc audiences, like the new fellow I respond to down below.</p>
      <p>@Hudson&gt;Microsoft, Mozilla, Google, Opera and others are engaged in a browser market dominance struggle...</p>
      <p>That’s one way of putting it. And what is the revenue of that market?</p>
      <p>Another way of putting it is that the W3C has had an unnatural sometimes not so secret user agent struggle on its hands for 15 years and so fonts are going to blow the web to smithereens if someone doesn’t do something 3 years ago. </p>
      <p>Yet another way of putting it is that the OS/UA manufacturers have the non-OS/UA manufacturers by the throat and because one of them is a W3C headman, they are all unhappy. </p>
      <p>&gt; I suspect it will involve two web font formats: both EOT and TTF/OTF. The former necessary for compatibility with existing versions of Internet Explorer, and the latter probably becoming the more common format.</p>
      <p>With all due respect, if old versions of user agents do not work or cannot be made by the web developer to work with OT@F-F, the user whose agent it is will need to upgrade. Besides which, if a PERM table solves ’the problem’, EOT can vanish as fast as a speedo-ing bullet.</p>
      <p>@Phinney&gt;In fact, pretty much *EVERY* move to do anything that User Agents would have to comply with, beyond downloading a font, has been objected to by somebody.</p>
      <p>... beyond downloading a font, installing a font and deleting a font, I hope...:) That’s all I want them to do.</p>
