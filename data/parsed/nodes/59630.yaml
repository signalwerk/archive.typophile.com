      <p>@jh: This idea that obfuscation (via compression, or expressly for its own sake) will limit exposure of a font seems wishful thinking to me.</p>
      <p>Nothing will stop graphic designers and everyone else who loves fonts and who do not respect font licenses - which is most people, from what I can tell - from not installing inevitable “web font vacuum” browser extensions that will automatically install every font they happen to browse across into the OS system folder, and using these fonts in their print design work. I would also expect such “vacuums” to do what non-paying web publishers want, too, automatically stripping the watermarks, XUIDs and so on so that running a web-spider to search out unlicensed fonts doesn’t spot them. </p>
      <p>If font vendors try to proscribe the behavior of paying users in an attempt to annoy non-paying users, they will only hurt their own sales by annoying their paying users. </p>
      <p>Policing web fonts is going to be a total nightmare for those clients you just described on www-font, faced with the dilemma of having a font asset they wish to send to everyone who visits their website, yet not wanting anyone to use it. Perhaps Monotype and Adobe’s legal teams will have time and money in the recession to write takedown notices to people publishing their fonts without licenses, as it makes more sense for them to bet their existing revenues (from print based publishers, who are in decline) on the chance that new revenues from web publishers (who have pent up demand, and are growing) will be more profitable than sticking with the declining market. But for clients as you’ve described, they paid all the costs and will not offset their loss of exclusivity through incoming revenue from the font assets.</p>
