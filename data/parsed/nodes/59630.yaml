      <p><cite>As I understand it, the aspect of EOT that has been objected to as DRM is rootstrings, not bit obfuscation.</cite></p>
      <p>Actually, obfuscation has been objected to as DRM as well, by a noticeable minority on the list. But those folks seem to have decided it’s not really DRM after all.</p>
      <p>In fact, pretty much *EVERY* move to do anything that User Agents would have to comply with, beyond downloading a font, has been objected to by somebody.</p>
      <p>That being said, I agree that some sort of compromise is close at hand. I tend to expect that its protections will be weakened enough that many font vendors will not like it much. Which is a good reason to try to get consensus within the font development community. Then again, I’m not sure the browser vendors will agree to anything that would make the majority of font vendors reasonably happy.</p>
      <p>Cheers,</p>
      <p>T</p>
