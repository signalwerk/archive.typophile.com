    html: |-
      <p>“<a href="http://www.w3.org/TR/access-control/">Cross-Origin Resource Sharing</a>” is like “referrer checking” - it is a way for webservers to refuse to send files to browsers, such as when the browser is loading a page from another site that links to files on your site. </p>
      <p>For fonts, it means that if foo.com publishes a page with a @font-face font linked, bar.org cannot say in its CSS for its pages to be displayed using the font available from foo.com - well, bar.org CAN say that browsers should download the font from foo.com, but foo.com won’t send it to them. </p>
      <p>However, for a site like openfontlibrary.org, it is possible to configure the webserver so that it allows cross-origin resource sharing with other sites.</p>
      <p>I hope the difference between this and EOT root strings is obvious; the effect is nearly the same, but the means are starkly different.</p>
    html_clean: |-
