      <p><em>That’s already done.</em></p>
      <p>I’m not convinced that it can’t be undone. The only reason I see that ‘it won’t go away’ is that there are people saying so, and no one has yet come up with an acceptable alternative. But Thomas makes a good point: so long as Microsoft hold out against TTF/OTF linking, it isn’t a big problem. The browser makers are very, very keen in interoperability, which is why Opera et al are trying to make their possible support of a second webfont format conditional on Microsoft supporting TTF/OTF linking. I think Microsoft should just say no.</p>
      <p>One of the lines along which I am thinking is something like this: the sfnt format is extensible, so extend it to include the gates and bulkheads necessary to make it an appropriate format for web fonts. I have no objection to TTF/OTF being the web font format if TTF/OTF fonts come with optional gate and bulkhead systems, of which something like your perm table or an embedded electronic EULA table would be one example (others would be compression, domain-linking, single-origin linking, etc. What I object to is putting these gates and bulkheads into a <em>different</em> web font format but still supporting TTF/OTF as the ‘free font’ format.</p>
