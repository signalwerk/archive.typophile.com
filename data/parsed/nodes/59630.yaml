      <p>This seems to me a bit like climate change. The time to act to accomplish a meaningful solution and prevent unfortunate consequences may have passed years ago, but we’ve mostly been talking since then. Now changes we don’t like are upon us and, at this last minute, we start scrambling around trying to patch together a solution suggesting things like EOT many didn’t want to have anything to do with a few years ago - and that, at best, may afford only temporary shelter, easily blown away.   </p>
      <p>I’m not suggesting nothing should be done - but let’s be realistic about what can be accomplished at this late stage. TTF/OTF linking is already starting to happen - it’s not going to go away.</p>
      <p>Adding something like David’s PERM table or an EEULA table to the OTF spec should not be that difficult - though I think there needs to be a fairly immediate deadline for specifying the layout of this. Font developers and vendors could then, without too much difficulty start adding this table to their fonts - and begin trying to persuade at least some browser vendors to make use of the additional embedding bits etc. contained in the table. This table would be useful whatever the eventual font format(s) browser vendors decide to support.</p>
      <p> - CF</p>
