    <p>Jonathan Kew of XeTeX fame is now working at Mozilla, and <a href="http://markmail.org/message/wuhycuhwzxuwboua">on the </a><a href="mailto:www-font@w3.org">www-font@w3.org</a> mailing list posed a simple poll:</p>
    <p><em>(A) FONT VENDORS:</em></p><em>
    <p>If there is a W3C recommendation for web fonts that specifies</p>
    <p>* internal compression of the font data (presumably based on MTX or ZOT ideas, but details TBD), and</p>
    <p>* same-origin checking, with CORS to allow controlled relaxation of restrictions, similar to how Firefox 3.5 deals with TTF/OTF fonts,</p>
    </em><p><em>would you be willing to license your fonts for use in accordance with such a standard?</em></p>
    <p>Please post your thoughts here :-)</p>
