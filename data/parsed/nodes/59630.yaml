      <p>David, while we’re talking about permissions, Microsoft, Mozilla, Google, Opera and others are engaged in a browser market dominance struggle in which web fonts are apparently the new front line. In the past few days, there have been almost 300 messages on the W3C font discussion list — after an average of about two messages per year for the past decade —, much of it acerbic, accusatory or simply hostile. If there’s going to be a consensus, I suspect it will involve two web font formats: both EOT and TTF/OTF. The former necessary for compatibility with existing versions of Internet Explorer, and the latter probably becoming the more common format. What’s necessary to get that consensus is for MS to support the TTF/OTF solution alongside EOT, which I’m not currently holding my breath on, but it is possible. [I suppose MS might succeed in holding out for other browsers to support EOT, but we’d still end up with dual formats, since the other browsers would continue to support raw TTF/OTF with or without the kind of mechanisms being discussed in this thread.]</p>
      <p>The TTF/OTF implementations that already exist (Opera, FireFox 3.5, ?) link to raw TTF/OTF font files and presume that only freeware or other fonts with open licenses will be used, i.e. fonts for which protection is not considered necessary. What is now being discussed are mechanisms to make this format palatable for font owners (not just font vendors but also e.g. publishers with custom fonts). These are optional mechanisms that could be added to the existing TTF/OTF format solution without breaking existing implementations for raw fonts, and introducing no new data that browsers would be obliged to handle, while providing some safeguards (e.g. compression and/or obfuscation) and limitations (single-origin linking, i.e. the font must reside on the same server as the webpages that use it).</p>
      <p>Something like your ’perm’ table seems to fit nicely within this scheme, in that it provides permissions information while not requiring the browser to do anything with this new data.<br>
      ____</p>
      <p>That’s what’s happening on the web font format standards front, which seems to me the most important thing to watch because its the only front on which we have any hope of a limitation of the possible implementations (instead of a format war in the market, à la HD video formats).</p>
      <p>Then there are the independent solutions being put forward by TypeKit, Kernest and presumably others lurking in the wings. But I think these need to be considered in terms of services rather than formats per se. The format used by these services may have some impact on whether one chooses to license fonts for use by these services, but ultimately this is going to be a matter of contractual agreement rather than format permission.<br>
      ____</p>
      <p>Back to the original survey question:</p>
      <p>I’m not a font vendor, i.e. the distribution licensing terms or permissions of the fonts I make are generally determined by my clients, not by me. So the question as originally posed doesn’t really address me. But if it is rephrased as ’Would I advise my clients for or against such a web font format?’ then I think the answer is positive: I would advise in favour of this format. The single-origin checking is the kicker. If the main defence against illegitimate use of web linked fonts is going to be licensing policing, then there has to be a mechanism that makes it possible to determine whether a usage is legitimate or not, i.e. to identify who is using the font and where. Compression is probably in everyone’s interest in a web font format, just as it is in graphics, video and audio formats.</p>
