      <p>&gt;Please post your thoughts here :-)</p>
      <p>I’m not sure what “internal compression” means. But I think compression of font files should be driven by external factors like, is it required? what’s the document need? and what can the UA use? ...and then compress that (that being a font with no additional glyphs or tables), as required.</p>
      <p>CORS sounds pretty good, but I’m concerned that nearly every week (besides a new format being proposed), a new linking technique surfaces. </p>
      <p>I, and many others now, feel that the only way to address all of these issues at the foundries is to describe permissions and recommendations in an OT table, (where the w3c is not required to act), but I’m having a devil of a time finding all the existing linking possibilities, documenting then in terms of their capabilities and requirements and putting fields in the table proposal to allow their inclusion in our excellent scheme. </p>
      <p>Cheers!</p>
