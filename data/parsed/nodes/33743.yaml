  html: |-
    <p>I've only been working with FontLab 5.02 (PC version) for a short time and I keep getting this message when I try to save an OpenType font:</p>
    <p>ERROR: There was a problem while compiling OpenType font. Final .otf font is not saved. Please, check OpenType features definition for errors</p>
    <p>It's probably a newbie error, but it's got me baffled.</p>
  html_clean: |-
