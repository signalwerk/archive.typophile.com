    html: |-
      <p>You must define and build your open type font names in File&gt;Font Info to avoid this error. I had the same issue, just filled out the font info, and oila! No more mysterious error. My kerning and ligatures started working in Illustrator as well. Apparently this error has nothing to do with the open type features as the error suggests. </p>
      <p>Jay</p>
