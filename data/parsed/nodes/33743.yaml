  - id: 202446
    user: 1844
    date: 2007-05-13T16:59:00
    date_raw: 13 May 2007 — 4:59pm
    votes: null
    html: <p>Try to uncheck the option "Export old-style non-OpenType kern table". Kerning in OpenType CFF fonts (.otf) should be done via the kern <strong>feature</strong>, not via the kern <strong>table</strong>.</p>
    html_clean: <p>Try to uncheck the option "Export old-style non-OpenType kern table". Kerning in OpenType CFF fonts (.otf) should be done via the kern <strong>feature</strong>, not via the kern <strong>table</strong>.</p>
