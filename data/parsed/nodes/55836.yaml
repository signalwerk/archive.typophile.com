    html: <p>I just posted a sample of <a href="https://www.flickr.com/photos/stewf/16243939426/" rel="nofollow">Winchester</a> along with some more info on the roots of this type, which goes back to Nesbitt’s “Gothic”&nbsp;of 1838. As Mark mentions, OL Smokler is just one digital interpretation of this wood type. This album art likely used phototype, such as Winchester or Morgan No. 25.</p>
