    html: <p>It's an old wood typeface. The one on the sample matches a version from the film font days called Winchester. The closest match I can find is Dennis Ortiz-Lopez's <a href="http://new.myfonts.com/fonts/ortizlopez/ol-smokler/" rel="nofollow">OL Smokler</a>. There are some differences, but it's basically the same. I think he created the lowercase, which didn't exist in the original.</p>
