  html: |-
    <p>I've found several lists online and on typophile of typography/design books, however a lot of them seem to be picture books with little foundation…</p>
    <p>Here's my list of books I consider essential - anyone have any more?</p>
    <p>Joseph Muller Brockmann - Grid Systems in Graphic Design</p>
    <p>Jan Tschichold - The New Typography</p>
    <p>Norman Potter - What is a Designer?</p>
    <p>Emil Ruder – Typography</p>
    <p>Robert Bringhurst - Elements of Typographic Style</p>
    <p>Notable mention to<br>
    Willi Kunz – Typography:Formation + Transformation<br>
    (Just a stunning book)</p>
