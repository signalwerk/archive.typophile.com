    date: 2005-05-25T04:18:00
    date_raw: 25 May 2005 - 4:18am
    votes: null
    html: |-
      <p>This came in from Cornel this morning:</p>
      <p><em>yes i designed both typeface and logo when working at neville brody studio some time in the late 80s.<br>
      the typeface was designed starting from scratch, without looking at any particular existing typeface for reference.<br>
      neville brody was working on it too, for a bit.<br>
      the letters were hand-drawn and we then rephotographed and cut and pasted them for use.<br>
      there is a very basic digital version which was done a couple of years later, buried deep on some syquest cartridge.<br>
      it was never developed into a full font, and there is no lower case for it.<br>
      i haven't looked at this font for years.</em></p>
      <p>See? You were right, Dan. I was wrong. ;-)</p>
    html_clean: |-
