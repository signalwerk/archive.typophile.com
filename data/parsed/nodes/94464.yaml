      <p>So is there a 'best practice' for base spacing?<br>
      For kerning: is it better to kern using brute-force or kern king?<br>
      If I use one method (brute-force), should I not use the other (kern king)? Or is it a case of the more the merrier? </p>
      <p>What other 'best practices' should I be following?</p>
