    html: |-
      <p>Yes, I did misunderstand - sorry.</p>
      <p>The relationship between "base spacing" and kerning is more complex than it seems. The old maxim of "space first, then kern" isn't useless, in fact it might be a great way for a beginner to get a handle on spacing, but in the end it's limiting. All these steps in type design that seem discrete are in fact highly interdependent, but since they do have to be performed discretely they end up being highly iterative, with experience helping you save much iteration.</p>
      <p>Situations where kerning will be off are pretty much the same situations where users won't notice -and if they notice they won't much mind- if the spacing isn't just right. So there's a benefit to accounting for the eventual kicking-in of kerning when you're doing the spacing. And then there's the hidden truth that even the "black bodies" should be affected by spacing... and hence even kerning! For example one can't make a good lowercase /r in a space-less vacuum.</p>
      <p>hhp</p>
