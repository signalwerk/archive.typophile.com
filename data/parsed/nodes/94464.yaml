      <p>Thanks hrant - perhaps you misunderstood. I didn't say it "works" with RSB and LSB at 50 (it doesn't). I just used 50 as a default. But your concern brings up a good question: Should I be setting the font's main spacing through side bearings or kerning pairs? I think the answer is to set spacing with side bearings wherever possible, and use kerning pairs only for specific issues (like AV). Is that right?</p>
      <p>Also - no, I'm not auto-tracing the font. I've actually spent an inordinate amount of time tweaking, correcting, and perfecting the shapes in Glyphs. I used Illustrator at first because I hadn't bought Glyphs yet. </p>
