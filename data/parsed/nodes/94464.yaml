    <p>Hello all, </p>
    <p>I'm in the process of designing/building a font and It occurred to me that I don't know what best practices I should be following, if any. I'm sure everyone has their own preferences, but in general...what does your process look like? For example, here's what I have done so far: </p>
    <ol>
    <li>Sketched key font glyphs</li>
    <li>Scanned and drew glyphs in Illustrator (didn't have a font program yet)</li>
    <li>Bought a copy of Glyphs (love it) and imported all glyphs into the app.</li>
    <li>Added extended Latin characters, punctuation, and numerals. Printed, tweaked, printed, etc.</li>
    <li>Set side bearings (LSB and RSB) to 50 units on every glyph. A few glyphs have different side bearings, but 99% of the font is set at 50.</li>
    <li>Set kerning classes on all upper/lowercase letters. Didn't do it on numerals or punctuation. </li>
    <li>Kerned all characters using multiple methods: <a class="freelinking external" href="http://logofontandlettering.com/kernking.html" rel="nofollow">http://logofontandlettering.com/kernking.html</a> and ebensorkin's brute force test: <a class="freelinking external" href="http://typophile.com/node/30960" rel="nofollow">http://typophile.com/node/30960</a></li>
    <li>Set some long text, printed and reviewed on screen</li>
    <li>…and…hated it. Deleted all kerning pairs –&nbsp;started over.</li>
    </ol>
    <p>So at this point, I'm feeling pretty stuck. I want to design multiple weights for the font, but I don't know if I should do that first, or kern the font <em>before</em> working on the other weights? What kerning method should I use? Should I set up kerning groups for punctuation and numerals? What is your process? </p>
    <p>Thanks in advance!</p>
