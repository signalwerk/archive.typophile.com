    html: |-
      <p>I can't tell which kind of Granjon it is. I'm sure it's a Granjon because I know for sure that Einaudi printed books using only two typefaces before the Garamond of F. Simoncini: Bodoni and Granjon. I'll try to ask some old typographer of the Editor to get more precise information about the question (and maybe a sample of the alphabet).<br>
      c.</p>
      <p>a further note on the einaudi garamond: it has really nothing to do with the simoncini garamond you can purchase for example from adobe, linotype, scangraphic, urw or e&amp;f. this one's a real masterpiece, drawn so close to the metal exemplar.<br>
      c.</p>
