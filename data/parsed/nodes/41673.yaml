    <p>Hello Folks</p>
    <p>I wonder if you could help me identify the following font. It was used in Eugenio Montale's second book of poetry, Le Occasioni. It was printed by Giovanni Capella, and the publisher Einaudi has a Turino address. It was printed in 1945.</p>
    <p>thanks Eluard.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Quasimodo005_6212.jpg"></div><p></p>
