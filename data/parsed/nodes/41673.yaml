    html: |-
      <p>Hi folks,<br>
      The font used for this edition of Montale's Occasioni is Granjon (metal). Einaudi uses Garamond Simoncini from 1958; a true digitalisation of the metal type designed for Einaudi by Francesco Simoncini at the Traldi Industries in Bologna (made by Apple Computers in the early 90's) is owned today only by those few who work for Einaudi. That's my case: I've got the MacOS and the Win Type 1 and TT version of the Einaudi Garamond font which includes also CE set and SC (known as Garamond-100) but obviously I can't distribute it. I do declare it's just of the best text font you can use on a QuarkXPress or InDesign layout!!<br>
      c.</p>
