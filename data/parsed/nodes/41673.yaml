    html: |-
      <p>Do you know what Granjon was used? Can you show us a sample of the alphabet? Estienne was based on Granjon. Other Granjon samples I have seen did not match the posted sample, in particular the long center arm of the E, and the ascender and descender length. The R of Estienne is also supposed to differ from Granjon.  G.W. Jones also designed the Linotype version of Granjon shown in Jaspert and designed Estienne a few years later.</p>
      <p>- Mike Yanega</p>
