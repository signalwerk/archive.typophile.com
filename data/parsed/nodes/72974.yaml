    <p>This is really embarrassing, but I don't know how to kern.</p>
    <p>I went to a state college in Georgia (what I could afford), where 1/7 instructors taught students how to kern properly, a Typophile himself. That being said, I didn't have him as an instructor and managed to go through college without anyone mentioning the correct way to do it. </p>
    <p>Even after school with much reading and curiosity, I never knew what exactly I was doing wrong. I constantly go back and forth thinking something looks uneven, end up pulling space out of places that need it, confused if I threw my tracking off because I took out too much etc., etc. I see people look at type that I think looks fine, pointing out the kerning flaws I never would have noticed. I see people flipping type upside down, measuring...</p>
    <p>What's so embarrassing about that you ask? I've worked for the best of the best in design— the best in the world (one of the big firms you're probably thinking of). This shouldn't be an issue at this point in my life and I really need some help with resources so I can learn. </p>
    <p>I've looked at books such as Thinking with Type and A Type Primer but I find myself in situations where things still don't look right and I'm confused where I went wrong.</p>
    <p>Please help :(</p>
