      <p>There are really several ways to approach kerning. Different for small text or for headlines, Serif or Sans fonts, Regular or Italics. But from experience, what worked for me as essential every time is prior to working on kerning, working the hardest on the actual basic spacing of each character. Trying out the most likely spacing that will work in most cases for that particular font. Indeed flip it, make negative space more visible and comparable, measure, even tweak the design, print out, look from a distance, stand on your hands...</p>
      <p>And then when you think the spacing is right, only then use kerning to compensate the shortcomings of each font. </p>
      <p>You see, once you study and measure to adjust the spacing, you have a much much clearer *feel* of the right kerning needed. And most likely you'll need less kerning pairs than you thought.</p>
      <p>Good luck,<br>
      A</p>
