      <p>OP: back in the day when I used to spec, check, and correct/respace many, many headlines, Nick's "Manual" version would be a great "tight no touch" setting from the best NYC jobbing typographers. But James' comment is also valid, since the principle of optical spacing is balance above all else. Yet OTOH, much of the charm of setting a sans ultra tight is the uneven, frankly staccato negative spaces that result. This is exactly what is abhorred by those that encourage touching and overlapping letters at display sizes as a far less heinous crime than unbalanced counters. </p>
      <p>I've never seen 100% agreement on "perfect" kerning or display spacing. Check out Michael Harvey's Letterform Design, and Geoffrey Dowding's Finer Points in the Spacing and Arrangement of Type, and Herb Lubalin's work with Benguiat, Carnase and DiSpigna for the touch, overlap, and razor-blade-edit-the-junctions school.</p>
      <p>Start with a target interletter space interval and try to replicate that throughout a word and then a phrase, adjusting wordspacing, then linespacing as needed.</p>
