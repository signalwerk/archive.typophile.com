    html: |-
      <p>@typogirlie6</p>
      <p>Kerning is completely subjective.</p>
      <p>But, I think most individuals who have trained their eyes, and art directors or those in this business, can tell when a typeface is poorly spaced or fit improperly. Hopefully, if the type designer has done a good job, you shouldn't have to adjust the kerning that he/she has incorporated into their font(s). However, as I said, this is purely subjective, and even though the type designer does a good overall job kerning for average text usage and general overall body copy reading, does not mean that you cannot adjust the spacing or relationship between letters based on your sense of aesthetics.</p>
      <p>That being said, the easiest way to review and adjust letter kerning combinations is to type out a word that uses a wide range of letters (with ascenders and descenders) in order to visualize and get a good sense of what id going on.</p>
      <p>I have always used this phrase in particular when kerning:</p>
      <p>"Haightens 3246"</p>
      <p>This short phrase has a good combination of letters (with a few numerals) which will give you a good overall sense of word spacing in the font.</p>
      <p>Then, I would change the first letter "H" to every single other capital letter... (A, B, C, D, etc.) all the way to cap Z.</p>
      <p>Also, change the second letter after each capital (a, b, c, d, etc.) all the way to z.</p>
      <p>And observe the spacing and adjust (kern + or minus) when you feel that something needs an adjustment.</p>
      <p>However, in my opinion, I think that many people use much too much kerning.</p>
      <p>Pay particular attention to these cap to lower case combinations (Fa, Ka, La, Pa, Ra, Ta, Va, Wa, Xa, Ya).</p>
      <p>And don't forget the punctuation between all capitals and lower case.</p>
      <p>These usually require an adjustment depending on the point size when typesetting.</p>
      <p>And, that is pretty much it.</p>
      <p>However, if the initial font was spaced incorrectly or poorly, you may need to use the default 'optical' fitting scheme in most applications, or go back and adjust the 'key' letters first.</p>
      <p>These are capitals... "HHOHOO", l'case "nnonoo" and "00" two zero's.</p>
      <p>Unless these square to square, and square to round, and round to round, are not set up properly, kerning the entire font manually will be a nightmare.</p>
      <p>I hope you find this little lesson helpful.</p>
      <p>And do not second-guess your own individual sense of what looks good and what does not.</p>
      <p>With time, anyone can become better at kerning. Good luck.</p>
