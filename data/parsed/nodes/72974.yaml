      <p><cite> &gt; Thanks Nick. I'll work with "Optical" and see what I can figure out. Studying is exactly what I need right now.</cite></p>
      <p>Beware! — comparing and learning from “Optical” will teach you what an algorithm thinks it knows, not what an experienced typographer or type designer knows. </p>
      <p>Adobe’s “Optical” spacing is a misnomer. A designer sees that and thinks “Yes, of course, now why wouldn’t I want this setting to be optically correct?” </p>
      <p>But it is not. This ‘feature’ completely overrides the fitting and spacing that the type designer has incorporated into a font and supplants it with it’s own assessment. It is a computer algorithm, and it is frequently way off base, IMNSHO.</p>
      <p>I have ranted about this elsewhere before.</p>
