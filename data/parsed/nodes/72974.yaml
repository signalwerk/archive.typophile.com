      <p>I have a few suggestions. </p>
      <p>When you find yourself frustrated, take a deep breath and step back. Sometimes you'll make mistakes that other people catch - that happens to all of us and is just part of being a human. Don't beat yourself up over it. And you definitely don't want to overthink your kerning, or you'll stop seeing the forest for the trees. </p>
      <p>That might be a good metaphor for kerning... you want to focus on the forest, not the trees. Focus on the piece you are kerning as a whole, and try to find a good rhythm of the spaces within it. Try to think less of the letters as letters, but as shapes. If one of those trees is too far away from the other trees, just get it as close as you can without breaking the rhythm of the rest of the forest. If a particular pair is really bothering you, put it in a long string of Hs and Os so you can get a feel for the rhythm without getting caught up in reading the words. But then check the pair back in the word (and then the entire piece) it's in to make sure you haven't kerned the pair too tightly. Don't worry about measuring. It's a visual process, not a mathematical one. </p>
      <p>Hard to describe without images... but I think the suggestions here are good so far. </p>
      <p>I hope this helps.</p>
    html_clean: |-
