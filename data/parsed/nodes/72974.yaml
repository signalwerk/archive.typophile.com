      <p>First question: Is what you are setting small enough (in length) where you can be expected to kern everything by hand? Or is a lot of text involved, where the only sane thing is to use programmatic kerning?</p>
      <p>Second thing: There is a lot of bad advice floating round out there. While kerning strictly occurs between two letters, the whole point is to make the words fit, look, and read better. General advice about, say, how much to kern an "A" after a "W" depends on what follows that "A". </p>
      <p>Which is the reason for my first question: if kerning is programmatic, you don't know. It has to work for WAVE as well as WAREFARE. Programmatic kerning has to be looser, the kern must accommodate any following character. Etc. On the other hand, if you are adjusting things by hand, you can use slightly different amounts of kerning with the same pair, as that pair falls in different words.</p>
      <p>The only exception to this is when reading the words is not as important as the graphic design. It does happen, but not as often as some designers think.</p>
      <p>Opinions by me.</p>
