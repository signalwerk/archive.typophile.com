    <p>Hello,</p>
    <p>This café is to be named Café Riva at Inverkip Marina, Scotland.</p>
    <p>The proposed identity is fairly modern that uses graphic interpretations of a cup of coffee and yacht sails. You will notice that it uses Avant Garde Gothic alternatives. I love them but have never used them in a logo before.</p>
    <p><a class="freelinking external" href="http://i38.photobucket.com/albums/e112/smitchell7/Graphic%20Design/CafeRiva-Concept01.jpg">http://i38.photobucket.com/albums/e112/smitchell7/Graphic%20Design/CafeRiva-Concept01.jpg</a></p>
    <p>The shop front picture is not the actual café, it’s just an example of how it could look.  </p>
    <p><a class="freelinking external" href="http://i38.photobucket.com/albums/e112/smitchell7/Graphic%20Design/CafeRiva-Concept02.jpg">http://i38.photobucket.com/albums/e112/smitchell7/Graphic%20Design/CafeRiva-Concept02.jpg</a></p>
    <p>This identity is still in development and I have other ideas, but felt this one was the strongest. I would appreciate any constructive comments please.</p>
    <p>Thanks</p>
