      <p>We probably seen, lot of coffee cup, sun, smoke logo for ages. I don't mean the new logo is bad, but people would recognize it as coffee logo right away. If you want to break away from it, you could use other image, as a symbol, metaphor, etc that represents the business. Look at Starbuck for example.</p>
