      <p>Thanks the for comments Andreas. Yes, Avant Garde is everywhere and I shouldn't have used it but it suited the sail idea quite well. Anyway, the client has deemed this solution too modern. So it was back to the drawing board.</p>
      <p>I have now proposed a more retro and continental look with subtle nautical references. The restaurant will offer Italian style food, coffee, etc.</p>
      <p>The interior designer is proposing a classic American style, with a minimal slightly Shaker feel. No clutter, a nice clean look.</p>
      <p>A earlier comment in this thread stated the accent was missing from the 'E' in Café. This inspired me to make it boat shaped.</p>
      <p>The 'E' acts as pier found at marinas. Abstract I know, but most folks should see the boat shape at least. Maybe it's too big, I need to play around with it.</p>
      <p>If the client likes the approach I will tweak it and explore more colourways, and perhaps typefaces. The figure of 8 knot in the divider line needs more work also.</p>
