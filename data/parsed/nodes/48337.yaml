      <p>Monotype (and many other sites) sell the complete Adobe font catalogue, too. They put together a printed catalog listing all of the fonts in their Adobe collection a few years ago. It might now be 100% up to date (i.e., Arno Pro and Hypatia Sans might not be inside it), but I'll be it is close.</p>
