      <p>Agree with Nick. Definitely <a class="freelinking external" href="http://typophile.com/node/99936" rel="nofollow">DeVinne</a>. For the /n issue, may it's a 180° rotated /u.<br>
      More alternatives (some including a roughen effect): <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/hand-stamped" rel="nofollow">Hand Stamped JNL</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/publication" rel="nofollow">Publication JNL</a>, <a class="freelinking external" href="http://www.fontbros.com/bundles/1608" rel="nofollow">Charter Stamp HF</a></p>
