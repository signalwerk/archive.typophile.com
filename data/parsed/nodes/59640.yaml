    <p>Hi there, since I've become involved with the fine art of typography, I've stumbled into some great looking historical types which, in many opinions, dind't receive the appropriate digital version yet - or haven't been digitized at all. Here are my first choices:</p>
    <p>1. The great VAFFLARD "First Manner" type - a more humanistic cut on the neoclassical genre. Bill Troop worked on it in the Nineties and has been so kind to show me his versions, both in the display and text size. We've talked about it one year ago in this thread:</p>
    <p><a href="http://typophile.com/node/47453">http://typophile.com/node/47453</a></p>
    <p>I really hope Bill can get to a full working version, someday.</p>
    <p>(In the meantime, I'd suggest to take a look at his recently released Didot Display <a href="http://new.myfonts.com/fonts/canadatype/didot-display/">http://new.myfonts.com/fonts/canadatype/didot-display/</a> and Didot Headline <a href="http://new.myfonts.com/fonts/canadatype/didot-headline/">http://new.myfonts.com/fonts/canadatype/didot-headline/</a>, two titling types in the same vein).</p>
    <p>2. FONTANA, designed by Giovanni Mardersteig for the Collins dictionary in 1936 - a variation on Baskverille. A small example can be seen here: <a href="http://www.typotheque.com/articles/microtypography_designing_the_new_collins_dictionaries">http://www.typotheque.com/articles/microtypography_designing_the_new_col...</a>.</p>
    <p>3. DANTE, again by Mardersteig. The existing digital version is good, but it seems to lack the "presence" of the original metal version, which can be seen in this Flickr set by Florian Hardwig: <a href="http://www.flickr.com/photos/hardwig/2402240423/">http://www.flickr.com/photos/hardwig/2402240423/</a></p>
    <p>4. CALEDONIA, by W.A. Dwiggins. The "New Caledonia" version and the Bistream Transitional 511 (I had the chance to test the latter) seems too weak and miss old style figurals.</p>
