      <p>Agree that if you make enough changes to Basilea you could end up with this confusing logo.<br>
      The wordmark designers would have had access to the Image Club Graphics version, produced under the name Basilea, and the Opti version, produced under the name Susan. I compared the glyph outlines and find that they are quite different. Since there do not appear to have been any other digitizations from the era -- assuming that Sousanna by Novel Fonts is a knockoff of Susan -- it would seem that Susan is one of the few fonts that Opti produced independently rather than pirated from other fontmakers.<br>
      As for the later fonts, MarkusLow is inspired by Basilea but the R differs from the original alphabet as shown at <a href="http://typophile.com/node/64403" title="http://typophile.com/node/64403">http://typophile.com/node/64403</a>. LHF Kellie Ann is odd -- the C is angular -- and is not sold on the Letterhead website.<br>
      Don</p>
