      <p>There might be an almost monoline font with Copperplate Gothic tiny serifs, with the top of A having a serif on the left, with the right-hand arm of the Y forming a continuous stroke with the tail,  with the R having a high waist and a center bar that almost leaves a gap with the vertical, etc., but ....<br>
      First registration of a LYCRA wordmark in this style that I found was from the mid 1990s.</p>
      <p>Don</p>
