    <p>Trying to identify the rounded condensed gothic font used in West Elm's most recent summer catalog (and on the website). I thought it might be a Trade Gothic Soft Rounded font (<a href="http://www.linotype.com/617040/tradegothicnextsoftrounded-family.html?subviewmode=FONTS&amp;samplestr=READING" title="http://www.linotype.com/617040/tradegothicnextsoftrounded-family.html?subviewmode=FONTS&amp;samplestr=READING">http://www.linotype.com/617040/tradegothicnextsoftrounded-family.html?su...</a>), but it is not quite correct.</p>
