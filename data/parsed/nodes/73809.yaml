  html: |-
    <p>Hi.  I'm building a website for a local business, and I'd like to reuse the font used in the logo.  The logo was professionally done, and the individual who made the logo would not disclose the font used.  All the free online font identifiers I could find have failed me, and I was hoping maybe someone here could assist.</p>
    <p>I've attached the logo.</p>
    <p>Thanks for reading, even if you're not able to help.</p>
