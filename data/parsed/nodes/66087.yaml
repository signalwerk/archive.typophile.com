    html: |-
      <p>What you need to do is keep flipping until you reach the very last page with the credits, and in the second column from the left, right underneath the paragraph with <em>"Contributors this issue"</em>, it reads:</p>
      <p><em>"Typography"</em><br>
      Proforma Medium, Helvetica Rounded Bold,<br>
      Clarendon Regular, News Gothic Regular<br>
      and Bold, Display typeface for Eye ##:<br>
      &lt;the name of the typeface and foundry&gt;</p>
      <p>:^)</p>
