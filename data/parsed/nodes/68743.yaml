    <p>Hello everyone!</p>
    <p>I've already read Luc de Groot's stuff and these forum's related topics, but I'm still wondering about this.</p>
    <p>What's the best way to calculate the values between two <a href="/wiki/weight" class="freelinking" rel="nofollow">weights</a>?</p>
    <p>For instance: I have a Harline and a Heavy cut as my two extremes and I want to generate instances for the other weights. The thing is that I was these instances to be optically appealing.</p>
    <p>Thank you in advance.</p>
  html_clean: |-
