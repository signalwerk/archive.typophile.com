    html: |-
      <p>Interpolate your regular master with the vertical stem weights set to whatever weight would be appropriate for your typeface (if you don’t know what weight to use, get an appropriate height/width ratio from a similar design). Use anisotropic interpolation to get horizontals as close as they can be without being too screwed up (read the software documentation for more on anisotropic interpolation, or google the Superpolator video from Robothon). Depending on how different your extremes are you may need to do this multiple times to get the uppercase, lowercase, figures, etc.. Put the resulting fonts back together, refine the forms and proof them as you would normally. From there either add the regular master to Superpolator or create two new MM fonts, one for light extremes and one for heavy extremes. </p>
      <p>You’ll also probably find that certain characters, such as <strong>y</strong> need to be draw differently on the extremes. If using multiple MM fonts you can use the appropriate design for light/heavy versions, in Superpolator just create alternates that will interpolate and use them to replace the missing incompatible glyphs.</p>
