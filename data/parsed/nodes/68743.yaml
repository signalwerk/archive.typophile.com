    html: |-
      <p>First, you aren’t going to interpolate optically appealing weights between two such extremes; you’ll need a properly balanced regular weight in there somewhere or the horizontals and curves coming from them are going to be a mess. The upside is that if your extremes are well-drawn you can get pretty close by using anisotropic interpolation to start a regular master and finishing it manually. </p>
      <p>As for determining your in-between weights, it comes down to how you want the final fonts to work. If you want a more contemporary feel create a lot of instances based on whatever mathematical relationship that you like (Lucas math, or just ten or twenty even steps, etc) and start testing them against each other to see what works. Then tweak/refine/repeat. Or you can study the proportions in older typefaces, compare them (spreadsheets work well) and then start calculating what would work well in your design. In the latter case you won’t get the smooth stepping that comes from the former, but there’s nothing wrong with that if it’s what you desire.</p>
