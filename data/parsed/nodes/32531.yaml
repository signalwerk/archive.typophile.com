      <p>You seem to be in my line of work -- book composition, with the need to do font work in FontLab, and do image work in Photoshop. We're even moving to InDesign.</p>
      <p>As to platforms, what I would suggest is to determine which platform is most apt to maintain support for programs you need, unless you want to add programing work to font work. For the basic programs this isn't an issue, it is additional programming you might need. An example might be High Dynamic Range Compression as a plug-in for Photoshop (something better than the little routine you get in Photoshop CS2 by going up to 32 bit &amp; then back down to 16 bit).</p>
      <p>By in large, most software is now written for Windows, and adapted for the Mac, for the simple reason that that the PC market is bigger.</p>
      <p>Too, most authors write on a PC -- same reason. On the other side of the coin, most graphic designers work on Macintosh, so if you wanted to share files -- at least before InDesign &amp; OpenType -- that meant  a Mac. Of course, sometimes it's nice to say "sorry, we can't share files."</p>
      <p>I've been doing this kind of work since 1980, and over the long haul, find these more important matters in book composition than the things you mention.</p>
      <p>One note: I don't think you can judge type on the screen. Printing it out on a laser printer is the  minimal step, and you don't really <cite>know</cite> what it looks like until the printed book comes in. If the publisher doesn't provide a complimentary copy, see of they'll sell you one at a discount. This will better help you judge word spacing, and any changes you make to a font. </p>
      <p>Also, if you're preparing the art, you better learn the papers the books will be printed on, and determine the dotgain for both particular paper(s) and printer(s). If that's too much, at least the different kinds of papers, &amp; a few grades -- with uncoated paper, offwhite &amp; white, various grades of matt coated stocks, &amp; glossy coated. But always best to work with the actual sheet being used.</p>
