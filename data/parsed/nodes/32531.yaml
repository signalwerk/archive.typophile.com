      <p>Sounds like you're leaning toward Windows due to lower price of the hardware.</p>
      <p>If you are a serious graphic professional, then you need serious hardware, and, at that point, there really isn't much (if any) of a price difference between Macs and most name-brand PCs.* So, do carefully compare them both feature-for-feature.</p>
      <p>Especially with laptops. Apple laptops are actually surprisingly affordable when you take into account the full set of features.</p>
      <p>The other major advantage to Macs right now is that ease in which you can run multiple OSes at the same time. I have XP running seemlessly on top of OSX and you can toss linux on there as well. That's great for anyone that needs to test their product on multiple platforms.</p>
      <p>"I would just like to hear rational arguments for and against each platform."</p>
      <p>I use both Windows and OSX daily. Both are fine. And, really, it's a matter of personal choice for most folks.</p>
      <p>* = at least, not in the US. Admittedly, it seems as if some other countries get a bit screwed on Apple's pricing system overseas. In that case, if the price is right, just go with a Windows PC.</p>
