      <p>You are going to find a split of opinion on platform pretty much by who uses what. There is not enough difference in the uses you explain to really matter much. There are crossplatform versions of the Adobe Suite, FontLab, and the Microsoft Office suite so sharing files is not a problem. You will find service issues on both sides. These are more a case of who you deal with directly, not which platform. Maybe Si has it right with the "both on one" scheme he described? The amount of money for truly comparable systems is not enough to be an issue. Higher monitor resolution reduces pixel size on both platforms so that is a wash. Adjust your interface preferences to increase typesize as needed. It is not that tough.</p>
