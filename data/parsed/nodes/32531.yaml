      <p>Yes, the reference is to MST3K, which in turn was a reference to a Lou Reed song. I was a big fan of the show and almost got some work out of them. It didn't work out, but I did get a tour of the facilities and got to meet most of the people who worked on the show, which was way cool, too.</p>
      <p>I really like this Parallels coherence thing. The big problem with running two OS's at a time is that their interfaces--mainly their desktops--get in each other's way. In coherence mode, the Windows desktop disappears giving the illusion that Windows apps are running on the Mac desktop. And it's not just an illusion--you can drag-and-drop stuff between the two OS's windows.</p>
