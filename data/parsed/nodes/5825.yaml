    html: <p>Yves, I tend to agree with you. That l.c.'r' looks like a rather awkward modification. Does it really look familiar to you? The font is very monotone, and the 'g' doesn't look like it fits well. The closest 'g' I found to that so far has been <a href="http://www.myfonts.com/fonts/linotype/titus-ef/" target="_blank">David Quay's Titus</a>. Not much else about Titus looks close, though. I still haven't found anything else with that 'r'.</p>
