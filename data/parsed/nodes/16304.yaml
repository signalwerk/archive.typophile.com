  html: |-
    <p>I've been using Adobe Caslon Pro and noticed that the old style figures have these almost perfectly round 0's. Is this specific to Caslon? What's the history behind this glyph? I rather like it.</p>
    <p>I should note that I am but a humble undergrand student...so if this is obvious...be gentle.</p>
