    date_raw: 19 Nov 2005 — 7:47am
    date: 2005-11-19T07:47:00
    votes: null
    html: <p>Another technique to distingush lower-case zero from a lower-case o is what Hermann Zapf did with AMS Euler. He made the zero slightly egg shaped. Admittedly, Euler isn't a text face, but I think the idea has merit.</p>
