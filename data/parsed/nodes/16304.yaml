      <p>I agree with Héctor here. Sometimes the weight is too light. But for it to work, the zero also must be not really uniform, but only appear to be so on first glance. Adobe Caslon--and the originals of William Caslon--are not uniform circles, but just give the impression of being so. </p>
      <p>The 'bulls eye' ring, as Chris illustrates with his usual humor, is disturbing. To me the on-screen version of Georgia's 0, which looks circular, also works, as you can see in the following. Zero: 0; and oh: o. Alternating in a row: 0o0o0o</p>
  - id: 96223
    user_id: 2663
    user_name: speter
