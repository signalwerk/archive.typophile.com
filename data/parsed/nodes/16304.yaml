    html: |-
      <p>According to Walter Tracy, 'Letters of Credit,' the round 0 in old style numerals follows scribal tradition, which was done to avoid confusion with the letter o. </p>
      <p>Incidently, as is usual in type design, what looks geometrical isn't. In Adobe Caslon old style 0 the inner circle is an oval, and consequently the vertical arches are fatter than the horizontal ones.</p>
    html_clean: |-
