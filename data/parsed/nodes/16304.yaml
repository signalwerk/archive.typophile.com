    html: |-
      <p>On the roundness, I seem to recall something in Smeijers' Counterpunch about 0 being traditionally cut using a drill (not a counterpunch) so that it truly was a perfect circle. I don't know whether, apart from the typographical convenience of distinguishing 0 and o, there was also some sort of almost mystical attraction to using a perfect circle to represent zero.</p>
      <p>I really like the circular and monoline 0, but I think I'm in a minority. The current fashion at least seems to be to use some other device to distinguish oldstyle 0 and o.</p>
    html_clean: |-
