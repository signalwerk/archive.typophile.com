      <p>hi, thanks for your very nice comments / ideas.</p>
      <p>@bobbybobo: I played a little bit with the exclamation mark as person idea - but ended up in thinking that it looks too much like this icons on the mens rest room (sorry) :(<br>
      I have a "inverse" idea with this, maybe I'll post it later.</p>
      <p>@hola: thanks for the suggestions but I miss the "dynamic" element here. But maybe its an idea to see the whole word as a camera and ... hm, I'll think about this.</p>
      <p>@aluminum, spire: yes, I had this symbols in other approaches - but felt the are too much in combination with the excl. mark. Although they would symbolize photography.</p>
      <p>Right now I'm struggling with the mark in another typeface like some of you suggested. Not easy, it tends to loose the simplicity ... I hope I can post some versions later.</p>
