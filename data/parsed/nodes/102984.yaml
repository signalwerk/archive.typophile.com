  html: |-
    <p>I've made a font for a client that has built in underlines.<br>
    The font works well, except for when it is converted to outlines. The space character (simply the underline shape and nothing else) disappears.</p>
    <p>Has anyone ever experienced this or know of a workaround?</p>
