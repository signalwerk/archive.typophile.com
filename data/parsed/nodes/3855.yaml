    html: <p> armenians are koooool... <br> <br>i like your way of thinking... i have some questions though... <br> <br>doesn't the area of the fovea depend on the distance the eye has from the text?.. <br>and if so, then isn't the importance of the boumas (in the parafoveal area) comparatively small (because of having more letters in the fovea)?.. or not?.. <br> <br>another thing is that, to me, readability depends also on the reading habits with which somebody has grown up...  <br>as i can speak for myself, growing up in germany with those clean letterforms and after twenty years getting in touch with my greek roots, greek letterforms appeared disturbing to my eyes... <br>although greek letterforms have more ascenders and descenders, german (well,.. latin) still appears more legible to me... <br> <br>i don't know, if i'm now out of topic, but at least it was a comment... <br> <br>anyway, i'm a fan of yours... <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> </p>
