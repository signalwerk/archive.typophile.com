    html: "<p> thanx for specifying those things... <br> <br>but i have to mention that while i'm reading a text, my eyes are moving... which means that the fovea isn't static... if i stop reading and try to focus on a word, again i have the impression that my eyes are in motion... maybe i need new glasses... the thing i want to say is that, to me, the foveal and the parafoveal areas are overlapping, because a text is meant to be read... and i think those informations we get while reading, reach unconsciously our brain which is still a terra incognita by itself... <br> <br>&gt; This is also why sans serif forms appear more legible than serif forms, but a book in sans is no fun to read. &lt; <br> <br>i guess it also depends on the purpose anybody's chosing between serifs and sans... if you want to read a book, surely serifs help you to keep a fluent flow in your reading... but if you want to read a manual or something more instructional, then i think sans are more suitable... so it's not only about the fun of reading, but also of understanding the content of what you're reading... <br> <br>but again: thank you very much for your research... it's really helpful to have those things on my mind... <br> <br>question: are you teaching anywhere?.. </p>"
