    html: <p> &gt; everything to the right of my nose is peripheral  vision. <br> <br>I think it might not be *that* bad, since the eyes are pretty close*, relative to the span of vision. I suspect your left eye can see about half what your right eye can see anyway. The issue of depth is more significant, but maybe not for reading? <br> <br>* Unless you're a rat. Did you know that rats have a blind area some distance in front of their noses? Very valuable information... if you're an insect.  :-/ <br> <br>Have you found that you tire quickly (compared to somebody otherwise similar to you) when reading a long book? <br> <br>&gt; I'd guess that the fovea would be smaller side-to-side <br> <br>I think the fovea would be about the same size, but the parafovea maybe 75% the size. <br> <br>From what I remember, there have been perception tests done on people with monocular (or highly lateralized) vision, but I don't remember any offhand. <br> <br>What I also wonder is whether there's a *cognitive* issue here, since each half of the brain does different types of tasks, and each eye shares half of its retina between them. There's a book called "The Alphabet and the Brain" which tries to show that reading rightward is inherently more efficient than leftward, irrespective of the writing system (which is related to this issue). I wasn't entirely convinced, but the foundation for the book (studies of lateralization of perception/cognition) is solid. <br> <br>hhp </p>
