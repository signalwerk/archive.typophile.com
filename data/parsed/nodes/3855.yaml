    html: "<p> &gt; How did that rule come about? <br> <br>More than a rule, it's a guideline. But actually, my statement was an over-simplification (probably my functionalist side having too much say - again...), and it depends on the kind of text. <br> <br>There is the raw text, then there's the \"atmosphere\" that the font conveys, and they have to be balanced. For example, in a coffee-table book about Paul Klee, it's sad, but nobody's going to read all that fodder, so it might make more sense to use a sans no matter how much text there is. But if you want to reduce obstacles to the absorbtion of textual meaning, serifs help. The reason is simple: they help meld letters into words. <br> <br>&gt; The right eye sees the word 1st <br> <br>Actually, the left halves of each retina see it first, and they both go to one side of the brain - I forget which... :-/  But there doesn't seem to be enough evidence to suggest that this creates an advantage for a certain direction. Do women read faster than men? Their brains are less lateralized. <br> <br>hhp </p>"
