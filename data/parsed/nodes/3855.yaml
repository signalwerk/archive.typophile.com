    html: "<p>There is definitely the risk of \"discrimination\". The trick is to say \"serifs help readability\" instead of \"serif fonts are more readable\". A font like Syntax is certainly more readable than Lubalin Graph. <br><a href=\"http://www.myfonts.com/FontFamily179.html\" target=\"_top\">http://www.myfonts.com/FontFamily179.html</a> <br><a href=\"http://www.myfonts.com/FontFamily4129.html\" target=\"_top\">http://www.myfonts.com/FontFamily4129.html</a> <br> <br>The reason serifs help in readability (although they actually hurt *legibility*, since they confuse the individual letter-structures*) isn't because they guide the eye (through horizontality or anything else), it's simply because they help individual glyphs blend into boumas. <br> <br>* This difference in legibility and readability is central to a good understanding of type design, and it parellels the difference between contemplation and immersion, between display and text type, between consciousness and the subconscious, etc. There is certainly a lot of overlap between readability and legibility, but there is opposition too: you could say they're at a 90 degree angle. <br> <br>Also, the use of type is indeed more important, not least because there are more bad type users than type designers! :-)  No matter how readable a font is, bad setting can kill it. However, if one assumes good basic setting, the font's readability does become a factor. And anyway, anything else is outside the scope of the type *designer* to begin with... <br> <br>Readability studies... what can one say? Most are flawed, and even the good ones can't be taken as gospel. They end with a concluding paragraph (because that's the way formal science works these days - you gotta earn your grant, baby), and those never really make enough sense. Ignore the \"concluding\" stuff, look *inside*, and don't expect too much. Why is this the case? Because reading is friggin' *complicated as hell*! :-)  But honestly, if you spend enough time looking through a large number of individual studies, seeing if they're useful, exactly what they shed light on, etc. and you couple that to overall cognitive studies (like those of Herman Bouma), then you can start to see the model converging in your head, you start seeing the dark as a half-light. You start seeing that serifs help (and how they help), you start seeing that divergence helps (much more than the mainstream type designer will allow his aesthetic sensibilities to admit), and a bunch of other things. <br> <br>But hey, don't take my word for it, really! :-)  See what Javal, Ovink, Patterson &amp; Tinker, Bouma, Taylor, Spencer and others have found, and check out some lo-fi designs by Mandel, Tracy, Carter and other true master craftsmen (as opposed to \"artiste\"s), and chances are you can gain your own insight and teach us all some new things! It's esoteric, arduous stuff, but to me it's really a blast. <br> <br>hhp</p>"
