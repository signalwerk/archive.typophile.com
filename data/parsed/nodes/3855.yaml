    html: "<p> &gt; while i'm reading a text, my eyes are moving <br> <br>It's an illusion. Reading proceeds in jumps and stops - I was shocked too when I first found out! This was discovered only about 100 years ago. <br> <br>On the other hand, there is something called \"micromovement\": an extremely small vibration of the eyes (smaller than the smallest feature on a letterform) which seems to keep vision \"awake\" - when micromovements are suppressed, everything goes gray... Micromovement is below the scope of reading, but I guess it's possible that you can see \"feel\" it when you fixate for a long time? <br> <br>&gt; understanding the content <br> <br>I agree that the style of a typeface helps create context for the content. But especially during immersive reading, that's limited. For any text more than a few paragraphs, sans fonts will cause fatigue. You can always break the rules of readability, but you have to know them first. <br> <br>Teaching? I'm too busy learning! <br> <br>hhp </p>"
    html_clean: "<p> &gt; while i'm reading a text, my eyes are moving <br> <br>It's an illusion. Reading proceeds in jumps and stops - I was shocked too when I first found out! This was discovered only about 100 years ago. <br> <br>On the other hand, there is something called \"micromovement\": an extremely small vibration of the eyes (smaller than the smallest feature on a letterform) which seems to keep vision \"awake\" - when micromovements are suppressed, everything goes gray... Micromovement is below the scope of reading, but I guess it's possible that you can see \"feel\" it when you fixate for a long time? <br> <br>&gt; understanding the content <br> <br>I agree that the style of a typeface helps create context for the content. But especially during immersive reading, that's limited. For any text more than a few paragraphs, sans fonts will cause fatigue. You can always break the rules of readability, but you have to know them first. <br> <br>Teaching? I'm too busy learning! <br> <br>hhp </p>"
