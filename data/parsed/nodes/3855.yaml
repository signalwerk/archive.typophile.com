    html: "<p>&gt; doesn't the area of the fovea depend on the distance the eye <br> <br>Yes, but notice that our arms are a certain length... That's why in normal conditions (optimal type size, reading position, etc.) the fovea spans about three letters, and accounts for only about 1/3-rd of reading. When you have a small book, you hold it closer, and the type can/should be smaller. And when you have a large book, you lay it down somewhere, and the type can/should be larger. <br> <br>&gt; readability depends also on the reading habits <br> <br>Yes, \"familiarity\" is the second important component of reading. But it's even less understood than our reading \"hardware\"... For example, is it gained in years, or minutes? The answer would be extremely relevant, but we just don't know yet. <br> <br>&gt; latin) still appears more legible to me...  <br> <br>*Legible*, yes, and *inherently* so. A writing system with more regularity (e.g. less extenders) appears more legible, because our consciousness is foveal, and everything is clear. A writing system that's less regular (e.g. more extenders) is actually mroe *readable*, because things are less ambiguous in the parafovea. This is also why sans serif forms appear more legible than serif forms, but a book in sans is no fun to read. <br> <br>For example, Armenian is more readable than Latin, but less legible; the former is better for books, the latter better for posters. This is because of the difference in vertical information. <br> <br>Look at the far-right of: <br><a href=\"http://www.themicrofoundry.com/ss_rome1.html\" target=\"_top\">http://www.themicrofoundry.com/ss_rome1.html</a> <br> <br>hhp</p>"
