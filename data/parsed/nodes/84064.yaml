    <p>Hey everyone.<br>
    I'm a university student and I'm taking a typography paper.<br>
    The assignment brief is around the idea of fakery.<br>
    And my topic is based around the comparison between LetterMpress which is an iPad app (which I've purchased) vs. a real life letterpress.<br>
    I've been a lurker on these forums for a while but thought I'd post here to see if anyone has used LetterMpress and/or a proper letterpress and see some opinions on the upsides and downsides to both.<br>
    So far I've found out the act of locking up using magnets and the pieces of wood doesn't actually matter on LetterMpress, it doesn't affect the outcome of the print.</p>
    <p>Here's a link to the video overview of the iPad app: <a class="freelinking external" href="http://www.youtube.com/watch?v=uzMRPW9fwSE" rel="nofollow">youtube.com/watch?v=uzMRPW9fwSE</a></p>
    <p>Thanks in advance to anyone who takes the time to reply.</p>
