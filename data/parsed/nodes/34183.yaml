      <p>In a school/university environment (I used to teach), the recommendation is always "Show only your best work," the crème de la crème as it were, even if that's only a half-dozen pieces. I'm not sure I ever agreed with that.</p>
      <p>In the "real" world (where i am now), it really comes down to what have you got, and what do you want to show? When I look at portfolios, I enjoy seeing lots of stuff; it's nice if it all hangs together, but I'm also impressed with a range of work.</p>
      <p>Keep in mind that you (likely) will not know the needs of the client/studio before you go in for your interview. You've only got the one shot (usually), so try to be flexible.</p>
      <p>For example, my portfolio (now ancient) was a box-type case, fairly large (and not in the greatest shape - i got it used), and I stocked it with just about everything I could think of that I had created in the last $%#&amp;! years. It still has some ancient stuff, including marker comps and airbrush comps, just in case. The last time I actually interviewed (most of my jobs have been word of mouth anyway), it turned out the studio was looking for more of an illustrator (rather than a designer), and my earlier (non-computer) sketches and technical illustrations came in really handy. After being hired, my position morphed into a designer (they already had good traditional illustrators, but they really needed a Mac guru/designer/art director).</p>
      <p>I know some out there will disagree, but I say put as much as you can into your book, then pull out and show the best when you get there, modifying it with what the needs of the client are. Start with the best, in case you've got limited time, but more often than not the interviewer will just keep asking to see more... we're artists too, and we love to see your work. Since you're coming out of school, you'll only have the wacky "fictional" stuff, but it reminds us of our school days. If you've got "real" world work, even banal stuff the client sucked the life out of, put that in too -- we all know too well the limitations of idiots, but "real" work shows more than talent... it shows experience.</p>
      <p>The harder dilemma is putting together a "drop-off" package. You'll find a lot of job listings requiring you to either A) drop off or mail your book, or more likely B) mail in samples of your work. For this, you'll need to edit your choices of work down to a coherent, reasonable grouping, unless you're made of money and can afford all those color copies. The hardest part of this scenario is not being there to explain/highlight your work... it will have to stand on it's own, so don't be afraid to use some method (an outline, post-its) to briefly explain what they're looking at.</p>
      <p>Good Luck!</p>
