      <p>This is just my opinion, but I'm a fan of pragmatic design. I think it's a major part of succesful design.</p>
      <p>As such, even though we we were pushed out the door as graduates with 16" x 20" black matte board with spray mounted work on it in a $160 black portfolio case that weighed about 200lbs, I think it was rather goofy in hindsight...and especially today when quality printing is so cheap and available.</p>
      <p>As such, I'd suggest making a nice booklet...be it 8x11 or ledger or what have you. Color laser printed, nice cover. Something nice, but no so nice and expensive that you don't mind just leaving with the person you are interviewing with. I also like the idea of using removable bindings (I like the medical clips) to make it easy to pass items around a table when multiple people are viewing your work.</p>
      <p>And, of course, a handful of real, printed samples of pieces is always nice to have as well.</p>
      <p>Now, I'm sure someone else will come in and say that they are, actually, impressed with large hand-made industrial looking portfolio cases, and I imagine that's true, as well. Just not for me.</p>
