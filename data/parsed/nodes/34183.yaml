      <p>Have different portfolios for different interviews. If you’re going to a publishing house, they probably don’t give a damn about your self-banding. A big marketing firm, OTOH, might be really impressed by it. This is why it’s so easy to swap the pages in and out of portfolios.</p>
      <p>Don’t try presenting stuff on boards unless you have to. Remembering the order and what to say about them is a bugger. If you want something that’s less sterile, design a portfolio book (I know a guy who leaves handmade casebound portfolio books behind at interviews.) that has the feeling you want.</p>
