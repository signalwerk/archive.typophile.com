    <p>Just wondering what everyone's take is on portfolios. </p>
    <p>In my final semester of college, we were required to create an identity for ourselves (applied to a resume, business card) and then were to incorporate that into a portfolio book. For most of the class, it became more about implementing that identity than focusing on how the work itself was presented. In my opinion, I don't think anyone generally gives a hoot about that identity - only the work in the portfolio. </p>
    <p>What is my best bet in presenting work in this industry? </p>
    <p>Thanks for the help everyone. I always receive valid and helpful feedback here.</p>
