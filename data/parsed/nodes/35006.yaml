  html: |-
    <p>Fontlab Ltd. has just released FontLab Studio 5.0.4, a bugfix release available to all licensed users of FontLab Studio 5. </p>
    <p>Version 5.0.4 is free to licensed users of FontLab Studio 5.</p>
    <p>To obtain the free update, browse to our updates page and fill out the update request form. Please allow 1-2 business days for processing.</p>
    <p>A critical kerning bug introduced in the recently released 5.0.3 build has been fixed. In addition, numerous other improvements have been made. </p>
    <p>A list of changes made in version 5.0.4 is available at:<br>
    <a href="http://www.fontlab.com/news/announcements/fontlab-studio-5.0.4/" title="http://www.fontlab.com/news/announcements/fontlab-studio-5.0.4/">http://www.fontlab.com/news/announcements/fontlab-studio-5.0.4/</a></p>
    <p>In addition, a list of changes made in previously released version 5.0.3 is available at:<br>
    <a href="http://www.fontlab.com/news/announcements/fontlab-studio-5.0.3/" title="http://www.fontlab.com/news/announcements/fontlab-studio-5.0.3/">http://www.fontlab.com/news/announcements/fontlab-studio-5.0.3/</a></p>
    <p>I recommend all users of previous builds of FontLab Studio 5 to update to version 5.0.4. This can be done by requesting a free update at:<br>
    <a href="http://www.fontlab.com/upgrades/" title="http://www.fontlab.com/upgrades/">http://www.fontlab.com/upgrades/</a></p>
    <p>Regards,<br>
    Adam Twardoch<br>
    Fontlab Ltd.</p>
