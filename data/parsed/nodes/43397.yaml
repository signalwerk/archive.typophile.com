      <p><cite> &gt; Hence my hypothesis before [ . . . ] of offset quality/fidelity being “sandwiched” somewhere between digital and the outlines.</cite></p>
      <p>Nina, this is a reasonable working assumption. The trick is the nature of "sandwiched", because it may not be a neatly linear interpolation.</p>
