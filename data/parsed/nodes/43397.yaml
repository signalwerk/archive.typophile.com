    html: |-
      <p>"...guy from my type class did a little comparison about half a year ago comparing scans from the same file printed on different printers"</p>
      <p>Nina,<br>
      The  comparison of scanned images is not the best way to check a printer for use in type design. You can see general printing ability and rendering of pixel images but type design needs to see how a printer pours pixels into a bezier outline--how does it choose to deal with rounding, how much hinting affects the output, how it interprets PostScript, how much toner spread it generates, etc.. At large sizes, this is less of an issue but at text sizes, it can be quite significant.<br>
      I even notice a difference using the same printer and type if it comes from the originating app like InD or from a PDF generated from it. Oddly enough, even Adobe products like InD and PDF don't always match when printed to a laser printer. I don't know if this is do to PostScript interpreter, the operating system rendering, or differences in the way each software sends to the rendering device.</p>
      <p>ChrisL</p>
    html_clean: |-
