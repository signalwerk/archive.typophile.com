    <p>Hello everyone… I know that the "what printer should I buy for typeface proofing" question has been done to death over and over on Typophile, so I will try to keep my question really specific.</p>
    <p>I'm about to buy a laser printer in Berlin. I've narrowed my search down to two possibilities: the HP LaserJet 1022 and the HP LaserJet P2015.</p>
    <p>In England, I've inherited an 1022, but I don't have it with me when I am in Germany, and I will be leaving it in Reading (hello Reading MATD class of 2008–2009!) when I relocate back to Germany for good at the end of September. The 1022 is nice, but it doesn't render outlines 100% perfectly. It is close though.</p>
    <p>So I need to buy a printer for the longer haul. I can easily afford another 1022, but the twice-as-expensive P2015 (300 euro vs. 130 euro) looks good as well. I don't care about printing speed, since I only proof a few pages at a time. Both printers print 1200 x 1200 dpi. But if I can get better (really) outline rendition on 12 point type, the price increase of the P2015 would be worth it, I think. </p>
    <p>Does anyone here use the P2015? Would you recommend it? Thanks!</p>
    <p>P.S.: At Linotype, I used a P3005, which I just love, love, love! If I can find one in my price range, I'd probably buy it instead. But this isn't really my question.</p>
