      <p>Well, thank you everyone for all your comments! After much looking, I've ordered the P2015. If it is good enough for Peter Bruhn, then it is good enough for me, I guess.</p>
      <p>I spent a while looking for Ricohs, Xantes and Xeroxes. None of these were carried in stores. I had heard some good things about real PostScript Xeroxes, but online, I could only find a single b/w Xerox Phaser in my price range, and just had PostScript 3 emulation. I could get a big Ricoh, but only if I had it shipped from the US. That would surely take too long, and I'd have to pay import duties as well, which in my experience seem to average about 20% of the cost. I couldn't find any Xantes in country either.</p>
      <p>Since I'm proofing unhinted type, I think that I'll be allright for now. I've had good experiences with the HP 3005, so I have my fingers crossed. Wish me luck!</p>
      <p>Chris, I can send you samples later if you'd like.</p>
