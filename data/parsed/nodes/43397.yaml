      <p>No problem with unhinted fonts.</p>
      <p>HP's PS-interpreter applies hints even at resolutions/sizes that don't need hints. E.g. overshoot is suppressed, so round letters are smaller than they actually are. Not really useful for evaluating type design.<br>
      It's amazing that HP <em>still</em> hasn't done anything about it -- they know about the problem for a couple of years now.</p>
