    html: |-
      <p>Hrant,<br>
      I meant heavier than a 1200 dpi Xante with true Adobe PostScript, not my 600 dpi printer. I have done ImageSetter tests using a Linotronic at 2540 dpi. The Linotronic was clearly lighter than any Laser printer I have ever seen and the curves and near verticals (as you might imagine) were incredibly smoothe.  I can't even find a service bureau which does this kind of output any more. Direct to plate prepress has killed the market,  The only people on the planet who want Linotronic photo paper output are type designers like us and we are all too broke and too few to be worth the effort. :-)</p>
      <p>I find the lightweight settings on laser printers just reduces the density of toner applied giving you the appearance of lighter weight but not really accurate enough to help you refine a typeface at text sizes or smaller.</p>
      <p>ChrisL</p>
