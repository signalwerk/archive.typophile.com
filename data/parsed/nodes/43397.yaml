    html: <p>I think that last comment is correct, Nina. ‘Sandwiched’ implies a kind of continuum on which one can plot different examples of output in terms of relative fidelity or degradation. But this doesn't enable us to account for different kinds of degradation. A better way to think about the relationship of typefaces as output to typefaces as source would be a scattershot projection, in which the typeface as source is in the middle, and individual examples of output surround it, closer or further away depending on quality of fidelity and radially arranged in terms of type of degradation. Seen like this, the variety of output is appropriately overwhelming.</p>
