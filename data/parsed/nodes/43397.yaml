    html: |-
      <p>The thing is, using "lino" output to judge a font is in some way even more removed from readers than a (hi-res) laser. Which however doesn't make it useless; the void it fills is the space between seeing huge glyphs onscreen (where you're not really reading) and offset repro (which is prohibitive in cost/time for something as highly iterative as type design). The problem is it's become very difficult to get "lino" output.</p>
      <p>So the hi-res laser can actually be more than an intermediary: it strikes a great balance between realism and cost. You see something in effect close to offset repro, quickly and cheaply. It's not enough to pull off any project, but it can do 95% of the job in most cases.</p>
      <p>BTW, how would you compare digital output versus offset?</p>
      <p>hhp</p>
