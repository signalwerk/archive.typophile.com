      <p>Oh, ok. Like proof printing? That sounds pretty great (and seems like something that used to be used more before I was around). :-\</p>
      <p>Quality: Bear in mind I've been at this "seriously" for a year or so now, so I'm hardly an expert* (and it's not like I print three books every week). But some impressions are that digital output (1) is almost always darker [in terms of type weight], and (2) varies a lot depending on technical stuff that's outside of my reach as a designer, for example in terms of curve fidelity (and something that looks like exposure, which probably doesn't make much sense technically).<br>
      Offset to me seems generally sharper, "truer" to the actual forms,** less "spread out"; but it tends to vary in other terms, such as depending on the soaky-ness of the paper, and the amount of color… uh coverage?. And one thing about offset that is muchly different of course (and much nicer for reading, I think) is how the color sits "inside" the paper, and isn't a tactile (and sometimes shiny) thing sitting on top of the paper, like in digital. Plus the contrast is usually less crass, since offset black isn't the Super-Shiny-Extra-Enriched-Super-Black that some toner manufacturers seem to think everybody wants…</p>
      <p>* Shouldn't *I* be asking *you* this question? :)</p>
