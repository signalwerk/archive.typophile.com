    html: <p>Nice work. It reads very well. It's sharp, clean and, well, likeable. You've made a lot of nice choices with the descenders. And I can imagine with such an economical style you're working with, the capital Q was a challenge, but you solved it nicely. Overall, I like it quite a bit. I can't think of anything bad to say about it. Good job!</p>
