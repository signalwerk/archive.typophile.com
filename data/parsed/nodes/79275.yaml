  html: |-
    <p>Hello all!</p>
    <p>This is my first typeface and I have been working on it for a few months now. I was inspired by large families like Scala and Nexus and also others like titillium and Interstate. So I created this and *legibell txt (can be found under critique &gt; serif). My goal is to create a nice, readable, unique transportation font family with multiple weights (I'll add them once I am happy with the general design of the regular). I've worked a bit on the kerning and spacing, but it's not all sorted out yet; I just really wanted some feedback on the look and design of it. </p>
    <p>Any critique or commentary would be great! Thanks,</p>
