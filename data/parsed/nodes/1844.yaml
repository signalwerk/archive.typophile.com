    html: <p>Me, Hrant?  No -- it's an old Internet alias of mine, from another fandom.  I created it when I was about twelve, in a fandom where such names were the style.  I never meant to keep using it, but it blurred with icons, which blurred with typography. <br> <br>I'm a bit embarrassed at my presumption whenever I think of the supposed surname, so I tend to go by just Liana.  Problem is, as soon as I register with that, about a dozen more Lianas pop up -- it's not a dreadfully uncommon name. <br> <br>I'm reluctant to relinquish the Goldenquill, though -- I suppose it does tend to stick in one's head, and I'd hate to start over again with a new name now. <br> <br>-- Liana</p>
