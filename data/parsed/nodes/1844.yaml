    date: 2003-11-08T12:42:00
    date_raw: 8 Nov 2003 — 12:42pm
    votes: null
    html: <p>Many people at my school are uneducated about type ethics, and there's a good ammont of font piracy that goes on behind the scenes. My professor's don't LIKE it, but they don't really make it a point to discourage it, they just seem to pretend it doesn't exist. <br> <br>Most people I know "do not see the value" (their words, not mine) in paying $150 for a font file that's less than 1mb. In most cases, there's no advantage in paying for a font licence opposed to just copying a file off a computer. Ethics? These people do not CARE about ethics, most of them are broke and are just trying to get through school. <br> <br>If you think about it, there really isn't any kind of reward for purchasing fonts legimately. <br> <br>Fonts not copy protected, and have no serial numbers/keys (like when buying photoshop, quark, etc). Many younger students in the program don't even realize fonts/font licences have to be PURCHASED. <br> <br>Typographers complain about font piracy, but foundaries have done little to stop it, or promote ethical behavior. <br> <br>That's my opinion anyway.</p>
