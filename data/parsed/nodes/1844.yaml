    html: <p>We have a 3 year degree. We have, in all, 4 semesters <br>of "typography". It is taught in a bizarre manner. We  <br>only have one (final) semester of "type design", but that  <br>also includes type history and classification. In one  <br>whole 16 week semester, including holidays. Up until <br>then it is just learning composition. I think it is a silly  <br>way of teaching, because to learn the history,  <br>classification, and design in one semester is too late <br>and not enough. It isn't really enough to foster a  <br>broad, cohesive knowledge of type and typography. <br>And our tutors seem to actively encourage font piracy, <br>and get quite shirty when I ask whether they paid for  <br>their fonts. <br> <br>Does anyone have any tutors who encourage ethics <br>in type? </p>
