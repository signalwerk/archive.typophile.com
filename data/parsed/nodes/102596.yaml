    <p>Dear All,<br>
    I'll have a couple of days to myself in London next week and I wanted to know whether you can recommend places of typographic interest that shouldn't be missed. At the moment I'm only sure about St Brides but lighter suggestions are very much welcome too.<br>
    Thank you,<br>
    Akos</p>
