    html: |-
      <p><em>Is there a way to do this direclty in Fontlab?</em></p>
      <p>One way would be to </p>
      <ol>
      <li>Select a radius for your rounded corners--say, 12 units);</li>
      <li>In the EFFECTS menu, select BOLD, uncheck "Keep glyph dimensions," then select -12 for H weight and V weight;</li>
      <li>In the same menu, check "Make round corners" and change the weight to +12.</li>
      </ol>
      <p>You can fiddle with the values to get the effects you're looking for...</p>
