      <p>Budget: You could find a designer who is willing to donate his/her time. A lot of designers give their time to causes they can get behind. Having no budget doesn't mean you have to do it yourself. (Which, by the way Hiroshige, is what this thread has become... designers giving consultation for free. But you just might get what you pay for. =)</p>
      <p>Design: Others have suggested simplifying... If there is something "on brand" about the Celtic cross as it relates to Presbyterianism then stick with it, but simplify the grass, sky, steps, border thing. (Is the Celtic cross similar to the the Lutheran cross w/ flame design is very recognizable?)</p>
