      <p>G'day Nick,</p>
      <p>Annoying, lost my long post due to my dial-up dropping out.</p>
      <p>Anyway, hey my name's Nick and I go to a presbyterian church and I am on typophile too, cool.</p>
      <p>I can't bear to write as I did the first time so I'll try and hit the high points: you said your MO was simplicity but unfortunately I have to say this logo looks quite abstract and convulted: you have sky + grass + cross + church pire + 5 steps + thick black lines. </p>
      <p>Try picking one of your concepts and just going with that, forget the rest, a logo doesn't need to symbolise all your church is, it is just a mark that identifies you, it is not necessary to try and put all your vision statement in there. </p>
      <p>Use your concept (for eg: cross) as a jumping off point, make associations, follow the creative process, try lots of variations, it doesn't need to have a 1:1 relationship with your concept (church:image of church)try formal/literal/symbolic/expressive approaches. Most important thing is keep it very strong and very simple. When your concept gets tired and you have nothing you like, try a different concept and start again. This is very frustrating but I think there's no easier way. One of the simplest things that I did was to buy a cheap pad and use lots of paper without worrying about how much I was wasting.</p>
      <p>Oh also, someone else wisely said don't design logos in colour, it makes you rely on colour for meaning, distracting you from the more important issues of form and structure. </p>
      <p>If the celtic cross symbolises white-power, perhaps this is a good reason to ditch it, but perhaps there may be a way of rendering it so these associations arn't made, I'm not sure, that was news to me, thanks Franzheidl for that info</p>
      <p>It is time-consuming to produce a successful logo. It might be worth investigating hiring a professional; it probably won't cost as much as you think, you're not IBM wanting a corporate ID update, the designers won't (shouldn't) charge you as if you were.</p>
      <p>hope this help</p>
      <p>Nick</p>
