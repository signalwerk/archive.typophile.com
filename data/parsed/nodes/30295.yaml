      <p><em>I myself am in a profession where those who are the trained practitioners of the field can get the sense that they are the only ones who can properly administer their vocation. And in many senses, that’s true. I know more about the Bible, about spirituality, about worship practices and about how to make Christianity practical than the average person in the pew. The whole philosophy of the Presbyterian “flavor” of Christianity, however, is that every member is a minister who has a place in the world to do some work for God. So my primary job, as my church understands it, is to help “non-professionals,” so to speak, do the work of ministry.</em></p>
      <p>With that paragraph you have already done the design.</p>
      <p>You already know the major and minor elements of the design which give your congregation it's heart and unique character... and that above paragraph practically designs itself. And since I cannot teach you how to communicate with your church elders on the import of how you present yourselves within society - then I await your next half dozen rough drafts.</p>
      <p>Give a man a fish, and he will eat for a day - Teach a man to fish, and he will eat forever.</p>
      <p>___________<br>
      Hiro</p>
