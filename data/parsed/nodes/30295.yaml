      <p>Yes, probably it's more of an european thing to associate the celtic cross with the far right, especially when used in it's basic form without any ornaments it is not only associated with, it literally means white power/supremacism over here – but i have also seen american nazis with celtic cross tattoos. I just wanted to point that out, as you might want to tread careful in that respect. If that association isn't a big issue in the US – fine.</p>
      <p>On a completely different angle, using a cross (no matter if celtic or not) for a church identity just as it is seems a bit too obvious for me, as does the usage of iconicised architectural forms. That may well work for places like the Empire State Building, the Brandenburg Gate, etc. but in general it usually appears in institutional identities where, in the design process, nothing better could be agreed upon, especially when too many people where involved.<br>
      I'd recommend to rather try to have a go along the five values of your congregation, and derive a much simpler, more abstract solution. Probably even type only.<br>
      And forget about light blue and green, grass is green and the sky is blue – everywhere.</p>
