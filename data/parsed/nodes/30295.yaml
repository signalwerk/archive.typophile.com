      <p><a href="http://en.wikipedia.org/wiki/Celtic_cross" title="http://en.wikipedia.org/wiki/Celtic_cross">http://en.wikipedia.org/wiki/Celtic_cross</a></p>
      <p>I was unaware of any far-right connotation too, wikipedia agrees with Franz though, especially as far as the simplified version goes, maybe it is a mainland European thing. You could look at a more traditional celtic cross shape with heavier strokes for the crossbars than the circle, maybe to the extent of including the circular cutouts on the horizontal and vertical.</p>
      <p>On the other hand a simple wordmark could do the job, I would tend to avoid the rather obvious and ubiquitous script and look at something solid and reliable like Clarendon or Joanna combined with a colour can produce an attractive identity for your target demographic.</p>
      <p>Tim</p>
