      <p>The first thing I have to say, is WOW.  I did not expect such a response to my posting of my (admittedly pokey) first attempt at designing a logo for this church.</p>
      <p>The second thing I need to say is "thank you!" because your comments have been althogether helpful, even the most pointed and critical of them.  I have *learned* about design through this discussion, and that is excellent.  I have not been offended by anything I have seen posted here.  I have benefited, in fact.</p>
      <p>Thirdly, for those who have offered free advice, or follow-ups via e-mail addresses, I may contact you soon.  It turns out that I have a graphic designer friend who has offered to consult with me as I blunder through the design steps, so I may be able to accomplish what I want with his assistance.  But for others who offered, many thanks.</p>
      <p>To tie up some other loose ends:<br>
      Why do I not have any money to design a logo?  Well, not to get too much into the nitty-gritty details of my congregation, but I am an associate pastor for a population in transition.  The older congregants would not understand spending US$50 on designing an ID, nevermind that such costs could go into four digits.  To ask the leaders in the church for hundreds, perhaps even thousands of dollars, for something as intangible as a logo ... I would be laughed out of the room.</p>
      <p>The younger congregation, including our senior pastor, has the idea that you do it right the first time.  But she and I have to hold in tension the fact that there are more pressing things we need to pay for in the church, such as new windows.  So it's not that I don't value paying for good graphic design.  It's just that I cannot wait five years to get to the point where I can ask for the money.  At this point, we don't even have a WEBSITE.  Not even a BAD website.  So please understand where and how I am trying to lead this congregation.</p>
      <p>Going back to the design, I know that my initial attempt did not *feel* right.  I just didn't know *why*.  So I figured if I were to post it in a place where people might take my design seriously enough even to say "hire a professional," it just might be worth my while.  And it certainly has been.</p>
      <p>I myself am in a profession where those who are the trained practitioners of the field can get the sense that they are the only ones who can properly administer their vocation.  And in many senses, that's true.  I know more about the Bible, about spirituality, about worship practices and about how to make Christianity practical than the average person in the pew.  The whole philosophy of the Presbyterian "flavor" of Christianity, however, is that every member is a minister who has a place in the world to do some work for God.  So my primary job, as my church understands it, is to help "non-professionals," so to speak, do the work of ministry.</p>
      <p>Now the analogy will most likely break down here, but I hope you can understand how I am trying to put this principle into practice with graphic design.  I am not a graphic designer by trade, but I fully will use people who are designers as guides to help my development in this area.  Will I ever be a professional designer?  Probably not.  But could I produce a decent - not revolutionary - but decent product with the assistance of a community of designers?  I would hope so.  Now it may turn out that graphic design is not an egaltarian field such as my own.  I leave that discussion to designers, however, since I have no desire to get involved in an "in-house" debate, so to speak.</p>
      <p>Peace to all of you who have lent your perspective.</p>
      <p>- Nick</p>
