      <p>Hey nvhladek , okay I'll speak frankly...</p>
      <p>Your congregation should gather up a mercy collection and hire a graphic designer for their own self preservation, and keep you far away from any design software. Don't tell me they can't do that, all you have to do is be honest with them and tell them you'll be doing the church harm by producing the graphic representation of their concerns, ok?<br>
      But having said that, and having studied your composition, you have given me an insight into how you personally understand 'the body of Christ' as represented in your graphic form, as it relates to society at large. </p>
      <p>Let's get past the obvious pleasant statements, that your effort is 'crude' or 'unrefined', and take a good look at the elements of your graphic understanding, ok?</p>
      <p>Those five black heavy segments drag the eye down, and therefore drag the spirit down. And although that central whatever it is, cuts/divides the canvas all by itself - those heavy black elements impose an overall dark downward force. I don't get that they are supposed to represent anything other than a deep heavy handed downward force, which by the way dominates the whole composition. </p>
      <p>And that central thing which divides the canvas in two, does not unite the canvas - it cuts the canvas complete with a blunt point. And it's heavy black outlines further represents an exclusion and not an 'inclusion'.</p>
      <p>The gradients have two separate light sources which further enhances your confusion, although it is interesting to note that you tried to impart a lower right light source. Perhaps to balance off all that oppression? Which by the way, could be the most interesting (and natural) area of the entire effort.</p>
      <p>_________<br>
      Hiro</p>
