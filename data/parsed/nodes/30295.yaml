      <p><em>Do you really believe that?<br>
      Would it therefore be uplifting if the steps/roof went in the opposite direction?</em></p>
      <p>Composition should move the eye throughout a work, and each element should lead to the next (same theory for sound type design?). A lot of religious compositions use a triangular scheme, but there are many many other schemes which have their own characters.<br>
      The triangular theme is most common in regious art is because a firgure and it's subserviant elements thereof are for the most part centrally placed, which imparts a feeling of stability/solidity. But, if that central element is impacted by a heavy diagonal which cuts across the entire format (in this case a squarish format), then conflict is the result.</p>
      <p>Sound composition is everything, without it the message is lost. And when the composition has been settled, rhythm has a chance. Rhythmic unity is a major part of any sound composition, but when a rhythm is heavy and uniform it is seen as repetitive to an extreme, like those five heavy black elements.</p>
      <p>The celtic cross and the five elements which give your congregation their unique character are the starting elements of your composition - stop trying to tie them to crap architecture. They can stand on their own.</p>
      <p>Joe, you're so right...</p>
      <p>_________<br>
      Hiro</p>
