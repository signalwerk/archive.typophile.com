    <p>I am the associate pastor at the First Presbyterian Church of Ukiah, CA and was brought on to work with youth and families and revitalize the congregation's aging population.  Step #1 was get a website with a reasonable, simple design, and a logo to suit it.</p>
    <p>So I have started with this design concept, but am wondering what would be some helpful directions I could take with it (including start over).</p>
    <p>An explanation of the design:</p>
    <p>The celtic cross is the centerpiece of the church's architecture.<br>
    The five "lines" mimic the roofline of the church.  They also represent the five values of our congregation taken from our purpose statement.<br>
    The blue and green represent the natural landscape of Ukiah, which is an agricultural community in Mendocino County in Northern California.</p>
    <p>A tension I am also trying to convey:<br>
    The piece is attempting to convey a sense of simplicity because many of the folks here resonate with traditional values.<br>
    I am also trying to communicate a slightly progressive tone, since Ukiah is also a young community located in wine country that values organic/sustainable living.</p>
    <p>Please let me know what you think with frankness and forthrightness.  I am an amateur but very teachable.</p>
