      <p><em>Those five black heavy segments drag the eye down, and therefore drag the spirit down.</em></p>
      <p>Do you really believe that?<br>
      Would it therefore be uplifting if the steps/roof went in the opposite direction?</p>
      <p>All this talk about hiring a graphic designer raises another question, how does one know that one has hired a 'good' designer? How can one make a choice when shown three options (I suspect the answer is that it would come down to familiarity, use of a favoured colour or some other way of breaking down a visual, looking for an element that one feels comfortable with approving and choosing that)? It is not as if there is an opportunity to form an in-depth relationship between client and designer for a short term project like this. </p>
      <p>Which brings me back to my previous post, would a church be better served by a website that is well laid out without a logo than taking a chance on an under-developed appreciation? My opinion is that a poorly designed/chosen/executed logo is worse than no logo.</p>
