      <p>You could say that any company or organization does not need an identity to surive, that is not the point nor is it wise. Lack of an identity is still part of your identity, it just shows rather poorly for your organization.</p>
      <p>Certain social views hold aesthetics as useless and might condem the use of church funds where they might be spent with more "meaning" in other areas. But people forget that Aesthetics is the philisophical branch that is tied in with Ethics and should achieve many things to do good for the church that can only be done Aesthetically.</p>
      <p>With so many religions and branches and competing branches of these churches the right identity can set apart this particular church with it's values and goals; it can create a road map for the success of the church and inspire new members to attend. It seems fairly odd that many churches would spend whatever it takes to build or rent the right building for their congregation but view their actual identity as superficial and not worth paying for when it is actually one of the most vital things it can have.</p>
