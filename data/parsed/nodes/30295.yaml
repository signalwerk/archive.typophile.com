      <p><cite>stop trying to tie them to crap architecture.</cite><br>
      Crap architecture? Says who? Hiro, do you actually know what does the building represent for this particular community in that particular area? It might be historically important or it might have sentimental value. I don't think it's fair to dismiss it like that.</p>
