    <p>Hi,</p>
    <p>I've just got a bit confused on how to spot Humanist, Transitional and Modernist typefaces?</p>
    <p>Can anyone help me out on what to look for please?</p>
    <p>I thought I knew how to tell, but when it came to it, I just completely forgot.<br>
    I keep thinking it's something to do with the angle of letters and how geometric they look??</p>
    <p>(if you get your info from a website can you link me please as I need references, thanks)</p>
    <p>thanks in advance anyway</p>
