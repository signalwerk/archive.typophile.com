    html: "<p> \"Helvetica Flair\" reminded me of another one of the all-time worst fonts: HARLOW. You see it all the time on '70s graphics, apparently because idiot designers decided that it somehow evoked the '20s and '30s, and stuck it all over things like album covers for old music. Of course, it looked *nothing* like any font you'd actually see from the '20s and '30s - typesetters had far better taste then...fortunately it's decreased in popularity in recent years. </p>"
