    html: |-
      <p>Thanks for the replies, everyone.</p>
      <p>penn.and.ink - That's not an option for me, at least at present. It would require me to either get a salaried job or register my freelance activities with the chamber of commerce (i.e. start my own company).</p>
      <p>Nick Shinn - My friends are students, and thus don't have credit cards. My family, meanwhile, is wholly convinced that the moment they use a credit card on the internet, the Russian mafia will gain unlimited access to their bank accounts.</p>
      <p>oldnick - Nice font, but not quite what I'm looking for. What I'm searching for is something that isn't necessarily similar in its style, but has a similar combination of formality and informality while maintaining legibility.</p>
      <p>For example, fonts like Gotham and Verlag (which also both require a cc - argh!) actually come closer than fonts which are technically more similar. In fact, even Basic Commercial would probably come closer, though it lacks the personality I'm looking for.</p>
      <p>paul d hunt - It seems they like only accept customers in Germany, while I'm in the Netherlands.</p>
