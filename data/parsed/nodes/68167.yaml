    <p>As an amateur webdesigner, I recently discovered Neutraface and immediately fell in love with it. Being a student, saving up the money took a while (and involved eating far more ramen than I am comfortable admitting to), but I finally got the money I needed.</p>
    <p>And then, to my dismay, I discovered that House Industries only takes creditcard payments.</p>
    <p>So... would anyone happen to know of a font that is similar in feel but is sold by a company that accepts PayPal?</p>
