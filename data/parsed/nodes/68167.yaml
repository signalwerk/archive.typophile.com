      <p>Amigo,</p>
      <p>the answer is simple - pre-paid credit card.<br>
      Check online but here in UK you can get them<br>
      from Western Union shops. Since the 'credit' only means<br>
      Visa or Mastercard logo, actually you just top up and<br>
      use. Not so different from topping up a mobile pay-as-you-go<br>
      account.</p>
