    html: "<p>Digital ink works by flipping little cells that are black on one side and white on the other. The flipping is done by applying a momentary current to each cell. Maybe they can apply a partial current and get the cell to flip 1/3 and 2/3-rds of the way, getting two shades of gray? That would mean they can also apply smaller increments and get more shades. Hey, maybe they can even <i>orient</i> the cells and get them to fill corners!  :-) I can see a new bitmap font format, where pixels have DIRECTION.  :-&gt; <br> <br>By \"halftoning\" I guess you mean the effective dpi for 4 shades goes down to 85? That would suck, and might be false advertising too. <br> <br>Bendability: I think the paper itself is, but maybe they decided to make this product not? Maybe they think people will need to get used to the idea, and/or they're leaving room for improvement - a common tactic these days especially. <br> <br>hhp <br></p>"
    html_clean: "<p>Digital ink works by flipping little cells that are black on one side and white on the other. The flipping is done by applying a momentary current to each cell. Maybe they can apply a partial current and get the cell to flip 1/3 and 2/3-rds of the way, getting two shades of gray? That would mean they can also apply smaller increments and get more shades. Hey, maybe they can even <i>orient</i> the cells and get them to fill corners!  :-) I can see a new bitmap font format, where pixels have DIRECTION.  :-&gt; <br> <br>By \"halftoning\" I guess you mean the effective dpi for 4 shades goes down to 85? That would suck, and might be false advertising too. <br> <br>Bendability: I think the paper itself is, but maybe they decided to make this product not? Maybe they think people will need to get used to the idea, and/or they're leaving room for improvement - a common tactic these days especially. <br> <br>hhp <br></p>"
