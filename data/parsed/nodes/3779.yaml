    html: <p>&gt;I want to know what the type looks like! <br> <br>At 170 dpi the "4 shades of grey" may be only some form of "halftoning" -- it's my understanding that digital paper is strictly "on/off pixel" at the moment. <br> <br>It's interesting that they are coming in at the high end, rather than with a low-res device and primitive pixel type. But perhaps Sony didn't want to have Japanese bringing up the rear. Or else they realize that cellphone/blackberry technology is, to most intents and purposes, pretty similar in functionality with this generation of e-paper, until e-paper actually becomes bendable and constrained only at the spine. <br> <br></p>
    html_clean: <p>&gt;I want to know what the type looks like! <br> <br>At 170 dpi the "4 shades of grey" may be only some form of "halftoning" -- it's my understanding that digital paper is strictly "on/off pixel" at the moment. <br> <br>It's interesting that they are coming in at the high end, rather than with a low-res device and primitive pixel type. But perhaps Sony didn't want to have Japanese bringing up the rear. Or else they realize that cellphone/blackberry technology is, to most intents and purposes, pretty similar in functionality with this generation of e-paper, until e-paper actually becomes bendable and constrained only at the spine. <br> <br></p>
