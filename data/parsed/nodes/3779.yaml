    html: "<p>Concerning grayscale: from reading some stuff it seems that there are separate \"models\" for b&amp;w and grayscale rendering - which is encouraging. <br> <br>BTW, Grant, that PDF contains some interesting insight into why reflective media is more conducive to readability than emissive. Although it's possible they've ignored the probable relevance of the type-fidelity difference typical of reflective-versus-emissive displays. <br> <br>hhp <br></p>"
