      <p>Nick, don't you find that newspaper layout really offputting? In terms of readability it may be ok but it doesn't work for me from a designer's point of view. I'm thinking navigability (not knowing where to start reading) and the amount of information are difficult.</p>
      <p>I found this on Wikipedia <cite>'Judicious use of white space can give a page a classic, elegant, or rich appearance. For example, upscale brands often use ad layouts with little text and a lot of white space. Inexpert use of white space can make a page appear incomplete.'</cite></p>
      <p>And this from another website <cite>'white space is used for purely semiotic values; for values of presentation which transcend economic values by insisting that the image of what you present is more important than the paper you could be saving.'</cite></p>
      <p>So the 'luxury' aspect is more suitable for selling expensive products than it would be for setting a purely informational newspaper, perhaps. </p>
      <p>However, I'm suddenly worried about the last sentence of the Wikipedia piece, so perhaps it is better after all to specify margins than expect non-designers to use white space cleverly.</p>
