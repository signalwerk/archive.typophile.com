    <p>Hi<br>
    I'm putting together some simple editorial/communication/layout guidelines for my non-marketing colleagues in the organisation. It will include points about plain English, capitalisation, font choice (to avoid red Arial bold italic), the difference between a hyphen and a dash and other relevant bits and pieces.</p>
    <p>I want to include a short point on use of white space in documents (reports, instructions, presentations) and web pages. I was thinking something along the lines of: White space should be used deliberately in designing all corporate communications. </p>
    <p>My problem is that I can't formulate the reason for this very well and want to say more than 'because it looks nice and uncluttered'. </p>
    <p>Can anyone suggest why white space should be designed into documents rather than left over at the end, or point me in the direction of other style guides/web sites?</p>
    <p>Thanks:)</p>
