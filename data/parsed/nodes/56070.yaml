      <p>&gt;say ’don’t overly crowd things’.</p>
      <p>You know, that makes a lot of sense. I think the ROI is that the people reading the documents with whitespace feel like they're more special, since time has been spent to consider the reading experience and the professional appearance. Nobody wants to approach a document that doesn't look neat. (Sorry, I have to work with a lot of very horrible looking documents: red capitals with 'marching ants', unaligned tabs, broken tables, pictures the size of postage stamps and needless font/paragraph/design inconsistencies).</p>
