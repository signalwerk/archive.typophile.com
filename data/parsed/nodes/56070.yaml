      <p>I don't see the virtue of emptiness on it's own merit, unless it is well justified by a solid concept, and is well balanced. To me, the phrases " I like that you are using white space" and "I like that you are utilizing all of the available space" are equally valid. </p>
      <p>This artwork would not benefit from the addition of white space:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/nospace_4423.jpg"></div><p></p>
      <p>Yet This one wouldn't work without it:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/enso_4785.jpg"></div><p></p>
      <p>Back in school, I always got annoyed on critiques when works were praised for the amount of negative space as if though it were an achievement in an of itself.<br>
      _____________________________________________<br>
      Personal Art and Design Portal of Ivan Gulkov<br>
      <a href="http://www.ivangdesign.com" title="www.ivangdesign.com">www.ivangdesign.com</a></p>
