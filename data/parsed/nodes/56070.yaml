      <p>What is the ROI on white space?</p>
      <p>There is one, but that's how the powers that be are going to frame it when you are asked to justify it.</p>
      <p>It's probably better to use words to argue for it without calling it that. Instead of saying 'use white space' say 'don't overly crowd things'. 'White Space' is seen as 'wasted space' in the world of business and what's the point of that? ;o)</p>
