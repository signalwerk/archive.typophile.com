    html: |-
      <p>"Include some space to let the text breathe" is a useful tip.<br>
      It can be as simple as just making sure that headlines aren't sized up to fill the available space.</p>
      <p>But "White Space", as an element of asymmetric modernist page layouts is problematic.<br>
      I don't think it's something that most people can do without a fair amount of study and practice, developing an understanding and eye for it. </p>
      <p>Consider modernist architecture. A large office block by Mies, with its expanses of plain and pure form, expensive materials, discrete detailing and subtle proportions, is beautiful. But in lesser hands with less budget, modernism became a crude and brutal exercise of corporate/government power.</p>
      <p>White Space is ideologically fraught.<br>
      Its origins, connected to the clean and healthy aspirations of modernist design with social purpose.<br>
      And now the environmental issue.</p>
      <p>Ignoring screen display, consider that White Space is an inherent waste of resources.<br>
      In corporate or institutional publications, designers are taught to waste paper to create the "minimalist" aesthetic. A large part of the effect relies on identifying the awe of big size with the power of the publisher/advertiser who can afford to waste paper--that is the aesthetic. We have established a norm where small publications and advertisements just don't look right for large organizations. So big corporations and government are inherently wasteful.</p>
      <p>Where does the creative industry get off, with its conscience intact, talking about being green, when the creative that it honors most is the work which wastes most paper with big pictures and lots of white space? If you're so creative, get the message across efficiently, sell the product with a smaller ad.</p>
      <p>And if small is beautiful, then perhaps spend longer conceptualizing and writing to shrink and concentrate the message, because labor is ultimately greener than materials, minimize the physical footprint, and use rules and borders to separate matter, because that takes up less real estate than White Space.</p>
