      <p>Ben, you might refer to Gerrit Noordzij's <em>Letterletter</em> page 126.</p>
      <p>Noordzij presents a list representing the hierarchy of white space in typography:<br>
      1. the white shapes in words<br>
      2. the shapes between words<br>
      3. the space between lines<br>
      4. the space between columns<br>
      5. the background of text<br>
      He says it's order is a condition of legibility.</p>
      <p>I might add that in the macrotypography domain effective use of white space is a condition of robust navigability, and distinctive use of what space a condition of brand specificity and cohesion.</p>
