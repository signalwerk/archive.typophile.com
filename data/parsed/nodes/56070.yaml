      <p><cite>White space is a waste of paper, except in the margins where readers need to place their thumbs when holding the document. To keep things separate, use rules.</cite></p>
      <p>Well, it depends. You don't really need margins, let the silly buggers move their thumbs.</p>
      <p>Keeping the number of pages down can be evaluated. The cost of paper, the cost of makeready (if printed), and in human costs, especially the ergs expended in turning pages.</p>
      <p>This can present a real challenge with, say, a title page. Their just isn't enough copy to fill the page. Perhaps write a little more? Or maybe add some ornaments, the print equivalent of tarting up with earrings, rouge, etc.</p>
      <p>* * *</p>
      <p>If you are preparing a print piece, you can a least illustrate the point on white space by including a sample of asymmetric typography contrasted to centered typography.</p>
      <p>The use of white space is a comfort matter, just like every other element of typography. Seeing and appreciating it is a matter of learning; once learned, it becomes part of an audience's expectations &amp; reactions.</p>
