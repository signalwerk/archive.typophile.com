      <p>And then there is the flipside, like Wilco’s new album cover that uses an image originally on Flickr that they undoubtedly paid for. Or Microsoft finding photos for their Vista wallpaper on Flickr and commissioning a couple of the Flickr photographers to fill it out.</p>
      <p>It’s a two-way street: some people get ripped off, and others get noticed and compensated. I’d rather lose a few images to the WWW and gain a few photo clients than never take the chance at all. Not that it’s balanced or fair, but it is not black and white either (no pun intended).</p>
      <p>At my design shop, we use Flickr for comping now more than Getty because of its quality, quantity, resolution, and reality. And I think the day draws near when we buy a photo from somebody there.</p>
      <p>Horton<br>
      Founder, <a href="http://www.thisdayintype.com" target="_blank">This Day in Type</a></p>
