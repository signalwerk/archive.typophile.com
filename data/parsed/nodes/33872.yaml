      <p>FP-<br>
      They sure would. A point that can be made, however is that everything is a matter of appropriation anyway. There is no art, thought, musing, song, scientific discovery, etc. that is not the direct result of other things. It may be “new” in that it’s somewhat diffferent — another way to phrase something, a different color combination that really makes it appear unique — but at the root, it’s modification.<br>
      Even many designers make this point: Art Chantry, and Andy Warhol each borrow(ed) freely from surrounding culture. Milton Glaser’s famous DYLAN poster is a direct modification of Marcel Duchamp’s work. Mozart, Bach, Beethoven each produced great numbers of pieces derived from the work of others, and not only is it accepted, it’s celebrated.</p>
