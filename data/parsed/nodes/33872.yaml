      <p>FP-<br>
      This may be rhetorical, but I was then struck by this thought:<br>
      Who owns the “rights” to graffiti art? The artist?  the buiding owner? the photographer that chronicles it?</p>
      <p>Example: it is perfectly legal to photograph the Eiffel Tower during the daylight hours and sell the photos as copyrighted images. It is illegal to photograph the tower at NIGHT and sell the images, because the company that illuminates the tower has copyrighted the lighted aspect of the site. No one is required to credit Gustave Eiffel (although this is most likely a Public Domain issue, due to the date, etc.).</p>
