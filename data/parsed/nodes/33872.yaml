    <p><a href="http://news.bbc.co.uk/1/hi/technology/6665723.stm" title="http://news.bbc.co.uk/1/hi/technology/6665723.stm">http://news.bbc.co.uk/1/hi/technology/6665723.stm</a></p>
    <p>Seems Rebekka is right!</p>
    <p>The current trend for companies stealing photos and not paying has gotten out of hand. </p>
    <p>This morning on TV the BBC News ended a story about this weeks FA Cup final with a request for people to send in there images from the days event. Gee that is a cheap way to get content. No need to send out photographer or pay them for that matter.</p>
    <p>Then there are the prowlers who ask to use your photos for their applications. I get request all the time. </p>
    <p>Many of my clients ask me to send some high res images to magazines and I get no credit usually. </p>
    <p>Stop the open source style stealers, save a photographer today.</p>
