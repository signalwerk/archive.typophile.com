      <p>I agree, jlt. The marketplace is changing VERY quickly, and those who catch it ahead of the curve are going to make some serious strides. For instance, there’s a young artist producing video diaries of her painting process, interspersed with “journal” entries about her life that week. She’s been doing this for several months, starting with about 1,000 views per week. Now she’s getting 600,000 views in a week, and selling her paintings and prints of those painting on eBay. It’s an incredibly creative business model! I can imagine sometime very soon, she will be extremely wealthy and pretty famous. And it looks like she’s about twenty two yrs. old.</p>
      <p>As for you— I applaud your freelance success AND your marketing view as well.</p>
      <p>Having said all that, the original poster called attention to someone on Flickr that specifically did NOT offer their work for free use, but had it taken anyway. That example has nothing to do with conservative and inflexible business models. That’s stealing.</p>
