  html: |-
    <p>I just wanted to let folks know that I've posted a proposal <a class="freelinking external" href="http://lists.w3.org/Archives/Public/www-style/2009Jun/0506.html" rel="nofollow">for adding advanced font feature support to CSS</a> to the www-style mailing list.</p>
    <p>The basic idea is to enable control of ligatures, alternates, swashes and numerical formatting features available in OpenType and AAT fonts within webpages in a relatively simple manner.  The proposal lists specific mappings of font-variant-xxx properties/values to OpenType/AAT features but I don't expect to get this right the first time, I'm sure it will take a few iterations to hone.  I'm especially interested in hearing about features omitted or overlooked that folks feel are actually valuable to support.</p>
    <p>Any comments/thoughts/ideas would be most helpful, posted here or on the www-style mailing list.</p>
    <p>John Daggett<br>
    Mozilla Japan</p>
