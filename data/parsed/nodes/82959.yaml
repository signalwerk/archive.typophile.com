      <p>Tim, Look at Type Tool or Fontographer - and any bad things you have heard about Fontlab are usually someone who has not worked with it very long - it is not perfect but it is the industry standard. Until it came along Fontographer was and is still a good choice and one in which I had students up and running very quickly. Both Type Tool and Fontographer also have pathways to upgrade to Fontlab. Good luck with your choice,<br>
      <a href="http://www.fontlab.com/" title="http://www.fontlab.com/">http://www.fontlab.com/</a></p>
