    <p>Hello Typophiles,</p>
    <p>I'm a student very interested in typeface design. I've been practicing my type drawing skills, but I'm ready to take it to the next level (digitizing). I've heard many bad things about Fontlab, but I understand it is the industry standard. How about Glyphs app in the mac app store? <a class="freelinking external" href="http://glyphsapp.com/" rel="nofollow">http://glyphsapp.com/</a> Does anyone have experience with this yet? </p>
    <p>Thanks for any input, I've learned a great deal from this forum so far. </p>
    <p>-Tim</p>
