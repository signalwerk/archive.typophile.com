    html: <p>My usual approach in Illustrator is to set the type I want to outline, then make a copy and paste right behind the original, then add a heavy stroke to the copy. That way you get the original letterforms plus the part of the stroke from the copy that extends outward. The easy way to get at the copy is by selecting both by dragging the selection tool over both of them, then using shift and deselecting the top one. <br> <br>When you've got the stroke you want, and it's time to finish up the job, choose paths/outline stroke from the object menu, then use the unite tool in the Pathfinder palette to get rid of all the inner paths that the outline stroke command creates. To really finish it off, you may want to eliminate some of the little bumps that are created, such as what you see around the top of the C of "Spaceman." Makes it look more like you did the outlining yourself instead of having the program do it for you. It will take some practice to get the hang of it (especially using the pathfinder palette successfully, as it sometimes does weird things), but it's a useful skill to have.</p>
