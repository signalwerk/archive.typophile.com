    html: <p>Ryan all those techniques are fine but the best way is create your type, make it white and go to the appearance pallet. There is a little arrow head at the top right of the pallet, hit it and under the pull-down menu add new stroke. Move the new stroke behind your type and scale it to suit yourself. Or select the stroke and under the edit menu select offset path and you can make it any size you  need. The benefit of this method is you can change the typeface and the stroke changes too. Useful with clients who change their minds.</p>
