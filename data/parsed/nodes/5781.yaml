    html: <p>easy..! here one version How-To-Do-How-Do-You-Do?! <br>use illustrator..  <br>2 layers with the text.  <br>Create Outlines..  which makes the type into an object.. so be sure you have not misspelled your text! <br>Layer 1 being on top with the text white. <br>2nd Layer with text black..  and then you outline the lines and make the stroke bigger... untill you get the amount of blackness around the white text. <br>When you are satisfied.. use (MAC CMD + Y   or WIN CTRL + Y  which will take you beneath the surface if you know what i mean...) and select the "white arrow" and select the inner lines and delete them. Get it? Then CMD+Y up to the surface again... <br> <br>so now you have 2 layers.. Group them if you want so that they will move together into one layer..  change colour etc etc..  and then you are all spiffed!! <br> <br></p>
