      <p>Somewhat similar to <a class="freelinking-external" href="http://new.myfonts.com/fonts/bitstream/french-111/">French Script</a>, shown in this Bitstream version. A number of other upright scripts are based on this style, including ITC Redondo.</p>
      <p>Of course, 1895 is a bit pre-digital, so you may not find an exact revival.</p>
      <p>- Mike Yanega</p>
