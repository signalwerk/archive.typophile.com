    html: |-
      <p>I ended up using Solotype’s Arcade (not Penny Arcade), Dawson, and Mural for the second set of fonts. It’s quite satisfactory.</p>
      <p>Still not what to do about the ronde font. The problem is that it has to be upright because it’s mirrored on the text, and right-slanting script becomes very illegible if mirrored and not upright.</p>
      <p>Michael Everson<br>
      evertype.com</p>
