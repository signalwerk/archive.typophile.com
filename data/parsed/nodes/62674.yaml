    html: <p>Don’t have my Jaspert, Berry &amp; Johnston with me right now to help out, but the script’s character is reminiscent of the rondes, from which there are a few to choose. French Script and Redonda are in character. Have you looked at Gando? It’s an older design, perhaps the caps are not as swashy as your sample.</p>
