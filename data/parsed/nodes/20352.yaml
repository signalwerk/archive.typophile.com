    <p>Hi there,</p>
    <p>I'm having some problems accessing the OpenType features in Meta Pro in Illustrator. I want to use small caps, but can't seem to find where to activate them. I know there is an OpenType palette within the Type palette in Illustrator, but there isn't a function to activate Small Caps. The only way I seem to be able to access them so far is through the Glyphs palette.</p>
    <p>If anyone can help me out it would be much appreciated.</p>
    <p>Cheers.</p>
