      <p>I should have mentioned I tried activating Small Caps like that as well, but they just seem to come out as faux Small Caps ie. All Caps scaled down. I did an experiment where I scaled a line of supposed Small Caps up to the size of the same line in All Caps and the glyphs were the same.</p>
      <p>Looks like I might have to contact FontShop.</p>
