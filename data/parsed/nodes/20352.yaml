      <p>I should have mentioned I tried activating Small Caps like that as well, but they just seem to come out as faux Small Caps ie. All Caps scaled down. I did an experiment where I scaled a line of supposed Small Caps up to the size of the same line in All Caps and the glyphs were the same.</p>
      <p>Looks like I might have to contact FontShop.</p>
      <p>Thanks anyway.</p>
  - id: 126647
    user: 108
    date: 2006-06-01T09:03:00
    date_raw: 1 Jun 2006 — 9:03am
    votes: null
    html: <p>Not sure if this will help, but I had a similar problem with Bello Pro with InDesign. I found that I had to have ligatures active in order to get the small caps to work.</p>
  - id: 126686
    user: 2203
    date: 2006-06-01T12:50:00
    date_raw: 1 Jun 2006 — 12:50pm
    votes: null
    html: <p>You have to go to preferences and change the dialog box on the percentage change of Caps to Small Caps it will never be true unless the typeface has been drawn in small caps</p>
