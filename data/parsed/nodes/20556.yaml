    html: |-
      <p>I think you should try the headline on two or three lines and visibly larger than the bullet points. The rules under the bullet points look as though they will fill in even on high quality brochure stock, they are also too close to the copy and don't perform any real function (although they are better than using a bullet), if their purpose is to separate each subject then do you need one for organization? I would also use the logo in the form it appears on the website (horizontal) as this allows the type to be larger as it is overwhelmed by the illustration at the moment. The contact information could also appear in one line. One of the reasons for this advice is that the mixed alignment/typefaces/size and leading of the elements are fighting one another.<br>
      I am not sure that the curtains really add to the design they seem more theatrical/horror movie than domestic and send out confusing messages; are we in a room looking out onto a foggy night; are we looking into a room from the outside?<br>
      My inclination would be<br>
      Headline enlarged split into three lines at top left possibly ranged right;<br>
      Bullets, ranged left starting nearer the horizontal centre vertically aligned to below the headline;<br>
      Contact Details in one line justified to the width of the horizontal logo bottom left, and<br>
      Background black<br>
      That's only a brief assessment and you might find it doesn't work for you, but I hope it is helpful.<br>
      Tim</p>
