    html: <p>If its an ad and you are not in control of the printing any halftone will be a disaster. Loose any halftones or gradients. I would use a white background because it is clean, fresh, new all the qualities that reflect your clients business. The dark curtain of uncertainty is a negative in my eyes.</p>
