      <p>I think you can enlarge the headline (btw traMsforming:) and the logo, think of it in the way you want a viewer to read it, which is somewhat what others said about hierarchy; you need to introduce some kind of progression (as distinct from steps) from headline to subordinate copy to contact to logo (although logo and contact details are interchangeable). As for font choice you need to keep that progression in mind, Trajan is a fine display face but needs to be bigger to work with your body copy wheras the contact details are overpowering the logo.<br>
      Thinking further I don't think the last bullet point • Organization really means anything in the context of the advertisement, it is the kind of nebulous heading that needs supporting copy.<br>
      Tim</p>
