    html: <p>I'm with Dan, lose the background. The white was better. There's a typo in your headline. It still looks static, because everything is stacked neatly. The logo should go above the contact info. Some of that type needs to be smaller and some of it should be bigger. You will create interest by creating a hierarchy of information, not when everything has the same visual weight to it. Right now you have 3 "chunks" of information that are relatively the same size/weight.</p>
