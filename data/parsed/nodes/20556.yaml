    html: "<p>I would rethink the layout rather than just the typeface. Most ads follow this hierarchy: 1. Headline 2. Visual 3. Body Text 4. Logo/Contact Info. 1 and 2 are sometimes switched, especially if you have a great visual (photo or illustration). Right now everything has about the same visual weight which is making everything blend together. Increase the size of the headline, eliminate the wide margins, put the logo and contact info at the bottom and see what that does.</p>"
