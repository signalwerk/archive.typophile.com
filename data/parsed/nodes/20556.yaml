      <p>As Chris mentioned, it's not so much the selection of type as the layout itself. It's like saying the color of your shirt can make you more impressive. Color and type are only parts of the whole.</p>
      <p>BTW -- I used to do small space B&amp;W ads for newspapers and yellow pages by the hundreds many years ago (and still will for beer money ;-&gt; ).</p>
      <p>My key question would be "what kind of clientele are you after?"<br>
      Your ad, since you design interiors, will be a direct reflection of your own style or the style that appeals to your potential clients.</p>
