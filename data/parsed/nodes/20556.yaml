      <p>I'm going to agree and say a headline is the missing piece. Not to bog down on the words, but the slogan or tag line or whatever you want to call it at the top is a lost opportunity. It leads me to wonder, "if I hired them to do my whole house, would they still work one room at a time?" I don't see what the idea is selling.</p>
      <p>Now that I made a mess of that, if I didn't have the resources to develop a meaningful headline-style campaign, I would enlarge the logo to nearly fill the space, line list the bits at the bottom, make the number big but submissive (as you have it), and think twice about the pic (which may turn out rather unflattering considering the print quality).</p>
