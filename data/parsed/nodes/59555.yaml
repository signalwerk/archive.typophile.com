    html: |-
      <p>Get two shapes, both must have a different direction!<br><img src="/sites/default/files/old-images/afb1_3706.png"></p>
      <p>Overlap.<br>
      Merge contours.<br><img src="/sites/default/files/old-images/afb2_6118.png"></p>
      <p>Remove the part you don’t like to have.<br><img src="/sites/default/files/old-images/afb3_6603.png"></p>
      <p>:)<br>
      Pieter</p>
