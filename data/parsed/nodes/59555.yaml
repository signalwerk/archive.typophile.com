  html: <p>In most vector editing programs I can use one contour to remove its shape from another contour. In Illustrator this is the “Subtract From Shape Area” feature. Is there some trick/macro for doing this with Fontlab’s drawing tools?</p>
  html_clean: <p>In most vector editing programs I can use one contour to remove its shape from another contour. In Illustrator this is the “Subtract From Shape Area” feature. Is there some trick/macro for doing this with Fontlab’s drawing tools?</p>
