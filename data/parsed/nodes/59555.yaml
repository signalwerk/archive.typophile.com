      <p>Get two shapes, both must have a different direction!<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/afb1_3706.png"></div><p></p>
      <p>Overlap.<br>
      Merge contours.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/afb2_6118.png"></div><p></p>
      <p>Remove the part you don’t like to have.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/afb3_6603.png"></div><p></p>
      <p>:)<br>
      Pieter</p>
