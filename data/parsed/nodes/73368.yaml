    <p>Greetings,</p>
    <p>I'm having a most difficult time trying to identify the two fonts used in the graphic below. I was hoping someone with a lot more expertise could offer some help. </p>
    <p>For Sid Vicious, it looks almost like Machine with a few of the points altered. Can anyone confirm that?</p>
    <p>And for the Millenium Man text, I'm just lost all-around on this one. </p>
    <p>The image itself, if it helps any is from a (c)2001 OOP VHS release from the Turner library. </p>
    <p>Anything you could advise is most definitely appreciated. Thank you.</p><div class="imageWrap"><img src="http://typophile.com/files/a5kqpi_4319.jpg"></div><p></p>
