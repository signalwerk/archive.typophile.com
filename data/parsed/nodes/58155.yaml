    html: |-
      <p>Hi, thanks for the comments! </p>
      <p>I have started reworking the face to make the lowercase glyphs more round. The inspiration for the typeface came from brutalist and structuralist buildings and I used it in one of my projects. I'm also working on the other glyphs as well.</p>
      <p>I tried the Q idea and it looks much better!</p>
      <p>Thanks!</p>
