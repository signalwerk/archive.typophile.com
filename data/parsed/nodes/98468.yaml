    html: |-
      <p>As an aside, I recently, serendipitously came across two well made Bayer (1998) WinTT fonts called Buccaneer and Buccaneer Swash. I thought they'd do nicely for a little project, so I headed to Fonts.com to do the right thing. What do I find?</p>
      <p><a href="http://www.fonts.com/font/monotype-imaging/buccaneer" rel="nofollow">This</a>. No means I can find of seeing the 3 fonts included and only WinPS and MacPS as the format options. Bob Anderton originally offered this font family via ITC, so I tried that website - only to get no more info and be promptly kicked back to fonts.com.</p>
      <p>I contacted fonts.com asking what's up with only T1 fonts in (then) 2012? "I have money ready to spend on your website if you can offer me modern day WinTT or Opentype fonts."</p>
      <p>A few days later, my contact respond thusly, "I spoke to the font development team and there are unfortunately no plans to convert the data of Buccaneer to TrueType or OTF. I apologize for the inconvenience!"</p>
      <p>What the hell?? How hard or time consuming would it be to do the conversions?</p>
      <p>I really hope they don't drag down their various acquisitions to their level of website functionality or customer service. Am I missing something? Is there some good excuse for offering (lots of, I've since found) T1 fonts with no plans to update?</p>
