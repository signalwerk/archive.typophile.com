  html: <p> You know what pisses me off? On page 93/94 of the current Oak Knoll catalog, there's this fancy book, selling for US$1700, made before the phototype/digital "dark ages", and the most prominent thing about it is how *horridly* they spaced the title. On top of it, what font did they use (using the term very loosely indeed) to commit this barbarism? Only Perpetua, which has the best Roman caps ever made in history. <br> <br>Where's my fauchard, man. <br> <br>hhp </p>
