    html: "<p>For you, I went through last night's trash: <br><a href=\"http://www.themicrofoundry.com/other/1935.gif\" target=\"_top\">http://www.themicrofoundry.com/other/1935.gif</a> <br> <br>OK, I understand that metal type couldn't have negative kerning (usually), so the \"RO\" can be explained. But that doesn't explain why the whole thing wasn't just spaced looser, and it doesn't explain the rediculous and uneven spacing around the \"Y\". <br> <br>From what I understand, Gill left the spacing of his fonts to the Monotype boys, and they were usually good at it. Maybe Pierpont was on vacation? In any case, the *user* of a font -especially in the setting of a title- is equally responsible for the outcome, especially in metal. And especially in the case of Latin all-caps. <br> <br>More: In the pre-digital days it wasn't really possible to implement very good spacing, but we now have no excuse to keep the spacing of Latin all-caps in the Bronze Age. <br> <br>Fonts should have positive kerning between all UC-UC pairs. <br> <br>hhp</p>"
