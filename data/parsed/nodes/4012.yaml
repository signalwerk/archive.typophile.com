    html: "<p>Hrant -- the Icone is more interesting in this context than the Breughel, really. In case Icone is difficult to find, I made a scan for you. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/4440.gif\" alt=\"Icone sample\"> <br> <br>The text accompanying this reads (in part): <br> <br>\"The stems of Icone flare emphatically toward their terminals, and the flares are asymmetric, stronger at the upper left entrances and lower right exits of strokes, echoing the ductus of a carolingian or humanist hand. The only straight lines in the lower case are brief horizontal terminations of strokes at the baseline, ascender line, cap line, and x line, occasional crossbars, and brief vertical terminations of curves in letters like c and s. In the capitals, straights appear only in the horizontal arms and crossbars of letters like E and H, and in the middle of sections of vertical stems. Icone remains a challenge to digital technology, but today (1988) there are high resolution digital typesetters that can render it crisply and faithfully.\" [from <i>Fine Print on Type,</i> Bedford Arts, San Francisco 1989] <br> <br>Hope you didn't choke on that \"ductus\" there. ;-) Forget the cuddly proportions; the structure is interesting, isn't it? <br> <br></p>"
