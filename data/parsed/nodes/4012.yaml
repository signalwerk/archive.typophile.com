    html: "<p>I know for a fact that Linotype have outlines for Icone, so there is no need to revive it: you just have to create a demand for it. There are probably lots of typefaces out there in digital limbo: halfway between photo or early computer typesetting and today's formats. Ikarus data probably exists for most of the typefaces developed in the late 1970s and early 1980s. Sometimes the Ikarus digitisation was done hurriedly, or a bad IK-&gt;PS conversion done, so the outlines would require a lot of clean-up and comparison to printed samples from earlier technology, which explains why some designs have not been released yet. <br> <br>Since Adrian Frutiger is still alive and Icone is owned by Linotype, 'reviving' it would not be ethical. Of course, designing original new designs in the same genre is not a problem, so long as they are sufficiently distinct.</p>"
