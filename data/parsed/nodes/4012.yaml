    html: <p>My analysis isn't expert, but you asked for it. <br> <br>For me, the unique character of the serifs in Avance doesn't lie in their asymmetry, half serif designs have been around (I can't name any, I'm sure the veterans can help me out here), but rather the unique character lies in the flaring sides of the stem opposite the serif. This brings some of the feel of an italicized face to the type without giving it a measurable slant. <br> <br>Even though the stems of glyphs have no slant, some glyphs seem to express a slight slant of a few degrees. The outer outline of the <b>o</b> seems to have this slant, while the counter is nearly vertically upright. The <b>c</b> and <b>e</b> share a large part of their outer edge with the <b>o</b> glyph, with the same slant. The upper arm of the <b>c</b> even extends further right than the bottom arm, emphasizing the slant. The left side of the lower chamber of the <b>g</b> extends further to the left than the top chamber, drawing this slant. Unlike most fonts, the <b>s</b> doesn't retract its arms narrower than its loops in an effort to find balance, but instead adopts a slight lean. This effort to show slope extends to the upper case, in particular in the <b>G</b> and <b>B</b>, whose upper arm and loop respectively extend further right than conventionally. <br> <br>I have a problem with the <b>t</b> glyph. Its curved stem looks great when the glyph stands alone, but composed in text it feels like it's trying to squirm away. It doesn't share the same serif structure that the other stems do, but this doesn't mean it shouldn't march to the same rhythm. The <b>g</b> glyph is also too dark. It weighs down the words in which it participates. <br> <br>The size that the Daidala archives were set in works well on the screen (though I suspect this is because the text is gray), but feels too large when printed. The contrast is so even that it feels heavy around 11pt. I found it much more pleasant to read at something like 8pt. Then again, I have young eyes. <br> <br>I like this font, especially for the shape of the upper case. The conventional design of the upper case serif alphabet has been so regularized that it looks identical in so many different fonts. Avance brings the upper case a fresh feel that takes advantage of our expanded tolerance for experimentation in this post-emigre era.</p>
