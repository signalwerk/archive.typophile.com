    html: "<p>Interesting analysis. <br> <br>&gt; half serif designs have been around <br> <br>Actually, it's surprising how few there are. Meier has a couple, but they're way too calligraphic, and don't have any \"counterweighting\" like Avance does, so they lean backwards - very distracting. The French seem to do it sometimes: Mandel has one, and it's pretty cool; JFP has Angie, and Thierry Puyfoulhoux has Cicero, but those two don't have enough serifs, they're more like a sans with instrokes. Then there's Rotis Semi-Serif, but it also has too few serifs. <br> <br>Avance, and Burke's recent Parable are the only two that I would personally use for text. Wait, I'd also use my Harrier (basically the Latin \"subordinate\" of my Nour), but I don't think anybody else would...  :-/ <br> <br>&gt; flaring sides <br> <br>I was fortunate to get to know Evert during the ATypI-Boston conference (thanks Phan, wherever you are), and he showed me Avance (called something else back then, I think), around a year before FontFont started selling it. As his explanation for Avance on the FF site might indicate, he needed to see the reason for serifs before incorporating them into his work, and at first he just put them plainly on the top-left and bottom-right ends of strokes/elements. But then he realized they were leaning backwards... and he started wrestling with the possible solutions. He decided to add those flares to balance things. As for myself, in Harrier, I wanted to avoid the soft femininity of flares, so instead I slanted the whole thing forward as gently as possible: 1/16 = ~3.58 degrees. Interestingly, some famous slanted fonts (like Unger's Flora and Gill's Joanna Italic) use an angle close to that. <br> <br>This makes your observations of slight slanting in some glyphs very relevant. How much of it was intentional, I wonder. <br> <br>&gt; The g glyph is also too dark <br> <br>Huh, I hadn't noticed that. But it's very slight. <br>What might have helped is an open bottom. <br> <br>&gt; feels heavy around 11pt. <br> <br>Yes, Avance is a chunky friendly face - in fact a bit too cloying for my tastes*. The huge x-height makes it work better at small sizes. This is most apparent in the book \"John Kelly\", where Avance is used (with no credit anywhere...) for the titles, text and captions, and it's in this last usage where it shines the most. <br> <br>* Which doesn't dampen my ideological admiration for it: I think it's a landmark work, the most significant entry in the FF library. <br> <br>&gt; Avance brings the upper case a fresh feel <br> <br>The Latin UC set is so paradoxical: it's so much better balanced than the lc set, but it's also less readable, and used for only about 5% of text. It's a very tricky decision what to do with it: make it conform to the lc*, make it it's own thing, or something in the middle. Pragmatism dictates that the last option would be the best, but I personally haven't been able to pull that off yet (and I actually don't think Avance does either - although maybe it doesn't even try), so I've reverted to the second option. (I'm talking structurally - matching the finish is easy). <br> <br>* BTW, I've always thought Uncial caps are better. <br> <br>On to Sonoma... <br></p>"
