    html: "<p>Thanks a lot for the Icone scan. I do remember seeing it, but in this context I'm struck by the resemblance to Avance - even the cuddliness. A French type designer once told me that Bloemsma really admires Excoffon's work (and by extension French type design in general?), but he didn't mean it in a nice way, and I reject that (even though I admire the flying French playboy myself). But there's certainly some parallel evolution there - compare FF Balance to Olive. <br> <br>&gt; Hope you didn't choke on that \"ductus\" there. <br> <br>Yeah, it's a good thing I'd already finished by chocolate donut... <br> <br>That's what's paradoxical about the semi-serif: even designers who are dedicated to chirographic type don't seem to implement them. And you know that Bloesma is strongly anti-chirographic - the type gods bless his soul. <br> <br>-- <br> <br>The Menhart, I didn't know about (or at least didn't realize as relevant). It's really very interesting - thanks! I'd say that it has enough serifs to be a text font, and the vertical prorportions are very good for book work. I'd love to see something set in it. And that UC \"U\" is masterful. <br> <br>So you're saying it's not available in digital? Come on, guys, stop tripping over Garamond, revive <i>this</i>, please! <br> <br>hhp <br></p>"
