    html: <p>Hrant -- <br> <br>You might be interested in looking also at Frutiger's little known designs Breughel and Icone. Neither is truly half-serif (Icone comes closer) -- more like extremely asymmetrical serifs. Both have a calligraphic influence which you will undoubtedly disdain, but the serif effects are interesting to observe in action.  <br> <br>I don't believe either is available digitally, but you can see examples in <i>Fine Print on Type</i> (which I think you have, right?) <br> <br>-- K. <br> <br></p>
