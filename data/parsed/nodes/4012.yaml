    html: "<p>Note: the fact that I'm not crazy about Avance does not mean I don't realize its value. And of course it works great in text. Possibly I'm influenced by the fact that I don't like low-modulation serifs (see for a totally different take Emigre's Fairplex) and for the same reason Avance works great in tiny sizes. <br>Bloemsma is great. If I would be forced to choose two text-aimed faces from the FontShop library I would probably choose the basic Quadraat by Fred Smejers and Balance by Bloemsma. Anyway there are many great text faces. We're so used to Meta that we are no longer able to see how nice it works. <br>Looking at old I.D. Magazine issues I remember how simple and good the design was, using mostly Meta and Joanna. They just did too many weights of Meta. Endless Italic Small Caps sets are the most absurd thing in the FontShop library. <br>But probably I'm just against the abuse of beautiful text faces in advertising...</p>"
