  html: |-
    <p>Hello,</p>
    <p>I've stumbled upon a bug in Safari (and webkit browsers) when using the Mark feature in web fonts,<br>
    As demonstrated by the screenshot, when a word has diacritics either on the beginning or the ending, the word space gets omitted.</p>
    <p>I've tried my own fonts, and multiples fonts by other vendors but i get the same result, Only fonts that implement the Mark feature display the error.<br>
    Is anyone else facing the same problem? </p>
    <p><em>Tested on Safari 6.0.5/osx 10.8.5</em></p>
