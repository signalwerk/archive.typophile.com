    date: 2014-03-25T17:39:00
    date_raw: 25 Mar 2014 — 5:39pm
    votes: null
    html: <p>Yep, safari doesn't interpret diacritics correctly in arabic fonts. It is possible that problem stems from an engine that converts opentype features to AAT features in OSX, but I'm not sure about that. Also right to left kerning is not applied to the glyphs.</p>
