    html: <p>We noticed similar problems and reported them to Apple. In our case (I am not quite sure if we figured out the logic) it was a WebKit bug and seems to be present in all versions of Mac OS X from Snow Leopard (10.6) up to Maverics (10.9), although it seems to be getting better.</p>
