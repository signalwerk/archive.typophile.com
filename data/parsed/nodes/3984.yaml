    html: '<p>Yes, I think Emilie is talking about the style with the rules, probably the one most often seen in pre-typographic writing, before expediency caused the adoption of a simple string of “X”, “V”, etc. The diﬀerence between normal caps and barred Roman numerals isn’t just the bars though: I think the Roman numerals have to be smaller too — like smallcaps. <br><br>There must be some fonts like that, but I know of only one: <span class="caps">ND</span> Fontana (by Ruben Fontana). <br><a href="http://www.myfonts.com/fonts/neufville/fontana-nd/" target="_blank">http://www.myfonts.com/fonts/neufville/fontana-nd/</a> <br>But I’m not actually sure if the retail version has the Roman nums. All I know is that tipoGraﬁca magazine uses them, and they look sharp indeed: <br><br><img src="http://www.typophile.com/forums/messages/4100/32168.gif" alt="Fontana"><br><br>Interestingly: <br>1) They’re in a sans font. <br>2) The bars are not full. But look at the bottom of that “V”! Wonderful. <br><br><span class="caps">BTW</span>, I think one reason for the presence of Roman numerals in Fontana is that they’re needed much more in Spanish than English (where things like “15th century” are the norm instead). <br><br>&gt; there are Unicode code points for roman numerals <br><br>Hey, I didn’t know that! <br>Maybe “true” Roman numerals will become the new black… <br><br>hhp <br></p>'
