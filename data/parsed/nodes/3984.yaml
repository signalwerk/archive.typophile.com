  html: "<p>Would anyone know of a serif font (a classic as much as possible) that contains roman numerals? (I think roman numerals is the right name, by this I mean: I, II, III, IV, etc.). I've checked experts sets and couldn't find anything. Any input? <br> <br>Thanks, <br>Em <br> <br>PS: Already posted this in the type ID forum but I wasn't sure if it really belonged there.</p>"
