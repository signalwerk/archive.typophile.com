  html: '<p>Would anyone know of a serif font (a classic as much as possible) that contains roman numerals? (I think roman numerals is the right name, by this I mean: I, <span class="caps">II</span>, <span class="caps">III</span>, <span class="caps">IV</span>, etc.). I’ve checked experts sets and couldn’t ﬁnd anything. Any input? <br><br>Thanks, <br>Em <br><br><span class="caps">PS</span>: Already posted this in the type <span class="caps">ID</span> forum but I wasn’t sure if it really belonged&nbsp;there.</p>'
