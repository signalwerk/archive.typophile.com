    html: <p>Cool, thanks for all the input! <br><br>I wasn’t too sure if they were usually written together (with the top and bottom bars) or spaced.  <br><br>I was using Courier in pretty big size and it looked kind of weird with the serifs, especially that the spacing was so wide. I switched to FedraSans and now it doesn’t look “oﬀ” if they don’t touch each other. <br><br>Thanks for the distinction between numbers and numerals too, I’ll try and remember that =) <br><br></p>
