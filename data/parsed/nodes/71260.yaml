      <p>Parachute just released an Arabic companion for their DIN family. <a class="freelinking external" href="http://blog.parachutefonts.com/?p=1812" rel="nofollow">http://blog.parachutefonts.com/?p=1812</a></p>
      <p>Linotype's Frutiger Arabic would work good also and it's a really nice Arabic "Sans Serif"</p>
      <p>Also Tarek Atrissi has this geometric font that's really cool I don't know if it's available for licensing, I guess you can contact him about it if you like it.<br>
