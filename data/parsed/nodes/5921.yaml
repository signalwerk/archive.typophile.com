    html: <p>The second logo makes me think more of a diamond setter rather than a company that installs stone tile. Could you please tell us a little more about the company? What kind of stone do they work in? Is it rough textured stone-implyed by the rough edges of the word "stone" Is it smooth marble tiles? Both? Stones for floors? walls? both? rock shaped stones or cut tiles? </p>
