  - id: 42106
    user: 804
    date: 2004-08-05T16:23:00
    date_raw: 5 Aug 2004 — 4:23pm
    votes: null
    html: <p> The rough "Stone" type may appeal to lowest common demographic (AKA American Public), But it is not attractive.  <br>I agree, the concept of the "target" and the line reaching out at 90 degrees has been done a lot. I think of this as something to do with lasers or light, besides this look is a bit dated. <br>I would suggest re-thinking concept. I agree with Scottt that "Precision" can/should imply quality and finess in craftmanship as well as mechanical/technical precision. Bold type looks bad. <br>Consider which suits this client and demographic best. <br>Consider this as well, sometimes it is possible to sell clients on something they do not personally like if you can explain to them it will benefit them financially by reachinbg their target audience. This is after all business and not art. <br>If your clirent won't listen to you shoot him. You can always claim him pushing the target concept had something to do with it. </p>
