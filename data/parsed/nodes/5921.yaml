  - id: 42103
    user: 3472
    date: 2004-08-05T10:27:00
    date_raw: 5 Aug 2004 — 10:27am
    votes: null
    html: <p>Too many things going on in the logo. Targets are not a good idea. Looks like a GUN company. It would be cooler if there was something a little off with the word PRECISION. Laying tile is not a mechanical excersise, it's done by hand. There are bound to be some alignment errors that happen when laying tile. You might try something more SHABBY SHEAK/ Earthy. Right know the logo feels too Concrete, not enough class and sophistication in the typography. You might also try a Typeface that is based on PRECISION ie Bodoni or Didot. </p>
    html_clean: <p>Too many things going on in the logo. Targets are not a good idea. Looks like a GUN company. It would be cooler if there was something a little off with the word PRECISION. Laying tile is not a mechanical excersise, it's done by hand. There are bound to be some alignment errors that happen when laying tile. You might try something more SHABBY SHEAK/ Earthy. Right know the logo feels too Concrete, not enough class and sophistication in the typography. You might also try a Typeface that is based on PRECISION ie Bodoni or Didot. </p>
