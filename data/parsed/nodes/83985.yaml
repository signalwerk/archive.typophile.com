    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ATypI-Reykjavik-2011-SMALL_4134.png"></div><br>
    Association Typographique Internationale (<a href="http://www.atypi.org/about-us" rel="nofollow">ATypI</a>) is pleased to offer the members of the Type Directors Club (<a href="http://tdc.org/tdc/about" rel="nofollow">TDC</a>) a special discounted rate for registration for its <a href="http://www.atypi.org/2011-reykjavik" rel="nofollow">conference in Reykjavík</a> (14–18 September 2011).<p></p>
    <p>TDC, located in New York City, is a sister association of ATypI; it is an international organization for all people who are devoted to excellence in typography, both in print and on screen.</p>
    <p>All members of TDC are getting a 10 per cent discount on a registration fee for ATypI 2011. They can also take advantage of the early bird rates prior to August 13. Registration for ATypI 2011, full-price and discounted, includes trial membership in the Association through the end of 2011. Questions? Please contact <a href="secretariat@atypi.org" rel="nofollow">secretariat@atypi.org</a>.</p>
