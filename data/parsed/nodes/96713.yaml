      <p>@kotg: Welcome to Typophile! A quick tip to help you out: </p>
      <p>In the future, try to use informative hyperlink language other than ambiguous words such as “this” or “here.’’ They gives the user no idea where they are about to go . Instead, try “<em>I’m looking for a sans serif used on <a href="http://blog.davor.se/" rel="nofollow">this website about visual programming</a></em>.” That makes it easier for the user, and you will get more responses.</p>
      <p>Good luck, and may the fonts be with you… </p>
      <p>(booo)</p>
