      <p>You won't find this combination of swirly capitals and plain lower case in a single font. For swirly capitals check out Melany Lane <a href="http://www.myfonts.com/fonts/yellow-design/melany-lane/" title="http://www.myfonts.com/fonts/yellow-design/melany-lane/">http://www.myfonts.com/fonts/yellow-design/melany-lane/</a> or ITC Clover <a href="http://www.myfonts.com/fonts/linotype/clover-itc/" title="http://www.myfonts.com/fonts/linotype/clover-itc/">http://www.myfonts.com/fonts/linotype/clover-itc/</a><br>
      Also CAC Lasko by American Greetings Corporation 1996. Don't know of a legitimate source.<br>
      Don</p>
