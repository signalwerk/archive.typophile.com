      <p>If you in fact are going to have a critical discussion on this topic then I would get rid of the word “capitalism”. Were there not banks under Hitler, Mao, Mussolini, Marx etc (even if some were nationalized). Why not just say banks and leave out the “C” word. </p>
      <p>Or just ask about typefaces associated with the financial community.</p>
      <p>Michael</p>
