      <p>Looks like the two definitions are acceptable:</p>
      <p>From WordNet (r) 2.0 :</p>
      <p><strong>masthead</strong></p>
      <ol><li>a listing printed in all issues of a newspaper or magazine (usually on the editorial page) that gives the name of the publication and the names of the editorial staff, etc. [syn: flag]</li>
      <li>the title of a newspaper or magazine; usually printed on the front page and on the editorial page</li>
      </ol>
