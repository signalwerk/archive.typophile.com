      <p>&gt; <em>“Mast” (standard bearer) “head” (top, headline).</em></p>
      <p>Yes -- as misused by us landlubbers.<br>
      But to mariners, the masthead (<a href="http://modelers.tallshipmodels.com/dianaproject10.htm" target="new">photo 1</a>) is the topmost section of the mast which bears the rigging. A flag or pennant can be flown from the masthead or flagstaff, a pole extending above the masthead.</p>
      <p>So the <em>masthead</em> bears the work, like the staff of a publication.</p>
      <p>&gt; <em>This board is one of the places where pedantry is warranted. </em><br>
      Thank heavens! I'm generally considered a bore at cocktail parties.</p>
