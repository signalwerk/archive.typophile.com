      <p>Oh, ick — I loathe pedantry. But here, if anywhere, we ought to be accurate about publishing industry terminology.</p>
      <p>A magazine’s masthead is not its nameplate (the place where the logo appears). A masthead is the list of editorial and publishing staff.</p>
      <p>--Kathleen</p>
