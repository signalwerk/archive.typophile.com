    html: |-
      <p>Kathleen is absolutely correct. (BTW -- hi Kathleen, long time, no talk)</p>
      <p>Masthead has mistakenly been used so often instead of the correct terms of <em>nameplate</em> or <em>flag</em> that it has taken over through common misuse.</p>
      <p>Many years ago I worked for two newspaper publishers, <em>masthead</em> ONLY referred to the section that carried the name of the publisher, chief staff and place of publication.</p>
      <p>I guess it's the same way that FONT has now become what we called <em>typeface</em>.</p>
