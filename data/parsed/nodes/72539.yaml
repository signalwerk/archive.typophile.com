    html: |-
      <p>I make alternate punctuation characters, e.g. "parenleft.case".</p>
      <p>But I try not to overdo it, and now put a lot less kerning in fonts than I used to.<br>
      For instance, if you kern a raised hyphen with capitals, PART-TIME will look like shit, because there will be a huge space between R and T, and the two T arms will be bumping, with the hyphen jammed up underneath them. </p>
      <p>The side bearings of a hyphen are part of the character.</p>
