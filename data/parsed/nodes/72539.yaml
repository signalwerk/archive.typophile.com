  html: |-
    <p>Dear readers,</p>
    <p>i am wondering how to best handle case sensitive punctuation (opentype CASE feature) and kerning of these characters with uppercase letters. Depending on the vertical position of the character (let's say "{"), the horizontal kerning has to change too to make everything look well alligned.</p>
    <p>I can imagine of these solutions (working with fontlab 5):</p>
    <p>- kern as if CASE was always applied (looks ugly if the user just types with capslock)</p>
    <p>- kern as if CASE was never applied (often looks bad just when it should actually look good)</p>
    <p>- fiddle with the horizontal pos values in CASE feature - but it would mean to change them for every possible combination manually - lots of work ...)</p>
    <p>- make duplicates (or even design special) "{.case" variants, just do substitutions in CASE feature, and do kerning with these variants instead of the lowercase ones. This would work, but doubles glyphs and is quite "not as it was meant". </p>
    <p>so what do you think is best practice for this?</p>
    <p>tanks for your input<br>
    Sebastian</p>
