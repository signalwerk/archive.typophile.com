    html: <p>I have additional glyphs for punctuation to uppercase and small caps. Petite caps uses the same normal punctuation. In most cases these glyphs are copy of normal ones, just vertically repositioned and with different spacing. Sometimes the glyph is also a bit edited to match UC and SC height. Using proper spacing may avoid the need to special kerning in most glyphs.</p>
