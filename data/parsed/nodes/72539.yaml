      <p>Yeah, .case glyphs that are just repositioned vertically and like Igor said, depending on the type style maybe edited even more.</p>
      <p>Then I have a separate kerning text file that has all punctuation forms replaced with, say /parenleft.cap hyphen.cap etc.</p>
      <p>It's easy to do just using Find/Replace in a text editor and doesn't take long to get through the kerning for the case feature</p>
