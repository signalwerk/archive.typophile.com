    html: |-
      <p>This reminds me of that cool Nofont thing a while back...</p>
      <p>&gt; that’s a bunch of fonts that have to be laid over top of each other</p>
      <p>But how else can you get shading Dan? Type3 is dead, Photofonts is bitmaps. But yeah, I <strong>would</strong> be curious to find out how these things (FF Primary probably being the least obscure example) actually sell...</p>
      <p>As for the forms:<br>
      - Can the "e" be improved? I think it could get mistaken for an "o", especially in some contexts.<br>
      - I wonder if there's a way to pull apart the "h" and "n".<br>
      - The "r" and "u" are not working.<br>
      - Could the "x" be less out of character?<br>
      - The parens looks just like the square brackets.<br>
      - I can't tell what the thing between the percent and the question is.<br>
      - ...<br>
      Now I'm actually tired - I'm gonna take a break.  :-)</p>
      <p>hhp</p>
