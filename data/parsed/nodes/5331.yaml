    <!--/attachment--><!--/attachment--><p> <br>Kub was initially design to be a 3D typeface (as a sculpture). <br> <br>Now a font, the actual suitcase contains a Regular, light, midtone and shadow version, the best result is achieved when the fonts are layered on each other in varied tonal value to create a single 3D typeface.  <br> <br>AF Kub is part of the ACME font library <a href="http://www.acmefonts.net/" target="_blank">www.acmefonts.net/</a> and is available to buy at Fontworks <a href="http://www.type.co.uk" target="_blank">www.type.co.uk</a> <br> <br>(Right click and zoom in) <br></p>
