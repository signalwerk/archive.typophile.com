    html: <p>In a way this reminds me of certain graffiti styles - specifically, the way strokes can be seen either as 3D volumes (which are purely pictorial) or 2D shapes (which are purely symbolic). The balance struck here is pretty cool! Easy to interpret as volume or shape, simultaneously even.</p>
