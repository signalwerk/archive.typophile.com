    html: |-
      <p><cite>Why would one set up Arial as a web font instead of counting on it being installed on the target computers?</cite></p>
      <p>I agree if all one was trying to do was rely on Arial. BUT, there aren't very many styles of Arial or Helvetica one can reasonably count on being available, compared to the number of styles of Helvetica that exist. If a designer wants a reasonable "palette" of styles to work with, some other web font solution seems called for, besides relying on system fonts.</p>
      <p>Cheers,</p>
      <p>T</p>
