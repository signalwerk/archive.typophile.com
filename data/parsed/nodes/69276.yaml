    html: |-
      <p>&gt;Why would one set up Arial as a web font instead of counting on it being installed on the target computers? </p>
      <p>So that the counting on you speak of is converted to fact. The web developer can make any assumption they want, but in the end, if a user doesn't fit the assumptions, it's too late once the site hits the user's screen.</p>
      <p>Cheers!</p>
