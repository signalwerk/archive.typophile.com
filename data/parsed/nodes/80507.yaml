      <p>The problem with the Identifont and Raph’s suggestions (in addition to the dates) is that your font was almost undoubtedly cast and sold in Great Britain, not America. It will be foundry type, not Monotype.</p>
      <p>You’ll want to find specimens for British foundries of the late 1800s. Each probably offered a handful of Modern style fonts like this. Without a better sample, it may be difficult to pin down exactly which foundry this particular example was from.</p>
      <p>This could also very well have come from one of the Scottish foundries in Glasgow.</p>
      <p>It's a fairly common style from that period. I have a 1923 Stephenson Blake &amp; Co. specimen and there are at least four Moderns for body text that get close. But by this time, SB had converted most of their fonts to alignment on the American Point Lining system. This alignment is what led to short descenders in many cases.</p>
      <p>You’ll want to find samples from before the adoption of that standard.</p>
