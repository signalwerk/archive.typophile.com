    <p>I'm trying to identify a typeface used in an old sci-fi book, 'The Germ Growers', of which I have a PDF scan, freely available from the <a href="http://nla.gov.au/nla.aus-vn4931952" rel="nofollow">National Library of Australia</a>.  I'm including a raster sample below, which features a distinctive 'Q' and (I hope) a reasonable mix of uppers and lowers:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/germ-growers-sample_4629.png"></div><p></p>
    <p>The print quality or resolution was too poor to get a good result from WhatFontis.  Identifont suggested that it's "Escrow", and it's really close... but that didn't exist in 1892.  Also, the eye of the 'b' and 'd' is a bit too full and round, and so generally with the miniscules... Escrow is just that much too wide to be a perfect match.  A little digging revealed that Escrow referenced Monotype’s 1908 Scotch No. 36, but even that's too late.</p>
    <p>The book was printed by J. S. Virtue &amp; Co. of London, in 1892, if that helps.</p>
    <p>Raph Levien suggested that it is similar to "Round-face on long-primer body, Farmer Little &amp; Co", <a href="http://books.google.com/books?id=18gDAAAAIAAJ&amp;pg=P221&amp;dq=plain+printing+types&amp;hl=en&amp;ei=S5uOTefnEcqz0QGfvLW4Cw&amp;sa=X&amp;oi=book_result&amp;ct=result&amp;resnum=2&amp;ved=0CD4Q6AEwAQ#v=onepage&amp;q&amp;f=false" rel="nofollow">p.221 of De Vinne's Plain Printing Types</a>, but noted that my sample has longer descenders.  He reflected that that might be, "the biggest clue - most Scotch Roman and "Modern" fonts have fairly short descenders."  He referred me to this board.</p>
    <p>I'd really appreciate any help or suggestions.</p>
