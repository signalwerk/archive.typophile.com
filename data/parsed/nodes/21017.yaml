    html: |-
      <p>Hello,</p>
      <p>I'm new here, but may be a little bit of help.</p>
      <p>The glyph is an abbreviation of the latin suffix -que (meaning and). In old fonts the may be up to 3 or more different forms of this abbreviation. This kind of abbreviation was used in prints till the end of the 16. century (maybe a bit longer).</p>
      <p>Wolfgang</p>
