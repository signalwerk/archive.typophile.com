    <p>I need help identifying this bit of type. The image was taken by my friend Ben Kiel while on a tour of the type-savy land of the Dutch. The glyph reminds me of the Renaissance born symbol for addition; representing the first letter of the word piú or plus. Alternatively, it could be a fancy way of depicting a new paragraph. Any thoughts?</p>
