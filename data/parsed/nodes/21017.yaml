      <p>&gt; <em>Miguel, do you think it’s a ‘¿’ …?</em></p>
      <p>No, not at all. I believe that glyph was put in INVERTED QUESTION MARK (U+00BF) on 1530 Garamond Archaics due to the lack of a better place. In fact, there's not really a proper place as I think Unicode does not have code points for a lot of the glyphs present in that font.</p>
      <p>&gt; <em>Yes, this would be a glyph ID I hate putting my topics in the wrong place … sorry.</em></p>
      <p>No worries, there's not really a proper forum for glyph ID either :^D</p>
