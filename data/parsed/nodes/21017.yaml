    html: |-
      <p>sorry for answering late ...</p>
      <p>there is an excellent work on Latin and Italian abbreviations of the middle ages by Adriano Capelli. It covers about14000 forms. Although this book is about manuscript abbreviations it covers all the forms used in print – as those are derived from the manuscript ones.</p>
      <p><a href="http://inkunabeln.ub.uni-koeln.de/vdibProduction/handapparat/nachs_w/cappelli/cappelli.html" title="http://inkunabeln.ub.uni-koeln.de/vdibProduction/handapparat/nachs_w/cappelli/cappelli.html">http://inkunabeln.ub.uni-koeln.de/vdibProduction/handapparat/nachs_w/cap...</a> </p>
      <p>You may also be interested in the forms used by Gutenberg. There is a page at</p>
      <p><a href="http://webserver.erwin-rauner.de/crophius/faulmann_images_plus.asp?suchdatei=faulmann1203.gif" title="http://webserver.erwin-rauner.de/crophius/faulmann_images_plus.asp?suchdatei=faulmann1203.gif">http://webserver.erwin-rauner.de/crophius/faulmann_images_plus.asp?suchd...</a> </p>
      <p>wolfgang</p>
