    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 1.Oct.2008 12.38pm </div>
      <p>For Immediate Release<br>
    Buffalo, NY- October 1st, 2008</p>
    <p>P22 and the International House of Fonts proudly announce P22 Counter- a<br>
    new typeface designed by Canada Type’s Patrick Griffin for P22’s IHOF<br>
    collection.</p>
    <p>Designed by Canada Type principal Patrick Griffin, P22 Counter is a very<br>
    geometric font based on parallel strokes. The Cursive and Swash Alts styles<br>
    were based on the idea for an uncredited film face called Whitley,<br>
    published by a little known English typesetting house in the early 1970s.<br>
    Line &amp; Hack are extrapolations of the above.</p>
    <p>Single styles are offered in basic OpenType with linguistic support for<br>
    Central and Eastern European, Turkish, Baltic, Celtic/Welsh and Esperanto<br>
    character sets.</p>
    <p>Counter Cursive Pro combines Cursive &amp; Swash Alts.</p>
    <p><a href="http://www.p22.com/ihof/counter.html" title="http://www.p22.com/ihof/counter.html">http://www.p22.com/ihof/counter.html</a><br>
    ————————————————————————<br>
    For the month of October, P22 is offering a special Halloween-themed font<br>
    pack- Five Frightening Fonts From Five Foundries! Included are (P22) Posada<br>
    Extras, (IHOF) Aglio, (LTC) Lanston Halloween Ornaments, (Sherwood)<br>
    Phantasmagoria, and (Rimmer) Zigarre Script.</p>
    <p><a href="http://www.p22.com/products/monthly.html" title="http://www.p22.com/products/monthly.html">http://www.p22.com/products/monthly.html</a></p>
    <p>————————————————————————<br>
    The P22 type preview tool, the TypeCaster has been revamped for easier<br>
    previewing and better resolution. Now you can zoom in as well as out to see<br>
    any given font in any given size with any of your own text. Give it a try!</p>
    <p><a href="http://www.p22.com/products/typecaster.html" title="http://www.p22.com/products/typecaster.html">http://www.p22.com/products/typecaster.html</a></p>
