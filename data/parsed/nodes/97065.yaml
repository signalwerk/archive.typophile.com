    html: <p>I was doing work for both Linotype and Microsoft at the time of the development of Palatino Linotype, and had the story from both sides. Bruno Steinert was head of Linotype at the time, and was a good friend, as were many of the people involved in the project on the Microsoft side (Geraldine Wade, Mike Duggan, Greg Hitchcock). Bruno had hoped that Palatino Linotype would replace Book Antiqua, in Windows and Office, but because of existing user documents set in Book Antiqua and the lack of metrics compatibility between the two fonts, Microsoft decided that it could not remove support for that font. But at least, through the Palatino Linotype project, Hermann Zapf and Linotype received money from Microsoft for the licensing of the legitimate type.</p>
