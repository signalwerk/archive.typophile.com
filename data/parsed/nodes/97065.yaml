    <p>Hey all,</p>
    <p>This is the link posted by zeno333 ( <a href="https://web.archive.org/web/20150124093638/http://www.typophile.com/node/95122" title="http://www.typophile.com/node/95122">http://www.typophile.com/node/95122</a> ) to know what is your favorite letter. <a href="https://web.archive.org/web/20150124093638/http://www.youtube.com/watch?v=F691weEVpwc" title="http://www.youtube.com/watch?v=F691weEVpwc">http://www.youtube.com/watch?v=F691weEVpwc</a><br>
    There is another thing towards the end of the video where Mr. Spiekermann criticizes Microsoft a lot. He goes to say that Microsoft is a company with bad tatse and stingy( since they didn't want to pay Linotype their license). He also says they commissioned Segoe to look like Frutiger and Arial to look  like Helvetica.<br>
    I think  Microsoft does a lot in the field of Typography(OpenType and VOLT). I also personally like Segoe UI more than Frutiger.<br>
    Do you think Mr. Spiekermann is right here?</p>
    <p>Thanks<br>
    T</p>
