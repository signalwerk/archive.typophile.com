    html: |-
      <blockquote><p>I did work on both mac and windows (used adobe programs) and I hardly find any difference</p></blockquote>
      <p>Adobe software has its own type rendering engine, so it effectively shields you from 'local' OS oddities.<br>
      As a consequence, one of the things that can go wrong with this workflow is Apple's proprietary changes to perfectly good fonts.<br>
      For one, it has been <a href="https://web.archive.org/web/20150124093638/http://forums.adobe.com/message/4320355" rel="nofollow">noted on the Adobe InDesign forum</a> that Apple's version of Baskerville has such weird hinting that Adobe's rendering actually makes it worse to read, rather than the perfectly good job they pull off with your average font.<br>
      The system font "Helvetica Neue" is so messed up that it has been <a href="https://web.archive.org/web/20150124093638/http://www.fontgeek.net/blog/?p=253" rel="nofollow">advised to entirely avoid it</a> (even if you can get it to work, sometimes you get pretty weird results when trying to embed it into a PDF).<br>
      Their private implementation of embedding color bitmaps into the Apple Emoji font is exactly that: private, undocumented, and not supported by any other software than Apple's (see <a href="https://web.archive.org/web/20150124093638/http://typophile.com/node/96671" rel="nofollow">Unicode Definition For Dummies? Also: pixel precision</a> for a full discussion).<br>
      Likewise, Apple's Advanced Typographic options are only available in Apple's own software; <a href="https://web.archive.org/web/20150124093638/http://forums.adobe.com/thread/1079342" rel="nofollow">InDesign cannot access them</a>.</p>
      <p>Compare this with Microsoft's continuous updating of Uniscribe (their OpenType interpreter), to such a point that Word, lousy as it may be, effortlessly displays complex interacting glyphs where InDesign, Adobe's "flagship of typography" fails miserably.</p>
    html_clean: |-
