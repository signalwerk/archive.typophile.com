    html: |-
      <p>I personally prefer Book Antiqua over Palatino Linotype since it has been supplied with Office since version 4.3 (1994). I also find the default line spacing of Palatino Linotype too wide. A lot of organisations prescribe Book Antiqua to be used for documents. So there are millions of documents set in Book Antiqua. That explains why Microsoft could not remove it back in 2000 and replace it with Palatino Linotype. They certainly could not remove it today, since the amount of documents in Book Antiqua has been growing ever since.</p>
      <p>Did you know there exists a Book Antiqua Parliamentary? It is being used by the British Parliament. I found this explanation from a House of Commons official:</p>
      <blockquote><p>We understand that Book Antiqua is published by Monotype and made available under license by Microsoft in some of their software packages. We can confirm that the Book Antiqua Parliamentary font is the same as standard Book Antiqua apart from the use of curved as opposed to straight quotation marks. You might also like to know that there are Book Antiqua Parliamentary 2 and Book Antiqua Parliamentary 3 fonts which handle Welsh characters (circumflex and caret (to bach))and a Parliamentary Symbols font that has a star, diamond and hollow star which can appear in Papers relating to Bills.</p></blockquote>
      <p>So we can conclude that Book Antiqua is here to stay.</p>
