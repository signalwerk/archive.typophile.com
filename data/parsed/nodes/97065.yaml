      <p>I have no idea <em>why</em> Microsoft chose Arial instead of Helvetica.</p>
      <p>However, Arial does have its good points. It's less strongly oriented to display use than Helvetica - so it can also be used in place of Univers. So they got greater versatility in return for licensing only one typeface from Monotype instead of two from elsewhere.</p>
      <p>Also, they <em>needed</em> to license Times Roman, and <em>that's</em> a Monotype typeface - so maybe their reason was wanting to deal with only one vendor. You get discounts that way.</p>
