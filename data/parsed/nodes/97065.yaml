      <p>In encountering U&amp;lc magazine lately, I learned about Haas Unica being an attempted improved version of Helvetica.</p>
      <p>As a display face for signs in airports, I don't think that it's possible to improve on Helvetica Medium - in that niche, it has achieved perfection. But, shown in a text setting, it seemed to me to be better than Helvetica, and just about as good as Univers - so apparently the "improvements" <em>did</em> improve something.</p>
      <p>But I'm sure that the improvements were subtle.</p>
