    html: |-
      <p>I've always understood this history simply in terms of Monotype being Microsoft's go-to font provider at that time, so they ended up licensing Arial instead of Helvetica and, most controversially, Book Antiqua instead of Palatino. Microsoft's relationship with Monotype was very close: Monotype personnel were stationed at Microsoft's Redmond headquarters, mostly doing TT hinting.</p>
      <p>Later, MS licensed Palatino Linotype -- in part, I believe, to try to right the wrong --, but for backwards compatibility reasons decided that they couldn't ditch Book Antiqua. So Windows now ships with both font families.</p>
      <p>Segoe... well, that's a later and still controversial development, but I don't think it can be ascribed to not wanting to pay the license fee for Frutiger <em><a href="https://web.archive.org/web/20150124093638/http://en.wikipedia.org/wiki/Frutiger#Frutiger_Linotype" rel="nofollow">because MS had already licensed Frutiger from Linotype by that point</a>.</em></p>
