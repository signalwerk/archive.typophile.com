      <p>I've since learned that Arial was based on Monotype Grotesque, and its significance was that it had the same metrics as Helvetica. Back in the old days, when the HP LaserJet was the standard for laser printing, one had to buy fonts for one's laser printer as well as for one's computer, since the connection between the computer and the laser printer had enough bandwidth to send the characters you were printing to the laser printer... not the raster of the page to be printed.</p>
      <p>Of course, this also followed the precedent of impact printers (daisywheel printers and various kinds of line printers such as band printers, chain printers, and drum printers) and dot matrix printers.</p>
      <p>I see from Wikipedia, however, that Arial was indeed not commissioned by Microsoft as a display font corresponding to Helvetica. Instead, it started out as Sonoran Sans Serif on the IBM 3800 high-volume laser printer. In IBM's case, the reason the metrics were matched with those of Helvetica was that Helvetica was licensed for a higher-resolution laser printer also manufactured by IBM (600 dpi as against 240 dpi).</p>
