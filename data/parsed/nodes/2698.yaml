    html: <p>Ian, <br> <br>I've lived in NYC a very long time, and I think it is fair to say that you will not be able to sum up the city with a single typeface, or visual style. The only way to proceed in branding your Bar is to be very specific.  <br> <br>5th Avenue, Subway, Neighborhood Bodega, Art Deco, Lower East Side, West Village, Chelsea, 14th Street, etc.</p>
