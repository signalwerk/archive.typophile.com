    html: <p>Hoefler Type's <a href="http://www.typography.com/catalog/gotham/index.html">Gotham</a> is a nice example of New York typography, but instead of being source-specific, it's more of a general vernacular look, taken from skyscrapers, office buildings and other urban architecture. It's got a decent range of weights as well, along with a condensed version. There's a <a href="http://www.typography.com/catalog/gothamcondensed/features.html">helpful article</a> on its origins, as well.</p>
    html_clean: <p>Hoefler Type's <a href="http://www.typography.com/catalog/gotham/index.html" class="link-external">Gotham</a> is a nice example of New York typography, but instead of being source-specific, it's more of a general vernacular look, taken from skyscrapers, office buildings and other urban architecture. It's got a decent range of weights as well, along with a condensed version. There's a <a href="http://www.typography.com/catalog/gothamcondensed/features.html" class="link-external">helpful article</a> on its origins, as well.</p>
