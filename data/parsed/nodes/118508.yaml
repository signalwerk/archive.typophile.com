      <p>Slazer,<br>
      If your "respectable doctor" is worth his salt, he certainly will value the content of your letter above the chosen font. That is, as long as you keep your choice professional and understated. Put your effort in a well-written and concise letter, instead of spending money on a font.</p>
      <p>If he has a personal assistant, call her to verify the smartest way to get your message across. Often it is the assistant who does the reading anyway, and then shares the information if it is relevant enough.</p>
