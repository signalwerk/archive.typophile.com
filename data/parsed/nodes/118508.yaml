    html: <p>I use LaTeX for my letters; the letter class <a href="http://en.wikibooks.org/wiki/LaTeX/Letters" title="http://en.wikibooks.org/wiki/LaTeX/Letters">http://en.wikibooks.org/wiki/LaTeX/Letters</a> works fine. To get palatino, you put in the preamble <code>\usepackage{palatino}</code> or <code>\usepackage{mathpazo}</code> if you have mathematical formulas. The class also works fine with XeLaTeX, which allows you to use opentype and truetype fonts.</p>
    html_clean: <p>I use LaTeX for my letters; the letter class <a href="http://en.wikibooks.org/wiki/LaTeX/Letters" title="http://en.wikibooks.org/wiki/LaTeX/Letters">http://en.wikibooks.org/wiki/LaTeX/Letters</a> works fine. To get palatino, you put in the preamble <code>\usepackage{palatino}</code> or <code>\usepackage{mathpazo}</code> if you have mathematical formulas. The class also works fine with XeLaTeX, which allows you to use opentype and truetype fonts.</p>
