      <p>Slazer, I think you're overthinking this. I'm not a fan of Word, but in this case, Word would be fine. There's no need for LaTex when all you're composing is a single letter.</p>
      <p>Use a nice, cotton paper stock paired with a conservative serif typeface and just make it look professional. If this professor is like most professors I know, your carefully chosen type won't even be noticed, and the reply will be scribbled back to you on a Post-It note or in an email typed out in Comic Sans. ;-)</p>
