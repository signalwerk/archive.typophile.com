      <p>Hi, Tina. FontBook came off the presses just a few months before FF Milo was released, so it was unfortunately not possible to include it.</p>
      <p>I believe FF Milo Medium is intended as an emphasis for Regular. And Bold complements the Text weight. The contrast would be too low otherwise, as you've observed.</p>
      <p>This is why they are sold in these two packages:<br>
      <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_milo_1_ot/" title="http://www.fontshop.com/fonts/downloads/fontfont/ff_milo_1_ot/">http://www.fontshop.com/fonts/downloads/fontfont/ff_milo_1_ot/</a><br>
