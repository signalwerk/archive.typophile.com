  html: |-
    <p>I'm about to suggest FF Milo to one of my clients and I'm pondering which weights are reasonable for combination. I'd thought I'd find some printed material in the latest Font Book, but Milo is missing in there. Also I've printed out the pdfs available, but it's difficult to decide on the basis of a few lines of text printed with an inkjet printer. </p>
    <p>Thanks to <a href="http://typophile.com/node/31150" rel="nofollow">this thread</a> I've narrowed the choice to the text weight and now the question is which additional weight looks good for emphasizing. Italic is fine without any doubt, but concerning medium or bold, looking at the inkjet printed pdfs I'm hesitating: medium looks as if there is not enough color difference in comparison to the text weight, whereas bold seems to be too strong. </p>
    <p>What do you think? Which weight is better suited as a companion for Milo text?</p>
