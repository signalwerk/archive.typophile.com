    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Reknub_6451.jpg"></div><br>
    Reknub = Bunker but backwards... until I find a new name for it.  First typeface design while I collaborate with <a href="http://www.myfonts.com/browse/person/wundes/john/b/" rel="nofollow">Wundes Foundry</a><br>
    ... I thought a stencil would be easy... ha!<p></p>
    <p>Anyway, there are weight issues right off the bat, but besides that... am I breaking any rules?  Am I defacing a character?</p>
    <p>Daniel McGlaughlin<br>
    <a href="http://www.dmdesign.info" title="http://www.dmdesign.info">http://www.dmdesign.info</a></p>
