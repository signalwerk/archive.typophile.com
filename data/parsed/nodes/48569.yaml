      <p>Hi,<br>
      This is really interesting. I like the techno feel! :)<br>
      I love the E...and would bring in some curves into other letters (F, M?) rather than change the design.<br>
      I agree about the 6...it needs a different solution. The others that look odd to me are the 9 and the K.<br>
      The V and Z could be narrowed, the Y's left arm brought down, and yes, the horizontals need thinning a bit...like on the A, E, G, S and others...try thinning out the curves on the B and E where they meet.<br>
      I like the idea of the W but wonder if it could be made asymmetric?<br>
      Keep going! :)</p>
