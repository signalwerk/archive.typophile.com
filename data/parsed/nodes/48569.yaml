      <p>Thank you, friend.  I'll continue to refine.  Hopefully I'll be able to learn more about this craft with this community of valued communicators.  Thanks 29a!</p>
      <p>I see what you mean with the last VWXYZ charcters.  I believe I can get them integrated further into the style established by thinking further into the negative space.  Yeah, the E and the K have been stumbling block because the is so simple (the solution is too obvious), and the K is probably one of the more complex character in my humble opinion.  Look for an update as soon!</p>
      <p>daniel</p>
