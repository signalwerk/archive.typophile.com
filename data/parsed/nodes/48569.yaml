    html: |-
      <p>Hey dude!</p>
      <p>I like what you've done with it, it's a real unique take on the stencil style.</p>
      <p>The main gripe I would have with this is that some characters display a lack of consistency with the overall style of the typeface. The characters that stand out to me in this manner are the 'E', 'K' and '6'.</p>
      <p>Individually, their designs stand up well and are quite interesting (with the possible exception of the '6'), but as a member of the whole typeface I think they stick out. The 'E' because we don't really see those curves anywhere else in the typeface, the 'k' for the large arc of the tail that doesn't seem to sync up with all of the diagonals in the last five letters, and the '6' because its level of readability is not on par with the rest of the characters, and we don't see any triangular counters anywhere else.</p>
      <p>If I'm being hypercritical - one thing I notice is that the last line of letters (V, W, X, Y, Z) is quite diagonal-heavy, much more so than the rest of the characters. They seem to be a lot broader in terms of their size. How well do they work when used in words?</p>
      <p>Sorry to ramble, but I like what you've got going on here... I think it just needs a little refinement!</p>
