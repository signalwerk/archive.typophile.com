    html: "<p>Thanks gang... <br> <br>Tanya: Yeah, I wrestled with the circle-r circle-r quandry. I suppose I could keep the logo pretty big (1\"?) and make the registration mark as small as legally possible. <br> <br>Yves: I might be smoking crack on the Arial-Frutiger thing... either way, they should probably be the same typeface. I definitely want a straight tail. I don't really want to use Helvetica, but I am not terribly happy with how other faces look.  <br> <br>My all-time favorite sans is Interstate but the LC looks like poo. Maybe Champion?</p>"
