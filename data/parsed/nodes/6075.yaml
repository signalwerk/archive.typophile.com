    html: "<p>Is it just me, or does this logo look like it's set in Helvetica? And the R in the circle is more like Akzidenz Grotesk. I'm a bit confused here. <br> <br>Another way of going at it would be to center name, circle and \"R\". And by centering, I mean center mathematically along the horizontal axis and then adjust optically. <br>Then you might wanna print out both versions (Stephen's suggestion and mine) at the same size and look at them from a distance. You'll notice that in Stephen's version the circle will be higher up, but the common baseline will give it a sense of stability and sturdiness, whereas mine will have a more  horizontal dynamic. It's your personal preference which will make you go for one version or another, as I think both are valid solutions. <br> <br>P.S. When you decide to opt for Helvetica for the logo, bear in mind that half the world and their sister's logo is set in Helvetica. Ask Erik Spiekermann (<i>Rhyme &amp; Reason: A Typographic Novel</i>, pages 100-101). I've got a hunch he might be right.</p>"
