  html: "<p>So I've been working on a website for an industrial consultant, and settled on this logo: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/4279.jpg\" alt=\"rohr\"> <br> <br>Now, I realize that the \"R\" in the circle-r device is Arial Black and the logotype is in Frutiger. I have yet to resolve the issue since I don't particularly like the rounded tail on the Frutiger \"R\". <br> <br>What I'm more interested in is a critique of the basic idea itself. Are there existing logos out there that are very similar? Is it just plain a bad idea or iffy execution? <br> <br>And if you'd care to peep the site itself, you may find it at <a href=\"http://www.famished.org/rohr\" target=\"_blank\">www.famished.org/rohr</a> until the client gets his domain name. <br> <br>Thanks.</p>"
  html_clean: "<p>So I've been working on a website for an industrial consultant, and settled on this logo: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/4279.jpg\" alt=\"rohr\"> <br> <br>Now, I realize that the \"R\" in the circle-r device is Arial Black and the logotype is in Frutiger. I have yet to resolve the issue since I don't particularly like the rounded tail on the Frutiger \"R\". <br> <br>What I'm more interested in is a critique of the basic idea itself. Are there existing logos out there that are very similar? Is it just plain a bad idea or iffy execution? <br> <br>And if you'd care to peep the site itself, you may find it at <a href=\"http://www.famished.org/rohr\" target=\"_blank\" class=\"link-external\">www.famished.org/rohr</a> until the client gets his domain name. <br> <br>Thanks.</p>"
