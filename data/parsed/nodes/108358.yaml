    <p>I'm looking for examples of quality, multi-weight 3d, bevelled, inline and layered display typefaces.</p>
    <p>I'm thinking along the lines of Conqueror, History, Matryoshka, HF&amp;J's shades collections and RM&amp;Co's new one Utopia (<a href="http://rossimazzei.com/work/eventi-letterari/" title="http://rossimazzei.com/work/eventi-letterari/">http://rossimazzei.com/work/eventi-letterari/</a>)</p>
    <p>Any ideas for others?</p>
    <p>Thanks</p>
