      <p></p><div class="imageWrap"><img src="http://typophile.com/files/American Patriot layer poster font_3798.png"></div><p></p>
      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/fontry/cfb1-captain-narrow/" rel="nofollow">Captain Narrow</a></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Captain Narrow layer poster comic font_4714.png"></div><p></p>
      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/fontry/cfb1-shielded-avenger/" rel="nofollow">Shielded Avenger</a></p>
