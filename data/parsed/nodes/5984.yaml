  html: <p>Hi, <br> <br>Most people seem to make pixels versions of fonts after they've made outline version - for me <br>it's the other way ... and i need some advise .. <br> <br>I've redrawn some of my old Amiga pixels fonts from the early 90's in Bitfonter - and now i want to make the outlines (in fontlab?)so people can use them on screen. <br> <br>I have Fontlab/bitfonter/scanfont - but the outlines that FL makes no fit at all - the lines only fit the bitmap shapes loosely .. <br> <br>help is need!</p>
