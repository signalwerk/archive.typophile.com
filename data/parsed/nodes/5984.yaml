    html: <p>I fellow Amigan! <br> <br>So you want to end up with an outline font that matches your pixelfont? If you want the outline font to be blocky, it shouldn't be too hard with the right settings in FL's autotrace. But if you want a "smooth" outline font to be the result, you'll have to do it by hand. <br> <br>hhp <br></p>
