    html: <p>   I've always drawn outlines from bitmap, (or from bitmap size ranges) first with a reverse-of-hinting approach, i.e. where can/should I place that outline so that hints CAN get to that bitmap (remembering e.g. that you have 63/64ths of a pixel variation for the body width of all but e.g. the i's), and then, what does the result look like and how do I get a decent outline font out of it, and finally if you need to, reconciling whatever you can't get in the outline with either the olde mental delta, or change the damn bitmap. At least that is how I would do it if I had to "make the outlines so people can use them on screen." [presumably to look the same as the bitmaps].Hope that helps.. <br> <br></p>
