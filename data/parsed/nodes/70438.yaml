      <p>Knox and Shades are two good H&amp;FJ versions:</p>
      <p><a href="http://www.typography.com/fonts/font_overview.php?productLineID=100014" title="http://www.typography.com/fonts/font_overview.php?productLineID=100014">http://www.typography.com/fonts/font_overview.php?productLineID=100014</a><br>
      <a href="http://www.typography.com/fonts/font_overview.php?productLineID=100023" title="http://www.typography.com/fonts/font_overview.php?productLineID=100023">http://www.typography.com/fonts/font_overview.php?productLineID=100023</a></p>
      <p>Fonts are solid vector shapes, no opacity or anything, so that leads me to believe that the type for "CLEAVAGE CREW" is possibly done in Illustrator. It would be easy to do either way, so without finding the exact face there's no way of knowing.</p>
