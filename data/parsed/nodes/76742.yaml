    html: |-
      <p>WOW I emailed regarding this prior and he actually replied! Cool...</p>
      <p>Anyway this is what he said...</p>
      <p>Dear Hubert,</p>
      <p>Thank you for your kind note.</p>
      <p>This image is a random image taken from a collaborative project with artists from both Switzerland and Egypt, realised in Cairo in 2005.<br>
      It is a visual essay about the reality of the egyptian capital, a megacity of the third world, which resulted in a small but substantial photographic book with more than 400 pages, called "Do you cake?". The cryptic title refers to the equally cryptic question of a hotel maid asked at breakfast one morning in a Cairo hotel, when she was about to serve the usual tea and cake.</p>
      <p>It is a little-known project that I am quite fond of. I attach a jpg of the front cover.<br>
      The book is available on request through Pro Helvetia in Cairo, in case you would like to obtain a copy:</p>
      <p>Pro Helvetia Cairo<br>
      Swiss Arts Council<br>
      Hebba Sherif<br>
      Director<br>
      c/o Embassy of Switzerland<br>
      10, Abdel Khaleq Tharwat Street,<br>
      EG-Cairo, Egypt<br>
      Tel. +202 257 74 100,<br>
      Fax +202 257 92 267<br>
      E-mail: <a href="mailto:cairo@prohelvetia.org.eg">cairo@prohelvetia.org.eg</a></p>
      <p>Hope this answers your question!<br>
      Best regards,</p>
      <p>Cornel Windlin</p>
      <p>It not him...lol...</p>
