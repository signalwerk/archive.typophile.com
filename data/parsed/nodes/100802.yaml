  html: <p>I am looking for a script that would have been used in Germany (specifically the Hessen-Kassel region) in the last quarter of the 18th century.  As I understand it, this would have been some type of Fraktur with the long s and ligatures.  Perhaps someone here could point me in the right direction?</p>
