      <p>Luther’sche Fraktur is one of the closest digital fonts you’ll be likely to find. I think that it is based on types from the Luther Foundry in Frankfurt/Main from the 18th century. Frankfurt/Main was a free imperial city-state between Hesse-Kassel and Hesse-Darmstadt, but their types probably traveled outside of town.</p>
      <p>MyFonts has two digital versions…<br>
      <a href="http://www.myfonts.com/fonts/linotype/luthersche-fraktur/" rel="nofollow">Linotype’s</a> (the Pro font should have the long s and some ligatures in it) and <a href="http://www.myfonts.com/fonts/ef/neue-luthersche-fraktur/" rel="nofollow">Elsner + Flake’s</a>.</p>
