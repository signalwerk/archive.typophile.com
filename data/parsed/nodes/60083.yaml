      <p>In cinema the fourties are a transitional period. Still a lot of black and white movies and the ones in colour very stylized. Movies credited Technicolor consultants, who were aware of the shifts in colour that occurred because the film material was far from true…</p>
      <p>On topic: The feel of an era is just that: a feeling. As far as all of the elements in your designs evoke that feel an out-of-place colour won’t shatter the illusion, but probably enhance it.</p>
      <p> . . . .<br>
      Bert Vanderveen BNO</p>
