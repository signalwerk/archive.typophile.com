      <p>You might also want to search for archives of printed materials, fabrics, posters, etc. from the period and approximate the hexidecimal and CMYK builds from the images. Depending on the quality of the scands, you can develop a nice palette. I did the same thing for a 1950s direct mailer with great success.</p>
      <p>Martin Bentley Krebs<br>
      Designosaur since 1980</p>
