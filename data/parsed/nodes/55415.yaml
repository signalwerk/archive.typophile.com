      <p>Hello! I have this. It's metal though and since I acquired it second(or third?)-hand I have no idea what it's called. It unfortunately doesn't have any convenient identifying marks; I looked through a couple of specimen books and the closest thing I found was "Old English No. 13" in an ATF book from 1912. It's similar but not the same. </p><div class="imageWrap"><img src="http://typophile.com/files/oldenglish_3683.jpg"></div><p></p>
