      <p>Aha! One Paul Ritcher of Devil's Tail Press found it! Posting on <a href="http://www.briarpress.org/19179">Briar Press</a> he says:</p>
      <p>"Typographer John Ryder in his book ‘A Suite of Fleurons’ dubbed it a Lyonnaise Arabesque. Originating from the Lyon printing office of Guillaume Rouille in about the year 1570, it may have been cut by Rouille or Pierre Roussin, assisted by Salomon or Robert Granjon. It was recut and cast in multiple sizes as Monotype 219. Francis Meynell and Stanley Morison in their essay “Printers’ Flowers and Arabesques’ published in The Fleuron, give the lineage: Michael Jouve and Pierre Roussin, 1551-1580; Jean Pillehote, 1580-1600; Lamesle, 1742; Delacolonge, 1773; Ploos van Amstel, 1796 and Imprenta Real, 1799."</p>
      <p>So there! </p>
      <p>As for Digitization <a href="http://new.myfonts.com/fonts/glc/1550-arabesques/arabesques/characters.html">here's</a> a sort of rough interpretation.</p>
