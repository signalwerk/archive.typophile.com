      <p>There are typeface which have their ornaments (either in the font or a separate one) and other that are comprised only of ornaments, often called "fleurons".<br>
      <a href="http://new.myfonts.com/search/ornaments/fonts/" title="http://new.myfonts.com/search/ornaments/fonts/">http://new.myfonts.com/search/ornaments/fonts/</a><br>
      <a href="http://new.myfonts.com/search/fleurons/fonts/" title="http://new.myfonts.com/search/fleurons/fonts/">http://new.myfonts.com/search/fleurons/fonts/</a></p>
      <p>Maybe you can search for "frames" too<br>
      <a href="http://new.myfonts.com/search/frames/fonts/" title="http://new.myfonts.com/search/frames/fonts/">http://new.myfonts.com/search/frames/fonts/</a></p>
