      <p>Printed from a dot matrix printer, there are some similar fonts but you won't get exactly that font as it is probably specific to the output device.<br>
      Have a look here<br>
      <a href="http://www.myfonts.com/search?search%5Btext%5D=matrix" title="http://www.myfonts.com/search?search%5Btext%5D=matrix">http://www.myfonts.com/search?search%5Btext%5D=matrix</a></p>
      <p>A distressed font like this might work for you<br>
      <a href="http://www.myfonts.com/fonts/typefetish/cheapo/" title="http://www.myfonts.com/fonts/typefetish/cheapo/">http://www.myfonts.com/fonts/typefetish/cheapo/</a></p>
      <p>or this<br>
      <a href="http://www.myfonts.com/fonts/fonthead/matrix-dot/" title="http://www.myfonts.com/fonts/fonthead/matrix-dot/">http://www.myfonts.com/fonts/fonthead/matrix-dot/</a></p>
      <p>Tim</p>
