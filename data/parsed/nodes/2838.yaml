    html: <p>Hendrik, Don't try to force the lightbulb to be a GI, remember most of the end users are not designers and the idea will sail way over their heads. You might look at a typeface with Caps and Small Caps, with some contrast between the Caps and the small caps such as a tint of color or a second color. But define what is important, Is GI the most important thing or is it Generating Ideas, or is it a symbol. Focus on one direction, then explore other ideas.</p>
