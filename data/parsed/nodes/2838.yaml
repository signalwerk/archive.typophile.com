    html: "<p>Hendrik,  <br> <br>    You have a million directions you can run with this, and more than a handful are interesting. <br> <br>-There's a lower case \"g\" in your yellow/purple post.  The bulb and the part that screws in form the \"g\".  So you've got a G and a g.   <br> <br>-What about making the part that screws in, the \"g\" (lots of lowercase g's to try out)?  <br> <br>-IdeaS: the plurality of this concept seems to be lost currently.  One \"i\" seems to represent one idea.  What about lots of i's as the beams on the outside of the bulb--no \"i\" inside.  Lots of i's: lots of ideaS. <br> <br>   To make the lightbulb clich</p>"
