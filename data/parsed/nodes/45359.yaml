  html: |-
    <p>Background: I created the font pictured here as the basis for a logo by manipulating <a class="freelinking-external" href="https://web.archive.org/web/20080706110402/http://www.dafont.com/samarkan.font">Samarkan</a>, mostly by removing the horizontal line across the top. The client, an event planner, wants an exotic but not specifically ethnic feel. Mehndi-inspired decoration will appear in the logo as well — again, trying not to be too specifically Indian but using similar flourishes.</p>
    <p>Question: If you were asked to put the subtitle “custom designed events” below the company name, what secondary typefaces would you try?</p>
    <p>Thanks for any suggestions!</p>
    <p></p><div class="imageWrap"><img src="/web/20080706110402im_/http://www.typophile.com/files/heading_6622.jpg"></div><p></p>
