    date_raw: 26.Nov.2009 6.34am
    votes: null
    html: <p>I agree with you that humanist proportions--oval rather than circular--space better and work better for text. However, when there is a smaller x-height, as in Futura, it does seem to help the spacing of geometrics in text. I'm not sure why--maybe it allows looser spacing while still keeping the words together visually as a unit. I've been particularly impressed by how Vesta--oval and pretty narrow--works in text. Still, none are as good for extended text as good serifs, I think.</p>
