      <p>Hi William,</p>
      <p>Thank you for your keen insights. I prefer serifs for extended texts as well. I have seen but have not had the opportunity to use Vesta yet... it is a well designed and quite legible at smaller text size.</p>
      <p>You made a really interesting observation regarding geometric san serifs... I am wondering if you or other typophiles could expand on your thoughts about the smaller x-height geometric sans that allow looser color/spacing while keeping the words together and legible in textual settings.</p>
      <p>I am also wondering what you think are the most legible and best color/spaced humanistic san serifs. I really admire Avenir which seems to have both traces of humanistic and geometric  letter forms. When I am comparing potential humanistic san serifs are look at the fluidity of text flow in textual settings as well as how the individual letterforms flow from one letter to the other... I am curious to see which humanistic san serifs Typophiles might think are the best in color and spacing in textual settings.</p>
