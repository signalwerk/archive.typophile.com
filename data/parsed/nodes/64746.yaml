    <p>Hello,</p>
    <p>I was wondering what popular san serifs have the best color and spacing when set in body text sizes?<br>
    In your expert opinion do you believe in general that humanistic san serifs have between color, spacing, and textual reader flow than other sans serifs: geometrics, grotesks?</p>
    <p>I am not a fan of Helvetica with it’s uneven spacing and color. I have seen and admired the type samples of the commercially unavailable Haas Unica and feel it is a better design than the different commercial flavors of Helvetica.</p>
    <p>Thank you in advance.</p>
