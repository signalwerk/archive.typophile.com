    <p>Hi all,</p>
    <p>I'm working on a student project for an optically responsive typeface design to be used in Adobe Indesign CS6. A little over-ambitious for my first ever type design project admittedly but I have made good progress up until this point. I now, however, have hit a complete dead end and desperately need some advice from typographic aficionados.</p>
    <p>So far from research I understand that;<br>
    OpenType does support a 'size' tag but that this tag is not relevant to any desktop publishing software.<br>
    Adobe InDesign features a 'Automatically Use Correct Optical Size' preference, left over from the advent of Adobe MM typefaces, that never really took off as a format. But, however, will still work.</p>
    <p>Bearing this in mind I have produced two compatible master fonts along an optical axis and exported them from Fontographer as a PST1 MM format file. From this master file I am able to produce the intermediate interpolations. The issue that I am now having is that I am unsure what file format/naming conventions I am required to use in order that InDesign automatically use the correct design for each optical size. I've gone back and forth on this for weeks and really should move on to other work but I'm a bit stubborn when it comes to this kind of thing! All the documentation that I am able to find doesn't make it clear enough for me what I need to do now and not owning any MM files myself I am unsure of what state they exist in…</p>
    <p>Are all of the interpolations stored within the MM as a single file or is it simply name tags that unite the family in desktop publishing software. If anybody has an old Adobe MM file that they wouldn't mind sending to me to scrutinise that would be amazing!</p>
    <p>Many thanks,<br>
    Matt</p>
