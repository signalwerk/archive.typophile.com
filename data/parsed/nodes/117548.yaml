    html: |-
      <p>&gt; Is there any documentation support for doing this in FontLab?</p>
      <p>Quite a bit in the manual, yes. But it seems you are good now. Yay!</p>
      <p>Fontographer also has MM support, but I haven't generated an MM from that app in about 17 years, so my memory is a bit fuzzy.</p>
      <p>Broadly speaking, generating either a Mac or Windows (whichever platform you're on) Type 1 MM font from FontLab Studio should do everything you need, as long as InDesign still supports it.</p>
      <p>You are lucky on that score. Because there is no real UI for it to speak of, the InDesign team hasn't felt any strong reason to pull the support (unlike the MM slider in Illustrator, which is long gone).</p>
