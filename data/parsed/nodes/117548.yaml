      <p>@hrant<br>
      As far as I'm aware it may only be supported by Adobe Indesign (though notably it seems to be supported in almost all versions including the latest, CS6 and CC) as far as other desktop publishers go I don't know. Though I'm certain it obviously won't work in word processing. For my means I only really needed it to work in InDesign :)</p>
      <p>@Thomas<br>
      I found documentation on the FontLab manual to be immensely helpful. Fontographer on the other hand surprisingly not so much and quite misleading. I suppose being the platform for 'intermediate and beginner' type designers Fontographer just didn't provide the options that I needed to take this project forward. There seemed to be very little integrated control over the MM axis and the files MM PST1 file I exported from Fontographer wouldn't open in any other type applications (in addition to not being recognised by InDesign).</p>
      <p>As you have already stated, however, the Type1 MM files from FontLab were perfect, though I did have to use TransType to convert them to a Mac friendly version as my model of FontLab doesn't seem to export Macintosh Multiple Masters! I've tested already and the optical axis is working perfectly in InDesign.</p>
      <p>It's fortunate that the InDesign feature remains though kind of feels as though the technology is regressing in a way. It would be great to see more UI and support for Multiple Masters to allow for much more sophisticated typesetting (particularly for optical sizing) though having said that I can also see the downsides of such options being automated or presented to a less learned audience.</p>
      <p>Either way I've done what I set out to do and learnt a shit load in the process!</p>
