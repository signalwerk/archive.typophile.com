      <p>I believe the way it works is that InDesign creates the instances on-the-fly, dependent upon point size, from the loaded masters. You don't need to furnish any instances, just the Postscript MM file with the masters.</p>
      <p>Just a FYI: it is considered bad form to ask for commercial fonts here and if I am not mistaken, prohibited.</p>
