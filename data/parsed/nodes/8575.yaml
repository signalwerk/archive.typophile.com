    html: <p>This is an Alphabet Innovations font from the early '70s by Phil Martin called Fat Chance. I don't know of any digital version. <br> <br>You could probably get a similar effect by stretching Helvetica Black Condensed horizontally and rounding off the corners with a filter or something.</p>
