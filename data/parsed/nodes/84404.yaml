      <p>David: <em>...ttf is the actual default font format of the web accepted I think by all the major browsers, including the latest visions of IE...</em></p>
      <p>There isn't any single default font format of the web today, because compatibility with the large number of older versions of browsers still in use requires serving at least two different formats.</p>
      <p>IE9's raw TTF webfont support requires installable document embedding permission and is explicitly targeted at libre fonts. Personally, I wouldn't want to set the embedding bits on a font in that way just to be able to serve it to IE9 in that format, since that embedding bit can be legitimately interpreted by any piece of software as allowing the font to be installed on the recipients system, independent of the action or intention of the webfont licensee. IE9's raw TTF support really only makes sense in the context of libre font licensing.</p>
      <p>With the release of Safari 5.1 in July, current versions of all the major desktop browsers now support WOFF, as do a growing number of mobile browsers. If we eventually reach a point at which there is a single served format <em>equally</em> supported everywhere, that format is going to be WOFF, because that's the only format on which browser makers are all concentrating, the only format that is on the road to being a W3C web standard, and the only format for which there is a web-specific implementation spec and test suites.</p>
      <p>The font data content of WOFF files is likely to remain predominantly TTF for text for a long time to come, I reckon; but we've already seen an increase in the use of CFF for display web type.</p>
