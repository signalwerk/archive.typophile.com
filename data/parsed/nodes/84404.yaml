      <p>Dave,</p>
      <p>I think my reply caused misunderstandings.  Hinting along the x&nbsp;axis is <em>far</em> more complex and demanding than hinting along the y&nbsp;axis, at least for the Latin script.  I was just replying to the technical side of FreeType's autohinter, which treats both axes (almost) the same.  The results are very pleasing for the vertical direction, as ttfautohint demonstrates, but not as good for the horizontal one, which can be seen if you use, say, the ‘ftview’ FreeType demo tool to test the various autohinter modes.  And there is no hinting for diagonals at all.</p>
      <p>Please don't forget that the autohinter in FreeType has been designed to do real-time hinting.  In my opinion, David Turner has done an excellent job in designing and implementing it.  If you remove the real-time constraint, a lot of improvements should be possible.</p>
      <p>The primary goal of ttfautohint was (and still is) to bring the quality of FreeType's autohinter to the non-FreeType world.  With the suggestions and wishes you all provide, it should be able to make it more versatile.</p>
