      <p>There are a number of proprietary autohinters out there (owned by various folks) that do auto-hinting and can produce VTT code, which can then be further tweaked by hand. I think I know of three or four such beasts. I tried talking one owner of such a proprietary auto-hinter into making theirs publicly available, but they resisted due to concerns about support costs/issues. (You know who you are! :)</p>
