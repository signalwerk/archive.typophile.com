      <p>David, we're clearly eating different puddings. As I pointed out, as of July all the major desktop browsers support WOFF, all the major browser makers have been actively involved in the specification of the WOFF format. I don't see effort being expended on other formats, and IE9's raw TTF support is so heavily laden with caveats about the installability of the fonts on remote systems that I doubt if many of your colleagues will want to license for it.</p>
      <p><em>And on the side, like a slab of quivering bacon, if that's not true, then what's all the nonsense about absorbing SVG into OT?</em></p>
      <p>In general terms, it is about finding a way to add colour and animation to scalable fonts. In specific terms it is about supporting emoji characters.</p>
