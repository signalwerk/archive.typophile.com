      <p>You did indeed, David. And you were right.</p>
      <p>I was lulled into false confidence by the first signs of 120+ ppi laptops appearing in the early 2000s, which I took as a sign that the manufacturers really were going to follow through. Instead, such screens became speciality items for high-end machines -- such as my 133 ppi Toshiba and 145 ppi Dell -- and there wasn't a general increase in average display resolution for either laptops or desktop displays. In trying to understand why it didn't happen, I learned more about screen manufacturing and the problems of attrition as you increase resolution. So now I'm sceptical about the likelihood of significant increases in resolution for larger devices.</p>
