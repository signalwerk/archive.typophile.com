      <p>Dave: <em>Sure, everyone acknowledges that this is all a temporary measure until those screens are on tablet, netbooks, laptops and desktops, and this will take a few years.</em></p>
      <p>The manufacturing costs of high resolution screens increase exponentially as screens get larger, due to the high attrition rate of dead pixels and other problems. Screen resolution will likely improve for smaller tablets and netbooks but not for laptops and desktop displays. Manufacturing an iPhone 4 display with 614,400 pixels for a smart phone is a different proposition from making displays of 8,516,520 pixels for a 13" laptop.</p>
      <p>The "Devices sorted by size" chart <a href="http://en.wikipedia.org/wiki/List_of_displays_by_pixel_density" rel="nofollow">here</a> is instructive. Note that with the exception of the IBM T220/T221 'Big Bertha' displays (discontinued) all displays of 200ppi or higher are no larger than 8", with most being below 5". There is a fairly steady decrease in resolution as screen size increases.</p>
      <p>I remember back when ClearType was first announced in the late 1990s, the indication from several major laptop manufacturers was that they would be moving to a baseline 120ppi resolution within a couple of years. It didn't happen. It seems to me that 'those screens' are always 'a few years' away.</p>
      <p>It may happen, but I stopped holding my breath around 2002.</p>
