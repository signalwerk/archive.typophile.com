      <p>@dberlow (not called “Dave” :-) FreeType's autohinter has been designed about ten years ago (!) to do on-the-fly hinting.  This then limited the possible algorithms to the ones which don't need too much processor time.  It by no means implies that the derived ttfautohint processor has the same limitations.</p>
      <p>The idea of post-processing the hints is probably the future IMHO if ttfautohint is going to be integrated into font editors.  As far as I know, no font editor is able to <em>add</em> hints.  Right now, all of them <em>replace</em> hints.</p>
