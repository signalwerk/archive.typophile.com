      <p>@jh</p>
      <p><em>"Don't get me wrong: I'm glad Werner is doing this, and will likely contribute some money, because I like having tool options, and when it comes to automation differences in algorithms are as important as different capabilities."</em></p>
      <p>We are on the same page! Tool options are a good thing.<br>
      For everybody.</p>
      <p><em>"But if ttfautohint really ignores the x-direction completely, then it is of limited interest and is dependent on sub-pixel rendering environments, so doesn't help users employing XP standard font smoothing, which remains a significant demographic for the Web."</em></p>
      <p>Here's where we start to part company. X direction, shmex direction. Picky, picky, picky.<br>
      If the font coming out looks a hell of lot better than the font going in, with the only effort being the click of a mouse or a keystroke, then something really critical has been accomplished.</p>
      <p>In the early years of the twentieth century, Bell Telephone relied on female operators to handle the problem of switching. (Remember Lilly Tomlin's caricature?)<br>
      Anyway, as the phone system grew, the problem of switching started getting out of hand and the company undertook a survey and came to the conclusion that, at the current rate of expansion, in just a few years, every female in America would have to be employed as an operator to handle the volume. Faced with this, a method for automatic switching was developed and deployed only a few years later.<br>
      It's the same situation here. If we could clone Berlow or Tom Rickner to create an army of Berlows and Rickners hey, no problem.<br>
      But that's as absurd as having every woman in America employed as a telephone operator.</p>
      <p>Every tool has it's own personality. At this point I've spent hundreds of hours with FontLab auto hinting and FontForge autohinting, and I know exactly what FL will balk at and what FF will balk at and what either one will gladly accept and improve.</p>
      <p>Of course, fonts that are missing important characters or are internally inconsistent present special problems that consume more time. But that's a different issue, anyway.</p>
      <p>The auto hinting provided by the Font Squirrel Generator is also quite excellent once you get the hang of the settings and prepping the font to get the best out of it. And while the back-end stuff at Font Squirrel isn't open-sourced, it's free and that's close enough for me. Kudos to Ethan Dunham for taking the bull by the horns. And he's perfectly entitled to profit from it and keep it proprietary if that's his druthers.</p>
      <p>With ttfautohint, I welcome that someone is working on yet another tool, open-source, with input from the larger community. When I see that somebody like Greg Hitchcock is offering feedback to Werner, I get hopeful.</p>
