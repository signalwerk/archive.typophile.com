      <p>Ah yes, I see it on to the <a href="http://repo.or.cz/w/ttfautohint.git/blob/HEAD:/TODO" rel="nofollow">TODO</a> list now. Good, good.</p>
      <p>With regard to expressing the ttfautohint actions in high-level hinting command languages, may I request that you prioritise VTT in this regard? I'm sure others will disagree and favour FontLab, but my take on this is that the people who are most likely to want to manually edit the hinting are those who want to do things that FontLab can't do anyway.</p>
      <p><em>Add full OpenType Feature support – currently, all glyphs which can't be directly addressed with a character code in the ‘cmap’ table are handled with a fallback mechanism only.</em></p>
      <p>Isn't it possible to address them via glyf table index, rather than having to support OTL tables?</p>
      <p>Are there any other reasons you can think of for supporting OTL tables in an autohinter? Now you've got me wondering about auto-generating GPOS device adjustment lookups. :)</p>
