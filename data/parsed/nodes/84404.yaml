      <p>@jens</p>
      <p>Google? Why is it their problem? Is Windows GDI and TrueType <em>their</em> product?</p>
      <p>The scandal is that Microsoft has not put any resources into this. The need for a simplified auto-hinting tool such as this has been plainly obvious for years now.<br>
      But so far all they've done is leave everybody swinging slowly in the wind, doing absolutely nothing to mitigate the situation for the benefit of type designers, web designers, and the billion Windows users out there.</p>
      <p>The really crazy thing is that TTFs look better hinted in DirectWrite, too, so it's not as if the issue is being solved technically going forward.</p>
      <p>The way fonts look in GDI is perhaps THE biggest barrier to adoption of web fonts. But as far as I can tell - MSFT doesn't give a hoot about it.</p>
      <p>So be it. You might as well complain about the weather.</p>
