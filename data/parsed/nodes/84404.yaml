      <p>David: <em>the gap between y auto hinted normal fonts to average qaulity CT use, and even the simplest effective auto hinting of x with modest quality spacing, is larger than it might seem</em></p>
      <p>Yes.</p>
      <p>I think it is worth exploring a very specific target area in terms of x-direction autohinting, though: stem density in full-pixel smoothing environments, esp.XP. This is where the absence of x-direction hints is most obviously problematic, and where trying to obtain better consistency in the darkness of stems is worth some effort in terms of impact on both appearance and readability. Sure, the results are never going to be as good as manual hinting for these environments including control of spacing and other distances, but the results can be better than what Frode showed in the other thread.</p>
