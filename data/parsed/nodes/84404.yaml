      <p>From the 'How it works' section of <a href="http://www.freetype.org/ttfautohint" title="http://www.freetype.org/ttfautohint">http://www.freetype.org/ttfautohint</a> :</p>
      <blockquote><p>Intentionally, ttfautohint adds hints only along the y-axis.</p></blockquote>
      <p>So other than perhaps providing some better algorithms for automating y-direction hints, I wonder what ttfautohint does that is significantly different from what we've been able to do with a simple batch process in FontLab for well over a decade now -- and hence, Rich, perhaps why MS didn't see a need to produce an alternative? --, which we also had the ability to edit.</p>
      <p>Don't get me wrong: I'm glad Werner is doing this, and will likely contribute some money, because I like having tool options, and when it comes to automation differences in algorithms are as important as different capabilities.</p>
      <p>But if ttfautohint really ignores the x-direction completely, then it is of limited interest and is dependent on sub-pixel rendering environments, so doesn't help users employing XP standard font smoothing, which remains a significant demographic for the Web.</p>
    html_clean: |-
