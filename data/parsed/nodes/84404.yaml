    <p>ttfautohint is the new autohinter in town, which I hope will make hinting fonts faster and easier, so all type designers can make web fonts that look good on Windows :-)</p>
    <p>I made a fun little promotional video, <a href="http://youtu.be/81ioae5XNew" title="http://youtu.be/81ioae5XNew">http://youtu.be/81ioae5XNew</a></p>
    <p>There's more details on the ttfautohint homepage, <a href="http://www.freetype.org/ttfautohint" title="http://www.freetype.org/ttfautohint">http://www.freetype.org/ttfautohint</a></p>
    <p>And Werner is accepting donations to help fund the development at <a href="http://pledgie.com/campaigns/15816" title="http://pledgie.com/campaigns/15816">http://pledgie.com/campaigns/15816</a></p>
