      <p>abattis quoting me&gt; Don't put the cart before the horse :-) </p>
      <p>I have a pretty clear notion that the horse and cart arrangement is seriously in need of rethinking, from one end of web typography, (what the font?) to the other, (what the output device?). At <a href="http://t.co/EzTowt1" title="http://t.co/EzTowt1">http://t.co/EzTowt1</a>, one can read the early public emergence of the notion that it's more than fonts that need hinting. To be as clear as possible on this, people outside of my circle of fiends are starting to realize that a three column grid with two gutters and two margins has a lot in common with a lowercase "m". The sooner the developers of auto-hinting catch on to this, the sooner the idea I just spotlit will spread from fonts to where hinting needs to begin. Have at it ;)</p>
