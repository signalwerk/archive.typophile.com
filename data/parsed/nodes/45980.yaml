    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 2.Jun.2008 11.19am </div>
      <p>P22 Cigno is a new digitization of the 1950s Italian typeface by Aldo Novarese for the Nebiolo foundry. This semi-formal script has a definite mid-century European flavor suitable for menus, invitations and poster work. Along with the accurate rendition of the regular weight, designer Colin Kahn has added a lighter companion font for another variation on Cigno. Both fonts feature a full Western European character set.</p>
    <p><a href="http://www.p22.com/ihof/cigno.html" title="http://www.p22.com/ihof/cigno.html">http://www.p22.com/ihof/cigno.html</a></p>
    <p>Buy the set of 2 fonts for $29.95. No, scratch that. For the first month, we’ll offer both fonts for the price of 1- only $19.95. OK, now you have to buy them! Offer good until June 30, 2008</p>
