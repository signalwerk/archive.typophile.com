      <p>Thanks, Charles. I'm glad you took my suggestion in the spirit it was intended. Criticism from strangers on the internet can be very annoying.</p>
      <p>To expand on what Grot Esqué said, I would suggest changing each page title to something descriptive. So your homepage title might become "Charles Borges Lettering" and the page for your commercial fonts could be "Charles Borges Lettering: Fonts" etc.</p>
      <p>The page title is what shows up by default when someone bookmarks your site (as I did!) in their web browser. </p>
      <p>I believe that descriptive, relevant page titles also help your site become more visible search engines.</p>
