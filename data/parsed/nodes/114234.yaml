      <p>It would help if you gave some information on the source and date of your image. At least you should provide any information you have as to whether it is digital or before the current digital era, i.e. circa 1990.<br>
      In any event, the R is some version of French Old Style. Can't say anything about the rest of the font from which the R was taken, or even if it forms part of a font and is not an individual design for an R.<br>
      Here is French Old Style No. 2 as sold by ATF in 1900 -- and probably similar to versions sold by foundries in Europe and America for many years before then</p><div class="imageWrap"><img src="http://typophile.com/files/FrenchOSNo2pATF1900_5314_4068.jpg"></div><br>
      French Old Style is the English name for a style of font designed by Théophile Beaudoire in 1858. The upper case is derived from Louis Perrin's Lyon Capitals. The European name, sometimes also used in English, is Elzevir.<br>
      This type of leg with some rounding of the curve was found in fonts variously called Romana and Devinne.<br>
      The leg in a straighter version was fount in ATF fonts circa 1900 particularly some by Goudy.<br>
      Some digging may produce an exact match to your image, but without more information from you I have some doubts as to the prospects for quick  success.<br>
      Don<p></p>
