      <p>According to my <a class="freelinking external" href="http://bowfinprintworks.com/SerifGuide/serifsearch.php" rel="nofollow">Serif Font ID Guide</a> there are at least 1,208 serif families with an R of this general style. You can narrow that down by a great deal if you know of any other letters from this font. Or.. you can try looking through the samples from all 1,208 families to see which R resembles the specific shape of this R. </p>
      <p>Can you tell us anything about this font, or your sample? Is this a hypothetical R that you drew, or a real sample from something?</p>
      <p>- Mike Yanega</p>
