      <p><cite>If we were to proceed without lowercase glyphs, would it create a stumbling block for us if we decided to try to sell the fonts through a foundry or reseller?</cite></p>
      <p>People buy plenty of all-caps display type, and foundries sell plenty. Myfonts doesn’t seem to have any qualms.</p>
      <p><cite>Can anyone point us in the right direction of a standard character set for a display-only typeface</cite></p>
      <p>Just go for one of the <a href="http://blogs.adobe.com/typblography/2008/08/extended_latin.html" rel="nofollow">&gt;Adobe Latin character sets</a> and drop all the unnecessary math characters and ligatures.</p>
