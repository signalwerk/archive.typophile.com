    html: <p>All Caps is fine I think. You should put duplicates of the uppercase letters into the lowercase slots of the font, not leave them blank. Leaving out letters (as opposed to mathematical symbols &amp;c.) wouldn't be a good idea because people in non-English speaking countries may need display faces too :)</p>
