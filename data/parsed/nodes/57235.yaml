  html: |-
    <p>Myself and an associate are jointly designing a wide sans-serif display typeface and are looking for some information on standard character sets and advice on how we should proceed with the design.</p>
    <p>We started this project with the fashion industry in mind and designed an entire uppercase glyph set with an emphasis on elegance. We discussed the design direction for the lowercase and feel that it would detract from the typeface's overall elegance.</p>
    <p>If we were to proceed without lowercase glyphs, would it create a stumbling block for us if we decided to try to sell the fonts through a foundry or reseller? Do you think the lack of a lowercase would put the foundries and/or potential customers off from accepting or purchasing the fonts? We've also decided against small caps and other text-related character sets (tabular/lining figures, etc.) as we don't intend this typeface to ever be used to set text.</p>
    <p>Can anyone point us in the right direction of a standard character set for a display-only typeface (if one even exists)?</p>
    <p>If the answer is that we should definitely proceed with a lowercase, are there any examples of wide, sans-serif lowercase glyphs that could be considered elegant?</p>
