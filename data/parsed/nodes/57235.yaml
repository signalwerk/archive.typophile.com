      <p>&gt; <em>We’ve also decided against small caps and other text-related character sets (tabular/lining figures, etc.) as we don’t intend this typeface to ever be used to set text.</em></p>
      <p>If you want to attract a wider audience, I don't know how smart it would be to not include some of those things. Basically, if you want to <em>sell</em> the typeface, it's not really important what <em>you</em> would or wouldn't use it for, but what other people can do with it.</p>
      <p>But it's of course your choice. Caps-only typefaces aren't that uncommon.</p>
