    html: |-
      <p>Kerning all characters to tight but not touching or just touching damages the readability of the word form, I think. Because the internal white space, as well as the external shape affects the ideal kerning for even color--as David mentioned--mashing all characters together defeats the evenness of the look that normally the type designer has built into the font. That hurts readability, and, as Chris says, the resulting unevenness is somewhat unsettling. If that's the effect you want, fine, but it usually isn't.  </p>
      <p>Sans fonts, especially in bolder weights, are normally more tightly spaced, so you can more easily do the tight tracking or kerning without messing up the look, and get some more punch into the look of a word or few words. But here you have lighter weight serif fonts, so there's just too much working against you.</p>
