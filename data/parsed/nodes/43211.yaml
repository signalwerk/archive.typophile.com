    <p>Hi all,<br>
    New poster here, long-time typophile. I'm doing the finishing touches on a logo for a women's ministry. I'm using Mrs. Eaves for the italic type and Trajan for the caps. I think the itals are coming along ok (though let me know if you think they look too tight). The kerning on the caps, however, has been driving me crazy and I thought it would help to have some other eyes besides mine take a look. My main problem is the transition between the R and S. The serifs on each make for an awkward transition, so if I kern them too tight it looks funky and if I kern them too loose it throws the rest of the word off. </p>
    <p>Thoughts?</p>
    <p>Best,<br>
    Rachel</p><div class="imageWrap"><img src="http://typophile.com/files/RE-logo-final_6111.jpg"></div><p></p>
