      <p>This is very tight. Reminds me of the '70s style. Did you look at using all Mrs. Eaves? One thing is that you can see the weight shift between the cap E and other caps. I guess the Romans hadn't made it to small caps yet.</p>
      <p>I think you need to get the spacing right around the cap T and then loosen everything else up to match. You may need to bring <cite>redeeming</cite> down in size a bit to let a little more air in.</p>
  - id: 266247
    user: 2969
    date: 2008-03-16T06:56:00
    date_raw: 16 Mar 2008 — 6:56am
