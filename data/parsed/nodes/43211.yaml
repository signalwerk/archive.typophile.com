    html: |-
      <p>Tight is one way of putting it. I think what happens is the eye is drawn to a problem, the RS combination, that can't be solved (with kerning). And my eye is drawn to the double problem of 'min' too tight right above, the RS, (that is what it is).</p>
      <p>There is a large complex white space between R and S that one cannot solve with the kind of kerning you've chosen for the rest of the combinations, which may be termed, "as tight as possible regardless of combination without or with barely touching features." </p>
      <p>If, on the other hand, one thinks, "Aha, the RS that is what it is!" and kerns accordingly 'from whatever spacing that pair brings', opening up the NC, OU, UN combinations slightly, and making the EN space more like the ER....then the RS magically works without changing.</p>
      <p>Redeeming the lowercase requires a version of the same as above; the big white counters of the d, m and n define how tight, e.g. the 'min' combination can be, which would be looser than you show it, but not nearly as wide as the n's inside white space...then look again at the rest of the combinations, and loosen a little accordingly. Or change to a narrower lowercase where the d, m and n don't trap so much white.</p>
      <p>The good thing is, because birds can appear to fly in a variety of sizes and configurations, you have some flexibility in positioning them, with the resulting, more pleasingly spaced, combination of words, should you decide to do so. ;)</p>
      <p>Cheers!</p>
