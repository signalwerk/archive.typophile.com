      <p>Tom Byers</p>
      <p>Rachel:</p>
      <p>I saw no mention of the program you are using...  If you're in Quark, there is a kerning bar at the bottom of the page, with &lt; &gt;.  Set your insertion point cursor between any two leters, and it will kern only those two, not the whole line.   Hold the Option key (Windows Alt?) and it will kern in one-point increments.  </p>
      <p>More basically, it might help to pick a font in which the upper-case R has a shorter tail.</p>
      <p>Cheers,</p>
      <p>Tom</p>
