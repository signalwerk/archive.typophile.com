      <p>"Franklin Gothic, Knockout or Empire are perhaps harder to create such anxiety with..."</p>
      <p>Sans faces don't have the problem of serif entanglement that serif faces do (duh) and the shapes caused by interletter spacing don't get trapped as much. These shapes have been used numerous times to good advantage by skilled type users and even help the communication scenario. Dueling serifs, like prong-horned rams, get entangled in battle with generally head=splitting results :-)<br>
      Add the pictures of mountains and beer to this and it really gets your goat ;-)</p>
      <p>ChrisL</p>
