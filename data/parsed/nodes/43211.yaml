      <p>"I think collision-course typography creates tension and even anxiety"<br>
      In general, I agree with you. But I think 'c-c' spacing anxiety is primarily a function of style — the more handwrought the style, the more human anxiety is created by spacing stress, (and 'treatments like patterned or photographic fills, outlines, and/or shadows). Brush Script emboldened by a thick outline filled with pictures of mountains, beer and sky, tracked to disconnection, kind of anxiety.</p>
      <p>Franklin Gothic, Knockout or Empire are perhaps harder to create such anxiety with, by spacing or treatment, having their own stylistic anxiety to begin with. Seeming more machine made, we not only forgive them, we use their anxiety for 'good', emboldened by a thick outline filled with pictures of mountains, beer and sky kind of good.;)</p>
      <p>Cheers!</p>
