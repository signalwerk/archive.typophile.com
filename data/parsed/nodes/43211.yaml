      <p>I may be alone here, but the variance in weight of the heavier E catches my eye a bit. You might work with a face that has a true small cap or more weight options to mix/match. Trajan, being what it is, looks odd with the small cap treatment because of historical factors. I worked with the words a bit myself in Baskerville and when spaced out normally the word is pretty long. A wide word mark can be trouble because it will often force the size smaller to fit in a narrow space. A narrow face could help that.</p>
      <p>For a quick try, this is pretty tight to my eye, and the real small caps give a feel of even weight.</p>
