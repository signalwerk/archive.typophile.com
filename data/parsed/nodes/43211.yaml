      <p>I think Chris is right. Mrs Eaves was conceived of as as widely spaced. If you look at promotional material it is all widely spaced. Admittedly it often does need help with it's kerning - but keep in mind kerning can be both more or less space. Trajan and any all cap arrangement often benefits from wide spacing. You have now got maybe typical or even slightly tight spacing, so I would keep letting more air in until it almost seems to break apart; and then you can go back!</p>
      <p>Earlier in the thread these was some talk about the counters of a font determining it's ideal spacing. The idea is that the white space inside the O or the U should be equal to the space between two characters. It's a fuzzy idea but a powerful nevertheless. How large the letters will be reproduced and the distance to the viewer also has an impact. If they will be 6 feet high and you will be 10 ft away the letters can generally be closer* than if they will be at 6pts on a page in which case they will need even more space.</p>
      <p>* But don't have to be. See the example in stone example above.</p>
