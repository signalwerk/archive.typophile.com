    html: <p>I haven't forgotten about your suggestion, Paul. I don't think it's a bad idea, though it may need a different name, as Tiffany suggests. I may yet do it. I also have some other plans to enlarge the Coquette family, but I don't know how soon I will be able to show anything. Hopefully yet this year.</p>
