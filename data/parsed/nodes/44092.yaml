      <p>I think the example Paul linked to from "If You Could" is an entirely different thing than any of the other examples mentioned above. It is much more a grotesk being itself yet connected and has no caligraphic feel. Instead it has quite a lovely spacial relationship in figure ground--therefore it seems a whole new breed. I rather like it and hope Paul or whomsoever would pursue it.</p>
      <p>ChrisL</p>
  - id: 271833
    user_id: 7006
    user_name: paul d hunt
    user_path: null
    date_raw: 10 Apr 2008 — 11:49am
    date: 2008-04-10T11:49:00
    votes: null
    html: <p>chris is right, i'd like to do something quite literally like what If You Cold has done with the word 'make.' of course i would want to do stylistic sets that added in more cursive elements in the lower case and upper. i haven't got past the <a href="http://www.flickr.com/photos/pauldhunt/sets/72157604469560514/" rel="nofollow">investigation stage</a>, and the closest things i have to sketches would be my experiments with <a href="http://www.flickr.com/photos/pauldhunt/2102146814/" rel="nofollow">Not Gill Sans</a>. I would like to try do something similar to <a href="http://www.flickr.com/photos/pauldhunt/2346630291/in/set-72157604469560514/" rel="nofollow">Tempo's Swash Caps</a> just to round it out. Still, this is all just floating around in the ether for a few more years, most likely...</p>
