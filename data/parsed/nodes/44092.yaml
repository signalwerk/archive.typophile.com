  html: <p><a href="http://www.ifyoucould.co.uk/prints/08/apr.html" rel="nofollow">If You Could</a> beat me to the punch! I've been investigating upright and sanserif scripts for a while, but these guys have already done it. i've tried to convince Mark Simonson to do a fully connecting version of <a href="http://www.ms-studio.com/FontSales/coquette.html" rel="nofollow">Coquette</a>, but don't think i sold him. Oh well, will still give it a go someday to make a full-fledged font similar to what the If You Could guys have already done.</p>
