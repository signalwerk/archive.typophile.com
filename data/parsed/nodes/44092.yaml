      <p>I think part of the charm of Coquette is that it doesn't connect. (Not that Mark couldn't pull it off, I just think it would cease to be Coquette.)</p>
      <p>I think the first challenge is simply doing an upright italic. I think of Veronika Burian's <a href="http://www.type-together.com/ampl_font.php?idpuente=13" rel="nofollow">Bree</a> (although not technically an italic it feels like a sans-script) and Sibylle Hagman's <a href="http://www.vllg.com/Kontour/Odile/mudTyper+Weights/" rel="nofollow">Odile</a> has an upright italic.</p>
