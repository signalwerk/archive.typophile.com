      <p>It would be more accurate to say that despite OpenType being an extension of TrueType, Microsoft and Adobe agreed to allow the new standard to support PostScript outlines (as well as TrueType outlines) to aid the conversion and transition from PostScript Type 1 to OpenType.</p>
