      <p>Hi Will, </p>
      <p>For your purposes, OT has the ability to contain many more glyphs, so you could get Small Caps and Oldstyle figs with the regular weight. Also OT files can be used on Macs or PCs. If you aren't sharing files in-house this may not be useful.</p>
      <p>Be aware, many vendors are selling OT collections now, and they may simply be TT or PS fonts converted to OT, with no additional glyphs. Look carefully at the character set of OT fonts you are considering. Some vendors use the name OpenType Pro to designate fonts with extra characters. The *Pro* name usually means there are extras built in. See <a href="http://store.adobe.com/type/opentype/main.html" rel="nofollow"> Adobe's</a> or <a href="http://www.fonts.com/AboutFonts/Articles/fyti/OpenTypePro.htm" rel="nofollow">Monotype's Pro</a> OpenType pages. Adobe's talks about what OpenType is and how to use it; Monotype's talks more about the question you're asking.</p>
