    <p>Hi all,<br>
    What's the current difference between TrueType and OpenType these days?  I'm thinking of buying some fonts in the next few days and have an option between (and PostScript).  I work with fonts mostly in InDesign and do a fair amount of PDF exporting.  Is there a specific advantage for me?</p>
    <p>Best,<br>
    Will</p>
