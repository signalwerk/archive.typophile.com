    html: |-
      <p>One that was close, but not exact was <a href="http://new.myfonts.com/fonts/type-together/ronnia-basic/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Ronnia Basic Heavy</a> from Type-Together. The S and G would both need tweaking, but it could work, if a better match doesn't show up. Another was [<a href="http://new.myfonts.com/fonts/adobe/flyer/">http://new.myfonts.com/fonts/adobe/flyer/</a>|Flyer]], which would need work to close the G.</p>
      <p>I have not checked freebie fonts, but that might be another possibility. MyFonts was hard to find the combination of a similar G with an open S like this. The 'i' looks like it was flattened to be the same height, hence the flat dot.</p>
      <p> Mike Yanega</p>
