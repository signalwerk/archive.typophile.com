    html: |-
      <p>As background on the Monotype.com back to Andale switch, the Web fonts were beginning to be merged into Windows, and the program manager thought that using the Monotype.com name wasn’t appropriate, there were also concerns about referencing a font name with a ‘.’ in computer code. We did have the period and slash changed at some point, not sure if this was before, after, or coincidental with the name change.   </p>
      <p>Si</p>
      <p>edit - should have been “space and slash” not “period and slash”</p>
