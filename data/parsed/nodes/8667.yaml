    html: <p>I agree with darrel's advice. <br> <br>Using the first two letters gives you the flexibility to make the wedding mark more symbolic, personal without it needing to be completely understood by those, well, outside of the union. <br> <br>Would give you the freedom to crunch the letters up more into a sigil. A more alchemical representation and yet, modern.</p>
