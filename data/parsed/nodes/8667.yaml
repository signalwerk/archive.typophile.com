    votes: null
    html: <p>To better hide the "e," make it a capital "E." I think that will improve legibility on both ends. <br> <br>The "a" in the middle of "Kaye" could just as easily be an "e." I find that usually, the most reliable approach to a reversible two-tiered "a" is a sort of backwards "s" with serifs. <br> <br>"Hilary" reads just fine, but it might read even better if you shorten the crossbar so that it doesn't quite touch the "L." The "A" will survive this.</p>
