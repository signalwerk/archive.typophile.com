  html: '<p>The FontFont TypeBoard is a panel of designers who meet every six months in Berlin with <a href="/wiki/FSI" class="freelinking" rel="nofollow">FSI</a> leadership to review and select upcoming <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a> releases. The current members of the panel include: <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a>, <a href="/wiki/Erik%20van%20Blokland" class="freelinking" rel="nofollow">Erik van Blokland</a>, <a href="/wiki/J%C3%BCrgen%20Siebert" class="freelinking" rel="nofollow">Jürgen Siebert</a>, and <a href="/wiki/Jared%20Benson" class="freelinking" rel="nofollow">Jared Benson</a>.</p>'
