    html: <p>It’s a sad reality that reseller sites like Fonts.com do not always list complete designer credit information, and ours (FontShop.com) is no exception. We do try to add info where it’s missing, but when the foundries don’t supply it from the beginning, that’s often the root of the problem.</p>
