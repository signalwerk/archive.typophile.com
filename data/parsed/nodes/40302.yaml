      <p>Stephen is abolutely right! All resellers try to nail as much info as they can. At Linotype.com, we have the following information about Nyx:</p>
      <p>Designer: Rick Cusick<br>
      Nyx is a stencil typeface designed by lettering artist Rick Cusick and named after the designer´s muse: the Greek goddess of night. Classic roman capital forms underlie its sharp, energetic surface. Nyx first began to take shape as hand lettering on the artist´s New Year´s greeting card. It later appeared in several art exhibits of Cusick´s work before it was digitized and refined on the computer. Gallant and spartan at once, Nyx infuses music CD liners, toys, games, and magazine titles with dash and daring. (Nyx is a trademark of Adobe Systems Incorporated which may be registered in certain jurisdictions.)</p>
      <p>Sadly, I haven’t got a year for Nyx. On the Linotype.com webshop, I always tried to get in a designer name, a release year, and some sort of description (in that order of importance). There is also a designer page for most designers, but Rick’s just repeats the info for Nyx — <a href="http://www.linotype.com/353/rickcusick.html" title="http://www.linotype.com/353/rickcusick.html">http://www.linotype.com/353/rickcusick.html</a></p>
      <p>On the flip side, all of our Nyx info is at least Bi-Lingual; we have it in German on our German website, too.</p>
      <p>As for a free similar font, I don’t know of any, and honestly, it’d be a bit difficult. Rick is a great calligrapher, and well, for a similar font you’d probably need to find a free font designer whose a great calligrapher, too. But if you look at Nyx and the way it was created, maybe you could find a designer who makes free fonts who works in similar manners or from similar inspirations. But in terms of the time you’d spend searching, it might be more cost effective for your project just to license the font.</p>
