      <p>Dear Daniel,</p>
      <p>ABNT really doesn't specify which fonts you should use. You should check your department rules (which might not follow ABNT). Actually, I learned that ABNT rules even accept numbered citations (which most people in Brazil don't even know). The choice you have to make is if you want to use free/opensource fonts or commercial ones, or if you will use a real typesetting software (like InDesign or Latex) or Word. I use latex with Xetex (for fonts) and the ABNT package, which does all the dirty formatting work for me (biblio, citations, quotes, front page, etc.), and so far I've been trying Arno Pro for text and Hypatia Sans Pro for titles, with good results.</p>
