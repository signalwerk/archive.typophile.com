    html: <p>Well readability is or course important, but for academical texts it's also necessary that the typeface has certain specific characters -- at least in my opinion -- to name one example, superscript digits from 0 to 9 (and not only 123, like lots of typefaces) for footnotes. But preferably also optical sizes, so you can use a proper optical size font for footnotes at 6 to 8 points or so. Since these kind of texts potentially contain lots of numbers, like years and dates, old style figures would also be nice. But also tabular figures for things like tables.</p>
