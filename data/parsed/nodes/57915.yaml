      <p>Thank you all very much for your input. I printed test pages of around 30 fonts to compare them, and will add Andron and Skolar to the tests.</p>
      <p>But so far I'm sticking to Palatino. First of all because I prefer my text to be in serifs, both for faster reading, and also to make it look "old school". Besides, when compared with the other serif fonts I chose, it was the only one that looked slightly wider. Times New Roman printed in size 12 looks a bit thin to me: the thinner lines almost vanish.</p>
      <p>I was amazed to see how much different the line space differed from face to face. Even among fonts of the same foundry: Adobe Jenson looked way more compact than Adobe Caslon, even tho both showed the same line width.</p>
      <p>Anyway, thanks all again for the tips.</p>
