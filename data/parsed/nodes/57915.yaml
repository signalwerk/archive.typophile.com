      <p>I imagine you'll be using Microsoft Word; perhaps more important than the font choice is the proper use of paragraph formatting, leading, etc. If you want your paper to stand out, don't use Microsoft's default settings, which are typographically atrocious. Don't double-space after punctuation (if that's how you learned to type, use find/change to change double spaces to single spaces), don't type multiple spaces for indents, etc. Learn to use the paragraph formats pane, and make adjustments as necessary.</p>
      <p>You should read "The Complete Manual of Typography" by Jim Felici, and visit:</p>
      <p><a href="http://www.designingwithtype.com/" title="http://www.designingwithtype.com/">http://www.designingwithtype.com/</a> </p>
      <p>Good luck!</p>
