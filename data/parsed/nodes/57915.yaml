      <p>How about <a class="freelinking external" href="http://www.fontbureau.com/fonts/Whitman" rel="nofollow">Whitman</a>?</p>
      <p>And don't forget the free and multilingual <a class="freelinking external" href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium" rel="nofollow">Gentium</a>.</p>
      <p>Also, being a recovering academic myself, I once thought Word was the tool to write text with, but actually it's not. </p>
      <p>If you are working on anything bigger than a business letter, you should be using a tool that helps you capture, organize, search, and compare the snippets of your own research. You shouldn't have to force your thoughts into a single bottomless page that Word offers (much like an ancient scroll).</p>
      <p>I've started using <a class="freelinking external" href="http://www.devon-technologies.com/download/index.html" rel="nofollow">DevonThink</a>. Download it and try it out. It saves all your writing in Rich Text Format (RTF). You can then export all your notes into whatever other software you like to typeset the whole thing properly.</p>
      <p>But most important of all, it helps you manage your information in a way that makes sense for the 21st century. Rather than trying to explain it all myself, I would ask you to read how author Steven Johnson uses it <a class="freelinking external" href="http://www.nytimes.com/2005/01/30/books/review/30JOHNSON.html?_r=1&amp;oref=login" rel="nofollow">to write his books</a>.</p>
      <p>Rahim</p>
