      <p>@quincunx: oh, I dunno. If one knows what one's doing, it's possible to get perfectly decent results out of Word. About the only thing I've been unable to get it to do that I really would like is margin-hanging punctuation. </p>
      <p>Beyond the settings Cameron mentions above, the other one that vastly improves things (apart from "always work with invisibles showing") is that if you're doing fully-justified, to seek out and switch on the compatibility option for doing fully-justified text like WordPerfect (!). The end result still looks a bit naff on screen (appearing to squoosh the text at the right-hand end of the line) but prints out sensibly.</p>
