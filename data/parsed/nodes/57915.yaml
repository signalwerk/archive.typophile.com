    <p>I'm working on my PhD thesis and it struck me that I have been using Times New Roman for years without ever questioning the almighty manuals that most brazilian academics follow. Most ABNT (the brazilian ISO or DIN) manuals say that fonts must be either Arial or Times New Roman, but I'm willing to break this rule.</p>
    <p>After considering using a typewriter or a DOS font, I began more serious research on what substitutes could I use to make my text look exciting and smart.</p>
    <p>I started to research the subject and discovered that Yale solved the problem in a very simple way: they designed their own typeface:</p>
    <p><a href="http://www.yale.edu/universityprinter/typeface/" title="http://www.yale.edu/universityprinter/typeface/">http://www.yale.edu/universityprinter/typeface/</a></p>
    <p>I'd like to ask you all for more sugestions on what typefaces could be used for a PhD thesis, and if you know the rules used my other universities. Maybe even what faces were used in certain famous works, etc.</p>
    <p>Thanks,</p>
    <p>Dan</p>
