      <p>It is a mistake to think there is an "academic look." Different typefaces work well with different subjects. Even in your field, (Cinema?), I would choose different fonts depending on the subject. For example, if your thesis is "Romantic Comedies starring Doris Day," it would likely get a different font than "Film Noir, 1955-60."</p>
      <p>As to Times Roman, It too has appropriate and inappropriate uses, though today, it seems few think it has any appropriate uses.</p>
      <p>I think it is decried for two reasons. The first is it is used a lot, and boredom sets in "The Designer's Bored and the Reader Pays" might make a good dissertation topic. The second and more important reason is the font hasn't moved gracefully from metal to photocomp and digital. Probably because everybody who's capable is bored with it.</p>
