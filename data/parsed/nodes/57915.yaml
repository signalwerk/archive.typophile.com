      <p>I've started using <a class="freelinking external link-external" href="http://www.devon-technologies.com/download/index.html" rel="nofollow">DevonThink</a>. Download it and try it out. It saves all your writing in Rich Text Format (RTF). You can then export all your notes into whatever other software you like to typeset the whole thing properly.</p>
      <p>But most important of all, it helps you manage your information in a way that makes sense for the 21st century. Rather than trying to explain it all myself, I would ask you to read how author Steven Johnson uses it <a class="freelinking external link-external" href="http://www.nytimes.com/2005/01/30/books/review/30JOHNSON.html?_r=1&amp;oref=login" rel="nofollow">to write his books</a>.</p>
      <p>Rahim</p>
