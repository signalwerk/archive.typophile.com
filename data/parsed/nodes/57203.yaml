      <p>Currently they have two logos for one brand and I think one logo for the all "Pumpkin" brand suits better. About what Will said, I'm aware of that but their skateboards are slalom and downhill skateboards, often used on mountains and hills. I tried to put skate and snow in one logo (#2).</p>
