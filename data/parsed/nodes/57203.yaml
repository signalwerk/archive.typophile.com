      <p>Hey Kirsten, thanks for your comment, it's always good to get different opinion.</p>
      <p>I understand what you mean with the skate/snow manufacturer, and I'm aware of that. But as I said above, those skateboards are often used for speed and downhill. Those guys wear leather and helmet riding down mountains at incredible speed... That's why I think the mountain symbol isn't far from that kind of skateboarding. </p>
      <p>I'm still thinking about that option because as you said I don't want to ignore half of the clientele. And it's true not everybody rides skateboards in mountains.</p>
      <p>I'm still in the early process of the logo so I'm trying things, that's why I came up with that PK. Maybe I could try to use the whole Pumpkin word and the mountain symbol without the PK. I know PK is not the abbreviation of Pumpkin, it's just an option to make a symbol out of the brand. </p>
      <p>@epsilicon<br>
      Do you mean I should make the P and the N look like skateboard or snowboard edges?</p>
