    html: |-
      <p>^spam?</p>
      <p>I don't think there will be a lot of people on this board that can actually consider themselves in your target audience, however, I can.</p>
      <p>It might be worth looking at other brands that are established in the (longboard) downhill community; Landyachtz, Rayne and Sector9 spring to mind.</p>
      <p>But in this downhill community you can distinguish two different groups; those who do it for the fun of it, and those that do it professionally. I think the logo you currently have is better suited for the first group, the second one is a bit more 'high tech', think 'nano-tube carbon-fiber'.</p>
      <p>If you need the opinion of more people in the 'scene' try the forums of Silverfish Longboarding (the largest online community on longboarding).</p>
      <p>Just a heads up; Pumpkin is already a name in use for a type of bushings made by Bear (subdivision of Landyachtz).</p>
