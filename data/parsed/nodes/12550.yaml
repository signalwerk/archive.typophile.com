      <p>Even worse: The DVD cover art for <em>American Splendor</em> (another movie that was based on comics) features not only a stretched-out Comic Sans MS, but CC JimLee, CC JoeMad, and at least two forms of Graphite as well. And that’s just the “comic book” fonts.</p>
