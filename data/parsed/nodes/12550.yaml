    <p>Okay, overdramatic, I know but still …</p>
    <p>The DVD Packaging of Sin City (8/16/05) features none other than a slanted Comic Sans! You’d think that with Frank Miller directing it and with its dark themes they could have at least used a real comic font. </p>
