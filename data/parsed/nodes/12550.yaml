    votes: null
    html: <p>I think they were probably trying to mimic the profusion of lettering styles found on the average comic book page. I’ve been doing some production work for a comic company recently, and really good contemporary digital letterers use a pretty dizzying array of typefaces, and then modify them heavily as needed (especially for sound effects). It’s a totally different world than traditional typography or sign lettering. The problem with the American Splendor covers is that they get caught halfway between typography and comic lettering, and the results are pretty ungainly. They get a B for effort, though!</p>
