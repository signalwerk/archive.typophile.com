      <p>I don’t mind <a href="wiki/Comic Sans" class="wiki">Comic Sans</a> so much, but I still cannot stand the new UPS logo, or their use of FF Dax on their trucks. I kinda think a shipping service makes more sense being all conservative and frumpy. Conservative and frumpy means they’re getting me my latest Amazon or Powell’s fix on time, and I don’t know what the hell their new identity is supposed to mean.</p>
      <p>Comic Sans has no real relationship to “real” comic lettering, which is almost never as childlike and irregular as Comic Sans. I really don’t think it’s a terrible typeface (read the Typowiki entry, which I wrote), but it is misnamed.</p>
