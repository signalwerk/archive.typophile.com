      &gt;   (numbered pages, numbered footnotes, figure and<br>
      &gt;   table references, indexes) that were ingenious workarounds<br>
      &gt;   to the space limitations of the paper page, but don’t belong<br>
      &gt;   in a hyperlinked medium.</p>
      <p>more on this below, but what's telling here is your<br>
      perceptive observation; p-books are "littered" with<br>
      "ingenious workarounds" for navigation and search.</p>
      <p>that's telling because it informs us that navigation<br>
      and search are _important_aspects_ with any book.</p>
      <p>indeed, i've called _navigation_ the most important<br>
      aspect of a book.  might be a stretch.  or might not.</p>
      <p>&gt;   What pbook design conventions should we<br>
      &gt;   preserve or adapt for ebooks?</p>
      <p>that's a good question.          :+)</p>
      <p>&gt;   Readable fonts, for sure, but what’s considered readable<br>
      &gt;   is a moving target. </p>
      <p>i dodge that "moving target" with one very simple tactic;<br>
      i let the end-readers decide which font they want to use.<br>
      that makes them happy, and that makes me happy too...</p>
      <p>&gt;   Given time, ebooks will evolve their own optimal letterforms,<br>
      &gt;   and readers may even set preferences for the font, size, and<br>
      &gt;   leading they prefer.</p>
      <p>that time is now.         :+)</p>
      <p>&gt;   One thing that seems fairly constant is line length,<br>
      &gt;   not measured in inches (or centimeters or picas),<br>
      &gt;   but in characters. The comfort zone seems to fall<br>
      &gt;   somewhere between 50 and 75 characters per line. </p>
      <p>right.  that's the result found by most of the experiments.<br>
      (although it's interesting that 75 is 150% of 50, meaning<br>
      there's a pretty big range regarding this "comfort zone".)</p>
      <p>the 3 lines in the above paragraph are almost 60 characters.<br>
      i break almost all of my lines in that 50-75-character range.<br>
      and -- at least on some boards -- that pisses people off...<br>
      you wouldn't believe how angry they get about it.  or maybe<br>
      you would, since some of you are that mad about my casing.<br>
      (imagine if you were that mad about _both_ of those things!)</p>
      <p>at any rate, this is another of the variables i let readers decide.</p>
      <p>and sometimes, it depends on the specifics of the situation...</p>
      <p>if you're reading on an iphone, for example, or even a kindle,<br>
      that odds are that if the text is at a size you find comfortable,<br>
      the line-length might be at the short end of the comfort zone.</p>
      <p>for instance, we could consider a p.r. picture from amazon,<br>
      showing a screenful of text as it gets displayed on the kindle.</p>
      <p>here's that text, with each line's character-count to its right:<br>
      &gt;   he was slow in learning how to talk.  "my /41<br>
      &gt;   parents were so worried," he later recalled, "that /50<br>
      &gt;   they consulted a doctor,"  even after he had begun /50<br>
      &gt;   using words, sometime after the age of 2, he /44<br>
      &gt;   developed a quirk that prompted the family maid /47<br>
      &gt;   to dub him "der depperte," the dopey one, and /45<br>
      &gt;   others in his family to label him as "almost /44<br>
      &gt;   backwards."  whenever he had something to say, /46<br>
      &gt;   he would try it out on himself, whispering it softly /52<br>
      &gt;   until it sounded good enough to pronounce aloud. /48<br>
      &gt;   "every sentence he uttered," his worshipful /43<br>
      &gt;   younger sister recalled, "no matter how routine, /48<br>
      &gt;   he repeated to himself softly, moving his lips."  it /52<br>
      &gt;   was all very worrying, she said.  "he had such /46<br>
      &gt;   difficulty with language that those around him /46<br>
      &gt;   feared he would never learn."1 n/a</p>
      <p>and here's a screenful of text as shown on the sony reader:<br>
      &gt;   boredom. thursday afternoons were usually a big /47<br>
      &gt;   peach day, with women getting ready for sunday /46<br>
      &gt;   cobblers, but not a soul stopped. n/a<br>
      &gt;   t. ray refused to let me bring books out here and /49<br>
      &gt;   read, and if i smuggled one out, say, lost horizon, /51<br>
      &gt;   stuck under my shirt, somebody, like mrs. watson /49<br>
      &gt;   from the next farm, would see him at church and say /51<br>
      &gt;   "saw your girl in the peach stand reading up a storm. /53<br>
      &gt;   you must be proud."  and he would half kill me. n/a</p>
      <p>so we're at (or below) the low end of the 50-70 "comfort zone".</p>
      <p>as you can imagine, the counts go down more with the iphone,<br>
      and down even farther on the phones with even smaller screens.</p>
      <p>but newspapers have small columns too, so it's not a problem...</p>
      <p>we have the opposite problem with the big monitors nowadays.<br>
      they are now far too wide to present a comfortable line-length.</p>
      <p>(which is why blogs, and sites like this one, now use columns,<br>
      such that the _real_ content uses up about 1/3 of the screen,<br>
      with the rest splattered with nonsense and ads and more b.s.)</p>
      <p>but that "problem" now presents us with a great opportunity...</p>
      <p>our monitors are wide enough to do a _facing-pages_display_.</p>
      <p>a 2-page view returns us to the familiar mode of the p-book...<br>
      with each page being shown big enough for pleasant reading.</p>
      <p>moreover, this 2-page view is useful with an e-book because<br>
      it allows _one_ of the pages to "drop away" in those situations<br>
      where we need some screen-space for some other purpose...</p>
      <p>for instance, let's say the user wants to see the contents page.<br>
      you "drop away" one of the pages, so as to show the contents.<br>
      this allows the person to "remain in contact" with the body text<br>
      -- via the page which has not "dropped away" -- yet still have<br>
      room for the other purpose.  having this room as "workspace"<br>
      comes in handy in all kinds of situations -- where the person<br>
      wants to view a larger version of a picture, or cycle through all<br>
      the book's pictures, or when they want to make an annotation,<br>
      or if they want to view pages from different parts of the book,<br>
      or any number of other situations that arise in the experience...</p>
      <p>&gt;   Since ebook publishers have no minimum or maximum number<br>
      &gt;   of pages to worry about, they should optimize line length and<br>
      &gt;   let the number of lines be whatever it needs to be.</p>
      <p>if we were going to "switch over" entirely from paper to screens,<br>
      and all the paper-books were to disappear overnight, and we<br>
      would never ever print out a book again for the rest of our lives,<br>
      then we could throw out all of our past rules and _start_over_...</p>
      <p>but that's not our situation.</p>
      <p>we need to have a more-gradual transformation...</p>
      <p>so we need to do some more thinking...  more on that later...</p>
      <p>-bowerbird</p>
