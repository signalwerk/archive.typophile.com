      <p>thomas said:<br>
      &gt;   yes, hyphenation of ragged-right text is a legitimate choice.</p>
      <p>for much of the infrastructure now in place, especially<br>
      hand-helds like the iphone, e-book programs simply<br>
      don't have enough firepower to do hyphenation well.</p>
      <p>so i advocate turning off hyphenation entirely...</p>
      <p>people are used to the absence of hyphenation,<br>
      since most of the web hasn't been using it at all.</p>
      <p>plus, in the "toc" ("tools of change") .pdf that i was<br>
      analyzing, the hyphenation was quite atrocious, so<br>
      my advice to turn it off was extremely well-founded.</p>
      <p>&gt;   So is multi-line composition/line-breaking of ragged right text </p>
      <p>i absolutely agree that a multi-line method must be used.</p>
      <p>and you can achieve a very nice even rag if you do multi-line...<br>
      (at least in english, with bad-line exceptions being fairly rare.)</p>
      <p>&gt;   a more even rag is considered desirable by many typographers.</p>
      <p>i agree that it is very important,</p>
      <p>and i restate that a multi-line method can give it to you...</p>
      <p>(and even if it couldn't, we still don't have the firepower<br>
      in our hand-held machines to do hyphenation correctly.<br>
      so we're stuck here.)</p>
      <p>&gt;   the choice between sans and serif is not any<br>
      &gt;   more important than the specific choice of fonts: </p>
      <p>certainly.  i was merely relating the common advice, which is<br>
      to use a serif font for body-text, and sans-serif for headers.</p>
      <p>yet -- like you -- i prefer sans-serif myself.  (and i said so.)</p>
      <p>but again, with e-books (and print-on-demand for p-books),<br>
      all these either/or choices need to be decided by the _reader_,<br>
      not by the _creator_ of the book.</p>
      <p>(and it is because of its fixed nature, which does not permit<br>
      a reader to control these variables, that i hate .pdf so much.)</p>
      <p>&gt;   I prefer sans for most current ebook settings, but<br>
      &gt;   I’d sooner be eviscerated with a spoon than<br>
      &gt;   read a 300-page ebook set in Arial or Helvetica.</p>
      <p>and thus the importance of letting the reader decide...        :+)</p>
      <p>(but you were exaggerating a little bit.  weren't you?)          ;+)</p>
      <p>&gt;   “mixed” mode (cross between “indent” and “block” mode<br>
      &gt;   for paragraph separation) is something that would<br>
      &gt;   make most typographers barf.</p>
      <p>well, after you've seen how it looks, you'll probably change<br>
      "most typographers barf" to "almost all typographers barf".</p>
      <p>but it paves the way to consider a reasonable "compromise",<br>
      which is to indent the paragraphs _and_ leave "space above"<br>
      each paragraph, just as most book-typographers do, right?</p>
      <p>and you can probably guess where i'll go with that, which is<br>
      to let the reader decide how much "space above" will be used.</p>
      <p>&gt;   have you consulted a lawyer about the repercussions<br>
      &gt;  of moving the copyright notice to the end?<br>
      &gt;   I’ll bet you lunch at a nice restaurant that<br>
      &gt;   most copyright lawyers would say it’s a bad idea<br>
      &gt;   because you want to warn people up front of the copyright.</p>
      <p>i try to "consult a lawyer" as little as possible.</p>
      <p>and most _especially_ the copyright lawyers...</p>
      <p>plus i'd be wary of any advice that anything is "a bad idea"<br>
      due to a need to "warn people up front of the copyright",<br>
      because "copyright warnings" are now a laughing-stock...</p>
      <p>at any rate, here's what the government has to say:<br>
      &gt;   <a href="http://www.copyright.gov/circs/circ03.html#intro" title="http://www.copyright.gov/circs/circ03.html#intro">http://www.copyright.gov/circs/circ03.html#intro</a></p>
      <p>under "position of notice" it says:<br>
      &gt;   The following locations and methods of affixation<br>
      &gt;   are examples of appropriate position of notice.<br>
      &gt;   These examples are not exhaustive.</p>
      <p>it gives these examples, under "works published in book form":<br>
      &gt;   Title page<br>
      &gt;   Page immediately following the title page<br>
      &gt;   Either side of the front or back cover<br>
      &gt;   First or last page of the main body of the work</p>
      <p>so it looks like the last page would be fine.</p>
      <p>or, if an e-book falls in the class of "works reproduced<br>
      in machine-readable copies", the first example there is:<br>
      &gt;   With or near the title or at the end of the work</p>
      <p>so again, it looks like the last page is fine.</p>
