      <p>I have a few random comments:</p>
      <p>- yes, hyphenation of ragged-right text is a legitimate choice. So is multi-line composition/line-breaking of ragged right text (which InDesign does, btw). Having a more even rag is considered desirable by many typographers.</p>
      <p>- the choice between sans and serif is not any more important than the specific choice of fonts: even if you prefer one or the other, there are lousy and better choices in either camp. I prefer sans for most current ebook settings, but I'd sooner be eviscerated with a spoon than read a 300-page ebook set in Arial or Helvetica.</p>
      <p>- "mixed" mode (cross between "indent" and "block" mode for paragraph separation) is something that would make most typographers barf.</p>
      <p>- have you consulted a lawyer about the repercussions of moving the copyright notice to the end? I'll bet you lunch at a nice restaurant that most copyright lawyers would say it's a bad idea because you want to warn people up front of the copyright.</p>
      <p>- On a side note, I was amused to see Sean Stewart's name crop up here. He was best man at my wedding.  :)  Last night I was playing with the stuff he did for the new "Watchmen" film.</p>
      <p>Cheers,</p>
      <p>T</p>
