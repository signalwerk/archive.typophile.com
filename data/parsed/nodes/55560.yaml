    <p>greetings...          :+)</p>
    <p>so glad i found this place!</p>
    <p>been looking for experts<br>
    in typography so i could<br>
    bounce ideas off of them,<br>
    and get feedback on stuff.</p>
    <p>and this looks like that place.      ;+)</p>
    <p>i write e-book programs --<br>
    authoring-tools and viewers.</p>
    <p>my aim is to incorporate the<br>
    best of p-book typography...<br>
    so i've tried to learn about it.</p>
    <p>i respect the centuries of craft.</p>
    <p>i want to carry a lot of it forward.</p>
    <p>i'm also willing to leave things<br>
    behind, as no longer needed,<br>
    but i want to know i'm doing it,<br>
    and doing it for good reasons...</p>
    <p>i do believe you can break the rules<br>
    creatively even without knowing 'em;<br>
    if it works, it works, regardless if you<br>
    knew why it "shouldn't" work or not...</p>
    <p>but i love p-book typography, so i've<br>
    been quite willing to learn the rules...</p>
    <p>after all, it's only natural to be<br>
    curious about what you love...</p>
    <p>***</p>
    <p>i'm about to release some stuff that<br>
    i would love to have you look at, and<br>
    give me feedback on.  in the meantime,<br>
    i've been spouting off in a few threads<br>
    about "what book typographers think",<br>
    and it'd be great if you let me know of<br>
    any specifics that i've gotten _wrong_...</p>
    <p>one thread is over at the "if:book" blog<br>
    -- future of the book --  on a blog entry<br>
    asking "why is text on screens so ugly?"<br>
    i made a couple of long comments there.</p>
    <p>the second thread is on the "toc" blog<br>
    -- "tools of change" at the site of o'reilly,<br>
    the computer-book publishers -- where<br>
    i discuss a free book they just released to<br>
    demonstrate print-on-demand at a show.<br>
    i tell them all the things they did _wrong_,<br>
    from the perspective of a book-designer,<br>
    so i'd appreciate if you told me what _i_<br>
    got wrong.  you can do it there, or here...</p>
    <p>i'll put specific url's in a follow-up post,<br>
    just in case they would hold up this one.</p>
    <p>and when i release stuff into the wild,<br>
    i'll let you know so you can kick my ass<br>
    with some of your excellent feedback...         :+)</p>
    <p>-bowerbird</p>
