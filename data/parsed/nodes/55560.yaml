      <p>Like ebook design, pbook design is a compromise between the convenience of the reader and the limitations of the production process.<br>
      The single biggest factor determining the production cost of pbooks is length: more words equals more pages, and more pages equals more paper, more press time, and more shipping weight. Justified columns are designed to fit the maximum number of words on a page, which in turn keeps the page count to a minimum. There's no justification for justification in ebooks, because there's no paper, press time, or shipping.<br>
      Paragraphs beginning with an indented first line are another device to minimize length and save paper. Flush-left paragraphs with an extra line or half-line above make sense for ebooks.<br>
      Aggregating metadata into frontmatter (the pages with Roman-numbered folios at the front of a pbook) is likewise an artifact of the space limitations of paper. Put the copyright notice on a splash screen, like other software products, or link it to menu bar or toolbar.<br>
      The table of contents in a pbook is the ancestor of the home-page menu. Its column of page numbers is a navigation tool that pbooks required, but on ebooks it's as anachronistic as a foghorn on a space ship. Pbooks are littered with navigation and search tools (numbered pages, numbered footnotes, figure and table references, indexes) that were ingenious workarounds to the space limitations of the paper page, but don't belong in a hyperlinked medium.<br>
      What pbook design conventions <em>should</em> we preserve or adapt for ebooks? Readable fonts, for sure, but what's considered readable is a moving target. Gutenberg cut blackletter type for his Bible because that's what 15th Century readers were comfortable with. When John Baskerville introduced his eponymous type in the 1750s, critics wailed that it would cause blindness in readers accustomed to Caslon. Given time, ebooks will evolve their own optimal letterforms, and readers may even set preferences for the font, size, and leading they prefer.<br>
      One thing that seems fairly constant is line length, not measured in inches (or centimeters or picas), but in characters. The comfort zone seems to fall somewhere between 50 and 75 characters per line. Since ebook publishers have no minimum or maximum number of pages to worry about, they should optimize line length and let the number of lines be whatever it needs to be.</p>
