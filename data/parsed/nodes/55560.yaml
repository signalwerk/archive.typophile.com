      <p>I personally encourage e-book development quite fervently. And yes, many rules need to be seen for what they are: dumb legacies. One way an e-book should improve over the hardcopy legacy is that instead of presenting text on recto and verso pages that are flipped in pairs, the text columns should be presented in a continuous horizontal sequence (breaking only where it makes content sense).</p>
      <p>My strongest bit of advice however is this: you will only serve your own ego, and never any reader, by classing your artistic expression above humble functionality, clear communication. Design is about servitude, not expression; being made by a human for other humans, personal expression will surely come out, but it must be allowed to do so only <em>in spite</em> of you.</p>
      <p>hhp</p>
