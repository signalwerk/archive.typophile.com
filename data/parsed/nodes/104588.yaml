      <p>An alternative is to find the <em>original</em> not a carbon copy of a US Army report of the era typed on a fairly new well maintained typewriter. By well maintained I mean a neatness obsessed clerk took the effort to clean the typefaces with a brush so that they shined. No way to tell except by looking at results. Prospects of finding a good specimen range from good to impossible. Might even be something with excellent scan resolution at archive.org.<br>
      But this is more typical of what I found so far:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/1945-07-07excerpt_4879.jpg"></div><br>
      Given your review of the significance of this particular machine, it would certainly be a worthwhile project to do a clean font based on it.<br>
      Don<p></p>
