      <p>The other option is that the sample was typed on a vintage Underwood Champion Typewriter and if you want to duplicate that font you need to buy one on e-bay or as below. </p>
      <p>Another source for the Vic Fieger font is <a href="http://www.fontsquirrel.com/fonts/Underwood-Champion" title="http://www.fontsquirrel.com/fonts/Underwood-Champion">http://www.fontsquirrel.com/fonts/Underwood-Champion</a></p>
      <p>Underwood Champion Portable of 1938<br>
      Your Price: $625.00<br>
      For a machine of this size, the Champion certainly had a lot of punch! These were introduced in the late 1930s among a full line Underwood's portables, but Champion was the top of the Underwood Typemaster portable line. The numerous Underwood Typemaster features, that once only available in an office-sized machine features, were standard here, including the Champion keyboard, sealed-action frame, dual-touch tuning and an inbuilt tabulator. In the 1940s, Champions were chosen by the U.S. Army for their ease of use, excellent durability and proven reliability in all sorts of conditions. The early version came in three glossy colors: black, maroon and green. Charcoal gray crackle paint and improved plastic key tops was common in later versions. (A carrying case with typing stand was also offered at the time as an optional accessory for both Universal and Champion models.)</p>
      <p><a href="http://mytypewriter.com/underwoodchampionportableof1938.aspx" title="http://mytypewriter.com/underwoodchampionportableof1938.aspx">http://mytypewriter.com/underwoodchampionportableof1938.aspx</a></p>
