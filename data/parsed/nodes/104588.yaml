    html: "<p>Since P22 says: \"This font is primarily based on the typewriter used for a typographic conference document from 1966 in Mainz Germany. The model and age of the typewriter used is not known.\", we can assume that Underwood Champion models had a long period of use. Lurker's sample has the number 1993 in the first line, \"moved to Site 19 1993\", and if that is a date it would be really close to the end of the typewriter period, and even then mostly the IBM Selectric was what had persisted. I was working in museums then and we kept a manual typewriter around to fill out shipping forms - I do not think it was a Underwood Champion.</p>"
