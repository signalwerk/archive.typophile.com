      <p>I learned to type on a Royal portable in high school. A great cost saver when I went to university and saved the expense of 25¢ a page for essays &amp; term papers. Later, in the era when professionals had secretaries who churned out dictated stuff on IBM Selectrics, I managed to get my hands on a big old Underwood or Remington and typed out private notes. If you are careful not to make mistakes, keep the typefaces from getting clogged, change the ribbon regularly, and the machine has not been abused, the output looks pretty good. It does <em>not</em> jump all over the place like the ersatz typewriter fonts. So, I tend to agree that in view of the reference to 1993, Lurker's sample could indeed have been a typed sheet and not a digital font.<br>
      Don</p>
