      <p>Good find, Bob.<br>
      The font <a href="http://www.myfont.de/fonts/infos/6416-Underwood-Champion.html" rel="nofollow">Underwood Champion</a> also has the letters that match the sample.<br>
      I believe that we can infer that the clean font in the sample was also based on an Underwood Champion typewriter or another typewriter using the same key faces or element.<br>
      The font "Underwood Champion" was created by Vic Fieger in 2008 and is being distributed through a German website. So <em>possibly</em> the clean typewriter style in the sample was created by a German designer not selling through MyFonts. But then again, it is <em>also</em> being distributed through various non-German sites.<br>
      Don</p>
