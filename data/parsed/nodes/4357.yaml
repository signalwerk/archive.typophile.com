    html: <p>I'm pretty sure this logo pre-dates digital type, but for "HARLEY-DAVIDSON", one of the weights of <a href="http://www.myfonts.com/fonts/redrooster/block-gothic-rr/">Red Rooster Block Gothic</a>, optically compressed a little bit, would come very close. <br> <br>I bet dollars to donuts that "MOTOR CYCLES" is hand-drawn/custom. <br> <br>If you just need the logo in eps format, try <a href="http://web.brandsoftheworld.com/?id=112&amp;query_id=4131853&amp;page=1&amp;brand_id=1785">here</a>. .</p>
