    <p>Supporting more glyphs than <a href="/node/12240" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontLab</a> alone. AsiaFont Studio was an extended version of Fontlab for creation of double-byte characters such as Han (Chinese)&nbsp;characters.</p>
    <p>The functionality of AsiaFont Studio was incorporated into Fontlab Studio 5, and is no longer available as a separate software&nbsp;application.</p>
    <p><a href="http://www.fontlab.com/Font-tools/AsiaFont-Studio/">http://www.fontlab.com/Font-tools/AsiaFont-Studio/</a></p>
