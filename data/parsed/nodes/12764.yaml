    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: <a href="/wiki/Tools" class="freelinking" rel="nofollow">Tools</a>: <a href="/wiki/Type%20Design%20Tools" class="freelinking" rel="nofollow">Type Design Tools</a> : AsiaFont Studio</strong></p>
    <p>Supporting more glyphs than <a href="/wiki/FontLab" class="freelinking" rel="nofollow">FontLab</a> alone. AsiaFont Studio was an extended version of Fontlab for creation of double-byte characters such as Han (Chinese) characters.</p>
    <p>The functionality of AsiaFont Studio was incorporated into Fontlab Studio 5, and is no longer available as a separate software application.</p>
    <p><a href="http://www.fontlab.com/Font-tools/AsiaFont-Studio/" title="http://www.fontlab.com/Font-tools/AsiaFont-Studio/">http://www.fontlab.com/Font-tools/AsiaFont-Studio/</a></p>
