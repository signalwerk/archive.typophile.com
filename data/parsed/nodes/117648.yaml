    html: |-
      <p>Hi Clark,<br>
      I think the market is very small considering Greek calligraphy fonts and most probably you can't find this one in digital form.<br>
      The closer I can see to your sample (not very close indeed) is the Greek version of Vivace, called <strong>CF Vivace</strong> and designed by Vladimir Radibratovic [1999] for Cannibal Fonts.<br>
      See the image bellow for a comparison:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/CFVivace-grek_4525.jpg"></div><p></p>
