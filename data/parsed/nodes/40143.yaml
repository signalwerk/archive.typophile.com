    html: <p>I worked for Warner Bros. back in the 90's and did many Young cd's. It is NOT handwritten. It is a font for mac. I had it until a hard drive crashed. Look at the enclosed pic, it is of a cd I made up of rough "live" Neil performances. I created the cd for fun and you'll see how the font looks. The cover with "headphones" was actually an EMI George Martin project that I worked on. Any can email me and keep in touch on the Neil font.<img src="/sites/default/files/old-images/neil-cd4_3608.jpg"></p>
