    <p>Does anyone know if the font that Neil Young uses for all the text on his albums is available anywhere? It's copied from his handwriting, and it definitely exists, as you can see inside an album or CD. This sample is actually hand-written, I'm pretty sure.</p>
    <p>Thanks!<br><img src="/sites/default/files/old-images/NY_font_4375.jpg"></p>
