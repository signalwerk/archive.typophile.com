      <p>I think having Design Studio in the circle could cause problems at small size use. Image Mechanics is struggling with the tracking issues, try without tracking and pulling them slightly down from the image and upping the point size and leading a bit so the shape is still working with the back legs but with slightly more room, I don’t have a problem with the Minion it sits well with the imagery, you could certainly have a look at other typefaces, my feeling is that it needs to be conservative maybe<br>
      <a href="http://www.myfonts.com/fonts/linotype/stempel-garamond/">http://www.myfonts.com/fonts/linotype/stempel-garamond/</a></p>
      <p>or more modern<br>
      <a href="http://www.myfonts.com/fonts/emtype/relato/">http://www.myfonts.com/fonts/emtype/relato/</a></p>
      <p><a href="http://www.myfonts.com/fonts/emigre/tribute/">http://www.myfonts.com/fonts/emigre/tribute/</a></p>
      <p>Although the A is too narrow when set with all caps on Tribute.</p>
      <p>Tim</p>
