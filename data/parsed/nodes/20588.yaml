      <p>*As many designers know or may appreciate it quite a difficult task to design a logo for yourself</p>
      <p>Exactly! It’s almost rediculous how much harder it is to create one for yourself. And it doesn’t help that it’s hard to create logos for design firms anyway. </p>
      <p>More to the point, I don’t like the composition of the logo, especially for everything you want it to do. It’s too hard to read the letters in the circle and the logotype feels forced into that location. I would even think it would be better to shrink the whole mark and just put it above the type and not have the type in the feet. </p>
      <p>Also I would think a more traditional shield would be better or something more unique. It sort of reminds me of Minds of Intelligence’s logo: <a href="http://www.mindsofintelligence.com/">http://www.mindsofintelligence.com/</a> although the one they have currently on their site isn’t a good representation. And theirs is much more versatile. I like the shapes of the animals however they are so dramatic it consumes the logo and takes it over. Maybe reducing their size in comparison to the type would help.</p>
