      <p>Thanks guys, this is great getting some outside feedback!</p>
      <p>Personally I’m not a huge fan of the circular form in the middle and contents. It was really a way of trying to connect animals together without them looking like they were fighting (see attached).</p>
      <p>I see what you mean Eben, a sheild and wavy banner could work well, just not to sure whether it would be “modern” enough. When I orignially started sketching I used a sheild but couldn’t really come up with ideas that worked within the sheild.</p>
      <p>Another issue I find with the current logo is that it needs to be centered within a page otherwise it looks un-balanced.</p>
      <p>Also could it look better just having 1 animal to represent both animals or just a lion with some nice typography below.</p>
      <p>We currently use the lion as a ico/build logo for web sites– maybe this would be a better way to go.</p>
      <p>Attached some more concepts, with your sugestions. When the logo is on top of the type it appears to just float– any suggestions on how to tie it in.</p>
      <p>Current logo in use:</p>
      <p><a href="http://www.imagemechanics.co.nz">www.imagemechanics.co.nz</a></p>
      <p>Thanks agian for your help!</p>
