      <p>As per the card I think it will look good. Large gold foil will be cool, can’t really tell what the other side will look like without an image, what kind of image are you going to have? I don’t really think you need an image but just some different type layouts. The cut out type as it is currently will be harder to read and there is no separation/heirchy to look at so finding information will take too much effort when it should be effortless.</p>
      <p>You could put a gold foil border around the contact info side to tie in the theme and keep a defined look on that side also (if money permits).</p>
