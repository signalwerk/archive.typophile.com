    <p>Hi Every One,</p>
    <p>I’m new to this forum and looking for some fresh advice on a logo/Identity I’m working on.</p>
    <p>The logo is for my design studio in New Zealand. As many designers know or may appreciate it quite a difficult task to design a logo for yourself. It has sat in limbo for around 3 months and I am not sure where to go from here.</p>
    <p>Firstly the logo was inspired by the new studio we moved to- an old government office, hence the traditional emblem look. We did some research and each animal represents the founding partners of our firm. We also have a love of retro inspiired design (but I felt creating a simple circular form etc has been done to death by designers around here).</p>
    <p>We wanted a logo that represented tradition and quality yet had a modern mood. (this was to be conveyed within supporting design elements– illustration and phtography) Hence we rolled out the logo on our web site but never completed material for print material. Which leaves us in the shameful position of not having a consistent identity!</p>
    <p>Any how, sorry for long story- I’ll cut to the case:</p>
    <p>Currenty the logo Uses Minion Pro (I know) and I’m wanting to change the font to something more unique– yet suits the style. The logo can not really be changed dramitically as it is in use (silly I know). I require a great, well designed typeface with various weights so it can be used throughtout material. I am trying to use the traditional typography in a modern way in material.</p>
    <p>Another problem with the current logo is the “Design &amp; Communication” typography can not be reduced and be legable at small sizes. However I like the way it sits between the animal legs?</p>
    <p>The typography also must have heavy weights also to be used in poster/illustratios etc. Asking too much? </p>
    <p>Any help would be most appreciated.</p>
    <p>Cheers, Jason</p>
    <p></p><div class="imageWrap"><img src="files/Logo_sample_5395.jpg"></div><p></p>
