      <p>How would you feel about moving the circle up to almost level with the top of the heads of Pegasus and the lion, this could still contain a simple I, centred over, M monogram, I think you would have to drop the swashes to avoid printing/legibility problems. Then break ImageMechanics into two lines, using the back legs as frames, which would allow you to increase the type size to balance the weight of the of the elements, as for your strapline, (does it have to include studio?) either way the triangular shape the type makes would allow you to increase the strapline size. Depending on the print size you might need to reduce some of the more extravagant hairs on the heraldic creatures.<br>
      Tim</p>
