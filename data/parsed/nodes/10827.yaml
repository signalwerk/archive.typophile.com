    html: '<p>The matter is screen pitch size I think... <br>Check by way of comparison the work of Rainer Zenz for palm screens. The "microfonts" tend towards the same goal as you. <br><a href="http://www.rainerzenz.de/palm/alphafontview.html" target="_top">http://www.rainerzenz.de/palm/alphafontview.html</a> <br>But perhaps lower than 7 pixels high the solution is greyscaling. Bitsream made this: <a href="http://www.bitstream.com/wireless/index.html" target="_top">http://www.bitstream.com/wireless/index.html</a> <br>Grg.</p>'
