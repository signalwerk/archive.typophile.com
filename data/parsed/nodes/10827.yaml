    html: "<p> Heeyah Miguel! <br>I wasn't speaking about piracy or something like this! Everybody here agree saying that when somebody design small bitmap fonts have the same problems as his neighbour. <br>Therefore, I'm a bad-english speaker, and I know now that \"matter\" doesn't means \"problem\": I said \"pitch size\" because I've seen the Minority font on a 1280/1024px screen, and to my mind it can't work with a resolution greater than 800/600px. I work designing fonts for cellular phone screens and most of the constructors include a zoom mode on their products cause they're happy to announce that they can display 6 lines of text, but many users can't read them. That's why I've send this palm microfonts link. They can be legible because palm display got a big pixel size, bigger than I-mode phones. <br>Making the smallest font means \"making the last legible size\" and gain place to display more lines on screen, or it's only a challenge? <br>BTW, I really prefer your bold version. Do you have a full character set of this one? <br> <br>Cheers <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> <br>Greg. </p>"
