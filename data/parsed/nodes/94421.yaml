    <p>ttfautohint version 0.9.12 now does 'Stem Width Handling'<br>
    I am testing and posting screenshots at<br>
    <a class="freelinking external" href="http://code.newtypography.co.uk/?page_id=2548" rel="nofollow">http://code.newtypography.co.uk/?page_id=2548</a></p>
    <p>Feedback welcome. 'Ayes' to the left, 'Nayes' to the right !</p>
    <p>Below is Dalton Maag's Ubuntu Font, top original manually hinted, lower shot is same font auto-instructed with ttfautohint. Magnification is x800, x400, and actual size 13px. Pleas note the better 'eth' on the lower screenshot.</p>
    <p><img src="https://lh4.googleusercontent.com/-dvXqwX0Q23Y/T_HDwqgINeI/AAAAAAAAD74/KUm0qDKUyss/s589/island-ubuntu-ffox-DW-win7-original.PNG"><br>
