  html: |-
    <p>Would love to pick your amazing brains regarding what character to use after an asterisk. I've seen one (*), then two (**) and three (***). Is that acceptable? Is there another character one can use without looking outright jarring?</p>
    <p>The context is that a subhead uses an asterisk, and then a product description uses one to reference the fine print.</p>
