    html: |-
      <p>The traditional way to deal with this is to use asterisk, then dagger, then double dagger. Then, according to Chicago Manual of Style, use two asterisks, two daggers, etc. </p>
      <p>Traditionally, dagger and double dagger were used pretty often. You can also use section marks if need be. But now that numbered end notes are more common, the asterisk etc. are most often used for footnotes when you have both a footnote and numbered end note. And then usually there aren't so many footnotes. After all, the object of the author and designer should be something that you can actually read, not a puzzle.</p>
