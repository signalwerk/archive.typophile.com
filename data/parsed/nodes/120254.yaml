    <p>Hi,</p>
    <p>I recently spotted an issue with kerning in FL.<br>
    In metrics window all kerning works fine but when i generate "kern" feature some pairs among classes are excluded. But it is only visible in OT preview and later in exported file. What interesting is, when I change the order of the code, e.g. I bring the missing pair to the top of the code, it works. Anyway the whole thing behave very random and I can't get the logic of this. I was searching the problem but didn't found the exact answer.  Putting extra "subtable" doesn't fix the problem.</p>
    <p>Hope it sounds clear.</p>
    <p>Any suggestions would be highly appreciated.</p>
    <p>Thanks,</p>
    <p>Rad.</p>
