      <p>Hi Ken -<br>
      I'm a currently a creative director at Bruce Mau Design. I wasn't part of the team on this project but do know that it was in fact a bespoke typeface specifically drawn for ¡Guateamala! It was a combination of faces bred together (although Alternate Gothic looks like it would have worked well too!). Hope that helps...</p>
