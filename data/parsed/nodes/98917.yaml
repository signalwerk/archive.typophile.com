      <p><a class="freelinking external" href="http://www.typophile.com/node/87088" rel="nofollow">Previously asked</a> but still unresolved.<br>
      Not sure it is a commercial typeface, more a bespoke typeface exclusively done for this project. Only top finials are rounded and don't know any typeface like this one. It looks like a variation on <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/alternate-gothic/" rel="nofollow">Alternate Gothic</a>: top half part manually rounded and some finials reworked. Your best chance is probably to ask directly <a class="freelinking external" href="http://www.brucemaudesign.com" rel="nofollow">Bruce Mau</a>.<br>
      More "need-to-be-bottom-half-de-rounded" (and some letters to be redrawn, mainly /R) in the same vein: <a class="freelinking external" href="http://www.youworkforthem.com/product.php?sku=T0020" rel="nofollow">Ultramagnetic</a>, <a class="freelinking external" href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Brauer+Neue/" rel="nofollow">Brauer Neue</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/dsgnhaus/hector/" rel="nofollow">Hector Rounded</a><br>
      More "need-to-be-top-half-rounded" in the same vein: <a class="freelinking external" href="http://www.myfonts.com/fonts/matchandkerosene/prismatic/" rel="nofollow">Prismatic 4 Base</a>, <a class="freelinking external" href="http://www.ffonts.net/tes-Bold.font" rel="nofollow">Tes</a>, <a class="freelinking external" href="http://www.ffonts.net/Sugo.font" rel="nofollow">Sugo</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/matchandkerosene/duotone/" rel="nofollow">Duotone</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/dsgnhaus/hector/" rel="nofollow">Hector</a></p>
