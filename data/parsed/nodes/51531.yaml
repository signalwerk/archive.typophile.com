    <p>Has anyone seen the new John Lewis Christmas Brochure/Catalogue. I like the script font in particular <a class="freelinking-external" href="http://www.johnlewis.com/jl_assets/catalogue/08_xmas_giftbook.jpg">cover thumbnail</a> - sorry this image is so small - I will scan my hardcopy if I get a chance.</p>
    <p>It has a similar retro feel to coquette by Mark Simonson</p>
