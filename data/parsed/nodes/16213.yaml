    <p>Interesting article about color perception, titled "Is my red your red?"</p>
    <p><a href="http://www.world-science.net/exclusives/050526_colorfrm.htm" title="http://www.world-science.net/exclusives/050526_colorfrm.htm">http://www.world-science.net/exclusives/050526_colorfrm.htm</a></p>
    <p>The chart is interesting, since I didn't agree with most of the average "best representation" dots of each color. It was done in '72, maybe that's why.</p>
    <p>My norms, based on my monitor: Red - up one from shown dot. Orange - down a square. Blue &amp; Yellow - one to the right.</p>
  html_clean: |-
    <p>Interesting article about color perception, titled "Is my red your red?"</p>
    <p><a href="http://www.world-science.net/exclusives/050526_colorfrm.htm" title="http://www.world-science.net/exclusives/050526_colorfrm.htm">http://www.world-science.net/exclusives/050526_colorfrm.htm</a></p>
    <p>The chart is interesting, since I didn't agree with most of the average "best representation" dots of each color. It was done in '72, maybe that's why.</p>
    <p>My norms, based on my monitor: Red - up one from shown dot. Orange - down a square. Blue &amp; Yellow - one to the right.</p>
