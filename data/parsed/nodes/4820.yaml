  html: <p>I have a photograph of a hydrangea head that I am trying to create to look like the ones in the stationery below.  I am using Photoshop 7.0.  Does anyone have instructions on how to do this or links to online tutorials?   <br><img src="http://www.typophile.com/forums/messages/4100/36158.jpg" alt="Hydrangea invite"><img src="http://www.typophile.com/forums/messages/4100/36159.jpg" alt="hydrangea invite_2"></p>
