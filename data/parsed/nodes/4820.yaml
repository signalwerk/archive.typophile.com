    html: <p>I think you're looking to emulate the illustrated etching of the illustrations in your sample, right? <br> <br>If so, you should check out the Andromeda Filters, which do a decent job of changing photos to faux-etched illustration. <br> <br><a href="http://www.andromeda.com/info/series3.html" target="_blank">http://www.andromeda.com/info/series3.html</a></p>
