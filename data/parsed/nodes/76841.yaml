  html: |-
    <p>Ascender is pleased to announce that a distribution agreement with the talented lettering artist <a class="freelinking external" href="http://www.ascenderfonts.com/foundry/laura-worthington/" rel="nofollow">Laura Worthington</a>. Laura has been in the type design field since 1997 and she has a deep passion type and lettering design.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/LauraWorthington-PR_3575.png"></div><p></p>
    <p>Laura credits her colleague Charles Borges de Oliveira with inspiring her journey into type design. Her first font, Grindel Grove, came out of her work on a brochure for a native plant habitat garden. Subsequently she has produced a variety of delightful script and handwriting fonts. Many of these fonts are packed with a variety of OpenType features including alternates, ligatures and swashes to provide spontaneity and random flourishes. Laura's wonderful type designs are full of vitality and charm, and we hope you'll agree that they can add a vibrant touch to a wide variety of projects.</p>
    <p>Ascender is offering the Laura Worthington font collection for license/download from its <a class="freelinking external" href="http://AscenderFonts.com" rel="nofollow">http://AscenderFonts.com</a> website, and for license to software developers and hardware manufacturers from its <a class="freelinking external" href="http://AscenderCorp.com" rel="nofollow">http://AscenderCorp.com</a> website.</p>
