  html: |-
    <p>Brew Town. City of Festivals. German Athens. MKE.</p>
    <p>The <a class="freelinking external" href="http://www.typesociety.org/" rel="nofollow">Society of Typographic Aficionados</a> (SOTA) is pleased to announce that Milwaukee, Wisconsin, will be the host city for TypeCon2012.</p>
    <p>We are very excited to be working with folks at the historic <a class="freelinking external" href="http://woodtype.org/" rel="nofollow">Hamilton Wood Type &amp; Printing Museum</a> - in nearby Two Rivers, Wisconsin - on several special events and workshops for the conference. We’d also like to thank the top notch crew of local typophiles who have been instrumental in helping us bring TypeCon back to the midwest.</p>
    <p>Dates and venues for next year’s conference will be announced in the following weeks.</p>
    <p>If you are interested in helping with TypeCon2012 preparations and planning, we will be looking for plenty of volunteers who love type and design as much as we do.</p>
    <p>Additional information and updates will be published on the <a class="freelinking external" href="http://www.typecon.com/" rel="nofollow">TypeCon</a> site, via our <a class="freelinking external" href="http://twitter.com/typecon" rel="nofollow">Twitter</a> stream, as well as in our <a class="freelinking external" href="http://www.typecon.com/newsletter" rel="nofollow">email newsletter</a>.</p>
