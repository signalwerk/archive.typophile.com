      <p>Kent, thanks for the link, my above summary on the term "chirographic" was my mangled memory of your post. </p>
      <p>Nina, I am uneasy about the philosophy I hear--maybe wrongly--in your phrase "ideally based on functionality, rather than tradition."</p>
      <p>To me this sounds like the radicalism of post WWI "functionalists" in architecture, who were opposed to ornament on the supposed grounds of improving function.</p>
      <p>First of all aesthetics is functional, because human beings want to live with beauty, if we have a choice. </p>
      <p>Second, radicalism in type is misguided. I am not politically a conservative, at least the way Americans use that word, but I do agree with Stanley Morrison that type has an element that is inherently conservative: we are tied to letter forms that we inherit from the past, because if we go too far in altering the traditional forms people can't read them. </p>
      <p>Third, when talking about functionally and readability in italics you are facing a tricky situation. Probably all noticeably slanted letters are less readable, and certainly slanted letters in the midst of vertical ones slow you down. But they are *meant* to slow you down, and draw attention to the word or phrase. That is their function. So here you have slightly less readability as more functional for communication!</p>
      <p>I absolutely don't want to discourage your experiments, but I think that the history of radical functionalism in architecture shows that while it inspired a lot of interesting work, it is too narrow and restrictive as a philosophy.</p>
      <p>So I am all for chirographic italics, and non-chirographic ones. Let a hundred flowers bloom.</p>
