      <p>Kent, I may well have been muddling up terminology.<br>
      The way I understand things, I'd say that "chirographic" is a much broader term generally meaning (in the context of type design) "informed by handwritten forms" or "borrowing from the aesthetic of handwriting".<br>
      "Cursive", in my book, refers more concisely to a historically-informed way of shaping italics influenced by / based on a certain calligraphic style distinct/separate from the roman.</p>
      <p>In terms of the "broadness" of the terms, it's probably something like<br>
      chirographic &gt; calligraphic &gt; cursive.</p>
      <p>Glancing over my long post above, I could probably have used "cursive" in lieu of "chirographic" a couple of times… but the looser term wasn't quite unintentional: It appears to me that some current fonts have a <em>chirographic</em> quality to the italics that is absent (or not as pronounced) in the roman, but doesn't necessarily follow the "classic" <em>cursive</em> model. But I might be wrong – I'm not very calli-savvy.</p>
      <p>Let me know if I have the terminology mixed up (or this stuff doesn't make sense).</p>
