      <p>Nina, chirographic I think is more or less a 'typophile' word. I think it was invented by John Hudson to refer to the aspects of type that derive from or are influenced by handwriting. He prefers this to "calligraphy", as that means "beautiful writing", and so has a narrower meaning of decorative writing. The formal hands of scribes were more utilitarian, and these had the biggest impact on the development of printer's types. </p>
      <p>Hrant picked up the term, and has used it more or less as a curse word against what he regards as the baleful influence of writing on type. But what exactly he objects to about writing's influence has never been entirely clear to me, so I generally avoid the term.</p>
