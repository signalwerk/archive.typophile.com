      <p>Chris, no crusade in sight on this end, just a desire to see what italics are and what they do, and if they need to be what they usually are in order to do that job. </p>
      <p>Like you say, italics were usually separate types and only later were culturally "adopted" to be a subordinate "style" to complement a given upright font. And my view is, just because it was culturally "learned" to do it this way doesn't necessarily make it the Only True Way.<br>
      Sometimes today secondary fonts are used inline for a different way of adding gentle emphasis or denoting other layers of meaning, for example the sans variant of the text face or maybe a different typeface altogether – much like the old guys used cursive fonts as secondary "italic" ones. It's a great effect if done well, and shows IMO that the point is not that such an emphasis-mark needs to be cursive and/or slanted, but that it simply needs to be <em>different enough while still belonging</em> to the regular cut.<br>
      Beyond that, it's a question of flavor: Setting a word in a matching sans within a body of serif is a <em>differently</em> "flavored" emphasis than using cursive italics – and that's where it gets really interesting: It means that if we only accept the cursive-italic form of "italic" emphasis, we accept that it automatically comes with a certain flavor, i.e. a specifically chirographic one; and I don't see how that is necessary, or even needs to make sense in many cases. Think about what you'd usually use more cursive/calligraphic fonts for: wedding invitations? Now why exactly would I want a book title highlighted in running text to look more festive, or more personal, than the running text – more hand-written? I only want it to stand apart!</p>
      <p><em>"I have a tough time seeing your headlong leap into “necessary emancipation”."</em><br>
      Short version (sorry, lots of work ahead): By "emancipation" I didn't mean to say that I'd want type design to break from centuries of handwriting tradition and history just for the sake of it, and crusade for that, and fight the pen, armed to the teeth, burning calligraphic type designers at the stake. My point is (and it *is* a rather benign one, much like William says) that type needs to stop being dependent on the pen and holding its hand, but continue – and a bit more boldly, perhaps – to search for its own, functional aesthetics from within – and ideally based on functionality, rather than tradition. Which isn't limited to italics, but also means asking questions like the one above.</p>
      <p><em>"That more extreme view, which implies that type having more influence of the pen is inherently less readable, is what I don’t buy."</em><br>
      And I don't get. Looks like we need the man to get back here!</p>
    html_clean: |-
      <p>Chris, no crusade in sight on this end, just a desire to see what italics are and what they do, and if they need to be what they usually are in order to do that job. </p>
      <p>Like you say, italics were usually separate types and only later were culturally "adopted" to be a subordinate "style" to complement a given upright font. And my view is, just because it was culturally "learned" to do it this way doesn't necessarily make it the Only True Way.<br>
      Sometimes today secondary fonts are used inline for a different way of adding gentle emphasis or denoting other layers of meaning, for example the sans variant of the text face or maybe a different typeface altogether – much like the old guys used cursive fonts as secondary "italic" ones. It's a great effect if done well, and shows IMO that the point is not that such an emphasis-mark needs to be cursive and/or slanted, but that it simply needs to be <em>different enough while still belonging</em> to the regular cut.<br>
