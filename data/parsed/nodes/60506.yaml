      <p><em>"slight of angle and light on calligraphic style, which in combination are not terribly effective to a purpose, so far"</em><br>
      And that's exactly why I'm looking for them: I'm curious if/how they can be (have been) made to work. I wonder if other constituents of "italicness" – such as narrower width, lighter color, gentle structural changes (like the treatment of joins and/or serifs), and possibly even different vertical proportions – can't pull the italics far enough away from the roman even without a heavy slant, or full-on chiro/calligraphic action.<br>
