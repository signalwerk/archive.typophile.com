      <p>Craig, you're right I wasn't precise. The problem is that "functionalism" has meant different things to different people. </p>
      <p>Sullivan, who coined "form follows function" actually loved ornament. But if I remember rightly Mies van der Rohe was opposed to ornament as anti-functional. I don't know if he thought all ornament was ugly, but he was opposed to it. Also in type, Bayer's alphabet was I think also pared down of all ornament, breathing of this same ideology. </p>
      <p>So I'm only really talking about one strand in functionalism, but I do think it's the one that made the most noise in the last century--at least what I remember of it, which is the second half.</p>
      <p>By radicalism I mean that view that in any field we have to tear up the past and start again. So radicalism and traditionalism, in the senses I am used to using them, are opposed to each other. </p>
      <p>I certainly think type should be functional, but I think "functionalism" has been used for some ideologies that are too narrow and restrictive.</p>
      <p>Actually, the italics are a good example showing why it is simplistic to identify functionality with lack of ornament and simple geometrical forms. </p>
      <p>The lack of simplicity of italics, and their slower reading, helps provide a contrast, and so is functional in a different way from the companion roman.</p>
