      <p>I will use the term "Italics" as used by editors to describe the typographic form things like book titles should be set in. Italics have a different need than bold although both are attempts to separate some parts of text from the normal roman book face. Bold text set inline with the book face stands out indeed with weight being the primary driving force for contrast. Italics have a subtler use. They are not meant to leap out at you and make a jump in color like bolds do, they just make enough of a distinction for a person to see them as "different than roman" but not be emphasized above roman. You might call this a non-hierarchal difference or separation without dominance.<br>
      By removing weight change as an option, slant is one of the few remaining players that cuts across all type families. There are other things possible such as the degree of cursive form historically used. The earliest use of italic type mixed inline with upright roman texts were not from the same type family and a pairing was made based on how closely the x-heights matched when set as neighbors. Shortly after that, foundries took the opportunity to design a so-called matching italics to be sold as a companion to the upright. We can debate at this point, hundreds of years after the fact, how closely matched the early italics really were. Today, italics are IMO better matched as family than the older ones were. We have trained ourselves to accept the variance over the past centuries. Whatever we come up with as a substitute for the current use of slant with a strong cursive influence and use of entrance and exit strokes, we will also require several years before the reading public begins to "get it".<br>
      I would be the last person on earth to say, "don't even try it" and I welcome the opportunity to see your attempts as you proceed. I would only say do not throw out the tools people are accustomed to--or at least do not curse them as evil.  It is a good thing to boldly go about and create an alternative to current italics as long as you do not then make it a crusade to rid the world of other useful tools.</p>
      <p>If you build it, they will come.</p>
      <p>ChrisL</p>
