      <p>Nina, I wasn't criticizing your use of the two terms interchangeably above. I don't think either have clear, universally accepted definitions, so it's not a question of right or wrong, or even "muddling" the terms. I was just trying to understand how you are intending to use them. I admit to still not being quite clear.</p>
      <p>I think you've outlined the parameters of distinction (at least, within the context of what we commonly understand to be "italic") -- slope/slant, width, weight, relative vertical proportions, and form structure. You've expressed an interest in minimizing the first: the angle from the vertical. </p>
      <p>Width and weight are typically fine-tuned when developing an "emphatic companion" to the roman -- typically slightly narrower and slightly lighter. Sometimes relative vertical proportions are adjusted when the angle is great.</p>
      <p>Turning attention to form structure, and the reason for my question about terms, I'm trying to understand which components constitute "chirographic" and/or "cursive" in your assessment.</p>
      <p>Taking sloped roman as a point of reference, which changes to the structure would make it necessarily "cursive"? Take the lowercase <em>n</em> for instance. If you remove the left serif of the right stem, have you made it cursive, since this one-sided structure typically arises from the motion of writing? What about if you remove both of the serifs on the right stem, now is it "cursive"? Does it matter whether the transition is soft &amp; round or hard &amp; angular? What about how high or low the join from arch to stem is; since a lower join typically arises from a single motion of the hand, does that play a defining role in "cursive"?</p>
      <p>When you object to (or question) "cursive/chirographic," what are you directing your attention at?</p>
