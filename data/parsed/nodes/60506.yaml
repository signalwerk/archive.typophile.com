  html: |-
    <p>This might be a tough call, but I'm looking for examples of typefaces (preferably text faces) featuring very slightly slanted italics – ideally, something like the 3–4 degree range. Bonus points for slightly slanted italics that also don't show an excessively cursive flavor. Patria is one face I can think of off the top of my head that does this quite successfully. Any others?<br>
    Cheers!</p>
