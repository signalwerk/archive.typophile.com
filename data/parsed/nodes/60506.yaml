    html: |-
      <p>You want that strong response from me? OK, here goes:</p>
      <p>First off, in my world both the "pure" slanted-roman, and the "true italics" are to be seen as abstract extremes on a continuous axis – in this case, the axis of minimal to maximal chiro/calligraphic influence in the italics, or maybe the chiro-"delta" between a given roman and italic cut (in terms of an additional chirographic influence on the italics causing structural differences between it and the roman). It's possible that Morison (and I'm speculating here, because as I've said before, I haven't actually read his text) was too extreme on this scale, too dogmatic.</p>
      <p>But I wonder, might not a position on the non-chiro end of that axis still be workable if other factors were weighed differently? Simply stated, I'd say you can't (usually/easily) take chiro-ness out of "the italics equation" and not add "italicness" back in some other form without the result becoming, well, less italic! And thus less differentiated. But "italicness" can come about by different variables, and the chiro/calligraphic "tone" is just one of them.* There's slant as well, there's color, there's width/narrowness, there's possibly different vertical proportions; and I'm sure there's more too. So reducing both the slant and the chiro-value would probably mean that one would have to consider making the italics notably narrower, possibly lighter, and maybe smaller. And might that not work?<br>
      * I could swear I've read a similar discussion on Typophile before, but my recollection of it is too fuzzy to quote or even find it.</p>
      <p>So there's counter-weighing, and then I'd personally argue against the idea of the "pure" slanted-roman too. I think it should be possible to make very subtle differences in tone that don't need to escalate into too "literal" references to chirography. Things like different treatment of serifs and/or joins, or a subtly different flavor of the curves… maybe.</p>
