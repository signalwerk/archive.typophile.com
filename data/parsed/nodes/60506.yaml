      <p>Thanks for the correction, Nina, I didn't realize it was a standard English word. </p>
      <p>Ben in the form you put it, "the chirographic forms inherent in writing should not be assumed to be optimal for readability," I would agree, and think few would disagree. From Jenson on, type designers have modified joins, weights, and sizes for greater readability.</p>
      <p>But Hrant's position has been far stronger than that. If I have understood him, he thinks that written forms are inherently less readable, because of following the stroke or "moving front" of a pen. When they show a moving front, where the two extremes of the stroke are linked as in a pen, that prevents a proper "notan" or balancing of black and white. And this messed-up notan of necessity makes the type less readable. </p>
      <p>That more extreme view, which implies that type having more influence of the pen is inherently less readable, is what I don't buy. In my view, some features of pen writing help, and some hurt. Containing noticeable pen-like features, such as in Jos Buivenga's new Calluna, doesn't necessarily hurt readability.</p>
