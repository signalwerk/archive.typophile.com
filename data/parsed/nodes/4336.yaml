  html: <p>I enjoy writing in calligraphy, and I want to make a font that looks renaissance in style, with a stress on the pen and a humanist angle. I am showing an early sketch below. I don't have anyone to show it to, or ask my questions to, so hopefully you can help me make it decent. Parts of it look very chancery cursive-like, while the capitals, which I haven't started yet, will probably have more renaissance 'flair'..possibly.  But please let me know what you think! <br> <br>So here's the first JPG. I'll put down a few of my initial questions/concerns following.. <br> <br><img src="http://www.typophile.com/forums/clipart/your_image.gif" alt="scan01.jpg"> <br> <br>Is this looking like a renaissance typeface? <br>I like the tall ascenders, but how badly will this hurt it if I try to use it in text? <br>Some of the letters are kinda tipsy, like the b and d, but if the uprightness seems okay, they'll be more like the third h, the l and the k. <br>I have specific questions for several letters, but I'll see if it's worth continuing first. The only g that I like is the one marked down at the bottom. The marks on the w, b, and e just mean that I like those versions better than the previous versions on the page. <br> <br>All comments welcome. It's my first attempt at a typeface, but I'm very determined to make it work. Thanks in advance! I have sketches prior to these, so let me know if you want to see previous versions or process of any of the letters. <br> <br>�Brian</p>
  html_clean: <p>I enjoy writing in calligraphy, and I want to make a font that looks renaissance in style, with a stress on the pen and a humanist angle. I am showing an early sketch below. I don't have anyone to show it to, or ask my questions to, so hopefully you can help me make it decent. Parts of it look very chancery cursive-like, while the capitals, which I haven't started yet, will probably have more renaissance 'flair'..possibly.  But please let me know what you think! <br> <br>So here's the first JPG. I'll put down a few of my initial questions/concerns following.. <br> <br><img src="http://www.typophile.com/forums/clipart/your_image.gif" alt="scan01.jpg"> <br> <br>Is this looking like a renaissance typeface? <br>I like the tall ascenders, but how badly will this hurt it if I try to use it in text? <br>Some of the letters are kinda tipsy, like the b and d, but if the uprightness seems okay, they'll be more like the third h, the l and the k. <br>I have specific questions for several letters, but I'll see if it's worth continuing first. The only g that I like is the one marked down at the bottom. The marks on the w, b, and e just mean that I like those versions better than the previous versions on the page. <br> <br>All comments welcome. It's my first attempt at a typeface, but I'm very determined to make it work. Thanks in advance! I have sketches prior to these, so let me know if you want to see previous versions or process of any of the letters. <br> <br>�Brian</p>
