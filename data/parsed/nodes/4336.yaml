    html: <p>i am by no means an expert on calligraphy, but a friend of mine has made several calligraphic fonts that you can view and download from <a href="http://mysite.freeserve.com/Kingthings/fonts/fonts.htm" target="_blank"> his website</a>. Kevin's a good guy and perhaps he could be some help at giving you a crit on calligraphic letter forms. In any case his fonts are great to look at for inspiration, I think you may want to take a look at his Petrock for this one, as i think (i could be very wrong) that it is of a similar style as what you are trying to do. Hope this helps!</p>
