    html: <p>Thanks for the link. I like the "shape" of calligraphic letters.. the angles mixed in with the round forms; something the petrock light really does well. <br>I've been doing some more reading, and I'm redoing all of my letters..they're too handwritten/calligraphic. Hopefully it will turn out as something of a cross between jenson/bembo and calligraphy.. leaning more towards calligraphy. (the cradle!) ** Not to say it will look as good as jenson or bembo.. but that's the direction i'm re-aiming. ;)   </p>
