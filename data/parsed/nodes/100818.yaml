      <p>I was trying to get the main focus on my name and then on to the articles section so I didn't want to set "Thoughts &amp; Opinions" at a medium-large font-size. Basically that is why the menu and that title has a lower font-size. Anyway, I bumped it up 1 pixel and I think it works better with the menu already, what do you think?</p>
      <p>I also changed the date to Benton Modern RE, thoughts on that as well?</p>
