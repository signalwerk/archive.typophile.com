    <p>Would anyone mind giving some feedback on the overall use of the chosen webfonts and design?</p>
    <p>The webfonts used are:</p>
    <p><strong>Old Standard</strong>  - My name, page titles, article numbers and article titles<br>
    <strong>Benton Modern RE</strong> - Body text<br>
    <strong>Benton Sans RE</strong> - Menu links, article dates, footer copyright and Kirby CMS info</p>
    <p>The only thing I dislike about it is the dates under the article titles.</p>
