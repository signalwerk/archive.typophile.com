      <p>&gt; I think the answer to the size issue is mentioned in this book — haven’t got it to hand — and involves importing each glyph along with a consistently sized reference bounding rectangle - but I’m sure someone else knows the definitive answer.</p>
      <p>That is indeed in the book. I know there are many who swear by Fontographer, but I’d recommend that if you can get your hands on FontLab, to do so. Cabarga also has a book called Learn FontLab Fast which is great as well. </p>
      <p>I would also go the next step and say that in the future it can be much easier if you take vector art straight into your font application. Since you’re using Photoshop CS, why not use Illustrator CS’s Pathfinder tools? That’ll save you some time on your filled in forms if you like working with other programs before Fontographer or FontLab.</p>
