      <p>I would strongly recommend Leslie Cabarga’s Logo Font &amp; Lettering Bible (<a href="http://www.amazon.com/exec/obidos/tg/detail/-/1581804369/qid=1119438262/sr=8-1/ref=pd_csp_1/104-5344466-7749503?v=glance&amp;s=books&amp;n=507846">Amazon link</a>).</p>
      <p>Valuable (and unusual) mix of historical context, in depth case studies and practical how-tos (inc Fontographer specific stuff). Very readable.</p>
      <p>While I haven’t come across the size problem (I’ve used Fontlab in my initial font dabbling) I think the answer to the size issue is mentioned in this book — haven’t got it to hand — and involves importing each glyph along with a consistently sized reference bounding rectangle  - but I’m sure someone else knows the definitive answer.</p>
