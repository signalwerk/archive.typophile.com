    <p>Hi there!</p>
    <p>First off, this is my first foray into attempting to create a font or toying with fonts in general. I’ve been interested in how all this works for some time, but never really delved into it until recently.</p>
    <p>I have been asked to create a custom handwriting font for one of my clients so that they can use it for custom graphics and other things I will be creating for a new site and some album artwork I will be designing.</p>
    <p>My basic problem is that the fonts like B’s and P’s and D’s are being filled in by ‘black globs’ and I am not sure how to fix this problem.</p>
    <p>I have the following screenshots so you can see what I am dealing with:<br>
    <a href="http://www.mbstia.com/testing/fontexpert.jpg" target="_blank">Overall Font as it looks in FontExpert font viewer</a></p>
    <p><a href="http://www.mbstia.com/testing/boutline.jpg" target="_blank">Font outline in Fontographer</a></p>
    <p><a href="http://www.mbstia.com/testing/bpreview.jpg" target="_blank">Font ‘Preview’ in Fontographer</a></p>
    <p>As you can see, in the outline it looks as it should with the ‘holes’ in the<br>
    “B” where the should be. But then if you view the preview the entire B is filled in and solid.</p>
    <p>I am working with the following programs:<br>
    Photoshop CS2<br>
    Adobe Streamline 4<br>
    Macromedia Fontographer 4.1</p>
    <p>What I did to make the font was:<br>
    1.) Had the person give me a handwriting sample<br>
    2.) Cut out each letter and made it a TIFF file<br>
    3.) Batch Converted all the TIFF files to EPS files in Streamline<br>
    3.) Imported each glyph into Fontographer<br>
    4.) Created a TrueType Font</p>
    <p>If anyone can give me some hints or tell me how to fix this issue, I would greatly appreciate it.</p>
    <p>Regards,<br>
    Michelle</p>
