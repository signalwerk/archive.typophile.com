  html: |-
    <p>Yo, first post.</p>
    <p>I was recently commissioned via a uni Live brief to work on a gallery signage system to be implemented within the next few weeks but being quite a fairly high profile job (for me) I wanted to get things right.</p>
    <p>I’ve picked out quite a selection of faces to use, but the illustrator seems to have taken a fancy to ‘Beta Sans’ by Shiftype.</p>
    <p>I just wanted to find out what you guys made of it, and if you knew any reason why using the face is a terrible idea..and so on…</p>
