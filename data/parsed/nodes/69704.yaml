  html: |-
    <p>I'd like to try to soften a little a typeface I'm working on by making its corners round (like those of ShinnType's <a class="freelinking external" href="http://shinntype.com/Figgins_Scotch.pdf" rel="nofollow">Figgins Sans</a>, for instance).</p>
    <p>The obvious way would be to use FontLab's bold effect: first "bold" it by –X%, then bold it by X% making round corners.</p>
    <p>Two questions –</p>
    <p>First, would you consider the result of such a procedure generally satisfactory? I'm getting the feeling that perfect contours become much less than perfect this way, requiring tedious cleanup, even for relatively small values of X. But maybe I care too much over tiny details that nobody cares about? What would you do?</p>
    <p>Second, if I do it this way, then all resulting arcs have the same radius, regardless of the corner's angle. Is it not preferable that greater angles would be replaced by arcs with greater radii, so all would <em>look</em> softened by the same amount?</p>
