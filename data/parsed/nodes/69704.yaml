    html: |-
      <p><em> But then when you turn back to 1000 upm </em></p>
      <p>You don't have to.<br>
      Many TrueType fonts have an em square of 2048.</p>
      <p><em>What did dictate its precise shape, then, if any? The eye alone?</em></p>
      <p>Yes, but I often paste circles into the mask layer, as in the image above, to use as a reference.<br>
      When eyeballing the shape of curves, I use the "vertical flip" feature of the FontLab metrics window, which gives a different view; working in fonts that have a contrast of stress between vertical and horizontal, often at an angle, can play tricks on one's eyes, so flipping brings back a measure of objectivity.</p>
