    html: <p>I draw all of my outlines in CorelDraw, generally using a stroked centerline method, so it's VERY simple to specific round line caps and round corners. Corners usually don't require any adjustments, but end caps generally do, but correcting the problem is as easy as deleting the center point and re-adding it...if that makes any sense.</p>
