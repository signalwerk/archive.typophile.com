      <p><em>...like those of ShinnType's Figgins Sans...</em></p>
      <p>Sorry, I forget how I did that.<br>
      It wasn't a python script, though, just something in the basic FontLab menu.<br>
      But I can tell you there was a huge amount of clean-up involved.<br>
      A lot of that was because of the "resolution" of 1000 units to the em.<br>
      I would probably have been better to work at a much higher resolution.</p>
      <p>I'm not sure it is possible to avoid manually finessing the details.<br>
      Here is the right terminal of "s" from Figgins, and from AG Rounded.<br>
      In both instances, the shapes do not correspond to a simple "circularization" of corners.<br>
