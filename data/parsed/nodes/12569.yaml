    html: |-
      <p>It is possible but very, very unlikely that a trojan font could exploit a bug in a font renderer and propagate itself that way, but I think you probably got hit by something else. Viruses spreading via fonts would be sufficiently exotic to hit BUGTRAQ or vuln-dev, and I haven't ever seen talk of anything other than the OpenType crasher on Windows to which Mark alludes, and that bug has subsequently been fixed.</p>
      <p>The FNTCache.dat is merely camouflage, and has nothing to do with fonts (necessarily). Font caches are common system files, and using them as a place to store viruses or virus data is just a little bit of social engineering on the virus-writer's part to keep you from noticing they're there. Update your virus definitions and see what your virus checker tells you.</p>
