      <p>I was thinking about where one might go looking for exploitable bugs in type renderers during dinner just now, and I assure you, none of the specific attack vectors I was thinking of were Windows or x86-specific. OpenType is a complicated, new technology that contains a lot of other complicated technologies (like, say, TrueType hinting), and everybody's got about the same level of experience implementing support for it. It's just as likely that Apple's overlooked a few boneheaded programming errors as Microsoft has -- or that the Freetype team on Linux / *BSD have.</p>
      <p>So, in other words, settle down there, buster. Just because the only high-profile OpenType crasher found so far was on Windows doesn't mean that somebody might not find a bug somewhere else next. There's a time and a place for OS-bashing, but in this particular fight, it's those of us who don't want viruses against those who want to give them to us, and other concerns are secondary.</p>
