      <p>One way to check the authenticity of a TrueType font in Windows is to download Microsoft's free <a href="http://download.microsoft.com/download/1/2/3/12366586-4f45-4dba-9ba5-a943c261a3ea/fpeditR.exe" rel="nofollow">Font Properties Editor</a>, which allows you to access a lot more information (several tabs worth) about the font when you right-click the .ttf file and select "Properties." If, indeed, you have a real TrueType font, you will see that information; if it's not really a font, the Properties dialogue box will probably be seriously confused.</p>
      <p>Unfortunately, <a hreaf="http://informationweek.smallbizpipeline.com/security/162600136" target="_blank" rel="nofollow">"get a Mac"</a> is not the ideal solution either.</p>
