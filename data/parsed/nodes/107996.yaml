    html: |-
      <p>The poster applies some pretty extreme distortion, but the base font is undoubtedly French Clarendon, created by William H. Page in 1865. Note the heavy bracketed serifs, which are about 1/4 to 1/3 the height of the letter. Various digital interpretations available, including MPI French Clarendon<br>
      <a href="http://www.myfonts.com/fonts/mpressinteractive/mpi-french-clarendon/" title="http://www.myfonts.com/fonts/mpressinteractive/mpi-french-clarendon/">http://www.myfonts.com/fonts/mpressinteractive/mpi-french-clarendon/</a><br>
      and Clarendon Heavy<br>
      <a href="http://www.myfonts.com/fonts/woodentypefonts/clarendon/" title="http://www.myfonts.com/fonts/woodentypefonts/clarendon/">http://www.myfonts.com/fonts/woodentypefonts/clarendon/</a><br>
      The poster applies some pretty extreme distortion, but the base font is undoubtedly<br>
      Don</p>
