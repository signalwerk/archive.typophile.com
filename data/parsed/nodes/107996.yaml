    html: |-
      <p>I agree Ryuk that Manicotti is probably the most suitable of the lot. It has a relatively open design that would facilitate a radial version. Would be interesting to see how it would look after the transformation.<br>
      Since the poster is hand lettered there would have to be some major adjustments in addition to the radial transformation. Note for example the very extended bottom serif on the lhs of R.<br>
      Don</p>
