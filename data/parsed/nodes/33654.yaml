      <p>Because most hiring is done by people who have better things to do than read form letters, I don’t use a cover letter unless I can find a good reason to write one. Good reasons include:<br>
      - The firm actually asks for one.<br>
      - I know who is getting the cover letter. It is much easier to make a cover letter meaningful if I can relate the text to the reader.<br>
