    date: 2005-05-14T14:06:00
    date_raw: 14 May 2005 — 2:06pm
    votes: null
    html: <p>You've captured that early seventies look pretty well. I think it just need to be tightened up; smooth out the curves so everything flows nicely. There are some spots that need attention such as the upper right serif on the L. I would make the apostrophe longer; give it a more prominent tail. You might try to find some old photo headline type specimen catalogs for reference on how the swashes were done, particularly with Souvenir and Cooper Black.</p>
