      <p>MS Word. But it's not all that fun to wrangle up a decent looking template. In fact it's a bit like wrestling a moose. You just have to trick yourself into believing you won. Ah wait I see a fly in the ointment - to have it not print automatically? That's a problem. </p>
      <p>How about make two templates? One for printing on pre-printed material and the other template for other uses?</p>
