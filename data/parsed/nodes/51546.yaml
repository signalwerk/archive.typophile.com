    <p>Alrighty, I am wondering if there is word-processing software that allow this functionality, and what operating system it runs on.</p>
    <p>Suppose a company has custom stationery.  They simply type up their documents in a word processor and print it on their paper and it's done.  Branding applied!</p>
    <p>But, if they were to try to save their file digitally for an email attachment or a PDF, the file would not have the branding of the letterhead because the page would be blank.</p>
    <p>Is there software besides indesign (I want consumer level word processing software) that has the functionality to have a template with branding that would be visible digitally in that file, or an exported format like PDF, but would be a no-print layer automatically?</p>
