      <p>Patty’s right, Typopo. David was simply giving you the names of some really good manuals which, as Patty says, are worth the investment. You could also try to see if these books are at your local library, if you can’t buy any books right now.</p>
      <p>May I also suggest <em>The Chicago Manual of Style</em>? There is a section on punctuation which covers dashes. But as stated above, there is not always consensus on these matters, so no one manual may have the “right” answer. It is a good idea to check out more than one book.</p>
