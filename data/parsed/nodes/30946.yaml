      <p>Typopo - I don't think you're being fair to David. You're new here and asking a lot of extremely basic questions (which seems epidemic these days) some of which are either repetitive (to us) or - no offense - not very interesting. While most people here are happy to help, you will find the info you need regarding type styles in a book like Bringhurst. It's a worthy investment.</p>
      <p>You will also find - if you read the thread Jason suggested - that there isn't always a lot of consensus in the design community about even such basic matters as em and en dash usage.</p>
