    <p>I only just started using the program , and have run into some trouble with it. I drew a font in Illustrator, and imported each letter as an eps into FontLab, and exported as OpenType. The exported font looks pretty good for the most part, but some of the letter widths appear subtly, but unmistakably, different, and I’m certain that they are all the same in Illustrator. Should I build the font larger, or what? Any ideas on how to solve this problem? </p>
    <p>Thanks, </p>
    <p>Ash</p>
