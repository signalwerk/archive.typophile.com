      <p>Sounds like rounding errors to me. FontLab is based on a unit system that matches typefaces used in production. AI is not limited by such standards  so it is cast on a much finer unit system. The problem comes in the conversion from AI to FontLab. The number of units get rounded down to 1000 causing minor glitches. This is one of the reasons it is not a good idea to begin with AI and convert to FontLab when designing type. Since you already have fairly finished AI drawings, you may not have much of a choice. Know that you must correct all of your drawings after conversion though! AI also does some funny things with points that need correction in type design use. It is truly better to begin your typeface directly in FontLab for best results and faster work.</p>
      <p>ChrisL</p>
