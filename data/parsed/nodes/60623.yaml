    <p>Hi</p>
    <p>Years ago I had a document where Freehand replaced a font with Adobe Sans, and that looked pretty cool. I'd like to re-create that effect now, but I don't know if that would still work – instead of ATM I use FontExplorer X, it also has Adobe Sans installed. Does anyone know how I can get InDesign or Illustrator to replace a certain typeface with Adobe Sans now?</p>
    <p>Thanks!</p>
    <p>I.</p>
