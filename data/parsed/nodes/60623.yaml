    html: <p>If you have FontLab you can generate a specific instance of Adobe Sans - then give it a New Name like Adobe Sans Fat or Thin - then generate and load it as a new font. This works with other MM fonts and everything I have tried to get multi masters installed in current versions of Adobe apps have not worked - such as putting font in app specific font folder, or into app package font folder etc.</p>
