    html: <p>It's quite easy to get Adobe Sans or Adobe Serif to display in Acrobat or Adobe Reader. Just make a PDF where the fonts are neither embedable nor the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Portable_Document_Format#Base_14_fonts" rel="nofollow">base 14</a>.</p>
