    <p>Reding this blog entry about Robert Slimbach's 25 years at Adobe, I stumbled into a reference to Trajan Sans, his most recent design, included in Font Folio 11.1:</p>
    <p><a href="http://blogs.adobe.com/typblography/2012/03/robert-slimbach-25-years.html" title="http://blogs.adobe.com/typblography/2012/03/robert-slimbach-25-years.html" class="link-external">http://blogs.adobe.com/typblography/2012/03/robert-slimbach-25-years.html</a></p>
    <p>The only other online reference I've found is a page in the Adobe Type Library Book:</p>
    <p><a href="http://my.safaribooksonline.com/book/-/9780132964371/t/ch25sec1lev18" title="http://my.safaribooksonline.com/book/-/9780132964371/t/ch25sec1lev18" class="link-external">http://my.safaribooksonline.com/book/-/9780132964371/t/ch25sec1lev18</a></p>
    <p>I'm surprised I didn't notice this before, since a sans derived from the Roman inscriptional capitals is a very interesting feature, and a research that interested some very gifted talents, from Hermann Zapf to Sumner Stone. I wonder if anybody alse has got any other info about Slimbach's late typeface.</p>
