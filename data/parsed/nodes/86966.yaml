  html: |-
    <p>The November edition of the Metal Type newsletter is now out.</p>
    <p>I'm carrying on the trend of old or unusual vehicles at the end of the video. This month it's a Hawker Hurricane fighter plane from World War 2, but there's more to this aircraft than meets the eye. All is revealed at the end of the video.</p>
    <p>Click here to take a look at this month's video:<br>
    <a href="http://j.mp/k5KA95" title="http://j.mp/k5KA95">http://j.mp/k5KA95</a></p>
    <p>On the Forum<br>
    George Finn posted an interesting article entitled "The Tribune's Trials and Tribulations" about the early days of Linotype typesetting at the New York Tribune. Don't forget, you don't have to register to make a comment on the forum now. Click the link below to take a look at George's article:<br>
    <a href="http://www.metaltype.co.uk/rail/clicks/click.php?id=12" title="http://www.metaltype.co.uk/rail/clicks/click.php?id=12">http://www.metaltype.co.uk/rail/clicks/click.php?id=12</a></p>
    <p>All the Best<br>
    Dave Hughes<br>
    York, UK</p>
