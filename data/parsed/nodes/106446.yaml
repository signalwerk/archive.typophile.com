    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ashfont2014_4619.png"></div><p></p>
      <p>I was continuing the development of this font, but I lost the SVG file on which I had laid out its elements. I tried to match the original as best as I could, with some stylistic changes here and there. As for major changes, A M N no longer have stroke modulation, P T Þ now end at the baseline, and the diagonals on K X k v w x are now uniform.</p>
