    html: <p>I'm with you Ralph . . . Funny thing is, I spent about 20 minutes mocking up the box from a Freehand MX box. I could have spent longer trying to get all the details worked out but I figured it was convincing enough to create a 'shadow of doubt' . . . <br> <br>I'm not sure if you were in San Francisco for Typecon to listen to Ed Benguat's SoTA award acceptance speech, but it is reflected in this thread. Ed had a great bit about how it's impossible for a type enthusiast/designer to read a newspaper and proceeded to pantomime how a quick glance at a folded newspaper turns into pulling it closer, closer, taking off the glasses, closer again till your nose is almost touching the thing . . . It's funny because it's true and I expect nothing less from my peers :D</p>
