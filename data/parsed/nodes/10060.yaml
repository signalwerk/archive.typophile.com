    html: <p>Thanks Joe! BTW, I figured out how to forge an ordinal in a document using Microsoft Word if anybody wants the 411! - Please nobody respond to that :D <br> <br>Regarding menus Jay I had the opportunity to work on a menu once and it can be an organizational nightmare. The biggest challenge being restaurants change menu items so quickly to keep 'ahead' of the competiton and keep the regulars interested . . . <br> <br>I'm also convinced menus serve as more of a branding piece than for function at some places . . . Counterpoint to that, I've said it before, I'll say it again, there is an entire industry in Chinese menus which I am repulsed and strangely attracted to simultaniously . . . Also, they are among the easiest to read considering the array of options . . . <br> <br>:D</p>
