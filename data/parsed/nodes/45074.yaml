    <p>Monotype Imaging Inc. (Nasdaq: TYPE), a leading global provider of text imaging solutions, just announced that Garmin International Inc., a unit of Garmin Ltd. (Nasdaq: GRMN) and the global leader in satellite navigation, has licensed the iType® font engine from Monotype Imaging to display scalable, high-quality text on a range of Garmin® nüvi® automotive navigation devices.</p>
    <p>John Seguin, executive vice president of Monotype Imaging, noted that "As a company focused on creating navigation and communication devices that enrich customers’ lives, Garmin is able to realize key benefits that are passed on to consumers through our font scaling technology. We’ve tailored our iType font engine to enable memory-constrained, consumer electronics devices to display clear, aesthetically pleasing text that can be scaled to any size. Other key iType capabilities include fast rendering speed, small code size, and the ability to apply special effects, such as displaying text outlined in different colors. This enables text to stand out from detailed or colorful backgrounds, such as maps. As devices become more interactive throughout the world, we believe that fonts will take on an even more important role.”</p>
    <p>Steve Martin, vice president of engineering at Monotype Imaging, also stated that "The iType font engine is simply a good fit. Garmin is able to count on iType technology to render sharp, legible text across a wide range of screen sizes. Garmin is also able to reduce the font memory footprint of their devices, which means that more memory can become available for speeding the delivery of other on-screen features and services.” </p>
    <p>About the iType font engine</p>
    <p>Monotype Imaging’s iType scalable font engine, based on the OpenType® and TrueType® font formats, allows OEMs and developers to build products that clearly display characters regardless of screen resolution or display size. In addition to fonts optimized for consumer electronics devices and innovations such as Monotype Imaging’s patent-pending SmartHint™ technology, which enables the clear display of East Asian text, the iType font engine supports Monotype Imaging’s stroke-based fonts, multilingual TrueType fonts, custom typefaces, bitmaps, embedded bitmaps, font subsets and linked fonts.</p>
    <p>The iType font engine removes dependency on bitmap fonts, which are fixed in size. While bitmap fonts require individual sets for each type size and style supported by the device, the iType font engine requires just one scalable font for each style to cover all sizes. By removing the burden of storing multiple bitmaps, device manufacturers and developers are able to reduce memory usage on fonts. </p>
    <p>For a firsthand look at the capabilities of the iType scalable font engine, try Monotype Imaging's Font Technology Demo please visit <a href="http://demo.monotypeimaging.com/itypewtle.aspx" title="http://demo.monotypeimaging.com/itypewtle.aspx">http://demo.monotypeimaging.com/itypewtle.aspx</a>. </p>
    <p>About Monotype Imaging<br>
    Monotype Imaging is a global provider of text imaging solutions for manufacturers and developers of consumer electronics devices including laser printers, copiers, mobile phones, digital televisions, set-top boxes, digital cameras and software applications and operating systems. The company also provides printer drivers and color imaging technologies to OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 10,000 typefaces from the Monotype®, Linotype® and ITC® typeface libraries – home to some of the world’s most widely used designs, including the Times New Roman®, Helvetica®and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative and business professionals through custom font design services, direct sales or e-commerce portals. Monotype Imaging offers fonts and industry-standard solutions that support all of the world’s major languages. The company is based in Woburn, Mass., with regional offices in the U.K., Germany (Linotype), Mt. Prospect, Ill., Redwood City, Calif., Boulder, Colo., Japan and China. Information about Monotype Imaging and its products can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>, <a href="http://www.fonts.com" title="www.fonts.com">www.fonts.com</a>, <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a>, <a href="http://www.monotypefonts.com" title="www.monotypefonts.com">www.monotypefonts.com</a>, <a href="http://www.customfonts.com" title="www.customfonts.com">www.customfonts.com</a>, <a href="http://www.fontwise.com" title="www.fontwise.com">www.fontwise.com</a>, <a href="http://www.itcfonts.com" title="www.itcfonts.com">www.itcfonts.com</a>, <a href="http://www.fonts.hk" title="www.fonts.hk">www.fonts.hk</a> and <a href="http://www.faces.co.uk" title="www.faces.co.uk">www.faces.co.uk</a>.</p>
