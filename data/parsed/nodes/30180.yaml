    <p>GO is a series of cultural events presented in themes on a bi-monthly basis.<br>
    "Look East" was the last series, and included events like sushi tasting, Ikebana/Bonsai displays, and sudoku competitions. Future themes are based on time, mystery, and family.</p>
    <p>I am the lone designer, so any feedback that would strengthen the mark I would appreciate.</p>
    <p>Thanks.</p>
    <p>Andrew</p>
