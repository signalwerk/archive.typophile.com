    <p>Hi!</p>
    <p>I need to find fonts that a similar to this script font. This one is probably a custom designed logotype, but it doesn't have to be exactly like this. Just something which is tasting a little "vintage, 50s and pin-up".</p>
    <p>Probably a weird description — but any suggestions are welcome!</p>
    <p>Thanks</p>
