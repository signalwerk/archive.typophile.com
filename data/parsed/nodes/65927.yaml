  - id: 387723
    user: 8664
    date: 2010-01-07T07:54:00
    date_raw: 7 Jan 2010 — 7:54am
    votes: null
    html: <p>Hello Bill. All the tools mentioned above are meant to adjust one (or more) curve segment(s) between static points and one (or more) point(s) repositioned by the designer -- intermediate (off/on-curve) points are adjusted relative to the repositioning of the repositioned point(s). RMX Tools and UFO Stretch in turn need at least two masters, and with a combination of interpolation and scaling inbetween these, they reduce/enlarge, condense/expand, lighten/bolden entire letters.</p>
