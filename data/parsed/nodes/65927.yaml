    html: |-
      <p>FLS5's <em>Interpolate Nodes</em> is good for detailed adjustments when a couple of nodes should be moved individually. (Unfortunately, there is a nasty bug in Mac FLS5 which makes it impossible to do correct numerical adjustments.)<br>
      But for many things this is over the top, and I simply want to select a few nodes that should stay where they are and then select some other nodes and move them simultaneously. This is why I built the <em>Transformer</em> interface around FLS5's <em>Interpolate Nodes</em>.<br>
      Interpolate Nudge in turn (and either the interface version this thread is about or Andreas Eigendorf's Tool version) is useful for editing curves which consist of, say, top and bottom extrema, with a left or right extremum to be moved, and no intermediate on-curve nodes between these extrema.<br>
      Each tool serves specific needs (a specific user or specific type of curves) and there is no one-fits-all.</p>
