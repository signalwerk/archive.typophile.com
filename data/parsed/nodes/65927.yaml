    html: |-
      <p><cite>-I never thought the Interpolate Nodes tool was that difficult to use in FL.</cite></p>
      <p>me neither ...</p>
      <p><cite>-I tried your nudge tool and found it lacking. I guess its just me.</cite></p>
      <p>No problem James, this tool works for me, but is not for everyone :)</p>
      <p>I will try to explain how I use it (but my English is limited ):</p>
      <p>If you only do "one" movement with the node, and a fixed distance, is faster a shortcut* of original Interpolate Nudge (for example: Alt + Shift + 6 = NudgeRight10).<br>
      *FL only allow 10 macros shortcuts.</p>
      <p>I usually do more than one movement with a node (and with different distances), in this case, my little tool is faster: I can change the distance on the moment and press the button (in any direction) and change again for fine tuning and so on...<br>
      I gain more control, and in the last term, velocity in complex movements.</p>
      <p>I use a shortcut for quick access to the tool, the focus is in the text field so you can change directly the number, you can also change easily the default value(10) of script by another...</p>
      <p>I would like that something similar (or better, maybe a window that allow change the selected nodes, MM compatible, etc) comes built-in in new versions of FL...</p>
      <p>Regards and thanks to all for the comments...</p>
      <p>em.</p>
