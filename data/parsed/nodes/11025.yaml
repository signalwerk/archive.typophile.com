    html: <p>There are some nice things happening in this design. <br> <br>I don't have a problem with the g, but I'd be a little concerned about the space between the bowls closing up at small sizes. <br> <br>At first the f struck me as too unusual for an otherwise conservative face, but I don't find that it draws too much attention to itself in text. Try living with it a bit longer, but give some thought to an alternative, less radical form. <br> <br>I don't mind the top part of the y, and think it is a good idea to try something other than the diagonal version. However, the bottom part looks truncated and also adds to the impression that the top part is too wide (it may, in fact, be a tad too wide compared to the h, n, etc.). Is there a way to extend the descending curve to the left, without getting into the kind of closed-up shaped of the Helvetica g? <br> <br>Regarding the sequence of i and l, you could try having very slightly wider sidebearings on the i. You can also try making the ascending stems slightly lighter than those that terminate at the x-height; because of their length, they will tend to look denser than the shorter strokes. I have not printed your PDF, so I am taking your word for it that the sequence <i>illi</i> looks dark.</p>
    html_clean: <p>There are some nice things happening in this design. <br> <br>I don't have a problem with the g, but I'd be a little concerned about the space between the bowls closing up at small sizes. <br> <br>At first the f struck me as too unusual for an otherwise conservative face, but I don't find that it draws too much attention to itself in text. Try living with it a bit longer, but give some thought to an alternative, less radical form. <br> <br>I don't mind the top part of the y, and think it is a good idea to try something other than the diagonal version. However, the bottom part looks truncated and also adds to the impression that the top part is too wide (it may, in fact, be a tad too wide compared to the h, n, etc.). Is there a way to extend the descending curve to the left, without getting into the kind of closed-up shaped of the Helvetica g? <br> <br>Regarding the sequence of i and l, you could try having very slightly wider sidebearings on the i. You can also try making the ascending stems slightly lighter than those that terminate at the x-height; because of their length, they will tend to look denser than the shorter strokes. I have not printed your PDF, so I am taking your word for it that the sequence <i>illi</i> looks dark.</p>
