    html: "<p>&gt; large and in charge <br> <br>That sounds nice. <br> <br>&gt; recalling the time before readability trumped character. <br> <br>Legibility. Readability actually benefits from a smaller [than average] x-height. <br> <br>&gt; The intersections of lines are heavy, trapping be damned <br> <br>Actually, that's \"optical compensation\" (in my book) - trapping is [mostly] to fight gain. But anyway, this is an approach that might have hidden functionality (as well as easthetic appeal to some), since information comes from contrast. <br> <br>&gt; I'm also unsure of the right balance between spacing wide for caption sizes and narrow for display sizes. <br> <br>That's related to the <i>intent</i> of the face, which ties in to things like color, width, x-height etc. In this case I would say this is a texty font - and the spacing is <i>slightly</i> too loose ovreall (and inconsistent in places, like the right of the \"r\", and elsewhere). <br> <br>BTW, your vertical proportions are right on. <br> <br>And the caps are solid - congrats. <br> <br>&gt; the g <br> <br>It's out of place because it's too humanist. Give it some edge - and maybe an open bottom bowl. <br> <br>The \"f\" is fine! I think the \"j\" could be more humanist. I like the \"y\" too. <br> <br>Overall, I think you're meeting your objective, and producing an interesting voice: at once retro and futuristic, plus a nice balance between rationality and charm. <br> <br>hhp <br></p>"
