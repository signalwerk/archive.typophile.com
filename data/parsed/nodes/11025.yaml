  html: "<p><b>Background</b>   <br>   <br>Gematria is something of a mix between a grotesque and a humanist sans.   <br>I wanted a sans serif less funky than Helvetica, but with more character   <br>than the recent super generic sans like Myriad. It's also a reaction   <br>against the trend towards increasing x-height and counter-sizes. The   <br>ascenders and descenders are large and in charge, close to the elegant   <br>proportions of Futura. The counters are dimished, recalling the time   <br>before readability trumped character. The intersections of lines are   <br>heavy, trapping be damned, increasing contrast not only between but   <br>within glyphs.   <br>   <br><b>Status</b>   <br>   <br>I've just wrapped up the basic upper case. I'm mostly satisfied with the   <br>structure of all the characters. Work still remains to weight some   <br>characters properly (see: g, all the triangular upper case). Spacing is   <br>messy. Right now it's probably too closely set, but this is my fifth   <br>complete iteration on the lower case metrics. I'm having a tough time   <br>finding the right looseness to make it easy to pick out words quickly (I   <br>haven't lost all sight of readability) while maintaining a pleasant page   <br>texture. I'm also unsure of the right balance between spacing wide for   <br>caption sizes and narrow for display sizes. Opentype to the rescue?   <br>   <br><b>Specific Concerns</b>   <br>   <br>How can I make the g fit in more? It feels out of sorts. If I make the   <br>strokes thicker, it fits in a bit better but feels very clotted.   <br>   <br>I was much more confident in the f when I first started this design.   <br>Should I ditch it?   <br>   <br>Is there a standard solution to the too many vertical strokes problem in   <br>words like 'million'? The sequence illi feels very dark compared to the   <br>rest of the page.   <br>   <br>What do ya'll think of the y? The triangular characters have always   <br>bugged me and y seems like a triangular shape that doesn't have to be   <br>so.   <br>   <br><b>Phantom Modulation</b> - <a href=\"http://www.typophile.com/cgibin/show.pl?4100/8716\">see thread</a>   <br>   <br>I ended up compensating for this effect and the results are much more   <br>pleasing. I'd been building the less geometrical characters (a, h, n, m,   <br>s, t, r, u, y) with the compensation automatically since I had to   <br>eyeball the strokes to make sure they felt balanced. When I compensated   <br>in the more symmetrical structured characters, they felt more in tune   <br>with the rest of the set.   <br>   <br>I found it better in my case to leave the counters of characters (b, c,   <br>d, e, g, o, p, q) perfectly symmetrical with no slant and to instead   <br>compensate for the phantom modulation with their outer path. This helped   <br>me avoid too much humanist feel from creeping into the design and made   <br>the characters feel like they stand mostly upright.   <br>   <br><a href=\"http://www.xtypa.com/ext/typophile/gematriafirstsample.pdf\">Download the PDF</a></p>"
  html_clean: "<p><b>Background</b>   <br>   <br>Gematria is something of a mix between a grotesque and a humanist sans.   <br>I wanted a sans serif less funky than Helvetica, but with more character   <br>than the recent super generic sans like Myriad. It's also a reaction   <br>against the trend towards increasing x-height and counter-sizes. The   <br>ascenders and descenders are large and in charge, close to the elegant   <br>proportions of Futura. The counters are dimished, recalling the time   <br>before readability trumped character. The intersections of lines are   <br>heavy, trapping be damned, increasing contrast not only between but   <br>within glyphs.   <br>   <br><b>Status</b>   <br>   <br>I've just wrapped up the basic upper case. I'm mostly satisfied with the   <br>structure of all the characters. Work still remains to weight some   <br>characters properly (see: g, all the triangular upper case). Spacing is   <br>messy. Right now it's probably too closely set, but this is my fifth   <br>complete iteration on the lower case metrics. I'm having a tough time   <br>finding the right looseness to make it easy to pick out words quickly (I   <br>haven't lost all sight of readability) while maintaining a pleasant page   <br>texture. I'm also unsure of the right balance between spacing wide for   <br>caption sizes and narrow for display sizes. Opentype to the rescue?   <br>   <br><b>Specific Concerns</b>   <br>   <br>How can I make the g fit in more? It feels out of sorts. If I make the   <br>strokes thicker, it fits in a bit better but feels very clotted.   <br>   <br>I was much more confident in the f when I first started this design.   <br>Should I ditch it?   <br>   <br>Is there a standard solution to the too many vertical strokes problem in   <br>words like 'million'? The sequence illi feels very dark compared to the   <br>rest of the page.   <br>   <br>What do ya'll think of the y? The triangular characters have always   <br>bugged me and y seems like a triangular shape that doesn't have to be   <br>so.   <br>   <br><b>Phantom Modulation</b> - <a href=\"http://www.typophile.com/cgibin/show.pl?4100/8716\" class=\"link-lost\">see thread</a>   <br>   <br>I ended up compensating for this effect and the results are much more   <br>pleasing. I'd been building the less geometrical characters (a, h, n, m,   <br>s, t, r, u, y) with the compensation automatically since I had to   <br>eyeball the strokes to make sure they felt balanced. When I compensated   <br>in the more symmetrical structured characters, they felt more in tune   <br>with the rest of the set.   <br>   <br>I found it better in my case to leave the counters of characters (b, c,   <br>d, e, g, o, p, q) perfectly symmetrical with no slant and to instead   <br>compensate for the phantom modulation with their outer path. This helped   <br>me avoid too much humanist feel from creeping into the design and made   <br>the characters feel like they stand mostly upright.   <br>   <br><a href=\"http://www.xtypa.com/ext/typophile/gematriafirstsample.pdf\" class=\"link-external\">Download the PDF</a></p>"
