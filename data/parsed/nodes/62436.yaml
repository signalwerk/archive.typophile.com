      <p>Hi Glen,<br>
      Sounds interesting. The "collaborative" part is tricky. Maybe a semiserif? Something with open forms, preferably?<br>
      For the record, Myriad doesn't strike me as "fast moving" at all, more as friendly, clean and comfy. And not as "halfway between sans and serif" either (that's where a semiserif would be, or maybe a flared/stressed sans if you like that stuff).</p>
      <p>Maybe this is too much to ask, but could you maybe post a snap of the layout as it stands now? I'm having trouble visualizing the two fonts and what kind of jobs they need to do (text length, sizes, arrangement).</p>
