    <p>Hi,</p>
    <p>My first request is for a family that can be used in whole paragraphs, and which conveys qualities of: fast moving, collaborative, trustworthy.</p>
    <p>I'm currently using Myriad Semibold. My first reason is that its half way between a sans and a serif, which might come across as being collaborative. Secondly, its not heavy enough to convey slowness.</p>
    <p>My second request is for a complimentary serif font that can make short work of a long boring block of text. For this job, I am currently using Lucida Fax.</p>
    <p>Please advise, and thank you so much! :)</p>
