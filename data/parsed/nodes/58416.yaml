      <p>I did a test using a generic computer font and the way it works is that once they have processed the font, it gives you a 2 javascript files, one for the action itself and another with the font specifics. It also gives you back the image. So you'd upload all three to your personal server and run it from there.</p>
      <p>And yeah, I would question the kerning too. It seems like they figured some way to do basic kerning (it is applying different margins depending on the letter), but I doubt it has the functionality to deal with kerning pairs or such.</p>
