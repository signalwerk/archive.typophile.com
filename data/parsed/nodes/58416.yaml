      <p>Now, isn't that an interesting bit of javascript.</p>
      <p>Essentially it converts a font file into a large gif and a single size with a font color and background and then uses javascript to place the letters with (hopefully) proper kerning. While it doesn't have near the functionality of sIFR, cufon or any of those other methods (in fact, it is pretty limited in terms of usage), it does provide a method of putting a custom font online without making it easily available for someone to steal. </p>
      <p>It may not fly given that you are, in essence, decompiling the font and reassembling it in a new form (I think a number of EULAs ban that sort of behaviour), but other than that, it does seem to address security issues. The only flaw is the limited usage. </p>
      <p>Now, if they made it output PNG-24 instead of gif, then it would be more handy, even if it loses some applicability in IE6.</p>
