  html: <p>i'm having a devil of a job getting 'non-keyboard'characters such as ligatures, em dashes etc into illustrator, &amp; was wondering if anyone could help me. <br> <br>i've tried pasting/drag-dropping from Character Map, and the alt+# method without any success. when i paste the character directly from another app, illustrator rather unhelpfully displays an '?'.  <br> <br>i'm running illustrator 9 on a PC. any suggestions welcome. <br> <br>thanks, geraint</p>
