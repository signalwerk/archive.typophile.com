    html: <p>If illustrator is giving you a question mark for special characters it means those characters are out of the first 256 glyph range and are unicode.  Illustrator doesn't understand unicode yet.  Though as someone said, if you have InDesign you can take it in there and create outlines.  InDesign is fully unicode aware. <br> <br>One thing though, I know the ligatures are out of the 256 glyph range on normal fonts, but em dashes are alt+0151, they should work fine.   <br> <br>Also, you can try doing Smart Punctuation and seeing if Illustrator will change it for you.  It's under the type menu.</p>
    html_clean: <p>If illustrator is giving you a question mark for special characters it means those characters are out of the first 256 glyph range and are unicode.  Illustrator doesn't understand unicode yet.  Though as someone said, if you have InDesign you can take it in there and create outlines.  InDesign is fully unicode aware. <br> <br>One thing though, I know the ligatures are out of the 256 glyph range on normal fonts, but em dashes are alt+0151, they should work fine.   <br> <br>Also, you can try doing Smart Punctuation and seeing if Illustrator will change it for you.  It's under the type menu.</p>
