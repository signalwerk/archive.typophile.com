      <p><em>Actually hearing is much more complex than a microphone can pick up.<br>
      There’s a phenomenon called binaural hearing where the outer ear -which<br>
      is of a telling complexity- plays a very large role.</em></p>
      <p>Binaural hearing is the auditory processing that compares what each ear hears; it helps us to work out direction and distance of auditory signals. Binaural sound recording, using two or more microphones, has been around since the late 19th century, when it was first used in the telephone broadcast of live opera performances. Later there were expriments with binaural radio broadcasts on dual frequencies, which didn't catch on because it required listeners to have two radios, each connected to a separate earphone. Since the development of stereo, however, binaural recording techniques have advanced significantly. Binaural reproduction requires the listener to use headphones, because it utilises the natural crossfeed of the head: the recording technique mimics binaural hearing, so can only be properly appreciated when played back directly to the individual ears.</p>
      <p>Sonic shaping of the ear, i.e. the reaction and adapdation of the muscles of the ear to sound -- presumably the aspect of binaural hearing to which Hrant refers --, is important when we're picking up sound signals from our environment, but when we're listening to binaural recordings, through headphones, we're being directly fed the information that we normally have to use the muscles in the ear to help us direct. Indeed, the headphones probably actively inhibit sonic shaping, which is applied in the recording process rather than in the listening process.</p>
      <p>The difficulty of on-the-fly, direct to brain signals from microphones, if one were to use a binaural recording model, would be getting the mix right, i.e. accurately matching the microphone-to-brain signal to the direction and distance of the external sound signal.</p>
