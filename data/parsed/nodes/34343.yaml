      <p>Ah, but I don't drive :)</p>
      <p>Actually, when you suggested that I should try looking away from something to better see movement, the first thing I noticed is just how still everything around me is. The movement of the fronds on the tips of the cedar branches is so subtle and gentle, you actually have to be staring straight at it to see it at all.</p>
      <p>Shifting or dumping the rods to the left and right of the fovea would certainly be bad for many human activities. This is why the new eyes should be adjustable, or else there should be separate eyes for different tasks. People with vision problems have different kinds of glasses for different purposes, so it isn't difficult to imagine different kinds of artificial eyes, or eyes that adapt to particular tasks in the way that polarising glasses adapt to different light levels.* We would expect such a technology to correct vision impairment -- and won't that be a welcome end to the large-print edition! -- but why not also provide task-specific vision enhancement. You could also have driving eyes to go with your natty driving gloves, with extra rods to detect movement even faster.</p>
      <p>* Speaking of polarising, here's another thing I learned today: 'Dung beetles can perceive the polarisation of moonlight'. That's incredibly cool; even cooler than redesigning eyeballs.</p>
