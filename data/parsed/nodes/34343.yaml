      <p>&gt; No more of those pesky scripts or messy differences in type styles</p>
      <p>No, you'd just have a separate set of wires for that.  :-)</p>
      <p>&gt; cognographer</p>
      <p>:-&gt;</p>
      <p>&gt; it utilises the natural crossfeed of the head</p>
      <p>And mimicks the multi-dimensional filtering of the outer ear's cartilege.</p>
      <p>My point was that Kevin's "microphone near the ear" is over-simple.</p>
      <p>Some people look at the outer ear and think: "Whatever, there's no Formal Proof that it's shaped funny for a reason, so I'll pretend it doesn't matter." Other people think: "Hmmm, I really need to worry about why the outer ear is shaped so funny!" The best scientist is also an exceptional anecdotalist.</p>
      <p>&gt; The difficulty of on-the-fly, direct to brain signals from microphones ...</p>
      <p>No, you just place the microphone inside the ear, like you mentioned people have been doing already. Now, if the outer ear is missing, then you need a complex algorithm* to filter the incoming sounds as the natural ear would. In fact a big issue is that processing binaural sound is computationally intensive; at least when I was reading about it (some years ago, in a book about cutting-edge multimedia design) it wasn't possible to make the hardware both affordable and comfortable.</p>
      <p>* Although not nearly as complex as its counterpart in perception...</p>
      <p>hhp</p>
