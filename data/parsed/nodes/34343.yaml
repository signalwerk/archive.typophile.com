      <p>I believe the ganglion cells in the retina are the first cells that detect motion. In the fovea there can be as high as a 1:1 ratio between cones and ganglion cells, but the ratio goes down further from the retina. In the periphery the ratio between rods and ganglion cells are as high as 1000:1. </p>
      <p>Under normal daylight conditions we only use the cones for vision, as there is too much light for the rods to be effective. In low light conditions we use our rods for vision. It is difficult to read in low light because there are no rods in the fovea. The ganglion cells detect motion with data from the rods or cones.</p>
