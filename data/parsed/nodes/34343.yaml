      <p>There is an article in the April issue of <em>Scientific American</em> by neuroscientist Frank Werblin about recent discoveries about how the retina operates. It's a much more complex process than we have thought. The retina actually begins processing information rather than merely passing it on, and that it breaks visual information down into several different kinds of "tracks" that are sent to the brain separately by different sets of neurons. The process actually sends a series of abstracted images to the brain which get assembled in different ways depending upon the part of the brain involved. </p>
      <p>George<br>
      I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
