      <p>It’s just a matter of time before this comes to pass. For deafness caused by the cochlea, it’s possible to place a microphone near the ear and feed the results directly into the brain.<br>
      <a href="http://www.cochlearamericas.com/Products/11.asp" title="http://www.cochlearamericas.com/Products/11.asp">http://www.cochlearamericas.com/Products/11.asp</a></p>
      <p>There’s no reason that we won’t be able to do the same thing to bypass retinal problems, such as retinal tears. It would just take a camera and an understanding of what information needs to be fed to each neuron. This is only more complicated because there are many more neurons involved than with hearing.</p>
      <p>If we’re able to use a microphone to replace the initial step of hearing and a camera to replace the initial step of vision, then there’s all kinds of possibilities to make modifications. For example, it’s possible today with the cochlear implants to change the range of hearing. The normal range of perfect hearing is 20hz to 20,000 hz. But what would happen if the inputs were changed to 0 to 50hz? Would the wearer be able to listed to seismic activity?</p>
