    html: |-
      <p>Lots of ways, and different ways for different font formats, for different programming languages/environments/font editors, and different levels of expertise.</p>
      <p>One such way would be to open an associated .afm file with a plain text editor, find the string "Ascender", and divide the number right after it by 10 to get a value as a percentage. Will of course only work for Type 1 fonts, but on the plus side, it's so easy anyone can do it.</p>
