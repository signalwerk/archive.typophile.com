    html: |-
      <p>inktrap: InDesign lets you choose the top offset for a text frame. See "First baseline offset options" on <a class="freelinking external" href="http://help.adobe.com/en_US/indesign/cs/using/WSa285fff53dea4f8617383751001ea8cb3f-6fb2a.html" rel="nofollow">the online Help</a>.</p>
      <p>For this to work, you cannot use a document-wide baseline grid (unless you "manually" set its starting position). Since the position of your first line is going to depend on the ascenders in the first line <em>of your current text frame</em>, they may differ from frame to frame; and hence, the position of the baseline grid, which starts at the bottom of that same first line.</p>
      <p>Store these settings in an Object style, so you can apply it to every frame where you need it.</p>
