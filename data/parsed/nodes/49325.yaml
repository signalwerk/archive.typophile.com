  html: |-
    <p>Hi Everyone -<br>
    i am new to typophile and i hope you can give me some suggestions.<br>
    I am searching for some Sans Serif Families which can be an Alternate to Helvetica.<br>
    They should have a thin or ultra/extralight/light version too.<br>
    Teh typeface should not look very humanistic - instead more straight! I already consider for example Akkurat/FF Din as Alternates, but i am not very satisfied.</p>
    <p>Would be thankful for every suggestion!<br>
    Best, Adam</p>
