    <p>I did release Van den Velde Script, my new calligraphic (more or less) font. The work was hard, but more easy than Penabico, because some things which I learn when build Penabico. </p>
    <p>The font is here</p>
    <p><a href="http://new.myfonts.com/fonts/intellecta/van-den-velde-script/" title="http://new.myfonts.com/fonts/intellecta/van-den-velde-script/">http://new.myfonts.com/fonts/intellecta/van-den-velde-script/</a></p>
    <p>However, I appreciate critics, which will be used to increase the font, with possible updates.</p>
    <p>all the best for all</p>
    <p>Paulo W<br>
    Intellecta Design</p>
