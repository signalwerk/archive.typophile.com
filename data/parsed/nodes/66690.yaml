  html: |-
    <p>I am doing research on silhouette portraiture and I am interested in finding any and all information on typefaces that may have been used in, or are inspired by typefaces used in America in the mid 19th Century. Typefaces that may have been used in conjunction with silhouette portraits or as stamped artists logos or signatures would be great too! </p>
    <p>If you don't know what I mean by silhouette portraits this may jog your memory: </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/jennys_5163.jpg"></div><p></p>
    <p>Thank you!</p>
