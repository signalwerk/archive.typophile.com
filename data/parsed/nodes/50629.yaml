    html: |-
      <p>I printed <a class="freelinking external" href="http://vllg.com/Underware/Dolly/mudTyper+Weights/" rel="nofollow">Dolly</a> out just today at 6pt.  The whole typeface has a nice dark complexion to it so you can read the characters well even at small sizes, nice and crisp, whereas so many other typefaces start looking brittle and weak around this point range.  (I was surprised to see how sad the mighty Adobe Garamond Pro looks at 6pt.)</p>
      <p>Dolly also looks great in a lot of other settings so it's worth licensing it as a workhorse in your personal collection.</p>
      <p>All the best,<br>
      Rahim</p>
