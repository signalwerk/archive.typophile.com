    <p>Hi me new to this scene and still finding out answers about what's right or wrong in using fonts in my designs.  Here is some of my questions:</p>
    <p>1.) When a font author digitizes a font they really like from a fantasy book and they licenses it to Internet users.  And I want to use the font for COMMERCIAL use, is it enough that I only deal with the "digital-font-author" or do I go directly to the "printed-book-font-author"??  Or need I contact them both before commercial use could be deployed?</p>
