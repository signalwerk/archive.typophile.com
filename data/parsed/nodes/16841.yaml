    html: <p>As long as the lettering is <strong>not</strong> a logotype (protectable by copyright) but simply lettering (not protectable by copyright), then you should only have to deal with the creator of the electronic version (aka, the font).</p>
    html_clean: <p>As long as the lettering is <strong>not</strong> a logotype (protectable by copyright) but simply lettering (not protectable by copyright), then you should only have to deal with the creator of the electronic version (aka, the font).</p>
  - id: 100760
    user: 1049
    date: 2005-12-19T08:45:00
    date_raw: 19 Dec 2005 — 8:45am
    votes: null
    html: |-
      <p>I'd agree with oldnick, but you'd have to trust that the person offering the font actually drew it from scratch, and didn't just open up an existing commercial version and re-name it. </p>
      <p>Also think there are benefits in doing some research and trying to find a more original/professional version of the font if it exists. It will likely be better drawn and have better spacing than a re-digitization based on printed samples.</p>
