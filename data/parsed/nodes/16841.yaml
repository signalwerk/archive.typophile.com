      <p>I must say that I read Biffy's post, and was about to write a reply, then read the post again a couple of times and was left in a state of confusion.</p>
      <p>Biffy, can you please be very clear about your situation: Where does this font come from? Is it already digitised? Is it commercially available? Is it freeware or shareware?</p>
