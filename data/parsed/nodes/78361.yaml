  html: |-
    <p>Hi, I am a relatively new designer given the monstrous task of creating branding guidelines for my company. We're very much stuck with Proxima Nova as our main font (it is used in Logo specifically). Which I don't mind - but I need help pairing a complementary serif font - specifically for use as a body copy (such as paragraphs in employee handbooks, press releases - printed materials).</p>
    <p>Any suggestions? (examples would be nice too)</p>
