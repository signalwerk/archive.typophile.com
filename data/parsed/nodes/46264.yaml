      <p>A web service for commercial fonts would be great. I am also trying to promote that idea:<br>
      <a href="http://opentype.info/blog/2008/04/19/font-face-survey-results/" title="http://opentype.info/blog/2008/04/19/font-face-survey-results/">http://opentype.info/blog/2008/04/19/font-face-survey-results/</a></p>
      <p>But a web service for “open-licensed” fonts doesn’t make sense to me. Why should I rely on a service when I can put the font on my server instead? The Google hosting of code libraries is a different thing because such libraries change all the time and it’s a nice service that you could just link to the library and Google cares about the updates. But fonts are rarely updated.</p>
