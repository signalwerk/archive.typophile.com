      <p>@font-face declarations <em>can be</em> as simple as linking an image on a website, if the font resource is on the same server as the html/css files. If it’s on another server the call will involve <a href="http://website.com/yada-yada/yoda.otf" title="http://website.com/yada-yada/yoda.otf">http://website.com/yada-yada/yoda.otf</a>.</p>
      <p>If a central repository of “open licensed” fonts existed, broswers could in theory be made to look in the repository by default if the font called doesn’t exist in the same directory on the same server as the html/css.</p>
      <p>The increase in simplicity may be small, but in the world of web development many small gains add up.</p>
      <p>j a m e s</p>
