      <p>Here’s a thought. What if we just consider the union of all the current free font sites out there* “the font service”? At that point the service is simply an mediator. Create an index of the fonts available and their source URLs, and grab the file from the server when it isn’t available locally. This seems like a pretty straightforward piece of code.</p>
      <p>BTW, thanks to all for having this discussion with me. It’s been helpful in thinking about how to approach the design of the system. Now I just need to find a developer...</p>
      <p>* dafont.com, 1001freefonts.com, urbanfonts.com, simplythebest.net/fonts, fontgarden.com, fontsugar.com, larabiefonts.com &amp;c.</p>
