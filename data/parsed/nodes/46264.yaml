      <p>As far as I can make out you’re proposing a central repository for “open-licensed” fonts designed to be used on webpages. That’s the main thing, and I don’t think it will make much difference how this repository is accessed by user agents—as long as user agents support @font-face, the font resources could be centralized or scattered at numerous locations.</p>
      <p>It’s an appealing idea, but you can probably improve web typography faster by spurring Microsoft, Mozilla and Opera to make their browsers support @font-face. Håkon Wium Lie, the guy who developed CSS and @font-face, works for Opera, so I assume the next version of that user agent will support @font-face.</p>
      <p>The other major factor in all this is support from font makers. I’ve just released a font explicittly licensed for “embedding” on webpages using the CSS @font-face rule and unlimited distribution on web servers. You can read more about it here: <a href="http://typophile.com/node/46088" title="http://typophile.com/node/46088">http://typophile.com/node/46088</a></p>
      <p>j a m e s</p>
