      <p>@Ralf Herrmann: In my system, fonts are simply referenced in the font-family CSS declaration as today. The system would then fetch any reference fonts from the server if they are not present on the local computer.</p>
      <p>@James Arboghast: Having a central server makes it trivial to ensure commercial fonts are not present. If for any reason they do appear, requests (or in the extreme DMCA takedown notices) are all that would be needed to rectify the situation. And again, if this turned out to be a popular system, it could be extended to include DRMed font files to enforce commercial licenses.</p>
      <p>Of course if it gets popular, the costs of running the service could become pretty large. Which is why I think Google should do it, just like they’re doing for popular javascript libraries.<br>
      <a href="http://code.google.com/apis/ajaxlibs/" title="http://code.google.com/apis/ajaxlibs/">http://code.google.com/apis/ajaxlibs/</a></p>
