      <p><em>My proposal still has #1 as a requirement, but the other two are not issues at all.</em></p>
      <p><strong>Q.</strong> If the other two are not issues at all for your proposal, why are they such big issues for @font-face?<br>
      <strong>A.</strong> Because any kind of scheme for using explicit fonts on webpages requires explicit calls in one form or another in the CSS, and the type industry doesn’t run on good will alone, but well-defined EULAs and cash. It has to be practical, and if your proposal treats an issue like commercial licensing as a non-issue, it’s hard to see many people getting behind it.</p>
      <p>j a m e s</p>
