      <p>Ralf, I think David’s idea is to make font face declarations as simple as possible.</p>
      <p>@davidc: <em>Having a central server makes it trivial to ensure commercial fonts are not present...</em></p>
      <p>You trivialize the issue of commercial licensing by calling it a non-issue, using flawed reasoning like <em>...If for any reason they do appear, requests (or in the extreme DMCA takedown notices) are all that would be needed to rectify the situation.</em></p>
      <p>If your proposal is practical it will ensure commercial fonts never appear in the central repository. Then nobody will need to send cease and desist notices and commercial fonts won’t have to be removed. A DMCA takedown notice is not extreme. That’s kid’stuff in the world of intellectual property and commercial rights enforcement. </p>
      <p>Have you talked to Google about it yet? Google may say yes, but then you’d have to get font makers to donate fonts to the repository. I’m not trying to knock your idea into the ground. It has potential, but it needs support from font makers. It needs fonts. You already have my support in the form of Pyke’s Peak. The question is, How many other font makers will donate a font or two from their catalogs?</p>
      <p>j a m e s</p>
