    <p>I wrote up my thoughts on bypassing @font-face altogether and just having a browser plug-in (and ideally, native browser support for) a open internet service that will download any fonts needed to render a page.</p>
    <p>Of course these would be only fonts that are openly licensed for such distribution. I suppose the service could eventually add in DRM and commercial licensing features if it took off. But initially, it’s all about just providing a larger palette of type for all web pages without requiring any additional coding. </p>
    <p><a href="http://www.kpao.org/2008/06/wanted-font-family-font-server-plug-in-firefox.html" title="http://www.kpao.org/2008/06/wanted-font-family-font-server-plug-in-firefox.html">http://www.kpao.org/2008/06/wanted-font-family-font-server-plug-in-firef...</a></p>
    <p>Thoughts? Anyone interested in making it happen?</p>
