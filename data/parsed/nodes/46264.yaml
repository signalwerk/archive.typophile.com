      <p>This solution wouldn’t preclude @font-face, but @font-face has 3 barriers to entry:</p>
      <p>1. Requires browser support, which only Safari has now<br>
      2. Requires explicit calls in the CSS<br>
      3. Doesn’t deal with commercial licensing issues</p>
      <p>My proposal still has #1 as a requirement, but the other two are not issues at all.</p>
