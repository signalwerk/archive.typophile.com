    html: <p>There are basically two ways in which marks can be positioned relative to letters in a pleasing way, i.e. a way that looks natural, makes unambiguous to which letter a mark applies, and does not distract during reading. One way is to optically link the mark to a strong feature of the letter and the other way is to centre it optically on the whole letter. The key word in both cases is <em>optically,</em> which means taking into account the balance of weight in the letter + mark(s). [Jason, I think you have moved the circumflex just a bit too far to the right; it is beginning to drift off into space.] Some user communities may prefer a particular approach, and some writing systems might have quite specific rules (e.g. the positioning of vowels beneath Hebrew letters, which are optically centred on some letters and positioned relative to a vertical stem in others).</p>
