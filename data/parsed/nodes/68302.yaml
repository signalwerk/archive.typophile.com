      <p>Lowercase ĥ is a character which always tempts me to leave out Esperanto support altogether. While it is certainly not the only language with problematic diacritics, since it is a *constructed* language I would think they would have been more sensible than to put a circumflex over a letter with an ascender, or at least be in a better position to change truly dumb decisions after the fact.</p>
      <p>IPA has a convention whereby a diacritic normally placed over a letter may be placed under a letter with an ascender where no confusion will arise. I wish Esperanto had adopted such an approach, giving us ĉ, ĝ, h̭, ĵ, ŝ, and ŭ as Esperanto's accented characters. Of course, as the use of these characters becomes less frequent, the point becomes rather moot.</p>
      <p>André</p>
