      <p>The ĥ that is shown in the Unicode chart (<a class="freelinking external" href="http://unicode.org/charts/PDF/U0100.pdf" rel="nofollow">http://unicode.org/charts/PDF/U0100.pdf</a>) has the circumflex not quite centred over the ascender but still noticeably left of the centre of the letter. If font designers are relying on the Unicode charts for rare diacritic combinations, they could easily conclude that the circumflex should be over the ascender.</p>
      <p>If the Esperanto community is unanimous in finding this form incorrect, you might want to contact them about changing the reference glyph. Although Unicode's standard disclaimer is that the charts are for reference only and should not be taken to indicate the correct shape of the glyphs, there have been past cases of the reference glyphs used by Unicode being changed to reflect the preferred forms of the user community.</p>
