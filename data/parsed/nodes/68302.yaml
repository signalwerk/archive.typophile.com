      <p>eliason <cite>... considering design alternatives in a context like they will actually be used makes for more useful testing, especially if the potential issue is character ambiguity.</cite></p>
      <p>Yes, of course. I'm not going to take the time, however, to do a well-designed survey. I mainly used a large example so that users could easily see the difference. In any case, from my own expereince of reading Esperanto over a period of many years, and from the unanimous response from others, I think it's fair to say that the centered circumflex over the 'h' is the preferred design. If we type designers are so inclined, we can explore ways to make the design of the h-circumflex as unambiguous as possible.</p>
