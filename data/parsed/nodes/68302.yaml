    html: |-
      <p>Wow, I never would have expected this to be a "hot topic", which I noticed as I logged in just now. Let me see if I can respond to everybody's comments.</p>
      <p>Roger: I would never leave out an Eng (or eng, for that matter). If I'm going to add Latin Ext-A, then I will include all the glyphs for that codepage. </p>
      <p>Jongseong: Thanks for pointing that out on the Unicode chart; actually, I think that design isn't bad, although I would probably move the circumflex a bit to the right.</p>
      <p>Andreas: I agree with you. The minimum charset for me includes Basic Latin, Latin 1 Supplement, and Latin Ext-A. If/when I feel there's enough demand for it to warrant the extra work, I would consider adding Latin Ext-B, but have no plans to support Vietnamese in the near future, etc. You specifically said "comprehensive support for all European-Latin languages is the reasonable minimum target." That, of course, does not include Native American languages, etc. One could easily spend a huge amount of time researching how to properly support &gt;all&lt; Latin-based languages.</p>
      <p>Tom: Excellent question. As I have recently started editing (and writing) Wikipedia articles in Esperanto, as well as editing a major online Esperanto dictionary, I've noticed that the underlying character strings always use what is called the x-method, thanks to the convention that was developed before Unicode became available. So, for instance, instead of «ĝ» (g-circumflex) as seen by the user, the underlying character string is 'gx'. (Personally, I think the x-method is terribly ugly and difficult to read, but that's beside the point.) So, since I've implemented an OpenType feature to automatically convert cx, gx, hx, .... to ĉ, ĝ, ĥ, ...., respectively, the underlying text remains as it was input ... as with any OpenType feature (as far as I know). I hope that makes sense. My feature also supports the so-called h-method (ch, gh, hh, ...), as proposed by the author of Esperanto, at a time when the circumflexed letters were not readily available to printers. </p>
      <p>terminaldesign: I (and all Esperantists, I'm sure) would rather an imperfectly placed circumflex over the h than no circumflex at all (which of course would no longer be an h-circumflex). Certain words require the h-circumflex to distinguish them from words with just a plain h; for example, horo=hour; ĥoro=choir. As for my timing, as I mentioned in my original post, it was only when I added an OT feature to Minion, that I happened to notice the placement of the circumflex over the h. (With my aging eyes, I'm not likely to notice the placement of the circumflex when reading at 10 or 12 point on the monitor, or even printed, for that matter.) I didn't think I was "bitching" about it, but posted mainly because I was hoping somebody from Adobe might read it and perhaps reconsider how they design that particular glyph. Which leads to ...</p>
      <p>Christopher: I'm delighted somebody from Adobe is paying attention!</p>
      <p>I hope I've responsed to all the comments that are directly related to my original post. If I've overlooked anything, my apologies.</p>
