      <p>André— Leaving out Esperanto support altogether might anger some in the Esperanto community, if the font were really popular. There was a recent controversy about a free font that ParaType released that supported many minority languages that use the Cyrillic alphabet, but for some reason they left out support for Esperanto. A Russian Esperantist was very unhappy about that and has blogged and tweeted quite a bit about it. Personally, I wouldn't want that sort of 'bad press'. (BTW, the Esperanto community is quite vocal and they tend to be polyglots as well as avid Internet users, so they post/blog/tweet in quite a few languages.) In any case, it's only 12 additional, easily created glyphs; and they're part of the standard Latin Extended-A codepage, so it doesn't make sense to me to only include part of that set. But, yes, there are a few glyphs I would rather not bother with ... (Eng comes to mind).</p>
      <p>As for how Esperanto &gt;should&lt; have been designed, that is a contoversial and touchy subject, and this is not the place to discuss it. As someone who often prints text in Esperanto, there are many things that I wish were a bit different; but, I have yet to discover a perfect language in terms of typography. (Although, I must admit that text in Latin usually looks very nice. Ah, and then there's Arabic ...) The fact is, Esperanto has 12 accented characters, and that will probably not change in our lifetimes. Only the h-circumflex (Ĥ ĥ) is being used less frequently these days; the others are all very frequently used.</p>
