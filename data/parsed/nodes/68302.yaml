      <p>It is not my intention to propose this as a model but since there appears to be no specification of what Esperanto is expecting, we may simply make a little experience with the type of equipment that was available when the alphabet came out, namely typewriters. When I started typing, typewriters were mechanical and we would first type the accent, the carriage would not move, and then we would type the letter. That way we could get an eacute by first typing the acute and then the letter e. </p>
      <p>There is still an "old" Selectric typewriter in a locked room in my department (and it is still used once in a while, I am told). I just made the experiment, typing a circumflex and then the letter h. Here is the result<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/hhat_5030.png"></div><br>
      Without a spec, I presume that this is roughly what the first esperantists were expecting to get as an h with a circumflex.<p></p>
      <p>Added: it seems that this was also acceptable in printing since the 1905 edition of <a href="https://archive.org/stream/fundamentodeesp00zamegoog#page/n44/mode/2up" rel="nofollow"><em>Fundamento de esperanto</em></a> contains the following specimens (page 27)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/samples_5348.png"></div><br>
      where the last occurrence is the name of the letter as printed in the text.<p></p>
    html_clean: |-
