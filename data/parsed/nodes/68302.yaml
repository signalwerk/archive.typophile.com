      <p></p><div class="imageWrap"><img src="http://typophile.com/files/h-circumflekso-enketo_4844.png"></div><p></p>
      <p>Ok, now that I look at it again, I must admit that the circumflex on the second h above looks a bit far to the right (per John Hudson's observation) and perhaps it could be a bit higher to avoid any ambiguity with the 'fi' ligature. But, as of this morning, 17 out of 17 Esperantists from around the world (not including myself) have responded to my informal survey (using the above example and simply asking which design they prefer), and they unanimously prefer the one on the right. The one on the left is Adobe's version (from Minion Pro).</p>
      <p>Nick: One Esperantist was kind enough to do some research and provided a set of historic examples on his blog of the h-circumflex from 1905 to the present: </p>
      <p><a href="http://www.ipernity.com/doc/kallekn/album/179452" title="http://www.ipernity.com/doc/kallekn/album/179452">http://www.ipernity.com/doc/kallekn/album/179452</a>  </p>
      <p>He's included several thumbnails that can be enlarged to see the details of the designs. He points out that in some early books, the design is more or less like the Minion «ĥ», but that the circumflex has moved to the right over the years, and that this is now the most common and preferred position. He concludes, however, that "both designs are possible, and perhaps it's a matter of taste". In any case, as I already mentioned, 17 out of 17 Esperantists prefer the design on the right, so I think that's worth noting. BTW, the blog author points out that a couple of the designs do indeed look a bit like the 'fi' ligature. Another design shows the arm of the 'h' has been shortened slightly to (presumably) avoid this problem.  (I'd be happy to translate the individual comments under the examples, if anyone is interested.)</p>
