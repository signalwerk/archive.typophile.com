      <p>André: I already developed a keyboard layout for the former. The sad fact is, many Esperantists use the x-method for emails, forum messages, and many older texts are encoded that way. I find them very annoying and difficult to read. The advantage of the OT feature is that I can simply copy the text into InDesign (for example), set the stylist set to this feature, and voilà! I used to have to do a series of search and replace. For Windows users, or others who cannot (or will not) use a keyboard layout, they can enter text using their habitual x-method, and with the stylistic set being on, the text will be automatically converted to the proper "ĉapelitaj" letters.</p>
      <p>BTW, the keyboard convention you're suggesting (which is the method I originally used) causes a real problem with the combination "ux" (for «ŭ», that is, u-breve) if you later want to type in French, «châteaux», for example. (Many, if not most, Esperantists are multilingual, so this is a real issue.) In addition to the OT feature that I just recently started adding to my fonts, I also have another OT feature that allows the user to use the ASCII circumflex as a trigger; this eliminates the problem with French (and other languages that use 'x' after 'u', etc.), and it is an alternate input method that most Esperantists are already familiar with. With the combination of the keyboard layout and the 2 OT features, I think I have most every input method covered. However, some Esperantists are pretty obstinate, and seem to think that a bunch of 'x's (which is not part of the Esperanto alphabet) makes Esperanto look more exotic, or something; others simply use Windows and don't seem to know how to install a keyboard layout, or don't want to use any of the other many utilities that are readily available. I continue to campain for proper orthography, but one can only do so much; but, I've had a few converts (thanks to my constant badgering on Twitter).</p>
      <p>terminaldesign: Apology accepted! ;-)</p>
