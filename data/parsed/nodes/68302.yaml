      <p>Thanks for the input! :)<br>
      I have always wondered about that letter, and I have tried a few different solutions myself...</p>
      <p>I admit to having placed the circumflex centered on the stem on a few occasions (sorry!), but mostly I have placed it so it "hangs" from the stem over the bowl of the h.</p>
      <p>But I have also frequently placed it "next to" the stem, centered above the bowl in the same height as over an o (ô] - I think this often makes for a better balanced glyph, and it avoids the excessive height this glyph would get in fonts where the ascenders are taller than the Caps height.<br>
      How do you view this design choice - speaking as a native reader?</p>
