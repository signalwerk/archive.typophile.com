      <p>@Andreas</p>
      <p><cite> In these days, I think one can reasonably expect Latin fonts of a certain kind supporting all Latin-related languages. Why shouldn’t it? </cite></p>
      <p>Can you clarify what you mean by 'of a certain kind'?</p>
      <p>If someone sets out to support *all* latin-based language, where exactly are they going to get information about the necessary glyph repetoire? While one might reasonably be able to assemble a list of all of the glyphs used in those languages which have official status in some nation or other, assembling information on minority languages, especially those with emerging orthographies would be IMHO very difficult.</p>
      <p>Moreover, since no designer is going to actually be familiar with more than a small handful of languages, they aren't going to be aware of design conventions which vary from language to language. For example, most European designers are likely familiar with the use of ogonek in Polish, but very few are likely aware of how ogonek placement in Navajo differs from that of Polish.</p>
      <p>One can take it upon themselves to research these issues, but with ~4000 languages spoken on earth, no designer is going to be able to manage an even superficial investigation into more than a small proportion of these languages.</p>
      <p><cite> For my own fonts I decided a time ago that comprehensive support for all European-Latin languages is the reasonable minimum target. </cite></p>
      <p>That strikes me as a perfectly reasonable position to take, but it still excludes a great many latin-based languages. My point is simply that designers must make some sort of decision of this type, and that decision will inevitably exclude some language which someone else might think should be part of that minimum target. For me, support for natural languages takes priority over support for constructed ones.</p>
      <p>André</p>
