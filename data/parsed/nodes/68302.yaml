      <p>Thomas— Unfortunately, UEA (Universala Esperanto-Asocio) in Rotterdam doesn't always seem to be in tune with what the rest of us Esperantists are doing in the real world. (Please don't quote me on that!) In any case, 18 out of 18 respondents in an informal survey I did on Twitter preferred the circumflex being centered. Ok, one young guy wavered back and forth (over several tweets), and a young woman on Facebook said she usually handwrites the circumflex over the arm of the 'h'. Obviously, type designers are free to design the glyph the way they think looks best. But, unless taste among Esperantists changes drastically, I will continue to design my 'ĥ' with the circumflex centered ... a bit more precisely than I did in the example I included here. Of course, certain designs might require different solutions.  — Funny I would see your response today; I was just thinking about Laura earlier today.</p>
      <p>Tom— <cite>What happens if you try to search a text where the user sees ĉ, etc. but all the underlying strings are cx etc.?</cite><br>
      Good question. I think it applies to similar OT features in any font, whether it's a ligature subsitution or any other. OpenType is all about subsitution, so I would imagine that things are set up to search and alphabetize properly. I'd have to do some experimenting to find out; but, I bet somebody on Typophile already knows the answer.</p>
      <p>Theunis— <cite>There might be an underlying reason the circumflex shifted to the center -- isn't that the default position for a non-spacing diacritic?</cite><br>
      I think it started shifting to the right before we had digital type, but I'd have to check the samples and dates.</p>
      <p><cite>I like Zamenhof's 1929 one ...</cite><br>
      As the language itself evolves, I imagine taste in how the h-circumflex should look might change also. I'll keep my eyes open for both.</p>
      <p>eliason — You're welcome. I'm glad to see there's been some serious interest in the topic.</p>
