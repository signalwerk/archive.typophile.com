    html: "<p>Roger, that seems like a good solution, as long as the circumflex isn't bumping into the stem, of course. As for the height of the circumflex for lowercase 'h', I place it at the same height as the circumflex on caps. I think this looks best on a page of text: that is, either the circumflexes are above cap height, or above x-height; this is important for Esperanto, as there are a lot of circumflexes; having a 3rd height could look a bit ragged. Of course, if the ascender height is taller than the cap height, then your solution would probably be best, if there's room horizontally. In any case, don't worry too much about it; the ĥ is being phased out over time in actual usage; but, there are still a few words that must have it.</p>"
