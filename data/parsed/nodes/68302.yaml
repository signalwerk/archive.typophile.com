      <p>Just a quick question regarding your opentype feature: Are you intending this to be a way for users to more easily <em> type </em> circumflexed characters, or as a way of <em> converting </em> pre-existing text using the Cx or Ch conventions (where C = base consonant)?</p>
      <p>If the former, I'd say this is definitely more appropriate to implement as a keyboard layout than as an opentype feature (and you wouldn't need to use the option key as you state your current layout uses -- you could declare c, g, h, j, and s as dead keys and map (e.g.) c followed by x to ĉ and c followed by any character C (where C ≠ x) to cC.</p>
      <p>This would be preferable since it would be useable in any application, including both applications which don't allow the user to specify Esperanto as a language (I'm assuming you've localised this to Esperanto) and those which don't support GSUB features.</p>
      <p>André</p>
