      <p>kentlew: <cite> Is this a realistic expectation? </cite></p>
      <p>No, it's not. But there are many utilities available that make it very easy to directly type the letters with 'ĉapelo' (circumflex and breve). As one of the examples on the blog above shows, there is even a utility available on the iPhone now that allows proper input of the Esperanto accented letters. The OT feature (stylistic set) that I've started adding to my fonts is simply a way of allowing those used to the x-method, to use that input method and have the letters substituted on the fly. Yes, unfortunately, not many people will be able to access the feature. But, I can, and it will save me from doing a lot of search and replace when I download pre-Unicode texts that, for me, are virtually illegible.</p>
