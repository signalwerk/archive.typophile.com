    html: |-
      <p>Not so fast...</p>
      <p>After another examination 'minimalista' is on to something, as 'Fresh Script' has an "I" and "F" that now match exactly. The "i", "y", "M" and "N", which I missed the first time, are also a match to Fresh Script. Consider that about 125% horizontal scale was added.<br><img src="/sites/default/files/old-images/Thriller-CD_5070.jpg"></p>
      <p>Fresh Script Sample:<br><img src="/sites/default/files/old-images/Freshscript-Sample_4983.gif"></p>
      <p>Rage Italic Sample:<br><img src="/sites/default/files/old-images/Rage-Italic-Sample_5151.gif"></p>
      <p>Fresh Script is likely a knockoff off of Rage Italic, but it's a much closer match to the one used in the Thriller CD cover sample.</p>
      <p>Edit: The Fresh Script font info shows it was most likely created after Rage Italic, which appears to have been digitized by Esselte Letraset Limited in 1991.<br><img src="/sites/default/files/old-images/Fresh-Script_5501.gif"></p>
