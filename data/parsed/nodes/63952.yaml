      <p>The top sample matches 'Rage Italic' with some 'interesting' twists. Look at  the "I" in song 3... that's actually a "1". (Same applies throughout)</p>
      <p>Most curious is the "f" in "Voice-Over Session from Thriller". I can't find that glyph anywhere in Rage Italic.</p>
      <p>The original vinyl is hand lettering all the way... and very nice at that.</p>
