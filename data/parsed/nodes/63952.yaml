    <p>Hi there,</p>
    <p>For many years I've been using Rage Italic as most people said it was the closest but I thought maybe some of the typophiles here could find an even closer match.</p>
    <p>Here's the back cover of the 2001 special edition (rather than the original vinyl, which I have a feeling was hand lettered)</p>
    <p><a href="http://images.coveralia.com/audio/m/Michael_Jackson-Thriller_%28Special_Edition%29-Trasera.jpg">http://images.coveralia.com/audio/m/Michael_Jackson-Thriller_%28Special_...</a></p>
    <p>The original vinyl looks like this:<br><a href="http://imgs.inkfrog.com/pix/UncleDearest/Thriller_LP_back_cover.jpg">http://imgs.inkfrog.com/pix/UncleDearest/Thriller_LP_back_cover.jpg</a></p>
    <p>Is it rage? is there a better match?</p>
