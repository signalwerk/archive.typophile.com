    html: |-
      <p>From the little bits of writing/printed matter in this book I would suggest three possible approaches:</p>
      <p>1. typewriter</p>
      <p>2. handwriting - but an old-school script kind of writing - P22 Declaration is in the right direction but maybe too formal. A lot of these photos have writing on them, it’s script but not so flourishy. </p>
      <p>3. Fonts that were in common use for printed matter at the early part of the century, such as Century Old Style, Cheltenham Old Style, Caslon 540.</p>
      <p>Also you might try to keep the design in line with the look of the period, centered type (at least the headlines), nothing too flashy. Keep in mind the limitations of metal type. A broadsheet type of design could be nice.</p>
      <p>Also look here: <a href="http://images.google.com/images?hl=en&amp;q=ellis+island+documents&amp;um=1&amp;ie=UTF-8&amp;sa=N&amp;tab=wi" title="http://images.google.com/images?hl=en&amp;q=ellis+island+documents&amp;um=1&amp;ie=UTF-8&amp;sa=N&amp;tab=wi">http://images.google.com/images?hl=en&amp;q=ellis+island+documents&amp;um=1&amp;ie=U...</a></p>
      <p><a href="http://images.google.com/images?q=ellis+island+records&amp;um=1&amp;hl=en&amp;start=20&amp;sa=N&amp;ndsp=20" title="http://images.google.com/images?q=ellis+island+records&amp;um=1&amp;hl=en&amp;start=20&amp;sa=N&amp;ndsp=20">http://images.google.com/images?q=ellis+island+records&amp;um=1&amp;hl=en&amp;start=...</a></p>
    html_clean: |-
