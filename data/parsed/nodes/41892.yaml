    <p>This is strictly about a graphic interpretation so I sincerely hope that it doesn’t become a flash point.</p>
    <p>What symbols, images come to your mind when you think about this topic? I have a few in mind but they seem very obvious and I was hoping to get some fresh perspectives.</p>
    <p>I am specifically interested in immigration as it existed at the turn of the 20th Century.</p>
    <p>Any thoughts are appreciated in advance.</p>
    <p>pbc</p>
