      <p>That’s what I liked about Declaration - had a slight maritime feel to me. Old maps, etc… But it wasn’t quite it.</p>
      <p>Thanks for the images Patty - what struck me was the word refugee. That may lead somewhere…</p>
      <p>I guess fogginess only got me so far. Here’s the design brief:</p>
      <p>We are doing a festival in Liberty State Park. This is a new identity - I have the main body of it nailed down and just need the correct spice for the name. The name is All Points West. Apparently that’s what they called the train station in New Jersey where the immigrants left for the rest of America. The train station is right there - I believe it is part of the park.</p>
      <p>I searched for distressed scripts and Batarde Coulée from Lineto looks promising. Almost there…</p>
      <p>Unfortunately I can’t find a place to test the text - oh well keep searching.</p>
      <p>pbc</p>
