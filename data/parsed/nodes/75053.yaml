      <p>Paulo,</p>
      <p>you have very interesting elements here. They point to a nice sans. The challenge is to articulate all them to create a coherent design. I see you already made huge improvements since the first post.</p>
      <p>I think you must define a global criteria for each glyph element and, after you have the whole A-z built based on this criteria, <em>maybe</em> introduce some particularities to extend font character. Otherwise, you will be builting a group of glyphs which together does not work harmoniously.</p>
      <p>For example: the curve on top of stems have two opposite directions. Some goes at left (h, t), some at right (n, m, b). Define a direction, build all glyphs based on this and them you have a good base for improve. You can even substitute a whole piece in FontLab (so it becomes very easy to change ALL the tops with curves to left with tops with curves to right, if you decide to try this).</p>
      <p>I like your |f| very much. But |t| is strange due to very large bar at left. Its bottom terminal seems also undefined. Bottom of |g| seems thicker than remaining stems.</p>
      <p>A word about curve quality. This is your b (or something similar to it, as I traced it in Illustrator and grought to FontLab):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/tela_10172010_184038_5788.gif"></div><br>
      .<p></p>
      <p>The problem here is that you don't have a standard. In each quarter you have one kind of curve. Together, it seems you |b| has some irregularity. Of course, you don't want an exact circle but actually an unequal ellipse to compose the b. Anyway, this ellipse needs to be regularly build to get fluidness.</p>
      <p>This is how I'd do this:</p>
      <p>Firstly, I make a copy of original glyph and put it at mask layer (all this in FontLab). With Ctrl+Shift+O, I make the mask visible. So I did edit control points in one quarter to get a more circle-like curve there:<br>
      .<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/tela_10172010_190500_6206.gif"></div><br>
      .<p></p>
      <p>With a quarter closed, I simply copy-n-mirrow it to get the ellipse. Add the stem and you have a good start point:<br>
      .<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/tela_10172010_193135_3904.gif"></div><br>
      .<p></p>
      <p>You can see I like to work with points (BCPs) and handles at a 4x4 grid. It's just a personal preference.</p>
      <p>As I said, this is <strong>just</strong> a startpoint. Actually, you don't want a so regular b. The advantage with this structure is you can make experiments with one piece without interference in another. Fot example: handles {436,294} and {498,258} would be slowed to make upper conection more soft and less geometric. You can experiment with these handles while the other quarters remain ok.</p>
      <p>At the end, you will probably modify severely the curves of quarters sw and nw, while ne and se will receive just small changes regarding height and width.</p>
      <p>Well, this is how I'm working. Since I begun to produce with pieces and use FontLab mask for my own designs (and not to show another font as an example, as I thought it was designed for), the workflow improved a lot.</p>
      <p>Following this method, I did some adjusts (for my taste, of course) and the glyph resulted this:<br>
      .<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/tela_10172010_201002_5466.gif"></div><br>
      .<p></p>
      <p>Even if you search for a very different result, you can see there is a regularity between the curves. And if you need to make then more oval its easy to move just some points or some handles.</p>
      <p>The final result still needs work, but shows my idea about regularity:<br>
      .<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/tela_10172010_201035_3423.gif"></div><p></p>
  - id: 434755
    user_id: 32723
    user_name: Igor Freiberger
    user_path: null
    user_image: /files/pictures/picture-32723.gif
    date_raw: 17 Oct 2010 — 10:06pm
    date: 2010-10-17T22:06:00
    votes: null
    html: |-
      <p>Paulo,</p>
      <p>other things you can consider in your development:</p>
      <p>.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/tela_10182010_023713_4655.gif"></div><br>
      .<p></p>
      <p>Overshoots usually are different for uppercase and lowercase. I use 12pt to lower and 16 to upper. I do position BCPs in overshoot just for elliptical shapes. As you see in |a|, belly goes up to –12 (full overshoot). But for serif I put the bottom BCP at –8 because the serif shape is not straight nor elliptical.</p>
      <p>A global ruler at the vertical middle of the glyph kernel (I mean, without asc/descenders) is useful to control mirrored shapes. In this case, I have rulers to mark middle of lowercase, small caps and uppercase.</p>
      <p>Marks named top, bottom and ogo are anchors to automatically position diacritics. Most times to position these anchors exactly at the horizontal meddle is not the best. For |a|, I put top anchor at geometric meddle of this glyph without the serif (because serif is at the bottom and has small effect on optical middle at the top). In other hand, bottom anchor consider the whole glyph width. To position anchors is somewhat related to adjust sidebarings, IMO.</p>
      <p>Finally, you can see I used as few BCPs as possible. Every time it's possible, I use tangents and smooth connections.</p>
      <p>This draft goes at the mask layer. I copy-n-paste it to main layer, merge contours and verify if further adjustments are need. Sometimes, FL changes slight some BCPs after merging, especially because it needs to round all positions to integers. After this, I manually add links (I prefer to use links instead of hints because them move with your BCPs in case you edit something later).</p>
      <p>Please forgive me if you already know all this. I know you are a master in script fonts but, as this is your first sans, I believe some of these techniques may be not completely known – not to mention the possibility some generous fellow come here to make improvements on what I'm saying.</p>
