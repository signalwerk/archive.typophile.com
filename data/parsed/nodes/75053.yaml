    html: <p>I don't want to discourage you, but I think there is too many ideas in it. You talk about sans serif and you place a “serif” in some letter (a, e, s, f). Concentrate your work on one goal, choose the h or the e for instance, which are different from each other in the drawing, to see which will give you satisfaction and make some draw from them. To help, you could take a closer look at some well known sans serif and observe how the letters are drawn. It takes consistency and similarity in the outline. Keep going.</p>
