      <p>Paulow,</p>
      <p>That is a major improvement, yes, for the joins. You could probably do the same thing just a *little* more, but that's pretty close.</p>
      <p>When you show the letters large like that the "lumpiness" issues become more apparent.</p>
      <p>For example, in the "b" the top right and bottom left parts of the bowl seem thinner than anywhere else. This feels particularly "wrong" because it is the exact opposite of the effect of chirography, the idea that if a calligraphic implement was involved in drawing that bowl, those would be the thickest parts and the top left and bottom right would be the thinnest.</p>
      <p>Those same parts of the bowl are also flattened for some reason.</p>
      <p>Another issue I'm seeing in letters like "t" and "o" is that the horizontals look thicker than the verticals. The verticals need to be slightly thicker than the horizontals to "look" the same, to achieve the feeling of being monoline (having even line thickness). I'm assuming that's what you're going for here.</p>
      <p>Cheers,</p>
      <p>T</p>
      <p>P.S. "IMO" = "In my opinion"</p>
