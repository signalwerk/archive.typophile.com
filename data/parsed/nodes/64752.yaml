      <p>This is a description of a travel to the Holy Land and its neighbors.<br>
      And this is a rouhg line by line translation of the tilepage:</p>
      <p>Jonas Kortens'<br>
      Former bookseller at Altona (= now part of Hamburg, Germany)<br>
      Travel<br>
      To the former<br>
      Holy<br>
      But now<br>
      For seventeen hundred years<br>
      Under the curse lying<br>
      Land<br>
      Also to Egypt, Mount Lebanon<br>
      Syria and Mesopotamia<br>
      Written as seen by himself<br>
      And<br>
      In this second Edition<br>
      With two supplements<br>
      Augmented<br>
      Published by the author<br>
      Halle<br>
      Printed by Joh. Christian Grunert, 1743</p>
