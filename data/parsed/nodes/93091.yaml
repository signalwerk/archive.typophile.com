      <p>I love that brothers font! I feel it may be too "old" looking. Definitely is more of a period typeface. However, I do feel it goes better with your current torch. I would redraw the torch, as per hrants suggestion, and make it match your current font, which I like as well. I DO get that "Russian" feel though. Just off the top of my head, maybe try something along the lines of <a href="http://www.houseind.com/fonts/unitedcollection" title="http://www.houseind.com/fonts/unitedcollection">http://www.houseind.com/fonts/unitedcollection</a>? Or perhaps something similar that is custom...? If you do keep your current font, you should rework the kerning a bit.</p>
      <p>Oh just opened up MyFonts and saw this one: <a href="http://www.myfonts.com/fonts/ahmet-altun/regular/" title="http://www.myfonts.com/fonts/ahmet-altun/regular/">http://www.myfonts.com/fonts/ahmet-altun/regular/</a> the bold, all caps might work. I think the "A" is very Americana.</p>
