    <p>Hello,<br>
    Looking for recommendations on a nice handwriting font – as if seen in a letter from a hundred years ago (WW1). Would be great to have some glyph variations to keep things believable. Short paragraphs but should be quite legible. Ta!<br>
    Alex</p>
