    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/20028" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Libraries</a>&nbsp;: Melbert B. Cary Jr. Graphic Arts&nbsp;Collection</strong></p>
    <p>The <a href="/node/add/wiki?edit%5Btitle%5D=RIT" title="Create node &quot;RIT&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Rochester Institute of Technology</a> Wallace Library is home to the <a href="http://wally.rit.edu/cary/">Melbert B. Cary Jr. Graphic Arts Collection</a>, curated by <a href="/node/20082" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">David Pankow</a>.  The Cary Collection is one of the country’s premier libraries on the history and practice of printing. In 1969, the Cary Collection was presented to <span class="caps">RIT</span> by the Mary Flagler Cary Charitable Trust as a memorial to Mr. Cary. Today the library houses some 20,000 volumes and a growing number of manuscripts and correspondence collections. Also included are impressive holdings on bookbinding, papermaking, type design, calligraphy and book illustration. The goal of developing the digital image database is to enable users all over the world to sample the wealth of rich materials housed in the&nbsp;collection.</p>
    <p><span class="caps">URL</span>: <a href="http://wally.rit.edu/cary">http://wally.rit.edu/cary</a></p>
