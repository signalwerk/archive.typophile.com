    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Libraries" class="freelinking" rel="nofollow">Libraries</a> : Melbert B. Cary Jr. Graphic Arts Collection</strong></p>
    <p>The <a href="/wiki/RIT" class="freelinking" rel="nofollow">Rochester Institute of Technology</a> Wallace Library is home to the <a href="http://wally.rit.edu/cary/" rel="nofollow">Melbert B. Cary Jr. Graphic Arts Collection</a>, curated by <a href="/wiki/David%20Pankow" class="freelinking" rel="nofollow">David Pankow</a>.  The Cary Collection is one of the country's premier libraries on the history and practice of printing. In 1969, the Cary Collection was presented to RIT by the Mary Flagler Cary Charitable Trust as a memorial to Mr. Cary. Today the library houses some 20,000 volumes and a growing number of manuscripts and correspondence collections. Also included are impressive holdings on bookbinding, papermaking, type design, calligraphy and book illustration. The goal of developing the digital image database is to enable users all over the world to sample the wealth of rich materials housed in the collection.</p>
    <p>URL: <a href="http://wally.rit.edu/cary" title="http://wally.rit.edu/cary">http://wally.rit.edu/cary</a></p>
