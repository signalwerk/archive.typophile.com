      <p>FF Legato I would rather count among the incised/glyphic sorts. Very good typeface though.</p>
      <p>For me the structure of the stroke junctions in n, m, u, d, b &amp;cª is the key criterium. Therefore I do not count Myriad under this genre, because it has a definite Didone nature in this regard.</p>
      <p>But I don’t like Meta, Scala and this kind of 90-ish FF stuff anymore. When I look at M. Majoor’s a’s and y’ it hurts everywhere. Not *my* idea of humanism –</p>
