      <p>We could adopt Ray Larabie’s classification:</p>
      <blockquote><p>Old sans (Franklin Gothic and other sans with ancient flav)<br>
      Geo-classical (Futura, Gill, Bernhard Gothic)<br>
      Helveticas (Arial, and hundreds of other mid-century neutrals)<br>
      Frutigers (Museo Sans, Verdana)<br>
      Humanist sans (Easy. If the baseline is straight, it ain't humanist. Most of what I see categorized as humanist are just Franklins.)<br>
      Geo-gothic (Avant Garde)<br>
      Square Sans (EF Digital, Bank Gothic, Chimes)<br>
      Superelliptical (Microgramma, Eurostile)<br>
      Brush Sans (Flash, Balloon)<br>
      Techincal (DIN, Highway Gothic, stencils, elevator buttons, template lettering, labels &amp; other "ugly" lettering)<br>
      Pixel (early computing retro, including segmented LED)<br>
      MICR (Data 70)<br>
      Rounded Sans (V.A.G., Arial Rounded)<br>
      Compacta (Impact, Helv Inserat)</p></blockquote>
      <p>(from <a href="https://web.archive.org/web/20150415031349/http://typophile.com/node/85976" title="http://typophile.com/node/85976">http://typophile.com/node/85976</a>)<br>
      I find the “Frutiger” category especially useful.</p>
