    html: |-
      <p>I really like this thread - it crystallised something I've thought for a while, that several of the geometric and humanist sans-serif fonts have more in common than most people think. Here are my suggestions for dividing up the humanist sans world:</p>
      <p>1) The monumental: those that look like they should be on a big sign. Gill Sans, Johnston. I definitely agree that some of these have geometric inclinations, perhaps because of the classical roman capitals influence and perhaps because perfect shapes look best at large sizes. Many Gill Sans and Futura caps are quite similar, actually. And Gill's O is nearly a perfect circle and its M roughly a square. </p>
      <p>2) The body text. Those that try to be fluid and more friendly so they work in body copy, and also try to avoid being eccentric like the next two. Myriad and Frutiger go here. Corbel almost does, but some of its little ticks and flourishes work against it. Calibri too.</p>
      <p>3) The calligraphic: those that try to look a bit hand drawn and avoid straight lines. Many of these look best when they're quite chunky so you can see the details. Ideal Sans (especially in its bold weights), Goudy Sans, Alegreya.</p>
      <p>4) The stripped serif. Those that strongly take after body text serif fonts. Heavy overlap with category 3. Very 90s-they look a bit dated now. Scala comes here. The normal problem these have is that copying a serif font too closely leaves them with an 'a' that looks weird-you end up with an aperture that's too small at the bottom.</p>
      <p>I liked H&amp;FJ's <a class="freelinking external" href="https://web.archive.org/web/20150415031349/http://www.typography.com/fonts/ideal-sans/overview/" rel="nofollow">description of how they came to make Ideal Sans</a>, that Gill and Johnston were "chilly and austere designs shaped by unbending rules, whose occasional moments of whimsy were so out of place as to feel volatile and disquieting". And I know what you mean about FF and Scala, which saddens me since I love Majoor's writing on font design. It's not something I can put my finger on, but it just seems to be the result of copying serif fonts too literally. </p>
      <p>On this topic, I like Mr Eaves a lot - it captures a lot of the whimsy of the serif but you can make it lose it through switching in alternates if you prefer.</p>
    html_clean: |-
