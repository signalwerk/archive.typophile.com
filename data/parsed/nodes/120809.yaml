      <blockquote><p>“Humanist” is no longer an adequate term for all sans styles that are neither geometric nor grotesque.</p></blockquote>
      <p>I agree, and in fact I keep a huge collection of pictures of typefaces categorized in different folders and I have one called " Sans – Contemporary". I hate that name though as it's too generic, but then I suppose it really is more of a "miscellaneous"  folder. Does anyone have a name for this new category which seems to mix many of the classical categories but is often more daring and progressive in the linework than the historical models ever were? This is particularly the case in the serif category; what comes after Garalde, Transitional, Didone, Scotch and Egyptian? Apologies if this undermines this thread. Perhaps this should be posted in a new thread.</p>
      <p>My favorite humanist sans typefaces are Auto, Breve Sans, Calluna Sans, Comenia Sans, Epoca, Epoca Classic, Foro Sans, Gentona, Gloriola, Ideal Sans, Impara, Jannon Sans, John Sans, Karmina Sans, Libertad, Lucca, Metro Nova, Novel Sans. Proza, Publicala, Quire Sans, Ratio, Safran, Sentosa, Sonus, Supra, Tabac Sans and Vegan. Can you have such a long list of favorites? Let's say I just appreciate the design of these typeface to a high degree—and I'm sure I've missed some.</p>
      <p>Brandon Grotesque is fantastic, though I never thought of it as humanistic before. Also, I love Signo, but you can't call that a humanist sans, can you?</p>
