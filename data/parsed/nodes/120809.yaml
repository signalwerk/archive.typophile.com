      <p>Brandon Grotesque:<br>
      a combination of<br>
      – lowercase based on circle and classic Renaissance proportions, high ascenders,<br>
      – very few special details (a, g) add personality, (the italic f is too heavy in the stronger weights);<br>
      – uppercase geometric with a sort of ‘Gothic feel’ (the M is too narrow in the lighter weights; O, C etcª are too small in the bolder wts.)<br>
      – a very airy spacing which lends a mood of easyness, even to the heavier sorts,<br>
      – the rounded finish makes a cool geometric design looking warm.</p>
      <p>I find this is really interesting, despite some details I found to criticize.</p>
