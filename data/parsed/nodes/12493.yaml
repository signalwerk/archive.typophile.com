      <p>&gt; <em>I’ve heard that in the photo-typesetting days, most Helvetica wasn’t Helvetica at all, but one of many knock offs.</em></p>
      <p>The <em>copying</em> or creating subtle look-alikes during the hot metal and cold type (phototype) period was particularly prevalent where the "font" was mated to proprietary typesetting equipment. There was no official LEGAL protection of type designs and it became more a matter of ethics regarding piracy.</p>
      <p>You must remember that the business stakes were much higher for font/typesetting manufacturers as opposed to current open ended device independent type fonts used today.</p>
      <p>FYI -- I can vouch for nearly ninety weight versions/variants of Helvetica when I worked for Compugraphic-Agfa (Helios, Helios II, CG Triumvirate).</p>
