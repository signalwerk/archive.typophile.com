      <p>Yeah, there's a lot of fogey-design out there, by people of all ages.<br>
      Ironic that when it comes to typefaces, so many young geezers' "modern" is as retro as their "retro".<br>
      But the hot young type designers of 10 years ago, now the establishment, are pointing in the same direction, ennit? You don't see Mr Hoefler doing too many Fetishes these days, or a "Mohamed luvs ya' from Mr de Groot  (although Mr Barnbrook is still flying the flag).</p>
      <p>BTW, who is today's typographic anti-establishment?</p>
      <p>I'm philosophical about it -- the present era is a stepping stone between the days of deconstruction and a typographically-informed design community. It's not like designers are steeped in the classics, but they're getting their feet wet, and once that's permeated, many will become more informed and move on to using more sophisticated, contemporary reinterpretations of the classics, and serious new stuff.</p>
