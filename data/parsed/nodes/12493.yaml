      <p>I work with several design firms, and I've observed that buying fonts is completely off the radar for small creative firms. They just accumulate the fonts that have gotten bundled with software over the years, sharing them with customers, printers, and other design firms as needed. And I'd be astonished if any small company cared about EULAs or was even aware of them.</p>
      <p>Activation, in my humble opinion, is a pretty bad business idea (not to mention technically unfeasible) unless you have a monopoly on the market like Adobe has. Especially for type, trying to manage any kind of workflow between departments and firms with fonts that required activation would be anathema. No one would bother with those fonts unless they managed to acquire copies that worked without activation.</p>
