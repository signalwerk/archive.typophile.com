      <p>If you find or hear about the person who does figure this out...will ya' let me know?</p>
      <p>It's not honestly the private collectors so to speak that I am really bothered with here.  They are not the ones causing me headaches.  So many people have taken KR files right off my website, installed them and then made money off them.  How?  Would you believe that the most common group of offenders that I have had in the last two years (let me know if this surprises you, it did me!) ...  digital machine embroiders!  Try a yahoo search for 'machine embroidery fonts' or the same on eBay.  I've had to send Cease &amp; Desist letters along with a demand for payment too many times.  It's not just the big boys like Adobe or big (another 'get this moment') scrapbooking font sites either.  Many other 'my office is in my living room' types like me are seriously up against a wall here.  I can happily say though, I have had many people settle right up, be responsible, pay what is owed me, went back to using the file again and started to make money for themselves again.  You have no idea, or do you? - just how many of these offenders think that taking down the money-maker (designs made SOLELY by a KR file) should make me happy - and place them no longer responsible.  You don't want me to get into the threats, some even personal - and the unwillingness to take responsibility for their actions.  </p>
      <p>(Check the 'royalties and licensing' forum for my other post)</p>
      <p>For me, the simple and clear-cut here issue is - if you're making money off the file, then so should I.</p>
      <p>My favorite 'lines' from the past ....No I didn't - I didn't do it - oh, you have proof - bad me - watch the items for sale disappear from their site or store and they think they are done - or here,  let me send you a  note asking how much licenses are and then when I don't hear back from the person I check their site later down the road and I see, you guessed it, a bunch of items made for sale made solely from my file - for approximately 2yrs. now -or- what happened today - a woman I have been trying to make settle up - for a problem she created - took down her old site..put a new one up... shoots me a note I guess trying to look all legal  n'such saying "I don't have anything of yours' on my site" - well duh lady..you took down that one - the problem didn't go away simply because you changed domain names!</p>
      <p>It's amazing how much info/proof one can get just by using 'internet archives'- also called 'time machines.'</p>
