      <p>I think, what it comes down to, with software, music, videos and all that alike, are some points like these. </p>
      <p>– People who have money will spend their money on legitimate product, if they deem it worth it. This has always been the case and will remain true, even in the digital age. </p>
      <p>– people who have no money will find ways to get on prated versions, no matter how much the data is protected. This has always been the case, even before the internet. And frankly, a school kid downloading stuff he could never have afforded to buy in the first place is not costing anybody money. Some student or third-world-small-scale-designer designer who maybe couldn't have afforded the Meta family in the first place, also is NOT costing FSI money. God, LET those people use pirated versions, it's just sharing wealth. In he end, the wealth probably WILL come back to you. </p>
      <p>- Brand image, personal sympathy and identification,quality, service becom more imporant than ever, asurdly at a time when most bigger companies try to save money in these areas. You don't steal mp3s from a band you really like, beacuse you want them to make a living of their art. I guess you'd have less compunction downloading a Madonna song, but most people I know would never ever hurt a band they «know» and like. You don't steal from a friends house. Along the same lines you don't use pirated fonts from people you like. It's that easy. What we need isn't paranoia, as this hasn't kept piracy at bay since the 70s... but rather, as strange as that sounds, a feeling of trust and friendship. The digital availability of music, video and font will either demand an Orwellian DRM-System, and I'm very concerned that such systems will in the long term absolutely hurt the system at large. Maybe I'm wrong here. People actually use iTunes and the iPod... and seem to have verylittle problem with the fact that Big Brother is controlling their iTunes-bought music for them. On tghe other hand, we have a chance that companies just effing trust their customers and engage in a dialogue and simply ask nicely for their money. I think, in the end, they will earn MORE that way. Large comapnies such as Adobe and Lino and even FSI shoul work at becoming approachable, personal virtually smaller-feeling and more personal firms. They need faces. Smaller companies, such as Thirstype, already have the personal touch, and frankly, I think they have not that much to worry about. </p>
      <p>HD Schellnack</p>
