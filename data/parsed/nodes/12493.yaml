      <p>You're right Tiff, maybe activation isn't such a good idea for fonts.</p>
      <p>I think piracy is a bit of a red herring, as an intellectual property concern for "the type industry". For most foundries, font bundling by the oligarchs -- Microsoft, Adobe, and Apple -- is the questionable practice which is most detrimental to their business. For two reasons. First, as Capthaddock observes:</p>
      <p>"they just accumulate the fonts that have gotten bundled with software over the years, sharing them with customers, printers, and other design firms as needed."</p>
      <p>This practice has become established for all fonts, not just "free" bundled fonts. Meta as shareware.</p>
      <p>Secondly, of course, by providing most of the fonts most people need, bundling marginalizes the retail font market. </p>
      <p>"The type industry" is not, as one contributor at FontLeech seems to think, monolithic. Although we do all get together and sing from the same book for typefests such as TypeCon and ATypI, the interests of the independent foundries are not the same as those of the software oligarchs, who call the tune.</p>
