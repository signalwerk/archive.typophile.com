      <p>&gt; <em>the present era is a stepping stone between the days of deconstruction and a typographically-informed design community</em></p>
      <p>I agree Nick. We are caught in between rampant tech development and the "first-to-market" mission of business giants and entrepreneurial start-ups in many industries. </p>
      <p>Many recent product and software developments in production and distribution have truly shaken up the way many traditional markets do business -- music, film, transportation, cosmetic enhancement, miniturized portable communications, consumer image and video capture devices, consumer video/music replication/editing/remix software and devices, "on-demand" anything, and so on.</p>
      <p>The production, integration and distribution of "fontware" is pretty much mated to technology as it has been from the beginning of <em>movable type</em>. </p>
      <p>Combine that with the new and various ways we are adapting ourselves to reading and writing (I still can't effectively type fast enough on a cell phone for text messaging) and it's difficult to decide what to design for an ever evolving environment.</p>
      <p>So maybe things will look pretty crappy by our earlier standards until the dust settles a bit and concern for the READER becomes a priority again.</p>
