      <p>Sometimes we lose perspective on the <em>font buying</em> public (the "people" who BUY and use type) since most of us (typophiles) are so immersed in type design and typography.</p>
      <p>We know who Morris Fuller Benton is and his designs, but believe me, the majority of graphic designers don't have a clue, so ANY version of Century or Franklin Gothic is OK in their book.</p>
      <p>Here are some recent quotes from <a href="http://www.designtalkboard.com/designtalk/index.php?topic=36.0" target="new" rel="nofollow">Design:Talkboard</a>, one of many forums for budding graphic designers (your new type buying market):</p>
      <p><em>I like frutiger for a body font. Franklin gothic for headlines. And I have a real problem stopping myself using gill-sans at the moment. </em></p>
      <p>Univers is a nice clean serif font. I also like Gill-Sans (I'm very traditional). Plantin is an interesting font for sub-heads.</p>
      <p>As for the serif variety, I tend to go with Garamond. Simple, and it's a treat to set.</p>
      <p>i'm so traditional. for a really bold heading i usually go with about 27px georgia (pretty much only if it's black on white...doesn't look right in any other colors...). otherwise for body work i'm generally stuck on verdana/helvetica/geneva/etc... </p>
      <p>Playing Identify the font???<br>
      Ye  Gods, and I thought us programmer were geeks!  That totally takes the biscuit! </p>
      <p>I've been using Univers a bit recently. It's kind of a relaxed Frutiger... or something </p>
      <p>I like simple, clean sans serifs, like Univers (oh my favouraite for years now) Helvetica (and neue), Frutiger, Swiss, Simplex, Din. I always seem to end up with Univers somehow.</p>
      <p>One of my favorite fonts is Century Gothic.  It's very clean and it looks professional.  I use it for tons of my designs.  There is another new and cool font that I just started to use.  It's Kabel EF.  I used it for a logo design and I think it was a good choice.  This is because, just like Century Gothic, it looks clean and professional. </p>
      <p>Out of the mouths of babes (infants NOT hotties).<br>
