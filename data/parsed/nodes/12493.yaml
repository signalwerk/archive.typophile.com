      <p><em>We know who Morris Fuller Benton is and his designs, but believe me, the majority of graphic designers don’t have a clue, so ANY version of Century or Franklin Gothic is OK in their book.</em></p>
      <p>This is a big problem… every revival of an old design is different. Just look at Garamond (I know, not exactly comparable, but easier to use to make a point) or Bodoni. ITC Garamond isn't really a Garamond. Neither are many other fonts with "Garamond" in their name. Since your average designer doesn't know this, he might get the wrong idea about what actually makes a font good and legible.</p>
      <p>Many graphic designers think that legibility is quite pliable ("I'm what makes typography legible or illegible, not the font's design…").</p>
      <p>To confound matters, you have the problem of bad interpretation. Bauer Bodoni was probably the most legible metal Bodoni book face. But the digital Bauer Bodoni only works in display, despite what so many designers think. If they would use their eyes, they would see that the digital version just doesn't live up to its forbearer. But the metal's reputation is so strong that people refuse to believe that the digital is so different.</p>
