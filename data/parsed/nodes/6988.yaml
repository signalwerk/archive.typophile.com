    html: "<p>Right! I knew it was in there somewhere, thanks.  <br> <br>Attached is the first letter digitized: q. It is from a handwiting sample from my grandmother, Ardeth. She is in the early stages of what looks like Parkinsons. When she was having a good day and her hand was steady, I asked my mom to walk her through a basic set. The results are beautiful, but it was done with a cheap ball point pen. As this is a fun side project for me, I just wanted to experiment with adding a calligraphic stoke to the monoline. <br> <br>As with most computer auto-features, it's no substitute for the real thing. Fine penmanship (penwomanship), where art thou? Thanks for the info though.  <br> <br>R <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/50509.gif\" alt=\"\"></p>"
    html_clean: "<p>Right! I knew it was in there somewhere, thanks.  <br> <br>Attached is the first letter digitized: q. It is from a handwiting sample from my grandmother, Ardeth. She is in the early stages of what looks like Parkinsons. When she was having a good day and her hand was steady, I asked my mom to walk her through a basic set. The results are beautiful, but it was done with a cheap ball point pen. As this is a fun side project for me, I just wanted to experiment with adding a calligraphic stoke to the monoline. <br> <br>As with most computer auto-features, it's no substitute for the real thing. Fine penmanship (penwomanship), where art thou? Thanks for the info though.  <br> <br>R <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/50509.gif\" alt=\"\"></p>"
