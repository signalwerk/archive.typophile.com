  html: <p>I never thought this day would come, but... <br>I am experimenting with vector paint tools in fontlab. <br> <br>I know you can draw a single line with the pencil tool. You can draw a brushed line with the brush. But can you draw a single line, tweek the curves, and then apply a brush stroke to it? <br> <br>I've check the manual and Learn FL Fast and haven't found the answer. Thanks! <br> <br>Randy</p>
  html_clean: <p>I never thought this day would come, but... <br>I am experimenting with vector paint tools in fontlab. <br> <br>I know you can draw a single line with the pencil tool. You can draw a brushed line with the brush. But can you draw a single line, tweek the curves, and then apply a brush stroke to it? <br> <br>I've check the manual and Learn FL Fast and haven't found the answer. Thanks! <br> <br>Randy</p>
