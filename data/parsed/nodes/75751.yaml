    <p>Hi there,<br>
    This isn't a question related to typography as such, but I figured that this would be a suitable place to ask it given the prevalence of graphic designers floating around here!</p>
    <p>I was wondering if it was possible to get text in InDesign to 'flow' into another text box once the first text box is full. </p>
    <p>For instance, I have two textboxes, A and B. I fill A with text. When A becomes full, I want the text to spill over into B.</p>
    <p>Is this possible, and if so, how? Or is there an easier way to get the functionality that I am describing?</p>
    <p>Many thanks<br>
    Cale</p>
