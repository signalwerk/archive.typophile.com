    html: |-
      <p>Yes, it's easy to do that.</p>
      <p>1) When a text box is full, a red plus sign (+) appears in the lower right corner of that box (see #1 below).</p>
      <p>2)  Click on the "+" with your cursor. Your cursor will change appearance to indicate that the overflow text is loaded into it (see #2). </p>
      <p>3) Click on an empty text box. The two boxes will become linked (#3). </p>
      <p>For more info on linking and unlinking text boxes, go to InDesign's Help menu and select "InDesign Help", and on the help pages look in the "Text" section.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/indesign_example_5882.jpg"></div><p></p>
