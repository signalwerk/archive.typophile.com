    html: |-
      <p>If you want a truly minimal /System/Library/Fonts folder and do not require CJK support, you <em> can </em>  remove everything but the following.</p>
      <p>Helvetica.dfont<br>
      Keyboard.dfont<br>
      LastResort.dfont<br>
      LucidaGrande.dfont</p>
      <p>However, you should probably also leave the following alone as many applications won't work properly without them:</p>
      <p>Geneva.dfont<br>
      HelveLTMM<br>
      Helvetica LT MM<br>
      HelveticaNeue.dfont<br>
      Monaco.dfont<br>
      Symbol.dfont<br>
      Times LT MM<br>
      Times.dfont<br>
      TimesLTMM</p>
      <p>Note that if this list is specific to Leopard. Other fonts may also be required under other versions of MacOS. Since the above list includes no CJK fonts, you may run into serious problems if you ever switch input methods.</p>
      <p>Anything which is *not* stored in /System/Library/Fonts is pretty much guaranteed to be safely removable.</p>
      <p>On an unrelated rant, I still can't fathom what possessed Apple to make Helvetica a required font under OS X. That has to be one of the stupidest decisions they've ever made.</p>
      <p>André</p>
