  html: |-
    <p>My font list is way to big.<br>
    I would like to have my default font list as small as possible, only the fonts that are really needed for websites and programs that run on the mac to avoid crashes.<br>
    The rest i want to activate with fontexplorer.</p>
    <p>Is there a list or something of fonts that can't be thrown away?<br>
    Or which folders are save to clean and which not?</p>
