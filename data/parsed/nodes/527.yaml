    html: "<p>Dalliance family and Eidetic Neo family from Emigre for a client's wedding invitations. Eidetic Neo for the type, Dalliance for the flourishes (of course I could have easily done the flourishes myself in Illustrator, but I've been looking for an excuse to buy Dalliance-- even though I doubt it will ever find its way into any of my work again.) <br> <br>It's a little disturbing to hear that some simply assume that none actually pay for software or fonts. Really gets me excited at the prospect of releasing typefaces I make. *shakes head* <br> <br>Oh, and Tiffany: wonderful choice with the Czech Type Library. I'm very tempted to pick that up myself!</p>"
