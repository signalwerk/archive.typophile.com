    html: "<p>\"Formal/refined...for a playground? Yes, one of the primary uses will be to solicit funds, but how do you make the leap to formal?\" <br> <br>Because you're asking for money. The first marks appeared to be targetted at kids. I assume you're asking money from adults. Perhaps 'formal' was the wrong term...maybe more 'adult' is what I'm going for. <br> <br>It can still be (and probably should be) fun, but it shouldn't be childish. <br> <br>Now that I've read the rest of the threads, I see others have said that better than I had. ;o) <br> <br>\" Why does their logo work so well?\" <br> <br>I don't think it does. It's fairly generic. The name is interesting, but, again, kind of vague. A good logo isn't always necessary if they have a good product, of course. <br> <br>Anyways, think 'fundraiser' more than 'playground'. It's first and foremost a fundraiser FOR a playground. <br> <br>\"What about the simplicity here: \" <br> <br>That's better, but still much more of an illustration than a logo. You need to distill that down much more. Consider sun, slide, flower. Try and combine those in more abstract/simplified forms. <br> <br>Also, you don't need to use kids handwriting. Too obvious. ;o) <br> <br>Finally, consider concepts like 'growth', 'nurture', 'empower', etc. <br> <br> <br> <br></p>"
    html_clean: "<p>\"Formal/refined...for a playground? Yes, one of the primary uses will be to solicit funds, but how do you make the leap to formal?\" <br> <br>Because you're asking for money. The first marks appeared to be targetted at kids. I assume you're asking money from adults. Perhaps 'formal' was the wrong term...maybe more 'adult' is what I'm going for. <br> <br>It can still be (and probably should be) fun, but it shouldn't be childish. <br> <br>Now that I've read the rest of the threads, I see others have said that better than I had. ;o) <br> <br>\" Why does their logo work so well?\" <br> <br>I don't think it does. It's fairly generic. The name is interesting, but, again, kind of vague. A good logo isn't always necessary if they have a good product, of course. <br> <br>Anyways, think 'fundraiser' more than 'playground'. It's first and foremost a fundraiser FOR a playground. <br> <br>\"What about the simplicity here: \" <br> <br>That's better, but still much more of an illustration than a logo. You need to distill that down much more. Consider sun, slide, flower. Try and combine those in more abstract/simplified forms. <br> <br>Also, you don't need to use kids handwriting. Too obvious. ;o) <br> <br>Finally, consider concepts like 'growth', 'nurture', 'empower', etc. <br> <br> <br> <br></p>"
