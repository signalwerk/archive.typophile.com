    html: <p>For starters, the success of a business is not a derivative of a great logo. I have seen many businesses with excellent visual identities fail; likewise, I have seen businesses with substandard identities succeed. Frankly, I highly doubt that Kaboom's logo is what has driven their success, it looks to me like a mediocre concept that is poorly executed. The tag line, however, is excellent, which leads me to believe that there might be some very talented marketing heads behind this success. <br> <br>Having said everything I've said, I have never had a project like this, thus, I've never done sufficient research; therefore, I may be speaking completely out of ignorance to how these foundations run. <br> <br>Aloha! <br>Scott</p>
