    html: <p>Is this on a playground sign? I was not here for the original critique. How do the top two .org's fit in? <br> <br>I like the middle right decal. You could put the child from the bottom right in the middle right version. <br>  <br>I prefer the dark green in the decal.  <br> <br>Too many kids on the letters. Can you pick one or two letters? It is a lot to look at. The trees are also distracting. I would limit their use also.  <br> <br>The renderings are jagged. I'd output them better. <br> <br> <br>Andrew <br></p>
