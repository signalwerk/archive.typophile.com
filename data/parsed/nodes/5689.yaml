    html: <p>What I would guess Darrel is alluding to, is that you are not trying to attract children (playful), you are trying to appeal to financial contributors (formal/professional). Whenever I contribute money to a cause (other than buying candybars from my neighbors children), I need to feel confident that the money is going to an organization that knows money and how to use it. This almost calls for a banklike look. <br> <br>Represent children/playgrounds, yes, but the purpose of this mark seems to be to promote contribution. Consider stability, professionalism, generocity and community first, then take a stab at the children/playgrounds. <br> <br>Technically, these marks look like very rough computer generated illustrations. Is that intentional? It doesn't seem appropriate IMO. <br> <br>Aloha! <br>Scott</p>
