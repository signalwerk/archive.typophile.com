    html: <p>" 'growth', 'nurture', 'empower', etc. look like in a logo? None come &gt; to mind." <br> <br>Brainstorm! <br> <br>For growth...flowers, plants, reaching, scaling, stretching, tall, birds-eye-view,  <br> <br>Nurture...mothers, nests, arms, hugs, groups, embracing, snug, etc. <br> <br>Just start throwing words out on paper. Try to write 100 different words that could be associated with playgrounds. Chance are, when finished, 95 of those concepts will be useless, but it's those 5 good ones you are looking for... <br> <br>I'll start...sand, shovel, kids, diapers, sandbox, slide, swing, play, fun, laughter, sky, birds, breeze, trees, leaves, plants, climbing, teamwork, friends, parents, strollers, smiles.........</p>
