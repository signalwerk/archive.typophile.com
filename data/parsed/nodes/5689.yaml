    html: <p>"'Consider stability, professionalism, generocity and community first, then take a stab at the children/playgrounds. '  <br> <br>This is the first consideration" <br> <br>Terrific first consideration. It now looks like you are trying to solicit corporate sponsorship rather than just get all the parents to donate a few bucks here and there. I'm wondering, will this logo just be used for the fundraising aspect of the project, or will it also carry on -perhaps as signage on the finished playground? If the later, I'd like to see you incorporate some for the playfulness of your earlier designs with this recent go-a-round. Maybe it's something as simple as the fern looking like it was drawn by a child using finger paints. Or maybe instead of a fern the icon could be a swing (or other such item) What is most important for this project "Fernbank" or "playground"? <br>Good work, keep going.</p>
