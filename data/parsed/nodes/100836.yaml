    <p><img src="/sites/default/files/old-images/eskorte1-2_3771.jpg"></p>
    <p>Eskorte is a hardworking Latin-Arabic type family with an uncomplicated, regular appearance that conveys a crisp, businesslike tone. Its compact range of styles has been designed for easy use by non-designers in offices of legal and academic institutions, and corporate environments. Eskorte supports Arabic, Farsi, Urdu, and over ninety languages using the Latin script.</p>
    <p>The various styles were designed together, resulting in a smooth, coherent style across the family. The italics take on livelier, more fluid forms that echo the design of the Arabic, allowing them to sit perfectly together, while the extrabold adds punch to official announcements and notices.</p>
    <p>The Arabic was designed in consultation with Titus Nemeth.<br>
    For more unformation visit our site: <a href="http://rosettatype.com/eskorte" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://rosettatype.com/eskorte</a></p>
    <p><strong>The introductory price of Eskorte Arabic is only 68 €/font!</strong></p>
