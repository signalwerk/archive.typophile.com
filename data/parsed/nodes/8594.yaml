    <div class="info">Submitted by <a href="/user/909" title="View user profile.">Thomas Phinney</a> : 11.Jan.2005 12.15am </div>
      <p>Pardon the cross-posting with some mailing lists, but.... <br> <br>Adobe has an IMMEDIATE opening for a font rasterizer tester. This is a middle-term contract position, preferably located in Seattle but San Jose is also possible. We want somebody with some real programming skills who also knows something about fonts, on both a technical and a visual level. <br> <br>Position Summary: White-box Quality Engineer in the Adobe CoreTechnology group developing test code for type rasterization technology implemented in C and C#. Design, develop, and deploy white box tests covering API usage, font rendering, and interaction within a larger test framework implemented in Microsoft .NET Framework, running under Windows XP. Review and report on test progress and test coverage, work closely with a small team of senior developers. Learn and deploy Core Technology QE tools and practices. Knowledge &amp; Skills Requires a BS in CS or related field and at least 3-5 years of industry experience with excellent coding skills and a passion for software quality. Strong software design skills. Ability to create and follow development plans and schedules. Good problem-solving abilities to quickly determine issues and provide solutions. Proven skills in working independently and collaboratively with software development and quality teams. Excellent written and verbal skills. Focused platform experience with Windows XP, .NET. Knowledge of font technology highly desirable, including Type1, CFF, TrueType, OpenType. Scripting skills: Perl, Python, JavaScript, or Visual Basic a plus. C/C++ experience a plus. <br> <br>If you're interested and available, I'll be doing some light screening, and passing your resume along to the hiring manager. <br> <br>T <br> <br>Thomas W. Phinney <br>Program Manager <br>Fonts &amp; Core Technologies <br>Adobe Systems</p>
