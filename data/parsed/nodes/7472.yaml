  html: <p>I am using Adobe Akzidenz Grotesque- light, roman, and bold, in a large format printed piece for a modern art museum. I have had a hard time pairing a serif face with the Akzidenz and wanted to see if anyone had any thoughts on this. <br> <br>I'll be using the serif face in well-leaded columns of body copy, with headlines, subheads and captions, etc. in Akzidenz. <br> <br>Usually I try to pair sans and serif faces of similar feel (color within blocks of text, similar letter constructions, etc.)- per Bringhurst's suggestions his Elements book.  <br> <br>Another option would be to lay the entire thing out in the sans serif face, but I want it to be super readable and classy at the same time. Not cold like some typical art museum publications.</p>
  html_clean: <p>I am using Adobe Akzidenz Grotesque- light, roman, and bold, in a large format printed piece for a modern art museum. I have had a hard time pairing a serif face with the Akzidenz and wanted to see if anyone had any thoughts on this. <br> <br>I'll be using the serif face in well-leaded columns of body copy, with headlines, subheads and captions, etc. in Akzidenz. <br> <br>Usually I try to pair sans and serif faces of similar feel (color within blocks of text, similar letter constructions, etc.)- per Bringhurst's suggestions his Elements book.  <br> <br>Another option would be to lay the entire thing out in the sans serif face, but I want it to be super readable and classy at the same time. Not cold like some typical art museum publications.</p>
