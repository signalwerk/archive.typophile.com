    <p>here's a fun one!<br>
    i'm getting ready to move into a new, snazzy, downtown apartment, and i'll be having a blast decorating it. I LOVE LETTERS and fonts. does anyone have any ideas about how to decorate with letters? i know it sounds silly, but i would love to have letters (beautiful ones, of course) on the walls or on the shelves or all over the place? hmmm.... the possibilities are endless.</p>
