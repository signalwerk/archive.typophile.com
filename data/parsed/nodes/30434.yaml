      <p>Have a look at this:<br>
      <a href="http://www.inscrire.com/index.php?navi=content&amp;npoint=1,0,0,0" title="http://www.inscrire.com/index.php?navi=content&amp;npoint=1,0,0,0">http://www.inscrire.com/index.php?navi=content&amp;npoint=1,0,0,0</a></p>
      <p>The station Concorde has the best 'typographic' decor I have seen in my life. I designed a friend's bathroom based on the same principle. Tiles with letters in different colours can be procured cheaply. I then found a text I wrote on her walls with the tiles. No space, no punctuation (hard to find): I used different colours for different words.</p>
      <p><a href="http://perso.orange.fr/reseau.nord-sud/Concorde-it.htm" title="http://perso.orange.fr/reseau.nord-sud/Concorde-it.htm">http://perso.orange.fr/reseau.nord-sud/Concorde-it.htm</a></p>
      <p>If what you want is to choose yor own type though, you can make images in Photoshop or else, of the letters/words you want, and get them printed and framed professionnally.</p>
