      <p>ooh! you could make some compositions on a computer, borrow a projector and project them onto your walls, then trace and paint them.</p>
      <p>this way you could try out lots of stuff and see more or less how it will look (projecting it) before you have to commit (painting it).</p>
      <p>it would be cool to see some pictures when you're done.</p>
      <p>jarrod</p>
