    date: 2007-01-08T09:12:00
    date_raw: 8 Jan 2007 — 9:12am
    votes: null
    html: <p>I googled using terms such as "wall hanging letters," "furniture letters," "decorating letters," "decorative letters," "wood letters," "plastic letters," "neon letters," "stuffed letters," and "plush letters" and got a lot of potentially useful results. Also, most hardware stores (e.g., Ace, OSH, Home Depot, Lowes) carry wood, metal, or decal letters meant to be used for house addresses that you could adapt to other uses. Unicahome.com has some glow-in-the-dark letters and numbers that look like building blocks.</p>
