    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Parallel-Histories_6425.gif"></div><p></p>
    <p>Based on the handwriting, possibly, of Juan de Yciar of Spain, 1600 CE.</p>
    <p>There are about 100 ligatures, give or take, that work right now.</p>
    <p>What I don't know how to do is implement contextual alternates/swashes/titling alternates in a way that doesn't make Fontlab explode :) I have multiple alternates, starting swashes and ending swashes, but I don't know how to make them work.</p>
    <p>I have them sitting there in the file listed as:<br>
    <code>e_z.alt1</code><br>
    <code>e_z.alt2</code><br>
    <code>e_z.swsh</code><br>
    <code>e_z.swsh.alt1</code></p>
    <p>How do you get an alternate of a swashed ligature? (This e_z swash has a tail that goes up, but this one has a tail that goes down...)</p>
    <p>I think I would like it to work with dligs etc., so that the variations are still selectable via the Opentype panel.</p>
    <p>Any suggestions?</p>
