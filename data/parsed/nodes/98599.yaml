      <p>The German publishing house Zeit uses innumerable fonts renamed to "Zeit + original font name", e.g.</p>
      <p>ZeitGaramondPro-Regular<br>
      ZeitGaramondPro-Bold<br>
      ZeitGaramondPro-BoldItalic</p>
      <p>ZeitTiemann-Normal<br>
      ZeitTiemann-Kursiv<br>
      ZeitTiemann-Leicht</p>
      <p>ZeitThesisSans<br>
      ZeitNewsGothicMT</p>
      <p>etc. etc. etc.</p>
