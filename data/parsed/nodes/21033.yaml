  html: <p>I have been considering doing a face inspired by a stencil face I have seen on the wings of Airbus &amp; Boeing aircraft. I did a search on Myfonts.com to see if there was anything that matched my intent too closely already &amp; I didn't see anything to put me off yet. However, myfonts.com isn't utterly and competely encyclopedic. Does anybody have any suggestions about fonts I aught to consider before jumping in? Or even any source material they think I should consider? Thanks!</p>
