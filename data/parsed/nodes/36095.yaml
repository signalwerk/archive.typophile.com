    <p>Hi All, </p>
    <p>I started a series of short interviews with type designers on my design studio's website. </p>
    <p>We're based in Tokyo, and the primary goal of the articles is to introduce some contemporary western typefaces and designers to Japanese designers who may have a hard time finding information about these typefaces in their language. All interviews are available in Japanese and English.</p>
    <p>Here are the first four in the series:</p>
    <p><a class="freelinking external" href="http://www.aqworks.com/2007/08/14/facetime-4-type-designer-chester-jenkins-on-galaxie-polaris/" rel="nofollow">Chester Jenkins on Galaxie Polaris</a><br>
    <a class="freelinking external" href="http://www.aqworks.com/2007/07/31/facetime-3-type-designer-jarno-lukkarila-on-xtra-sans/" rel="nofollow">Jarno Lukkarila on Xtra Sans</a><br>
    <a class="freelinking external" href="http://www.aqworks.com/2007/07/28/facetime-2-type-designer-jeremy-tankard-on-bliss/" rel="nofollow">Jeremy Tankard on Bliss</a><br>
    <a class="freelinking external" href="http://www.aqworks.com/2007/07/23/facetime-1-type-designer-eric-olson-on-klavika/" rel="nofollow">Eric Olson on Klavika</a></p>
    <p>We have two more interviews on deck for this month, so enjoy, and please send me any feedback you may have. </p>
    <p>Chris</p>
