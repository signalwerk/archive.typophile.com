      <p>I really like this paragraph from the Tankard interview:<br>
      &gt;<strong>How important is it for designers to understand typographic history when choosing to use Bliss? If it “just works” for a project, is that also OK?</strong></p>
      <p>&gt;The history element is the way I work. I, like many designers, can not design in a vacuum. I believe that we learn from the past in order to design for the future whilst working in the present. The history of type is fascinating and is constantly evolving. This is all wrapped up in my appreciation of type and my day to day work with type. It doesn’t necessarily matter that a designer using Bliss (or another other type) should know its history, but as it is part of its design, it’s story may as well be passed on. Sometimes the history of a type (its heritage if you like) can be of great benefit in convincing a client that it is the right type for them to invest in and use.</p>
      <p>I like that line of reasoning.</p>
