    html: |-
      <p>Thanks everyone for the feedback, especially the broken link tip.</p>
      <p>About the 'lightweight' or short length of the interviews. There are two reasons for this. </p>
      <p>1. My target audience for these is the average Japanese graphic designer, who is coming to the site with a lot less knowledge of the history, terminology, and state of the art of western typeface design. </p>
      <p>The shorter length and mostly simple questions allows these readers to pick up a few points of interest about each face, learn a few things about type design in general, before moving on to other sites to find out more about both. </p>
      <p>2. My experience interviewing designers for magazines has been that they are often very busy people with erratic schedules. I wanted the interviews to be something that they could complete in half an hour, perhaps instead of reading RSS with their morning coffee. </p>
      <p>The result, many were very busy with the rest of their job, but almost everyone I contacted answered my questions thoughtfully within a week or so. A few generous designers (like Chester) invited follow-ups, which is why some are longer than others.</p>
      <p>Our website is not exactly the New York Times, so I appreciate that they took the time they did. </p>
      <p>---</p>
      <p>On another note, since you graciously offered, I'd like to ask a bit of advice:</p>
      <p>1. I'm going to stop this series at six designers. But if I did it again in 3 months, who else would you like to see interviewed?</p>
      <p>2. I'm thinking of doing a similar series on Japanese contemporary typefaces and designers. Would this interest you? What types of things would you want to know about them?</p>
