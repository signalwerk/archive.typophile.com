    <p>After almost seven years of putting it off the time has finally come to assemble a portfolio and stationary etc. Over the last few months I've been looking at a number of typefaces to use for 'branding' myself so to speak and have almost certainly settled on Akzidenz Grotesk Condensed Light and Regular. </p>
    <p>The things I love –</p>
    <li>The vertical sides to the C, D, G, O and Q characters.</li>
    <li>It's subtly square–ish appearance (for example the bowl on the P and R characters).</li>
    <li>The straight diagonal leg of the R character.</li>
    <li>It's history and heritage.</li>
    <li>I love condensed fonts.</li>
    <li>It is very utilitarian and simple.</li>
    <ul>
    <p>The things I do not love –</p>
    <ul>
    <li>The inconsistencies between weights – between light/regular and medium upwards, some of the characters change completely (B, J, K, Q, R at first glance)</li>
    <li>For a personal project it's pretty expensive (You can't buy individual weights).</li>
    </ul>
    <p>With this in mind, I just want to make sure I'm not overlooking any alternatives. I've looked at Tungsten and Knockout from H+FJ, Univers Condensed, DIN, Trump Gothic by Canada Type – all of which have some aspects that I love, but there is usually something I really don't like also. </p>
    <p>Any suggestions?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/akzidenz_6225.png"></div><p></p>
