    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 18.May.2007 7.18am </div>
      <p>Howdy Friends!</p>
    <p>Well, it has been very busy at the Font Diner these days and we’re pleased to welcome the return of Summer with Rickles!</p>
    <p>Like a little brother tuggin’ at your pant leg for another yummy chocolate chip cookie, this playful FREE script will melt your heart with sugar sweet swirly frosted fun as you bask in the warmth of the warming sun! Of course it’s available at our one and only Vend-O-Matic!</p>
    <p>Get it here: <a href="http://www.fontdiner.com/silver.html" title="http://www.fontdiner.com/silver.html">http://www.fontdiner.com/silver.html</a></p>
    <p>If that weren’t enough I know you’re all wondering just what have we been up to these days?</p>
    <p>Well, we’ve actually been working on a ton of great new fonts you can only get from the Font Bros!</p>
    <p>The first is perhaps the finest Bamboo font ever created! It’s called Bamboozle and we created it together with famous tiki artist and sculptor Squid! It looks like real bamboo because it’s made from real bamboo! Really! Check out Bamboozle here: <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=SIDE-BAMB" title="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=SIDE-BAMB">http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=SIDE-BAMB</a></p>
    <p>A little tropical for you blood?</p>
    <p>Well, we know you handwritten script fans are gonna love the new fonts we created with Crystal Kluge of the Tart Workshop! We joined up with Minnesota’s finest calligrapher to create some of the prettiest script fonts in the Midwest! Check ’em out at: <a href="http://www.fontbros.com/tartworkshop.php" title="http://www.fontbros.com/tartworkshop.php">http://www.fontbros.com/tartworkshop.php</a></p>
    <p>So, what ELSE have you been up to then?</p>
    <p>We’re glad you asked . . .</p>
    <p>After two years of exhaustive research, the Font Diner has acquired the Filmotype photo film alphabet collection and will begin digitizing and releasing these wonderful gems of 1950s lettering as digital fonts in the coming months!</p>
    <p>Originally sold in the 1950s, the Filmotype was a simple manually operated photo typesetting machine (the iMac of the 1950s) and it used 2-inch filmstrips with a library of over 500 amazing display alphabets so the user could set headlines on photo paper or film. Filmotype eventually went on to become Alphatype until the Mac came along in 1984 and POOF! No more photo typesetting!</p>
    <p>We’re pleased as punch and we can’t wait to bring more of the finest retro fonts to your computer! No need to hold back, come stop by and stay a spell!</p>
    <p><a href="http://www.fontdiner.com" title="http://www.fontdiner.com">http://www.fontdiner.com</a></p>
    <p>Warmly,<br>
    Stuart :D</p>
