    <p>Hey everyone. I’ve been reading Typophile for awhile now and finally decided to post my own work up for critique.</p>
    <p>I’m working on a logo for a company called TMA. They are a tool sharpening company for mostly custom/specialized tools and serve clients like Lockheed Martin. Their preferred direction was something simple, more modern, and clean looking so this is what I came up with. I tried to suggest a drill bit-like shape with the letterforms while keeping the elements “sharp” looking. Please let me know you thoughts. Logo design is probably where I’m weakest right now as a designer so any helpful criticism is welcome. Thanks!</p>
    <p></p><div class="imageWrap"><img src="/files/tma_5003.jpg"></div><p></p>
